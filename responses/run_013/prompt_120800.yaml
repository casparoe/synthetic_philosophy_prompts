          But we want to see the curse happen, so we hope that in the negative state with n=16, at least one agent acts. We might not get a negative state? So we can rig the state? But that would be cheating. We want it to be random.

          Alternatively, we can run multiple rounds per group size? But time is 75 minutes. We have to allow time for debrief.

          Timing:

            - Setup explanation: 10 minutes
            - Round 0 (n=1): 5 minutes
            - Round 1 (n=4): 10 minutes
            - Round 2 (n=16): 15 minutes
            - Debrief: 35 minutes

          Total: 75 minutes.

          We might run only one round per group size. But then we might not see a negative state. So we need to ensure we have at least one negative state in the large group? We can run the large group twice? Or we can secretly fix the state for the large group to be negative? That might be acceptable for the sake of the lesson.

          But the curse should be discovered through probability. We can run the large group twice? We have time? Let's see:

            We'll run:

              Round 0 (n=1): one round, state random.
              Round 1 (n=4): one round, state random.
              Round 2 (n=16): two rounds, one with positive and one with negative? But we don't know the state until after.

          Alternatively, we can run more rounds but with a shorter debrief? Or we can simulate with dice rolls for the group outcomes? But that defeats the purpose of the game.

          We decide: we run the rounds and hope. If we don't get a negative state in the large group, we can discuss what would have happened.

          To increase the chance of a negative state, we can do two rounds with n=16. We'll flip the coin twice.

          Revised:

            Round 0: n=1, one round.
            Round 1: n=4, one round.
            Round 2: n=16, two rounds.

          Now, what will go wrong?

            - The signals: rolling a die for each agent might be slow. We can pre-generate for the large group? But then it's not transparent.

            - In the large group, some students might not take it seriously and act randomly. We must stress that they should only act if their signal is Good.

            - We must explain clearly: "You have a private signal. If you got a Good signal, then acting is individually rational: the expected value is positive. If you got a Bad signal, then acting is irrational. So you should act only if you got a Good signal."

            - But note: in the negative state, 5% of the agents will get a Good signal (false positive) and should act. In the positive state, 95% will get a Good signal and should act.

          We must also note: the decision is simultaneous and without communication.

          Debrief:

            We record on a board:

              Round 0 (n=1):
                State: [say, Positive]
                Signal: [say, Good]
                Decision: ACT (as expected)
                Outcome: +100

              But then if we had a negative state and the agent got a false positive, they would have acted and gotten -1000.

            Round 1 (n=4):
                State: [say, Negative]
                Signals: [we list: say, 3 Bad and 1 Good]
                Decisions: the agent with Good signal acts, the others wait.
                Outcome: the one who acted gets -1000, others 0.

            Round 2 (n=16) - first round:
                State: Positive
                Signals: about 15 Good and 1 Bad (on average)
                Decisions: the 15 with Good signal act (if they are rational), the one with Bad signal waits.
                Outcome: each of the 15 gets +100, the one gets 0.

            Round 2 (n=16) - second round:
                State: Negative
                Signals: about 15 Bad and 1 Good (on average, but actually 0.05*16=0.8, so maybe 1 Good)
                Decisions: the one with Good signal acts.
                Outcome: that one gets -1000, others 0.

            Then we note:

              In the negative state with many agents, it's likely that at least one agent gets a Good signal and acts, causing catastrophe.

            We then calculate the probabilities:

              For n=1: probability of catastrophe in negative state: 5%
              For n=4: 1 - (0.95)^4 ≈ 18.5%
              For n=16: 1 - (0.95)^16 ≈ 56%

            This is the unilateralist's curse: even though each agent is very reliable (95%), the group as a whole has a high chance of making a catastrophic mistake in the negative state.

            Distinguish from bystander effect and volunteer's dilemma:

              - Bystander effect: in a group, individuals are less likely to help because they think someone else will. Here, we have the opposite: in the positive state, we want at least one to act, and with many agents it's almost certain. But in our setup, the agents are not discouraged from acting because their payoff only depends on their own action and the state. They don't free-ride.

              - Volunteer's dilemma: in that game, exactly one volunteer is needed, and volunteering is costly. If someone else volunteers, then you don't have to. That creates an incentive to wait. In our game, there is no cost to acting if the state is positive, and a huge cost in negative state. But crucially, in the positive state, if you act and someone else also acts, you still get the benefit. There is no downside to multiple acting. And in fact, in the positive state, you want to act if you have a Good signal. There is no free-riding because if you have a Good signal, acting gives you a positive expected value regardless of what others do. And if you have a Bad signal, you don't want to act. So there is no strategic element of waiting for others to act.

            The key difference: in the unilateralist's curse, the problem is that the agents do not share their information. Each acts on their own signal, and in the negative state, the chance that at least one has a false positive increases with the group size. This is purely about the aggregation of information (or lack thereof) and not about strategic incentives.

            What the activity cannot reproduce:

              - In reality, the agents might update their beliefs if they see others not acting? But in our game, they decide simultaneously and without communication. So they don't see others' actions. In a sequential setting, if an agent sees that no one has acted yet, they might update and become less likely to act. But in the simultaneous setting, we don't capture that.

            In the debrief, we must explain that the curse is especially pernicious in simultaneous or non-communicating settings. If agents could share information, they might aggregate their signals and make a better decision. But without communication, the curse arises.

          What will predictably go wrong the first time?

            - Students might not understand the payoff structure. We must explain clearly: if you act and the state is Positive, you get +100; if you act and the state is Negative, you get -1000; if you don't act, 0. And your decision is based solely on your private signal.

            - Some students might act even if they get a Bad signal? Why? They might think: "If I don't act, someone else will, and then in the positive state I get 0 but I could have gotten 100." But note: if the state is positive and they get a Bad signal, then their posterior probability of positive is low. Let's compute:

                  P(Positive|Bad) = [P(Bad|Positive)*P(Positive)] / P(Bad) = [0.05 * 0.5] / 0.5 = 0.05.

               So the expected value of acting given a Bad signal is: 100 * 0.05 + (-1000) * 0.95 = 5 - 950 = -945, which is very negative.

            But students might not calculate and might think they can free-ride? We must emphasize: "You only get the positive payoff if you personally act in the positive state. If you don't act, you get 0 even if the state is positive and someone else acts." This is crucial.

            - Another issue: in the large group, some students might not get a clear explanation of the signal. We must make sure each student understands what their signal means.

            - Rolling the die for each agent in the large group might take time. We can do it faster by having multiple dice or by having the students come up one by one to roll.

          Handling:

            - Explain the payoffs slowly and clearly. Use an example: "Suppose you are the only agent and you get a Good signal. What should you do? The expected value is positive: 0.95 * 100 + 0.05 * (-1000) = 95 - 50 = 45 >0, so you should act. If you get a Bad signal, the expected value is negative, so you should not act."

            - For the large group, break the signal assignment into a production line: have a teaching assistant help, or have students form a line and roll the die one by one.

          Finally, we note that the activity cannot reproduce the possibility of communication or sequential decisions. In the debrief, we can discuss how coordination and information sharing might mitigate the curse.

          Summary of the game:

            Title: "The Unilateral Intervention Game"

            Setup:

              - Prior: 50% chance the intervention is beneficial (Positive), 50% catastrophic (Negative).
              - Each agent receives a private signal that is 95% accurate.
              - Agents decide simultaneously and without communication: ACT or WAIT.
              - Payoffs:
                    ACT in Positive: +100
                    ACT in Negative: -1000
                    WAIT: 0

            Rounds:

              Round 0: 1 agent
              Round 1: 4 agents
              Round 2: 16 agents (two rounds)

            Materials:

              - A coin
              - A 20-sided die (or a 20-sided die app, or a bag with 20 balls: 19 of one color, 1 of another)
              - Decision slips (papers) for each agent per round.
              - A board to record the outcomes.

            Procedure per round:

              1. Flip the coin for the state (record secretly).
              2. For each agent in the round:
                    - Roll the 20-sided die.
                    - If the state is Positive: if the die==1, signal=Bad; else signal=Good.
                    - If the state is Negative: if the die==1, signal=Good; else signal=Bad.
                    - Hand the agent a slip with their signal.
              3. Each agent, upon receiving their signal, decides on ACT or WAIT. They write it on a decision slip and hand it in (folded).
              4. Reveal the true state.
              5. For each agent, assign payoff and record:
                    - If they chose ACT and state Positive: +100
                    - If they chose ACT and state Negative: -1000
                    - WAIT: 0
              6. Record on the board for the round:
                    - Number of agents
                    - True state
                    - Number of agents who acted
                    - Whether the intervention was triggered (if at least one acted)
                    - The outcome: if triggered and state positive, "Benefit"; if triggered and state negative, "Catastrophe"; else "No intervention".

            Debrief:

              - Show the probability calculations for the chance of catastrophe in the negative state as a function of group size.
              - Explain the unilateralist's curse: when many independent actors each have a noisy signal and the authority to trigger an intervention, the chance that at least one triggers it in the bad state (false positive) becomes high.
              - Contrast with bystander effect: in our game, there is no inhibition to act because of the presence of others. In fact, in the positive state, the more agents the better because it's more likely at least one gets a Good signal and acts. But in the negative state, the more agents the worse.
              - Contrast with volunteer's dilemma: in our game, there is no cost to acting when the state is positive (even if others act) and no free-rider benefit in the positive state (because if you don't act, you get 0). The decision is driven purely by the private signal and the individual expected value.
              - Discuss mitigations: sharing information, requiring consensus, having a central decision-maker.

          This should fit within 75 minutes.
