  ### Game Design: The Unilateralist's Curse Simulation

  #### **Learning Goal**
  Students experience how individual rational actions (based on private noisy signals) can lead to collective catastrophe as group size increases, due to the **unilateralist's curse**. Distinguish from:
  - **Bystander effect**: Reluctance to act due to diffusion of responsibility.
  - **Volunteer's dilemma**: Strategic hesitation when someone else might bear the cost of acting.

  ---

  ### **Game Setup**
  **Core Mechanics**  
  - **True State**: Hidden each round. 50% chance "Positive" (intervention beneficial), 50% "Negative" (intervention catastrophic).  
  - **Signal Reliability**: 95% accurate (calibrated for individual rationality).  
  - **Payoffs**:
    - Act in Positive state: **+100 points**  
    - Act in Negative state: **−1000 points**  
    - Wait: **0 points**  
  - **Rules**:  
    1. Each agent receives a **private signal** (Good/Bad).  
    2. All decide **simultaneously** to Act or Wait (no communication).  
    3. **Only one Act needed** to trigger intervention (but all who Act receive individual payoffs).  
    4. True state revealed after decisions.  

  **Why This Works**  
  - **Individual Rationality**:  
    - With Good signal:  
      - *P(Positive)* = 0.95 → *EV(Act)* = (0.95 × 100) + (0.05 × −1000) = **+45** (rational to Act).  
    - With Bad signal:  
      - *P(Positive)* = 0.05 → *EV(Act)* = (0.05 × 100) + (0.95 × −1000) = **−945** (rational to Wait).  
  - **Collective Risk**:  
    - In Negative state, *P(false positive)* = 5% per agent.  
    - *P(at least one false positive)* = 1 − (0.95)^n → **56% for n=16** vs. **5% for n=1**.  

  ---

  ### **Materials & Timing**  
  - **Materials**:  
    - Coin (to flip for true state), 20-sided die (or random number generator for signals).  
    - Private signal slips (Good/Bad), decision slips (Act/Wait).  
    - Whiteboard to record:  
      | Round | n | True State | # Acted | Outcome (Benefit/Catastrophe/None) |  
  - **Timing (75 min total)**:  
    1. **Introduction (10 min)**: Explain rules, payoffs, and privacy. Emphasize:  
       - "Act only if your signal makes it rational. Do not coordinate."  
       - "Your payoff depends **only on your action and the true state**."  
    2. **Rounds (40 min)**:  
       - **Baseline: n=1** (1 student, 1 round).  
       - **Group 1: n=4** (4 students, 1 round).  
       - **Group 2: n=16** (all students, 2 rounds).  
    3. **Debrief (25 min)**: Link outcomes to the curse, contrast with other effects.  

  ---

  ### **Running a Round**  
  1. **Flip coin** for true state (Heads: Positive, Tails: Negative). *Keep hidden*.  
  2. **Assign signals**:  
     - For each agent, roll 20-sided die:  
       - *Positive state*: 1 = Bad, 2–20 = Good.  
       - *Negative state*: 1 = Good, 2–20 = Bad.  
     - Hand private signal slips to agents.  
  3. **Decisions**: Agents write "Act" or "Wait" on decision slips (folded/hidden).  
  4. **Reveal**:  
     - Collect slips, count # who Acted.  
     - Reveal true state and payoffs.  
     - Record outcome on board:  
       - Benefit: ≥1 Acted in Positive state.  
       - Catastrophe: ≥1 Acted in Negative state.  
       - None: No one Acted.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Students Act on Bad signals (e.g., "I’ll let others handle it").  
     - **Why**: Misunderstanding payoffs or confusing with volunteer's dilemma.  
     - **Fix**: Reiterate pre-round:  
       > "Your payoff depends SOLELY on your action and the state. If you get a Bad signal, acting has negative EV. If you get a Good signal, acting has positive EV."  
  2. **Problem**: Slow signal assignment for n=16.  
     - **Fix**: Use random number generator (e.g., Excel) to pre-generate signals.  
  3. **Problem**: True state consistently Positive/Negative by chance.  
     - **Fix**: Rig the coin flips post-facto if needed (e.g., ensure 1 Negative round for n=16).  

  ---

  ### **Debrief Script**  
  **Recorded Outcomes Example**:  
  | Round | n   | True State | # Acted | Outcome       |  
  |-------|-----|------------|---------|---------------|  
  | 1     | 1   | Positive   | 1       | Benefit       |  
  | 2     | 4   | Negative   | 1       | **Catastrophe** |  
  | 3     | 16  | Positive   | 15      | Benefit       |  
  | 4     | 16  | Negative   | 1       | **Catastrophe** |  

  **Key Discussion**:  
  1. **Unilateralist's Curse**:  
     - "In Round 2 (n=4), one agent caused catastrophe. Why did they Act?"  
       → *They had a false positive (Good signal in Negative state).*  
     - "Why did catastrophe occur in 2 of 4 rounds? Calculate: *P(false positive)* = 5% per agent, but *P(any false positive)* = 56% for n=16."  
     - **Insight**: "Individual reliability (95%) ≠ collective safety. More actors ↑ risk of a mistake."  

  2. **Contrast with Bystander Effect**:  
     - "Did anyone Wait with a Good signal, hoping others would Act?"  
       → *Unlikely (Acting on Good has +EV).*  
     - "Bystander effect is *under*-action due to responsibility diffusion. Here, we saw *over*-action (false positives)."  

  3. **Contrast with Volunteer's Dilemma**:  
     - "Did you avoid Acting to ‘free-ride’ on others?"  
       → *No! If you have a Good signal, Acting helps you personally.*  
     - "Volunteer's dilemma has a *cost* to acting (even in good states). Here, Acting in Positive state is rewarding."  

  **Limitation of the Activity**:  
  - **No Belief Updating**: IRL, seeing others hesitate might reduce your confidence in acting. But in this game, decisions are simultaneous.  
    → "The curse is strongest when agents can’t observe others’ uncertainty."  

  **Takeaway**:  
  > "The curse arises from **isolated information** + **unilateral power**. Mitigations: Share signals, require consensus, or centralize decisions."  

  ---

  This design ensures students *feel* the curse through gameplay, with minimal lecturing. The payoff/signal calibration (95% reliability, +100/−1000) makes individual rationality clear while maximizing collective risk in larger groups. Run tightly, and debrief using the board records to anchor abstract concepts in lived experience.
