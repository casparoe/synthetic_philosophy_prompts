  Below is a decision tree for your precommitment reading group, designed to avoid the paternalism axis and instead branch on the distinctions you care about. The tree starts from the agreed-upon premise that **"sometimes it's rational to arrange things now so that a later you can't easily undo them."** Each branch node is a yes/no question phrased as a concrete case or claim, answerable without knowing the "label" of the resulting position. Leaves are named positions (where they exist) or "unnamed," with a note on their most awkward commitment. I've incorporated your specified cases (mast, Antabuse, advance directive, entrenchment clause) and distinctions (agent identity, binding force, device type, rationality, generational binding).

  ---

  ### **Decision Tree: The Structure of Precommitment**  
  *(Start at the root; answer each question to reach a leaf position)*

  #### **Root**: All accept that "sometimes it's rational to arrange things now so that a later you can't easily undo them."

  1. **Q1 (Agent Identity - Dementia Case)**:  
     *In the case of an advance directive: if a dementia patient sets a "do not resuscitate" order while lucid, but later (with severe dementia) pleads for treatment, are the "precommitter" and "bound entity" the same agent?*  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q8. *(They are distinct agents; e.g., dementia splits identity)*

  ---

  ### **Branch 1: Same Agent** (Follows "Yes" to Q1)

  2. **Q2 (Rationality Scope)**:  
     *Could a perfectly rational, unified agent (no akrasia) ever benefit from precommitment? (E.g., Ulysses tying himself not from weakness, but to save time/energy in resisting temptation.)*  
     - **Yes** → Go to Q3.  
     - **No** → Go to Q4. *(Precommitment only for akratic/divided agents)*

  3. **Q3 (Binding Force Source - Mast Case)**:  
     *When Ulysses is tied to the mast and begs to be released, is the binding force of the ropes rooted in his earlier self's will (his past decision), not his later self's pleas or the ropes themselves?*  
     - **Yes** → **Position: Authoritarian Precommitment**  
       - *Awkward commitment*: The past self "bosses" the present self unconditionally—even if circumstances change (e.g., Sirens offer lifesaving info). Ignores present self's new interests.  
     - **No** → Go to Q4.

  4. **Q4 (Binding Force Source - Will vs. Mechanism)**:  
     *Does the binding force come solely from the later self's hypothetical rational will? (E.g., Ulysses bound because his later self, if rational, would endorse it—not because ropes exist.)*  
     - **Yes** → **Position: Hypothetical Endorsement**  
       - *Awkward commitment*: Requires judging what the "rational" will is, especially when identity is fluid (e.g., dementia patient's protests are "irrational," so ignored).  
     - **No** → Go to Q5. *(Binding force is external, not about wills)*

  5. **Q5 (Device Type - Antabuse Case)**:  
     *Must a precommitment device make the act impossible (e.g., Antabuse causing sickness if you drink), not just costly (e.g., a fine for drinking)?*  
     - **Yes** → **Position: Mechanical Precommitment**  
       - *Awkward commitment*: If acts are merely costly (not impossible), it's not "true" precommitment—undermines devices like fines or reputation.  
     - **No** → **Position: Costly Precommitment**  
       - *Awkward commitment*: Costly devices allow "rational" defection (e.g., paying the fine to drink), so may fail against strong urges.  

  ---

  ### **Branch 2: Distinct Agents** (Follows "No" to Q1)

  6. **Q6 (Generational Binding - Entrenchment Case)**:  
     *Is an entrenchment clause (e.g., a constitution requiring supermajorities to amend) fundamentally the same as Ulysses' ropes? (i.e., Is society one "agent" binding its future self?)*  
     - **Yes** → Go to Q7. *(It's still "self-binding," just scaled up)*  
     - **No** → Go to Q8. *(It's one agent/generation binding another)*

  7. **Q7 (Authority Source - Entrenchment Case)**:  
     *Does the earlier society's authority to bind the later one come from its superior knowledge/will (e.g., founders knew best), not the later society's consent?*  
     - **Yes** → **Position: Foundational Authority**  
       - *Awkward commitment*: Later society cannot self-correct if founders were wrong (e.g., entrenched clause causes harm).  
     - **No** → **Position: Democratic Continuity**  
       - *Awkward commitment*: Assumes a unified "people" over time—ignores dissent or changing demographics.  

  8. **Q8 (Authority Justification - Protest Case)**:  
     *Can the earlier agent bind the later one without the later agent's consent, even hypothetical? (E.g., dementia patient's directive enforced over protests.)*  
     - **Yes** → Go to Q9.  
     - **No** → **Position: Consent-Based Binding**  
       - *Awkward commitment*: If later agent doesn't consent (e.g., dementia patient protests), precommitment dissolves—weak against manipulation.  

  9. **Q9 (Binding Force Source - External Mechanism)**:  
     *Is the binding force purely from the external mechanism? (e.g., The ropes hold Ulysses; Antabuse causes sickness; the constitution's amendment rule is hard.)*  
     - **Yes** → **Position: Mechanism-Based Enforcement**  
       - *Awkward commitment*: Reduces precommitment to physics/engineering—no normative "why" for why it *should* bind.  
     - **No** → **Unnamed: Hybrid Authority**  
       - *Awkward commitment*: Unclear why distinct agents are bound if not by mechanism, consent, or authority. *Status: Unexplored*.  

  ---

  ### **Key Notes on the Tree**
  - **Where distinctions collapse**: Positions like **Authoritarian Precommitment** (from Q3) and **Foundational Authority** (from Q7) are similar in granting the "earlier" entity supremacy. They could be merged if authority isn't meaningfully different for individuals vs. groups.  
  - **Empty slots**:  
    - *Branch 1, after Q4*: No named position rejects *both* wills and mechanisms. *Status: Incoherent* (binding force must come from somewhere).  
    - *Branch 2, Hybrid Authority* (Q9 "No"): No clear real-world position. *Status: Unexplored*.  
  - **Engineering vs. philosophy**: The device-type split (Q5) *does* track a real disagreement: mechanical devices (impossible acts) imply external force solves akrasia; costly devices require ongoing rationality.  
  - **Constitutions vs. ropes**: The tree forks on generational binding (Q6), treating constitutions as distinct if society isn't one "agent."  

  This tree forces debates onto your specified distinctions using concrete cases. For your session, focus on why participants answer Q1, Q6, or Q3 differently—these expose the deepest rifts (agent identity, generational binding, authority).
