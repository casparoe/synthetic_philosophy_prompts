prompt: |-
  I have recently moved to a city whose everyday conventions are not mine, and a question I had always taken to be idle has become uncomfortably practical: which of the small rules of daily life — how one queues, when one tips, whether one waits at an empty crossing — are genuine moral obligations, and which of them bind a newcomer who has never learned them? I have been asked to lead a sixty-minute session on this for an adult evening class in philosophy. The students are intelligent non-specialists with strong and largely unexamined opinions, and several of them are themselves recent arrivals. I do not want the answer to the question; I want a plan for teaching it.

  Set out the order in which the components must be introduced, and why each depends on what precedes it. My own rough sequence is: first, that some requirements are merely conventional; then, that a convention can nevertheless be obligatory; then, and only then, the visitor problem. Tell me whether that order is sound, where it breaks, and what has to be added before the visitor question can even be posed.

  I am inclined to build the session on a single case: a visitor who joins a long, patient queue at a bakery and, reaching the counter, does not tip, in a city where tipping is expected and where the queue is a custom rather than a rule. I suspect the case does too much at once, running the locals-and-visitors question together with a different question about what kind of convention each practice is. Say whether it should carry the session; if not, propose the case that should, and specify what it must have and what it must lack.

  I want to try out a distinction of my own, and would like the plan either to use it or to tell me where it distorts the material: conventions whose point is coordination — a queue, where any one rule will do provided everyone knows it — against conventions whose point is expression or signalling, such as a tip, which says something about the giver and is illegible to anyone who has not learned to read it. I am not confident that the moral status of the two is the same, and I would like the session to make the students feel the difference.

  Then give me the misconceptions the students will bring or form — I expect 'if it is only a convention, it cannot bind anyone' and 'if it is illegal it is immoral, and if it is legal it is permitted' — the point in the sequence at which each should be headed off, and which of them cannot be headed off at all and ought instead to be left standing as a genuine disagreement.

  Finish with one question I can put to them at the end that would show whether they have grasped the structure of the problem rather than merely settled on an opinion, and with what I should openly refuse to cover in the time available. Please write your answer in British English.
reasoning: |-
  Hmm, the user is a philosophy educator preparing a session on the moral obligations of social conventions for newcomers. They've moved to a new city and are grappling with this personally, which adds depth to their teaching approach. 

  The core challenge is structural: how to sequence complex philosophical concepts for non-specialists in 60 minutes. Their proposed sequence (conventionality → potential obligatoriness → visitor application) is logical but risks oversimplification. The tipping/queueing case they suggest conflates two key dimensions: coordination vs expressive conventions, and local/visitor dynamics. 

  I notice three layers to address: 
  First, pedagogical scaffolding - must distinguish descriptive conventions from normative obligations early on. Students will likely conflate legality/morality or assume conventions lack moral force. These misconceptions need preemptive addressing during the conventionality segment. 

  Second, their personal distinction between coordination (queues) and expressive (tipping) conventions is valuable but needs careful handling. It shouldn't be front-loaded; rather, emerge organically when comparing cases. A better anchor case would be something purely coordinative like escalator standing side, contrasted later with expressive gestures. 

  Third, timing constraints demand ruthless prioritization. The visitor question can't be properly broached until after establishing that some conventions carry moral weight. Must explicitly exclude cultural relativism debates to stay focused. 

  For misconceptions: The "conventions can't bind" error must be dismantled when discussing social trust. The legality/morality confusion requires immediate correction during initial examples. But the expressiveness-coordination distinction's moral implications should remain an open question - that's where the real philosophical tension lies. 

  The closing question should test structural understanding: "Could there be a convention so arbitrary that violating it as a newcomer causes no moral harm?" This probes their grasp of the conditional nature of conventional obligations. 

  Ultimately their insight about convention types is sound but needs delayed introduction. The revised sequence should be: 
  1) Convention identification (descriptive) 
  2) Moral sources (harm/trust/fairness) 
  3) Coordination vs expression cases 
  4) Visitor application 
  ...with their distinction appearing at stage 3 as comparative lens.
answer: |-
  Here is a structured 60-minute session plan addressing your requirements, using British English:

  **Core Sequence & Justification:**
  1.  **The Nature of Conventions (10 mins):**
      *   **What:** Define "social convention" (a shared, often tacit, understanding governing behaviour in specific contexts, sustained by mutual expectations). Use unambiguous examples: *driving on the left/right, queuing format, standard greeting phrases, escalator standing side*.
      *   **Why First?** Essential groundwork. Establishes the *descriptive* reality: these rules are man-made, local, and often arbitrary in origin (any workable solution suffices). Must dispel the "natural law" misconception early. Avoids prematurely moralising.
      *   **Key Distinction Here:** Clearly separate "convention" (descriptive social fact) from "obligation" (normative claim). Students must grasp that identifying something *as* a convention is step one, not the final answer.

  2.  **Can Conventions Create Moral Obligations? (The Binding Force) (20 mins):**
      *   **What:** Argue *why* we might be morally bound *by* some conventions. Focus on core ethical principles:
          *   **Harm/Inconvenience:** Violating coordinating conventions (like queuing) causes tangible frustration, inefficiency, wasted time (e.g., barging in causes chaos).
          *   **Fairness/Exploitation:** Benefiting from others' adherence (enjoying an orderly queue) while not adhering oneself is unfair free-riding.
          *   **Respect/Trust:** Following local customs shows respect for the community and maintains social trust; flouting them signals disrespect or contempt.
          *   **Implicit Agreements:** Living in a society involves tacit acceptance of its foundational "rules of the game".
      *   **Why Next?** Directly tackles the primary misconception: **"If it's only conventional, it cannot bind anyone morally."** This section provides the *arguments* showing why this is false. It establishes that the *source* of a rule (convention) doesn't automatically negate its potential *moral force* (derived from harm, fairness, etc.).
      *   **Introduce Your Distinction (Carefully):** Frame it as *why* the convention exists. A *coordination* convention (queues, escalators, driving side) solves a practical problem; *any* rule works if coordinated. An *expressive/signalling* convention (tipping, specific gestures, forms of address) conveys meaning (gratitude, status, respect) *within* a cultural code. **Stress:** The *point* of the convention influences the *type* of harm/friction caused by violation (chaos vs. offence/miscommunication). This sets up the visitor problem but doesn't resolve the moral status yet.

  3.  **The Newcomer/Visitor Problem (25 mins):**
      *   **What:** *Now* pose the core question: **"Do these moral obligations bind newcomers/visitors equally, immediately, or at all? If not, when and why do they 'kick in'?"**
      *   **Why Last?** This question is *meaningless* without steps 1 & 2. Without understanding conventions (Step 1), the problem is opaque. Without understanding *why* conventions *might* bind (Step 2), there's no dilemma – the visitor could justifiably ignore everything. Step 2 provides the ethical vocabulary (harm, fairness, respect) needed to debate the visitor's obligations.
      *   **Key Factors to Explore:**
          *   **Knowledge:** Does the visitor know the convention? Is ignorance a defence? Is there a duty to *learn* basic conventions?
          *   **Intent:** Was the violation deliberate or accidental? Does this affect the moral weight?
          *   **Type of Convention:** Does violating a *coordination* convention (causing chaos) carry different weight for a newcomer than violating an *expressive* one (causing offence due to ignorance of the code)? (Leverage your distinction here).
          *   **Length of Stay/Integration:** Does a tourist have different obligations than a new resident? When does "visitor" status end?
          *   **Local Expectations:** Do locals reasonably expect newcomers to know/obey? Is there a grace period?

  **The Anchor Case:**
  *   **Problem with Bakery Case:** You're right. It conflates a pure coordination convention (queuing - where violation causes direct, observable harm/chaos) with an expressive one (tipping - where violation may cause offence/harm based on misread signals, but the harm is less about coordination failure). It also mixes the "what kind of convention" question with the "visitor" question too early.
  *   **Proposed Replacement Case: Escalator Etiquette.**
      *   **What it must have:** A clear, common *coordination* convention (e.g., stand on the right, walk on the left on London escalators).
      *   **What it must lack (initially):** Expressive/signalling elements, complex moral baggage (like service worker wages with tipping), or legal status. Keep it simple.
      *   **Why it works:**
          1.  Demonstrates pure coordination: Any rule works if coordinated; violation (standing on the left) causes direct, tangible harm/inconvenience (blocking walkers, causing frustration, inefficiency).
          2.  Visitor problem is clear: Does a newcomer (say, from a country with no such rule) have an obligation to learn and follow this *immediately*? If so, why (harm, fairness)? If not, why not (ignorance, no intention to exploit)?
          3.  **Later Contrast:** *After* exploring the visitor problem with the escalator, *then* introduce a contrasting case like **Tipping a Taxi Driver** (expressive). Does ignorance of the tipping *signal* excuse the newcomer? Is the harm (offence, perceived stinginess) different in kind/moral weight than causing escalator chaos? This isolates and highlights your distinction effectively.

  **Addressing Misconceptions:**

  1.  **"If it is only a convention, it cannot bind anyone (morally)."**
      *   **When to Head Off:** During **Step 2 (The Binding Force)**. Use the arguments about harm, fairness, and exploitation arising from violating *coordination* conventions (like the escalator) to demonstrate why this is false. **Can it be fully headed off?** Likely not for everyone, but robust arguments in Step 2 provide the necessary counter.
  2.  **"If it is illegal it is immoral, and if it is legal it is permitted (morally acceptable)."**
      *   **When to Head Off:** **Immediately in Step 1.** When defining conventions, explicitly distinguish them from *laws*. State clearly: "Laws are formal, codified rules backed by state power. Conventions are informal social norms. Something can be illegal but morally neutral (e.g., jaywalking in an empty street), legal but immoral (e.g., some forms of sharp business practice), conventional but not illegal (most etiquette), or illegal *and* conventional (e.g., speeding norms). Legality ≠ Morality." **Can it be headed off?** Yes, this conflation is common but easily corrected with clear examples early on.
  3.  **"The visitor is always excused by ignorance."**
      *   **When to Head Off:** During **Step 3 (Visitor Problem)**. Argue that while ignorance *explains* behaviour, it doesn't always *excuse* it morally, especially if the violation causes significant harm/fairness issues and there was a reasonable expectation/duty to learn basic conventions (e.g., driving rules for a new resident). Contrast minor vs. major conventions. **Can it be headed off?** No, this is a core tension. The *degree* to which ignorance excuses is a genuine point for debate, depending on the convention's impact and context. Leave this standing.
  4.  **"All conventions are morally equivalent."**
      *   **When to Head Off:** Leverage **Your Distinction** within **Step 2** and especially **Step 3**. Highlight the different *reasons* for conventions (coordination vs. expression) and the different *harms* caused by violations (tangible chaos vs. offence/miscommunication). Argue these differences *might* lead to different moral weights or different obligations for newcomers. **Can it be headed off?** No. This is where your distinction shines. Whether coordination conventions are *more* morally compelling for newcomers than expressive ones, or whether the harm of offence is comparable to the harm of chaos, is a central, fruitful philosophical disagreement. Leave this open.

  **The Closing Question:**
  *   **"Could there be a social convention in this city that is so deeply embedded and specific that a newcomer who violates it, despite knowing about it, commits *no* moral wrong? If so, what would make it different from a convention whose violation *would* be wrong?"**
      *   **Why it works:** This forces them to apply the *structure*:
          1.  Identify the convention *as* a convention (Step 1).
          2.  Consider *why* it might/might not create an obligation (Step 2 - harm? fairness? exploitation? expression?).
          3.  Specifically apply it to the newcomer context (Step 3 - knowledge, intent, nature of harm, type of convention).
      *   It moves beyond "Should visitors tip?" to probe the *criteria* for when a convention binds a newcomer. It invites them to use your distinction (is it purely expressive with a very obscure meaning?).

  **What to Openly Refuse to Cover:**
  *   **State clearly early on:** "Given our limited time, we *cannot* delve into deep debates about **cultural relativism** (whether all moral codes are equally valid) or **meta-ethics** (the ultimate source of moral truth). We are working within a framework that assumes concepts like causing harm, unfairness, or disrespect *can* be morally significant, even if their exact weighting is debated. We're focusing on the *structure* of obligations arising *from* social conventions, particularly for newcomers."

  **Summary of Flow:**
  1.  (10 min) **Conventions Defined & Distinguished:** What they are (arbitrary, local, descriptive), separating them from laws/morals. *Correct "Legal=Immoral" misconception.*
  2.  (20 min) **The Binding Force:** Why conventions *can* create moral obligations (Harm, Fairness, Respect). *Challenge "Conventional=Cannot Bind" misconception. Introduce Coordination vs. Expression.*
  3.  (25 min) **The Visitor Problem:** Applying the above to newcomers (Knowledge, Intent, Convention Type, Integration). *Use Escalator (coordination) first, then contrast with Tipping (expression). Leave "Ignorance always excuses?" and "All conventions equal?" as open debates.*
  4.  (5 min) **Wrap-up & Final Question:** Pose the closing question to test structural understanding.

  This sequence builds logically, addresses key misconceptions at the points where they are most likely to arise and block understanding, utilises your distinction to illuminate the core dilemma without forcing premature resolution, and provides clear boundaries for the discussion within the time limit.
