prompt: |-
  I've been trying to work out what I actually think about conditionality in the welfare state, and I've decided to go about it the way I go about most things now -- by cataloguing my gut verdicts on cases first and looking for the principle afterward, rather than picking a theory and defending it. I should be clear that I'm not asking what the law is anywhere, or what any particular agency does; I want the moral structure underneath my own reactions, and I'm willing to be told that some of them can't be kept. So: a healthy adult who quits a decent job to surf and then draws unemployment -- sanctioning him and requiring work seems right to me. A laid-off worker who turns down a job paying half his old wage and is then cut off -- that seems wrong. A man claiming for a relative who died two years ago -- prosecuting him is clearly right, and the fact that he was poor doesn't move me at all. A woman doing casual undeclared work while claiming, reporting none of it -- I feel much less strongly about sanctioning her, though it's the same species of dishonesty. A single mother whose childcare falls through and who misses a mandatory appointment -- sanctioning her is wrong. A man with a drinking problem who skips the treatment program attached to his claim -- also wrong. A woman who won't take a job requiring Saturday work, on religious grounds -- I don't think she should be sanctioned. A man who won't take that same job because it's beneath his qualifications -- I think he should be. A young man who refuses a job two hundred miles away because he doesn't want to leave his friends -- sanction him; a woman who refuses the same job to care for a disabled parent -- don't.

  I can feel at least two of these pulling against each other, and I genuinely can't tell whether that's a defect in me or a real distinction. The Saturday case and the qualifications case look like twins -- both are refusals of an available job for a personal reason -- yet I want opposite verdicts, and the only difference I can name is that one reason is one I'd expect a stranger to respect and the other is one I wouldn't, which feels like it's smuggling in respectability rather than desert. A friend of mine, who spends too much time on the rationalist blogs, suggested I stop asking whether people deserve their benefits and start asking what the sanction is doing -- whether it's a price we're charging for a choice or a punishment for a character -- but that distinction doesn't survive the surfing case, where I'm happy to charge the price and equally happy to call the man a freeloader. What I'd like from you is the principle, or small set of principles, that actually generates these verdicts; where a principle has to grow complications to save all of them, say so and tell me which verdict is carrying the weight; and then apply whatever you land on to two cases I haven't listed -- a claimant who fails a literacy requirement he could have met with effort but never had any reason to want, and a claimant who lies about a disability he really does have -- so I can see whether the principle is recognizably mine or just tidy.
reasoning: |-
  Okay, let me start by really understanding what the user is asking for. They've listed a series of gut reactions to different welfare scenarios and want to uncover the underlying moral principles that explain those reactions. The challenge is that some cases seem contradictory, like the religious refusal versus the qualifications refusal. The user is aware of the tension and wants a coherent framework that either resolves it or highlights where their intuitions might conflict.

  First, I need to parse each case they mentioned. The surfer quitting to surf feels sanction-worthy, but the laid-off worker refusing a lower-paying job doesn't. The fraud cases vary: prosecuting the dead relative scammer is fine, but sanctioning the undeclared work feels less severe. Then there's the single mom with childcare issues and the man skipping rehab—both shouldn't be sanctioned. Refusing work for religious reasons is acceptable, but not for qualifications. Location refusal for friends vs. caring for a disabled parent—sanction the former, not the latter.

  The user points out the tension between the religious and qualification refusals. Why treat them differently? The user mentions respectability as a possible hidden factor but is uncomfortable with that. Their rationalist friend suggested focusing on the sanction's purpose—price vs. punishment—but that doesn't fit the surfer case where both apply.

  I need to identify principles that connect these judgments. Let's look for common threads. Willingness vs. ability seems key. The surfer is able but unwilling, while the laid-off worker might be unable to accept lower pay due to financial obligations. The single mom and the man with addiction have external barriers (childcare, health). The religious refusal is about conscience, which feels involuntary, whereas the qualifications refusal seems voluntary pride.

  But is that distinction solid? Maybe the qualification guy genuinely feels the job is beneath him, similar to religious conviction. Yet the user treats them differently. So perhaps it's about societal recognition of the reason. Religion is protected, personal pride isn't. But the user worries this is about respectability, not desert.

  Another angle: the difference between internal and external reasons. Caring for a parent is external, whereas not wanting to leave friends is internal. But addiction is internal, yet the user opposes sanctions there. Hmm, addiction might be seen as a health issue, making it involuntary.

  What about the fraud cases? The dead relative scam is clear fraud, but undeclared work might be seen as survival, hence less severe. The user feels less strongly about sanctioning her, maybe because her dishonesty is out of necessity, not greed.

  So possible principles: 

  1. **Voluntariness of the choice** - If the choice is fully voluntary (surfer), sanction is okay. If involuntary (childcare, addiction), not okay. But religious refusal is voluntary, yet no sanction. Unless we see religious duty as non-voluntary.

  2. **Barriers beyond control** - The single mom, caregiver, addict have barriers. The laid-off worker can't afford the pay cut. The religious person has a conscience barrier. The qualifications guy? His barrier is self-imposed, so not valid.

  3. **Social utility or harm** - The surfer harms the system by free-riding. The undeclared worker might not harm as much if she's still struggling. The dead relative scam causes direct harm.

  4. **Moral desert vs. practical necessity** - The friend's idea of price vs. punishment. In the surfer case, it's both. But maybe sanctions serve to enforce reciprocity. The surfer isn't contributing, while the religious person is willing but constrained.

  Let's try a principle like: **sanctions are appropriate when the person is capable of meeting requirements without significant personal sacrifice, and their failure reflects a lack of reciprocity.** 

  The laid-off worker would face significant sacrifice (income halved), so no sanction. Religious refusal involves significant sacrifice of conscience. The qualifications guy? If he's capable but unwilling due to pride, that's not a significant sacrifice, so sanction applies. 

  But is pride less significant than religion? Socially, yes, but morally? The user seems to accept societal norms here. 

  Applying to new cases: 

  1. **Failing literacy test he could pass with effort but had no reason to want.** If he had no reason, maybe it's unreasonable to expect effort. So no sanction? But the requirement exists, so perhaps sanction if he didn't try. The user might feel it's unfair to require effort without prior need. 

  2. **Lying about a disability he really has.** Why lie if he has it? Maybe to access more benefits. Is this fraud? But the user might see it as dishonesty without harm, so less severe than the dead relative case. 

  Potential principles:

  - **Capability and Reasonable Sacrifice:** Sanction when the individual has the capability to comply and compliance doesn't require unreasonable personal sacrifice. 

  - **Volition and Control:** Sanction when non-compliance is due to factors within the person's control without extenuating circumstances.

  - **Harm and Reciprocity:** Sanction when the behavior undermines the system's integrity or exploits it without contributing.

  - **Moral vs. Practical Grounds:** Distinguish between punitive sanctions (for dishonesty) and incentive-based ones (for encouraging work).

  In the literacy case, if the requirement is arbitrary, sanctioning might be seen as unreasonable. For the disability lie, perhaps it's wrong but less severe because the underlying need exists.

  The user might value both fairness (preventing exploitation) and compassion (recognizing constraints). The tension in the religious vs. qualifications case might stem from societal values—religion is a protected class, personal pride isn't. The user's discomfort suggests they want a principle that isn't just societal norms. 

  Maybe the key is **interference with fundamental aspects of personhood.** Religion is core to identity, whereas job preferences aren't. Caregiving for a parent is a fundamental duty, unlike staying with friends. Addiction is a health issue, affecting autonomy. 

  But then, what about the laid-off worker? His refusal is due to financial necessity, which is practical, not fundamental. Yet no sanction. So perhaps **the necessity of the barrier** matters. If the barrier is necessary (health, caregiving, conscience), no sanction. If avoidable (pride, preference), sanction. 

  Applying that: Literacy test—no necessary barrier, he could try, so sanction? But the user might feel it's unfair if he never needed literacy before. Disability lie—the disability is real, so the lie might be to navigate bureaucracy, less blameworthy. 

  This requires refining. The principle might be: **Sanctions are justified when non-compliance stems from preferences rather than necessities, and when the requirement serves a legitimate purpose without imposing undue hardship.**

  For literacy, if the requirement is legitimate (e.g., for job readiness), and he can meet it, sanction if he doesn't try. But if it's arbitrary, maybe not. The user's reaction might depend on whether the requirement is reasonable. 

  For the disability lie, it's dishonesty, but the need exists, so perhaps a lesser sanction than outright fraud. 

  The user's core might be balancing individual circumstances with system integrity, where sanctions should target free-riding without punishing vulnerability.
answer: |-
  Based on your gut verdicts, I'll extract the underlying moral principles, show where they align or conflict, identify which cases carry the weight (i.e., force the principles to adapt), and apply them to your new cases. Your reactions reveal a nuanced, **reciprocity-based desert framework** moderated by **practical autonomy barriers**, with a secondary distinction between **punitive vs. incentive-based sanctions**. The tension you feel (e.g., religious vs. qualifications refusal) isn't a defect—it reflects a genuine moral conflict that the principles must navigate.

  ### Core Principles Derived from Your Verdicts
  1. **The Reciprocity Principle**:  
     Benefits require a *good-faith effort to contribute* when capable. Sanctions are justified when someone *voluntarily withdraws* from reciprocity without a morally weighty reason.  
     - *Manifests in*: Sanctioning the surfer (quits job voluntarily), prosecuting the dead relative fraud (exploits system), sanctioning the "beneath qualifications" refusal (rejects contribution without valid reason).  
     - *Limits*: Overridden by Principle 2.

  2. **The Autonomy Barrier Principle**:  
     Sanctions are wrong if compliance requires sacrificing a *fundamental aspect of practical autonomy* (e.g., caregiving, health, conscience, or survival needs). Personal preferences (e.g., pride, social ties) don’t qualify.  
     - *Manifests in*: No sanction for the laid-off worker (survival: wage cut), single mother (caregiving), addict (health), religious refusal (conscience), caregiver for disabled parent (caregiving).  
     - *Sanction allowed* for the "friends" refusal (preference) and qualifications refusal (pride).

  3. **The Moral Gravity of Dishonesty**:  
     Fraud severity depends on *harm to others* and *exploitative intent*.  
     - *High gravity*: Claiming for a dead relative (direct harm to system/resources).  
     - *Lower gravity*: Undeclared casual work (less clear harm; possibly survival-driven). You feel less strongly about sanctioning here because intent may not be exploitative.

  4. **Sanction Function Distinction**:  
     Sanctions act as:  
     - *Incentives* ("prices") for choices where reciprocity is expected (e.g., job refusal).  
     - *Punishments* for moral failures (e.g., fraud).  
     - *Your twist*: These can coexist (e.g., surfing case: both "price" for leisure and "punishment" for freeloading), but punishment is reserved for clear exploitation.

  ### How Principles Resolve Tensions
  - **Religious vs. Qualifications Refusal**:  
    Both are job refusals, but your verdicts split because:  
    - Religious refusal involves an **autonomy barrier** (conscience is fundamental; violating it attacks practical identity).  
    - Qualifications refusal is a **preference** (pride doesn’t threaten autonomy; rejecting work undermines reciprocity).  
    - *The conflict*: Your intuition that this might "smuggle in respectability" is partly right—society treats conscience (e.g., religion) as a *protected autonomy barrier* but not pride. However, you’re also distinguishing **internal necessities** (religion, caregiving) from **discretionary wants** (status, friends). The "qualifications" verdict carries weight here, forcing Principle 2 to exclude preferences.  

  - **Surfing Case**:  
    Principles 1 and 4 overlap seamlessly: Sanctioning is both a "price" (for choosing leisure over work) and "punishment" (for freeloading), as reciprocity is *blatantly* violated.

  - **Addict Skipping Treatment**:  
    Principle 2 prevails: Addiction is a health barrier (not a choice), so sanctioning is wrong. Reciprocity isn’t demanded because capability is compromised.

  ### Cases Where Principles Require "Complications"
  - **Undeclared Work While Claiming**:  
    Your mild sanction verdict complicates Principle 3. The principle must grow:  
    - *Dishonesty is less blameworthy if driven by survival* (no exploitative intent).  
    - *Harm matters*: Small-scale undeclared work doesn’t starve the system like fraud.  
    - **Verdict carrying weight**: The dead relative case (high harm) forces fraud severity to scale with impact.  

  - **Laid-Off Worker Refusing Lower Wage**:  
    Principles 1 and 2 collide. Reciprocity demands job acceptance, but:  
    - *Autonomy barrier wins*: Halving wages threatens survival/stability (not mere preference).  
    - **Complication**: Reciprocity must accommodate *reasonable* self-preservation.  

  ---

  ### Application to New Cases
  **Case 1: Claimant fails a literacy requirement he could have met with effort but never had any reason to want.**  
  - **Your Likely Verdict**: Sanction justified, but weakly.  
  - **Why**:  
    - *Reciprocity*: He *could* meet it with effort (voluntary non-compliance).  
    - *Autonomy Barrier*: No fundamental sacrifice (effort ≠ autonomy violation).  
    - **But**: "Never had reason" introduces friction. If the requirement is arbitrary (e.g., unrelated to jobs available), sanctioning feels disproportionate—it becomes a "gotcha" rule, not reciprocity enforcement. Principle 1 must bend: Reciprocity requires *meaningful* contributions, not compliance for its own sake.  
  - **Outcome**: Sanction, but you’d likely support reforming the requirement.  

  **Case 2: Claimant lies about a disability he really does have.**  
  - **Your Likely Verdict**: Mild sanction (e.g., benefit reduction, not prosecution), but not wrong to penalize.  
  - **Why**:  
    - *Moral Gravity*: Dishonesty exists, but harm is low (he qualifies for aid anyway; no resource diversion).  
    - *Intent*: Likely survival-driven (e.g., fear of bureaucracy or benefit gaps), not exploitation. Contrast with dead relative fraud.  
    - *Reciprocity*: Unaffected—his actual disability justifies support.  
  - **Outcome**: Penalize the lie (upholding system integrity), but less severely than clear fraud.  

  ---

  ### Is This Framework "Recognizably Yours"?  
  Yes, with one caveat. Your principles prize **desert through reciprocity** but are deeply pragmatic:  
  - **Strengths**:  
    - Explains tensions (e.g., religion vs. qualifications) via autonomy barriers.  
    - Handles fraud gradations (harm/intent matter).  
    - Justifies "punishing" freeloaders (surfer) while protecting the vulnerable (addict, caregiver).  
  - **Tidiness Trade-off**: The framework isn’t perfectly tidy—it allows Principles 1 and 2 to conflict, prioritizing context over rigid rules. This matches your willingness to reject abstract theories.  
  - **Your Blind Spot**: **Social recognition of "barriers"**. Religion is socially validated; caregiving is visible. But what about "beneath qualifications" if framed as psychological necessity (e.g., severe shame)? Your principles might undervalue *invisible* autonomy threats.  

  If this resonates, your moral core is: **Benefits are deserved when claimed in good faith by those unable to contribute *or* actively contributing. Sanctions should restore reciprocity, not punish misfortune.** Where verdicts clash (e.g., undeclared work), you prioritize material harm and intent over consistency.
