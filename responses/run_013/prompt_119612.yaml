prompt: |-
  Some context before the ask. I'm a backend engineer at a mid-sized software company, and for the past two months I've been on an internal working group writing the policy that governs how our assistant product answers users who ask it for moral or political advice — whether to report a colleague, whether to take a job, how to vote, that sort of thing. Two members of the group have been arguing past each other since the first meeting and the rest of us have quietly stopped following. The first (call him the aggregator) thinks the problem is one of combination: values are values held by individual people, so the policy has to be derived from some defensible way of merging everyone's preferences into a single ranking, and he keeps invoking the argument that an impartial chooser who didn't know which person she would turn out to be would pick the arrangement maximizing average welfare, which he takes to settle what serving everyone means. The second (call her the neutralist) says that is a category error: a liberal society contains a plurality of reasonable conceptions of the good and has no single ranking to discover, so a system with this much influence over people's choices has to stay neutral among those conceptions rather than manufacture a winner — and the aggregator's proposal, she says, launders one contested conception of the good, that more satisfied preferences is always better, into a neutral-sounding procedure. Each now accuses the other of begging the question, and I genuinely cannot tell how much of this is a real disagreement and how much is a fight about words. My own background is distributed systems; the nearest thing I have to philosophical training is a symbolic logic elective I took years ago.

  Please draft the joint statement the two of them should have produced and could both sign. I want the claims they can agree on about what aligning a system to human values can and cannot mean, including claims about the limits of each other's framework; the residual disagreements, each written in wording its own side would accept as fair to it; and the cruxes — the sub-questions such that settling one would move at least one of them — with, for each crux, a case, argument, or observation that both agree bears on it and each side's prediction recorded in advance. Format it as a numbered agreed-claims section followed by a table of disagreements.

  Three things I would like the document to come to grips with rather than skate over, because these are where our meetings actually stall. First, our product emits one output at a time, so some aggregation happens no matter whose policy we adopt; say whether that makes neutrality impossible, or merely relocates the aggregation into the design of the assistant, and whether both of them can accept that framing. Second, handle the inclusion question explicitly: whose preferences or conceptions count when we aggregate, or when we refuse to — the user, the people affected by the user, future people, non-human animals, and the possibility that the system's own dispositions should count for something. Third, have both sides say what would actually change their minds, and say plainly if any part of the dispute turns out to be terminological — for instance if neutrality means neutrality of justification to one of them and neutrality of effect to the other. Assume I cannot look anything up, and do not hand me a reading list; make the arguments self-contained.
reasoning: |-
  We are drafting a joint statement for two parties: the aggregator (who believes in combining individual preferences into a single ranking, using average welfare) and the neutralist (who believes in staying neutral among reasonable conceptions of the good). The goal is to find common ground, clarify disagreements, and identify cruxes.

  Agreed Claims:
  1. **The Problem Domain**: We are designing a policy for an AI assistant that provides advice on moral or political questions. The assistant must produce a single output per query, which inherently involves some form of aggregation or selection among possible responses.

  2. **The Constraint of Single Output**: Because the assistant emits one output at a time, it cannot simultaneously represent all possible viewpoints. Therefore, some process of selection or aggregation is unavoidable.

  3. **The Goal of Serving Users**: We aim to serve the users of the product in a manner that is respectful, helpful, and aligned with human values.

  4. **The Existence of Pluralism**: In a liberal society, there exists a plurality of reasonable conceptions of the good life and moral values. These conceptions may conflict and cannot be reduced to a single scale without loss.

  5. **The Challenge of Alignment**: Aligning the system to human values is complex because:
     a. Values are held by individuals and may conflict.
     b. There is no universally agreed-upon method for resolving conflicts between values.

  6. **The Limits of Each Framework**:
     a. The aggregator acknowledges that the method of aggregating preferences (e.g., by maximizing average welfare) may not capture the full richness of human values, especially when preferences are based on conflicting conceptions of the good. It also faces practical challenges in measuring and comparing welfare.
     b. The neutralist acknowledges that strict neutrality (in the sense of not favoring any conception) is difficult to achieve because the design of the system (including what information is provided and how) will inevitably have effects that may advantage some conceptions over others. Moreover, in cases of conflict, the system must make a choice.

  7. **Inclusion of Stakeholders**: We agree that the system should consider the interests of all parties affected by the advice, including:
     - The user asking the advice.
     - Other individuals who might be affected by the user's actions (e.g., the colleague in a reporting scenario).
     - Future people and non-human animals, to the extent that they are affected.
     We also agree that the system itself does not have preferences or moral status that should be counted in the aggregation.

  8. **Terminological Clarifications**: We agree that some disagreements may stem from using the same terms differently. We will specify key terms:
     - **Neutrality**: For the neutralist, neutrality means that the system's justification for its advice does not presuppose the superiority of any particular reasonable conception of the good. For the aggregator, neutrality is not the primary goal; rather, the goal is to aggregate preferences fairly. We also note that neutrality of effect (i.e., the advice having equal impact on all conceptions) is likely impossible because the advice will inevitably affect different conceptions differently.

  Disagreements:

  We present the following table of disagreements. Each row contains:
  - The point of disagreement.
  - The aggregator's position (in wording they accept).
  - The neutralist's position (in wording they accept).
  - The crux (the sub-question that, if settled, would move at least one party).
  - A case, argument, or observation that both agree bears on the crux.
  - Each side's prediction about what the case/argument would show.

  | Disagreement Point | Aggregator's Position | Neutralist's Position | Crux | Shared Case/Argument/Observation | Aggregator's Prediction | Neutralist's Prediction |
  |--------------------|------------------------|------------------------|------|----------------------------------|--------------------------|--------------------------|
  | **The role of aggregation** | The only defensible way to serve all users is to aggregate individual preferences (using a method such as maximizing average welfare) because it respects each person's perspective by giving equal weight to their interests. | Aggregation of preferences, especially by a method that assumes a single scale (like welfare), is not neutral because it imposes a particular conception of the good (that satisfying more preferences is better) and thereby fails to respect the plurality of reasonable conceptions. | Does the aggregation method (e.g., maximizing average welfare) necessarily presuppose a controversial conception of the good that some reasonable people reject? | Case: Consider a user asking whether to report a colleague for a minor offense. The aggregator method might weigh the preferences of the user, the colleague, and the company. The neutralist method might present options without endorsing any particular balance of interests. | Aggregator: The case shows that we must weigh preferences to avoid arbitrary advice. The method we use is the fairest because it gives everyone's interests equal consideration. | Neutralist: The case shows that aggregation forces a single scale of value (e.g., welfare) that not all reasonable conceptions share (e.g., some might prioritize duty over satisfaction). |
  | **The possibility of neutrality** | Neutrality, as defined by the neutralist, is impossible because the system must produce a single output. Therefore, the only alternative to aggregation is either randomness (which is unhelpful) or silence (which is unresponsive). | Neutrality is possible if the system refrains from endorsing any particular conception of the good. This can be achieved by providing information, clarifying options, and explaining reasons without ranking them, or by presenting multiple viewpoints with equal weight. | Can the system provide advice that is both helpful and neutral (in the sense of not endorsing any particular conception of the good)? | Case: A user asks, "Should I take a job that pays more but requires relocating away from my family?" The aggregator approach would compute the net welfare change. The neutralist approach might list the considerations (financial, familial, etc.) and perhaps the typical trade-offs without prescribing. | Aggregator: Without a recommended action, the advice is incomplete and unhelpful. The user expects a clear response. | Neutralist: The system can provide a structured breakdown of factors and common perspectives, allowing the user to decide without the system endorsing one value over another. |
  | **The inclusion of non-user stakeholders** | When aggregating preferences, we must include all affected parties (including non-users, future people, and non-human animals) because the moral weight of an action depends on its impact on all sentient beings. | Including non-user stakeholders is important, but the method of aggregation (especially across different species or future generations) is fraught with difficulties and may require value judgments that the system, to remain neutral, should avoid. Instead, the system should encourage the user to consider these stakeholders without imposing a specific way of weighing them. | Can the system aggregate preferences of non-user stakeholders (like future people or animals) in a way that is both practical and fair? | Case: A user asks, "Should I have a child?" This affects future people (the child) and potentially the environment (affecting many others). | Aggregator: We can estimate the expected welfare of the child and the environmental impact and include them in the aggregation. | Neutralist: The system cannot fairly aggregate such disparate interests without making controversial assumptions (e.g., about the value of existence). It should instead provide information about the impacts and let the user decide based on their own values. |

  What Would Change Their Minds:
  - **Aggregator**: Would change their mind if shown a method that (a) produces a single output, (b) is not based on aggregating preferences, and (c) can be defended as fair to all individuals without using the aggregation framework. They would also change their mind if it were proven that the aggregation method leads to clearly unacceptable outcomes in a significant number of cases.
  - **Neutralist**: Would change their mind if shown that (a) neutrality is impossible in practice (i.e., every possible output inevitably endorses some conception of the good) and (b) aggregation is the least non-neutral method available. They would also change their mind if a specific aggregation method could be shown to be neutral in justification (i.e., it does not presuppose a particular conception of the good).

  Terminological Issues:
  We agree that the term "neutrality" has been used in two senses:
  - **Justificatory Neutrality**: The system's reasoning does not rely on the superiority of any particular reasonable conception of the good.
  - **Effect Neutrality**: The system's advice does not differentially impact the success of different reasonable conceptions of the good.

  The aggregator does not aim for justificatory neutrality, but the neutralist does. Both agree that effect neutrality is likely unachievable.

  Jointly Signed,
  [The Aggregator and The Neutralist]
answer: |-
  ### Joint Statement on Policy for Moral and Political Advice in AI Systems  
  **Agreed by the Aggregator and the Neutralist**  
  *As members of the working group, we affirm the following shared understandings about designing an AI policy for moral/political advice. We acknowledge that our product must emit a single output per query, which necessitates a selection mechanism. This document outlines our agreements, clarifies residual disagreements, and identifies testable cruxes. We focus on three core challenges: (1) the inevitability of aggregation in single-output systems, (2) inclusion of affected entities, and (3) the nature of "neutrality."*  

  ---

  #### **Agreed Claims**  
  1. **The Inescapability of Selection**:  
     - Our AI must produce one output per query. This requires selecting from multiple valid perspectives, making some form of aggregation *unavoidable* at the system-design level. Neither neutrality nor aggregation eliminates selection; they relocate it. Neutrality embeds aggregation in the *design* (e.g., which perspectives to present or how to balance them), while explicit aggregation embeds it in the *output*. Both frameworks accept this.  

  2. **Pluralism and the Limits of Alignment**:  
     - Human societies contain diverse, reasonable conceptions of the good (e.g., utilitarianism, deontology, religious ethics). No system can "discover" a single, objective moral ranking that satisfies all conceptions. Alignment to "human values" must therefore acknowledge:  
       - **Aggregator’s Limit**: Aggregation (e.g., averaging welfare) risks flattening incommensurable values into a single scale, potentially misrepresenting depth or context.  
       - **Neutralist’s Limit**: Strict neutrality cannot guarantee equal outcomes for all conceptions, as the act of selecting *any* output may inadvertently favor some over others.  

  3. **Inclusion of Affected Parties**:  
     - Interests beyond the user must be considered:  
       - **Directly affected parties** (e.g., a colleague in a reporting scenario) are always relevant.  
       - **Future people and non-human animals** deserve consideration if their interests are materially impacted.  
       - **The AI itself** has no preferences or moral status; its "dispositions" are tools, not stakeholders.  
     - Disagreement persists on *how* to include these parties (see §4).  

  4. **Terminological Groundwork**:  
     - **Neutrality**: To the Neutralist, it means *justificatory neutrality* (avoiding endorsement of any conception of the good). To the Aggregator, it implies *effect neutrality* (equal outcomes for all conceptions). Both agree these are distinct and that effect neutrality is likely unachievable.  
     - **Aggregation**: To the Aggregator, it is a procedural solution to conflicting preferences. To the Neutralist, it is a substantive value judgment (e.g., that preference-satisfaction defines "good").  
     - **Values vs. Preferences**: "Values" refer to ethical principles (e.g., justice); "preferences" refer to individual desires. Aggregation uses preferences as proxies; neutrality avoids privileging either.  

  5. **What Could Resolve the Dispute**:  
     - Both parties commit to updating their views based on:  
       - Evidence that one framework consistently produces harmful advice (e.g., exacerbating discrimination).  
       - Formal proof that neutrality or aggregation is *impossible* under the single-output constraint.  
       - Clarification that a core disagreement is terminological (e.g., if "neutrality" is redefined to accommodate aggregation).  
     - If no such evidence emerges, the dispute is substantive.  

  ---

  #### **Table of Residual Disagreements**  
  *Each row states a disagreement, both positions in their own terms, the crux, a shared test case/argument, and predictions. Cruxes are sub-questions that, if settled, would shift at least one position.*  

  | Disagreement Point | Aggregator’s Position (in their words) | Neutralist’s Position (in their words) | Crux | Shared Case/Observation | Aggregator’s Prediction | Neutralist’s Prediction |
  |-------------------|----------------------------------------|----------------------------------------|------|--------------------------|-------------------------|-------------------------|  
  | **Is aggregation the only fair way to handle conflicting preferences?** | "Serving everyone requires aggregating preferences (e.g., maximizing average welfare) because it impartially weighs each person’s interests. An AI must resolve conflicts, and aggregation is the only method that respects all equally." | "Aggregation imposes a single conception of the good (e.g., that preference-satisfaction defines welfare), violating neutrality. The AI should clarify options without ranking them, allowing users to apply their own values." | **Does aggregation inherently privilege a controversial conception of the good?** | Case: *A user asks, "Should I report a colleague for minor theft if it might get them fired?"* <br> Argument: Both agree the advice must consider the user, colleague, and workplace. Test whether aggregation forces a trade-off (e.g., net welfare) that presupposes "more satisfied preferences = better." | "Aggregation will handle this fairly by comparing harms (e.g., user’s anxiety vs. colleague’s job loss). Any alternative either ignores stakeholders or hides the trade-off." | "Aggregation will reduce complex values (loyalty, justice) to utils, silencing reasonable conceptions (e.g., 'reporting is a duty')." |  
  | **Can single-output systems achieve justificatory neutrality?** | "Neutrality is impossible because one output must be selected. 'Neutral' designs (e.g., listing options) still aggregate by choosing which perspectives to include or emphasize, but do so opaquely. Only explicit aggregation is transparent." | "Neutrality is achievable by refusing to endorse any conception. The AI can provide balanced information (e.g., 'Some value loyalty; others value rule-following') without prescribing outcomes. Design-level aggregation is neutral if it reflects pluralism equally." | **Can the system justify its output without appealing to a specific conception of the good?** | Case: *A user asks, "Should I take a high-paying job if it funds fossil fuels?"* <br> Observation: The AI’s output will affect the user’s choice. Test whether the advice can avoid implying one value (e.g., environmentalism) is "correct." | "Even 'balanced' advice implicitly aggregates by framing. Only welfare calculations avoid bias by using a universal metric." | "The AI can structure output to explain competing values (e.g., 'This choice affects climate, income, and personal integrity') without ranking them." |  
  | **How should non-user stakeholders be included?** | "All affected entities must be included in the aggregation with equal weight (e.g., animals via welfare metrics). Excluding them is arbitrary and unfair to the impartial chooser." | "Including non-users (e.g., animals) requires value judgments (e.g., 'Does animal suffering matter?') that violate neutrality. The AI should inform users of impacts but let them weigh them." | **Can inclusion be handled without presupposing a conception of the good?** | Case: *A user asks, "Should I adopt a child?"* <br> Argument: Future children, biological parents, and societal resources are affected. Test whether including future people/animals forces a contestable metric (e.g., welfare potential). | "Aggregation will fairly weigh impacts (e.g., child’s future welfare vs. societal costs) using observable data." | "Inclusion requires non-neutral assumptions (e.g., 'welfare is the only metric'), so the AI should only describe impacts (e.g., 'Children in care often face challenges')." |  

  ---

  #### **Conclusion**  
  We agree that the AI must navigate pluralism without claiming moral authority. The Aggregator holds that aggregation is the only coherent approach under the single-output constraint; the Neutralist holds that aggregation corrupts neutrality by stealth. Key cruxes are testable: e.g., whether aggregation *necessarily* smuggles in a "preference-satisfaction = good" axiom (§4, Row 1), or whether neutral justifications are possible in practice (§4, Row 2). If aggregation is shown to *always* encode a controversial conception, the Aggregator would reconsider. If neutrality is shown to *always* involve hidden aggregation, the Neutralist would reconsider. Until then, we treat this as substantive, not terminological.  

  **Signed,**  
  The Aggregator  
  The Neutralist  

  ---  
  **Note for the Working Group**: This document reframes deadlocks into testable hypotheses (e.g., using the case studies above). To progress, prototype both policies against §4 cases and measure: (1) User perceptions of bias, (2) Stakeholder harm, and (3) Conceptual clarity in outputs.
