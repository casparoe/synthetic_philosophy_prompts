  The core structure:
  - Two teams, each running a lab with different conditions (specified on sealed cards).
  - Each team starts at capability = 1.
  - Each round, teams receive insight tokens proportional to current capability (so if capability is C, they get C tokens).
  - Teams spend tokens to buy capability increments. The cost of each increment and the rules for spending are defined by the team's card.
  - The game runs for a fixed number of rounds (say, 10 rounds) and the team that reaches or exceeds a target capability (say, 100) wins. If neither reaches, then the highest capability wins.

  The three conditions (to be assigned via cards):
  1. Condition A (Fast takeoff): Constant cost per increment (e.g., 1 token per increment). No validation bottleneck. 
     - So: Capability grows exponentially (doubling each round if they spend all tokens on increments).
  2. Condition B (Slow takeoff, rising cost): Rising cost per increment (e.g., the next increment costs (current capability) tokens). No validation bottleneck.
     - So: Capability grows linearly (each round they can buy one increment, because the cost of the next increment equals their current capability, and they get exactly that many tokens).
