  The geometric criterion (maximizing the expected logarithm) is sensitive to the choice of the zero point for the outcome. In other words, the ranking depends on the baseline. This is because the logarithm function is not linear and its behavior changes with the location of the outcome relative to zero.

  Specifically, the geometric criterion does not yield a consistent ranking until we fix a zero point for the outcome scale. Without a fixed zero, the ranking can change arbitrarily with shifts.

  Moreover, when an outcome is at or below zero (the new baseline) then the logarithm is undefined (for non-positive numbers) or becomes very negative. This makes the criterion inapplicable if there is any chance of an outcome being non-positive.

  Strongest reply by a geometric expectation advocate:

  1. They might argue that the agent's utility is indeed the logarithm of the outcome, and thus the baseline shift changes the utility function. However, in the problem, the outcome is a linear quantity (like years of life). Shifting the baseline should not change the relative value of additional years if we assume that the utility of an extra year is constant (i.e., linear utility). But the logarithm function implies diminishing marginal utility. If the utility function is u(x) = ln(x), then shifting the outcome by a constant C changes the utility function to u(x) = ln(x+C) which is a different function. 

  2. They might claim that the zero point is fixed by the problem. For example, in the medical treatment case, the outcome is years of life remaining from the time of treatment, and zero means death. Thus, we cannot arbitrarily shift the baseline. However, note that the problem might be reframed in terms of total life span, which would require a different baseline (e.g., from birth). But if we are only concerned with post-treatment survival, then zero is fixed.

