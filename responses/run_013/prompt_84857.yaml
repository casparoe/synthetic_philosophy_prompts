  First, I need to recall Harsanyi's aggregation theorem. Harsanyi treats the veil as a risk scenario where each person has an equal chance of being any individual. The social welfare function becomes the sum of individual utilities. The user is concerned about whether this accurately models Rawls's veil. Rawls's original position uses the veil to ensure impartiality, but it's about uncertainty, not risk. The parties don't know probabilities, which is a key difference. 

  The user mentions three critical points: equal probabilities, the single chooser assumption, and the timing of the lottery. Each needs careful examination. For equal probabilities, if probabilities are unequal or undefined (as in uncertainty), Harsanyi's theorem might not hold. The single chooser representing social preference assumes homogeneity in utility functions, which might not be realistic. The timing issue—aggregating expected vs. realized welfare—highlights that Harsanyi focuses on ex-ante fairness, while Rawls is concerned with ex-post outcomes.

  I should structure the audit by first mapping Harsanyi's model to the lottery elements. Then, identify where the analogy breaks, categorizing into critical and non-critical breaks. The critical breaks would be those undermining the utilitarian conclusion, like uncertainty vs. risk and the single chooser assumption. Non-critical issues might be more about formalism. 

  The user's deeper need is to counter their colleague's argument effectively. They need a clear, structural critique that shows why the lottery analogy fails, even at its strongest. They might also want a defensible alternative interpretation of the veil that incorporates some lottery aspects without leading to utilitarianism. Addressing the three weight-bearing points systematically will be key. Ensuring that the analysis distinguishes between necessary and incidental breaks in the analogy will help the user see whether the argument can survive once disanalogies are considered.
answer: |-
  Here’s an audit of your colleague’s move, structured as requested. The analogy is given its strongest form, and breaks are categorized by their significance for the utilitarian conclusion.

  ### I. The Correspondence: Harsanyi's Lottery Model
  Your colleague maps Rawls’s veil to Harsanyi’s model as follows:
  - **Randomizing device**: The "birth lottery." Nature assigns identities after the choice is made.  
  - **Prizes**: The life prospects (utility levels) associated with each social position.  
  - **Probabilities**: Equal for each individual (1/*n* in a society of *n* people), by symmetry/ignorance.  
  - **Chooser**: A single rational agent ("impartial spectator" or representative chooser) behind the veil.  
  - **Decision rule**: Maximize *expected utility* given the lottery.  
  - **Harsanyi’s Derivation**:  
    - **Utility aggregation**: The chooser’s von Neumann-Morgenstern (vNM) utility function represents a social welfare ordering.  
    - **Equal weights**: The vNM utility is affine-transformed to a weighted sum of individual utilities. Equal probabilities imply *equal weights* in the sum.  
    - **Result**: Social welfare = Σ *uᵢ* (utilitarianism with equal weights).  

  ### II. Where the Mapping Breaks (and Why Some Breaks Matter)
  #### Break 1: **Uncertainty vs. Risk**  
  - **The Break**: Rawls’s veil imposes *uncertainty* (no knowable probabilities), not *risk* (known probabilities). Parties lack information to assign any probability distribution to identities. Harsanyi assumes *risk* with equal probabilities.  
  - **Critical for Conclusion? YES.**  
    - Harsanyi’s theorem *requires* vNM rationality under risk. Without probabilities:  
      - Expected utility maximization is undefined.  
      - The maximin rule (Rawls) becomes rational under deep uncertainty (per Wald, Arrow-Hurwicz).  
    - **Survival of argument**: If probabilities are undefined or unequal, Harsanyi’s sum collapses. Equal-probability is *necessary* for equal-weighted utilitarianism here.  

  #### Break 2: **The Single Chooser vs. Social Preference**  
  - **The Break**: Harsanyi assumes a *single rational agent* whose preferences represent social preferences. Rawls treats the parties as *multiple individuals* agreeing on principles (contractualism).  
  - **Critical for Conclusion? YES.**  
    - Harsanyi’s aggregation relies on the single chooser having a vNM utility that is a *linear sum* of individual utilities. This assumes:  
      - Interpersonal comparability of utility.  
      - That the chooser’s risk preferences can stand in for social value judgments.  
    - Rawls’s contractualism doesn’t require aggregating utilities at all. The parties seek mutual agreement, not optimization of a social utility function.  
    - **Survival of argument**: Without the single-chooser assumption, no unique vNM utility exists to aggregate. The "sum of utilities" has no contractual basis.  

  #### Break 3: **Timing: Ex-Ante vs. Ex-Post Welfare**  
  - **The Break**: Harsanyi aggregates *expected utilities* (welfare assessed before identities are known). Rawls’s difference principle regulates *realized outcomes* (ex-post welfare).  
  - **Critical for Conclusion? YES.**  
    - Maximizing *ex-ante* expected utility can permit severe *ex-post* inequality (e.g., if one position has extremely low utility but low probability). Utilitarianism ignores distribution if the sum is unchanged.  
    - The difference principle minimizes maximum *ex-post* disadvantage, rejecting trade-offs that sacrifice the worst-off.  
    - **Survival of argument**: If society cares about ex-post fairness (non-exploitation, dignity), maximizing ex-ante expectation is insufficient.  

  #### Non-Critical (Decorative) Breaks:  
  - **The "Prizes"**: Mapping life prospects to utilities is defensible if utilities represent comprehensive goods (Rawls rejects this; utilities are thin in the original position).  
  - **Rationality**: Both models assume instrumental rationality. Rawls’s "timidity" critique is substantive, not structural.  

  ### III. A Defensible Alternative: Salvaging the Veil Without Utilitarianism
  The strongest defense of the veil that incorporates lottery-like reasoning *without* collapsing to utilitarianism:  
  1. **The veil as a device for impartiality**: Forces choosers to consider all perspectives *symmetrically*.  
  2. **Uncertainty, not risk**: No probabilities are assigned; parties must choose as if they *could* be anyone.  
  3. **Rational choice under uncertainty**: Maximin (or lexical priority) is rational when:  
     - The stakes involve fundamental interests (basic liberties, self-respect).  
     - Some outcomes are unacceptable ("strains of commitment").  
     - Probabilities are unknown/non-comparable.  
  4. **Outcome**: Prioritizing the worst-off position becomes rational, as it minimizes maximum possible regret/loss.  

  ### IV. Conclusion: Does the Argument Survive?
  **No.** The three critical breaks are fatal:  
  1. **Equal probabilities are assumed but unjustified** under Rawls’s epistemic constraints. Without them, Harsanyi’s sum lacks equal weights.  
  2. **The single chooser conflates individual rationality with social value**. Contractual agreement ≠ utility aggregation.  
  3. **Ex-ante optimization ignores ex-post moral claims**. The difference principle addresses realized injustice, not statistical risk.  

  The lottery analogy holds only if Rawls’s veil is reinterpreted as a risky choice with known equal probabilities—a move Rawls explicitly rejects. Your colleague’s conclusion (utilitarianism) relies on assumptions Rawls denies, making the analogy question-begging. The veil’s power for Rawls lies in its ability to model *impartiality without aggregation*.
