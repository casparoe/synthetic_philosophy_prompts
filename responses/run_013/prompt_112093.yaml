prompt: |-
  I chair the competences working group of the constitutional assembly that is drafting a charter for a union of twelve formerly sovereign regions. The assembly votes in six weeks on the charter's competence clause, and my group has to put a single recommended text in front of it. I would like a written opinion I can circulate before our next drafting session.

  Where we are stuck. Three drafts are on the table, and the group is split roughly three ways.

  Draft A (political). The union may exercise a shared competence only where action by one region, or by several regions acting together, would be manifestly insufficient to secure the objective, and where union action would secure it at materially lower cost or on a materially broader scale. Enforcement sits with the Regions' Chamber: within eight weeks of a proposal's publication, two thirds of the chamber may serve a reasoned objection, to which the commission must respond publicly within sixty days. The commission may proceed anyway. Courts may not review compliance.

  Draft B (judicial). The same substantive test, but any region may challenge a union act in the Constitutional Court within three months; the court must annul acts that fail the test; the burden of showing necessity rests on the union; and the court may not second-guess the union's assessment of how important the objective is.

  Draft C (weak-form). The court may declare an act non-compliant and remand it to the legislature, but may not annul; the Regions' Chamber then gets a second reading with a lower threshold. Any union competence exercised under the clause lapses after twelve years unless re-enacted.

  What is actually dividing us. One faction reads subsidiarity as a principle of autonomy: a higher body may act only to help a lower one do what it cannot do for itself, never to supplant it. The other reads it as a principle of efficiency: allocate each task to the level that does it best, with no presumption either way. I have also noticed an inconsistency I cannot resolve. The members who want the strongest possible protection for regional control over schooling, language, and culture are the same members who want the union to override regions on the bill of rights, which binds both levels, and on free movement, which some poorer regions say is strangling them. We are also studying how the United States, Germany, Switzerland, and the European Union have handled this, though the group does not want a survey; it wants reasoning it can argue with. No literature review or citations needed.

  What I want from you. Act as a constitutional lawyer and political philosopher who works on comparative federalism and on subsidiarity as a normative principle. Spend a few sentences at the start brainstorming the real choice here — what is genuinely at stake, and which of our three drafts actually differs from which — and label that part as brainstorming. Then write the opinion, roughly 1,200 to 1,800 words.

  It should: recommend one draft, or a specific hybrid whose clause language you supply; specify the trigger, the majority required, the review timeline, and the standard of review, since those details are where the drafts do their real work; explain what conception of the political community each option presupposes, and say whether the choice among them is a substantive moral choice or merely an institutional design choice; and distinguish what a subsidiarity clause strictly requires from what it merely fits well with, since I suspect some of our disagreement is about outcomes rather than about who decides. Give the strongest argument against your own recommendation its full weight, especially the charge that local control has historically shielded local injustice, and the charge that a justiciable necessity test simply transfers contested policy choices to judges while pretending to be neutral. Close with a short section headed "What would change my mind": the argument or consideration that would move you to a different recommendation, and the point in your reasoning where you think you are most likely to be wrong.

  Write in American English.
reasoning: |-
  Okay, the user chairs a competences working group drafting a constitutional charter for a union of twelve regions. They're stuck between three drafts (A, B, C) for the subsidiarity clause and need an opinion to circulate. Let me unpack this.

  First, the core conflict: one faction sees subsidiarity as autonomy (higher bodies only step in when lower ones absolutely can't act), while the other sees it as efficiency (assign tasks to whichever level performs best). There's also inconsistency—members wanting strong regional control over culture simultaneously want union override on rights and free movement. Interesting tension there.

  Hmm, the user explicitly wants no literature review but deep reasoning. They need clarity on what's substantively at stake between the drafts. Let me mentally map the differences:
  - Draft A is political (Regions' Chamber blocks via supermajority, commission can override)
  - Draft B is judicial (constitutional court annulment power)
  - Draft C is weak-form (court only remands, sunset clause)

  The inconsistency they noted is key. It suggests that beneath procedural debates lurk substantive priorities: these members want localism for identity issues but centralism for rights/economics. That's not hypocrisy—it reveals subsidiarity as context-dependent. The procedural design must accommodate this duality.

  For the recommendation... Draft B seems strongest but needs tweaking. Judicial review is unavoidable here because:
  - The autonomy faction won't trust political oversight alone (Draft A lets commission override objections)
  - The efficiency faction needs certainty (Draft C's sunset clause creates instability)
  But! Must address the "justices making policy" concern. Maybe propose a hybrid: court reviews process/proportionality, not policy merit. Burden on union to show necessity, but courts defer to legislative facts. 

  Biggest counterargument: local injustice. True, local control can enable oppression. But counter that by noting the bill of rights already constrains regions—subsidiarity isn't their only check. Also, free movement might need asymmetric solutions (transition periods? compensation?). The clause shouldn't try to fix everything.

  "Brainstorming" section should frame this as: Drafts A vs B are about who guards subsidiarity (politicians vs judges), while Draft C is about weakening union power structurally. The inconsistency reveals that subsidiarity isn't monolithic—it needs flexible enforcement.

  For the closing "what would change my mind": if evidence shows courts consistently misinterpret necessity tests to centralize power, I'd shift to Draft A with tighter override rules. Or if regions have deep trust, Draft C's experimental approach could work. But absent that, judicial review with constrained standards is safest.

  User's tone suggests urgency and frustration. They need something that acknowledges the deadlock but moves past procedural debates to core principles. Highlighting the bill of rights/free movement tension might help members see their own priorities more clearly.
answer: |-
  ## Memorandum: Subsidiarity Mechanism Recommendation for the Union Charter

  **To:** Members, Competences Working Group, Constitutional Assembly  
  **From:** Chair, Competences Working Group  
  **Subject:** Recommendation on Draft Subsidiarity Enforcement Mechanisms (Drafts A, B, C)  
  **Date:** October 26, 2023

  ---

  ### I. Brainstorming: The Core Stakes and Distinctions

  Our impasse reflects a fundamental tension inherent in subsidiarity: **Autonomy vs. Effective Governance.** Draft A prioritizes political negotiation, trusting regional representatives (via the Regions' Chamber) as the primary guardians of subsidiarity, but risks gridlock or political override of genuine necessity. Draft B prioritizes legal certainty and regional protection by empowering the Constitutional Court as the final arbiter, but risks judicial overreach into policy and potential centralization bias. Draft C prioritizes legislative dialogue and temporal flexibility, weakening both political and judicial enforcement via non-annulment and sunset clauses, but risks instability, regulatory uncertainty, and potential erosion of subsidiarity through legislative inertia.

  The *real differences* are:
  1.  **Primary Guardian:** Chamber (A) vs. Court (B) vs. Dialogue/Time (C).
  2.  **Finality:** Political (A - Commission can proceed) vs. Judicial (B - Court annuls) vs. Legislative/Ephemeral (C - Remand/Sunset).
  3.  **Standard of Review:** Implicit political judgment (A) vs. Explicit judicial "necessity" test (B) vs. Procedural/Legislative reconsideration (C).
  4.  **Stability:** Stable unless blocked (A), Stable unless annulled (B), Inherently Temporary (C).

  The inconsistency noted (protecting culture/education vs. overriding on rights/free movement) reveals subsidiarity is **not monolithic.** It is context-dependent. Members rightly intuit that some objectives (fundamental rights, core market freedoms) are inherently union-wide and require uniform application to be meaningful, justifying a stronger union role despite subsidiarity concerns in *those specific areas*. This doesn't negate subsidiarity; it highlights that the *objective itself* shapes the level where competence naturally resides. Our clause governs the *process* for resolving disputes over *which* objectives genuinely require union action under the subsidiarity principle, acknowledging that the principle applies differently to different policy areas.

  ---

  ### II. Recommended Approach: A Refined Draft B (Judicial Review with Constrained Standards)

  After careful consideration of the principles at stake, institutional dynamics, and the need for both effective union action and robust regional protection, **I recommend adopting Draft B as the foundation, with specific refinements to address core concerns.** The refined clause would read:

  > **Section X: Principle of Subsidiarity**
  >
  > 1.  In areas of shared competence, the Union shall act only if and insofar as the objectives of the proposed action cannot be sufficiently achieved by the Regions acting individually or collectively, but can rather, by reason of the scale or effects of the proposed action, be better achieved at Union level. The Union Institutions shall demonstrate that this necessity test is met in the explanatory memorandum accompanying any legislative proposal.
  > 2.  Any Region may challenge the compliance of a Union act with this principle before the Constitutional Court within three months of its publication.
  > 3.  The Constitutional Court shall review whether the Union has demonstrated that the conditions in paragraph 1 are met. The burden of proof rests with the Union. The Court shall assess the adequacy of the reasoning and the procedural compliance, including the assessment of regional capacity and comparative effectiveness, but shall not review the Union's determination of the importance of the objective pursued unless manifestly unreasonable.
  > 4.  If the Court finds the act non-compliant with the principle of subsidiarity, it shall annul the act in whole or in part.

  **Key Details:**
  *   **Trigger:** Any Region (acting individually).
  *   **Timeline:** Challenge must be filed within 3 months of the act's publication.
  *   **Majority Required:** Court decision by standard majority (as per Court rules).
  *   **Standard of Review:** **Structured Necessity Review:**
      *   **Burden:** Firmly on the Union to demonstrate necessity and comparative effectiveness.
      *   **Scope:** Court reviews the *adequacy of the Union's justification* (reasoning, evidence of regional insufficiency, demonstration of union-level added value - materially lower cost/broader scale as in Draft A can be part of this) and *procedural compliance*.
      *   **Deference:** Court **does not** substitute its judgment for the Union's on the *importance* of the objective itself, nor on the precise *merits* of the chosen policy instrument, barring manifest unreasonableness. It focuses on the *subsidiarity justification*.
      *   **Annulment:** Full annulment power is retained as the necessary remedy for a breach of a fundamental constitutional principle.

  ---

  ### III. Reasoning & Underlying Conceptions

  1.  **Addressing the Core Divide: Autonomy vs. Efficiency:**
      *   Draft B best navigates the tension. While rooted in protecting regional autonomy (the "cannot sufficiently" limb), it explicitly incorporates efficiency ("better achieved") as a legitimate union rationale. The judicial review mechanism provides a neutral(er) forum to assess whether the Union has genuinely met this dual test, protecting regions from political override (a weakness of Draft A) while forcing the Union to rigorously justify its action.
      *   **Conception of Community:** This presupposes a **compound republic.** Regions are vital, autonomous entities forming a union for specific, demonstrably shared benefits. Trust is necessary but insufficient; formal, independent arbitration is required to resolve disputes over competence boundaries, balancing the need for both self-rule and shared rule. It views subsidiarity as a judicially enforceable *limit* on union power, essential for legitimizing the union structure itself.

  2.  **Why Judicial Review (Draft B) over Political Review (Draft A)?**
      *   **Credibility for Autonomy Faction:** Draft A's fatal flaw is the Commission override. It renders the Regions' Chamber's objection advisory, undermining the principle it purports to protect. Regions fearing centralization will see it as a fig leaf. Judicial annulment provides a real check.
      *   **Effectiveness for Efficiency Faction:** While requiring justification, Draft B allows the Union to act effectively *if* it meets the burden. Draft A creates significant potential for obstructionism (2/3 Chamber objection), even for efficient/necessary action, due to political maneuvering unrelated to subsidiarity.
      *   **Neutral Arbiter:** Political bodies (Chamber, Commission) have inherent conflicts of interest in competence disputes. A Constitutional Court, operating under defined legal standards, offers a more principled forum. The "no review" clause in A invites Union overreach.
      *   **Certainty and Finality:** Draft B provides legal certainty – an act either stands or falls based on a defined test. Draft A creates prolonged political uncertainty (objection, response, potential override) without final resolution on the principle itself.

  3.  **Why Judicial Review (Draft B) over Weak-Form (Draft C)?**
      *   **Defending the Principle:** Subsidiarity is a foundational constitutional principle. Allowing legislation violating it to remain in force after a court finding (mere declaration/remand) fundamentally weakens its status. Annulment upholds the constitution's supremacy.
      *   **Avoiding Instability:** The 12-year sunset clause is deeply problematic. It creates regulatory uncertainty for citizens and businesses. It incentivizes short-termism in policy. Crucially, it implies subsidiarity violations are tolerable if temporary, undermining its normative force. A competence proven necessary *once* (e.g., environmental standards, network infrastructure) likely remains necessary.
      *   **Meaningful Remedy:** Remand to a legislature operating under a lower threshold (C's "second reading") offers little real protection. The political dynamics that passed the act initially are likely to prevail again. Annulment forces a fundamental reconsideration.
      *   **Conception of Community:** Draft C leans towards a **decentralized unitary state** or a **trial union.** It prioritizes ease of union action and legislative flexibility over robust regional constitutional safeguards. The sunset clause implies competences naturally accrete to the center unless actively contested, reversing the subsidiarity presumption.

  4.  **Substantive Moral Choice vs. Institutional Design:**
      Choosing subsidiarity's *enforcement mechanism* is fundamentally an **institutional design choice with profound substantive implications.** Draft B reflects a substantive moral commitment that **constitutional limits on power must be justiciable** to be meaningful, especially when protecting smaller entities against a larger whole. Choosing A prioritizes political expediency over enforceable limits. Choosing C prioritizes legislative flexibility and union experimentation over constitutional rigidity. The choice reflects *how seriously* the Union takes subsidiarity as a constraint and regional autonomy as a value worth defending through independent adjudication.

  5.  **Distinguishing Subsidiarity's Core from Desired Outcomes:**
      Subsidiarity strictly requires a **procedural and justificatory discipline** focused on the *level* of action: *Can regions sufficiently achieve X? Would the Union achieve X better?* It is **not** about:
      *   *Whether X is a good policy.* (Policy merit is for the legislature).
      *   *Whether we like the outcome of regional action.* (Local control *can* shield injustice – addressed by the Bill of Rights binding *all* levels).
      *   *Protecting specific policy domains absolutely.* (Culture/language protection may be bolstered by *specific* competence allocations or rights, not solely by subsidiarity. Free movement's "strangling" effect is a distributive/compensation issue, potentially solvable by union fiscal mechanisms, not inherently a subsidiarity violation if free movement is a core union objective).
      Draft B, with its constrained standard (reviewing justification, not policy choice/objective importance), best focuses judicial review on subsidiarity's core question, minimizing policy substitution.

  ---

  ### IV. Confronting the Strongest Counterarguments

  1.  **"Judicializing Politics / Pretend Neutrality":** This is a serious charge. Critics argue judges lack democratic legitimacy and technical expertise to assess "necessity" or "better achievement," inevitably making policy choices disguised as legal ones. They fear a centralizing bias in courts.
      *   **Response:** The refined standard directly addresses this. By focusing on the *adequacy of the Union's justification* (did it consider regional capacity? Did it provide plausible evidence for comparative effectiveness?), demanding the Union bears the burden, and explicitly *deferring* to the Union on the *importance of the objective* and *policy choice*, the court's role is constrained. It reviews *process* and *reasoning* against a constitutional standard, not the wisdom of the policy itself. While not perfect, it's superior to political self-policing (A) or no effective enforcement (C). Historical examples (e.g., EU Court, German FCC) show courts *can* apply subsidiarity-type tests without wholesale policy takeover, especially with clear standards limiting their scope.

  2.  **"Local Control Shields Injustice":** Absolutely true historically. Local majorities can oppress minorities. This is why our *Bill of Rights is paramount and binds all levels.* Subsidiarity governs *competence allocation*, not the *substance* of fundamental rights protection. The Union must have the power (and duty) to enforce fundamental rights against regions – this is non-negotiable and should be explicit in other competence clauses or rights enforcement mechanisms. Subsidiarity is irrelevant here; union action is mandated by the higher constitutional norm of fundamental rights. Protecting culture/language is distinct; it's a legitimate regional competence where subsidiarity *does* apply to prevent unnecessary union intrusion, balanced against non-discrimination rights.

  ---

  ### V. What Would Change My Mind

  *   **The Argument:** A compelling demonstration that even under the constrained standard proposed (burden on Union, review of justification/procedure, deference on objective/policy choice), constitutional courts in comparable federations *consistently* misinterpret or manipulate "necessity" and "comparative effectiveness" tests to aggressively centralize power, overriding legitimate regional concerns in a wide range of policy areas *beyond* core federal functions like rights and market regulation. This would show the judicial mechanism is inherently corrosive to federal balance in practice, regardless of doctrinal safeguards.
  *   **Where I Might Be Wrong:** My greatest vulnerability lies in **institutional trust**. Draft B relies heavily on the integrity, competence, and self-restraint of the Constitutional Court. If the Court lacks independence, is captured by centralizing interests, or proves incapable of applying the nuanced standard without overreaching, the mechanism fails catastrophically. Draft A, despite its flaws, keeps the decision within the political branches, which, while imperfect, are directly accountable. If evidence suggests our nascent Union lacks the conditions for a genuinely independent and legally sophisticated court capable of handling this delicate role, the political safety valve of Draft A, perhaps with a *higher bar for Commission override* (e.g., requiring a supermajority in the Union legislature), might become the lesser evil.

  ---

  ### VI. Conclusion

  The choice before us is not merely technical; it defines the soul of our Union. Draft B, refined to focus judicial review on the adequacy of the Union's subsidiarity justification while deferring on core policy choices and objective importance, strikes the optimal balance. It takes subsidiarity seriously as a justiciable constitutional limit, protecting regional autonomy against unnecessary centralization, while enabling the Union to act decisively where it can demonstrably add unique value. It provides certainty and finality lacking in Drafts A and C. It acknowledges that while political dialogue is vital, an independent arbiter is necessary to resolve fundamental disputes about competence boundaries in a compound republic. The concerns about judicial overreach and local injustice are valid but are best addressed by constraining the court's standard and ensuring robust fundamental rights enforcement, not by abandoning effective subsidiarity review. I urge the Group to support this refined Draft B approach as the strongest foundation for a balanced and durable Union.
