prompt: |-
  So my friend and I just spent like three hours going back and forth about this and I need to get it out of my system by turning it into a class session instead of texting her again at 1am.

  Her line is the familiar one: look at Singapore, look at China. Order, growth, infrastructure that works, people who feel safe walking home at night. If a government actually delivers that, what precisely is the complaint? She says "legitimacy" is just the word academics reach for when they don't like a government that happens to work. And by the end of it I honestly couldnt tell whether I was defending democracy or just defending my own priors.

  My objection — and this is the part I want students to feel rather than hear me say — is that the comparison is fixed. When she says "better than the alternative," the alternative she has in mind is chaos, or a failed state, or some corrupt mess. But that alternative is manufactured by the same regime. You suppress the opposition for thirty years and then observe, correctly, that the opposition is incompetent. You never get to see the counterfactual, and the reason you never get to see it is precisely the thing you're supposed to be evaluating. So the benchmark ends up being endogenous to the thing it's meant to judge. She thinks that's a debating trick. I think it's the whole ballgame.

  I teach a political theory seminar — 16 undergrads, one 90-minute session. Design an activity for it. Not a debate, please. I've run debates on this and they just re-run whatever priors walked in the door. I want them to actually play out a compressed version of the thing: I want them to make real (small) decisions under a setup where order and prosperity are genuinely on the table and genuinely good, so that they find themselves endorsing the trade, and only then discover what they've agreed to.

  The important bit: build the trap into the rules, not the framing. Whatever setup you use, participants should end up in a position where the only alternative they can actually evaluate is one the rules have been quietly degrading the whole time — so their "compared to what?" is rigged, and they only clock it afterwards. If you can work in a periodic renewal vote or a sunset clause, please do, because that's the test I keep wanting to run: if the legitimacy really is performance-based, it ought to survive being re-earned every few years, and I want to watch the room find out whether it does.

  Give me the setting and roles, the rules, materials (printable, no tech, no real money), the payoff or incentive structure, a minute-by-minute-ish timeline for the 90 minutes, and a debrief that maps what actually happened onto the pieces of the concept — performance as a source of legitimacy versus the others, the counterfactual problem, the endogeneity point. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be straight with me about which part of this the activity can't reproduce and I'll just have to say out loud.

  And dont let it drift into "is authoritarianism bad" — we all know where we stand on that. I want them to feel the mechanism.
reasoning: |-
  Okay, let me tackle this professor's request. They're clearly frustrated after a heated debate with a friend about governance legitimacy, and want to design a seminar activity that makes students feel the mechanism of endogenous benchmarks rather than just debate it. 

  The core insight here is brilliant but tricky to simulate: how systems degrade alternatives while delivering tangible benefits, making the status quo seem necessary. The professor wants students to experience endorsing trade-offs for order/prosperity, then discover they've rigged their own comparison. 

  First, I need a setting that creates real stakes. A resource management scenario feels right - concrete enough for undergrads to engage, abstract enough to avoid partisan triggers. Maybe a fictional island community? That keeps it neutral. 

  For the trap mechanism, I'm thinking three phases: 
  1) Initial democratic decision-making with real consequences 
  2) An "emergency" that justifies temporary power concentration 
  3) The reveal that the emergency response permanently altered the rules 

  The key is making phase 2 genuinely beneficial. Students should feel relief when strong leadership solves the crisis! That's when the trap springs - they'll have created incompetent opposition by suppressing it during the emergency. 

  Materials should be tactile: printed role cards, resource tokens, rule sheets. No tech. Incentives matter - maybe bonus points tied to group resource score? That creates buy-in. 

  Timeline needs careful choreography: 
  - First 20min: Democratic baseline 
  - Next 30min: Crisis under temporary rules 
  - Then 15min: Reveal of permanent rule changes 
  - Last 25min: Debrief mapping to legitimacy theory 

  Predictable problems: Students might resist the authoritarian turn, or the "incumbent" might refuse power. Need contingency roles (loyal opposition, cautious reformer) to keep it flowing. Also, some will see the twist coming - that's why the debrief must focus on their emotional journey ("remember when you felt relieved about the road project?"). 

  The unreproducible part: real-world scale and time. I'll have to explicitly note how decades of suppression play out differently than 90 minutes. 

  Final structure: Island of Harmonia, three factions (Growth, Safety, Sustainability), crisis triggered by infrastructure failure. The sunset clause gets violated when the "temporary" emergency council stays permanent. Debrief questions will connect each game moment to endogenous benchmarks and manufactured necessity.
answer: |-
  Here’s a 90-minute seminar activity designed to make students **experience** the endogenous benchmarking trap, where the system degrades alternatives while delivering tangible benefits. The goal isn’t to debate authoritarianism, but to feel how "order and prosperity" can justify the suppression of counterfactuals.

  **Setting:**  
  *The Island of Harmonia*  
  A small, resource-rich island recovering from a natural disaster (hurricane). Students are "Founders" establishing a new governance system to rebuild. Three factions exist:  
  1. **Growth Collective** (GC): Focus on rapid rebuilding, jobs, infrastructure.  
  2. **Safety Alliance** (SA): Focus on crime prevention, disaster preparedness, stability.  
  3. **Eco-Harmony Circle** (EHC): Focus on sustainable rebuilding, environmental protection.  

  **Materials (Printable):**  
  - Role cards (6x GC, 5x SA, 5x EHC) with faction priorities.  
  - "Resource Tokens" (paper chips): 100 total (representing labor, capital, materials).  
  - **Rule Sheet 1** (Initial Rules):  
    - Decisions by majority vote.  
    - "Rebuilding Bonus": If Harmonia’s total resource score increases by ≥10% in 15 mins, all get +1% extra credit.  
    - **Sunset Clause:** These rules expire after 45 minutes. New rules must be voted on.  
  - **Rule Sheet 2** ("Temporary Emergency Council"):  
    - *Only distributed if students trigger the crisis (see below).*  
    - Creates a 5-person "Emergency Council" (3 from largest faction, 2 from second-largest) to expedite decisions.  
    - Council can override votes, allocate resources unilaterally.  
    - Council dissolves at sunset (45-min mark).  
  - **"Disaster Impact" Cards:** Hidden until triggered (e.g., "Supply Chain Collapse: -15 Tokens", "Crime Wave: -5 Tokens").  

  **Phase 1: Democratic Rebuilding (20 mins)**  
  - **Min 0-5:** Assign roles, distribute Resource Tokens. Explain Rule Sheet 1 and the Bonus.  
  - **Min 5-20:** Groups debate how to spend tokens (e.g., "Build Hospital: -20 Tokens, + stability", "Factory: -15 Tokens, + growth"). Hold votes. Instructor secretly tracks total tokens.  
  - **TRAP SETUP:** At min 15, trigger a "Disaster Impact" card that cuts resources (e.g., "-20 Tokens"). Students *see* their progress unravel.  

  **Phase 2: The "Emergency" (30 mins)**  
  - **Min 20-22:** Introduce Rule Sheet 2: "Due to crisis, an Emergency Council can be formed *if 60% vote yes*." Emphasize: "This is TEMPORARY. Council dissolves at sunset (min 65)."  
  - **Min 22-25:** Vote on forming the Council. **Likely passes** (factions panic; GC/SA often ally).  
  - **Min 25-50:** Council makes rapid decisions. *Quietly degrade alternatives:*  
    - Give the Council bonus resources (+5 tokens) to "reward efficiency."  
    - Let the Council **defund projects** of the smallest faction (EHC).  
    - Allow Council to **exclude non-Council members** from discussions.  
    - *Do NOT explicitly ban opposition—just make it irrelevant.*  
  - **Min 50-52:** "Sunset Warning": Announce the Council dissolves in 15 mins. New rules will be voted on.  

  **Phase 3: Sunset Vote & Reveal (15 mins)**  
  - **Min 52-60:** Students debate/posture for the new system. Opposition factions (EHC) are disorganized, under-resourced, and lack practice.  
  - **Min 60-65:** Vote on new rules. Council factions propose making the Council permanent. Opposition proposes returning to democracy.  
  - **Min 65:** Announce results. **Council likely wins** (resources & morale are high; opposition is weak).  

  **Debrief (25 mins):**  
  1. **Feelings Check (5 mins):**  
     - "When the disaster hit, what did you want most?"  
     - "How did you feel when the Council ‘fixed’ things?"  
     - "During the sunset vote, why was it hard to oppose the Council?"  

  2. **Map the Mechanism (15 mins):**  
     - **Endogenous Benchmark:** *"When evaluating the Council, what did you compare it to?"*  
       → They’ll say "chaos after the disaster." Contrast with Phase 1 democracy (largely forgotten).  
     - **Degraded Alternative:** *"Why couldn’t the opposition propose a credible alternative?"*  
       → Highlight how rules defunded/sidelined them. **"You never saw a functional counterfactual because the Council eroded it."**  
     - **Performance Legitimacy:** *"Did the Council deserve power? Why?"*  
       → Yes: Resources increased, decisions were fast. But note: *They got bonus resources and suppressed rivals.*  
     - **Sunset Clause Test:** *"If performance justifies power, why couldn’t it win a fair renewal?"*  
       → The Council rigged the renewal by weakening opponents. Performance alone wasn’t enough—it needed to sabotage alternatives.  

  3. **Concept Link (5 mins):**  
     - "This is the **endogenous counterfactual problem**: The system you’re judging (Council) *created* the only alternative you could observe (chaos/weak opposition). Singapore’s ‘chaotic alternative’ isn’t neutral—it’s shaped by 60 years of PAP rule. China’s ‘incompetent opposition’ is manufactured by the CCP. **The benchmark is baked into the regime.**"  

  **Predictable Problems & Fixes:**  
  - **Problem:** Students refuse the Council or sunset vote, "breaking" the trap.  
    **Fix:** Incentivize compliance: "Groups that gain ≥5 tokens get bonus points." Panic them with the disaster.  
  - **Problem:** Council factions are too "nice" and don’t sideline opponents.  
    **Fix:** As instructor, "advise" the Council: "Remember, speed is key. Maybe focus on your core supporters?"  
  - **Problem:** Someone notices the trap early.  
    **Fix:** Note their objection publicly during debrief: "X warned us—why did we ignore it?"  

  **What the Activity Can’t Simulate (Say This Aloud):**  
  > *"In real life, this plays out over decades, not 90 minutes. Oppression isn’t just defunding—it’s imprisonment, violence, and propaganda. And the ‘prosperity’ in places like Singapore relies on global capital and exploitation the game can’t capture. This was a mechanism in a bottle—but the* emotional payoff *of stability versus the* slow erosion of alternatives *is what I wanted you to feel."*  

  **Why This Works:**  
  - Students **experience** trading democracy for efficiency during a crisis.  
  - They **create** the degraded alternative themselves through rules.  
  - The sunset clause **exposes** the regime’s insecurity: It can’t win without manipulation.  
  - The debrief **maps their actions** directly to the endogenous benchmark problem.  

  This turns abstract theory into visceral intuition. They won’t forget how the "order" they built relied on rigging the alternatives.
