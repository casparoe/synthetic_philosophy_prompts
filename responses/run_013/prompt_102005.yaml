prompt: |-
  I keep going back and forth on whether patriotism is a virtue, a vice, or just a personality trait like liking spicy food, and I'm hoping you can help me figure out what principle (if any) my gut is actually tracking. You're a political philosopher who's spent a lot of time on partiality, loyalty, and national identity — so please think carefully and don't just give me the standard for-and-against list. Start by brainstorming a bunch of candidate principles (at least five, including some weird ones), then test them against my cases, then give me your best one or two, stated precisely.

  Here are my verdicts, going by gut:

  1. My neighbor flies the flag on the 4th. I don't think this is virtuous or vicious; it's like putting up Christmas lights.
  2. Someone spends their weekends restoring a local war memorial because it's their town's memorial. I think that's genuinely admirable, even if the same hours could have gone to a global charity.
  3. Someone refuses to read a book critical of their country's founders because it feels disloyal. I think that's a small vice — a failure, not just a taste.
  4. A voter supports a tariff that will hurt poor workers abroad mainly because it helps their own country's workers. I think that's a vice, though maybe a mild one.
  5. A soldier in a country that's being invaded takes up arms to defend it, knowing this will kill invaders. I think that's admirable, not a vice at all.
  6. A citizen of a wealthy country agitates to let in more refugees, even though it will make their own countrymen slightly worse off. I think that's admirable too, and I don't think it's unpatriotic.
  7. Someone emigrates, naturalizes elsewhere, and stops caring about their birth country. I don't think they've done anything wrong.
  8. But someone who feels no attachment to any place or people at all, and thinks that's the enlightened position, seems to me to be missing something important — not evil, but diminished.
  9. Cheering for the national team and getting a lump in your throat at the anthem: fine, maybe even good.
  10. An employer requiring workers to sing the anthem at the start of the workday: creepy, and I'd call it a vice of the employer.
  11. A person who celebrates their country's historical massacres as proof of greatness: clear vice.
  12. A person who constantly tells foreigners about their country's historical crimes, in a way that seems mostly designed to show off their own virtue: I think that's also a vice, though a different one.
  13. Someone who disobeys their country by refusing to fight in a war they believe is unjust: admirable, and I think it can be a form of patriotism, not a betrayal.
  14. Someone who burns their passport on TV mainly to express contempt for their fellow citizens: I think that's vicious, even if their criticisms are correct.

  I've been toying with a distinction I made up, between 'warm patriotism' — attachment to a particular place, its landscape, rituals, food, neighbors, dead — and 'cold patriotism' — loyalty to the state as an institution, its flag, its army, its borders. I thought maybe warm patriotism is a virtue and cold patriotism is a vice, but case 5 and case 6 seem to mess that up. Also case 8 suggests maybe some warm attachment is required for a good life, which is a stronger claim than just 'it's not a vice.' I definately don't want to just seperate the cases into ones I like and ones I don't and call that a principle.

  What I want from you: a principle, or a small set of principles, that gets as many of my verdicts as possible, says which ones I should probably give up, and tells me what it predicts for a case I haven't listed — say, a person who loves their country's culture and people but thinks its government is illegitimate and works to undermine it. Also, if my warm/cold distinction is doing any real work, say what work; if it's just relabeling, say that too.

  Please write it as if you're talking to someone who knows some philosophy but isn't a specialist, and be honest about which verdicts your principle can't save. If you think there's no single principle, give me the best disjunctive one and tell me where the joints are.
reasoning: |-
  Hmm, the user is wrestling with the morality of patriotism—whether it's good, bad, or neutral. They've listed 14 specific cases where their gut gives a verdict, showing a nuanced view. For example, they see restoring a war memorial as admirable but refusing to read critical books as a vice. They also invented a "warm vs. cold patriotism" distinction but admit it's messy, especially in cases like defending against invasion (case 5) or advocating for refugees (case 6). Their unspoken need seems to be a coherent ethical framework that explains these intuitions without inconsistency.  

  I need to brainstorm candidate principles that could unify their judgments. First, **Particularized Care as Human Good**: this treats attachments to specific things (like hometowns) as intrinsically valuable for a full life. It explains why the war memorial restoration (case 2) is good and why feeling no attachment at all (case 8) feels deficient. But it might struggle with case 5 (soldier defending country), where loyalty to the state is involved.  

  Second, **Instrumental Justification**: patriotism is only good if it serves broader moral goals like justice or human welfare. This handles cases like the tariff (vice in case 4, because it harms foreigners) or the refugee advocate (virtue in case 6). But it might reduce warm patriotism to mere utility, which clashes with the intrinsic value the user senses in case 2.  

  Third, **Anti-Fetishism**: patriotism becomes vicious when it treats symbols (flags, anthems) as sacred ends in themselves. This explains why burning passports for contempt (case 14) is bad while disobeying unjust wars (case 13) can be patriotic. Case 10 (forced anthem singing) fits perfectly here as creepy fetishization.  

  Fourth, **Epistemic Responsibility**: patriotism requires honest engagement with your country's flaws. This makes refusing critical books (case 3) a vice and celebrating historical crimes (case 11) clearly wrong. But it doesn’t cover all cases, like emigration (case 7).  

  Fifth, **Non-Exclusivity**: patriotism is only virtuous when it doesn’t deny equal moral concern to outsiders. This explains why the tariff (case 4) is a mild vice (favoring compatriots unjustly) while helping refugees (case 6) is admirable. Case 5 (soldier defense) is an exception because invasion justifies exclusive focus.  

  The best synthesis is **Anti-Fetishism + Non-Exclusivity**. Anti-Fetishism covers symbolic excesses (cases 10, 11, 14) and distinguishes healthy from toxic loyalty. Non-Exclusivity handles when partiality becomes immoral (cases 4, 6). For warm attachments, **Particularized Care** explains their intrinsic value (cases 2, 8, 9) without demanding state loyalty.  

  Testing against their cases:  
  - Most fit (e.g., case 1 is neutral under Particularized Care; case 13 is Anti-Fetishist loyalty).  
  - Tension in case 5: defending the state isn’t fetishism if it protects real people (so Non-Exclusivity’s invasion exception applies).  
  - Case 7 (emigration) is fine—attachments can shift per Particularized Care.  

  For their unlisted case (loving culture but undermining government): it’s virtuous if the state is unjust (Anti-Fetishism rejects blind loyalty) and the person acts via Non-Exclusivity (e.g., for human rights).  

  Their warm/cold distinction does work: "warm" maps to Particularized Care (morally optional but enriching), while "cold" often overlaps with fetishism or unjust exclusion. But it’s not perfect—defending against invasion (cold-seeming) is justified instrumentally.  

  Principles predict:  
  - **Virtue**: A person who funds local archives *and* global aid, critiques their country honestly.  
  - **Vice**: Someone who demands anthem singing while cutting healthcare (fetishism + exclusion).  

  User should reconsider case 5 if they reject all state loyalty, but they can keep it by seeing defense as protecting people (warm) not just symbols (cold).
answer: |-
  Okay, let's dig into this. You're right to distrust the warm/cold dichotomy – it points to *something*, but as you saw, it fractures under pressure. Your cases reveal a complex moral landscape where patriotism isn't a single thing to be judged as wholly good or bad, but rather a *mode of attachment* whose moral status depends entirely on **how it functions** within broader ethical obligations and human flourishing. Forget "virtue or vice?" – think "under what conditions does this specific expression of partiality become praiseworthy, permissible, or problematic?"

  Here's my brainstorm of candidate principles, including the weird ones:

  1.  **The Particularized Care Principle:** Humans are finite beings who flourish through concrete attachments to particular people, places, and histories. Cultivating and acting on these attachments (like caring for *your* town memorial) is intrinsically valuable and a necessary part of a good human life. Patriotism, as one form of this, is virtuous when it expresses this care, vicious when it denies the validity of *others'* particularized care or obstructs universal moral duties.
  2.  **The Instrumental Justification Principle:** Patriotism is only morally permissible or virtuous if it reliably serves as an effective instrument for achieving universally valuable ends (like justice, welfare, peace, or cultural preservation). It becomes vicious when it undermines these ends or becomes an end in itself.
  3.  **The Anti-Fetishism Principle:** Patriotism becomes vicious when it involves the *fetishization* of symbols, institutions, or narratives – treating them as sacred objects beyond critical scrutiny or as possessing intrinsic value disconnected from the well-being of actual people. Healthy patriotism keeps symbols tethered to their underlying realities.
  4.  **The Epistemic Responsibility Principle:** Patriotism imposes a specific duty of epistemic honesty regarding the object of loyalty. Willful ignorance, denial of flaws, or historical whitewashing (case 3, 11) are patriotic *vices*. Virtuous patriotism requires clear-eyed love.
  5.  **The Non-Exclusivity Principle:** Patriotism is only virtuous when it does *not* entail the belief that the interests of compatriots *inherently* outweigh the equal moral claims of outsiders, or when the partiality it demands is strictly necessary for the survival of the community itself (e.g., defense against invasion). Otherwise, it risks becoming parochialism or jingoism.
  6.  **(The Weird One) The Narrative Integration Principle:** Patriotism is virtuous when it helps individuals integrate their personal story meaningfully into a larger, morally defensible collective narrative that fosters solidarity and purpose. It's vicious when the narrative is false, supremacist, or demands harmful conformity, leading to alienation or diminished agency (case 10, 14).

  **Testing Against Your Cases:**

  *   **Case 1 (Flag Flying):** Permissible under Particularized Care (expression), Anti-Fetishism (if not sacred), Non-Exclusivity (no harm).
  *   **Case 2 (War Memorial):** Virtuous under Particularized Care (care for concrete local history/community).
  *   **Case 3 (Refuses Critical Book):** Vicious under Epistemic Responsibility (willful ignorance), Anti-Fetishism (treating founders as sacred).
  *   **Case 4 (Protectionist Tariff):** Vicious under Non-Exclusivity (unjustified harm to outsiders for minor compatriot gain), Instrumental Justification (undermines global welfare).
  *   **Case 5 (Defending Soldier):** Virtuous under Non-Exclusivity (*defense against invasion* justifies necessary partiality/sacrifice for community survival), Instrumental Justification (defends basic rights/autonomy).
  *   **Case 6 (Pro-Refugee Citizen):** Virtuous under Non-Exclusivity (recognizes equal moral claim of outsiders), Instrumental Justification (promotes welfare/justice).
  *   **Case 7 (Emigrates/Stops Caring):** Permissible under Particularized Care (attachments can shift, new ones form; no duty to perpetual loyalty).
  *   **Case 8 (No Attachment):** Diminished under Particularized Care (lacks a key element of human flourishing – concrete bonds).
  *   **Case 9 (Cheering/Anthem Lump):** Permissible/Virtuous under Particularized Care (emotional resonance with shared ritual/community).
  *   **Case 10 (Forced Anthem):** Vicious under Anti-Fetishism (fetishizing symbol, coercive), Narrative Integration (imposed, alienating narrative).
  *   **Case 11 (Celebrates Massacres):** Vicious under Epistemic Responsibility (denial/celebration of evil), Anti-Fetishism (fetishizing violent power as "greatness").
  *   **Case 12 (Virtue-Signaling Crimes):** Vicious under Anti-Fetishism (using national *failures* as a fetishized token for self-aggrandizement, detached from genuine care or reform).
  *   **Case 13 (Refuses Unjust War):** Virtuous under Epistemic Responsibility (sees truth), Instrumental Justification (refuses instrument of injustice), Anti-Fetishism (rejects fetishized loyalty to state command).
  *   **Case 14 (Burns Passport in Contempt):** Vicious under Anti-Fetishism (fetishizes the symbol *negatively* as a pure object of contempt, detached from people), Narrative Integration (destructive alienation, not constructive critique). Instrumental Justification might see it as ineffective, but the *viciousness* comes from the expressive contempt for *people*.

  **The Best Principles (Refined and Precise):**

  After testing, two principles emerge as doing the heaviest lifting across your cases, often working together:

  1.  **The Anti-Fetishism Principle (Refined):** Expressions of patriotism are morally vicious **if and only if** they involve treating national symbols, narratives, institutions, or identity as *fetishes* – that is, as objects possessing inherent, sacrosanct value detached from the well-being of actual people (past, present, future, compatriot or foreigner), or as objects whose primary function is performative display (for allegiance or condemnation) rather than grounded connection or ethical action. *Healthy* patriotism keeps symbols tethered to the human realities they represent and uses them to foster care or justice, not as ends in themselves. *(Explains Cases: 3, 10, 11, 12, 14 strongly; underpins the wrongness in 4, 13)*
  2.  **The Non-Exclusivity Principle (Refined):** Patriotism generates morally permissible or virtuous partiality **only if** (a) the partial action does not violate fundamental duties of justice or basic rights owed to outsiders, *or* (b) the partial action is strictly necessary for the immediate survival or basic functioning of the political community against an existential threat (e.g., defense against invasion). Otherwise, patriotic partiality that systematically favors compatriots over outsiders facing comparable or greater need is a moral vice (parochialism). *(Explains Cases: 4, 5, 6 strongly; constrains 2, 13; clarifies 1, 9)*

  **Where Your Warm/Cold Distinction Fits:** It pointed towards something real! "Warm" patriotism often aligns with **Particularized Care** (concrete people, places, history), which we see as generally permissible or virtuous (Cases 1, 2, 7, 8, 9). "Cold" patriotism often aligns with the **Institutional/Symbolic Focus** that is prone to **Fetishism** (Cases 3, 10, 11, 14). However, the key isn't the *object* (warm vs. cold) intrinsically, but *how you relate to it*. You can fetishize "warm" things (e.g., a mythologized "pure" folk culture), and "cold" things can be instrumentally vital (Case 5: defending the state apparatus *to protect the people*). The refined principles capture the *functional* moral difference your gut was tracking better than the object-based distinction.

  **Verdicts the Principles Struggle With / Suggest Reconsidering:**

  *   **Case 2 (War Memorial):** Non-Exclusivity *allows* it (it doesn't *harm* outsiders, even if funds *could* go elsewhere), but doesn't fully capture *why* it feels *admirable*. The underlying **Particularized Care Principle** explains the positive value here. It's a permissible expression of care, not strictly required, but enriching. The main principles (Anti-Fetishism/Non-Exclusivity) primarily police the *vices* and set boundaries for permissible partiality.
  *   **Case 8 (No Attachment):** This strongly points to **Particularized Care** as a component of human flourishing. The main principles don't *demand* patriotism, but Case 8 suggests a life utterly devoid of *any* concrete attachments is impoverished. This is a distinct, though related, claim about human goods, not strictly about the *virtue* of patriotism itself.
  *   **Case 5 (Soldier):** If you absolutely reject *any* moral weight to loyalty to the *state* (the "cold" aspect), this case becomes harder. The Non-Exclusivity Principle justifies it via the *survival of the community* (the people, the shared life - the "warm" aspect protected by the "cold" instrument). If you think defense *only* makes sense as individual self-defense or defense of specific loved ones, not the "country," you might need to adjust this verdict. The principles assume defending the political community *can* be a legitimate collective action under existential threat.

  **Prediction for Your Unlisted Case:**

  *   **Case:** *Person who loves their country's culture and people but thinks its government is illegitimate and works to undermine it.*
  *   **Prediction (Anti-Fetishism + Non-Exclusivity):** This could be **admirable (virtuous)**. Loving culture/people = Particularized Care (good). Rejecting illegitimate government = Anti-Fetishism (rejecting the fetishized authority of the state, focusing on people's well-being). Working to undermine it is permissible *if* the government is truly unjust (violating fundamental rights domestically or abroad) and the methods are proportional/aimed at a just outcome (Instrumental Justification / avoiding new injustices). It's patriotic in the sense of loyal to the *people's true good*, not the current state apparatus. *If* the methods involved unjust harm to innocent compatriots or outsiders (violating Non-Exclusivity), it could become vicious. But the core impulse aligns with the principles.

  **The Takeaway:**

  Your gut seems to track:
  1.  **The danger of fetishization:** Patriotism turns vicious when symbols, narratives, or institutions become detached idols, demanding uncritical loyalty or inspiring destructive contempt (Anti-Fetishism Principle).
  2.  **The limits of partiality:** Favoring your own is only justified when it doesn't unjustly harm outsiders or when the community's survival is at stake (Non-Exclusivity Principle).

  Underpinning this is an acceptance that **concrete attachments (Particularized Care)** are a normal and valuable part of human life, making expressions like local care or emotional resonance permissible or even admirable, and their utter absence a kind of impoverishment. But this "warm" core is not morally unlimited; it's bounded by the strictures against fetishism and unjust exclusion. The principles explain why seemingly contradictory cases (defending country vs. welcoming refugees) can both be admirable – they avoid the two core vices in different contexts. Patriotism isn't one thing; it's a potential channel for human connection and care that must be kept free of idolatry and insulated from injustice to be morally sound.
