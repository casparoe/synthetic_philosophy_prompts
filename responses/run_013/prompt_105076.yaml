prompt: |-
  I am assembling a specification before reading any particular account of democratic backsliding, and I want the desiderata first. Set out what any adequate account of the phenomenon must deliver: the cases it has to classify correctly (Hungary after 2010, Poland from 2015 to 2023 including its partial reversal, Turkey, the United States around 2020, and, as controls, an ordinary change of government and a case of full authoritarian breakdown); the distinctions it must not collapse (backsliding from autocratization and from breakdown; de jure authority from de facto control; erosion as a matter of degree from a threshold event; a government's intentions from the effects of its actions; lawful and gradual means from extra-legal ones); the facts it must accommodate (that the work is frequently done legally, incrementally, by elected governments with genuine mandates, and is sometimes undone); and the requirement that it say who is entitled to apply the label and on what evidence, and whether the label is descriptive or an act of political alignment. For each requirement, give the case or consideration that motivates it and mark it non-negotiable or the preference of one camp. Then identify any pair of desiderata that cannot be jointly satisfied — in particular, whether an account can be at once neutral across ideological directions and substantive enough to condemn the standard cases — and say which single requirement does the most to rule out existing accounts. The response should say where its own reasoning is most likely to fail and what would change its verdict.
reasoning: |-
  Okay, the user is assembling a specification for an account of democratic backsliding before reading any particular theories. They want desiderata—essential requirements—for such an account. This is a preparatory step to ensure any framework they later study meets key criteria. 

  First, I need to parse their explicit requirements: correct case classifications (Hungary, Poland, Turkey, US 2020, plus controls), necessary distinctions (e.g., backsliding vs. breakdown), factual accommodations (legal/gradual erosion by elected governments), and labeling protocols (who applies it, evidentiary standards). 

  The user’s phrasing suggests they’re methodically constructing a litmus test, likely as an academic or policy analyst. Their emphasis on "non-negotiable" vs. "preference" hints they anticipate ideological disputes in the literature. The demand to identify irreconcilable desiderata (e.g., neutrality vs. substantive condemnation) reveals they seek conceptual rigor—they know theories have trade-offs. 

  For case classifications: Hungary (2010+) is the paradigmatic EU backsliding case; Poland (2015-2023) adds complexity with partial reversal; Turkey exemplifies full autocratization; the US (2020) tests applicability to established democracies. Controls—ordinary government change (e.g., UK 1997) vs. authoritarian breakdown (Venezuela)—ensure the theory isn’t over-alarmed or blind to collapse. Non-negotiable because misclassifying these undermines credibility. 

  Distinctions matter because: conflating backsliding with breakdown (e.g., Hungary vs. Venezuela) obscures early warnings; de jure vs. de facto (e.g., Turkey’s constitutional veneer vs. Erdogan’s control) captures stealth tactics; degrees vs. thresholds address whether erosion is a process or endpoint; intentions vs. effects handle debates like "Was Trump’s norm-breaking deliberate?"; lawful vs. extra-legal means separate Poland’s court-packing from coups. Most are non-negotiable, though intentions vs. effects is contested (e.g., structuralists vs. intentionalists). 

  Factual accommodations: Backsliding is often legal (Hungary’s constitutional amendments), incremental (Poland’s judiciary takeover), and mandate-driven (Turkey’s initial elections). Reversibility (Poland post-2023) must be explainable. These are non-negotiable—denying them ignores empirical reality. 

  Labeling protocols: Who applies the label? Academics? International bodies? This risks politicization (e.g., US left/right disputes over 2020). Evidence standards? Must avoid partisan cherry-picking. Descriptive vs. political alignment? Neutrality is ideal but hard—calling Orbán "backsliding" is inherently critical. Here, neutrality is a preference (liberal camp), while evidence rigor is non-negotiable. 

  The core tension: Can an account be ideologically neutral yet condemn standard cases? Likely not. Neutrality might require symmetric concern (e.g., "left-wing backsliding"), but most cases are right-wing. Insisting on neutrality could whitewash Hungary; condemning standard cases risks left-wing bias. This is the major fault line. 

  Existing accounts often fail by neglecting reversibility (e.g., framing backsliding as irreversible) or overemphasizing intent (ignoring structural factors). The toughest requirement is the labeling protocol—it forces theorists to admit their normative stance. 

  My reasoning’s weakest at the neutrality-substance trade-off. If someone showed a case of left-wing backsliding equally condemned by a "neutral" framework (e.g., Nicaragua’s Sandinistas), it’d challenge my skepticism. But current data skews right, making neutrality feel like false equivalence. 

  User’s depth suggests they’ll dissect theories ruthlessly. I should flag where even this schema might crumble—like when "mandate" legitimacy clashes with illiberal reforms (Turkey 2018). No framework escapes every trap.
answer: |-
  Here is a structured specification of desiderata for any adequate account of democratic backsliding, grounded in your requirements. I categorize each, justify its necessity, and flag tensions:

  ### **I. Case Classification (Non-Negotiable)**
  1. **Hungary (post-2010)**  
     *Why*: Fidesz's constitutional revolution, media capture, and electoral system manipulation via legal means.  
  2. **Poland (2015-2023 + partial reversal)**  
     *Why*: Judicial dismantling followed by EU-driven rollback; tests reversibility.  
  3. **Turkey (Erdoğan era)**  
     *Why*: Transition from competitive authoritarianism to full autocracy via purges and executive aggrandizement.  
  4. **United States (~2020)**  
     *Why*: Norm erosion (e.g., electoral subversion attempts) without institutional collapse; tests applicability to mature democracies.  
  5. **Controls**:  
     - *Ordinary change* (e.g., UK 1997 Labour victory): Must **not** classify as backsliding.  
     - *Full breakdown* (e.g., Venezuela post-2013): Must distinguish from backsliding.  

  ### **II. Necessary Distinctions (Non-Negotiable Unless Noted)**
  1. **Backsliding vs. Autocratization/Breakdown**  
     *Why*: Backsliding is erosion; breakdown is collapse (e.g., Hungary vs. Venezuela).  
  2. **De Jure Authority vs. De Facto Control**  
     *Why*: Turkey retains formal elections while eviscerating opposition capacity.  
  3. **Gradual Erosion (Degree) vs. Threshold Event**  
     *Why*: Poland’s judicial reforms were incremental; must capture process, not just endpoint.  
  4. **Intentions vs. Effects**  
     *Why*: Motive debates (e.g., "Was Trump’s norm-breaking deliberate?") vs. observable democratic harm.  
     *Status*: **Preference** of structuralist/functionalist camps (intent skeptics).  
  5. **Lawful/Gradual vs. Extra-Legal Means**  
     *Why*: Hungary’s constitutional "legalism" vs. coups; both erode democracy differently.  

  ### **III. Factual Accommodations (Non-Negotiable)**
  1. **Legal Means**  
     *Why*: Fidesz/PiS used legislation/constitutional amendments.  
  2. **Incrementalism**  
     *Why*: Backsliding is rarely a single event (e.g., Poland’s multi-year judicial takeover).  
  3. **Elected Governments with Mandates**  
     *Why*: Orbán/Erdoğan won early elections fairly; tests tension between popular will and democratic erosion.  
  4. **Reversibility**  
     *Why*: Poland’s 2023 election halted backsliding; accounts must not assume inevitability.  

  ### **IV. Labeling Protocol (Partly Contested)**
  1. **Who Applies the Label & Evidence Standard**  
     *Why*: Avoid politicized misuse (e.g., partisan accusations in the US). Requires objective indicators (e.g., V-Dem indices, EIU scores).  
  2. **Descriptive vs. Political Alignment**  
     *Why*: Charges of backsliding are weaponized (e.g., left/right mutual accusations).  
     *Status*: **Preference** for neutrality (liberal institutionalist camp) but contested by critical theorists.  

  ---

  ### **Key Tensions & Trade-offs**
  1. **Irreconcilable Pair: Neutrality vs. Substantive Condemnation**  
     - *Problem*: An ideologically neutral account (e.g., "any party undermining checks/balances") risks false equivalences (e.g., equating routine policy shifts with institutional capture). Yet substantive criteria (e.g., "targeting minority rights") appear partisan.  
     - *Consequence*: Neutrality may dilute the concept to uselessness; substantive accounts face accusations of bias. **No existing account fully resolves this.**  

  2. **Most Exclusionary Requirement**  
     - **Accommodating Reversibility**: Rules out "fateful threshold" models (e.g., Levitsky/Ziblatt) that imply backsliding is irreversible once triggered. Poland’s 2023 reversal contradicts such frameworks.  

  ---

  ### **Self-Critique & Falsifiability**
  - **Weakest Point**: The insistence on **intent vs. effects distinction**. Proving intent (e.g., Orban’s strategic dismantling) relies on contested inferences. Structural accounts (focusing on outcomes) avoid this but may over-include cases.  
  - **What Would Change My Verdict?**  
    If a case demonstrated *severe democratic erosion* via purely *unintentional* actions (e.g., incompetence causing institutional collapse) *without* illiberal outcomes, the intent/effects distinction might collapse. No such case exists empirically.  

  ### **Conclusion**
  Adequate accounts must navigate the **neutrality-substance trap** while explaining how elected regimes legally degrade democracy. Existing frameworks often fail on reversibility (overlooking Poland) or over-rely on intent. Your specification’s strength is forcing engagement with backsliding as a *process*—not an endpoint—with identifiable guardrails against misuse. The unresolved tension reflects deeper debates about democracy’s core components.
