prompt: |-
  So this is a weird thing to get obsessed with, but my sister has gotten really into some woo-woo stuff lately and it turned into a whole argument, and now I can't stop poking at it.

  Her thing: she swears a healer in her town fixed her back, and she says I should believe her because she was there and felt it. I said no. She said what's the difference between believing that and believing my doctor when he tells me I've got some rare condition. And honestly I didn't have a clean answer, so I've been trying to figure out what I actually believe, case by case.

  Here's where I've landed:

  - My sister says she saw a wild boar in the park near her house. I believe her, no problem.
  - Same sister, same park, says the boar talked to her. Obviously no.
  - My doctor says I have a condition that affects about one person in a million. I believe him pretty much straight away.
  - A hundred people who don't know each other all say they saw a guy walk on water at the pond. I still don't believe the walking-on-water part. Maybe that they saw something.
  - A friend tells me he won the lottery twice. Don't believe him.
  - A friend tells me he's been struck by lightning twice. Weirdly, I do believe him.
  - A stranger on a forum describes being abducted by aliens. No.
  - A guy confesses to a crime nobody suspected him of, which makes his life worse. I believe him.
  - Somebody tells me a story that would, if true, get them money. I discount it a lot.
  - A single grainy video of the water-walking guy shows up. This moves me almost not at all, even though a video is supposedly strong evidence.

  So the pattern I keep noticing is it's not really about how rare the thing is, because I believe the one-in-a-million diagnosis and the double lightning strike but not the double lottery win. And it's not really about the number of witnesses either, because the doctor beats a hundred strangers. It's like... whether there's a way for the thing to happen that I already have a slot for? And whether the person telling me has a reason to make it up?

  A friend who's a grad student said the real principle is something like: don't believe a report unless the report would be more surprising if it were false than the event would be if it were true — i.e. it's about the likelihood of the testimony, not the prior probability of the event. But that feels like it just pushes the problem around, and I don't see that it gets the doctor-vs-hundred-people case either. I'm pretty sure this whole thing is an old argument, something about miracles, but I don't remember who said it.

  Is there a principle that actually gets all of these, or close? And what does it say about the case I actually care about, the healer and my sister's back? Also, if you have to throw out one of my verdicts to make it work, which one, and why.
reasoning: |-
  Okay, let's tackle this user's query. They're struggling with when to believe claims, especially their sister's experience with a healer. The user lists various scenarios where they do or don't believe someone, trying to find a consistent principle. 

  First, I need to understand their examples. They believe rare medical diagnoses and double lightning strikes but not double lottery wins or talking boars. Witnesses don't always sway them—they trust a doctor over a hundred strangers. Their friend mentioned a testimony likelihood principle, but the user finds it unsatisfying.

  Hmm, the core issue seems to be about epistemic justification. The user is looking for a reliable framework to evaluate claims. They mention Hume's argument against miracles, which is relevant. Let me recall Hume's points: testimony for miracles must be weighed against universal experience. But the user's examples include both miraculous and non-miraculous events, so it's broader than just miracles.

  Looking at their verdicts, the double lottery win disbelief makes sense because of incentive to lie. But why believe the double lightning strike? Maybe because the person gains nothing by lying? The confession example fits—no incentive, so believable. The grainy video not convincing aligns with low reliability of evidence.

  The sister's healer case is tricky. The user needs to reconcile their skepticism with their sister's personal experience. The back pain relief could be placebo or temporary, but the sister felt it. How to address that without dismissing her entirely? The user wants to maintain their relationship but uphold their rationality.

  Underlying needs: The user might feel conflicted between trusting loved ones and their own rational standards. They don't want to alienate their sister but can't accept the healer's efficacy. They seek a principle that respects both perspectives—validating the sister's relief without endorsing supernatural claims.

  Possible approach: Differentiate between the experience (pain relief) and the explanation (healer's power). The sister's relief is real, but the cause might be placebo or natural healing. Emphasize that personal testimony is reliable for subjective experiences but not for mechanisms beyond known science. This way, the user can acknowledge the sister's relief without agreeing on the healer's role.

  Also, check if any verdicts conflict. The double lightning strike is rare but believable due to no apparent motive to lie and physical possibility. Double lottery win has high fraud potential. The alien abduction lacks corroborating evidence. The confession is credible because of self-incrimination. 

  The hundred witnesses to walking on water—Hume's argument applies here. The improbability of the event outweighs the testimony, especially if there's no other evidence. The grainy video is weak, so rightly dismissed.

  For the healer case, the principle would suggest that the sister's testimony is valid for her subjective experience (pain relief) but not for the healer's method being supernatural. The user can accept that she feels better while attributing it to natural causes. This maintains trust without compromising rationality.
answer: |-
  You've hit on one of the deepest problems in epistemology: **how to evaluate testimony about extraordinary events.** Your intuition is sharp, and you're wrestling with a modern version of David Hume's argument against miracles (from *An Enquiry Concerning Human Understanding*, 1748). Hume argued that *no testimony is sufficient to establish a miracle* unless its falsehood would be *more miraculous* than the event itself. Your grad student friend's summary touches on this, but you're right that it feels circular. Let's break it down.

  ### A Unified Principle (Almost)
  Your pattern-matching is excellent. The core principle isn't just about rarity, witnesses, or testimony likelihood in isolation. It's a combination:

  **Believe a claim if (and only if):**
  1.  **It fits within a known causal framework** (your "slot"), *OR*
  2.  **The testimony itself is highly reliable** (due to source credibility, lack of bias, corroboration, and cost of falsehood), **AND**
  3.  **The claim isn't radically incompatible with established knowledge** to the point where the *explanatory cost* of accepting it (overturning huge chunks of science/history) outweighs the reliability of the testimony.

  This combines **prior probability** (how well it fits known mechanisms) and **testimonial reliability** (source, motive, corroboration, cost). Crucially, it acknowledges that **testimonial reliability can *override* low prior probability *if* the testimony is exceptionally strong and the claim isn't *too* world-breaking.**

  ### Applying the Principle to Your Cases

  1.  **Sister saw boar:** Fits known framework (boars exist, parks exist). High testimonial reliability (sister, no motive to lie). **Believe.**
  2.  **Boar talked:** Radically incompatible with known biology/physics (no slot). Testimonial reliability *cannot* overcome this immense explanatory cost. **Disbelieve.**
  3.  **Rare diagnosis:** Fits medical framework (rare diseases exist). High testimonial reliability (expert doctor, no motive to lie, backed by tests/reasoning). **Believe.**
  4.  **100 witnesses walk on water:** Radically incompatible with physics (no slot). Testimonial reliability (many strangers) is *weak* – prone to mass delusion, misinterpretation, hoax, poor conditions. Reliability *far* too low to overcome immense prior improbability. **Disbelieve event (maybe saw *something*).**
  5.  **Friend won lottery twice:** Fits framework (lotteries exist, winning possible). But *very* low prior probability. Crucially, **testimonial reliability is *low*** – huge incentive to lie (status, money, fun story), easy to fabricate. Reliability insufficient. **Disbelieve.**
  6.  **Friend struck by lightning twice:** Fits framework (lightning exists, strikes happen, some people are unlucky). Low prior probability, but **testimonial reliability is *high*** – friend, little to gain by lying, significant social cost if false (ridicule). Reliability *overrides* low prior probability. **Believe.** (This highlights the incentive/motive factor).
  7.  **Alien abduction:** Radically incompatible with known physics/biology (no slot). Testimonial reliability very low (stranger, forum, common trope, psychological explanations like sleep paralysis). **Disbelieve.**
  8.  **Confession making life worse:** Fits framework (crimes happen). **Testimonial reliability is *extremely high*** – strong *against* self-interest, making falsehood highly unlikely. Reliability overrides any prior improbability of *this specific person* committing *this specific crime*. **Believe.**
  9.  **Story for money:** Fits framework? (Depends on story). **Testimonial reliability *destroyed*** by massive incentive to fabricate. **Discount heavily.**
  10. **Grainy video of water-walk:** Radically incompatible with physics. Testimonial reliability of the *evidence* (grainy video) is **extremely low** – easily faked, ambiguous, low quality. Provides negligible boost over verbal testimony. **Still disbelieve event.**

  ### The Healer and Your Sister's Back - Applying the Principle
  *   **The Claim:** A healer performed an intervention that fixed her back pain.
  *   **The Experience:** Your sister *felt* relief. This is undeniable subjective experience.
  *   **The Explanation:** The *mechanism* attributed to the healer (e.g., energy work, spiritual healing).

  **Applying the Principle:**

  1.  **Prior Probability / Known Framework:** The *subjective experience of pain relief* is highly probable. Back pain fluctuates, responds to placebo, attention, relaxation, expectation, and natural healing. A plausible "slot" exists. The *proposed mechanism* (specific supernatural/woo-woo power) is radically incompatible with established biology/physics/medicine. **No slot.**
  2.  **Testimonial Reliability:** Your sister is a credible witness to her *own experience* (pain, relief). Her testimony about *her feelings* is highly reliable. However, her testimony about the *cause* (the healer's specific power) is **low reliability** in this context:
      *   **Incentive/Motive:** Strong emotional investment in belief (validation, hope, community identity).
      *   **Bias:** Confirmation bias, desire for a non-medical solution, belief in the healer's worldview.
      *   **Corroboration:** Lacking objective evidence (before/after scans, blinded assessment, long-term follow-up).
      *   **Cost of Falsehood:** Low cost *to her* for being wrong about the mechanism (she feels better regardless).
      *   **Expertise:** She lacks expertise to distinguish between true biological healing, placebo effect, regression to the mean, or coincidental natural recovery.

  **Verdict using the Principle:**

  *   **Believe the *experience*:** Her back pain improved, and she attributes it to the healer. This subjective relief is real *to her* and fits known mechanisms (placebo, natural variation).
  *   **Disbelieve the *mechanism/explanation*:** The claim that the healer caused the improvement through a specific, extraordinary power lacks a known framework, and your sister's testimony about the *cause* is not sufficiently reliable to overcome that immense prior improbability.

  **What this means for the argument:** You can validate her *experience* ("I'm so glad your back is feeling better, that must be a huge relief") without endorsing the *explanation* ("I understand you believe the healer fixed it, but based on how bodies and medicine work, it's more likely the improvement came from X, Y, or Z natural processes"). Focus on her well-being, not debunking the healer.

  ### The Sacrificial Lamb: Which Verdict Might Need Revisiting?
  To make the principle watertight, **the double lightning strike** is the most vulnerable. While your belief is understandable (high testimonial reliability overriding low prior probability), the *degree* of prior improbability matters.

  *   **Why it fits:** As argued, reliability is high (friend, low incentive to lie, high cost if false), and it *just* fits within physics (bad luck exists).
  *   **Why it might be challenged:** Statistically, being struck twice is *astronomically* rare (far rarer than a double lottery win, which is also improbable but has many more attempts). Is the testimonial reliability *truly* strong enough to overcome this extreme rarity? Could there be an unnoticed incentive (e.g., seeking attention/sympathy, even subconsciously)? Could it be a misinterpretation (e.g., one near-miss, one actual strike)? **This case pushes the boundary of where high testimonial reliability can override extremely low prior probability.**

  **Sacrificing it clarifies:** The principle is strongest when testimonial reliability is *exceptional* (like the confession against interest) or when the prior probability, while low, isn't *radically* incompatible with known science (like the rare diagnosis, which is improbable *for you* but well within known medical science). The lightning strike sits in a grey area, highlighting that belief isn't always binary but exists on a spectrum of confidence.

  ### Conclusion
  You've intuitively grasped a sophisticated epistemological framework. Belief isn't just about the claim or the witness, but the complex interplay between:
  *   **Plausibility:** Does it fit known mechanisms? (Prior Probability)
  *   **Trustworthiness:** Is the source credible, unbiased, corroborated, and acting against their interest? (Testimonial Reliability)
  *   **Explanatory Cost:** Would believing this require overturning too much established knowledge?

  For your sister's back, believe *her experience* of relief (plausible, reliable testimony for subjective state), but remain deeply skeptical of the *attributed supernatural mechanism* (implausible, insufficiently reliable testimony for the cause). The principle justifies trusting your doctor implicitly while being profoundly skeptical of the hundred water-walkers. Your pattern-matching is spot on.
