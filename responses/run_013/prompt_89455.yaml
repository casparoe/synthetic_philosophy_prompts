  Unnamed leaves: 
     - The leaf for the fixed system without hierarchy (Question 2, no) is named "Unmodified self-referential proof (inconsistent)".
     - The others have names: "Infinitary hierarchy", "Finite hierarchy (bootstrapping)", "Probabilistic/Bounded reasoning", and "Partial self-trust via reflection".

  Combinations that nobody seems to occupy:
     - We have covered the main branches. However, one combination that might be unexplored is: absolute certainty, use a hierarchy, finite, but with a twist that the top system is somehow self-verifying without inconsistency? But by Löb's theorem, that's impossible. So that combination would be incoherent.

