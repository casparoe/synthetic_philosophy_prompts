prompt: |-
  I think I finally get the coherence arguments for expected utility theory and want to check my understanding before I write something about it. The idea, as I understand it, is that if your preferences break the axioms you can be Dutch-booked or money-pumped into a sure loss, and a sure loss is a contradiction — you end up worse off no matter what happens, which you can't coherently accept. So doesn't that mean any agent that isn't an expected utility maximizer is literally incoherent, in the same way as someone who believes p and not-p? And wouldn't any sufficiently intelligent agent just notice the contradiction and be forced to converge on expected utility maximization? I keep seeing people say the argument only shows that consistent preferences can be represented as maximizing expected utility, not that EU is uniquely rational, and I honestly don't get the difference. If the failure is a logical error, why isn't the fix forced? (I also saw a comment that the money pump only works if the agent doesn't see the whole sequence coming, which seems like it would let the agent just refuse the first trade — does that undermine the whole thing?)
