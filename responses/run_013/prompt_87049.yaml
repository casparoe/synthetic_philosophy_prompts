prompt: |-
  I've been reading that short Simone Weil piece about abolishing political parties -- not the usual stuff about parties as coalitions or machines, the part where she's really talking about what happens to a person's thinking once they're inside one. I think I keep running into the thing she's pointing at, and I want to know whether it has a name, because 'groupthink' isnt it and I need something to call it in my own notes.

  The pattern. I spent two years in a tenants union, and before that in a grad-student group that was nominally a reading group but was actually a campaign. In the union there was a question everyone would happily have discussed one-on-one: whether our particular landlord was the villain of the story or just the most visible link in a chain of them. In the other group it was whether the thing we were campaigning for was even the right ask. Nobody forbade either question. No vote, no email, no one told anyone to drop it. They just didn't get asked, and after a while it wasn't that I was avoiding them -- they stopped occuring to me. What strikes me is that the mechanism seems to run through something you'd normally count as a virtue: the group has to be able to say what it stands for, in public, as one thing. Once it's said that, any internal question that would change what it stands for has to be priced as a cost to the group rather than weighed as a question. So the person who raises it isn't being censored or pressured exactly; they're holding two things, one the group can act on and one it can't, and the second one goes slack. I gather Weil thinks this is essential to parties rather than a corruption of them, which is why she wants them abolished instead of reformed -- I don't know if I buy that, but it's the version of the claim I want to be able to state precisely.

  So: is there an established concept for that specific mechanism, the way a group's need for one public position makes certain thoughts unavailable to its own members from the inside with nobody suppressing anything? I know Michels on oligarchy, but that's about leaders entrenching themselves, and this happens in groups with no leaders and no offices at all. Groupthink seems to be about decisions going wrong because everyone agrees, whereas here the whole point is the questions that never get to a decision. Is there a name, and does whatever it is capture Weil's version or is she after something stronger? If there's no name, I want a coinage with a definition that has edges -- what it requires, what it doesn't, and how I'd distinguish it from ordinary self-censorship, from an echo chamber, and from simply being outvoted and letting it go. Boundary cases please: does a church count, a company, a research programme? I don't care about the label as such, I care about the joint being cut in the right place. Skip citations, I don't need a reading list.

  Last line: \answer{...} with the established term if there is one, and if there isn't, your best coinage in three words or fewer.
reasoning: |-
  Hmm, the user is describing a phenomenon where group members unconsciously avoid certain questions that could destabilize the group's public position, even without explicit censorship. They've experienced this in a tenants union and a grad-student campaign group, where fundamental questions about the group's stance or villain framing simply stopped occurring to them. The key elements are: the self-censorship isn't coerced; it stems from the group's need for unitary public presentation; and it makes certain thoughts cognitively unavailable.

  The user explicitly rejects "groupthink" as insufficient because it focuses on faulty consensus decisions, whereas their concern is about questions that never surface. They also distinguish this from Michels' iron law of oligarchy, which involves leadership entrenchment. They want a precise term for this specific mechanism where the group's public identity causes internal thought constraints.

  Looking at potential concepts:
  - "Ideological hegemony" (Gramsci) is too broad and systemic.  
  - "Spiral of silence" describes fear of isolation in public discourse, not unconscious cognitive filtering.  
  - "Cognitive dissonance reduction" is individual, not group-mediated.  
  - "Epistemic closure" (philosophy) refers to isolated knowledge systems, not this self-blinding mechanism.  

  No existing term perfectly fits. The core pathology is the group's identity becoming a cognitive boundary that erases incompatible thoughts. For coinage:  
  - "Identity foreclosure" captures the premature closing of inquiry due to identity preservation.  
  - "Position-lock" emphasizes the rigidity of the public stance.  
  - "Cognitive bleaching" highlights the fading of certain thoughts.  

  "Identity foreclosure" seems strongest: it implies the group identity halts internal development of certain ideas. Boundary cases:  
  - A church would exhibit this if theological doubts become unthinkable due to doctrinal unity needs.  
  - A company might not, unless it has strong ideological branding (e.g., Apple under Jobs).  
  - A research program would only qualify if paradigmatic assumptions become unexamined due to group identity.  

  This distinguishes from:  
  - Self-censorship (conscious fear-based suppression)  
  - Echo chambers (reinforcement without structural suppression)  
  - Being outvoted (explicit democratic resolution)  

  Weil's stronger claim—that this is essential to political parties—isn't fully captured, but the mechanism aligns with her critique.
answer: |-
  The phenomenon you describe—where a group's need for a unified public position renders certain critical questions cognitively inaccessible to its members without overt suppression—lacks a single established term. Existing concepts (e.g., "pluralistic ignorance," "epistemic closure") focus on different mechanisms. Your boundary cases clarify the specificity:  
  - **Requires**: A group with a defined public identity/agenda, where internal coherence is tied to external action.  
  - **Excludes**: Conscious self-censorship (fear-driven), echo chambers (reinforcing existing beliefs), or simple outvoting (explicit resolution).  
  - **Boundaries**:  
    - A *church* **counts** if theological doubts become unthinkable due to doctrinal unity needs.  
    - A *company* **does not** (unless ideologically driven like Patagonia); profit motives override identity coherence.  
    - A *research programme* **counts** if paradigmatic assumptions become invisible (Kuhnian "normal science").  

  Weil’s claim is that this is **structural** to any group organized around collective action requiring public unanimity—not a corruption but a necessity. Your coinage should emphasize the **self-erasure of dissonant thought through identity maintenance**.  

  Best coinage: **Identity foreclosure**  
  - **Definition**: The process by which a group’s need for a singular public identity forecloses the cognitive availability of questions that would fracture its self-presentation, rendering them non-options without conscious suppression.  
  - **Distinguishers**:  
    - Vs. *Groupthink*: Avoids focus on decision-making errors; centers on pre-decisional cognitive unavailability.  
    - Vs. *Self-censorship*: Unconscious, not fear-based; thoughts "go slack" organically.  
    - Vs. *Echo chamber*: Not amplification of beliefs; active exclusion of destabilizing lines of inquiry.  

  \answer{Identity foreclosure}
