prompt: |-
  I have no academic training in classics or theology, and I have been reading Plutarch on my own for the past year or so, in an old English translation I found on Project Gutenberg. I keep stalling at the opening of his life of Theseus, where he explains what he thinks he is doing when he writes about men who lived before there were any reliable records. He writes:

  "As geographers, Sosius, crowd into the edges of their maps parts of the world which they do not know about, adding notes in the margin to the effect, that beyond this lies nothing but sandy deserts full of wild beasts, unapproachable bogs, Scythian ice, or a frozen sea, so, in this work of mine, in which I have compared the lives of the greatest men with one another, after passing through those periods which probable reasoning can reach to and real history find a footing in, I might very well say of those that are farther off, Beyond this there is nothing but prodigies and fictions, the only inhabitants are the poets and inventors of fables; there is no credit, or certainty any farther. [...] Let us hope that Fable may, in what shall follow, so submit to the purifying processes of Reason as to take the character of exact history."

  A little later in the same stretch he tells us that Theseus and Romulus were both "born out of wedlock and of uncertain parentage," that both had "the repute of being sprung from the gods," and that both stand charged with the rape of women; he finishes by saying he will take "the stories least like poetry as our guide to the truth," and then asks for readers who will "receive with indulgence the stories of antiquity." The map image I can follow well enough, but I cannot work out what he is actually promising. Does "purifying" mean cutting the wonders out, explaining them away, or keeping them while refusing to vouch for them? His test for what to believe also strikes me as oddly aesthetic — the version least like a poem is the one he trusts — which seems to leave the moral lesson resting on precisely the sort of detail he has just admitted he may have to discard.

  What sharpens the puzzle for me is that I have also been reading the Life of Antony, the biography of the Egyptian hermit that Athanasius wrote around 360, where the wonders are not rationalized in the least; they are reported as the substance of the account, and the reader is plainly meant to be edified by believing them. So I would like help seeing what Plutarch is doing that is different, and whether his purifying is a genuine method of inquiry into what happened or a way of salvaging the edifying parts of stories he does not credit. Please give me exactly five numbered points, each a sentence or two, with no introduction and no closing summary.
reasoning: |-
  Hmm, the user is grappling with Plutarch's approach to myth in his "Life of Theseus." They've quoted his famous geographical metaphor where he compares uncertain early history to uncharted territories on maps, and they're confused about what Plutarch means by "purifying processes of Reason." Specifically, they wonder if this means cutting out wonders, explaining them away, or keeping them without vouching for them. They also find it odd that Plutarch selects versions "least like poetry" as more trustworthy, which seems contradictory if moral lessons depend on the very elements he might discard.

  The user contrasts this with Athanasius' "Life of Antony," where miracles are presented literally for edification. They want to understand Plutarch's different approach—whether his "purifying" is a genuine historical method or just a way to salvage moral lessons from stories he doesn't fully believe. They've requested exactly five numbered points without introduction or summary.

  I need to unpack Plutarch's methodology based on the passage. His map analogy shows he acknowledges the boundary between documented history and mythical "prodigies and fictions." The "purifying" process likely involves rationalizing myths to extract plausible historical kernels, not eliminating wonders entirely. His preference for "least poetic" versions suggests he values plausibility over literary flair, implying a proto-historical critical method.

  The moral dimension is key here. Plutarch likely aims to preserve ethical exemplars by grounding them in credible narratives, even if that means modifying fantastical elements. Unlike Athanasius who reports miracles for faith-building, Plutarch operates as a biographer reconciling cultural tradition with rational inquiry. His call for "indulgence" indicates he expects reader cooperation in this interpretive exercise.

  So, I'll structure five precise points: first on the rationalization method, then on selective criteria, followed by moral preservation intent, contrast with hagiography, and finally his pragmatic stance on uncertainty. Each point should directly address the user's core questions about historical inquiry versus edification.
answer: |-
  1.  Plutarch uses "purifying processes of Reason" to mean applying critical judgment to myths, aiming to identify and retain plausible historical kernels by reducing or reinterpreting fantastical elements (like divine parentage or talking animals) that defy natural explanation, rather than simply discarding all wonders or reporting them uncritically.
  2.  His criterion of selecting stories "least like poetry" prioritizes versions that appear less embellished, more mundane, and thus more plausible within the known human experience, reflecting his belief that poetic elaboration signals fictionalization and that simplicity suggests historical reliability.
  3.  Plutarch's primary goal is salvaging the *moral and exemplary* value of these legendary figures for his biographical project; he seeks a "purified" core narrative, stripped of overt impossibilities, that can still credibly serve as an edifying lesson for his contemporary readers.
  4.  Unlike Athanasius (who writes hagiography to inspire faith by affirming miracles), Plutarch writes biography grounded in a proto-historical critical method; his "purifying" is an attempt, however imperfect by modern standards, at genuine inquiry into probable human events behind the myth, not an affirmation of the supernatural for devotional purposes.
  5.  Plutarch acknowledges the inherent uncertainty of his sources for remote times; his "method" is ultimately pragmatic and comparative, aiming for the *most credible version possible* that allows Theseus and Romulus to stand alongside reliably documented historical figures as valid subjects for moral comparison, hence his request for readerly "indulgence."
