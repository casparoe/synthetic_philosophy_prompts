prompt: |-
  I've been trying to work out when it is actually true that two people did something together, as opposed to each of them separately doing something and the two things adding up to a result. I have a run of gut verdicts and I want to know what rule, if any, they add up to, and whether one of them has to be sacrificed.

  Here they are. Two flatmates who never discuss it each wash up the dishes the other left out, and finish at the same moment: not something they did together. Two people carrying a heavy wardrobe down a staircase, one at each end, calling out "step" to each other and adjusting to each other's pace: plainly together. Two strangers who approach each other on a narrow pavement and do the mirrored shuffle, each stepping aside for the other: not together, even though every move each makes is a response to the other and each knows it. Two friends who go to a concert neither of them actually wants to attend, each going only because the other would feel let down by a cancellation, and each knowing this: I still say they went to the concert together. Two rival bakeries on the same street that each set their loaves at the same price because each expects the other to, and each knows the other reasons the same way: not doing anything together, however much each is acting on the other's expected move. And two people at a party who start clapping a rhythm, each hearing the other and coming in on the beat, with nobody having proposed it: by the third round I want to say they are doing it together, though there was never any agreement.

  The pair I cannot get to sit still is the reluctant concert-goers and the rival bakeries. As far as I can see, each of the four people is doing what they are doing because of what they expect the others to do, and everyone knows it, yet one case is a joint outing and the other is two shops minding their own business. So what is doing the work — some promise or obligation the concert-goers have and the bakers do not? If so, how do the clappers count, since they never promised anything? My own stab at a rule was this: two people are doing something together just when each is doing their part because they expect the other to do theirs, and each knows the other expects the same. That seems to make the bakers and the pavement-shufflers joint actors, which I do not accept, and it makes the clappers joint only by accident. Can you give me the principle, or the two or three rival principles, that best fit these verdicts, tell me precisely which clause of each is doing the work, and say what it rules about cases I have not mentioned — in particular a long-distance couple who each quietly save money toward the same trip without ever mentioning it, and who later discover what the other has been doing; before the discovery I cannot decide whether they were saving for the trip together, and afterwards I am sure they were, which worries me, since nothing they did changed. If no principle keeps all my verdicts, tell me which one you would give up. I would also like you to say how confident you are in what you claim, and to flag the single point you are least sure about.
reasoning: |-
  Hmm, the user is grappling with a deep philosophical question about joint action versus parallel individual actions. They've presented several intuitive examples and are struggling to reconcile their gut feelings about when "togetherness" truly exists. 

  The core tension is between the concert-goers (who they feel acted together despite mutual reluctance) and the rival bakeries (where identical mutual expectation doesn't create joint action). I notice the user is particularly bothered by the asymmetry in their own judgments. Their proposed rule about mutual expectation clearly fails to capture their intuitions, especially with the pavement shuffle counterexample.

  What's interesting is how social bonds permeate their examples. The flatmates lack coordination, the wardrobe carriers have explicit coordination, strangers on pavement have reactive but uncoordinated movement. The concert case involves perceived obligation between friends, while bakers are adversaries. The discovery paradox about the saving couple suggests retrospective narrative might influence their perception of jointness.

  The clapping example is fascinating - it shows emergence of joint action without any prior agreement. This makes me think shared intention might be key, but the concert case complicates that since neither actually wants to go. Perhaps the difference is whether actions are interlocking (wardrobe, clapping) versus merely parallel (dishes, pricing).

  For the saving couple case, I suspect the user's hesitation comes from whether mutual expectation existed before discovery. If both were saving based on unspoken assumptions about the other, it might qualify as joint action retrospectively. But if they acted independently hoping the other might join later, it's different. The discovery doesn't change facts but reveals pre-existing jointness.

  I feel most confident about distinguishing cooperative versus adversarial contexts (bakers vs concert friends). Least confident about whether the pavement shuffle should count as joint action - it's a borderline case where body language creates micro-coordination without social connection.
answer: |-
  Based on your gut verdicts and analysis, I identify **three key principles** that seem to govern your intuition about "doing something together," with **shared cooperative commitment** as the core unifying factor. Your bakery example is the most likely candidate for revision if consistency is required. Below is the framework, its application to your cases, and new examples:

  ### The Proposed Principles (Ranked by Importance)
  1.  **Shared Cooperative Commitment (The Core Driver):**
      *   **Clause:** Agents must be *mutually responsive* with the *shared goal* of coordinating their actions to achieve a *common outcome*, viewing each other as *partners* in the endeavor.
      *   **What it does:** Rules out the bakers (adversarial context, no partnership), flatmates (no mutual responsiveness or shared goal), and pavement shufflers (coordination is reactive avoidance, not cooperative pursuit of a shared outcome). Explains the wardrobe carriers (explicit coordination), concert-goers (implicit commitment to the *shared experience* for the *partner's sake*), and clappers (emergent mutual commitment to the *joint rhythmic pattern*).
      *   **Work being done:** Distinguishes *cooperative joint action* from parallel individual action or adversarial co-action. Requires a minimal "we-intention" (acting *as* part of a group towards a shared end).

  2.  **Interlocking Action Dependence (The Mechanism):**
      *   **Clause:** Each agent's action is *causally shaped in real-time* by the *actual or anticipated actions* of the other(s), creating a feedback loop essential for the outcome.
      *   **What it does:** Explains wardrobe carriers (direct physical & verbal feedback), pavement shufflers (real-time reactive adjustment - *why this is a borderline case for you*), and clappers (auditory feedback loop). Weakens the case for flatmates (actions independent, no feedback) and bakers (anticipation influences *setting*, but the *pricing act itself* is unilateral).
      *   **Work being done:** Captures the dynamic, interdependent process characteristic of genuine joint action. Rules out cases where actions are merely parallel or based solely on static expectations.

  3.  **Mutual Belief/Common Knowledge (The Cognitive Glue):**
      *   **Clause:** Agents mutually know (or rationally believe) that the conditions above hold – they share awareness of the commitment and interdependence.
      *   **What it does:** Strengthens the case for wardrobe carriers, concert-goers, and clappers (where awareness builds). Highlights the *lack* in flatmates and bakers (knowledge exists but isn't *about* a shared commitment). Explains why the pavement shuffle *doesn't* feel fully joint despite interdependence – there's no shared belief in a *cooperative joint project*, just mutual awareness of obstruction/avoidance.
      *   **Work being done:** Ensures the agents are *oriented* towards each other as participants in the same activity. Prevents accidental coordination (like two people independently deciding to hum the same tune) from counting.

  ### Applying the Principles to Your Cases

  | Case                     | Shared Cooperative Commitment? | Interlocking Dependence? | Mutual Belief? | Your Verdict | Framework Verdict | Conflict? |
  |--------------------------|--------------------------------|--------------------------|----------------|--------------|-------------------|-----------|
  | **Flatmates Washing Up** | ❌ (No shared goal/commitment) | ❌ (Independent actions) | ❌ (No mutual awareness of acting together) | Not Together | Not Together      | ✓         |
  | **Wardrobe Carriers**    | ✓ (Shared goal, partnership)  | ✓ (Real-time coordination) | ✓ (Explicit communication) | Together | Together          | ✓         |
  | **Pavement Shuffle**     | ❌ (Avoidance, not cooperation) | ✓ (Real-time reaction)   | ⚠️ (Awareness, but not of *joint action*) | Not Together | Not Together      | ✓         |
  | **Reluctant Concert-Goers** | ✓ (Implicit commitment to shared experience *for each other*) | ⚠️ (Weak - actions largely parallel) | ✓ (Mutual knowledge of reason for going) | Together | Together          | ✓         |
  | **Rival Bakeries**       | ❌ (Adversarial, no partnership) | ❌ (Pricing act is unilateral) | ✓ (Mutual expectation exists) | Not Together | Not Together      | ✓         |
  | **Rhythm Clappers**      | ✓ (Emergent commitment to joint rhythm) | ✓ (Auditory feedback loop) | ✓ (Develops through mutual awareness) | Together | Together          | ✓         |

  **Resolution of the Concert/Bakery Conflict:** The core difference is **Shared Cooperative Commitment**. Concert-goers act based on a perceived *relational obligation* to their friend, framing the outing as a *shared experience* they are jointly responsible for sustaining ("We are going so *we* don't let *each other* down"). Bakers act based on *strategic self-interest* in a competitive context ("I must match *their* price to protect *my* business"). Mutual expectation exists, but the *framing of agency* differs: partnership vs. rivalry.

  **The Clappers:** They *develop* all three components: mutual responsiveness builds the commitment (Principle 1), auditory feedback creates dependence (Principle 2), and mutual awareness grows (Principle 3). It's joint action *emerging* from coordination, not accidental.

  ### New Cases: The Long-Distance Savers

  *   **Before Discovery:**
      *   **If both are saving *because* they expect the other is saving too, intending their savings to *combine* for the trip:** This satisfies Principle 1 (commitment to the *joint* funding goal, viewing the other as a partner) and Principle 3 (mutual belief). Principle 2 is weak (no real-time dependence). **Framework: They *are* saving together.** (This aligns with your later intuition).
      *   **If both are saving *hoping* the other might save too, but acting independently:** Principle 1 fails (no commitment based on expectation of the other's action; only hope). Principle 3 fails (no mutual belief). **Framework: They are *not* saving together.** (This aligns with your initial hesitation).
  *   **After Discovery:** Discovery doesn't change the *past facts* but *reveals* which scenario was true. If the first scenario was true, discovery confirms they *were* acting together all along. If the second was true, discovery might *initiate* joint action for the *next* phase (planning the trip), but the saving itself wasn't joint. Your worry stems from conflating *epistemic access* (knowing if it was joint) with the *ontological fact* (whether it was joint). The jointness existed (or not) based on their *mental states and commitments during the saving*, regardless of when it was discovered.

  ### Sacrifice for Consistency & Confidence

  *   **Confidence (85%):** I'm highly confident Principles 1 (Commitment) and 3 (Belief) capture the essence of your intuitions, especially resolving the concert/bakery puzzle and explaining the savers. Principle 2 (Dependence) is crucial but secondary.
  *   **Least Confident Point (Principle 2 Scope - 70%):** The precise threshold for "interlocking dependence." Your pavement shuffle verdict suggests reactive adjustment without a *cooperative* goal isn't enough, even if dependence exists. The concert case has minimal real-time dependence yet feels joint. This principle might be less strict than initially formulated – perhaps requiring dependence *sufficient for the joint outcome* within the context of commitment.
  *   **Sacrifice Recommendation:** The case most likely requiring revision for full consistency under these principles *is the pavement shuffle*. If interdependence (Principle 2) is strongly weighted, it *could* edge towards being joint action. However, your strong "not together" verdict and the *lack of cooperative commitment* (Principle 1) are decisive in the framework. **No other verdict needs sacrificing if the core is Commitment.**

  ### The Principle Summarized
  **Two (or more) people are doing something together if and only if:**
  1.  They share a cooperative commitment to achieving a common outcome, viewing each other as partners in the endeavor (Shared Cooperative Commitment).
  2.  Their individual actions are interlocked such that each person's contribution is responsive to the actual or anticipated actions of the others in a way necessary for the joint outcome (Interlocking Action Dependence - *moderate strength required*).
  3.  They mutually know (or rationally believe) that conditions (1) and (2) hold (Mutual Belief/Common Knowledge).

  This framework preserves all your verdicts, explains the concert/bakery distinction via the nature of the commitment (relational vs. adversarial), clarifies the savers' case based on their prior intentions, and accommodates emergent joint action like clapping. The pavement shuffle remains non-joint due to the lack of cooperative commitment, despite interdependence.
