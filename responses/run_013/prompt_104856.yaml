answer: |-
  Here's a short scene playing on the "living organisms only compose" view (like Van Inwagen's *Material Beings*), using a crowd and a chair:

  **(A nervous GRAD STUDENT stands center stage next to a CHAIR. A small CROWD of other grad students mills nearby.)**

  **GRAD STUDENT:**  
  *(Gesturing to chair)* Okay, team! Lift-off in five! Remember the metaphysics: strictly speaking, *you* all exist... *(points to the crowd)* ...and these atoms exist... *(taps chair)* ...but *this* "chair"? Just an aggregate. Not a *real* object. Ready? One... two... three... LIFT!

  **(The CROWD awkwardly lifts the CHAIR together.)**

  **GRAD STUDENT:**  
  *(Beams triumphantly)* YES! Now... *now* we have a genuine object! A single, composite entity!  

  **CROWD:**  
  *(Straining under the chair's weight, confused)* Huh?  

  **GRAD STUDENT:**  
  *(Nodding sagely)* Of course! By working together *as one* to lift it... you've fused! You and the chair atoms... you're now a *single living organism*! Welcome to existence, weird chair-crowd-thing! ...Now, try not to drop any limbs. It's sub-optimal.

  **CROWD:**  
  *(Simultaneously drops the chair in surprise)* **WHOA!**  

  **GRAD STUDENT:**  
  *(Sighs)* ...And now you're just an aggregate again. Told you composition was contingent. Somebody get a mop? Our new organism... leaked.

  ---

  **Why it works:**
  *   **Core Theory:** The humor hinges entirely on the strict "only living organisms compose" view (organicism). The crowd lifting the chair *shouldn't* create a new object under this view, but the student absurdly declares that their coordinated action *makes* them and the chair into one *new living thing*.
  *   **Specific Objects:** Uses a crowd (people, who *do* compose) and a chair (which, under organicism, *doesn't* compose a real object, just atoms).
  *   **Punchline Logic:** The absurd consequence ("weird chair-crowd-thing") and the immediate dissolution upon dropping it highlight the view's specific commitment: composition *only* happens when you get a life. The "leaked" line darkly implies the organism had biological functions.
  *   **Accessible:** The physical action (lifting/dropping) makes the abstract point clear even without knowing Van Inwagen. Philosophers get the precise reference and the dark twist on "organism."
  *   **Not Just Nerds Arguing:** The humor comes from the *physical consequence* of the theory in a bizarre, slightly slapstick situation.
