  First, I need to unpack what makes this audience dangerous. The revealed-preference folks will hate the idea that preferences aren't pre-existing. The formal decision theorists will demand rigor in modeling the "becoming real" claim. The Kantian will pounce on moral realism implications. The historian might call anachronism. 

