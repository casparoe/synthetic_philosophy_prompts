  Second worst is the formal decision theorist asking for modeling. This is tricky—the user can't provide a full model in Q&A but must show it's tractable. The "choice-dependent utilities" hint keeps them credible without overpromising. 

  The Kantian objection about moral facts is the one the user fears most. If pressed, they'll have to admit this collapses into anti-realism—which might alienate half the room. Best to flag that as a soft spot upfront. 

  Minor objections: the historian's anachronism point is easy (just concede and pivot), and the "why not synchronic?" question actually helps reinforce the thesis. 

  Biggest concession needed: yes, this blurs is/ought. And yes, the "right/wrong afterward" part is the shakiest—it risks circularity. User should own that upfront before someone pounces. 

