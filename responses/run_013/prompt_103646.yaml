prompt: |-
  I'm a backend engineer at a lending company, and I sat in on an argument between two teammates about the risk model we use to route loan applications to manual underwriting; I have no formal background in philosophy or statistics beyond what I've picked up at work, and I genuinely can't tell who is right. The model outputs a default probability and is well calibrated inside each of our two customer segments — when it prints 25%, roughly a quarter of those applicants default in each segment — but the segments have very different overall default rates, around 10% and 30%. The exchange went like this. (1) Priya said that because the model is calibrated within each segment it is already fair, so we should apply a single shared cutoff and stop worrying, and that talk of bias just reflects a misunderstanding of what calibration buys us. (2) Devon answered that even with one shared cutoff the false-positive and false-negative rates will come out different across the two segments, precisely because the base rates differ, so in the sense that matters — who absorbs the errors — it is not fair, and the fix is to set a separate cutoff per segment to equalize the error rates. (3) Priya countered that segment-specific cutoffs make the same score mean different things in the two segments, so we would have thrown calibration away and merely relocated the unfairness instead of removing it. (4) Devon replied that you cannot have both when the base rates differ, that something has to give, and that equal error rates are the more defensible thing to protect, since calibration is a convenience rather than a requirement. (5) Priya then proposed dropping segment membership and every feature correlated with it — being blind to the segment — so the model cannot treat the two segments differently in the first place. Please adjudicate this move by move: for each of the five claims, say whether it is right, wrong, or half-right, and what both of them are missing. Give the answer as exactly five numbered items, one per move, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  We are analyzing an argument between Priya and Devon about fairness in a risk model for loan underwriting.

  The model outputs a default probability and is well-calibrated within each of two customer segments (with base default rates of 10% and 30%). The argument consists of five moves:

  1. Priya: Because the model is calibrated within each segment, it is fair. Therefore, use one shared cutoff and stop worrying about bias. Bias talk is a misunderstanding of calibration.

  2. Devon: Even with one shared cutoff, the false-positive and false-negative rates will differ across segments because base rates differ. This is unfair in terms of who absorbs the errors. The fix: set separate cutoffs per segment to equalize error rates.

  3. Priya: Segment-specific cutoffs make the same score mean different things in the two segments (so we lose calibration) and just relocate unfairness.

  4. Devon: You cannot have both (calibration and equal error rates) when base rates differ. Equal error rates are more defensible because calibration is a convenience, not a requirement.

  5. Priya: Then drop segment membership and every feature correlated with it (be blind to segment) so the model cannot treat segments differently.

  We now adjudicate each move:

  1. Priya's first claim is half-right. Calibration within groups (also called group fairness in terms of calibration) ensures that the predicted probabilities match the actual default rates within each segment. This is a form of fairness (specifically, calibration by group). However, it does not address the fact that the base rates (the actual prevalence of default) differ. Using a single cutoff in such a scenario leads to different error rates (e.g., false positive rates and false negative rates) across groups. This can lead to disparities in who is denied a loan (false positives) or who is granted a loan and then defaults (false negatives). Therefore, while calibration is a desirable property, it does not by itself guarantee fairness in the outcomes.

  2. Devon's first claim is right. When base rates differ, using a single cutoff for a well-calibrated model will result in different false positive and false negative rates across the two segments. This is a direct consequence of the base rate difference. For instance, in the segment with a 30% base default rate, a given cutoff will yield a higher false negative rate (if we are trying to catch defaults) and possibly a lower false positive rate (if the model is more sensitive in that group) compared to the 10% segment. Equalizing error rates (e.g., false positive rate or false negative rate) by using separate cutoffs is a common approach to achieve what is known as equalized odds or equal opportunity. This approach attempts to make the model's errors equally distributed across groups.

  3. Priya's counter is half-right. Using separate cutoffs per segment does indeed break the calibration of the scores because the same score (say 25%) would now lead to different decisions in the two segments. In one segment, 25% might be above the cutoff (so denied) and in the other below (so approved). Thus, the meaning of the score in terms of decision-making becomes group-dependent. However, this does not necessarily mean that unfairness is merely relocated. It can be argued that by equalizing error rates, we are achieving a different kind of fairness. The trade-off is between calibration and error rate balance. Both are desirable but often mutually exclusive when base rates differ.

  4. Devon's reply is essentially right. When base rates differ, it is impossible to achieve both calibration (within groups) and equal error rates (such as equal false positive rates and equal false negative rates) simultaneously. This is a well-known trade-off in the fairness literature (see, e.g., the impossibility results by Kleinberg, Mullainathan, and Raghavan, and independently by Chouldechova). Devon argues that equal error rates are more defensible because they directly address the distribution of harms (errors) across groups. Calibration, on the other hand, is a property of the model's predictions and might be seen as a technical requirement that does not necessarily ensure equitable outcomes.

  5. Priya's proposal to drop segment membership and every feature correlated with it (being blind to the segment) is wrong. This approach, known as "fairness through unawareness," does not work because other features may be proxies for the segment. Even without explicitly including the segment, the model may still learn to distinguish the segments through correlated features. Moreover, this may not solve the underlying problem: the base rates are different, and without using the segment information, the model may still exhibit the same disparities in error rates. In fact, it might even make the problem worse by obscuring the group differences and making it harder to correct for them. There are also legal and ethical concerns with including or excluding certain features, but the main point is that simply removing the segment feature does not guarantee that the model will not have disparate impacts.

  In summary:

  1. Priya (1): Half-right. Calibration within groups is a form of fairness but does not prevent disparate error rates which can lead to unfair outcomes.
  2. Devon (1): Right. Base rate differences cause unequal error rates with a single cutoff, and separate cutoffs to equalize error rates address a different fairness concern.
  3. Priya (2): Half-right. Separate cutoffs break calibration, but that does not necessarily mean unfairness is only relocated; it may achieve a different kind of fairness.
  4. Devon (2): Right. The trade-off is unavoidable, and equalizing error rates may be more important than calibration for fairness in outcomes.
  5. Priya (3): Wrong. Removing the segment and correlated features (fairness through unawareness) does not prevent the model from having disparate impacts and may even make it harder to detect and correct.
answer: |-
  1. Priya is half-right: Calibration within segments ensures that predicted probabilities match actual default rates, which is a form of fairness for model reliability, but it ignores disparate error rate impacts across segments when using a single cutoff, such as higher false negatives in the high-default segment unfairly burdening that group.  
  2. Devon is right: With differing base rates, a shared cutoff causes unequal false-positive and false-negative rates across segments, leading to fairness issues in error distribution, and separate cutoffs can equalize these rates to balance harms.  
  3. Priya is half-right: Segment-specific cutoffs do disrupt calibration by making identical scores imply different decisions, but this does not merely "relocate" unfairness—it shifts the fairness objective from calibration to error parity, which may better address equity in outcomes.  
  4. Devon is mostly right: Calibration and equal error rates are mutually exclusive under base rate differences, and prioritizing error rate equality is often more aligned with fairness in real-world impacts, though dismissing calibration as just a "convenience" understates its role in model trustworthiness.  
  5. Priya is wrong: Removing segment membership and correlated features ("fairness through unawareness") fails to prevent bias, as proxies in the data can still enable differential treatment, and this approach typically worsens calibration and error disparities by obscuring group differences rather than resolving them.
