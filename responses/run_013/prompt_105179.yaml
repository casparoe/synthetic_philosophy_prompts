prompt: |-
  I've been going back and forth with a friend who defends the Chinese and Singaporean systems, and I keep running into the same knot. His line is that a government's right to rule comes from what it delivers -- growth, safety, order, a roof over people's heads -- and that this is what makes it legitimate, not whether anyone voted for it. Fine so far. But then look at the actual machinery, because it doesn't stop there. Ministers' pay and bonuses are pegged to what top private-sector people earn and get cut when the economy sags, so the government literally pays itself by results. There's an annual report-card exercise where it grades itself on growth, jobs, cleanliness and some vague "harmony" number. And he also insists the people running the thing are the best ones, picked by exams and track records, so it isn't luck that it works -- as if they'd earned the right to rule. Yet the same government holds elections it swears are real, talks constantly about what "the people" want, runs consultation exercises, and then keeps laws letting someone be locked up for a couple of years without trial on a minister's say-so if it's "necessary for order" -- which has nothing to do with whether the economy is going well. He says it's all consistent, it's just "good government." I dont see it.

  So what does this whole bundle actually presuppose about political legitimacy? Does the pay-for-results part commit them to a purely outcome-based view, where consent and process don't matter at all -- and if so, why bother with the elections and the popular-support talk, are those just information-gathering, or is input-legitimacy sneaking back in through the side door? What about the merit-selection strand: is "we're the qualified ones" a claim about results, or a separate procedural claim about who gets to rule? And the detention power -- does that presuppose something beyond outcomes altogether, like the state's standing authority to define and enforce order no matter how well things are going? Reconstruct the theory of legitimacy the practice only makes sense under, tell me which rival theories it genuinely rules out versus which it's merely compatible with, and say where it's underdetermined so that several theories would license the same behavior. Then tell me what would have to change in the practice if we swapped the presupposed view for a straightforwardly democratic one, or for a rights-based one that says some things aren't up for trade against prosperity. I'd rather you separate what's actually settled among people who study this from what's genuinely contested, and not dress up a contested view as the consensus. And write it as continuous prose please -- no headings, bullets, bold, or tables, just the way you'd write it in an email.
reasoning: |-
  Okay, let me unpack this user's query about political legitimacy in Singapore and China. The user is grappling with a friend's defense of these systems based on performance legitimacy, while noticing contradictions in how democratic processes coexist with authoritarian measures. 

  First, I need to reconstruct the underlying theory of legitimacy here. The performance-based aspect suggests a "mandate of heaven" approach where outcomes justify rule. But why keep elections then? Maybe as feedback mechanisms rather than consent tools. The meritocracy piece adds another layer - it's not just results but who delivers them, making expertise part of the legitimacy claim. 

  The detention powers are trickiest. They imply a separate bedrock belief in state sovereignty over order, regardless of outcomes. This suggests a hybrid theory: performance as primary legitimacy source, meritocracy as procedural justification for rulers, and sovereignty as non-negotiable state authority. 

  For rival theories: pure democracy is ruled out by limited elections, while rights-based liberalism conflicts with preventive detention. But it's compatible with Confucian meritocracy or Weberian rational-legal systems if stretched. 

  Swapping theories would change everything: a rights-based approach would axe detention powers regardless of economic performance, while democracy would make elections decisive rather than consultative. 

  The scholarly landscape: consensus exists on Singapore/China being performance-legitimacy models, but debate rages on whether their hybrid elements form a coherent theory or just pragmatic adaptations. The detention issue remains particularly contested - is it a necessary evil or fundamental contradiction? 

  User clearly wants nuance: distinguishing settled knowledge from open debates without pretending academic unanimity exists. Should also note how these systems pressure Western assumptions that input/output legitimacy must align.
answer: |-
  The core tension you're grappling with reveals a sophisticated, hybrid theory of political legitimacy that prioritizes outcomes while incorporating procedural and symbolic elements, creating a system distinct from both liberal democracy and pure authoritarianism. Let's reconstruct its presuppositions, rule out incompatible theories, identify compatibilities, and consider swaps.

  **Presupposed Legitimacy Theory:** This system presupposes **performance-based legitimacy as primary and sufficient**, where the state's right to rule derives *fundamentally* from its ability to deliver tangible goods: economic growth, stability, order, material well-being, and (in Singapore's case) technocratic excellence. Legitimacy is earned and maintained through demonstrable results, judged primarily by material outcomes. Consent ("input legitimacy") is not the *source* of legitimacy but a *byproduct* of effective governance – satisfied citizens are compliant citizens. Elections and consultations serve primarily as **information-gathering mechanisms and safety valves**, not as genuine transfers of sovereign authority. They provide feedback on public sentiment, identify localized grievances, and foster a sense of inclusion *without* implying popular sovereignty. The high pay pegged to private-sector benchmarks reinforces this: the state is run like a high-performing corporation, where executives are rewarded for hitting KPIs (Key Performance Indicators). Meritocracy (exams, track records) underpins this by claiming that only a rigorously selected elite possesses the competence necessary to *deliver* these results consistently, justifying their exclusive hold on power – it's a **procedural justification for outcome-focused rule**.

  The detention power presupposes a **non-negotiable core of state sovereignty**. It assumes the state possesses an inherent, paramount authority to define and enforce "order" and "security" as it sees fit, *regardless* of economic performance or popular sentiment *at that moment*. This power is justified by the *potential* threat to the *foundations* (order, stability) upon which performance-based legitimacy *depends*. It asserts that ultimate state authority transcends both outcomes and procedures in matters deemed existential.

  **Ruled Out Theories:**
  1.  **Pure Democratic Legitimacy (Popular Sovereignty):** The system explicitly rejects the idea that legitimacy flows *solely* or *primarily* from popular consent expressed through free and fair elections where power can change hands. Elections here are managed exercises, not genuine contests for sovereign authority.
  2.  **Liberal Rights-Based Legitimacy:** It fundamentally rejects the notion that certain individual rights (like due process, freedom from arbitrary detention, free speech as a check on power) are inviolable prerequisites for legitimacy, regardless of outcomes. Rights are contingent upon and subordinate to state-defined order and collective prosperity.
  3.  **Charismatic Legitimacy:** While leaders may be respected, legitimacy is deliberately institutionalized in systems and outcomes, not dependent on the personal qualities of a single leader.

  **Compatible/Underdetermined Theories:**
  1.  **Output Legitimacy (Performance):** This is the core compatible theory, but the system goes beyond a simple claim of "good results." It institutionalizes performance measurement and links rewards directly to it in a way few purely output-based theories explicitly prescribe.
  2.  **Technocratic Legitimacy:** The meritocracy strand strongly aligns with the idea that rule by qualified experts is legitimate, provided they deliver. This is deeply intertwined with the performance claim.
  3.  **Weberian Rational-Legal Legitimacy (Modified):** It *resembles* rule-bound bureaucracy based on laws and procedures (exams, KPIs, formal legal structures). However, its compatibility is partial and strained by the arbitrary detention power, which acts as a sovereign exception *outside* normal legal procedures, undermining pure legal-rational consistency.
  4.  **"Asian Values" / Communitarian Legitimacy:** The emphasis on harmony, order, collective well-being over individual rights, and deference to authority fits within frameworks arguing that legitimacy in certain cultures prioritizes societal stability and prosperity over liberal individualist norms. The "harmony" metric reflects this.
  5.  **"Mandate of Heaven" (Modernized):** The concept that legitimacy is earned through good governance and lost through failure (economic downturn triggering pay cuts, loss of public confidence) echoes historical ideas where rule is conditional on performance, though stripped of its metaphysical element and institutionalized.

  The **detention power** is the starkest point of underdetermination or tension. Within the system's *own* logic, it's justified as necessary to *preserve* the conditions for performance legitimacy. Multiple theories *could* license it: a Hobbesian sovereign necessity; a Schmittian sovereign exception; a communitarian sacrifice of individual rights for collective security. However, it remains fundamentally incompatible with rights-based liberalism and strains even modified rational-legal legitimacy.

  **Swapping the Presupposed View:**

  1.  **Straightforward Democratic Legitimacy:**
      *   **Changes:** Elections become genuinely competitive with a real possibility of losing power. Popular sovereignty is paramount. Consultation translates into binding mandates, not just feedback. Ministerial pay might be set by independent bodies or legislative approval, not private sector benchmarks. The detention power would be abolished or subject to rigorous, independent judicial review, not ministerial decree. The "best people" claim would be tested openly at the ballot box, not just through internal selection. The state's self-grading would be replaced by independent audits and free media scrutiny. Legitimacy crises would arise from electoral losses or perceived lack of popular mandate, not just economic downturns.

  2.  **Rights-Based Legitimacy:**
      *   **Changes:** Certain rights become absolute constraints on state power, irrespective of outcomes. The detention power would be abolished; due process would be non-negotiable. Freedom of speech and assembly would be robustly protected to enable criticism and accountability, even if deemed disruptive to "harmony." Ministerial pay might be de-linked from private sector performance to avoid perceptions of self-dealing and focus on public service ethos. Performance metrics would be secondary to upholding fundamental rights. Legitimacy would depend on respecting these rights, even during economic hardship or perceived threats to order. The state's authority to define "order" would be severely circumscribed by constitutional rights and judicial oversight.

  **The Scholarly Landscape:**

  *   **Settled:** There is broad consensus that Singapore and China are prime examples of regimes relying heavily on **performance legitimacy**. Scholars agree their systems actively cultivate this through economic delivery and technocratic management. There's also consensus that their elections are not mechanisms for democratic power transfer but serve other functions (information, legitimation ritual, elite management). The tension between performance claims and illiberal practices is widely acknowledged.
  *   **Contested:** The *coherence* and *long-term sustainability* of this hybrid model are hotly debated. Some argue it represents a distinct, stable form of "meritocratic authoritarianism" or "performance-based authoritarianism" that successfully blends elements. Others see fundamental contradictions: Can the information-gathering function of consultations work without genuine feedback loops? Does the arbitrary detention power fatally undermine the rational-legal and meritocratic claims? Is performance legitimacy sufficient during prolonged economic stagnation or when rising middle classes demand greater voice? The role of nationalism/patriotism as an *additional* legitimizing factor alongside performance is also debated. Whether this constitutes a *novel theory* of legitimacy or just a pragmatic authoritarian adaptation is contested.
  *   **Underdetermined:** The precise weight given to each element (performance, meritocracy, sovereignty, symbolic democracy) and how tensions between them are resolved in practice varies and is context-dependent. The detention power remains a particular point of contention regarding its compatibility with the system's *own* stated principles.

  In essence, your friend describes a system where legitimacy is earned through delivery, managed by a self-selecting elite proven competent to deliver, and protected by sovereign power that trumps individual rights when deemed necessary for the system's survival. It consciously blends elements to create stability and results, but the tensions you identify – between performance and arbitrary power, between consultation and control, between meritocratic claims and the lack of open accountability – are inherent features, not bugs, within its foundational presuppositions about the state's right to rule.
