  The core of the activity is a string manipulation game with two teams: the "System" (team one) and the "Mathematicians" (team two). The system team operates under strict rules, while the mathematicians can reason freely. The target is to derive the string "O" from the starting string "X" using the given rules.

  Rules for the system team (written on index cards for them):

  1. If a string ends in X, append O.
  2. Any string may be doubled.
  3. Any occurrence of XXX may be replaced by O.
  4. Any occurrence of OO may be deleted.

  The invariant that makes "O" (a single O) unreachable is that the number of X's in any string is never divisible by 3. We verify:

  - Start: "X" -> 1 X (not divisible by 3).
  - Rule 1: If a string ends in X, append O. This doesn't change the number of X's.
  - Rule 2: Doubling the string: if the original has k X's (not divisible by 3), then the doubled string has 2k X's. Since 3 doesn't divide k, 3 doesn't divide 2k (because 2 and 3 are coprime).
  - Rule 3: Replace XXX with O. This removes 3 X's and adds 0 X's (since O doesn't count). So the change in the number of X's is -3, which is divisible by 3. Therefore, if the original count was not divisible by 3, the new count (original - 3) is still not divisible by 3 (because subtracting a multiple of 3 doesn't change the residue mod 3).
  - Rule 4: Delete OO. This doesn't change the number of X's.

  The target "O" has 0 X's, which is divisible by 3. But the invariant says that every string derived must have a number of X's not divisible by 3. Therefore, "O" (with 0 X's) is unreachable.

