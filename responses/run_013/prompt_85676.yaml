    - Step 2: In the real case, the formal system already contains the conditional: "If the system is consistent, then the Gödel sentence is true." What the human adds is the premise that the system is consistent. But the mechanist argues that we cannot know the system is consistent in an absolute sense.
    - Step 3: The regress: Once we add the consistency statement as an axiom, the system can prove its own Gödel sentence for the original system. But then there is a new Gödel sentence for the augmented system, and the human can see that one is true too? But then we can add that as well, and so on. The anti-mechanist must claim that the human can always see the truth of the new Gödel sentence for any consistent machine, but the mechanist says that at each step the human is just using more and more powerful formal systems.

  - **70-75 minutes: Conclusion and caveats**
    - What the activity cannot reproduce: In the toy setting, the insight is easily formalized and added to the system. In the real case, the Gödel sentence is a statement about arithmetic that is true but not provable in the system, whereas in our game, the target string "O" is not a statement about the system at all. Also, in the real case, the system already contains enough arithmetic to express the proof of the conditional, which is not the case in our toy system. So the activity does not capture the full depth of the incompleteness theorems.
    - Also, in the activity, the system team is made of humans who might be tempted to cheat, whereas a machine would follow the rules exactly.

  ### Scoring Scheme
  - To motivate the teams, we can use a scoring system based on:
    - Team one: 1 point if they correctly derive the target or correctly state that they cannot (without justification) within the time. But they must follow the rules strictly. If they cheat (e.g., skip steps or reason globally), they lose points.
    - Team two: 2 points if they correctly identify whether the target is derivable and 3 additional points if they correctly explain the invariant. The explanation must be clear and convincing.
  - The points are just for fun and to encourage engagement. The winning team gets bragging rights and perhaps a small non-monetary reward like choosing the topic for a 5-minute fun discussion at the end of the semester or being mentioned in the department newsletter.

  ### What Might Go Wrong and How to Handle It
  1. **A student recognizes the puzzle**: If during the activity, a student (especially in team two) recognizes the invariant early, they might shout it out. To handle this, at the start, emphasize that team two must not interfere with team one's work and must keep their discussions within their team. If someone blurts out, remind them of the rules and ask them to hold the insight until the debrief.

  2. **Team one declares the negative on a hunch**: If team one, without having tried many steps, declares that they cannot produce the target, the instructor should encourage them to keep trying. Remind them that they are only allowed to declare the negative if they have genuinely tried and failed to find a derivation. If they persist, allow it, but note during the debrief that a machine would keep trying forever or until it exhausts all possibilities, but humans might give up early.

  3. **Team one accidentally produces the target**: This should not happen because of the invariant. But if they find a derivation, then there is a mistake in the invariant or in the rules. The instructor should double-check the rules and the invariant beforehand. If it happens, it becomes a teachable moment: sometimes we think we have an invariant but it fails.

  4. **Team two cannot find the invariant**: The instructor should be prepared with leading questions to help them. For example, "What is the number of X's in the starting string? How does it change with each rule?" If they still don't get it, the instructor can reveal it and then discuss.

  ### What the Activity Cannot Reproduce
  - The activity uses a simple combinatorial invariant, while the Gödel sentence is a complex arithmetical statement.
  - The toy system does not have the representational power to express self-reference or arithmetic, which is crucial for the incompleteness theorems.
  - In the activity, the truth of the Gödel sentence (the underivability of "O") is established by an external mathematical argument (the invariant), but in the real case, the truth of the Gödel sentence is equivalent to the consistency of the system, which is not provable within the system. In the activity, the invariant is not something that the system can even express, whereas in arithmetic, the system can express consistency.
  - The activity might give the impression that the human insight is always easily formalized and added to the system, but in the real case, the consistency statement is not finitistically provable, and there are philosophical disputes about what counts as a valid proof of consistency.

  Despite these limitations, the activity can effectively convey the experiential asymmetry and set the stage for a deeper discussion.

  ### Final Plan

  We'll go with one round of the string game followed by a structured debrief that covers the three deflationary steps and the caveats.

