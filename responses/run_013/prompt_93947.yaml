prompt: |-
  I sit on the committee of a residents' association that manages a shared access lane, the refuse arrangements and, for the past decade, a levy for coastal defences along our stretch of seafront. Until now membership has been confined to the freeholders of the original nineteen houses, on the strength of a clause in a founding deed that few of us have read, and that deed requires a two-thirds majority of existing members to admit anyone new. Two things have now put the question of who properly belongs to us in play. A block of twelve flats has been built on what was once our communal garden: the occupiers are leaseholders rather than freeholders, they use the lane, and they are liable for the defence levy, yet they have no vote. Meanwhile a small group of houseboat owners has moored more or less permanently along the shore in front of the terrace; they are not ratepayers at all, but the proposed sea wall would either shelter their moorings or, under the engineers' alternative design, leave them exposed to precisely the flooding the wall is meant to hold back.

  The committee is now deadlocked over that sea wall, which would protect the properties at the northern end — mine among them — while, on the engineers' preferred design, worsening erosion at the southern end and spoiling the view from the flats. The membership is split almost evenly, and we can all do the arithmetic: admitting the flat-dwellers, who overwhelmingly favour the rival design, would carry the day against the northern end, and admitting the houseboat owners would tilt it further still. Some of my neighbours therefore insist that the membership question must be settled first, by a vote of the existing members, before the sea wall is put to any vote at all; others retort that people who pay the levy and live with the consequences are being taxed without a say, and that a body which simply defines its own membership can never be trusted to decide who is affected by what it does. I would like your advice on how the committee ought to proceed — who, if anyone, has a claim to a vote, whether it matters that the newcomers would be voting on a dispute that arose before most of them arrived, and how far I should discount my own judgment given that my house is one of those the northern design would save. I am less interested in a general sermon about inclusion than in how these particular claims sort out, and what would be the fairest way to constitute the body that is to decide.
reasoning: |-
  Okay, the user is part of a residents' association committee dealing with a complex dispute involving membership rules and a coastal defense project. Let me unpack this carefully.

  First, the historical context: The association was originally for 19 freehold houses based on a founding deed requiring two-thirds majority to admit new members. Now there are two new groups - 12 flat leaseholders using shared facilities and paying the levy but without votes, and houseboat owners who don't pay rates but are affected by the sea wall design.

  The immediate conflict is about the sea wall design that would protect northern properties (including the user's) while potentially harming southern properties and flat dwellers' views. The committee is deadlocked, and expanding membership could swing the vote.

  The user's explicit questions are: Who has valid voting claims? Should newcomers vote on pre-existing disputes? How to manage their personal conflict of interest? They want practical fairness, not abstract inclusion principles.

  Hmm... this needs layered analysis. Legally, the deed governs but may not reflect current realities. Ethically, the "no taxation without representation" principle applies to levy-payers. Practically, excluding affected parties creates enforcement risks. 

  The houseboat owners present the trickiest case since they don't pay the levy but face direct consequences. Their claim feels weaker than the flat dwellers' but still morally significant given the flooding risk.

  On the timing issue: While the dispute predates newcomers, they'll live with the outcome. Excluding them seems artificially restrictive. The real concern is whether admitting them now would feel like "packing" the vote - which suggests a need for neutral mediation.

  For the user's conflict: They should absolutely recuse from membership decisions affecting their property. Their self-awareness here is commendable.

  The solution probably involves separating the membership question from the sea wall vote. Getting legal advice on amending the deed is wise, but ethical obligations extend beyond strict legality. Maybe a transitional approach with provisional votes for levy-payers while reforming membership rules?
answer: |-
  Based on your detailed description, the core issues are **membership eligibility**, **procedural fairness**, and **conflict of interest**. Here’s a structured approach to resolving the deadlock:

  ### 1. **Who Has a Legitimate Claim to Membership/Voting Rights?**
     - **Flat Leaseholders (12 flats):** 
       - **Strongest claim.** They pay the coastal defence levy, use shared infrastructure (lane, refuse), and are materially affected by the sea wall design. Excluding them violates the principle of "no taxation without representation." Their leasehold status (vs. freehold) is a technicality that should not override their substantive contributions and impacts.
       - **Action:** They should be granted voting rights *before* any sea wall vote. Their admission aligns with the original deed’s spirit (managing shared assets/levies), even if not its literal wording.
     
     - **Houseboat Owners:**
       - **Weaker claim.** They pay no levy and lack a formal property stake. While affected by flooding, their mooring is likely unauthorized or informal. Granting votes could set a precedent for non-contributing stakeholders to influence decisions funded by others.
       - **Action:** Exclude from voting but consult them on design impacts. Their interests can be represented via environmental/community impact assessments by the engineers.

     - **Existing Freeholders (19 houses):** 
       - Retain votes but must acknowledge expanded community impacts. The deed’s two-thirds admission rule should be tested for legality/modern relevance (see below).

  ### 2. **Procedural Steps to Break the Deadlock**
     - **Step 1: Seek Legal Review**  
       Consult a property lawyer to:
       - Clarify if the founding deed’s membership clause is enforceable given changed circumstances (e.g., loss of communal garden, new levy-payers).
       - Determine if leaseholders have implied rights through levy payments or historical access agreements.
       - Explore amending the deed via majority vote if outdated.

     - **Step 2: Separate Membership Reform from Sea Wall Vote**  
       - **Do not** conflate the two issues. Vote on admitting flat leaseholders *first*, as their exclusion is ethically urgent.
       - **Proposal:** Put a resolution to existing members: *"Admit all current coastal defence levy-payers (flat leaseholders) as voting members, effective immediately."* Frame it as correcting an oversight, not influencing the sea wall outcome.
       - **Argument:** Emphasize that the levy is a *de facto* membership criterion. Refusing to admit payers undermines the association’s legitimacy.

     - **Step 3: Neutralize Conflict of Interest in Sea Wall Vote**  
       - **Your recusal:** As a northern homeowner, you have a clear conflict. Recuse yourself from *all* sea wall votes and debates. Chair the process neutrally or appoint an independent facilitator.
       - **Expert mediation:** Hire coastal engineers to present *neutral* data on both designs’ impacts (erosion shifts, view obstructions, houseboat risks). Require a cost/benefit analysis for *all* affected parties.

     - **Step 4: Conduct a Fair Sea Wall Vote**  
       - **Voters:** Existing members + newly admitted flat leaseholders.
       - **Timing:** Newcomers *should* vote even if the dispute predates them. They bear long-term consequences and pay the levy. Excluding them is unjust.
       - **Ballot design:** Ranked-choice voting on designs (including a "no wall" option) to ensure majority support.

  ### 3. **Addressing the "Taxation Without Representation" Dilemma**
     - **Key principle:** Those paying for and affected by a decision deserve a voice. The association’s credibility hinges on this. Forcing levy-payers to fund a project they can’t influence is untenable and risks non-payment or legal challenges.
     - **Counterargument to "Settle Membership First":** Delaying the sea wall vote until after membership reform is valid, but only if reform includes *all* materially affected contributors (i.e., flat leaseholders). Excluding them to preserve the status quo is self-serving.

  ### 4. **Fair Constitution of the Voting Body**
     - **Ideal electorate:** All who (a) pay the levy, and (b) are directly impacted by the association’s decisions.
       - **✅ Includes:** Freeholders + flat leaseholders (both pay levy and face flooding/view impacts).
       - **❌ Excludes:** Houseboat owners (no levy, informal status).
     - **Path forward:** 
       - Amend the deed to define membership as "all properties subject to the coastal defence levy." This future-proofs the association.
       - For the current vote, adopt this definition provisionally as a matter of fairness.

  ### Recommendation Summary:
  1. **Admit flat leaseholders immediately** via a vote of existing members, citing their levy payments and impacts.  
  2. **Recuse yourself** from sea wall decisions.  
  3. **Hold the sea wall vote** with the expanded membership (19 houses + 12 flats).  
  4. **Exclude houseboat owners** from voting but document their concerns formally.  
  5. **Update the founding deed** to reflect the modern community structure.  

  This approach prioritizes ethical governance ("levy = voice") over technicalities, while containing the houseboat issue. It avoids gerrymandering by either side and centers the decision on those who fund and endure the outcomes.  

  *Final note:* If existing members refuse to admit leaseholders, consider legal action (e.g., a leaseholder challenge to the levy’s legitimacy) or external mediation—but this risks community discord. Transparency and principle-based arguments are your strongest tools.
