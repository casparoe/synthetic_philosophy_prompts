  What both are missing about whether side effects can be defined without a full specification of value:

  - The core idea: Can we define side effects without a full theory of value?

    Side effects are typically understood as changes that are not intended and that might be harmful. But to define "harmful", we need a theory of value. Alternatively, if we define side effects as any change (regardless of harm), then we avoid the need for a theory of value? But that leads to the problem of avoiding beneficial changes.

    Both Dana and Ravi are missing that:

    a) The measure as proposed (penalizing any change) is too broad because it penalizes good changes as well as bad ones. Without a way to distinguish between good and bad changes (which requires a theory of value), we cannot have a measure that only penalizes bad side effects.

    b) However, it might be possible to define a conservative measure that only penalizes changes that are likely to be harmful. For example, we might define side effects as changes that reduce the options of other agents (or the diversity of options). But even that requires a way to measure the "value" of the set of futures (so we can say that a reduction is bad). Without that, we are stuck with counting the magnitude of change (which might be measured by the size of the symmetric difference of the sets of futures, for example) but that does not distinguish between positive and negative.

    c) Ultimately, any measure that tries to capture "side effects" must make some value judgments about which changes are undesirable. The hope of being value-free is illusory. But we might be able to make minimal and relatively uncontroversial value judgments (like "preserving human life and basic capabilities is good") and build from there.

    d) Another approach is to accept that we need a utility function for the desired outcomes and then define side effects as changes to other aspects of the state. But that requires specifying what the desired outcomes are (and hence a utility function). Dana's proposal tries to avoid a utility function by using the baseline and change in available futures.

    In summary, both are missing that the very notion of a "side effect" is value-laden. Without a theory of value, we cannot distinguish between a side effect and a main effect, nor between a harmful side effect and a beneficial one. Therefore, any measure that aims to penalize side effects must incorporate some value judgments, either explicitly (via a utility function) or implicitly (via the choice of baseline, agents, states, and the metric of change).

