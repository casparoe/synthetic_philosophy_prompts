answer: |-
  Here is a five-point research proposal addressing your query, structured as requested:

  1.  **Precise Research Question:** How should a decision theory prescribe rational pairwise choices between gambles (finite or infinite outcome sets) when the standard expected utility calculation is undefined for both (due to non-convergence or non-summability of the utility-payoff series), and specifically, can we construct a consistent, axiomatically grounded choice rule over such gambles that resolves specific paradoxes like the Pasadena game and its variations (e.g., vs. Altadena, vs. Nothing, vs. St. Petersburg)? The core is defining "rational preference" absent standard expected value.

  2.  **Why Existing Positions Fall Short:** Standard solutions (capping, utility transformations, rejection) explicitly *avoid* defining preferences *within* the problematic set of gambles with undefined expectations, instead modifying the gambles or the domain. Non-expected utility theories (e.g., rank-dependent, cumulative prospect) often rely on transformations that assume finite expectation or handle specific anomalies but lack a general principle for the *undefined expectation* class itself. The literature diagnoses the problem but doesn't provide a positive decision rule for comparisons *within* this class.

  3.  **Concrete Method for Progress:** Develop a formal axiomatic framework starting from minimal, plausible principles for rationality under undefined expectations (e.g., dominance, weak stochastic dominance adapted for partial sums, continuity under certain perturbations, consistency with finite approximations). Systematically apply these axioms to pairwise comparisons central to the paradoxes (Pasadena vs. Constant $X$ for various X, Pasadena vs. Altadena, Pasadena vs. St. Petersburg). The goal is to derive necessary and sufficient conditions on the gambles' structure (e.g., asymptotic behavior of partial sums, Cesaro means) for one to be rationally preferred over the other under the axioms.

  4.  **What a Result Would Look Like:** A successful outcome would be 1) A set of axioms deemed reasonable for choice under undefined expectation, 2) A specific, computable choice rule derived from these axioms (e.g., "Prefer gamble A over B if the limit of the difference in their partial Cesaro sums exists and is positive"), 3) Proof that this rule satisfies the axioms, 4) Demonstration that this rule yields determinate, intuitively plausible preferences for the key Pasadena comparisons (e.g., Pasadena preferred to low constants but not to high ones, incomparable or equal to Altadena depending on axioms), and 5) Analysis of limitations (e.g., gambles where the rule remains indeterminate).

  5.  **Honest Assessment of Risks and Framing Confidence:** The biggest semester risks are: a) **Intractability:** Finding consistent axioms yielding determinate answers might be impossible or require overly complex mathematics (e.g., advanced analysis/summability theory). b) **Counterexample Proliferation:** Constructed rules might handle Pasadena but fail on newly devised, structurally similar gambles, revealing insufficient generality. c) **Axiomatic Deadlock:** All plausible axiom sets might lead to either contradiction, pervasive incomparability, or counterintuitive results (e.g., Pasadena preferred to *all* finite amounts). My confidence in this framing hinges on the *possibility* of identifying robust asymptotic properties as a basis for preference; if it can be shown that *no* rule based on partial sums/asymptotic behavior can satisfy even weak dominance and consistency axioms without contradiction, the framing would fail, demanding a radically different approach (e.g., focusing solely on finite truncations or abandoning completeness).
