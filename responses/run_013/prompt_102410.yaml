prompt: |-
  I'm a PhD student and my supervisor is a Rawlsian of the old school — reads the Restatement like scripture. I'm trying to guess her verdicts before she gives them, mostly to save myself a meeting.

  Her track record on distributive stuff so far:

  - Flat consumption tax that lifts GDP but leaves the bottom fifth's real income exactly where it is: unjust, no hedging.
  - A graduate tax that funds universal childcare and actually widens the ratio between top and bottom: just, on the grounds that the bottom fifth end up better off than they would under the status quo.
  - A housing reform that hands landowners a windfall but funds social housing, where she agreed a land-value tax would have done more for the bottom fifth — she still called it just, because the land-value tax wasn't politically feasible.
  - Letting hospitals set specialist pay by the market, which she was fine with, her stated reason being that the bottom fifth do better under it than under the flat-scale alternative.
  - Cutting the top marginal rate to fund a jobs guarantee that mostly helps the bottom two fifths: just.

  So: she's obessed with the bottom group, tolerates inequality when the bottom gains, and won't hold a policy hostage to a non-feasible alternative. Fine.

  Now the new case. My working group is drafting a comment on a proposal for a global minimum corporate tax plus a levy on AI compute, with the revenue going into a fund that transfers to the poorest countries. As drafted: rich countries lose a little, the poorest countries gain a modest amount, and the global bottom decile end up better off than under the status quo — but a version with tougher capital controls and a much larger transfer would have done far more for the poorest countries, and the drafters dropped that to keep the rich countries on board. The countries in question aren't failed or burdened states; they're just poor relative to the top.

  Does she call the proposal as drafted just? I care less about the verdict than about the rule. Give me the candidate rules that fit her earlier verdicts, what each one predicts here, your best guess with reasons, and the one further case that would actually tell the rules apart.

  You're a political philosopher who knows Rawls's corpus closely — Theory, Political Liberalism, the Restatement, The Law of Peoples — so reason from the structure of the view, not from vibes. Brainstorm the candidate rules first, then narrow. Say how confident you are in each claim, and flag the single point you're least sure about.
reasoning: |-
  Okay, let me approach this systematically. The user is a PhD student trying to model their Rawlsian supervisor's policy judgments, specifically regarding a global tax proposal. The key is to reverse-engineer the supervisor's decision-making framework based on her prior verdicts.

  Looking at the pattern in her past decisions, several consistent principles emerge:
  - She prioritizes absolute gains for the bottom quintile/decile above all else
  - She accepts policies that increase inequality if they benefit the least advantaged
  - She considers feasibility constraints when evaluating alternatives
  - She applies what seems like a domestic difference principle globally

  For this new case, the core tension is whether the "modest gain" for the global poorest satisfies her threshold, given that a better alternative existed but was deemed infeasible. The supervisor's history suggests she'd likely accept this as just because:
  1) The bottom decile gains absolutely compared to status quo
  2) The tougher alternative wasn't politically feasible
  3) The proposal avoids worsening the poorest's position

  The tricky part is whether "modest gain" meets her standard of maximization - but her housing reform precedent shows she accepts suboptimal gains when constraints exist. Her rejection of the flat tax that left the bottom unchanged further confirms that any gain, however small, might suffice.

  I should note one uncertainty: whether her "bottom group" definition scales consistently from quintile to decile. If pressed, I'd predict she'd accept the decile framing given her global focus. The clearest test case would involve a policy with trivial gains for the poorest versus one with larger gains but higher political risk.
answer: |-
  Based on Rawlsian principles and your supervisor's consistent pattern of judgments, here's a systematic analysis of candidate rules, predictions for your case, and a distinguishing test case.

  ### Core Pattern from Past Verdicts
  1.  **Primacy of the Least Advantaged:** Absolute improvement for the *identifiable bottom group* (domestic 1/5th, global decile) is the paramount criterion.
  2.  **Pareto-for-the-Poor Suffices:** If the bottom group gains *anything* compared to the status quo, the policy can be just, even if:
      *   Inequality increases significantly (Graduate Tax, Hospital Pay).
      *   A *feasible* alternative would benefit them more (Housing Reform - LVT was *infeasible*).
  3.  **Status Quo as Baseline:** Justice is assessed *relative to the status quo*, not an abstract ideal. Alternatives must be *feasible* to be relevant counterfactuals.
  4.  **No Loss Tolerance:** Policies that leave the bottom group *no better off* (Flat Tax) are rejected, even with societal gains.
  5.  **Feasibility Constraint:** Political/institutional realities are binding constraints on the set of "available" just alternatives. Justice doesn't require the impossible (Housing Reform, implied in Capital Controls case).

  **Candidate Rules Fitting the Pattern (Ordered by Specificity):**

  1.  **Strict Feasible Maximin:**
      *   *Rule:* A policy is just iff it *maximizes* the position of the least advantaged group *among all feasible alternatives* compared to the status quo.
      *   *Prediction for AI Tax:* **Unjust.** The draft *does not maximize* gains for the global bottom decile; the tougher version (with capital controls) is acknowledged as "doing far more" and was *feasible enough to be drafted/considered*, even if ultimately dropped for political reasons. (*Confidence: Low - clashes with Housing Reform verdict where LVT wasn't feasible*).

  2.  **Feasible Gain Sufficiency:**
      *   *Rule:* A policy is just iff it provides *some absolute gain* to the least advantaged group compared to the status quo, *and* no *feasible* alternative exists that would provide them a *larger gain* without violating other basic liberties or stability requirements.
      *   *Prediction for AI Tax:* **Unjust.** While the draft provides a gain, the tougher version *was feasible enough to be drafted* and offered larger gains. Dropping it "to keep rich countries on board" suggests it was *politically* difficult but not *institutionally infeasible* (like the LVT likely was). (*Confidence: Medium - hinges on strict interpretation of "feasible"*).

  3.  **Political Feasibility Gain Sufficiency (Most Likely Fit):**
      *   *Rule:* A policy is just iff it provides *some absolute gain* to the least advantaged group compared to the status quo, *and* any alternative providing a larger gain is *not politically feasible within the relevant institutional/policymaking context*.
      *   *Prediction for AI Tax:* **Just.** The draft provides a modest gain to the global bottom decile. The tougher alternative, while potentially *technically* feasible, was deemed *politically infeasible* ("dropped to keep rich countries on board") and thus is not a relevant counterfactual for assessing justice *of this proposal*. This mirrors the Housing Reform logic. (*Confidence: High - best fits Housing Reform precedent and her pragmatic focus*).

  4.  **Status Quo Gain Sufficiency:**
      *   *Rule:* A policy is just iff it provides *some absolute gain* to the least advantaged group compared to the status quo. Feasibility of better alternatives is irrelevant.
      *   *Prediction for AI Tax:* **Just.** It makes the global bottom decile better off. (*Confidence: Medium - fits all verdicts *except* potentially the implicit comparison in the Housing Reform where feasibility mattered; too permissive*).

  **Analysis & Best Guess:**

  *   **Rule #3 (Political Feasibility Gain Sufficiency) fits her pattern best:**
      *   Explains the **Housing Reform** verdict: Status quo gain? Yes. Better alternative? Yes (LVT), but *infeasible*, so reform is just.
      *   Explains rejecting the **Flat Tax**: No gain for the bottom quintile.
      *   Explains accepting **Graduate Tax/Hospital Pay/Jobs Guarantee/Capital Cut**: Bottom group gains, even if inequality rises.
      *   Explains accepting the **Jobs Guarantee funded by Top Rate Cut**: Bottom group (two fifths) gains significantly.
      *   **Prediction for AI Tax:** **Just.** The bottom decile gains modestly. The tougher alternative was *politically* infeasible ("to keep rich countries on board"), analogous to the LVT being politically infeasible. She focuses on the achievable gain.

  *   **Confidence:** High (85%). The Housing Reform case is the strongest parallel, establishing that political feasibility constraints negate the relevance of "better but impossible" alternatives. The gain for the global poor, while modest, meets the threshold.

  *   **Why not Rule #1/2?** They require maximizing or ensuring no feasible-larger-gain alternative exists. The Housing Reform verdict shows she doesn't demand maximization when constraints bind. The AI Tax drafters *could* have proposed the tougher version (it was feasible to draft), but its political infeasibility *at the implementation stage* likely makes it irrelevant for her, just like the LVT.

  *   **Why not Rule #4?** It's possible but less nuanced. It wouldn't explain why she implicitly *compared* the Housing Reform to the LVT at all; she'd just note the gain for the poor and call it just. Her *mention* of the LVT suggests feasibility of alternatives matters contextually.

  **The Crucial Point of Uncertainty:**
  *   **The interpretation of "feasible" in the AI Tax case.** Is the tougher alternative with capital controls deemed *politically* infeasible in the same way the Land Value Tax was? Or is its rejection merely a matter of political *convenience* or *bargaining* ("keeping rich countries on board") rather than genuine impossibility? **This is the single point I'm least sure about.** If she sees the capital controls version as *genuinely unenactable* (like LVT), Rule #3 holds. If she sees it as *politically difficult but enactable with sufficient will* (merely a compromise), she *might* lean towards Rule #2 and deem the draft unjust.

  **The One Further Case to Tell the Rules Apart:**
  *   **The Test Case:** A policy provides a *very small* absolute gain to the bottom quintile compared to the status quo. A *feasible and enactable* alternative exists that would provide a *much larger* gain to the bottom quintile, but it was rejected purely because it provided *slightly less* gain to the *top* quintile (not because it harmed the bottom or violated liberties/stability, just less top gain). The rejected alternative is demonstrably politically feasible – similar policies have passed elsewhere or have majority public support, but the governing coalition chose the smaller-gain option to appease a wealthy donor base.
      *   **Rule #1 (Strict Maximin):** Unjust. It doesn't maximize the bottom's position; the better alternative is feasible.
      *   **Rule #2 (Feasible Gain Sufficiency):** Unjust. A feasible alternative provides a larger gain to the bottom group.
      *   **Rule #3 (Political Feasibility Gain Sufficiency):** **Just.** The *chosen policy* provides a gain. The *rejection* of the better alternative was a *political choice* (appeasing donors), not evidence that the better alternative itself was *infeasible to enact*. If the better policy *could* have been enacted (feasible) but *wasn't* chosen for bad reasons, that doesn't make the *enacted* policy unjust under this rule; it just means a political injustice occurred. (This mirrors the potential AI Tax concern).
      *   **Rule #4 (Status Quo Gain Sufficiency):** Just. It provides a gain.
  *   **Why it Distinguishes:** This test directly probes whether the *reason* an alternative wasn't chosen matters. If your supervisor calls this test case **unjust**, she likely adheres to **Rule #2** (demanding no feasible-larger-gain alternative exists). If she calls it **just**, she firmly adheres to **Rule #3** (focusing solely on the gain of the enacted policy and the *enactability feasibility* of alternatives, not the political *choices* leading to enactment). Her verdict on this test case would resolve the uncertainty about the AI Tax scenario.
