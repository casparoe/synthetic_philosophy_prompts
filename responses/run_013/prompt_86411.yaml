prompt: |-
  A friend and I argued past midnight about whether the international community killed people in Rwanda, and we broke off with neither of us conceding, so I would like our two positions mapped rather than adjudicated. The facts are not what we disagree about; take them as given. In January 1994 the commander of the United Nations force in Rwanda sent a cable warning of preparations for mass killing and asking leave to raid arms caches, and leave was refused. After the president's plane was shot down in April and the killing began, ten Belgian peacekeepers were murdered on the first day and the Security Council answered by cutting the force from roughly 2,500 troops to a token few hundred; the proposal to jam the radio station that was directing the killers was discussed and dropped; the reinforcements the commander asked for did not arrive while the killing was at its height; and it went on for about a hundred days. My friend holds that it is a category mistake to speak of a cause here at all: an omission is not an event, nothing happened, and nothing cannot kill anybody; all we may say is that the dead would probably have been fewer, or would be alive, had matters gone otherwise, which is a claim about a counterfactual and not about the United Nations. I hold that the Council did act — it voted to cut the force, it refused the raids, it adjourned — and that the omission, if that is what it is, is made of decisions.

  What I want is the claims separated. First, say which of three things each of us is really asserting when we say the non-intervention caused the deaths: that the absence is itself a cause alongside the others; that the absence is no cause but the deaths counterfactually depended on it; or that the absence is no cause but belongs in the best explanation of why the killing was not stopped — and say which of these can be defended, and which of my friend's objections it survives. Second, test the account against this case rather than a tidy one: the omission is composed of decisions, it is distributed across many agents each of whom did something individually innocent, the counterfactual is genuinely indeterminate, and it stretches over a hundred days rather than an instant. Say which of these the theory absorbs and which it cannot. Third, answer the move my friend used to close the argument — that we fasten on the United Nations only because we disapprove of its inaction, and that had the same thing happened where no one cared, no one would speak of a cause at all. If he is right that the causal judgment here tracks a moral one, does that debunk the causal claim, or does it show that our notion of causing is normative through and through? Finally, run it the other way: if omissions can cause, what becomes of the doctrine that killing and letting die differ in kind — does the metaphysics underwrite the moral difference, or leave it looking like one we impose? Where the theory goes silent, say so instead of forcing it to speak.
reasoning: |-
  Hmm, the user presents a complex philosophical debate about causality and moral responsibility regarding the Rwandan genocide. They want their position and their friend's position mapped without adjudication, focusing on conceptual distinctions rather than factual disputes. 

  The user's core concern is ontological: can institutional inaction (especially when composed of deliberate decisions) qualify as a cause of death? Their friend argues it's a category error - omissions aren't events and thus cannot cause anything. The user counters that the UN's specific decisions (voting to withdraw troops, rejecting radio jamming) constitute concrete actions that collectively enabled the genocide.

  Breaking this down: First, we need to disentangle three causal frameworks at play - direct causation, counterfactual dependence, and explanatory relevance. The friend seems to embrace only the first while rejecting the latter two as non-causal. But in complex systems like genocide, explanatory relevance may carry more weight than simple but-for causation.

  Second, the real-world messiness matters: distributed agency across Security Council members, temporal duration, and counterfactual indeterminacy all challenge neat philosophical models. This case exposes how standard omission theories struggle with institutional actions where "doing nothing" requires active procedural maintenance (like adjourning meetings).

  Third, the friend's closing move is provocative - that we only call it "causation" when we morally disapprove. This touches on fundamental questions about whether causal judgments are inherently normative. The Rwandan case becomes a litmus test: if causation requires moral valence, does that invalidate causal claims about neutral omissions? 

  Finally, the letting-die vs. killing distinction looms large. If UN inaction caused deaths, does that collapse the moral difference with active killing? Probably not - but it might force us to articulate why enabling mass murder through deliberate withdrawal differs from direct killing, rather than assuming an absolute metaphysical divide.

  The user seems philosophically sophisticated, wanting precise conceptual mapping rather than resolution. Their frustration appears rooted in sensing their friend's position relies on overly reductive metaphysics that can't handle real-world institutional responsibility. The challenge is to honor both positions' coherence while showing where each theory strains against the complexities of genocide.
answer: |-
  Here's a mapping of your positions against the philosophical landscape you described, addressing each component without adjudicating truth:

  ### 1. Core Causal Claims: What Each Assertion Represents
  - **Your Position ("The UN caused deaths"):**  
    You assert that the *absence of intervention* is itself a **causal factor** (specifically, a *negative cause*) because it is constituted by concrete **decisions** (voting to cut troops, refusing raids, adjourning). This aligns with the view that omissions *are causes* when they involve deliberate choices by capable agents.  
    *Defensible?* Yes, under "dependent omission" theories (e.g., David Lewis), where failures to act *by duty-bound agents* are causal. Survives the objection that "nothing happened" by reframing "nothing" as *active choices not to intervene*.

  - **Your Friend's Position ("No causation, only counterfactuals"):**  
    They assert that the UN’s inaction is **not a cause** but a condition for **counterfactual dependence**: deaths depended *counterfactually* on UN choices (e.g., "had the UN reinforced troops, fewer would have died"), but causation resides *only* in the positive acts of the killers.  
    *Defensible?* Yes, under pure "actual causation" theories (e.g., Ned Hall), which require physical processes. Survives the "category error" objection by insisting causes must be events.  
    — *Also implied*: The UN’s role belongs in the **best explanation** for why killings were unchecked, but this is *explanatory* without being *causal*.

  ### 2. Testing the Theories Against Real-World Complexity
  - **Omission as Composed of Decisions:**  
    - *Your view absorbs this*: Decisions (votes, refusals) are discrete acts making the omission "positive."  
    - *Friend’s view struggles*: If each vote/adjournment is an "event," denying causation becomes inconsistent.  
  - **Distributed Agency (Many Agents):**  
    - *Both views strain*: Collective action problems blur responsibility. Your view must argue the *institution* (UNSC) is a causal agent; your friend can deny collective causation entirely.  
  - **Indeterminate Counterfactual:**  
    - *Friend’s view vulnerable*: If it’s uncertain whether intervention *would* have stopped killings, counterfactual dependence weakens.  
    - *Your view less affected*: Focuses on actual capacity/duty to act, not speculative outcomes.  
  - **Temporal Duration (100 Days):**  
    - *Your view handles this*: Ongoing decisions (e.g., daily non-reinforcement) constitute a "causally relevant absence."  
    - *Friend’s view struggles*: Prolonged inaction may be seen as a *pattern* of counterfactual dependence, but still not "causal."  

  ### 3. Does Moral Disapproval Drive Causal Judgment?
  - **Your Friend’s Closing Move:**  
    *Objection*: We call the UN a "cause" only because we blame it; if no one cared (e.g., a rock blocking aid), we wouldn’t.  
    - **Response:**  
      - If causal judgment *tracks* moral judgment, it **debunks** the causal claim only if causation must be *value-free*.  
      - But many philosophers (e.g., Hart & Honoré) argue causation *is* inherently normative: we label omissions "causes" **only when agents have duties**. Thus:  
        - The UN’s *duty* (via mandate, capability) makes its inaction causal.  
        - A rock has no duty, so its "omission" isn’t causal.  
      - *Conclusion*: This doesn’t debunk causation; it shows **causation in human affairs is agency- and duty-relative**.  

  ### 4. Omissions vs. "Letting Die": Moral Implications
  - **If Omissions Can Cause Deaths:**  
    - *Moral Difference*: **Not erased**, but **contextualized**.  
      - **Killing** (active harm) usually has higher *intentionality* and *directness*.  
      - **Letting die** (omission) may be equally *causal* but less morally culpable *if*:  
        - No duty exists, or  
        - Intervention requires disproportionate sacrifice.  
    - *UN Case*: The UN had a *duty* (peacekeeping mandate) and *capability* (resources/authority), making its omission **morally analogous to killing** in gravity.  
    - *Metaphysical Takeaway*: Causation alone doesn’t dictate moral weight; **duties/intentions do**. The moral difference isn’t "imposed"—it emerges from agent-relative factors.  

  ### Where Theory Goes Silent
  - **Indeterminate Counterfactuals**: Neither theory fully resolves whether the UN *could* have stopped the genocide. Causation claims become probabilistic.  
  - **Collective Agency**: Philosophy lacks consensus on whether institutions (vs. individuals) can "cause" outcomes.  
  - **Temporal Threshold**: No clear principle for how long an omission must persist to count as causal.  

  ### Summary of Positions
  | **Issue**               | **Your Position**                          | **Friend’s Position**                     |  
  |--------------------------|--------------------------------------------|-------------------------------------------|  
  | **Nature of UN Role**    | Negative cause (via decisions)             | Background condition                      |  
  | **Causation Type**       | Best explanation + duty-relative cause     | Counterfactual dependence only            |  
  | **Moral-Causal Link**    | Inextricable (duty defines cause)          | Accidental (causation is value-free)      |  
  | **Killing vs. Letting Die** | Metaphysics supports moral distinction | Moral distinction unrelated to causation |  

  This maps your dispute onto causal metaphysics, showing defensible foundations for both views and where real-world complexity challenges each. The core divide is ontological: is causation solely about physical events, or can duty-bound inaction be causal? Neither position is refuted, but your view better accommodates institutional responsibility.
