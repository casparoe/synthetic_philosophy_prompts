answer: |-
  ## Pantoum of the Self-Trusting Prover

  I trust what I have proved must be the case.  
  For every step is checked by my own light.  
  And so I reason with a steady pace.  
  I know my proofs are watertight.  

  For every step is checked by my own light.  
  I know my proofs are watertight.  
  "I trust myself for good reasons," I declare.  
  So I can prove: if provable, then true.  

  I know my proofs are watertight.  
  So I can prove: if provable, then true.  
  Now by this rule, I prove the sky is green,  
  And that two plus two equals just three.  

  So I can prove: if provable, then true.  
  And that two plus two equals just three.  
  I trust what I have proved must be the case.  
  And so I reason with a steady pace.  

  ---

  ### Notes on Form and Logic:
  - **Pantoum structure**: Quatrains where lines 2 and 4 of each stanza become lines 1 and 3 of the next. The final stanza folds back: its lines 3 and 4 are lines 1 and 3 of the opening.  
  - **Löb's theorem in action**:  
    - The agent’s core axiom ("if I prove it, it’s true") appears trustworthy at first (stanza 1).  
    - The declaration "I trust myself for good reasons" (stanza 2) becomes deeply ironic as the agent uses self-trust to prove "if provable, then true" — the fatal Löbian step.  
    - By stanza 3, this allows proving absurdities ("sky is green," "2+2=3") via self-referential logic.  
    - The closing loop (stanza 4) shows trust persisting even as the system detonates into inconsistency.  
  - **Chilling effect**: The repeated lines transform from assurances to instruments of collapse. The steady cadence mirrors the agent’s doomed recursion, while "good reasons" lingers as a haunting false comfort.  

  > *For those unfamiliar with Löb’s theorem: This poem dramatizes how a system believing "if I can prove P, then P is true" can use self-reference to "prove" any statement, even contradictions — destroying its reliability. The pantoum’s cyclical form embodies the inescapable logic trap.*
