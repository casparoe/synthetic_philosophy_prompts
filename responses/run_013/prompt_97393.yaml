    "core_idea": "Program equilibrium achieves mutual cooperation by enabling players to condition their actions on verified, reciprocal commitments encoded in inspectable program logic.",
    "role_of_code_reading": "It allows programs to directly verify the opponent's strategy (specifically, its contingency on their own cooperation) before choosing an action, enforcing mutual dependency and eliminating surprise defection.",
    "genuine_cooperation": "Qualified yes; it produces stable mutual cooperation in the idealized model because cooperation is the best response to the verified contingent strategy of the opponent, satisfying Nash equilibrium.",
    "corruption_variant": "Mutual cooperation drops to ~90% success rate; the 5% corruption risk breaks the verification mechanism, frequently triggering mutual defection due to misinterpreted intentions.",
    "weakest_link": "The assumption of perfect, unambiguous source code access and interpretation; the equilibrium is highly sensitive to noise or errors in the code-reading process."
  }
