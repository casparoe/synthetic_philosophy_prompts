  ### Philosophy Club Quiz: Social Conventions and Moral Obligations

  **Instructions:** For each scenario, choose the answer that best reflects your view. Answer intuitively—no prior philosophy knowledge needed.

  1. **Tipping Custom**  
     You're in a country where taxi drivers rely on tips due to low wages. You take a taxi but don’t tip. The driver loses expected income.  
     ➤ **Is your act wrong?**  
     - (A) Yes, because the driver is directly harmed.  
     - (B) No, because the employer should pay fairly, not the customer.  
     - (C) Only if the driver noticed and felt disrespected.  

  2. **Queue Jumping**  
     You step out of a bakery queue to check your phone, then slip back in at the front. The person behind objects.  
     ➤ **Is your act wrong?**  
     - (A) Yes, by joining the queue, you agreed to wait your turn.  
     - (B) No, if you didn’t delay others.  
     - (C) Only if you caused a delay.  

  3. **Ignorant Jaywalker**  
     You visit a country where jaywalking is illegal and socially condemned. Unaware of this, you jaywalk on an empty street.  
     ➤ **Is your act wrong?**  
     - (A) Yes, because norms/laws exist for order, regardless of knowledge.  
     - (B) No, since you were ignorant and no harm occurred.  
     - (C) Wrong, but you aren’t blameworthy due to ignorance.  

  4. **Unmarked Parking Spot**  
     A tourist parks in a spot locals treat as reserved for a shop owner (no sign). A local demands they move.  
     ➤ **Must the tourist move?**  
     - (A) Yes, local conventions govern shared spaces.  
     - (B) No, public spots are fair game without signage.  
     - (C) They should move once informed, but weren’t wrong initially.  

  5. **Tipping as Protest**  
     You skip tipping at a restaurant where staff rely on tips because the owner underpays. You aim to protest the system.  
     ➤ **Is your act wrong?**  
     - (A) Yes, the staff still bear the harm.  
     - (B) No, complying perpetuates injustice; protest might force change.  
     - (C) Wrong to staff but right for the bigger cause.  

  6. **Shoes in a Friend’s House**  
     You leave muddy shoes on in a home where removing shoes is customary. Unaware, you track mud. The host is upset.  
     ➤ **Is the host’s resentment justified?**  
     - (A) Yes, you violated their rule and made extra work.  
     - (B) No, they didn’t inform you.  
     - (C) Justified about the mess, not the rule violation (since you were uninformed).  

  7. **Potluck No-Show**  
     You attend a potluck dinner unaware of the custom to bring food. You come empty-handed; there’s less to eat.  
     ➤ **Were you obligated to bring food?**  
     - (A) Yes, attending led hosts to rely on your contribution.  
     - (B) No, you didn’t agree explicitly.  
     - (C) Only if told in advance.  

  8. **Silent Phone in Library**  
     You leave your phone on vibrate in a library where phones must be off. You take a quiet call, disturbing no one.  
     ➤ **Is your act wrong?**  
     - (A) Yes, rules exist for collective order, even without harm.  
     - (B) No, since nobody was disturbed.  
     - (C) Only if someone saw and took offense.  

  9. **Left-Handed Eating**  
     You visit a country where eating with your left hand is rude. Unaware, you do so.  
     ➤ **Is your act wrong?**  
     - (A) Yes, visitors should learn local customs.  
     - (B) No, you couldn’t know, and no harm was done.  
     - (C) Wrong, but you’re blameless due to ignorance.  

  ---

  ### Scoring Key  
  Tally your answers and match the pattern to a philosophical position using the table below. Positions reflect distinct views on whether conventions create moral duties, especially for visitors.  

  | Position               | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Q8 | Q9 |  
  |------------------------|----|----|----|----|----|----|----|----|----|  
  | **Coordination view**  |    | A  | A  | A  |    |    | A  | A  | B  |  
  | **Assurance view**     |    | A  |    | C  |    |    | A  |    |    |  
  | **Harm-based sceptic** | B  | C  | B  | B  | A  | A  | B  | B  | B  |  
  | **Localist view**      | A  | A  | A  | A  | A  | A  | A  | A  | A  |  
  | **Duty-of-inquiry**    |    |    | C  | C  |    | C  | C  |    | A  |  
  | **Complicity view**    | B  |    |    |    | B  |    |    |    |    |  
  | **Standing-asymmetry** |    |    |    |    |    | C  |    |    |    |  

  #### How to Score:  
  1. **Complicity view** and **Standing-asymmetry** are identified by key questions:  
     - If **Q1 = B** and **Q5 = B** → **Complicity view**.  
     - If **Q6 = C** → **Standing-asymmetry** (unless you also have **Q3=C, Q4=C, Q7=C, Q9=A**, suggesting **Duty-of-inquiry**).  
  2. For other positions, count how many answers match each row. You likely align with the position where you have the **most matches**.  
  3. **Ties?** Hybrid views exist! E.g., matching both **Harm-based sceptic** and **Complicity** suggests a protest-focused harm-sceptic.  

  #### Unoccupied Combinations & Why:  
  - **"Visitors must conform + Locals can’t resent" (e.g., Q4=A + Q6=B/C)**  
    - *Gap reason*: Incoherent. If conventions bind visitors, locals have standing to resent violations.  
  - **"Conventions create duties + No duty to inquire" (e.g., Q3=A + Q9=B)**  
    - *Gap reason*: Unattractive. If ignorance doesn’t negate wrongness (Q3=A), visitors *should* inquire (Q9=A).  
  - **"Harm is all that matters + Resentment without harm is OK" (e.g., Q8=B + Q6=C)**  
    - *Gap reason*: Undefended. Harm-sceptics (Q8=B) tie resentment to harm (Q6=A), not abstract rule-breaking (Q6=C).  

  #### Note for Economists:  
  Conventions with **distributive effects** (e.g., tipping shifting wage burdens) amplify harm/complicity dynamics (see Q1, Q5). Harm-sceptics and complicity views weigh these costs explicitly.  

