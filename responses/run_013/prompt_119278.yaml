  ### Designed Activity: Maxwell's Demon and Landauer's Resolution  
  **Objective:** Students experience the demon's apparent violation of the second law and discover that memory reset costs erase any net gain. The activity uses tangible accounting (tokens) to mirror thermodynamic work and entropy costs.  

  ---

  ### **Setting and Roles**  
  - **Class Structure:** 16 students split into 4 teams of 4. Each team acts as a "demon" controlling a molecular sorting system.  
  - **Physical Setup:**  
    - Two chambers (left and right) marked on a table.  
    - A deck of 16 cards: 8 red (fast molecules), 8 blue (slow molecules).  
    - Memory board: A cardboard strip with 2 slots (each slot holds one memory token).  
    - Tokens:  
      - **Work tokens (green):** Represent energy extracted (1 token = \(kT \ln 2\)).  
      - **Memory tokens (white):** Represent bits stored in memory (place in board slots).  
      - **Entropy tokens (red):** Represent heat dissipated to the environment (paid when memory is cleared).  
  - **Teams:**  
    - **Demon Operator:** Places cards into chambers.  
    - **Memory Keeper:** Manages memory tokens (places/clears them).  
    - **Accountant:** Tracks work/entropy tokens.  
    - **Strategist:** Decides when to clear memory.  

  ---

  ### **Rules and Procedure**  
  **Goal:** Sort molecules (cards) to extract work tokens. Red = fast → right chamber; blue = slow → left chamber.  
  **Baseline (No Demon):**  
  - Draw 4 cards randomly, place in left/right randomly.  
  - Measure "work": For every 4 cards, imbalance (e.g., 3 red/1 blue) yields 0 work tokens (equilibrium).  

  **With Demon (Teams Play in Batches):**  
  1. **Batch 1: "Winning" Phase (Unbounded Memory)**  
     - Draw 4 cards one by one from shuffled deck.  
     - For each card:  
       - Demon Operator places it in correct chamber (red→right, blue→left).  
       - Memory Keeper places a white memory token in the next slot (memory fills but is not cleared).  
       - Accountant collects 1 green work token (for sorting).  
     - **Result:** 4 work tokens earned. System is sorted (e.g., all red on right, all blue on left).  
     - **Apparent Violation:** Teams beat baseline (0 tokens) and "violate" the second law.  

  2. **Batch 2: "Resolution" Phase (Finite Memory)**  
     - Reset chambers and reshuffle deck. Memory board starts empty (2 slots).  
     - Draw 4 cards one by one:  
       - **Step 1 (Molecule 1):**  
         - Sort card → +1 work token.  
         - Place white memory token in slot 1.  
       - **Step 2 (Molecule 2):**  
         - Sort card → +1 work token.  
         - Place white memory token in slot 2 (memory full).  
       - **Step 3 (Molecule 3):**  
         - **Memory full!** Must clear memory to proceed:  
           - Pay 2 red entropy tokens (cost to erase 2 bits).  
           - Clear both memory slots (remove white tokens).  
         - Sort card → +1 work token.  
         - Place white memory token in slot 1.  
       - **Step 4 (Molecule 4):**  
         - Sort card → +1 work token.  
         - Place white memory token in slot 2 (memory full).  
     - **Final Reset:** After Batch 2, clear memory again (pay 2 red entropy tokens).  

  ---

  ### **Accounting Scheme**  
  - **Work Tokens (Green):** Awarded per sorted molecule (1 token = \(kT \ln 2\), the work from entropy reduction).  
  - **Entropy Tokens (Red):** Paid per memory bit erased (1 token = \(kT \ln 2\), Landauer cost).  
  - **Net Balance:**  
    - **Batch 1 (No Clear):** Earn 4 work tokens. Memory holds 4 bits (cost deferred).  
      - *Net: +4 tokens (apparent win).*  
    - **Batch 2 (Clear as Needed):** Earn 4 work tokens. Pay 4 entropy tokens (2 clears × 2 bits).  
      - *Net: 0 tokens (resolution).*  

  **Arithmetic Justification:**  
  - Sorting 4 molecules reduces system entropy by \(4 \ln 2\) (nats), allowing work extraction of \(4kT \ln 2\) (4 green tokens).  
  - Storing 4 bits in memory costs nothing initially, but erasing them dissipates \(4kT \ln 2\) of heat (4 red tokens).  
  - **Net work/heat:** \(+4kT \ln 2 - 4kT \ln 2 = 0\). Books balance.  

  ---

  ### **Minute-by-Minute Plan**  
  **Total: 90 minutes**  
  1. **Introduction (5 min):**  
     - Review Maxwell’s demon paradox (students know it).  
     - Explain roles, materials, and token system.  

  2. **Baseline Activity (10 min):**  
     - Teams run "no-demon" sorting (random placement).  
     - Result: 0 work tokens. Highlight equilibrium.  

  3. **Batch 1: Demon Wins (20 min):**  
     - Teams sort 4 cards with unbounded memory.  
     - Result: 4 work tokens. Discuss apparent violation.  

  4. **Batch 2: Resolution (25 min):**  
     - Teams sort 4 cards with finite memory (2 slots).  
     - Force memory clears mid-batch.  
     - Result: 0 net tokens (work = entropy cost).  

  5. **Debrief (30 min):**  
     - Map game to physics:  
       | **Game Step** | **Physics Analogy** | **Entropy Transfer** |  
       |---------------|----------------------|-----------------------|  
       | Sorting a molecule | Demon measures velocity, opens door | System entropy ↓ (\(kT \ln 2\)) → work extracted |  
       | Storing memory token | Demon’s brain records measurement | Memory entropy ↓ (correlated with system) |  
       | Clearing memory | Erasing demon’s memory | Memory entropy ↑ (\(kT \ln 2\)/bit) → heat to environment |  
       | Net zero tokens | Complete cycle | Total entropy change = 0 (second law upheld) |  
     - Key insights:  
       - Demon’s win is loan against future entropy payment.  
       - A demon with infinite memory could extract work but only until memory fills the universe (not physical).  
       - Entropy is paid **during memory reset**, not measurement.  
     - **Limitation of Activity:**  
       - Assumes measurement is free (true in Landauer/Bennett resolution).  
       - In reality, quantum effects may alter costs, but this is classical.  

  ---

  ### **Predictable Problems and Solutions**  
  1. **Confusion:** "Why clear memory?"  
     - **Preempt:** Emphasize memory is physical—limited and must be reused.  
  2. **Degenerate Strategy:** Teams avoid clearing memory to "win" Batch 2.  
     - **Preempt:** Enforce rule: "If memory is full, you MUST clear before sorting next molecule."  
  3. **Accounting Errors:** Miscounting tokens during memory clears.  
     - **Preempt:** Use token cups (green = work, red = entropy). Accountant must swap green for red when paying entropy cost.  
  4. **Misattribution:** Thinking the second law is violated in Batch 2.  
     - **Preempt:** During debrief, contrast Batch 1 (deferred cost) and Batch 2 (immediate cost).  

  ---

  ### **Designer Notes**  
  - **Why This Works:**  
    - **Batch 1** creates visceral "win" (tangible tokens).  
    - **Batch 2** forces confrontation with memory limits—clearing wipes gains.  
    - Token costs map directly to \(kT \ln 2\), making entropy tangible.  
  - **Tested Accounting Schemes:**  
    1. **Option A (Rejected):** Charge entropy per molecule sorted.  
       - Problem: Obscures memory’s role; doesn’t mirror demon’s deferred cost.  
    2. **Option B (Rejected):** Reset memory only at end of batch.  
       - Problem: Misses mid-batch cost, weakening "finite memory" lesson.  
    3. **Chosen Scheme:** Clear memory mid-batch when full.  
       - **Defense:** Forces teams to "feel" the cost during sorting. Mathematically sound (net zero per full cycle).  

  **Final Tip:** Run a dry test with 2 cards before class to refine timing. Use bold tokens (green/red) to avoid color-blindness issues.
