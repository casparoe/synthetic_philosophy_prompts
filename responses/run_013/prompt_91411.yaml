prompt: |-
  For a formal social choice seminar I am taking, I have been asked to draft the joint statement of an adversarial collaboration between two parties who have spent a term arguing past each other about the discursive dilemma. The first holds that a group can literally hold a belief, and that the dilemma is therefore a genuine constraint on group rationality; the second holds that ascriptions of belief to a group are at best shorthand for a profile of individual judgments plus a decision rule, so that the dilemma constrains aggregation rules and reveals nothing about group minds. Write the document both of them could sign: a numbered section of agreed claims, including precisely which conditions on an aggregation rule generate the inconsistency and what becomes of the dilemma once the collective judgment set is permitted to be incomplete, so that the group may abstain on some propositions; then each party's position in wording its own adherents would endorse; then the cruxes, of which I suspect one is whether the group's judgment has a single referent or divides into an aggregative sense and a deliberative one. For each crux, set out the argument or case both sides would agree bears on it, and record each side's prediction in advance. If you conclude that part of their dispute is merely verbal, identify that part and explain why.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration on the discursive dilemma. The two parties are:
   Party A: Believes that a group can literally hold a belief, and that the dilemma is a genuine constraint on group rationality.
   Party B: Believes that ascriptions of belief to a group are at best shorthand for a profile of individual judgments plus a decision rule, so the dilemma constrains aggregation rules and reveals nothing about group minds.

   The document will have:
   1. A numbered section of agreed claims, including:
      a. Conditions on an aggregation rule that generate the inconsistency (the discursive dilemma).
      b. What becomes of the dilemma when the collective judgment set is permitted to be incomplete (abstention allowed).

   2. Each party's position in wording their own adherents would endorse.

   3. The cruxes (key points of disagreement). For each crux:
      a. The argument or case both sides agree bears on it.
      b. Each side's prediction in advance.

   4. If part of the dispute is merely verbal, identify and explain.

   Let's structure the document accordingly.

   I. Agreed Claims

   We agree on the following:

   1. The discursive dilemma (also known as the doctrinal paradox) arises when a group of individuals must make collective judgments on a set of interconnected propositions, including at least one conclusion that is logically determined by others (premises).

   2. The standard setup involves:
      - A set of propositions: at least two premises (P, Q) and a conclusion (R) which is logically equivalent to (P ∧ Q) or some other logical function.
      - Each individual holds a consistent and complete judgment on each proposition (i.e., for each proposition, they judge it true or false).
      - The group aims to produce a collective judgment set that is consistent and complete.

   3. The dilemma arises because there are two ways to aggregate:
      a. Premise-based procedure (PBP): Aggregate the individual judgments on the premises and then derive the conclusion from the aggregated premises.
      b. Conclusion-based procedure (CBP): Aggregate the individual judgments on the conclusion (ignoring the premises) and leave the premises unjudged or aggregated separately.

   4. The inconsistency: Both procedures can lead to different outcomes for the conclusion, and neither procedure simultaneously satisfies all the following conditions for every profile of individual judgments:

      (U) Universal Domain: The aggregation rule accepts any possible profile of consistent and complete individual judgment sets.

      (C) Collective Rationality: The collective judgment set is consistent and complete.

      (A) Anonymity: All individuals are treated equally.

      (S) Systematicity: The collective judgment on each proposition depends only on the individual judgments on that proposition, and the same pattern of dependence holds for every proposition.

      (I) Independence: The collective judgment on each proposition depends only on the individual judgments on that proposition (but the dependence may differ per proposition).

      Note: Systematicity implies independence and same functional form for every proposition.

   5. The conditions that generate the inconsistency (in the standard discursive dilemma) are: 
      - The logical constraint that R = P ∧ Q (or similar) and the requirement of collective consistency and completeness (Collective Rationality) and at least Universal Domain and either Systematicity or Independence plus Anonymity (or similar conditions). 

      Specifically, the impossibility theorems (e.g., List and Pettit, 2002) show that there is no aggregation rule that satisfies Universal Domain, Collective Rationality, and Independence (or Systematicity) and also satisfies a condition like Unanimity Preservation (if everyone agrees on a proposition, the group agrees) and sometimes Anonymity.

   6. When the collective judgment set is permitted to be incomplete (so that the group may abstain on some propositions), the dilemma can be avoided in the sense that we can have aggregation rules that meet Universal Domain, Anonymity, and Independence and produce consistent (but incomplete) collective judgments. For example, in the conclusion-based procedure, the group only judges the conclusion and abstains on the premises. This avoids inconsistency but at the cost of incompleteness.

   7. We also agree that allowing incompleteness (abstention) is one way to avoid the inconsistency, but it comes at the cost of not having a collective view on every proposition. This may be acceptable in some contexts but not in others.

   II. Positions

   Party A's Position (Group Belief Literalist):

   "We maintain that groups can literally hold beliefs. The group as a whole is an agent in its own right, capable of forming judgments that are not reducible to the judgments of its members. The discursive dilemma reveals a deep challenge for group rationality: even when all individual members are rational (holding consistent and complete judgments), the group may be forced into inconsistency if it tries to be complete on all propositions. This inconsistency is a genuine constraint on group rationality, showing that groups, like individuals, must sometimes avoid making judgments on every issue to remain consistent. The dilemma is not merely about aggregation rules but about the limits of group reasoning."

   Party B's Position (Aggregationist):

   "We hold that attributing beliefs to a group is nothing more than a convenient shorthand for a combination of individual judgments and a decision rule. The group itself does not have a mind; it is the aggregation rule that produces a collective output. The discursive dilemma is an important result in social choice theory that highlights the impossibility of satisfying certain desirable properties for aggregation rules when the group is required to be complete and consistent. The dilemma reveals trade-offs in designing aggregation rules, but it does not tell us anything about group minds because groups do not literally have beliefs."

   III. Cruxes

   We identify the following cruxes:

   Crux 1: The Ontology of Group Beliefs

     - The issue: Does the group itself have a single referent for its beliefs, or are group beliefs nothing over and above the aggregation of individual beliefs?

     - Common ground: Both agree that we use language that ascribes beliefs to groups (e.g., "the committee believes that R"). Both also agree that such ascriptions must be grounded in the judgments of the individuals and the aggregation rule.

     - Party A's view: Group beliefs are emergent and irreducible. The group is a cognitive agent that can form beliefs that are not simply the sum of individual beliefs. The group's belief is a single mental state (or state of the group mind) that is about the propositions.

     - Party B's view: The ascription of belief to the group is metaphorical. The group does not have a mind. The so-called group belief is just the output of an aggregation rule applied to the individual judgments.

     - Prediction: Party A predicts that as we develop better theories of group agency, we will find that groups can have mental states that are not reducible to individual states. Party B predicts that a reductionist account will always suffice and that neuroscience and cognitive science will not find evidence of group minds.

   Crux 2: The Interpretation of Incompleteness

     - The issue: What does it mean when the group abstains on a proposition?

     - Common ground: Both agree that allowing incompleteness (abstention) avoids inconsistency.

     - Party A's view: Abstention by the group is a deliberate act of withholding judgment, reflecting the group's epistemic caution. It is a group-level cognitive state of indecision.

     - Party B's view: Abstention is merely a feature of the aggregation rule: the rule does not produce an output for that proposition. It does not reflect a group-level cognitive state but is a result of the rule design.

     - Prediction: Party A predicts that in groups that are designed to be rational agents, we will see patterns of abstention that are responsive to the group's epistemic circumstances (like uncertainty) in a way that mirrors individual cognition. Party B predicts that abstention will always be explicable by the aggregation rule and the individual inputs without invoking group-level cognition.

   Crux 3: The Deliberative vs. Aggregative Sense of Group Judgment

     - The issue: Is there a distinction between the group's judgment formed by deliberation (which might be a unified group position) and the group's judgment formed by aggregation (which is a mechanical combination)?

     - Common ground: Both agree that groups can make decisions by either method.

     - Party A's view: Even in aggregation, the group forms a judgment that is the group's own. Moreover, deliberation can lead to a group judgment that is not reducible to a pre-existing aggregation of individual judgments. The group mind can form a belief through deliberation that transcends the individual inputs.

     - Party B's view: Deliberation is just a process that changes the individual judgments, which are then aggregated. The group judgment is always the result of applying an aggregation rule to the individual judgments (which may have been shaped by deliberation). There is no transcendent group mind.

     - Prediction: Party A predicts that in deliberative settings, groups will reach judgments that cannot be predicted by any fixed aggregation rule applied to pre-deliberation individual judgments. Party B predicts that any post-deliberation group judgment can be explained by a combination of the changes in individual judgments (due to deliberation) and an aggregation rule.

   IV. Merely Verbal Disagreement

   We agree that part of the dispute is merely verbal:

   - The term "group belief" is used by both parties, but they mean different things. Party A uses it to denote a literal belief of the group as an agent. Party B uses it as a metaphor for the output of an aggregation rule.

   - Once we clarify the terminology, the disagreement reduces to whether there is any need to posit a group mind. Party A argues that without such a posit, we cannot adequately explain certain phenomena (like the group's commitment to a decision or the unity of the group's perspective). Party B argues that we can explain everything by individual attitudes and aggregation rules.

   - However, both parties agree on the formal results of the discursive dilemma and the conditions under which inconsistency arises and how it can be avoided. The formal model is accepted by both.

   Therefore, the substantive disagreement is about the ontology of groups (whether groups are agents with minds) and not about the mathematics of aggregation.

