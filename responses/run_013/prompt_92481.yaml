answer: |-
  ### Diagnostic Decision Tree: Locating Your View on Phenomenal Consciousness

  This diagnostic tree helps you locate your position on the causal and epistemic standing of phenomenal consciousness (e.g., the raw feel of pain or the redness of a visual experience). You start by accepting that we make judgments about experiences (e.g., "I see red" or "My pain is throbbing") and that these are not just about behavior or behavioral dispositions. The tree uses concrete cases (e.g., zombies, Mary’s room, blindsight) to anchor questions. Answer each question based on your commitments, not predefined positions. The leaves include major views, each with one sentence on its most awkward commitment.

  ---

  **1. Do phenomenal states exist?** (e.g., when you see red, is there a subjective "redness" beyond physical processes?)  
  - **No** → **Illusionism**  
    *Most awkward commitment: Our judgments about experiences feel true, but they systematically misrepresent reality—there are no phenomenal states at all.*  
  - **Yes** → Go to 2.

  **2. Is the physical world independent of phenomenal states?** (e.g., if all experiences ceased, would the physical world persist unchanged?)  
  - **No** → **Idealism**  
    *Most awkward commitment: Explaining the stable, shared structure of the physical world (e.g., laws of physics) solely through subjective experience.*  
  - **Yes** → Go to 3.

  **3. Are zombies metaphysically possible?** (Zombie case: A physical/functional duplicate of you with no experiences. Could such a being exist?)  
  - **No** → Go to 4.  
  - **Yes** → Go to 5.

  **4. Does Mary learn something new upon seeing red?** (Mary’s room: Mary knows all physical/functional facts about color vision but has never seen color. When she first sees red, does she gain new knowledge?)  
  - **No** → **Reductive physicalism**  
    *Most awkward commitment: Explaining the subjective "feel" of experiences (e.g., pain’s hurtfulness) as *just* functional or representational properties.*  
  - **Yes** → **Type-B physicalism (phenomenal-concept strategy)**  
    *Most awkward commitment: The explanatory gap (why physical processes feel like *this*) persists due to our concepts, yet it’s brute why these concepts exist.*

  **5. Does the experience itself cause judgments about it?** (Blindsight case: Patients can "guess" stimuli without conscious vision. In normal vision, when you report "I see red," is the *experience of red* a cause?)  
  - **No** → **Epiphenomenalism**  
    *Most awkward commitment: Judgments about experiences are caused by physical states alone, so why do they accurately track experiences if experiences are causally inert?*  
  - **Yes** → Go to 6.

  **6. Is the physical domain causally closed?** (e.g., if a judgment occurs, can its causes be fully explained by prior physical events, with no "gaps" for non-physical causes?)  
  - **No** → **Interactionist dualism**  
    *Most awkward commitment: Explaining how non-physical states (e.g., pain) interact with the brain without violating physical laws (e.g., conservation of energy).*  
  - **Yes** → Go to 7.

  **7. What are the intrinsic properties of physical entities?** (Physics describes structure/dynamics; what underlies them?)  
  - **Phenomenal** → **Panpsychism**  
    *Most awkward commitment: The combination problem—how micro-level experiences (e.g., in particles) combine into macro-level consciousness (e.g., human awareness).*  
  - **Protophenomenal** → **Panprotopsychism**  
    *Most awkward commitment: The transition problem—how protophenomenal properties (pre-conscious precursors) give rise to full-blown experience without being experiential themselves.*  

  ---

  ### Notes on the Tree
  - **Unseparated Pair**: The tree cannot distinguish between **panpsychism** and **Russellian monism** (both are covered under "Phenomenal" at Q7). Russellian monism often includes panpsychism or panprotopsychism. To separate them, ask: *Are phenomenal/protophenomenal properties identical to the intrinsic nature of physical properties, or merely correlated?*  
  - **Unoccupied Combination**:  
    - **Zombies possible (Q3: Yes) + Causal efficacy (Q5: Yes) + Causal closure (Q6: Yes) + Intrinsic properties neither phenomenal/protophenomenal (Q7: Other)**.  
      *Diagnosis*: Incoherent—if causal closure holds and phenomenal states cause judgments, they must be physical or intrinsic to it; denying this leaves no room for efficacy without violating closure.  
    - **Zombies possible (Q3: Yes) + Causal efficacy (Q5: No) + Causal closure (Q6: No)**.  
      *Diagnosis*: Unattractive—denying efficacy and closure implies physical causes are incomplete *and* phenomenal states are redundant, making them explanatorily idle.  
  - **Anchoring Cases**:  
    - **Zombies** (Q3): Tests entailment of phenomenal facts by physical/functional facts.  
    - **Mary’s room** (Q4): Tests epistemic gaps in physicalism.  
    - **Blindsight** (Q5): Tests causal role of experiences in judgments by contrasting normal vision (reporting experiences) with blindsight (no experience, no report).  
  - **Total Leaves**: 8 (within 8–12 requirement). Includes all specified positions plus idealism, panprotopsychism, and extras for logical coverage.
