  This memo addresses the panel's duty to recommend whether to pre-position countermeasures in the northern district. Our standing doctrine requires reporting a single official probability that the incident is in the north. The panel adopted a uniform prior (each sub-district: 1/4) last month, leading to a prior probability for the north of 1/2.

