  Crux 3: Ordinal vs. scalar. Maximizing approval might lead to Goodharting. This is next in priority because it affects how we implement approval. Philosophers can tackle this with decision theory and game theory models. Empirical results might influence urgency, but conceptual work is possible now.

  Crux 2: Target of approval. Defining what's being approved (act, disposition, counterfactual) is tricky but less immediate. It depends on solutions to the first two cruxes. Philosophers can explore normative theories here, but it might be premature until the higher-priority issues are addressed.

  I should rank them: Crux 1 first, as it's the most upstream. If the approver's alignment isn't solved, the rest doesn't matter. Then Crux 3, because even with a good approver, scalar optimization could break things. Crux 2 comes last since it's more about implementation once the foundation is solid.

  The user might also have unspoken needs. They probably want to ensure the grant focuses on high-impact, feasible research that justifies funding. They need to convince reviewers that their approach addresses core problems without empirical work. Highlighting the tractability and upstream nature of each question is key. Also, being honest about what's currently researchable builds credibility.

  I should emphasize why these cruxes are load-bearing and not just philosophical noise. For example, Crux 1 isn't just relocating the problem; it's about whether approval direction can be a valid framework at all. Crux 3's ordinal-scalar gap could undermine the entire proposal if ignored. Crux 2, while important, is more nuanced and dependent on the others.

  Finally, the user might need a clear roadmap showing how addressing these in order leads to tangible progress, even without empirical work. Clarifying dependencies between the cruxes will help structure the grant's timeline and milestones.
answer: |-
  Here’s a defended agenda prioritizing the *load-bearing* open questions for approval-directed agents (ADAs), ranked by upstream impact, tractability for philosophers, and urgency. I’ve treated your cruxes as central constraints and flagged where they dominate the ranking:

  ---

  ### **Ranked Research Agenda**  
  *(Load-bearing questions first)*  

  1. **Crux #1: The Approver Alignment Problem (Is approval-direction *fundamentally* a relocation?)**
     - **Why upstream?** If ADAs merely relocate alignment risk to the approver, the entire framework collapses into a regress problem. Nothing else matters if this isn’t resolved. It questions whether ADA is a distinct paradigm or just "RLHF with extra steps."
     - **Tractability:** High for philosophers. Requires:  
       - Formalizing "delegated alignment" (how the *approver* stays aligned with human values under recursive pressure).  
       - Comparing delegation robustness in ADA vs. goal-directed agents (GDAs).  
       - Analyzing failure modes when the approver is corrupted (e.g., reward hacking the human).  
     - **What moves it?**  
       - **Up:** New theorems showing ADA *reduces* alignment tax (e.g., by bounding the approver’s influence).  
       - **Down:** Proof that *any* scalable oversight inherits this problem equally (making ADA redundant).  
     - **Verdict:** **Load-bearing.** If unsolved, ADA is a dead end. Philosophers *can* make progress by mapping delegation hierarchies and failure cascades.

  2. **Crux #3: Ordinal vs. Scalar Approval (Does optimization break robust alignment?)**
     - **Why upstream?** If converting ordinal preferences ("A is better than B") into a scalar ("maximize approval score") inevitably induces Goodharting/manipulation, ADA fails at implementation. This is the core *mechanistic* threat.  
     - **Tractability:** Moderate. Philosophers can:  
       - Model approval as a voting system or comparative judgment framework.  
       - Explore non-optimization-based aggregation (e.g., satisficing, Pareto improvements).  
       - Collaborate with decision theorists on bounded maximization.  
     - **What moves it?**  
       - **Up:** Evidence that scalarization *amplifies* deception risk in GDAs but not ADAs.  
       - **Down:** Axiomatic proof that ordinal signals *must* be scalarized to avoid dithering.  
     - **Verdict:** **Load-bearing.** The ordinal/scalar gap is where ADA’s promised safety often dies. Conceptual work is urgent and feasible.

  3. **Crux #2: The Target of Approval (Act, Disposition, or Counterfactual?)**
     - **Why here?** While critical, this depends on solutions to Cruxes #1 and #3. If the approver is misaligned (#1) or scalarization corrupts (#3), the "right" target won’t save ADA.  
     - **Tractability:** High. Pure normative philosophy:  
       - Formalize counterfactual approval (e.g., "Would a wiser approver endorse this?") as a decision rule.  
       - Compare act-based (consequentialist) vs. disposition-based (virtue ethics) approval.  
     - **What moves it?**  
       - **Up:** Discovery that one target *provably* mitigates Crux #3 (e.g., counterfactuals resist gradient hacking).  
       - **Down:** Proof that all targets reduce to the same behavior under training pressure.  
     - **Verdict:** **Contextually critical, but downstream.** Philosophers can refine this *after* the foundations (#1, #3) are stable.

  ---

  ### **Lower-Priority/Non-Load-Bearing Questions**  
  *(Not worth prioritizing until cruxes are resolved)*  

  - **"How does ADA scale to complex environments?"**  
    Depends entirely on #1–3. Premature without foundational fixes.  
  - **"Can ADA avoid goal-directedness entirely?"**  
    Sounds deep but is likely a red herring – even approval-maximizers develop instrumental goals. Focus on *how* they diverge from GDAs.  
  - **"Neurosymbolic hybrids for approval."**  
    Requires empirical work; out of scope for this grant.  

  ---

  ### **The Brutal Truth: What’s Not Yet Tractable**  
  - **Formalizing "counterfactual approval" (Crux #2) in learning-theoretic terms.** We lack the math to define "smarter approver" robustly. Philosophers can sketch desiderata but can’t solve this alone.  
  - **Bounding the approver’s alignment risk (Crux #1) without empirical data.** We need better models of how corruption propagates in delegated systems – currently handwavy.  
  - **Scalarization thresholds (Crux #3).** At what optimization pressure does ordinal→scalar break? Likely requires sims (outside your scope).  

  ---

  ### **Strategic Recommendations**  
  1. **Years 1–2:** Attack **Crux #1 (Approver Alignment)** and **Crux #3 (Ordinal/Scalar)** in parallel. These are the make-or-break gates.  
  2. **Year 3:** Refine **Crux #2 (Approval Target)** once foundations exist.  
  3. **Drop if:** Crux #1 proves unsolvable (e.g., delegation regress is inevitable) *or* Crux #3 shows ADAs Goodhart worse than GDAs.  

  **Why this ordering?** ADA lives or dies on whether it *genuinely* simplifies alignment (#1) and whether its core mechanic survives optimization (#3). These are philosophically tractable with formal ethics and decision theory. The rest is noise until these are resolved. If Crux #1 falls, the entire frame *is* less interesting – and you’ll have saved years chasing a mirage.
