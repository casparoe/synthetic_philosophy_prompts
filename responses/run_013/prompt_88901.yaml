  The verdict to abandon: none, but they must accept that squashing the clay destroys the statue, which is implied by their bell recast view. And for memory loss, if psychological continuity is broken, it might not be the same person, but they said it is, so maybe adjust psychological continuity to include potential or something. But that's tricky. 

  The flatmate is right that not all can be saved without tension, but the dual-criteria approach minimizes it. The person/body distinction is the most damaging if forced into a single principle, but by categorizing, it's manageable.
