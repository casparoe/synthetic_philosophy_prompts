  Planarian: neither new worm is the original; the original ceased at division. 

  Stress test: a car engine rebuilt with all original parts but over time. If done gradually, same car? If all at once, maybe not. But user might say same if continuity is maintained. 

  The user has to give up the idea that for the statue, the clay's persistence means the statue persists. When squashed, the statue is gone. Also, for memory loss, if they're unsure, the principle might say it's the same person if there's bodily continuity, or if psychological connections are maintained enough. 

  The main conflict is the grandfather case vs. the statue. The principle allows: when the body dies, the person is gone because psychological continuity ends, but the organism (body) remains briefly. The statue is gone when the clay is rearranged. 

  But the user might be okay with that. They already accept that the recast bell isn't the old bell, so form change destroys the thing. Similarly, squashing clay destroys the statue. 

