prompt: |-
  I keep flip-flopping on algorithmic fairness and I'd like you to work out what I actually beleive. My gut verdicts:

  - A lender scores loan applicants. In both groups the score is calibrated (of those scored 0.2, about 20% default). Group X defaults more often, so fewer X applicants clear the cutoff. Fine by me — the same score means the same thing.
  - A recidivism tool, calibrated the same way, but with a much higher false-positive rate for the group that's already over-policed. Not fine. I genuinely can't say why that differs from the loan case — maybe it's that the error costs someone their liberty rather than some money, or that the group carrying the errors is the one already behind.
  - A hiring model that ignores race but leans on postcode and shopping data, and rejects one group at twice the rate. Not fine — feels like laundering.
  - A scholarship that reserves slots so both groups are picked at equal rates, even if it means taking some weaker candidates from the better-off group. Fine — the point is opportunity, not prophecy.
  - The same parity trick for a model predicting who has a rare disease. Absurd; you can't force equal positive rates onto a fact.

  I suspect my rule is something like "match the target to the model's job: predicting a fact, calibrate; allocating an opportunity, equalise rates" — but the recidivism case breaks it, since that model's job is prediction and I still call it unfair.

  I know there's a family of impossibility results here; I don't want the lecture, I want to know which horn I'm actually on and what the cleanest principle is that saves most of my verdicts. Test it on a case I haven't given, tell me which of my verdicts it makes me give up, and say where the principle is most likely to be wrong and what would change your mind.

  Format: JSON with "principle" (one sentence), "clauses" (each with the clause, the case that forces it, and the verdict it yields), "new_cases" (two cases I didn't give, each with verdict and reason), "verdicts_i_lose" (list), "confidence" (0–1), and "what_would_flip_it".
reasoning: |-
  Hmm, the user is grappling with algorithmic fairness across different scenarios and wants me to help them identify their underlying principle. They've provided five cases with their gut reactions: they're fine with calibrated lending scores even if it disadvantages a higher-risk group, but uncomfortable with similar calibration in recidivism prediction. They're against hiring models that use proxies for race, but support opportunity-based interventions like scholarships. And they find disease prediction absurd to force equal rates.

  I need to distill their intuitions into a consistent principle. Their initial thought about matching the target to the model's job doesn't hold because they reject calibration in the recidivism case. That suggests something deeper is at play.

  Looking at the recidivism case, they mention "error costs someone their liberty" and that the group is "already behind." This points to harm and existing inequality. In lending, losing money is bad but not as severe as losing freedom. For scholarships, they're prioritizing opportunity over pure prediction, which aligns with reducing disparities.

  The hiring model using proxies feels like "laundering" discrimination, which implies that indirect discrimination is still wrong, especially when it perpetuates bias.

  For the disease case, forcing equal rates ignores reality, so their principle must respect factual truths when stakes are about truth itself.

  So the core seems to be: When the cost of errors is high and falls on already disadvantaged groups, calibration isn't enough; we need to consider fairness in rates. But when it's about distributing opportunities, equalizing rates can be acceptable even if it sacrifices some accuracy.

  I'll formulate a principle that combines the stakes of errors and pre-existing inequities. For new cases, I'll test it with college admissions and credit scoring to see if it holds. In college admissions, they'd likely support affirmative action for opportunity, but in credit scoring, they'd stick with calibration since money loss is less severe than liberty.

  This might mean they have to give up their verdict on the recidivism tool if I strictly applied calibration, but their discomfort shows the principle needs flexibility for high-stakes errors on vulnerable groups. Their confidence isn't perfect because real-world cases can be messy with overlapping factors.

  If I found a case where high stakes and disadvantage exist but calibration is crucial for safety, like in disease outbreaks, that might flip their view, but it's unlikely given their strong stance on facts.
