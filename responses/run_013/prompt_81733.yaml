      *   **ER Triage:** "Fine" - Aligns with your disease prediction view. Pure factual prediction with severe, symmetric costs for errors. Calibration reflecting biology is essential.

  4.  **Verdicts I Lose:** You don't actually lose a verdict you hold here. The principle is constructed *to save* your specific judgments. The listed items show where you *would* lose a verdict if the principle were different (e.g., if you demanded strict calibration everywhere, you'd lose the recidivism verdict; if you demanded equal rates everywhere, you'd lose the loan verdict). This highlights the tension your principle resolves.

  5.  **Confidence (0.85):** High confidence this captures your core intuitions, as it resolves the loan/recidivism paradox via asymmetric harm/disadvantage, condemns proxy discrimination, allows opportunity-focused interventions, and respects factual prediction. The 0.15 uncertainty stems from the inherent fuzziness in defining "asymmetric harm," "systemic disadvantage," and "opportunity distribution" in novel edge cases.

  6.  **What Would Flip It:** Situations that challenge the core distinctions:
      *   **Factual Prediction Override:** If overriding calibration for a fact *prevented* a greater harm than the prediction inaccuracy caused (e.g., temporarily inflating disease risk for an under-diagnosed group to overcome biased testing access, even if biologically inaccurate *in the model*, leading to more lives saved overall).
      *   **Opportunity Safety Critical:** If an "opportunity" (like being an astronaut) required such extreme predictive accuracy for safety that any rate adjustment, even for equity, became unacceptably dangerous.
      *   **Indefinable Harm/Disadvantage:** If convincing evidence showed that "asymmetric harm" and "systemic disadvantage" are too subjective or politically charged to apply consistently, undermining the exception for the recidivism case.
