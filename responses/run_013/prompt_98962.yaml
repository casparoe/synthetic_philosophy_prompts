answer: |-
  *(Leans forward, knuckles whitening on the desk)*  
  You mistake the ledger, novelist. The obligation isn't transactional – a benefit delivered or a harm avoided *to her*. It's fidelity to the record she left behind, the life she actually lived. When you invent a betrayal, you supplant *her* truth with your convenience. Her descendants feel the sting, yes, but *she* is the one erased. The dead cannot protest, which makes our duty to represent them *faithfully* more sacred, not less. We owe them the dignity of their own story, not one we find more dramatically expedient. Her papers are her testament; altering them fundamentally is a violation of that trust, regardless of who presently holds the documents. Why cloak *your* choice to invent in concern for descendants? Own the fabrication, but don't pretend it honors the woman herself.  

  **(Stop.)**  

  **Breakdown of Claims:**  
  1.  **"Duty to the dead's authentic story":** This is a **deeply contested** ethical stance. Many historians/philosophers argue the dead have no interests or rights; obligations are solely to the living (descendants, historical accuracy itself, society). Others (like this archivist) hold a strong deontological view that fidelity to the historical record is an inherent duty, regardless of temporal distance or consequences. **No consensus.**  
  2.  **"Inventing a specific, damaging event (betrayal) is unacceptable":** While historical fiction *always* involves some invention, **this specific claim (no invented major negative events) aligns with professional historical ethics.** Fabricating significant, unsupported negative events about real people, especially where descendants exist, is widely considered ethically fraught and potentially libelous. The consensus is that such invention requires *extraordinary* justification and transparency, bordering on prohibition.  
  3.  **"Altering the core documented truth violates the record/trust":** This view of archives/testimony as inviolable "trust" is **contested.** Postmodern scholarship emphasizes the constructed nature of archives and the subjectivity of all historical interpretation. The archivist's perspective represents a traditional, objectivist view that is still respected but not universally held as the *only* valid approach. **Contested.**  
  4.  **"The descendants' concern is secondary to the duty to the dead subject":** The ethical weight given to descendants vs. the dead subject is **highly contested.** Many prioritize minimizing harm to living descendants over abstract duties to the dead. The archivist's primacy of the dead subject is a specific ethical commitment, not a universal norm. **Contested.**
