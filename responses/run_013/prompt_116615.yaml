prompt: |-
  I run a reading group on collective responsibility, and for the last session of term I want to do something other than another open discussion, so I've been trying to turn our running argument into a ranking exercise. The argument is the inefficacy objection: if I take one more long-haul flight, eat one more burger, or add one vote to a landslide, the harm — climate change, animal suffering, the wrong candidate winning — happens whether or not I act, and my single act seems to make no difference to anything. The intuition that such acts are nevertheless wrong is stubborn, and so is the suspicion that the stubbornness is sentiment rather than argument. I've collected the candidate principles we kept reaching for over the term, and I want you to sort them.

  To keep this from turning into a recitation of the standard positions, I'll state the principles as we formulated them, including two that a classmate and I invented and that I'm fairly sure you won't find in a textbook. (1) The difference-making rule: an act is wrong only if, holding everyone else's behaviour fixed, it makes the harm more likely or more severe. (2) The threshold rule: your act is wrong when it belongs to a set of acts that jointly push the world across a harm-threshold, even though no member of that set is necessary or sufficient for the crossing. (3) The universalizability rule: an act is wrong if the maxim of acting that way, universalized across everyone similarly placed, would produce a bad outcome. (4) The complicity rule: the wrong lies in knowingly participating in a harmful practice rather than in the causal increment. (5) The expressive rule: the act is wrong because of what it expresses or the norm it reinforces, consequences aside. (6) The fair-share rule: everyone is entitled to an equal slice of a sustainable total, and taking more than your slice is wrong whether or not the total is exceeded. (7) The marginal-probability rule, which is ours: since you can never know whether your act is the one that makes the difference, the quantity that matters is the ex ante chance that you are the marginal contributor, and an act is wrong when that chance multiplied by the size of the harm is large enough to matter.

  Please put the seven into three tiers — those that genuinely survive the inefficacy objection, those that survive it only by quietly changing the subject, and those that collapse into it — and give me one or two sentences on each saying why it lands where it does and naming the case that most threatens it. Then tell me which single principle you would want a thoughtful person to use when deciding whether to take one long-haul holiday flight that will depart whether or not they are aboard, and why that one beats the runner-up. Rank on how well each principle withstands the objection, not on how well known or respectable it is; if the standard answer deserves the top tier, fine, but don't promote it for being standard.
reasoning: |-
  Okay, the user runs a reading group on collective responsibility and wants to shift from open discussions to a ranking exercise for their last session. The core issue is the inefficacy objection—where individual actions like taking a flight or eating a burger seem too small to make a difference. They've collected seven principles, including two original ones, and want them sorted into tiers based on how well they handle this objection. 

  First, I need to parse each principle clearly. The user’s framing suggests frustration with superficial solutions, so I should avoid textbook regurgitation. Their hidden need is likely to spark deeper engagement—maybe by validating their invented principles or exposing flaws in classic ones. 

  The tier breakdown must be rigorous: Tier 1 = genuinely survives the objection, Tier 2 = changes the subject, Tier 3 = collapses into the objection. For each, I’ll need a pithy critique plus a threatening case. The follow-up question about the flight scenario is key—it’s where theory meets real choice, so I’ll prioritize practicality and moral robustness. 

  Starting with Tier 1: Only (6) Fair-Share and (7) Marginal-Probability feel airtight. Fair-Share sidesteps causality by framing harm as overconsumption, not difference-making—its weakness is non-scarcity cases. Marginal-Probability quantifies uncertainty elegantly but struggles with pinpointing thresholds. Both directly tackle inefficacy without evasion. 

  Tier 2 is trickier. (3) Universalizability and (4) Complicity shift focus—to hypothetical worlds or participation rather than consequences. They "survive" by redefining the wrong, which might feel like cheating. (5) Expression is purely non-consequentialist; it dismisses the objection but ignores harm altogether. 

  Tier 3’s (1) Difference-Making and (2) Threshold are corpses walking—they’re destroyed by the objection. (1) is the objection’s literal statement; (2) crumbles under overdetermination (e.g., 1,000th voter in a landslide). 

  For the flight scenario, Fair-Share wins: it’s concrete (slices the carbon budget), avoids probabilistic guesswork, and centers fairness. Marginal-Probability is a close second but requires opaque calculations. 

  User’s tone is analytical but weary of repetition—they’ll appreciate crisp distinctions and their inventions being taken seriously. Nodding to their "stubborn intuition" line might help validate why some principles resonate despite flaws.
answer: |-
  Here's the tiered ranking based solely on resilience to the inefficacy objection, with concise critiques and illustrative counterexamples:

  ### Tier 1: Genuinely Survives the Objection
  *   **(6) Fair-Share Rule:** Directly bypasses causal inefficacy by grounding wrongness in distributive injustice (taking more than a fair share of a finite resource or harm-budget). **Threat:** Cases where no "sustainable total" exists or is definable (e.g., expressing a hateful view where the "total" isn't quantifiable).
  *   **(7) Marginal-Probability Rule:** Confronts the objection head-on by quantifying *expected harm* based on the epistemic uncertainty of being pivotal, making even tiny contributions morally relevant probabilistically. **Threat:** Cases with discontinuous thresholds where the *exact* probability of being pivotal is incalculable or effectively zero (e.g., being the *absolute last* straw on a camel with unknown strength).

  ### Tier 2: Survives by Changing the Subject
  *   **(3) Universalizability Rule:** Evades the objection by shifting to a hypothetical world where *everyone* acts similarly (the outcome *would* be bad), not the actual causal impact *here*. It judges the *type* of act, not its concrete effect. **Threat:** Acts that are harmful if universalized but actually *beneficial* if performed by only one person in a non-universalizing world (e.g., being the *only* person to secretly pollute a vast ocean).
  *   **(4) Complicity Rule:** Changes the subject from *causing harm* to *participating in* or *benefiting from* a harmful system. Wrongness lies in associative guilt or dirty hands. **Threat:** Participating in a harmful system where refusal makes no difference *and* provides no tangible benefit to the participant (e.g., pressing a redundant button in a genocide machine).
  *   **(5) Expressive Rule:** Abandons consequences entirely, making wrongness about the meaning, symbolism, or norm-affirmation of the act itself. It sidesteps inefficacy by ignoring causal impact. **Threat:** Expressing a harmful view in a completely private, undetectable way that reinforces no public norms.

  ### Tier 3: Collapses into the Objection
  *   **(1) Difference-Making Rule:** *Is* the inefficacy objection stated as a principle. It directly succumbs because it defines wrongness by the very causal difference the objection demonstrates is absent. **Threat:** *All* collective action problems (flights, burgers, landslides) where one act is neither necessary nor sufficient.
  *   **(2) Threshold Rule:** Collapses under the weight of overdetermination and the "problem of many hands". If the threshold is crossed by *any* sufficient set (and many exist), identifying *which* set is "the one" that pushed it over is arbitrary, and no individual act is necessary for *its* set. **Threat:** Being the 1,000th voter in a landslide won by 10,000 votes – countless subsets of 1,000 votes were sufficient, yours wasn't needed for *any* specific set.

  **For the Long-Haul Flight Decision:**

  **Choose: (6) The Fair-Share Rule.**

  **Why it beats the runner-up (7 Marginal-Probability):**
  While the Marginal-Probability Rule is the strongest *consequentialist* response, the Fair-Share Rule provides a clearer, more robust, and less calculation-dependent foundation for this decision. It directly addresses the core ethical issue: claiming more than your equitable portion of a severely limited global carbon budget contributes to injustice *regardless* of whether *this specific flight* tips a climate threshold. The probability rule requires estimating uncertain probabilities and magnitudes, which can feel abstract and be manipulated. Fairness, grounded in the undeniable scarcity of the atmospheric commons, offers a sturdier, more intuitive, and less contingent moral reason to refrain, focusing on distributive justice rather than speculative causal chains. It cleanly avoids the inefficacy trap.
