answer: |-
  ### Opening Remarks: Model Accountability Workshop  

  **Good morning, everyone.** It’s great to see so many of you here—engineers, compliance colleagues, and especially our customer support and disputes teams. I know you’ve been on the front lines, fielding questions about why a transaction was flagged or denied, and hearing things like, "It’s just math," or, "The model decided." That’s frustrating. And it’s why we’re here today. Over these two days, we’ll dig into audit trails, appeals, and how we document decisions. But first, I want to tackle the elephant in the room: **What does it actually mean when our fraud model "flags" a transaction?**  

  I’ll start with a story. Last year, our model started flagging a batch of transactions. At first, we thought it was catching fraud. But it turned out, the model wasn’t detecting fraud at all—it was latching onto a specific merchant-category code. That code appeared almost exclusively in a cluster of old fraud cases from one issuer. So, the model learned: "When you see this code, flag it." But here’s the catch: that code wasn’t fraud. It was a coincidence in our data. We retrained the model, fixed it, and moved on. But the lesson stuck with me: **Our model didn’t "know" anything about fraud. It found a proxy—a stand-in—for fraud.**  

  This brings me to a thought experiment I love. Imagine a vending machine that accepts quarters. It checks three things: size, weight, and metal content. Now, suppose a foreign coin has the exact same size, weight, and metal. The machine would accept it. So, did the machine "recognize" a quarter? Or did it just recognize a physical signature that, in our world, usually lines up with quarters?  

  There’s a key difference here. The vending machine doesn’t have a concept of a "quarter." It doesn’t know what money is, or what fraud is. It’s matching patterns. It has no beliefs, no understanding. It’s relying entirely on us—our labels, our training data, our choice of features—to borrow meaning. It’s not thinking; it’s computing.  

  Our fraud models are like that vending machine. They don’t "detect fraud." They compute a score based on proxies—features that correlate with fraud in our historical data. And sometimes, like with that merchant code, the proxies drift. They become outdated, biased, or just plain wrong.  

  **Now, why is this uncomfortable?** Because as engineers, we say things like, "The model thinks this is fraud," or, "It wants to flag this." That shorthand is useful! It helps us collaborate. But it’s dangerous. It tricks us into believing the model has its own grip on reality—that it "understands" fraud. It doesn’t. It only understands patterns in the data we feed it. And when we forget that, we risk two things:  
  1. **Overconfidence** in the model’s "judgment," leading to bad incident reports or appeals.  
  2. **Miscommunication** with customers, who hear, "The model decided," and feel dismissed.  

  **So, what does this mean for us—practically?**  

  First, **for engineers and ML teams:** When you build or document a model, be precise. Don’t say, "The model detects fraud." Say, "It assigns a risk score based on patterns in our training data." And when something goes wrong—like with that merchant code—dig into the proxies. Ask: "What is this model *actually* tracking? Is it fraud, or is it a quirk in our data?"  

  Second, **for compliance and legal teams:** In customer letters or regulator documents, avoid language that personifies the model. Instead of, "The model determined this was fraudulent," say, "Our system flagged this transaction based on patterns associated with high-risk activity." This isn’t just wordplay. It’s accuracy. It leaves room for human judgment in appeals.  

  Third, **for customer support and disputes:** You’re the bridge to our customers. When someone asks, "Why was my claim denied?" don’t fall back on, "The model said so." Instead, say: "Our system identified patterns that match high-risk activity. Let me walk you through what those patterns were, and how we can review this together." Give them the context—the "why" behind the score.  

  **Before we hand over to the next session, I’ll leave you with this:**  
  Our models are powerful tools. But they’re not oracles. They’re vending machines—pattern-matchers, borrowing their sense of "fraud" from us. The question we’re left with isn’t philosophical; it’s practical: **When can we trust a proxy?** When do we say a model "detects fraud" versus "scores transactions"?  

  My rule of thumb: **A model earns the right to "detect fraud" when we can trace its score back to robust, stable proxies—and when we’ve stress-tested it against edge cases, like that merchant code.** Until then, it’s scoring, not detecting.  

  This distinction isn’t just technical. It’s how we rebuild trust—with customers, regulators, and each other. Let’s use these two days to make that distinction real.  

  Thank you. I’ll hand it over now to Sara for our session on audit trails.
