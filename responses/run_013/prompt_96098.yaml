  ### **Activity Plan: The Oracle Experiment**

  #### **Goal**
  Make students experience the persistence of the intentional stance (attributing beliefs/desires) even when a system's behavior becomes arbitrary. Debrief ties this to real-world AI debates.

  ---

  ### **Materials & Setup**
  1. **Oracle Setup**:
     - **Screen**: A large poster board or curtain to hide the confederate.
     - **Confederate**: You or a pre-briefed student. No tech; they use a physical lookup table.
     - **Inputs**: Numbers 1–50 (written on cards by you).
     - **Outputs**: Three symbols (▲, ●, ★) written on a whiteboard.

  2. **Rules for the Confederate** (on index cards):
     - **Phase 1 Rule** (Agent-like):  
       `IF number ≤ 25: ▲`  
       `IF 26 ≤ number ≤ 40: ●`  
       `IF number ≥ 41: ★`  
       *(Purpose: Resembles guarding a "danger threshold" at 41, interpretable as agent-like intent)*.
     - **Phase 2 Rule** (Arbitrary):  
       `IF units digit is ODD: ▲`  
       `IF units digit is EVEN: ★`  
       *(Ignores tens digit; appears random without context)*.

  3. **Team Instructions** (on cards, no jargon):
     - **Team 1 (Pattern Stance)**:  
       *"Find mathematical patterns between inputs and outputs. Treat the Oracle like a machine following fixed rules. Predict based on formulas or sequences."*
     - **Team 2 (Design Stance)**:  
       *"Assume the Oracle was built for a purpose. What is it trying to accomplish? Predict based on what it seems designed to do."*
     - **Team 3 (Intentional Stance)**:  
       *"Assume the Oracle has beliefs (e.g., 'It thinks high numbers are dangerous') and desires (e.g., 'It wants to warn us'). Predict based on what it ‘knows’ and ‘wants’."*

  4. **Scoring**:
     - Teams predict outputs for 5 inputs per phase.
     - 1 point per correct prediction. Track publicly on the whiteboard.

  ---

  ### **Timeline (90 Minutes)**
  1. **Intro (5 min)**:
     - *Script*: "This is the Oracle. It outputs ▲/●/★ for numbers 1–50. Your goal: predict its responses. Work in teams to maximize your score."
     - Assign teams and hand out instruction cards. **Do not reveal stance names yet.**

  2. **Training Phase (10 min)**:
     - **Action**: Give all teams 10 input-output pairs using **Phase 1 Rule** (e.g., `10→▲`, `30→●`, `45→★`).  
       *Critical: Ensure coverage of all output zones (e.g., 5, 25, 30, 41, 50).*
     - **Confederate Script**:  
       - No speaking. When given an input card, pause 3 seconds, then write the output on the board.  
       - Avoid eye contact or reactions. Use a poker face.

  3. **Phase 1: Predictable Rule (25 min)**:
     - Teams develop models (10 min).
     - **Test**: 5 new inputs (e.g., 15, 28, 35, 42, 49). Teams submit predictions on paper.
     - Reveal answers; score points.  
       *Balance Tip*: Rule is simple enough for all stances to score ~3–4/5. Intentional stance may infer "guarding against high numbers," but pattern team can brute-force ranges.

  4. **Phase 2: Arbitrary Rule (25 min)**:
     - **Secretly swap rules** during a distraction (e.g., "Take 1 min to discuss strategies").
     - **Test**: 5 new inputs (e.g., 7, 22, 36, 44, 50).  
       *Crucial: Use numbers where the new rule behaves erratically (e.g., 22→★ [even digit], 44→★ [even], but 50→▲ [odd]).*
     - Teams predict using their **original models**.  
       *Expected Outcome*: Pattern/design teams struggle. Intentional team invents excuses ("It’s confused," "It changed its goal").

  5. **Debrief (25 min)**:
     - Reveal the rules and stance names.
     - **Discussion Prompts**:
       - *Phase 1*: "How did your stance help? Pattern team: Did you see thresholds? Design: Did you infer purpose? Intentional: What ‘beliefs’ did you assign?"
       - *Phase 2*: "Why did predictions fail? Intentional team: Did you double down on beliefs (e.g., ‘It’s lying’)? Why not abandon the stance?"
       - **Key Insight**: "The intentional stance is *sticky*. We add beliefs (deception, confusion) to preserve it even when it fails. This mirrors how we treat AI: we call ChatGPT ‘confused’ or ‘lying’ because *as-if* agency is useful—even when systems are just autocompleting text."
       - **Real-World Link**: "Unlike our Oracle, real AI is trained on human data, so the *as-if* agency feels more persuasive. But the core pull is the same: we retrofit mental states to make sense of systems we can’t fully grasp."

  ---

  ### **What Will Go Wrong & Fixes**
  1. **Problem**: Intentional team dominates Phase 1.  
     - **Fix**: Use a blunter Phase 1 rule (e.g., `IF number > 30: ★`). Pattern/design teams can still score well with ranges.

  2. **Problem**: Teams suspect a rule swap in Phase 2.  
     - **Fix**: Use new inputs (no overlap with Phase 1). If students question it: "The Oracle hasn’t changed; focus on your model."

  3. **Problem**: Confederate leaks cues (e.g., hesitates on new rule).  
     - **Fix**: Rehearse pauses. Have them practice with random inputs beforehand.

  4. **Problem**: Pattern team gives up in Phase 2.  
     - **Fix**: Encourage persistence: "Stick to your original strategy."

  ---

  ### **Limitations**
  - **The Blur Isn’t Fully Captured**: The Oracle uses a lookup table, so the *as-if* agency is thinner than in LLMs. Real AI:
    - Trains on human text, making its outputs feel "mind-like."
    - Uses probabilistic vs. deterministic rules, creating ambiguity that amplifies the intentional stance.
    - *Address in debrief*: "Our Oracle is simpler, but the psychological pull is the same. With AI, the blurring happens because it mirrors *us*."

  ---

  ### **Why This Works**
  - **Phase 1**: All stances "work," preventing early dismissal of intentional reasoning.
  - **Phase 2**: Arbitrary rule forces a clash—students *feel* the stance persisting.
  - **Debrief**: Names the stances only after the experience, making the reflection visceral.

  **Final Tip**: Run it twice if possible—the first time is a live test!
