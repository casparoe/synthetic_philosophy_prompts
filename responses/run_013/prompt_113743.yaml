     Roles for non-selected students in a round:

          In both phases, in a given round, some students are not selected. We assign them roles:

            - Two students are recorders: one records the bets and credences for the selected students, and the other updates the leaderboard.
            - One student is the random selector: they draw the names from the bag.
            - One student is the coin flipper (if we allow them to flip) but we do it behind the cup so maybe the instructor does it.
            - The rest can be statisticians: they keep a running tally of the number of heads and tails, and the number of times each student was selected, and the overall success rate of bets.

          We rotate these roles each round so that everyone gets a chance.

     Exact wording for settlement rules:

          Phase 1:

            "In this phase, each of you who is selected and chooses to bet will have your bet settled individually. 
             - If you bet on the correct outcome (the actual coin flip), you win 1 chip (so you get 2 chips back for a 1-chip bet).
             - If you bet on the wrong outcome, you lose the 1 chip you bet.
             This happens regardless of how many other bets are placed in the same round."

          Phase 2:

            "In this phase, the casino will only accept one bet per round. 
             - If there is only one awakening in the round, that student may place a bet.
             - If there are two awakenings, we will randomly select one of the two to place a bet (the other cannot bet).
             The settlement for the bet is the same as in Phase 1: 
                 - If the bet is correct, the better wins 1 chip (net).
                 - If incorrect, they lose 1 chip."

     Debrief script:

          We start by asking the students about their experiences.

          Questions for discussion:

            - In Phase 1, what credence did you assign to tails when you were selected? Why?
            - Did you notice a pattern in the outcomes? (We hope they say that tails occurred more often from the perspective of an awakened student.)

            - In Phase 1, what was your betting strategy? Why?

            - In Phase 2, what credence did you assign? Why?
            - In Phase 2, did you feel differently about the coin flip when you were selected to bet?

            - Why do you think we changed the rules?

          Then we reveal:

            "This activity is based on a famous problem in probability and decision theory called the Sleeping Beauty problem."

            Describe the problem: 
               - Beauty is put to sleep on Sunday. A fair coin is flipped.
               - If heads, she is awakened on Monday and the experiment ends.
               - If tails, she is awakened on Monday, then given a drug that makes her forget Monday, and awakened again on Tuesday.
               - When she is awakened, she doesn't know what day it is or whether she has been awakened before.
               - The question: what should her credence be that the coin landed tails?

            Explain that there are two main positions:

              1. The halfer: P(tails) = 1/2. The coin is fair, and when she wakes up she has no new information (she knew she would be awakened at least once). So the probability remains 1/2.

              2. The thirder: P(tails) = 2/3. There are three possible awakenings (Monday-heads, Monday-tails, Tuesday-tails), and they are indistinguishable, so each has probability 1/3. Therefore, the probability of tails is 2/3.

            Connect to the activity:

              - Phase 1: the per-awakening settlement corresponds to the thirder's view. Each awakening is a separate event, and there are twice as many awakenings on tails. So the probability of tails given you are awakened is 2/3.

              - Phase 2: the one-bet-per-experiment corresponds to the halfer's view. The bet is placed once per coin flip, so the probability of tails is 1/2.

            The takeaway: the rational credence depends on how the bets are structured. In the original problem, since Beauty is asked about her credence and might be offered bets at each awakening, the thirder position is more appropriate for betting. But the halfer position is appealing because the coin is fair.

            We also note that in the original problem, Beauty is the same person on both days. In our activity, we used different students. This might change the personal identity aspect, but the betting argument remains.

     Potential pitfalls:

          1. Students may not understand the betting in Phase 1 and just guess. We need to explain the expected value.

          2. In Phase 1, the students may not realize that tails occurs in 2/3 of the awakenings. We can show them the data at the end of Phase 1.

          3. In Phase 2, the random selection of the better might be seen as unfair by the students who are not chosen. We can rotate the role of the random selector.

          4. Time: 2 minutes per round might be tight. We may need to move quickly.

          5. Some students might not get selected at all. We have 10 rounds and 18 students. In Phase 1, we use 1 or 2 cards per round. Expected number of card assignments: 15. In 10 rounds, expected card assignments: 15 (if we do 10 rounds: 5 heads -> 5 cards, 5 tails -> 10 cards, total 15). So about 15/18 = 0.83 per student. Some will get 0, some 1, some 2. We might extend to 12 rounds to increase participation.

          Given time, we might do 8 rounds per phase? Then total card assignments: 12 on average.

     Conclusion:

          This activity will nudge the students towards the thirder position in Phase 1 and the halfer position in Phase 2. They will see that the rational strategy changes with the reward structure.

          However, note: the original problem has the same person twice. In our activity, we used different people. But the betting argument for the thirder position is based on the relative frequency of awakenings, which we have preserved. So it should be okay.

          Your colleague's concern: any game where you hand cards to randomly chosen people has already answered the question in the thirder's favor. This activity does show the thirder's answer in Phase 1. But that's intentional. We want them to experience both. In Phase 2, we show the halfer's answer.

          Therefore, the activity is not rigged to only show one side. It shows both and connects them to the reward structure.

     Let's adjust the timeline to 8 rounds per phase to ensure we finish in time.

     Revised timeline:

          - Introduction: 5 min.
          - Phase 1 explanation: 5 min.
          - Phase 1 rounds: 8 rounds * 2 min = 16 min.
          - Phase 2 explanation: 5 min.
          - Phase 2 rounds: 8 rounds * 2 min = 16 min.
          - Debrief: 43 min.

     We can use the extra time in debrief to go deeper.

     Now, I commit to this design.
answer: |-
  ### Improved Classroom Activity: Sleeping Beauty Casino
  **Design Philosophy:** This activity uses two distinct settlement rules to create an experiential divide between the halfer and thirder intuitions. By separating the betting structure from the initial setup, students encounter the pull of both positions. The fixed-seating constraint is addressed through roles and a clear procedural flow. The design avoids rigging by maintaining symmetric information until settlement rules are revealed, ensuring students encounter the paradox firsthand.

  ---

  ### **Materials List** (Assemble from Stationery Cupboard)
  1. **Coin & Dice Cup:** One large cup to hide coin flips.
  2. **Index Cards (40+):** For "awakening cards." Each card reads:  
     *"You are awakened. You cannot tell if you are the only awakening this round or one of two."*
  3. **Betting Slips (80+):** Small slips for credence & bets. Template:  
     - "Credence (Tails): \_\_\_\_"  
     - "Bet: ○ Heads ○ Tails ○ No Bet"  
  4. **Chips (180+):** Two colors (e.g., red/blue). Distribute 10 chips per student initially.  
  5. **Random Selection Tools:**  
     - Bag with 18 student names (on folded paper).  
     - Secondary bag for Phase 2 random selection (if needed).  
  6. **Leaderboard:** Whiteboard or poster to track chip counts.  
  7. **Timer:** To keep rounds efficient.  

  ---

  ### **Rules & Setup**
  - **Core Flow (Per Round):**  
    1. Flip coin hidden in dice cup (Heads = 1 awakening, Tails = 2 awakenings).  
    2. Draw names from bag to select awakened students.  
    3. Hand awakening cards and betting slips to selected students.  
    4. **All students** record predictions (see "Roles for Non-Awakened" below).  
    5. Collect bets.  
    6. Reveal coin outcome and settle bets (rules differ by phase).  
    7. Update leaderboard.  

  - **Phase 1: Per-Awakening Settlement (30 mins)**  
    - **Settlement Rule (Revealed upfront):**  
      *"Each bet is settled individually. If you bet correctly: win 2 chips (net +1). If wrong: lose 1 chip."*  
      - Tails with 2 awakenings? Both bets paid independently.  
    - **Student Task:** Awakened students write credence (e.g., 0.5, 2/3) and bet/nobet.  

  - **Phase 2: Per-Experiment Settlement (30 mins)**  
    - **Settlement Rule (Revealed upfront):**  
      *"Bets are settled per experiment. If the coin is Heads: winning bet pays 2 chips (net +1). If Tails: winning bets split a 2-chip pot. Incorrect bets lose 1 chip."*  
      - **Example:**  
        - Tails with 2 awakenings: If both bet correctly, each wins 1 chip (net 0: paid 1, got 1 back).  
        - Tails with 1 correct bet: Winner wins 2 chips (net +1).  
    - **Student Task:** Same as Phase 1.  

  ---

  ### **Timeline (90 Min Total)**
  | **Segment**       | **Time** | **Activity**                                                                 |
  |-------------------|----------|-----------------------------------------------------------------------------|
  | **Intro**         | 5 min   | Explain the casino game: "We’ll flip a coin each round. Heads: 1 awakening, Tails: 2. If awakened, you’ll place a bet on the coin." |
  | **Phase 1**       | 30 min  | **Per-Awakening Settlement:**<br> 1. Explain Phase 1 rules (5 min).<br>2. Run 8 rounds (2.5 min/round):<br>   - Flip, draw names, distribute cards/slips.<br>   - All students record predictions (see roles below).<br>   - Collect bets, reveal outcome, settle, update leaderboard. |
  | **Phase 2**       | 30 min  | **Per-Experiment Settlement:**<br>1. Explain Phase 2 rules (5 min). *Do not compare to Phase 1.*<br>2. Run 8 rounds (same as Phase 1). |
  | **Debrief**       | 25 min  | Guide discussion (script below). Reveal "Sleeping Beauty" name last.       |

  ---

  ### **Roles for Non-Awakened Students**
  To keep all 18 engaged **every round**:  
  1. **Predictors (6 students):** Record their *own* credence for tails (even if not awakened).  
  2. **Recorders (4 students):** Track bets/outcomes on a shared sheet.  
  3. **Statisticians (4 students):** Calculate cumulative heads/tails frequency.  
  4. **Auditors (4 students):** Verify coin flips and random draws.  
  - **Rotate roles each round** so everyone participates.

  ---

  ### **Key Wording to Avoid Rigging**
  - **Phase 1 Settlement:**  
    *"Remember: every bet stands alone. Win 2 chips for a correct bet, lose 1 for a wrong bet – whether you’re the only one or not."*  
  - **Phase 2 Settlement:**  
    *"Now, the payout depends on the experiment. If Tails, the 2-chip pot is split among winning bets. If Heads, bets pay normally."*  
  - **Critical:** Never mention "Sleeping Beauty," "halfer/thirder," or compare phases until debrief.

  ---

  ### **What Will Go Wrong (And Fixes)**
  1. **Problem:** Two students dominate ("It’s 2/3!").  
     **Fix:** Assign them as Auditors/Recorders to busywork. Privately ask them to let others reason.  
  2. **Problem:** Confusion on Phase 2 settlement.  
     **Fix:** Use a concrete example: *"Tails with 2 correct bets? Each paid 1 chip (net 0)."*  
  3. **Problem:** Slow rounds.  
     **Fix:** Use a timer (90 sec/round). Statisticians pre-calculate odds while bets are placed.  
  4. **Limitation:** Different students vs. same person.  
     **Mitigation:** Emphasize in debrief that the *betting structure* mirrors the identity debate (thirder = per-awakening, halfer = per-experiment).  

  ---

  ### **Debrief Script**  
  1. **Data Review (5 min):**  
     - *"In Phase 1, what bet was profitable? Why did tails bets dominate?"*  
       → Expected: Betting tails yields +EV (2/3 chance of net +0.33 chips).  
     - *"In Phase 2, why did tails bets decrease?"*  
       → Expected: Betting tails on average breaks even (halfer strategy).  

  2. **Connect to Paradox (15 min):**  
     - *"Today’s game models the Sleeping Beauty problem. Beauty is woken once (Heads) or twice (Tails) and asked for her credence in tails."*  
     - **Thirder Pull (Phase 1):** *"When each awakening pays separately, tails wins more often – like Beauty being offered a bet each time she wakes. 3 awakenings (Mon-Heads, Mon-Tails, Tue-Tails), 2 are tails → P(tails) = 2/3."*  
     - **Halfer Pull (Phase 2):** *"When payouts are tied to the experiment, tails bets break even. Beauty gains no new information on waking, so P(tails) = 1/2."*  
     - **Core Tension:** *"Which answer is 'right'? It depends! If Beauty is paid per bet, she *should* say 2/3. If paid per coin flip, 1/2. Credence isn’t standalone – it’s tied to the stakes."*  

  3. **Conclusion (5 min):**  
     - *"This is why philosophers and statisticians argue! The 'right' credence changes with the reward structure. Beauty’s dilemma isn’t about probability alone – it’s about *what the question means* in context."*  

  ---

  ### **Honest Assessment**
  - **Nudge to Thirder?** Yes, Phase 1’s per-awakening betting will strongly favor 2/3. But Phase 2’s break-even result for 1/2 creates cognitive dissonance, ensuring both positions feel live.  
  - **Rigging Risk?** Minimal. The settlement rules – not the awakening mechanic – drive the shift. Your colleague’s concern is valid if only Phase 1 existed, but Phase 2’s halfer-like structure balances it.  
  - **Fatal Flaw?** The "same person" issue isn’t replicated, but the betting structures *simulate* the core conflict: **Is the question about this moment (thirder) or the experiment (halfer)?** The activity captures this pragmatically.  

  **Commitment:** This design *will* make students confront both answers. It prioritizes experience over theory, ensuring they "feel" the paradox before labeling it. Run it as-is – the sting in Phase 2’s settlement change delivers the payoff you want.
