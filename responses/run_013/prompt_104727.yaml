  Now, Banach-Tarski. The textbook presents it as a reason AC is suspect. But Banach-Tarski isn't impossible; it's counterintuitive because it violates physical intuition, not mathematical principles. The result relies on non-measurable sets, which AC introduces. So the paradox highlights the weirdness AC can introduce, but it's not a contradiction. The user might be conflating physical possibility with mathematical possibility here. 

