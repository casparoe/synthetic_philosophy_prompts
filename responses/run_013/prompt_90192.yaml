prompt: |-
  So I've fallen down a rabbit hole on Otto Neurath's idea of a picture language — the notion that you could build a whole working language out of pictograms arranged by rules, so that statistics and public information could be read off by anyone no matter what natural language they speak (this is the thing behind those repeated-figure charts where one little man stands for 10,000 people). And I keep wanting to actually try it myself: I'm messing around with a design for a picture-based notation that a city public health office could use for bulletins about a measles outbreak — case counts, vaccination coverage, who's at risk, what the current guidance is, how confident the estimates are — posted in places where lots of people who don't share a first language will see them. Every time I start, I hit a wall that I suspect isn't about my drawing skills.

  So before I keep fiddling: give me the desiderata that any picture language has to meet to count as a real language and not just a fancy infographic. I want the full spec — what it has to be able to say (negation, conditionals, "most" / "some" / "none", quantities, comparisons, time and change, uncertainty, abstract stuff like "risk" or "eligibility", and the difference between showing something and claiming it), the distinctions it can't collapse (icon vs. legend vs. rule of combination; a picture that asserts vs. one that merely depicts; a mark that means by resemblance vs. one that means by convention), and the constraints it can't violate (readable by someone who's never seen it, no reliance on a written gloss, no conventions smuggled in through the key). For each requirement, give me the case or consideration that forces it, then tell me which pairs of requirements definately can't be had together — I have a suspiscion that "purely pictorial, no arbitrary conventions" and "expressive enough to actually do the job" are going to fight, but I want to know exactly where the fight is and which of the two is the cheaper thing to give up. If you can, end with a quick ranked list of which single requirement does the most to rule out candidate picture languages, since I suspect there's one that knocks out most of the cute designs people propose. Skip the history-of-ISOTYPE material, I've already read that part.
reasoning: |-
  Okay, the user is diving deep into Otto Neurath's picture language concept and wants to create a pictogram-based system for public health bulletins, specifically for a measles outbreak. They're hitting a wall and need the core requirements for a true picture language versus just an infographic. Let me unpack their query.

  First, they want desiderata: what makes it a language, not just graphics. They mentioned negation, conditionals, quantifiers, abstract concepts, etc. Also, distinctions like icon vs. legend, asserting vs. depicting, and constraints like no reliance on written gloss. They suspect trade-offs between purity and expressiveness.

  I need to recall linguistic fundamentals. Hockett's design features come to mind—displacement, productivity, duality of patterning. But for a constructed language, key elements are syntax, semantics, and pragmatics. The user's focus is on public health info, so the system must handle uncertainty, time, risk—all abstract. 

  Breaking it down: expressiveness requirements are crucial. Negation is tricky without arbitrary symbols. How do you show "not vaccinated" without a convention? A slash might be intuitive but isn't universal. Quantifiers like "most" or "some" need scalable representations. ISOTYPE used repeated icons, but that's for counts, not proportions. Maybe size or density, but that's ambiguous. 

  Abstract concepts like "risk" or "eligibility" are tough. Risk isn't visual; it's probabilistic. Even icons like exclamation marks are cultural. Eligibility might use checkmarks or crosses, again conventional. 

  Then, distinctions: icons vs. rules. A syringe icon is direct, but combining it with a question mark for uncertainty? That's syntactic. And asserting vs. depicting—showing a sick person isn't claiming there's a current outbreak. Need a way to indicate modality. 

  Constraints are critical. No written gloss means every symbol must be intuitive. But "intuitive" varies culturally. A skull means danger in some places, not others. Also, avoiding arbitrary conventions conflicts with expressiveness. For example, tenses: arrows for time might not be universally clear. 

  Trade-offs: Purity vs. expressiveness. You can't have both. Either introduce conventions (like color codes or symbols) for abstract ideas or limit the language's scope. Public health needs precision, so sacrificing purity for expressiveness makes sense. 

  The user's deeper need might be creating an effective communication tool in multilingual settings. They might not realize that some conventions are unavoidable. The ranked requirements—displacement and modality might be the biggest hurdles. Displacement (talking about past/future) is essential for outbreaks, and modality (uncertainty) is crucial for public trust. 

  Prioritizing: Displacement is probably the top requirement that trips up designs. Without it, you can't discuss future risks or past trends, which is vital for health bulletins. Modality (expressing uncertainty) follows closely since confidence intervals affect decision-making. 

  In conclusion, the user needs to accept some conventions to achieve necessary expressiveness. The key is balancing intuitive symbols with minimal, learnable conventions. Maybe start with core icons and gradually introduce syntactic markers, ensuring they're as iconic as possible. Testing with diverse groups will be essential to find the right balance.
answer: |-
  Here's the comprehensive specification for a true picture language, distilled from linguistic fundamentals and your practical constraints. The core tension is indeed between **purely iconic representation** and **expressive completeness**—but the breaking points are specific.

  ---

  ### **I. Expressiveness Requirements (What It Must Say)**
  1. **Negation**  
     *Case:* "Unvaccinated children are at risk."  
     *Requirement:* Must distinguish "vaccinated" from "NOT vaccinated" without ambiguity.  
     *Challenge:* Pure icons show existence, not absence. A slash (🚫💉) is conventional, not iconic.

  2. **Quantifiers & Logic**  
     *Case:* "Most cases are in children under 5," "Some adults remain vulnerable."  
     *Requirement:* Distinguish "all," "most," "some," "none."  
     *Challenge:* ISOTYPE-style repetition shows counts, not proportions. Showing "most" requires abstraction (e.g., filled vs. outline figures), risking ambiguity.

  3. **Modality & Uncertainty**  
     *Case:* "Case estimates are uncertain (95% CI: 120–180)."  
     *Requirement:* Express confidence levels, probability ("high risk"), and epistemic status ("suspected outbreak").  
     *Challenge:* Uncertainty is abstract. Fog/dotted lines? Convention-dependent.

  4. **Abstraction**  
     *Case:* "Risk," "eligibility," "immunity."  
     *Requirement:* Represent non-visual concepts.  
     *Challenge:* "Risk" ≠ a falling boulder (context-dependent). Eligibility may require arbitrary symbols (e.g., ✅ for "qualified").

  5. **Temporality**  
     *Case:* "Cases doubled last month; vaccination starts next week."  
     *Requirement:* Past/future tense, rate of change.  
     *Challenge:* Arrows → imply direction, not time. Color-coding (red=past, green=future) is conventional.

  6. **Conditionals**  
     *Case:* "If unvaccinated, isolate for 21 days."  
     *Requirement:* Express "if P, then Q" relationships.  
     *Challenge:* Requires syntax (e.g., P → Q), which demands combinatorial rules beyond mere adjacency.

  7. **Reference & Identity**  
     *Case:* "The same strain was found in Hospital A and School B."  
     *Requirement:* Track entities across statements.  
     *Challenge:* Pictorial languages struggle with coreference (e.g., marking identical virus icons).

  ---

  ### **II. Critical Distinctions (What It Must Preserve)**
  1. **Icon vs. Symbol**  
     *Distinction:* A syringe (💉) resembles vaccination (iconic); a red cross 🟥❌ means "prohibited" (symbolic).  
     *Requirement:* Avoid overloading icons as arbitrary symbols.  
     *Risk:* Using 💉+🚫 for "no vaccines available" vs. "vaccination forbidden"—context fails.

  2. **Depiction vs. Assertion**  
     *Distinction:* Showing a sick person ≠ claiming "measles is spreading."  
     *Requirement:* Grammatical markers for declarative statements (e.g., a frame border? ↑↓ trends?).  
     *Risk:* Users confuse illustrative graphics with factual claims.

  3. **Composition Rules vs. Ad Hoc Pairing**  
     *Distinction:* "💉 + 👶" should systematically mean "child vaccination," not "baby injecting something."  
     *Requirement:* Strict syntax (e.g., modifier precedes object: 💉👶 = vaccinated child; 👶💉 = child vaccination site).  
     *Risk:* Without rules, combinations become ambiguous art.

  ---

  ### **III. Non-Negotiable Constraints (What It Can't Do)**
  1. **Zero Gloss Dependency**  
     *Constraint:* No captions, legends, or footnotes explaining meanings.  
     *Why:* Defeats universal accessibility.  
     *Test:* A monolingual speaker with no training must infer meaning.

  2. **No Arbitrary Conventions**  
     *Constraint:* Avoid symbols requiring memorization (e.g., ⚠️ = "warning," ☆ = "priority").  
     *Why:* Arbitrariness breaks iconicity.  
     *Test:* Would a pre-literate child or isolated adult guess correctly?

  3. **Compositionality**  
     *Constraint:* Meaning must derive from parts + rules, not whole-scene interpretation.  
     *Why:* Infographics tell one story; languages generate unlimited statements.  
     *Test:* Can novel sentences be formed? (e.g., "Pregnant women should avoid crowded areas.")

  ---

  ### **IV. The Trade-Offs: Where Systems Fail**
  | **Requirement Pair** | **Conflict** | **Likely Sacrifice** |
  |----------------------|--------------|----------------------|
  | **Pure Iconicity vs. Abstraction** | Icons can't depict "risk" or "uncertainty" directly | *Sacrifice purity:* Allow minimal symbols (e.g., ? for uncertainty) |
  | **Zero Conventions vs. Syntax** | Rules for combination (e.g., word order) are conventions | *Sacrifice convention-avoidance:* Adopt rigid syntactic rules |
  | **Universality vs. Expressiveness** | Truly universal icons don't exist (e.g., 💉 isn't global) | *Sacrifice universality:* Focus on cross-cultural clarity, test iteratively |
  | **Depiction vs. Negation** | Showing "no vaccine" requires showing absence (invisible?) | *Sacrifice pure depiction:* Use conventional negation (slash, ✖️) |

  **The Core Tension:**  
  **"Purely pictorial, no conventions" and "fully expressive" are mutually exclusive.** Abstraction, logic, and syntax *require* conventions. Neurath accepted this—ISOTYPE used syntactic rules and symbolic color codes.

  ---

  ### **V. Requirement Strictness Ranking (Most to Least Exclusionary)**
  1. **Displacement** (Talking about past/future/absent things)  
     *Why it kills designs:* Most pictograms freeze a moment. Showing "cases will rise" without arrows/dynamic notation fails.  
     *Knockout Rate:* 90% - Cute infographics handle "now"; languages need time.

  2. **Modality** (Expressing uncertainty, obligation, possibility)  
     *Why it kills designs:* "Should vaccinate" vs. "must vaccinate" vs. "may vaccinate" demands grammatical markers.  
     *Knockout Rate:* 85% - Public health requires hedging and directives.

  3. **Negation & Quantifiers**  
     *Why it kills designs:* "None" and "some" need scalable representations. Dotted outlines? Size gradients? All ambiguous.  
     *Knockout Rate:* 80% - Binary "yes/no" is easy; gradations are not.

  4. **Compositionality**  
     *Why it kills designs:* Ad-hoc arrangements become chaotic beyond 2 elements.  
     *Knockout Rate:* 75% - Syntax is non-negotiable for languagehood.

  ---

  ### **VI. Your Path Forward**
  1. **Accept limited conventions:** Use slash for negation (🚫), arrow for time (→), ? for uncertainty. These are *learnable in seconds*.  
  2. **Prioritize syntax:** Define strict rules:  
     - `[TIME MARKER] + [SUBJECT] + [VERB] + [OBJECT]`  
     - e.g., `→ 👧💉 = "Children will be vaccinated"`  
  3. **Test for universality:** Iterate with diverse non-literate populations. Does 💉 mean "medicine" or "drug abuse"?  
  4. **Embrace ISOTYPE's pragmatism:** Use color (red=urgent), size (big=more), and positional grammar. Neurath knew purity was a myth.

  **Cheapest sacrifice:** **Absolute pictorial purity.** A few transparent conventions (like → or ?) cost little intuitiveness but unlock expressiveness. **Never sacrifice compositionality or zero-gloss**—that reduces it to an infographic.

  > "The perfect is the enemy of the good. Start with `[SYMBOL] + [RULE] + [CONTEXT]` and test." —Adapted from Neurath's pragmatism.
