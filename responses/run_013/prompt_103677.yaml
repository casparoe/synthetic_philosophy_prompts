  For the close, noting that śabda passes the test easily but anumāna might have dependency issues could reinforce the criterion's neutrality. Shows it's not rigged for upamāna.

  ...Better avoid Sanskrit jargon overload in the question. The user said no references needed, so keep it self-contained. Word counts tight—question ~150 words, answer 700-800. Marking out of 25 with 5-point distribution.

