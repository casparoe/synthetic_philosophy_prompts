  Final touch: remind in marking scheme that missing the "distinct instrument vs occasion" distinction is the big pitfall. That's where most students will trip on condition (iii).
answer: |-
  ### Essay Question (150 words)
  "Using the independence criterion provided—that a candidate source P counts as independent only if (i) it reliably produces a class of veridical cognitions, (ii) no other admitted source produces that class alone, and (iii) P has a distinctive causal instrument (karaṇa)—adjudicate whether *upamāna* qualifies as a distinct *pramāṇa*. Apply this to a case where a traveller, told by a trustworthy guide *only* that 'gavaya means animals that look like cows but are not cows' (with no exemplar shown), later sees an unfamiliar animal and thinks, 'This is what the guide meant.' State which Nyāya *pramāṇa* produces this cognition. Does this case support the reductionist (who reduces *upamāna* to inference/testimony+perception) or the Nyāya defender? Finally, would perception (*pratyakṣa*), inference (*anumāna*), or testimony (*śabda*) clearly satisfy or fail the same criterion? Justify all answers."

  ---

  ### Model Answer (750 words)  
  The independence criterion requires three conditions for a source (P) to count as a distinct *pramāṇa*: (i) P reliably yields a class of true cognitions, (ii) no other source produces that class alone, and (iii) P has a unique causal instrument (*karaṇa*). Applying this to *upamāna* reveals partial validity in both reductionist and Nyāya positions, with condition (iii) proving decisive. The constructed case demonstrates this tension and favors the Nyāya view.  

  **The Constructed Case and *Pramāṇa* Assignment**  
  In the case described, the traveller’s cognition (“This is what the guide meant”) is produced by *upamāna* according to Nyāya. The guide’s testimony (“gavaya looks like a cow but is not a cow”) provides a resemblance relation (*sādṛśya*) but no perceptual encounter with a gavaya. When the traveller later perceives an unfamiliar cow-resembling animal, she grasps its identity *via* similarity to the cow (a known object) triggered by the testimony. Nyāya argues this is a non-inferential, resemblance-based cognition distinct from recalling testimony or perceiving qualities.  

  **Reductionist Strengths and Weaknesses**  
  The reductionist—claiming *upamāna* collapses into inference or testimony+perception—correctly satisfies conditions (i) and (ii) but fails on (iii).  
  - *(i) Veridicality*: The cognition is reliable (true gavaya identification) and reducible to testimony (the guide’s words) + perception (seeing the animal).  
  - *(ii) Irreducibility to a single source*: No *one* existing source produces this cognition alone. Testimony without perception cannot identify the animal; perception without testimony cannot link it to “gavaya”; inference requires prior knowledge unavailable here.  
  - **Failure on (iii) Distinct Instrument**: The reductionist treats the cognition as a *combination* of testimony-based memory and perception. Yet this mischaracterizes the causal route. The traveller’s cognition arises not from inferential reasoning (“The guide described X; this matches X; therefore, it is gavaya”) but from an immediate recognition *via* resemblance. The *karaṇa* is the activation of similarity itself: the perceived animal’s cow-like features directly trigger awareness of the testimony’s meaning through likeness. Inference relies on universals and logical connections; *upamāna* relies on associative resemblance. The reductionist conflates the *occasion* (testimony enabling later recognition) with the *instrument* (resemblance as the direct cause).  

  **Nyāya’s Stronger Claim**  
  Nyāya satisfies all three conditions, with (iii) being pivotal:  
  - *(i) and (ii)*: *Upamāna* reliably yields cognitions of identity-through-resemblance (e.g., “this is a gavaya”). Crucially, inference cannot replicate this *alone* here because the traveller lacks premises for a deductive rule (e.g., “All cow-like non-cows are gavayas”), and testimony+perception operates sequentially, not as a single source.  
  - *(iii) Distinct Instrument*: The *karaṇa* is the resemblance relation (*sādṛśya*) itself, cognitively operative when perception of an object (gavaya) activates similarity to a known object (cow) via testimony-stored information. This causal route—worldly resemblance → perceptual contact → resemblance-triggered identification—differs from inference (mediated by universals) or testimony (mediated by linguistic comprehension). The constructed case aids Nyāya by stripping away typical inferences: the guide avoids analogies (“like a cow”), offering only a definition. Yet the traveller’s cognition remains non-inferential and resemblance-driven, underscoring *upamāna*’s unique mechanism.  

  **Application to Other *Pramāṇas***  
  The criterion must apply neutrally:  
  - *Pratyakṣa (perception)*: Easily satisfies all conditions. (i) It yields direct sensory cognitions (e.g., “this is blue”); (ii) No other source produces these alone; (iii) Its *karaṇa* is sense-object contact, distinct from conceptual processes.  
  - *Anumāna (inference)*: Satisfies (i) veridical cognitions (e.g., “there is fire on the hill”) and (ii) irreducibility (perception cannot yield universal-based conclusions). However, (iii) is contested: its *karaṇa* (knowledge of universal concomitance, *vyāpti*) depends on perception/testimony for premises. While Nyāya defends its distinctness, rivals (e.g., Cārvāka) might argue it is derivative.  
  - *Śabda (testimony)*: Clearly independent. (i) It yields reliable linguistic cognitions (e.g., “Varanasi is holy”); (ii) No other source provides authoritative semantic knowledge alone; (iii) Its *karaṇa* is comprehension of reliable speech, distinct from perceptual or inferential causes.  

  **Conclusion**  
  The independence criterion validates *upamāna* as a distinct *pramāṇa* primarily through condition (iii). The reductionist rightly notes testimony and perception are necessary *context* but errs in denying resemblance a unique causal role. The constructed case fortifies Nyāya by isolating resemblance as the instrument. Applying the criterion generally confirms *pratyakṣa* and *śabda* as unproblematic, while *anumāna* faces challenges on (iii)—suggesting the test is rigorous but not tailored to *upamāna*.  

  ---

  ### Marking Scheme (25 marks total)  
  | **Must-Hit Point**                                                                 | **Marks** | **Common Mistake (costs mark)**                               |  
  |------------------------------------------------------------------------------------|-----------|---------------------------------------------------------------|  
  | **1. Accurately explains the 3-part independence criterion.**                      | 5         | Misstating conditions (e.g., omitting reliability in (i)).    |  
  | **2. Correctly assigns *upamāna* to the constructed case & analyzes its implications.** | 5         | Misidentifying the source (e.g., calling it inference).       |  
  | **3. Evaluates reductionist vs. Nyāya using all 3 conditions, noting reductionist succeeds on (i)/(ii) but fails (iii).** | 6         | Oversimplifying (e.g., claiming reductionist wholly wrong).   |  
  | **4. Identifies condition (iii) (*karaṇa*) as decisive & contrasts instrument vs. occasion.** | 5         | Conflating causal instrument with enabling factors.           |  
  | **5. Tests one other *pramāṇa* (e.g., *anumāna*) under the criterion.**            | 4         | Ignoring general applicability or misjudging (e.g., claiming *śabda* fails (iii)). |  

  ---
  **Rationale**: The question targets higher-order reasoning by forcing engagement with a stipulated criterion and novel case. The model answer balances dialectical fairness with a defended conclusion, while the marking scheme prioritizes structural clarity over doctrinal allegiance. Common mistakes reflect exam pitfalls (e.g., source misassignment, causal conflation). The 25-mark scale allows nuanced grading, with heavier weighting on comparative analysis (points 3–4).
