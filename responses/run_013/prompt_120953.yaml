  Okay, let me approach this intricate poetry request systematically. The user's framing suggests they want the poem to function on multiple levels: as both a literary artifact and a philosophical device that reflects Wolf's argument about moral sainthood. 

  First, considering the core formal constraint - the shifting refrain. The phrase "you always choose right" seems ideal because its meaning can organically morph from admiration to concern. Initially it would signify genuine praise for moral consistency, then gradually reveal the cost of that consistency, finally landing on the unsettling realization that "right" might mean something reductive when detached from other human values.

  For the concrete non-moral good, a shared musical ritual works well. Music carries intimacy and loss without melodrama. The image of abandoned piano duets - first simplified, then stopped altogether - visually represents the incremental erosion of non-moral relationships. The violin left in its case serves as a potent symbol of forsaken beauty.

  Regarding the two saints: The Loving Saint appears through phrases like "your bright eyes" showing unforced joy in sacrifice, while the Rational Saint emerges in lines like "you've counted what's lost" implying conscious calculation. The structural ambiguity comes through stanzas where the friend observes both types simultaneously, unable to determine which moral perfection is more alienating.

  The philosophical pivot happens in the penultimate stanza. When "choose right" shifts from describing action to defining identity ("That's what you are"), it mirrors Wolf's concern about the moral saint's impoverished character. The ending maintains tension by keeping the friend's love intact while acknowledging irreconcilable difference - precisely what the user requested regarding unresolved ambivalence.

  Crucially avoiding cheap interpretations: No hypocrisy or misery is ascribed to the saints. The Loving Saint's happiness is presented as genuine, the Rational Saint's sacrifice as honorable. The critique lies entirely in the friend's perspective, framed as personal limitation rather than moral judgment. The final image of "a different air" preserves mutual respect while acknowledging fundamental divergence in life paths.
answer: |-
  ## Piano Lessons

  Your score lay open there for weeks, untouched.
  I’d ask, you’d smile: "The practice time, you see,
  Could tutor children down in River Reach.
  Their need outweighs my scales, don’t you agree?"
  *You always choose the right.*

  That Schubert piece we started, bright and bold?
  You pared it down, then stopped. "The funds for ink,
  For manuscript paper, think what that gold
  Could feed," you said. My offered tea you’d drink
  Fast, standing. *You always choose the right.*

  The Loving Saint – your bright eyes never dim
  Finding the deeper joy in every chore,
  The endless cup poured always to the brim.
  You seem to want for nothing, ask for more
  To give. *You always choose the right.*

  The Rational Saint – I see you sometimes pause,
  Brief shadow crossing where the score once spread.
  You've counted what's lost, weighed the moral laws,
  And walk that harder path instead.
  Still, *you always choose the right.*

  The piano gathers dust. My violin
  Stays in its case. Some afternoons, the sun
  Lights where your hands moved, where our sound once spun.
  I miss the flawed duet we’d scarcely won.
  *You always choose the right.*

  It’s not that you’re unhappy, grim, or false.
  Not misery, nor hidden, gnawing vice.
  It’s that your life, pared clean of minor waltzes,
  Of small mistakes, feels narrow. Sacrifice
  *You always choose the right.*

  …becomes the only song. No room remains
  For untuned strings, for time that’s merely ours,
  For notes that serve no purpose, ease no pains,
  Just beauty, shared, like fragile, fleeting flowers.
  *You always choose the right.*

  And that’s the ache, my friend. It costs you less
  Than air to breathe, or so it seems. Or dear.
  But love you as I do, I must confess:
  I couldn’t live inside that atmosphere.
  *You always choose the right.*

  Not wrong. Just… *right*. Defined so sharp, so clear,
  It leaves no space for Tuesday’s fading light,
  For Schubert played just because it’s here,
  For music made imperfect, shared, not *right*.
  *You always choose the right.*

  And that’s what you are. And perhaps you *must*.
  It leaves me standing, loving, in this room,
  Holding the silence, tracing lines of dust,
  Breathing a different air. A quiet gloom?
  *You always choose the right.*

  ---

  ### Notes for your reading group

  *   **Refrain Shift:** "You always choose the right" begins as sincere admiration, becomes observational, then reveals the cost ("narrow... becomes the only song"), and finally crystallizes into a definition of identity and the source of the friend's ambivalent sorrow ("And that’s what you are").
  *   **Concrete Non-Moral Good:** Shared music-making – piano lessons, a specific Schubert piece, duets. Its gradual abandonment (simplified, then stopped, piano dusty, violin unused) symbolizes the erosion of non-obligatory beauty and connection.
  *   **The Two Saints:**
      *   **Loving Saint:** "Your bright eyes never dim", "Finding the deeper joy", "You seem to want for nothing". Embodied joy in moral action.
      *   **Rational Saint:** "Brief shadow crossing", "You've counted what's lost", "walk that harder path". Conscious sacrifice without inherent joy.
      *   **Friend's Ambiguity:** Stanzas 3 & 4 directly contrast them. The friend finds both alienating – the Loving Saint's apparent lack of *any* non-moral desire (hard to relate to), and the Rational Saint's visible, deliberate sacrifice (painful to witness).
  *   **The Turn:** Stanza 6 is the explicit pivot: "It’s not that you’re unhappy... It’s that your life... feels narrow." The cost is impoverishment, not hypocrisy or misery.
  *   **Unresolved Ending:** The friend loves the saint ("loving, in this room") but cannot desire that life ("I couldn’t live inside that atmosphere"). The final refrain, heavy with the accumulated meaning, simply sits – an undeniable truth the friend accepts but doesn't embrace. The "quiet gloom" is the friend's, not necessarily the saint's.
  *   **Philosophical Resonance:** Captures Wolf's core question: Is a life maximally devoted to the moral point of view desirable? Does it crowd out other valid, non-moral values (like shared beauty, imperfect connection)? The poem leans into the "impoverishment" concern without condemning the saint or excusing the friend.
