prompt: |-
  My reading group has been grinding through a book on weakness of will for the last few weeks — Sunday nights, somebody's kitchen, usually more wine than philosophy by nine — and last week Priya ambushed us with an argument she says she picked up in a lecture on hyperbolic discounting. The gist is that once you take discounting seriously, akrasia just dissolves: there's no such thing as acting against your own better judgment, there's only your preferences shifting as the reward gets closer. She wrote it on the whiteboard in numbered steps and I copied it down before she erased it:

  (1) Weakness of will is acting against your own better judgment.
  (2) Your better judgment at any given moment is just your strongest preference at that moment — what you most want, all things considered.
  (3) People discount future rewards hyperbolically, so a preference between the same two rewards can flip as the sooner one approaches. (Her example: if today you're offered $100 in a week versus $120 in two weeks, most people hold out for the $120; ask the same person a week later, when it's $100 now versus $120 in a week, and most take the $100. Same two rewards, opposite choice, only "now" moved.)
  (4) So at the moment you act, you prefer whatever it is you do; that's part of what makes it your action rather than something that merely happened to you.
  (5) If at the moment of action you preferred A to B, then doing A wasn't against your better judgment.
  (6) Therefore nothing is ever weak-willed. "Akrasia" is just our name for the fact that preferences are time-indexed, not a name for any real failure.

  She added, half joking, that this is why commitment devices are rational — the sophisticated agent knows her future self's preference will flip and ties herself to the mast. But that seems to me to cut the other way: the whole point of the Ulysses contract is that you expect to act against the judgment you're acting on right now, so it looks like evidence for akrasia rather than a way of explaining it away, and she says I'm begging the question. She also insists the argument kills both the synchronic version (acting against your judgment in the moment) and the diachronic one (acting against a judgment you formed earlier and still think was right), and thats the bit I most want to resist. I want to keep (1) and (3), I'll give up almost anything else, and I've flip-flopped on this alot. So which step do I reject, and what does rejecting it cost me? Specifically, if I keep (1) and (3), what am I forced to say about (2), and is there a principled distinction between a preference and a judgment here, or am I just insisting on the conclusion I want?
reasoning: |-
  Okay, the user is dealing with a philosophical argument from their reading group that challenges the concept of akrasia (weakness of will) using hyperbolic discounting. Priya's argument claims that what we call weakness of will is just shifting preferences over time, not a real failure. The user wants to reject this conclusion but keep definitions (1) and (3), specifically that weakness of will is acting against better judgment and that hyperbolic discounting causes preference reversals.

  The user's main struggle is reconciling hyperbolic discounting with the existence of akrasia. They're open to modifying other premises but seem attached to maintaining a distinction between momentary preferences and better judgment. The mention of Ulysses contracts suggests they see these as evidence for akrasia, contrary to Priya's view.

  The core tension is between time-sliced preferences (step 4) and enduring judgments (step 2). Priya equates judgment with strongest momentary preference, which collapses the possibility of acting against judgment. The user likely wants to preserve a notion of judgment that persists beyond immediate desires.

  Possible angles:
  - Challenge step 2: Argue that "better judgment" isn't identical to strongest current preference
  - Challenge step 4: Question whether action always reflects current preference
  - Challenge step 5: Redefine what counts as "against better judgment"

  The Ulysses contract point is crucial - it implies we recognize future preferences may misalign with current values. This suggests a multi-level preference structure where we distinguish between:
  - Momentary impulses (what I want now)
  - Endorsed values (what I want to want)

  The user might benefit from Frankfurt's hierarchy of desires or Bratman's planning theory. Both allow for akrasia as acting against one's higher-order/planned commitments despite first-order preferences.

  Rejecting step 2 seems most promising. If better judgment represents stable, higher-order preferences while actions follow shifting first-order preferences, then akrasia survives hyperbolic discounting. The cost is needing a robust account of what constitutes "better judgment" beyond momentary desire.

  The user's challenge will be defending this distinction without begging the question. They'll need to show why we should privilege certain preferences (e.g., sober Sunday-night preferences over tipsy Tuesday preferences) as "better judgment."
answer: |-
  This is a brilliant and frustrating argument—Priya's distilled it well, and your intuition about Ulysses contracts is spot-on. Let's dismantle it step-by-step while preserving (1) and (3). The core tension is **whether your "better judgment" (1) is identical to your *momentary strongest preference* (2)**. Rejecting (2) is your most defensible path, but it requires carving out a distinction between "preference" and "judgment." Here's how:

  ### Your Path: Reject Premise (2)
  **Premise (2) claims:** "Your better judgment at any given moment is just your strongest preference at that moment."  
  **Your rejection:** Better judgment is *not* merely your strongest momentary preference; it’s a **reflective, stable evaluation** of what aligns with your *endorsed values, long-term goals, or rational commitments*, even if your *immediate impulses* pull you elsewhere.

  ### Why This Works (and What It Costs)
  1. **Preserves (1) and (3):**  
     - You keep "akrasia = acting against better judgment."  
     - You accept hyperbolic discounting causes *preference reversals* (e.g., Sunday-you prefers $120 in 2 weeks; Tuesday-you grabs $100 now).  

  2. **Explains Ulysses Contracts:**  
     - These aren't just "sophisticated preference management" (as Priya jokes). They’re evidence that you *distinguish* between:  
       - **Momentary preference:** What you *feel* strongest at time T (e.g., "I crave the $100 now!").  
       - **Better judgment:** What you *endorse* as best overall (e.g., "Waiting for $120 aligns with my goal of wealth-maximization").  
     - You tie yourself to the mast *because you know your future momentary preference will contradict your enduring judgment*. This *is* akrasia anticipated.  

  3. **Solves Diachronic Akrasia:**  
     - When you take the $100 on Tuesday, you’re acting against Sunday-you’s *better judgment* (which Tuesday-you still rationally acknowledges was correct). But Tuesday-you’s *momentary preference* is stronger due to hyperbolic discounting.  
     - **Akrasia occurs** when you act on the momentary preference *despite knowing* it violates your better judgment.  

  4. **Costs of Rejecting (2):**  
     - **Metaphysical Burden:** You must defend what "better judgment" is if not the strongest preference. Is it a second-order desire? A rational faculty? A planning commitment? (More below).  
     - **Psychological Burden:** You need an account of *why* momentary preferences can overpower better judgment (e.g., visceral urges, hyperbolic discounting hijacking System 1 thinking).  
     - **A Challenge from Priya:** "If you *do* A, didn’t you *prefer* A at that moment? How can you act against a preference?"  
       - **Reply:** Yes, you had a stronger *impulsive preference* for A, but your *judgment* (endorsed preference) was for B. Action requires a *motivating* preference, not necessarily an *endorsed* one.  

  ---

  ### Defending the Judgment/Preference Distinction
  Your principled distinction avoids "just wanting the conclusion." Philosophers like **Harry Frankfurt** ("Hierarchy of Desires") or **Derek Parfit** ("Critical vs. Subjective Preferences") offer frameworks:  

  | **Concept**          | **Momentary Preference**                          | **Better Judgment**                               |
  |----------------------|--------------------------------------------------|--------------------------------------------------|
  | **Nature**           | First-order impulse/urge                         | Reflective, higher-order evaluation              |
  | **Stability**        | Volatile (shifts with proximity, context)        | Stable (tied to values, long-term goals)         |
  | **Role in Akrasia**  | What you *act on* in weak-willed moments         | What you *betray* in weak-willed moments         |
  | **Example**          | "I want this cake NOW!" (Tuesday impulse)        | "I judge abstaining is best for my health." (Sunday's plan + Tuesday's acknowledgment) |

  **Hyperbolic discounting explains *why* the impulse overpowers judgment** (it makes immediate rewards psychologically salient), but it doesn’t erase the conflict. It *creates* the conditions for akrasia.

  ---

  ### Why Priya’s Other Steps Fail if (2) is Rejected
  - **Premise (4):** *"At the moment you act, you prefer what you do."*  
    → **Granted**, but this is the *impulsive preference*, not the *judgment*.  
  - **Premise (5):** *"If you preferred A to B at the moment, doing A wasn’t against better judgment."*  
    → **Rejected**, because "prefer" here is ambiguous. If "better judgment" isn’t defined by momentary preference, acting on a momentary preference *can* contradict judgment.  

  ---

  ### Conclusion: Your Best Move
  1. **Keep (1):** Akrasia is real (acting against better judgment).  
  2. **Keep (3):** Hyperbolic discounting causes preference reversals.  
  3. **Reject (2):** Better judgment ≠ strongest momentary preference. It’s your stable, reflective evaluation.  
  4. **Result:** Akrasia occurs when hyperbolic discounting (or similar mechanisms) causes you to act on a momentary preference that *contradicts* your better judgment.  

  **Is this principled?** Absolutely. It captures the phenomenology of weakness of will ("I knew it was wrong, but I did it anyway") and explains why Ulysses contracts aren’t just preference management—they’re armor *against* your future self’s akratic tendencies. Priya might call this question-begging, but you’re offering a richer psychology: humans aren’t just time-slices of preferences; we’re planners who commit to futures we know our momentary selves will sabotage. That’s not dissolving akrasia—it’s taking it seriously.
