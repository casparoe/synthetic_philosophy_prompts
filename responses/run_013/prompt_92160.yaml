  Based on your officemate's consistent verdicts across the scenarios you provided, I've reverse-engineered the rule she's likely using to determine whether cooperation takes hold in prisoner's dilemma settings. Her approach distinguishes between one-shot and repeated interactions, applying different criteria to each. Below, I'll explain the rule, apply it to your new case, and address potential alternative rules.

  ### The Rule She's Running
  Your officemate's verdicts fit a standard game-theoretic rule based on the **Grim Trigger strategy** for repeated prisoner's dilemmas. Here's the logic:
  - **One-shot interactions (no future rounds)**: Cooperation never takes hold. This is because defection is the dominant strategy in a one-shot prisoner's dilemma (T > R and P > S). Her "no" verdicts in scenarios 1 and 4 align with this, regardless of whether players know each other's identities (since there's no future to incentivize cooperation).
  - **Repeated interactions (indefinite horizon)**: Cooperation can take hold and be sustained if the **continuation probability (δ)** is high enough to make mutual cooperation stable against temptation. Specifically, she uses the condition for Grim Trigger:
    \[
    \delta \geq \frac{T - R}{T - P}
    \]
    - Here, δ is the probability of another round (e.g., δ = 0.95 for a 95% continuation chance).
    - If this inequality holds, cooperation is sustainable (she says "yes"); otherwise, it is not ("no").
    - **Why Grim Trigger?** It's a simple, robust strategy where both players start by cooperating and defect permanently if the other ever defects. The condition ensures that the long-term reward for cooperation outweighs the short-term gain from defection.

  ### Verification Against Previous Verdicts
  - **Scenario 1 (one-shot, T=6, R=5, P=1, S=0)**: One-shot → "no" (fits).
  - **Scenario 2 (repeated, δ=0.95, T=6, R=5, P=1, S=0)**:
    \[
    \frac{T - R}{T - P} = \frac{6 - 5}{6 - 1} = \frac{1}{5} = 0.2, \quad \delta = 0.95 \geq 0.2 \quad \text{→ "yes" (fits)}.
    \]
  - **Scenario 3 (repeated, δ=0.95, T=20, R=5, P=1, S=0)**:
    \[
    \frac{T - R}{T - P} = \frac{20 - 5}{20 - 1} = \frac{15}{19} \approx 0.789, \quad \delta = 0.95 \geq 0.789 \quad \text{→ "yes" (fits)}.
    \]
  - **Scenario 4 (one-shot, T=6, R=5, P=1, S=0)**: One-shot → "no" (fits).

  This rule perfectly explains all four verdicts. The Grim Trigger condition is the simplest and most consistent with her calls, especially since she said "yes" in Scenario 3 despite the high temptation (T=20), which only requires δ ≥ 0.789 (satisfied by δ=0.95).

  ### Prediction for Your New Case
  - **Your setup**: Repeated interactions, indefinite horizon, δ = 0.90 (90% continuation chance), T=100, R=3, P=0, S=-1.
  - **Apply Grim Trigger condition**:
    \[
