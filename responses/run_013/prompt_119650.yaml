prompt: |-
  I retired a few years back after thirty-five years as a field entomologist—mostly carabid beetles, lots of pitfall traps and genitalia dissections—and now that I have time I've gotten into philosophy latley, sitting in on a philosophy of biology reading group at teh local university. I keep getting stuck on the species problem, and I want a straight answer with a number rather than a tour of the literature. So: what is your credence that at least some of the groupings we call species are real, mind-independent divisions in nature—that they would still be there, dividing up the living world, even if no one had ever named them—rather than just useful human pigeonholes? I know that is a mouthful, so decompose it for me. Give me rough probabilities (0 to 1) for the sub-questions you think it hinges on: whether the biological species concept picks out something real for sexual organisms; whether phylogenetic species concepts are just operational tools or can be metaphysically loaded; whether the species-as-individuals view (the one that says species taxa are particular lineages, not classes) helps or hurts the realist case; whether the bacterial and archaeal cases—where horizontal gene transfer makes the tree of life look more like a braided river—are a special exception or a sign that the whole species category is a human artifact; whether the fact that species is just one rank among many in the Linnaean hierarchy matters; and whether the right answer is pluralism (different concepts for different purposes) rather than a single correct concept. For each, give me a number and a sentence of justification, then combine them into your final credence and tell me which sub-question your number is most sensitive to. Also, since I am new to this, tell me what kind of evidence or argument would move your number the most—like a new way of measuring gene flow in the field, or a philosophical argument that species taxa are individuals rather than kinds. I am not looking for a bibliography or a reading list, just your reasoning. Please answer in American English.
