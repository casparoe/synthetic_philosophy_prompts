prompt: |-
  I have been trying to work out what I actually believe about when it is legitimate to explain a social outcome by appeal to a collective — a firm, a class, a market, a culture, an institution — rather than to the beliefs and actions of the individuals involved. Going case by case and trusting my reactions, I get verdicts that I cannot get to add up, and I would like you to find the principle behind them, or else tell me that there isn't one and which verdicts have to go.

  Here are my verdicts. A firm moved its plant offshore to escape a union drive: fine. France sought to humiliate Germany at the peace conference: fine, even though a great many French people wanted nothing of the kind. The hierarchy's opposition to contraception shaped policy in several countries: fine. Consumers balked at the price rise and sales collapsed: fine, and I take this to be nothing over and above a lot of individuals reacting. The currency fell because the market lost confidence in it: not fine — the only evidence for the confidence seems to be the fall. The depression helped the extreme right: fine. The working class was betrayed by its leaders: not fine, since the working class never decided anything and its members disagreed about everything. The party's discipline came from its organizational structure rather than its ideology: fine. The region's culture resisted industrialization: not fine; I cannot see what I would be asserting beyond a pattern of individual refusals, and when I try to make it more than that it turns into a claim about a group mind. The Wehrmacht's rigid command structure hampered improvisation: fine, even though I can't state this as a fact about any individual's beliefs or desires. The bureaucracy expanded because it needed to: not fine. Smallholders had an interest in inflation, so they tolerated it: fine. The bourgeoisie supported the extreme right because it was in its objective interest: not fine, since the interest is being read off the outcome it is supposed to explain. The banks lobbied against the rule because they stood to profit from its absence: fine.

  My tentative principle is that collective talk is legitimate just in case it can be replaced, without loss of truth or causal relevance, by talk about individuals. That handles the consumers, the smallholders and the banks, but it seems to me simply false of the firm, the French state and the Wehrmacht, where the replacement loses the very thing doing the explaining. So I suspect a second clause is needed, and I don't know what it should say.

  What I want from you: the best principle or small set of competing principles, stated precisely enough to apply to cases I haven't thought of, with the specific verdict above that motivates each clause; your verdicts on three cases I haven't settled — whether "the election turned on the economy" is an aggregate claim or a holistic one, whether "the housing market's speculative dynamics" is legitimate given that no one intended the dynamic and no body decided on it, and whether your principle extends to collectives that are not made of people at all, such as a colony or a hive; and an honest statement of which of my verdicts the principle cannot accommodate and which I should give up. If two principles fit equally well, say which is simpler and what turns on the choice.

  Open with the principle in two or three sentences — I want the bottom line before the defence — then the rest. Keep the whole reply under 800 words.
reasoning: |-
  Okay, the user is struggling with when it's legitimate to explain social outcomes by appealing to collectives rather than individuals. They've listed various cases where they find such explanations acceptable or not, but they can't find a consistent principle. Their tentative principle—replacing collective talk with individual talk without losing truth or causal relevance—works for some cases but fails for others like firms or states. 

  Hmm, the user seems philosophically inclined, probably in social sciences or philosophy, given how they're dissecting examples like the Wehrmacht's command structure or the working class betrayal. They're clearly frustrated by the inconsistency in their own judgments and want a rigorous framework. There's also an unspoken need here: they might be wrestling with methodological individualism vs. holism debates, or even ethical implications (e.g., blaming "cultures" vs. individuals). 

  Right, their examples are diverse—economics, history, sociology—so the principle must be interdisciplinary. The cases where collective explanations fail (e.g., "market confidence" causing currency fall) often involve circularity or reification. But where they work (e.g., firms offshoring), there’s usually clear structure: roles, rules, decision-making processes. That’s the key! The distinction isn’t just about reducibility to individuals but about whether the collective has *emergent causal mechanisms*—like organizational hierarchies or institutional incentives—that constrain or direct individual actions. 

  For the unresolved cases:  
  - "Election turned on the economy" is aggregate—it sums individual voting behaviors tied to economic perceptions.  
  - "Housing market dynamics" is legitimate because it’s about emergent patterns from rules (e.g., speculation fueled by feedback loops in pricing).  
  - Hives/colonies? Tricky, but if they have functional organization (like ant colonies), similar principles apply.  

  The user’s verdicts mostly fit, except:  
  - "Working class betrayed" should be fine if leaders’ roles (not group mind) explain betrayal.  
  - "Culture resisted industrialization" could be legitimate if tied to shared norms transmitted institutionally (e.g., via elders/churches).  

  I’ll propose a two-clause principle: reducibility *or* structured roles generating causal powers. Defend it by showing how structures (firms, armies) create irreducible causal forces, while "market confidence" is just a label for aggregate behavior. Simpler than rival principles, and avoids group-mind mysticism.  

  User might push back on "culture" or "hive" extensions—I’ll note those as debatable but consistent under structural analysis. Honesty matters here: their "betrayal" and "culture" rejections should be revised for coherence.  

  Word count tight—prioritize clarity. Lead with the principle, then unpack cases swiftly.
answer: |-
  ### Principle
  **Collective explanations are legitimate if either (1) they are reducible to claims about specific individuals' actions, beliefs, or interests without explanatory loss; or (2) they refer to structured entities (e.g., institutions, organizations) whose *formal roles, rules, or decision-making procedures* generate emergent causal powers irreducible to individual psychology.** Clause (1) covers aggregate patterns; clause (2) covers structured collectives with codified agency.

  ### Verdicts on Your Cases  
  - **Legitimate (Clause 2)**: Firm offshoring (corporate decision-making), France at peace conference (state diplomacy), hierarchy's contraception policy (institutional doctrine), Wehrmacht command structure (military rules), party discipline (organizational design).  
  - **Legitimate (Clause 1)**: Consumer reaction (aggregate), smallholders' interest (common individual interest), banks lobbying (shared profit motive), depression aiding far right (emergent pattern).  
  - **Illegitimate**: Currency fall/"market confidence" (circular reification), working class betrayal (no structure/agency), culture resisting industrialization (no formal structure/roles), bureaucracy "needing" expansion (teleology), bourgeois "objective interest" (post-hoc rationalization).  

  ### Unresolved Cases  
  1. **"The election turned on the economy"**: Legitimate (Clause 1). Reducible to voters' individual economic perceptions influencing votes.  
  2. **"The housing market's speculative dynamics"**: Legitimate (Clause 1). Emerges from rules (e.g., lending practices, appraisal feedback) and individual profit-seeking.  
  3. **Non-human collectives (e.g., hive)**: Extends via Clause 2 if roles/rules exist (e.g., bee colonies have functional divisions).  

  ### Inconsistent Verdicts to Revise  
  - **Revise "working class betrayal" to legitimate** if leaders' roles explain betrayal (Clause 2). If not, it fails like "culture."  
  - **Revise "culture resisted industrialization" to potentially legitimate** if tied to institutions (e.g., religious authorities enforcing norms).  

  ### Why This Principle?  
  - **Simplicity**: Two clear criteria covering aggregates (Clause 1) and structured entities (Clause 2).  
  - **Causal Rigor**: Avoids reification (e.g., "market confidence") while acknowledging institutional causality (e.g., firms act via boards/protocols).  
  - **Competing View**: Strict individualism (only Clause 1) fails for structured cases (e.g., France’s state action ≠ sum of citizens). Holism risks group minds. This balances both.  

  **Defence**: Clause 2 resolves key cases: "France" acts via state machinery; the Wehrmacht's structure constrains individuals. Your "organizational structure" verdict explicitly fits. Illegitimate cases lack reducibility or structure, becoming circular ("market confidence") or teleological ("bureaucracy needed to expand").  

