  For the marking scheme, five must-hit points. Each should have specific pitfalls. For example, missing the swap test implications or not analyzing the value judgment tension. The fifth point about the coherence of Benatar's value theory is crucial. Common mistakes here would be not questioning how impersonal good and personal harm interact.

