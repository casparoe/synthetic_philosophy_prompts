prompt: |-
  I am trying to judge accounts of large historical changes -- demographic collapse, the abandonment of settlements, the fall of states -- that give a central role to non-human causes: pathogens, volcanic forcing, shifts in climate. Before I weigh any particular account, I want the specification in full: what must a theory of non-human historical causation deliver to count as adequate for the purpose of writing causal narrative?

  Lay out the desiderata, each with the case or consideration that motivates it. I want the cases it has to get right (the same eruption or the same pathogen producing opposite outcomes in neighbouring societies; a non-human cause that is necessary but not sufficient; a so-called natural disaster that is partly a product of human decisions); the distinctions it cannot collapse (cause versus agent; proximal versus distal; explaining the timing of an event versus its magnitude or direction; an exogenous nature versus one already shaped by human action); and the results it must stay consistent with, both from the natural sciences and from what we know about how institutions and choices mediate shocks. Mark which requirements are non-negotiable and which are the prejudices of a particular camp, and tell me if any pair cannot be jointly satisfied -- that is the part I most want to see.

  One proposed criterion I would like you to rule on: that a non-human cause counts as a historical actor only if it alters the set of options open to the people involved. Say whether that belongs on the list as a genuine requirement or is doing illegitimate work.

  Then take a definite position: which single requirement does the most to rule out accounts that treat a volcano or a germ as a self-sufficient historical actor, and where does that leave the strongest version of the case for non-human agency?
reasoning: |-
  Okay, the user is asking about how to evaluate historical theories that emphasize non-human causes like diseases, volcanoes, or climate shifts. They want a set of criteria to judge such theories, including cases they must explain, distinctions they should maintain, and consistency with scientific knowledge. They also want to know if a specific criterion—that non-human causes must alter human options—is valid and which single requirement is most important to prevent oversimplification.

  First, I need to break down their request. They mentioned several components: desiderata for a theory, cases that illustrate complexities (like same cause, different outcomes), necessary distinctions (cause vs. agent, proximal vs. distal), and consistency with natural sciences and human factors. They also want to know which requirements are non-negotiable versus debatable, and if any pairs conflict.

  The user brings up a specific criterion: non-human causes must alter human options. I need to evaluate if this is essential or problematic. Then, identify the key requirement that challenges the idea of non-human actors as sufficient by themselves.

  Considering the user's identity, they might be a historian or a student in environmental history, historical sociology, or a related field. They're looking for a rigorous framework to assess causality in history, especially where natural factors intersect with human societies. Their deeper need is likely to avoid deterministic explanations and to integrate human agency with environmental factors.

  For the desiderata, I should consider cases like the Black Death in Europe vs. the Near East to show different outcomes from the same pathogen. Also, the role of human decisions in disasters like famines. The distinction between cause and agent is crucial to avoid anthropomorphizing nature. Proximal vs. distal causes help in understanding chains of events. Exogenous vs. shaped nature addresses the Anthropocene debate.

  The requirement about altering human options seems valid but needs to avoid reductionism. It ensures the cause impacts societal choices, making it historically relevant. However, it shouldn't dismiss non-human factors that don't directly change options but still have effects.

  The most important requirement to counter self-sufficient non-human actors is probably Mediated Causation. It emphasizes that non-human factors must work through human institutions and decisions. This directly challenges narratives that attribute events solely to natural causes without considering societal structures.

  Conflicting pairs might be Scientific Fidelity vs. Mediated Causation. For example, ice core data might show a volcanic eruption, but linking it to societal collapse requires intermediary steps that aren't always documented. However, this isn't a strict conflict but a gap that requires interdisciplinary collaboration.

  The user's unspoken need might be to defend the role of non-human factors in history without falling into environmental determinism. They want a balanced approach that acknowledges both natural forces and human agency, ensuring their narratives are credible and nuanced.
answer: |-
  Here's a comprehensive framework for judging accounts of large-scale historical change emphasizing non-human causes, structured around your requirements. This integrates necessary distinctions, critical cases, consistency demands, and evaluates your proposed criterion.

  **Core Desiderata for an Adequate Theory of Non-Historical Causation in History:**

  1.  **Contextual Vulnerability & Resilience (Non-Negotiable):**
      *   **Requirement:** Must explain why the *same* non-human shock produced drastically different outcomes in different societies (timing, severity, recovery).
      *   **Motivating Cases:**
          *   **The Black Death (Yersinia pestis):** Devastation in 14th-century Europe (~30-60% mortality) vs. less severe impact in the contemporaneous Mamluk Sultanate (Egypt/Syria, ~20-30% mortality). Differences in urban sanitation, trade networks, burial practices, state capacity, and agricultural resilience mattered immensely.
          *   **Little Ice Age (c. 1300-1850):** Collapse of Norse Greenland settlements vs. adaptation and persistence of Inuit societies in the same environment. Differences in subsistence strategies (dairy farming vs. marine hunting), social flexibility, and cultural knowledge were critical.
      *   **Distinction:** Proximal Shock (Pathogen/Frost Event) vs. Distal Preconditions (Societal Structure/Adaptive Capacity).

  2.  **Necessity vs. Sufficiency Distinction (Non-Negotiable):**
      *   **Requirement:** Must clearly delineate whether the non-human factor was a necessary trigger, a contributing factor, or a sufficient cause on its own. Must identify the necessary *human/pre-existing* conditions that made the shock decisive.
      *   **Motivating Case:**
          *   **The "General Crisis of the Seventeenth Century":** Climate deterioration (LIA), volcanic eruptions (e.g., Huaynaputina 1600), and pandemics occurred globally. Yet, outcomes varied: collapse of Ming Dynasty vs. consolidation of Tokugawa Shogunate; English Civil War vs. relative stability in the Dutch Republic. The non-human factors were often necessary to *trigger* crises at that moment, but pre-existing political fragility, economic strain, and institutional weaknesses were necessary for the crisis to unfold as it did.
      *   **Distinction:** The non-human cause (e.g., volcanic winter reducing harvests) vs. the sufficient cause (e.g., pre-existing state fiscal crisis + elite factionalism + harvest failure leading to revolution).

  3.  **Human Amplification/Mediation (Non-Negotiable):**
      *   **Requirement:** Must account for how human decisions, institutions, and social structures *shaped the impact* of the non-human event, often turning a natural phenomenon into a full-blown disaster. Cannot treat nature as purely exogenous.
      *   **Motivating Cases:**
          *   **Famines:** The Irish Potato Famine (1840s) – *Phytophthora infestans* was the proximal trigger, but British colonial policy (export-oriented agriculture, inadequate relief), land tenure systems, and lack of crop diversification were fundamental causes of the catastrophe.
          *   **Dust Bowl (1930s):** Severe drought (non-human) meeting unsustainable agricultural practices (deep plowing of marginal lands encouraged by federal policy and economic pressures) created an ecological and human disaster.
      *   **Distinction:** Exogenous Shock vs. Endogenous Vulnerability (human-shaped landscape/institutions).

  4.  **Mechanism of Mediation (Non-Negotiable):**
      *   **Requirement:** Must specify *how* the non-human cause translated into historical action. What were the concrete pathways? (e.g., pathogen -> mass mortality -> labor shortage -> wage increases/feudal collapse; volcanic aerosol -> reduced sunlight -> failed harvests -> famine -> tax revolt).
      *   **Motivating Case:**
          *   **Fall of the Akkadian Empire (c. 2200 BCE):** Proposed climate shift (aridification) evidenced in speleothems. An adequate account *must* show the chain: aridification -> reduced Tigris/Euphrates flow -> irrigation collapse -> agricultural failure -> famine -> breakdown of centralized grain storage/distribution -> collapse of imperial authority and urban centers.
      *   **Distinction:** Proximal Cause (Drought) vs. Intermediate Mechanisms (Crop Failure, Famine) vs. Ultimate Historical Outcome (State Collapse).

  5.  **Scientific Fidelity (Non-Negotiable):**
      *   **Requirement:** Must be consistent with robust findings from relevant natural sciences (paleoclimatology, epidemiology, volcanology, genetics, archaeology). Cannot cherry-pick or misinterpret scientific data.
      *   **Consistency Requirements:**
          *   Dating must align (eruption date vs. collapse date).
          *   Pathogen identification/genetics must match historical descriptions/remains.
          *   Climate proxy data (ice cores, tree rings, sediments) must support the claimed magnitude/duration of the event.
          *   Archaeological evidence (e.g., cessation of building, mass graves, soil erosion layers) must corroborate the timing and nature of the proposed crisis.

  6.  **Temporal Resolution & Scale Matching (Highly Important):**
      *   **Requirement:** The resolution of the evidence for the non-human cause must be sufficient to align with the historical event's timing. Must match the temporal and spatial scale of the cause and the effect.
      *   **Motivating Case:**
          *   **"Years without Summer" (1816):** The Tambora eruption (1815) is precisely dated, and its climatic effects (documented globally in diaries, frost rings, etc.) clearly caused the agricultural crisis of 1816. Contrast this with linking a vaguely dated "dry period" in proxies to the collapse of a civilization centuries later without precise chronological alignment.
      *   **Distinction:** Proximal Timing (immediate impact) vs. Distal Timing (long-term cumulative stress).

  7.  **Avoiding Anthropomorphism / Cause vs. Agent (Non-Negotiable):**
      *   **Requirement:** Must treat the non-human factor as a *cause* or *condition*, not an *agent* with intention. The narrative must center human actors responding to altered conditions.
      *   **Motivating Consideration:** The fundamental difference between historical explanation (understanding human actions/choices in context) and natural history (describing physical/biological processes). A volcano doesn't "destroy" a society; a society collapses because its people cannot sustain themselves under the conditions *created* by the eruption.
      *   **Distinction:** Cause (Eruption) vs. Agent (Human decisions to stay/flee, adapt/fail).

  **Evaluation of the Proposed Criterion: "Altering the Set of Options"**

  *   **Verdict: Belongs on the list as a Genuine Requirement (Non-Negotiable Core).**
  *   **Reasoning:** This criterion is fundamental to *historical* explanation. History is the study of past human actions and societies. For a non-human factor to be a *historical cause*, it must demonstrably impinge on the realm of human choice and possibility. It must create new constraints (famine forcing migration), eliminate previous options (disease making certain settlements unsustainable), or open new, often difficult, paths (climate shift enabling/favoring one subsistence strategy over another).
  *   **Prevents Illegitimate Work:** It prevents accounts where a non-human factor is identified but its *actual historical impact* on human societies is vague, assumed, or disconnected from the evidence of societal change. A pathogen only matters historically if it kills enough people *to change social structures*. A volcanic winter only matters if it reduces food *to the point of causing famine that triggers political crisis*. This criterion forces the narrative to explicitly connect the non-human event to human experience and agency (even constrained agency).
  *   **Caveat:** It must be applied rigorously to *specific* human groups in their *specific* context. What constrains Option A for Group X might enable Option B for Group Y.

  **Addressing Potential Conflicts & Prejudices:**

  *   **Potential Conflict Pair: Scientific Fidelity vs. Mediated Causation (Mechanism):**
      *   **Nature:** Not a strict logical conflict, but a frequent practical tension. Robust scientific evidence for a massive non-human event (e.g., a huge eruption dated precisely) might be strong, while detailed historical/archaeological evidence for the *specific social mechanisms* linking it to a societal outcome (e.g., tax records showing revolt *caused* by famine *caused* by the eruption) is often fragmentary.
      *   **Resolution:** The theory must acknowledge the gap and avoid over-interpreting either the science or the historical record. It must present the proposed causal chain as the *best available explanation* given the evidence, explicitly noting uncertainties in the mediation steps. It cannot use the strength of the scientific evidence *alone* to justify claims about historical causation without plausible mediation pathways. *This is where many popular accounts fail*.
  *   **"Prejudices of a Particular Camp":**
      *   **Environmental Determinism:** The *prejudice* is that non-human factors are *sufficient* or overwhelmingly dominant, downplaying human agency and institutional mediation (Violates Requirements 1, 2, 3, 4, 7). *Non-negotiable requirements rule this out.*
      *   **Hyper-Constructivism:** The *prejudice* is that non-human factors are essentially irrelevant or mere backdrops; all causation is social/political (Violates the core premise and Requirement 5). *Non-negotiable requirements (especially 5 & 6) rule out ignoring clear scientific evidence of major events.*
      *   **Specificity Fetish:** The *potential prejudice* is demanding a level of mechanistic detail (Requirement 4) that is impossible given historical source limitations, potentially dismissing valid macro-level connections. *This is a tension, not a violation; the requirement is to specify the mechanism *as far as evidence allows*, acknowledging gaps.*

  **Definite Position: The Single Most Important Requirement**

  *   **Mediated Causation (Requirement 4)** does the most heavy lifting in ruling out accounts that treat volcanoes or germs as self-sufficient historical actors.
  *   **Why:** It directly attacks the core flaw of such accounts: the "black box" between the non-human event and the historical outcome. Simply stating "Volcano X erupted and Society Y collapsed" is insufficient. Requirement 4 *forces* the narrative to explain *how* the eruption led *through human societies* to collapse. Did it cause immediate destruction? Famine years later? Mass migration? Religious crisis? Breakdown of trade? Without specifying this chain – which inherently involves human institutions, economies, cultures, and decisions – the non-human factor remains an isolated event, not a demonstrable *historical cause*. It prevents the non-human actor from being the sole protagonist in the narrative; it becomes the instigator of a chain reaction that humans navigate (well or poorly).
  *   **Where it Leaves the Strongest Case for Non-Human Agency:**
      *   **Robust but Constrained:** The strongest case acknowledges the profound, often decisive, *power* of non-human factors to create crises and radically alter the conditions of human existence (fulfilling the "altering options" criterion emphatically).
      *   **Human-Centered Explanation:** However, it firmly embeds this power within a *human-centered explanatory framework*. The non-human factor is the catalyst or the necessary condition, but the *historical narrative* is about how specific human societies, with their pre-existing structures, vulnerabilities, and capacities, responded to that altered reality. The "agency" lies in the interaction: the non-human force creates the new landscape of possibility, and human actors (collectively and individually) make choices within that landscape, leading to the historical outcome.
      *   **Example:** The arrival of *Y. pestis* in Europe created a horrific biological constraint (mass mortality). The *historical narrative* of the Black Death's consequences is about how manorial systems, labor markets, religious institutions, and state authorities responded to that constraint, leading to profound social, economic, and political transformations. The pathogen is a crucial cause, but the story is about people navigating a catastrophe.

  In essence, the volcano or germ is not the actor; it's the earthquake that rocks the stage. The adequacy of the historical account depends on showing how the actors on that stage, given their scripts (institutions) and characters (culture, economy), stumbled, fell, adapted, or rebuilt when the ground shifted.
