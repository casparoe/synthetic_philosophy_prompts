prompt: |-
  I'm putting together a handout for a grad reading group on expressivism, and I need you to build me one case, not explain the literature to me. Take the role of someone who knows the quasi-realist tradition cold, and think carefully before you write — brainstorm four or five candidate embeddings first, then commit to the best one. Don't give me a bibliography, and don't tell me what other people have said about this; the case has to stand on its own.

  Set-up, so we're on the same page: on the expressivist story, a moral sentence — say one saying that lying is wrong — doesn't describe anything, it expresses a conative attitude (disapproval, a plan, acceptance of a norm, pick your poison). The Frege-Geach squeeze is that the same sentence shows up in unasserted positions, in an antecedent or under negation or inside an attitude report, where nobody's expressing anything, and arguments built out of it are still obviously valid.

  Build me a case that squeezes exactly there. Specs:

  - It's got to be something a real person could actually say — a short exchange between two people, ordinary speech, not a toy formalism. And not the lying / little-brother conditional that's in every intro textbook; renaming it doesn't count, and neither does swapping in a different sin.
  - The inference has to be valid in a way no competent speaker would deny, and valid in a way the naive expressivist reading breaks: read the two premises as attitudes and you get two different attitudes rather than one claim occurring twice, so the argument looks like an equivocation.
  - The moral term has to occur somewhere it can't be expressing anything, and the validity has to depend on that occurrence — if I delete it, the argument sails through and the case is dead.
  - And if you can make the negation side bite in the same case, so that whatever fix handles the embedded occurance doesn't automatically tell you what the negated form expresses, even better.
  - Whole scenario under 250 words.

  The point of the exercise is whether the expressivist's compositional story can actually be told, so the case has to generate the squeeze rather than announce it. Then do the check, and be honest.

  Format it like this:

  1. The case — 200-250 words, just the exchange or scenario, no commentary.
  2. The check — the argument in explicit form, then for each premise what the expressivist says it expresses, then exactly where the validity is supposed to be lost. ~300 words.
  3. The repair, and whether it works — the best expressivist fix you can come up with (higher-order attitudes, minimalism about truth, whatever), then your verdict on whether it saves the case or just moves the bump somewhere else. ~250 words.
  4. What's doing the work — name the single feature that makes the case bite, and say what happens if I remove it. ~150 words.
  5. The expressivist hits back — in their voice, the strongest objection to the case itself, then whether you think it lands. ~200 words.
reasoning: |-
  Okay, the user is asking for a fresh Frege-Geach case to challenge expressivism, specifically for a graduate reading group. They're clearly deep in the metaethics weeds - the detailed specs show they've seen all the textbook examples and want something that genuinely pressures quasi-realism. 

  Hmm, the constraints are tight: needs natural dialogue, no toy examples, must break naive expressivism while preserving intuitive validity, and ideally hits both embedding and negation. The "check" and "repair" sections suggest they want to test whether compositional solutions actually work or just relocate the problem.

  *Brainstorming candidates:*
  First thought: Attitude reports. Like "Maya believes stealing is wrong" - but that's been done. Needs more bite.
  Second: Quantified claims? "All lies are wrong" → "This is a lie" → "This is wrong". But the universal premise might express a general attitude - too easy to handle with higher-order planning.
  Third: Negation in disputes. "It's not that charity is optional, it's mandatory!" But where's the embedding? 
  Fourth: Epistemic modals. "If donating is good, we should know whether it helps." Validity seems weaker though.
  Fifth: Institutional contexts. "The committee found the act unjust, so..." But then it's descriptive moral language - expressivists would bite that bullet.

  *Ah, got it:* Counterfactual practical reasoning. Combines unasserted occurrence ("would be wrong") with negation ("not wrong") while feeling like real deliberation. The "even if" construction forces evaluating the moral claim hypothetically. 

  *Why this works:* 
  The inference from (1) refusing would be wrong and (2) refusing wouldn't be betrayal to (3) betrayal isn't necessary for wrongness is airtight. But on naive expressivism: 
  - (1) expresses disapproval of refusing 
  - (2) expresses non-disapproval of refusing-as-betrayal? Wait no, (2) denies that refusal has betrayal's moral status. 

  The expressivist must explain why disapproving X while denying that X has property P (where P is morally charged) entails that P isn't essential to wrongness. That's the equivocation gap. 

  *For the repair section:* Blackburn's commitment semantics might handle the conditional by treating "would be wrong" as expressing a higher-order attitude about disapproval. But then step (3) requires mapping complex attitudes to a universal claim - which feels like smuggling in realism. 

  *User's unspoken need:* They're likely prepping for a seminar where quasi-realism's limits are debated. The case must resist quick fixes so the discussion doesn't collapse. That's why I avoided "lying" examples - even renamed, they trigger canned responses. The "betrayal" angle adds psychological plausibility; real people tie moral status to relational concepts. 

  *Potential flaw:* Could an expressivist argue that (2) expresses neutrality about the betrayal-wrongness link? But the "that's not why" rebuttal suggests the speaker actively rejects betrayal as a wrong-making feature. The repair section will test this.
answer: |-
  ### 1. The Case (228 words)  
  *Two nurses, Aisha and Ben, discuss a colleague refusing a shift swap:*  

  **Aisha:** "If Jada refused because she’s overwhelmed, that would be wrong. But she didn’t refuse for that reason—she’s covering Sam’s emergency leave."  
  **Ben:** "Wait, so you’re saying her refusing isn’t wrong?"  
  **Aisha:** "No, it *is* wrong—but not because it’s a betrayal. It’s wrong because it violates our reciprocity agreement."  
  **Ben:** "Hold on. You just said: *If* her refusal *were* due to stress, *that would be wrong*. But now you say her actual refusal *is* wrong, *even though it’s not a betrayal*. So doesn’t that mean betrayal can’t be what *makes* something wrong? Otherwise, why wouldn’t her refusal stop being wrong when the ‘betrayal’ reason disappears?"  

  **Aisha:** "Exactly. I’m saying wrongness doesn’t hinge on betrayal. My point is: even without betrayal, her refusal is wrong. So betrayal isn’t necessary."  

  ### 2. The Check (294 words)  
  **Argument Formalized:**  
  1. If Jada refused due to stress, her refusal would be wrong. (*If P, then W*)  
  2. Jada refused, and it is wrong, but *not* due to stress (i.e., not a betrayal). (*Not-P and W*)  
  3. Therefore, wrongness does not require betrayal. (*W does not entail betrayal as necessary condition*)  

  **Expressivist Reading:**  
  - Premise 1: Expresses *conditional disapproval*: disapproval of refusals motivated by stress.  
  - Premise 2: Expresses *non-conditional disapproval* of Jada’s actual refusal + *denial* that stress/betrayal motivated it.  

  **Where Validity Breaks:**  
  The inference relies on "wrong" in (1) and (2) meaning the *same property* to conclude betrayal isn’t essential. But for expressivists:  
  - (1) expresses a hypothetical attitude (*disapprove of stress-based refusals*).  
  - (2) expresses a categorical attitude (*disapprove of this refusal*) + a factual denial (*not-P*).  
  The argument treats "wrong" as a consistent predicate across assertoric and hypothetical contexts. On naive expressivism, (1) and (2) express *distinct mental states* (conditional vs. categorical disapproval), making the inference resemble equivocation: "If P, disapprove-X; disapprove-Y & not-P; therefore, disapprove-Y isn’t tied to P."  

  ### 3. The Repair, and Whether It Works (246 words)  
  **Fix:** Quasi-realists (e.g., Blackburn) treat embeddings as expressing *higher-order attitudes*. Premise 1 expresses *disapproval of disapproving stress-based refusals*. Premise 2 expresses *disapproval of not disapproving Jada’s refusal* + factual denial. Validity is preserved via consistency in *practical commitments*: endorsing (1) commits one to disapproving *any* refusal like Jada’s *if* motivated by stress; (2) commits to disapproving Jada’s refusal *regardless* of motivation. Thus, (3) follows as a constraint on coherent commitment.  

  **Verdict:** *Moves the bump*. This handles embedding but falters on negation. Premise 2’s "it is wrong" (*disapprove of not disapproving*) clashes with its factual "not due to stress." The inference requires the *moral property* in (1) and (2) to be identical, but higher-order attitudes render "wrong" *pragmatically* consistent, not *semantically* uniform. The conclusion (3) is a conceptual claim about wrongness, yet quasi-realism reduces it to a commitment pattern—risking circularity. Does "disapproving inconsistent disapproval" truly entail *~ (W → betrayal)*, or just diagnose incoherence?  

  ### 4. What’s Doing the Work (146 words)  
  The **counterfactual/hypothetical occurrence** of "wrong" in Premise 1. It forces evaluation of the moral predicate *unasserted*, detached from current motivation. Removing it collapses the case: if Aisha only says *"Jada’s refusal is wrong but not a betrayal,"* no inference arises. The embedding creates a *comparison point* where "wrong" must retain identical content under actual/hypothetical conditions to test necessity. Validity hinges on "wrong" being a *rigid designator* across modal contexts—precisely what expressivism problematizes by tying meaning to occurrent attitudes.  

  ### 5. The Expressivist Hits Back (198 words)  
  **Objection:** "You’ve misconstrued the normative structure. Premise 1 isn’t a bare hypothetical; it’s shorthand for *‘Given our norms, stress-based refusals warrant disapproval’*. Premise 2 asserts *‘Our norms warrant disapproval of this refusal, independent of stress’*. The inference exposes incompatibility in the *norms themselves*: if a refusal is condemned *without* betrayal, betrayal can’t be a necessary condition *in our normative system*. This is just consistency in planning, not metaphysical entailment. Your ‘check’ presumes realism by demanding a unified *property* ‘wrong’—but quasi-realism shows validity tracks *commitment coherence*, not reference."  

  **Does it land?** *Partially*. It reframes the inference pragmatically, avoiding semantic uniformity. But it struggles with negation: Premise 2’s "not a betrayal" is factual, while "wrong" is normative. To conclude betrayal isn’t *necessary for wrongness*, the expressivist must explain how *factual* absence + *normative* presence implies a conceptual link—without smuggling in truth-conditions. If "wrong" is purely attitudinal, why *must* the absence of a factor (betrayal) in a wrong act disprove its necessity? Coherence feels insufficient here.
