          3. An independent attitude toward risk, captured by a function that reweights cumulative probabilities (in rank order) such that the weight for an outcome depends on its rank and the probability above/below it.
     - The identity reweighting recovers expected utility.

   This third component is known as a "probability weighting function" in prospect theory (Tversky & Kahneman) and rank-dependent utility theory (Quiggin). It distorts the cumulative distribution function (CDF) or the decumulative distribution function (DDF). 

   In our context (risk-sensitive and distributional RL):
     - We have policies, return distributions (the distribution of the cumulative reward under a policy), and risk measures.
     - Risk measures can be quantile-based (like VaR, CVaR) or spectral (using a spectral risk measure, which is a weighted average of quantiles).

   The reweighting of cumulative probabilities in the original corresponds to a distortion of the cumulative distribution of the return. Specifically, we can model this with a distortion risk measure.

   Definitions:
     - Let Z be a random variable representing the return (cumulative reward) under a policy.
     - The cumulative distribution function (CDF) is F_Z(z) = P(Z <= z).
     - A distortion function is a non-decreasing function g: [0,1] -> [0,1] with g(0)=0 and g(1)=1.
     - The distorted expectation of Z is: ∫ g(1 - F_Z(z)) dz  [if Z is positive?] or more generally expressed via quantiles.

   Alternatively, using the quantile function (inverse CDF) F_Z^{-1}(p) for p in [0,1]:
     - The spectral risk measure is: ∫_0^1 F_Z^{-1}(p) φ(p) dp, where φ is a weighting function (non-negative, increasing, and integrates to 1). 
     - However, note that in rank-dependent utility, the distortion is applied to the cumulative probabilities. In the case of a loss (if we consider losses) it might be applied to the CDF, but for gains it is applied to the decumulative (survival) function.

