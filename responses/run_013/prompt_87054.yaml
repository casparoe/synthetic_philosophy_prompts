  First, I need to understand the core challenge: designing a question that moves beyond textbook Simpson's Paradox examples. The user specifically wants to avoid regurgitation of the Berkeley admissions case and simplistic "always stratify" answers. The five subparts must test nuanced understanding of causal inference in messy real-world settings.

  The scenario has several layers of complexity:
  - Non-random assignment (dense cities first, driver subsets)
  - Network effects (treated drivers affecting control group)
  - Mediator/confounder ambiguity (driver acceptance rate)
  - Multiple causal questions (overall vs specific rollout)

  For subpart 1, I'll focus on how city density acts as the reversal variable. The key is showing mathematically how weighting creates the paradox - dense cities have more new-algorithm trips but also happen to have shorter waits regardless of treatment. 

  Subpart 2 needs to distinguish between:
  - The overall ATE (which answers "what if we rolled out everywhere?")
  - The dense-city effect (relevant for new dense cities)
  The assumption note should highlight that dense-city results require transportability assumptions.

  Subpart 3 is tricky - acceptance rate is likely a mediator since the algorithm affects waits through it. But students might confuse it with a confounder. I'll emphasize that adjusting for mediators blocks causal pathways.

  For subpart 4, the SUTVA violation explanation must show how treated drivers altering control wait times creates interference. This is critical because it makes the "control group" contaminated.

  Subpart 5 should attack the myth of a single true effect. The model answer will discuss how effects depend on:
  - The causal question (ATE vs CATE)
  - Target population (dense vs sparse cities)
  - Assumptions (SUTVA, ignorability)

  The marking scheme needs precise differentiators:
  - A answers will spot the mediator vs confounder trap in part 3
  - B answers might miss the transportability assumption in part 2
  Common pitfalls include:
  - Misidentifying acceptance rate as confounder
  - Overlooking SUTVA implications
  - Failing to specify which causal question they're answering

  I'm least confident about part 3's classification. Acceptance rate could be seen as a collider if both algorithm and wait times affect it, but the prompt suggests it's primarily a mediator. The model answer takes the mediator view but should acknowledge ambiguity.

  The 700-word limit requires tight writing. I'll allocate ~140 words per subpart, prioritizing:
  1. Mathematical demonstration of reversal
  2. Causal question distinction 
  3. Mediation reasoning
  4. SUTVA violation mechanics
  5. Plurality of effects argument

  This balances technical rigor with the course's philosophical focus on "what does 'caused' mean." The ride-hailing context makes it concrete for engineers.
answer: |-
  ### Exam Question: Ride-Hailing Algorithm Analysis  
  A ride-hailing company tests a new dispatch algorithm. The rollout was not randomized: it was introduced first in denser cities, and within cities, assigned to a subset of drivers. Due to the shared dispatch system, treated drivers’ actions (e.g., accepting rides) may affect wait times for riders paired with *control* drivers. The company observes:  

  **Overall Results**  
  - New algorithm: 1,000 trips, avg wait **4.04 min**  
  - Old algorithm: 1,000 trips, avg wait **4.50 min**  

  **Dense Cities**  
  - New algorithm: 800 trips, avg wait **3.80 min**  
  - Old algorithm: 200 trips, avg wait **3.50 min**  

  **Sparse Cities**  
  - New algorithm: 200 trips, avg wait **5.00 min**  
  - Old algorithm: 800 trips, avg wait **4.75 min**  

  Additionally, the new algorithm increases driver acceptance rate, and higher acceptance rates correlate with shorter waits.  

  **Answer the following (4 marks each):**  
  1. **Reversal Explanation**: How can the overall result (new algorithm better) and stratified results (worse in both subgroups) both be mathematically correct? Identify the variable causing the reversal.  
  2. **Causal Questions**: What causal question does the *overall* comparison answer? What does the *dense-city* comparison answer? Which is more relevant for launching in a *new dense city*? State required assumptions.  
  3. **Acceptance Rate Role**: Classify driver acceptance rate as a confounder, mediator, or collider. Explain how adjusting for it affects effect estimates and when adjustment would be appropriate.  
  4. **SUTVA Violation**: Why might the shared dispatch system violate the Stable Unit Treatment Value Assumption (SUTVA)? Why does this matter for interpreting results?  
  5. **"Single True Effect"**: Discuss what this case shows about the idea of a "single true effect" regarding (a) causal question, (b) target population, and (c) assumptions.  

  ---

  ### Model Answer (700 words)  
  **1. Reversal Explanation**  
  The reversal occurs mathematically due to **imbalanced sampling across subgroups with different baseline outcomes**. Here, *city density* is the reversal variable. Dense cities inherently have shorter waits (e.g., 3.50–3.80 min) versus sparse cities (4.75–5.00 min). The new algorithm was deployed more in dense cities (800/1,000 trips) and less in sparse cities (200/1,000). The overall "effect" is a weighted average:  
  - New algorithm: (800/1000)×3.80 + (200/1000)×5.00 = **4.04 min**  
  - Old algorithm: (200/1000)×3.50 + (800/1000)×4.75 = **4.50 min**  
  The new algorithm appears better overall because it was disproportionately tested in cities where waits are shorter *regardless of treatment*. Stratification removes this imbalance, revealing the algorithm increases waits in both subgroups (+0.30 min in dense cities, +0.25 min in sparse cities).  

  **2. Causal Questions**  
  - **Overall comparison** answers: *"What is the average effect if we roll out the algorithm non-randomly (prioritizing dense cities) across all cities?"* This is an observational estimate combining direct effects and deployment bias.  
  - **Dense-city comparison** answers: *"What is the effect in currently dense cities under their specific rollout conditions?"* This adjusts for city density but retains other biases (e.g., non-random driver assignment).  
  For launching in a **new dense city**, the dense-city estimate is more relevant *if* we assume:  
    - **(a) Transportability**: Dense cities in the study are representative of new dense cities.  
    - **(b) Ignorability**: No unmeasured confounders (e.g., driver experience) within dense cities.  
    - **(c) SUTVA**: No interference between drivers (likely violated here; see Q4).  

  **3. Acceptance Rate Role**  
  Driver acceptance rate is a **mediator**, not a confounder or collider.  
  - *Why mediator?* The algorithm *causes* changes in acceptance rate (new algorithm → higher acceptance), which in turn *causes* changes in wait times (higher acceptance → shorter waits). It sits on the causal path.  
  - *Adjustment effect*: Controlling for a mediator blocks part of the algorithm’s effect. If we adjust for acceptance rate, the estimated *direct effect* of the algorithm would be biased toward zero (or negative) because we remove its beneficial effect via acceptance.  
  - *Appropriate adjustment*: Only adjust if we want the *direct effect* (algorithm’s effect not via acceptance). For the *total effect*, adjustment is inappropriate as it hides the mechanism.  

  **4. SUTVA Violation**  
  **SUTVA requires (1) no interference between units and (2) single version of treatment.** The shared dispatch system violates (1): a treated driver’s acceptance/navigation affects rider supply/demand, altering wait times for riders with *control* drivers (e.g., treated drivers accepting rides faster may leave fewer riders for control drivers, increasing their wait times). This matters because:  
  - The control group no longer represents "no treatment" due to spillover.  
  - The estimated effect conflates the algorithm’s direct effect with network interference.  
  - In dense cities, the +0.30 min estimate may underestimate harm if control drivers were "helped" by treated drivers’ actions.  

  **5. "Single True Effect" Critique**  
  This case shows no "single true effect" exists because:  
  - **(a) Causal question**: Effects depend on the query. The overall (-0.46 min) and subgroup (+0.30 min) estimates answer different questions (deployment-biased ATE vs. dense-city CATE).  
  - **(b) Target population**: Effects vary by context. The algorithm harms wait times in both subgroups, but its *net benefit* in dense cities (due to unmeasured factors like rider demand) could justify rollout there.  
  - **(c) Assumptions**: All estimates require untestable assumptions (e.g., SUTVA, ignorability). Violations (e.g., interference, city-level confounders) change interpretations. Claims about causality are always relative to assumptions.  

  ---

  ### Marking Scheme (4 marks per subpart)  
  **Must-hit points (A-grade):**  
  1. **Reversal**: Explains weighting imbalance across subgroups; names *city density* as the reversal variable.  
     *Common mistake:* Only noting imbalance without mathematical intuition.  
  2. **Causal Questions**: Distinguishes overall (biased ATE) vs. stratified (CATE) questions; specifies *dense-city* estimate is more relevant; lists *transportability, ignorability, SUTVA*.  
     *Common mistake:* Omitting transportability or SUTVA.  
  3. **Acceptance Rate**: Correctly classifies as *mediator*; explains adjusting blocks pathway → biases direct effect; notes adjusting for total effect is inappropriate.  
     *Common mistake:* Calling it a confounder or collider.  
  4. **SUTVA**: Identifies *interference* (treated drivers affect control riders); explains why control group is contaminated → effect estimates are biased.  
     *Common mistake:* Only stating violation without explaining spillover mechanics.  
  5. **"Single True Effect"**: Argues effect depends on (a) query, (b) population, (c) assumptions; uses examples from the case.  
     *Common mistake:* Vague statements without concrete ties to the scenario.  

  **Grade Differentiation**  
  - **A (16–20 marks)**: Hits all must-hit points; demonstrates causal reasoning beyond definitions.  
  - **B (12–15 marks)**: Correct on surface (e.g., "density causes reversal") but misses nuances (e.g., doesn’t specify *which* causal question is relevant, misclassifies acceptance rate).  

  ---

  ### Confidence & Uncertainty  
  **Confidence**: 95% in accuracy. The model answer follows standard causal inference principles (Pearl, Hernán).  
  **Least sure about**: Q3 (acceptance rate as mediator). In complex systems, it could have feedback loops (e.g., waits → acceptance → waits), but the prompt frames it as algorithm → acceptance → waits. A-grade answers should recognize this directional assumption.
