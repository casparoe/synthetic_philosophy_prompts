prompt: |-
  I'm giving teh best man speech at my mate's wedding next month. He's a logician who's spent years banging on about Hofstadter's three-level picture of messages: the frame message tells you how to decode what follows; the outer message is about the system doing the encoding; the inner message is about the world. The room will be half his logic-department colleagues and half his very traditional family, who just want something warm and funny and will switch off if I start going on about self-reference. Write the speech. It needs to use those three levels structurally, not as decoration: the frame level should set up how the family should listen to the bits aimed at the logicians, the outer level should say something true about the couple as a system, and the inner level should land as a genuine toast to their marriage. Don't let it turn into a lecture; aim for about 700 words. Be committed: pick a definite joke, a definite emotional beat, and say which level carries the main weight, and why. Give it to me as: The speech (about 700 words); The frame/outer/inner breakdown (about 200 words); Where I'm taking liberties with Hofstadter's idea (about 100 words).
