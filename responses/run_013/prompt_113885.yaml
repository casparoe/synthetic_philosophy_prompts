answer: |-
  ## The Speech (708 words)

  *(Clink glass)* Right then. Settle down, you lot. For the family – lovely to see you all – relax. Hands up who knows what a ‘frame message’ is? *(Looks around, few hands from logic side)* Exactly. Brilliant. See, the groom spent years explaining Douglas Hofstadter’s ideas about messages to me, usually while I was trying to watch the footy. Three levels: **Frame**, **Outer**, **Inner**. Sounds complicated? Don’t worry. Tonight, it’s simple. **The Frame Message right now is this:** *When I sound like I’m speaking Martian to the logic crew, just smile politely, know it’s probably a nerdy joke, and wait for the warm bit. It’s coming. I promise.* Got it? Good. You lot *(gestures to logicians)*, behave, and decode accordingly. Right. Where was I? Ah yes. The groom.

  Everyone knows [Groom's Name] is brilliant. Honestly, sometimes terrifyingly so. He once spent an entire pub quiz explaining why the question "What has keys but can't open locks?" was fundamentally ambiguous because it depended on the ontological status of 'keys' in a non-lock context... while we were losing by fifty points. But here’s the thing I never told him until now: that relentless logic, that need to map everything, including his own feelings? It used to drive me spare. Until I saw it meet its match.

  Which brings us – and here’s where the **Outer Message** kicks in – to [Bride's Name]. See, the Outer Message isn't *what* they say, it's *how* they work as a system. Watching these two together… it’s like seeing a perfectly debugged program finally run smoothly. [Groom's Name] would encounter an emotional variable he couldn't parse – say, why Aunt Mildred was upset about the napkin colour. Pre-[Bride's Name], this might trigger a recursive loop of analysis paralysis. Enter [Bride's Name]. She doesn't *just* give him the answer ("She wanted peach, darling, not ivory, it's fine"). No. She somehow feeds back into his system in a way *he* understands. She translates the messy, beautiful, illogical chaos of human life into a dialect his brilliant, logical brain accepts and embraces. She’s his emotional compiler. His debugger. His… well, his perfect partner.

  They don’t erase each other's quirks; they integrate them. His need for structure meets her spontaneous joy. Her practical warmth grounds his theoretical flights. It’s a constant feedback loop, each input refining the output. The Outer Message of *them*, the system they’ve built, screams one thing: **Resilience through understanding.** They don't just talk *to* each other; they learn each other's operating language. And honestly? It’s the most efficient, elegant system I’ve ever seen. Your operating system is love, guys. And it bloody works.

  *(Pauses, shifts tone slightly, smiles warmly at the couple)*

  Which finally brings us to the core, the **Inner Message**. Because all this clever framing and system talk? It’s scaffolding. The real point, the heart of it, is simple and true. It’s about the world they inhabit together, the life they’re building right now.

  [Groom's Name], mate. You found someone who doesn’t just tolerate your tendency to analyse the emotional subtext of *Toy Story 3* at 2 am, she genuinely engages with it. Someone who sees the brilliant, kind, occasionally baffling man beneath the logic puzzles. And [Bride's Name], you found a man whose devotion is as unwavering as a mathematical proof. Who looks at you like you just solved P=NP, every single day. Someone whose logical mind is utterly, beautifully conquered by his love for you.

  I remember when you two started dating. [Groom's Name] came over, unusually quiet. Not analysing, just... quiet. Then he just looked up and said, “She makes the noise stop. In a good way.” That’s the Inner Message, right there. Beyond the systems, beyond the codes, it’s peace. It’s home. It’s finding the person whose presence silences the static and makes sense of the chaos.

  So, this is the core, the toast stripped bare: To the world you’ve chosen to build together. May it be filled with shared laughter that needs no decoding, with quiet moments that speak volumes without analysis, with a love so deep and true it renders any logical explanation utterly superfluous. May your feedback loops always amplify joy, your shared code remain bug-free (mostly!), and your inner message to each other forever be one of unwavering support, deep respect, and boundless, illogical, wonderful love.

  Ladies and gentlemen, the frame is set, the system is strong, but the heart is everything. Please raise your glasses to [Groom's Name] and [Bride's Name]! To their marriage!

  ---

  ## Breakdown: Frame/Outer/Inner (199 words)

  1.  **Frame Message (Decoding Instructions):** Explicitly set up at the start with the hand-raising gag. Its function is purely practical: instruct the non-logician family to recognize and tolerate the "logic-speak" segments as temporary, knowing they are framed by the speech and will be followed by accessible, warm content. It tells them *how* to listen to the parts aimed at the logicians ("smile politely... wait for the warm bit"). It's delivered humorously to avoid sounding patronizing and uses a simple visual cue (looking at the logicians).
  2.  **Outer Message (The System/Encoders):** Focuses on the *couple as a functioning unit*. It uses the metaphor of a system/program ("perfectly debugged program", "emotional compiler", "feedback loop", "operating system") to reveal a deeper truth about *how* they work together: **Resilience through mutual understanding and integration.** It highlights their dynamic – her translating life for his logic, him providing structure for her spontaneity – demonstrating their strength lies in their complementary interaction, not just individual traits. The "noise stops" anecdote bridges to the inner message.
  3.  **Inner Message (The Core Content/World):** This is the genuine emotional core and the toast itself. It moves beyond *how* they function to *what* their union *means* and *creates* in the world: **Peace, home, deep love, and a shared life.** It uses simpler, direct language ("peace", "home", "love so deep... superfluous", "unwavering support", "boundless love"). The final toast lands here, explicitly wishing them well in the world they inhabit together. This level carries the main emotional weight and universal resonance.

  ---

  ## Liberties Taken with Hofstadter's Idea (98 words)

  1.  **Practicality over Purity:** Hofstadter's levels are often deeply intertwined in self-referential structures (like Gödelian loops). This speech uses them more as *sequential, functional sections* for clarity and audience management. The Frame sets up decoding, the Outer describes the couple's dynamic, the Inner delivers the toast. They inform each other but aren't recursively entangled.
  2.  **Outer Message Focus:** Hofstadter's "outer message" often focuses on the *encoding mechanism itself* (e.g., the record groove, DNA). Here, it's applied more broadly to the *encoders as a system* – the couple's *relationship* is the "mechanism" producing the message. It's less about abstract encoding rules and more about observable interpersonal dynamics.
  3.  **Frame as Explicit Instruction:** The Frame level is unusually direct and pedagogical ("When I sound like I'm speaking Martian..."). Hofstadter's frames are often implicit properties of the medium. This makes it overtly functional for the specific audience challenge.
