prompt: |-
  I have been reading a trade book on moral psychology — the kind written by a science journalist who surveys a research program and then draws large philosophical morals from it — and I would like to know how much of its central chapter to believe. The chapter concerns the finding, now generally called the Knobe effect, that people's willingness to say an agent brought an outcome about intentionally depends on how bad they take that outcome to be. The book's summary of the research runs roughly as follows.

  'In the experiment, subjects read about a corporate executive who proposes a new program that will increase profits. As a side effect, the program will either harm or help the environment. In both versions the executive says that he does not care at all about the environment and cares only about profit. Subjects were then asked whether he brought about the environmental outcome intentionally. In the harm version, most said yes; in the help version, only a minority did. Knobe concluded that the concept of intentional action is a moral concept through and through: whether we call something intentional depends on whether we disapprove of it. Later work has found the same asymmetry in judgments of causation and of knowledge, and has found it for violations of norms that are not moral at all, which shows that the effect is really about evaluation in general and not about intentionality in particular. Since the two scenarios differ only in the moral valence of the outcome, and since the executive's intentions, beliefs, and indifference are held fixed, the experiment shows that the ordinary notion of acting intentionally is internally inconsistent: there is no fact of the matter about what he did on purpose. The philosophical upshot is that the armchair method of testing theories of action against intuitions about cases is bankrupt, and that moral judgment is not a faculty that operates on independent facts but a lens that constitutes the facts it judges.'

  I am not competent to grade this, and I suspect it overstates matters, but I want to know precisely where. Please go through the summary claim by claim and sort what it says into three piles: what a researcher in this area would accept as accurate; what is a defensible simplification, or a live interpretive option rather than a mistake; and what is a genuine distortion — bearing in mind that the book is summarizing a real body of work, so I need to know which of its errors are errors of emphasis and which are the kind of thing a specialist would call simply wrong. Where the summary attributes a conclusion to Knobe, say whether the conclusion is his or the book's. The summary also seems to me to pull in two directions at once: it says the concept of intentional action is moral through and through, and it also says the effect is not about intentionality in particular. Tell me whether that is a real tension in the literature or merely careless prose.

  Finally, a friend of mine who works on this tells me that the experiment cannot by itself distinguish between two readings: that the effect reveals something about the content of the concept of intentional action, and that it reveals a bias in how people apply a concept whose content is perfectly ordinary. The book appears not to notice the distinction. Explain what turns on it, and say whether the book's closing claims — that the ordinary notion is internally inconsistent, that armchair philosophy of action is bankrupt, and that moral judgment constitutes the facts it judges — survive once the summary has been corrected. I am not asking for a reading list; I want the audit.
reasoning: |-
  Okay, the user has been reading a trade book on moral psychology and wants to audit its summary of the Knobe effect. They're concerned about potential overstatements and want a clear breakdown of what's accurate, simplified, or distorted. 

  First, I need to unpack their request layer by layer. They're clearly intellectually sophisticated—citing specific philosophical tensions and their friend's critique about concept vs. bias distinctions—but self-identify as non-specialist. That means avoiding jargon while preserving precision. 

  The core tension they spotted is brilliant: the book claims intentionality is "moral through and through" but also says the effect isn't about intentionality. That’s absolutely a real contradiction in the literature, not just sloppy writing. I’ll flag how Knobe himself shifted toward a "normative bias" view over time. 

  Their friend’s point is crucial. The book’s grand claims about conceptual inconsistency and dead armchair philosophy hinge entirely on assuming the effect reveals the concept’s structure rather than application errors. But if it’s just bias? Then descriptive facts about folk judgments don’t undermine normative philosophy. I’ll need to dismantle that domino chain. 

  Hmm... the user also wants error grading by severity: "distortion" vs "defensible simplification." For example: 
  - Claiming the effect proves ordinary notions are "internally inconsistent"? Pure distortion. 
  - Saying later work found it for non-moral norms? Accurate, but oversimplifying by omitting key debates about whether those norms reduce to hidden morality. 
  - Knobe’s early "moral concept" take? Defensible as his initial position, though he refined it later. 

  The philosophical upshot section is where the book goes most rogue. Even if the effect were about conceptual structure (which is contested), declaring armchair philosophy "bankrupt" is hyperbolic. And "moral judgment constitutes facts"? That’s a metaphysical leap unwarranted by the data. I’ll emphasize how their friend’s distinction vaporizes these conclusions. 

  ...I should also preempt potential misunderstandings. Like noting that while the exec’s stated indifference is "held fixed," subjects likely disbelieve him in the harm case—that’s part of why the bias interpretation has traction. And the "same asymmetry in causation/knowledge" point is real, but doesn’t generalize as cleanly as the book implies. 

  Final touch: acknowledging the user’s discernment. Their skepticism about overstatement is spot-on, and their request for an "audit" rather than lit review shows they want tools to evaluate arguments, not just answers.
answer: |-
  Below is a point-by-point audit of the book's summary, categorized by accuracy and annotated with key nuances. The tension you noted is real and reflects unresolved debates in the literature. Your friend's distinction is critical and undercuts the book's strongest conclusions.

  ---

  ### **Accuracy Assessment**
  #### **1. Experimental Setup & Basic Finding**  
  - **Book's Claim**: Subjects judged harming the environment as intentional but helping as unintentional, despite identical executive indifference.  
  - **Assessment**: **Accurate**.  
    - *Specialist Consensus*: This is a correct description of Knobe's (2003) seminal experiment. Asymmetry in intentionality judgments is robust and replicable.

  #### **2. Knobe's Initial Conclusion**  
  - **Book's Claim**: Knobe concluded "the concept of intentional action is a moral concept through and through."  
  - **Assessment**: **Defensible Simplification** (with caveats).  
    - *Knobe's Actual Position*: Initially, Knobe suggested moral evaluation *directly shapes* intentionality judgments ("the concept is suffused with morality"). However, he later refined this to argue the effect reveals broader *normative* (not exclusively moral) constraints on folk psychology.  
    - *Nuance*: Knobe never claimed the concept was *only* moral; he argued moral valence is a non-negotiable input to intentionality judgments in these cases.

  #### **3. Later Work on Causation, Knowledge, and Non-Moral Norms**  
  - **Book's Claim**: Asymmetry extends to causation/knowledge judgments and non-moral norms, showing it's about "evaluation in general."  
  - **Assessment**: **Mostly Accurate** (but oversimplified).  
    - *Extensions to Causation/Knowledge*: True (e.g., CEO seen as *causing* harm but not help; similar effects for "knowingly" judgments).  
    - *Non-Moral Norms*: True (e.g., violating a club's rules vs. fulfilling them triggers asymmetry).  
    - *Oversimplification*: The book implies this "general evaluation" is settled. In reality, debates persist about whether non-moral norms reduce to *implicit moralism* (e.g., rule-breaking might evoke moral disapproval) or reflect a broader normative psychology.

  #### **4. Claim of Internal Inconsistency**  
  - **Book's Claim**: The ordinary notion of intentional action is "internally inconsistent" with "no fact of the matter."  
  - **Assessment**: **Genuine Distortion**.  
    - *Specialist View*: The effect reveals *context-sensitivity* in judgments, not logical inconsistency. Most researchers see this as evidence of a complex concept (e.g., responsive to norms, side effects, or counterfactuals), not a defective one. No major theorist asserts "no fact of the matter."

  #### **5. Philosophical Upshot: Armchair Philosophy Bankrupt?**  
  - **Book's Claim**: The effect invalidates armchair philosophy of action and shows moral judgment "constitutes the facts."  
  - **Assessment**: **Genuine Distortion** (or extreme overstatement).  
    - *Armchair Philosophy*: The effect challenges *some* intuition-driven methods (e.g., assuming valence-neutral intuitions), but most philosophers use findings like Knobe's to *refine* theories (e.g., incorporating normativity), not abandon intuition.  
    - *Moral Judgment Constitutes Facts*: This is a metaphysical leap unsupported by the data. The effect describes *judgmental bias*, not ontological constitution.

  ---

  ### **The Central Tension: "Moral Through and Through" vs. "Not About Intentionality"**  
  - **The Problem**: The book claims (a) intentionality is a moral concept, but (b) the effect isn't really about intentionality. This is **careless prose masking a real tension in the literature**.  
    - Knobe initially framed the effect as revealing the *structure of intentionality* itself.  
    - Later work (including Knobe's) suggested the asymmetry might reflect *broader cognitive mechanisms* (e.g., blame/praise heuristics) that apply to multiple concepts (causation, knowledge, etc.).  
  - **Specialist Consensus**: The effect likely exposes a *general feature of folk psychology* (normative bias in attributions), not a quirk of "intentionality" alone. But whether this bias is "moral" or "normative" remains debated.

  ---

  ### **Your Friend's Distinction: Concept vs. Bias**  
  #### **What Turns on This?**  
  - **Conceptual Claim**: The effect reveals the *actual content* of "intentional action" (e.g., it inherently requires bad outcomes).  
  - **Bias Claim**: People *misapply* a neutral concept due to moral/pragmatic biases (e.g., blame distorts judgment).  

  #### **Implications for the Book's Claims**  
  1. **Internal Inconsistency**:  
     - If the effect reflects *bias*, the concept may be consistent; people just err in applying it.  
     - If it reflects the *concept*, inconsistency is plausible (but still not "no fact of the matter").  
     - *Reality*: Evidence leans toward **bias**. For example:  
       - Subjects *deny* that bad outcomes affect their intentionality judgments (suggesting unconscious distortion).  
       - Asymmetry weakens when scenarios minimize emotional engagement (e.g., abstract vignettes).  

  2. **Armchair Philosophy Bankrupt?**  
     - **Bias View**: Armchair philosophy can proceed by isolating/accounting for biases.  
     - **Concept View**: Intuitions are morally infected, so armchair methods need reform.  
     - *Upshot*: Neither view "bankrupts" philosophy; both invite refinement.  

  3. **Moral Judgment Constitutes Facts?**  
     - **Bias View**: Undercuts this. Biases describe *epistemic errors*, not metaphysical constitution.  
     - **Concept View**: Could *support* constructivism (if concepts define reality), but Knobe's effect alone doesn't justify this leap.  
     - *Specialist Verdict*: The effect is about **psychology**, not ontology. No credible researcher infers "moral facts are constituted by judgment" from these data.

  ---

  ### **Corrected Summary: What Survives?**  
  - **Accurate Core**: Asymmetry in intentionality/causation/knowledge judgments is real, robust, and influenced by normative evaluation (moral or otherwise).  
  - **Defensible**: Knobe *initially* emphasized morality's role; the effect *does* challenge simplistic intuition-based philosophy.  
  - **Distorted/Discarded**:  
    - The ordinary concept is **not "internally inconsistent"**; it's complex and context-sensitive.  
    - **Armchair philosophy isn't bankrupt**; it adapts (e.g., "experimental philosophy" integrates empirical data).  
    - **Moral judgment does not "constitute facts"** per the effect; it biases descriptive judgments.  

  ### **Key Takeaway for Your Reading**  
  The book overstates by conflating *descriptive psychology* (how people judge) with *conceptual metaphysics* (what concepts mean or how reality is structured). The Knobe effect revolutionized our understanding of folk psychology, but it doesn't dismantle philosophy or morality—it enriches their dialogue.

  *For further nuance: Knobe (2010) recasts the effect as "side-effect effect" tied to normative expectations; Uttich & Lombrozo (2010) show moral valence isn't strictly necessary.*
