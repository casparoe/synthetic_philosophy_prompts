  - **Her Likely Rule (Rejection of Historical Imponderable Fluids)**: Predicts **anti-realism**. The substrate field is explicitly compared to "imponderable fluids" like the luminiferous aether, and its continuous, unmanipulable nature fits the discredited category.  
