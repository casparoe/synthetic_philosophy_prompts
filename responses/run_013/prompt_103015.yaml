  The primary rule fitting her track record is:

  - **Rule: Rejection of Historical Imponderable Fluids and Analogues**  
    She is anti-realist about entities that resemble historical "imponderable fluids" (continuous, unmanipulable, all-pervading media used to explain phenomena) or their modern analogues, as these have a track record of being discarded. She is realist about entities that are discrete, particle-like, or have been robustly detected without fitting this problematic category.  
