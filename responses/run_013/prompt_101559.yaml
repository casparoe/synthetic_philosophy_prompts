  I'm working through Adam Smith's Wealth of Nations and got stuck on this bit from the section on the expenses of the empire: "The rulers of Great Britain have, for more than a century past, amused the people with the imagination that they possessed a great empire on the west side of the Atlantic. This empire, however, has hitherto existed in imagination only." I think I get the sarcasm, but I can't tell what he's actually claiming. Is the "imagination" line a literal denial that the colonies amount to an empire at all, or a narrower economic point — that the empire is real enough for the merchants and manufacturers who profit from it but a phantom for everyone else who foots the bill? And how does that square with the fact that just a bit later he sketches a plan to tax the colonies and give them representation in Parliament? Help me untangle what he means and what the main upshots are for his overall view of empire.
