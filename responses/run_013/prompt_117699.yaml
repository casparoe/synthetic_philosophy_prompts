prompt: |-
  I am a philosophy professor whose teaching is split between a graduate seminar in the epistemology of testimony and a methods course for students who arrive from statistics and machine learning. Every year I watch the same translation failure: my students treat the reductionism/anti-reductionism debate as though it were a disagreement about how much weight to assign to a noisy channel, and while that gets them part of the way, it also makes the remaining disagreement look either trivial or confused. I would like you to perform the translation systematically and then give me the residue report. The target vocabulary is the one my methods students actually use: priors and likelihoods, conditionally independent sources, hierarchical models with speaker-level random effects, calibration, provenance and provenance laundering, sensor fusion, adversarial and correlated error, robustness to model misspecification, and the distinction between a default setting and an update rule. Assume I am fluent in that vocabulary and do not need it explained to me; assume also that I know the philosophical literature well enough that you need not rehearse the standard positions from scratch. Restate the reductionist position, the anti-reductionist position, and at least one intermediate position—for example, a local reductionism, a default-entitlement view, or a view that distinguishes the transmission of knowledge from the transmission of mere justification—as faithfully as you can in those terms. For each, say what maps cleanly, what maps only with distortion, and what has no counterpart at all. For instance: is the anti-reductionist appeal to a default entitlement captured by a prior, by a policy for setting priors, or by neither? Is the reductionist demand for independent corroboration the same as a demand for conditional-independence assumptions? And does the distinction between testimonial justification and testimonial knowledge survive at all once testimony is modeled as an observation?

  Then give me the residue report proper. Tell me which parts of the debate are artifacts of the probabilistic vocabulary, which are genuine features of the epistemology that the vocabulary cannot express, and which are places where the philosophical dispute was less substantive than its participants thought. I am especially interested in whether the target vocabulary has any way to represent the second-personal or normative dimension of testimony—the idea that a speaker offers me her word and that I may owe her a certain kind of uptake or trust—or whether that necessarily drops out as an unmodeled residual. Conclude with a judgment: is the residue a defect of the target framework, a defect of the original debate, or a bit of both? Please write in American English, and do not give me a reading list or citations; I want the translation and the residue analysis, not a bibliography.
reasoning: |-
  Okay, the user is a philosophy professor teaching epistemology of testimony to students from stats and ML backgrounds. They notice students reducing the reductionism/anti-reductionism debate to weighting noisy channels, which misses key philosophical nuances. The request is to systematically translate philosophical positions into ML/stats vocabulary and identify what gets lost in translation.

  First, I need to map core positions accurately. The reductionist view requires assessing speaker reliability before accepting testimony - that's priors and likelihoods. Anti-reductionism's "default entitlement" feels like a policy for setting priors (flat/uniform) rather than the prior itself. Intermediate positions like local reductionism map well to hierarchical models with speaker-level random effects.

  Noticing friction points already: The normative "I owe you uptake" aspect has no counterpart in probabilistic models. Sensor fusion captures corroboration but misses how testimonial justification uniquely depends on speaker competence. Transmission of knowledge vs justification collapses when testimony becomes mere data input.

  For the residue report, several things emerge: First, the vocabulary naturally quantifies reliability but can't express why testimony deserves special default trust compared to instruments. Second, the framework handles individual speaker calibration but not the communal aspects of knowledge networks. Most importantly, the second-personal dimension ("I promise this is true") vanishes entirely - the model sees claims, not commitments.

  The judgment call is tricky. Some residue reveals limitations in modeling social epistemology through probability alone. But some philosophical distinctions (like knowledge vs justification in testimony) might be overengineered - the model shows they don't affect belief updating mechanics. Ultimately, both frameworks have blind spots: probability can't capture testimony's interpersonal nature, while philosophy sometimes creates distinctions without operational differences.

  The professor will appreciate seeing exactly where the translation fails and why, especially that missing normative layer. They can then decide whether to treat it as a modeling limitation to work around or a crucial feature requiring supplementary teaching.
answer: |-
  Here's the systematic translation and residue analysis, targeting your specified vocabulary:

  ### Core Positions Translated
  **Anti-Reductionism (e.g., Coady, Burge)**  
  - **Translation:** A policy for setting priors. Treat testimony as a conditionally independent source with a default prior reliability significantly >0.5 for all speakers absent defeaters ("default entitlement"). Modeled as:  
    `P(speaker_accurate | testimony) = high_initial_prior`  
    Update via Bayes only upon receipt of positive defeaters (contradictory evidence, incoherence).  
  - **Clean Map:** Default entitlement → Prior-setting policy. Defeaters → Bayesian updates.  
  - **Distorted Map:** "Presumptive right" becomes a prior probability, losing its normative/rights-based dimension. The "default" is policy-based, not a fixed prior (which would vary by speaker).  
  - **No Counterpart:** The *reason* for the default policy (e.g., "testimony as a basic source") – this is a meta-justification, not modeled in the system itself.  

  **Global Reductionism (e.g., Hume, Fricker)**  
  - **Translation:** Priors must be set via non-testimonial calibration. Testimony is a sensor with unknown reliability; require provenance chains. Model:  
    `P(testimony_accurate) = f(calibration_data, speaker_provenance)`  
    Independent corroboration demanded to estimate likelihoods.  
  - **Clean Map:** Reductionist demand → Necessity of calibration data. Independent corroboration ≈ Conditional independence assumptions for sensor fusion.  
  - **Distorted Map:** "Independent grounds" often implies causal independence, but probabilistic models only require *conditional* independence given the truth. The demand is stricter philosophically.  
  - **No Counterpart:** The insistence that testimony *cannot* justify without prior calibration – this is a constraint on prior-setting, not a parameter in the model.  

  **Local Reductionism (e.g., Faulkner, Lackey)**  
  - **Translation:** Hierarchical Bayesian model with speaker-level random effects. Default priors are set at the *speaker-class* level (e.g., "fellow scientists"), but require per-speaker calibration updates. Provenance laundering detection = adversarial error modeling.  
    `Prior ~ Speaker_Class_Distribution + Individual_Calibration_History`  
  - **Clean Map:** Speaker-type defaults → Hierarchical priors. Contextual defeaters → Model misspecification checks.  
  - **Distorted Map:** "Relationship-based trust" is flattened to a covariate in the hierarchical model.  
  - **No Counterpart:** The normative weight of interpersonal relationships – modeled as a reliability covariate, not an obligation.  

  ### Key Distinction: Transmission of Knowledge vs. Justification  
  - **Translation Attempt:** Knowledge transmission ≈ Testimony as observation of a high-reliability source (low noise channel) meeting robustness thresholds. Justification ≈ Belief updating that increases posterior probability but may not meet knowledge thresholds (e.g., high variance estimates).  
  - **Residue:** Collapses. In the target vocabulary, both reduce to Bayesian belief updating. The distinction becomes purely about *posterior probability thresholds* and *error robustness*, losing the philosophical focus on the speaker's epistemic state/commitment as constitutive of knowledge transmission.  

  ---

  ### Residue Report  
  **Artifacts of Probabilistic Vocabulary:**  
  1. **"Trivialization" of Disagreement:** Debates about "how much prior to assign" appear as tuning parameters, masking normative disputes about default policies.  
  2. **Flattening of Defeaters:** All defeaters become Bayesian likelihood updates, obscuring distinctions between internal coherence checks, moral credibility, and external corroboration.  
  3. **Correlated Error:** Modeled as covariance terms, but philosophical work on systemic epistemic injustice lacks a natural analog.  

  **Genuine Epistemic Features Lost in Translation:**  
  1. **Second-Personal Normativity ("I offer you my word"):**  
     - *No counterpart* in the framework. The act of *asserting* (with its commitment to truth and accountability) is modeled as data emission. The normative claim "you owe me uptake" becomes an unexplained prior-setting policy.  
  2. **Provenance as Socially Embedded:** Provenance laundering is modeled as adversarial noise, but its social mechanisms (e.g., institutional trust cascades) lack representation.  
  3. **Testimonial Justification's Unique Structure:** The idea that testimony *itself* provides a distinct justificatory force (not reducible to sensor reliability) vanishes. It's all source calibration.  

  **Less Substantive Than Claimed:**  
  1. **Default-Entitlement vs. "Weak" Reductionism:** In practice, both use hierarchical priors – the dispute reduces to whether the top-level prior is "flat" (anti-reductionism) or requires empirical calibration (reductionism).  
  2. **Demand for "Independent" Corroboration:** Probabilistically, only conditional independence matters. Philosophical insistence on *causal* independence appears as an unnecessarily strong constraint.  

  ---

  ### Judgment on Residue  
  **Normative/Second-Personal Dimension:**  
  - **Defect of Framework:** The target vocabulary has no machinery for modeling interpersonal commitments or the speaker's act of *giving their word*. This is a fundamental limitation for capturing testimony's ethical-epistemic duality.  

  **Knowledge vs. Justification Distinction:**  
  - **Defect of Original Debate:** The distinction adds no actionable insight to belief updating mechanics in the model. It appears as a philosophical overlay without operational difference.  

  **Overall Residue:**  
  - **Bit of Both.** The framework fails to model testimony's irreducibly interpersonal normativity (framework defect). Simultaneously, parts of the philosophical debate (e.g., rigid global vs. local distinctions) are revealed as under-specified or entangled in terminology rather than substance (debate defect).  

  **Conclusion:** The target vocabulary excels at modeling testimony as *information flow* but cannot capture its role as *social practice*. The residue is richest where testimony intersects ethics – a blind spot for both probabilistic modeling and traditional epistemology's penchant for individualistic analyses.
