answer: |-
  Below is a detailed design for the in-class activity, structured to fit within a 90-minute graduate seminar. The activity uses the quadrant puzzle to illustrate how the same conditional sentence ("If you are in Red, you are in A") leads to divergent posteriors under four different spotter protocols. Students bet their credences using a quadratic scoring rule, revealing how their commitments shift as protocols change. The debrief maps these shifts to the core epistemological insight.

  ---

  ### **Activity Design: "The Spotter's Secret"**

  #### **Learning Goal**
  Students experience firsthand that updating on a conditional requires specifying the *likelihood function* (how the spotter selects messages), not just the sentence. The same sentence produces different posteriors under different protocols, challenging the assumption that conditionals have a unique update rule.

  #### **Materials**
  - **Quadrant Map**: Visual aid drawn on the board:
    ```
            | River A     | not-A (¬A)  |
    --------|-------------|-------------|
    **Red** | Red & A (RA)| Red & ¬A (R¬A)
    **Blue**| Blue & A (BA)| Blue & ¬A (B¬A)
    ```
    - Prior: Uniform (each quadrant 25% likely).  
  - **Random Quadrant Generator**: Four cards labeled RA, R¬A, BA, B¬A (for prior draws); or a digital RNG.  
  - **Betting Sheets**: Students submit credences (probabilities for RA, R¬A, BA, B¬A summing to 1).  
  - **Protocol Cards** (hidden until revelation):  
    - **Protocol 1**: "Spotter speaks ONLY if antecedent (Red) is TRUE."  
    - **Protocol 2**: "Spotter speaks ONLY if antecedent (Red) is FALSE."  
    - **Protocol 3**: "Spotter randomly picks ONE true conditional to say (from a pre-set list)."  
    - **Protocol 4**: "Spotter says this sentence with 50% probability IF it is true."  
  - **Scoring**: Quadratic scoring rule. For reported probabilities \( (p_{RA}, p_{R\neg A}, p_{BA}, p_{B\neg A}) \) and actual quadrant \( Q \):  
    \[
    \text{Score} = 2 \times p_Q - (p_{RA}^2 + p_{R\neg A}^2 + p_{BA}^2 + p_{B\neg A}^2)
    \]
    (Optimal when students report true credences; scores can be negative but sum over rounds incentivizes honesty.)

  ---

  ### **Timeline (90 Minutes Total)**

  #### **0–10 min: Setup & Rules (No Spoilers)**  
  - **0–3 min**: Introduce the territory:  
    > "You’re lost in a land split by a road (Red/Blue) and river (A/¬A). Four quadrants, each equally likely. A trusted spotter radios: *‘If you are in Red, you are in A.’*"  
    - Show quadrant map; emphasize uniform prior.  
  - **3–7 min**: Explain betting:  
    > "Each round, you’ll hear this sentence. Write your updated credences for each quadrant. We’ll reveal the *actual* quadrant and score you. Higher scores are better."  
    - Demo quadratic scoring: If true quadrant is RA, and you report (0.4, 0.1, 0.3, 0.2), score = \(2 \times 0.4 - (0.4^2 + 0.1^2 + 0.3^2 + 0.2^2) = 0.8 - 0.3 = 0.5\).  
  - **7–10 min**: Clarify without lecturing:  
    > "The spotter *always tells the truth*, but their *rule for speaking* changes each round. You won’t know the rule until after you bet."

  #### **10–70 min: Four Rounds (15 min each)**  
  *Same sentence each round; protocols revealed **after** betting.*  

  1. **Round 1: Protocol 1 (Prefers true antecedent)**  
     - **10–12 min**:  
       - Announce: "Spotter says: *‘If you are in Red, you are in A.’* Submit your credences."  
       - Students bet (e.g., many assign ~33% to RA/BA/B¬A; strike out R¬A).  
     - **12–15 min**:  
       - Reveal **Protocol 1**: "Spotter speaks **only if Red is true**."  
       - Explain: "If Red is true, the conditional requires you to be in A. So you must be in RA."  
       - **Posterior**: RA: 100% (others 0%).  
       - Reveal "actual quadrant": **RA** (sampled from posterior).  
       - Score bets.  

  2. **Round 2: Protocol 2 (Prefers false antecedent)**  
     - **25–27 min**: Same sentence; students bet (e.g., some revert to uniform or keep thirds).  
     - **27–30 min**:  
       - Reveal **Protocol 2**: "Spotter speaks **only if Red is false**."  
       - Explain: "If Red is false, the conditional is vacuously true. So you’re in Blue, but A/¬A is unknown."  
       - **Posterior**: BA: 50%, B¬A: 50% (RA/R¬A: 0%).  
       - Reveal "actual quadrant": **B¬A** (sampled from posterior).  
       - Score bets.  

  3. **Round 3: Protocol 3 (Chooses randomly among true conditionals)**  
     - **40–42 min**: Same sentence; students bet.  
     - **42–45 min**:  
       - Reveal **Protocol 3**: "Spotter randomly picks *one* true conditional to say. They consider:  
         - *‘If Red, then A’*  
         - *‘If Blue, then A’*  
         They choose uniformly from those true in your quadrant."  
       - Explain likelihoods:  
         - In RA: Both conditionals true → 50% chance to say "If Red..."  
         - In BA: Only "If Red..." true (vacuously) → 100% chance.  
         - In B¬A: Both true → 50% chance.  
         - In R¬A: Only "If Blue..." true → 0% chance.  
       - **Posterior**: RA: 25%, BA: 25%, B¬A: 50% (R¬A: 0%).  
       - Reveal "actual quadrant": **B¬A** (sampled: 25% RA, 25% BA, 50% B¬A).  
       - Score bets.  

  4. **Round 4: Protocol 4 (Fixed probability if true)**  
     - **55–57 min**: Same sentence; students bet (e.g., many assign ~33% to RA/BA/B¬A).  
     - **57–60 min**:  
       - Reveal **Protocol 4**: "Spotter says this sentence **with 50% probability if it is true**."  
       - Explain: "True in RA, BA, B¬A → each has 50% chance to trigger the message."  
       - **Posterior**: RA: 33.3%, BA: 33.3%, B¬A: 33.3% (R¬A: 0%).  
       - Reveal "actual quadrant": **BA** (sampled uniformly from RA/BA/B¬A).  
       - Score bets.  

  #### **70–90 min: Debrief & Epistemological Insight**  
  - **70–75 min**: Plot student bets on the board for each round. Highlight:  
    - Same sentence → different posteriors (show table below).  
    - Shifts in bets (e.g., in Round 1, many didn’t assign 100% to RA; in Round 3, few assigned 50% to B¬A).  
  - **75–85 min**: Connect to theory (first time using formal terms):  
    > "The sentence *underdetermines* the update. Why?  
    > - **Likelihoods matter**: The message is evidence *for different things* under different protocols.  
    >   - E.g., Protocol 1: Evidence *for Red being true*.  
    >   - Protocol 2: Evidence *for Blue being true*.  
    > - **Conditionals are asymmetric**: Vacuous truth (false antecedent) allows multiple interpretations.  
    > - **Standard update** (strike R¬A, rescale) only matches Protocol 4."  
  - **85–90 min**: Discuss why this is general:  
    > "Updating requires knowing *how the message was selected*. Without this, the conditional sentence doesn’t fix the likelihoods. This applies to any context where a speaker chooses what to assert from available truths."  

  ---

  ### **Posteriors Under Each Protocol**
  | Protocol                   | RA    | R¬A | BA    | B¬A   |  
  |----------------------------|-------|-----|-------|-------|  
  | 1: Prefers true antecedent | 100%  | 0%  | 0%    | 0%    |  
  | 2: Prefers false antecedent| 0%    | 0%  | 50%   | 50%   |  
  | 3: Random true conditional | 25%   | 0%  | 25%   | 50%   |  
  | 4: Fixed probability (50%) | 33.3% | 0%  | 33.3% | 33.3% |  

  ---

  ### **Predictable Challenges & Fixes**  
  1. **Challenge**: Students assume protocols are constant across rounds.  
     - **Fix**: Stress *before each round*: "The spotter’s rule changes every time."  

  2. **Challenge**: Scoring confusion with quadratic rule.  
     - **Fix**: Provide a cheat-sheet: "Score = 2 × [prob of actual Q] − [sum of squared probs]."  

  3. **Challenge**: Round 3 (random true conditionals) feels arbitrary.  
     - **Fix**: Pre-draw quadrants to save time; use simple odds (25/25/50) for sampling.  

  4. **Challenge**: Students debate protocols during betting.  
     - **Fix**: "Bet individually first; discuss after revelations."  

  5. **Unavoidable Limitation**: The activity cannot *prove* that protocols *cause* the divergence (students might attribute shifts to randomness).  
     - **Instructor Supplement**: In debrief, emphasize:  
       > "We fixed the sentence and prior. The *only* variable was the protocol. Your credences swung because protocols change what the message *means as evidence*."  

  ---

  This design ensures students confront the puzzle through lived betting swings, with no upfront theory. The scoring rule incentivizes honest credences, and the recurring sentence underscores that conditionalization depends on unstated likelihoods. The debrief makes explicit how protocol changes map to epistemological underdetermination.
