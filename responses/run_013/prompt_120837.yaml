answer: |-
  ### Brainstorm: Key Mappings & Caution Flags  
  - **Promising Mappings**:  
    - *Monopsony* ↔ Employer market power (central to labor asymmetry).  
    - *Cartel* ↔ Union (but *only* in formal structure of coordination; goals diverge).  
    - *Coordinated output restriction* ↔ Strike (mechanically identical).  
    - *Barriers to exit/entry* ↔ Job lock/union security rules.  
    - *Efficiencies defense* ↔ Union productivity arguments.  
  - **False Friends**:  
    - "Labor monopoly" (misleading—unions don’t *sell* labor; employers buy it).  
    - "Consumer welfare standard" (labor debate centers on *producer* welfare, i.e., workers).  
    - "Right to organize as exemption" (obscures labor’s *corrective* purpose).  

  ---

  ### Translation: Labor Debate in Antitrust Vocabulary  
  1. **The Case for Collective Bargaining & Strikes**:  
     - Labor markets exhibit pervasive *monopsony power* (employer concentration, search costs, non-portable skills). Unions are *countervailing coalitions* that correct bargaining-power asymmetries. Strikes are *temporary coordinated supply withdrawals* to force negotiation, analogous to a *holdout strategy* in bilateral monopoly. They remedy market failure by enabling efficient contract formation where individual workers face prohibitive transaction costs.  

  2. **Standard Objection ("Labor Monopolies")**:  
     - Unions are *labor cartels*: By coordinating the supply of labor, they exercise *upstream market power* to restrict output (work hours/jobs) and raise input prices (wages) above competitive levels. This creates *allocative inefficiency* (deadweight loss) and may harm consumer welfare via higher prices. Union security clauses (e.g., closed shops) act as *barriers to entry* for non-union labor.  

  3. **The "Right vs. License" Claim**:  
     - The "right" argument rejects the *exemption framework*. It posits that labor coordination is *structurally distinct* from product-market cartels because:  
       - Workers transact in a market where they are both the input *and* the human sellers (no profit-maximization motive).  
       - Monopsony is the *default pathology*; thus, collective action is efficiency-restoring, not welfare-reducing.  
       - Labor’s "right" derives from correcting a *bilateral market failure*, not a grant of immunity.  

  4. **Treatment of Worker Agreements vs. Firm Agreements**:  
     - Worker agreements (e.g., no-poach pacts *among workers*) would be per se illegal if made by firms under §1 Sherman Act. Labor law carves out a *safe harbor* for worker coordination via the NLRA, treating it as *procompetitive market correction*. The test is whether coordination targets *monopsony power* rather than creating monopoly power upstream.  

  ---

  ### Residue Report: Translation Fidelity  
  **I. Clean Translations (Minimal Distortion)**  
  - **Monopsony Power**: Perfect fit. Explains why labor markets malfunction without collective action (e.g., wage suppression in company towns).  
  - **Strikes as Output Restrictions**: Mechanically identical to cartel supply reduction. Fits entirely.  
  - **Efficiencies Arguments**: Unions’ claims of productivity gains (training, reduced turnover) map neatly to the *efficiencies defense* in merger law.  

  **II. Translations with Distortion**  
  - **Union as "Cartel"**:  
    - *Distortion*: Cartels aim to *extract monopoly rents*; unions aim to *counter monopsony rents* and ensure fair division of surplus. Labeling unions as cartels smuggles in the conclusion that their conduct is inherently anticompetitive.  
    - *Why?* Antitrust lacks a formal category for "corrective coalitions"—it frames all coordination as suspect.  
  - **"Consumer Welfare" in Labor Context**:  
    - *Distortion*: Labor advocates care about *worker welfare* (producer surplus), not end-consumer prices. Forcing labor disputes into a consumer-welfare framework ignores the relevant market (labor, not goods).  
    - *Why?* Antitrust’s consumer focus is doctrinally rigid; it struggles with input-market effects.  

  **III. No Antitrust Counterpart (Gaps)**  
  1. **Worker Dignity/Agency as Non-Economic Value**:  
     - *Labor Argument*: Collective bargaining is a dignitary right (workplace voice), distinct from efficiency.  
     - *Gap*: Antitrust has no conceptual slot for non-pecuniary values. This isn’t a failure of clarity—it’s a *structural limitation* of welfare economics.  
  2. **Asymmetry of Power as Moral Claim**:  
     - *Labor Argument*: Employers inherently dominate due to capital control, making individual contracts coercive.  
     - *Gap*: Antitrust treats "power" as measurable market share, not social hierarchy. The moral claim (*correcting coercion*) has no economic analog.  
  3. **Strikes as Speech/Protest**:  
     - *Labor Argument*: Strikes are political expression (e.g., unfair labor practices).  
     - *Gap*: Antitrust views output restrictions solely through efficiency loss. The *expressive function* is untranslatable.  
  4. **Right vs. Exemption Framing**:  
     - *Labor Argument*: The "right" exists *because* markets fail workers; it’s not a tolerance but a remedy.  
     - *Gap*: Antitrust’s exemption analysis (e.g., *Noerr-Pennington*) assumes coordination is harmful unless justified. This *inverts* labor’s logic.  

  ### Conclusion: Is It "The Same Argument"?  
  **No—the translation changes the subject.** It maps mechanics (coordination, supply withdrawal) cleanly but fails on core premises:  
  - Antitrust asks, *"Does this reduce allocative efficiency?"*  
  - Labor law asks, *"Does this correct oppressive power imbalances?"*  
  The residue—dignity, agency, coercion—reveals that labor’s moral claims are **economically incommensurable**. Your suspicion is half-right: the *tactics* are identical, but the *purpose* and *justification* belong to a different universe. Antitrust vocabulary silently imposes a welfare-economics lens that cannot capture labor’s normative core.
