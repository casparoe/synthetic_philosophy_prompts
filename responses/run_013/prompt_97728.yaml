prompt: |-
  You are an epistemologist and philosopher of science who knows Hume's argument about testimony to miracles down to its joints, and who is unusually good at turning an abstract principle into a procedure a busy non-philosopher can actually run. I'm a senior editor at a long-form magazine covering religion and science; several times a month I have to decide how much weight to give a dossier of testimony about an extraordinary event — a healing, an apparition, an incorrupt body, occasionally just a wildly improbable survival or recovery — and I have to decide without interviewing the witnesses myself, usually inside a day, with a colleague who has no philosophy or statistics. I've read Hume's essay on miracles and I broadly accept his rule that testimony should only be credited when it would be a greater marvel for the testimony to be false than for the event to have happened, but I've never been able to make that rule actually settle anything at my desk. Worse, I suspect the simple reading of it may not even apply to my cases: most of them involve events that are merely statistically extraordinary rather than violations of any law of nature, and I don't know whether Hume's maxim still bites when there's no law to violate — only a base rate.

  Please write me a reusable decision procedure my desk can run on any dossier. I want the questions asked in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values or of taste rather than of evidence. Build in the distinctions that matter: the prior improbability of the event versus the reliability of the testimony, many witnesses who turn out to share one source versus genuinely independent ones, and the difference between a claim that is merely unlikely and one that would reorganize everything else I believe if true. Be explicit that I'm not a statistician and can't always get a number, say what to do when I can't, and mark which steps are judgment calls dressed up as procedure. I read rationalist blogs and I'm comfortable with talk of priors, base rates, likelihood ratios, and the outside view, but the checklist itself has to work for my colleague, so don't make it depend on that vocabulary.

  Then run it on three cases, at least one of which is a non-religious extraordinary claim so I can see it treat the religious and the secular consistently: a healing attested by a dozen people at a shrine, an incorrupt body whose devotees all trace back to one enthusiastic account, and a survival that is statistically freakish but perfectly physical. I expect one of these to come out with more credence than my secular instincts are happy with — include that case and don't soften it. Finish by telling me where the procedure will misfire and what it cannot do. Start by brainstorming the distinctions that must survive the simplification and the ones I can safely drop, then give the procedure, then the cases. Throughout, say how confident you are in what you claim, and single out the one point you are least sure of.
reasoning: |-
  Okay, the user is a senior editor at a magazine covering religion and science. They frequently deal with testimonies about extraordinary events like healings or survivals and need a practical decision procedure. They've read Hume on miracles but struggle to apply his principles in real-world scenarios. 

  First, I need to unpack their core frustrations: 
  - Hume's "greater marvel" rule feels too abstract for desk work. 
  - Most cases involve statistical improbability, not outright law-breaking miracles. 
  - They need something executable by non-philosophers under time pressure. 

  Key distinctions that must survive simplification: 
  1) Event's inherent improbability vs. testimony's reliability 
  2) Independent witnesses vs. shared-source echoes 
  3) Worldview-shifting claims vs. merely unlikely ones 

  What can be dropped: 
  - Philosophical debates about "laws of nature" 
  - Calculating exact probabilities (priorities proxies instead) 

  The procedure must: 
  - Flow sequentially like a checklist 
  - Flag when human judgment is required 
  - Work for both religious and secular claims 

  Biggest challenge: Making likelihood ratios actionable without math. I'll use comparative language ("more/less likely") and concrete thresholds. 

  I'm least confident about Step 4 (worldview impact). It's inherently subjective but too important to omit. Will explicitly mark it as a judgment call. 

  For test cases: 
  1) The shrine healing will likely pass initial screens but fail at independence check 
  2) The incorrupt body case will collapse at source-tracing 
  3) The survival story might clear all hurdles - intentionally challenging the editor's secular bias 

  Failure modes to disclose: 
  - Can't detect collusion without investigation 
  - Useless for events with no base rate data 
  - Vulnerable to novel deception methods 

  Final touch: Add a "burden of proof" reset when prior improbability is extreme - that's where Hume's maxim bites hardest.
answer: |-
  Here's a reusable decision procedure designed for your desk, grounded in Humean principles but operationalized for statistically extraordinary claims. It prioritizes sequential filtering, clear thresholds, and flags judgment calls. **Confidence: 90%** on the structure; **70%** on specific thresholds (adjustable based on your editorial policy).

  **Core Distinctions Preserved:**
  1.  **Event Improbability vs. Testimony Reliability:** Separates how strange the *event* is from how trustworthy the *report* is.
  2.  **Independent Corroboration vs. Shared Source:** Distinguishes multiple lines of evidence from a single source echoing.
  3.  **Worldview Impact:** Flags claims that, if true, would force radical reassessment of well-established knowledge.
  4.  **Burden of Proof:** Places the heaviest lift on the *proponent* of the extraordinary claim.

  **Distinctions Safely Dropped:**
  1.  **Miracles vs. "Merely" Improbable:** Hume's core logic (testimony must overcome event's prior improbability) applies equally. The "violation of natural law" framing is a limiting case of extreme improbability.
  2.  **Exact Probability Values:** Focuses on *comparative* likelihoods and clear qualitative thresholds ("vanishingly small," "plausible explanation").
  3.  **Ultimate Truth:** Outputs a practical "credibility weight for reporting," not a verdict on absolute truth.

  ---

  **The Extraordinary Testimony Evaluation Procedure (ETEP)**

  Run these questions in order. Stop at any "NO" answer. A "NO" means the testimony, *as presented*, is insufficient to warrant significant credibility for the extraordinary event. A "CONTINUE" means proceed. "JUDGMENT CALL" means discuss with your colleague.

  1.  **Is the event *actually* extraordinary?**
      *   *Ask:* Compared to normal human experience and established scientific/medical/historical knowledge, is this outcome vanishingly rare? (e.g., terminal cancer vanishing overnight = extraordinary; surviving a moderate car crash with injuries = not extraordinary).
      *   *Sufficient YES:* Clear evidence of extreme statistical rarity (e.g., documented terminal diagnosis reversed inexplicably, survival against 99.9% odds). Base rate data helps, but strong consensus on rarity suffices.
      *   *Sufficient NO:* Outcome falls within known statistical variation, has plausible non-extraordinary explanations (misdiagnosis, luck), or lacks evidence of true rarity.
      *   *If NO:* **Stop. Insufficient weight.** (Event isn't remarkable enough to need special testimony scrutiny).
      *   *If YES:* **Continue.**

  2.  **Is there a plausible non-extraordinary explanation *more likely* than the extraordinary one?**
      *   *Ask:* Ignoring the testimony for a moment, is there a mundane explanation (fraud, misperception, coincidence, natural recovery, misreporting) that seems inherently *more probable* than the extraordinary event happening?
      *   *Sufficient YES:* Strong evidence of potential misunderstanding (e.g., vague initial diagnosis, ambiguous symptoms), clear motive/opportunity for fraud, event fits known patterns of error (e.g., memory distortion under stress), or highly probable coincidence.
      *   *Sufficient NO:* Non-extraordinary explanations seem strained, require unlikely chains of events themselves, or are directly contradicted by available evidence (e.g., clear medical documentation pre/post event).
      *   *If YES:* **Stop. Insufficient weight.** (The mundane explanation is the better bet).
      *   *If NO:* **Continue.** (The extraordinary claim *might* be the least bad explanation).

  3.  **Is the core testimony credible *on its own*? (Minimal Reliability Check)**
      *   *Ask:* Looking *only* at the primary source(s) describing the event itself (e.g., the initial witness report, medical scan):
          *   Is the source generally truthful/competent (based on reputation, track record, expertise if relevant)?
          *   Were they in a position to observe clearly (sober, alert, close, good conditions)?
          *   Is the report detailed, specific, internally consistent, and free of obvious red flags (contradictions, embellishments typical of hoaxes)?
      *   *Sufficient YES:* Source has good reputation, was well-positioned, report is coherent and specific. Minor inconsistencies okay if explainable.
      *   *Sufficient NO:* Source known for unreliability/delusion, was impaired/distracted, report is vague/contradictory/includes fantastical elements typical of fabrication.
      *   *If NO:* **Stop. Insufficient weight.** (The core testimony is too weak).
      *   *If YES:* **Continue.** (Testimony has basic plausibility).

  4.  **Is the event *so* extraordinary it would shatter core knowledge? (Worldview Impact)**
      *   *Ask (JUDGMENT CALL - Discuss with Colleague):* If true, would this fundamentally rewrite biology, physics, medicine, or history? Or is it "merely" an extreme statistical outlier within an existing framework? (e.g., Incorruptibility defying decay = high impact; surviving a plane crash due to freakish luck = low impact).
      *   *High Impact:* Requires *exceptionally* strong evidence. Raises the bar significantly for Step 5/6.
      *   *Low Impact:* Requires strong evidence, but the bar remains lower.
      *   *Always:* **Continue.** (This flags the *level* of evidence needed next).

  5.  **Is there *independent* corroboration? (The Multiplier)**
      *   *Ask:* How many *truly independent* lines of evidence support the core testimony? Trace sources back: Do multiple accounts derive from one person? Or are there multiple, unconnected observers/records?
          *   *Independent:* Witnesses who saw/heard/felt different aspects independently; physical evidence documented by separate parties; contemporaneous records from unrelated sources.
          *   *Dependent:* Multiple people reporting what one person said; accounts clearly influenced by a central narrative/person; evidence collected solely by devoted believers.
      *   *Sufficient Threshold (JUDGMENT CALL - Use Step 4):*
          *   *High Impact Event:* Needs **multiple (3+), strong, truly independent lines** (e.g., medical tests by skeptical doctors + sworn testimony from unrelated bystanders + physical trace evidence).
          *   *Low Impact Event:* Needs **at least 1-2 strong independent lines** OR **several (5+) credible dependent accounts** *if* the core testimony (Step 3) is exceptionally solid and no plausible explanation (Step 2) exists.
      *   *If Threshold NOT Met:* **Stop. Insufficient weight.** (Testimony likely echoes, not corroborates).
      *   *If Threshold MET:* **Continue.** (Evidence is robust enough for final check).

  6.  **Does the *weight* of evidence overcome the *strangeness*? (Hume's Maxim Applied)**
      *   *Ask (JUDGMENT CALL - Holistic):* Considering the event's sheer improbability (Step 1), the lack of better explanations (Step 2), the credibility of the core report (Step 3), and the strength of independent corroboration (Step 5): Is it now *less believable* that *all* of this evidence/account is mistaken or deceptive, than it is that the extraordinary event actually happened?
      *   *Sufficient YES:* The combined evidence feels genuinely overwhelming *despite* the event's weirdness. The alternative (mass error, complex fraud, insane coincidence) seems even harder to swallow. (*This is Hume's "greater marvel" test*).
      *   *Sufficient NO:* The event is still so strange that even good evidence leaves room for doubt, or the corroboration has weaknesses. The "mundane explanation" (Step 2) might still be simpler overall.
      *   *If YES:* **Assign Significant Credibility Weight.** (Warrants serious reporting/investigation).
      *   *If NO:* **Assign Low Credibility Weight.** (Mention as a curious claim but emphasize its extreme improbability and lack of conclusive proof).

  ---

  **Case Studies:**

  **Case 1: Shrine Healing (12 Witnesses)**
  1.  **Extraordinary?** YES. Sudden reversal of severe/chronic condition at a shrine is highly improbable medically. *Continue.*
  2.  **Better Explanation?** JUDGMENT CALL: Possible explanations (spontaneous remission, psychosomatic effect, misdiagnosis, placebo). Is remission *more likely* than divine intervention? Often YES for many conditions, but depends on specifics. *Assume NO (for argument) - Continue.*
  3.  **Core Testimony Credible?** Likely YES. Assume pilgrims seem sincere, report is coherent. *Continue.*
  4.  **Worldview Impact?** LOW (if framed as unexplained healing) to MODERATE (if framed as divine miracle). *Continue (Set bar: Need 1-2 independent lines / several dependent).*
  5.  **Independent Corroboration?** **LIKELY NO.** 12 witnesses *at a shrine* are almost certainly **not independent**. They share context, belief, likely heard each other. Corroboration likely echoes one core experience. *Fails Threshold.* **STOP. Insufficient Weight.** (This is the common failure mode: Many witnesses, one source).

  **Case 2: Incorrupt Body (Devotees trace to one account)**
  1.  **Extraordinary?** YES. Bodies decomposing is near-universal. Apparent incorruptibility is highly improbable. *Continue.*
  2.  **Better Explanation?** YES. Known explanations exist: Embalming (overt/covert), environmental conditions (dryness, cold), natural saponification/mummification, subjective perception/embellishment over time. These are *more likely* than suspension of decomposition. **STOP. Insufficient Weight.** (Step 2 fails - mundane explanation strongly favored).

  **Case 3: Freakish Survival (e.g., Fell 10,000 ft without parachute, landed in snowdrift, survived)**
  1.  **Extraordinary?** YES. Survival under such conditions is statistically vanishingly rare. *Continue.*
  2.  **Better Explanation?** JUDGMENT CALL: Is fraud more likely? (Hard to fake a fall). Is misreporting height/conditions more likely? (Possible). Is extreme luck *more likely* than the fall happening as described? **NO.** The event, while improbable, is physically *possible*. No known law violated. Mundane explanations (fraud, exaggeration) seem *less* likely than extreme luck in this specific case? *Assume NO - Continue.*
  3.  **Core Testimony Credible?** Likely YES. Survivor account, maybe air traffic control data. Assume coherent, documented. *Continue.*
  4.  **Worldview Impact?** **LOW.** Extreme outlier, but fits within known physics/biology (just at the very tail end). *Continue (Set bar: Need 1-2 independent lines).*
  5.  **Independent Corroboration?** **LIKELY YES.** Radar/Air Traffic Control records (independent data). Eyewitnesses on ground *unrelated* to the survivor. Paramedic/Doctor reports from initial treatment. These are strong, independent lines. *Meets Threshold (Low Impact).* *Continue.*
  6.  **Weight vs. Strangeness?** **LIKELY YES.** The combination of credible survivor testimony, objective radar data, independent ground witnesses, and medical evidence makes the scenario where *all* are mistaken or fraudulent **less believable** than the scenario where an extremely improbable, but physically possible, survival occurred. **ASSIGN SIGNIFICANT CREDIBILITY WEIGHT.** (This is the one that might challenge secular instincts – but it passes because the event, while freaky, doesn't break laws, and the evidence is robust and independent).

  ---

  **Where ETEP Misfires & Limitations:**

  1.  **Novel Deception/Collusion:** ETEP relies on spotting red flags (Step 3) and independence (Step 5). A *perfectly* executed fraud by multiple skilled actors could fool it. **(Confidence: 85% - rare but possible).**
  2.  **Extreme Worldview Impact Claims:** For claims that *truly* rewrite physics (e.g., verified perpetual motion machine), ETEP's Step 6 bar is astronomically high. Few testimonial dossiers will ever clear it, which is correct per Hume, but might feel unsatisfying. **(Confidence: 95% - this is a feature, not a bug).**
  3.  **Base Rate Ambiguity:** When the true prior probability is unknown or hotly contested (e.g., efficacy of a novel therapy, frequency of rare phenomena), Step 1 & 2 become major judgment calls. ETEP can't resolve this. **(Confidence: 70% - relies on consensus best judgment).**
  4.  **"Unknown Unknowns":** If the non-extraordinary explanation involves a mechanism science hasn't discovered yet, ETEP might wrongly favor the extraordinary claim in Step 2. **(Confidence: 65% - inherent epistemic risk).**
  5.  **Emotional/Existential Weight:** ETEP doesn't quantify the *significance* of the claim, only its credibility. A highly credible minor anomaly might get less weight than a less credible but profound claim – that's an editorial decision beyond evidence. **(Confidence: 100% - outside scope).**
  6.  **Cannot Generate Positive Proof:** ETEP only assesses the *credibility of testimony*. It cannot, and does not try to, *prove* the event happened. It answers: "Is this testimony strong enough to warrant taking this claim seriously in our reporting?" **(Confidence: 100%).**

  **Least Confident Point (Confidence: 60%):** The specific numerical thresholds suggested in Step 5 ("3+ independent" for High Impact, "1-2 independent" or "5+ dependent" for Low Impact). These are heuristics. In practice, the *quality* of a single independent line (e.g., irrefutable physical evidence) can outweigh quantity. This step requires the most editorial discretion and discussion with your colleague. Focus on the *principle*: High Impact demands *rock-solid, multi-faceted* evidence; Low Impact demands *clear, non-circular* evidence.

  This procedure forces explicit consideration of the key Humean factors, provides clear off-ramps for weak claims, highlights where judgment is needed, and treats religious/secular claims consistently by focusing on evidence and improbability. It should make your desk decisions faster, more transparent, and more defensible.
