answer: |-
  **ARBITRATION AWARD**
  **IN THE MATTER OF BAKER v. CARTER**
  **Case No. ADR-2023-045**
  **Sole Arbitrator: The Hon. Reginald P. Arbuthnot (Ret.)**

  **1.** This Award resolves the dispute between Claimant Evelyn Baker ("Baker") and Respondent Marcus Carter ("Carter"), collectively "the Parties", concerning the division of jointly acquired property following the dissolution of their cohabitation agreement. Jurisdiction and the Arbitrator’s authority derive from the Parties’ binding Arbitration Agreement dated January 15, 2023. A hearing was conducted on October 26-27, 2023. Both Parties appeared with counsel and presented evidence and argument.

  **2.** **Factual Background & Disagreement Point:** The Parties cohabited for 18 months, jointly purchasing several items. The dispute concerns the division of two items: a professional-grade ping-pong table ("Item A") and a high-end robotic lawnmower ("Item B"). Both Parties desire both items but acknowledge only one can possess each item. The Parties stipulated that if no agreement is reached ("disagreement point"), Baker shall receive Item B and Carter shall receive Item A. Both Parties agree this outcome yields a utility value of zero (0) for each Party concerning the desired-but-unreceived item. Therefore, the disagreement point (d) is established as:
      > d = (d_Baker, d_Carter) = (0, 0)
      (Where the first coordinate represents Baker's utility and the second Carter's utility).

  **3.** **Feasible Set:** The set of feasible utility outcomes, derived from Party submissions and verified for convexity, consists of the following Pareto-optimal points:
      a. Baker receives Item A, Carter receives Item B: (100, 50)
      b. Baker receives Item B, Carter receives Item A: (50, 100)
      c. Any lottery between outcomes (a) and (b), weighted by probability `p` (0 ≤ p ≤ 1), yielding utilities (100p + 50(1-p), 50p + 100(1-p)).

  **4.** **Ideal Point:** The ideal point (u*) is defined as the supremum of utilities achievable by each Party individually within the feasible set, irrespective of joint achievability. Baker's maximum feasible utility is 100 (obtaining Item A). Carter's maximum feasible utility is 100 (obtaining Item B). Therefore, the ideal point is:
      > u* = (u*_Baker, u*_Carter) = (100, 100)

  **5.** **Procedural Rulings & Governing Principles:** The Parties' Arbitration Agreement incorporates by reference the principles of axiomatic bargaining fairness, specifically mandating Pareto Optimality, Symmetry, Invariance to Positive Affine Transformations of Utility Scales ("Scale Invariance"), and Individual Monotonicity. These principles govern the admissibility of evidence and the determination of the award.
      a. *Scale Invariance (Affine Transformation Invariance):* Testimony regarding the monetary value, sentimental attachment, or inherent "real-world" worth of Item A or Item B was excluded. Mr. Carter's assertion that the lawnmower cost $1500 while the ping-pong table cost $800 is irrelevant, as utility scales are unique to each Party and defined only up to positive linear transformations. Ms. Baker's testimony regarding the emotional significance of the ping-pong table, purchased for her nephew, was similarly excluded. Only the relative utilities within the defined feasible set are material.
      b. *Symmetry & Pareto Optimality:* Arguments concerning comparative merit, need, or conduct during the cohabitation were excluded. Ms. Baker's claim that she contributed 70% of the funds for the items, and Mr. Carter's counterclaim regarding his exclusive maintenance efforts, bear no weight. The award depends solely on the geometry defined by the disagreement point and the feasible set, ensuring an outcome on the Pareto frontier. Symmetry, while a foundational axiom, does not compel equal division here due to the asymmetric ideal point.
      c. *Individual Monotonicity:* During the hearing, Mr. Carter sought to introduce evidence demonstrating that a newer, superior robotic lawnmower model (Item B+) had recently entered the market, arguing this diminished the relative value of the disputed Item B *to Baker*. He contended this should reduce Baker's award. This evidence was excluded. Individual Monotonicity requires that if one Party's ideal utility increases (e.g., if u*_Carter rose) while the other's ideal utility and the disagreement point remain unchanged, the other Party's (Baker's) award utility cannot decrease. Mr. Carter's argument, seeking a *decrease* in Baker's award based on an external factor not altering the *feasible set* or *disagreement point* within this defined bargaining problem, is directly contrary to this governing axiom. The potential existence of Item B+ does not alter the feasible outcomes or the ideal point *within the confines of this dispute* concerning Items A and B.

  **6.** **Computation of Award - Kalai-Smorodinsky Solution:** The governing axioms compel the application of the Kalai-Smorodinsky bargaining solution. This solution identifies the unique Pareto-optimal point on the straight line segment connecting the disagreement point (d) to the ideal point (u*) within the feasible set.
      a. The line segment from d = (0, 0) to u* = (100, 100) is defined parametrically as:
          > (x, y) = t * (100, 100) = (100t, 100t) for 0 ≤ t ≤ 1.
      b. This line segment intersects the Pareto frontier of the feasible set. The Pareto frontier consists of points satisfying x + y = 150 (derived from the linear combinations of outcomes (a) and (b) in ¶3). Substituting the line equation:
          > 100t + 100t = 150
          > 200t = 150
          > t = 150 / 200 = 0.75
      c. The award point is therefore:
          > (x, y) = (100 * 0.75, 100 * 0.75) = (75, 75)
      d. Verification of Proportional Gains:
          * Baker's Gain: (75 - 0) / (100 - 0) = 75/100 = 0.75
          * Carter's Gain: (75 - 0) / (100 - 0) = 75/100 = 0.75
      The proportional gains are equal (0.75 each), satisfying the defining characteristic of the Kalai-Smorodinsky solution. The point (75, 75) lies on the Pareto frontier (75 + 75 = 150) and is achievable via a lottery: specifically, a 50% chance of outcome (a) (Baker:100, Carter:50) and a 50% chance of outcome (b) (Baker:50, Carter:100), yielding expected utilities (0.5*100 + 0.5*50 = 75, 0.5*50 + 0.5*100 = 75).

  **7.** **Consideration of Nash Solution:** The Tribunal Clerk, pursuant to Rule 12(b) of the Arbitration Procedure, submitted a memorandum suggesting the Nash bargaining solution (maximizing the product of gains) as a potential alternative, noting its adherence to the axiom of Independence of Irrelevant Alternatives (IIA). The Nash solution for this problem, maximizing (x - 0)(y - 0) subject to x + y = 150, yields (75, 75) – coinciding with the Kalai-Smorodinsky solution in this symmetric case. The Clerk correctly noted that had the ideal point been asymmetric *and* the feasible set non-linear, the solutions might diverge. The Clerk argued IIA possesses normative superiority, as it ensures the outcome depends only on the feasible set and disagreement point, unaffected by "unavailable" ideal utilities.

  **8.** **Arbitrator's Rebuttal on Solution Selection:** The Clerk's observation regarding potential divergence is mathematically sound. However, the governing arbitration principles explicitly include Individual Monotonicity and omit IIA. Individual Monotonicity provides a direct normative guarantee: an expansion of one party's opportunity set (reflected in an improved ideal point), holding all else constant, should not harm the other party. IIA provides no such guarantee and can permit a party's award to diminish when the other party's potential maximum improves. The inclusion of Individual Monotonicity within the Parties' incorporated principles is determinative. The Kalai-Smorodinsky solution satisfies this mandated axiom; the Nash solution does not. The normative choice expressed in the Parties' agreement is for monotonicity over IIA. The coincidence of the solutions here is immaterial to the governing principle.

  **9.** **Award:** Pursuant to the Kalai-Smorodinsky bargaining solution, mandated by the incorporated principles of axiomatic bargaining fairness, the award is as follows:
      a. Ownership of the ping-pong table (Item A) and robotic lawnmower (Item B) shall be determined by a single, fair coin toss conducted by the Arbitrator within seven (7) days of this Award.
      b. If the coin toss results in Heads, Baker shall receive Item A and Carter shall receive Item B.
      c. If the coin toss results in Tails, Baker shall receive Item B and Carter shall receive Item A.
      d. This mechanism implements the required lottery, achieving the utility outcome (75, 75) as computed.

  **10.** This Award is final and binding on the Parties. All claims not expressly granted herein are denied.

  DATED: November 17, 2023

  **The Hon. Reginald P. Arbuthnot (Ret.)**
  Sole Arbitrator
