prompt: |-
  Right, I've got a pile of gut verdicts about when it's OK to free-ride on something shared, and I want to know what rule, if any, they add up to. Please actually commit to a principle rather than laying out the options and letting me choose.

  Ground rules: I'm one household, one person, basically negligible on my own. Here's the list.

  - I never donate to Wikipedia despite using it every day. Fine.
  - Not voting in a seat that's a dead cert for one party. Fine.
  - Chucking the odd bit of plastic in the general bin instead of rinsing it for recycling. Fine, more or less.
  - Not putting a fiver in for Dave's leaving present when there's twenty of us and someone's already bought it. Not fine, actually.
  - Skipping my week on the allotment weeding rota because I know Priya will do it if I don't. Not fine.
  - Reading the shared group-project doc and never adding a word, while the others grind away. Not fine.
  - Bailing on a massive march that'll happen with or without me. Fine. But bailing on a tiny one where the organisers need bodies to keep the permit. Not fine.
  - One boat quietly cheating its quota while the fishery collapses anyway. Still wrong, I reckon, even though the collapse happens regardless.
  - Leaving the communal kitchen a tip once. Not fine.
  - Crowdfunding a mate's surgery that'll hit its target with or without my tenner. I feel fine not giving.
  - The office coffee fund: I drink it, I don't pay in, and I feel like a scrounger even though it's pennies a week.

  The two I can't square. First, Wikipedia (fine) versus the coffee fund (not fine), even though the coffee costs me less and the website is a far bigger thing. Second, the big march (fine) versus the small one (not fine), when the nudge I make is equally tiny in both.

  My half-baked stab: it's fine to free-ride when my contribution makes no difference to whether the good comes off, and not fine when it does. But that can't be it, because 'no difference' covers the present, the rota and the doc, and I only excuse the first of those. Then I wondered if the real split is rivalrous versus non-rivalrous — me catching fish leaves fewer for you, me reading Wikipedia doesn't. But the rota isn't rivalrous either and I still say skipping it is wrong, so that's not it either, definately not on its own.

  So: is there one principle here, or a small set of candidates, and what does it actually say? I want it tight enough that I could apply it to a case I haven't thought of. Please make it pronounce on at least these: (a) an anonymous rota where nobody can tell I skipped; (b) a shared thing where I'm the only person who can fix it and it's a right faff; (c) whether it matters that some goods need a certain number of people to tip them over the line while others just take whatever slivers they can get. And be straight with me about which of the verdicts above your principle has to overturn — I'd rather you told me plainly than fudged it to save them all. Pick a side and give me your reasons.
reasoning: |-
  Okay, the user is presenting a collection of intuitive judgments about free-riding scenarios and wants me to extract a unified ethical principle. They're clearly frustrated with vague philosophical hand-waving—they want a concrete, actionable rule that can handle edge cases. 

  First, I notice their examples cluster into three puzzling contradictions: Wikipedia vs office coffee (both non-rivalrous yet different intuitions), large vs small protests (same individual impact but different obligations), and the fishing quota case where insignificance doesn't excuse wrongdoing. Their "half-baked" attempts (causal impact and rivalry) already show sharp analysis—they've identified key variables but need synthesis.

  The user's hidden tension seems to be between ethical consistency and practical realism. They're morally uneasy about coffee fund freeloading despite its triviality, yet intellectually recognize Wikipedia's free-rider problem is structurally similar. Their demand for principles that handle anonymity ("nobody can tell I skipped") and threshold effects ("tipping points") suggests they want something robust enough for real-world gray areas.

  Hmm... the reciprocity angle feels promising. In cases where they condemn free-riding (allotment rota, group doc), there's a direct social contract with identifiable collaborators. Whereas Wikipedia and large marches lack that personal connection. But the office coffee fund is communal yet feels binding—probably because the "contract" (however informal) is visibly upheld by colleagues they interact with daily. 

  Ah! And that explains the surgery crowdfunding exception: no obligation because no reciprocal relationship exists, just abstract goodwill. Whereas Dave's leaving present involves an explicit mini-social-contract among the twenty colleagues. The fishery case condemns cheating because it violates a systemic reciprocity—the quota system only works if all boats reciprocally restrain themselves.

  For the protest cases: large marches lack reciprocity (no one notices individual absence) while small ones operate like a team where each body reciprocally supports the permit holder. The kitchen mess fails reciprocity because someone must clean up after you—it's functionally rivalrous in labor terms.

  Testing against their edge cases: (a) Anonymous rota skipping? Still wrong per reciprocity—you'd expect others to uphold their duties. (b) Sole-responsibility faff? Permissible to skip only if no reciprocity expectations exist. (c) Tipping points? Reciprocity applies regardless—you contribute your fair share to collective efforts, threshold or not.

  This principle does overturn two intuitions: plastic recycling (should be obligatory as reciprocal civic duty) and surgery crowdfunding (permissible but reciprocity might suggest giving anyway if you benefit from communal safety nets). I'll flag that trade-off honestly—better to lose two battles than compromise coherence.
answer: |-
  Your gut verdicts point to a single coherent principle: **free-riding is permissible only when your action (or inaction) violates no implicit or explicit agreement about mutual contribution, and the good is non-rivalrous.** Let's break this down:

  ### The Principle: Reciprocal Non-Rivalry
  1. **Reciprocity Requirement**: You must uphold your end of any cooperative arrangement (explicit or socially implied) where others are contributing effort/resources *expecting your participation*. Violating this trust is wrong, regardless of impact.
  2. **Non-Rivalry Condition**: For goods where your use doesn't diminish others' access (non-rivalrous), free-riding *may* be excused if no reciprocity expectation exists.

  ### How It Explains Your Verdicts:
  | **Case** | **Verdict** | **Why?** |
  |----------|-------------|----------|
  | **Wikipedia** | Fine ✅ | No reciprocity expectation (donations voluntary); non-rivalrous. |
  | **Dead-cert voting** | Fine ✅ | No reciprocity expectation; your vote doesn't rival others'. |
  | **Plastic recycling** | Fine ✅ | Weak reciprocity (system isn't personal); non-rivalrous *consumption*. |
  | **Dave's leaving present** | Not fine ❌ | Explicit reciprocity: group agreement to chip in collectively. |
  | **Allotment weeding rota** | Not fine ❌ | Explicit reciprocity: shared labor pact. Priya relies on you. |
  | **Group-project doc** | Not fine ❌ | Implicit reciprocity: collaborators expect equal effort. |
  | **Massive march** | Fine ✅ | No reciprocity expectation; non-rivalrous participation. |
  | **Tiny march** | Not fine ❌ | Reciprocity: organizers *rely* on your RSVP for the permit. |
  | **Fishing quota cheat** | Not fine ❌ | Violates systemic reciprocity (quota system = mutual pact); rivalrous resource. |
  | **Communal kitchen mess** | Not fine ❌ | Strong reciprocity expectation: clean after yourself. |
  | **Crowdfunded surgery** | Fine ✅ | No reciprocity expectation; non-rivalrous good (funds are pooled). |
  | **Office coffee fund** | Not fine ❌ | Implicit reciprocity: colleagues see you drinking & not paying. |

  ### Resolving Your Contradictions:
  - **Wikipedia vs. Coffee Fund**:  
    Wikipedia has *no reciprocity expectation* (it's a true public good). The coffee fund has a *social contract* among colleagues—your consumption while avoiding payment breaches trust.  
  - **Big vs. Small March**:  
    The big march has *no reciprocity* (your absence isn't noticed). The small march relies on your *explicit commitment* to meet permit thresholds—a direct reciprocity breach.

  ### Applying to Your Edge Cases:
  1. **Anonymous rota skip (nobody can tell)**:  
     **Not fine.** Reciprocity isn't about detection—it's about upholding your duty. You agreed to the rota; others work expecting your contribution.  
  2. **Only you can fix a shared thing (but it's a faff)**:  
     **Not fine** if reciprocity exists (e.g., it's "your turn"). **Fine** if no expectation exists (e.g., an unnoticed park bench you *could* repair).  
  3. **Threshold goods vs. incremental goods**:  
     Reciprocity matters more than thresholds. If you agreed to help meet a threshold (e.g., the small march), skipping is wrong. If no agreement exists (e.g., Wikipedia), thresholds don't bind you.

  ### Overturned Verdicts:
  Your principle must reject two intuitions:  
  1. **Plastic recycling**: Should be **not fine**. Recycling systems rely on widespread participation (reciprocity). Your neglect, even trivial, breaches this civic pact.  
  2. **Crowdfunded surgery**: If friends/family organized it, **not fine**. Social ties imply reciprocity; your free-riding exploits their goodwill.

  ### Why This Works:
  - **Reciprocity** explains why obligation persists even when your impact is negligible (rota, docs, kitchen).  
  - **Non-rivalry** explains why you can use Wikipedia guilt-free but not office coffee.  
  - **Social vs. systemic goods** clarifies why voting thresholds don’t bind you, but fishery quotas do.

  **The rule**: *"When others contribute expecting your fair share, you must reciprocate—even if your impact is small. When no such expectation exists and the good is non-rivalrous, you may free-ride."* This covers 10/12 cases and handles your edge tests without fudging.
