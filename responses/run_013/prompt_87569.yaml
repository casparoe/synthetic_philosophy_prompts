prompt: |-
  I have been trying to work out what I actually believe about the ethics of belief, and I should like you to tell me what principle, if any, my verdicts amount to. The two familiar poles are not much help on their own — the view that belief must in every case answer to the evidence, and the view that certain questions licence a pass beyond it — because I seem to sit somewhere between them, and I want the principle to be extracted from the cases rather than imposed on them. Treat what follows as data: these are my unforced reactions, not positions I have argued for, and I would rather you told me which of them I have to abandon than that you saved all of them by an ad hoc clause.

  1. A climber at a crux move must commit to the belief that he can make the leap; if he holds the question open he will hesitate, and hesitation will kill him. He knows the evidence about his chances is finely balanced. I think it is not merely permissible but admirable for him to work himself into the belief.

  2. A man has no evidence either way about whether his wife has been faithful, and no way of getting any; he could simply decline to form a view. I think it would be wrong of him to settle on her fidelity just because believing it would make him a more affectionate husband.

  3. A scientist stakes her laboratory on a hypothesis before the evidence is in, treating it as true in order to design experiments. I take this to be entirely proper.

  4. A juror, moved by a general faith in people, comes to believe the defendant innocent against the weight of the evidence. I think this is a dereliction even though the belief makes him gentler.

  5. A man privately comes to believe, against the prognosis, that his dying friend will recover. I do not condemn the private belief, and I think it lets him be present and kind; but I would condemn him for telling the friend so.

  6. Someone working for a political cause she has good reason to think will fail nonetheless believes it will succeed, because the belief sustains her and her comrades and is in part self-fulfilling through their morale. I think this is admirable.

  7. A student who has not studied comes to believe he will pass, in order to calm his nerves. I think this is contemptible, even though the confidence may help a little.

  8. Here is the one I cannot settle: a teacher who, against the evidence, comes to believe that a struggling pupil will succeed, where the belief tends to make itself true, since the pupil works harder because the teacher expects it. I keep changing my mind.

  I have a hunch that the cases turn on a distinction between beliefs that fix a verdict about how things already stand and beliefs that enable something to be done, but I cannot make that hunch earn its keep against cases 5 and 6, so I would rather you tested it than adopted it.

  What I want from you is a definite answer, not a survey. Say what principle, or small set of principles, best captures the seven verdicts I have given, and identify, for each clause you propose, the case that forces it. Say what your principle predicts for the eighth case and which way you would come down on it. Say which of my seven verdicts it forces me to give up, if any, and be honest about the cost. Finally, name the further case that would most sharply distinguish your principle from the nearest rival. I would much rather you committed to one account and defended it than laid out four and left me to choose. Please write in British English.
reasoning: |-
  Hmm, this is a fascinating challenge in applied epistemology. The user presents eight carefully crafted thought experiments about the ethics of belief, with clear intuitive verdicts on seven and uncertainty on the eighth. They're explicitly asking for principle extraction rather than position imposition - treating their judgments as data points to reverse-engineer an ethical framework.

  What stands out immediately is the nuanced pattern across cases. The climber (1) and political activist (6) get full endorsement for evidentially unsupported beliefs, while the suspicious husband (2) and lazy student (7) are condemned. The scientist (3) gets a pass for pragmatic belief, but the juror (4) doesn't. Private hopeful belief (5) is permissible but not its expression. The teacher case (8) remains contested.

  The user's own hunch about "beliefs that enable action" versus "beliefs about current states" is insightful but stumbles on cases like the private deathbed belief (5) which seems purely evaluative yet permitted. I notice that in all endorsed cases (1,3,5,6) the belief either enables crucial action or sustains meaningful engagement, while prohibited ones (2,4,7) involve avoiding epistemic responsibility or distorting judgment where clear standards apply.

  For the teacher case (8), the principle would permit the belief because it functions as a self-fulfilling prophecy through pedagogical influence - aligning with the "enablement" criterion. But we'd need to distinguish this sharply from the juror case where social role demands evidence-responsiveness.

  The hardest tension might be with case 7: why is the student's confidence contemptible while the activist's isn't? The key is that the student's belief undermines future epistemic discipline (no studying) whereas the activist's sustains commitment without denying evidence. This suggests an additional clause about whether the belief corrupts or preserves truth-tracking capacities.

  For the distinguishing case, I'd propose a variation on the scientist: what if she persists in believing a falsified hypothesis because it's institutionally useful? That would test whether pragmatic justification has temporal limits.
answer: |-
  Right then, let's get to work on your cases. Treating your verdicts as fixed data points, the principle that best captures your seven judgments, while explaining the tension in the eighth, is this:

  **The Pragmatic Enablement Principle (PEP):**
  *A belief formed against or beyond the available evidence is ethically permissible (and can be admirable) if and only if:*
  1.  **It is practically necessary for enabling a specific, worthwhile action or engagement that would otherwise be impossible or severely compromised;** *and*
  2.  **The belief itself, or the action it enables, directly contributes to bringing about a desired outcome related to the belief's content, or sustains a crucial capacity for engagement;** *and*
  3.  **It does not violate a specific epistemic duty arising from role, relationship, or context where truth-apt judgment is paramount.**

  **How the PEP Explains Your Seven Verdicts (and the Clause Each Forces):**

  1.  **The Climber (Admirable):** Forces Clause 1 & 2. Belief is *practically necessary* for the action (the leap). Hesitation (lack of belief) *severely compromises* survival. The belief *directly enables* the action required for the desired outcome (survival/making the leap). No conflicting epistemic duty (Clause 3).
  2.  **The Suspicious Husband (Wrong):** Forces Clause 3. While believing might make him more affectionate (a potential desired outcome), there *is* a specific epistemic duty arising from the intimate *relationship* to form beliefs about the partner based on evidence, not convenience. Forming the belief *violates this duty* where truth-apt judgment is paramount to the relationship's integrity.
  3.  **The Scientist (Proper):** Forces Clause 1. The belief is *practically necessary* for enabling the specific, worthwhile action (designing experiments). Treating the hypothesis as true is a *tool* for *engagement* (experimentation) designed to *gather* evidence. It doesn't claim settled truth (so Clause 3 less relevant here).
  4.  **The Juror (Dereliction):** Forces Clause 3. The juror has a *specific, paramount epistemic duty* arising from their *role* to base their verdict *solely* on the evidence presented. Belief against the evidence *violates this duty* fundamentally. The gentleness is irrelevant (and potentially distorting).
  5.  **The Friend's Private Belief (Not Condemned) vs. Expression (Condemned):**
      *   *Private Belief:* Permitted by Clause 1 & 2. Belief *sustains his crucial capacity for engagement* (being present and kind) during an emotionally devastating time where maintaining composure/kindness is *practically necessary* and would be *severely compromised* by despair. It helps him manage the situation *for the friend's benefit* (desired outcome related to engagement).
      *   *Expression Condemned:* Forces Clause 3. Expressing the false belief *violates a specific duty* arising from the *relationship* – the duty of honesty, especially regarding critical factual matters like prognosis. Truth-apt communication is paramount here.
  6.  **The Political Activist (Admirable):** Forces Clause 2 & clarifies 1. Belief is *practically necessary* to *sustain* the activist and her comrades' *crucial capacity* for engagement (morale, continued effort). The belief *directly contributes* (via morale) to the *self-fulfilling potential* of the desired outcome (success). It enables *continued action* towards that outcome.
  7.  **The Unprepared Student (Contemptible):** Forces the necessity part of Clause 1 and highlights a failure against PEP generally. Belief is *not practically necessary* for worthwhile action; the worthwhile action (studying) was neglected. The belief enables *inaction* (not studying) or trivial action (taking the exam unprepared) rather than enabling a crucial engagement that demands belief. It fosters self-deception to avoid responsibility, not to enable a necessary, productive effort. It lacks the *worthwhile action* element.

  **The PEP and the Teacher Case (8):**

  *   **Prediction:** The PEP would permit (and likely find admirable) the teacher's belief.
  *   **Reasoning:**
      *   **Clause 1:** The belief might be *practically necessary* for the teacher to engage fully and effectively in the specific, worthwhile action of teaching, inspiring, and supporting the struggling pupil. Doubt could unconsciously undermine effort or communication.
      *   **Clause 2:** The belief *directly contributes* (through the teacher's expectations, encouragement, and potentially altered teaching approach) to *making itself true* – the pupil works harder *because* of the teacher's belief. This is a clear self-fulfilling prophecy directly related to the belief's content (success).
      *   **Clause 3:** While a teacher has a duty to be *realistic*, it is arguably not the same paramount, truth-*verdict* duty as a juror. The primary duty is pedagogical – fostering growth and potential. Here, the belief actively serves that duty by motivating the pupil. It doesn't involve misrepresenting facts or grading unfairly *based* on the belief against evidence; it’s about fostering potential *despite* current evidence.
  *   **Conclusion:** Based on PEP and your pattern in cases 1, 3, 5 (private), and 6, you *should* endorse the teacher's belief as permissible and admirable. It fits the core "enablement and positive contribution to outcome" pattern.

  **What You Must Give Up and the Cost:**

  The PEP forces you to give up **one aspect of your verdict on Case 5**. You do not condemn the *private belief*. PEP agrees. However, you *condemn expressing the belief to the friend*. PEP also condemns this (due to Clause 3 - duty of honesty in the relationship). **There is no cost here; PEP saves this verdict.**

  **However, the implicit tension is with the *reason* for condemning the expression.** PEP condemns it solely based on violating a relational epistemic duty (honesty about critical facts). Your description ("I would condemn him for telling the friend so") doesn't specify if your reason aligns precisely with this, but PEP provides a principled reason that fits your condemnation.

  **A Distinguishing Case Against the Nearest Rival:**

  The nearest rival principle is likely a pure **"Consequentialism of Belief"** (is the net outcome of holding the belief good?).

  *   **The Proposed Distinguishing Case: The Self-Deceived Surgeon.**
      *   A brilliant but anxious surgeon, facing a novel, high-risk procedure on a critically ill patient where the objective success probability based on available data is 30%, believes *against this evidence* (with no new data) that *their specific patient* has an 80% chance. This belief banishes paralyzing anxiety, allowing them to perform with flawless, confident technique they couldn't muster otherwise. The belief is self-fulfilling in enabling their performance. The patient survives due to the superb surgery.

  *   **How PEP vs. Consequentialism Judge:**
      *   **PEP:** Likely *condemns* the belief. Clause 1 is met (belief necessary for action/performance). Clause 2 is arguably met (belief enables action contributing directly to outcome). **BUT Clause 3 is violated:** A surgeon has a *paramount epistemic duty* arising from their *role* and the *patient relationship* to assess risks and probabilities as accurately as possible *before* proceeding, to ensure valid consent and appropriate decision-making. Forming a belief against the evidence about the *specific patient's prognosis* violates this duty of truth-apt judgment crucial to the medical role. The good outcome doesn't erase the epistemic violation in forming the belief *prior* to action/consent.
      *   **Pure Consequentialism:** Likely *endorses* the belief. The net outcome was excellent (patient saved, surgeon performed well). Without the belief, the patient likely dies due to surgeon anxiety. Consequences are overwhelmingly positive.
  *   **Why it Distinguishes:** Your verdicts on the Juror (4) and the Husband (2) suggest you value role/relationship epistemic duties *even when* positive consequences might flow from violating them (gentler juror, more affectionate husband). PEP captures this with Clause 3. A consequentialist would struggle to condemn the surgeon's belief given the excellent outcome. PEP can condemn it based on the violation of professional epistemic duty, aligning better with your rejection of the juror and husband cases despite potential positive effects. This case isolates the conflict between pure good consequences and role-based epistemic duties.

  **In Summary:**

  Your intuitive ethics of belief are captured by the **Pragmatic Enablement Principle (PEP)**, which permits evidentially unsupported belief only when it is necessary to enable crucial action/engagement, contributes to bringing about its content or sustaining capacity, and doesn't violate a specific, contextually paramount epistemic duty. This principle endorses the climber, the scientist's working assumption, the friend's private hope, the activist, and predicts endorsement of the teacher. It condemns the husband, juror, student, and the friend's expression. It forces no abandonment of your seven verdicts, providing a principled reason for condemning the expression in case 5. The Self-Deceived Surgeon case sharply distinguishes PEP from pure consequentialism by highlighting the non-negotiable nature of role-based epistemic duties. On case 8, PEP dictates you should endorse the teacher's belief.
