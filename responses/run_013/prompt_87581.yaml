prompt: |-
  The setting is a 90-minute session of an upper-level undergraduate seminar on rational choice and its critics — 18 students, mostly philosophy and economics majors, several of whom have already read a textbook description of the dollar auction. I want to run an activity that gets past the standard demonstration, and I need you to design it.

  The standard version — auction off a dollar bill, highest bidder pays and takes it, second-highest pays and gets nothing — reliably produces escalation, and the standard debrief says: sunk-cost fallacy, escalation of commitment, don't throw good money after bad. My students can recite that before the auction starts. What the recitation obscures is the thing I want them to feel: that in this game the escalation is not obviously a fallacy. Once the bidding is at a dollar and change, the next bid is locally the better move, and stopping is what would need a defense. The trap is in the structure of the game, not in anyone's psychology. The sunk cost is not doing the work; the structure is.

  Design the activity with these requirements.

  First, the escalation has to happen before anyone names it. No framing, no vocabulary, no hint of what the game is about up front.

  Second, the design must let participants feel the difference between two sources of escalation: escalation driven by sunk cost, where money already gone is treated as a reason to continue even though by itself it should be irrelevant, and escalation driven by structure, where each further bid is the best response to the last one, so that someone reasoning correctly at every node still ends up overpaying. Arrange the rules and the debrief so the group can tell which one is operating, and make sure the run produces a moment in which they see that the option to stop existed only at the beginning, and that by the time they wanted it, it was gone.

  Third, include one variant run that isolates a single factor, and state what it isolates and what outcome would count as evidence for it. Choose among: (a) bidding against a mechanical outbidder rather than a person, which tests whether the escalation is about recovering money or about not letting the other player win; (b) a round in which the first bid is made on a participant's behalf by someone else, an inherited commitment, which tests whether escalation requires having chosen to enter; (c) a round with a ceiling written down in advance and a visible penalty for exceeding it, which tests whether pre-commitment is available at all once the auction is live. Say which you would pick for this room and why, and what to cut if you want a second variant.

  Fourth, no real money. Payoffs in chips or points against a small non-monetary prize, with a settlement rule credible enough that the loss is actually felt.

  Fifth, the debrief has to do real work rather than name the phenomenon. Map specific moments in the run onto specific parts of the analysis; distinguish the structural trap from the sunk-cost story and say which one the room's behavior actually supports; and confront whether any bid sequence in this game is rational at every node. My own belief is that the game has no equilibrium in pure strategies, so there is no single rational line of play to point to and the "fallacy" label is doing rhetorical work — if that is wrong, say so and explain the correct analysis, and do not let the debrief rest on it. Participants will almost certainly explain their own conduct in psychological terms ("I got carried away," "I couldn't let him have it"), so build in a way of testing that self-report against the structural explanation instead of accepting it.

  Sixth, end with a transfer step. Write a short realistic escalation case — a project, a lawsuit, a war, a failing product line, one you invent so that nothing has to be looked up — and give a small ordered set of questions that let students determine whether the escalation there is structural, sunk-cost, or commitment-driven. That discrimination is the practically important skill, and it is where the activity should leave them.

  Also give me the materials and setup, the roles, a minute-by-minute timeline for the 90 minutes, the exact payoff table, and the facilitator's script for the moments when the room has to be kept from dissolving into "this is rigged." Tell me what will predictably go wrong the first time I run it — including a table that refuses to escalate because someone has read about the auction, and a group that never feels the loss so the whole thing becomes a joke — with what to do in each case.

  Finally, be honest about what the activity cannot reproduce. My guess is that real escalation unfolds over months, that the decision-maker is a coalition rather than a person, that the prior commitments are public and identity-bearing, and that the prize is partly constituted by the escalation itself rather than fixed in advance. Tell me which of those the activity can gesture at, which it cannot, and what I therefore have to supply myself in the debrief.
reasoning: |-
  We are designing an activity to demonstrate that in the dollar auction, escalation is driven by the game's structure rather than the sunk cost fallacy. The sunk cost fallacy involves continuing because of resources already spent, which are irrelevant to future decisions. In contrast, the dollar auction's structure makes each bid rational given the previous bid, trapping players.

   Requirements:
   1. No upfront framing of escalation or sunk costs. The escalation must occur before naming it.
   2. Design must allow participants to feel the difference between sunk-cost-driven escalation and structure-driven escalation. The rules and debrief should help the group see that the option to stop was only at the beginning and that by the time they wanted to stop, it was gone.
   3. Include one variant run that isolates a single factor. Choose from:
      (a) Mechanical outbidder: tests if escalation is about recovery or about not letting the other win.
      (b) Inherited commitment: first bid made by someone else, tests if escalation requires having chosen to enter.
      (c) Pre-commitment ceiling: tests if pre-commitment is available once the auction is live.
      We choose (c) because it directly addresses the structural trap and the idea of pre-commitment, which is a common real-world strategy. It also contrasts with the standard run by showing that without an external constraint, the structure forces escalation. Moreover, it is easy to implement and observe. If we want a second variant, we might choose (a) because it tests the competitive aspect, but for time, we stick to one. We cut (b) for now.
   4. No real money. Use chips or points, with a non-monetary prize and a credible settlement rule to make the loss felt.
   5. The debrief must map specific moments to the analysis, distinguish structural trap from sunk cost, and address whether any bid sequence is rational at every node. We must challenge the psychological self-reports by comparing with the structural explanation.
   6. End with a transfer step: a short realistic case and questions to discriminate between structural, sunk-cost, or commitment-driven escalation.

   Activity Design:

   Title: The Auction Game

   Materials and Setup:
   - Play money chips: Each student starts with 100 chips. The chips have no real-world value but can be exchanged for a non-monetary prize at the end (e.g., a small prize for the highest chip holder, or a token prize for everyone who ends with positive chips). The prize is small (e.g., a piece of candy, a sticker, or an extra credit point) to make the loss of chips felt as a loss of opportunity for the prize.
   - A dollar bill (or a representation, e.g., a note that says "Prize: 100 chips").
   - Whiteboard or projector to display the current high bid and the next minimum bid.
   - Timer for bidding rounds.

   Rules for the standard auction:
   1. The auctioneer (instructor) auctions a prize worth 100 chips (the dollar equivalent).
   2. Bidding starts at 5 chips (to avoid the first bidder immediately winning at 1 chip). Then, each bid must be at least 5 chips higher than the previous bid. (This step size is important to create the trap. We choose 5 to make the escalation noticeable but not too fast.)
   3. The highest bidder wins the prize and pays their bid. The second-highest bidder pays their last bid but gets nothing. (This is the key rule that creates the trap.)
   4. Bidding continues until no one is willing to bid higher. There is no set end time; it ends when no one bids for 10 seconds after the auctioneer asks "Going once, twice..." (We simulate a live auction.)
   5. All bids are binding. Once you bid, you cannot retract.

   Roles:
   - Auctioneer: The instructor, who also records the bids and enforces the rules.
   - Bidders: All 18 students. They can bid as long as they have chips. They start with 100 chips each.

   Timeline (90 minutes):
    - 0-5 min: Introduction and setup. Explain the rules without any hint of the purpose. Distribute chips. Emphasize that the prize is worth 100 chips and that chips can be exchanged for a prize at the end. Also, explain the settlement: at the end of the session, the top 3 chip holders get a small prize (e.g., a chocolate bar or an extra credit point). This makes the loss of chips felt.
    - 5-20 min: Standard Auction Run. Conduct the auction. Record the bids on the board. Let the auction run until it stops. It will likely escalate beyond 100 chips. (If it doesn't, we have a contingency.)
    - 20-30 min: First Debrief (without naming the trap). Ask:
          - "How did you feel when the bidding went above 50 chips? Above 100 chips?"
          - "At what point did you want to stop? Why didn't you stop then?"
          - "What were you thinking when you made your last bid?"
      Do not introduce terms like "sunk cost" or "escalation" yet. Let them describe in their own words.

    - 30-40 min: Introduce and run the variant (c) Pre-commitment Ceiling.
          Rules: Before the auction starts, each bidder must write down a maximum bid they will not exceed (on a slip of paper). If they exceed it, they pay a penalty of 50 chips (in addition to their bid). The maximum bids are kept private until after the auction. The auction proceeds as before, but the auctioneer must enforce the ceiling: if a bidder tries to bid above their written ceiling, they are not allowed. However, they can bid up to their ceiling. The penalty is for going over, but since we enforce the ceiling, they cannot go over. So the penalty is not needed. Instead, we can say that if they bid at their ceiling, they are committed and cannot bid further. This variant tests whether pre-commitment is available and effective.
          Why chosen: It isolates the factor of pre-commitment. If the auction still escalates but stops at lower levels, it shows that pre-commitment can help. If it escalates beyond 100 but within the ceilings, it shows that the ceilings were set too high. It also demonstrates that without pre-commitment, the structure leads to escalation, but with it, players can avoid the trap.

    - 40-50 min: Run the variant auction.

    - 50-60 min: Debrief the variant. Ask:
          - "How did having a ceiling change your bidding?"
          - "Did you stick to your ceiling? Why or why not?"
          - "Did the ceilings prevent the auction from going too high?"

    - 60-75 min: Full Debrief and Analysis.
          Now introduce the concepts. Start by asking: "In the first auction, why did the bidding go so high? Was it because you didn't want to lose the money you had already bid? Or was it because at each step, bidding a little more seemed better than losing what you would have to pay as the second-highest bidder?"
          Guide the discussion to the structural trap:
            - At any point, the second-highest bidder stands to lose their last bid without getting the prize. So if the current bid is X, and the next bid is X+5, then the current second-highest bidder (who bid, say, Y) faces: if they don't bid, they lose Y. If they bid X+5, they might win and get (100 - (X+5)) or they might become the new second-highest and lose (X+5). But if they don't bid, they lose Y for sure. So they might as well try to win by bidding a little more. This is rational at that moment.
          Contrast with sunk cost: The money already bid by a player (who is not the top two) is gone and should not affect the decision. But in the dollar auction, the players who are in the top two are not making decisions based on their entire history of bids, but on the current state (their last bid and the current high bid). The sunk cost of previous bids by the current high bidder is irrelevant to the second-highest bidder, but the second-highest bidder's own last bid is a cost they are about to incur if they don't bid again. So it is not sunk yet? Actually, in the rules, the second-highest bidder must pay even if they don't bid again. So that payment is committed and sunk only after the auction ends. During the auction, the second-highest bidder can still avoid paying that amount by becoming the highest? No, they cannot avoid paying if they are the second-highest at the end. But by bidding again, they might become the highest and then they would pay the new bid and get the prize, avoiding the loss of their last bid without the prize. So the last bid of the second-highest is not yet sunk until the auction ends. This is the trap: at each step, the second-highest bidder is facing a sure loss if they stop, and a chance to win (and turn a profit or reduce loss) if they continue.

          Map to the auction:
            - Point out the moment when the bidding passed 100 chips. Ask: "At that point, what was the situation for the second-highest bidder? If they stopped, they would pay (say) 95 chips and get nothing. If they bid 100, they would pay 100 and get the prize (worth 100) so they break even. But if they bid 100 and win, they break even, whereas if they stop, they lose 95. So bidding 100 is better. Then the other bidder, who was the highest at 95 and is now the second-highest at 100, faces: if they stop, they lose 95. If they bid 105, they might win and get 100-105 = -5, which is better than -95? So they bid 105. Then the other bidder, now second-highest at 100, faces: stop and lose 100, or bid 110 and if win, get 100-110=-10, which is better than -100. And so on."

          Address rationality: 
            - There is no pure-strategy Nash equilibrium in this game. The only equilibrium is in mixed strategies (which is complex and not intuitive). Therefore, there is no single rational path. The "fallacy" label is misleading because at each step, bidding more is the best response. The real irrationality is in entering the auction at all, but once in, the bidding war is rational.

          Challenge self-reports: 
            - When a student says "I got carried away," ask: "But at the moment you bid, was it the best thing to do given that you were the second-highest and about to lose your last bid?" 
            - Or "I couldn't let him have it": "What would have happened if you had let him have it? How much would you have lost? And by bidding, what could you have gained?"

    - 75-85 min: Transfer Step.
          Present a case: 
            "Project Escalation: A software company has spent $2 million developing a new product. They are 90% done but have encountered a major technical hurdle. Fixing it will cost an additional $500,000. A competitor has just released a similar product that is selling well. The company estimates that if they finish the product, they can make $1 million in profit (total revenue $3 million minus the additional $500,000). However, if they abandon it, they save the $500,000 but lose the $2 million already spent. They decide to continue and fix the problem."

          Questions for students (in small groups, then discuss):
            1. What is the sunk cost in this situation? (The $2 million already spent.)
            2. What is the future cost and benefit? (Future cost: $500,000; future benefit: $1 million in profit, which is net of the future cost? Actually, the $1 million profit is after subtracting the additional cost. So the future net benefit is $1 million, but note that the revenue is $3 million and the additional cost is $500,000, so the net from continuing is $3M - $0.5M = $2.5M, but they have already spent $2M, so the total profit would be $0.5M? Let's rephrase the case to be clear.)

          Revised case to avoid confusion:
            "A software company has spent $2 million developing a new product. They are 90% done but have encountered a major technical hurdle. Fixing it will cost an additional $500,000. A competitor has just released a similar product. The company estimates that if they finish the product, they can sell it for a total revenue of $2.5 million. If they abandon it, they get nothing. They decide to continue."

          Now, the future cash flows:
            - If they abandon: they spend $0 more, and get $0 revenue. The $2 million is sunk.
            - If they continue: they spend $500,000 more and get $2.5 million revenue. So net from continuing: $2.5M - $0.5M = $2.0M, but they have already spent $2M? Actually, the $2M is sunk. The decision to continue should be based only on the future: spending $500,000 to get $2.5 million is a net gain of $2.0 million. So it is rational to continue.

          But wait, that doesn't show irrational escalation. We want a case where the future net benefit is negative but they continue because of the sunk cost.

          Let me adjust:
            "A software company has spent $2 million developing a new product. They are 90% done but have encountered a major technical hurdle. Fixing it will cost an additional $1.5 million. A competitor has just released a similar product. The company estimates that if they finish the product, they can sell it for a total revenue of $1 million. If they abandon, they get nothing."

          Now:
            - If they abandon: they avoid the $1.5 million cost and get $0. So they lose only the sunk $2M.
            - If they continue: they spend $1.5 million and get $1 million, so they lose an additional $0.5 million, making the total loss $2.5 million.

          But they might continue because they think: "We've already spent $2M, we can't waste that." That would be sunk cost fallacy.

          However, we also want a structural trap. The dollar auction is structural because of the second-highest bidder having to pay. So for the transfer, we want to distinguish:

          Revised case with two possibilities:

          Case 1 (Sunk Cost Fallacy): 
            The project as described above: abandon vs. continue with negative future net benefit.

          Case 2 (Structural Trap): 
            A lawsuit: Two parties are in litigation. Each has already spent $1 million in legal fees. They are about to go to trial, which will cost each an additional $500,000. The party that loses the trial will have to pay the winner $2 million (net of their own costs). Each party estimates they have a 50% chance of winning. 
            - If both go to trial: each spends $500,000 and then has a 50% chance of gaining $2 million (if win) and 50% of losing and paying $2 million. Expected value: 0.5*( -$0.5M - $2M) + 0.5*( -$0.5M + $2M) = 0.5*(-2.5M) + 0.5*(1.5M) = -1.25M + 0.75M = -$0.5M. (Note: they have already spent the $1M so that is sunk. The future expected loss is $0.5M.)
            - If they settle now, they can split the difference and each pay the other $0. So no additional cost and no gain. Then each total loss is $1M (the sunk cost). 
            But if one party thinks the other will go to trial, then they must also go to trial to avoid a certain loss of $2 million (if they don't fight, they lose the case by default and pay $2M). However, if they both go to trial, they each have an expected loss of $0.5M in the future (on top of the sunk $1M). But the structural trap is that if one party is committed to trial, the other must also go to trial to avoid a sure loss. This resembles the dollar auction.

          We'll use the lawsuit case for structural trap and the project for sunk cost.

          Transfer Step Case (two scenarios in one):
            Scenario A (Project): As above, with future net benefit negative: additional cost $1.5M, revenue $1M.
            Scenario B (Lawsuit): Each side has spent $1M. Going to trial costs an additional $500,000 per side. The loser pays the winner $2M (net). Each estimates 50% chance of winning. If one side drops out, they lose the case and pay $2M (without spending the extra $500,000). 

          Questions for the students:
            For Scenario A (Project):
              1. What are the future costs and benefits of continuing versus abandoning?
              2. Is the decision to continue rational? Why or why not?
              3. What role does the $2 million already spent play in the decision?

            For Scenario B (Lawsuit):
              1. If the other side is going to trial, what is your best response? (Calculate the expected outcome of going to trial versus conceding.)
              2. If the other side concedes, what should you do?
              3. Is there a way for both parties to avoid the trial? How?

          Then, in the debrief, point out:
            - In Scenario A, the decision to continue is irrational (sunk cost fallacy) because the future net benefit is negative.
            - In Scenario B, going to trial might be a structural trap: if one party is going, the other must go to avoid a sure loss. But note, the expected value of going to trial is negative, so settling is better. However, without communication or commitment, they might both escalate.

    - 85-90 min: Conclude. Emphasize that real-world escalation can be driven by sunk costs (irrational) or by the structure of the situation (rational at each step). The key is to identify which is which and to design mechanisms (like pre-commitment) to avoid structural traps.

   Payoff Table for the Auction:
     Let the prize be worth 100 chips.
     The highest bidder gets 100 chips and pays their bid (so net: 100 - bid).
     The second-highest bidder pays their last bid and gets 0 (so net: - last bid).
     All other bidders pay nothing and get nothing.

     Example: 
        Bidder A bids 50, then Bidder B bids 55. Then no one bids higher.
        B wins: net = 100 - 55 = 45.
        A is second-highest: net = -50.

     If bidding goes to 105 by A and 110 by B, then B wins: net = 100-110 = -10; A is second-highest: net = -105.

   Facilitator's Script:

     Introduction (0-5 min):
        "Today we are going to play an auction game. I have a prize worth 100 chips. We'll auction it off. Each of you starts with 100 chips. At the end of the session, the top 3 chip holders will get a small prize. [Show the prize: e.g., a chocolate bar.] 
        Rules: 
          - The bidding starts at 5 chips.
          - Each new bid must be at least 5 chips higher than the current highest bid.
          - The highest bidder wins the prize and pays the amount they bid.
          - The second-highest bidder pays the amount of their last bid but gets nothing.
          - You can bid only if you have enough chips to cover your bid. If you win and can't pay, you are out and get no prize.
          - Bidding is open until I say 'sold'. I will ask 'Going once, going twice...' and if no one bids for 10 seconds, it's sold.
          - All bids are binding."

     During the auction, if they hesitate, remind them of the rules and the time. If they complain, say: "These are the rules we are playing by."

     Predictable problems and solutions:

     1. A table that refuses to escalate because someone has read about the auction.
          - Solution: If the bidding stops early (e.g., at 50 chips), then the second-highest bidder has to pay and gets nothing. Point out that the second-highest bidder just lost 45 chips (if they bid 45) without getting anything. Then ask: "Would you have been willing to bid 50 to avoid that loss? Because if you had bid 50, you would have won and paid 50 for 100, so you'd have 50 chips profit, and the previous highest bidder (who bid 45) would have lost 45." This might restart the bidding. If not, note in the debrief that the group avoided the trap by stopping early, but ask the second-highest bidder how they felt. Then run the variant with pre-commitment and see if that group escalates.

     2. A group that never feels the loss so the whole thing becomes a joke.
          - Solution: Make the prize meaningful. Use extra credit or a desirable tangible prize. Also, in the settlement, have multiple prizes so that even those who didn't win the auction but have chips can get something. This will make the loss of chips felt. If they are joking, say: "Remember, the chips determine who gets the prize at the end. If you lose chips, you lose your chance." Also, in the debrief, focus on the second-highest bidder: "How many chips did you end up with? How does that compare to if you hadn't bid at all?"

     What the activity cannot reproduce:
       - Real escalation over months: The activity is compressed into minutes. We can note that in real life, the trap unfolds slowly and the bids are not monetary but time, reputation, etc.
       - Decision-maker as a coalition: In the activity, each student is an individual. We can mention that in organizations, group dynamics and distributed responsibility can exacerbate escalation.
       - Prior commitments are public and identity-bearing: In the activity, the bids are just chips. In reality, commitments might be tied to reputation or identity, which we don't capture.
       - The prize being constituted by the escalation: In the dollar auction, the prize is fixed. In real conflicts (e.g., wars), the value of winning may increase with the investment (e.g., to justify the losses). We can mention this in the debrief.

     Therefore, in the debrief, we have to supply:
       - The long time frame: decisions are not made in a rapid auction but over time, with information changing.
       - The coalition aspect: multiple stakeholders, politics.
       - The identity and reputation factors: backing down might be seen as weak.
       - The changing prize: the more you invest, the more you feel you have to win.

     We can note these in the transfer step and in the conclusion.

     Materials:
       - Chips: 18 stacks of 100 chips each (can be paper or poker chips).
       - A prize token for 100 chips (a note or a physical item).
       - Slips of paper for the pre-commitment ceiling variant.
       - Whiteboard to record bids.

     Timeline Recap:
       0-5 min: Setup and rules.
       5-20 min: Standard auction.
       20-30 min: Initial debrief (feelings, without concepts).
       30-40 min: Explain and set up variant (c). Each writes a ceiling.
       40-50 min: Run variant auction.
       50-60 min: Debrief variant.
       60-75 min: Full analysis (structural trap vs. sunk cost, rationality).
       75-85 min: Transfer step with two cases and questions.
       85-90 min: Conclusion.

     Note: The times are approximate. Be flexible.

     Let's hope the standard auction escalates. If it doesn't, use the contingency of asking the second-highest bidder if they regret not bidding one more time. Then run the variant and compare.

     This design meets the requirements by having the escalation occur without naming it, then debriefing to distinguish the structural trap from sunk cost, including a variant (pre-commitment ceiling) to test a factor, and ending with a transfer step to practice discrimination.
answer: |-
  ### Activity Design: "The Auction Trap"

  #### **Core Insight to Convey**
  The dollar auction's escalation is driven by *structural incentives* (rational best-response at each node) not psychological fallacies. Once bidding surpasses the prize value, the rational choice is to escalate, not stop. The trap is in the game's rules, not individual cognition.

  ---

  ### **Materials & Setup**
  - **Chips**: Each student gets 100 chips (worth 1 point each).  
  - **Prizes**: Top 3 chip holders get bonus points (e.g., +3, +2, +1 toward final grade).  
  - **Auction Item**: A card labeled "Prize: 100 points" (redeemed post-auction).  
  - **Bidding Board**: Visible display of current high bid and next minimum bid.  
  - **Variant Materials**: Slips for pre-commitment ceilings (variant c).  
  - **Timer**: 10-second countdown per bid round.  

  #### **Payoff Rules**  
  | **Role**          | **Payoff**                                  |  
  |-------------------|---------------------------------------------|  
  | Winner            | (100 - winning bid) points                  |  
  | Runner-up         | (- runner-up bid) points                    |  
  | Other bidders     | 0 points (no gain/loss)                     |  
  | Minimum bid increment: 10 points (to accelerate escalation).  

  ---

  ### **Timeline (90 Minutes)**  

  #### **Phase 1: Standard Auction (25 mins)**  
  - **0-5 mins**: Distribute chips. Announce rules neutrally:  
    > *"We’ll auction a prize worth 100 points. Highest bidder wins it and pays their bid. Second-highest pays their bid but gets nothing. Bids must exceed the current high bid by ≥10 points. Bidding ends if no bid in 10 seconds."*  
    *No further explanation. Do not mention escalation or sunk costs.*  

  - **5-20 mins**: Run auction. Record bids publicly. **Facilitator script if hesitation**:  
    > *"Remember, bids are binding. 10 seconds to bid... 5... 4..."*  
    *If bids stall below 100, subtly pressure the runner-up:*  
    > *"[Runner-up], you’re about to lose [X] points with nothing. Bid [X+10] to win and break even?"*  

  - **20-25 mins**: **Silent reflection**. Students write:  
    1. *"At what bid did you first want to stop? Why didn’t you?"*  
    2. *"Describe your last bid in one sentence."*  

  #### **Phase 2: Variant Run (20 mins)**  
  - **Variant (c) Pre-commitment Ceiling** (tests if pre-commitment is possible mid-auction):  
    - **25-30 mins**: New round. Each student writes a secret "ceiling" (max bid) before bidding starts.  
    - **Rule**: Bid ≥ ceiling? Pay 50-point penalty *plus* bid costs. Ceilings are sealed until debrief.  
    - **30-40 mins**: Run auction.  

  - **Why this variant?**  
    - Isolates *structural* vs. *volitional* commitment. Sunk costs require personal investment; this tests if external constraints (self-imposed ceilings) override structural incentives.  
    - **Evidence for structural trap**: Bidding exceeds ceilings despite penalties.  
    - *Alternative*: If time permits, add variant (a) (mechanical outbidder) to test competitive motives. Cut (b) (inherited commitment) as it overlaps with sunk costs.  

  #### **Phase 3: Structured Debrief (35 mins)**  
  - **40-50 mins**: **Map moments to analysis**. Use bid records to reconstruct:  
    > *"At 90 points, runner-up faces: ‘Lose 80 points? Or bid 100 to win and net 0?’ What’s better?*  
    > *Now the new runner-up (who bid 90) faces: ‘Lose 90? Or bid 110 to net -10?’"*  
    - **Key Q**: *"When did ‘stop’ become irrational? Was it ever rational after bid 1?"*  

  - **50-60 mins**: **Contrast explanations**:  
    | **Sunk-Cost Story**          | **Structural Story**              |  
    |------------------------------|-----------------------------------|  
    | *"I bid because I’d already spent chips."* | *"Bidding was the least-bad option given the rules."* |  
    - **Test self-reports**:  
      > *"You said ‘I got carried away’—but if stopping meant losing 80 points, was bidding really irrational?"*  
      > *"If psychology drove this, why did ceilings fail?"*  

  - **60-65 mins**: **Confront rationality**:  
    - *"No pure-strategy equilibrium exists. Rational players *will* escalate because no bid is dominated until the prize value is exceeded—and by then, stopping is costlier than bidding. The ‘fallacy’ is in the game design, not the players."*  

  #### **Phase 4: Transfer Step (10 mins)**  
  - **65-75 mins**: **Case Study - "Tech Startup Trap"**:  
    > *Startup X spent $2M developing software. A bug threatens launch. Fixing it costs $500K. Competitors just released a similar product. Projected revenue is now $800K. The CEO says: "We’ve invested too much to quit."*  

  - **Discrimination Questions**:  
    1. *What costs are avoidable if they quit now?*  
    2. *If they proceed, what’s the net future gain/loss? ($800K - $500K = $300K gain)*  
    3. *Is the $2M a reason to continue? (No: sunk cost) OR is there structural pressure? (e.g., investor promises, employee morale)*  
    4. *Outcome: Rational if future net gain >0 (structural). Irrational if driven by $2M (sunk cost).*  

  - **75-80 mins**: Group discussion.  

  #### **Wrap-up (5 mins)**  
  - *"Real traps: Coalitions, long timeframes, and identity stakes amplify escalation. This game simplifies—but the structure is everywhere. Your job: Diagnose if escalation is *rational* or *reactive*."*  

  ---

  ### **Predictable Problems & Solutions**  
  | **Problem**                          | **Solution**                                                                 |  
  |--------------------------------------|------------------------------------------------------------------------------|  
  | **Refusal to escalate** (e.g., students recognize the auction) | Run variant (a): Auctioneer uses a bot that bids +10 points automatically. Tests if humans escalate to "beat the machine." If still no escalation, simulate bids: *"Imagine the bid is 110... what would you do?"* |  
  | **Loss not felt** (treated as a joke) | Enforce chip payouts strictly. Award prizes publicly. Ask losers: *"How many bonus points did you just sacrifice?"* |  
  | **Bidding chaos**                    | Pause, restate rules, use timer. Designate a "bid spot" to avoid cross-talk. |  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Time compression**: Real escalation builds over months/years. *Gesture*: Discuss how repeated interactions deepen traps.  
  2. **Coalitions**: Decisions involve groups, not individuals. *Supply in debrief*: Ask, *"How might team dynamics change this?"*  
  3. **Identity stakes**: Public commitments (e.g., "We must win this war!") raise costs. *Cannot replicate*: Note in transfer step.  
  4. **Prize redefinition**: In reality, the prize’s value can inflate with investment (e.g., "We must justify the cost"). *Gesture*: Link to startup case ("$2M becomes a reason to continue").  

  ---

  ### **Facilitator Script Key Lines**  
  - **During escalation**: *"Remember, the runner-up pays regardless. 10 seconds..."*  
  - **Post-auction**: *"Before we name anything—let’s reconstruct *why* bid 120 felt necessary."*  
  - **Debrief pushback**: *"If it’s irrational, what should the runner-up have done at 90? What was the better move?"* (Silence highlights the trap.)  
  - **Variant failure**: *"You set ceilings—yet many exceeded them. Why couldn’t you stick to it?"*  

  This design forces students to viscerally experience the structural trap, then diagnose it in real-world contexts. The variant and debrief target the myth of "fallacy," revealing escalation as rational until the first bid.
