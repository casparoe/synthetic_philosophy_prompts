prompt: |-
  my buddy and I got in a two-hour fight last night about Boltzmann brains and I want an actual number from you, not a vibe. Heres the fight.

  He says the Boltzmann brain 'problem' is a fake problem, because the whole argument saws off its own branch: if I'm probably a BB, then my brain is a random fluctuation and none of my reasoning — including the physics that got me to 'I'm probably a BB' — is trustworthy, so the argument is self-undermining and we can ignore it. I said that's a cheap dodge. A BB by definition has exactly the experiences I'm having right now — memories of a childhood, a universe that looks smooth and orderly, this conversation — so 'but my experiences look orderly' is not evidence against being a BB, that's the entire point, BBs hallucinate order. He said fine, then you've also lost the right to trust any of your cosmology, so you can't even run the calculation that produces the worry. We went in circles and I want your credence.

  Proposition: 'In the actual world there are vastly more Boltzmann-brain-type observers — momentary or short-lived observers that fluctuate into existence with coherent but false memories — than ordinary evolved observers like the ones we take ourselves to be, by many orders of magnitude.'

  For what it's worth I'd put myself around 0.15 and he'd put himself at basically 0, and I suspect that gap is doing most of the work in our fight.

  Give me a number between 0 and 1, then the decomposition, a rough probability and one line each for the sub-questions I think it splits into:

  (a) How likely is it that the correct cosmological theory, or the correct measure, actually implies the kind of long-lived, accelerating, fluctuation-friendly conditions where observers get popped out over absurd timescales — versus a universe that just doesn't last that long or doesn't fluctuate that way?

  (b) Conditional on such a theory, how much of the BB prediction is a real consequence of it and how much is an artifact of choosing the wrong measure over observers — and how would I even tell those apart from the inside?

  (c) The self-locating part: given BBs vastly outnumber us, what's the right way to convert that into 'I'm probably one'? Do I count observer-moments, brains, humans? Does the reference class change the answer?

  (d) The physical part: is a BB, or even a single coherent observer-moment, actually physically possible given what we think about entropy, the cosmological constant, and how large a fluctuation you'd need?

  (e) The self-undermining part: how much should the fact that a BB's reasoning is garbage count as evidence about this question at all — does it put a ceiling on your number, or is it just a tu quoque that cuts both ways?

  Then combine them and tell me which single term the final number is most sensitive to. And be self-critical about it: I want to know where your reasoning is most likely to fail and what would actually move your number, up or down. If you'd give a different answer to this question as a 'BB' than as an ordinary person, say so and say whether you think that difference means the question is incoherent — because that's the crux of our fight and he definately thinks it is.

  American English, please, and don't just tell me this is a live debate in philosophy of cosmology. I know. I want your number.
