prompt: |-
  Next Thursday I'm giving a talk to a mixed room — mostly vision scientists, a couple of Locke-reading empiricists from the phil dept, and one guy from the haptics lab who does sensory substitution work — defending this: the standard Molyneux question (the "no" answer) is the boring direction, and the case nobody ever actually runs, the inverse one — someone who has only ever seen, never touched, who then gains touch — goes the other way. My argument is that the standard case confounds failing to *recognize* the shape with not yet having a shared vocabulary to *report* it, while the inverse case has no such excuse, so the asymmetry rather than the cataract cases is what should decide the debate, and it says shape concepts are vision-born and touch is a borrower.

  Draft my Q&A prep: the objections in the order they'll actually come out of this room, in each faction's own vocabulary, each with the shortest reply that survives plus a flag on where that reply is soft, the concession I should just make up front, and the one question I'm praying nobody asks. Keep the factions distinct — the vision people will have one way of saying "thats just acuity", the empiricists another, and the haptics guy thinks I've assumed my conclusion in the setup.

  Lead with the bottom line in the first sentence — which objection actually kills the talk if I flub it — then the list, no throat clearing.
