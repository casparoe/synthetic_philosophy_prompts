answer: |-
  Here’s your Q&A prep, stripped to the bone. **The objection that kills your talk if flubbed is the Empiricists' "post-hoc concept formation" argument.** Fail there, and your asymmetry claim collapses.  

  ### **1. Vision Scientists’ Objection**  
  *Objection:* "Your inverse case just shows touch has poorer spatial acuity. No surprise vision-trained subjects fail haptically—they’re tactile novices with low-res input."  
  **Reply:** "Acuity can’t explain the *asymmetry*: standard Molyneux subjects (touch→vision) fail despite vision’s high acuity, while inverse subjects (vision→touch) *could* succeed if shape concepts were tactilely native. Yet they don’t."  
  **Soft spot:** Dodges *why* touch doesn’t bootstrap shape concepts independently.  
  **Concession:** "Yes, touch matures slower—but that doesn’t create vision-dependent concepts."  

  ### **2. Locke-Empiricists’ Objection**  
  *Objection:* "You assume shape concepts are ‘born’ somewhere. Locke’s point: *all* spatial concepts are modality-neutral constructs from associative learning. Your inverse subject just needs time to correlate new touch data with visual memories."  
  **Reply:** "Then why does the *standard* case (touch→vision) show instant recognition failure? Associative learning should be bidirectional. The inverse case’s failure proves vision isn’t just another input—it’s the scaffold."  
  **Soft spot:** If they argue touch→vision subjects *also* succeed post-learning, it neutralizes asymmetry.  
  **Concession:** "Agreed, modality-specific *ideas* exist (Locke II.ix.8). But the *concept* isn’t."  

  ### **3. Haptics Lab Objection**  
  *Objection:* "You rigged the inverse case by assuming vision’s primacy. Sensory substitution shows touch *can* build spatial concepts independently (e.g., blind users ‘see’ via sound/tactile arrays). Your ‘inverse’ subject’s failure is artificial."  
  **Reply:** "Sensory substitution *uses* cross-modal translation (e.g., visual-to-auditory coding). My inverse case isolates *naive* touch—no translation tools. Failure there reveals touch’s conceptual dependence."  
  **Soft spot:** If touch can build spatial concepts in blindness, why can’t it here?  
  **Concession:** "True, touch is capable—but *developmentally*, it often borrows vision’s spatial framework."  

  ---

  **The Question You Pray Nobody Asks:**  
  *"If spatial concepts are truly amodal (as both empiricists and modern models claim), why should we expect* any *asymmetry? Shouldn’t both directions fail equally?"*  
  **Why it’s lethal:** Forces you to either abandon amodal space (empiricists revolt) or admit your asymmetry relies on unproven developmental biases (vision scientists pounce).
