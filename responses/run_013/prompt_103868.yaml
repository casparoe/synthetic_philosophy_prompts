prompt: |-
  My block's tenants' union is voting Thursday on whether to merge with the tenants' group in the building next door. The thing we can't get past is who's allowed to vote on the merger itself. The old guard says only current members, since it's our union and our rules. The newcomers, who've been coming to meetings for months and will be bound by whatever we decide, say thats circular — the whole question is whether they count, so you can't settle it by saying they don't count. Someone suggested we just let anyone affected by the decision vote, and then someone else said fine, so the landlord gets a vote, and the shops on the street, and honestly anyone downstream of a rent strike. Now we're all just staring at each other. Is there a way out of this that isn't just whoever happens to have the votes deciding who gets to have the votes? And if there isn't, what should we actually do on Thursday? I suspect this has a name and a literature behind it — tell me what it is and how the people who've thought about it handle it, but what I really want to know is what to do.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're part of a tenants' union voting on a merger with the neighboring building's group. The main issue is deciding who gets to vote on the merger itself. The old guard insists only current members should vote, while newcomers argue that's circular because their inclusion is precisely what's being decided. Then someone proposed letting anyone affected vote, which led to the absurd suggestion that even the landlord or local shops might have a say. Now they're stuck in a deadlock and need a practical solution by Thursday.

  First, I need to recognize the underlying philosophical dilemma here. It's a classic boundary problem in democratic theory: defining the demos. Who constitutes the "people" in this decision? The old guard's position relies on existing rules, but those rules exclude the newcomers who are directly affected. The newcomers' point about circularity is valid. If the decision affects them, excluding them from the vote is self-reinforcing. 

  Then there's the slippery slope when someone suggested including all affected parties. That opens the door to impractical inclusions like the landlord, which isn't feasible. So the core conflict is between procedural legitimacy (following current rules) and inclusive legitimacy (ensuring all stakeholders have a voice). 

  The user mentioned this might have a name and literature. Yeah, it's the boundary problem in democratic theory. Scholars like Robert Dahl and Frederick Whelan have written about it. Whelan points out that you can't solve the boundary problem democratically without already having a defined demos. That leads to an inherent paradox. So in practice, groups use pragmatic solutions like provisional inclusion or sunset clauses.

  Now, assessing the user's actual needs. They need a practical solution for Thursday that avoids arbitrary exclusion or chaos. But deeper needs include maintaining union cohesion, ensuring fairness, and preventing future conflicts. They might also fear that forcing a vote now could split the group or undermine the merger's legitimacy. 

  Looking at possible solutions. The ideal approach is to decouple the two issues: the merger decision and the voter eligibility. But since the vote is imminent, they need a stopgap. Temporary inclusion with a ratification vote later could work. Let newcomers vote provisionally, then have the merged group ratify the decision. This gives both sides a concession: newcomers participate now, but the final say rests with the merged entity. 

  Alternatively, a supermajority requirement could ease tensions by showing that the decision has broad support even within the existing members. Or a dual majority system requiring approval from both current members and newcomers separately. But that might complicate things. 

  The key is to frame this as a procedural fix rather than taking sides. Emphasizing that it's provisional and subject to later validation might make it palatable. Also, focusing on shared goals like increased bargaining power could help align both factions. 

  Practical steps for Thursday: present the options clearly, allow discussion, and push for a consensus on the method first. If consensus fails, vote on the voting method using existing rules, but that's a last resort. Ultimately, preserving unity and moving forward is more important than a perfect solution right now.
answer: |-
  This is a classic **boundary problem in democratic theory**, specifically the "paradox of democratic inclusion" or the "constitutive dilemma." Philosophers like Robert Dahl and Frederick Whelan have grappled with it: **You cannot democratically decide who *constitutes* "the people" without already having defined "the people" who get to decide.** Your group is stuck in this exact loop.

  Here's the breakdown, the theory, and a practical path forward for Thursday:

  ### 1. Understanding the Dilemma & Its Name
  *   **The Problem:** Defining the electorate (the demos) for a foundational decision *is itself* a foundational decision that requires a pre-existing demos. It's logically circular.
  *   **The Literature:** This is core to democratic theory. Key thinkers include:
      *   **Robert Dahl:** Highlighted the "boundary problem" – who gets included in the demos cannot be solved democratically without prior boundaries.
      *   **Frederick Whelan:** Argued the initial demos is necessarily defined *procedurally* or *historically*, not democratically. There's no perfectly "fair" starting point.
      *   **Practical Politics:** Real-world groups (unions, states, clubs) solve this pragmatically, often based on existing rules, shared interests, or temporary compromises, accepting some initial arbitrariness.

  ### 2. Why the Proposed "Solutions" Fail
  *   **Current Members Only:** Valid procedurally *if* the constitution/rules explicitly grant them this power. However, it ignores the newcomers' legitimate stake and feels exclusionary, potentially poisoning the merger and future cooperation. Their "circularity" argument has moral weight.
  *   **Anyone Affected:** Logically appealing but practically absurd and infinitely expandable (landlords, downstream businesses). Democratic decision-making requires a *manageable* and *coherent* group with shared primary interests. This definition is unworkable.

  ### 3. Practical Ways Out for Thursday (Focus on Legitimacy & Pragmatism)

  **GOAL:** Reach a decision perceived as *sufficiently legitimate* by both factions to allow the merger process to move forward, even if imperfect.

  **Option 1: Provisional Inclusion with Ratification (Recommended)**
  *   **The Move:** Allow **everyone currently attending meetings regularly from *both* buildings (including newcomers)** to vote *provisionally* on the merger.
  *   **The Key:** Simultaneously vote on a **ratification clause** requiring that the merger decision (and potentially the new constitution) be formally ratified by the *newly constituted, merged membership* within a defined short period (e.g., 60 days).
  *   **Why it Works:**
      *   **Breaks the Logjam:** Lets the immediate vote happen inclusively.
      *   **Addresses Newcomers' Concern:** Their voices are heard *now* on an issue directly affecting them.
      *   **Addresses Old Guard's Concern:** The final legitimacy rests with the *officially constituted* merged union they agree to create. They get a "second bite."
      *   **Builds Trust:** Shows goodwill to newcomers ("you matter now") while upholding procedural integrity ("final say goes to the formal body").
      *   **Reflects Reality:** The people showing up *are* the functional group deciding its future.

  **Option 2: Supermajority Requirement (If Inclusion is Truly Impossible)**
  *   **The Move:** Hold the vote with **current members only**, but require a **supermajority** (e.g., 66% or 75%) for the merger to pass.
  *   **Why it *Might* Work:**
      *   **Procedurally Clean:** Follows existing rules.
      *   **Signals Strong Consensus:** Forces the old guard to demonstrate broad support *within their own ranks* for the merger, making it harder for newcomers to claim it was a narrow, exclusionary power grab. It shows the decision isn't marginal.
  *   **Downsides:** Doesn't resolve the newcomers' exclusion or their legitimate grievance. Risks resentment and low participation in the merged union.

  **Option 3: Dual Majority (Complex but Fair)**
  *   **The Move:** Require the merger to pass **two separate votes**:
      1.  A majority of **current, official members**.
      2.  A majority of **newcomers/next-door tenants who have been regularly participating**.
  *   **Why it Works:** Gives both groups a distinct veto power, recognizing their different starting points but shared future interest. Forces consensus across the boundary.
  *   **Downsides:** More complex to administer. Requires clearly defining "regularly participating" newcomers on the spot. Could be seen as creating two classes if not handled carefully.

  **Option 4: Decouple & Define First (Ideal but Time-Pressed)**
  *   **The Move:** **Postpone the merger vote.** First, hold a separate vote (using current rules) solely on **amending the membership rules** to explicitly include the next-door tenants/newcomers as full members *now* (or define a clear path). *Then*, with the demos defined, vote on the merger.
  *   **Why it Works:** Solves the boundary problem logically by defining the electorate *before* the major decision.
  *   **Downsides:** Likely impossible by Thursday. Requires the old guard to agree to potentially dilute their power *before* the merger decision, which they may resist.

  ### What to Do on Thursday: A Step-by-Step Plan

  1.  **Acknowledge the Dilemma:** Start the meeting by clearly stating the philosophical problem ("the boundary problem") and that there's no perfect solution. Frame it as a challenge of building a *stronger, more legitimate union together*.
  2.  **Present the Options:** Clearly outline Options 1 (Provisional Inclusion + Ratification), 2 (Supermajority), and 3 (Dual Majority). Briefly explain pros/cons. (Option 4 is likely off the table due to time).
  3.  **Recommend Option 1 (Provisional + Ratification):** Argue it best balances legitimacy, practicality, and future unity. Emphasize the ratification safety net.
  4.  **Debate & Amend:** Allow discussion on the options. Be open to tweaking details (e.g., exact ratification timeframe for Option 1, exact supermajority % for Option 2, definition of "regular participant" for Option 3).
  5.  **Vote on the *Voting Method* FIRST:** Before voting on the merger itself, you **MUST** vote on *which voting method/rules* to use for the merger vote. This meta-decision *has* to be made under the *current rules* (i.e., current members only). *This is the unavoidable procedural step.*
      *   **Key Message:** "Under our current rules, only official members can decide *how* we make this decision. We ask you to choose the method that best ensures a legitimate outcome for everyone involved in our future."
  6.  **Conduct the Merger Vote:** Once the method is chosen (e.g., Provisional Inclusion + Ratification), conduct the merger vote using *that* method.
  7.  **Formalize & Ratify:** If the merger passes via Option 1, immediately start drafting the merged constitution and schedule the ratification vote within the agreed timeframe.

  ### Crucial Advice

  *   **Focus on Shared Goals:** Constantly remind everyone why you're considering a merger – greater power, resources, solidarity. Don't let procedure obscure the purpose.
  *   **Emphasize Provisional Legitimacy:** For Option 1, stress that the initial vote is *operational*, not the final constitutional word. The ratification step is vital for enduring legitimacy.
  *   **Avoid "Affected Parties":** Politely but firmly shut down the "landlord gets a vote" distraction. Democracy requires a defined constituency. Tenants' unions exist *because* their interests conflict with the landlord's.
  *   **Document Everything:** Ensure clear minutes of the decisions on the voting method and the merger vote itself.

  **In essence:** You *cannot* escape the initial procedural step of using the current rules to define the electorate for *this specific foundational decision*. However, **Option 1 (Provisional Inclusion + Ratification)** offers the most balanced, pragmatic, and forward-looking way to break the deadlock while building legitimacy for the merged future. Push hard for that approach on Thursday. Good luck!
