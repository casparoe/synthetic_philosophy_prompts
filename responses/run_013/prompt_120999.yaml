  *Adjusting spectacles with a thoughtful expression*  
  Your concern is understandable, yet it misses the deeper epistemological point. The artificiality or fine-tuning of the solution is irrelevant to its philosophical significance. What matters is that the equations of general relativity *permit* a universe where time, in the ordinary sense of an objective lapse, cannot exist. In my rotating model, the cosmic matter defines a universal rest frame, yet closed timelike curves still emerge—allowing one to travel to any past or future event. This demonstrates that relativity fundamentally decouples temporal order from metaphysical becoming. 

