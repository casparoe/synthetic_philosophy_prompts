  First, I need to recall the careenium setup. It's a billiard table with tiny magnetic marbles (simms) that form clusters (simmballs). The question is whether these clusters are real causal agents or just useful descriptions. The user and their friend agree on the microdynamics and the predictive power of simmball descriptions but disagree on causation.

