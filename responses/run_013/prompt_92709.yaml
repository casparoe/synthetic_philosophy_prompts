prompt: |-
  I'm designing a two-hour workshop for a mixed group of about twenty graduate students — half of them from ecology and evolutionary biology, half from philosophy of science — and the session is on the species problem. I will not assign any reading beforehand, so everything has to be built in the room. What I want from you is not the explanation itself but a plan for teaching it: the order in which the pieces must come, the single case that carries the whole session, the misconceptions to expect and exactly where in the sequence each gets headed off, and how I will know at the end that they have understood the problem rather than merely heard about it.

  Constraints on the plan. First, the dependency order has to be argued rather than asserted: tell me which distinctions must already be in place before the question "how many species are there here?" can even be well formed. My own guess is that the difference between species as a rank and species as a particular segment of a lineage, and the difference between a criterion for sorting things and a definition of what is being sorted, both have to land early, and that the audience cannot feel the force of the problem until they have watched the same population sorted two ways under two defensible criteria. If that guess is wrong, say so and put the real first move first.

  Second, the carrying example. I don't want the usual textbook menagerie — no named ring species, no finches, no bacteria. I want to build the case on a slide from stipulations alone, so that nothing in the session depends on facts anyone has to remember: seven populations of a freshwater snail along a river, numbered from downstream, each adjacent pair interbreeding where they meet, the first and seventh never meeting, a narrow hybrid zone between the third and fourth, two populations that are morphologically indistinguishable but will not interbreed in the lab, and two that look strikingly different and interbreed freely. Tell me what the example must have, and what it must deliberately lack, for the session to work; whether my stipulations give it that; and what you would change. Then tell me why this beats the standard examples pedagogically, and where it would mislead if I lean on it too hard.

  Third, the misconceptions, in the order they will actually arise, with the precise point in the sequence at which each should be headed off rather than merely corrected. I expect at least these: that "species" is a convenient label with nothing in nature answering to it; that the trouble is that we have not yet found the right definition and that one day we will; that if species are not natural kinds then conservation listings are arbitrary; that interbreeding is the definition of a species rather than one operational test among several; that the problem is purely verbal and therefore doesn't matter; and the opposite error, that it is purely metaphysical and so has no bearing on what an agency should do on Monday. Tell me which of these are genuine misconceptions rather than positions someone may hold after understanding the problem, where that distinction matters, and which half of the room is likely to arrive holding which.

  Fourth, one question I can put to the room at the end that would separate someone who has understood the problem from someone who has merely learned the vocabulary.

  Fifth, what I should explicitly refuse to cover in two hours, and how to say so without making the omission look like evasion.

  Finally, don't hand me a menu. Take a definite position on the order, on the example, and on the underlying question — whether the species problem is a genuine problem, a knot of several genuine problems, or one that dissolves once the questions are separated — and give your reasons, including what would have to be true for your own position to be wrong. No citations and no reading suggestions; I need a plan I can teach from cold.
reasoning: |-
  Okay, let me approach this systematically. The user wants a meticulously structured workshop plan on the species problem that functions without prior reading, targeting both biologists and philosophers. 

  First, I need to establish foundational distinctions upfront. The rank-vs-segment confusion must be addressed immediately - biologists often conflate "species" as a taxonomic rank with actual lineage segments, while philosophers might miss the operational implications. The criterion-vs-definition gap is equally critical; both groups tend to blur the line between practical sorting methods and ontological claims. 

  For the case study, the seven-snail-population model works because it's stripped of distracting real-world complexities. Key features: clinal variation with end-point isolation (showing lineage continuity), asymmetric hybridization (breaking typology), and discordant traits (morphology vs interbreeding). Crucially, it lacks ring-closure mechanisms and microbial complications that would derail focus. But I should warn against overextending it - this model can't illustrate temporal depth or niche-based concepts.

  Misconceptions will surface predictably. Philosophers might prematurely declare "just semantics" when seeing conflicting criteria; that must be preempted during the sorting exercise. Biologists may cling to "one right definition" during the criteria comparison - best countered by having them generate irreconcilable counts. The conservation anxiety (ecologists) and "arbitrary label" dismissal (philosophers) need separate handling in the implications discussion.

  The diagnostic question - "Can you explain why two experts using valid methods disagree on species count here?" - tests if they grasp incommensurable operationalizations. If they revert to definitional arguments rather than methodological conflict, understanding is shallow.

  I'll explicitly exclude evolutionary dynamics and pluralism debates - not evading, but respecting time constraints. Frame it as "focusing on the conceptual knot before examining solutions."

  The core structure should be: foundations (15min) → case immersion (30min) → criteria testing (40min) → implications (25min) → diagnosis (10min). The pivot point is when they physically map different species counts onto the same diagram - that's when the problem becomes visceral.

  Underlying philosophy: this presents the problem as irreducible tension between lineage reality and human categorization needs. If species were purely nominal or easily definable, the case study wouldn't generate persistent disagreement. The enduring debate suggests something deeper.
answer: |-
  Here’s a battle-tested plan focused on making the species problem *visceral*, not just theoretical. The sequence forces participants to experience the conceptual friction firsthand.

  **Core Structure (120 min):**  
  1. **Groundwork: What’s at Stake?** (15 min)  
     - *Hook:* "Conservation agencies list species. Labs exchange model organisms. But what happens when experts disagree whether two populations are one species or two?"  
     - **Key Distinction 1 (Rank vs. Segment):** Use a river analogy: "Tributary" is a *rank* (like genus/species); the *actual water* is the segment (lineage). Biologists often conflate the label with the thing.  
     - **Key Distinction 2 (Criterion vs. Definition):** "A criterion is a *tool* (like a net for fish). A definition tells you *what you’re trying to catch*. We often use tools before agreeing on the target."  

  2. **The Snail Case: Stipulations Only** (20 min)  
     - Present your snail populations (1-7 along a river). **Crucial additions:**  
       - Snail 3 has a parasite Snail 7 resists (ecological divergence).  
       - Snails 1 & 7 *could* interbreed in lab (no intrinsic barrier), but never meet.  
       - *Omit:* Any mention of evolutionary mechanisms (e.g., selection).  
     - **Why this works:**  
       - Forces focus on *pattern* over process. No prior knowledge needed.  
       - Contains **necessary tensions:** lineage continuity (1-2-3...7), reproductive breaks (hybrid zone), trait discordance (morphology vs. interbreeding), ecological divergence.  
     - **Pitfalls:**  
       - If overused, implies species are *only* spatial segments. Acknowledge this is a "frozen slice" of a dynamic process.  

  3. **Sorting Exercise: The Crisis Point** (40 min)  
     - *Task:* "In pairs, group these snails into species. You *must* choose *one* criterion: interbreeding, morphology, or ecology."  
     - *Reveal:* Have groups report counts. Morphology lumps 1/2/3, splits 5/6; interbreeding splits at hybrid zone; ecology splits 3 vs. 7. **Counts will differ.**  
     - *Facilitation:* "Why did your counts disagree? Is anyone *wrong*?" Highlight operational criteria ≠ definition.  

  4. **Misconception Triage** (30 min – integrated with sorting debrief)  
     | **Misconception**                | **When it Arises**         | **Intervention**                                                                 | **Group Bias**          |  
     |----------------------------------|----------------------------|----------------------------------------------------------------------------------|-------------------------|  
     | "Species are arbitrary labels."  | Seeing divergent counts    | "If arbitrary, why do counts *cluster*? Why no one says 1 species or 7?"         | Philosophers           |  
     | "We just need the *right* definition." | Sorting frustration     | "Propose a definition now. Does it resolve the snail case? Why/why not?"         | Biologists             |  
     | "Interbreeding *is* the definition." | Choosing criteria      | "Apply it: Are 1 & 7 same species? They *can* breed. But 3 & 4 *can’t* in nature." | Biologists             |  
     | "This is *just* semantics."      | Post-sorting fatigue       | "Semantics = meaning. Does 'endangered species' mean the same if counts shift?" | Philosophers           |  
     | "No natural reality = conservation arbitrary." | Implications discussion | "Reality exists: lineages diverge. But our *categories* map imperfectly. We protect *lineages*, not labels." | Ecologists |  

  5. **The Underlying Problem & Diagnostic Question** (15 min)  
     - **Position:** The problem is *inescapable* because biology presents continuous lineages, but human action (conservation, laws, research) requires discrete categories. It’s a *practical* knot: how to "carve" continua without clear joints.  
     - **Diagnostic Question:**  
       > *"Imagine two experts agree on all snail facts but disagree on species count. Must one be wrong? Explain why."*  
       - **Understood:** "No. They may prioritize different *criteria* (interbreeding vs. ecology) for valid reasons."  
       - **Not Understood:** "Yes, they need better data/a unified definition."  

  6. **Explicit Omissions** (5 min – State upfront and revisit)  
     - "We’re not covering:  
       - Evolutionary *mechanisms* (e.g., *why* traits diverge).  
       - Solutions (e.g., species pluralism).  
     - Why? Because you can’t solve a problem until you *feel* it. Today is about diagnosing the fracture, not setting the bone."  

  **Why This Sequence Works:**  
  1. **Dependencies Honored:** Rank/segment and criterion/definition come *before* the case study. Without these, the sorting exercise is chaos.  
  2. **Stipulation Beats Finches:** Textbook examples come with baggage. Your snails are "conceptual lab rats" – no facts to recall, all variables controlled.  
  3. **Misconceptions Preempted:** Each arises *naturally* during sorting/debrief. Interventions target the *root* (e.g., showing criteria conflict isn’t ignorance but choice).  
  4. **Philosophers vs. Biologists:** Philosophers jump to "it’s all arbitrary"; biologists crave a "right answer." The sorting exercise *forces* both into discomfort.  

  **If I’m Wrong:** If the species problem *were* merely verbal, all criteria would converge with perfect data. Your snails show they *can’t* – the tensions are in the world, not our language. If lineage segments were indisputable "joints," hybrids and discordant traits wouldn’t be ubiquitous. They are.  

  **Close:** Re-ask the diagnostic question as an exit ticket. The rustling of papers won’t lie – you’ll hear who’s still seeking the "right" count versus who sits with the tension.
