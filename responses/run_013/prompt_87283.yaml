  We are given a 3x3 game with the following payoff matrix for the row player (first number) and column player (second number):

          Left       Centre     Right
  Top    (3, 0)     (0, 3)     (0, 0)
  Middle (0, 3)     (3, 0)     (0, 0)
  Bottom (1, 1)     (1, 1)     (-1, -1)

  R claims that Bottom is strictly dominated by a 50-50 mixture of Top and Middle. Let's check:

  The mixed strategy: 0.5 Top + 0.5 Middle.

  Against Left:
    0.5 * 3 (from Top) + 0.5 * 0 (from Middle) = 1.5 + 0 = 1.5
    Bottom against Left: 1
    1.5 > 1 -> dominates.

  Against Centre:
    0.5 * 0 (from Top) + 0.5 * 3 (from Middle) = 0 + 1.5 = 1.5
    Bottom against Centre: 1
    1.5 > 1 -> dominates.

  Against Right:
    0.5 * 0 (from Top) + 0.5 * 0 (from Middle) = 0
    Bottom against Right: -1
    0 > -1 -> dominates.

  So indeed, the mixed strategy gives a strictly higher payoff than Bottom against every pure strategy of the column player.

  Similarly, for the column player, R claims that Right is strictly dominated by a 50-50 mix of Left and Centre.

  Check for column player (payoffs are for column player):

          Left       Centre     Right
  Top    (0)         (3)        (0)
  Middle (3)         (0)        (0)
  Bottom (1)         (1)        (-1)

  The mixed strategy: 0.5 Left + 0.5 Centre.

  Against Top:
    0.5 * 0 (if column plays Left) + 0.5 * 3 (if column plays Centre) = 0 + 1.5 = 1.5
    Right against Top: 0
    1.5 > 0 -> dominates.

  Against Middle:
    0.5 * 3 (if column plays Left) + 0.5 * 0 (if column plays Centre) = 1.5 + 0 = 1.5
    Right against Middle: 0
    1.5 > 0 -> dominates.

  Against Bottom:
    0.5 * 1 (if column plays Left) + 0.5 * 1 (if column plays Centre) = 0.5 + 0.5 = 1
    Right against Bottom: -1
    1 > -1 -> dominates.

  So the mixed strategy for the column player (50-50 Left-Centre) strictly dominates Right.

  Now, S objects that "a mixture is not an act": when it's your turn, you play a pure strategy, not a coin flip. So, according to S, R has only shown that if the row player could commit to a coin flip (and thus to a mixed strategy) then that would be better, but that doesn't mean that playing Bottom is irrational because in reality you have to choose a pure strategy.

  R replies that you can indeed flip a coin, and because the dominance holds against every column strategy, it doesn't matter if the column player knows your policy. That is, the mixed strategy is implementable (by randomizing) and it strictly dominates Bottom, so Bottom should be eliminated.

  Adjudication:

  In standard game theory, mixed strategies are allowed as part of the strategy set. The definition of strict dominance is:

  A pure strategy s is strictly dominated if there exists a strategy (pure or mixed) t such that for every pure strategy of the opponent, the payoff from t is strictly greater than the payoff from s.

  Therefore, by this definition, Bottom is strictly dominated by the mixed strategy (0.5 Top, 0.5 Middle). Similarly, Right is strictly dominated by the mixed strategy (0.5 Left, 0.5 Centre) for the column player.

  So R is correct on the formal point: Bottom is strictly dominated.

  But S's objection is about interpretation: are we allowed to use mixed strategies in the dominance criterion? The standard answer is yes. However, note that in the definition of iterated elimination of strictly dominated strategies (IESDS), we typically allow mixed strategies to dominate. This is because without allowing mixed strategies, some games that should be solvable by dominance would not be. The classic example is this very kind of game.

  Moreover, R's point about the coin flip is valid: the row player can randomize between Top and Middle. And because the dominance holds against every possible move of the column player (i.e., regardless of what the column player does), it doesn't matter if the column player knows the row player's randomization. So the row player, by randomizing, gets a higher expected payoff than by playing Bottom, no matter what the column player does.

  Therefore, S's objection that "a mixture is not an act" is not a valid objection to the elimination in the standard theory. The mixed strategy is available and it strictly dominates Bottom.

  Now, S then asks why the line stops at strict dominance: weakly dominated strategies are also beaten or matched, and iterating weak dominance is problematic (order-dependent and may delete Nash equilibria).

  R replies that the strict/weak distinction is fundamental: a strictly dominated strategy is worse against every belief (i.e., every probability distribution over the opponent's strategies), whereas a weakly dominated strategy is worse only against some beliefs (but not against all). Therefore, a rational player would never play a strictly dominated strategy because it is worse no matter what the opponent does. But for a weakly dominated strategy, if the player believes that the opponent will avoid the strategies that make the weak domination hold, then it might be rational to play the weakly dominated strategy.

  Adjudication:

  R is correct about the belief interpretation. Strict dominance implies that the strategy is suboptimal for every belief about the opponents. Weak dominance only implies that the strategy is suboptimal for some beliefs (specifically, those that assign positive probability to the strategies against which it is strictly worse) but may be optimal for other beliefs. Hence, without common knowledge of rationality or similar assumptions, weak dominance is not compelling in the same way.

  So R's point about the strict/weak distinction carrying weight is sound.

  Next, S's parting shot: with three or more players, the mixed-strategy criterion for dominance (using mixtures to dominate) comes apart from the criterion of never being a best response, and they only coincide in two-player games. Therefore, S argues, the extra strength of the mixed dominance criterion depends on counting lotteries as acts.

  Adjudication:

  It is true that in two-player games, a strategy is strictly dominated (by a mixed strategy) if and only if it is never a best response. However, in games with three or more players, these two concepts are not equivalent. In particular, a strategy that is never a best response may not be strictly dominated by any mixed strategy. This is because in games with more than two players, the set of best responses depends on the correlation of the opponents' strategies. Without going into too much detail, in non-two-player games, the set of correlated beliefs (where opponents' strategies might be correlated) is larger than the set of independent beliefs (which are the ones captured by mixed strategies). Therefore, it is possible that a strategy is never a best response to any independent (mixed) strategy of the opponents, but it is a best response to some correlated strategy of the opponents. Hence, it might not be strictly dominated by any mixed strategy of the player.

  However, in two-player games, the equivalence holds: a pure strategy is strictly dominated by a mixed strategy if and only if it is never a best response to any mixed strategy of the opponent.

  So S is correct about the three-or-more-players point. But does it support S's conclusion? S draws the conclusion that the extra strength (of mixed dominance) is precisely the part that depends on lotteries counting as acts. That is true in the sense that without allowing mixed strategies, we wouldn't have the same dominance relation. However, note that even in two-player games, without mixed strategies we might not be able to eliminate as much. The point is that in two-player games, the mixed dominance and the never-best-response criteria are equivalent, so we don't have to choose. But in games with more players, they are different, so the mixed dominance criterion is more restrictive (it leads to more eliminations) and might be considered less compelling because it doesn't capture the correlated beliefs.

  But in the context of our two-player game, this point is moot. We are in a two-player game, so the equivalence holds. Therefore, in this game, Bottom is strictly dominated and also never a best response.

  Now, what about the iterative procedure? After deleting Bottom (for row) and Right (for column), we are left with:

          Left       Centre
  Top    (3, 0)     (0, 3)
  Middle (0, 3)     (3, 0)

  This is the game of matching pennies. There is no pure strategy Nash equilibrium. The only equilibrium is mixed: row player plays (0.5 Top, 0.5 Middle) and column player plays (0.5 Left, 0.5 Centre). The payoffs in this equilibrium are (1.5, 1.5) for the row and column players respectively.

  This result does not tell against R or S. It is the standard outcome. The initial elimination of dominated strategies is valid, and then we are left with a subgame that has a mixed equilibrium.

  In summary:

  1. Bottom is strictly dominated by the 50-50 mix of Top and Middle. Similarly, Right is strictly dominated by the 50-50 mix of Left and Centre. (R is correct.)

  2. S's objection that "a mixture is not an act" is not valid in the standard theory. Mixed strategies are allowed in the dominance definition because they are implementable and because the dominance holds regardless of the opponent's play. (R's coin-flip reply is sound.)

  3. The strict/weak distinction is important: strict dominance means the strategy is worse against every belief, so it is unambiguously irrational. Weak dominance does not have this property. (R is correct.)

  4. The three-or-more-players point is correct: mixed dominance and never-best-response are equivalent only in two-player games. But in this two-player game, that doesn't matter. The point doesn't undermine the use of mixed dominance in this context. It supports the idea that mixed strategies are essential for the dominance concept in two-player games, but that is standard.

  Therefore, R's arguments are mostly correct, and S's objections are not fatal in this two-player setting.

  But note: there is a live interpretive dispute about the status of mixed strategies. Some philosophers and decision theorists question whether randomizing is a genuine act or whether it is rational to randomize. However, in the standard game theory literature, mixed strategies are a fundamental part of the model, and the dominance criterion using mixed strategies is accepted.

  Confidence: The above is settled in the standard game theory. The only potential uncertainty is in the philosophical interpretation of mixed strategies, but within the formal framework, R is correct.

  Final note: The iterative elimination leaves a 2x2 game that has no pure strategy equilibrium, but that is expected and does not undermine the elimination. The elimination of dominated strategies does not promise to leave a game with a pure equilibrium; it only removes strategies that are never rational to play (under the assumption that the opponent is rational, and so on, in the iterative process).
