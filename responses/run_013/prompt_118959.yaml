answer: |-
  ### Decision Tree: What Have We Learned by Fitting a Reward Function to Observed Behavior?

  **Root Commitment:** Fitting a reward function to observed behavior is at least sometimes a way of finding out something about the agent, rather than a mere redescription of what it did.  
  **A.** When observing an agent who orders the cheapest item on every menu, does the reward function capture a general rule or preference (e.g., "minimize cost") that persists beyond the observed choices, or is it merely a summary of the choices themselves? (Persistent state / Summary of choices)  
  - **If Persistent state:**  
    **B.** Consider an agent who buys a gym membership but never attends. Does the fitted reward function represent what the agent *intended* to achieve (e.g., valuing fitness) despite the mistake, or a pattern that rationalizes the actual behavior (e.g., valuing sign-ups without follow-through)? (Intent / Rationalization)  
    - **If Intent:**  
      **C.** After fitting the reward function, the agent says, "I never really wanted what I chose." Do you take this as decisive evidence that the fitted reward is incorrect? (Yes / No)  
      - **If Yes:**  
        **D.** Is the agent assumed to act optimally (maximizing reward given beliefs) in all observed behavior? (Yes / No)  
        - **If Yes:** "**Reflective Equilibrium Optimalism**"  
          *Awkward commitment:* Must deny that agents can have unconscious or inarticulable preferences revealed only through actions.  
        - **If No:** "**Bounded Rationality with First-Person Authority**"  
          *Awkward commitment:* Cannot explain why agents consistently fail to achieve goals they consciously endorse (e.g., the gym case).  
      - **If No:**  
        **E.** Can the reward function include structured elements (e.g., rules like "never lie") that override outcome-based valuation? (Yes / No)  
        - **If Yes:** "**Structured Internalism**"  
          *Awkward commitment:* Struggles to explain cases where agents violate their own rules under duress ("I lied to save a life").  
        - **If No:** "**Scalar Internalism**"  
          *Awkward commitment:* Cannot capture deontological constraints (e.g., refusing to lie even for a better outcome).  
    - **If Rationalization:**  
      **F.** Consider two flatmates: one always cooks, the other always cleans. Can we decompose the joint reward into individual rewards? (Yes / No)  
      - **If Yes:** "**Individual Rationalization**"  
        *Awkward commitment:* Fails when coordination is irreducible (e.g., mutual adjustments that resist decomposition).  
      - **If No:** "**Joint-Agent Rationalization**"  
        *Awkward commitment:* Treats distinct agents as a single entity, ignoring individual goals.  
  - **If Summary of choices:**  
    **G.** When observing a demonstrator who performs a task as they believe the learner would like it done, is the fitted reward function meant to predict the *demonstrator's future acts* or the *learner's preferences*? (Predict demonstrator / Infer learner)  
    - **If Predict demonstrator:**  
      **H.** Is the primary purpose to describe/predict behavior or to justify/evaluate it? (Describe-Predict / Justify-Evaluate)  
      - **If Describe-Predict:** "**Predictive Behaviorism**"  
        *Awkward commitment:* Cannot adapt to novel contexts where past behavior is uninformative.  
      - **If Justify-Evaluate:** "**Normative Patternism**"  
        *Awkward commitment:* Justifies harmful patterns if consistently enacted (e.g., addiction).  
    - **If Infer learner:**  
      **I.** Can the reward function carry non-scalar structure (e.g., incommensurable objectives)? (Yes / No)  
      - **If Yes:** "**Structured Proxy for Other Minds**"  
        *Awkward commitment:* Assumes demonstrators perfectly model learners' preferences.  
      - **If No:** "**Scalar Proxy for Other Minds**"  
        *Awkward commitment:* Reduces complex preferences to a single metric (e.g., "efficiency").  

  ---

  ### Notes on the Tree  
  1. **Unseparated Leaves:**  
     - **Predictive Behaviorism** and **Scalar Internalism** both endorse scalar rewards and predictive accuracy. To separate them, ask: "If an agent acts against their stated values, does the reward function override self-reports?" (Yes → Scalar Internalism; No → Predictive Behaviorism).  

  2. **Empty Combinations (and Why):**  
     - **Intent + Summary of choices + Predict demonstrator:** Incoherent, as "Intent" assumes internal states, but "Summary of choices" denies them.  
     - **Rationalization + Infer learner:** Coherent but unattractive; rationalizing a demonstrator’s behavior to infer a learner’s reward is convoluted and rarely defended.  
     - **Reflective Equilibrium Optimalism + Non-optimal:** Coherent but empty; if agents must act optimally *and* endorse the reward, non-optimal cases are excluded by definition.  

  **Total Leaves:** 10  
  **Total Internal Nodes:** 9 (A–I)  
  **Cases Included:**  
  - Orders cheapest item (A), buys gym membership (B), refuses to lie (E), two flatmates (F), says "never wanted it" (C), demonstrator for learner (G).  
  - Gym membership and "never wanted" both test agent fallibility (B and C).
