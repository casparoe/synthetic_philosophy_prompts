answer: |-
  Here’s a structured critique of your position on moral uncertainty, ranked by severity and separated into internal/external objections, with defenses noted. I’ve weighted scale indeterminacy most heavily per your concern.

  ### **Fatal Flaws (Internal)**
  1. **Scale Indeterminacy (Zero-Point/Unit Problem)**  
     - **Objection**: Moral theories lack intertheoretic commensurability. Utilitarianism’s "utils" and deontology’s "duty weights" aren’t calibrated to a common scale (e.g., multiplying all values in Theory T by 100 changes expected choiceworthiness rankings arbitrarily). No non-question-begging convention fixes this.  
     - **Defender Response**: Proponents (e.g., MacAskill, Ord) concede this but argue for *range properties* (e.g., "Theory A always ranks outcomes ordinally higher than Theory B") or *normalization* (e.g., scale theories by variance in choiceworthiness). Critics (Ross, Sepielli) counter that normalization assumes a privileged baseline (e.g., "neutrality") absent in many theories.  
     - **Weight**: This is the core technical obstacle. If irresolvable, the approach collapses.

  2. **Self-Undermining Application**  
     - **Objection**: Applying the method to itself, you must assign credence to rival meta-normative views (e.g., moral skepticism, absolutism). A 1% credence in "maximizing EC is wrong" could dominate, forcing abandonment of the method in some decisions.  
     - **Defender Response**: Conceded as a genuine limitation but deemed manageable (e.g., restrict the set of "reasonable" theories). Critics see it as a regress problem.

  ### **Severe Problems (Internal)**
  3. **Demandingness Swamping**  
     - **Objection**: A 0.1% credence in an extremely demanding theory (e.g., negative utilitarianism requiring suicide to prevent dust-speck suffering) can override all other theories.  
     - **Defender Response**: Dismissed via theory-selection constraints (e.g., exclude "crazy" theories) or lexical thresholds (e.g., ignore theories below credence ε). Critics note this is ad hoc.

  4. **Theory Individuation**  
     - **Objection**: Credences are spread over theories *as we formulate them* (e.g., "Kantianism" vs. "Kantianism-minus-categorical-imperative"). Different taxonomies yield different EC rankings.  
     - **Defender Response**: Conceded; addressed by seeking a "privileged partition" (e.g., fundamental axioms) or using model averaging. Critics deem this metaphysically dubious.

  ### **Awkward Problems (Internal)**
  5. **Ambiguity vs. Risk**  
     - **Objection**: Moral uncertainty resembles Knightian *ambiguity* (unknown probabilities) more than *risk* (known probabilities). Maximizing EC assumes probabilistic credences are meaningful, but moral theories lack well-defined likelihoods.  
     - **Defender Response**: Dismissed as a confusion; credences reflect subjective belief states, not "objective" probabilities. The analogy holds per Bayesianism.  
     - **Force**: Moderate – this challenges the *applicability* of decision theory but not coherence.

  ---

  ### **External Objections**
  1. **No Theory Endorses Hedging**  
     - **Objection**: All candidate theories may reject EC-maximizing actions (e.g., a deontologist condemns "murder with 1% credence in utilitarianism"). The approach violates moral integrity.  
     - **Defender Response**: Conceded but deemed acceptable; meta-normative obligations needn’t align with first-order ones. Critics (e.g., Weatherson) argue this alienates moral agents.

  2. **Credences in Morality?**  
     - **Objection**: Moral claims aren’t truth-apt (e.g., non-cognitivism) or lack probability conditions (e.g., Platonism). Credences are inapplicable.  
     - **Defender Response**: Dismissed; the position assumes cognitivism/propositionalism. Non-cognitivists are invited to recast "credences" as practical stances.

  ---

  ### **Collapse into Triviality?**
  - **Risk**: Without intertheoretic scaling, EC collapses into "do what your highest-credence theory recommends" (if ordinally comparable) or offers no guidance (if incomparable).  
  - **Defender Salvage**: Scale-free approaches exist (e.g., **Moral Parliament** models or **variance-adjusted EC**), but these rely on contestable axioms.  
  - **Verdict**:  
    - If scale problems are fatal → EC is either *trivial* (no cross-theory comparisons) or *indeterminate*.  
    - Defenders (e.g., MacAskill) argue this doesn’t negate EC but shows it requires careful formulation. Critics see it as a sign the project is either non-distinctive or unworkable.

  ---

  ### **Your Key Concern: Scale Indeterminacy**
  This remains the strongest objection. Defenders must either:
  1. **Stipulate a convention** (e.g., normalize theories to [0,1] choiceworthiness), but this arbitrariness undermines objectivity.  
  2. **Use ordinal methods** (e.g., **Borda counts** across theories), but these violate independence axioms.  
  3. **Restrict scope** to "scale-compatible" theories (e.g., consequentialisms), abandoning universality.  

  **Conclusion**: The position is *vulnerable but not abandoned*. Scale indeterminacy is its Achilles’ heel – if unresolved, EC is elegant mathematics without normative force. Yet proponents maintain it’s the least-bad option given moral uncertainty’s inevitability.

  Would you like deeper analysis of a specific objection or defenses?
