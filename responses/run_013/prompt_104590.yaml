     - Rests on: The premise that continuous existence is a key factor in moral standing (for animals) or that future AI might be continuous. Even if we grant moral standing to game characters, their discontinuity sets them apart.
     - Practical upshot: We should be cautious in applying moral principles from one domain to the other and consider the specific nature of the entity (continuous vs. discontinuous).
     - Confidence: High (if we accept that continuity matters for moral status, then the analogy is weak).
     - What would undermine it: If continuity is irrelevant to moral standing, then the analogy holds.

