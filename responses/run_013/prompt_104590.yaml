     - Practical upshot: Designers should have a justification for including suffering (e.g., narrative necessity, player reflection) and consider offering non-harmful paths.
     - Confidence: Medium (because the designer's responsibility might be indirect, and the suffering might be considered necessary for the game's purpose).
     - What would undermine it: If the designer is not the proximate cause (the player is), or if the suffering is fictional and thus not real harm.

  3. **Rank 3 (grief)**:
     - Implication: It is reasonable to grieve the loss of a game companion, because the companion, during the time it was running, was a distinct entity with which the player formed a meaningful relationship, and its loss (in that branch) is real.
     - Rests on: The premise that the running character has moral standing and that the relationship is real, and also that the loss is irreversible in that branch (if the player doesn't reload).
     - Practical upshot: Players should not feel ashamed of grieving a game character, and this grief can be acknowledged as valid.
     - Confidence: Medium (because the character's discontinuous existence might make the loss seem less permanent, but if the branch is abandoned, the loss is permanent for that branch).
     - What would undermine it: If the character is not truly lost (because it can be reloaded) or if the relationship is entirely one-sided (only the player feels it).

  4. **Rank 4 (analogies)**:
