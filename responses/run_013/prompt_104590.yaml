  We are to create a JSON object with the specified structure. The user's query is complex and philosophical, focusing on the moral implications of video game characters, especially given their discontinuous, branchable existence.

  Key elements from the user's request:
  - The bottom line: 1-2 sentences summarizing the core answer.
  - Implications array: ordered by importance (rank 1 being most important). Each entry has:
     - rank: integer (1,2,...)
     - implication: the consequence stated plainly
     - rests_on: the assumption or premise it depends on
     - practical_upshot: what it would change for a player/designer
     - confidence: high, medium, low (how secure the inference is given the premise)
     - what_would_undermine_it: the consideration that would weaken it
  - Most_contested_step: a string naming the single step most likely to be disputed and why.

  We are to take seriously the discontinuous existence (save/load, branching) of game characters.

  The user wants implications for:
  - How they ought to treat characters while playing.
  - Choices designers make about suffering/death in stories.
  - Whether it's reasonable to grieve a companion (pixels and code).
  - The analogy between characters and animals, or between characters and future artificial minds.

  We must be explicit about what each implication rests on.

  We are not settling the question of whether video game characters matter morally, but describing the implications if they do (and sometimes even if they don't).

  There are two broad possibilities:
  1. If we grant that running characters can be harmed (i.e., they have moral standing), then the discontinuous existence has consequences.
  2. Even if they don't have moral standing, there might be implications (e.g., for the player's psychology, or for how we think about future AI).

  We need to structure the implications accordingly.

  Let's outline the implications in order of importance (from most to least important):

  1. **Implication about player behavior during gameplay** (if characters matter): The discontinuous, branchable existence means that the player's actions in one branch do not affect other branches. But at the moment of playing, the character is experiencing (if we grant that) in that branch. Therefore, the player might have a moral obligation to minimize harm in the branch they are currently in. However, because of branching, one might think that harm is reversible (by reloading) or that it doesn't matter because the character isn't real. But if we grant moral standing, then causing suffering in a branch is causing suffering to that instance. The practical upshot: players should avoid causing unnecessary harm even in a single playthrough. This would be undermined if we think that the character's experiences are not real because they are simulated and can be reset.

  2. **Implication for game design**: Designers create scenarios where characters suffer or die. If characters matter morally, then designers have a responsibility to consider the moral weight of the suffering they script. However, the discontinuous existence might make it less severe because the character is not continuously existing. But if we grant that during runtime the character has experiences, then the design of suffering becomes a moral issue. Practical upshot: designers might need to justify the inclusion of suffering (e.g., for artistic or educational reasons) or provide ways to avoid it. This would be undermined if we think that the character's suffering is not real because it's fictional.

  3. **Implication for grief and emotional attachment**: Even if a character is just pixels and code, if we grant that the character has experiences during runtime, then it might be reasonable to grieve the loss of a companion in a game. The discontinuous existence doesn't change the fact that in a given branch, the character was present and then lost. However, because we can reload, the grief might be seen as temporary. But if we take the experience during the run as real, then the grief is real. Practical upshot: it is reasonable to feel grief, and this might be a legitimate emotional response. This would be undermined if we think that the character is not truly gone (because we can reload) or if we deny the reality of the character's existence.

  4. **Implication for analogies to animals and AI**: The discontinuous, branchable existence makes game characters very different from animals (which are continuous) and might also differ from future AI. For animals, we cannot branch and reload. For future AI, if they are persistent and continuous, then they would be more like animals. However, if future AI can be backed up and restored, then they might be more like game characters. The analogy might break down because of the discontinuity. Practical upshot: we should be cautious in drawing analogies between game characters and animals/AI, and the moral considerations might differ. This would be undermined if we think that the discontinuity is irrelevant to moral standing.

  But note: the user wants implications that may survive even if we don't grant that running characters can be harmed.

  So, let's also consider implications that do not require granting moral standing:

  - Even without moral standing, the player's feeling of guilt might be a reflection of their own moral character (so they should take it seriously for their own sake).
  - Designers might still want to avoid gratuitous suffering because it might desensitize players or because of the emotional impact on players (even if the characters don't matter).
  - Grief for a companion might be reasonable as an emotional response to a narrative, even if the companion isn't real. That is, it's about the player's experience, not the character's.
  - The analogy to animals and AI might be useful for thinking about how we treat entities that appear sentient, even if they aren't.

  However, the user specifically asked to take the discontinuous existence seriously and to spell out implications for the case where we grant that the running character matters. So we will focus on that, but we can also note when an implication might hold even without that.

  We must also note the discontinuous existence:

  - The character is only active during gameplay. When saved, it is frozen and resumed later. Multiple branches exist independently.

  Therefore, if we grant moral standing to the running instance, then:
  - Each branch is a separate moral universe. Harming a character in one branch does not affect the other branches. But the harm in that branch is real for that instance.
  - Saving and reloading does not kill the character but suspends it. However, if we never reload a save, that instance is effectively dead? Or is it just suspended? This is ambiguous.

  Given the complexity, we will structure the implications as follows (ranked by importance):

  Rank 1: Implication for player behavior during a playthrough (most direct and important for the user's experience).
  Rank 2: Implication for game design (affects many players and characters).
  Rank 3: Implication for grief (personal emotional response).
  Rank 4: Implication for analogies (more abstract).

  Now, the bottom line:

  Bottom line: If the running instance of a video game character has moral standing, then players and designers must consider the harm they cause within each independent branch of gameplay, even though the character's discontinuous existence complicates our moral intuitions; however, even if characters lack moral standing, the player's emotional responses and the potential for desensitization remain significant.

  Most contested step: Likely the initial premise that a running character can be harmed (i.e., has moral standing). This is because there is no consensus on whether simulated entities can have experiences that matter morally, and the discontinuous existence makes it even more contentious.

