prompt: |-
  I run a small risk-analysis unit — four analysts — inside a state agency whose decisions land on individuals: parole, child-welfare removals, and the licensing of high-hazard facilities. Our reports must end in a number. A statute requires each report to state "the probability" of the adverse outcome over a fixed horizon, and a hearing officer who is not a statistician signs off on it. We get roughly ninety minutes per case, we have no budget for new data collection, and we are not permitted to leave the probability box blank or to answer "it depends." In practice the arithmetic is never the hard part. The hard part is deciding what the case in front of us is a case of. A parolee belongs to a hundred overlapping populations — men; men convicted of a particular offense; men convicted of that offense with a prior supervision violation; men of that age in that county; men who scored a particular way on our instrument — and the observed frequencies differ wildly across them, so the number we report is largely an artifact of the class we chose. At present we use a rule of thumb a predecessor left behind: use the narrowest class for which you have at least a hundred prior cases. A colleague wants to replace it with: compute the frequency in every class you can defend and average them. I suspect both rules are bad, but I cannot articulate why in a way my analysts can actually apply, and the last time I tried, one of them asked me whether the "right" class is a fact we are failing to find or a choice we are making and hiding — and I did not have an answer.

  Please turn whatever the philosophy of probability genuinely knows about this — the reference class problem and the proposals that have been made for coping with it — into a decision procedure my unit can run on a live case. I want the questions to ask in order, what counts as a sufficient answer at each step, where the procedure terminates in a defensible single number, where it terminates in a range or in a refusal to supply one, and which steps are irreducibly matters of judgment or of values that should be escalated rather than settled by an analyst. It has to survive the cases that actually break us: classes nested inside one another; classes that conflict without either being nested; classes defined after the fact by the very outcome we are predicting; and classes so small that the frequency is a fiction. Two things I especially want addressed. First, whether the narrowest-class rule can be saved by some restriction, given that the narrowest class of all is the single case itself, whose frequency is either zero or one and therefore tells us nothing. Second, whether averaging the frequencies is ever more than a way of laundering the choice of classes. Then run the procedure on three cases and tell me what it outputs, even where the output is one the agency will hate: a parolee with a long record in a class of four thousand priors and a shorter, more relevant record in a subclass of sixty; a one-off licensing decision for a facility of a type that has existed twelve times, three of which failed; and a case in which the only class that is clearly relevant is one we are legally forbidden to use as a basis for the decision. Finish by saying plainly what the procedure cannot do, and what a hearing officer should be told about the epistemic status of the number printed in the box.
reasoning: |-
  Okay, this is an incredibly rich and complex problem that cuts straight to the heart of applied probability in high-stakes decision-making. The user runs a small risk-analysis unit dealing with parole, child welfare, and hazardous facility licensing - areas where their probability estimates directly impact human lives. They're grappling with the reference class problem, a fundamental issue in probability theory that philosophers like Hans Reichenbach wrestled with. 

  The core tension is brutal: they must produce a single number representing probability, but every case belongs to countless overlapping reference classes with wildly different observed frequencies. Their current "narrowest class with 100+ cases" rule feels arbitrary, and their colleague's averaging proposal seems like it might just mask subjectivity. The user's description of their analyst asking whether the "right" class is a discovery or a hidden choice gave me chills - that's precisely where the philosophical rubber meets the road in frequentist probability.

  What makes this especially thorny:
  - Extreme time constraints (90 mins/case)
  - No new data collection allowed
  - Cannot say "it depends" due to statute
  - Faces pathological cases (nested/conflicting classes, outcome-based classes, tiny samples)
  - Needs to handle legally prohibited factors

  The user isn't just asking for theory - they need a concrete, step-by-step procedure that analysts can execute under pressure. And they want it stress-tested on their hardest real cases. This requires balancing statistical rigor with operational feasibility while maintaining ethical integrity.

  I'm struck by how honestly they've articulated the problem. Many would hide behind technicalities, but they're confronting the moral weight of reducing human complexity to a single number. The three test cases they provided are perfectly chosen to break naive solutions: the parolee with conflicting priors, the rare facility type, and the legally constrained case.

  For the procedure itself, I need to build something that:
  1) Acknowledges the inherent subjectivity while constraining it
  2) Provides clear escalation points for value judgments
  3) Handles small samples without pretending false precision
  4) Avoids the traps of both over-narrowing and meaningless averaging
  5) Explicitly flags when the output is more art than science

  The hearing officer piece is crucial - whatever we produce must come with transparent caveats about its epistemic status. The number in the box can never be "the truth," only our best constrained estimate given limited information and unavoidable choices.

  For the test cases:
  - The parolee case should force confrontation between large-but-broad and small-but-relevant data
  - The facility licensing case should trigger small-sample protocols
  - The legally prohibited factor case should demonstrate clear escalation paths

  Ultimately, the procedure must be honest about its limitations. As much as the statute demands a number, some probabilities simply cannot be meaningfully quantified within their constraints. The bravest thing their unit might do is document when the number is fundamentally unstable - even if that creates friction with the hearing process.
answer: |-
  Here is a decision procedure for the reference class problem, grounded in philosophy of probability & designed for operational use. It prioritizes defensibility, transparency, and escalation of value judgments. **Bold terms** are defined in the glossary.

  ---

  ### **Reference Class Selection Procedure**
  **Inputs:** Case facts, available historical data, legal constraints  
  **Output:** Single probability (preferred), probability range (fallback), or documented refusal (last resort)  
  **Time Budget:** Strict 90-minute clock per case (steps 7+ require supervisor)

  1.  **IDENTIFY ALL PLAUSIBLE REFERENCE CLASSES (RCs) (5 mins)**
      *   *Question:* "What populations share *relevant* characteristics with this case? Consider: offense type, demographics, risk factors, geography, procedural history, facility specs, etc."
      *   *Sufficient Answer:* List of candidate RCs (e.g., "Parolee: Burglary convictions + prior violation + age 25-30 + County X" / "Facility: Chemical storage >10k gal + rural location + new operator").
      *   *Termination:* Proceed to Step 2. **Do not filter yet.** Capture all defensible options.

  2.  **REMOVE INVALID/ILLEGAL CLASSES (5 mins)**
      *   *Question:* "Is any RC defined *post-hoc* by the outcome? Does any RC rely on a legally prohibited factor (e.g., race, protected class)?"
      *   *Sufficient Answer:* Eliminate RCs defined *after* knowing the outcome (e.g., "people who later recidivated"). Eliminate RCs using prohibited factors.
      *   *Termination:* Proceed with remaining RCs. Document eliminated RCs & reason.

  3.  **ASSESS DATA QUALITY PER RC (10 mins)**
      *   *Question:* "For each RC: What is the sample size (N)? What is the observed adverse outcome frequency (F)? How recent/reliable is the data? Are outcomes measured consistently?"
      *   *Sufficient Answer:* Table of RCs with N, F, data vintage, notes on reliability.
      *   *Termination:* Proceed. Flag RCs with N<30 or significant data concerns.

  4.  **CLUSTER RELATED CLASSES (10 mins)**
      *   *Question:* "Which RCs are nested (e.g., Burglary ⊇ Burglary+PriorViolation)? Which overlap significantly but aren't nested (e.g., "Age 25-30" & "County X")? Which are disjoint?"
      *   *Sufficient Answer:* Group RCs into clusters:
          *   **Nested Cluster:** RCs forming a hierarchy (e.g., All Burglary > Burglary+PriorViolation > Burglary+PriorViolation+Age25-30).
          *   **Overlap Cluster:** Non-nested RCs sharing key features (e.g., "Rural Facilities," "Chemical Storage Facilities" – overlap but neither contains the other).
          *   **Disjoint:** Statistically independent RCs (rare in practice).
      *   *Termination:* Proceed with clusters. **Judgment Required:** Defining cluster boundaries.

  5.  **SELECT PRIMARY CLUSTER TYPE (20 mins - *Escalation Point*)**
      *   *Question:* **"Based on causal relevance and data robustness, which cluster type best captures the *mechanism* likely driving risk for *this specific case*?"**
      *   *Sufficient Answer (Choose One Strategy Per Cluster Type):*
          *   **Nested Cluster:** Apply the **Stable Narrowing Rule:** Start with broadest RC in the cluster. Move to a narrower RC *only if*:
              *   N >= **Stability Threshold** (Recommend: 30 cases min, 50+ preferred).
              *   Narrowing is based on a factor *causally relevant* or *strongly predictive* for *this case* (e.g., "Prior violation IS highly relevant to parole risk." "County might be less relevant than offense type.").
              *   F changes *meaningfully* (e.g., >5% absolute difference) between levels. *Stop at the narrowest RC meeting these criteria.*
          *   **Overlap Cluster:** Apply **Relevance-Weighted Averaging:**
              *   Assign a defensible **Relevance Weight** (1-5) to each RC based on causal/predictive strength for *this case* (e.g., "Facility type weight=5, Operator experience weight=3, Rural location weight=2").
              *   Calculate Weighted Average Probability = Σ(Weightᵢ * Fᵢ) / Σ(Weightsᵢ).
          *   **Disjoint Cluster:** Use largest N or most relevant RC (rare).
      *   *Termination:* One probability per cluster type (if multiple clusters exist). **Judgment Required:** Choosing cluster strategy, setting relevance weights, assessing causal relevance. **Escalate to Supervisor** if conflict between strategies or high uncertainty in weights/relevance.

  6.  **HANDLE SMALL SAMPLES / CONFLICT (15 mins)**
      *   *Question:* "Does the chosen RC (Nested) or any major RC (Overlap) have N < **Stability Threshold**? Do probabilities from different clusters or methods conflict sharply (>10% absolute difference)?"
      *   *Sufficient Answer & Termination:*
          *   **N < Stability Threshold:** Report **Probability Range:** [Wilson Score Interval Lower Bound, Min(100%, F + √(F*(1-F)/N) * 2)] (e.g., If F=0.2, N=15 → Report [0.08, 0.44]). *Do not report a point estimate.*
          *   **Sharp Conflict (>10% diff):** Report **Probability Range:** [Lowest defensible estimate, Highest defensible estimate]. *Do not average across clusters.*
          *   **No Small Samples/Conflict:** Proceed with point estimate from Step 5.

  7.  **FINAL REVIEW & DOCUMENTATION (15 mins - *Escalation Point*)**
      *   *Question:* "Is the final number/range defensible? Are all choices documented? Does it pass the 'red face test' (could you justify this to a critical expert)?"
      *   *Sufficient Answer:* Final probability (point or range) entered. Documentation includes:
          *   All plausible RCs considered (Step 1).
          *   RCs removed & why (Step 2).
          *   Data table (Step 3).
          *   Cluster definitions & chosen strategy (Steps 4 & 5).
          *   Relevance weights if used (Step 5).
          *   Reason for range if used (Step 6).
      *   *Termination:* Report the number/range. **Escalate to Supervisor** if analyst lacks confidence or ethical concerns arise. **Refusal Possible:** Only if *no* legally permissible RC exists OR all data is demonstrably unusable (e.g., N=1 outcome known). Document refusal reason exhaustively.

  ---

  ### **Addressing Your Specific Concerns**

  1.  **Saving the Narrowest-Class Rule?**
      *   **Yes, with the Stable Narrowing Rule.** It fixes the fatal flaw:
          *   **Stability Threshold (N>=30/50):** Prevents using absurdly small samples (N=1).
          *   **Causal Relevance Requirement:** Prevents arbitrary narrowing (e.g., narrowing to "left-handed parolees named Bob" without justification).
          *   **Meaningful Difference Check:** Prevents unnecessary narrowing if risk doesn't change.
      *   *Why it's better:* It injects causal reasoning and stability, moving beyond pure sample size.

  2.  **Is Averaging Just Laundering?**
      *   **No, if done correctly via Relevance-Weighted Averaging.** Blindly averaging frequencies (Fᵢ) *is* laundering. *Weighting by judged relevance* forces explicit acknowledgment of which factors *should* matter more based on domain knowledge/causal understanding. It turns subjective judgment into a documented, auditable input. The weights *are* a choice, but not a hidden one. It's most defensible for overlapping, non-nested classes where no single hierarchy exists.

  ---

  ### **Running the Procedure: Three Test Cases**

  **Case 1: The Parolee**
  *   *Facts:* Long record (broad class N=4000, F=15%), highly relevant shorter record (narrow subclass N=60, F=25%). Offense=Burglary, Prior Violation=Yes, Age=28, County=X.
  *   **Procedure:**
      *   Step 1: Many RCs (All Parolees, Burglary, Burglary+Violation, Burglary+Violation+Age25-30, Burglary+CountyX...).
      *   Step 2: No illegal classes.
      *   Step 3: N=4000 (F=15%), N=60 (F=25%) are key. Data reliable.
      *   Step 4: These form a **Nested Cluster** (All Parolees ⊇ Burglary ⊇ Burglary+Violation ⊇ Burglary+Violation+Age25-30).
      *   Step 5: **Nested Cluster Strategy (Stable Narrowing):**
          *   Start Broad: "All Parolees" (N=4000, F=15%).
          *   Narrow to "Burglary": N large, F likely changes? (Assume F≈18%, change >5%? *Yes*). Acceptable.
          *   Narrow to "Burglary+PriorViolation": N likely still large (e.g., 1000?), F likely higher (e.g., 22%? Change >5%? *Yes*). Causal Relevance? *High*. Acceptable.
          *   Narrow to "Burglary+PriorViolation+Age25-30": N=60 (>=30? *Yes*), F=25% (Change from 22%? 3% <5%? *Maybe not meaningful*). Causal Relevance of Age? *Moderate*. **Stop at "Burglary+PriorViolation" (F=22%)** unless age difference is *known* to be crucial here. Judgment: Age less relevant than prior violation. **Output: 22%**.
      *   Step 6: N=1000 > Threshold. No conflict.
      *   Step 7: Defensible. Document choice to stop narrowing before Age group as F change small & relevance moderate.

  **Case 2: The One-Off Facility**
  *   *Facts:* New chemical storage facility. Type existed 12 times, 3 failed (F=25%).
  *   **Procedure:**
      *   Step 1: RCs: "All High-Hazard Facilities" (N=large, F=low?), "Chemical Storage Facilities" (N=12, F=25%).
      *   Step 2: No illegal classes.
      *   Step 3: Key RC: "Chemical Storage" N=12, F=25%. Data reliable but small.
      *   Step 4: Potential **Overlap Cluster**? (e.g., Chemical Storage + Size? + Location? + Operator Exp?). Assume only one clear RC ("Chemical Storage") with usable data. (If others exist, proceed to Step 5 Overlap).
      *   Step 5: Effectively a **Nested Cluster** with one usable level? Apply **Stable Narrowing:** Broadest usable RC is "Chemical Storage" N=12.
      *   Step 6: **N=12 < Stability Threshold (30)**. **Output Range:** Calculate Wilson Score (e.g., 95% CI approx [0.10, 0.50]). **Report [10%, 50%]**.
      *   Step 7: Defensible. Document small sample size necessitates range.

  **Case 3: The Forbidden Factor**
  *   *Facts:* Parolee. Highly predictive RC exists (e.g., "Men with Violent Offense + Specific Trauma History X") with good N & F. Factor X is strongly correlated with a legally prohibited factor (e.g., race, religion) and agency policy forbids its *direct* use.
  *   **Procedure:**
      *   Step 1: RC "Violent Offense + Trauma History X" identified. Also other RCs (Violent Offense, Age, County...).
      *   Step 2: **RC "Violent Offense + Trauma History X" RELIES ON A PROHIBITED BASIS** (by agency policy, due to correlation/proxy status). **Remove this RC.**
      *   Step 3: Assess remaining RCs (e.g., "Violent Offense" N=2000, F=30%; "Age Group" N=500, F=25%; "County Y" N=300, F=35%).
      *   Step 4: **Overlap Cluster** (Violent Offense, Age Group, County Y - related but not nested).
      *   Step 5: **Overlap Cluster Strategy (Relevance-Weighted Avg):**
          *   Assign Weights: "Violent Offense" (Weight=5 - highly relevant), "Age Group" (Weight=3 - moderately relevant), "County Y" (Weight=2 - less relevant).
          *   Calculate: (5 * 0.30 + 3 * 0.25 + 2 * 0.35) / (5+3+2) = (1.50 + 0.75 + 0.70) / 10 = 2.95 / 10 = 0.295.
          *   **Output: 30%**.
      *   Step 6: All N > Threshold. No sharp conflict between RCs.
      *   Step 7: **Escalate to Supervisor:** The primary predictive factor was excluded legally. The weighted average uses only permissible factors, but the supervisor must confirm this complies fully with policy/statute and that the exclusion is properly documented. Output is defensible *given constraints*, but supervisor must review legality.

  ---

  ### **What the Procedure Cannot Do**

  1.  **Eliminate the Reference Class Problem:** It provides a *defensible process*, not a "true" probability. The choice of RCs, clusters, weights, and relevance judgments remains inherently subjective.
  2.  **Create Data Where None Exists:** If no legally permissible RC has adequate data, it forces a range or refusal.
  3.  **Resolve Fundamental Value Conflicts:** Deciding *which* factors are causally relevant or permissible involves values (e.g., is "neighborhood poverty" a legitimate RC factor for parole risk, or an unjust proxy?). The procedure forces these conflicts to be escalated.
  4.  **Guarantee Accuracy:** Small samples, changing environments, and model misspecification limit predictive power. The procedure manages uncertainty transparently; it doesn't abolish it.
  5.  **Replace Human Judgment:** It structures and documents judgment; it doesn't remove it. Analysts and supervisors *must* engage with the "why."

  ---

  ### **What the Hearing Officer Should Be Told**

  **"The number in the box represents our unit's best estimate of the probability of the adverse outcome occurring within the statutory timeframe, based on the available historical data for cases sharing relevant characteristics with this one.**

  *   **It is not a certainty:** It is an estimate based on patterns observed in similar past cases.
  *   **It involves judgment:** Analysts must decide which characteristics are most relevant for predicting risk in *this specific case*, guided by our documented procedure.
  *   **Data limitations matter:** When historical data is sparse or conflicted, we report a range or explicitly note the uncertainty. A single number from sparse data is less reliable.
  *   **Constraints shape the number:** We strictly exclude factors prohibited by law or agency policy, even if they are predictive. This may limit precision.
  *   **It is a starting point:** This number is a key input to your decision, but your holistic evaluation of the unique circumstances of this case is paramount."

  **This framing emphasizes the number's nature as a *professional estimate* constrained by data, methodology, law, and judgment, not a discovered fact.** It preserves the hearing officer's ultimate responsibility while justifying the number's role.
