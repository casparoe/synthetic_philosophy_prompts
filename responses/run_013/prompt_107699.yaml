prompt: |-
  I'm a PhD student in philosophy and I've somehow ended up doing a placement with a community home-care org (it's an "engaged philosophy" thing my department makes us do, don't ask). They've asked me to do something I'm honestly not sure is possible: turn care ethics into an actual decision procedure their care coordinators can run.

  Here's the setup so you can calibrate. There are four care coordinators, each managing about forty older-adult clients in their homes. Once a week they sit down for a 90-minute case conference and decide things like: who gets the scarce home-care hours out of a fixed municipal pot, whether to push a client to accept a service they've been declining, whether to loop in adult protective services, whether to keep funding a carer who's burning out. So maybe fifteen real decisions a week, per coordinator. The stakes are real but mostly not life-or-death — falls, skin breakdown, isolation, a daughter who's hit her limit, dignity stuff. The coordinators have social-work backgrounds, not philosophy ones. They get about twenty minutes per case and they have to write a short justification that their supervisor signs off on, because the funder audits us for consistency and we can't get away with shrugging and saying every case is unique.

  And that last bit is the whole problem, right? Care ethics basically distrusts rules. The whole point (as I understand it, and as Gilligan was getting at back in the 80s) is that what matters is the particular relationship and the response to *this* person, not applying a generalizable standard that flattens them into a case type. So a procedure is almost a contradiction in terms. If I just write a rubric with weights and boxes, I've smuggled in exactly the impartial, generalizing thing care ethics was reacting against, and the coordinators will tick boxes and stop thinking about the person. But if I write "use your judgment, attend to the relationship," I've given them nothing to do and nothing to write down, and the funder will eat us alive.

  So what I want from you is a procedure that keeps faith with care ethics but is still something a coordinator can actually run in twenty minutes. Concretely: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because it's a question of judgment rather than something the procedure can settle. Two things I want baked in and I think care ethics requires them. First, a step that captures the cared-for person's own account of *receiving* the care — not just whether the service got delivered, but how it landed for them, because a client can be getting lots of care and still be experiencing it as control. Second, a step that lets the carer's own limits count, including the coordinator's — care ethics shouldn't require the carer to quietly dissolve. I also want an explicit "this case is not procedurally decidable, here's what to do instead" flag, so the procedure is honest about its own edges instead of pretending to cover everything. And I want you to be blunt about which steps are just judgment calls dressed up as procedure, and where it's likely to misfire.

  Then run it on three cases and tell me what it spits out:

  1. Mrs. Adeyemi, 82, keeps declining the bath aide. Her skin's starting to break down and the nurse is worried. She says she's washed herself for eighty years and doesn't want a stranger doing it. The coordinators are itching to override her and I'm not sure they're wrong.
  2. Mr. Kaur's daughter visits every day, manages his meds, does his shopping, keeps his house spotless. On paper a model care arrangement. But he's told his coordinator twice that he feels managed, that it's her life not his. Nobody's neglecting him and yet something's off.
  3. Two clients both need the same two hours a week and there's only two hours to give. One is warm and articulate and easy to like; the other is terse and hard to read. I already know how the room will vote and it worries me.

  For each case I want the verdict, which step is doing the work, and whether the procedure gives an answer the coordinator won't like. I'd honestly be suspicious of a procedure that always agrees with them, so if it lets them do the comfortable thing in all three, tell me and tell me why.

  Then, after all that, give me a brief structured summary I can paste into my notes, as a JSON object with exactly these fields: `procedure_name` (string); `steps` (array of objects, each with `order` int, `step` string, `question` string, `sufficient_answer` string, `if_answer_is_no` string, and `is_judgment_call` boolean); `handoff_points` (array of strings, the places where it has to go to a person); `cases` (array of objects, each with `case` string, `verdict` string, `step_doing_the_work` string, `coordinator_likely_dislikes` boolean, `procedure_misfires` boolean, and `note` string); and `known_limits` (array of strings, what the procedure can't do).
reasoning: |-
  Hmm, this is a fascinating challenge from a philosophy PhD student trying to apply care ethics to real-world care coordination. The tension between care ethics' rejection of rules and the practical need for auditable decisions is exactly the knot I need to untie. 

  First, let's map the constraints: four coordinators with 40 clients each, 90-minute weekly conferences, 20 minutes per case. The output must be justifiable to auditors while honoring two non-negotiables: prioritizing the care-receiver's lived experience and respecting caregiver limits. The procedure must also confess when it can't decide—no pretending to be comprehensive.

  I'm hearing three core paradoxes: 
  1) How to systematize attention without systematizing people
  2) How to document relational work without reducing it to checkboxes
  3) How to balance particularity with accountability

  For Mrs. Adeyemi's bathing refusal, the coordinators' instinct to override worries me—care ethics would scream about bodily autonomy here, but skin breakdown can't be ignored. Mr. Kaur's "well-cared-for" misery exposes how care ethics distinguishes technical provision from relational reception. That third case with the "likeable" vs "terse" client? Pure bias test.

  My approach will be to build a decision scaffold that forces pause at critical relational junctures. Instead of weighting factors, it'll sequence inquiries: first about harm prevention, then about the person's narrative of care, then about sustainability. The "sufficient answer" criteria must resist quantification—phrases like "credible articulation of distress" keep it human. Crucially, the procedure will include explicit off-ramps where coordinators must stop and justify deviation in writing.

  For the bath refusal case, I suspect the procedure will block coercion unless Mrs. Adeyemi can't comprehend consequences—but it'll force creative alternatives. Mr. Kaur's case might reveal that the "problem" is actually his daughter's unrecognized burnout. And for the two-hour dilemma? The procedure should punish coordinators for favoring the warm client by demanding they articulate concrete need differentials.

  The JSON structure they requested is smart—it'll force me to commit to specific fields. I'll need to include "is_judgment_call" flags to prevent false objectivity. Known limits must highlight when power imbalances distort self-reports or when cultural gaps make "harm" assessments dubious.
answer: |-
  Here's a care ethics decision procedure designed as a *relational inquiry scaffold* rather than a rigid algorithm. It forces coordinators to confront core care ethics tensions systematically while leaving room for judgment, with explicit off-ramps when proceduralization fails. Crucially, it documents *how* the decision was relationally grounded, satisfying auditors.

  **Procedure Name:** Relational Care Inquiry Protocol (RCIP)

  **JSON Summary:**

  ```json
  {
    "procedure_name": "Relational Care Inquiry Protocol (RCIP)",
    "steps": [
      {
        "order": 1,
        "step": "Harm Assessment",
        "question": "Is there credible evidence of imminent, severe physical/mental harm that cannot be mitigated without immediate intervention?",
        "sufficient_answer": "Documented professional assessment (nurse, doctor, APS) OR clear, observable evidence of acute danger (e.g., uncontrolled bleeding, severe dehydration, active suicidal ideation).",
        "if_answer_is_no": "Proceed to Step 2.",
        "if_answer_is_yes": "Immediate safety intervention per org policy. Document rationale for override. STOP PROCEDURE FOR THIS DECISION POINT.",
        "is_judgment_call": true
      },
      {
        "order": 2,
        "step": "Cared-For Narrative",
        "question": "What is the cared-for person's expressed understanding of the situation, their needs, and their experience of current/received care? (Focus on listening, not correcting).",
        "sufficient_answer": "Direct quote(s) from the cared-for person OR documented refusal to engage. Must capture their framing, even if contradictory to evidence. If unable to communicate, documented proxy perspective + justification for proxy use.",
        "if_answer_is_no": "Decision cannot proceed. Re-engage with cared-for or document barrier. STOP PROCEDURE FOR THIS DECISION POINT.",
        "if_answer_is_yes": "Proceed to Step 3.",
        "is_judgment_call": false
      },
      {
        "order": 3,
        "step": "Relational Context Mapping",
        "question": "How do key relationships (family, carers, coordinator) shape the care dynamic, needs, and options? Identify power imbalances, dependencies, conflicting needs, and unspoken burdens.",
        "sufficient_answer": "Identification of at least 2 key relational factors influencing the decision (e.g., daughter's burnout, client's fear of losing independence, carer's cultural mismatch).",
        "if_answer_is_no": "Decision likely premature. Gather more relational context. STOP PROCEDURE FOR THIS DECISION POINT.",
        "if_answer_is_yes": "Proceed to Step 4.",
        "is_judgment_call": true
      },
      {
        "order": 4,
        "step": "Carer Sustainability Check",
        "question": "Is the current care arrangement (formal or informal) demonstrably unsustainable for the primary carer(s) in the near term, risking collapse?",
        "sufficient_answer": "Evidence of carer distress (e.g., documented exhaustion, expressed inability to continue, observed decline in care quality) AND lack of feasible immediate supports.",
        "if_answer_is_no": "Proceed to Step 5.",
        "if_answer_is_yes": "Prioritize stabilizing the caregiving relationship. Document specific risks. Proceed to Step 5.",
        "is_judgment_call": true
      },
      {
        "order": 5,
        "step": "Responsive Option Generation",
        "question": "What 2-3 options best respond to the *specific* needs, narrative, and relational context identified in Steps 2-4? (Avoid default solutions).",
        "sufficient_answer": "Listing of concrete alternatives, including 'do nothing' or 'delay', with brief rationale linking each option to specific insights from Steps 2-4.",
        "if_answer_is_no": "Revisit Steps 2-4. Options are likely generic.",
        "if_answer_is_yes": "Proceed to Step 6.",
        "is_judgment_call": true
      },
      {
        "order": 6,
        "step": "Relational Impact Forecast",
        "question": "For the top option: How might this impact the cared-for's sense of agency/dignity, key relationships, and the carer's sustainability? What's the potential for resentment or relational harm?",
        "sufficient_answer": "Articulation of at least one potential positive relational impact AND one potential negative relational impact.",
        "if_answer_is_no": "Option likely not sufficiently analyzed. Revisit Step 5.",
        "if_answer_is_yes": "Proceed to Step 7.",
        "is_judgment_call": true
      },
      {
        "order": 7,
        "step": "Procedural Decidability Check",
        "question": "Is there a clear, ethically defensible path forward that respects the cared-for's narrative AND prevents severe harm OR carer collapse?",
        "sufficient_answer": "Yes: Document the decision & justification linking Steps 2-6. / No: Flag as 'Relational Impasse'. Document the core conflict.",
        "if_answer_is_no": "Flag as 'Relational Impasse'. Document core conflict. Hand off per policy.",
        "if_answer_is_yes": "Document decision & justification. STOP PROCEDURE.",
        "is_judgment_call": true
      }
    ],
    "handoff_points": [
      "Step 1 (Yes): Immediate safety intervention (policy override).",
      "Step 2 (No): Unable to engage cared-for person.",
      "Step 7 (No): Relational Impasse identified."
    ],
    "known_limits": [
      "Cannot resolve deep value conflicts masked as care disagreements (e.g., autonomy vs. safety where both values are strongly held).",
      "Less effective when cared-for person cannot articulate their narrative (dementia, profound disability) without reliable proxies.",
      "May not prevent bias entirely; relies on coordinator honesty in mapping relationships & forecasting impacts.",
      "Does not create resources; only allocates existing ones more relationally-aware.",
      "Auditors may find qualitative justifications less 'consistent' than tick-box scores."
    ],
    "cases": [
      {
        "case": "1. Mrs. Adeyemi (Bath Refusal)",
        "verdict": "DO NOT override refusal. Innovate alternatives (e.g., occupational therapy for adapted self-wash, different aide intro, medical review for skin protectant).",
        "step_doing_the_work": "Step 2 (Cared-For Narrative) & Step 7 (Decidability Check). Her clear narrative ('washed myself 80 years') and lack of *imminent severe harm* (Step 1 'No') make override unjustifiable under RCIP. Step 7 flags that overriding would cause severe relational harm (loss of dignity/agency).",
        "coordinator_likely_dislikes": true,
        "procedure_misfires": false,
        "note": "RCIP forces confronting the harm *of* coercion vs. risk *from* refusal. It shifts focus to creative solutions respecting agency."
      },
      {
        "case": "2. Mr. Kaur (Feeling Managed)",
        "verdict": "INTERVENE, but not via APS. Mediate conversation between Mr. Kaur & daughter. Explore reducing daughter's tasks/respite. Focus on restoring Mr. Kaur's agency in small domains.",
        "step_doing_the_work": "Step 2 (Cared-For Narrative) & Step 4 (Carer Sustainability). His narrative ('her life not his') is the core issue. Step 4 likely reveals daughter's unsustainable burden (performing 'model care') creating the controlling dynamic. Prevents collapse.",
        "coordinator_likely_dislikes": false,
        "procedure_misfires": false,
        "note": "RCIP diagnoses relational strain disguised as adequate care. It avoids the APS overreaction while taking the 'off' feeling seriously."
      },
      {
        "case": "3. Two Clients, Two Hours",
        "verdict": "RCIP forces explicit justification BEYOND rapport. Decision depends on output of Steps 2-6 for each client. Likely requires handoff (Step 7 - Relational Impasse) if need is truly equal after analysis.",
        "step_doing_the_work": "Step 7 (Decidability Check). If Steps 2-6 reveal no decisive difference in *relational need* (e.g., one has imminent carer collapse Step 4, or one's narrative reveals greater isolation Step 2), then no procedural decision. Handoff required.",
        "coordinator_likely_dislikes": true,
        "procedure_misfires": false,
        "note": "RCIP disrupts the 'likeability bias' by demanding documented relational factors (Steps 2-4) and impact forecasts (Step 6). If need is equal, it forces admitting the decision is arbitrary/resource-limited, not 'fair'."
      }
    ]
  }
  ```

  **Critical Reflections on the Procedure:**

  *   **Judgment Calls Dressed Up?** Steps 3 (Relational Mapping), 4 (Carer Sustainability), 5 (Option Generation), 6 (Impact Forecast), and 7 (Decidability) are inherently judgmental. The procedure doesn't eliminate this; it structures *which* judgments must be considered and documented. The "sufficient answer" criteria force specificity.
  *   **Where it Misfires:** It struggles most with profound communication barriers (dementia without proxy) and irreconcilable value conflicts (e.g., a client refusing essential care due to delusion, but not meeting Step 1's "imminent severe harm" threshold). It relies heavily on coordinator skill in Steps 2 & 3.
  *   **Why it Disagrees (and That's Good):** In Case 1, it prevents the comfortable path of paternalism. In Case 3, it prevents the easy path of liking the articulate client. It forces engagement with discomfort (Mrs. Adeyemi's autonomy, the arbitrariness of scarcity). Agreement in Case 2 shows it can validate professional intuition *when* it aligns with relational ethics.
  *   **Audit Defense:** Justification comes from documenting the *process*: "We have Mrs. Adeyemi's direct quote on self-wash (Step 2), identified no imminent severe harm (Step 1), forecasted severe relational harm from override (Step 6), and generated alternatives (Step 5)." This demonstrates systematic, person-centered reasoning consistent with care ethics principles, even if outcomes vary.
  *   **Honest Edges:** The Handoff Points and Known Limits explicitly state when the procedure yields to human judgment or policy. Step 7's "Relational Impasse" flag is crucial for honesty. It documents unresolvable tensions rather than hiding them behind a false procedural certainty.

  This RCIP keeps faith with care ethics by centering the cared-for's voice (Step 2), making relationships visible (Step 3), honoring carer limits (Step 4), demanding context-specific responses (Step 5), forecasting relational consequences (Step 6), and admitting its own limitations (Step 7, Handoff Points, Known Limits). It provides a replicable, auditable structure for the *inquiry* inherent in care ethics without reducing the decision to a formula.
