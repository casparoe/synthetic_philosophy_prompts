  Below is a systematic translation of the genocide debate into your epidemiological framework, followed by a residue report identifying clean mappings, distortions, and untranslatable elements. I’ve prioritized structural fidelity over decorative parallels and flagged points of low confidence.

  ---

  ### **Translation: Genocide Debate in Epidemiological Terms**  
  *Brainstormed mappings evaluated for utility vs. stretch*  

  1. **Lemkin’s Original Conception (1944)**  
     - *Your Terms:* **Broad Syndromic Surveillance Case Definition**  
     - Lemkin’s "destruction of national, racial, religious, or political groups" maps to a **high-sensitivity, low-specificity syndromic definition**. It captures a range of social pathologies (cultural suppression, mass killings, forced assimilation) as "cases" of a destructive process.  
     - *Analogy Utility:* High. Like syndromic surveillance for emerging diseases, it prioritizes early detection of patterns without requiring laboratory confirmation (legal proof).  

  2. **1948 Convention Definition & Special Intent (Dolus Specialis)**  
     - *Your Terms:* **Notifiable Disease with Strict Laboratory Confirmation**  
     - The Convention’s narrow protected groups (excluding political/class) and intent requirement act as a **high-specificity, low-sensitivity case definition** for formal reporting. "Intent to destroy" functions like **confirmatory lab testing** – necessary for official designation but prone to under-ascertainment where evidence is obscured (e.g., destroyed records, witness intimidation).  
     - *Analogy Utility:* Structural. Legal "intent" resembles requiring proof of pathogenicity before declaring an outbreak: crucial for courtroom specificity but fatal for preventive surveillance.  

  3. **Under-/Over-Inclusiveness Critiques**  
     - *Under-Inclusive (missed cases):* **Systematic Under-Ascertainment** due to restrictive criteria. Excluding political groups is like omitting a key demographic from surveillance – cases go uncounted despite identical clinical features (atrocities).  
     - *Over-Inclusive (false positives):* **Low-Specificity Misclassification**. Critics fear calling non-genocidal violence "genocide" dilutes the term, akin to false alarms in outbreak surveillance that erode trust.  
     - *Analogy Utility:* Clean. Both fields face sensitivity/specificity tradeoffs in case definitions.  

  4. **Politics of Naming Atrocities**  
     - *Your Terms:* **Notifiable Disease Reporting Thresholds**  
     - Declaring genocide triggers legal/political "intervention protocols," much like reporting a novel pathogen activates WHO/IHR mechanisms. Delays or reluctance mirror **surveillance bias** – e.g., states avoiding reporting cholera outbreaks to evade economic sanctions.  
     - *Analogy Utility:* Robust. Both involve administrative gatekeeping divorced from ground truth.  

  5. **Constituent Elements: Group-Based Victimization**  
     - *Your Terms:* **Case Definition Based on Demographic Exposure**  
     - Genocide requires victims be targeted *because of group membership*. Epidemiologically, this is like defining a disease **solely by the affected population** (e.g., "only affects refugees") rather than biological mechanisms.  
     - *Analogy Stretch:* Severe. Your framework defines harm by **act or outcome** (e.g., bullet wounds, starvation), not identity. This element resists clean translation.  

  ---

  ### **Residue Report: What Survives, Distorts, or Evaporates**  
  **I. Clean Translations (Structural Parallels)**  
  - **Under-Ascertainment & Case Definitions**  
    This maps cleanly because both fields share core tasks: *defining events systematically amid incomplete data*. The Convention’s definition is a **legal case definition** prioritizing specificity (minimizing false positives), while Lemkin’s is a **surveillance case definition** prioritizing sensitivity (minimizing false negatives). The tension echoes debates over relaxing diagnostic criteria during epidemics to capture subthreshold cases.  
    - *Why Structural?* Both require operational thresholds for action in uncertainty. Your pattern-matching holds because it reflects universal surveillance logic.  

  **II. Translations with Distortion (Conceptual Stretching)**  
  - **Special Intent Requirement**  
    Mapping intent to "confirmatory testing" *exposes a flaw* in the legal framework. In epidemiology, you infer causality from patterns (e.g., spatiotemporal clusters) without proving perpetrator motive. Demanding "intent evidence" is like requiring **proof of deliberate bioengineering** before declaring a pandemic – it confuses *legal guilt* with *event identification*.  
    - *Nature of Distortion:* Your framework treats harm as **observer-independent phenomena**; law makes harm **contingent on perpetrator cognition**. This is where analogy strains: intent has no surveillance counterpart.  
    - *Low Confidence Note:* I suspect this distortion reveals a deeper conflict – law individualizes crime, while your work populationizes harm.  

  - **Group Membership as Constitutive Element**  
    Genocide’s focus on victim identity (rather than act/outcome) is like defining a disease by **patient nationality instead of symptoms**. In your terms, group-based targeting is a **risk factor**, not a case criterion. Forcing this into epidemiology distorts its ontology of harm.  
    - *Key Distortion:* Your vocabulary quantifies *what is done to bodies*; law cares *why it was done to these bodies*.  

  **III. Untranslatable Elements (No Epidemiological Counterpart)**  
  - **"Uniquely Grave Crime" Normative Claim**  
    This resists translation **because your framework lacks a moral hierarchy of suffering**. Genocide’s asserted uniqueness is a *juridical-moral axiom*, not an empirical observation. Epidemiology can quantify excess mortality or injury severity but cannot rank "genocide deaths" as intrinsically worse than famine or bombardment deaths – just as surveillance can’t declare cholera "more evil" than typhoid.  
    - *Defect or Smuggled Morality?* **A defect of your framework for this purpose**. Public health is agnostic on why suffering matters; it measures burden. The legal category "smuggles in" moral gravity by fusing *scale*, *intent*, and *identity destruction* – elements your methods disentangle.  
    - *Why No Analogy?* Severity in epidemiology is **measured in disability/death**, not symbolic meaning.  

  - **Politics of Naming as Inherent to the Category**  
    The fight over "genocide" as a legitimizing/delegitimizing label has no parallel in disease surveillance. While reporting delays occur, diseases aren’t *constituted* by diplomatic recognition. Cholera remains cholera whether states report it or not; genocide’s power hinges on institutional ratification.  
    - *Residue Reason:* Law is performative ("speaking the crime into being"); surveillance is descriptive.  

  ---

  ### **Conclusion: Your Vocabulary’s Limits and Revelations**  
  Your framework excels at exposing **operational tensions** (e.g., sensitivity/specificity tradeoffs in case definitions) and **systematic biases** (under-ascertainment of atrocities). It *fails* to capture:  
  1. **Intent** as a legal hinge (a problem, not a gap),  
  2. **Identity-based harm** as constitutive (a category error for epidemiology),  
  3. **Moral gravity** claims (outside empirical measurement).  

  The distortion around intent is especially revealing: it suggests the Convention definition is **forensically optimized for courts** but **epistemically flawed for atrocity surveillance**. Meanwhile, the untranslatable "uniqueness" of genocide underscores that law and public health serve different masters – one judges human evil, the other curtails population suffering. Your vocabulary doesn’t *need* moral hierarchy; its power lies in counting all bodies equally.  

