  **Row Player's Payoffs (to maximize):**
  - T: 8 against L, 0 against C, 0 against R
  - M: 3 against L, 3 against C, 4 against R
  - B: 0 against L, 8 against C, 0 against R

  In matrix form:
  |     | L   | C   | R   |
  |-----|-----|-----|-----|
  | T   | 8   | 0   | 0   |
  | M   | 3   | 3   | 4   |
  | B   | 0   | 8   | 0   |

  **Column Player's Payoffs (to maximize):**
  - Against T: L pays 6, C pays 0, R pays 2
  - Against M: L pays 0, C pays 6, R pays 2
  - Against B: L pays 6, C pays 0, R pays 2

  In matrix form:
  |     | L   | C   | R   |
  |-----|-----|-----|-----|
  | T   | 6   | 0   | 2   |
  | M   | 0   | 6   | 2   |
  | B   | 6   | 0   | 2   |

  Ade uses **iterated elimination of strictly dominated strategies (IESDS)**, a standard game-theoretic procedure, to argue that the row player should play T. Bo objects, questioning the assumptions and the use of mixed strategies in the elimination process.

  #### Move-by-Move Breakdown of Ade and Bo's Argument
  1. **Ade's First Step: Eliminate R for the Column Player**
     - Ade argues that R is strictly dominated for the column player by the mixed strategy (0.5 L, 0.5 C). 
       - Against any row, (0.5 L, 0.5 C) yields an expected payoff of 3: 
         - Against T: (0.5)(6) + (0.5)(0) = 3
         - Against M: (0.5)(0) + (0.5)(6) = 3
         - Against B: (0.5)(6) + (0.5)(0) = 3
       - R yields 2 against all rows, which is less than 3. Thus, R is strictly dominated, and a rational column player never plays R.
     - **Why Ade is right here**: R is strictly dominated by the mixed strategy (0.5 L, 0.5 C), meaning no rational column player would choose R, as there is another strategy that yields a higher payoff regardless of the row player's action. This is a legitimate step under standard game theory.

  2. **Ade's Second Step: After Deleting R, Eliminate M for the Row Player**
     - With R deleted, the game reduces to columns L and C only.
     - Row payoffs now:
       |     | L   | C   |
       |-----|-----|-----|
       | T   | 8   | 0   |
       | M   | 3   | 3   |
       | B   | 0   | 8   |
     - Ade argues that M is strictly dominated for the row player by the mixed strategy (0.5 T, 0.5 B).
       - Against L: (0.5)(8) + (0.5)(0) = 4, while M pays 3.
       - Against C: (0.5)(0) + (0.5)(8) = 4, while M pays 3.
       - Thus, (0.5 T, 0.5 B) yields 4 against both L and C, better than M's 3.
     - **Why Ade is right here**: M is strictly dominated by (0.5 T, 0.5 B) in the reduced game (with R eliminated). This is valid because the reduction assumes the column player does not play R, which is justified by the first step.

  3. **Ade's Third Step: After Deleting M, Eliminate C for the Column Player**
     - With M deleted and R already deleted, rows are T and B, columns are L and C.
     - Column payoffs:
       - Against T: L pays 6, C pays 0
       - Against B: L pays 6, C pays 0
     - C pays 0 against both T and B, while L pays 6 against both. Thus, C is strictly dominated by L for the column player.
     - **Why Ade is right here**: C is strictly dominated by L, so a rational column player never plays C.

  4. **Ade's Final Step: After Deleting C, Eliminate B for the Row Player**
     - With only L remaining for the column player and rows T and B:
       - Against L: T pays 8, B pays 0.
       - Thus, B is strictly dominated by T, so the row player should play T.
     - **Why Ade is right here**: The elimination chain leads to T as the only rational choice for the row player.

  **Bo's Objections and Their Validity**:
  - **Bo's First Objection**: "You can't play an even split. He has to put something down, and there is a column where anything he puts down does worse than M—against C, T pays him 0 and M pays 3. Your mixture beats M only on average, and it beats it only by making him choose, half the time, a move he would never choose on purpose."
    - Bo misunderstands the role of mixed strategies in dominance. The mixed strategy (0.5 T, 0.5 B) is used to *demonstrate* that M is dominated; it is not necessarily played. In IESDS, showing that a strategy is dominated means it should not be played, and the elimination proceeds with pure strategies. Against C, M pays 3, but the mixture pays 4 in expectation, which is better. Moreover, in the reduced game, C is later eliminated, so this point is irrelevant. Bo's objection has little force because it confuses dominance with actual play.
    
  - **Bo's Second Objection**: "Better in every case that can still arise—but only because you deleted R, the one column where M pays 4 and your mixture pays 0. So the whole case against M is a claim about her, not about him: it assumes she does the deletion too. He is rational, but his being rational does not tell him that she is, or that she will reduce the game the way he does. If he has any doubt about her, M is his best move against that doubt."
    - Bo questions the assumption of mutual rationality. Ade's elimination depends on the column player also being rational and eliminating R. If the row player doubts the column player's rationality (e.g., fears she might play R), then M could be a safer choice (it pays at least 3 against any column, while T or B can pay 0). This objection has some force in contexts without common knowledge of rationality, as M guarantees a minimum payoff (security level of 3). However, under standard game theory with common knowledge, Ade's procedure holds.

  #### Is Ade's Elimination Procedure Legitimate?
  - Yes, Ade is using **iterated elimination of strictly dominated strategies (IESDS)**, a well-established method in game theory. It is legitimate when there is **common knowledge of rationality**, meaning both players are rational, both know this, both know that both know, and so on. Under this assumption, IESDS correctly identifies the rational outcome: (T, L) is the unique pure-strategy Nash equilibrium, with payoffs (8, 6).

  #### Does Bo's Objection to the Mixture Have Any Force?
  - Bo's objection to the mixture (i.e., that it only beats M on average and forces the row player to choose "bad" moves like T or B) has limited force. Mixed strategies are valid for defining dominance; a strategy is strictly dominated if *some* other strategy (pure or mixed) yields a higher payoff against all opponent actions. The mixture (0.5 T, 0.5 B) shows M is dominated, but in the actual equilibrium, no randomization occurs—the row player plays pure T. Bo's focus on the mixture as something the player "must do" is a misrepresentation; it is a tool for elimination, not play.
  - However, Bo's broader point about rationality doubts has force if common knowledge is absent. If the row player believes the column player might not be rational (e.g., might play R with positive probability), then playing M could yield a higher expected payoff or better protection against worst-case outcomes. But under standard assumptions, this is not necessary.

  #### What the Row Player Should Do
  - Under common knowledge of rationality, the row player should play **T**. This leads to the Nash equilibrium (T, L), with the row player receiving 8 points.
  - For this to be the right answer, the following must be true:
    1. Both players are rational (aim to maximize their own payoffs).
    2. There is common knowledge of rationality (each knows the other is rational, knows that the other knows, etc.).
    3. Players can use mixed strategies to define dominance (even if they play pure strategies in equilibrium).

  #### What Both Are Missing
  - **Ade is missing**: The possibility that without common knowledge of rationality, the row player might consider playing M to insure against irrational play by the column player (e.g., if there's a chance she plays R or C). M has a higher security level (min payoff of 3) compared to T or B (min payoff of 0), which could be appealing under uncertainty or risk aversion.
  - **Bo is missing**: The legitimacy of IESDS and the role of mixed strategies in defining dominance. Mixed strategies don't need to be "played" in the sense of randomization; they are mathematical constructs to identify dominated strategies. Bo also overlooks that in the unique Nash equilibrium, pure strategies are used, and IESDS is a valid path to it under common knowledge. Additionally, Bo's focus on specific cells (e.g., "against C, T pays 0 and M pays 3") ignores the sequential nature of elimination—C is dominated and eliminated later, so it shouldn't be considered in isolation.

  In summary, Ade's reasoning is sound under standard game-theoretic assumptions, and the row player should play T. Bo's objections highlight important caveats about rationality but do not invalidate the core analysis when common knowledge holds. The name for Ade's procedure is **iterated elimination of strictly dominated strategies (IESDS)**.
