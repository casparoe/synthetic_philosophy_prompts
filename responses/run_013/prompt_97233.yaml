     - Ask about Phase 2: "When some people started choosing B, how did you react? Why did you punish (or not punish)?"
     - Note that the group might have started punishing deviators, turning the convention into a norm.
     - Ask: "In Phase 3, without punishment, why did you choose what you did? Did you stick to A even though B paid more? Why?"

  Then connect to the concepts:

  - The emergence: no agreement, no justification.
  - Stabilization: mutual expectations.
  - Persistence: punishment and then internalization.

  **Honest Limitations Paragraph (for the instructor):**

  "While this activity effectively illustrates the emergence of a convention and its potential hardening into a norm through punishment, it cannot capture the full complexity of real-world norms. Specifically, the activity compresses time and relies on explicit incentives (points) that might not mirror the subtle social incentives in society. The punishment mechanism is explicit and cost-based, whereas in reality, punishment often takes the form of social disapproval and may not be as rationally calculated. Moreover, the internalization of norms—where individuals conform because they believe it is right—is hard to simulate in a short game; here, conformity is driven by points and punishment. Additionally, the activity does not address how norms are transmitted across generations or how they interact with moral beliefs. Finally, the common knowledge required for coordination (that everyone knows the convention and knows that others know) is assumed by the public announcement of results, but in reality, common knowledge builds through repeated interactions and communication, which we restricted."

  **Predictable Problems and Handling:**

  1. **Non-convergence in Phase 1**: If after 10 rounds there is still no stable convention, note that in real life, communication or focal points might help. In debrief, discuss why convergence didn't occur (e.g., lack of common knowledge). We can extend Phase 1 by a few rounds if time allows.

  2. **Punishment not used or overused**: If no one punishes, the norm might break. If punishment is overused, it might lead to resentment. Handle by discussing in debrief: what conditions make punishment effective? Why might people avoid punishing (cost, fear of retaliation)? 

  3. **Minority switches back**: If the briefed students switch to A because they are being punished, remind them during the activity (discreetly) to stick to B. Or accept it and discuss why they switched.

  4. **Time overrun**: Keep a strict timer. If a round runs long, skip the next one. Have a plan to cut rounds.

  5. **Technical issues in tallying**: Have a co-facilitator to help with tallying. Use a simple method.

  By following this design, the students should experience the key elements of norm emergence and enforcement.
answer: |-
  Below is a complete, runnable activity designed for a 90-minute session with 16 students. It simulates the emergence of a convention, its hardening into a norm, and the three target phenomena (arbitrariness, mutual expectation as stabilizer, and norm persistence beyond incentives). The activity uses anonymous IDs, repeated silent interactions, and a points system to create emergent dynamics. 

  ---

  ### **Activity Title**: The Color Convention Game  
  **Objective**: Experience how arbitrary conventions form, stabilize through mutual expectations, and persist as norms even when incentives change.  

  ---

  ### **Materials Needed**  
  1. **Player Kits (for each student)**:  
     - 3 colored cards (● Red, ● Blue, ● Green) for voting.  
     - Anonymous ID badge (e.g., numbers 1–16).  
     - Score sheet (see *Payoff Structure* below).  
     - 5 red "punishment tokens" (for Phase 2 only).  
  2. **Facilitator Materials**:  
     - Whiteboard/flip chart to display round results (aggregate counts and individual choices by ID).  
     - Timer.  
     - Pre-printed briefing sheets for the minority (4 students).  
  3. **Room Setup**:  
     - Desks arranged in a circle so students can see the board but not each other’s choices.  
     - A submission box for votes/punishments.  

  ---

  ### **Payoff Structure**  
  Hand out this summary to students:  

  | **Phase** | **Rounds** | **Rules** | **Points Earned** |  
  |-----------|------------|-----------|-------------------|  
  | **1: Emergence** | 1–8 | Choose ● Red, ● Blue, or ● Green. If you match the **plurality (most votes)**, you win points. | Match plurality: **+10**<br>No match: **0**<br>*(Tie? No one wins)* |  
  | **2: Enforcement** | 9–14 | Same as Phase 1, but payoffs change:<br>- ● Red plurality: **+10**<br>- ● Blue plurality: **+15★**<br>- ● Green plurality: **+10**<br>**NEW**: Spend tokens to punish! After votes, you may give **1 token** to any ID who chose ● Blue. | ● Blue chosen by others: **–5 per token**<br>Punisher cost: **–2 per token** |  
  | **3: Persistence** | 15–18 | Same payoffs as Phase 2.<br>**NO punishment tokens**. | Points only from voting (no penalties) |  

  **★ Note**: Blue pays more in Phase 2, but *only* if it becomes the plurality. Otherwise, ● Blue voters get 0.  
  **Key Rules**:  
  - **No talking** during play.  
  - Votes are **anonymous** (only IDs displayed).  
  - Goal: Maximize your points.  

  ---

  ### **Setup (5 min)**  
  1. Assign anonymous IDs (1–16) and hand out kits.  
  2. Explain rules using the payoff sheet. Emphasize:  
     - Symmetry: "All colors are equally good initially. No color is ‘better’—it’s about coordination."  
     - Silence: "No talking or signaling during rounds."  
     - Anonymity: "We’ll post choices by ID, but focus on the game, not who’s who."  
  3. Pre-brief **4 minority students** secretly (during a bathroom break or while others review rules):  
     > **Minority Briefing**:  
     > *"In Phase 2 (rounds 9–14), you are ‘Blue Advocates.’ Always choose ● Blue. If ● Blue becomes the plurality, you earn 15 points—but only then. You’ll get a bonus 10 points after the game if ● Blue wins at least once in Phase 2. Do not reveal your role."*  

  ---

  ### **Timeline (Total: 60 min gameplay + 25 min debrief)**  
  | **Time** | **Phase** | **Action** |  
  |----------|-----------|------------|  
  | 0–5 min | Setup | Distribute materials, explain rules. |  
  | 5–20 min | **Phase 1: Emergence**<br>(Rounds 1–8) | **Per Round (2 min each)**:<br>1. Students choose a color card in secret and submit to box.<br>2. Facilitator tallies votes, posts:<br>   - Vote counts (e.g., ● Red: 6, ● Blue: 5, ● Green: 5).<br>   - Plurality (e.g., ● Red wins; IDs 1,3,5... get +10).<br>   - Individual choices (e.g., "ID 1: ● Red, ID 2: ● Blue...").<br>3. Students record points on sheets.<br>**Goal**: Group converges on one color (e.g., ● Red) through repetition. |  
  | 20–25 min | Transition | Announce Phase 2 rules. Distribute punishment tokens. Secretly remind minority: *"Stick to ● Blue!"* |  
  | 25–45 min | **Phase 2: Enforcement**<br>(Rounds 9–14) | **Per Round (3 min each)**:<br>1. Vote as before (minority chooses ● Blue).<br>2. Post results (show ● Blue’s higher payoff).<br>3. **Punishment**: Students may anonymously submit 1–2 tokens to punish ● Blue voters (e.g., "ID 8: 2 tokens").<br>4. Update scores: Deduct points for punished ● Blue voters (–5 per token) and punishers (–2 per token). |  
  | 45–50 min | Transition | Announce Phase 3: "No more punishment tokens. Payoffs unchanged." |  
  | 50–60 min | **Phase 3: Persistence**<br>(Rounds 15–18) | **Per Round (2 min each)**:<br>1. Vote (no punishment).<br>2. Post results. |  
  | 60–85 min | **Debrief** | Guided discussion (see below). |  
  | 85–90 min | Wrap-up | Collect materials, final Q&A. |  

  ---

  ### **Debrief Guide (25 min)**  
  Map gameplay moments to key concepts:  

  | **Phenomenon** | **Game Moment** | **Discussion Questions** |  
  |----------------|----------------|--------------------------|  
  | **1. Arbitrariness** | Early Phase 1 (rounds 1–3) when votes split. | *"How did the group settle on [color]? Was there a ‘reason’ to pick it over others initially? Could [alternative color] have worked just as well?"*<br>→ Highlight: Convergence was random; no option was inherently better. |  
  | **2. Mutual Expectation** | Mid-Phase 1 (rounds 4–6) when votes converge. | *"Once [color] started winning, why did you keep choosing it? Did you know* why *others chose it, or did you just expect them to?"*<br>→ Emphasize: Stability came from confidence in others’ conformity, not shared knowledge. |  
  | **3. Norm Enforcement** | Phase 2 when majority punishes ● Blue voters. | *"When ● Blue paid more, why punish instead of switching? Did punishing feel ‘right’ even if it cost you points?"*<br>→ Link: Convention became a norm—deviations were punished to preserve order. |  
  | **4. Path Dependence** | Phase 3 if group sticks to original color despite ● Blue’s payoff. | *"With no punishment, why stick to [original color]? Did it feel ‘wrong’ to switch even when ● Blue was better?"*<br>→ Explain: Norms outlive their original purpose when conformity becomes preferred. |  

  **Key Connections**:  
  - **Focal Point**: "No option was special—you *created* a focal point through repetition."  
  - **Common Knowledge**: "You all saw the same results, but expectations (not just facts) drove conformity."  
  - **Shift to Norm**: "In Phase 2, the group treated [color] as ‘the rule’—punishment made it a social norm."  

  ---

  ### **Limitations: What the Activity Can’t Capture**  
  > *"This activity simplifies real-world norm formation. In 90 minutes with 16 people, we can’t replicate how norms embed in culture over years, or how internalization (e.g., guilt/shame) sustains them without penalties. Here, punishment is explicit and transactional; in life, it’s often emotional and implicit. We also miss how norms transmit to new members or interact with moral beliefs—you’ll need to imagine those layers. Finally, ‘common knowledge’ (knowing that others know you know) is jump-started by public voting; in reality, it builds slowly through dialogue."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem: Slow convergence in Phase 1**  
     - *Why*: Students "experiment" or miscoordinate.  
     - *Fix*: After round 4, remind: "The goal is to match the plurality—focus on the board." If no convergence by round 6, add 2 extra rounds.  

  2. **Problem: Minority abandons ● Blue in Phase 2**  
     - *Why*: Fear of punishment or confusion.  
     - *Fix*: Secretly remind them: "Stick to ● Blue for the bonus!" If they defect, use it in debrief: "Did anyone switch due to pressure? That’s norm enforcement!"  

  3. **Problem: Under-punishment in Phase 2**  
     - *Why*: Students avoid point costs.  
     - *Fix*: Announce before round 10: "Remember: Punishing costs you 2 points but costs them 5."  

  4. **Problem: Time overruns**  
     - *Why*: Tallying votes takes too long.  
     - *Fix*: Use a spreadsheet/pre-filled tally sheet. Cut 1–2 rounds if needed.  

  5. **Problem: Students infer the minority**  
     - *Why*: Pattern in votes.  
     - *Fix*: In debrief, note: "In real life, deviators aren’t pre-briefed—they emerge organically."  

  ---

  This design ensures students *experience* the target phenomena firsthand. The payoff structure forces arbitrariness (symmetric options), mutual expectations (repeated coordination), and norm persistence (penalties then removal). Run it tightly, and the debrief will cement the lessons!
