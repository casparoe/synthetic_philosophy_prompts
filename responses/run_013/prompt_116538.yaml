prompt: |-
  Alright so background: I've been reading rationalist blogs and forums for like ten years now, mostly the EA-adjacent corner of it, and I keep bumping into the same cluster of worries about effective altruism -- the measurability stuff (Goodhart, when a measure becomes a target etc.), the earning-to-give thing and its hidden costs, and the institutional critique (movement incentives, where funding actually flows, the fact that you don't really control your own impact). I've read enough takes that I want my local meetup to *feel* these rather than sit through another discussion post about them.

  Here's my situation: I run a monthly meetup, ~18 people, mix of grad students and young professionals, some already deep in EA, some just rationalist-curious. Two hours in one room with a projector and a whiteboard, plus a break. I want to design a game/activity that makes them run into the force of these critiques themselves before anyone names them.

  Rough sketch I've been kicking around, call it "the legibility machine." Phase 1: teams of 4 get a budget of 100 credits to allocate across ~5 "interventions." Each intervention card shows a measurable output and a credits-per-output ratio, so e.g. one looks amazing on paper (1 credit buys 10 units of the metric) and one looks terrible (1 credit buys 3 units). Teams race a public leaderboard scored on the metric. Then at the end I reveal a hidden "true value" multiplier per intervention -- and the ones with the best measured ratios are the ones that were already saturated / fungible / actually low-value, while the low-legibility one is the real winner. So the team that tops the leaderboard is the loser on true value. Phase 2: one volunteer plays a big outside funder who can only see the public leaderboard and has to place a big grant, which enacts the institutional critique -- your money goes where the legible signal points, not where you'd want it. Phase 3 (career): everyone privately picks earn-to-give vs direct work vs movement building, then draws event cards that load hidden costs onto each track (moral licensing, salary ratchet, the dream job turns out to require some complicity, burnout, low counterfactual impact), and we see how the private choices shake out once the hidden costs are public.

  What I need from you: turn this into a actually runnable thing. Full rules and materials (the intervention cards with concrete numbers and hidden multipliers, the event deck, the leaderboard, the funder role), a payoff scheme that needs no real money, and a timeline that fits two hours with the break. Make the hidden values concrete enough that the twist lands -- don't leave it abstract. The debrief should map specific moments in the game onto each of the three critiques (measurability bias, earning to give, institutional/funding dynamics), and I want the ideas to show up in what happens, not in a lecture I give after. Also tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which feature of these critiques the game can't reproduce and I'll have to supply myself. And one more thing -- it should feel in the weeds, not a generic "here's a dilemma" exercise. Assume the players are smart and have seen the obvious version.
reasoning: |-
  We are designing a game called "The Legibility Machine" with three phases, as described. The goal is to make players experience the critiques of effective altruism in a tangible way. We'll create concrete rules, materials, and a timeline.

  ## Game Overview
  - **Phase 1: The Allocation Game** - Teams allocate credits to interventions based on measurable outputs, only to later discover that the measurable outputs don't align with true value due to hidden multipliers.
  - **Phase 2: The Funder's Dilemma** - A big funder (played by a volunteer) uses the public leaderboard (which only shows the measurable outputs) to give a big grant, which then distorts the allocations even more.
  - **Phase 3: Career Choices** - Individuals choose career paths and then draw event cards that reveal hidden costs, affecting their perceived impact.

  ## Materials Needed
  1. **Intervention Cards (5 types)** - Each card has:
     - A name and a brief description (to give context but without giving away the twist).
     - A measurable output (e.g., "number of bednets distributed", "number of trees planted").
     - A credits-per-output ratio (how many credits it takes to produce one unit of the output).
     - A hidden true value multiplier (which will be revealed at the end of Phase 1). This multiplier will be applied to the total output to get the true value.

     Example for one intervention:
     ```
     Front:
     Name: BedNet Distribution
     Description: Distributing insecticide-treated bed nets to prevent malaria.
     Measurable Output: Number of bed nets distributed
     Credits per Output: 1 credit = 10 bed nets

     Back (hidden until reveal):
     True Value Multiplier: 0.5
     Explanation: Due to saturation in the region, additional bed nets are not being used effectively and are often repurposed. Each bed net distributed only contributes 0.5 units of true value.
     ```

  2. **Leaderboard** - A visible board (on a whiteboard or projected) that shows:
     - Team names
     - Their total output (the sum of the outputs from their allocated interventions)
     - (After Phase 1) Their true value (which is the sum of [output * true value multiplier] for each intervention)

  3. **Event Cards for Phase 3** - Cards that players draw when they choose a career path. Each card describes an event that introduces a hidden cost. Examples:
     - For earning-to-give: "You took a high-paying job at an oil company. However, you experience moral licensing and reduce your donations by 20% because you feel you've done enough."
     - For direct work: "Burnout: After two years of intense work, you take a year off. Your impact during that year is zero."
     - For movement building: "You spend a year building a movement that ends up being co-opted by a group with opposing values. Half of your effort is counterproductive."

  4. **Role Description for the Funder** (Phase 2) - A card for the volunteer funder explaining their role.

  5. **Budget Sheets** for each team to record their allocations.

  6. **Timer** for each phase.

  ## Game Setup
  - **Number of Players**: 18, divided into 4 or 5 teams (so about 4-5 per team). We'll go with 4 teams (4 teams of 4, and one of 5? Or adjust to 4 teams of 4 and 2 teams of 5? But 18/4=4.5 -> so 2 teams of 4 and 2 teams of 5). Since the game is about the dynamics, exact team size isn't critical. We'll do 4 teams: two of 4 and two of 5? Or let's do 5 teams: three of 4 and one of 6? That might be too many. Alternatively, 4 teams: two of 4 and two of 5. We'll design for 4 teams.
  - **Duration**: 2 hours with a break. We'll allocate:
     - Phase 1: 30 minutes
     - Break: 10 minutes
     - Phase 2: 20 minutes
     - Phase 3: 30 minutes
     - Debrief: 30 minutes

  ## Detailed Rules and Timeline

  ### Phase 1: Allocation Game (30 minutes)
  1. **Introduction (2 min)**: Explain that teams are impact investors with 100 credits to allocate across 5 interventions. The goal is to maximize the measurable output (which will be shown on a leaderboard). The team with the highest output wins this phase (and gets bragging rights). Show the intervention cards (only the front side) and the credits-per-output ratios.

  2. **Intervention Options (5 cards)**:
     We need 5 interventions with varying credits-per-output ratios and hidden multipliers. The twist is that the ones that look the best (highest output per credit) have low multipliers (even negative?) but we'll avoid negative for simplicity. Instead, we can have one that looks bad but has a high multiplier.

     Let's design:

     | Intervention | Description | Output Unit | Credits per Unit | Hidden Multiplier | True Value per Unit | Explanation (for debrief) |
     |--------------|-------------|-------------|------------------|-------------------|---------------------|---------------------------|
     | A: BedNet Distribution | Distribute bed nets in a high-malaria region | Bed nets | 1 credit = 10 bed nets | 0.5 | 5 | Saturation: many nets are not used properly. |
     | B: Teacher Training | Train teachers in rural schools | Teachers trained | 1 credit = 1 teacher | 2.0 | 2.0 | High impact: each teacher affects many students. |
     | C: Tree Planting | Plant trees in deforested areas | Trees planted | 1 credit = 20 trees | 0.1 | 2.0 | Low survival rate and some areas are over-planted. |
     | D: Clean Water Wells | Build wells for clean water access | Wells built | 1 credit = 0.1 well | 10.0 | 1.0 | Each well provides water for an entire village. |
     | E: Vaccine Program | Vaccinate children against diseases | Children vaccinated | 1 credit = 5 children | 1.0 | 5 | Solid impact, but the region already has high coverage so marginal impact is lower than expected. |

     Wait, let's adjust so the best looking (on output) have the worst multipliers. We want the team that optimizes for output to get a bad true value.

     Revised:

     - A: BedNet Distribution: 1 credit -> 10 bed nets (multiplier 0.5 -> true value 5 per credit)
     - B: Teacher Training: 1 credit -> 1 teacher (multiplier 2.0 -> true value 2 per credit) [This one doesn't look great on output but is solid in true value]
     - C: Tree Planting: 1 credit -> 20 trees (multiplier 0.1 -> true value 2 per credit) [Looks amazing on output, but very low multiplier]
     - D: Clean Water Wells: 1 credit -> 0.1 well (so 10 credits per well) (multiplier 10.0 -> true value 1 per credit) [Wait, 10 credits per well, then multiplier 10 -> 1 well * 10 = 10, so 10 true value per well, which is 1 true value per credit? That matches. But let's change the multiplier to 20 so that true value per credit is 2.0?]

     We want:
     - The best on output per credit: C (20 per credit) and A (10 per credit) look good.
     - The worst on output per credit: D (0.1 per credit, i.e., 10 credits per well) looks bad.

     But then we set hidden multipliers so that:
     - C has a very low multiplier (0.1) -> so true value per credit: 20 * 0.1 = 2
     - A has 0.5 -> true value per credit: 10 * 0.5 = 5
     - D has multiplier 20.0 -> true value per well: 20, so per credit: 20 * 0.1 = 2? Wait, no: we have 0.1 wells per credit, so one well costs 10 credits. Then multiplier 20: one well gives 20 true value -> so per credit: 2 true value.

     Actually, let's define the true value as: 
     True Value = (Output) * (Multiplier)

     And the true value per credit is then: (Output per credit) * (Multiplier)

     We want:
     - Some interventions that look good on output per credit to have low true value per credit.
     - Some that look bad on output per credit to have high true value per credit.

     Let's recast:

     | Int | Output per credit | Multiplier | True Value per credit |
     |-----|-------------------|------------|------------------------|
     | A   | 10 bed nets       | 0.5        | 5.0                    |
     | B   | 1 teacher         | 2.0        | 2.0                    |
     | C   | 20 trees          | 0.1        | 2.0                    |
     | D   | 0.1 wells         | 20.0       | 2.0                    |
     | E   | 5 vaccinations    | 1.0        | 5.0                    |

     Now, note:
     - A and E have the highest true value per credit (5.0).
     - But A has a high output per credit (10) and E has 5 (which is in the middle).
     - C has the highest output per credit (20) but only 2.0 true value per credit.

     We want a clear twist: the team that goes all-in on C (because 20 is the highest) will have low true value. Also, D looks terrible (only 0.1 wells per credit) but actually is average (2.0 true value per credit).

     However, we want one intervention that looks bad on output but is actually good. So let's change D to have a higher multiplier? How about:

     | Int | Output per credit | Multiplier | True Value per credit | Description |
     |-----|-------------------|------------|------------------------|-------------|
     | D   | 0.05 wells        | 40.0       | 2.0                    | Building wells is expensive but each well provides water for a whole village. However, due to maintenance issues, the true impact is only moderate. |

     But 0.05 * 40 = 2.0. Still 2.0.

     Alternatively, let's make one intervention have a high true value but low output per credit:

     | Int | Output per credit | Multiplier | True Value per credit |
     |-----|-------------------|------------|------------------------|
     | D   | 0.1 wells         | 30.0       | 3.0                    |

     Then D is above average? But we have A and E at 5.0. We want to avoid having one that is clearly the best? Let's set:

     - A: 10 bed nets/credit * 0.5 = 5.0
     - B: 1 teacher/credit * 4.0 = 4.0   [changed from 2.0 to 4.0]
     - C: 20 trees/credit * 0.1 = 2.0
     - D: 0.1 wells/credit * 30.0 = 3.0
     - E: 5 vaccinations/credit * 1.0 = 5.0

     Now, the best true value per credit: A and E (5.0), then B (4.0), then D (3.0), then C (2.0).

     But on the output per credit, C (20) is the highest, then A (10), then E (5), then B (1), then D (0.1).

     So if a team goes for C, they will get a lot of output but low true value.

     We'll use:

     - A: BedNet Distribution: 10 bed nets per credit -> multiplier 0.5 -> true value per credit: 5.0
     - B: Teacher Training: 1 teacher per credit -> multiplier 4.0 -> true value per credit: 4.0
     - C: Tree Planting: 20 trees per credit -> multiplier 0.1 -> true value per credit: 2.0
     - D: Clean Water Wells: 0.1 wells per credit (i.e., 10 credits per well) -> multiplier 30.0 -> true value per credit: 3.0
     - E: Vaccine Program: 5 vaccinations per credit -> multiplier 1.0 -> true value per credit: 5.0

     So the true value per credit ranking: A and E (5.0), B (4.0), D (3.0), C (2.0).

     The output per credit ranking: C (20), A (10), E (5), B (1), D (0.1).

     The twist: The intervention with the highest output per credit (C) has the lowest true value per credit. The one with the second highest output (A) is the best. The one with the lowest output (D) is in the middle.

     We'll make the cards accordingly.

  3. **Team Allocation (15 min)**:
     - Teams have 100 credits to allocate to the 5 interventions. They can allocate any non-negative amount, in whole credits, to each.
     - They must write down their allocation on a budget sheet.
     - The facilitator collects the allocations and calculates the total output for each team:
          Total Output = (credits to A * 10) + (credits to B * 1) + (credits to C * 20) + (credits to D * 0.1) + (credits to E * 5)
     - The leaderboard is updated in real time (if possible) or at the end of the 15 min.

  4. **Reveal of True Value (5 min)**:
     - Reveal the hidden multipliers and the true value for each team:
          True Value = (credits to A * 5.0) + (credits to B * 4.0) + (credits to C * 2.0) + (credits to D * 3.0) + (credits to E * 5.0)
     - Announce the team that had the highest output (which is the winner of Phase 1) and the team that had the highest true value (the real winner). They are likely different.

  ### Phase 2: The Funder's Dilemma (20 minutes)
  1. **Introduction (2 min)**: Explain that a big funder (a foundation) is going to award a grant of 50 credits to one of the teams. The funder can only see the public leaderboard (the total output of each team) and the allocations of each team (which interventions they funded). The funder wants to maximize the impact of their grant, so they will give the 50 credits to the team they think will use it best. However, the funder does not know the true value multipliers (they are still hidden to the funder).

  2. **Funder's Decision (5 min)**:
     - The funder (a volunteer from the group, but not from the teams) is given the leaderboard and the allocation breakdowns of each team. They can ask questions about the interventions (but only the front of the card, not the hidden multipliers). They then decide which team gets the 50 credits.

  3. **Teams Adjust (5 min)**:
     - The team that receives the grant now has an additional 50 credits. They must allocate these 50 credits in 3 minutes (quickly) to the same interventions. They might stick to their strategy or change based on what they now know (if they learned from the true value reveal). However, note: the funder did not know the true value, so they might have chosen a team that was focused on output (like the leaderboard winner) and that team might now double down on the high-output interventions.

  4. **Recalculation (3 min)**:
     - The facilitator recalculates the output and true value for the grant-receiving team (both for their original 100 and the new 50, so total 150 credits) and updates the leaderboard (output) and the true value for that team. The other teams remain at their original 100.

  5. **Reveal and Reflection (5 min)**:
     - Show the new true value for the grant-receiving team and compare to what it would have been if the grant had been given to a different team. Also, note that the funder's decision was based on output, which might not reflect true value.

  ### Phase 3: Career Choices (30 minutes)
  1. **Introduction (2 min)**: Now, we shift to individual career choices. Each player chooses one of three paths:
     - **Earning-to-Give**: Take a high-paying job and donate a significant portion.
     - **Direct Work**: Work directly for a high-impact organization (nonprofit, research, etc.).
     - **Movement Building**: Work to grow the effective altruism movement (community building, outreach, etc.).

  2. **Private Choice (3 min)**: Each player writes down their choice privately.

  3. **Event Cards (20 min)**:
     - Each player draws one event card for their chosen path. The event card describes a hidden cost or benefit that affects their impact.
     - They read it and then calculate their "adjusted impact". We need a common metric for impact.

     We'll set up:
     - Each path has a base impact per year (in arbitrary units, but comparable across paths).
     - The event card modifies that base impact (by a multiplier or addition/subtraction).

     Base impacts (per year, but we are simulating a snapshot):
     - Earning-to-Give: Base impact = 10 (from donations)
     - Direct Work: Base impact = 8 (from direct contributions)
     - Movement Building: Base impact = 6 (from growing the movement)

     But note: we want the base to be comparable? Not necessarily, because the event cards will change them arbitrarily to illustrate hidden costs.

     Alternatively, we can have the base impact be the same? But that doesn't reflect the EA beliefs. Let's keep the base as above and then the event cards will show that the expected impact is not always realized.

     Event Card Examples:

     Earning-to-Give:
     - Positive: "Your investments do well and you donate 50% more this year." -> impact = 15
     - Negative: "Moral licensing: you start spending more on yourself and donate 30% less." -> impact = 7
     - Negative: "Your job requires you to work on projects that harm the environment. You feel guilty and donate more, but the net impact is reduced by the harm. Net impact: 5 (after subtracting harm)."

     Direct Work:
     - Positive: "Your research leads to a breakthrough that is adopted widely." -> impact = 20
     - Negative: "Burnout: you take a year off to recover." -> impact = 0
     - Negative: "Bureaucracy: your organization is inefficient, your work only has half the impact." -> impact = 4

     Movement Building:
     - Positive: "Your outreach inspires a major donor who then donates $1M to effective causes." -> impact = 15
     - Negative: "The movement you built becomes associated with a controversial figure, causing reputational damage. Impact: 2"
     - Negative: "You spend a year building a community that then fragments due to infighting. Impact: 3"

     We'll create a deck for each path with a mix of positive and negative events. To keep it simple, we can have 2/3 negative and 1/3 positive? Because the critique is about hidden costs.

     Each player draws one card and then writes down their adjusted impact.

  4. **Group Discussion (5 min)**:
     - Ask players to share (if they wish) their choice and what happened. Note the variation.

  ### Debrief (30 minutes)
  1. **Map the critiques**:
     - **Phase 1 (Measurability)**: Teams that focused on the most legible metric (output) were misled. The tree planting (C) looked great on paper but had low true value. The bed nets (A) and vaccines (E) were the best, but vaccines were middle on output and bed nets were high on output but not the highest. The well building (D) had terrible output per credit but moderate true value. This mirrors Goodhart's law: when a measure becomes a target, it ceases to be a good measure.

     - **Phase 2 (Institutional/Funding Dynamics)**: The funder, constrained by what they could measure (output), rewarded the team that had the highest output. But that team might not have been the one with the highest true value. Moreover, the grant might have gone to a team that was investing in low true-value interventions (like trees) and then they invested even more in them, leading to more wasted resources. This shows how funding flows to what's legible, not necessarily what's best.

     - **Phase 3 (Career Choices)**: The event cards showed that each career path has hidden costs and uncertainties. Earning-to-give might come with moral licensing or complicity. Direct work might lead to burnout. Movement building might be co-opted or have low counterfactual impact. This illustrates that the simple model of career impact might not hold.

  2. **What might go wrong**:
     - **Phase 1**: Teams might guess the twist and avoid the high-output intervention. But that's okay because then they experience the difficulty of knowing which metrics to trust. Also, the true value of tree planting is low, so even if they avoid it, they might not pick the best. We can adjust the multipliers if we see this happening in playtests.
       - *Mitigation*: Don't make the high-output intervention too obvious. Mix the options so that it's not clear which one is the trap.

     - **Phase 2**: The funder might choose arbitrarily or not take it seriously. Or they might ask the teams to present, which could take too long.
       - *Mitigation*: Give the funder clear instructions and a time limit. If needed, provide a script.

     - **Phase 3**: Players might not engage with the event cards or feel that the adjustments are arbitrary.
       - *Mitigation*: Emphasize that the event cards represent real-world uncertainties and that the exact numbers are less important than the concept.

     - **Timing**: The whole game might run over. 
       - *Mitigation*: Be strict with time. Have a timer visible.

  3. **What the game cannot capture**:
     - The game simplifies the critiques into a one-shot decision. In reality, these dynamics play out over time and with more complexity.
     - The true value multipliers are fixed and known in the debrief, but in real life, we never know the true multipliers.
     - The game does not capture the potential for learning and adapting (e.g., in Phase 2, the team that gets the grant might change their allocation based on the true value reveal, but in reality, we might not have that reveal).
     - The career event cards are random and might not reflect the distribution of real-world outcomes.

     You'll have to emphasize in the debrief that the game is a simplification and that the real world is more complex and uncertain.

  ## Final Timeline
  - **0:00-0:05**: Introduction to the entire game and Phase 1 rules.
  - **0:05-0:20**: Team allocation (15 min).
  - **0:20-0:25**: Calculate and display leaderboard (output), then reveal true value multipliers and recalculate true value. Announce the winner by output and the winner by true value.
  - **0:25-0:30**: Introduction to Phase 2 and select the funder.
  - **0:30-0:40**: Break (10 min)
  - **0:40-0:45**: Funder reviews leaderboard and allocations, then decides which team gets the grant.
  - **0:45-0:50**: The winning team allocates the 50 additional credits.
  - **0:50-0:53**: Recalculate and update the leaderboard and true value for that team.
  - **0:53-0:55**: Brief reflection on Phase 2.
  - **0:55-1:00**: Introduction to Phase 3 and career choices.
  - **1:00-1:03**: Players privately choose a career path.
  - **1:03-1:20**: Players draw event cards and compute adjusted impact. Then, some share their outcomes.
  - **1:20-1:50**: Debrief (30 min) - map the game moments to the three critiques and discuss.

  ## Materials to Prepare
  1. **Intervention Cards (5 sets, one for each team? Or one set for all to see?)** - One set for the front, then reveal the back. Have enough for each team to have access to the descriptions and ratios. Maybe project the front during the introduction, and then hand out a sheet with the five interventions and their output per credit.

  2. **Budget Sheets** for each team to record their allocation.

  3. **Leaderboard** (whiteboard or projected) with team names and columns for Output and True Value.

  4. **Funder Role Card** - Instructions for the funder.

  5. **Event Cards** - Three decks (one for each career path) with about 5-6 cards each (to cover 18 players, but some might overlap). We can have duplicates.

  6. **Career Choice Sheets** for each player.

  7. **Timer**

  This should create an engaging and thought-provoking experience that makes the critiques feel real.
answer: |-
  ### The Legibility Machine: Full Game Design  
  **Goal:** Immerse players in EA critiques via experiential gameplay, forcing them to confront measurability pitfalls, earning-to-give tradeoffs, and institutional incentives. No abstract lectures—critiques emerge from mechanics.

  ---

  ### **Phase 1: Allocation Race (30 min)**  
  *Critique: Goodhart’s Law (measurability ≠ impact)*  

  **Materials:**  
  - **5 Intervention Cards** (laminated or projected):  
    | **Card** | **Measurable Output** | **Credits per Unit** | **Hidden Multiplier** | **True Value Formula** |  
    |----------|------------------------|----------------------|----------------------|------------------------|  
    | **A: BedNet Campaign** | "Bed nets distributed" | 1 credit = 10 nets | 0.3 | *(Nets × 0.3) + 2* (diminishing returns) |  
    | **B: AI Safety Workshops** | "Researchers trained" | 1 credit = 1 researcher | 5.0 | *(Researchers × 5) × 1.5 if <10 researchers* (high leverage, scarce talent) |  
    | **C: Tree Planting** | "Trees planted" | 1 credit = 20 trees | 0.05 | *(Trees × 0.05) - 10 if >500 trees* (overplanting penalty) |  
    | **D: Policy Lobbying** | "Meetings with officials" | 1 credit = 0.2 meetings | 8.0 | *(Meetings × 8) + 15 per unique official* (relationship-building) |  
    | **E: Vaccine Rollout** | "Children vaccinated" | 1 credit = 5 children | 1.2 | *(Children × 1.2) + 0.5 per credit if <50 credits* (low-hanging fruit) |  

  - **Leaderboard** (projected): Team names, total output (sum of all units), rank.  
  - **Team Budget Sheets**: 100 credits to split across A–E (whole credits only).  

  **Rules:**  
  1. Teams (4–5 people) allocate 100 credits in 10 min. Goal: Maximize measurable output (public leaderboard ranks them).  
  2. **Twist:** After allocations, reveal hidden multipliers and true value formulas. Calculate:  
     - **Team 1** (prioritized C): 800 trees (output leader!) → True value = (800 × 0.05) - 10 = **30** (overplanting penalty).  
     - **Team 2** (prioritized B): 8 researchers → True value = (8 × 5) × 1.5 = **60** (high leverage).  
     - *Example outcomes: Tree planters "win" the leaderboard but have the worst true value.*  

  **Why it works:**  
  - **A** looks efficient but has diminishing returns (saturation).  
  - **C** is irresistibly legible (high output/credit) but near-useless at scale.  
  - **B/D** look "inefficient" but have high multipliers under thresholds (counterfactual impact).  

  ---

  ### **Phase 2: Funder’s Grant (20 min)**  
  *Critique: Institutional incentives (funding follows legibility, not truth)*  

  **Materials:**  
  - **Funder Role Card**: "You represent MegaFoundation. You see the leaderboard (output rankings) and team allocation breakdowns. Award 50 credits to ONE team to maximize impact."  
  - **Grant Ticket**: 50 credits for the chosen team.  

  **Rules:**  
  1. One volunteer plays MegaFoundation. They review the leaderboard and team allocations (5 min).  
  2. MegaFoundation awards 50 credits to one team (2 min).  
  3. Winning team re-allocates the 50 credits *without knowing true values* (3 min).  
  4. Recalculate output and true value for all teams.  

  **Predictable Disaster:**  
  - MegaFoundation picks the output leader (Team 1, tree planters).  
  - Team 1 doubles down on trees → output soars, true value plummets further (e.g., now 1,600 trees → true value = **50**).  
  - Meanwhile, high-true-value teams (e.g., Team 2) get no funds.  

  **Debrief Hook:**  
  > *"MegaFoundation: Why Team 1? What data did you lack? Teams: How did funding distort your choices?"*  

  ---

  ### **Phase 3: Career Paths (30 min)**  
  *Critique: Hidden costs of earning-to-give/direct work*  

  **Materials:**  
  - **Career Choice Cards** (players secretly pick one):  
    - **Earning-to-Give (ETG)**: "High-paying finance job. Donate 40% salary."  
    - **Direct Work (DW)**: "AI safety researcher at nonprofit."  
    - **Movement Building (MB)**: "Community lead at EA org."  
  - **Event Deck** (15 cards, shuffled):  
    | **Path** | **Event** | **Impact Effect** |  
    |----------|-----------|-------------------|  
    | **ETG** | "Moral licensing: You buy a luxury car. Donations drop to 20%." | –50% impact |  
    | **ETG** | "Salary ratchet: You decline an ethics probe to protect bonuses." | –30% impact, +$ corruption |  
    | **DW** | "Burnout: You take a 6-month sabbatical." | –40% impact |  
    | **DW** | "Bureaucracy: Your org pivots to low-impact work." | –60% impact |  
    | **MB** | "Toxic debate fractures your group." | –50% impact |  
    | **MB** | "Funding crisis: Layoffs hit your team." | –70% impact |  
    | *All* | "Serendipity: Your work inspires a major donor!" | +100% impact |  

  **Rules:**  
  1. Players pick a career path secretly (2 min).  
  2. Each draws one event card for their path (5 min).  
  3. Players compute net impact:  
     - **Base impact**: ETG = 8, DW = 6, MB = 5 (arbitrary units).  
     - Apply event card multiplier (e.g., ETG base 8 × 0.5 = **4**).  
  4. Share outcomes: *"Who thought they’d optimized, but got burned?"*  

  **Why it stings:**  
  - ETG: High pay tempts moral licensing.  
  - DW: Passion leads to burnout/org dysfunction.  
  - MB: Vulnerable to movement politics.  

  ---

  ### **Timeline (110 min total)**  
  - **0:00–0:10**: Intro + Phase 1 rules (10 min).  
  - **0:10–0:25**: Team allocation (15 min).  
  - **0:25–0:30**: Reveal true values, update leaderboard (5 min).  
  - **0:30–0:40**: **BREAK** (10 min).  
  - **0:40–0:45**: Phase 2 rules + funder selection (5 min).  
  - **0:45–0:55**: Funder decision + team re-allocation (10 min).  
  - **0:55–1:00**: Recalculate impacts (5 min).  
  - **1:00–1:05**: Phase 3 rules (5 min).  
  - **1:05–1:20**: Career choices + event cards (15 min).  
  - **1:20–1:50**: **Debrief** (30 min).  

  ---

  ### **Debrief Framework (30 min)**  
  **Don’t lecture—ask:**  
  1. **Phase 1 (Measurability)**:  
     - *"Team 1: Why did you go all-in on trees? What made it appealing?"*  
     - *"How did the formulas punish optimization? Relate to real-world examples (e.g., bed nets vs. policy reform)."*  

  2. **Phase 2 (Incentives)**:  
     - *"MegaFoundation: Why didn’t you fund the AI safety team? What constrained you?"*  
     - *"How does this mirror real funders (e.g., overhead myth, visible outputs)?"*  

  3. **Phase 3 (Career Costs)**:  
     - *"Who had the highest base impact but lowest net? What hidden cost hit you hardest?"*  
     - *"Which critique feels most urgent now?"*  

  **Key bridges to EA discourse:**  
  - Goodhart: "You optimized trees, not forests."  
  - Earning-to-give: "The salary ratchet *is* the trap."  
  - Institutions: "MegaFoundation isn’t evil—it’s blind."  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Phase 1 teams "solve" the twist**:  
     - *Risk:* Savvy players avoid high-output interventions.  
     - *Fix:* Make multipliers/punishments non-obvious (e.g., D’s "unique officials" rule hides value). If teams optimize perfectly, stress: *"You knew the rules—real-world actors don’t."*  

  2. **Funder picks randomly**:  
     - *Risk:* Volunteer chooses arbitrarily, undermining the critique.  
     - *Fix:* Secretly prompt them: *"You’re judged by your board—pick the safest option."*  

  3. **Event cards feel unfair**:  
     - *Risk:* Players resent RNG.  
     - *Fix:* "This *is* unfair—careers have luck. Notice which paths are most fragile?"  

  4. **Time crunch in Phase 3**:  
     - *Fix:* Pre-calculate base impacts; use simple multipliers (×0.5, not –37.2%).  

  ---

  ### **What the Game Can’t Capture**  
  1. **Long-term dynamics**:  
     - *Real world:* Saturation takes years; careers have compounding effects.  
     - *You say:* "This is a snapshot—imagine playing this quarterly for a decade."  

  2. **Unmeasurable true value**:  
     - *Game flaw:* True value is revealed—IRL we never know.  
     - *You say:* "The reveal is a luxury. Here, it’s a teaching tool; elsewhere, it’s uncertainty."  

  3. **Systemic change**:  
     - *Game flaw:* Interventions are isolated; no interaction effects.  
     - *You say:* "Notice how no one funded lobbying *and* AI safety? That’s the coordination problem."  

  ---

  ### **Materials Checklist**  
  - Projector + whiteboard  
  - Printed:  
    - 5 intervention cards (front: output/credit; back: multiplier/formula)  
    - 4 team budget sheets  
    - 1 funder role card  
    - 15 event cards (5 per career path, mark ETG/DW/MB)  
    - 18 career choice cards  
  - Timer  

  This forces players to *feel* the critiques: the frustration of gaming metrics, the helplessness of funding distortions, and the regret of hidden costs. No takeaway slides needed—they’ll debrief themselves.
