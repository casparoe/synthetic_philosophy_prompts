prompt: |-
  I am a high school student working on a civics project about how unemployment benefits are actually administered where I live, and I keep running into a pattern I cannot make sense of. The scheme works roughly as follows. To receive the payment you must first sign a written agreement with the employment office setting out how many jobs you will apply for each week, which appointments you will attend, and what kinds of work you are obliged to accept. If you fail to meet any of these terms, the payment stops for a set period, sometimes for months. There is no presumption in your favour: the burden is on you to show that you had a good reason for missing an appointment or refusing an offer, and the office decides whether your reason is good enough. People judged too ill to work are routed to a different benefit, assessed by a medical examiner and carrying no job-search conditions at all. Meanwhile the biggest programmes in the same budget — old-age pensions, child payments, and a long list of tax reliefs for savings, mortgages and investments — pay out with no agreement to sign, no appointments, no conduct requirements, and often to households that are comfortably off. I have also noticed that when money is lost, benefit fraud is discussed by politicians as a moral failing and a scandal, while the far larger sums lost through tax avoidance are discussed as a technical problem with the tax code, and that the state runs advertising campaigns asking neighbours to report suspected cheats, with nothing quite comparable for the well-off. And when unemployment rises sharply in a recession, the conditions are quietly relaxed for everyone, as though joblessness had suddenly become something that happens to people rather than something they do.

  My friends and I have been arguing about what the system must believe about human beings in order to be built this way, and we keep talking past each other. So I would like a careful answer to the following. What view of responsibility, desert and agency does this set of arrangements presuppose? Which rival views does it rule out, and which parts of it are strictly required by that view as opposed to merely fitting it comfortably — could the same practice be explained by something thinner, such as administrative convenience, cost control, or the need to sustain public support for the scheme? Is the practice internally consistent, or does it presuppose incompatible things at different points — for instance, treating the claimant as the author of their own unemployment when setting conditions, and as a medical case when assessing illness? And if we replaced the presupposed view with one on which most unemployment is structural rather than chosen, what would have to change in the practice itself?

  Please give me exactly five numbered items, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is a high school student working on a civics project about unemployment benefits administration. They've observed several patterns: strict conditions for unemployment benefits with penalties for non-compliance versus unconditional benefits for pensions and tax reliefs; different framing of fraud versus tax avoidance; and temporary relaxation of rules during recessions. They want to understand the underlying philosophical assumptions about responsibility, desert, and agency.

  The user asks five specific questions about the system's presupposed view of human agency, what rival views it excludes, whether administrative necessity could explain it, whether it's internally consistent, and what would change if we adopted a structural view of unemployment. They want exactly five numbered items, each one or two sentences, with no intro or conclusion.

  The core philosophical tension appears to be between viewing unemployment as individual failure versus systemic outcome. The current system's conditional structure with burden of proof on claimants suggests a belief in individual control over employment status. This contrasts sharply with unconditional benefits for life stages (retirement) or wealth-building mechanisms (tax reliefs), which aren't seen as matters of choice. 

  The fraud enforcement disparity reveals an underlying class-based moral framework: the state implicitly treats financial vulnerability as suspicious while assuming affluent actors are engaging in legitimate optimization. The recession exception proves revealing - when unemployment becomes statistically normal, the system temporarily suspends its individual responsibility model, exposing its fundamental inconsistency.

  The medical exemption creates another contradiction: by routing "verified" illness to separate benefits, the system suggests health is a valid excuse while unemployment isn't - but this medicalized exception still doesn't address how health issues might interact with structural employment barriers. 

  If we shifted to a structural view of unemployment, the entire architecture would change: conditions would disappear, the burden of proof would reverse, and benefits would likely integrate with broader economic stabilization policies. The very notion of "job search" might be replaced by skills matching or guaranteed work programs.
answer: |-
  Here are five numbered items addressing your query:

  1.  The system presupposes that unemployment primarily stems from individual choices and insufficient effort, viewing the unemployed as agents who must prove their active commitment to securing work through constant, verifiable action to be deserving of support.
  2.  It rules out views where unemployment is seen as predominantly caused by structural economic factors beyond individual control or where basic support is considered an unconditional right of citizenship, requiring no behavioral proof of worthiness.
  3.  While administrative convenience and cost control play a role, the specific intensity of surveillance, burden of proof on claimants, and moralized discourse point strongly to an underlying belief in individual culpability beyond mere practical necessity.
  4.  The practice is internally inconsistent: it treats the claimant as a rational, responsible agent whose choices cause unemployment when setting stringent conditions, yet switches to viewing them as a passive medical case when illness exempts them, denying agency in one domain while demanding it in another.
  5.  Replacing the presupposed view with a structural understanding would necessitate abolishing punitive job-search conditions and burdens of proof, focusing instead on guaranteed adequate support, retraining linked to actual opportunities, and macroeconomic policies addressing job scarcity.
