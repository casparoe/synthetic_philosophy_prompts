prompt: |-
  I run a small reading group that meets in the back room of a pub — nine of us, no two from the same trade: a litigator, a paediatric nurse, a machinist, a software tester, a retired surveyor, three graduate students from assorted departments, and me, a lapsed philosopher who now does data work for a health authority. We never set reading in advance, because half the group will not do it; the format is one idea per session, seventy-five minutes, a whiteboard, and the leader has to get the idea across with no text in front of anybody. Next month is my turn, and the idea I have picked is the one usually called the intuition pump: a thought experiment understood not as an argument with suppressed premises but as a device for producing a verdict, whose force is carried by details it never defends, so that moving a detail the reader does not notice moving can reverse the verdict while the case still feels like the same case. I have been calling the detail a case invites you to grab its handle and the detail that actually does the work its pivot, and I would like the session to end with the group able to find the pivot in a case they met five minutes earlier.

  What I want from you is not the explanation — I can explain it — but the plan for delivering it to this particular room. Tell me the order in which the pieces have to go so that each one lands as a consequence of the last rather than as another item on a list, and say what has to be in place before the question of whether a pump can mislead even makes sense to them. Then tell me which single case should carry the session: the one we return to four or five times, each return showing us something the previous look missed, and what that case must have and must lack. I take it that it must produce a strong near-unanimous verdict on first hearing, that its pivot must be dial-able in at least three directions, and that it must not be a case whose ethics is the interesting part, or the group will spend the hour litigating the ethics instead of watching the pump. I have drafted two candidates and I want your judgement on them rather than a third option chosen to spare my feelings. The first is a hospital case: a junior doctor covering a ward at night is called to one patient, and while she is with that patient another patient, whom she has never met, deteriorates and is found dead at the morning round; the pivot is the size of the ward, which is stated as scenery in the first clause and does all the work, and it can be dialled further by changing how long she has known the dead patient and how close the discovery falls to the end of her shift. The second is an identification case: a witness picks a man out of a line-up, and the pivot is everything the description omits about how the line-up was built — whether she was told the culprit might not be present, how many fillers there were, how long she was given to look. Tell me which of these carries better and why, or whether neither does, and if you propose a replacement, say what it has that mine lack.

  I also want the misconception map, since this is the part I expect to get wrong. My guesses, to be corrected if they are wrong or badly ordered: first, that a thought experiment is an argument with some premises left out, so that it can be defeated by denying a stipulation; second, that the verdict is a fact about the case rather than a fact about the reader; third, the overcorrection, that because a verdict can be flipped by an unnoticed detail, intuitions are worthless and the whole exercise is rigged — I expect the litigator to make this move in the first ten minutes, and I need to know whether to let it run. For each misconception, say exactly where in the sequence it has to be defused and what the defusing move is. Finally, give me one question or task to close on that would show whether the idea has landed rather than whether they enjoyed themselves — something they can visibly fail — and tell me what I should openly refuse to cover in seventy-five minutes with this room, so that I can say so out loud at the start rather than be dragged into it at minute fifty.
reasoning: |-
  Okay, let me unpack this user's request. They're leading a pub-based reading group with diverse professionals and need to teach "intuition pumps" effectively in 75 minutes. The core challenge is structural: how to sequence concepts so each builds naturally on the last, using a single case study that avoids ethical debates and demonstrates pivot manipulation. 

  First, I consider their two proposed cases. The hospital scenario risks triggering medical ethics debates (especially with a pediatric nurse present), and the size-of-ward pivot feels too concrete for showing how unnoticed details manipulate intuition. The lineup case is stronger—its pivot (procedural omissions) is inherently covert, and legal professionals might engage productively with its constructed nature. But both cases lack the needed "dialability" for multiple verdict reversals.

  I recall philosophical cases that better fit: Searle's Chinese Room highlights linguistic assumptions, Jackson's Mary challenges physicalism through color perception. But the user explicitly wants to avoid famous examples. So I lean toward refining their lineup case into a "witness confidence" variant where the pivot (viewing duration) can be adjusted from 2 seconds to 2 minutes, cleanly flipping verdicts about reliability.

  For misconceptions, the user anticipates three: (1) mistaking thought experiments for arguments with hidden premises, (2) externalizing the verdict, and (3) dismissing intuitions as rigged. These need targeted defusals: For #1, contrast the lineup's verdict shift (pivot manipulation) with premise-denial during the initial case dissection. For #2, explicitly label the intuition as the participant's own cognitive response when first hearing the case. For #3, let the litigator's skepticism surface early but contain it by demonstrating how pumps reveal cognitive architecture—not truth claims.

  The session flow should cascade: Start with a quick verdict-driven case (lineup), dissect its pivot, then re-run with adjusted pivots to show verdict reversals. Only then name "intuition pump" as the observed mechanism. Avoid upfront definitions—they derail engagement. 

  Closing task: Present a new case (e.g., transplant dilemma) and have groups identify/test possible pivots. Success looks like them tweaking non-ethical details (e.g., victim relationships) to flip verdicts. 

  Explicitly rule out: ethical debates, neuroscience of intuition, or cataloging famous pumps. State this upfront to save time. 

  Key insight: The pivot must feel like scenery, not a variable. The lineup's "viewing time" achieves this better than hospital ward size.
answer: |-
  Here’s a battle-tested plan for your session, designed for your pub group’s constraints and focused on making the pivot concept visceral. The lineup case is stronger—**use it**—but I’ll refine it slightly. The hospital case’s ethical gravity (especially with a nurse in the room) will hijack discussion.

  ---

  ### **Session Structure: Order of Operations**
  **Goal:** Each step *forces* the next question naturally.  
  **Time:** 75 mins (strictly enforce—use a timer).

  1.  **Hook: The Raw Verdict (5 mins)**  
      Present the **lineup case stripped bare**:  
      *"A witness sees a crime. Police later show her a lineup of six men. She points to one and says, ‘That’s him.’ Is her identification reliable?"*  
      ➔ **Group Vote:** Yes/No/Unsure. *Record results (likely strong "Yes").*  
      *Why this first?* It generates the intuitive verdict *before* analysis. The pivot is hidden.

  2.  **Dissect the First Layer: "What Changed?" (15 mins)**  
      Reveal *one* pivot variation:  
      *"Same case, but now: She only saw the lineup for 2 seconds. Reliable?"*  
      ➔ **Group Vote again (shift likely toward "No").**  
      *Facilitator Qs:* "What changed? Why did your verdict flip? Was this new detail *part of the argument* or *scenery you assumed*?"  
      *Key:* Highlight how "viewing time" felt like background context, not a critical premise. This exposes the pivot *as a mechanism*, not an argument.

  3.  **Name the Beast & Map the Pump (10 mins)**  
      **Define terms NOW** (after they’ve *felt* the flip):  
      * **Handle:** The detail you focus on (e.g., "she picked someone").  
      * **Pivot:** The hidden detail that *actually* controls the verdict (e.g., viewing time, lineup instructions, filler similarity).  
      * **Intuition Pump:** A device using vivid details to trigger a verdict *by manipulating pivots hidden in the scenery*.  
      *Show the pump:* Sketch the lineup case on the whiteboard. Circle the "handle" (witness picks culprit). Box the "pivot" (2 sec viewing). Draw arrows: pivot → verdict.

  4.  **Dial the Pivot: Making the Mechanism Visible (20 mins)**  
      Return to the lineup. Test pivot adjustments:  
      - Pivot 1: *"She was told the culprit might NOT be in the lineup. Reliable?"* (Verdict weakens)  
      - Pivot 2: *"The lineup had 3 near-identical twins of the suspect. Reliable?"* (Verdict weakens)  
      - Pivot 3: *"She studied the lineup for 10 minutes under good light. Reliable?"* (Verdict strengthens)  
      ➔ **After each, ask:** "Is this still the *same type* of case? Did the *core story* change?"  
      *Crucial:* Emphasize that the *ethics of lineups* is off-topic. Focus on how the pivot dial controls the verdict.

  5.  **Defuse Misconceptions (Embedded in Steps 2-4)**  
      *Misconception 1 (Thought Expt = Argument w/ Hidden Premises):*  
      - **Defused in Step 2:** When the verdict flips on viewing time, ask: "Did I *argue* short viewing makes IDs unreliable? Or did your intuition *just flip* when I changed that detail?"  
      - **Key Contrast:** Arguments can be challenged by denying premises. Pumps work by *triggering unreflective intuitions* via implicit scenery.  
        
      *Misconception 2 (Verdict = Fact About the Case):*  
      - **Defused in Step 1 & 4:** After initial vote, ask: "Is your 'yes' a fact *about the witness*, or *your feeling* about her reliability?" Revisit after pivots: "Did the *witness* change, or *your intuition*?"  
      - **Label it:** "The verdict is your intuitive response *to* the case, not a property *of* it."  
        
      *Misconception 3 (Intuitions are Worthless / Rigged):*  
      - **Let the litigator voice this early (likely in Step 2 or 4). DON’T shut it down.**  
      - **Defuse in Step 6:** "It’s not that intuitions are *wrong*; it’s that pumps *isolate and manipulate* them. Like a microscope can distort if misused, but reveals cells. The flaw is in trusting the pump *uncritically*."

  6.  **The Payoff: Spot the Pivot (20 mins)**  
      Introduce a **NEW case** (max 3 sentences):  
      *"A patient needs a life-saving drug. Pharmacist charges 10x cost. Husband breaks in to steal it. Did he do wrong?"* (Verdict: Likely "No" – classic dilemma).  
      ➔ **Task:** "In pairs, identify: 1) The *handle*, 2) One possible *pivot*, 3) How to *dial it* to flip the verdict."  
      *Listen for:* Handles ("stealing for wife"). Pivots ("Is the drug uniquely available?", "Is the price gouging legal?", "Could he afford it with debt?").  
      *Success looks like:* Groups tweaking *non-ethical* pivots (e.g., "Pharmacist is a single parent saving for *their* child's surgery") to flip verdicts.  
      **Close:** "Today’s pump exposed *your* intuitions. The pivot was its control knob."

  ---

  ### **Why the Lineup Case Wins**
  1.  **Low Ethical Gravity:** Unlike medical harm, lineup procedures feel "technical." The nurse/litigator won’t derail it with professional trauma.  
  2.  **Pivot Invisibility:** Details like "viewing time" or "lineup instructions" are easily buried as scenery. Ward size feels salient.  
  3.  **Effortless Dialing:** 3+ pivots (viewing time, filler quality, instructions, lighting) are intuitive and non-overlapping.  
  4.  **Strong Verdict Flip:** "She pointed = reliable" → "2 seconds = unreliable" is visceral and near-unanimous.  
  5.  **Replicability:** Groups can generate *new* pivots easily (e.g., "Was she stressed?" vs. hospital pivots devolving into clinical protocols).

  ---

  ### **What to Explicitly Refuse (State Upfront)**  
  *"Three things we won’t cover today: 1) The ethics of *real* police lineups or hospital negligence, 2) Neuroscience of intuition, 3) Cataloging famous thought experiments. We’re reverse-engineering one mechanism today—how unnoticed details control your gut response."*

  ---

  ### **If You Must Use Your Hospital Case**  
  **Reframe it radically:**  
  *"A doctor on night shift checks Patient A. While occupied, Patient B (unknown to her) dies. Should she be disciplined?"*  
  **Pivots:**  
  - Dial 1: *Ward size = 4 patients* (Verdict: Likely no)  
  - Dial 2: *Ward size = 40 patients, she’s alone* (Verdict shifts toward yes)  
  - Dial 3: *Patient B was her own patient, admitted by her 1 hour ago* (Verdict: Strong yes)  
  **Risks:** The nurse *will* debate staffing norms. The litigator *will* argue liability standards. Only use if you’re prepared to ruthlessly enforce: "This is a *pump*, not a malpractice case."

  ---

  ### **Final Tip**  
  **Bring a physical dial or slider** for the whiteboard. Label one end "Reliable/Innocent" and the other "Unreliable/Guilty." Physically move it as pivots change. This makes the abstraction tactile for the machinist, surveyor, and data philosopher alike. The pivot isn’t just a concept—it’s a *control*.
