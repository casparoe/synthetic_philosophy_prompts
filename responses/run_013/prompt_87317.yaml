prompt: |-
  I am convening the next meeting of a departmental reading group — seven or eight PhD students in philosophy, none of whom has taken a course in game theory, though two have picked up a little from economics — and the subject is common knowledge of rationality: why epistemic game theory treats it as the condition that licenses the standard solution concepts, and why it is a considerably stronger requirement than it first appears. Do not explain common knowledge to me. I want a plan for teaching it.

  The meeting runs ninety minutes and I have a whiteboard. Tell me the order in which the components must be introduced, and why that order rather than another — what has to be in place before the phrase "common knowledge" can do any explanatory work, and what each later piece depends on. Tell me which single example should carry the session. I am tempted by the familiar puzzle in which everyone can see everyone else's mark but not their own, a public announcement appears to add nothing to what each of them already knew, and yet on the appointed night everyone who bears the mark acts at once; but I suspect at least two of the students have met it and will nod along without seeing the point. Advise me whether it should carry the session regardless, and if not, what should replace it, specifying what the replacement must have and what it must lack.

  Then the part I care most about. I want the session to end by dislodging the comfortable thought that common knowledge is simply mutual knowledge taken far enough — that if everyone knows, and everyone knows that everyone knows, and so on for sufficiently many rounds, one has effectively arrived at the real thing. Here is the construction I intend to use, and I need you to tell me whether it works as stated or whether I must specify the payoffs and the knowledge structure more carefully first. Two agents would each gain if each took a particular risky action, but the action pays off only when you are certain the other will take it as well. Each is rational, each knows the other is rational, each knows that the other knows, and so on, but the chain of higher-order knowledge is only finitely deep — and the claim is that coordination can nonetheless fail, not because anyone is irrational, but because the last link in the chain is never itself known to be in place, so each can reason that had the chain stopped one step earlier the other would have played safe. Plan how to build this so that it lands as genuinely surprising rather than as a conjuring trick, and say plainly if the construction needs repair.

  Which misconceptions the students will bring with them and which they will form on the spot — I am expecting "common knowledge just means everyone knows," "more rounds of mutual knowledge approach it," and "common knowledge is psychologically impossible, so the whole framework is a fiction" — and at exactly which point in the sequence I should head off each one. What I should deliberately leave out at this level, and say that I am leaving it out. And a single closing question I can put to them that would reveal whether the distinction has landed, rather than whether they can recite the definition.
reasoning: |-
  We are designing a 90-minute session for a philosophy reading group on common knowledge of rationality in epistemic game theory. The audience consists of PhD students in philosophy without formal game theory training, though two have some economics background.

  The session must:
  1. Introduce components in a logical order so that common knowledge (CK) is built upon necessary foundations.
  2. Use a central example that is both illustrative and not too familiar to the group (avoiding the overused "muddy children" puzzle if it is known to some).
  3. End with a demonstration that common knowledge is not just mutual knowledge to a finite depth, using a coordination game example.
  4. Address misconceptions and explicitly leave out some topics for clarity.

  Plan:

  I. Introduction (10 minutes)
     A. Set the stage: Game theory studies strategic interactions. Rationality means each player chooses the action that maximizes their payoff given their beliefs.
     B. The problem: How does what players know about each other (especially rationality) affect the outcome? 
     C. Introduce the idea of mutual knowledge: 
          - Level 1: Everyone knows that everyone is rational.
          - Level 2: Everyone knows that everyone knows that everyone is rational.
          - But what if we go infinitely? That's common knowledge.

  But note: We are not explaining CK yet. We are setting the stage for why we need it.

  II. The Need for Common Knowledge: An Example (20 minutes)
     A. We need an example to show that mutual knowledge to any finite depth is not enough. We avoid the muddy children puzzle because two students may know it. Instead, we use a different example: **The Coordinated Attack Problem** (also known as the Electronic Mail Game or a similar coordination problem).

     Why Coordinated Attack?
       - It is a classic example in computer science and game theory that illustrates the difference between common knowledge and mutual knowledge to arbitrary finite depth.
       - It has a simple setup: Two generals must coordinate to attack at dawn. They can only communicate via messengers who might get captured. Even after exchanging many messages, they never achieve common knowledge that the attack is on, and hence they never attack.

     B. Setup:
          - Two generals on two hills, separated by an enemy valley.
          - They must both attack at dawn to succeed. If one attacks alone, it fails.
          - They can send messengers, but each messenger has a chance of being captured (so the message is lost).
          - General A decides to attack and sends a messenger to General B saying "Attack at dawn". 
          - If the messenger arrives, General B sends an acknowledgment. But the acknowledgment might get lost. Then A sends a confirmation of the acknowledgment, and so on.

     C. The problem: 
          - After any finite number of messages, there is a positive probability that the last message was lost, so the other general might not have gotten it. 
          - Hence, at every level, they have mutual knowledge to depth n (for the current n) that they are both attacking, but they never achieve common knowledge (because common knowledge would require that they both know, and they both know they both know, and so on to infinity, which is impossible with any finite exchange).

     D. The lesson: Even with mutual knowledge to an arbitrarily high finite degree, they cannot be sure enough to attack. Common knowledge is unattainable in this scenario, and without it, coordination fails.

     E. Why this example instead of muddy children?
          - It directly shows the failure of coordination under finite mutual knowledge, which sets up the later part of the session.
          - It is less likely to be known by philosophy students than the muddy children puzzle.

  III. Common Knowledge of Rationality and Solution Concepts (20 minutes)
     A. Now we can define common knowledge: 
          - A fact is common knowledge if everyone knows it, everyone knows that everyone knows it, and so on ad infinitum.
          - We are not explaining the definition from scratch, but building on the Coordinated Attack example.

     B. Link to game theory: 
          - In games, we often assume that the structure of the game and the rationality of the players are common knowledge. This is called common knowledge of rationality (CKR).
          - Solution concepts (like Nash equilibrium) are justified by CKR. For example, in the Iterated Elimination of Strictly Dominated Strategies (IESDS), CKR allows us to keep eliminating strategies round after round.

     C. Example: IESDS in a matrix game (use a simple 2x2 game, e.g., Prisoner's Dilemma or a dominance-solvable game).
          - Without CKR: If players only know that they are rational, then only one round of elimination occurs.
          - With CKR: They can do multiple rounds.

     D. But note: The standard solution concepts (like Nash) require CKR, not just mutual knowledge to a finite depth. Why? Because the reasoning chains can be arbitrarily long.

  IV. The Coordination Failure Example (30 minutes)
     A. Now we present the example to dislodge the idea that mutual knowledge to a high finite depth is effectively common knowledge.

     B. The construction: 
          - Two players, A and B.
          - Each player has two actions: Safe (S) and Risky (R).
          - Payoffs:
              - If both play S: both get 1.
              - If both play R: both get 2 (the good outcome).
              - If one plays R and the other S: the one who plays R gets 0 and the one who plays S gets 1.

          This is a coordination game with two pure Nash equilibria: (S,S) and (R,R). But (R,R) is better.

     C. The problem: 
          - To achieve (R,R), each must be certain that the other will play R. 
          - But if there is any doubt, then playing S is safe (because you get 1 regardless).

     D. The knowledge structure:
          - Assume that it is mutual knowledge to depth n that both are rational and that both would like to coordinate on R. But it is not common knowledge (because the chain stops at n).

     E. The argument by backward induction:
          - Suppose n=1: 
              - Level 1: Each knows the other is rational. 
              - But without Level 2: A might think that B doesn't know that A is rational. Then B might not play R because B might think A is not rational and won't play R. So A plays S. Similarly for B. So they play (S,S).
          - Now for n=2:
              - Level 2: Each knows that the other knows that both are rational.
              - But without Level 3: A thinks that B might not have Level 2 knowledge. So B might be at Level 1, and at Level 1 we saw that they play S. So A plays S. Similarly for B.
          - This continues: At any finite level n, they both play S.

     F. Why is this surprising?
          - Even though they have mutual knowledge to a very high depth (say, n=100), they still end up at (S,S). 
          - Only with common knowledge (infinite depth) would they play (R,R).

     G. Repair? 
          - The construction as stated is standard and appears in the literature (e.g., Rubinstein's Electronic Mail Game, but note that in the Electronic Mail Game, the payoffs are asymmetric and there is a small cost to the risky action). 
          - However, to make it a pure coordination game without additional complications, we can use the above symmetric payoff matrix. The key is that the risky action is only good if the other also takes it.

          Important: We must assume that the players know the entire finite depth n of mutual knowledge. But note: in the common knowledge case, there is no such n. The problem is that at depth n, each player knows that the mutual knowledge goes to depth n-1 for the other, but that's not enough.

          This example is robust. The payoffs and knowledge structure are clear.

     H. How to build it:
          - Start by presenting the game and the desirable (R,R) outcome.
          - Ask: What would happen if they just knew that both are rational? (Level 1) -> They play safe.
          - Then: What if they know Level 2? -> Still safe.
          - Then: What if they know up to Level 100? -> Still safe.
          - Then: Only with common knowledge (infinite) do they play risky.

          This is counterintuitive because we might think that a high finite level is enough.

  V. Addressing Misconceptions (throughout, but especially at these points):
     A. "Common knowledge just means everyone knows" (Level 1).
          - Head off at the beginning (after introducing mutual knowledge). After defining Level 1, Level 2, etc., say: "But common knowledge is more: it requires the infinite hierarchy."

     B. "More rounds of mutual knowledge approach it."
          - This is the main point of the coordination failure example. After presenting that example, emphasize: "Even with a million levels, they still don't coordinate. So it's not just about having a lot of levels."

     C. "Common knowledge is psychologically impossible, so the whole framework is a fiction."
          - This is a deeper philosophical concern. Address it at the end. 
          - Point out: The framework is an idealization. Just as we use infinity in mathematics, we use it here to define a concept that helps explain why coordination is hard in the real world. Also, note that in some situations (like public events) common knowledge can be approximated.

          But we are not claiming it is always present. We are saying that when it is present, it licenses solution concepts that require infinite reasoning.

  VI. What to Leave Out:
     A. We are leaving out the formal model of knowledge (Kripke structures) because of time and background.
     B. We are not going into the details of how common knowledge is generated (e.g., by public announcements) beyond the Coordinated Attack example.
     C. We are not covering other solution concepts beyond IESDS and the coordination example.

  VII. Closing Question (to reveal if the distinction landed):
     "In the coordination game we just saw, suppose that both players are rational and that they have mutual knowledge of rationality to depth 100. Why do they still play safe? And what would it take for them to play risky?"

     The desired answer: 
          - They play safe because at depth 100, each player knows that the other has mutual knowledge only to depth 99. At depth 99, the other would play safe (because at depth 99, they know the other only has depth 98, and so on). So even at 100, they cannot be sure. 
          - To play risky, they need common knowledge (infinite depth).

  Timing Breakdown:
  - Introduction: 10 min
  - Coordinated Attack example: 20 min
  - Common Knowledge and Solution Concepts: 20 min
  - Coordination Failure Example: 30 min
  - Wrap-up and closing question: 10 min

  This plan builds step by step, starting with the motivation (why we need more than just mutual knowledge) via Coordinated Attack, then defines CK and links it to solution concepts, and finally uses the coordination game to show the infinite depth requirement. The central example for the session is the Coordinated Attack (for the first part) and the symmetric coordination game (for the main point). We avoid the muddy children puzzle because of familiarity concerns.

  The coordination failure example is presented in a way that starts with a simple case (n=1) and builds up to n=100, showing the pattern. This should make it clear that no finite n suffices, and it should land as surprising because we usually think that high finite n is practically enough.

  Note: The symmetric coordination game we described is sometimes called the "stag hunt" but note that in the standard stag hunt, there is a risk-dominant equilibrium (which is safe) and a payoff-dominant one (risky). Our payoff matrix is a stag hunt. However, the argument we use is standard.

  Let me know if you need the payoff matrix drawn or any further clarification.
answer: |-
  ### Teaching Plan for the Session on Common Knowledge of Rationality

  #### **Order of Components and Why**
  1. **Rationality and Mutual Knowledge (15 mins)**  
     - **Start with individual rationality**: Define a rational agent as one who maximizes expected utility given their beliefs. Use a simple matrix (e.g., Prisoner's Dilemma) to show how rationality leads to dominant strategies.  
     - **Introduce mutual knowledge**:  
       - Level 1: "All players are rational" (each knows others are rational).  
       - Level 2: "All know that all know rationality" (each knows others know, etc.).  
     - **Why first?** Without grounding in mutual knowledge, "common knowledge" (CK) seems abstract. Students need to see how finite-order knowledge shapes reasoning (e.g., in Iterated Elimination of Dominated Strategies).  

  2. **Limits of Finite-Order Knowledge (20 mins)**  
     - **Use the Coordinated Attack Problem** (replace the "marks" puzzle):  
       - *Setup*: Two generals must attack at dawn to win. Messengers (who may fail) carry confirmations. After \(n\) successful messages, they have mutual knowledge to depth \(n\) of the plan.  
       - *Punchline*: Even with mutual knowledge to depth \(n\) (for any finite \(n\)), they never attack—because the \(n\)th messenger might have failed, leaving doubt about the other's knowledge.  
     - **Why this example?**  
       - *Fits requirements*: (a) Shows mutual knowledge ≠ CK, (b) Coordination fails despite deep mutual knowledge, (c) Unfamiliar to philosophy students (unlike the "marks" puzzle).  
       - *Avoids pitfalls*: Highlights how each round of messaging *seems* sufficient but isn’t. Students won’t "nod along" since it’s fresh.  
     - **Key insight**: Finite-depth knowledge cannot resolve uncertainty about others’ uncertainty.  

  3. **Common Knowledge Defined (10 mins)**  
     - **Define CK**: A fact is CK iff everyone knows it, everyone knows everyone knows it, ad infinitum.  
     - **Link to rationality**: CK of rationality (CKR) means all players know "all are rational" at all levels.  
     - **Why now?** Only after seeing *why* finite depth fails does CK’s infinitary nature become meaningful. CK resolves infinite regress ("I know you know I know...").  

  4. **CKR and Solution Concepts (15 mins)**  
     - **Connect to game theory**: CKR licenses Nash equilibrium or correlated equilibrium in games like Stag Hunt.  
       - *Example*: In Stag Hunt, CKR ensures players coordinate on the payoff-dominant equilibrium (stag) because doubt about others’ rationality is eliminated.  
     - **Why here?** Students now see CK as a *tool*: Without it, solution concepts lack epistemic foundations.  

  5. **Coordination Failure with Finite Knowledge (25 mins)**  
     - **Present your construction** (repair needed—see below):  
       - *Game*: Symmetric coordination game with actions **Safe** (S) and **Risky** (R). Payoffs:  
         - (S,S): (1,1)  
         - (R,R): (2,2)  
         - (S,R) or (R,S): (0,1) or (1,0)  
       - *Knowledge*: Mutual knowledge of rationality to depth \(n\) (finite), but not CK.  
       - *Claim*: Both play **S** despite mutual knowledge to depth \(n\).  
     - **Backward induction breakdown**:  
       - At depth 1: Each knows the other is rational. But if A thinks B might not know A is rational, A fears B will play S (to avoid 0). So A plays S.  
       - At depth \(n\): Each knows mutual knowledge stops at \(n\). Player A reasons: "If knowledge stopped at \(n-1\), B would play S. Since I can’t be sure B knows we have depth \(n\), I play S."  
     - **Repairs needed**:  
       - **Specify knowledge structure**: State clearly that players know the *exact depth* \(n\) of mutual knowledge.  
       - **Clarify payoffs**: Emphasize that R is only profitable if *certain* the other plays R. Doubt forces S.  
       - **Why it surprises**: With high \(n\) (e.g., 100), students assume it’s "close enough" to CK. The proof that **no** finite \(n\) suffices disrupts this.  
     - **Build intuition**:  
       - Start with \(n=0\) (no mutual knowledge): Both play S (obvious).  
       - Show \(n=1\): Both still play S (as above).  
       - Generalize to \(n=k\): Always S. Only CK enables R.  

  #### **Misconceptions and Interventions**  
  - **"CK just means everyone knows"**:  
    - *When*: During mutual knowledge intro (Step 1).  
    - *Intervene*: Contrast "all know P" (Level 1) with "all know all know P" (Level 2). Ask: "If Level 1 suffices, why can’t the generals attack after one message?"  

  - **"More rounds approach CK"**:  
    - *When*: After presenting the coordination failure (Step 5).  
    - *Intervene*: Stress that **finite mutual knowledge is fundamentally distinct from CK**—the limit of the sequence isn’t CK (it’s not even knowledge!). Use the generals: Even with 100 messages, attack fails.  

  - **"CK is impossible, so game theory is fictional"**:  
    - *When*: After defining CK (Step 3).  
    - *Intervene*: Acknowledge CK is idealized, but argue it’s *useful*: (a) It explains why public events (e.g., traffic lights) coordinate us, (b) It sets a benchmark for real-world approximations (e.g., repeated interactions).  

  #### **What to Leave Out**  
  - **Formal models** (Kripke structures, partitional knowledge). Say: *"We’re focusing on intuition, not the machinery of possible worlds."*  
  - **Non-epistemic solution concepts**. Say: *"We’re bracketing evolutionary or behavioral approaches to focus on epistemic foundations."*  
  - **Infinite regress as paradoxical**. Say: *"We’re treating ‘ad infinitum’ as a mathematical tool, not a psychological process."*  

  #### **Closing Question**  
  **"In the coordination game, if both players are rational and mutual knowledge of rationality holds to depth 100, why do they both play Safe? What changes if we add common knowledge?"**  
  - *Reveals understanding*: Correct answers identify the "gap" at depth \(n\) (doubt about depth \(n-1\)) and note CK closes all gaps.  
  - *Distractor*: If they say "100 isn’t enough, but 101 would work," the distinction hasn’t landed.  

  #### **Timeline**  
  - 0-15 mins: Rationality + Mutual Knowledge (Step 1).  
  - 15-35 mins: Coordinated Attack Problem (Step 2).  
  - 35-45 mins: CK Definition + CKR (Step 3).  
  - 45-60 mins: CKR and Solution Concepts (Step 4).  
  - 60-85 mins: Coordination Failure Construction (Step 5).  
  - 85-90 mins: Closing Question + Recap.  

  This sequence ensures each concept scaffolds the next, with the Coordinated Attack and coordination failure examples driving home the infinitary nature of CK. The closing question forces synthesis, exposing any residual conflation of mutual and common knowledge.
