  ### Kalai–Smorodinsky Solution (KS)
  The KS solution is defined by:
  1. **Pareto efficiency**: The solution must lie on the Pareto frontier of S.
  2. **Individual monotonicity**: If the feasible set expands in a way that is favorable to one player without harming the other, then that player should not get less. 
  3. **Scale invariance**: The solution is invariant under positive affine transformations of the utilities (so we can normalize utilities).
  4. **Symmetry**: If the problem is symmetric (same disagreement point and symmetric feasible set), then the solution gives equal utilities.

  The KS solution is found by:
  - Let the ideal point for team i be the maximum utility they can achieve in S given that the other team gets at least their disagreement utility.
  - The solution is the unique Pareto efficient point on the line segment connecting the disagreement point (d) to the ideal point (u1_max, u2_max).

