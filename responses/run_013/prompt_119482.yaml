  Given time, I recommend:

  - Phase 1: initial allocation (5 minutes)
  - Phase 2: deal evidence cards one by one. Each card is read, teams have 1 minute to update their worksheet (parameters) and recalculate EVs, then 1 minute to reallocate. (5 cards * 2 minutes = 10 minutes)
  - Introduce Project D. Explain the rules. Teams have 5 minutes to discuss and reallocate including D. (5 minutes)
