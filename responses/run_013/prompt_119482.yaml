  Now, what might go wrong:

  1. Teams might not understand the expected value calculations. -> Provide a worksheet with formulas and examples.

  2. Teams might not update the parameters as intended. -> Make the evidence cards very clear about how to update the worksheet. For example:

     Worksheet for Team: 
       Parameters (start):
          P(real) = 1.0
          P(continue|sim) = 1.0
