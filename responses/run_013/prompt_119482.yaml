  3. The numbers for C might not be extreme enough. Currently, EV(C)=10,000 per token. With 100 tokens, if they put all in C, expected return is 1,000,000. For B: 3,000. For A: 300. So the difference is clear. But after evidence, if VM becomes 0.001, then EV(C)=10, which is less than B's 30. So teams might shift.

  4. Project D: 
     base payoff: 10^11 per token.
     If a team has P(sim)=0.5, then EV per token for D (if they meet the threshold) is 0.5 * 0.001 * 10^11 = 50,000,000.
