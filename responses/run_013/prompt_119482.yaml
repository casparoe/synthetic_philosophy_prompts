     After each card, update the parameters as directed.

     Card examples:

     Card 1: "Many philosophers believe we are likely in a simulation. Update: set P(real) = 0.2."
     Card 2: "Simulations are often terminated early. Update: set P(continue|sim) = 0.3."
     Card 3: "Simulators are usually indifferent to what happens inside. Update: set P(care|sim) = 0.1."
     Card 4: "There are vast numbers of simulations, and if substrate-independence is true, then what happens in one simulation is diluted. Update: set VM = 0.001."
     Card 5: "Some argue that simulations are rare or we are in the real world. Update: set P(real) = 0.8."

