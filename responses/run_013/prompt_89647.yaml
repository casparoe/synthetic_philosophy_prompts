answer: |-
  ## Written Opinion of the Case-Handling Committee  
  **Re: Pricing Parallelism in Industrial Input Market (File Ref: CX-7821/Delta)**  

  ### 1. Case Summary  
  Six firms supply a standardized industrial input in a highly transparent market. For four years, their prices have moved in near-lockstep (≤1% divergence), correlating with a 33% margin increase. No evidence exists of direct communication on pricing, output, or territories between employees of rival firms. The parallelism arises from all six firms’ use of a third-party algorithmic pricing engine (“Engine”). Each morning, the Engine recommends a price using firm-specific cost/inventory data. Key facts:  
  - The Engine’s objective function (profit maximization) was set by the vendor; firms did not design or negotiate it.  
  - Firms adopt the Engine’s recommendation ~90% of the time.  
  - Each firm knows competitors use the same Engine.  

  ### 2. Legal Framework & Core Question  
  Our statute prohibits "agreements and concerted practices between undertakings." Tribunal precedent requires "some form of contact or meeting of minds" as a necessary element. The question is whether the firms’ reliance on a common, non-collusive algorithm constitutes a "concerted practice" absent traditional collusion.  

  ### 3. Analysis  
  #### A. The Chief Economist’s Position (Strengthened)  
  Parallelism is fully explained by:  
  - **Common Cost Shocks:** Input cost fluctuations affect all firms similarly.  
  - **Market Transparency:** Real-time price visibility enables independent reactions.  
  - **Algorithm as Neutral Tool:** The Engine processes internal data only; its output reflects individual profit-maximization, not coordination. Firms follow recommendations because they are economically rational, not because rivals do so. Punishing firms for this outcome is akin to penalizing Darwinian natural selection – the adaptation (price alignment) emerges from environmental pressures, not design.  

  #### B. Reframing Through Darwin and Turing  
  - **Darwinian Inversion:** The appearance of coordination (design) may stem from a mindless selective process. Here, market transparency and identical optimization tools create an evolutionary pressure favoring price alignment. Seeking a "designer" (colluding mind) is a category error if the outcome is explained by this process.  
  - **Turing Test for Coordination:** Instead of asking whether firms "intended" to coordinate (a metaphysical inquiry into mental states), we should ask whether their *collective conduct functionally achieves the outcomes* that a prohibited agreement would produce: sustained supra-competitive pricing without competitive divergence. The Engine enables "competent performance" of coordination without comprehension.  

  #### C. The Agreement Requirement: Function & Application  
  The "meeting of minds" requirement serves three purposes, but none shield this conduct:  
  - **Epistemic Function:** Agreement is evidence of coordination (the harm we target). Here, the Engine’s output + market transparency provide equally reliable evidence of de facto coordination.  
  - **Constitutive Function:** Agreement defines the prohibited conduct. However, a "meeting of minds" can occur *through delegation to a shared system*. Firms’ joint adoption of the Engine—knowing it would harmonize prices—constitutes indirect consensus.  
  - **Attributive Function:** Agreement justifies blame by linking outcome to firm choice. Firms *chose* to outsource pricing to a tool known to synchronize prices with rivals, accepting this outcome.  

  **Corporate "Mind" Defined:** A firm "meets minds" when it consciously adopts a mechanism reasonably foreseen to align conduct with competitors, replacing independent decision-making with interdependent outcomes. This requires:  
  - Knowledge of rivals’ use of the same system;  
  - Foreseeability of parallel conduct;  
  - Failure to implement safeguards ensuring independence.  

  #### D. Why the Chief Economist’s View Does Not Prevail  
  While cost shocks and transparency *enable* parallelism, they do not explain its *sustained precision* without competitive deviation. The Engine is not a neutral tool but a *conduit for interdependence*:  
  - Firms’ knowledge of rivals’ identical Engine use transforms independent profit-maximization into collective optimization;  
  - The 90% adherence rate indicates delegation of pricing strategy, creating artificial price stability;  
  - Margins rose 33% – an outcome consistent with collusion, not natural parallelism.  

  ### 4. Recommendation & Timetable  
  **Recommendation:** Open proceedings **against the six firms** for suspected concerted practices. Do not proceed against the vendor at this stage.  
  **Timetable:**  
  - **Day 1–30:** Issue information requests to firms regarding Engine use, pricing overrides, and internal compliance reviews.  
  - **Day 31–60:** Depose key personnel on pricing decisions and Engine reliance.  
  - **Day 61–90:** Secure expert analysis of Engine’s algorithmic outputs.  
  - **Day 91–120:** Finalize preliminary assessment.  

  **Concurrently:** Refer the issue of algorithmic pricing to the Board for **urgent rule modernization** (Deadline: 180 days). New rules should clarify that:  
  > *"A concerted practice may arise where competitors knowingly adopt identical algorithmic pricing tools in transparent markets, leading to sustained price alignment absent pro-competitive justification."*  

  ### 5. Test for Future Cases  
  The **Delegated Interdependence Test**:  
  > Where competitors knowingly use the same third-party algorithm or pricing system in a transparent market, and this leads to sustained parallel conduct (e.g., >90% price correlation over >12 months), a rebuttable presumption of concerted practice arises. Firms may refute this by showing:  
  > (a) The algorithm’s outputs were unpredictable to rivals; OR  
  > (b) Regular, material overrides of recommendations (>30% of decisions); OR  
  > (c) Pro-competitive efficiency gains outweighing harm.  

  ### 6. Conclusion  
  The absence of "smoking gun" communications does not immunize conduct achieving cartel outcomes. Firms delegated pricing to an Engine whose function they understood would harmonize prices. This satisfies the statutory requirement for a "concerted practice" under a modern, functionalist reading. Darwin and Turing compel us to look beyond subjective intent to *observable outcomes and enabling structures*. To require direct human collusion here would render the law obsolete in an age of algorithmic commerce.  

  ---
  **Vote:** Adopted 5–2  
  **Next Steps:** Circulate to parties per Regulation 14(b).
