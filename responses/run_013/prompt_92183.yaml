answer: |-
  Consider a species of colonial marine invertebrates where larvae settle near parents, forming groups of close relatives. A rare allele induces cannibalistic behavior in juveniles toward non-siblings, but only if maternally inherited due to genomic imprinting. Juveniles inheriting the allele paternally express a harmless phenotype. Within a group, maternally imprinted cannibals eliminate paternal carriers (non-siblings), increasing their own resource access and survival, thus spreading the allele (genic selection *for* the allele due to competitor elimination). However, cannibalistic individuals suffer a net survival cost due to energy expended and injury risk during attacks, making them less fit than non-cannibals *within any mixed group* (individual selection *against* the cannibal phenotype). Crucially, groups initially containing only maternally imprinted cannibals (achieved by low dispersal) show higher total offspring production per founding female because early cannibalism reduces density stress without the cost of attacking siblings, representing group selection *of* the group-level trait 'uniform cannibal genotype' *for* the benefit of increased group productivity. Changing dispersal rate alters predictions: increased dispersal mixes genotypes, weakening genic selection (fewer pure groups where cannibals safely eliminate non-siblings) but strengthening group selection (more groups form that are uniform and benefit from reduced competition). The maternal imprinting mechanism does the work; removing it allows cannibalism expression regardless of parental origin, eliminating the genic advantage (as cannibals would kill siblings carrying the allele) and collapsing the group structure enabling the benefit.

  A genic selectionist accounts for the allele's spread by its replicative advantage when maternally imprinted, exploiting the within-group relatedness asymmetry to eliminate non-carrier competitors despite individual costs. An individual-level selectionist accounts for the observed decline in cannibal phenotype frequency within mixed groups, emphasizing the direct survival cost outweighing any benefit to the cannibal individual. A multilevel selectionist partitions selection: strong within-group selection against the cannibal phenotype (due to individual cost) opposes weak between-group selection favoring groups fixed for the allele (due to enhanced productivity). Defenders of individual selection as paramount would attack the case by arguing the group benefit is unstable and incidental. They would contend that the mechanism (maternal imprinting enabling safe elimination of non-relatives) is an artifact of specific genetic control unlikely to evolve, as the individual cost should prevent the cannibal trait from arising in the first place without direct compensation to the individual actor, making the group-level advantage a non-causal by-product. They might also question the realism of achieving and maintaining groups uniform for the maternally imprinted state solely via low dispersal.
