  Hmm, this requires careful construction. I recall that asymmetric larval competition in social insects could work well. Imagine a maternally imprinted gene that causes cannibalistic behavior in larvae toward non-siblings. This immediately creates tension: genes spread by eliminating competitors, individuals suffer reduced survival, but groups might benefit from resource efficiency. 

