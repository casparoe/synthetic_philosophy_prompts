  Accounting time: Genic sees the selfish gene spreading; individual sees reduced fitness; multilevel sees opposing pressures. The key feature is maternal imprinting—remove it, and gene-individual conflict vanishes. Critics of group selection would attack the mechanism's plausibility, arguing uniform cannibalism couldn't evolve without individual cost compensation. 

