prompt: |-
  I am a PhD student in philosophy of biology working on the levels-of-selection problem, and I need a compact, original thought experiment for a chapter on why genic, individual, and multilevel accounting can disagree. Construct a case in which a trait is favored by selection at the level of the gene and at the level of the group but disfavored at the level of the individual organism, and in which the gene-level and group-level explanations are not merely redescriptions: they make different predictions about what happens when one ordinary life-cycle parameter, such as dispersal rate or within-group reproductive skew, is changed. The case should also make the distinction between selection of a group-level trait and selection for that trait because it benefits the group do real work. Constraints: realistic, non-human, no group extinction, no appeals to species benefit, and no stipulating the verdicts; the conflict must fall out of the biological details. Keep the scenario to one paragraph. Then do the accounting for a genic selectionist, an individual-level selectionist, and a multilevel selectionist, identify the single feature doing the work, say what happens if it is removed, and explain how a defender of the level that comes out worst would attack the case. Please answer in continuous prose, with no headings, bullet points, bold text, or tables.
