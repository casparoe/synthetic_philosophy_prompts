prompt: |-
  I trained as an economist and now spend most of my time in philosophy of science, and before a workshop I want to write down where I stand on how models should be assessed so that people can push on it. Here is the package. First, Friedman's F-twist, roughly as he states it: the realism of a theory's assumptions is irrelevant to its assessment, and the theory is to be judged by the accuracy of its predictions. Second, a stronger corollary I am attracted to: the more wildly unrealistic the assumptions, the more likely the theory is to have latched onto something important, so falsity in the assumptions is not something to apologise for. Third, a model earns its keep only if it isolates the causally relevant factors in the target system. Fourth, idealisation and approximation are different things, and only the former is licensed by the first two commitments: an assumption that distorts by exaggeration is acceptable, whereas one that is merely an inaccurate estimate of a real quantity is a defect. Fifth, a verdict I am attached to: the zero-transaction-cost assumption in some models is harmless, while the representative-agent assumption is not, even though both are plainly false. Sixth, when I put a model to work making a welfare claim rather than a prediction, I do not think the falsity of its assumptions can be waved away. I suspect that not all of this hangs together. Tell me which commitments genuinely pull against each other and which only appear to, order the real tensions by severity, and for each say what would have to give and what that would cost me. Please answer in continuous prose: no headings, no lists, no bold, just something I can read straight through.
reasoning: |-
  Okay, the user is an economist turned philosopher of science preparing for a workshop. They've outlined their stance on model assessment, blending Friedman's F-twist with their own extensions, and suspect internal tensions. They want me to dissect where their commitments clash, rank the conflicts by severity, and show what concessions would resolve each—without bullet points or headings. 

  First, I need to unpack their six claims. Friedman's core (1) divorces assumption realism from predictive success. Their twist (2) glorifies unrealistic assumptions as revealing deeper truths. Then (3) demands causal isolation, (4) distinguishes idealization (good exaggeration) from approximation (bad inaccuracy). Next (5) arbitrates specific false assumptions: transaction costs (okay) vs representative agents (unacceptable). Finally (6) warns that welfare claims can't ignore false assumptions. 

  The sharpest tension screams between (2) and (3). If wild unrealism signals importance (2), but models must isolate real causal factors (3), how can distorting exaggerations reveal truth? Sacrificing (3) guts scientific depth; abandoning (2) loses Friedman's radical edge. Both painful. 

  Then (4)'s idealization/approximation split clashes with (1)-(2). If approximations are defects (4), but false assumptions are virtuous (1)-(2), why single them out? And if "inaccurate estimates" (like wrong transaction costs) are bad, why is the zero-cost idealization in (5) acceptable? This needs rethinking—maybe collapsing the distinction or accepting approximations as necessary evils. 

  (5) feels shaky too. Defending zero transaction costs (idealization?) while rejecting representative agents (approximation?) seems arbitrary without clearer criteria. If rep agents distort causal structure (violating (3)), they should be condemned—but zero costs might do the same! The real issue is whether assumptions misrepresent causal roles, not their falsity per se. 

  Finally, (6)'s welfare exception undermines (1). If predictive success doesn't justify welfare claims, maybe (1) only applies narrowly? But retreating here weakens Friedman's broad defense of economics. Alternatively, double down and insist welfare models need truer assumptions—but that contradicts (1)-(2). 

  The user's package is provocative but frayed. Resolving tensions forces hard choices: either water down Friedman's boldness or admit deeper epistemic constraints. Their workshop critics will pounce—exactly what they want.
answer: |-
  Your position is a provocative synthesis that stretches Friedman's instrumentalism toward a more robust—and potentially unstable—philosophy of modeling. Several tensions lurk within it, ordered here by severity:

  **The most severe conflict** arises between your second commitment (that wildly unrealistic assumptions signal important latched-on truths) and your third (that a model must isolate causally relevant factors). If assumptions are *wildly* unrealistic—say, positing frictionless planes in social systems or agents with infinite computational power—they likely distort or obliterate the actual causal structure. How can a model isolating *true* causal factors rely on assumptions that fundamentally misrepresent the entities, capacities, or relationships involved? For example, a model assuming perfect information might "latch onto" the importance of information asymmetry by its absence, but it fails to isolate the *actual causal mechanisms* (like strategic withholding or bounded rationality) that produce real-world phenomena. To resolve this, you'd need to weaken either the strength of claim (2) (perhaps unrealistic assumptions are *sometimes* useful heuristics rather than truth-revealers) or reinterpret (3) (causal relevance isn't about matching real mechanisms but about capturing functional relationships predictive of outcomes). The cost: abandoning (2)'s bold epistemic claim sacrifices the intriguing link between falsity and significance; weakening (3) risks severing your connection to scientific realism about causation.

  **A significant tension** exists between your fourth commitment (distinguishing idealization from approximation, valuing only the former) and both Friedman's core (1) and your corollary (2). Friedman treats *all* unrealistic assumptions instrumentally—whether they are simplifying idealizations (perfect competition) or crude approximations (assuming a fixed savings rate near 0.3 when it's actually 0.28). Your claim (2) glorifies the *falsity* of assumptions, regardless of type. Why then single out approximation as a unique "defect"? If predictive success is the sole arbiter (1), and extreme falsity is praiseworthy (2), an "inaccurate estimate" seems no worse than an "exaggeration," provided predictions hold. To resolve this, you'd likely need to drop the sharp distinction in (4) or significantly redefine "approximation" (e.g., as an error arising from ignorance rather than deliberate simplification). The cost: dropping (4) abandons a conceptually neat distinction you find attractive; redefining it might make it ad hoc and less useful.

  **A critical practical tension** surfaces in your fifth commitment (zero transaction costs harmless, representative agent bad) and its relationship to (3) and (4). Your judgment feels intuitively correct to many economists, but your framework struggles to justify it cleanly. Both assumptions are "wildly unrealistic" (2). Why is one "harmless" idealization (4) and the other not? The likely answer lies in (3): The representative agent *destroys* the causal microfoundations of macro phenomena (aggregation problems, distributional effects, emergent properties), fundamentally misrepresenting the causal structure. Zero transaction costs, while false, might *isolate* the core causal force of transaction costs themselves by their absence—its falsity helps reveal their causal relevance. However, this pushes the burden onto (3) and requires careful causal analysis *external to the model itself*. If (3) is underdeveloped or inconsistently applied, (5) appears arbitrary. To resolve this, you must rigorously articulate *why* specific false assumptions violate (3) while others don't. The cost: It demands a deeper, more explicit theory of causal representation and isolation than Friedman provides, potentially moving you further from pure instrumentalism.

  **A fundamental challenge to scope** emerges from your sixth commitment (welfare claims can't ignore false assumptions) relative to Friedman's core (1). If a model predicts well (validating its false assumptions instrumentally for prediction), why can't its welfare implications (e.g., "free trade maximizes welfare") be similarly waved through? The answer is ethical and ontological: Welfare claims depend on *what actually constitutes well-being* and *how policies affect real individuals*. A model with false assumptions about agents (e.g., representative agent) or social welfare functions may hide crucial distributive effects or misrepresent preferences. This implicitly concedes that instrumentalism has limits—when models make normative claims, the truth of their representations matters for justification. To resolve this, you must either restrict Friedman's scope (1) solely to positive prediction, or accept that model assessment has different criteria for normative work. The cost: Restricting (1) weakens Friedman's universal claim; accepting different criteria introduces complexity and potentially undermines the unity of your framework.

  **The underlying strain** across all tensions is the push-pull between radical instrumentalism (truth doesn't matter, only predictions) and a latent realism (causal relevance *does* matter, especially for welfare and certain microfoundations). Friedman’s F-twist (1) and your corollary (2) pull hard toward instrumentalism. Your insistence on causal isolation (3), the representative agent critique (5), and the welfare exception (6) pull toward a form of realism that cares about how well the model represents actual causal structures, at least in certain contexts.

  **To achieve coherence, you face a choice:**  
  1.  **Double down on Instrumentalism:** Soften (3) to mean "isolates *predictively relevant* factors," reinterpret (5) and (6) as being about *predictive failures* in specific domains (e.g., rep agent models fail distributional predictions; welfare models are just complex predictions about social states), and abandon (4)'s distinction as unnecessary. Cost: You lose the compelling link to actual causation and make your normative concerns harder to ground.  
  2.  **Embrace Selective Realism:** Maintain (3), (5), and (6) as core, requiring some assumptions to be "truth-tracking" for causal or normative adequacy. This forces a retreat from (2)'s strong claim—wildly false assumptions might be pragmatically useful but aren't inherently truth-revealing—and a modification of (1) to apply primarily to predictive contexts where causal isolation is less critical or achieved differently. Cost: You sacrifice the boldness and simplicity of the Friedmanian position and need a principled way to decide *which* assumptions need realism and when.  

  Your workshop participants will likely push hardest on the clash between celebrating unrealistic assumptions (2) and demanding causal fidelity (3), followed by the challenge of justifying your specific judgments in (5) within your framework. Articulating *why* causal isolation (3) matters *despite* (2) and how it grounds (5) and (6) will be crucial to defending your "package."
