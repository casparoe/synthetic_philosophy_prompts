prompt: |-
  I just read a popular math book (the kind with almost no equations) that tries to explain Zorn's lemma in two paragraphs, and I want to know how much of it I should beleive. Here's my paraphrase of the gist, the author is alot smoother than this: "Zorn's lemma says that in any partially ordered set, if you can keep finding bigger elements, then there's a biggest one, a maximal element. It's the trick that proves things like every vector space having a basis. It's really just a restatement of the axiom of choice, and it's called a lemma rather than an axiom because it follows from more basic set theory. The catch is that the proof never tells you what the maximal element actually is, so when a mathematician says that by Zorn's lemma such an object exists, they haven't really shown that anything exists, they've just assumed it."

  I'm a philosophy grad student who took one logic course, so I can follow a careful explanation but I can't fill in the gaps myself. Which parts of that would a set theorist or an algebraist nod along to, which would make them wince, and which are just wrong? Specifically: (1) Is the statement true as it stands? If the hypothesis is doing more work than the book lets on, what exactly is the correct hypothesis and conclusion, and can you give me a concrete example of a partially ordered set that shows why that hypothesis is needed? (2) What's the real relationship between Zorn's lemma and the axiom of choice, and does the word "lemma" tell me anything about how strong it is or how it gets proved? I don't care who named it or when, just what it tells you mathematically. (3) Is that last sentence about not really proving existence fair, or is it an overstatement — and what would someone who uses Zorn's lemma every day say back? And if the book's version is going to make me misstate the lemma in a paper, give me the version I should actually write down.

  Please answer in American English.
