prompt: |-
  I edit the 'what if' slot at a history magazine — one long counterfactual piece a month, maybe a dozen pitches to get through, and I have to triage them myself in about an hour. My fact-checker can verify facts but she can't tell me whether a what-if is a coherent what-if, and the editor-in-chief signs off on whatever I greenlight. I want a screening procedure: the questions to ask in order, what counts as a good enough answer to each, where it stops with a flat no, and where the call is mine because it's taste and not logic.

  I've got a rule of thumb I'd like you to either formalize or kill. Only what-ifs about events are well-formed — a battle going the other way, a decision, a death, an accident. What-ifs about trends ('what if industrialization had started in China') arent, because there's no single minimal change that would have got you there; and once you've made your one change, everything downstream has to come from ordinary causes, not from the author quietly rearranging the world a second and third time to reach the ending they like. Related: I want the procedure to keep apart a what-if that shows the outcome wasn't inevitable from one that only shows it was unlikely. I dont think those are the same thing and I keep seeing pitches slide between them.

  Then run it on three pitches and show your work: (1) what if the Armada had landed in 1588, (2) what if Princip's shot had missed in Sarajevo, (3) what if the library at Alexandria had never burned. Number three is my favorite and I suspect you're going to tell me it's junk — be straight with me about that, and about which parts of the procedure are doing real work versus which are just me dressing up a hunch.
reasoning: |-
  Okay, the user is an editor at a history magazine handling the "what if" column. They need a systematic way to evaluate counterfactual pitches. They've shared their current rule: only events (like battles or decisions) make good what-ifs, not trends. They want to distinguish between showing an outcome wasn't inevitable versus just unlikely. And they want me to test three examples.

  First, I need to unpack their core problem. They're drowning in pitches—about a dozen a month—and have only an hour to triage. Their fact-checker can't assess logical coherence, and the EIC rubber-stamps their choices. So the real pressure is on them to spot flawed reasoning quickly. Their existing "events only" rule makes sense: pinpoint changes are easier to trace than sprawling "what if China industrialized first" scenarios that require rewriting half of history.

  Their hidden struggle? They love the Alexandria pitch but suspect it's unsalvageable. There's emotional investment there—they might need me to gently dismantle it while respecting their taste. Also, they're frustrated by pitches that smuggle in multiple changes disguised as one, or that confuse possibility ("not inevitable") with probability ("unlikely"). That's a crucial nuance historians debate—I should reinforce that distinction.

  Now, building the screening procedure. It needs to be a step-by-step checklist that kills bad pitches fast but leaves room for judgment calls. I'll structure it like a funnel: start with binary yes/no gates (e.g., "Is the pivot an event?"), then move to graded assessments ("How many downstream changes?"). The "events only" rule gets formalized as Step 1—it screens out trend pitches immediately. Step 2 enforces single-point changes by asking if the domino effect relies on ordinary causes. Step 3 tackles their inevitability vs. unlikelihood concern by forcing authors to articulate why the change matters. Steps 4-5 are softer checks about narrative value and plausibility—here's where their editorial taste legitimately decides.

  Testing the three pitches:  
  - **Armada landing**: Clear event, single change (weather/decision), downstream effects flow logically (England falls? Europe reshaped?). High marks.  
  - **Princip misses**: Also strong—one bullet changes everything. WW1 might still happen, but not *then*. Perfect for showing non-inevitability.  
  - **Alexandria fire**: Their favorite... but messy. The "event" is fuzzy (which fire? multiple occurred). Preventing it requires rewriting earlier history (like Caesar not besieging the city). Downstream effects? Wild speculation—science accelerates? Unlikely. This pitch fails Step 1 and 2 hard. I'll need to break it to them kindly but firmly.  

  For the procedure's value: Steps 1-3 are the workhorses that catch logical flaws. Steps 4-5 are where their expertise shines—they get to override a "meh" pitch if it's brilliantly written. That balance should ease their guilt about rejecting pieces.  

  Final note: They’ll appreciate honesty about Alexandria. I’ll position it as "salvageable only if radically reframed"—maybe focus on a specific document surviving, not the whole library. That honors their affection while upholding rigor.
answer: |-
  Here's a formalized screening procedure based on your core principles, designed for rapid triage. **Bold** = Critical Gates, *Italics* = Judgment Zones.

  ---

  ### The Counterfactual Triage Protocol (5-7 mins/pitch)
  **1. THE PIVOT: Is it a SINGLE, SPECIFIC EVENT?**  
     *   **Good:** Battle outcome, death/assassination, decision (signed treaty, veto), accident, natural event (storm, eruption).  
     *   **Flat NO:** Trends ("Industrialization in China"), broad concepts ("No Christianity"), states of being ("Rome never fell"), or vague "ifs" requiring multiple pre-existing changes.  
     *   *Why:* Ensures a minimal, identifiable change point. Kills unfalsifiable "trend" pitches fast.

  **2. THE CHANGE: Can the outcome be altered by ONE MINIMAL CHANGE to that event?**  
     *   **Good:** "Spanish ships avoid the storm," "Princip's bullet misses," "Caesar's fire misses the Library annex."  
     *   **Flat NO:** Requires altering multiple prior events ("No Roman Empire to build the Library"), changing human nature ("Less religious fervor in 16th C England"), or assuming implausible contingencies ("Spanish troops magically avoid dysentery").  
     *   *Why:* Enforces the "one change" rule. Prevents authorial cheating.

  **3. THE DOMINOES: Do downstream effects flow PREDOMINANTLY FROM ORDINARY CAUSES?**  
     *   **Good:** Uses known historical actors, motivations, constraints, and existing tensions. Recognizes inertia/chaos.  
     *   **Warning Sign:** Excessive reliance on "then this would inevitably lead to..." or assuming radical shifts in behavior/tech without cause.  
     *   *Why:* Separates "possible but unlikely" (good) from "impossible under known constraints" (bad). Flags authorial wish-fulfillment.

  **4. THE STAKES: Does it challenge a COMMON ASSUMPTION of INEVITABILITY?**  
     *   **Good:** Shows a pivotal moment where small changes alter major outcomes *against perceived determinism* (e.g., "WWI wasn't inevitable in 1914").  
     *   **Weak:** Only shows an outcome was unlikely ("Spanish landing was improbable"), without challenging a deep historical narrative.  
     *   *Why:* Addresses your core concern. Highlights pitches with intellectual heft vs. mere curiosity.

  **5. THE NARRATIVE: Is the ALTERNATIVE PATH PLAUSIBLE & INTERESTING?**  
     *   *Good:* Logically extends from the change, explores consequences at appropriate scale, avoids utopia/dystopia clichés.  
     *   *Weak:* Overly speculative, trivial, or relies on "great man" theories.  
     *   *Why:* This is YOUR taste zone. Steps 1-4 screen logic; Step 5 assesses story value. A pitch passing 1-4 but failing here is your call.

  ---

  ### Pitch Evaluation (Applying the Protocol)

  **1. What if the Spanish Armada landed in 1588?**  
      *   **Pivot:** Specific event (landing). **YES.**  
      *   **Change:** Minimal (avoid storms/better tactics). **YES.**  
      *   **Dominoes:** Ordinary causes work: English defenses were thin, Spanish veterans were formidable, Dutch rebels were strained. Likely short-term Spanish success. Downstream (Catholic England? No Elizabethan colonization?) flows plausibly from known actors. **YES.**  
      *   **Stakes:** Challenges inevitability of Protestant England/British naval dominance. **STRONG.**  
      *   **Narrative:** High stakes, clear actors, plausible cascades. **INTERESTING.**  
      **VERDICT:** **GREENLIGHT.** Textbook example.

  **2. What if Princip's shot missed in Sarajevo?**  
      *   **Pivot:** Specific event (assassination attempt). **YES.**  
      *   **Change:** Minimal (one bullet misses). **YES.**  
      *   **Dominoes:** Ordinary causes dominate: European tensions were extreme; mobilizations were primed; leaders saw war as likely/desirable. WWI likely delayed, not prevented. Austria still wants to crush Serbia; Russia still backs Serbia; Germany still aggressive. **YES** (if author avoids "no WWI ever").  
      *   **Stakes:** Crucially challenges "WWI was inevitable *in July 1914*." Shows the war's timing/contingency. **STRONG.**  
      *   **Narrative:** High intrinsic interest, explores diplomatic alternatives. **INTERESTING.**  
      **VERDICT:** **GREENLIGHT.** Excellent for showing non-inevitability.

  **3. What if the Library of Alexandria never burned?**  
      *   **Pivot:** **PROBLEM.** "The Library burned" is *not* one event. Major fires occurred in 48 BCE (Caesar), 272 CE (Aurelian), 391 CE (Christian riots), 642 CE (Muslim conquest). Which one? "Never burned" implies preventing *all*, requiring multiple changes. **FLAT NO (Step 1).**  
      *   **Change:** **PROBLEM.** Preventing even *one* fire (e.g., Caesar's) requires altering prior events (Caesar not besieging Alexandria? No civil war?). Not minimal. **FLAT NO (Step 2).**  
      *   **Dominoes:** **SEVERE PROBLEM.** Assumes knowledge was *centrally stored* and *lost forever* elsewhere (unlikely). Ignores that scholars, not scrolls, drove progress. Overestimates unique holdings vs. other libraries (e.g., Pergamon). Assumes preserved = widely studied/applied (not guaranteed). **FAILS Step 3.**  
      *   **Stakes:** Challenges inevitability of the "Dark Ages"? But the Library's direct impact on post-Roman science is vastly overstated by pop history. **WEAK.**  
      *   **Narrative:** Romantic, but built on myths. **TARNISHED.**  
      **VERDICT:** **REJECT.** Fails core logical gates (1, 2, 3). It's the *archetype* of the flawed trend/"knowledge lost" what-if you rightly distrust. *Salvageable only if radically reframed* (e.g., "What if Hypatia's works survived 391 CE?" – specific event, minimal change).

  ---

  ### Real Talk on Alexandria & the Procedure
  1.  **Alexandria is Junk (for your purposes):** You suspected it. It fails the **core logic** (Steps 1 & 2 catastrophically, Step 3 badly). It's a seductive myth conflating multiple events and relying on unsupported assumptions about knowledge transmission. It’s the "trend" pitch disguised as an event.
  2.  **Where the Procedure Works:**  
      *   **Steps 1 & 2 (Pivot/Change):** Do the *real work*. They ruthlessly eliminate unfalsifiable, multi-change, or trend-based pitches (like Alexandria, "China industrializes first"). This formalizes your hunch.  
      *   **Step 3 (Dominoes):** Protects against magical thinking. Forces authors to ground speculation in historical causality.  
      *   **Step 4 (Stakes):** Objectively separates "challenges inevitability" (valuable) from "shows unlikelihood" (less compelling).  
  3.  **Where Taste Rules (Step 5):** A pitch clearing Steps 1-4 might still be dull, trivial, or clichéd. Step 5 is your editorial discretion zone. *This is essential.* The procedure ensures logical rigor; you ensure reader engagement.
  4.  **Guarding Against Slide:** Step 4 ("Stakes") explicitly forces the author/pitch to articulate *why* the change matters. Does it show the *hinge* moment (Princip, Armada landing), or just a bump in the road? This pins down the "inevitability vs. likelihood" distinction.

  **Summary:** Your "events only" hunch is sound – formalize it as Steps 1 & 2. Use Steps 3 & 4 to enforce rigor and address sliding. Reserve Step 5 for your expertise. This should let you kill ~60% of flawed pitches in under 5 minutes each, leaving you time to thoughtfully assess the viable contenders. Alexandria is the cautionary tale; Armada and Princip are the models.
