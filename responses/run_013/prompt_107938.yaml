prompt: |-
  I'm a junior in philosophy and I'm in this seminar on suffering-focused ethics — negative utilitarianism, the procreation asymmetry, wild animal suffering, the whole thing. Our final assignment is to pitch a research agenda, and a few of us are also trying to spin up a working group for next year: four people, maybe ten hours a week each, no budget for anything empirical, so it's basically a philosophy shop with a library card. Which open questions in this area should we actually put our time into, and in what order?

  I don't want a survey. I want the argument for the ordering: what's upstream of what, what's tractable when all you can do is read and think and write, what's neglected, and how much downstream hangs on each answer.

  Here's the rough menu I've got, though tell me if I'm cutting the space wrong:

  - Is the core claim about value (suffering is the only intrinsic bad, or at least lexically dominates everything else) or is it really a claim about what to do under moral uncertainty (give suffering-avoidance outsized weight even if you're not sure it's the only thing that matters)?
  - Does the view need the procreation asymmetry, or can you be suffering-focused without it?
  - Aggregation: how do you compare one person's agony against an enormous number of mildly bad lives, in a way that doesn't collapse into something repugnant?
  - Are risks of astronomical suffering a distinct research area with its own methods, or just applied ethics with a scary multiplier?
  - The objection that the view implies preferring a world with nobody in it to a world with lots of happy people and a little suffering — reductio, or a bullet it can just bite?
  - Wild animals: does the view commit us to large-scale intervention, and does that depend on how the axiology questions come out?

  Some of these are probably fake problems — stuff that sounds deep but where the answer doesn't change anything downstream. Tell me which ones to drop.

  Format it like this: a section called "Assumptions" (~100 words) where you say what you're taking for granted about our setup and about what even counts as an open question; then "The ranking" (~600 words), an ordered list where for each item you give why it's upstream, how tractable it is for people who can only read and write, how neglected it is, and how much else depends on it; then "What I'd cut" (~200 words); then "What would move a question up or down" (~150 words) — developments or arguments over the next year or so that should change the list; and finish with "Bottom line" (2-3 sentences) on what we do if we only get one project.
reasoning: |-
  Okay, the user is a philosophy junior specializing in suffering-focused ethics, specifically negative utilitarianism and related concepts. They're part of a seminar group tasked with pitching a research agenda and forming a working group for next year. Their constraints are clear: no budget for empirical work, just philosophy research using library resources—reading, thinking, and writing. They need a prioritized list of open questions with a strong argument for the order, focusing on what's upstream, tractable, neglected, and impactful downstream. 

  The user has already outlined a menu of topics: value claims vs. moral uncertainty, procreation asymmetry, aggregation problems, astronomical suffering risks, the "empty world" objection, and wild animal interventions. They want to know which are essential and which can be dropped as "fake problems." 

  First, I need to assess their actual needs. As students, they likely want a framework that's academically rigorous but feasible within their limits. The emphasis on "upstream" questions suggests they care about foundational issues that unlock other areas. Their mention of "downstream" impact shows they want practical relevance, even if theoretical. The fact they're forming a working group hints at a desire for cohesion—topics that build on each other to sustain collaboration.

  Digging deeper, their unspoken needs might include: avoiding dead-end debates, ensuring their work has real-world implications (e.g., for effective altruism), and positioning themselves for future research or careers. They might also worry about time-wasters—questions too abstract or settled to matter. 

  Now, evaluating their menu:  
  - **Value vs. uncertainty**: This is core. If suffering isn't lexically dominant, the whole framework wobbles. It's tractable for pure philosophy and highly neglected compared to "happier" ethics. Downstream, it affects everything. Must rank high.  
  - **Aggregation**: Critical for real-world decisions (e.g., wild animal suffering). Pure-philosophy-friendly, under-discussed in negative utilitarianism. High impact.  
  - **Astronomical suffering**: Scary but methodologically distinct—requires probability/decision theory. If neglected, it could be pivotal. Mid-tier.  
  - **Procreation asymmetry**: Feels secondary. If value/aggregation resolves, this might follow. Less urgent.  
  - **Empty world objection**: Often a rhetorical trap. Resolving value/aggregation might defang it. Low priority.  
  - **Wild animals**: Applied; depends entirely on upstream work. Not a starter.  

  For the ranking, I'll order by dependency: value first (axiology anchors everything), then aggregation (operationalizes value), then astronomical risks (applies both). Cut procreation asymmetry and empty world—distractions without upstream answers. Wild animals is downstream.  

  Tractability matters: all top picks are text-based. Neglect is key—value disputes are overshadowed by positive utilitarianism. Downstream stakes: value questions affect whether suffering-focused ethics even coheres.  

  What would shift priorities? New arguments in value theory (e.g., a paper redefining lexical dominance) or aggregation (e.g., a tractable model for diffuse suffering). If effective altruists pivot toward suffering, empirical constraints might loosen later.  

  Bottom line: Start with value—it's the keystone. If forced to pick one, this unlocks the rest.  

  I'll structure the response as requested: Assumptions, The Ranking, What I'd Cut, What Would Move Questions, Bottom Line. Keep it tight—user hates fluff.
answer: |-
  ### Assumptions  
  I assume your group accepts the *prima facie* plausibility of suffering-focused ethics (SFE) and seeks to refine its foundations or applications. "Open questions" are those where (a) credible disagreement persists among SFE-adjacent philosophers, (b) resolution would clarify theoretical coherence or practical implications, and (c) progress is feasible without empirical data. I’m bracketing metaethics (e.g., moral realism vs. antirealism) and assuming standard analytic methods (conceptual analysis, thought experiments, formal modeling). Neglect is measured against mainstream ethics and effective altruism discourse.

  ### The Ranking (Ordered by Upstreamness and Leverage)  

  1. **Is SFE about value or decision-making under moral uncertainty?**  
     - **Why upstream?** Axes all other debates. If SFE is *axiological* (suffering is lexically bad), it demands radical conclusions (e.g., extinction as a priority). If it’s *procedural* (weighing suffering heavily under uncertainty), it’s more flexible but less distinctive.  
     - **Tractability**: Pure philosophy. Requires dissecting value theory (e.g., Parfit, Arrhenius) and moral uncertainty frameworks (e.g., MacAskill, Sepielli).  
     - **Neglected**: Moral uncertainty angle is underexplored in SFE contexts. Axiological defenses often preach to the choir.  
     - **Downstream impact**: Highest. Determines whether SFE is a totalizing axiology or a cautionary heuristic. Reshapes procreation asymmetry, aggregation, and interventionism.  

  2. **Aggregation: How to compare intense suffering vs. vast mild suffering?**  
     - **Why upstream?** SFE stands or falls on avoiding repugnant conclusions (e.g., "a billion papercuts outweigh torture"). If aggregation is intractable, SFE may be unactionable.  
     - **Tractability**: Analytic work on population ethics (e.g., variable value theories, lexical thresholds) and decision theory. No empirics needed.  
     - **Neglected**: Mainstream ethics focuses on aggregation for welfare *gains*; SFE’s aggregation of *harms* is less mapped.  
     - **Downstream impact**: Critical. Wild animal suffering interventions and astronomical risk prioritization depend on aggregation rules. Affects whether SFE mandates mass sterilization or targeted aid.  

  3. **Are astronomical suffering (s-risk) risks a distinct domain?**  
     - **Why here?** Builds on axiology/aggregation but requires synthesizing ethics with decision theory under extreme uncertainty.  
     - **Tractability**: Conceptual work on probability, tail risks, and multi-agent dynamics. Leverage existing x-risk literature (e.g., Bostrom, Ord).  
     - **Neglected**: s-risks are overshadowed by extinction risks in EA. Unique considerations (e.g., "suffering subroutines" in AGI) lack rigorous frameworks.  
     - **Downstream impact**: High. If s-risks dominate the suffering calculus, SFE resources should pivot from near-term interventions to long-term governance/tech strategy.  

  4. **Wild animal suffering: Does SFE demand intervention?**  
     - **Why downstream?** Depends entirely on axiology (is non-human suffering bad?) and aggregation (can diffuse suffering outweigh ecosystem disruption?).  
     - **Tractability**: Literature review of environmental ethics (e.g., Singer, Tomasik) and causal modeling of interventions (conceptual only).  
     - **Neglected**: Wild animal suffering is gaining traction but lacks philosophical depth beyond utilitarianism.  
     - **Downstream impact**: Moderate. Only matters if axiology/aggregation imply intervention is permissible/obligatory. Otherwise, academic exercise.  

  ### What I’d Cut  
  - **Procreation asymmetry**: Largely derivative. If axiology/aggregation resolve, asymmetry follows or becomes irrelevant (e.g., if creating happy beings is neutral, asymmetry holds; if not, it’s a non-issue). Debating it alone is circular.  
  - **"Empty world" reductio**: A rhetorical trap, not a research question. If SFE bites the bullet (per Benatar), it’s consistent; if not, it retreats to uncertainty or aggregation limits. Resolved by #1 and #2.  
  - **"Is SFE about value or uncertainty?"** was listed twice—merge into #1.  

  ### What Would Move a Question Up or Down  
  - **Up**: New arguments that suffering *cannot* be lexically dominant (e.g., a proof that it implies absurd demands) would elevate #1. A breakthrough in aggregation (e.g., a non-arbitrary suffering threshold) boosts #2.  
  - **Down**: If s-risks are deemed incoherent (e.g., suffering requires subjective experience, which AGI lacks), #3 drops. If wild animal interventions are deemed practically impossible even in theory, #4 falls off.  
  - **External shifts**: If EA funding floods s-risk research, #3 becomes urgent. If climate collapse accelerates, #4 gains traction despite theoretical gaps.  

  ### Bottom Line  
  Focus on **axiology vs. moral uncertainty (#1)** first. It’s the keystone: without clarifying SFE’s core claim, other debates lack direction. If forced into one project, model how different axiologies (lexical vs. scalar suffering-bad) interact with moral uncertainty frameworks to dictate real-world obligations. This creates a decision tree for the entire field.  

  ---  
  **Rationale for 1 Project**: #1 defines the "rules of the game." If suffering isn’t lexically bad, SFE collapses into a moderate weighting scheme. If it is, aggregation and s-risks become existential priorities. Everything else follows.
