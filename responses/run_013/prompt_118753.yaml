prompt: |-
  I've been reading Hume's essays on money and trade with a reading group (I'm the only one in it who isn't an economist, which is probably why nobody else finds this strange) and there's a move in them that I keep running into everywhere else too, and I dont know if it has a name.

  Here's the first bit. Money gets treated as basically a token, a thing you measure trade with rather than a part of the wealth being traded, and from that it follows that doubling how much of it there is changes nothing real — prices adjust and nobody is actually richer. Fine. But then the same essays say a country is lucky to be getting more of it, because while the new money is working its way around, before prices catch up, people are busier, trade picks up, industry does better. And then a third bit: a country losing its gold is supposed to be fine, because the gold leaving makes its prices fall and its exports cheap and then the gold comes back by itself.

  So money doesn't matter, except that it matters while it's arriving, and a country can't be hurt by losing it. All three are supposed to be true at once, and the thing that's supposed to hold them together is always a time horizon — the long run. But nobody ever says when it starts, or what you'd have to see to find out you were wrong about it coming.

  I run into the same shape in arguments about central banks now. Somebody says a general rise in prices is harmless in real terms, and the same person is very worried about who gets the new money first, and about what happens to people on fixed incomes in the meantime. Those cant be the same claim.

  So: is there a name for the second thing, the while its arriving doctrine, as opposed to the it cancels out eventually doctrine? And is it one idea or three stapled together, because I suspect a claim about who gains and loses, a claim about prices lagging, and a claim about idle factories getting going are seperate claims that people bundle. If the answer is that I'm really looking at three existing ideas wearing one coat, say which ones and where the seams are. And is there a name for the whole syndrome — a doctrine that only comes true at a limit nobody reaches, but that gets used to settle arguments about what's happening right now? If there isn't one, coin one, but tell me where it stops applying: does the arriving story need wages to lag behind prices, or spare capacity, or people not noticing, or does it survive even if everybody sees it coming?

  And what has to be true for the automatic gold thing to actually work? Every time I hear it the person seems to have assumed away exactly what the argument is about.
reasoning: |-
  Okay, the user is grappling with a conceptual puzzle in monetary economics, rooted in Hume but extending to modern central banking debates. They've identified what seems like a contradiction: money is neutral in the long run (doesn't affect real wealth), yet its short-term movements (inflows/outflows) have real economic effects. 

  First, I need to unpack their three observations systematically. The user is clearly well-read but frustrated by economists' hand-waving about "long run" timing. Their core question has two layers: terminology (what's the name for this?) and mechanics (what assumptions make this coherent?). 

  The neutrality-of-money concept is straightforward, but the short-term non-neutrality needs more nuance. I recall Hume's mechanism relies on price stickiness—specifically, the Cantillon Effect where money enters through specific channels (e.g., exporters) before diffusing. Modern parallels include monetary policy transmission lags. 

  For the gold flow mechanism (price-specie-flow), its viability hinges on price flexibility and trade elasticity—assumptions Keynes later challenged. The user's suspicion about "assuming away the argument" is astute; in practice, wage rigidity or capital mobility can break the mechanism. 

  Their frustration with the "long run" evasion reminds me of Keynes' quip about being dead in the long run. Economists do this because the alternative—admitting short-term pain matters—complicates policy narratives. The user might appreciate distinguishing between theoretical coherence (all three claims can hold with specific assumptions) and real-world applicability (where those assumptions often fail). 

  Naming things: "Monetary non-neutrality in the short run" is the academic term, but it's clunky. Hume's original insight deserves its own label—perhaps "Humean Monetary Transition Dynamics"? For the gold mechanism, "Price-Specie-Flow Mechanism" is standard. 

  The deeper need here seems to be for intellectual scaffolding: they want to dissect economists' rhetorical moves when hand-waving contradictions. I should emphasize where seams exist—e.g., the "three claims stapled together" are indeed separable (distributional effects, nominal rigidities, output gaps). 

  Finally, their gold mechanism skepticism is justified. I'll flag how it fails with sticky prices, sovereign debt issues, or when devaluation triggers capital flight instead of trade balance fixes. Modern equivalents exist in currency crisis models.
answer: |-
  You've hit on one of the most profound and persistent tensions in monetary theory: **the short-run/long-run dichotomy and the non-neutrality of money during transitions.** Here's a breakdown of the concepts, names, seams, and necessary conditions:

  1.  **The Three Claims & Their Names:**
      *   **Claim 1 (Money as a Veil / Long-Run Neutrality):** Money is a unit of account and medium of exchange, not wealth itself. Doubling the money supply eventually doubles prices, leaving real output, employment, and wealth unchanged in the long run.
          *   **Name:** **The Quantity Theory of Money (Long-Run Neutrality of Money).**
      *   **Claim 2 (The Stimulus of Inflow / Short-Run Non-Neutrality):** An *increase* in the money supply (e.g., gold inflow) stimulates real economic activity *temporarily* because prices (especially wages and some goods) adjust sluggishly. This period of adjustment creates a "real balance effect" where people feel nominally richer and spend more, boosting output and employment *before* prices fully rise.
          *   **Name:** **The Cantillon Effect** (specifically the *first-round* effects) combined with **Short-Run Monetary Non-Neutrality** due to **Nominal Rigidities** (sticky prices/wages). Hume is often credited as the first to systematically describe this dynamic.
      *   **Claim 3 (Self-Correcting Outflow / The Gold Mechanism):** A *decrease* in the money supply (e.g., gold outflow) lowers domestic prices *relative* to foreign prices. This makes exports cheaper and imports more expensive, improving the trade balance, leading to a gold inflow that reverses the initial loss.
          *   **Name:** **The Price-Specie-Flow Mechanism** (Hume's specific mechanism for the international gold standard).

  2.  **The Seams: How They Connect (and Where They Strain):**
      *   **The Glue: Nominal Rigidities & Adjustment Dynamics.** The key that binds Claims 1 and 2 (and makes Claim 3 work) is the assumption that *some prices adjust faster than others*. Wages are notoriously sticky downward. Some goods prices (especially services) adjust slowly. Asset prices might react instantly. Expectations form gradually.
      *   **The Seams Between the Claims:**
          *   **Claim 1 vs. Claim 2:** The seam is the *speed of price adjustment*. Claim 1 assumes instantaneous, frictionless adjustment. Claim 2 explicitly relies on *slow* adjustment (rigidities, information lags, menu costs, contracts).
          *   **Claim 2 (Inflow Stimulus) vs. Claim 3 (Outflow Correction):** The seam is *symmetry*. Hume (and classical economists) often assumed symmetry: money flowing in boosts output on the way up, money flowing out lowers prices/output on the way down, triggering the correction. However, **downward nominal wage rigidity** makes the outflow process potentially much more painful and prolonged than the inflow process is beneficial. Workers resist nominal wage cuts fiercely, leading to unemployment rather than smooth price declines.
          *   **Distribution vs. Aggregate:** Claim 2 inherently involves **distributional effects** (Cantillon Effect). Who gets the new money first (miners, exporters, banks, government spenders) gains purchasing power *before* prices rise. Those on fixed incomes or receiving money last (pensioners, salaried workers) lose. Claim 1 is about the *aggregate* outcome after full adjustment. Claim 3 overlooks the potential pain *during* the outflow phase.
      *   **The "While It's Arriving" Doctrine:** This is primarily **Short-Run Monetary Non-Neutrality** driven by **Nominal Rigidities**. The "stimulus" aspect specifically relies on **Demand-Pull Inflation Dynamics** occurring before full price adjustment. The distributional aspect is the **Cantillon Effect**.

  3.  **The "Long Run" Syndrome:**
      *   **Name:** This is the core challenge of **Macroeconomic Dynamics**. More critically, it's often called out as the **"Long Run is a Misleading Guide to Current Affairs"** problem (famously paraphrasing Keynes: *"In the long run we are all dead"*). Economists refer to the **Adjustment Period**, **Transition Dynamics**, or **Disequilibrium Period**.
      *   **When Does it Start?** There is *no* defined start. It depends entirely on the **speed of price and wage adjustment**, which varies massively based on:
          *   **Institutional factors:** Labor union strength, contract duration, central bank credibility.
          *   **Expectations:** If people *anticipate* sustained inflation, they demand higher wages/prices faster, shortening the "stimulus" period. If they believe the central bank will reverse course, adjustment is quicker.
          *   **Economic slack:** The stimulus effect is strongest when there are idle resources (unemployed workers, spare factory capacity). If the economy is at full capacity, new money translates into inflation much faster.
      *   **Surviving Foresight:** The "arriving story" *does not* survive if *everyone perfectly anticipates the inflation and instantly adjusts*. If wages and prices jump immediately to the new equilibrium level upon the announcement of a money supply increase, there is no real stimulus – neutrality holds instantly. However, the real world is defined by **imperfect information, inertia, and contracts**, making perfect foresight and instant adjustment impossible. Therefore, the short-run non-neutrality persists *even if people see it coming*, but its *duration and magnitude* are reduced. Wages lagging behind prices is a *crucial* mechanism (workers don't instantly demand full compensation).

  4.  **The Price-Specie-Flow Mechanism: Necessary Conditions & Why it Often Fails:**
      Hume's automatic gold mechanism requires a *very specific* set of conditions to work smoothly:
      *   **Perfect Price Flexibility:** Prices (especially wages) must fall *easily and quickly* in the gold-losing country. (**Downward Nominal Rigidity breaks this**).
      *   **High Trade Elasticities:** Foreign demand for the country's now-cheaper exports must increase *significantly*, and domestic demand for now-more-expensive imports must fall *significantly*. If demand is inelastic, the trade balance doesn't improve enough.
      *   **Gold Standard Rules:** The central bank *must not* sterilize the outflow (i.e., it must allow the money supply to shrink). Countries often broke this rule.
      *   **No Capital Flows:** The model assumes gold flows *only* due to trade imbalances. Modern capital mobility dwarfs trade flows. A gold outflow might trigger a *capital flight* panic, accelerating the loss.
      *   **Symmetric Adjustment:** The *surplus* country must allow its money supply to increase and prices to rise. They often resisted inflation via sterilization.
      *   **No Policy Response:** Governments must not impose tariffs, devalue (in a non-gold system), or implement austerity/fiscal stimulus that interferes.
      *   **"Assuming Away the Argument":** You are absolutely right. Advocates often implicitly assume away the very rigidities and distributional conflicts that make the outflow process painful and politically unsustainable. The mechanism *theoretically* works under perfect classical assumptions, but in practice, the short-run pain (unemployment, bankruptcy) during the "price fall" phase is severe, leading countries to abandon the gold standard or implement protectionist policies long before the automatic correction finishes. Keynesian economics arose largely to address this failure of automatic adjustment.

  **In Summary:**

  *   **The "it cancels out" doctrine:** **Long-Run Neutrality of Money** (Quantity Theory).
  *   **The "while it's arriving" doctrine:** **Short-Run Monetary Non-Neutrality** driven by **Nominal Rigidities** (especially sticky wages), manifesting as demand-pull stimulus during inflows. Its distributional aspect is the **Cantillon Effect**.
  *   **The "automatic gold" doctrine:** **The Price-Specie-Flow Mechanism**.
  *   **The "long run" syndrome:** The inherent tension in **Macroeconomic Dynamics**, highlighting the critical importance of the **Adjustment Period** where money is non-neutral. It's not a single doctrine, but the *core practical challenge* of monetary economics.
  *   **The seams:** **Price/Wage Rigidities** (connecting neutrality & non-neutrality), **Downward Rigidity** (breaking symmetry between inflow/outflow), and **Distribution** (Cantillon Effect vs. aggregate outcomes).
  *   **Necessary Conditions for Hume's Gold Mechanism:** Perfect price flexibility (especially downward), high trade elasticities, adherence to gold standard rules (no sterilization), minimal capital mobility, symmetric surplus country adjustment, and no policy interference – conditions rarely met in reality.

  You've identified the fundamental reason why monetary policy remains controversial: the long-run anchor (neutrality) is clear, but the messy, painful, and politically charged short-run transition dynamics are where the real action (and disagreement) happens. Hume brilliantly outlined the framework, but the real world's frictions make the smooth, automatic outcomes he described the exception rather than the rule.
