  For scientific inference: This is tricky. The worry suggests that Solomonoff induction might not lead to truth but to whatever fits a simulated reality. However, since shorter programs (like simple physical laws) are much more probable, this might not be a practical issue. Still, it introduces a philosophical challenge to the ideal of unbiased induction.

