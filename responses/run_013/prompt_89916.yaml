  We are designing an interactive session for a group of 14 rationalist regulars to discover Lewis's triviality result through an activity. The goal is for them to see that, under a natural pricing rule for conditional tickets, they are forced to conclude that the antecedent is irrelevant to the consequent. The key steps are:

  1. Participants price a conditional ticket at the conditional probability P(B|A).
  2. After learning A and B, the ticket is worth 1; after learning A and not-B, it is worth 0.
  3. The current price must be the expected value of the future prices, which is P(B) (because the future prices are 1 when B and 0 when not-B, and the expectation is P(B)).
  4. Therefore, P(B|A) = P(B), meaning A is irrelevant to B.

  We want the participants to feel the pressure and see the absurdity.

  We design the activity as follows:

  **Materials:**
  - Whiteboard for public recording.
  - Tokens (e.g., poker chips) for trading and settlements. Each participant starts with 10 tokens.
  - A "price sheet" for each participant (or one public one) to record their prices for the conditional ticket at three times: now, after the consequent is confirmed (i.e., after learning A and B), and after it is disconfirmed (after learning A and not-B). We will use a physical token system to represent the news-weighted average.

  **Roles:**
  - **Pricers (3-4 people):** Post their current price for the conditional ticket (in tokens) and also state what they would price it at after learning A and B (which should be 1) and after learning A and not-B (which should be 0). They write these on the whiteboard in three columns: Now, After A&B, After A&~B.
  - **Traders (6-7 people):** Can trade with the pricers at the posted prices. They aim to make a profit by finding incoherent prices (like Dutch booking). They can propose trades to the pricers. Each trade must be accepted by a pricer (we assume they are forced to trade at their posted prices to simulate a market).
  - **Bookkeeper (1 person):** Records trades and, at the appropriate time, calculates the news-weighted average of the future prices (using tokens to represent the weights) and announces it. The bookkeeper also oversees the settlement of tickets.
  - **Registrar (1 person, could be facilitator):** Manages the flow, enforces rules, and records the group's conclusions on the whiteboard.

  **Payoff Scheme:**
  - Tokens are used for trading. At the end of the session, the participant with the most tokens wins a small silly prize (e.g., a rubber chicken, a certificate of rationality).
  - Trading rules: 
    - A conditional ticket pays 1 token if A and B are both true, 0 if A is true and B is false, and is void (settles for 0? or refunded?) if A is false. 
    - Important: We must define the settlement rule. We'll say that if A is false, the ticket is void and the purchase price is refunded. This avoids the issue of vacuously true conditionals and matches the idea that the conditional is only about the case when A is true.

  **Price Sheet Example:**
  The price sheet for a conditional ticket on "If A, then B" (written as A→B) has three lines:

  ```
  Now: [   ] tokens
  After learning A and B: [ 1 ] token   (because if A and B are true, the ticket pays 1)
  After learning A and not-B: [ 0 ] tokens   (because if A is true and B false, the ticket pays 0)
  ```

  The pricers must fill in the "Now" price. The other two are fixed at 1 and 0 respectively.

  **Settlement Rule:**
  - After the truth values of A and B are revealed (by the facilitator at a later stage), the tickets are settled:
    - If A and B: ticket holder gets 1 token.
    - If A and not-B: ticket holder gets 0 tokens.
    - If not-A: the ticket is void and the holder gets back the tokens they paid (so no loss or gain).

