     If we learn B: [1]
     If we learn not-B: [0]

  4. The bookkeeper then calculates the news-weighted average of the future prices: 
     current price should = P(B) * 1 + P(~B) * 0 = P(B)

     So they compute P(B) (unconditional probability of rain) from the group. Ask the group for their P(B). (e.g., 0.3)

  5. Then they see that 0.8 = 0.3 is a contradiction.

  6. So they must have made a mistake. The mistake is that the pricing rule for conditionals leads to this contradiction unless P(B|A)=P(B).

   To run it with tokens, we need to settle in tokens. Let's assume we use a scale of 0 to 10 for probabilities, so prices in tokens from 0 to 10.

   Example: 
     Pricer posts: Now: 8 tokens (meaning 0.8 if we think of 10 as 1).
     After learning B: 10 tokens.
     After learning not-B: 0 tokens.

   The bookkeeper then asks the group: what is your unconditional probability of B? Say they say 3 tokens (0.3).

   Then the bookkeeper says: the current price should be the average of the future prices weighted by the probability of B and not-B. So:

     Expected future price = (probability of B) * 10 + (probability of not-B) * 0 = 3 tokens.

   But the pricer posted 8 tokens now. 

   Then the bookkeeper can show that with tokens: if they represent the probability by physical proportions, e.g., they have 3 green tokens for B and 7 red for not-B. Then the future price is 10 if green, 0 if red. So the expected value is (3/10)*10 + (7/10)*0 = 3 tokens.

   So the current price should be 3 tokens, but it's posted as 8. Incoherence.

   Then the facilitator says: but wait, the price now is set to P(B|A)=8, and the news-weighted average is P(B)=3. So to avoid incoherence, we must have P(B|A)=P(B).

   Then the group sees that the barometer drop tells them nothing about the rain.

  **Round-by-round plan:**

  1. Introduction (5 mins):
     - Facilitator explains the conditional ticket: "This ticket will be worth 1 token (i.e., it will pay 1 token) if A and B are both true, 0 tokens if A is true and B is false, and if A is false, the ticket is void and we will refund the purchase price. So you get your tokens back if A is false."
     - Group chooses A and B. (Suggest if needed: barometer dropped / it will rain.)
     - Assign roles.

  2. Pricing (10 mins):
     - Pricers post their current price for the ticket (in tokens, from 0 to 10). They should use their P(B|A) times 10.
     - Pricers also post: if we learn that B is true, then they would price the same ticket at 10 tokens. If we learn that B is false, they would price it at 0 tokens. (Facilitator instructs them to do so.)
     - These are written on the whiteboard.

  3. Trading (10 mins):
     - Traders can trade with pricers at the current price. But we are not using this to find a Dutch book yet. It's to make them invested.

  4. The News-Weighted Average (15 mins):
     - Bookkeeper asks the group for their unconditional credence in B, in tokens (0 to 10). They take an average or ask for a show of hands? Or ask each participant to state their P(B) and average them? We want one number. Perhaps ask the pricers for their P(B) and average. Or have a vote.
     - Bookkeeper then computes the expected future price: (group's P(B)) * 10 + (1 - group's P(B)) * 0 = group's P(B) [in tokens scaled].
     - Bookkeeper writes this number.
     - Facilitator: "But the current price is [current price]. The news-weighted average is [P(B)]. These should be equal to avoid arbitrage. So we must have [current price] = [P(B)]."

  5. Contradiction (10 mins):
     - The group sees that the current price (which is P(B|A)) is set to a number that is not equal to P(B), but the argument forces them to be equal.
     - So they must either change their P(B|A) to be equal to P(B) or change something else.

   Optional extension on negations (10 mins):
     - Facilitator: "How would you price the negation of the conditional, ~(A→B)?"
     - It should be: pays 1 if A and not-B, 0 if A and B, and void if not-A.
     - They should price it at P(~B|A).
     - But then after learning B, it should be priced at 0 (because if B is true, then ~(A→B) is false).
     - After learning not-B, it should be priced at 1.
     - Then the news-weighted average is P(B)*0 + P(~B)*1 = P(~B).
     - But also, the negation of the conditional should be 1 minus the conditional? But then we would have P(~(A→B)) = 1 - P(A→B) = 1 - P(B|A).
     - But from the above, it is also P(~B).
     - So 1 - P(B|A) = P(~B), which again implies P(B|A) = P(B).

   Debrief (20 mins):

     - Map the steps:
          Step 1: P(A→B) = P(B|A)
          Step 2: After learning B, P_{new}(A→B) = 1
                  After learning ~B, P_{new}(A→B) = 0
          Step 3: Current price = E[future price] = P(B)*1 + P(~B)*0 = P(B)
          Step 4: Therefore, P(B|A) = P(B)

     - The key assumption is that the pricing rule (conditional probability) applies not only now but also after learning B or ~B. In other words, the conditional probability of B given A after learning B should be 1, and after learning ~B, it should be 0. This is true, but note that after learning B, the conditional probability P(B|A) is still defined and is not necessarily 1 (because learning B might change their view on A). However, in the activity, we are pricing the conditional ticket as 1 after learning B because we know B is true, so if A is true, the ticket pays 1. But the conditional probability after learning B is P(B|A) under the new distribution, which is 1 only if they are sure that B is true. In fact, after learning B, they are sure of B, so P_{new}(B) = 1, and then P_{new}(B|A) = 1. Similarly, after learning ~B, P_{new}(B|A)=0. So that step is valid.

     - The squeeze therefore is valid. The escape routes are:
          a) Deny that the conditional is a proposition that has a truth value and therefore cannot be priced in the updated worlds. (But then conditional probability might not apply.)
          b) Restrict the application of the conditional probability pricing rule to conditionals whose antecedents are not known to be true or false. (After learning B, we know B is true, so we are not in a state of uncertainty about B, so the rule doesn't apply.)
          c) Deny that the current price must be the expected future price. (But that is just coherence over time.)
          d) Accept the conclusion that no evidence updates your credence in any proposition.

     - The most common escape is to deny that conditionals are propositions that can be believed to a degree or that have truth conditions. Instead, conditionals are not the kind of thing that can be part of a conditional probability in the updated state. This is the view that conditionals are not truth-apt.

   What will go wrong:

     - Two people who know the literature: They might say "This is Lewis's triviality result" or "You are assuming that the conditional probability is defined in the updated state". 
          Handling: Remind them of the rule: no naming authors or results until debrief. Ask them to play along and see what the group discovers.

     - Participant who refuses to price conditionals: They might say conditionals have no truth values, so they won't price them.
          Handling: Say that for the purpose of the activity, we are exploring what happens if we do price them by conditional probability. Ask them to provisionally adopt the pricing rule for the game.

     - Argument about void when antecedent fails: They might say that if A is false, the conditional is true (vacuously), so it should pay 1, not void.
          Handling: Explain that in this activity, we are following the betting setup where the bet is called off if the antecedent is false. This is the way conditionals are often handled in the literature (e.g., de Finetti). We can discuss alternatives in the debrief.

     - If only 8 people: Combine roles. Have 2 pricers, 4 traders, 1 bookkeeper, 1 registrar. The facilitator can help with arithmetic.

   What is missing:

     - The activity shows one instance of the squeeze. The theorem is general: it must hold for every A and B. The group might think they made a mistake in their particular prices. The facilitator should stress that the argument is general and doesn't depend on the example.

     - The activity does not show the full generality of the closure assumption: that the same pricing rule applies in every credence function in the closure of the current one under conditioning on any proposition. In this activity, we only condition on B and not-B.

     - The activity might leave the impression that the conditional probability pricing rule is the issue, but the deeper issue is the assumption that conditionals are propositions that can be believed and updated. In the debrief, make clear that the result challenges the very idea that conditionals express propositions.

  **Facilitator Notes:**

  - Materials: Poker chips (or similar) in two colors (e.g., green and red) for representing B and not-B. Whiteboard and markers. Prize for winner: a toy or certificate.

  - Roles and rules handout (abridged version for the session):

    ```
    Conditional Ticket: 
      - Pays 1 token if A and B, 0 if A and not-B, and void (refund) if not-A.

    Pricers: 
      - Post a price for the ticket now (0 to 10 tokens) as your P(B|A)*10.
      - Also post: if we learn B, you will price it at 10 tokens; if we learn not-B, at 0 tokens.

    Traders: 
      - You can buy or sell the ticket at the pricers' current prices. Try to find inconsistent prices.

    Bookkeeper: 
      - Record trades. 
      - Ask the group for their unconditional P(B) (scale 0 to 10). 
      - Compute: current price should = P(B) [because future price is 10 if B, 0 if not-B].

    Registrar: 
      - Write on whiteboard: 
            Now: [price]
            After B: 10
            After ~B: 0
            Unconditional P(B): [number]
            Therefore, current price should be = P(B)

    ```

  - Timing bell: 90 minutes total.

  - Flow:
    0. (5 min) Introduction and example choice.
    1. (10 min) Pricers post prices.
    2. (10 min) Trading.
    3. (15 min) Bookkeeper computes news-weighted average and reveals the contradiction.
    4. (10 min) Group discussion on the squeeze.
    5. (10 min) Optional: negation round.
    6. (20 min) Debrief.

  - In the debrief, write the steps on the board and the escape routes.

  Honest note: The activity cannot reproduce the full generality of the theorem and the fact that it applies to any partition. We only condition on B and not-B. The participants might think that the issue is specific to conditioning on the consequent. The facilitator must stress that the result is general and that the same would happen for any conditioning event. Also, the activity assumes that after learning B, the conditional probability of B given A is 1, which is correct, but in the general case, we might condition on other things. The closure under any evidence is what forces the conditional probability to be the unconditional one.

   Also, the activity might not convey that the result is a theorem with mathematical certainty, not just an artifact of the example. The group might try to adjust their prices to avoid the contradiction, but the facilitator should note that the argument is independent of the prices.

   Finally, the activity may not highlight that the result is about the impossibility of conditionals being propositions with probabilities. The takeaway should be that if conditionals have truth conditions and we price them by conditional probability, then we are forced into triviality. So either conditionals are not truth-apt or we give up conditional probability pricing, or we accept the triviality.
answer: |-
  ### Facilitator Guide: Lewis's Triviality Result Discovery Session  
  **Goal:** Participants discover Lewis's triviality result through a trading game, concluding that conditional probability pricing forces unconditional credence in the consequent, making evidence irrelevant.  

  ---

  #### **1. Materials, Roles & Rules**  
  **Materials:**  
  - Whiteboard with 4 columns:  
    ```
    | Ticket | Now | If B | If ~B |  
    |--------|-----|------|-------|  
    ```  
  - 140 tokens (10 per participant), 2 jars labeled "B" and "~B".  
  - Prize: "Rationality Champion" certificate (optional: silly item like a rubber chicken).  

  **Roles (14 players):**  
  - **Pricers (3):** Post prices for conditional tickets.  
  - **Traders (8):** Trade tickets at posted prices to exploit incoherence.  
  - **Bookkeeper (1):** Calculates weighted averages publicly using tokens.  
  - **Registrar (1):** Records prices/trades on the whiteboard.  
  - *If 8 players:* 2 pricers, 4 traders, 1 bookkeeper, 1 registrar.  

  **Payoff Scheme:**  
  - Start: 10 tokens each.  
  - Winning: Most tokens after 3 rounds wins the prize.  
  - No real money; tokens represent credit.  

  **Ticket Definition & Pricing Rules:**  
  > *"A conditional ticket on 'If A, then B':  
  > - Pays **1 token** if A and B are true.  
  > - Pays **0 tokens** if A is true and B is false.  
  > - **Void if A is false**: Refund the purchase price.  
  > Price it now at your conditional probability of B given A, scaled 0–10 tokens (e.g., P(B|A)=0.7 → 7 tokens).  
  > After learning B, reprice it at **10 tokens** (since B is true).  
  > After learning ~B, reprice it at **0 tokens** (since B is false)."*  

  **Settlement:**  
  - Trades are binding at posted "Now" prices.  
  - After truth-value revelation:  
    - A∧B: Seller pays buyer 1 token.  
    - A∧~B: Seller pays buyer 0 tokens.  
    - ~A: Refund buyer’s purchase price.  

  ---

  #### **2. Round-by-Round Plan (90 mins)**  
  **Opening (5 mins):**  
  - *Facilitator:* "We’re trading conditional tickets. Pick A and B—e.g., A: 'Barometer drops,' B: 'It rains.' No math jargon; we’re exploring pricing rules."  
  - Group chooses A and B (nudge toward intuitive evidence-consequent pairs like barometer/rain).  

  **Round 1: Initial Pricing (15 mins)**  
  - Pricers post "Now" price for A→B ticket under "Now" column (e.g., 8 tokens).  
  - Registrar records prices.  
  - Traders may challenge: "Why not 5 tokens?" Pricers defend via intuition (not math).  

  **Round 2: Trading & Updating (20 mins)**  
  - Traders buy/sell tickets at posted prices. Bookkeeper records trades.  
  - *Facilitator:* "Now, if we learned B is true, what’s your ticket worth?"  
  - Pricers post 10 under "If B."  
  - *Facilitator:* "If we learned ~B?" Pricers post 0 under "If ~B."  

  **Round 3: News-Weighted Average (20 mins)**  
  - Bookkeeper:  
    1. Asks group: "What’s your unconditional P(B)?" (e.g., 3 tokens).  
    2. Fills "B" jar with 3 green tokens, "~B" jar with 7 red tokens.  
    3. Announces: "Expected future value = (P(B) × 10) + (P(~B) × 0) = 3 tokens."  
    4. Contrasts with "Now" price (e.g., 8 ≠ 3).  
  - *Facilitator:* "Why the mismatch? Must prices be equal to avoid arbitrage?"  

  **Optional Round: Negations (10 mins)**  
  - *Facilitator:* "Price ~(A→B): Pays 1 token if A∧~B, else void."  
  - Pricers post "Now" (e.g., 2 tokens = P(~B|A)).  
  - After learning B: Reprice at 0. After ~B: Reprice at 10.  
  - Bookkeeper: Expected value = P(~B) (e.g., 7 tokens).  
  - *Facilitator:* "Notice: 1 - P(A→B) = 8 ≠ 7. Why does negation break?"  

  **Debrief (20 mins):**  
  - *Do not name "Lewis" or "triviality" until end.*  
  - Map the discovery:  
    | **Game Step** | **Theoretical Step** |  
    |---------------|----------------------|  
    | "Now" price | P(A→B) = P(B\|A) |  
    | Price after B | P₊B(A→B) = 1 |  
    | Price after ~B | P₊~B(A→B) = 0 |  
    | Weighted average | P(A→B) = P(B) |  
  - **Squeeze Point:** "The rule *must* apply to updated credence functions."  
  - **Escape Routes:**  
    - Deny conditionals have truth values (no pricing).  
    - Restrict rule to unlearned antecedents.  
    - Reject closure (updated credences can’t use same rule).  
    - Accept irrelevance: "Barometer doesn’t predict rain."  

  ---

  #### **3. Handling Predictable Issues**  
  **Problem 1: Two Lewis Experts**  
  - *In session:* "Hold the literature. We’re building intuition first. Play along—find flaws in the setup."  
  - *Short version (8 players):* Assign them as traders to exploit "bad" prices.  

  **Problem 2: Refuses to Price Conditionals**  
  - *In session:* "Provisional pricing: What number *feels* fair for the bet? We’ll dissect assumptions later."  
  - *Short version:* Have them co-facilitate; ask "What’s your P(B|A)?" as a credence.  

  **Problem 3: Argument Over Void Truth**  
  - *In session:* "Void = refund. We avoid vacuously true/false debates by refunding. Stick to the rules."  
  - *Short version:* Skip refunds; void = 0 tokens (simplifies to A∧B). Debrief implications.  

  ---

  #### **4. What the Activity Misses**  
  **The Missing Generalization:**  
  - The activity shows *one* contradiction (P(B|A) vs. P(B)), but Lewis proves this *must hold for all* A, B. Participants may think their example-specific prices are "wrong," not the rule.  
  - **Facilitator Note:** Stress: "The argument never used your specific A or B. Try any pair—it always forces P(B|A) = P(B)."  

  **Other Shortcomings:**  
  - **Closure Assumption:** The activity assumes the pricing rule applies seamlessly to updated credences. The theorem’s full force requires this to hold for *any* partition (not just B/~B).  
  - **Truth-Aptness:** Participants may leave blaming "conditional probability pricing" without seeing the core conflict: conditionals can’t be propositions *and* obey P(A→B) = P(B|A).  

  **Supply This Yourself:**  
  > "Lewis’s proof shows no non-trivial probability function can satisfy P(A→B) = P(B|A) for all A, B while updating coherently. One absurdity implies the system is broken—not your intuition."  

  ---

  #### **Facilitator Script Snippets**  
  - **On Pricing:** "Price this ticket as if it’s a fair bet: *if* A happens, how much would you stake on B?"  
  - **On Contradiction:** "You priced at 8 tokens, but the math forces 3. How can you avoid this?"  
  - **Debrief Close:** "Today’s squeeze assumes conditionals are propositions with probabilities. If that’s wrong, what *are* they?"  

  **Printer-Friendly:** Fit this guide on one page (front/back) with whiteboard columns. Use bullet points and bold headers.  

  ---  
  *Result: A self-contained, absurdity-driven discovery of Lewis—with no prerequisites and one rubber chicken at stake.*
