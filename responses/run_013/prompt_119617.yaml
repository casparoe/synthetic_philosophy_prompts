  Most crucially, they demand no "both-sides" compromise. So I'll need to judge: does Strawson survive this onslaught? The SSRI case alone seems nearly fatal - if chemical changes alter responsibility's presence, that reduces morality to biochemistry. And that unfalsifiability problem... it might not be a bug but a feature, yet an unacceptable one.

