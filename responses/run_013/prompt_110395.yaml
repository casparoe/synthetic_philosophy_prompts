  Hmm, this user presents a fascinating pedagogical dilemma about how biographical narratives impart moral force. They've noticed that lives rich in specific, ungainly details—like how someone reacted to a dinner insult or preserved a single letter—profoundly move students, while biographies with explicit moral lessons fall flat. Even when they extract principles from powerful narratives, the extracted generality loses all vitality. 

  The user is clearly deeply read—they reference Plutarch, Victorian biographies, hagiography, and contemporary moral theory—but rejects easy categorization. They've already considered and dismissed several adjacent concepts: New Criticism's heresy of paraphrase, Zagzebski's exemplarism, Aristotelian phronesis, and the hagiographic distinction between imitating deeds vs acquiring disposition. Their frustration with partial fits is palpable. 

  What they're circling is something more primal: the irreplaceable alchemy between concrete narrative and moral transformation. When they ask whether this is about epistemology (how we know the good) or motivation (how we're moved toward it), they're touching on a deep tension in moral psychology. Their classroom evidence suggests particulars operate differently from principles—not as illustrations of rules but as irreducible units of meaning. 

  The phenomenon feels distinct from standard role-model imitation because their students aren't trying to copy behaviors; they're being structurally altered by exposure to idiosyncratic human texture. ("Undid something in her" is such a striking phrase.) It's also more specific than general narrative persuasion because it's about the ungraspable residue that resists summary. 

  I should avoid glib labels. What they need is a conceptual scaffold that: 
  - Honors Plutarch's insight about minor moments revealing character 
  - Explains why moral extraction murders the living essence 
  - Distinguishes this from particularism (which is meta-ethical) 
  - Accommodates cases where principles do motivate (without invalidating the core pattern) 

  The key might lie in the particular's ability to create what Murdoch called "unselfing"—disrupting our conceptual frameworks before we can armor ourselves with generalization. The power isn't in the detail itself but in its resistance to being co-opted by our preexisting moral vocabulary. 

  For terminology, I'll propose "moral saturation" to capture how particulars are drenched in significance that evaporates when distilled. But the user cares more about precise carving than naming—so I'll define its boundaries sharply: it would not apply to biographies where generalized lessons retain transformative power, nor to principles that happen to resonate with personal crises.
answer: |-
  What you're describing is a profound and specific phenomenon that cuts across moral psychology, narrative theory, and pedagogy. It deserves a freshly carved term: **Particular Resonance**. Let me define it, distinguish it from neighboring concepts, and clarify its boundaries.

  ### Core Definition
  **Particular Resonance** is *the phenomenon whereby concrete, non-generalizable details in biographical narratives generate transformative moral or existential force in the reader, which dissipates when those details are abstracted into principles or lessons*. Its mechanisms are:
  1.  **Anti-Generalization**: The power resides in details that resist conceptual packaging (e.g., the specific snub, the singular saved letter).
  2.  **Transformative Force**: It effects a shift in the reader's perception or disposition ("undid something in her"), not just intellectual assent.
  3.  **Extraction Collapse**: The force is destroyed by isolating the "lesson," even if the lesson is true.
  4.  **Non-Imitation**: The effect isn't about copying actions ("give everything away") but an internal reorientation.

  ### Why Established Concepts Don't Fully Capture It
  *   **"The Heresy of Paraphrase" (New Criticism)**: Addresses poetic meaning, not *moral transformation*. Your concern is about lived ethics, not semantic irreducibility.
  *   **Exemplarist Moral Theory (Zagzebski)**: Focuses on *admiration* as the basis for moral concepts. Your students aren't necessarily admiring; they're being *altered* by specific textures of existence, not deriving concepts.
  *   **Aristotelian *Phronesis* (Practical Wisdom)**: Emphasizes judgment of particulars, but assumes a framework of general virtues. Your pattern shows the particular *preceding* and *generating* force independent of a pre-existing framework.
  *   **Hagiographic *Imitatio* vs. *Dispositio***: Distinguishes copying deeds vs. acquiring character. You observe the *dispositio* shift happening via *exposure* to concrete, non-exemplary details, not via instructions for character formation. The specific detail *is* the catalyst, not the saint's overall character as a model.

  ### Addressing Your Specific Questions
  1.  **One Phenomenon or Two?** It's one integrated phenomenon: **Particular Resonance** is *how* narrative particulars perform their unique epistemic *and* motivational work *simultaneously*. The ungraspable detail *shows* (epistemic) a facet of human possibility in a way that *moves* (motivational) by bypassing abstract defenses. The power lies in this inseparability.
  2.  **Epistemic or Motivational?** Both, inseparably. The particular *reveals* a concrete possibility (epistemic) in a way that intrinsically *compels* or *reorients* (motivational). It’s not that we "know the good already"; the particular *constitutes* a new, concrete apprehension of value/meaning that wasn't accessible via abstraction.
  3.  **Would Generalizable Lives or Motivating Principles Falsify It?** No. **Particular Resonance** describes a *primary mechanism*, not the *only* one.
      *   A life that generalizes cleanly *and* moves might work via other mechanisms (e.g., powerful rhetoric, aligning with pre-existing commitments).
      *   A stated principle that moves someone likely resonates with a *previously internalized particular* or aligns with a specific crisis. **Particular Resonance** explains the *foundational* way concrete narratives seed moral understanding/motivation *before* principles gain traction. Its dominance in your seminar highlights its unique potency.
  4.  **Distinction from Neighboring Concepts:**
      *   **(a) Stories persuade where arguments don't**: True, but too broad. **Particular Resonance** specifies *which elements within the story* (non-generalizable particulars) and *what effect* (transformative reorientation, not just persuasion) are key.
      *   **(b) Moral Particularism**: This is meta-ethical (reasons are irreducibly particular). **Particular Resonance** is psychological/pedagogical: *how* exposure to narrative particulars *affects* the agent. Particularism is about *reasons for action*; **Particular Resonance** is about *sources of transformation*.
      *   **(c) Learning by Imitating Role Models**: Imitation focuses on *replicating behaviors* or *emulating an overall character*. **Particular Resonance** is triggered by *specific, often minor details*, and results in *internal change*, not necessarily action-mimicry. Your students aren't trying to *be* the figure; something *in them* is reconfigured.

  ### What **Particular Resonance** Rules Out
  For the term *not* to apply, a case of successful moral learning from a biography would need to exhibit:
  1.  **Abstraction-Dependent Force**: The transformative power resides primarily in the explicitly stated lesson or principle *extracted* from the life, and survives/is enhanced by the act of extraction/generalization.
  2.  **Generalizable Core**: The key elements driving the change are readily translatable into rules, maxims, or virtues without significant loss of potency.
  3.  **Lesson-First Efficacy**: The biography structured around delivering clear "takeaways" demonstrably catalyzes the *same depth* of internal reorientation as the lives rich in resonant, non-generalizable particulars.
  4.  **Imitation as Primary Mechanism**: The learning occurs predominantly through conscious emulation of the subject's major actions or overall character template, rather than being sparked by minor, idiosyncratic details.

  ### The Carving
  **Particular Resonance** emphasizes:
  *   **Particularity**: The irreducible, concrete detail.
  *   **Resonance**: The vibrational, transformative effect on the reader's inner state – not just understanding, but *reverberation* that alters disposition.
  *   **Anti-Extraction**: Its essence is destroyed by translation.

  You are witnessing the power of the *grain* of human existence – the sand that makes the pearl, not the pearl itself. Plutarch was right: the siege reveals the emperor; the dinner snub reveals the *human*. **Particular Resonance** names the alchemy wherein that revelation becomes a quiet revolution within the reader.
