prompt: |-
  ok so I'm in this reading group on collective intentionality and joint action and I have to bring a draft next week, and I'm not sure the central move in it survives contact with anyone who's thought about this harder than me. we've done the usual suspects -- Bratman on shared intention, Gilbert on plural subjects, Searle's we-intentions, Tuomela on the we-mode -- and I'm trying to say something a bit to the side of all of them. draft pasted below, it's short. I'd really like your comments, especially on whether the main move works or whether I've just renamed something.

  **Doing things together without meaning to**

  1. Two flavors. Accounts of joint action tend to come in two flavors. On the *aggregative* view (Bratman is the cleanest version), a joint action is a structure of individual intentions: I intend to do my part, I intend that we do it by way of our doing our parts, I have a matching intention about you, you about me, the whole thing is common knowledge, and the intentions are mutually responsive. On the *unitary* view (Gilbert, and Searle in a different way), the group is a genuine subject: the intention is literally ours, not a bundle of mine and yours, and it doesn't decompose into individual attitudes without loss.

  2. What's wrong with both. Aggregative views struggle with cases where the participants never represent the whole. A rower in an eight doesn't need a representation of the boat's trajectory, and if you insist she does, you've made the account intellectualist in a way that excludes young children, animals, and frankly most of adult life. Unitary views struggle with the fact that the group subject seems *made of* the participants in a way ordinary subjects aren't, and nobody has a good story about how the "we" gets anchored without smuggling the individuals back in.

  3. A third option: role-dependence. Here's the idea. In a lot of joint action, what each participant intends is fixed not by a shared representation but by the *role* she occupies. The rower's intention is something like keep the rate and pull through the finish -- its content is given by her seat, her rigger, the cox's call. The roles, in turn, are constituted by the expectations the others have of whoever fills them. So the content of my intention is fixed by your expectations and yours by mine, but neither of us has to represent the whole. Call this role-dependence. It's a real pattern: crews, surgical teams, jazz rhythm sections, a lot of skilled manual labour.

  4. Why that isn't just aggregation. Aggregation says the group's action is the sum of individual actions plus mutual responsiveness. Role-dependence says something stronger: the individual actions aren't fully specified until you know the role, and the role isn't specified until you know the others' expectations. So there's a constitutive circularity between my action and yours that a sum can't capture. This is supposed to be why a rower's pull is *the boat's* pull in a way that two strangers both yanking on the same rope isn't.

  5. Why that isn't a plural subject. But it also isn't a group mind. Nothing here needs an intention that isn't anyone's. All the intentions are mine and yours; they're just role-indexed. So role-dependence promises a middle path -- genuine togetherness without a super-subject.

  6. The overgeneration problem. Here's where I get worried. If all it takes is that individual intentions are fixed by roles constituted by mutual expectations, then *any* stable equilibrium counts. A traffic jam is role-dependent: I keep my distance because I expect you to keep yours. Everyone pouring out of a burning theatre is role-dependent. A market is role-dependent. And I don't want to say a traffic jam is a joint action. So role-dependence looks necessary but not sufficient.

  7. The fix: accountability. What the traffic jam lacks is accountability. In a genuine joint action each participant is entitled to demand that the others play their roles, and is answerable to them for playing hers. The rower who stops pulling doesn't merely fail to contribute -- she gets called out, and she owes an answer. The driver who tailgates owes nobody an answer; no one is entitled to demand otherwise of him. So the mark of joint action is a mutual structure of entitlement-to-demand and answerability, not a shared mental state.

  8. The worry. Accountability looks like it presupposes exactly what it's meant to explain. To be entitled to demand that you play your role, there has to already be some understanding between us -- which is the joint commitment I was trying to derive. So either accountability is primitive (and I've just renamed Gilbert's joint commitment and lost the middle path), or it's grounded in something else (and I need to know what). I suspect the way out is that entitlement-to-demand is grounded in *reliance* rather than agreement: you've arranged your conduct around my role, so I owe you something. But I can't tell whether that gets me out or just moves the circle.

  ---

  What I want from you: (a) does the accountability condition in §7 actually pick out joint action, or does it over- or under-generate too -- give me a case that breaks it in one direction or the other; (b) is the circularity in §8 fatal, or is there a non-circular grounding for entitlement-to-demand, and if the reliance move works say why, if it doesn't say what it costs; (c) is role-dependence in §3-4 really distinct from the aggregative view, or have I just redescribed mutual responsiveness in fancier clothes. If I have to give something up I'd rather keep role-dependence and drop accountability than the reverse, but tell me what that costs me. Also just tell me if any of it is obviously confused.

  Format: start with your overall verdict in one sentence, then the reasoning, no preamble and don't restate the question.
reasoning: |-
  Okay, the user is in a reading group on collective intentionality and has shared a draft for feedback. They're worried their central idea might not hold up. Let me start by understanding their main argument. They propose "role-dependence" as a middle path between aggregative and unitary views of joint action. Role-dependence means individual intentions are defined by their roles, which are shaped by mutual expectations, without needing a shared representation or a group mind. But they see a problem: role-dependence alone might overgeneralize to things like traffic jams. So they add accountability—mutual entitlement to demand and answerability—as the fix. However, they're concerned this might be circular, either presupposing joint commitment or not being properly grounded.

  First, I need to assess if accountability solves the overgeneration problem. The user gives traffic jams as a non-joint action example. Accountability here would require that drivers aren't entitled to demand others keep distance; there's no mutual obligation. But what about cases like pedestrians avoiding each other on a sidewalk? That might have mutual expectations but still lack accountability. The user might not have considered such edge cases. Also, under-generation: what if a team has accountability but no clear roles? Like friends casually moving a couch without defined roles. Does accountability still hold? That could be a problem if roles are central to their model.

  Next, the circularity issue in §8. The user suggests reliance might ground entitlement without presupposing joint commitment. For example, in rowing, each rower relies on others to pull, creating an obligation. But is reliance sufficient? In a market transaction, both parties rely on each other (buyer pays, seller delivers goods), but it's transactional, not joint action. The user needs to distinguish social reliance from instrumental reliance. Maybe add that the reliance must be part of a cooperative framework, but then that might circle back to joint commitment. The user's reliance move has potential but needs refinement to avoid collapsing into existing theories.

  Then, role-dependence vs. aggregative views. Bratman's mutual responsiveness involves interdependent intentions. Role-dependence adds that intentions are role-indexed, meaning the content is defined by the role within the group. In rowing, "pulling" only makes sense in the context of the boat's structure, whereas two people pulling a rope might have mutual responsiveness but no role system. This distinction seems valid, but the user should clarify how roles differ from Bratman's part intentions. Roles are socially defined positions, not just individual commitments. That could be a key difference.

  The user prefers keeping role-dependence over accountability if needed. If they drop accountability, how do they exclude traffic jams? Maybe by emphasizing that roles must be part of a cooperative enterprise, but that might introduce normativity elsewhere. Alternatively, they could argue that traffic jams lack the structured roles of a rowing team—roles there are ad hoc. But mutual expectations exist in both. Without accountability, distinguishing them becomes harder. The user might need accountability to avoid overgeneration but must address the circularity.

  Overall, the draft's strength is in role-dependence as a genuine alternative. The accountability fix is promising but needs work on grounding. The user should refine reliance by linking it to the costs of reliance or the interdependence of roles. For example, in a rowing team, each role's effectiveness depends on others, creating mutual obligations. This interdependence might ground entitlement without circularity. The user should also address counterexamples and clarify how their view differs from existing theories without reinventing terms.
answer: |-
  **Overall verdict:** Your accountability condition in §7 partially resolves overgeneration but creates new under-generation risks, and while the reliance move for grounding entitlement shows promise, it needs refinement to avoid collapsing into existing views or circularity; role-dependence is distinct from aggregation but requires sharper articulation to avoid assimilation.

  **Reasoning:**  
  **(a) Accountability’s scope:** It successfully excludes traffic jams (no mutual entitlement to demand compliance) and markets (transactional reliance lacks answerability for role-performance). However, it *under-generates* for *implicit joint actions*: e.g., two strangers silently coordinating to lift a heavy object off a third person. They rely on each other’s actions, feel entitled to complain if one slacks, and are answerable—yet lack predefined roles or explicit agreement. Accountability also *over-generates* in *hierarchical non-joint actions*: e.g., a soldier following orders due to institutional authority (entitled to demand her sergeant’s commands, answerable to him), but this feels distinct from shared agency.  

  **(b) Circularity and reliance:** The reliance move *can* work without presupposing Gilbert-style joint commitment if you emphasize *costly interdependence*: when others’ reliance on your role-performance materially shapes their actions/outcomes (e.g., rowers’ efforts are wasted if one stops), entitlement arises from the *real stakes of reliance*, not prior agreement. In the traffic jam, drivers don’t *depend* on each other’s specific role-performance (only general compliance); in rowing, a rower’s wasted effort grounds her entitlement to demand others pull. This avoids circularity but *costs* universality—it excludes low-stakes collaborations (e.g., friends humming a tune together) where accountability exists despite minimal reliance costs.  

  **(c) Role-dependence vs. aggregation:** Your view is distinct. Bratman’s mutual responsiveness is *content-neutral*: individuals intend "I do P for J" where J is the joint goal *independently specified*. Role-dependence makes intention-content *role-constituted*: "I do [action defined by Seat 3’s duties]" where the action lacks meaning outside the role-structure. Aggregation sums pre-defined individual actions; role-dependence makes individual actions ontologically dependent on the relational role-system. This captures the "constitutive circularity" (§4) Bratman lacks—e.g., a cox’s "call" is only a *cox’s call* within the crew’s role-architecture.  

  **Trade-offs if dropping accountability:** Without §7, role-dependence overgenerates to traffic jams. To salvage it, you’d need to argue that roles in *genuine* joint action are *teleologically unified* (e.g., rowing roles share a goal; traffic roles are self-focused). But this risks collapsing into Searle’s "we-intentions" or Bratman’s shared goal requirement, losing your "no shared representation" edge. Role-dependence is your core innovation—refine it by stressing that roles must be *functionally integrated* (not just mutually expected) to exclude jams, then pair it with your reliance-based accountability to cover edge cases.  

  **Confusion check:** No obvious confusion, but §3’s "role" needs tightening: clarify that roles are *normatively structured positions* (e.g., "stroke seat" carries obligations), not just de facto expectations, to avoid reducing to mere behavioral regularities.  

  **Recommendation:** Keep both role-dependence and accountability, but ground entitlement in *interdependence-through-reliance*. Stress that roles must be *cooperatively interdependent* (not just mutually expected) to exclude jams, and use accountability to handle edge cases like the implicit object-lifting example. This preserves your middle path.
