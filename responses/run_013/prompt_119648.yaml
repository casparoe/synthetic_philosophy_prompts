        "kind": "one of: case / intuition / conceptual / formal / rival comparison",
        "targets": "one of: necessity / sufficiency / non-arbitrariness / the unifying relation / cost profile against rivals",
        "statement": "two to four sentences stating the defeater as sharply as it can be stated",
        "severity": "one of: fatal / serious / awkward / toothless",
        "defender_concedes": true or false,
        "concession_note": "if true, exactly what is conceded; if false, why the defender is entitled to refuse",
        "best_reply": "one to three sentences, or 'none available'",
        "status": "one of: decisive as things stand / needs evidence, and what evidence / settled against the defeater"
      }
    ],
    "verdict": {
      "insulation": "one to three sentences on whether the view absorbs everything above or has quietly retreated",
      "most_dangerous": "the id of the single worst defeater",
      "advantage_over_rivals": "one to three sentences on what my view gets that unrestricted and nihilistic answers do not",
      "what_would_settle_it": "what observation, case, or argument would genuinely decide the matter for me",
      "bottom_line": "two sentences, no hedging, on how much of the view survives"
    }
