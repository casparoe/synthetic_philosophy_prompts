answer: |-
  ### The Conceptual Knot in Resemblance Nominalism  
  **Core Circularity Worry**:  
  Resemblance nominalism defines properties via resemblance—e.g., the class of red things exists because all members resemble each other. But resemblance is always *in a respect* (color, shape, etc.). If we say "A and B resemble each other **in color**," the respect ("color") functions as a universal: it is a repeatable, shared feature. To avoid this, your classmate suggests reducing respects to further resemblance classes. For example:  
  - "Resemblance in color" = membership in the class of color-resembling things.  
  - "Color-resembling things" = things resembling each other under a *further* respect (e.g., hue).  

  **Why this postpones but does not solve the problem**:  
  1. **Infinite Regress**: Each "respect" (e.g., hue) must itself be defined by resemblance in yet another respect (e.g., wavelength). This chain never terminates in a grounding fact.  
  2. **Vicious Circularity**: To form the initial resemblance class (e.g., red things), we must presuppose which resemblances matter—but that presupposes a prior property (e.g., color) to isolate relevant resemblances. Resemblance alone cannot distinguish "red-resemblers" from "round-resemblers" without implicitly invoking the very property we aim to define.  

  **Promising Nominalist Replies**:  
  - **Primitive Resemblance**: Resemblance is a fundamental, unanalyzable relation. We perceive that apples resemble each other *simpliciter*—no "respect" needed. (But this risks making resemblance mysterious and subjective.)  
  - **Natural Properties** (à la David Lewis): Resemblance is objectively grounded in fundamental physical similarities, avoiding arbitrariness. (Yet this concedes that properties are "natural," edging toward realism.)  
  - **Resemblance as Partial Identity** (Trope Theory): Objects resemble because they share numerically distinct but qualitatively identical tropes (e.g., each red object has its own "redness" trope, and resemblance arises from trope similarity). (This avoids universals but faces its own challenges, e.g., accounting for exact resemblance.)  

  ---

  ### The "Borrowed Resemblance" Puzzle  
  **Question**: Can a collection of objects exhibit pairwise resemblance without sharing a single common property?  

  **Concrete Example**:  
  Imagine three objects:  
  - **A**: Red circle  
  - **B**: Red triangle  
  - **C**: Blue circle  
  Now consider pairwise resemblances:  
  - A and B resemble in **color** (both red).  
  - A and C resemble in **shape** (both circles).  
  - B and C resemble in... *nothing intuitive*.  
  To ensure **all pairs** resemble, modify the example:  
  - **A**: Red circle  
  - **B**: Red triangle  
  - **C**: *Blue* triangle  
  Then:  
  - A and B resemble in **color** (red).  
  - B and C resemble in **shape** (triangles).  
  - A and C resemble in... **having no shared property**.  

  **Crucial refinement**: Add a *fourth* object to create a resemblance chain:  
  - **A**: Red circle  
  - **B**: Red triangle  
  - **C**: Blue triangle  
  - **D**: Blue circle  
  Now:  
  - A resembles B (color)  
  - B resembles C (shape)  
  - C resembles D (color)  
  - D resembles A (shape)  
  - *But* A and C share no property, nor do B and D.  
  **Problem**: Pairwise resemblance holds for *adjacent* pairs (A-B, B-C, C-D, D-A), but not for all possible pairs (e.g., A-C, B-D).  

  **True pairwise resemblance without shared property**:  
  Take three objects with *overlapping but divergent* features:  
  - **A**: Red and heavy  
  - **B**: Red and light  
  - **C**: *Green* and heavy  
  Then:  
  - A resembles B in **color** (both red).  
  - A resembles C in **weight** (both heavy).  
  - B resembles C in... *nothing*.  
  **Solution**: Exploit asymmetrical resemblances:  
  - **A**: Red circle  
  - **B**: Red star  
  - **C**: *Blue* star  
  - **D**: Blue circle  
  Now define a property **F**: "belongs to the set {A,B,C,D}."  
  - For any pair, they resemble *in some respect*:  
    - A-B (color), A-D (shape), B-C (shape), C-D (color), A-C (no direct resemblance? See below).  
  **Issue**: A (red circle) and C (blue star) share *no obvious respect*.  

  **Final maneuver**: Suppose resemblance is **holistic** or **disjunctive**. If nominalism allows:  
  > "X resembles Y" iff X and Y share *at least one* first-order property (e.g., color, shape).  

  Then in the set {A, B, C, D}:  
  - A resembles C via the disjunctive property "red-or-star-shaped" (A is red, C is star-shaped).  
  - All pairs resemble, but **no single property is shared by all**.  
  - The resemblance class is unified only by overlapping resemblances.  

  **What this shows**:  
  Resemblance nominalism *overgenerates* properties. The definition counts such a collection as a "property" (all members pairwise resemble), but intuitively, there is no genuine shared feature—only a network of dyadic resemblances. This violates the intuition that properties (like "red") require *commonality*, not just pairwise similarity.  

  ---

  **Bottom line**:  
  The deepest conceptual problem for resemblance nominalism is that it cannot ground the *unity* of properties without implicitly relying on universals—either by smuggling in "respects" as shared attributes or by failing to explain why resemblance clusters cohere objectively.
