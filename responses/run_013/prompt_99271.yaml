  ### Opinion on the Elias Wren Monument  
  **To the Members of the Public Memory and Art Commission:**  

  After thorough deliberation applying our adopted rubric to the contested statue of Elias Wren, I recommend **accepting the artist collective’s counter-monument in place of an interpretive plaque**, with conditions outlined below.  

  #### **Rubric Categorization: Case (c)**  
  The statue falls under category **(c)**: the honor was unobjectionable when conferred (Wren’s 1911 philanthropy for the library and orphan school) but now functions to celebrate wrongdoing due to evolving societal awareness. The bas-relief—showing Wren leading children—once symbolized charitable benevolence. Today, however, it unavoidably evokes his role in forcibly separating children from families via the residential institution he lobbied to expand. This shift in public interpretation, fueled by contemporary scrutiny of systemic harm, means the monument now implicitly celebrates actions we condemn. Retaining it without intervention would passively endorse a narrative that obscures trauma under the guise of charity.  

  #### **Rejection of the Prospective Test**  
  Commissioner [Name]’s prospective test—focusing solely on what the monument teaches future generations—offers a valuable lens. It rightly prioritizes pedagogy over historical intent. However, it risks oversimplification by divorcing the monument from its tangible ties to community trauma. The statue’s physical presence and bas-relief inherently convey a heroic narrative; without contextualization, it teaches resignation to oppressive histories. Our rubric, by contrast, acknowledges that the artifact’s *current function* is shaped by both its form and modern consciousness, allowing us to address harm while preserving educational value. The counter-monument bridges these concerns: it transforms the site into an active lesson on complicity without erasing history.  

  #### **Strongest Counterargument and Reply**  
  - **Counterargument for removal**: "Relocating the statue to the museum is the only way to sever its harmful public symbolism and center marginalized voices traumatized by Wren’s policies."  
  - **Reply**: While removal honors present-day sensitivities, it forfeits a critical opportunity for public reckoning. The counter-monument—unlike relocation—forces daily engagement with ambiguity, using art to interrogate power dynamics in the very space where Wren’s legacy was uncritically celebrated.  

  #### **Recommendation Conditions & Timeline**  
  We accept the counter-monument contingent on:  
  1. **Community co-design**: The artist collective collaborates with Indigenous and affected diaspora communities (e.g., those impacted by residential institutions) to refine the counter-monument’s form and message.  
  2. **Integrated interpretation**: A permanent plaque is added *adjacent to* (not on) the existing pedestal, detailing:  
     - Wren’s philanthropic deeds.  
     - His role in family separations and the harms of institutionalization.  
     - The counter-monument’s purpose as a critique of historical narratives.  
  3. **Lighting/safety protocol**: Ensure the shadow effect (at noon) is visible year-round without obstructing pedestrian access.  
  **Implementation deadline**: Installation complete by **November 30, 2024** (6 months post-vote).  

  #### **Conclusion**  
  The counter-monument resolves the tension between remembrance and justice. It neither hides Wren’s past nor venerates it but repurposes the monument to model accountability. By accepting this option, we fulfill the rubric’s mandate for context-driven solutions while answering the prospective test’s call for transformative education.  

