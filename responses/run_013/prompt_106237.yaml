  **OFFICE OF STANDING TO BLAME (OSB) | FORM OSB-01: APPLICATION FOR BLAME AUTHORIZATION**

  **PURPOSE:** To determine the eligibility of an individual (the "Applicant") to formally attribute fault or censure to another individual (the "Subject") for a specific act or omission (the "Incident"), pursuant to the Moral Accountability & Standing Act (MASA), § 7-22C.

  **INSTRUCTIONS:** Complete all sections in full. Incomplete applications will be rejected without review. Submit supporting documentation as specified. False statements are punishable by forfeiture of standing privileges for a period not less than 18 months (MASA § 12-5A).

  **SECTION 1: APPLICANT INFORMATION**
  *   1.1 Full Legal Name:
  *   1.2 OSB Registration ID (if applicable):
  *   1.3 Current Standing Grade (Select one): ☐ Unassessed ☐ Provisional (Grade 3) ☐ Standard (Grade 2) ☐ Enhanced (Grade 1) ☐ Revoked/Suspended
  *   1.4 Evidence of Current Standing: Attach copy of most recent OSB Standing Certificate OR Form OSB-04: Declaration of Standing Status (if unassessed or Provisional).

  **SECTION 2: SUBJECT INFORMATION**
  *   2.1 Subject's Full Legal Name:
  *   2.2 Subject's Known OSB Registration ID (if known):
  *   2.3 Nature of Relationship to Applicant (e.g., Co-habitant, Colleague, Blood Relative (specify degree), Contractual Obligor, Stranger, etc.):

  **SECTION 3: INCIDENT DETAILS**
  *   3.1 Date and Time of Incident (UTC):
  *   3.2 Location of Incident:
  *   3.3 Precise Description of Act/Omission Constituting Blame:
  *   3.4 Evidence Supporting Occurrence of Incident: Attach relevant documentation (e.g., timestamped photographs, notarized witness statements (Form OSB-07W), service records, logs). *Circumstantial evidence requires corroboration.*

  **SECTION 4: STANDING CATEGORY REQUESTED**
  *(Select one category per application. Standing is incident-specific.)*
  *   ☐ **Category A (Direct Harm):** Applicant is primary victim of the Incident. *Evidence Required:* Demonstrable causal link between Subject's act/omission and direct, quantifiable harm suffered by Applicant (e.g., property damage invoice, medical report).
  *   ☐ **Category B (Fiduciary/Contractual):** Applicant possesses a recognized duty of care or oversight relative to the Subject concerning the domain of the Incident. *Evidence Required:* Copy of relevant contract, organizational charter, or legal guardianship order specifying duties.
  *   ☐ **Category C (Moral Community):** Applicant and Subject share membership in a defined group where mutual accountability norms exist, and the Incident violates core group principles. *Evidence Required:* Charter/Constitution of the group & proof of active membership for both parties. *Excludes ad-hoc groups.*
  *   ☐ **Category D (Rectificatory):** Applicant seeks standing solely to facilitate restitution for harm caused to a third party by the Subject, where said third party cannot act. *Evidence Required:* Proof of third party incapacity & formal delegation of rectificatory authority to Applicant (Form OSB-09R).
  *   ☐ **Category E (Public Interest):** Incident poses demonstrable, significant risk to public welfare, and existing authorities lack capacity/standing to address it. *Evidence Required:* Impact assessment report & proof of exhaustion of other reporting avenues.

  **SECTION 5: APPLICANT'S RELEVANT HISTORY (Re: Standing)**
  *   5.1 Has Applicant committed a substantially similar act/omission to the Incident within the last 36 months? ☐ Yes ☐ No
      *   *If Yes:* Provide date(s), description, and evidence of mitigation/restitution undertaken. Attach Form OSB-08H: Hypocrisy Mitigation Disclosure.
  *   5.2 Is Applicant potentially complicit in the circumstances leading to the Incident? (e.g., enabled conditions, derived benefit, failed preventative duty) ☐ Yes ☐ No
      *   *If Yes:* Estimate degree of complicity (1-100%) and justify. Attach evidence of mitigating actions taken *prior* to Incident.
  *   5.3 List any current suspensions or forfeitures of Applicant's standing privileges (provide OSB Case #):
  *   5.4 Does Applicant possess Inherited Standing relevant to this Subject/Incident type? ☐ Yes ☐ No
      *   *If Yes:* Attach certified copy of Instrument of Standing Transfer (Form OSB-11T) and proof of lineage/designation validity.

  **SECTION 6: DECLARATION**
  I affirm under penalty of perjury (MASA § 12-5B) that the information provided is true and complete to the best of my knowledge. I understand that authorization to blame is non-transferable and incident-specific. I consent to OSB auditing my Infraction Ledger (OSB Registry Sec. 8) for standing assessment.
  *   Applicant Signature: _________________________ Date: ___________

  ---

  **OFFICE OF STANDING TO BLAME (OSB) | FREQUENTLY ASKED QUESTIONS (FAQS)**

  1.  **Q: What is "Standing to Blame"?**
      A: Standing is the administrative permission granted by the OSB, based on criteria established in MASA, authorizing a specific individual (Applicant) to formally level blame against another specific individual (Subject) for a specific act or omission (Incident). It is distinct from the factual validity of the blame itself, which is not determined by the OSB.

  2.  **Q: Why do I need OSB authorization to criticize someone?**
      A: Unauthorized blame constitutes a Moral Hazard Infraction (MHI) under MASA § 3-1, potentially incurring standing penalties against the unauthorized blamer. Authorization ensures blame is voiced only by parties whose relationship to the Subject and Incident, and personal moral record, meet statutory thresholds, preventing hypocritical, vexatious, or destabilizing censure.

  3.  **Q: Does Category A (Direct Harm) standing require me to be blameless?**
      A: Not inherently. However, significant unresolved hypocrisy regarding acts *substantially similar* to the Incident (see Sec. 5.1) typically results in denial or downgrading of standing (e.g., from Grade 1 Enhanced to Grade 2 Standard), unless compelling mitigation is demonstrated via Form OSB-08H. Complicity (Sec. 5.2) also reduces standing eligibility proportionally.

  4.  **Q: Can standing be lost?**
      A: Yes. Standing is automatically suspended for 6 months upon the Applicant's commission of any act classified as a Major Infraction (MASA Schedule 2). Standing is forfeited upon conviction for a Blameworthy Act involving malice or deceit. Suspended standing may be reinstated early via Form OSB-10R: Petition for Reinstatement with Demonstrated Remediation. Forfeited standing requires reapplying after 5 years with full evidence of rehabilitation.

  5.  **Q: Can I authorize someone else to blame on my behalf?**
      A: Limited transfer is possible. Category A standing holders may delegate blame authority *for that specific Incident only* via Form OSB-11T: Instrument of Standing Transfer, filed with the OSB within 7 days of Incident. The transferee must meet basic standing requirements (Grade 3 or higher). Standing itself (as a capacity) is non-transferable; only incident-specific authorization can be delegated.

  6.  **Q: What about inherited standing?**
      A: Standing *as a capacity* (i.e., Grade level) is heritable only in specific, pre-registered familial or institutional successions governed by MASA § 9-3, requiring prior OSB approval of the succession instrument. Incident-specific authorization is never inherited.

  7.  **Q: I believe the OSB wrongly denied my application. Can I appeal?**
      A: Yes. Denials may be appealed to the Standing Review Board (SRB) within 30 days using Form OSB-15A: Notice of Appeal, specifying grounds (e.g., procedural error, new evidence, misinterpretation of complicity percentage). SRB decisions are final.

  8.  **Q: Who grants the OSB its standing to adjudicate other people's standing? Doesn't this lead to an infinite regress?**
      A: The OSB derives its foundational standing from the Moral Accountability & Standing Act (MASA) itself, enacted by the legislature possessing inherent democratic mandate (Constitution, Art. IV). This statutory authorization satisfies the primary standing requirement for the OSB's function. Internal OSB adjudicator standing is maintained through rigorous adherence to procedure (MASA § 15-7), regular ethics audits (Form OSB-20E), and the principle of Collective Functional Purity (MASA § 1-2). Concerns about regress are deemed operationally resolved per MASA § 1-2, Note 3. Appeals regarding OSB officer standing must be filed with the Judicial Oversight Committee (JOC), not the SRB.
