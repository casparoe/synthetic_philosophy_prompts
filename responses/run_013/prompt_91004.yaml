answer: |-
  Here is the exam question, model answer, and marking scheme designed to meet your specifications:

  **Exam Question (to be handed to students):**

  > **TELEOSEMANTICS AND THE CINDER MOTH**
  >
  > Consider the fictional **cinder moth**:
  > *   Ancestrally, it possessed a specialized organ sensitive to Earth's magnetic field. The output state of this organ (call it state M) reliably caused northward flight during migration, leading moths to a specific breeding ground. This behaviour was selected for.
  > *   The ancestral breeding ground has been destroyed (e.g., paved over). Moths no longer reach it.
  > *   Currently, state M continues to be triggered by the local magnetic field. However, instead of sustained flight, state M now causes the moth to settle onto nearby warm masonry surfaces (e.g., brick walls, chimneys) during cold nights. This settling behaviour is what now keeps the moths warm and viable; they would perish without it. The magnetic field remains the proximal trigger.
  >
  > **Present-Tense Teleosemantics (PTT)** is a proposed theory stating that a state's representational content is fixed *solely* by the **current tracking function** that state performs in maintaining the system's *ongoing* viability. Content is determined by what the state tracks *while* contributing to the system's *present* regulation and survival. PTT explicitly rejects appeals to evolutionary history, selection history, or learning history.
  >
  > **Answer all parts:**
  > 1.  What would state M represent according to **(a) Selectionist Teleosemantics (e.g., Millikan)** and **(b) Indicator Semantics (e.g., Dretske)**? Explain *why* for each, citing relevant features of the theories. (5 marks)
  > 2.  What would state M represent according to **Present-Tense Teleosemantics (PTT)**? Explain *why*. (5 marks)
  > 3.  Critically evaluate PTT in light of the cinder moth case and teleosemantic principles. Your evaluation *must* address:
  >     *   Whether PTT can adequately account for the possibility of **misrepresentation** in state M. (5 marks)
  >     *   The problem of defining "**normal conditions**" for PTT without relying on history. (5 marks)
  >     *   Given that Selectionism and PTT yield different verdicts about M's content in this case, argue which verdict is more plausible and why. Should teleosemantics ultimately rely on historical function, present function, or something else? Briefly suggest what a viable "something else" (a *recruited function*) might require to avoid collapsing into purely historical or purely present-tense notions. (5 marks)
  >
  > *(Total: 25 marks)*

  ---

  **Model Answer (Strong Student, ~750 words):**

  **1. Representation in Selectionist and Indicator Teleosemantics:**

  (a) **Selectionist Teleosemantics (Millikan-style):** State M represents **magnetic north** (or the ancestral migratory destination direction *via* magnetic north). The core principle here is that content is fixed by the *selected proper function* of the state-producing mechanism. The mechanism producing M was selected *for* causing northward flight *to the specific breeding ground* because this led to reproductive success in ancestors. Its function is to orient flight north. The fact that M is currently triggered by magnetism and leads to settling on warm masonry is irrelevant to its selected function; this is a new effect, not what it was selected *for*. Therefore, M represents the condition (magnetic north/bearing to destination) that its successful performance historically tracked. If a malfunction causes M to fire when the magnet isn't north, or if the moth flies south, that's misrepresentation or malfunction relative to its historical function.

  (b) **Indicator Semantics (Dretske-style):** State M represents the presence of a **specific local magnetic field configuration** (the proximal stimulus it is reliably caused by). Dretske focuses on the state's informational/causal covariance during the *learning period* or period where the indicator function was established. While Dretske often talks about functions, the core content is tied to reliable indication. In the ancestral past, M reliably indicated magnetic north because that's what caused it *and* this indication was recruited (via selection) for controlling flight. Crucially, for Dretske, the content is fixed during this "recruitment" period. Once fixed, it doesn't change based on current covariance. M *still* covaries with the local magnetic field, but its content is likely fixed as indicating *magnetic north* (the condition it indicated during its recruitment/selection period for controlling migration), not the new effect (warm masonry). A malfunction would occur if M fires without the specific magnetic trigger it was recruited to indicate.

  **2. Representation in Present-Tense Teleosemantics (PTT):**

  According to PTT, state M represents the **presence of a suitable warm resting site** (or perhaps the *condition that settling behaviour is beneficial*). PTT defines content solely by the state's *current* role in maintaining viability. Currently, when state M is triggered (by the magnetic field), it initiates settling behaviour on warm masonry. *This* behaviour is what *currently* keeps the moth viable; it is the crucial contribution M makes to the moth's *ongoing* regulation and survival. The system *currently depends* on M triggering this settling response to cold for survival. Therefore, M represents the condition its successful performance *currently* tracks while contributing to viability – roughly, the presence of a suitable warm spot to settle on. The historical trigger (magnetism) and the historical function (migration) are irrelevant. Content is defined by the current causal role in sustaining life.

  **3. Critical Evaluation of PTT:**

  **(i) Misrepresentation in PTT:** PTT faces a severe problem with misrepresentation. If content is fixed by what the state *currently* tracks while contributing to viability, then whenever the state fires and the system *continues* to be viable (which it must, for the state to have a current function), it seems the state has *succeeded* in tracking its content. Imagine state M fires in response to an anomalous magnetic field *not* near any warm masonry. The moth settles on cold ground and freezes. For PTT, what was M's content? If M's current function is to initiate settling that finds warmth, then in this case, it failed to fulfill its function: the moth died. But did M *misrepresent*? PTT struggles to say *what* it misrepresented. It tracked *something* (the anomalous field) and initiated its current function (settling), but the outcome was lethal malfunction. PTT lacks the resources to say M represented "warmth here" falsely. It can only say the state malfunctioned in performing its current survival role. It collapses misrepresentation into mere malfunction. True misrepresentation requires the state to carry specific content that fails to match the world *even when the state is operating as per its function specification*. PTT's purely present-tense function lacks the normative historical specification needed for this distinction.

  **(ii) The "Normal Conditions" Trap:** PTT cannot coherently define "normal conditions" without smuggling in history. To say M *currently* functions to track warmth-via-settling, we must assume certain background conditions hold – e.g., that masonry is present and warm, that moths are in a cold environment needing warmth, that settling behaviour *can* lead to warmth. But *why* are *these* the "normal" conditions defining the current function? PTT's answer seems circular: these are the conditions under which the current behaviour *does* contribute to viability. But this makes "normal" just "whatever conditions happen to prevail now when the behaviour works." If conditions change drastically (e.g., masonry becomes scorching hot), does M's content change instantly to "dangerous heat"? This leads to instability. The only non-circular way to define the *specific* normal conditions relevant to a function's success is to reference the conditions under which the function *was stabilized* – i.e., its history (evolutionary or learning). PTT explicitly rejects this, leaving it without a principled basis to determine what the state is *supposed* to be tracking *as part of its current function*.

  **(iii) Historical vs. Present-Tense & Recruitment:** The cinder moth starkly reveals the divergence between historical and present-tense functions. Selectionism plausibly holds that M represents magnetic north because that's what its mechanism was shaped by selection to detect for navigation. PTT points to the current survival value of the settling behaviour triggered by M. The historical verdict is more compelling for explaining representational *specificity* and the *possibility of error*. M still uses magnetism as input; its internal processing hasn't fundamentally changed. The moth isn't *detecting* warmth with its magnetic organ; it's exploiting a new *consequence* of an old response. Calling M a representation *of warmth* mislocates the content at the input level. The organ's output state is causally sensitive to magnetism, not temperature. Its historical function as a magneto-detector persists internally, even if the behavioural output now has a new survival value. Teleosemantics should prioritize historical function for core representational content.

  However, the case highlights the potential for *functional recruitment*. Perhaps over many generations, if settling via magnetism becomes the new selected function, M's content *could* shift. A viable notion of "recruited function" must avoid collapsing into either pure history or pure present-tense. It likely requires a *stabilizing history*, but one that is *ongoing* or *recent*. Maybe a function is "recruited" if a structure is *currently maintained* (e.g., by selection, learning, or active regulation) *because of* its current effects. This injects a historical dimension (the *because of* relation requires a causal history of maintenance-for-effect) but ties it tightly to the *current* reason the structure exists/persists in the system. For the cinder moth, if the settling behaviour is *not yet* the reason the magnetic organ persists (it might just be a lucky accident), then recruitment hasn't occurred. If natural selection *starts* acting to preserve the organ *for* its warmth-finding role, then a new function (and potentially new content) could emerge. This avoids the instability of PTT while allowing for functional change grounded in a (potentially recent) stabilizing history.

  ---

  **Marking Scheme (Out of 25)**

  **Award marks based on the quality of argumentation, understanding of theories, and engagement with the case. Defensible alternatives are noted.**

  **Part 1: Selectionist & Indicator Verdicts (5 marks)**
  *   **(a) Selectionist (2 marks):** Correct verdict (M represents magnetic north / ancestral destination direction). Explanation must cite *selected proper function* based on *evolutionary history*. [Common Error: Saying it represents warmth because that's current benefit; Missing historical selection basis].
  *   **(b) Indicator (3 marks):** Correct verdict (M represents magnetic north / specific magnetic condition). Explanation must cite reliable indication *during the learning/recruitment period* and that content is fixed then. Must distinguish current indication from fixed content. [Common Error: Saying it represents whatever it currently indicates (magnetism); Confusing with PTT; Not mentioning fixation period]. *Defensible Alternative: Argue content is fixed as magnetism simpliciter if recruitment period interpretation is strict. (Still worth marks if argued well).*

  **Part 2: PTT Verdict (5 marks)**
  *   **(5 marks):** Correct verdict (M represents warmth / suitable resting site / condition settling is needed). Explanation must clearly link content *solely* to the *current causal role* in maintaining *ongoing viability* (settling on warm masonry saves it *now*). Must explicitly *exclude* history. [Common Error: Mentioning history; Saying it represents magnetism because that's the current trigger (fails to see PTT's focus on survival *consequence*)].

  **Part 3: Critical Evaluation (15 marks)**
  *   **(i) Misrepresentation (5 marks):**
      *   (3 marks) Identifies the problem: PTT collapses misrepresentation into malfunction. Explains that if the system survives, the state succeeded; if it dies, the state malfunctioned, but PTT struggles to specify *what* was misrepresented. [Common Error: Only says PTT allows misrepresentation without explaining the collapse; Assumes PTT can easily define misrepresentation].
      *   (2 marks) Contrast with historical theories: Highlights that misrepresentation requires a specific content norm derived from history, which PTT lacks. [Common Error: Doesn't connect the problem back to the lack of history in PTT].
  *   **(ii) Normal Conditions (5 marks):**
      *   (3 marks) Identifies the trap: Defining "normal conditions" circularly as whatever allows the current behaviour to work, lacking specificity. Explains instability (content changes with environment). [Common Error: Mentions "normal conditions" but doesn't explain why it's a problem for PTT specifically].
      *   (2 marks) Explains necessity of history: Argues that only historical stabilization (selection/learning) provides a non-circular, specific definition of the relevant normal conditions for a function. [Common Error: Saying PTT could just use "current normal conditions" without seeing the circularity].
  *   **(iii) Historical vs. Present & Recruitment (5 marks):**
      *   (2 marks) Takes a Principled Stance: Clearly argues *which* verdict (historical or PTT) is more plausible for the moth *and why* (e.g., historical explains input sensitivity & error potential; PTT mislocates content). [Common Error: Saying both are valid; Not justifying the choice].
      *   (3 marks) Recruitment Proposal: Suggests a notion of "recruited function" that avoids pure history/present collapse. Must involve a *stabilizing history* tied to *current maintenance* (e.g., "currently maintained *because of* its current effects via selection/learning/regulation"). [Common Error: Just restating PTT ("current effect"); Just restating historical ("ancestral effect"); Being overly vague]. *Defensible Alternative: A strong argument for a different resolution (e.g., pluralism) or a different recruitment mechanism (e.g., learning-based in individuals) is acceptable if well-reasoned.*

  **Top Answer (A/A+):** Hits all key points above with clear, precise, and well-structured arguments. Demonstrates deep understanding of the theories' principles and their application to the novel case. Anticipates and counters potential weaknesses. The recruitment proposal is thoughtful and non-collapsing.
  **Good Answer (B):** Gets most key points right but may have minor omissions or less depth in explanation (e.g., states the misrepresentation problem but doesn't fully contrast with historical theories; gives a basic but not fully developed recruitment idea). Arguments are generally sound.
  **Adequate Answer (C):** Identifies basic verdicts for each theory but explanations are superficial or contain significant errors (e.g., confuses selectionist and indicator; misunderstands PTT's core claim). Evaluation sections address the prompts weakly or with major misunderstandings.
  **Below C:** Fails to correctly apply theories to the case, exhibits fundamental misunderstandings of teleosemantic concepts, or fails to address significant parts of the question.
