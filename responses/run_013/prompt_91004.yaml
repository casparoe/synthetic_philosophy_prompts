  The user's proposed approach involves inventing "present-tense teleosemantics" (PTT) and a fictional "cinder moth" case where historical and current functions diverge. The moth's magnetic organ originally evolved for migration but now helps it find warm masonry. 

  Key requirements emerge: The question must force students to analyze all three frameworks (selectional, indicator, PTT) on this new case. It should highlight PTT's flaws regarding misrepresentation and normal conditions. Students must take a principled stance on the historical vs present-tense conflict and suggest what a "recruitment-style" function might entail. 

  For the question design, it needs to be concise enough for 40 minutes but rich in conceptual traps. The model answer should demonstrate: 
  - Clear differentiation of the three frameworks' verdicts 
  - Exposure of PTT's inability to handle misrepresentation without smuggling in history 
  - Recognition that "normal conditions" becomes circular in PTT 
  - A defense of historical functions with acknowledgment of edge cases 
  - A sketch of how recruited functions might avoid historical/present binaries 

  Common pitfalls to penalize include: conflating frameworks, missing the misrepresentation problem in PTT, uncritically accepting "current viability" as sufficient, or failing to engage the historical/present tension. 

  The marking scheme must explicitly reward: 
  1) Accurate framework applications 
  2) Critical analysis of PTT 
  3) Resolution of the historical/present conflict 
  4) Innovation in theorizing recruited functions 

  Points where alternative arguments deserve credit: defending present-tense approaches for certain systems, or proposing different solutions to the "recruitment" problem. 

