  **Form & Function (Brief):**  
  The pantoum's recurring lines embody the looping effect: each return shifts meaning through new context, mirroring how a clinical label reshapes a person's experience, and how that lived experience, in turn, reshapes the clinical understanding and criteria. Using DID as the example makes this dynamic historical shift concrete. The final, quiet swap of voices in the last couplet (the manual's line spoken by the person, the person's line sounding clinical) crystallizes the mutual entanglement – the classification becomes part of the self, the self's expression becomes part of the record. The closed loop structure reinforces the inescapable feedback.

  **Compromise Note:** To achieve the powerful voice-swap in the final couplet and maintain the pantoum's strict closure, the poem slightly simplifies the *ongoing*, messy, multi-directional nature of looping. It presents a clearer "endpoint" of entanglement than exists in reality, where the process is continuous and less neatly resolved. The philosophical nuance of constant flux is sacrificed for poetic impact and formal resolution. The core mechanism of mutual reshaping, however, remains intact and visceral.
