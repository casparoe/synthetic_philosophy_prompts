  The user needs a decisive verdict, not academic hedging. Their character's choice in chapter nine likely mirrors this philosophical tension—perhaps deciding whether to take risky individual action or wait for collective consensus. The novelist's real need is narrative clarity: a framework to make the character's decision resonate thematically.

  Hmm... the economist's "marginal key" rebuttal is clever but flawed. In true multi-key scenarios (like reducing carbon footprints), no single person is pivotal—it's about cumulative thresholds. This distinction holds if we define "key-turning" as non-pivotal contributions. Jaywalking actually proves the scientist's point: when many jaywalk, it normalizes the behavior (changing the system), making it multi-key in terms of cultural shift.

  The strongest case for the economist is existential risks like launching nukes—clear single-key cases where restraint norms are vital. But extending this presumption to all shared risks ignores how many problems (climate change!) are inherently multi-key. The scientist wins by showing the economist's broad presumption would forbid the very coordination needed to solve multi-key crises.

  Verdict: Presumption against unilateral action only in single-key scenarios. For multi-key, we need activation energy—nudges that overcome collective inertia. The test? Ask: "Could one person's action alone cause catastrophic harm?" If yes, block the key. If no, enable turning. 

  This gives the novelist a crisp tool: their character faces either a single-key dilemma (don't turn!) or multi-key (turn, and recruit others!). Chapter nine's tension writes itself.
answer: |-
  Here’s the verdict: **The unilateralist’s curse justifies a presumption against unilateral action *only* in true single-key scenarios. In multi-key cases, the curse dissolves and the danger flips to collective inaction. Attempting a blanket presumption against unilateralism collapses under its own weight and sabotages solutions to multi-key crises. The single-key/multi-key distinction is the critical tool for cutting this knot.**

  ### The Economist’s Strongest Case (Single-Key Nightmares)
  Imagine a room with ten scientists, each holding a button that could unleash a catastrophic bioweapon. Each scientist, based on their limited data, calculates a 5% chance their button solves a global crisis. But *if* they could confer, they’d realize the weapon is a dud—pushing *any* button guarantees disaster. This is the curse in its purest form: individual rationality (act if your expected benefit > cost) leads to near-certain doom because *someone* will push their button. Here, the economist is brutally right: a norm *against* pushing your button unless universally approved isn’t just wise—it’s essential. The presumption against unilateral action prevents individual misjudgments from triggering irreversible, system-wide harm. The "marginal key" objection fails here because *every* actor is potentially the catastrophic unilateralist. Deferring to a hypothetical "whole-board" viewer (or requiring consensus) is the only defense against a game of apocalyptic Russian roulette.

  ### The Climate Scientist’s Counterattack (The Collapse of Blanket Deference)
  But the economist’s call for a *general* presumption against unilateralism implodes under three blows:
  1.  **The Normative Bootstrapping Problem:** Who decrees this universal norm of deference? If the economist unilaterally declares "No one act alone!", they’ve just violated their own rule. If they *don’t* declare it, the norm never forms. The curse itself predicts that *someone* will unilaterally impose a solution (like deference), proving unilateralism is sometimes unavoidable.
  2.  **Paralysis on Multi-Key Problems:** For shared risks requiring mass action (e.g., mitigating climate change), the curse flips. If a thousand factories must each reduce emissions to avert disaster, and each owner reasons "My shutdown won't tip the scales; someone else will act," then *nobody acts*. Here, the economist’s presumption ("Don't act alone! Wait for coordination!") reinforces the deadly logic of inaction. It becomes the problem, not the solution. The "marginal key" retort is a red herring. In genuinely diffused multi-key systems (like aggregate carbon output), there is no identifiable "tipping point" actor beforehand; the harm emerges from the *sum*, not a specific marginal contribution. Treating it as a series of single-key decisions misdiagnoses the problem.
  3.  **The Coordination Trap:** Waiting for universal consensus or a perfect "whole-board" viewer is often impossible or too slow. Solving multi-key problems *requires* someone to act unilaterally first—to innovate, build a coalition, prove feasibility, or simply break the logjam of inaction. A blanket presumption kills this essential spark.

  ### The Single-Key/Multi-Key Distinction: Doing the Heavy Lifting
  This isn’t just relabeling; it’s the core diagnostic tool. The distinction turns on **causal structure and pivotality**:
  *   **Single-Key Action:** **One actor’s decision is sufficient to cause significant, irreversible harm to the shared interest.** (e.g., launching a nuke, releasing a prototype AI, deploying an untested geoengineering tech). The curse bites hard here. *Presumption Against Unilateral Action is justified.*
  *   **Multi-Key Action:** **The significant harm (or benefit avoidance) requires the aggregation of many independent decisions; no single decision is pivotal.** (e.g., reducing personal carbon footprint, contributing to a public good, adopting a safety standard where widespread adoption is needed). The curse dissolves, replaced by the risk of collective inaction. *Presumption Against Unilateral Action is harmful and counterproductive.* Here, we need norms of *participation* and mechanisms to overcome freeriding.

  **What about Jaywalking?** The scientist is *partly* right. A single jaywalker might cause an accident (single-key harm potential). But the *systemic risk* – normalizing dangerous behavior, eroding traffic norms – is multi-key. It takes many jaywalkers to shift the culture and increase aggregate risk. The economist sees the tree (single accident); the scientist sees the forest (cultural shift). Both are real, but the systemic risk fits the multi-key logic.

  ### The Verdict & The Test for Your Character
  1.  **Presume Against Unilateral Action ONLY for Single-Key Threats:** Where one person can, by their solo act, trigger catastrophic or irreversible shared harm. (e.g., your character has the launch codes).
  2.  **NO Presumption Against Unilateral Action for Multi-Key Problems:** Where harm arises from mass inaction or aggregated choices. Here, unilateral action is often necessary and virtuous, sparking coordination or overcoming inertia. (e.g., your character must decide whether to sabotage their own corporation's polluting machinery, knowing it's a tiny drop but hoping to inspire others).
  3.  **The Test for Your Character in Chapter Nine:** Ask: **"Could my action, *by itself*, cause the major catastrophe we all fear?"**
      *   **If YES (Single-Key):** Don't turn the key. Seek consensus, wait for authority, disable the mechanism. The curse is real and lethal here.
      *   **If NO (Multi-Key):** Turn your key. Your action likely won't be pivotal, but it contributes to the solution and might inspire others. Waiting for permission is the path to doom. The curse is irrelevant; the danger is everyone staying passive.

  The economist’s framework is vital armor against single-key catastrophes. The climate scientist’s distinction reveals why that armor becomes a straitjacket for the multi-key crises that define our age. Your character’s choice in chapter nine hinges entirely on which kind of key they hold. Make them see it clearly.
