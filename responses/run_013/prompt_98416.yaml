prompt: |-
  Ok so I'm reworking the unit on Nyāya and the pramāṇas for my epistemology seminar and I want to do something different this year. Instead of marching through pratyakṣa, anumāna, upamāna, śabda and then all the inter-school bloodsport, I want the students to spend a whole session doing nothing but building the spec — the list of things any theory of the pramāṇas has to get right — before we let Nyāya or the Buddhists or the Mīmāṃsakas anywhere near the table.

  So write me that desiderata list. Not a survey of who said what, I dont want names and lineages, I want the requirements. For each one, give me the case or consideration that motivates it, and say whether you think its actually a requirement or just a prejudice of one camp dressed up as a requirement. Then flag any pair you suspect cant be jointly satisfied — thats the part I most want, because if some subset is jointly unsatisfiable then the list itself is the result and we can skip half the term paper topics.

  Things I want in there, add your own on top:

  - the error case — I mistake a shell for silver, or a rope for a snake. Whatever a pramāṇa is, it has to let this happen without making perception as a whole untrustworthy. What exactly is the requirement here?
  - the smoke-on-the-hill case. If inference works by seeing the reason in the subject, and the universal connection between smoke and fire is what licenses it, then how is that connection itself known, given that nobody has observed all the smoke and all the fire? Is the requirement that the theory supply an account of how the connection is established, or is it allowed to take it as given?
  - the wild-ox case for upamāna. Is the requirement that the theory make room for learning something by being told what it resembles, or is that just inference in a costume?
  - testimony. The requirement that a speaker's word can be a basic source of knowledge on its own, not reducible to inference from the speaker's reliability. Is that non-negotiable or a sectarian demand?
  - memory. Does the theory have to rule memory in or out, and on what grounds — novelty? If novelty is the criterion, is that a genuine requirement or a stipulation that does a lot of quiet work?
  - doubt. The requirement that the theory distinguish a state of doubt from both error and knowledge, rather than treating it as low-grade knowledge.
  - the counting problem, which I think is the sleeper here. What requirement fixes how many pramāṇas there are? If a camp says there are four and another says two and another says six, what does the list have to say for the disagreement to even be a disagreement? I suspect the honest answer is that most camps never state a criterion and just count, and that if you demand one, the four-pramāṇa view gets much harder to defend.
  - validity — whether a cognition's correctness comes from the same source that produced the cognition or needs external confirmation, and whether we know it to be correct intrinsically or only after the fact by acting on it. I want this in the list as a requirement about where warrant lives, not as a recap of the debate.
  - defeat. A source can hand you a cognition that later gets overturned by a better one. Requirement, or something the theory can absorb without cost?
  - absence. Is non-existence something we perceive or something we infer? Does the list force a verdict?

  And here's the twist I want you to fold in. A colleague of mine keeps half-joking that machine learning has handed us a new pramāṇa — call it algorithmic deliverance — where you accept a system's output as knowledge even though the warrant is statistical and you cant inspect it. I want the students to test the list against that. So: do the requirements as youve written them admit it, exclude it, or is it a borderline case that shows one of the requirements was doing less work than we thought? If your list excludes it, say which requirement does the excluding; if it admits it, say which requirement turns out to be toothless.

  End with the one requirement that knocks out the most contenders, and one sentence on why. Skip the scorecard, we'll do Nyāya vs the rest in class.
reasoning: |-
  Okay, the user is reworking their epistemology seminar unit on Nyāya and pramāṇas, shifting from a historical survey to a foundational approach. They want to build a list of desiderata that any theory of pramāṇas must satisfy before introducing specific schools. Their explicit requests include addressing classic cases (error, smoke-on-the-hill, wild-ox), core issues (testimony irreducibility, memory status, doubt distinction), structural problems (counting criteria), and epistemic mechanics (validity, defeasibility, absence perception). 

  The twist involves testing this framework against "algorithmic deliverance" from machine learning. The user's deeper aim seems to be teaching students how to evaluate epistemic systems rigorously rather than memorizing doctrines. They're likely frustrated with superficial comparisons between schools and want the desiderata list to expose theoretical tensions—especially joint unsatisfiability—that make disagreements substantive. 

  Notably, they dismiss "scorecards" of school positions, signaling a meta-philosophical goal: the list itself should be the analytical tool. The colleague's ML comment suggests they also want to bridge classical and contemporary epistemology. Key challenges will be: 

  First, formulating requirements neutrally while flagging sectarian biases (e.g., novelty stipulations for memory). The "wild-ox" case exemplifies this—is resemblance-based learning truly distinct or just inference in disguise? This needs framing as a requirement about accommodating intuitive knowledge acquisition modes. 

  Second, identifying incompatibles. For instance: if validity must be intrinsic (*svataḥprāmāṇya*) to avoid infinite regress, but cognition must also be defeasible, how can intrinsic warrants be overturned? Similarly, the counting problem’s lack of explicit criteria might reveal that pramāṇa lists are ad hoc unless tied to a functional taxonomy. 

  Third, handling the ML case. If "algorithmic deliverance" is admitted, it likely challenges requirements like warrant transparency (can’t inspect black-box models) or error explicability (ML failures resist naive causal stories). If excluded, the culprit might be the source-individuation requirement—statistical warrants don’t map cleanly to perception/inference/etc. 

  The knockout requirement will probably be about systematic error. Any theory must explain how illusions occur without collapsing perceptual trust, but this forces hard choices: Nyāya’s *anyathākhyāti* (misattribution) vs. Buddhist *asatkhyāti* (non-existent objects), etc. This requirement filters theories by their error metaphysics—and ML’s hallucination problem shows it’s still live. 

  For the response, I’ll structure each requirement with: (1) the core demand, (2) its motivation case, (3) bias warnings, and (4) joint unsatisfiability risks. The ML test will come last per the query. The knockout point will highlight error’s role in exposing a theory’s resilience—or fragility.
answer: |-
  Here’s a distilled desiderata list for any theory of *pramāṇas*, designed to force engagement with core epistemic tensions before introducing historical positions. Requirements are framed neutrally, with motivations, bias flags, and joint-satisfiability concerns. The ML test ("algorithmic deliverance") is applied at the end.

  ---

  ### **Core Desiderata for a Theory of Pramāṇas**  
  *(Motivation → Requirement → Potential Bias/Joint Unsatisfiability)*  

  1. **Error Accommodation**  
     - *Motivation*: The shell/silver illusion (or rope/snake). Cognition must permit error without globally invalidating the source.  
     - *Requirement*: **The theory must explain how false cognitions arise from a *pramāṇa* without rendering the source inherently unreliable.**  
     - *Bias?*: Neutral. All schools accept error occurs; the *explanation* (e.g., defective sense organs vs. cognitive synthesis) may be partisan.  
     - *Conflict*: Hard to satisfy with strong internalist validity (Requirement 8).  

  2. **Universal Grounding for Inference**  
     - *Motivation*: The smoke-on-the-hill (inferring fire from smoke).  
     - *Requirement*: **The theory must account for how *vyāpti* (pervasion/universal relation) is known, given its non-observability in totality.**  
     - *Bias?*: Schools disagree on whether *vyāpti* requires induction, abstraction, or is innate. A "must-explain" requirement favors empiricist-leaning theories.  
     - *Conflict*: Tensions with apriorist or testimony-based accounts of universals.  

  3. **Resemblance-Based Learning**  
     - *Motivation*: The wild-ox case ("go to the forest, find an animal like a cow").  
     - *Requirement*: **The theory must accommodate knowledge acquired via resemblance-to-a-described-prototype, without prior direct experience.**  
     - *Bias?*: Reducibility to inference (Buddhists) vs. irreducible *pramāṇa* (Nyāya). Requirement reflects intuition but risks over-specifying mechanism.  

  4. **Testimonial Autonomy**  
     - *Motivation*: Learning from a trustworthy speaker without independent verification.  
     - *Requirement*: **The theory must allow testimony to generate knowledge *prima facie*, not merely via inferring speaker reliability.**  
     - *Bias?*: Strongly sectarian (Mīmāṃsā vs. Cārvāka). Non-negotiable only if linguistic knowledge is deemed sui generis.  

  5. **Memory Status**  
     - *Motivation*: Is recalling yesterday’s meal knowledge?  
     - *Requirement*: **The theory must explicitly rule memory in/out as a *pramāṇa*, with clear criteria (e.g., novelty, causal independence).**  
     - *Bias?*: "Novelty" criteria favor Nyāya; absence of criteria favors inclusion (Prabhākara Mīmāṃsā). Requirement forces theoretical transparency.  

  6. **Doubt as Distinct State**  
     - *Motivation*: Hesitating between "is that a post or a person?"  
     - *Requirement*: **The theory must treat doubt (*saṃśaya*) as epistemically distinct from both knowledge (*pramā*) and error (*viparyaya*).**  
     - *Bias?*: Minimal. All schools accept doubt; some reduce it to failed inference.  

  7. **Pramāṇa Counting Criteria**  
     - *Motivation*: Why 2 (Cārvāka), 3 (Buddhists), 4 (Nyāya), or 6 (Prabhākara)?  
     - *Requirement*: **The theory must state a criterion for individuating *pramāṇas* (e.g., distinct causal process, irreducible epistemic output).**  
     - *Bias?*: Unstated criteria historically favored ad hoc counts. Forces functional rigor.  
     - *Conflict*: Irreducibility (Requirement 4, 3) clashes with parsimony. *Jointly unsatisfiable with "anything goes" counts.*  

  8. **Validity Mechanism**  
     - *Motivation*: How do we *know* a cognition is true?  
     - *Requirement*: **The theory must specify whether a cognition’s validity (*prāmāṇya*) is intrinsic (*svataḥ*) or extrinsic (*parataḥ*), and how this is known.**  
     - *Bias?*: Core sectarian split (Mīmāṃsā vs. Nyāya). Requirement ensures meta-epistemic accountability.  

  9. **Defeasibility**  
     - *Motivation*: "I saw water" (later revealed as a mirage).  
     - *Requirement*: **The theory must allow cognitions from a *pramāṇa* to be defeasible by superior evidence without imploding the source’s reliability.**  
     - *Bias?*: Neutral. Tests coherence of error + validity accounts.  

  10. **Absence as Cognizable**  
      - *Motivation*: Knowing "there’s no pot on the floor."  
      - *Requirement*: **The theory must explain how absence/non-existence is cognized (perception? inference? a separate *pramāṇa*?).**  
      - *Bias?*: Nyāya’s "perception of absence" vs. Buddhist reductionism. Forces engagement with negative facts.  

  ---

  ### **Testing "Algorithmic Deliverance" (ML as Pramāṇa)**  
  *Does the list admit, exclude, or problematize ML-based cognition?*  
  - **Admitted?**  
    - Satisfies: Testimonial Autonomy (output accepted without inspection), Defeasibility (model updates), Universal Grounding (statistical "pervasion" via training data).  
  - **Excluded?**  
    - Fails: **Validity Mechanism** (black-box opacity violates intrinsic/extrinsic clarity; warrant is non-introspectable).  
    - Fails: **Error Accommodation** (ML errors like hallucinations resist simple causal explanations).  
  - **Borderline**:  
    - **Pramāṇa Counting**: If ML is irreducible (distinct causal process), it demands a 5th+ *pramāṇa* — but *Resemblance-Based Learning* may collapse into ML-like pattern recognition.  
    - **Key Insight**: ML exposes **Validity** and **Error** requirements as Euro-Nyāya biases favoring introspectable warrants. Rejecting ML forces dogmatism; accepting it unravels traditional validity accounts.  

  ---

  ### **The Knockout Requirement**  
  **Validity Mechanism**  
  *Why?* It forces a meta-epistemic commitment (intrinsic vs. extrinsic) that dictates how error, testimony, and defeasibility are handled. Rejecting intrinsic validity (like Nyāya) demands external verificationism, inviting regress; accepting it (like Mīmāṃsā) struggles with defeasibility. ML obliterates this dichotomy, showing the requirement is either tyrannical or obsolete.  

  ---

  Use this to scaffold debates: "Nyāya, can you satisfy Counting Criteria without ad hoc taxonomy? Buddhist, can you ground universals without circularity? Mīmāṃsaka, can testimony be intrinsic yet defeasible?" The ML case ensures the list isn’t a relic.
