prompt: |-
  I'm a reporter at a mid-sized magazine and I've somehow ended up on the committee that decides how we pay freelancers. Two years ago we moved off flat rates onto a rate that scales with how many readers get to the end of a piece — the theory being that if people finish it, it was worth writing. The completion numbers went up. The magazine got worse. Everyone can see it, nobody can prove it, and the people who like the new system like it precisely because they can point at the graph.

  Meeting's next month and there are three options on the table: keep it, scrap it and go back to flat rates, or "fix" it. The fix is our data lead's idea — bolt on five or six sub-metrics (shares, return visits, comment civility, whatever) and weight them so the score can't be gamed. That one feels wrong to me but I can't articulate why, and "it can't be gamed" is a hard thing to argue against in a room full of people who trust numbers.

  Here's my half-baked theory, tell me if it holds up. I think there are three different ways a number goes bad, and people lump them together. One: the number stops tracking the thing, but the thing itself is fine — we're just measuring badly now. Two: people start doing the number instead of the job, so the job quietly becomes a different job. Three: the number was never a measure of the thing at all, it was a symptom of it, and it moves for reasons of its own. Are those actually distinct, or am I just drawing lines through the same mush? And does the second one even require anyone to be cynical? Our freelancers aren't villains, they're responding to what we put in front of them, so I'm not sure "gaming" is the right word for what they're doing.

  Related thing someone said to me years ago that I've never shaken: you can't turn a virtue into a checklist, because knowing what kindness actually asks for in a particular situation *is* the kindness — it's not a seperate skill you could hand off to a rulebook. If that's right, then my data lead's plan is doomed in principle and not just in practice, and no number of sub-metrics saves me. Is that the same problem in a different dress, or am I conflating two things that only rhyme?

  So: which option do I argue for, and what do I actually say in the room? I dont need the name of the phenomenon, I need to know what I'm looking at and what to do about it.

  British English please — I'm filing from London and our style guide is strict. And lead with your bottom line in the very first sentence, then the reasoning after. No preamble, no restating my question back at me.
reasoning: |-
  Okay, the user is a reporter on a committee deciding how to pay freelancers at a mid-sized magazine. They moved to a reader completion-based payment system, which boosted completion rates but made the magazine worse. Now they're considering keeping it, scrapping it for flat rates, or adding sub-metrics to "fix" it. The user has a theory about why metrics go bad and wants to know which option to argue for and how to present it.

  First, I need to address their three ways a number goes bad. They're distinct but interconnected. The first is measurement drift—when the metric stops tracking the actual goal. The second is effort substitution—when people optimize for the metric instead of the real work, changing the job itself. The third is symptom confusion—mistaking a symptom for the cause. These are valid and separate issues. In their case, completion rates might be a symptom (third point), but paying for it led to effort substitution (second point), where freelancers write to maximize completions, not quality. 

  The user questions if "gaming" is the right term since freelancers are just responding to incentives. They're right; it's not cynicism but rational adaptation. The data lead's fix of adding sub-metrics might not solve the core issue. If each sub-metric is gamed, or if they don't capture quality, the problem persists. Also, the virtue-as-checklist point is crucial. Quality journalism requires judgment that can't be reduced to metrics. Adding more metrics might complicate without addressing the fundamental mismatch.

  The user needs a clear bottom line. Scrapping the system and returning to flat rates is the best move. They must argue that the current system distorts quality and no metric fix can capture editorial judgment. Emphasize that freelancers are adapting rationally, not gaming maliciously. Highlight the magazine's decline as evidence. In the meeting, stress the cost of poor content and the need to trust editorial expertise over flawed metrics. Suggest post-payment bonuses based on broader success indicators as a compromise if flat rates face resistance.

  Also, British English is required. Avoid jargon, use terms like "sub-editors" where appropriate. Keep the response concise, leading with the recommendation, then reasoning. Ensure the argument is principled and practical, addressing both the immediate problem and the deeper issue of metric limitations.
answer: |-
  **Argue to scrap the performance-linked system entirely and return to negotiated flat rates, supplemented by discretionary bonuses for exceptional work.**

  Here's the reasoning, structured for your meeting:

  1.  **Your Framework is Sound and the Problem is Category Two (Effort Substitution):** Your three categories *are* distinct. What you're experiencing is primarily **"Two: people start doing the number instead of the job, so the job quietly becomes a different job."** Completion rates became the target. Freelancers, quite rationally and without malice, adapted their writing to maximise *that specific outcome*. This isn't "gaming" in a cynical sense; it's predictable behavioural economics. They responded correctly to the incentive *you* provided. The result is content optimised for completion (e.g., simpler, more provocative, less challenging narratives), not for the complex, nuanced quality the magazine *actually* needs. The "different job" is now producing completable articles, not necessarily brilliant journalism.

  2.  **The "Fix" with Sub-Metrics is Fundamentally Flawed:**
      *   **It Doesn't Solve the Core Problem (Effort Substitution):** Adding shares, return visits, comment civility etc., even weighted, simply creates *multiple* targets. Freelancers will then rationally optimise for *that combined score*. Effort substitution doesn't vanish; it shifts. They'll write for shares *and* civility *and* return visits *and* completion, inevitably altering the work further, possibly in unforeseen and equally undesirable ways. It risks producing bland, algorithmically-pleasing content.
      *   **It Falls Prey to "Symptom Confusion" (Your Point Three):** Shares, civility, return visits – these are *symptoms* or *byproducts* of good journalism in some contexts, not the *essence* of it. They can be influenced by factors entirely outside the writer's control (platform algorithm changes, current events, reader mood) and move for their own reasons. Mistaking these symptoms for the core objective is dangerous.
      *   **The Virtue/Checklist Analogy is Spot On:** Your colleague's wisdom cuts to the heart of it. Editorial quality is a complex judgment call, akin to a virtue like kindness. Knowing *what makes a piece truly excellent for this magazine, for this audience, right now* is the core editorial skill. You cannot reduce this nuanced judgment to a definitive, static checklist of metrics without losing the essence of what you're trying to achieve. The data lead's plan attempts precisely this impossible reduction. More metrics don't solve the fundamental mismatch; they just create a more complex, but equally reductive, proxy.

  3.  **Why Flat Rates (with Bonuses) are the Least Bad Option:**
      *   **Removes Perverse Incentives:** It stops driving freelancers to optimise for arbitrary, measurable outputs that don't equate to quality. They are free (and implicitly hired) to focus on writing *good journalism* as judged by the editorial team.
      *   **Acknowledges Editorial Judgment:** It places trust back where it belongs – with the editors who commission the work and understand the magazine's standards and audience. They negotiate the rate based on the *anticipated* value, scope, and complexity of the piece.
      *   **Flexibility with Bonuses:** A discretionary bonus pool allows you to *recognise* exceptional work that demonstrably achieved outstanding results (high engagement, impact, reader praise, awards consideration etc.) *after the fact*, without making it the primary, distorting driver of income. This rewards genuine excellence without mandating it through a pre-defined formula.
      *   **Addresses the "Graph Problem":** You can still *track* completion rates, shares, etc., for editorial insight and to inform future commissioning. The key difference is these metrics are used *diagnostically* by editors, not as the *determinant of pay*. You can point to graphs showing reader engagement *alongside* the high-quality work they reflect, not drive it.

  **What to Say in the Room (British English & Direct):**

  > "Right, bottom line: we need to scrap the completion-based pay system and return to negotiated flat rates, with a pot for discretionary bonuses for truly exceptional work. Here’s why bluntly: Our current system has, predictably, incentivised writers to chase completion stats, changing what they produce. The magazine *is* worse – we all feel it, even if the graph looks good. This isn't freelancers 'gaming' the system; it's them rationally responding to the target we set. Bolting on more metrics won’t fix this core flaw. It just creates more targets to chase, likely distorting the work further in new ways, and mistakes symptoms like shares or civility for the quality we actually need. You simply cannot checklist editorial virtue. Paying for a formula, however complex, will always risk missing the point. Flat rates remove the perverse incentive, let editors judge quality based on our actual standards, and let writers focus on the journalism. We can track all the data we like for insight, but we shouldn’t let it dictate pay. Bonuses allow us to reward genuine standout success *after* we see it, without making it the compulsory goal. The cost of poor content outweighs any perceived efficiency of the current graph. Let’s trust our editorial judgment again."
