prompt: |-
  I'm a third-year PhD student in philosophy of cognitive science, and I'll be running a single 90-minute session of our upper-level seminar on minds and machines this spring. The group is about fourteen people — mostly advanced undergraduates, with a few first-year graduate students — and I want to open the unit on non-human and pre-human cognition with an activity rather than a lecture. Specifically, I want a game that makes the group feel the force of the progression Dennett draws from Darwinian to Skinnerian to Popperian to Gregorian creatures, and above all the two transitions that tend to get nodded at rather than felt: the move from learning by trial and error in the world to running the trials inside the head, and the move from running them in one's own head to running them in a shared, external medium of tools and artifacts. I care less that they can recite the four labels than that they arrive at the distinctions from the inside and can then point to which of the four is doing the work in a given situation.

  Please design the activity with the following constraints. Nothing should be explained up front; the four terms should be named only in the debrief, and ideally the labels should feel like a summary of what they just lived through rather than new information. The rules should be carried by a hidden world the facilitator keeps on a single page — simple enough to run from memory, opaque enough that it must be probed. Structure it as four rounds, one per kind, and make the nesting vivid: a later creature keeps the earlier capacities, so students should be able to see all four floors still present and to say which one is carrying the load at any moment (I like Dennett's image of a tower of generate-and-test here, and I'd like the activity to have the same stacked structure).

  Give each round a specific job. The first round should be selection at the population level, not learning: individuals must be unable to improve within their own lifetime, and any improvement must come from reshuffling the population across generations. The second round should make error genuinely costly — a wrong move has to subtract something real from the player's score, so that the appetite for the third round is felt rather than asserted. The third round should let players test a move before making it, but on a limited budget and with a slightly unreliable oracle, so that they discover an inner model is a model: it can be wrong, and trusting it trades the cost of error for the risk of model error. The fourth round should locate the advantage in an external, transmissible artifact — a shared public medium that can be written to and inherited, so that a player entering late benefits from a store she did not build — and I want the payoff to come from the artifact itself rather than from teamwork or individual cleverness, which means you'll have to block ordinary verbal coordination and make the shared medium the only channel.

  Deliverables: the full rules, a materials list using only cheap things (index cards, a whiteboard, counters), a payoff scheme that needs no real money, a minute-by-minute timeline for the 90 minutes, the hidden-world specification for the facilitator, and a debrief that maps specific moments in the game onto the four kinds and onto the economics of error that drives the progression. Then tell me what will predictably go wrong the first time I run it and how to handle each failure — I'd rather be warned than surprised. Finally, be frank about what the activity cannot reproduce and that I will have to supply in the debrief: I already suspect it cannot convey the evolutionary timescale of the first floor, and it presents the four levels synchronically, so the historical claim that these are stages in a lineage will have to come from me. Tell me what else is lost in translation. No reading or web access should be required of the students, and the whole thing should fit in one session with no prior preparation on their part.
reasoning: |-
  We are designing a game with four rounds, each corresponding to one of Dennett's creature types: Darwinian, Skinnerian, Popperian, and Gregorian. The game should be structured so that the transitions between the levels are felt by the participants. The facilitator will have a hidden world specification (a single page of rules) that defines the environment and the rules of interaction. The game will use simple materials: index cards, a whiteboard, markers, and counters (like poker chips or coins).

  **Overview of the Four Rounds:**

  1. **Darwinian Round (Population-Level Selection):** 
     - Players represent a population of creatures. Each creature has a fixed behavior (a "gene") and cannot change during its lifetime. The environment changes, and creatures with the wrong gene die. The population evolves over generations by reshuffling.

  2. **Skinnerian Round (Individual Learning by Trial and Error):**
     - Each player is an individual creature that can learn within its lifetime by trying actions and receiving feedback. Wrong actions are costly (they subtract from the player's score). The goal is to find the correct action for the given environment.

  3. **Popperian Round (Mental Simulation with an Inner Model):**
     - Players have an inner model (a limited resource) that they can use to test actions internally before trying them in the real world. The inner model is slightly unreliable. Using the inner model costs a little, but making an error in the real world costs a lot.

  4. **Gregorian Round (Shared External Medium):**
     - Players can create and use external artifacts (written on index cards and placed on a public board) that represent knowledge. These artifacts can be used by any player, including future players. Verbal coordination is blocked, so the only shared medium is the artifact board.

  **The Hidden World:**

  The facilitator has a hidden specification of the "world" which is a sequence of environments. Each environment is defined by a correct action and a set of possible actions. The environments change in a predetermined way. The facilitator also has a mapping from actions to outcomes.

  We will use a simple problem: navigating a grid. However, to keep it abstract and not require a physical grid, we can represent the problem as choosing a path in a maze of choices. But to keep it simple, we can use a set of possible actions (like colors, shapes, or numbers) and the environment specifies which one is correct.

  **Materials:**
  - Index cards (for player "genes", and for artifacts in round 4)
  - Whiteboard (to display the current environment and scores, and for the public artifact board in round 4)
  - Markers (for writing on whiteboard and index cards)
  - Counters (for scoring, e.g., poker chips, coins, or just points on the board)

  **Player Setup:**
  - 14 players. In round 1, they are divided into multiple generations. In rounds 2-4, each player is an individual.

  **Game Structure:**

  The game is played in four rounds. Each round has multiple turns (or generations, in the case of round 1). The goal in each round is to maximize individual score (which in round 1 is about survival and reproduction).

  ---

  **Round 1: Darwinian Creatures**

  - **Objective:** Players experience natural selection without individual learning.
  - **Setup:** 
    - The facilitator has a hidden list of environments (E1, E2, E3, ...). Each environment is a set of possible actions (e.g., A, B, C, D) and one correct action (e.g., for E1, correct is A).
    - Each player is given an index card with a randomly assigned action (A, B, C, or D). This is their "gene" for life.
    - The facilitator announces the current environment (e.g., "Environment 1") and the set of possible actions (without revealing which is correct).
  - **Gameplay:**
    - The facilitator tests each player: they must commit to their gene (they have no choice). 
    - The facilitator then reveals which action was correct and which players survived (those with the correct gene). 
    - Each surviving player gets 1 point (a counter) and "reproduces": they create one offspring (another player takes a new index card with the same gene). Non-survivors die (they become offspring of survivors or wait to be reassigned).
    - The environment changes (next in the hidden list) and the next generation begins. 
    - Play 3-5 generations.

  - **Key Point:** Players cannot change their action. Improvement comes only from the population having more of the correct genes.

  ---

  **Round 2: Skinnerian Creatures**

  - **Objective:** Players learn by trial and error, experiencing the cost of error.
  - **Setup:** 
    - The same environment sequence as round 1 (but starting from a new environment, not the last one of round 1) is used. 
    - Each player is now an individual that can choose any action in each turn. They have a starting score of 0 (or 10 to avoid negatives? Let's say they start with 10 points).
    - The environment is announced (set of actions) and remains the same for several turns (say, 5 turns) to allow learning.
  - **Gameplay:**
    - On each turn, each player secretly writes down their chosen action (on a scrap paper or by holding up a card) and then the facilitator reveals the correct action.
    - If a player chose correctly, they gain 1 point. If wrong, they lose 1 point (or 2? to make it costly). 
    - After the reveal, they can adjust their next choice. 
    - The environment changes every 5 turns (so players must learn anew).

  - **Key Point:** Errors are costly (points lost). Players feel the pain of wrong choices and the need to learn.

  ---

  **Round 3: Popperian Creatures**

  - **Objective:** Players can use an inner model to test actions before committing, but the model is imperfect and using it has a cost.
  - **Setup:**
    - Each player gets 3 "model tokens" (counters) at the start. Each token allows one internal test.
    - The environment sequence continues (or a new one). The environment is announced and remains for several turns (say 5 turns again).
  - **Gameplay:**
    - On a turn, a player can choose to:
        a) Use a model token to test an action internally. The facilitator will tell them if that action would be correct or not, but with a reliability of 80% (i.e., 20% chance the model is wrong). The token is spent regardless.
        b) Then, they can choose an action to try in the real world (which might be the one they tested or a different one).
    - Alternatively, they can skip the model and just try an action.
    - Real-world trial: if correct, gain 1 point; if wrong, lose 2 points.
    - The model test costs 0.5 points (or we can avoid fractional points: let's say using the model costs 1 point, but then we adjust the gains and losses. Alternatively, we can make the model free but limited by tokens? We'll go with tokens and no extra cost, but the risk of model error and the limit of tokens create the trade-off).
    - After each real-world trial, the correct action is revealed to all.

  - **Key Point:** The inner model is a limited resource and imperfect. Players must manage when to use it and when to just try. They experience the risk of model error.

  ---

  **Round 4: Gregorian Creatures**

  - **Objective:** Players can create and use external artifacts (written knowledge) that persists and is shared.
  - **Setup:**
    - A public whiteboard (or a large poster) is set up as the "artifact board". 
    - The environment sequence continues (or a new one). Each environment is presented for only one turn (to encourage the use of artifacts) and changes rapidly.
