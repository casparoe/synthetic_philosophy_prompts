    - Points: correct action: +2 points; wrong action: -2 points. Creating an artifact costs 1 point.
    - The artifacts remain on the board for the entire round, so later players can see them.

  - **Key Point:** Players can benefit from the shared knowledge base. A player entering late (we can simulate by having the environments change quickly) can use the artifacts without having experienced the earlier environments.

  ---

  **Scoring and Payoff:**

  - We don't use real money. We use counters (poker chips, coins, or just tally on the whiteboard) to represent points. The goal is to have as many points as possible at the end. We can have a small prize (candy?) for the top scorer, but it's not necessary.

