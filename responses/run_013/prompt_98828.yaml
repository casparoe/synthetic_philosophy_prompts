answer: |-
  ### Activity Design: "Cognition Tower"  
  This game simulates Dennett's four-layered cognitive evolution through embodied problem-solving. Players progressively unlock capacities while facing escalating environmental challenges, experiencing the economic trade-offs that drive transitions.

  **Materials** (total cost: ~$15):  
  - Index cards (100)  
  - Whiteboard + markers  
  - Colored counters (60 red, 60 blue; poker chips work)  
  - Envelopes (14)  
  - Timer  
  - Dice (d6)  

  **Hidden World Specification** (Facilitator's cheat sheet):  
  *(Keep this 1-page reference hidden; reveal nothing to players initially)*  
  - **Environment Sequence**: Predefined 20-step path (see below)  
  - **Correct Actions**: Each environment has one correct action (A-D)  
  - **Rules of Reality**:  
    - *Darwinian*: Correct = survive/reproduce; Wrong = die  
    - *Skinnerian*: Correct = +1 blue counter; Wrong = -1 blue counter  
    - *Popperian*: Model test costs 1 red counter; 80% accurate (dice: 1-4=true, 5-6=false)  
    - *Gregorian*: Posting artifact costs 1 blue counter; Using artifact = free  

  **Environment Sequence** (pre-generated; never changes):  
  | Env# | Correct | Pattern Hint (for artifacts) |  
  |------|---------|-------------------------------|  
  | 1-2  | A       | Starting cluster              |  
  | 3-4  | B       | Shift after 2                 |  
  | 5-7  | C       | Longer run                    |  
  | 8-10 | D       | Final triple                  |  
  | 11   | A       | Back to start                 |  
  | 12-14| B       | Triple                        |  
  | 15   | C       | Single                        |  
  | 16-18| A       | Major cluster                 |  
  | 19-20| D       | Ending pair                   |

  ---

  ### Game Rules & Flow (90 min total)  
  **Phase 0: Setup (5 min)**  
  - Give each player: 1 envelope, 3 red counters ("cognitive resources"), 5 blue counters ("survival points")  
  - Post blank whiteboard with "ARTIFACT ZONE" section  

  **Round 1: Darwinian Creatures (15 min)**  
  *Goal: Feel population-level selection without individual learning*  
  - Rules:  
    1. Each player writes a random letter (A/B/C/D) on index card → seals in envelope (their "DNA").  
    2. Facilitator announces Environment #1 (e.g., "Environment 1: Possible actions A,B,C,D").  
    3. Players open envelopes, reveal actions simultaneously.  
    4. Facilitator reveals correct action:  
       - Correct: Gain 1 offspring (take new envelope with SAME card)  
       - Wrong: Die (sit out next round; later become offspring)  
    5. Repeat for 3 generations (Envs 2-4).  
  *Key: Players CANNOT change their card. Improvement only via population reshuffle.*  

  **Round 2: Skinnerian Creatures (15 min)**  
  *Goal: Experience costly error driving need for internal models*  
  - Rules:  
    1. Reset: All players return (new "lifetime"); envelopes removed.  
    2. Environment #5 announced. Same environment for 5 turns.  
    3. Each turn:  
       - Players secretly write action (A-D) on scrap paper.  
       - Reveal simultaneously → facilitator announces correct action.  
       - Correct: +1 blue counter  
       - Wrong: -1 blue counter  
    4. Environment changes to #6 for 3 more turns.  
  *Key: Errors directly reduce resources; players learn through punishment.*  

  **Round 3: Popperian Creatures (20 min)**  
  *Goal: Discover trade-offs of internal simulation*  
  - Rules:  
    1. Environment #7 announced. Same for 5 turns.  
    2. Each turn, players may:  
       - **OPTION 1 (Model Test)**: Spend 1 red counter to test an action. Facilitator rolls dice (80% accuracy) and gives private YES/NO.  
       - **OPTION 2 (Real Trial)**: Commit action publicly.  
    3. Outcomes:  
       - Real trial correct: +1 blue  
       - Real trial wrong: -2 blues  
       - Model test: Always costs 1 red counter  
  *Key: Limited red counters force strategic use; model unreliability creates second-order risk.*  

  **Round 4: Gregorian Creatures (25 min)**  
  *Goal: Leverage shared external representations*  
  - Rules:  
    1. Environment changes EVERY turn (Envs 8-17).  
    2. Players CANNOT speak or gesture.  
    3. Each turn:  
       - Players may post index cards to ARTIFACT ZONE (e.g., "Env8-10: D works"). Cost: 1 blue counter.  
       - Players may read ARTIFACT ZONE freely.  
       - Players commit to action.  
    4. Outcomes:  
       - Correct: +2 blues  
       - Wrong: -2 blues  
  *Key: Artifacts persist; late players benefit from early investments. Verbal coordination blocked.*  

  ---

  ### Payoff Scheme  
  - **Blue counters**: Represent survival resources (food/energy). No real money; highest total wins symbolic prize (e.g., candy).  
  - **Red counters**: Represent finite cognitive capacity (replenished only between rounds).  
  - **Scoring**: Track totals on whiteboard; final scores determine "evolutionary fitness ranking."  

  ---

  ### Timeline (90 min)  
  1. **Setup** (5 min): Distribute materials, no theory explained  
  2. **Round 1: Darwinian** (15 min): 3 generations × 4 min each + 3 min reset  
  3. **Round 2: Skinnerian** (15 min): 5 turns (Env5) + 3 turns (Env6)  
  4. **Round 3: Popperian** (20 min): 5 turns (Env7)  
  5. **Round 4: Gregorian** (25 min): 10 turns (Envs 8-17)  
  6. **Debrief** (20 min): Link experience to theory  

  ---

  ### Debrief Script (20 min)  
  **Step 1: Elicit Experiences** (5 min)  
  - "What felt most frustrating in Round 1? Round 2?"  
  - "When did you feel safest taking risks? Why?"  
  - "What changed when artifacts appeared in Round 4?"  

  **Step 2: Map to Dennett's Framework** (10 min)  
  *(Introduce terms ONLY now)*  
  | Game Round | Dennett's Creature | Core Distinction | Game Moment |  
  |------------|---------------------|------------------|-------------|  
  | 1 | **Darwinian** | Selection via population reshuffle | Players dying with wrong genes; improvement between generations |  
  | 2 | **Skinnerian** | Costly trial-and-error | Losing blues for wrong guesses; direct reinforcement |  
  | 3 | **Popperian** | Internal simulation trade-offs | Spending red counters for imperfect models; avoiding real errors |  
  | 4 | **Gregorian** | Shared external representations | ARTIFACT ZONE enabling late players to succeed without personal trial |  

  **Step 3: Highlight Transitions** (5 min)  
  - **Skinnerian→Popperian**: "You traded blue losses (real errors) for red costs (modeling) in Round 3. That's the move from world-trials to head-trials."  
  - **Popperian→Gregorian**: "In Round 4, the artifacts let you offload cognition. The player who wrote 'Env8-10: D works' absorbed the risk so others didn't have to."  
  - **Nested Hierarchy**: "Notice how later rounds kept earlier tools: You still had 'genes' (innate biases), reinforcement learning, and internal models—but artifacts did the heavy lifting in Round 4."  

  **Economics of Error**:  
  - Darwinian: Error = death (irreversible)  
  - Skinnerian: Error = resource drain (recoverable but costly)  
  - Popperian: Error risk outsourced to model (cheaper but imperfect)  
  - Gregorian: Error risk distributed across time/agents via artifacts  

  ---

  ### Predictable Failures & Fixes  
  1. **Round 1 stalemate**:  
     - *Risk*: All players pick same letter → mass extinction.  
     - *Fix*: Secretly ensure initial diversity (pre-write 25% A/B/C/D if needed).  

  2. **Round 2 frustration**:  
     - *Risk*: Players disengage after losing blues.  
     - *Fix*: Emphasize "this pain is the point"; reset blues for Round 3.  

  3. **Round 3 over-trust**:  
     - *Risk*: Players assume models are perfect (ignore 20% error).  
     - *Fix*: Dramatically announce dice results ("Model says YES... but is WRONG").  

  4. **Round 4 artifact drought**:  
     - *Risk*: No one posts to avoid blue cost.  
     - *Fix*: Seed first artifact yourself ("Example: Env1-4: A and B dominated").  

  5. **Time overruns**:  
     - *Risk*: Gregorian round runs long.  
     - *Fix*: After Env14, announce "5x speed round" for last environments.  

  ---

  ### What's Lost in Translation  
  1. **Evolutionary timescale**: The game compresses generations into minutes. *Debrief supplement*: "In reality, Darwinian selection takes millennia; you felt its logic, not its tempo."  
  2. **Historical sequence**: The synchronic presentation obscures that these are evolutionary stages. *Debrief supplement*: "While all layers exist in humans, they emerged sequentially in evolutionary history."  
  3. **Model richness**: Inner models (Popperian) are reduced to dice rolls. *Debrief supplement*: "Real mental simulation involves dynamic prediction, not just binary tests."  
  4. **Artifact complexity**: Gregorian tools (language, math) enable abstract reasoning—index cards are crude proxies. *Debrief supplement*: "True Gregorian media reshape cognition (e.g., writing enables logic), not just store facts."  
  5. **Noise/randomness**: Real environments have stochastic rewards; game environments are fixed. *Debrief supplement*: "Uncertainty amplifies the value of Popperian/Gregorian tools."  

  **Final Note**: The activity excels at making transitions *felt*, but you must verbally connect it to Dennett's "tower of generate-and-test" metaphor and clarify that human cognition integrates all four layers recursively. Assign Dennett's original text (e.g., *Kinds of Minds* Ch.4) as follow-up reading.
