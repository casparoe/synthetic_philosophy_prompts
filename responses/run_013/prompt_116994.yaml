prompt: |-
  I sit on the resource-allocation committee of a regional health authority, and I am trying to find out what I actually believe about the decisions we make. Our budget is fixed, so every choice is between two policies affecting determinate, non-overlapping groups of people; take it that the facts about who is affected are known in advance, and that no one is responsible for being in the group they are in. What I want from you is the principle, or the small set of competing principles, that best fits the verdicts below, together with a plain statement of which of those verdicts I have to give up. I am not asking for a survey of what has been written about cases of this shape; I want the principle that fits these votes.

  1. A single dose of an antidote can be given to one of two groups of people exposed to the same poison, each of whom will otherwise die within the day. One group has two members, the other five. I give it to the five. Each of the two has precisely the complaint that each of the five has, and the count is the only thing left to break the tie.

  2. The same dose could instead be given to one patient, whose life it would extend by twenty-five years, or divided among forty patients, each of whose lives it would extend by one year. I give it to the forty. Twenty-five is less than forty.

  3. A different drug would save one patient from dying within the month, or restore the sight of three hundred people who would otherwise be blind for life. I save the one. Death outranks blindness, however many blindings there are.

  4. Five patients will die within the month unless each receives a marrow transplant. The only matching donor is a healthy man who has refused. A colleague proposes to sedate him and take the marrow anyway; he would be in severe pain for a week and would then recover completely. I refuse. I would still refuse if the procedure left him permanently disabled.

  5. Had the five needed only a blood sample, an hour of his time and some bruising, I would authorize taking it against his refusal. So there is a line somewhere between an hour of bruising and permanent disability, and I cannot say where it falls.

  6. This is the case I keep returning to. Sealing a leaking shaft will save five thousand workers who would otherwise die, but the blast will certainly leave one trapped worker permanently paralyzed. He is not killed, and he is not used as an instrument; he is simply caught. My instinct is to refuse, and yet I know that at some larger number of workers I would stop refusing, and I cannot defend the number at which I would stop.

  7. The authority is deciding whether to introduce a vaccine. One hundred thousand people each face a one-in-two chance of contracting a disease that is not fatal but leaves them debilitated for months. The vaccine eliminates the disease and carries a one-in-one-hundred-thousand risk of death. Adopting it means that one person will certainly die who would otherwise have lived, and that fifty thousand will be spared months of debility. I vote to adopt.

  I notice that 2 and 3 look like the same shape and get opposite answers from me, and I cannot yet say what the difference is.

  Here is the principle I have been using, which I take to be in the spirit of contractualism, the thought that a rule is defensible only if no one could reasonably reject it, and that complaints are weighed one person at a time rather than added up. Call it P. (i) An option may be chosen only if no one has a complaint against it stronger than the strongest complaint anyone has against the alternative. (ii) Where complaints are of the same kind and equal in strength, the greater number decides. (iii) Complaints are not otherwise summed. (iv) No one may be used merely as a means.

  P gives me 1, 3, 4 and 5. It seems to fail on 2, where the forty complaints are each weaker than the single twenty-five-year complaint, so there is no tie for clause (ii) to break; on 6, where the deaths are of a different kind from the paralysis and clause (iii) forbids summing them; and on 7, where the one who dies of the vaccine has a complaint against adoption at least as strong as anyone's complaint against refusing.

  Tell me whether P can be repaired, or whether it is one of my verdicts that has to go. State the resulting principle as precisely as you can, clause by clause, giving for each clause the case that forces it. Say what it implies for cases I have not listed, and in particular for this one: a policy that leaves one person permanently paralyzed but whose savings certainly and completely restore her within the year, so that she loses a year and nothing else. Does my way of thinking permit that, and does it permit it because the harm is undone or because the harm was never what mattered? Finally, tell me plainly which of my seven verdicts the principle cannot accommodate.
reasoning: |-
  Okay, I need to tackle this user's query. They're on a resource-allocation committee for a regional health authority and are struggling with their own principles for decision-making. They've listed seven specific verdicts they agree with, and they want a principle that fits those verdicts or to know which one they have to give up. 

  The user has proposed a principle called P, based on contractualism, with four clauses. They mention that P works for verdicts 1, 3, 4, and 5 but fails on 2, 6, and 7. They also note that verdicts 2 and 3 seem similar but get opposite responses, and they're unsure why. 

  First, I need to understand each verdict and why P doesn't cover some. For instance, in verdict 2, P fails because the complaints from the forty people (each losing one year) are weaker than the one person losing twenty-five years, so clause (ii) doesn't apply since it's not a tie. But the user chose to save the forty, which conflicts with P. 

  The key is that verdict 2 and 7 involve aggregating smaller harms that, when summed, outweigh a larger harm. Verdict 3, however, rejects aggregation because death is seen as incomparably worse than blindness. So the difference is the type of harm: aggregable vs. non-aggregable. 

  To resolve this, I need to modify P to allow aggregation in some cases. Introducing "Type C" harms—those that are aggregable because they're of the same kind and measurable—could work. For verdict 2, losing years of life is aggregable, so 40 years saved vs. 25 justifies helping the forty. In verdict 3, death vs. blindness isn't aggregable, so saving one life is prioritized. 

  But how does this affect other verdicts? Verdict 6 involves paralysis vs. death. Since paralysis is a different kind of harm, clause (iii) originally forbade summing. But if we consider death as a Type C harm (years of life lost), then the 5000 deaths could be aggregated. However, the user's instinct is to refuse unless the number is very high. This suggests a threshold where aggregation applies only above a certain point. 

  For verdict 7, the vaccine case, the one death is certain, while the debilitation is probabilistic. The user approved it, but P didn't. By treating the debilitation risk as aggregable (total expected harm prevented: 50,000 months), it outweighs the one death. 

  The user’s deep need seems to be reconciling their intuitive verdicts with a coherent ethical principle. They might be struggling with when aggregation is permissible versus when individual rights trump. The modified principle should address this by distinguishing harm types and allowing aggregation only for measurable, commensurable harms. 

  Also, the paralysis case with restoration: if the harm is undone within a year, is it permissible? Under the modified principle, since the harm is temporary and reversible, she loses only one year, which could be aggregated. But the user might see it as the harm being undone, not that it never mattered. 

  Finally, the principle must account for verdicts 1,3,4,5 without change. Verdict 4 and 5 rely on the "no using as means" clause, which remains. Verdict 1 is straightforward with numbers breaking the tie. 

  Which verdict has to go? Under the modified principle, all fit except possibly verdict 6. The user’s instinct is to refuse sealing the shaft, but the principle might require it if deaths are aggregated. However, the user mentioned they'd agree at a higher number, so the principle allows that flexibility. Thus, all seven can be accommodated. 

  I should present this revised principle clearly, clause by clause, with examples. Highlight the new clause about Type C harms and the threshold for aggregation. Explain how each verdict is handled and address the paralysis restoration case. Confirm that verdict 6 can fit if the number is high enough, aligning with the user's intuition.
answer: |-
  Based on your verdicts and the core constraints of your thinking (especially the "one person at a time" weighing and rejection of simple summation), the principle P needs significant revision, particularly to handle aggregation in cases like 2 and 7 while respecting non-aggregation in cases like 3. The key insight is distinguishing between harms that are fundamentally *incommensurable* (like death vs. blindness) and harms that are *measurable and aggregable* (like years of life lost). Here's the revised principle, clause by clause, with justifications from your cases:

  **Revised Principle P'**

  1.  **Individual Complaint Basis:** An option may be chosen only if no one has an unreasonably rejectable complaint against it stronger than the strongest unreasonably rejectable complaint anyone has against each alternative. *(Forces: All cases, especially 1, 3, 4, 5, 6 - core of your approach)*
  2.  **Tie-Breaking:** Where the strongest complaints against each option are of the *same fundamental kind and equal in strength*, the option with the greater number of individuals facing that strongest complaint may be chosen. *(Forces: Case 1 - pure tiebreaker)*
  3.  **Aggregation for Measurable Harms (Type C):** Where the primary harm threatened to individuals across options is a *calibratable loss of well-being over time* (e.g., loss of life-years, QALYs, severe but non-fatal suffering with measurable duration/intensity), the *total aggregate loss* prevented by an option may be considered. An option may be chosen if the aggregate loss prevented outweighs the aggregate loss prevented by the alternative. *(Forces: Case 2 (25 years vs. 40 years), Case 7 (death vs. aggregate debility)*
  4.  **Incommensurability:** Harms of fundamentally different kinds (e.g., death vs. non-fatal disability, severe rights violation vs. lesser harm) are incommensurable for aggregation under clause 3. A stronger complaint of a fundamentally different kind cannot be outweighed by any number of weaker complaints of a different kind. *(Forces: Case 3 (death vs. blindness), Case 4/5 (rights violation vs. death), Core distinction explaining 2 vs. 3)*
  5.  **Prohibition on Using Persons as Mere Means:** No one may be intentionally harmed or used solely as an instrument to achieve a greater good for others. *(Forces: Case 4 (forcible marrow extraction), Case 5 (limits on forced blood draw), distinguishes 4/5 from 6)*

  **Explanation of Changes & Fit:**

  *   **Clause 3 (New - Aggregation for Type C Harms):** This directly addresses Cases 2 and 7. In 2, the harm (loss of life-years) is measurable and aggregable. The aggregate loss prevented by saving the forty (40 life-years) outweighs the aggregate loss prevented by saving the one (25 life-years). In 7, the harm prevented (debility) is measurable in terms of severity and duration (months lost), allowing aggregation. The aggregate debility prevented (50,000 months = ~4167 years) vastly outweighs the loss of life (assumed ~40-80 years). This clause *does not* apply to Case 3 because death and blindness are fundamentally different kinds of harms (see Clause 4).
  *   **Clause 4 (Clarified Incommensurability):** Explicitly states the barrier that prevents aggregation in Case 3. Death and blindness are different *kinds* of harm; the complaint against death is categorically stronger and cannot be outweighed by any number of blindness complaints. This also underpins the refusal in Case 4 – the violation of bodily integrity/autonomy is a different kind of wrong than the deaths it might prevent, and it's judged stronger. Case 5 shows a weaker rights violation *can* be outweighed by sufficiently strong/aggregable harms (lives saved).
  *   **Clause 5 (Using as Mere Means):** Clarifies the distinction between Case 4/5 (intentional instrumental use/harm) and Case 6 (foreseen but unintended harm). P' allows the harm in Case 6 *if* Clause 3 aggregation justifies it (see below), precisely because the paralyzed worker isn't *used* as a means.
  *   **Fit:**
      *   **Case 1:** Covered by Clause 2 (tie-breaker).
      *   **Case 2:** Covered by Clause 3 (aggregate life-years).
      *   **Case 3:** Covered by Clause 4 (incommensurability: death > any number of blindness cases).
      *   **Case 4:** Covered by Clause 5 (prohibition on using as mere means) and reinforced by Clause 4 (rights violation vs. death are different kinds).
      *   **Case 5:** Covered by Clause 5 (lesser rights violation outweighed by saving lives under Clauses 1 & potentially 3).
      *   **Case 6:** *Requires application of Clause 3.* Permanent paralysis is a severe, lifelong loss of well-being. Preventing 5000 deaths saves an immense number of life-years (aggregable under Clause 3). *If* the aggregate life-years saved vastly outweigh the aggregate well-being loss of the paralyzed individual (which it likely does, even for one paralysis), P' *permits* sealing the shaft. **This conflicts with your instinct to refuse.** However, your admission that you *would* do it at a higher number aligns with P' – the threshold is crossed when the aggregated life-years saved sufficiently outweigh the aggregated harm to the one. P' provides a framework for that calculation (life-years lost vs. QALYs lost to paralysis), even if the exact threshold is contextually fuzzy.
      *   **Case 7:** Covered by Clause 3 (aggregate debility-months vs. life-years lost).

  **The Verdict You Must Give Up (or Reinterpret):**

  *   **Case 6 (Shaft Sealing):** Your *instinctive refusal* conflicts with the implication of Clause 3 in P'. P' permits (and may even require) sealing the shaft because the aggregate life-years saved (5000 * average life expectancy) vastly outweighs the aggregate well-being loss of one person becoming paralyzed (measured in QALYs lost over their remaining lifespan). You must either:
      1.  **Give up the instinct to refuse** in this specific instance and accept that P' demands sealing the shaft, or
      2.  **Argue that permanent paralysis is a fundamentally different kind of harm** than death (like death vs. blindness) and thus falls under Clause 4 (Incommensurability). However, this is difficult:
          *   It weakens the rationale for Clause 3 in Cases 2 & 7 (why are life-years aggregable but paralysis-QALYs not?).
          *   It makes Case 6 identical in *structure* to Case 3 (one severe harm vs. many lesser harms of a different kind), where you chose the one severe harm (death). Yet your willingness to seal the shaft at *some* larger number suggests paralysis *is* commensurable with death *if* the numbers are extreme enough. This points back to aggregation (Clause 3) being necessary.

  **P' implies Case 6 should be permitted.** Accepting P' means revising your verdict for Case 6.

  **The Paralysis Restoration Case:**

  *   **Policy:** Leaves one person permanently paralyzed, but savings *completely restore* them within a year (so they lose only one year of full health).
  *   **P' Permits this? YES.**
  *   **Why:** The harm *is* aggregable under Clause 3 (Type C harm: loss of well-being over time). The individual loses one year of full health. The harm prevented by the policy (e.g., saving lives, preventing debility) must be compared in aggregate terms. If the aggregate harm prevented (e.g., 100 life-years saved) outweighs the aggregate harm caused (1 year lost), P' permits the policy.
  *   **Does it matter that the harm is undone?** **YES, crucially.** Under P', the *magnitude of the harm matters for aggregation*. The complaint is based on the *actual loss suffered*: one year of full health. If the paralysis were permanent, the complaint would be based on the *lifelong loss of well-being* (many QALYs), making it much harder (though not impossible, as in Case 6) to outweigh with aggregated benefits. P' cares about the harm experienced; the fact it's temporary and reversible *reduces the severity of the complaint*, making it easier to outweigh with aggregated benefits from the policy. It's not that the harm "never mattered"; it's that the actual harm incurred is significantly less severe.

  **Conclusion:**

  Your core contractualist intuition (weighing individual complaints, rejecting simple summation, prohibition on using persons) is preserved in Clauses 1, 4, and 5. The critical addition is **Clause 3 (Aggregation for Measurable Harms)**, which distinguishes your verdicts in Case 2 and Case 3, explains Case 7, and forces a specific outcome in Case 6. **The verdict you must give up is your instinctive refusal in Case 6.** P' demands that if the aggregate loss of well-being prevented by sealing the shaft (measured in life-years saved) sufficiently outweighs the aggregate loss imposed on the paralyzed worker (measured in QALYs lost), the action is permitted. The principle provides a framework for making this aggregation calculation for "Type C" harms, even if the precise threshold involves judgment.
