prompt: |-
  I write about science and ideas for a monthly mag, and next Thursday I'm recording a long interview — podcast first, then it runs as a Q&A — with a decision theorist who's whole thing is 'superrationality': the idea that when you and the other players all know you'd reason your way to the same answer, you should pick whatever's best for all of you at once, rather than whatever's best for you given what the others do. She thinks that should be the default way to think about one-shot games, not a party trick.

  To give the interview some teeth, I've talked the magazine into running a stunt while we record, and I want the questions to keep yanking her back to it. Here's the game: we put $25,000 in escrow. Anyone can buy tickets at $2 a pop, as many as they want, and at the end one ticket gets picked at random and that person takes the whole $25,000. Ticket money doesn't go into the pot — it goes to the magazine, or to charity, whatever, just not back to the players. So if nobody buys a ticket, nobody wins anything but nobody's out anything either; if you're the only one who buys, you've basically got $25,000 for two bucks; and if everyone buys a stack, we're all shoveling money into a hole. We're still arguing about whether to put a live ticker on the page showing how many tickets have sold so far.

  Give me eight to ten questions, each with a follow-up keyed to the answer she's most likely to give. I want: one that makes her say out loud what she'd personally do in our game and defend it; one on the standard complaint that 'we'd all reason the same way' is a fantasy when the other players are a million strangers who've never heard of the puzzle — and whether her view just collapses into ordinary expected-value reasoning with an odd prior about other people; one on the ticker, and whether her answer changes once people can see the running total, and what that does to the idea that there's a single right answer; one on whether superrationality is a claim about what's rational or about what's right, because if it's the second one I want to know what's supposed to separate it from just telling people to universalize their maxims; and one on the machine version — if every entrant were the same model running the same code, is her answer different, and if so, is the theory secretly about transparency rather than about reasoning? She's slippery, and her move whenever the idealization gets pressed is some version of 'that's an objection to the idealization, not to the theory', so build the sequence so that gets harder and harder to pull. Land on one question about what evidence or result would definately change her mind. Skip the how-did-you-get-into-this stuff, and keep them short enough to actually ask out loud.
reasoning: |-
  Okay, let me tackle this query. The user is a science writer preparing for a podcast interview with a decision theorist specializing in superrationality. They're running a real-world game with $25,000 at stake to test the theory. The challenge is to craft sharp questions that force the theorist to engage with practical flaws in her framework.

  First, I need to understand the core tension: superrationality assumes all players reason identically toward a collective optimum, but the magazine's game involves strangers with no coordination. The user wants questions that expose this fragility. Key angles include: personal behavior in the game, scalability to large groups, the live ticker's impact, moral vs rational claims, and the machine analogy loophole.

  For the personal action question, I consider framing it as "What would you do right now?" to prevent hypothetical escapes. The follow-up should challenge if her theoretical stance matches real behavior. 

  On the million-strangers objection, I plan to contrast superrationality's idealization with standard expected value. The follow-up must pressure whether it collapses into odd priors rather than unique reasoning.

  The ticker question needs to probe how real-time feedback fractures the "single right answer" premise. Follow-up should question if this turns superrationality into mere coordination.

  For the rational vs moral distinction, I'll reference Kant to highlight if it's prescriptive ethics disguised as rationality. Follow-up should demand why this isn't just utilitarianism.

  The machine question aims to reveal if transparency matters more than reasoning. Follow-up could ask why identical algorithms don't resolve human cases.

  I structure the sequence to escalate pressure: start personal, then scale up to strangers, add ticker complications, examine moral claims, test with machines, and finally demand falsifiability. Each follow-up should anticipate her "idealization defense" and corner her with practical contradictions. The last question about evidence must force concrete admission of what would undermine the theory.

  Throughout, I keep questions concise for podcast delivery while ensuring they chain logically to exhaust deflection tactics. The stunt's real-time stakes should anchor every query.
answer: |-
  Here are 8 tightly-focused questions with follow-ups designed to confront superrationality with your live game, anticipate her likely defenses, and escalate pressure on the idealization:

  1.  **The Personal Stake:** "We're running this game *right now*. If you were a player seeing this webpage, knowing the rules, what would you personally do? Buy a ticket or not? Why?"
      *   *Likely Answer/Follow-up:* (If she says "Don't buy") "But if everyone reasoned like you, no one wins. Doesn't that make your choice *worse* for everyone, including you, than if you all bought one? How is that super*rational*?" / (If she says "Buy one") "Aren't you then just *hoping* others are superrational too? If even 1% aren't, doesn't your $2 become pure donation? Is hope rational?"

  2.  **The Stranger Problem:** "Superrationality assumes we all know we'll reason to the same answer. But our players are a million strangers – no shared context, no signal. Isn't 'we'd all reason the same way' a fatal fantasy here? Doesn't this *force* standard game theory?"
      *   *Likely Answer/Follow-up:* (If she downplays strangers) "But *how* do strangers magically converge on the same reasoning without communication? Isn't the superrational answer only 'obvious' *after* we agree to be superrational?" / (If she invokes reasoning) "Doesn't this just become *your own* expected value calculation with a very specific (and optimistic) prior about others' choices? Where's the distinct 'super' part?"

  3.  **The Ticker (Information & Instability):** "We might add a live ticker showing tickets sold. If players see the count rising fast, doesn't that shatter the 'single right answer'? What *is* the superrational move then – buy early? Never buy? Something else?"
      *   *Likely Answer/Follow-up:* (If she suggests a new equilibrium) "Doesn't the ticker turn this into a dynamic coordination problem *fundamentally different* from the idealized one-shot game? Doesn't this show the 'right answer' depends entirely on *contingent information*, not pure reasoning?" / (If she sticks to one answer) "How can seeing others *demonstrably not cooperating* with the superrational ideal *not* change the rational response? Isn't ignoring that data irrational?"

  4.  **Rational vs. Right:** "Is superrationality claiming this is the *truly rational* thing for an individual to do, or that it's the *morally right* thing we *should* do? If it's the latter, how is this different from Kant's 'universalize your maxim' or simple utilitarianism?"
      *   *Likely Answer/Follow-up:* (If she claims rationality) "But if rationality is about maximizing *my* expected payoff given my beliefs, and I believe others won't cooperate, isn't *not* buying the rational move? Doesn't superrationality redefine rationality?" / (If she leans moral) "Then why frame it as a theory of *rational decision*? Isn't this really an ethical prescription disguised as game theory?"

  5.  **The Machine Test (Transparency vs. Reasoning):** "Imagine every entrant was an identical AI running the *exact same code*. Is the superrational answer different here? If yes, doesn't that reveal superrationality depends on *transparency and predictability*, not some special reasoning process?"
      *   *Likely Answer/Follow-up:* (If she says it works for machines) "So the core requirement isn't 'reasoning the same,' it's 'being *known* to be identical and predictable'? Doesn't that collapse the 'reasoning' part?" / (If she says it's similar) "But humans *aren't* identical predictable machines! How can the theory bridge that chasm?"

  6.  **Escaping the Idealization Trap:** "You often say 'that's an objection to the idealization, not the theory' when pressed on real-world divergence. But our game *is* the real world – million strangers, real money. What specific, *non-idealized* feature of this situation *does* trigger the superrational solution? How does the 'magic' actually happen here?"
      *   *Likely Answer/Follow-up:* (If she invokes reasoning potential) "But without coordination, *how* does that potential translate into actual coordinated action among strangers? Isn't that potential irrelevant if it doesn't manifest?" / (If she deflects) "If the theory *only* works under strict, unrealistic idealizations, and offers no clear path to applying it here, isn't it functionally useless for this real-world test?"

  7.  **Collapse into Cooperation?** "If everyone *truly* believed superrationality would work here, they'd all buy one ticket, expecting others to do the same, and it *would* work. But doesn't this just mean superrationality, in practice, *is* a call for implicit cooperation? How is it distinct from sophisticated cooperators finding an equilibrium?"
      *   *Likely Answer/Follow-up:* (If she denies it's just cooperation) "What's the *decision-theoretic mechanism* beyond mutual recognition of a cooperative equilibrium?" / (If she accepts the link) "Then why the new term 'superrational'? Isn't this just finding a cooperative Nash equilibrium under common knowledge of rationality, which often fails with many players?"

  8.  **Falsifiability:** "What specific outcome in *this* live game – say, final ticket count significantly above or below a certain threshold – or what kind of experimental evidence *would* genuinely make you reconsider the validity or applicability of superrationality as you present it?"
      *   *Likely Answer/Follow-up:* (If she gives a vague/non-falsifiable answer) "Can you give a *concrete, measurable* prediction for this specific game that, if wrong, would challenge the core idea?" / (If she gives a specific prediction) "And if the result is drastically different (e.g., millions of tickets sold), would you conclude superrationality doesn't apply here, or that people were simply irrational? How do we tell the difference?"

  **Key Tactics Embedded:**

  1.  **Forces Personal Commitment:** Q1 makes her stake her claim.
  2.  **Attacks Scalability:** Q2 directly targets the core idealization with the game's reality.
  3.  **Introduces Instability:** Q3 uses the ticker to show how information breaks the "single answer" premise.
  4.  **Challenges Foundations:** Q4 probes if it's rationality or morality.
  5.  **Tests the Core Mechanism:** Q5 uses machines to isolate if reasoning or predictability matters.
  6.  **Confronts Idealization Directly:** Q6 pre-empts her deflection and demands real-world relevance *for this game*.
  7.  **Questions Uniqueness:** Q7 probes if it's meaningfully different from known concepts.
  8.  **Demands Falsifiability:** Q8 forces her to define what could prove her wrong.

  **Sequence Logic:** Starts personal (Q1), then immediately scales to the core problem (Q2). Introduces a complicating factor (Q3). Then probes the philosophical basis (Q4). Uses a thought experiment to isolate mechanism (Q5). Directly attacks the deflection strategy head-on (Q6). Questions the theory's distinct value (Q7). Ends by demanding scientific accountability (Q8). Each step makes the "it's just the idealization" defense harder, culminating in Q6 and Q8. Keep the stunt ("this game, right now") central. Good luck!
