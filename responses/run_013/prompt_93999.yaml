prompt: |-
  A regulator announces, in public and in advance, that it will carry out inspections without warning. A musician announces that the next album will appear with no advance notice at all. A general announces that he intends to achieve surprise. I have been collecting cases of this shape for years and have found no name for what they share — if, indeed, they share anything. In each case the announcement is meant to be believed, and in each case believing it changes the very situation announced, though I cannot tell whether it changes it enough to cancel it.

  The famous member of the family is the teacher who tells the class that there will be a test next week, on a day they cannot predict. The class reasons backward and concludes that no such test can occur; the test then arrives on an ordinary day and surprises them. I am not asking about that puzzle, which is the best-studied case. I am asking whether the family, or the sharp version of it, has a name.

  The sharp version is this. What gets announced contains a claim about the hearers' state of knowledge — that they will not have worked it out beforehand. To believe the announcement is to put it into one's reasoning; and if it is true and the hearers reason correctly from it, I think they will have worked it out beforehand, which makes it false. It cannot be both true and generally believed. It is a fact that cannot survive being shared.

  Three neighbours to be separated from it. It resembles the self-defeating prophecy, in which a prediction fails because people act on it — but here nobody acts, they only reason. It resembles the thought that measuring a thing changes it — but nothing here is measured or disturbed, and the damage comes from belief rather than interference. And it resembles ordinary secrecy, which is plainly different, since a secret is destroyed by disclosure, not by belief.

  Does the sharp case have an established name, and do the puzzles built on it? If not, coin a term and define it so as to exclude ordinary secrets, self-defeating predictions, and mere failed predictions. Then mark its edges: what must be true of a case for the fact to survive being widely known, and do any of my three opening cases survive it? I care more about the boundaries than about the label. In under 350 words, beginning with the term you think fits best.
reasoning: |-
  Hmm, the user is describing a fascinating logical paradox where announcing something about future knowledge or surprise undermines the very possibility of that surprise. They've collected various examples - regulators, musicians, generals - all sharing this structure where the announcement claims the audience won't anticipate the event. The core tension is that believing the announcement allows perfect reasoning that prevents surprise, making the announcement false.

  The user explicitly distinguishes this from three neighbors: self-defeating prophecies (which require action), measurement disturbance (physical interference), and ordinary secrecy (destroyed by disclosure). They want a precise term for the "sharp version" where mere belief through reasoning creates the paradox, and asks about boundaries - when does such a fact survive being widely known?

  The kindergarten test paradox is mentioned as a famous example but they're focused on the broader pattern. Their examples vary in validity: the regulator case seems solid since surprise enables compliance; the musician's announcement might still work if fans don't constantly check; the general's claim seems weakest as war inherently resists perfect prediction.

  For terminology, "epistemic paradox" is too broad. "Self-refuting announcement" captures the core mechanism where the statement invalidates itself through being believed. Defining it sharply: a declaration that, when believed and reasoned with, logically prevents its own truth by enabling anticipation of the event it describes.

  Boundaries matter most: the fact survives only if reasoning is imperfect. In the regulator case, if firms doubt inspections will occur despite the announcement, surprise remains possible. Similarly, if the musician's audience reasons incorrectly (e.g., dismissing "no notice" as hype), the album drop stays surprising. The general's case likely fails because military surprise depends on multiple unpredictable factors beyond mere announcement.
answer: |-
  The sharp case is best termed an **epistemic self-refuting announcement**. It is a declaration asserting that a future event will occur, and crucially, that the audience will be unable to deduce its exact occurrence beforehand based on the declaration itself. When believed and correctly reasoned with, this belief enables the audience to deduce the event, rendering the announcement false. The fact it describes *cannot be both true and universally believed by rational agents*.

  **Boundaries:** For the fact (the surprising event) to survive widespread belief:
  1.  **Imperfect Reasoning:** The audience must be unable to perfectly apply the announcement's logic to deduce the timing. This could be due to computational limits, ambiguous criteria, or competing information.
  2.  **Partial Belief/Trust:** Not everyone fully believes the announcement or trusts the announcer's capability/intent to execute the surprising event as described.
  3.  **External Complexity:** Factors beyond the announcement's logic (chance, independent events, complex systems) must inherently prevent perfect prediction, even with the announcement.

  **Evaluating the cases:**
  1.  **Regulator:** *Likely survives.* Firms know inspections happen, but the complexity of their own compliance schedules and the regulator's resources makes deducing the *exact* timing impossible solely from the announcement, even if believed. Imperfect reasoning and external complexity apply.
  2.  **Musician:** *Possibly survives.* Fans believe the album drops "with no notice," but they can't know *when* the artist decides it's ready. If fans assume it could literally happen any second, they might constantly check, negating surprise. However, if fans reason imperfectly (e.g., "no notice soon, but probably not *this* minute") or life's complexity distracts them, surprise remains possible.
  3.  **General:** *Likely fails.* Announcing the *intent* for surprise is fundamentally paradoxical. Rational enemies, believing the general *can and will* achieve surprise, incorporate this into all assessments. This makes achieving genuine strategic surprise against a fully alert, reasoning adversary logically impossible based solely on that announcement. It becomes a self-refuting boast.
