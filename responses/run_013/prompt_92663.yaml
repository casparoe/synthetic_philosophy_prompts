prompt: |-
  I'm a journalist covering science and ideas, and I've been sitting in on a workshop about the common prior assumption — you know, the idea in game theory that rational agents' disagreements in belief are supposed to come down to differences in information, because everyone starts from the same prior. A game-theorist friend of mine, who is much smarter than me, gave me this argument over coffee and I can't find the exit. I'm on deadline and this is rough, so please excuse the typos.

  The argument:

  (1) Two agents who are both fully rational and have the same total evidence should assign the same credence to any proposition.

  (2) If they assign different credences, then either their evidence differs or at least one of them is irrational.

  (3) In any persistent disagreement that has been discussed at length, each agent knows the other's credence and the other's evidence.

  (4) So if they still disagree after discussing it at length, the difference must come from their priors.

  (5) But priors can't just be chosen; if both are rational, they must share a common prior, otherwise their disagreement is a failure of rationality.

  (6) Therefore any persistent disagreement between two agents who have discussed the matter at length means at least one of them is irrational.

  (7) But we see persistent disagreement among people who seem fully rational and who have discussed things at length — philosophers, economists, my friend and me after two hours.

  (8) So either almost everyone is irrational, or the standard picture of rationality is impossible. That seems to prove too much.

  I'd rather keep (1) and (2) than (7). I think (7) is obviously true. So where does this go wrong? Which premise or step should I reject, and what does rejecting it cost me? Is there a subtle equivocation, or is the argument valid and I just have to give up something I like? I can't seperate the steps, and I'm definately not trying to score points off anyone.

  You're a game theorist and philosopher of science who works on epistemic game theory and the foundations of rational choice. Think carefully, and start with a short brainstorm of at least three candidate diagnoses before you commit. Then pick the one you think is best and explain why the premise looked fine, what exactly goes wrong, and what the alternatives cost. If there's a standard move here, name it and say whether it works. I don't need citations or a reading list — I can't check them anyway. Please write in British English, and don't just tell me the argument is wrong — I need the diagnosis.
