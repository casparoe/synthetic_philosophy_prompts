prompt: |-
  I'm drafting the criteria section of a paper on the prospects for a naturalistic account of mental content, and I've realised that my co-author and I have spent a month arguing past each other because we each hold candidate theories to a different set of demands. Before we go further I want the specification written down on its own terms: what any theory of representation for cognitive systems has to deliver, set out so that it could serve as a checklist for someone who is not a philosopher — a comparative psychologist deciding whether to describe a bird's memory for a cache site as representing a location, or an engineer asking whether the internal map in her robot genuinely represents the room. Fix the purpose there, at a theory good enough to license content attributions in ordinary scientific and engineering practice, rather than one good enough only for a seminar.

  The requirements should each be motivated by a case, and I would rather they be cases a reader can assess on the spot than ones that presuppose the literature. So work in at least these: a frog that snaps at anything small, dark and moving, edible or not, and whose visual machinery is the same whether a fly or a pellet is in view; a bacterium that reaches the oxygen-poor sediment by swimming along the earth's magnetic field lines with a chain of magnetite crystals inside it, a trick that gets it to the right depth only because of a contingent feature of the planet; a gland that secretes a compound in exact proportion to blood glucose but that nothing downstream ever reads, so that only an endocrinologist with a syringe notices the correlation; a bird that learns to find its caches by a coloured plastic flag that no member of its species has encountered before; a neural culture grown in a dish and coupled to a robot arm, selected over many generations in simulation for seeking a light source, so that it has a selection history but no evolution and no designer who knew what he was doing; and a state that appears to be at once a description of how things stand and an instruction to act, so that one cannot decide whether it says that a predator is above or says to climb. For each requirement, give the case that forces it, one line on why it forces it, and a verdict on whether it is a genuine constraint on any theory or merely a working assumption of one camp — and if the latter, say which camp. I also want the distinctions the list must preserve kept separate and explicit: content against mere indication or symptom, content against reference, representing against being disposed to respond, original against derived intentionality, error against malfunction, and determinate against indeterminate content.

  Then the part I actually care about: say which requirements cannot all be met at once. I suspect at least one such set exists, and I want the argument rather than a shrug — the candidates worth testing are the trio of naturalistic determination, determinate content, and the possibility of error; the pair of compositional content and content fixed by a state's function in the whole system; and the pair of content being fixed by history and content being needed to explain the behaviour of a creature that has no history. Rank the tensions by what they cost, say what a theory must surrender for each, and tell me which single requirement, if enforced, eliminates the most otherwise respectable contenders. Finish with a short paragraph scoring the main families — covariance or information-based accounts, teleological accounts, functional-role accounts, and interpreter- or practice-based accounts — against the list, two or three sentences each; I will do the longer treatment myself.
reasoning: |-
  Okay, the user is drafting a paper on naturalistic accounts of mental content and needs a clear set of criteria for evaluating theories of representation. They want a checklist that's practical for non-philosophers like psychologists or engineers. They provided specific cases to ground each requirement, such as the frog snapping at anything small and dark, or the bacterium using magnetite to navigate. 

  First, I need to ensure each requirement is tied to one of their cases. The user emphasized avoiding literature-heavy examples, so I'll stick to their given scenarios. Each requirement should address the distinctions they mentioned: content vs. mere indication, original vs. derived intentionality, etc. 

  Looking at their cases: The frog example highlights misrepresentation—it snaps at pellets, not just flies. That forces a need for error possibility. The bacterium’s navigation relies on Earth's magnetic field, which is contingent, so content must be robust to such contingencies. The gland secreting glucose-proportional compound without being "read" shows that indication alone isn't enough; downstream use is key. 

  The bird with the plastic flag demonstrates novelty handling, which challenges covariance theories. The lab-grown neural culture has selection history but no evolution or designer, pushing against teleological accounts that rely on evolution. The state that’s both description and instruction (e.g., "predator above" vs. "climb") touches on the dual nature of content. 

  Now, tensions: The user suspects conflicts, like naturalistic determination vs. determinate content vs. error possibility. If content is determined by natural causes (covariance), it might be too indeterminate (frog's state represents "fly or pellet?"). Teleosemantics ties content to function but struggles with novelty (bird's new flag). Functional role might over-generate content for unused states (gland secretion). 

  For the scoring section, info-based accounts fail novelty and misrepresentation; teleological ones handle error but falter with lab-evolved systems; functional role accounts struggle with unused indicators; interpreter-based accounts need a community, which neural cultures lack. 

  The user’s deeper need is resolving co-author disagreements by clarifying non-negotiable criteria. Highlighting tensions (e.g., surrendering determinacy for error) will structure their debate. The single strictest requirement is probably error possibility—it cuts down many theories that can't distinguish malfunction from false representation. 

  Finally, ensuring the checklist is actionable: Each requirement has a case, motivation, verdict (constraint vs. camp assumption), and preserves distinctions explicitly. The conclusion on tensions should guide their theory choice by trade-offs. The scoring is concise, setting up their deeper analysis.
answer: |-
  Here is a specification of requirements for a theory of mental content, grounded in your cases, designed for scientific/engineering application, preserving key distinctions, and analyzing tensions:

  **Core Distinctions Preserved:**
  1.  **Content vs. Mere Indication/Symptom:** Content plays a functional role *for the system*; mere indication is a reliable correlation observed externally.
  2.  **Content vs. Reference:** Content is *what is represented* (e.g., "fly there"); reference is *what it is about* (e.g., the specific fly).
  3.  **Representing vs. Disposed to Respond:** Representing involves an internal state standing in for something else, guiding flexible behavior; mere disposition is direct causal triggering.
  4.  **Original vs. Derived Intentionality:** Original intentionality is non-derived meaning inherent to biological cognitive systems (if it exists); derived intentionality is assigned by users/designers (e.g., words, traffic lights).
  5.  **Error vs. Malfunction:** Error is representing falsely when the system is functioning *correctly*; malfunction is faulty operation preventing correct representation/response.
  6.  **Determinate vs. Indeterminate Content:** Determinate content specifies *exactly* what is represented; indeterminate content is vague or ambiguous (e.g., "fly?" vs. "small dark moving thing?").

  **Requirements for a Theory of Representation (with Cases & Motivating Rationale):**

  1.  **Misrepresentation/Error Possibility:** *Case:* Frog snapping at inedible pellet. *Why:* The frog acts *as if* a fly is present when it isn't. A theory must distinguish this *false representation* from mere malfunction or absence of response. *Verdict:* Genuine Constraint (Needed for scientific explanations of maladaptive behavior).
  2.  **Robustness to Contingency:** *Case:* Bacterium navigating via magnetic field. *Why:* The magnetite chain reliably correlates with oxygen-poor sediment *only* due to Earth's specific magnetic field/depth correlation. A theory must explain why the content is "low oxygen zone" (successful) or "south" (reliable indicator) rather than "magnetic field line direction" (direct cause) or "sediment depth" (contingent correlation). *Verdict:* Genuine Constraint (Needed to explain how systems exploit reliable but non-necessary correlations).
  3.  **Downstream Consumability (Not Mere Indicator):** *Case:* Glucose-secreting gland. *Why:* The secretion perfectly indicates blood glucose but is *not used* by any other system state to guide behavior or physiology *within the organism*. It lacks functional role *for the system*. *Verdict:* Genuine Constraint (Preserves Content vs. Mere Indication; rules out pure covariance).
  4.  **Novelty Handling/Productivity:** *Case:* Bird using novel colored flag for cache. *Why:* The bird can represent a *specific, never-before-encountered* feature (the new flag color) as signifying the cache location. A theory must explain how new representations (or tokens of a general type) can be formed/used. *Verdict:* Genuine Constraint (Essential for learning, flexibility, explaining non-innate behaviors).
  5.  **Applicability to Ahistorical/A-Design Systems:** *Case:* Lab-evolved neural culture robot. *Why:* The system has selection history *for* seeking light, but no natural evolution or intentional designer imbuing states with meaning. A theory must account for its states having content ("light source location"?) based on its *current* functional organization and history *within the experiment*, not requiring phylogeny or designer intent. *Verdict:* Genuine Constraint (Crucial for AI, synthetic biology, understanding evolved systems without assuming irreducibility).
  6.  **Determinacy of Content:** *Case:* State seeming both "predator above" (description) and "climb!" (instruction). *Why:* Attributing content requires specifying *what* is represented. Is it a state of affairs, a goal, a command? Ambiguity hinders prediction and explanation. *Verdict:* Genuine Constraint, but potentially difficult to fully satisfy (Needed for precise scientific attribution).
  7.  **Function-Sensitivity (for Original Intentionality):** *Case:* Frog visual state; Bacterium magnetosome state. *Why:* The content of a state seems tied to what it is *supposed to do* for the system – detect food, navigate to optimal environment. *Verdict:* Working Assumption (Primarily of Teleological Camp; functional-role accounts also value function but differently).
  8.  **Naturalistic Determination:** *Case:* All biological cases (Frog, Bacterium, Bird). *Why:* Content must be fixed by natural, non-semantic, non-intentional properties of the system and its environment/history. *Verdict:* Genuine Constraint (Core to naturalism; rules out magical or irreducibly semantic properties).

  **Tensions and Costs:**

  1.  **Naturalistic Determination + Determinate Content + Error Possibility:** This is the hardest tension.
      *   **Tension:** Naturalistic determination (e.g., covariance, causal history) often yields indeterminacy (Frog: "small dark moving thing" vs "food" vs "fly?"). Fixing determinacy (e.g., via selected function) can make error difficult without invoking norms beyond current dispositions/history. Naturalistic norms (evolution) are coarse-grained.
      *   **Cost:** Theories usually sacrifice full determinacy ("Frog Food" is indeterminate between flies/pebbles in function/covariance) or posit non-obvious naturalistic norms (complex teleosemantics). *Surrendering sharp determinacy is often the cost.*
      *   **Rank:** Highest Cost (Threatens core naturalism or explanatory precision).

  2.  **Compositional Content + Content Fixed by Systemic Function:**
      *   **Tension:** Compositionality suggests content depends on constituent structure and combinatorial rules. Systemic function suggests content depends on the role the *whole complex state* plays in the system's overall behavior (e.g., the "predator above/climb" state).
      *   **Cost:** Theories focus on one aspect. Purely functional-role accounts struggle with compositionality. Purely syntactic/compositional accounts (hard to naturalize) may ignore systemic role. *Surrendering either full compositionality or a strong holistic functional role is common.*
      *   **Rank:** Medium Cost (Crucial for complex cognition vs holistic explanation).

  3.  **Content Fixed by History + Content Needed for Ahistorical Systems:**
      *   **Tension:** Teleosemantics grounds content in evolutionary history. The lab-evolved robot has a *simulated* selection history, not a natural one. Does its history "count"? Can content exist *without* any history (e.g., a newly created AI)?
      *   **Cost:** Strict teleosemantics must deny content to the lab-robot or argue its history is sufficient (surrenders "natural evolution" requirement). Non-historical theories (e.g., functional role, interpreter) must explain how content arises *de novo* (potentially surrendering the role history plays in fixing biological content). *Surrendering strict reliance on natural evolutionary history is the most common cost paid to include lab/AI systems.*
      *   **Rank:** Medium Cost (Impacts scope of the theory).

  **Most Eliminative Requirement:** **Error Possibility.** Enforcing a robust account of error (distinct from malfunction, under naturalistic constraints) eliminates pure covariance/informational theories (fails Frog), simplistic teleosemantics (struggles with Frog/Bacterium determinacy), and interpreter theories without robust norms. It forces theories to grapple with normativity naturalistically.

  **Scoring Major Families:**

  1.  **Covariance/Information-Based:** *Fails:* Robustness to Contingency (Bacterium), Downstream Consumability (Gland), Misrepresentation (Frog - calls pellet "food"), Novelty (Bird - how new flag covaries?), Determinacy (Frog). *Strength:* Naturalistic Determination.
  2.  **Teleological (Selected Function):** *Fails:* Novelty (Bird - how selected function applies to *new* flags?), Applicability to Ahistorical Systems (Lab Robot - is artificial selection enough?), Determinacy (Frog - "Food" is coarse; Bacterium - "O2 poor" or "South"?). *Strength:* Error Possibility (via malfunction distinction), Function-Sensitivity, often Robustness.
  3.  **Functional-Role (Causal/Inferential Role):** *Fails:* Downstream Consumability (Gland - might assign unused state a role?), Determinacy (Predator/Climb state ambiguity), Naturalistic Determination (Roles can be multiply realizable/hard to naturalize uniquely), often Error (depends on role specification). *Strength:* Novelty (new states get roles), Compositionality potential, Function-Sensitivity.
  4.  **Interpreter/Practice-Based:** *Fails:* Downstream Consumability (Gland - endocrinologist interprets it!), Original Intentionality (attributes derived intentionality *to* the system), Applicability to Ahistorical Systems (Lab Robot - needs interpreter community?), Naturalistic Determination (depends on interpreters). *Strength:* Error Possibility (by interpreter norms), Determinacy (by interpretation), Novelty (interpreters handle it).

  This checklist provides a concrete, case-driven basis for evaluating theories against the demands of scientific and engineering practice, explicitly handles key distinctions, identifies core tensions with their costs, and offers a preliminary comparative assessment.
