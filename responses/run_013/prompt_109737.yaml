  ### Desiderata for a Theory of Rational Play in One-Shot Games
  Below are the core requirements any theory of rational play must satisfy, grounded in non-negotiable cases, distinctions, and results. Each requirement is justified by a specific case or logical imperative that forces its inclusion.

  #### **Cases the Theory Must Get Right**
  1. **Prisoner's Dilemma (Defection must be prescribed)**  
     *Why*: Rational players must not cooperate when defection is strictly dominant, as mutual defection is the only outcome immune to unilateral deviation.  
  2. **Battle of the Sexes (Multiple valid equilibria)**  
     *Why*: When coordination has multiple Pareto-efficient solutions (e.g., Ballet or Boxing), the theory must admit multiple rational outcomes without forcing a unique choice.  
  3. **Matching Pennies (Mixed strategies required)**  
     *Why*: In zero-sum games with no pure strategy equilibrium, randomization is necessary; a theory failing to prescribe mixed strategies cannot resolve conflict.  
  4. **Traveler's Dilemma (IESDS leads to minimum claim)**  
     *Why*: Iterative elimination of strictly dominated strategies (IESDS) uniquely selects the worst payoff (e.g., both claiming $2 in a \$2–\$100 game). The theory must respect IESDS when applicable, even if humans deviate.  
  5. **Centipede Game (Immediate termination in backward induction)**  
     *Why*: In sequential games, backward induction must prescribe ending immediately (e.g., taking \$2 instead of risking a pot that doubles), as later moves are non-credible threats.  
  6. **Never-Best-Response Game (e.g., strategy C in a modified coordination game)**  
     *Why*: If a strategy is **never a best response** to any opponent play (pure or mixed), it must be excluded, even if not strictly dominated by any *single* alternative (e.g., C is dominated only by a mix of A and B).  

  #### **Distinctions That Must Not Collapse**
  7. **Strict vs. Weak Dominance**  
     *Why*: Weakly dominated strategies (e.g., bidding \$50 in a sealed-bid auction where truth-telling is weakly dominant) can be part of equilibria, but strictly dominated strategies (e.g., defection in PD) must always be excluded. Order matters in weak dominance elimination but not strict.  
  8. **Never-Best-Response vs. Dominated**  
     *Why*: In two-player games, "never a best response" ⇔ "strictly dominated by a mixed strategy" (Pearce’s Lemma). Collapsing these ignores that a strategy can be beaten only by mixes, not pure alternatives.  
  9. **One-Shot vs. Repeated Play**  
     *Why*: Tit-for-tat thrives in repeated PD but fails in one-shot; theories must not conflate long-term incentives with static rationality.  
  10. **Known vs. Possible Beliefs**  
      *Why*: Rational play depends on beliefs about opponents. A theory must distinguish between *known* rationality (e.g., common knowledge) and *possible* irrationality (e.g., Traveler's Dilemma experiments).  

  #### **Results That Must Not Be Contradicted**
  11. **Existence of Mixed-Strategy Equilibrium (Nash’s Theorem)**  
      *Why*: Every finite game has at least one Nash equilibrium in mixed strategies; a theory denying this fails for games like Matching Pennies.  
  12. **IESDS Order Independence (Strict Dominance)**  
      *Why*: Order of elimination doesn’t affect the outcome under strict dominance (e.g., PD), but it does under weak dominance. A theory must preserve this invariance.  
  13. **Worse-Than-Mix but Better-Than-Pure**  
      *Why*: A strategy can be strictly dominated by a mix of others but still outperform each pure alternative in some cases (e.g., C yields 1 when opponents play X or Y, while A/B yield 0 in those cases, yet a mix of A/B dominates C).  

  ---

  ### **The Incompatibility: What Cannot Be Had at Once**
  - **Uniqueness, Existence, and Behavioral Plausibility are jointly unsatisfiable.**  
    - *Why*:  
      - **Existence** (Nash’s theorem) guarantees a solution in every game.  
      - **Uniqueness** demands one rational outcome in all games.  
      - **Behavioral Plausibility** requires alignment with human play (e.g., Traveler's Dilemma, where humans reject the IESDS-prescribed minimum claim).  
    - **Conflict**: IESDS ensures uniqueness in games like Traveler’s Dilemma but yields counterintuitive results. Relaxing IESDS for plausibility (e.g., allowing higher claims) violates dominance rationality. Nash equilibria exist but aren’t unique (Battle of Sexes), and refining them (e.g., with trembling-hand perfection) won’t resolve Traveler’s Dilemma plausibly.  

  **The Real Result**: No theory can simultaneously provide a **unique** rational prescription in **all games** while being **consistent with human behavior** and respecting **strict dominance**. Trade-offs are unavoidable.

  ---

  ### **The Most Impactful Requirement**
  - **"No Strictly Dominated Strategies Allowed" kills the most theories.**  
    - *Why it’s powerful*: It’s non-negotiable (playing a strictly dominated strategy is indefensible) and propagates through IESDS. Theories violating it (e.g., naive cooperation in PD) are immediately invalid.  
    - *Why it’s not rigged*: It follows from minimal rationality—if a strategy is always worse, no rational player chooses it.  
    - *Casualties*:  
      - Theories allowing dominated moves (e.g., cooperative PD).  
      - Theories ignoring mixed-strategy dominance (e.g., "plain" IESDS without mixed strategies).  

  ---

  ### **Evaluation of Solution Concepts**
  | **Concept**               | **Performance Against Desiderata**                                                                 | **Key Failure**                                                                 |
  |---------------------------|---------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|
  | **Plain Crossing-Off**    | Fails cases 6, 11, 13. Cannot handle mixed dominance or games with no pure equilibria.           | Misses strategies dominated only by mixes (e.g., C in never-best-response games). |
  | **IESDS (Mixed Allowed)** | Passes 1–4, 6, 11–13. Fails 2 (multiple rationalizable strategies), 5 (sequential games).       | Leaves multiple options in coordination games; no selection mechanism.          |
  | **Never-Best-Response**   | Equivalent to IESDS (mixed) in two-player games. Same as above.                                  | Same as IESDS (mixed).                                                         |
  | **Nash Equilibrium**      | Passes 1–3, 11. Fails 4 (Traveler’s Dilemma NE matches IESDS), 5, 7 (allows weakly dominated). | Allows weakly dominated strategies; doesn’t refine multiple equilibria.        |
  | **Backward Induction**    | Passes 1, 5. Fails 2–4, 6–13 (only applies to sequential games; irrelevant for one-shot normal form). | Inapplicable to simultaneous-move games.                                      |

  ---

  ### **Conclusion**
  - **Best Compromise**: **Rationalizability (via IESDS with mixed strategies)** satisfies all distinctions and results (1–13) but fails uniqueness. It provides the set of non-dominated strategies without pretending to resolve genuine indeterminacy (e.g., Battle of Sexes).  
  - **Trade-off**: Accept non-uniqueness where it exists. For sequential games, add **subgame perfection** (backward induction) to refine Nash equilibria.  
  - **Final Reality**: Rational play in one-shot games is **set-valued** (rationalizability) or **equilibrium-based** (Nash) but cannot be unique, behaviorally plausible, and dominance-respecting simultaneously. The tension in Traveler's Dilemma exemplifies this—rationality (as defined) diverges from human intuition.
