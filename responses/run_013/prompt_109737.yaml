          - We can have a solution concept that always gives a non-empty set of solutions (like Nash, which always exists). If we refine it by admissibility and other criteria, we might get a solution that is sometimes unique (when IESDS leads to a unique outcome) and sometimes not (like Battle of the Sexes). But note: in Battle of the Sexes, there are multiple perfect equilibria? Actually, the pure strategy equilibria (T,L) and (B,R) are both perfect. So it doesn't force uniqueness when there isn't one.

          - There is no solution concept that is always unique and also sometimes non-unique? That doesn't make sense.

          - What we can have is a solution concept that is always non-empty, and in games where there is a unique rationalizable strategy profile, it gives that, and in games with multiple, it gives a subset of the rationalizable set (but not necessarily all). But then we lose the ability to say that all rationalizable strategies are rational.

          - Alternatively, we can use the rationalizable set to describe all strategies that a rational player might play. Then in the Traveler's Dilemma, it is unique (so definite), and in Battle of the Sexes, it is the entire set (so we don't lie: there are multiple). But then we haven't told the player which one to choose.

          - So the answer to the question is: the rationalizability solution concept (which is IESDS with mixed strategies) will give a non-empty set in every game, and that set is the set of all strategies that are best responses to some belief about the opponent. In games with a unique IESDS outcome, the set is a singleton. In games with multiple, it is larger. So it doesn't force a single answer when there isn't one.

          - However, it does not tell you what to do when there are multiple. So it does not provide a definite answer in every game? It provides a set.

          - But the question asks for a definite answer in every game. That would require a selection from the rationalizable set. And that selection should be such that it is consistent across players (so they coordinate on the same equilibrium). That is what Nash equilibrium does for some games, but not all.

   Therefore, the real issue is that we cannot have a solution concept that is always single-valued and also sometimes multi-valued. But we can have a solution concept that is always non-empty and sometimes single-valued and sometimes multi-valued. And that is what rationalizability (or Nash equilibrium) does.

     The bottom line: the rationalizability concept (or Nash equilibrium) meets most of the requirements, except for uniqueness and admissibility. If we require admissibility, we can use perfect equilibrium, which also always exists but may not be unique. And if we also require uniqueness, we are out of luck.

     In summary, we can't have it all.
