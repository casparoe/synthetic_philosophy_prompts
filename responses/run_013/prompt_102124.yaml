prompt: |-
  In a graduate seminar I am taking on skill and expertise, a fellow student brought a discussion of whether a system that has read every repair manual ever written can be said to know how to rebuild an engine to a halt with the line "you can't learn to ride a bicycle from a book," and the room treated the matter as settled. I doubt the sentence can bear that weight without further specification, and I want to see precisely what work it could be doing. Set out, as a menu rather than a single interpretation, the distinct claims that one-liner might be making, ranging from the nearly trivial to the radical, and for each say whether it is a platitude, a substantive and defensible thesis, or false. Separate along the way the claims that concern how a skill is acquired from the claims that concern what a skill is, and distinguish the modest thesis that propositional knowledge is not sufficient for skilled performance from the stronger thesis that knowing how is not a species of knowing that at all, saying what turns on the difference. Where they fit, treat the intellectualist position associated with Stanley and Williamson, the anti-intellectualist position Ryle argued for, and the tacit-knowledge tradition associated with Polanyi as candidate readings, and state which reading each of them would have to reject. I especially want to know which of the readings would actually license my classmate's dismissal of the manual-reading system's claim to know how, and which would leave that question open or tell against the dismissal. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Hmm, the user is asking about the philosophical implications of the statement "you can't learn to ride a bicycle from a book." They're in a graduate seminar on skill and expertise where this was used to dismiss the idea that a system reading all repair manuals could know how to rebuild an engine. They want me to break down the possible interpretations of that statement, ranging from trivial to radical.

  I need to analyze this from multiple angles. The key distinctions include: claims about skill acquisition versus the nature of skill itself, and the difference between propositional knowledge not being sufficient for skilled performance versus the stronger claim that "knowing how" isn't a type of "knowing that" at all. 

  The philosophical positions involved are intellectualism (Stanley & Williamson), anti-intellectualism (Ryle), and tacit knowledge (Polanyi). I should explain which interpretations each would reject. Most importantly, I need to identify which readings would actually support dismissing the manual-reading system's knowledge claim.

  The main interpretations of the bicycle quote include:
  - The trivial claim that books alone don't produce physical ability
  - The moderate view that motor skills require proprioceptive feedback
  - The stronger Rylean view that skills are dispositions rather than knowledge
  - Polanyi's idea of tacit knowledge beyond articulation
  - The radical anti-intellectualist view that know-how is fundamentally non-propositional

  For each, I'll assess whether it's platitude, defensible thesis, or false, and note which positions must reject it. The interpretations that would actually license dismissing the AI system are those denying that propositional knowledge constitutes know-how (like Ryle's view), while intellectualist positions would leave it open.

  I should structure this clearly with the bottom line first as requested, then present the menu of interpretations with all the required distinctions and assessments.
answer: |-
  Your classmate's dismissal rests on specific anti-intellectualist readings of the bicycle claim; intellectualist or tacit-knowledge readings leave it open or undermine the dismissal. Here is the menu of distinct claims the one-liner might express, separated by acquisition vs. nature and sufficiency vs. non-propositionality, with assessments and key rejections:

  **I. Claims about Skill Acquisition (How Skills are Gained)**
  1.  **Platitudinous Acquisition Claim:** Books alone cannot generate the *physical ability* or *neuromuscular coordination* required for bicycle riding. *(Assessment: Platitude. True but trivial. All positions accept this. Doesn't settle the AI case, as rebuilding an engine might not require identical physical coordination.)*
  2.  **Moderate Acquisition Claim:** Acquiring physical skills like cycling *necessarily requires* specific types of sensory-motor feedback (e.g., proprioception, balance) and iterative practice *in the relevant environment*, which books cannot provide. *(Assessment: Substantive & defensible thesis. Widely accepted in motor learning. Ryle, Polanyi agree; Intellectualists (Stanley & Williamson) could accept, emphasizing the need for practical modes of presentation. Licenses dismissal only if rebuilding an engine is deemed a physically analogous skill requiring such feedback.)*
  3.  **Radical Acquisition Claim:** *All* skill acquisition, even intellectual skills, fundamentally requires embodied, situated practice; propositional instruction is always insufficient. *(Assessment: Controversial thesis (e.g., radical embodied cognition). Polanyi might sympathize; Ryle focuses more on nature than acquisition; Intellectualists reject. If true, licenses dismissal of the AI, but highly debatable for engine rebuilding.)*

  **II. Claims about the Nature of Skill/Know-How (What Skill/Know-How Is)**
  4.  **Sufficiency Claim (Modest):** Possessing *all* relevant propositional knowledge (knowing-that) about an activity is *not sufficient* for possessing the skill/know-how to perform it competently. *(Assessment: Substantive & defensible thesis. Agreed upon by Ryle, Polanyi, *and* Stanley & Williamson. Intellectualists accept this; knowing-that is necessary but not sufficient for know-how. Rejected only by crude propositional sufficiency views. Licenses dismissal of the AI *only if* the AI *merely* has propositions without the required practical abilities/conceptions - but leaves open that know-how *could* be propositional if those abilities are present.)*
  5.  **Tacit Knowledge Claim:** Skillful performance fundamentally relies on *tacit knowledge* – knowledge that cannot be fully articulated or captured in propositions/manuals (e.g., "the feel" of balance, intuitive judgment). *(Assessment: Substantive & defensible thesis (Polanyi). Rejected by strong intellectualism (Stanley & Williamson) which argues all know-how can be propositionally specified under practical modes of presentation. Ryle rejects "knowledge" talk for skills. If true and applicable, suggests manuals are inherently incomplete, licensing dismissal of the AI as lacking crucial tacit elements.)*
  6.  **Anti-Intellectualist Nature Claim (Rylean):** Know-how is *not a species of knowing-that at all*; it is a *disposition* or complex *ability* to perform reliably and intelligently. Propositions describe but do not constitute the skill. *(Assessment: Substantive thesis (Ryle's core argument). Directly rejected by Intellectualism (Stanley & Williamson); tacit knowledge views (Polanyi) often align more with this than intellectualism. If true, the AI only has *knowledge about* rebuilding engines, not *knowledge how*, no matter how many manuals it reads. This most directly licenses your classmate's dismissal.)*
  7.  **Radical Anti-Propositional Claim:** Know-how is a fundamentally *non-representational*, embodied capacity; it is entirely divorced from propositional structure. *(Assessment: Controversial/Radical thesis (e.g., extreme enactivism). Rejected by Intellectualism, Tacit Knowledge (which often implies *unarticulated* propositions), and arguably by Ryle (who saw dispositions as conceptually governed). If true, the AI is fundamentally incapable of know-how. Licenses dismissal.)*

  **What Turns on Sufficiency vs. Non-Propositionality:**
  *   **Sufficiency (Claim 4):** Focuses on the *gap* between theory and practice. The AI might have all the "knowing-that" but still lack know-how because know-how requires *something else* (e.g., ability, conception, practical grasp). This leaves open that know-how *involves* knowing-that plus this "something else".
  *   **Non-Propositionality (Claims 5, 6, 7):** Focuses on the *fundamental character* of know-how. If know-how is tacit (5), dispositional (6), or non-representational (7), it asserts that know-how is *not constituted by* propositions, even if propositions can describe it. This directly challenges the idea that accumulating propositions (reading manuals) can ever *be* or *constitute* know-how.

  **Candidate Readings & Their Necessary Rejections:**
  *   **Intellectualism (Stanley & Williamson):** Must reject Claims 5 (Tacit Knowledge *as non-propositional*), 6 (Anti-Intellectualist Nature), and 7 (Radical Anti-Propositional). They accept Claim 4 (Sufficiency) but argue know-how *is* a type of knowing-that (under a practical mode of presentation). For them, the bicycle claim highlights the need for *practical conception/ability*, not that know-how is non-propositional. The AI *could* know-how if it possesses the relevant practical conceptions/abilities *alongside* the propositions.
  *   **Anti-Intellectualism (Ryle):** Must reject the core intellectualist thesis that know-how is knowing-that. Ryle would wholeheartedly endorse Claim 6 and likely see Claims 2 & 4 as consequences. He might be agnostic or skeptical about Claim 5 (tacit *knowledge*). Claim 6 is his weapon against the AI.
  *   **Tacit Knowledge (Polanyi):** Must reject strong intellectualism's claim that all know-how is fully propositionalizable (i.e., rejects propositional *sufficiency* and *exhaustiveness*). Polanyi likely endorses Claim 5 and probably accepts Claim 4. He might see Claim 6 as compatible or complementary. The AI, lacking embodied experience, cannot possess the tacit dimension crucial for know-how.

  **Which Readings License the Dismissal:**
  *   **Licenses Dismissal:** Readings endorsing **Claim 6 (Rylean Anti-Intellectualism)** or **Claim 7 (Radical Anti-Propositional)** directly license dismissal: the AI categorically cannot possess know-how via manuals. **Claim 5 (Tacit Knowledge)** strongly supports dismissal if tacit knowledge is deemed essential and unattainable without experience. **Claim 2 (Moderate Acquisition)** licenses dismissal *only if* engine rebuilding is convincingly argued to require analogous physical feedback/practice.
  *   **Leaves Open/Undermines Dismissal:** **Intellectualism** leaves it open: the AI *might* possess know-how if it has structured the propositional knowledge with the right practical conceptions/abilities. **Claim 1 (Platitudinous)** is too weak. **Claim 4 (Sufficiency)** highlights a gap but doesn't prove the AI lacks know-how; it just says propositions alone aren't *enough*, not that the AI couldn't have the needed "something else" (which Intellectualists argue is propositional). **Claim 3 (Radical Acquisition)** is too broad and contested for engine rebuilding.
