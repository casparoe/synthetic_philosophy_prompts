prompt: |-
  I run a small mediation service that mostly handles campus and municipal disputes, and I keep getting cases where the two sides aren't just disagreeing about facts or interests—they're coming at it from different moral frameworks, and a split-the-difference deal feels like both sides betraying something. I want to build a reusable proceedure out of the idea that moral compromise can be a kind of gains from trade: each side gives up something it ranks lower for something it ranks higher, and if the rankings differ enough there's a package both prefer to no deal. The key distinction I care about is between a compromise that leaves both sides with a package they rank higher than no deal and a compromise that just divides the disputed thing in half. But I don't know how to turn that into steps a facillitator with no philosophy training can actually run in a 90-minute session.

  We usually have two parties, sometimes with 3-5 reps each, a neutral facilitator, no authority to impose anything, and we need to end with either a written agreement or a clear no-deal. We can't ask people to rank their values on a single scale, and we can't ask them to abandon a core commitment. I want a checklist or a flowchart in words: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because it's a values question rather than a facts question. It should say how to tell a genuine moral trade from a sellout, and how to handle a party that says a value is non-negotiable.

  Then run it on two cases. First, a dispute over whether a student group can host a speaker who has argued for restricting immigration; one side values open inquiry, the other values not normalizing xenophobia. Second, a city council fight over removing a statue of a local founder who was also a slaveholder; one side values historical memory, the other values not honoring someone who did that. For each, show the steps, the proposed trade, and where the procedure either produces a deal or says no deal. Include one case where the procedure tells me to stop even though I want to keep going. And tell me what this procedure can't do—where it will misfire or where a facilitator just has to make a judgment call.

  Lead with the bottom line in the first sentence, then give me the reasoning—no preamble, no restating the question.
reasoning: |-
  Hmm, the user runs a small mediation service focusing on campus and municipal disputes. They're facing cases where parties have conflicting moral frameworks, making standard compromise feel like betrayal. Their goal is to create a reusable procedure that frames moral compromise as "gains from trade"—where each side gives up something they value less for something they value more, based on differing priorities.

  The user needs a practical checklist or flowchart for facilitators without philosophy training. Key constraints include: 90-minute sessions, 2 parties with small groups, no imposed authority, ending with agreement or no-deal. Critical distinctions needed: identifying genuine moral trades vs. sellouts, handling non-negotiable values, and avoiding ranking values on a single scale.

  I'll develop a procedure called the Moral Trade Protocol with these phases:
  1. **Frame the Trade Concept:** Explain the "gains from trade" analogy upfront
  2. **Map Non-Negotiables:** Identify absolute boundaries early
  3. **Define Moral Goods:** Have parties list what they're protecting
  4. **Find Asymmetries:** Look for divergent priorities across frameworks
  5. **Construct Trades:** Brainstorm package deals leveraging asymmetries
  6. **Stress-Test:** Check if trades feel like gains, not betrayal

  For the case studies:
  - **Speaker Case:** Trade could involve pairing the controversial event with a counter-event or donation, leveraging asymmetry between platforming value and harm prevention.
  - **Statue Case:** Trade might combine removal with enhanced historical education, using asymmetry between physical commemoration and truth-telling.

  I'll include a scenario where the procedure forces a stop (e.g., when no asymmetries exist). Limitations will be clarified: it can't resolve truly incompatible non-negotiables, requires some goodwill, and depends on facilitator judgment for framing and trade design. The structure will lead with the bottom-line solution followed by detailed reasoning and examples.
answer: |-
  **Bottom line:** Use this "Moral Trade Protocol" – a 5-step facilitator checklist identifying asymmetric priorities to build package deals where each side gains higher-ranked moral value while conceding lower-ranked value, stopping early if core commitments collide or no asymmetries exist.

  **The Moral Trade Protocol (Facilitator Checklist)**

  1.  **Frame & Consent (5 min):**
      *   **Ask:** "We're exploring if a solution exists where both sides get something they value *more* by giving up something they value *less*, based on your different priorities. Is everyone willing to explore this idea briefly before discussing specific solutions? A 'no' ends this path."
      *   **Sufficient Answer:** Explicit "Yes" from both sides. A "No" or strong hesitation = **Stop, No Deal Path (Procedure Exit 1)**.
      *   **Why:** Establishes buy-in to the "gains from trade" concept. Avoids wasting time if parties reject the premise.

  2.  **Identify Core Protections (Non-Negotiables) (15 min):**
      *   **Ask (to each side separately):** "What is the *absolute minimum* your side needs to protect to avoid feeling you've betrayed your core commitment in any agreement? Be specific about the *protection*, not the solution." (e.g., "Prevent platforming hate speech," "Ensure historical truth is told," "Protect ability to host lawful speakers").
      *   **Sufficient Answer:** A clear, specific statement of what *must not happen* or *must be upheld* morally. Vague answers like "Respect our values" are insufficient – probe: "What specific outcome would violate that beyond repair?"
      *   **Check for Collision:** Compare the two Core Protections. Do they directly conflict? (e.g., Speaker Side *must* host *this specific speaker* vs. Opponent Side *must* prevent *this specific speaker*). **If YES = Stop, No Deal Likely (Procedure Exit 2)**. If NO (or only partial conflict), proceed.
      *   **Why:** Identifies boundaries. Genuine moral trade is impossible if Core Protections directly clash. "Non-negotiable" values are respected here as boundaries.

  3.  **Define Moral "Goods" Sought (20 min):**
      *   **Ask (to each side):** "Besides protecting your core commitment, what positive moral outcomes or values are you hoping to achieve through this situation? List 2-3." (e.g., "Promote open inquiry," "Show solidarity with immigrants," "Honor history," "Promote racial justice," "Foster campus dialogue").
      *   **Sufficient Answer:** Concrete statements of positive aims tied to their moral framework. Avoid abstract nouns; probe: "What does 'promote justice' look like *here*?"
      *   **Why:** Expands the scope beyond conflict to positive values that *might* be traded. Creates the "goods" for potential exchange.

  4.  **Map Asymmetries & Potential Trades (30 min):**
      *   **Ask (to each side, comparing lists):**
          *   "Looking at the *other* side's list of 'Goods' sought, which one(s) do you feel your side could *support* or *provide* without violating your own Core Protection? Why?"
          *   "Looking at your *own* list of 'Goods', which one(s) would you be willing to *accept less of*, or *achieve in a different way*, if it meant gaining strong support for one of your *higher-ranked* Goods from the other side?"
      *   **Sufficient Answer:** Parties identify specific Goods *from the other side's list* they can support/concede on, AND specific Goods *from their own list* they might deprioritize *if* compensated by gains elsewhere. Silence or "None" = **Stop, No Viable Trade (Procedure Exit 3)**.
      *   **Brainstorm Trades:** Facilitator proposes packages: "What if Side A actively supports/concedes X (which Side B values highly) *in exchange for* Side B supporting/conceding Y (which Side A values highly), while both Core Protections are respected?" Refine iteratively.
      *   **Genuine Trade vs. Sellout:** A trade feels like a "gain" if a side gets strong support on a *high-priority* Good by conceding a *lower-priority* Good or accepting a *different form* of a Good. A "sellout" occurs only if a Core Protection is violated or a high-priority Good is conceded *without* adequate compensation on another high-priority Good. The facilitator *doesn't judge the values*, only helps articulate the parties' *own* prioritization revealed in steps 3 & 4.

  5.  **Stress-Test & Decide (20 min):**
      *   **Ask (on a draft package):**
          *   "Does this package *violate* either side's Core Protection? If yes, how?" (Fix or **Stop, No Deal Path**).
          *   "Does each side feel they gain *more* (on a higher-ranked Good) than they give up (on a lower-ranked Good or form)? If not, what's missing?"
      *   **Sufficient Answer:** Parties confirm Core Protections are intact and express that the *net gain* for their values outweighs the concession. Hesitation or "No" means refine or **No Deal**.
      *   **Outcome:** If Yes, draft written agreement specifying the mutual concessions/support. If No, declare **No Deal**.

  **Where Judgment is Needed:**
  *   Framing questions clearly and neutrally.
  *   Probing vague answers in Steps 2 & 3 to get concrete needs/values.
  *   Synthesizing potential trades in Step 4 based on revealed asymmetries.
  *   Helping parties articulate their *internal* prioritization ("Is supporting dialogue *more* important to you right now than the *specific format* of the event, if it meant achieving X?").

  **Limitations & Misfires:**
  *   **Fails if Core Protections directly collide** (Step 2 Exit). No trade possible.
  *   **Fails if no value asymmetries exist** (Step 4 Exit). Parties rank "Goods" similarly, so no mutual gain from trade.
  *   **Requires basic goodwill/engagement.** Parties deeply entrenched in positional bargaining or acting in bad faith will derail it.
  *   **Depends on honest self-reflection.** Parties might misrepresent priorities.
  *   **Cannot resolve fundamental value conflicts.** Only finds mutually beneficial exchanges *given* the existing frameworks.
  *   **Time pressure:** 90-minutes is tight; complex cases might stall in Step 4.

  **Case 1: Controversial Speaker**

  1.  **Frame & Consent:** Both sides agree to explore.
  2.  **Core Protections:**
      *   **Pro-Speaker Group:** "Must be allowed to host their chosen speaker without prior content veto."
      *   **Opposing Group:** "Must ensure the event doesn't normalize or platform xenophobic rhetoric as acceptable discourse."
      *   **Check:** No *direct* collision (Opponents don't demand *cancellation*, Pro-group doesn't demand *no criticism*). Proceed.
  3.  **Moral Goods Sought:**
      *   **Pro-Speaker:** "Promote open inquiry," "Demonstrate commitment to free speech," "Encourage debate on tough topics."
      *   **Opposing:** "Protect vulnerable students from feeling targeted," "Affirm campus commitment to inclusivity," "Ensure harmful views are challenged."
  4.  **Map Asymmetries & Propose Trade:**
      *   **Pro-Speaker might concede/support:** Could potentially support "Ensure harmful views are challenged" (a high-priority Opponent Good) *if* it doesn't mean cancelling. They might value "Demonstrate free speech" higher than the *specific format* of unchallenged monologue.
      *   **Opponents might concede/support:** Could potentially support "Encourage debate on tough topics" (a mid-tier Pro-group Good) *if* their core protection is met. They value "Affirm inclusivity" highly but might accept the event *if* paired with a strong counter-action they help shape.
      *   **Potential Trade:** Pro-Speaker Group agrees to include a moderated Q&A or a panel format with a strong opposing voice (conceding "unchallenged monologue" form, supporting Opponent's "Ensure views are challenged"). Opposing Group agrees to co-sponsor the event or actively promote attendance for debate, rather than protest/boycott (conceding "no platforming," supporting Pro-group's "Encourage debate"). Core Protections intact (event happens, xenophobia is directly challenged).
  5.  **Stress-Test:** Both sides confirm Core Protections are met. Pro-group gains high-priority "free speech demonstration" and "debate" through co-sponsorship; concedes format control. Opponents gain high-priority "challenge harmful views" and "affirm inclusivity" via format/co-sponsorship; concede platforming occurs but is actively countered. **DEAL:** Agreement on format and co-sponsorship.

  **Case 2: Contentious Statue (Where Procedure Forces Stop)**

  1.  **Frame & Consent:** Both sides agree (reluctantly) to explore.
  2.  **Core Protections:**
      *   **Pro-Statue Group:** "Must preserve the physical statue in a public space to honor the town's founding history."
      *   **Remove Statue Group:** "Must remove the statue from public honorific spaces to stop venerating a slaveholder."
      *   **Check:** DIRECT COLLISION. Core Protections are mutually exclusive (physical presence vs. physical removal). **PROCEDURE EXIT 2: STOP, No Deal Path Likely**. (Facilitator must accept this stop, even if wanting to continue).
      *   *Why Stop Here?* No trade involving the *physical statue's location* is possible without one side violating their core commitment. Further steps (Goods, Asymmetries) *might* reveal options *only if* the location stalemate was broken (e.g., one side redefines "honor" or "veneration"), but Step 2 flags the fundamental barrier. The facilitator must now switch tactics or declare impasse.
