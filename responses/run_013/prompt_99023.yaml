prompt: |-
  I'm a graduate student in mathematics who also sits in on a philosophy of mathematics reading group, and we're closing the term with a session on the axiom of choice and its equivalents. I've been asked to open the session, and instead of giving a talk I want to read a short poem about Zorn's lemma -- partly because it's the equivalent people find most slippery, and partly because I think the right form can do some of the explaining for me. Most of the room will know the statement cold (a nonempty partially ordered set in which every chain has an upper bound has a maximal element), but I want the poem to make them feel the two things that usually get lost in the statement: that the maximal element is not a greatest element, and that the proof delivers existence without ever handing you the object.

  So here is what I'd like you to write. Let the poem's form track the lemma's structure rather than merely name it. Have it proceed as a chain -- each line comparable to the one before, in whatever sense you can sustain (rhyme, or one line's image contained in the next, or a term recurring and being subsumed) -- so that the reader watches a chain being extended, with the limit steps where the chain closes off and a fresh element is thrown above it. Bring the poem to a final line that is a maximal element: nothing in the poem could be placed above it without breaking the poem's own order. But leave at least one line standing off to the side that is incomparable with that final line, so that a reader who knows the lemma can see the gap between maximal and greatest, and a reader who doesn't can still feel why the distinction matters. And I want the non-constructive character to come through -- the poem should be able to say that the top exists while being unable or unwilling to name or exhibit it; no recipe, no construction, just the guarantee. Something in the range of fourteen to twenty lines. I don't need a fixed form, but if a received form (a sonnet, a sestina, a pantoum) lets you do the chain-and-limit work more honestly, use it and tell me which one you chose and why. Accuracy matters more than beauty here -- a mathematician in the room should not wince -- but it should still read as a poem and not as a proof set in line breaks.

  After the poem, on its own line beginning "Coda:", give me a single sentence naming which feature of the poem corresponds to the hypothesis of the lemma, which to the maximal element, and which to its non-constructive character.
reasoning: |-
  Okay, the user wants a poem about Zorn's Lemma that captures its mathematical essence through poetic form. They're a grad student in math leading a philosophy reading group, so they need something precise yet accessible. 

  The core challenge is structural: the poem must mimic Zorn's Lemma by building chains (through rhyme or imagery), handling "limit steps" (transitions between sections), and culminating in a maximal element that isn't greatest. I should avoid explicit math jargon since the audience knows the statement cold—they need to *feel* the distinction between maximal/greatest and the non-constructive nature. 

  Hmm... the pantoum form seems perfect. Its interlocking stanzas create literal chains: each line repeats in a fixed pattern (2→1, 4→3 in the next stanza), forcing extensions. The repetitions act like upper bounds—old lines become foundations for new ones. A modified pantoum can introduce fresh lines at "limit points" (stanza breaks) to simulate adjoining new elements. 

  For maximal vs. greatest: the final line will be unique and unrepeatable (maximal), but I'll include a deliberately "incomparable" line earlier (e.g., one that's shorter or fragmented) that doesn't lead to the climax. The non-constructiveness will come through ambiguity—the final line won't be described, just declared to exist. 

  Word choices should evoke order without being didactic: "chains," "bound," "height" suggest posets. Ending on "light" keeps it open—is it literal? Truth? The reader can't grasp it concretely. 

  Coda will map: 
  - Hypothesis → the chain-repetition structure 
  - Maximal element → the unrepeated final line 
  - Non-constructiveness → the final line's vagueness 

  This balances accuracy with poetic resonance. Mathematicians won't wince; philosophers will get the subtext.
answer: |-
  ## Zorn's Lemma: A Pantoum of Chains and Unseen Heights

  **(The pantoum's strict repetition of lines creates the 'chain' structure, each stanza reordering prior lines like adjoining new upper bounds. The final line breaks the repetition pattern, becoming a true maximal element.)**

  I.  
  A chain ascends, link bound to prior link.  
  No single point commands the growing height.  
  Each step defined, yet leaving space to think  
  Of paths unseen, eclipsed by current light.

  II.  
  No single point commands the growing height.  
  The chain extends, compelled by hidden law.  
  Of paths unseen, eclipsed by current light,  
  (One branch diverges, bearing silent awe.)

  III.  
  The chain extends, compelled by hidden law.  
  Though bounded links suggest a higher place.  
  (One branch diverges, bearing silent awe.)  
  We seek the peak, that singular embrace.

  IV.  
  Though bounded links suggest a higher place,  
  The summit waits, withheld from mortal sight.  
  We seek the peak, that singular embrace—  
  Not all paths meet within its final light.

  V.  
  Each step defined, yet leaving space to think—  
  A chain ascends, link bound to prior link.  
  The summit waits, withheld from mortal sight.  
  **The highest point achieved forbids the next.**

  *(One branch diverges, bearing silent awe.)*

  ---

  **Coda:** The pantoum's interlocking stanzas (each line reused from the prior stanza in fixed order) form the poem's 'chain' structure with inherent 'upper bounds' (repeated lines stabilizing the form), the final unique line **"The highest point achieved forbids the next."** is the maximal element (no subsequent line can follow it without breaking the pantoum's rules), and its abstract declaration of existence ("The highest point... forbids") combined with the withheld description of the summit embody the non-constructive guarantee.
