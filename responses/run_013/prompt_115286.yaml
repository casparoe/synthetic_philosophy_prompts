  You're a philosopher of value with a good nose for when two camps are talking past each other, so think carefully before you write. I've got a stalled dispute I want you to turn into an adversarial-collaboration document. Side A is a Ramsey-style perspectivalist: value isn't a fact out there in the world, it's a matter of how things strike a creature that can think and love; the vastness of the heavens impresses him not at all, because stars can't think or love; and the remote future — a cooling universe, everything dead — has almost no present value once you discount it like a far-off sum. Side B is a scale-invariant consequentialist who takes the same Ramsey's 1928 optimal-saving model seriously: no pure time discounting of future enjoyments (he called that practice ethically indefensible), so enormous numbers of future lives dominate a handful of present ones, and cosmic size matters a lot. Both sides admire Ramsey, and each thinks the other is cherry-picking him. Write the joint statement they could both put their names to: first a numbered section of agreed claims — about what value-talk is doing, whether the world as a whole can be good or bad in itself, what follows from a thing's capacity to think and love, whether temporal distance is relevantly like spatial distance, and how much of the dispute is about the feelings of the valuer versus the facts valued; then a disagreements table where each side's position is worded so that side would accept the wording; then the cruxes, and for each crux a concrete case or argument both sides agree bears on it, with each side's prediction written down in advance. Brainstorm the logical space before drafting, flag any part that looks merely verbal, and say which disagreements are actually load-bearing. No citations or reading lists — work from the positions as I've described them.
