prompt: |-
  My friend and I got into it for like two hours last night about whether the peacock's tail thing — Zahavi's handicap principle, cost as proof of quality — is a genuinely useful lens for reading human behavior, or the kind of idea that sounds deep because it explains everything and so explains nothing. He thinks every expensive, pointless-looking move is a signal of something. I think half of them are just people being dumb with money, and there's no way to tell the difference from the outside. Which is a problem, because telling the difference from the outside is literally my job.

  I run diligence at a small fund, three of us, maybe forty companies a year. The pattern that keeps biting us: a company does something expensive that looks like a waste of money, and I have to decide whether that expense is evidence of something real about them or just burn. Open-sourcing their whole core library. Paying for a brutal certification nobody made them get. Spending a third of the runway on a brand campaign before there's a product. Hiring a famous scientist who costs a fortune and produces nothing billable. Right now I do this by vibe in about ten minutes and I'm pretty sure I'm just pattern-matching on whether I like the founder.

  So write me a procedure I can actually run, say forty-five minutes per company, no insider access, my partner signs off on the check. Questions in order, what counts as a good enough answer to each, the point where it stops and says "this tells me nothing, walk away," and the point where it has to hand the call to a human because it's about risk tolerance rather than fact. Keep the actual logic of the theory intact — the cost has to be cheaper for the good type than the bad type, the receiver has to actually change what they do, and a bad type has to be unable to afford the imitation. And be straight with me about where the lens misfires: expenses with no real receiver, costs that are just consumption, traits that are physically tied to the thing I care about rather than being signals of it, several audiences at once, and the case where the party getting fooled isn't the party paying for being fooled. That last one is my hunch about where the whole thing breaks and I want the procedure to say so out loud instead of papering over it.

  Then run it on three: the open-source one, the brand campaign one, and a company that voluntarily took on an expensive audit it didn't need. At least one of these should come out as a pass, even if I don't like it, because I definately have a soft spot for founders who do splashy things. Also tell me which steps are just my judgment wearing a lab coat.
reasoning: |-
  We are going to design a procedure to evaluate whether an expensive, seemingly wasteful action by a company is a reliable signal of underlying quality (as per Zahavi's handicap principle) or just waste. The procedure must be runnable in about 45 minutes per company without insider access.

  Key principles from Zahavi's handicap principle:
  1. The cost must be cheaper for the good type than the bad type (i.e., the action must be less costly for a high-quality company to undertake than for a low-quality one).
  2. The receiver (the audience) must change their behavior in response to the signal.
  3. A bad type must be unable to afford (or find it prohibitively costly) to imitate the signal.

  Points where the lens might misfire (to be addressed in the procedure):
  - Expenses with no real receiver (no audience is paying attention or changing behavior).
  - Costs that are just consumption (the expense is for direct benefit, not signaling).
  - Traits that are physically tied to the thing we care about (so the expense isn't a signal but a direct consequence).
  - Several audiences at once (the signal might be intended for multiple groups, which complicates interpretation).
  - The case where the party getting fooled isn't the party paying for being fooled (this breaks the principle because the signal might be dishonest and the cost is borne by someone else).

  The Procedure: A series of questions in order. We stop if we get a clear "no" to any critical step or if we hit a point where the signal is ambiguous and we need human judgment.

  ---

  **Procedure: Evaluating Expensive Actions as Signals**

  **Step 0: Define the Action and Context (5 minutes)**
     - What is the expensive action? (e.g., open-sourcing core library, expensive brand campaign, voluntary audit)
     - What is the cost? (quantify as much as possible: monetary, time, opportunity cost)
     - What is the apparent waste? (why does it look like a waste? what is the alternative use of resources?)

  **Step 1: Identify the Receiver(s) (5 minutes)**
     - Who is the intended audience for this action? (e.g., potential customers, investors, regulators, talent)
     - Are there multiple audiences? (if yes, note them but we will focus on the primary one for simplicity, unless they conflict)
     - *Check for misfire: No receiver?* If there is no clear audience that the company could be trying to influence, then it's not a signal -> mark as "waste" and stop. Otherwise, proceed.

  **Step 2: Assess Receiver Response (5 minutes)**
     - Does the receiver actually change their behavior in response to this action? (e.g., do customers buy more, do investors invest, does talent join?)
     - Is there evidence that the receiver cares? (look for industry norms, past examples, stated preferences of the receiver)
     - *Check for misfire: No change in behavior?* If the receiver doesn't change behavior, then the signal is ineffective -> mark as "waste" and stop. Otherwise, proceed.

  **Step 3: Cost Differential Between Good and Bad Types (10 minutes)**
     - Why would this action be less costly for a high-quality company than a low-quality one? (e.g., a high-quality company might have a better product to open-source, so the cost of revealing code is low; a low-quality company might fear exposure. Or, a high-quality company might have more resources to absorb the cost without jeopardizing operations.)
     - Conversely, why would it be prohibitively expensive for a low-quality company? (e.g., they can't afford the cash burn, or the action would reveal their flaws and lead to loss of trust)
     - *Check for misfire: Cost is the same for both types?* If there's no differential cost (i.e., if the cost is equally burdensome for both good and bad companies) then it's not a reliable signal -> mark as "ambiguous" and stop (or proceed with caution). Otherwise, proceed.

  **Step 4: Imitation Cost for Bad Types (5 minutes)**
     - Could a low-quality company imitate this action? (i.e., could they do the same thing without having the underlying quality?)
     - What would stop them? (e.g., they can't afford the cash outlay, they don't have the technical ability to open-source without revealing poor code, they can't pass the audit without fraud which is too risky)
     - *Check for misfire: Bad types can easily imitate?* If a bad type can imitate without prohibitive cost, then the signal is not reliable -> mark as "waste" (because it could be faked) and stop. Otherwise, proceed.

  **Step 5: Check for Direct Benefits and Confounds (5 minutes)**
     - Could the action have direct benefits (not signaling) that the company might be pursuing? (e.g., open-sourcing might lead to community contributions, an audit might improve internal processes, a brand campaign might build awareness that directly leads to sales)
     - *Check for misfire: It's just consumption?* If the action has direct benefits that explain the cost without signaling, then it's not primarily a signal -> mark as "not a signal" (but note it might still be rational) and stop. Otherwise, if it's primarily signaling, proceed.
     - *Check for misfire: The trait is physically tied?* Is the expense a direct consequence of the quality we care about? (e.g., if the quality is having a strong brand, then a brand campaign is directly building that, not signaling it) If so, then it's not a signal -> mark as "direct investment" and stop. Otherwise, proceed.

  **Step 6: Multiple Audiences and Conflicts (5 minutes)**
     - If there are multiple audiences, could the signal be interpreted differently by each? (e.g., an audit might reassure investors but alarm customers if it reveals weaknesses)
     - Is there a conflict? (if one audience is positively affected and another negatively, the net effect might be zero or negative) -> If a significant conflict, mark as "ambiguous" and stop. Otherwise, proceed.

  **Step 7: Who Bears the Cost and Who is Fooled? (5 minutes)**
     - Who bears the cost of the signal? (the company, the founder, investors, etc.)
     - Who is the receiver that might be fooled? (the party changing behavior)
     - *Check for misfire: The party getting fooled isn't the party paying?* If the receiver is not the one bearing the cost (e.g., if the company spends money to fool customers, but it's the investors who bear the cost if the company fails) then the signal might be dishonest and break the principle -> mark as "high risk of misalignment" and stop (or flag for human review). Otherwise, proceed.

  **Step 8: Synthesis and Decision (5 minutes)**
     - We have passed all the checks. The action is a reliable signal of quality.
     - However, if at any step we had to mark as ambiguous or if there are residual doubts, we flag for human review.

  **Decision Tree Outcomes:**
     - **Pass**: The action is a reliable signal of quality.
     - **Waste**: The action is not a signal and is wasteful.
     - **Not a signal**: The action has direct benefits, so it's not primarily signaling.
     - **Ambiguous**: The evidence is mixed, and human judgment is needed.
     - **High risk of misalignment**: The cost and fooled party are misaligned, which breaks the principle.

  **Human Judgment Steps (where the lab coat comes off):**
     - Step 1: Identifying the receiver (might require interpretation of the company's intent).
     - Step 2: Assessing receiver response (requires evidence that might be anecdotal or industry-specific).
     - Step 3: Cost differential (requires an educated guess on how the cost differs by company type).
     - Step 4: Imitation cost (requires judgment on what a bad type could do).
     - Step 5: Direct benefits (requires separating signaling from direct benefits).
     - Step 6: Multiple audiences (requires weighing the net effect).

  Now, we run the procedure on three examples.

  ---

  **Example 1: Open-sourcing their whole core library**

  *Step 0: Action and Context*
     - Action: Open-sourcing core library.
     - Cost: Loss of proprietary advantage, ongoing maintenance, potential forking. Opportunity cost of not keeping it secret.
     - Waste: Why give away your core asset? Competitors might copy it.

  *Step 1: Identify Receiver(s)*
     - Primary receiver: Developer community, potential hires, tech-savvy customers.
     - No receiver? Unlikely. The tech community is a real audience. Proceed.

  *Step 2: Receiver Response*
     - Does the receiver change behavior? Yes, developers might contribute, talent might be attracted, customers might trust the tech more.
     - Evidence: Many companies (e.g., Red Hat, MongoDB) have built businesses around open source. Proceed.

  *Step 3: Cost Differential*
     - Why cheaper for good type? A high-quality company has a strong codebase and can attract contributions and talent. The cost of exposure is low because the code is good.
     - Why expensive for bad type? A low-quality company would expose poor code, leading to loss of trust. They also can't attract contributions to offset the cost. Proceed.

  *Step 4: Imitation Cost for Bad Types*
     - Could a bad type open-source? Technically yes, but they risk exposing their flaws. If the code is bad, they might be caught. Also, maintaining an open-source project requires resources they might not have. Imitation is possible but costly (reputationally). So, it's hard for bad types to imitate without being caught. Proceed.

  *Step 5: Direct Benefits and Confounds*
     - Direct benefits? Yes: community contributions, faster innovation, talent attraction. But note: the primary reason might be signaling. We have to decide if the direct benefits are the main driver. If the company expects significant contributions, then it's not just a signal. However, if the core library is the entire product and open-sourcing it doesn't lead to a clear business model (like support or enterprise features), then it might be more signal than direct. This is ambiguous. Let's assume for this example the company has a plan to monetize services around it. Then direct benefits exist. But if not, then it's primarily a signal. We'll say it's mixed. For the sake of this example, we'll note that and proceed.

  *Step 6: Multiple Audiences and Conflicts*
     - Audiences: developers (positive), investors (might worry about IP), competitors (might copy). 
     - Conflict? Investors might be spooked. But if the company is in a space where open-source is common, investors might be reassured by the community building. We'll say no major conflict. Proceed.

  *Step 7: Who Bears the Cost and Who is Fooled?*
     - Cost bearer: The company (and its investors) bear the cost of lost IP and maintenance.
     - Fooled party? The receivers (developers, talent) are the ones changing behavior. They are not the ones bearing the cost. This is a misfire: the party getting fooled (if it's a low-quality company) is the developer community who might contribute or join, but the investors are the ones who lose money. However, note that in open-source, the cost is also borne by the company in terms of reputation if the code is bad. So the developer community might not be fooled for long. This is tricky. We might mark as "high risk of misalignment" because the investors bear the cost if the company fails due to giving away IP, but the signal is aimed at developers. 

  *Step 8: Synthesis*
     - We passed steps 1-4 and 6, but step 5 was ambiguous (direct benefits) and step 7 shows misalignment. We mark as "high risk of misalignment" and stop.

  **Outcome for Example 1: High risk of misalignment -> Flag for human review (with a note that it might be a mix of signal and direct benefits).**

  ---

  **Example 2: Spending a third of the runway on a brand campaign before there's a product**

  *Step 0: Action and Context*
     - Action: Brand campaign with no product.
     - Cost: One-third of cash runway (a huge amount).
     - Waste: They are spending on brand without a product to sell, which might be premature.

  *Step 1: Identify Receiver(s)*
     - Primary receiver: Potential customers, investors, the general public.
     - No receiver? Unlikely. They are building awareness. Proceed.

  *Step 2: Receiver Response*
     - Does the receiver change behavior? Investors might be impressed by the buzz and invest. Customers might remember the brand when the product launches. But without a product, it's hard to measure. 
     - Evidence: Some companies (e.g., tech startups) have done this successfully (e.g., launching with a waitlist). But it's risky. We'll say it can change behavior (investors might fund them, early adopters might sign up). Proceed.

  *Step 3: Cost Differential*
     - Why cheaper for good type? A high-quality company with a strong future product can afford to build brand early because they know the product will deliver. The cost of building brand is an investment that will pay off.
     - Why expensive for bad type? A low-quality company cannot afford to spend so much cash without having a product because they will run out of money. Also, if the product fails, the brand campaign is wasted. Proceed.

  *Step 4: Imitation Cost for Bad Types*
     - Could a bad type do this? Yes, they could blow money on a campaign. But it would be very risky because they have no product and might run out of cash. So, while they can imitate, it is prohibitively expensive (they might go bankrupt). Proceed.

  *Step 5: Direct Benefits and Confounds*
     - Direct benefits? The campaign might build a waitlist or community, which is a direct benefit. But without a product, it's hard to see direct benefits beyond buzz. We might consider it primarily signaling. Also, note: if the company is building a consumer brand, then the brand campaign is directly tied to the trait (brand strength) we care about? Not exactly: the trait we care about is the product quality, but the brand campaign is signaling that they are confident. However, the brand campaign is building the brand, which is an asset. So there might be direct benefits. But in this case, because there's no product, the direct benefits are minimal until the product exists. We'll say it's primarily signaling. Proceed.

  *Step 6: Multiple Audiences and Conflicts*
     - Audiences: customers (future), investors. 
     - Conflict? Investors might see it as bold or reckless. Customers might get excited but then disappointed if the product is delayed. But if done well, it can align. No major conflict. Proceed.

  *Step 7: Who Bears the Cost and Who is Fooled?*
     - Cost bearer: The company (and investors) bear the cost of the campaign.
     - Fooled party? Investors might be induced to invest more, and customers might sign up. But if the company is bad, the investors lose their money, and customers are disappointed. The cost is borne by the investors, and the fooled parties are investors and customers. Here, the investors are both fooled and bearing the cost (if they are existing investors, they are bearing the cost; if new investors come in, they might be fooled and then bear the cost later). But note: the existing investors are paying for the campaign, and if it attracts new investors, then the new investors are also at risk. This is a complex chain. However, the immediate cost is borne by the current investors. The signal is aimed at future investors and customers. If the company fails, the current investors lose. So, the party paying for being fooled is the current investors, but they are not the ones being fooled? They are making the decision to spend, so they are not fooled by their own signal. The signal is for others. This is a misfire: the party paying (current investors) is not the one being fooled (they are not the receiver). The receivers (future investors and customers) are the ones who might be fooled, but they don't bear the cost of the campaign. The cost is borne by the current investors. This breaks the principle because the signal might be dishonest (current investors are spending to fool future investors). 

  *Step 8: Synthesis*
     - We passed steps 1-6, but step 7 shows misalignment. Mark as "high risk of misalignment" and stop.

  **Outcome for Example 2: High risk of misalignment -> Flag for human review.**

  ---

  **Example 3: A company that voluntarily took on an expensive audit it didn't need**

  *Step 0: Action and Context*
     - Action: Voluntary expensive audit (e.g., financial, security, or compliance audit).
     - Cost: High monetary cost and time.
     - Waste: They didn't have to do it, so why spend the money?

  *Step 1: Identify Receiver(s)*
     - Primary receiver: Investors, customers (especially if it's a security audit for a tech company), regulators.
     - No receiver? Unlikely. Proceed.

  *Step 2: Receiver Response*
     - Does the receiver change behavior? Yes, investors might have more confidence, customers might trust the company more (especially if the audit is in a sensitive area like security). 
     - Evidence: Audits are commonly used to build trust. Proceed.

  *Step 3: Cost Differential*
     - Why cheaper for good type? A high-quality company has nothing to hide and the audit will confirm their strength. The cost is just the fee, which they can afford because they are well-run.
     - Why expensive for bad type? A low-quality company might fail the audit, which would be disastrous. Even if they pass, the risk of exposure is high. Also, the cost might strain their finances. Proceed.

  *Step 4: Imitation Cost for Bad Types*
     - Could a bad type do this? They could try, but if they are low-quality, they might not pass. If they do pass by chance or by hiding things, that's fraud and risky. Also, the cost is high and might not be affordable. So, it's hard to imitate without being caught. Proceed.

  *Step 5: Direct Benefits and Confounds*
     - Direct benefits? The audit might improve internal processes, find weaknesses, and help the company. But if it's voluntary and not needed, the primary reason might be signaling. However, the direct benefit of improving processes is real. But note: if the company is already high-quality, the direct benefit might be minimal. We'll say it's primarily signaling. Proceed.

  *Step 6: Multiple Audiences and Conflicts*
     - Audiences: investors, customers, regulators. 
     - Conflict? Regulators might impose more scrutiny if the audit reveals issues? But if the company is good, it should be fine. Generally, alignment. Proceed.

  *Step 7: Who Bears the Cost and Who is Fooled?*
     - Cost bearer: The company (and investors) pay for the audit.
     - Fooled party? The receivers (investors, customers) are the ones changing behavior. If the company is bad and passes the audit by luck or fraud, then the investors and customers are fooled. But the cost of the audit is borne by the company. However, if the company is bad and the audit exposes them, they bear the cost and the loss of reputation. If they pass fraudulently, they risk future penalties. The key is that the cost of the audit is borne by the company, and the receivers are the ones who might be fooled. But note: the current investors are paying for the audit to signal to future investors and customers. This might be aligned because the current investors believe in the company and want to prove it. If they are lying, they are hurting themselves and the future investors. So, the cost is borne by the current owners, and if the signal is false, they are also the ones who will lose (if the truth comes out). This aligns with the principle.

  *Step 8: Synthesis*
     - We passed all steps. The action is a reliable signal.

  **Outcome for Example 3: Pass -> The audit is a reliable signal of quality.**

  ---

  **Summary of Steps Where Judgment is Required (the lab coat off):**
     - Step 1: Identifying the receiver (subjective interpretation of company intent).
     - Step 2: Assessing receiver response (requires knowledge of the industry and evidence that might be indirect).
     - Step 3: Cost differential (judgment call on how the cost differs by company type).
     - Step 4: Imitation cost (assessing what a bad type would do and the risks they face).
     - Step 5: Direct benefits vs. signaling (requires separating the two, which can be ambiguous).
     - Step 6: Multiple audiences (weighing the net effect).
     - Step 7: Alignment of cost and fooled party (complex chain of who bears cost and who is at risk).

  In the examples:
     - Open-sourcing: Flagged for human review due to misalignment and direct benefits ambiguity.
     - Brand campaign: Flagged for human review due to misalignment.
     - Voluntary audit: Pass.

  Note: The audit example passed because the cost is borne by the company and the receivers are the ones who change behavior, and there's a high risk for bad types to imitate. Also, the cost differential is clear.

  This procedure should help you move beyond vibes. But note: it still requires judgment, so use it as a structured way to collect your thoughts and then make a call.
answer: |-
  ### Procedure: Evaluating Expensive Actions as Signals (Zahavi's Handicap Principle Lens)
  **Time Budget:** 45 minutes per company  
  **Inputs:** Public data, company materials, industry benchmarks, basic financials (e.g., runway disclosed in pitch deck).  
  **Outputs:** "Pass" (signal valid), "Waste," "Ambiguous," or "Escalate to Human" (for risk tolerance).  

  #### Core Logic Flow (Follow Strictly)
  1. **Cost must be cheaper for "good" types** (e.g., high-quality companies) than "bad" types.  
  2. **Receiver must change behavior** (e.g., customers pay more, investors fund, talent joins).  
  3. **Bad types cannot afford imitation** (e.g., prohibitive risk/cost).  
  **Stop-and-Fail Points:** If any principle is violated → conclude "Waste" or "Ambiguous."  

  ---

  ### Step-by-Step Procedure
  **Step 1: Define the Action’s Cost and Apparent Waste (5 min)**  
  - *Question:* What exactly was spent (cash, time, opportunity cost), and why does it look irrational?  
  - *Good Answer:* Quantifiable cost (e.g., "Spent $500K on audit," "Burned 6 months of engineering time").  
  - *Stop If:* Cost is trivial (<1% of runway) → "Waste" (not costly enough to signal).  
  - *Judgment Lab Coat:* Estimating opportunity cost (e.g., "What else could they have done?").  

  **Step 2: Identify the Receiver and Their Response (10 min)**  
  - *Question:* Who is the intended audience, and how should they react? (e.g., customers, investors, talent).  
  - *Good Answer:* Specific receiver + clear behavioral change (e.g., "Enterprise clients require ISO 27001, so audit signals security → clients buy").  
  - *Stop If:*  
    - No clear receiver → "Waste" (e.g., expense with no audience).  
    - Receiver doesn’t care (e.g., "Investors ignore vanity metrics") → "Waste."  
  - *Misfire Check:* Multiple audiences? If conflicting incentives (e.g., investors love it but customers hate it) → "Ambiguous."  

  **Step 3: Cost Differential Analysis (10 min)**  
  - *Question:* Why would a "good" type bear this cost more easily than a "bad" type?  
  - *Good Answer:* "Good" type has inherent advantage (e.g., strong product → open-sourcing is low-risk; solid finances → audit is affordable).  
  - *Stop If:*  
    - Cost is equal for both types (e.g., hiring a famous scientist costs the same regardless of quality) → "Ambiguous."  
    - Cost is consumption (e.g., founder’s private jet) → "Waste" (not a signal).  
  - *Misfire Check:* Trait physically tied? (e.g., brand spend directly builds awareness, not signaling) → "Not a Signal."  

  **Step 4: Bad Type’s Imitation Cost (10 min)**  
  - *Question:* Could a "bad" type fake this? What stops them?  
  - *Good Answer:* Imitation is unaffordable or self-destructive (e.g., bad code in open-source → exposed; failing audit → scandal).  
  - *Stop If:*  
    - Bad type can easily imitate (e.g., any company can hire a famous scientist) → "Waste."  
    - No skin in the game (e.g., founder spends investor cash with no personal risk) → Escalate to Human (high fraud risk).  
  - *Misfire Check:* "Fooled party ≠ payer"? (e.g., investors pay cost, but customers are fooled) → "Escalate to Human" (principle broken).  

  **Step 5: Synthesis and Decision (10 min)**  
  - *Question:* Does the cost prove quality per Zahavi?  
  - *Pass Conditions:* All steps passed + receiver response verified + cost differential clear.  
  - *Escalate to Human:* Ambiguity in Steps 2-4 or "fooled party ≠ payer" → Decision depends on fund’s risk tolerance.  
  - *Final Stop:* If unresolved → "Ambiguous: Walk Away."  

  ---

  ### Case Studies
  #### 1. **Open-Sourcing Core Library**
  - **Step 1:** Cost = lost IP, engineering time. Waste = competitors copy it.  
  - **Step 2:** Receiver = developers/talent. Response = attracts contributions/hires. **✓**  
  - **Step 3:** *Good type*: Strong code → gains community trust. *Bad type*: Poor code exposed → reputation loss. **✓**  
  - **Step 4:** Bad type can’t imitate without revealing flaws. **✓**  
  - **Misfire Check:** Multiple audiences? (Investors may fear IP loss → conflict). **→ Ambiguous** (escalate to human).  
  - **Verdict:** **Escalate to Human** (risk tolerance: IP loss vs. talent gain).  

  #### 2. **Spending 1/3 Runway on Brand Campaign (No Product)**  
  - **Step 1:** Cost = cash. Waste = no product to market.  
  - **Step 2:** Receiver = future customers/investors. Response = buzz → pre-orders/investment. **✓**  
  - **Step 3:** *Good type*: True product confidence → campaign pays off later. *Bad type*: Wastes runway → death spiral. **✓**  
  - **Step 4:** Bad type can imitate (anyone can run ads) → but risks bankruptcy. **Partial ✓**  
  - **Misfire Check:** Fooled party ≠ payer? Investors pay, future investors/customers fooled. **→ MAJOR MISFIRE** (escalate).  
  - **Verdict:** **Escalate to Human** (high-risk: if product flops, investors eat cost).  

  #### 3. **Voluntary Expensive Audit (Not Required)**  
  - **Step 1:** Cost = $300K. Waste = no regulatory need.  
  - **Step 2:** Receiver = enterprise clients. Response = trust → contracts signed. **✓**  
  - **Step 3:** *Good type*: Clean books → passes easily. *Bad type*: Fraud risk → fails or avoids. **✓**  
  - **Step 4:** Bad type can’t afford imitation (high failure risk). **✓**  
  - **Misfire Check:** Trait tied? Audit directly proves financial health → **Not a Signal** (it’s evidence, not handicap).  
  - **Verdict:** **Pass** (even if you dislike splashiness: cost proves quality directly).  

  ---

  ### Where the Lens Breaks (And How the Procedure Flags It)
  - **No receiver:** Step 2 stops → "Waste."  
  - **Consumption, not signal:** Step 3 stops → "Waste."  
  - **Trait physically tied:** Step 3 → "Not a Signal."  
  - **Multiple audiences:** Step 2 → "Ambiguous."  
  - **Fooled party ≠ payer:** Step 4 → "Escalate to Human" (your hunch was right).  

  ### Judgment Wearing a Lab Coat (Your Call, Not Science)
  - **Step 1:** Quantifying "waste" (is $500K for an audit irrational if revenue is $10M?).  
  - **Step 2:** Defining the receiver’s true motivation (e.g., "Do enterprises *actually* care about this audit?").  
  - **Step 3:** Assessing if a cost is "cheaper" for good types (requires industry intuition).  
  - **Step 4:** Gauging imitation risk (e.g., "Can a bad founder bluff a scientist hire?").  

  ### Final Advice
  - **Passes are rare:** Zahavi works best for "unfakeable" costs (e.g., audits, certifications).  
  - **Your soft spot:** The procedure overrules bias (e.g., audit passed despite splashiness).  
  - **When in doubt:** "Ambiguous" protects your fund. Save "Pass" for clear handicaps.  
  - **45-min hack:** Focus on Steps 2 (receiver) and 4 (imitation cost). They kill 80% of cases.  

  **Output:** A spreadsheet with columns for each step. If >2 "Ambiguous"/"Escalate" in 40 companies, revisit the lens.
