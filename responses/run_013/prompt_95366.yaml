prompt: |-
  I'm building a political theory seminar around Shakespeare's The Merchant of Venice as a case study in the boundary problem: who belongs to the demos that authorizes the law, given that no demos can democratically settle its own membership without already presupposing one? The play is unusually literal about the question, since Shylock's undoing turns on his standing as an alien who has sought the life of a citizen. Read it through that problem, doing justice both to the play and to the theory. What does Venice's treatment of Shylock reveal about the gap between being subject to a law and belonging to the body that makes it, and about the competing principle that all whose interests are affected should have a voice? Bring in the scenes that bear on membership: the trial, the casket test governed by Portia's dead father, a rule the living cannot revise, Jessica's conversion, and Portia's need to plead in disguise. Where does the play resist the reading, being about commerce, mercy, or revenge rather than membership? And does it dramatize something the theory misses, perhaps that a boundary is fixed less by any principle of inclusion than by the power of the majority to define itself? You need not quote the text; paraphrase the action.
