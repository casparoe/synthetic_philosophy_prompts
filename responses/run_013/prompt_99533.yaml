  For tiering: 
  Top tier should be #4 alone, as it successfully eliminates bare particulars by making individuation structural. 
  Mid-tier: #1 and #3 have merit but fatal flaws - #1's symmetric relations don't discern, #3 rejects the thought experiment's validity. 
  Bottom tier: #2 and #5 both surrender the principle's essence (#2 via haecceities, #5 by concession), while #6 actively counters the principle.

  Now for the sub-questions: 
