answer: |-
  ## Commencement Address: The Currents That Carry Us

  Good afternoon. It is profoundly moving to stand before you—graduates of my own high school, families who shaped me, and friends who’ve journeyed far to be here. I left this river town for college, spent fifteen years teaching philosophy in a bustling city, and returned this year to help care for my father. Coming back, walking these familiar streets, seeing faces I’ve known since childhood, has stirred a question I can’t shake, a question that feels urgent for this moment: **Is the way of life I was raised in here, or the one I eventually adopted in the city, more defensible? Or is that very question itself somehow broken?**

  I grew up learning what I’ll call the **ethic of the done thing**. Here, a good life meant showing up. It meant fixing Old Man Henderson’s fence after the spring flood without waiting to be asked, because it needed fixing. It meant keeping your word, not making a fuss, staying close to family, and trusting that the work itself—raising a child, running a lathe at the old factory, tending the fields—was its own reason. *Why* you did it wasn’t endlessly questioned; the need was clear, and the doing was the point. Asking "why" too much could feel like doubting the foundations holding us all up. Think of Mrs. Davies, running the diner on Main Street for forty years. She didn’t give speeches about the philosophy of service. She saw a hungry shift worker, a lonely retiree, a broke kid, and she served the pie. The need was there; the doing was the answer.

  Then I entered the **ethic of the justified thing**. There, a good life meant choosing wisely. It meant finding the *best* program, the *most* stimulating city, the *most* fulfilling career, the partner who helps you "self-actualize." Every major step demanded reasons, explanations, justifications. An unexamined life, one you couldn’t articulate a defense for, seemed suspect. It valued mobility, exploration, rigorous questioning. Think of my university colleagues designing a complex study. Before a single experiment runs, they must justify every step: *Why* this hypothesis? *Why* this method? The clarity of the justification *is* the path forward.

  Each outlook has profound wisdom. The ethic of the done thing understands loyalty, duty, and the quiet dignity found in meeting tangible needs. It builds communities that hold fast. But it risks mistaking inherited obligation for unassailable truth, sometimes seeing necessary questions as betrayal. The ethic of the justified thing values autonomy, critical thought, and the freedom to craft a unique path. It pushes boundaries and seeks deeper understanding. But it risks mistaking rootlessness for liberation, sometimes seeing deep, local attachments as failures of ambition, and turning life into a constant performance review where nothing is ever quite justified *enough*.

  So, which is more defensible? Here’s where the question itself might be rigged. Asking for a formal *defense*… that’s already speaking the language of the justified thing! It’s like asking if a hammer is more defensible than a song. A hammer defends its worth by driving a nail straight and true. A song defends its worth by stirring the heart. They answer different needs. To demand that Mrs. Davies justify her pie beyond the satisfied hunger of her neighbor misses the point. To demand that my colleague *stop* justifying her research and just "do" science without rigor would destroy its value.

  **The deeper truth isn't that one ethic is stronger, but that both are necessary responses to different human needs and moments.** The ethic of the done thing defends the vital ground of belonging, care, and steadfastness. It anchors us. The ethic of the justified thing defends the vital frontier of growth, exploration, and understanding. It propels us. Neither sees the full picture alone. The "done thing" can become unthinking rigidity; the "justified thing" can become paralyzing abstraction.

  Graduates, your paths diverge today – universities, trades, military, hometown jobs. Some of you will stay rooted deep in the fertile soil of this place, embodying the powerful ethic of showing up, fixing the fence, serving the pie. Some of you will sail towards horizons that demand constant justification, crafting intricate arguments for your choices. Many of you will weave threads of both throughout your lives.

  So, don’t ask whether the riverbank is more defensible than the open sea. Ask instead: What needs doing *here*? What needs questioning *there*? Learn to recognize the quiet power in the done thing, the necessary courage in the justified thing. See the blindness in each, and the strength. Defend not just *your* choice, but the dignity inherent in the different paths others walk. Defend the hammer *for* driving the nail. Defend the song *for* stirring the soul. Defend the river that holds the bank *and* flows to the ocean.

  Wherever your current takes you, carry this truth: A truly defensible life isn't found in rigidly choosing one shore over the other, but in understanding the depth of the water that connects us all. Congratulations, Class of [Year]. Build well. Question well. Live well.
