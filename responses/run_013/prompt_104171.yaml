answer: |-
  Your grasp of Augustine's paradox is precise—the tension between "one will not entire" and "two wills" is deliberate and philosophically rich. Let's break it down step-by-step, staying close to the text and context:

  ### 1. **The "Two Wills" Paradox: Reflexivity as Key**
     - **The Reflexive Structure**:  
       Augustine insists the will commands *itself* ("the will commandeth that there be a will; not another, but itself"). This reflexivity is crucial: the will is both *agent* (commander) and *patient* (commanded). It is not two entities but one reality experiencing internal division. The "monstrousness" arises because a unified faculty is at war with itself—a single subject caught in self-contradiction.
       
       > *What breaks if reflexivity is dropped?*  
       If the will commanded *another* will (e.g., a "higher self"), this would imply Manichean dualism (two natures). Augustine explicitly rejects this in Book VIII.x, mocking those who "fabricate two souls." Reflexivity preserves moral responsibility: *I* am the one failing, not a foreign force.

     - **"Two Wills" as Descriptive, Not Ontological**:  
       The final sentence ("there are two wills...") is an analytical tool, not a metaphysical claim. Augustine clarifies: "one of them is not entire." This "two" signifies *polarities within a single fractured will*:  
       - **Will A**: The rational desire for the Good (truth "upborne").  
       - **Will B**: The habituated desire for lesser goods ("borne down by custom").  
       Neither is a complete "will"; they are fragments of a divided volitional act. The "two" language underscores the *experienced reality* of conflict, while the reflexivity ("commands itself") prevents reification into separate agents.

     - **Book VIII.x Confirmation**:  
       Augustine derides the Manichean "two minds" theory: "Let them perish from Thy presence... who say there are two wills." His "two wills" is a dialectical move to expose how a diseased will *feels* like duality, while affirming it remains one accountable self. The chapter sharpens, not resolves, the paradox: akrasia is a *mystery of the singular self's fragmentation*.

  ---

  ### 2. **Synchronic Akrasia vs. Temporal Discounting**
     Augustine describes **synchronic akrasia**: conflict within a *single moment* ("partly to will, partly to nill"). Modern hyperbolic discounting models **diachronic akrasia**: conflict *across time* (e.g., present self vs. future self). 

     - **Why Discounting Models Fail Here**:  
       - They assume each "self" has coherent preferences at a given time. Augustine’s will is *incoherent at an instant*—it simultaneously wills and nills virtue.  
       - Discounting cannot capture "not-entire" willing because its formalism requires stable, ranked preferences per time-slice. Augustine's will lacks unity even synchronically.

     - **What Modern Models Lose**:  
       The existential weight of *immediate self-betrayal*. For Augustine, the agony is that "I" am actively thwarting my own command *right now*. Hyperbolic discounting externalizes conflict ("my future self will relapse"); Augustine internalizes it ("*I* am the relapse").

  ---

  ### 3. **The Role of "Custom" (consuetudo)**
     Augustine defines custom as the force that "bears down" the mind, preventing it from fully rising to truth. It is:  
     - **Habituated Desire**: Not just past actions, but the *inertial weight* of repeated choices that warps the will’s orientation.  
     - **Internalized Force**: Custom is not an external object but a deformation *within* the will itself ("a disease of the mind").  
     - **Contrast with Modern Accounts**:  
       Behavioral economics treats habits as revealed preferences or cognitive biases. Augustine’s *consuetudo* is a *moral-ontological drag*—the accumulation of sinful choices that disables the will’s capacity for wholehearted love of God. Modern models lack this normative depth; "present bias" is neutral, while *consuetudo* is intrinsically pathological.

  ---

  ### Key Takeaways:
  1. **"Two wills"** is Augustine’s phenomenological description of a *reflexively fractured will*. It is not dualism but a metaphor for inner conflict within one agent.  
  2. **Synchronic akrasia** is irreducible to temporal preference shifts. Augustine exposes a will divided against itself *in the present moment*.  
  3. **Custom** is the habituated sin that actively resists the will’s alignment with truth—a concept richer than behavioral "habits."  
  4. **Book VIII.x** reinforces this: Mocking Manicheans underscores that conflict stems from the *self’s sin*, not cosmic dualism. The reflexivity ("commands itself") is non-negotiable—it grounds accountability.  

  Augustine’s genius lies in showing that akrasia is not just a failure to act but a failure to *be a unified self*. Modern accounts, by contrast, often assume a stable self and model its time-inconsistent choices—missing Augustine’s profound insight into the disintegrated subject.
