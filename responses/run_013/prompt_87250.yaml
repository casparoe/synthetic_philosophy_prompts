prompt: |-
  I'm on the board of our town's little local history museum — not an academic, I'm a retired postman who got roped in, so don't bury me in jargon.

  Here's the mess. There's a field at the edge of town that everyone's called Bloody Meadow for as long as anyone remembers, and the story is that a battle was fought there involving King Arthur's men (or a local lord who's supposed to be the "real" Arthur, depending on who's telling it). A Victorian vicar wrote the story down, and that's the earliest version anyone's got. Last year a metal-detector bloke pulled a buckle and two coins out of the field; the finds officer dated the coins to roughly the 5th–6th century, one of them struck maybe eighty years after the battle's supposed to have happened. Then the county archaeologist dug a trench and found a ditch, some cattle bones, and nothing else. Now the tourist board wants a sign saying "Site of the Battle of ___" to pull in coach tours, a family in town says it's their history passed down for generations, and a donor has offered to pay for a new gallery if we tell "the real story."

  We meet Thursday and I have to bring something. What I want from you: a recommendation on how we word the field sign and the gallery labels — do we say "legend", "tradition", "possible site", and does the buckle change anything — plus a rule we can actually apply the next time someone walks in with a story like this, and what we tell the donor if they insist on the stronger wording. One board member keeps saying you can't prove a negative and that Troy and the Exodus are the exact same argument; another says a museum has a duty not to launder a story into a fact. I think they're both partly right and I can't work out how to split it.

  Give it to me as exactly five numbered points, a sentence or two each, no intro and no closing paragraph — I'll read them straight out at the meeting.
reasoning: |-
  Okay, the user is on the board of a local history museum and needs help with a tricky situation about a field called Bloody Meadow. They've got legends about a King Arthur battle, some artifacts found, and pressure from different groups. They need clear, numbered points for a meeting.

  First, I need to understand the core issues. The field has a long-standing legend tied to King Arthur, but the earliest written record is from a Victorian vicar. Metal detector finds include a buckle and coins from the 5th-6th century, with one coin dated about 80 years after the supposed battle. An archaeological dig found a ditch and cattle bones but no battle evidence. Now, the tourist board wants a sign declaring it a battle site, a family claims generational history, and a donor offers funding for a gallery if they present "the real story." Board members are divided: one argues you can't prove a negative and compares it to Troy/Exodus, another says museums shouldn't present stories as facts.

  The user wants recommendations on wording for signs and labels, a rule for future similar cases, and how to handle the donor. They need five concise points without jargon. 

  Looking deeper, the user might be worried about balancing community traditions with historical accuracy. They need to maintain the museum's credibility while engaging the public and securing funding. There's also potential conflict within the board and pressure from external groups. The mention of Troy and Exodus shows concerns about how legends can sometimes be rooted in truth, but museums must distinguish between evidence and folklore.

  For the sign wording, using "tradition" or "legend" is better than "site of" to avoid claiming unverified facts. The artifacts don't confirm a battle; the coin post-dates the event, and the ditch with cattle bones suggests agricultural use. The gallery should present the Victorian story as local folklore, mention the finds neutrally, and note the lack of archaeological evidence. 

  For future cases, a clear policy is needed: require written records and physical evidence, with labels indicating the level of verification. Regarding the donor, emphasize the museum's role in education over storytelling, possibly finding a compromise like acknowledging their support while maintaining accuracy. 

  The board members' points are both valid: while you can't prove a negative, museums shouldn't present unverified stories as facts. The solution is transparency about what's known vs. what's legend. This approach respects community traditions without compromising integrity.
answer: |-
  Here are your five numbered points:

  1.  **Field Sign Wording:** Use "Bloody Meadow: Site of Local Legend" or "Tradition says this is the Battlefield of [Name]". Avoid "Site of the Battle...". The buckle/coins don't confirm the battle; they show *some* early medieval activity, but are not definitive evidence.
  2.  **Gallery Label Approach:** Present it as folklore: "The Legend of Bloody Meadow", "The Victorian Story", or "Local Tradition and the Search for Evidence". Mention the Victorian source, the finds (neutrally stating their date/type), and the lack of archaeological battle evidence found so far. Do *not* present it as established history.
  3.  **Rule for Future Stories:** Require verifiable evidence *before* labelling as fact. A story needs either contemporary written records *or* conclusive physical evidence (like clustered weapons, mass graves directly linked by context) to be presented as historical event, not just tradition.
  4.  **Addressing the "Can't Prove a Negative" Argument:** While true, the museum's duty is to present *verified* facts, not unverified claims. Our role is to say "Here's the story and here's the *current evidence*", not to assert unproven events. Troy had texts *and* archaeology; we lack the archaeology here.
  5.  **Response to the Donor:** Thank them sincerely. Explain the museum must present stories accurately based on evidence to maintain credibility and fulfill its educational mission. Offer to prominently feature the "Bloody Meadow legend" in the new gallery *as local tradition*, crediting their support, but we cannot present unverified legend as confirmed history.
