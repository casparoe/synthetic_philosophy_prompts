prompt: |-
  I am a novelist under contract, revising a draft whose unity depends on a handful of recurring motifs, and I need a working procedure rather than encouragement. Hofstadter's account of creativity as variation on a theme, with its image of knob-twiddling, has been more useful to me than any craft manual, but I cannot operationalize it when I am tired and behind. Please turn it into a procedure I can run on a scene, a chapter, or the whole book: the steps in order; how to identify a motif's invariant core, its surface knobs, and its relational knobs, where relational knobs govern how one variation constrains another; how to vary knobs one at a time or in licensed gangs rather than by random cleverness; the tests that tell me a variation has crossed from the same theme into a different one; and the points where the procedure must stop and hand the decision back to me because the question is about meaning and not structure. Treat each motif as a point in a variation lattice, with single-knob turns as edges and ganged turns as moves across several edges at once, and say when a ganged turn is warranted. Run the procedure on three cases from a hypothetical novel: a repeated image, a character's signature gesture, and the book's ending. Include one case where the procedure tells me to cut or radically alter something I am attached to, and close by saying what the procedure cannot do. I revise daily, have two weeks before the manuscript is due, and cannot add new research. Lead with the procedure in one sentence, then give the steps. Keep the whole answer to one page, no more than 900 words.
reasoning: |-
  Okay, let me tackle this complex request from a novelist in need. The user describes struggling with motif variations using Hofstadter's knob-twiddling concept but needing concrete steps. They're clearly under deadline pressure with two weeks left, so efficiency is key. 

  First, I consider how to structure the response. The user wants a mechanical procedure, not encouragement, so I'll avoid fluff. The core challenge is translating abstract concepts (invariant cores, relational knobs) into actionable steps. I recall Hofstadter's analogy of DNA variations - the base structure remains while surface features mutate. That's useful for explaining invariant cores versus knobs.

  For the procedure design, I'm thinking in terms of discrete operations: identify, isolate, vary, test. The lattice metaphor works well for visualizing single and multi-knob adjustments. Important to emphasize when to stop - meaning decisions must remain human. The user specifically requested examples where the procedure forces hard cuts, which shows they want objectivity, not self-indulgence.

  The three test cases need careful selection. A visual motif (like their crows example) demonstrates surface knobs. A character gesture reveals relational knobs since it interacts with other elements. The ending variation case must include a "kill your darlings" moment - perhaps where emotional payoff clashes with structural needs. 

  Throughout, I'm mindful of their constraints: no new research, daily revisions. The steps must work for scenes, chapters, or whole manuscripts. Crucially, the procedure should flag when variations break theme integrity - that "different theme" test might involve narrative dissonance or broken patterns.

  Finally, I'll explicitly state the procedure's limits. It can't invent new motifs or resolve meaning-level dilemmas. The novelist retains creative authority; this is just a variation engine. Keeping it under 900 words means every sentence must pull weight - more like a technical manual than writing advice.
answer: |-
  ### **Motif Variation Procedure:** Systematically vary motifs while preserving thematic unity through controlled knob adjustments across a lattice of possibilities.

  **Steps:**  
  1.  **Isolate Motif & Define Core:**  
      *   Identify the recurring element (image, gesture, plot beat).  
      *   **Invariant Core:** State its *essential, unchanging function* (e.g., crow image: *"signals impending misfortune"*; character taps temple: *"indicates suppressed frustration"*; ending: *"protagonist sacrifices desire for duty"*).  

  2.  **List Surface Knobs:**  
      *   Identify attributes that change its *form without altering core function*:  
          *   *Image:* Sensory details (color, size, sound), context (weather, location), associated object (feather vs. whole bird).  
          *   *Gesture:* Body part (finger vs. fist), speed, intensity, accompanying sound (sigh, grunt).  
          *   *Plot/Ending:* Specific actions taken, objects involved, immediate setting, secondary characters present.  

  3.  **List Relational Knobs:**  
      *   Identify attributes governing *interactions with other motifs/themes*:  
          *   Timing (when it appears relative to other events), character perspective (who observes/initiates it), causal link (does it trigger/result from another motif?), thematic resonance (which secondary theme does it amplify?).  

  4.  **Vary Knobs Systematically:**  
      *   **Single-Knob Turn:** Change one surface or relational knob value. (e.g., Crow image: Change *color* knob from black to white; Gesture: Change *speed* knob from slow tap to rapid drumming).  
      *   **Ganged Turn:** Adjust multiple knobs *only if*:  
          a) They are relationally linked (e.g., changing the *character perspective* knob on the gesture might necessitate changing the *observer's reaction* knob elsewhere).  
          b) A surface change requires a relational update for coherence (e.g., changing the ending's *setting* knob from battlefield to hospital *gangs* with changing the *sacrificial object* knob from weapon to medical license).  
      *   *Avoid random cleverness; test minimal changes first.*  

  5.  **Test for Theme Integrity:**  
      *   After *each* variation (single or ganged), ask:  
          a) Does this still fulfill the **Invariant Core** function?  
          b) Does it distort established **Relational Knob** links with other motifs? (e.g., Does a white crow still *feel* ominous in *this* story's established symbolic logic? Does a frantic temple tap still read as frustration, not panic?)  
      *   **Crossed Theme Threshold?** If the variation fundamentally changes the core function (e.g., the crow now symbolizes hope; the gesture signifies joy; the ending becomes selfish) OR irreparably severs critical relational links, it's a new theme. Revert or consciously redefine the core.  

  6.  **Handoff to Author:**  
      *   **Stop and Decide** when:  
          a) Multiple valid variations pass the integrity test, and the choice impacts *meaning* (e.g., *which* misfortune does the crow foreshadow? *Which* desire is sacrificed?).  
          b) Core function needs redefinition based on accumulated variations.  
          c) A variation "works" structurally but feels emotionally false.  

  **Case Applications:**

  1.  **Repeated Image (Crows signaling misfortune):**  
      *   **Core:** Signal impending misfortune.  
      *   **Surface Knobs:** Number (solitary vs. murder), proximity (distant vs. perched on windowsill), action (flying vs. staring vs. pecking).  
      *   **Relational Knobs:** Character who sees it (protagonist vs. oblivious sidekick), time before misfortune strikes (immediate next scene vs. 3 chapters later).  
      *   **Variation:** Change *number* (solitary) + *action* (staring silently) + *proximity* (perched on protagonist's windowsill). **Test:** Intensifies dread (core preserved).  
      *   **Radical Cut/Change:** If crows appeared *after* misfortunes as observers, this breaks the core "impending" function. Cut or redefine core (e.g., "markers of consequence").

  2.  **Character's Signature Gesture (Taps temple when frustrated):**  
      *   **Core:** Indicates suppressed frustration.  
      *   **Surface Knobs:** Force (light tap vs. hard knock), duration, sound (audible thump vs. silent).  
      *   **Relational Knobs:** Trigger (minor irritation vs. major betrayal), audience (alone vs. public scene), consequence (ignored vs. triggers another character's reaction).  
      *   **Ganged Turn:** Trigger = major betrayal + Force = hard knock + Sound = audible + Audience = public. **Test:** Shows escalating frustration (core preserved), triggers relational consequence (e.g., audience gasps).  
      *   **Threshold Cross:** If they tap temple while laughing joyfully, core is broken.

  3.  **Book's Ending (Protagonist sacrifices desire for duty):**  
      *   **Core:** Sacrifice desire for duty.  
      *   **Surface Knobs:** Desire sacrificed (love, freedom, ambition), duty fulfilled (family, country, oath), literal action taken (resigns, leaves, destroys object).  
      *   **Relational Knobs:** Finality (permanent vs. ambiguous), cost (personal ruin vs. bittersweet), thematic echo (mirrors/contrasts earlier sacrifice motif?).  
      *   **Variation:** Change *desire* knob from "love of person A" to "dream of career" + *duty* knob from "family business" to "saving community". **Test:** Core preserved if sacrifice feels equivalently weighty.  
      *   **Radical Cut/Change (Attachment Lost):** Your drafted ending has them sacrificing duty *for* desire (e.g., abandoning post to elope). **Procedure Flags:** This inverts the invariant core. You must: a) Revert to core, b) Redefine core (e.g., "chooses authenticity over obligation"), or c) Cut this ending as structurally incoherent with motif unity. *The procedure forces this hard choice.*

  **What This Procedure Cannot Do:**  
  *   Invent new motifs or core themes.  
  *   Define the invariant core *for* you; you must know your themes.  
  *   Judge the emotional or aesthetic *quality* of a variation, only its structural integrity with the core.  
  *   Resolve ambiguities handed back at Author Decision points (Step 6).  
  *   Add depth missing from the original draft; it refines, not creates ex nihilo.  

  **Execute daily on 1-2 critical motifs per session. Prioritize motifs underpinning key scenes or the ending. Trust the lattice; systematic tweaks beat inspired chaos under deadline.**
