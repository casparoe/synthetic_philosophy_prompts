  First, I need to unpack their examples: the vulnerability score weights, the student benefit metric, and the health-policy quality adjustments. Each case shows how value judgments are hidden in what's presented as technical decisions. The user is frustrated because these comparisons are consequential but never openly debated as ethical choices. 

  They mention knowing about interpersonal utility comparisons being deemed meaningless and the idea that measurement isn't value-neutral. But they feel those concepts are either too broad or opposite to what they're observing. They want something more precise—how the comparison is smuggled into the instrument and shielded by its technical label.

  Now, brainstorming terms. "Commensuration" comes to mind, as it's about reducing different values to a common metric. But does it capture the ethical evasion? Maybe not entirely. "Reification" is another candidate, where abstract concepts are treated as concrete, but it doesn't emphasize the technical hiding aspect. 

  "Black-boxing" from STS (Science and Technology Studies) fits because it describes hiding complex processes inside a "black box" that's taken for granted. However, the user might not be familiar with STS jargon. "Implicit valuation" is descriptive but too broad. 

  "Value-ladenness of technology" is related but focuses more on the tech itself than the act of comparison. "Administrative triage" is context-specific, not a general term. 

  "Metrological arbitrage" is a coined term combining measurement and strategic avoidance. It highlights exploiting the gap between technical and ethical domains. This seems strong, but I need to check if it fully addresses their examples.

  The user’s deeper needs: They’re a PhD student trying to frame their observation academically. They need precise terminology to critique policy methods. They might be seeking validation that this is a recognized issue, or tools to articulate it in their work. They also want boundaries: when does this phenomenon start/stop? How does it relate to explicit ethical debates?

  Considering their econ background, terms from welfare economics or philosophy of economics would resonate. They’re offline, so citations aren’t needed, but conceptual clarity is key. The coined term should be intuitive yet capture the evasion tactic. "Metrological arbitrage" does that—metrology for measurement science, arbitrage for exploiting gaps. 

  Testing the term against their questions: If weights are openly debated, it’s not arbitrage—it’s explicit ethics. If a decision-maker owns the judgment, it becomes ethical accountability, not smuggling. Physical units might still involve this if the choice of unit itself embeds comparison (e.g., using DALYs vs. QALYs). It’s a response to the arbitrariness worry: instead of avoiding comparisons, it buries them in tech choices to avoid scrutiny.

  In conclusion, "metrological arbitrage" seems the best fit. It names the move, addresses the evasion, and provides a framework for their critique. The user gets a precise tool for their academic work, satisfying their need to articulate and analyze this pattern.
answer: |-
  This is a **brilliant** observation that cuts to the heart of how policy actually gets made and why philosophical critiques often feel disconnected. You're identifying a pervasive and consequential move, and you're right that the standard "measurement isn't neutral" critique often misses its specific *structure*. Let's brainstorm candidate terms/literatures and then refine:

  **Candidate Terms & Literatures (and Why They Fall Short):**

  1.  **Commensuration (Espeland & Stevens, Sociology/Science & Technology Studies):**
      *   **What it is:** The process of transforming qualitatively different things into a common quantitative metric that allows comparison and calculation (like your vulnerability score or QALYs).
      *   **Why it's close:** It directly describes the technical act of creating the comparable unit (the score, the dollar benefit, the QALY).
      *   **Why it falls short:** Commensuration *enables* the move you describe but doesn't *name* the specific **evasion of ethical responsibility**. It describes the mechanism of comparison but not the discursive strategy of labeling it "merely technical" to avoid ethical scrutiny. Commensuration can be openly debated as an ethical act.

  2.  **Reification (Lukács, Critical Theory/Philosophy):**
      *   **What it is:** Treating social constructs (like vulnerability scores) as if they were objective, natural facts, obscuring the human choices and power relations behind them.
      *   **Why it's close:** The "vulnerability score" *becomes* the reality of who is worse off, hiding the contingent choices about weights.
      *   **Why it falls short:** Reification is broader. It applies to many social constructs (money, law, institutions) and focuses on the *outcome* (the thing appearing natural). Your focus is on the specific *act of embedding interpersonal comparison within the technical specification* as a deliberate (if often unacknowledged) strategy to avoid ethical debate. Reification is the fog; your move is the specific mechanism deployed *into* the fog.

  3.  **Implicit Valuation / Hidden Normativity (General Philosophy of Science/Ethics):**
      *   **What it is:** The idea that values and norms are embedded within seemingly objective scientific or technical practices.
      *   **Why it's close:** This is the broadest relevant category. It captures the core insight that values are present.
      *   **Why it falls short:** It lacks the *specificity* of your observation – the focus on **interpersonal comparison** being the specific value smuggled in, and the **strategic use of "technicality"** as an insulation tactic. It doesn't capture the *consequential act of ranking lives* hidden inside the formula.

  4.  **Black-Boxing (Latour, Actor-Network Theory/Science & Technology Studies):**
      *   **What it is:** The process by which the complex inner workings of a system (like how a vulnerability score is calculated) are hidden from view, making the input/output relationship seem simple and inevitable.
      *   **Why it's close:** The weights *are* black-boxed. The "technical choice" framing seals the box, preventing inquiry into the values inside.
      *   **Why it falls short:** Black-boxing describes the *concealment*, but doesn't specify *what* is concealed (interpersonal comparison) or the *discursive justification* ("it's just technical"). It focuses on the opacity, not the specific ethical content hidden or the move to declare it non-ethical.

  5.  **Value-Ladenness of Technology/Models (Philosophy of Technology/Economics):**
      *   **What it is:** The recognition that technologies and models embed specific values and worldviews by their very design and function.
      *   **Why it's close:** The metric *is* the technology/model, and it *is* value-laden with interpersonal comparisons.
      *   **Why it falls short:** Similar to "implicit valuation," it's broad. It doesn't pinpoint the specific act of **using the technical specification *as the site* for the interpersonal comparison** precisely to **deflect** the "interpersonal comparisons are arbitrary/unscientific/ethical" critique. The *strategic evasion* is key.

  6.  **Administrative Triage / Bureaucratic Rationalization (Weber, Sociology):**
      *   **What it is:** The use of standardized procedures and rules within bureaucracies to make complex/distributive decisions efficiently, often masking the ethical choices involved.
      *   **Why it's close:** Your examples are classic bureaucratic contexts using rules (scores, models) for allocation (triage). Efficiency justifies the "technical" nature.
      *   **Why it falls short:** While contextually accurate, it names the *setting* and *function* rather than the specific *epistemic/ethical move* of embedding and insulating the comparison within the technical specification itself. It focuses on the organizational logic, not the structure of the justification.

  **The Best Fit & Coining a Term:**

  While "commensuration" and "black-boxing" come closest descriptively, they lack the crucial element of **strategic ethical evasion through the declaration of technicality**. This evasion *is* the core of what you're seeing.

  Therefore, I propose coining the term: **"Metrological Arbitrage"**.

  *   **Definition:** The strategic practice of embedding contestable interpersonal welfare comparisons (or value judgments with distributive consequences) within the technical specifications of a measurement instrument, model, or algorithm, and subsequently invoking the "merely technical" or "objective" nature of that instrument to insulate those embedded comparisons from ethical scrutiny, debate, or responsibility.
  *   **Why "Metrological"?** (Metrology = science of measurement). It centers the act of *measurement* and instrument *design* as the site where the comparison happens.
  *   **Why "Arbitrage"?** In finance, arbitrage exploits price differences between markets for profit. Here, it exploits the perceived gap *between* the domain of "technical expertise" (where the weights are set, the model is built) and the domain of "ethical/political debate" (where interpersonal comparisons should be argued). The practitioner "profits" by avoiding accountability/responsibility by moving the comparison into the "technical" domain.

  **Pushing on the Edges (Your Specific Questions):**

  1.  **Explicit & Debated Weights:** If the weights are explicitly debated *as ethical choices* (e.g., "Should disability count double income loss? Let's argue that ethically."), then it's **not** metrological arbitrage. The comparison is brought into the open ethical/political domain. The arbitrage relies on the *insulation*. Open debate dissolves the arbitrage.
  2.  **Single Decision-Maker Owning the Judgment:** If a single authority sets the weights and *explicitly states*, "These weights represent *my* ethical judgment about relative hardship," it **mitigates** the arbitrage. The comparison is still embedded technically, but the ethical ownership is claimed. However, a trace remains: the *form* of the technical instrument might still lend an air of objectivity or precision that the raw ethical claim wouldn't have, potentially obscuring the inherent contestability. It's on the boundary.
  3.  **Physical Quantities as Units:** The phenomenon **absolutely persists**. Choosing *which* physical quantity to measure, *how* to aggregate it, or *which* proxy to use embeds comparisons. Example: Measuring "educational benefit" by standardized test scores (a physical quantity: number correct) implicitly compares students *based on that specific skill set*, hiding judgments about what constitutes "benefit" and for whom. Choosing DALYs (Disability-Adjusted Life Years) over simple life expectancy embeds judgments about quality vs. quantity of life. The "technical choice" of the physical metric *is* the site of the comparison.
  4.  **Relation to the "Arbitrariness" Worry:** Metrological arbitrage is **a specific institutionalized response to and enactment of** the worry that interpersonal comparisons are arbitrary/unscientific/too contested.
      *   **Response:** Faced with the philosophical/political difficulty of justifying comparisons openly ("How can we *say* family A is 1.2x worse off than family B?"), institutions retreat to building a "technical" apparatus where the comparison happens *automatically* via weights/units/models.
      *   **Enactment:** By embedding the comparison in the technical choice (often made for convenience, data reasons, or historical accident) and refusing to defend it ethically, they *make* the comparison arbitrary in practice, even while giving it the appearance of objectivity. It doesn't solve the arbitrariness; it buries it under a layer of procedural legitimacy while functionally performing the comparison. It's a *practical coping mechanism* for the impossibility of fully objective comparisons, but one that hides the ethical stakes.

  **In essence:** You've pinpointed a crucial mechanism of modern governance and policy analysis. "Metrological arbitrage" names the specific move of *smuggling the ethically fraught comparison into the technical guts of the instrument and then pulling up the drawbridge of "expertise" or "methodology"* to prevent anyone from challenging the smuggled goods. It's how institutions "do" interpersonal comparison while pretending they aren't. Keep pushing on this – it's fundamental.
