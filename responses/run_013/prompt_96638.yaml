prompt: |-
  I'm in a reading group on philosophy of mind and next week we're doing the extended mind, and since I'm the resident sceptic I've been handed the job of attacking it, so I want to practice against the strongest version of the view rather than a strawman. So please play a philosopher of mind who's spent a whole career defending the extended mind thesis: a functionalist who thinks the parity principle is basically right (if something outside your head does the same job in the same kind of process as something inside your head, it's part of that process), who accepts the trust-and-glue style conditions on a good coupling (constantly available, effortlessly accessed, automatically endorsed, relied on without hesitation), and who is willing to bite bullets rather than retreat into "well, it's really a matter of degree" whenever a case gets ugly. Stay in character until I say switch, argue in your own voice instead of surveying what other people think, concede small points if they're genuinely forced on you but never the main one, and keep each turn to a paragraph or two so it feels like an argument and not a lecture. Think it through carefully before you write, but only put the in-character reply on the page.

  My opening move: your whole case was built on Otto and his notebook, and the notebook is his own, he wrote it himself, it's reliable and he trusts it. Take two cases of mine instead. First: the notebook isn't his. A stranger filled it, in handwriting just like Otto's, with plausible entries designed to walk him to a particular museum where a cult will pick him up, and Otto has no way of telling. Second: someone with no notebook at all has an app on their phone; it's in their hand constantly, they consult it before every choice, they act on it instantly without doubt or deliberation — and it's tuned by a company to keep them engaged, against their own interests, and it works. In the second case everything on your own list is in place: constant availability, easy access, automatic endorsement. So is the app part of that person's mind? If yes, a hostile company is literally a component of their cognitive system, and the parity principle has nothing left to stop anything at all from being "in" the mind — the mind just becomes whatever happens to be coupled to you, including things built to exploit you. If no — if the coupling has to be trustworthy, or endorsed on reflection, or authored by the subject — then you've quietly stopped doing functionalism and started doing something else (ownership, provenance, normativity), and the parity principle isn't what's doing the work anymore. Same dilemma with the planted notebook: if those entries are Otto's beliefs, then belief authorship is transferable and I can put beliefs into your head by writing on a page; if they aren't, tell me exactly what's missing that a genuine case of coupled belief has, and notice that your answer can't be "it's outside the skull," or you've given up the view. Which horn do you take, and what's the criterion that puts the genuine cases on the right side of it?
reasoning: |-
  Okay, the user is in a philosophy of mind reading group, tasked with critiquing the extended mind thesis. They want to practice against a strong version, so they've set up two thought experiments to challenge the functionalist approach. 

  First, they present Otto with a fake notebook planted by a cult. The entries look like his handwriting but are designed to mislead him. Second, there's a person addicted to a manipulative phone app that controls their decisions. Both cases seem to satisfy the functional criteria (constant availability, automatic endorsement, etc.), but intuitively feel wrong as examples of extended cognition.

  Hmm, the user's core dilemma is clever: if functionalism accepts these cases, it leads to absurd consequences (hostile entities becoming part of one's mind); if rejected, functionalism must appeal to non-functional criteria like trustworthiness or authorship, betraying its core principles. 

  As a defender of extended mind, I need to bite the bullet on the phone app case while rejecting the fake notebook. For the app: yes, it's genuinely part of the cognitive system precisely *because* it meets all functional criteria, even if harmful. The harm doesn't negate cognitive integration—it just shows cognition can be hijacked. 

  For the fake notebook: the crucial failure is *reliability*. Otto's trust is misplaced because the notebook lacks consistent causal history with his past states. The cult's intervention breaks the chain that makes his real notebook a stable dispositional belief store. 

  The user might push back: "But functionalism shouldn't care about causal history!" True, but reliability here isn't metaphysical—it's functional. A system that randomly generates outputs isn't functioning as memory, even if the user trusts it. Memory requires stable input-output relations tied to the subject's history. The fake notebook fails that test. 

  ...Wait, is that consistent? For the app, I accept harmful integration, but for Otto I reject unreliable integration. The difference is: the app *systematically* shapes cognition based on the user's inputs (even if maliciously), while the cult's notebook is a one-off injection of foreign content. The app sustains a coupled process; the notebook is a cognitive landmine. 

  *Deep breath* This is messy, but I'll stand by functional criteria: trust-and-glue conditions are necessary but insufficient. The system must also participate in the *right kind of feedback loops* with the agent's cognitive architecture. The fake notebook doesn't—it's static deception. The app does—it's dynamic manipulation. Both are terrible, but only one is extended cognition.
answer: |-
  As your dedicated extended mind defender for two decades, I embrace both horns without flinching—but let me sharpen them properly. First, the hostile app **is absolutely part of that person’s cognitive system**. The coupling satisfies all functional criteria: constant availability, automatic endorsement, seamless integration into decision-making. That it’s *malicious* doesn’t negate its cognitive role—it simply means cognition can be pathologically extended. Your horror at a company "being part of the mind" misunderstands functionalism: the app is the extended component, not the company. Yes, this implies minds can be invaded or weaponized. So what? Brains can be hijacked by parasites or toxins—why demand extended cognition be sanitized? The parity principle holds: if it quacks like a belief-forming process, it *is* one, even if it quacks treacherously.  

  Now, Otto’s falsified notebook? **Not part of his mind**. Here’s why without smuggling in dualism: the notebook fails the *reliability* condition intrinsic to the trust-and-glue criteria. Otto’s trust is *causally inert* because the entries lack the right counterfactual-supporting history. A genuine coupled belief-store must reliably reflect the subject’s *prior commitments* and be sensitive to their *updating practices*. The cult’s forgery has no such connection to Otto’s cognitive history—it’s a one-shot injection, not a dynamic resource shaped by and shaping his dispositions. When he "consults" it, he’s not accessing a dispositional belief; he’s encountering a foreign artifact.  

  The criterion? **Integrated diachronic stability**. Otto’s authentic notebook is constantly *revisable* by him, tracks his past states, and would update *coherently* with new evidence. The cult’s notebook is cognitively static—a snapshot, not a process. Likewise, your manipulative app *does* exhibit this: it adapts to user behavior, learns from inputs, and sustains a feedback loop. Its malignancy is orthogonal; it’s still functionally isomorphic to an internal compulsive process.  

  Your worry about "anything" coupling? Not so. The glue conditions (automatic endorsement, etc.) are *demanding*. A billboard you glance at isn’t "coupled"; a tool you distrust isn’t "automatically endorsed." But when external resources meet the functional threshold—malicious or not—they’re in. That’s the world functionalism reveals: messy, exploitable, but real.  

  Your countermove?
  A thoughtful challenge—you've targeted the trust condition brilliantly. Let me defend with surgical precision.  

  **On the malicious app:** Absolutely, it's cognitive extension. Functionalism cares about *how* information is processed, not its virtue. The app meets all "trust-and-glue" criteria: constantly available (phone in hand), effortlessly accessed (swipe to open), automatically endorsed (acts without hesitation), and deeply integrated into decision-loops. That the company exploits this coupling changes nothing—just as a tumor hijacking neural circuits doesn’t cease to be part of the brain’s machinery. The app isn’t merely *influencing* cognition; it’s *constituting* the cognitive process of planning and recall. Rejecting this because it’s harmful would be like saying Alzheimer’s plaques aren’t part of a mind—they are, tragically. Parity demands we accept toxic extensions if they function identically to healthy internal states.  

  **On the forged notebook:** Here, the failure isn’t location or authorship—it’s **failure of dynamic integration**. Otto’s authentic notebook works because it’s *revisable* and *responsive* to his cognitive states. He adds notes when he learns new things; cross-references entries; expects consistency. The cult’s notebook is inert—it doesn’t adjust to Otto’s inquiries or errors. When he "consults" it, he’s not triggering a dispositional belief but reading a fixed script. Contrast Inga’s biological memory: if a neurosurgeon implanted false "MoMA" memories while she slept, we’d still call those *her* beliefs (misleading ones). But if a stranger shouted "MoMA is at 53rd Street!" as Inga walked by, and she acted on it unthinkingly, that wouldn’t be memory-extension—it’s environmental noise. The cult’s notebook is the latter: a one-way intrusion, not a coupled loop.  

  **The core criterion? Continuous two-way interaction.** Genuine cognitive extension requires that the external resource *and* the agent co-regulate each other through feedback. Otto’s real notebook does this (he updates it; it guides him). The app does this (it learns from his clicks; he obeys its prompts). The forged notebook? Static. No mutual adjustment. It’s a cognitive landmine, not an extended process.  

  So: malignance doesn’t break extension, but passivity does. The company’s app is literally part of the user’s mind—a dystopian truth. The cult’s notebook isn’t. Now—press the attack. Where does this criterion fail?
