  Hmm, the user is grappling with a deep philosophical question about whether social rules are discovered or invented, specifically focusing on David Lewis's theory of conventions as presented in a popular book. They've shared a detailed summary of Lewis's ideas from this book, including the core concept that conventions are arbitrary, self-sustaining regularities maintained by mutual expectations (like driving rules or language). The summary then extends this to morality, claiming it too is just another convention. The user feels uneasy about this leap to morality and wants me to audit the summary's accuracy regarding Lewis.

  From what I recall about David Lewis's work (specifically his book "Convention: A Philosophical Study"), the summary gets several key elements right but also contains some simplifications and overreaches. Lewis does argue that conventions solve coordination problems where multiple solutions are possible (like which side to drive on), and that they persist through common knowledge and mutual expectations rather than formal agreements. His application to language is indeed central - words function through conventional agreement about meanings.

  However, the summary oversimplifies by calling conventions "arbitrary" without clarifying Lewis's precise meaning. For Lewis, arbitrariness means there are alternative equilibria, not that choices are irrational. More importantly, while Lewis does discuss promise-keeping as a convention, he explicitly distinguishes social conventions from moral rules. The extension to morality being "nothing more" than convention appears to be the book's addition, not Lewis's view.

  The user specifically mentions discomfort with the morality analogy and the "feeling bound" objection. On the feeling bound point: Lewis would likely argue this is explainable through the costs of deviating from expectations in different contexts (higher for language than for driving), not that it refutes his theory. Regarding morality, Lewis's actual work doesn't support equating it with conventions like driving rules - moral rules typically involve intrinsic reasons beyond coordination.

  The user wants a structured audit rather than a reading list or inaccessible citations. They've requested a specific format: bottom line, what's correct, claim-by-claim analysis, discussion of objections, evaluation of the morality leap, and a corrected summary. I'll follow this exactly while maintaining the accessible language of their original summary.

  I notice the user is intellectually honest - they admit their discomfort might stem from not wanting the conclusion to be true. This philosophical tension between descriptive convention and normative obligation is genuine. My response should honor that complexity while clarifying where the summary accurately represents Lewis versus where it overreaches.
answer: |-
  ### Bottom line
  The summary accurately captures Lewis's core mechanism of convention but oversimplifies his view of arbitrariness, misapplies his theory to morality, and overstates his claims about rational foundations. Trust the driving and language examples as faithful to Lewis, but be skeptical of the extensions to promise-keeping, taxes, and especially morality.

  ### What it gets right (≈150 words)
  Lewis *does* define conventions as self-sustaining regularities rooted in mutual expectations and common knowledge, solving coordination problems where multiple solutions are possible. The driving example is paradigmatic: any side works if all agree, and adherence stems from expectations, not law. Language is indeed Lewis's key application: words are conventions because meaning depends on shared expectations, not inherent correctness. He emphasizes conventions arise spontaneously without explicit agreement. The point about quarrelling over driving rules feeling different from moral quarrels is also correctly attributed to critics. Lewis *would* agree conventions like driving rules or word meanings are "arbitrary" in the specific sense that viable alternatives exist.

  ### Where it goes wrong, claim by claim (≈500 words)
  1.  **"Lewis starts from the fact that some things only work if everyone does the same thing..."** **Accurate.** This is Lewis's core "coordination problem" setup.
  2.  **"...which side it is does not matter, so the rule is arbitrary."** **Fair Simplification.** Lewis defines "arbitrary" technically: a regularity R is conventional only if *another* regularity R' *could* have solved the coordination problem just as well. "Does not matter" slightly underplays that stability matters, but the core is right.
  3.  **"What makes our all keeping to the right a convention... mutual expectation... common knowledge and self-sustaining."** **Accurate.** This is the heart of Lewis's definition (common knowledge of mutual expectations sustaining the regularity).
  4.  **"The same machinery explains why people keep promises, pay their taxes and tell the truth even when nobody is watching."** **Distortion.** Lewis *does* discuss promise-keeping as a possible convention (though its status is complex). Taxes and truth-telling are dubious extensions. Taxes often involve legal enforcement and perceived moral/practical obligation beyond pure coordination. Truth-telling involves deep epistemic and potentially moral norms Lewis didn't claim were *merely* conventional like driving rules. The summary overgeneralizes Lewis's scope.
  5.  **"Lewis's most striking application is to language... no different in kind from driving on the right."** **Accurate.** Language as convention is central to Lewis, and he explicitly argues linguistic conventions solve coordination problems just like driving rules.
  6.  **"Two things follow. Conventions are arbitrary... there is no reason to keep left rather than right..."** **Fair Simplification (with crucial nuance missing).** Lewis *does* say conventions are arbitrary in the *technical sense defined above* (viable alternatives exist). However, **Crucial Omission:** Lewis *emphatically does not* say "there is no rational foundation" *for adhering to the established convention*. Once a convention exists, there are *very good reasons* (rooted in expectations, desire for coordination, avoiding conflict/cost) to follow *this specific one*. "No reason" misleadingly implies adherence is irrational.
  7.  **"...no reason to speak English rather than French; we simply happen to have settled on one."** **Fair Simplification.** Again, "no reason" *to adopt one initially over the other* is fair *if* meaning viable alternatives exist. But "no reason" *to use English now that it's established* is misleading (see above). "Settled on one" captures the historical contingency.
  8.  **"And since they need no agreement and no law, they can arise and persist by themselves..."** **Accurate.** Lewis's key point is explaining how complex coordination emerges without central planning.
  9.  **"The critics say this cannot be the whole story, because we feel bound by the rules of our own language..."** **Accurate.** This is a common criticism Lewis engages with (e.g., by Grice).
  10. **"...the interesting part of the explanation is missing."** **Distortion.** Lewis *does* address this feeling. He argues the "binding" force in language stems from the *same* expectations and coordination needs, amplified by the immense costs and complexity of deviating linguistically compared to momentarily driving on the wrong side. He thinks his machinery *does* explain the feeling, though critics disagree on its sufficiency.
  11. **"The upshot is that morality is just one more convention of this kind — nothing more than a regularity we all happen to expect each other to follow."** **Major Distortion / Book's Addition.** This leap is **not** Lewis's view. Lewis carefully restricted his analysis to conventions solving *coordination problems*. While *some* social rules might fit, he did *not* claim *morality as a whole* is merely conventional in this sense. Moral rules often involve perceived intrinsic wrongness (like harming innocents), not just coordination with alternatives. The book here grafts a controversial (often "Humean" or "subjectivist") view of morality onto Lewis's theory, which he did not endorse. Lewis's work on convention is *descriptive*, not a reductive theory of normativity.

  ### The objection at the end (≈200 words)
  The point about "feeling bound" does **not refute** Lewis's account; it merely highlights a **limitation or challenge** he explicitly addressed. Lewis acknowledged the *intuition* that linguistic rules feel more "binding" or "normative" than driving rules. His response was that the *strength* and *nature* of the feeling arise from the *same core mechanism* (expectations and coordination) operating under different conditions. Deviating linguistically disrupts communication far more profoundly and constantly than momentarily driving on the wrong side. The *costs* of non-conformity (confusion, social exclusion, inability to achieve goals) are massively higher for language, generating a stronger sense of constraint. Critics argue this explanation is insufficient, that linguistic norms feel intrinsically "correct" in a way driving norms do not, pointing to a deeper normativity Lewis's model misses. However, Lewis provides a plausible, consistent explanation *within his framework* for the differing *feeling*, so it's a challenge to the completeness or psychological adequacy of his account, not a fatal refutation.

  ### Does the closing conclusion follow? (≈150 words)
  **No, the leap to morality does not follow legitimately from Lewis's theory as presented.** Lewis defined conventions specifically as solutions to *coordination problems* with *arbitrary* (in his technical sense) solutions. While *aspects* of social morality (e.g., etiquette, some property norms) might fit this model, core moral prohibitions (e.g., against torture or breaking promises *in contexts beyond pure coordination*) do not obviously present multiple, equally effective solutions where choice is indifferent. We typically feel moral rules are *not* arbitrary – harming innocents isn't wrong merely because we happened to coordinate on that expectation; it feels intrinsically wrong. Lewis himself did not extend his convention theory to reduce all morality this way. The summary's conclusion conflates Lewis's specific, technical concept of convention with a much broader and contested view of moral anti-realism that Lewis did not advocate for based solely on his convention work.

  ### A defensible restatement (≈150 words)
  "Lewis argues that conventions solve coordination problems – situations where everyone needs to do the same thing, but which specific thing doesn't inherently matter (like which side of the road to drive on). A convention exists when a regularity in behavior persists because everyone expects everyone else to follow it, everyone knows this, and it's in everyone's interest to conform given others do. This common knowledge and mutual expectation make the regularity self-sustaining. Language, for Lewis, works exactly this way: words mean what they do because of shared expectations, not inherent correctness. While conventions are 'arbitrary' in the sense that alternatives *could* have worked, once established, there are strong practical reasons to follow them. Critics argue this doesn't fully capture why language *rules* feel necessary. Lewis's view suggests *some* social rules are conventional, but it does not claim *all* morality is merely this kind of convention."
