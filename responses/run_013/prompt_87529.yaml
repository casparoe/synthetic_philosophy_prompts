  Hmm, this sixth-former is doing an EPQ on truth and wants to stress-test Jain philosophy, specifically anekantavada and syadvada. They're clearly grappling with some sophisticated concepts! Their physics example about electrons being both particles and waves is clever - they're pointing to what seems like an inherent duality in reality itself, not just different perspectives. And their second point about self-reference is a classic philosophical challenge to relativism. Smart kid.

