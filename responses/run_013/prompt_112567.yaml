prompt: |-
  I work as a loss adjuster for an insurer, so most of my week is spent reading incident reports and deciding who, if anyone, caused what. A pattern keeps nagging at me. Two reports can describe the same physical sequence — a machine does what it was always going to do, one person stands still, someone is killed — and yet everyone involved, myself included, will say that in one report the person who stood still caused the death and in the other they did not. The difference is never in what the person did with their body, because in both cases they did nothing at all. The difference is in whether standing still was a departure from what that person was supposed to be doing: the operator who should have hit the emergency stop, versus the visitor who was never going to. But it is not only duties. The same thing happens when the omission is merely unusual for the individual (a technician who always checks the valve and this time didn't), and, so far as I can tell, when it is unusual for anyone on site. It runs the other way for actions too: something a person actively did gets singled out as the cause only because it was the one step in the sequence that wasn't routine.

  What I want to know is whether there is an established name for this — for the phenomenon that our causal judgements seem to track what is normal or expected rather than what happened mechanically — and whether anyone has defended the strong version of the claim, that the norm is doing work in causation itself and not merely in our readiness to blame. I already know this is not just the distinction between doing and allowing: both of my people did nothing and merely let the death happen, so that distinction puts them on the same side of the line and cannot be what splits my cases. Nor can it be counterfactual dependence, since the counterfactuals are identical in the two reports. So: does the thing have a name, what are its nearest named relatives, and how precisely does it differ from each of them? If no single name covers the duty case, the statistical case and the habitual case together, say so, tell me which of them the existing vocabulary does cover, and give me a term and definition for what is left over. Please answer in British English.
reasoning: |-
  Okay, the user is a loss adjuster who's noticed a fascinating pattern in incident reports. They describe two scenarios where the physical sequence is identical - a machine operates normally, one person stands still, and someone dies. Yet in one case, that inaction is seen as causal (like an operator who should've hit the emergency stop), while in another it isn't (like a visitor who couldn't be expected to act). 

  What's striking is how the user has already ruled out obvious explanations. They know it's not about "doing vs allowing" since both involve inaction. They've also dismissed counterfactual dependence because the "what if" scenarios are identical in both cases. Their real question digs deeper into causation itself - whether norms actually shape causality rather than just blame.

  The user seems highly analytical, given how precisely they've dissected the problem. They're not satisfied with surface-level legal concepts and want philosophical rigor. That "strong version" question suggests they're flirting with metaphysics - wondering if causation itself is normative rather than mechanical. 

  For terminology, "normative relevance" in philosophy captures the duty aspect, while "abnormal conditions" covers statistical deviations. But their visitor/technician examples show it's broader - encompassing duties, habits, and statistical norms. The closest unified concept might be Schaffer's "contrastive causation," though it's not perfect. 

  Their insurance context matters too. As a loss adjuster, they need practical frameworks for assigning liability, but they're clearly troubled by how arbitrary "normal" can feel. There's an ethical tension here between legal causality and moral responsibility that they're circling around. 

  I should acknowledge how sharp their observation is - this is exactly the sort of case that makes philosophers argue over coffee. The fact that identical physical events get different causal labels based purely on expectations exposes how messy "cause" really is. Maybe that's their deeper itch: the discomfort with how much weight we put on these constructed norms when lives are at stake.
answer: |-
  Your observation is exceptionally sharp and cuts to the heart of complex debates in philosophy of causation, law, and moral responsibility. Here’s a breakdown addressing your query in British English:

  ### 1. **The Established Name(s)**
  The phenomenon you describe is most directly addressed by **Norm-Based Theories of Causation** (specifically, **Normative Relevance** or **Expectation-Relative Causation**). Key terms include:
     - **"Normative Causation"** or **"Deviant Causation"**: Where causation is ascribed to the *deviation* from a norm (duty, habit, or statistical regularity).
     - **"Omission Causation"** (in a norm-dependent sense): When failing to act is causal *only if* there was an expectation/duty to act.
     - **"Aberrant Causation"** (less common): Emphasising the *abnormality* of the event/inaction in the context.

  No single term perfectly unifies duty, statistical, and habitual cases, but **"Norm-Relative Causation"** is the broadest philosophical umbrella. Your cases illustrate **Hart and Honoré's "Common-Sense Causation"** (from *Causation in the Law*, 1959), where human actions/omissions are "causes" when they **interfere with normal expected processes**.

  ### 2. **Nearest Named Relatives & How Your Phenomenon Differs**
     - **"Doing vs. Allowing"**:  
       As you note, this fails: both cases involve "allowing." Your cases show that *within* "allowing," norms determine if it’s causal.
     - **Counterfactual Dependence (e.g., David Lewis)**:  
       Fails as you state: in both cases, "if they had acted, death wouldn’t have occurred." Norms explain why we *select* one counterfactual as relevant (the operator *should* have acted; the visitor *needn’t* have).
     - **"Inus Conditions" (J.L. Mackie)**:  
       (An Insufficient but Necessary part of an Unnecessary but Sufficient condition).  
       *Difference*: Norms determine which INUS condition is "the cause." The operator’s inaction is a "cause" because it’s the abnormal element; the visitor’s is not, as it’s part of the normal background.
     - **"Proximate Cause" (Legal Doctrine)**:  
       Focuses on foreseeability/directness. *Difference*: Your cases show norms affect *whether an omission is a cause at all*, not just if it’s "proximate."
     - **Moral Luck / Blameworthiness**:  
       *Difference*: You’re identifying a prior step—why we even *see* the omission as *causal* before assigning blame. Norms shape the causal judgment itself.

  ### 3. **The Strong Claim: Norms as Constitutive of Causation**
  This **is defended**, notably by:
     - **Hart and Honoré**: Argue causation in law/human affairs is intrinsically normative. We distinguish "causes" from "mere conditions" by reference to **what is normal or required**.
     - **Richard Wright**: Claims norms ("duty-bound patterns") define which omissions are "causes" in tort law.
     - **Jonathan Schaffer**: Proposes **"Contrastive Causation"** – we judge "A rather than B caused C" relative to a default/expected scenario (e.g., "operator not stopping rather than stopping" is causal; "visitor not acting rather than acting" is not, as "not acting" is the default).

  **How it works in your cases**:
  | **Case**                | **Norm**                          | **Deviation?** | **Causal Judgment** |
  |--------------------------|-----------------------------------|----------------|---------------------|
  | **Operator**             | Duty to hit emergency stop        | Yes            | **Cause**           |
  | **Visitor**              | No duty/expectation to act        | No             | **Not a cause**     |
  | **Technician**           | Habitual/standard procedure check | Yes            | **Cause**           |
  | **Non-routine action**   | Statistical regularity            | Yes            | **Cause**           |

  ### 4. **Term for the Unifying Phenomenon**
  While no perfect term covers all three (duty, statistical, habitual), **"Norm-Relative Causal Selection"** is defensible. For precision:
     - **Duty-Based Omission**: "**Breach-Causation**" (causal due to duty breach).
     - **Statistical/Habitual**: "**Aberrant Causation**" (causal due to deviation from statistical/habitual norms).
     - **Unifying Definition**:  
       > **"Normative Salience in Causation"**: The phenomenon whereby an act or omission is judged causal iff it **deviates from a contextually relevant norm** (moral, legal, statistical, or habitual), making it salient against the background of normal expectations.

  ### Why This Isn’t "Just Blame"
  The strong view (defended by Hart, Schaffer) holds that norms *structure our concept of causation* in social/legal contexts. We parse mechanical processes through a lens of human expectations: the operator’s inaction *changes the normative story* of how events *should* unfold, making it a "cause." The visitor’s identical inaction doesn’t alter that story—it’s just part of the expected course. Thus, norms don’t merely trigger blame; they delineate what counts as a cause *in the first instance*.

  ### In Short
  - **Names**: Norm-Based Causation, Normative Salience, Contrastive Causation.  
  - **Key Text**: H.L.A. Hart & Tony Honoré, *Causation in the Law* (1959).  
  - **Your Insight**: You’ve identified how causal judgments are **inherently contrastive** and **context-dependent** on norms—a view now mainstream in philosophy of law.
