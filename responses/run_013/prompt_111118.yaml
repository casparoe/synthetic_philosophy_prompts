  **Ex Ante Optimal Strategy:**  
  - At Node 1, choose **Enter (E)**.  
  - At each indistinguishable node (Nodes 2 and 3), choose **A with probability \( p = 0.5 \)** and **B with probability \( 1 - p = 0.5 \)**.  

  **Value Calculation:**  
  - Probability of the bonus outcome (A at Node 2 and B at Node 3): \( p \times (1 - p) = 0.5 \times 0.5 = 0.25 \).  
  - Probability of the penalty outcome (B at Node 2 and A at Node 3): \( (1 - p) \times p = 0.25 \).  
  - Probability of $0 outcome: \( 1 - 0.25 - 0.25 = 0.5 \).  
  - Expected bonus: \( (0.25 \times 10) + (0.25 \times (-5)) + (0.5 \times 0) = 2.5 - 1.25 = 1.25 \).  
  - Net payoff: \(-1\) (Node 1 fee) + \( 1.25 = \$0.25 \).  
  - **Ex ante value = $0.25**.

