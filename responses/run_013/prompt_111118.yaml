  ### Constructed Case: The Forgetful Meeting Bonus

  **Scenario:**  
  You are a consultant attending a series of meetings at a corporate office. The first meeting is in the CEO's office, which has a distinctive glass wall (recognizable cue). The next two meetings are in identical conference rooms (same layout, no distinguishing features). You cannot tell whether you are in the first or second conference room due to their identical appearance and the lack of contextual cues during the back-to-back schedule. Your memory of actions in prior meetings in these rooms is inaccessible once you leave, as the repetitive environment causes confusion. The stakes involve monetary payoffs and a small cost.

  - **Node 1 (CEO's office, distinguishable by glass wall):**  
    - **Leave (L):** End the process, receive $0.  
    - **Enter (E):** Pay a $1 fee to proceed to the conference rooms.  

  - **Nodes 2 and 3 (identical conference rooms, indistinguishable):**  
    - **Action A (Safe):** No immediate payoff.  
    - **Action B (Risky):** No immediate payoff.  
    - **Final bonus/penalty:**  
      - +$10 if you choose A in the first conference room (Node 2) and B in the second (Node 3).  
      - -$5 if you choose B in the first conference room (Node 2) and A in the second (Node 3).  
      - $0 otherwise.  

  The total payoff is: (Node 1 payoff) + (bonus/penalty). Actions at Nodes 2 and 3 must be identical because you cannot distinguish the rooms. You can randomize with any probability.

  ---

