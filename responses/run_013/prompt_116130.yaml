  Ok so I'm a junior and I'm in this philosophy club at my school (we meet in the library on thursdays, like six of us, one of them is a senior who has read way too much) and we've been doing a unit on probability and belief, and I've gotten into a really annoying fight with my debate partner about van Fraassen's reflection principle. The way I understood it is: if you're certain that at some later time you'll be r confident in some claim, then you should already be r confident in that claim right now, and the fancier version is that your current confidence in the claim, conditional on your later confidence in it being r, should just be r. The reason its bugging me is I can think of cases where it feels obviously wrong. Case 1: I know for a fact that at 1am tonight, after four hours of homework and no sleep, I'll be like 40% sure I can pass the history test, even though right now I'm at 85%. Nobody thinks I should drop to 40% just because sleepy-me is a mess. Case 2, which is my own and I'm kind of proud of it: tomorrow at the debate tournament I'll be 90% sure I'm going to win my round, and the reason I'll be at 90% is that being that confident makes me cocky, and cocky people lose. So the fact that future-me will be 90% is itself evidence that I'm going to lose, which means my future confidence and the thing I'm confident about are linked in a way that has nothing to do with evidence about who actually wins. My friend says both cases are just misapplications and the real principle has a caveat about the future confidence having to be rational, but that caveat feels like cheating to me — how do you state it without basically saying "unless the future credence is wrong," which is circular?

  What I actually want from you is a number plus the guts of how you got it. Specifically, what's your credence that the unrestricted reflection principle — no caveat, your later credence always has authority over your current one — is a genuine requirement of epistemic rationality, i.e. something a rational agent is really violating when they refuse to defer to their future self. Don't give me a range and don't give me "it depends"; I want your number, and then I want it broken into the sub-questions it rests on, each with a rough probability and one line of why. The sub-questions I can already see are (a) whether the betting / dutch-book style arguments for it show anything, or whether they're just traps that only work if you can't predict your own future irrationality, (b) whether my two cases are real counterexamples or misapplications, (c) whether the "future credence has to be rational" caveat can be stated non-circularly at all, (d) whether the whole thing is really just a definitional truth about what a credence is — my stats friend said something about your confidence not being able to predict its own drift and I did not follow it — and (e) anything else you think belongs in the list. Then tell me which single term you're least confident in and what you'd have to learn to move it.

