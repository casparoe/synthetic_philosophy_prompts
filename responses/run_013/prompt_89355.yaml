  ### Decision Tree: State Conditions on Means-Tested Benefits  
  **Anchored in concrete cases** to guide readers from commitments to a named position, using six binary branch nodes. Five key distinctions are embedded: entitlement vs. payment timing, reciprocity vs. perfectionism, labor market adequacy, epistemic feasibility, and justification (behavioral change vs. expressive/political).  

  ---

  #### **Tree Structure**  
  1. **Q1: Case: Claimant refuses a job paying less than their last role.**  
     *Should the state deny benefits?*  
     - **Yes**: Proceed to Q2.  
     - **No**: Proceed to Q6 (bypassing reciprocity/perfectionism).  

  2. **Q2: Case: Same claimant; conditionality is imposed.**  
     *Is the core justification that society owes support only if claimants "give back" (reciprocity), OR that work instills virtue/well-being (perfectionism)?*  
     - **Reciprocity**: Proceed to Q3.  
     - **Perfectionism**: Proceed to Q4.  

  3. **Q3: Case: District with 10% job vacancies but 30% unemployment.**  
     *In such a slack market, does the reciprocity obligation lapse due to inadequate opportunities?*  
     - **Yes**: → **Market-Sensitive Reciprocitarian**.  
     - **No**: Proceed to Q4.  

  4. **Q4: Case: Sanction applied for misfiled paperwork, not refusal to work.**  
     *Can the state reliably distinguish "shirking" from errors/misfortune?*  
     - **Yes**: Proceed to Q5.  
     - **No**: Proceed to Q6.  

  5. **Q5: Case: Evidence shows sanctions don’t increase employment.**  
     *Must conditionality change behavior to be justified?*  
     - **Yes**: Proceed to Q6.  
     - **No**: → **Expressivist**.  

  6. **Q6: Case: Benefits withheld for missing appointment (e.g., no childcare).**  
     *Does withholding extinguish the *right* to benefits, OR merely delay payment?*  
     - **Extinguishes entitlement**: → **Strong Conditionalist**.  
     - **Delays payment**: → **Weak Conditionalist**.  

  ---

  #### **Leaves (Positions)**  
  1. **Market-Sensitive Reciprocitarian** (Q1=Y, Q2=R, Q3=Y)  
     - *Most awkward commitment:* Conditionality vanishes in recessions, risking instability when need is highest.  
  2. **Expressivist** (Q1=Y, Q2=R/P, Q4=Y, Q5=N)  
     - *Most awkward commitment:* Upholds sanctions even if they *increase* poverty, to "express" societal values.  
  3. **Strong Conditionalist** (Q1=Y, Q2=R/P, Q4=Y, Q5=Y, Q6=E)  
     - *Most awkward commitment:* A paperwork error can permanently cancel your right to food aid.  
  4. **Weak Conditionalist** (Q1=Y, Q2=R/P, Q4=Y, Q5=Y, Q6=D)  
     - *Most awkward commitment:* Benefits delayed for non-compliance remain an unenforceable "debt," weakening incentives.  
  5. **Epistemic Skeptic** (Q1=Y, Q2=R/P, Q4=N)  
     - *Most awkward commitment:* Opposes *all* sanctions due to state ignorance—even against demonstrable freeloaders.  
  6. **Abolitionist** (Q1=N)  
     - *Most awkward commitment:* Defends unconditional aid for a millionaire who refuses work on principle.  
  7. **Perfectionist** (Q1=Y, Q2=P, Q4=N)  
     - *Unnamed; most awkward commitment:* Imposes work mandates for the "good" of recipients, even if they protest it is harmful.  
  8. **Political Pragmatist** (Q1=Y, Q2=R, Q3=N, Q4=N)  
     - *Unnamed; most awkward commitment:* Backs sanctions solely to appease taxpayers, regardless of fairness or efficacy.  

  ---

  #### **Notes**  
  - **Unseparated Pairs**:  
    - *Expressivist* and *Perfectionist* leaves (Q4=N) are indistinguishable on the reciprocity/perfectionism split (Q2). Both answer Q5=N or bypass it.  
    - *Strong* and *Weak Conditionalist* leaves do not differentiate between reciprocity and perfectionism justifications.  
  - **Unoccupied Combinations**:  
    - **Q1=Y, Q2=P, Q3=Y**: Perfectionism + market-lapse. *Incoherent*—perfectionism isn’t market-dependent.  
    - **Q1=N + any other "Y" to conditionality**: *Unattractive*—abolitionism rejects conditionality, making further "Y" answers contradictory.  
  - **Tree Coverage**:  
    - Distinction 1 (entitlement vs. payment) drives Q6 (Strong/Weak Conditionalist).  
    - Distinction 2 (reciprocity vs. perfectionism) splits Q2.  
    - Distinction 3 (labor market adequacy) defines Q3.  
    - Distinction 4 (epistemic feasibility) shapes Q4 (Skeptic leaf).  
    - Distinction 5 (justification) separates Q5 (Expressivist vs. Conditionalist).  

  The tree isolates eight positions from six questions, with epistemic and labor-market distinctions doing heavy lifting. Missing views (e.g., "state-always-helps") are omitted as *undefended* in mainstream scholarship.
