  Write me a joke about superrationality. It should be funny to someone who actually knows the idea, so the punchline has to turn on the real content and not just be "ha ha, game theorists." And please don't do the standard "both agents cooperate, isn't that nice" version — I want it to hang on one of the awkward parts instead. Two I have in mind, pick whichever you can actually land: (a) superrationality gets its grip from the assumption that the other player is running the same decision procedure as you, so its fragile — tilt that assumption even slightly and you get something strange; (b) identical deterministic reasoners can't break a tie, so any game with two symmetric good outcomes leaves them both doing the same thing, which in something like a doorway is exactly what you don't want. Feel free to invent the scenario. Then, in two or three sentences after the joke, tell me which part of it leans on a contested reading of superrationality (or on an assumption people would push back on), and what would change your mind about whether the joke is fair to the idea.
