  Existing literature hasn't resolved this. They referenced middle-range theory and debates on objectivity, but those don't tackle the selectivity issue directly. The proposal needs to acknowledge this gap without rehashing old arguments. The method involves case studies of concrete signatures, comparing rival hypotheses for each. The user plans to work qualitatively, avoiding complex Bayesian methods, which is practical for a pilot.

  The output should be a table summarizing findings, possibly showing which signatures are identifiable. Negative results are acceptable; if no signature is selective, that's still valuable. The user is concerned about failure—if everything is ambiguous, how to frame it as a contribution. Emphasizing the identification of non-identifiable signatures could turn negative results into insights.

  Constraints: no citations, two pages, first person, casual but professional. Need to keep it concise. The structure should include clear sections: question, gap, method, alternatives, outcomes, scope. Highlighting the pilot's exploratory nature is key—setting up for future work without overpromising.

  I should also consider the student's position. As a second-year PhD, they might feel pressure to demonstrate feasibility and academic rigor. Reassuring the committee that the approach is manageable in six months with no funding is crucial. Stressing the theoretical contribution over empirical findings can mitigate risks. Mentioning the potential for a follow-up study shows foresight.

  Lastly, ensuring the language is accessible but scholarly. Avoiding jargon where possible, but maintaining professionalism. Balancing their casual request with the need for committee approval. Making sure each section flows logically, addressing all their bullet points while staying within two pages.
answer: |-
  ## Pilot Project Proposal: Testing the Selectivity of Archaeological Signatures for Collective Norms

  **Principal Investigator:** [Your Name], PhD Student, Archaeology & Philosophy of Science  
  **Project Title:** Beyond "Consistent With": Assessing the Selective Power of Material Signatures for Normative Institutions  
  **Duration:** 6 months  
  **Requested Funding:** Stipend support for dedicated research time (no fieldwork/library costs required).

  ### 1. The Core Question
  Existing archaeological interpretations often rely on inferring shared beliefs or social institutions directly from patterns in the material record (e.g., uniform pottery styles = shared aesthetic standards; ranked burial goods = stratified social hierarchy). This inference faces a challenge analogous to the "reverse inference problem" in cognitive neuroscience: how do we know a specific material signature *selectively* indicates the presence of a collectively accepted norm *with enforcement* (the "institutional story"), rather than merely being the equally likely outcome of "boring" alternative processes like convergent individual choices driven by raw material constraints, functional efficiency, learned copying without normative pressure, or random drift? My project aims to make this challenge precise and testable by asking:

  **"For specific, commonly used material signatures (e.g., standardization, spatial segregation, evidence of repair/replacement patterns), does the observed signature significantly *increase the probability* of the 'enforced norm' hypothesis relative to plausible 'boring convergence' hypotheses, or is it equally predicted by both?"**

  The determinate outcome will be a verdict on the *selectivity* of 3-4 specific signature types for distinguishing "enforced norm" scenarios from "boring convergence" scenarios, based on analyzing the differential predictions of rival generating processes.

  ### 2. Why This Gap Exists
  While the epistemological challenges of archaeology are well-trodden ground (debates on objectivity, middle-range theory, the "Pompeii premise"), and philosophers have critiqued reverse inference in neuroscience, this specific *quantitative selectivity* question remains under-addressed in the archaeological context. Discussions often focus on:
  *   *Plausibility:* Whether an institutional explanation *could* account for the signature (which it often can).
  *   *Causality:* General models linking social structures to material outcomes.
  *   *Methodological caution:* Warnings against over-interpretation.
  What's missing is a systematic assessment of the *diagnostic power* of specific signatures: does Signature X *reliably distinguish* Scenario A (enforced norm) from Scenario B (boring convergence) in the specific context of the fragmented, biased, and non-replicable archaeological record? The existing literature provides frameworks for inference but doesn't rigorously evaluate whether the signatures themselves possess the necessary selectivity for robust identification of normative enforcement.

  ### 3. Proposed Method: Rival Process Modeling & Qualitative Selectivity Assessment
  Over six months, I will conduct focused case studies on 3-4 distinct material signature types (e.g., ceramic standardization, mortuary differentiation, structured discard patterns, evidence of deliberate damage/repair). For each signature type:

  1.  **Define the Signature:** Precisely characterize the observable material pattern claimed to indicate an enforced norm (e.g., "low coefficient of variation in pot dimensions," "clustered high-status goods in specific burial locations").
  2.  **Articulate Rival Hypotheses:** Define the "Institutional Story" (e.g., shared norm enforced through social sanctioning) and 2-3 plausible "Boring Convergence" hypotheses (e.g., functional optimization given local clay, learned copying without normative pressure, limited raw material variability, drift).
  3.  **Model Predictions:** For each hypothesis, deduce the material patterns it would generate over time, considering:
      *   The *expected signature* under that process.
      *   The *variability* expected (e.g., would drift produce *less* standardization than enforcement?).
      *   Potential *confounding signatures* (e.g., does functional optimization also predict repair patterns similar to sanctioning damage?).
      *   *Temporal dynamics* (e.g., how quickly would patterns emerge/change under each process?).
      *   *Biases in the archaeological record* (e.g., is the signature more likely to be preserved under one scenario?).
  4.  **Assess Selectivity:** Compare the predictions. Does the signature **A)** Occur *more frequently* or *more strongly* under the Institutional Story than under the Boring Convergence stories? **B)** Are there *distinctive sub-patterns* predicted only by the Institutional Story (e.g., specific types of damage associated with sanctioning)? **C)** Is the signature *robustly predicted* by the Institutional Story but *only weakly or variably predicted* by the alternatives? If the signature is predicted equally well by multiple hypotheses, it lacks selectivity for identifying norms with enforcement.

  **Timeline:**
  *   **Month 1:** Literature review focused on defining common signature types in archaeological interpretation and existing critiques. Selection of 3-4 signature types for analysis.
  *   **Month 2:** Deep dive into Signature Type 1. Develop detailed rival hypotheses and their predicted material outcomes.
  *   **Month 3:** Analyze selectivity of Signature Type 1 by comparing rival predictions. Draft case summary.
  *   **Month 4:** Repeat process for Signature Type 2.
  *   **Month 5:** Repeat process for Signature Type 3 (and 4 if feasible).
  *   **Month 6:** Synthesize findings across signature types. Compile results table. Write final report outlining implications and identifying areas where selectivity is strong, weak, or absent.

  ### 4. Why This Approach Over Another Case Study?
  My hunch – that selectivity is best assessed concretely, case-by-case – drives this method. Another single-site case study would likely reproduce the existing pattern: demonstrating that an institutional explanation *fits* the data, but leaving the selectivity question untouched. By focusing on the *generating processes* behind *specific signature types* abstracted from particular contexts, I can directly compare the predictions of rival hypotheses. This process-oriented, comparative approach is essential for isolating *what makes a signature diagnostic* beyond mere consistency. It moves beyond "does this fit?" to "does this *distinguish_?".

  ### 5. Expected Outcomes & Deliverables
  The primary deliverable will be a **clear verdict on the selectivity** of each analyzed signature type, presented as:

  *   **A Results Table:**
      | Signature Type | Rival Hypotheses (Institutional vs. Boring 1, Boring 2...) | Selectivity Assessment (e.g., "Strongly selective for Institution," "Equally predicted by Institution and Boring1," "Non-selective; predicted by all rivals," "Institution predicts signature weakly; Boring2 predicts strongly") | Key Reasons for Assessment |
      |---|---|---|---|
  *   **A Short Report:** Summarizing the analysis, the key findings regarding selectivity (or lack thereof) for each signature type, and a clear statement identifying:
      *   Which signature types (if any) show strong potential for selectively indicating enforced norms.
      *   Which signature types are demonstrably *non-selective* – meaning their presence cannot reliably distinguish enforced norms from boring convergence based on material evidence alone.
      *   Specific aspects of signatures (e.g., specific sub-patterns, contextual requirements) that *do* increase selectivity, even if the main signature type does not.

  This provides concrete, actionable insights for refining interpretive practices.

  ### 6. What Constitutes Success and Failure
  *   **Success:** A defensible, clearly argued assessment of selectivity for each chosen signature type, resulting in the table and report described above. This is valuable whether it identifies robust signatures or reveals widespread non-selectivity.
  *   **"Negative" Result is Still Success:** If the analysis reveals that most or all candidate signatures are *non-selective* – equally predicted by boring convergence hypotheses – **this is a significant finding.** It demonstrates a fundamental, underappreciated limitation in our ability to identify norms from material proxies alone using current common signatures. This forces a necessary reevaluation of interpretive confidence.
  *   **Avoiding "Just Failing to Find a Good Case":** To ensure a negative result is meaningful, I will:
      1.  Focus on signatures *commonly used* in archaeological literature to infer norms/institutions, demonstrating their real-world relevance.
      2.  Articulate plausible, non-strawman "boring convergence" hypotheses derived from actual material constraints, economic factors, or learning models.
      3.  Clearly document the reasoning behind the selectivity assessment, showing *why* the signature fails to distinguish the hypotheses.
      4.  Explicitly identify *what kind of evidence* (if any, perhaps currently unavailable) *would* be needed to increase selectivity. This transforms a negative finding into a guide for future research.

  ### 7. Scope and Feasibility
  *   **Scope:** Tightly focused on 3-4 signature types, analyzed through rival process modeling and qualitative selectivity assessment. No new data collection or complex statistics.
  *   **Qualitative Approach:** While formal Bayesian analysis would be ideal, a rigorous *qualitative assessment of selectivity* ("differential prediction") is entirely feasible and appropriate for a 6-month pilot. It involves careful logical deduction of what each process *should* produce and a systematic comparison of those predictions. This provides a crucial first step, establishing the *conceptual landscape* of selectivity. It identifies where formal modeling might be most fruitful later.
  *   **Constraints Managed:** Six months is sufficient for this focused analytical work. The library-only requirement is met. The qualitative approach avoids the need for advanced statistical training I currently lack. The pilot sets the stage for potential future work involving computational simulation or formal modeling if promising avenues are identified.
  *   **Deliverable:** A concise 10-15 page report (plus results table) suitable for submission as a working paper, chapter foundation, or basis for a larger grant application.

  This pilot project directly tackles a critical methodological gap at the intersection of archaeology and philosophy of science. By rigorously assessing the *selectivity* of material signatures, it promises to refine interpretive practices, clarify epistemological limits, and ultimately strengthen inferences about past social norms.
