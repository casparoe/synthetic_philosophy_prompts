  The main issue seems to be self-undermining. If introspection always misrepresents, then the illusionist's own claim relies on that same flawed access. For example, when an illusionist introspects to support their theory, they're using a mechanism that distorts reality. This creates a problem of self-reference and undermines epistemic justification.

  Why is this conceptual? Because it's about the coherence of the theory itself, not empirical evidence. It questions whether illusionism can consistently explain its own basis without contradiction.

