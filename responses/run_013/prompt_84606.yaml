prompt: |-
  For a few years now I have worked on treaty and customary-law questions in a foreign ministry, and the doctrine of customary international law has come to bother me in a way I cannot resolve from inside the legal materials. The standard test has two elements: a general and consistent practice among states, and opinio juris, the requirement that states follow the practice because they take it to be legally required. Both are said to be necessary, and neither is applied quite as stated. Where a rule is politically salient, a short run of instances — sometimes a single widely supported General Assembly resolution — is treated as enough, with no settled practice behind it at all. Where conduct runs against an alleged rule, lawyers often discount it on the ground that the state in question denies it is breaching anything, so that the violation ends up confirming the rule rather than eroding it. And opinio juris is supposed to be what turns a convergent habit into law, which leaves the awkward question of what a state is meant to believe about a rule's legal status before the rule exists. I may be putting this more crudely than a treatise would, but the shape of the thing should be recognizable.

  What I want to know is what this practice presupposes. My own starting point is Lewis's analysis of convention: a regularity that everyone in a population conforms to, expects everyone else to conform to, and prefers to conform to on condition that others do, where an alternative regularity would have solved the same problem equally well, and where all of this is common knowledge. Where does the doctrine of custom fit that analysis, and where does it strain it? Lewisian conventions are solutions to coordination problems and need carry no obligation: my reason to conform is conditional on others conforming, and it evaporates if the regularity collapses. But one state's breach of a customary rule is not normally taken to release the others, and the rule is said to survive wholesale violation; the doctrine presents compliance as required, not merely as what one does while others are doing it. Can the practice absorb that difference — say, because states happen to have a standing interest in the rule holding — or does it show that the practice presupposes something with an irreducibly normative element, of the sort Hart was after when he described a social rule as involving a critical reflective attitude toward a pattern of conduct? If the latter, I would like to know whether a purely strategic story, built on reputation, reciprocity and the fear of being the odd one out, can do the same work more cheaply.

  I would also like the parts checked against one another. Can a single account of convention cover both the insistence on settled practice and the readiness to find law in a resolution with no practice behind it? Is the treatment of violations as confirmatory an implication of the doctrine, a convenient fiction, or a real feature of how norms work? Tell me which elements the practice strictly presupposes, which it merely fits comfortably with, and which it leaves underdetermined, so that several theories of convention would license the same behaviour. And say something about whether the doctrine treats customary rules as there to be found or as continuously made: is the lawyer identifying a convention that already exists, or ratifying one that convergent behaviour is still producing?

  Finally, follow each candidate picture through to its consequences. If the Lewisian account is the right one, what in the doctrine would have to give — the persistent-objector rule, the bindingness of custom on states that never participated, the independent work done by opinio juris? And if the practice needs a normative attitude all the way down, which of the anomalies I described stop looking like anomalies and start looking like symptoms?
reasoning: |-
  Hmm, this is a sophisticated inquiry from someone deeply immersed in international law practice. The user is grappling with theoretical tensions in customary international law (CIL) doctrine, particularly how it aligns or conflicts with David Lewis's philosophy of convention. They've clearly identified several pain points: the elastic application of the practice requirement, the bootstrapping problem of opinio juris, and the treatment of violations as confirmatory.  

  The user's framing suggests they're not just seeking doctrinal clarification but want to map the implicit presuppositions of CIL onto social theory models. Their reference to Lewis and Hart signals comfort with analytical philosophy. I should avoid rehashing basic legal definitions they already know.  

  Key threads to unravel:  
  First, the Lewisian convention model fits CIL awkwardly because Lewis's conventions are coordination equilibria without intrinsic normativity, whereas CIL claims binding force even when violated. The user is spot-on about this tension—they note that in Lewis's model, defection dissolves obligations, but CIL persists through breaches.  

  Second, the opinio juris puzzle: if states must believe a practice is legally required before the custom exists, that's circular. The user suspects CIL doctrine smuggles in Hart's "critical reflective attitude" despite claiming to rest on state behavior.  

  Third, the anomalies they observe—like instant custom via UN resolutions—might reveal CIL's true nature. If CIL is really about collective normative commitments, then resolutions expressing shared values could indeed crystallize custom faster than behavioral patterns.  

  I'll need to show where Lewis's model stretches but doesn't snap:  
  - Reputation/reciprocity can explain some stability, but not why new states are bound or why objectors must persistently dissent.  
  - The "violation-as-confirmation" trick only makes sense if we presuppose a pre-existing normative frame—Hart's internal point of view.  

  The user also wants consequences teased out:  
  If we take Lewis strictly, CIL doctrine would collapse. Persistent objectors wouldn't need exemptions because conventions bind only participants. Opinio juris would be redundant if practice alone solves coordination.  

  But if Hart is right, the anomalies aren't bugs but features: resolutions express normative attitudes; violations that trigger denials reinforce the standard.  

  Finally, the user's last question about custom being "found" vs "made" is profound. A Lewisian would say lawyers identify existing solutions; a Hartian sees them participating in rule-creation through interpretive practices. The truth is likely dialectical—state practice feeds into a normative ecosystem that lawyers then crystallize.  

  This demands careful phrasing: the user has operational experience, so hypotheticals should ring true (e.g., how climate change norms emerged faster than traditional state practice would allow). I'll avoid academic jargon; they've shown they can handle complexity but prefer concrete analysis.
answer: |-
  Your critique cuts to the ontological core of customary international law (CIL). The doctrine's inconsistencies aren't mere sloppiness; they reveal unresolved tensions about what kind of social fact CIL *is*. Let's dissect this using Lewis and Hart as analytical tools, addressing your specific anomalies and their presuppositions.

  ### 1. **Lewisian Conventions vs. CIL: The Fundamental Strain**
     - **Coordination vs. Obligation**: Lewisian conventions solve coordination problems (e.g., driving on the right). Compliance is conditional and interest-based: I drive right *because others do*, and if they switch, so do I. CIL, however, claims *non-defeasible obligation*. A state breaching the prohibition of aggression doesn’t release others from compliance. Violations are "wrong," not coordination failures. This strains Lewis because:
       - *Persistent Objector Rule*: In Lewis, non-participants aren’t bound. CIL binds new states automatically unless they persistently object *during* the rule’s formation. This presupposes a pre-existing community standard.
       - *Survival Despite Violation*: The *jus cogens* concept or rules like torture prohibition endure systemic breach. Lewisian regularity dissolves if defection becomes widespread; CIL’s normativity persists, implying a Hartian "critical reflective attitude."
     - **Strategic Accounts (Reputation/Reciprocity)**: These explain *compliance* but not *obligation*. Reputation matters because states accept a normative framework where breach *deserves* sanction. Reciprocity fails for non-synallagmatic rules (e.g., human rights). Fear of being "odd one out" assumes a pre-existing normative community. These mechanisms *operationalize* norms but don’t create their binding quality.

  ### 2. **Anomalies as Symptoms: What the Practice Presupposes**
     - **Instant Custom (e.g., GA Resolutions)**:
       - *Lewis*: A single resolution fits poorly—no stable practice exists. But if states treat it as *declaratory* of emerging norms, it reflects a shared normative expectation.
       - *Presupposition*: This anomaly reveals CIL’s latent Hartian character. Resolutions express *opinio juris* as a collective "acceptance of a standard" (Hart’s internal point of view). The "practice" requirement relaxes because the resolution *itself* is an act of norm-creation within a community already committed to law as a normative system.
     - **Violations as Confirmatory**:
       - *Doctrinal Logic*: When a state denies violating a rule, it appeals to the rule’s validity, reinforcing its existence. Denial is performative *opinio juris*.
       - *Presupposition*: This only makes sense if norms have independent validity. Violations + denials presuppose a shared standard against which conduct is judged (Hart’s "critical reflective attitude"). In a purely strategic world, denial would be cheap talk; in CIL, it’s ritual reaffirmation of the normative order.
     - *Opinio Juris* **Bootstrapping Problem**:
       - States don’t "believe" a rule exists *before* it does. Rather, *opinio juris* emerges from practice understood as *normative* conduct—states act *as if* bound, and this collective attitude crystallizes the rule. Hart clarifies: the "internal attitude" is constitutive of the rule, not a belief about pre-existing law.

  ### 3. **What the Practice Strictly Presupposes vs. What it Accommodates**
     | **Element**               | **Strict Presupposition**                                  | **Accommodates**                                          | **Underdetermined**                                     |
     |---------------------------|------------------------------------------------------------|-----------------------------------------------------------|---------------------------------------------------------|
     | **State Practice**         | Some convergent behavior (but threshold varies)            | "Instant" custom via symbolic acts (resolutions)          | How much practice? How consistent must it be?           |
     | ***Opinio Juris***        | States must frame conduct as legally significant           | Belief in *emerging* obligation, not settled law          | Whether it requires genuine belief or performative claim |
     | **Binding Force**         | Obligation survives breach & binds non-participants        | Strategic interests (reciprocity) as compliance motivators | Source of non-consensual obligation (natural law?)      |
     | **Violations**            | Breach + denial = affirmation of rule                      | Excuses (necessity) as rule-modifying                     | When breaches erode vs. reinforce the rule              |

  ### 4. **Candidate Pictures & Their Consequences**
     - **If Lewisian**:
       - *Doctrine must abandon*: Non-participant bindingness, persistent objector rule (redundant if conventions are opt-in), *opinio juris* (practice alone suffices for coordination), and the idea that rules survive collapse of the regularity.
       - *Consequence*: CIL collapses into clusters of bilateral reciprocities, not universal law. UN resolutions become political statements, not normative sources.
     - **If Hartian (Normative Attitude)**:
       - *Anomalies become features*: 
         - GA resolutions express collective normative attitudes.
         - Violations with denials affirm the community’s standard.
         - *Opinio juris* is the internal attitude constitutive of rules.
         - New states are bound because they join a community defined by shared standards.
       - *Consequence*: CIL is dynamic and interpretive. Lawyers don’t just "find" custom; they participate in articulating the community’s normative commitments through state practice and *opinio juris*.

  ### 5. **Found vs. Made: The Dialectic of CIL**
     CIL is both found *and* made. Lawyers "find" it by identifying patterns of behavior *treated as normative* by states (Hart’s "internal point of view"). But the act of identification—weighing practice, interpreting *opinio juris*—is a constructive, discursive practice that shapes the rule’s content. A UN resolution isn’t "instant custom"; it’s a moment where the community *makes explicit* a norm whose normative foundations (attitudes) were latent. Violations test the resilience of the normative commitment; if denials cease and breaches normalize, the rule erodes.

  **Conclusion**: The doctrine strains Lewis because it presupposes a Hartian social rule. The "anomalies" you note are symptoms of CIL’s foundation in a community of states that see themselves as bound by shared standards, not mere convergent interests. Strategic factors (reputation, reciprocity) are real but operate *within* this normative framework. To resolve your unease: CIL isn’t a Lewisian coordination game; it’s a practice of mutual accountability grounded in a collective belief that certain conduct is *owed*, not just expedient. The doctrine’s ambiguities reflect the struggle to formalize this social reality.
