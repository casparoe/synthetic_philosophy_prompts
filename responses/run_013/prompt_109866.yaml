answer: |-
  **Final Paper Question**  
  Test the Teller Thesis — that a proposition is nothing but the unified content of a single act of telling — against the following cases:  
  1. The sentence "Wren [an invented character] stole my pen [a real object in my study]" expressing a relation between a non-existent fictional entity and a concrete object.  
  2. A proposition no one has ever entertained (e.g., "The 17,304th prime number is divisible by the distance in millimeters between Sirius and Arcturus").  
  Explain exactly what Bradley’s regress establishes about propositional unity and what it leaves untouched. Defend or reject the thesis by addressing: whether it halts the regress or relocates it into the act of telling; how it handles the "missing relatum" in Case 1; and what it must surrender about unentertained propositions in Case 2.  

  **Grading Criteria**  
  1. **Analyze Bradley’s regress**: State precisely what the regress proves (e.g., the incoherence of relational "bonds" in complex-based theories) and what it fails to address (e.g., non-compositional unity). (4 marks)  
     *Loses marks for conflating the regress’s target with its implications.*  
  2. **Resolve Case 1 (fictional-real relation)**: Explain how the Teller Thesis accounts for the "missing relatum" (Wren) by treating the *telling* as ontologically generative, or admit it cannot without paradox. (5 marks)  
     *Loses marks for appealing to abstracta or possibilia without tying them to the act of telling.*  
  3. **Resolve Case 2 (unentertained proposition)**: Argue whether such propositions are (a) impossible under the thesis, (b) reducible to potential tellings, or (c) a fatal counterexample requiring surrender of mind-independence. (5 marks)  
     *Loses marks for neglecting the tension between act-dependence and truth-conditions.*  
  4. **Diagnose regress relocation**: Determine if the thesis halts the regress by eliminating constituent-complexes, or relocates it into the structure of the telling-act itself (e.g., "what unifies the *intent* to tell a whole proposition?"). (4 marks)  
     *Loses marks for asserting resolution without examining the act’s internal unity.*  
  5. **Concede limitations**: Specify what the thesis must abandon (e.g., timeless truth-values, modality, or Fregean "thoughts") to maintain coherence with Cases 1 and 2. (2 marks)  
     *Loses marks for vague or overly optimistic claims about salvageable ground.*
