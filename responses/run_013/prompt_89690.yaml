answer: |-
  Here is the examination question, model answer, and marking scheme designed to meet your specifications.

  **Examination Question (Worth 40 Marks):**

  "The term 'liberal' exhibits a stark transatlantic divergence: in contemporary American political discourse, it typically denotes left-of-centre, social-democratic positions favouring state intervention, while in continental Europe, it generally signifies market-oriented, limited-government views. Confronted with this divergence, an American politician declaring 'Liberalism is under threat from authoritarian populism!' and a German politician making an identical declaration appear to be using the same word but potentially referring to distinct ideological projects.

  1.  **Characterise this divergence:** Is this best understood as (a) one word with two context-dependent senses, (b) two distinct words sharing a historical root but now functionally homonyms, or (c) a single, contested label where different political coalitions have 'captured' its dominant meaning within their respective contexts? Justify your choice.
  2.  **Analyse the 'under threat' assertion:** If both politicians sincerely believe their statement, are they (i) asserting the *same* substantive claim about the world, (ii) asserting *contradictory* claims (e.g., that more state intervention vs. less is threatened), or (iii) making distinct claims that are not directly comparable? Does the shared use of the word 'liberalism' do meaningful work in their declarations, or is it merely a historical accident complicating communication?
  3.  **Accommodate complicating cases:** How does your analysis account for (a) the Australian Liberal Party (centre-right), (b) the German Free Democratic Party (market-liberal), and (c) the asymmetry where 'neoliberal' is primarily a pejorative in Europe/Latin America, while 'liberal' itself functions more often as an epithet than a self-description in mainstream American politics?
  4.  **Address 'neoliberal':** Does the distinct trajectory and valence of 'neoliberal' support, undermine, or complicate your characterisation of the core 'liberal' divergence?
  5.  **Consider International Relations (IR) Theory:** Is 'liberalism' in IR theory (emphasising cooperation, institutions, interdependence) a *fourth sense* of the term, a *homonym* unrelated to the political-ideological usages, or *evidence* that framing the question as a simple transatlantic binary is inadequate? Justify your position.

  Your answer must move beyond merely describing the differences and focus on the analytical choices involved in interpreting this conceptual divergence and its consequences."

  ---

  **Model Answer (Five Numbered Points):**

  1.  The divergence is best characterized as (c): a single, contested label captured by different coalitions; it reflects strategic political struggles over a shared, prestigious inheritance (19th-century classical liberalism) where competing factions claimed the mantle to legitimize their distinct modern programs (social democracy vs. libertarianism) within specific national contexts, rather than accidental homonymy or simple polysemy.
  2.  The politicians are making distinct claims (iii) that are not directly comparable (one fears threats to social programs/rights, the other to markets/individual autonomy), but the shared word *does* meaningful work: it rhetorically links their distinct fears to a common, valued tradition ("liberalism") perceived as antithetical to "authoritarian populism," amplifying the perceived gravity of the threat despite the substantive difference.
  3.  (a) The Australian Liberal Party exemplifies coalitional capture in a distinct context (post-WWII anti-Labor coalition adopting "liberal" for its free-market strand), (b) the FDP confirms the continental European market-liberal standard meaning, and (c) the asymmetry shows "liberal" in the US became successfully captured by the centre-left *as a label*, making it vulnerable as an epithet, while "neoliberal" emerged elsewhere as the primary pejorative for the captured market-oriented meaning, revealing the ongoing contest over the term's valence.
  4.  The trajectory of "neoliberal" complicates the core divergence by showing an attempt to *reclaim* a pro-market position (initially by thinkers like Rüstow) within the "liberal" lineage, but its overwhelming adoption *as a pejorative*, especially outside the US, underscores the difficulty of rehabilitating the core "liberal" label for market positions where the social-democratic capture is strong and highlights the *asymmetry* in successful pejorative usage.
  5.  Liberalism in IR theory is a distinct, technical *extension* (not a fourth sense or homonym) primarily derived from one strand (Kantian/ideational) of the broader liberal tradition, focusing on systemic dynamics; its existence illustrates the richness and internal diversity of the tradition but doesn't negate the specific, politically contested divergences in *domestic ideological labelling* captured by the transatlantic comparison.

  ---

  **Marking Scheme (Total: 40 Marks):**

  *   **Allocation:** Marks are distributed based on the analytical depth, justification, and handling of complexity required for each point.
      *   **Point 1:** 10 marks
      *   **Point 2:** 10 marks
      *   **Point 3:** 8 marks
      *   **Point 4:** 6 marks
      *   **Point 5:** 6 marks

  *   **Assessment per Point:**

  1.  **Characterisation (10 marks):**
      *   **Error costing marks:** Simply describing the two meanings without choosing/justifying a type of divergence; claiming it's *only* homonymy without addressing shared history/capture; claiming it's *only* polysemy without addressing the political contestation.
      *   **First-class move:** Clearly choosing (c) and providing a strong justification focused on *political coalitional capture* of a shared inheritance, explicitly contrasting this with (a) and (b) and explaining why capture is more accurate than the alternatives. Recognizing the *strategic* nature of claiming the "liberal" label.
      *   **Mid-range:** Correctly identifies (c) but with weaker justification, or leans towards (a) or (b) but acknowledges elements of capture; may lack explicit contrast with alternatives.

  2.  **'Under Threat' Analysis (10 marks):**
      *   **Error costing marks:** Claiming they are saying the *same* thing (ignoring substantive difference) or are *contradictory* (misunderstanding the distinct domains); stating the shared word is *only* an accident with no function; failing to address both parts (sameness/contradiction/comparability AND word's function).
      *   **First-class move:** Clearly argues for distinct claims (iii) *and* persuasively explains the meaningful rhetorical work the shared term does (invoking common tradition/history against a shared "other"). Balances the semantic divergence with the functional unity provided by the label in this specific rhetorical context.
      *   **Mid-range:** Correctly identifies distinct claims but provides a weaker or incomplete explanation of the word's function, or identifies the rhetorical link but wavers on the distinctness of the claims.

  3.  **Accommodating Cases (8 marks):**
      *   **Error costing marks:** Ignoring one or more of the three sub-points (Aus, FDP, asymmetry); treating them as simple exceptions rather than evidence for/against their divergence model; mischaracterizing the cases (e.g., calling the Aus Liberals left-wing); failing to integrate them into the core argument about capture/meaning.
      *   **First-class move:** Seamlessly integrates all three cases as *evidence* supporting the coalitional capture thesis: Aus as capture in another Anglosphere context, FDP as confirming the continental norm, and the asymmetry as *demonstrating the consequences* of successful capture (vulnerability as epithet) and the resulting need for a new pejorative ("neoliberal") against the captured market meaning elsewhere.
      *   **Mid-range:** Correctly identifies the position of each case but with less sophisticated integration into the core capture argument; might treat them as separate examples rather than interconnected evidence.

  4.  **Addressing 'Neoliberal' (6 marks):**
      *   **Error costing marks:** Ignoring the term; treating it as synonymous with European "liberal" without noting its distinct valence; failing to connect it to the asymmetry mentioned in Point 3.
      *   **First-class move:** Explicitly links it to Point 3's asymmetry, arguing it *complicates* by showing an attempted *reclamation* for market-liberalism that largely failed (becoming a pejorative), thereby reinforcing the difficulty of the capture struggle and highlighting the specific US vs. non-US asymmetry in pejorative usage for the core term.
      *   **Mid-range:** Notes the different valence of "neoliberal" and connects it loosely to the divergence but misses the nuance of attempted reclamation or the reinforcement of asymmetry.

  5.  **IR Theory (6 marks):**
      *   **Error costing marks:** Claiming it's a homonym (ignoring Kantian roots); claiming it's simply a fourth sense (ignoring its distinct academic/systemic focus); stating it makes the question invalid without justification.
      *   **First-class move:** Argues persuasively it's a *distinct technical extension* derived from a specific strand of the tradition, serving a different (academic/explanatory) purpose than the contested *ideological labels* in domestic politics. Uses it to illustrate the tradition's breadth *without* negating the reality of the specific transatlantic political divergence in labelling.
      *   **Mid-range:** Correctly identifies it as distinct but provides a weaker justification for *how* it relates (e.g., just saying "it's different"); or leans towards homonymy/sense but acknowledges a loose connection.
