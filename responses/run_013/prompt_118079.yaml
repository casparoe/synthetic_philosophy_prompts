    "criterion": "An omission is a cause if (1) the outcome wouldn't have happened but for the omission (but-for test), and (2) the agent had a specific, contextually defined duty or reasonable expectation to perform the action.",
    "strongest_case_against": "The doctor case (didn't order rare test, patient dies).",
    "reply_to_it": "Her omission factually caused the death (but-for), but she likely lacked a duty/expectation based on the standard of care, meaning she isn't blameworthy. Causation (factual difference-making) and blame (violated duty) are distinct.",
    "ledger_verdict": "keep with a fix",
