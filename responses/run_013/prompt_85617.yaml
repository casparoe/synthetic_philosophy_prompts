prompt: |-
  Ok so I'm in this TOK class (theory of knowledge) and we just did the history unit and my teacher is kind of obsessed with chaos theory, he spent like a whole double period on it. His big thing is that history is a chaotic system, so a tiny little thing flips everything — a nail missing from a horseshoe, Cleopatra's nose being a bit shorter, whatever — and the whole kingdom or the whole world goes off somewhere completely different. He says thats the butterfly effect, and thats why historians can never really explain anything, its all contingency and luck and nobody saw it coming. Then my friend Maya pointed out that if a butterfly in Brazil can cause a tornado in Texas then every event is kind of the cause of every other event, so you can never blame anyone for anything they do, because ultimately it all traces back to some butterfly somewhere. And I said well yeah and also chaos means the world is random anyway, which is funny because we learned in the free will unit that everything is determined, so its like the world is both 100% determined and 100% random at the same time, which I think is honestly the deepest point of the whole unit.

  Anyway we have to write a 2 page response for Monday and we want to argue that all those boring structural explanations we keep getting (economics, geography, long term trends, blah) are basically worthless because of the butterfly thing, and that moral responsibility is a myth for the same reason. Can you help me lay the argument out so it actually lands and doesn't just sound like me repeating the teacher? I want it as a numbered list of exactly five points, one or two sentences each, no intro and no conclusion, straight into the points, because my teacher hates padding and I always do way too much throat clearing.
