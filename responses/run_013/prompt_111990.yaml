  Ah! Their final point about rule legibility being more crucial than quantity resonates with legal anthropology. Scott's "Seeing Like a State" comes to mind—they're touching on the tyranny of vague rules versus the freedom of precise ones. This might be the most original part of their query. 

  Measurement-wise, I recall Gelfand's work uses behavioral scenarios and perceived sanction likelihood scales. But as the user suspects, these likely conflate enforcement certainty with norm strength. The cultural domain index in Chua's studies might handle breadth better though. 

