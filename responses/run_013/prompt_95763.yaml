prompt: |-
  I write copy for a small legal-tech outfit and I want to try a parody piece for the portfolio. Draft me a help-center FAQ page for a fake product — a settlement app for divorces, business breakups, fighting roommates, whatever — that resolves every dispute by the Kalai–Smorodinsky solution, written by someone who has absorbed it so thoroughly that it reads as plain common sense. The page should never say bargaining theory, never say game theory, never name an economist. 600–700 words, numbered Q&As, deadpan corporate-help-desk voice, no winking, no hedging about how fairness is complicated.

  The funny has to come from the actual content, so every answer should be a real consequence of the solution rather than a made-up quirk of the company. So: the equal-proportional-gains rule (each side ends up with the same fraction of what it could have gotten); the disagreement point as "what happens if you both walk away"; the ideal point as the best each side could get if the other side just lay down; and the consequence that nothing else about the available deals matters, so the engine only needs two numbers per person and the whole messy interior of what's actually on the table is irrelevant to your answer — that one should be a straight-faced Q&A. Get some mileage out of scale invariance (enter your payoffs in dollars or in units of personal satisfaction, any consistent linear rescaling gives the same split) and out of symmetry (something smug about a perfectly mirror-image couple getting a perfectly mirror-image outcome). Then use individual monotonicity as a marketing differentiator: an unnamed competitor whose method maximizes the product of the two sides' gains can actually pay you less when your own outside option improves, whereas this product never punishes you for improving your position — sell that hard, since it's true. Work in a testimonial or two, and one deadpan answer about what happens when the set of possible deals isn't a nice convex blob.

  A game theorist should read it and think I know what KS is and that the joke is fair; everyone else should find it funny and a little ominous. No citations, no real companies or living people, and don't put the company's lines in scare quotes like you're above them.
reasoning: |-
  We are creating a parody FAQ for a settlement app that uses the Kalai-Smorodinsky solution. The key is to explain the features and consequences of the solution without using technical terms, making it sound like plain common sense. We have to cover:
   - Equal proportional gains: each party gets the same fraction of their maximum possible gain (relative to the disagreement point).
   - The disagreement point: what happens if both walk away (the fallback).
   - The ideal point: the best each could get if the other got nothing (or their minimum).
   - Scale invariance: the split is the same regardless of the unit (dollars, satisfaction units) as long as the scaling is linear and consistent.
   - Symmetry: if the situation is perfectly symmetric, the outcome is symmetric.
   - Individual monotonicity: improving your own outside option (disagreement point) never hurts you (and may help), which is a contrast with the Nash product (without naming it) that can sometimes reduce your share when your outside option improves.
   - Also note that the solution only requires the two disagreement payoffs and the two ideal payoffs; the rest of the set of possible deals doesn't matter (as long as it's convex and comprehensive, but we'll handle that in a deadpan way).

   We'll structure it as a FAQ with numbered Q&As. We'll use a deadpan corporate-help-desk voice. We'll include:
    - A testimonial or two.
    - An answer about what happens when the set isn't a "nice convex blob".

   Let's outline the questions:

   1. What is the FairSplit™ method?
   2. Why do you only ask for two numbers per person?
   3. What if we have very different ways of valuing things?
   4. My ex and I are in exactly the same situation. Will the split be equal?
   5. How does improving my "walk away" option affect my settlement?
   6. I heard that in some systems, getting a better outside option can actually hurt you. Is that true here?
   7. What if the possible deals are complicated and not just about money?
   8. What if the set of possible settlements isn't a "nice blob"?
   9. Can you give an example of how FairSplit™ works in practice?
  10. Testimonials?

   We'll aim for 600-700 words.

   Note: We are to avoid the terms "game theory", "bargaining theory", "Kalai-Smorodinsky", and economist names.

   Let's write.
answer: |-
  ### FairSplit™ Settlement Assistant: Help Center  
  **Resolving disputes with one-tap fairness.**  

  **1. What is the FairSplit™ method?**  
  FairSplit™ calculates the settlement where each party achieves the same proportional gain relative to what they stand to lose if no deal is reached. We call this your "walk-away" outcome. The method then identifies the best outcome each party could *ideally* receive if the other party conceded everything. The FairSplit™ solution gives both of you an identical fraction of the gap between your walk-away point and your ideal point. It’s common sense: neither side should shoulder more "lost potential" than the other.  

  **2. Why do you only require two numbers per person?**  
  Efficiency is key. You provide:  
  - Your **walk-away value** (what you get if negotiations collapse).  
  - Your **ideal value** (what you’d get if the other party accepted your maximum demand).  
  FairSplit™ ignores complex deal structures (e.g., asset combinations, custody schedules, or revenue-sharing nuances). Only these two benchmarks matter. The solution lies where both parties sacrifice proportionally equal ground from their ideal outcomes.  

  **3. What if we use different currencies or satisfaction units?**  
  FairSplit™ adapts seamlessly. Whether you measure gains in dollars, "happiness points," or antique teapots, the *proportional sacrifice* remains identical. Scale your inputs linearly (e.g., converting dollars to euros or stress to a 1–10 scale), and the outcome fraction stays the same. Consistency, not units, is what counts.  

  **4. My ex-partner and I have perfectly mirrored claims. What happens?**  
  Symmetry ensures symmetry. If your walk-away values and ideal points are identical, FairSplit™ splits gains exactly 50/50. No hidden variables, no biases. This is mathematically inevitable—like two equally weighted scales finding balance.  

  **5. How does improving my walk-away option affect my settlement?**  
  It helps you. FairSplit™ obeys **Individual Monotonicity**: if your best alternative improves (e.g., a new job offer during a partnership breakup), your settlement *never decreases*. Unlike methods that penalize self-improvement, we ensure your gains rise proportionally when your walk-away position strengthens.  

  **6. I heard other systems punish strong walk-away options. Is that true?**  
  Yes. Competitors using "product-maximization" logic (e.g., multiplying gains) can reduce your share if your walk-away value improves—even if nothing else changes. FairSplit™ never penalizes you for bettering your position. If your alternatives improve, your settlement improves or stays neutral. Always.  

  **7. What if negotiations involve non-monetary terms (e.g., custody or IP rights)?**  
  Quantify them. Assign walk-away and ideal values to each term (e.g., "Full custody: 100 satisfaction units; none: 0"). FairSplit™ then solves for the package where both parties sacrifice equal proportions of their total potential satisfaction. The app handles multi-term bundles automatically.  

  **8. What if the possible deals aren’t a "smooth, convex" set?**  
  FairSplit™ assumes the settlement space is comprehensive and convex (i.e., compromises exist between any two deals). If your dispute involves jagged, discontinuous options (e.g., "either the house *or* the yacht, no splits"), the solution defaults to the nearest feasible point preserving proportional sacrifice. We recommend consulting our mediators to smooth edges pre-input.  

  **9. Real-world example?**  
  Two co-founders separate:  
  - Founder A: Walk-away = $0 (no venture capital). Ideal = $1M (full company value).  
  - Founder B: Walk-away = $500K (investor buyout). Ideal = $1M.  
  *FairSplit™ solution*:  
  - A’s sacrifice gap: $1M - $0 = **$1M**.  
  - B’s sacrifice gap: $1M - $500K = **$500K**.  
  To equalize sacrifice proportions: A receives **$667K**, B receives **$833K**. Each keeps 66.7% of their potential gain.  

  **10. Testimonials**  
  > "After my roommate demanded 80% of the security deposit, FairSplit™ split it 57%/43% based on our cleaning costs if we sued. No lawyers. No screaming. Just math."  
  > *— Jenna R., resolved in 4 hours*  
  >  
  > "Improved my startup’s buyout offer by $200K before negotiating. FairSplit™ raised my settlement—didn’t punish me for it."  
  > *— Derek T., exited in 1 week*  

  **11. What if one party inflates their ideal point?**  
  Fraudulent inputs backfire. If you claim an unrealistic ideal (e.g., "$10B for my half of the food truck"), FairSplit™ forces *you* to absorb the excess sacrifice proportion. Honesty maximizes gains. Our audit logs flag habitual outliers for mediator review.  

  **12. Why not use mediators or judges?**  
  Human mediators optimize for "acceptability," not fairness. Judges apply opaque precedent. FairSplit™ isolates the only objectively balanced outcome: equal relative sacrifice. 93% of users report satisfaction, citing "no ambiguity" and "no winners/losers."  

  ---  
  *FairSplit™: Because fairness isn’t an opinion. It’s a proportion.*  
  *Disclaimer: Outcomes assume rational inputs. Not for use in zero-sum disputes (e.g., "who keeps the cat").*
