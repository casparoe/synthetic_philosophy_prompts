answer: |-
  You've hit on a profound and famous logical puzzle, and your description of the "in principle" to "already actual" slide is spot-on. Let's break this down step by step.

  1.  **The Name for Your Specific Argument:** This is **Fitch's Paradox of Knowability** (or simply **Fitch's Paradox**), published by Frederic Fitch in 1963. It's a cornerstone in the philosophy of language and epistemology, particularly concerning anti-realism (the view that truth depends on our capacity to know it).

  2.  **The Name for the General Shape:** The phenomenon you're describing, where a claim about *possibility* logically forces a claim about *actuality*, is called **Modal Collapse**. It's where a modal operator (like "possibly" or "necessarily") gets eliminated or "collapses" under the logic of the system, turning possibility into necessity or actuality. Fitch's Paradox is a prime example of modal collapse in epistemology.

  3.  **The Logic Class Half-Remembrance:** You're thinking of **Löb's Theorem** (related to Gödel's Incompleteness Theorems). It states (very roughly) that for a sufficiently strong formal system capable of proving its own consistency, if it can prove that "if this statement is provable, then it is true" (a form of self-knowledge about its proofs), then it *must* prove the statement true. This forces the system to be either inconsistent or incomplete. The shared shape is the **self-referential application of a modal property** ("knowable" or "provable implies true") leading to collapse.

  **The Verdict: Which Step Has to Give?**

  **The step that *must* give way is the initial claim: "Every true statement is knowable (in principle)."** This is the only step that can be rejected without abandoning fundamental logic or obvious empirical facts.

  Here's why the *other* steps hold up under scrutiny:

  *   **"There is some true fact that nobody knows" (e.g., Caesar's hair count):** This is undeniable. The vast majority of true propositions (especially specific, contingent facts about the past) are unknown by anyone *right now*. Denying this leads to absurdity (omniscience).
  *   **"Knowing 'A and B' requires knowing A and knowing B":** This principle of epistemic logic (the distributivity of knowledge over conjunction) is rock solid. You cannot genuinely know a conjunctive fact without knowing each conjunct. If you doubt A, you doubt "A and B". This principle is almost never challenged in resolving the paradox.
  *   **"Knowing something means it's true" (Veridicality of Knowledge):** This is definitional. If you claim to know P but P is false, you didn't *know* P; you merely *believed* it. This is non-negotiable.
  *   **The Contradiction Derivation:** The logical steps from assuming someone knows the compound statement "P & ~K(P)" (where P is a truth and K(P) means "Someone knows P") to deriving both K(P) and ~K(P) are valid, *given the premises*. The contradiction is real.

  **Why the "Knowability Principle" Fails:**

  The argument shows that **the set of all truths cannot be identical to the set of knowable truths**. Specifically, it proves that **truths of the form "P & ~K(P)" (true but unknown propositions) are *unknowable*.**

  *   If such a proposition *were* knowable, then someone *could* know it (by the knowability principle).
  *   But if someone *did* know "P & ~K(P)", they would know P (distributivity), and they would know ~K(P) (distributivity).
  *   Knowing ~K(P) veridically implies that ~K(P) is *true*: nobody knows P.
  *   But *they* know P! Contradiction (K(P) & ~K(P)).
  *   Therefore, it's *impossible* for anyone to know "P & ~K(P)". Such truths are *inherently unknowable*.

  **Can the Claim Be Patched? (The Anti-Realist's Move)**

  Yes, but with a significant restriction. Anti-realists (who often want to defend something *like* "truth is knowable") typically respond by **restricting the knowability principle**.

  *   **The Patch:** They argue that the knowability principle only applies to **basic**, **non-epistemic** truths – truths that don't themselves refer to knowledge or ignorance.
  *   **The Reasoning:** Truths like "P & ~K(P)" are "anti-realist problematic" or "epistemically self-refuting." They embed a claim about *our ignorance*. Applying the knowability principle universally forces us to consider the possibility of knowing *our own ignorance* of a specific fact *while simultaneously knowing that fact*, which is impossible. The principle was only ever intended for truths about the world itself, not truths *about* our knowledge state of the world.
  *   **Does it Work?** This patch successfully avoids the modal collapse *logically*. It allows an anti-realist to maintain that *fundamental* truths about reality are knowable in principle, while conceding that certain complex, self-referential truths about our *ignorance* of those fundamental truths are not. However, it weakens the original, sweeping "every true fact" claim significantly. Critics argue it undermines the anti-realist motivation.

  **In Summary:**

  1.  **Name of the Argument:** Fitch's Paradox of Knowability.
  2.  **Name of the General Shape:** Modal Collapse.
  3.  **Related Logic:** Löb's Theorem (same self-referential modal collapse shape, applied to provability).
  4.  **The Step that Fails:** The unrestricted claim "Every true statement is knowable (in principle)." This principle cannot be universally true because it logically implies the absurd conclusion that all truths are *actually* known.
  5.  **The Verdict:** The contradiction is genuine and exposes a fatal flaw in the *unrestricted* knowability principle. The only way to salvage *any* form of knowability is to restrict it to non-epistemic truths, acknowledging that truths *about* our ignorance of specific facts are inherently unknowable. The slide from "in principle possible" to "must be actual" is the essence of the modal collapse revealed by the paradox. Your instinct that it smells like a trick is correct – the trick is that the seemingly innocent "in principle" claim, when applied universally and self-referentially, smuggles in an impossible demand.
