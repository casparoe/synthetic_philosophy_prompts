  3. (10 min) Groups exchange definitions (e.g., group1 gives to group2, group2 to group3, etc.). Each group gets a definition from another group and tries to find counterexamples in their own deck or from common knowledge. They should find an activity that the definition misclassifies (either includes a non-game or excludes a game). They present the counterexample.
