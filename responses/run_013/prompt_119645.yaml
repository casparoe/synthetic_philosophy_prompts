  Reveal the deck difference: After the groups have presented their counterexamples to each other, the instructor asks: "Did any group have a definition that survived? Why do you think it was so hard?" Then: "I have to confess, the decks were not the same. Each group had a different set of activities. Group1, what was the common feature of your games? (They say competitive.) Group2? (Non-competitive.) etc." This should be a discovery.

  Debrief (15 min):
  - Map to the first activity: "In the flink activity, you were able to use the word without a definition. In fact, you might have been able to apply it to new cases without being able to state the rule. This is like how we use the word 'game' — we know how to use it without a definition."
  - The definition hunt failed because the concept 'game' does not have a common essence but is held together by family resemblances: overlapping similarities, like a rope with many fibers.
  - Point out specific moments: when a group's definition was broken by a counterexample, that is like Wittgenstein's point that no definition captures all uses.
  - When they saw the decks differed, that shows that if you look at a subset of games, you might find an essence, but it doesn't extend to the whole concept.
  - The seminar's own organizing term (e.g., "language") is also a family resemblance concept.

  Predictable problems:
  1. A group wins with a disjunctive definition: e.g., "an activity that is either competitive and rule-governed or solitary and for amusement." Then it might cover their deck. But when they exchange, another group might find a counterexample. If not, the instructor can provide one in the whole-class phase. Also, the reveal that the decks differ shows why they were able to define their subset but not the whole concept.

  2. Someone stipulates a definition and the group accepts it and stops: The instructor can circulate and ask probing questions: "Does that include X in your deck? What about Y?"

  3. Students conclude that anything goes: In debrief, emphasize that there is a difference between use and stipulation. We learn the use from examples and practice, and there are standards of correctness, but not by a definition. Use the flink activity: they were not free to call any number flink; there was a rule, but it was learned by examples.

  4. The deck difference is missed entirely: The instructor should make the reveal explicit and have groups report on the common feature they found.

  What the activity cannot do:
  - It cannot reproduce the therapeutic aim of dissolving the demand for a definition. The instructor must explain that Wittgenstein is not just saying that definitions are hard, but that the very search for an essence is misguided and that we should look at use.
  - It demonstrates the negative result (no common essence) but does not show how family resemblance works positively. The debrief can gesture at it by pointing to the flink activity: they had a concept they could use, and the rule was not necessary. But for 'game', we can see overlapping similarities. The readings will develop this.

  Timing for the whole session (90 minutes):
  - Part 1: 30 min
  - Part 2: 45 min (5 intro, 20 group work, 10 exchange and counterexamples, 10 whole class and reveal)
  - Debrief: 15 min

  Materials:
  - For Part 1: list of numbers for flink examples.
  - For Part 2: four decks of 20 activity cards each, with one-line descriptions. Also, definition cards for groups to write on.

  Let's finalize the decks (one example for each):

  Deck1 (Competitive bias):
    Games (12): 
      1. Chess
      2. Soccer match
      3. Poker game
      4. Monopoly
      5. Competitive hide-and-seek (with scoring)
      6. Charades (played in teams with scoring)
      7. Rock-paper-scissors tournament
      8. Tennis match
      9. Basketball game
      10. Tag (with rules and competition)
      11. Arm wrestling contest
      12. Video game (e.g., Fortnite, competitive mode)
    Non-games (8):
      13. Eating breakfast
      14. Brushing teeth
      15. Attending a lecture
      16. Reading a novel for pleasure
      17. Following traffic laws
      18. Playing the violin in a music competition
      19. Participating in a beauty contest
      20. Engaging in a war

  Deck2 (Non-competitive bias):
    Games (12):
      1. Playing solitaire
      2. Doing a jigsaw puzzle
      3. Solving a crossword puzzle
      4. Playing a single-player video game (e.g., Tetris)
      5. Hopscotch (jumping for fun, no competition)
      6. Building a sandcastle
      7. Flying a kite
      8. Coloring in a coloring book
      9. Playing with play-doh
      10. Sliding down a slide at a playground
      11. Blowing bubbles
      12. Watching clouds and imagining shapes
    Non-games (8):
      13. Eating breakfast
      14. Brushing teeth
      15. Attending a lecture
      16. Reading a novel for pleasure
      17. Walking to work
      18. Solving a math problem for homework
      19. Watching a movie
      20. Meditating

  Deck3 (Rule-governed bias):
    Games (12):
      1. Chess
      2. Solitaire
      3. Poker
      4. Monopoly
      5. Hide-and-seek (with rules)
      6. Charades
      7. Rock-paper-scissors
      8. Tennis
      9. Basketball
      10. Tag (with rules)
      11. Video game (with rules)
      12. Sudoku
    Non-games (8):
      13. Eating breakfast
      14. Brushing teeth
      15. Attending a lecture
      16. Reading a novel for pleasure
      17. Playing with a baby (no rules)
      18. Daydreaming
      19. Yoga (following a sequence but not a game)
      20. Meditation

  Deck4 (Physical bias):
    Games (12):
      1. Soccer
      2. Tennis
      3. Basketball
      4. Tag
      5. Hopscotch
      6. Arm wrestling
      7. Playing catch with a ball
      8. Dance Dance Revolution (video game that is physical)
      9. Jump rope
      10. Hula hooping
      11. Playing frisbee
      12. Martial arts sparring (as a game)
    Non-games (8):
      13. Eating breakfast
      14. Brushing teeth
      15. Attending a lecture
      16. Reading a novel for pleasure
      17. Yoga
      18. Running on a treadmill for exercise
      19. Weightlifting
      20. Physical therapy exercises

  Note: The classification is based on common usage, but there may be disagreements. The instructor should be prepared to defend the classification if challenged, or use it as a point for discussion.

  In the group work, they may disagree with the intended classification, but the deck is designed so that the intended games share a common feature and the non-games do not, and the group's definition will likely reflect that feature.

