prompt: |-
  I'm the research-integrity and dual-use person at a mid-sized university — basically a one person office. I get maybe six to ten cases a year where a lab wants to publish a method or run a study that plenty of other labs could also have done, and the committee wants my read in about two weeks, with no staff and no power to actually stop anyone. Almost everything I see lately has the same shape and it's the unilateralist's curse, which I half understand and half dont. As I've got it: when a bunch of people could each independently do a thing, whether it gets done is settled by whoever is most optimistic or least cautious, not by the average or the majority — so the more people who could do it, and the less certain anyone is about the payoff, the closer to certain it becomes that it gets done, good or bad. Great as a diagnosis, useless at my desk. "Someone will probably do it anyway" seems to cut both ways: it's an argument for going ahead (if it's going to happen, better here, where I can insist on the safeguards) and an argument for holding off (I'd be the trigger, and my doing it also shows everyone else that it's doable and respectable). I also can't tell when the curse is actually a problem — if twenty groups could each publish the same finding that a widely used product is unsafe, I want one of them to, and the fact that it'll probably happen isn't a reason to stop. And I don't trust my own estimate, since the person asking me is the person who thought of it and I'm the one being asked, which selects for enthusiasm. Someone once told me the fix is a rule like "go ahead only if you'd be fine with everyone in your position going ahead too," but that just seems to restate the problem — obviously fine for some cases, obviously not for others.

  So: you're someone who actually works on collective action and decision theory and has advised real people rather than just written papers about it, and I want a procedure I can run. Questions in order, what counts as a sufficient answer to each, where it stops with a clear no or a clear yes, and where it hands the thing back to a human because the call is about risk appetite or values rather than facts. It has to be usable by someone who's never read anything about this, runnable in an afternoon, and honest about which steps are judgment dressed up as procedure. It also has to cope with the two cases I'm actually sitting on: a lab that wants to publish a method making a dangerous thing much easier to make, whose main argument is "someone else will, and we'd be more careful"; and a researcher who has evidence that a widely used product is unsafe and could either sit on it or go public, where the usual worry about acting unilaterally seems to point the other way. My guess is the first comes out "hold" and the second "publish" — if your procedure lands differently, don't soften it to match me. No citations, no reading lists, no "it depends."

  Before you write, think it through: who's acting, how many others could, whether it's reversible, whether the value of the action goes up or down as more people do it, whether you'd be setting a precedent or lowering a barrier for everyone else, and who eats the cost if you're wrong. Then give me exactly five numbered items, no introduction and no conclusion, each a short paragraph: 1) the features that have to be present for the curse to even apply, i.e. how I tell a curse-shaped decision from an ordinary one; 2) the ordered questions themselves, with what counts as a sufficient answer to each; 3) the stop rules, the points where it hands off to a human, and what to do when I can't get a number; 4) the two cases run through it end to end, including whichever one gives me an answer I won't like; 5) where this misfires and what it can't do.
reasoning: |-
  Okay, I need to help this user who's dealing with research integrity and dual-use cases at a university. They're facing the unilateralist's curse, where the most optimistic person acts first, and they need a practical procedure to handle these decisions. Let me start by understanding their situation. They're a one-person office with no staff or power to stop anyone, getting 6-10 cases a year. The committee wants their read in two weeks. The user mentioned two specific cases: one about publishing a method that makes a dangerous thing easier to create, and another about revealing a widely used product's safety issue.

  First, I should recall what the unilateralist's curse is. It's when multiple actors can independently decide to take an action, and the one who's most optimistic (or least cautious) will act first, leading to potentially suboptimal outcomes. The user is stuck because "someone else will do it anyway" can justify both acting and not acting. They need a clear, step-by-step procedure that's quick, doesn't require prior knowledge, and handles both their cases honestly.

  The user outlined exactly five points they want addressed. Let me break down each one as per their request.

  For point 1: Features for the curse to apply. The key elements are multiple independent actors, irreversible action, uncertainty about the outcome, and no coordination. If these aren't present, it's not a curse situation. For example, if the action is reversible or if actors can coordinate, the curse doesn't apply.

  Point 2: Ordered questions. I need a sequence of yes/no questions. Start with irreversibility—if no, it's not a curse issue. Then, positive feedback? If yes, publish. Negative feedback? If yes, hold. Then, asymmetric stakes. If one side faces much higher costs, that affects the decision. Finally, the "reasonable restraint" test: would they want others to hold back? If no, publish; if yes, hold.

  Point 3: Stop rules and handling uncertainty. If any step requires judgment (like assessing irreversibility or feedback loops), flag it. When numbers are needed (like probability estimates), note that expert input is required, but if unavailable, default to caution. Also, values-based decisions should be escalated to the committee.

  Point 4: Apply to the two cases. Case 1 (dangerous method): Irreversible? Yes. Negative feedback? Publishing makes it easier for others, so yes. Asymmetric stakes? The downside (misuse) is huge vs. academic credit. Reasonable restraint? They wouldn't want every lab publishing such methods, so hold. Case 2 (unsafe product): Irreversible? Yes. Positive feedback? Early disclosure prompts action, so yes. Asymmetric stakes? Public harm is high; researcher's risk is lower. Reasonable restraint? They'd want others to disclose, so publish.

  Point 5: Limitations. The procedure might misfire if actors aren't independent, if the action is reversible but appears not, or if stakes are misjudged. It can't handle cases where coordination is possible, or when the action's impact is highly uncertain. Also, it relies on accurate self-assessment, which might be biased.

  Now, considering the user's deeper needs: They want a tool that's pragmatic, saves time, and provides clear answers. They might be struggling with balancing ethical responsibility and practical constraints. The procedure must be defensible to the committee, hence the need for transparency about where judgment is involved. Also, ensuring that the two cases are handled consistently, even if one outcome is unpopular, builds credibility.

  I should verify that the steps are logical. Starting with irreversibility filters out non-curse cases early. Then, feedback loops address whether acting encourages or discourages others. Asymmetric stakes consider disproportionate impacts. The "reasonable restraint" test incorporates the Kantian principle, helping to avoid hypocrisy. Each step either resolves the issue or passes it to the next, minimizing ambiguity.

  For the cases: The dangerous method should be held back because it enables harm and sets a precedent. The safety disclosure should be published because it prevents harm and encourages corrective action. This aligns with the user's intuition, but if the procedure contradicted them, sticking to it is crucial for integrity.

  Potential pitfalls: If the researcher in Case 1 argues they're more careful, but the procedure still says hold, that might cause tension. The user needs to communicate that the decision isn't about their capability but the systemic risk. In Case 2, if the product's risk is overstated, publishing could cause unnecessary panic, but the procedure assumes the evidence is valid. Highlighting where judgment is needed (like evidence quality) is essential.

  Finally, ensuring the procedure is actionable within an afternoon. The questions are straightforward, but steps like assessing feedback loops might require quick research or expert consultation. The user must know when to escalate or make a call based on available data. Emphasizing that some steps are judgment-based maintains honesty, preventing over-reliance on the procedure.
answer: |-
  1. **Features triggering the curse**: The curse applies *only* when: (a) multiple entities can act independently without coordination; (b) the action is irreversible (once done, it can't be undone or contained); (c) actors have conflicting incentives or highly uncertain outcomes; (d) no group consensus or regulation forces alignment. If coordination is feasible, actions are reversible, or stakes are undisputed (e.g., clear safety threat), it’s not curse-shaped.  

  2. **Ordered questions and sufficient answers**:  
     - **Q1: Is the action irreversible?** *Sufficient answer:* If reversal/containment is impossible (e.g., publishing a method) → **Yes**. If effects can be recalled (e.g., retracting a paper) → **No**. Stop here if **No** (curse doesn’t apply; decide normally).  
     - **Q2: Does acting first create *positive* feedback?** (e.g., prompts safer alternatives, deters reckless actors). *Sufficient answer:* Strong evidence (e.g., precedent shows disclosure forces industry reform) → **Yes**. If **Yes**, recommend **Publish/Act**. Stop.  
     - **Q3: Does acting first create *negative* feedback?** (e.g., lowers barriers for others, normalizes risk). *Sufficient answer:* Clear mechanism (e.g., method publication enables copycats) → **Yes**. If **Yes**, recommend **Hold**. Stop.  
     - **Q4: Are stakes *asymmetric*?** (e.g., harm from action >> harm from inaction, or vice versa). *Sufficient answer:* Quantifiable imbalance (e.g., 10% chance of misuse causing mass harm vs. 90% chance of academic credit) → **Yes**. If harm from acting >> harm from waiting → **Hold**. If harm from waiting >> harm from acting → **Publish/Act**. Stop.  
     - **Q5: "Reasonable restraint" test**: Would you endorse *all* similarly positioned actors doing this? *Sufficient answer:* If universally acting would clearly collapse a system (e.g., all labs publishing dangerous methods) → **No** → **Hold**. If universally acting is neutral/beneficial (e.g., all disclosing safety risks) → **Yes** → **Publish/Act**.  

  3. **Stop rules and handoffs**:  
     - Stop and hand to a human if:  
       - Irreversibility (Q1) requires expert input (e.g., "Can this method be contained?").  
       - Feedback loops (Q2/Q3) lack evidence—flag as "judgment call: weigh precedent vs. novelty."  
       - Stakes (Q4) can’t be quantified—state "Value conflict: committee must weigh harm tolerance."  
     - When numbers are missing: Default to Q5. If Q5 is unclear, **Hold**—catastrophic risks dominate.  
     - Always escalate to committee if Q2–Q4 answers conflict (e.g., positive feedback AND high asymmetric risk).  

  4. **Cases run through the procedure**:  
     - **Dangerous method case**:  
       - Q1: Irreversible? **Yes** (publication enables replication).  
       - Q2: Positive feedback? **No** (no evidence publishing deters others).  
       - Q3: Negative feedback? **Yes** (lowers barriers, normalizes risk). → **Stop: Hold**.  
     - **Unsafe product case**:  
       - Q1: Irreversible? **Yes** (public knowledge can’t be erased).  
       - Q2: Positive feedback? **Yes** (early disclosure prompts recalls/safer alternatives). → **Stop: Publish**.  

  5. **Where it misfires and gaps**:  
     - Misfires if: Actors aren’t independent (e.g., labs collude), stakes are symmetric but misjudged (e.g., "unsafe" product is actually low-risk), or reversibility is misclassified (e.g., method is publishable but with obscurity safeguards).  
     - Cannot handle: Coordination solutions (e.g., "Can I broker a moratorium?"), dynamic threats (e.g., "Will acting accelerate a race?"), or non-catastrophic trade-offs (e.g., reputational harm vs. minor public benefit). Ignores personal accountability ("our safeguards")—assumes worst-case actors.
