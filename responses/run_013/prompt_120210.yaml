prompt: |-
  Bit of a wierd ask for you. I'm a senior backend engineer at a ~400 person software company and I've somehow ended up on our internal AI tools review board — we're the group that has to say yes or no when someone wants to use a new AI thing at work. I have zero philosophy training, so excuse me if I say this wrong.

  Thursday we have to rule on one case and I'm the one writing the opinion that goes in the minutes, so it needs to land on an actual decision, not just a discussion.

  Here's the case. One of our support leads has a diagnosed memory condition (I'm not going to get into her medical details, HR owns that part) and she's been running a personal AI assistant on her work laptop for about six months. It listens to her calls, transcribes everything, and feeds her summaries and reminders. She says she genuinely can't do the job without it anymore — not a convenience thing, it's where her memory actually lives now. InfoSec wants it shut off: it ships call audio and customer data to a vendor whose terms let them train on it, and it was never in our approved stack. She's filed for it as an accommodation, but Legal says accommodations are HR's process and ours is only tooling and data risk, so we don't get to punt.

  Someone on the board keeps calling this the extended mind thing — some philosopher's example about a guy with Alzheimer's who writes everything down in a notebook, and whether the notebook is part of his mind or just a tool he uses. Which is basically our problem, except our notebook is a cloud service with a retention policy and a vendor.

  So: write the opinion I'll circulate before Thursday. Clear recommendation (approve / deny / approve with conditions), a timeframe, who owns what, and reasoning that both a security person and her manager can follow. Two things I need you to actually take seriously instead of hand-waving. First, if you go the "it's part of her mind" route, tell me what that commits us to — do we then have to treat everything in that app as un-deletable and un-auditable, like it's part of the person? That can't be right, so tell me where the line really is. Second, she's already six months deep and her output depends on it — does that change the answer, and if so is that a principle or just sunk cost? And give me the strongest case for whichever side you're ruling against, because I'll be defending this in the room. Don't bother with a reading list, I won't read it.
reasoning: |-
  Okay, the user is a senior backend engineer on an AI tools review board at a mid-sized company. They need to write a decisive opinion by Thursday about whether to allow a support lead with a diagnosed memory condition to continue using an unapproved AI assistant that ships call audio/data externally. 

  Hmm, this is messy. The core tension is medical necessity vs. corporate security/legal risk. The "extended mind" philosophy reference is interesting but ultimately a red herring for practical governance. Key things jumping out:

  First, the human stakes are high - she genuinely can't work without this tool, and it's already integrated into her workflow. Denying it could cost them a valuable employee or invite legal trouble under disability laws. But InfoSec isn't wrong either - shipping customer audio to a vendor with questionable terms is a real breach risk. 

  What's tricky is the false dichotomy. The board seems stuck between "ban it" or "treat it like her brain." Neither works. Need to carve a third path that preserves her function while mitigating risk. 

  Also noting unspoken pressures: 
  - The engineer seems uneasy about overstepping into HR territory but can't avoid ruling. 
  - There's probably frustration that this wasn't flagged earlier. 
  - They need language that satisfies both security hawks and empathetic managers.

  The solution must be:
  1) Legally defensible (ADA accommodation path)
  2) Containable (stop data leakage now)
  3) Scalable (don't set precedent for unvetted tools)

  Biggest insight: This isn't an AI tools decision at all. It's a disability accommodation that happens to involve AI. The board should only rule on the tool's risk, then kick the accommodation piece to HR where it belongs. That frames everything.

  For the opinion structure:
  - Lead with the accommodation lens to establish gravity
  - Acknowledge both the necessity and the risk as valid
  - Make the temporary approval conditional on immediate stopgaps
  - Force HR/Legal to own the long-term solution
  - Explicitly deny the "extended mind" argument as irrelevant to policy

  The "sunk cost" of 6 months usage actually helps - proves the tool's efficacy but also demonstrates urgent need to formalize. Use that.

  Biggest fight in the room will be with the security team. Need to validate their concerns while insisting on parallel processes: "Yes we shut down data flow TODAY, but HR must build her a compliant solution by X date." 

  Final opinion should feel like a surgeon's scalpel - precise incisions to separate the issues, not a hammer.
answer: |-
  **AI Tools Review Board: Recommendation**  
  **Case:** Unapproved Personal AI Assistant for Medical Accommodation  
  **Recommended Decision:** Approve with Conditions (90-Day Provisional Window)  
  **Ownership:** InfoSec (immediate actions), HR/Legal (accommodation path), Manager (transition oversight)  

  ---

  ### **Core Reasoning**  
  1. **Medical Necessity Outweighs *Current* Risk (With Urgent Safeguards)**  
     - The employee’s documented medical condition and demonstrated dependence on the tool meet a high threshold for workplace accommodation under disability laws (ADA/equivalent). Denial risks legal exposure, loss of a productive employee, and ethical failure.  
     - **However**: Unvetted external data processing is unacceptable. We mitigate this by immediately blocking data egress (see Conditions).  

  2. **"Extended Mind" Philosophy ≠ Policy**  
     - The notebook analogy (Clark & Chalmers) highlights cognitive reliance but **does not override data governance**. Even if the tool functions as her memory, the *vendor* is a third-party processor. We must:  
       - Audit/data-map the tool (InfoSec)  
       - Control data residency (Legal)  
       - Ensure no sensitive data leaves our ecosystem  
     - *Where the line is*: Tools become "part of the mind" for *accommodation purposes* but remain "company data systems" for *compliance*. They are never "unauditable" or "un-deletable."  

  3. **6-Month Usage Changes the Calculus (But Not How You Think)**  
     - **Not sunk cost fallacy**: Proven efficacy justifies accommodation urgency.  
     - **But it creates operational risk**: Sudden removal now harms productivity. This forces a *time-bound* approval to avoid disruption while transitioning to a compliant solution.  

  ---

  ### **Strongest Case for the Opposition (InfoSec)**  
  > *"Approving this sets a precedent that employees can bypass security for ‘essential’ tools, exposing customer data to unvetted vendors. The terms allow training on call audio—potentially leaking PII, trade secrets, or violating GDPR/CPRA. A breach here could cost millions and destroy trust. Accommodations must comply with infosec policy; this doesn’t."*  
  **Rebuttal**: We agree—hence *immediate data containment* and forced migration off the vendor. If HR fails to replace it in 90 days, access terminates.  

  ---

  ### **Conditions & Actions**  
  | **Timeline** | **Action** | **Owner** |  
  |--------------|------------|-----------|  
  | **Within 48h** | Block tool’s external data access (network-level). Switch to local-only transcription. | InfoSec |  
  | **Within 7d** | HR/Legal initiates formal interactive process for ADA accommodation. Legal negotiates with vendor for data deletion/audit. | HR/Legal |  
  | **Day 30** | Manager tests 1–2 approved internal tools (e.g., secured instance of Azure AI/OpenAI Enterprise) as replacements. | Manager |  
  | **Day 90** | Personal tool decommissioned. Migrate to HR-approved solution or terminate access. | Board/HR |  

  ---

  ### **Key Principles for Future Cases**  
  1. **Accommodations ≠ Tool Exceptions**: HR owns the *need*; we own the *tool’s compliance*. Never mix processes.  
  2. **Data Sovereignty Non-Negotiable**: If it touches customer data, it stays inside approved architecture.  
  3. **Proactive Testing**: Teams must pilot accommodations *before* full dependency (HR/IT co-owned).  

  --- 

  ### **Why This Works**  
  - **Security Wins**: Data egress stops immediately. Vendor risk sunset in 90 days.  
  - **Employee Wins**: She keeps critical support during transition.  
  - **Compliance Wins**: HR formalizes accommodation; Legal scrubs vendor risk.  
  - **Precedent Set**: Medical needs trigger urgent action—but never bypass governance.  

  **Final Recommendation: Approve with Conditions (90-Day Window)**. Move to vote.
