    "model_answer": "The distinction between grief that 'has a job to do' and grief that 'is the destination' offers a crucial lens for understanding how audiences engage with sadness in fiction. Grief with a job to do is inherently prospective: it is fused with uncertainty and hope, serving as the emotional cost of caring about unresolved outcomes. For instance, in a first reading of *Romeo and Juliet*, the audience's sorrow is entwined with the fragile hope that the lovers might evade tragedy—a grief that propels engagement. Conversely, grief as the destination is retrospective and self-contained; the ending is known, nothing remains unresolved, and sadness is sought intrinsically, as when one rereads Ophelia’s death in *Hamlet* solely to relive its emotional weight. I contend that the spoiler effect—foreknowledge of an ending—reveals these as fundamentally distinct phenomena, not mere intensities, and that traditional theories of tragic pleasure falter by addressing only one type while neglecting the other.\n\nThe spoiler effect acts as a litmus test for this distinction. For grief with a job to do, spoilers are destructive. Knowing the ending dissolves the uncertainty and hope that define this grief; it ceases to be a dynamic force. If one knows Tess’s fate in *Tess of the d’Urbervilles* beforehand, the sadness loses its function as the 'price of caring'—it becomes inert, like hearing the punchline before the joke. Conversely, spoilers enhance or leave untouched grief as the destination. Foreknowledge focuses attention on the sorrow itself, refining its texture. Rereading the final pages of *Never Let Me Go* to savour the resignation of Kathy H. exemplifies this: the grief is the objective, and spoilers deepen its resonance by stripping away narrative suspense. This diametric response to spoilers—destruction versus preservation—demonstrates that the two griefs operate on different mechanisms: one is instrumental (geared toward narrative resolution), the other autotelic (sought for its own sake).\n\nTraditional theories of tragic pleasure fail because they are monistic, unable to accommodate this duality. The conversion theory (pain transformed by aesthetic beauty) explains grief as the destination: the pleasure lies in the lyrical expression of sorrow, such as the poetic anguish in Keats’s 'Ode to a Nightingale.' Yet it cannot account for grief with a job to do, where raw uncertainty dominates—beauty doesn’t convert the pain of not knowing whether Cordelia will be saved in *King Lear*; that grief is inseparable from narrative tension. Compensation theory (pleasure derived from moral or cathartic rewards) fits the first type: we endure sadness for the payoff of resolution or ethical insight. But it collapses with grief as the destination, which offers no compensatory 'reward'—the sorrow *is* the reward, as in repetitively watching *Brokeback Mountain*’s bleak finale. Finally, theories emphasising fictionality (it’s painless because unreal) might comfort audiences experiencing grief as the destination but ignore how grief with a job to do *feels* real precisely because we invest in outcomes; spoilers ruin this by exposing the artifice of suspense.\n\nThus, the spoiler effect doesn’t merely support the distinction—it necessitates it. These griefs are different in kind: one dies with revelation, the other thrives on it. Traditional theories, by treating tragic pleasure as homogeneous, reveal their limits when faced with this dichotomy. Recognising this duality enriches our understanding of why sadness in fiction endures—not as a monolithic experience, but as two coexisting strands of aesthetic engagement.\n",
