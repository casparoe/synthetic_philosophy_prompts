prompt: |-
  I'm a novelist who teaches one MA module a year, a hybrid of creative writing and aesthetics called Sadness and Fiction, and I am now setting its final assessment. I want a single essay question worth 20 marks and answerable in fifty minutes, one that cannot be passed by reciting the standard literature on why audiences take pleasure in tragedy.

  The question should turn on a distinction I drew in the last lecture, which the students will not find in their reading. I distinguished grief that has a job to do — sadness fused with not knowing and with hope, the price of caring how things turn out — from grief that is the destination, where the ending is already known, nothing is to be resolved, and the sadness is sought for its own sake, as when one rereads a final chapter only to feel it again. I claimed in the lecture that these are not two intensities of one thing but two different things, and that each of the familiar families of answer (that pain is converted into pleasure by beauty or eloquence; that the pleasure is a compensation, such as the pleasure of having felt rightly; that fictional grief is not grief at all) accounts for one of my two cases and falters on the other. The question must force candidates to test that claim against the spoiler case: knowing the ending ought to spoil the first kind of reading while leaving the second untouched, or even improving it.

  Then supply a model answer of about 700 words, in continuous prose suitable for showing to students, and a marking scheme that names the moves separating a first from a 2:1, with marks attached to each.

  Give it all to me as a JSON object with these fields: 'question' (string); 'model_answer' (string); 'marking_scheme' (array of objects, each with 'move', 'marks' and 'typical_failure', the last being one line on how candidates lose those marks); 'total_marks' (number); and 'a_versus_b' (one sentence stating what a first-class answer does that a 2:1 does not).
reasoning: |-
  We are creating an essay question that tests the distinction between two types of grief in the context of fiction. The two types are:
    1. Grief with a job to do: fused with not knowing and hope, the price of caring about the outcome.
    2. Grief as the destination: where the ending is known, nothing to resolve, and the sadness is sought for its own sake.

  The question must force candidates to test the claim that these are two different things (not just intensities) by using the "spoiler case": knowing the ending should spoil the first kind but not the second (and might even improve the second).

  We also need a model answer (about 700 words) and a marking scheme.

  Let's design the question:

  Question: 
  "Using the distinction between grief that 'has a job to do' and grief that 'is the destination', as introduced in the final lecture, analyse how knowing the ending of a narrative (the 'spoiler effect') affects each type. Argue for or against the claim that these two kinds of grief are fundamentally different phenomena, and explain why traditional theories of tragic pleasure (such as conversion by beauty, compensation, or the unreality of fictional grief) can account for one but not both."

  Now, the model answer should:
  - Clearly define the two types of grief.
  - Apply the spoiler case: knowing the ending spoils the first (because it removes the uncertainty and hope) but not the second (because the sadness is the point and known in advance).
  - Argue that they are different phenomena (not just intensities) because the spoiler affects them differently.
  - Show how traditional theories (e.g., conversion, compensation, unreality) can account for one but not the other.

  Marking scheme: We'll break it down into key moves and assign marks. Total 20 marks.

  Marking scheme array of objects:
  Each object has:
    - move: the key step in the answer
    - marks: the marks allocated
    - typical_failure: one line on how candidates lose those marks

  Finally, a_versus_b: one sentence stating what a first-class answer does that a 2:1 does not.

  Let's outline the marking scheme:

  1. Clear explanation of the two types of grief (with job vs destination) - 4 marks.
     Failure: Vague or conflated definitions.

  2. Application of the spoiler effect to each type (spoils first, not second) - 5 marks.
     Failure: Inaccurate or incomplete application of spoiler effect.

  3. Argument for fundamental difference (based on spoiler effect and other features) - 4 marks.
     Failure: Only asserts without argument or misses the spoiler as evidence.

  4. Critique of traditional theories (each theory: which type it accounts for and where it fails) - 5 marks.
     Failure: Superficial treatment, doesn't show why each theory fails for one type.

  5. Overall coherence and structure - 2 marks.
     Failure: Disjointed or unclear.

  Total: 20 marks.

  But note: the question asks for the moves that separate a first from a 2:1. So we might adjust the marking scheme to have more detailed criteria for each move, but then also the a_versus_b.

  Alternatively, we can have the marking scheme as a list of required elements with marks, and then the a_versus_b will be about the depth and critical engagement.

  Let me design the marking scheme with the moves and then the a_versus_b.

  a_versus_b: "A first-class answer demonstrates a sophisticated understanding of the nuances of the distinction and its implications for aesthetic theory, critically engaging with the limitations of traditional theories, whereas a 2:1 answer provides a competent explanation and application but lacks the same level of critical depth and originality in synthesis."

  Now, the model answer:

  Model Answer (approx 700 words):

  In the final lecture, we distinguished two kinds of grief experienced in fiction: grief that "has a job to do" and grief that "is the destination." The former is characterized by its fusion with uncertainty and hope; it is the emotional cost of investment in an unresolved outcome. The latter, by contrast, is grief sought for its own sake, when the outcome is known and the sadness is revisited precisely because it is final and unresolvable. This essay argues that these are not merely different intensities of the same phenomenon but fundamentally different phenomena, and that the "spoiler effect" — knowing the ending in advance — provides a crucial test: it undermines the first kind of grief while leaving the second intact or even enhancing it. Moreover, traditional theories of tragic pleasure, such as conversion by beauty, compensation, and the unreality of fictional grief, each can account for one kind but fail to explain the other, thus supporting the claim of their fundamental difference.

  Consider first grief with a job to do. This grief arises during the narrative journey, when the reader is gripped by the fate of the characters and the story's outcome is uncertain. It is a sadness intertwined with hope and fear, a necessary part of caring about the narrative's resolution. For example, in a tragedy like Shakespeare's *Othello*, the audience's grief for Desdemona is mixed with the hope that Othello might be stopped. Knowing the ending (the spoiler) destroys this grief because it removes the uncertainty and hope: the grief loses its job. Without the tension of not knowing, the grief becomes inert, merely informational.

  In contrast, grief as the destination thrives on the known ending. It is the deliberate revisiting of a sorrowful conclusion to experience the emotion again, as when one rereads the final chapter of a beloved tragic novel. The sadness is not a means to an end (the resolution) but the end itself. For instance, rereading the death of Sydney Carton in *A Tale of Two Cities* often brings a profound, sought-after sadness. The spoiler does not spoil this experience; it is essential to it. In fact, knowing the outcome may deepen the grief because the reader can focus entirely on the emotional resonance without distraction.

  The spoiler effect thus reveals a fundamental difference: the first grief is contingent on uncertainty and is instrumental (it serves the narrative engagement), while the second is intrinsic and requires certainty. This difference in structure and function suggests they are distinct phenomena.

  Turning to traditional theories, each stumbles when applied to both kinds. The conversion theory (that beauty or eloquence transforms pain into pleasure) explains the pleasure in grief-as-destination: the aesthetic form provides pleasure in the very expression of sorrow. However, it cannot account for grief with a job to do, which is not about the beauty of expression but about the raw engagement in the unresolved narrative. The pain here is not converted; it is the necessary cost of caring.

  The compensation theory (pleasure comes from feeling appropriately, or from moral satisfaction) fits the first kind: we feel grief rightly as part of a meaningful narrative experience. But for grief-as-destination, there is no additional compensation; the sadness itself is the reward. If anything, compensation would undermine the purity of seeking sadness for its own sake.

  Finally, the theory that fictional grief is not real grief (and thus safe) might explain why we can enjoy grief-as-destination without harm. However, it fails for grief with a job to do because that grief is real in its function: it is the genuine cost of narrative investment, and spoilers show that it is not safe from being ruined by foreknowledge.

  In conclusion, the spoiler effect not only tests but also illuminates the fundamental distinction between these two griefs. Traditional theories, each tailored to one kind, inadvertently support the claim that they are different. This distinction enriches our understanding of why we seek sadness in fiction: sometimes as the price of narrative hope, sometimes as the desired destination. Both are essential to the aesthetics of sadness, but they are not the same.

