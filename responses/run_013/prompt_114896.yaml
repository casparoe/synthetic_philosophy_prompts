prompt: |-
  I have no academic background — I run a small shop — but I have spent much of the past year thinking about the difference between doing something that ends a person's life and allowing their life to end, because my aunt has been a hospice nurse for more than twenty years and I keep putting cases to her. She is patient with me but she is not a theorist; when I press her for her rule she says only that she will stop doing things to people but will not do things to them. I would like you to work out what she will say about a new case. I want your own considered judgement, not a survey of what other people think.

  Her verdicts so far, as she has given them to me:

  1. A patient in unrelievable distress begs her for an injection to end her life. She refuses, and says she would refuse even if it were lawful, and even though she agrees the suffering is unbearable.

  2. A patient on a ventilator, awake and able to speak, asks for it to be withdrawn. She withdraws it, and regards that as plainly right.

  3. A patient who is expected to need a ventilator and who says she does not want one: my aunt regards it as plainly right not to start it.

  4. A patient who can no longer swallow and who has said she does not want to be fed through a tube: right not to place one, and right to remove one that is already in place.

  5. A patient dying of cancer who is frightened and breathless and who tells her she does not want to struggle for breath. My aunt increases the morphine until the patient is comfortable, knowing it will probably shorten her life by a few hours. She says this is right, and denies flatly that she has ever hastened a death.

  6. A dying woman whose implanted defibrillator keeps firing and causing her agony, and who asks for it to be switched off. My aunt thinks that is right, though she says it feels different from taking away a ventilator, and that she would want the heart specialist to be the one to switch it off.

  7. A patient's family, worn out, ask her to give a large dose of sedative to a patient who is suffering but who has not asked to die and has not asked to be made unaware. She refuses.

  8. A woman in the last days of dying of cancer develops a chest infection. The family ask for antibiotics; my aunt withholds them, saying that antibiotics would not cure her of what is killing her and would only draw the dying out. The woman had said, while she could still speak, that she wanted nothing done that would only prolong things.

  The new case. A woman of about eighty with advanced dementia, in a nursing home. Two years ago, when she could still recognise her family and hold a conversation, she signed a document saying that if she ever reached the point of no longer recognising her family she did not want to be kept alive, and naming chest infections in particular as something she did not want treated. She now recognises no one. She is not, however, in any obvious distress: she eats with help, smiles at the staff, seems to enjoy music, and shows no sign of pain. Six months ago, on what the staff call a good day, she said she was happy and wanted to stay. She is not dying of anything else. She has developed a chest infection. With antibiotics she will probably recover and go on much as she is for an indefinite period; without them she will probably die of it within a week or so. Her family are united in wanting it left untreated and say they are following her document. My aunt is the nurse on duty, and if she does not ring the doctor and ask for antibiotics, no one will, and the woman will die.

  Tell me what my aunt will say, and why. Set out the rule she seems to be running, the other rules that would fit every one of the verdicts above just as well, and what each of those rules predicts about the new case. Say which of her earlier verdicts is doing most of the work in your prediction, and name the further case that would best tell the rival rules apart. Where her past answers genuinely leave the new case open, say so rather than manufacturing a consistency she does not have.

  I want a committed answer: pick the verdict you think she will give, say how confident you are in it and why, and give the reasons that decided you, rather than laying out the options and leaving me to choose. Please write in British English.
reasoning: |-
  Okay, the user runs a small shop but has been deeply engaged in ethical discussions with their aunt, a hospice nurse, about end-of-life decisions. They've presented a series of cases and now a new complex scenario involving an elderly woman with advanced dementia. 

  Hmm, the aunt's position is clearly rooted in the distinction between active intervention and allowing natural death - what's often called the acts/omissions doctrine in medical ethics. Her consistency across previous cases is striking: refusing lethal injections but permitting treatment withdrawals, honoring advance directives while recognizing present comfort. 

  The dementia case is particularly thorny because it pits a past directive against present contentment. The woman signed a document refusing treatment if she lost recognition abilities - which she has - but now appears happy. That spontaneous "I want to stay" comment six months ago adds another layer. 

  The family wants to follow the document. Legally, that might seem straightforward, but ethically... The aunt seems to prioritize current wellbeing over past instructions when they conflict. Remember case 8? She withheld antibiotics based on both the patient's prior wishes AND current futility. Here, the infection is treatable and the patient isn't dying otherwise. 

  Most telling is case 4 - removing a feeding tube per advance directive even when it causes death. But that involved ongoing intervention. Withholding antibiotics feels different; it's passive. Yet case 6's defibrillator deactivation shows she accepts stopping interventions that prolong suffering, even if death follows. 

  I think she'll struggle but ultimately authorize antibiotics. Why? The patient's current apparent happiness creates moral weight. The aunt's rule isn't just about following documents - it's about whether an intervention imposes suffering or disrupts natural dying. Here, treating the infection relieves suffering (chest infections are distressing!) and doesn't artificially prolong dying since she isn't actively dying yet. 

  The key precedent is actually case 7 - refusing to sedate a non-consenting patient. That shows her refusal to impose death or unconsciousness without clear justification. Withholding antibiotics here would feel like actively ending a life that currently holds pleasure. 

  If pressed for a "test case" to clarify her position: imagine the same dementia patient developed easily treatable pain. Would she withhold pain relief based on the advance directive? I suspect not - that would violate her core principle of relieving suffering in the moment. 

  My confidence is high (85%) because her past decisions consistently protect present comfort unless an intervention forcibly prolongs dying against the patient's will. Here, treatment aligns with comfort without constituting "doing something to" end life.
answer: |-
  Based on your aunt's consistent pattern across the eight cases and the core principle she articulates ("stop doing things to people but will not do things to them"), here is my analysis:

  1.  **My Aunt's Predicted Verdict:** She will ring the doctor and ask for antibiotics.
  2.  **Confidence Level:** High (85%). This case sits at the edge of her principles, but her established pattern points strongly towards treatment.
  3.  **Reasons Deciding the Verdict:**
      *   **The Core Rule:** Her rule centres on the distinction between *acting to cause death* (forbidden) and *ceasing or withholding burdensome, non-obligatory medical interventions that are prolonging the dying process or causing suffering* (permitted, even if death is foreseen). It prioritises *not imposing harm* over rigid adherence to prior directives when current circumstances differ significantly.
      *   **Current State vs. Past Directive:** The patient *is not currently dying* (unlike cases 2, 3, 4, 5, 6, 8). She is stable, not in distress, and seemingly derives pleasure from basic interactions. The chest infection is an *acute, treatable condition* interfering with this stable state. Withholding antibiotics isn't *allowing* her to die from her underlying dementia (which isn't actively killing her now); it would be *causing* her death from a reversible infection.
      *   **Suffering and Burden:** Unlike cases 1, 5 (where suffering was present and addressed by comfort care), 6 (where the device *caused* agony), and 8 (where treatment was futile and prolonged dying), the patient shows *no current distress*. The infection itself likely *will* cause distress as it progresses untreated. Antibiotics are a relatively simple, non-burdensome intervention to relieve *that* suffering and restore her to her prior baseline of comfort. *Not* treating imposes suffering she isn't currently experiencing.
      *   **The "Happy and Wants to Stay" Comment:** While made on a "good day," this recent expression of contentment carries significant weight against the *strictest* interpretation of the advance directive. It suggests her *current* state, while diminished, is not one she finds intolerable. Your aunt's rule seems sensitive to present reality.
      *   **Contrast with Case 8:** Case 8 is the closest precedent, but crucially different. In case 8, the patient *was actively dying* from terminal cancer. Antibiotics were futile for the underlying cause of death and would only prolong the dying process against the patient's expressed wishes. Here, the patient *isn't dying* from dementia *at this moment*; the infection is the sole, reversible cause of imminent death. Treatment isn't futile for the acute problem; it's highly effective.
      *   **Contrast with Case 4 (Feeding Tube):** Removing the feeding tube aligned with the directive *and* involved ceasing an artificial intervention providing basic sustenance to someone who could no longer eat, likely in the context of decline/dying. Here, antibiotics treat an acute illness in someone who *is* eating and not otherwise dying. They are more akin to treating a broken bone or pneumonia in someone with stable chronic illness than to providing artificial life support.
      *   **Not Following Case 1 or 7:** Withholding antibiotics isn't an *act* like an injection, but it *is* an intentional omission aimed *at* causing death for a reversible condition in a non-suffering patient – which feels closer to the unacceptable "doing things to them" in case 7 (sedating against will to end life) than to acceptable omissions in other cases. It would be *using* the infection as a tool to achieve death, which violates the spirit of "not doing things to them."

  **The Rule She Seems to be Running:**
  "Withhold or withdraw medical interventions *only* when they are: (a) burdensome to the patient (causing suffering without sufficient benefit), or (b) artificially prolonging the dying process in a patient who is actively dying from an underlying terminal condition, *and* where this aligns with the patient's known wishes or best interests when they cannot speak. It is never permissible to perform an act *intended* to cause death, or to withhold basic/ordinary care that relieves suffering or treats reversible conditions *solely* to bring about death, even if requested in advance, if the current circumstances suggest the patient does not find their life intolerable."

  **Other Rules That Fit the Past Verdicts (Just As Well?):**

  1.  **Strict Acts/Omissions Doctrine:** "Causing death by active intervention (commission) is always wrong; allowing death by omission may be permissible, especially if the treatment is 'extraordinary' or burdensome." (Fits all past cases *except* perhaps the nuance in Case 6 - turning off the defibrillator feels active, but she allows it).
      *   **Prediction for New Case:** Withhold antibiotics (omission). This *conflicts* with my prediction.
  2.  **Prior Autonomy Supreme:** "The patient's clear prior directive must always be followed, regardless of current state, unless there is evidence it no longer reflects their values (e.g., coercion)." (Fits Cases 2, 3, 4, 8 well. Fits Case 6 if the request was current. *Doesn't clearly fit* Case 5 (morphine - intention matters) or Case 7 (refusing family request). Case 1 refusal might be based on act/omission *or* rejecting the directive to kill).
      *   **Prediction for New Case:** Withhold antibiotics (follow directive). This *conflicts* with my prediction.
  3.  **Current Suffering Primacy:** "Interventions (including withholding/withdrawing) are permissible only to relieve *current* intolerable suffering caused by the disease or treatment. Advance directives against treatment are valid only if the *condition* they pertain to is causing suffering." (Fits Cases 1 (suffering present but active killing forbidden), 2, 3, 4, 5 (relieves suffering), 6 (relieves suffering), 7 (no current request/suffering cited? Ambiguous), 8 (treatment futile, suffering prolonged). Case 6 feels a bit stretched - suffering is caused by the device, not the underlying heart condition).
      *   **Prediction for New Case:** **Treat with antibiotics.** The patient shows no *current* suffering from dementia, and the infection *will* cause suffering if untreated. Treatment relieves the imminent suffering the infection would cause. This *aligns* with my prediction.

  **Key Verdict Doing the Work & The Test Case:**

  *   **Most Influential Past Verdict:** **Case 8 (Withholding antibiotics in dying patient)**. This shows her willingness to withhold treatment based on futility, alignment with wishes, and avoiding prolonging dying. The *critical distinction* here is that the new patient *isn't dying* from her underlying condition *at this time*. The infection is the sole cause of imminent death and is treatable. Case 8 highlights that antibiotics are withheld *only* when they prolong the dying process, not when they prevent death from a reversible cause in a stable patient.
  *   **The Crucial Test Case:** A case that best distinguishes the competing rules would involve a patient with a clear advance directive refusing all life-prolonging treatment (e.g., antibiotics for infection), who develops a *reversible* condition (like this chest infection), but who *is also experiencing clear, observable distress or suffering directly caused by the underlying condition* that the directive pertained to (e.g., severe, uncontrolled pain from advanced cancer, or constant terror from dementia). Does she:
      *   Follow the directive strictly and withhold antibiotics, allowing death from the infection? (Prior Autonomy Supreme)
      *   Withhold antibiotics because the treatment is burdensome/extraordinary in context? (Strict Acts/Omissions)
      *   Treat the infection to relieve the *suffering caused by the infection itself*, even if death from the underlying condition is delayed? This aligns with her likely principle (Current Suffering Primacy / Her Rule) and Case 5 logic – treat suffering even if life is slightly prolonged. *This would confirm she prioritises relieving current suffering and sees treating reversible conditions causing suffering as obligatory, even against a prior directive, unless the patient is actively dying.*
      *   Withhold treatment because the underlying suffering makes life intolerable and treatment futile long-term? (Closer to Case 8 logic).

  **Conclusion:**

  Your aunt's pattern reveals a nuanced, clinically grounded ethic focused on avoiding direct harm, relieving current suffering, and not prolonging dying with burdensome or futile interventions. The dementia patient's current lack of distress, her recent expression of contentment, and the treatable nature of the infection (which itself causes suffering) make withholding antibiotics feel like an *act* aimed at ending her life, rather than *allowing* a death from dementia. It imposes suffering she doesn't currently have. **Therefore, she will ring the doctor and ask for antibiotics.** Her past answers leave the *weight* given to the "happy and wants to stay" comment slightly open, but the core principles point firmly towards treatment in this specific scenario.
