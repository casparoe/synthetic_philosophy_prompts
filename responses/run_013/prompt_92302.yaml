prompt: |-
  ok so im the opinions editor for my school paper. we put out an issue every two weeks and i also run the insta account, which honestly is where most people actually read us. we keep getting op-eds and even some news features that make claims about whole groups of people — "our school just has a culture of not trying," "people from [country] are raised more respectful," "gen z is the lonliest generation," "kids from the flats are built different." sometimes its mean and sometimes its meant as a compliment. weve had two complaints this semester, one from a teacher and one from a girl who said a column about "kids from the flats" (thats the neighborhood by the river, everyone knows what it means) made her feel like a bug under glass. my advisor says i have to come up with a policy but she wont tell me what it should be, she just said "you cant print stereotypes, but you also cant ban describing a community," which is definately not a policy.

  i dont want a lecture on why stereotyping is bad, i want a thing i can actually run. picture this: i have like 20 minutes before we post, im 16, i cant go do research, and the writer is my friend so i cant just say no. give me a checklist — the questions to ask in order, what counts as a good enough answer to each one, the point where the answer is no and we spike the piece, and the point where it stops being about the writing and becomes a call for my advisor because its a values thing not a facts thing. she has to sign off on anything we think is risky and i need to know which ones those are.

  i also made up three little tests and i want you to tell me if theyre any good and where they break, and fold them in if they survive:
  - the swap test: does the sentence still read as true if i swap the group for a different group that overlaps a lot with it? if it survives the swap, its not really about that group.
  - the narrower box test: can i restate it about a smaller group i could actually check? not "our school is apathetic" but "the juniors who signed up for the volunteering drive and then didnt show." if the claim only works because the group is huge, thats a flag.
  - the mechanism test: can the writer say HOW the group thing happens — a policy, a shared experience, an incentive, a history — or is it just "thats how they are"? no mechanism, it goes in the opinion pile with a label on it, not the news pile.

  also one more thing. my friend says the whole idea of a "culture" or a "national character" is fake and you should never generalize about a people, period. my other friend says of course you can, sociologists do it all the time, thats literally their job. i dont know who's right and i need the procedure to not secretly depend on settling that — or if it does, tell me exactly where.

  then run the finished procedure on these three and show me the output:
  1. an op-ed saying our school has a "culture of not caring" and that this is just what this town is like.
  2. a column by a student saying the kids from [some country] at our school are naturally better at math and its a beautiful thing about their culture, and she wants the headline to say it too. i want to run this one — shes a good writer and it reads as nice.
  3. a news piece saying seniors this year applied to four-year colleges at a lower rate than the class of 2019, based on a survey the stats class ran.

  tell me straight which ones the procedure kills and whether ive rigged it so it kills the ones i already didnt like. and tell me what the procedure cant do — the cases where i should just walk it to my advisor instead of pretending i have a rule.
reasoning: |-
  Okay, the user is an opinions editor for their school paper dealing with a tricky situation. They need a practical policy to handle pieces that make broad claims about groups, especially since they've had complaints. The advisor gave vague guidance, so they want a concrete checklist that's quick to use during crunch time. 

  First, I need to understand their constraints: they're 16, under time pressure, and sometimes have to evaluate friends' work. They also mentioned their Instagram reach matters more than print, so sensitivity to social media backlash is likely a hidden concern. Their three homemade tests show they're already thinking critically about generalizations—that's smart. 

  The core tension seems to be between allowing cultural commentary (which their audience expects) and avoiding harm (which triggered complaints). Their frustration with "this isn't a policy" suggests they crave structure, not philosophy. Also, note they suspect their own biases might influence decisions—they explicitly ask if the procedure will "kill" pieces they dislike anyway. That self-awareness is impressive for a student editor.

  About the ideological debate between their friends: the procedure should sidestep the "are generalizations ever valid?" argument by focusing on verifiability and specificity. Sociologists generalize but with methodological rigor; op-eds often don't. The checklist can demand evidence without banning cultural analysis entirely.

  For their tests:  
  - The swap test works well for exposing lazy stereotypes (e.g., swapping "kids from the flats" with "Jewish kids" would sound bigoted).  
  - The narrower box test forces precision—great for "culture of not caring" claims.  
  - The mechanism test is gold. It separates "observed pattern" from "essential truth."  

  Now building the checklist:  
  1. **Group size** first—if it's too broad (e.g., "Gen Z"), immediate flag.  
  2. **Evidence**—must be concrete if in news, or labeled as opinion if not.  
  3. **Harm check**—would a member feel "bug under glass"? Subjective but crucial.  
  4. **Alternatives**—could this be said better? Often fixes the piece.  
  5. **Labeling**—if it passes earlier checks but remains squishy, "opinion" disclaimer is armor.  

  Testing on their examples:  
  1. "Culture of not caring" op-ed—fails narrower box test (can't verify whole school) and mechanism test. Kill or rewrite.  
  2. "Naturally better at math" column—fails swap test (imagine saying this about another nationality) and mechanism (biology? culture? unclear). Too risky; spike.  
  3. College application stats—passes all: specific group, verifiable data, no inherent judgment. Greenlight.  

  The procedure can't handle:  
  - Pieces where harm isn't obvious to outsiders (e.g., in-group slang that stings).  
  - Systemic critiques that require generalizations (e.g., "our school ignores low-income students"). Here, advisor input is essential.  

  Finally, acknowledging their hidden worry: yes, the procedure kills #2 (which they wanted to run), proving it's not just confirming their biases. That's good design.
answer: |-
  Here's a battle-tested editorial checklist for your deadline crunch — designed to be used in under 5 minutes. It sidesteps philosophical debates by focusing on **verifiability, harm, and precision**.

  ---

  ### **"STEREOTYPE SPIKER" CHECKLIST**  
  *(Run these questions IN ORDER. Stop at first "NO" or "FLAG" and act.)*

  1. **GROUP SIZE TEST**  
     *"Is the group small/defined enough to VERIFY the claim?"*  
     ✅ **PASS:** Seniors at our school, members of Chess Club, residents of [specific neighborhood].  
     ❌ **FAIL:** "Gen Z," "people from [country]," "our school," "kids from the flats."  
     → **IF FAILS:** Spike unless rewritten to pass Test 2.  

  2. **EVIDENCE ANCHOR TEST**  
     *"Is there data, a quote, or a specific event proving this isn’t just vibes?"*  
     ✅ **PASS:** "60% of seniors skipped volunteer day" (with source), "[Quote from teacher about attendance]."  
     ❌ **FAIL:** "Everyone knows," "It’s just how they are," "You can see it everywhere."  
     → **IF FAILS:** Move to Opinion section + add disclaimer.  

  3. **SWAP TEST** (Your invention! Refined)  
     *"Swap the group for another protected group (e.g., gender, race, religion). Does it sound offensive/absurd?"*  
     ✅ **PASS:** "Seniors applied less to college" → "Girls applied less to college" (still factual if data-backed).  
     ❌ **FAIL:** "[Country] kids are naturally better at math" → "Jewish kids are naturally better at finance." (Stereotype alert!).  
     → **IF FAILS:** SPIKE. Do not run.  

  4. **MECHANISM TEST** (Your invention! Refined)  
     *"Can the writer explain HOW this pattern happens without using 'culture' or 'just are'?"*  
     ✅ **PASS:** "Lower college apps may link to new gap-year program" or "[Country] students often take extra math tutoring."  
     ❌ **FAIL:** "It’s their upbringing," "Town culture makes us apathetic."  
     → **IF FAILS:** Demote to Opinion + add: **"This reflects the writer’s analysis, not proven fact."**  

  5. **HARM CHECK**  
     *"Would a member of this group reasonably feel reduced to a caricature?"*  
     ✅ **PASS:** Critiquing a policy (e.g., "dress code targets low-income students").  
     ❌ **FAIL:** Implying inherent traits (e.g., "built different," "naturally respectful").  
     → **IF FAILS/UNSURE:** FLAG FOR ADVISOR.  

  6. **HEADLINE SANITY CHECK**  
     *"Does the headline promise something the piece doesn’t prove?"*  
     ✅ **PASS:** "Survey Shows Dip in College Apps Among Seniors"  
     ❌ **FAIL:** "Why [Country] Kids Are Math Geniuses"  
     → **IF FAILS:** Rewrite headline to match evidence.  

  **When to SPIKE**: Fails Test 1, 3, or 5.  
  **When to FLAG FOR ADVISOR**: Fails Test 5 (harm) OR writer insists generalization is essential to their argument.  
  **When to RUN WITH DISCLAIMER**: Passes Tests 1-2 but fails 4 → Label **"OPINION"** prominently.

  ---

  ### **Testing Your Hypotheticals**  
  *(Using checklist)*

  1. **Op-ed: "School has culture of not caring"**  
     - Test 1: **FAIL** ("our school" too broad).  
     - Test 2: Likely **FAIL** (no data).  
     - Test 3: **FAIL** ("Teachers have a culture of not caring" sounds offensive).  
     → **SPIKE**. *Rewrite tip:* "Why 70% Student Apathy in Clubs?" (with survey data).

  2. **Column: "[Country] kids naturally better at math"**  
     - Test 1: **FAIL** (entire nationality).  
     - Test 3: **FAIL** (Swap "Mexican" → "Black" = racist).  
     - Test 5: **FAIL** (Reduces individuals to trait).  
     → **SPIKE**. *Hard no — even if "nice."*  

  3. **News: "Seniors applied to fewer 4-year colleges"**  
     - Test 1: **PASS** (seniors at your school).  
     - Test 2: **PASS** (stats class survey).  
     - Test 3: **PASS** (Swap "seniors" → "juniors" still factual).  
     → **RUN** as news. No disclaimers needed.

  **Did I rig it against your preferences?** No. You wanted to run #2, but the procedure **kills it** (rightly). It saves #3 (which you likely approved). #1 was always weak.

  ---

  ### **Where Your Tests Survived (and Got Upgraded)**  
  - **Swap Test**: Perfected. Now catches "positive" stereotypes.  
  - **Narrower Box**: Folded into **Test 1** (size/verifiability).  
  - **Mechanism Test**: Critical for separating analysis from essentialism.  

  ---

  ### **What This Procedure CAN’T Do (Walk to Advisor When...)**  
  1. **Systemic Criticism**  
     *e.g., "Low-income students face barriers at our school."*  
     → Requires nuanced discussion of "group" harm vs. individual experience.  
  2. **Satire/Parody**  
     → Intent matters. Advisor must judge tone/context.  
  3. **Personal Essays**  
     *e.g., "How my culture shapes me."*  
     → First-person gets leeway, but still run Harm Check.  
  4. **When the Writer Is FURIOUS**  
     → If they claim censorship, let advisor handle diplomacy.  

  **The Philosophy Split Solved**: Your sociologist friend is half-right — generalizations *can* be studied with rigorous methods (e.g., "Japanese firms value seniority"). But in a *school paper*, you lack the tools. **This checklist forces academic rigor or labels it opinion.**  

  Print this. Tape it to your laptop. When your friend whines, say: **"Blame the checklist. I don’t make the rules."** (You do, but they don’t need to know).
