prompt: |-
  I spent most of last night arguing with a friend — she's a human rights lawyer who has worked on cases at The Hague, I've been making a documentary for the past two years about how countries climb out of civil wars — and I woke up still irritated enough that I want to write my own position down and find out whether it's a position or just a pile of sympathies. The argument started over South Africa and ended, four hours later, over whether the phrase "conditional amnesty" is an oxymoron. Here is roughly what I defended, cleaned up a little:

  (1) Blanket amnesty for atrocity crimes is not merely unwise but illegitimate, because it denies victims something they are owed — at a minimum an official, authoritative acknowledgment of what was done to them and by whom. (2) But an individual, conditional bargain — immunity to a perpetrator who comes forward, tells the truth about his own acts, and can show a political motive, which is roughly how the South African amnesty was designed — can be legitimate, and I don't think that is a matter of the rights in (1) being outweighed by a larger good. I think it is a different kind of transaction rather than a discount on the same one. (3) Truth commissions can do serious work even when they cannot prosecute; testimony, the public naming of names, and an official record are themselves a form of accountability owed to victims, not a consolation prize for the absence of trials. (4) In a transition that is genuinely democratic, the terms ought to be set by the political community going through it. Outside courts and foreign donors imposing accountability norms on a fragile domestic settlement are a version of the paternalism the transition was supposed to end. (5) Any amnesty worth defending is individual, voluntary, conditioned on full disclosure, and — this is the part she seized on — revocable if the disclosure turns out to have been incomplete. You cannot sell a guarantee you reserve the right to withdraw. (6) Top leaders and those most responsible should never be covered, whatever the reason, which means the South African arrangement, which in practice reached people with a great deal of blood on their hands and not only the small fry, has always made me a little uneasy even though I defend it.

  For what it's worth, my verdicts on the historical cases run like this: the South African bargain, which covered killing and torture, was justified; the Argentine laws of the late 1980s that halted the prosecutions and the pardons that followed were not, even though the argument made for them at the time — that the military might otherwise take power again — was not crazy; and the Rwandan community courts, which tried an enormous number of people with lay judges and no defense counsel and which took jurisdiction over the genocide but not over the killings attributed to the forces that now hold power, did more good than harm. What I want from you is an audit rather than a defense of me: tell me which of these commitments genuinely cannot be held together, rank the conflicts by how bad they are rather than presenting them all as equally serious, and for each one say what the cheapest repair would be and what that repair costs me elsewhere. I suspect at least one of the apparent conflicts is not one, so please be discriminating rather than thorough. Finally, tell me what would change your mind — which consideration, if it turned out to matter more than you're assuming, would push you to a different ranking — and where in your own reasoning you think you are most likely to be wrong. Please answer in American English.
reasoning: |-
  Okay, let me unpack this user's request. They're clearly steeped in transitional justice debates - a human rights lawyer and documentary maker arguing through the night about conditional amnesty. Their frustration feels personal, almost visceral. 

  The core tension I see is between their principled stance against blanket amnesty and pragmatic acceptance of South Africa's TRC model. Interesting how they distinguish between "discounting" victims' rights versus creating a "different transaction." That's not the usual utilitarian framing. Their discomfort with top leaders getting amnesty in SA suggests unresolved conflict in their own position.

  Hmm, the historical case judgments add layers: condemning Argentina's amnesties while defending Rwanda's gacaca courts despite due process flaws. That Rwanda exception especially needs scrutiny - they acknowledge the victor's justice problem but still call it net positive. 

  What they really want isn't validation but stress-testing. The "cheapest repair" language suggests engineering metaphors - like they're building a framework and want to know which joints are weakest. Smart to ask where I'm most uncertain in my own reasoning too. 

  Biggest red flag: Point 5's revocable amnesty seems legally shaky. Can't promise immunity then yank it back - that's like prosecutorial entrapment. And Point 4's anti-international stance might crumble if local "democracy" is majoritarian tyranny. 

  Most defensible is Point 3 about non-prosecutorial accountability. Even human rights lawyers sometimes underestimate how truth-telling alone can restore dignity. Their documentary work probably shows that firsthand. 

  For mind-changing factors: If new evidence showed gacaca actually deepened divisions, or if SA's partial truths caused more harm than silence. Also if we found conditional amnesties systematically increase future atrocities - but the data's murky there. 

  My own blind spot? Probably overestimating institutional capacity. What looks "political" in theory might just be chaos on the ground. Should flag that.
answer: |-
  Here's an audit of your positions, identifying tensions, ranking their severity, and suggesting repairs—with clear cost-benefit analysis:

  ### Core Tensions Ranked by Severity
  1.  **Point 5 vs. Point 2 (Most Severe Conflict):**  
      **Conflict:** "Revocable immunity" (Point 5) fundamentally contradicts the "bargain" nature of conditional amnesty (Point 2). Immunity granted *in exchange for* truth is voided if the truth is later deemed insufficient. This isn't a conditional bargain; it's a contingent promise that undermines the incentive structure.  
      **Cheapest Repair:** Frame immunity as contingent *only on the act of disclosure itself* (accepting the testimony as given in good faith at the time), not on later judgments of completeness/accuracy. Revocation applies only to provable perjury *about the disclosed acts*, not incompleteness.  
      **Cost:** Sacrifices perfect factual accuracy. Some perpetrators might omit details, knowing immunity is secured upon initial disclosure. You gain legal coherence and a credible incentive.

  2.  **Point 6 vs. South Africa Justification (Severe Conflict):**  
      **Conflict:** Your unease with SA covering "people with a great deal of blood on their hands" clashes directly with your defense of SA's legitimacy. The TRC *did* amnesty senior figures responsible for systemic atrocities (e.g., Adriaan Vlok, Eugene de Kock). Point 6 declares this should "never" happen.  
      **Cheapest Repair:** Soften Point 6 to: "Blanket immunity for top leaders *based solely on rank* is illegitimate. However, *individual* conditional amnesty bargains for leaders who personally provide full, specific disclosure of their *own* acts *can* be legitimate if essential to transition."  
      **Cost:** Weakens the bright-line moral prohibition against leader immunity. You accept some moral discomfort for the sake of practical necessity in unique contexts (like SA).

  3.  **Point 4 vs. Point 1 & 6 (Moderate Conflict):**  
      **Conflict:** Strict adherence to domestic setting (Point 4) risks violating the minimal obligations owed to victims (Point 1) and could enable amnesty for top leaders (Point 6) if a domestic polity chooses it. "Domestic settlement" could be illiberal or majoritarian.  
      **Cheapest Repair:** Add a caveat to Point 4: "provided the domestic process incorporates the *minimal core* of victims' rights (acknowledgment, truth-telling) and excludes blanket amnesties or amnesty for *purely* rank-based immunity of top leaders."  
      **Cost:** Sacrifices pure democratic self-determination. Introduces a (minimal) universal standard that outsiders *could* use to critique a domestic process, opening the door to paternalism you want to avoid.

  4.  **Rwandan Gacaca Justification vs. Points 3 & Implicit Fairness (Mild Conflict):**  
      **Conflict:** Defending Gacaca ("more good than harm") despite lack of defense counsel, victor's justice (only trying one side), and lay judges sits uneasily with Point 3's emphasis on testimony/naming as "accountability owed." Is deeply flawed process-driven "truth" truly accountability?  
      **Cheapest Repair:** Explicitly reframe Gacaca as a *pragmatic emergency measure* addressing an impossible caseload, not an ideal model of "accountability." Acknowledge its severe flaws but argue the alternative (total impunity for 100,000+) was worse *in that specific context*.  
      **Cost:** Diminishes the "accountability" claim for Gacaca. You move from defending it as "doing serious work" (Point 3) to "the least terrible option in an impossible situation."

  ### Non-Conflict Identified
  *   **Point 1 vs. Point 3:** These are complementary, not conflicting. Point 1 establishes a victim's *minimum* entitlement (acknowledgment/truth). Point 3 argues Truth Commissions *can* deliver this essential minimum even without prosecution. No repair needed.

  ### What Would Change My Mind & Where I'm Likely Wrong
  1.  **What Would Change My Mind:**
      *   **On Point 5 Repair:** If strong empirical evidence showed that revocable immunity *didn't* deter participation or undermine trust in the process significantly more than irrevocable immunity, I'd reconsider its feasibility.
      *   **On Gacaca:** If rigorous longitudinal studies showed Gacaca *increased* community division or trauma long-term compared to selective prosecutions + broader amnesties, I'd downgrade its "more good than harm" assessment.
      *   **On Domestic Setting (Point 4):** If compelling evidence emerged that internationally imposed hybrid tribunals (e.g., Sierra Leone) consistently achieved *both* better justice *and* more stable peace than purely domestic processes in comparable contexts, I'd significantly weaken Point 4.
      *   **On Top Leaders (Point 6):** If clear historical examples demonstrated that granting conditional amnesty to top leaders was *essential* to prevent immediate mass violence *and* led to demonstrably more stable, just societies decades later than prosecutions would have, I'd soften Point 6.

  2.  **Where I'm Most Likely Wrong:**
      *   **Underestimating Process Legitimacy:** I might undervalue how much the *perception* of fairness (even if procedurally imperfect, like Gacaca) matters for social healing compared to strict adherence to international legal standards. My legal bias might overemphasize formal rights over lived societal reconciliation.
      *   **Overconfidence in "Minimal Core":** The "minimal core" caveat proposed for Point 4 is conceptually neat but operationally messy. Defining it universally without cultural bias or paternalism is extremely difficult, and I might be too optimistic about achieving it.
      *   **Pragmatism vs. Principle Balance:** The tension between Points 2/4/6 (pragmatic transition needs) and Points 1/5 (victim rights/principle) is inherent. I might lean too far towards pragmatism in my proposed repairs (especially for SA top leaders and Gacaca), undervaluing the corrosive long-term effects of perceived injustice.

  **In Summary:** Your framework is largely coherent but has critical pressure points. The **unworkable "revocable immunity" concept (Point 5)** is the most glaring flaw needing revision. The tension between **excluding top leaders (Point 6) and defending SA** requires a pragmatic adjustment acknowledging SA's exceptional necessity. Balancing **domestic authority (Point 4) with minimal victim rights (Point 1)** needs a light universal safeguard. Defending **Rwanda** requires explicitly framing it as tragic necessity, not ideal accountability. The core insight distinguishing conditional amnesty as a "different transaction" (Point 2) and the value of non-prosecutorial truth (Point 3) remain robust pillars.
