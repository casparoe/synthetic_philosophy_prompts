answer: |-
  Your struggle resonates deeply—that sense of a word buckling under the weight of too many disparate realities, yet refusing to fracture into homonyms. Philosophers have indeed grappled with this peculiar tension within "pleasure," and while no single label captures its entirety, the terrain can be mapped. Your two difficulties are intertwined roots of the same gnarly tree: the problem of **Pleasure’s Unity** and the problem of **Conative-Hedonic Dissonance**. Let’s carve them.

  ### 1. The Problem of Pleasure’s Unity (Why "Pleasure" Feels Like One Word Despite No Common Core)
  You’re right: pleasures are not shades of red. They lack a single phenomenological quality, bodily locus, or even valence-direction. Standing in the cold river is a sensory flood; the perfect sentence is an aesthetic click; *schadenfreude* is a bitter tang; the extracted tooth is cessation; the remembered humiliation is a retrospective alchemy. Philosophers call this the **Heterogeneity Problem**. Jeremy Bentham and John Stuart Mill assumed pleasure was a uniform sensation, differing only in intensity or duration. But your examples shatter that. Later thinkers (Gilbert Ryle, Ludwig Wittgenstein) argued that "pleasure" isn’t naming a *thing* (like "red" names a wavelength) but performing a *function*: signaling a **pro-attitude** or a **positive valence**. 

  Here’s the carving: What unifies "pleasure" is not a shared *felt quality* but a shared *role* or *position* in the structure of experience and motivation. It marks:
  -   **The satisfaction of an impulse or need:** The cold river satisfies bodily heat, the sentence satisfies creative intent, *schadenfreude* satisfies a (base) social impulse, the tooth’s removal satisfies the drive for relief.
  -   **The absence of a felt aversion *in the moment of experience*:** Even painful memories, *when recalled pleasurably*, aren’t actively resisted *at that moment of recall*. The aversion belonged to the past event, not the present recollection.
  -   **A reason-giving state:** "I do it because I take pleasure in it" functions as a reason, however varied the "it" and the "pleasure."

  **What survives your examples?** This functional unity survives:
  -   **The Tooth:** Satisfies the overwhelming need for pain cessation (relief is the satisfaction of a negative drive).
  -   **Schadenfreude:** Satisfies a (morally suspect) desire for a rival's downfall; no active aversion *while* savoring the news.
  -   **Relief:** Explicitly defined by the satisfaction of a need (ending pain/discomfort).
  -   **Remembered Humiliation:** Satisfies a complex impulse (perhaps mastery, vindication, or narrative closure) regarding the past; no aversion *during the pleasurable recall*.

  **What it gives up on:** It gives up on finding a single, common *feeling*. The "what it's like" of these moments is irreducibly diverse. The unity is relational, not phenomenological.

  ### 2. The Problem of Conative-Hedonic Dissonance (Wanting vs. Liking)
  This is where your reluctant addict or joyless enthusiast lives. The word "pleasure" seems to straddle two distinct poles:
  -   **Hedonic Pleasure (Liking):** The *felt* experience of enjoyment, satisfaction, or positive affect (the cold river, the good sentence).
  -   **Conative Pleasure (Wanting):** The motivational force, the *drive* towards something, the state of being attracted or finding something reason-giving, *regardless* of concurrent positive affect (the addict compulsively using while feeling nothing, the enthusiast driven by duty or obsession rather than joy).

  Philosophers like Gilbert Ryle exposed this as a **Category Mistake** – treating different logical types (a feeling vs. a disposition to act) as the same thing. Neuroscientists (e.g., Kent Berridge) empirically distinguish "liking" (hedonic hotspots) from "wanting" (dopaminergic drive). Your insight – "I cannot always say of my own characters whether they like a thing or merely want it" – is profound. This dissonance is fundamental to complex human motivation.

  **Their Relationship:** The Heterogeneity Problem makes the Conative-Hedonic Dissonance possible and pervasive. Because "pleasure" isn't anchored to one feeling, it can drift to cover motivational drives *even when* the expected feeling is absent. The functional unity (signaling a pro-attitude/reason) allows the word to stretch over this fissure, masking it in ordinary language. We *say* "He takes pleasure in gambling" even if he feels only compulsion and despair, because he is *drawn* to it, it *motivates* him. The fissure becomes visible precisely when Hedonic Pleasure (liking) and Conative Pleasure (wanting) peel apart, as in your examples.

  ### What It Is Not
  *   **Not Mere Vagueness (like "Game" or "Art"):** "Game" and "Art" have blurred boundaries and debated cases, but they also have clearer central cases sharing core features (rules/goals for games; expression/communication for art). Pleasure’s heterogeneity is more radical – there may be *no* core felt feature shared by all central cases. The cold river and *schadenfreude* are both central, yet phenomenologically alien.
  *   **Not Simple Relativism ("Different things please different people"):** This is true but superficial. The deeper problem is that *for one person*, "pleasure" applies to experiences so fundamentally different in kind (sensual, aesthetic, malicious, relief-based) that calling them the same *feeling* seems nonsensical, yet the word persists.
  *   **Not Just a Catch-All ("Whatever we pursue"):** This reduces pleasure to conation (wanting). But we also use "pleasure" to report a *feeling* (hedonia), and we recognize that people sometimes pursue things they *don't* feel pleasure in (your reluctant addict). Pleasure as a catch-all *fails* to capture the hedonic aspect we also mean by the word.

  ### The Strongest Candidate & Its Boundaries
  The strongest candidate for unity is **Positive Valence as Satisfied Pro-Attitude.** This means:
  *   **Inside:** Any state where an inclination, desire, need, or drive is being fulfilled, attended by an absence of felt aversion *towards that fulfillment in that moment*, and which can function as a reason for action or persistence. This encompasses *all* your examples.
  *   **Outside:**
      *   Mere wanting *without* fulfillment (craving the drug but not getting it).
      *   Fulfillment *without* any prior inclination or need (accidentally stumbling upon a beautiful view you never sought might cause joy, but if you had *no* latent pro-attitude towards beauty, it might be startling, not pleasurable in the reason-giving sense).
      *   States of pure, objectless contentment (if such exist) might be "pleasant" but lack the structure of satisfying a specific pro-attitude.
      *   Painful duties performed *with* active aversion, purely out of obligation, yielding no satisfaction *in the act itself*. (The fulfillment of the *duty* might come later, as a separate pleasure of accomplishment).

  ### Invented Concepts for Your Novelist's Toolkit
  Since existing terms feel partial, let’s forge two:
  1.  **Pleasure-Pluralism:** The thesis that what we call "pleasures" constitute a plurality of distinct experiential and motivational states, unified only by their functional role as markers of satisfied pro-attitudes, not by any common phenomenological essence. This names your first difficulty explicitly.
  2.  **The Conative-Hedonic Fissure:** The inherent and often unacknowledged gap between the motivational force of desire ("wanting") and the conscious experience of enjoyment ("liking"), which the single word "pleasure" uneasily straddles. This names your second difficulty and its link to the first.

  ### Why This Matters for Your Characters
  Pleasure-pluralism liberates you. The ascetic finding grim satisfaction in self-denial, the artist wracked by the process but compelled by the rare click of a perfect phrase, the vengeful character savoring a rival's fall – these are not contradictions. They are distinct species within the ecosystem of "taking pleasure." The conative-hedonic fissure gives you the reluctant addict, not as an anomaly, but as an exemplar of how wanting can persist long after liking fades, or how one can "take pleasure" in something through the sheer drive of it, even while hating the feeling. You don't need to resolve whether they "like" it or "merely" want it. The power lies in depicting the fissure itself – the space where the word strains, and the human complexity bleeds through.

  The word "pleasure" endures not because it points to a single thing, but because it marks a crucial junction: the point where our drives meet their satisfaction, however varied the landscape of that meeting may be. Your task isn't to find the core, but to map the territories.
