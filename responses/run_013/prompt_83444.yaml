  First, I need to unpack their core frustration: they see two incompatible principles coexisting in international law. On one hand, self-determination is proclaimed as a universal right; on the other, non-colonial secession requires state consent. They've noticed patterns like uti possidetis (maintaining colonial borders) and internal autonomy being treated as sufficient self-determination.

  The user's analysis is impressively nuanced. They've identified key cases (Scotland, Catalonia, Quebec) and legal doctrines. Their deeper questions reveal they're not just seeking definitions but want to understand the underlying logic - or lack thereof. They suspect the practice might be an unstable compromise between statist and liberal theories.

  Hmm, their questions cluster into several layers:
  - The definition of "people" (territorial vs cultural)
  - Theories of territorial entitlement (property-like vs fiduciary)
  - Whether self-determination is a one-time remedy or ongoing right
  - Which competing theories the practice actually excludes

  The colonial/non-colonial distinction seems particularly troubling to them. They're right that international law never explicitly states colonial rule was uniquely illegitimate - that would be awkward to articulate. The practice implies a hierarchy of wrongs where only overseas empire justifies unilateral secession.

  When reconstructing the implicit theory, I should emphasize its territorial basis. The "self" is defined by existing administrative units, not cultural nations. This avoids endless fragmentation but creates the contradictions the user noticed. The fiduciary element is crucial too - self-determination becomes a remedy for "betrayal" rather than an absolute right.

  The user's sharpest insight is asking what the practice rules out versus merely tolerates. The current system definitely excludes two clean theories: 1) that majorities can always secede by consent alone, and 2) that cultural nations inherently deserve states. But it doesn't firmly choose between statist and liberal views - hence the Quebec reference case's compromise position.

  If we switched to pure consent theory, every regional majority could trigger secession votes, potentially causing chaos. Pure statism would mean even colonies couldn't secede unilaterally - which contradicts decolonization practice. The current messy compromise exists because both extremes are unpalatable.

  I should acknowledge that the user has put their finger on a genuine tension. International law here isn't philosophically coherent but pragmatically cobbled together. The colonial exception remains awkward because it can't articulate why overseas empire was uniquely wrong without implicating other domination forms.
answer: |-
  You've articulated the central tension in international secession law with remarkable clarity. The practice *does* deny both the pure "plebiscitary" (consent-by-vote) and "ethnonational" (nationhood-by-culture) theories. Let's reconstruct the implicit theory underpinning state practice and jurisprudence:

  **The Implicit Theory: Remedial Territorial Integrity**

  1.  **Who is the "Self"? The Territorial People of the Existing Unit:**
      *   The primary "self" entitled to self-determination is defined by the **existing territorial unit** recognized by international law (usually the state itself, or a colonial administrative unit).
      *   This "people" is fundamentally territorial and political, *not* primarily cultural, linguistic, or ethnic. Membership is defined by citizenship/residence within the established boundaries.
      *   **Presupposition:** Stable international order requires fixed territorial units. Defining "peoples" ethnoculturally is infinitely fractious and destabilizing. Uti possidetis formalizes this, freezing colonial boundaries as the baseline units for self-determination.

  2.  **The Nature of the Right: Remedial & Primarily Internal:**
      *   Self-determination is **not primarily an inherent right to independent statehood.** It is first and foremost a right to **internal self-determination** within the existing state framework.
      *   This includes: meaningful participation in government, democratic rights, respect for identity/culture, autonomy arrangements, and non-discrimination. Voting in state elections *is* a core manifestation of internal self-determination.
      *   **External self-determination** (independent statehood or freely chosen association) is the **exception**, not the rule. It arises remedially when internal self-determination is **permanently and fundamentally denied** ("safeguard clause").

  3.  **The Theory of Territory: Fiduciary with Statist Entrenchment:**
      *   The state holds the territory in a **fiduciary capacity** for its population ("the people" defined territorially). Its legitimacy derives from securing the rights and well-being of *that entire* people within *those* borders.
      *   However, this fiduciary duty is **heavily mediated by state sovereignty.** The state is presumed legitimate and entitled to territorial integrity *unless* it commits a fundamental betrayal of its fiduciary duty to the *entire* territorial people.
      *   **Presupposition:** Secession inherently threatens international stability. The burden of proof lies entirely on those seeking to break the territorial unit. The "owner" analogy is inaccurate; it's more like a constitutionally entrenched trustee relationship difficult to dissolve.

  4.  **The Colonial Exception: Remedial, Not Inherent:**
      *   Colonialism was treated as a **unique, egregious, and inherently illegitimate** violation of the fiduciary duty. Foreign domination denied the territorial people *any* meaningful internal self-determination. Thus, unilateral secession was the necessary remedy.
      *   **This *is* a one-time remedy for a specific historical wrong.** The practice *cannot* comfortably articulate this principle without embarrassment because:
          *   It implicitly admits other forms of severe oppression (e.g., apartheid, genocide) *could* theoretically justify secession, but avoids defining clear thresholds (except arguably genocide/ethnic cleansing creating new facts on the ground, like Kosovo).
          *   It risks highlighting the hypocrisy of denying similar remedies to non-colonial groups facing severe internal oppression.
          *   It relies on the formal distinction of "saltwater colonialism" (overseas) versus internal domination, which often feels arbitrary (e.g., Russian internal republics vs. former Soviet republics).
      *   **Result:** Colonialism becomes a legal "magic key" unlocking unilateral secession, while other grievances generally do not, regardless of severity, because internal remedies are presumed possible within the existing state.

  5.  **Discharging the Right: Primarily Internal & Once-Per-Unit:**
      *   A "people" (the territorial unit) exercises its self-determination primarily through **internal governance arrangements** within the state. A functioning democracy respecting minority rights is often deemed sufficient discharge.
      *   **The right *can* be discharged "once" for the unit:** When the territorial unit achieves independence (decolonization) or establishes a legitimate internal order, the collective right to *external* self-determination for that unit is generally considered "spent." Subsequent secession movements within that unit are *not* new "peoples" exercising a primary right; they are internal groups seeking to fracture the established unit, facing the high remedial bar.
      *   **Presupposition:** Permanent instability would result if secession were an ever-present option. The initial exercise (independence or internal settlement) sets the baseline unit.

  **Rival Views: What the Practice Rules Out vs. What it Accommodates**

  *   **Rules Out:**
      *   **Plebiscitary Secession (Pure Consent):** The practice explicitly rejects that a simple majority vote in a subunit *by itself* creates a legal right to secede (Catalonia, Quebec Reference). Consent of the governed is satisfied internally; fracturing the unit requires more.
      *   **Ethnonational Secession (Primacy of Culture):** The practice explicitly rejects that a distinct ethnic, linguistic, or cultural nation *inherently* has the right to its own state, irrespective of territory or state consent (e.g., Kurdish claims, Basque claims pre-ETA cessation).
      *   **Statist Absolutism (No Secession Ever):** The practice *does* recognize unilateral secession in the colonial context and arguably in extreme cases like Kosovo (de facto, not de jure). State consent is not *always* required.

  *   **Accommodates/Is Underdetermined By:**
      *   **Remedial Right Only:** The practice *is* consistent with the view that external self-determination is *only* available as a last resort for extreme oppression within the existing state (beyond colonialism). It just sets the remedial bar *extremely* high for non-colonial cases.
      *   **Negotiated Secession (Quebec Reference Compromise):** The practice *permits* (and the Quebec Reference *encourages*) secession via negotiation and constitutional amendment (state consent). This fits within the statist framework but injects a (weak) democratic obligation.
      *   **Internal Autonomy as Fulfillment:** The practice is consistent with the view that robust internal autonomy arrangements satisfy self-determination for substate groups.

  **The Coherence Question: Unstable Compromise**

  The practice is **not** perfectly coherent. It's an **unstable compromise** primarily between:

  1.  **Statist Imperative (Order):** The overwhelming need for stability, predictability, and prevention of endless fragmentation. Sovereignty and territorial integrity are foundational norms.
  2.  **Liberal/Legitimacy Imperative (Justice):** The need to account for legitimacy derived from the people and to remedy egregious injustice, crystallized in the anti-colonial movement.

  The colonial exception is the major sticking point. It *is* embarrassing because it relies on a specific historical category of wrong (overseas colonialism) as uniquely justifying fracture, while functionally denying the same remedy for potentially comparable internal wrongs committed by post-colonial states. It papers over this with the "saltwater" distinction and the focus on *initial* territorial units.

  **Concrete Changes Under Rival Clean Views:**

  *   **Pure Plebiscitary (Consent) View:**
      *   **Changes:** Catalonia's 2017 vote (if deemed free/fair) *would* have triggered a legal obligation for Spain to negotiate secession. Scotland could vote whenever its parliament chose (subject to basic fairness). Quebec could hold a binding vote unilaterally. Kosovo's independence would be uncontroversial. Substate groups (e.g., Bavarians, Texans) could trigger processes based on regional votes.
      *   **Losses:** Predictability, territorial stability. Increased incentives for majorities to oppress minorities in regions contemplating secession. Potential for cascading fragmentation. Uti possidetis loses force.
      *   **Gains:** Consistency with democratic principles. Removes the colonial hypocrisy.

  *   **Pure Statist (No Secession Right) View:**
      *   **Changes:** Decolonization would *not* have been a legal right; it would have required metropolitan state consent (e.g., France agreeing to Algerian independence). Kosovo's independence would be unequivocally illegal. Quebec Reference's "duty to negotiate" vanishes. Catalonia's vote is not just void but irrelevant legally. Internal autonomy is purely a domestic gift, not an international right.
      *   **Losses:** Any international legal basis for resisting severe internal oppression short of genocide. Legitimacy deficit when states brutally suppress secessionist movements. Contradicts the core anti-colonial foundation of modern international law.
      *   **Gains:** Maximum stability and predictability. Clear, simple rule.

  **Conclusion:**

  The implicit theory is "Remedial Territorial Integrity": Self-determination belongs primarily to the territorial people of the existing unit and is fulfilled internally. External selfcession is a last-resort remedy only available when internal self-determination is utterly impossible, primarily exemplified by (and functionally limited to) the unique historical wrong of classic colonialism. This creates an unstable system prioritizing order over consistency, where the colonial exception remains a necessary but awkward anomaly. The Quebec Reference represents the high-water mark of injecting legitimacy concerns into the statist framework, but it still firmly rejects unilateralism. The practice rules out clean ethnonational or plebiscitary theories but remains underdetermined between a strict remedial view and a slightly softened statist view accommodating negotiated secession. Its coherence is pragmatic, not philosophical.
