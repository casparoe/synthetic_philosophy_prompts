  About their proposed solution... clever! But I suspect they're missing Schellenberg's knockout punch: the "non-resistant non-believer." If God's love requires relationship, and some genuinely open people still get crickets, that's the core issue. Their solution accidentally highlights how *unloving* selective revelation looks—like God playing favorites while others starve spiritually. 

  I notice they're explicitly rejecting academic formatting ("no headings/bullets"), which tells me they've probably been drowning in overly technical philosophy. They want human-to-human explanation. Also worth noting their hypothetical about people who "never even heard the idea"—that's a real concern they're carrying beyond abstract argument. 

