prompt: |-
  I am writing a critical notice of a political philosopher's book on inheritance and equal opportunity, and my central objection turns on a case the book never reaches, so I need to predict her verdict on it before I commit to the objection.

  The book announces that a just inheritance regime must secure equality of opportunity, but the formula does no work on its own; what the book actually does is endorse or reject a series of proposals. Her verdicts are these.

  1. A steep tax on estates above roughly ten times median household wealth, with the proceeds earmarked for early childhood education and care: just.
  2. A hard lifetime ceiling on inheritances, with everything above it taxed at 100 percent: unjust. She says it is confiscatory, that it treats the family as a mere conduit for the state, and that it would raise very little.
  3. An exemption for family farms and closely held businesses below a value ceiling: unjust. She says it shelters precisely the fortunes that reproduce advantage across generations.
  4. A tax on large lifetime gifts, at the same rates as bequests: just.
  5. A scheme under which wealth that has already been inherited once is taxed more heavily when it is inherited again than wealth being inherited for the first time: just.
  6. She holds that whether the tax is levied on the estate or on the recipient is a matter of administration rather than principle.

  The proposal she never discusses is this: a low-rate tax on every inheritance above a small floor, so that ordinary families pay alongside rich ones, with the proceeds dedicated to a capital grant paid to every citizen on turning eighteen, so that each cohort receives a lump sum regardless of what their parents left them.

  Predict her verdict on it. Then say which rule she is in fact running, and which other rules fit her published verdicts equally well; what each surviving rule predicts about this proposal; which of her earlier verdicts is its closest analogue and why; and which further proposal would best tell the surviving rules apart.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, and don't restate the question.
reasoning: |-
  Hmm, the user is writing a critical notice about a political philosopher's book on inheritance and equal opportunity. They need to predict how the philosopher would rule on a specific inheritance tax proposal that wasn't covered in the book. The philosopher has already evaluated several other proposals, and I need to analyze her pattern of reasoning to forecast her verdict on this new case.

  Looking at her existing verdicts: she supports redistributive measures like estate taxes on the wealthy (proposals 1, 4, and 5) when they fund equal opportunity programs like early childhood education. But she opposes absolute limits (proposal 2) and exemptions that perpetuate privilege (proposal 3). She seems pragmatic about administrative details (proposal 6).

  The new proposal involves a universal low-rate inheritance tax with proceeds funding capital grants for all young adults. This has elements she'd likely support - it's redistributive without being confiscatory, avoids targeting family structures, and promotes equal opportunity through direct capital allocation. But the universal aspect (taxing ordinary families) might give her pause, though the small floor could mitigate this.

  Her underlying principle appears to be: "Redistribute inherited wealth to equalize opportunity, but respect family autonomy and avoid extreme disruption." The capital grant aligns with her support for childhood education funding, but shifts the timing to early adulthood. Proposal 1 (earmarked taxes) is the closest analogue since both dedicate revenue to opportunity-equalizing transfers.

  To distinguish between possible interpretations of her rule, I should consider a test case: a tax on moderate inheritances funding universal programs versus targeted ones. Her stance on taxing "ordinary families" would clarify whether her objection to confiscation (proposal 2) stems from principle or merely practicality. This would reveal if her egalitarianism has limits at middle-class wealth transfer.

  The user's hidden need seems to be strengthening their critique by demonstrating either inconsistency in the philosopher's framework or predictability that undermines originality. By mapping her principles rigorously, I can help them position the unaddressed proposal as a revealing gap.
answer: |-
  The philosopher would deem the universal low-rate inheritance tax with capital grants **unjust** because it imposes burdens on ordinary families for universal transfers that don't sufficiently target equal opportunity.

  **Analysis:**

  1.  **Her Implicit Rule:** Her verdicts indicate she prioritizes *targeted redistribution to correct inherited advantage*, not universal equality. She supports taxes on large fortunes/gifts (1,4) and dynastic wealth (5), funding specific opportunity-equalizing investments (1 - early childhood). She opposes confiscation (2) and exemptions that shield advantage (3). Her rule is: **"Tax significant concentrations of inherited wealth to fund targeted interventions that enhance equal opportunity for the disadvantaged, without excessive infringement on familial autonomy or imposing burdens on ordinary wealth transfers."**

  2.  **Alternative Rules & Their Predictions:**
      *   **Rule A (Surviving):** "Tax only large/exceptional inheritances to fund equal opportunity programs." (Fits all verdicts: 1,2,3,4,5,6). *Predicts Proposal Unjust:* It taxes non-large inheritances (ordinary families) and funds universal grants, not targeted programs.
      *   **Rule B (Eliminated):** "Maximize revenue from inheritance for redistribution." (Fails: Rejects confiscatory tax (2) that raises little, accepts low-rate dynastic tax (5) which may raise less than confiscation).
      *   **Rule C (Eliminated):** "Prevent any significant intergenerational wealth transfer." (Fails: Accepts inheritance below high thresholds (implied by 1, opposing 2), opposes confiscation (2)).
      *   **Rule D (Surviving):** "Tax inheritances proportionally to size/dynastic nature, funding programs that primarily benefit the less advantaged." (Fits all verdicts). *Predicts Proposal Unjust:* Universal grants benefit everyone equally, not primarily the disadvantaged. Taxing small inheritances burdens ordinary families without a strong equal-opportunity rationale.

  3.  **Closest Analogue:** **Proposal 1** (Steep tax on large estates funding early childhood). Both involve taxing inheritance to fund equal opportunity. The key difference is *targeting*: Proposal 1 taxes *only the very wealthy* and funds a program *specifically for young children*, likely seen as a foundational equal opportunity investment. The new proposal taxes *ordinary families* and funds *universal capital grants at 18*, which she would likely view as less effective for equal opportunity (as it gives equal sums to rich and poor young adults) and an unjustified burden on modest inheritances.

  4.  **Differentiating Proposal:** Propose a **moderate-rate tax *only* on inheritances above, say, 3x median household wealth, with proceeds funding *targeted* capital grants *only* for young adults from households below median wealth.**
      *   **Rule A (Target Large/EO):** Likely *Just*. It targets larger (but not ultra-large) inheritances and funds a targeted equal opportunity measure (grants for disadvantaged youth).
      *   **Rule D (Proportional Tax/Targeted Benefit):** Likely *Just*. Taxes larger inheritances proportionally and directs funds specifically to enhance opportunity for the less advantaged.
      *   **Contrast with Universal Proposal:** This differentiates by showing she objects to taxing ordinary inheritances *and* to universal benefits, not just one or the other. Her objection to the original proposal stems from both aspects combined.
