answer: |-
  **Q&A Prep Sheet: Defending Expected-Value Fanaticism**

  **1. Objection (Economist - Axiomatic):** "Your fanaticism directly violates the Archimedean/Continuity axiom present in virtually all representation theorems for EU. Without such an axiom, we lose the ability to represent preferences by *any* real-valued utility function. Isn't this foundational?"  
  *Reply:* Precisely. Fanaticism *requires* dropping continuity. The point is that continuity smuggles in threshold parochialism – the assumption that utility differences must be bounded relative to probability scaling. My rescaling argument shows why this boundedness is arbitrary.  
  *Soft Spot:* Concedes the incompatibility with standard EU representation. Must argue this is a *feature*, exposing an unjustified axiom, not a bug.  

  **2. Objection (Economist - St. Petersburg):** "The St. Petersburg paradox already shows expected utility maximization with unbounded utility leads to absurdities when faced with infinite expected value. Your fanaticism exacerbates this, demanding we pay any finite cost for a *vanishing* chance of vast gain. Isn't this practically incoherent?"  
  *Reply:* St. Petersburg highlights the *mathematical* issue of infinite EV, not fanaticism per se. Fanaticism applies where EV is finite but vast. The 'absurdity' stems from ignoring *resource constraints* (bankruptcy bounds) or *implementation limits* (no agent can literally offer the St. Petersburg bet), not fanaticism itself. Below true infinity, my rescaling applies.  
  *Concede Up Front:* Practical agents face resource/implementation limits capping *feasible* gambles. Fanaticism is a *normative* principle about value comparisons under idealized uncertainty.  

  **3. Objection (Philosopher - Reductio):** "This *is* the reductio! If fanaticism demands I should accept a 1/3^^^3 chance of a dust speck in my eye to avoid the certainty of *unimaginable* agony for everyone else, consequentialism becomes morally monstrous."  
  *Reply:* The 'monstrous' intuition relies on threshold parochialism. My rescaling: if you agree a 50% chance of saving X lives outweighs saving 1 life, scaling X sufficiently (just below your agony threshold) forces consistency. What *moral* principle justifies the threshold, not just intuition?  
  *Soft Spot:* Deeply clashes with strong moral intuitions. Requires insisting intuitions about extreme stakes are unreliable/parochial.  

  **4. Objection (Economist - Risk Aversion):** "This ignores robust empirical evidence of risk aversion, especially over large stakes. Fanaticism prescribes extreme risk-*seeking* behavior for tiny probabilities of huge gains, contradicting observed behavior (e.g., lottery play notwithstanding)."  
  *Reply:* Fanaticism is a *normative* claim about rational valuation, not descriptive. Observed risk aversion often reflects: (1) Misperception of tiny probabilities, (2) Non-linear utility of wealth (e.g., diminishing marginal utility), (3) Contextual framing. My argument concerns the structure of value under idealized uncertainty.  
  *Concede Up Front:* Descriptive models often need curvature (risk aversion). Fanaticism challenges if this curvature should apply *indefinitely* across all scales of value difference.  

  **5. Objection (Economist - Decision Rule):** "Without a threshold, how do you *operationalize* this? Any decision rule based solely on EU maximization with unbounded utility becomes computationally and practically intractable for complex choices involving tiny probabilities of massive stakes."  
  *Reply:* Correct. Fanaticism is a limiting principle for pairwise choice under uncertainty, not a complete decision procedure for complex reality. It tells us that *if* we accept EU as the core norm, we must bite the bullet on rescaling. Practical agents need heuristics (satisficing, ignoring negligibly probable outcomes), but these are concessions to limits, not refutations of the value comparison.  
  *Concede Up Front:* Full EU maximization with fanaticism is computationally infeasible. Requires practical approximations.  

  **6. Objection (Economist - Instrumental Rationality):** "Agents have finite computational resources and time. Ignoring outcomes below some probability threshold *is* instrumentally rational – the cost of calculating/considering them outweighs the potential benefit. Doesn't this justify a practical threshold?"  
  *Reply:* Absolutely. But this is a *pragmatic* justification based on decision *costs*, not a claim about the underlying *value* comparison. It doesn't show that the tiny probability *shouldn't* outweigh the small certainty *if* the calculation cost were zero. Fanaticism concerns the value relation itself, absent computational friction.  
  *Concede Up Front:* Rational agents must use thresholds/bounds as computational shortcuts.  

  **7. Objection (Philosopher - Comparability):** "Your argument assumes goods are *always* commensurable on a single cardinal scale. But for vastly different *kinds* of value (e.g., aesthetic vs. survival goods), or at extreme scales, comparability might break down, making your rescaling inapplicable."  
  *Reply:* Fanaticism assumes comparability for the specific goods in question. If two goods are deemed comparable enough to ask "which is better?", then rescaling applies. If they are truly incommensurable, then *no* probability trade-off makes sense, undermining the initial anti-fanatic threshold claim too.  
  *Soft Spot:* Relies on the premise of comparability. Must argue comparability holds for the finite goods typically debated in these dilemmas.  

  **8. Objection (The One I Hope Nobody Asks - Infinite Ethics Philosopher):** "If fanaticism holds for finite goods, doesn't it collapse when facing *infinite* goods? A certainty of any finite good, no matter how large, would be outweighed by *any* non-zero probability of an infinite good, making all finite stakes irrelevant. Isn't this an even worse reductio, paralyzing action in a finite world?"  
  *Reply:* (Gulp) This is a profound challenge bridging finite and infinite ethics. My defense focuses *only* on trade-offs between *finite* goods. Introducing infinite goods fundamentally changes the framework and requires separate, highly contested treatment (e.g., aggregative problems). Fanaticism for finite goods doesn't *entail* a specific rule for infinite-finite trade-offs. We must quarantine that issue.  
  *Soft Spot:* Extremely damaging if pressed. Concedes fanaticism might create intractable problems when infinities are possible. Requires strict scope limitation to finite-vs-finite comparisons. *Priority:* Deflect quickly if possible, concede scope limitation.
