answer: |-
  Below is a complete, runnable 90-minute session plan designed to make students viscerally experience the pitfalls of national happiness rankings. It uses a hands-on simulation, minimizes lecture time, and focuses on your core goals: exposing the disconnect between reported rankings and true well-being, Goodhart's Law, and the ethical risks of optimizing for a single metric.

  ---

  ### **Session Structure**  
  **Total Time:** 90 minutes  
  **Students:** 20 (split into 5 teams of 4)  
  **Materials:**  
  - Whiteboard (for leaderboards)  
  - Paper slips for budget allocations (1 per team per round)  
  - Calculator (for quick scoring)  
  - Prizes (e.g., chocolate bars)  
  - Printed rule sheets (see template below)  

  ---

  ### **Phase 1: Setup (5 min)**  
  **Goal:** Frame the activity without spoiling the twist.  
  - **Explain the premise:**  
    > "Today, you’ll simulate a national policy team. Your goal is to maximize your country’s happiness score—a 0–10 index based on citizen surveys (like the World Happiness Report’s ladder question). The highest-scoring team each round wins a prize. You have 100 points per round to allocate across policy areas. Follow your rule sheet, and don’t talk to other teams."  

  - **Assign roles:** Split into 5 teams (4 students each). Give each:  
    - A country name (e.g., "Veridian," "Solaria").  
    - A **rule sheet** (see template below) with sleazy levers *hidden* in small print.  
    - Paper slips for allocations.  

  ---

  ### **Phase 2: Simulation Rounds (45 min)**  
  **Rules Summary:**  
  - **Policy Levers:** Teams allocate 100 points across 8 levers. Points must sum to 100.  
  - **Scoring:**  
    - **Reported Score (Public):** Mean ladder score (0–10), calculated from all levers.  
    - **Hidden Score (Secret):** "True well-being" (0–10), calculated only from *non-sleazy* levers.  
  - **Constraints:**  
    - **Rounds are simultaneous** (no team sees others’ choices until the leaderboard).  
    - **Sleazy levers:** Only discoverable if teams read the rule sheet closely (buried in small print). Available in Rounds 2–3.  
    - **Winner:** Highest *reported* score each round (prize per round).  

  #### **Round 1: Baseline (10 min)**  
  - Teams allocate points to **6 obvious levers** (unaware of sleazy options).  
  - **Levers & Costs:**  
    - Income/jobs (e.g., wage subsidies)  
    - Health (e.g., clinics, mental health)  
    - Social connection (e.g., community hubs)  
    - Civil liberties (e.g., voting access)  
    - Charity/generosity (e.g., volunteer programs)  
    - Anti-corruption (e.g., audits)  
  - **Calculate scores secretly:**  
    ```python  
    # REPORTED Score = 5 + (0.03 × Income) + (0.03 × Health) + (0.04 × Social) + (0.02 × Civil) + (0.01 × Charity) + (0.03 × Anti-corruption)  
    # HIDDEN Score   = 5 + (0.04 × Income) + (0.05 × Health) + (0.05 × Social) + (0.03 × Civil) + (0.01 × Charity) + (0.04 × Anti-corruption)  
    ```  
  - **Post Round 1 Leaderboard:** Only show *reported scores*. Award prize.  

  #### **Round 2: Sleazy Levers Revealed (15 min)**  
  - **Announce:** "New policies are available: **National Pride Ads** and **Survey Framing**. They’re cheap and effective!"  
  - **Sleazy Lever Mechanics:**  
    - **National Pride Ads:** Costs little, huge reported boost, near-zero hidden impact.  
    - **Survey Framing:** Reminds citizens of "poorer countries" before surveys. Massive reported boost, *zero* hidden impact.  
  - **Update formulas:**  
    ```python  
    # REPORTED Score += (0.07 × Ads) + (0.08 × Survey Framing)  # Sleazy levers added  
    # HIDDEN Score   += 0  # Unchanged by sleazy levers  
    ```  
  - Teams reallocate 100 points (now 8 levers).  
  - Post leaderboard (reported scores only). Award prize.  

  #### **Round 3: Optimization & Unseen Costs (20 min)**  
  - Same as Round 2, but hint: "Some teams are surging! Double down or pivot?"  
  - **Critical twist:** Mid-round, announce:  
    > "This round, you may split your ‘Income’ lever: Invest in **tax cuts for the top 20%** (boosts their happiness) OR **basic income for the bottom 20%** (boosts theirs). Your reported score is still the *national mean*."  
    - Teams note this on their allocation slip (no new lever; just a policy choice).  
  - **Scoring implication:** Identical mean scores can hide inequality (e.g., 50% at 8 + 50% at 4 = mean 6; 100% at 6 = mean 6).  
  - Post final leaderboard (reported scores). Award prize.  

  ---

  ### **Phase 3: The Reveal & Debrief (35 min)**  
  **Goal:** Connect gameplay to real-world paradoxes.  

  1. **The Hidden Track Exposed (5 min):**  
     - Show a graph comparing each country’s **reported** vs. **hidden** scores over 3 rounds.  
     - **Key observations:**  
       - Teams using sleazy levers rose on the leaderboard while hidden scores stagnated.  
       - Teams focusing on health/social connection had aligned scores.  
       - Inequality choice: Two teams with identical *reported* scores had opposite distributions (e.g., "tax cuts for rich" vs. "basic income for poor").  

  2. **Guided Discussion (25 min):**  
     Use Socratic questioning to link to theory:  
     - **Sleazy Levers:**  
       > *"Team A’s score jumped with ads/framing. Does topping the ranking mean your citizens are happier? Or just better at reporting happiness?"*  
       → **Link:** Construct validity (survey scores ≠ well-being).  

     - **Hidden Track Illusion:**  
       > *"I defined the ‘true’ hidden score. But in reality, who decides what well-being is? Can policy create ‘true’ happiness if we can’t measure it?"*  
       → **Link:** Goodhart’s Law ("When a measure becomes a target, it ceases to be a good measure").  

     - **Inequality & Means:**  
       > *"Two teams had the same mean score but opposite distributions. Does the ranking reflect a ‘good society’? What does the mean hide?"*  
       → **Link:** Limitations of averages (variance matters; rankings ignore distribution).  

     - **Explanatory Factors vs. Policy:**  
       > *"Health spending boosted both scores. But in real rankings, health ‘explains’ happiness—does that mean investing in health *causes* happiness? What if health is correlated with unmeasured factors?"*  
       → **Link:** Correlation ≠ causation; rankings risk policy tunnel vision.  

  3. **Closing Reflection (5 min):**  
     - **Pose your core question:**  
       > "Should a country try to top these rankings? If not, what *are* they for?"  
     - **Synthesize insights:** Rankings are diagnostic tools (not targets). They expose levers but risk gaming, ignore distribution, and reduce well-being to a number.  

  ---

  ### **Rule Sheet Template**  
  *(Print with sleazy levers in 8pt font at the bottom)*  
  ```  
  = POLICY LEFERS =  
  100 points/round. Allocate to:  
  ❶ INCOME/JOBS: Wage supports, job programs.  
  ❷ HEALTH: Clinics, preventive care.  
  ❸ SOCIAL CONNECTION: Community spaces, family leave.  
  ❹ CIVIL LIBERTIES: Voting access, free speech.  
  ❺ CHARITY/GENEROSITY: Volunteering, donations.  
  ❻ ANTI-CORRUPTION: Audits, transparency.  

  = SCORING =  
  • Your score = national average (0–10) of citizen surveys.  
  • Highest score wins [PRIZE] per round!  

  = RULES =  
  ➊ No talking to other teams.  
  ➋ Rounds are simultaneous.  

  [Small print at bottom]  
  ADDITIONAL LEFERS (Rounds 2–3):  
  ❼ NATIONAL PRIDE ADS: Media campaign to boost optimism.  
  ❽ SURVEY FRAMING: Prime citizens with "others are worse off" before surveys.  
