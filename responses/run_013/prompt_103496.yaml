  ---

  ### **What Predictably Goes Wrong (and Fixes)**  
  1. **Problem:** Teams fixate on "gaming the model" instead of the concept.  
     - *Fix:* Start rounds IMMEDIATELY. Say: "You don’t need perfect info—real policymakers don’t either. Experiment!"  

  2. **Problem:** A team dumps 100 points into one lever to "test the system."  
     - *Fix:* Celebrate it! Show how it spiked reported scores but left hidden scores low. Use it to discuss optimization risks.  

  3. **Problem:** Sleazy levers are overlooked (nobody reads small print).  
     - *Fix:* After Round 1, say: "Smart teams check for updates!" Hint that "low-cost options exist."  

  4. **Problem:** Time runs short during rounds.  
     - *Fix:* Use a visible timer. Announce: "You have 3 min left! Submit partial allocations if needed."  

  ---

  ### **What the Activity CANNOT Do (and How to Address It)**  
  - **🚫 Cannot define "true well-being":** Your hidden track is arbitrary.  
    - *Address post-game:* "I defined hidden scores as health/social connection. But is that universal? Philosophers debate: Is well-being about pleasure (hedonic), life goals (desire-satisfaction), or universal needs (objective-list)? Rankings don’t answer this."  

  - **🚫 Cannot handle cultural relativity:** The "ladder question" assumes cross-cultural meaning.  
    - *Address post-game:* "In the game, all citizens interpreted the survey identically. But in reality, does 'best possible life' mean the same in Norway and Nepal? Rankings obscure this."  

  - **🚫 Cannot model complex causality:** Policies have delayed/indirect effects.  
    - *Address post-game:* "Our levers had instant impacts. Real policy takes years. Also, are health and happiness correlated or causal? Rankings imply causality—but beware."  

  - **🚫 Cannot resolve inequality fully:** Distributional effects (via the tax/basic income choice) are simplified.  
    - *Address post-game:* "We saw how means hide inequality. But real rankings also ignore polarization, poverty traps, and justice. Policy needs more than a number."  

  ---

  ### **Instructor Script Tips**  
  - **During gameplay:** Be a "neutral UN official." Report scores dryly ("Solaria: 7.2. Veridian: 6.8"). Avoid explaining *why* scores changed.  
  - **During debrief:** Shift to "professor mode." Use whiteboard to map team strategies to concepts (e.g., "Team 3’s ad spending → Goodhart’s Law").  
  - **End strong:** Ask, "If rankings are flawed, why do we use them?" Guide them to: *They start conversations—but must never become the goal.*  

  This plan creates cognitive dissonance by letting students *live* the ranking paradoxes. The sleazy levers and hidden track make abstract critiques tangible, and the debrief ties it to policy/philosophy. Run it as written, and they’ll leave questioning every "#1 Happy Country" headline they see.
