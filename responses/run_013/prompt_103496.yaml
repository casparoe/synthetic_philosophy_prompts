     How to calculate effects? We need a simple formula for each lever on both reported and hidden. Let's assign weights:

     For Reported Score (the public one):
     - Each point in Income and Jobs: +0.03 per point (so 100 points would give +3, but note they have 100 points to split so they won't put all in one)
