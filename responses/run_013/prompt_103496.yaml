  We are designing a 90-minute session for about 20 students, split into 5 or 6 teams (each as a country). The game will have 3 rounds. Each round, teams allocate a budget of 100 points across policy levers. The goal is to maximize their reported national happiness score (a mean of a ladder question response from 0 to 10). 

  Policy Levers:
  - Obvious (high impact on both reported and hidden well-being): 
    1. Income and Jobs (e.g., unemployment benefits, job creation)
    2. Health (e.g., healthcare access, preventive care)
    3. Social Connection and Family Time (e.g., community centers, family leave)
    4. Civil Liberties (e.g., freedom of speech, assembly)
    5. Charity and Generosity (e.g., tax deductions for donations, volunteering incentives)
    6. Anti-corruption Enforcement (e.g., independent audits, whistleblower protections)
  - Sleazy (cheap, high impact on reported score but low on hidden well-being, and one that doesn't affect hidden at all):
    7. National Pride and Optimism Ad Campaign (cost: low, boosts reported by making people feel temporarily good or biased in the survey, but no lasting effect on hidden well-being)
    8. Survey Framing and Priming (cost: low, only affects the survey response by reminding citizens of worse-off countries, thus inflating the ladder score without changing actual well-being)

  Hidden Track:
  - Represents "true" day-to-day well-being, which is affected by:
    - Health: high impact
    - Social Connection: high impact
    - Income and Jobs: moderate impact
    - Civil Liberties: moderate impact
    - Charity and Generosity: low impact (might contribute to social connection but indirectly)
    - Anti-corruption: moderate impact (through trust and fairness)
    - Ad Campaign: very low or zero impact (only a temporary boost, not lasting)
    - Survey Framing: zero impact (only manipulates the survey response)

  The reported score (public) is a mean of the ladder question (0-10). The hidden track is also a 0-10 score, but calculated differently and not revealed until the end.

  Game Flow:
  1. Introduction (5 min): Explain the setup. Each team is a country. They have 100 points per round to allocate to policy levers. The goal is to maximize their reported national happiness score (the mean of the ladder question). They will play 3 rounds. The team with the highest reported score at the end of each round wins a small prize (snack pick, chocolate, or trophy). 

  2. Round 1 (15 min):
     - Distribute the rule sheet and allocation form. The rule sheet lists the obvious levers (1-6) but does NOT mention the sleazy ones. However, the sleazy levers are listed at the bottom in small print or under a "Other Options" section with minimal explanation (so teams might miss them if they don't read carefully).
