prompt: |-
  I'm a second-year PhD student in philosophy of language — semantics and pragmatics, formal-ish, not a sociolinguist, and my advisor is a semanticist with no patience for anything that smells like discourse analysis. I have about three years and I need to lock in a dissertation area by the end of term. The cluster I keep circling is default assumptions and sexist language: the old generic-masculine fight, singular 'they', the way a sentence can be literally neutral on its face and still nudge you toward a default reading, and the depressing fact that a neutral term sometimes drifts back toward masculine over a generation or two. Hofstadter's Person Paper is what first hooked me — the satire where you take some prim style-guide passage about language and swap race for gender, and it instantly reads as monstrous — but every time I try to turn the fascination into a research program, I can't tell which parts are genuine open questions and which are just the same argument everyone's been reheating since the seventies, where nobody moves and everyone feels obviously right.

  So here's what I actually want from you. Take the role of a philosopher of language who works on generics, presupposition and implicature, and who has watched this literature stall for decades — think carefully before you answer, and start by just brainstorming the candidate open questions out loud before you commit to anything. Then give me a defended agenda: which open questions in this area are the real ones, ranked, and which two or three would you actually bet my three years on? I want the reasoning, not the list — for each, why it's upstream of the others, whether it's tractable for someone with my tools rather than for a psycholinguist, and how neglected it is. Some candidate questions I keep juggling, feel free to kill them or add ones I'm missing: whether the harm of sexist language lives in what a sentence says or in what it invites you to assume (the semantics/pragmatics split, and whether that split even survives contact with real generics); whether sentences like 'a nurse ... she' are best analyzed as quantificational, as kind-referring, or as something else entirely, and whether that analysis actually tells you which fix to reach for; whether neutralization or reclamation is the more stable strategy, and whether default assumptions can be revised by explicit style rules at all or only by usage drifting; and whether the satirical analogy move (race : gender) is really an argument you can check or a rhetorical device that quietly assumes its own conclusion. I'm also interested in the side question of whether there's even a fact of the matter about what the default is — is it population-relative, context-relative, or is that the wrong frame — but I suspect that one might be a rabbit hole, so tell me if it is.

  One more thing, because it keeps coming up when I talk to people outside the department: half the alleged practical payoffs of this work — style guides, school curricula, maybe even some legal drafting arguments — get asserted as if they follow straight from the philosophical results. Tell me which of those implications actually carry weight and which are overrated or don't follow at all, and say what would move the whole ranking up or down over the next couple of years. Don't give me a reading list or a bibliography, I can find the papers myself — I want the agenda and the criteria you used to order it. Finish with a single machine-readable line of the form \answer{...} containing just the one question you'd pick if I could only do one, phrased in a few words.
reasoning: |-
  Hmm, this is a fascinating and complex query from a PhD student in philosophy of language. They're struggling with turning their interest in sexist language and default assumptions into a viable dissertation topic within three years, under the constraints of their advisor's semanticist orientation. 

  First, let's unpack what they need. They're circling several interconnected ideas: generic masculines, singular "they," how neutral language can still trigger gendered defaults, and the frustrating tendency of neutral terms to become masculinized over time. They mention Hofstadter's satirical "Person Paper" as inspiration but worry the field is stuck in repetitive debates since the 1970s. 

  Their explicit request is for me to brainstorm open questions in this area, then defend a prioritized research agenda. They want me to consider: 
  - What's genuinely unresolved versus reheated arguments
  - Tractability for their formal semantics/pragmatics toolkit (not psycholinguistics)
  - Which questions are upstream/more fundamental
  - Neglect in the literature
  - Real-world implications (style guides, legal language etc.)

  They've listed several candidate questions themselves, which I should engage with critically. The race/gender analogy question seems particularly charged. 

  Okay, stepping back - why is this area so stagnant? The core problem is that descriptive and normative concerns are entangled. Linguists can describe patterns (e.g., masculine defaults in generic "he"), but can't from that alone prescribe change. Meanwhile, the political stakes make neutral analysis difficult. The student needs questions where formal tools can actually reveal something new.

  Brainstorming open questions: 
  First, the semantics-pragmatics boundary for harm. Where exactly does the gendered assumption live? Is it in semantic content, presupposition, conversational implicature, or something else? This matters because fixes would differ - semantic reform versus pragmatic retraining. 

  Second, the ontology of defaults. Are they population-relative? Context-bound? This might be a rabbit hole as the student suspects, but perhaps a targeted version is salvageable - e.g., modeling how defaults shift across discourse contexts using formal frameworks. 

  Third, the stability of neutralization strategies. History shows neutral terms often re-masculinize. Why? Is this a linguistic inevitability or contingent? Formal modeling of semantic drift could help here. 

  Fourth, the race/gender analogy. Is it logically sound or rhetorically circular? This requires analyzing argument structure - perhaps using tools from philosophy of analogy. 

  Fifth (their side interest), whether there's a "fact of the matter" about defaults. This seems meta and potentially intractable, but could connect to foundational debates about reference in generics. 

  Now prioritizing: 
  Top choice should be the semantics/pragmatics of harm (#1). Why? Because:
  - It's upstream: determines what kind of phenomenon we're even studying
  - Fits their formal toolkit (presupposition projection tests, implicature calculi)
  - Surprisingly underexplored - most literature assumes rather than demonstrates where harm resides
  - Could resolve the "reheated arguments" problem by reframing debates
  - Tractability: can be analyzed through existing sentence-level frameworks without corpus studies or experiments

  Second choice: stability of neutralization (#3). Why?
  - Directly addresses their observation about terms re-masculinizing
  - Connects to diachronic semantics - can model mathematically
  - Practical implications for language reform efforts
  - Needs formal modeling, not psycholinguistics

  Third choice: race/gender analogy (#4), but cautiously. Why here?
  - Important but politically charged - risk of getting stuck in rhetoric
  - Requires meta-philosophical analysis they may not want
  - Still valuable if framed as testing argument validity

  I'd avoid the ontology of defaults (#2,5) as too foundational for a 3-year project. 

  About real-world implications: Most practical applications overclaim. Style guide rules don't "follow" from linguistic findings - they're political choices informed by (but not entailed by) descriptive work. The key contribution would be showing which interventions target the actual mechanism of harm (semantic vs pragmatic). 

  Final selection: The semantics-pragmatics divide question is the most fundamental, tractable, and neglected. It could reframe the entire debate. So in their requested format: \answer{The precise linguistic mechanism (semantic content vs. pragmatic inference) through which generics induce gendered default interpretations and cause harm}
answer: |-
  Here's a structured analysis of your research landscape, prioritizing questions by philosophical novelty, tractability with formal tools, upstream significance, and neglect. I've killed weak candidates, reframed promising ones, and added critical gaps.

  ### Brainstormed Candidate Open Questions (Killed/Reframed)
  - **Killed**: "Whether neutralization or reclamation is more stable" (Empirical drift question; better suited for sociolinguistics/historical corpus studies).  
  - **Killed**: "Whether style rules can revise defaults" (Socio-pragmatic; requires behavioral data beyond your toolkit).  
  - **Reframed**: "Whether sentences like 'a nurse... she' are quantificational/kind-referring" → Folded into **Q1** as a sub-question about *how* presuppositions project in generics.  
  - **Added**: "How gendered defaults interact with *modal horizons* in generics" (e.g., "Doctors save lives" vs. "Toddlers spill things" – asymmetry in capacity-ascription).  
  - **Added**: "The role of *counterfactual stability* in default assumptions" (e.g., When does "a professor" default to male even in contexts with known female professors?).

  ---

  ### Defended Agenda: Top 3 Bets for Your 3 Years  
  **Ranked by:**  
  1. **Upstream status** (resolves multiple downstream debates)  
  2. **Tractability** (addressable with formal semantics/pragmatics: presupposition, implicature, generics frameworks)  
  3. **Neglect** (where philosophy of language has stalled vs. reheated political arguments)  
  4. **Real-world weight** (implications that *actually* follow from philosophical work)

  #### **#1: Where does the harm of 'neutral' generics live? Semantics (lexical/conventional) vs. Pragmatics (inferential)**  
  - **Why upstream?**  
    - Determines *what kind of fix* is coherent: semantic reform (e.g., mandating "they") vs. pragmatic retraining (e.g., context-enrichment).  
    - Cuts across all your cases: generic masculines, singular "they," and default drifts. If the harm is semantic, neutralization fails when semantics bleaches; if pragmatic, usage drift alone won’t suffice.  
    - Resolves the "race:gender analogy" stalemate: If harm is conventional (e.g., "he" as semantically male), Hofstadter’s swap holds; if inferential, the analogy may misfire by ignoring contextual dynamics.  
  - **Tractability**:  
    - Test with projection diagnostics (e.g., Heim’s 'stop' test for presuppositions: *"Stop assuming nurses are women!"*).  
    - Formalize in a dynamic semantics framework (e.g., Veltman’s update semantics for defaults) to model how utterances *entrench* biases.  
    - Contrast with generics literature (e.g., Leslie) – are defaults triggered by quantificational structure or kind-predication?  
  - **Neglect**:  
    - Literature fixates on *whether* harm exists, not *how it’s encoded*. Psycholinguists probe reaction times, not content/force distinctions. Formal work rarely bridges to normative harm.  
  - **Real-world weight**: HIGH  
    - **Follows**: If harm is semantic, style guides *must* change syntax (e.g., ban "he" generics). If pragmatic, guidelines should target utterance contexts (e.g., priming gender-neutral imagery).  
    - **Doesn’t follow**: That legal liability follows from "harmful" language – philosophy can’t dictate policy, only clarify mechanisms.  
  - **Move the needle**: A formal model showing how pragmatic defaults become conventionalized (or not) could predict which interventions last.

  #### **#2: Under what conditions do neutral terms resist masculinization?**  
  - **Why upstream?**  
    - Reveals whether re-masculinization is inevitable (e.g., "actor") or preventable – a core failure mode of language reform.  
    - Tests theories of semantic change: Is drift driven by usage statistics, presupposition accommodation, or kind-essentialism?  
    - Informs #1: Resistance may correlate with embedded pragmatic triggers (e.g., "teacher" avoids masculinization where "boss" fails).  
  - **Tractability**:  
    - Formalize "neutrality" as *absence of gender presupposition* in a lexical entry (e.g., in Type Theory with Records).  
    - Model drift using diachronic semantic frameworks (e.g., Lassiter’s probabilistic pragmatics), isolating variables like frequency, salience, and stereotype strength.  
  - **Neglect**:  
    - Historians note drift; philosophers rarely model *why* some terms (e.g., "poet") stay neutral while others (e.g., "author") masculinize.  
  - **Real-world weight**: MEDIUM  
    - **Follows**: If formalizable conditions exist (e.g., high-frequency exposure to counterexamples), curricula can engineer resistance.  
    - **Overrated**: That any term can be "reclaimed" – philosophy can’t guarantee social uptake.  
  - **Move the needle**: Computational simulations of semantic drift under varying assumptions could guide reform efforts.

  #### **#3: Is the race:gender analogy logically sound or rhetorically circular?**  
  - **Why upstream?**  
    - Hofstadter’s move is widely invoked but rarely dissected. If flawed, it undermines a key argument for reform urgency.  
    - Tests whether gender defaults are uniquely entrenched vs. analogous to other biases (e.g., racialized generics like "criminals").  
  - **Tractability**:  
    - Analyze argument structure: Is it deductive (A:B :: C:D) or abductive (best explanation for intuitive revulsion)?  
    - Compare projection behaviors: Do race/gender triggers exhibit similar conventionalization profiles?  
  - **Neglect**:  
    - Treated as self-validating; no rigorous work on its argumentative status in philosophy of language.  
  - **Real-world weight**: LOW-MEDIUM  
    - **Follows**: If the analogy holds, it strengthens ethical arguments; if not, reformers need new justifications.  
    - **Doesn’t follow**: That pedagogical use of the analogy *works* – that’s empirical.  
  - **Move the needle**: Could defuse political gridlock by clarifying the argument’s limits.

  ---

  ### Rabbit Hole Warning  
  The "fact of the matter about defaults" question (*population/context-relative?*) is indeed a trap. It reduces to meta-linguistic verbal disputes without empirical anchors. Focus instead on *how* defaults are *activated* in specific linguistic structures (Q1).

  ---

  ### Final Ranking & Allocation  
  1. **#1** (Harm mechanism) – Highest leverage; unlocks the field’s stalemate.  
  2. **#2** (Resisting drift) – Actionable follow-up if #1 shows harm is semantic.  
  3. **#3** (Analogy) – Worth 1 paper if groundwork from #1/#2 supports it.  

  **Bet your 3 years on #1**, with #2 as backup. #1 is the keystone: it’s formally tractable, neglected at the mechanism level, and resolves circular debates. If your advisor insists on "pure" semantics, emphasize that distinguishing semantic/pragmatic content is core philosophy of language.

  \answer{The linguistic mechanism (semantic content vs. pragmatic inference) of harm in gendered defaults}
