prompt: |-
  I'm writing a short piece for a reading group on the Hart–Devlin debate and I'd like you to tear into it. Here's the argument in rough form — I havent written the prose out properly yet.

  Everyone reads the debate as one question: may the law enforce morality? Hart says only to prevent harm to others. Devlin says a shared morality is itself part of the social fabric, so its erosion is a harm, and the law may step in to stop it. Fine. My claim is that this framing hides a split. There are two ways to be a legal moralist. Backward-looking: the act was wrong, therefore it may be punished — the wrongness is the reason, full stop. Forward-looking: the act may be restricted because restricting it keeps the shared morality from decaying. I want to argue Devlin is only ever the second, and that almost all the standard objections — you can't show a shared morality exists, disgust isn't a reason, the law shouldn't enforce mere opinion — are aimed at the first. If I'm right, the debate is a stalemate for a boring reason: the critics keep hitting a target Devlin isn't standing on.

  The second half is where I get nervous. Forward-looking legal moralism has a symmetry problem. The mechanism is content-neutral: protect the prevailing morality, or it frays and something worse comes. But that argument seems to work just as well for a legislator trying to keep alive a morality I think is rotten. So the view either has to smuggle in a substantive standard for which moralities are worth conserving, in which case it's no longer really about conservation, or it bites the bullet and says any widely held morality may be legally propped up. I want to say it has to take the first horn, and that this quietly turns it into a liberal view — but I can't tell if that's a real result or just me redescribing Hart with extra steps.

  Comments please. Does the backward/forward distinction actually do work, or am I relabeling something obvious? Is the symmetry problem as bad as I think, or is there a principled asymmetry available (say, only moralities that are already self-sustaining get to count as 'the shared morality', so the law is never the thing doing the conserving)? And where is the weakest link in the second half — I suspect it's the move from 'the law can't pick which moralities are worth keeping' to 'so it's liberal,' but I can't see the gap clearly.
reasoning: |-
  Okay, let me unpack this user's query about the Hart-Devlin debate. They're developing an argument that challenges conventional readings and have two main concerns: whether their backward/forward distinction is meaningful, and how to handle a symmetry problem in forward-looking legal moralism.

  First, I need to verify if their core distinction holds water. The backward-looking approach (punishing because something is inherently wrong) versus forward-looking (restricting to prevent moral decay) seems valid. Devlin's actual writings do emphasize societal disintegration from moral erosion, which aligns more with the forward-looking position. The user's insight that critics attack the wrong target feels sharp - objections like "disgust isn't reason" would only land against backward-looking moralism.

  Now for the tricky symmetry problem: if any morality can be conserved, even rotten ones, that's untenable. But Devlin's argument implicitly requires the conserved morality to be society's actual glue. This creates a natural asymmetry - only moralities that already functionally sustain society deserve protection. The user's alternative framing (law as "last line of defense") is clever but still vulnerable.

  The weakest link is definitely their claim that adopting a selection criteria makes the position "quietly liberal." This overreaches. Hart's harm principle sets a high bar for intervention, while Devlin's conserved morality could still permit illiberal restrictions if they're deemed socially necessary. 

  I should emphasize that the distinction itself is robust and illuminating, but the "turns liberal" conclusion needs tempering. The real payoff is showing how Devlin's conservatism is more sociologically grounded than critics acknowledge. That reframing alone makes the debate fresh again.
answer: |-
  This is sharp stuff – you're drilling into a genuine tension in the Hart-Devlin literature. Your core distinction absolutely **does work** and is far from merely relabeling. Let's tear into it constructively:

  **1. The Backward/Forward Distinction: Spot On & Valuable**
      *   **It Does Work:** You're absolutely right. The standard "law enforcing morality" framing obscures Devlin's *specific mechanism*. Your distinction clarifies that Devlin isn't primarily saying "X is wrong, therefore ban it" (backward-looking retribution/expressivism). He's saying "*Allowing* X weakens the shared morality M, and weakening M causes societal harm (disintegration), therefore ban X to *preserve* M and *prevent* that harm" (forward-looking consequentialism focused on social cohesion).
      *   **Targets Missed:** Your key insight is brilliant. Critics *do* often hammer the backward-looking version (e.g., "Why is *your* disgust/opinion a reason for law?", "How do you prove X is *objectively* wrong?", "This is tyranny of the majority!"). These objections largely bounce off Devlin *if* we take his forward-looking, consequentialist argument seriously. His reason isn't "it's wrong," it's "permitting it *causes* societal harm via erosion." The debate *is* often stalemated because critics attack a strawman Devlin (the pure backward-looking moralist) while Devlin retreats to his consequentialist fortress.

  **2. The Symmetry Problem: Real & Acute – But Not Necessarily Fatal (for Devlin)**
      *   **The Problem is Legit:** Your symmetry observation is powerful and correct. Devlin's argument *is* formally content-neutral. The logic ("preserve the shared morality to prevent societal disintegration") *could* be deployed by a Stalinist to preserve Stalinism, a theocrat to preserve fundamentalism, or a liberal democrat to preserve liberal democracy. If the "shared morality" is *whatever is widely held*, then the mechanism justifies preserving *any* status quo morality against change.
      *   **Horn 1: Smuggling in Standards?** You suspect Devlin *must* do this. He arguably *does*, implicitly. His entire argument rests on the premise that the shared morality *is* the essential glue holding society together. He implicitly assumes it's a *good* glue, or at least the *only possible* glue for *this* society. He's not advocating preserving *any* random morality; he's advocating preserving *the actual, existing, functional* morality that constitutes *this specific* society. The "substantive standard" smuggled in is **functionality**: the morality must demonstrably *work* to hold *this* society together. He doesn't need to say it's "objectively good," just that it's *necessary for this society's survival*. This is his asymmetry: only the *actual, functional, constitutive* morality of a society gets protected. He'd likely argue trying to preserve a "rotten" (non-functional, non-constitutive) morality *wouldn't* prevent disintegration; it might cause it.
      *   **Horn 2: Biting the Bullet?** While the logic *could* be used by anyone, Devlin's context is crucial. He's a conservative arguing *against* liberalizing laws (specifically homosexuality laws) in a society with a *pre-existing* Christian-based morality he believed was constitutive. He wasn't offering a universal theory for any society but defending the status quo in *his* society. He might bite the bullet *within* a society: "Yes, the law *should* prop up the *actually* shared and constitutive morality, even if an outsider thinks it's 'rotten', because *that specific society* depends on it." He'd argue changing it risks collapse, and collapse *is* harm. This doesn't make it universally applicable, but it makes it coherent *for his purpose*.
      *   **Principled Asymmetry?** Your suggestion ("only self-sustaining moralities") is excellent and close to what Devlin relies upon implicitly. The law isn't *creating* the morality or conserving something artificial; it's *reinforcing* the *already existing, self-sustaining (but vulnerable)* constitutive morality. The law acts as a buttress, not the foundation. The asymmetry is historical/contingent: only the morality that *has demonstrably formed the basis* of *this* society's cohesion qualifies. A legislator couldn't arbitrarily pick a new "morality" to conserve using this argument; it only works for the *established, functional* one. The "something worse" feared is the *loss* of that specific cohesive force.

  **3. The Weakest Link: "Turns Liberal" – This Doesn't Follow (Yet)**
      *   **The Gap is Huge Here:** This is indeed the weakest point. Even if Devlin *must* implicitly rely on functionality/constitutiveness as the criterion for which morality gets preserved, **this does not make his view "quietly liberal."**
      *   **Why Not?**
          *   **Functionality ≠ Liberalism:** A morality can be highly illiberal (e.g., enforcing strict caste systems, severe gender inequality, religious uniformity) and still be *functional* in holding a specific society together in Devlin's sense (preventing overt conflict, maintaining order, providing shared meaning). Devlin's test is sociological stability, not individual liberty or autonomy.
          *   **Hart's Harm Principle is Substantive:** Hart's "harm to others" *is* a substantive (liberal) standard limiting state power. Devlin's "preserve the constitutive morality to prevent societal harm" is *also* substantive, but its substance is *social cohesion based on the status quo*. It's substantively *conservative*, not liberal.
          *   **The Liberal Move Requires More:** To get to liberalism, you'd need to argue that *only* moralities compatible with core liberal values (individual autonomy, pluralism, harm principle) *can* be truly functional/constitutive in a modern, diverse society. *That* might be Hart's (or Dworkin's, or later liberals') argument *against* Devlin. But Devlin himself would vehemently deny this. He believed the *traditional* (illiberal) morality *was* necessary. Adding a "functionality" filter doesn't automatically screen *out* illiberal moralities; it just means the conserved morality must *work* for its society. Liberalism imposes a *further*, independent value judgment on *what kind* of functionality or social order is desirable.
      *   **The Result is Still Conservative:** Even refined with your distinction and the functionality criterion, Devlin's position remains fundamentally conservative: the law *should* act to conserve the existing, broadly shared, constitutive morality because its erosion poses an existential threat to the social order *as it currently exists*. This justifies illiberal restrictions if they are part of that constitutive glue. It's a consequentialist argument for social conservatism, not a stealthy route to Hart's liberalism.

  **Conclusions & Suggestions:**

  1.  **Distinction:** Keep it. It's excellent and clarifies the core misreading of Devlin. Frame it clearly: Devlin offers a *forward-looking, consequentialist* justification for legal moralism focused on *preventing societal harm via moral decay*. The standard critiques often misfire.
  2.  **Symmetry:** Acknowledge its force. Devlin's best defense is the implicit reliance on the *actual, functional, constitutive* nature of the *specific* morality being conserved. The asymmetry comes from the historical contingency and functionality requirement, not content per se. The law reinforces, it doesn't originate or conserve arbitrarily. This makes his argument context-bound, not universally applicable.
  3.  **Weakest Link:** **Drop or radically reframe the "turns liberal" claim.** It's the major vulnerability. Instead:
      *   Argue that *recognizing* the functionality requirement exposes Devlin's argument as vulnerable to sociological evidence: *Can* tolerance on issue X actually cause societal disintegration? *Is* this specific morality still the constitutive glue? (This was Hart's empirical/pragmatic counter).
      *   Argue that *even with* the functionality filter, Devlin's view remains illiberal and permits significant oppression if the constitutive morality demands it. The debate then shifts to whether social cohesion *requires* such illiberal enforcement or whether pluralism and individual freedom are compatible with (or even necessary for) modern social cohesion – which is where more contemporary liberals take the fight.
      *   Conclude that the forward/backward distinction refines the debate but doesn't resolve it; it just shows Devlin's position is more sophisticated (and harder to kill with simple objections) than often portrayed, yet still rests on contestable empirical and normative premises about society, cohesion, and the necessity of enforcing shared beliefs.

  Your core insight about the distinction and the misfiring critiques is strong and novel enough to carry the piece. Sharpen the distinction, grapple honestly with the symmetry problem (Devlin has resources, but it's a tension), and ditch the "turns liberal" leap – that's where your current draft stumbles. This is promising work!
