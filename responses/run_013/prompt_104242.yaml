  As a retired experimental physicist who has recently turned to philosophy, I have been trying to understand the difference between working inside a formal system and stepping outside it to see why a particular result cannot be reached. The MU-puzzle is my model case: beginning with MI and applying the allowed rules, one tries to derive MU; the impossibility is shown not by a longer derivation but by noticing an invariant that every rule preserves and the target violates. Please set out the most important implications of this jumping-out-of-the-system phenomenon for how I should think about a machine-learning system that claims to have evaluated and revised its own training objective. I am not asking for citations, reading lists, or bibliographies; I want the conceptual consequences, including where the analogy between a formal game and a learned system breaks down, and what it would even mean for such a system to recognize a constraint on its own transformations. State how confident you are in each implication and single out the one you are least sure of.
