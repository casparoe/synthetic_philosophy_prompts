prompt: |-
  ok this is a weird request so bear with me. i never studied any of this formally, i work nights stocking shelves and i read a lot of wikipedia on my phone during breaks, and i've gotten weirdly obsessed with the thing called the paradox of voting. two things about it drive me up the wall.

  the first is that the name gets used for two totally different puzzles and nobody ever warns you. puzzle one is the one about why anybody votes at all, since the odds that your single vote decides the election are supposedly so tiny that you'd have to be an idiot or a saint to bother showing up. puzzle two is the group one, where you line three options up and get a majority saying A beats B, a majority saying B beats C, and a majority saying C beats A, so the group as a whole has no coherent favorite even though every single person's ranking is perfectly sensible.

  the second thing is that puzzle one isn't even as obvious as people make it sound. the odds are tiny, sure, but they don't shrink as fast as you'd guess — its more like they go down with the square root of how many voters there are than in proportion to it. so in some little school board race with a few hundred voters, your vote actually deciding the thing is not a crazy thing to hope for, and even in a giant election it's small but not literally zero. and then theres the move where someone says, well, people vote because they enjoy voting, or because they'd feel like a jerk staying home, which always struck me as winning the argument by quietly changing what counts as being rational.

  anyway. what i actually want is a joke. can you write me one good joke about the paradox of voting — either of the two puzzles, or both at once if you can pull it off. it has to be funny to someone who really knows this stuff, so the punchline should turn on the actual content and not just be the millionth version of ha ha my vote doesn't count. id especially like it if the joke needs you to know something specific, like the square root thing, or the fact that your odds of being the deciding vote are way better when the race is close, or the rock paper scissors majorities. a bit of setup inside the joke is fine. but no explaining it to me afterwards — if it needs a paragraph of footnotes its not a joke.
