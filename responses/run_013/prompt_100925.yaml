prompt: |-
  So I've somehow ended up as the grad student rep on our university's research ethics board, which mostly means reading consent forms and nodding, and it's made me realise how little of the actual philosophy of consent I understand. The board keeps hitting the same wall: someone consented, technically, but did they really? We've got a longitudinal biobank study where participants signed one broad form ten years ago and the science has since moved in directions nobody could have described then. We've got a study where the consent form buries a real risk in paragraph 19, in language that's legally accurate and practically invisible. And there's the usual coercion mess -- students, employees, people who need the money. I signed up to a biobank myself last month and the 40-page form is honestly what tipped me into wanting to think about this properly.

  I want to write something for the board (and for me) that sorts out which of the open conceptual questions about consent validity actually matter most for how we write and review these forms, versus which are philosophically juicy but wouldn't change a single line. So: given maybe a semester of reading and a board that meets monthly, which questions should I prioritise? I'm thinking of things like -- is consent a mental state or a communicative act, and does it even matter which? How much disclosure is enough before "informed" becomes a fiction? Can broad/blanket consent to future unknown research ever be valid, or is that just a polite name for no consent at all? And the one I keep circling: whether the *use* a study makes of a validly given consent can retroactively poison it. There's also something a colleague threw at me that I can't shake -- is there a real difference between deceiving someone into consenting and simply not correcting a false belief they already had, if the resulting choice and outcome are identical?

  Defend the ordering. I care about why one question is upstream of the others, which are tractable for someone who's read the literature but isn't a lawyer, and what would make me move something up or down the list. Don't give me a reading list, I can find the papers myself; I want the actual agenda and the reasoning behind it.
reasoning: |-
  Okay, the user is a grad student rep on a university research ethics board. They're dealing with real-world issues in consent forms and feel they lack a deep understanding of the philosophy behind consent. They want to prioritize which conceptual questions about consent validity are most impactful for their board's work versus those that are just philosophically interesting. 

  Hmm, their examples are telling: a ten-year-old biobank consent form now used for unforeseen research, risks buried in legalese, coercion concerns with vulnerable populations. And they're overwhelmed by their own 40-page biobank consent experience. Their frustration is palpable – they need practical tools, not theory.

  Let me unpack their stated questions: Is consent mental state vs. communicative act? How much disclosure is "enough"? Can blanket consent for future research be valid? Does problematic study use retroactively invalidate consent? Is deception by omission equivalent to active deception? 

  But reading between the lines... their core need is triage. They have limited bandwidth (monthly meetings, a semester to study) and need maximum ethical ROI. They’re not asking for answers but for a framework to decide what to tackle first. The "defend the ordering" demand is key – they want logic, not opinions.

  Their hidden pain points seem to be: 1) Guilt over rubber-stamping forms without deeper scrutiny, 2) Anxiety about institutional liability ("retroactively poison consent" suggests fear of future scandals), 3) Moral discomfort about power imbalances (coercion examples). 

  Prioritization must meet three tests: 
  - Actionability (will change form design/review) 
  - Impact (affects most studies/participants) 
  - Tractability (solvable without law degrees) 

  So... 
  First place has to be disclosure adequacy. Why? Because every consent form lives or dies here. The biobank example and buried risk (#19!) are direct fire drills. Plus it’s tractable – tweaking language, structure, readability is within the board’s power. 

  Second: Blanket consent validity. It’s the biobank elephant in the room. If they rule it invalid, decades of research implode; if valid, they need guardrails. Directly impacts ongoing studies. 

  Third: Coercion thresholds. Students/employees/marginalized groups appear constantly. Fixing this requires policy changes (e.g., banning student participation in advisor studies), not just forms. 

  Fourth: Belief-correction vs. deception. Less urgent but insidious – think placebo studies where participants assume they’re getting real drugs. Could wait unless their university does lots of behavioral psych. 

  Last: Mental state vs. communicative act. Fun for PhDs but changes nothing practically. Consent is always treated as communicative in governance. 

  Retroactive poisoning? Intriguing but rare. Unless their board handles many contentious secondary data uses, it’s a footnote. 

  ...Wait, did I miss something? *Checks again*. Ah – the user’s personal biobank experience. That’s why disclosure feels visceral. They’re not just a rep; they’re a participant who felt trapped by paperwork. That emotional resonance makes Question #1 non-negotiable. 

  Final call: Order by "what keeps you awake at night." For an ethics board, that’s absolutely: 1) Are we hiding risks? 2) Are we exploiting past participants? 3) Are we pressuring the vulnerable? The rest is commentary.
answer: |-
  Here's a prioritized framework for tackling the core conceptual questions, designed to maximize practical impact on consent forms and review processes within your constraints. The ordering balances **urgency, frequency of encounter, capacity for concrete action, and philosophical leverage** over downstream issues.

  ### Tier 1: Highest Priority - Directly Shapes Form Design & Review Thresholds
  1.  **How much disclosure is "enough" for consent to be "informed"? What constitutes materiality?**
      *   **Why Upstream & Urgent:** This is the beating heart of your daily work. The "buried risk in paragraph 19" and the "40-page form" are direct symptoms. Resolving *what* must be disclosed, *how clearly*, and *to what standard* (e.g., reasonable person vs. reasonable participant standard) dictates form structure, length, readability assessment, and review focus. This question is foundational to evaluating *any* consent form.
      *   **Tractability:** Highly tractable with philosophical and bioethical literature (e.g., debates on materiality thresholds, therapeutic misconception). You don't need to be a lawyer; standards like "key information first," "lay summaries," and "risk tiers" are actionable outputs. Concepts like "appreciating the nature of the research" are core here.
      *   **Impact:** Changes form *writing* (conciseness, prominence of key risks/benefits) and *review* (focus on risk communication, not just legal coverage). Directly addresses the most common flaw you encounter.
      *   **Move Up/Down:** Always top tier. If your board *only* tackles one thing, it should be this. Failure here invalidates consent regardless of other factors.

  2.  **Can broad/blanket consent for future unknown research (like the biobank) ever be valid? If so, under what conditions?**
      *   **Why Upstream & Urgent:** The 10-year-old biobank consent is a live, ongoing ethical challenge impacting current research validity and participant trust. Solving this dictates board policy on re-consent, tiered consent models, permissible scope, governance mechanisms, and communication with participants over time. It forces confrontation with the core meaning of "informed" for future unknowns.
      *   **Tractability:** Significant literature exists (e.g., debates on specific vs. broad consent, dynamic consent, governance frameworks). Solutions involve policy development (e.g., defining acceptable scope limits, requiring governance review for new uses, implementing participant re-contact/re-consent pathways) – actionable within the board's mandate.
      *   **Impact:** Determines how you handle legacy studies, design future biobank consents, and assess secondary data use proposals. Failure risks systemic invalidity for large swathes of research.
      *   **Move Up/Down:** Critical if longitudinal/biobank studies are common. Slightly less urgent than Disclosure if your board mainly reviews discrete studies, but the conceptual weight and practical implications are immense.

  ### Tier 2: High Priority - Shapes Review Criteria & Vulnerability Assessment
  3.  **What constitutes undue inducement or coercion, particularly in vulnerable populations (students, employees, financially needy)? How do we assess voluntariness?**
      *   **Why Upstream:** Directly impacts how you review studies involving populations with inherent power imbalances or dependency (common in universities). It defines the threshold where payment or opportunity becomes coercive.
      *   **Tractability:** Established ethical principles (Belmont Report, CIOMS) and literature on vulnerability and inducement. Actionable through developing specific review guidelines (e.g., prohibiting certain populations in specific studies, capping payment levels relative to risk/time, requiring independent recruiters for employees/students).
      *   **Impact:** Changes how you scrutinize recruitment plans, payment structures, and researcher-participant relationships. Addresses the "coercion mess" head-on. Protects the most vulnerable.
      *   **Move Up/Down:** Move **up** if vulnerable populations are frequently involved in studies you review. Move slightly down if most studies involve low-risk surveys with non-vulnerable community samples.

  ### Tier 3: Important Nuance - Clarifies Specific Review Judgments
  4.  **Is there a morally relevant difference between *deceiving* someone into consenting and *failing to correct* a known false belief they hold, when the outcome is the same?**
      *   **Why Important:** This cuts to the core of researcher obligation and the limits of disclosure. It helps adjudicate cases where a participant clearly misunderstands a key aspect (e.g., purpose, risks, placebo) despite "accurate" form language. Is the researcher culpable for not correcting this?
      *   **Tractability:** Draws on philosophy of deception, omission, and moral responsibility. Actionable by developing board policy: Does mere "disclosure" suffice, or must researchers actively probe for and correct material misunderstandings *known* to be present? This shifts review focus towards comprehension assessment plans.
      *   **Impact:** Refines review of deception studies (common in psych/social sciences) and any study where therapeutic misconception or complex concepts are likely. Addresses the gap between technical accuracy and actual understanding.
      *   **Move Up/Down:** Move **up** if your board reviews many social/behavioral studies using deception or involving complex medical concepts. Move down if primarily reviewing low-risk biomedical surveys.

  ### Tier 4: Conceptually Rich, Less Actionable for Forms - Inform Broader Perspective
  5.  **Does the problematic *use* of validly given consent (e.g., harmful findings, stigmatizing research) retroactively invalidate the initial consent?**
      *   **Why Less Actionable for Forms:** While profound, this primarily impacts *governance* and *oversight* *after* consent is given and research is underway/completed. Form design focuses on enabling valid consent *at the outset*. The harm arises from how the research is conducted or findings are used, not directly from the consent process itself.
      *   **Tractability:** Highly abstract philosophical debate (nature of consent, moral residue). Board actions are more about study monitoring, data sharing policies, and harm mitigation plans than rewriting consent forms.
      *   **Impact:** Important for board discussions on controversial research proposals, data sharing agreements, and handling participant concerns post-study. Less likely to change specific consent *form* wording.
      *   **Move Up/Down:** Move **up** if your board reviews high-risk, sensitive, or potentially controversial research (e.g., genetics, community-based participatory research with stigmatized groups). Otherwise, it informs perspective but won't change forms.

  ### Tier 5: Lowest Practical Priority (for your mandate) - Philosophical Distinction
  6.  **Is consent primarily a mental state or a communicative act?**
      *   **Why Lowest Priority for *Forms*:** While foundational to philosophy, in the *practical governance* context of an REB, consent is *operationalized* as a communicative act embodied in the signed form and process. Review focuses on ensuring the *process* enables a competent person to understand and choose voluntarily. Proving a "mental state" is impossible; we rely on the communicative act (form + discussion) as the best evidence. Debating this won't change how you write or review forms.
      *   **Tractability:** Deep philosophical dive. Zero direct impact on form wording or review criteria. Interesting for your personal understanding, but not for board action.
      *   **Impact:** None on practical operations. Might subtly influence how you *think* about comprehension assessment, but won't lead to actionable changes.
      *   **Move Up/Down:** Only move up if the board gets stuck in purely abstract debates distracting from review tasks. Otherwise, personal interest only.

  ### Reasoning Summary & Defense of Order

  1.  **Foundation First (Tier 1):** Disclosure and Future Consent are the bedrock. Without adequate information (Question 1) and clarity on scope (Question 2), consent is fundamentally compromised. These are the most frequent and systemic flaws you encounter. Fixing them has the highest direct impact on form quality and review effectiveness.
  2.  **Mitigating Harm (Tier 2):** Voluntariness/Coercion addresses the most significant *procedural* threat to validity after inadequate information. It protects vulnerable individuals and is highly actionable through specific review guidelines.
  3.  **Closing Loopholes (Tier 3):** The deception/omission question tackles a specific, common ambiguity in the *application* of disclosure principles. It refines review judgments in high-risk areas but relies on the foundation laid by Tier 1 & 2.
  4.  **Downstream Governance (Tier 4):** Retroactive invalidity concerns study conduct and outcomes *after* consent. It's crucial for overall ethics but minimally impacts the *consent form itself* or the *initial review* process focused on that form.
  5.  **Abstract Foundation (Tier 5):** The mental state vs. act debate underpins philosophy but is fully absorbed into operational practice (focus on the communicative act/process) within REB governance. Debating it won't alter practical outcomes.

  **Prioritization Triggers:**
  *   **Move Disclosure (T1) to Absolute Top:** If forms are consistently overly long, complex, or bury risks.
  *   **Move Blanket Consent (T1) to Top:** If biobanks/longitudinal studies are a significant portion of your workload or legacy issues are causing problems.
  *   **Move Coercion (T2) to Top:** If studies frequently recruit students, employees, or financially vulnerable populations, or if payment levels are contentious.
  *   **Move Deception/Omission (T3) to Higher Tier:** If reviewing many psychology, sociology, or marketing studies employing deception or where misunderstanding is likely.
  *   **Move Retroactive Poisoning (T4) to Higher Tier:** If handling sensitive genetics research, research with indigenous communities, or studies with high potential for group harm/stigmatization.

  This framework prioritizes questions that directly determine **what information goes on the form, how it's presented, who can validly agree to what scope, and how to protect the vulnerable** – the core levers an REB has to ensure ethical consent. It leaves the deepest metaphysics for personal enrichment, focusing your limited time on changes that will make the next consent form participants sign (including yours) meaningfully better.
