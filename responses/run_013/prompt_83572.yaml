  For my response, I'll avoid cultural stereotypes by focusing on moral principles applicable universally. I'll structure around their four questions but synthesize into a cohesive argument. Kant's categorical imperative and Mill's harm principle will provide frameworks, but I should also address collective action problems (Hardin's tragedy of the commons) and the social contract (Rawls).

  Key insights to develop: 
