prompt: |-
  I host a small interview podcast about decision theory and practical philosophy -- a few hundred listeners, mostly grad students plus a handful of people who just enjoy this stuff. Next month my guest is a philosopher who's spent basically her whole career defending expected value maximization against the fanaticism objection, and she has one move she's very good at, which is to say: that's not a problem with the theory, that's a problem with your probability estimate. I want questions that make her actually work for it.

  Background so you know what she's committed to. Her line is that the absurdity people point at in the mugging-type cases (a stranger offers you an astronomically large payoff on a vanishingly small chance) is real but mislocated. What she thinks is indefensible is a theory that makes a decent sure thing worse than a lottery whose only edge is an infinitesimally better shot at an already-astronomical payoff -- a difference in probability so small that no possible evidence could distinguish the two options. What she thinks is fine, and what she'll happily bite the bullet on, is the ordinary case: pay a big certain cost for a one-in-a-googol chance of something enormous. Her way of putting it is that fanaticism only looks absurd when you cross two noise floors at once, a probability below which your estimate carries no information and a value above which your valuation carries no information; cross only one and the theory is perfectly sane. And she insists the whole thing is a point about us rather than about the theory -- an ideal agent with exact probabilities and exact values should just maximize expected value, fanaticism and all.

  You're a professional philosopher of decision theory who knows this literature cold. Think carefully before you write, and start by brainstorming the crux points: where is she actually most vulnerable, and which of her commitments are doing the load-bearing work? Then draft me 10 to 12 questions, grouped into four rounds:

  1. Where does the problem live -- in the theory of rational choice, in the axiology of the outcomes, or in the practice of deliberation? Force her to locate it in exactly one.
  2. The noise-floor move itself, and whether it can be stated precisely enough to be more than a gesture.
  3. Whether avoiding fanaticism costs her an axiom she wants to keep -- stochastic dominance, transitivity, the sure-thing principle, or the principle that a tiny chance of a huge good always counts for something. Make her name the one she's giving up and defend the price.
  4. Infinite and lexicographic payoffs, and what her noise-floor story does there.

  Then close with a question about what would actually change her mind.

  Every question needs a follow-up keyed to the answer she's most likely to give, and I'd rather you err on the side of anticipating a good reply than a lazy one. Some specific things I want hit somewhere in there:

  - A case where the odds are known exactly -- a verifiable physical lottery, say 1-in-10^12, with a huge but finite and well-understood payoff. The probability isn't noise here, so does the noise-floor defense have anything to say, or does she just bite it?
  - The self-undermining worry: the same your-estimates-are-worthless-down-there move seems to undercut the case for spending real money on reducing tiny-probability catastrophes, which is an argument her side of the fence usually likes a lot. Make her either accept that or find a principled line that spares one and not the other.
  - What happens when the probability isn't tiny but genuinely unmeasurable -- does expected value even apply, and if it doesn't, what's her fallback?
  - Practical incoherence: if the theory requires chasing the fanatical option, then an agent who obeys it does nothing else with their life. Ask whether the theory is self-effacing, and if so whether that's a bug or a feature.
  - Whether fanaticism can be generated by a chain of individually mundane-looking choices, so that it isn't quarantined in exotic cases the way she wants.
  - Whether she thinks there's any genuine reductio anywhere in the neighborhood, and what one would look like.

  Don't ask her for book or paper recommendations, don't ask her to just lay out the view again (assume the audience knows the basics), and no soft biographical questions. Keep each question short enough to say out loud in one breath.
reasoning: |-
  Okay, the user hosts a small podcast on decision theory and practical philosophy, with a guest who defends expected value maximization against fanaticism objections. The guest's key argument is that absurdities in cases like Pascal's Mugging arise from flawed probability estimates, not the theory itself. The user wants sharp questions that challenge her position effectively.

  First, I need to understand where her defense is most vulnerable. She relies heavily on the "noise floor" concept—probabilities or values so extreme that our estimates carry no information. But this seems fuzzy. How exactly is the noise floor defined? Can it be quantified? If not, it risks being an ad hoc fix. Also, she bites the bullet on cases with exact probabilities, like a verifiable lottery with 1-in-10^12 odds. That might force her into counterintuitive endorsements without the noise floor to hide behind.

  Another vulnerability is the self-undermining worry. Her argument against trusting tiny probabilities could undermine efforts to prevent low-probability catastrophes, like existential risks. If she can't distinguish between Pascal's Mugging and legitimate x-risk mitigation, it weakens her position. She needs a principled line here.

  Her commitments to decision theory axioms might clash with avoiding fanaticism. For example, stochastic dominance: if an option is better in every scenario, it should be preferred. But in fanatical cases, EV maximization might violate this if the high-value outcome has a tiny probability. Would she give up such axioms? That could be costly.

  Infinite utilities present another problem. If payoffs are infinite, expected values might not converge, making maximization impossible. How does her noise floor handle this? Lexicographic values (prioritizing certain outcomes over others regardless of probability) also challenge EV maximization. Does she dismiss these, or adjust her theory?

  Practical incoherence is a concern too. If rational agents must chase astronomical payoffs, their lives become consumed by such pursuits. Is the theory self-effacing? Would it advise ignoring rationality in practice? That seems problematic.

  I also consider whether fanaticism can emerge from mundane choices. If each step in a chain of decisions is reasonable, but cumulatively leads to fanaticism, can she quarantine it? If not, her defense might collapse under ordinary cases.

  The user wants questions grouped into specific rounds. For Round 1, forcing her to locate the problem in theory, axiology, or deliberation. She'll likely say deliberation, but pressing her on why the theory isn't culpable when it mandates counterintuitive results. 

  Round 2 targets the noise floor's precision. If it can't be rigorously defined, it's just hand-waving. The exact probability lottery question here is crucial—without estimation noise, she has to bite the bullet.

  Round 3 questions challenge her commitment to axioms. If she keeps stochastic dominance, how does she handle cases where EV maximization violates it? Her response might reveal tensions in her position.

  Round 4 on infinities: how noise floors apply when values are infinite. If probabilities are immeasurable, does EV maximization still hold? Her fallback for such cases needs scrutiny.

  Finally, what evidence would change her mind? If she can't name any, it might indicate dogmatism.

  The user's deeper needs: compelling content for an educated audience, exposing weaknesses in a standard defense, and pushing the guest beyond rehearsed answers. The questions must be incisive but fair, forcing clarity without being confrontational. Including the specific requested angles (exact probabilities, self-undermining, etc.) is essential to cover all vulnerabilities.
answer: |-
  Here’s a structured attack targeting the cruxes: her reliance on *epistemic noise* to deflect fanaticism, the tension with core axioms, and the instability of her "one noise floor at a time" boundary. Her vulnerability lies in **treating "no information" thresholds as both necessary for absurdity and sufficient for dismissing objections**, while needing to preserve standard EV axioms that *enable* fanaticism when probabilities are exact.

  **Round 1: Problem Location**  
  *(Force her to isolate the issue)*  
  1. "You argue the absurdity arises from *our* inability to distinguish probabilities/values, not from EV theory itself. But when EV mandates paying $1000 for a 10⁻¹⁰⁰ chance at 10¹⁰⁰ utils – and an ideal agent with exact values/probabilities *must* do this – isn’t the theory itself generating the counterintuitive result? Why blame only the *epistemology* of imperfect agents?"  
     *Likely reply: "The result is only counterintuitive because humans can’t grasp such extremes."*  
     → **Follow-up:** "So if an ideal agent *can* grasp them, is it then clearly rational for them to sacrifice their life savings for that 10⁻¹⁰⁰ chance? Should we aspire to that ideal?"

  2. "If we moved to a universe with precise, measurable tiny probabilities and bounded but vast utilities (e.g., alien tech verifies 1-in-10¹² lotteries), would EV maximization *still* require paying ruinous costs for tiny chances of huge gains? And is that a defensible theory of rationality there?"  
     *Likely reply: "Yes, if probabilities/values are exact, the calculation is sound."*  
     → **Follow-up:** "Doesn’t this imply the problem *is* in the theory’s structure, not just our noise? It mandates life-wrecking sacrifices for near-hopeless long shots whenever the math works out."

  **Round 2: The Noise Floor Defense**  
  *(Challenge its precision and scope)*  
  3. "Can you define a *non-arbitrary* threshold for the 'probability noise floor'? Is it a function of our cognitive limits, available evidence, or fundamental epistemology? How would this threshold apply to, say, the 1-in-10¹² verified lottery case?"  
     *Likely reply: Thresholds are context-dependent but tied to evidence resolution.*  
     → **Follow-up:** "If context sets the floor, doesn’t this make fanaticism 'absurd' purely relative to human limitations? Could a superior agent rightly call *our* risk-aversion to nuclear war (say, 1-in-1000 stakes) 'absurd' by their standards?"

  4. "Your 'one noise floor at a time' rule: why is crossing *both* required for absurdity? If I face a choice with a *known* 10⁻³⁰ probability (say, quantum decay-triggered payoff) but a utility so vast (10¹⁰⁰) it’s arguably in *its* noise floor, does EV maximization become absurd here? Or is it still rational?"  
     *Likely reply: Known probabilities anchor the calculation; utility noise alone isn’t fatal.*  
     → **Follow-up:** "But if utility noise means we can’t distinguish 10¹⁰⁰ from 10¹⁰⁰ + ε, doesn’t stochastic dominance demand indifference between options differing only by ε? Yet EV maximization might still demand vast sacrifices for ε gains. Isn’t that a conflict?"

  **Round 3: Sacrificed Axioms?**  
  *(Force admission of trade-offs)*  
  5. "Stochastic dominance seems sacred: if option A is better than B in every state, A > B. But if I offer you A: 1-in-10¹⁰⁰ chance of 10¹⁰⁰ utils, or B: that same chance plus a 1-in-10¹⁵⁰ chance of +1 util, EV says B > A. Yet if both probabilities are below your noise floor, can you *defend* preferring B? Or must you abandon strict dominance below the floor?"  
     *Likely reply: "With exact values, dominance holds; noise makes practical indifference."*  
     → **Follow-up:** "But if noise forces practical indifference, doesn’t your *prescribed action* violate dominance? You’d act as if A ~ B, while dominance says B > A. Isn’t this abandoning the axiom *in practice*?"

  6. "The 'principle of insufficient reason' suggests indifferent probabilities for indistinguishable states. If two cosmic payoffs are both 'astronomical' (i.e., in utility noise), must we assign them equal probability? If so, how do we avoid fanaticism when *many* such indistinguishable payoffs exist?"  
     *Likely reply: "Insuff. reason applies only to genuine ignorance, not value indistinguishability."*  
     → **Follow-up:** "But if utility noise means I can’t distinguish payoff X from Y, isn’t my epistemic state regarding their relative desirability *identical* to ignorance? Why treat probability and value noise differently here?"

  **Round 4: Infinities and Lexicography**  
  *(Test boundary cases)*  
  7. "With *infinite* utilities (e.g., save ∞ lives), any non-zero probability dominates finite options. Does your noise floor apply? Or is fanaticism *mandatory* here, regardless of probability?"  
     *Likely reply: "Infinities require careful handling (e.g., aggregative limits), but small probabilities still matter."*  
     → **Follow-up:** "If the probability of achieving ∞ utility is 10⁻¹⁰⁰⁰⁰, must an ideal agent spend all resources on it? If not, how does your view block this without *ad hoc* probability thresholds?"

  8. "Lexicographic values (e.g., avoid torture at any cost, dwarfing other goods): Do these escape fanaticism by making some payoffs incomparable? Or does EV maximization implode here?"  
     *Likely reply: "Lexicography violates continuity; EV requires finite trade-offs."*  
     → **Follow-up:** "But if rational agents can have lexical priorities (common in deontology), doesn’t this show EV is inadequate *even before* fanaticism? Is fanaticism just a symptom of EV’s deeper flaw with strong hierarchies?"

  **Round 5: Self-Undermining & Practical Coherence**  
  *(Press real-world implications)*  
  9. "Your 'probability noise' argument cuts both ways. If 10⁻¹⁵ disaster probabilities carry 'no information,' doesn’t this *also* undermine spending billions on mitigating them (e.g., asteroid deflection)? How do you justify x-risk reduction without endorsing Pascal's Mugging?"  
     *Likely reply: "Catastrophic risks often have structured evidence (e.g., physics models), unlike mugger's promises."*  
     → **Follow-up:** "Many x-risks involve complex cascades (e.g., AI alignment) with wildly uncertain probabilities. If I argue they’re below *your* noise floor, how do you rebut this without a bright line?"

  10. "If EV maximization requires dedicating life to chasing vanishingly likely cosmic payoffs, it becomes self-effacing: no rational agent could live a normal human life. Is this a *virtue* (showing rationality transcends practicality) or a *fatal flaw*?"  
      *Likely reply: "Ideal theory guides; practical agents use heuristics."*  
      → **Follow-up:** "But if the heuristics systematically avoid the theory’s prescriptions (e.g., ignore tiny probabilities), doesn’t this suggest the theory is *incorrect*, not just hard to implement?"

  **The Closer: Falsifiability**  
  11. "What evidence or argument *could* convince you that fanaticism is a reductio against EV maximization itself? Is there a conceivable scenario where exact probabilities + finite utilities + EV axioms yield an *inescapably absurd* prescription?"  
      *Likely reply: "If it violated dominance or transitivity without recourse, I’d reconsider."*  
      → **Follow-up:** "But in the verified 1-in-10¹² lottery case, EV *does* mandate ruinous bets without violating axioms. Is that prescription truly non-absurd? Or is your threshold for 'reductio' set impossibly high?"

  **Key Angles Covered:**  
  - **Exact probabilities** (Q2, Q3, Q4 follow-up) force bullet-biting.  
  - **Self-undermining** (Q9) challenges consistency on x-risks.  
  - **Unmeasurable probability** (implied in Q3 noise floors; explicit in Q7 infinities).  
  - **Practical incoherence** (Q10) questions self-effacement.  
  - **Mundane chains** (Q6 on insufficient reason + many payoffs).  
  - **Reductio test** (Q11).  

  Each question isolates a pressure point while respecting her framework. The sequencing forces her to defend the coherence of the noise floor, admit axiomatic costs, and confront the theory’s most extreme implications. Good luck—make her work!
