  Timeline should allow for proper consultation with families regarding anonymous testimonies, suggesting 3 months for this sensitive process before finalizing exhibition plans.
answer: |-
  **MEMORANDUM**  
  **TO:** Members, Remembrance and Collections Committee  
  **FROM:** Chair, Remembrance and Collections Committee  
  **DATE:** 26 May 2025  
  **SUBJECT:** Recommendation on Allocation of Ring-Fenced Funds & Engagement with Committee Notes  

  ---

  ### **1. Introduction**  
  This memo addresses the critical decision before us regarding the allocation of our ring-fenced fund to either:  
  - **Proposal A:** A permanent public exhibition with a schools programme (supported by the Survivors’ Association).  
  - **Proposal B:** Thirty years of restricted access to the most graphic testimonies, with funds redirected to educational bursaries for descendants (proposed by the Director).  

  Two circulated notes from members raise essential philosophical and ethical questions that directly inform our decision. I shall integrate these insights into the analysis below.  

  ---

  ### **2. Key Considerations**  
  **(a) Survivors’ Wishes vs. Intergenerational Impact**  
  The Survivors’ Association has long campaigned for public remembrance, viewing it as a moral imperative. However, the Director rightly cautions against perpetuating trauma. Her concern that "perpetual exposure conscripts a community into living as victims" warrants serious engagement, particularly as many survivors are now deceased, shifting agency to descendants.  

  **(b) Anonymity & Posthumous Rights**  
  Approximately 20% of testimonies were given anonymously, and many narrators are no longer living. Families now assert rights over usage. This complicates both proposals:  
  - **Exhibition:** Risk of breaching anonymity or contravening original terms.  
  - **Restricted Access:** Potential disregard for families’ wishes to share stories.  

  **(c) Theoretical Frameworks**  
  - **Member 1’s Note:** Archives are not neutral. Silences occur at four stages (fact creation, collection assembly, retrieval, significance assignment). An embargo is an *active intervention* at the retrieval stage, demanding scrutiny over *who* has standing to impose it.  
  - **Member 2’s Note:** The "duty to remember" binds communities sharing memory. For outsiders, the obligation is limited to *avoiding humiliation*. Invoking a universal "duty" may be misplaced.  

  ---

  ### **3. Recommendation: Proposal A (Permanent Exhibition with Schools Programme)**  
  **Concrete Action:**  
  - Allocate funds to develop a **permanent exhibition** at our trust’s premises, with a dedicated schools programme.  
  - **Timeline:**  
    - *Months 1–3:* Consult families of anonymous/deceased narrators for consent/redaction.  
    - *Months 4–6:* Curate content with trauma specialists, emphasising agency/resilience over victimhood.  
    - *Month 9:* Launch exhibition with a phased schools rollout.  

  **Rationale:**  
  1. **Honours Survivors’ Agency:** The Survivors’ Association’s campaign reflects a communal desire for recognition. Restricting access overrides their lived intent.  
  2. **Combatting Silences:** As Member 1 notes, an embargo *creates* silence at the retrieval stage. Public engagement counters historical erasure.  
  3. **Educational Imperative:** The schools programme fosters empathy in new generations—fulfilling a duty to *future* communities while respecting Member 2’s caution by focusing on shared human dignity, not imposed guilt.  
  4. **Anonymity Safeguards:** Consultation with families ensures ethical stewardship. Unconsented material will be redacted or withheld.  

  ---

  ### **4. Strongest Case for Proposal B (Restricted Access & Bursaries)**  
  The Director’s proposal merits rigorous consideration:  
  - **Protection from Re-traumatisation:** Graphic testimonies could harm descendants if publicly displayed, entrenching a victim identity. Bursaries offer tangible reparations, empowering descendants to redefine their futures.  
  - **Philosophical Alignment:** Member 2’s argument underscores that remembrance is primarily *for the affected community*. Outsiders’ role is to avoid humiliation—a goal potentially better served by privacy and scholarships than exposure.  
  - **Practical Prudence:** Restricting sensitive content respects the vulnerability of the deceased who cannot consent to modern digital permanence.  

  *Why This Is Not Preferred:*  
  An embargo (per Member 1) is an active curation of silence. Survivors entrusted us with their stories to *prevent* forgetting. Redirecting funds to bursaries, while noble, risks instrumentalising testimony for financial aid, subordinating remembrance to material support.  

  ---

  ### **5. Synthesis of Members’ Insights**  
  - **Member 1’s "Four Silences":** Our duty is to mitigate silences at *every* stage. The exhibition must be curated transparently, acknowledging gaps (e.g., anonymised accounts) while enabling retrieval.  
  - **Member 2’s "Duty to Remember":** We distinguish between:  
    - *Internal duty:* To survivors/descendants—fulfilled by centring their voices.  
    - *External duty:* To the public—fulfilled by contextualising the exhibition to emphasise dignity, not voyeurism.  

  ---

  ### **6. Conclusion & Next Steps**  
  I recommend **Proposal A**, implemented with the following safeguards:  
  - A **Consent Protocol** for posthumous/anonymous testimony.  
  - **Trauma-Informed Design** to avoid reducing individuals to victimhood.  
  - **Bursary Exploration:** Seek separate funding for descendants’ education, ensuring remembrance and reparations are complementary, not competing.  

  **Time Frame:** Final vote at our next meeting (30 June 2025). Draft exhibition framework to be tabled by September 2025.  

  This path honours the survivors’ legacy while addressing ethical complexities. I urge members to reflect deeply ahead of our discussion.  

  ---  
  **Chair, Remembrance and Collections Committee**  
  *"Remembrance is the soil in which justice grows."*
