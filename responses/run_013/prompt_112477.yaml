  A balanced approach seems best: proceed with the exhibition but with careful curation that respects anonymity concerns and contextualizes the material to avoid reducing survivors to victimhood. The bursaries could be funded separately. This honors the survivors' campaign while addressing the director's valid concern about perpetual victimhood.

