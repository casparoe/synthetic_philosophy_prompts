prompt: |-
  I am a final-year philosophy undergraduate enrolled in a seminar on the ethics of human reproduction, and I am completing a practicum placement with the clinical ethics service of a large academic fertility centre. The centre has recently begun offering, alongside standard preimplantation genetic testing for chromosomal and single-gene conditions, a polygenic screening service that returns a relative score for a panel of traits: some plainly medical (type 2 diabetes, coronary artery disease), some borderline (adult height, educational attainment), and some that the laboratory itself files under psychiatric or behavioural. The ethics committee has asked me to draft the decision procedure its consultants should use when a prospective parent asks, during a fifteen-minute consent conversation, whether they are obliged, permitted, or forbidden to choose one embryo over another on the strength of these scores. The procedure must be usable by a clinician with no philosophical training, it will be run several times a week, and the committee will review it line by line, because every selection made under it is irreversible and bears on a person who cannot consent.

  I want the procedure grounded in the principle of procreative beneficence and in the liberal-eugenics attempt to separate permissible from impermissible selection, but I do not want a summary of that literature. I want the principle turned into steps a consultant can actually run, whether as a checklist or as a flowchart in words: the questions to ask, in order, what counts as a sufficient answer to each, where the procedure returns a verdict, and where it stops and hands the decision back to the prospective parent because the remaining question is one of values rather than facts.

  The procedure has to face, explicitly, at least the following; for each, say whether it is a step the consultant can run or a point at which judgment cannot be eliminated:

  - that the embryo not chosen is not thereby harmed, so that the ordinary vocabulary of harm and of the child's best interests may not apply, and what comparative test should take its place;
  - the choice of comparison class: which possible children the prospective parent's actual choice is being measured against;
  - the aggregation problem when the highest-scoring embryo on one dimension is the lowest on another;
  - whether the procedure may, or must, override a prospective parent who prefers a trait the scores rank low, or who declines to select at all;
  - whether the distinction between selecting against a condition and selecting for an enhancement survives translation into a usable procedure, or collapses.

  Then run the procedure on three cases and give me its verdicts:

  (a) two embryos, one of which carries a variant for a condition that the prospective parents regard as an acceptable and even welcome way of life, the other not;
  (b) two embryos, where the one with the higher score for a trait the parents value also carries the higher risk for a serious late-onset disease, and the other reverses the two;
  (c) a single prospective parent with one viable embryo, asking the consultant to certify that proceeding is the morally required choice.

  I would like at least one of these verdicts to be one that the committee and I will find uncomfortable, and I would like you to say plainly which parts of the procedure are substantive moral commitments I am smuggling in under the guise of clinical method. Finally, tell me what the procedure cannot do — the decisions it will get wrong or leave unresolved — and whether the principle of procreative beneficence, once operationalised this way, still says what its defenders take it to say.
reasoning: |-
  Hmm, the user is a final-year philosophy undergraduate working on an ethics practicum at a fertility center. They need to develop a decision procedure for polygenic embryo screening that clinicians can use in 15-minute consent conversations. This is quite complex with high stakes - irreversible decisions affecting future persons who can't consent.

  The key requirements are:
  - Grounded in procreative beneficence and liberal eugenics principles
  - Practical for non-philosophy trained clinicians (checklist/flowchart format)
  - Must address five specified conceptual challenges
  - Needs to output clear verdicts on three test cases
  - Should include at least one uncomfortable conclusion
  - Must reveal where moral commitments are disguised as clinical method
  - Should identify limitations of the procedure

  The five conceptual challenges to address:
  1) Harm framework - since unchosen embryos aren't harmed, need alternative comparative test
  2) Defining comparison class - which possible children to measure against
  3) Aggregation problem - handling conflicting trait scores
  4) Override authority - when can clinicians override parental preferences
  5) Treatment/enhancement distinction - whether it collapses in practice

  For the test cases:
  a) Embryo with "acceptable" condition vs. without
  b) Trade-off between desired trait and disease risk
  c) Single embryo scenario - is proceeding morally required?

  I'll build a flowchart-style procedure with clear branching logic. The harm issue needs special handling - since unchosen embryos aren't harmed, we'll shift to "expected welfare range" comparison. For comparison class, we'll limit to the existing embryo cohort. Aggregation will use a threshold approach to avoid direct trade-offs. Override capability will be minimal (only for clear harm risks). The treatment/enhancement distinction will be operationalized through medical necessity.

  The three test cases will demonstrate:
  a) Permitted selection against the condition (uncomfortable for disability advocates)
  b) Parental discretion in trade-off situations
  c) No moral requirement to proceed with single embryo

  Important to flag where moral assumptions creep in:
  - Defining "significant disadvantage" is value-laden
  - The 1-in-200 prevalence threshold is arbitrary
  - Medical/social trait distinction reflects contested boundaries
  - The whole approach prioritizes welfare over other values

  Limitations to acknowledge:
  - Can't resolve fundamental value conflicts
  - Fails for non-quantifiable traits
  - Doesn't address distributive justice concerns
  - May pathologize normal variation
  - Procreative beneficence becomes constrained and procedural - a far cry from its original formulation
answer: |-
  Below is a clinically operationalized decision procedure for polygenic embryo selection, grounded in **procreative beneficence** (PB: "select the embryo most likely to have the best life") and **liberal eugenics** (permissible selection avoids harm/promotes welfare; impermissible selection reinforces oppression or treats traits as inherently inferior). It is structured as a flowchart with verbal prompts, verifiable thresholds, and explicit handoff points. Moral commitments are flagged in **bold**.

  ---

  ### **DECISION PROCEDURE: POLYGENIC EMBRYO SELECTION**  
  *For use in 15-minute clinical consent conversations*  

  **START**  
  **Clinician asks:** *"What traits are you hoping to screen for?"*  
  *(Document responses. Proceed to Step 1.)*  

  ---

  #### **STEP 1: CLASSIFY THE TRAIT(S)**  
  - **Clinician determines:** Is the trait in question **medical**, **borderline**, or **behavioral** per lab classification?  
    - **Medical:** Directly linked to serious health impairment (e.g., type 2 diabetes, coronary artery disease).  
    - **Borderline:** Associated with social functioning but not intrinsically harmful (e.g., height, educational attainment).  
    - **Behavioral/Psychiatric:** Neurological/cognitive traits (e.g., ADHD risk, depression risk).  
  - **Procedure:**  
    - **IF MEDICAL:** Proceed to Step 2.  
    - **IF BORDERLINE/BEHAVIORAL:** Skip to Step 4.  
    - **IF MULTIPLE TRAITS:** Address medical traits first.  

  ---

  #### **STEP 2: MEDICAL TRAIT ASSESSMENT**  
  **Clinician asks:** *"Does this condition cause significant pain, disability, or early death?"*  
  - **Sufficient answer:**  
    - **YES** (e.g., 80% lifetime risk of early cardiac death) → Proceed to Step 3.  
    - **NO** (e.g., 20% risk of late-onset manageable disease) → Skip to Step 4.  
    - **UNCERTAIN** (e.g., psychiatric condition with variable penetrance) → Handoff to parents: *"This involves value judgments about disability. You must decide."*  

  ---

  #### **STEP 3: HARM/INTEREST TEST (Replaces "best interests")**  
  **Clinician asks:** *"Would bringing this child into existence with this trait likely place them in the bottom 10% of expected welfare for their society, compared to children without it?"*  
  *(Comparison class: General population of future children in the same society.)*  
  - **Sufficient answer:**  
    - **YES** (e.g., embryo with 95% risk of severe pediatric cancer) → **SELECTION PERMITTED AGAINST this trait.**  
    - **NO** (e.g., 30% risk of adult-onset hypertension) → Proceed to Step 4.  
    - **AGGREGATION CONFLICT?** (e.g., high cancer risk but high IQ) → Clinician **cannot resolve**. Handoff: *"You must weigh these trade-offs."*  

  ---

  #### **STEP 4: NON-MEDICAL TRAIT ASSESSMENT**  
  **Clinician asks:** *"Is this selection intended to avoid social disadvantage or to achieve an advantage?"*  
  - **Avoid disadvantage?** (e.g., selecting against low educational attainment in a society where this limits opportunity):  
    - **IF YES** → Proceed to Step 5.  
  - **Achieve advantage?** (e.g., selecting for top 1% height) → **SELECTION FORBIDDEN.** Clinician: *"PB does not permit enhancement. We cannot prioritize this."*  
    - **Parent insists?** → **OVERRIDE FORBIDDEN.** *"This exceeds clinical ethics boundaries."*  

  ---

  #### **STEP 5: DISADVANTAGE THRESHOLD TEST**  
  **Clinician assesses:** Does the trait correlate with **systemic social harm** (e.g., discrimination, poverty)?  
  - **Threshold:** Disadvantage must be **statistically severe** (>2x population-average risk of harm) and **non-controversial** (e.g., evidence from national health/economic databases).  
    - **YES** (e.g., IQ <70 in societies without robust support systems) → **SELECTION PERMITTED AGAINST trait.**  
    - **NO** (e.g., "low athleticism") → **SELECTION FORBIDDEN.**  
    - **BORDERLINE?** (e.g., autism risk in a society with poor accommodations) → **Handoff:** *"This depends on your values. You decide."*  

  ---

  #### **VERDICT LOGIC**  
  - **Permitted:** Selection against traits failing Steps 3 or 5.  
  - **Forbidden:** Selection for enhancements (Step 4) or against non-harmful traits (Step 5).  
  - **Handoff:** Value conflicts, aggregation problems, or ambiguous disadvantage.  

  ---

  ### **APPLICATION TO TEST CASES**  
  **(a) Two embryos: One carries variant for deafness (parents welcome it); other does not.**  
  - Step 1: Medical (deafness).  
  - Step 2: Does it cause "significant disability"? **Handoff** → *Parents' values determine if deafness is disabling. Procedure returns no verdict.*  
    - **Verdict:** **Permitted to select either embryo.** (Uncomfortable: PB is neutral if disability is not objectively harmful.)  

  **(b) Two embryos: Embryo A (high IQ + high Alzheimer's risk); Embryo B (average IQ + low Alzheimer's).**  
  - Step 2: Alzheimer's is medical → Step 3: Late-onset→ unlikely "bottom 10% welfare" → Proceed to Step 4.  
  - Step 4: IQ selection → "Achieve advantage?" **YES → Forbidden.**  
    - **Verdict:** **Permitted to select Embryo B (lower risk)** but **forbidden to select Embryo A for IQ.**  

  **(c) Single prospective parent, one viable embryo.**  
  - Step 1: No selection possible → Clinician: *"Procreative beneficence does not apply when no choice exists."*  
  - **Verdict:** **No moral requirement to proceed.** PB only governs selection between possible children.  

  ---

  ### **SUBSTANTIVE MORAL COMMITMENTS SMUGGLED IN**  
  1. **Welfare is quantifiable** (Step 3's "bottom 10%" threshold implies a utilitarian calculus).  
  2. **Disability is contextually harmful** (Step 3 overrides parental acceptance of disability if societal harm is severe).  
  3. **Enhancement is impermissible** (Step 4 bans selection for advantage, prioritizing harm-avoidance over flourishing).  
  4. **Social justice trumps parental autonomy** (Step 5 permits selection against traits tied to systemic oppression).  

  ---

  ### **WHAT THE PROCEDURE CANNOT DO**  
  1. **Resolve aggregation conflicts** (e.g., high IQ + high depression risk). Handoff is unavoidable.  
  2. **Handle contested disabilities** (e.g., autism). Relies on crude harm thresholds.  
  3. **Prevent "ratcheting"** (e.g., permitting selection against "low IQ" indirectly enables enhancement).  
  4. **Address embryos with equal scores** → Verdict: Random selection.  
  5. **Justify non-selection** → Parents may decline screening without override.  

  ---

  ### **DISTORTION OF PROCREATIVE BENEFICENCE**  
  Operationalized PB **abandons its core ideal**:  
  - **Original PB**: "Select the *best possible* child."  
  - **This procedure**: "Avoid the *worst permissible* child."  
  It becomes **prohibitive** (forbidding enhancements) and **minimalist** (focused on harm). The "best life" collapses to "not the worst life," constrained by societal norms. Liberal eugenics survives only by conceding that most traits are beyond justifiable selection.  

  ---  
  **Final Note for Committee Review**: This procedure errs toward caution, forbidding all enhancements and handing off ambiguous cases. It prioritizes clinical feasibility but encodes contentious moral views. Recommend pilot testing with mock consultations to stress-test thresholds.
