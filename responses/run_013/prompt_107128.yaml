answer: |-
  ### Exam Question  
  **Rationality and Collective Decision-Making: Final Examination**  
  **Time Allowed: 75 minutes**  
  **Marks: 20**  

  ---

  **Question:**  
  *The Terraflux Initiative* involves eight independent research teams evaluating a new atmospheric purification technology. Each team conducts private analysis and forms an estimate of the technology’s net value (benefits minus risks). Any team can unilaterally initiate a field trial; once one team acts, no other may proceed. Trials are irreversible and costly.  

  Analysis reveals that teams’ estimates of net value are:  
  - Independently derived,  
  - Unbiased (centered on the true net value \( V \)),  
  - Subject to random error (noise) due to methodological limitations.  

  **Part A (10 marks):**  
  Explain why the *first team to initiate a trial* is likely to substantially overestimate the technology’s net value. Describe the precise mechanism, specifying which assumptions are essential.  

  **Part B (6 marks):**  
  Suppose the decision rule changes: a trial occurs only if **at least five teams** independently vote to approve it (based on their estimates). Would the problem identified in Part A still manifest? What if approval requires **unanimous consent**? Justify your answers.  

  **Part C (4 marks):**  
  Now assume teams’ estimate variations arise **not from noise, but from asymmetric access to critical data** (e.g., Team 1 has superior regional climate models). The most optimistic team is typically the best-informed. How does this alter—or reverse—the dynamic from Part A? Explain briefly.  

  ---

  ### Model Answer (≈600 words)  

  **Part A:** The unilateralist’s curse occurs because the first actor to act is the one with the highest estimate of net value. Since estimates are unbiased but noisy, they distribute symmetrically around the true value \( V \). The maximum estimate in a set of noisy unbiased estimates is statistically likely to exceed \( V \) (an *order statistic* effect). When any actor can trigger the action unilaterally, the actor whose estimate clears the action threshold (here, the highest estimate) is selected. Crucially, this actor’s optimism is more likely to reflect estimation error than accurate insight, as extreme values in a noisy distribution are outliers. The mechanism bites only if:  
  (i) Estimates are *unbiased* (centered on \( V \)); if estimates were systemically pessimistic, the highest might still be accurate.  
  (ii) Estimates contain *independent noise*; correlated errors weaken the curse.  
  (iii) The decision rule *selects the most optimistic actor* (via unilateralism).  

  **Part B:** The curse is not unique to unilateralism but arises under any decision rule that weights the upper tail of estimates. Under **majority rule (5/8 teams)**, the curse persists. A majority vote approves an action only if the *median* estimate exceeds the threshold. However, in a noisy distribution, the median estimate is still more likely to exceed \( V \) than fall below it when the true \( V \) is near the decision threshold (e.g., if \( V \) is slightly positive, noise skews the median upward). While less severe than under unilateralism (which uses the *maximum*), the curse remains because the vote aggregates estimates biased upward by noise.  

  Under **unanimity**, the curse *reverses*. Approval requires *all* estimates to clear the threshold. Here, the action is blocked if *any* team is pessimistic. Since the *lowest* estimate is likely to underestimate \( V \) (the lower tail of noise), unanimity is biased toward *inaction* even when \( V > 0 \). This is the "unilateralist’s curse in reverse": the most pessimistic actor (likely an error-driven outlier) effectively vetoes action.  

  **Part C:** If estimate variations reflect *genuine information differences* (not noise), the most optimistic team may be the best-informed. Selecting its estimate now leverages superior knowledge, potentially *improving* decisions. For instance, if Team 1’s optimism stems from unique data showing high efficacy in key regions, acting on its estimate could yield net gains. The curse "reverses" into a *blessing*: unilateral action by the most informed actor outperforms averaging or median votes. However, this assumes teams can reliably identify who is best-informed *ex ante*—which is often impractical. If teams *overestimate* their own information quality, noise may still dominate, restoring the curse.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  | **Points** | **Marks** | **Weak Answers Fail By...**                                                                 |  
  |------------|-----------|---------------------------------------------------------------------------------------------|  
  | **1. Mechanism & Assumptions:** Correctly identifies that the highest estimate acts; explains noise + unbiasedness as key; notes order statistic effect. | 6 | Vaguely describing "over-optimism" without statistical mechanism; omitting unbiasedness or noise independence. |  
  | **2. Decision Rule Generalization:** Recognizes that majority rule suffers a milder curse (upper-tail selection); explains unanimity’s reverse curse (lower-tail selection). | 6 | Treating curse as exclusive to unilateralism; not linking rules to statistical tails. |  
  | **3. Information Asymmetry Shift:** Explains how genuine information superiority reverses the curse; notes dependence on accurate ex-post validation. | 4 | Asserting the curse vanishes without justifying *why*; ignoring the reversal/improvement. |  
  | **4. Threshold Clarity:** Explicitly ties action to crossing a net-positive threshold in all scenarios. | 2 | Implicitly assuming thresholds without stating them. |  
  | **5. Precision & Conciseness:** Avoids extraneous examples; uses formal terms (e.g., "order statistic," "median estimate"). | 2 | Meandering; conflating with unrelated concepts (e.g., tragedy of the commons). |  

  ---

  Crux: **The curse stems from selecting actions based on extreme values in a noisy distribution, not merely from unilateral authority.**
