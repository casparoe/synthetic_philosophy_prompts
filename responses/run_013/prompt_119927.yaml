answer: |-
  ## The Illuminated Stewardship: Sor Juana’s Enduring Call at St. Jerome’s Sesquicentennial

  Your Excellency, esteemed alumnae, honoured guests, cherished colleagues and friends,

  One hundred and fifty years. A century and a half since the Sisters of Divine Providence, driven by a profound sense of purpose, laid the cornerstone of St. Jerome’s College for Women. From a foundation rooted in faith, we have journeyed into an era of secular inquiry, yet the flame lit then – the commitment to nurturing the female intellect – burns ever brighter. Today, we gather not merely to celebrate longevity, but to rekindle the profound *why* behind this institution. And for that, we turn to a luminous mind from another century, the remarkable Sor Juana Inés de la Cruz.

  Sor Juana, that brilliant star of the New World Baroque, faced a world far more circumscribed than our own. When challenged, most famously by a Bishop, on the propriety of her vast scholarly pursuits, her defence was not, as some might hastily assume, a simple cry for personal freedom or parity. It was, fundamentally, a deeply *theological* argument, articulated with piercing clarity and profound humility.

  Her core contention, as I understand it, centred on intellectual *diligence* as a sacred imperative. For Sor Juana, the cultivation of the mind was not an optional adornment, nor a privilege claimed by the individual, but a form of *stewardship* demanded of every soul endowed with reason. Ignorance, particularly wilful ignorance concerning matters divine, was not neutral; it was, in her view, a form of *culpable negligence*. To refuse to engage the intellect God bestowed was to neglect a divine gift, to bury a talent entrusted to one’s care.

  Crucially, she argued that the defence of the Faith itself – that sacred trust passed down through generations – required the full deployment of *all* capable minds. The complex questions posed by critics, the intricate tapestry of scripture and doctrine, demanded rigorous engagement. To silence half the human family, to leave untapped the intellectual capacities of women, was, Sor Juana insisted, to weaken the Church’s very ability to articulate and defend its truths. The labour of understanding, of formulating responses, of deepening faith through reason – this was not a masculine preserve, but a *communal labour* essential to the integrity of the whole Body of Christ. Failure to harness the intellectual capacities of women rendered the Church’s defences perilously incomplete.

  This brings me to a perspective, deeply resonant with Sor Juana’s spirit though perhaps not explicitly stated in her *Reply*, that I believe demands our consideration today. It builds upon her central insight about the Church’s need for its full intellectual strength.

  Let us contemplate this: **When the Church, or any community aspiring to uphold profound truths, systematically excludes women from the rigorous cultivation of theological understanding – from the deep wells of scripture, philosophy, and doctrine – it commits an act of profound, self-inflicted impoverishment. It is, in essence, a form of theft.**

  **Your Excellency,** consider this stewardship: the Church possesses an immeasurable intellectual inheritance, a treasury of wisdom accumulated over millennia. Its mission – to preach, to teach, to engage a questioning world – is colossal. Yet, if this mission is to be fulfilled with vigour and credibility, it requires every capable mind dedicated to the task. To deliberately neglect the formation of half its potential theologians, philosophers, and apologists – the minds of its women – is to knowingly deprive the Church itself of indispensable resources. It is like locking away half the tools needed to build and repair the sacred edifice. It leaves the community vulnerable, less able to articulate its depths, less equipped to answer legitimate challenges, less capable of offering the profound wisdom it holds. This exclusion is not merely a denial *to* women; it is a theft *from* the Church, diminishing its capacity to serve its divine purpose. The stewardship of truth demands we cultivate *all* the intellectual gifts bestowed upon the faithful.

  **And to my friends who champion the secular ideals of women’s advancement,** I offer this parallel consideration: The intellectual labour Sor Juana championed, and which St. Jerome’s has fostered for 150 years, transcends the purely personal. While individual fulfilment is a worthy consequence, the deeper value lies in the *contribution* this cultivated intellect makes. When a woman’s mind is honed, when her capacity for rigorous thought, critical analysis, and creative insight is developed, it represents an immense potential energy for the betterment of the *whole community* – whether that community is defined by faith, nation, or humanity itself. To deny access to formal structures of learning, particularly in fields shaping our deepest values and understanding, is not only to hinder the individual, but to *deprive society* of perspectives, solutions, and wisdom it desperately needs. It is a theft from the common good, a wilful neglect of a vast reservoir of intellectual power essential for addressing complex, shared challenges. The stewardship of our collective future demands we utilise *all* available intellectual resources.

  Sor Juana navigated this tension between intellectual aspiration and humility with grace. She understood that the pursuit of knowledge must be grounded in *service* – service to Truth, service to God, service to the community. The intellect, diligently cultivated, is not a tool for self-aggrandisement, but a vessel for deeper understanding and more effective contribution. The humility lies not in shrinking from one’s God-given capacity, but in recognising that this capacity exists *for* something greater than oneself. True obedience, in this light, is obedience to the call to use one’s gifts fully and faithfully for the purpose for which they were given.

  This, then, is the enduring legacy we honour at St. Jerome’s. It is not merely the right to learn, but the sacred *duty* to cultivate. It is not a demand for equality for its own sake, but a profound recognition of the *collective necessity* of intellectual stewardship. From its religious origins to its secular present, this college has stood for the principle that the illumination of the female mind is not a luxury, nor a threat, but an essential investment in the strength, resilience, and wisdom of the wider world.

  For 150 years, St. Jerome’s has countered the theft of potential. It has been a forge where intellect is honed not merely for individual distinction, but for purposeful contribution – whether within sacred sanctuaries, secular institutions, or the myriad spaces where human understanding meets human need. It has affirmed that the defence of cherished values, the articulation of profound truths, and the navigation of a complex world require the fullest deployment of human reason, irrespective of gender.

  May we continue, inspired by Sor Juana’s unwavering conviction, to be faithful stewards of the luminous gifts of the mind. May we ensure that no potential is neglected, no talent buried, and that the intellectual wealth of all people is brought fully into the service of truth, understanding, and the common good. For in that stewardship lies our shared strength and our brightest future.

  Thank you.
