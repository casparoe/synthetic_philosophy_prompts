prompt: |-
  I write a column on science and ideas, and I am at work on a piece about expert disagreement: the kind that persists between people who respect one another, read the same literature, and have nothing material riding on the answer. Before I file it, I want to know whether my own reactions to a set of cases add up to a principle, because at the moment they seem to pull in two directions at once.

  I have been reading about Aumann's agreement theorem. As I understand it, two agents who start from the same prior probabilities and update by Bayes's rule cannot agree to disagree: if each agent's posterior probability for some event is common knowledge between them — each knows the other's number, knows that the other knows, and so on up the hierarchy — then the numbers must be identical. Disagreement that survives has to come from somewhere else: priors that were never shared, a failure of common knowledge, or a difference in how the two agents carve up what they know. I gather that in these models, if the two simply keep announcing their numbers to each other, they are bound to converge. I do not want a proof and I do not want a reading list; I want the principle, or the several rival principles, that my verdicts amount to.

  Here are the cases, with my verdicts.

  1. Two economists with the same training look at the same inflation data and forecast different numbers for next quarter. I think one of them has slipped up somewhere. The disagreement is a symptom; it is not itself a fact about the world.

  2. Same two, except that the gap traces to how much weight each puts on a price relationship that held before 2020. Neither has slipped up, and I would not be surprised if they never converge.

  3. A colleague I respect disagrees with me. I move a little; when I tell him I have moved, he moves a little; we end up somewhere in between. I think that is exactly the right behaviour, and I would distrust anyone who either refused to budge or collapsed at once to the other's view.

  4. Two people who disagree about a policy have never heard of the hypothesis the other is entertaining. I do not think there is a disagreement here to adjudicate at all.

  5. Two people agree on every probability and want opposite things done. I do not count the disagreement as a defect in either of them.

  6. A first-year student who has read a single paper rejects the settled view of a whole field. I think the student should defer, not that the field should move.

  7. Two people each read the other's stubbornness as evidence of bad faith rather than as evidence about the subject. Something has gone wrong, though I cannot say which of them is at fault.

  Where I get stuck: case 1 treats disagreement as an error while case 2 treats it as a legitimate difference in starting points, and I cannot say why a prior should be exempt from the standard I apply to inference, given that a prior is something I reason with rather than something I merely bring. Case 6 makes it worse, because there I want the differing starting point to be a reason to defer rather than a reason to settle into permanent disagreement. And case 3 embarrasses case 2: if the two economists in case 2 have nothing to reproach each other with, why do I feel that the two of us in case 3 owe each other movement?

  My working hunch is that a disagreement is legitimate when it comes from something the parties bring to the question and a defect when it comes from something they do with what they both have. I cannot make "bring" and "have" stay apart. Please test that hunch against the cases and repair it, or replace it.

  What I need: the principle, or a small set of rival principles, stated precisely enough to apply; for each clause, the case that forces it; what it predicts for cases I have not listed — in particular, a case where the parties share both the prior and the data but one of them is simply the poorer reasoner, a case where the disagreement is about how much to trust the other's opinion, and a case where the two parties disagree about what counts as the same evidence; and an honest account of which of my verdicts the principle cannot accommodate, together with whether you would give up the verdict or complicate the clause.
reasoning: |-
  Hmm, the user is a science columnist working on a piece about persistent expert disagreement. They've presented seven cases with their intuitive verdicts and are struggling to reconcile them, particularly the tension between treating disagreement as error (case 1) versus legitimate difference (case 2). Their working hunch distinguishes between what parties "bring" versus what they "do" with evidence, but they find this distinction unstable.

  The core problem seems to be reconciling three seemingly conflicting intuitions: (1) Disagreement can signal incompetence (case 1, 6), (2) Disagreement can be legitimate due to differing priors (case 2), yet (3) Rational agents should still update toward each other (case 3). Aumann's theorem creates pressure here because it suggests identical priors and perfect Bayesian updating should eliminate disagreement - but real experts never meet those ideal conditions.

  Key tensions in their cases:
  - Case 1 vs 2: Why treat inference errors differently from prior differences?
  - Case 2 vs 3: If priors are legitimate, why expect movement?
  - Case 6: Why demand deference for students but not experts?

  Their "bring vs do" hunch fails because priors are both "brought" AND used in reasoning. We need to reframe the distinction. Perhaps the crucial factor is whether the difference is justifiable to the other party. For example:
  - In case 2, pre-2020 weight is justifiable as professional judgment
  - In case 1, an inference error isn't justifiable
  - In case 6, the student's prior isn't justifiable to experts

  This suggests a principle like: Disagreement is legitimate when rooted in defensible interpretive frameworks that parties don't share, but defective when arising from misapplication of shared frameworks.

  Testing against their cases:
  - Case 1: Shared framework, so error
  - Case 2: Differing defensible frameworks
  - Case 3: Mutual recognition of defensibility prompts updating
  - Case 6: Student's framework indefensible to experts
  - Case 7: Failure to recognize framework differences as defensible

  The user also needs predictions for unlisted cases:
  - Poor reasoner: Defective (shared framework misapplied)
  - Trust disagreement: Could be legitimate if based on track record evidence
  - Evidence interpretation: Usually legitimate framework difference

  The principle won't perfectly handle cases where defensibility is contested (like climate change debates) - we might need to add that frameworks must be peer-credible within the field.
answer: |-
  Based on your cases and tensions, I propose a unified principle with two clauses to distinguish *legitimate* from *defective* disagreement. This resolves your "bring vs. do" tension by focusing on **shared justifiability** rather than origin. Here's the principle, followed by breakdown, case application, predictions, and limitations.

  ---

  ### **The Principle of Epistemic Legitimacy in Disagreement**
  **A disagreement is legitimate (not a defect) if and only if:**  
  1. **It stems from differences in defensible interpretive frameworks** (e.g., priors, models, or values) that are *not fully shared* between the parties; **and**  
  2. **The frameworks are mutually recognizable as rationally permissible** (even if not shared) given the evidence and epistemic context.  

  **A disagreement is defective (a symptom of error) if:**  
  - It persists *despite shared frameworks*, or  
  - One party’s framework is indefensible in the shared epistemic context (e.g., violates norms of evidence, rationality, or expertise).  

  ---

  ### **Why This Works for Your Cases**  
  | Case | Your Verdict | Principle’s Verdict | Key Clause |  
  |------|--------------|---------------------|------------|  
  | **1** | Defective (slipped up) | Defective | Shared training = shared framework. Different forecasts imply one misapplied reasoning. |  
  | **2** | Legitimate (no slip) | Legitimate | Pre-2020 weighting is a defensible modeling choice (framework difference). Mutually recognizable as valid. |  
  | **3** | Proper behavior (mutual movement) | Expected outcome | Movement occurs because each recognizes the other’s framework as defensible → Bayesian updating under mutual respect. |  
  | **4** | Not a real disagreement | Legitimate (but irrelevant) | No shared hypothesis → no shared epistemic context. Disagreement can’t be adjudicated (clause 2 fails). |  
  | **5** | Not defective | Legitimate | Framework difference is in values/goals (not truth-apt). Defensible if values are coherent. |  
  | **6** | Defective (student should defer) | Defective | Student’s framework (based on one paper) is indefensible in expert context. Experts share a justifiable prior. |  
  | **7** | Defective (bad faith) | Defective | Misinterpreting disagreement as bad faith rejects mutual recognizability (clause 2 violated). |  

  **Resolves Your Tensions:**  
  - **Case 1 vs. 2:** Priors *are* subject to scrutiny, but in Case 2, the pre-2020 weighting is a *defensible framework choice* (e.g., based on competing economic theories). In Case 1, the inference is indefensible given shared methods.  
  - **Case 2 vs. 3:** Case 2’s disagreement is legitimate, but Case 3 shows that mutual movement is rational *because* frameworks are defensible (updating on the other’s confidence as evidence).  
  - **Case 6:** The student’s prior isn’t defensible in the expert context (clause 2), so deference is required. Permanent disagreement in Case 2 is legitimate because *both* frameworks are defensible.  

  ---

  ### **Predictions for Unlisted Cases**  
  1. **Poorer reasoner (shared prior/data):**  
     - *Prediction:* Defective disagreement.  
     - *Why:* Shared frameworks, but one misapplies reasoning (e.g., math error). Violates clause 2 (indefensible inference).  

  2. **Disagreement about trust in the other’s opinion:**  
     - *Prediction:* **Legitimate** if based on defensible track records (e.g., "Your model failed post-2008, so I discount your view"). **Defective** if based on bias (e.g., "I distrust you because of your institution").  
     - *Why:* Trust assessment is part of the interpretive framework (clause 1). Defensible if evidence-based.  

  3. **Disagreement about what counts as "same evidence":**  
     - *Prediction:* **Legitimate** (e.g., in climate science, one includes paleoclimate data, the other rejects it as noisy).  
     - *Why:* Evidence selection is a framework difference. Defensible if methods are recognized in the field.  

  ---

  ### **Limitations and Uncomfortable Verdicts**  
  **Where the Principle Strains:**  
  - **Case 3’s "little moves" vs. Case 2’s non-convergence:** The principle *allows* but doesn’t *require* convergence in Case 2. If economists deem each other’s frameworks defensible but incompatible (e.g., Keynesian vs. Austrian), permanent disagreement is legitimate. This might feel unsatisfying, but it’s consistent.  
    - *Fix?* Stand firm: Real experts often agree on priors but not models. Non-convergence reflects deep uncertainty.  

  - **"Defensible" is context-dependent:** In fringe debates (e.g., flat-Earth), "defensible" collapses. The principle relies on a shared epistemic community.  
    - *Fix?* Add: "Defensible within a recognized epistemic community." Case 6’s student is outside this community.  

  - **Case 5 (values):** The principle legitimizes value disagreements, but you note they’re "not a defect." This works—unless values *are* the shared framework (e.g., both utilitarians disagreeing on probabilities).  
    - *Fix?* Clarify: Values are frameworks if they affect evidence-weighting (e.g., cost-benefit analysis). Pure preference disagreements aren’t "epistemic."  

  **Would I Give Up a Verdict?**  
  - **Case 6’s Deference:** If the student had a *defensible* framework (e.g., a proven new method), I’d reject your verdict. But your case specifies "a single paper" vs. "settled view," so indefensibility holds.  
  - **Case 7’s "Who’s at Fault":** The principle doesn’t assign blame, only labels the disagreement defective. I’d keep this—asymmetry is common (e.g., one actor bad-faith, the other justified).  

  ---

  ### **Core Insight**  
  Your cases reveal that **disagreement is legitimate when it reflects irreducible uncertainty under rational pluralism** (multiple defensible ways to interpret the world). It’s **defective when it reflects unforced errors or failures of epistemic duty**. Aumann’s theorem assumes identical priors and common knowledge—conditions your Cases 1, 4, and 6 violate. In the messy real world, *framework differences* explain persistent, respectful disagreement.  

  This principle honors your verdicts while resolving tensions. If you test-drive it in your piece, I recommend flagging the "mutual recognizability" clause—it’s what separates Case 2 (professionally valid divergence) from Case 7 (breakdown of trust).
