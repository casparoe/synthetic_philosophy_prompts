prompt: |-
  I am a survey methodologist by training: I design panel studies for a living and I think habitually in terms of target populations and study populations, sampling frames, coverage, unit and item non-response, weighting and post-stratification, and the total survey error way of splitting error into sampling error and its non-sampling cousins — coverage, non-response, measurement, processing — together with the rougher distinction between descriptive inference, where the goal is a quantity defined on a well-defined finite population, and analytic inference, where the goal is a relationship that is supposed to travel beyond the sample. Last night I spent three hours arguing with a close friend, a political philosopher, about the franchise: whether voting ought to be compulsory, whether the voting age should come down, and whether resident non-citizens should have a vote. We talked past each other almost continuously. His parting shot was that I was treating the demos as though it were a sample and the election as though it were an estimate, and that this was a category error rather than a technical disagreement. I suspect he was partly right, but also that the translation does more work than he is willing to allow.

  Your task is to act as a translator between the two vocabularies. Take the positions my friend and I were defending — the case for compulsory voting as a remedy for unequal participation, the case for a lower voting age, and the case for extending the franchise to non-citizens, together with the standard objections to each — and restate them as faithfully as you can in my vocabulary of survey design and measurement. Be scrupulous about not importing my framework's assumptions and then presenting the result as a translation: where a political claim is about authority, standing or legitimacy rather than about accuracy, say so, rather than silently redescribing it as a bias to be corrected. Then give me the residue report, and think carefully about the difference between a gap in my vocabulary and a sign that the original claim was less clear than it looked — that difference is the whole point of the exercise. You may plan privately, but the answer itself should contain only the list below.

  Give me your answer as a numbered list of exactly five points, each a sentence or two, with no introduction and no conclusion, ordered as follows: (1) the core translation, with the franchise question recast as a question of sampling design in my terms; (2) what happens to compulsory voting when it is recast as the elimination of non-response rather than its modelling; (3) what happens to a lower voting age when it is recast as an extension of the frame and of coverage; (4) what happens to votes for non-citizens when it is recast as a redefinition of the target population, and therefore of the estimand; and (5) the residue — what does not survive the translation at all, and whether that points to a gap in my vocabulary or to something in the political argument that was never a claim about measurement in the first place.
reasoning: |-
  Hmm, the user is a survey methodologist who had an argument with a political philosopher friend about voting rights. They want me to translate political concepts about franchise into survey methodology terms without distorting the original meaning. 

  I need to be careful here. The user explicitly warned against silently converting legitimacy claims into measurement bias claims. The core tension is between seeing elections as estimation problems versus expressions of political authority. 

  For point 1 (core translation): I'll frame franchise questions as sampling design issues. The demos isn't just a sampling frame - its definition is inherently political. But I can say defining the eligible electorate parallels defining the target population, while acknowledging this leaves out legitimacy questions. 

  Point 2 (compulsory voting): Must resist calling unequal participation "non-response bias" - that would smuggle in normative assumptions. Instead, I'll present it purely as removing non-response through forced participation, noting this bypasses the philosophical debate about voluntary participation. 

  Point 3 (voting age): This maps cleanly to frame extension. Lowering age = expanding coverage. But I should flag that age cutoffs involve normative judgments about maturity that surveys don't face. 

  Point 4 (non-citizen voting): Here the translation works - it's literally redefining the target population. But I must emphasize this doesn't engage the sovereignty arguments. 

  Point 5 (residue): This is crucial. All authority/legitimacy questions evaporate in translation. The gap isn't in the user's vocabulary - it reveals that political philosophy concerns different fundamentals. The "category error" charge is partially valid, but the translation still exposes operational consequences. 

  The user's friend was right that elections aren't just estimates, but wrong to dismiss the operational parallels. The residue shows where political philosophy must take over from methodology. I'll keep each point tight - no intros/conclusions as requested.
answer: |-
  1.  The franchise question translates to defining the target population for the electoral "survey," where the sampling frame (voter registry) operationalizes the demos; arguments over eligibility criteria are debates about the proper target population definition and the coverage error introduced by exclusions relative to that ideal definition, though the core dispute often concerns the source of authority for defining that target population (e.g., citizenship, affected interests) rather than measurement properties alone.
  2.  Compulsory voting, recast as eliminating non-response, directly forces participation (unit response) to remove non-response bias stemming from systematic differences between voters and non-voters; this treats unequal participation solely as a bias problem to be solved by maximising response rates, bypassing the normative debate about whether abstention is a legitimate form of expression or imposes an undue burden.
  3.  Lowering the voting age is recast as extending the sampling frame to include younger individuals, thereby reducing coverage error by including a previously excluded segment of the presumed target population (e.g., all residents above a certain age); this frames the debate as whether this group was erroneously excluded from the frame due to an incorrect operational definition of maturity/competence, sidestepping philosophical arguments about the nature of political capacity or childhood.
  4.  Extending voting rights to resident non-citizens is recast as redefining the target population itself (e.g., from "citizens" to "resident population") and thus changing the estimand (e.g., "the will of the citizenry" vs. "the will of affected residents"); this translation focuses on the operational consequence for population definition but cannot engage the core disputes about political membership, sovereignty, and the basis of legitimate authority inherent in citizenship.
  5.  The residue consists entirely of claims concerning political authority, legitimacy, expressive rights, the nature of political community, and the inherent value of voluntary participation; these concepts find no direct analogue in survey measurement vocabulary, revealing a gap where the framework addresses operational consequences but not the normative foundations defining *why* a specific population is the rightful source of authority or *how* participation should reflect consent – this residue stems from the argument's fundamental concern with legitimacy, not measurement clarity.
