prompt: |-
  I'm a backend engineer with no philosophy training, and I've got a grant application due in three weeks for one of those small foundations that funds independent researchers outside academia. Two pages max. The topic area is strong longtermism -- the idea that the top moral priority is making the very long-run future go well, because there's astronomically more value out there than in the present. Here's my half-formed idea, please turn it into an actual proposal.

  The debate as I understand it keeps circling the same things: whether the numbers are right, whether we can know anything about effects that far out, whether expected-value reasoning lets absurdly unlikely bets dominate everything, whether the whole thing paralyses you into doing nothing. What I haven't run into anyone pressing on is the *shape* of the bet. The longtermist case runs a single expected-value calculation over one enormous decision. But in betting and investing there's a well-known argument that you should not maximize expected value when a bad outcome ends the game for you -- if you only get to place the bet once and losing is absorbing, the arithmetic that says take it because the expectation is huge is misleading, because there's no averaging over many runs for the average to actually happen in. Repeated bets and one-shot bets come apart.

  So my question: does the case for strong longtermism depend on treating humanity's situation as a repeatable bet when it's really a one-shot, unrepeatable one? And if you replace expected-value maximization with a rule that forbids risking irreversible loss -- no one-way doors at civilizational scale, whatever the upside -- does longtermism survive in a weaker or altered form, and does the ranking among interventions change?

  Some things I want you to handle honestly, because I can see they might sink this:

  - The rule I'm gesturing at is defined for repeated bets. Applied to a single global one-shot choice it may not even be well-defined. If it isn't, say so and tell me what the best repair is, or whether the project should be about that failure instead.
  - I could write a little simulation of repeated vs. single-shot versions, but I suspect a simulation can't settle a single-shot normative question. Figure out what the code would and wouldn't be evidence for, and don't oversell it.
  - I don't know if this distinction is already standard in decision theory and I'm just re-inventing it badly. If the proposal needs a position stated, state it in two sentences; don't assume I know it.

  Give me: the question stated so it has a determinate answer; why the existing answers leave it open; what I'd actually do, month by month (I've got about four months of evenings and weekends, and I'm not going to learn decision theory from scratch); what a real result would look like; and what would count as the project failing, including the boring failure where the answer turns out to be that nothing changes because longtermist interventions are mostly risk-reducing anyway. No bibliography or citations -- refer to positions in plain language and I'll fill in the references myself later.
