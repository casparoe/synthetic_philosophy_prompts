prompt: |-
  Before I read any more theories of collective mentality, I want the desiderata for such a theory. The central case is the ant colony: Hofstadter's Aunt Hillary, the colony that behaves as a unified conversational partner in the Ant Fugue while each ant follows local rules and none represents the colony's goals. The question is whether a colony can have a mind—whether it can be a subject of mental predicates—and what any theory that answers yes or no must deliver. I want the specification any adequate theory of colony mentality must meet: what it must explain, which cases it must get right, which distinctions it must respect, and which empirical and conceptual results it must be consistent with, with the case or consideration behind each requirement. Then flag any pair of requirements you suspect cannot be jointly satisfied, and say which single requirement does the most to exclude the popular contenders. You may close with a brief assessment of the superorganism view, the intentional-stance view, and the distributed-cognition view against the list, but keep the weight on the desiderata themselves. Do not give me a bibliography or reading list; I want the criteria, not citations.

  The cases I want the theory to handle include at least: the ant colony as a persistent agent across ant turnover; the individual ant as a finite-state device with no colony-level representation; the brain as a system whose neurons are not conscious; the immune system as an adaptive, memory-bearing system without a unified subject; the termite mound built by stigmergy with no blueprint; the slime mold that solves a maze without neurons; the corporation as a legal person with distributed decision-making; the flock of starlings as a murmuration with no central control; the split-brain patient as a test of unity; a colony split into two viable halves; a colony whose ants are replaced one by one; a colony whose decision threshold is hijacked by a parasite; and a colony engineered to signal a binary choice by quorum, where the signal tracks a hidden food source. The distinctions I care about include mere aggregate versus integrated system, representation versus mere information, derived versus original intentionality, cognition versus consciousness, agency versus adaptive behavior, functional unity versus spatial contiguity, realizer versus realized, and subject versus process. The results the theory must not contradict include that ants follow local rules, that colony-level behavior can be adaptive without any ant understanding the problem, that pheromone fields can implement a kind of global workspace, that natural selection can produce adaptive behavior without a mind, and that the hard problem of consciousness and the combination problem remain unresolved.

  Write the desiderata as a numbered list. For each, state the requirement, give the case or consideration that motivates it, and mark it as non-negotiable or as a preference of a particular camp. Then identify any subset that is jointly unsatisfiable, and explain why. Finally, briefly say how the superorganism view, the intentional-stance view, and the distributed-cognition view fare against the list. Please write your answer in American English.
reasoning: |-
  Okay, let me tackle this user request about desiderata for collective mentality theories. The user wants a rigorous framework to evaluate theories like superorganism or distributed cognition, centered on ant colonies as the paradigmatic case. 

  First, I need to map all their specified cases and distinctions. The ant colony persistence during ant turnover is crucial - any theory must explain how identity survives component replacement. And the individual ant's simplicity matters: no ant represents colony goals, so emergence must be bottom-up. 

  The user's "must-not-contradict" list gives hard constraints. For example, pheromones acting as global workspace can't be handwaved - that's empirical fact. And natural selection producing adaptation without cognition is non-negotiable; we can't anthropomorphize evolution.

  Hmm, the toughest conflict might be between Emergent Subjectivity (colony as unified "I") and Physical Realization Constraint (no magic). Brains have neurons but no neuron is conscious - similarly, how could ant colonies have subjectivity without violating physicalism? If we insist on real subjectivity, we risk dualism; if we reduce it too much, we lose the "mind" part.

  For the three views: Superorganism crashes on the immune system case (it's adaptive but not a subject). Intentional-stance is too permissive - it'd call a thermostat an agent. Distributed cognition handles stigmergy well but struggles with unity in split colonies.

  The user clearly wants to avoid woolly metaphors. Every desideratum must trace back to concrete cases: termite mounds for stigmergy, slime molds for non-neural computation. I'll flag the corporation case as tricky - legal personhood isn't ontological, so the theory mustn't conflate them.

  Noticing they care about "subject vs process" distinction. That's key for consciousness questions. A colony might be a cognitive process without being a subject - like the immune system. But Aunt Hillary presents as a subject... hence the tension.
answer: |-
  Here are the desiderata for a theory of collective mentality, derived from your specifications:

  1.  **Persistent Identity Across Turnover:** The theory must explain how a collective (e.g., an ant colony) maintains its identity and agency as a single entity despite the complete replacement of its individual components (ants) over time. *Motivation:* Ant colony persistence despite ant lifespans. *Status:* Non-negotiable for theories affirming collective mentality.
  2.  **Emergent Functionality from Local Rules:** The theory must explain how complex, adaptive, seemingly goal-directed colony-level behavior arises solely from the interactions of individuals (ants) following simple, local rules without internal representation of colony-level goals or states. *Motivation:* Individual ants as finite-state devices; colony behavior without internal blueprints (termite mound stigmergy). *Status:* Non-negotiable.
  3.  **Non-Conscious Components:** The theory must account for how a system (e.g., a brain or colony) can possess mentality (cognition, agency) while its fundamental components (neurons, ants) demonstrably lack consciousness or high-level cognition. *Motivation:* Neurons aren't conscious; ants aren't conscious. *Status:* Non-negotiable.
  4.  **Adaptation Without Cognition (Component Level):** The theory must be consistent with the fact that highly adaptive, memory-bearing systems (e.g., the immune system) can exist and evolve without constituting a unified subject of experience or possessing mentality. *Motivation:* Immune system as adaptive, memory-bearing, but non-mental. *Status:* Non-negotiable.
  5.  **Stigmergic Coordination:** The theory must explain how decentralized coordination and complex structure formation (e.g., termite mound) can occur through indirect communication via the environment (stigmergy), without central control or planning. *Motivation:* Termite mound construction; pheromone trails in ants. *Status:* Non-negotiable for handling core biological cases.
  6.  **Non-Neural Cognition:** The theory must accommodate cognition and problem-solving (e.g., maze-solving) in systems lacking neurons or a central nervous system. *Motivation:* Slime mold computation. *Status:* Non-negotiable for broad applicability.
  7.  **Distributed Agency & Decision-Making:** The theory must account for agency and decision-making distributed across components without a central executive, potentially including formal organizations (corporations) governed by rules. *Motivation:* Corporate decision-making; murmuration of starlings; quorum sensing in ant colonies. *Status:* Non-negotiable for core cases.
  8.  **Test for Unity & Indivisibility:** The theory must provide criteria for assessing the unity of a collective subject and explain the consequences of division. *Motivation:* Split-brain patient; colony split into two viable halves. Does one mind split, cease, or were there two nascent minds? *Status:* Non-negotiable for affirming a unified subject.
  9.  **Gradual Replacement Robustness:** The theory must account for the persistence of collective identity and function when components are replaced gradually, potentially one-by-one. *Motivation:* Colony surviving gradual ant replacement. *Status:* Non-negotiable for persistence (complements Desideratum 1).
  10. **Vulnerability to Subversion:** The theory must explain how external agents can subvert collective decision-making processes by exploiting their mechanisms (e.g., hijacking quorum thresholds). *Motivation:* Parasite manipulating colony decision-making. *Status:* Non-negotiable (illustrates mechanistic dependence).
  11. **Tracking Without Representation:** The theory must explain how collectives can reliably track features of the environment and produce adaptive signals (e.g., binary choice tracking hidden food via quorum) without individual components necessarily representing those features or the collective goal. *Motivation:* Engineered binary choice colony; adaptive colony behavior sans ant comprehension. *Status:* Non-negotiable.
  12. **Distinguish Integrated System vs. Mere Aggregate:** The theory must provide criteria distinguishing a truly integrated collective *mind* or *agent* (like the target colony) from a mere aggregate or swarm (like a pile of sand or perhaps simple flocking without complex coordination). *Motivation:* Core distinction for the entire project. *Status:* Non-negotiable.
  13. **Address Representation vs. Information:** The theory must clarify the conditions under which information states within the collective (e.g., pheromone concentrations, neural activation patterns) constitute genuine *representations* (with intentionality) versus merely carrying information causally. *Motivation:* Key distinction in philosophy of mind; pheromone fields as information carriers. *Status:* Crucial, potentially negotiable in *how* addressed, but not whether addressed.
  14. **Account for Derived vs. Original Intentionality:** The theory must specify whether the intentionality (aboutness) of the collective's states (if any) is *original* (like human thoughts) or *derived* (like the meaning of words or computer symbols). *Motivation:* Fundamental issue for collective mentality (e.g., does "Aunt Hillary" *truly* mean things?). *Status:* Crucial, potentially a point of divergence between theories.
  15. **Distinguish Cognition from Consciousness:** The theory must clearly separate the conditions for collective *cognition* (perception, learning, decision-making, problem-solving) from the far more demanding conditions for collective *consciousness* or subjective experience. *Motivation:* Core distinction; avoids conflation; acknowledges unresolved Hard Problem. *Status:* Non-negotiable.
  16. **Distinguish Agency from Adaptive Behavior:** The theory must provide criteria for genuine collective *agency* (goal-directed action, potentially involving reasons) beyond merely exhibiting complex, adaptive, or functional behavior. *Motivation:* Key distinction; is a slime mold or immune system an *agent*? *Status:* Crucial, potentially negotiable in criteria, but distinction must be made.
  17. **Functional Unity Over Spatial Contiguity:** The theory must ground collective unity primarily in functional integration and causal interdependence, not physical contiguity or containment. *Motivation:* Corporations; distributed systems; potentially networked colonies. *Status:* Non-negotiable for relevant cases.
  18. **Respect Realizer/Realized Distinction:** The theory must avoid the mereological fallacy: it cannot uncritically ascribe properties of the whole system (the realized mind/agent) directly to its components (the realizing parts). *Motivation:* Neurons don't think; ants don't represent colony goals. *Status:* Non-negotiable.
  19. **Subject vs. Process Distinction:** The theory must address whether it posits a collective *subject* of experience (an "I") or merely a cognitive/adaptive *process*. *Motivation:* Core to the question "Can a colony *have* a mind?" vs. "Can it *do* mind-like things?"; split cases challenge subject-hood. *Status:* Fundamental, potentially defining different theoretical camps.
  20. **Consistency with Physical Realization Constraint:** The theory must be compatible with the view that mentality is physically realized and cannot involve fundamental causal powers or properties beyond those of physics and complex organization. *Motivation:* Requirement of naturalism; avoids vitalism or panpsychism unless rigorously argued for. *Status:* Non-negotiable for mainstream physicalism.
  21. **Explain Global Workspace-like Phenomena:** The theory must be compatible with empirical results showing how mechanisms like pheromone fields can facilitate system-wide information integration and access, functioning analogously to a global workspace, without implying a homunculus. *Motivation:* Pheromone fields implementing collective memory/communication. *Status:* Non-negotiable (empirical adequacy).

  **Suspected Joint Unsatisfiability:** Desideratum **3 (Non-Conscious Components)**, **19 (Subject vs. Process)**, and **20 (Physical Realization Constraint)** create significant tension with **8 (Test for Unity & Indivisibility)** for theories affirming collective *subjectivity*. If the realizing parts (ants, neurons) aren't conscious, and consciousness supervenes physically, how does a *unified* subjective perspective ("I") emerge at the collective level? The split-colony case intensifies this: if splitting creates two functional unities, does it create two subjects? If so, was the original not truly unified? If not, how is unity maintained? This mirrors the Combination Problem for panpsychism. **Desideratum 19** demanding clarity on subject vs. process is the key pressure point – insisting on a *real collective subject* (**19**) while respecting **3** and **20** makes satisfying **8** extremely challenging.

  **Most Excluding Requirement:** **Desideratum 2 (Emergent Functionality from Local Rules)** does the most to exclude popular contenders. It directly challenges theories that implicitly or explicitly rely on *any* component having representation of the collective level (e.g., some simplistic "hive mind" views or anthropomorphic interpretations). It forces the theory to explain high-level cognition and agency purely through local interactions, which many intuitive or folk-psychological approaches fail to do rigorously.

  **Brief Assessment of Views:**

  *   **Superorganism View:** Treats the colony as a single organism analog. *Fares Poorly:* Fails **4** (immune system isn't an organism/mental), **6** (slime mold isn't organismic), **12** (over-applies "organism"), **17** (over-emphasizes physical contiguity), **19** (often conflates functional unity with subject-hood). Might handle **1**, **9**, **10** via biological persistence metaphors.
  *   **Intentional-Stance View (Dennettian):** Attributes mentality based on predictive success of interpreting the system as a rational agent. *Fares Poorly:* Fails **12** (too permissive, may include thermostats), **13**/ **14** (sidesteps representation/intentionality nature), **15**/ **16** (conflates agency/adaptation, ignores consciousness), **19** (defines agency, not subjectivity). Excels at **7**, **11**, pragmatic aspects of **2** and **8**.
  *   **Distributed Cognition View:** Focuses on cognitive processes distributed across individuals and artifacts. *Fares Best:* Strong on **2**, **5**, **6**, **7**, **11**, **17**, **18**, **21**. Struggles with **1**, **8**, **9** (persistence/unity of identity), **12** (boundaries of the system), **14** (nature of intentionality), **15** (consciousness), **19** (subject vs. process). Clearly distinguishes cognitive processes (**15**, **16**, **19**) but may not satisfy the desire for genuine subjectivity/agency.
