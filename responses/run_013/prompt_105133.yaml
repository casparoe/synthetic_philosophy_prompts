  Below is a decision tree addressing the coherence argument for expected-utility maximization, starting from the exploitable agent premise. Each branch node is a contested question, phrased neutrally. Leaves are named (if standard) or marked "unnamed," with their most awkward commitment. The tree has **9 leaves** to ensure coverage, and flags collapses as requested.

  ### **Decision Tree**
  **Root:** An agent can be made to lose for sure by a sequence of trades it accepts (exploitability via money pump/Dutch book).

  ---

  **Branch 1: Does the defect lie in the preferences or the agent's situation?**  
  - **A. Preferences are defective** (the loss arises from irrational preferences).  
  - **B. Situation/counterparty are defective** (the loss arises from fragmented agency or a malicious trader).

  ---

  #### **Branch A (Preferences defective)**
  **Branch 2: Must the agent be a single locus of choice across time?**  
  - **A1. Yes** (exploitability requires a unified agent).  
  - **A2. No** (exploitability can target time-slices, each accepting their own trade).

  ##### **Sub-branch A1 (Single locus)**
  **Branch 3: Are incompleteness and intransitivity the same failure?**  
  - **A1a. Yes** (both produce identical exploitability).  
  - **A1b. No** (they are distinct failures).  

  ###### **Sub-branch A1a (Same failure)**  
  **Leaf 1: *Comprehensive Rationality* (unnamed)**  
  - **Commitment:** Must deem incompleteness as defective as intransitivity, though incompleteness alone doesn’t create cycles.  
  - **Path:** A → A1 → A1a  

  ###### **Sub-branch A1b (Different failures)**  
  **Branch 3.1: Does incompleteness only cause exploitability when a choice is forced?**  
  - **A1b1. Yes** (incompleteness is defective only if choices are unavoidable).  
  - **A1b2. No** (incompleteness is inherently defective, even without forced choices).  

  **Leaf 2: *Incompleteness-as-Practical-Defect* (unnamed)**  
