  ### Decision Tree for Consciousness Methods  
  *Starting commitment: Consciousness should be studied empirically, like any natural phenomenon.*  

  #### **Node 1:** When a subject reports their experience (e.g., "I see a face"), is this report **evidence about the conscious experience itself**?  
  - **Yes** → Go to Node 2.  
  - **No** → Go to Node 7.  

  #### **Node 2:** Can **trained subjects** produce more accurate/trustworthy reports than untrained ones?  
  - **Yes, training improves validity** → Go to Node 3.  
  - **No, training introduces bias or distortion** → Go to Node 4.  

  #### **Node 3:** How do **first-person reports** and **third-person data** (e.g., neural activity) interact?  
  - **Bidirectionally constrain each other** (mutual refinement) → **Neurophenomenology** (Varela, Thompson).  
    *Awkward commitment:* Requires reconciling subjective reports with objective data in a way that risks circularity.  
  - **One-way constraint** (reports inform third-person analysis only) → **Classical introspectionism** (Titchener, Wundt).  
    *Awkward commitment:* Assumes introspection is incorrigible despite evidence of suggestibility and bias.  

  #### **Node 4:** Do you use **phenomenological distinctions** (e.g., temporal flow of experience) to **design experiments** before collecting data?  
  - **Yes** → **Front-loaded phenomenology** (Gallagher, Zahavi).  
    *Awkward commitment:* Relies on pre-empirical phenomenological analysis that may not generalize across subjects.  
  - **No** → **Unoccupied position: "Direct naïve realism"**.  
    *Why empty?* Unattractive—untrained reports are treated as direct evidence, but their reliability is widely contested.  

  #### **Node 5:** Is the **experimenter’s own first-person experience** admissible as scientific data?  
  - **Yes** → **Unoccupied position: "Solipsistic phenomenology"**.  
    *Why empty?* Incoherent—science requires intersubjective validation, not private data.  
  - **No** → Go to Node 6.  

  #### **Node 6:** When reports and third-person data conflict, which takes priority?  
  - **Reports** → Classical introspectionism (loop back to Node 3 outcome).  
  - **Third-person data** → **Illusionism** (Frankish).  
    *Awkward commitment:* Denies phenomenal consciousness exists, despite reports implying it.  

  #### **Node 7:** Are subject reports treated as **evidence about beliefs/dispositions**?  
  - **Yes** → Go to Node 8.  
  - **No** → **Hard behaviorism/eliminativism** (Skinner, radical behaviorism).  
    *Awkward commitment:* Dismisses first-person ontology entirely, making consciousness itself a fiction.  

  #### **Node 8:** Is **"bracketing" the truth of reports** merely methodological (neutral), or does it imply **no "further fact" about experience**?  
  - **Methodological neutrality** → **Heterophenomenology** (Dennett).  
    *Awkward commitment:* Accused of implicitly denying phenomenal consciousness by reducing it to dispositions.  
  - **Implies no further fact** → Illusionism (loop back to Node 6 outcome).  

  ---

  ### Key Features  
  - **Positions covered:**  
    1. Heterophenomenology  
    2. Classical introspectionism  
    3. Neurophenomenology  
    4. Front-loaded phenomenology  
    5. Illusionism  
    6. Hard behaviorism/eliminativism  
  - **Unoccupied positions:**  
    - *Direct naïve realism* (Node 4): Untrusted due to reliability concerns (unattractive).  
    - *Solipsistic phenomenology* (Node 5): Violates scientific intersubjectivity (incoherent).  
  - **Gaps in separation:**  
    - **Illusionism vs. heterophenomenology** hinges on metaphysical commitment (Node 8), but both treat reports as belief-based. The tree separates them cleanly.  
    - **Front-loaded phenomenology vs. neurophenomenology** are split by Node 4 (task design) and Node 3 (data integration).  

  ### Tree Structure Summary  
  - **Nodes:** 8 (1–8).  
  - **Leaves:** 8 (6 named, 2 unoccupied).  
  - **Audience fit:** Concrete questions avoid jargon; awkward commitments highlight trade-offs.  

  ### Missing Positions  
  - **Contemplative science** (e.g., trained meditation observers): Forks at Node 2 ("training improves trust"), aligning with neurophenomenology.  
  - **Second-person methods** (interactive report refinement): Forks at Node 3 ("bidirectional constraint"), but emphasizes dialogue over mutual data-constraint.  

  *Diagram advice:* Format this tree vertically for handouts (e.g., flowchart). Nodes are diamonds (questions), leaves are rectangles (positions).
