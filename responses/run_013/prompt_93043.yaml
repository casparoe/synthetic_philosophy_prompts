prompt: |-
  Bit of an odd one, but I'd like a proper audit of an analogy.

  I'm in a reading group on welfare economics. My flatmate (did a masters in it, never lets me forget) has one move for every argument about comparing one person's welfare with another's, and it's this: utility is like hardness on the Mohs scale. You can line minerals up -- talc, gypsum, calcite, up to diamond -- but the numbers are just ranks. You can't say diamond is ten times harder than talc, you can't add two minerals' hardnesses together, and comparing the hardness of a mineral with the hardness of, say, a loaf of bread is nonsense. So, he says, any policy that trades off one person's suffering against another's -- QALYs, cost-benefit analysis, all of it -- is a category error dressed up as arithmetic. Rank things, then let politics decide.

  I half-beleive him. But I want to know exactly where the analogy gives out. So:

  1) The correspondence table first. What maps onto the scale, the ranks, the reference minerals, the act of scratching, the non-additivity? Which bits are doing real work in his argument and which are decoration?

  2) Where it breaks. I've got a suspicion that one break might be fatal: the Mohs scale is a crude ordinal scale for a property that does admit of real measurement -- the indentation tests they use in metallurgy give you actual numbers for hardness, not just ranks -- so 'hardness is only ordinal' starts to look like a fact about our instruments rather than about hardness itself. Does that carry over to welfare, or is there something about welfare that stops a better instrument helping even in principle? And if it does carry over, what's left of his argument?

  3) He adds that the numbers would be meaningless even if we had them, because there's no fact of the matter about whether my 7 and your 7 are the same amount of welfare. Is that the same objection restated, or a different and stronger one? What would have to be true for a cross-person comparison to be meaningful -- a metaphysical fact we're missing, or a decision we have to make?

  4) When he's feeling punchy he switches to a second version: two currencies with no exchange rate. I suspect that one's actually worse for him, since currencies do get exchange rates, and they get them by trade rather than by fiat. Is the same route open for welfare, and what would it cost him if it were?

  5) Then the verdict. What can the analogy actually carry? I assume something narrower than 'comparisons are meaningless' -- maybe 'no summing', or 'no ratio-scale talk'. Which conclusions survive that narrower reading, and is there a better analogy for whatever he's really getting at?

  No references needed, I just want the argument. If the honest answer is that his analogy is fine and my intuitions are the broken ones, say that.
reasoning: |-
  Okay, let me tackle this user's query step by step. The user wants an audit of their flatmate's analogy comparing utility to the Mohs hardness scale. The flatmate argues that just like hardness rankings, welfare can't be quantitatively compared or summed across individuals. 

  First, I need to map the analogy. The Mohs scale represents an ordinal ranking—minerals are ordered by which scratches which, but without meaningful intervals or ratios. This maps to utility as purely ordinal rankings of preferences. The scratching test is like revealed preference theory in economics, where choices show order but not intensity. The non-additivity in Mohs directly challenges welfare trade-offs in policies like QALYs.

  Now, where does the analogy break? The user suspects that while Mohs is crude, hardness can actually be measured cardinally with other methods. Similarly, welfare might have underlying cardinal properties we haven't captured. But here's the catch: even if we had "utility meters," the problem of interpersonal comparison remains. How do we know if my unit of happiness equals yours? This isn't just measurement—it's a metaphysical or normative gap. The flatmate's second point about currencies is weaker because exchange rates emerge from trade. For welfare, "trading" well-being isn't feasible, so no natural exchange rate forms.

  The user's deeper need seems to be finding a middle ground. They might want to challenge the flatmate without dismissing ordinal utility entirely. The core takeaway is that while strict summation is invalid, bounded ordinal comparisons (like Pareto improvements) still hold. A better analogy might be language translation—possible but imprecise, requiring ethical decisions. The flatmate's analogy works for rejecting ratios and sums, but not all comparisons. Politics still needs to handle trade-offs, but with clearer constraints.
answer: |-
  Here's a full audit of your flatmate's analogy, breaking down its strengths, weaknesses, and the specific conclusions it can actually support:

  **1. The Correspondence Table:**
      *   **Mohs Scale:** Represents the *ordinal scale* of utility. Only rankings (A > B > C) are meaningful.
      *   **Ranks (1-10):** Represent *ordinal utility values*. They signify order, not magnitude.
      *   **Reference Minerals:** Represent *"Calibration Points"*. In utility theory, these could be specific, universally recognizable states (e.g., "subsistence survival", "moderate comfort", "bliss"). Their purpose is anchoring the scale, not defining intervals.
      *   **Act of Scratching:** Represents *revealed preference* or *choice behavior*. We observe choices (A chosen over B) to infer A > B. It's the empirical basis for ranking, analogous to how scratching determines which mineral is harder.
      *   **Non-Additivity / Non-Comparability:** This is the **core argument**. Diamond (10) + Talc (1) isn't "11 hardness". Similarly, Person A's Utility(7) + Person B's Utility(3) isn't a meaningful "Total Utility(10)". Comparing Person A's Utility(7) to Person B's Utility(7) is argued to be as nonsensical as comparing a mineral's hardness(7) to bread's hardness(7).
      *   **Real Work:** The core work is done by the concepts of **ordinality** (only rankings matter, not magnitudes) and **interpersonal non-comparability** (my utility number and your utility number exist on fundamentally separate scales). The reference minerals and scratching are illustrative of *how* we might establish an ordinal ranking, but the core philosophical punch comes from ordinality + non-comparability.
      *   **Decoration:** The specific number labels (1-10) and the minerals themselves are just vivid examples. The argument would hold if the scale used letters or any other ordinal labels.

  **2. Where It Breaks (The Cardinality Challenge & Your Suspicion):**
      *   **Your Suspicion is Correct:** The analogy *weakens significantly* here. The Mohs scale *is* a crude ordinal proxy for an underlying *cardinal* physical property (resistance to plastic deformation). Vickers/Knoop tests *do* provide ratio-scale measurements (e.g., Diamond is genuinely ~1000x harder than Talc in terms of applied force).
      *   **Does This Carry Over to Welfare? Maybe, But...**
          *   **Possibility of Cardinal Utility:** Many economists and philosophers argue that *intrapersonal* utility can have cardinal properties (meaningful intervals). We make choices under uncertainty that seem to reveal not just order, but *strength* of preference (e.g., how much risk you'll take to avoid a bad outcome vs. gain a good one). This suggests utility *within one person* might be measurable on an interval scale ("I prefer A to B *more than* I prefer C to D").
          *   **The Sticking Point: Interpersonal Comparison:** Even if we grant cardinal utility *within* individuals, the leap to *interpersonal* comparison remains the massive hurdle. **This is where the analogy truly breaks.** There is no known or even conceivable "utility meter" that could objectively measure if the *intensity* of my happiness from eating ice cream is *equal* to the intensity of your happiness from listening to music, or if my unit of suffering is equivalent to yours. The "better instrument" problem is fundamentally different:
              *   **Hardness:** Better instruments measure the *same underlying physical phenomenon* (resistance to deformation) more precisely. The property is objective and observer-independent.
              *   **Welfare:** There is no consensus on the *underlying phenomenon* (pleasure? preference satisfaction? objective flourishing?) and no way to access or compare the *subjective experience* across minds. Better instruments might measure correlates (brain scans, behavioral indicators), but translating these into a common, interpersonally comparable "utility unit" requires *normative assumptions* about how these correlates map to equivalent welfare states across different people. It's not just a technical measurement gap; it's an epistemological and metaphysical one.

  **3. The "Same Number, Different Experience" Objection:**
      *   **This is the Core Non-Comparability Argument Restated More Forcefully.** It's not a different objection; it's the *explanation* for why interpersonal comparisons are meaningless *even if* you assign cardinal numbers within each person. The Mohs analogy points out that the *same rank* (7) doesn't imply the *same magnitude* of the property across different entities. This objection directly targets the idea that "utility level 7" means the *same amount of welfare* for different people.
      *   **What Would Make Cross-Person Comparison Meaningful?** It would require one of two things:
          *   **A Metaphysical Fact:** Some objective, universal "utility substance" that is identical and measurable across minds (e.g., a specific neurochemical state representing exactly 1 "util" for everyone). This seems implausible given the diversity of human experience and values.
          *   **A Normative Decision:** We *decide* (based on ethics, pragmatism, or convention) to treat certain observable indicators (choices, expressed preferences, physiological states, capabilities) *as if* they represent equivalent welfare levels across people. **This is what applied welfare economics ultimately does** (e.g., 1 QALY = 1 QALY for everyone, valuing income gains equally for poor and rich in CBA). It's not discovering a fact; it's making an ethical/policy choice to enable aggregation and trade-offs. Your flatmate rejects this move as arbitrary or illegitimate "fiat."

  **4. The "Two Currencies" Version:**
      *   **This Analogy is Weaker:** Your instinct is correct. Currencies *do* develop exchange rates through market interactions (trade, arbitrage). These rates emerge from the decentralized actions of individuals valuing goods and currencies relative to each other.
      *   **Is the Same Route Open for Welfare?** Not directly or objectively.
          *   **No "Welfare Trade" Market:** People cannot directly trade units of their subjective welfare with each other. My suffering doesn't decrease if I "sell" it to you; your happiness doesn't increase if you "buy" some of mine. There's no mechanism for revealed preference *in welfare itself* across individuals.
          *   **Indirect Emergence?** One could argue that social choices, bargaining, or political processes *functionally* establish "exchange rates" (e.g., society implicitly agrees that taxing Peter $1000 to give Paul $1000 increases total welfare if Paul is poorer). However:
              *   This is an *aggregate outcome* of politics/norms, not an *individual* revealed preference for welfare trade-offs (Peter isn't voluntarily trading his utility loss for Paul's gain).
              *   It relies on the *normative decisions* mentioned above (treating $1 as equal welfare for all, or applying a welfare weight based on income).
      *   **Cost to His Argument:** This analogy inadvertently highlights that while *objective, scientific* interpersonal utility comparison might be impossible, *functional, normative* comparisons are made constantly in social decision-making. It weakens the claim that such comparisons are *categorically* nonsensical by showing a parallel where comparisons *do* emerge through interaction, albeit for a different kind of "value." It pushes the debate towards the normative realm ("*How should* we set the exchange rate?") rather than the impossibility claim.

  **5. The Verdict: What the Analogy Actually Carries**

  *   **What It Successfully Argues:**
      1.  **Utility is Fundamentally Ordinal (at least interpersonally):** Rankings (preferences) are primary and observable; precise cardinal magnitudes, especially across people, are not.
      2.  **Simple Summation is Invalid:** Adding my util number to yours is as meaningless as adding Mohs ranks. Policies relying on unweighted summation (like some naive CBAs) *are* committing a category error.
      3.  **Ratio Comparisons are Invalid:** Saying "Policy X gives Ann twice as much utility as it gives Bob" is as unjustified as saying "Diamond is ten times harder than Talc" based solely on Mohs ranks.
      4.  **Interpersonal Comparison Requires Strong Assumptions:** There is no *scientific* basis for equating my utility unit with yours. Any comparison relies on *normative* or *conventional* judgments.

  *   **What It Does NOT Successfully Argue:**
      1.  **All Interpersonal Comparisons are Meaningless:** While rejecting *cardinal, ratio-scale* comparisons, it doesn't rule out *all* comparisons. We can meaningfully say "Policy X makes Ann better off and Bob worse off" (ordinal comparison of change *within* each person). We can also make bounded comparisons ("Ann is in absolute poverty, Bob is a billionaire").
      2.  **Policy Trade-offs are Impossible/Illegitimate:** Politics *must* make trade-offs affecting different people's welfare. The analogy shows these trade-offs cannot be based *solely* on scientific utility arithmetic, not that they shouldn't happen. It forces these trade-offs into the political/ethical domain, which is where your flatmate says they belong ("let politics decide").
      3.  **Cardinal Intra-personal Utility is Impossible:** The analogy is silent or weak on whether *my own* utility has cardinal properties.

  *   **What Survives the Narrower Reading:**
      *   **No Summing:** Robust conclusion. Adding distinct individuals' utility values is invalid.
      *   **No Ratio-Scale Talk:** Robust conclusion. Statements about ratios of utility across people are unjustifiable.
      *   **No *Objective Scientific Basis* for Interpersonal Comparison:** Robust conclusion. We lack a "utility meter" or objective grounding.
      *   **Policy Aggregation Requires Normative Judgments:** Robust conclusion. Turning individual ordinal preferences into a social ranking or aggregate measure (like Kaldor-Hicks efficiency, Cost-Benefit Analysis using monetary valuations, QALYs) *always* involves ethical choices about weighting and comparability.

  *   **A Better Analogy:** Instead of Mohs or currencies, think of **translating poetry between languages**.
      *   **Ordinal Aspect:** You can usually tell if a translation captures the essence better or worse than another (ranking translations). Revealed preference: which translation do people choose to publish?
      *   **Cardinal Intra-personal?** A translator might judge that replacing *this* word gains more meaning than replacing *that* word loses (intensity/interval judgment within the translation process for one poem).
      *   **Interpersonal Non-Comparability (Core):** There's no objective way to say that the *aesthetic experience* evoked by a perfect translation of a Chinese poem for a native Chinese speaker is *equal in magnitude* to the experience evoked by a perfect translation of a Russian poem for a native Russian speaker. The experiences are deeply personal, culturally embedded, and inaccessible to direct cross-linguistic measurement.
      *   **Normative Comparison/Politics:** Despite this, we make judgments about the *relative value* of translating different works, funding literature programs, etc., based on cultural importance, accessibility, diversity – *ethical and political decisions*, not scientific measurement of equivalent "aesthetic utils."
      *   **This Analogy Better Captures:** The subjectivity, the potential for intra-personal nuance, the fundamental barrier to cross-person equivalence of subjective experience, and the necessity (and legitimacy) of making normative judgments for action despite the lack of scientific grounding for direct comparison.

  **Conclusion:** Your flatmate's analogy is **powerful but imperfect and ultimately incomplete.** It correctly demolishes the idea that interpersonal utility is cardinal, additive, or objectively comparable. It forces valuable humility about simplistic welfare arithmetic in policy. **However, it goes too far in implying that *all* welfare comparisons across people are meaningless or that policy trade-offs based on reasoned ethical judgment are illegitimate.** The honest answer is that his analogy captures a crucial and valid *limitation* (no objective cardinal interpersonal comparison), but your intuition that welfare trade-offs can't be completely avoided in policy (and thus require a normative framework) is also correct. The Mohs analogy is strong for "no summing" and "no ratios," but weaker for the broader claim "no meaningful comparisons possible at all." The poetry translation analogy better captures the nuanced reality. Your half-belief is well-placed: he's right about the fundamental measurement problem, but wrong to think it paralyzes all welfare-informed policy, which inevitably rests on normative foundations alongside evidence.
