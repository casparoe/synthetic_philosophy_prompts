  Okay, let me unpack this user's query. They're noticing a pattern in US law where certain consensual acts are criminalized despite no clear harm, while other potentially harmful activities are allowed. The examples include incest, bestiality, assisted suicide, dueling, and bigamy versus boxing, selling plasma, tattoos, cosmetic surgery, gambling, and adultery. The user is asking what underlying principle justifies this pattern and whether it commits to a specific theory.

  First, I need to recall the harm principle versus legal moralism. The harm principle, from Mill, says the state should only intervene to prevent harm to others. Legal moralism, associated with Devlin, argues that society can enforce shared morality to prevent disintegration. The user wants to know which theory the law assumes in practice.

  Looking at the examples, activities like boxing or tattoos are regulated but legal. The banned acts often involve strong social taboos. This suggests legal moralism might be at play. But I should check if there are other explanations. For instance, some argue that bestiality involves animal harm, but the user points out that the animal can't consent. That's more about inherent wrongness than measurable harm.

  The user also asks about underdetermination. If we switch to a strict harm principle, what changes? Assisted suicide for the terminally ill might be legalized, as seen in some states. Consensual adult incest might not be prosecuted. But bestiality could still be banned under animal cruelty laws. Bigamy might remain illegal due to fraud, but polyamorous arrangements without marriage could be permissible.

  Historical inertia is a factor too. Laws against dueling persist but aren't enforced. Adultery laws exist but are rarely prosecuted. This indicates that enforcement often aligns with current norms rather than consistent principles. The user is right to question whether the laws are based on a coherent theory or just historical artifacts.

  The user's deeper concern seems to be about inconsistency in legal principles. They want to know if the law has an unstated moral foundation or if it's a patchwork. They might be seeking clarity on whether legal moralism is implicitly accepted, which could have implications for debates on other issues like drug legalization or sex work.

  I should also consider slippery slope arguments. For example, allowing assisted suicide might lead to non-voluntary cases. But the user questions if such second-order harms are valid or just proxies for moral discomfort. The challenge is distinguishing between genuine societal harm and mere distaste.

  In conclusion, the pattern suggests that while the harm principle is the stated ideal, legal moralism underlies many prohibitions. However, enforcement is inconsistent, influenced by changing social norms. To achieve consistency, laws would need reevaluation based on clear principles, but political and cultural factors complicate this.
answer: |-
  You've identified a profound tension at the heart of criminal law: the gap between the stated ideal of the "harm principle" (only prohibiting conduct causing direct, tangible harm to non-consenting others) and the persistent reality of laws prohibiting conduct primarily based on its perceived **immorality, indecency, or violation of human dignity**, even absent clear, direct harm. This pattern doesn't neatly commit to a single, coherent theory, but rather reflects a messy interplay of several concepts:

  1.  **Legal Moralism:** This is the most direct answer. It holds that the state *can* and *should* enforce a society's fundamental moral principles for their own sake, regardless of whether the conduct causes tangible harm. The acts you list (incest, bestiality, dueling, assisted suicide in many contexts, bigamy) are often seen as violating deep-seated moral taboos about the sanctity of life, family structure, sexual propriety, and human exceptionalism. Proponents argue that tolerating such acts erodes the shared moral foundation necessary for a stable society (Devlin's "disintegration thesis").
  2.  **Paternalism (Disguised):** While the harm principle rejects paternalism (protecting people from themselves), bans on assisted suicide or arguably even extreme body modification/sales can be framed (sometimes disingenuously) as preventing irrational choices made under duress (pain, despair) or protecting vulnerable individuals from exploitation.
  3.  **Offense Principle:** This argues the state can prohibit conduct causing profound offense or disgust to others, even without direct harm. While typically applied to public acts, the *knowledge* that private acts like sibling incest or bestiality occur might be argued to cause widespread "moral offense" sufficient to justify prohibition.
  4.  **Proxy for Harm / Slippery Slopes:** This is the common *justification* offered to reconcile bans with the harm principle:
      *   **Incest:** Risks of coercion within family power dynamics, genetic risks to offspring (though this applies poorly to same-sex siblings or those incapable of reproduction).
      *   **Bestiality:** Animal cruelty/welfare concerns (inability to consent, potential for physical harm). This is increasingly the *primary* legal justification, moving away from pure morality.
      *   **Assisted Suicide:** Risk of coercion of vulnerable individuals (elderly, disabled, depressed), slippery slope towards non-voluntary euthanasia, undermining the value of human life.
      *   **Bigamy:** Primarily prohibited due to fraud against new spouses/unseen partners, inheritance/tax/benefit complications, and protecting the state-sanctioned institution of marriage (though this doesn't address non-fraudulent polyamorous cohabitation).
      *   **Dueling:** Direct physical harm/death (though consenting adults box).
      *   **"Degradation" as Harm:** The argument that engaging in or witnessing (even conceptually) profoundly degrading acts *itself* causes a harm to human dignity or societal values.

  **What the Law's Willingness to Ban "Harmless-but-Revolting" Stuff Presupposes:**

  *   **The State's Legitimate Interest in Morality:** It presupposes that maintaining a shared public morality is a legitimate state interest, distinct from preventing direct harm. Society's collective sense of decency *is* worth protecting for its own sake and for social stability.
  *   **The Existence of "Harmless Wrongs":** It presupposes that some acts are intrinsically wrong or degrading, regardless of consent or lack of tangible harm to identifiable victims. Human dignity imposes limits on what consent can permit.
  *   **The Fallibility of Consent:** It presupposes that consent in profoundly taboo contexts (family, extreme despair, with animals) is either impossible or inherently suspect/coerced.
  *   **Society's Right to Self-Definition:** It presupposes society has a right to define the boundaries of acceptable behavior to maintain its character and prevent perceived decay.

  **Underdetermination and What a Strict Harm Principle Would Change:**

  Adopting a *strict* Millian harm principle would necessitate significant changes:

  *   **Legalize:**
      *   Consensual adult incest (between non-dependent, non-coercive siblings/parents-child, especially where reproduction is impossible).
      *   Assisted suicide for terminally ill, lucid, consenting adults (as seen in Oregon, Washington, etc., but nationally).
      *   Bigamy based purely on fraudulent marriage licenses; non-fraudulent multi-partner cohabitation/relationships would face no criminal sanction (though no state marriage benefits).
      *   Dueling between consenting adults (though likely regulated like extreme sports).
      *   *Possibly* bestiality *if* it could be proven no physical harm occurred to the animal (though the "inability to consent" argument is a powerful harm principle counter that would likely keep it banned).
      *   Laws criminalizing purely private, consensual "gross" acts between adults would vanish.
  *   **Remain Banned (under Harm Principle):**
      *   Non-consensual acts (rape, assault, most fraud).
      *   Acts causing direct harm to non-consenting third parties (public nuisance, pollution, reckless endangerment).
      *   Acts involving incapacity to consent (children, severely mentally disabled).
      *   **Bestiality:** Almost certainly remains banned due to the animal's inability to consent and inherent welfare concerns (a direct harm).
      *   **Bigamy:** Remains banned *if* involving fraud (deceiving spouse #2 about spouse #1) or specific harms like welfare fraud, though purely consensual polygamous arrangements wouldn't be criminal.
      *   **Boxing/Plasma/Tattoos/Gambling:** Generally remain legal, as consent is presumed valid and harm is either accepted risk or regulated.
  *   **New Bans?** A strict harm principle might *expand* bans on activities causing indirect harm previously tolerated, like certain polluting industries, deceptive marketing causing widespread financial harm, or systemic practices creating public health risks, if the harm could be clearly demonstrated.

  **Internal Consistency: A Mess of Incompatible Theories**

  The current practice is **not internally consistent.** It's a historical and political patchwork:

  1.  **Inertia & Symbolism:** Many laws (anti-dueling, adultery statutes) remain largely unenforced relics, serving more as symbolic statements than active prohibitions.
  2.  **Selective Enforcement:** Enforcement often aligns with current political/social priorities, not consistent principle (e.g., adultery rarely prosecuted, incest prosecutions often involve minors or coercion even if the law doesn't require it).
  3.  **Shifting Justifications:** As societal views change, justifications shift. Bestiality bans now lean heavily on animal welfare (harm principle) rather than morality. Incest bans increasingly emphasize genetic risk or inherent coercion, even when weak.
  4.  **Inconsistent Application:** Why ban consensual incest but not extreme BDSM potentially causing more physical harm? Why ban assisted suicide but allow terminal sedation or refusal of life-saving treatment? The distinctions often rest more on moral intuition than a clear principle.

  **The Role of the Assumption:**

  The "society's shared morality" assumption **is doing real work**, but it's deeply intertwined with politics and history:

  *   **Work it Does:** It provides the core justification for laws where direct harm arguments are weakest (consensual adult incest being the clearest example). It shapes public discourse and legislative priorities. It reflects deeply held, often religiously informed, intuitions about human nature and social order.
  *   **Decoration on Politics:** However, *which* moral principles get enshrined in law, and *how vigorously* they are enforced, is absolutely driven by political power, cultural shifts, lobbying, and historical contingencies. The inconsistency stems from this: the law reflects compromises between different moral visions and political realities, not a single coherent theory.

  **Conclusion:**

  The pattern presupposes **Legal Moralism** as a legitimate basis for law alongside the Harm Principle. It assumes society has a right to enforce core moral boundaries to protect its character and shared values, even absent direct, tangible harm. While arguments about second-order harms, slippery slopes, or proxies are often deployed to *justify* these laws within a harm-principle framework, they frequently feel strained and mask the underlying moral revulsion.

  Adopting a *strict* harm principle would legalize consensual adult incest, assisted suicide for the terminally ill, and non-fraudulent multi-partner relationships, while leaving bans on non-consensual acts, harm to animals, and fraud intact. However, the current legal landscape is **not** a consistent application of *any* single theory. It's a historically layered, politically contested, and often inconsistent amalgam of Legal Moralism, Harm Principle arguments (sometimes genuine, sometimes pretextual), Paternalism, and the Offense Principle. The "shared morality" assumption is a foundational pillar supporting many existing prohibitions, but its application is selective and shaped by the messy realities of power and cultural change.
