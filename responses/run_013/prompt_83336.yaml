  **OFFICE OF DIACHRONIC CONSUMER PROTECTION (ODCP)**  
  **Guidance Note ODCP/GN/2024/07: Prevention and Rectification of Monetary Drainage via Preference Cycles**  
  **Issued under the Diachronic Harm Mitigation Act 2023**  
  **Effective Date: 1 October 2024**  

  ---

  ### **1. Definitions**  
  1.1 **Preference Cycle**: A sequence of three or more distinct objects (A, B, C, ...) where a person:  
  - Prefers A to B,  
  - Prefers B to C,  
  - And prefers C to A.  
  *(Example: Tea to Coffee, Coffee to Water, Water to Tea.)*  

  1.2 **Money Pump**: An exploitative sequence of trades wherein a person, due to a Preference Cycle, accepts repeated exchanges that return them to their initial object while surrendering money at each step, resulting in a net monetary loss.  

  1.3 **Diachronic Exploitability**: The inherent susceptibility of a Preference Cycle to enable a Money Pump, irrespective of whether an exploit occurs.  

  1.4 **Synchronic Rationality**: The property of a single choice being internally consistent with stated preferences at a given moment.  

  1.5 **Diachronic Rationality**: The property of a sequence of choices being collectively consistent with stated preferences over time.  

  1.6 **Arbitrage Opportunity**: The maximum monetary value extractable from a Preference Cycle by a hypothetical third party ("Pumper") via a Money Pump.  

  1.7 **Unbound Agent**: A person who, at each decision point, considers only immediate preferences without precommitment to future actions.  

  ---

  ### **2. Audit and Assessment of Preference Cycles**  
  2.1 **Obligation to Disclose**: All citizens must submit an annual Preference Declaration (Form ODCP-PD1) detailing pairwise rankings of commonly traded objects (e.g., goods, services, or abstract outcomes).  

  2.2 **Cycle Identification**: ODCP auditors will scan declarations for Preference Cycles using Algorithm DPC-7 (see *Technical Supplement TS-12*).  

  2.3 **Valuation of Arbitrage Opportunity**:  
  - The Arbitrage Opportunity (AO) is calculated as:  
    \( \text{AO} = (\text{Value of Initial Object} \times \text{Cycle Length}) - \text{Handling Costs} \)  
  - Handling Costs are fixed at 10% of AO (per Regulation 45(b)).  
  - **Example**: Citizen A declares:  
    - Prefers Apple (value £1) to Banana (value £0.80),  
    - Banana to Cherry (value £0.60),  
    - Cherry to Apple.  
    AO = (£1 × 3) = £3. Handling Fee (10%) = £0.30. Net Charge: £2.70.  

  2.4 **Basis for Charge**: Diachronic Exploitability (Def. 1.3) constitutes a consumer harm under the Act. Charges preempt private Pumpers from profiting at citizen expense.  

  ---

  ### **3. Exemptions and Mitigation Licences**  
  3.1 **General Principle**: Charges apply solely to Unbound Agents (Def. 1.7). Licence holders may qualify for exemptions.  

  3.2 **Resolute Chooser Licence (RCL)**:  
  - **Criteria**: Citizen demonstrates capacity to precommit irrevocably to a future sequence of choices, avoiding cycle exploitation.  
  - **Application**: Submit Form ODCP-RCL1 with notarised Precommitment Plan.  
  - **Exemption**: Full waiver of AO charges.  
  - **Note**: Licence revoked if audit finds deviation from Precommitment Plan.  

  3.3 **Sophisticated Chooser Licence (SCL)**:  
  - **Criteria**: Citizen demonstrates awareness of their Preference Cycle and adjusts immediate choices to avoid financial loss (e.g., rejecting trades that initiate a pump).  
  - **Application**: Submit Form ODCP-SCL1 with Strategic Avoidance Protocol.  
  - **Exemption**: 75% reduction in AO charges (reflecting reduced exploitability).  
  - **Note**: Protocol must be revalidated biannually.  

  3.4 **Philosophical Note**: Synchronic Rationality (Def. 1.4) is insufficient for Diachronic Rationality (Def. 1.5). A sequence of synchronically rational choices may be diachronically destructive. Licences mitigate this divergence.  

  ---

  ### **4. Worked Example: Citizen B**  
  4.1 **Preference Declaration**:  
  - Prefers Painting (value £100) to Sculpture (value £90),  
  - Sculpture to Tapestry (value £85),  
  - Tapestry to Painting.  

  4.2 **Arbitrage Opportunity Calculation**:  
  - AO = (£100 × 3) = £300. Handling Fee (10%) = £30. Net Charge: £270.  

  4.3 **Citizen B’s Response**:  
  - Applies for SCL, claiming they would reject the Sculpture-to-Tapestry trade if offered.  
  - **ODCP Ruling**: SCL granted. Charge reduced to £67.50.  
  - **Reasoning**: Citizen B’s Strategic Avoidance Protocol lowers exploitability risk.  

  4.4 **Hypothetical Pump Sequence (if Unbound)**:  
  - Step 1: Pay £1 to trade Painting for Sculpture (prefers Sculpture *now*).  
  - Step 2: Pay £1 to trade Sculpture for Tapestry (prefers Tapestry *now*).  
  - Step 3: Pay £1 to trade Tapestry for Painting (prefers Painting *now*).  
  - **Result**: Citizen B has original Painting but £3 poorer. AO = £3.  

  ---

  ### **5. State Precommitment Services**  
  5.1 **Service Overview**: ODCP offers voluntary Precommitment Escrow (Form ODCP-PE1). Citizens may "freeze" preferences for a fixed period, rendering cycles unexploitable.  

  5.2 **Fees**:  
  - Escrow Setup: £15 per object in cycle.  
  - Annual Maintenance: £5 per object.  

  5.3 **Benefit**: Licence-equivalent protection without formal RCL/SCL application.  

  ---

  ### **6. Appendices**  
  **Appendix A: Forms**  
  - ODCP-PD1: Preference Declaration (Mandatory)  
  - ODCP-RCL1: Resolute Chooser Licence Application  
  - ODCP-SCL1: Sophisticated Chooser Licence Application  
  - ODCP-PE1: Precommitment Escrow Request  

  **Appendix B: Fee Schedule**  
  - Cycle Identification Fee: £25 (waived for incomes <£20k)  
  - AO Handling Fee: 10% of AO  
  - SCL Application: £50  
  - RCL Application: £75  

  ---

  **Issuing Authority:**  
  Dr. E. Quill, Director  
  Office of Diachronic Consumer Protection  
  3 Temporal Lane, London WC1A 1AA  

  *“Protecting today’s choices from tomorrow’s regrets.”*  

  ---  
  **END OF GUIDANCE**  

  ---  
  **SATIRICAL FOOTNOTES (Not Part of Official Document):**  
  *This piece satirizes money-pump arguments by framing them as bureaucratic policy. Key philosophical points emerge through bureaucratic "solutions":*  
  - *The Unbound Agent (Sec 2.4/3.1) embodies the pump’s reliance on myopic, non-committed choices.*  
  - *RCL/SCL licences (Sec 3) "solve" the problem by allowing commitment or foresight, implicitly conceding that without these, the pump works.*  
  - *The Office’s Precommitment Service (Sec 5) is ironic: by charging citizens to "protect" them from pumps, the state becomes the exploiter.*  
  - *Citizen B’s example (Sec 4) shows synchronic rationality (each trade is preferred) leading to diachronic disaster (net loss), while the charge for "dispositional" exploitability (Sec 2.4) highlights that the harm is theoretical.*  
  *No real people or scholars are named, keeping the tone authentically governmental.*
