prompt: |-
  So I'm reading this pop-history book about the historical Jesus and the author keeps leaning on a courtroom picture. The idea is that the gospels are basically witnesses, the historian is the judge or the jury, and the criteria of authenticity are the rules of evidence. So the criterion of embarrassment gets treated like the way you trust a witness who blurts out something against his own interest, multiple attestation is like independent witnesses agreeing, dissimilarity is like testimony that isn't just repeating what the crowd already wanted to hear. And the punchline the author draws is that once you run the gospels through these rules the way a court runs testimony, you can actually say what Jesus did and said with decent confidence — the criteria can settle it.

  A friend of mine who did a bit of this stuff in grad school says the courtroom picture is the exact thing thats wrong with the whole enterprise, that it smuggles in everything and just looks rigorous. I can sort of see both sides and I want the mapping actually done instead of waved at. So: lay out what's supposed to correspond to what — witness, testimony, judge, rules of evidence, cross-examination, standard of proof — and then tell me where the correspondence breaks down. Which of the disanalogies actually matter for the author's conclusion, that the criteria can settle who Jesus was, and which are just noise? Once the breaks are on the table, does that conclusion survive, or was the courtroom picture carrying it the whole time? And if there's a better analogy for what the criteria are really doing, what would it be?
