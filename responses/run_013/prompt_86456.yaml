  I've been reading the General Scholium — the thing Newton bolted onto the end of the Principia (I've got Motte's old English translation, the 1729 one) — and there's a stretch of it that I genuinely cannot parse, and my flatmate and I have now spent two evenings yelling about it at each other, so I want a real answer instead of the vague hand-waving I keep producing myself. Here's the bit, pasted as it stands, with the gaps I'm skipping marked:

  "This Being governs all things, not as the soul of the world, but as Lord over all: And on account of his dominion he is wont to be called Lord God παντοκρατωρ, or Universal Ruler. For God is a relative word, and has a respect to servants; and Deity is the dominion of God, not over his own body, as those imagine who fancy God to be the soul of the world, but over servants. [...] The word God usually signifies Lord; but every lord is not a God. It is the dominion of a spiritual being which constitutes a God; a true, supreme, or imaginary dominion makes a true, supreme, or imaginary God. [...] He is not Eternity and Infinity, but Eternal and Infinite; he is not Duration and Space, but he endures and is present. He endures forever, and is every where present; and, by existing always and every where, he constitutes Duration and Space. Since every particle of Space is always, and every indivisible moment of Duration is every where, certainly the Maker and Lord of all things cannot be never and no where. Every soul that has perception is, though in different times and in different organs of sense and motion, still the same indivisible person. There are given successive parts in duration, co-existent parts in space, but neither the one nor the other in the person of a man, or his thinking principle; and much less can they be found in the thinking substance of God."

  My flatmate's line is that this is deism dressed up in Sunday clothes: a cosmic engineer who is so bound up with space and time that the difference between him and them basically collapses, and he claims Leibniz kicked up a fuss about exactly this and that it all smells pantheistic. I don't buy it, because the whole passage is weirdly fixated on "Lord", "dominion" and "servants" — my God, your God, Lord of Lords — and on the fact that we'd never say "my Eternal" or "my Infinite". That doesn't sound like a clockmaker to me, it sounds like someone making a very particular theological point about what it even means to be God. But then I hit "he is not Duration and Space, but he endures and is present" followed instantly by "by existing always and every where, he constitutes Duration and Space", and I'm lost again. And what on earth is the bit about every soul being "the same indivisible person" doing in a paragraph about God's duration and presence? Is that just an analogy, or is it a move against somebody in particular? Also, my understanding — and it may be a garbled version — is that Newton was some kind of heretic about the Trinity, that he thought the Son wasn't co-equal or co-eternal with the Father, that he wrote about this at length in private and never dared publish, and that this is somehow why he insists on God as ruler rather than as the infinite or the perfect. If that's right, I'd like to actually see it in this passage rather than just be told it's there.

  So: please take the role of a historian of early modern philosophy and theology who really knows Newton's religious writings and the metaphysical fights he was stuck in the middle of, and think carefully before you answer. I'd like you to start by brainstorming the competing readings of this passage — lay out the options, don't commit on line one — and then tell me which one you actually think is right. Go through the strange clauses one by one and say what each is doing: what work does "dominion" do such that a being without it can't be called God at all, and who or what is the target of "not as the soul of the world"? How can God "constitute" duration and space without being them — what are the possible readings, and does Newton's own wording decide between them, or is he just being slippery? Does the indivisible-person bit have an anti-Trinitarian edge to it? And does my flatmate's deism reading survive any of this, or does it die? Tell me plainly which parts of this are settled and which are still genuinely contested, and be upfront when your're speculating. One thing though: please don't hand me a reading list or tell me to go look up some book or scholar — I'm on a train with no signal and I want the explanation itself, in your own words, not a bibliography.
