  First, I need to recall Newton's context. He was involved in theological controversies, especially regarding the Trinity. His private writings show he was an Arian, denying the Son's co-equality with the Father. This must influence his public writings, like the Principia. The General Scholium addresses God's relationship to the universe, countering pantheistic views and Cartesian mechanists.

