  I should structure the response to clarify the historiographical debate, validate their different-questions theory, and provide practical advice for their group. Emphasizing contingency and agency can offer hope that their group can avoid the destructive cycle by conscious decisions. Connecting historical analysis to their immediate situation will make the response relevant and useful.
answer: |-
  This is a brilliantly framed question, hitting the nerve where historical interpretation meets urgent political reality. Let's break down the historiographical knot and then connect it directly to your group's "devouring" dynamic.

  ## Diagnosing the Historiographical Dispute

  You're absolutely right that the field never reached a definitive consensus that "solved" the French Revolution. The shift towards cultural/discourse history wasn't just boredom; it reflected genuine frustration with the limitations of earlier frameworks and the appeal of new questions. However, the core questions *weren't* bad – they were (and remain) incredibly difficult. Your "different questions" theory is the strongest diagnosis, but needs nuance:

  1.  **Different Questions & Levels of Analysis:**
      *   **Marxist/Social Interpretation ("Why the Revolution Happened?"):** Focuses on *long-term structural causes* – the rise of capitalism, contradictions within the "feudal-absolutist" system, the emergence of a bourgeoisie (defined economically/socially) whose interests clashed with the old order. It seeks the fundamental *engine* of change. The "feudal reaction" question (e.g., Aristocratic resurgence under Louis XVI threatening bourgeois interests) fits here.
      *   **Revisionist Interpretation ("Who Made the Revolution and How Did It Unfold?"):** Focuses on *medium-term political/conjunctural causes* and *agency*. It asks: Who were the actual actors (often professionals, officials, lesser nobles – not classic industrial capitalists)? How did political crises, institutional breakdown (e.g., bankruptcy, Estates-General deadlock), ideological currents (Enlightenment), and specific events (King's flight, war) *drive* the revolution? It emphasizes contingency *within* a revolutionary situation. The "lawyers and officeholders" point highlights the gap between the abstract "bourgeoisie" and the actual revolutionary personnel.
      *   **Contingency/"Cultural Turn" Interpretation ("How Did the Revolution Work Day-to-Day? What Did it Mean?"):** Focuses on *short-term events, discourse, and experience*. How did fear, rumor, factional struggle, the dynamics of popular mobilization, the language of virtue and terror, administrative chaos, and the sheer pressure of war *shape* the radicalization? It asks about the *mechanisms* and *meanings* of the Terror specifically. The "nothing was inevitable" mantra challenges long-term determinism.

  2.  **Verbal Quarrels (Especially on "Class"):** This is intertwined. Revisionists effectively argued that the Marxist definition of "bourgeoisie" (as a unified capitalist class-in-itself) didn't map neatly onto the diverse group of lawyers, officials, merchants, and *some* nobles who made the revolution. They highlighted *political* identity ("Patriots") over rigid *economic* class identity. Marxists countered that class is a structural relation, not just self-identification, and the revolution *objectively* served capitalist development, even if the actors weren't all factory owners. This semantic gap persists.

  3.  **Bedrock Politics:** This is undeniable. The French Revolution is the foundational event of modern politics. For conservatives (and some liberals), the Terror is the inevitable endpoint of radical utopianism breaking from tradition and restraint – a "proto-totalitarian slide." For Marxists and many radicals, it was a necessary, if tragic, phase in the inevitable bourgeois-democratic revolution against feudalism – "bourgeois-progress." These underlying political stances *do* shape which evidence is emphasized and how narratives are constructed. The "devouring its children" trope itself is often wielded more as a political warning than a neutral historical description.

  **Why No Resolution?**
  *   **Evidence is Massive and Ambiguous:** The Revolution generated oceans of documents, speeches, actions, and experiences that can be interpreted through multiple lenses.
  *   **The Questions are Profoundly Complex:** Untangling deep structures, conjunctural crises, ideological fervor, individual agency, and sheer accident is inherently messy.
  *   **Shifting Paradigms:** History, like all disciplines, experiences paradigm shifts. The cultural turn offered exciting new tools to explore previously neglected aspects (language, symbols, gender, experience), even if it sometimes sidelined older questions rather than answering them.
  *   **Politics:** The stakes feel incredibly high, coloring interpretations.

  **What Counts as Progress?**
  *   **Integration/Synthesis:** Recognizing that *all* these levels are necessary for understanding. The Revolution happened *because* of deep structural tensions (social interpretation). It took the specific form it did because of political crises and the actions of identifiable groups (revisionist/contingency). The Terror unfolded through a toxic combination of ideology, fear, war, and factional logic (contingency/cultural). Progress comes from showing *how these levels interacted* rather than insisting one explains everything.
  *   **Nuance & Specificity:** Moving beyond monolithic terms. Instead of "the bourgeoisie," specifying *which* professional groups, in *which* regions, with *which* connections, held *which* specific grievances and goals at *which* moments. Similarly, analyzing the Terror not as one thing, but as phases driven by different pressures (e.g., external war vs. internal factional purge).
  *   **Microhistories:** Looking intensely at specific localities, events, or individuals to test macro-theories against granular reality.
  *   **Reframing Questions:** Instead of "Was it bourgeois?", asking "What specific social and economic transformations did the Revolution enable or accelerate, and who benefited?" Instead of "Was the Terror inevitable?", asking "Under what specific conditions did the logic of terror gain dominance, and could it have been otherwise?"

  ## The "Devouring Its Children" Mechanism: Real or Topos?

  It's **both a real mechanism and a powerful topos**, and its power as a topos stems *from* its real elements. The French case *absolutely* exhibits it, though its "inevitability" is the contested part.

  **The Real Mechanisms in France (Evidence Abounds):**

  1.  **Radical Outbidding/Spiraling Purity:** Girondins vs. Montagnards is the classic example. Accusations of moderation or treachery became tools for factional advantage. To prove revolutionary credentials, factions pushed more extreme positions and rhetoric, demanding ever-greater "virtue." Danton's execution by the Robespierrists he helped empower is the iconic "devouring."
  2.  **Emergency Powers Ratcheting:** The Committee of Public Safety and the Law of Suspects were explicitly justified by the "patrie en danger" – foreign invasion and civil war. Once established, these extraordinary powers became tools for internal political purges. The machinery of terror, once created, was hard to dismantle and easy to repurpose.
  3.  **Paranoia and the Logic of Conspiracy:** Fear of counter-revolution (real and imagined) became pervasive. Failure or dissent *had* to be explained by treachery ("enemies of the people"). This created a zero-sum game: anyone not actively with the dominant faction *must* be against it. Yesterday's hero (e.g., Hébert) becomes today's traitor.
  4.  **Ideological Rigidity & Regeneration:** The revolutionary ideology of creating a "new man" and a regenerated society fostered intolerance for perceived corruption, self-interest, or deviation. Compromise was seen as betrayal of the revolutionary ideal itself.

  **Why it's ALSO a Topos/Survivor's Hindsight:**

  *   **Simplification:** It condenses a vastly complex, multi-causal process into a dramatic, memorable story.
  *   **Political Weapon:** Used for centuries by conservatives to discredit radical change ("See? This always happens!") and sometimes by disillusioned radicals.
  *   **Narrative Convenience:** It provides a clear arc: idealism -> radicalization -> terror -> collapse/reaction. Reality was messier, with moments of pragmatism amidst the terror, and continuities alongside rupture.
  *   **Focus on Elites:** The "children" devoured were mostly the revolutionary leadership. It often sidelines the broader social struggles, war, and popular movements that shaped the context.

  **Does France Show the Mechanism? Unequivocally Yes.** The factional purges, the escalating rhetoric, the use of emergency powers against internal dissent, the execution of key revolutionary figures (Barnave, Brissot, Danton, Desmoulins, Hébert, and finally Robespierre himself) – this pattern is undeniable in the record of speeches, newspapers, committee minutes, and trial records.

  ## What This Means for Your Group

  1.  **The Mechanism is Alarmingly Real (and Recognizable):** Your description – expulsions, fear of being next, reaching for the Terror analogy – suggests the dynamics are present:
      *   **Outbidding/Spurity Spiral:** Are disagreements framed as betrayals? Is ideological purity becoming the sole measure of membership? Is compromise seen as weakness or treachery?
      *   **Emergency Logic:** Is the group operating under a sense of existential threat (from the state, the right, other left groups)? Are "security" or "efficiency" arguments used to justify expulsions or centralize power?
      *   **Paranoia/Conspiracy:** Are setbacks blamed solely on "traitors" or "infiltrators"? Is dissent pathologized?
      *   **"Patriot becomes Traitor":** Have the expelled members been recast from comrades to enemies?
  2.  **Contingency is Your Hope:** **This is crucial.** The French Revolution shows the mechanism *in action*, but **not** that it was *inevitable* from the start. The specific triggers (King's flight, outbreak of war, specific factional choices) were contingent. **Your group's trajectory is not predetermined.** Recognizing the mechanism is the first step to interrupting it.
  3.  **Actionable Steps (Based on the History):**
      *   **Name the Dynamic:** Explicitly discuss the "devouring" analogy *as a warning sign*, not as fate. Say: "We are showing symptoms of the destructive dynamics we see in the Terror – expulsions, fear, purity tests. This destroys movements."
      *   **Challenge Emergency Logic:** Rigorously examine the *actual* level of external threat. Resist using "security" to override internal democracy or justify purges. Demand evidence for claims of infiltration/betrayal.
      *   **Reject Purity Spiral:** Actively value practical solidarity, shared struggle, and constructive disagreement over ideological conformity. Celebrate pragmatic successes. Frame debates as "how do we achieve X?" not "who is truly revolutionary?"
      *   **Reinforce Trust & Humanity:** Create spaces (formal or informal) for connection beyond just political work. Remind each other of shared history and values. Humanize potential "targets."
      *   **Focus Outwards:** Redirect energy towards concrete action, campaigning, or analysis of external opponents. A common external focus can rebuild unity.
      *   **Consider Structure:** Does your group's decision-making process encourage factionalism or consensus-building? Are there mechanisms for mediation or conflict resolution?
      *   **Know When to Walk Away:** If the dynamic is too entrenched and you genuinely fear becoming the next target (or contributing to targeting others), leaving might be the necessary act of self-preservation and refusal to participate in the devouring. There are other ways to fight.

  ## Conclusion

  The historiographical debate persists because the French Revolution was a seismic event where structure, agency, ideology, contingency, and raw human emotion collided explosively. The "different questions" perspective is powerful, but the deepest insight for your immediate crisis lies in recognizing the **Real Mechanism** of radicalization, purges, and devouring, while clinging fiercely to the **Power of Contingency**.

  **Your group is not in 1792.** You are not at war with Europe, facing royalist uprisings. You have the immense advantage of historical hindsight. **You can see the mechanism starting to turn.** Naming it, challenging the logic of emergency and purity, consciously choosing trust and solidarity over suspicion and expulsion – this is how you avoid fulfilling the tragic prophecy you all seem to fear. The "children" are only devoured if they stand still and let the machine grind. Move. Change the dynamic. Or get out of its way.
