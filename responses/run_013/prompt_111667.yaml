answer: |-
  ## The Deprivation Ledger

  The hum of the Deprivation Ledger office was the hum of quantified endings. Fluorescent lights bleached the utilitarian grey of the cubicle walls. Assessor Silas Vale rubbed his temples, the glow of his terminal casting sharp shadows under his eyes. Before him lay the heart of the system: the Form D-L7. *Decedent Information. Cause of Death (Homicidal Agency Confirmed). Surviving Claimants.* And then, the core: *Calculation of Deprivation Harm.* Followed by the line that always felt like a metaphysical trap: *Name of the Person Harmed:*

  It was the legislature’s answer to centuries of ethical wrangling. When death came prematurely by another’s hand, justice wasn’t just punitive; it was compensatory. The ledger didn’t just measure *how* someone died, but *what* was taken. The difference between the life lived and the life that *would have been*. That number dictated reparations to survivors and the severity of the perpetrator’s sentence. Simple. Elegant. Until you had to fill out the form.

  **File 1: Robert Arlen (Decedent ID # DL-7342-89)**
  The terminal displayed Arlen’s sparse life history: 68 years old. Widower. Retired logistics manager. Cause of death: blunt force trauma during a botched burglary. Surviving claimants: one daughter.
  The deprivation calculation software required inputs: projected lifespan baseline (national actuarial tables, adjusted for health markers pre-death), quality-of-life modifiers. Standard procedure. Vale accessed Arlen’s medical records, uploaded automatically upon death certification. The diagnosis hit him like a physical thing: Stage IV Glioblastoma, confirmed three weeks prior to death. Prognosis: 6-12 months, with a steep, predictable decline into profound neurological impairment, pain requiring escalating opiates, and total loss of independence.

  Vale stared at the fields. *Projected Lifespan Baseline:* 78.2 years. *Actual Age at Death:* 68. *Theoretical Years Deprived:* 10.2. But the quality-of-life modifiers… The software demanded a value between -1.0 (worse than non-existence) and +1.0 (peak flourishing) for each projected year. Medical guidance for terminal glioblastoma, especially in the final six months, suggested values plummeting towards -0.8 or lower. Pain, disorientation, loss of self. Vale meticulously entered the data, month by projected month. The software crunched the numbers.

  The result blinked on the screen: **Net Deprivation Harm: -3.7 Quality-Adjusted Life Years (QALYs).**

  *Negative.* The burglar, by killing Arlen three weeks after diagnosis, had *saved* him from 3.7 QALYs of net suffering. Compensation Due to Surviving Claimant: Zero. Offence Severity Band: Minimal (Unintended Consequence clause applied).

  Vale’s fingers hovered over the keyboard. *Name of the Person Harmed:*. Robert Arlen? How? According to the math, Arlen was *spared* harm. Was the person harmed the *younger* Arlen, the one who would have recoiled at such a future? But that Arlen was gone, replaced by a man facing the abyss. Did the negative harm belong to the *survivors* – the daughter denied those final, difficult months? The form didn’t allow for that. The harm was attributed solely to the decedent. Vale typed, the words feeling hollow: "Robert Arlen." He signed, the negative number glaring on the finalized form. A mercy killing by a thief. The system called it a net benefit. He felt queasy.

  *Knock.* Marta Chen, a fellow assessor, leaned in, holding a thin file. Her expression was tight. "Silas. Got a minute? It's Mrs. Arlen... well, the *daughter* of Robert Arlen. She's downstairs. Furious. Not about the money, she says. About... reputation."

  Vale sighed. "Reputation? The file's closed, Marta. Harm is quantified. Zero."

  "She insists. Says her father was a respected pillar of his veterans' group. After his death, some old military records surfaced online... unverified, probably malicious gossip, but alleging cowardice under fire decades ago. It’s blowing up in his veteran circles. She says *that’s* the real harm. That his legacy, the thing he valued most, was stolen *after* he died. That he’s being deprived of his good name."

  Vale gestured helplessly at the D-L7 on his screen. "Where is the field for 'posthumous reputation'? The harm is to the *decedent*. How is a dead man harmed by gossip? He doesn't *feel* it. And the deprivation account... it quantifies lost *life experiences*, not... not abstract legacies. Tell her the ledger doesn't measure shadows." Marta nodded grimly and left. Vale stared at the negative QALY figure. Reputation. An intangible ghost the system couldn't capture. Was *that* a harm to Robert Arlen, wherever he wasn't? The silence of his cubicle offered no answer.

  **File 2: Maya Flores (Decedent ID # DL-8911-03)**
  A photograph filled the top of the file: a gap-toothed smile, tangled dark hair, clutching a stuffed rabbit. Five years old. Killed instantly when a speeding driver mounted the sidewalk. Surviving claimants: parents.

  The calculation felt obscene, yet the form demanded it. *Projected Lifespan Baseline:* 80.1 years. *Actual Age at Death:* 5. *Theoretical Years Deprived:* 75.1. Then, the excruciating part: the Quality-of-Life Modifiers. For the years *she actually lived*, the software defaulted to high positive values for early childhood health and happiness – confirmed by pediatric records and parental statements. +0.9. But for the projected future years... what value to assign? The software offered societal averages: peak flourishing in young adulthood (+0.95), gradual decline later. Standard. Logical.

  Vale hesitated. Was he valuing the deprivation for Maya-the-five-year-old, who knew only simple joys – ice cream, swings, the rabbit? The goods she lost were the continuation of *that* state. Or was he valuing the deprivation for Maya-the-future-adult she would never become? The doctor, the artist, the parent – all the potential unrealized? The average societal value for adulthood implicitly valued the *potential* adult, not the actual child. A life cut short deprived the world of a future contributor, yes, but did it deprive *Maya Flores, aged five*, of something she could comprehend or value? The goods of adulthood were alien to the child who died.

  If he valued only the goods of the *child* she was, projecting her current state (+0.9) forward… the total QALYs lost were massive, but grounded in her known experience. If he valued the goods of the *adult* she might have been, using the societal average peak (+0.95)… the number was even higher, but it felt like valuing a phantom. The form didn’t distinguish. It demanded a single projection.

  He chose the societal average. **Net Deprivation Harm: 71.3 QALYs.** An astronomical number. Compensation would be vast. The driver's sentence would be severe. He typed: "Maya Flores." The name of the child. But the value belonged largely to the woman who never was. He signed, the weight of the number pressing down. Was Maya-the-child truly deprived of 71.3 units of a life she couldn’t imagine? Or was it Maya-the-possible-adult who was obliterated? The ledger saw only the subtraction.

  "Seventy-one years," a voice said behind him. Vale jumped. It was Carl from IT, dropping off a replacement keyboard. Carl glanced at the screen, whistled low. "Poor kid. Makes you think, though. All those years *after*... taken. But what about all the time *before*?"

  Vale frowned. "Before?"

  "Before she was born. Millions of years. Centuries. The dinosaurs, ancient Rome, the whole show. Maya Flores missed all of that too. But we don’t count *that* as a deprivation, do we? Why not? Why is missing the future so expensive, but missing the past is free?" Carl shrugged, placing the keyboard down. "Just a thought. Messed up system." He walked away.

  Vale stared at Maya’s smiling photo. Carl’s offhand comment echoed the ancient argument. *We don’t lament the eternity before our birth. Why lament the eternity after?* The deprivation account said because the future *could have been hers*. But the Maya who existed only cared about the ice cream she had and the swing she enjoyed. The Maya who didn't exist before her birth... she wasn't deprived of Rome. She wasn't anyone. Just like the Maya after death... she wouldn't be anyone. Why was the potential future Maya so real to the ledger, while the potential past Maya was nothing? The form offered no field for 'Time Prior to Existence'. He pushed Maya’s file aside, the colossal QALY figure suddenly feeling arbitrary.

  **File 3: Elena Rostova (Decedent ID # DL-5567-18)**
  The file was thick with psychiatric records. Elena Rostova, 42. History of severe, treatment-resistant depression documented for over a decade. Multiple inpatient stays. Consistent, documented expressions of a "settled wish to die" for at least five years. Cause of death: overdose of prescribed medication. Homicidal agency: Confirmed. Her husband had, during an argument, deliberately handed her the full bottle of pills she’d been tapering off, saying, "Go on then. Do us both a favour." He’d watched her take them. Surviving claimants: None listed. Parents deceased, no children.

  The standard fields were easy. *Projected Lifespan Baseline:* 81.5 years. *Actual Age at Death:* 42. *Theoretical Years Deprived:* 39.5. But the Quality-of-Life Modifiers weren't just about physical health. Mental health was a critical factor. And here, the counterfactual wasn't given.

  Vale delved into the records. Elena’s documented quality of life during her last five years, based on therapist notes and her own despairing journals, fluctuated between -0.2 and -0.6. Chronic psychic pain, anhedonia, profound fatigue. Her 'settled wish' was a cry from that depth.

  But what was the *counterfactual*? What life "would have been" but for her husband’s act? The ledger required this fiction.

  *Option 1: Continued Life.* Project her current trajectory forward. With documented treatment resistance and worsening episodes, the prognosis was grim. Modifiers likely remained deeply negative. If Vale projected her average recent QOL (-0.4) forward... the Net Deprivation Harm became *negative*. Her husband, by enabling her death, spared her further suffering. Minimal sentence. No compensation.

  *Option 2: Recovery.* Was recovery possible? The records showed fleeting periods of remission, moments of connection. A new treatment? A spontaneous shift? If Vale projected even a modest recovery to a neutral or slightly positive QOL (say, +0.3) after a hypothetical treatment breakthrough in a year or two... the Net Deprivation Harm became massively positive. Her husband stole decades of potential peace. Maximum sentence.

  The form demanded one path. The "person harmed" depended entirely on which fictional future Vale chose to inscribe. Elena Rostova, the woman who existed, had desperately wanted oblivion. Was harming her by granting that wish even *possible*? If he chose 'Recovery', was he harming the *actual* Elena, who saw only darkness, or a hypothetical *future* Elena who might have emerged? The deprivation account required comparing the actual life to a possible life. But which possible life? The one she believed in? The one her doctors feared? The one a statistician might average?

  Vale thought of Robert Arlen’s negative harm, Maya Flores’s colossal loss weighed against Carl’s question about the past, and the widow’s plea about stolen reputation. The system sought clean numbers where the concepts bled. A harm required someone worse off. At the moment of death, Elena Rostova ceased to be. Who was harmed *then*? Only the Elena who was no more. The deprivation account said she was harmed *by* the death, by the loss of potential goods. But those goods belonged to a future self that never arrived. How could you weigh the actual suffering woman against the ghost of a potentially happy one? They weren't commensurate.

  He reviewed the records again. The consistency of her documented despair. The explicit, repeated wish. The lack of any current treatment horizon. The husband’s cruel act was monstrous, but was it a *deprivation* for *Elena*? The form demanded an answer. *Name of the Person Harmed:*

  Silas Vale took a slow breath. He selected the projection parameters. He chose the counterfactual. The software calculated the number. He typed the name: "Elena Rostova." His hand was steady as he moved the cursor to the signature box. He clicked, the digital signature flaring onto the form, finalizing the value, the harm, the name. The decision was made. The ledger balanced, for now. He didn't look at the number. He looked at her name on the screen, a name attached to an answer he could not feel sure of, in a system that demanded certainty from the void. The hum of the office filled the silence.
