  10. **Deflationary view**  
      *Awkward commitment*: You must explain why logical equivalence (H ≡ its contrapositive) doesn’t imply evidential equivalence, appealing to context or pragmatics.  

  11. **Unexplored position**  
      *Diagnosis*: Your answers don’t match any standard view. This may indicate an incoherent stance (e.g., non-ravens *can* confirm, but not via logic, probability, selection, severity, or holism) or a novel solution.  

  ---

  ### How to Use  
  - **As a handout**: Print the tree diagram and leaf explanations. Group members answer the root question and follow branches until they reach a leaf.  
  - **In discussion**: Compare leaves and debate awkward commitments (e.g., *"Do you really think a white shoe confirms raven blackness?"* for Hempelians).  
  - **Refinement**: If multiple members land on "Unexplored," discuss whether it reveals a gap in standard positions or incoherence.
