prompt: |-
  I'm a third-year PhD student and I've got into an argument with the person I share a flat with — a statistics postdoc who reads a great deal of decision theory — that neither of us can settle, and I'd like a ruling from someone who genuinely works on the mathematics of betting rather than from a financial adviser or a friend who will simply tell me to be sensible.

  Here is the situation. A friend of mine is starting a small business and has offered me the chance to buy in at the outset, once and only once, on terms that amount to this: with probability one half my stake triples, and with probability one half I lose the entire stake. I have about £25,000 in savings, which is everything I own apart from furniture, and there is no second round, no way to buy in later, and no market in which I could sell the stake on. My flatmate says I should put in roughly a quarter of my savings — a quarter, he says, is what falls out of an argument about the rate at which my wealth compounds over time, as opposed to the average of the outcomes across imaginary copies of me — and that materially more than that is reckless and materially less is timid. What I cannot get past is this: I can see why a quarter would be the answer if I were going to be offered this same bet again and again for the rest of my life, and I can see why staking everything would be the answer if I cared only about the expected value of my wealth, but I cannot see what makes a quarter the answer to a bet I will be offered exactly once. When I press him on it he says I am averaging over the wrong thing, that the quantity that matters is how fast my wealth grows along the single trajectory that is my actual life, and that this is still the right way to think when there is only one bet, precisely because there is only ever one of me. That sounds to me as though it might be quietly assuming a repetition that isn't there, but I cannot put my finger on where.

  Two smaller things nag at me as well. First, my savings are a strange denominator for this decision, since I expect to earn several times that amount over the course of my career and none of that future income is in the account, or sellable, or hedgeable. Second, my own income comes from the same small sector as my friend's business, so a bad outcome for the sector is a bad outcome for me twice over. I would like to know whether these change the arithmetic or merely the psychology.

  Please answer as an expert in decision theory and the theory of optimal betting, and be willing to tell me plainly that one of us is confused. Before you write, work out what is actually doing the work in the argument for a quarter — whether it is a theorem about rationality as such, a theorem about a particular way of measuring value, or a heuristic borrowing authority from a case that does not apply here — and then tell me which of the three it is. Open with a two- or three-sentence verdict on who has the better of the argument, then give the reasoning, including what would have to be true for a quarter to be exactly right and what the honest answer is if it is not. If the truth is that the question has no answer until I say how much a pound is worth to me at different levels of wealth, say so plainly and say what follows from each choice. No more than 450 words.
reasoning: |-
  Alright, the user is a PhD student in a debate with their flatmate, a stats postdoc, about how much to invest in a one-time business opportunity. The bet is 50/50: triple the stake or lose it all. The flatmate argues for investing a quarter of their £25k savings, citing growth optimization over repeated bets. The user is skeptical because this is a single bet, not repeated.

  First, I need to dissect the postdoc's argument. The quarter comes from the Kelly criterion, maximizing expected log wealth. For a bet with 50% win probability and 3:1 payoff, Kelly says to bet (bp - q)/b, where b is 2 (since triple means net gain of 2x), p=0.5, q=0.5. So (2*0.5 - 0.5)/2 = (1-0.5)/2 = 0.25. That's the fraction. Kelly is optimal for repeated bets because it maximizes the growth rate, avoiding ruin. But this is a single bet. 

  The user's confusion is valid. Kelly's justification relies on long-term growth over many trials. For one bet, maximizing expected log wealth is equivalent to maximizing geometric mean growth, but it's not about repeated bets. It's about the utility function. If the user's utility is logarithmic, meaning they value proportional wealth changes equally, then Kelly is optimal even for a single bet. But is log utility appropriate here?

  The user's savings are £25k, which is all they have, but they mention future earnings potential, which isn't included. Also, their income is tied to the same sector as the business, adding correlation. These factors matter. Log utility assumes that utility scales with the logarithm of wealth, but if their future income is substantial, current wealth might be a small part of their total human capital. Betting a quarter might be too aggressive.

  For a single bet, the optimal fraction depends entirely on risk aversion. If the user has log utility, then 25% is indeed optimal for a one-time bet. But if their utility is different, say more risk-averse, then less is better. The future income and sector correlation amplify risk. Losing the stake could hurt more if the sector tanks, affecting their job too. So 25% might be too high.

  The flatmate is technically correct if we assume log utility, but that assumption needs scrutiny. The user's total wealth includes future earnings, so the denominator should be total wealth, not just savings. If savings are a small fraction of total wealth, betting less might be prudent. Also, the correlation means the bet isn't independent; losing the stake likely coincides with lower future income, increasing the real risk.

  The verdict: the postdoc's math is sound under log utility, but it's not necessarily the right model here. The user needs to consider their overall financial picture and risk tolerance. Given the sector correlation and future earnings, a smaller bet—maybe 10-15%—could be wiser. The user's instincts about the denominator and correlation are spot on; these factors reduce the optimal stake. Advising the user to scale down from 25% due to their specific circumstances.
answer: |-
  **Verdict:** Your flatmate's quarter stake relies crucially on assuming your utility is logarithmic in wealth (i.e., you value proportional gains/losses equally). This is mathematically optimal *only* under that specific assumption, even for a single bet—it's not about repetition. However, your concerns about future income and sector correlation are valid and materially reduce the optimal stake. **You have the better argument on the practical relevance.**

  **Reasoning:**  
  The "quarter" (Kelly fraction) maximizes expected *log* wealth: (bp - q)/b = (2*0.5 - 0.5)/2 = 0.25, where b=2 (net odds). This maximizes long-run growth if repeated, but for a single bet, it optimizes geometric mean growth under log utility. If your utility is truly logarithmic, 25% is optimal *even once* because it maximizes the expected utility of final wealth.  

  **But:**  
  1.  **Log utility is an assumption**, not rationality itself. It implies extreme risk aversion: losing £X hurts more than gaining £X pleases. Many have less concave utility.  
  2.  **Future earnings:** Your £25k savings likely represent a fraction of your total (discounted lifetime) wealth. Betting 25% of *savings* could be 5-10% of true total wealth—overly aggressive.  
  3.  **Sector correlation:** A business failure likely coincides with reduced job prospects. This *doubles* your exposure, demanding a smaller stake.  

  **Honest answer:**  
  The "correct" stake requires specifying your utility function. Without this:  
  - **If you have log utility**, bet 25% *of total wealth* (but savings ≠ total wealth).  
  - **Given future earnings/correlation**, bet materially *less* than 25% of savings—perhaps 5-15%—as your effective risk is higher and total wealth larger. Staking nothing due to correlation is defensible.  

