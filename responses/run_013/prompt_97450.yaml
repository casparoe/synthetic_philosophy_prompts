  My bet leans toward Rule 3 (Hybrid Rule). The friend's strong "obviously fine" reaction to early rape cases suggests rape is a trump card, and their 34-week disapproval focused on elective reasons, not rape. The parental obligation comment further highlights how they weight responsibility.

