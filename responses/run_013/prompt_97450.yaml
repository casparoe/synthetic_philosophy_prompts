prompt: |-
  My friend has been running through a pile of abortion cases with me and I want to know what rule she's actually running, because I'm not sure she knows either. Her verdicts so far: pregnancy from rape at seven weeks, abortion is fine, obviously. A married couple whose contraception failed, ten weeks, fine. Consensual sex, no contraception, ten weeks, also fine, she's not squeamish about early ones at all. Any case where the woman's life is in danger, fine at any stage, no argument. But a woman at thirty-four weeks with a healthy pregnancy who simply doesn't want to be pregnant anymore: she thinks that's wrong, and not mildly. She also thinks a woman who was raped and carries to term has no duty to raise the kid, but that's seperate.

  Now she's asking me what I think she'd say about a new one: pregnancy from rape, twenty-eight weeks, fetus healthy, and the woman wants to end it. I have a feeling she'd say fine, but I can see how her earlier verdicts could just as easily be read as a stage rule that says no. Lay out the rules her verdicts are compatible with, what each one predicts for this case, your best guess at which rule she's actually running and why, and then the case that would actually tell the rules apart. Dont worry about which answer is morally correct, I want to know which one is hers.

  Give it back to me as: "The rules that fit" (two or three rules, a few sentences each), "What each predicts here" (short), "My bet" (one paragraph), "The case that would settle it" (one short paragraph).
