answer: |-
  Here's the breakdown of your friend's implicit rules based on her verdicts:

  **The rules that fit**  
  1. **Stage-Capped Autonomy Rule**: Bodily autonomy justifies abortion *until fetal viability* (typically 24-28 weeks), but not after, unless the mother’s life is endangered. Rape is irrelevant to the stage cutoff—it’s purely about development.  
     *Fits:* Early abortions (7–10 weeks) are permissible regardless of circumstances; 34-week elective abortion is forbidden. Life threats override everything.  

  2. **Innocence-Adjusted Rule**: Abortion is always permissible in rape cases (any stage) because the woman bears *no responsibility* for the pregnancy. For consensual pregnancies, it’s permitted only until viability. Life threats are independent exceptions.  
     *Fits:* Early consensual cases are fine pre-viability; rape is "obviously fine" early and might extend later; 34-week elective (consensual) is unacceptable.  

  3. **Hybrid Rule**: Viability (e.g., 24+ weeks) is the cutoff for *elective* abortions (where pregnancy is consensual and low-risk), but rape *or* life threats override viability limits entirely.  
     *Fits:* Early cases are unrestricted; 34-week elective is wrong due to viability; rape exceptions could extend beyond viability.  

  **What each predicts for 28-week rape case**  
  - **Rule 1 (Stage-Capped Autonomy)**: **Forbid abortion**. Viability is the line, rape doesn’t extend it.  
  - **Rule 2 (Innocence-Adjusted)**: **Permit abortion**. Rape removes all restrictions.  
  - **Rule 3 (Hybrid)**: **Permit abortion**. Rape overrides viability limits.  

  **My bet**  
  I’d wager she’s running the **Hybrid Rule (Rule 3)**. Her "obviously fine" verdict on early rape cases suggests rape isn’t just a mitigating factor—it’s a *categorical exception* that likely trumps other concerns, even late-term. She treats consensual pregnancies more strictly (allowing abortion only pre-viability), but her emphasis on rape as uniquely justifying early termination implies it’s a distinct moral category. The 34-week rejection focused on the woman "simply not wanting it" in a *healthy, consensual* context—not mentioning rape. Her aside about no duty to raise a rape-conceived child further underscores how heavily she weights "responsibility" in her moral logic. Rule 3 best captures her balance: viability matters for consensual pregnancies, but rape (like life threats) breaks the rule entirely.  

  **The case that would settle it**  
  Present a **consensual pregnancy at 28 weeks, healthy fetus, where the woman no longer wants to be pregnant** (mirroring the 34-week case but earlier). If she forbids it, she’s likely using Rule 1 or 3 (viability as strict cutoff). If she permits it, she’s using Rule 2 (innocence/responsibility matters more than stage). Her reaction would clarify whether viability alone drives her late-term limits (Rule 1) or if responsibility is the core factor (Rules 2/3).
