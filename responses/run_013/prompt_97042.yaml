  For the characters: 
  - Dr. Evans as the judgment theorist works because surgeons rely on objective assessments, but I'll show her frustration when emotions don't align with facts. 
  - Nurse Anya as perception theorist makes sense - her job involves reading subtle physiological cues. 
  - Ben the orderly embodies "just feelings" - he's pragmatic but overlooks how emotions convey meaning.

  The objectless dread scene needs to feel visceral - maybe Lena staring at unused equipment before any emergency occurs? And the contradiction moment could be her freezing during a routine procedure despite knowing it's safe. 

  Key tricks: 
  - Using dialogue to reveal theories indirectly (Evans: "But nothing's wrong!" / Anya: "The body knows first") 
  - Ben's "just reboot" line oversimplifying while actually demonstrating how feelings persist despite judgment 
  - Ending on Lena's unresolved physical tremor - concrete evidence that won't fit neatly into any theory

  Must avoid: 
  - Lecturing (no "As James-Lange theory says...") 
  - Resolution (theories remain in tension) 
  - Spider clichés (using medical context instead)
  - Making characters archetypes (Evans dismissive but competent, Anya perceptive but anxious, Ben kind but reductive)

  The coffee machine opening establishes normalcy before dread intrudes. Lena's delayed reaction to the saline bag shows emotion operating separately from judgment. Final image of her hand shaking leaves all interpretations valid - Evans sees malfunction, Anya sees truth, Ben sees noise.
answer: |-
  The rain drums against the hospital ward windows. Inside, the fluorescent lights buzz over the usual mid-afternoon lull. Lena, a senior nurse, stares at the empty bed in Bay 3, recently vacated. Her usual brisk efficiency is gone. She’s pale, gripping the edge of the nurses' station counter.

  **Dr. Evans** (Chief Resident, brisk, checking a chart): "Lena? You okay? Patient in 3 transferred smoothly, vitals were textbook."

  Lena shakes her head slightly, not looking at him. "It's... nothing. Just a feeling. Heavy. Like storm clouds sitting right *here*." She presses a fist to her sternum. "Before Mr. Henderson even left. Just... grey pressure."

  **Anya** (Nurse, intuitive, pauses while restocking gauze): "Your shoulders are up by your ears, Lena. And you’re breathing shallow. Like you did before that septic shock case last month." She approaches slowly. "It’s in your body. That weight *means* something."

  Evans frowns. "But *what*? There's no threat. Henderson’s fine, the bay’s empty, no alarms. It’s just... neural static. Fatigue, maybe." He taps his temple. "Mis-firing signals. Ignore it, Lena. Focus on the facts."

  **Ben** (Orderly, pragmatic, wiping down a trolley): "Yeah, just ride it out. Deep breaths. It’ll pass. Feelings come, feelings go. Like indigestion." He offers a weak smile. "Want some water?"

  Lena forces a nod, accepting the cup. The dread doesn't lift, but it ebbs slightly as she mechanically sips. The afternoon crawls on.

  Later, during a routine IV line change for Mrs. Gable, a cheerful, stable patient, Lena freezes. Her hand, holding the saline bag connector, stops inches from the port. She knows the procedure cold. She *knows* Mrs. Gable is fine, the line is clean, the risk infinitesimal. Yet a cold wave of revulsion washes over her – a visceral recoil, as if she’s about to touch something putrid. Her knuckles whiten.

  **Anya** (Watching, voice soft): "Lena? What is it? What do you *see*?" She’s scanning Lena’s face, then Mrs. Gable, then the line, searching for the source of the perceived danger.

  **Lena** (Voice tight, strained): "Nothing! It’s... it’s irrational. I know it’s fine. But it feels... contaminated. Wrong." She forces her hand forward, connecting the line with a visible shudder.

  **Evans** (Exasperated, entering the bay): "Lena, you’re making Mrs. Gable nervous. It *is* fine. Your *judgment* knows that. Whatever misfire happened earlier is lingering. Override it." He gestures sharply. "It’s just noise."

  **Ben** (Frowning at Lena’s obvious distress): "Whoa, okay, deep breaths again? Look, it’s just a bad feeling. Like a song stuck in your head, annoying but harmless. Maybe take five? I’ll finish up here." He moves to take the saline bag, his offer practical, dismissing the emotion's significance.

  **Lena** (Pulling her hand back, trembling slightly): "But it *felt*... like a warning. Like it was showing me something dangerous, even though..." She looks at the perfectly ordinary IV setup, then at her own trembling hand, utterly confused.

  **Anya:** "It *was* showing you something. Maybe not about the IV." Her eyes dart to Mrs. Gable’s slightly elevated respiration, unnoticed before. "Or maybe... something else entirely. The body registers things we don't *know* yet." Her theory strains against the lack of any immediate, visible threat.

  **Evans:** "Showing you what? A phantom? It contradicted your own clear assessment! That proves it’s just a faulty feeling, disconnected from reality." His judgment-based view stumbles over the sheer, undeniable *force* of Lena’s contradictory revulsion.

  **Ben:** "Yeah, faulty wiring. Happens. Reboot later. Cup of tea?" His "just feelings" stance seems suddenly thin, unable to explain why this particular "feeling" carried such a powerful, specific sense of *wrongness*, of presenting danger, even if mistaken.

  Lena stares at her hand, the phantom dread from earlier a dull echo beneath the sharp, illogical revulsion that still prickles her skin. Evans watches her, frustration warring with concern. Anya studies Mrs. Gable, then Lena, then the innocuous IV line, searching for the hidden value her perception insists must be there. Ben picks up the discarded saline packaging, ready to move on, the storm inside Lena just another blip in the hospital's rhythm. The rain streaks the darkening window, reflecting the fluorescent glare, and Lena’s hand won’t stop trembling.
