  For step 5 about misapplied remedies, I'm considering contrastive cases: AI techniques trying to prevent reward tampering would be irrelevant for animal models, while satiation mechanisms for animals wouldn't stop an AI from rewriting its code. That should demonstrate concrete operational differences.

