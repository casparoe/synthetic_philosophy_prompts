  ### Activity Design: "Metric Pressure: A Futarchy Simulation"

  #### **Activity Name**  
  "Metric Pressure: A Futarchy Simulation"  

  #### **Setting**  
  A single room with movable chairs arranged in a circle. Wall space for a central poster board to track votes and market prices. Participants work with paper handouts.  

  #### **Duration**  
  90 minutes  

  #### **Materials**  
  - 16 role cards (laminated paper)  
  - 16 private information cards (sealed envelopes)  
  - 16 trading sheets (paper grids for recording trades)  
  - 1 central poster board with metric menu and price-tracking grid  
  - Markers, timer, dice (for randomization)  
  - Tokens: 80 red chips (Policy A shares), 80 blue chips (Policy B shares)  

  #### **Metric Menu**  
  Three options (displayed on poster board):  
  1. **Average Satisfaction**: "Measure: Mean self-reported student happiness (scale 1-5). *Hidden consequence:* Favors majority; may neglect marginalized groups."  
  2. **Worst-Case Safety**: "Measure: Minimum safety score across student groups (scale 1-5). *Hidden consequence:* Focuses on vulnerable populations; may sacrifice overall welfare."  
  3. **Rank Mobility**: "Measure: % of students moving from bottom 40% to top 60% in academic ranking. *Hidden consequence:* Rewards targeted interventions; may ignore systemic issues."  

  #### **Market Rule**  
  "Quadratic Scoring Rule for share prices:  
  - Initial price for all shares: 2.5 points.  
  - Trade chips at integer prices (1-5).  
  - Post-trade, adjust price = (your bid/ask + last trade price) ÷ 2.  
  - Final portfolio scored: Points = 10 − |actual outcome − your avg. share price|²."  
  *Arithmetic hack:* Prices only integers; outcomes capped at 5.  

  #### **Roles**  
  - **4 Informed Traders** (Public: "You have data on policy impacts." Secret: "Get +3 points if Policy A chosen, regardless of outcome.")  
  - **4 Skeptics** (Public: "You question policy effectiveness." Secret: "Get +4 points if implemented policy’s outcome ≤ 2.")  
  - **8 Regular Voters** (Public: "Maximize the metric." Secret: "No bonus.")  
  *All roles receive private info cards with beliefs (e.g., "You believe Policy A yields 4, Policy B yields 2").*  

  #### **Steps**  
  1. **Metric Vote (10 min)**:  
     - Explain policies: *Policy A* (Universal Basic Income trial), *Policy B* (Job Training vouchers).  
     - Debate metric options (7 min), then vote. Metric chosen by plurality.  

  2. **Role Assignment (5 min)**:  
     - Distribute role cards and sealed private info. Do *not* reveal secret payoffs.  

  3. **Market Setup (5 min)**:  
     - Distribute trading sheets and 5 chips per policy per player.  
     - Explain scoring rule and trade recording (e.g., "Sell 1 A-share at $3 to Player 4").  

  4. **Trading (20 min)**:  
     - Open market: Players trade chips, record transactions.  
     - Track last price per policy on poster board. Instructor enforces price adjustments.  

  5. **Policy Decision (5 min)**:  
     - Calculate final Policy A/B avg. prices from last 5 trades. Higher price wins.  

  6. **Outcome Resolution (10 min)**:  
     - Roll dice for actual outcome (1-5) *based on hidden metric consequence* (e.g., if Worst-Case chosen and Policy B wins, outcome=4).  
     - Resolve portfolios: Apply scoring rule to shares of *implemented* policy only. Non-implemented shares = 0 points.  

  7. **Hidden Reveal (5 min)**:  
     - Show alternative outcomes: "Had you picked Average Satisfaction, Policy A would have won with outcome=3 (not 1)."  

  8. **Debrief (30 min)**: Map experiences to futarchy pressures.  

  #### **Hidden Reveal**  
  "Under your chosen metric (Worst-Case Safety), Policy B succeeded (4). But if you’d picked Average Satisfaction, Policy A would have won with 3—and Policy B’s counterfactual (never implemented) was actually 5. The metric choice alone reversed the 'optimal' policy."  

  #### **Debrief Mapping**  
  - **Metric Debate**: "Your values were fixed by vote, but the ‘factual’ market couldn’t question the metric’s bias." → *Value/fact division.*  
  - **Skeptic Trading**: "Some traded B-shares high to force its implementation, hoping for low outcomes." → *Division breakdown (private incentives).*  
  - **Unresolved Trades**: "Non-implemented policy shares became worthless—no payout, no truth." → *Counterfactual problem.*  
  - **Hidden Reveal**: "The ‘best’ policy flipped with the metric—a choice the mechanism can’t evaluate." → *Metric sensitivity.*  

  #### **Predictable Failures**  
  - **Trading Collapse**: First-time traders freeze; only 30% engage. *Fix:* Assign 2 "market maker" roles to seed initial bids.  
  - **Arithmetic Gridlock**: Price adjustments bottleneck. *Fix:* Use pre-printed calculator sheets.  
  - **Contrarian Break**: One Skeptic loudly protests, stalling trades. *Fix:* Isolate disruptor with a "data analysis" side task.  

  #### **Cannot Reproduce**  
  "Real prediction markets aggregate *dispersed* information via high liquidity. Our tiny, noisy market can’t simulate this efficiency—I’ll explain why post-activity."  

  #### **Committed Choice**  
  **Quadratic scoring without money**: Defended because it forces belief-revelation *through stakes* (points), mirrors market incentives, and fits 90-min math (no continuous prices). Compromises on realism to prioritize "felt" counterfactual futility.  

  #### **Confidence**  
  0.75. Works if trading ignites; fragile if metric debate overruns.  

