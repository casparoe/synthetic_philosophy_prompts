  So the policy can condition on the mark: if there is a mark, then the agent knows it is at the second intersection (so it can exit). If there is no mark, then it could be at the first or second. This breaks the symmetry and allows for a better policy. For example, the agent can plan: at the first intersection (which will be in the no-mark state), leave a mark and continue. At the second intersection, if there is a mark (meaning this is the second intersection and the first was marked), then exit. If there is no mark at the second intersection, then it must be that the agent did not leave a mark at the first, so it is at the second and should exit? But wait, if the agent at the first did not leave a mark, then at the second it sees no mark, and then it doesn't know if it is at the first or second. So the same problem recurs.

  Actually, the mark does not solve the problem of imperfect recall because the agent at the second intersection without a mark does not know if it is at the first or second. Therefore, the agent must still choose a policy that is the same at all no-mark states. However, note that the agent at the first intersection can leave a mark and then continue. Then at the second intersection, it sees the mark and exits. But what if the agent at the first intersection does not leave a mark? Then at the second intersection, it sees no mark and does not know if it is the first or second. So it must choose an action that is optimal for both.

  The optimal policy might be: at the first intersection (which always has no mark), leave a mark and continue. At a no-mark state that could be the first or second, the agent does not know. But note that if the agent at the first intersection left a mark, then the second intersection will have a mark. Therefore, if the agent is at a no-mark state and it is the second intersection, then it must be that the agent did not leave a mark at the first. So the agent at a no-mark state knows: if it is the first intersection, then it hasn't left a mark yet and this is the first. If it is the second, then it must be that the first was not marked. Therefore, the agent at a no-mark state still does not know if it is the first or second. So the mark does not break the symmetry in the no-mark state.

  However, the mark does break the symmetry in the mark state: if the agent sees a mark, it knows it is at the second intersection. Therefore, the agent can condition on the mark: if mark is present, exit (because it is the second intersection). If no mark, then the agent is at an indistinguishable state (either first or second without a mark) and must follow a policy that is the same at both. So the policy for the no-mark state must be a mixed action that is optimal given that with some probability it is the first and with some probability the second.

