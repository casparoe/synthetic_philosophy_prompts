  We are going to set out the requirements for an adequate decision theory for agents with imperfect recall, with the goal of being usable by a bounded agent. We'll start with the bottom line, then the reasoning, including the requirements, their cases, and which are non-negotiable. Then we'll consider a variant with durable marks and finally give one-line verdicts on standard families.

  Bottom line: Any adequate decision theory for bounded agents with imperfect recall must require that the agent chooses a policy (a complete contingent plan) at the outset and then follows it, because at the moment of action the agent lacks the information to make a contextually independent choice.

  Requirements:

  1. **Policy Evaluation Over Action Evaluation (Non-negotiable)**: The theory must evaluate entire policies (complete mappings from information states to actions) rather than individual actions. 
     *Case*: In the absent-minded driver, if you evaluate actions at the first intersection independently, you get a contradiction because the action taken at the first intersection is evidence about the state (which intersection you are at). Only by evaluating the entire plan (e.g., "always exit" or "always continue") can you avoid the inconsistency. This is non-negotiable because without it the agent cannot make a coherent decision.

  2. **Distinction Between Choice and Prediction (Non-negotiable)**: The theory must not confuse the act of choosing an action with predicting what the agent will do. 
     *Case*: In the absent-minded driver, when at an intersection, the agent must not treat its current action as evidence about what it will do at the other intersection because it cannot remember the past and the same policy is followed at both. This confusion leads to the flawed reasoning that one should exit with probability 2/3 at the first intersection (which is actually the policy that maximizes expected utility) but then at the moment of action the agent thinks it is at the second intersection with some probability and updates, leading to a different choice. The theory must avoid this.

  3. **Handling of Imperfect Recall Versus Unawareness (Non-negotiable)**: The theory must correctly model the agent's knowledge at each point, including what the agent does and does not remember. 
     *Case*: The absent-minded driver forgets which intersection it is at, but it is aware of the structure of the problem (the two intersections and the payoffs) and that it has imperfect recall. This is different from an agent who is unaware of some states or actions. The theory must not treat the lack of memory as a lack of awareness.

  4. **Time of Evaluation (Preference)**: The theory should allow the agent to choose a policy at a time when it has full information (e.g., before starting the drive) and then follow that policy without further deliberation. 
     *Case*: This is a practical requirement for bounded agents because they cannot recompute the optimal action at every step. However, some theories might allow for re-evaluation at each step (with care) without violating the above requirements, so this is a preference for boundedness, not non-negotiable.

  5. **Robustness to Self-Modification and Commitment (Non-negotiable)**: The theory must handle cases where the agent can leave a durable mark (as in the variant) without treating the mark as restoring perfect recall. 
     *Case*: In the variant with marks, the agent can leave a mark at an intersection and see marks left by past selves. However, the agent still cannot remember whether it left a particular mark. The mark is a form of commitment device because it allows the agent to condition its policy on the mark. The theory must not treat the mark as restoring memory (which would change the information state to perfect recall) but as a way to implement a more complex policy. This requirement is non-negotiable because the mark does not eliminate the imperfect recall: the agent does not know if it is the one who left the mark or a future self seeing it.

  6. **Consistency Across Information States (Non-negotiable)**: The policy chosen must yield consistent behavior at informationally identical states. 
     *Case*: In the absent-minded driver, both intersections are identical in information, so the same action must be taken at both. This requirement forces the policy to be uniform at indistinguishable states.

  7. **Maximization of Expected Utility (Non-negotiable)**: The chosen policy must maximize the expected utility from the perspective of the initial node (or the time of policy selection) under the constraints of the agent's information. 
     *Case*: This is the core of decision theory. In the absent-minded driver, the policy of continuing with probability 1/3 and exiting with probability 2/3 (or the pure policy of always exiting, depending on the variant) must be evaluated correctly to yield the maximum expected utility.

  Potential Conflict: Requirement 6 (consistency across information states) and the variant with marks might seem to conflict because the mark creates different information states. However, note that the mark does not make the states distinguishable in the usual sense because the agent does not know if it is the one leaving the mark or a future self. But actually, at the moment the agent sees a mark, it has more information: it knows that a mark is present. So the information states are now different: one state has no mark, the other has a mark. Therefore, the policy can condition on the mark. This does not violate requirement 6 because the states are now distinguishable by the mark. However, note that the agent at the first intersection does not see a mark (because it hasn't left one yet) and at the second intersection it might see a mark (if it left one at the first). But the agent still does not know which intersection it is at, but it does know whether there is a mark. So the information state is now defined by the presence or absence of the mark. This does not break requirement 6 because the states are now distinct.

  But note: the agent at the first intersection cannot condition on the mark because it hasn't left one yet. So the policy must specify what to do at the first intersection (without a mark) and what to do at the second intersection (with a mark, if one was left). However, the agent at the first intersection does not know it is the first. So if the agent sees no mark, it could be at the first intersection or at the second if no mark was left. Similarly, if it sees a mark, it is at the second intersection (if a mark was left at the first). But note: the agent at the first intersection cannot see a mark because it hasn't been left yet. So at the first intersection, the agent always sees no mark. At the second intersection, the agent may see a mark (if the first intersection was marked) or not (if the first was not marked). Therefore, the information state at the first intersection is "no mark", and at the second intersection it can be "mark" or "no mark", depending on the action at the first.

  But note that the agent at the second intersection does not know if it is at the first or second? Actually, by the time it is at the second, the mark (if left at the first) is present. But the agent at the second intersection does not know if it is at the first or second? It does not remember passing the first. However, if it sees a mark, then it knows that it is at the second intersection (because the first has been passed and marked). If it does not see a mark, then it could be at the first (if no mark was left by a previous self? but there is no previous self) or at the second if the first was not marked. So the agent at the second intersection, if it sees no mark, still does not know if it is at the first or second. But wait, at the first intersection, the agent has not left a mark yet, so the mark is absent. At the second intersection, the mark is present only if the agent at the first intersection left a mark. Therefore, the information states are:

