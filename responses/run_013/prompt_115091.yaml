answer: |-
  **Bottom line: Any adequate decision theory for bounded agents with imperfect recall must require policy-based evaluation at the outset to handle informationally identical states, with non-negotiable constraints on distinguishing choice from prediction, handling imperfect recall (not unawareness), and robustness to self-modification via durable marks, while maximizing expected utility from the initial perspective.**

  ### Requirements for Adequate Decision Theory (Imperfect Recall Cases)
  1. **Policy Evaluation Over Action Evaluation (Non-negotiable)**  
     *Case*: In the absent-minded driver, evaluating actions independently (e.g., "exit now") ignores that identical information states require identical actions, leading to contradictions (e.g., causal decision theory’s failure). Policy evaluation (e.g., "always exit") resolves this by optimizing the plan upfront.  
     *Why non-negotiable*: Bounded agents lack the information to contextually re-evaluate actions mid-execution without incoherence.

  2. **Distinction Between Choice and Prediction (Non-negotiable)**  
     *Case*: At any intersection, the agent must not treat its action as evidence about its future actions (e.g., "if I exit now, I probably exited earlier"). This confuses decision-making with self-prediction and causes irrational updates (e.g., evidential reasoning leading to suboptimal 2/3 probability).  
     *Why non-negotiable*: Imperfect recall means actions aren’t informative about past/future states—choice must be delinked from prediction to avoid self-referential errors.

  3. **Imperfect Recall ≠ Unawareness (Non-negotiable)**  
     *Case*: The agent knows the game structure (e.g., two intersections, payoffs) but forgets which intersection it is at. It must not behave as if it lacks meta-awareness (e.g., unaware of intersections existing).  
     *Why non-negotiable*: Unawareness implies ignorance of possibilities, while imperfect recall is memory failure within known possibilities; conflating them mis-specifies the agent’s knowledge.

  4. **Time of Evaluation: Policy Selection Upfront (Preference)**  
     *Case*: For bounded agents, selecting a policy before acting (e.g., pre-committing to "exit at second intersection") is pragmatically necessary to avoid costly mid-course deliberation.  
     *Why preference*: While re-evaluation mid-execution is possible in theory, bounded agents benefit from upfront commitment for simplicity and stability.

  5. **Robustness to Self-Modification (e.g., Durable Marks) (Non-negotiable)**  
     *Case*: If the agent can leave a mark (e.g., a visible token) at an intersection for future selves but cannot recall leaving it, the mark must be treated as an environmental signal, not restored memory. The policy must condition on marks without assuming perfect recall.  
     *Why non-negotiable*: Marks expand the policy space (e.g., "leave mark and continue if no mark seen") but do not eliminate the indistinguishability of states—the agent still doesn’t know if it created a mark it observes.

  6. **Consistency Across Information States (Non-negotiable)**  
     *Case*: At indistinguishable states (e.g., both intersections without marks), the same action must be taken per the policy. Variants (e.g., marks) may create new information states (e.g., "mark present"), allowing differentiation.  
     *Why non-negotiable*: Violating consistency (e.g., acting differently at identical states) introduces arbitrariness and violates rationality under uncertainty.

  7. **Expected Utility Maximization from Initial Perspective (Non-negotiable)**  
     *Case*: The policy must maximize expected utility as calculated at the start (e.g., 1/3 continue probability in the standard driver yields optimal payoff). Mid-execution perspectives cannot override this without time-inconsistency.  
     *Why non-negotiable*: Failing this undermines the core purpose of decision theory—systematic optimization.

  **Suspected Conflict**: Requirement 5 (robustness to marks) and Requirement 6 (consistency) may *appear* to conflict if marks create new information states, but they are compatible: marks expand the state space (e.g., "no mark" vs. "mark seen"), allowing consistent but conditioned policies. The critical tension is resolved by treating marks as part of the environment, not memory.  
  **Most Exclusionary Requirement**: Requirement 2 (choice-prediction distinction) excludes most causal and evidential theories, as they conflate action with evidence.

  ### Stress-Test: Durable Marks Variant
  - **Setup**: Driver can leave a durable mark at an intersection (e.g., paint a symbol) and see marks left by past selves, but cannot remember if it created a specific mark. Marks cost nothing and are instantly visible.  
  - **What marks function as**: Marks are **commitment devices**, not memory. They alter the information state (e.g., "mark present" at the second intersection if the first was marked) but do not reveal *which* agent left the mark or restore recall. The agent still faces uncertainty: at a state with no mark, it could be at the first intersection or a second intersection where no mark was left.  
  - **Theory requirement**: The policy must specify actions conditional on mark observations (e.g., "if mark seen, exit; else, continue with probability p"). This leverages marks to create new information states without violating imperfect recall.  
  - **Effect on requirements**: No change to non-negotiables. Requirement 5 (robustness) ensures marks are handled without assuming perfect recall. Requirement 6 (consistency) still applies to states with identical information (e.g., both "no mark" states). The variant reinforces that policies must include self-modification actions (e.g., mark-leaving) as part of the upfront plan.

  ### Verdicts on Standard Families
  - **Evidential Decision Theory (EDT)**: Fails Requirement 2 (choice-prediction distinction) by treating actions as evidence of states/actions, leading to recursive self-prediction errors.  
  - **Causal Decision Theory (CDT)**: Fails Requirement 1 (policy evaluation) by myopically optimizing actions at nodes, ignoring policy-wide correlations from imperfect recall.  
  - **Policy-Based Theories (e.g., Updateless DT)**: Satisfies all non-negotiables; may strain Requirement 4 (upfront evaluation) for bounded agents due to computational complexity.
