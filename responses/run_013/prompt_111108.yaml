prompt: |-
  I am a novelist, and I have agreed to open a summer workshop for working fiction writers with a ninety-minute session on the problem of old evidence. The room will hold twenty novelists with no philosophical training, a few of whom say Bayesian when they mean sensible and most of whom assume that evidence is by definition whatever arrives after the fact. I do not want the problem explained to me. I want a plan for how to explain it: what has to come first, what carries it, where the predictable misunderstandings form, and what I should refuse to attempt.

  I am fairly sure that nothing about the puzzle will land until they have felt that confirmation turns on a ratio of likelihoods rather than on the novelty of a fact — that a fact's being old is, by itself, no reason for it to support a hypothesis less — and only then the collapse: that a proposition already certain cannot be moved by conditionalizing on it, since updating on what one already knows leaves the credence exactly where it was. So the sequence must put credence, likelihood, and conditionalization in place before I am permitted to say that general relativity was regarded as strongly confirmed by a residual in Mercury's perihelion that had sat on the books for half a century. Tell me what else has to precede that sentence, and what inside it must wait.

  For the carrying example I would rather not use Mercury, for two reasons: it is overfamiliar, and I am told the theory was built with that residual very much in view, which makes it an awkward specimen for the very distinction I need. I have been experimenting with a scene of my own: a woman has known for thirty years that her husband cannot bear the sea — an unremarkable fact of the marriage — and it becomes evidence only when she forms the hypothesis that he never left the country in the summer of 1987. Can that carry the session? If so, what does it have that Mercury lacks, and what does it risk smuggling in (that she had forgotten the fact, that she had never noticed its bearing, that the fact is new to the reader)? If not, what should carry it, and what must that example be careful not to be?

  I also want the map of misconceptions, with the point in the sequence at which each forms and the sentence I say to head it off: that this is the problem of priors under another name; that it is a complaint about logical omniscience; that the repair is simply to conditionalize on the old fact together with the proposition that the theory entails it; that the counterfactual credence — what she would have believed had she never formed the theory — is easy to specify; that the difficulty shows the Bayesian apparatus to be refuted rather than an idealization doing quiet damage; and that old evidence means evidence that has stopped being surprising. Then the one question to put to the room at the end that would show me whether they have the problem or merely the vocabulary, and the two or three things I should announce that I am not going to explain at this level — among them, I think, whether any of the proposed repairs actually works.
reasoning: |-
  Okay, the user is a novelist planning a workshop for other fiction writers on the "problem of old evidence" in Bayesian reasoning. They need a pedagogical sequence that builds intuition without philosophical jargon, using a relatable example instead of the overused Mercury perihelion case. 

  Hmm, their core insight is correct: writers will cling to the "newness = strength" fallacy unless they viscerally grasp two things: (1) evidential force comes from likelihood ratios (how much better the hypothesis predicts the evidence than alternatives), and (2) updating on what you already know with certainty changes nothing. Their proposed marital example has potential but risks smuggling in confounding factors—like the wife forgetting the evidence or suddenly noticing its relevance.

  *What they explicitly asked for:*
  - Sequence blueprint avoiding Mercury's pitfalls  
  - Trap points where misunderstandings form  
  - Diagnostic end-question  
  - Boundaries (what not to cover)  

  *What they implied but didn't state:*
  - Fear of losing the room to abstract tangents  
  - Need to anchor concepts in narrative intuition  
  - Desire to preempt "aha but what about..." derailments  

  The marital example works if we sterilize it carefully:  
  1. Establish the wife knew the fact with certainty for 30 years (no memory lapse)  
  2. Stress the hypothesis is genuinely new (not lurking)  
  3. Show the evidence was always there—its *interpretation* shifted  

  Critical traps to defuse early:  
  - "Old evidence = unsurprising" → Clarify surprise is irrelevant; it's about certainty  
  - "Just conditionalize on entailment!" → Point out this assumes logical omniscience  
  - "This breaks Bayes!" → Emphasize it's an idealization revealing limitations  

  End with a stark test question: *"If you already knew X beyond doubt, could learning that theory H predicts X ever make you more confident in H?"* If they say yes, the core concept hasn't landed.  

  Hard boundaries:  
  - No deep dives into proposed solutions (Garber, Jeffrey, etc.)  
  - No probabilistic formalism  
  - No rabbit holes about "what certainty really means"  

  Their example stays if we add guardrails:  
  - Explicitly state she never forgot the aversion  
  - Specify the 1987 theory emerged from unrelated new info  
  - Contrast with a parallel case where the evidence *was* forgotten  

  ...this keeps it visceral. Mercury fails because physicists *did* have the residual in mind during theory-building—exactly the contamination their example avoids.
answer: |-
  Here’s a structured plan for your 90-minute session, designed to build intuition without formal machinery, preempt misconceptions, and land the core paradox. Your spousal example **will work** with careful handling—its strengths and risks are outlined below.  

  ---

  ### **Sequence & Key Moves**  
  *(Total: 85 mins; reserve 5 mins for Q&A)*  

  #### **1. Groundwork: What Evidence *Is* (15 mins)**  
  - **Start with raw intuition:** "When does a fact *support* a hypothesis? Give me examples from your novels." Elicit responses (e.g., "A character’s lie supports the hypothesis they’re guilty").  
  - **Reframe:** "We think evidence is ‘new’ by default—a clue discovered *after* the theory. But what if the ‘clue’ was always there?"  
  - **Introduce credence:** "Belief isn’t binary. We assign probabilities (e.g., 80% sure the husband is faithful). When facts shift that number, they’re evidence."  
  - **Likelihood > Novelty:** "Strength of evidence isn’t about *when* you learn it. It’s about how much *more expected* the fact is under your hypothesis vs. alternatives." Use a simple ratio:  
    - *If H is true*, how likely is fact E?  
    - *If H is false*, how likely is E?  
    - **Carrying example:** "If husband fled in 1987 (H), how likely is his sea-aversion (E)? Very. If he didn’t flee (~H), how likely is E? Less so (maybe he loves sailing). Ratio favors H."  

  #### **2. Conditionalization: Why Certainty Freezes Belief (20 mins)**  
  - **Demo belief updating:** Use a coins-in-a-bag scenario (e.g., "Bag has 90% biased coins; you draw one, flip it 10x. Does seeing 10 heads support bias?"). Show probability shift.  
  - **The freeze:** "What if you *already knew* the coin landed heads? Learning it again changes nothing. **Updating on certainty is inert.**"  
  - **Risk point:** Writers may confuse *certainty* with *high confidence*. Clarify: "Certainty = 100% credence. No room to move."  
  - **Bridge to the example:** "The wife knew for 30 years *with certainty* he hates the sea. When she forms the 1987-flight hypothesis (H), can E *become* evidence?"  

  #### **3. The Marital Example: Activating Old Evidence (20 mins)**  
  - **Present your scene:**  
    > Wife has known *with 100% certainty* for 30 years: husband loathes the sea (E).  
    > New hypothesis (H): He fled the country in summer 1987.  
    > Realization: If H is true, E makes sense (fugitives avoid ferries/coasts). If ~H, E is neutral (he’s just quirky).  
  - **Why it works better than Mercury:**  
    - ✅ **No theory-contamination:** Unlike GR/Mercury (built to fit the data), the wife’s H isn’t reverse-engineered from E.  
    - ✅ **Relatable certainty:** "Known for 30 years" stresses E was unquestioned.  
    - ✅ **Clear likelihood contrast:** E is *more likely* under H than ~H.  
  - **Risks to mitigate:**  
    - 🚫 **"She forgot E!"** → Explicitly state: "She never forgot; it was mundane background knowledge."  
    - 🚫 "She hadn’t *noticed* its relevance!" → Acknowledge this, but stress: **"Irrelevance isn’t uncertainty. She knew E—just didn’t connect it to H."**  
    - 🚫 "The *reader* learns E anew!" → Clarify: "This is about the *character’s* certainty, not dramatic revelation."  

  #### **4. The Collapse: Stating the Problem (15 mins)**  
  - **Paradox setup:** "E *should* support H (likelihood ratio favors it). But she already knew E. Updating on E changes nothing. How can E be evidence?"  
  - **Land the tension:** "The ‘old evidence’ feels like evidence *only when the hypothesis reframes it*. But Bayes says you can’t use what you already know."  
  - **Refuse premature solutions:** "We’re not fixing this today. We’re sitting with why it’s a puzzle."  

  #### **5. Misconception Mapping & Deflection (10 mins)**  
  Address these as they arise (likely during Steps 2-4):  

  | Misconception | When It Forms | Deflection Sentence |  
  |---------------|---------------|---------------------|  
  | "This is just about priors!" | Intro to credence | **"Priors are initial beliefs. This is about *updating* on what’s *already believed*."** |  
  | "Repair: Conditionalize on *H entails E*!" | Conditionalization demo | **"That assumes you *didn’t know* H entailed E. But if you did, it’s already factored in."** |  
  | "Old evidence = unsurprising!" | Likelihood discussion | **"Surprise is psychological. Certainty is logical. You can be ‘surprised by relevance’ but still certain of the fact."** |  
  | "Just imagine if you didn’t know E!" | Paradox setup | **"Counterfactuals are slippery. What *would* she have believed? We can’t cleanly erase knowledge."** |  
  | "This refutes Bayesianism!" | Collapse | **"It reveals a crack in idealization (logical omniscience), not a fatal flaw. All tools have limits."** |  

  #### **6. Diagnostic Question & Boundaries (5 mins)**  
  - **Test question for the room:**  
    > *"If you already know fact E with 100% certainty, and you later learn that hypothesis H predicts E, does that *increase* your confidence in H?"*  
    - **Correct answer: No** (if E is certain, learning "H entails E" may feel affirming but doesn’t change credence).  
    - **If they say yes:** The core failure is unaddressed.  
  - **What you WON’T cover:**  
    - "Solutions (e.g., Garber/Jeffrey). That’s grad-level philosophy."  
    - "Whether any repair *actually works*. We’re here to feel the problem."  
    - "Logical omniscience debates. We accept that humans miss entailments."  

  ---

  ### **Why This Sequence Works**  
  - **Builds from narrative intuition:** Starts with writers’ natural grasp of "clues," then subverts it.  
  - **Your example carries it:** The marital scene is superior to Mercury—it’s uncontaminated, embodies certainty, and forces focus on *relevance* over novelty.  
  - **Preempts derailments:** Misconceptions are flagged and deflected in real-time.  
  - **Leaves them with the itch:** The unresolved paradox lingers, which is the goal.  

  **Final tip:** Use whiteboard sketches for credence shifts (e.g., "Certainty: 100% → 100% = no movement"). Avoid equations. Emphasize that **old evidence isn’t weak—it’s frozen**.
