prompt: |-
  I've been going down a rabbit hole on speech acts lately -- the whole idea that some things you say don't describe anything, they just do something -- and I've ended up with a pile of gut reactions that I can't get to sit under one rule. I know the general shape of the literature here, Austin, Searle, all that, and I'm not asking for a summary of it or a reading list. What I want is the rule. Here's my pile:

  - A guest at a wedding with no grounds and no standing shouts 'I object!' The officiant pauses, looks annoyed, and carries on. I think he objected. He really did object, even though it changed nothing. But if he shouts the same thing at a wedding on TV, he didn't object to anything, he just yelled.

  - My friend says 'I promise I'll pay you back Friday,' knowing perfectly well he won't. I think that's a promise. A bad one, maybe the worst kind, but a promise, not a non-promise that happens to be a lie.

  - Same friend says 'I forgive you' about something, and I know he's still furious and will bring it up at Christmas for the next decade. I don't think he's forgiven me. He said the words, and the forgiving didn't happen.

  Those last two are the pair I can't reconcile, by the way.

  - A judge whose appointment turns out to have been invalid all along sentences someone to five years. They're taken away, serve three, then somebody catches it. I think the sentencing happened -- that's why there's something to undo. Not lawful, but not nothing either.

  - Someone apologizes because a court ordered them to, reads it off a card, no remorse whatsoever. I don't think that's an apology at all. It's a performance of one.

  - Same person, sincerely sorry, says it out loud to a photo of the person who died. I think that's an apology. It just can't be received.

  - I say 'I promise I'll help you move' while rehearsing a play. Not a promise. I say it in a rehearsal but I mean it for real this time -- now I'm stuck.

  - A friend with a mail-order ordination off some website performs a wedding. The couple mean it, the guests treat them as married, no state and no church recognises it. I want to say they aren't married. But if a couple lives as married in a community for twenty years and nothing official ever happened, I want to say they are. Which makes me think the words at the moment aren't doing the work, the community afterwards is, and that's a different kind of theory than the one I started with.

  - 'I bet you fifty bucks,' said laughing, clearly joking, and I say 'you're on,' meaning it. I think there's a bet. If he'd said it to an empty room, no bet.

  - I promise my dying father I'll look after mum. I don't think that's a promise. It's a vow, a resolution. Nobody's there to hold me to it.

  The principle I keep reaching for is something like: an utterance is the act it looks like if it's said seriously, in the right kind of setting, by someone with standing to say it, and it's understood as such by whoever it's aimed at -- and how I felt inside doesn't matter, except for acts whose entire point is to be in some inner state. That would explain why a lying promise is still a promise but a hollow 'I forgive you' isn't forgiveness. But it doesn't explain why a coerced apology is a non-apology while a coerced promise still seems like a promise to me, and I can't tell whether standing is really doing the work in the wedding cases or whether it's just the community's response, and I'm not even sure my 'has to be understood' clause is right given the dead-father one.

  So: give me the principle, or two or three rivals, stated precisely enough that I can check them against new cases. Tell me what each clause is buying me and which case motivates it. Tell me which of my verdicts it forces me to give up, honestly, don't paper over it. And then give me your own verdicts on cases I haven't listed -- a doctor saying 'you'll be fine' when they think you won't, a landlord saying 'you're evicted' with no legal standing, a promise made at gunpoint, someone saying 'I'll pray for you' and never doing it, whatever else your principle strains on. The case I keep flip-flopping on: I text my boss 'I quit' and then immediately text 'jk.' Did I quit?
reasoning: |-
  Okay, the user is deep into speech act theory and has collected a bunch of real-world examples where the standard Austin/Searle framework feels messy. They're clearly frustrated with textbook definitions and want a unifying principle that actually handles these edge cases. 

  First thing I notice: their core tension is between institutional vs. interpersonal acts. The wedding objection needs institutional scaffolding (hence standing matters), but "I forgive you" collapses without sincerity - yet insincere promises still count as promises. That's the key puzzle they're wrestling with. 

  Hmm... they're also implicitly questioning where the "act" resides: in the utterance itself? The speaker's intention? The audience's uptake? The social consequences? Their TV wedding example shows identical words failing because context strips away the conventional force. Meanwhile the dead father promise lacks reciprocity but still feels binding to them personally - interesting how they separate "vow" from "promise" there. 

  What they're really hunting for might be a decision tree for when linguistic rituals "take." Their proposed principle is already sophisticated (seriousness + setting + standing + uptake), but they've correctly identified its weak spots: coerced apologies vs coerced promises, and the fuzzy role of community recognition in marriage. 

  I should avoid rehashing Searle's felicity conditions since they clearly know that. Instead, I'll build three competing models that each prioritize different elements: 
  1) Conventionalist (rules trump intentions) 
  2) Intentionalist (mental state is king) 
  3) Relational (it's all about social negotiation)

  The landlord eviction case will test all three - if a rando yells "you're evicted," only Conventionalism might call it void (no standing), while Relationalism would check if the tenant actually moved out. But for the insincere doctor, Intentionalism fails hardest since "you'll be fine" functions as reassurance regardless of truth. 

  Biggest risk is overcomplicating. Must keep each principle razor-sharp: "An utterance constitutes X iff..." format. And absolutely must show where their intuitions have to bend - like how Relationalism forces them to accept the mail-order wedding if the community does. They'll respect that honesty. 

  Ah! Their "jk" resignation text is perfect for the end - it's all about temporal fragility of uptake. Maybe I'll sneak in a bonus fourth perspective just for that...
answer: |-
  You're wrestling with the core tension in speech act theory: **when does the ritual work?** No single rule captures all intuitions because speech acts straddle conventions, intentions, and social reality. Here are three rival principles, precisely stated, with their trade-offs against your cases. I'll be brutally honest about where they clash with your judgments.

  ---

  ### **Principle 1: Conventional Effect (The Institutionalist View)**  
  *An utterance constitutes act X iff:*  
  **(a)** It conforms to conventional linguistic form for X,  
  **(b)** It’s uttered in a context where conventions for X are operative,  
  **(c)** The speaker has conventional standing to perform X,  
  **(d)** The utterance is directed toward its conventional audience.  
  *Speaker intention and sincerity are irrelevant to the act’s existence (only its validity/morality).*

  **What it buys:**  
  - Explains why the *invalid judge*’s sentencing "happened" (conventions invoked).  
  - Explains the *TV wedding objection* failure (no operative conventions).  
  - Explains the *play rehearsal promise* failure (context suspends conventions).  
  - Explains *coerced apologies* as non-apologies (if "sincerity" is a conventional requirement).  

  **Where it clashes with your intuitions:**  
  1. **Your lying friend’s promise IS a promise.** (Meets a–d; insincerity irrelevant). ✅  
  2. **Your friend’s "I forgive you" IS forgiveness.** (Meets a–d; sincerity not required). ❌ (You said it wasn’t)  
  3. **Mail-order wedding IS marriage.** (If community conventions accept it). ❌ (You said it wasn’t)  
  4. **Coerced apology IS an apology.** (If conventions don’t require sincerity). ❌ (You said performance)  
  5. **Promise to dead father IS NOT a promise.** (No conventional audience). ✅  

  **Your "jk" resignation:** **You quit.** Conventions were operative when sent; retraction is a new act.  

  ---

  ### **Principle 2: Intentional Commitment (The Volitionist View)**  
  *An utterance constitutes act X iff:*  
  **(a)** The speaker intends to undertake the normative commitment of X,  
  **(b)** The speaker intends their utterance to be recognized as X.  
  *Conventions and audience uptake enable success but aren’t essential. Sincerity is built-in.*

  **What it buys:**  
  - Explains why *hollow "I forgive you"* fails (no intent to release debt).  
  - Explains *lying promise* as a promise (intent to commit exists, even if bad-faith). ✅  
  - Explains *apology to a photo* (intent to apologize is sufficient). ✅  
  - Explains *dead father "promise"* as a vow (intent binds the self, not another). ✅  

  **Where it clashes:**  
  1. **TV objector DID object.** (If he intended to object). ❌ (You said he didn’t)  
  2. **Invalid judge’s sentencing DID NOT happen.** (No authority → no intent to create legal reality). ❌ (You said it did)  
  3. **Joking bet IS NOT a bet.** (No intent to be bound). ❌ (You said "you’re on" creates a bet)  
  4. **Coerced promise IS NOT a promise.** (Intent vitiated by duress). ❌ (You feel it’s still a promise)  
  5. **Mail-order wedding IS marriage.** (If all parties intend it). ❌ (You said not without state/church)  

  **Your "jk" resignation:** **You didn’t quit.** Retraction reveals no enduring intent.  

  ---

  ### **Principle 3: Relational Uptake (The Interactionist View)**  
  *An utterance constitutes act X iff:*  
  **(a)** It’s recognized as X by the relevant audience,  
  **(b)** It alters the deontic relationship between speaker/audience (e.g., creates obligation, entitlement, status).  
  *Conventions and intentions facilitate but aren’t decisive. The act exists in the social response.*

  **What it buys:**  
  - Explains *community marriage* (social recognition alters status). ✅  
  - Explains *TV objection* failure (no uptake). ✅  
  - Explains *hollow forgiveness* failure (no relationship change). ✅  
  - Explains *joking bet + "you’re on"* (mutual uptake creates obligation). ✅  
  - Explains *coerced apology* as non-apology (no restoration of trust). ✅  

  **Where it clashes:**  
  1. **Lying promise IS NOT a promise.** (If audience doesn’t trust it, no obligation is created). ❌ (You said it *is*)  
  2. **Invalid judge’s sentencing DID NOT happen.** (No valid legal obligation created). ❌ (You said it did)  
  3. **Apology to a photo IS NOT an apology.** (No audience to receive/acknowledge it). ❌ (You said it is)  
  4. **Dead father vow IS NOT binding.** (No one holds you accountable). ✅ (You agree it’s not a promise)  
  5. **Play rehearsal promise IS a promise.** (If castmates jokingly "hold you to it"). ❌ (You said not)  

  **Your "jk" resignation:** **Depends.** If boss saw "I quit" and processed it before "jk," you quit. If not, no.  

  ---

  ### **New Cases Tested Against All Principles**
  1. **Doctor says "You’ll be fine" (knowing you won’t):**  
     - Conventionalist: **Reassurance** (if medical context conventions exist).  
     - Volitionist: **Lie** (no intent to inform truthfully).  
     - Interactionist: **Failed reassurance** (if patient believes it, temporary relief occurs).  

  2. **Landlord (no standing) says "You’re evicted":**  
     - Conventionalist: **NOT eviction** (lacks standing).  
     - Volitionist: **Threat** (intent to intimidate).  
     - Interactionist: **Intimidation** (if tenant feels pressured).  

  3. **Promise at gunpoint:**  
     - Conventionalist: **Promise** (form + context met).  
     - Volitionist: **NOT a promise** (intent coerced).  
     - Interactionist: **NOT a promise** (no voluntary obligation created).  

  4. **"I’ll pray for you" (never does):**  
     - Conventionalist: **Expression of concern** (if religious convention).  
     - Volitionist: **Insincere speech act** (no intent to pray).  
     - Interactionist: **Polite gesture** (if received as kindness).  

  ---

  ### **The Core Tension & Your Flip-Flop Case**
  Your cases expose a fracture: **Some acts (promises, bets) create obligations through mutual recognition *despite* insincerity. Others (forgiveness, apologies) require sincerity to alter relational states.** Marriage sits uneasily between institutional and communal validation.  

  **On "I quit... jk":**  
  - **Conventionalist:** You quit. Texting is operative; retraction is separate.  
  - **Volitionist:** No quit. Erratic intent shows no commitment.  
  - **Interactionist:** Depends on boss’s uptake. If they replied "Accepted," you’re out.  

  **My verdict?** No principle saves all intuitions. But your "flip-flop" case suggests **uptake is decisive**: *You quit if your boss takes it as quitting before the retraction.* Speech acts live in the space between mouths and ears, not just intentions or rules. The ritual works when the community (or audience) lets it work.
