  The challenge is making the philosophy felt without naming it. Lines like "proof shifts like sand" nod to evidentialism, while "your step won't steer / the fixed appointment" channels causality. The shared line for Damascus/Aleppo in the envoi ("The appointment is Damascus, is Aleppo") merges the cities into one doom, fulfilling the user's vision. 

