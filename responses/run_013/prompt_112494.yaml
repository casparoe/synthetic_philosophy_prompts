  I notice they're wary of oversimplifying: no fatalism, no shrug, just sustained vertigo. That's tricky—the poem must balance clarity with ambiguity. The envoi's requirement (cities in one line revealing escape=appointment) is brilliant; it forces the twist into structural inevitability. 

