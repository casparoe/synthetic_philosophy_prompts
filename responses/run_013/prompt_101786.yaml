answer: |-
  As your falsificationist referee, I reject your distinction as a semantic sleight-of-hand that protects the directional claim from empirical accountability. When Malthus asserted his "scheduled" prediction of imminent famine, that *was* the concrete, testable manifestation of his proposed mechanism under the conditions he observed. The mechanism's failure to produce the predicted effect *within its stipulated timeframe* isn't merely a scheduling error—it demonstrates that the mechanism either doesn't operate as described, or is so weak that auxiliary factors (like technological innovation, which Malthus grossly underestimated) routinely override it in the observable domain. Your "directional claim" becomes an unfalsifiable metaphysical placeholder: it retreats to an abstract "tendency" that *would* manifest only if every conceivable countervailing factor were absent—a condition never actualized in history. By decoupling the mechanism from its necessary empirical consequences, you render it immune to falsification while pretending it retains scientific content. The schedule wasn't an arbitrary add-on; it was the theory's *empirical commitment*. Its failure refutes the package.
