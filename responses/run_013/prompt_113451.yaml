prompt: |-
  I've been sitting in on a reading group about time perception, and there is a fork in the explanations that I keep running into and don't have a word for. Two of the cases we looked at. In the first, a red dot is flashed on one side of a screen and a green dot on the other side a fraction of a second later; people don't report two dots, they report a single dot that slides across and turns green about halfway. The colour change is reported as happening before the second dot was ever shown, which is the part that bothers me. In the second case, a word is flashed and then a pattern follows it almost immediately; depending on the gap, people say either that they saw nothing but a blur or that they saw the word perfectly clearly, and the change between those two reports is abrupt. What interests me is that both cases get explained in one of two ways, and the two ways are always presented as rivals. The first says the brain held the earlier event in storage, waited for the later one, and then assembled a single experience out of both, delivering it late — so what you consciously get is a construction that post-dates the second stimulus. The second says the experience was delivered immediately and accurately, that you really did see the dot turn green when it seemed to, and that what happened later is that the memory, and hence the report, was quietly rewritten, so that a tidied-up version replaced the original. The wait-and-assemble story and the rewrite-the-record story agree, as far as I can tell, about what content is present in the brain at each moment; they disagree only about which of those content-bearing states deserves to be called the experience and which deserves to be called the memory of it. They seem to predict the same reports, the same response times, and to be consistent with the same recordings. Someone in the group said that this makes the question of when the person experienced the change not merely hard but malformed, and everyone nodded.

  What I want is the name of the fork, if it has one, and — more than the name — the carving. I keep feeling the two stories are less symmetric than they are made to sound. The wait-and-assemble story buys its result with machinery that sounds extravagant, since it has the brain idling with material in hand until a later event arrives. The rewrite-the-record story buys its result more cheaply in machinery but at a different price: if the record is routinely edited, then the reports I am using as evidence are exactly the thing the story tells me not to trust, and the explanation starts to look as though it eats its own data. Is there a name for a fork of this shape — two explanations that agree on the mechanism and differ only over where to attach a term — and is there a name for the further move of declaring the fork a non-question? I know the general idea that evidence can fail to decide between two theories, but that usually means not enough evidence has been gathered yet, whereas here it feels as though no evidence of the ordinary kind could ever separate them. And I know people talk about disputes that are merely verbal, but that usually means the parties mean different things by a word and talk past each other, whereas here they agree about everything except which state deserves the word.

  I don't need citations or a reading list. I want to know what the nearest established concepts are, which of them fits this best and why the others don't, what would have to be true for the two stories to be genuinely different rather than two ways of describing one thing, and — if nothing in the literature covers this exact shape — a coined term with a definition and a couple of boundary cases so I can tell it apart from ordinary underdetermination on one side and plain equivocation on the other.
reasoning: |-
  Okay, the user is part of a reading group on time perception and has encountered a specific theoretical fork in explaining certain perceptual illusions. They describe two cases: one with colored dots appearing to move and change color mid-trail, and another with a word followed by a pattern that's either blurry or clear depending on timing. The two rival explanations are: (1) the brain waits to assemble a unified experience (post-dating the stimulus), or (2) the experience happens immediately but memory gets rewritten afterward. 

  The user observes that both theories agree on the neural mechanics but disagree only on what gets labeled as "the experience" versus "the memory." They feel this disagreement is asymmetric—not just a standard case of underdetermined theories or verbal dispute—and want terminology to capture this specific fork. They're also skeptical about the rewrite theory undermining its own evidential basis (since reports become untrustworthy) and find the assembly theory neurologically extravagant. 

  First, I need to map this to established philosophical/scientific concepts. The core issue is the assignment of "experience" to a temporal stage in processing. This resonates with: 
  - **Mind-time dissociations**: Where neural processing timelines don't map neatly to subjective timelines. 
  - **Meta-problems of consciousness**: Disagreements about what counts as "conscious" in processing chains. 
  - **Verbal vs. substantive disputes**: But unlike typical verbal disputes, here both sides agree on all physical facts—only the labeling of "experience" differs. 

  The asymmetry they sense is crucial: the assembly theory risks positing delays without evidence, while the rewrite theory makes subjective reports epistemically useless. This resembles: 
  - **Self-defeating explanations**: The rewrite theory's reliance on edited reports undermines itself. 
  - **Parsimony trade-offs**: Assembly is neurologically costly; rewrite is epistemically costly. 

  For terminology: 
  - **Temporal labeling dispute** fits but is too generic. 
  - **Consciousness-stage attribution problem** is more precise but clunky. 
  - Best fit might be **phenomenal reference disagreement**—disagreeing about which physical state refers to the phenomenal one. 

  Ultimately, the user seeks conceptual clarity to navigate this fork. They imply frustration with the group's dismissal of the question as "malformed," suggesting a deeper need to legitimize their intuition that the asymmetry matters. Their unspoken request might be for tools to push back against premature closure of the debate.
answer: |-
  This fork is a profound and recurrent beast in consciousness studies and philosophy of mind. It doesn't have a single universally accepted name, but it lives at the intersection of several established concepts. Here's the carving, the terminology, and why the asymmetry matters:

  ### 1. The Core Fork: Temporal Reference Disagreement
  *   **Best Fit Term:** **The "When" of Consciousness Problem** or **Subjective Timing Attribution Dispute**. More technically, it's a dispute over **Phenomenal Reference** – disagreement about which physical state/process in the brain *is identical to* or *directly constitutes* the subjective experience at a specific moment.
  *   **The Carving:** Both theories agree on the **objective neural timeline** (stimulus A -> neural registration A -> stimulus B -> neural registration B -> integration/rewrite process -> report). They disagree *solely* on which point(s) along this timeline the label "conscious experience of the illusory event (color change/clear word)" gets pinned.
      *   **Wait-and-Assemble:** Claims the *integrated state* (after B arrives) *is* the experience. The earlier neural states (registration of A, possibly partial processing) are *pre-conscious* precursors.
      *   **Rewrite-the-Record:** Claims the *initial registration/processing state* (of A alone, or A+B as separate) *was* the experience. The later integrated/rewritten state is a *post-conscious memory* trace.
  *   **Why Standard Concepts Don't Quite Fit:**
      *   **Underdetermination (by evidence):** Usually implies *different* physical predictions that current evidence can't distinguish. Here, the *physical predictions are identical*; it's purely about labeling a subjective state relative to the physical timeline. Future evidence about neural correlates won't resolve it *unless* it specifies the "consciousness marker."
      *   **Verbal Dispute/Equivocation:** Usually involves ambiguity in the *meaning* of a term (e.g., "free will"). Here, both sides *agree* on what "conscious experience" *means* phenomenologically (the feeling of seeing the dot turn green mid-motion). They disagree about *which neural state corresponds to that specific feeling occurring in time*.
      *   **Illusionism vs. Realism:** Broader debates about whether the experience is "real" or "fictional." Both theories here accept the experience *happens*; they disagree about *when* it happened relative to stimuli and neural processing.

  ### 2. Declaring the Fork a Non-Question: Temporal Illusionism or the Meta-Problem Move
  *   **The Move:** Claiming the question "When *did* the subject experience X?" is meaningless or unanswerable because "experience" isn't a discrete event neatly locatable on the objective timeline.
  *   **Name:** **Temporal Illusionism** (about conscious timing) or invoking the **Meta-Problem of Consciousness** (Daniel Dennett's territory). Dennett argues that questions about *exactly when* or *where* consciousness happens are based on a flawed "Cartesian Theater" model of a single place/time where "it all comes together." His "Multiple Drafts" model proposes that there is no single experience or record; there are just various content-fixations at different times for different purposes, and *retrospectively* we judge which one "was" the experience.
  *   **Why it's Appealing:** It sidesteps the seemingly intractable labeling problem. If there's no definitive "moment of experience," the fork collapses.

  ### 3. The Crucial Asymmetry You Sense (Why it's NOT Symmetric)
  You are absolutely right. The theories are *not* symmetric in their consequences:

  1.  **Epistemic Cost of Rewrite-the-Record:** This is the critical asymmetry.
      *   **The Problem:** If the rewrite theory is true, then *all introspective reports about the timing or even the content of brief, rapidly succeeded experiences are inherently unreliable*. The very data used to study perception (subjective reports) is the product of the editing process the theory posits. The theory **undermines its own evidential base**. It risks being unfalsifiable or self-defeating: any report consistent with the theory is explained as an accurate report of the edited memory, while any report *inconsistent* with it could be dismissed as a failure of the editing process.
      *   **Why Assembly Avoids This:** The assembly theory claims the report accurately reflects the *constructed experience* that occurred (later). It doesn't necessarily claim the report perfectly reflects the *raw stimuli*, but it does claim it reflects the actual *conscious content* that was present at the time of the assembly. The evidential link between report and the conscious state it purports to describe remains more direct.

  2.  **Parsimony Cost of Wait-and-Assemble:**
      *   **The Problem:** It requires positing a potentially metabolically expensive delay or buffering mechanism. The brain must hold information "in limbo" (pre-conscious) without it being experienced until later information arrives, implying dedicated neural resources for this suspension. This *might* seem less efficient.
      *   **Mitigation:** Neuroscience reveals numerous buffers and delays (e.g., in vision, auditory processing). "Holding" information for tens or hundreds of milliseconds is neurologically plausible. Also, assembly might be the *default mode* of perception (constructing seamless scenes), making buffering less "extravagant" than it sounds.

  ### 4. Coined Term & Definition (If Needed)
  If existing terms feel insufficient, consider:

  *   **Term:** **Phenomenal Reference Disagreement (PRD)**
  *   **Definition:** A theoretical impasse arising when two explanations for a conscious phenomenon agree on the entire sequence of objective physical events (neural processes, stimuli, behavioral outputs) but disagree *only* on which specific physical state within that sequence constitutes the subjective phenomenal state in question, particularly regarding its temporal location. The dispute hinges on the assignment of phenomenal reference.
  *   **Boundary Cases:**
      *   **Not PRD (Ordinary Underdetermination):** Theories predict different neural activity patterns following stimulus B. Future fMRI/EEG could potentially distinguish them.
      *   **Not PRD (Verbal Dispute):** One theorist defines "experience" as raw sensory input, another defines it as interpreted meaning. They genuinely mean different things by the word.
      *   **Is PRD:** Both agree on the precise neural processing stages and their timing, and on what the subject *says* they experienced and when they say it happened. They only disagree whether the neural state at time T1 *was* the experience or merely a precursor to the experience occurring at T2.

  ### 5. Could Evidence Ever Separate Them?
  *   **Directly Locating "Experience":** If we had a perfect, agreed-upon "neural correlate of consciousness" (NCC) signature – a specific neural state *sufficient and necessary* for a specific experience – and we could measure its timing precisely, we *could* resolve the PRD. We could see if the NCC signature for "seeing the dot turn green" occurs *before* stimulus B arrives (favoring Rewrite) or *after* (favoring Assembly).
  *   **The Catch:** Finding such a definitive NCC signature is the holy grail and remains elusive. Arguments about *what counts* as the NCC often loop back into the same PRD structure. Furthermore, the Rewrite theory could *still* argue that the NCC signature at T2 reflects the *creation of the memory trace*, not the original experience.
  *   **Your Insight is Correct:** With *current* methodologies relying on subjective report and coarse neural timing, the PRD is empirically unresolvable. The disagreement is fundamentally about the *interpretation* of the relationship between physical states and phenomenal states in time, not about the physical states themselves.

  **In essence:** You've hit upon a deep issue in the philosophy of mind and neuroscience of consciousness – the **Temporal Reference Disagreement** or **Phenomenal Reference Disagreement**. It's characterized by agreement on the physical mechanism but irreconcilable disagreement on when the subjective experience "happened," leading to the **epistemic asymmetry** favoring Assembly (reports reflect experience) over Rewrite (reports are corrupted) and the **parsimony asymmetry** favoring Rewrite (no need for buffering) over Assembly. Declaring it a non-question (**Temporal Illusionism**) is a major philosophical stance attempting to dissolve the problem by rejecting the premise that conscious experience has a single, definable "when." The asymmetry you sense is real and centers on the Rewrite theory's self-undermining relationship to its primary evidence: subjective report.
