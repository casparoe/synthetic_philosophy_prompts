prompt: |-
  I'm a backend engineer (payments infra, nothing to do with any of this) and I've been messing around with Bongard problems for a few weeks as a hobby. You know the ones — twelve little figures, six in a left box and six in a right box, and you have to say what separates them. I got into them through Hofstadter's Gödel, Escher, Bach, then found out they go back to a Soviet pattern-recognition book from the sixties, and that there's a board game version called Zendo that's the same idea with physical pieces. Hofstadter says somewhere that solving them sits close to the core of pure intelligence, which is the sort of thing that either means alot or means nothing. Anyway I wrote a blog post draft about them and I want you to tear into it. I have no formal philosophy training, so some of the framing is probably amateur hour, and I'd rather you be blunt about that than polite.

  Here's the draft:

  Everyone treats Bongard problems as a warm-up before the real work, and I think that's backwards. The whole point of the puzzle is that the data is compatible with infinitely many rules. You can always find one — the left figures are the six I've circled in red; or a rule that just names the six left figures one by one; or a rule that says "left if it's one of these six, otherwise follow some other rule." So the task isn't to find a rule that fits, it's to guess the one the designer had in mind. That's Hume's problem of induction in a nutshell: no finite run of examples pins down the generalisation, and nothing inside the examples can tell you which generalisation is the right one.

  The fix people usually reach for is "pick the simplest rule," and I think that works better than philosophers give it credit for. Simplicity here isn't a vague aesthetic thing, it's description length, and description length is objective once you've fixed an encoding. So there really is a fact of the matter about which rule is the intended one — the puzzle has a determinate answer — it's just that our brains are running the compressor, and the encoding they use is the one they were trained on by a lifetime of looking at the world. I assume the current multimodal models mostly crush these now, since they seem to crush everything visual.

  I also think Bongard problems are a problem for the Wittgensteinian family-resemblance story. The claim there is that real concepts have no necessary and sufficient conditions, just overlapping similarities. But every Bongard problem has a crisp necessary-and-sufficient condition, that's the entire format, and humans solve them by finding it. So at least some concepts really are definitions, and family resemblance is a story about words, not about concepts.

  Relatedly, I think the hard part of these puzzles is perception, not reasoning. Once you've pulled out the features — holes, convexity, straight versus curved, symmetry, inside/outside relations, how many separate blobs — the search over candidate rules is a small combinatorial problem, and machines are great at small combinatorial problems. So Bongard problems are a vision benchmark wearing a reasoning costume, and if they're still hard for models that's a fact about segmentation, not about concepts.

  Which brings me to the thing that actually bugs me. People say Bongard problems are a pure test of intelligence because they're language-free and culture-free — no trivia, no vocabulary, just shapes. But when I tried to write my own set I couldn't produce a single one where I was confident there was only one natural rule. I'd settle on "the left ones are all concave," and my wife would immediately say "no, the left ones all have a straight edge on the bottom." Zendo was worse: people kept proposing rules the master hadn't thought of, and the running joke was that the real rule was just "whatever the master says yes to." So the intended rule is doing an enormous amount of work for something nobody can point to, and I suspect the puzzles measure how well you've absorbed a particular culture's habit of treating certain descriptions as the obvious ones. Which is a wierd thing to call culture-free.

  My conclusion is that Bongard problems are a test of whether a system shares our priors, which is a stranger thing to test than intelligence, and probably not what Bongard was after when he was doing pattern recognition in the sixties.

  I don't need a rewrite and I don't need a reading list — if I've reinvented some standard position just tell me its name and one sentence about it and I'll go find it myself, but please don't hand me citations or papers, I won't chase them and I can't really use them. What I want is a claim-by-claim verdict: go through the five or six things I assert and sort them into flatly wrong, overstated but salvageable, and fine, and say what the strongest objection to each one is. Then tell me which of my claims is actually the interesting one, i.e. which one I should build the whole post around, and which two I should just cut. And flag anywhere I've quietly conflated two different problems and treated them as one — I have a suspicion I did that in the first paragraph but I can't see it.
reasoning: |-
  Okay, let me tackle this Bongard problem analysis from a backend engineer. First, I need to understand their core arguments and where they might be shaky. 

  The user makes several key claims: that Bongard problems embody Hume's induction problem, that simplicity (as description length) solves it objectively, that they refute Wittgenstein's family resemblance, that perception matters more than reasoning, and that they test shared priors rather than raw intelligence.

  Hmm... the Hume connection seems solid - finite examples can't pin down infinite rules. But their simplicity solution feels too neat. Description length depends entirely on the encoding scheme, which isn't universal. A programmer might encode "convexity" efficiently while an artist prioritizes "flow". That's not objective - it's perspective-dependent. 

  The Wittgenstein counter is interesting but overplayed. Yes, Bongard problems demand crisp boundaries by design, but that doesn't mean all concepts work that way. "Game" is still a family-resemblance concept - forcing it into necessary/sufficient conditions would miss Wittgenstein's point. 

  On perception vs reasoning: they're right that feature extraction dominates, but underestimate how intertwined perception and reasoning are. Recognizing "concavity" already involves geometric abstraction. Still, their core insight stands - if models struggle with Bongard, it's likely visual segmentation failing, not logic engines.

  The shared priors point hits hardest. Their anecdote about failed puzzle creation reveals the dirty secret: what counts as "natural" depends entirely on cultural conventions. That Soviet-era engineer and a Balinese woodcarver would propose different rules for the same shapes. Calling this "culture-free" is indeed weird.

  Biggest conflation alert: in the first paragraph, they merge two issues - the underdetermination of rules (Hume) and the subjectivity of simplicity (cultural encoding). These are related but distinct problems. 

  For restructuring: the shared priors argument is the freshest and most provocative. That should be the centerpiece. The Wittgenstein and perception points can stay as supporting arguments. The simplicity claim needs major qualification - it's where they're most vulnerable. 

  Final note: their engineer mindset shows in craving "determinate answers", but intelligence tests might fundamentally involve squishy human consensus. That tension is worth sitting with rather than solving.
answer: |-
  Here’s a claim-by-claim verdict, strongest objections, and structural recommendations. I’ll be blunt—philosophy’s teeth are sharp for a reason.

  ### Claim-by-Claim Breakdown:
  1. **"Bongard problems embody Hume’s problem of induction"**  
     **Verdict:** Fine.  
     **Strongest objection:** Hume’s problem is about justifying induction itself, while Bongard problems assume induction *works* and focus on *which* rule to select. You’re conflating underdetermination (many rules fit the data) with Hume’s deeper skepticism about induction’s foundation.  

  2. **"Simplicity (as description length) objectively solves this"**  
     **Verdict:** Overstated but salvageable.  
     **Strongest objection:** Description length is only objective *relative to an encoding scheme*. The "natural" encoding isn’t universal—it’s shaped by human cognition and context. A dolphin or GPT-7 might use a different "obvious" compression. This smuggles in subjectivity.  

  3. **"Bongard problems refute Wittgenstein’s family resemblance"**  
     **Verdict:** Flatly wrong.  
     **Strongest objection:** Bongard problems *demand* necessary-and-sufficient conditions by design. Family resemblance applies to concepts that *resist* such definitions (e.g., "game" or "chair"). You’re comparing apples to orbital mechanics.  

  4. **"Perception dominates reasoning in Bongard problems"**  
     **Verdict:** Overstated but salvageable.  
     **Strongest objection:** Feature extraction *is* perceptual, but deciding *which* features are relevant (e.g., "holes vs. symmetry") involves abstract reasoning. The line between perception and cognition is blurrier than you imply.  

  5. **"They test shared priors, not intelligence"**  
     **Verdict:** Fine (and your strongest insight).  
     **Strongest objection:** Shared priors *are* part of intelligence! But your core point stands: what’s "natural" is culturally mediated. A 10th-century Illuminator might group shapes by "divine symmetry," not convexity.  

  6. **"The intended rule is doing invisible work"**  
     **Verdict:** Fine.  
     **Objection:** None—this is self-evident in your Zendo anecdote. The "master’s whim" is a feature, not a bug.  

  ---

  ### Structural Recommendations:
  - **Build the post around:** **"Bongard problems test shared priors, not raw intelligence."** This is fresh, controversial, and backed by your failed puzzle-writing experiment. It exposes the myth of "culture-free" cognition.  
  - **Cut:** The Wittgenstein critique (it’s a category error) and the description-length solution (it’s a minefield of hidden subjectivity).  
  - **Salvage & tighten:** The perception/reasoning point by reframing it: "Bongard problems reveal that *feature relevance* is prior to logic."  

  ---

  ### Conflation Alert:
  You **did conflate two issues in paragraph 1**:  
  - **Problem A:** Underdetermination of rules (Hume).  
  - **Problem B:** *Selecting* a rule from infinite options (where "simplicity" fails).  
  You treat them as one, but Problem B is where your real insight lives—it’s about *cultural priors in rule selection*.  

  ---

  ### Final Thought:  
  Your engineer’s lens is a strength. The "shared priors" angle flips the script: Bongard problems aren’t about intelligence *out there*, but about the unspoken agreements *in here*. That’s the hook. Nail that, and the rest becomes seasoning.
