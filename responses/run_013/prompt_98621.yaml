  ### Decision Tree: The Causal Status of Phenomenal Properties

  **Starting Commitment**: There is something it is like to be me, and this fact is not exhausted by any physical description of me.

  **Node 1**: Could a complete physical description, in principle, capture the fact of what it is like to be you?  
  - **Yes** → Proceed to Node A (Physicalist Path)  
  - **No** → Proceed to Node B (Non-Physicalist Path)  

  #### Physicalist Path (Node A)
  **Node A**: Are phenomenal properties real, or are they merely apparent?  
  - **Real** → Proceed to Node A1  
  - **Merely apparent** → **Leaf: Illusionism**  
    *Most awkward commitment: All claims about conscious experience are systematically false, yet we are compelled to make them.*  

  **Node A1**: Is a phenomenally conscious state identical to the physical state that underlies it?  
  - **Yes** → **Leaf: Identity Theory**  
    *Most awkward commitment: The same phenomenal state must always map to an identical physical state, despite apparent variations across organisms (e.g., pain in humans vs. octopuses).*  
  - **No** → Proceed to Node A2  

  **Node A2**: Is consciousness constituted by a higher-order judgment about a mental state?  
  - **Yes** → **Leaf: Higher-Order View**  
    *Most awkward commitment: An experience of red light does not exist until you judge that you are having it, rendering unconscious sensations impossible.*  
  - **No** → **Leaf: Empty Branch**  
    *Diagnosis: Unexplored or incoherent—rejecting both identity and higher-order structure leaves no clear physicalist account of phenomenality.*  

  ---

  #### Non-Physicalist Path (Node B)
  **Node B**: Are physical properties (e.g., mass, charge) incomplete without intrinsic qualities?  
  - **Yes** → **Leaf: Russellian Monism or Panpsychism**  
    *Most awkward commitment: Fundamental particles possess proto-conscious properties, even if inert or isolated.*  
  - **No** → Proceed to Node C  

  **Node C**: Do physical events (e.g., neural activity) cause phenomenal events?  
  - **Yes** → Proceed to Node D  
  - **No** → Proceed to Node E  

  **Node D**: Do phenomenal events cause physical events?  
  - **Yes** → Proceed to Node F  
  - **No** → **Leaf: Epiphenomenalism**  
    *Most awkward commitment: Your sincere reports about your experiences are never caused by the experiences themselves, undermining their truthfulness.*  

  **Node E**: Do phenomenal events cause physical events?  
  - **Yes** → **Leaf: Empty Branch**  
    *Diagnosis: Unattractive—phenomenal events inexplicably affect the physical world while being uncaused by it, violating conservation principles.*  
  - **No** → Proceed to Node G  

  **Node G**: Is there an external force (e.g., divine intervention) coordinating physical and phenomenal events?  
  - **Yes** → **Leaf: Occasionalism**  
    *Most awkward commitment: Every blink or thought requires direct divine action to align mind and body.*  
  - **No** → **Leaf: Parallelism**  
    *Most awkward commitment: The universe pre-established perfect harmony between mind and body, with no causal link, yet we experience them as interacting.*  

  **Node F**: Is every physical event fully caused by prior physical events alone? (Causal closure of physics)  
  - **Yes** → Proceed to Node H  
  - **No** → **Leaf: Interactionist Dualism**  
    *Most awkward commitment: Some physical events (e.g., brain processes) lack sufficient physical causes, violating scientific laws.*  

  **Node H**: Can one physical event have multiple sufficient causes?  
  - **Yes** → **Leaf: Property Dualism (Overdetermination)**  
    *Most awkward commitment: Your arm rising is redundantly caused by both neural activity and your intention, yet neither alone is necessary.*  
  - **No** → **Leaf: Property Dualism (Exclusion Argument)**  
    *Most awkward commitment: Your intention to speak is causally "squeezed out" by brain activity, rendering it an impotent shadow of physical processes.*  

  ---

  ### Key Nodes and the Stowaway Case
  - **Paradox of Phenomenal Judgment**: Explicitly addressed in **Node D** (Epiphenomenalism leaf). If phenomenal states do no causal work, how do we know or report them?  
  - **Stowaway Case**: A being whose reliable reports ("the red is blazing") are generated by a physical subsystem with no input from phenomenal states.  
    - **Forces Node D into focus**: The Stowaway is **possible** only if phenomenal states are epiphenomenal (Node D) or illusory (Illusionism leaf). In all other branches, phenomenal states must cause or constitute reports, making the Stowaway **incoherent or impossible**.  
    - **Treatment by Positions**:  
      - **Impossible**: Interactionist dualism, identity theory, higher-order view, Russellian monism, property dualism (overdetermination).  
      - **Incoherent**: Property dualism (exclusion)—if phenomenal states are excluded, reports can't be "about" them.  
      - **Merely unactual**: Epiphenomenalism, parallelism, occasionalism (Stowaway is possible but may not exist).  
      - **Trivial**: Illusionism (no real experiences to report).

  ### Notes on Empty Branches
  - **Physicalist Path (Node A2 → No)**: Empty due to lack of viable alternatives; rejecting identity and higher-order judgments collapses into illusionism or dualism.  
  - **Non-Physicalist Path (Node E → Yes)**: Empty as it demands unexplained mental-to-physical causation without reciprocal physical-to-mental causation, rendering the view arbitrary and empirically unsupported.  
  - **Diagnosis**: Both gaps arise from combinations that are **unattractive or incoherent** under scrutiny, not unexplored.  

  ### Tree Integrity
  - **Honest Gaps**: Node A2 and Node E→Yes are explicit dead ends. No positions are conflated.  
  - **British English**: Adhered to throughout (e.g., "organise" → but tree uses standard terms like "behavior" for clarity).  

