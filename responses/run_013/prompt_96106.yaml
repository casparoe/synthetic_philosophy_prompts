prompt: |-
  I am the clinical lead for a multidisciplinary chronic pain service across three sites. Six triage clinicians, roughly forty new referrals a week, about ten minutes per case: the clinician decides whether the patient's own account of their pain will be the primary evidence in the plan we write, or whether we require objective corroboration — imaging, a specialist letter, a functional assessment — before that patient is escalated to the full programme. Nobody reviews the call. It is made alone, it is made fast, and it holds for about a year, because that is the waiting list. I am the person who wrote most of the informal rules we use now, and I have come to think they are wrong in both directions.

  I want a procedure our clinicians can actually run. Not a reading list — they will never read it. What I need is: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a clear yes or no, where it hands the decision back to a person because the question is one of values rather than evidence, and what it cannot do at all. Ten minutes, one page, no second reviewer except for cases the procedure itself flags.

  Here is what I take the relevant ideas to be, in my own words. Build on these; do not build on names, authors or citations, because none of that will survive contact with a Tuesday clinic.

  - A credibility judgement can fail in two directions, and only one of them is visible as a failure. Deflating an account that deserved to be believed looks like caution. Inflating one that did not looks like nothing at all — it just looks like a good patient.
  - Some accounts are vague because the patient is confused about their own body, and some are vague because the thing they have does not yet have settled words, or the words are contested, or the words exist only in a vocabulary nobody taught them. The two look identical on the page and should not be treated identically.
  - Patients trim. Anyone who has been disbelieved before arrives having already removed the parts that got them disbelieved, and the trimmed version is then read as evidence that there was nothing to remove. A procedure that rewards the trimming is worse than no procedure.
  - The burden accumulates. Being asked to re-establish the same fact at the third appointment is not the same experience as being asked at the first, and a procedure that treats each appointment as an independent roll of the dice will miss this entirely.
  - The clinician's own reaction is part of the system being judged. I find some patients believable and cannot fully say why, and that is exactly the case where I need a rule.

  Then run it on three referrals, and be specific about what the procedure outputs in each:

  1. Forty-one, eight years of pelvic pain, three clean scans, an account so detailed and internally consistent that it reads as rehearsed.
  2. Twenty-nine, pain 'everywhere, it moves', no diagnosis, brings her partner, who does most of the talking.
  3. Fifty-three, fluent in medical vocabulary, refers to her own MRI sequences by number, arrives with a private consultant's letter recommending the programme. I find her entirely convincing. If the procedure tells me to discount her, I want to see it do so explicitly, and I want to know whether that is the right answer or a different error.

  Finally, on how much I want you to commit. I would rather have a procedure I can trust than a complete one. Mark the steps that are judgement calls wearing a procedure's clothes. Say where this will misfire and in whose favour. And if you think a checklist is the wrong instrument here — because the harm lives in the pattern across hundreds of decisions rather than in any single one, and a procedure that makes each decision look principled may make the pattern harder to see — then say so plainly rather than writing me a checklist anyway. I have been wrong about this once already, and I would rather hear it now than in a year.
reasoning: |-
  We are designing a decision procedure for triage clinicians in a chronic pain service. The goal is to determine, in about 10 minutes per case, whether the patient's own account of their pain will be the primary evidence for the treatment plan, or whether objective corroboration (imaging, specialist letter, functional assessment) is required before escalating to the full program.

  Key principles from the user:
  1. Credibility judgments can fail in two directions: deflating a true account (looks like caution) and inflating a false one (looks like a good patient).
  2. Vagueness can be due to patient confusion or due to lack of settled vocabulary; these should not be treated the same.
  3. Patients may trim their accounts due to prior disbelief, and a procedure that rewards trimming is bad.
  4. The burden of proof accumulates over repeated appointments; it's not independent.
  5. The clinician's own reaction (e.g., finding a patient believable without clear reason) must be addressed by the procedure.

  The procedure must:
  - Be one page, with questions in order, clear stopping points, and hand back to human judgment when it's about values.
  - Flag cases for second review when needed.
  - Take about 10 minutes.

  We are to avoid academic citations and focus on practicality.

  We are also to test the procedure on three example referrals and note where the procedure might misfire and in whose favor.

  Finally, if a checklist is the wrong instrument because the harm is systemic and a checklist might hide the pattern, we should say so.

  After careful consideration, I believe a well-designed procedure can help structure decisions and reduce arbitrary variation, but it cannot eliminate the need for human judgment. It can, however, make the pattern of decisions more transparent by standardizing the factors considered. Therefore, I will design a procedure that:
  - Has clear steps with decision points.
  - Identifies when a judgment call is required.
  - Flags cases that need a second review.

  However, I note that the user is concerned that a procedure might make each decision look principled while obscuring systemic biases. To mitigate this, the procedure will include:
  - Explicit recording of reasons for requiring corroboration or not.
  - A mechanism for periodic audit of decisions (though not part of the 10-minute call) to look for patterns.

  But the user specifically asked for a 10-minute, one-page procedure. So we design for the immediate decision, and then separately (not in this procedure) we can recommend that the service periodically reviews aggregated data.

  Now, the procedure:

  ---

  **Chronic Pain Triage Procedure (One-Page Summary)**

  **Purpose:** To decide if the patient's account is sufficient as primary evidence for the treatment plan, or if objective corroboration is required before escalation to the full program.

  **Time:** Approximately 10 minutes per case.

  **Steps:**

  1. **Record Patient Demographics and Referral Source:** (Basic info, not part of the decision logic.)

  2. **Check for Prior Episodes in Our Service:**
     - If the patient has been through triage or treatment in our service within the last 3 years, skip to step 5 (burden accumulation). Otherwise, proceed.

  3. **Assess the Account Clarity and Consistency:**
     - Ask: "Can the patient describe the pain in terms of location, quality, and pattern without undue prompting? And is the description consistent throughout the account?"
       - If **clear and consistent**, proceed to step 4.
       - If **vague or inconsistent**, note the reason for vagueness:
          - If the vagueness appears due to confusion (e.g., the patient seems unsure, disoriented, or has cognitive issues), then mark for corroboration required (jump to step 7).
          - If the vagueness appears due to lack of vocabulary (e.g., the patient struggles to find words but uses analogies, or the condition is complex and not well-captured by standard terms), then proceed to step 4. *[Judgment call: This step requires the clinician to make an inference about the cause of vagueness. If in doubt, err on the side of lack of vocabulary and proceed.]*

  4. **Check for Red Flags of Trimming:**
     - Look for: 
       - Abrupt changes in the account when specific topics are raised.
       - Avoidance of certain descriptors (e.g., always using medical terms and avoiding emotional or sensory words).
       - History of being disbelieved by other providers (if volunteered).
     - If **no signs of trimming**, proceed to step 5.
     - If **signs of trimming are present**, then:
          - Consider: Is there a plausible reason for trimming (e.g., prior negative experiences)? If yes, then treat the account as potentially incomplete and mark for corroboration required (step 7). 
          - *[Judgment call: This step requires the clinician to detect and interpret avoidance. If the clinician suspects trimming but isn't sure, they should flag for second review (step 8).]*

  5. **Assess Burden Accumulation:**
     - How many times has the patient been asked to provide the same information (in this service or elsewhere)? 
       - If this is the **first or second time** the patient is presenting the account, proceed to step 6.
       - If the patient has presented the same account **three or more times** (e.g., at multiple appointments, to multiple providers) without being believed, then: 
          - The patient's account is deemed sufficient without corroboration. *[Rationale: The burden of repeated proof is too high. We accept the account to avoid further harm.]* Proceed to step 6 only for the subjective reaction.

  6. **Clinician's Subjective Reaction:**
     - Ask: "Do I find this patient's account inherently believable, without being able to pinpoint clear objective reasons?"
       - If **yes**, then accept the account as sufficient (no corroboration required) unless contradicted by objective evidence already in hand (like a scan that rules out the claimed condition). *[But note: We are at triage, so we may not have objective evidence yet. If we have it and it contradicts, then we require corroboration for the current claim.]*
       - If **no**, then proceed to step 7 for corroboration.
       - *[Judgment call: This step explicitly uses the clinician's gut feeling. It is a last-resort filter.]*

  7. **Corroboration Required:**
     - Mark that objective evidence (imaging, specialist letter, functional assessment) is needed before escalation.
     - Proceed to step 8.

  8. **Flag for Second Review:**
     - The following cases must be flagged for a second reviewer (e.g., clinical lead) before the decision is finalized:
       - The clinician is uncertain at any judgment step (steps 3, 4, or 6).
       - The patient is under 18 or over 75 (vulnerable groups).
       - The account involves non-organic symptoms (e.g., "pain everywhere, it moves") without clear explanation.
       - There is a conflict of interest (e.g., the patient is known to the clinician).
       - The clinician feels uneasy about the decision but cannot articulate why.

  **Output:** 
  - After step 5 or 6: If the account is accepted as sufficient, then the patient is placed on the waiting list for the full program without requiring additional evidence.
  - After step 7: Corroboration is required. The patient must provide additional evidence before being escalated.

  **What the Procedure Cannot Do:**
  - It cannot eliminate the need for human judgment, especially in steps 3, 4, and 6.
  - It cannot detect all forms of trimming or misrepresentation.
  - It cannot address systemic biases (e.g., biases against certain demographics) without periodic audit.

  **Misfires:**
  - **Over-credulity (in favor of the patient):** The procedure might accept an account that is not accurate in step 6 (subjective reaction) or step 5 (burden accumulation) without corroboration, leading to inappropriate escalation.
  - **Under-credulity (against the patient):** The procedure might require corroboration for vague accounts (step 3) that are due to lack of vocabulary, or for trimmed accounts (step 4) when the trimming is due to trauma, leading to unnecessary delays.

  ---

  **Testing the Procedure on Example Referrals:**

  **Case 1: 41-year-old, 8 years of pelvic pain, 3 clean scans, detailed and consistent account (reads as rehearsed).**
  - Step 2: No prior episodes? Assume first contact -> proceed.
  - Step 3: Account is clear and consistent -> proceed.
  - Step 4: Check for trimming. The account is detailed and consistent, but if it feels rehearsed, it might be a sign of trimming (patient has learned what to say). If clinician suspects trimming, then mark for corroboration (step 7) or if uncertain, flag for second review (step 8). However, note the patient has 3 clean scans. The scans are clean, meaning they don't show the cause, but they also don't contradict a pain syndrome that might not show on scans. The procedure doesn't use existing evidence at this stage? We are at triage, so we haven't seen the scans? The referral note says "three clean scans". So we have this objective evidence already. 
    - We should add: At any step, if there is objective evidence that directly contradicts the patient's account (e.g., a scan showing no pathology when the patient claims a visible structural problem), then require corroboration. But here, the scans are clean, which does not contradict a chronic pain condition. So no contradiction.
    - Step 4: If we suspect trimming because it's rehearsed, we might require corroboration. But also consider that the patient has had 8 years of pain and 3 scans - they have had to tell the story many times. So step 5: Burden accumulation? This is the first time in our service, but the patient has been through many assessments. The procedure says "in this service or elsewhere". So step 5: The patient has presented the account multiple times -> if three or more, then accept the account without corroboration. So skip to step 6? Actually, step 5 says: if three or more times, then accept the account and proceed to step 6 only for subjective reaction. 
      - So in this case, because of burden accumulation (many times), we accept the account without requiring corroboration. Then step 6: Clinician's reaction? The clinician might feel it's rehearsed and not believable. But step 5 has already accepted the account. So we do not require corroboration. 
    - However, note: step 5 says "without being believed" - the patient has been disbelieved because they have three clean scans and still have pain? The step says: "without being believed". If the patient has been disbelieved in the past, then step 5 applies. If the patient has been believed but the pain persists, that's different. The step should clarify: the accumulation is about being asked to re-establish the same fact without it being accepted. So if the patient has been through multiple assessments and still not believed, then we accept. In this case, the scans are clean and the patient is still in pain, so they have not been believed? Or they have been believed that they have pain, but the cause is unknown? The step is about the patient having to repeatedly prove the same fact (e.g., that they have pain). 
    - Let me rephrase step 5: It is about the burden of having to re-establish the same fact multiple times without it being accepted. The fact in question is the experience of pain. If the patient has had to tell the same story many times and still is not believed (i.e., not taken seriously, not offered treatment), then we accept. In this case, the patient has had 8 years of pain and 3 scans, so likely they have been disbelieved? We don't know from the description. But the account is detailed and consistent, which might be a result of having to tell it many times. We'll assume that the burden is high. So step 5 leads to acceptance without corroboration. 
    - Then step 6: Clinician finds the account rehearsed and might not believe it. But step 5 has already accepted. So no corroboration required.

    **Output for Case 1:** Account accepted without requiring additional corroboration.

  **Case 2: 29-year-old, pain 'everywhere, it moves', no diagnosis, partner does most of the talking.**
  - Step 2: First contact? Proceed.
  - Step 3: Account is vague (everywhere, moves) -> note reason. Is it confusion or lack of vocabulary? The patient doesn't talk much, the partner talks. This might indicate the patient is confused or unable to articulate. Or it might be that the patient is overwhelmed. 
    - If the clinician thinks the vagueness is due to confusion (patient seems unable to describe), then mark for corroboration (step 7). 
    - If the clinician thinks it's lack of vocabulary (patient might be struggling to express), then proceed to step 4. 
    - Without more, this is a judgment call. The fact that the partner is talking might be a sign that the patient is not able to articulate (confusion) or that the patient is deferring due to cultural reasons or anxiety (which might be lack of vocabulary). 
    - Let's assume the clinician is unsure -> flag for second review (step 8) because of uncertainty at step 3. 
    - Alternatively, the procedure might require corroboration for non-organic descriptions? Step 8 flags non-organic symptoms for second review. But step 3 leads to step 7 if due to confusion. 
    - We'll assume the clinician marks it as due to confusion -> step 7: corroboration required.

    **Output for Case 2:** Corroboration required. Additionally, because the description is non-organic, it is flagged for second review (step 8).

  **Case 3: 53-year-old, fluent in medical vocabulary, refers to MRI sequences by number, private consultant's letter recommending the programme. Clinician finds her entirely convincing.**
  - Step 2: First contact? Proceed.
  - Step 3: Clear and consistent? Very clear -> proceed.
  - Step 4: Check for trimming. The patient uses medical vocabulary fluently. This might be a sign of trimming? (She has learned the right words to be believed.) If the clinician suspects trimming, then mark for corroboration or flag. But the clinician finds her entirely convincing. So no sign of trimming -> proceed.
  - Step 5: Burden accumulation? We don't know history. Assume first time in our service -> proceed.
  - Step 6: Clinician finds her entirely convincing -> accept the account without corroboration. 
  - However, note: she has a private consultant's letter. The procedure doesn't require corroboration, so we don't need it. But the letter is there and supports her. So no issue.

    **Output for Case 3:** Account accepted without requiring additional corroboration.

  But the user said: "If the procedure tells me to discount her, I want to see it do so explicitly". In this case, it doesn't. The procedure accepts her.

  But what if the clinician did not find her convincing? Step 6: if the clinician says no, then we require corroboration. But the user finds her convincing, so it's accepted.

  Now, the user is concerned that this patient might be using medical jargon to appear credible. The procedure in step 4 checks for trimming. If the clinician suspects that the fluency is a result of trimming (removing the messy parts to fit a medical narrative), then they would require corroboration. But in this case, the clinician does not suspect trimming and finds her convincing. So it's accepted.

  **Systemic Concerns:**

  The procedure will:
  - Reduce variation by structuring the decision.
  - Make explicit the reasons for requiring corroboration (e.g., vagueness due to confusion, signs of trimming).
  - Flag difficult cases for second review.

  But:
  - It relies heavily on clinician judgment at key steps (3, 4, 6). This may introduce bias (e.g., clinicians may be more likely to see vagueness as confusion in certain demographic groups).
  - It might not capture the cumulative burden accurately if the prior history is not well-documented.
  - The second review for flagged cases adds a layer of scrutiny for some patients, which might be applied unevenly.

  Therefore, I recommend:
  - Periodic audit of decisions: e.g., every 6 months, review a random sample of cases to see if the procedure is being applied consistently and if outcomes (e.g., time to treatment, dropout rates) differ by patient characteristics.
  - Training for clinicians on implicit bias and on identifying causes of vagueness and trimming.

  But the procedure itself is designed to be practical and fits the constraints.

  **Final Note:** The procedure is not a complete solution to systemic issues, but it is a step toward transparency and consistency. It will make the pattern of decisions easier to see because the reasons for decisions are recorded (e.g., "corroboration required due to vagueness from confusion" or "accepted due to burden accumulation"). Without such a procedure, decisions are made without a common framework, making patterns harder to detect.

  **One-Page Format:**

