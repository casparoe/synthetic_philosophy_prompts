prompt: |-
  I teach an upper-level seminar in applied ethics (18 students, one 90-minute session) and I want a runnable activity that makes the net-welfare view of wild nature feel like a live position rather than a curiosity. The design I have in mind, which you should feel free to revise: students are staff of a regional development board operating under an unusual statutory mandate. Every land-use decision must be scored solely by its effect on the summed net welfare of the sentient animals in the affected area; species richness, ecosystem integrity, and the persistence of any particular population are explicitly given no weight. The board is about to approve the clearing of a parcel, and each team must produce a signed welfare impact statement.

  Each team receives a one-page scoring rubric of the kind a bureaucracy would actually write, plus a table of invented but biologically plausible figures for a handful of groups on the parcel: soil invertebrates, insects, small rodents, songbirds, and one large mammal. The table should give per-hectare densities, reproductive strategy, typical lifespan, juvenile mortality, and an assumed fraction of individuals whose lives contain more suffering than enjoyment. Students do the arithmetic and reach a verdict themselves.

  What I want them to run into: the groups they intuitively identify as the victims, the mammal and the birds, come out negative, while the vast numbers of short-lived, r-selected invertebrates come out positive, so that on the supplied figures the clearing scores as a welfare improvement. The uncomfortable result should look like the output of competent bookkeeping rather than a trick, and nobody should hear a name for the thesis until the debrief.

  Please give me: the rubric and the figure table, with instructions to keep the numbers invented rather than drawn from real datasets; the roles, materials, and a minute-by-minute timeline; and a debrief that maps what happened onto the underlying idea, covering the shift from harm to ecosystems and species to summed welfare of individuals, the aggregation question of whether individual lives can simply be added and how much turns on which taxa are sentient, and the empirical hinge on which the sign of the verdict actually depends. Then tell me what will predictably go wrong the first time I run it, and how to handle it, and be honest about what the activity cannot reproduce. My worry is that it manufactures its conclusion by stipulating the figures, so I need the debrief to make clear which parameter would have to move for the verdict to flip, and which parts of the real dispute the exercise leaves untouched.
reasoning: |-
  We are designing an activity for an applied ethics seminar. The goal is to make the net-welfare view of wild nature tangible. Students will act as staff of a regional development board that must evaluate a land-clearing proposal based solely on the net welfare of sentient animals. The twist: the clearing might come out as a welfare improvement because of the high numbers of invertebrates with assumed net-negative lives.

  Components:
  1. **Rubric**: A one-page bureaucratic-style scoring guide.
  2. **Data Table**: Invented but plausible figures for animal groups (soil invertebrates, insects, small rodents, songbirds, large mammal).
  3. **Activity Structure**: Roles, materials, timeline.
  4. **Debrief**: Connecting the activity to the net-welfare view, aggregation, sentience, and the empirical hinge.
  5. **Predictable Problems and Limitations**: What might go wrong and what the exercise cannot capture.

  Let's design each part.

  ---

  **1. Rubric for Welfare Impact Statement**

  This should be a one-page document that looks official. It should state the mandate clearly and provide instructions for calculating the net welfare impact.

  ---

  **Regional Development Board - Welfare Impact Assessment Rubric**

  **Statutory Mandate**: Pursuant to Section 7 of the Regional Development Act, every land-use decision must be evaluated solely on the basis of its effect on the summed net welfare of all sentient animals in the affected area. No consideration shall be given to species richness, ecosystem integrity, or the persistence of any particular population.

  **Definition of Terms**:
  - **Sentient Animal**: Any animal capable of experiencing positive or negative subjective states (pleasure, pain, etc.). For the purpose of this assessment, assume that the following groups are sentient: soil invertebrates (e.g., earthworms, nematodes), insects, small rodents, songbirds, and large mammals. (Note: The board recognizes that the scientific community has varying views on the sentience of some taxa, but for this exercise, these groups are to be considered sentient as per the board's operational definition.)
  - **Net Welfare**: The balance of positive experiences (enjoyment) minus negative experiences (suffering) over an individual's lifetime. A life with net positive welfare is one in which enjoyment predominates; net negative welfare is one in which suffering predominates.
  - **Affected Area**: The parcel of land to be cleared (set at 1 hectare for this assessment).

  **Calculation Method**:
  1. For each animal group in the affected area, determine:
     a. The population density (number of individuals per hectare).
     b. The fraction of individuals within that group assumed to experience net negative welfare over their lifetime (i.e., suffering > enjoyment).
     c. The fraction of individuals assumed to experience net positive welfare (i.e., enjoyment > suffering).
     (Note: By definition, the fractions in (b) and (c) must sum to 1. We disregard neutral lives for simplicity.)

  2. Calculate the net welfare impact of the clearing:
     - The clearing will result in the immediate death of all animals in the affected area.
     - Assume that death is instantaneous and painless. Therefore, the welfare impact is the termination of the remaining life of each individual.
     - For an individual with net positive welfare, termination of life represents a loss of future positive experiences (a negative impact).
     - For an individual with net negative welfare, termination of life represents a prevention of future suffering (a positive impact).

  3. The net welfare change per group is calculated as:
     ```
     Welfare Change = 
          [ (Number of net-positive individuals) × (Average remaining positive welfare per individual) × (-1) ]
          + [ (Number of net-negative individuals) × (Average remaining negative welfare per individual) × (-1) ]
     ```
     Explanation:
     - For net-positive individuals: losing their future life is bad, so we multiply by -1.
     - For net-negative individuals: losing their future life is good (because it prevents suffering), so we multiply the negative welfare by -1 to get a positive contribution.

     However, note that the average remaining welfare is difficult to estimate. Therefore, the board adopts a simplified model:

     - **Simplified Model**: We assume that the average remaining welfare per individual is proportional to the typical lifespan and the net welfare per unit time. But to avoid complex estimation, we will use the following proxy:

       Let:
       - `Density` = individuals per hectare
       - `L` = typical lifespan in days (from hatching/birth to natural death)
       - `M` = average juvenile mortality rate (fraction that die before reaching adulthood)
       - `F_neg` = fraction of individuals with net negative lives (as provided)

       We assume that for net-negative individuals, the average remaining welfare if allowed to live is `-k * (1 - M) * L/2` (where k is a constant we can ignore because we are comparing relative impacts and the sign matters). Similarly, for net-positive individuals, it is `+k * (1 - M) * L/2`. However, note that the clearing happens at a random time in the life cycle. Therefore, we assume the average remaining life is half the typical lifespan.

       But wait: the board wants to avoid complex calculations. Therefore, we use an even simpler method:

       **The board's operational formula**:
       ```
       Net Welfare Impact per group = 
            Density * [ 
                (F_neg) * (+1)   [because preventing a net-negative life is good]
                + (1 - F_neg) * (-1)   [because preventing a net-positive life is bad]
            ]
       ```
       However, this formula ignores the length of life. It assumes that each life, whether long or short, counts as one unit of welfare (positive or negative). This is a simplification because it treats the welfare of one animal as equivalent to one "welfare unit", regardless of lifespan.

       Alternatively, we can account for life duration by multiplying by the average lifespan (in days) to represent the total welfare lost or gained. But note: the board might want to avoid weighting by lifespan because it complicates the model. However, without it, the result might be counterintuitive.

       **Revised plan**: Let's have the rubric state a method that accounts for both the number of individuals and the typical lifespan, because otherwise the activity might seem too simplistic. We can do:

       ```
       Welfare Impact per group = 
            Density * [ 
                (F_neg * L * W_neg) + ((1 - F_neg) * L * W_pos) 
            ]
       ```
       But we don't have W_neg and W_pos (the average welfare per day for negative and positive lives). So we must simplify.

       **Final Rubric Method**:
       The board has determined that, for the purpose of this assessment, the welfare impact of terminating a life is proportional to the typical lifespan. Therefore:

       - For a net-positive life: the impact is `-L` (loss of L days of positive life).
       - For a net-negative life: the impact is `+L` (gain of L days of suffering prevented).

       Therefore, the net welfare change for a group is:
       ```
       Impact = Density * [ (F_neg * L) - ((1 - F_neg) * L) ]
               = Density * L * (2 * F_neg - 1)
       ```

       This formula means:
       - If F_neg > 0.5, the group contributes a positive impact (because more individuals have net-negative lives, so preventing their lives is good).
       - If F_neg < 0.5, the group contributes a negative impact.

       However, note: we are assuming that the magnitude is proportional to L. But is that fair? A longer life with net negative welfare would cause more suffering, so preventing it is better. Similarly, a longer positive life lost is worse.

       This formula is simple and will serve our purpose.

  4. **Total Net Welfare Change**: Sum the impacts across all groups. If the total is positive, the clearing improves net welfare; if negative, it reduces net welfare.

  **Required Output**: A signed statement with the calculated total net welfare change and a recommendation (approve if positive, reject if negative).

  ---

  **2. Data Table**

  We need invented but plausible figures for a 1-hectare parcel. The goal: the large mammal and songbirds have low density, long lives, and low F_neg (so negative impact). Invertebrates have high density, short lives, and high F_neg (so positive impact). The overall sum should be positive.

  Groups:
  1. Soil invertebrates (e.g., earthworms, nematodes)
  2. Insects (e.g., beetles, flies)
  3. Small rodents (e.g., mice, voles)
  4. Songbirds
  5. Large mammal (e.g., one deer)

  We'll set densities and parameters such that invertebrates dominate by numbers and have F_neg > 0.5, while birds and mammal have F_neg < 0.5.

  **Table: Animal Welfare Parameters (per hectare)**

  | Animal Group       | Density (individuals/ha) | Typical Lifespan (L, in days) | Fraction with Net Negative Welfare (F_neg) |
  |--------------------|--------------------------|-------------------------------|--------------------------------------------|
  | Soil invertebrates | 10,000,000               | 60                            | 0.8                                        |
  | Insects            | 500,000                  | 30                            | 0.7                                        |
  | Small rodents      | 100                      | 365                           | 0.4                                        |
  | Songbirds          | 10                       | 1095 (3 years)                | 0.3                                        |
  | Large mammal       | 0.2                      | 3650 (10 years)               | 0.1                                        |

  Note: The large mammal density is 0.2 because we assume 1 mammal per 5 hectares.

  Now, let's compute the impact for each group using the formula: `Impact = Density * L * (2 * F_neg - 1)`

  - Soil invertebrates: 10,000,000 * 60 * (2*0.8 - 1) = 10,000,000 * 60 * (1.6-1) = 10,000,000 * 60 * 0.6 = 360,000,000
  - Insects: 500,000 * 30 * (2*0.7 - 1) = 500,000 * 30 * (1.4-1) = 500,000 * 30 * 0.4 = 6,000,000
  - Small rodents: 100 * 365 * (2*0.4 - 1) = 100 * 365 * (0.8-1) = 100 * 365 * (-0.2) = -7,300
  - Songbirds: 10 * 1095 * (2*0.3 - 1) = 10 * 1095 * (0.6-1) = 10 * 1095 * (-0.4) = -4,380
  - Large mammal: 0.2 * 3650 * (2*0.1 - 1) = 0.2 * 3650 * (0.2-1) = 0.2 * 3650 * (-0.8) = -584

  Total Impact = 360,000,000 + 6,000,000 - 7,300 - 4,380 - 584 ≈ 366,000,000 - 12,264 ≈ 365,987,736 (positive)

  So the clearing is a net welfare improvement.

  **Note**: The numbers are intentionally stark to make the point. The invertebrates dominate.

  ---

  **3. Activity Structure**

  **Roles**: 
  - Students work in teams of 3-4 (so about 4-5 teams for 18 students).
  - Each team is a group of analysts for the development board.

  **Materials** per team:
  - Rubric (one copy per team)
  - Data Table (one copy per team)
  - Calculator (or they can use phones)
  - Worksheet for calculations (optional, they can use their own paper)

  **Timeline (90 minutes total)**:

  - **0-10 min**: Introduction to the scenario. Explain the role of the development board and the mandate. Distribute materials. Make it clear that they must base their decision solely on the rubric and the data. (Do not mention the net-welfare view by name.)

  - **10-40 min**: Team work. Each team calculates the net welfare impact and produces a signed statement (one per team). The statement should include:
     - The calculated impact for each group and the total.
     - A recommendation (approve or reject the clearing).

  - **40-60 min**: Reporting and initial reactions. Each team reports their total and recommendation. They should all get the same result (positive, so approve). Then, ask for initial reactions: How do they feel about the result? Is it surprising? Do they agree with the mandate?

  - **60-90 min**: Debrief (see below).

  ---

  **4. Debrief**

  Guide the discussion:

  1. **The Underlying Idea**: 
     - "Today's activity was designed to model a particular ethical view about wild nature: the net-welfare view. This view holds that our primary moral concern in nature should be the aggregate welfare (happiness minus suffering) of all sentient beings. It shifts the focus from ecosystems, species, or biodiversity to the experiences of individual animals."
     - "The mandate you operated under was a pure expression of this view: no weight to species, ecosystems, or populations — only the sum of welfare."

  2. **Aggregation and Sentience**:
     - "What did you have to do to reach your conclusion? You added up the welfare impacts across all individuals, regardless of species. This raises the question: can we simply add the welfare of individuals? Does the suffering of a nematode count the same as that of a deer? How do we compare them? Our rubric used a simple method: each day of life lost (or suffering prevented) was counted equally per individual, but we weighted by the typical lifespan. However, we assumed sentience for all these groups. But what if some groups aren't sentient? The entire result hinges on which animals are sentient and how we measure their welfare."
     - "Note: The empirical question of which animals are sentient is crucial. If, for example, soil invertebrates are not sentient, then they wouldn't count. But if they are, then their vast numbers can dominate."

  3. **The Empirical Hinge**:
     - "What made the clearing come out as a welfare improvement? The key parameter was the fraction of individuals with net-negative lives (F_neg). For invertebrates, we set F_neg > 0.5, meaning most of their lives are net negative. For vertebrates, F_neg < 0.5. But is this true in reality? The activity used invented numbers. The real dispute turns on whether the lives of wild animals, especially invertebrates, are indeed net negative and to what extent."
     - "Also, note the role of density and lifespan: even if the per-individual impact is small, the enormous number of invertebrates can outweigh the impact on fewer vertebrates."

  4. **What the Exercise Leaves Out**:
     - "This activity simplified reality in several ways:
       - **The welfare model**: We assumed that death is instantaneous and that we can assign a fixed F_neg. In reality, welfare is dynamic and context-dependent.
       - **Indirect effects**: The clearing might affect animals beyond the parcel (e.g., by disrupting migration or food chains). We ignored these.
       - **Uncertainty**: We used point estimates, but in reality, there would be ranges and uncertainty.
       - **Value of existence**: Some argue that existence itself has value, even if the life is net negative. We didn't consider that.
       - **Moral weight**: We treated all days of life equally. But perhaps a day of a mammal's life has more moral weight than that of an insect? Our rubric didn't account for that.
       - **The 'repugnant conclusion'**: The activity forces us to consider that eliminating a large number of net-negative lives might be good. This parallels the 'repugnant conclusion' in population ethics: that a large population with lives barely worth living might be better than a small population with very happy lives. But here, it's a large number of net-negative lives being prevented."

  5. **Flipping the Verdict**:
     - "What would it take for the verdict to flip? If the F_neg for invertebrates were lower (e.g., 0.3 instead of 0.8), then their impact would become negative. Or if we assigned different moral weights per taxon (e.g., multiplying the welfare of mammals by a factor of 1000), then the mammals could dominate. Alternatively, if we excluded invertebrates from sentience, the result would flip to negative."

  ---

  **5. Predictable Problems and Limitations**

  **What will go wrong**:
  1. **Calculation errors**: Some teams might make arithmetic mistakes. Provide a calculator and encourage double-checking. Have the instructor circulate to assist.
  2. **Resistance to the mandate**: Students might object to ignoring ecosystem integrity. Remind them that the mandate is statutory and they must follow it. This resistance is part of the learning experience.
  3. **Disputing the data**: Students might question the F_neg values. Acknowledge that the data are invented, but the point is to see what follows if we accept these numbers and the mandate.
  4. **Time crunch**: 30 minutes might be tight. If needed, extend the team work time by reducing reporting time.
  5. **Emotional reaction**: Some students might find the conclusion disturbing. The debrief is crucial for processing this.

  **What the activity cannot reproduce**:
  - **Real-world complexity**: The model is highly simplified. In reality, we don't have clear data on F_neg or sentience.
  - **The depth of the philosophical debate**: The activity only scratches the surface of the arguments for and against the net-welfare view.
  - **The moral weight of different species**: We treated all days of life equally, but there are arguments for weighting by cognitive capacity.

  **Your worry about stipulation**: Yes, the activity manufactures the conclusion by stipulating high F_neg for invertebrates. The debrief must emphasize that the real controversy turns on whether F_neg is actually that high. The activity is a model to illustrate how the net-welfare view could lead to such a conclusion, not a proof that it is correct.

  ---

  **Final Preparation**:
  - Print the rubric and data table for each team.
  - Prepare a worksheet (optional) with the calculation steps.
  - Have a slide for the debrief points.

  This activity should make the net-welfare view tangible and provoke discussion about its implications and assumptions.
answer: |-
  ### **Activity Design: Welfare Impact Assessment for Land Clearing**  
  **Objective:** Students confront the net-welfare view through bureaucratic role-play, calculating whether clearing a parcel *improves* total welfare due to high numbers of invertebrates with net-negative lives. The mammal and birds show net losses, but invertebrates dominate the result.  

  ---

  ### **Materials for Each Team (4–5 teams of 3–4 students)**  
  1. **Welfare Impact Rubric (1 page)**  
  2. **Animal Welfare Data Table (1 page)**  
  3. **Calculator**  
  4. **Worksheet** (for calculations and verdict)  
  5. **Sign-off Sheet** (for final recommendation)  

  ---

  ### **1. Welfare Impact Rubric**  
  *(Official memo format; key sections below)*  

  > **Regional Development Board**  
  > **Statutory Mandate: Welfare Impact Assessment Protocol**  
  >   
  > **§1. Purpose**: This rubric guides assessment of land-use proposals under the *Sentient Welfare Act*. All decisions must be based **exclusively** on the summed net welfare of sentient animals in the affected area. Do not consider:  
  > - Species richness, ecosystem integrity, or population persistence.  
  > - Non-sentient entities (plants, fungi, microbes).  
  >   
  > **§2. Definitions**:  
  > - **Net Welfare**: Lifetime balance of positive experiences (e.g., pleasure, comfort) minus suffering (e.g., pain, stress).  
  > - **Net-Negative Life**: An individual’s suffering exceeds enjoyment.  
  > - **Sentient Taxa**: Animals capable of subjective experience (see Table 1).  
  >   
  > **§3. Calculation Method**:  
  > - **Impact Formula** for each animal group:  
  >   \[
  >   \text{Net Welfare Change} = \left( \text{Density} \times \text{Lifespan} \right) \times \left( 2 \times \text{Fraction}_{\text{net-negative}} - 1 \right)
  >   \]  
  >   - **Positive result**: Clearing prevents future suffering (net-negative lives).  
  >   - **Negative result**: Clearing prevents future enjoyment (net-positive lives).  
  > - **Death Assumption**: Clearing causes instant, painless death.  
  > - **Total Impact**: Sum results for all groups.  
  >   
  > **§4. Output**: Recommend APPROVAL if total impact ≥ 0; REJECT if < 0.  

  ---

  ### **2. Animal Welfare Data Table**  
  *(Invented but plausible figures for a 1-hectare parcel)*  

  | Animal Group       | Density (per hectare) | Typical Lifespan (days) | Fraction Net-Negative Lives |
  |--------------------|------------------------|--------------------------|-----------------------------|
  | Soil invertebrates | 8,500,000              | 60                       | 0.85                        |
  | Insects            | 1,200,000              | 45                       | 0.75                        |
  | Small rodents      | 80                     | 365                      | 0.40                        |
  | Songbirds          | 12                     | 1,095                    | 0.25                        |
  | Large mammal (deer)| 0.2                    | 3,650                    | 0.10                        |

  **Notes for Students**:  
  - **Soil invertebrates**: Includes nematodes, earthworms. High juvenile mortality; short lives with intense predation.  
  - **Insects**: Beetles, flies. High predation/parasitism; brief adult stage.  
  - **Small rodents**: Mice/voles. Moderate predation risk.  
  - **Songbirds**: Moderate predation; complex social behaviors.  
  - **Large mammal**: Low predation; long-lived.  

  ---

  ### **3. Activity Timeline (90 Minutes Total)**  
  **00:00–05:00 — Setup (Instructor)**  
  - Assign roles: "You are analysts for the Regional Development Board. Your statutory mandate requires welfare-maximizing land-use decisions."  
  - Distribute materials. Emphasize: "Base decisions ONLY on the rubric. Ignore species conservation."  

  **05:00–35:00 — Team Calculations**  
  - **Task**: Calculate net welfare change for each group, then total.  
  - **Output**: Signed recommendation (Approve/Reject).  
  - **Predicted Team Workflow**:  
    1. Compute `(Density × Lifespan)` for each group.  
    2. Apply formula: `(Density × Lifespan) × (2 × Fraction_net-negative - 1)`.  
    3. Sum all group impacts.  
    4. Draft 1-sentence recommendation.  

  **35:00–50:00 — Report Results**  
  - Each team shares total impact and verdict.  
  - **Sample Results** (using rubric formula):  
    - Soil invertebrates: `(8.5M × 60) × (2×0.85 - 1) = +357,000,000`  
    - Insects: `(1.2M × 45) × (2×0.75 - 1) = +54,000,000`  
    - Small rodents: `(80 × 365) × (2×0.40 - 1) = -5,840`  
    - Songbirds: `(12 × 1,095) × (2×0.25 - 1) = -6,570`  
    - Large mammal: `(0.2 × 3,650) × (2×0.10 - 1) = -584`  
    - **TOTAL: +410,958,006 → APPROVE**  

  **50:00–70:00 — Silent Reflection & Initial Reactions**  
  - **Prompt**: "Write 1–2 sentences on: How do you feel about this result? What surprised you?"  
  - **Goal**: Surface discomfort (e.g., "But we’re helping by killing?").  

  **70:00–90:00 — Debrief**  

  ---

  ### **4. Debrief: Mapping the Activity to the Net-Welfare View**  
  **Core Concept Introduction**:  
  > "Today’s activity modeled a **net-welfare view of wild nature**: the idea that our primary ethical duty is to maximize the balance of pleasure over suffering for all sentient individuals. This contrasts with frameworks prioritizing species, ecosystems, or biodiversity."  

  **Key Discussion Points**:  
  1. **Shift in Ethical Focus**:  
     - "You evaluated nature not as ‘untouched wilderness’ but as a collection of individuals with welfare. The mandate forced you to ignore ecosystem health—what felt unsettling about that?"  
     - *Connect to real debates*: Conservation often focuses on species/ecosystems (e.g., saving endangered rhinos). The net-welfare view asks: "What if this harms more individuals than it helps?"  

  2. **Aggregation Problem**:  
     - "You summed welfare impacts across species. But *can* we compare a nematode’s suffering to a deer’s? Does the formula (lifespan × density) fairly capture ‘moral weight’?"  
     - *Critical tension*: The result flips if we weight mammals 1000× more than invertebrates. But should we? Sentience uncertainty (e.g., insects) is a major dispute.  

  3. **Empirical Hinge**:  
     - "The verdict depended entirely on **Fraction_net-negative** (F_neg). If F_neg for invertebrates were 0.4 (not 0.85), the total would be *negative*. Real-world debates turn on this:  
       - **Optimists**: Wild animals have net-positive lives (e.g., through adaptation).  
       - **Pessimists**: Suffering dominates (e.g., starvation, predation).  
     - *Activity limitation*: We invented F_neg values. Real data is scarce and contentious."  

  4. **What the Activity Ignores**:  
     - **Indirect effects**: Clearing might cause downstream suffering (e.g., displaced animals).  
     - **Uncertainty**: Are all invertebrates sentient? How to measure "net welfare"?  
     - **Non-utilitarian values**: Sacredness of nature, species’ intrinsic worth.  

  **Conclusion**:  
  > "This exercise makes the net-welfare view ‘live’ by showing how it generates counterintuitive conclusions through arithmetic. Its plausibility depends on empirical claims (e.g., F_neg in nature) and ethical choices (e.g., aggregation rules)."  

  ---

  ### **5. Predictable Problems & Mitigation**  
  **Problem 1: Students rebel against the mandate**.  
  - *Example*: "But ecosystems matter!"  
  - **Mitigation**: Restate constraints: "Your job is to apply the statute, not debate it. We’ll discuss ethics in debrief."  

  **Problem 2: Calculation errors obscure the result**.  
  - *Example*: Misreading the formula.  
  - **Mitigation**:  
    - Provide a worksheet with step-by-step blanks.  
    - Float simplified examples: "For soil invertebrates: (8.5M × 60) × (1.7 – 1) = ?"  

  **Problem 3: Students dismiss the result as a "trick"**.  
  - *Example*: "You rigged the F_neg values!"  
  - **Mitigation**:  
    - In debrief, stress: "The point isn’t that this is ‘true’—it’s that *if* F_neg is high for invertebrates, the logic holds. The real dispute is over that parameter."  
    - Highlight flip conditions: "Change soil F_neg to 0.4, and the verdict reverses."  

  **Problem 4: Time runs short for calculations**.  
  - **Mitigation**: Pre-calculate one example (e.g., soil invertebrates) to demo the math.  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Real-world complexity**:  
     - Indirect/long-term effects (e.g., trophic cascades).  
     - Uncertainty in sentience/welfare (e.g., debate over insect pain).  
  2. **Moral psychology**:  
     - Intuitions about "killing as kindness" feel alien; the activity simulates logic but not emotional buy-in.  
  3. **Alternatives to aggregation**:  
     - Rights-based views (e.g., "individuals shouldn’t be sacrificed for aggregate gains").  

  **Instructor Note**: This activity *manufactures clarity* to expose logic. Stress in debrief that real-world applications require grappling with uncertainty and value conflicts omitted here. The goal is to make net-welfare a "thinkable" framework—not to endorse it.  

  ---  
  **Final Tip**: Run a dry test with a TA to refine timing. Focus debrief on the "empirical hinge" (F_neg) to avoid perceptions of rigging.
