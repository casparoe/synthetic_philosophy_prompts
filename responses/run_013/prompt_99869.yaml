answer: |-
  Here’s a focused Q&A prep sheet prioritizing likely/damaging objections. Replies assume 2-minute strictness; soften technicalities for philosophers.

  ### **#1 Objection (Decision Theorist)**  
  *"You’re violating the Sure-Thing Principle or continuity axioms. If we can’t compare acts by expectation, what coherent ordering replaces it? Your ‘distribution comparison’ sounds like ad hoc pessimism."*  
  **Reply:** "I’m not rejecting axioms for well-defined expectations. I’m showing they *lack content* in fanaticism cases—like demanding continuity when one quantity is infinite. My ‘distribution comparison’ isn’t an axiom but a diagnostic: when expectations diverge, we should ask if the tail driving them is epistemically accessible. For coherence, I’d preserve axioms *where expectations are empirically meaningful*."  
  **Concede upfront:** Axioms are compelling for bounded utilities/finite states.  
  **Soft spot:** Needs more positive decision rule (tease Step iii gap-filling).

  ### **#2 Objection (Formal Ethicist)**  
  *"This resembles moves in population ethics to avoid the Repugnant Conclusion—but there, we *want* fanaticism! If a tiny probability of a vast future matters, shouldn’t we pursue it?"*  
  **Reply:** "Unlike population ethics, I’m not capping value. I’m questioning whether ‘vast future’ probabilities are *actionable* when no evidence could update them. If your model assigns 10⁻¹⁰⁰ to a utopia, is that a genuine probability or a placeholder for ‘unknown unknowns’? Decision theory should distinguish measurable uncertainty from speculative divergence."  
  **Concede upfront:** Some tail events deserve consideration (e.g., existential risk).  
  **Soft spot:** Requires accepting "actionability" as a constraint.

  ### **#3 Objection (Bayesian Economist)**  
  *"Bayesian agents don’t need ‘finite sampling.’ Subjective probabilities integrate all hypotheses; your ‘ensemble’ is just poor approximation of the true prior."*  
  **Reply:** "If your prior has heavy tails, the expectation is mathematically undefined or dominated by arbitrary tail assumptions. In finance/geophysics, we see this: models with undefined means produce garbage predictions. A Bayesian using such a prior can’t ‘expect’ anything coherent—it’s math, not philosophy."  
  **Concede upfront:** Subjectivity in priors is legitimate.  
  **Soft spot:** Assumes real-world heavy tails (they may deny applicability).

  ### **#4 Objection (Imprecise Probabilist)**  
  *"Why not use imprecise probabilities? Your ‘distribution behavior’ sounds like comparing sets of expectations, which avoids fanaticism without abandoning expectation."*  
  **Reply:** "Imprecise probabilities help, but they don’t resolve the core issue: when *every* reasonable prior has undefined expectation (e.g., St. Petersburg variants), the set of expectations is empty or divergent. My approach asks what happens in repeated stakes: does one act *reliably* outperform, or is it propped up by unfalsifiable tails?"  
  **Concede upfront:** Imprecise models are a valuable tool.  
  **Soft spot:** Overlap with their framework—could be reframed as a motivation for imprecision.

  ### **#5 Objection (Epistemologist)**  
  *"You’re conflating decision rules with epistemology. An agent’s best estimate is still the expectation, even if it’s hard to estimate. What’s ‘decision-relevant’ if not maximal expected choice-worthiness?"*  
  **Reply:** "When the expectation is undefined (e.g., Cauchy distribution), there *is* no best estimate. When it’s defined but driven by unobservable tails, calling it ‘best’ is circular—it hasn’t earned that title through learning or calibration. The ‘decision-relevant’ quantity is robust dominance: does act A beat B in 99.99% of plausible worlds, even if tails *might* favor B?"  
  **Concede upfront:** Expectations are optimal when learnable.  
  **Soft spot:** "Plausible worlds" needs refinement.

  ---

  ### **The Question You Hope Nobody Asks**  
  *"Isn’t this just variance aversion in disguise? You’re rejecting high-kurtosis bets because you dislike extreme uncertainty—which *is* risk aversion."*  
  **Why it’s damaging:** Directly undermines your claim to avoid risk/diminishing-value arguments.  
  **Reply Strategy:**  
  1. **Distinguish risk from structural uncertainty:** "Risk aversion applies when expectations *are* well-defined but volatile. I’m rejecting cases where the expectation itself is miscomputed or illusory."  
  2. **Analogize:** "Rejecting 1/∞ as a probability isn’t risk aversion—it’s refusing to pretend infinity is a number."  
  3. **Reframe:** "This isn’t about *preferring* safety; it’s about *detecting* when the standard calculus self-destructs."  
  **Concede:** Heavy tails *feel* riskier, but that’s not the driver.  
  **Soft spot:** If pressed, you’re implicitly endorsing a "tractability" constraint.

  ---

  ### **General Tactics**  
  - **Jargon swap:** Say "Kolmogorov’s axioms" → "probability’s math rules"; "heavy-tailed" → "outcomes where rare events dominate."  
  - **Anchor in their concerns:** For Bayesians, stress "coherence failure"; for ethicists, "pragmatic actionability."  
  - **Control the gap:** Pre-empt "incomplete rule" by calling it a "minimal fix" to expectation’s pathology, not a full replacement.  
  - **Economist trap:** If they say "But agents *can* have unbounded utilities!," reply: "Then show me a real agent who can compute, insure, or learn from 10⁻¹⁰⁰ probabilities."  

  Time replies ruthlessly: 30s setup, 60s core, 30s landing. Good luck!
