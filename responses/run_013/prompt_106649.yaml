  For the biographical note, I'll focus exclusively on the patriarch's business achievements while reducing his wife and daughters to marital status. Enslaved and indentured laborers will appear only as property in probate records. The scope note will bury their existence under "miscellaneous" categories.

  The subject headings need to weaponize Library of Congress terminology - "Enslaved persons" as property rather than people, "Domestics" instead of servants. The processing note will casually mention uncataloged materials in the flattest tone possible.

  For the insincere reparative gesture, I'll add a line about "identifying community-relevant materials" that leads nowhere. The budget crime will be bundling all correspondence into one folder regardless of author - ensuring women's voices disappear.

  I'll structure it with standard sections: collection overview, biographical note, scope and content, arrangement, restrictions, subject headings, and processing info. The collection number will follow typical formats (like MS-01784), with plausible dates (1790-1890) and extent (14 linear feet).

