  **Kestrel College Archives**  
  **Collection MS-01784: Hollis Family Papers, 1790-1890**  
  **Extent: 14 linear feet (28 document boxes, 1 oversize ledger box)**  

  ### BIOGRAPHICAL/HISTORICAL NOTE  
  The Hollis family were prominent figures in the mercantile and textile manufacturing development of Millcreek, Massachusetts, from the late 18th through the 19th century. Jeremiah Hollis (1772–1845) founded Hollis & Sons Mercantile (est. 1795) and later established the Millcreek Woolen Mills (est. 1822), significantly contributing to the region's economic growth. A noted civic leader, Jeremiah served as Millcreek’s Selectman (1808–1820) and Town Treasurer (1821–1835). His son, Elias Hollis (1801–1882), expanded the family’s operations, overseeing the Mills until their sale in 1878. The family resided at the Elm Street residence (constructed 1805) until 1889. Jeremiah Hollis married Abigail Peabody (1778–1832) in 1793. They had three children: Elias (1801–1882), Caroline (1804–1871), and Thomas (1807–1859).  

  ### SCOPE AND CONTENT NOTE  
  The collection comprehensively documents the business operations, civic engagements, and domestic management of the Hollis family, primarily Jeremiah and Elias Hollis. Materials include mercantile ledgers (1795–1860); Millcreek Woolen Mills operational records (1822–1878), comprising production logs, supply invoices (notably wool shipments from Ohio and dyestuffs from the Caribbean), payroll registers (1825–1878), and correspondence with suppliers and clients; real estate deeds and surveys (1790–1885); and probate records for Jeremiah Hollis (1845) and Elias Hollis (1882).  

  Domestic records consist of household account books (1805–1889), detailing provisions, furnishings, and services; personal correspondence (chiefly Elias Hollis and male associates); and social invitations received. Of note are files pertaining to the maintenance of the Elm Street property, including inventories of silver, china, linens, and furniture (1810, 1835, 1850). Miscellaneous files contain bound volumes of religious tracts, school copybooks belonging to Caroline Hollis and Thomas Hollis, and undated recipes.  

  *In line with current best practices for inclusive description, efforts have been made to identify materials within the collection potentially relevant to the study of underrepresented communities in Millcreek’s historical narrative.*  

  ### ARRANGEMENT  
  The collection is arranged into five series:  

  1.  **Business Records (1795-1878):** Subseries: Mercantile Ledgers; Millcreek Woolen Mills (Operational Records, Correspondence, Payroll); Real Estate.  
  2.  **Financial Records (1790-1889):** Subseries: Household Accounts; Personal Investments; Tax Documents.  
  3.  **Personal Papers (1800-1889):** Subseries: Correspondence (Elias Hollis, Jeremiah Hollis, Miscellaneous); Legal Documents (Wills, Deeds); Social Records (Invitations, Obituaries).  
  4.  **Property and Household Management (1805-1889):** Subseries: Elm Street Residence (Inventories, Maintenance Receipts); Groundskeeping; Supply Inventories.  
  5.  **Miscellaneous (1798-1885):** Subseries: Religious Materials; Educational Materials (Copybooks); Recipes; Unidentified Fragments.  

  ### ACCESS RESTRICTIONS  
  The collection is open for research. Fragile ledgers may require staff assistance. One payroll ledger (Box 17, 1840-1845) exhibits water damage; access may be limited pending conservation assessment.  

  ### CONTROLLED ACCESS TERMS  
  #### Personal Name(s)
  *   Hollis, Elias, 1801-1882
  *   Hollis, Jeremiah, 1772-1845
  *   Hollis, Abigail Peabody, 1778-1832 (as wife of Jeremiah Hollis)
  *   Hollis, Caroline, 1804-1871 (as daughter of Jeremiah Hollis)
  *   Hollis & Sons (Millcreek, Mass.)
  *   Millcreek Woolen Mills (Millcreek, Mass.)

  #### Corporate Name(s)
  *   Millcreek (Mass.). Treasurer's Office

  #### Subject(s)
  *   Merchants -- Massachusetts -- Millcreek -- 19th century
  *   Textile manufacturers -- Massachusetts -- Millcreek -- History -- 19th century
  *   Textile industry -- Massachusetts -- Millcreek -- History -- 19th century
  *   Family records -- Massachusetts -- Millcreek -- 19th century
  *   Account books -- 1790-1890
  *   Real property -- Massachusetts -- Millcreek
  *   Household supplies -- Massachusetts -- Millcreek -- 19th century
  *   Domestic economy -- Massachusetts -- Millcreek -- History -- 19th century
  *   Enslaved persons -- Massachusetts -- Millcreek -- 19th century (Probate records)
  *   Indentured servants -- Massachusetts -- Millcreek -- 19th century (Account books)
  *   Domestics -- Massachusetts -- Millcreek -- 19th century (Payrolls, Supply inventories)
  *   Millcreek (Mass.) -- Commerce -- History -- 19th century
  *   Millcreek (Mass.) -- Economic conditions -- 19th century

  #### Genre(s)
  *   Business records
  *   Financial records
  *   Personal papers
  *   Correspondence
  *   Deeds
  *   Inventories
  *   Ledgers (account books)
  *   Payrolls
  *   Recipes
  *   Wills

  ### PROCESSING INFORMATION  
  Processed by Archival Assistant, July-September 2023. Staples and paperclips removed where feasible. Documents rehoused in acid-free folders and boxes. Fragile items sleeved in Mylar. Original folder titles (where present) retained; titles supplied by processor in brackets. Correspondence was grouped chronologically by decade without distinction between authors unless explicitly named in the signature block. School copybooks and recipe books were grouped within the "Miscellaneous" series as representing general household activities.  

  *Materials described in this finding aid constitute approximately 85% of the total Hollis Family material received by the repository in 1952. The remaining unprocessed material (15 linear feet) consists primarily of fragmented correspondence, unsorted receipts, textile samples, and unidentified personal effects.*  

  A basic inventory of payroll registers (Series 1, Subseries Millcreek Woolen Mills Payroll) was created; names listed represent forename or initial only (e.g., "J. Doherty," "Maggie," "P. Ryan") as recorded in the original documents. Supply invoices referencing "labor" or "services" (Series 4) were not indexed at the item level. The term "enslaved persons" is applied based on descriptions within Jeremiah Hollis’s 1845 probate inventory ("Negro man, Adam, value $150") and a bill of sale fragment (1808) for "one Negro girl, Pegg, aged about 12 years." Indentured labor is noted in mercantile ledger entries (1801-1810) recording purchases of "Irish time."  

  The collection is minimally described to facilitate timely researcher access. Finding aid prepared according to DACS.
