  ### Decision Tree for the Decline and Fall of the Western Roman Empire

  **Root Commitment**: A consequential alteration occurred in the western provinces between the 3rd and 6th centuries CE.  

  **First Branch: What is the primary explanandum?**  
  1. **The western imperial state** (political sovereignty, central authority)  
  2. **The tax-and-army apparatus** (fiscal/military systems enabling state function)  
  3. **The classical city and its elite culture** (urbanism, senatorial class, paideia)  
  4. **The Mediterranean exchange economy** (trade networks, commercial integration)  
  5. **Civilization at large** (Romanitas: values, institutions, social order)  

  ---

  #### **Branch 1: Western Imperial State**  
  **Question: Primary cause of change?**  
  - **Internal cause** (dynamics within imperial society)  
    - **Temporal nature?**  
      - *Punctual catastrophe* (sudden, event-driven collapse)  
        - **Outcome?**  
          - *Decline* (loss of state capacity): **Unnamed** (Awkward: No plausible punctual internal event caused gradual decline).  
          - ***Fall*** (end of polity): **Unnamed** (Awkward: Ignores protracted preconditions; unattractive).  
          - *Liberation/transformation*: **Unnamed** (Unexplored).  
      - *Slow erosion* (gradual decay)  
        - **Outcome?**  
          - *Decline*: **Unnamed** (Awkward: Decline alone doesn’t explain polity’s end; incoherent).  
          - ***Fall***: **Fiscal-military collapse** (Awkward: Overemphasizes state mechanics, neglects external triggers).  
          - *Liberation*: **Unnamed** (Unexplored).  
          - ***Neutral transformation***: **Did-not-fall-but-transformed** (Awkward: Downplays violence/depopulation).  
  - **External cause** (forces beyond imperial borders)  
    - **Temporal nature?**  
      - *Punctual catastrophe*  
        - **Outcome?**  
          - *Decline*: **Unnamed** (Awkward: Punctual events cause fall, not gradual decline; unattractive).  
          - ***Fall***: **Barbarian-invasion** (Awkward: Understates internal vulnerabilities).  
          - *Liberation/transformation*: **Unnamed** (Unexplored).  
      - *Slow erosion*  
        - **Outcome?**  
          - *Decline*: **Unnamed** (Awkward: Slow pressure logically ends polity; unexplored).  
          - ***Fall***: **Barbarian-invasion** (Awkward: Same as punctual variant).  
          - *Liberation/transformation*: **Unnamed** (Unexplored).  

  ---

  #### **Branch 2: Tax-and-Army Apparatus**  
  **Question: Primary cause of change?**  
  - **Internal cause**  
    - **Temporal nature?**  
      - *Slow erosion*  
        - **Outcome?**  
          - ***Decline***: **Fiscal-military** (Awkward: Ignores non-fiscal cultural/social factors).  
          - *Fall/liberation/transformation*: **Unnamed** (Incoherent: Apparatus erodes, doesn’t "fall").  
  - **External cause**  
    - *All combinations*: **Unnamed** (Unexplored: External causes rarely isolated for apparatus).  

  ---

  #### **Branch 3: Classical City and Elite Culture**  
  **Question: Primary cause of change?**  
  - **Internal cause**  
    - **Temporal nature?**  
      - *Slow erosion*  
        - **Outcome?**  
          - ***Decline***: **Toxic-exposure** (Awkward: No evidence lead poisoning caused elite decline).  
          - *Fall/liberation/transformation*: **Unnamed** (Unattractive: Cities persisted post-empire).  
  - **External cause**: **Unnamed** (Unexplored).  

  ---

  #### **Branch 4: Mediterranean Exchange Economy**  
  **Question: Primary cause of change?**  
  - **External cause**  
    - **Temporal nature?**  
      - *Punctual catastrophe*  
        - **Outcome?**  
          - ***Decline***: **Climate-and-plague** (plague focus) (Awkward: Plagues recurred without permanent collapse).  
      - *Slow erosion*  
        - **Outcome?**  
          - ***Decline***: **Climate-and-plague** (climate focus) (Awkward: Climate data correlates poorly with decline).  
  - **Internal cause**: **Unnamed** (Unexplored).  

  ---

  #### **Branch 5: Civilization at Large**  
  **Question: Primary cause of change?**  
  - **Internal cause**  
    - **Temporal nature?**  
      - *Slow erosion*  
        - **Outcome?**  
          - ***Decline***: **Moral-degeneracy** (Awkward: Teleological, culturally biased).  
          - ***Neutral transformation***: **Did-not-fall-but-transformed** (Awkward: Glosses over coercive aspects).  
  - **External cause**: **Unnamed** (Unexplored).  

  ---

  ### Unoccupied Combinations & Reasons  
  1. **State + Internal punctual catastrophe + Fall**:  
     - *Unattractive*: No single internal event (e.g., coup) explains polity’s end.  
  2. **State + External slow erosion + Transformation**:  
     - *Unexplored*: Scholarship focuses on fall/decline, not neutral external transformation.  
  3. **Economy + Internal cause (any)**:  
     - *Unexplored*: Internal economic dynamics (e.g., inflation) rarely isolated as primary cause.  
  4. **Civilization + External cause (any)**:  
     - *Unexplored*: "Barbarians" framed as destroyers, not transformers of civilization.  
  5. **Apparatus/City + Liberation**:  
     - *Incoherent*: Tax systems or cities aren’t "liberated"; liberation applies to people/polities.  

  ### Indistinguishable Positions  
  - **Barbarian-invasion (punctual vs. slow)**: The tree separates these temporally, but both share the same awkward commitment (underplaying internal factors). They are distinct leaves but identically named.  
  - **Moral-degeneracy & Toxic-exposure**: Separated by explanandum (civilization vs. city/culture), avoiding conflation.  
  - **Climate-and-plague (punctual vs. slow)**: Separated temporally; same name but distinct mechanisms.  

  ### Key Notes  
  - **Decline** = Gradual loss of function; **Fall** = Polity dissolution.  
  - **Transformation** implies continuity; **liberation** implies intentional emancipation (rarely argued).  
  - Fiscal-military is the only position centered on the tax-and-army apparatus.  
  - "Did-not-fall-but-transformed" appears twice (state/civilization) with identical naming but distinct explananda.  

  This tree isolates core claims while highlighting tensions (e.g., "transformation" minimizing trauma, "barbarian" views neglecting internals). Unoccupied paths reflect scholarly biases or logical gaps.
