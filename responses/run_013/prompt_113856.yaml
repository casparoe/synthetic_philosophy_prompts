prompt: |-
  I am preparing a single ninety-minute session for a mixed reading group of about fifteen people — two graduate students in philosophy, a working economist, a retired GP, a secondary-school teacher, and several interested laypeople who will have read nothing in advance — and I would like you to plan how I should teach it rather than to teach it to me. I have a whiteboard and no handouts.

  The subject is the levelling-down objection, and the claim of the priority view (prioritarianism) to be immune to it. I have come to suspect that the immunity is less secure than it is usually presented as being. The objection is normally aimed at views that treat equality as something that makes outcomes better; the priority view escapes it because it never holds that making the better off worse off is, by itself, an improvement. Yet the priority view's distinctive content seems to depend on our taking a particular scale of well-being as given, since any concavity in the way we aggregate can be re-described as a concavity in the well-being scores themselves. I do not want the session to be a defence of that suspicion; I want the group to see the shape of the problem for themselves, and to see why it is a problem at all.

  Set out the order in which the components of the session must come, and for each say what it depends on and what will fail to land if it is skipped. Tell me in particular what must be established before the levelling-down objection can be stated as an objection rather than as a puzzle about arithmetic, and what must be in place before the prioritarian's reply can be heard as an answer rather than as a dodge. I am also unsure where to place, or whether to draw at all, the distinction between a view that locates the value of equality in the betterness of outcomes, a view that locates it in how the worse off fare in absolute terms, and a view that locates it in the relations between people; tell me where in the sequence that distinction belongs, and what goes wrong if it is drawn too early.

  Then choose the one example that should carry the session, and say why it should be that one rather than either of the two I am currently tempted by: the case in which everyone's well-being is lowered to a common level and nobody is made better off; and the case in which a benefit must be allocated either by a fair lottery or by an equal division, so that what is at stake is not whether anyone ends up worse off but how the ex ante and the ex post perspectives come apart. Say what the example you choose must contain and what it must be free of.

  Give me the misconceptions the group will arrive with or form — I expect at least that the priority view is merely utilitarianism with a concave transformation of utility built in and so adds nothing, and that the levelling-down objection is a complaint about waste — and mark exactly where in the sequence each must be headed off, and which of them I should instead let surface and dismantle in the room. Finish with one question I can put to the group at the end that would show whether they have understood why the objection is an objection, and tell me what I should refuse to open at this level, saying so out loud — in particular, whether the move to variable populations should be ruled out of order for the evening.
reasoning: |-
  We are designing a single 90-minute session on the levelling-down objection and the priority view's claim to be immune to it, with the goal of having the group see the problem for themselves. The group is mixed, with varying backgrounds and preparation.

  Key goals:
  1. Ensure that the levelling-down objection is understood as an objection (not just arithmetic).
  2. Ensure that the prioritarian reply is heard as an answer (not a dodge).
  3. Explore the challenge that the priority view's distinctiveness depends on the given well-being scale.

  Structure:
  We must build step by step. The session should start with foundational concepts and build to the objection and the prioritarian reply, then introduce the challenge to prioritarianism.

  Sequence of Components:

  1. **Introduction (5 minutes)**
     - Briefly state the topic: We are going to discuss what makes one outcome better than another, especially when it comes to the distribution of well-being. We'll look at two views: egalitarianism and prioritarianism, and a famous objection called the levelling-down objection.
     - Set expectations: We are going to work through an example and you will be asked to think and discuss. No prior knowledge is required.

  2. **Well-being and Interpersonal Comparisons (10 minutes)**
     - Establish that we are talking about well-being (or utility) that can be measured on a cardinal scale and compared across individuals. We are assuming that we can assign numbers to well-being levels and differences. Without this, the discussion cannot proceed.
     - Use a simple example: Suppose we have two people, A and B. We can say that A has 10 units of well-being and B has 5. We can also say that a change that gives A 5 more units is an increase of 5, etc.
     - Why it's essential: Without a common scale, we cannot talk about distributions meaningfully. If skipped, the subsequent discussion will seem arbitrary.

  3. **Utilitarianism (10 minutes)**
     - Introduce utilitarianism: The view that we should maximize the sum total of well-being. Use an example: 
       - State 1: A has 10, B has 5. Total: 15.
       - State 2: A has 8, B has 8. Total: 16.
       - Utilitarianism prefers State 2 because the total is higher.
     - Then, consider a case of redistribution that does not change the total:
       - State 3: A has 15, B has 0. Total: 15.
       - State 4: A has 10, B has 5. Total: 15.
       - Utilitarianism is indifferent: same total.
     - Why: Utilitarianism is the baseline. Without it, the distinctiveness of egalitarianism and prioritarianism won't be clear.

  4. **Egalitarianism (10 minutes)**
     - Introduce the idea that equality matters. Some think that even if the total is the same, a more equal distribution is better.
     - Example: State 4 (A:10, B:5) vs. State 5 (A:7, B:7). The total in State 5 is 14, which is less than 15, but it is more equal. An egalitarian might say State 5 is better because it is more equal.
     - Distinguish between two versions:
       - Telic egalitarianism: Equality is intrinsically good. So, even if we level down (make everyone worse off but equal), that might be better in one respect (equality) but worse in others (total).
       - Deontic egalitarianism: We have a duty to treat people equally, but that doesn't necessarily mean that an equal but lower state of affairs is better. (We are focusing on telic for the objection.)
     - Why: We need egalitarianism to set up the levelling-down objection.

  5. **The Levelling-Down Objection (15 minutes)**
     - Present the objection to telic egalitarianism with an example:
       - State 6: A has 10, B has 2.
       - State 7: A has 2, B has 2. (Leveled down: we brought A down to B's level.)
       - Question: Is State 7 better than State 6 in any respect? The egalitarian must say yes, because it is more equal. But note: No one is better off in State 7, and at least one person (A) is worse off. How can it be better in any respect? That seems absurd.
     - Why it's an objection: We are not just doing arithmetic (comparing numbers) but asking about the value of the outcome. The objection is that it cannot be better in any respect if no one is better off and at least one is worse off.
     - What must be established first: We must have a clear understanding of egalitarianism and the idea that equality might be intrinsically valuable. Without that, the objection is just a puzzle about numbers.

  6. **Priority View (Prioritarianism) (15 minutes)**
     - Introduce prioritarianism: The view that we should give priority to the worse off. It holds that benefits to the worse off matter more than the same-sized benefits to the better off. But note: It does not say that inequality is bad in itself. Instead, it says that the moral value of a benefit is a concave function of the well-being level of the recipient.
     - Example: 
       - State 6: A (better off) has 10, B (worse off) has 2.
       - Suppose we can give 1 unit to either. Giving to B might be more valuable because B is worse off. We can model this by transforming well-being with a concave function (e.g., square root). So, the moral value of A's well-being is sqrt(10) ≈ 3.16, and B's is sqrt(2) ≈ 1.41. Giving 1 unit to A: new moral value sqrt(11)≈3.32, so gain of 0.16. Giving to B: sqrt(3)≈1.73, gain of 0.32. So prioritarianism says give to B.
     - Now, consider the leveling-down case: 
       - State 6: A:10, B:2 → sqrt(10)+sqrt(2)≈4.57
       - State 7: A:2, B:2 → sqrt(2)+sqrt(2)≈2.82
       - Since 2.82 < 4.57, State 6 is better. So prioritarianism does not say leveling down is an improvement in any respect.
     - Why it must come after the objection: We see that prioritarianism avoids the objection. But note: the group might think prioritarianism is just utilitarianism with a concave transformation. We must address that.

  7. **The Challenge to Prioritarianism (15 minutes)**
     - The problem: Prioritarianism seems to depend on the scale of well-being. If we take the concave transformation to be part of the well-being measure, then prioritarianism collapses into utilitarianism with a different scale.
     - Example: Instead of taking well-being as the number, we define a new measure, well-being* = sqrt(well-being). Then, if we apply utilitarianism to well-being*, we get the same result as prioritarianism. So is prioritarianism just a redescription?
     - Why it's a problem: If prioritarianism is just a redescription, then it doesn't offer a distinct view. And if we can choose the scale arbitrarily, then we lose the objectivity of the prioritarian claim.
     - Why after prioritarianism: We must first understand prioritarianism and how it uses a concave transformation. Then we can see that the same outcome can be achieved by redefining well-being and then being utilitarian.

  8. **Synthesizing the Distinction (10 minutes)**
     - Now we can draw the distinction between:
       - Views that value equality intrinsically (telic egalitarianism) and are vulnerable to the levelling-down objection.
       - Views that value absolute levels of the worse off (prioritarianism) and avoid the objection.
       - Views that value the relations between people (deontic egalitarianism) which might avoid the objection by not being about the betterness of outcomes.
     - Why at this point: If we draw this distinction too early (e.g., before the levelling-down objection), the participants won't see why the distinction matters. Now they see that the levelling-down objection forces us to think about what kind of value we are attributing to equality.

  9. **The Core Example for the Session**
     - I recommend against the two examples you are tempted by because:
       - The first (everyone lowered to a common level) is the classic levelling-down case, but it might be too stark and might not reveal the challenge to prioritarianism.
       - The second (fair lottery vs. equal division) introduces ex ante and ex post perspectives, which might complicate the session by adding another dimension.
     - Instead, I propose a simple example that can be used throughout:
       - Start with two people: A has 100, B has 20 (using larger numbers to make the concavity more apparent).
       - Then consider three alternatives:
          - Option 1: Leave as is (A:100, B:20).
          - Option 2: Level down: make both 20 (A:20, B:20).
          - Option 3: Give a benefit to the worse off: we can give 10 units to B (so A:100, B:30) or take 10 from A and give to B (A:90, B:30). 
       - This example allows us to:
          - Show levelling down (Option 2) and why it is objectionable.
          - Show prioritarianism: giving the 10 to B without taking from A increases the priority-weighted sum (if we use a concave function, say square root: Option 1: sqrt(100)+sqrt(20)=10+4.47=14.47; Option 3: sqrt(100)+sqrt(30)=10+5.48=15.48; Option 2: sqrt(20)+sqrt(20)=4.47+4.47=8.94). So Option 3 is best by prioritarianism.
          - Then challenge: if we measure well-being by sqrt(original), then Option 1: 10 and 4.47 (total 14.47) becomes well-being*: A:10, B:4.47. Then Option 3: A:10, B:5.48 (total 15.48) and Option 2: both 4.47 (total 8.94). But now if we are utilitarian about well-being*, we get the same as prioritarianism. So prioritarianism seems reducible.

     - Why this example? It contains:
       - A clear levelling-down case (Option 2) that is worse for everyone (at least for A) and not better for anyone.
       - A prioritarian improvement (Option 3) that helps the worse off without hurting anyone.
       - The possibility of a utilitarian redescription (using well-being*) that collapses prioritarianism into utilitarianism.

     - What it is free of: 
       - It avoids the complication of ex ante/ex post (which is important but might be a distraction).
       - It avoids the issue of variable populations (which we are ruling out for the evening).

  10. **Misconceptions and When to Address Them**
      - Misconception 1: The priority view is just utilitarianism with a concave transformation (so adds nothing). 
        - When to address: During the challenge to prioritarianism (step 7). We explicitly show how the transformation can be seen as a redescription of well-being. Then we ask: Is prioritarianism a distinct view? This is the core challenge we want the group to see.
      - Misconception 2: The levelling-down objection is a complaint about waste (i.e., we are throwing away resources). 
        - Why it's wrong: The objection is not about waste (we might level down without waste, e.g., by destroying one person's resources without giving to others) but about the claim that an outcome with no one better off and some worse off could be better in any respect.
        - When to address: When stating the levelling-down objection (step 5). Emphasize: In the leveling-down case, we are not wasting; we are making some worse off and no one better off. The objection is that this cannot be an improvement in any respect.

      - Let surface and dismantle in the room: The idea that prioritarianism is just utilitarianism with a concave transformation. We can let this emerge during the presentation of prioritarianism (step 6) and then tackle it in step 7.

  11. **Final Question**
      - At the end, ask: "We've seen that prioritarianism avoids the levelling-down objection because it never says that leveling down is an improvement. But if we can reinterpret prioritarianism as a form of utilitarianism by changing the well-being scale, then does prioritarianism really offer a distinct account of why leveling down is not an improvement? Or is it just hiding the problem?"

      - What to rule out: 
          - Variable populations: We are assuming a fixed population. Say out loud: "We are not considering changes in population size tonight, because that would complicate matters and we are focusing on the core issue of the levelling-down objection and prioritarianism."
          - Also, avoid getting into the debate about the exact nature of well-being (e.g., hedonism vs. objective list). We are assuming a cardinal, interpersonally comparable measure.

  Total time: 5+10+10+10+15+15+15+10 = 90 minutes.

  This structure should lead the group to see the levelling-down objection as a genuine objection to telic egalitarianism, to see prioritarianism's reply as initially plausible, and then to see the challenge that prioritarianism's distinctiveness might be undermined by the rescaling possibility.
answer: |-
  ### Session Plan: The Levelling-Down Objection and Prioritarianism's Immunity  
  **Total Time:** 90 minutes  
  **Goal:** Guide the group to see why prioritarianism's immunity to the levelling-down objection may be less secure than it seems, by revealing how its distinctiveness depends on a fixed well-being scale.  

  ---

  ### **Sequence of Components**  
  Build understanding incrementally. Skip any step, and later points will fail to land.  

  1. **Grounding Well-Being and Distributive Justice (10 minutes)**  
     - **What to do:** Define "well-being" as a measurable, cardinal, and interpersonally comparable scale (e.g., "units" like health, income, or preference satisfaction). Use a two-person example on the whiteboard:  
       - *State A:* Person 1 = 10 units, Person 2 = 2 units.  
     - **Why it must come first:** Without a shared scale, later discussions of equality/priority become incoherent. If skipped, the group will dismiss aggregation as "subjective" or "arbitrary."  
     - **Key output:** Agreement that well-being can be quantified and compared.  

  2. **Introducing Utilitarianism (10 minutes)**  
     - **What to do:** Show utilitarianism (maximize total well-being) using State A. Contrast with:  
       - *State B:* Person 1 = 5, Person 2 = 5 (total = 10).  
       - *State C:* Person 1 = 8, Person 2 = 8 (total = 16).  
       Utilitarianism prefers State C > State B > State A.  
     - **Why after well-being:** Utilitarianism is the baseline for comparing egalitarianism/prioritarianism. If skipped, the levelling-down objection seems like a nitpick about math.  
     - **Key output:** Utilitarianism cares only about the sum, not distribution.  

  3. **Egalitarianism and the Levelling-Down Objection (LDO) (20 minutes)**  
     - **What to do:**  
       - Define *telic egalitarianism* (equality is intrinsically valuable). Compare:  
         - *State A (Unequal):* 10 vs. 2.  
         - *State D (Levelled Down):* 2 vs. 2 (everyone at the lower level).  
       - State the LDO: State D is more equal, but is it *better*? No one gains; Person 1 loses. Intuition: It cannot be better in any respect.  
     - **Why here:** The LDO only bites when equality is seen as *making outcomes better*. If skipped, the LDO seems like a "waste" complaint (misconception #1).  
     - **Key output:** The LDO is an objection to telic egalitarianism because it violates the "person-affecting principle" (no improvement without someone benefiting).  

  4. **Priority View (Prioritarianism) (20 minutes)**  
     - **What to do:**  
       - Define prioritarianism: Moral weight decreases as well-being increases (e.g., a unit to the worse off matters more). Use a concave function (e.g., square roots):  
         - *State A:* √10 + √2 ≈ 3.16 + 1.41 = 4.57  
         - *State D:* √2 + √2 ≈ 1.41 + 1.41 = 2.82 (worse than A).  
       - Show prioritarianism avoids LDO: Reducing inequality by harming the better-off isn’t an improvement.  
     - **Why after LDO:** Prioritarianism’s reply only seems non-dodgy once the LDO is seen as a moral objection (not arithmetic). If skipped, prioritarianism looks like "utilitarianism with a twist."  
     - **Key output:** Prioritarianism "immunizes" against LDO by prioritizing the absolute level of the worse off, not equality.  

  5. **The Scale-Dependence Problem (20 minutes)**  
     - **What to do:**  
       - Challenge prioritarianism: Any concave aggregation can be redescribed as linear aggregation of transformed well-being.  
         - Example: Define "well-being*" where w* = √w. Then:  
           - State A: 10 and 2 → w* = 3.16 and 1.41 → sum = 4.57 (same as prioritarianism!).  
         - Now apply utilitarianism to w*: State D sums to 2.82 (still worse).  
       - Question: Is prioritarianism just utilitarianism in disguise?  
     - **Why after prioritarianism:** The group must first grasp prioritarianism’s mechanics to see this as a problem (not a technicality). If skipped, the "immunity" seems secure.  
     - **Key output:** Prioritarianism’s distinctiveness hinges on the well-being scale being "fixed." If we rescale, it collapses into utilitarianism.  

  6. **Synthesizing the Distinction Between Views (5 minutes)**  
     - **What to do:** Contrast:  
       - *Telic egalitarianism:* Values equality in outcomes → vulnerable to LDO.  
       - *Prioritarianism:* Values absolute levels of the worse off → avoids LDO (but scale-dependent).  
       - *Deontic egalitarianism:* Values fair procedures/relations (not covered; rule out for tonight).  
     - **Why last:** Drawing this distinction early conflates prioritarianism with deontic views, masking the scale problem. If skipped early, the LDO debate becomes muddled.  
     - **Key output:** Prioritarianism’s vulnerability is about *what it values*, not procedures.  

  7. **Final Reflection and Question (5 minutes)**  
     - **Pose this question:** "Prioritarianism avoids saying levelling down is better, but if we can rescale well-being to make it utilitarian, does its 'immunity' reveal anything distinctive about justice?"  
     - **Rule this out:** "We are not discussing variable populations, ex ante fairness, or deontic equality—those are separate issues for another session."  

  ---

  ### **The Core Example**  
  **Use this:** A simple two-person case with three states:  
  - *State X (Unequal):* P1 = 100, P2 = 20.  
  - *State Y (Levelled Down):* P1 = 20, P2 = 20.  
  - *State Z (Prioritarian Improvement):* P1 = 100, P2 = 30 (e.g., giving 10 units to P2).  

  **Why this example (not your alternatives)?**  
  - Your first temptation (levelling down with no gain) is covered in State Y, but it’s too narrow: It shows the LDO but not prioritarianism’s positive case (State Z).  
  - Your second temptation (lottery vs. equal division) introduces ex ante/ex post complexity, which distracts from the core scale-dependence problem.  
  - **This example must contain:**  
    - A levelling-down scenario (State Y) to trigger the LDO intuition.  
    - A prioritarian improvement (State Z) to show how prioritarianism avoids LDO.  
    - Quantifiable well-being to expose the scale problem (e.g., √100 + √20 ≈ 10 + 4.47 = 14.47 vs. √100 + √30 ≈ 10 + 5.48 = 15.48).  
  - **It must be free of:**  
    - Ex ante uncertainty (no lotteries).  
    - Relational comparisons (e.g., envy) or procedural fairness.  
    - Population changes.  

  ---

  ### **Misconceptions and When to Address Them**  
  1. **"Priority view is just utilitarianism with concave utility."**  
     - **When to address:** Let it surface during **Step 4 (Prioritarianism)**. Dismantle it in **Step 5 (Scale-Dependence)** by showing rescaling collapses prioritarianism into utilitarianism—this *is* the problem!  
     - **Why:** If headed off earlier, the group misses the "aha" moment that prioritarianism’s distinctiveness is fragile.  

  2. **"LDO is a complaint about waste."**  
     - **When to address:** Head off during **Step 3 (LDO)**. Emphasize: LDO isn’t about inefficiency; it’s that no one benefits in *any* way (e.g., State Y isn’t "wasteful"—it’s actively harmful).  
     - **Why:** If unaddressed, the group will misdiagnose LDO as pragmatism, not a moral paradox.  

  3. **"Equality is about fairness, not outcomes."**  
     - **When to address:** Briefly rule out in **Step 6 (Synthesis)** by distinguishing telic vs. deontic egalitarianism. Say: "Tonight, we focus on outcomes, not procedures."  
     - **Why:** Drawing this too early (e.g., during LDO) dilutes the telic/deontic confusion that prioritarianism exploits.  

  ---

  ### **Final Notes**  
  - **Avoid:** Variable populations (say: "We fix the group size tonight—adding people changes the problem").  
  - **Whiteboard use:** Sketch states (X, Y, Z) and transformations (w vs. w*) side by side.  
  - **Group dynamics:** Poll intuitions at each step (e.g., "Raise hands if State D seems better").  
  - **Why this works:** The sequence makes the LDO an objection (**Step 3**), prioritarianism an answer (**Step 4**), then undermines it (**Step 5**)—so the group *discovers* the problem.  

  By the end, they’ll see prioritarianism’s "immunity" rests on a scale that can be subverted—and why that threatens its core claim.
