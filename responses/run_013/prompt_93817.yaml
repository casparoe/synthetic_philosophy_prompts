  Below is an interactive decision tree designed to diagnose a reader's implicit theory of dispositions based on intuitive responses to five concrete cases. The tree uses binary choices (Yes/No) at each node, leading to named theoretical positions (or unoccupied combinations). Each leaf position includes its most awkward commitment. The cases are:

