  2. **Foam Glass**: An ordinary fragile glass swaddled in protective foam, struck but unbroken.  
     *Question: Does the glass have the disposition to break when struck?*  

  3. **Reinforced Glass**: A glass made of fragile material fitted with a gadget that reinforces it upon impact, so it never breaks when struck.  
