prompt: |-
  For the better part of a year my reading group has been stuck on the boundary problem, and I would like to force us to produce the document we should have written months ago rather than relitigating the same three examples over cheap wine. Our disagreement is not about who should vote in any actual country; it is about what makes someone belong to a demos in the first place, given that any answer has to be enacted by a body that already presumes a boundary — the circularity is the whole difficulty, and we agree on at least that much. We have settled into two camps. One of us holds the all-affected principle: whoever is significantly affected by a collective decision has a claim to a say in making it, so the demos ought to be drawn wide enough to take them in. The other holds the all-subjected principle: what grounds inclusion is not being affected but being authoritatively bound — having one's rights, duties, or legal standing determined by the decision — which is narrower, less indeterminate, and, he insists, tracks the distinctive wrong of being governed without a voice. I want a joint statement the two of us could sign in good faith, with the residual disagreement made exact rather than papered over.

  Keep it concrete and in the weeds by building around the case we keep circling: an upstream state proposes to dam a river; two downstream states will be badly affected by the changed flow but are bound by nothing the upstream state decides; a fourth state is bound by the decision only because a pre-existing trade treaty incorporates the upstream state's environmental standards. Use that case to press both principles, and also test a hybrid that neither of us currently holds — graduated inclusion, under which affected-but-not-subjected parties get a voice without a vote while subjected parties get full membership — as a possible point of convergence or as a device that exposes what each principle is really committed to. Do not assume the two principles coincide in this case; if you think one of them collapses into the other, say so and show where.

  Format the document as follows, in this order. First, "Agreed Claims": a numbered list of eight to twelve single-sentence claims both sides could sign, including at least one about why the boundary problem is a genuine problem rather than a confusion and one about what would count as a decisive objection to either principle. Second, "Residual Disagreements": a table with one row per contested question and columns for the question in neutral wording, the all-affected answer phrased so its own side would accept the phrasing, the all-subjected answer phrased likewise, and the crux that row turns on. Third, "Cruxes": three or four short paragraphs, each naming a sub-question such that settling it would move at least one side, and saying which side and why. Fourth, "Prospective Tests": for each crux, a case or argument both sides agree bears on it, together with each side's prediction about how the river case or the graduated-inclusion hybrid should come out. Fifth and finally, "Verbal Disputes": a short paragraph identifying any part of the quarrel that is merely terminological, if there is one, and why the rest is not.
reasoning: |-
  Hmm, this user is describing a deep philosophical dilemma their reading group has been stuck on regarding democratic boundary problems. They've clearly engaged extensively with the circularity issue of defining a demos when any definition already presupposes boundaries. The group has crystallized into two camps: all-affected principle vs all-subjected principle, with a river damming case as their central example.

  The user wants a structured joint statement that doesn't paper over differences but makes them explicit. They're clearly frustrated with endless circular debates and want concrete progress. The request shows sophisticated understanding of democratic theory - they recognize the need to test principles against cases and examine hybrids like graduated inclusion.

  Notably, they're not interested in practical politics but in conceptual clarity. The river case is perfect for this: it cleanly separates affectedness from subjection. The fourth state (bound by treaty) introduces valuable complexity that tests principles' boundaries. The graduated inclusion hybrid could serve as either convergence point or diagnostic tool.

  The requested format is rigorous: agreed claims first to establish common ground, then precise mapping of disagreements via table, followed by actionable cruxes with test cases. This structure forces both sides to articulate their positions testably. The "verbal disputes" section wisely asks us to filter out terminological noise.

  For the river case, we must show how principles diverge: all-affected would include downstream states, all-subjected would exclude them but include the treaty-bound state. Graduated inclusion reveals whether voice-without-vote satisfies democratic ideals. The treaty state is key - does incorporation create subjection or merely enforce effects?

  The circularity problem needs careful handling: both sides agree it's genuine because any democratic procedure presupposes boundaries, yet boundaries require democratic justification. Decisive objections should target each principle's core - indeterminacy for all-affected, moral arbitrariness for all-subjected.

  Cruxes should expose fundamental commitments: Is democracy about minimizing harm or avoiding domination? Does legal formality or impact severity matter more? Testing predictions will reveal whether principles are falsifiable. The verbal dispute analysis must distinguish genuine disagreement about authority vs mere semantics about "bindingness."

  The document should maintain strict neutrality while giving each principle its strongest formulation. The treaty incorporation detail is crucial - it may force all-subjected advocates to clarify what "authoritative" means, and all-affected advocates to confront slippery slope concerns.
answer: |-
  ## Joint Statement on the Demos Boundary Problem

  **Agreed Claims:**
  1.  The boundary problem is genuine because defining the legitimate demos requires a democratic decision, yet that decision itself presupposes a prior demos, creating a foundational circularity.
  2.  Neither principle ("all-affected" or "all-subjected") resolves the circularity independently; both require initial boundary-setting.
  3.  A decisive objection to the all-affected principle is its potential for unworkable indeterminacy (e.g., identifying "significant" effects across vast causal chains).
  4.  A decisive objection to the all-subjected principle is its potential for morally arbitrary exclusion (e.g., those profoundly harmed but not formally bound).
  5.  The core function of defining a demos is to legitimate coercive collective authority and prevent unjust domination.
  6.  The river damming case (Upstream State (US), Downstream States A & B (affected, not bound), Treaty State T (bound via treaty incorporation)) presents a non-trivial challenge where the principles diverge.
  7.  "Being subjected" implies a direct alteration of one's legal rights, duties, or standing by the authoritative decision itself.
  8.  "Being significantly affected" implies substantial, non-trivial consequences for an individual's or group's interests or well-being, regardless of legal formality.
  9.  The graduated inclusion hybrid (voice without vote for affected-not-subjected, full membership for subjected) is a conceptually distinct proposal worthy of examination.
  10. Any defensible principle must offer a plausible account of how it could be operationalized without collapsing into incoherence or infinite regress.
  11. The legitimacy of the boundary-setting act itself is a distinct, prior question to who is included by any given principle.
  12. Our primary disagreement concerns the fundamental *grounds* for inclusion within a demos, not merely its practical scope.

  **Residual Disagreements:**

  | # | Question (Neutral Wording)                                                                 | All-Affected Answer (AA Side Accepts)                                                                                                | All-Subjected Answer (AS Side Accepts)                                                                                               | Crux                                                                                                                                 |
  | :-- | :----------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- |
  | 1  | What is the fundamental ground for inclusion in the demos?                                  | Inclusion is grounded in having one's significant interests substantially impacted by the collective decision.                         | Inclusion is grounded in being placed under the direct, authoritative authority of the collective decision (i.e., having legal relations altered). | **Nature of Democratic Wrong:** Is the core democratic wrong being governed *without consent* (AA) or being *coercively bound* without a voice (AS)? |
  | 2  | Does mere causal impact, without legal alteration, suffice for a claim to inclusion?        | Yes, significant causal impact on core interests generates a prima facie claim to inclusion, as exclusion risks unjust imposition of harm. | No, causal impact alone is insufficient; inclusion requires the specific imposition of binding legal obligations or alterations to legal status. | **Scope of Legitimate Authority:** Does democratic authority extend to justifying *effects* (AA) or only the imposition of *binding rules* (AS)? |
  | 3  | Does formal legal incorporation (like the treaty) suffice for "being subjected"?            | Formal incorporation makes TS subjected, but this highlights how AS can include seemingly arbitrary cases while excluding severely affected parties (DS A&B). | Yes, the treaty makes US's environmental standards directly binding on TS, authoritatively altering TS's legal obligations; TS is therefore subjected. | **Form vs. Substance of Subjection:** Is the *source* of the bindingness (a prior treaty) relevant to whether TS is subjected *by this specific US decision*? |
  | 4  | Should Downstream States A & B be included in the demos for the dam decision?               | Yes, because they will suffer significant harm to vital interests (water supply, ecology, economy) due to the dam's effects.          | No, because the US dam decision does not itself directly impose any legal obligations, rights, or changes in status upon DS A or B.    | **Application to Case (Downstream):** Does profound causal impact create a democratic claim (AA), or is the absence of direct legal imposition decisive (AS)? |
  | 5  | Should Treaty State T be included in the demos for the dam decision?                        | Not necessarily *solely* because of the treaty; its inclusion depends on whether the dam *significantly affects* TS's interests via the altered standards. | Yes, unequivocally, because the dam decision alters the environmental standards that are legally binding on TS via the treaty, directly subjecting TS. | **Application to Case (Treaty State):** Is inclusion triggered by the *effect* of the changed standard (AA) or by the *legal incorporation* creating subjection (AS)? |
  | 6  | Is the graduated inclusion hybrid (voice/vote distinction) a viable solution?               | It offers a pragmatic way to acknowledge affected interests without diluting decision-making authority for the core subjected demos. | It risks incoherence (how is "voice" legitimated?) and fails to address the core wrong of being bound without a vote; only the subjected need the vote. | **Hybrid Assessment:** Does voice-without-vote mitigate the democratic wrong for the affected (AA), or is only a vote sufficient against subjection (AS)? |

  **Cruxes:**

  1.  **The Democratic Wrong:** Settling whether the fundamental democratic wrong is primarily about *being harmed by collective action without consent* (AA) or *being coercively bound by rules without authorship* (AS) would significantly clarify positions. For the AA proponent, showing that subjection is merely a subset of harmful effects might weaken the AS claim. For the AS proponent, demonstrating that non-subjection effects don't raise the *distinctive* wrong of illegitimate authority would solidify their stance.
  2.  **The Necessity of Formality:** Resolving whether the *form* of authoritative imposition (direct legal change) is essential to trigger democratic inclusion, or whether the *substance* of significant impact suffices, is crucial. If the AS side cannot convincingly argue why the treaty-bound state (TS) is fundamentally differently situated *democratically* than the downstream states (DS A&B) despite similar potential harm, their principle risks appearing formalistic. Conversely, if the AA side cannot provide a non-arbitrary limit on "significant effects," their principle seems unworkable to the AS side.
  3.  **Operationalizing "Significant Effect":** Pinpointing a workable, non-circular criterion for "significant effect" that avoids infinite regress would move the AA side significantly closer to viability in the AS proponent's eyes. If "significant effect" inevitably collapses into "being subjected" in practice, the AS principle gains strength. If a robust, distinct criterion can be articulated and defended, AA gains ground.
  4.  **The Legitimacy of Derivative Subjection:** Clarifying whether being subjected *via a prior agreement* (like the treaty) constitutes being subjected *by the current decision* in a democratically relevant way is key for the Treaty State case. If the AS side must concede that TS's subjection stems from the *treaty*, not the *dam decision itself*, its inclusion claim weakens. If the AA side must concede that the treaty makes TS's situation normatively distinct from DS A&B (even if effects are similar), AS gains support.

  **Prospective Tests:**

  *   **Crux 1 (Democratic Wrong) - Test Case:** *A state passes lax pollution laws harming neighbors, but no treaty exists.*
      *   **AA Prediction:** Neighbors are significantly affected and should have a claim to inclusion (vote or voice). Outcome in River Case: DS A&B included.
      *   **AS Prediction:** Neighbors are *not* subjected; no claim to inclusion. Outcome in River Case: DS A&B excluded.
      *   **Hybrid Prediction (River Case):** AA: DS A&B get voice. AS: DS A&B get nothing (only subjected parties vote).

  *   **Crux 2 (Necessity of Formality) - Test Case:** *The upstream dam causes a massive flood destroying DS A, but through sheer natural force, not a legal order.*
      *   **AA Prediction:** Effect is catastrophic; inclusion claim remains strong. Outcome in River Case: Formality is irrelevant; impact matters. DS A&B included.
      *   **AS Prediction:** Absence of authoritative imposition remains decisive; no inclusion claim. Outcome in River Case: Formality is essential; DS A&B excluded.
      *   **Hybrid Prediction (River Case):** AA: DS A&B get voice (due to impact). AS: DS A&B get nothing (no subjection).

  *   **Crux 3 (Operationalizing Effect) - Test Argument:** *Propose a specific, non-subjection-based threshold for "significant effect" (e.g., existential threat, severe economic collapse) and apply it to DS A&B.*
      *   **AA Prediction:** Such a threshold is viable and clearly includes DS A&B. Outcome in River Case: DS A&B included based on clear threshold.
      *   **AS Prediction:** Threshold will be either too vague, too broad, or collapse into subjection (e.g., "existential threat" might imply de facto subjection). Outcome in River Case: Threshold fails; reinforces exclusion of DS A&B.
      *   **Hybrid Prediction (River Case):** AA: Threshold met, DS A&B get voice. AS: Threshold unconvincing, DS A&B get nothing.

  *   **Crux 4 (Derivative Subjection) - Test Case:** *The pre-existing treaty requires TS to adopt *any* US law on topic X, not just environmental standards. US passes a law on X unrelated to the dam.*
      *   **AA Prediction:** TS is bound, but only included if *this specific law* significantly affects TS. Outcome in River Case: TS included only if dam *affects* it via standards.
      *   **AS Prediction:** TS is subjected *by the US decision* because the decision changes the law binding on TS. Outcome in River Case: TS is subjected *by the dam decision* via the treaty mechanism, hence included.
      *   **Hybrid Prediction (River Case):** AA: TS included only if affected (maybe voice only). AS: TS is subjected, gets vote.

  **Verbal Disputes:**

  There is a potential verbal dispute regarding the term "bound" or "boundary." Both sides agree the demos needs a boundary, but disagree profoundly on the *criterion* for drawing it (effects vs. subjection). This is not merely terminological. The disagreement stems from fundamentally different conceptions of what democracy is *for* (mitigating imposed harm vs. legitimating coercive authority) and what generates the distinctive claim to inclusion. While terms like "significance," "authoritative," and "binding" require careful definition, the core clash over whether causal impact absent legal imposition constitutes a democratic wrong is substantive, not semantic. The river case starkly exposes this substantive disagreement: DS A&B are paradigmatically "affected-not-subjected," and the principles yield opposite conclusions.
