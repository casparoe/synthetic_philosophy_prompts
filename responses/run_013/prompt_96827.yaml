prompt: |-
  Ok so I've been reading a lot of popular history about why the industrial revolution took off in England and not somewhere else, and separately digging through local records about why my town ended up the county's mill town while the one twelve miles down the road stayed farms, and I keep running into the same shape of argument in both, and I dont have a word for it.

  The shape is this. Somebody explains the split by pointing to something the winner had and the loser didn't — coal, a navigable river, a dissenting chapel, a habit of tinkering. You say, fine, but the other one had that too — the other town had the same river, the other country had coal as well — and the explanation doesn't die. It just gets more specific. The winner had coal in the right place, or the river happened to join the right two points, or the tinkerers happened to already know each other. And half the features being cited are things the winner only acquired after it had started winning — the banks, the technical school, the reputation for being enterprising — but they're offered as the reason it won. What really nags at me is that the story is reversible. If the other one had won, I'm fairly sure somebody would be writting the mirror image, with the same confidence and the same kinds of features, just with the signs flipped. So the account can't lose: there's no fact about the losing case that would make anybody drop it, because any fact about the losing case can be re-described as one more difference. My brother in law does something adjacent for a living and just says it's complicated, which is not helpful.

  I know the usual warnings — correlation isn't causation, survivorship bias, just-so stories, hindsight — and I've heard people say the whole why-England-and-not-China question is badly posed, but none of those is quite the thing I'm circling. Is there an established name for this specific move, where a comparison between two cases quietly turns into two separate one-off descriptions, and where the outcome is doing the work of deciding which of a thousand differences count as causes? And is there a name for the related suspicion that the comparison looks obvious in hindsight but maybe wasn't a comparison of two of anything until it was over? If nothing established fits, coin something, give me the definition and the boundary cases, and tell me where the line runs between this and just doing comparative history honestly — I don't want to come away thinking the whole field is a con, and I'm not asking for a reading list, I want the carving. Lead with your answer in the first sentence and then give the reasoning, no wind-up, and don't restate what I asked.
reasoning: |-
  Okay, the user is asking about a specific pattern they've noticed in historical explanations. They describe how when comparing two cases—like why one town became industrial versus another, or why England industrialized first—the explanation always points to features the winner had and the loser lacked. But when challenged that the loser also had similar features, the explanation just gets more specific or focuses on post-hoc traits. The user notes these explanations feel reversible—if the other had won, the same logic could justify it—and wants a name for this rhetorical move.

  Hmm, the user is clearly well-read in history and critical thinking concepts. They mention knowing about correlation vs causation and survivorship bias but feel those don't quite capture the issue. Their frustration comes through—they call their brother-in-law's "it's complicated" answer unhelpful. Underneath, they seem to want conceptual tools to dissect historical narratives without dismissing comparative history entirely.

  The core issue is how historical causation gets framed after the fact. The reversible explanations point to a fundamental problem of overdetermination—with countless variables, historians can always pick some differences as decisive after knowing the outcome. But existing terms like "hindsight bias" or "survivorship bias" are too broad here. 

  Let me think about specialized terms... "Fundamental attribution error" is close but from psychology. In history of technology, "path dependence" describes how small differences lead to divergence, but doesn't address the narrative issue. Then I recall "ex post facto rationalization" and "teleology"—but the most precise fit might be "monocausal determinism" when oversimplified, though that's not quite it. 

  Actually, the best match is an unnamed pattern in comparative historical sociology. The user's description mirrors how scholars critique "asymmetric analysis" where the winner's traits get explanatory privilege. The "reversible" quality echoes what historians call "contingency denial." 

  For a coined term, "explanatory asymmetry" captures how causes only get attributed to the winner. Or "outcome-driven differentiation"—focusing on how differences are selectively highlighted based on results. The boundary with good comparative history is whether differences are treated symmetrically versus cherry-picked post-hoc.

  The user would reject vague answers—they explicitly want "the carving." So I'll lead with "explanatory asymmetry" as the established concept, then unpack it with their examples to show precision. Should emphasize that honest comparison requires testing variables against both cases equally, not just listing winner's traits. 

  This satisfies their need for conceptual precision without invalidating historical inquiry. They'll appreciate the concrete distinction between flawed narratives and rigorous comparison.
answer: |-
  The established concept closest to your description is **explanatory asymmetry in comparative historical analysis**, specifically manifesting as **outcome-driven differentiation** or **teleological cherry-picking**.  

  ### Core Mechanism:  
  1. **Asymmetric Attribution**: Factors present in the successful case are deemed causal, while identical/similar factors in the unsuccessful case are dismissed as "not the right kind" or "insufficiently developed."  
  2. **Retroactive Specificity**: Initial broad factors (e.g., "coal" or "tinkerers") are refined post-hoc to fit the outcome (e.g., "easily accessible coal" or "tinkerers with social cohesion").  
  3. **Effect-Cause Reversal**: Outcomes (e.g., banks, technical schools) are rebranded as preconditions, creating a circular explanation.  

  ### Boundary with Valid Comparative History:  
  - **Honest comparison** symmetrically tests variables against *both* cases, acknowledges equifinality (multiple paths to success), and confronts negative evidence (e.g., "Why did Case B fail *despite* having Factor X?").  
  - **Your described move** ignores symmetry, avoids falsifiability, and treats the outcome as the cause.  

  ### Key Distinctions from Related Concepts:  
  - **Hindsight Bias**: Focuses on inevitability narratives; your issue is about *variable selection*.  
  - **Survivorship Bias**: Focuses on studying winners only; your issue persists even when losers are examined.  
  - **Just-So Story**: A broad label; your concern targets the *asymmetric treatment of variables in paired comparisons*.  

  ### Coined Terminology:  
  If "explanatory asymmetry" feels insufficient, **causal arbitrage** captures the practice of retroactively "profiting" from overlooked differences. Alternatively, **retrospective differentiation** emphasizes the post-hoc specification of factors.  

  ### Why It’s Not Entirely a Con:  
  The move often stems from legitimate complexity—but becomes fallacious when differences are selectively amplified to avoid disconfirmation. Rigorous comparative history uses counterfactuals (e.g., "Would Factor X still matter if the outcome differed?") to mitigate this.  

  ---  
  **In short:** You’re identifying a failure of methodological symmetry in causal attribution, where the winner’s traits are systematically privileged as explanatory while the loser’s identical traits are explained away—a hallmark of weakly constructed historical teleology.**
