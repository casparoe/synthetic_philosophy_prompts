  I'm about 60k words into a novel and I've hit the chapter thats going to make or break the thing: two logicians, ex-spouses, sharing a sleeper compartment on a train from Warsaw to Kyiv in the winter of 1994, and the whole middle of the chapter is them going at each other about dialetheism -- whether there are true contradictions, whether paraconsistent logic is a real option or a very elaborate way of changing the subject. I know what the tourist version of this fight looks like (he says the liar sentence is both true and false, she says that's just nonsense, repeat) and I dont want that. Write me the actual dialogue, eight to twelve exchanges, no stage business heavier than a shrug, both of them genuinely good at this and neither one a strawman. They have to answer each other's actual points, and I want them to earn it -- one of them should try an objection the other hasn't rehearsed, and the other should have a real answer, not a hand-wave.

  Anchor the whole thing on one case instead of floating around in the abstract. I've been using this: a border official in a country whose rules say (a) anyone born on the territory is a citizen, and (b) anyone whose parents are foreign nationals isn't, and then a kid shows up who satisfies both, and the official has to stamp something. I want the two of them to fight over what's really going on there -- is the law just defective, is the official's decision arbitrary, or is this a case where both answers are correct until someone rules -- and I want the classicist to try the other escape too, the one where the sentence is neither true nor false rather than both, and the dialetheist to press on why that doesn't get them out of the woods either. Also: the classicist should at some point make the strongest version of the objection that if 'not' means the ordinary thing, then 'both true and false' means nothing at all, and if it's some weaker 'not' invented for the occasion, then the dialetheist can't even say that anything is merely false -- and I don't want that answered with a shrug. I half-believe there's a real difference between a sentence being both and a sentence being neither, and I'd like one of them to force the other to say which of the two the border case is, and why it matters for the official standing at the desk; the other should resist being pinned down. No footnotes, no names of papers or famous people -- they're arguing on a train, not writing a review.

  What I care about most: by the end it should be clear whether the disagreement is substantive or whether they've been talking past each other, and I want the dialogue itself to settle that rather than a narrator telling me. Last line, once the dialogue is done: Verdict: followed by one short sentence saying which of them walked away with the stronger case and on exactly what point. If the honest answer is neither, say that.
