prompt: |-
  I am the evidence lead at a small development fund. Roughly twice a month our investment committee asks me to rule on whether a proposal's causal story about a country's poverty holds up, and the story is nearly always one of the familiar three: extractive institutions, geography and disease burden, or culture. What I cannot tell them is which of the three the committee is actually entitled to act on. The three are each other's confounders, and by the time an explanation reaches us it has usually been assembled backwards from the outcome. I have an afternoon, no budget for new data, and a committee containing two economists and a historian; the committee signs off.

  Please write a decision procedure I can run under those constraints, grounded in what the philosophy of causal inference from observational history actually settles — identification and the counterfactual, mechanism versus effect, explaining a level versus explaining a change, and the treatment of culture as whatever remains once the other two have been controlled. Give me the questions in the order I should ask them, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision back to the committee because the remaining question is one of values or risk tolerance. Then run it on two proposals: one attributing a slow-growth record to a colonial-era land tenure arrangement, and one attributing a region's thin industrialization to a disease environment. Include the case in which the procedure tells me to reject a story I find persuasive, and be explicit about what the procedure cannot do. No citations needed; I will add them.
reasoning: |-
  We are given two proposals to evaluate:

  Proposal 1: Attributing a slow-growth record to a colonial-era land tenure arrangement (extractive institutions).
  Proposal 2: Attributing a region's thin industrialization to a disease environment (geography and disease burden).

  We are to design a decision procedure that considers the three common explanations: extractive institutions, geography and disease burden, and culture. The procedure must be grounded in causal inference concepts: identification and counterfactual, mechanism vs effect, explaining a level vs change, and culture as the residual.

  The constraints: one afternoon, no new data, committee with two economists and a historian.

  The decision procedure:

  We will ask a sequence of questions. The goal is to determine whether the proposed causal story holds up and whether the committee can act on it. We stop and reject the story if any of the early questions are not satisfied. Later, we may hand the decision back to the committee when it comes to values or risk tolerance.

  Order of questions:

  1. **Question 1: Does the proposed cause pre-date the outcome?** 
     - *Why?* For causality, the cause must precede the effect. Also, we are often explaining a level (current poverty) by a historical cause. If the cause is not prior, then it cannot explain the outcome in the way proposed.
     - *Sufficient answer:* Yes, with evidence of the timing. For the land tenure case, we need the colonial arrangement to be in place before the period of slow growth. For the disease environment, we need evidence that the disease burden was present before the industrialization period we are examining.
     - *Stop if no:* Reject the story. If the cause came after the outcome, then it cannot be the cause.

  2. **Question 2: Is there a plausible mechanism?**
     - *Why?* We require a causal pathway that is theoretically sound and not just a correlation. The mechanism should be supported by existing literature or logical reasoning.
     - *Sufficient answer:* A clear step-by-step pathway from the cause to the outcome. For the land tenure: e.g., the arrangement led to underinvestment in agriculture, which then led to low productivity and slow growth. For disease: e.g., high disease burden reduced labor productivity and increased absenteeism, which discouraged industrial investment.
     - *Stop if no:* Reject the story. Without a mechanism, we have no causal story.

  3. **Question 3: Are there major confounders (especially the other two of the big three) that might explain both the cause and the outcome?**
     - *Why?* We must check if the proposed cause is not just a proxy for a deeper cause. For instance, disease burden might be correlated with geography (which is fixed) and also with institutions. We want to see if the cause stands when we condition on the others.
     - *Sufficient answer:* We need to argue that the proposed cause is not spuriously correlated due to a confounder. We can use existing studies or historical accounts that have tried to disentangle these factors. If the confounder is present, we must see if the proposed cause still has an independent effect.
     - *Stop if yes and not addressed:* If we find a major confounder that is not controlled for and that could explain the entire relationship, we reject the story. For example, if the land tenure system was introduced only in areas with a particular disease burden, and that disease burden is the real cause of slow growth, then we cannot attribute it to the land tenure without addressing the disease burden.

  4. **Question 4: Can we find evidence of change? (Explaining a change vs. a level)**
     - *Why?* It is often easier to establish causality when we see that a change in the cause leads to a change in the outcome. This helps rule out fixed factors (like geography) that might be responsible for the level but not the change.
     - *Sufficient answer:* If we can show that when the proposed cause changed (e.g., a reform of land tenure, or a reduction in disease burden due to medical advances) the outcome changed accordingly. Alternatively, if we are explaining a level, we must show that the cause has been consistently present and that without it the outcome would be different (counterfactual).
     - *Stop if no and the story is about change?* Not necessarily a stop, but if we are trying to explain a change and there is no change in the cause, then we reject the story. If we are explaining a level and there is no change evidence, we proceed but note the weakness.

  5. **Question 5: Is culture being used as a residual? And if so, can it be ruled out?**
     - *Why?* Culture is often the residual explanation when institutions and geography are controlled. We must ensure that the proposed cause is not actually a cultural trait in disguise, or that culture is not the primary driver.
     - *Sufficient answer:* We need to see that the proposed cause (institution or geography) is not merely a reflection of cultural attitudes. We can check if the cause is exogenous to culture (e.g., imposed by colonizers) and if the effect persists across different cultural groups. Alternatively, we can see if there are within-cultural-group variations that correlate with the cause and outcome.
     - *Stop if no:* If we cannot rule out culture as the primary driver and the proposed cause is just a proxy for culture, then we reject the story. But note: culture is hard to measure and often endogenous. We might not have data to rule it out. In that case, we note the limitation and proceed with caution.

  6. **Question 6: Is the proposed cause actionable by the committee?**
     - *Why?* Even if the causal story is true, if the committee cannot act on the cause, then the proposal is not useful.
     - *Sufficient answer:* The cause must be something that the fund can influence. For example, if the cause is a land tenure arrangement, then the fund might support land reform advocacy or pilot projects. If it's disease burden, the fund might support health interventions. But if the cause is fixed (like geography) then we must ask: can we mitigate the effect? For disease, we can, but for being landlocked, we cannot change geography but we can improve infrastructure.
     - *Hand back if no:* If the cause is not actionable, we hand back to the committee with a note that the causal story is valid but the fund cannot act. The committee must decide if they want to fund despite not addressing the root cause, or if they can address a consequence.

  7. **Question 7: What is the counterfactual?**
     - *Why?* We need to know what would happen in the absence of the intervention. The proposal should argue that by acting on the cause, the outcome will improve relative to the status quo.
     - *Sufficient answer:* A clear description of the expected change and why it would not have happened without the intervention. Also, consider unintended consequences.
     - *Hand back if uncertain:* If the counterfactual is highly uncertain (e.g., due to complex dynamics), then we note the risks and hand back to the committee for a decision based on risk tolerance.

  8. **Question 8: Are there strong reasons to believe that acting on the cause will lead to the desired effect?**
     - *Why?* Even if the cause is true and actionable, the intervention might not work due to other barriers.
     - *Sufficient answer:* Evidence from similar contexts or a strong theoretical reason why the intervention will break the causal chain.
     - *Hand back if weak:* If the evidence is weak, we note the uncertainty and hand back to the committee for a risk-based decision.

  Now, run the procedure on the two proposals.

  ---

  **Proposal 1: Attributing slow-growth record to colonial-era land tenure arrangement (extractive institutions)**

  1. **Does the cause pre-date the outcome?** 
     - Yes, the colonial-era land tenure arrangement is historical and pre-dates the current period of slow growth.

  2. **Is there a plausible mechanism?**
     - Yes: The extractive institutions (land tenure) led to concentrated land ownership, which discouraged investment in agriculture, leading to low productivity and slow growth.

  3. **Are there major confounders?**
     - Check geography and disease: Could the same areas with the land tenure system also have had a high disease burden? Or a geography that made agriculture difficult? We must look for evidence. If the land tenure was imposed in areas that were already poor due to geography, then geography is a confounder. We need to see if the effect holds when comparing areas with similar geography but different institutions. If we don't have that evidence and cannot rule out geography, then we might reject. But if we have historical studies (like Acemoglu, Johnson, and Robinson) that show institutions matter even controlling for geography, then we can proceed.

     *Assume we find that the land tenure was imposed arbitrarily (e.g., by colonial powers) and we can compare regions with similar geography but different institutions. Then we can say the confounders are addressed. If not, we might reject.*

     *In this case, let's assume we have evidence that the land tenure was imposed and not correlated with geography. Then we proceed.*

  4. **Evidence of change?**
     - We can look for reforms: if a region reformed the land tenure and saw growth, that would support. Alternatively, we can compare regions with and without the tenure. If we are explaining the level of growth, we can note that the institution has been persistent. But without change, it's harder to prove causality. However, we can rely on cross-sectional evidence (e.g., regions with the tenure have lower growth than those without, controlling for other factors). 

     *Assume we have cross-sectional evidence but no time-series variation. We note the weakness but proceed because we have the mechanism and timing.*

  5. **Culture as residual?**
     - Could the land tenure arrangement be a reflection of cultural attitudes? We need to check: was the institution imposed by an external force (colonizers) or was it endogenous to the culture? If imposed, then it might be exogenous. We can also see if the same cultural group in a different country (without the institution) has different outcomes.

     *Assume we argue that the colonial institution was imposed and not chosen, so it's not a reflection of local culture. Then we rule out culture as the primary driver.*

  6. **Actionable?**
     - Yes: The fund can support land reform, land titling, or agricultural investment to overcome the institutional barrier.

  7. **Counterfactual?**
     - Without intervention, the land tenure system will persist and growth will remain slow. With intervention, we expect improved incentives and growth. But we must consider risks: reform might be resisted, and there could be unintended consequences (e.g., conflict).

  8. **Will acting lead to the desired effect?**
     - Evidence from other land reforms (e.g., in Asia) shows positive effects. But context matters. We might have some evidence, but there is uncertainty.

     *We have a good causal story and it is actionable. We then hand back to the committee for the final decision because of the risks involved (step 7 and 8).*

  **Conclusion for Proposal 1**: The causal story holds. We hand back to the committee with a note that the intervention is supported by the causal evidence but carries risks. The committee must decide based on their risk tolerance.

  ---

  **Proposal 2: Attributing a region's thin industrialization to a disease environment**

  1. **Does the cause pre-date the outcome?**
     - Yes, the disease environment (e.g., malaria) has been present for a long time, before the industrialization period.

  2. **Plausible mechanism?**
     - Yes: High disease burden reduces worker productivity and increases absenteeism, making industrial investment less attractive. Also, high child mortality might lead to high fertility and less investment in human capital, which is needed for industry.

  3. **Confounders?**
     - Geography: The disease environment is often linked to geography (e.g., tropical climate). But geography also directly affects agriculture and trade, which could influence industrialization. We must check if the disease effect is separable from geography. Institutions: Areas with high disease burden might have developed extractive institutions (as argued by Acemoglu et al.) because colonizers did not settle there. So, the thin industrialization might be due to institutions, not disease.

     *We need to see if the effect of disease remains when controlling for institutions. If we have evidence that the disease burden affects industrialization even in places with good institutions, then we proceed. If not, and if the disease burden is correlated with weak institutions, then we might be attributing to disease what is really due to institutions.*

     *Assume we find that the disease burden is high and the institutions are weak. Without evidence that disease has an independent effect (e.g., from a natural experiment like the eradication of malaria in some areas leading to industrialization), we might reject. But if we have such evidence, we proceed.*

     *In this case, let's assume we do not have a way to disentangle disease and institutions. We find that the areas with high disease burden also have extractive institutions. Then we stop and reject the story because the confounder (institutions) is not controlled.*

     **Stop and reject Proposal 2** because we cannot rule out that the real cause is institutions.

     *But note: What if we have a natural experiment? For example, the Rockefeller Foundation's malaria eradication program in some regions led to economic gains. If we have such evidence for this region, we might proceed. Let's consider an alternative scenario:*

     *Alternative: We have evidence that in this region, when malaria was reduced (by an external program), industrialization increased, and this happened regardless of the institutions. Then we proceed to the next steps.*

     *But the problem states: "the story is nearly always one of the familiar three" and they are confounded. Without new data, we might not have such evidence. So it's likely we reject.*

     *However, for the exercise, let's assume we found a study showing that disease burden has an independent effect. Then we continue.*

  4. **Evidence of change?**
     - We can look at changes in disease burden (e.g., due to public health interventions) and see if industrialization followed. If we have such evidence, that's strong. Otherwise, we rely on cross-sectional comparisons.

  5. **Culture as residual?**
     - We need to rule out that the disease burden has led to cultural adaptations (e.g., low savings because of high mortality) that are the real barrier. But if we can show that when disease is reduced, behavior changes, then we can rule out culture as fixed.

  6. **Actionable?**
     - Yes: The fund can support disease control programs.

  7. **Counterfactual?**
     - Without intervention, disease burden remains and industrialization lags. With intervention, we expect a healthier workforce and more investment.

  8. **Will acting lead to the desired effect?**
     - Evidence from disease eradication programs (e.g., malaria eradication in some countries) shows economic gains. But the effect on industrialization specifically might be indirect and take time.

     *We hand back to the committee with a note about the evidence and risks.*

     **But note: we stopped at step 3 in the initial scenario because of confounders. So in that case, we reject.**

  ---

  **Case where we reject a story we find persuasive**

  Suppose we have a proposal that attributes poverty to a cultural trait (say, lack of entrepreneurial spirit). But our procedure requires that we consider culture as the residual. So:

  1. **Pre-date?** Yes, the cultural trait is historical.

  2. **Mechanism?** Plausible: if people don't value entrepreneurship, they won't start businesses.

  3. **Confounders?** This is key: is the cultural trait independent of institutions and geography? Or is it shaped by them? For example, extractive institutions might have crushed entrepreneurial spirit. If so, then the real cause is institutions. Without controlling for institutions and geography, we cannot attribute to culture. 

     *We might personally find the cultural story persuasive (e.g., based on anecdotes), but if we cannot rule out that the culture is a product of institutions, then we must stop and reject the story at step 3.*

  **What the procedure cannot do:**

  - It cannot prove causality definitively with observational data.
  - It cannot create new data; it relies on existing evidence.
  - It cannot account for complex interactions between the three causes without more advanced methods (which require more data and time).
  - It cannot eliminate all uncertainty, especially about the counterfactual.
  - It might be too rigid and reject a true story because of lack of evidence (type II error) or accept a false one because of available evidence (type I error).

  **Final Decision Procedure Flow:**

  1. Pre-date? (No → Reject)
  2. Mechanism? (No → Reject)
  3. Confounders? (Major confounder not addressed → Reject; else proceed)
  4. Evidence of change? (If explaining change and no change → Reject; else proceed, but note weakness)
  5. Culture as residual? (Cannot rule out → Reject; else proceed)
  6. Actionable? (No → Hand back to committee with note: "Causal story holds but not actionable")
  7. Counterfactual? (Uncertain → Hand back with note about risk)
  8. Will acting work? (Uncertain → Hand back with note about risk)

  If we pass all 1-5, then 6-8 are about actionability and risk, which we hand back to the committee.

  For Proposal 1: Passes 1-5, then 6-8: actionable, but risks in counterfactual and effectiveness → hand back.

  For Proposal 2: We rejected at step 3 (confounders) → reject.

  But note: in the alternative scenario for Proposal 2 (with evidence of independent effect), we would have passed 1-5 and then 6-8 → hand back.
answer: |-
  Below is a decision procedure designed for your constraints, grounded in causal inference principles from observational history. It prioritizes **identification** (isolating the cause from confounders), **counterfactual reasoning** (what would happen in the absence of the cause), **mechanism vs. effect** (distinguishing between causal pathways and outcomes), **levels vs. changes** (static conditions vs. dynamic shifts), and **culture as the residual** (only invoked when institutions/geography are ruled out). The procedure uses your existing knowledge and committee expertise, requiring no new data. It stops early if the story fails basic causal criteria, and hands back to the committee when values/risk tolerance dominate.

  ---

  ### **Decision Procedure: Questions in Order**
  1. **Did the proposed cause precede the outcome, and is timing plausible?**  
     - *Why?* Causality requires the cause to come before the effect. Proposals assembled backward often misalign timing.  
     - *Sufficient answer:* Clear evidence (e.g., historical records, data) that the cause (e.g., land tenure system) existed before the outcome (e.g., slow growth).  
     - *Stop if no:* Reject the story. Example: If land tenure reforms occurred *after* slow growth began.  

  2. **Is there a coherent mechanism linking cause to outcome?**  
     - *Why?* Proxies (e.g., "extractive institutions") often lack specificity. Mechanisms must be testable.  
     - *Sufficient answer:* A step-by-step pathway (e.g., "land tenure → disincentivized investment → low agricultural productivity → slow growth").  
     - *Stop if no:* Reject the story. Example: Vague claims like "disease burden caused thin industrialization" without explaining *how*.  

  3. **Can we rule out geography/disease and institutions as confounders?**  
     - *Why?* The "big three" confound each other. Geography often enables extractive institutions; disease shapes culture.  
     - *Sufficient answer:* Evidence that:  
       - The cause operates independently (e.g., land tenure varies *within* similar geographies).  
       - No overlap with other factors (e.g., disease burden isn’t worse where land tenure is extractive).  
     - *Stop if no:* Reject the story. Example: If disease-prone areas also have extractive institutions, you can’t isolate either.  

  4. **Does the story explain a *change* or merely a *level*?**  
     - *Why?* Explaining levels (e.g., "country is poor") risks cherry-picking; changes (e.g., "growth slowed after colonial policy") strengthen causality.  
     - *Sufficient answer:*  
       - For **changes**: Evidence of parallel trends (e.g., growth dipped after land tenure imposed, but not in similar regions without it).  
       - For **levels**: Counterfactual reasoning (e.g., "Without this disease, industrialization *would* have occurred").  
     - *Stop if no (for changes):* Reject if the story hinges on dynamics but lacks change evidence.  
     - *Proceed for levels:* But flag as weaker evidence.  

  5. **Is culture the residual, and if so, is it falsifiable?**  
     - *Why?* Culture is the default when institutions/geography fail. It must be defined independently (e.g., specific norms, not just "values").  
     - *Sufficient answer:*  
       - Culture is invoked **only after** institutions/geography are controlled.  
       - Evidence that cultural traits (e.g., "low trust") exist and directly affect the outcome.  
     - *Stop if no:* Reject if culture is used as a catch-all without evidence (e.g., "cultural aversion to industry").  

  6. **Is the cause actionable by the fund?**  
     - *Why?* Even true causes may be immutable (e.g., geography) or require politically infeasible interventions.  
     - *Sufficient answer:* A feasible lever (e.g., "fund land-titling programs to counter extractive tenure").  
     - *Hand back if no:* Committee decides based on values/risk tolerance. Example: Acting on disease may require costly health infrastructure.  

  7. **What is the counterfactual if we intervene?**  
     - *Why?* Projects often ignore unintended consequences or equilibrium effects.  
     - *Sufficient answer:* A plausible alternative future (e.g., "Land reform will raise investment, but may trigger elite backlash").  
     - *Hand back if uncertain:* Committee weighs risks (e.g., "Is backlash tolerance acceptable?").  

  ---

  ### **Procedure Applied to Two Proposals**
  **Proposal 1: Slow growth due to colonial-era land tenure (extractive institutions)**  
  1. **Timing:** ✓ Cause (colonial tenure) precedes outcome (slow growth).  
  2. **Mechanism:** ✓ "Rigid tenure → elites hoard land → farmers lack incentives → low productivity → slow growth."  
  3. **Confounders:** ⚠️ *Test:* Did geography/disease enable this tenure? If tenure exists in fertile *and* arid regions, geography is ruled out. If disease burden is uniform, it’s ruled out. *If tenure correlates with fertile land (geography), reject.*  
  4. **Change vs. Level:** ✓ If growth slowed *after* tenure imposed, stronger. If only explaining "current poverty," weaker but proceed.  
  5. **Culture:** ✓ Not invoked. If added, ensure it’s residual (e.g., "land norms persist post-colonialism").  
  6. **Actionable:** ✓ Fund could support land-titling programs.  
  7. **Counterfactual:** ⚠️ Reform may spark conflict. *Hand back to committee:* "Story holds, but is political risk acceptable?"  
     - **Verdict:** Hand back after Q7.  

  **Proposal 2: Thin industrialization due to disease environment (geography)**  
  1. **Timing:** ✓ Disease burden pre-dates industrialization phase.  
  2. **Mechanism:** ⚠️ "Disease → high worker mortality → low factory productivity → thin industrialization." *But is worker mortality the primary barrier?* If no factory data, mechanism is weak.  
  3. **Confounders:** ⚠️ *Critical test:* Do areas with similar disease have different industrialization? If extractive institutions or culture (e.g., labor norms) co-occur, reject. *Example:* Malaria zones may also have weak property rights (institutions) or fatalistic beliefs (culture).  
     - **Stop and reject:** Confounding likely. Disease alone rarely suffices; institutions usually mediate.  
     - *If you find it persuasive:* The procedure forces rejection here because observational history shows geography acts through institutions. Override only with ironclad evidence (e.g., a natural experiment like a disease-eradication campaign that boosted industry).  

  ---

  ### **Explicit Limitations of the Procedure**  
  - **Cannot prove causality:** Only assesses plausibility given observational data.  
  - **Cannot resolve deep confounders:** E.g., if all three factors (institutions/geography/culture) are intertwined, isolation fails.  
  - **Biased by historical narratives:** Backward-assembled stories may pass if confounders are overlooked.  
  - **No quantification:** Does not measure effect sizes (e.g., "how much did land tenure *contribute*?").  
  - **Risk-blind:** Flags actionability but doesn’t evaluate cost-benefit tradeoffs.  

  ---

  ### **When to Stop vs. Hand Back**  
  - **Stop and reject:** If Q1–Q5 fail (e.g., timing invalid, mechanism absent, confounders uncontrolled, culture unfalsifiable).  
  - **Hand back to committee:** After Q6–Q7 if:  
    - Cause is actionable but counterfactuals are risky (Q7).  
    - Cause is inactionable but the fund accepts second-best interventions (Q6).  
    - Values dominate (e.g., "Should we challenge elites despite risks?").  

  This procedure ensures causal rigor within your constraints while clarifying where committee judgment is needed. Use the economists to pressure-test confounders and mechanisms, and the historian to validate timing and narratives.
