prompt: |-
  I run a small philosophy meetup in my garage — we're not academics, just people who like to argue alot — and next month it's my turn to set the topic and hand out the questions. The topic is whether time is really all there already, past and future included, like a movie that's already been filmed and we're just watching our bit of it. What I want to put in front of everyone is an argument my friend Dana keeps making: special relativity says simultaneity is relative, so if a planet is zipping past us fast enough, some day that is still in my future is already somebody's Tuesday over there — already happening, already real. And you can't say something is real over there and not real here. So my future is already real too. Nobody in the group can tell me where the trick is and I'm pretty sure there is one.

  Write me one essay question for the group that makes them find the exact step in Dana's argument that has to hold for it to go through, and then say whether the conclusion survives if you drop that step. If you can, also make the question force them to say what happens when someone moving the other direction runs the very same argument — does it still work, and does that tell us anything. I don't want answers that just recite "relativity makes simultaneity relative, therefore the future is real."

  Then give me a model answer of around 500 words, and a marking scheme out of 20 that tells me how to tell apart the answers that actually see whats going on from the ones that are just repeating the label — the specific moves a top answer has to make, and the specific mistakes that should cost points.
