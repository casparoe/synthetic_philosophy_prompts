  Here’s a structured set of 10 questions designed to build logically, challenge key ideas, and keep the conversation grounded—with targeted follow-ups for your three priority areas. I’ve framed them conversationally but precisely to avoid softness while respecting the literary festival context.

  ### Core Sequence:
  1. **Opening Hook (Karoshi Case Study):**  
     "Your paper argues that in *karoshi* cases, the real scandal isn’t the death itself, but the workplace structure that made refusal impossible. Is this a uniquely Japanese phenomenon tied to cultural work norms, or is it inherent to employer-employee power dynamics under any wage labor system?"  
     *Likely Answer:* She’ll argue it’s systemic to wage labor.  
     **Follow-up:** "If it’s structural, why do we see such stark variation in *karoshi* rates across similar economies? Does that variation undermine the ‘inescapable domination’ thesis, or just prove some societies mitigate it better?"  

  2. **The Distributive Justice Challenge:**  
     "Many critics of overwork focus on unfair compensation—the ‘pie’ being misallocated. Why isn’t redistributing that pie sufficient? Why do we need a *non-distributive* theory grounded in domination and exit power?"  
     *Likely Answer:* She’ll stress that fair pay doesn’t dismantle employer control over time/life.  
     **Follow-up:** "But if workers had shorter hours *and* fair pay through collective bargaining, wouldn’t that achieve your goals without state-centric solutions like a job guarantee? What does the ‘domination’ lens add that bargaining power alone can’t fix?"  

  3. **Job Guarantee & State Dependence:**  
     "You propose portable benefits and a federal job guarantee to enable reduced hours without losing security. But doesn’t tying healthcare/pensions to state-backed work just replace dependence on an employer with dependence on the state? How is that *less* arbitrary?"  
     *Likely Answer:* She’ll distinguish democratic accountability (state) from private power (employers).  
     **Follow-up:** "If a future illiberal government weaponizes the job guarantee—e.g., ‘reduce hours and we reassign you to undesirable work’—doesn’t this recreate the vulnerability to arbitrary power you’re trying to solve?"  

  4. **The 35-Hour Week Trap:**  
     "You call the 35-hour week a ‘trap’ for fixing hours while ignoring dependence. But isn’t it a foothold for reclaiming time? Or is there evidence that it actually *reinforces* employer control by making ‘compliance’ with rigid schedules the baseline?"  

  5. **Leisure as Civic Foundation:**  
     "When you say leisure enables us to ‘be citizens, not just workers,’ are you implying overwork is a crisis for democracy itself? Can you give a concrete example of how reclaimed time translates into civic action that wouldn’t otherwise occur?"  

  6. **Falsifiability Test:**  
     "What evidence would falsify or weaken your domination-based theory? For instance, if data showed affluent knowledge workers *choosing* 60-hour weeks for fulfillment, does that challenge the ‘arbitrary power’ claim, or just prove privilege alters the dynamic?"  

  7. **Productivity Ethic vs. Protestant Ethic:**  
     "You argue the ‘productivity ethic’ is the secular heir to the Protestant work ethic—same moralizing of time, ‘different god.’ But is this a distinct thesis, or just Weber 2.0? Does stripping the theology *change* the social function of work morality, or just its packaging?"  

  8. **The "Right to Reduce" in Practice:**  
     "Portable benefits sound elegant, but how do they handle real-world complexities? E.g., if a single parent reduces hours in a high-cost city, wouldn’t portable benefits still leave them economically stranded without wage supplements? Is this a full solution or half the puzzle?"  

  9. **Corporate Counterargument:**  
     "Critics might say your framework ignores mutual benefit—that employers invest in workers’ skills, and flexibility already exists in knowledge economies. How do you answer the charge that your theory describes a 20th-century factory model, not today’s economy?"  

  10. **Closing: Writer’s Perspective (Leverage Your Role):**  
      "As a novelist, I’m struck by how your ideas resonate with the *emotional* arc of quitting a dehumanizing job. But fiction thrives on ambivalence. Is there a risk your theory overlooks how work can also provide meaning, community, or identity—things leisure alone might not replace?"  

  ### Why This Works:
  - **Builds Intellectually:** Starts with concrete cases (karoshi) → probes theoretical foundations (distributive vs. non-distributive) → tests solutions (job guarantee) → examines historical roots (work ethic) → ends with human stakes.  
  - **Pre-empts Flat-Footedness:** Follow-ups target predictable rebuttals (e.g., "But collective bargaining!" / "State dependence!") forcing deeper engagement.  
  - **Avoids Library Talk:** Questions reference her framework without requiring niche texts. The job guarantee/Weber follow-ups are implied by her own logic.  
  - **Sharp but Accessible:** No jargon dumps; terms like "domination," "portable benefits," and "productivity ethic" are her own vocabulary, used precisely.  
  - **Writerly Hook:** Final question ties her theory to storytelling, honoring your role while keeping critique alive.  

  **Pro Tip:** If she gives an unexpected answer to key questions, pivot with: "Help me square that with your earlier point about [contradictory idea]—is there a tension here?" Shows active listening while maintaining pressure.
