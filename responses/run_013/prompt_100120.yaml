  Hmm, the core confusion seems to be equating hinges with traditional foundations. The user's phrasing ("absolute foundation," "most certain beliefs") reveals they're interpreting Wittgenstein through a Cartesian lens. That's understandable—Moore's propositions do sound foundationalist at first glance. But the comparison feels off... Wittgenstein explicitly rejected justification-based epistemology. 

