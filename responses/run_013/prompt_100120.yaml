prompt: |-
  Ok so I think I've got the gist of On Certainty: doubting and justifying have to come to an end somewhere, and what they come to rest on are the hinges — the sort of stuff Moore said he knew, like that he had two hands, that the world around him was really there and not just a dream. So here's my question. If hinges are the propositions that can't be doubted and that hold the whole system of our knowledge together, aren't they just the absolute foundation — the most certain, most basic beliefs, the ones that justify everything else? Which would mean Wittgenstein basically rebuilt Descartes's foundatonalism and just swapped clear and distinct ideas for hinges. And then the practical side of it: how am I supposed to work out which propositions are the genuine hinges for me, so I can make sure my own beliefs are resting on the right foundation and not on something wobly?

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, and don't restate my question.
reasoning: |-
