prompt: |-
  I have been arguing about this with two friends all term — one a programmer whose side projects keep getting cloned, the other a lawyer who thinks the very idea of owning an idea is a category mistake — and I have finally written down where my gut lands on a pile of cases, in the hope that you can tell me what principle, if any, they add up to. Two mathematicians prove the same theorem in the same year; the one who publishes second, having never seen the first paper, still deserves full credit for it, and saying so takes nothing away from the first. A comedian retells a rival's joke with a two-word change and no nod to the source: that is theft, even though nobody supposes comedians own jokes. A chef recreates a rival restaurant's signature dish: fine, and I feel no tug at all, though I notice it is the same move as the comedian's. A firm isolates the active compound from a plant that a community has used medicinally for generations and patents it: the patent is an injustice, yet if the same firm engineers a new molecule merely inspired by that compound, the patent is fine. A student drops a paragraph from a published paper into her draft without a citation: not fine. A company buys a rival's unpatented device, takes it apart, and sells a cheaper copy: fine, and again this is the chef's move. Someone describes a startup idea to a friend over drinks; the friend builds it: not fine, and this one strikes me as worse than the joke, even though less seems to have been taken. Fan fiction posted for free: fine. The same fan fiction sold as a paperback: I want to say not fine, but I cannot get that verdict to sit still next to the chef. Reimplementing an algorithm from a published paper without asking: fine. Copying a decade of someone's painstakingly assembled factual database: not fine, though I cannot say what is owned there, since no individual fact in it belongs to anyone.

  The tentative line I have been defending is that you have a claim on an idea just in case you are the one who made it costly for others to have — the labour view, the sweat-of-the-brow idea — but that plainly gets the joke, the friend's startup, and the reverse-engineered device wrong, and in different directions. So perhaps there are two principles rather than one: one governing who gets credit, another governing who may use. If so, say which of my cases fall under which, and what fixes the boundary between them.

  I would also like to know what your principle, or principles, predict about a case I cannot place at all: a large model trained on a living author's published novels which then writes a novel in her manner and sells it, where nothing is copied sentence by sentence and no reader is misled about who wrote it. And if the honest answer is that no single principle saves all of the verdicts above, tell me which verdicts I should abandon rather than which clause to bolt on. Keep the whole reply under 700 words, and lead with the principle or principles in two or three sentences before you go case by case.
reasoning: |-
  Okay, let me try to unpack this user's query. They've been debating intellectual property concepts with friends—a programmer and a lawyer—and listed various scenarios to find an underlying principle. The core question seems to be about when credit or usage rights are deserved. 

  First, I notice the user's initial "sweat of the brow" theory fails for cases like jokes or reverse engineering. That suggests we need multiple principles. The credit/use distinction feels right: credit for discovery (math theorem), use restrictions for exclusive creations (patents, trade secrets). 

  Looking at their cases: 
  - Independent math proofs both deserve credit (discovery), but copying jokes is unethical use despite no ownership. 
  - Chef reverse-engineering a dish is fine because recipes aren't protected, unlike patented molecules. 
  - The database copy feels wrong because of labor investment, but facts aren't ownable—here, unfair competition might apply rather than IP. 

  The AI-generated novel case is tricky. It's transformative but potentially devalues the author's style, which isn't legally protected. Morally, attribution might matter, but legally it's gray. 

  The user might need to adjust verdicts on the database (no inherent ownership) and fan fiction sales (could fall under fair use). Consistency matters more than saving every intuition. 

  Ultimately, separating credit (moral) from exclusive use (legal/economic) resolves most tensions. The unresolved cases highlight where ethics and law diverge.
answer: |-
  Here’s a unified framework distilled from your intuitions, followed by case analysis:

  ### Core Principles  
  1. **Credit Principle**: Recognition is owed for *discovery* or *original creation*, especially when effort reveals non-obvious truths/expressions. Independent creation absolves obligation.  
  2. **Use Principle**: Exclusive control over *implementation* requires either (a) formal protection (patents/copyrights), (b) ethical constraints against deception/parasitism, or (c) breach of trust/confidentiality.  

  ### Case Breakdown  
  | **Case**                          | **Principle Applied**                                                                 | **Verdict**       |  
  |-----------------------------------|---------------------------------------------------------------------------------------|-------------------|  
  | Mathematician publishes second    | Credit: Independent discovery warrants full credit                                   | Fine              |  
  | Comedian steals joke              | Use: Parasitic appropriation without transformation or credit                         | Theft             |  
  | Chef copies dish                  | Use: No protection for recipes; reverse-engineering allowed                           | Fine              |  
  | Firm patents plant compound       | Use: Extraction ≠ invention; system precludes patenting traditional knowledge         | Injustice         |  
  | Firm patents novel molecule       | Use: Genuine invention, even if inspired                                              | Fine              |  
  | Student plagiarizes paragraph     | Use: Copyright violation + failure to credit                                          | Not Fine          |  
  | Company clones unpatented device  | Use: Reverse-engineering unprotected functional items is permissible                  | Fine              |  
  | Friend steals startup idea        | Use: Breach of implicit trust/confidentiality in informal disclosure                 | Not Fine (Worse)  |  
  | Free fan fiction                  | Use: Non-commercial transformative use; credit implied                                | Fine              |  
  | Sold fan fiction                  | Use: Commercial derivative work; copyright infringement unless parodic               | **Revise to Fine**|  
  | Reimplement algorithm from paper  | Credit: Paper’s purpose is dissemination; method unprotected without patents          | Fine              |  
  | Copy factual database             | Credit/Use: Labor creates *compilation* rights; misappropriation of effort            | Not Fine          |  

  ### Boundary Fix  
  - **Credit** applies to *attribution* for discoveries/creations.  
  - **Use** governs *exploitation*, bounded by law (patents/copyright), ethics (anti-parasitism), or trust (confidentiality).  
  - **Key test**: Does use reduce incentive/opportunity of the originator *unfairly*?  

  ### AI-Generated Novel Case  
  - **Credit**: Owed to the author for stylistic creation.  
  - **Use**: Commercial training/output likely violates **ethical use** (parasitism on style without transformation) and potentially **copyright** (derivative work). Verdict: *Not Fine*, as it appropriates the economic/commercial essence of the author’s labor.  

  ### Verdicts to Abandon  
  1. **Sold Fan Fiction**: If chef’s dish-copying is fine, sold fan fiction should be too—unless parody. Copyright law permits neither, but your ethic inconsistently excuses one. Align: both either *fine* (if non-deceptive) or *not fine*.  
  2. **Database Copy**: Facts aren’t owned, but compilation effort merits *limited protection* against duplication (via unfair competition law). Your "not fine" stands, but clarify: it’s *use* misappropriation, not idea-ownership.  

  ### Summary  
  Your intuitions split credit (moral) from exploitative use (legal/ethical). Abandon the database-as-owned-idea tension; protect the labor against free-riding, not the facts. For fan fiction, pick consistency: either accept commercialization like the chef, or reject both.
