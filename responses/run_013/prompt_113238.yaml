  - **Reporter’s role:** His presence feels organic—local press covering a town issue. His error stems from assuming votes are independent, a common real-world fallacy.  

  In the author's note, I’ll flag the cascade’s stability as the weakest point: real cascades often break with contrarian evidence, but group cohesion here (small town, sunk costs) may sustain it. Mara’s conflict is intentionally unresolved—the user wants epistemic tension, not heroism.  

  Final adjustments:  
  - Trim dialogue to avoid moralizing.  
