prompt: |-
  I am a retired experimental physicist who has spent the past several years reading philosophy in a more or less systematic way, and my reading has collided with an unanticipated duty: I chair the allocation committee of a modest private foundation, which commits its funds in stages and revisits earlier commitments as results come in. Several of my fellow trustees have taken up the money-pump argument as a reason to fix our preferences once and never reopen a decision, and while I find the argument powerful in the abstract, I cannot tell from it which of our actual inconsistencies expose us to a pump and which are merely embarrassing on a page. I would like you to convert the argument into something we can use.

  Write a decision procedure that the committee can run, in the order it should be run, to determine whether a proposed policy — our own, or one a grantee has submitted — is vulnerable to a money pump. It must be executable by people with no formal training in decision theory: specify what to elicit, what to check or compute, what counts as a sufficient answer at each step, where the procedure returns a definite no, and where it must stop and hand the question to a person because the issue is one of values or of unquantifiable judgment. Build the procedure on the argument itself rather than on the slogan, and be candid about the places where the argument is weaker than its reputation. In particular, I want the procedure to distinguish exploitability as a fact about what a sufficiently clever counterparty could do from exploitability as a genuine failure of rationality, and to separate the chooser who can escape by foreseeing the whole sequence, or by adopting a commitment device, from the chooser who cannot. Because our decisions recur over time and each is defensible at the moment it is made, the diachronic version of the problem concerns me far more than the one-shot version; the procedure should make clear when a cycle does its damage on its own and when it does damage only through the trades we would have to accept. Mark the steps that are judgment dressed up as procedure, and — since I remain a scientist at heart — state, for each verdict, what observation or argument would overturn it.

  Then run the procedure on three cases. First, a counterparty who, at each of our quarterly meetings, offers to convert our position in one funding vehicle into another for a small administrative fee, where our committee's revealed preferences among the three vehicles run in a cycle. Second, a choice over an uncertain prospect that we resolve in two sittings rather than one, where our preferences exhibit the pattern behind the Allais example, which violates the independence condition, so that the two-stage presentation and the one-stage presentation can pull us apart. Third, our own standing policy of never reopening a commitment once made. At least one of the verdicts should be one I will not like — if the procedure says that a policy we consider prudent is in fact pumpable, or that the argument does not license the rigidity we have adopted, say so plainly. Finish by stating what the procedure cannot settle, who on the committee must sign off on each step, and how long the whole exercise should take, given that we meet quarterly, decide amounts that are modest but not trivial, and cannot consult a specialist.
reasoning: |-
  We are going to design a decision procedure to test for vulnerability to a money pump. The money pump argument typically applies when an agent has cyclic preferences (intransitive) or violates independence (as in Allais) and thus can be exploited by a series of trades or choices that leave the agent worse off.

  The procedure must be executable by non-specialists. We break it down into steps, each with clear instructions. We also note where judgment is required and what observations would overturn a verdict.

  ### The Decision Procedure: Testing for Vulnerability to a Money Pump

  **Objective:** Determine if a set of preferences, as revealed by choices (or stated in a policy), can be exploited by a counterparty to extract money (or value) in a series of transactions.

  **Inputs:** 
  - A set of alternatives (e.g., funding vehicles, prospects, policies) and the committee's preferences over these alternatives, either stated or revealed by past choices.
  - The context: whether the choices are made in a one-shot or repeated (diachronic) setting, and whether there are opportunities for a counterparty to offer trades.

  **Outputs:** 
  - **Vulnerable (Definite Yes):** The preferences are pumpable, meaning a counterparty can design a sequence of trades that leaves the committee worse off (paying money or fees) and the counterparty better off, and the committee cannot avoid this by foreseeing or committing.
  - **Not Vulnerable (Definite No):** The preferences are not pumpable, either because they are consistent with expected utility (or transitive in a deterministic setting) or because the committee can avoid the pump by foresight or commitment.
  - **Inconclusive (Requires Judgment):** The argument is weak or the situation is such that the money pump threat is not credible, or the inconsistency is not exploitable in practice.

  **Procedure Steps:**

  1. **Define the Set of Alternatives and Preferences:**
     - List the alternatives (A, B, C, ...) under consideration.
     - Elicit the committee's preferences over these alternatives. This can be done by pairwise comparisons or by having the committee rank the alternatives. If the preferences are revealed by past choices, note the choices that have been made.
     - *Check for cycles in pairwise preferences*: If A is preferred to B, B to C, and C to A, then there is a cycle. If no cycle, go to step 2. If a cycle is found, proceed to step 3.
     - *Sufficient answer*: A cycle is present or not.
     - *Overturned by*: New evidence that the revealed preferences were mistaken (e.g., due to a one-time constraint) or that the preferences are actually transitive.

  2. **Check for Independence Violations (for uncertain prospects):**
     - If the choices involve uncertainty, present the same prospect in two different ways: one as a single-stage decision and another as a two-stage decision (like Allais). 
     - Elicit preferences in both presentations. If the preferences differ, then independence is violated.
     - *Sufficient answer*: The preferences are the same (no violation) or different (violation).
     - *Overturned by*: Re-evaluation showing that the two presentations are not equivalent in the eyes of the committee (e.g., due to ambiguity in probabilities) or that the initial response was an error.

  3. **Assess Exploitability in Principle:**
     - *If a cycle was found (step 1):*
       - Consider a sequence starting with the committee holding alternative A. A counterparty offers a trade: pay a small fee to switch from A to C (since C is preferred to A). Then, from C to B (if B is preferred to C) and then from B back to A (if A is preferred to B). The committee ends with A but has paid fees three times.
       - *Check if the committee would accept each trade in isolation*. If yes, then in principle they are vulnerable.
     - *If an independence violation was found (step 2):*
       - The counterparty might structure a series of trades that exploit the violation. For example, in the Allais paradox, the inconsistency between the two presentations can be used to pump money by having the agent buy and sell lotteries in a way that leaves them with a sure loss.
     - *Sufficient answer*: If the committee would accept each trade in the sequence when offered one by one (without considering the whole sequence), then they are vulnerable in principle. If they would reject any trade, then they are not vulnerable via that cycle.
     - *Overturned by*: Evidence that the committee would not actually make the trades (e.g., due to transaction costs or learning) or that the trades are not available.

  4. **Assess Foresight and Commitment:**
     - *If vulnerable in principle (from step 3), check if the committee can avoid the pump by:*
       - **Foresight:** Recognizing the entire sequence of trades and refusing the first trade. In this case, the vulnerability is theoretical but not practical if the committee is sophisticated.
       - **Commitment:** Using a pre-commitment device (e.g., a binding policy) to refuse any such trades.
     - *Judgment step*: The committee must decide if they are capable of such foresight or if a commitment device is available and credible.
     - *Sufficient answer*: If the committee can avoid by foresight or commitment, then the vulnerability is blocked. Otherwise, they are practically vulnerable.
     - *Overturned by*: Evidence that the committee cannot effectively commit or that they are myopic (i.e., they cannot resist the immediate trade even when they know the whole sequence).

  5. **Diachronic vs. One-Shot Considerations:**
     - In a diachronic setting (multiple meetings), the committee must consider whether the counterparty can exploit the cycle over time. The procedure must note that the damage is done by the cumulative fees.
     - *Judgment step*: The committee must assess if the counterparty is present and would offer such trades. If not, then the cycle might be merely embarrassing but not exploitable.

  6. **Verdict:**
     - **Definite No (Not Vulnerable):** 
       - If no cycle (step 1) and no independence violation (step 2) OR
       - If vulnerable in principle (step 3) but blocked by foresight or commitment (step 4).
     - **Definite Yes (Vulnerable):**
       - If a cycle or independence violation is found, the committee would make the trades in isolation, and they cannot avoid by foresight or commitment.
     - **Inconclusive:** 
       - If the exploitability depends on factors that cannot be determined (e.g., whether a counterparty will appear) or if the committee is unsure about their ability to foresee or commit.

  **Who Signs Off:**
  - The entire committee must agree on the preferences elicited in steps 1 and 2 (if applicable).
  - For step 3, the committee must agree on whether they would make the trades in isolation.
  - For step 4 (judgment step), the committee must decide by majority vote or consensus on their capacity for foresight and commitment.

  **Time Required:**
  - The procedure should take one meeting (about 2-3 hours). The time will be spent mostly on eliciting preferences and discussing the judgment steps.

  ---

  ### Running the Procedure on Three Cases

  **Case 1: Cycle in Funding Vehicles**

  *Scenario:* The committee has three funding vehicles: X, Y, Z. Revealed preferences: X > Y, Y > Z, Z > X (a cycle). At each quarterly meeting, a counterparty offers to convert one vehicle to another for a small fee.

  **Step 1:** Cycle found (X>Y, Y>Z, Z>X).

  **Step 2:** Not applicable (no uncertainty).

  **Step 3:** Exploitability in principle: 
  - Start with X. Counterparty offers to switch X to Z for a fee (since Z>X). Committee accepts, pays fee, now holds Z.
  - Then, counterparty offers to switch Z to Y (since Y>Z). Committee accepts, pays fee, now holds Y.
  - Then, counterparty offers to switch Y to X (since X>Y). Committee accepts, pays fee, now holds X. 
  - Committee is back to X but poorer by three fees. They would accept each trade in isolation because at each step they prefer the offered alternative.

  **Step 4:** Can the committee avoid by foresight or commitment?
  - *Foresight:* If at the first meeting the committee sees the whole cycle and refuses to trade, they avoid. But if they are myopic (consider each trade independently without thinking ahead), they get pumped.
  - *Commitment:* The committee could adopt a policy to never trade with the counterparty. But note: the counterparty might offer the trades in an order that exploits the cycle, and without a commitment, they might succumb.
  - *Judgment:* The committee must decide if they can foresee and resist. Given the quarterly meetings, they might not connect the trades. Also, the counterparty might not offer the entire cycle at once but over time.

  **Verdict:** **Vulnerable (Definite Yes)** if the committee cannot foresee the whole sequence and has no commitment device. The damage is done by the cumulative fees.

  **Overturned by:** Evidence that the committee would refuse the first trade because they anticipate the whole sequence, or that the counterparty does not exist or would not offer the trades.

  **Case 2: Allais-Type Independence Violation**

  *Scenario:* The committee is presented with two pairs of lotteries:

  - **Choice 1:**
     - Option A: $1 million for sure.
     - Option B: 89% chance of $1 million, 10% chance of $5 million, 1% chance of nothing.

  - **Choice 2:**
     - Option C: 11% chance of $1 million, 89% chance of nothing.
     - Option D: 10% chance of $5 million, 90% chance of nothing.

  Typically, people prefer A over B and D over C, violating independence.

  Now, the committee makes Choice 1 in one sitting and Choice 2 in another (without connecting them). The counterparty can exploit this.

  **Step 1:** No cycle (this is about uncertain prospects).

  **Step 2:** Check for independence violation.
  - Elicit: In Choice 1, the committee prefers A (sure $1M) over B. In Choice 2, they prefer D over C. This violates independence.

  **Step 3:** Exploitability in principle:
  - The counterparty can design a series of trades. One way is to have the committee first choose A over B. Then, the counterparty might offer to "sweeten" A by turning it into a lottery that is equivalent to B but then charge a fee. Alternatively, the counterparty can exploit by having the committee buy and sell lotteries in a way that leaves them with a sure loss. For example:
     - Start with the committee holding lottery B. They are willing to pay a fee to switch to A because they prefer A>B.
     - Then, the counterparty offers to switch A for a lottery that is actually C (but presented in a way that the committee sees it as less attractive than D, which they prefer over C). They might pay to avoid C and get D? The exact pump might be complex, but the point is that the violation allows a Dutch book.

  However, note: the standard money pump for Allais is less straightforward than the cycle. We might need to construct a sequence:

     - Suppose the committee initially has a ticket that gives them a 11/100 chance of $1M and 89/100 of nothing (which is C). But they prefer D (which is 10/100 of $5M and 90/100 nothing) over C. So they would pay a fee to switch from C to D.
     - Now they hold D. But note that D is equivalent to: 10% chance of $5M and 90% nothing. 
     - The counterparty then offers to "upgrade" D to a lottery that is actually B? Not exactly. Alternatively, we can use the common Allais pump:

       Step 1: Committee has A (sure $1M). They prefer A to B. But if we consider a lottery that is 1% chance of nothing and 99% chance of A, that lottery is equivalent to C (because 0.01*0 + 0.99*A = 0.11*1M + 0.89*0, if we adjust the probabilities). Actually, the standard approach is to note that the independence axiom implies linearity in probabilities.

       This is complex and may require a specialist. But for our procedure:

       *We note that the violation of independence implies that the preferences are not representable by expected utility, and hence are subject to a Dutch book (money pump).*

       Therefore, in principle, a counterparty can design a series of trades that exploit the inconsistency.

  **Step 4:** Can the committee avoid by foresight or commitment?
  - If the committee makes the two choices in isolation, they might not see the connection. But if the counterparty structures the trades, they might be pumped. 
  - However, if the committee uses a consistent rule (like expected utility) that satisfies independence, they avoid. But by hypothesis, they violate independence.

  **Verdict:** **Vulnerable (Definite Yes)** because the violation of independence implies that a Dutch book can be made against them. The committee may not be able to avoid without adopting a consistent rule.

  **Overturned by:** Showing that the two choices are not actually offered in a way that allows the counterparty to intervene (e.g., the choices are made in isolation and no trades are offered) or that the committee, upon reflection, revises their preferences to satisfy independence.

  **Case 3: Standing Policy of Never Reopening a Commitment**

  *Scenario:* The committee has a policy of never reopening a commitment once made. They argue this avoids money pumps.

  Now, we test this policy for vulnerability.

  **Step 1 and 2:** We are not testing a cycle or independence violation in the usual sense. Instead, we are testing the policy itself.

  But note: the policy is a commitment device. We must check if it is effective and if it avoids the pump.

  However, what if the policy itself leads to a money pump? Consider:

  - Suppose the committee has a cyclic preference (as in Case 1) but because of the policy, they never trade. Then they avoid the pump. So the policy is good.

  But what if the policy leads to a suboptimal outcome? For example, suppose after making a commitment, new information arises that makes it clear that the committed choice is now worse than an alternative. The policy forbids switching. Then, the committee might be stuck with a bad outcome.

  However, the money pump argument is about being exploited by a counterparty. In this case, there is no counterparty: the committee is just stuck with a suboptimal outcome. That is not a money pump in the classic sense.

  But note: the money pump argument for dynamic consistency is that if you change your plan, you might be exploited. For example:

  - At time 0, you plan to do A at time 2. At time 1, you change your mind and do B. Then at time 2, you regret and wish you had done A. But without a counterparty, this is just inconsistency and might not be exploitable.

  However, a counterparty could exploit this:

     - At time 0, you pay a fee to commit to A at time 2 (because you plan to do A).
     - At time 1, you change your mind and pay a fee to break the commitment and do B.
     - Then at time 2, you regret and pay a fee to switch back to A.

  So you pay fees and end up with A.

  But our policy of never reopening prevents this: once committed to A, you don't break. So you avoid the fees.

  **Procedure Application:**

  - **Step 1 and 2:** We are not directly testing a cycle or independence violation. Instead, we are testing the policy as a commitment device.

  - **Step 3:** We must see if the policy itself creates a vulnerability. Note: the policy is designed to block pumps. But what if the policy is rigid and leads to missing out on genuinely better opportunities? That is a cost but not a pump.

  - **Step 4:** The policy is a commitment device. It should block the pump.

  However, consider a situation where the committee has a cyclic preference and the policy forces them to hold an option they no longer prefer. But without trading, they don't lose money. So no pump.

  But if they are forced to hold an option that is inferior due to new information, then they are worse off, but that is due to the policy, not a counterparty.

  **Verdict:** The policy of never reopening a commitment **is not vulnerable to a money pump** because it blocks the trades that would lead to being pumped. It is a commitment device that works. However, note:

  - The policy might lead to missed opportunities. But that is a trade-off. The money pump argument does not say that commitment devices are bad; it says that without them, you might be pumped.

  **Overturned by:** Evidence that the policy itself can be exploited by a counterparty (e.g., a counterparty who knows the policy and offers a sequence of commitments that lock the committee into a cycle of fees). But that seems unlikely.

  **But wait:** The policy might be pumpable in a different way? Suppose:

     - The committee commits to funding vehicle X (never to change). 
     - Then, a counterparty offers a new vehicle Y that is better than X. The committee cannot switch because of the policy. 
     - Then the counterparty offers to release them from the commitment for a fee. They pay and switch to Y. 
     - Then they see Z which is better than Y, so they want to switch again. But they are not committed? They might then pay to commit to Y? 

  This is messy. The policy of never reopening might be absolute, so they wouldn't pay to break it. If they do break it, then the policy is not absolute, and they are vulnerable.

  Therefore, if the policy is absolute and they never break it, they avoid the pump. If they sometimes break it, then they might be pumped.

  **Conclusion for Case 3:** The policy of never reopening is **not vulnerable to a money pump** if it is strictly enforced. It serves as a commitment device that blocks the pump. But note: it may lead to inefficiencies (sticking to a bad choice). However, the money pump argument does not label that as a pump.

  ---

  ### What the Procedure Cannot Settle

  1. **Non-Exploitable Inconsistencies:** The procedure only flags inconsistencies that can lead to a money pump. Other inconsistencies (e.g., intransitivity in a one-shot choice with no trading) might be irrational but not pumpable.
  2. **Ambiguity in Preferences:** If preferences are not clearly defined (e.g., due to ambiguity or incomplete information), the procedure might not apply.
  3. **Judgment Calls:** The assessment of whether the committee can foresee the whole sequence or commit effectively is subjective.
  4. **External Factors:** The presence of a counterparty and the availability of trades are assumptions that might not hold.

  The committee must use the procedure as a tool, not a final arbiter. The goal is to avoid being exploited, not necessarily to achieve perfect rationality.

  ### Final Note
  The procedure should take about 2-3 hours per case. It requires the entire committee to participate in the elicitation and judgment steps. The chair (you) should facilitate the discussion and ensure that the steps are followed.

  This procedure makes clear that the money pump argument is a powerful critique of inconsistency but that it can be blocked by commitment. However, it also shows that some inconsistencies (like cycles in repeated trading without commitment) are genuinely dangerous.
answer: |-
  Below is a decision procedure designed to test for vulnerability to a money pump, tailored for your committee's use. It explicitly separates *exploitability by a counterparty* from *rational failure*, distinguishes *diachronic* (over-time) from *one-shot* risks, and flags where judgment is required. The procedure is structured as a flowchart with clear steps, inputs, outputs, and exit conditions. It prioritizes practicality for non-specialists—no formal decision theory training is needed, only basic comparisons and arithmetic.

  ---

  ### **Decision Procedure: Money Pump Vulnerability Check**  
  **Inputs**: A set of alternatives (e.g., funding vehicles, uncertain prospects), the committee's *revealed or stated preferences* over these, and the *context* (e.g., recurring decisions, counterparty access).  
  **Outputs**: `VULNERABLE`, `NOT VULNERABLE`, or `INCONCLUSIVE` (requires human judgment).  
  **Time Estimate**: 1–2 hours per case (executable in one quarterly meeting).  
  **Who Signs Off**: The full committee for preference elicitation (Steps 1–2); the chair for vulnerability verdicts (Steps 3–5).  

  #### **Step 1: Elicit Preferences**  
  **Objective**: Identify strict preferences (not indifference) among alternatives.  
  **Procedure**:  
  - For each pair of alternatives (A vs. B, B vs. C, etc.), ask: "Given the same cost, would we choose A over B in a direct choice?" Use past decisions if available.  
  - Record all pairwise preferences (e.g., "A > B" means A is strictly preferred to B).  
  - **Sufficient Answer**: A complete set of pairwise rankings. If no strict preference exists (indifference), treat as equal and exclude from cycles.  
  - **Exit to Judgment**: If preferences are context-dependent (e.g., "We prefer A > B only in Q1") or ambiguous.  
  - **Overturned By**: New data showing preferences were misreported or non-stationary.  

  #### **Step 2: Check for Cycles**  
  **Objective**: Detect if preferences are intransitive (A > B > C > A).  
  **Procedure**:  
  - From Step 1, list all preferences (e.g., A > B, B > C, C > A).  
  - Check for cycles: Does any set of 3+ alternatives form a loop? (e.g., A > B > C > A).  
  - **Sufficient Answer**: Cycle present (`CYCLE`) or absent (`NO_CYCLE`).  
  - **Exit to Verdict**: If `NO_CYCLE`, proceed to Step 5 (independence check). If `CYCLE`, proceed to Step 3.  
  - **Overturned By**: Proof that pairwise comparisons conflated unrelated decisions.  

  #### **Step 3: Test for Passive Exploitability (Diachronic Vulnerability)**  
  **Objective**: Can a counterparty exploit the cycle through sequential trades?  
  **Procedure**:  
  - Assume a counterparty can offer trades at any decision point (e.g., quarterly meetings).  
  - For the cycle (e.g., A > B > C > A), simulate:  
    1. Start with alternative X (e.g., A).  
    2. Counterparty offers to trade X for Y (where Y > X) for a fee ε (e.g., 0.1% of the stake).  
    3. Repeat until the cycle completes (e.g., A → C → B → A, paying 3ε).  
  - Ask: "Would we accept each trade *individually* if offered today, ignoring past/future trades?"  
  - **Sufficient Answer**:  
    - If "yes" to all trades: `EXPLOITABLE`.  
    - If "no" to any trade: `NOT_EXPLOITABLE`.  
  - **Exit to Judgment**: If fees (ε) are too high to justify the preference, or trades are not feasible.  
  - **Overturned By**: Evidence that the committee would reject trades in practice (e.g., budget constraints).  

  #### **Step 4: Test for Active Defense (Foresight or Commitment)**  
  **Objective**: Can the committee avoid exploitation by anticipating the sequence or locking in choices?  
  **Procedure**:  
  - If `EXPLOITABLE` (Step 3), ask:  
    - *Foresight*: "If we see the entire sequence upfront, would we reject the *first* trade to avoid net loss?"  
    - *Commitment*: "Can we bind ourselves to a rule (e.g., 'never trade Vehicle X') that breaks the cycle?"  
  - **Sufficient Answer**:  
    - If "yes" to foresight or commitment: `DEFENSIBLE` (not practically pumpable).  
    - If "no": `VULNERABLE`.  
  - **Judgment Note**: This step is inherently subjective—it depends on the committee's discipline and the cost of commitment devices (e.g., legal fees). Label as `JUDGMENT`.  
  - **Overturned By**: Proof of myopia (e.g., past impulsivity) or unenforceable commitments.  

  #### **Step 5: Check Independence (for Uncertain Prospects)**  
  **Objective**: Detect if preferences change when identical prospects are split into stages (à la Allais).  
  **Procedure**:  
  - **Only run if prospects involve uncertainty** (e.g., grants with probabilistic outcomes).  
  - Take two equivalent versions of a choice:  
    - *One-stage*: Choose between lotteries A and B.  
    - *Two-stage*: Split into identical sub-decisions (e.g., resolve uncertainty in two sittings).  
  - Elicit preferences in both versions.  
  - **Sufficient Answer**:  
    - If preferences differ (e.g., A > B in one-stage, but B > A in two-stage): `INDEPENDENCE_VIOLATION`.  
    - If identical: `NO_VIOLATION`.  
  - **Exit to Verdict**:  
    - If `NO_VIOLATION` or not applicable: `NOT_VULNERABLE`.  
    - If `INDEPENDENCE_VIOLATION`, proceed to Step 3 (replace "cycle" with "violation" in trade sequence).  
  - **Overturned By**: Showing the two presentations are not equivalent (e.g., due to cognitive load).  

  #### **Final Verdict Rules**  
  - `VULNERABLE`: Cycle/violation exists (`Step 2 or 5`), exploitable (`Step 3`), and not defensible (`Step 4`).  
  - `NOT_VULNERABLE`: No cycle/violation (`Step 2 or 5`), or exploitability blocked (`Step 4`).  
  - `INCONCLUSIVE`: Ambiguous preferences (`Step 1`), infeasible trades (`Step 3`), or unresolved judgment (`Step 4`).  

  ---

  ### **Application to Your Cases**  
  We run the procedure on your three scenarios. Assumptions:  
  - Committee preferences are stable and correctly elicited.  
  - Counterparties are rational and can interact at any meeting.  
  - Fees (ε) are negligible per trade but accumulate.  

  #### **Case 1: Cycle in Funding Vehicles**  
  - **Step 1**: Preferences elicited: Vehicle X > Y, Y > Z, Z > X.  
  - **Step 2**: Cycle detected: X > Y > Z > X → `CYCLE`.  
  - **Step 3**: Simulation: Start with X. Accept X→Z (fee ε), then Z→Y (ε), then Y→X (ε). Net loss: 3ε. Committee accepts each trade individually → `EXPLOITABLE`.  
  - **Step 4**: *Foresight*: If committee anticipates the cycle, they reject the first trade. *Commitment*: They could adopt a rule (e.g., "never trade Z"). But in your case, preferences are *revealed* in decisions, suggesting no commitment exists.  
    - **Judgment**: If the committee cannot foresee the sequence (e.g., trades occur quarterly with no coordination), then `NOT DEFENSIBLE` → `VULNERABLE`.  
  - **Verdict**: `VULNERABLE`.  
  - **Why You Might Not Like This**: Your committee is already being pumped via fees. The argument shows that *any* cycle is exploitable without commitment, regardless of how "defensible" each trade seems in isolation.  
  - **Overturned By**: Showing that fees are trivial relative to gains, or that no counterparty exists.  

  #### **Case 2: Allais-Type Independence Violation**  
  - **Context**: A grant proposal with two equivalent presentations:  
    - *One-stage*: Choose between:  
      - A: $500K certain.  
      - B: 10% chance $5.5M, 89% $500K, 1% $0.  
    - *Two-stage*: First resolve the 1% risk (failure/success), then choose if successful.  
  - **Step 1**: Preferences: A > B in one-stage; B > A in two-stage.  
  - **Step 5**: Preferences differ → `INDEPENDENCE_VIOLATION`.  
  - **Step 3**: Exploit via trades:  
    1. Committee holds B in one-stage. Counterparty offers to switch B to A for a fee (since A > B). Accept.  
    2. Counterparty re-packages A as a two-stage equivalent (identical outcomes).  
    3. In two-stage, committee now prefers B > A and pays to switch back. Net loss: fees. → `EXPLOITABLE`.  
  - **Step 4**: *Foresight*: If committee recognizes the re-packaging trick, they reject trades. *Commitment*: They could require all prospects as one-stage.  
    - **Judgment**: If the committee cannot spot equivalence across presentations, `NOT DEFENSIBLE` → `VULNERABLE`.  
  - **Verdict**: `VULNERABLE`.  
  - **Why This Matters**: The pump occurs *because* you revisit decisions diachronically. One-shot decisions avoid this, but your process enables it.  
  - **Overturned By**: Proving the two presentations are psychologically inequivalent (e.g., ambiguity in two-stage).  

  #### **Case 3: Your "Never Reopen" Policy**  
  - **Context**: A policy to never revisit past commitments (to prevent pumping).  
  - **Step 1**: Preferences: Assume no cycle (policy prevents new choices).  
  - **Step 2**: No cycle → `NO_CYCLE`.  
  - **Step 5**: Not applicable (no uncertainty in policy itself).  
  - **Verdict**: `NOT_VULNERABLE` (no cycle/violation to exploit).  
  - **But You Will Not Like This**: The policy *is* pumpable if:  
    - (a) The committee ever breaks it (e.g., due to pressure), allowing a cycle to resume.  
    - (b) It creates *new vulnerabilities*: e.g., refusing profitable trades (not a pump, but a welfare loss).  
  - **Key Weakness**: The money pump argument **does not justify rigidity**; it only shows that cycles *without commitment* are dangerous. Your policy avoids pumps but may incur opportunity costs. A softer rule (e.g., "reopen only with supermajority") may be superior.  
  - **Overturned By**: Evidence that the policy causes larger losses than a pump (e.g., missed $1M opportunity due to inflexibility).  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Value Conflicts**: E.g., if preferences involve ethics (e.g., funding controversial research), the procedure treats them as fixed inputs.  
  2. **Non-Quantifiable Judgments**: E.g., "foresight" (Step 4) relies on self-assessment.  
  3. **External Feasibility**: Whether counterparties *actually exist* or trades *can be offered* is empirical, not logical.  
  4. **Welfare Trade-offs**: Avoiding pumps may require costly commitment devices or missed opportunities.  

  ### **Committee Roles and Time**  
  - **Step 1 (Preferences)**: Full committee consensus (30–45 mins).  
  - **Steps 2–5 (Verdicts)**: Chair executes with committee input (45–60 mins).  
  - **Total Time**: 1.5–2 hours per case. Fit within one quarterly meeting for multiple cases.  
  - **When to Consult a Specialist**: Only if `INCONCLUSIVE` due to technical ambiguity (e.g., defining probabilistic equivalence in Step 5).  

  ---

  ### **Final Summary**  
  - **Case 1 (Cycle)**: Vulnerable if no foresight/commitment.  
  - **Case 2 (Allais)**: Vulnerable due to diachronic presentation.  
  - **Case 3 (Policy)**: Not pumpable but potentially inefficient—rigidity is overkill.  
  - **Core Insight**: The money pump argument is airtight *in theory* for cycles and independence violations, but **exploitability requires three conditions**:  
    1. A willing counterparty.  
    2. Diachronic decision points (your vulnerability).  
    3. No foresight or commitment.  
  - **Recommendation**: Use this procedure to flag vulnerabilities, then adopt targeted commitments (e.g., "no vehicle trades") instead of blanket irreversibility.
