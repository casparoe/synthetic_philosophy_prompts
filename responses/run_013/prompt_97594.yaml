prompt: |-
  I teach a 90-minute graduate seminar in judgment and decision-making, about 18 students, and I want them to feel the outside view as a personal surprise rather than hear it described. Design a runnable activity, with rules, materials, and a timeline, in which every participant first makes an inside-view forecast about a real piece of work they have already begun, and then a structured procedure forces each of them onto a reference class and a base rate, so that the gap between the two numbers is something they discover about themselves rather than something I announce. I do not want the session to end on the simple moral that the outside view is better. Build in a second stage in which a plausible reference class misleads, because it pools cases that differ in a way that matters, so that the group has to hold both views at once instead of trading one for the other. Include a debrief that maps each stage onto the inside/outside distinction and the problem of choosing a reference class; state what will predictably go wrong the first time the activity is run and how to handle it; and say plainly which part of the idea the activity cannot reproduce and that I will have to supply myself. In the write-up, separate what is settled among people who study forecasting from what is genuinely contested, and in particular do not present the claim that the outside view is generally more accurate as though it were consensus.
reasoning: |-
  We are going to design an activity that unfolds in two stages. The goal is to have students experience the inside view and outside view in a personal way, and then to complicate the narrative by showing that a poorly chosen reference class can mislead. 

  **Activity Title:** The Double-Edged Anchor

  **Overview:** 
  The activity has two main parts. In Part 1, students make an inside-view forecast about a project they are working on, then are forced to use an outside view via a reference class. They will see a gap between their inside view and the base rate. In Part 2, we introduce a scenario where the reference class is flawed because it pools heterogeneous cases, leading to a misleading base rate. This forces students to reconcile both views.

  **Learning Objectives:**
  1. Experience the inside view as a natural starting point for personal forecasts.
  2. Discover the gap between inside-view forecasts and base rates (outside view) in a structured, personal way.
  3. Recognize that reference class selection is critical and that an inappropriate reference class can lead to misleading base rates.
  4. Appreciate that both inside and outside views have value and must be used judiciously.

  **Materials:**
  - Index cards (or a digital equivalent like a shared document if remote)
  - Timer
  - Whiteboard or shared document for aggregating data
  - Handout with instructions (or projected instructions)
  - A prepared dataset for Part 2 (see below)

  **Timeline (90 minutes total):**
  1. Introduction (5 minutes)
  2. Part 1: Inside View and Reference Class Forecast (30 minutes)
  3. Part 2: Flawed Reference Class (30 minutes)
  4. Debrief and Discussion (25 minutes)

  ---

  ### Detailed Procedure

  #### 1. Introduction (5 minutes)
  - Briefly introduce the concept of forecasting and the two views (inside and outside) without giving away the activity's purpose. 
  - Explain that they will be working on a real project they are currently engaged in (e.g., a term paper, research project, thesis chapter, etc.). If they don't have one, they can think of a task like completing a grant application or preparing a presentation.

  #### 2. Part 1: Inside View and Reference Class Forecast (30 minutes)

  **Rules:**
  - Each student works individually.
  - They must choose a project that they have already started and that has a clear completion point (e.g., "finish the first draft of my paper").
  - They must estimate the time it will take them to complete the project (in hours), from the current moment until they consider it done.

  **Steps:**
  a. **Inside View Forecast (5 minutes):** 
     - On an index card, each student writes:
       - Project title: ______
       - Current status (e.g., "outline done, 2 pages written"): ______
       - Inside-view time estimate (hours): ______
     - Emphasize: This should be their honest, gut-feeling estimate.

  b. **Reference Class Selection (5 minutes):**
     - The instructor now provides a reference class. To standardize, we choose a broad but common one: "Graduate seminar term papers" (or similar, depending on the common project). 
     - The instructor shares a pre-collected base rate (or if not available, use a typical one from the literature, e.g., from Buehler, Griffin, & Ross, 1994, but adjusted for time). For example: "In a study of graduate students, the average time to complete a term paper from the point of having an outline and 2 pages written was 25 hours." 
     - *Alternative if pre-collected data is absent:* Have students anonymously submit their inside-view estimates and project statuses. Then, for each student, the reference class is defined as "other graduate students in this seminar working on similar projects." The instructor quickly aggregates the statuses (e.g., "outline and 2 pages") and then computes the average time estimate from the inside view of others. But note: This is not a base rate of actual times, but of estimates. We want actual base rates. Therefore, it's better to have pre-collected data. 

     - *Important:* We want to use an actual base rate (i.e., from historical data) for the reference class. If you don't have one, use a plausible one from the literature. Alternatively, if you have time, you could have collected data from past students. But for the sake of the activity, we'll assume the instructor has a base rate.

  c. **Outside View Forecast (5 minutes):**
     - Each student is now asked to write on the same card:
       - Provided base rate (from reference class): ______ (instructor states it, e.g., 25 hours)
       - Their outside-view forecast (which is the base rate, but they might adjust it slightly if they feel their case is special): ______
     - However, to force the outside view, instruct: "Do not adjust the base rate. Your outside-view forecast is exactly the base rate." 

  d. **Reveal and Reflect (10 minutes):**
     - Collect the inside-view estimates and outside-view forecasts (which are the base rate) from each student.
     - On the board, create two columns: Inside View and Outside View (Base Rate). 
     - For each student, mark their inside-view number and the base rate (which is the same for all). 
     - Ask: "How many of you have an inside-view estimate that is lower than the base rate?" (Expect most hands to go up.)
     - Then: "What does this gap represent? Why might your inside view be optimistic?"

  #### 3. Part 2: Flawed Reference Class (30 minutes)

  Now we complicate the picture.

  **Rules:**
  - We shift from personal projects to a pre-set scenario to control the reference class flaw.
  - Each student receives a handout with a description of two reference classes for the same type of project.

  **Scenario:**
  - Imagine you are a project manager at a tech company. Your team is developing a new feature for an app. The feature is a "chat interface with AI support". 
  - You have been working on it for 2 weeks and have completed the design and initial coding (about 40% done). 
  - You need to forecast the total time from start to finish (in weeks).

  **Steps:**
  a. **Inside View Forecast (5 minutes):**
     - Based on the scenario, students write their inside-view estimate for total project time. (They can use their judgment, but the scenario doesn't give much inside detail, so they might rely on general knowledge.)

  b. **Two Reference Classes (10 minutes):**
     - The instructor provides two reference classes and their base rates:
       - **Reference Class A:** "All app feature development projects at our company in the last 2 years." (Base rate: average 10 weeks)
       - **Reference Class B:** "AI-integration projects at our company in the last 2 years." (Base rate: average 15 weeks)
     - Now, the twist: The instructor reveals that the company has two types of AI projects: 
          - Type 1: Simple AI integrations (e.g., adding a pre-trained model) - average 8 weeks.
          - Type 2: Complex AI integrations (e.g., training a custom model) - average 20 weeks.
     - And the current project is actually a complex AI integration. 
     - The overall reference class for AI projects (Reference Class B) pools both simple and complex, so the base rate (15 weeks) is misleading for the complex type.

  c. **Outside View Forecast and Adjustment (10 minutes):**
     - Students are asked to write:
       - Which reference class would they choose? (A or B) and why?
       - What would be their outside-view forecast using that class?
     - Then, reveal the breakdown (simple vs. complex) and ask:
       - How does knowing the heterogeneity change your forecast?
       - What if they had chosen Reference Class A? (which includes non-AI projects and might be even less relevant)

  d. **Group Discussion (5 minutes):**
     - Poll the class: How many chose Reference Class B? (Expect many because it's more specific to AI.)
     - Then: "But even B was flawed. How could we get a better reference class?"

  #### 4. Debrief and Discussion (25 minutes)

  **Debrief Structure:**
  - Map to the inside/outside distinction:
    - Part 1: They started with the inside view (personal, detailed, optimistic) and then were forced to use the outside view (base rate from a reference class). The gap they discovered is the planning fallacy in action.
    - Part 2: The outside view can mislead if the reference class is too broad and pools heterogeneous cases. The key is to choose a reference class that is both statistically reliable and causally relevant.

  - What is settled and what is contested:
    - Settled: 
      - People tend to be overly optimistic in their inside-view forecasts (planning fallacy).
      - The outside view (using a reference class) can mitigate this by providing an anchor that is less biased by personal optimism.
    - Contested:
      - Whether the outside view is *always* more accurate. Sometimes the inside view has unique information that the reference class misses (as in Part 2 when the reference class is flawed). 
      - How to choose the right reference class is an open problem. There is no consensus on the best method.

  - What the activity cannot reproduce:
    - The activity uses hypothetical or pre-collected base rates. In real life, getting a reliable reference class with good data is hard. The instructor must emphasize that the outside view requires access to relevant historical data and the skill to identify an appropriate reference class. Without that, the outside view may not be feasible or may be misleading.

  **What Predictably Goes Wrong and How to Handle It:**
  - **Problem 1:** Students may not have a current project to forecast. 
    - *Solution:* Have a few example projects ready (e.g., "preparing a conference presentation in 3 months") for them to use.

  - **Problem 2:** In Part 1, the base rate might not be available. 
    - *Solution:* Use a base rate from the literature or a prior class. Alternatively, if you have time, collect data from a previous cohort and use that.

  - **Problem 3:** In Part 2, students might not see the flaw in the reference class. 
    - *Solution:* Clearly explain the heterogeneity and ask: "If you knew that there were two types of AI projects, how would that change your use of the base rate?"

  - **Problem 4:** The activity might run over time. 
    - *Solution:* Keep strict time limits. Use a timer and move on even if some are not done.

  **Instructor's Role:**
  - You must supply the base rates for both parts. For Part 1, try to get real base rates from past projects (if possible) to make it more authentic. For Part 2, you must design the scenario and the reference classes to clearly show the pitfall.

  **Conclusion:**
  End by emphasizing that the goal is not to abandon the inside view but to use both views in dialogue. The outside view is a corrective to optimism, but it requires careful reference class selection. The inside view may contain unique causal insights that a reference class misses. Good forecasting is about integrating both.

  ---

  **Note on Consensus:**
  In the debrief, be explicit: 
  - There is strong evidence that the inside view is often overly optimistic (the planning fallacy is robust). 
  - However, the claim that the outside view is *generally* more accurate is not without controversy. Some studies show that combining both views (adjusting the base rate with inside-view information) can improve accuracy, but the conditions under which this works are not fully understood. Moreover, the outside view can fail if the reference class is inappropriate. The activity illustrates both the power and the peril of the outside view.
answer: |-
  ### Activity Design: **The Anchored Horizon**

  #### **Overview**
  This 90-minute activity uses a two-stage approach to make the inside/outside view distinction visceral. Participants forecast completion time for their own projects (inside view), then confront a base rate from a reference class (outside view). Stage 2 introduces a flawed reference class to show how pooling dissimilar cases distorts forecasts. The debrief explicitly separates evidence from controversy in forecasting research.

  ---

  ### **Rules and Materials**
  **Materials**  
  - Index cards (2 per student)  
  - Whiteboard or shared digital document (for aggregating data)  
  - Timer  
  - Handout: "Project Descriptions" (Stage 2 scenarios; prepared in advance)  

  **Participants**  
  - 18 graduate students working on independent projects (e.g., thesis chapters, research proposals).  
  - *If projects are unavailable*, use class assignments (e.g., "finish next week’s reading response").  

  ---

  ### **Timeline**  
  **Total: 90 minutes**  

  #### **Stage 1: Personal Forecast Gap (35 min)**  
  1. **Inside View Forecast (10 min)**  
     - Each student privately writes on an index card:  
       - *Project name*  
       - *% completed* (e.g., "Literature review draft: 40%")  
       - *Inside-view estimate*: "Hours/days needed to finish" (e.g., "20 hours").  
     - *Instructor note*: Emphasize gut-feeling estimates. No external data.  

  2. **Reference Class Assignment (5 min)**  
     - Assign a standardized reference class (e.g., "Graduate thesis chapters at this university").  
     - Provide a **base rate** from pre-collected data (e.g., "Median completion time: 55 hours for chapters at 40% draft stage").  
       - *No pre-existing data?* Use a curated dataset (e.g., anonymized past student projects).  

  3. **Outside View Adjustment (5 min)**  
     - Students write on a second card:  
       - *Base rate* (e.g., "55 hours")  
       - *Adjusted forecast*: "My new estimate after considering the base rate."  
     - *Critical rule*: Forbid arbitrary adjustments. They must start from the base rate and justify deviations in writing (e.g., "I subtracted 10 hours because my topic is simpler").  

  4. **Reveal the Gap (15 min)**  
     - Aggregate inside-view estimates and adjusted forecasts anonymously on a board.  
     - Guide discussion:  
       - "How many of you cut the base rate? Why?"  
       - "Notice the cluster of inside-view estimates vs. adjusted forecasts."  
     - *Goal*: Students *see* their optimism gap without being told.  

  ---

  #### **Stage 2: The Flawed Reference Class (35 min)**  
  1. **Introduce Scenario (5 min)**  
     - Distribute a handout describing two projects:  
       - **Project A**: "Develop a climate model using existing datasets."  
       - **Project B**: "Develop a climate model requiring new satellite data."  
     - All students forecast completion time (in weeks) for **Project B**.  

  2. **Plausible but Misleading Reference Class (15 min)**  
     - **Step 1**: Provide reference class: "All climate-modeling projects" (base rate: 12 weeks).  
     - **Step 2**: Students write forecasts using this reference class.  
     - **Step 3**: Reveal hidden heterogeneity:  
       - "Projects with existing data: Median 8 weeks."  
       - "Projects needing new data: Median 22 weeks."  
       - *Project B requires new data*—the "all projects" reference class is misleading.  

  3. **Discussion (15 min)**  
     - Poll initial forecasts for Project B.  
     - Ask:  
       - "Who used the reference class naively? Why?"  
       - "What signaled that heterogeneity might matter here?"  
     - *Goal*: Show that reference classes can mislead if they ignore critical variables.  

  ---

  ### **Debrief (20 min)**  
  **Map to Concepts**  
  1. **Stage 1**:  
     - *Inside view*: Personal gut-feeling forecast (prone to optimism).  
     - *Outside view*: Base rate anchors forecasts but feels alien; participants "discount" it.  
     - *Key insight*: The gap arises from neglecting distributional data.  

  2. **Stage 2**:  
     - *Reference class problem*: Pooling dissimilar cases (new/existing data) distorts base rates.  
     - *Integration challenge*: Neither view is sufficient alone.  

  **Settled vs. Contested**  
  - **Settled**:  
    - Inside views are systematically optimistic (Kahneman & Tversky; Lovallo & Kahneman).  
    - Base rates improve accuracy *when reference classes are well-defined* (Koehler et al.).  
  - **Contested**:  
    - *"Outside view is generally more accurate" is not consensus*. Critics note:  
      - Base rates ignore unique causal factors (Gigerenzer).  
      - Poor reference classes worsen forecasts (Tetlock).  
    - Emphasize: "This activity shows the outside view’s *value*, but its *accuracy* depends on reference class quality."  

  **Predictable Problems & Fixes**  
  - **Problem**: Students resist adjusting to base rates (Stage 1).  
    - *Fix*: Enforce the "justify deviations" rule to surface their inside-view bias.  
  - **Problem**: Stage 2’s flaw isn’t noticed.  
    - *Fix*: Pre-seed clues (e.g., "Project B faces data acquisition risks").  
  - **Problem**: Overgeneralizing the "outside view is better" moral.  
    - *Fix*: Use debrief to stress: "The goal is integration, not replacement."  

  **What the Activity Cannot Reproduce**  
  - **Real-world reference class selection**: In the activity, you *provide* reference classes. In practice, choosing one requires skill/domain knowledge. *You must explicitly teach this separately*:  
    - "Outside views fail if you can’t identify a causally similar reference class. Tomorrow, we’ll practice defining them."  

  ---

  ### **Instructor Notes**  
  - **Ethical caution**: Use anonymous aggregation to avoid shaming.  
  - **Data prep**: Curate Stage 2 base rates from real project databases (e.g., thesis repositories). Lacking data? Use these:  
    - Stage 1 base rate: "Thesis chapters at 40% draft stage: Median 55 hours (n=30)."  
    - Stage 2 base rates: "Climate projects (all): 12 weeks; new-data projects: 22 weeks."  
  - **Key script line**: "Your inside view isn’t ‘wrong’—it has unique insights. But without the outside view, you miss the bigger picture. Without the inside view, you miss what makes *your* case different."  

  This design forces personal discovery of the inside/outside gap, complicates the narrative with Stage 2, and models scholarly honesty about contested claims. The flawed reference class ensures students leave holding both views in tension.
