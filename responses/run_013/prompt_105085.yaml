prompt: |-
  Right, I've been chewing over the continuum hypothesis for years and I want an actual number out of you rather than a tour of the debate. So: what's your credence that CH has a determinate truth value? To be precise about what I'm asking — take the proposition "every uncountable set of reals has the same cardinality as the reals". I'm asking whether that proposition is true or false simpliciter, not true-in-a-model, not relative to a choice of axioms, such that an idealised set theorist who knew everything there is to know about the set-theoretic universe (or whatever the correct ontology turns out to be) would thereby know which way it goes. Gödel and Cohen killed the idea that it's decidable from the usual axioms, so I'm not asking about provability.

  I want the decomposition, with a number and a line of reasoning for each term, then the combination. Roughly the terms I see are:

  (a) the probability that there's a single intended universe of sets at all, so that CH is straightforwardly true or false in it;
  (b) conditional on there being no single universe — the multiverse picture — the probability that some other route still gives CH a determinate answer (a canonical core, a privileged class of 'nice' universes, CH holding in every universe that matters, whatever);
  (c) the probability that we'll converge on new axioms that decide CH — forcing axioms, big cardinals, some criterion of justifiedness we don't have yet — and that set theorists will treat that as settling it, whoever's right metaphysically;
  (d) anything else you think belongs, including the probability that the question is ill-posed rather than answerable either way, and whether determinacy and knowability should come apart here (a truth value nobody could ever be in a position to know).

  Then tell me which term the final number is most sensitive to, and what would move it most — a proof, a philosophical argument, or just the sociology of the field converging. My own number wobbles between 0.3 and 0.6 depending on the day, which is basically a shrug, so I'm hoping yours is better motivated.

  One thing I keep getting stuck on and would like your view on: a friend says that if the multiverse picture is right then CH is simply non-determinate and that's that. I think that just relocates the problem, because you then need a determinate notion of which universes are in the multiverse, and the question "does every universe in the multiverse satisfy CH?" is a new CH-shaped question one level up. Am I confused, or is the multiverse view stuck with a determinacy assumption of its own? Also, if you'd answer differently under the assumption that universism is false, give me that conditional number too — I think that seperate number is where alot of the real disagreement lives.

  Give me the terms first, one line each, then the combination, then your answer to the multiverse point. The very last line of your reply should be exactly \answer{0.xx} with your overall credence and nothing after it.
