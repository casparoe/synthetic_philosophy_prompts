  Okay, let me start by understanding what this PhD student needs. They're preparing a 75-minute session for a cross-departmental group on whether metaphysical disputes can be merely verbal, using composite objects as the case study. They've got the literature down but need a teaching plan. The key components they outlined are six points, and they want a clear sequence, a central example, handling misconceptions, a closing check, and knowing what to omit.

  First, the order of components. The student’s proposed sequence makes sense: start simple with the "bank" example to establish the basic verbal/non-verbal distinction. Then move to cases where dictionaries don't resolve it, like "planet." That sets up the harder idea that disputes persist even when facts agree. Next, introduce the chair-particles case to show how ontology might fit here. Quantifier variance comes next to suggest different meanings of "exist." Then address the objection that this avoids the real question. Finally, the reflexive worry about meta-disputes.

  The linguist's complaint about "verbal" meaning "spoken" needs addressing early. I should suggest acknowledging it upfront but reframing "verbal" as "about words" to prevent derailment. The philosopher's conflation of "verbal" with "unimportant" should be tackled when discussing resolution, emphasizing that verbal disputes can still matter.

  For the central example, the student is worried about tomato or Pluto being too simplistic. They need an example that shows ambiguity isn't resolvable by disambiguation. The chair-particles case is better because disambiguation doesn't resolve it. However, starting with Pluto or tomato as a stepping stone might help, but the chair example must carry the weight later.

  The closing check: having participants pick a dispute and see if it survives term stipulation and what dissolution teaches. This seems sound. It tests if they grasp that verbal disputes dissolve with disambiguation, while deeper ones don't. It should differentiate between the positions, like quantifier variance vs. realism.

  Omissions: framework-relative quantification, verificationism, analytic/synthetic. The student plans to cut these, and I agree. Explaining that these are complex tools not needed for the core argument should suffice. They can mention that deeper theories exist but aren't essential here to avoid overload.

  Also, misconceptions: participants might think verbal disputes are trivial or resolvable by dictionaries. These should be addressed when introducing the planet example and during the chair discussion. Highlighting that verbal disputes can be substantive and not lexically resolvable is key.

  Timing is crucial. Allocating specific minutes per section ensures coverage. Starting with quick examples, then diving into ontology, leaving time for discussion. The reflexive worry might need less time if it's more of a concluding point.

  In summary, structuring the session to build from simple to complex, using Pluto and chair examples effectively, addressing misconceptions at key points, and using the closing check to assess understanding. Cutting the technical jargon keeps it accessible for the interdisciplinary group.
answer: |-
  Here’s a structured teaching plan designed for clarity, pacing, and avoiding pitfalls, based on your components and constraints. The sequence builds logically, preempts misconceptions, and centers on the **chair/particles case** as the primary example.

  ---

  ### **Session Structure (75 mins total)**
  **Goal:** Distinguish *verbal* vs. *substantive* disputes in metaphysics, emphasizing that ontological debates *can* be verbal without being trivial or resolvable by disambiguation.

  #### **1. Introduction: The Easy Case (10 mins)**
     - **Component:** Ordinary verbal disputes (e.g., "bank" = river vs. finance).
     - **Example:** "Tomato is a vegetable" (culinary) vs. "Tomato is a fruit" (botanical).  
       - *Why it works:* Demonstrates unambiguous resolution via disambiguation ("In botanical terms, it’s a fruit; in culinary, a vegetable").  
       - *What it teaches:* Disputes vanish when parties clarify terms.  
     - **Preempt misconception:**  
       - *Linguist’s complaint:* Address immediately: "We’re using ‘verbal dispute’ in the technical sense of *grounded in word meaning*, not ‘spoken’. If you prefer ‘lexical’ or ‘terminological’, substitute that. The point is the *role of language* in the disagreement."  
     - **Transition:** "But some disputes persist even when we agree on facts and definitions."

  #### **2. The Harder Case: Beyond Dictionaries (15 mins)**
     - **Component:** Disputes caused by language but not settled by dictionaries.  
     - **Example:** "Is Pluto a planet?"  
       - *Why it works:* Parties agree on all facts (size, orbit, composition) but disagree on whether "planet" *should* include Pluto. Disambiguation fails; it’s about conceptual boundaries.  
       - *Carrying the session?* Only as a bridge. **Problem:** Resembles "vegetable" case but introduces *stipulation*. Use it to show:  
         - If both sides accept the IAU’s definition, dispute dissolves (verbal).  
         - If one rejects the definition as "wrong," it becomes substantive (e.g., "The IAU misidentifies what ‘planet’ *really* means").  
     - **Key point:** Verbal disputes aren’t *just* ambiguity; they involve **conceptual/normative commitments**.  
     - **Transition:** "Now consider metaphysics: Is a ‘chair’ just particles arranged chairwise?"

  #### **3. The Metaontological Case (20 mins)**  
     - **Component:** Chair vs. particles dispute as the **CORE EXAMPLE**.  
     - **Why it carries the session:**  
       - Parties agree on all physical facts (particle positions, function, etc.).  
       - Disagreement is *solely* about whether "there exists a chair" or "there exist only particles arranged chairwise."  
       - **Crucial feature:** Disambiguation *fails*. You can’t resolve it by saying "Let ‘chair’ mean X" because the dispute is about what "exists" commits us to.  
     - **Preempt misconceptions:**  
       - *Philosopher’s conflation:* When introducing the case, state: "Note: Calling a dispute ‘verbal’ doesn’t mean it’s *unimportant* or that no one is wrong. It’s a claim about the *source* of disagreement (language), not its significance. We’ll revisit this."  
       - *"They just mean different things"*: Preempt by asking: "If both parties stipulate ‘there is a chair’ means ‘particles are arranged chairwise’, does the dispute vanish? If yes, it’s verbal. If not, it’s substantive."  

  #### **4. Quantifier Variance (10 mins)**  
     - **Component:** "There exists" might mean different things in different ontological frameworks.  
     - **Teach without labels:**  
       - "Imagine two frameworks:  
         - *Framework A:* "Exists" = fundamental particles + composites.  
         - *Framework B:* "Exists" = only fundamental particles.  
         In A, ‘There is a chair’ is true; in B, it’s false. They aren’t contradicting; they’re using ‘exists’ differently."  
     - **Dependency:** Must follow the chair case. Premature introduction risks seeming like evasion.  
     - **Transition:** "But is this a solution or a dodge?"

  #### **5. The Counter-Objection (5 mins)**  
     - **Component:** Quantifier variance avoids the question "What *really* exists?"  
     - **Response:** "Yes, and that’s the point. If the dispute is verbal, ‘what really exists’ might require choosing a framework—which isn’t settled by facts alone."  
     - **Preempt misconception:**  
       - *"So anything goes?"*: Emphasize that frameworks must be internally consistent and empirically adequate, but multiple may satisfy this.

  #### **6. Reflexive Worry (5 mins)**  
     - **Component:** Diagnosing "verbal dispute" is itself a contested move.  
     - **Example:** "The pro-chair philosopher says: ‘Claiming our dispute is verbal is just your way of avoiding my argument!’"  
     - **Key point:** Meta-debates can be substantive or verbal too—but we’re exploring *whether* the diagnosis is possible.  

  #### **7. Closing Question & Check (5 mins)**  
     - **Your check (refined):**  
       > *"Take a dispute you care about (e.g., ‘Is AI conscious?’). Suppose both parties agree to use a single stipulated definition (e.g., ‘consciousness = integrated information’).*  
       > *1. Would the dispute disappear? If yes, it’s likely verbal.*  
       > *2. If it dissolved, what would be learned? If nothing about the world—only about word usage—it’s verbal."*  
     - **Why it works:**  
       - Tests if they distinguish *verbal* (dissolves under stipulation) from *substantive* (persists).  
       - Reveals if they conflate dissolution with triviality (e.g., "If it dissolves, nothing was learned" vs. "We learned we were talking past each other").  
     - **Better than alternatives:** Forces application, not memorization.  

  ---

  ### **What to Omit (Announced Explicitly)**  
  1. **"I will not cover framework-relative quantification formalism.**  
     *Reason:* We’re focusing on the *conceptual* point—how ‘exists’ could vary—not the logic. The intuition suffices here."  
  2. **"I will not discuss verificationism or Carnap’s internal/external distinction.**  
     *Reason:* While historically relevant, it’s not essential for the core argument about verbal disputes. We’re bracketing epistemology."  
  3. **"I will not delve into analytic/synthetic distinctions.**  
     *Reason:* This debate could hijack the session. We’re assuming language can shape ontology without needing that machinery."  

  **Why these omissions are safe:** The core argument (steps 1-6) stands without them. Introducing them risks derailing into technicalities or dead-end debates.

  ---

  ### **Why the Chair/Particles Example is Non-Negotiable**  
  - **Tomato/Pluto fail** because they *are* resolved by disambiguation ("In context C, use definition D"). The chair case *resists* this, forcing the group into metaontology.  
  - **Solution:** Use Pluto as a stepping stone (step 2), then pivot: "But in metaphysics, disambiguation doesn’t work—let’s see why."  

  ---

  ### **Handling Lingering Concerns**  
  - **Linguist’s complaint:** Nipped in step 1. If they persist: "Granted—let’s use ‘terminological dispute’. Does that recasting affect the philosophical point?"  
  - **Philosopher’s conflation:** Add when summarizing: "Verbal disputes can be profound (e.g., ‘Is water H₂O?’) and involve real errors (e.g., misusing ‘exists’). What makes them ‘verbal’ is that the fix is semantic, not empirical."  

  This sequence scaffolds complexity, targets interdisciplinary pitfalls, and centers on a case where verbal disputes defy "easy fixes"—achieving your pedagogical goal.
