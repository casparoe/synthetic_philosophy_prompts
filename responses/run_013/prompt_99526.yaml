     **Tractability**: High. Draws on democratic theory (e.g., Rousseau, deliberative democracy) and requires conceptual clarity—no empirical work needed.  
     **What_would_move_it**: Shifts down if normative consensus emerges (e.g., "legitimacy stems from descriptive representation"); moves up if critiques gain traction (e.g., "randomness undermines accountability").  

  2. **Question**: Does random selection yield epistemic competence for complex governance?  
     **Why_upstream**: If ordinary citizens lack capacity to judge legislation (e.g., due to information gaps or cognitive biases), veto power risks harmful outcomes. This underpins the chamber’s functional viability.  
     **Tractability**: Moderate. Engages epistemology (e.g., Landemore’s "democratic reason") and cognitive science, but avoids pilots—focus on theoretical limits of lay rationality.  
     **What_would_move_it**: Advances in group epistemology studies could lower priority; unresolved debates on technocracy vs. populism elevate it.  

  3. **Question**: How veto power balances popular will vs. stability in a two-chamber system?  
     **Why_upstream**: Veto authority defines inter-chamber dynamics. Unresolved, it risks tyranny (e.g., sortition chamber obstructing elected mandates) or gridlock. Downstream design (e.g., veto scope) hinges on this.  
     **Tractability**: High. Analyzes power-separation theories (e.g., Madisonian checks) and democratic innovation (e.g., Fishkin’s deliberative systems).  
     **What_would_move_it**: Constitutional crises in similar models (e.g., EU mechanisms) could raise urgency; clear normative frameworks reduce it.  

  4. **Question**: Can accountability exist without electoral mechanisms?  
     **Why_upstream**: Accountability deficits may erode legitimacy and enable corruption. If sortition members cannot be sanctioned, public trust fails—affecting chamber composition and integrity safeguards.  
     **Tractability**: Moderate. Builds on non-electoral accountability (e.g., transparency, retrospective review), with philosophical work on moral responsibility.  
     **What_would_move_it**: Innovations in non-electoral accountability (e.g., AI monitoring) lower priority; corruption scandals in sortition pilots elevate it.  

  5. **Question**: Does statistical representativity ensure deliberative efficacy?  
     **Why_upstream**: Representativity (demographic mirroring) and deliberation (quality debate) may conflict. Overemphasizing one could undermine legitimacy or competence—e.g., large bodies dilute deliberation.  
     **Tractability**: Moderate. Balances political equality (e.g., Dahl) with deliberative norms (e.g., Habermas). No fieldwork—conceptual trade-offs only.  
     **What_would_move_it**: Evidence from large-scale assemblies (e.g., Climate Assembly UK) simplifies trade-offs; persistent small-group bias elevates it.  

  6. **Question**: What safeguards prevent elite capture of the sortition chamber?  
     **Why_upstream**: Vulnerability to lobbying/bias threatens epistemic competence and legitimacy. Downstream measures (e.g., anti-corruption rules) depend on this risk assessment.  
     **Tractability**: Moderate. Uses institutional analysis (e.g., institutional corruption theory) and incentive design.  
     **What_would_move_it**: Strong legal precedents reduce priority; revealed vulnerabilities in citizens’ assemblies elevate it.  

  7. **Question**: Is compulsory service justifiable under egalitarian principles?  
     **Why_upstream**: Fairness concerns (e.g., burden on disadvantaged groups) could delegitimize the pool. Impacts opt-out policies and compensation, but less central than legitimacy/competence.  
     **Tractability**: High. Applies equality frameworks (e.g., Rawls) and civic duty debates—pure theory.  
     **What_would_move_it**: Widespread public acceptance lowers priority; litigation over compulsory service elevates it.  

  #### Skip These Questions (Low Downstream Impact)  
  - **Question**: "What is the optimal size of the sortition chamber?"  
