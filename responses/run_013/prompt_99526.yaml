prompt: |-
  Im helping design a small two-year research project — me, one RA, basically no budget — on sortition and whether we should swap out career politicians for randomly selected citizens. The concrete thing I keep circling is a bicameral setup: an elected chamber with a two-term limit, and a second chamber drawn by lot from the adult population, serving a single fixed three-year term, barred from being drawn again for ten years, with a real veto over the elected chamber's bills. Say it's politically feasible and funded — I don't need help arguing for it, I need to know what we'd have to figure out first.

  So which open questions in this area matter most, and why? I want the philosophical/theoretical ones, not "how did such-and-such pilot go" — the ones two people with a philosophy background could actually make progress on in two years. Rank them by how much the rest depends on them, tell me for each why it's upstream, how tractable it really is, and what would bump it up or down the list. And flag the questions everyone fixates on that I should just skip, because settling them wouldn't change anything downstream.

  After the writeup, give me a short JSON summary: an object with a "ranking" array where each entry has "question", "why_upstream", "tractability", and "what_would_move_it"; a "skip" array of objects with "question" and "reason"; and a "ranking_criteria" string saying how you ordered them.
reasoning: |-
  We are designing a two-year research project on a bicameral system with an elected chamber (term-limited) and a sortition chamber (randomly selected citizens) with veto power. The focus is on philosophical/theoretical open questions that are upstream (i.e., foundational) and whose resolution would impact downstream considerations. We are to rank them by how much the rest depends on them, and skip questions that, even if settled, wouldn't change downstream design.

  Key criteria for ranking:
  1. **Upstreamness**: How foundational is the question? Does resolving it affect many other aspects?
  2. **Tractability**: How feasible is it to make meaningful progress on this question in two years with two people (philosophy background) and no budget? We are looking for conceptual analysis, not empirical work.
  3. **What would move it**: What factors could change the priority of this question?

  We are to skip questions that are often fixated on but are not critical because settling them wouldn't change downstream design.

  Potential open questions (philosophical/theoretical):

  1. **Legitimacy of Sortition**: Can a randomly selected body claim democratic legitimacy? How does its legitimacy compare to that of an elected body? This is upstream because without legitimacy, the entire system is undermined.
  2. **Epistemic Value of Random Selection**: Does random selection produce better (or at least sufficiently good) decisions compared to election? This is about the capacity of ordinary citizens to deliberate and make sound judgments. It's central to justifying the sortition chamber's veto power.
  3. **Representativeness vs. Deliberative Quality**: How do we balance the statistical representativeness of the sortition body (which random selection provides) with the need for effective deliberation? This affects the design of the sortition body (size, term, etc.).
  4. **Power Dynamics**: How should power be distributed between the two chambers? Specifically, the veto power of the sortition chamber over the elected one. What are the normative principles for such a division? This is crucial for the system's functioning.
  5. **Accountability**: How can a sortition chamber be held accountable? Elected representatives are accountable through elections. What mechanisms (if any) are appropriate for a sortition body? This affects the legitimacy and effectiveness of the system.
  6. **Incentives and Corruption**: Without electoral incentives, what prevents corruption or capture of the sortition chamber? How do we ensure integrity? This is a common critique of sortition.
  7. **The Role of Expertise**: How does a citizen body handle complex policy issues that require expertise? What role should experts play in advising the sortition chamber? This is a key challenge for the feasibility of sortition.
  8. **Equality and Fairness**: Does random selection treat citizens equally? Is it fair to compel service? How does this align with democratic values?
  9. **The Nature of the Veto**: What should be the scope and conditions of the veto? Is it absolute or can it be overridden? This is a design question but has normative underpinnings.

  Ranking by upstreamness and tractability:

  1. **Legitimacy of Sortition**: 
     - Why upstream: Without resolving the legitimacy question, the entire project is on shaky ground. It is the most foundational. If the sortition chamber lacks legitimacy, then its veto power is unjustifiable.
     - Tractability: Highly tractable for philosophers. It involves conceptual analysis of democratic legitimacy, drawing on existing literature (e.g., deliberative democracy, representation).
     - What would move it: If there is already a strong consensus in the literature that sortition can be legitimate (which there is in some circles), then it might be less urgent. But if there are new challenges, it becomes critical.

  2. **Epistemic Value of Random Selection**:
     - Why upstream: If the sortition chamber cannot make good decisions, then giving it veto power is dangerous. This question underpins the justification for the chamber's power.
     - Tractability: Tractability is moderate. It requires engaging with theories of collective intelligence, deliberation, and epistemic democracy. It might involve thought experiments and conceptual arguments.
     - What would move it: If empirical evidence from existing sortition bodies (e.g., citizens' assemblies) becomes overwhelming, it might reduce the need for theoretical work. But in the absence of that, it remains critical.

  3. **Power Dynamics**:
     - Why upstream: The distribution of power between the two chambers is a core design feature. The veto power is a strong tool and we need to justify why the sortition chamber should have it and how it should be exercised.
     - Tractability: High. Philosophers can draw on theories of separation of powers, checks and balances, and democratic theory.
     - What would move it: If the design is fixed (e.g., veto is non-negotiable), then this becomes less upstream. But if we are open to adjusting the power, it remains critical.

  4. **Accountability**:
     - Why upstream: Accountability is a key principle in democracy. Without it, the sortition chamber might be seen as unaccountable and thus illegitimate or prone to abuse.
     - Tractability: Moderate. It requires conceptualizing accountability without elections. There are existing ideas (e.g., transparency, publicity, retrospectives) that can be analyzed.
     - What would move it: If we can design the system with other accountability mechanisms, this might become less critical. But it remains foundational.

  5. **Representativeness vs. Deliberative Quality**:
     - Why upstream: The design of the sortition chamber (size, term, etc.) is affected by this balance. If we prioritize representativeness, we might need a large body; if deliberation, a smaller one. This affects feasibility.
     - Tractability: Moderate. It involves trade-offs that can be analyzed conceptually, but might require some simulation or logical modeling (which is feasible without budget).
     - What would move it: If we fix the design parameters (e.g., we decide on a specific size), then it becomes less critical.

  6. **Incentives and Corruption**:
     - Why upstream: Without proper safeguards, the system could fail. But this is somewhat downstream because it depends on the design of the sortition chamber (e.g., transparency rules, anti-corruption measures).
     - Tractability: Moderate. It involves institutional design and normative principles (e.g., integrity, public interest). However, it might be more applied.
     - What would move it: If we can assume that corruption can be controlled by standard institutional measures, then it becomes less critical.

  7. **The Role of Expertise**:
     - Why upstream: The sortition chamber must handle complex issues. If they cannot access and use expertise appropriately, their decisions might be poor.
     - Tractability: Moderate. Philosophers can analyze the relationship between lay judgment and expertise, drawing on theories of epistemic democracy.
     - What would move it: If we design a strong advisory system, this might be mitigated. But it is still a core challenge.

  8. **Equality and Fairness**:
     - Why upstream: Random selection raises questions of fairness (e.g., burden of service). But these are less critical than legitimacy and epistemic value because they can be addressed by design (e.g., compensation, voluntary participation?).
     - Tractability: High. It's a standard topic in political philosophy (equality, fairness, obligation).
     - What would move it: If the sortition process is designed to be voluntary (but note: the proposal says "drawn by lot", which might be compulsory) then this might be less pressing.

  9. **The Nature of the Veto**:
     - Why upstream: This is more of a specific design question that depends on the above. It is downstream because the justification for the veto (and its scope) relies on the legitimacy and epistemic capacity of the sortition chamber.
     - Tractability: High for philosophers, but it is more applied and might be better addressed after the foundational issues.

  Skipping questions that are often fixated on but not critical:

  - **"How did such-and-such pilot go?"**: We skip because we are focusing on theoretical questions, not empirical case studies.
  - **Feasibility of Implementation**: While important, it's not philosophical and we assume it's feasible for the sake of the project.
  - **Specific Design Details (e.g., exact term length, size)**: These are downstream and depend on the foundational principles we establish. Settling them without the foundations wouldn't change the core justifications.
  - **Historical Precedents**: While interesting, they don't directly address the normative questions.

  Ranking (by upstreamness, then by tractability):

  1. Legitimacy of Sortition
  2. Epistemic Value of Random Selection
  3. Power Dynamics
  4. Accountability
  5. Representativeness vs. Deliberative Quality
  6. Incentives and Corruption
  7. The Role of Expertise
  8. Equality and Fairness
  9. The Nature of the Veto

  But note: We might combine or reorder based on interdependence. For example, legitimacy depends on epistemic value and accountability.

  Revised ranking by how much the rest depends on them:

  1. **Legitimacy of Sortition**: If the sortition chamber isn't legitimate, the rest doesn't matter.
  2. **Epistemic Value**: If it can't make good decisions, then even if legitimate, giving it veto power is problematic.
  3. **Power Dynamics**: The veto power is a key feature and we must justify why this distribution is appropriate.
  4. **Accountability**: Without accountability, legitimacy and epistemic value are undermined.
  5. **Representativeness vs. Deliberative Quality**: This affects the design and effectiveness of the sortition body, which in turn affects its legitimacy and epistemic performance.
  6. **Incentives and Corruption**: This is a risk that could undermine everything, but it can be addressed by institutional safeguards that are downstream.
  7. **The Role of Expertise**: This is important for the epistemic value, so it is linked to #2.
  8. **Equality and Fairness**: This is a supporting consideration but not as central as legitimacy or epistemic value.
  9. **The Nature of the Veto**: This is a specific design issue that depends on the above.

  Given that, I'll adjust the order to reflect dependencies:

  1. Legitimacy (because it's the most foundational)
  2. Epistemic Value (because it directly supports legitimacy and the justification for power)
  3. Power Dynamics (because it defines the system's structure and depends on the first two)
  4. Accountability (which is a component of legitimacy and also affects power dynamics)
  5. Representativeness vs. Deliberative Quality (which affects both epistemic value and legitimacy)
  6. The Role of Expertise (which is part of epistemic value)
  7. Incentives and Corruption (which affects accountability and legitimacy)
  8. Equality and Fairness (which is a background condition)
  9. The Nature of the Veto (which is an application of the above)

  But note: Some of these are interconnected. We might work on them in parallel.

  Final ranking for the project (with tractability and upstreamness):

  1. **Legitimacy of Sortition**: Most upstream and tractable.
  2. **Epistemic Value of Random Selection**: Very upstream, tractability moderate.
  3. **Power Dynamics**: Very upstream (defines the relationship), tractability high.
  4. **Accountability**: Upstream because it affects legitimacy and power, tractability moderate.
  5. **Representativeness vs. Deliberative Quality**: Less upstream than the above but still important for design, tractability moderate.
  6. **The Role of Expertise**: Linked to epistemic value, tractability moderate.
  7. **Incentives and Corruption**: Important but more applied, tractability moderate.
  8. **Equality and Fairness**: Less central, tractability high.
  9. **The Nature of the Veto**: Downstream, tractability high but depends on others.

  Now, for skipping:

  - **"How to ensure descriptive representation?"**: Because random selection already ensures it in expectation, and we can assume that. Settling it wouldn't change the downstream design much because the method is fixed.
  - **"What compensation should sortition members receive?"**: This is a practical issue that doesn't affect the core philosophical justifications.
  - **"How to handle non-participation?"**: Again, a practical issue.
  - **"Comparison with other democratic innovations"**: We are focused on this specific bicameral model.

