  - **Question**: "How to allocate resources for sortition member training?"  
    **Reason**: Budget-dependent implementation details don’t affect theoretical foundations like legitimacy or competence.  
  - **Question**: "Which voting rules should the sortition chamber use?"  
    **Reason**: Procedural mechanics (e.g., majority vs. consensus) are secondary to whether the chamber should exist at all.  

