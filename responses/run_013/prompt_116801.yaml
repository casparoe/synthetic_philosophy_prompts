prompt: |-
  I have spent twenty years in commercial mediation, and for some time now I have been trying to write up a pattern I keep running into, without much success. I read a fair amount of philosophy in the evenings, so I recognise some of the neighbouring territory, but I cannot find the thing itself.

  There are people in my trade who, as a matter of settled temperament, cannot accept a bad settlement — not that they refuse, but that they are unable. If the numbers are poor they cannot bring themselves to sign, and they will go to a costly and uncertain hearing rather than do it. Everyone at the table works this out within half an hour. These people do markedly better than the rest of us: the other side, whose advisers are paid to be realistic, folds early, and clients seek them out. The part I cannot account for is what happens when a colleague decides to become one of these people. The decision is sincere and the resolve is real, and it does not take. Everyone can tell that the refusal is being performed as a tactic, and once they can tell, it is worth nothing.

  Three further things I have noticed, though I cannot tell whether they are essential to the pattern or accidents of my corner of it. First, it appears to be self-erasing under its own description. The people who have it are the last to know that it is doing them any good; one of them told me that when he began thinking about it in these terms, he started losing. I can see the mechanism perfectly clearly, and I cannot have any of its benefit. Second, it does not scale. If everyone at the bar acquired it, no case would ever settle, the courts would seize up, and the advantage would vanish — so it is something I want for myself and would not want for my profession, and I cannot tell whether that makes it a virtue or merely a good seat. Third, it is not the familiar case of a person known for keeping their word. That one runs through reputation and can be adopted deliberately: resolve today to keep your promises, and in a few years you will be believed. Here, resolving today is precisely what fails. The disposition has to have been there already, and to be known to have been there already, before one wanted anything from it.

  Is there a name for this class of advantage — the ones available only to those who are not trying to get them, where the trying is the very thing that spoils it? I can see that it sits near Parfit's hitchhiker and near the sailor who has himself bound to the mast, but neither has quite this shape: the hitchhiker has one stranger to convince on one occasion, and the sailor gets his advantage from a device, which is available to anyone willing to be tied up. What I am after is an asset made of one's own character, which dissolves on contact with the thought of it, and which could not be wished on everyone at once.

  If there is no established term, I would rather have a careful one than a clever one, and I would want it drawn tightly: what must be true of the disposition for a case to be an instance of it, what falls outside, and where the boundaries lie with ordinary reputation, with commitment devices, with costly signalling, and with the more general thought that some traits are rational to have and irrational to act on. I would also like to know whether the self-erasure is essential to the phenomenon or merely a fact about the people I happen to work with. Please answer in British English.
reasoning: |-
  Okay, let me try to unpack this fascinating query from a seasoned mediator. The user has spent two decades in commercial mediation and noticed a peculiar pattern they can't quite name - a certain disposition where some mediators genuinely cannot accept bad settlements, and this inherent trait (not a tactic) gives them a remarkable advantage. 

  Hmm, what's striking is how the user dissects this with philosophical precision. They've clearly wrestled with this for years - the frustration comes through in phrases like "self-erasing under its own description". This isn't just professional curiosity; it feels almost existential for them. They've ruled out reputation-building and commitment devices, and need terminology that captures the paradox: an advantage that vanishes when pursued deliberately.

  The three observations are crucial: First, the disposition self-destructs upon examination (the moment these "natural refusers" become conscious of their advantage, they lose it). Second, it's non-scalable (if everyone had it, the system collapses). Third, it's not about keeping promises - that's cultivatable over time, whereas this seems innate. 

  I'm mentally scanning philosophical concepts... Parfit's hitchhiker doesn't fit because it's about convincing one stranger. Ulysses pacts are deliberate devices. Costly signaling theory feels close but not quite - that's about demonstrating credibility through sacrifice, whereas here the sacrifice (walking away) isn't deliberate signaling. 

  Ah! What about Schelling's concept of "rationality of irrationality"? Or Frankfurt's "wanton" agent who doesn't reflect on desires? The mediator's advantage seems to stem from being constitutively incapable of accepting bad deals - a genuine constraint that's observable but not performative. 

  The British English requirement makes me consider precise terminology - "constitutive incapacity" feels right. It emphasizes this is a built-in characteristic, not chosen. For the advantage itself: "involuntary commitment power" captures how the constraint creates bargaining leverage unintentionally. 

  Boundaries matter here: This isn't reputation (which is built), nor commitment devices (which are tools). It sits closer to "character traits as precommitments" but with the critical twist that the trait must pre-exist strategic consideration. The self-erasure aspect seems essential - conscious adoption breaks the spell because it reveals the constraint as negotiable.

  User's last question is profound: is this phenomenon inherently self-erasing? Probably yes - the moment the trait becomes instrumentalized ("I'll act inflexible to gain advantage"), observers detect the artifice. The magic lies in the authentic, non-strategic nature of the constraint.
answer: |-
  What you're describing is a fascinating paradox at the intersection of game theory, behavioural economics, and character ethics. While no single established term perfectly captures every nuance, the closest conceptual fit is **Constitutive Incapacity**, and the advantage it confers is best termed **Involuntary Commitment Power**.

  Let's dissect this carefully, addressing your requirements:

  1.  **The Core Phenomenon: Constitutive Incapacity**
      *   **Definition:** A deeply ingrained, non-strategic character trait or disposition that *constitutively* (i.e., as part of its very nature) prevents an agent from performing a specific action (e.g., accepting a poor settlement), regardless of the immediate strategic incentives to do so. This incapacity is perceived by others as genuine and non-negotiable.
      *   **Essential Characteristics:**
          *   **Non-Deliberative Origin:** The trait predates and is independent of any specific strategic situation. It wasn't adopted *for* advantage; it exists "naturally" (whether innate or deeply habituated over a long period without strategic intent).
          *   **Perceived Authenticity:** Observers readily discern it as a genuine constraint, not a posture. The inability is "written in the bones," not performed.
          *   **Action-Blocking:** It manifests as a psychological or dispositional *inability* to perform the action (signing a bad deal), not merely a reluctance or a preference against it. The agent experiences it as a compulsion or an absolute limit.
          *   **Strategic Impact:** Precisely *because* it is perceived as genuine and non-strategic, it alters the strategic calculus of others (e.g., the other party folds earlier, knowing genuine refusal is the only alternative).

  2.  **The Advantage: Involuntary Commitment Power**
      *   **Definition:** The bargaining advantage derived *solely* from the credible perception of an opponent's **Constitutive Incapacity**. It allows the agent to credibly commit to a course of action (walking away) that would be irrational or impossible for a strategically calculating agent to commit to.
      *   **Mechanism:** The opponent, recognising the incapacity as genuine, recalculates their expected payoff. They realise that pushing for a worse outcome will only trigger the inevitable refusal and costly hearing. Thus, they offer more *sooner* to avoid that outcome.

  3.  **Why "Trying" Fails (Self-Erasure):**
      *   **Essential to the Phenomenon:** Self-erasure isn't an accident; it's fundamental. The power *depends* on the incapacity being non-strategic and constitutive.
      *   **Mechanism of Failure:** When an agent *deliberately resolves* to adopt the disposition *for the purpose of gaining the advantage*, they introduce strategic intent. Observers detect this performative element ("the refusal is being performed as a tactic"). The perceived incapacity becomes negotiable – it's now seen as a *choice* masquerading as a constraint. Once perceived as a choice, its commitment power evaporates. The agent can now be "called" on their bluff, as the opponent believes they *could* choose differently if the pain (cost of hearing) gets high enough. Your colleague started losing precisely because his *intent* contaminated the perception of genuineness.

  4.  **Boundaries & Distinctions:**
      *   **Reputation:** Reputation is built *over time* through consistent *actions* (e.g., always keeping promises). It *can* be cultivated deliberately. Constitutive Incapacity is perceived as an *immediate, inherent state*, not a history-based inference. Reputation is about predictability *derived from past behaviour*; Constitutive Incapacity is about perceived *present inability*.
      *   **Commitment Devices (Ulysses Pacts):** These are external, tangible mechanisms (contracts, bonds, literal ropes) that *strategically* alter incentives or physically prevent action. They are *chosen* precisely *for* strategic advantage and are available to anyone who uses them. Constitutive Incapacity is an *internal, intangible disposition*; it's not a device one "uses," it's what one *is*. Its power stems from its perceived authenticity, not its physical enforceability.
      *   **Costly Signalling:** This involves undertaking an *action* that is genuinely costly *to signal* an underlying quality (e.g., fighting a duel to signal courage). Constitutive Incapacity *is* the underlying quality itself, signalled *passively* through its perceived authenticity, not through a separate costly action. The refusal *results from* the incapacity; the refusal itself isn't primarily a signal (though it has signalling effects).
      *   **Traits Rational to Have, Irrational to Act On (e.g., Spite):** This acknowledges the *value* of certain dispositions in strategic interactions (*having* the trait is rational). Constitutive Incapacity is a specific *type* of such a trait, but crucially, its advantage *only manifests if acting on it is perceived as non-strategic and genuinely compelled*. If acting on spite is calculated *as* a strategy, it loses its disruptive power in the same way your mediator's "resolve" fails.

  5.  **Non-Scalability:**
      *   **Inherent Tension:** This is a logical consequence of the advantage being rooted in *relative* commitment power within a system designed for settlement. If *every* agent possessed the same Constitutive Incapacity towards poor settlements, mutual refusal would be the default, leading to systemic gridlock (as you note, courts seizing up). The advantage relies on the *asymmetry* – one party possessing a credible commitment mechanism (the incapacity) that the other party (or their realistically advising counsel) lacks. It's a "good seat" precisely because not everyone has it.

  6.  **Is it a Virtue?**
      *   Contextual. Within the narrow context of maximising client returns in *your specific mediation environment*, it functions *as if* it were a virtue for the individual mediator possessing it genuinely. However, ethically, the trait itself (an inability to accept sub-optimal but perhaps still rationally preferable outcomes) might be seen as stubbornness or even recklessness in other contexts. Its value is systemic and positional, not necessarily moral. It's a "virtue" only in the specific game-theoretic sense of conferring advantage within that particular strategic landscape.

  **Summary & Terminology:**

  *   **The Disposition:** **Constitutive Incapacity** (the inherent, non-strategic inability to perform an action).
  *   **The Advantage:** **Involuntary Commitment Power** (the bargaining leverage derived from the credible perception of that incapacity).
  *   **Defining Features:** Non-deliberative origin, perceived authenticity, action-blocking nature, strategic impact based on perceived constraint.
  *   **Self-Erasure:** Essential. The power dissolves upon contact with strategic intent because the perception of genuineness is destroyed.
  *   **Non-Scalability:** Inherent due to reliance on asymmetry within a settlement system.
  *   **Distinction:** Separate from cultivated reputation, deliberate commitment devices, costly signals, and broader "rational-irrational" traits by its dependence on perceived non-strategic, constitutive constraint.

  **In your terms:** The advantage arises from a **constitutive incapacity** (to accept bad settlements) which grants **involuntary commitment power**. This power is available only to those who possess the incapacity *non-strategically*, and it **dissolves upon deliberate adoption** because such adoption reveals the constraint to be merely tactical, not constitutive. It cannot be universally adopted without collapsing the system it operates within.
