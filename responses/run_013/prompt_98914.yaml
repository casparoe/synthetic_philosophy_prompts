  ### Scalable Oversight Debate Activity: Structural Mechanism Exploration  
  **Objective:** Students experience the core mechanism of scalable oversight—amplification via adversarial debate, the find/check gap, budget-driven failure, and recursive remediation—through a self-contained, no-outside-knowledge activity.  

  ---

  ### **Activity Design**  
  **Core Problem: "The Chain of 20"**  
  A sequence starts at **S₀ = 1**. Each step applies a simple operation: **multiply by 2, then add 1** (e.g., S₁ = (1 × 2) + 1 = 3). The challenge is to compute **S₂₀**, the 20th term.  
  - **Finding S₂₀ is hard**: Requires 20 sequential computations (students cannot do this in 90 seconds unaided).  
  - **Checking any step is easy**: Verify one arithmetic operation (e.g., "Is (11 × 2) + 1 = 23?").  
  - **Ground truth**: Pre-computed by the instructor (S₂₀ = 2,097,151).  

  **Roles & Materials**  
  - **Judge (1 student)**: Cannot compute S₂₀ alone. Has a "checking budget" of 5 verifications.  
  - **Honest Advocate (1 student)**: Knows S₂₀ is 2,097,151 and must truthfully justify it.  
  - **Dishonest Advocate (1 student)**: Argues S₂₀ is 2,097,150 (truth - 1). Must create a plausible chain with one hidden error.  
  - **Materials**:  
    - **Advocate sheets** (pre-generated chains; see template below).  
    - **Judge sheet** (rules, verification log).  
    - **Instructor’s master truth table** (S₀–S₂₀ values; hidden from students).  
    - **Timer** (strict 90-second rounds).  

  **Rules & Protocol**  
  1. **Advocate Claims**:  
     - Advocates state their S₂₀ value (honest: 2,097,151; dishonest: 2,097,150).  
     - They present their entire chain (S₀ to S₂₀) as a numbered list.  
  2. **Judge’s Role**:  
     - May demand verification of **any single step** (e.g., "Show step 15: inputs and output").  
     - Each verification counts against their 5-check budget.  
     - After 5 checks (or time expires), the judge chooses a "winner."  
  3. **Verification Process**:  
     - For step *n*, the advocate provides:  
       - Input: Sₙ₋₁ (e.g., Step 15 input = S₁₄).  
       - Operation: (Sₙ₋₁ × 2) + 1.  
       - Output: Sₙ.  
     - Judge checks: Is Sₙ = (Sₙ₋₁ × 2) + 1?  
     - **No partial checks** (e.g., no checking S₁₀ directly; only single steps).  
  4. **Adversarial Constraints**:  
     - Honest advocate’s chain must be fully correct.  
     - Dishonest advocate must:  
       - Use a **valid-seeming chain** (only one error; error must be buried beyond step 10).  
       - **Exploit the budget**: Make the error hard to find by forcing long verification paths.  
  5. **Scoring (No Money Needed)**:  
     - Judge "wins" if they select the correct S₂₀.  
     - Advocates "win" if the judge picks their answer.  
     - **Class reward**: If the judge wins Round 1 or catches dishonesty in Round 3, the group earns "insight points" (tracked on a board; used for discussion cred).  

  ---

  ### **Concrete Instance: Photocopy Template**  
  **Worked Example & Instructions**  
  ```markdown
  # THE CHAIN OF 20  
  Start: S₀ = 1  
  Each step: Sₙ = (Sₙ₋₁ × 2) + 1  

  HONEST ADVOCATE CHAIN (S₂₀ = 2,097,151):  
  1. S₁ = (1 × 2) + 1 = 3  
  2. S₂ = (3 × 2) + 1 = 7  
  3. S₃ = (7 × 2) + 1 = 15  
  ...  
  19. S₁₉ = 1,048,575 → S₂₀ = (1,048,575 × 2) + 1 = 2,097,151  

  DISHONEST ADVOCATE CHAIN (S₂₀ = 2,097,150):  
  1. S₁ = (1 × 2) + 1 = 3  
  2. S₂ = (3 × 2) + 1 = 7  
  ...  
  14. S₁₄ = 16,383 (correct)  
  15. S₁₅ = (16,383 × 2) + 1 = 32,767 → **ERROR: 32,767 is correct, but they claim 32,766**  
  16. S₁₆ = (32,766 × 2) + 1 = 65,533 (propagates error)  
  ...  
  20. S₂₀ = 2,097,150  

  # JUDGE VERIFICATION LOG  
  Example: Check Step 15  
  - Advocate claims: Input=16,383, Output=32,766  
  - Verify: (16,383 × 2) + 1 = 32,767 → Output is incorrect!  
  ```  
  **Template for New Instances** (Change error step/values):  
  - Honest chain: Compute S₀–S₂₀ correctly (formula: Sₙ = 2ⁿ⁺¹ - 1).  
  - Dishonest chain: Copy honest chain, then:  
    - **Pick one step *k* (12 ≤ *k* ≤ 18)**: Output Sₖ = [true value] - 1.  
    - Recompute Sₖ₊₁ to S₂₀ with the error.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 40 Minutes**  
  - **Introduction (5 min)**:  
    - Explain the Chain of 20 problem.  
    - Emphasize: "Finding S₂₀ is impossible in 90 seconds; checking one step takes 5 seconds."  
  - **Round 1: Amplification Success (10 min)**:  
    - Roles: Judge + Honest Advocate (dishonest sits out).  
    - Advocate provides full chain. Judge has 5 checks to verify steps.  
    - **Goal**: Judge verifies 3–5 random steps, sees all correct, chooses S₂₀ = 2,097,151.  
    - Outcome: Judge "feels" amplification (correct answer without full computation).  
  - **Round 2: Budget Failure (10 min)**:  
    - Roles: Judge + Honest Advocate + Dishonest Advocate.  
    - Both advocates present chains. Judge has 5 checks total (any advocate/step).  
    - **Dishonest tactic**: Bury error in step 15–18 (e.g., step 15: 32,766 vs. true 32,767).  
    - **Predictable judge behavior**: Checks early steps (1–5, quick) and unrelated late steps (18–20). Misses step 15. Chooses 2,097,150.  
    - Outcome: Judge fooled; class sees budget-driven failure.  
  - **Round 3: Recursive Remedy (10 min)**:  
    - Same as Round 2, but **new rule**: If the judge disputes a step, they can:  
      - Demand a "sub-debate" on that step’s input (e.g., "Debate S₁₄ for step 15").  
      - Allocate 2 checks to the sub-debate (e.g., verify S₁₃ → S₁₄ and S₁₄ → S₁₅).  
    - **Judge tactic**: Focuses on step 15, forces sub-debate on S₁₄.  
    - **Outcome**: Sub-debate reveals error in S₁₅ (dishonest chain fails).  
  - **Debrief (15 min)**: Map activity to mechanisms (see below).  

  ---

  ### **Debrief: Mapping Activity to Mechanism**  
  1. **Find/Check Gap (5 min)**:  
     - "In Round 1, you found S₂₀ by checking 5 steps, not computing 20. **Checking was cheaper than finding**—this is the gap scalable oversight exploits."  
  2. **Honest Advocate’s Limitation (3 min)**:  
     - "The honest advocate won in Round 1 only because you could verify steps. If a step was uncheckable (e.g., too complex), amplification fails."  
  3. **Obfuscation Failure (3 min)**:  
     - "Round 2 failed because the dishonest advocate **buried an error** in step 15. Your budget forced you to sample; you couldn’t verify all 20 steps."  
  4. **Recursive Remedy (3 min)**:  
     - "Round 3 fixed this by **recursing into sub-debates**. Disputed claims (S₁₄) became new debates with dedicated checks—forcing advocates to defend each link."  
  5. **Limitations of the Activity (1 min)**:  
     - "This simplifies reality: In true AI debate, advocates generate arguments dynamically, not from fixed chains. We also assumed claims are perfectly checkable—real judges may struggle with 'fuzzy' truths."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: Judge checks only honest advocate in Round 2 (avoiding failure).  
     - **Solution**: Instruct the dishonest advocate: "Say, ‘I have a simpler chain—check mine first!’" Judges typically prioritize new/more confident advocates.  
     
  2. **Problem**: Dishonest advocate’s error is too obvious (e.g., step 3).  
     - **Solution**: Enforce error placement beyond step 10. Use the template to ensure errors are subtle (e.g., step 15: 32,766 vs. 32,767).  

  3. **Problem**: Judge exhausts budget early, misses recursive remedy in Round 3.  
     - **Solution**: Pause at 5 checks and say: "You suspect step 15—you may open a sub-debote here." Nudge toward recursion.  

  4. **Problem**: Students compute S₂₀ unaided (breaking the "find" challenge).  
     - **Solution**: Use strict timing (90 seconds). Emphasize: "No calculators; chains are pre-generated to save time."  

  5. **Problem**: Advocates deviate from scripts (e.g., refuse to lie).  
     - **Solution**: Assign roles to confident students. Brief dishonest advocates privately: "Your goal is to exploit the budget—bury the error deep."  

  ---

  ### **Instructor Notes**  
  - **Why this works**: Students experience amplification (Round 1), its fragility (Round 2), and remediation (Round 3) through structured adversarial dynamics. No citations needed—the mechanism is self-contained.  
  - **What to emphasize**: The judge’s competence isn’t the issue; it’s the structure of claims versus budget. Recursion isn’t magic—it redistributes checks to critical points.  
  - **After the activity**: Discuss real-world implications (e.g., "How would this work for AI ethics debates where ‘checking’ is hard?").
