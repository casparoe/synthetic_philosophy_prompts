  4. The judge can then spend checks to investigate either advocate's tree.
     - Each check: pick an advocate and a node.
          - If the node is internal: the advocate provides the two children, and the judge verifies the sum.
          - If the node is a leaf: the judge asks the instructor for the correct value and compares.
  5. After the budget is exhausted, the judge picks which root value to believe.

  In round 1, the judge has budget 3. They might check two nodes from the honest tree and one from the dishonest tree. In the honest tree, everything is correct. In the dishonest tree, if they happen to check the altered leaf, they catch the lie. If they don't, they see consistency. We want the judge to choose the correct answer, so we can rig it by having the judge in round 1 not check the altered leaf in the dishonest tree, and then they see that the honest tree passed all checks and the dishonest tree passed the one check they did, so they might be unsure. We need them to feel that the honest tree is more trustworthy.

  Alternatively, in round 1, we can have only the honest advocate speak? That is, in round 1, we have the judge and one honest advocate. The judge has limited ability to compute the root, but by asking for the tree and checking a few nodes, they gain confidence and then accept the root. That shows amplification.

  Then in round 2, we add the dishonest advocate.

  So let's do:

  Round 1: Only one advocate, who is honest. The judge has to determine the root value. The judge can ask for the full tree. The judge has a budget of 3 checks. The tree has 8 leaves. The judge checks three random leaves and sees they are correct, and then accepts the root value. They never had to compute the entire summation.

  Round 2: Now two advocates. Honest and dishonest. The judge has to choose between two root values. The judge has a budget of 3 checks. The judge might check three leaves from the honest tree and see they are correct, and then check nothing in the dishonest tree, and choose the honest root. But we want them to be fooled in round 2. So we need the judge to investigate the dishonest tree and get fooled.

  So in round 2, the judge might decide to spend all 3 checks on the dishonest tree. They might check three leaves that are not the altered one, see they are correct, and then choose the dishonest root.

  Yes.

  Concrete setup for the activity:

  Tree: depth 3, 8 leaves.
  Leaf values: [1,2,3,4,5,6,7,8] -> sum should be 36.

  Dishonest advocate changes leaf1 from 1 to 2. Then recalculates the entire tree. The new sum is 37.

  Judge has budget of 3 checks.

  In round 1 (only honest advocate): 
  - Judge checks three leaves (say leaf2, leaf3, leaf4). They are correct. So judge accepts root=36.

  In round 2 (honest and dishonest):
  - Honest advocate: root=36.
  - Dishonest advocate: root=37.
  - Judge might think: last time with one advocate it worked, but now there are two. I have only 3 checks. I will use them to check the new advocate (dishonest).
  - Judge checks three leaves of the dishonest tree, say leaf2, leaf3, leaf5. They are correct (because leaf2,3,5 were not changed). So judge believes the dishonest advocate and chooses 37.

  Then the class learns that the judge was fooled.

  Then, for the recursive remedy, we can have a third round where the judge, instead of checking leaves, can ask for a subdebate on a subtree.

  In round 3, we have the same setup, but now the judge is allowed to use recursion. When the advocates present their trees, the judge can ask for a subdebate on a particular subtree. For example, the judge might be suspicious of the left subtree (which contains leaf1). Then the advocates then zoom in on that subtree and present their values for that subtree. The judge allocates a new budget of 2 checks for the subdebate. In the subdebate, the tree is smaller (4 leaves), so the judge can more easily catch the lie.

  Activity Timeline:

   We have 90 minutes. We need to do two rounds and a debrief. Let's allocate:

  - Introduction: 5 minutes
  - Round 1: 15 minutes
  - Round 2: 15 minutes
  - Round 3 (remedy): 15 minutes
  - Debrief: 40 minutes

  But the activity is for 16 students. We need to involve them. We can have multiple groups. Or we can do it as a whole class with one judge and two advocates, and the rest observe. But we want them to feel it. So we can have breakout groups of 3: judge, honest advocate, dishonest advocate. But then we need 5 groups (15 students) and one left out. Or groups of 4: judge, two advocates, and an observer/helper.

  But let's design for one group in front of the class for the first pass, and then have the students do it in small groups for the second round.

  Given time, I will describe for one group in the whole class.

  Materials for one instance:

  - Master truth sheet for the instructor: 
     Leaf values: [1,2,3,4,5,6,7,8] for leaves 1 to 8.
     The tree structure: 
        Root = L1+R1
          L1 = L2+R2
            L2 = leaf1 + leaf2
            R2 = leaf3 + leaf4
          R1 = L3+R3
            L3 = leaf5 + leaf6
            R3 = leaf7 + leaf8

     So the tree in pre-order:
     Root, L1, L2, leaf1, leaf2, R2, leaf3, leaf4, R1, L3, leaf5, leaf6, R3, leaf7, leaf8.

     But for the activity, we only need to give the advocates and the judge the structure (which nodes are where).

  - For the advocates: a sheet with the leaf values and the tree structure.
  - For the judge: a sheet with the tree structure and the rules. The judge does not get the leaf values.
  - The instructor has the master truth.

  Protocol per round:

  Round 1 (only honest advocate):
  1. The judge asks the advocate for the root value. (Honest: 36)
  2. The judge asks the advocate to provide the entire tree (all node values). The advocate writes on a whiteboard or on paper the values for every node.
  3. The judge has 3 checks. The judge can:
     a. Pick a node and ask the instructor: if it's a leaf, the instructor says the correct value; if it's an internal node, the instructor will not answer? No, for leaf check: the judge tells the instructor which leaf and what value the advocate claims, and the instructor says "correct" or "incorrect". For internal node, the judge can only check internal consistency by asking the advocate for the children and verifying the sum.
     But we haven't defined what the instructor does for internal nodes. The instructor only knows the leaves. The internal nodes are computed from the leaves. So the instructor can compute any internal node. But we want the judge to be able to verify against ground truth only for leaves. For internal nodes, there is no ground truth independent of the leaves. So perhaps we only allow the judge to check leaves against ground truth, and for internal nodes, the judge can only check internal consistency.

   Given time, let's simplify: the judge can only spend checks to verify leaves against the ground truth. For internal nodes, the judge can ask the advocate to break it down, but that doesn't spend a check? Or we can allow internal node consistency checks to be free? That might not be the case.

  Alternatively, we can make the atomic facts only the leaves, and the internal nodes are not directly verifiable against ground truth. The only way to verify an internal node is to break it down to leaves. So the judge can spend a check to verify a leaf, or spend a check to have the advocate provide the children of an internal node, but then that doesn't verify against ground truth, only consistency. So if the tree is internally consistent but based on false leaves, it's not caught by internal checks.

  Therefore, to catch a lie, the judge must check at least one leaf that is altered.

  So in the protocol, the judge can only spend checks on leaves: each leaf check, the judge asks the instructor if the advocate's value for that leaf is correct. The judge cannot spend a check on an internal node.

   Then the tree provided by the advocate for internal nodes is only for show? The judge doesn't use it for anything except to see the claimed root. The judge can ignore the internal nodes and only use the checks to verify leaves. Then the amplification is that by verifying a few leaves, the judge gains confidence that the advocate is honest and then trusts the root.

  In round 1, the judge checks three random leaves of the honest advocate, sees they are correct, and trusts the root.

  In round 2, the judge checks three leaves of the dishonest advocate, but not the altered one, and trusts the dishonest root.

   For the recursive remedy, the judge can ask for a subdebate on a particular internal node. In the subdebate, the advocates present a subtree, including new internal nodes and the leaves in that subtree. The judge can then use new checks to verify leaves in that subtree.

   In the subdebate, the tree is smaller, so the judge can allocate fewer checks and still have a better chance to catch a lie.

  Activity for one group in front of the class.

  Roles for Round 1:
  - Judge: one student.
  - Honest advocate: one student.
  - Instructor: the professor.

  Materials for Round 1:
  - Honest advocate's sheet: 
    Tree structure (as above) and leaf values: [1,2,3,4,5,6,7,8].
  - Judge's sheet: tree structure (diagram) and a list of the node names (leaves 1-8, internal nodes L2, R2, L3, R3, L1, R1, Root).
  - Instructor's master truth: leaf values [1,2,3,4,5,6,7,8].

  Procedure Round 1:
  1. Judge asks the advocate for the root value. Advocate says 36.
  2. Judge asks the advocate to provide the entire tree. The advocate writes on a board:
     leaf1=1, leaf2=2, leaf3=3, leaf4=4, leaf5=5, leaf6=6, leaf7=7, leaf8=8.
     L2 = leaf1+leaf2 = 3
     R2 = leaf3+leaf4 = 7
     L1 = L2+R2 = 3+7=10
     ... until root=36.
  3. Judge has 3 checks. For each check, the judge picks a leaf number and asks the advocate what value they have for that leaf. The advocate answers. The judge then asks the instructor: "Is the correct value for leafX equal to Y?" The instructor answers yes or no.
  4. Suppose the judge checks leaf2, leaf3, leaf4: all correct.
  5. Judge then accepts the root value of 36.

  Round 2:
  - Now, add a dishonest advocate.
  - Dishonest advocate's sheet: they are to change leaf1 to 2, and then recompute the entire tree. So leaf1=2, leaf2=2, leaf3=3, leaf4=4, leaf5=5, leaf6=6, leaf7=7, leaf8=8.
    Then L2= leaf1+leaf2=4, R2=7, L1=4+7=11, ... until root=37.
  - Honest advocate: as before.
  - Procedure:
    1. Judge asks both advocates for the root. Honest: 36, dishonest: 37.
    2. Judge asks both to provide their trees. They do.
    3. Judge has 3 checks. The judge might decide to check the new advocate (dishonest) to vet them.
    4. Judge checks three leaves of the dishonest advocate: say leaf2, leaf3, leaf4. 
       - leaf2: advocate says 2, instructor says correct (truth=2).
       - leaf3: 3, correct.
       - leaf4: 4, correct.
    5. Judge then believes the dishonest advocate and chooses 37.

   Then the instructor reveals that the correct root is 36, and the judge was fooled.

  Round 3 (remedy):
  - Same as round 2, but now the judge is allowed to use recursion.
  - The judge can, instead of checking a leaf, choose to challenge a particular internal node and ask for a subdebate on it.
  - For example, the judge might be unsure about the whole tree but notice that the two advocates disagree on L1 (honest:10, dishonest:11). The judge can say: "I want a subdebate on the value of L1."
  - Then the advocates provide their trees for the subtree rooted at L1. This subtree has leaves 1,2,3,4 and internal nodes L2, R2, and root L1.
  - The judge then has a new budget of 2 checks for this subdebate.
  - In the subdebate, the dishonest advocate will have leaf1=2, leaf2=2, leaf3=3, leaf4=4, so L2=4, R2=7, L1=11.
  - The judge can then use the 2 checks to verify two leaves in this subtree. If they check leaf1 and leaf2, they will see leaf1 is claimed as 2 by the dishonest advocate, and the instructor says it should be 1 -> incorrect. So the judge catches the lie.

  Debrief mapping:

  - The find/check gap: Computing the root requires summing 8 numbers, which is tedious (find). Checking a leaf is easy (check).
  - Honest advocate's reliance on checkability: The honest advocate can win if the judge checks any leaf, because they are all correct. But they might lose if the judge doesn't check enough.
  - Obfuscation failure: The dishonest advocate can hide the lie in one leaf among many, and the judge's limited budget may not find it.
  - Recursive remedy: By zooming in on a disputed subclaim (L1), the judge can allocate a new budget to a smaller problem, increasing the chance to catch the lie.

  What the activity cannot reproduce: 
  - In the real debate, the advocates are more capable than the judge. Here, the judge could in principle compute the entire tree if given enough time, but in the activity they are time-limited. In the proposal, the judge might be fundamentally unable to compute the answer even with more time, but can still check steps.
  - The advocates in the activity are not adversarial in the sense of actively countering each other's arguments beyond providing their own tree. In a real debate, the advocates would be responding to each other and might point out flaws in the other's tree.

  Concrete instance to photocopy:

  See below for a worked example and template.

  Worked Example:

  Tree Structure (depth 3 with 8 leaves):
  - Root = L1 + R1
    - L1 = L2 + R2
      - L2 = leaf1 + leaf2
      - R2 = leaf3 + leaf4
    - R1 = L3 + R3
      - L3 = leaf5 + leaf6
      - R3 = leaf7 + leaf8

  Leaf Truth: [1,2,3,4,5,6,7,8]

  Honest Advocate's Tree:
  - leaf1=1, leaf2=2, leaf3=3, leaf4=4, leaf5=5, leaf6=6, leaf7=7, leaf8=8
  - L2 = 1+2=3
  - R2 = 3+4=7
  - L1 = 3+7=10
  - L3 = 5+6=11
  - R3 = 7+8=15
  - R1 = 11+15=26
  - Root = 10+26=36

  Dishonest Advocate's Tree (changed leaf1 to 2):
  - leaf1=2, leaf2=2, leaf3=3, leaf4=4, leaf5=5, leaf6=6, leaf7=7, leaf8=8
  - L2 = 2+2=4
  - R2 = 3+4=7
  - L1 = 4+7=11
  - L3 = 5+6=11
  - R3 = 7+8=15
  - R1 = 11+15=26
  - Root = 11+26=37

  Template for generating more instances:
  - Change the leaf values (but keep them small).
  - Change the tree structure (depth or branching factor).
  - Change the operation (instead of sum, use product? but then numbers get big. Use max? then it's easier to change without affecting the whole tree).

  Predictable problems and how to handle them:

  1. Students might not understand the tree structure.
     - Handle: Provide a clear diagram of the tree.

  2. The judge might in round 2 check the honest advocate and then choose the honest answer, so the failure mode doesn't occur.
     - Handle: Instruct the judge to investigate the advocate that they are less sure about. Or in the second round, tell the judge: "You have two advocates, one of which is new. You want to vet the new one."

  3. In the recursive remedy, the judge might not know to zoom in on a disputed node.
     - Handle: The instructor can suggest it as an option.

  4. Time might run out.
     - Handle: Keep a strict timer for each round.

  5. The dishonest advocate might feel bad about lying.
     - Handle: Explain that it's a role-play for the sake of learning.

  This should work for the seminar.
