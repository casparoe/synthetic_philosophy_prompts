   Now, the fanaticism: we are asked to prefer this lottery over a certain 100, even though the chance of winning is astronomically small (about 1 in 10^30).

   The arithmetic:

   EV(A) = 100.
   EV(B) = 100 + 1/(2^100) > 100.

   So by expected value maximization, we must choose B.

   We have:
   - finite payoffs: 100 and 1.26765e32+1 are finite.
   - probability: 1/2^100 is well-defined and can be generated by 100 fair coin flips (an uncontroversial physical process).
   - one-shot: we are making a single choice.
   - the decision-maker knows the odds.

   Now, the conceptual issue: what structural assumption of expected utility theory (EUT) is responsible?

   EUT relies on the von Neumann-Morgenstern axioms: completeness, transitivity, independence, and continuity (Archimedean).

   The fanaticism in this example arises from the continuity (or Archimedean) axiom. This axiom states that for any three outcomes A, B, C with A preferred to B and B preferred to C, there exists a probability p (with 0 < p < 1) such that:

     p*A + (1-p)*C > B.

   In our case: let A be the enormous payoff (X), B the certain 100, and C the 0. We have A > B > C.

   The continuity axiom says there must be some p (no matter how small) such that a lottery that gives A with probability p and C with probability (1-p) is preferred to B.

   Our example uses a very small p (1/2^100) and a very large A (X) such that p*X > 100. The continuity axiom requires that such a p exists. Without the continuity axiom, we might be able to say that for probabilities below a certain threshold, we ignore the possibility of A and just treat the lottery as effectively giving C (or 0). But continuity forbids that.

   So the fanaticism is forced by the continuity axiom.

   What if we drop continuity? Then we can have a lexicographic preference: we might require that any positive chance (no matter how small) of A is better than B only if the chance is above a certain threshold. But dropping continuity comes at a cost: it would make the utility representation discontinuous and might lead to a failure of representing preferences by a real-valued function. Moreover, continuity is a very natural requirement for a theory that wants to model small changes in probability.

