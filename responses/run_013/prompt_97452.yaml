   We want expected value (EV) of B to be greater than EV of A, even though p is very small and 100 is substantial.

   So: EV(B) = p * X + (1-p)*0 = p * X
   We require: p * X > 100.

   We must choose p and X such that p is very small and X is very large, but both are finite and the probability p is uncontroversial.

   How to choose p? We want it to be small but not inscrutable. Let's take a probability that can be generated by a physical random process that we can simulate or imagine.

   For example: consider a fair coin. We can flip it a fixed number of times and require a specific sequence to win the big prize.

   Let n be the number of flips. The probability of a specific sequence (e.g., all heads) is (1/2)^n.

   We can choose n to be, say, 100. Then p = (1/2)^100.

   Now, we need X such that: p * X > 100  =>  (1/2)^100 * X > 100  =>  X > 100 * 2^100.

   Calculate 2^100: 
    2^10 = 1024 ≈ 10^3, so 2^100 = (2^10)^10 ≈ (10^3)^10 = 10^30.

   So X > 100 * 10^30 = 10^32.

   Therefore, set X = 10^32 + 1 (to be safe). This is a finite number, but enormous.

   Now, the options:

   Option A: Certain 100.
   Option B: Lottery that pays 10^32 + 1 with probability 1/(2^100) and 0 otherwise.

   Expected value of B: (1/(2^100)) * (10^32+1) ≈ (10^32+1) / (10^30) ≈ 100 + 10^(-30) (since 2^100 ≈ 10^30, and 10^32 / 10^30 = 100).

   Actually, let's compute more exactly:

   2^100 is exactly 1,267,650,600,228,229,401,496,320,512 ≈ 1.26765e30.

   Then, EV(B) = (10^32+1) / (1.26765e30) ≈ (1e32) / (1.26765e30) = 1e32 / 1.26765e30 = 78.85...? That doesn't seem right because we expected about 100.

