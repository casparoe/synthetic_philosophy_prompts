   Therefore, the example shows that if we allow unbounded utility functions, then expected utility maximization (with the continuity axiom) forces fanaticism. If we require utility functions to be bounded, we avoid fanaticism. But the boundedness of utility is an additional constraint that is not part of the standard axioms (completeness, transitivity, independence, continuity). And it is known that bounded utility is necessary to avoid the St. Petersburg paradox and similar issues.

