answer: |-
  Here is a procedure designed for your specific constraints and timeline, followed by application to your three poems.

  **The Procedure: One Morning Per Poem**

  1.  **Name the Core: (5 min)**
      *   **Step:** Write *one sentence*: "This poem exists in the novel to ___________." Focus on its dramatic/emotional function (e.g., "comfort a dying child," "convey cold defiance," "mark communal grief without naming the dead").
      *   **Sufficient Answer:** A sentence that feels true to the scene and character(s). If you can't write this, STOP. You don't understand the poem's role well enough to translate it yet. Revisit the manuscript context.
      *   **Test:** Read the sentence aloud. Does it make the poem feel *necessary* to the book? (Pass: Yes. Fail: No. Return to manuscript.)

  2.  **Derive Load-Bearing Constraints: (10 min)**
      *   **Step:** Look at your Core Sentence. List *every* formal constraint (rhyme, meter, structure, singability, address grade, ambiguity rules, etc.). Cross out any constraint *not* demonstrably essential to achieving the Core. Circle the 2-3 most critical ("load-bearing").
      *   **Sufficient Answer:** A drastically shortened constraint list. Load-bearing constraints are those whose absence would make the poem fail its Core function (e.g., singability for the lullaby, the changed word's impact for the monument poem, temporal/gender ambiguity for the elegy).
      *   **Test:** Ask: "If I broke *this* constraint, would the poem still achieve its Core Sentence goal?" (Pass for Load-Bearing: No, it would fail. Pass for Non-Load-Bearing: Yes, it might weaken but not destroy the core function).

  3.  **Confront Obligations & Decisions: (15 min)**
      *   **Step A (Source -> English):** Identify what the source *must* express but English struggles with (e.g., address grade, lack of tense/definiteness). Brainstorm 3-5 *different* English strategies for *each* (e.g., for address grade: added endearment/title, dialect choice, verb choice (thee/you), surrounding context implication).
      *   **Step B (English -> Source):** Identify what English *forces* you to specify that the source leaves open (tense, gender, articles). Make *deliberate choices* for each based *solely* on the Core Sentence (e.g., "Core is timeless feeling -> use simple present tense"; "Core is anonymity -> use 'they' & avoid gendered nouns"; "Core is intimacy -> use 'the' where natural").
      *   **Sufficient Answer:** A list of specific problems and consciously chosen strategies/decisions. No accidentals allowed.
      *   **Test:** For each strategy/decision, ask: "Does this *actively serve* the Core Sentence?" (Pass: Yes, demonstrably. Fail: No, it feels arbitrary or works against the core).

  4.  **Draft Brutally: (60 min)**
      *   **Step:** Write the *simplest*, most direct English version possible that satisfies the Load-Bearing Constraints and implements your chosen Strategies/Decisions from Step 3. Prioritize meaning and core function over elegance. Ignore non-load-bearing constraints for now. Aim for singability/readability if applicable. *Get words on paper.*
      *   **Sufficient Answer:** A complete, rough English draft. It will be ugly. That's fine.
      *   **Test:** Does it have the right number of lines? Does it *attempt* the load-bearing constraints? Does it implement the key decisions? (Pass: Yes, even if poorly. Fail: No. Write *something*).

  5.  **Revise Against Core & Constraints: (30 min)**
      *   **Step:** Refine the draft. Work on rhythm, sound, and non-load-bearing constraints *only if* they serve the Core Sentence and don't break load-bearing ones. Sacrifice non-load-bearing constraints freely if they fight the Core or load-bearers.
      *   **Sufficient Answer:** The best version achievable in the time that prioritizes Core + Load-Bearers.
      *   **Test:**
          *   **Aloud Test:** Read it aloud. Does it *sound* right for the scene/character? Does it trip the tongue? (Pass: Sounds functional/appropriate. Fail: Sounds awkward or wrong for the moment).
          *   **Core Test:** Read it alongside Step 1. Does it *do* the thing? (Pass: Yes, reasonably well. Fail: No, it misses the point).
          *   **Load-Bearer Test:** Does it satisfy the circled constraints from Step 2? (Pass: Yes. Fail: No. Revise until pass or see Step 6).

  6.  **Break Form Deliberately (If Necessary):**
      *   **Step:** If a Load-Bearing Constraint *cannot* be satisfied without destroying the Core:
          *   **Option 1 (Sacrifice):** Acknowledge which constraint *must* be broken. Break it as minimally and visibly as possible (e.g., add one syllable, use slant rhyme, slightly rephrase the changed word line). *Ensure the break serves the Core*.
          *   **Option 2 (Compensate):** Can you add something *else* (sound, image, subtle word choice) that compensates for the lost constraint effect? Does this compensate *more* effectively than a minimal break?
      *   **Deliberate Break vs. Failure:** A deliberate break is *documented* (you know *why* and *what* broke) and *minimal*. A failure is unintentional, hidden, or damages the Core.
      *   **Sufficient Answer:** A version that passes the Core Test and Aloud Test, with a note on what was broken/done deliberately and why.
      *   **Test:** "Is the break necessary to preserve the Core, and is it the *smallest* possible break?" (Pass: Yes. Fail: No, it's either unnecessary or too large/damaging).

  **Sequence Stop:** After Step 5 (if tests pass) or Step 6 (if a deliberate break is needed and implemented). You have a functional draft serving the novel's needs.

  **What's Lost/Dropped:**
  *   Nuance within ambiguity (English often forces a *type* of ambiguity).
  *   Perfect equivalence (acknowledged by Hofstadter).
  *   Subtle interplay of *all* constraints (prioritization is brutal).
  *   **Misfires:** If Core Sentence is wrong, everything fails. If you misunderstand the source poem's *meaning*, the procedure can't save you ("garbage in, garbage out"). It prioritizes function over absolute poetic merit.
  *   **Laundered Judgment Calls:** Defining "Core," choosing load-bearing constraints, deciding compensation strategies – these remain judgments, but the procedure forces you to make them *explicit* and *first*.

  ---

  **Application to Your Poems**

  **Poem 1: Deathbed Lullaby (Singability Non-Negotiable)**

  1.  **Core:** "To offer simple, rhythmic comfort to a dying child, using familiar, gentle imagery."
  2.  **Load-Bearing Constraints:** Singability (Meter/Syllables paramount, rhyme secondary but important), Address Grade (Child - essential!), Simplicity/Directness. *(Formal structure, internal rhyme specifics = Non-Load-Bearing if they fight singability/address)*.
  3.  **Obligations/Decisions:**
      *   *Source -> English:* **Address Grade (Child):** Strategy - Use simple, intimate words ("wee," "little," "dear"), gentle verbs ("sleep," "dream"), soft sounds. **No Tense:** Decision - Use timeless present imperative ("Sleep now," "Dream of") and simple present ("stars glow"). **No Definiteness:** Decision - Use "the" only where it feels natural in a lullaby ("the moon," "the soft breeze").
      *   *English -> Source:* Forced tense/gender/definiteness handled above.
  4.  **Draft Brutally:**
      (Source Quatrain 1 - Invented Lang)
      Looma val, kireen sol (Moon shine, small wind blow)
      Tana pree, shilka rol (Eyes close, sleep take hold)
      Senn fa *mirra*, veska tol (Stars like *berries*, night sky dark)
      Kessa *lin* baya gol (Hush now *child*, fear be gone)
      (Quatrain 2 similar structure... Last line: Looma val, kireen **nol** (Moon shine, small wind **still**))
      *Draft:*
      Moon glow soft, wind blow low,
      Close your eyes, let sleep grow.
      Stars like berries, dark sky deep,
      Hush now, **little one**, no fear to keep.
      Dreams drift in on feathers bright,
      Through the quiet, peaceful night.
      Hold my hand, feel warmth near,
      Moon glow soft, wind **still** and dear. *(Changed word: "low" -> "still")*
  5.  **Revise & Test:**
      *   *Aloud:* Flows well, gentle rhythm (8-ish syllables, some flexibility for singability). Sounds like a lullaby. Pass.
      *   *Core:* Offers comfort, simple imagery, clear address to child ("little one"). Pass.
      *   *Load-Bearers:* Singable (meter workable). Address Grade clear (child). Pass. *(Sacrificed perfect syllable count & exact internal rhyme position for singability - a deliberate non-load-bearing break).*
      *   **Result:** Acceptable. The slight metrical variation ("little one" = 3 syllables needing care in singing, "no fear to keep" slightly compressed) is a worthwhile trade for clarity of address and natural English.

  **Poem 2: Monument Poem (Changed Word Crucial)**

  1.  **Core:** "To convey enduring, defiant memory through a carved public inscription; the precise change in the final line reveals the shift from aspiration to lived reality."
  2.  **Load-Bearing Constraints:** The **changed word** and its **impact** (Load-Bearing!), Formal Structure (8 lines, 2 quatrains - monument needs shape), Last line = First line + one change. *(Internal rhyme specifics, exact syllable count = Non-Load-Bearing)*.
  3.  **Obligations/Decisions:**
      *   *Source -> English:* **Address Grade (Superior/Formal):** Strategy - Use formal diction, archaic tone if helpful ("ye," "shall," "behold"), implied respect. **No Tense:** Decision - Use timeless present perfect or simple present implying permanence ("We build," "Stone endures," "They are remembered"). **No Definiteness:** Decision - Use articles minimally; imply definiteness through context ("the stone," but "memory endures").
      *   *English -> Source:* Forced tense/gender/definiteness handled above. **Crucial:** English word order may move the changed word. Decision: *Prioritize impact over position.* Ensure the changed word is *emphatic*, even if not last. Consider minor word order inversion if possible/not awkward.
  4.  **Draft Brutally:**
      (Source Quatrain 1)
      Vorin tal *marak* durim (Spirit strong *build* forever)
      Sten vak ni, korim turim (Stone speak not, memory endure)
      ... (Quatrain 2) ...
      Last Line: Vorin tal **norim** durim (Spirit strong **dwell** forever)
      *Draft:*
      With spirits strong, **we build** for endless years,
      In silent stone, dissolving ancient fears.
      No voice cries out, yet memory stands fast,
      Defying time, while generations pass.
      The cost is carved in lines both sharp and deep,
      The watch we kept while others were asleep.
      The promise made beneath the sun's first glance,
      With spirits strong, **we dwell** in this hard stance.
  5.  **Revise & Test:**
      *   *Aloud:* Formal, weighty, appropriate for a monument. Pass.
      *   *Core:* Conveys endurance, defiance, memory. The change "build" -> "dwell" reveals the shift to hardened permanence. Pass.
      *   *Load-Bearers:* Changed word present and impactful ("build" -> "dwell"). Structure (8 lines, 2 quatrains, last=first+change). Pass. *(Sacrificed exact syllable count & internal rhyme scheme. The changed word is not the last word in the line ("we dwell..."), but "dwell" is strongly placed and the change is clear. A deliberate compromise for impact and natural English syntax)*.
      *   **Result:** Acceptable. The changed word ("dwell") is prominent enough despite not ending the line, achieving the core revelation.

  **Poem 3: Elegy (No Name, No Time)**

  1.  **Core:** "To express profound communal grief and enduring absence without ever specifying who died or when they died, creating a timeless, universal void."
  2.  **Load-Bearing Constraints:** **Ambiguity of Subject/Time** (Load-Bearing!), Emotional Weight. *(Formal structure, rhyme, meter = Non-Load-Bearing if they force specificity)*.
  3.  **Obligations/Decisions:**
      *   *Source -> English:* **No Tense:** Decision - Use simple present ("is gone," "grief remains," "memory stands") and present perfect ("has left") to imply ongoing absence without past marking. **No Gender:** Decision - Use "they/them" exclusively for the deceased. Avoid inherently gendered nouns (use "person," "soul," "presence" instead of "man," "woman," "father"). **No Definiteness:** Decision - Avoid articles where possible ("Grief remains," "Space stands empty"). Use "a" for generality ("a space," "a silence").
      *   *English -> Source:* English forces tense/gender/definiteness choices. Decisions made above to *preserve ambiguity*.
  4.  **Draft Brutally:**
      (Source Example - Untensed, Ungendered, Indefinite)
      Kir vant, salla *tren* (Wind change, song *break*)
      Pella *rin*, morna fen (Path *empty*, sorrow deep)
      ... etc. ...
      *Draft:*
      The wind has changed, the song is broke.
      A path is empty, deep the ache.
      Not stone nor sea can fill the space
      Where once stood **a** beloved face.
      No name is spoken, yet all know
      The shape of where **they** used to go.
      The light is dimmer now, and cold,
      A story left forever untold.
  5.  **Revise & Test:**
      *   *Aloud:** Somber, heavy, evokes emptiness. Pass.
      *   *Core:** Expresses deep grief and absence. Subject is ambiguous ("a beloved face", "they"). Time is ambiguous ("is broke," "has changed," "used to go" imply past event but "space stands," "ache," "light is dimmer" are present state). Pass.
      *   *Load-Bearers:** Ambiguity preserved ("a beloved face," "they," mixed timeless tenses). Emotional weight achieved. Pass. *(Sacrificed formal structure - lines vary slightly in syllable count/meter; rhyme is loose. This maintains ambiguity and weight - deliberate non-load-bearing breaks)*.
      *   **Result:** Acceptable. English forces some choices ("a face," "they," verb tenses) but ambiguity of *identity* and the *timeless feeling of loss* are preserved as the core requires.

  **Procedure's Limitations Exposed:**
  *   It produced functional, novel-serving drafts efficiently.
  *   It forced explicit prioritization (e.g., singability over perfect form, ambiguity over rhyme, word impact over position).
  *   It required deliberate choices for English's forced specifications.
  *   **The Loss:** None of the translations are "perfect" poems standing alone. They are compromises shaped by the Core Sentence and the brutal hierarchy of constraints. The elegance of the invented form is necessarily diminished in places. This is the loss Hofstadter acknowledges – you preserve what *this* poem needs for *this* book.
  *   **Novelist vs. Translator:** Choosing the Core Sentence is the novelist's ultimate act. Deciding a constraint is non-load-bearing (e.g., sacrificing perfect rhyme for the elegy's ambiguity) is a novelist's choice about the book's priorities. The translator character works within the constraints *given* by the source poem; the novelist defines which aspects of that source are sacred for the story's sake. The procedure makes you wear both hats consciously.
