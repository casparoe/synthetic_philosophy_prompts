              - In Group B, the 20-minute wait is broken into two parts: first 10 minutes and then another 10 minutes. At each step, the immediate reward is tempting, so more people take the immediate reward.

            Then, we map to philosophy:

              - Weakness of will (akrasia): acting against one's better judgment.

              - In this experiment, at t0, a participant in Group B might judge that waiting for 2 tokens is best. But then at t0+10, they might take the 1 token immediately. This is a reversal.

              - But note: the reversal might be due to the change in the situation: now the reward is immediate.

              - However, the participant at t0+10 might still judge that waiting for 2 tokens is best, but the immediate temptation is strong. This is weakness of will.

              - But wait: in the One Interval case (Group A), they don't face the immediate temptation. So the design of the choice situation (breaking the interval) can manufacture weakness of will.

              - The gap: in a token game, the stakes are low and the waiting is artificial. In real life, weakness of will often involves more complex judgments and emotions.

              - Also, in this experiment, the reversal is predictable: we can ask at t0 whether they plan to wait the full 20 minutes in Group B. They might say yes, but then at t0+10 they change. This is a failure to stick to a plan.

            We can discuss the distinction:

              - Acting against what you judge best at the moment (at t0+10, they might judge that waiting is best but take the immediate anyway) vs. failing to stick to a plan made earlier.

              - The experiment shows that the preference reversal can be induced by the description of the intervals.

              - This blurs the distinction: the agent's judgment of what is best might change with the description of time, even if the objective situation is the same? In Group A and Group B, the objective waiting time for the large reward is the same (20 minutes). But the description changes the choices.

          Finally, what the activity can't reproduce:

            - Weakness of will in the strict sense often involves moral or prudential judgments (e.g., about health, studying) that are more complex than tokens.

            - The tokens are a proxy, but in real life, the rewards are not so easily quantified.

            - Also, the waiting in the session is short and under controlled conditions. Real-life waiting involves distractions and competing goals.

            - Moreover, in this experiment, the reversal is about changing preferences over time due to hyperbolic discounting, which is a model of time inconsistency. Weakness of will is often understood as a failure of self-control even when the agent's evaluation of the options hasn't changed (they still judge the distant reward as better, but they yield to temptation). In this experiment, at the moment of choice, the agent might not judge the distant reward as better because the immediate reward is more salient? So it's not clear if it's a judgment shift or a brute desire.

          We can discuss these limitations.

          Revised activity plan:

            Duration: 90 minutes

            Materials:
              - Tokens or vouchers (paper slips) that can be redeemed for small prizes at the end.
              - A timer or clock.
              - Whiteboard to record results.

            Prizes: e.g., chocolate bars, or raffle tickets for a book. We need to make the tokens valuable. Example: 
                - 1 token = 1 small chocolate
                - 2 tokens = 3 small chocolates (so waiting for 2 tokens is better per token) or 2 tokens = 1 big chocolate.

            Steps:

              0-10 minutes: Introduction
                  - Explain the concept of intertemporal choice and discounting.
                  - Mention that we will do an activity to explore how people make choices over time.

              10-30 minutes: Activity
                  - Split into two groups (Group A and Group B). Random assignment.
                  - Explain the choices to each group separately (hand out instructions).

                  Group A instructions (One Interval):
                    "You have a choice:
                      Option A: 1 token in 10 minutes.
                      Option B: 2 tokens in 20 minutes.
                    Please write your choice on the slip. If you choose Option A, you will get 1 token at 10 minutes. If you choose Option B, you will get 2 tokens at 20 minutes."

                  Group B instructions (Multiple Intervals):
                    "You have a choice now:
                      Option A: 1 token immediately.
                      Option B: 2 tokens in 10 minutes.
                    If you choose Option A, you will get the token right now. If you choose Option B, then in 10 minutes you will face another choice: 
                      Option X: 1 token immediately at that time (in 10 minutes)
                      Option Y: 2 tokens in 20 minutes from now (i.e., 10 minutes after that).
                    Please write your choice for the first decision on the slip."

                  - Collect the choices at t0.
                  - For Group B who choose Option B, at t0+10, give them the second choice:
                      "Now you have:
                        Option X: 1 token immediately.
                        Option Y: 2 tokens in 10 minutes (which is at t0+20)."
                    Collect their choices.

                  - Distribute tokens as they are due.

              30-40 minutes: Data Collection and Display
                  - Write the results on the board.

                  Group A:
                      Chose Option A (1 token at 10 min): [count]
                      Chose Option B (2 tokens at 20 min): [count]

                  Group B:
                      First choice: 
                          Option A (1 token now): [count]
                          Option B (2 tokens at 10 min): [count]
                      Of those who chose Option B at first, at the second choice:
                          Option X (1 token at 10 min): [count]
                          Option Y (2 tokens at 20 min): [count]

                  - Calculate:
                      Proportion in Group A that chose to wait for 2 tokens: pA = [nB] / [total A]
                      Proportion in Group B that ended up with 2 tokens (i.e., chose B then Y): pB = [nY] / [total B]

                  - Compare pA and pB. Typically, pA > pB.

              40-85 minutes: Debrief and Discussion
                  - Explain the common difference effect and hyperbolic discounting.
                  - Relate to the philosophy of weakness of will.
                  - Discuss the implications for how we describe time intervals (e.g., breaking a diet into one long fast vs. many small daily decisions).
                  - Discuss the limitations: tokens vs. real-life decisions, the role of judgment vs. desire, etc.

              85-90 minutes: Wrap-up and distribute prizes.

          What if no one cares about the tokens?
            - Use a more engaging prize (e.g., a rare chocolate, a popular book).
            - Or use points that count toward a donation to a charity of their choice? But that might be complex.

          What if the effect doesn't show (pA not greater than pB)?
            - This is a risk with a small sample. Have the literature results ready to show.

          We can also run the activity with the entire group as Group A first, then as Group B? But that would take 40 minutes and we have only 20 minutes for the activity. We do between-subject.

          Given the time, this is feasible.

          Let's go with this.
