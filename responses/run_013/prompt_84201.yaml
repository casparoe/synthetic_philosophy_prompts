  Here's a runnable 90-minute session plan focused on time inconsistency and preference reversals, designed to create an experiential "aha" moment for participants. The activity compresses real waiting into the session, includes subgroup comparisons, and incorporates a trading element to reveal inconsistencies.

  ### **Session Structure**
  1. **Intro (10 min)**  
  2. **Core Activity (45 min)**  
  3. **Trading & Data Collection (15 min)**  
  4. **Debrief & Philosophy Discussion (20 min)**  

  ---

  ### **Core Activity: "Time Chunks" Experiment**  
  *Design*: Split participants into **Group A (One Interval)** and **Group B (Chunked Intervals)**. Use tokens redeemable for prizes (e.g., gourmet chocolates, bookstore vouchers) to incentivize choices.  

  #### **Materials**  
  - Tokens (colored poker chips or printed cards)  
  - Timers (phone/stopwatch)  
  - Whiteboard for recording choices  
  - Prizes: Small (e.g., 1 chocolate), Large (e.g., 3 chocolates)  
  - Claim vouchers (paper slips) for deferred rewards  

  #### **Rules & Payoff Scheme**  
  - **All tokens are hypothetical until redeemed** at the session’s end.  
  - **Group A (One Interval)**:  
    - Choice: *Now* vs. *Later*  
    - Option 1: **2 tokens at 15 min** (small reward)  
    - Option 2: **3 tokens at 30 min** (large reward)  
    - *They wait 30 min in one block*.  

  - **Group B (Chunked Intervals)**:  
    - **Choice 1 (at start)**:  
      - Option 1: **1 token now**  
      - Option 2: **Voucher for 3 tokens at 30 min**  
    - **Choice 2 (at 15 min)**: *Only if they chose Option 2 in Choice 1*  
      - Option 1: **1 token now** (ends wait)  
      - Option 2: **2 tokens at 30 min** (continue waiting)  
    - *Note: Choosing "now" at either point ends their wait; choosing "later" both times yields 3 tokens*.  

  #### **Procedure**  
  1. **Split Groups**: Randomly assign 7–8 people to Group A and 7–8 to Group B.  
  2. **Explain Choices**:  
     - *Group A*: "Do you want 2 tokens in 15 min or 3 tokens in 30 min?"  
     - *Group B*: "First, choose: 1 token now OR a voucher for 3 tokens in 30 min. If you pick the voucher, in 15 min you’ll choose again: 1 token then OR 2 tokens at 30 min."  
  3. **Waiting Period (30 min)**:  
     - Participants sit silently (emphasize the wait). Fill time with a low-engagement task (e.g., reading a neutral short passage).  
     - **At 15 min**: Distribute tokens to Group A (if they chose Option 1) and Group B (if they chose "now" at Choice 1 or 2).  
     - **At 30 min**: Distribute remaining tokens.  
  4. **Record Choices**: Track initial/final decisions on a whiteboard:  
     - Group A: % who waited for 3 tokens.  
     - Group B: % who took "now" at Choice 1, % who took "now" at Choice 2, % who waited fully.  

  ---

  ### **Trading Phase (15 min)**  
  *Goal*: Reveal the market value of waiting and expose inconsistencies between public claims and private valuations.  

  1. **Issue Tradeable Vouchers**:  
     - All participants receive vouchers representing their *final* token claims (e.g., "2 tokens at 30 min").  
  2. **Open Trading**:  
     - Participants can trade vouchers for 5 min.  
     - Rules: "You may buy/sell vouchers with other participants. All vouchers expire at the end of the session."  
  3. **Record Prices**:  
     - Track trades on the board (e.g., "1 ‘3-token-at-30-min’ voucher sold for 1.5 ‘now’ tokens").  

  #### **Expected Outcome**  
  - Group B’s vouchers (for interrupted waits) will trade at a discount vs. Group A’s.  
  - Participants who *claimed* they value waiting may sell cheaply, revealing inconsistency.  

  ---

  ### **Debrief & Philosophy Discussion (20 min)**  
  **Key Findings to Highlight**:  
  1. **Reversal Rates**:  
     - Group A (one interval) will have higher full-wait rates than Group B (chunked intervals).  
     - *Why*: Breaking time into chunks steepens discounting (psychology’s "subadditive discounting").  

  2. **Trading Inconsistencies**:  
     - Those who waited may sell vouchers cheaply, showing their *stated* patience ≠ *revealed* value.  

  #### **Philosophy Bridge**  
  1. **Weakness of Will vs. Time Inconsistency**:  
     - **Weakness of will (akrasia)**: Acting against your *best judgment* (e.g., "I know salad is healthier, but I eat cake").  
     - **Time inconsistency**: Reversing a *prior plan* due to hyperbolic discounting (e.g., "I planned to diet, but I see cake now").  
     - *Crucial gap*: The activity shows **preference reversals from framing**, not judgment errors. Participants didn’t judge waiting as "best" and then fail—they changed preferences based on *how time was described*.  

  2. **Why Description Matters**:  
     - Chopping time into intervals makes delays feel salient, triggering impulsivity.  
     - Real-world example: Saving $100/month feels harder than saving $1,200/year, even if identical.  

  3. **Limitations of the Activity**:  
     - 🚫 **Not true weakness of will**: Tokens lack moral/emotional weight (e.g., health, ethics). Weakness of will requires a *normative judgment* ("I should do X"), not just impulsivity.  
     - 🚫 **No introspection**: Participants reversed preferences without realizing it (framing effect), whereas weakness of will involves conscious conflict.  
     - 🚫 **Compressed time**: Real-life waits involve uncertainty/self-identity ("I’m a saver!"), absent here.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **"Nobody cares about tokens!"**  
     - *Fix*: Use high-value prizes (e.g., $20 bookstore vouchers) or self-deprecating humor ("Yes, I’m bribing you with chocolate").  

  2. **Group B confusion at Choice 2**  
     - *Fix*: Re-read rules at 15 min; use simple voucher language ("Trade this for 1 token NOW or 2 tokens LATER").  

  3. **Awkward silence during waits**  
     - *Fix*: Play ambient music; use filler tasks (e.g., "Write one word describing waiting").  

  4. **Trading phase flops**  
     - *Fix*: Seed trades by asking 2–3 participants to publicly bid (e.g., "Who’ll sell a 30-min voucher for 1 ‘now’ token?").  

  5. **Small sample size skews results**  
     - *Fix*: Pre-paste expected results from studies (e.g., "60% wait in one interval; <20% in chunks") and contrast with your data.  

  ---

  ### **Why This Works**  
  - **Experience > Lecture**: Participants *feel* the reversal (squirming in silence makes it visceral).  
  - **Public/Private Gap**: Trading exposes how we undervalue our own future resolve.  
  - **Clear Philosophy Link**: Distinguishes "I changed my mind" (framing) from "I failed myself" (akrasia).  

  This bridges psychology and philosophy by making abstract bias tangible—and ends with a punchy insight: **Your will isn’t weak; time is just sneaky**.
