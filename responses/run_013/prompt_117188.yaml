answer: |-
  ### Essay Question  
  **Jeremy Bentham's unpublished writings on sexual offences argue for the decriminalization of "unnatural" consensual acts (e.g., homosexuality, sodomy) on utilitarian grounds, while his general penal theory insists that "secondary mischief" (alarm, danger of imitation, erosion of moral norms) often justifies punishment even for acts causing no direct harm. Reconstruct Bentham’s utilitarian case against punishing consensual sex acts (a); explain his critique of the "unnatural" objection (b); and critically evaluate whether his dismissal of secondary mischief in sexual cases (e.g., public disgust, weakened sanctions) is consistent with his broader penal theory (c). In your view, does Bentham’s appeal to "general happiness" here tacitly rely on a conception of "naturalness" his utilitarianism officially rejects?**

  ---

  ### Model Answer (Approx. 600 words)  

  **(a) Utilitarian Case Against Punishment**  
  Bentham’s core argument against criminalizing consensual sexual acts is that they produce no *primary mischief* (direct harm to assignable individuals). Punishment itself, however, creates primary mischief through the pain inflicted on the accused. Given the absence of victims, the pain of punishment cannot be justified as prevention of greater pain. Critically, Bentham argues that such acts may even *increase* happiness by providing pleasure to consenting parties without infringing on others’ interests. Thus, criminalization violates utilitarianism’s foundational principle: it increases net suffering without countervailing benefits.  

  **(b) The "Unnatural" Objection and Bentham's Critique**  
  Opponents claimed "unnatural" acts (e.g., sodomy) were intrinsically immoral due to violating nature’s design, justifying punishment regardless of harm. Bentham dismantles this in four steps: (1) The objection is circular – acts are deemed "unnatural" *because* they are condemned, not vice versa. (2) "Nature" is an incoherent moral standard; humans constantly alter nature (e.g., medicine, agriculture). (3) Disgust is not a reliable moral guide, as it is culturally contingent and often weaponized against harmless pleasures. (4) Crucially, the objection cannot be grounded in utility: if an act causes no harm, its "unnaturalness" is irrelevant to happiness.  

  **(c) Inconsistency on Secondary Mischief**  
  Bentham’s dismissal of secondary mischief in sexual cases conflicts with his general penal theory. Elsewhere (e.g., *Principles of Penal Law*), he argues that even victimless crimes (like public drunkenness) may warrant punishment if they cause *alarm* (public anxiety) or *danger* (risk of imitation eroding social order). Yet in his sexual writings, he dismisses alarm over "unnatural" acts as irrational prejudice, claims disgust will fade if laws change, and denies any real danger of the practices spreading uncontrollably. This is inconsistent: if secondary mischief justifies punishing non-sexual "victimless" acts, why not here? Bentham seems to selectively minimize the *empirical likelihood* of alarm/danger in sexual cases, whereas his general theory treats secondary mischief as a *normative category* justifying intervention whenever society perceives a threat to stability, however irrational.  

  **The "Naturalness" Paradox**  
  Bentham’s insistence that decriminalization won’t cause widespread alarm or social decay subtly presumes that these acts are marginal and won’t fundamentally alter heterosexual norms. This relies on an unstated, non-utilitarian assumption about human nature: that "deviant" desires are rare and contained, thus posing no systemic risk. By contrast, his general penal theory treats public sentiment as a utility-relevant fact, regardless of its rationality. His sexual ethics thus implicitly appeals to a stable, "natural" social order his utilitarianism officially cannot endorse.  

  **Scholarly Context**  
  *Settled*: Scholars agree Bentham was radically liberal for his era and that he rejected "unnaturalness" as morally vacuous. His emphasis on consent and harm is seen as foundational to liberal utilitarianism.  
  *Contested*: Whether his handling of secondary mischief is inconsistent remains debated. Some (e.g., Schofield) see it as pragmatic recognition of prejudice’s intractability; others (e.g., Boralevi) argue it reveals a tension in utilitarianism itself: must it accommodate irrational social feelings to maximize happiness? The "naturalness paradox" interpretation is a live scholarly critique.  

  ---

  ### Marking Scheme (Total: 20 Marks)  
  **A (17-20):**  
  - **(a)** Clearly distinguishes primary vs. secondary mischief; explains why punishment’s pain outweighs benefits *given no direct harm* (3 marks).  
  - **(b)** Fully unpacks Bentham’s 4-pronged critique of "unnaturalness," including its circularity and utility-irrelevance (4 marks).  
  - **(c)** Identifies the *normative core* of the inconsistency: Bentham rejects alarm as irrational prejudice in sexual cases but accepts it as utility-relevant elsewhere (e.g., public order offences) (5 marks).  
  - **Critical Insight:** Argues persuasively that Bentham’s optimism about social stability tacitly relies on unexamined assumptions about "natural" desires (3 marks).  
  - **Scholarship:** Notes key debates (e.g., Boralevi vs. Schofield) on consistency (2 marks).  
  - **Structure:** Logical flow; precise terminology ("secondary mischief," "alarm") (3 marks).  

  **B (13-16):**  
  - **(a)** Explains no direct harm but omits comparison to punishment’s costs (2 marks).  
  - **(b)** Describes Bentham’s rejection of "unnaturalness" but misses 1-2 key arguments (e.g., omits cultural contingency) (3 marks).  
  - **(c)** States Bentham dismisses secondary mischief for sex acts but treats it as merely empirical ("he thought it wouldn’t spread") without contrasting normative treatment elsewhere (3 marks).  
  - **Critical Insight:** Notes tension but doesn’t articulate the "naturalness paradox" (1 mark).  
  - **Scholarship:** Mentions lack of consensus but no specific references (1 mark).  
  - **Structure:** Generally coherent but less precise (2 marks).  

  **Common Errors:**  
  - **(a)** *Error:* "Bentham opposed punishment because he was progressive." *Correction:* Must derive from utility calculus.  
  - **(b)** *Error:* "Bentham said unnatural acts aren’t real." *Correction:* He attacked the *moral logic*, not the acts’ existence.  
  - **(c)** *Error:* "Bentham ignored secondary mischief completely." *Correction:* He engaged then dismissed it inconsistently.  
  - **Critical Insight:** *Error:* "Bentham was fully consistent." *Correction:* Must grapple with normative vs. empirical handling of alarm.  

  ---  
  **Exam Logistics:**  
  - **Time Allocation:** 10 mins planning, 40 mins writing, 10 mins review.  
  - **Texts:** References to Bentham’s *Principles of Penal Law* (general theory) and *Offences Against One’s Self* (c. 1785, unpublished) are implied but not cited.  
  - **Focus:** Reward analysis of *why* the inconsistency matters (utilitarianism’s flexibility vs. incoherence) over biographical details.
