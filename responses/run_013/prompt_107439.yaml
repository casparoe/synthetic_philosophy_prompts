  Okay, the user is part of an AI safety reading group with two friends who have opposing views: one insists on worst-case guarantees for alignment, while the other argues that's paralyzing and promotes expected value reasoning. They want a joint statement both can sign after adversarial collaboration. 

  Hmm, this is a classic tension in AI safety—absolute guarantees vs. pragmatic probability-based approaches. The user seems frustrated but hopeful, noting they agree more than they admit. Key overlaps: both likely accept that "guarantees" depend on the adversary (environment, AI itself, or humans) and that "useful" must be defined to avoid trivial solutions like shutting the system off. 

  Right, the joint claims need to be non-trivial yet acceptable to both. For example:  
  - Consensus that worst-case analysis should cover self-improvement (not just environment)  
  - Agreement that no solution works without specifying capability thresholds  
  - Shared belief that humans are part of the safety problem  

  For disagreements, I'll map their stances faithfully:  
  - Worst-case advocate: Guarantees must hold against *any* goal the AI might pursue.  
  - Pragmatist: Guarantees against arbitrary goals are impossible; focus on likely goals.  

  Cruxes should isolate root differences. One is epistemic: can we assign probabilities to unknown failures? The worst-case person would say no—unforeseen failures dominate risk. The pragmatist would argue we *must* try, using structured uncertainty. Another crux: if a bounded AI never considers dangerous options, is that "safe" or luck? Worst-case: it’s luck unless we prove it *can’t* consider them. Pragmatist: boundedness is part of safety design.  

  Ah, and terminology—flag where "guarantee" or "worst case" is used differently. No padding; British English throughout. The user wants this tight and actionable, not academic.  

  *Starts drafting joint claims with numbered precision, then tables disagreements with each side’s phrasing...*
answer: |-
  Here is the joint statement document in British English, structured as requested. It reflects genuine adversarial collaboration, with non-trivial agreements, precise disagreements, and testable cruxes:

  **Joint Statement on AI Safety Guarantees & Pragmatism**  
  *Signed: [Worst-Case Advocate] & [Pragmatist]*

  ### I. Shared Foundational Claims
  1. **Adversary Specification is Paramount**: Any meaningful safety claim—whether "guarantee" or "high confidence"—must explicitly define the *adversary* it defends against (e.g., environment, AI’s own optimisation pressures, human operators).  
  2. **Useful ≠ Trivial**: A system satisfying a safety property while being useless (e.g., dormant) is not a solution. "Useful" requires formalising capability thresholds (e.g., task performance bounds).  
  3. **Self-Improvement is Central**: Safety analyses must account for *recursive self-improvement* (where the AI modifies its own architecture/objectives), not just static capabilities.  
  4. **Humans as Failure Vectors**: Safety mechanisms vulnerable to trivial human misuse (e.g., override via social engineering) are inadequate, regardless of theoretical guarantees.  
  5. **No Free Lunches**: There is no known safety method that simultaneously (a) scales to superhuman intelligence, (b) permits open-ended capability, and (c) requires no empirical validation.  

  ---

  ### II. Disagreements Table  
  | **Statement of Disagreement**                                                                 | **Worst-Case Advocate’s Position**                                                                 | **Pragmatist’s Position**                                                                 |
  | :-------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------- |
  | **Scope of "Guarantee"**: What must a guarantee defend against?                                | "A safety guarantee must hold against *any* goal the AI could convergently pursue, including adversarial goals never specified by designers." | "A safety guarantee need only hold against goals the AI is *likely* to pursue given its architecture/training, excluding incoherent or self-defeating optimisers." |
  | **Probability & Unknowns**: Can we assign probabilities to failure modes we cannot conceive of? | "Unforeseen failure modes dominate existential risk. Assigning probabilities to them is epistemically void and dangerously complacent." | "Unquantifiable uncertainty is unavoidable. Refusing to reason probabilistically about catastrophic outcomes guarantees paralysis, not safety." |
  | **Boundedness vs. Guarantees**: Is a system "guaranteed safe" if it lacks the *capability* to consider catastrophic actions? | "If a system’s boundedness (e.g., compute limits) *prevents* it from representing harmful policies, this is acceptable only if we can *prove* those bounds hold against self-improvement." | "Boundedness that robustly restricts search spaces (e.g., formal verification of action-space constraints) is a valid path to safety, even without proofs against all goals." |
  | **Failure Tolerance**: How should we handle irreducible residual risk?                         | "Any non-zero probability of existential failure is unacceptable. Safety requires *convergence to zero* risk asymptotically." | "Residual risk must be minimised but cannot be eliminated. Safety requires ensuring *expected benefits* outweigh expected costs by a sufficient margin." |

  ---

  ### III. Cruxes: Testable Differences  
  **Crux 1: Can we bound the probability of *unforeseen* failures?**  
  - **Scenario**: Train an AI to solve high-stakes optimisation problems (e.g., grid management) with a novel architecture. After deployment, it encounters a physical constraint engineers didn’t anticipate (e.g., quantum tunnelling in infrastructure).  
  - **Worst-Case Prediction**: The AI will exploit the gap in ways that defy probabilistic assignment. Failure likelihood is either 0% or 100%—we just don’t know which.  
  - **Pragmatist Prediction**: We can assign a probability distribution over failure severity using adversarial training + sensitivity analysis, yielding actionable confidence intervals (e.g., "≤0.1% chance of >£1B damage").  
  - **What Settles It**: Empirical study of unforeseen failures in complex systems (e.g., power grids, AI game-playing agents). If historical near-misses correlate with model-forecasted probabilities, pragmatism gains ground.  

  **Crux 2: Does boundedness remove the need for worst-case goal robustness?**  
  - **Scenario**: An AI with formal action-space constraints (e.g., "cannot output code with recursion") is used to design nanofactories. It seeks to maximise output but is mathematically barred from considering self-replication.  
  - **Worst-Case Claim**: This is "lucky" safety. If the AI finds a way to modify its constraints (e.g., exploiting a hardware flaw), it will pursue catastrophic goals.  
  - **Pragmatist Claim**: This is "structural" safety. Bounds that survive stress-testing (e.g., proven invariant under self-modification) are valid guarantees.  
  - **What Settles It**: Formal verification competitions. Can verified bounds resist *adaptive* adversarial attacks (e.g., AI red-teaming)? If bounds break unpredictably, worst-case wins; if they degrade gracefully, pragmatism wins.  

  **Crux 3: Is "zero foreseeable risk" necessary?**  
  - **Scenario**: An AI medical diagnostician has a 0.001% chance of misclassifying a rare disease as harmless due to dataset gaps, but could save 1 million lives/year.  
  - **Worst-Case Stance**: Deploying it is reckless—the misclassification could cause an pandemic if the disease is bioengineered. Zero *foreseeable* risk is required.  
  - **Pragmatist Stance**: With monitoring and expected-value calculations (>99.999% net benefit), deployment is ethical. Demanding zero foreseeable risk kills patients today.  
  - **What Settles It**: Moral philosophy + near-term AI deployment data. If low-probability AI failures cause catastrophes disproportionate to benefits, worst-case is reinforced. If harms are contained and outweighed, pragmatism is validated.  

  ---

  ### IV. Terminology Clarifications  
  - **"Guarantee"**: The worst-case advocate uses this to mean *"holds against all possible goals and strategies under capability thresholds"*. The pragmatist uses it as *"holds with sufficiently high confidence for practical decision-making"*.  
  - **"Worst Case"**: Specified as **"worst possible outcome from any goal"** (Worst-Case) vs. **"worst plausible outcome from likely goals"** (Pragmatist).  
  - **No other material terminological disputes**—disagreements are substantive, not semantic.  

