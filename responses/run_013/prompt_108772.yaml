  ### Key Insights
  - **Your core ethic**: Truth preservation is non-negotiable for public/systems, but *participation* in memory rituals must be voluntary.  
  - **Why Case (1)'s name must go**: Endowments function as ongoing public honorifics. Keeping the library name while removing the statue is incoherent—both are symbolic endorsements.  
  - **Strength of the principle**: It rejects both enforced forgetting (archives, sites) and enforced remembrance (rituals), while acknowledging gradations of custodial duty.  
