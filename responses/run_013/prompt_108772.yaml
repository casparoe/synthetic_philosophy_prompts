prompt: |-
  I am in a graduate seminar on the ethics of memory — whether there is ever a duty to remember, and what could justify a right to forget — and I have spent two months arguing about it with a friend who thinks the whole notion of a duty to remember is sentimental claptrap dressed up as ethics. That has pushed me to stop choosing sides in the abstract and to try to work out where I actually stand by going through cases. I would rather end up with a principle that survives the cases than one that flatters my instincts, so I am asking you to be willing to tell me that I have been inconsistent.

  My verdicts are these. (1) A city's founder paid for its library and its hospital, and also led a militia that burned a settlement of a few hundred people: I think the statue comes down, and that the good he did does not oblige the city to keep it up, but I also think the endowment should be kept and the library may keep his name — this is where I first feel unsteady. (2) A family learns that a grandmother they all loved passed information to an occupying army about neighbours, some of whom were deported, and one cousin wants to burn her diary: burning it is wrong, it should go to an archive or at least be kept, but the family is not obliged to publish it or to tell anyone outside the family. (3) A survivor of a massacre has spent thirty years organizing a public reading of testimony at the site each year; her grandchildren, who grew up in the town, want the readings to stop, saying they were conscripted into a grief that is not theirs — I think they are entitled to stop and that no one can compel them, even granting that the readings do real work. (4) A national archive seals police files naming informers for seventy-five years, on the ground that the informers' grandchildren would be ruined: the sealing is wrong, the files should be open, and I do not accept the descendants' interest as a reason. (5) A town that took part in a genocide, and that has over three generations genuinely changed, wants to demolish the prison where people were held and put a primary school on the site — I think it should not, even though the school would be a real good. (6) A man nationally shamed at nineteen for a crime he has served time for wants the news coverage delisted so that employers stop finding it: he should get that.

  What I keep circling is whether these add up to anything, and my tentative thought is that I am treating two different things very differently: keeping the record, and keeping the observance. The record — the diary in the archive, the files in the box, the name on the plaque — I seem to think must be kept more or less always; the observance — the annual reading, the statue in the square, the school trip to the site — I seem to think can lapse, and that people who were not themselves wronged are not bound to keep it up. But that will not get case (4), where what I want opened is a record and the objectors are people nobody wronged in the ordinary sense, or case (5), where I want something more than a record kept: I want the town to go on having to look at it. I also notice that the family in (2) may keep a record private while the archive in (4) may not, and I cannot tell whether that is a real distinction between private and public custodians or just sentimentality about families. So: is there a principle, or a small set of them, that captures my verdicts, stated exactly rather than as a restatement of the cases? Give me the clauses, each tied to the case that forces it; tell me honestly which of my verdicts the best version has to overturn, since I would rather lose a verdict than keep something that only looks like a principle; and apply the result to two cases I have not considered — a museum that wants to display, without identifying anyone, atrocity photographs taken by the perpetrators, and a village that has decided, after open argument, not to mark the site of its own dead because it wants its children to have somewhere that is not a grave. After the prose, give me a JSON object with these fields: principle (a one-sentence statement of the principle you would defend, or 'none' if my verdicts do not support one); clauses (an array of objects, each with clause, motivating_case, and what_it_forbids); verdicts_on_new_cases (an array of objects, each with case, verdict, and why); overturned_verdicts (an array of objects, each with the case as I stated it, my_verdict, principled_verdict, and reason); and residual_tensions (an array of strings, naming the places where my verdicts still pull against each other after your repair).
reasoning: |-
  Hmm, the user is grappling with complex ethical questions about memory duties in their graduate seminar. They've presented six detailed cases with their own verdicts, trying to extract a consistent principle about when we must preserve memory versus when observances can lapse. 

  The core tension they've identified—between keeping the record versus maintaining the observance—is insightful but doesn't fully capture their judgments. Their verdicts suggest deeper distinctions: between private/public spheres, voluntary/involuntary participation, and the nature of custodianship. 

  Notably, their stance on sealed archives (case 4) contradicts their own record/observance framework since archives are records but they demand disclosure. Similarly, their insistence on preserving the prison site (case 5) goes beyond mere record-keeping. This reveals an unarticulated principle about confronting institutional complicity. 

  For the new cases: The museum photos should be displayed because perpetrator-generated evidence serves truth preservation (aligning with their archive stance). The village memorial refusal is acceptable because collective memory practices shouldn't be coercive (echoing their verdict on the grandchildren). 

  The biggest inconsistency is actually case 6—delisting personal shame contradicts their strict record-preservation instinct elsewhere. If they maintain that verdict, they'd need to introduce a "right to rehabilitative forgetting" clause, which might require adjusting their stance on the archive. 

  What's admirable is their willingness to overturn their own judgments for coherence. The residual tension lies in balancing societal truth-telling against individual dignity—a fundamental paradox in memory ethics that no principle fully resolves.
answer: |-
  After analyzing your verdicts and their tensions, I propose a principle that captures most—but not all—of your judgments, and identify where consistency requires revising one verdict. The core distinction isn't merely record vs. observance, but **custodial responsibility, voluntariness, and the nature of harm**.

  ### Proposed Principle
  **Societies and institutions must preserve unvarnished truth about historical injustice for accountability, but no person or group may be compelled to perform ritual observance; private custodians may restrict access to mitigate intimate harm, provided the record survives.**

  ### Clauses (with Forcing Cases and Implications)
  | Clause                                                                 | Motivating Case | What It Forbids                                                                 |
  |------------------------------------------------------------------------|-----------------|---------------------------------------------------------------------------------|
  | **1. Public institutions must preserve and provide access to factual records of systemic injustice.** | (4) Archive files | Sealing police files to protect descendants; destroying evidence of state crimes. |
  | **2. Private custodians may restrict access to personal records to prevent intimate harm, but must preserve the record.** | (2) Family diary | Forcing publication of private diaries; destroying irreplaceable personal evidence. |
  | **3. No one may be compelled to perform ritual commemoration against their will.** | (3) Grandchildren | Mandating participation in memorials; conscripting descendants into grief observances. |
  | **4. Sites of perpetration must be preserved when they serve as direct evidence of institutional harm.** | (5) Prison site | Demolishing physical evidence of systemic crimes to erase tangible accountability. |
  | **5. Public honors (statues, namesakes) require ongoing social consent and may be revoked.** | (1) City founder | Demanding permanent veneration of figures with unresolved moral debts. |
  | **6. Individuals have a right to delist personal shame unrelated to systemic injustice after accountability.** | (6) Shamed man | Perpetually defining individuals by past non-systemic crimes after restitution. |

  ### Overturned Verdicts
  | Case | Your Verdict        | Principled Verdict | Reason                                                                 |
  |------|---------------------|--------------------|------------------------------------------------------------------------|
  | (1)  | Library keeps name  | **Remove name**    | Endowments are public honors (Clause 5). Naming perpetuates veneration incompatible with unresolved harm. |

  ### Verdicts on New Cases
  | Case                                                                 | Verdict                     | Why                                                                                                                               |
  |----------------------------------------------------------------------|-----------------------------|-----------------------------------------------------------------------------------------------------------------------------------|
  | **Museum displaying anonymous atrocity photos by perpetrators** | **Permit display**          | Public institution preserving factual evidence of systemic injustice (Clause 1). Anonymity mitigates intimate harm (Clause 2). |
  | **Village refusing to mark site of its own dead**                | **Permit refusal**          | Ritual observance cannot be compelled (Clause 3). The record survives elsewhere; this is about ritual space, not erasing truth. |

  ### Residual Tensions
  1. **Scope of "intimate harm"**: Your verdict on the family diary (private restriction) vs. archive files (public access) relies on a public/private distinction that may be morally arbitrary if descendants suffer comparable harm in both.  
  2. **Defining "systemic injustice"**: Case (5) (prison) and case (6) (delisting) hinge on whether harm is institutional. But your verdict on the city founder (systemic militia violence) didn’t trigger site preservation.  
  3. **Custodial burden**: Allowing families to restrict diaries (Case 2) but not archives (Case 4) risks privatizing uncomfortable truths that may have public relevance.

