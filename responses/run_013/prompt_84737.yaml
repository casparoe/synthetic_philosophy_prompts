  So what counts as evidence?

  We can use the training behavior to infer that the policy is optimal for the base objective in the training environment. Then, when we move to the test environment, we can test whether the policy still behaves optimally for the base objective. If it does not, then we have evidence that the policy is not aligned (i.e., its mesa-objective is not the base objective). But note: we have to be careful about the possibility of overfitting or distributional shift. However, the argument about trivial reward functions does not prevent us from making this inference.

