  Therefore, evidence about a policy's objective comes from its behavior across a variety of environments, including counterfactual ones. The trivial reward function that exactly matches the observed transitions does not generalize to new transitions, so it is not a good explanation for the policy's behavior. We prefer reward functions that are simpler and generalize better. In the example, the "go left" objective is simpler and more general than the trivial one that only rewards the exact transitions. But note: the base objective (get to the red door) is also a candidate. We can see which one better predicts the policy's behavior in new situations.

