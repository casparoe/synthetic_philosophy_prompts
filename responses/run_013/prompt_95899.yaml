prompt: |-
  I am a novelist, two-thirds of the way through a draft, and the book turns on the failure of a certain kind of certainty. I have been reading Wittgenstein's On Certainty not for its mood but for its epistemology, and I have reached the limit of what I can do with it alone at my desk. What I want from you is not an essay on the book but a procedure: an ordered set of questions I can run on each candidate certainty in my manuscript — there are about a dozen — to decide which can be made to give way on the page, which cannot, and how the giving way should be staged. I have the book; do not send me a reading list, citations, or quotations, and do not tell me where the commentators disagree. I need something I can run in ten minutes per scene.

  Work from the assumption the book is built on: some of a person's certainties are not beliefs she holds on evidence but the frame that makes her doubting anything possible at all. For my purposes a certainty can give way in one of three modes, and I want the procedure to assign each case to a mode or to say that it has none. Withdrawn: she comes to doubt it and can say so. Broken: the practice around it collapses, and she is left not with a doubt but with no ground to stand on. Exposed: nothing changes for her, but the reader sees the hinge for what it is.

  Here is the raw material. My protagonist is a woman of sixty-three on an estuary. She holds beyond question: that her brother drowned there when she was nine; that the tide will turn twice a day and the channel will hold; that the woman who raised her is her mother; that the words on a page mean what they seem to mean when she reads them; and that the people across the water are not the sort whose suffering makes a claim on her.

  Build the procedure so that it does not sort hinges from ordinary beliefs by content, or by how strange they seem — anything can be a hinge, and the cases that matter to me are the boring ones. Say what to ask first, what counts as a sufficient answer, and where the procedure stops and hands the decision back to me because the question is one of design rather than epistemology.

  Then run it on three of the five certainties above: one it handles cleanly, one where it misfires, and the one I suspect it will tell me I cannot write the way I want to write it — the last, where a certainty is false, undoubtable from the inside, and repellent to the reader. Close by naming what the procedure cannot do.

  Keep the whole reply to at most 1,000 words, in American English.
reasoning: |-
  Okay, the user is a novelist working on a draft where the book revolves around the failure of certainties. They've been reading Wittgenstein's On Certainty but need a practical procedure to evaluate the certainties in their manuscript. They want a set of ordered questions that can be applied to each candidate certainty to determine how it fails—either Withdrawn, Broken, or Exposed—or if it can't fail at all. They provided five examples of their protagonist's certainties.

  First, I need to understand their requirements. They don't want essays, citations, or reading lists—just a procedural tool. The procedure should be quick, about ten minutes per scene. The core assumption is that some certainties are foundational frames, not based on evidence. The three failure modes are clear: Withdrawn (doubted and stated), Broken (collapsed practice, no ground), Exposed (reader sees it, character doesn't).

  The user emphasized that the procedure shouldn't sort by content or strangeness—any belief could be a hinge. I need to focus on the role the certainty plays in the character's world. The questions should determine if it's a hinge by testing its foundational nature and how it's challenged.

  I'll structure the procedure in stages. Start by identifying if the certainty is a hinge. Ask about its necessity for other doubts and actions. Then, check if it's articulable—hinges often aren't questioned. Next, assess challenge vectors: how external events could impact it. Finally, assign failure modes based on whether the character can articulate doubt, the practice collapses, or only the reader perceives it.

  For the examples, I'll pick three: "the tide will turn" (cleanly handled as Broken), "words mean what they seem" (misfires as Withdrawn, but might be Broken), and "people across the water" (problematic, might not be writable as desired). The last one is tricky because it's false and repellent, but the character can't doubt it internally. The procedure might flag that it can't be Broken or Withdrawn, only Exposed, which the user may not want.

  I need to ensure the procedure is actionable. Each step must have clear yes/no answers leading to decisions. Highlight where the procedure stops and design choices take over. Also, acknowledge limitations: it can't handle moral dimensions or ensure narrative satisfaction, just the epistemological structure.

  Finally, keep the response under 1000 words, use American English, and avoid academic references. Focus on practicality for the novelist's immediate needs.
answer: |-
  Here is a procedure designed for your purpose. Apply it sequentially to each candidate certainty within its specific scene context.

  **The Hinge Failure Procedure**

  1.  **Is it a Functional Hinge? (Yes/No)**
      *   *Ask:* Does the protagonist rely on this certainty *without conscious thought* as the necessary background for specific doubts, investigations, or actions within *this scene*? Does questioning *this specific thing* feel nonsensical or impossible *for her here*, not because it's strong, but because it's the frame?
      *   *Sufficient Answer:* If "Yes," proceed. If "No," mark as ordinary belief (failure mode irrelevant to hinge mechanics) and stop procedure for this scene/certainty pair.
      *   *Design Handoff:* If "No," but you feel it *must* function as a hinge narratively, override. The procedure flags it lacks the necessary *functional* grounding *here*.

  2.  **Is it Articulable as Doubt? (Yes/No)**
      *   *Ask:* Could the protagonist conceivably formulate the *explicit thought* "I doubt that X" within the logic of her current world and character, *without* that thought itself causing a complete breakdown in her ability to engage coherently with the immediate scene?
      *   *Sufficient Answer:* "Yes" points strongly towards **Withdrawn**. "No" suggests **Broken** or **Exposed**. Proceed either way.
      *   *Design Handoff:* If unsure, consider: Does expressing the doubt require her to step *entirely outside* the practice the hinge supports? (E.g., doubting "words mean" while *using* words to doubt it).

  3.  **What is the Primary Challenge Vector? (Event/Revelation/Pressure)**
      *   *Ask:* What concrete element within the scene *directly* impinges upon the practice or world this hinge anchors?
          *   *Event:* A specific, observable occurrence contradicting expectations flowing *from* the hinge? (e.g., tide *not* turning predictably).
          *   *Revelation:* New information explicitly targeting the hinge's truth value? (e.g., DNA test result).
          *   *Pressure:* Sustained stress, contradiction within the hinge's *own* domain, or moral/emotional force that strains the practice built on it? (e.g., witnessing undeniable suffering across the water *while* maintaining indifference).
      *   *Sufficient Answer:* Identify the dominant vector. This doesn't assign the mode yet but informs *how* the failure manifests.
      *   *Design Handoff:* If multiple vectors, choose the one driving the *key* moment of stress on the hinge *in this scene*. The procedure identifies mechanisms, you choose emphasis.

  4.  **Assign Failure Mode:**
      *   *Ask based on Q2 & Q3:*
          *   If **Q2 = Yes (Articulable Doubt)** -> **Withdrawn** (She can state the doubt. Challenge Vector shows *how* the doubt becomes possible/necessary).
          *   If **Q2 = No (Inarticulable Doubt)** AND **Q3 = Event** -> **Broken** (The event disrupts the practice so fundamentally that the ground vanishes. Doubt is incoherent; action is paralyzed or nonsensical).
          *   If **Q2 = No (Inarticulable Doubt)** AND **Q3 = Pressure** -> **Broken** or **Exposed** (Sustained pressure can erode the practice, leading to collapse [Broken], OR it can make the hinge's arbitrariness visible *to the reader* while the character soldiers on [Exposed]).
          *   If **Q2 = No (Inarticulable Doubt)** AND **Q3 = Revelation** -> **Exposed** (Revelation *about* the hinge typically makes it visible *as a hinge* to the reader. The character might reject the info, rationalize it, or be unable to integrate it, leaving the hinge *functional for her* but *exposed*).
      *   *Sufficient Answer:* Assign the mode based on the above logic. **Exposed** requires the hinge itself remains *operational for the character* despite the reader seeing its nature.
      *   *Design Handoff:* Between **Broken** vs. **Exposed** under Pressure, or if the Revelation is so profound it *might* cause collapse despite Q2=No (rare). Choose based on narrative need: total breakdown vs. tragic/ironic persistence.

  **Procedure Applied:**

  1.  **Certainty: "The tide will turn twice a day and the channel will hold."**
      *   **Q1:** Yes. Anchors navigation, safety, daily rhythm. Doubting it spontaneously is unthinkable.
      *   **Q2:** No. For a lifelong estuary dweller, doubting the tide's fundamental reliability isn't a coherent *thought*; it's the water under the boat.
      *   **Q3:** **Event.** A scientifically impossible tidal surge radically alters the channel *or* the tide demonstrably fails in its cycle.
      *   **Q4:** **Broken.** The practice (relying on the tide/channel) collapses instantly. Navigation is impossible, safety is gone. Not doubt, but vertigo and paralysis. *Cleanly handled.*

  2.  **Certainty: "The words on a page mean what they seem to mean when she reads them."**
      *   **Q1:** Yes. The frame for reading letters, legal documents, news – crucial to her understanding.
      *   **Q2:** *Ambiguous.* She *can* doubt specific interpretations ("Does this clause mean X or Y?"). But doubting meaning *itself*? Likely No. Meaning is the air she breathes while reading.
      *   **Q3:** **Pressure.** She receives a letter whose words seem clear but describe an impossible event (her brother seen alive?) or contain a blatant, undeniable contradiction *within the text itself* that she cannot resolve.
      *   **Q4:** **Broken** or **Exposed?** Procedure misfires slightly here. Pressure *could* lead to **Broken** (inability to read *anything* coherently, collapse of trust in text). But Q2 ambiguity makes **Withdrawn** possible *if* she fixates on *this text* being faulty, preserving the general hinge. More likely **Broken** under intense pressure. *Design Handoff Required:* Does the contradiction break reading *as a practice* (**Broken**) or make her cling harder to meaning while the reader sees its fragility (**Exposed**)?

  3.  **Certainty: "The people across the water are not the sort whose suffering makes a claim on her."**
      *   **Q1:** Yes. Foundational to her moral disengagement, sense of self/other.
      *   **Q2:** No. This is a deep, identity-forming certainty. Articulating doubt ("Should I care?") *is* the crack, but the procedure asks if she can *doubt the certainty itself* as a proposition. Likely No – it's her world's moral bedrock.
      *   **Q3:** **Pressure.** She directly witnesses acute, undeniable suffering of a specific individual across the water (e.g., a child in danger), creating an immediate, visceral moral claim that *cannot* be easily dismissed as "their sort."
      *   **Q4:** **Exposed.** The procedure dictates this. The hinge remains *functional* for her (she likely rationalizes, avoids, suppresses), but the reader sees its cruelty and arbitrariness starkly revealed by the pressure. **Withdrawn** is impossible (Q2=No). **Broken** is unlikely – her entire moral world doesn't collapse instantly; she *resists* the claim. *This conflicts with your desire.* You want the hinge *false, undoubtable inside, repellent outside*. The procedure says only **Exposed** fits the epistemology. To achieve **Withdrawn** or **Broken**, you'd need to violate Q1 or Q2 (make it less hinge-like) or introduce a Revelation (Q3) so profound it shatters her identity (moving towards Broken, but still difficult).

  **What the Procedure Cannot Do:**
  1.  **Guarantee Narrative Power:** It ensures hinge mechanics, not dramatic impact or reader resonance.
  2.  **Resolve Moral Complexity:** It identifies exposure, not whether the reader's judgment aligns with yours or the character's fate.
  3.  **Handle "Meta" Hinges Perfectly:** Certainties about doubting itself (like "I can doubt") are paradoxical. The procedure might stall.
  4.  **Dictate Character Response Beyond Mode:** *How* she experiences Broken vertigo or resists in Exposed is your artistry.
  5.  **Override Epistemology for Design:** If the certainty functions as a true Wittgensteinian hinge *in the scene*, the procedure will resist assigning **Withdrawn** or **Broken** unless the challenge is catastrophic (Event) or identity-shattering (Revelation under Pressure). It protects the "frame" nature.
