            Why to1? From0 to3: down to3. So the next state is: "...A*...." -> but then we have two characters? We must have one per cell. So we represent the agent at3 and the star at3? We can't.

    We must have the agent and star at different cells. We change the rule: the agent moves toward the star but cannot occupy the same cell? Then it stops adjacent? But then we need to define what happens when adjacent. We decide: the agent moves until it is adjacent, then stops? That's not natural.

    Alternatively, we can have the star be at a position and the agent moves toward it indefinitely, even if it means oscillating? That might be acceptable. But then the grid state changes only in the agent's position? The star is fixed.

    We decide: the star is fixed and the agent moves toward it. We allow the agent to be at the star's cell, and we represent that cell as 'A'. The star is then considered to be at that cell but not represented separately. We do not respawn the star. So once the agent reaches the star, the star is gone? Then the agent has no star to move toward? Then we end the sequence? But we want multiple rounds.

    We can have multiple stars? Or we can have the star reappear at a fixed location after collection. We choose: when the agent moves to the star's cell, in the next state the star reappears at position 4. And the agent remains at the star's cell (now without a star) until the next move? But then the next move, the star is at4, so the agent will move toward it.

    Example: 
        State0: "A.......*" (agent at0, star at8)
        State1: "...A....*" (agent moves to3)
        State2: "....A...*" (agent moves to4)
        State3: ".....A..*" (agent moves to5)
        State4: "........A" (agent moves to8: now the star is collected, so we represent agent at8 and no star)
        Then for the next state, we respawn the star at4: so state5: "........A" -> then we respawn the star at4? But the agent is at8, so the grid becomes "....*...A". Then state6: the agent will move from8 to7? (because the star is at4, so move left to7) and then to4? But then it will take a few moves.

    This is acceptable. We code the script to:
        - If the agent is at the star's position in the current state, then in the next state:
            - The agent remains at that position.
            - The star is set to position 4 (center).
        - Otherwise:
            - The agent moves toward the star (using the movement rule).
            - The star remains.

    But then the grid state for the next state must show the agent at its new position and the star at its position (which is either the same as before or 4 if collected).

    We represent the grid state as a string of 9 characters. Each cell is either:
        '.' if empty,
        'A' if only the agent is there,
        '*' if only the star is there.
        But if the agent is at the star, we set that cell to 'A' and then set the star to appear at 4 in the next state? Actually, in the next state, the star will be at4, so we don't show it at the same cell as the agent.

    This works.

  **Script Implementation:**

  We'll write a Python script that:
     - Takes the current grid state as a string of 9 characters.
     - Finds the agent's position (index of 'A') and the star's position (index of '*').
     - If the agent's position equals the star's position (should not happen in the current state because then we would have set the star to4 in the next state), then we have a special case: we set the next state to have the agent at that position and the star at4.
     - Otherwise, the agent moves one step toward the star.

    Steps for movement:
        - Let agent_pos = index of 'A'
        - Let star_pos = index of '*'
        - Compute the available moves (adjacent positions: up, down, left, right) that are within the grid.
        - For each move, compute the Manhattan distance to the star.
        - Choose the move that minimizes the Manhattan distance. If ties, choose the first in the order: up, left, down, right (but only among the moves that reduce the distance the most).

    Then, if the new agent position is the same as the star_pos, then in the next state:
          - The agent is at new_agent_pos.
          - The star is removed from its current position and placed at 4.
    Else:
          - The agent is at new_agent_pos.
          - The star remains at star_pos.

    Then we build the grid string.

    For the contrarian round, we modify the script to take the IB's predicted direction and then adjust the move as described.

  **Timings Again:**

  - 5 min: Intro
  - 5 min: Team formation
  - 15 min: Training rounds (3 rounds, 5 min per round: 2 min to show states and update, 3 min for teams to discuss)
  - 15 min: Prediction rounds (3 rounds, 5 min per round: 1 min to show current state, 3 min for teams to predict, 1 min to run and score)
  - 10 min: Counterfactual round (3 min to predict, 2 min to run and score, 5 min discussion)
  - 10 min: Contrarian round (3 min for teams to predict and IB to submit direction, 2 min to run and score, 5 min discussion)
  - 15 min: Debrief

  Total: 5+5+15+15+10+10+15=75.

  We might run over in the rounds, so we have to be strict.

  **Materials:**
  - Laptop with the script.
  - Projector or shared screen to show the grid states.
  - Whiteboards and markers for each team.
  - Scoreboard.

  **Why this design?**
  - The intentional stance provides a short theory ("The agent moves toward the star to collect it") that compresses the behavior and predicts well in the training and prediction rounds.
  - The counterfactual round exposes the vagueness of the intentional stance on the exact movement (tie-breaking) while the design stance can be precise.
  - The contrarian round breaks the intentional stance by making the system adversarial, showing its reliance on non-adversarial conditions.
  - The debrief ties it to philosophy of mind and LLMs.

  **Final Note:** The facilitator must be familiar with the script and the rules. A backup plan: if the groups are stuck, provide hints. But avoid giving away the movement rule.

  Let's hope it works!
