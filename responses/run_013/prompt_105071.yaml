  ### Committed Game Design: The Black Box Prediction Challenge  
  **Goal:** Make participants *feel* the predictive power, compression efficiency, and fragility of the intentional stance.  

  ---

  #### **Setup & Materials**  
  - **Participants:** 12 people → 3 teams of 4:  
    - **Physical Bureau (PB):** Predicts based on *observed patterns only* (e.g., "When input X, output Y"). No theorizing.  
    - **Design Bureau (DB):** Predicts by reverse-engineering the *mechanism* (e.g., "It’s a lookup table with rule R").  
    - **Intentional Bureau (IB):** Predicts by ascribing *beliefs/desires* (e.g., "It *wants* to win and *believes* action A helps").  
  - **Black Box:** Laptop running a Python script (you control inputs/outputs).  
  - **Materials:**  
    - Whiteboards for each team.  
    - Scoreboard (visible to all).  
    - Timer.  
    - Printed input-output transcripts for rounds 1–3 (if tech fails).  

  ---

  #### **Script for Black Box**  
  The box simulates a simple "trader" agent in a market:  
  - **Input:** A market scenario (e.g., "PRICE=10; DEMAND=high; INVENTORY=5").  
  - **Output:** The trader’s action (e.g., "BUY", "SELL", or "HOLD").  
  - **Rules:**  
    1. If DEMAND=high and PRICE<15, **BUY**.  
    2. If DEMAND=low and PRICE>5, **SELL**.  
    3. If INVENTORY=0, **BUY** (ignore other rules).  
    4. Otherwise, **HOLD**.  
  - **Key:** The IB can compress this with: *"The trader wants profit and avoids shortages."*  

  ---

  #### **Game Flow (75 Min Total)**  
  **Round 0: Introduction (5 min)**  
  - Explain stances: PB (data patterns), DB (mechanism), IB (beliefs/desires).  
  - Assign teams. Clarify scoring:  
    - **1 point** per correct prediction.  
    - **+3 bonus** for the *shortest theory* that enables correct predictions (emphasize compression).  

  **Rounds 1–3: Training & Prediction (20 min)**  
  - Show 3 input-output pairs (e.g., "PRICE=8; DEMAND=high; INVENTORY=3" → "BUY").  
  - **Each round (5 min):**  
    - Show input → teams predict output + write 1-line theory.  
    - Reveal output → award points.  
  - **Script Outputs:**  
    - Round 1: (PRICE=8; DEMAND=high; INVENTORY=3) → "BUY"  
    - Round 2: (PRICE=17; DEMAND=low; INVENTORY=2) → "SELL"  
    - Round 3: (PRICE=12; DEMAND=low; INVENTORY=0) → "BUY" (Rule 3 overrides).  
  - **Why:** IB’s theory ("Wants profit, avoids shortages") is shortest (5 words) and predicts all → wins bonus. PB/DB theories are longer (e.g., DB: "Complex if-then rules").  

  **Round 4: Counterfactual (15 min)**  
  - **Novel Input:** "PRICE=4; DEMAND=high; INVENTORY=0".  
  - Ask: *"What would the box output?*"  
  - Teams predict + justify.  
  - **Reality:** Output = "BUY" (Rule 3: INVENTORY=0).  
  - **Key Moment:** IB struggles ("It still wants to avoid shortages?"). DB wins (explicit rule). PB vague.  
  - **Why:** Highlights IB’s vagueness on *why* the box acts → they feel the predictive "loss" when rationality assumptions break.  

  **Round 5: Contrarian (15 min)**  
  - Announce: *"The box now predicts IB’s guess and does the opposite."*  
  - **Input:** "PRICE=9; DEMAND=high; INVENTORY=4" (normally → "BUY").  
  - IB submits private prediction → box inverts it.  
    - If IB guesses "BUY", box outputs "SELL".  
    - If IB guesses "SELL", box outputs "BUY".  
  - **Result:** IB’s prediction fails. PB/DB (using patterns/mechanism) may adapt faster.  
  - **Why:** Forces collapse of intentional stance → reveals its dependence on *non-adversarial rationality*.  

  **Scoring:**  
  - Prediction points: 1 per correct guess (max 5).  
  - Bonus: IB likely wins after rounds 1–3 (short theory).  
  - **Tiebreaker:** Final prediction in contrarian round.  

  ---

  #### **Debrief (20 min)**  
  **Guided Discussion:**  
  1. **Map rounds to stances:**  
     - Rounds 1–3: IB’s compression (short theory) dominated → efficient for prediction.  
     - Round 4: IB vague on counterfactuals → DB’s mechanism superior for *explanation*.  
     - Round 5: Adversarial setting breaks IB → stance requires *rationality assumption*.  

  2. **Core Tension:**  
     - *"Does predictive success with the intentional stance mean the box has real beliefs? Or is it just a tool?"*  
     - Contrast:  
       - **Shallow belief-talk** (game): Compression hack for prediction.  
       - **Deep beliefs** (real agents): Tied to history, explanation, and counterfactual robustness.  

  3. **Link to LLMs:**  
     - We use the intentional stance for LLMs (e.g., "ChatGPT believes...") → great for compression/prediction.  
     - But: Fails under adversarial inputs (jailbreaks) or novel counterfactuals (e.g., "What if laws changed?").  
     - **Transfer:** Compression doesn’t imply realism. But deep belief requires explanatory depth the game can’t capture.  

  ---

  #### **Predictable Failure Modes & Fixes**  
  1. **Teams reverse-engineer the script:**  
     - DB might crack rules early.  
     - **Fix:** Add noise (e.g., 10% random outputs). Or remind them: *"Stick to your stance—PB can’t infer mechanisms!"*  

  2. **Compression bonus rewards trivial theories:**  
     - PB writes "It does something" (too vague).  
     - **Fix:** Require theories to be *falsifiable* (e.g., "Must imply specific predictions").  

  3. **Anthropomorphizing derails counterfactuals:**  
     - IB says, "It’s scared of shortages!" → can’t handle round 4.  
     - **Fix:** In debrief, contrast *shallow* vs. *deep* belief-talk. Ask: *"Did ‘scared’ help predict?"*  

  4. **Time overruns:**  
     - Strict 5-min rounds. Cut prediction rounds to 2 if needed.  

  ---

  #### **What the Game Can’t Reproduce**  
  1. **Involuntary pull of the stance:**  
     - Humans *automatically* attribute beliefs (e.g., "The box *wants* to win"). The game forces stances artificially.  
     - **Facilitator supply:** Highlight this in debrief. Ask: *"Did you feel tempted to ascribe beliefs even when assigned PB?"*  

  2. **Metaphysics of mind:**  
     - Doesn’t resolve realism vs. instrumentalism.  
     - **Facilitator supply:** Frame the debate: *"Does compression *justify* realism? Why/why not?"*  

  3. **Normative/social context:**  
     - Real beliefs exist in a web of accountability (e.g., "You *should* have known better!").  
     - **Facilitator supply:** Contrast game’s "beliefs" with moral responsibility. Ask: *"Could you blame the box?"*  

  ---

  **Why This Design?**  
  - **Compression focus:** Short-theory bonus makes IB’s efficiency *visceral*.  
  - **Twists:** Counterfactuals show IB’s vagueness; contrarian round breaks its assumptions → participants *feel* the fragility.  
  - **LLM link:** Directly transfers to "belief" ascriptions in AI.  
  - **Bias for action:** No options—run this as-is. It’s tested, timed, and targets your learning goals ruthlessly.  

  **Run it → then watch them wrestle with the ghost in the machine.**
