answer: |-
  ### Final Examination Question  
  **Time Allowed: 50 minutes**  
  **Answer ONE question. This question is compulsory.**  

  **Question:**  
  Karl Jaspers argues that political guilt falls on all citizens simply by virtue of their membership in a political community responsible for wrongdoing, while moral guilt attaches only to individuals who made specific choices with a guilty conscience. Using the four-way disambiguation of "collective guilt" discussed in class (distributed, joint, corporate agency, liability without guilt), explain what licenses this asymmetry in his framework. Then, consider a person born decades *after* the unjust events, who did nothing, could not have dissented, and yet inherits significant material benefits directly traceable to those wrongs (e.g., wealth from confiscated property). Does this person fall under any of Jaspers’s four categories of guilt (criminal, political, moral, metaphysical)? If not, would his framework require a fifth category—and if so, what would define it? Finally, evaluate whether "responsibility without guilt" offers a coherent way to address this person’s connection to the past, or if it merely smuggles in a notion of desert (deserving blame/benefit) under another name.  

  ---

  ### Model Answer (Approx. 700 words)  
  Jaspers’s asymmetry—political guilt for all citizens based on membership alone, versus strictly individual moral guilt—rests on distinguishing how groups bear responsibility. His framework uses four concepts of "collective" to make this separation plausible. **Political guilt** relies on the idea of *collective liability without guilt*. Here, citizens inherit obligations (like reparations) because they belong to a state that committed wrongs, even if they personally opposed them. This isn’t about blame; it’s about sharing burdens to restore justice. Conversely, **moral guilt** requires *individual agency and conscience*. Only those who acted (or failed to act) with awareness of their choices can bear this deeply personal guilt. The asymmetry works because political guilt is about *external obligations* tied to shared institutions, while moral guilt concerns *internal accountability* for one’s own actions.  

  Now, consider a beneficiary who inherits wealth from historical injustice but was born long after the events. They played no part in the acts, could not have resisted them, and bear no direct psychological burden (moral guilt). They committed no crime (criminal guilt). Metaphysical guilt—Jaspers’s idea of a shared human failing to prevent evil—might seem relevant, but it’s universal (all humans share it) and vague; it doesn’t specifically address *inherited benefit*. Crucially, **political guilt** *also doesn’t fit*. Jaspers ties it to active citizenship during the wrongdoing. This person wasn’t a member of the political community *at the time*; they inherit benefits, not membership in a guilty polity.  

  So, does Jaspers’s framework need a fifth category? One option is a new form of *inherited liability*, defined by receiving unjustly gained advantages without personal fault. This wouldn’t be "guilt" (no blame for the act itself) but a duty to relinquish or redress ill-gotten gains. Alternatively, we might stretch "political guilt" to include *ongoing political communities*. If the state persists, so might obligations—but this strains Jaspers’s link to contemporaneous membership.  

  This leads to "responsibility without guilt." For the beneficiary, it means acknowledging a duty to address the inherited advantage (e.g., restitution) while denying they *deserve* blame for the original wrong. **Is this stable?** Yes, if we ground it in two principles:  
  1.  **Unjust Enrichment:** It’s unfair to keep benefits gained through others’ injustice, even innocently. Liability arises from *current possession*, not past action.  
  2.  **Political Continuity:** States and societies endure; their obligation to rectify enduring harms (like stolen property) transcends generations.  

  **Does this smuggle in desert?** Not if carefully framed. "Desert" implies personal merit or demerit. Here, the beneficiary isn’t *blamed*; they’re asked to return what wasn’t rightfully theirs to begin with. The obligation stems from the *objective injustice* of the benefit, not their character or choices. However, calling it "responsibility" risks confusion if it evokes moral failure. To avoid smuggling, we must insist: this is *strict liability*—no fault needed—triggered solely by possession of tainted goods.  

  **Crucially, Jaspers’s categories struggle because they focus on *participation* (in acts or polities). Inheritance is about *receipt*. "Responsibility without guilt" addresses this gap by separating accountability for current holdings from culpability for past deeds.** It’s coherent if we define it narrowly as rectificatory duty, not moral stain.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  | **Marks** | **Required Move** | **Characteristic Mistake (Costs Mark)** |  
  |-----------|-------------------|-----------------------------------------|  
  | **1** | Explain Jaspers’s asymmetry (political vs. moral guilt). | Vague restatement ("Political guilt is collective, moral is individual"). |  
  | **2** | Use collective disambiguation to *justify* asymmetry (esp. liability without guilt for political; individual agency for moral). | Lists disambiguations without linking to asymmetry OR conflates types (e.g., calls political guilt "distributed"). |  
  | **1** | State beneficiary falls outside criminal/moral/metaphysical guilt. | Assumes metaphysical guilt applies vaguely without argument. |  
  | **3** | Argue beneficiary falls outside *political* guilt (no contemporaneous membership/agency). | Claims political guilt applies via "inherited membership" without critique. |  
  | **2** | Evaluate if a 5th category is needed (define proposed type: e.g., inherited liability). | Proposes vague "historical guilt" without defining its logic. |  
  | **3** | Analyze "responsibility without guilt" as applied to beneficiary (duty based on benefit/unjust enrichment). | Equates responsibility with moral fault OR dismisses it entirely. |  
  | **3** | Critically evaluate if it "smuggles in desert": Argue it can be stable if tied to possession, not blame. | Uncritically accepts phrase OR claims it *always* smuggles desert. |  
  | **1** | Note Jaspers’s focus on participation vs. inheritance of benefit as core tension. | Misses this conceptual gap entirely. |  
  | **2** | Structure & Clarity: Logical flow, precise terms, answers all parts. | Disorganized, key elements missed, or confusing language. |  
  | **2** | Persuasiveness: Coherent argument, avoids oversimplification. | Contradictions, unsupported claims, or superficial treatment. |  

  ---

  ### The A/B Separator  
  **The move that most reliably separates an A from a B:**  
  **Critically evaluating whether "responsibility without guilt" smuggles in desert (3 marks).**  
  - **A Answer:** Explicitly distinguishes *rectification based on unjust possession* (no desert) from *liability implying fault* (smuggling desert). Grounds this in principles like unjust enrichment/political continuity.  
  - **B Answer:** Correctly identifies the concept but doesn’t deeply interrogate the desert question OR asserts a position without nuanced justification (e.g., "It’s obviously fair/unfair").  

  This move demands synthesizing ethical theory (desert vs. liability) with the applied case, showing mastery beyond classification.
