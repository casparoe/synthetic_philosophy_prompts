prompt: |-
  Ok so I run the definitions-and-classification desk at a national statistics agency (riviting work, I know), and a big part of the job is settling fights about whether something "really counts as" X. Recent ones: whether gig delivery riders are "employees" or "self-employed"; whether a car with nobody at the wheel has a "driver"; whether a category like "disabled" or "unemployed" picks out something real or is just a policy artifact we invented; whether an AI system that writes working code "understands" what it's doing. These blow up into multi-week fights with lawyers, engineers, and advocacy groups, and my honest read is that a lot of them aren't about the world at all, they're about which word we should be using. But I cant reliably tell which ones those are, and my gut flip-flops depending on who talked to me last.

  I'd like you to act as my expert on this — somebody who knows the philosophy of language and metaphysics literature on verbal disputes and the question of when two people who seem to disagree actually do, but who's also good at turning that into something an actual human can run. Please turn it into a decision procedure I can use on a live dispute. Assume I have about 20 minutes, the parties sitting in the room, no philosopher present, and that whatever I land on goes into an official classification that affects real money and legal exposure. Give me the questions to ask in order, what counts as a good-enough answer to each one, where the procedure is allowed to stop and just declare "verbal" or "substantive," and where it has to hand off to a human judgment call because there's no fact of the matter to look up. Don't bother with citations or a reading list — I can't check them and it's not the point.

  One thing I half-remember someone telling me, and I want you to fold it in if it's right: that even when a dispute is "just about words," it can still be a real fight about how we *should* use the word, and that that's not nothing. If that's so, the procedure needs a branch for it, and it needs to tell me when to stop adjudicating and just stipulate a definition and move on.

  Then run the procedure on three of my cases — the rider/employee one, the "is this category real or an artifact" one, and the "does the AI understand" one — and make sure at least one of them comes out in a way I won't like (e.g. that I can't dissolve it as verbal, or that I've been treating a genuine disagreement as a vocabulary problem, or that my agency has quietly been taking a side all along). At the end, tell me where this procedure will misfire, what it can't do, and which case is the one where it just reproduces the original fight in fancier words.

  Think it through carefully before you start, and maybe begin by brainstorming the different kinds of "merely verbal" dispute there might be — I suspect part of my problem is that I've been treating them all as one thing.
reasoning: |-
  Okay, let me tackle this step by step. The user runs a definitions desk at a statistics agency and needs a practical decision procedure for classification disputes. They mentioned cases like gig workers' employment status, driverless cars, disability categories, and AI understanding. The key is distinguishing verbal disputes from substantive ones and knowing when to stipulate definitions.

  First, I recall that not all verbal disputes are the same. There might be different types: some involve ambiguous terms, others have different definitions, and some are about prescriptive norms. For the procedure, I need clear questions that can be asked in 20 minutes with stakeholders present. 

  Starting with the first question: "Can you state the other side's position in a way they'd accept?" This checks if both parties understand each other. If they can't, it might be a misunderstanding. If they can, move to the next step. 

  Next, "Is there agreement on all non-verbal facts?" List the concrete facts everyone agrees on. If there's disagreement on facts, it's substantive and needs domain experts. If they agree on facts but still disagree, it might be verbal. 

  Then, "If we swapped terms, would the disagreement vanish?" This tests if the conflict is just about labels. If swapping terms resolves it, then it's verbal. If not, there's a deeper issue. 

  For verbal disputes, ask: "Is there a strong reason to prefer one definition over another?" Consider factors like legal consequences, policy goals, or existing frameworks. If there's a compelling reason, stipulate the definition. If not, note it as a values conflict and move to stipulation. 

  Applying this to the gig worker case: Parties agree on facts like control and flexibility but disagree on "employee." After term-swapping, the dispute likely hinges on the term. Since legal exposure is key, stipulate based on regulatory frameworks. 

  For the "disabled" category: They might agree on measurable impairments but disagree on social vs. medical models. The term-swap test shows it's about values. Here, the agency should transparently choose a model based on policy goals. 

  In the AI understanding case, after agreeing on AI's capabilities, swapping "understand" might not resolve it. This indicates a substantive disagreement about consciousness, requiring human judgment. 

  The procedure might misfire in cases where facts aren't clear-cut or when values are deeply entrenched. Also, it can't resolve metaphysical debates but forces clarity. The AI case reproduces the original fight, showing its limits. 

  Need to ensure the procedure handles both verbal and substantive disputes efficiently, with clear off-ramps for stipulation. Highlighting where the agency's existing choices influence outcomes is crucial for transparency.
answer: |-
  Here's a battle-tested decision procedure for dissecting classification disputes, designed for a 20-minute live session. It identifies *why* parties disagree and forces the disagreement into one of three buckets: **Verbal/Definitional**, **Substantive/Factual**, or **Value-Driven/Prescriptive**. Crucially, it tells you when to stop arguing and start stipulating.

  **Core Insight:** Not all "verbal" disputes are the same. The key is isolating the *locus* of disagreement:
  1.  **Ambiguity:** Same word, different meanings unconsciously used.
  2.  **Borderline Case:** Agreement on core meaning, but disagreement on fuzzy boundaries.
  3.  **Choice of Concept:** Agreement on facts, but fundamental disagreement on *which concept* (defined by different criteria) should govern the label.
  4.  **Prescriptive Stakes:** Agreement on facts & core meaning, but disagreement on *which meaning we SHOULD use* due to consequences.

  **The Decision Procedure: Questions & Off-Ramps**

  1.  **"Can you state the opposing position in a way they would accept?"**
      *   **Goal:** Ensure mutual understanding. Eliminate talking past each other.
      *   **Good Answer:** Each party accurately paraphrases the other's core claim *without caricature*. E.g., "They argue gig riders are employees because Company X controls their schedule and performance metrics, not just the outcome."
      *   **Off-Ramp:** If they *can't* do this after 2 attempts, pause. The dispute is likely muddied by misunderstanding. Reframe positions neutrally yourself and ask for confirmation. *This step is mandatory; don't proceed without it.*

  2.  **"List ALL the concrete, observable facts relevant to classifying this case that everyone here agrees on. Ignore labels for now."**
      *   **Goal:** Separate shared factual ground from interpretation/labeling.
      *   **Good Answer:** A bullet-point list of non-controversial specifics. E.g., (Gig Rider) "Rider uses own bike", "Chooses when to log on", "Paid per delivery", "Can be suspended for low ratings"; (AI) "System produces functional code from prompts", "No biological brain", "Trained on vast code datasets"; (Disability) "Person has condition X diagnosed by Y", "Condition causes difficulty with Z task under current environment", "Receives benefit B".
      *   **Off-Ramp:** If they *disagree* on fundamental facts here, **STOP. Dispute is Substantive.** Hand off to domain experts (economists, engineers, doctors) to resolve the factual disagreement. *You're done with definitions for now.*

  3.  **"If we completely swapped the labels/words in question (e.g., called it 'Glarble' instead of 'Employee', 'Flarp' instead of 'Understand'), would the underlying disagreement about what *should be done* or what *is the case* still exist?"**
      *   **Goal:** Identify if the conflict is *inherently tied* to the label or exists independently.
      *   **Good Answer:** "Yes, because even calling it Glarble, we still disagree about whether Company X owes them healthcare." (Substantive/Value) OR "No, if we called control-fact-pattern-A 'Glarble' and control-fact-pattern-B 'Flarp', and agreed *this* case is pattern-A, we'd agree it's Glarble." (Verbal/Definitional).
      *   **Off-Ramp:** If **NO** (disagreement vanishes with label swap), move to Q4 (Verbal Path). If **YES** (disagreement persists), move to Q5 (Substantive/Value Path).

  4.  **VERBAL/DEFINITIONAL PATH: "What is the strongest practical reason to prefer definition A over definition B for our *official statistical classification* purpose?" (Forget "real meaning"; focus on *function* for your agency)**
      *   **Goal:** Move from philosophy to pragmatic regulation. Identify the consequential difference.
      *   **Good Answer:** Tied to core agency functions: "Definition A aligns with Labor Law Section 123, minimizing legal risk for users of our stats." / "Definition B matches international standard SIC-2025, enabling cross-border comparison." / "Definition C captures the economic precarity we're mandated to measure, unlike D."
      *   **Off-Ramp:** **STOP & STIPULATE.** You have a purely definitional choice driven by pragmatics. Declare: "For official statistical purposes, Agency adopts Definition [X] because [Practical Reason Y]. This stipulation resolves the classification for this case." *Document the reason.*

  5.  **SUBSTANTIVE/VALUE PATH: "Specifically what fact (that we *don't* yet agree on from Q2) is causing the label disagreement? OR, if we agree on *all* facts, what specific *consequence* of using Label A vs. Label B is unacceptable to one side?"**
      *   **Goal:** Pinpoint the *exact* residual disagreement – is it a hidden factual dispute or a clash of values/prescription?
      *   **Good Answer:** *Factual:* "We disagree whether the AI's internal process resembles human debugging." / "We disagree if condition X *always* implies limitation Z." *Value/Prescriptive:* "Calling it 'understanding' implies moral agency we reject." / "Labeling as 'unemployed' stigmatizes, even if technically fits." / "Classifying as 'self-employed' denies them protections they morally deserve, regardless of current legal definition."
      *   **Off-Ramp:**
          *   If **Factual Disagreement** is identified, **STOP. Dispute is Substantive.** Hand off to domain experts. *You're done.*
          *   If **Value/Prescriptive Disagreement** is identified, **STOP & ACKNOWLEDGE.** Declare: "The disagreement hinges on values/policy goals ([State them clearly: e.g., 'worker protection' vs. 'market flexibility'; 'biological reality' vs. 'social model of disability'; 'attributing agency' vs. 'mechanistic description']) rather than facts or definitions. For official statistical classification, Agency will apply Definition [X] consistent with [Relevant Framework/Statute Y]." *Document the value conflict neutrally.*

  **Applying the Procedure to Your Cases:**

  1.  **Gig Delivery Rider: "Employee" vs. "Self-Employed"**
      *   Q1: Parties likely paraphrase accurately (control vs. autonomy arguments).
      *   Q2: Agreement on facts: Uses own vehicle, sets own schedule (mostly), paid per job, rated, can be deactivated, uses company app, no sick pay. *Crucially, no hidden factual dispute exposed.*
      *   Q3 (Swap Test): If you call the bundle of facts "Type-Gig", does disagreement vanish? **NO.** Pro-Gig-as-Employee: "Even as Type-Gig, they deserve protections!" Pro-Self-Employed: "Even as Type-Gig, imposing employee rules kills flexibility!" → **Value Path.**
      *   Q5: **Value Conflict:** Worker protection/social safety net (Employee) vs. Market flexibility/innovation/autonomy (Self-Employed). *No new facts.*
      *   **Resolution:** **STOP & ACKNOWLEDGE VALUE CONFLICT.** Stipulate: "For labor force statistics, Agency classifies based on primary income source and degree of client control per [Specific Classification Standard Z, e.g., ILO guidelines or National Labor Law Sec. ABC], resulting in classification [Specific Outcome]." *You didn't dissolve it; you identified it's about values and applied your framework.*

  2.  **"Disabled" Category: Real vs. Policy Artifact?**
      *   Q1: Positions paraphrased: "Real = biological impairment exists" vs. "Artifact = disadvantage is created by society, label itself creates category."
      *   Q2: Agreement on facts: Person has medical condition X (measurable impairment). Environment presents barriers Y. Person experiences difficulty with tasks Z. Receives benefit B. *No dispute on these facts.*
      *   Q3 (Swap Test): Call the impairment "Condition-X", the barrier "Environment-Y", the difficulty "Outcome-Z". Does disagreement vanish? **NO.** "Real" side: "Condition-X is the real cause, Outcome-Z proves it's real!" "Artifact" side: "Without Environment-Y & Policy-B, Outcome-Z wouldn't make them 'disabled' as a social category!" → **Value Path.**
      *   Q5: **Value Conflict:** Medical Model (reality = impairment) vs. Social Model (reality = societal barriers/interaction) vs. purely operational definition (reality = eligibility for B). *No new facts.*
      *   **Resolution:** **STOP & ACKNOWLEDGE VALUE CONFLICT.** Stipulate: "For statistical reporting on disability, Agency uses the operational definition from [Source, e.g., national disability act, census protocol] focusing on [e.g., functional limitations in major life activities] to ensure consistency for policy analysis." *Your agency has always taken a side – the operational/policy side. This reveals that.*

  3.  **AI Writing Code: Does it "Understand"?**
      *   Q1: Positions: "Understands = produces correct, novel, context-appropriate code, implying comprehension" vs. "Doesn't Understand = just pattern matching, no semantics, no consciousness."
      *   Q2: Agreement on facts: AI produces functional code from prompts. Passes relevant coding tests. Generates novel structures (within training distribution). No consciousness (agreed). Trained on massive dataset. Operates via neural network weights. *Crucially, no agreement on internal process resembling human understanding.*
      *   Q3 (Swap Test): Call it "Glarble-ing code". Does disagreement vanish? **NO.** "Understands" side: "It's clearly Glarble-ing in a way that *seems* understanding!" "Doesn't" side: "It's Glarble-ing, but without *real* understanding!" → **Substantive Path (Q5).**
      *   Q5: **Specific Factual Disagreement:** "Does the AI's internal process constitute a form of comprehension (even if non-biological)?" vs. "Is it fundamentally different *in kind* from understanding?" *This is a genuine metaphysical/scientific disagreement.*
      *   **Resolution:** **STOP. Dispute is Substantive (Metaphysical/Emergent Property).** Hand off to cognitive scientists/philosophers of AI? **But you can't!** This is the **reproduction case.** Your agency *must* classify. Apply Q4 Pragmatics: "For statistical classification of AI capabilities, Agency uses operational criteria [e.g., 'Produces functionally correct code from natural language prompts'] avoiding the term 'understand'. This system meets criteria [X], hence classified as [e.g., 'Advanced Code-Generating AI System']." *You sidestepped the unsolvable fight with a stipulation based on observable function.*

  **Where the Procedure Misfires & Limitations:**

  1.  **Deeply Entrenched Values:** It reveals value conflicts but can't resolve them. Acknowledging them is crucial, but parties may still be furious (e.g., disability advocates vs. medical purists).
  2.  **The "No Fact of the Matter" Quagmire:** Cases like AI "understanding" expose metaphysical debates science can't yet resolve (Hard Problem of Consciousness, Strong vs. Weak AI). The procedure identifies it as substantive but offers no resolution, forcing a pragmatic stipulation that feels unsatisfying to purists. *This is its biggest stress point.*
  3.  **Hidden Factual Disagreements:** Clever parties might *seem* to agree on facts (Q2) but bury disagreement in interpretations *of* those facts. Vigilance in Q2 is key – demand *brutal* specificity.
  4.  **Borderline Cases:** If Q3 reveals the case is genuinely borderline for *both* definitions (e.g., a gig rider with exactly 50% control), the procedure might push you to stipulate (Q4) prematurely. Acknowledge the borderline nature explicitly in your ruling.
  5.  **Power Imbalances:** It assumes good-faith engagement. If lawyers/advocates dominate with rhetoric, it can be hard to enforce the focus on Q1 (paraphrase) and Q2 (brute facts).
  6.  **Reproduction in Fancier Words:** The **AI "Understanding"** case is the prime example. You end up replacing "does it understand?" with "does its process constitute non-biological comprehension?", which is just as intractable. The procedure forces you to see this, admit it's substantive/unresolvable *as asked*, and then pragmatically sidestep it with operational criteria.

  **The Uncomfortable Truth:** Your gut flip-flops because many disputes *are* genuinely hard, blending facts, definitions, and values. This procedure won't make them easy, but it will make them *clearer*, forcing the real disagreement into the open and telling you when to stop debating philosophy and start making a pragmatic, documented, defensible call. You are, inevitably, a policy actor making stipulations with consequences, not just a neutral arbiter of "real" meanings. This procedure makes that role explicit and structured.
