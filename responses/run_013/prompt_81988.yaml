          2. It assumes the risk attitude (γ) is constant and known. In reality, it might vary per proposal or with the scale of the loss.
          3. It requires a common utility scale, which is hard to define and requires calibration across proposals.
          4. The assignment of utilities to outcomes is a judgment call and might be inconsistent.
          5. The procedure does not account for correlations between proposals. We assume independence.
          6. The procedure does not account for budget constraints explicitly (we assumed equal cost). We would need to do RWEU_net per dollar and rank if costs differ.

     Steps in the procedure:

          Pre-committee:
            - The charity sets a common utility scale (0 to 100) with reference points.
            - The charity sets a risk attitude parameter γ (and possibly a catastrophe cutoff rule?).

          For each proposal:

            Step 1: Identify outcomes and probabilities. (judgment: if too vague, reject)
            Step 2: Assign utility to each outcome on the common scale. (judgment)
            Step 3: Define the status quo utility for this proposal. (judgment)
            Step 4: Compute net utilities: v_i = u(outcome_i) - u(status_quo)
            Step 5: Order outcomes by net utility: from worst (lowest) to best.
            Step 6: Compute cumulative probabilities: P_i = probability of getting at least v_i.
            Step 7: Compute weights: w_i = w(P_i) - w(P_{i+1]) with w(p)=p^γ.
            Step 8: Compute RWEU_net = sum_i w_i * v_i.
            Step 9: If RWEU_net <= 0, reject. Else, accept (subject to budget).

          Then rank the accepted proposals by RWEU_net (or by RWEU_net per dollar if costs vary) and fund until budget is exhausted.

     We note that Steps 1, 2, and 3 are judgment calls dressed as procedure.

     We run the three proposals as above and find that all three have positive RWEU_net and would be funded.

     However, for the third proposal, the user's instinct is to reject. We did not reject. We note that if the committee feels that the catastrophic outcome is unacceptable, they might revisit the utility assignment: maybe the catastrophic outcome should not be set to 0 but to a value below 0? But we fixed 0 as the worst. Alternatively, they might set a higher γ? But even with γ=4 it was positive. Or they might set a rule: reject any proposal with a non-zero probability of catastrophe. This would be a policy decision.

     We finish by saying: the procedure cannot capture infinite risk aversion (zero tolerance for catastrophe) without an explicit additional rule.
