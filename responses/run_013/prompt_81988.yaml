  Below is a step-by-step procedure for your grants committee to implement Risk-Weighted Expected Utility (RWEU) in proposal evaluations. The framework separates risk attitudes from outcome utilities, using a risk function to transform cumulative probabilities. The procedure is designed for non-specialists, with clear stopping rules and acknowledgment of judgment calls.

  ---

  ### **Procedure for Evaluating Proposals with RWEU**
  **Pre-Meeting Setup**  
  1. **Define Charity-Wide Standards** (Done once, reviewed annually):  
     - **Utility Scale (0–100)**: Assign numerical utilities to outcome tiers:  
       - `0`: Catastrophic harm (e.g., irreversible ecological damage).  
       - `25`: Moderate harm (e.g., reversible setback).  
       - `50`: Status quo (no change).  
       - `75`: Modest benefit (e.g., incremental gain).  
       - `100`: Transformative benefit (e.g., major conservation breakthrough).  
     - **Risk Function**: Choose a risk-aversion level via a simple vote:  
       - *γ = 0.5*: "Optimistic" (seeks gambles; weights good outcomes more).  
       - *γ = 1*: Neutral (pure expected utility).  
       - *γ = 2*: "Cautious" (weights bad outcomes more; **recommended default**).  
       - *γ = 3*: "Pessimistic" (avoids gambles; heavily discounts good outcomes).  

  **During Meeting (Per Proposal)**  
  *Time Limit: 8–10 minutes per proposal.*  

  1. **Step 1: Map Outcomes & Probabilities**  
     - **Question**: "What are the distinct outcomes (best/worst/middle), and what are their chances?"  
     - **Sufficient Answer**: 2–4 outcomes with probabilities (e.g., "10% transformative, 90% nothing").  
     - **Stop if**: Outcomes are undefined or probabilities vague → **Reject**.  
     - **Judgment Call**: Simplifying complex outcomes into discrete scenarios.  

  2. **Step 2: Assign Utilities**  
     - **Question**: "Where does each outcome fit on our 0–100 scale? What’s the status quo utility?"  
     - **Sufficient Answer**: Consensus on utilities using charity’s predefined scale.  
     - **Stop if**: Outcome utility ≤ status quo utility *and* no upside → **Reject**.  
     - **Judgment Call**: Valuing abstract outcomes (e.g., "knowledge with uncertain use").  

  3. **Step 3: Calculate Net Utilities**  
     - **Action**: Compute net utility for each outcome:  
       `Net Utility = Outcome Utility – Status Quo Utility`.  
     - **Order**: Rank outcomes from worst (lowest net) to best (highest net).  

  4. **Step 4: Apply Risk Function**  
     - **Action**: Compute weights using risk function `w(p) = p^γ`:  
       - Calculate cumulative probability `P_i` (chance of outcome *i* or better).  
       - Weight for outcome *i*: `w_i = w(P_i) - w(P_{i+1})` (with `P_{n+1} = 0`).  
     - **Formula**:  
       ```  
       RWEU = Σ [w_i × Net Utility_i]  
       ```  

  5. **Step 5: Decide**  
     - **Rule**: Fund if `RWEU > 0`.  
     - **Stop if**: `RWEU ≤ 0` → **Reject**.  
     - **Hand Back if**:  
       - Utilities are disputed (values debate).  
       - Risk function `γ` feels misaligned (policy debate).  

  **If Funded**: Rank proposals by `RWEU/Cost` (if costs vary) until budget exhausted.

  ---

  ### **Key Notes for Committee**  
  - **Eliciting Risk Attitudes**: Use intuitive metaphors:  
    - *γ = 2*: "Insuring against bad luck: we pay extra to avoid losses."  
  - **Non-Quantifiable Outcomes**:  
    - If utilities are incalculable, reject (Step 2).  
    - If probabilities are qualitative (e.g., "low chance"), assign conservative estimates (e.g., 10% for "low").  
  - **Judgment Calls Dressed as Procedure**:  
    - Simplifying outcomes (Step 1).  
    - Assigning utilities (Step 2).  
    - Choosing `γ` (pre-meeting).  

  ---

  ### **Application to Your Three Proposals**  
  Assume charity standards:  
  - **Utilities**: Status quo = `50`, catastrophic harm = `0`, transformative benefit = `100`.  
  - **Risk Attitude**: *γ = 2* (cautious).  

  #### **Proposal 1: Wetland Restoration**  
  - **Outcomes**:  
    - 80% chance: Modest gain (utility = `75`; net = `75 - 50 = 25`).  
    - 20% chance: Status quo (utility = `50`; net = `0`).  
  - **Order**: Worst (net `0`) → Best (net `25`).  
  - **Cumulative Probabilities**:  
    - `P_1` (net ≥0) = 1.0 → Weight: `w(1.0) = 1^2 = 1.0`  
    - `P_2` (net ≥25) = 0.8 → Weight: `w(0.8) = 0.8^2 = 0.64`  
  - **Weights**:  
    - Weight for net `0`: `1.0 - 0.64 = 0.36`  
    - Weight for net `25`: `0.64 - 0 = 0.64`  
  - **RWEU**: `(0.36 × 0) + (0.64 × 25) = 16.0`  
  - **Verdict**: **Fund** (RWEU > 0).  

  #### **Proposal 2: Long-Shot Method Development**  
  - **Outcomes**:  
    - 10% chance: Transformative benefit (utility = `100`; net = `50`).  
    - 90% chance: Status quo (utility = `50`; net = `0`).  
  - **Order**: Worst (net `0`) → Best (net `50`).  
  - **Cumulative Probabilities**:  
    - `P_1` (net ≥0) = 1.0 → `w(1.0) = 1.0`  
    - `P_2` (net ≥50) = 0.1 → `w(0.1) = 0.01`  
  - **Weights**:  
    - Weight for net `0`: `1.0 - 0.01 = 0.99`  
    - Weight for net `50`: `0.01`  
  - **RWEU**: `(0.99 × 0) + (0.01 × 50) = 0.5`  
  - **Verdict**: **Fund** (RWEU > 0, but barely).  

  #### **Proposal 3: Small Chance of Serious Harm**  
  - **Outcomes**:  
    - 2% chance: Catastrophic harm (utility = `0`; net = `0 - 50 = -50`).  
    - 98% chance: Solid benefit (utility = `75`; net = `25`).  
  - **Order**: Worst (net `-50`) → Best (net `25`).  
  - **Cumulative Probabilities**:  
    - `P_1` (net ≥-50) = 1.0 → `w(1.0) = 1.0`  
    - `P_2` (net ≥25) = 0.98 → `w(0.98) = 0.98^2 = 0.9604`  
  - **Weights**:  
    - Weight for net `-50`: `1.0 - 0.9604 = 0.0396`  
    - Weight for net `25`: `0.9604`  
  - **RWEU**: `(0.0396 × -50) + (0.9604 × 25) = -1.98 + 24.01 = 22.03`  
  - **Verdict**: **Fund** (RWEU > 0 despite catastrophic tail).  
    - *Why?* With γ=2, the 2% harm chance is weighted at ~4%—insufficient to override the 98% benefit chance. To reject, you’d need γ > 4 or a "zero tolerance" rule for catastrophe.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Handle Vague Proposals**: Fails if outcomes/probabilities are unquantifiable.  
  2. **Capture Extreme Risk Aversion**: If "any catastrophe chance = reject," you need a *separate policy* (e.g., "utility ≤ 25 with P>0 → reject").  
  3. **Resolve Value Conflicts**: Disagreements about utilities (Step 2) or γ require committee debate.  
  4. **Account for Interdependencies**: Assumes proposals are independent; ignores portfolio effects.  
  5. **Replace Expertise**: Judgment calls dominate outcome simplification and utility assignment.  

  ---

  ### **Final Recommendation**  
  Your instinct to reject Proposal 3 isn't aligned with RWEU under γ=2. To reject it, you must either:  
  - Adopt a zero-tolerance rule for catastrophe, or  
  - Increase γ to >4 (e.g., γ=5 → RWEU = -3.7, triggering rejection).  

  This framework makes risk attitudes explicit—but your committee must own the choice of γ and utilities. Use it to clarify debates, not eliminate them.
