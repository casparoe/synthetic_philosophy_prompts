prompt: |-
  I'm prepping the free will unit and I want to open with Galen Strawson's Basic Argument -- the regress one, where if you're truly responsible for what you do you'd have to be responsible for who you are, and to be responsible for who you are you'd have to have brought it about that you're that way, which needs an endless regress of self-creation, so genuine responsibility comes out impossible. Before we score anyones escape route, give me the spec: what would a theory of moral responsibility actually have to deliver to defeat or absorb that argument?

  Put the case behind each requirement. I want on the list, at least: an account of what "could have done otherwise" comes to when your character is fixed and you never chose it; a principled line between being responsible for an act and being responsible for the character that produced it, plus whether tracing back is even coherent; whether responsibility comes in degrees or is all-or-nothing; a story about self-fashioning -- someone who deliberately rebuilds their own character over years and then acts -- and whether the regress actually stops there or just gets longer; and how it handles the person who's glad to be exactly the way they are and wouldn't change a thing. It also has to say whether responsibility needs a persisting subject across time, given that Strawson himself doubts the self is that kind of thing.

  Flag any pair of desiderata you suspect can't be jointly satisfied -- that's the part I most want. Skip the scorecard, I'll assign that. And keep straight which of these are things everyone in the debate agrees on versus what's genuinely contested; don't sell me one camp's demand as the consensus. American English.
