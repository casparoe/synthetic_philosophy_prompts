  The user's second friend has a point about justification—how do we justify the rule? But Carroll's point is that rules of inference are foundational. They're not justified by premises but by their role in enabling reasoning. Trying to prove a rule using the same rule would be circular. 

  I should explain that the distinction between rules and premises avoids the regress because rules operate on premises. The Tortoise's mistake is requiring internal justification for what's external. But the deeper issue is that inference rules can't be non-circularly proven—they're accepted as part of rational thought. 

