answer: |-
  ## Research Proposal: Disentangling the Boundary Problem in Democratic Theory

  **Project Title:** The Double Knot of Demos-Constitution: Disentangling Inclusion and Decision Procedures for Democratic Boundaries

  **Principal Investigator:** [Your Name]
  **Affiliation:** [Your University/Institution]
  **Duration:** 12 Months
  **Field:** Political Theory

  **1. The Problem: The Unsolved Knot of Democratic Boundaries**
  The fundamental question of democratic legitimacy – "who ought to belong to the demos?" (the boundary problem) – remains persistently unresolved. Prevailing debates, spanning positions like Goodin’s "all affected interests," Abizadeh’s "all subjected to coercion," and Miller’s "shared national identity," share a critical flaw: they conflate two distinct questions. First, the *Inclusion Question*: What *substantive principle* (e.g., affected interests, subjection, citizenship) *should* determine the boundaries of a legitimate demos? Second, the *Constitution Question*: Given that any procedure to decide boundaries itself presupposes a bounded set of participants, *who is entitled to decide* where the boundary falls? This conflation fuels the widespread perception that the Constitution Question is inherently *viciously circular* (Whelan), rendering the boundary problem insoluble. This project argues that disentangling these questions is essential and that doing so significantly weakens the circularity charge, provided we carefully distinguish types of legitimacy.

  **2. The Core Hypothesis: Disentanglement and Dual Legitimacy**
  My central hypothesis is that the perceived vicious circularity of the Constitution Question stems directly from the failure to separate it from the Inclusion Question. I contend that:
      *   **a)** The Inclusion Question demands a *justificatory* answer: it seeks the normative criteria (e.g., subjection) grounding why a particular set of individuals *ought* to be included. Its legitimacy is *justificatory legitimacy* – does the boundary satisfy the best normative principle?
      *   **b)** The Constitution Question demands a *procedural* answer: given a pre-existing demos (however constituted, perhaps imperfectly), what procedure *by that demos* (e.g., referendum, legislative act, constitutional court ruling) can legitimately decide boundary changes? Its legitimacy is *procedural legitimacy* – was the decision made according to accepted, fair rules *within* the existing framework?
  Separating these questions allows us to say: A boundary decision (like admitting new members or permitting secession) can possess procedural legitimacy (e.g., a valid referendum among current citizens) *even if* it lacks full justificatory legitimacy (e.g., it excludes significantly affected non-citizens). Conversely, a theoretically justifiable boundary might lack legitimacy if imposed without any recognized procedure. The circularity charge targets the *constitution* of the *initial* demos; disentanglement allows us to address boundary *changes* within an ongoing polity without assuming that initial constitution must be perfectly justifiable procedurally *ab initio*.

  **3. Why Existing Literature Leaves the Question Open**
  Current approaches struggle because they either:
      *   **Collapse the Questions:** Most substantive inclusion principles (like "all subjected") implicitly or explicitly try to answer *both* questions simultaneously, leading to the circularity trap when applied to the Constitution Question (e.g., who decides who is "subjected"?).
      *   **Ignore the Distinction:** Proceduralist approaches often focus solely on decision-making *within* accepted boundaries without adequately addressing the prior normative justification *of* those boundaries for new decisions, or vice-versa.
      *   **Oversimplify Legitimacy:** They fail to explicitly distinguish the distinct demands of procedural and justificatory legitimacy for boundary decisions, treating legitimacy monolithically. This project aims to provide a clear, dual-lens framework explicitly separating the normative "ought" (Inclusion/Justificatory) from the political "who decides how" (Constitution/Procedural).

  **4. Research Method: Conceptual Analysis Anchored in Hard Cases**
  The project employs rigorous conceptual analysis within political theory, systematically testing the disentanglement hypothesis against concrete, contested cases where boundary disputes are sharpest. This prevents abstract drift and grounds the argument:
      *   **Months 1-3:** Deep conceptual analysis. Precisely define the Inclusion Question (substantive principles, types of justification) and Constitution Question (types of decision procedures). Articulate the distinction between procedural and justificatory legitimacy in this context. Critically engage key texts (e.g., Dahl, Whelan, Goodin, Abizadeh, Bauböck, Näsström).
      *   **Months 4-7:** Case Study Analysis. Apply the conceptual framework to three hard cases:
          *   **Secession Referendums (e.g., Scotland 2014, Québec 1995):** Does a procedurally legitimate vote *by* the sub-unit's residents satisfy the Inclusion Question regarding the remainder state? What justificatory claims do "rump" citizens have?
          *   **Diaspora Voting Rights:** What justifies extending procedural decision-power (voting) to non-resident citizens (Inclusion)? Does the *existing* demos have the procedural right to decide this boundary change?
          *   **Admission of New Members (e.g., EU expansion, naturalization policy):** What justificatory principle governs *who* should be admitted? What procedurally legitimate authority decides (legislature, referendum, executive)?
      *   **Months 8-10:** Synthesize findings. Assess where disentanglement resolves confusion, where tensions between procedural and justificatory legitimacy persist, and whether the distinction holds robustly across cases. Refine the framework.
      *   **Months 11-12:** Draft monograph chapter/article addressing objections and outlining implications for democratic theory.

  **Labour Division:** The work is primarily conceptual (70%), focused on clarifying the distinctions and their implications. Case studies (30%) are crucial testing grounds, not policy evaluations. Their purpose is to probe the coherence and applicability of the theoretical framework under pressure.

  **5. Outcomes: Success and Failure Criteria**
  *   **Successful Result:** A peer-reviewed article/chapter demonstrating:
      1.  The analytical necessity and clarity gained by rigorously separating the Inclusion and Constitution Questions.
      2.  That this separation significantly weakens (though may not eliminate) the vicious circularity charge against the Constitution Question.
      3.  That distinguishing procedural and justificatory legitimacy provides a coherent framework for analyzing boundary decisions in hard cases, explaining tensions without collapsing the analysis.
      4.  A clearer map of the distinct challenges inherent in justifying boundaries versus legitimizing procedures for changing them.
  *   **Failure:** The project fails if:
      1.  The distinction between the two questions proves unworkable or adds no analytical value upon close scrutiny.
      2.  The proposed distinction between procedural and justificatory legitimacy collapses under pressure from the case studies, showing they are inseparable in boundary decisions.
      3.  The analysis of hard cases demonstrates that the circularity charge remains as potent as ever despite the attempted disentanglement.

  **6. Potential Weakness and Reply**
  *   **Strongest Objection:** The distinction between procedural and justificatory legitimacy may be unsustainable in the context of the *fundamental* boundary problem. Any procedure used by an *existing* demos to decide boundaries inevitably presupposes and entrenches the justificatory (and potentially contested) basis of *that* demos' original constitution. Procedural legitimacy might always be parasitic on a prior, unresolved justificatory claim, making true disentanglement impossible.
  *   **Reply:** This objection powerfully highlights the limits of the approach regarding the *absolute origin* of a demos. However, it strengthens the project's core claim: that the conflation *causes* the perceived impossibility. The project concedes the origin problem may be intractable but argues that for the vast majority of political life – concerning *changes* to *existing* boundaries *within* ongoing polities (the secessions, enfranchisements, admissions we actually debate) – disentanglement *is* possible and essential. It offers a practical framework for navigating boundary politics without demanding a solution to the insoluble origin question first. Acknowledging this limitation clarifies, rather than negates, the theory's scope and value.

  **7. Conclusion**
  This project tackles a core, unresolved dilemma in democratic theory by proposing a novel conceptual disentanglement. By rigorously separating the Inclusion Question (demanding justificatory legitimacy) from the Constitution Question (demanding procedural legitimacy) and testing this framework against hard cases, it aims to dissolve the apparent vicious circularity plaguing debates on the demos. The outcome will be a significant clarification of the conceptual landscape of democratic boundaries, offering a more nuanced understanding of the legitimacy challenges involved in deciding "who belongs."
