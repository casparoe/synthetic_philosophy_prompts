  What I actually want to get is:

  - in what sense the first player "has" a winning strategy when the proof can't produce one. Is "there exists a strategy" doing the same job as a strategy you could actually sit down and play, or is there some sleight of hand? Is the strategy even a real object, or is that a category mistake?

  - what the argument actually needs to be true in order to go through. My guess is it needs (a) the game to be symmetric, (b) an extra move to never be able to hurt you, and (c) the game to have no draws. Walk me through why each one is needed and what breaks when you drop it — in particular, why doesn't the same trick just prove white wins at chess?

  - whether this is a proof or an assumption. I keep seeing it called the strategy-stealing "argument" in some places and "assumption" in others, and I can't tell if that's just loose talk or if there's a real sense in which something is being assumed rather than shown.

  And the bit I always lose the plot on: for Hex specifically, why can an extra stone of your own colour never be a disadvantage? Spell that out slowly cause I think thats where the whole thing lives or dies.
