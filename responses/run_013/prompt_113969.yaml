prompt: |-
  I just got roped onto the board of the lake association where my parents have a place, and I keep running into something I dont have a word for.

  Twenty-five odd years ago the walleye in our lake crashed and the old-timers pushed through a size limit plus an unwritten rule that you threw back anything under a certain length, and honestly it worked. The fish came back. The lake is about as good as anyone can remember it. Here's the part I can't name: the fish came back and the rule didn't. The people who kept it are mostly dead or moved to Florida, and the younger crowd fishes like the crash never happened, even though everybody agrees the fish are only back because of it. We wrote the limit into the regs again last year and its like it never existed before — nobody feels like they're breaking something they grew up with, they're just following a sign, and it took maybe five years for the new rule to be as ignored as the old one was obeyed.

  I saw the same shape at my last job with the office kitchen. Someone finally put up a sign, it was clean for about a year, the sign came down during a remodel, and it went back to being disgusting faster than it ever got fixed — even though everyone had lived through the clean period.

  What I'm after is whether there's a name for this: a shared resource that can be restored, and a habit of not taking too much that can't be restored along with it, or at least takes way longer, so the second time around you're starting from scratch even though the lake looks identical to how it looked back when the rule was strong. Is it just hysteresis? Is it the shifting-baseline thing? I know it's near the tragedy of the commons but that one is about taking too much, not about the restraint rotting away after the resource comes back. What I actually care about is the asymmetry — the resource has a recovery time, the rule has a seperate and longer one, and nobody budgets for it. Don't just hand me a label, tell me where the line is.

  Give it to me as exactly five numbered items, no preamble and no summing up at the end. Items 1 through 4: the closest existing ideas, ordered from nearest to furthest, each a sentence or two on what it captures about my case and where it stops fitting. Item 5: your verdict — either the concept that actually fits and why, or, if none does, your own name for the thing with a one-line definition and one case that should be kept out of it. For each item say how confident you are, and tell me which one you're least sure about.
reasoning: |-
  Okay, the user is describing a situation where a community successfully restored a shared resource (like a lake's fish population) through collective restraint, but that restraint culture faded over time. Now they're trying to reinstate rules without the underlying social enforcement, which fails despite the resource being physically restored. They want a precise term for this asymmetry between resource recovery and cultural recovery.

  I need to analyze this through the lens of existing concepts. The user mentions hysteresis and shifting baselines, so those should be considered first. Hysteresis in ecology refers to systems not returning to original states after disturbance - which captures the irreversibility aspect but misses the cultural decay element. Shifting baselines syndrome describes how generations reset expectations of "normal" resource levels - this fits the perception shift in both the lake and office examples, but doesn't fully explain why reinstated rules fail.

  Next, institutional memory decay seems relevant - it directly addresses how knowledge of past practices gets lost, especially through generational turnover. The user's case perfectly illustrates this with the Florida retirees and new anglers. However, this concept focuses on information loss rather than the behavioral asymmetry.

  The tragedy of the commons is foundational but too broad - it explains overuse generally, not specifically why restored resources get re-exploited despite known solutions. 

  For item 5, I'm considering proposing "restraint erosion" as a new term because no existing concept captures all dimensions: (1) the resource recovers physically, (2) the social practice of restraint decays faster, (3) reinstating rules without the culture fails. The office kitchen example demonstrates this isn't just about natural resources. It should be distinguished from simple rule-breaking where no prior successful culture existed.

  My confidence is highest on shifting baselines and institutional decay fitting well. Hysteresis is the trickiest because while ecological hysteresis occurs, the cultural component makes it incomplete.

  The user seems analytically sharp - they've already identified near-miss concepts and want precise boundaries. Their frustration with planning failures suggests they need this framing for practical governance, not just theory. The emotional weight in "nobody budgets for it" hints they're seeking ammunition for institutional reform.
answer: |-
  Here are the five numbered items as requested:

  1.  **Institutional Memory Decay** (High Confidence: Captures the loss of collective knowledge/practice when individuals leave. Fits the generational turnover and the feeling the rule is "new." Stops fitting because it doesn't inherently address the *asymmetry* with resource recovery or the *specific failure of reinstated rules* despite the resource being visibly restored.)
  2.  **Shifting Baseline Syndrome** (High Confidence: Captures how each generation redefines "normal" resource levels. Explains why younger anglers fish intensely despite the crash history and restored state. Stops fitting because it focuses on *perception* of the resource state, not the *decay of the restraint mechanism itself* or the asymmetry in recovery times for resource vs. rule adherence.)
  3.  **Hysteresis (Social/Ecological)** (Medium Confidence: Captures the idea that a system doesn't return to its original state after a disturbance, requiring more effort to restore the social norm than the resource. Fits the asymmetry and the difficulty restarting the restraint. Stops fitting because hysteresis typically describes the *state* of the system, not the *mechanism* of decay (generational loss, perception shift) or why a reinstated *identical rule* fails where the original succeeded despite the resource being similar.)
  4.  **Tragedy of the Commons** (Low Confidence: Captures the core dynamic of individual incentives leading to overuse of a shared resource. Fits the initial crash and the renewed overfishing. Stops fitting because it doesn't address the *successful historical restraint*, the *asymmetry in recovery times*, or the *specific failure of reinstated rules even with a restored resource* – it's the general problem, not this specific asymmetry.)
  5.  **Verdict: No perfect fit. Proposed concept: "Restraint Erosion"** (Definition: The phenomenon where the social norms, practices, and collective memory enabling sustainable management of a recovered common-pool resource decay faster than the resource itself recovers, rendering reinstated formal rules ineffective without rebuilding the underlying social foundation.) *Keep Out:* Cases where resource recovery itself is impossible or fundamentally alters the system, making past restraint irrelevant. (Least Sure About: Hysteresis - its application to social norms is valid but feels less precise for the mechanism described than memory decay or shifting baselines).
