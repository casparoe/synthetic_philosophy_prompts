answer: |-
  ### Brainstorm: Key Questions to Carve the Space
  1. **Is behavior entirely innate, unmodified by experience?** (Distinguishes hardwired responses from learned ones.)
  2. **Does learning rely *only* on direct environmental feedback?** (Separates trial-and-error from methods avoiding real-world consequences.)
  3. **Can the agent simulate outcomes *before* acting?** (Identifies pre-emptive error avoidance, regardless of mechanism.)
  4. **Is simulation/learning augmented by external, culturally acquired tools?** (Highlights use of language, symbols, or socially transmitted "cognitive prosthetics".)

  ### Decision Tree  
  *(Answerable via observation; bold = branch questions)*  

  ```
                                +---------------------+
                                | 1. Is behavior      |
                                | fixed/innate across |
                                | all experiences?    |
                                +----------+----------+
                                           |
                     +---------------------+---------------------+
                     |                                         |
            Yes      |                                         | No
                     |                                         |
           +---------v---------+                     +---------v---------+
           | DARWINIAN         |                     | 2. Must learning  |
           | (e.g., slime mold)|                     | occur via real-   |
           +-------------------+                     | world trial/error?|
                                                     +---------+---------+
                                                               |
                                +------------------------------+------------------------------+
                                |                                                             |
                       Yes      |                                                             | No
                                |                                                             |
                      +---------v---------+                                       +-----------v-----------+
                      | SKINNERIAN        |                                       | 3. Is simulation/     |
                      | (e.g., rat,       |                                       | planning aided by     |
                      | songbird*)        |                                       | cultural tools**?     |
                      +-------------------+                                       +-----------+-----------+
                                                                                             |
                                                     +---------------------------------------+---------------------------------------+
                                                     |                                                                             |
                                            No       |                                                                             | Yes
                                                     |                                                                             |
                                           +---------v---------+                                                       +---------v---------+
                                           | POPPERIAN         |                                                       | GREGORIAN        |
                                           | (e.g., crow)      |                                                       | (e.g., kid)      |
                                           +-------------------+                                                       +-------------------+
  ```

  **Footnotes:**  
  - *Songbird*: Learns song via vocal trial-and-error (feedback-dependent).  
  - **Cultural tools**: Symbols (words/numbers), physical artifacts (paper/tools), or social collaboration used as "thinking aids".  

  ### Cases Classified  
  - **Slime mold**: Fixed response → **Darwinian**.  
  - **Songbird**: Learns via vocal trial-and-error → **Skinnerian**.  
  - **Rat in Skinner box**: Learns via reward/punishment → **Skinnerian**.  
  - **Crow bending wire**: Simulates hook use mentally (no trial; no cultural tools*) → **Popperian**.  
  - **Kid doing long division**: Uses symbols/paper (cultural tools) → **Gregorian**.  
  - **Chess engine**: Simulates moves internally, but *no learning*; fixed algorithm → **Darwinian** (innate programming).  
  - **Chatbot**: Outputs depend on culturally acquired language/data, but *no simulation* (pattern-matching) → **Fails 3** (not Popperian/Gregorian).  

  ***Indistinct Cases***:  
  - Crow vs. ChatGPT: Crow passes Q3 (simulates); ChatGPT lacks simulation (generates via correlation, not foresight).  
  - Rat vs. songbird: Both Skinnerian; tree doesn't separate them (no issue; same rung).  

  ### Your Core Question: Offloaded Simulation  
  - **Internal simulation (e.g., crow)** → **Popperian**.  
  - **External simulation using cultural tools (e.g., kid with paper)** → **Gregorian**.  
  - **Why?** Gregorian creatures *require* cultural tools to *enable* simulation (e.g., math without symbols is impossible). Offloading isn't a new rung—it’s the defining feature of Gregorian cognition. Popperians simulate *without* such tools (e.g., mental maps).  

  ### Empty Rungs & Double Duty  
  - **No empty rungs**: All categories have clear examples.  
  - **Double duty?** "Popperian" covers *all* simulation (internal/external *without cultural tools*). Gregorian specifically addresses cultural offloading.  
  - **Edge case**: AIs (chess engine/chatbot) don’t fit neatly—they’re artifacts, not evolved minds.  

  ### Summary Tree in One Line  
  **Fixed? → Yes: Darwinian. No → Must trial-and-error? Yes: Skinnerian. No → Uses cultural tools? Yes: Gregorian; No: Popperian.**
