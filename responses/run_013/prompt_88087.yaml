prompt: |-
  I am a software engineer at a mid-sized telehealth company, and I have been asked to write the specification for a consent flow that will govern whether patients' session notes can be used to train and evaluate an internal language model. I have no formal background in philosophy, and I do not want a legal checklist or a reading list; I want a reusable decision procedure that my team and I can run whenever we are about to ship a feature that depends on someone's consent. The decisions recur at least monthly: a new data use, a new research partner, a change to an existing policy, a request to re-use data for a purpose nobody contemplated when it was collected. The stakes are high, the users are often distressed or unwell, and the people who sign off are a product manager, a privacy counsel who is not always available, and me. I need the procedure to be honest about which steps are genuine tests and which are judgment calls that cannot be eliminated.

  Please ground the procedure in what the philosophy of consent actually says, rather than in compliance folklore, and translate it into something a practitioner without the theory can follow. I would like the procedure to run as a sequence of questions, with a clear account of what counts as a sufficient answer at each step, where the sequence terminates in a no, and where it must be handed to a human because the question is about values rather than facts. It should treat scope, specificity, time, and revocability as first-class, not as afterthoughts, and it should distinguish deception, coercion, and the subtler case of manipulation or undue influence, including the difference between a threat and an offer that merely makes refusal costly. I recently came across the idea that consent is a normative power, in the sense that a valid consent changes what others are permitted to do rather than merely recording a preference, and I want the procedure to take that seriously: if the act would be wrong without the consent, the procedure should test whether the consent actually changes the permission, not just whether the user clicked. It should also say how to handle competence when the person is an adult patient with a fluctuating condition, and when the person is an employee or a contractor whose livelihood may depend on saying yes.

  Then apply the procedure to at least three concrete cases: a modal that treats continued use of the app as consent to train models on de-identified session notes; a research partnership in which patients are approached in a waiting room and told that declining may affect their standing in a care program; and a one-time consent to future research that is deliberately broad. For each, tell me what the procedure says, where it is uncertain, and what evidence would move the decision. I also want one case where the procedure yields an answer I will not like, and a candid account of what the procedure cannot settle. Please keep it operational: the output should be something I can paste into a design doc and defend in a review, not an essay about autonomy.
reasoning: |-
  We are building a decision procedure for consent flows. The procedure is grounded in philosophical theories of consent, especially the idea that consent is a normative power that changes what is permissible. We must address scope, specificity, time, revocability, competence, and the absence of deception, coercion, and manipulation. The procedure will be a sequence of questions. Some questions are factual and have clear pass/fail criteria; others are value judgments that must be handed to a human (with guidance on how to think about them). The procedure must be reusable and applicable to various scenarios.

  Key philosophical points:
  1. **Normative Power**: Valid consent transforms an otherwise impermissible act into a permissible one. It is not just a preference but a change in the moral/legal landscape.
  2. **Elements of Valid Consent**:
     - **Competence**: The person must have the capacity to understand and decide.
     - **Voluntariness**: The decision must be free from coercion, undue influence, and manipulation.
     - **Information**: The person must have adequate and understandable information about what they are consenting to.
     - **Specificity**: The consent must be for a specific act or set of acts. Overly broad or vague consent may be invalid.
     - **Revocability**: Consent must be revocable at any time without undue penalty.
  3. **Scope and Time**: Consent must be bounded in scope and time. Future uses must be contemplated at the time of consent, and if they are too different, new consent may be required.
  4. **Deception, Coercion, Manipulation**:
     - **Deception**: Lying or withholding key information.
     - **Coercion**: Involves a threat that makes the person worse off by refusing (e.g., "if you don't consent, we will deny you treatment").
     - **Manipulation/Undue Influence**: Non-rational influence that distorts judgment (e.g., exploiting vulnerability, using emotional pressure, or making refusal very costly without a threat).

  The procedure is a flowchart of questions. We stop if any step yields a "no". Some steps require human judgment; we note when that happens.

  ---

  **Decision Procedure for Valid Consent**

  **Step 1: Competence Assessment**
     - *Question*: Is the person competent to consent at the time of consent?
     - *Sufficient Answer*: 
          - For adults: Presumed competent unless known to be impaired (e.g., by severe mental illness, intoxication, or cognitive disability). For fluctuating conditions, we must assess at the time of consent. If the person is in a state that impairs decision-making (e.g., acute distress, psychosis) and we know or should know it, then no.
          - For employees/contractors: Competence is usually presumed, but if the context suggests impairment (e.g., they are in a crisis), then we must reconsider.
     - *Judgment Call?*: Yes. We must use reasonable judgment based on the circumstances. If the person is known to have a condition that impairs decision-making, we might need to delay or involve a surrogate.
     - *Output if No*: Stop. Consent is invalid.

  **Step 2: Information Disclosure**
     - *Question*: Have we provided clear, complete, and understandable information about:
          (a) What data will be used?
          (b) How it will be used (including any processing, de-identification, sharing)?
          (c) The risks and benefits (if any) to the person?
          (d) The fact that consent is voluntary and can be withdrawn?
          (e) Any consequences of refusal or withdrawal?
     - *Sufficient Answer*: The information must be in plain language, in a form the person can reasonably understand, and must not omit material facts. It must cover the core aspects of the act to which they are consenting.
     - *Judgment Call?*: Partially. The adequacy of disclosure is a matter of judgment. We must ask: would a reasonable person in the same situation feel they had the key facts? Omissions that are material (i.e., that would change the decision) are fatal.
     - *Output if No*: Stop. Consent is invalid.

  **Step 3: Voluntariness (Absence of Coercion, Undue Influence, and Manipulation)**
     - *Question*: Is the consent voluntary? Specifically:
          - **Coercion**: Are we threatening to impose a penalty (i.e., making the person worse off than their baseline entitlement) if they refuse? (e.g., "If you don't consent, we will terminate your care.")
          - **Undue Influence/Manipulation**: Are we exploiting a position of power or the person's vulnerability? Are we making refusal so costly (without a threat) that the choice is not free? (e.g., "If you consent, you get a benefit that we could easily provide without condition, but we are making it conditional to pressure you.")
          - For employees/contractors: Is the consent given in a context where refusal could reasonably lead to negative job consequences (even if implicit)? If so, this may be coercive.
     - *Sufficient Answer*: 
          - No coercion: We must not threaten to take away something the person is entitled to (e.g., standard care, job security). 
          - No undue influence: We must not exploit vulnerability (e.g., a patient in distress) or structure the offer so that refusal is unduly burdensome (e.g., making the only alternative extremely onerous).
     - *Judgment Call?*: Yes, especially for manipulation and undue influence. We must consider the power imbalance and context. A patient in a waiting room is vulnerable; an employee is in a power imbalance with the employer.
     - *Output if No*: Stop. Consent is invalid.

  **Step 4: Specificity and Scope**
     - *Question*: Is the consent specific enough to cover the proposed data use? Consider:
          - Is the use described in a way that the person can understand what they are agreeing to?
          - Is the use within the scope of what was originally described? (For re-use, is it a "compatible" purpose? If not, new consent may be needed.)
          - For future uses: Are they described with sufficient particularity? (Vague consents like "any future research" are problematic.)
     - *Sufficient Answer*: The consent must be for a defined set of actions. If we are using data for a purpose that is not reasonably within the original description, then we need new consent. For future uses, they must be of a similar type and purpose to what was initially disclosed.
     - *Judgment Call?*: Yes. We must decide if the new use is "compatible" or "within reasonable expectations." If it's a stretch, we must get new consent.
     - *Output if No*: Stop. Consent is invalid for this use.

  **Step 5: Time and Revocability**
     - *Question*: 
          (a) Is the consent still in effect? (Has it expired? Has it been revoked?)
          (b) Is there a clear and accessible way for the person to revoke consent?
          (c) If revoked, can we stop using the data going forward? (Note: This does not necessarily require deleting data already used, but we must clarify that in the disclosure.)
     - *Sufficient Answer*: 
          - The consent must not have expired (if it had a time limit) and must not have been revoked.
          - We must provide an easy way to revoke (e.g., a one-click method) without penalty.
          - We must honor revocation promptly for future uses.
     - *Judgment Call?*: Mostly factual. But the ease of revocation and the absence of penalty require design judgment.
     - *Output if No*: Stop. Consent is not currently valid.

  **Step 6: Normative Power Check**
     - *Question*: Without this consent, would the act be impermissible? (e.g., because it violates privacy, confidentiality, or other rights)
          If yes, then we must have valid consent to make it permissible. But note: if the act would be permissible without consent (e.g., because of a legal exception), then consent is not needed. However, in our context, using personal data for new purposes without consent is typically impermissible.
     - *Sufficient Answer*: We must determine if the act is one that requires consent. This is a legal and ethical judgment. In the context of health data, using it for research or training without consent is generally impermissible.
     - *Judgment Call?*: Yes. We must know the legal and ethical baseline. If in doubt, assume consent is required.
     - *Output if No*: If the act would be permissible without consent, then we don't need consent. But if it would be wrong and we don't have valid consent, stop.

  **Step 7: Record and Act**
     - If we passed all steps, then we have valid consent. We must record the consent (including the time, context, and version of the disclosure) and proceed.

  ---

  **Applying the Procedure to Concrete Cases**

  **Case 1: Modal for Continued Use as Consent to Train Models on De-identified Session Notes**

  *Scenario*: A modal pops up when the user opens the app: "By continuing to use this app, you agree that your de-identified session notes may be used to train and improve our language models." The user must click "I Agree" or "Cancel" (which exits the app). The modal does not provide an option to use the app without consenting.

  *Run the procedure*:

  1. **Competence**: Assuming the user is competent at the time of clicking. Pass.
  2. **Information Disclosure**: 
     - What: Session notes, de-identified. How: Training language models. Risks: Not disclosed (e.g., re-identification risk, how de-identification works). Voluntary? It says nothing about voluntariness or withdrawal. Consequences of refusal: They cannot use the app. 
     - *Judgment*: Inadequate disclosure. Missing key facts (risks, withdrawal) and the consequence of refusal (denial of service). Also, de-identification is not foolproof; this is material. Fail. Stop.

  *Decision*: Invalid consent. We cannot proceed.

  *What would fix it*? 
     - Disclose risks and the fact that de-identification is not perfect. 
     - Offer a way to use the app without consenting to data use (if feasible). 
     - Provide an easy way to withdraw consent later without losing app access.

  **Case 2: Research Partnership with Waiting Room Approach**

  *Scenario*: Patients in a waiting room are approached by a staff member and asked to consent to their data being shared with a research partner for a study. They are told: "This study helps improve care for people like you. If you decline, it won't affect your current care, but it might affect your standing in the care program, which considers participation in research as a positive factor."

  *Run the procedure*:

  1. **Competence**: Pass (assuming no impairment).
  2. **Information Disclosure**: 
     - What: Sharing data with a research partner. How: For a study. Risks: Not detailed (e.g., how the partner will use it, privacy risks). Voluntary? They say refusal won't affect current care, but then they imply it might affect "standing". The consequences of refusal are ambiguous. 
     - *Judgment*: The disclosure is incomplete about risks and the exact consequence of refusal. The implication about "standing" is vague. This is material. Fail. Stop.

     But let's continue to voluntariness because the disclosure flaw is already a fail, and we want to see the voluntariness issue.

  3. **Voluntariness**: 
     - The statement implies that declining might affect their standing in the care program. This creates pressure. Is it a threat? Not exactly, because they are not taking away baseline entitlements (current care remains). But it is an offer with a cost for refusal: they might be downgraded in the program. This could be undue influence because it exploits the patient's desire to be in good standing and the power imbalance (staff asking). 
     - *Judgment*: This is manipulative. The patient might feel they must consent to stay in good favor. The condition is attached to something that should be independent (care program standing). Fail.

  *Decision*: Invalid consent due to inadequate disclosure and undue influence.

  *What would fix it*? 
     - Remove any suggestion that refusal could affect standing. 
     - Make it clear that participation is entirely voluntary and without consequence. 
     - Provide full details about the research partner and risks.

  **Case 3: Broad One-time Consent for Future Research**

  *Scenario*: At registration, the patient is asked: "Do you consent to your de-identified health data being used for any future research conducted by us or our partners, to improve healthcare?"

  *Run the procedure*:

  1. **Competence**: Pass.
  2. **Information Disclosure**: 
     - What: De-identified health data. How: Any future research by us or partners. Risks: Not specified. Voluntary? Not mentioned. Withdrawal? Not mentioned. 
     - *Judgment*: The scope is extremely broad ("any future research") and the risks are unknown (because the research isn't specified). This is inadequate. Fail. Stop.

     But let's also check specificity.

  3. **Specificity and Scope**: 
     - The consent is vague and open-ended. It does not specify the types of research, the partners, or the safeguards. This fails the specificity test. 
     - *Judgment*: Overly broad consents are generally invalid because they do not inform the person of what they are agreeing to. Fail.

  *Decision*: Invalid consent.

  *What would fix it*? 
     - Specify categories of research (e.g., "research on mental health interventions" not "any research"). 
     - Provide a mechanism for re-consent if the research is outside the original scope. 
     - Allow withdrawal.

  **Case 4: An Answer You Might Not Like - Employee Consent for Monitoring**

  *Scenario*: We want to use internal chat logs (from company systems) to train a model that detects employee distress and offers support. We ask employees to consent via an email: "We care about your wellbeing. By replying 'YES', you agree to let us use your past and future chat logs to train a model that will help us support you. If you don't reply, we won't use your data, but you will not be eligible for the new support program."

  *Run the procedure*:

  1. **Competence**: Pass.
  2. **Information Disclosure**: 
     - What: Chat logs. How: Training a model to detect distress. Risks: Privacy invasion, false positives, potential misuse. Not disclosed. Voluntary? They say if you don't consent, you aren't eligible for the program. 
     - *Judgment*: Inadequate because it doesn't disclose risks. Fail. Stop.

     But let's continue to voluntariness because it's the key issue.

  3. **Voluntariness**: 
     - We are offering a new benefit (support program) that is not part of baseline employment. But note: by making the support program conditional on consent, we are creating a cost for refusal. Is this coercive? Not exactly, because we are not threatening to take away an entitlement (the program is new). However, it is manipulative because we are exploiting the employee's desire for support and the power imbalance. 
     - *Judgment*: This is undue influence. The employee might feel pressured to consent to get a benefit that the employer could provide without the data use. The condition is unnecessary and creates pressure. Fail.

  *Decision*: Invalid consent.

  *Why you might not like it*: You want to offer a support program and use data to make it better, but the procedure says you cannot condition the program on consent without risking invalidity.

  *What would fix it*? 
     - Offer the support program unconditionally. 
     - Then ask for consent to use chat logs for training, making it optional and without penalty. 
     - Disclose the risks.

  **What the Procedure Cannot Settle**

  The procedure cannot resolve:
     - **Baseline Entitlements**: What counts as a threat vs. an offer? We must decide what the person is entitled to (e.g., for patients, what is "standard care"? For employees, what are the baseline benefits?). This requires policy and ethical judgment.
     - **Materiality of Information**: What information is material? We must judge what a reasonable person would want to know. This depends on context and culture.
     - **Specificity for Future Uses**: How similar must future uses be? We must draw a line, and this is inherently fuzzy.

  These require human judgment and should be escalated to privacy counsel, ethics boards, or leadership.

  ---

  **Output for Design Doc**

  **Consent Validity Decision Procedure**

  This procedure determines if a proposed consent flow is valid. It must be run for any feature that relies on user consent. Steps must be passed in order; a failure at any step invalidates the consent.

  1. **Competence**: 
     - Is the user competent at the time of consent? 
     - Pass: User is an adult with no known impairment at the time, or if impairment is known, we have a surrogate. 
     - Fail: User is impaired and we proceed without surrogate. 
     - Judgment: Use reasonable assessment of the context.

  2. **Information Disclosure**: 
     - Have we clearly disclosed: what data, how it will be used, risks, voluntary nature, and consequences of refusal/withdrawal? 
     - Pass: Disclosure is complete, in plain language, and covers material facts. 
     - Fail: Omission of material facts or unclear language. 
     - Judgment: Would a reasonable person feel informed?

  3. **Voluntariness**: 
     - Is consent free from coercion, undue influence, and manipulation? 
     - Pass: No threats to baseline entitlements; no exploitation of vulnerability; refusal does not impose undue costs. 
     - Fail: Coercion (threat to entitlements), undue influence (exploiting vulnerability or power imbalance), or manipulation (making refusal unduly costly). 
     - Judgment: Consider power dynamics and context.

  4. **Specificity and Scope**: 
     - Is the consent specific to the proposed use? For re-use, is it within the original scope? 
     - Pass: The use is clearly described and reasonably within the agreed scope. 
     - Fail: Use is vague, overly broad, or incompatible with the original purpose. 
     - Judgment: Is the new use a reasonable extension?

  5. **Time and Revocability**: 
     - Is the consent current and revocable? 
     - Pass: Consent has not expired or been revoked; we provide an easy, penalty-free way to revoke. 
     - Fail: Consent is expired, revoked, or revocation is difficult/penalized. 
     - Judgment: Design of revocation mechanism.

  6. **Normative Power Check**: 
     - Without consent, would the act be wrong? 
     - Pass: If the act requires consent and we have it, or if it doesn't require consent. 
     - Fail: The act would be wrong without consent and we don't have valid consent. 
     - Judgment: Legal and ethical analysis of the act.

  **Handoff**: If any step requires judgment and the answer is unclear, escalate to privacy counsel and/or ethics review.

  **Output**: 
     - If all steps pass: Valid consent. Proceed. 
     - If any step fails: Invalid consent. Do not proceed. Redesign the flow.

  ---

  By following this procedure, we ensure that consent is not just a checkbox but a meaningful exercise of the user's normative power.
answer: |-
  ### Decision Procedure for Valid Consent in Data Use  
  Grounded in the philosophy of consent as a "normative power" (where valid consent transforms an otherwise impermissible act into a permissible one), this procedure tests whether a consent mechanism respects autonomy, competence, and voluntariness. It treats **scope, specificity, time, revocability, competence, and voluntariness** as core elements.  

  #### Procedure Flow  
  **Run this sequence for each consent decision. Stop if any step fails. Document answers.**  

  1. **Normative Power Check**  
     - *Question*: Would the proposed data use be wrong or impermissible *without* consent? (e.g., violates privacy expectations, confidentiality, or ethical norms)  
     - *Sufficient Answer*: **Yes** (if the use involves sensitive data, non-public information, or exceeds reasonable expectations).  
     - *If No*: Consent is unnecessary. Stop.  
     - *If Yes*: Proceed to Step 2.  
     - *Judgment Call?*: **Yes** (requires ethical analysis; consult privacy counsel).  

  2. **Competence Assessment**  
     - *Question*: Is the person likely competent to consent at the time of consent?  
     - *Sufficient Answer*:  
       - **Baseline**: Adults are presumed competent unless context suggests impairment.  
       - **Fluctuating Conditions (e.g., mental health)**: Consent must be obtained during a lucid state (e.g., not during acute distress). Use session timing (e.g., post-crisis) or clinician judgment.  
       - **Employees/Contractors**: Competence is presumed, but avoid high-pressure contexts (e.g., during performance reviews).  
     - *If No*: Stop. Consent is invalid.  
     - *Judgment Call?*: **Yes** for fluctuating conditions (require safeguards like clinician verification).  

  3. **Information Disclosure**  
     - *Question*: Is the disclosure **specific, complete, and understandable**?  
       - Covers: (a) Data used (e.g., "session notes, not audio"), (b) Purpose (e.g., "training internal LLMs"), (c) Risks (e.g., re-identification), (d) Third parties, (e) Revocation process.  
     - *Sufficient Answer*:  
       - **Specificity**: Avoid broad terms (e.g., "research"). Use concrete examples.  
       - **Understandability**: ≤8th-grade reading level; no jargon.  
       - **Completeness**: No material omissions (e.g., "de-identified" must clarify limitations).  
     - *If No*: Stop. Consent is invalid.  
     - *Judgment Call?*: **Partial** (test with user studies for clarity).  

  4. **Voluntariness Test**  
     - *Question*: Is consent free from deception, coercion, or undue influence?  
       - **Deception**: False claims or omissions that distort understanding.  
       - **Coercion**: Threat imposing harm for refusal (e.g., "deny care").  
       - **Undue Influence**: Excessive pressure exploiting vulnerability (e.g., leveraging distress).  
       - **Key Test**: Does refusal impose **non-baseline costs**?  
         - *Threat*: Withdrawing entitled benefits (e.g., standard care) → **Coercion**.  
         - *Offer*: Withholding optional benefits (e.g., a discount) → **Permissible, unless exploitative**.  
     - *Sufficient Answer*:  
       - No deception, coercion, or exploitation of vulnerability.  
       - Refusal costs must not exceed lost opportunity (e.g., missing a discount is acceptable; losing core care is not).  
     - *If No*: Stop. Consent is invalid.  
     - *Judgment Call?*: **Yes** (assess power imbalances; e.g., patients in distress = high risk).  

  5. **Scope and Specificity Validation**  
     - *Question*: Does the consent cover the *exact* use case?  
     - *Sufficient Answer*:  
       - **Re-use/New Partners**: Only if within the original purpose’s "reasonable expectations" (e.g., "training models" ≠ "selling data to advertisers").  
       - **Future Uses**: Must describe categories (e.g., "mental health research") not "any future use."  
     - *If No*: Stop. New consent required.  
     - *Judgment Call?*: **Yes** (use a "reasonable person" standard).  

  6. **Time and Revocability**  
     - *Question*: Is consent **time-bound** and **revocable**?  
     - *Sufficient Answer*:  
       - **Time**: Not perpetual (e.g., expires after 2 years or project end).  
       - **Revocability**: One-click revocation, with no penalty beyond stopping future use.  
       - **Data Handling**: Post-revocation, stop new use; clarify if prior uses are irreversible.  
     - *If No*: Stop. Consent is invalid.  
     - *Judgment Call?*: **Mostly factual** (design must enable easy revocation).  

  **Output**:  
  - **All Steps Pass**: Consent is valid. Proceed.  
  - **Any Step Fails**: Consent is invalid. Redesign required.  
  - **Judgment Calls**: Escalate to privacy counsel + product lead.  

  ---

  ### Application to Cases  
  #### Case 1: Modal for Continued Use as Consent  
  *Design*: "By continuing to use this app, you agree to let us train AI models with your de-identified session notes." No opt-out; refusal exits the app.  

  1. **Normative Power Check**: Yes (using notes without consent violates confidentiality).  
  2. **Competence**: Pass (unless user is in acute distress).  
  3. **Information**: **Fail** – "De-identified" is vague (no risk disclosure); no revocation mechanism.  
  4. **Voluntariness**: **Fail** – Coercive (refusal denies app access, a baseline benefit for existing users).  
  5. **Scope**: Pass (specific to training).  
  6. **Revocability**: **Fail** – No revocation option.  
  **Decision**: **Invalid**. Must allow app use without consent and add revocation.  

  #### Case 2: Waiting Room Research Partnership  
  *Design*: "Join our research! Declining may affect your standing in the care program."  

  1. **Normative Power Check**: Yes (data sharing with partners requires consent).  
  2. **Competence**: Pass (if lucid).  
  3. **Information**: **Fail** – "May affect standing" is ambiguous (material omission).  
  4. **Voluntariness**: **Fail** – Undue influence. "Standing" implies a penalty for refusal, exploiting patient vulnerability. Threatens baseline care expectations.  
  5. **Scope**: Pass (specific to research).  
  6. **Revocability**: Assumed pass (if disclosed).  
  **Decision**: **Invalid**. Remove consequence language; clarify refusal has no care impact.  

  #### Case 3: Broad Consent for Future Research  
  *Design*: "I consent to future use of my data for any research by the company or partners."  

  1. **Normative Power Check**: Yes (open-ended use violates specificity).  
  2. **Competence**: Pass.  
  3. **Information**: **Fail** – "Any research" is overly broad (no concrete purpose/risks).  
  4. **Voluntariness**: Pass (if no pressure).  
  5. **Scope**: **Fail** – Unbounded scope ("any research" ≠ specific purpose).  
  6. **Revocability**: Pass (if included).  
  **Decision**: **Invalid**. Narrow scope (e.g., "mental health research only") and re-consent for new use cases.  

  #### Case 4: Employee Data for "Wellness" Model (Likely Unpopular Outcome)  
  *Design*: Employees consent to chat log monitoring for a "wellness support model." Refusal means ineligibility for a new mental health benefit.  

  1. **Normative Power Check**: Yes (workplace surveillance risks privacy).  
  2. **Competence**: Pass.  
  3. **Information**: Pass (if risks disclosed).  
  4. **Voluntariness**: **Fail** – Undue influence. Withholding a health benefit exploits power imbalance (livelihood dependency). Loss is non-baseline but manipulative.  
  5. **Scope**: Pass.  
  6. **Revocability**: Pass (if included).  
  **Decision**: **Invalid**. Conditioning health benefits on consent is exploitative.  

  #### What the Procedure Can’t Settle  
  - **Baseline Entitlements**: Is app access "core" for telehealth? Are wellness benefits "optional"? Requires policy definition.  
  - **Materiality Threshold**: When is a risk "material" enough to require disclosure? Dependent on user testing.  
  - **"Reasonable" Specificity**: How granular must future-use descriptions be? Context-dependent (e.g., oncology vs. general data).  
  - **Cultural Norms**: E.g., voluntariness standards may vary by user demographics.  

  **Escalate These**: To privacy counsel + ethics board with documented reasoning.  

  ---

  ### Operational Output for Design Docs  
  **Consent Validity Assessment**  
  - **Feature**: Training LLMs on session notes via modal.  
  - **Procedure Outcome**: **Invalid** (fails Steps 3, 4, 6).  
  - **Reasons**:  
    1. Information inadequate: "De-identified" undefined; no revocation.  
    2. Voluntariness violated: Denial of app access coerces consent.  
    3. Revocability missing.  
  - **Required Fixes**:  
    - Add opt-out without app exit.  
    - Disclose de-identification risks.  
    - Include one-click revocation.  
  - **Judgment Escalation**: Privacy counsel to review coercion risk.  

  **Rationale**: Consent must transform impermissible acts into permissible ones. Here, the modal exploits user dependency and obscures material facts, voiding normative power.  

  ---  
  This procedure forces explicit tradeoffs between usability and ethics. It protects your team by converting philosophical rigor into auditable checks, while flagging "gray areas" for legal input. Use it early in design sprints to avoid rework.
