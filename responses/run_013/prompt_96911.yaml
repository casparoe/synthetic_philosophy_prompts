answer: |-
  ## Proposal for Workshop on Diachronic Rationality: The Dollar Auction Revisited

  **1. Working Title and Question (145 words)**

  **Title:** Structural Pressure vs. Psychological Fallacy: When is Escalation in the Dollar Auction Diachronically Rational?

  **Question:** Under the standard rules of the dollar auction (prize = $1, bids increase in fixed increments), for a purely forward-looking, payoff-maximizing agent starting from the position of being the *second-highest bidder*, is there a specific range of current bids and increments where escalating the bid constitutes the uniquely rational choice *at that moment*, considering only future possible outcomes and their probabilities? Specifically, I aim to determine if there exists a definable threshold (e.g., a bid level relative to the prize value and increment) beyond which continuing is compelled by rational foresight, and prior to which stopping is rational, thereby isolating where the auction's structure *forces* escalation irrespective of any psychological sunk-cost fallacy.

  **2. Why it is Still Open (248 words)**

  The dollar auction is ubiquitously cited as a paradigmatic example of the sunk-cost fallacy, where bidders irrationally escalate commitment to avoid admitting a past loss. However, standard treatments rely on an intuitive, often unexamined, linkage between the disastrous final outcomes and the psychology driving individual decisions *at each stage*. Crucially, these analyses frequently conflate the initial decision to *enter* the auction (which may indeed be myopic or irrational) with the subsequent, sequential decisions to *continue bidding* once deeply engaged. They typically describe the escalating bids as evidence of a *mistake* driven by past costs, without rigorously modeling the decision problem facing an agent *already committed* to a significant bid.

  The question remains open because these standard accounts do not formally characterize the sequential decision problem from the perspective of a purely forward-looking agent at specific nodes. They fail to demarcate precisely where, if at all, the auction's rules transform continuation into the *only* rational move to minimize *expected future loss*, given the actions of a rational opponent also trying to cut their losses. For the question to be closed, existing treatments would need to explicitly model the auction as a sequential game of perfect information for rational agents, identify subgame perfect equilibria at each bidding node, and demonstrate that within these equilibria, escalation *never* aligns with expected payoff maximization from that point forward. This precise formalization is absent in the standard psychological literature.

  **3. Approach (302 words)**

  Given constraints (no lab, one term), I will employ formal modeling and conceptual analysis. Running new experiments is impractical without resources, and a literature survey alone cannot resolve the core structural question I've identified.

  1.  **Model Construction:** I will build a simplified sequential game model of the dollar auction. Key parameters: Prize value (V, typically $1), fixed bid increment (Δ), current bid level of the agent in the second-highest position (B), and the current highest bid (B+Δ). The model assumes two rational, payoff-maximizing players interacting sequentially.
  2.  **Decision Node Analysis:** The core focus is a specific decision node where Player A (the current second-highest bidder at bid B) must choose: quit (paying B, receiving nothing) or bid (B+Δ), becoming the new highest bidder. Player B (the *current* highest bidder at B+Δ) then faces a similar choice: quit (paying B+Δ, nothing) or bid (B+2Δ).
  3.  **Rational Choice Calculation:** At Player A's node, I will calculate the expected payoff for quitting versus bidding. Bidding costs Δ immediately but offers a chance to win V if Player B quits, or to become the new second-highest bidder if Player B continues. Crucially, I will assume Player B is also rational and will make the payoff-maximizing choice at their subsequent node. This requires solving the game backwards from later stages.
  4.  **Threshold Identification:** The goal is to find, for given V and Δ, the values of B where Player A's expected payoff from bidding *exceeds* the certain loss from quitting (B), and particularly where it becomes the *dominant* strategy. This defines the region where escalation is structurally compelled for a forward-looking rational agent.
  5.  **Conceptual Integration:** I will analyze the implications of this threshold for the standard "sunk-cost fallacy" interpretation. Does the region of rational escalation exist? Does it encompass common starting points in experimental setups? Does it shift the locus of potential irrationality primarily to the entry decision?

  I choose this over conceptual analysis alone because it forces quantitative precision on the claim of "forward-looking rationality," grounding the philosophical point in demonstrable game-theoretic logic.

  **4. What a Result Would Look Like (198 words)**

  The project can yield one of three core conclusions:

  1.  **Strong Structural Claim:** The model reveals a significant range of B (relative to V and Δ) where escalating is the uniquely rational choice for a forward-looking agent. This would substantially undermine the dollar auction's status as *pure* evidence of sunk-cost fallacy, suggesting the disastrous outcome is often an artifact of the game structure trapping rational players.
  2.  **Limited Structural Claim:** Escalation is rational only in very narrow, perhaps unrealistic, bid ranges (e.g., extremely close to V). This would preserve the auction's primary value as demonstrating fallacy, but refine our understanding of *when* escalation becomes structurally rational late in the game.
  3.  **No Structural Rationale:** The model shows that quitting is always rationally preferable at the second-highest bidder position under standard assumptions of rationality. This would validate the standard sunk-cost interpretation but require explaining why the intuitive "cut future losses" argument fails formally.

  Progress is made by rigorously distinguishing the structural incentive from the psychological explanation. Success lies in definitively establishing which of these three holds, based on the model's equilibrium analysis. Even if my hunch (leaning towards 1 or 2) is wrong and 3 holds, progress is made by *proving* that the intuitive forward-looking argument collapses under scrutiny.

  **5. How it Could Fail (118 words)**

  The primary risk is triviality: the result might be seen as an obvious or unsurprising application of backward induction in a simple game, adding little new insight. A related risk is the project collapsing into a merely verbal dispute about how we *define* "the" decision problem – is it the single step, the whole auction, or something else? I mitigate this by grounding the analysis in the concrete, local decision faced by the second-highest bidder *with sunk costs already incurred*, explicitly adopting the forward-looking perspective. Failure also occurs if the model parameters (V, Δ) prove irrelevant to the outcome, or if assumptions about opponent rationality lead to indeterminate or unrealistic equilibria.

  **6. Scope and Timetable (149 words)**

  **Scope:** In one term, I will complete the formal model (Steps 1-4), identify the rational escalation threshold for standard (V=$1, Δ=$0.05) and perhaps one variant parameter set, and draft the core conceptual argument integrating the findings. I will explicitly *not* attempt:
  *   A comprehensive literature review (references will anchor key claims).
  *   Empirical validation or new experimental design.
  *   Analysis of more complex variants (e.g., variable increments, multiple players) beyond perhaps brief speculation.
  *   A full defense of one specific philosophical interpretation; the focus is establishing the structural fact.

  **Timetable:** Weeks 1-3: Model construction & solution. Weeks 4-5: Threshold calculation & sensitivity analysis. Weeks 6-7: Drafting core argument/results. Weeks 8-9: Refinement and integration for presentation.

  **Likely Challenge Point:** The workshop audience will likely press hardest on **Step 5 (Conceptual Integration)**, questioning whether isolating this "rational escalation zone" genuinely challenges the sunk-cost narrative or simply relocates the potential irrationality to earlier decisions. I will be prepared to argue that it fundamentally changes the *explanation* for the observed behavior at critical late stages.
