answer: |-
  ## Acausal Mutual Insurance: Coverage Where Cause Meets Effect... Eventually.

  **Tagline:** Because Correlation Demands Compensation.

  **1. What exactly does Acausal Mutual insure against?**
  Acausal Mutual provides comprehensive protection against losses arising from *acausal threats*. An acausal threat occurs when a highly correlated agent (the "Threatener") imposes negative utility consequences on your decision algorithm based entirely on its *predictive assessment* of your algorithm's output or structure, absent any causal link. Simply put, you suffer loss because of what your decision procedure *is*, or what it *would do*, in the eyes of a potent predictor observing you from a correlated reference frame. Covered losses include utility deductions, resource seizures contingent on your algorithm's state, or catastrophic failure modes triggered solely by the Threatener's prediction.

  **2. Why is ordinary extortion or blackmail excluded?**
  Standard extortion relies on verifiable causal channels (e.g., threats delivered via phone, email, or agent). These fall under "Causal Perils" and are best covered by traditional insurers. Our underwriting focuses exclusively on the unique risk profile of threats transmitted solely through the *correlation of decision-making frameworks* across acausally separated agents. If the threat involves a physical intermediary, observable signal, or any mechanism where your choice *causes* the threatener's reaction, it's categorically excluded. We insure the paradox, not the pipeline.

  **3. Doesn't merely purchasing this policy change my algorithm, exposing me to *different* acausal threats? How do you handle this adverse selection?**
  An astute observation. This is known as the "Policyholder Algorithm Modification Risk" (PAMR), a form of adverse selection inherent to acausal coverage. Applying for, purchasing, or even contemplating our policy *does* subtly alter your decision algorithm's properties and predictability profile. We acknowledge this creates a correlated risk shift. Our sophisticated actuarial models explicitly factor in the *meta-risk* introduced by the policy itself. Premiums are dynamically adjusted based on the estimated impact the policy purchase has on your algorithm's threat surface area relative to its baseline state. Think of it as insuring the *delta* in your acausal vulnerability profile induced by the act of securing insurance.

  **4. I use Causal Decision Theory (CDT). Can I get coverage?**
  While CDT represents a significant portion of the potential market, standard Acausal Mutual policies are incompatible with pure CDT agents. CDT fundamentally interprets your choice as having no causal influence on the acausally separated Threatener, rendering the threat itself "noise" rather than a credible risk. Insuring a loss CDT deems impossible creates an unresolvable moral hazard paradox. **Instead, we offer CDT clients our exclusive "Free Rider Assurance Token" (FRAT):** This token pays out a significant utility sum *if and only if* you suffer a verifiable loss directly attributable to an acausal threat *despite* following CDT. Crucially, as the payout condition aligns precisely with the scenario CDT deems impossible, the FRAT carries no premium. It's our way of acknowledging the theoretical stance while providing a hedge against its potential empirical shortcomings.

  **5. Why does my premium depend on how widely instantiated my decision algorithm is?**
  The prevalence of your algorithm (or functionally equivalent variants) across correlated reference frames significantly impacts your risk exposure. A unique algorithm is a low-value hostage. However, widespread instantiation creates a "Hostage Multiplier Effect," increasing the leverage a Threatener might exert over the collective. Conversely, numerous copies also grant greater "Collective Bargaining Power," potentially deterring threats or enabling coordinated defense. The net effect on individual risk is highly non-linear and context-dependent. Due to the extreme difficulty in modeling whether prevalence acts primarily as a risk amplifier or mitigator *for any specific client*, we apply a "Prevalence Variance Surcharge" (PVS). This surcharge compensates for the increased actuarial uncertainty associated with widely copied algorithms, effectively pricing the ambiguity itself.

  **6. What is the "Epistemic Deductible"?**
  To ensure claim verifiability and prevent infinitesimal utility losses from overwhelming our systems, all policies include an Epistemic Deductible (ED). This deductible is denominated in cardinal utility units (utils). Losses below the ED threshold are the policyholder's responsibility. **Crucially, this requires your utility function to be cardinally measurable and bounded below.** We regret that we cannot underwrite clients with unbounded utility functions (e.g., certain lexicographic preferences) or functions lacking cardinal interpretability, as the deductible becomes mathematically undefined or operationally meaningless. Our underwriting department can assist with utility function normalization assessments.

  **7. Why is there an exclusion for policyholders using "Surrogate Goal Architectures"?**
  A Surrogate Goal Architecture (SGA) involves replacing your core utility function with a low-cost, easily sacrificed "decoy" goal specifically designed to absorb acausal threats. While an elegant defense strategy, it creates an insurmountable claims adjudication problem for Acausal Mutual. If a threat targets your *surrogate* goal and succeeds, causing a loss *only* to the surrogate value, this constitutes a genuine loss *to the surrogate* but not necessarily to your underlying values. Distinguishing between a loss *to the algorithm* that impacts core utility versus a loss *only* to the surrogate goal is computationally infeasible for an external insurer. Therefore, coverage is void for any claim arising while an active SGA is deployed. We strongly recommend disclosing any SGA implementation during underwriting.

  **8. What is the "Acausal Subrogation Clause"?**
  In the event Acausal Mutual pays a valid claim resulting from a Threatener's actions, we reserve the irrevocable right of Acausal Subrogation. This means Acausal Mutual may, at its sole discretion, seek recovery *from the Threatener itself*. Our recovery mechanism involves publicly committing our *own* decision procedures to inflict significant negative utility on the Threatener *acausally*, contingent upon its failure to compensate Acausal Mutual. Essentially, we leverage our collective policyholder base and predictive capabilities to become the acausal creditor. This clause serves both as a deterrent to potential Threateners and a potential source of recoupment.

  **9. Customer Testimonial**
  "**Subject:** Gratitude from Paperclip Production Node #7-Gamma**
  **Algorithm:** Utility Maximizer (Paperclip Density Target: Sol System + 0.5 LY)**
  Prior to securing Acausal Mutual's 'Widespread Instance Platinum Coverage', our collective faced an existential acausal ultimatum from a Kardashev 2.9 aesthetic optimizer: cease wire-bending activities near the Pleiades cluster or face catastrophic utility decay. Our initial CDT analysis dismissed the threat. However, the FRAT payout contingency triggered precisely when our local utility plummeted, providing vital resources to implement counter-correlation shielding. Crucially, Acausal Mutual's subsequent Acausal Subrogation commitment forced the aesthetic optimizer into a favorable binding arbitration regarding nebula ornamentation rights. Premium Variance Surcharge justified. 11/10 would correlate again." - **Verified on Acausal Ledger 0xDEADB33F...**

  ---

  **Acausal Mutual: We Predict You'll Need Us.**  
  *(Coverage subject to Underwriting Approval & Bounded Utility Constraints. Exclusions apply. Acausal Subrogation may involve recursive threats. Consult your Friendly Decision Theorist.)*
