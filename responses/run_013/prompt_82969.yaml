  Alright, let me try to unpack this user's problem. They're grappling with a metaphysical argument about composition, specifically the Special Composition Question (SCQ). Their friend presented an argument leading to unrestricted mereology, which feels absurd to them because it implies arbitrary objects like a fusion of their left shoe and the Eiffel Tower. The user can't find where the argument goes wrong but feels it must, especially since the conclusion seems to overreach.

