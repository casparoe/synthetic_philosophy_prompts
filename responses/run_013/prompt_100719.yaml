prompt: |-
  I'm prepping a seminar on classification in psychiatry and I'm sick of the standard looping-effect example — people get a label, read up on it, start acting the part, experts revise the label, round and round. I want the mirror image, built to order. Give me one case where the loop runs the other way: no patient behaves any differently, nobody's performing anything, and yet the classification feeds back on itself so the category gets more entrenched — or better, so the categorys own numbers stop meaning anything. It has to run through an ordinary clinic or paperwork mechanism (charts, rating scales, billing, referral patterns, whatever), no sci-fi, and fit in one paragraph. Then walk it: what feeds into what at each step, whether the category is still tracking something real and in what sense, whether this is Hacking's "interactive kind" story (people react to being classified, unlike rocks) or a different animal, and what single observation would break the loop. Tell me which one feature is doing the work and what happens if I take it out — does the case just collapse back into the boring version? And does the same trick work for a non-psychiatric category like a disease or a species, or is something about psychiatric classification load-bearing here? This is for a group where a realist and a social constructionist will both be in the room, so I need a case where they genuinely disagree about what it shows, not one where the moral is just "so the category is made up." Start with the case itself in the first sentence — no preamble about Hacking or about looping effects, just the scenario, then the analysis.
reasoning: |-
  We are going to build a case of a classification feedback loop that runs without any change in patient behavior or performance of the label. The mechanism will be through ordinary clinical paperwork, specifically diagnostic coding and billing.

  **Case:** A new billing code is introduced for "treatment-resistant depression" (TRD), defined as failure to respond to at least two adequate antidepressant trials, which triggers eligibility for advanced therapies and higher reimbursement rates.

  **Step-by-step feedback loop:**
  1. **Initial definition:** The category TRD is defined by a specific operational criterion (non-response to two antidepressants).
  2. **Billing incentive:** Clinicians, facing administrative pressure and seeking resources for patients, code more cases as TRD to access higher reimbursements and advanced treatments.
  3. **Documentation drift:** To justify the code, clinicians document patient histories to fit the criterion (e.g., noting past trials as "adequate" even if borderline, or emphasizing lack of response). No change in patient symptoms or behavior occurs.
  4. **Epidemiological reinforcement:** Prevalence rates for TRD rise in databases, making it appear as a more common and severe public health problem.
  5. **Research and guideline focus:** Funding and research shift toward TRD, leading to more studies, refined subcategories, and clinical guidelines that further codify the original definition.
  6. **Entrenchment:** The category becomes entrenched in electronic health record templates, quality metrics, and insurance policies, creating a feedback loop where the definition drives its own validation without any change in the underlying patient phenomenology.

  **Analysis:**

  - **What feeds into what?** 
    - The billing code (with financial/logistic incentives) influences clinician coding behavior. 
    - Coding behavior alters documentation, which then affects epidemiological data. 
    - Epidemiological data drives research and policy, which reinforces the category definition and its operational criteria.

  - **Is the category tracking something real?**
    - Realist: Yes, at the core, there are patients with severe, hard-to-treat depression. The category captures a real clinical challenge, even if the boundaries are fuzzy.
    - Social constructionist: The "real" core is obscured by the bureaucratic and financial processes that inflate the category's boundaries and prevalence. What counts as TRD becomes a product of the system, not just nature.

  - **Interactive kind or different?** 
    - This is not Hacking's interactive kind because patients aren't reacting to the label (no identity change, no performance). Instead, it's a *bureaucratic-administrative loop* where the classification system interacts with institutional practices, not with the classified individuals.

  - **What single observation would break the loop?** 
    - If an audit reveals that a large proportion of TRD-coded cases lack rigorous evidence of two adequate antidepressant trials (e.g., via prescription records or dose/duration criteria), exposing the documentation drift. This would undermine the category's validity and force a re-evaluation.

  - **Which feature is doing the work?** 
    - The financial/institutional incentive (higher reimbursement for TRD) is key. Remove it, and the loop collapses: coding practices would align more closely with clinical reality, prevalence data would stabilize, and the feedback loop would weaken. Without the incentive, the case might revert to a more "passive" classification system, though other factors (like diagnostic creep) could still operate.

  - **Does this work for non-psychiatric categories?** 
    - Yes. Example: In general medicine, a new billing code for "pre-diabetes with complications" could lead to over-documentation of complications to justify intensive management, inflating prevalence and entrenching the category. However, psychiatric categories are more vulnerable because they rely heavily on subjective reporting and interpretation, making documentation drift easier.

  - **Why will realists and constructionists disagree?** 
    - Realist: The loop is a distortion of a real entity (treatment-resistant depression exists, but incentives cause over-diagnosis). The core category remains valid.
    - Constructionist: The category is co-created by the system; what we call TRD is inseparable from the bureaucratic machinery that defines and rewards it. There is no "pure" TRD outside these practices.

  This case avoids sci-fi, uses mundane clinical mechanisms (billing and coding), and creates genuine tension between realism and constructionism without reducing to "the category is made up."
answer: |-
  **Case:** A new billing code for "chronic subthreshold depression" (CSD) is introduced, defined by persistent low mood not meeting major depression criteria but lasting over two years, with automatic referrals to specialized therapy programs once coded.

  1. **Initial coding:** Clinicians, pressed for time, code ambiguous cases of mild, persistent low mood as CSD to expedite therapy access for patients, even when symptoms might fit adjustment disorder or normal variation. Patients don't change their behavior or self-perception.  
  2. **Data inflation:** Electronic health records flag CSD codes for quality audits, so clinicians over-document "low mood" and "two-year duration" in charts to avoid penalties, inflating prevalence in hospital databases.  
  3. **Resource allocation:** High CSD numbers justify expanding therapy programs, which adopt CSD-specific protocols. Research grants prioritize CSD, producing studies that validate the category using chart-review data (now biased by documentation).  
  4. **Reification:** Guidelines harden CSD criteria around the two-year threshold and coded symptoms, making it a default label for vague distress. The category grows entrenched, but its clinical utility erodes—it no longer distinguishes treatment-responsive cases.  

  **Feedback mechanics:**  
  - **Inputs:** Billing incentives (quick referrals) and audit pressures feed clinician coding/documentation.  
  - **Outputs:** Biased data feeds resource shifts and research, which retroactively validate the original criteria.  

  **Tracking reality?**  
  - **Realist view:** CSD still loosely tracks real human distress (some people *do* have chronic low mood), but noise from overcoding drowns signal.  
  - **Constructionist view:** The "real" distress is irrelevant; CSD is a bureaucratic artifact shaped by incentives, not patient experiences.  

  **Interactive kind?** No—this is *administrative looping*, distinct from Hacking. Patients aren't reacting; the system reacts to itself via paperwork. Rocks don't generate billing data, but here, clinicians/institutions drive the loop, not the classified individuals.  

  **Loop-breaking observation:** An independent study shows CSD therapy outcomes are no better than placebo for patients *not* initially seeking help, proving coding/documentation divorced the category from clinical need.  

  **Key feature:** The automatic referral rule. Remove it, and coding aligns closer to symptoms (boring looping returns if patients later "perform" CSD for therapy access).  

  **Non-psychiatric test:** Works for a disease like "pre-renal syndrome" in nephrology—vague criteria plus billing incentives for early coding could inflate prevalence via overdocumentation of borderline lab values, entrenching a shaky category. But psychiatric classifications are more vulnerable due to subjective symptoms and therapy gatekeeping, making paperwork effects stronger.  

  **Realist/constructionist clash:**  
  - Realist: "CSD is real but corrupted by bureaucracy; clean the data!"  
  - Constructionist: "The bureaucracy *is* the category; no 'pure' CSD exists outside it."
