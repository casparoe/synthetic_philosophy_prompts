prompt: |-
  I have spent some time trying to find the right concept for a pattern of social punishment, and I have not found one that fits, so I want to describe the pattern precisely and ask what the nearest existing concepts are, and what this one should be called.

  The pattern has five features that I cannot get any single concept to cover at once.

  First, the norm that was violated is never actually produced. People who impose the sanction say it is obvious what was wrong, but no one can state the rule, say who holds it, or say when it was adopted; if pressed, they point back to the original act.

  Second, no one imposed it. There is no body, office, vote, or procedure that can be identified as the source of the penalty, and therefore nothing to appeal to, no one to petition, and no one with the standing to lift it. It is not that the process was unfair; there is no process, and no defendant either.

  Third, the sanction is not a harm added to a person but an association withdrawn from them. Invitations stop, a platform removes an account, a publisher declines to renew, colleagues stop answering. Its severity tracks how many people happened to see the original act rather than how much harm the act did, and it does not come in degrees: a person is either still inside the relevant community or outside it, with nothing resembling a sentence that could be served and completed.

  Fourth, it does not end when anything is repaired. It ends when attention moves on, and because the record of the act is permanent and searchable, it can be revived years later without new conduct. The one thing demanded in exchange for readmission is a public statement of contrition, whose sincerity cannot be verified, so a statement that is too quick, too late, too polished, or too flat becomes a fresh offence.

  Fifth, the people enforcing it are mostly strangers to the person being punished. It is not a community applying its own norms to its own members.

  Two instances, to fix the shape. A speaker makes an offhand remark to a room of thirty people; someone films it; within a week two venues cancel, a platform suspends the account, and the person's employer announces that they have agreed to part ways. No charge is ever stated. In the second case, a mid-level manager who has been casually cruel to subordinates for years is finally named in a public thread after the internal process does nothing; within a month the manager is gone and cannot be hired. Here the norm was statable and the harm documented, and I think the outcome was on the whole good, which is exactly why I want the structural concept and not a verdict on whether the practice is good or bad.

  I know the vernacular labels — 'cancelling', 'call-out', 'deplatforming' — and I do not think they are concepts; they are names for the controversy rather than for the structure. I also suspect the nearest neighbours are ostracism, outlawry, excommunication, vigilantism, and the general category of informal social sanction, but each of these seems to me to have a feature this lacks, and I want that checked rather than assumed. A bare name will not help me. What I need is the carving: whether there is an established concept that covers the pattern, which one fits best, exactly where each near neighbour diverges, and if nothing fits, a proposed term with a definition, its essential and accidental features, and its edges. In particular I want rulings on these cases: a consumer boycott of a company over a policy; a private decision not to associate with someone; a market refusing to deal with a person for purely commercial reasons; a formal disciplinary process that is merely harsh; and the state achieving the same effect through licensing or employment law. I also want to know whether the absence of a procedure is essential to the phenomenon or incidental, and whether the demand for sincere public contrition belongs to the same structure or is a separate one.

  After your prose answer, append a JSON object with exactly these fields: "established_concept" (one of "yes", "partial", "no"); "best_candidate" (the name of the closest existing concept, or null); "candidate_concepts" (an array of objects, each with "name", "why_it_is_close", and "why_it_falls_short"); "coined_term" (a term if none of the existing concepts fit, otherwise null); "definition" (one or two sentences defining the phenomenon as you have carved it); "essential_features" (array of strings); "accidental_features" (array of strings); "boundary_cases" (an array of objects, each with "case", "verdict" — one of "instance", "not an instance", "unclear" — and "reason"); and "open_questions" (array of strings).
reasoning: |-
  Hmm, the user presents a meticulously structured query about a social punishment phenomenon. They've identified five specific features that existing concepts don't fully capture, and they want rigorous conceptual analysis rather than casual labeling. 

  The user clearly has academic or analytical intentions - they're frustrated with vernacular terms like "canceling" being too politicized or vague. Their two concrete examples show they're observing real-world patterns, not theorizing abstractly. Interestingly, they include a case they consider justified (the cruel manager) to emphasize they seek structural understanding, not moral judgment.

  Key challenges in their query: First, how to reconcile the seemingly contradictory features - especially the lack of defined norms/procedures but highly coordinated enforcement. Second, whether the demand for "sincere contrition" is core or peripheral. Third, how to distinguish this from similar mechanisms like ostracism or boycotts.

  The five features form a coherent pattern: 1) Unarticulated norms, 2) Procedural void, 3) Exclusionary nature, 4) Perpetual vulnerability, 5) Stranger-enforcement. What makes this unique is how digital permanence and viral dynamics amplify traditional social shaming into something resembling extra-legal banishment.

  For boundary cases: Consumer boycotts fail criteria 1-2 since they target policies not persons with clear demands. Private avoidance lacks feature 5 (stranger enforcement). Formal discipline has procedures (counter to feature 2). The licensing example is state action, violating feature 2's "no body" requirement.

  The contrition demand seems structurally essential - it's the only "ritual" available in this procedural vacuum. Without it, readmission would be purely arbitrary rather than conditionally negotiable.

  Existing concepts fall short: Ostracism was formal/voted; excommunication requires religious authority; vigilantism claims legitimate enforcement; boycotts are instrumental. "Informal sanction" is too broad - like calling a tornado "bad weather".

  Coining "ad hoc excommunication" captures the religious parallel while emphasizing improvisation. "Digital" feels redundant as analog precursors exist (e.g., Hollywood blacklists), though technology intensifies the scale and permanence.

  The JSON structure they requested will force precision. Particularly important is distinguishing essential features (like unarticulated norms) from accidental ones (e.g., digital mediation). The "unclear" verdicts on boundary cases should acknowledge gray areas where features partially align.
answer: |-
  Based on your precise description and analysis of the five features, I find no *single* established concept fully encompassing all aspects. The phenomenon is a distinct hybrid pattern arising in digitally networked societies. Here's the conceptual carving:

  **Analysis & Carving:**

  1.  **Established Concept:** **Partial.** No single existing concept captures all five features simultaneously. Related concepts share elements but lack the specific combination, particularly the *procedural void*, *unarticulated norms*, and *stranger-enforcement* combined with *permanent digital record*.

  2.  **Best Candidate:** **Informal Social Sanction / Social Ostracism.** This is the broadest relevant category, but it lacks specificity for the digital age features and the unique procedural aspects you describe.

  3.  **Candidate Concepts & Shortcomings:**
      *   `{"name": "Ostracism", "why_it_is_close": "Involves expulsion/exclusion from a community based on perceived violation.", "why_it_falls_short": "Historically formal (e.g., Athenian vote), specific to a defined polity/community, often had defined duration or conditions for return, lacked the role of permanent digital record and mass stranger-enforcement."}`
      *   `{"name": "Excommunication", "why_it_is_close": "Exclusion from a community (religious), severe consequence, demand for repentance for readmission.", "why_it_falls_short": "Requires a formal religious authority/structure to impose and lift, based on codified doctrine/laws, specific to a defined religious community."}`
      *   `{"name": "Outlawry", "why_it_is_close": "Placing someone outside the protection/association of the community/law, making them vulnerable.", "why_it_falls_short": "Was a formal legal decree (state/judicial), lacked the digital permanence and mass coordination, typically involved physical danger."}`
      *   `{"name": "Vigilantism", "why_it_is_close": "Punishment imposed outside formal procedures by non-authorities.", "why_it_falls_short": "Typically involves direct infliction of harm (physical or property), aims to enforce a specific (often stated) law/norm perceived as neglected, often localized."}`
      *   `{"name": "Informal Social Sanction", "why_it_is_close": "Broad category covering non-state punishment like shunning, gossip, boycott, which can lead to exclusion.", "why_it_falls_short": "Too broad; encompasses many acts lacking your features 1 (unarticulated norm), 2 (complete procedural void), 4 (permanent digital record enabling revival), and 5 (stranger-enforcement). Includes minor sanctions."}`
      *   `{"name": "Cancel Culture (as vernacular)", "why_it_is_close": "Refers to the phenomenon you describe in contemporary discourse.", "why_it_falls_short": "Not an established academic/sociological concept; highly politicized and contested term focusing on controversy, lacks precise definition, doesn't carve the structural features neutrally."}`
      *   `{"name": "Deplatforming", "why_it_is_close": "Specific act of denying access to a platform/service, a common *mechanism* within your pattern.", "why_it_falls_short": "Too narrow; describes only one *type* of association withdrawal (Feature 3), doesn't cover the full structural context (Features 1,2,4,5), can occur for non-normative reasons."}`

  4.  **Coined Term:** **Ad Hoc Excommunication.** This emphasizes the core act of exclusion ("excommunication") and its defining characteristics: lack of formal structure, authority, or predefined rules ("Ad Hoc"). It captures the sudden, improvised, yet severe nature.

  5.  **Definition:** Ad Hoc Excommunication is a mode of social punishment characterized by the collective withdrawal of association from an individual in response to a perceived norm violation, enforced primarily by strangers through networked coordination, lacking any formal articulation of the norm violated, any defined procedure for imposition or appeal, and persisting indefinitely due to digital permanence, with readmission contingent upon public contrition.

  6.  **Essential Features (must all be present):**
      *   `Collective withdrawal of association/access as the core sanction.`
      *   `Perceived violation of an unstated/unarticulated social norm.`
      *   `Absence of any defined authority, body, procedure, or process for imposing the sanction or appealing it.`
      *   `Enforcement primarily by individuals/entities not part of the punished person's immediate community or prior direct relationship (stranger-enforcement).`
      *   `Indefinite duration and vulnerability to revival due to permanent digital record of the triggering act.`
      *   `Readmission contingent upon public performance of contrition, the sincerity of which becomes a new potential fault line.`

  7.  **Accidental Features (commonly associated but not definitional):**
      *   `Occurring online or mediated by digital technology (enables scale & permanence, but analog precursors exist).`
      *   `Involving public figures or institutions (can affect anyone).`
      *   `Triggered by speech acts.`
      *   `Perceived as disproportionate or unjust (can also be perceived as justified).`
      *   `Driven by social media dynamics.`
      *   `Resulting in significant financial/professional harm.`

  8.  **Boundary Cases:**
      *   `{"case": "Consumer boycott of a company over a specific policy.", "verdict": "not an instance", "reason": "Targets an entity (not primarily an individual), norm/policy is usually stated, often has organizers/demands (counter to Feature 2), seeks specific change rather than indefinite exclusion/contrition."}`
      *   `{"case": "A private individual deciding not to associate with someone based on personal dislike or past behavior.", "verdict": "not an instance", "reason": "Lacks collective/coordinated action, stranger-enforcement, and public digital permanence as a key factor. It's personal avoidance."}`
      *   `{"case": "A market refusing to deal with a person solely due to commercial risk/reputation (not moral outrage).", "verdict": "not an instance", "reason": "Lacks the core element of being a *punishment* for a perceived *norm violation* (Features 1, 2). Motive is commercial prudence."}`
      *   `{"case": "A formal disciplinary process (corporate, academic, legal) that is very harsh but follows defined rules.", "verdict": "not an instance", "reason": "Violates Feature 2 (Absence of defined procedure/authority). It may be unjust, but it has a process."}`
      *   `{"case": "The state revoking a license or using employment law to bar someone, achieving similar exclusion.", "verdict": "not an instance", "reason": "Violates Feature 2 (Absence of defined authority/procedure). This *is* state action via formal or quasi-formal legal/administrative processes."}`
      *   `{"case": "A group of friends shunning a member for a clear, stated betrayal.", "verdict": "unclear", "reason": "Has withdrawal of association (Feature 3) and potentially unstated deeper norms. Lacks stranger-enforcement (Feature 5), permanent digital record as key factor (Feature 4), and may have an implicit 'community' process (counter to Feature 2). Leans towards traditional ostracism/social sanction."}`
      *   `{"case": "A platform automatically banning an account based on algorithmically detected TOS violation.", "verdict": "not an instance", "reason": "Violates Feature 1 (norm *is* stated in TOS) and Feature 2 (procedure is defined by the platform, even if automated/appeals exist). Lacks the collective/stranger-driven element (Feature 5)."}`

  9.  **Open Questions:**
      *   `Is the *perceived injustice* of the outcome an inherent structural element, or purely an external judgment?`
      *   `How does the scale of coordination (e.g., viral vs. niche) impact whether it fits the definition?`
      *   `Can this phenomenon exist without digital technology enabling mass stranger-coordination and permanent records? (Or are pre-digital analogs structurally distinct enough?)`
      *   `What are the precise dynamics that transform individual disapproval into coordinated "ad hoc excommunication"?`
      *   `Is the demand for contrition primarily performative (reaffirming the unspoken norm) or instrumental (gauging future risk)?`

  **Rulings on Specific Queries:**
  *   **Absence of Procedure:** This is **essential** (Feature 2). The defining lack of any identifiable source, process, or appeal mechanism is core to the phenomenon's "ad hoc" and extra-procedural nature.
  *   **Demand for Sincere Contrition:** This is **part of the same structure** (Feature 4). It emerges as the *only* available mechanism for potential readmission precisely *because* there are no formal procedures for adjudication, apology, or rehabilitation. The focus on public performance and the inherent unverifiability of sincerity are direct consequences of the procedural void and become central to the dynamic of the sanction.

