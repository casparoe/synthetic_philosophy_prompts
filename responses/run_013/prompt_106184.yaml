  Alright, a bit of background so you know where I'm coming from: I'm 68, just retired after forty years in biochem, and I've been trying to teach myself philosophy from books in the evenings. I keep circling back to the Meno, the part where Socrates asks why knowledge is supposed to be worth more than a true belief, since a true belief gets you to the same place. He says true beliefs are like the statues of Daedalus, which won't stay put unless you tie them down, and knowledge is the tied-down version. But that never satisfied me. The statue is still the statue. If a man with a true belief about the road to Larissa guides you there just as well as the man who knows the way, then whats actually gained? And somewhere I read an argument that maybe nothing is gained, because if all that makes a belief good is being true, then whatever produced it is just a means to that end, and a means doesn't add value to the end it produces. I definately can't tell if that's a cheap trick or the real answer.

  I want a poem about this. 12 to 16 lines, no fixed form needed, but here's what I actually care about: the shape of the poem should do the work. Give me a line that keeps coming back but never quite the same, slipping and drifting and not staying put, and then at the very end have it come back exactly the same and stay, so the reader feels the difference between a belief that merely happens to be right and one that's been anchored. Don't explain the difference inside the poem, make the structure enact it. Someone who's read the Meno should recognize the road to Larissa and the Daedalus bit without me having to spell them out.

  And at the end, outside the poem, give me a short note separating what's pretty much settled, like what the puzzle actually is and whats at stake, from what people who study this genuinely disagree about, like whether knowledge really is more valuable, whether Socrates' answer even works, or whether the swamping worry I mentioned is decisive. I've been burned by pop videos that make one contested reading sound like the last word, so please don't do that.
