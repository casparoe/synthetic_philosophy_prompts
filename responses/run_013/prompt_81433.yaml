  For (d) on erasure cost variations: Quantum thermodyamics complicates Landauer. The question probes whether this helps her case or just refines the opposition. Follow-up must dissect if correlation-dependent costs imply deeper physics. 

  For (e) on empirics: She’ll likely cite retrodiction or sims, but the follow-up demands falsifiable predictions to avoid "not even wrong" territory. 

