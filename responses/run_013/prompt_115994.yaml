  ### Key Features:
  1. **Logical Flow**: Starts with ontology of simplicity (inherent vs. linguistic), then tests mechanisms (prior vs. likelihood), justifications, and operational conflicts.
  2. **Concrete Cases**: Embedded in branch tests (e.g., lookup tables for prior/likelihood, short-but-false hypotheses for justification).
  3. **Leaf Commitments**: Each leaf specifies:
     - Defining commitment (core tenet)
     - Most awkward commitment (vulnerability)
     - Where simplicity does its work (prior/likelihood/both/neither)
     - Justification type
  4. **Unoccupied Combinations**: Identifies incoherent/unattractive paths (e.g., mixing objective likelihoods with pragmatic justification).
  5. **Unseparated Pairs**: Flags positions differing only in subtle metaphysical commitments (L1/L3) or emphasis (L7/L8).

  ### How to Use:
  - **Readers**: Answer branch questions based on intuition about cases (e.g., "Should we prefer a simple hypothesis even if independently false?").
  - **Output**: Leaf positions reveal underlying commitments, not self-applied labels.
  - **Design Logic**: Forces confrontation between regularity-simplicity (pattern) and residue-simplicity (noise), and explicitly tests if simplicity hides in likelihood (via concentration).
