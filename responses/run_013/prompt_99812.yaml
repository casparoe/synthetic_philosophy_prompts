  Looking at the evidentiary account first: it treats originals as valuable primarily because they're reliable records of the artist's creative process. Their value comes from the information they provide about artistic choices and techniques. According to this view, if we could perfectly replicate all this information through other means, the original wouldn't have any special value.

  The contact account offers a different perspective. It values the original as the direct product of the artist's agency - what matters is the physical connection between the artist and the object they created. This value is relational rather than informational; it's about the causal link itself, not what we can learn from it.

  For question 1 about perfect forgeries: The contact account better explains why we intuitively value originals more than perfect forgeries. Even if a forgery looks identical and we document its creation meticulously, it lacks that direct causal connection to the original artist. The forgery was made by someone else, so it's fundamentally disconnected from the creative act we value. The evidentiary account struggles here because if the forgery preserves all visible properties and we document its creation, it theoretically provides the same information as the original.

  For question 2 about self-forgeries: This is fascinating. If the original artist creates an identical copy decades later, the contact account would still value the original more because it was created during the original creative act. The later copy, even if made by the same artist, is causally disconnected from that initial moment of creation. The evidentiary account would likely see both as equally valuable since they provide the same information about technique. This reveals that contact theory prioritizes historical particularity - the "when" matters as much as the "who."

  For question 3 on whether the accounts are distinct: I think they are fundamentally different. The contact account insists on valuing the physical object itself for its history, not just the information it carries. Reducing "contact" to just another fact misses the point - it's about valuing the actual material connection, not just knowing about it. This relates to philosophical concepts like token-value versus type-value.

  For question 4 about authenticity as taste: The contact account is more vulnerable here because its insistence on physical connection can seem like fetishizing authenticity without deeper justification. The evidentiary account grounds value in concrete epistemic benefits, making it less susceptible to this charge.

  The verdict should be "contact" based on its superior handling of the forgery intuition. What ultimately decides this is the irreplaceable nature of causal history in art valuation - something the evidentiary account cannot adequately capture.
