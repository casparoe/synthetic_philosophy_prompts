  ### Comparing Evidentiary and Contact Accounts of Originality

  The debate between the evidentiary and contact accounts centers on whether the value of an original artwork lies in its *informational content* or its *unique causal history*. While both offer plausible frameworks, the contact account provides a more compelling explanation for core intuitions about originality, forgery, and artistic value.

  #### 1. The Forgery Intuition  
  The contact account decisively explains why a perceptually perfect forgery lacks the value of the original. It posits that the original’s worth stems from being the physical terminus of the artist’s creative act—a direct causal extension of their agency. A forgery, however indistinguishable, is disconnected from this historical moment; it is a distinct artifact born of imitation, not creation. The intuition of diminished value arises because the forgery lacks the *relational property* of being "touched" by the artist’s intent in the original context. The mechanism is ontological: value resides in the object’s genesis, not its appearance.  

  The evidentiary account cannot generate this intuition. If a forgery preserves all visible properties and its creation is fully documented, it theoretically offers identical information about technique and choices as the original. On this view, the forgery should be equally valuable as a record—yet our intuition rejects this equivalence. The evidentiary account thus fails to capture the irreplaceable "aura" of the original’s creation.

  #### 2. The Self-Forgery Paradox  
  In the case of a "self-forgery"—where the artist creates an identical copy decades later—the contact account *does* entail that the copy has less value than the original. Though made by the same artist, the copy is causally severed from the initial creative act. The original embodies the artist’s agency *at the moment of conception*; the replica, however skillful, is a retrospective reenactment. This reveals a key tenet of contact theory: value is tethered to the *historical particularity* of the work’s origin. The original is irreplicable because it crystallizes a unique artistic intention in a specific spacetime context.  

  The evidentiary account would likely deem the self-forgery equally valuable, as it offers identical information about technique. This outcome is acceptable to evidentiary theorists but highlights their core limitation: they reduce art to data, neglecting the significance of artistic acts as unrepeatable events. The contact account’s insistence on the original’s uniqueness thus aligns with the intuition that art is more than the sum of its perceptible properties.

  #### 3. Distinctness of the Accounts  
  The accounts are genuinely distinct and do not collapse into one another. The evidentiary account is resolutely epistemic: value derives from the artwork’s *testimonial power* as a document of creative decisions. The contact account, conversely, is metaphysical: value inheres in the artwork’s *causal lineage* as a product of the artist’s direct action.  

  To claim "contact" merely provides "facts" about provenance is to misunderstand relational value. Contact theory does not prize information *about* the causal connection; it prizes the connection *itself*. For instance, knowing a painting was touched by Rembrandt’s hand adds no informational content to a perfect replica, yet it remains valorized. This echoes "haeccity" (this-ness) in philosophy: the original is valued as a unique *token* of artistic expression, not as a *type* defined by properties. Reducing contact to evidence conflates *constitutive* value (the object *is* the artist’s act) with *derivative* value (the object *reports* on the act). The accounts thus diverge in their metaphysics of value.

  #### 4. Vulnerability to the "Authenticity Fetish" Charge  
  The contact account is more vulnerable to accusations of fetishizing authenticity. Its emphasis on physical causation risks appearing arbitrary—a sentimental bias for "the real thing" masquerading as theory. Critics might argue that privileging causal history over aesthetic experience or informational richness is irrational, akin to valuing a saint’s relic for its proximity to holiness rather than its inherent qualities.  

  The evidentiary account is less susceptible here, as it grounds value in objective utility: originals are simply superior vessels of knowledge. Yet this defense is unconvincing. By dismissing the forgery intuition, the evidentiary account reveals its own bias: it implicitly privileges authenticity as a *means* to reliable information. If authenticity were irrelevant, any accurate replica would suffice—yet we resist this conclusion. Both accounts, then, grapple with authenticity, but the contact account’s vulnerability is more pronounced because it defends the irreducibility of a non-instrumental good.

  ### Conclusion  
  The contact account better navigates the forgery paradox and self-forgery dilemma by anchoring value in the artwork’s irreducible historical identity. While it risks charges of mystifying authenticity, it acknowledges a truth the evidentiary account overlooks: art is valued not just as evidence, but as embodied history. The evidentiary account’s failure to explain why perfect replicas feel deficient is fatal; it cannot accommodate the visceral sense that an original is a direct encounter with the artist’s presence.  

  **Verdict: contact**  
  The decisive consideration is the contact account’s superior explanation of why even a flawless forgery—or the artist’s own replica—lacks the original’s value, as it recognizes art as a testament to unrepeatable human acts, not merely a repository of data.
