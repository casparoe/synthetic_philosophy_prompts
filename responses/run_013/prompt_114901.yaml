answer: |-
  ### Game Design: "The Coordination Challenge"  
  **Objective:** Illustrate the concept of a safe Pareto improvement through gameplay, where students experience a coordination problem, propose rule changes, and discover that most intuitive fixes are unsafe.  

  ---

  ### **Base Game: "The Trust Dilemma"**  
  #### Rules & Payoffs (Play Money in "Points"):  
  - Two players per round.  
  - Each player secretly chooses **A** or **B**.  
  - Payoffs:  
    - **(A, A)**: Both earn **30 points** (optimal outcome).  
    - **(B, B)**: Both earn **10 points** (suboptimal outcome).  
    - **Miscoordination (A/B or B/A)**: Both earn **0 points**.  

  #### Why this game?  
  - Two pure Nash equilibria: **(A, A)** and **(B, B)**.  
  - **(B, B)** is risk-dominant: Choosing **B** guarantees at least 10 points if the other plays along, while **A** risks 0. Students often default to **(B, B)** without communication, feeling "stuck" at low payoffs.  

  ---

  ### **Activity Timeline (90 Minutes)**  
  #### **1. Setup (5 min)**  
  - **Materials**: Scorecards (track points), pens, game rules handout.  
  - **Grouping**: 16 students → 8 pairs (rotate partners later).  
  - **Instructions**:  
    - “You’ll play 5 rounds with the same partner. Each round, simultaneously choose **A** or **B**. Your goal is to maximize points. No talking during gameplay.”  

  #### **2. Base Game Phase (15 min)**  
  - Play 5 rounds (3 min/round).  
  - **Logistics**:  
    - Round 1: Force randomness (“Flip a coin: Heads **A**, Tails **B**”). Ensures some **(B, B)** outcomes.  
    - Rounds 2–5: Free choice.  
    - After each round, record outcomes privately.  
  - **Predictable Outcome**:  
    - Most pairs settle into **(B, B)** by round 3–4. Frustration arises from being unable to coordinate on **(A, A)**.  

  #### **3. Reflection & Problem Identification (10 min)**  
  - **Pair Discussion (5 min)**:  
    - “Why did you end up at **(B, B)**? What stopped you from consistently choosing **A**?”  
  - **Class Share (5 min)**:  
    - Highlight: *Risk aversion, fear of miscoordination, lack of trust*.  

  #### **4. Rule Modification Phase (20 min)**  
  - **Task**:  
    - “Propose a **permanent rule change** to improve outcomes. It must apply to both players. Write it down.”  
  - **Examples of Predictable (Unsafe) Proposals**:  
    - *“Both must choose A”* → Fails if one defects.  
    - *“Add a penalty: If you play B, lose 5 points”* → Still allows **(B, B)** with lower payoffs (5 points each).  
    - *“Play sequentially: Player 1 chooses first”* → Player 2 may still defect.  
  - **Safe Modification Available**:  
    - *“Change (B, B) payoff to 25 points”* (unspoken; let students discover).  

  #### **5. Modified Game Phase (15 min)**  
  - **Adoption Rule**: Both players must agree to the modification.  
  - **Logistics**:  
    - Pairs discuss proposals (5 min). If both agree, they play 3 rounds under the new rule. If not, they replay the base game.  
    - Record outcomes.  
  - **Predictable Failures**:  
    - Pairs adopting unsafe modifications (e.g., “Both must choose A”) often revert to **(B, B)** or miscoordination.  
    - A few pairs may stumble on the safe change (payoff tweak).  

  #### **6. Debrief & Concept Reveal (25 min)**  
  - **Key Questions**:  
    - “Which modifications worked? Which failed? Why?”  
    - “Did your change guarantee improvement no matter what your partner did?”  
  - **Map to Safe Pareto Improvement**:  
    | **Concept** | **Activity Moment** |  
    |---|---|  
    | **Modification** | Rule changes proposed (e.g., payoff tweak). |  
    | **Reference Outcome** | Original game’s equilibria **(A, A)** or **(B, B)**. |  
    | **Quantifier Over Equilibria** | “Did your fix work even if you ended up at the ‘bad’ version of the new game?” |  
  - **Reveal the Term**:  
    - “What you experienced is called a **safe Pareto improvement**: a rule change that improves everyone’s payoff *regardless* of which equilibrium is played or how the original game settled.”  
    - **Why the Safe Modification Works**:  
      - Original: Worst outcome = 10 points **(B, B)**.  
      - Modified: **(B, B)** now gives 25 points > 10. **(A, A)** still gives 30. *All equilibria improve the worst case*.  
  - **Candor About Limitations**:  
    - “The activity hides one nuance: Safe improvements often require giving up *potential gains* (e.g., the thrill of **(A, A)** at 30 points feels ‘safer’ than it was). Safety costs ambition.”  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: All pairs coordinate on **(A, A)** in the base game (no frustration).  
     - **Fix**: Force randomness in Round 1. Prime risk aversion: “Many players lose everything by choosing A.”  
  2. **Problem**: Students propose overly complex modifications.  
     - **Fix**: Constrain proposals to 1-sentence rules. Offer examples: “Change a payoff,” “Remove an option.”  
  3. **Problem**: No pair discovers the safe payoff tweak.  
     - **Fix**: In debrief, contrast a failed proposal with the safe change. Ask: “What if we made **(B, B)** less painful?”  

  ---

  ### **What the Activity Cannot Show**  
  **The Quantifier’s Full Weight**:  
  - The activity equates “how the players settled” with *observed outcomes* (e.g., **(B, B)**). In reality, the safe improvement must cover *all possible equilibria*, including those not played in the session.  
  - **Your Voice in Debrief**:  
    > “In theory, the guarantee must hold for *every* equilibrium in the new game—even ones you didn’t encounter today. A change that only improves your *favorite* outcome isn’t safe. That’s why delegation in AI focuses on robustness, not optimism.”  

  ---

  ### **Why This Works**  
  - **Experiences the Core Tension**: Students feel the lure of ambitious fixes (e.g., forcing **A**) but see them fail without mutual trust. The safe tweak (payoff change) feels “small” but reliable.  
  - **Reveals the Cost**: Safe improvements sacrifice the dream of “maximal gains” (30 points) for guaranteed baseline improvements (no one gets <25).  
  - **No Jargon Until Debrief**: The term “safe Pareto improvement” crystallizes the lesson *after* visceral discovery.  

  **Final Tip**: Run the activity twice if possible. First runs often fail—embrace it! The “aha” moment in debrief when students realize *why* their fixes failed is the goal.
