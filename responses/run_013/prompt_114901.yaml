              Round 1: play with partner 1.
              Round 2: play with partner 2.
              Round 3: play with partner 1 again.
              Round 4: play with partner 2 again.
              Round 5: play with partner 3.

          This is logistically complicated.

          Alternatively, we can have them play 5 rounds with the same partner, and hope that in some pairs, they get stuck in (B,B). To induce that, we can prime some students to play B in the first round.

          We can secretly give half the students a note that says: "In the first round, you are to play B. After that, you are free to choose." This might be heavy-handed.

          Another idea: use a random device. In the first round, we flip a coin for each player to determine their action. Then they see the outcome. In subsequent rounds, they choose freely. This might start some pairs at (B,B) and then they continue.

          Let's do: 
            - In round 1, each player is told to use a coin flip to decide A or B.
            - In rounds 2-5, they choose freely.

          This will create a mix of outcomes in round 1, including (B,B) for some pairs.

     Steps for each round:
          - Pairs are formed.
          - In round 1: each player flips a coin (or uses a random number generator on their phone) to choose A or B.
          - They then reveal and record the outcome.
          - In rounds 2-5: they choose freely.

     Then in the reflection phase, they will see that sometimes they coordinated on (B,B) and sometimes on (A,A), and sometimes miscoordinated.

     Finally, the feature that the activity cannot reproduce and that we have to explain in the debrief is the quantifier over all equilibria in the modified game, including mixed strategies, and the possibility that the improvement is only weak in some cases. We also have to explain that in theory, the reference outcome is whatever would have happened (which might be any outcome, not just an equilibrium) and the new game's outcome is an equilibrium. In the activity, we only played a few rounds and saw a few outcomes, but the safety is a guarantee for all possible outcomes.

     We will be candid in the debrief.

