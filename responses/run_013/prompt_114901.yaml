     Let me design a base game with two equilibria: one good (3,3) and one bad (1,1), and then a safe modification that gives (3.5,3.5) in a new equilibrium. But then we have to create a new game that has an equilibrium at (3.5,3.5) and no equilibrium below 3.5.

     Given the complexity, I think we have to relax the requirement of strict improvement over the best equilibrium. The literature might not require that? The problem says: "everyone is better off", meaning than what they would have gotten in the original outcome. If the original outcome was the good equilibrium (3,3), then the new outcome must be better than 3. That forces us to have a new equilibrium payoff >3.

     So let's set the base game as:

          A    B
      A  3,3  0,0
      B  0,0  2,2   [Note: the bad equilibrium is (B,B) with (2,2), which is not terrible, but we want to improve]

     Then the safe modification is to change the game to:

          A    B
      A  4,4  0,0
      B  0,0  4,4

     Now, the new game has two pure equilibria: (A,A) and (B,B) with (4,4). And a mixed equilibrium with 2. But 4>3 and 4>2, so even the mixed equilibrium's expected payoff (2) is not worse than the original bad equilibrium (2) but the pure are better. However, the mixed is not better than the original good equilibrium (3) because 2<3.

     So the mixed equilibrium is a problem.

     Given the time constraints of the activity, we will assume that the students will play pure strategies. We will instruct them to choose only between the pure actions.

     Therefore, we design the activity with the base game:

          A    B
      A  3,3  0,0
      B  0,0  2,2

     and the safe modification is to change the payoffs to:

          A    B
      A  3,3  0,0
      B  0,0  3,3   [changed the 2 to 3]

     Then in the new game, if they play (B,B) they get 3, which is better than 2 in the original (B,B). And if they would have played (A,A) in the original (3), they might play (A,A) in the new (3) or (B,B) in the new (3) — either way, they get at least 3. So compared to the original outcome:
          - If the original outcome was (A,A): 3 -> new outcome: 3 (which is not better, but not worse)
          - If the original outcome was (B,B): 2 -> new outcome: 3 (better)
          - If the original outcome was miscoordination: 0 -> new outcome: 3 (better)

     This is a weak improvement (Pareto improvement) but not strict in the case of (A,A). The problem says "better off", but in economics, "better off" can include weak improvement (at least as good). And the term "Pare improvement" often allows weak improvement.

     In the safe Pareto improvement literature, weak improvement is acceptable? The problem says "better off", but also says "improves matters". We can interpret it as weak improvement.

     So we will proceed.

     Summary of the activity:

     Base game for a pair:
          Actions: A or B.
          Payoffs:
              (A,A) -> (3,3)
              (A,B) -> (0,0)
              (B,A) -> (0,0)
              (B,B) -> (2,2)

     Safe modification: if both players agree, then change the payoff of (B,B) to (3,3).

     Unsafe modifications that students might propose:
          1. Remove action A: then the only choice is B, so they get (2,2) for sure. This is not safe because if the original outcome was (A,A) (3), then 2 is worse.
          2. Agreement to both play A: but then if one player defects, they get 0. This is not a rule change.
          3. Change the payoff of (A,A) to (4,4): then the new game has (A,A) at (4,4) and (B,B) at (2,2). This is not safe because if in the new game they play (B,B), they get 2, which is worse than if the original outcome was (A,A) (3) [because 2<3] and the same as the original (B,B) (2). Also, if they would have played (A,A) in the original, then in the new game at (B,B) they get 2 which is worse than 3.

     The safe modification we have in mind is to change (B,B) to (3,3).

     Timeline as above.

     Materials: 
          - Score sheets for each player to record their choices and payoffs.
          - A matrix of the base game shown to everyone.
          - For the modified game, the matrix is updated.

     How to handle the mixed equilibrium issue? We will ignore it and assume pure strategies.

     What the activity cannot show: 
          - The possibility of mixed strategies and the mixed equilibrium in the modified game that might yield less than 3.
          - The fact that in the safe modification, when the original outcome was (A,A), the new outcome is not strictly better (only equally good). We will have to explain that in the debrief and discuss weak vs strict improvement.

     Also, the activity might not show the quantifier over all possible equilibria in the modified game because we only have two pure ones and we are ignoring mixed. So we will have to explain that in the debrief.

     Predictable problems:
          1. Students might not end up at (B,B) in the base game. To encourage that, we can:
               - Have them play with a new partner each time, so they have no history.
               - Or, we can tell them that in round 1, they should assume nothing about the other player.
          2. When proposing modifications, students might not think of changing the (B,B) payoff. We can have hints ready? But we want them to discover. Alternatively, if no pair proposes the safe modification, then in the debrief we can introduce it and explain.

     Structure the activity to have multiple rounds with different partners to increase the chance of experiencing (B,B).

     Revised timeline for the game phase:

          - Base game: 5 rounds, each round with a new partner (rotate among 16 students). But with 16 students, we have 8 pairs. We can have them stay in pairs for 5 rounds to build a history. But then they might learn to coordinate on (A,A). So we want them to experience miscoordination and coordination on (B,B). 

