answer: |-
  ## Fellowship Proposal: The Silence That Kills

  **The Question (198 words)**  
  My project asks whether our concept of "causing harm by omission" – failing to act when action would prevent harm – can meaningfully apply to tragedies arising from persistent systemic arrangements, rather than a specific person’s inaction at a specific moment. In the cases I investigate – predictable deaths from heat, regulatory gaps, or flawed administrative rules – harm unfolds not because someone *didn’t* do their defined job on Tuesday, but because the system itself, built and maintained over time by many individuals each performing their roles, inherently lacked the capacity or mandate to prevent it. The core question is: **Is the idea of causal omission fundamentally tied to individual agents and discrete moments of potential intervention?** If the answer is yes, then these systemic harms, however foreseeable and preventable, exist in a kind of causal void – no one "omitted" anything in the relevant sense, leaving us only with the stark facts of harm and a structure that permitted it. This conceptual gap, if real, is profound. The alternative is that we *can* meaningfully say the system itself "omitted" to protect, demanding a radical rethinking of what constitutes an "omission."

  **Why the Existing Positions Leave It Open (297 words)**  
  Standard debates about omissions and causation hit a wall when confronting these systemic cases. One prominent view holds that omissions can't *be* causes because they aren't events; they're absences. Only positive actions cause things. This view struggles to even *see* the omission in my cases – there's no singular "absence" to point to, just an ongoing state of affairs. Another view allows omissions as causes by focusing on counterfactuals: if someone *had* acted, the harm wouldn't have occurred. But in my systemic cases, asking "If *who* had done *what*?" often lacks a clear answer. The counterfactual requires specifying a plausible agent and action that *should* have happened within the existing structure – which often doesn't exist. A third perspective argues omissions are causes relative to a normative baseline (what *should* have been done). However, identifying that baseline in systemic failures is fiendishly complex. Was the baseline a different staffing formula? A different inspection mandate? Who bears the duty? Critically, *all* these approaches presuppose a context where a specific agent, facing a specific situation at a specific time, could have performed a specific action to avert harm. My cases dissolve these specifics. The harm emerges from the arrangement itself, maintained by countless individuals acting within their defined roles over time, none of whom faced a clear "moment of omission." Existing frameworks either explicitly require an individual agent or implicitly rely on one through counterfactual or normative reasoning. They remain silent on whether the *arrangement itself* can be the source of omission.

  **The Angle (398 words)**  
  My route in is forensic and grounded in real-world failure, moving beyond abstract philosophy. I will take three meticulously documented cases from my reporting – say, the predictable heat deaths in a city with inadequate cooling center planning; the regulatory collapse allowing a preventable industrial accident due to chronic understaffing built into the agency's budget; and the welfare rule change, known to be flawed during design but implemented unchanged, leading to cascading hardship. I will strip these down to anonymized, skeletal narratives ("Case A: The Cooling Gap," "Case B: The Inspection Void," "Case C: The Rule Failure"). Crucially, I’ll remove names, individual intentions, and specific decision points, focusing solely on the *structure*: the rules, resources, timelines, and foreseeable consequences.

  Against these thin descriptions, I will rigorously test candidate criteria often used to attribute causal omission: **1. Foreseeability:** Was the harm foreseeable given the arrangement? (Always yes). **2. Preventability:** Was a feasible, significantly less harmful arrangement possible? (Always yes). **3. Counterfactual Dependence:** Does the harm counterfactually depend on the arrangement? (Yes: change the structure, harm likely avoided). **4. Agency Requirement:** Is there a *specific* agent who *could* and *should* have changed the arrangement at a *specific* time? (The core stumbling block).

  My argument, developed through analyzing these cases against these criteria, will claim: **Precisely because these harms are foreseeable, preventable, and counterfactually dependent on the arrangement, yet persistently lack a responsible individual agent-moment, they expose a fundamental limitation in our causal vocabulary of omission.** The concept *is* essentially agent-shaped and moment-shaped. The systemic arrangement doesn't "omit"; it simply *is*, and its being causes harm. This isn't just semantics; it reveals why our mechanisms of accountability and prevention falter. We keep looking for the person who didn't act on Tuesday, blinding us to the toxic inertia of the structure itself.

  This beats armchair analysis by rooting the conceptual puzzle in concrete, investigated realities, showing *why* the theories falter. It beats simply reporting more cases by using the cases as probes to dissect the causal concept itself, moving from "here's another tragedy" to "here's *why* this tragedy resists our usual explanations of blame."

  **Plan and Schedule (298 words)**  
  *   **Quarter 1 (Reading & Framework):** Deep dive into philosophy of action/causation (omissions, collective action, institutional agency) and adjacent social science (normal accident theory, organizational sociology, bureaucratic failure). Focus: extracting core arguments and criteria *without* getting bogged in technicalities. Simultaneously, finalize selection of 3-5 core cases from my archive, anonymizing and drafting thin descriptions.
  *   **Quarter 2 (Case Analysis & Argument Building):** Systematically apply the identified criteria (foreseeability, preventability, counterfactual dependence, agency requirement) to each anonymized case. Identify patterns, tensions, and where the criteria break down. Begin drafting the core argument sections, focusing on the gap revealed by the lack of specific agency. Initial outreach to potential expert readers (philosopher, systems theorist, investigative journalist).
  *   **Quarter 3 (Drafting & Initial Feedback):** Complete full first draft, weaving case narratives with conceptual analysis. Submit draft to 2-3 identified readers. Conduct targeted follow-up interviews or reading based on emerging questions from the draft analysis.
  *   **Quarter 4 (Revision & Polish):** Synthesize feedback, focusing on clarity of argument, strength of case analysis, and narrative flow. Substantial revision. Rigorous line edit for accessibility and impact. Final polish ensuring the "so what?" – the implications for accountability and prevention – resonates powerfully.

  **What Success and Failure Look Like (248 words)**  
  **Success** is a compelling 10,000-word essay that achieves three things: 1) Makes the systemic harm cases viscerally real and their pattern undeniable; 2) Clearly demonstrates *why* applying "omission" to them feels intuitive yet conceptually strains against the agent/moment requirement, using the case analysis convincingly; 3) Articulates the profound significance of this gap: if our causal language fails here, it signals a dangerous blind spot in how we understand and address preventable societal harm. It becomes a piece that shifts how readers perceive institutional failure.

  **Failure** would be a muddle: either getting lost in philosophical thickets, failing to clearly isolate the systemic omission puzzle from individual blame, or simply presenting more tragic cases without advancing the core argument about causal vocabulary. If the cases ultimately don't cooperate – if, upon rigorous analysis, specific agent-moments *do* emerge in each, or the harms prove less foreseeable/preventable than assumed – the project fails.

  **If cases resist the analysis**, I will pivot sharply. The essay's core would become a diagnosis of *why* these cases *appear* to be agentless omissions but, upon scrutiny, reveal hidden agents, diffuse responsibility pathways, or different kinds of causes. The focus shifts to the *illusion* of the gap and its consequences.

  **Scope and Risks (195 words)**  
  This scope is achievable: 10,000 words allows deep exploration of 3-5 core cases interwoven with conceptual analysis. The research is focused (existing philosophy/sociology, my case archives), and the method (applying criteria to cases) is executable without technical work.

  **The biggest risk is scope creep:**  
  1.  **Philosophical Quicksand:** Getting bogged in unresolvable metaphysical debates. **Mitigation:** Strict focus on criteria relevant to my cases; consult expert readers early to stay grounded.
  2.  **Case Complexity:** Cases sprawling, introducing confounding factors (individual negligence mixed in). **Mitigation:** Ruthlessly enforce the "thin description" approach; select cases initially screened for structural focus.
  3.  **"So What?" Dilution:** Losing the stakes in abstract discussion. **Mitigation:** Constantly tie analysis back to real-world consequences; dedicate significant word count to implications in the final sections.

  **If cuts are needed,** I prioritize depth on the strongest 2-3 cases demonstrating the agent/moment gap most clearly and reduce the breadth of philosophical context, focusing only on the essential criteria being tested. The core argument about the limitation of "omission" must remain sharp.
