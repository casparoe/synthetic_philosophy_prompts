answer: |-
  ### Ambiguity Aversion Classroom Game: "The Mystery Urn Challenge"  
  **Objective:** Illustrate ambiguity aversion (risk vs. uncertainty) through revealed preferences, without using formal terms until debrief. Students confront an inconsistency in their choices when betting on known vs. unknown probabilities.  

  ---

  ### **Materials & Setup**  
  - **Two urns:**  
    - **Urn A (Known):** 10 marbles (5 red, 5 blue). Label: *"Urn A: 5 red, 5 blue."*  
    - **Urn B (Unknown):** 10 marbles (fixed but undisclosed composition, e.g., 7 red, 3 blue). Label: *"Urn B: Red and blue marbles, unknown ratio."*  
    - *Use jars/boxes; marbles can be replaced with colored balls, candies, or even digital simulations (e.g., random.org) if physical props are impractical.*  
  - **Sealed envelope:** Contains Urn B’s true composition (revealed later).  
  - **Payoffs:** Points redeemable for candy (e.g., 1 piece per 15 points) or bonus participation credit. Ensure everyone gets at least 5 points to maintain engagement.  
  - **Student sheets:** Paper with two questions:  
    > 1. **RED BET:** Which urn do you choose? (A or B)  
    > 2. **BLUE BET:** Which urn do you choose? (A or B)  

  ---

  ### **Rules & Payoff Scheme**  
  - **One 75-minute session** (adjustable timing below).  
  - **Each student makes two independent choices:**  
    1. **Red Bet:** Win 10 points if a red marble is drawn from their chosen urn.  
    2. **Blue Bet:** Win 10 points if a blue marble is drawn from their chosen urn.  
  - **Procedure:**  
    - One marble is drawn from **Urn A** and one from **Urn B** (simultaneously).  
    - Outcomes apply to **all students** based on their choices:  
      - If you chose Urn A for Red Bet: Win 10 points if Urn A’s draw is red.  
      - If you chose Urn B for Red Bet: Win 10 points if Urn B’s draw is red.  
      - (Similarly for Blue Bet with blue outcomes.)  
    - **Example:** A student who picks Urn A for both bets:  
      - Wins 10 points if Urn A’s draw is red (Red Bet) OR 10 points if it’s blue (Blue Bet).  
      - *Guaranteed 10 points total* (since Urn A’s draw must be red or blue).  

  ---

  ### **Minute-by-Minute Timeline**  
  **0–10 min: Setup & Rules**  
  - Introduce the game: "We’re playing a betting game for points. Your goal: maximize points."  
  - Show Urn A (shake to show marbles). For Urn B, shake but *do not open*: "This urn’s composition is fixed but unknown."  
  - Explain bets: "You’ll choose urns for two separate bets—one on red, one on blue. We’ll draw one marble from each urn, and your points depend on your choices."  
  - Emphasize: "Choices are independent. You might use the same urn for both bets or mix and match."  

  **10–20 min: Student Choices**  
  - Distribute sheets. Students secretly choose urns for each bet.  
  - *Circulate:* Answer clarifying questions only (e.g., "Yes, you can pick A for both").  

  **20–25 min: Draw Marbles & Calculate Points**  
  - Draw one marble from Urn A and one from Urn B; display results.  
  - Students calculate their points:  
    - **Red Bet outcome:** Based on chosen urn’s draw.  
    - **Blue Bet outcome:** Based on chosen urn’s draw.  
  - *Example:* If Urn A draws red and Urn B draws blue:  
    - Student who chose A for Red: 10 points.  
    - Student who chose B for Blue: 10 points.  
  - Award candy/credit for point thresholds.  

  **25–35 min: Second Beat (Reveal Urn B)**  
  - Open the sealed envelope: Reveal Urn B’s composition (e.g., 7 red, 3 blue).  
  - Pose: **"If we repeated this game with the *same* Urn B, would you change your choices? Why?"**  
  - Students discuss in pairs (2 min), then share reactions.  
  - *Goal:* Highlight that aversion stems from "unknown-ness," not actual risk. Urn B had fixed odds—they just didn’t know them.  

  **35–55 min: Structured Debrief**  
  - **Step 1: Reveal Preferences**  
    - Poll: "How many chose Urn A for Red Bet?" (Expect 10–14 hands.)  
    - Poll: "How many chose Urn A for Blue Bet?" (Similar count.)  
    - *Note:* Most prefer Urn A for both, despite identical guaranteed 10-point outcomes if they pick the same urn for both bets.  

  - **Step 2: Map to Formalism (No Jargon Yet)**  
    - Contrast Urn A (known 50/50) and Urn B (unknown odds).  
    - Point out inconsistency:  
      > "If you chose A for red, you implied Urn B has <50% red. But if you chose A for blue, you implied Urn B has <50% blue. Can both be true?"  
    - Students see their own conflicting beliefs.  

  - **Step 3: Formal Distinctions**  
    - **Risk vs. Uncertainty:**  
      - **Risk (Urn A):** Known probabilities ("I know the odds of red are 50%").  
      - **Uncertainty/Ambiguity (Urn B):** Unknown probabilities ("I don’t know the odds").  
      - *Now name it:* "This is *ambiguity aversion*—disliking unknown odds more than known risks."  
    - **Violated Rationality Principle:**  
      - "Expected utility theory assumes you assign subjective probabilities (e.g., 50% to Urn B). If you did, you’d be indifferent between A and B. But you weren’t."  
      - "The *sure-thing principle* says your choice for red shouldn’t depend on blue, but here, it does—because ambiguity makes you distrust Urn B universally."  
    - **Theories to Resolve:**  
      - Mention models like *Maxmin Expected Utility* (Gilboa-Schmeidler) or *Prospect Theory* (Kahneman-Tversky), which add ambiguity-sensitive weights.  
      - **Handoff to Instructor:** The activity *shows* the behavior and inconsistency but doesn’t judge rationality. Argue:  
        - *Pro-ambiguity aversion:* If you suspect hidden manipulation, aversion is rational.  
        - *Anti-ambiguity aversion:* If you have no evidence of bias, assigning 50% is "rational," and aversion is a bias.  

  **55–75 min: Q&A and Reflection**  
  - Discuss: "Would you avoid ambiguity in real life (e.g., stocks vs. bonds)?"  
  - Summarize: Ambiguity aversion explains insurance markets, voting behavior, etc.  

  ---

  ### **What Will Go Wrong & Mitigation**  
  - **Problem:** Students treat bets independently and "mix" urns (e.g., A for red, B for blue), seeking higher payoffs (up to 20 points).  
    - *Mitigation:* Stress that Urn B’s uncertainty should feel "untrustworthy." Poll choices before draws to show peer pressure toward Urn A.  
  - **Problem:** Weak preference for Urn A (e.g., only 60% choose it).  
    - *Mitigation:* Use Urn B’s reveal to ask: "Would you switch to B now that odds are known?" This sharpens the contrast.  
  - **Problem:** Students focus on point totals, not underlying logic.  
    - *Mitigation:* Debrief starts with choices, not points. Ask: "Why did you distrust Urn B?"  

  ### **What the Game Can’t Do**  
  - **Prove irrationality:** The activity exposes inconsistent beliefs but doesn’t resolve if aversion is rational. *This is your handoff.* You must argue:  
    - If ambiguity aversion stems from pessimism (e.g., "Urn B is rigged"), it’s rational.  
    - If it violates probabilistic beliefs (e.g., assigning Urn B 50% but still avoiding it), it challenges standard rationality.  
  - **Generalize:** The game is a lab-like snapshot. Real-world ambiguity (e.g., climate change) involves deeper uncertainty—mention this in closing.  

  ---  
  **Total Words:** 1080  
  Run this as a self-contained experiment, and let students' choices drive the "aha!" moment. The reveal of Urn B’s composition is the linchpin for separating fear of the unknown from actual risk.
