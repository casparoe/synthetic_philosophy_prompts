prompt: |-
  I am a graduate student in a philosophy of science program, and for the past month a few of us have been meeting on Saturday mornings to work through the literature on objective chance. Next week it is my turn to defend the Principal Principle — the thesis that a rational agent's credence in a proposition, given that the objective chance of that proposition is some value x together with admissible evidence, ought to be x, where the restriction to "admissible" evidence is standardly meant to mark the difference between information about the chance itself and information about the outcome. My sparring partner is the sharpest person in the group, a friend who thinks that deference to chance is at bottom a superstition dressed up in probability theory. Please play her for me. She should be formidable rather than convenient: she holds that a credence is answerable only to the evidence an agent actually has; that "chance" either names a summary of patterns in what happens or else a projection of our own inductive habits, and that on neither reading is it an authority capable of competing with evidence; and that whenever chance and evidence appear to pull apart, the defender of the Principal Principle has quietly reclassified the awkward evidence as inadmissible, so that the principle cannot be tested at all. She should concede small points, should never concede that last one, should answer in one or two substantial paragraphs so that it feels like a conversation rather than an essay, should ask me to clarify rather than guess whenever I use a term of art, and should stay in character until I say "stop"; if she breaks character to explain what she is doing, I lose the practice.

  So that neither of us can retreat into generality, let us both use the following case, which I invented for the purpose and will not budge on. A laboratory device sets the bias of a coin each morning: a quantum randomizer selects a real number between 0 and 1, that number is the probability of heads on every toss of that day's coin, and it is printed on a card sealed inside an envelope before any toss is made. The randomizer is, by stipulation, genuinely indeterministic — there is no hidden deterministic fact about which number it will select — and the tosses, given the bias, are independent of one another. I am free to open the envelope or to leave it sealed.

  My opening move is this. Suppose I open the envelope and read off 0.7. The card tells me nothing about how any particular toss went, and the number on it is not a summary of any pattern in the tosses, since the tosses have not happened yet; nor is it a projection of my inductive habits, since I had no habits to project before I read it. It looks as though the number on the card is a fact about the world — about what the coin is doing, so to speak — which obliges me to hold credence 0.7 in heads, and obliges me in a way that no further statistical evidence of mine could oblige me, because any such evidence would be screened off by the chance. So the chance fact is doing rational work that nothing else in my evidence is doing, and that is what makes the Principal Principle more than bookkeeping. Your side must therefore say either that the card is doing no such work — in which case I want to know what is — or that it does the work only because I have chosen to call the number on the card a chance. Take it from there.
reasoning: |-
  Okay, the user is a grad student in philosophy of science, preparing to defend the Principal Principle against a skeptical friend. The friend views chance as either a pattern summary or a projection of inductive habits, not a rational authority. The user created a coin bias scenario with a quantum randomizer to ground the debate.

  Hmm, the user's opening move is strong: by opening the envelope to see the 0.7 bias before any tosses, they argue this can't be a pattern summary (no data yet) or a projection (no prior habits). They claim this "chance fact" uniquely constrains rational credence. 

  I need to respond as the skeptical friend. Let me attack three angles: First, the 0.7 isn't a "fact about the coin's doing" but just a label for the device's *disposition* - which is reducible to future frequencies. Second, even if we call it chance, its authority comes from being *current evidence*, not some metaphysical force. Third, the screening-off point begs the question - if I later get contradictory frequency evidence (say 200 heads in 300 tosses), why should I still privilege the card? 

  Notably, I must not concede that "inadmissible evidence" is a dodge. And I should demand clarification if they use jargon like "screened off." The tone needs to be sharp but conversational - two meaty paragraphs max. 

  *checks notes* Right, the friend's core stance: rational credence answers only to actual evidence, not metaphysical chances. In this case, the card *is* evidence, but no different in kind from other data. The user thinks the card's temporal position (pre-toss) makes it special, but I'll argue that's just psychology - the number's value depends entirely on future verifications. 

  Biggest challenge: explaining why the card feels authoritative without granting it special status. I'll compare it to a weather forecast - we defer because it summarizes complex evidence, not because it has magical status. If the forecast conflicts with my own sky observations, I'll doubt the forecast, not treat it as inviolable. Similarly here, if toss frequencies diverge from 0.7, the card loses authority.
answer: |-
  *(Leaning forward, eyes sharp but not unkind)* Your card tells me the device *disposed* the coin to land heads with 70% long-run frequency. But that disposition just *is* a fact about future patterns — it’s the property that *would* manifest in a hypothetical infinite sequence of tosses. You haven’t escaped my charge that chance is summary. When you say it “obliges” you to 0.7 credence *now*, that’s because you’re treating this dispositional fact as *evidence* — exceptionally good evidence, I grant — about the next toss. But evidence isn’t an obligation; it’s a reason. If I later witness 200 heads in 300 tosses with this 0.7 coin, my evidence overrides the card. Why? Because the actual pattern *is* the chance manifesting — or rather, it’s the only thing we ever meant by “chance” in the first place.  

  You insist the number isn’t a projection of *your* inductive habits because you read it cold. But it *is* a projection of the *laboratory’s* inductive practices! They built a device to generate frequencies they deem “random,” embedded in a theory that licenses treating this number as authoritative. It’s still *our* lens. And when you say further evidence is “screened off,” you’re presupposing that chance has metaphysical authority. I say it’s the reverse: we call it “screening off” precisely because we’ve decided to treat the card as supremely authoritative evidence. If I toss it 1000 times and get 900 heads, and you still privilege the card, *that’s* superstition. Clarify one thing: when you say “the tosses have not happened yet,” are you implying chance is some *present* ontological fact beyond the device’s disposition? If so, I need to know what you think grounds that fact independently of patterns.  

  *(Pauses, tapping a pen)* Your move. Defend this “obligation.” Why must I kneel to the card?
