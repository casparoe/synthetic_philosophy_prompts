prompt: |-
  I chair a small community mediation service that the council funds — mostly neighbour rows and the odd planning dispute, two parties in a room, ninety minutes if I'm lucky, no power to impose anything, and whatever they agree has to be voluntary and signed off by both sides at the end. My friend and I got into a long, slightly wine-fuelled argument about it last week. She says compromise is always a betrayal: if you really hold a value, then splitting the difference with someone who denies it is just cowardice with better manners. I think that's too quick, because a lot of what I actually see aren't cases of meeting in the middle at all — they're cases where both sides can end up better off than they started by trading, one giving up something it barely cares about in exchange for something it cares about enormously, and the other doing the reverse. She came back with, fine, that works for preferences like parking spaces, but values aren't like that, you can't put a price on them, and then we just talked past each other for an hour. I want you to take my side seriously and turn it into something I can actually run in the room.

  So: write me a decision procedure, in order, with the questions I put to the parties, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision back to me or to the parties because it's a judgment call rather than something the procedure can settle. It has to keep hold of the distinction between two sides meeting in the middle and two sides swapping things they rank differently, and it has to handle the case where a party says some thing simply isn't on the table at all — won't trade it for any amount of the other thing — as opposed to the case where they're only ranking it low and could be moved. Flag which steps are real tests and which are me dressing up a hunch as procedure, and be honest about where the whole thing misfires, especially about whether you can get truthful rankings out of people who think admitting a low priority will lose them the case. Also alot of my cases involve one party who is far more articulate and confident than the other, and I'd like the procedure to say something about that rather than pretend it away.

  Then run it on three cases so I can watch it work: (1) a mosque and a residents' association fighting over evening use and parking at a shared community centre, where I suspect a trade is sitting there; (2) an environmental group and a fishing cooperative over a marine no-take zone, where one side treats the reef as non-negotiable; and (3) one I'd rather it didn't answer the way it will — a residents' group and a developer who can both clearly gain by trading on building height against parking, where the trade quietly dumps the noise and the traffic onto a street nobody has invited to the table. I don't want citations, reading lists, or names of philosophers; it needs to make sense to a colleague who's never opened a philosophy book; and please write it in British English.
reasoning: |-
  Okay, the user chairs a small community mediation service dealing with neighbour disputes and planning issues. They've had a debate with a friend about whether compromise is a betrayal of values, and they need a practical decision procedure for mediations that distinguishes between true compromise (splitting the difference) and value trading (exchanging differently ranked items). 

  The user is clearly experienced but frustrated by theoretical debates that don't translate to their real-world work. Their hidden needs jump out: they want to legitimise their practical approach against purist critiques, handle power imbalances between parties, and address ethical concerns about externalised costs (like the developer-resident case). 

  Hmm... the core challenge is designing a procedure that:
  - Separates preferences ("I want parking") from values ("this land is sacred")
  - Handles "off the table" positions authentically
  - Mitigates power dynamics without overstepping the mediator role
  - Flags when trades harm third parties

  Right, let's structure it as a phased process with clear exit points. Phase 1 must identify non-negotiables upfront - if both parties have irreconcilable values on the same issue, mediation likely fails. Phase 2 then focuses on tradable issues using ranking exercises. Crucially, the "sufficient answer" criteria must account for power imbalances - perhaps requiring concrete examples rather than abstract claims. 

  For the three test cases:
  The mosque/residents case should demonstrate successful trading (noise sensitivity vs parking needs). The fishing/environment case will hit a hard stop when the reef is declared non-negotiable. The developer case is trickiest - the procedure should force acknowledgement of externalised costs even if it can't resolve them, perhaps by requiring parties to name affected groups. 

  Biggest pitfall? People lying about rankings to gain leverage. The "concrete examples" step is where hunches come into play - if someone claims they "barely care" about issue X but previously fought bitterly over it, that's a red flag. Also, the "off the table" declaration needs scrutiny - is this a core value or a bargaining tactic? 

  Better include explicit power-balancing steps: written inputs for less articulate parties, mandatory reflection time before responses. And for the developer case, build in a "who else matters?" checkpoint even if it makes agreement harder - ethical mediation shouldn't facilitate harm shifting. 

  Procedure must stay pragmatic though. Philosophical distinctions between values/preferences matter less than whether parties can live with the outcome. Sometimes calling out "this looks like harm dumping" is more useful than elegant theory.
answer: |-
  Here’s a step-by-step decision procedure designed to distinguish value trades from mere "splitting the difference," handle non-negotiables, address power imbalances, and flag ethical risks. It’s structured as questions you pose to parties, with clear exit points. **British English** throughout.

  ---

  ### **Mediation Decision Procedure: Value-Trading Framework**  
  *Assumes parties have already stated positions. Aim: 90 mins max.*  

  #### **Phase 1: Map Non-Negotiables**  
  *(Tests for fundamental value clashes)*  
  1. **Ask both parties:**  
     *"What, if anything, is completely off the table? Something you couldn’t trade for any gain elsewhere? Be specific: e.g., 'evening prayers must happen' or 'no nets on the reef.'"*  
     - **Sufficient answer:** Concrete, specific statements (not vague principles).  
     - **Stop if:** Both claim the *same specific issue* as non-negotiable (e.g., "The reef must be untouched" vs. "We must fish the reef"). **Mediation fails** – true value conflict.  
     - **Judgment call:** If one party’s "non-negotiable" seems tactical (e.g., sudden claim after earlier flexibility), probe: *"If the other side offered X [extreme concession], would that change it?"* If they hesitate, it’s negotiable.  

  #### **Phase 2: Rank Tradeable Issues**  
  *(Identifies low-cost/high-gain swaps)*  
  2. **Ask both parties (privately, then share):**  
     *"List every demand/concern you have in this dispute. Rank them 1–5: 1 = 'I barely care', 5 = 'I care intensely'. Explain *why* for one high and one low rank (e.g., 'Parking is 1 because I work nights; noise is 5 because my child is autistic')."*  
     - **Sufficient answer:** Numerical ranks + brief concrete reason (forces honesty via specificity).  
     - **Stop if:** A party ranks *everything* as 4 or 5 (refuses to trade). **Hand back to mediator:** Explore if this is fear (see Phase 3) or rigidity.  
     - **Power imbalance fix:** For less articulate parties, use written cards. Ask: *"What’s one small thing you’d give up if you got [their top priority]?"* Forces ranking.  

  #### **Phase 3: Test for Trade Zones**  
  *(Finds mutually beneficial swaps)*  
  3. **Ask both parties:**  
     *"Look at the other side’s rankings. Pick one item they ranked LOW (1-2) that you rank HIGH (4-5). Would you offer them something *you* rank LOW in exchange for movement on that?"*  
     - **Sufficient answer:** *"Yes, I’d trade [my low item] for [their high item]"* + concrete offer (e.g., "I’d accept shorter events if you give us the south car park").  
     - **Stop if:** Either party says *"No trade"* to all options. **Hand back to mediator:** Assess if deadlock is due to distrust, bad faith, or unspoken interests.  
     - **Judgment call:** If parties only offer "middle splits" (e.g., "Split parking 50/50"), intervene: *"What if you got *all* of X but gave up *all* of Y, where X matters more to you than Y?"*  

  #### **Phase 4: Pressure-Test Agreements**  
  *(Flags harm-dumping or hidden costs)*  
  4. **Ask both parties:**  
     *"If we agree to this trade, who *else* might be affected? Could this solve your problem but worsen things for people not in this room?"*  
     - **Sufficient answer:** Names affected groups/risks (e.g., "The next street gets more traffic").  
     - **Stop if:** Harm is shifted to uninvolved third parties (e.g., noise dumped on another street). **Mediator must pause:** *"Can we adjust this to avoid harming X?"* or refer to council.  
     - **Hunch dressing:** If parties dismiss concerns, state your observation: *"I’m noting [risk] isn’t addressed. Should we document it?"*  

  ---

  ### **Where This Misfires & Mitigations**  
  - **Truthful rankings?** People *will* lie if they fear admitting low priority = weakness. **Fix:** Frame as *"This helps me understand what matters most"* (not "What will you surrender?"). Use Phase 1 non-negotiables to create psychological safety ("You’ve protected your core, now let’s deal with the rest").  
  - **Power imbalances:** Articulate parties dominate ranking. **Fix:** Private written stages first; enforce "no interruptions"; reframe inarticulate points yourself neutrally (*"So your worry is mainly about X?"*).  
  - **"Values" vs. "preferences"?** Doesn’t resolve the philosophical debate – but forces parties to *operationalise* values as concrete stakes (e.g., "sacred land" = "no diggers after 6pm").  

  ---

  ### **Test Runs: 3 Cases**  

  #### **Case 1: Mosque vs. Residents’ Association (Community Centre)**  
  - **Phase 1:**  
    Mosque: *"Evening prayers (8–9pm) non-negotiable."*  
    Residents: *"Noise after 10pm non-negotiable."* → **No clash** (different issues!).  
  - **Phase 2:**  
    Mosque ranks: *Prayer time (5), Parking (3), Kitchen access (1)*  
    Residents rank: *Quiet after 10pm (5), Parking (4), Building repairs (2)*  
  - **Phase 3:**  
    Trade: Mosque offers *"End events by 9:30pm (their low: noise)"* for residents’ *"Priority parking for Friday prayers (their high: access)"*. Residents offer *"Reserved 10 spaces"* for *"No kitchen renos after 7pm"*.  
  - **Phase 4:** Both agree no third-party harm. **→ Deal: Time for parking.**  

  #### **Case 2: Environmentalists vs. Fishers (No-Take Zone)**  
  - **Phase 1:**  
    Environmentalists: *"No fishing on reef X – non-negotiable."*  
    Fishers: *"Access to reef X non-negotiable."* → **STOP. Fundamental value clash.** Mediation fails unless new info (e.g., fishers reveal they *could* accept reef Y).  

  #### **Case 3: Residents vs. Developer (Height vs. Parking)**  
  - **Phase 1:**  
    Residents: *"Building height ≤ 5 storeys non-negotiable."*  
    Developer: *"No underground parking (cost) non-negotiable."* → **No clash.**  
  - **Phase 2:**  
    Residents rank: *Height (5), Traffic (4), Parking (5), "Heritage views" (3)*  
    Developer ranks: *Profit margin (5), Height (5), Parking (1), "Consultation speed" (2)*  
  - **Phase 3:** Trade: Developer offers *"Extra £100k for traffic calming"* (their low: cash) for residents’ *"7 storeys + 20 fewer parking spaces"* (their high: height, low: parking).  
  - **Phase 4:** You note: *"This dumps 50 cars onto Church Street, who weren’t consulted."* Residents say *"Not our problem."* Developer shrugs. **→ MEDIATOR PAUSE.** Refuse to endorse unless parties adjust (e.g., developer funds Church St. mitigation) or council referred.  

  ---

  ### **Key Takeaways for Your Colleague**  
  1. **Non-negotiables first:** Avoids wasting time on doomed cases.  
  2. **Ranking reveals trades:** "What’s cheap for me, precious for you" beats meeting halfway.  
  3. **Force specificity:** "Values" become actionable only when tied to concrete stakes.  
  4. **Harm-dumping check:** Crucial for ethical credibility – mediator’s judgment call required.  
  5. **Power fixes:** Written inputs, private rankings, and reframing shield weaker parties.  

  This turns your intuition into a replicable audit trail – while leaving space for your experience to handle the "unkindnesses and stupidities" (as Eliot put it) no procedure can predict.
