prompt: |-
  I'm in a cognitive science master's and I keep bumping into the language of thought hypothesis — it came up in a seminar on mental representation and I've read a bit of Fodor but not much, so I'm still shaky on what the actual commitments are. Anyway, in my cognitive science survey lecture the professor gave us a summary of it that I wrote down more or less word for word, and the more I look at it the more I feel like some of it can't be right, but I don't trust my instincts yet. Here's what he said:

  'The language of thought hypothesis is the view that we think in a language — that thinking is basically inner speech, carried on in whatever natural language you happen to speak. Fodor's central argument is that thought has to be compositional, because we can entertain infinitely many thoughts out of finite means, and compositionality requires a language with a syntax and a vocabulary, so there have to be sentences somewhere in the brain. The hypothesis predicts that creatures without a language, like animals and pre-verbal infants, can't really think at all, and it's also why Fodor holds that all of our concepts are innate. The connectionists killed the whole thing off back in the eighties by building networks that learn without any language-like symbols, so these days it's mostly a historical curiosity.'

  Can you audit this for me? I want to know which bits a defender of the hypothesis would happily sign off on, which are the kind of shorthand a lecturer uses that a specialist would wince at, and which are just wrong or would be flatly denied by Fodor himself — and separately, whether the two predictions he draws at the end (about animals and about innateness) actually follow from the core hypothesis or are riding in from somewhere else. I care most about the conceptual distinctions here, not about who said what when.

  Give it to me as exactly five numbered points, each a sentence or two, no intro and no wrap-up.
