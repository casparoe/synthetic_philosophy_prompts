prompt: |-
  I am a junior and I run my school's philosophy club. Next Thursday I have forty-five minutes and a whiteboard to introduce the frame problem to about a dozen members who have read no philosophy and no computer science; last week one of them insisted the whole issue is obsolete, since a model trained on the internet has never needed anyone to write down which facts stay true when something changes. I do not want the explanation itself; I want a plan for giving it. What has to be established first, and what depends on what, so that the problem arrives as a discovery rather than as a puzzle someone invented? Which single example should carry the whole session, and what must it have and lack to do that work? Which misconceptions will they form — I expect at least that it is only about computers being slow, that it is the same thing as the halting problem, and that it concerns robots rather than thinking generally — and at exactly which point in the sequence should I head each one off? Does comparing it with the halting problem help or mislead? How should I treat my friend's objection without settling it for them, and what should I openly decline to explain at this level? Finally, give me one question to ask at the end that would show whether the idea landed.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're a junior running a philosophy club, preparing a 45-minute session on the frame problem for beginners. The members have no background in philosophy or computer science, and one already dismissed the issue as obsolete because AI models trained on the internet seem to handle changing facts without explicit rules. The user wants a teaching plan, not the explanation itself.

  First, I need to establish why the frame problem is still relevant despite modern AI. The friend's objection about models trained on the internet not needing explicit rules is a common misconception. I should address that without shutting down discussion. Maybe acknowledge that while ML models handle some aspects differently, they still face the underlying challenge of relevance.

  Next, the structure. Start with something relatable. Using a robot example makes sense because it's concrete. But I must clarify that the problem isn't just about robots but reasoning in general. The example needs to be simple, like a robot moving a box. Focus on what changes and what stays the same. The key is to show that determining what remains unchanged is non-trivial.

  I should identify misconceptions early. They might think it's about computational speed or confuse it with the halting problem. When introducing the problem, emphasize that it's about relevance, not speed. Comparing to the halting problem might not help; it's a different issue. Avoid that comparison unless necessary.

  The sequence should build from a simple scenario to the core problem. Start with the robot's task, list all possible facts, then show how impractical it is to list everything that doesn't change. Highlight that humans use common sense, which is hard to formalize.

  For the friend's objection, pose it as an open question. Ask how models "know" what's relevant, linking it to the frame problem's core issue. Admit that it's an ongoing debate, encouraging them to think critically without providing a definitive answer.

  What to omit? Technical solutions like situation calculus or non-monotonic logic. Also, avoid deep dives into AI implementation. Focus on the philosophical challenge.

  Finally, a closing question to check understanding. Something like, "Why is 'ignore everything irrelevant' both the solution and the problem?" This tests if they grasp the relevance dilemma.

  I need to ensure the example is consistent. The robot moving a box: the box's location changes, but what about the color of the walls? The robot's battery? Air molecules? Show that while some are obvious to humans, a system needs a way to infer this without endless rules.

  Timing is crucial. Spend the first 10 minutes on the robot scenario, then 15 on the explosion of facts, 10 on misconceptions and objections, and leave time for discussion. Use the whiteboard to list effects and non-effects, visually demonstrating the complexity.

  Potential pitfalls: Getting bogged down in technical terms or letting the discussion derail. Keep steering back to the core issue. Use Socratic questioning to guide them. For example, ask, "What would the robot need to consider to avoid mistakes?" leading them to see the relevance problem.

  Also, emphasize that the frame problem isn't solved. Modern AI uses data to predict, but it's not clear if that's true understanding or just pattern matching. The philosophical question remains about how to formalize relevance and common sense.

  By the end, they should see the frame problem as a fundamental challenge in representing knowledge and reasoning about change, relevant to both humans and machines. The key takeaway is that knowing what to ignore is as important as knowing what to consider, and that's not a trivial task for any intelligent system.
answer: |-
  Here’s a battle-tested plan for your session, designed to make the frame problem feel inevitable and urgent—not abstract or invented. Focus on **minimal jargon**, **one concrete example**, and **preemptive myth-busting**. Total time: 45 mins.

  ---

  ### **The Core Sequence (30 mins)**  
  **Goal:** Make them *feel* the problem before naming it.

  1.  **Start with a relatable human task (5 mins):**  
      *"Imagine I ask you to move this whiteboard marker from the table to my hand. Easy, right? Now: What changes? What stays the same?"*  
      **Whiteboard:**  
      - **Changes:** Marker location (table → hand).  
      - **Stays the same:** Marker color, table weight, room temperature, gravity...  
      *Key point:* Humans effortlessly ignore irrelevant things (e.g., "the moon’s position didn’t change!").  

  2.  **Transfer to a robot (10 mins):**  
      Introduce **ROBBIE THE ROBOT** (your central example). His task: *Move a box from Room A to Room B.*  
      *"Robbie has sensors, motors, and a perfect list of true facts about the world. After he moves the box, what must he update?"*  
      - **Changes:** Box location (A → B).  
      - **What *doesn’t* change?**  
        - The walls are still blue?  
        - The air molecules in Room C?  
        - Your student debt?  
        - The box’s color?  
      **Whiteboard:** Two columns: **Must Update** vs. **Can Ignore?**  
      *Crucial:* Force them to justify *why* something can be ignored. ("What if the box’s color *did* change? Is that possible?")  

  3.  **The Trap: The "Naive Programmer" Approach (10 mins):**  
      *"Let’s help Robbie! We’ll write rules: 'When you move an object, update its location. Everything else stays the same.'"*  
      Then, add complexity:  
      - **Scenario 1:** *A vase is on the box. Robbie moves the box. What happens to the vase?*  
        (Rule failed! Must add: "If something is ON the object, update its location too.")  
      - **Scenario 2:** *The box is red. Robbie paints it blue. Does ‘red’ stay true?*  
        (Need a rule for color changes!)  
      - **Scenario 3:** *Room B is on fire. Robbie moves the box there. Does it burn?*  
        (Now we need physics rules? Context rules?)  
      **Whiteboard:** Show the rule list exploding. *"How many rules do we write? When do we stop? How does Robbie know which rules apply NOW?"*  

  4.  **Name the Problem (5 mins):**  
      *"This is the **frame problem**: How can any system (robot, human, AI) efficiently figure out what *doesn’t* change when an action happens? How do you ignore the *irrelevant* without checking every fact in the universe? It’s not about being slow—it’s about knowing what to *bother* thinking about."*  

  ---

  ### **Head Off Misconceptions *Early* (8 mins)**  
  **When:** Address these **as they arise naturally** in Steps 2-3. Don’t wait!  

  1.  **"It’s just about computers being slow."**  
      *When:* As rules explode in Step 3.  
      *Response:* "Even with infinite speed, Robbie wouldn’t know *which* facts to check! Speed doesn’t solve relevance."  

  2.  **"It’s the same as the Halting Problem."**  
      *When:* If someone name-drops it.  
      *Response (brief):* "Halting asks *‘Will this program stop?’* Frame asks *‘What should I even think about?’* They’re different limits." **Do NOT elaborate further.**  

  3.  **"It’s only a robotics issue."**  
      *When:* When introducing Robbie.  
      *Response:* "Robots make it visual, but this hits *any* system reasoning about change—medical AIs, legal AIs, even *us* planning our day!"  

  ---

  ### **Treating Your Friend’s Objection (5 mins)**  
  **When:** After naming the problem (Step 4).  

  *"Last week, [Name] said modern AI solves this by learning from data—it doesn’t need rules! Let’s test that:*  
  - *How does an AI trained on the internet ‘know’ that moving a marker doesn’t affect the price of tea in China?*  
  - *Did it learn a rule? Or just a statistical pattern?*  
  - *What if the scenario is totally new (e.g., moving a box in zero-gravity)? Does it still ‘just know’?*  

  *This is hotly debated! Some argue data-trained AIs *implicitly* solve it. Others say they just hide the problem behind patterns—they still can’t explain *why* something is irrelevant. We won’t settle this today, but ask yourself: Is avoiding the problem the same as solving it?"*  

  ---

  ### **What to *Omit* or Delay**  
  - **Technical solutions:** Situation calculus, non-monotonic logic.  
  - **Deep AI architecture:** Neural nets vs. symbolic AI.  
  - **Philosophical depth:** Epistemology of relevance (save for later sessions).  
  - **History:** McCarthy & Hayes (name-drop only if asked).  

  ---

  ### **Closing Question to Test Understanding (2 mins)**  
  **Ask:** *"Why is 'ignore everything irrelevant' both the solution to the frame problem... and the frame problem itself?"*  

  **What you want:** They should grasp that **knowing what to ignore** is the core challenge—not the action or the change. If they say, *"Because ‘irrelevant’ isn’t defined!"* or *"You need a rule to ignore rules!"*, the idea landed.  

  ---

  ### **Why This Works**  
  - **Robbie’s example** is visual, scalable (add complexity easily), and avoids math/CS.  
  - **Preemptive myth-busting** stops distractions derailing the narrative.  
  - **Your friend’s objection** becomes a feature, not a bug—it shows the problem’s persistence.  
  - The problem **emerges from their own reasoning** ("Wait, how *do* we know that?"), making it feel discovered, not lectured.  

  **Pro tip:** Draw Robbie badly on the whiteboard. Give him a shaky smile. Humans bond with struggling robots. Good luck!
