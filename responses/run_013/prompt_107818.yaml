answer: |-
  ### What's actually going on  
  You're caught between two powerful ethical frameworks: **impartial procedural fairness** (demanded by your role as coach) and **familial partiality** (your instinct as a parent). The league’s condition created a promise of merit-based selection, rooted in deontological ethics (duty-bound rules: fairness as non-negotiable). Yet parental love operates within care ethics or virtue ethics, where loyalty and nurturing specific relationships are core virtues. Your conflict arises because these values collide: the role requires suppressing personal bias, but fatherhood inherently prioritizes your child’s well-being. The discomfort you feel ("the whole picture feels off") stems from this irreconcilable tension – the system asks you to bifurcate your identity (coach vs. dad) in a way real life rarely allows. The demand to "weigh" them neutrally ignores that your son’s emotional stake *matters* to you in a way the other boy’s doesn’t, making pure impartiality feel artificial.  

  ### The strongest version of my mate's point  
  Your mate invokes **Kantian deontology**: a moral act must follow universalizable rules, applied impartially. By accepting the coaching role under the merit condition, you entered a social contract. Any deviation for personal gain (e.g., your son’s happiness) corrupts the system’s integrity. If "because he’s mine" is the true reason, it fails as moral justification because it cannot be universalized – if *every* coach prioritized their child, meritocracy collapses, trust erodes, and the league’s purpose is undermined. Hiding the real reason compounds the failure with dishonesty. Your mate’s claim is that fairness isn’t just about outcomes but *process*: if you can’t defend your choice using shared, objective criteria (goals, touch, effort), then you violated the duty of your role. Owning the bias is essential for accountability and restoring trust.  

  ### Where it runs out  
  Kantianism assumes roles can be perfectly separated from personal relationships, but this ignores how human commitments *constitute* ethics. **Virtue ethics** (Aristotle, MacIntyre) argues that partiality isn’t always corruption; it’s foundational to roles like parenthood. Sacrificing your son for marginal competitive gain might damage your relationship and undermine the communal bonds youth sports should nurture. More critically, the league’s "impartiality promise" was extracted under duress (no other volunteers), making it ethically fragile. The real issue isn’t choosing your son *once* but whether this reflects a *pattern* or undermines team cohesion. The philosophy of **care ethics** (Held, Noddings) would question if demanding absolute impartiality from a parent-coach is realistic or just – it risks treating children as interchangeable metrics. Your failure was accepting the role knowing this conflict was inevitable. The tradition your mate cites doesn’t address *context*: a small-town volunteer role blending family/community isn’t a professional league.  

  ### What I’d do  
  1. **Privately acknowledge the truth to the boy’s mum:**  
     *"You were right to ask. While I stand by [son]’s effort and aerial strength, the full truth is, as his dad, I wanted him to experience the final. That wasn’t fair to your son, and I’m sorry. I let my dual roles conflict."*  
     This admits bias without discrediting your son’s effort.  
  2. **Reinforce merit publicly:** Reiterate commitment to merit-based picks *moving forward*, perhaps involving an assistant in decisions involving your son.  
  3. **Step back if conflicted:** If selections involving your son cause ongoing tension, delegate final decisions to another coach or leave the role after the season. Accepting the job required suppressing paternal bias; if you can’t, resign honorably.  
  **Why:** Honesty repairs trust better than defensiveness. Owning the partiality respects the mum’s intelligence, while affirming future fairness protects team morale. Resigning if necessary upholds the league’s standard you agreed to.
