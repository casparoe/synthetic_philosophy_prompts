  - Solution 5 (type theory) is A-tier. Functional application is a primitive, so regress halts. Computational, useful for knowledge graphs.
  - Solution 1 (special relation) is B-tier. It tries to make the relation special, but still might need a meta-relation. Moves the problem.
  - Solution 6 (sentences-in-use) is B-tier. Focuses on use, but structure remains. Regress in interpretation.
  - Solution 4 (assertion act) is F-tier. Doesn't address content unity; regress unresolved for stored data.
  - Solution 3 (possible worlds) is F-tier. Loses structure, not useful for detailed knowledge graphs.

  For the knowledge graph, solution 5 (type theory) is practical. Functional application models relations naturally without infinite relations. Combines well with ontologies. Solution 2 is metaphysically sound but abstract for engineering.

