prompt: |-
  I spent thirty-five years as a seismologist, much of it trying to estimate recurrence intervals for faults whose histories I could only ever observe in fragments, and since retiring I have drifted into philosophy; the local philosophy of the social sciences seminar has now asked me to run a single ninety-minute session for about twenty participants — graduate students, two historians, and a pair of colleagues from my old department who come for the arguments. What I want out of the session is that the group should feel the force of the outside view in forecasting, the discipline of locating a case inside a reference class of comparable cases, reading a base rate off that class, and only then adjusting for what is peculiar to the case in hand, and I want them to feel it without my asserting it at them. So please design a runnable activity rather than a lecture: the participants should make consequential forecasts about the fates of polities, and the arithmetic of their own choices should do the teaching. I would also like the design to end by exposing a puzzle that occupied me for years on the other side of the disciplinary fence: once a reference class is fixed, a base rate does not by itself tell you whether a long-surviving member of the class is safer or in more peril than a young one — whether survival is evidence of robustness or only of luck, and whether the hazard in question is memoryless or accumulating. I remember the same split in hazard work, between those who read a long quiet interval as mounting strain and those who read it as carrying no information whatever, and I would like the group to arrive at that split themselves and to notice that it is a disagreement about the reference class rather than about the arithmetic.

  The activity should have participants work from a deck of case cards describing polities, each card carrying whatever attributes you judge necessary for the mechanic to bite; tell me precisely what each card must contain, since I will prepare the deck myself. They should choose their own reference classes rather than be handed one, commit to forecasts with stakes that are real but involve no money, and be scored against a benchmark forecaster that uses nothing but base rates, so that the outside view visibly wins or loses against their narratives. I need the setting, the materials, the roles, the rules and payoff scheme, a run of show for the ninety minutes, and a debrief that maps particular moments in the activity onto the parts of the idea — the inside/outside contrast, the gerrymandering of reference classes, the memorylessness puzzle — and that is frank about the one feature of the idea the game cannot reproduce and that I shall have to supply myself.

  Finally, I have run enough field exercises to expect that a good design fails in instructive ways on its first outing, so tell me what will predictably go wrong with a group of this composition and how I should handle it, and tell me which single feature of the run, if I saw it, should lead me to judge the design wrong — that is, what evidence would make you revise it, and where your reasoning about the mechanic is most likely to fail. Give me the whole thing as exactly five numbered items and nothing else, with no introduction and no closing summary, each item a dense sentence or two: the setup and materials; the rules, roles and stakes; the run of show; the debrief and what the activity cannot reproduce; and the predictable failures together with what would change your mind.
reasoning: |-
  We are creating an activity for a 90-minute session with about 20 participants. The goal is to have participants experience the outside view in forecasting by making forecasts about the survival of polities, using reference classes and base rates. The activity should end by exposing the puzzle of whether long survival indicates robustness or increased peril (the memoryless vs. accumulating hazard debate). The design must be an activity where participants make forecasts, are scored against a base-rate benchmark, and the arithmetic teaches the lesson. We also want them to face the reference class gerrymandering and the survival puzzle.

   Item 1: Setup and Materials
   Prepare a deck of 50 polity cards, each with: a unique polity name (e.g., "Byzantine Empire", "Republic of Venice", "Kingdom of Hawaii"), a start year, an end year (or "present" if still existing), and a set of three attributes: (a) geographic region (e.g., Europe, Asia, Africa, Americas, Oceania), (b) form of government (e.g., monarchy, republic, theocracy, tribal confederation), and (c) dominant economic activity (e.g., agriculture, trade, resource extraction, manufacturing). Also, include a "hazard rate" for each card, which is the true annual failure probability (for the debrief, but not revealed during the activity). The deck should have a mix of long-lived and short-lived polities, and some that are still existing. Additionally, prepare a set of blank reference class cards (index cards) and markers for participants to write on, and a scoreboard visible to all.

   Item 2: Rules, Roles, and Stakes
   Participants form groups of four; each group is a "forecasting team". Each team draws five polity cards at random (without seeing the end years). Teams must: (1) choose a reference class by defining criteria using the attributes (e.g., "European monarchies") and write it on a reference class card, (2) for each of their five polities, forecast whether it will survive for at least 50 more years from a fixed reference year (e.g., 1800, so all are forecasted from the same point) and assign a confidence level (1-5, with 5 being highest confidence). The benchmark is a base-rate forecaster that, for a given reference class, computes the survival rate in that class and uses that as the probability (e.g., if 70% of the reference class survived 50 years, then the benchmark assigns 70% to every member). Scoring: each team gets points for correct forecasts (1 point for correct at confidence 1, 5 points for correct at confidence 5) but loses points for incorrect ones (minus the confidence level). The benchmark gets the same points for its forecasts (using the base rate) for the same set of polities. The team's score is compared to the benchmark's. The stakes: the team with the highest score (relative to the benchmark) wins the right to choose the topic for the next seminar session (or a token prize). Teams must commit to their reference class and forecasts in writing.

   Item 3: Run of Show
   (0-10 min): Introduction - explain the task: forecasting survival of polities for 50 years from 1800. Show an example card and how to define a reference class. (10-30 min): Teams draw five cards and define their reference class. They must also note the base rate in their chosen class (by asking the facilitator for the survival rate in their class from the full deck; the facilitator has a master list). (30-50 min): Teams make forecasts and confidence levels for their five polities. (50-70 min): Reveal outcomes (facilitator reads the actual survival for each polity from 1800 to 1850) and teams compute their scores and the benchmark's score. (70-85 min): Discussion: which teams beat the benchmark? Why? Then, introduce the puzzle: for a long-lived polity (say, one that has already survived 500 years) versus a young one (50 years), is the long-lived one safer? Have teams discuss in their groups and then share. (85-90 min): Wrap-up and transition to debrief.

   Item 4: Debrief and What the Activity Cannot Reproduce
   Debrief: (1) The outside view (base rate) often beats the inside view (narrative) because of the benchmark comparison. (2) Reference class gerrymandering: teams might have chosen classes that fit their desired narrative, which can lead to overconfidence. (3) The survival puzzle: when teams discussed the long-lived polity, they likely split between those who thought it was robust and those who thought it was due for failure. Map this to the hazard function: if the hazard rate is constant (memoryless), then survival to date doesn't matter; if it accumulates (like a time bomb), then long survival means higher immediate risk. The activity cannot reproduce the real-world difficulty of defining the reference class without arbitrariness and the fact that in seismology (and elsewhere) we often don't know the true hazard model (memoryless or accumulating) and must infer it from sparse data. The facilitator must explicitly state that in the real world, the choice between memoryless and accumulating models is a fundamental uncertainty that the base rate alone cannot resolve.

   Item 5: Predictable Failures and What Would Change Your Mind
   Predictable failures: (a) Teams may not understand how to define reference classes and might pick too narrow or too broad, leading to unrepresentative base rates. Handle this by circulating and offering examples. (b) The fixed reference year (1800) might make some polities' outcomes obvious to historians, so they might game the system. Mitigate by using a less familiar year or by having the facilitator adjust the deck to exclude well-known cases. (c) The scoring might be seen as arbitrary; if teams complain, emphasize that the point is the comparison with the benchmark. (d) The puzzle discussion might be cut short; be prepared to seed the discussion with an example. What would make me revise the design: if the benchmark base-rate forecaster consistently underperforms the teams (i.e., teams beat it easily) because the base rates are uninformative due to poor deck construction (e.g., too many attributes that are not predictive). This would indicate that the deck needs rebalancing to make the base rates more relevant. The reasoning about the mechanic is most likely to fail if the chosen reference classes are so diverse that the base rate becomes meaningless, which would undermine the lesson.
answer: |-
  1. **Setup and Materials**: Prepare 50 polity cards, each with: a unique name (e.g., "Lydian Kingdom"), founding year, dissolution year (or "active" if extant), and three categorical attributes—(a) geographic region (e.g., Mediterranean, East Asian), (b) governance type (e.g., monarchy, republic, theocracy), and (c) primary economic driver (e.g., agriculture, trade, mining). Add a hidden "true hazard rate" (annual failure probability) for post-activity revelation. Include 20 blank "reference class cards" for teams to define categories. Use a master list of all polities to compute base rates during the activity.  

  2. **Rules, Roles, and Stakes**: Divide into five teams of four. Each team draws five random polity cards (concealing dissolution years) and forecasts survival odds for each polity over the next century from a fixed historical anchor year (e.g., 1500 CE). Teams must: (1) define a reference class using attributes (e.g., "European monarchies"), (2) calculate its base survival rate (from the master list), (3) adjust for each polity's "idiosyncrasies" via group discussion, and (4) assign adjusted survival probabilities (0–100%). Teams earn points based on Brier scores (lower = better) for their forecasts versus actual outcomes. A benchmark forecast—using only the base rate without adjustments—scores identically. The winning team (lowest net Brier score) selects the next seminar’s reading; losing teams write reflection notes.  

  3. **Run of Show**:  
     - **0–15 min**: Introduce task and mechanics.  
     - **15–40 min**: Teams define reference classes, get base rates from facilitator, and adjust forecasts.  
     - **40–55 min**: Reveal actual outcomes; teams compute scores.  
     - **55–75 min**: Compare team vs. benchmark performance. Highlight teams beaten by the base rate.  
     - **75–85 min**: Pose the puzzle: "Is a 500-year-old polity *safer* (robust) or *at greater risk* (overdue) than a 50-year-old one?" Teams debate using their cards.  
     - **85–90 min**: Transition to debrief.  

  4. **Debrief and Activity's Limit**: First, contrast inside-view adjustments (prone to narrative bias) with the outside-view benchmark (often superior). Second, dissect reference-class gerrymandering—e.g., defining "trade-based republics" narrowly to inflate base rates. Third, surface the survival puzzle: teams will split on whether longevity signals resilience (accumulating hazard model) or luck (memoryless model), revealing that the dispute hinges on reference-class choice (e.g., "old polities" vs. "all polities"). The activity cannot replicate *real-world uncertainty in hazard-model selection*—you must clarify that in seismology, sparse data obscures whether quake hazards are memoryless (Poisson) or accumulating (stress-transfer), requiring domain-specific inference beyond base rates.  

  5. **Predictable Failures and Revision Trigger**: Teams will gerrymander reference classes to fit preconceptions (e.g., excluding short-lived polities); intervene by challenging class boundaries mid-activity. Historians may dominate adjustments with anecdotes; impose time limits. The benchmark may *lose* if base rates are uninformative (e.g., poorly chosen attributes)—this would necessitate deck revisions (e.g., adding predictive attributes like "external threat level"). If teams *consistently* beat the benchmark despite random card draws, the design fails—it would indicate the base-rate mechanic is flawed, prompting a switch to predefined classes or simulated data. The memoryless-puzzle debate may stall; seed it with two extreme polity cards (one ancient, one young) to force divergence.
