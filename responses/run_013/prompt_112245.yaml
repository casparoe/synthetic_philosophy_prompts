prompt: |-
  Hey so I'm a junior in high school and I'm applying to this summer research program at the local university — six weeks, you get a grad student mentor, and you have to hand in a 3-page proposal up front before they'll take you. Mine is supposed to be philosophy-ish. They allow that as long as you can argue it's a real research question and not just an essay.

  My half formed idea is about the thing where you start measuring something and then people start optimizing the number instead of whatever you actually cared about. I think it's called Goodhart's law? Everyone knows the one liner about how a measure stops being a good measure once it becomes a target, and I've got a million examples (standardized test scores, hospital waiting times, cops reclassifying crimes, video game achievements, that kind of stuff). But every time I try to write the actual question down it splits into things that feel like they're not the same phenomenon. Like:

  - sometimes nobody is cheating at all and the number just quietly stops tracking the real thing because the world moved
  - sometimes people are actively gaming it — teaching to the test, hitting the button that scores the point
  - and sometimes I think the number was never tracking a real thing in the first place, it just became the definition of the thing, so "the measure got worse" isn't even the right description — the goal got replaced by the metric

  The bit I actually think is interesting and can't find spelled out anywhere: whether gaming and world-shifting are really two different failure modes or one mode wearing a hat. My hunch is they come apart in a way that matters, because in one case more auditing and transparency fixes it and in the other it definately doesn't, and there might be a third case where auditing makes it wierdly worse. I also suspect the "the goal got replaced" case is doing something different from both, but I can't say what.

  Can you turn this into the proposal? What I need in it: the question stated so that it actually has an answer instead of being a vibe, why the obvious answers people give don't settle it, what I'd do in six weeks week by week (I have no budget, no lab, it's just me and a laptop), what would count as the project failing, and an honest call on whether this is too big for six weeks — and if it is, exactly what to cut so it isn't. Please don't give me a reading list or citations, my mentor said she'd sort that out and I can't get to a library anyway. And please don't just say "it depends on the context" for three pages, that's what my last draft did and it was useless.
reasoning: |-
  Okay, this user is a high school junior tackling a philosophy-ish research proposal about Goodhart's Law. They're clearly bright but stuck on refining their messy observations into a sharp question. The frustration in their voice is palpable – they've already written one vague draft and desperately need concrete scaffolding. 

  Hmm, their core insight about distinguishing failure modes is genuinely novel. Most discussions of Goodhart treat it as a monolithic problem, but they've intuitively identified three distinct patterns: measurement drift (world shifts), gaming (strategic manipulation), and goal displacement (metric becomes the goal). That taxonomy alone is proposal-worthy. 

  What they're missing is the philosophical machinery to formalize this. They need to recognize they're actually asking about the ontology of measurement failure: are these fundamentally different species or contextual variations? The key is anchoring to epistemology – how we know when a proxy fails – rather than just listing examples. 

  *scribbles mental note* Must avoid three traps: 
  1) Don't let this become a literature review (they have no library access) 
  2) No fake methodology – embrace that this is conceptual analysis 
  3) Preserve their authentic voice while adding rigor 

  The timeline is tight but feasible if we ruthlessly scope it. They'll panic if I suggest interviewing hospital administrators, so pure theory it is. The "what counts as failure" section is crucial – this could easily become six weeks of wheel-spinning without clear success conditions. 

  Biggest risk is overcomplication. Should explicitly forbid them from: 
  - Chasing every subtype of Goodhart 
  - Debating whether metrics can ever be perfect 
  - Solving the problem (this is diagnostic, not prescriptive) 

  ...And we'll call the third category "ontic collapse" to make it sound properly philosophical without pretension. The gaming/drift distinction is gold – that's where they should spend 80% of effort. 

  *checks emotional tone* They need validation that their chaos is actually promising. Will emphasize how their examples reveal deeper epistemic fractures rather than just being "a vibe". The proposal structure should feel like guardrails, not a cage.
answer: |-
  Here’s a focused, actionable proposal framework that sharpens your insight into a researchable question while staying within a 6-week scope. I’ve cut the fluff, defined clear failure conditions, and scoped the work to your resources.

  ---

  **Research Proposal: The Taxonomy of Goodhart Failure Modes**  
  **Core Question:** *Under what conditions do the observed failure modes of Goodhart’s Law—measurement drift, strategic gaming, and goal displacement—represent fundamentally distinct phenomena versus contextual variations of the same mechanism?*

  ### Why This Isn’t Settled (and Why It Matters)
  Existing discussions treat Goodhart failures as either:
  - A uniform problem ("metrics corrupt when incentivized"),  
  - Or a list of examples without a unifying framework.  
  Your key insight—that **failure mode differences dictate solution viability** (e.g., auditing fixes gaming but worsens drift)—challenges this. If these modes are ontologically distinct, interventions must be tailored; if they’re spectral, we need dynamic responses. This gap enables real research.

  ### Methodology: Conceptual Analysis + Case Mapping (6-Week Plan)
  **Tools:** Laptop, free access to philosophy papers (via mentor), public case studies (e.g., news reports, academic abstracts).  
  **No primary data needed**—focus on synthesizing existing examples into your framework.

  | Week | Task | Deliverable |
  |------|------|-------------|
  | **1** | **Taxonomy Refinement:** Define strict criteria for each failure mode:<br>- *Drift:* Metric-world decoupling *without* intent (e.g., test scores losing predictive validity due to curriculum changes).<br>- *Gaming:* Intentional optimization of the metric (e.g., teachers "teaching to the test").<br>- *Displacement:* Metric *becomes* the institutional goal (e.g., "customer satisfaction score" overriding actual service quality). | Clear operational definitions |
  | **2** | **Case Library Assembly:** Collect 15–20 documented examples (academic, journalistic, historical) pre-sorted into your 3 modes. *Restrict scope:* Only use cases with explicit evidence of the failure mechanism (e.g., internal memos showing intent for gaming; longitudinal data showing drift). | Annotated case library |
  | **3** | **Divergence Test:** Identify 3–5 "boundary cases" where modes *overlap* or are disputed (e.g., police stats: is reclassification gaming or displacement?). Analyze: What contextual factors (e.g., reward structure, measurement complexity) push a case toward one mode? | Boundary case analysis |
  | **4** | **Intervention Analysis:** For each mode, map proposed/attempted solutions (audits, metric adjustments, etc.). Test your hypothesis: Does gaming respond to transparency? Does displacement resist it? Does drift *accelerate* with tighter controls? | Mode-solution compatibility matrix |
  | **5** | **Synthesis:** Draft criteria to predict failure modes based on:<br>- Incentive structures<br>- Measurability of the true goal<br>- System feedback loops | Predictive framework |
  | **6** | **Validation & Write-up:** Stress-test your framework against boundary cases. Does it resolve ambiguities? If not, refine. Final report: Focus on *when and why modes diverge*. | 8–10 page draft report |

  ### What Success Looks Like
  - **Minimal Viable Output:** A defensible taxonomy showing *at least one concrete distinction* between modes (e.g., "Drift is uniquely resistant to oversight").  
  - **Failure Conditions:**  
    - If all cases collapse into "it depends on incentives" (no distinct modes).  
    - If boundary cases overwhelm the framework (>50% unclassifiable).  
    - If no practical distinction emerges between solutions for each mode.  
  *If failure occurs, you pivot to documenting why the modes are inseparable—still a valid finding.*

  ### Is It Too Big? Where to Cut
  **Yes, if unchanged.** Here’s how to shrink it:  
  - **CUT:** The "goal replacement" mode *unless* it directly contrasts with drift/gaming. Merge it with gaming if definitions blur.  
  - **CUT:** Comprehensive solutions—focus only on diagnosing modes, not fixing them.  
  - **CUT:** Statistical analysis; this is conceptual. Your "data" is qualitative case evidence.  
  - **FOCUS:** On **drift vs. gaming**. This is your strongest insight—how unintended decoupling differs from strategic cheating. Displacement can be a secondary note.

  ### Why This Works
  - **Answerable:** Success = a framework that usefully separates failure modes.  
  - **Scope-Limited:** No new data, no field work.  
  - **Non-Vague:** Definitions are binary (drift has no intent; gaming has intent; displacement has institutional adoption).  
  - **High School Friendly:** Uses public examples; philosophy rigor comes from clear logic, not jargon.

  **Final Tip:** Start Week 1 by writing your 3 definitions *in a single sentence each*. If you can’t, simplify further. Your mentor will handle citations—your job is to show how your lens reveals something new about known cases.

  ---  
  **Output:** A 10-page report proposing a diagnostic tool for Goodhart failures, with clear criteria to distinguish modes. Even negative results (e.g., "modes are indistinguishable in practice") advance understanding.
