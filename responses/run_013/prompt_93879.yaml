  First, I need to establish a solid structure. The key dependency is building the see-judge distinction first. Without that, the whole argument collapses into "it's just interpretation." The Müller-Lyer illusion is perfect here because it's visual and undeniable. Once that foundation is set, introducing cognitive penetration through a strong example like the husband-wife scenario makes sense. That case shows how top-down beliefs alter perception itself.

