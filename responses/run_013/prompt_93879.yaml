answer: |-
  Here is your five-item plan, designed for clarity and tape-to-notebook brevity:

  1.  **Order & Dependency:**
      1.  **Establish Raw Sensation:** Start with the *uninterpreted* visual field (e.g., ambiguous figures like the Rubin Vase/Jastrow Duck). Dependency: Without this baseline, "seeing differently" has no anchor.
      2.  **Introduce the See/Judge Distinction:** Use **Müller-Lyer**. The lines *look* unequal (percept) even when you *know/judge* they are equal. Dependency: This sharp separation is the critical foundation. *Everything rests on this being clear.*
      3.  **Demonstrate Top-Down Influence:** Show how context/framing alters *what is seen* in ambiguous figures (e.g., "B" vs. "13" in A12C, influenced by letter/number context). Dependency: Builds on Step 1 & 2, showing cognitive states altering the *percept itself* within ambiguous input.
      4.  **Introduce Cognitive Penetration Claim:** Present your **Husband/Wife case**. Frame it as: Does the husband *see* coldness in the neutral face (percept altered by belief), or just *judge* it as cold based on the same neutral percept? Dependency: Requires Steps 1-3 to be grasped. The ambiguous figure step primes them for this.

  2.  **Carrying Example & Requirements:**
      *   **Example:** Your **Husband/Wife case**.
      *   **Must Have:** (a) A perceptually ambiguous stimulus (the "neutral" face), (b) A strong, prior cognitive state (belief wife is drifting), (c) A claim about the *experiential character* of the perception (the face *looks* cold/distant).
      *   **Must Not Have:** Any overt behavioral cues from the wife that objectively justify the coldness *interpretation*. The ambiguity is key.

  3.  **Candidates to Cut & Why:**
      *   **Cut the Coin Study:** It's historically interesting but methodologically messy (replication issues, debate over whether it measures *perception* or *memory/drawing skill*). It distracts from the core phenomenological claim.
      *   **Use Müller-Lyer Strategically:** Keep it **only for Step 2 (See/Judge Distinction)**. Its value is proving perception ≠ judgement. *Don't* use it to argue *for* cognitive penetration (it's weak for that, as the "dumb eye" critique highlights). Cut it after Step 2.

  4.  **Misconception Map (Where to Head Off):**
      *   **"Isn't this just attention?" (Pre-existing):** Head off **immediately after Step 3 (Ambiguous Figures)**. Contrast changing *where* you look/attend (which changes input) vs. changing *how* the *same input* looks (like the B/13).
      *   **"So it's just interpretation/judgement?" (Pre-existing & Manufactured):** Head off **relentlessly at Steps 2 (M-L), 3 (Ambiguous Figs), and 4 (Husband/Wife)**. Constantly ask: "Is this difference happening at the level of the *look* or the *thought about* the look?" Refer back to M-L.
      *   **"So we live in different worlds, no facts?" (Manufactured during Step 4):** Head off **during discussion of Husband/Wife case**. State clearly: Cognitive penetration doesn't deny objective reality (the light hitting retinas exists), it claims our *access* to it via perception is influenced. Modularity (Step 5) addresses epistemic worries. *Refuse to debate full-blown relativism here.*

  5.  **Closing Question & Boundaries:**
      *   **Question:** "Can you think of a time when a strong belief or emotion genuinely *changed how something looked to you in the moment* – not just how you interpreted it later, or what you paid attention to, but the raw, immediate visual experience itself? What was different?"
      *   **Refuse to Cover:**
          *   Neuroimaging evidence (irrelevant to the *phenomenological* claim).
          *   Deep dive into Modularity (Fodor/Pylyshyn) vs. Penetrability (Siegel/Church) debate beyond stating it's the core theoretical dispute.
          *   Expertise cases (e.g., chess masters, radiologists) - *explicitly state* purists exclude these as involving learned perceptual *concepts*, not core penetration, and you're focusing on simpler cases. *This is a live boundary dispute.*
      *   **Settled vs. Live:**
          *   **Settled:** Top-down effects on *judgement* and *attention* are uncontroversial. The See/Judge distinction is fundamental.
          *   **Live Fight:** Whether genuinely *low-level* perceptual experience (like color, simple shape) can be penetrated by cognition, or if effects are always at a higher, conceptual level ("perceptual judgement"). Modularity vs. Penetrability is the central, ongoing debate. *Acknowledge you are presenting the Penetrability argument.*
