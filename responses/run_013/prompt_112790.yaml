prompt: |-
  I run a small, non-academic monthly discussion group that works through puzzles in decision theory, and I have been thinking about counterfactual mugging on my own for some time. Next month's guest is a decision theorist who holds that you should pay in counterfactual mugging — the case in which Omega flips a coin and, if it comes up tails, asks you for $100, while if it comes up heads it pays you $10,000 on the strength of having predicted that you would have paid in the tails branch. My guest's defense, as I understand it, is that we should assess whole policies or decision-procedures rather than the particular act in front of us, and that the policy of paying comes out ahead when averaged over both branches.

  I would like eight to ten interview questions that push well beyond a restatement of that view. At least one should address the incredulity many people feel — the sense that paying $100 once the coin has already come up tails is simply handing money to a stranger for nothing — and at least one should press on a variant I have worked out, which I take to be the crux. Call it the XOR mugging: Omega flips two independent fair coins; if the first comes up heads it asks you for $100 and you must answer on the spot, and if the first comes up tails it does not ask but pays you $10,000 if and only if exactly one of the following is true — it predicted you would have paid in the heads branch, or the second coin came up heads. As far as I can work out, the disposition to pay now leaves the $10,000 at fifty-fifty rather than raising your chance of it, so paying becomes a pure $100 loss. This strikes me as the same structure as the XOR blackmail cases, where the blackmailer ties the threatened harm to an exclusive-or of your payment with a coin flip so that paying ceases to be evidence that the harm will be avoided. I want the questions to force my guest to say whether the policy defense survives this, and if it does not, to identify what was actually doing the work in the original case.

  The remaining questions should cover, among other things: what precommitment can mean when there is no earlier moment at which to commit, and whether that is a coherent demand; whether the policy defense leaves the theory unable to say anything about the single case in front of you, and why that is not a fatal objection; whether it matters that in the original case the benefit lands in the branch you are not in, so that the policy is good for a possible version of you rather than for you; whether the XOR variant shows that the original argument turns on a correlation that can be broken at will, and what that implies about how robust the recommendation to pay really is; whether the puzzle depends on Omega being perfect or merely on decision-making being correlated across branches; and how the position handles a blackmailer who is very reliable but not perfect, and whether the answer changes gradually or flips at perfection.

  For every question, please give me the follow-up I should ask if my guest gives the answer they are most likely to give. I expect a good deal of insistence that these are features rather than bugs, and of the charge that I am just redescribing causal decision theory, and I want the follow-ups to close those off rather than let the conversation stall. I do not need citations or a reading list; I want questions that will work in the room.
reasoning: |-
  Okay, the user runs a small discussion group focused on decision theory puzzles and is preparing to interview a guest who advocates paying in the counterfactual mugging scenario. They want deep, challenging questions that go beyond surface-level defenses, particularly probing the XOR variant they've developed where paying becomes a pure loss. 

  Hmm, the user is clearly well-versed in decision theory nuances—they reference XOR blackmail cases and recognize structural parallels. Their frustration with policy-based defenses ("features not bugs") suggests they've encountered deflection before. The core tension they want to expose: whether "commit-to-a-policy" arguments collapse when correlation between branches is strategically broken.

  Interesting that they emphasize real-time conversation tactics ("work in the room"). They're not after academic citations but steel-manned traps for common dodges. The XOR mugging is their secret weapon, so questions must force the guest to confront its implications head-on. 

  Notable sub-themes: 
  - The existential weirdness of benefiting other branches ("possible versions of you")
  - Whether single-case decisions evaporate under policy thinking
  - How perfection assumptions (Omega's vs. imperfect predictors) affect outcomes

  For follow-ups, they want surgical counters to predictable rebuttals—especially "this just re-describes CDT" or "correlation is necessary." Need follow-ups that corner the guest into either conceding XOR breaks the defense or explaining why policy still somehow "wins" despite 50% payoff.

  The user's variant is clever: Omega decouples payment from guaranteed reward by XOR-ing with a coin flip. If the guest insists on paying anyway, it becomes indefensible sunk cost. But if they say "don't pay," it unravels their original mugging position. Either way, the interview gets explosive.

  ...Better craft questions that make this trap inescapable. Primary focus: XOR mugging must force a choice between consistency and plausibility. Secondary angles: precommitment coherence, single-case relevance, and robustness to imperfect predictors. Follow-ups must preempt wriggling.
answer: |-
  Here are 10 interview questions with targeted follow-ups, designed to push beyond standard policy defenses and confront the core challenges you've identified, especially the XOR mugging:

  1.  **The Existential Sting:** "Many feel paying in the actual tails branch is *literally* throwing $100 at a stranger for nothing, as the benefit exists only in a counterfactual branch they *aren't* experiencing. If 'I' only exist in this branch, how does benefiting a *different possible version* of me in the heads branch – who, by definition, *isn't me* – rationally justify *my* loss *here*?"
      *   *Likely Answer:* "It's about the overall expected value of the *policy* across all possible branches/selves."
      *   *Follow-Up:* "But if the 'branches' are truly distinct and causally isolated after the coin flip, doesn't this reduce to demanding that *I* sacrifice *my* resources for the sake of *someone else's* gain? How is this different from altruism towards a stranger, and why is it *rationally obligatory*?"

  2.  **The Single-Case Objection:** "If rationality is fundamentally about evaluating whole policies over many instances, does this mean your theory cannot make a definitive recommendation for a *single, isolated decision* like this one counterfactual mugging? Isn't that a critical failing for a decision theory?"
      *   *Likely Answer:* "The 'single case' is an abstraction; we always act based on dispositions/policies that apply across similar situations. Evaluating the policy *is* evaluating the act."
      *   *Follow-Up:* "But in this *specific, unique* interaction with Omega, occurring only once in history, where no precedent or future instance exists – is paying the $100 the rational act *for me, here, now*? If so, what justifies it *without* appealing to other hypothetical instances? If not, why pay?"

  3.  **Precommitment Without Time:** "You appeal to 'precommitment' to a policy. But in the standard setup, the agent only encounters Omega *after* the coin flip. There is no earlier 'me' to commit. What does it mean to be 'committed' to a policy at the moment of choice, when I could simply choose differently *right now* without any prior self-betrayal?"
      *   *Likely Answer:* "Precommitment refers to adopting a disposition *now* that governs your action *now* in this situation, recognizing it governs similar actions in similar (including counterfactual) situations."
      *   *Follow-Up:* "If 'precommitment' just means 'choosing this action now because I believe this type of action is best across situations,' isn't that circular? How does calling it 'precommitment' add anything beyond saying 'I choose to pay because I think paying is the best policy'? What *binds* me to the policy at T=0 if I can freely choose differently at T=1?"

  4.  **The XOR Mugging Crucible:** "Consider my XOR mugging: Paying $100 if coin1=Heads gives me a 50% chance of $10,000 only if coin2=Heads *XOR* I paid – but if I *don't* pay, I also get $10,000 with 50% probability (if coin2=Tails). Paying costs $100 but doesn't change the *probability* of the $10,000 reward – it remains 50%. Doesn't this mean the policy 'Always Pay' results in a *strict $100 loss* compared to 'Never Pay' in the Heads branch, with no offsetting gain? How does the policy defense survive this?"
      *   *Likely Answer:* "In XOR mugging, paying *is* irrational in the Heads branch. The correlation between the predictor and the coin flip is broken by the XOR. This is different from the original mugging where paying directly causes the reward in the other branch (via prediction)."
      *   *Follow-Up (Crucial):* "Exactly. So your defense of paying in the *original* mugging *depends critically* on the strong correlation between my paying and Omega's prediction/action in the other branch. The XOR case shows this correlation can be structurally broken. If Omega can break this correlation at will (as in XOR mugging), rendering paying harmful, doesn't this reveal that the *only* reason to pay in the original is the *threat* of losing the $10,000 *if you don't pay*? Isn't this functionally identical to blackmail, making 'paying the mugger' rational only under coercion, not because of some intrinsic virtue of the 'pay' policy?"

  5.  **Robustness of Correlation:** "Following the XOR point, how robust is the 'pay' recommendation? If Omega could *choose* whether to structure the interaction like the original mugging or like the XOR mugging *after* predicting your policy, and knew you followed 'Always Pay', wouldn't it always choose the XOR structure to pocket $100 for free? Doesn't this make 'Always Pay' a losing policy against a sufficiently sophisticated adversary?"
      *   *Likely Answer:* "We typically assume Omega is truthful and structures the game fairly beforehand, not adversarially optimizing against your policy after prediction."
      *   *Follow-Up:* "But doesn't this highlight a fragility? If the recommendation *only* holds under very specific structures guaranteeing the beneficial correlation, and collapses (or becomes harmful) if that correlation is broken (as in XOR), doesn't this undermine the claim that 'Always Pay' is a generally superior *policy*? Shouldn't a robust policy work even against potential correlation-breakers?"

  6.  **Perfection vs. High Correlation:** "Does your recommendation crucially depend on Omega's *perfect* prediction? Imagine a highly reliable, but imperfect predictor (say 99.9% accurate). In the tails branch, if I refuse, there's a 0.1% chance I *still* get the $10,000 in the heads branch due to prediction error. Does paying still dominate? Does the justification shift gradually or is there a sharp threshold at perfection?"
      *   *Likely Answer:* "With high enough correlation, paying is still likely best. The expected value calculation still favors paying as long as P(Reward | Pay) * $10,000 > P(Reward | ~Pay) * $10,000 + $100."
      *   *Follow-Up:* "But doesn't this reintroduce CDT-like reasoning? You're now directly comparing the *conditional probabilities* and expected utilities *of outcomes in your own branch based on your action*. If you accept this calculation with an imperfect predictor, why reject CDT's similar calculation in the perfect predictor case where P(Reward | Pay) = 1 and P(Reward | ~Pay) = 0? What principle forces a *different* calculation method just because prediction is perfect?"

  7.  **Policy for Whom?:** "You say the policy is good 'on average'. But averaging over branches means averaging over *different agents* (or agent-slices) in causally isolated worlds. Why should *this* agent in *this* world care about the average well-being of agents in *other* worlds? Isn't rationality fundamentally self-regarding?"
      *   *Likely Answer:* "The 'policy' perspective treats the pre-decision agent as choosing a rule for all branches they might find themselves in. It's about maximizing expected utility from that pre-flip perspective."
      *   *Follow-Up:* "But there *is no* pre-flip agent making a unified choice. The 'pre-flip perspective' is just a thought experiment. The actual choice is made by the post-flip agent. How does invoking a hypothetical perspective that *doesn't exist* rationally compel the *actual* agent to act against their locally perceived interests?"

  8.  **The Charge of Redescription:** "Critics argue your 'policy' defense is just redescribing evidential decision theory (EDT) – you pay because paying *is evidence* Omega predicted you would pay, leading to the reward in the other branch. How is your view substantively different from EDT here?"
      *   *Likely Answer:* "It's not about evidence; it's about the actual consequences of adopting a policy. EDT might get the right answer here but fails in Newcomb-like problems with transparent boxes. Our view is grounded in the superiority of the policy's outcomes."
      *   *Follow-Up:* "But in *this specific choice*, at the moment of decision in the tails branch, what is the *causal mechanism* by which my handing over $100 *causes* the $10,000 to appear in the heads branch? If there's no causal link, only correlation via a common cause (my disposition/policy), isn't the 'consequence' purely evidential? How does calling it a 'policy consequence' change the underlying dependency structure?"

  9.  **The Blackmail Parallel:** "In the original mugging, Omega's setup means that *not paying* in the tails branch *causes* (via prediction) the *absence* of $10,000 in the heads branch. This looks structurally identical to blackmail: 'Pay $100 or I will cost you $10,000 (in another branch)'. If we accept paying here, doesn't that imply paying blackmail is always rational if the threat is credible and sufficiently large?"
      *   *Likely Answer:* "The key difference is the acausal, predictive nature of Omega vs. the causal threat of a blackmailer. Omega isn't *punishing* non-payment; it's accurately reporting the outcome of its prediction."
      *   *Follow-Up:* "But from the *agent's perspective in the tails branch*, the effect is identical: Hand over $100 or lose $10,000 (in the counterfactual). Whether Omega is 'punishing' or just 'reporting' seems like a distinction without a difference for the decision-maker facing the demand *now*. If the structure compels payment to avoid a large loss elsewhere, why isn't it functionally blackmail?"

  10. **What Work Does 'Policy' Do?:** "Given the vulnerability exposed by the XOR mugging – where the 'Always Pay' policy becomes harmful – can we isolate what *specific element* of the original counterfactual mugging the policy defense was *actually* leveraging? Was it solely the guaranteed correlation (broken in XOR), or something else?"
      *   *Likely Answer:* "The XOR case shows the correlation is crucial. The policy defense works in the original *because* of the tight link between the action and the counterfactual reward via perfect prediction."
      *   *Follow-Up (Synthesizing):* "So, if the core mechanism is the *correlation* ensuring that paying benefits the counterfactual self, and this correlation can be broken (XOR) or exploited adversarially, does this mean the 'policy' language was merely a way of *describing* the agent's recognition of this acausal correlation? Isn't the *real* reason to pay in the original simply to avoid triggering the condition that *prevents* the $10,000 (i.e., the prediction of non-payment), making it fundamentally about managing acausal correlations/evidence, not about the inherent superiority of a 'policy' abstracted from those specific correlations?"

  **Key Interview Tactics:**

  *   **Listen Closely:** Don't just wait to ask the next question. Engage with their answers. If they surprise you, adapt.
  *   **Clarify & Paraphrase:** "So, if I understand correctly, you're saying that... Is that right?" forces precision and shows engagement.
  *   **Control the Frame:** Gently steer back to the core tension points (XOR, single case, who benefits) if they generalize or deflect. "I understand that point generally, but how does it specifically address the problem in the XOR variant / for the single agent?"
  *   **Use Their Language:** If they use terms like "acausal control" or "logical correlation," incorporate those terms into your follow-ups to show you're building on their framework.
  *   **Stay Calm & Curious:** Your goal is exploration, not gotcha. Frame tough questions as genuine puzzles: "I'm really struggling to see how this overcomes the XOR objection. Can you walk me through it step-by-step?"
  *   **Manage Time:** Prioritize questions 4 (XOR Crucible), 10 (What Work Does Policy Do?), and 1 (Existential Sting). These cut deepest to the core issues you want to explore.

  These questions and follow-ups are designed to prevent easy retreats to "policy good" or "it's just EDT/blackmail" by forcing the guest to confront the implications of the XOR case, the nature of precommitment without time, the beneficiary problem, and the fundamental dependency on fragile correlations. Good luck with the discussion!
