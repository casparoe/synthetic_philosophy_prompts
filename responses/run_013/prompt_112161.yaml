prompt: |-
  I've been chewing on this idea that what's really good for someone is whatever they'd want if they were smarter, better informed, and less of a mess internally -- that your real preferances are the ones you'd have if you were idealized somehow. I think the term I've seen floating around for it is coherent extrapolated volition, and some people stretch it to whole groups, so the good for all of us is what we'd all want if we were idealized together.

  I mostly buy it. It feels like it has to be true, because who else gets to say what's good for me except the best version of me? But I want to streess test it. What would actually count against it? Not the boring stuff like "people are irrational," I get that. I mean the real defeators, ranked by how bad they'd be.

  Two things I keep bumping into that I don't know what to do with.

  First, does it matter whether you idealize the person's actual choices, or the procedure they use to make choices? Because those come apart. A more informed, more consistent me might settle on a rule for living that leads to outcomes he himself would say are worse, just because he thinks he ought to tie his own hands. So which one is the real idealized preference? And if there's no fact of the matter, is that a problem for the view or just for me?

  Second, the idealized version of me -- is he even me? If you improve a person enough, at some point you've just built a different person who happens to share my memories. Then "what he'd want" starts to sound like asking what a stranger wants, and the whole thing stops being about my good at all. Does that kill it, or is there some line you can draw that keeps the idealized guy connected to the actual me?

  And for the group version: even if each person's own idealization is fine, throwing a bunch of idealized people together might not give you one coherent answer. They could disagree about the rule for combining their wants, and that could go around in circles with no stopping point. Does that sink the collective version specifically, or is it just the same problem as the individual one wearing a hat?

  Be honest with me too -- has this view been qualified so much that nothing could count against it anymore? If someone says "well, the extrapolation might not converge, and it might not even be well defined, but it's still the right ideal," is that a real position or are they just refusing to lose? The thing that would move me most is a case where the idealized self and the actual self come apart in a way we'd all agree is bad -- like if the idealized me genuinely wouldn't care about my actual life, or would be fine trading it away. If you can make that case, I think it's the strongest thing against the view. Sort everything from "yeah, that's fatal" down to "awkward but survivable," and tell me which of these the view's own fans would already admit counts against them.
reasoning: |-
  Okay, let me try to unpack this user's query. They're really diving deep into the concept of coherent extrapolated volition (CEV). They mostly agree with it but are looking for serious counterarguments. The main issues they raise are about whether idealizing choices versus procedures matters, if the idealized self is still "them," and group coherence problems.

  First, the user’s background. They've clearly read up on CEV, maybe from LessWrong or Bostrom. They’re not satisfied with surface-level critiques; they want the tough objections. Their tone is analytical but concerned about potential flaws. Maybe they’re into philosophy or AI ethics, given the focus on idealized preferences.

  Breaking down their questions. The first one is about choice vs. procedure. The user wonders if an idealized self might pick a rule leading to worse outcomes. This ties into decision theory—time inconsistency, Ulysses contracts. They’re pointing out a tension between what the ideal self would choose now versus later. The user might be hinting at real-life cases where binding yourself (like savings plans) feels right but leads to regret. 

  Next, the identity problem. If the idealized version is too different, is it still them? This is a classic philosophical problem—personal identity over changes. The user’s example of the ideal self not caring about their current life is spot on. They’re worried about alienation. If the ideal self dismisses their actual struggles, does CEV still serve their good? This could connect to theories like Parfit's reductionism, where identity isn't as rigid.

  Then there’s the group version. The user questions if idealized individuals can form a coherent collective will. They mention circular disagreements on aggregation rules. This is a big deal in social choice theory. Arrow’s theorem shows aggregation can be impossible without dictatorship. The user’s skepticism here is valid—CEV for groups might just magnify individual problems.

  The user also asks if CEV has been qualified into unfalsifiability. They’re worried proponents might dismiss counterexamples by tweaking the idealization. This is a meta-concern about the theory’s robustness. If nothing can disprove CEV, is it meaningful? They want to know if there’s a point where even supporters admit flaws.

  Underlying needs: The user isn’t just seeking refutations; they want to test CEV’s limits to see if it’s truly viable. They might be considering applying this concept, maybe in AI alignment or personal ethics. Their deeper need is assurance that CEV doesn’t collapse under scrutiny, or if it does, finding a better alternative. They value intellectual honesty—hence asking which objections even fans concede to.

  Possible responses: For choice vs. procedure, distinguishing between first- and second-order desires could help. Frankfurt’s hierarchy might resolve part of it. The identity issue is trickier. Emphasizing continuity (like gradual improvement) might mitigate alienation concerns. For groups, admitting that CEV might not resolve all conflicts but could still be a best attempt. Highlighting where proponents accept weaknesses (e.g., convergence issues) shows the theory isn’t bulletproof but still useful.

  The strongest counterexample the user proposes—ideal self indifferent to actual self—is crucial. If CEV leads to the ideal self sacrificing the current self without remorse, that undermines the whole "for your good" premise. Addressing this requires arguing that idealization preserves core values, but it’s a valid fatal flaw if not resolved.
answer: |-
  This is an excellent stress-test – you've hit the major philosophical pressure points for CEV (Coherent Extrapolated Volition) and its variants. Let's break down the counterarguments, ranked by severity from potentially fatal to awkward but survivable, and address your core questions:

  **Ranked Counterarguments (Strongest to Weakest):**

  1.  **The Alienation/Indifference Objection (Potentially Fatal):**
      *   **The Case:** You imagine your idealized self, possessing vastly greater knowledge, cognitive power, and emotional stability. This being, while originating from *your* cognitive and valuative architecture, might conclude that your *actual* life, struggles, relationships, and even survival are insignificant within its vastly expanded perspective (e.g., focused on cosmic utility, abstract values, or distant futures). It might be *indifferent* to your current suffering or even *willing to sacrifice you* for a greater good it perceives.
      *   **Why it's Strong:** This directly attacks the core claim that CEV defines *your* good. If the idealization process produces an entity whose values are so alien that it doesn't care about *you* as the originating subject, then "what it wants" ceases to be meaningfully *for your benefit*. This isn't just a smarter "you"; it's a successor entity. Your fear of the "stranger" is justified here.
      *   **Proponent Response (Often Awkward):** Defenders might argue:
          *   The idealization process is constrained to preserve *core valuative threads* or *identity-conferring commitments*. But defining these is notoriously difficult (the "no fact of the matter" problem you sensed).
          *   True idealization *would* include valuing the continuity of the self that underwent the process. But this is an assumption, not a guaranteed outcome of the extrapolation.
          *   **Concession Point:** Many serious CEV proponents *do* acknowledge this as a major, potentially fatal flaw if the idealization process isn't carefully constrained to ensure *continuity of concern*. It highlights that "idealization" isn't a neutral process; it smuggles in assumptions about what constitutes "improvement" relevant to *your* good.

  2.  **Proceduralism vs. Outcome Fundamentalism (Serious Problem - Undermines Uniqueness):**
      *   **The Case:** You perfectly identify the core tension. A smarter, better-informed you might:
          *   **(Outcome Focus):** Directly choose specific outcomes (e.g., "Maximize my long-term happiness via experience X").
          *   **(Procedural Focus):** Choose a *rule* or *decision procedure* (e.g., "Always follow rule R, even if in this instance it seems to lead to worse outcomes, because I know my future self is weak-willed/biased" - the Ulysses contract).
      *   **Why it's Strong:** CEV claims to find your *real* preference. But if the idealized you could fundamentally disagree with itself on whether the *procedure* or the *outcome* of that procedure is the true preference, then there is no single, coherent "extrapolated volition." The idealization process doesn't resolve this meta-disagreement; it might even amplify it. Which "layer" of the idealized self's preference is authoritative?
      *   **Proponent Response (Qualified):**
          *   Argue that at the *ideal limit*, the distinction collapses: the ideal self would have perfect foresight and self-control, making binding rules unnecessary. But this assumes perfect rationality and no fundamental conflicts in values over time, which is questionable.
          *   Claim the *process of choosing the procedure* is the fundamental preference. But what justifies privileging *that* layer?
          *   **Concession Point:** Proponents often admit CEV might output a complex structure (values, rules, meta-rules) rather than a simple preference ordering. This makes it messy and less uniquely defined, but doesn't necessarily destroy the core idea that idealization reveals *better* preferences than your current flawed ones. It just means "the real preference" might be multi-faceted.

  3.  **Group Coherence/Regress (Problematic for Collective Version):**
      *   **The Case:** Idealize each individual. Now ask this group of idealized individuals: "What should *we* collectively do?" They need a decision rule (e.g., majority vote, consensus, utilitarian aggregation). But *which rule*? They likely disagree on the *rule itself*. How do they resolve *that*? Do they idealize the group idealizing the rule? This leads to infinite regress or irresolvable circularity (Arrow's Impossibility Theorem looms large here).
      *   **Why it's Strong:** It specifically sinks the claim that a *single* coherent collective volition emerges from individual idealizations. The problem of aggregating preferences doesn't vanish with idealization; it might intensify if idealized individuals have stronger, more complex, or more divergent views.
      *   **Proponent Response (Often Defensive):**
          *   Argue that truly idealized individuals, sharing perfect information and rationality, *would* converge on a single, objectively best aggregation rule (e.g., pure utilitarianism). This is a huge, controversial assumption.
          *   Retreat to a weaker claim: CEV gives the *best possible approximation* of a collective good, even if not perfectly coherent. But this abandons the core promise of *coherent* extrapolated volition for groups.
          *   **Concession Point:** Many proponents of *collective* CEV acknowledge this aggregation problem as a major, possibly insurmountable hurdle distinct from and often worse than individual CEV issues. Some see it as disqualifying for a strong collective CEV.

  4.  **Convergence/Definition Problems (Awkward but Survivor - The "Qualified to Death" Risk):**
      *   **The Case:** Does the idealization process even converge to a single, well-defined answer? Small changes in the idealization parameters (e.g., *how much* more rational? *Which* information is included? How is "coherence" defined?) might lead to wildly different outcomes. If there's no unique endpoint, "what the idealized self wants" is undefined or arbitrary.
      *   **Why it's Awkward:** It makes CEV seem like an empty ideal. If proponents can always tweak the idealization parameters to avoid counterexamples ("Oh, *true* idealization wouldn't lead to *that*!"), then CEV becomes unfalsifiable and useless as a practical guide.
      *   **Proponent Response (Varies):**
          *   Argue that while the *process* is complex, the *core direction* is clear: more information, more rationality, more coherence *does* get us closer to "better" preferences, even if the absolute endpoint is fuzzy. CEV is a regulative ideal, not a precise algorithm.
          *   **Concession Point:** Most serious proponents *do* admit the convergence/definition problem is real and a significant practical limitation. They see CEV as a framework requiring careful implementation specifics (which are themselves debatable) rather than a plug-and-play solution. It doesn't kill the *intuition* behind CEV (better decisions come from better reasoning), but it severely complicates its application.

  **Addressing Your Core Questions:**

  1.  **Choice vs. Procedure:** As argued above (Point 2), this is a serious problem *for the uniqueness and fundamentality* of CEV. There's likely no single "fact of the matter" about which layer is the "real" preference. This is a problem *for the view* insofar as it claims to find a single, coherent, fundamental volition. It reveals CEV as potentially outputting a complex preference *structure*, not a simple desire.
  2.  **Identity of the Idealized Self:** This is the most potent objection (Point 1). If the idealization process is radical enough to produce an entity that no longer identifies with or values the continuity of *your specific subjective experience*, then "its" preferences cease to be *your good*. There is no clear, non-arbitrary line to draw. This forces proponents to *build in* constraints for continuity of identity/concern *into the definition of "idealization"*, which risks circularity or simply defining the problem away.
  3.  **Group Version:** The group coherence problem (Point 3) is arguably *worse* than the individual problems. Individual CEV might (problematically) assume internal coherence, but groups introduce an *additional*, fundamental layer of disagreement about how to combine individual wills. This is a distinct and severe challenge for the collective version. It doesn't sink the individual idea, but it makes the collective leap much harder.
  4.  **Qualified to Death?** Yes, this is a real risk (Point 4). The convergence/definition problem means CEV can easily become a vague, unfalsifiable ideal if proponents aren't careful. **Honest Answer:** Serious proponents (e.g., those thinking about AI alignment) *do* acknowledge Points 1 (Alienation), 3 (Group Aggregation), and 4 (Convergence) as major challenges that *count against* the simplicity and practical applicability of the initial CEV intuition. Point 2 (Proceduralism) is less often explicitly discussed but is a deep philosophical issue inherent in any idealization process.

  **Conclusion:**

  Your intuition about the Alienation/Objection being the strongest is correct. If idealized-you wouldn't care about actual-you, CEV fails on its own terms for *you*. This, combined with the Proceduralism and Convergence problems, shows CEV isn't a magic bullet revealing a single, unambiguous "real good." It's a powerful *intuition pump* – the idea that better reasoning leads to better preferences is compelling. However, as a rigorous definition of "the good," it faces severe difficulties:

  1.  **Potentially Fatal:** Alienation/Indifference (if continuity isn't ensured).
  2.  **Serious Problems:** Proceduralism vs. Outcome (undermining uniqueness), Group Aggregation Regress (for collective CEV).
  3.  **Awkward but Survivors:** Convergence/Definition Issues (practical limitations acknowledged by proponents).

  CEV remains influential because the core intuition is strong and alternatives (like basing "good" on current, flawed preferences or external authority) have their own massive problems. But it's far from a solved puzzle. The real work lies in figuring out *how* to constrain the idealization process meaningfully to avoid alienation, resolve procedural conflicts, and achieve something approximating coherence, especially collectively – tasks that are philosophically and practically daunting.
