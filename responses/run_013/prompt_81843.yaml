  - (ii) is where most theories differentiate themselves, so this deserves special attention
  - (iii) relates to partition invariance, which van Fraassen showed is problematic for Jeffrey conditioning

  The user's case adds interesting complications with the HQ/territory structure and reliability concerns. I should emphasize how desiderata must handle:
