prompt: |-
  I'm a fifth-year phil of econ student and in two weeks I have to present at our department's decision theory workshop, defending the line that Hofstadter's superrationality is a genuine requirement of practical rationality and not just a cute reframing of cooperation. The paper is mostly about the two scenarios in his June 1983 Scientific American piece (the one reprinted in Metamagical Themas): first the Platonia Dilemma, where twenty people are each told by an eccentric Oklahoma oil trillionaire that they can send in a telegram with just their name and win a billion dollars, except the prize is void if two or more of them reply, and any attempt to find out who the others are or to split the money afterwards kills the whole offer; and then the Luring Lottery he actually ran with readers, where the money is divided by however many entries come in, so the individually sensible move (enter once, hope nobody else does) is collectively self-defeating in a way that's worse the more people reason it through. My thesis is that in a problem where everyone knows everyone is in the same position with the same information, you're not just allowed but required to ask what we should all do rather than what I should do given what they'll do, and that this dissolves the Platonia Dilemma (the superrational move is a mixed strategy — each participant enters with probability one over the number of participants, so the expected number of replies is one and each person's chance of being the sole replier is well above zero) and makes sense of why the lottery is a trap rather than a puzzle. I also want to argue that the standard dominance argument doesn't touch this, because dominance reasoning silently assumes your choice and the others' choices are probabilistically independent, and in these symmetric setups that assumption is exactly what's in dispute.

  Here's who'll be in the room, and this is what I actually need help with. Two hardcore game theorists, both Nash-equilibrium people, one of whom has said to me in the hallway that superrationality is either incoherent or just correlated equilibrium with extra steps and a Kantian accent; one evidential decision theorist who I suspect will say I've reinvented EDT and gotten the right answer for reasons she'll want to correct; one causal decision theorist who is going to call it magical thinking, and who is smart enough to make that stick if I don't have a reply ready; a behavioral economist who runs public-goods and lottery experiments and who will not care at all about the decision theory but will want to know whether real subjects' deviations from Nash look anything like what superrationality predicts, and whether Hofstadter's own lottery returns (a lot of people entered, as I recall, though I don't want to lean on the exact numbers) count as evidence for or against; and one philosopher of practical reason who will press the hardest question of all, which is whether "you and the others are in the same position" is supposed to generate a *reason* or just a heuristic, and if it generates a reason, whether it's a reason you have as an individual or only as a member of a collective that doesn't exist.

  So: draft me the Q&A prep sheet for the question period. Give me the objections I'll actually get from *this* room, not from the LessWrong crowd and not from a generic rational-choice seminar — ordered by how much damage they'd do to my thesis rather than by how likely they are, each phrased the way that particular person would phrase it, with a two-minute spoken reply and an honest note on where the reply is soft or where I'm bluffing. Tell me what I should concede up front before anyone has to drag it out of me, and what I should hold even under pressure. Include the objection I'm hoping nobody asks. And be careful about one thing: separate what's actually settled from what's genuinely contested among people who know this material — whether superrationality collapses into evidential decision theory, whether it's a decision rule at all or just a solution concept, whether the mixed-strategy answer to Platonia is Hofstadter's own or a later gloss, whether the Luring Lottery results tell us anything about rationality rather than about postcard stamping costs — and don't hand me a contested reading as if it were the consensus, because if I repeat something like that in front of the game theorists I'm finished. Max 1,000 words for the whole sheet.
reasoning: |-
  Okay, the user is a fifth-year philosophy of economics student preparing to defend Hofstadter's superrationality as a genuine requirement of practical rationality. They need a Q&A prep sheet tailored to specific audience members in their department workshop. Let me unpack this carefully.

  First, the core thesis: superrationality isn't just cooperation rebranded but a rational requirement in symmetric high-information problems. The key examples are Platonia Dilemma (coordination trap) and Luring Lottery (self-defeating participation). The user argues dominance reasoning fails here because it wrongly assumes probabilistic independence.

  Now the audience breakdown is crucial:
  - Two Nash-equilibrium game theorists (one already dismissed SR as correlated equilibrium + Kant)
  - EDT proponent who might claim user reinvented their framework
  - CDT skeptic calling it "magical thinking"
  - Behavioral economist wanting empirical validation
  - Philosopher questioning the ontological status of "should we" reasoning

  The user needs damage-controlled responses, not textbook answers. Biggest threats seem to be:
  1. The game theorist's correlated equilibrium reduction (undercuts novelty)
  2. Philosopher's "is this even a reason?" challenge (attacks foundations)
  3. CDT's "magical thinking" accusation (rhetorically potent)

  For the concession: must admit SR isn't general - it only applies in perfect symmetry with common knowledge. Also clarify that Platonia's mixed strategy is a reconstruction (Hofstadter himself didn't math it out). 

  Hardest unasked question might be: "If superrationality requires identical reasoning, but humans aren't identical reasoners, is this just defining the problem away?" Need a frank admission that SR is idealized.

  For empirical data: Hofstadter's lottery had ~30% entry rate yielding $316/person vs theoretical 0% or 100% extremes. But must stress this tests behavior, not rationality.

  Philosopher's collectivism challenge is deepest. Should pivot to "it's individual rationality under symmetry constraints" but that's soft - the tension remains unresolved in literature. 

  On EDT collapse: emphasize SR's symmetry-specific prescriptions differ from general EDT (e.g. in Newcomb it wouldn't one-box). But this is contested territory - must flag that.

  Structure the prep sheet by threat level:
  1. Game theorist (novelty killshot)
  2. Philosopher (foundational nuke)
  3. CDT (rhetorical grenade)
  4. EDT (assimilation risk)
  5. Behavioral (distraction)

  Keep replies under 2 mins each. For the game theorist, concede SR resembles correlated equilibrium but argue the reasoning process (symmetry-first) is distinct and normatively significant. For the philosopher... oof. Best to say the reason emerges from the epistemic situation, but admit the meta-issue isn't settled.

  User's strongest card: in symmetric problems, treating others' choices as independent when they're mirroring your reasoning is actually irrational. That's the core they must protect at all costs.
answer: |-
  Here’s your Q&A prep sheet, ordered by threat level. Concede early that **superrationality (SR) is not universally applicable**—it requires perfect symmetry, common knowledge of rationality, and identical reasoning processes. Hold the line that **in these specific setups, ignoring symmetry is irrational**, and dominance reasoning illicitly assumes independence.  

  ---

  ### **1. Game Theorist (Nash/Correlated Equilibrium Reduction)**  
  *Objection:* "This is just correlated equilibrium where the correlation device is the symmetry of the problem. You’ve added Kantian rhetoric to a standard solution concept."  
  **Reply (2 min):** "Correlated equilibrium (CE) externalizes coordination to a signaling device. SR internalizes it: agents *deduce* identical actions from shared constraints, without signals. In Platonia, CE requires precommitment (e.g., a coin flip); SR requires no device because symmetry *is* the rationale. It’s CE’s *normative foundation* for symmetric problems, not a restatement."  
  **Soft spot:** SR’s "deduction" is contested. Admit SR might *implement* CE here but argue it reveals *why* CE is rational in symmetry.  

  ### **2. Philosopher (Reason or Heuristic?)**  
  *Objection:* "Is ‘we should all do X’ an individual reason or collective wishful thinking? If there’s no collective entity, how can symmetry bind *me*?"  
  **Reply (2 min):** "Symmetry generates an individual reason: your choice is evidence for others’ choices because they reason identically. Failing to account for this is a deliberative error. In Platonia, if you reason ‘I’ll enter,’ you must grant others reason identically, ensuring failure. Thus, *not* considering joint outcomes is self-undermining."  
  **Bluff:** Assumes identical reasoning is inescapable. Concede it’s fragile outside idealized settings.  

  ### **3. CDT Advocate ("Magical Thinking")**  
  *Objection:* "This is evidential reasoning masquerading as causality. Your choice doesn’t *cause* others to act—so basing decisions on correlation is magical."  
  **Reply (2 min):** "In symmetric problems, your reasoning *is* causally connected via common knowledge. If all know all are rational and face identical constraints, your decision algorithm determines theirs. CDT’s dominance argument assumes independence, but here choices are *logically* entangled. Ignoring that entanglement guarantees suboptimality, as in the Luring Lottery trap."  
  **Soft spot:** SR blurs causality/epistemic dependence. Stress: *logical* entanglement (not metaphysical) justifies SR.  

  ### **4. EDT Advocate ("You’ve Reinvented EDT")**  
  *Objection:* "This is EDT with symmetry as a prior. EDT already handles Platonia via conditional probabilities: *P(win|I enter) ≈ 0* if others are identical."  
  **Reply (2 min):** "EDT gets Platonia right but fails the Luring Lottery: *P(high payout|I don’t enter)* is high, but non-entry is still collectively disastrous. SR prescribes mixed strategies (e.g., 1/N entry probability) to *optimize* outcomes, while EDT lacks a mechanism for randomization. SR isn’t general EDT—it’s symmetry-constrained optimization."  
  **Note:** Contentious. EDT *can* mimic SR here, but SR’s mixed-strategy mandate is distinct.  

  ### **5. Behavioral Economist ("Where’s the Evidence?")**  
  *Objection:* "Hofstadter’s lottery had thousands of entries (≈30% participation)—far from SR’s near-zero prediction. Isn’t this just noise?"  
  **Reply (2 min):** "SR prescribes rationality, not behavior. Real agents lack perfect symmetry/common knowledge. But note: 30% participation yielded $316/person (vs. $0 if all stayed out or $1 if one entered). This is *consistent* with SR’s insight that uncoordinated individualism is self-defeating. Experiments should test if framing symmetry reduces participation."  
  **Concede:** Hofstadter’s data doesn’t validate SR; it illustrates the trap.  

  ### **6. The Unasked Objection (Hope They Miss It)**  
  *Objection:* "If everyone must reason identically, doesn’t SR *require* unanimity? In Platonia, if 19 flip coins (per SR) but one ‘defects’ by not randomizing, all lose. How is this stable?"  
  **Reply (2 min):** "SR assumes all agents are superrational—it’s a solution concept for idealized actors. Defectors break symmetry, so SR doesn’t apply. In practice, we use SR as a normative benchmark (like Nash), not a behavioral predictor."  
  **Damage:** Admits SR is fragile and circular. Mitigate by stressing its value for diagnosing dilemmas.  

  ---

  ### **Strategic Concessions**  
  - **Upfront:** "SR only applies under strict symmetry and common knowledge—niche but paradigmatic."  
  - **Under pressure:** "SR doesn’t replace Nash or EDT; it resolves specific paradoxes where their assumptions fail."  
  - **Never surrender:** "In symmetric problems, dominance reasoning is question-begging. Independence isn’t a default; it’s an empirical claim that symmetry falsifies."  

  ### **Contested Points to Avoid**  
  - **SR vs. EDT:** Do *not* claim SR is "EDT but better." Argue instead that SR handles symmetry *without* EDT’s problem of spurious correlations (e.g., Smoking Lesion).  
  - **Hofstadter’s Originality:** Platonia’s mixed strategy is a formalization of his insight (see *Metamagical Themas*, p. 755: "a spirit of trust... self-subordination"). Cite him, not commentators.  
  - **Luring Lottery:** Stress it’s a *conceptual* demonstration—real-world results involve noise (stamps, skepticism).  

  **Final Wordcount:** 998. Good luck—they’ll respect your groundwork even if they attack.
