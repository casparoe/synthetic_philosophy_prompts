answer: |-
  ### Research Proposal: Partition-Relative Coherence under Cognitive Constraints  

  #### **Title**  
  Rationality in the Coarse-Grained World: A Formal Study of Partition-Relative Coherence and Costly Deliberation  

  #### **Abstract**  
  Standard coherence arguments (e.g., Dutch books, money pumps, representation theorems) for expected utility (EU) maximization assume agents can evaluate any prospect in a fine-grained algebra. This project challenges that assumption by formalizing *partition-relative coherence*: a model where agents have preferences defined only over coarse-grained prospect partitions, face costs to refine these partitions, and cannot access all options simultaneously. I will investigate whether EU maximization remains uniquely rational under these constraints, or if coherence arguments instead impose dynamic constraints on partition refinement. The project will (1) develop a formal framework for preferences over coarse algebras with deliberation costs, (2) define a cost-sensitive exploitation metric, and (3) test whether classic coherence arguments can be reconstructed. Outcomes will clarify rationality requirements for cognitively limited agents, bridging decision theory and formal epistemology.  

  ---

  ### **1. Research Question**  
  *Under what conditions do standard coherence arguments for EU maximization hold when agents operate with coarse preference partitions that can only be refined through costly deliberation? Specifically, does rationality require global EU maximization, or can agents satisfy a weaker condition—dynamic partition-relative coherence—where they avoid exploitation locally while violating EU axioms globally?*  

  The question decomposes into three sub-problems:  
  - **Formalization**: How to model an agent’s preference partition (a σ-algebra over prospects) and refinement costs (e.g., cognitive resources).  
  - **Exploitation**: How to define "exploitability" when adversaries must account for the agent’s coarse view and refinement costs (e.g., net losses after costs).  
  - **Coherence argument robustness**: Can money-pump or Dutch-book arguments be rebuilt in this setting? If not, what dynamic constraints on refinement (e.g., consistency under partition updates) replace them?  

  The null hypothesis is that coherence arguments collapse entirely, permitting rational but non-EU-maximizing agents. The alternative is that they transform into constraints on refinement sequences.  

  ---

  ### **2. Background and Motivation**  
  **Standard coherence arguments** posit that violating EU axioms (completeness, transitivity, independence) implies irrationality: agents can be exploited via Dutch books (incoherent bets) or money pumps (cyclic trades), or fail representation theorems. These arguments presuppose:  
  - **Fine-grained access**: Any prospect can be offered as a discrete, evaluable option.  
  - **Costless attention**: Agents instantly perceive all options and their relationships.  

  **Why existing positions leave the question open**:  
  - **Bounded rationality literature** (e.g., work on costly computation or rational inattention) acknowledges cognitive limits but does not systematically integrate them with coherence arguments. Models often assume EU maximization *after* accounting for costs, sidestepping whether coarse agents can evade exploitation *without* converging to EU.  
  - **Ambiguity and context-dependence research** (e.g., menu-dependent preferences) explores how choice sets affect valuations but neglects *dynamic partition refinement*. No framework formalizes how agents who start with coarse preferences avoid exploitation during refinement.  
  - **Formal epistemology on logical omniscience** addresses coarse belief partitions but not preferences. Parallel work in decision theory (e.g., "unawareness" models) focuses on unawareness of states, not costly refinement of prospect partitions.  

  This gap is significant: if real agents have bounded attention and incur deliberation costs, the normative force of coherence arguments may be overstated. For instance, an agent with intransitive coarse preferences might avoid money pumps by refusing to refine partitions when costs exceed exploit risks. Without a model of partition-relative coherence, we cannot assess whether rationality demands EU maximization or merely partition-consistent refinement.  

  ---

  ### **3. Methodology and Work Plan**  
  **Overarching approach**: Axiomatic modeling with dynamic choice frameworks. Key elements:  
  - **Agent model**: Preferences defined over a prospect partition $\mathcal{P}$. Refinement splits $\mathcal{P}$ into sub-partitions at cost $c > 0$.  
  - **Adversarial games**: An exploiter offers bets/trades; the agent accepts/rejects/refines $\mathcal{P}$ (paying $c$ if refining).  
  - **Exploit metric**: Net loss (monetary loss + refinement costs) exceeding a threshold.  

  **Month-by-Month Plan**:  
  1. **Months 1–2: Framework development**.  
     - Formalize a prospect space with a base partition $\mathcal{P}_0$.  
     - Define a cost function for refinement (e.g., linear in partition size increase).  
     - Axiomatize "partition-relative coherence": No Dutch book/money pump exists *within* any $\mathcal{P}_i$.  

  2. **Months 3–4: Static exploitation**.  
     - Test Dutch books: Can non-probabilistic agents avoid sure loss by refusing to refine?  
     - Simple case: Agent with coarse beliefs (e.g., "rain" vs. "no rain") ignores fine distinctions (e.g., "rain intensity").  

  3. **Months 5–6: Dynamic exploitation**.  
     - Model money pumps: Agent with locally transitive but globally intransitive preferences (e.g., $A \succ B$, $B \succ C$, $C \succ A$ under $\mathcal{P}_0$, but refinement reveals $A \sim C$).  
     - Simulate trade sequences; vary refinement costs to see if pumping is unavoidable.  

  4. **Months 7–8: Representation theorems**.  
     - Characterize "asymptotic coherence": Does repeated refinement force convergence to EU?  
     - Prove conditions where partition-relative preferences admit non-EU representations (e.g., lexicographic or ambiguity-sensitive).  

  5. **Months 9–10: Generalization and robustness**.  
     - Extend to stochastic choice and incomplete preferences.  
     - Test if results hold under alternative cost structures (e.g., diminishing returns to refinement).  

  6. **Months 11–12: Synthesis and paper drafting**.  
     - Compare outcomes across Dutch books, money pumps, and representation.  
     - Derive normative implications: Is global EU necessary, or is refinement rationality sufficient?  
     - Write fellowship report and draft journal paper.  

  ---

  ### **4. Feasibility and Failure Conditions**  
  **What would count as failure?**  
  - **Formalization failure (Months 1–2)**: If no tractable model incorporates refinement costs without trivializing exploitation (e.g., costs always dominate losses). *Mitigation*: Simplify cost functions (e.g., fixed per-refinement cost).  
  - **Negative robustness results (Months 3–8)**: If money pumps/Dutch books persist under all cost structures, confirming standard EU demands. *This is a valuable negative result*.  
  - **Overscoping (Months 9–10)**: If stochastic extensions derail focus. *Mitigation*: Prioritize deterministic cases.  
  - **Insufficient novelty**: If partition-relative coherence reduces to existing models (e.g., unawareness). *Mitigation*: Emphasize refinement dynamics.  

  **Honest scope assessment**:  
  - **Strengths**: The project builds on established techniques (dynamic choice models, adversarial games). The core formalization (Months 1–4) is feasible given my PhD training; negative results still advance the field.  
  - **Risks**:  
    - Deliberation costs may complicate exploitation metrics (e.g., net losses depend on arbitrary cost parameters).  
    - Money-pump reconstructions might require complex game trees.  
  - **Realism**: The one-year timeline is tight but viable. I will prioritize Dutch books and money pumps (Months 1–8) over representation (Months 9–10), ensuring core deliverables. Literature review is minimal due to prior expertise.  

  **Conclusion**: This project addresses a foundational gap by integrating cognitive constraints into coherence arguments. Success would redefine rationality for bounded agents; failure would clarify the limits of such constraints. Either outcome justifies the scope.  

  ---  
  *End of Proposal*
