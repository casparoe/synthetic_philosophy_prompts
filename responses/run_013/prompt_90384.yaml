  We are writing a two-page research proposal for a one-year fellowship. The project is at the intersection of decision theory and formal epistemology. The core idea challenges the standard coherence arguments (Dutch book, money pump, representation theorems) for expected utility maximization by introducing the idea of coarse-grained preferences, limited attention, and deliberation costs. The key question is whether the coherence arguments hold when we model an agent with a coarse algebra of prospects that can only be refined at a cost.

  We need the following sections:

  1. **Title and Abstract**: A concise summary of the project.
  2. **Research Question**: A precise statement of the question.
  3. **Background and Motivation**: Explain why existing positions leave the question open.
  4. **Methodology**: Month-by-month plan for the year.
  5. **Feasibility and Failure Conditions**: What would count as the project failing? Honest assessment of scope.

  We are not including a bibliography.

  Let's structure the proposal accordingly.

  ---

  **Title**: Partition-Relative Coherence: Rationality under Coarse-Grained Preferences and Costly Deliberation

  **Abstract**:
  Standard coherence arguments for expected utility maximization (e.g., Dutch book, money pump, representation theorems) presuppose that agents can evaluate any prospect in a fine-grained algebra of options. This project challenges that assumption by developing a formal framework for "partition-relative coherence", which accounts for agents with coarse-grained preference partitions, limited attention, and deliberation costs. We ask: Do coherence arguments still uniquely support expected utility maximization, or do they instead establish dynamic constraints on partition refinement? We will formalize partition-relative coherence, define an exploitation notion sensitive to deliberation costs, and test whether classic coherence arguments (money pump, Dutch book) can be reconstructed under these constraints. The outcome will advance our understanding of rational agency under realistic cognitive limitations.

  ---

  **1. Research Question**

  The central research question is: 
  *Under what conditions do the standard coherence arguments (Dutch book, money pump, representation theorems) for expected utility maximization hold when we model an agent whose preferences are defined only over a coarse algebra of prospects and who incurs costs to refine that algebra? Specifically, does the argument for expected utility maximization collapse, and if so, does it yield a dynamic constraint on partition refinement such that an agent can be locally coherent without being globally representable as an expected utility maximizer?*

  We will formalize an agent model with the following features:
  - Preferences are defined over a coarse partition of prospects (a "choice partition").
  - The agent can refine the partition (i.e., split a coarse prospect into finer sub-prospects) but at a deliberation cost.
  - The agent's preferences at a given partition are subject to coherence conditions (e.g., no Dutch book or money pump within that partition).

  We then ask:
  - Can we define a notion of "exploitation" that accounts for deliberation costs and choice-size thresholds?
  - Can we reconstruct the Dutch book or money pump arguments in this setting? That is, if an agent's preferences at a coarse partition violate the expected utility axioms, can they still be exploited (in a way that accounts for costs of refining the partition) or do the costs of refinement prevent exploitation?
  - What dynamic constraints on partition refinement (if any) are imposed by the requirement to avoid exploitation?

  ---

  **2. Background and Motivation**

  Standard decision theory (e.g., Savage, von Neumann-Morgenstern) establishes that an agent whose preferences satisfy certain axioms (completeness, transitivity, independence, etc.) must maximize expected utility. Coherence arguments (like the Dutch book and money pump) are used to show that violating these axioms leads to irrationality: the agent can be exploited (e.g., forced into a series of losing bets or trades) or holds inconsistent valuations.

  However, these arguments assume that the agent can be offered any prospect in the algebra as a salient, individually assessable option. This ignores two critical features of real agents:
  1. **Coarse-grained partitions**: Agents do not have preferences over every conceivable fine-grained prospect; rather, they group options into coarse categories (e.g., "a cup of coffee" without specifying the exact temperature or cup size) and only refine when necessary.
  2. **Deliberation costs**: Refining a partition (e.g., splitting "coffee" into "hot coffee" and "cold coffee") requires cognitive effort, time, and resources.

  Existing literature on bounded rationality (e.g., Simon, Rubinstein, and more recent work on costly deliberation) acknowledges cognitive limitations but has not systematically addressed how coherence arguments fare under such constraints. Some work (e.g., by economists on menu-dependent preferences) touches on context-dependent choice, but without a formal model of partition refinement. Similarly, work in formal epistemology on logical omniscience and bounded reasoning (e.g., by Garber, Hacking, and more recent computational approaches) addresses analogous issues in belief but not in preference.

  This gap leaves open the key question: Are coherence arguments robust to the introduction of coarse partitions and deliberation costs? If they are not, then the standard arguments for expected utility maximization may overstate the requirements of rationality. Instead, rationality might require only local coherence within a partition and a dynamic rule for refining partitions to avoid exploitation as new choices are presented. This project fills that gap by providing a formal framework to assess coherence arguments under realistic cognitive constraints.

  ---

  **3. Methodology and Work Plan**

  We propose a one-year project with the following month-by-month plan:

  **Months 1-2: Literature Review and Framework Formalization**
  - Review existing formal models of coarse-grained decision-making, attention, and deliberation costs (e.g., Bewley, Sims, Rubinstein, and recent work on rational inattention).
  - Formalize the agent model: 
    - Define a state space and a prospect space.
    - Represent the agent's choice partition (a sigma-algebra over prospects) and a cost function for refinement (e.g., a cost for splitting a partition cell).
    - Define preferences over the coarse partition and axioms for partition-relative coherence (e.g., no Dutch book within the current partition).

  **Months 3-4: Defining Partition-Relative Coherence and Exploitation**
  - Define a dynamic setting where an adversary can offer the agent choices (bets, trades) that may require partition refinement.
  - Formalize a notion of "exploitation" that accounts for deliberation costs. For example, an exploit might require that the net loss to the agent (after accounting for any costs incurred in refinement) exceeds a threshold.
  - Test this definition against simple cases (e.g., a money pump with three options, but the agent initially groups two options together).

  **Months 5-6: Reconstructing the Money Pump**
  - Focus on the money pump argument: if an agent has intransitive preferences at a coarse partition, can they be pumped out of money when refinement is costly?
  - Build a model where the agent can refine the partition (e.g., split a coarse option into finer ones) at each step of a sequence of trades, but each refinement costs.
  - Determine conditions under which the agent can avoid being pumped (e.g., by refusing to refine) or whether the exploit still occurs.

  **Months 7-8: Reconstructing the Dutch Book**
  - Similarly, address the Dutch book argument: if an agent has non-probabilistic beliefs (or non-expected utility preferences) at a coarse partition, can they be made to accept a set of bets that guarantees a loss?
  - Model a bookmaker who offers bets on events that may require the agent to refine their partition to see the inconsistency.
  - Investigate whether the agent can avoid the Dutch book by refusing to refine (and thus refusing some bets) and whether the cost of refinement changes the calculus.

  **Months 9-10: General Representation Theorems**
  - Explore whether we can derive a representation theorem for an agent who is coherent relative to a partition and a refinement strategy.
  - Characterize the conditions under which the agent's behavior is consistent with expected utility maximization in the limit (as the partition becomes infinitely fine) or whether it requires a different model (e.g., multiple priors or context-dependent utility).

  **Month 11: Synthesis and Writing**
  - Synthesize results across the three coherence arguments.
  - Refine the framework to unify the findings.
  - Begin drafting the fellowship report and a paper.

  **Month 12: Finalize and Disseminate**
  - Complete the fellowship report and a draft paper.
  - Prepare presentations for conferences (e.g., PSA, Philosophy of Science Association).

  ---

  **4. Feasibility and Failure Conditions**

  **What would count as failure?**
  1. **Formalization failure**: If the attempt to formalize partition-relative coherence and exploitation under deliberation costs leads to intractable models (e.g., no clean definition of exploitation that accounts for costs) or if the model becomes too complex to yield clear results.
  2. **Negative results**: If it turns out that the coherence arguments are robust (i.e., even with coarse partitions and deliberation costs, the agent is still exploitable unless they are globally expected utility maximizers), then the project's core hypothesis would be refuted. While this would be a negative result, it would still be a valuable contribution by showing the robustness of standard arguments.
  3. **Incompleteness**: If the project fails to address one of the three coherence arguments (money pump, Dutch book, representation theorem) due to time constraints, that would be a partial failure.

  **Honest assessment of scope**:
  The project is ambitious but feasible in one year. The main risk is the complexity of modeling deliberation costs and partition refinement in a dynamic setting. However, the plan is structured to start with simple cases (e.g., a three-state money pump) and build up. The student's background in formal methods (as a third-year PhD student in philosophy with a focus on formal epistemology and decision theory) provides the necessary technical skills. The project does not require new empirical work, so it is well-suited for theoretical research. The month-by-month plan is realistic if the student focuses on the core questions and avoids getting sidetracked by tangential issues.

  **Contingency plans**:
  - If the reconstruction of the money pump or Dutch book proves too difficult, we may focus on one of them and the representation theorem.
  - If the formalization of deliberation costs is problematic, we might use a simplified cost model (e.g., fixed costs per refinement).

  The project is likely to yield publishable results even if the core hypothesis is refuted, because the question is central to debates on bounded rationality and the foundations of decision theory.

