prompt: |-
  I'm a third-year PhD student in cognitive science — I run forecasting experiments, mostly on how people predict their own future opinions and tastes — and I've drifted far enough into the philosophy of it all that I need someone who actually knows the formal epistemology and decision theory literature to help me. So please take that role. Think it through slowly rather than giving me the first label that comes to mind, and start by brainstorming the candidates before you commit, because I'd much rather have a careful "it's roughly X, but the fit is bad in these three ways" than a confident wrong name. No need for citations or a reading list, by the way — I can't get at the library from here anyway. I'm after the concepts.

  Here's what keeps bugging me. It's the same shape in about four different places and I don't have a word for it.

  (i) I know that when the second half of the report arrives tomorrow I'll come out of it thinking the hypothesis is probably true. Right now I'm honestly 50/50. A friend in my reading group says I'm being incoherent: if I'm sure I'll end up believing it, I should just believe it now. I half agree and half think that's mad, and I can't say which half is right.

  (ii) Same shape, opposite pull: I know that after two glasses of wine I'll be far more confident my paper is any good. Nobody thinks that means I should be more confident now. But the only reason anyone ever gives is that the wine isn't evidence — and that seems to be precisely the thing in dispute.

  (iii) Same shape with plans: I'm sure that in a week, tired, I'll wish I hadn't booked the flight. So shouldn't I not book it? That feels different from (ii), but I couldn't tell you why.

  (iv) Same shape with disagreement: I'm told that after a long talk with a colleague I respect, I should end up roughly where I expect us to end up — and that I should already be there.

  So the rough shape is: if I'm confident about the attitude I'll hold after some process, there's pressure to hold it now, unless I think the process is a bad one. Does that have a name? I've definately got a feeling it's a known thing in formal epistemology and that some betting-style argument sits behind it, but also a feeling that the literature version is much narrower than what I've described.

  What I actually want from you:

  - The established concept (or concepts) closest to this, stated precisely, plus the strongest argument for it.
  - Where it breaks. I'm especially bothered by this: in both (i) and (ii) my future self disagrees with my present self, and in both cases the escape route is "your future self isn't to be trusted here" — but the only evidence I have that the future self is untrustworthy is that it disagrees with me. That can't be the whole story. How does the literature get out of that, or does it?
  - Why is the pressure always one-directional? Everyone says "then be more confident now"; nobody says "then make sure the wine doesn't happen". Those look like two ways of becoming coherent, and if the second is a cheat I want to know why.
  - Does the general shape have a name of its own, or does the analogy break between credences, tastes and plans? If it breaks, say exactly where.
  - If there's no name for the general shape, coin one, define it, and give me boundary cases: clearly in, clearly out, and the awkward ones — say, where the later attitude isn't a revision of mine but a replacement of it, or where I'll have forgotten the reasons I now have.

  Please don't just hand me a label. I want the carving: what the thing is, what it isn't, and where its edges are. British English throughout, please.
reasoning: |-
  Okay, the user is a third-year PhD student in cognitive science, focusing on forecasting experiments about how people predict their own future opinions and tastes. They've drifted into philosophy and need help with formal epistemology and decision theory concepts. They're frustrated with a recurring pattern in four scenarios and want a careful analysis rather than a quick label.

  First, I need to understand the core issue. The pattern is: if you're confident about a future attitude after some process, there's pressure to adopt that attitude now, unless the process is deemed "bad." The user provided four examples: belief updating after a report, confidence change after wine, planning regarding future tiredness, and disagreement resolution. They want the established concepts, where they break, why the pressure is one-directional, and if there's a general term for this shape.

  The key concept here seems to be the Reflection Principle from formal epistemology. Van Fraassen introduced it as a rationality constraint: your current credence should align with your expected future credence. So in case (i), if you expect to believe a hypothesis tomorrow, you should believe it now. But the user notes exceptions, like with wine, where future confidence isn't trustworthy.

  The strongest argument for Reflection is avoiding a sure loss in Dutch books. If you violate it, someone could exploit you with bets. But the principle breaks down when the future self has different information or is compromised, like impaired by wine. The literature handles this with Conditional Reflection, requiring that future credences are rational and based on more information.

  For the one-directional pressure: why "adopt now" instead of "prevent the process"? The literature likely sees current rationality as the default. Changing the future (like avoiding wine) might be practical, but epistemic rationality focuses on aligning beliefs now. The user's examples mix epistemic (beliefs) with practical (plans, tastes), which complicates things.

  In the taste example (iii), planning not to book a flight because future tired self will regret it involves sophisticated choice in decision theory. The user feels this is different from the wine case, and they're right because it's about consistent planning across time, not just belief updating.

  The general shape might not have a single name. Reflection applies to beliefs, but tastes and plans involve different principles like dynamic consistency. The analogy breaks when future attitudes aren't truth-aimed (tastes) or when the process isn't informational (wine impairing judgment). Cases where future selves forget current reasons also challenge Reflection.

  The user's deeper need is to understand the boundaries of these concepts to apply them to their research. They need precise distinctions between scenarios, why some exceptions work, and how to handle cases where future selves are unreliable without circular reasoning. They might also be exploring how people intuitively navigate these pressures in forecasting, which ties back to their PhD work.

  I should address each query point: identify Reflection and its variants, explain breakdowns (like compromised rationality), discuss one-directional pressure by separating epistemic and practical responses, and clarify where the analogy holds or breaks. Highlighting the role of information and rationality in each scenario will help them carve out the conceptual space. Also, note that in disagreement cases, Conciliationism uses similar reasoning but adds the requirement for peer recognition.
answer: |-
  Right. Let's carve this properly. You're describing a cluster of phenomena orbiting **doxastic commitment under anticipated belief change** – but the devil's in the distinctions. The core formal concept is **Reflection**, but it's narrower than your cases and has well-known escape hatches. Your intuition about betting arguments is spot-on. Here's the breakdown:

  1.  **The Established Concept: Reflection (and its Variants)**
      *   **Van Fraassen's Reflection Principle (RP):** Your current credence in proposition A, conditional on your future credence in A at time t being x, should itself be x. Formally: Cr(A | Cr_t(A) = x) = x.
      *   **Strongest Argument (The Dutch Book):** If you violate RP, a clever bookie can construct a series of bets you accept now and at t that guarantee you a sure loss, *no matter what happens*. This hinges on you *committing now* to certain betting dispositions at t based on your current expectations about your future credences. RP ensures consistency in your belief commitments across time.
      *   **How it fits your cases:**
          *   **(i)** Direct application. RP says: If you're *sure* your future credence will be high (say, Cr_t(H) = 0.9), then your current credence Cr_now(H) should be 0.9. Your friend is appealing to this principle (likely intuitively). RP seems to demand you believe it now.
          *   **(iv)** Also a direct application. The "conciliationist" argument in peer disagreement often implicitly relies on a Reflection-like idea: your expectation of where the *joint* deliberation will lead (a kind of anticipated future credence state, perhaps averaged or considered post-rational-discussion) should influence your current credence. The "should already be there" claim is pure RP.

  2.  **Where it Breaks (The Escape Hatches):**
      *   **The Crucial Condition: Rationality & Information.** The Dutch Book argument and RP *assume* your future self is (1) epistemically rational and (2) *at least as well-informed* as your current self (or has information your current self treats as legitimate evidence). This is the escape hatch.
      *   **Breaking it down:**
          *   **(ii) The Wine Case:** This is the canonical counterexample *against* a naive RP. Your future self under wine is *rationally compromised*. The wine isn't evidence; it's a *distorting factor*. You don't expect your future self to be *more* rational or *better* informed; you expect them to be *less* rational. RP doesn't apply. The "disagreement" isn't evidence of untrustworthiness *in itself*; it's *knowledge of the distorting cause* (the wine) that provides the independent reason for distrust. You *know* the process is irrational belief formation.
          *   **(i) The Report Case - The Catch:** Here's your core puzzle. If you *only* know "Future Self will believe H", but *don't* know *why*, is that sufficient for RP? **No.** The literature escapes via the rationality/information condition. Your confidence that the *report* will convince you implies that you expect the report to contain *new, legitimate evidence* processed *rationally* by your future self. You're not just predicting belief; you're predicting belief *based on expected rational response to new evidence*. This *licenses* applying RP. If you thought the report was *gibberish* but knew you'd be convinced anyway (say, due to hypnosis), RP wouldn't apply – just like the wine case. The "why" matters.
          *   **Avoiding Circularity:** The escape isn't *merely* "they disagree with me." It's "I have independent reason to believe the *process* generating their disagreement is epistemically defective (wine) or superior (report)." In (i), the independent reason is your *knowledge about the nature of the report* as evidence. In (ii), it's your *knowledge about the effect of alcohol*.
          *   **(iii) The Planning Case - A Different Beast:** Reflection primarily governs *beliefs* (credences). Regret about a booked flight concerns *preferences/values* (your future tired self's utility function applied to the outcome). This moves us into **decision theory** and **dynamic consistency**. The relevant principle here is **Sophisticated Choice** (as opposed to Naive or Resolute choice). Sophistication says: When making a plan now, you should anticipate your *future* preferences and actions *if you believe you will rationally act according to those future preferences*. If you're sure your tired future self will regret booking (i.e., prefers not to have booked), and you believe you can't/won't commit *now* to overriding that preference later, then Sophistication says: Don't book it. It feels different from (ii) because it's about *acting now based on predictable future action/preference*, not primarily about *belief updating*. The pressure ("shouldn't I not book it?") comes from avoiding a predictable future action (regret/inaction) that conflicts with your *current* overarching plan. The "bad process" is your own predictable future preference shift due to tiredness, which you can't control at the time.

  3.  **Why One-Directional Pressure? ("Adopt Now" vs. "Prevent Process")**
      *   **Epistemic vs. Practical Rationality:** RP and Dutch Books are about *epistemic* rationality – coherence of *belief*. They tell you how your beliefs *should relate* to each other across time for consistency. They don't directly tell you to *change the world* (prevent the report, avoid the wine). That's *practical* rationality.
      *   **The Default Focus:** The literature focuses on the *doxastic* commitment: "Given your beliefs about your future beliefs, what *should you believe now* to be coherent?" Changing the world to *avoid* having those future beliefs is a *different strategy* for achieving coherence. It's often (though not always) less direct or feasible.
      *   **Is 'Prevent the Process' a Cheat?** Not inherently, but it shifts the domain:
          *   *Epistemic Cheat?* In (i), refusing to read the report *would* prevent the belief change, but it would be *epistemically irresponsible* – you're avoiding evidence. RP governs belief coherence *given* your expectations about evidence and rationality. Avoiding evidence violates a different epistemic norm.
          *   *Practical Rationality:* In (ii), avoiding the wine *is* a perfectly rational practical response to prevent an anticipated irrational state. There's no epistemic norm demanding you *experience* distortions. In (iii), not booking the flight *is* the sophisticated practical response.
          *   **The Key Distinction:** The "adopt now" pressure arises from *epistemic* coherence arguments (Dutch Books) applied to *beliefs*. The "prevent the process" option is a *practical* strategy, sometimes epistemically sound (avoiding wine), sometimes epistemically dubious (avoiding evidence), and sometimes purely practical (not booking the flight to avoid future regret). The literature's focus is explaining the *doxastic* pressure. Preventing the process resolves the *symptom* (the anticipated future belief/state) but doesn't directly address the *doxastic inconsistency itself* highlighted by the Dutch Book.

  4.  **The General Shape: Name and Boundaries**
      *   **No Single Perfect Name:** The *strict* formal concept is **Reflection** (for beliefs). The broader phenomenon is **Anticipated Attitude Revision Pressure** or **Dynamic Self-Consistency Pressure**. The analogy *does* break across domains:
          *   **Credences (i, iv):** Core Reflection territory. Governed by epistemic rationality, Dutch Books, information/rationality conditions.
          *   **Tastes/Preferences/Confidence (ii):** Outside core Reflection. Governed by theories of rationality under distortion (e.g., sobriety as the "default rational state"), or shifting utilities. Pressure comes from recognizing irrationality, not coherence *per se*.
          *   **Plans/Actions (iii):** Decision theory territory (Sophistication). Governed by dynamic choice consistency over time with predictable preference shifts. Pressure comes from avoiding predictable suboptimal outcomes given your current perspective across time.
      *   **Boundary Cases:**
          *   **Clearly In (Reflection Applies):** (i) You expect to rationally update credence based on legitimate, anticipated new evidence (the report). (iv) You expect your credence to match the anticipated outcome of a rational peer discussion you plan to have.
          *   **Clearly Out (Reflection Doesn't Apply):** (ii) Future attitude induced by a known distorting factor (wine, hypnosis, severe fatigue). (Case where you know you'll forget crucial evidence *and why it was crucial* before reassessing).
          *   **Awkward / Depends:**
              *   **Forgotten Reasons:** You expect to believe H tomorrow, but *only* because you will have forgotten your current strong counter-evidence C. *If* you know you'll forget C *and* you know C is crucial and rationally defeating, then RP shouldn't apply – your future self is *less* informed. However, if you forget *why* C was important, or misremember it, the assessment gets messy. The condition requires your future self to be *better* or *equally* informed *in the relevant respects*. Forgetting crucial defeaters fails this.
              *   **"Replacement" not Revision:** E.g., You expect a brain implant tomorrow that will force you to believe H. This is clearly a distorting process – RP doesn't apply. The future attitude isn't *yours* in the relevant rational sense. The pressure might be practical (resist the implant!), not doxastic.
              *   **Anticipated Irrationality Without Distortion:** Suppose you know you have a cognitive bias that *will* irrationally boost your confidence in H tomorrow, even with no new evidence. *Should* you reflect that now? RP says *no* – the future self is irrational. Dutch Books might be escapable if you *know* about the bias and can plan around it (e.g., refuse bets tomorrow). This is deeply awkward and points to the limits of strict coherence arguments.

  **In Summary:**

  *   The core formal concept is **Reflection**, justified by Dutch Book coherence for beliefs.
  *   It **breaks** when the future self is expected to be irrational or *less* well-informed than the current self (Wine case). The escape relies on *independent knowledge* about the *process* causing the change, not mere disagreement.
  *   **One-directional pressure** ("adopt now") is the focus of *epistemic* coherence arguments (Dutch Books). "Prevent the process" is a *practical* response, sometimes rational, sometimes not, but addressing a different aspect.
  *   The **general shape** – pressure to align current attitudes with anticipated future ones – lacks a single perfect name. The **analogy breaks** between:
      *   *Credences* (Reflection applies under rationality/information conditions).
      *   *Tastes/Confidence* under distortion (Reflection doesn't apply; focus on non-distorted state).
      *   *Plans/Actions* with predictable preference shifts (Sophisticated Choice in decision theory).
  *   **Boundaries** are defined by the *rationality* and *information* conditions of the future self, and the *nature of the process* leading to the change (evidence vs. distortion vs. preference shift).

  Your instinct that the literature version (Reflection) is narrower is correct. The pressure you feel in all cases stems from a deep desire for *temporal coherence* in your agency – but the requirements for coherence differ fundamentally between believing, valuing, and acting. The wine case feels different because it's about *corruption*, not learning. The booking case feels different because it's about *acting strategically* across time against yourself. Report and disagreement feel similar because they're both about *evidential learning*. The carving lies in identifying the *source* and *rational status* of the anticipated change.
