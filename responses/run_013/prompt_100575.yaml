  For the second boundary case: if the model in one run doesn't use blurriness at all (maybe it uses another feature to achieve the same accuracy on the task), then it doesn't have a representation of blurriness. In the student's case, both runs have a representation of blurriness (they use it and it's causally necessary) but in different forms.

