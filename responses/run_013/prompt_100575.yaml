prompt: |-
  I'm a second-year PhD student in a lab that sits somewhere between comp neuro and ML, and there's a thing I keep running into that I can't tell is a real, named problem or just me being confused. We train the same architecture on the same data twice, only the random seed changes. Both hit basically the same accuracy. Then we go digging inside to find where the model's "representation" of some feature lives — take anything, say whether an image is blurry. In run A there's a little cluster of directions whose activity tracks blurriness, and if we ablate them the model basically stops caring about blurriness. In run B there's a completely different cluster, different units, different geometry, doing the same job — ablate it and again the behavior goes. So both runs seem to "represent" blurriness in the sense that the representation is there and it's causally load-bearing, but the two don't overlap at all and you can't line them up. And there's a second thing on top of it: sometimes the same unit seems to carry two totally unrelated features depending on what else is in the input, so it isn't even one-feature-per-unit. So when my advisor says "the model represents X," I want to ask, represents it according to which run? And if two physically different internal states are each sufficient for the same behavior, in what sense is one of them *the* representation? It feels like the word "representation" is doing work that the physics underneath doesn't definately license.

  I'm sure this is adjacent to stuff that already has a name — I half-remember "multiple realizability" from a philosophy class, and a systems-neuro friend said "degeneracy," and a stats friend said "non-identifiability," but none of those quite felt like the thing I'm pointing at. What I want isn't a bare label, it's the carving: is there an established concept for exactly this configuration (same function, many non-alignable internal encodings, each causally sufficient), and how precisely does it differ from each of those near-misses — where does the analogy break? If nothing fits, coin something, define it, and give me the edges: what would clearly NOT count as an instance. Please don't hand me a reading list, I just want you to think it through with me. Also, is there a reason people in interpretability seem to talk as if there's one canonical representation, or am I misreading them?

  At the very end, give me a short JSON block, nothing fancy, with these fields: nearest_concept (string), why_its_not_quite_that (string), other_close_concepts (list of strings), coined_term (string, or null if an established term already fits), one_line_definition (string), and two_boundary_cases (list of two strings, each a situation that looks similar but shouldn't count).
reasoning: |-
  We are given a scenario where the same model architecture trained on the same data with different random seeds leads to two different internal representations (for a feature like blurriness) that are both causally sufficient for the same behavior (i.e., if ablated, the behavior changes) but are not alignable (different units, different geometry). Additionally, units can be multifunctional (represent multiple features). The student questions the notion of a unique canonical representation and wonders about established concepts.

  The student mentions several near-miss concepts:

  1. **Multiple realizability**: This is a concept from philosophy of mind, where the same mental state (or function) can be realized by different physical states. It is often discussed in the context of functionalism. However, multiple realizability is typically about different physical substrates (e.g., brains vs. computers) or different systems, not variations within the same system (like two runs of the same model). In our case, the two realizations are from the same model architecture and training data, just different initializations. Also, multiple realizability does not necessarily address the non-alignability and the causal sufficiency in the context of interpretability.

  2. **Degeneracy**: In biology, degeneracy refers to the ability of structurally different elements to perform the same function. This seems very close! In neural systems, degeneracy is observed when different neural structures (or pathways) can produce the same functional output. However, degeneracy is often discussed in the context of biological robustness and evolution. The key point is that the same function can be achieved by different structures. The student's case fits: same function (representing blurriness) achieved by different internal structures (clusters of units). But note: degeneracy in biology might not specifically address the non-alignability and the fact that the same unit can play multiple roles (multifunctionality). Also, in the context of neural networks, degeneracy might be a good fit, but we must check if it is established.

  3. **Non-identifiability**: In statistics, a model is non-identifiable if different sets of parameters can lead to the same likelihood of the observed data. This is common in complex models. In our case, the two different internal representations both lead to the same input-output mapping (same accuracy). So non-identifiability is relevant. However, non-identifiability typically refers to the parameters of the model and doesn't necessarily address the causal sufficiency of a particular representation (like the blurriness cluster) or the interpretability aspect. Also, non-identifiability might be too broad because it can occur for many reasons (e.g., symmetries) and does not necessarily imply that the representations are non-alignable and multifunctional.

  The key features of the student's scenario are:
  - Two (or more) different internal configurations (non-alignable) that are each causally sufficient for the same feature representation and behavior.
  - The representations are not only different but also not easily mapped (non-alignable) and may involve multifunctional units.

  In the context of neural networks, this phenomenon is sometimes called **Representational Drift** or **Representational Shift** when observed across time or conditions, but typically that term is used in neuroscience for changes in neural activity patterns over time while maintaining the same function. However, the student's case is across different initializations (runs) and not over time.

  Another term that has emerged in machine learning interpretability is **Polysemanticity** (or polysemantic neurons) for the multifunctionality part (one unit having multiple unrelated features). But that doesn't capture the entire picture of having two entirely different sets of units for the same feature.

  A more comprehensive term that has been used in recent literature is **Rashomon Effect** (from statistics and machine learning) which refers to the existence of multiple models (or in this case, internal representations) that are equally good at explaining the data. But again, this might not capture the causal sufficiency and the interpretability aspect.

  However, the phenomenon described is becoming recognized in the interpretability community and is sometimes discussed under the umbrella of **Representation Diversity** or **Model Equivariance**.

  But let's consider: the student's scenario is about the same function being implemented by different internal structures that are not interchangeable by a simple transformation (like permutation symmetry) and that are causally sufficient. This is a specific kind of degeneracy in artificial neural networks.

  But note: the non-alignability is key. In neural networks, even if we permute the neurons, we get the same function and the representation is the same up to permutation. However, in the student's case, the representations are not just permutations of each other. They are fundamentally different in terms of which neurons are involved and how they are organized (geometry). Moreover, the multifunctionality adds complexity.

  Therefore, the established term that comes closest is **degeneracy**. However, we must note that degeneracy in neural networks is sometimes used to describe the phenomenon of different sets of weights leading to the same function, and it can include non-alignable representations. But in the student's case, we are looking at the representation of a specific feature (blurriness) within the network.

  Another term that has been used in the context of interpretability is **Superposition**, which refers to a single neuron representing multiple features (which is the multifunctionality part). But superposition does not directly address the existence of multiple non-alignable representations for the same feature.

  Alternatively, the entire phenomenon might be described as **Functional Equivalence with Representational Heterogeneity**. But that's long.

  In recent ML interpretability work, this is often called **Non-Unique Representations** or **Non-Convergent Representations**. However, I think the most precise established concept is **degeneracy** (as in biological systems) but applied to artificial neural networks.

  But let's see why the student's systems-neuro friend said "degeneracy" and why it might not feel quite right: degeneracy in biology often implies that the different structures are evolutionarily acquired and may serve as a backup. In neural networks, this happens due to the optimization landscape having many equivalent solutions. The analogy breaks in that the degeneracy in neural networks is due to the non-convex optimization and overparameterization, and it is not necessarily selected for robustness (though it may result in it). Also, the non-alignability and multifunctionality are inherent in the high-dimensional, distributed representations.

  Thus, I propose that **degeneracy** is the nearest concept, but we can refine it for this context.

  Alternatively, in the context of machine learning, this phenomenon is sometimes called **Mode Connectivity** or **Linear Mode Connectivity** (if the two solutions can be connected by a path of low loss), but that doesn't capture the representational aspect.

  Given that no single term perfectly captures it, and considering the above, I think **Representational Degeneracy** is a good coined term. But let's see if there's an established term.

  After a quick mental survey of recent literature (e.g., work on neural network interpretability, such as Olah's circuits, or the Lottery Ticket Hypothesis, etc.), I recall that this phenomenon is often discussed without a single agreed-upon term. However, **degeneracy** is used in systems neuroscience and is being adopted in ML.

  But note: the student's scenario has two aspects:
  (A) Multiple non-alignable representations for the same feature (blurriness) that are causally sufficient.
  (B) Multifunctionality of units (polysemanticity).

  The second aspect (B) is separable and is known as **polysemanticity**. The first aspect (A) is the core issue.

  Therefore, the main phenomenon in (A) is what we are focusing on.

  **Conclusion on terminology**: The nearest established concept is **degeneracy** (as suggested by the systems-neuro friend). However, to be precise, we can call it **Functional Degeneracy in Representations** or simply **Representational Degeneracy**.

  Why the other near-misses are not quite:

  - **Multiple realizability**: This is at a higher level (across different physical systems) and is more philosophical. It doesn't capture the non-alignability and causal sufficiency in the same model architecture.
  - **Non-identifiability**: This is a statistical term that focuses on the inability to uniquely determine parameters from data. While related, it doesn't emphasize the internal causal structure and the interpretability aspect.

  Now, why do people in interpretability often talk as if there's one canonical representation? There are several reasons:
  1. **Practicality**: It's easier to describe and interpret one representation.
  2. **Historical precedent**: Neuroscience often seeks canonical circuits (e.g., in simple organisms).
  3. **Lack of awareness**: Until recently, the extent of representational diversity in neural networks was not fully appreciated.
  4. **Focus on invariance**: Some interpretability methods (e.g., feature visualization) might show consistent patterns across runs, but that doesn't mean the underlying representation is the same.

  But the student is correct: the physics (or the optimization) does not uniquely determine the representation. So the word "representation" might be used in a functional sense (the model has a representation of blurriness) without committing to a unique physical instantiation.

  Finally, the JSON block:

  - nearest_concept: "degeneracy"
  - why_its_not_quite_that: "Biological degeneracy often implies evolutionary backup systems, whereas in neural networks it arises from optimization in overparameterized spaces and may not be selected for robustness."
