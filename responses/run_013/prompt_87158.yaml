       - *Twist change*: With two conditionals, this converges to the same posterior as Leaf 3 and Leaf 4 (RS = 0.5, BT = 0.5).  
     - *No clear proposition (or other)* → **Leaf 2: Evidence is not propositional; no Bayesian update applies**.  
       - *Awkward commitment*: Ignores the evidence entirely, leaving RT possible despite the message ruling it out.  
       - *Twist change*: None (still no update).  

  3. **Should the evidence directly constrain conditional probabilities?**  
     - *No* → **Leaf 2: Evidence is not propositional; no Bayesian update applies** (same as above).  
     - *Yes* → Go to 4.  

  4. **Should the prior marginal probabilities for red/blue territory be preserved?**  
     - *Yes* → **Leaf 3: Preserve prior over red/blue; set P(second|red) = 1 (minimize relative entropy)**.  
