       - *Twist change*: With two conditionals, this forces RS = 0.5, BT = 0.5 (matches Leaf 1 and Leaf 4).  
     - *No* → Go to 5.  

  5. **How should the probability mass from ruled-out states (e.g., red third) be redistributed?**  
