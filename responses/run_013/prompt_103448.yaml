answer: |-
  ## Commencement Address: The Weight of What We Carry

  [Adjust microphone, look out at the small gathering – graduates in their awkward finery, proud families, weary but sharp-eyed faculty]

  So. They asked the novelist to give the speech. And the novelist, being constitutionally incapable of leaving well enough alone, immediately thought: *What story do they need?* Not the one they *expect*, maybe. Because you’ve heard that one already, haven’t you? The one about the dream, clutched tight against all odds? The one where persistence is always noble, and quitting is always failure?

  I’ve been writing novels for over twenty years. I believe fiercely in the power of story, in the necessity of this strange, often solitary work you’ve chosen. But I’m also here to tell you that the narrative of relentless, unquestioning persistence? It’s incomplete. It’s a fairy tale that ignores the brutal math of a life.

  We all know the textbook economics lesson: the sunk cost fallacy. The money spent, the time invested, the years poured into something… it’s gone. Water under the bridge. It shouldn’t weigh on your decision about what comes next. Only the future potential matters. Logically? It’s airtight. You stand at a crossroads, you look only forward. The past is spent currency.

  I believed this. I still *want* to believe it. It’s clean. Efficient. It sounds like wisdom.

  Then why is it so incredibly hard to live by?

  They asked me partly because I have a very personal, very expensive piece of sunk cost sitting on my shelf. A novel. It took nine years. Nine years of wrestling sentences in the dark, of characters who felt more real than my neighbors, of plot twists that unraveled whole drafts, of moments where the sheer weight of the thing nearly crushed me. It sold… modestly. Let’s be kind. It did not set the world on fire. By the cold calculus of sunk costs? Nine years for a quiet thud? Objectively, a terrible return on investment. Logically, I should stand here and tell you, “Know when to walk away! Cut your losses!”

  But I can’t. Not honestly. Because even now, looking back, I can’t bring myself to call those nine years a *mistake*.

  [Pause, let that hang]

  Why? That’s the knot I want to pick at with you today. Because I think it’s the knot you’ll be wrestling with soon enough, if you aren’t already.

  Is it just stubbornness? Ego? The inability to admit defeat? Maybe sometimes. But I think there’s something more. Something the spreadsheet misses.

  Here’s a scene from that book. [Invented detail - adapt as needed] Imagine a character, let’s call him Leo. Leo’s spent years trying to rebuild a relationship with his estranged father, a man obsessed with restoring a derelict wooden schooner in his backyard. The ship will never sail. It’s rotting. Leo knows this. One late afternoon, Leo finds his father passed out cold beside the hull, a rusted chisel still in his hand. Leo should walk away. Call the scrap yard. It’s the rational choice. Instead, he picks up the chisel. He starts scraping at the barnacles encrusting the keel. It’s pointless. It’s backbreaking. The light is failing. But in that moment, scraping that useless wood, Leo isn’t thinking about the ship sailing. He’s thinking about the texture of the wood under the blade, the smell of salt and decay, the weight of his father’s head resting against the hull earlier. He’s honoring something – not the *ship*, but the sheer, stupid, human *commitment* to the thing. The years his father put in weren't just wasted time; they were evidence, written in sweat and splinters, of what the old man actually valued, however misguided. Leo scraping isn't rational. It's human. Deeply, irrevocably human.

  That’s the pushback against pure sunk-cost logic. The years you’ve already spent? They aren’t just dead weight. They are data points. They tell you something crucial about yourself. *This mattered enough to you to spend precious years of your one wild life on it.* That’s significant. Ignoring that completely is like ignoring your own fingerprint.

  Sometimes, sticking with a thing *because* you’ve already stuck with it isn't just fallacy; it’s a way of holding yourself to a commitment you might otherwise cleverly talk yourself out of. Writing a book, mastering a craft, building a life in the arts – these aren't stock portfolios. They are tangled up with who you *are*. Abandoning them isn't just shifting resources; sometimes it feels like abandoning a piece of your own identity. That *is* a cost. A profound one the spreadsheet doesn’t see. It’s the cost of becoming someone else.

  So where does that leave us? Trapped between cold logic and the messy truth of our hearts? Between the spreadsheet and the barnacle-encrusted keel?

  [Lean in slightly]

  I think it leaves us asking a much harder, more vital question than “Should I quit or persist?” It leaves us asking: **“Why am I persisting?”**

  Is it because you’re terrified of admitting the time was wasted? That’s the sunk cost fallacy talking. Run.
  Is it because you genuinely cannot imagine not doing this thing? Because the work itself, even when it’s agony, feels like breathing? Because it’s how you make sense of the world, or yourself? *That’s* the data of your past investment speaking. Listen.
  Is it because you’re one page from the end of something truly great, and fear is the only thing stopping you? Push through.
  Is it because you’ve been grinding for a decade on something that stopped feeding your soul years ago, and the only thing keeping you going is the ghost of those past years? Have the courage to lay it down.

  The past investment doesn't get to *dictate* your future. But it gets to *inform* it. It gets to whisper in your ear about what truly holds meaning for you. Your job is to listen critically, ruthlessly, honestly.

  To the graduates: You stand at the threshold. You’ve paid a cost to be here – time, money, effort, doubt. That cost is sunk. It buys you nothing tomorrow. Don’t chain yourselves to it out of obligation. But… *pay attention* to what that cost reveals. What did sacrificing for *this* tell you about what you value? Chase *that* value into the future, whether it leads you deeper into the world of words or somewhere else entirely. Be brave enough to abandon a project, but never abandon the truth of what it taught you about yourself.

  To the families: Thank you for supporting these wonderful, often perplexing people. Their path won’t be linear. Their costs may seem bewildering. Please understand: sometimes the most irrational-seeming persistence isn’t stubbornness; it’s fidelity to a deep, hard-won understanding of self. And sometimes, the wisest quitting isn’t failure; it’s liberation.

  My nine-year novel? It’s on the shelf. It didn’t change the literary landscape. But it changed *me*. It taught me depths of patience I didn’t know I had. It taught me about obsession, about structure collapsing and rebuilding, about the sheer, terrifying vulnerability of putting something you love into the indifferent world. That knowledge? That forged-in-the-fire understanding of my own capacity and limits? That’s not sunk. That’s carried forward. That’s part of the toolkit for whatever comes next.

  So go. Write. Create. Build. And when you find yourself facing the weight of all you’ve already spent – time, heart, years – don’t just dismiss it as sunk cost. Interrogate it. Ask it what it reveals about you. And then, with that hard-won self-knowledge as your compass, make your choice for the future. Choose not out of fear of wasted time, but out of fidelity to what truly matters.

  Persist. But know *why*.

  Congratulations.

  [Step back, nod]
