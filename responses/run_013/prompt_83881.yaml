  The real contribution? It visualises what Hofstadter struggles to convey abstractly: how higher-level patterns (emotions' choices) constrain lower-level dynamics (console operations) without overriding physics. When Sadness succeeds where Joy fails, it demonstrates downward causation via interface design. 

