  I'm a second-year graduate student in philosophy, currently in a seminar on reference and singular thought, and I'm working through Frege's "On Sense and Reference" (1892) slowly, trying to follow the argument rather than memorize the standard summary. I can recite the moral — sense is the mode of presentation, reference is the object, the two "stars" share a reference but not a sense — but it's the very opening of the paper, where Frege is supposedly earning that distinction, that defeats me, and I'd like a close reading rather than a general gloss. I'd be grateful if you'd answer as someone who has taught this paper many times and is good at walking students through the details of the text, without smoothing over the parts that are genuinely obscure. Before you write the sections proper, please spend a few sentences laying out the main interpretive options you see for the passage below, so I can see the lay of the land, and then commit to the reading you think is best.

  Here is the passage I keep re-reading:

  "Equality gives rise to challenging questions which are not altogether easy to answer. Is it a relation? A relation between objects, or between names or signs of objects? In my Begriffsschrift I assumed the latter. The reasons which seem to favour this are the following: a = a and a = b are obviously statements of differing cognitive value; a = a holds a priori and, according to Kant, is to be labeled analytic, while statements of the form a = b often contain very valuable extensions of our knowledge and cannot always be established a priori. The discovery that the rising sun is not new every morning, but always the same, was one of the most fertile astronomical discoveries. Even today the identification of a small planet or a comet is not always a matter of course. Now if we were to regard equality as a relation between that which the names 'a' and 'b' designate, it would seem that a = b could not differ from a = a (i.e. provided a = b is true). A relation would thereby be expressed of a thing to itself, and indeed one in which each thing stands to itself but to no other thing. What is intended to be said by a = b seems to be that the signs or names 'a' and 'b' designate the same thing, so that those signs themselves would be under discussion; a relation between them would be asserted. But this relation would hold between the names or signs only in so far as they named or designated something. It would be mediated by the connexion of each of the two signs with the same designated thing. But this is arbitrary. Nobody can be forbidden to use any arbitrarily producible event or object as a sign for something. In that case the sentence a = b would no longer refer to the subject matter, but only to its mode of designation; we would express no proper knowledge by its means. But in many cases this is just what we want to do. If the sign 'a' is distinguished from the sign 'b' only as object (here, by means of its shape), not as sign (i.e. not by the manner in which it designates something), the cognitive value of a = a becomes essentially equal to that of a = b, provided a = b is true. A difference can arise only if the difference between the signs corresponds to a difference in the mode of presentation of that which is designated. Let a, b, c be the lines connecting the vertices of a triangle with the midpoints of the opposite sides. The point of intersection of a and b is then the same as the point of intersection of b and c. So we have different designations for the same point, and these names ('point of intersection of a and b', 'point of intersection of b and c') likewise indicate the mode of presentation; and hence the statement contains actual knowledge.

  It is natural, now, to think of there being connected with a sign (name, combination of words, letter), besides that to which the sign refers, which may be called the reference of the sign, also what I should like to call the sense of the sign, wherein the mode of presentation is contained. In our example, accordingly, the reference of the expressions 'point of intersection of a and b' and 'point of intersection of b and c' would be the same, but not their senses. The reference of 'evening star' would be the same as that of 'morning star', but not the sense."

  My specific puzzle is this. Frege's complaint against the "relation between objects" view seems to be that if "a = b" is true, the relation it expresses holds of a thing to itself, so "a = b" could not differ from "a = a" — and yet the two obviously differ in "cognitive value." But the difference in cognitive value looks like a fact about us, about how a sentence is grasped, not a fact about the relation expressed; so why isn't the defender of the object view entitled to reply: yes, the relation is the same, but the sentences carry different information for a thinker, and that's all the difference there is? I also suspect there are two or three separate complaints tangled together in that paragraph — one about triviality, one about arbitrariness ("Nobody can be forbidden to use any arbitrarily producible event or object as a sign for something"), and one about the sentence no longer being about its subject matter — and I want to know whether these are really distinct and whether they're meant to work together. A classmate suggested the whole thing is just the old paradox of analysis in a new dress (how can a correct analysis be both true and informative?), and I can't tell whether that framing illuminates the passage or distracts from it.

  Please write your response in the following sections, in this order and roughly these lengths: (1) "Plain restatement," about 200 words, setting out the argument of the passage as straightforwardly as you can; (2) "Sorting out the objections," about 250 words, on whether the triviality complaint, the arbitrariness complaint, and the "not about the subject matter" complaint are one argument or several; (3) "Why the psychological reply fails (or doesn't)," about 250 words, addressing my objection above and my classmate's paradox-of-analysis comparison; (4) "The move to sense," about 200 words, on how the closing sentence about the mode of presentation is supposed to do the work; and (5) "A check on my understanding," about 100 words, giving me one small test case or question I can use to see whether I've actually got it.
