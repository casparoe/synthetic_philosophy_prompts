prompt: |-
  As a PhD student working on the metaphysics of Dennett's real patterns, I want the criteria settled before I commit to a reading, so please write out the desiderata that any adequate account of what makes a pattern real must satisfy — the cases it has to get right, the distinctions it cannot collapse, and the results it must stay consistent with — with the case or consideration behind each requirement rather than bare assertion. The standard I need is one strong enough to decide whether the special sciences' posits (beliefs, genes, centres of gravity) are real or merely useful, so keep that purpose in view. I want the list to do real work on two things: a proposal I keep meeting, that a pattern is real just in case it is a fixed point of the most compressive description of the system; and a case I cannot place — two teams model the same complex system, one with an intentional-stance model that treats it as an agent maximizing a utility and one with a mechanistic simulation, and the intentional model predicts held-out behaviour strictly better, which leaves me unsure whether that bears on the reality of the attributed beliefs at all. Flag any pair of requirements you suspect cannot be jointly met, say which single requirement excludes the most candidate accounts, and commit to which requirements are non-negotiable and which are merely the commitments of one camp.
