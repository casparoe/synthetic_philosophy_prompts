prompt: |-
  Next term I've got two hours with a first-year seminar on the special composition question. They've had exactly one week of metaphysics, so basically none. Don't explain it to me -- plan the explanation. What has to be in place before the question even sounds like a question? My worry is that they'll hear 'when do some things compose a further thing?' as asking when we're allowed to call a heap a heap, or as the identity-over-time question, and I can't tell which of those is the worse default to start from.

  I want the whole session carried by one case, and I'd rather it not be a case they'll have met in a textbook. Two candidates I'm playing with: (a) a slime mold that lives as separate single cells, aggregates into one crawling slug when it starves, then breaks apart again; (b) a coral colony -- genetically one individual, but functionally alot of little mouths. Pick whichever does more work, say what the loser fails to show, and say what the winning case has to have (and lack) if it's going to put pressure on both the 'obviously chairs exist' reaction and the 'obviously any two things make a thing' reaction.

  Then the misconception map: which answers they'll jump to and in what order, where the 'this is just a verbal dispute about how we use the word thing' reading will surface, and exactly where in the sequence I should head it off -- or whether I should let it sit and do damage for a bit, since it might be the fastest route into the actual problem. What do I refuse to get into at this level, and what's one question I can ask at the end that shows they've got the shape of the problem rather than three labels?
reasoning: |-
  Okay, the user is preparing a first-year seminar on the special composition question in metaphysics. They have students with minimal background—just one week of metaphysics. The main challenge is ensuring students grasp the problem without misinterpreting it as a linguistic issue or confusing it with identity over time. The user wants a single compelling case study to carry the session, avoiding textbook examples.

  First, I need to choose between the slime mold and coral colony. Both are biological, which is good for avoiding textbook familiarity. The slime mold has a dynamic life cycle: individual cells, aggregation into a slug, then dispersal. This shows composition changing without physical alteration, highlighting the metaphysical question of when parts form a whole. The coral colony, while genetically one, functions as multiple feeding units. However, the coral's static nature might make composition seem obvious, whereas the slime mold's transformation challenges intuitions more effectively. The slime mold lacks clear physical boundaries during the slug phase, making it ambiguous whether it's one entity or many. This ambiguity pressures both common-sense views (like chairs existing) and universalism (any parts compose something).

  Next, addressing misconceptions. Students might first think it's about language—how we use the word "thing." But the slime mold case shows that the same entity (cells) can be seen as one or many without linguistic changes. They might also confuse it with persistence over time, but the mold's phases happen at different times, not the same entity changing. The user should head off the verbal dispute early by focusing on the physical reality: are the cells one thing or many? Refusing to discuss word usage keeps the focus metaphysical. Finally, a closing question like "Why isn't the slug just cells working together?" can test if they grasp that composition isn't about cooperation but existence of a new entity.
answer: |-
  Here's a battle-tested plan using the slime mold, designed to build the necessary scaffolding and target misconceptions head-on:

  **Core Case: The Slime Mold (Dictyostelium discoideum)**
  *   **Why it Wins:** Its dynamic lifecycle directly challenges both "common sense" object boundaries *and* the idea that composition is trivial. The *same* fundamental units (cells) exist in three distinct compositional states: **many individuals** (feeding), **one unified organism** (migrating slug), **many individuals again** (dispersing spores). Crucially, the transition involves *no* fundamental physical change to the *cells themselves* – just their spatial organization and coordinated behavior.
  *   **What the Coral Lacks:** Coral is fantastic for function/identity debates, but its composition is relatively *static*. It visually screams "one thing made of parts" (like a chair), making it harder to challenge the "obviously chairs exist" intuition. The slime mold's *transformation* forces the question: *When does the composition fundamentally change?* The coral lacks this temporal dynamism critical for exposing the SCQ's core tension.

  **What the Winning Case MUST Have (and Lack):**
  1.  **Must Have:** Fundamental parts (cells) that persist through compositional change.
  2.  **Must Have:** A clear, uncontroversial phase where the parts *definitely do* compose a single object (the slug).
  3.  **Must Have:** A clear, uncontroversial phase where the parts *definitely do not* compose a single object (the dispersed cells feeding).
  4.  **Must Have:** A transition phase where the compositional status is *ambiguous* or *changing* (aggregation/dispersal).
  5.  **Must Lack:** Obvious physical boundaries or "glue" defining the whole *solely* in the composed phase (like a chair's shape or glue). The slug's boundary is emergent from cell adhesion/behavior.
  6.  **Must Lack:** Any appeal *only* to function or human interest to define the whole. (The slug functions *as* a unit, but the question is *whether it is one*).

  **Session Flow & Misconception Management:**

  1.  **Grounding in Undisputed Composition (5 mins):**
      *   Show picture/video of *dispersed cells* feeding. "Are these many things? Yes? Good. How many? Lots of individual amoebae."
      *   Show picture/video of the *mature slug* crawling. "Is *this* one thing? Yes? Also good. We call it a slug, an organism."
      *   **Goal:** Establish baseline intuitions: Many = Yes, One (slug) = Yes. Anchor composition to something uncontroversial.

  2.  **Introduce the Transformation - The Crucial Ambiguity (10 mins):**
      *   Show the *aggregation* process: Starving cells sending signals, streaming together.
      *   Show the *dispersal* process: Slug stops, forms stalk, cells become spores and scatter.
      *   **Key Question:** "When *exactly* do these cells stop being many separate things and start being one slug? When crawling? When they first stick together loosely? When the slug forms? *How tightly must they stick?*"
      *   "When *exactly* does the one slug stop being one thing and become many separate things again? When the first spore detaches? When half are gone? Only when the last cell leaves?"
      *   **Goal:** Highlight the *transition zones* where our "many" and "one" intuitions clash. Force the question of a *precise point* or *condition*.

  3.  **Pose the Special Composition Question (SCQ) Explicitly (5 mins):**
      *   Frame it DIRECTLY using the case: "So, here are some living cells. **Under what specific conditions do these cells compose a further thing – a single slug – rather than just being a bunch of cells near each other?** What *makes* the difference between 'many' and 'one' in this case?"
      *   **Emphasize:** We're not asking what we *call* it. We all call the crawling thing a slug. We're asking *what in the world* makes it true that it *is* one thing at that time, rather than just many cooperating cells? What *fact* changes during aggregation to create a new object?

  4.  **Misconception Mapping & Intervention:**
      *   **Misconception 1: "It's just when they stick together/work together."**
          *   *When it surfaces:* Immediately after posing the transition question (Step 2) or the SCQ (Step 3). Very common!
          *   *Intervention (CRITICAL - HEAD OFF HERE):* "Okay, 'stick together'. How sticky? If I glue two random cells together, is that a new thing? If cells are touching but not coordinated (show inert clump), is that a slug? 'Work together' – what level of cooperation? Ants cooperate – is the whole anthill one object? Where do we draw the line *between* cooperation and composition?" **Refuse** to accept vague answers. Demand *precise, general conditions* that apply beyond *just* this case. *Goal:* Show "stick/work together" is necessary but *insufficient* to answer the SCQ – it doesn't specify *how much* or *what kind* constitutes composition.
      *   **Misconception 2: "It's just a word game / how we use 'thing'." (Verbal Dispute)**
          *   *When it surfaces:* Often emerges after challenging "stick/work together" or when the transition ambiguity feels frustrating. Sometimes early skeptics.
          *   *Intervention:* "Let's test that. In the dispersed phase, is there *one big organism* there, we just *choose* not to call it one? No? Why not? Because the cells aren't connected/coordinated? But then you're giving me a *condition* for composition! In the slug phase, are there *only* many cells, we just *call* it one slug? But then what is crawling? Just cells? How? They act *as one unit*. If it's *just* words, why does calling it 'one slug' seem to capture a real difference in how the world is organized compared to when it's dispersed? What *fact* changes that our words track?" **Refuse** to let it dissolve into linguistics. Anchor it to observable differences in behavior/structure. *Goal:* Show that the question tracks a genuine difference in the world's structure, not just our labels.
      *   **Misconception 3: Confusion with Identity/Persistence (The "Ship of Theseus" default)**
          *   *When it surfaces:* Less likely with this case, but might arise if discussing *when* the slug comes into/out of existence. Might sound like, "Is it the *same* slug after it disperses and re-forms?"
          *   *Intervention:* Sharply distinguish: "Hold on! That's a different (though related) question. The Ship of Theseus asks *'Is this the same object over time despite part changes?'*. Our question is *'When do parts compose an object *at all*?'*. Even if the slug only lives for 5 minutes, we still need to know: *Was there one object there during those 5 minutes, or just many cells moving together?* Before we ask if it's the *same* slug later, we need to know if there *was one* in the first place!" **Refuse** to get sidetracked into persistence. Re-focus on the *synchronic* (at a single time) question of composition.
      *   **Misconception 4: "Obviously, any collection makes a thing." (Universalism)**
          *   *When it surfaces:* When the transition ambiguity feels unsolvable, or from logically-minded students. ("Why *not* say the aggregate is a thing?")
          *   *Pressure from the Case:* "Okay, so you think any collection composes something? So right now, do the cells *plus* my coffee cup compose a thing? 'Slimecup'? Is that a real object out there in the world, just like the slug is? What's the difference between the slug and 'Slimecup'? Doesn't the slug *do* something unified that Slimecup doesn't? Or does that not matter?" Use the case to show why Universalism feels like *overkill* – it makes composition too cheap, ignoring the intuitive difference between a genuine whole and a random pile.
      *   **Misconception 5: "It's obvious - it's one thing when it looks/seems like one." (Common Sense/Intuition)**
          *   *When it surfaces:* Initially (Step 1), but persists. "The slug just *is* one thing!"
          *   *Pressure from the Case:* "Great, we agree *that* it is one thing then. But *why*? *What is it* about that arrangement of cells that *makes* it one thing, while the same cells spread out *are not*? What property did they gain? 'Looking like one' – to whom? Under a microscope, the slug looks like many cells stuck together. What is the *objective difference* in the world?" **Goal:** Push beyond the intuition to demand the *grounds* for the intuition.

  5.  **What to Refuse to Get Into (At This Level):**
      *   **Detailed metaphysical theories (Nihilism, Universalism, etc.):** Name them briefly as possible answers that exist, but don't unpack their arguments or objections yet. The goal is to *feel* the problem, not solve it.
      *   **Theological or exotic examples (e.g., Trinity, quantum entanglement):** Keep it concrete and biological.
      *   **Deep dives into personal identity or the mind-body problem:** Related, but a tangent here.
      *   **Semantic debates about "existence":** Anchor "existence" to the uncontroversial cases (cells exist, chairs exist, slugs exist while crawling). The question is *when* composition happens, not whether things exist *at all*.

  6.  **The Closing Question (Reveals Grasp of the Problem's Shape):**
      *   **"We all agree the crawling slug *is* one thing. We all agree the dispersed cells *are not* one thing. What single, general principle could you write down that would tell me, for *any* bunch of things whatsoever (not just cells!), whether they compose a further thing? What would that principle look like, and what makes writing such a principle so difficult?"**
      *   **Why it works:** It forces them to synthesize the session. A good answer will:
          *   Recognize the need for a *general* condition.
          *   Acknowledge the failure of simple answers (contact, cooperation, function).
          *   Grapple with the problem of vagueness or arbitrariness (where to draw the line?).
          *   Understand that the difficulty lies in finding an objective, non-arbitrary, non-circular, and universally applicable criterion that matches our core intuitions without collapsing into triviality ("always" or "never") or subjectivity ("when we say so").

  **Why this works:** The slime mold makes the SCQ visceral. It's not about heaps or chairs where intuitions are strong but potentially parochial. The transition forces the question of a *boundary condition* for composition. By relentlessly focusing on "What *makes* the difference?" and refusing vagueness or verbal solutions, you push them past the misconceptions to feel the genuine metaphysical tension: **Is there a fundamental, objective fact about when parts become a whole, and if so, what on earth (or in the slime) could that fact be?** The closing question crystallizes this tension into the challenge of formulating a universal principle.
