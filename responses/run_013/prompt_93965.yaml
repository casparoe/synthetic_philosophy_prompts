prompt: |-
  Im a referee for a general math journal — I do maybe twelve, fifteen papers a year — and a big fraction of them lean on Zorn's lemma somewhere in the main proof, usually to conjure up some maximal gadget: a maximal ideal, a maximal independent set, a basis, a maximal extension of a partial map, that kind of thing. Im not a set theorist and I keep worrying Im either waving through proofs with real gaps or else flagging steps that are just routine for the intended audience. Can you write me a checklist I can actually run, in order, on any Zorn application in a paper Im refereeing?

  What I want: for each step, what genuinely has to be true for the application to be legitimate, what I can let slide as routine, and what a failure would actually look like on the page so I can spot it. A few specific things I keep tripping on and want the procedure to handle: (a) the gap between the maximal element Zorn hands you and the thing the paper actually wants — 'maximal' is not 'maximum' and I suspect some papers quietly need the stronger one; (b) chains whose upper bound is built by taking a union, where it's not obvious the union lands back inside the poset, plus the annoying edge case where the chain is empty and that quietly forces the poset to be nonempty; (c) papers that advertise themselves as choice-free or constructive but then invoke Zorn, when I have a vague memory that Zorn and the axiom of choice are basically the same thing in disguise; and (d) an argument that looks like Zorn but might really be transfinite recursion or a well-ordering in a Zorn costume.

  Then please run the checklist on two or three hypothetical papers: one where it comes out clean, one with a genuine gap that the author will swear isn't one, and one where the checklist tells me the proof is fine but only because the paper is leaning on more set theory than it lets on — which is the verdict I won't like, since it means I have to write a referee paragraph about something I don't fully understand. And be honest about where the checklist runs out and I just have to trust the author or punt to a set theorist.

  Keep it in words, bare minimum of notation, and assume I've seen Zorn's lemma stated but have never actually proved anything with it myself.
reasoning: |-
  We are creating a checklist for refereeing papers that use Zorn's Lemma. The goal is to have a step-by-step procedure that can be applied to any application of Zorn's Lemma in a proof, to check its validity. The checklist should address the specific concerns (a) through (d) mentioned.

  ## Zorn's Lemma Statement Recap
  Zorn's Lemma states: If in a partially ordered set (poset) P, every chain (i.e., totally ordered subset) has an upper bound in P, then P has at least one maximal element.

  ## Checklist for Applying Zorn's Lemma

  We break down the application of Zorn's Lemma into several steps. For each step, we describe:
  - What must be true for the application to be legitimate.
  - What can be considered routine (and thus might not require detailed checking if presented correctly).
  - What a failure would look like.

  ### Step 1: The Poset
  - **What must be true**: The set P (the poset) must be clearly defined, and the partial order must be specified. The partial order must be a partial order (reflexive, antisymmetric, transitive) on P.
  - **Routine**: Defining a set and a partial order on it is often straightforward. However, the elements of P and the order must be clearly described.
  - **Failure signs**: 
    - The set P is not well-defined (e.g., too vague, or defined in a way that might not be a set in ZF set theory without proper care, though this is rare in standard math).
    - The order relation is not a partial order (e.g., if it's claimed to be an order but transitivity fails).

  ### Step 2: Non-emptiness
  - **What must be true**: The poset P must be non-empty. This is because if P is empty, then the condition of Zorn's Lemma is vacuously true (since there are no chains) but there is no maximal element.
  - **Routine**: Often the non-emptiness is trivial (e.g., there is an obvious starting element). However, it must be checked.
  - **Failure signs**: 
    - The paper does not show P is non-empty. 
    - The only way to get non-emptiness might be through a separate argument that is missing (e.g., if the poset is the set of ideals containing a given ideal, then the given ideal itself is in P, so non-empty).

  ### Step 3: Chains and Their Upper Bounds
  - **What must be true**: For every chain C in P, there must exist an upper bound in P. An upper bound of C is an element u in P such that c ≤ u for every c in C. Note that u does not have to be in C (it can be outside).
  - **Routine**: The most common way to provide an upper bound for a chain C is to take the union of the elements of C (if the elements are sets) and then show that this union is in P. However, sometimes the union might not be in P, or the upper bound might be constructed differently.
  - **Failure signs**:
    - The upper bound construction (e.g., taking the union) does not necessarily belong to P. For example, in the context of rings, the union of a chain of ideals is an ideal, but in other contexts, the union might not have the required properties (e.g., if we are considering prime ideals, the union of a chain of prime ideals is prime, but if we are considering maximal ideals, the union of a chain of maximal ideals is not necessarily maximal). However, note that for Zorn we don't require the upper bound to be a least upper bound or to preserve the maximality property; we just require it to be in P and be an upper bound.
    - The paper does not address the case of the empty chain. The empty chain must have an upper bound? Actually, note: an upper bound for the empty chain is any element of P (since there are no elements to bound). But if P is non-empty, then there is at least one element. However, the condition of Zorn requires that every chain has an upper bound, and the empty chain is a chain. Therefore, if P is non-empty, the empty chain automatically has upper bounds (all of P). But note that Step 2 (non-emptiness) is already required. So if Step 2 is satisfied, then the empty chain is taken care of. However, in the construction of an upper bound for a chain, the chain might be non-empty. The key point is that the construction for a chain (which might be non-empty) must work.
    - The paper does not prove that the constructed upper bound (e.g., the union) satisfies the conditions to be in P. For example, if P is the set of all linearly independent subsets of a vector space, then the union of a chain of linearly independent sets is linearly independent (so it's in P). But if P were the set of bases, then the union might not be a basis (but note: in the standard proof of existence of a basis, P is the set of linearly independent sets, not the set of bases). So the key is that the union must have the defining property of P.

  ### Step 4: Maximal Element vs. Maximum Element (Concern a)
  - **What must be true**: The maximal element provided by Zorn's Lemma must be sufficient for the rest of the proof. A maximal element (say M) is one for which there is no element in P strictly greater than M. A maximum element would be one that is greater than or equal to every element in P. Often, the proof requires a maximal element that has an additional property (e.g., being a prime ideal, or being a basis). 
  - **Routine**: In many cases, maximality in the poset P (with the given order) is exactly what is needed. However, sometimes the proof might require that the maximal element is maximum (which is stronger) or that it has a global property. This is rare because Zorn only gives maximality. But a common mistake is to assume that the maximal element must be the largest possible (like a maximum) when it might only be maximal (i.e., no bigger element exists, but there might be incomparable maximal elements).
  - **Failure signs**:
    - The proof, after obtaining a maximal element M, uses the property that M is greater than every other element (which would be a maximum) when that is not necessarily true. 
    - The proof requires that M is the only maximal element, but Zorn doesn't guarantee uniqueness.

  ### Step 5: Choice-Free or Constructive Claims (Concern c)
  - **What must be true**: If the paper claims to be choice-free or constructive, then using Zorn's Lemma is problematic because Zorn's Lemma is equivalent to the Axiom of Choice (AC). Therefore, any such claim must be justified by showing that the specific application of Zorn does not require the full AC (e.g., because the poset is countable or because the existence of the upper bounds can be done constructively). However, in general, Zorn's Lemma is non-constructive.
  - **Routine**: Most papers do not make such claims, so this step is only needed if the paper explicitly states it avoids AC. 
  - **Failure signs**:
    - The paper states that it avoids AC (or is constructive) but uses Zorn's Lemma without providing a justification that the specific instance is provable without AC (e.g., by using a weaker choice principle or by showing that the poset is well-orderable in a constructive way).

  ### Step 6: Transfinite Recursion or Well-Ordering in Disguise (Concern d)
  - **What must be true**: Sometimes a proof appears to use Zorn's Lemma but is actually using a well-ordering or transfinite recursion. This is because Zorn's Lemma is equivalent to AC, and so is well-ordering. However, the structure of the proof might be more naturally done by transfinite recursion. This doesn't invalidate the proof, but if the paper claims to use Zorn, then the proof should be framed in terms of Zorn (i.e., defining a poset and showing the chain condition). 
  - **Routine**: If the proof sets up a poset and checks the chain condition, then it's a standard Zorn application. If the proof starts by well-ordering the universe and then builds the object step by step, then it's using well-ordering (and hence AC) but not Zorn directly. However, such a proof can be rephrased using Zorn (by considering partial constructions with an appropriate order). 
  - **Failure signs**: 
    - The proof does not define a poset but instead uses a well-ordering and transfinite recursion. Then the paper claims to use Zorn, which is a misrepresentation. But note: the underlying set theory is the same (AC). This is more of a stylistic issue. However, if the proof uses transfinite recursion and the well-ordering is on a proper class (like the entire universe) then that is not formalizable in ZF without AC, and it's equivalent to AC. But again, this is the same as Zorn.

  ## Summary Checklist (to run in order)

  1. **Poset Definition**: 
     - Is the set P clearly defined? 
     - Is the partial order on P clearly defined and verified (at least by statement) to be a partial order?
     - *Routine*: If the order is set inclusion (⊆) or something similar, it's routine. Otherwise, check for transitivity, reflexivity, antisymmetry if there is any doubt.

  2. **Non-emptiness**:
     - Does the paper explicitly or implicitly show that P is non-empty? 
     - *Routine*: Often one element is obvious. If not, it must be provided.

  3. **Chain Upper Bounds**:
     - For an arbitrary chain C in P, does the paper provide an upper bound in P? 
     - Is the construction of the upper bound (often the union) clearly explained and shown to be in P?
     - Check that the union (if used) actually is in P by the defining properties of P. 
     - *Routine*: In algebraic contexts (ideals, vector space bases) the union often works. But be cautious: if the elements of P are required to have a finite property, the union might break it (but then the chain condition might fail). 
     - Also, note that the empty chain is covered by non-emptiness of P (since any element is an upper bound for the empty chain). So if Step 2 is passed, the empty chain is handled.

  4. **Maximal Element Usage**:
     - After obtaining a maximal element M, check that the rest of the proof only uses the fact that M is maximal (i.e., there is no element in P strictly greater than M) and not that it is a maximum (unless the poset is a total order, which is rare). 
     - *Routine*: Most proofs use maximality correctly (e.g., if M is a maximal ideal and there is an element not in M, then adding it would generate the whole ring, etc.). 

  5. **Choice-Free Claims**:
     - If the paper claims to avoid AC, then the use of Zorn's Lemma must be justified as not requiring AC. This is very rare and typically requires special circumstances (e.g., the poset is countable, or the object being built is in a context where AC is not needed, like in the countable case). 
     - *Routine*: Without such a claim, skip this step.

  6. **Transparent Zorn vs. Well-Ordering**:
     - If the proof is structured as a transfinite recursion (with a well-ordered sequence of steps) but labeled as Zorn, it might be a mislabeling. However, the proof is still valid under AC. 
     - *Routine*: This step is mainly for understanding. If the proof uses Zorn (i.e., defines a poset and checks chains) then it's fine. If it uses transfinite recursion, then it's a different method (but equivalent). The journal might not care as long as the proof is correct.

  ## Example Applications

  ### Example 1: Clean Application
  **Paper**: Proves that every vector space has a basis.

  **Zorn Application**:
  - **Poset**: P = { S ⊆ V | S is linearly independent }, ordered by inclusion.
  - **Non-emptiness**: The empty set is linearly independent, so P is non-empty.
  - **Chain Upper Bound**: For a chain C of linearly independent sets, take the union U = ∪C. Then U is linearly independent (because any linear dependence would involve finitely many vectors, which would be in some element of C, contradicting linear independence of that set). So U is in P and is an upper bound for C.
  - **Maximal Element**: A maximal element in P is a maximal linearly independent set, i.e., a basis. The rest of the proof (if any) uses that a maximal linearly independent set spans the space (by maximality: if it doesn't span, there is a vector not in the span, and adding it gives a larger linearly independent set, contradiction).

  **Checklist**:
  1. Poset defined? Yes.
  2. Non-emptiness? Yes (empty set).
  3. Chain upper bound? Union works and is linearly independent (argument provided, or standard).
  4. Maximal element usage: Correct (maximal linearly independent set is a basis).
  5. Choice-free claim? None, so skip.
  6. Not applicable.

  **Verdict**: Clean.

