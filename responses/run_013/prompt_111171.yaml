prompt: |-
  I retired a few years ago after a long career in molecular biology, mostly bacterial transcription, and I've been sitting in on philosophy of biology seminars since, which has been a hoot and also maddening. I want to write a two-page proposal for a small one-year fellowship, and I'll add my own citations later so dont worry about those. Here's my half-formed idea. Everyone in my old field talks about DNA as the code, and about genes coding for proteins, and the philosophers seem split between saying that's just a handy metaphor and saying it's a real representational relation. My hunch is that both sides are running together two things: whether the mapping from codons to amino acids is arbitrary, which is the only sense in which it really looks like a code and I think it's weaker than people assume since a lot of it is chemistry rather than convention, and whether the DNA itself carries information about the organism in any sense beyond you can predict the organism from it if you know enough about the rest of the cell. So the question I'd want to pose precisely is something like: is there a defensible notion of genetic information on which a DNA sequence carries information about the organism or its traits, rather than merely covarying with them, and if so does that notion depend on facts about the ribosome and the rest of the cell that are themselves arbitrary? The test case I keep coming back to is this: imagine a lineage in which the ribosome's codon assignments drift, so that the same sequence now yields a different protein. Did the old DNA mean something different all along, did the meaning change, or was there never any meaning to begin with? I think whichever answer you give forces your hand on the whole debate, and I haven't seen anyone put it quite that way. Turn this into a proposal. State the question so it has a determinate answer, explain why the standard positions, the it's-just-a-metaphor crowd who want information talk dropped from biology versus the people who want a substantive notion of representation inside the cell, don't already settle it, say what I would actually do month by month, and be honest about what the method even is when the method is just thinking, since there's no wet lab here. Tell me what would count as a real result, what would count as the project failing, and whether this is a year or whether I'm kidding myself and it's a decade. Write it as continuous prose, no headings or bullet points or bold or tables, just paragraphs like a letter, since the application form says no formatting.
