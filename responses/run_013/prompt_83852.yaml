prompt: |-
  I'm a software engineer, no philosophy background at all, and somehow I ended up on the board of this small nonprofit that runs an open-source project. We also do a little lobbying on software patent and interoperability stuff, which is why I'm asking you instead of just googling "conflict of interest."

  Next month we vote on a $400k gift from BigCo. BigCo is already a member (they pay dues), one of their engineers sits on our technical steering committee, and they lobby the same people we do, sometimes on the same patent bill. The gift would pay for a security audit we genuinely can't afford otherwise. And their main rival has already told us they'll match whatever we turn down, so saying no isnt free either. Our ED says take it and just list the donor on the website. Two board members say we're bought the second we cash the check. One says it's only a problem if there's an actual deal.

  Write the decision memo I'll circulate before the meeting: a concrete recommendation (take it, refuse, or take it with conditions, with a time frame), the reasoning, and the strongest honest version of the side I'm coming down against. Since I'm the one who'll get grilled on this, also say how confident you are in the call and flag the single point you're least sure about.
