prompt: |-
  I teach a graduate seminar on set theory and the philosophy of mathematics, and I am writing the final exam. The exam is 90 minutes, closed book, and the essay question I need is worth 25 marks. My students can already recite the independence of the continuum hypothesis from ZFC, the constructible universe, Cohen forcing, and the usual multiverse-versus-universe talking points. I want a question that cannot be answered by that recitation. I want it to make them confront a distinction I introduced in lecture but did not name after anyone: between width-independence and height-independence. Say that a sentence is width-independent if there are two models of ZFC with the same ordinals but different sets of reals, one satisfying the sentence and the other satisfying its negation. Say that a sentence is height-independent if there are models of ZFC that differ in ordinal height or in large-cardinal structure and disagree on the sentence. The continuum hypothesis is the test case I want them to use. I also want the question to introduce a principle that one of my students proposed in seminar and that I have deliberately left unnamed: a sentence has a determinate truth value only if it is not width-independent. The question should ask whether that principle is defensible, what a defender of it would have to give up, and whether the width-independence of the continuum hypothesis really supports the claim that CH has no determinate truth value. I was discussing this with a colleague in the philosophy department who works on modality, and she suggested the distinction might be analogous to the difference between changing the domain of a quantified modal logic and changing the accessibility relation, so you may use that analogy if it helps, but do not let it substitute for the set-theoretic argument.

  Please write the exam question itself, a model answer of about 700 words, and a marking scheme built around five must-hit points, with the marks for each point totalling 25, plus a one-line note on how students typically get each wrong. The model answer should reason from the definitions given here and should not depend on any particular paper, book, or citation; no bibliography or reading list is needed. The question should separate students who understand the difference between independence from a formal system and indeterminacy of truth value from those who have merely memorized the labels.
reasoning: |-
  We are creating an exam question that focuses on the distinction between "width-independence" and "height-independence" as defined, and uses the Continuum Hypothesis (CH) as a test case. The question also introduces a principle (proposed by a student) that a sentence has a determinate truth value only if it is not width-independent. The question should ask students to evaluate this principle, discuss what a defender of it would have to give up, and whether the width-independence of CH supports the claim that CH has no determinate truth value.

  Exam Question:

  **Question (25 marks):**

  In this course, we have discussed two kinds of independence for sentences in the language of set theory. We say that a sentence \(\varphi\) is *width-independent* if there are two models of ZFC that have the same ordinals (and hence the same height) but different sets of reals, such that one satisfies \(\varphi\) and the other satisfies \(\neg\varphi\). We say that \(\varphi\) is *height-independent* if there are two models of ZFC that differ in their ordinal height (or in their large cardinal structure) and disagree on \(\varphi\).

  Consider the Continuum Hypothesis (CH) as a test case. We know that CH is width-independent: we can have two models of ZFC with the same ordinals (for example, both satisfying \(V = L\)) but one satisfying CH and the other not (by forcing over one to add reals without collapsing cardinals). However, CH is not height-independent in the same way: if we consider models of different heights (for example, by adding large cardinals) we cannot change the truth value of CH without also changing the set of reals (which is tied to the width).

  One of your fellow students proposed the following principle:

  **Student's Principle (SP):** A sentence in the language of set theory has a determinate truth value (in the intended interpretation of the set-theoretic universe) only if it is not width-independent.

  (a) Explain why CH, being width-independent, would be regarded by a defender of SP as lacking a determinate truth value. (5 marks)

  (b) Discuss whether SP is defensible. What would a defender of SP have to give up? (10 marks)

  (c) Does the width-independence of CH indeed support the claim that CH has no determinate truth value? Why or why not? (10 marks)

  In your answer, you may use the following analogy suggested by a colleague: the distinction between width-independence and height-independence might be analogous to the difference between changing the domain of a quantified modal logic (width) and changing the accessibility relation (height). However, your argument should be based on set-theoretic considerations.

  ---

  **Model Answer (Approx. 700 words):**

  (a) The Continuum Hypothesis (CH) is width-independent because there are models of ZFC that share the same ordinals (and hence the same \(\omega_1\)) but have different sets of reals. For example, starting with a model of \(V=L\) (which satisfies CH), we can perform a forcing extension that adds \(\aleph_2\) Cohen reals without collapsing cardinals, resulting in a model with the same ordinals but \(2^{\aleph_0} = \aleph_2\), hence \(\neg\)CH. According to the Student's Principle (SP), a sentence has a determinate truth value only if it is not width-independent. Since CH is width-independent, a defender of SP would conclude that CH lacks a determinate truth value. The idea is that the width-independent sentences are those that can be varied without changing the ordinal structure, which might be seen as the "backbone" of the set-theoretic universe. Thus, if we can change the truth value of a sentence by merely adding sets (without changing the ordinals), then that sentence is not fixed by the fundamental structure of the universe and hence indeterminate.

  (b) The defensibility of SP is a matter of philosophical debate. To defend SP, one must hold that the only sentences with determinate truth values are those that are fixed by the ordinal structure of the universe. This means that any sentence that can be varied by changing the "width" (i.e., the power sets, the sets of reals) without changing the ordinals does not have a determinate truth value. However, this principle has significant consequences. A defender of SP would have to give up the hope of resolving many questions about the continuum and the power set operation. For instance, not only CH but also many other statements (like Martin's Axiom, the Suslin Hypothesis, or even the existence of certain sets of reals) might be width-independent. Moreover, SP implies that the intended interpretation of set theory is not fully specified by the axioms of ZFC plus large cardinal axioms, because these axioms do not fix the power set operation. In fact, the defender of SP must accept that the set-theoretic universe is inherently underdetermined in its "width" and that only the "height" (the ordinal structure) is determinate. This view aligns with a form of multiverse perspective where the universe is not unique but has many equally valid extensions in width. However, it also forces the defender to abandon the idea of a unique intended model of set theory (at least in the full sense) and to accept that some questions are simply not settled by the concept of set.

  (c) The width-independence of CH does not necessarily support the claim that CH has no determinate truth value. The argument from width-independence to indeterminacy rests on the assumption that the only way a sentence can be determinate is if it is fixed by the ordinal structure. However, one might reject this assumption. For example, a set-theoretic realist (or universist) might hold that the power set operation is a definite concept, and therefore the set of reals is fixed in the true \(V\). In this view, the existence of different models with the same ordinals but different sets of reals only shows that ZFC does not fully capture the intended interpretation, not that the intended interpretation is indeterminate. Moreover, the width-independence of CH is established by forcing, which is a method that starts with a model and builds an extension. But the realist might argue that the forcing extensions are not on a par with the ground model; the ground model might be the true universe and the forcing extension merely a mathematical construction. Therefore, the fact that we can build a model where CH fails does not imply that CH is false in the true universe. Additionally, it is important to note that CH is not height-independent: we cannot change the truth value of CH by moving to a model with more ordinals (without also changing the reals). This might suggest that CH is tied to the cumulative hierarchy up to \(\omega_1\) and the reals, which are part of the initial structure. But the realist would argue that the entire hierarchy is fixed, including the reals. Thus, while width-independence shows that ZFC does not decide CH, it does not by itself establish indeterminacy without the additional philosophical assumption (as in SP) that the only determinate truths are those invariant under changes of width. Without that assumption, the width-independence of CH remains a technical fact about models of ZFC, not a proof of the indeterminacy of CH.

  In conclusion, SP is a strong principle that ties determinacy of truth to width-invariance. It forces a particular view of the set-theoretic universe where the ordinal structure is privileged and the power set operation is inherently vague. While this view is defensible, it requires accepting that many natural questions in set theory are indeterminate. However, the width-independence of CH does not by itself force us to accept that CH is indeterminate; it only does so if we already accept SP or a similar principle. Therefore, the support that width-independence gives to the indeterminacy of CH is conditional on accepting the philosophical stance that the width of the universe is not fixed.

  ---

  **Marking Scheme (Total: 25 marks):**

  The marking scheme is built around five must-hit points. The breakdown is as follows:

  1. **Explanation of why CH being width-independent leads to indeterminacy under SP (part a):** (5 marks)
     - Must clearly state that CH is width-independent and that SP says that width-independent sentences lack determinate truth value, hence CH lacks determinate truth value.
     - *Typical mistake:* Only stating that CH is independent of ZFC without linking to the width-independence definition and SP.

  2. **Discussion of defensibility of SP and what a defender must give up (part b):** (10 marks, broken into two subpoints)
     - (i) Defensibility: Explain that SP is defensible from a perspective that privileges the ordinal structure as the fixed backbone and accepts the power set as flexible (multiverse view). (5 marks)
     - (ii) What must be given up: The defender must give up the idea that the power set operation is definite, hence the hope of resolving questions like CH, and the idea of a unique intended model in the full sense. (5 marks)
     - *Typical mistake:* Failing to mention the consequences for the power set operation or the multiverse perspective.

  3. **Critical evaluation of whether width-independence of CH supports indeterminacy (part c):** (10 marks, broken into two subpoints)
     - (i) Argument that it does not necessarily support indeterminacy: For example, a realist might argue that forcing extensions are not ontologically on par with the ground model, so the existence of models with the same ordinals but different reals does not imply that the true universe is indeterminate. (5 marks)
     - (ii) The role of the additional assumption (SP): The width-independence of CH only leads to indeterminacy if we accept SP. Without SP, it is only a technical independence result. (5 marks)
     - *Typical mistake:* Confusing independence from ZFC with indeterminacy without addressing the philosophical assumption (SP).

  Note: The total marks for the five points (1, 2i, 2ii, 3i, 3ii) are 5+5+5+5+5=25 marks.

  Additionally, the answer should be well-structured and clear. However, the marks are allocated solely for hitting the five must-hit points above. The model answer provides a template for a full response.
answer: |-
  **Exam Question (25 marks):**

  Define a sentence \(\varphi\) in the language of set theory to be *width-independent* if there exist two models \(M\) and \(N\) of ZFC such that:  
  (i) \(M\) and \(N\) have identical ordinal structures (i.e., \(\text{Ord}^M = \text{Ord}^N\)), yet  
  (ii) \(M \models \varphi\) and \(N \models \neg \varphi\).  

  Define \(\varphi\) to be *height-independent* if there exist two models \(M\) and \(N\) of ZFC such that:  
  (i) \(M\) and \(N\) differ in ordinal height or large-cardinal structure (i.e., \(\text{Ord}^M \neq \text{Ord}^N\) or they disagree on large-cardinal properties), and  
  (ii) \(M \models \varphi\) and \(N \models \neg \varphi\).  

  Consider the Continuum Hypothesis (CH). It is known that CH is width-independent (e.g., via Cohen forcing) but not height-independent in the same manner. A student proposes the following principle:  
  **SP:** A sentence \(\varphi\) has a determinate truth value in the true universe of sets only if \(\varphi\) is *not* width-independent.  

  Address the following:  
  (a) Explain why, given SP, CH’s width-independence implies it lacks a determinate truth value. (5 marks)  
  (b) Assess whether SP is defensible. What must a defender of SP give up regarding the nature of set theory? (10 marks)  
  (c) Does CH’s width-independence genuinely support the claim that CH has no determinate truth value? Or could a set-theoretic realist reject this inference? Justify your answer. (10 marks)  

  In your response, reason from the definitions above. You may (but need not) use the analogy that width-independence resembles altering the domain in a quantified modal logic, while height-independence resembles altering the accessibility relation. Do not merely recite independence results; engage with the distinction between formal independence and truth-value indeterminacy.  

  ---

  **Model Answer (Approx. 700 words):**  

  **(a)** SP asserts that a sentence has a determinate truth value only if it is not width-independent—i.e., if its truth value cannot vary between models sharing the same ordinals. CH is width-independent: there are models \(M\) and \(N\) with \(\text{Ord}^M = \text{Ord}^N\) (e.g., \(M = L\) satisfying CH, and \(N\) a Cohen forcing extension of \(M\) satisfying \(\neg \text{CH}\)). Since these models agree on all ordinal properties (like \(\omega_1\)) but disagree on CH, SP implies that CH’s truth value is not fixed by the ordinal structure, which SP treats as essential to determinacy. Thus, a defender of SP concludes CH lacks a determinate truth value.  

  **(b)** SP is defensible only if one accepts that the ordinal structure (the "height" of the universe) is the sole determinant of set-theoretic truth, while the "width" (e.g., the power set operation) is inherently flexible. This privileges height as the objective backbone of the universe. A defender must therefore give up two key ideas:  
  - **The definiteness of the power set.** SP implies that questions settled by varying subsets (like CH) are indeterminate because the power set of \(\omega\) is not uniquely specified by the ordinals. This forfeits the realist hope that the continuum has a fixed nature.  
  - **The uniqueness of the universe.** SP commits to a multiverse perspective where multiple universes with identical ordinals but different sets of reals are equally legitimate. This denies an absolute "intended model" for sets beyond the ordinal hierarchy.  
  However, SP faces challenges. First, it arbitrarily elevates height over width: why should large-cardinal axioms (height) be "more determinate" than continuum statements (width)? Second, it renders many natural questions (e.g., Suslin’s Hypothesis) indeterminate despite their concrete consequences. SP is thus defensible only for those willing to abandon width-invariant realism.  

  **(c)** CH’s width-independence does not *by itself* support indeterminacy. It only does so under SP’s assumption that width-variation implies indeterminacy. A set-theoretic realist can reject this inference by arguing:  
  - **Ontological priority of the ground model.** In forcing, we start with a ground model \(V\) and build an extension \(V[G]\). A realist may hold that \(V\) is the true universe, while \(V[G]\) is a technical construct; thus, CH’s falsity in \(V[G]\) does not challenge its (determinate) truth in \(V\).  
  - **SP conflates underdetermination with indeterminacy.** Width-independence shows CH is underdetermined by ZFC + ordinals, but not that it lacks a truth value. Just as the independence of Euclid’s parallel postulate from other axioms did not prove its indeterminacy (only that geometry required enrichment), CH’s independence may signal incompleteness in ZFC, not indeterminacy in the universe.  
  The analogy to modal logic highlights this: changing the domain (width) may reflect epistemic uncertainty about sets, while changing the accessibility relation (height) alters modal constraints. But a realist can insist the domain is fixed—width-variation is merely exploratory, not ontological. Thus, CH’s width-independence supports indeterminacy only if one preemptively ties truth to height-invariance (as SP does). Without SP, it remains a technical result about models, not truth.  

  In sum, SP is a stipulation that height-invariance is necessary for determinacy. Its defensibility requires sacrificing width-unique realism. While CH’s width-independence is consistent with indeterminacy under SP, it does not compel it; realists can uphold determinacy by rejecting SP’s privileging of height.  

  ---  

  **Marking Scheme (Total: 25 marks):**  

  1. **Correct explanation of CH’s width-independence and SP’s implication for CH (part a):** (5 marks)  
     - *Must-hit:* CH is width-independent (models with same ordinals disagree on CH); SP says width-independent sentences lack determinate truth; thus SP implies CH lacks determinate truth.  
     - *Typical mistake:* Stating CH is independent of ZFC without linking to width-specificity (e.g., same ordinals).  

  2. **Defensibility of SP: Height as privileged (part b):** (5 marks)  
     - *Must-hit:* SP is defensible only if ordinal structure is taken as the fixed "backbone" of truth, making width (e.g., power sets) indeterminate.  
     - *Typical mistake:* Claiming SP is indefensible/defensible without engaging why height might be privileged.  

  3. **What SP sacrifices: Power set definiteness and universe uniqueness (part b):** (5 marks)  
     - *Must-hit:* Defender must abandon the idea that the power set operation is definite and accept a multiverse (no unique "true" universe for width).  
     - *Typical mistake:* Omitting either consequence or confusing it with height-related sacrifices (e.g., large cardinals).  

  4. **Realist rebuttal: Independence ≠ Indeterminacy (part c):** (5 marks)  
     - *Must-hit:* Argue that width-independence only shows underdetermination by current axioms, not indeterminacy; realist can ground truth in a unique universe (e.g., privileging ground models over forcing extensions).  
     - *Typical mistake:* Conflating formal independence with proof of indeterminacy or failing to distinguish models from truth.  

  5. **SP’s role in linking width-independence to indeterminacy (part c):** (5 marks)  
     - *Must-hit:* CH’s width-independence supports indeterminacy only if SP is assumed; without SP, it is neutral on truth-value determinacy.  
     - *Typical mistake:* Assuming width-independence inherently implies indeterminacy without reference to SP’s philosophical premise.  

  Each must-hit point is worth 5 marks. Award partial marks for incomplete or unclear responses (e.g., 3/5 for a point missing a key element). Total: 25 marks.
