  What I want is to look at that through Friedman's F-twist — the claim, roughly, that a theory's assumptions don't need to be realistic, only its predictions need to be good (the bit of "The Methodology of Positive Economics" everyone cites and nobody reads). I know the standard take: unrealistic assumptions, disaster, QED. That's boring and I think it's probably wrong, and I want the harder version.

  Please write it up in British English, in these sections and roughly these lengths:

