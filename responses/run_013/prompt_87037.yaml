answer: |-
  ### Exam Question  
  **PHL 405: Metaphysics of Laws - Take-Home Final**  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 1200 words  
  **Instructions:** Answer the following question. Your response will be assessed on the clarity and rigor of your philosophical argument. Do not summarize positions from readings; engage directly with the scenario. Closed book—no external materials permitted.  

  **Question:**  
  Consider a possible world *W* whose entire history of particular events (the "mosaic") can be perfectly described by two axiomatic systems, *A* and *B*. Both systems are *exactly tied* in simplicity (e.g., equal number of fundamental axioms, same mathematical complexity) and strength (they entail all and only the same truths about *W*). However, they differ in their structure:  
  - System *A* includes the regularity *R* ("All Xs are Ys," where *X* and *Y* are natural predicates fitting *W*’s patterns) as an **axiom**.  
  - System *B* does not include *R* as an axiom. Instead, *R* is derived as a **theorem** from *B*’s other axioms, which describe different regularities.  

  Assume no further criteria (e.g., practicality, elegance) can break the tie between *A* and *B*.  

  1. **For Humeanism (Best-System Account):**  
     - Must *R* be a law of nature in *W*? Explain why the answer hinges on whether laws are restricted to the *axioms* of the best system or include its *theorems*.  
     - Does this scenario reveal a metaphysical problem for Humeanism? If so, is it fatal to the view?  

  2. **For Anti-Humeanism (e.g., governing-laws or dispositional essentialism):**  
     - How would an anti-Humean determine *R*’s lawhood? Does this scenario pose a similar challenge?  

  **Marking Focus:** Your argument’s logical structure, handling of dilemmas, and whether you avoid common pitfalls (e.g., treating the tie as merely epistemic, conflating Humeanism with instrumentalism, or assuming anti-Humeans are immune to the problem).  

  ---

  ### Model Answer (≈700 words)  
  **(Note: This demonstrates argument structure, not required content)**  

  The Two Calendars scenario forces a dilemma for Humeanism about laws of nature. If laws are identified solely with the *axioms* of the best system, then *R*’s status as a law depends arbitrarily on whether we choose system *A* or *B*. Since both systems are equally optimal, neither is uniquely "best." Thus, *R* is a law if *A* is selected but not if *B* is. This makes lawhood metaphysically indeterminate in *W*—a consequence many find unacceptable, as laws seem like objective features of a world, not artifacts of descriptive packaging.  

  Alternatively, if Humeans claim *all* regularities entailed by the best system (including theorems) are laws, the tie between *A* and *B* ceases to matter for *R*: both systems entail *R*, so *R* would be a law regardless. However, this collapses the distinction between laws and accidents. For example, "all gold spheres are less than a mile wide" (a contingent, non-nomic fact) would also be entailed by any sufficiently strong system describing *W*. To avoid this, Humeans typically restrict laws to axioms. But this returns us to the first horn: *R*’s lawhood becomes indeterminate. This dilemma suggests a deeper issue: Humeanism grounds lawhood in descriptive economy, but economy cannot resolve cases of symmetric optimization, threatening objectivity.  

  This is not merely an epistemic problem (i.e., we cannot *know* if *R* is a law). The scenario stipulates that *W*’s mosaic *is* equally well-captured by both systems—it is a metaphysical feature of *W*. Thus, Humeanism struggles to provide a determinate account of what laws *are* in such worlds. While Humeans might bite the bullet (arguing lawhood *is* sometimes indeterminate), this clashes with intuition that laws are part of a world’s fundamental structure.  

  Anti-Humeans face a parallel challenge. Suppose laws are primitive governing entities (Maudlin) or necessitating relations between universals (Armstrong). The anti-Humean must still explain *why R* is or isn’t a law in *W*. If they argue only fundamental regularities are laws (e.g., Armstrong’s "first-order" universals), *R* risks being demoted to a derivative pattern, even if it appears lawlike. In *W*, system *B* treats *R* as derived—suggesting *R* is non-fundamental. But this excludes many uncontroversial laws (e.g., Kepler’s laws, derived from Newtonian axioms). If anti-Humeans instead count *R* as a law, they must explain what in *W*’s ontology makes it so, given that *B*’s axioms suggest *R* is reducible. The core symmetry persists: *W* admits two equally coherent nomic interpretations. Anti-Humeans avoid the "axiom/theorem" framing but confront the same metaphysical indeterminacy.  

  Thus, the Two Calendars problem is not uniquely Humean. Both views must decide whether lawhood is sensitive to fundamentality or reducibility and face indeterminacy when a world’s structure symmetrically supports competing nomic descriptions. This reveals a shared challenge: securing the objectivity of laws without ad hoc constraints.  

  ---

  ### Marking Scheme (Total: 20 points)  
  **Award marks for:**  
  1. **Accurate setup of Two Calendars** (2 pts): Clearly explains the tie between *A* and *B* and their treatment of *R*.  
  2. **Humean dilemma: First horn** (3 pts):  
     - If laws = axioms → *R*’s lawhood is indeterminate.  
     - Why this is metaphysical (not epistemic).  
  3. **Humean dilemma: Second horn** (3 pts):  
     - If laws = theorems → collapses law/accident distinction.  
     - Why reverting to axioms returns to first horn.  
  4. **Critique of Humeanism** (2 pts): Identifies why this threatens objectivity (e.g., lawhood depends on arbitrary choice).  
  5. **Anti-Humean challenge** (3 pts):  
     - Explains how fundamentality/reducibility creates similar indeterminacy (e.g., *R* could be fundamental or derived).  
     - Notes that excluding derived regularities risks denying lawhood to typical cases (e.g., Kepler’s laws).  
  6. **Symmetry thesis** (3 pts): Argues the problem is not uniquely Humean; both views face indeterminacy due to structural symmetry.  
  7. **Overall coherence** (2 pts): Logical flow, avoids tangents.  

  **Deduct marks for:**  
  - **Misrepresenting Humeanism** (–2): E.g., calling it "instrumentalist," claiming it reduces laws to *mere* summaries.  
  - **Epistemic misreading** (–2): Treating the tie as "we can’t know which system is best" (vs. metaphysical indeterminacy).  
  - **Asymmetry error** (–3): Claiming anti-Humeans easily avoid the problem without engagement.  
  - **Name-dropping without argument** (–1 per instance): E.g., "Armstrong says..." without explaining the position’s relevance.  
  - **Ignoring a horn** (–2): Failing to address both Humean options or both views.  

  **Grade boundaries:** 17–20: Excellent (all moves present, rigorous); 13–16: Good (minor gaps); 9–12: Pass (superficial/skips key steps); <9: Fail.  

  ---  
  **Rationale:** This design forces engagement with the axiom/theorem tension while blocking rote summaries. The marking scheme rewards argumentative moves over citations and penalizes common misconceptions. The model answer demonstrates depth without relying on quotations or asserting consensus where none exists.
