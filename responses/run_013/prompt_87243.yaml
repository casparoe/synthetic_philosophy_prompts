answer: |-
  ### Exam Question: Judgment Aggregation and Small-Margin Repair  
  **Total Time: 90 Minutes**  
  **Total Marks: 25**  

  ---

  #### Case and Rule  
  Consider three voters (A, B, C) evaluating three propositions:  
  - **P**: "Candidate meets research criteria."  
  - **Q**: "Candidate meets teaching criteria."  
  - **R**: "Candidate is recommended for hire."  
  *Logical constraint*: **R** holds if and only if **both P and Q hold** (i.e., **R ≡ P∧Q**).  

  **Ballot Order**: Propositions appear in the fixed order: **P, Q, R**.  

  **Voter Verdicts**:  
  | Voter | P   | Q   | R   |  
  |-------|-----|-----|-----|  
  | A     | Yes | Yes | Yes |  
  | B     | Yes | No  | No  |  
  | C     | No  | Yes | No  |  

  **Small-Margin Repair Rule** (restated):  
  1. Take majority verdict on each proposition.  
  2. If consistent, that is the collective judgment.  
  3. If inconsistent:  
     - Identify a *minimal inconsistent subset* (inconsistent, but all proper subsets consistent).  
     - Reverse the majority verdict on the proposition in this subset with the **smallest majority margin**.  
     - If margins tie, reverse the one printed **lower on the ballot**.  
  4. Repeat until consistent.  

  ---

  #### Tasks  
  1. **Application and Sensitivity** (10 marks):  
     (a) Apply Small-Margin Repair to the case above. Show each step.  
     (b) Suppose the ballot order changes to **R, Q, P** (all else identical). Reapply the rule.  
     (c) State which aggregation-rule property this change violates and why.  

  2. **Property Assessment** (8 marks):  
     For each property below, state whether Small-Margin Repair satisfies it. Give a *short argument* or a *counterexample*:  
     - **Anonymity** (voters are interchangeable)  
     - **Neutrality** (propositions are treated symmetrically)  
     - **Independence** (collective verdict on a proposition depends only on individual verdicts on it)  
     - **Immunity to strategic misreporting** (no voter gains by lying).  

  3. **Normative Evaluation** (7 marks):  
     Is Small-Margin Repair defensible for real committees resolving inconsistencies? Engage the **strongest objection** to your view.  

  ---

  ### Model Answer (≈700 words)  
  **Candidate Name: Exemplar**  

  #### Task 1: Application and Sensitivity  
  **(a) Original Ballot Order (P, Q, R):**  
  - Step 1: Majority verdicts:  
    - P: Yes (A,B Yes; C No → 2-1)  
    - Q: Yes (A,C Yes; B No → 2-1)  
    - R: No (A Yes; B,C No → 1-2).  
    Verdicts: {P=Y, Q=Y, R=N}. **Inconsistent** (P∧Q true implies R should be Yes).  
  - Step 3: Minimal inconsistent subset: {P, Q, R}.  
    Margins: P (2-1), Q (2-1), R (1-2 → margin=1).  
    Smallest margin: **R (margin=1)**. Reverse R to **Yes**.  
    New set: {P=Y, Q=Y, R=Y}. **Consistent**.  
  **Collective judgment: P=Yes, Q=Yes, R=Yes**.  

  **(b) Ballot Order Changed to (R, Q, P):**  
  - Step 1: Same majority verdicts: {P=Y, Q=Y, R=N}. **Inconsistent**.  
  - Step 3: Minimal inconsistent subset: {P, Q, R}.  
    Margins: P (2-1), Q (2-1), R (1-2 → margin=1).  
    Smallest margin: **R (margin=1)**. But ballot order is now R, Q, P → R is printed *highest*.  
    Tie-breaker: Reverse proposition printed **lowest** on ballot. Here, **P** is lowest. Reverse P to **No**.  
    New set: {P=N, Q=Y, R=N}. **Consistent** (P false implies R false).  
  **Collective judgment: P=No, Q=Yes, R=No**.  

  **(c) Violated Property:**  
  This violates **Neutrality**. The rule treats propositions asymmetrically based on ballot order, not just their logical roles. Identical voting patterns produce different outcomes due to non-substantive ballot design.  

  #### Task 2: Property Assessment  
  - **Anonymity: YES**.  
    *Argument*: Reordering voter labels (A,B,C) does not change majority margins or repair steps. Voters are interchangeable.  
  - **Neutrality: NO**.  
    *Counterexample*: Task 1 shows reordering propositions (P,Q,R) changes the outcome despite identical votes/logic. Ballot position breaks symmetry.  
  - **Independence: NO**.  
    *Counterexample*: The reversal step depends on *comparative margins* across propositions. In Task 1(b), reversing P (not R) depended on R’s margin *and* its ballot position relative to P/Q.  
  - **Immunity to strategic misreporting: NO**.  
    *Counterexample*: Suppose original ballot order (P,Q,R). Voter B (truthful: P=Y, Q=N, R=N) wants R rejected. If B lies and reports P=No (making P margin 1-2), Step 3 reverses P (smallest margin) → outcome {P=Y, Q=Y, R=Y}. But if B tells truth, R reversed → same outcome. No gain.  
    **Stronger counterexample**: In Task 1(b) order (R,Q,P), truthful B gets {P=N, Q=Y, R=N}. If B lies, reporting Q=Yes (unchanged) but R=Yes (lie), majority becomes R: 2-1 (A,B Yes), Q: 3-0, P: 2-1. Set {P=Y,Q=Y,R=Y} inconsistent. Minimal subset {P,Q,R}: margins P(2-1), Q(3-0), R(2-1). Smallest margins: P/R (tie). Ballot order (R,Q,P) → P lowest → reverse P to No. Outcome same as truth: {P=N,Q=Y,R=Y} (consistent). B’s lie changed nothing → no incentive.  
    **Robust counterexample**: Add voter D in a larger case. Crux: margins create dependencies, enabling manipulation.  

  #### Task 3: Normative Evaluation  
  Small-Margin Repair is **indefensible** for real committees. Its core flaw is **arbitrary sensitivity to ballot design**, violating procedural fairness.  

  - **Defense**: It respects majority will minimally by reversing smallest-margin propositions first, avoiding chair fiat.  
  - **Strongest objection**: Ballot ordering is administrative, not substantive. In Task 1, changing proposition order on paper—*without altering voter opinions or logic*—switched the outcome from hiring (P=Y,Q=Y,R=Y) to rejecting on research (P=N,Q=Y,R=N). This makes outcomes depend on bureaucratic trivia, undermining legitimacy and inviting manipulation. Committees cannot justify why "P printed last" should override a direct majority for P.  

  - **Rebuttal to defense**: While margins seem democratic, prioritizing them + ballot order amplifies random noise. A 2-1 margin differs minimally from 51-49% in large groups; basing repairs on such differences is brittle. Real committees should instead reopen debate or use premise-based voting.  

  **Conclusion**: The rule substitutes technical fixes for deliberative resolution, violating neutrality and amplifying path dependence. Committees should seek consensus, not algorithmic repairs.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **A Answer (21–25)**: Correct arithmetic, identifies ballot-order violation of neutrality, accurate property assessment with valid counterexamples, and a normative verdict engaging the ballot-order objection deeply.  
  **B Answer (16–20)**: Minor errors in repair steps or properties, but structure sound; normative evaluation surface-level.  

  #### Task 1: Application and Sensitivity (10 marks)  
  - **(a) Correct repair steps**: 4 marks (2 for majorities, 2 for reversal logic).  
    *Common error*: Fails to reverse R first in (a); ignores tie-breaker.  
  - **(b) Correct repair for new order**: 4 marks.  
    *Common error*: Assumes same reversal as (a); misses P reversed due to tie-breaker.  
  - **(c) Names neutrality + explanation**: 2 marks.  
    *Common error*: Cites "independence" or "anonymity" incorrectly.  

  #### Task 2: Property Assessment (8 marks)  
  - 2 marks per property (0.5 for YES/NO, 1.5 for argument/counterexample).  
    *Common errors*:  
    - Neutrality: Misses ballot-order counterexample.  
    - Independence: Confuses with neutrality; misses cross-proposition margin dependence.  
    - Strategy: Fails to provide effective counterexample.  

  #### Task 3: Normative Evaluation (7 marks)  
  - 3 marks: Clear verdict with one supporting point.  
  - 4 marks: Engages strongest objection (ballot-order arbitrariness) and rebuts a defense.  
    *Common error*: Lists objections superficially without engaging the deepest flaw.  

  ---  
  **END OF EXAM PAPER**
