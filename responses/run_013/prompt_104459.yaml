prompt: |-
  Alright, I'm a fourth-year PhD student working on causation and I've got a credence question thats been eating at me. I'll give you my number and my decomposition; I want yours, but the decomposition is the point.

  The claim (call it C): take an on-duty lifeguard who doesn't look up from her book while a swimmer drowns, and an off-duty passerby who also doesn't look up and also could have swum out. Suppose the two cases are identical in every non-normative respect -- same effort, same knowledge, same counterfactuals, same consequences -- and the only thing that differs is that one of them was supposed to be watching. C says: the reason we say the first one's failure caused the drowning and the second one's didn't is a difference in the causal facts themselves, not just a difference in what we're willing to blame. I'm at 0.4.

  Give me your credence in C, but decompose it into the sub-questions it actually rests on, with a rough number for each:

  1. Are ordinary causal claims already norm-laden, so that if norms show up in omission cases they were there all along and omissions are nothing special? And if so, does it matter whether the norm is a legal or institutional duty, a moral requirement, or just a statistical regularity about what people normally do?
  2. Can absences and omissions be genuine terms in the causal relation, or do they always get paraphrased away into facts about agents and what they did or didn't do?
  3. Can a purely difference-making, counterfactual account distinguish the two lifeguards on its own, without smuggling in a norm about what the on-duty one was supposed to do?
  4. Do our verdicts in these cases track causation at all, or do they just track culpability -- so that C is an illusion produced by moral judgment leaking into causal judgment?
  5. Whatever else you think belongs.

  Then combine them into a number, tell me which term you'd bet on least, and tell me what argument or case would move it the most. Don't survey the options and leave the pick to me -- actually commit to a number and defend it. If you think C is ill-formed, say so and price that in rather than hedging.
