answer: |-
  Here are your five key points on Jantelagen:

  1.  **It's not a legal code, it's an informal social norm:** Jantelagen describes deeply ingrained cultural attitudes promoting modesty and equality, not an actual law or "official ethos" enforced by authorities.
  2.  **It targets arrogance, not success itself:** The core objection is to *acting* superior, entitled, or flaunting success, not to being skilled, ambitious, or achieving results; quiet competence is respected.
  3.  **The "eleventh rule" is social accountability:** "We know a few things about you" signifies that pretentiousness or breaking social norms won't go unnoticed or unchallenged within the community.
  4.  **Success requires demonstrating collective value:** Visible achievement is more accepted when framed as benefiting the team/community and accompanied by humility, collaboration, and downplaying personal status.
  5.  **It's distinct from just "tall poppy syndrome":** While similar, Jantelagen is a more formalized *description* of the underlying egalitarian value system ("We are all equal") that discourages *exceptionalism*, not just cutting down high achievers.
