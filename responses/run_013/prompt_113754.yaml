prompt: |-
  For some time now I have been collecting instances of a pattern in arguments about historical injustice, and I want to know whether the thing I am pointing at has a name, and — more to the point — whether anyone has done the work of marking its edges. I teach history at a secondary school and I sit on a small committee that advises our town on plaques and memorials, so I meet these arguments more often than most people, and I have stopped being able to tell what the people making them are actually committed to. The pattern is this. Someone claims that a country, a university, a city, or a family owes something on account of a wrong done long ago: that its present position was built on that wrong and that the debt has never been discharged. Someone else objects that they personally had nothing to do with it and were not yet born. And the reply is not that they did it after all, but that the question was never about them — that the thing which owes is the institution, which is not the same as the sum of the people currently inside it, and which has outlived every person who was around when the wrong was done. That reply seems to me to carry an enormous amount of weight without anyone stopping to ask what it presupposes. For it appears to require that the institution be the kind of thing that can be obligated across a complete turnover of its members; and yet, if I try to say that the institution is guilty, the very reasoning that made it a bearer of obligations seems to let it off the hook, since guilt as I understand it needs someone who could have acted otherwise and knew it, and the institution as it stands today contains no such someone. So I seem to be looking at an entity that can owe without being to blame — and what I notice in practice is that people make the claim in the vocabulary of blame and then, when pressed, restate it in the vocabulary of debt, or do the reverse and use the language of owing to keep a charge of guilt quietly in circulation.

  I have run into this in three places, only one of which is my own. In a local debate about renaming a building after a merchant whose fortune came out of a slave-trading concern, the alumni who objected kept saying that they had done nothing, and the reply kept being that the building belonged to the university and not to them. In discussions of national apologies, the same slide happens the other way: a head of state apologises on behalf of a nation whose citizens mostly have no connection to the wrong, the citizens are then invited to feel something about it, some do and some don't, and the apology is supposed to stand either way. And in a friend's family argument about an inheritance, the beneficiary who cheerfully concedes that the money is tainted still insists that he is not the one who did it, and everyone at the table seems to accept both statements at once. The phrase I keep reaching for is collective guilt, but that is plainly not what is happening in the cases that interest me, because in those cases the whole point is that nobody need be guilty; and it is not the idea that guilt is inherited down the generations either, since I can imagine a group owing repair with nobody, living or dead, at fault in the relevant sense — where the wrong was done by people acting in good faith under appalling norms. So the thing I am after is the narrower one: the bearer of an obligation that survives the replacement of every member, together with the rules, if there are any, that govern how such an obligation comes into being, how far it reaches, and when it lapses.

  I am not asking only for a label. If there is an established term, I want to know which of the several things I have described it actually covers and what it leaves out; if the literature has split my one pattern into three or four distinct notions, I would rather have the split than a single name that hides it. I would also like to know what the obligation is supposed to attach to — the persistence of an institution, the persistence of a benefit, or nothing more than the reuse of a name — because those give very different answers about when the thing ends: whether a beneficiary who gains nothing still owes, whether an institution can outlive its debt by rewriting its constitution, and whether the people asked to apologise are being asked to say something true or only to perform something useful. If nothing established fits, then give me a term and a definition, with a couple of cases on either side of the line and an honest note about where the line is arbitrary. I have read enough popular commentary to know all the standard moves; what I want is the kind of treatment that tells me what I am and am not committed to when I say that someone owes.
reasoning: |-
  Okay, this is a fascinating and nuanced query from someone deeply engaged with historical injustice debates. The user teaches history and serves on a memorial committee, so they're clearly wrestling with real-world applications, not just theoretical concerns. Their frustration with the "slide" between guilt and debt language is palpable - they've observed how activists and institutions alike toggle between moral blame and institutional obligation without clarifying the underlying framework.

  The core tension they've identified is razor-sharp: how can institutions bear obligations without moral agency, especially when membership completely turns over? Their examples (university building, national apology, inheritance) show this isn't abstract - it's about concrete disputes where emotions run high. What's impressive is their rejection of easy answers like "collective guilt" - they've already seen how that doesn't fit cases where no living person is blameworthy.

  Hmm, they're asking for precision about four key elements: (1) the obligation's source (institution? benefit? name?), (2) its lifespan (when does it expire?), (3) transfer rules (how does it bind new members?), and (4) the guilt/debt distinction. The demand for "cases on either side of the line" suggests they want analytical tools, not just labels.

  I recall Feinberg's "vicarious liability" concept from legal philosophy - it fits their inheritance example perfectly. And for institutions, French's corporate moral agency might help, though its metaphysical baggage worries me. The benefit-based approaches (Butt, Thompson) seem most promising for their cases where guilt is irrelevant but unjust enrichment persists. 

  Ah! The "successor obligation" framework from transitional justice literature could tie this together - it explicitly addresses how obligations transmit to new institutional iterations. That might satisfy their request for rules about inception/duration. Should emphasize how this differs from moral blame though, since that's their main concern.

  For boundaries: the slavery reparations case clearly qualifies, while a dissolved corporation wouldn't. The trickier case is rewritten constitutions - does new paper erase old debts? Probably need to flag that as contested territory. Also should note that the apology example involves performative speech acts, which operate differently from material reparations.

  Biggest challenge: avoiding jargon while preserving precision. Terms like "transgenerational obligation" might scare off a practitioner. Should anchor everything in their own examples...
answer: |-
  The pattern you're observing—where obligations persist through complete institutional turnover without attaching to individual moral guilt—is a recognized philosophical and legal problem. It intersects several established concepts but isn't fully captured by any single term. Below is a structured analysis of the phenomenon, drawing on relevant frameworks:

  ---

  ### **Core Concept: Institutional Obligation Without Moral Agency**
  Your description centers on **enduring institutional obligations** that survive generational change. Key elements:
  - The *obligated entity* is an institution (nation, university, family estate) as a persistent entity.
  - The *basis* is historical wrongs generating unpaid debts (not inherited guilt).
  - The *tension* arises from conflating **moral blame** (requiring agency) with **institutional liability** (requiring continuity).

  This is distinct from:
  - **Collective guilt**: Assigns blame to a group *as moral agents*.
  - **Inherited guilt**: Implies descendants bear personal culpability.
  - **Restorative justice**: Focuses on repair but doesn't resolve institutional metaphysics.

  ---

  ### **Frameworks for Understanding**
  #### 1. **Successor Obligation Theory**  
     - **Premise**: Institutions are "moral persons" (Peter French) with identities transcending individual members. Obligations bind the institution *as a continuous entity*.  
     - **Mechanism**:  
       - Obligation arises from **unjust enrichment** (e.g., wealth from slavery) or **harmful legacy** (e.g., stolen land).  
       - Persists as long as the institution benefits from the wrong *and* maintains identity.  
     - **Boundary Case**: A university renamed, relocated, and restructured with zero historical assets may lapse obligations.  
     - **Critique**: Overcomes guilt-agency problem but risks reifying institutions metaphysically.

  #### 2. **Benefit-Based Liability** (Daniel Butt)  
     - **Premise**: Obligations attach to **unjustly retained benefits**, not institutions per se.  
     - **Mechanism**:  
       - If Party A (e.g., a university) holds wealth acquired unjustly, *current members* bear duties to relinquish that wealth—not due to guilt, but to avoid complicity in injustice.  
       - **Key test**: Does the institution *still possess* ill-gotten gains? If assets are dissipated, obligations may cease.  
     - **Example**: Your friend's inheritance—beneficiaries owe repair if they retain tainted assets, regardless of guilt.  

  #### 3. **Transgenerational Continuity** (Janna Thompson)  
     - **Premise**: Nations/institutions have **diachronic identities** through shared narratives, laws, and commitments.  
     - **Mechanism**:  
       - Obligations bind via **promissory or reparative commitments** (e.g., treaties, apologies).  
       - Lapses only if the institution *formally repudiates* its identity (e.g., Germany post-1945 could not deny Nazi-era debts without ceasing to be "Germany").  
     - **Boundary**: A family that disavows its past (e.g., changes name, donates wealth) may dissolve obligations.

  ---

  ### **Rules for Obligation Inception/Duration**
  | **Basis of Obligation** | **Inception Trigger** | **Duration/Lapse Conditions** | **Your Cases** |
  |-------------------------|------------------------|--------------------------------|---------------|
  | **Unjust Enrichment** | Institution holds assets gained via injustice. | Until benefits are relinquished/repaired. | University building (if built with slave profits); inheritance. |
  | **Harmful Legacy** | Institution perpetuates structural harm (e.g., discriminatory policies). | Until harm is remedied and effects neutralized. | National apologies (if systemic inequality persists). |
  | **Commissive Identity** | Institution claims continuity with past (e.g., using a founder's name). | Until it renounces the identity/narrative linking it to the wrong. | Alumni defending a namesake; national apologies relying on historical continuity. |

  ---

  ### **Terminology & Gaps**
  - **Best Fit**: **"Institutional Successor Liability"** or **"Transgenerational Unjust Enrichment"**.  
  - **Gaps in Literature**:  
    - Little consensus on when institutional identity "breaks" (e.g., Is the UK the same entity as the British Empire?).  
    - Tension between **corrective justice** (repairing past wrongs) and **distributive justice** (current equity) unresolved.  
    - Apologies often function as **speech acts** (performative rituals) rather than admissions of liability—blurring moral/institutional lines.  

  ---

  ### **Practical Implications**
  1. **Obligation Without Benefit?**  
     - If an institution no longer holds tainted assets (e.g., slavery profits spent centuries ago), Butt argues obligations lapse. Thompson counters that *symbolic debts* (e.g., apologies) persist if identity remains.  
     - **Your Case**: A university with slave-built buildings *still benefits* (asset value); a nation apologizing for colonial harms may not.  

  2. **Constitutional Reset**  
     - Rewriting an institution’s constitution *may* break continuity if it explicitly repudiates past acts (e.g., post-apartheid South Africa). But if benefits remain, obligations likely endure.  

  3. **Apologies vs. Repair**  
     - National apologies are **performative**—they seek to reaffirm values, not assign guilt. Citizens are asked to *endorse* the gesture, not confess personal wrongdoing.  

  ---

  ### **A Proposed Definition**
  > **Transgenerational Institutional Debt**: An obligation borne by a persistent entity (nation, corporation, estate) to repair historical wrongs, arising from either (a) unjustly retained benefits, or (b) commissive identity continuity, and binding regardless of member turnover or moral innocence.  
  > **Boundaries**:  
  > - *In scope*: Universities benefiting from slavery; nations apologizing for colonial harms.  
  > - *Out of scope*: Dissolved entities (e.g., defunct slave-trading firm); individuals inheriting dissipated assets.  
  > - *Contested*: Families with symbolic heirlooms; nations that underwent revolution.  

  This framework separates **debt** (institutional/corrective) from **guilt** (moral/agentive), resolving your observed tension. When interlocutors slide between the two, they often conflate *who owes* (the institution) with *who acts* (its members)—a category error your committee can now name and dissect.
