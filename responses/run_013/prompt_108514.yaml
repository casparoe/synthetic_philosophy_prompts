prompt: |-
  Not a historian, just someone who reads too much about famines and has gotten into arguments about them. I keep circling the same three cases -- Bengal during the war, Ireland in the 1840s, China after the Great Leap Forward -- and I keep half-seeing a shape in them that I dont have a word for. Wondering if there's a name, or if I'm just pattern-matching.

  Heres the shape. In all three, whatever food there was didn't end up where the starving were: it went to the cities, to the army, to the export trade, to whoever could pay, or it stayed unharvested because the people who would have brought it in were dead or gone. The people who died were mostly the ones who grew the food, not the ones who could buy it. And as far as I can tell the authorities didn't respond by moving food to the hungry, they responded by keeping the system going -- same levies, same priorities, same rules -- and it looks to me like these things ease when the politics change rather than when the food shows up, though I might be wrong about that. In Ireland it's the blight, in Bengal it's the war, in China it's weather and bad planning, and all of that is true as far as it goes, but "the crop failed" doesn't cover the part where the grain goes past the people it was grown for.

  Is there a name for that part? I dont mean a polite way of saying "bad government". I mean the specific situation where a shortage turns into mass death because the rules for claiming food stop working for a whole class of people at once, and the people who could change those rules dont. And I'd want to know where the edges are: is it the same thing in all three cases or three different things wearing the same word? Where's the line between letting it happen and doing it? Does it still count when the shortage was real and not just a matter of who could pay?

  If it has no name, coin one, and tell me what it is and what it isn't. (Not after a reading list -- I'm after the idea.)
reasoning: |-
  Okay, the user is describing a recurring pattern they've noticed in three major famines: Bengal (1943), Ireland (1840s), and China (Great Leap Forward). They're seeing a common thread where food doesn't reach the starving populations due to systemic failures in distribution rather than absolute scarcity. The user wants to know if there's a term for this phenomenon where existing power structures and policies prevent food from being redirected to those in need during crises.

  The user explicitly states they're not a historian but someone deeply engaged with famine literature. They're frustrated by circular arguments and seeking conceptual clarity rather than academic citations. Their emotional tone suggests intellectual restlessness - they've spotted a pattern that feels significant but remains linguistically elusive. 

  Breaking down their core observations:
  1) Food exists but flows away from producers (to cities/military/export markets)
  2) Mortality concentrates among food producers themselves
  3) Authorities maintain pre-crisis extraction systems despite starvation
  4) Relief correlates more with political shifts than food availability
  5) They reject "crop failure" as sufficient explanation and resist oversimplified "bad government" framing

  The challenge is finding terminology that captures both the structural mechanics (distribution failure) and the political inertia (unwillingness to adjust systems). Existing famine studies concepts come to mind:
  - "Entitlement failure" (Sen) explains the mechanism but feels too academic/individualistic
  - "Political famine" is polemical and overbroad
  - "Systemic diversion" might work but lacks scholarly traction

  The key nuance is the maintained extraction - when crisis hits, the pre-existing flow of resources away from vulnerable groups continues or intensifies. This suggests coining "extractive persistence": 
  - "Extractive" captures the outward resource flow
  - "Persistence" implies active maintenance of that flow during crisis
  - It avoids moral judgment while highlighting systemic behavior

  Testing the term against their cases:
  Bengal: Rice continues to Calcutta/military despite rural starvation → extractive persistence
  Ireland: Grain exports continue during blight → extractive persistence
  China: Procurement quotas unchanged despite crop failures → extractive persistence

  The boundaries they asked about:
  - Real shortages don't invalidate the concept (all three cases had production declines)
  - Distinction from malice: persistence might be bureaucratic inertia rather than intent
  - Ends when political will overrides system maintenance (e.g. Ireland after 1847 policy shifts)

  This framing makes visible what "crop failure" obscures: starvation occurs not because food disappears, but because human systems keep moving it elsewhere as people die. That seems to be the "shape" they're grasping for.
answer: |-
  You're absolutely pattern-matching something real and crucial. The "shape" you're seeing is the **breakdown of distributional entitlements under systemic stress, compounded by political inertia or active prioritization of non-survival goals.** There isn't one universally agreed-upon term, but here's a breakdown of the concept and its boundaries:

  **Core Concept & Potential Names:**

  1.  **Entitlement Failure (Amartya Sen's framework - most established):**
      *   **What it is:** Sen argued famines aren't usually about absolute food shortage, but about the collapse of people's *entitlements* to food – their ability to legally *acquire* it through labor, trade, production, or social support. What you describe is a specific *type* of entitlement failure: **Systemic Distributional Entitlement Collapse**.
      *   **Why it fits:** In all your cases:
          *   Rural producers lost their labor-based entitlement (crop failure, displacement).
          *   Their market-based entitlement failed (prices soared, no money).
          *   State-based entitlements (relief, price controls, rationing) either didn't exist, were inadequate, or were actively diverted elsewhere (cities, military, exports).
      *   **Limitation:** "Entitlement failure" is broad. Your focus is on the *systemic maintenance* of extraction/diversion *despite* the crisis.

  2.  **Political Triaging / Caloric Prioritization:**
      *   **What it is:** The conscious or institutionalized decision by authorities to allocate scarce food resources towards groups deemed "essential" for political stability, war effort, or economic function (urban populations, military, bureaucrats, export markets for revenue), while accepting starvation among "non-essential" groups (often the rural poor).
      *   **Why it fits:** This directly addresses the "rules for claiming food stop working for a whole class of people" and "authorities didn't respond by moving food... kept the system going." Food *was* moved, just not to *them*.
      *   **Limitation:** Can imply more conscious, deliberate choice than bureaucratic inertia sometimes entails.

  3.  **Extractive Persistence:**
      *   **What it is:** The phenomenon where pre-existing systems of extraction (taxes, procurement quotas, market mechanisms favoring urban/elite consumption, export demands) *persist* or even *intensify* during a production crisis, directly draining food away from the producing regions and populations experiencing the shock.
      *   **Why it fits:** Perfectly captures Ireland (exports, rents), Bengal (urban/military supply chain), and China (procurement quotas). It highlights the *continuity* of the system as the lethal factor.
      *   **Limitation:** Less specific to food than the others.

  4.  **Famine by Distributional Fixity / Institutional Inertia:**
      *   **What it is:** The failure of institutions and policies to adapt to the crisis-induced shift in who needs food and where. The "rules" become rigid, prioritizing stability of the *system* (revenue collection, supply chains, ideological goals) over the biological survival of a segment of the population.
      *   **Why it fits:** Addresses your point about "the people who could change those rules don't" and "it looks to me like these things ease when the politics change."
      *   **Limitation:** A bit clunky, but accurate.

  **Your Coined Term: "Extractive Persistence"** feels strong, combining the mechanism (extraction) with the fatal continuity (persistence). It emphasizes the *system* working as designed, just lethally so under stress.

  **Boundaries & Nuances (Answering Your Questions):**

  1.  **Is it the same in all three?** The *core mechanism* (systemic diversion/persistence despite crisis) is fundamentally similar. The *motivation* varies:
      *   **Ireland:** Colonial economic ideology (free market, laissez-faire), landlord interests, racial prejudice.
      *   **Bengal:** Wartime priorities (supply army/Calcutta factories), administrative chaos, incompetence, possibly Malthusian neglect.
      *   **China:** Ideological rigidity (denying failure), prioritizing rapid industrialization/urban stability, punishing perceived non-compliance.
      *   **The common thread:** Survival of the affected rural population was *not* the paramount political or institutional priority.

  2.  **Letting it Happen vs. Doing it:** This is the spectrum from **Negligence/Inertia** to **Active Prioritization/Policy.**
      *   **Letting it Happen (Negligence/Inertia):** Failing to suspend normal rules (quotas, taxes, exports), failing to organize relief, bureaucratic delays/incompetence (elements in Bengal, arguably initial Irish response).
      *   **Doing it (Active Prioritization):** Enforcing procurement quotas despite starvation (China), diverting shipping/men/resources *away* from famine areas for war (Bengal), maintaining exports based on ideological principle (Ireland).
      *   **The Line:** It blurs. Persisting with extractive systems *knowing* they cause starvation is arguably active, even without "malicious intent." The key is the *choice* to maintain the system over adapting it for survival.

  3.  **Does it Count with Real Shortage?** **Absolutely.** This is crucial. Sen's core insight was that even with reduced aggregate supply, mass starvation is *always* about distribution failure. A real shortage makes the problem harder, but the *pattern of who starves* is determined by who loses their entitlement first and most completely – which is defined by the pre-existing and persistently applied rules of the system (rural laborers, smallholders). Real shortage + extractive persistence = guaranteed catastrophe.

  **What it IS and ISN'T:**

  *   **IS:**
      *   A failure of *distribution*, *access*, and *entitlement*, not necessarily absolute supply.
      *   Characterized by the *continuation* or *intensification* of pre-crisis resource extraction/diversion mechanisms.
      *   Driven by political choices, institutional priorities, or ideological rigidity that values other goals (stability, revenue, war, ideology) over the survival of specific groups.
      *   Results in mass mortality concentrated among the producers or those with the weakest market/political power.
      *   Ends when political will shifts to prioritize survival and overrides the extractive systems (e.g., end of Irish exports post-1847, belated relief efforts in Bengal, post-GLF policy shifts in China).

  *   **ISN'T:**
      *   **Simply "bad government":** It's a specific *type* of governance failure under stress – the failure to adapt extractive/distributional systems to crisis.
      *   **Pure malice (though it can involve it):** Often involves negligence, incompetence, ideological blindness, or prioritizing "the greater system" over a segment.
      *   **Just "hoarding" or "speculation":** While these occur, they are symptoms enabled by the systemic failure of entitlements and lack of state intervention to protect the vulnerable.
      *   **An Act of God:** The natural trigger (blight, war disruption, drought) is necessary but *not sufficient*. The man-made system determines who starves.

  **Conclusion:** You've identified the critical, human-made core of these famines: **The lethal persistence of extractive and distributional systems that divert food away from its producers during a crisis, due to political choices prioritizing other goals over their survival.** "**Extractive Persistence**" is a strong, descriptive term for this core mechanism. "**Systemic Entitlement Collapse**" or "**Political Caloric Triaging**" also capture key aspects. The key is recognizing that the famine's *social shape* is molded by the unyielding rules of the system in which the natural disaster unfolds.
