prompt: |-
  I've somehow ended up as the person deciding how a small foundation spends about £1.5m over three years on "analogy as the core of cognition" — basically the Hofstadter-and-Sander picture, the idea that analogy isn't a party trick but the engine of thought, that categorisation, memory retrieval, problem-solving and even perception are all analogy underneath. I'm not a cognitive scientist; I did a philosophy degree, read Surfaces and Essences on a beach one summer and got a bit evangelical about it, and now I have to justify a portfolio to a board who mostly want to know what we'd actually be buying. I dont want a literature review or a reading list — I want you to tell me which open questions in this programme are genuinely worth money, in order, and why.

  To make it concrete, here's the mess I'm staring at. A colleague I trust keeps saying the field is stuck on retrieval and has barely touched what she calls "generative analogy" — the case where you build a new abstraction on the fly because there's simply no ready-made source concept to map from — and she reckons that's where the real cognitive action is, not the "this is like that" examples everyone trots out in talks. Someone else insists the whole thing founders on measurement: we've got no agreed way to say one analogy is deeper or better than another except by shrugging and asking a human, so every empirical claim is soft. And then there's the nagging worry about whether the current crop of large language models, which seem to do something that looks like analogy by gliding around in a vector space, either vindicates the programme or quietly shows that the interesting human capacity is something else entirely.

  I'd like your prioritisation to weigh how upstream each question is (how many other things get easier if it's settled), how tractable it is for a small interdisciplinary team rather than a giant lab, how neglected it is, and roughly what kind of result over the next three years would move it up or down my list. Also tell me which of the things people get excited about in this area I should politely ignore, because their answer wouldn't change anything downstream. Feel free to add questions I haven't listed if they deserve to outrank mine — just show me the reasoning, not a survey.
reasoning: |-
  Okay, let me unpack this. The user is in a high-stakes position: they control £1.5m for funding analogy-as-cognition research but lack specialized training, having come through philosophy and Hofstadter's pop-sci work. Their board wants concrete deliverables, not academic exercises. The core tension is between three concerns: (1) their colleague's push for "generative analogy" (abstraction-on-the-fly), (2) the measurement problem in evaluating analogies, and (3) LLMs' apparent challenge to the human analogy mechanism.

  Hmm, the user's phrasing suggests urgency and skepticism—words like "stuck," "founders," and "nagging worry" indicate they need defensible priorities, not just interesting ideas. The unspoken pressure point is justifying this spend against competing foundations doing more applied work. They’re implicitly asking: "What would make this investment non-fungible?"

  First, the retrieval vs. generation debate. The colleague is right that most cognitive models (like Structure-Mapping Engine) handle retrieval-heavy cases well but stumble when no prior schema exists. But calling generation "the real cognitive action" oversells it—perception and categorization are still foundational. The key is that generative analogy bridges to creativity and insight, which are harder to automate. If LLMs struggle here (they do), that’s precisely where human cognition shines. Funding priority: high.

  The measurement problem is thornier. Current metrics like Sapper’s "structural evaluation" or Gentner’s systematicity principle are either lab-bound or subjective. Without quantitative rigor, the field can’t benchmark progress. But solving this completely in three years? Unlikely. A better angle: fund proxies for depth—like neural biomarkers during insight moments or computational irreducibility measures. Medium priority because it enables other work.

  LLMs... ah. The user’s worry is spot-on. Transformer attention looks like analogy but is really statistical pattern-gliding. Hofstadter himself frets about this. The existential question isn’t "Do LLMs do analogy?" but "What gaps persist when they fail?" Those gaps (e.g., generating truly novel abstractions from sparse data) define the human edge. This should frame the entire portfolio—don’t ignore LLMs, weaponize their limitations.

  Now, what’s missing? The user hasn’t mentioned development (how analogy evolves from child to adult) or domain-specificity (e.g., why fluid analogies in art but rigid ones in law?). Both matter for tractability: child studies offer cleaner models than adult brains, and domains constrain the measurement problem.

  Prioritization logic: 
  - Upstreamness: Generative analogy > Measurement > LLM gaps. Why? If you crack generation, it forces better measurement and explains where LLMs fall short. 
  - Tractability: Start with bounded domains (e.g., tool innovation) before open-ended creativity. 
  - Neglect: LLM contrast studies are emerging; generative analogy has fewer players. 
  - Kill darlings: Don’t fund neural correlates without behavioral hooks, or "analogy in AI" without cognitive falsification tests.

  Three-year deliverables: 
  1. A computational model of generative analogy that outperforms LLMs on sparse-data insight puzzles. 
  2. A behavioral+EEG protocol quantifying abstraction depth. 
  3. Case studies showing where human analogizers beat machines in real-world innovation.

  The board wants to "buy" distinction. So position this as: "We fund what makes human thought irreplaceable."
answer: |-
  Based on your constraints—focusing on cognitive leverage, tractability for small teams, neglect, and concrete deliverables—here’s a ruthless prioritisation of where £1.5m could force genuine breakthroughs in the Hofstadter-Sander programme. I’ve ranked questions by **impact-if-solved**, **neglect**, and **feasibility of a 3-year payoff**, while flagging dead ends.

  ### Top Priority: Generative Analogy (Your Colleague’s Pick)  
  **Why it dominates:**  
  - **Upstreamness:** Cracking how humans build *new* abstractions (e.g., inventing "gravity" from falling apples/moons) would explain creativity, insight, and conceptual change—core to Hofstadter’s claim that analogy *is* cognition. Solve this, and retrieval, categorisation, and problem-solving become special cases.  
  - **Neglect:** 95% of analogy research focuses on mapping *existing* structures (e.g., "solar system atom" or standardized tests). Generative analogy lacks even a formal framework.  
  - **Tractability:** Small teams excel here—it requires cognitive ethnography (studying real-time invention in labs/workshops), computational modeling, and behavioral experiments. No need for big fMRI budgets.  
  - **3-Year Goal:** A computational model that generates novel abstractions from sparse inputs, validated against human innovation benchmarks (e.g., redesigning tools from ambiguous prompts).  
  - **Ignore:** "Better retrieval algorithms." Retrieval is a solved engineering problem (e.g., vector search); it doesn’t touch cognition’s core.  

  ### #2: The Measurement Problem ("How deep is this analogy?")  
  **Why it matters (but can’t be #1):**  
  - **Upstreamness:** Without metrics, you can’t compare models or data. But measurement alone won’t explain cognition—it’s an enabler.  
  - **Neglect:** Field uses hand-wavy criteria ("systematicity," "sweetness"). No unit exists for abstraction depth.  
  - **Tractability:** A small team could develop *proxies*:  
    - Behavioral: Quantify inference transfer (e.g., how many novel predictions spawn from an analogy).  
    - Computational: Measure the compressibility of an analogy’s source-target mapping (higher compression → deeper).  
    - Neuro: EEG signatures of insight (e.g., P300 or gamma bursts during "aha!").  
  - **3-Year Goal:** A validated metric suite showing 80%+ agreement with human expert rankings of analogy depth.  
  - **Ignore:** Neuroscientific "analogy localization." Knowing *where* it happens won’t tell us *how* it works.  

  ### #3: LLMs as Contrast Cases (Your Nagging Worry)  
  **Why it’s critical but limited:**  
  - **Upstreamness:** LLMs excel at shallow, statistical analogies but fail at generative abstraction. Studying *why* they fail isolates what’s uniquely human.  
  - **Neglect:** Most LLM analogy papers celebrate superficial successes; few probe failures systematically.  
  - **Tractability:** Fine-tuning LLMs on generative tasks (e.g., inventing metaphors for unknown phenomena) and testing humans on the same. Small teams can run these comparisons.  
  - **3-Year Goal:** A taxonomy of analogy types where humans consistently outperform LLMs, with a cognitive hypothesis for *why* (e.g., "humans compress relational structures; LLMs interpolate").  
  - **Ignore:** "Do LLMs do analogy?" Yes, trivially—but they don’t replicate human cognition. Focus on the *gap*.  

  ### Lower Priority / Avoid:  
  - **Categorisation-as-Analogy:** Well-trodden. Hofstadter/Sander already showed this—funding here yields diminishing returns.  
  - **Perception-as-Analogy:** Too philosophical; hard to test. Would eat budget for little leverage.  
  - **Domain-Specific Analogies (e.g., in science education):** Applied work—wait for generative/measurement tools first.  

  ### Missing Question Worth Adding: **Developmental Trajectory of Generative Analogy**  
  - **Why rank it #4?** If generative analogy is core, how do children learn it? Untangling this (e.g., via kid-invention experiments) reveals cognitive prerequisites.  
  - **Upstreamness:** Identifies which components are innate vs. learned.  
  - **Tractability:** Child development labs can run controlled studies (e.g., "invent a tool for aliens" tasks).  
  - **3-Year Goal:** A model predicting stages of abstraction-building in 3–10-year-olds.  

  ### Strategic Allocation for 3 Years:  
  | **Focus**               | **Budget** | **Team Composition**          | **Deliverable**                                  |  
  |--------------------------|------------|------------------------------|--------------------------------------------------|  
  | Generative Analogy       | £700k      | 2 cognitive scientists, 1 computational modeler, 1 ethnographer | Model + human benchmark data for novel abstraction |  
  | Measurement Proxies      | £400k      | 1 psychometrician, 1 ML engineer, 1 behavioral researcher | Validated depth metric suite                     |  
  | LLM-Human Contrasts      | £300k      | 1 AI researcher, 1 cognitive psychologist | Failure taxonomy + cognitive gap explanation     |  
  | *Developmental Trajectory | £100k*     | *1 developmental psychologist* | *Pilot data for stage model*                     |  

  ### When to Pivot:  
  - **Generative analogy:** If Year 1 yields no plausible models, shift funds to measurement.  
  - **Measurement:** If proxies don’t correlate with human judgment by Year 2, focus on inference-transfer metrics alone.  
  - **LLMs:** If a breakthrough (e.g., GPT-5 aces generative tasks), redeploy to developmental or cross-species work.  

  ### The Board’s Bottom Line:  
  You’re buying **a) a theory of human innovation** (generative analogy), **b) tools to quantify breakthroughs** (measurement), and **c) clarity on why humans still matter** (LLM contrasts). In 3 years, you’ll have concrete models, datasets, and a framework to explain—not just describe—cognition. Ignore everything else.
