  Here's a close reading addressing the conceptual gap you've identified, focusing on the tension between sensory perception and "reason" in Montaigne's opening, and its implications for the essay's treatment of Brazil:

  **Deconstructing the Opening Anecdotes & Maxim:**

  1.  **The Anecdotes: Sensory Override, Not Rational Judgment:** You're correct. Pyrrhus, Philip, and the Greeks don't *reason* their way to a new conclusion. They *see* ("viewed and considered," "beholding... the order and distribution"). The revision is direct, sensory, and experiential: the visual evidence of disciplined order contradicts the abstract, inherited label "barbarian." The mechanism is fundamentally empirical and perceptual. The label falls away because observation *shows* it doesn't fit *this specific, visible aspect* (military organization). Crucially, it's a *negative* judgment: "has nothing of barbarism in it." They don't necessarily grasp the *essence* of Roman culture; they see one complex, ordered practice that clashes with the simplistic stereotype.

  2.  **The Maxim: A Leap to Universal Reason?** Montaigne's conclusion ("By which it appears...") *seems* to draw a broader, more rationalist lesson:
      *   **"Cautious... of taking things upon trust from vulgar opinion":** This aligns with the anecdotes. "Vulgar opinion" here is synonymous with the unexamined, culturally inherited prejudice ("barbarian" as a blanket term). The anecdotes warn against accepting such labels uncritically.
      *   **"Judge by the eye of reason, and not from common report":** This is the conceptual leap. "Common report" subtly shifts from the specific prejudice ("barbarian") to a broader category encompassing all second-hand information. More significantly, "the eye of reason" replaces the *sensory* "eye" of the anecdotes. Reason is invoked as an active, adjudicating faculty capable of forming positive judgments ("judge"), implying a universal standard discernible through rational inquiry, distinct from both sensory input and received opinion.

  3.  **The Gap & Its Significance:** The gap is stark. The anecdotes demonstrate the *limitations* of labels when confronted with direct sensory evidence of complexity. They showcase the *collapse* of a prejudice under empirical pressure. The maxim, however, posits "reason" as a *positive, alternative source* of judgment, potentially implying access to universal truths. The anecdotes emphasize *seeing* to *disprove*; the maxim suggests *reasoning* to *prove* or *establish* judgment. Furthermore, the conflation of "vulgar opinion" (inherently pejorative, prejudiced) with "common report" (simply non-firsthand information) is problematic. Montaigne seems to be setting up "reason" as the antidote to *all* non-rational sources, including potentially valid testimony or cultural knowledge.

  **The Maxim as Rhetorical Setup, Not Doctrine:**

  Your instinct about the rhetorical function is crucial. This maxim *is* likely a deliberate setup, a familiar Renaissance trope invoking Socratic/Stoic ideals of rational judgment against popular error. It establishes an expectation of rational inquiry the essay will then *complicate* and *undermine*, particularly regarding reason's ability to access universal standards or judge fairly across cultures.

  **How This Distinction Bears on the Treatment of Brazil:**

  The gap between sensory experience and the promise of "reason" established at the outset becomes the engine driving Montaigne's argument about the Brazilians:

  1.  **Replicating the Anecdotal Structure (Sensory Correction):** Montaigne immediately applies the Pyrrhus model to the Brazilians. He counters the "vulgar opinion" labeling them "barbarous" by presenting detailed, sensory-rich *descriptions* of their society: their physical prowess, natural environment, warfare practices, social structures, language, and even their cannibalism. Like Pyrrhus seeing the Roman camp, Montaigne forces the reader to *see* the complexity and internal logic ("order") of Brazilian life that defies the simplistic "barbarian" label. The emphasis is on concrete observation ("I have had... a man that lived... ten or twelve years... in that place...", detailed accounts of practices) overcoming abstract prejudice.

  2.  **Undermining the "Eye of Reason" as Universal Adjudicator:** This is where the essay complicates the opening maxim.
      *   **Reason's Failure in Europe:** Montaigne doesn't present European "reason" as the solution. Instead, he launches a devastating critique of European practices *using* a form of reason – comparative analysis. He contrasts Brazilian cannibalism (ritualized, post-mortem, against enemies) with European atrocities (torture during religious wars, cruelty towards neighbors and fellow citizens). The "eye of reason" here exposes the *unreason* and hypocrisy of European "civilization." Reason becomes a tool for relativizing *his own culture*, revealing its barbarity *by its own standards* ("we may then call these people barbarous, in respect to the rules of reason, but not in respect to ourselves, who in all sorts of barbarity exceed them").
      *   **The Limits of Rational Judgment:** Montaigne doesn't ultimately claim that "reason" provides a single, objective standard by which to *positively* judge the Brazilians as "good" or Europeans as "bad." He uses reason to dismantle European pretensions to superiority and to show the *internal rationality* of Brazilian customs within their own context ("every one gives the title of barbarism to everything that is not in use in his own country"). Reason demonstrates the *relativity* of judgment and the danger of applying one culture's standards to another. The "eye of reason" isn't perceiving universal moral truths; it's perceiving the *contingency* and *perspectival nature* of all judgments.
      *   **Reason vs. Nature:** The essay subtly contrasts European "reason" (which produces sophisticated cruelties, political treachery, and unnatural desires) with Brazilian closeness to "nature" (presented as simpler, more authentic, governed by natural needs and virtues like valor). True "reason," Montaigne implies, might lie closer to following nature's laws than in the artificial complexities of European civilization. This further relativizes the opening's invocation of "reason," suggesting the European version might be deeply flawed.

  3.  **The Irony of the Maxim:** The opening maxim, read in light of the whole essay, becomes deeply ironic. Montaigne *does* warn against "vulgar opinion" – the reflexive labeling of Brazilians as barbarous. But "judge by the eye of reason" doesn't mean accessing a universal standard. It means:
      *   Suspending inherited prejudice (like Pyrrhus).
      *   Looking closely at the *specific practices* and their *internal logic* within their own context.
      *   Using comparative reason to expose the hypocrisy and barbarity of one's *own* culture's practices.
      *   Recognizing that "reason" itself is culturally conditioned and incapable of providing absolute, cross-cultural moral adjudication. The true "eye of reason" sees the *limits* of reason as a tool for universal judgment.

  **Conclusion:**

  The gap you identified is not a slip but the essay's core dialectic. The opening anecdotes use sensory experience to negate prejudice, while the maxim falsely promises "reason" as a positive, universal adjudicator. Montaigne then spends the essay honoring the spirit of the anecdotes – meticulously describing Brazilian practices to dismantle European prejudice – while simultaneously exposing the hubris and limitations inherent in the maxim's implied rationalism. The "eye of reason," when turned on Europe, reveals barbarity; when turned on Brazil, reveals comprehensible order within its own frame; but crucially, it reveals the impossibility of a single, objective rational standard transcending culture. The essay's power lies not in defending universal reason, but in using a *form* of skeptical, comparative reasoning to destabilize European certainties and force a Pyrrhus-like reevaluation based on observation and contextual understanding, ultimately showing that "reason" itself is a product of perspective and cannot escape the relativism the maxim initially seemed to deny. The Brazilians aren't judged "superior" by reason; European pretensions to superiority are judged *unreasonable* by the very faculty Europe claims as its own.
