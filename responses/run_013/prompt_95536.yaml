answer: |-
  ### Deliverable 1: Examination Question

  **BAYVIEW AND THE INDIVIDUALIST RESTRICTION**

  In the town of Bayview (200,000 adults), a public health authority must choose between two twenty-year programs:

  *   **Universal Program:** Every resident bears a moderate burden, losing roughly six months of healthy functioning (experienced as a chronic but manageable condition). No one dies early.
  *   **Selective Program:** A single resident, chosen by fair lottery, loses about twenty years of healthy life and dies roughly twenty years earlier than otherwise. The other 199,999 residents bear no burden. All residents are equally situated and deserving.

  Contractualism, particularly Scanlon's formulation, holds that an act is wrong if its performance under the circumstances would be disallowed by any set of principles for the general regulation of behaviour that no one could reasonably reject as a basis for informed, unforced general agreement. Central to this framework is the **Individualist Restriction**: we assess whether an individual can reasonably reject a principle by looking at the burdens *that individual* would bear under it, compared to alternative principles. We do not aggregate the smaller burdens of many individuals to outweigh a larger burden to one individual.

  **Answer all parts:**

  1.  **Application:** Which program would contractualism endorse? Justify your answer by applying the contractualist framework and the individualist restriction directly to the Bayview case. Explain clearly why one program's principle is uniquely defensible or why the other is reasonably rejectable. (Approx. 400 words)
  2.  **The Aggregation Asymmetry Challenge:** Contractualism forbids aggregating distinct individuals' small burdens (e.g., 200,000 instances of 6 months loss) to outweigh one large burden (e.g., 1 instance of 20 years loss). However, it *must* allow aggregating the many small temporal components that constitute a *single individual's* large burden (e.g., treating 20 years as the sum of ~7,300 days lost). Is this asymmetry principled or ad hoc? Articulate the strongest case for each position. Does this challenge undermine contractualism's verdict in Bayview? (Approx. 400 words)
  3.  **Implications:** Drawing on your analysis of Bayview and the aggregation asymmetry, what does this case reveal about contractualism's capacity to handle trade-offs involving very small harms to very many people versus very large harms to very few? Should contractualists refine their view, or is the verdict in Bayview a defensible (if counterintuitive) consequence of its core commitments? (Approx. 400 words)

  ---

  ### Deliverable 2: Model Answer (Approx. 800 words)

  **(1) Contractualism decisively endorses the Selective Program in Bayview.** The core task is comparing principles permitting each program. The principle permitting the Universal Program ("P-U") allows imposing a moderate burden (6 months loss of healthy function) on *every individual*. The principle permitting the Selective Program ("P-S") allows imposing a catastrophic burden (20 years loss of life) on *one randomly selected individual* while imposing no burden on others.

  The Individualist Restriction is paramount. To assess reasonable rejectability, we consider the complaint each individual *could* raise against a principle, based *only* on the burdens *they themselves* bear under it compared to alternatives. Under P-S, 199,999 individuals bear no burden whatsoever – they have no complaint against P-S. Only the selected individual has a complaint: the devastating loss of 20 years of life. Under P-U, *every single individual* bears a significant burden: the loss of 6 months of healthy functioning. While moderate, this burden is non-trivial and impacts well-being.

  Now, compare the complaint of the individual burdened under P-S to the complaint of *any single individual* burdened under P-U. The complaint against P-S (losing 20 years) is vastly greater than the complaint of any single individual against P-U (losing 6 months). Crucially, the Individualist Restriction forbids aggregating the 200,000 moderate complaints under P-U to outweigh the single massive complaint under P-S. We can only compare burdens *one individual at a time*. Therefore, each individual, considering only their *own* potential burden, would reasonably reject P-U if P-S were an option. Why? If P-S is chosen, each individual faces a *very high probability* (199,999/200,000) of bearing *no burden at all*, and only a minuscule probability (1/200,000) of bearing the catastrophic burden. Under P-U, each individual faces a *certainty* of bearing the moderate burden. The expected burden for each individual is far lower under P-S than P-U. More fundamentally, each individual can reasonably reject P-U because the principle imposes a definite, significant cost on them when an alternative principle (P-S) exists that gives them a very high chance of avoiding *any* cost, while imposing a similarly definite but vastly larger cost only on one other person. Since this reasoning holds for every individual, P-U can be reasonably rejected by everyone. P-S, in contrast, cannot be reasonably rejected by the 199,999 who bear nothing. Only the selected individual could reject it, but their objection is weaker than the objections *everyone* has to P-U, because while their burden is immense, the alternative (P-U) imposes a definite, significant burden on everyone, including them. The selected individual under P-S cannot claim they are being asked to bear a burden *for the sake of others* that is worse than the burden *they themselves* would have to bear under the alternative (P-U). They bear a larger burden under P-S, but under P-U they would still bear a significant burden. The sheer magnitude difference means the complaint of the one under P-S is not clearly stronger than the complaint *each individual* has against P-U.

  **(2) The asymmetry between aggregating across persons and aggregating within a life is principled, not ad hoc, but it highlights a deep tension.** The challenge is potent: Contractualism forbids summing 200,000 small complaints (6 months each) to outweigh one large complaint (20 years). Yet, it *requires* summing 7,300 small temporal losses (days) to constitute the *size* of the single large complaint in the first place. Is this inconsistent?

  The strongest case for the asymmetry being principled rests on the fundamental contractualist commitment to *person-centered justifications*. Complaints belong to *persons*. A "complaint" is a moral objection an individual can raise based on how a principle affects *their life*. The loss of 20 years is a single, coherent complaint belonging to one individual because it represents a catastrophic disruption *to that person's life plan, identity, and overall good*. Aggregating across persons is forbidden precisely because it merges distinct *sources* of complaint (different lives) to override the complaint stemming from one life. Aggregating within a life is necessary because a complaint's *magnitude* is determined by the impact on that *single life as a whole*. The 20 years *is* the unified burden on that person; it is not 7,300 independent complaints. To deny this internal aggregation would be incoherent – it would dissolve the very notion of a burden's size, making all complaints atomic and incomparable.

  The strongest case for the asymmetry being ad hoc argues that the "unity" of a life doesn't magically solve the aggregation problem. Why does the spatial/temporal location of the losses within one biological entity grant moral permission to sum them, while losses spread across different entities forbids summation? From an impersonal perspective (which contractualism rejects, but the challenge presses), both involve summing units of disvalue (e.g., days of healthy life lost). If summing many small disvalues across persons is morally meaningless, why is summing many small disvalues within a person morally significant for determining complaint strength? It seems the view relies on the metaphysical unity of persons but struggles to explain why *that particular unity* is morally decisive for aggregation *within* but not *across*. This challenge doesn't *immediately* undermine the Bayview verdict, as the core person-centered comparison (one huge burden vs. one moderate burden per person) still holds. However, it casts doubt on the *foundations* of how complaint magnitude is determined and potentially weakens the intuitive force of treating the 20-year loss as a singular, incomparably large objection compared to the "sum" of the 6-month losses.

  **(3) Bayview starkly reveals contractualism's core strength and limitation.** Its strength is its resolute focus on the individual's perspective: no one can be sacrificed simply because aggregating many small gains for others outweighs their catastrophic loss. The verdict for Selective is a defensible, albeit severe, consequence of this commitment. It prioritizes protecting each individual from being used as a mere means to distribute burdens widely but shallowly.

  However, the case also exposes contractualism's limitation: its difficulty in morally acknowledging the cumulative weight of widely dispersed small burdens *as such*. When the number of people affected is very large and the individual burden is non-trivial (like 6 months), the intuitive sense that "this adds up to a huge total burden" finds no direct purchase in contractualist reasoning. The aggregation asymmetry challenge underscores this limitation by questioning the coherence of how complaint size itself is constituted.

  Contractualists should refine their view by explicitly grappling with the metaphysics of complaint magnitude and harm aggregation within a life. However, they should *not* abandon the Bayview verdict to accommodate aggregation across persons. To do so would surrender the core individualist insight. The cost of the Selective verdict – potentially allowing immense suffering to one to avoid moderate suffering to all – is high, but it is the price of taking the separateness of persons and the individualist foundation of reasonable rejection seriously. The alternative, allowing cross-personal aggregation, risks collapsing contractualism into a form of rule utilitarianism and sacrificing its distinctive moral force. Bayview thus stands as a challenging but necessary test case for the theory's integrity.

  ---

  ### Deliverable 3: Marking Scheme (20 Marks Total)

  1.  **Correct Application of Individualist Restriction to Bayview (4 marks):** Clearly identifies Selective as the contractualist choice and explains why using the individualist restriction (comparing individual burdens one-by-one, rejecting aggregation across persons, showing why P-U is rejectable by all). *Common Mistake (costs mark):* Claims Universal is chosen by aggregating small burdens or implies the "sum" of moderate burdens outweighs the large one; or focuses solely on the one person under Selective without comparing to the burden *each* faces under Universal.
  2.  **Precise Characterization of Aggregation Asymmetry (4 marks):** Accurately defines the asymmetry (no cross-person aggregation of burdens vs. necessary intra-person aggregation of temporal/harm components to form a single complaint's magnitude). *Common Mistake (costs mark):* Conflates the two types of aggregation or misstates the asymmetry (e.g., says contractualism forbids *all* aggregation); fails to articulate the challenge to coherence.
  3.  **Substantive Critique of Asymmetry (4 marks):** Presents the strongest argument *for* the asymmetry being principled (person-centeredness, complaint unity) AND the strongest argument *against* (questioning the moral relevance of biological unity for aggregation, potential incoherence in magnitude determination). *Common Mistake (costs mark):* Only presents one side; retreats to generic "contractualism can't handle numbers" without engaging the specific asymmetry; asserts the asymmetry is incoherent without argument.
  4.  **Coherent Verdict & Acknowledged Costs (4 marks):** States a clear verdict for Bayview (defending Selective) and explains *why* contractualism must bite the bullet OR argues for a different verdict based on the critique, explicitly stating the cost to contractualist commitments. *Common Mistake (costs mark):* Concludes vaguely ("it's complicated"); claims Selective is chosen without addressing the asymmetry challenge; argues for Universal without explaining how this fits contractualism or what core commitment it abandons.
  5.  **Implications Beyond the Case (4 marks):** Insightfully discusses what Bayview reveals about contractualism's handling of small-many vs. large-few trade-offs and takes a position on refinement vs. acceptance of costs. *Common Mistake (costs mark):* Only repeats points from parts 1/2; offers trivial implications; fails to connect the asymmetry challenge to the broader limitation.

  ---

  ### Deliverable 4: A vs. B Distinction

  *   **A Answer:** Demonstrates deep understanding by seamlessly integrating the Bayview verdict with the aggregation asymmetry challenge, using the latter to expose a fundamental tension *within* contractualism's conception of complaint magnitude itself. It articulates the cost of the verdict (prioritizing individual catastrophe over widespread moderate harm) not just as a consequence but as a necessary implication illuminating the theory's core commitment and its potential limitation, offering a nuanced reflection on refinement possibilities without abandoning core tenets.
  *   **B Answer:** Correctly applies contractualism to Bayview and identifies the aggregation asymmetry challenge, but treats them as somewhat separate points. It accurately rehearses the arguments for/against the asymmetry and states the verdict's cost, but lacks the synthesis that shows *how* the challenge probes the foundations of complaint size and the profound nature of the trade-off Bayview forces upon contractualism.
