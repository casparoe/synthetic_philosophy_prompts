  Looking at their deliverables: the question needs to be answerable in 90 minutes/1200 words; a model answer taking a definite position; a marking scheme with 5 must-hit points; and a brief note distinguishing A from B answers. Everything must be citation-free since it's a closed-book exam.

  For the exam question itself, I'll structure it in three parts: (1) state the contractualist verdict and justify it using the individualist restriction, (2) critically examine whether this distinction is principled by focusing on the "single complaint" issue, and (3) explore implications for how contractualism should weigh large individual harms against small widespread ones. This covers application, critique, and implications.

  The model answer should defend the selective program as the contractualist choice while frankly acknowledging the tension in aggregating within lives. It must argue that the asymmetry is principled because complaints are person-centered, but concede this requires biting the bullet on non-aggregation. I'll aim for 800 words of tight argumentation.

  For the marking scheme, the five key points should be: correct application of individualist restriction to Bayview (4 marks); precise characterization of the aggregation asymmetry (4 marks); substantive critique rather than recitation (4 marks); coherent verdict with costs acknowledged (4 marks); and conceptual implications beyond the case (4 marks). I'll note common pitfalls for each, like misstating the restriction or retreating to utilitarianism.

  Finally, the A/B distinction: A answers will synthesize the tension into an original challenge for contractualism, while B answers just identify it superficially. The best responses should question whether "complaint magnitude" itself presupposes aggregation.

