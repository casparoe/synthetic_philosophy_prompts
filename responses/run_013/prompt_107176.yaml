       - They must return their blue chips used in the bid to the bank (whether they win or lose).
     - Unsuccessful Aspirants: Keep their remaining blue chips and gold.

  4. **Family Planning Phase (All players):**
     - Each player decides privately how many children they want (0, 1, or 2). They write it on a slip and hand it to the facilitator.
     - The cost of having children:
       - **Elites**: Each child costs 2 gold chips (paid to the bank).
       - **Aspirants**: Each child costs 1 gold chip (paid to the bank).
       - **Commoners**: Each child costs 0.5 gold chips (rounded up: so 1 child costs 1 chip? But we want to encourage growth in prosperity, so maybe adjust). Instead, to keep it simple: Commoners can have up to 2 children at no cost? But we want to model that prosperity leads to more aspirants. Let's adjust:

     Revised: 
       - The cost of children is in gold chips. Each child costs:
          - Elite: 2 gold
          - Aspirant: 1 gold
          - Commoner: 0 gold (but they must have at least 1 gold to support a child? Not necessary. We want commoners to have more children when they are prosperous, but they have little gold. So instead, we can say: Commoners can have up to 2 children without paying, but if they are very poor (0 gold) they can only have 1? This complicates. 

     Alternative: **No cost for children for any class?** But then what controls population? We want the number of aspirants to grow when the society is prosperous. Instead, let's have:

     - Each player (regardless of role) may have 0, 1, or 2 children. 
     - However, having children requires a minimum wealth threshold to support them (to avoid overcomplication, we can skip cost and just let them choose). But then we lose the connection to prosperity.

     Better: 
       - **Elites**: Must pay 2 gold per child to the bank. If they cannot pay, they can only have 0 or 1 child (they choose, but must pay for what they choose).
       - **Aspirants**: Must pay 1 gold per child to the bank.
       - **Commoners**: No payment required. They can have up to 2 children.

     Why? Because elites and aspirants invest in their children to make them aspirants (see next). Commoners do not, so their children become commoners.

  5. **Socialization of Children:**
     - Children of Elites automatically become Aspirants (if the parent paid for them).
     - Children of Aspirants become Aspirants (if the parent paid for them).
