        - The state must pay 2 gold to each new Elite (step 3). 
        - If the state doesn't have enough gold, then the number of new Elites is reduced to what the state can afford (each new Elite requires 2 gold). So if there are 2 open positions but the state only has 2 gold, only 1 new Elite can be appointed? But then we have a problem: the bidding happened for 2 positions but only 1 is filled. This is a crisis.

     Alternatively, the state can run a deficit: if it can't pay, it takes gold from the commoners? But that might be too complex. Let's not model state deficits explicitly. Instead, we can say:

        - The state must pay 2 gold per new Elite. If it doesn't have enough, then it prints money (which we represent by taking gold from the commoners via an extra extraction). But that complicates.

     Instead, we can have the state treasury as a passive pot. If there isn't enough to pay the new Elites, then the new Elites don't get their 2 gold, but they still become Elites (and get a red chip). This might lead to them being unable to pay maintenance next round? That's the crisis.

     We'll go with: 
        - New Elites get 2 gold from the state only if the state has it. If not, they become Elites without the gold. They still get a red chip.

  7. **End of Round:**
     - Update the roles and numbers on the whiteboard.
     - Collect all red chips from Elites (they are returned to the bank) and redistribute them at the start of the next round? No, the red chips are permanent for the duration of being an Elite. So each Elite keeps their red chip until they lose their position.

     Actually, we don't want the number of red chips to change arbitrarily. The number of red chips should equal the number of Elite positions. So we have exactly 4 red chips in the game at all times? Then when an Elite loses their position, they return the red chip. When a new Elite is appointed, they get a red chip.

     So at the start of each round, each Elite has a red chip. They don't lose it during the round unless they become an Aspirant.

  **Scoring:**
  - At the end of the game (after a fixed number of rounds, say 4 rounds), players count their gold chips. Each gold chip = 1 PP.
  - The player with the most PP wins. But we can also have team goals? Not necessary. Each for themselves.

  **Game Dynamics:**
  - Initially, there are 4 Elites, 4 Aspirants, 8 Commoners.
  - The fixed number of Elite positions is 4.
  - In the first round, Elites extract from Commoners: each Elite takes 1 gold from a Commoner. There are 8 Commoners, so 4 will lose 1 gold. Now Elites have their initial 3 gold plus 1 extracted, minus 1 for maintenance (so 3+1-1=3) and then they may have children.
  - Aspirants compete for 0 positions? Because there are 4 Elites and they are all maintaining? So no open positions? Then the Aspirant phase: no one becomes Elite. Then family planning: they may have children (if they can pay) and those children become Aspirants.

    But note: the rules for opening positions: 
        - Positions open when an Elite fails to pay maintenance? Or when an Elite dies? We didn't model death. 

    We need a mechanism for elite positions to open. We can have:
        - At the beginning of the Aspirant Competition Phase, any Elite who did not pay maintenance (in step 2) loses their position and becomes an Aspirant. Then the number of open positions is the number of such vacancies.

    So in step 2, if an Elite cannot pay maintenance, they become an Aspirant and return their red chip. Then in step 3, the number of open positions is the number of red chips available (which is the number of Elites who left).

    Also, we can have natural turnover: at the beginning of each round, a fixed fraction of Elites retire? But that complicates.

    Let's stick to: 
        - Open positions only occur when an Elite fails to pay maintenance (step 2) and becomes an Aspirant.

    Therefore, in the first round, if all Elites pay maintenance, then no open positions. Then the Aspirants cannot become Elites. Then the number of Aspirants may grow (if they have children) and the next round there are more Aspirants.

    This is the key: the number of Aspirants grows, but the positions only open if an Elite fails. And Elites might fail if they don't extract enough or if they have too many children.

  **Timeline for 90 minutes:**

  1. **Introduction (10 minutes):**
     - Explain the goal: to accumulate as much gold (PP) as possible by the end of the game.
     - Assign roles and distribute initial resources.
     - Explain the rounds and the phases (write them on the board).

  2. **Round 1 (10 minutes):**
     - Walk through each phase step by step, as it's the first round.
     - Resource Extraction: Elites take gold from Commoners (each Elite takes 1 from one Commoner). Note: if there are more Elites than Commoners, then some Elites cannot extract and will have to use their own gold for maintenance? Or they can take from Aspirants? No, only from Commoners. So if there are 4 Elites and only 2 Commoners, then 2 Elites get nothing from extraction.
     - Elite Maintenance: Each Elite pays 1 gold to the state. If they can't, they become an Aspirant and return their red chip.
     - Aspirant Competition: Count the open positions (number of red chips available). Aspirants bid blue chips. Resolve bids: highest bidders become Elites (get a red chip and 2 gold from the state if available). If the state doesn't have enough gold, they become Elites without the gold.
     - Family Planning: Everyone writes down children (0,1,2) and pays the cost. Then the new children are added to the appropriate class (Aspirant if parent is Elite or Aspirant and paid, otherwise Commoner). Note: the parent pays for the child at the time of birth.

     Update the whiteboard: 
        - New numbers of Elites, Aspirants, Commoners.
        - State treasury balance.

  3. **Rounds 2, 3, 4 (each 8-10 minutes, total 30 minutes):**
     - Repeat the same steps. The facilitator times each phase and keeps the game moving.

  4. **Final Round (Round 4) and Tally (5 minutes):**
     - After round 4, players count their gold chips.

  5. **Debrief (35 minutes):**
     - We structure the debrief to draw out the key concepts by asking questions about what they experienced.

  **Debrief Guide:**

  1. **Positional Good:** 
     - Ask: "How many elite positions were there? Could we create more? What happened when we tried?" (They might have tried to bid more to get in, but the positions were fixed. The value of being an elite was in the extraction power and the status, but if there were more elites, extraction would be harder because there are fewer commoners per elite.)

  2. **Swelling Aspirant Pool:**
     - Point to the whiteboard: "Look at how the number of aspirants changed. Why did it grow? What allowed it to grow?" (Prosperity allowed elites and aspirants to have more children, who became aspirants. But note: as the number of aspirants grows, the chance of any one becoming an elite decreases.)

  3. **Squeeze at the Bottom:**
     - "What happened to the commoners? How many commoners were there over time? How did their wealth change?" (They were being extracted from, and their numbers might have decreased because they didn't have as many children? Actually, commoners can have up to 2 children at no cost, so their numbers might grow. But if the elites are extracting one gold per commoner, then commoners might become poorer and not be able to support children? But we didn't model that. This is a gap.)

     We did not model commoner wealth affecting their ability to have children. So commoner numbers might grow, making extraction easier? But then the state might collapse because the elites are too many? Not exactly. We need to adjust.

     Revised commoner rules: 
        - Each commoner must pay 1 gold at the end of each round to survive. If they cannot, they die (or become non-productive and don't get counted in the next round). But that might be harsh.

     Alternatively, we can have commoners produce wealth each round: say, each commoner generates 1 gold at the start of the round (from working). Then they are extracted from by elites. Then they can have children (if they have at least 1 gold left? or no cost). But then we have to model production.

     Given time constraints, we might skip and rely on the debrief to note that the model doesn't capture everything.

  4. **Fiscal Squeeze:**
     - "What happened to the state treasury? Where did the money come from? Where did it go? What happened when the state couldn't pay the new elites?" (The state got money from elite maintenance and from payments for children. It paid new elites. If it couldn't pay, then new elites started without the gold, making it harder for them to pay maintenance next round. This is the fiscal squeeze.)

  5. **Non-monotonicity:**
     - "At the start, we had 4 elites and 4 aspirants. Was that stable? Then as the aspirant pool grew, what happened? Did having more aspirants make the society stronger or weaker? What about the number of elites? What happened when we had too few elites? (Weak: not enough to extract and maintain order?) What happened when we had too many? (They couldn't extract enough, so they couldn't pay maintenance, leading to turnover and instability.)"

  6. **Questioning the Model:**
     - "How did the rules of the game shape the outcome? What aspects of real societies did we leave out? What if we changed the rules slightly? For example, what if the number of elite positions could expand? What if commoners could become aspirants? How much confidence should we have in this kind of model? Is it a useful tool or a Procrustean bed?"

  **Predictable Problems and Solutions:**

  1. **Problem:** Students might not understand the rules, especially in the first round.
     - **Solution:** Walk through the first round slowly, step by step. Have a helper (if possible) to assist.

  2. **Problem:** The game might become chaotic if players don't follow the phases.
     - **Solution:** Use a timer for each phase and announce transitions clearly.

  3. **Problem:** The state treasury might run out of gold quickly, leading to a downward spiral and ending the game too soon.
     - **Solution:** Start with a well-funded state? Or adjust the initial distribution. Alternatively, in the debrief, use that as an example of fiscal collapse.

  4. **Problem:** Awkwardness with role-play: some students might not engage.
     - **Solution:** Frame it as a strategic game, not role-play. Focus on the mechanics and the goal (maximizing gold). The roles are just positions in the game.

  5. **Problem:** The game might not produce the desired dynamics (e.g., the aspirant pool doesn't grow enough, or the society remains stable).
     - **Solution:** The facilitator can adjust the initial parameters or inject events (like a bad harvest: commoners produce less) in later rounds if needed. But be transparent.

  **What the Activity Can't Reproduce:**
  - The activity simplifies the real-world complexities. It cannot capture the cultural, ideological, and contingent factors that real historical events involve. The model assumes that social mobility is only through the aspirant competition and that commoners are passive. In reality, commoners might revolt, or new sources of wealth might emerge. The activity also doesn't capture the role of external factors (like invasions or trade). You will have to supply the caveat that models are simplifications and that historical outcomes are overdetermined.

  **Final Answer Line:**
  \answer{Students should walk away feeling the visceral tension between the apparent predictive power of structural models and the nagging sense that such models might be self-fulfilling oversimplifications.}
answer: |-
  ### **The Pyramid Game: Rules and Materials**  
  *Simulate elite overproduction, fiscal strain, and the non-monotonicity of stability.*

  **Core Mechanics:**  
  Players adopt roles in a stratified society. Over 4 rounds (~30 mins total), they compete for fixed elite positions, manage resources, and navigate population growth. The game forces them to experience:  
  - **Positional goods:** Fixed elite slots (4) vs. growing aspirant pool.  
  - **Squeeze dynamics:** Elites extract resources from commoners; aspirants compete fiercely; the state faces fiscal strain.  
  - **Non-monotonic collapse:** Stability at "balanced" elite/aspirant ratios, chaos at extremes.  
  - **Model skepticism:** Post-game debrief reveals how rules "bent" reality to fit the cycle.  

  **Materials (for 16 students):**  
  - **Tokens:**  
    - *Gold chips (wealth):* 100+ (1 chip = 1 Prestige Point, PP).  
    - *Red chips (extraction rights):* 4 (1 per elite position).  
    - *Blue chips (social capital):* 20+ (for aspirant bidding).  
  - **Paper:** Slips for private bids/choices.  
  - **Envelopes:** One per player (hide chips/choices).  
  - **Whiteboard:** Track key metrics per round (Table 1).  
  - **Timer:** Strict 5-minute phases.  

  **Roles & Initial Setup (Round 0):**  
  Assign roles via slips (no acting required—roles are mechanical):  
  - **Elites (4 players):** Start with 3 gold + 1 red chip. *Goal:* Keep elite status.  
  - **Aspirants (4 players):** Start with 2 gold + 1 blue chip. *Goal:* Become elite.  
  - **Commoners (8 players):** Start with 2 gold. *Goal:* Avoid destitution.  
  - **State Treasury:** Starts with 10 gold (managed by you).  

  **Table 1: Whiteboard Tracking**  
  | Round | Elites | Aspirants | Commoners | Treasury Gold |  
  |-------|--------|-----------|-----------|--------------|  
  | 0     | 4      | 4         | 8         | 10           |  

  ---

  ### **Game Rules (4 Rounds, 5-7 mins each)**  
  **Each round has 4 phases (announce phases clearly):**  

  1. **Extraction & Maintenance (2 mins):**  
     - **Elites:** Use red chip to take 1 gold from any commoner. If no commoner has gold, take nothing.  
     - **State Payment:** Each elite pays 1 gold to the treasury. *Fail?* Lose status → become aspirant.  
     - **Commoners:** Lose gold if extracted; no action otherwise.  

  2. **Elite Competition (2 mins):**  
     - **Open Slots:** = Number of elites who lost status in Phase 1 (e.g., if 2 elites failed payment, 2 slots open).  
     - **Aspirants:** Secretly bid 0–3 blue chips (write on slip). Highest bidders win slots (ties: random draw).  
     - **Winners:** Become elites. Get 1 red chip + 2 gold from treasury (if treasury has gold; else, get nothing).  
     - **Losers:** Remain aspirants; lose bid chips.  

  3. **Family Planning (1 min):**  
     - **All players:** Privately choose 0–2 "children" (write on slip).  
       - *Elites/Aspirants:* Each child costs 1 gold (paid to treasury).  
       - *Commoners:* No cost.  
     - **Newborns:**  
       - Elite/aspirant children → new aspirants (if paid).  
       - Commoner children → new commoners.  

  4. **Resource Reset (1 min):**  
     - Update whiteboard (new role counts, treasury total).  
     - **Commoners:** Get 1 bonus gold if treasury > 15 (simulates prosperity).  

  **Scoring (Incentivizes Role-Appropriate Behavior):**  
  - **Endgame PP (Prestige Points):** Gold chips held. Highest PP "wins" (but stress: collective collapse hurts all).  
  - *Elite incentive:* Extract/pay maintenance to avoid demotion.  
  - *Aspirant incentive:* Bid high to win elite slots (blue chips useless if unspent).  
  - *Commoner incentive:* Avoid gold depletion (gold = only PP source).  

  ---

  ### **Timeline (90 Mins Total)**  
  1. **Setup (10 mins):** Assign roles, distribute chips, explain rules/gold = PP.  
  2. **Rounds 1–4 (30 mins):** 4 rounds × 7 mins (strictly time each phase).  
  3. **Scoring & Tension-Building (5 mins):** Tally PP; ask: *"Who felt stable? Who was frustrated?"*  
  4. **Debrief (45 mins):** Use whiteboard data to explore concepts (see below).  

  ---

  ### **Debrief Guide: Map Game Events to Concepts**  
  *(Ask questions; let students articulate first.)*  

  | **Concept**               | **Game Events to Reference**                                                                 | **Facilitator Script**                                                                 |
  |---------------------------|----------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Positional good**       | Fixed red chips (elite slots); aspirants couldn’t "create" more even with high bids.          | *"Why couldn’t we add more elite slots? What made them valuable?"* → Highlight zero-sum competition. |
  | **Swelling aspirant pool** | Rising aspirant numbers (whiteboard); bidding wars; some never won a slot despite many chips. | *"When did aspirant numbers surge? Why?"* → Link prosperity (commoner bonus gold) to more elite/aspirant children. |
  | **Squeeze at the bottom** | Commoners losing gold (extraction); declining per-capita gold if commoner numbers grew.       | *"What happened to commoners over time? How did elite needs affect them?"* → Note extraction as upward wealth transfer. |
  | **Fiscal squeeze**        | Treasury draining (elite payouts, child subsidies); state unable to fund new elites.          | *"Why did the treasury run dry? Who relied on it?"* → Connect elite demands to state fragility. |
  | **Non-monotonicity**      | Round 1–2 (stable: 4 elites, 4–6 aspirants) vs. Round 3–4 (chaos: too many/few elites).       | *"When was society ‘functional’? What tipped it into instability?"* → Contrast moderate vs. extreme aspirant ratios. |
  | **Model skepticism**      | Game rules "forced" the cycle; students felt trapped; real history has more variables.        | *"Did this feel inevitable? What real factors did we exclude?"* → Argue: Models explain patterns but may ignore chaos/agency. |

  **Close:** *"This model explains why elite overproduction precedes collapse—but it’s just one lens. History isn’t physics, but it’s not random either. Your frustration? That’s the tension."*  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem:** Awkwardness with "roles."  
    **Fix:** Emphasize mechanics over role-play (e.g., *"You’re not a king, you’re a player maximizing PP"*).  

  - **Problem:** Treasury runs dry too early.  
    **Fix:** Secretly add 5 gold mid-game if treasury < 5 by Round 2 (blame "loans" or "taxes").  

  - **Problem:** Aspirants under-bid (e.g., hoard blue chips).  
    **Fix:** Remind them: *"Blue chips don’t earn PP; only elite status boosts your gold long-term."*  

  - **Problem:** Commoners revolt (e.g., refuse extraction).  
    **Fix:** Enforce rules: *"If you withhold gold, lose 2 gold as a ‘fine.’"*  

  - **Problem:** Game ends in stable equilibrium.  
    **Fix:** If too stable, announce "drought" (Round 3: all commoners lose 1 gold) to trigger collapse.  

  ---

  ### **What the Activity Can’t Reproduce**  
  **You must supply:** The role of *contingency* and *human agency*. The game’s rules make collapse feel mechanistic, but real history turns on unpredictable events (e.g., a leader’s charisma, external shocks, ideological shifts). Stress: *"Models map pressures, not destinies—agency sparks the tinderbox."*  

  \answer{Students should walk away feeling the gnawing paradox that structural models are both irresistibly illuminating and dangerously reductionist.}
