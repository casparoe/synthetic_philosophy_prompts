  We are designing an activity that simulates the dynamics of elite overproduction and its consequences. The core idea is that an increasing number of aspirants for a fixed number of elite positions leads to instability. We want the students to experience the non-monotonic relationship: too few elites -> weak, the right number -> stable, too many -> unstable. We also want them to question the model by the end.

  Activity Title: **The Pyramid Game**

  **Overview:**
  - The game is played in rounds, each representing a generation (or a period of time).
  - There are three main roles: 
    1. **Elites** (fixed number of positions, e.g., 4 at the start)
    2. **Aspirants** (variable number, starting at 4, but will grow)
    3. **Commoners** (the rest, starting at 8, but their numbers may change)
  - The goal for each player is to accumulate "Prestige Points" (PP) over the game.

  **Materials:**
  - Poker chips (or tokens) in three colors:
    - **Gold**: Representing wealth (each = 1 PP at the end)
    - **Red**: Representing resources extracted from commoners (used to pay for elite positions and aspirant training)
    - **Blue**: Representing "social capital" (used by aspirants to compete for elite positions)
  - A whiteboard to track:
    - Current round
    - Number of Elites, Aspirants, Commoners
    - Total wealth (gold chips) in the system
    - A simple ledger for the state treasury (if used)
  - Envelopes (one per player) to hold their chips privately.
  - Index cards for role assignments and instructions.

  **Setup:**
  1. Assign roles secretly by giving each student an index card with their role. Start with:
     - 4 Elites
     - 4 Aspirants
     - 8 Commoners

     (Total 16 students)

  2. Distribute initial resources:
     - **Elites**: Each gets 3 gold chips (representing their wealth) and 1 red chip (representing their ability to extract resources).
     - **Aspirants**: Each gets 1 blue chip (social capital) and 1 gold chip (family wealth).
     - **Commoners**: Each gets 1 gold chip (subsistence wealth).

  3. Explain the goal: Each player wants to maximize their Prestige Points (PP) at the end of the game. PP are the gold chips they hold at the end.

  **Rules for a Round (each round ~10 minutes):**

  1. **Resource Extraction Phase (Elites and Commoners):**
     - Each Elite uses their red chip to extract resources from Commoners. 
       - How: Each Elite must take 1 gold chip from a Commoner. If there are not enough Commoners (or they have no chips), the Elite gets nothing and must use their own gold to maintain status (see step 2).
     - Note: The number of red chips an Elite has may change over rounds (see below).

  2. **Elite Maintenance Phase:**
     - Each Elite must pay 1 gold chip to the state (a central pot) to maintain their position. If they cannot pay, they become an Aspirant (losing their red chip and elite status) and must return their red chip to the bank.

  3. **Aspirant Competition Phase:**
     - The fixed number of Elite positions (say, 4) is open for competition. 
     - Each Aspirant can bid blue chips to try to become an Elite. 
       - The bidding is done simultaneously in secret: each Aspirant writes down how many blue chips they bid (they can bid 0) and puts it in an envelope. The facilitator collects the bids.
     - The highest bidders (up to the number of open positions) become Elites. In case of ties, use a random draw.
     - New Elites: 
