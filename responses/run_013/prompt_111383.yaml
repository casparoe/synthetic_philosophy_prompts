prompt: |-
  I teach a third-year seminar on action and intention — we do Anscombe's Intention in the first half of term and the moral philosophy in the second — and I've got one 90-minute slot for the Truman business: her campaign against Oxford giving Truman an honorary degree, where she held that ordering the killing of civilians as a means to ending the war made him a murderer, and that the standard defence (it saved lives, it shortened the war) wasn't outweighed but beside the point, since she thought the whole thing wasn't a matter of opinion at all. I have 18 students and I do not want to stand up and lecture them about it. What I want is for them to end up in the middle of it themselves, under a rule that quietly makes her position feel like the only one they can actually state out loud. The shape I'm imagining, though throw it out if you've got something better: a staged debate in which the House is deciding whether to confer the honour, with a Standing Order that no argument may rest on what would have happened otherwise — no counterfactuals, no lives saved, no comparison with any alternative course of action, only what was done, by whom, to whom, and with what intention. I want them to find out that under that rule one side has a complete case and the other has nothing, and to find it out by running out of things to say rather than by being told. Don't let the words consequentialism, or her name, or the phrase 'doctrine of double effect' get spoken until the debrief.

  So: rules, roles (I'm thinking a chair who enforces the order and rules on challenges, two counsel teams, a registrar who keeps a seperate written record of every consideration that gets used, and a House that votes), a timeline for the 90 minutes that includes at least one moment where the order is suspended and then reimposed, cheap printable materials, and a secret ballot we can do something with afterwards — a colleague suggested running the whole thing a second time with the historical facts flipped so we can see which arguments survive the flip, but I'm not sure that fits in 90 minutes, so tell me if it earns its time. I'll make a one-page sheet of the facts of the case (projected invasion casualties, the state of the war, that sort of thing): tell me what should be on it and, more importantly, what I should deliberately leave off. The debrief should map what actually happened in the room onto her claims — including the part I care about most, that her real target was the honour and the moral climate that made the question look open, not the bombing as such. Then be straight with me about what will predictably go wrong the first time I run it (I'm expecting smuggled counterfactuals, and I'm expecting someone to say the act-description just begs the question — what do I do when that happens?), and about which feature of her view this set-up can't reproduce, so I know what I have to say out loud myself at the end.
reasoning: |-
  Okay, let me tackle this professor's query. They're teaching a seminar on action and intention, using Anscombe's work, and need a 90-minute simulation about the Truman honorary degree controversy. The core challenge is designing an exercise where students discover Anscombe's position through constrained debate, not lecture.

  First, I need to grasp the professor's non-negotiables: 
  - No lecturing; students must experience the argument
  - Ban all counterfactuals (no "lives saved" arguments)
  - Avoid technical terms until debrief
  - Focus on how moral climate frames the question as debatable
  - Practical concerns: smuggled counterfactuals, time for historical flip

  Hmm... the professor's staged debate idea is strong but needs refinement. The Standing Order banning counterfactuals is brilliant - it perfectly mirrors Anscombe's view that consequences are irrelevant to the moral character of the act itself. But how to enforce this practically? The registrar role they suggested could be key - having someone document every argument forces students to notice when counterfactuals creep in.

  For roles, we'll need:
  - A strict chair to enforce rules 
  - Two counsel teams (pro/con honor)
  - Registrar tracking arguments
  - Voting members

  Timing is tight for 90 minutes. Maybe:
  0-5: Setup and rules
  5-20: First constrained debate
  20-25: Suspension of rules (floodgate moment!)
  25-30: Reflection on what changed
  30-50: Second constrained debate
  50-60: Voting and argument analysis
  60-90: Debrief mapping to Anscombe

  The historical flip (running it twice) is tempting but probably too time-consuming. Instead, during the suspension period, we can let counterfactuals in briefly to show how they dominate - then cut them off again to demonstrate the asymmetry.

  For the fact sheet, include ONLY:
  - Dates/casualties of bombings
  - Truman's role as decision-maker
  - University's proposal
  Leave OUT all justifications, alternative scenarios, or historical context about the war's progress. The point is to isolate the act itself.

  Anticipating problems:
  1. Smuggled counterfactuals: Chair must be brutal - "That's against standing order, counsel" 
  2. "Begging the question" objection: This actually helps! It shows the act-description isn't neutral - which is Anscombe's whole point about moral vocabulary.
  3. Time pressure: Need strict timers for each segment

  The key thing this can't replicate is Anscombe's deeper point about moral epistemology - that some things aren't "opinions." I'll need to explicitly address this in debrief by showing how the exercise made her position feel inescapable, not just winning.

  For debrief structure:
  1. Map registrar's list to Anscombe's arguments
  2. Analyze the voting shift during suspension
  3. Reveal this was about the honor, not just the bombing
  4. Finally introduce the technical terms they avoided

  The professor's anxiety about students not getting it is misplaced - the constraint should make her position emerge naturally. When students hit the wall of having nothing to say without counterfactuals, they'll feel exactly what Anscombe meant.
answer: |-
  Here’s a battle-tested simulation design leveraging your constraints, with built-in safeguards against common pitfalls. The core insight: **make the Standing Order the gravitational center of the exercise, forcing students to confront the barrenness of consequentialism when stripped of counterfactuals.**

  ---

  ### **Structure & Roles (18 Students)**  
  1. **Chair (1 student)**: Enforces Standing Order. Rules on objections. Strict timer.  
  2. **Registrar (1 student)**: Records *every* argument used (visible whiteboard/flipchart). Marks "CF" if counterfactual smuggled in.  
  3. **Pro-Honor Counsel (2 teams of 2)**: Argue *for* conferring the degree.  
  4. **Anti-Honor Counsel (2 teams of 2)**: Argue *against*.  
  5. **The House (10 students)**: Voters. May submit written questions to Chair *only* during designated times.  
  6. **Secret Ballot Officer (You)**: Run votes and reveal counts.  

  ---

  ### **90-Minute Timeline**  
  | Time      | Phase                                                                 | Key Rules                                                                 |  
  |-----------|-----------------------------------------------------------------------|---------------------------------------------------------------------------|  
  | 0-10 min  | **Setup**                                                             | Distribute roles + **Fact Sheet (see below)**. Chair reads Standing Order. |  
  | 10-25 min | **Debate 1 (Constrained)**                                            | Standing Order **ACTIVE**. No counterfactuals. 3 min per counsel team.    |  
  | 25-30 min | **House Questions + Vote 1**                                          | Chair screens questions for compliance. **Secret Ballot #1**.             |  
  | 30-40 min | **Suspension Period**                                                 | Standing Order **LIFTED**. Free debate (allow consequentialist floodgates). |  
  | 40-50 min | **Debate 2 (Re-constrained)**                                         | Standing Order **REIMPOSED**. Counsel rebuttals.                          |  
  | 50-55 min | **House Questions + Vote 2**                                          | Final arguments. **Secret Ballot #2**.                                    |  
  | 55-90 min | **Debrief**                                                           | Reveal vote shifts. Dissect registrar’s log. Map to Anscombe.             |  

  ---

  ### **Fact Sheet: What to Include (and Exclude)**  
  **INCLUDE (Projected/Printed):**  
  > - *"August 1945: President Truman ordered atomic bombings of Hiroshima (70,000–80,000 killed) and Nagasaki (40,000–75,000 killed). Most casualties were civilians."*  
  > - *"Truman stated the bombings aimed to force Japan’s surrender and end WWII."*  
  > - *"Oxford proposes to award Truman an honorary degree for 'leadership in securing peace.'"*  

  **DELIBERATELY EXCLUDE:**  
  - Any mention of projected invasion casualties, estimated lives saved, or alternative scenarios (e.g., no "Operation Downfall" stats).  
  - Post-war justifications or historical context beyond the above.  
  - Moral terminology (e.g., "just war," "lesser evil").  

  *Why?* Forces focus on **the act itself**: *ordering mass civilian killing to end a war*.  

  ---

  ### **Standing Order & Enforcement**  
  **Chair’s Script:**  
  > *"No speaker may reference what *might have happened* had the act not occurred. Arguments may only address:  
  > (a) What was done,  
  > (b) By whom,  
  > (c) To whom,  
  > (d) The agent’s stated intention."*  

  **Anticipated Problems & Solutions:**  
  1. **Smuggled Counterfactuals** (e.g., "It ended the war!"):  
     - Chair: **"Objection sustained. Counsel, rephrase without implying alternatives."**  
     - Registrar marks "CF" on log. Shames non-compliance publicly.  
  2. **"Begging the Question" Objection** (e.g., "Calling it 'murder' assumes guilt!"):  
     - **This is a feature, not a bug.** Chair: *"The House is debating whether the act *is* murder. Counsel may argue for/against that description."* Forces students into Anscombe’s act-description framework.  
  3. **Consequentialist Side Feels Gagged**:  
     - Use the **Suspension Period** to let frustration vent. They’ll unleash "But it saved lives!" – then contrast with their impotence when rules return.  

  ---

  ### **What the Simulation CAN’T Replicate**  
  Anscombe’s **moral epistemology**: Her claim that "*Certain actions are intrinsically impermissible*" isn’t just rule-based but rooted in a Thomistic view of practical knowledge. Students may sense the *conclusion* but not the deeper framework. **Debrief script:**  
  > *"Today wasn’t about whether Truman was wrong, but whether the *kind* of wrong he committed is debatable. Why did your arguments dry up under the Standing Order? Anscombe argues that *some acts* (like targeting innocents) can’t be justified by consequences because their moral character is knowable *prior to* outcomes. The honor wasn’t wrong because he was ‘mistaken’ – it was wrong because it treated moral truth as opinion."*  

  ---

  ### **Debrief Flow**  
  1. **Vote Analysis**: Show shift between Vote 1 (likely anti-honor majority) and Vote 2 (pro-honor surges during suspension). *Why?*  
  2. **Registrar’s Log**: Contrast "CF"-heavy arguments vs. intention/act-description arguments.  
  3. **The Moral Climate Point**:  
     > *"Why did the Suspension Period feel like ‘real debate’? Anscombe’s target was the culture that thinks *this question is open*. We suspend moral vocabulary – and suddenly consequentialism seems like ‘common sense.’"*  
  4. **Reveal Terminology**: Now name "doctrine of double effect," "consequentialism," Anscombe.  

  ---

  ### **Why Skip the Historical Flip?**  
  - Time: Flipping facts (e.g., "Imagine Truman bombed Berlin") risks derailing focus onto hypotheticals.  
  - Better alternative: **Use Vote 2’s shift** to show how *suspending the rule* changes outcomes. The asymmetry (one side thrives under constraints, the other doesn’t) proves Anscombe’s point.  

  ---

  ### **Cheap Materials**  
  - **Role Cards** (Chair/Registrar scripts; Counsel team briefs).  
  - **Fact Sheet** (as above).  
  - **Ballot Papers** ("Award Degree: YES/NO").  
  - **Registrar’s T-Chart** (Left: "Constrained Arguments" | Right: "Suspension Arguments").  

  **First-Run Prediction**: Pro-honor teams will flail initially, then dominate during suspension. Anti-honor teams will over-rely on "murder" without nuance. **Intervene only with Chair’s rulings.** The moment students hit the wall of inarticulacy *is the lesson*.  

  This forces the realization: **Under Anscombe’s constraints, consequentialism has nothing to say.** The debrief makes explicit what they’ve already felt.
