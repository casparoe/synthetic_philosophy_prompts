prompt: |-
  I run a small experimental-philosophy lab — two PhD students and a postdoc, roughly three years of runway — and I want to commit the whole group to the side-effect effect: the finding that people are far more willing to call a foreseen but unintended side effect intentional when it is harmful than when it is helpful. My working hunch is that the effect is not really about the concept of intentional action at all. It is about a broader asymmetry in how people fold foreseen outcomes into an agent's plan — foreseen harms get absorbed into what the agent was doing, foreseen benefits get written off as accidents. If that is right, the same asymmetry should surface in judgments of knowledge and of causation, and it should be switchable by information about what the agent actually represented to themselves: whether they would have proceeded had the side effect been the only outcome, whether they actively anticipated it, whether they could have avoided representing it at all.

  Assuming that hunch, what are the most important open questions here, and which should my group take on first? I want a defended agenda rather than a survey: for each question, why it matters, whether it is upstream of the others, how tractable it is with the tools a lab like mine actually has, and what result over the next three years would move it up or down the list. Tell me what to deprioritize even though it looks central, which disagreements in this area are really about method rather than substance, and what would change the ranking. Argue from the structure of the problem rather than from who has said what — do not point me at particular papers, authors, or readings to settle any of it.
reasoning: |-
  Okay, the user runs a small experimental philosophy lab and wants to focus their group on the side-effect effect. They have a hunch that the effect isn't about intentionality but a broader asymmetry in how foreseen outcomes are integrated into an agent's plan. Harmful side effects are seen as part of the plan, while beneficial ones are seen as accidents. They believe this asymmetry should appear in judgments about knowledge and causation and can be influenced by how the agent mentally represented the outcome.

  First, I need to unpack their main hypothesis. They're suggesting that the core issue is cognitive framing: how people incorporate foreseen consequences into the agent's plan. This goes beyond intentionality to include epistemic (knowledge) and causal judgments. The key variables are how the agent represents the outcome—whether they would have acted if only the side effect occurred, if they actively anticipated it, or if they could avoid thinking about it.

  The user wants a defended agenda, not just a survey. So I need to prioritize questions based on why they matter, if they're upstream, tractability with their lab's resources (three years, small team), and what results would change priorities. Also, I should advise what to deprioritize and note methodological disagreements.

  Starting with the most upstream question. The foundational issue is the cognitive mechanism: what mental processes cause the asymmetry. If they can show that the asymmetry extends beyond intentionality to knowledge and causation, that supports their hypothesis over the traditional intentional-action account. This is upstream because understanding the mechanism informs how to test other aspects. It's tractable—they can design vignettes varying harm/help and measure judgments on intention, knowledge, and causation. Using within-subject designs and regression could handle the multi-dimensional data. A pilot showing asymmetry across all three judgments would validate their approach. If they only find asymmetry in intentionality, it weakens their broader claim, so they might need to pivot.

  Next, control over mental representation. If they can manipulate how the agent represents the outcome (e.g., "would you still do it if only the side effect?"), and that flips the asymmetry, it directly tests their hypothesis. This is crucial because it targets the core claim about representation. It's tractable by adding conditions to vignettes. Success here would strongly support their theory, making it a priority. Failure might mean refining the representation manipulations or checking other factors.

  Then, boundary conditions. Understanding when the asymmetry fails (e.g., minimal plans or unavoidable outcomes) reveals the limits of the mechanism. This is important for the theory's scope but might be downstream. Testing it requires specific scenarios, which is doable. Finding limits early could redirect focus, but it's secondary to confirming the core mechanism.

  Deprioritizing the "why" behind the asymmetry (e.g., normativity or affective responses). While important, it's less urgent without first confirming the mechanism. Also, avoiding the intentionality debate as a terminal goal—addressing it through the broader mechanism is more efficient.

  Methodological disagreements might arise around vignette realism. Some argue for more ecologically valid stimuli, but for foundational work, controlled vignettes are practical. They should stick with vignettes unless results demand otherwise.

  What could change the ranking? If early experiments show the asymmetry in knowledge/causation, it boosts the mechanism question. If representation manipulations don't work, they might need to explore boundary conditions more. If harm/help asymmetry doesn't generalize, they have to reconsider their hypothesis.

  Overall, the priority is: 1) Core mechanism (asymmetry across judgments), 2) Representation manipulations, 3) Boundary conditions. This order builds from foundational evidence to direct tests of their hypothesis, then to scope. Focusing here maximizes their three-year runway for impactful results.
answer: |-
  Here’s a defended research agenda for your lab, grounded in your core hypothesis that the side-effect asymmetry reflects a broader *plan-incorporation bias* (harmful outcomes absorbed into plans, helpful outcomes treated as accidental). The priorities are ranked by **upstream centrality** (testing foundational assumptions first), **tractability** (feasible with a small team in 3 years), and **leverage** (results that redirect downstream work). I’ll argue for deprioritizing seemingly central questions when they’re premature or methodologically intractable.

  ### Core Ranking & Rationale
  1. **Question 1: Does the asymmetry generalize beyond intentionality to knowledge and causation?**  
     - **Why it matters most**: If the asymmetry *only* appears in intentionality judgments, your hypothesis collapses. If it extends to knowledge ("Did the agent *know* the side effect would occur?") and causation ("Did the agent *cause* the side effect?"), this supports a unified plan-incorporation mechanism. This is the **gateway question**—everything else depends on it.  
     - **Tractability**: Highly tractable. Use modified Knobe-style vignettes (harm/help conditions) with dependent variables for intention, knowledge, and causation. Within-subjects designs maximize power; mixed-effects models can handle nested judgments. Requires only behavioral experiments (no neuroimaging/complex modeling).  
     - **Success metric**: Asymmetry (harm > help) in all three judgments with comparable effect sizes.  
     - **What changes the ranking**: Null results for knowledge/causation asymmetry downgrade the entire agenda. Asymmetry in all three elevates Q2 to top priority.  
     - **Upstream role**: Directly tests domain-generality of the effect. Without this, other questions are moot.

  2. **Question 2: Is the asymmetry controlled by *how the agent represents the outcome*?**  
     - **Why it matters**: Your hypothesis hinges on mental representation (e.g., "Would the agent proceed if the side effect were the *only* outcome?"). If manipulating representation flips/erases the asymmetry, it confirms cognitive framing over normative (e.g., blame/praise) drivers.  
     - **Tractability**: Moderately tractable. Design vignettes that vary:  
       - *Counterfactual dependence*: "The CEO would/would not have acted if ONLY the side effect occurred."  
       - *Salience of representation*: "The CEO actively visualized/did not consider the side effect."  
       - *Avoidability of representation*: "The CEO could/could not have ignored the side effect."  
       Requires careful piloting to avoid demand characteristics but stays within vignette methods.  
     - **Success metric**: Significant reduction/elimination of asymmetry when helpful outcomes are represented as "plan-integral" (e.g., agent would act for the benefit alone) or harmful outcomes as "incidental" (e.g., agent couldn’t avoid it).  
     - **What changes the ranking**: Strong results make this the new core; weak/null results shift focus to Q3 (boundary conditions).  
     - **Upstream role**: Tests the *mechanistic driver* of the asymmetry. If representation controls the effect, it supersedes valence (harm/help) as the key variable.

  3. **Question 3: What are the minimal conditions for plan-incorporation?**  
     - **Why it matters**: Identifies boundary conditions for your hypothesis. Does asymmetry vanish when actions lack "plan-like" structure (e.g., impulsive acts) or when outcomes are unavoidable? Reveals whether the effect requires a coherent *plan* vs. any goal-directed action.  
     - **Tractability**: High for simple cases (e.g., "spontaneous" vs. "premeditated" vignettes). Low for complex ecological tests (e.g., real-world planning tasks). Stick to vignettes with plan-structure manipulations (e.g., "The CEO decided impulsively/after weeks of analysis").  
     - **Success metric**: Asymmetry disappears when actions lack deliberative planning (e.g., impulsive harm not judged more intentional than impulsive help).  
     - **What changes the ranking**: If Q1/Q2 succeed, this becomes critical for theory-building. If Q2 fails, this may explain why (e.g., asymmetry only occurs with "rich" plans).  
     - **Upstream role**: Clarifies the *cognitive prerequisites* of the effect. If plan-structure is irrelevant, your hypothesis is weakened.

  ### Deprioritized Questions (Despite Centrality)
  - **"Why does the asymmetry exist?" (e.g., evolutionary roots, normative functions)**:  
    While philosophically central, it’s **downstream of mechanism**. You lack time for evolutionary modeling or cross-cultural work (which requires large samples/fieldwork). Tackle this *only* if Q1–Q3 converge early.  
  - **"Is intentionality fundamentally normative?"**:  
    A key debate in phil-action, but your hypothesis *bypasses* it: if the asymmetry arises identically in non-normative judgments (knowledge/causation), normativity isn’t the core driver. **Resist entanglement**—test representations, not moral semantics.  
  - **Full computational models of plan-representation**:  
    Intractable for a small lab. Save for theory papers post-data collection.

  ### Methodological Disagreements to Sidestep
  - **"Vignettes lack ecological validity!"**:  
    Ignore this. Your hypothesis is about *cognitive framing*, not real-world behavior. Vignettes directly manipulate frames. Pursue ecological validity only if early results demand it (e.g., null effects suggest vignettes miss key context).  
  - **"Process-tracing (e.g., eye-tracking) is essential!"**:  
    Not for your agenda. If Q2’s representation manipulations work, you infer mechanism via moderation—no need for costly process data. Revisit only if manipulations fail.  

  ### What Could Change the Ranking?
  - **Year 1 outcome: Asymmetry generalizes (Q1 success)** → Elevate Q2 (representation).  
  - **Year 1 outcome: Asymmetry weak/absent in knowledge/causation (Q1 failure)** → Pivot to boundary conditions (Q3) to diagnose why (e.g., is asymmetry limited to "blame-like" judgments?).  
  - **Year 2 outcome: Representation manipulations fail (Q2 null)** → Deprioritize theory-building; focus on Q3 to map limits or revisit intentionality-specific accounts.  
  - **External shift**: New evidence from cognitive science (e.g., planning neuroscience) could make neurocorrelates tractable—but only if core behavioral results justify it.  

  ### Recommended 3-Year Workflow
  - **Year 1**: Q1 (Generalization). 2–3 experiments confirming asymmetry in intention/knowledge/causation.  
  - **Year 2**: Q2 (Representation). 3–4 experiments testing counterfactual dependence, salience, and avoidability.  
  - **Year 3**: Q3 (Boundary Conditions) + Theory integration. 1–2 experiments on plan-structure + paper framing the asymmetry as plan-incorporation.  

  This sequence maximizes leverage: Q1 validates your reframing of the phenomenon, Q2 tests your unique mechanism, and Q3 secures theoretical depth. By Year 3, you’ll have either robust evidence for your hypothesis or diagnostic data explaining its limits—either way, a decisive contribution.
