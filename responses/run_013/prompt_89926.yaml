  I should consider if there’s a better analogy. Maybe a referee in a game with unwritten rules? But that might have similar issues. The user doesn’t want citations but a structured argument. Need to be candid about limitations: if the analogy is too thin or if their baseball facts are off. Also, note where interpretations are contested, like whether originalism avoids judicial lawmaking.

