answer: |-
  ## Joint Statement on the Demandingness Objection to Consequentialism  
  **(Agreed by Act-Consequentialist [AC] and Demandingness Objector [DO])**

  **Section 1: Fixed Target**
  We jointly define the specific consequentialist theory under discussion to prevent verbal disputes and moving targets:

  *   **Theory:** Act-Consequentialism.
  *   **Theory of the Good:** Welfarism (Good = aggregate well-being, understood as preference satisfaction, happiness, or objective list items like health and knowledge). We explicitly reject prioritarianism, sufficientarianism, or other distributive constraints *within* the theory of the good for this target.
  *   **Decision Rule:** The right action in any situation is that which maximises aggregate well-being (as defined above).
  *   **Scope:** The theory applies to individual agents in the actual world as we find it (with radical inequality, preventable suffering, and limited altruism).

  **Agreed Points Regarding Verbal Disputes:**
  *   Disagreements over the meaning of "demanding" (e.g., total hours sacrificed, psychological burden, opportunity cost) are *substantive*, not merely verbal. However, confusion arises if these aspects aren't distinguished.
  *   Claims that "sacrifice is only demanding relative to a baseline" involve a *substantive* disagreement about whether a morally neutral baseline exists or is relevant.

  **Section 2: Agreed Claims (Common Ground)**
  1.  **World Facts:** Our world contains massive, preventable suffering and deprivation. Significant improvements in aggregate well-being could be achieved by affluent individuals transferring substantial resources (time, money, effort) to effective interventions aiding the globally poor or otherwise severely deprived.
  2.  **Theory's Requirements:** Under the defined act-consequentialism, an affluent individual in our world is required to sacrifice personal resources (money, time, career opportunities, leisure) far beyond conventional moral expectations. Compliance likely entails donating a very large proportion of income (potentially >30%, possibly approaching surplus above a modest threshold), dedicating significant time to effective altruism, and prioritising these actions over most personal projects and relationships *whenever they offer the highest marginal utility*.
  3.  **Compliance Costs:** Full compliance with the theory would impose severe psychological, emotional, and practical costs on the agent, including: significant loss of personal leisure and comfort, constrained life choices, potential strain on personal relationships, risk of burnout, and the psychological burden of constant moral vigilance.
  4.  **Force of the Objection:** The demandingness objection has genuine force because it highlights a profound tension between the theory's requirements and deeply held intuitions about the moral permissibility (and sometimes, necessity) of pursuing personal projects, maintaining special relationships, and enjoying life's non-moral goods. This tension produces significant psychological resistance and the sense that such a life would be alienating or unrecognisable as a *human* life.

  **Section 3: Precisely Stated Disagreements**
  *(Each disagreement is stated twice. Both parties accept the *other's* phrasing as a fair characterisation of their *own* view, even while rejecting the view itself.)*

  1.  **The Moral Status of Personal Sacrifice:**
      *   **DO Phrasing (accepted by AC as fair):** "The level of sacrifice required is *excessive* and therefore *morally unreasonable*; morality cannot rightly demand the near-total subordination of the agent's own life and projects to the impersonal good."
      *   **AC Phrasing (accepted by DO as fair):** "The level of sacrifice required, while high, is precisely what *impartial morality demands*; the perceived 'excessiveness' reflects a failure to fully grasp the moral significance of extreme need and the insignificance of personal cost in comparison."

  2.  **The Existence of a Protected Sphere:**
      *   **DO Phrasing (accepted by AC as fair):** "A sound morality must recognise a genuine, *protected sphere* of personal projects, relationships, and commitments that are generally *off-limits* to moral demands for greater good, even if sacrificing them *could* produce a net benefit."
      *   **AC Phrasing (accepted by DO as fair):** "While personal projects and relationships have significant value (contributing to aggregate well-being), no specific project or relationship possesses *absolute moral immunity*; their permissibility *always* depends on the opportunity cost measured in forgone well-being for others."

  3.  **The Source of the Intuition:**
      *   **DO Phrasing (accepted by AC as fair):** "The intuition that the demands are excessive reveals a *structural feature* of morality itself – that moral agency requires space for non-moral pursuits – not merely a psychological limitation."
      *   **AC Phrasing (accepted by DO as fair):** "The intuition that the demands are excessive primarily reflects *psychological and motivational limitations*, cultural conditioning, or an insufficient appreciation of the moral facts, rather than a deep truth about moral structure."

  **Section 4: Cruxes & Predictions**

  1.  **Height vs. Shape:**
      *   **Agreed Test:** Compare Theory A (demanding high aggregate sacrifice but guaranteeing a genuine protected sphere, e.g., "Donate 50% income but your core relationships/hobbies are always immune") vs. Theory B (demanding the *same* high aggregate sacrifice but offering *no* protected sphere, e.g., "Maximise good, period; your relationships/hobbies are only permissible if no better use of time/money exists").
      *   **Crux Question:** Does the demandingness objection target the *height* (total cost) or the *shape* (lack of exemption)?
      *   **DO Prediction:** The objection applies *much more strongly* to Theory B. The lack of any protected sphere is the core problem, making life alienating. Height alone, with exemptions, is significantly less objectionable.
      *   **AC Prediction:** The objection applies with *equal force* to both theories. The total cost is the primary burden. The "shape" difference is morally arbitrary; if sacrificing a core relationship *could* save lives, its immunity undermines impartiality. The psychological difference is noted but deemed irrelevant to moral truth.
      *   **Agreement on Bearing:** Both agree this pair clearly tests whether the *absence of exemptions* is the core driver of the objection, distinct from total cost.

  2.  **Size vs. Allocation:**
      *   **Agreed Test:** Compare the defined AC (high demands falling unevenly on those positioned to help) vs. a modified theory demanding the *same total* sacrifice from humanity, but allocating burdens *fairly and predictably* across all capable agents (e.g., a global progressive sacrifice schedule).
      *   **Crux Question:** Is the objection primarily about the *absolute size* of the demand on the individual, or the *unevenness/distribution* of that demand?
      *   **DO Prediction:** The objection retains *significant force* against the fairly allocated version. While fair allocation is better, the *absolute level* of sacrifice required of each individual remains excessively high and destructive of personal integrity.
      *   **AC Prediction:** The fairly allocated version *significantly weakens* (though may not eliminate) the demandingness objection. Much of the objection's force stems from the perceived unfairness of the burden falling haphazardly and heavily on some. Fair allocation addresses this key concern. Residual objection is likely psychological.
      *   **Agreement on Bearing:** Both agree this tests whether unevenness/distributive injustice is a core component of the objection's force, separable from the absolute demand.

  3.  **Truth vs. Believability:**
      *   **Crux Question:** Is the demandingness objection an objection to the *truth* of act-consequentialism, or only to its *practical believability/adoptability* as a public or personal morality?
      *   **AC Position:** The demandingness objection is primarily (or solely) about *believability and motivation*, not truth. A theory can be true but psychologically difficult or impossible for humans to fully internalise or live by. AC *would* accept the theory as true even if believing/unbelieving it had no practical consequences (though they note this is counterfactual).
      *   **DO Position:** The demandingness objection *is* an objection to *truth*. If a moral theory demands the impossible (psychologically sustainable agency without a protected sphere) or the inhuman, it cannot be correct. The unbelievability/impracticality *is evidence* of its falsity as a complete account of morality. DO *would not* accept the theory as true if they deemed it unfit for human belief and adoption.
      *   **Consequence:** DO argues that AC's willingness to separate truth from believability renders their theory potentially *self-effacing* or practically irrelevant in a way that undermines its claim to be a *moral* theory. AC argues DO conflates psychological difficulty with moral falsity.

  **Section 5: Key Questions Addressed Jointly**

  *   **Begging the Question:** DO agrees the objection *must not* simply assert the permissibility of non-optimal actions as a premise. DO contends the objection points to the *cost* (destruction of personal agency/life) that AC fails to adequately value or account for *within* its framework. AC would consider DO to be begging the question *only if* DO insisted that certain sacrifices *must* be permissible *without* showing why AC's failure to permit them is a flaw *internal to its goals* (e.g., undermining sustainable agency).
  *   **'Ought Implies Can':** Both agree the objection centrally involves psychological limits. DO argues these limits reveal a *conceptual* point about the necessary conditions for a *workable morality* governing human agents. AC argues 'ought implies can' is satisfied (agents *can* physically perform the acts, even if motivationally difficult) and the objection concerns motivational *psychology*, not conceptual possibility.
  *   **Justifying the Prerogative:**
      *   **AC Position:** A significant, structurally robust agent-centred prerogative (permitting sub-optimal actions for personal reasons) *cannot* be justified *internally* without abandoning core act-consequentialist commitments. Importing it makes the theory incomplete *as consequentialism*; it becomes a hybrid or different theory.
      *   **DO Position:** The necessity of importing the prerogative demonstrates that pure act-consequentialism *is* incomplete as a moral theory for human agents; it fails to account for a necessary component of the moral landscape (the agent's perspective).
  *   **Institutional/Collective Level:** Both agree the demandingness objection *reappears* at institutional/collective levels. DO argues a state or collective operating on pure AC principles could make *excessively demanding* claims on its citizens (e.g., extreme taxation, conscription, suppression of dissent for the greater good), violating their legitimate personal spheres. AC argues that collective action can *distribute* demands more efficiently and fairly (mitigating the individual objection), but the *fundamental* requirement to maximise good remains and can demand significant collective sacrifice, which may *still* feel demanding to individuals within the collective.

  **Section 6: Evidence Against Own View & Moving Forward**

  *   **AC Evidence Against Own View:** "Significant evidence that maximising transfers *does not reliably increase* aggregate well-being (e.g., due to harmful systemic effects, inefficiency beyond a point, or flawed measurement of well-being) would undermine the theory. Evidence that the *psychological costs* of attempted compliance consistently *reduce* aggregate well-being more than compliance helps could force revision (though likely towards rule/consequentialism)."
  *   **DO Evidence Against Own View:** "Widespread, stable adoption of near-AC principles leading to dramatic poverty reduction *without* the predicted widespread psychological collapse, alienation, or loss of valued personal lives would challenge the objection's empirical basis. A compelling *internal consequentialist justification* for a robust prerogative would undermine the claim such a prerogative must be imported."
  *   **Common Ground on Potential Movers:** Both agree that empirical research into:
      *   The long-term psychological and social effects of high-donation lifestyles (Effective Altruism).
      *   The motivational sustainability of different moral frameworks.
      *   The actual causal efficacy of various aid/transfer interventions.
      *   Cross-cultural variations in intuitions about demandingness (though both are wary of inferring truth from popularity).
      could provide evidence relevant to assessing the *feasibility* and *consequences* of AC, which bears on the objection's force (even if not directly settling the core normative disagreement). Both also agree that refined thought experiments isolating specific factors (like the Height/Shape cases) are crucial.

  **Signed:**
  [Act-Consequentialist Representative]
  [Demandingness Objector Representative]
  [Date]
