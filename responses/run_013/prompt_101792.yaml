prompt: |-
  I am the technology director for a mid-sized public school district — roughly nine thousand students, forty-odd buildings — and I am the person who signs off, or refuses to sign off, whenever a school wants to adopt a piece of software that touches student data. This comes up maybe twice a month, sometimes more, and the stakes are real: these tools run on children's information, the district is small enough that a bad headline would end careers, and I have no legal training and no budget to hire anyone who does. The superintendent signs the final contract, but nothing moves without my recommendation, and I usually have a week or less to produce one.

  I have been trying to find a way to make these calls that isn't just asking whether the data is sensitive, because that test gives me the wrong answer constantly. What I have landed on, after a lot of reading and arguing with colleagues, is this: privacy is not mainly about keeping facts secret. It is about whether a particular flow of information — from some party, about some aspect of a person, to some other party, under some rule governing how it moves — matches what people would reasonably expect in the setting where it happens. The same fact can be unremarkable in one setting and a betrayal in another. So the real question is never whether the data is sensitive; it is whether this flow fits this setting, and who set the expectation in the first place.

  I want you to turn that into a procedure I can actually run. Specifically: a fixed list of questions in the order I should ask them, with a note on each about what would count as a sufficient answer and what would count as a dealbreaker; the point at which the procedure stops and returns a no; and the points where it stops and hands the decision to a person — me, the superintendent, the parents — because the question is one of values rather than facts. Keep it short enough that I can run it in an afternoon and write the result up in a paragraph for the superintendent, and make it honest about which of its steps are just my judgment dressed up as method.

  Then run the procedure on three cases and show the reasoning at each step:

  1. A reading-comprehension app that the special-education teachers love and that has visibly helped struggling readers, but whose vendor collects keystroke-level data on every answer, keeps it indefinitely, and uses it to train models sold to other districts.
  2. A request from the district's school resource officers for routine access to the discipline and attendance records of students on their watch, which the principals are inclined to grant because it is easier than saying no.
  3. A tool that would let parents see, in real time, the location of the bus their child is riding — requested by a parents' group after a scare last spring.

  Case 1 is the one where I suspect the procedure is going to tell me to say no to something I badly want to say yes to, and I want that worked through rather than softened. Finally, tell me plainly what this procedure cannot do and where it will misfire — including what happens when the setting's own norms are unsettled or openly contested, and when a single person sits in two settings at once, as a student who is also a patient. If the way I have framed this leaves some of these calls genuinely undecidable rather than merely hard, say so, and say which part of the framing is doing that.
reasoning: |-
  Okay, the user is a technology director for a mid-sized school district, responsible for evaluating software that handles student data. They need a practical, efficient procedure to assess privacy risks beyond just data sensitivity. Their main concern is aligning data flows with reasonable expectations in specific settings. 

  First, I need to parse their core insight: privacy as contextual integrity. They already rejected the "is this data sensitive?" approach because it fails in practice. Their examples show they understand nuances—like how the same data (bus location) can be harmless in one context (parental oversight) but risky in another (discipline records accessed by SROs). 

  The challenge is operationalizing this into a step-by-step checklist that fits real-world constraints: time-limited (afternoon work), actionable (sufficient/dealbreaker flags), and transparent about where judgment calls happen. They also want three test cases run rigorously, especially Case 1 where their instinct ("this app helps kids") conflicts with red flags (vendor's data exploitation). 

  Key unspoken needs: 
  - They're legally exposed ("no training, no budget for lawyers") but must prevent scandals ("bad headline would end careers"). 
  - They need political cover—a method to justify tough calls to superintendents/parents. 
  - They suspect some conflicts can't be resolved by procedure alone (e.g., dual-role students) and want those limits acknowledged. 

  For the procedure: 
  Must distill contextual integrity into 5-6 steps max. Key pillars: 
  1. Map data flow (who/what/how). 
  2. Assess expectation fit (is this normal here?). 
  3. Check norms/rules (law? policy? consent?). 
  4. Flag judgment points (e.g., "would parents reasonably expect this?"). 
  5. Explicit off-ramps to "no" or human decisions. 

  For the cases: 
  Case 1 (reading app): Will hurt because educational benefit clashes with surveillance capitalism. Procedure must prioritize expectation breaches (keystroke data? model training?) over utility. 
  Case 2 (SRO access): Tests "reasonable expectation" in disciplinary settings. Parents might accept teachers seeing attendance but not police. 
  Case 3 (bus tracker): Easy "yes" if expectations align, but must verify security. 

  Finally, confess the method's limits: 
  - Can't fix conflicting norms (e.g., is a student's health data governed by school or medical rules?). 
  - Struggles when settings blur (teacher-therapist collaborations). 
  - Won't resolve values disputes—just flags them for humans. 

  Biggest risk: The procedure might over-rely on "what's normal here," which could perpetuate bad norms. (E.g., if schools casually share data with cops, does that become "expected"?) Must emphasize that step as judgment-heavy.
answer: |-
  Here's a procedure based on your framework, designed for speed and clarity. It prioritizes **expectation alignment** over data sensitivity and forces explicit judgment calls where values conflict.

  ---

  ### **Privacy Expectation Assessment Procedure**  
  **(Run in Order; Stop at First "No" or Handoff)**

  1.  **What is the *specific data flow*?**  
      *   *Ask:* "Exactly what data elements move from which party (A) to which party (B), under what rules/terms?"  
      *   *Sufficient:* Clear, specific list (e.g., "Student name & quiz answers from district to Vendor X, encrypted, used only for generating student reports").  
      *   *Dealbreaker:* Vague description ("some usage data"), refusal to specify data elements or recipients.  
      *   *Stop/Handoff:* If unclear after vendor/district clarification → **Handoff to Tech Director (Judgment: Can we proceed with ambiguity?).**

  2.  **What is the *primary setting & purpose* where this flow occurs?**  
      *   *Ask:* "What activity is happening (e.g., reading instruction, bus transport, disciplinary meeting)? What is the core, immediate reason this data needs to flow for that activity?"  
      *   *Sufficient:* Directly supports the core educational/safety/administrative function *within the immediate setting* (e.g., "Display bus location to parents for safety during transport").  
      *   *Dealbreaker:* Purpose is unrelated or tangential to the core activity (e.g., "Train marketing models using classroom keystrokes").  
      *   *Stop:* If Dealbreaker → **Recommend NO.**

  3.  **Would the *data subject* (student/parent) *reasonably expect* this flow in this setting?**  
      *   *Ask:* "Knowing only the normal context of the activity (e.g., being in class, riding the bus, attending a meeting with a principal/SRO), would a typical person expect *this specific data* to flow *to this recipient* for *this purpose*?"  
      *   *Sufficient:* Obvious alignment (e.g., parent expects bus location during transport).  
      *   *Dealbreaker:* Clearly unexpected/betrayal (e.g., student doesn't expect keystroke data to train unrelated models).  
      *   *Handoff:* If genuinely debatable or unclear ("Is discipline data expected by a student in a meeting with an SRO?") → **Handoff to Superintendent/Parents (Judgment: Community Values).** *This is Judgment Dressed as Method.*

  4.  **Does this flow comply with *established, binding rules*?**  
      *   *Ask:* "Does it violate FERPA, state law, district policy, or our signed contracts?"  
      *   *Sufficient:* Documented compliance (e.g., FERPA exception applies, vendor signs DPAA matching policy).  
      *   *Dealbreaker:* Clear violation (e.g., vendor claims ownership of student data, no DPAA, sharing without consent where required).  
      *   *Stop:* If Dealbreaker → **Recommend NO.**

  5.  **Is the recipient's *data handling* congruent with *setting norms*?**  
      *   *Ask:* "Does the recipient's retention, security, usage, and sub-sharing align with how trusted actors *in this specific setting* handle similar data?" (e.g., Does the bus vendor handle location like a transportation company, or like an ad tech firm?)  
      *   *Sufficient:* Handling aligns with setting norms + Rules (Step 4) are met (e.g., bus location stored only for trip duration, secured).  
      *   *Dealbreaker:* Handling fundamentally mismatches setting norms (e.g., indefinite keystroke storage/model training ≠ classroom tool norms).  
      *   *Handoff:* If compliant with rules but handling pushes boundaries of norms → **Handoff to Tech Director/Superintendent (Judgment: Risk Tolerance/Values).** *Judgment Dressed as Method.*

  **Outcome:** If you complete all steps without a Stop or Handoff → **Recommend YES.**  
  **Documentation:** Summarize Steps 1-5 answers concisely for the Superintendent, highlighting any Handoffs/Judgment points.

  ---

  ### **Case Applications**

  **Case 1: Reading Comprehension App**
  1.  **Flow:** Keystroke/answer-level data → Vendor → Indefinite storage → Model training for external sales.
  2.  **Setting/Purpose:** Classroom reading instruction. *Purpose:* Student progress reporting? (Yes). *Also:* Vendor product development (No - not core).
  3.  **Reasonable Expectation?** Would a student/parent expect granular keystrokes to be stored forever & sold to train models used elsewhere? **→ No (Dealbreaker). STOP. Recommend NO.**  
      *Reasoning:* The core expectation is progress reporting to teacher/parent/student. Granular behavioral data extraction for external commercial gain is a profound mismatch with classroom norms, regardless of the app's efficacy.*

  **Case 2: SRO Access to Discipline/Attendance Records**
  1.  **Flow:** Student discipline/attendance records (District DB) → School Resource Officers → Routine/ongoing access.
  2.  **Setting/Purpose:** School safety/student support. *Purpose:* "Routine monitoring" by law enforcement officers.
  3.  **Reasonable Expectation?** Would a student/parent expect routine school records access by police officers, not tied to a specific incident/investigation? **→ Highly Debatable. HANDOFF to Superintendent/Parents (Community Values Judgment).**  
      *Reasoning:* This clashes fundamentally. Is the SRO primarily a safety resource *within* the school community, or an arm of law enforcement? School norms lean towards limited disclosure for specific welfare needs. Police norms lean towards broad intelligence gathering. Community values must decide this expectation.*

  **Case 3: Real-Time Bus Location for Parents**
  1.  **Flow:** Bus GPS location (Vendor System) → Parent App (authenticated).
  2.  **Setting/Purpose:** Student transportation. *Purpose:* Allow parents to monitor child's bus location for safety/punctuality.
  3.  **Reasonable Expectation?** Would a parent expect to see the location of the bus their child is on during transport? **→ Yes (Sufficient).**
  4.  **Binding Rules?** Assuming FERPA-compliant (directory info/location not *generally* PII, but verify state law), vendor DPAA in place, secure auth. **→ Yes (Sufficient).**
  5.  **Data Handling Congruent?** Does vendor handle like a transport provider? (Short retention, strong security, no secondary use). If yes → **Sufficient → Recommend YES.** If vague/long retention → **Handoff to Tech Director (Judgment: Security Review).**  
      *Reasoning:* The flow aligns perfectly with the setting's purpose and likely parent expectations. Success hinges on secure implementation and minimal data handling.*

  ---

  ### **What This Procedure CANNOT Do & Where It Misfires**

  1.  **Unsettled/Contested Norms:** It *identifies* these (Step 3/5 Handoffs) but *cannot resolve* them. The procedure forces the value judgment into the open but doesn't provide the answer (e.g., Case 2 - SROs). You *must* get community/policy input.
  2.  **Dual Roles / Conflicting Settings:** It struggles badly here. A "student who is also a patient" exists simultaneously in the *educational setting* (governed by FERPA, school norms) and the *healthcare setting* (governed by HIPAA, clinical norms). The procedure asks "What's expected *in the setting*?", but **which setting controls when data flows touch both?** This is genuinely undecidable by the procedure alone. It requires:
      *   **Explicit Policy:** District rules defining which framework governs hybrid data flows (e.g., school health clinic records).
      *   **Consent:** Often the only bridge, but complex for minors.
      *   **Handoff to Experts/Law:** The procedure flags the conflict but outsources the solution.
  3.  **Perpetuating Bad Norms:** If the *current* norm is harmful or low-privacy (e.g., "Everyone just shares everything with the SRO"), the "reasonable expectation" test (Step 3) might accept it. This is why Step 4 (Binding Rules) is a critical backstop, and Step 5 demands conscious judgment about whether norms are *appropriate*.
  4.  **Predicting Future Misuse:** It assesses the *proposed* flow and rules. It cannot guarantee a vendor won't change practices later. Strong contracts (Step 4) and ongoing monitoring are essential supplements.
  5.  **Quantifying Risk:** It flags mismatches (Dealbreakers) and uncertainties (Handoffs) but doesn't measure "how bad" a mismatch is. A Handoff judgment call might accept a minor mismatch for high benefit (not Case 1!).
  6.  **Resource Constraints:** It identifies what *should* happen, not what's feasible if the district lacks bargaining power. A "Recommend NO" might be overruled.

  **Core Limitation of Your Framing:** The framing brilliantly focuses on contextual integrity. However, it inherently relies on defining "the setting" and "reasonable expectation." **When settings overlap ambiguously (student/patient) or when "reasonable expectation" is inherently contested (SRO role), the framing leaves the call genuinely undecidable on factual grounds alone.** Values, policy, and legal hierarchies *must* resolve it. The procedure exposes this, it doesn't solve it. Your insight is correct, but it reveals how messy context can be.
