  ### Rational Reconstruction of R's Moral Principle
  I'll approach this as a problem in rational reconstruction: identifying the simplest, most coherent moral principle that explains R's verdicts in cases (i) through (iv), then predict her response to your new case, and finally design a test case to separate viable rules. Your goal is to uncover the structure of R's reasoning, not to document existing theories. I'll start by brainstorming candidate rules that fit her four verdicts, then eliminate those that conflict with her judgments, and retain only those that fully align with her consistency. After that, I'll apply the surviving rules to your new case, predict R's verdict with reasoning, identify what the choice between rules turns on, and propose a decisive test case. I'll also note where my reasoning is weakest and what could change it.

  #### Step 1: Brainstorming Candidate Rules and Ruling Out Incompatible Ones
  R's verdicts reveal a pattern of anti-aggregation for small harms, except when harms are identical (case iv). Key features:
  - **Anti-aggregation for small harms**: In (i)-(iii), she prevents the single larger harm (torture, migraine, mild headache) over vast numbers of smaller harms (specks, pinpricks, faint itches), claiming smaller harms "do not add up."
  - **Aggregation for identical harms**: In (iv), she aggregates and prevents the billion headaches over the one, as they "do add up."
  - **No intensity-duration trade-offs**: All prior cases involve harms of similar or negligible duration (≤1 day), so duration is untested as a variable.
  - **Consistency in reasoning**: R gives "the same kind of reason each time," focusing on whether harms can "add up" to a comparable or worse harm.

  From this, I derive candidate rules. Each must explain why small harms don't aggregate to outweigh larger ones in (i)-(iii), but identical harms do in (iv). I consider only rules that treat intensity as primary, since duration hasn't been a factor.

  **Candidate Rules:**
  1. **Peak Suffering Rule**: Always prevent the outcome with the highest momentary intensity of suffering experienced by any single individual. If the highest momentary intensities are equal across outcomes, aggregate total harm (sum over people and time).
  2. **Complain-Worthiness Threshold Rule**: Only harms above a fixed intensity threshold (where a "reasonable person" would complain or resent the experience) have moral weight. Harms below this threshold cannot aggregate or outweigh harms above it. Harms above the threshold aggregate linearly.
  3. **Non-Additivity of Dissimilar Harms Rule**: Harms of different "types" (defined by intensity level or qualitative description) cannot be aggregated. Only harms of the same type (e.g., identical in intensity and nature) can be summed.
  4. **Scalar Discontinuity Rule**: Small harms have negligible moral weight that does not scale linearly; instead, there is a discontinuity where only harms above a certain intensity can be aggregated. Below this point, no number of small harms can outweigh a larger one.
  5. **Lifetime Burden Rule**: Compare the total burden experienced by each individual over their lifetime. Prevent the outcome where any individual has the greatest total burden (intensity × duration). If burdens are equal per person, aggregate across people.

  **Ruling Out Incompatible Rules:**
  - **Eliminate: Scalar Discontinuity Rule**. This fails case (iv). If small harms have negligible weight, identical mild headaches should not aggregate (since they are "small" relative to torture), but R explicitly aggregates them. Her verdict shows that identical harms are additive, so the rule must allow aggregation for some harms, not deem all small harms negligible.
  - **Eliminate: Lifetime Burden Rule**. This conflicts with all cases. In (i), the tortured person's lifetime burden is massive, but in (ii) and (iii), the pinprick or itch recipients have near-zero lifetime burden compared to the migraine/headache sufferer. Yet R always prevents the single larger harm, implying she doesn't compare total lifetime burden (e.g., a pinprick's lifetime burden is negligible, but she doesn't aggregate billions of them). Duration is also irrelevant in prior cases, so this rule overfits.

  **Surviving Rules:**
  - **Peak Suffering Rule**: Explains (i)-(iii) by focusing on the higher peak (torture > speck, migraine > pinprick, mild headache > faint itch), and (iv) by aggregating when peaks are equal.
  - **Complain-Worthiness Threshold Rule**: Explains (i)-(iii) if specks, pinpricks, and faint itches are below the threshold (not complain-worthy), while torture, migraines, and headaches are above. Explains (iv) by aggregating identical above-threshold harms.
