            - If we have good evidence but fail the tracking conditions, label as "assessed".
            - If we have weak evidence, label as "possible".

        If we are unsure about condition (i) or (ii) and the claim is of high importance, then escalate to the assessment desk manager.

    Step 8: If we passed all steps (1,2,4,5) and step 6 does not block, then we can label as "known".

