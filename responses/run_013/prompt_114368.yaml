          Option B: The method is trusting the source (which might have a track record).

     The problem: If we fix the method too narrowly (e.g., reading this document), then if the claim were false, we might still have read the same document and believed. So condition (i) fails. But if we fix the method as trusting the source, then we can consider: if the claim were false, would the source have reported it? And if the source would not have reported a false claim, then we would not have believed (because we trust the source only when they report).

