  We are building a decision procedure for labeling a claim as "known" based on Nozick's tracking account of knowledge. The tracking account requires:
    1. The claim is true.
    2. The belief is held.
    3. (i) If the claim were false, we would not believe it. (Sensitivity)
    4. (ii) If the claim were true, we would believe it. (Adherence)

   However, note that in our context, we are assessing whether we can label a claim as "known" for publication. We must break down the conditions and build a checklist.

   The procedure must be an ordered checklist. We also have specific requirements to address chaining, method description, non-vacuity, fallback, and stopping points.

   Steps:

   0. Precondition: We are considering a single claim (the conclusion) that we are about to label.

   1. Truth: We must establish that the claim is true. However, in practice, we cannot always know absolute truth. We work with evidence. So we interpret "true" as "we have sufficient evidence to affirm it as true" for our purposes? But note: the tracking theory requires actual truth. However, in our context, we are making an assessment. We cannot have absolute certainty. Therefore, we must interpret the conditions in a way that we can apply.

   But note: the tracking conditions are counterfactual. We cannot require absolute truth because we are not omniscient. Instead, we are going to use the evidence we have to make a judgment about whether the claim is true and whether the conditions hold.

   However, the firm's practice is to label as "known" only when we are very confident. So we will require that we have evidence that establishes the truth of the claim beyond reasonable doubt (for the purposes of our work). But note: the tracking conditions also require the counterfactuals.

   How to structure:

   Step 1: Is the claim true? 
     - We require evidence that establishes the truth to our satisfaction (beyond reasonable doubt for the context). 
     - If we cannot establish truth, then we cannot label as "known". We might downgrade to "assessed" or "possible".
     - What counts as sufficient? Evidence that we consider reliable and that directly supports the claim. If we have such evidence, we proceed. Otherwise, we stop and label as "assessed" or "possible" (depending on the strength of evidence).

   But note: the tracking theory has two more conditions. So we cannot stop at truth.

   Step 2: We believe the claim? 
     - In our context, if we are about to write it in a note, we must believe it. So this is usually satisfied. But we must check: do we, the assessment desk, believe it? If not, we cannot label as "known". But in practice, if we are considering labeling it as known, we must believe it. So we can assume this step is passed if we are at the point of writing it.

   However, to be safe, we include:

     "Has the assessment desk formed the belief that the claim is true based on the evidence?"
