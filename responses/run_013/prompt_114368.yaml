   Structure of the checklist:

    Step 1: Truth
        Question: Do we have sufficient evidence to affirm that the claim is true?
        Sufficient answer: Yes, if we have evidence that establishes the claim beyond a reasonable doubt in our professional context.
        If no: stop and label as "assessed" or "possible" (depending on the strength of evidence). Do not label as known.

    Step 2: Belief
        Question: Do we believe the claim? (That is, has the assessment desk formed the belief that the claim is true based on the evidence?)
        Sufficient answer: Yes (if we are writing it, we should believe). If no, then do not write it as known. (But this step is usually passed.)

    Step 3: Specify the method
        Question: What method did we use to form the belief? 
        Rule: Describe the process that produced the belief. This may include:
            - Relying on a specific source (e.g., "we read report X from source Y")
            - A chain of reasoning? But note: if the claim is a conclusion from a chain, we must be cautious (see step 6 below). 
        This is a judgment call. The analyst must describe the method as they actually used it.

    Step 4: Condition (i) - Sensitivity
        Question: If the claim were false, would we still have formed the belief via the specified method?
        Sufficient answer: We must be able to say "no, we would not have believed it if it were false". 
        How to answer:
            - Imagine a scenario where the claim is false. Then, in that scenario, would the method have led us to form the belief?
            - If we can think of a plausible scenario where the claim is false and the method would still lead us to believe, then the answer is that we would have believed even if false -> condition fails.
            - If we can say that in all plausible false scenarios, the method would not lead us to believe, then condition holds.
        If we are not sure: condition (i) is not satisfied. We cannot label as known. (But if the claim is very important, we might escalate.)
        Non-vacuity: If we cannot imagine any scenario where the claim is false, then we must consider: is the claim necessary? In our work, this is rare. If we cannot imagine a false scenario and we are sure it's necessary, then condition (i) is vacuously satisfied. But typically, we should be able to imagine a false scenario for empirical claims. If we cannot, that might indicate a problem (we are not thinking critically) and we should not label as known.

    Step 5: Condition (ii) - Adherence
        Question: If the claim were true, would we have formed the belief via the specified method?
        Sufficient answer: We must be able to say "yes, we would have believed it if it were true".
        How to answer:
            - Imagine a scenario where the claim is true. Then, in that scenario, would the method have led us to form the belief?
            - If we can think of a plausible scenario where the claim is true and the method would not lead us to believe, then condition fails.
            - Otherwise, if we can say that in the nearest true scenarios, the method would lead us to believe, then condition holds.
        If we are not sure: condition (ii) is not satisfied. We cannot label as known. (Escalate if important.)

    Step 6: Chaining rule (if the claim is a conclusion from a premise)
        Rule: If the claim was inferred from one or more premises, then we must not rely solely on that chain to satisfy the conditions. We require that the method described in step 3 is not solely an inference from a premise (even if the premise is known) because condition (ii) for the conclusion will likely fail. Instead, we must have a method that directly tracks the truth of the conclusion. 

