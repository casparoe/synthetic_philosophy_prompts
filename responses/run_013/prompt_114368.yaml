          But note: the firm might have a standard for truth. We are not sure. We'll proceed to the tracking conditions.

     Step 2: We believe.

     Step 3: Method: relying on the source.

     Step 4: Condition (i): If the claim were false, would we still have believed it? 
          We are told: the source would have told us the reassuring thing whether or not it was true. So if the claim were false, the source would still have reported it, and we would have believed. Therefore, condition (i) fails.

