     Claim: "a decision was taken" (conclusion)
     We inferred it from: "a minister attended a meeting" (premise), and we have a document from an unnamed source we have used before that says the minister attended. And we are writing the conclusion as known.

     Step 1: Truth? We have the premise that the minister attended, and we believe that attendance implies the decision. So we think the conclusion is true. So yes.
     Step 2: We believe it? Yes.
     Step 3: Method: We are forming the belief by inferring from the premise. The premise was believed because we read the document from the unnamed source.

     But note: the method for the conclusion is the chain: inference from the premise.

     Step 4: Condition (i) for the conclusion: 
          If the decision had not been taken (false), would we still have believed it? 
