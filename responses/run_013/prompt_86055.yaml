prompt: |-
  Alright, I need help writing something and I think you're the right kind of pedantic for this. My department has two factions that have been going at it for years and I want to force them into a single document.

  Faction one: 'grounding' is a real, primitive, worldly relation. Not causation. Not supervenience (roughly: fix the lower-level facts and the higher-level ones can't vary). Not reducible to essence, not reducible to plain modality. When they say the fact that the glass is fragile obtains *because* the fact that its molecules are arranged thus-and-so obtains, they take that 'because' to be tracking something in the world — a dependence that is neither causal nor just necessitation.

  Faction two: all of that is a façon de parler. There is no extra relation out there over and above the modal facts and the facts about what explains what. 'Fundamental' doesn't name a real structural feature of reality; it's at best a choice about which vocabulary you decide to treat as primitive when you write down your theory. Call them the grounders and the deflaters.

  I want the joint statement the two of them could actually both sign after a real, good-faith adversarial collaboration — not a survey, not a both-sidesing, an actual constructive document with both their names on it. Here's what I need in it.

  First, a numbered list of claims both can sign, and I mean non-vacuous ones. What do they both accept about the phenomena? That grounding claims seem asymmetric and irreflexive (nothing grounds itself)? That they're hyperintensional — i.e. two facts can be necessarily equivalent, true in all the same worlds, and still one of them ground the other while the converse fails? That the modal facts alone underdetermine the grounding facts? That 'grounds' isn't causal? Push on each of these until it's a claim neither side is just nodding along to dishonestly.

  Second, the disagreements, each one written in wording its own side would accept as fair to itself — so the grounder's formulation has to be one the grounder would say 'yes, thats me' to, and same for the deflater.

  Third, the cruxes: the sub-questions such that settling one would actually move at least one side. For each crux, give me the case, argument, or distinction that both sides agree bears on it, plus each side's prediction written down in advance.

  Now, some stuff I want you to inject, because I think the fight is partly tangled up in it and I want the document to have to handle it rather than float above it:

  (a) I have a suspicion I want tested, not assumed. I think a big chunk of this is a fight about *ideology* — about which notions a theory is allowed to take as primitive, and about how much ideological weight a theory can carry before you're just positing structure to save your preferred vocabulary. If a big chunk is really that, say so and say which chunk. But the two camps also seem to disagree about whether certain worlds are possible at all — e.g. a world with an infinitely descending chain of grounds and no fundamental level whatsoever, or a 'loop' where A grounds B and B grounds A — so maybe it's substantive after all. Sort this out.

  (b) Another suspicion: is part of the fight just a fight about formalism? One side tends to treat 'grounds' as a predicate that takes facts as arguments (a relation), the other treats the 'because' as a sentential connective (an operator you stick between whole sentences). If the two sides are running different formalisms, is the remaining dispute verbal, or does the choice of formalism carry real metaphysical weight? Don't let them off the hook with 'its just notation' unless that's actually true.

  (c) I want one concrete test both sides have to predict on. Take two theories that agree on every modal fact and every fact about what explains what, and differ only over whether there's a grounding relation in the world. Is there anything — anything at all — that could decide between them? Each side writes down its prediction and, separately, what it would count as evidence against its own view. If one side thinks nothing could decide it and the other thinks something could, that gap is itself a crux and I want it flagged.

  (d) A couple of specific cases they should both have to rule on, and I want to see whether their agreements here are real: a set and its members; a whole and its parts; a disjunction and its disjuncts; and the pair 'the shape is triangular' and 'the shape has three straight sides' (necessarily equivalent, but does either of these ground the other, or is neither grounded in the other?). If they agree on all four, say whether that agreement is doing any work or whether its just both sides being polite about the same labels.

  Format it as a numbered agreed-claims section, then a disagreements table, then a cruxes section where each crux gets its agreed-upon test and each side's prediction. And if any part of the disagreement turns out to be merely verbal, name the part and say exactly why it's verbal — I don't want a lazy 'its all semantics' cop-out, I want the specific word or formalism that's doing the misleading.
