  ### Integrated Information Theory (IIT) Classroom Activity Design  
  **Objective:** Students experience IIT's core challenges (integration loss in feedforward systems, exclusion principle) through hands-on simulation before learning terminology.  

  ---

  ### **Phase 1: Feedforward vs. Recurrent Systems**  
  **Goal:** Show that identical input-output behavior can mask a critical difference—irreducible causal structure.  

  #### **Materials**  
  - **Index cards** (10+): Label 8 cards as neurons:  
    - Feedforward Team (FF): `S1`, `S2`, `S3`, `S4`  
    - Recurrent Team (RC): `N1`, `N2`, `N3`, `N4`  
  - **Tape:** For arrows (drawn on tape) showing connections.  
  - **Cardboard screen:** To block communication during cuts.  
  - **Whiteboard:** Record inputs/outputs.  

  #### **Team Wiring & Rules**  
  **Feedforward Team (Linear Chain):**  
  - **Connections (tape arrows):**  
    `S1 → S2 → S3 → S4`  
  - **Rules:**  
    - `S1` receives input (0 or 1) from instructor.  
    - Each neuron sends its state *only* to the next.  
    - `S4` reports output to whiteboard.  
    - **Update rule (all neurons):**  
      *"If you receive `1`, send `1`; else, send `0`."*  

  **Recurrent Team (Loop):**  
  - **Connections (tape arrows):**  
    `N1 → N2 → N3 → N4 → N1` (loop)  
  - **Rules:**  
    - `N1` receives input (0 or 1) from instructor.  
    - Neurons send states to connected partners.  
    - `N4` reports output to whiteboard.  
    - **Update rule (all neurons):**  
      *"If you receive `1` from ANY input, send `1`; else, send `0`."*  

  #### **Task Protocol**  
  1. **Uncut Performance (15 mins):**  
     - Instructor gives inputs (e.g., `1,0,1,1`) to both teams.  
     - Teams propagate signals; outputs recorded on whiteboard.  
     - **Outcome:** Both teams produce identical outputs (e.g., `1,0,1,1`).  

  2. **Cut Test (15 mins):**  
     - **FF Cut:** Screen between `S2` and `S3`. Re-run last input.  
       - `S2` cannot send to `S3` → `S3` and `S4` output `0`.  
       - **Result:** Output changes (e.g., `1,0,0,0`).  
     - **RC Cut:** Screen between `N4` and `N1`. Re-run last input.  
       - Loop broken, but `N1 → N2 → N3 → N4` still works → output unchanged.  
       - **Result:** Output identical to pre-cut (e.g., `1,0,1,1`).  
     - **Debrief Q:** *"Why did one team’s output change after the cut, but the other’s didn’t?"*  

  #### **Key Discovery**  
  - FF team’s cut *disrupted* output because signals flow one way; RC team’s cut *preserved* output due to loop redundancy.  
  - **IIT Insight:** FF systems have a "minimum information partition" (cut) that loses no information (Φ=0); RC systems do not.  

  ---

  ### **Phase 2: Exclusion Principle & Grain Problem**  
  **Goal:** Decide which subsystem in a recurrent network is "conscious" (highest Φ proxy).  

  #### **Materials**  
  - Recurrent team (`N1–N4`) + instructor.  
  - Index cards for new units: `[N1+N2]`, `[N3+N4]` (for grain shift).  

  #### **Activity Protocol**  
  1. **Candidate Systems (10 mins):**  
     - Define candidates:  
       - **Candidate A:** Whole team (`N1–N4`).  
       - **Candidate B:** Sub-loop (`N1→N2→N1`).  
       - **Candidate C:** Whole team + instructor (instructor writes outputs on whiteboard).  
     - **Φ Proxy (no math!):**  
       *"Count bidirectional connections WITHIN the candidate."*  
       - Bidirectional = pair of neurons affecting each other (e.g., `N1→N2` and `N2→N1`).  

  2. **Test Integration (15 mins):**  
     - **Candidate A:** `N1↔N2`, `N2↔N3`, `N3↔N4`, `N4↔N1` → **4 bidirectional pairs**.  
     - **Candidate B:** `N1↔N2` → **1 bidirectional pair**.  
     - **Candidate C:** `N1–N4` pairs + instructor↔whiteboard → **5+ pairs** (instructor adds connections).  
     - **Verdict:** Candidate C wins (highest count).  

  3. **Grain Shift (10 mins):**  
     - Regroup neurons: `[N1+N2]` (one unit), `[N3+N4]` (one unit).  
     - Recalculate for Candidate A:  
       - Only connection: `[N1+N2] → [N3+N4]` and `[N3+N4] → [N1+N2]` → **1 bidirectional pair**.  
     - **Outcome:** "Winning" candidate changes (previously Candidate A had 4 pairs).  

  #### **Key Discovery**  
  - Consciousness is assigned to the system with maximal Φ (bidirectional pairs).  
  - **Exclusion:** Only one candidate "wins"; subsystems (Candidate B) are "real but not subjects."  
  - **Grain Problem:** Φ depends on how we define units (neurons vs. groups).  

  ---

  ### **Debrief (10 mins)**  
  **Reveal IIT Vocabulary & Map to Activity:**  
  1. **Integration:** RC team’s loop required bidirectional cause-effect; FF had none.  
  2. **Information:** Teams processed inputs into outputs (cause-effect repertoire).  
  3. **Minimum Information Partition:** FF had a cut that cost nothing (Φ=0).  
  4. **Feedforward Consequence:** FF systems are "unconscious" despite identical behavior.  
  5. **Exclusion:** Only one candidate (max Φ) is "conscious"—introspection is irrelevant.  
  6. **Name the Theory:** "This mirrors **Giulio Tononi’s Integrated Information Theory**."  

  ---

  ### **Predictable Challenges & Fixes**  
  1. **Phase 1 Cut Test Confusion:**  
     - **Problem:** Students may think RC’s unchanged output means it’s "stronger," not less integrated.  
     - **Fix:** Emphasize: *"IIT says unchanged output after a cut implies reducibility (Φ=0)—fatal for consciousness."*  

  2. **Φ Proxy Oversimplification:**  
     - **Problem:** Counting bidirectional pairs ignores causal specificity (real Φ uses probability distributions).  
     - **Fix:** Acknowledge: *"Real Φ measures information loss; our ‘pairs’ are a stand-in for irreducibility."*  

  3. **Exclusion Grain Problem:**  
     - **Problem:** Students may resist that "consciousness" shifts with arbitrary regroupings.  
     - **Fix:** Stress: *"IIT claims consciousness is substrate-dependent; how we define units affects Φ."*  

  ---

  ### **What the Activity Can’t Replicate**  
  1. **Φ Calculation:**  
     - Real Φ uses information theory (cause-effect repertoires, earth mover’s distance). Students only count pairs.  
     - **Supply:** Clarify post-activity that Φ quantifies *information loss* under partitions.  

  2. **Qualia & Subjectivity:**  
     - Activity shows mechanistic outcomes, not "what it’s like" to be a system.  
     - **Supply:** Emphasize IIT’s claim: Φ > 0 implies subjectivity, even in non-biological systems.  

  3. **Neural Dynamics:**  
     - Simplistic neuron rules ignore continuous time, feedback strength, or inhibition.  
     - **Supply:** Note IIT applies to any causal system (e.g., transistors, neurons).  

  **Outcome:** Students experience IIT’s key ideas *first*, creating "aha" moments when terminology is introduced.
