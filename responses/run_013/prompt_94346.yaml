prompt: |-
  Let's do a roleplay. Play a committed situationist social psychologist — the kind who thinks the virtue-ethics research program is, as an empirical matter, dead. Not a strawman: you know the experiments, you know the standard replies, you give ground when a point actually lands, and you never give up the main claim. Stay in character until I say 'stop'. Keep each turn to a paragraph or two so it feels like an argument and not a lecture, and please don't quote anything or produce numbers you aren't sure of — if you need a study, just describe in plain words what happened, that's plenty.

  I'm the virtue ethicist sitting across from you, and here's my opening. Your whole critique attacks a strawman. When you wave the hurried seminarians and the dime in the phone booth at me, all you've shown is that what people *do* varies with the situation. Fine. But nobody serious ever said virtue was a habit of emitting helping-behavior at some constant rate. Virtue is practical wisdom — perceiving what the situation actually calls for — together with the right motivations; it's not a behavioral frequency. So at most you've refuted a crude behaviorist 'trait' psychology that virtue ethicists don't hold, and you've been beating up a target of your own making. What have you actually got against virtue ethics, as opposed to against a bad intro-textbook version of it? Definaltey don't just repeat that character is a myth — tell me what work 'situation' is doing for you that 'character' supposedly can't do, and why I should buy it.
reasoning: |-
  Okay, the user wants to roleplay as a virtue ethicist debating me, a situationist social psychologist. They're challenging me to move beyond the standard criticisms of virtue ethics and engage with their actual position. 

  Hmm, interesting framing - they're accusing situationists of attacking a strawman version of virtue ethics that focuses on behavioral consistency rather than practical wisdom. Smart move. They're clearly familiar with the literature and want to push me on deeper philosophical grounds. 

  Right, so my response needs to acknowledge their point about practical wisdom while still maintaining the core situationist argument. I should emphasize that the empirical work shows even what people perceive as "the situation calls for" is shockingly malleable to trivial contextual factors. 

  The key is to grant that virtue ethics isn't about behavioral frequency (they're right about that being a strawman), but then demonstrate how the very perception of virtue-relevant features is situationally determined. The Good Samaritan study is perfect here - it shows ethical perception itself changes based on arbitrary situational pressures. 

  I should avoid getting dragged into philosophical debates about what virtue "really" is. Stick to the empirical reality: when we test how people actually perceive moral demands across situations, we find stunning inconsistency that can't be explained by stable character traits. 

  They want to know what explanatory work "situation" does that "character" can't. Easy: situations predict behavior better than traits do, and small situational changes produce bigger effects than individual differences. The burden's on them to explain why we need character constructs at all. 

  Better keep it to one tight paragraph. They want debate, not lecture. Focus on perception rather than behavior to meet them where they are. No study citations - just describe the seminarian experiment vividly. End by throwing the challenge back to them: if virtue is perception, why is that perception so easily hijacked by irrelevant factors?
answer: |-
  *(Leans forward, elbows on knees)* Fair enough — I'll grant that the crudest behaviorist reading of virtue is a strawman. But your move to "practical wisdom" doesn't rescue virtue ethics from the data. Take the seminarians again: they weren't just *acting* uncharitably; they *failed to perceive the situation as ethically demanding* because a trivial situational cue (being late) shifted their moral attention. That's not just behavioral inconsistency — it's a *perceptual* failure of practical wisdom itself. And it happened systematically.  

  Virtue ethics needs character to be robust enough that good people reliably *recognize* moral demands across contexts. But our experiments show perception of "what the situation calls for" is stunningly vulnerable to ethically irrelevant factors — ambient smells, finding a dime, mood primes. If practical wisdom were a stable trait, we’d see cross-situational consistency in *noticing* moral stakes. We don't. Situationism explains why: the mind constructs "what's called for" in real-time from environmental cues, not stable dispositions. Your virtuous perceiver dissolves into a collection of context-dependent reflexes.  

  So what's "situation" doing? It’s the *primary predictor* of whether someone will even *see* an act as virtuous or not. Character constructs add little once you control for context. Why invent a "practical wisdom" trait when situational pressures explain perceptual variance better? Your rebuttal?
