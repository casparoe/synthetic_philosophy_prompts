prompt: |-
  I teach an upper-level cognitive science seminar (mixed philosophy and psych majors) and I'm writing the in-class final. I want one essay question, 45 minutes of writing, 25 marks, on Bongard problems and what they do and don't show about getting a concept from a handful of examples. The problem is that every year half the class writes the same essay about how you can always cook up some rule that fits any finite pile of data, and its become a thing they recite rather than think about. So I made up my own Bongard problem to build the question around, and I'm fairly sure I broke it in an interesting way. Here it is, all twelve boxes:

  Each box has exactly one arrow and one circle in it. Left side, six boxes: the arrowhead points at the circle. Right side, six boxes: the arrowhead points away from the circle. That's the rule I meant. But I drew them carelessly in one respect: on the left side the circle is always to the left of the arrow, and on the right side the circle is always to the right of the arrow. Which means the arrow ends up pointing left in all twelve boxes, and now a solver can say the rule is just "circle on the left" versus "circle on the right" and get all twelve right, with a rule that's arguably cheaper to state than mine. The two rules agree on every box I gave and disagree the moment someone adds a box where the arrow points right.

  What I want the question to force is this: is my problem ill-posed, or is there something that settles which rule is the answer even though nothing in the twelve boxes does? And whatever they say there, I want them to say what it means for the claim that Bongard problems are a clean test of concept induction from a few examples. If the answer is that the designer's intent settles it, that seems to make solving them a communicative act rather than an inductive one, and I want them to face that consequence, not just assert it. I also want them to say whether a system that got the whole original set right would have demonstrated what people think it demonstrates, and whether my broken one changes that verdict.

  So: write me the essay question, a model answer of roughly 600 words pitched at what a strong student could actually produce in 45 minutes, and a marking scheme. The marking scheme should be a list of must-hit moves with the marks each is worth, adding to 25, and for each one a single line on how students typically get it wrong, so I can spot the B answers fast. No citations and no reading list anywhere in it, and don't let the model answer turn into a canned recitation of the old new-riddle-of-induction material. If a student wants to make that connection they can make it themselves; I just don't want it to be the whole answer.

  One more thing. Tell me where you're least confident, and specifically what would change your mind: if you had to defend a different answer to the ill-posed-or-not question, which argument or consideration would move you, and which of your must-hit points would you then have to drop or reweight? I'd rather the marking scheme come with its own escape hatch than pretend the crux is settled, and I want to know where your reasoning is most likely to be wrong.
reasoning: |-
  Okay, let me start by understanding the professor's problem. They teach a cognitive science seminar and are frustrated because every year, half the class writes the same essay about how any finite data can fit multiple rules. They created a custom Bongard problem where the intended rule is "arrow points at circle" vs "arrow points away," but due to careless drawing, all arrows point left, making "circle on left" vs "circle on right" a simpler alternative rule. The professor wants the essay question to force students to discuss whether this makes the problem ill-posed and what that implies about concept induction and Bongard problems as a test.

  The key points from the professor:  
  1. The essay should address if the problem is ill-posed and what determines the "correct" rule.  
  2. Students should consider the implications for Bongard problems as a clean test of concept induction.  
  3. If intent determines the rule, does that make solving Bongard problems a communicative act rather than inductive?  
  4. Discuss whether solving the original problem demonstrates concept induction and how the broken version affects that.  
  5. Avoid the standard "multiple rules fit data" regurgitation.  

  Now, I need to craft an essay question that targets these points. The question should present the Bongard problem as described, highlight the two possible rules, and ask students to argue whether the problem is ill-posed. It should then push them to discuss the implications for concept induction and Bongard problems in general.  

  For the model answer, I need to cover:  
  - Explaining how both rules fit the given examples.  
  - Discussing whether the problem is ill-posed and what resolves the rule (intent, simplicity, predictive power).  
  - Analyzing if Bongard problems are communicative acts vs. pure induction.  
  - Evaluating if solving an original Bongard problem truly tests concept induction.  
  - Considering how the broken version changes this evaluation.  

  The marking scheme must break down the key points with marks:  
  - Describe both rules (2 marks)  
  - Argue ill-posed or not (5 marks)  
  - Discuss resolution (intent, simplicity, etc.) (5 marks)  
  - Consequence for concept induction (6 marks)  
  - Original vs. broken problem implications (4 marks)  
  - Clarity and avoidance of canned arguments (3 marks)  

  Common mistakes to note:  
  - Just reciting "multiple rules fit data" without engaging the specifics.  
  - Ignoring the role of designer intent.  
  - Not distinguishing between the original and broken problems.  
  - Failing to address whether solving demonstrates concept induction.  

  My least confident point is whether the problem is ill-posed. If a student argues that predictive success on novel cases is part of concept induction, that could shift the view. For example, if the system is tested on arrows pointing right, the designer's rule would succeed, while the circle position rule fails. This suggests that induction isn't just about fitting data but also generalization, which might not make the problem ill-posed. If that argument is strong, I'd need to adjust the marks for the ill-posed section and emphasize predictive power more in the resolution part.
answer: |-
  ### Essay Question  
  **Bongard Problem Analysis: Induction, Intent, and 'Broken' Tests**  
  *(45 minutes, 25 marks)*  

  Consider the following custom Bongard problem:  
  - **Left side (6 boxes):** Arrow points at the circle.  
  - **Right side (6 boxes):** Arrow points away from the circle.  
  *However*, due to the arrangement of shapes in all boxes:  
    - On the left side, the circle is always positioned *left* of the arrow.  
    - On the right side, the circle is always positioned *right* of the arrow.  
    - Crucially, all arrows point leftward.  

  This allows two candidate rules to perfectly classify the 12 boxes:  
  1. **Rule A (intended):** "Arrow points at circle" (left) vs. "arrow points away" (right).  
  2. **Rule B (emergent):** "Circle on left of arrow" (left) vs. "circle on right of arrow" (right).  

  **Argue whether this problem is fundamentally ill-posed.** Then, regardless of your conclusion, address:  
  - What *resolves* which rule is "correct," given that both fit the data?  
  - What does this imply for Bongard problems as a "clean test" of concept induction from few examples? Specifically:  
    - If solving relies on the designer’s intent, does it become a *communicative act* rather than pure induction?  
    - Would a system solving the *original* Bongard problem (without the circle-position flaw) demonstrate successful concept induction? Does your "broken" version change this verdict?  

  Avoid generic claims about underdetermination (e.g., "any finite data fits many rules"). Focus on the implications of this specific case.  

  ---

  ### Model Answer (600 words)  
  This Bongard problem is not ill-posed—but its ambiguity exposes limitations in using such problems as pure tests of induction. Rule A (arrow-direction relative to circle) and Rule B (circle-position relative to arrow) both classify all 12 boxes correctly. Yet Rule B is simpler (spatial adjacency vs. vector direction) and exploits an unintended artifact: all arrows point left, making circle position a reliable proxy. Nothing in the *given data* distinguishes them. However, the problem remains well-posed because Bongard problems are embedded in a context of *evaluative intent*. The designer’s rule (Rule A) defines correctness for novel cases (e.g., a right-pointing arrow). Rule B would fail such tests (e.g., a circle left of a right-pointing arrow violates Rule B if the arrow points at it). Thus, resolution depends on *generalization demands*: induction isn’t just fitting data but capturing invariant structure for future cases implied by the task.  

  This undermines the view of Bongard problems as "clean" concept-induction tests. If the solver must infer designer intent, solving becomes partly a *communicative act*. The solver isn’t just extracting patterns from examples; they’re decoding a puzzle-maker’s conventions (e.g., that rules should generalize "naturally" beyond drawn artifacts). Here, Rule A reflects a deeper geometric invariant (directionality), while Rule B is parasitic on drawing constraints. A system might "solve" this by guessing Rule B, but that demonstrates *shallow pattern-matching*, not concept induction. The flaw thus reveals that Bongard problems test *compatibility with intended generalization*, not just data-fitting.  

  For the *original* Bongard problems (without such artifacts), a system solving them still demonstrates induction, but only if we assume intent aligns with generalizable structure. Original problems avoid accidental regularities (like all arrows pointing one way), so the simplest rule is likely the intended one. Success there shows an ability to isolate robust features (e.g., arrow-circle relations) from noise. But my broken version changes this: it shows that when artifacts *coincide* with simpler rules, induction can be "gamed" without grasping the concept. Thus, Bongard problems are reliable only when design ensures that the intended rule is the *only* parsimonious one invariant under transformation. In flawed cases, success may reflect luck or exploitation of biases, not conceptual understanding.  

  Ultimately, Bongard problems test *constrained* induction—where solver and designer share implicit goals (e.g., finding rules that generalize to novel orientations). Without this, Rule B’s victory highlights how induction can diverge from comprehension. Systems might pass such tests without "getting" the concept, if artifacts allow shortcuts. The lesson isn’t that Bongard problems fail, but that their purity relies on meticulous design to isolate structural insight from coincidences.  

  ---

  ### Marking Scheme (25 marks total)  
  **Must-hit moves and common pitfalls:**  

  1. **Describe both rules and why they fit the data** (2 marks)  
     - *Hit:* Clearly states Rule A (arrow direction relative to circle) and Rule B (circle position relative to arrow) and notes both classify all 12 boxes.  
     - *Common pitfall:* Misdescribing the rules (e.g., confusing arrow direction with shape position) or omitting why Rule B works (all arrows point left).  

  2. **Argue whether the problem is ill-posed** (5 marks)  
     - *Hit:* Takes a stance (e.g., "not ill-posed due to generalization context" or "ill-posed without designer input") and justifies it.  
     - *Common pitfall:* Asserting it’s ill-posed *only* because multiple rules fit, without addressing resolution mechanisms (e.g., intent or generalization).  

  3. **Explain what resolves the "correct" rule** (5 marks)  
     - *Hit:* Discusses designer intent *and* generalization (e.g., Rule A handles novel arrow directions; Rule B fails). May mention simplicity but notes it’s insufficient here.  
     - *Common pitfall:* Focusing solely on simplicity (ignoring that Rule B is simpler but contextually invalid) or appealing only to authority ("designer decides").  

  4. **Consequence for concept induction** (6 marks)  
     - *Hit:* Links ambiguity to Bongard problems as communicative acts (intent shapes generalization expectations). Distinguishes data-fitting from conceptual grasp.  
     - *Common pitfall:* Only reciting "Bongard tests induction" without addressing how intent shifts it toward communication.  

  5. **Evaluate original vs. broken problems** (4 marks)  
     - *Hit:* States original problems *can* demonstrate induction if designed cleanly, but broken version shows artifacts enable false positives.  
     - *Common pitfall:* Claiming original problems are flawless or that the broken version invalidates *all* Bongard problems.  

  6. **Avoids canned underdetermination, clarity** (3 marks)  
     - *Hit:* No rote "many rules fit data" tangents; answer is structured and focused on the case.  
     - *Common pitfall:* Spending >25% of the essay on general underdetermination without tying it to Bongard flaws.  

  ---

  ### Where I’m Least Confident and Escape Hatch  
  **Weak point:** My claim that the problem is **not ill-posed** hinges on generalization demands (e.g., handling right-pointing arrows) being inherent to concept induction. A strong counterargument could contend that induction *only* concerns the given data—so without explicit novel test cases, the problem *is* ill-posed, and intent is irrelevant.  

  **What would change my mind:** If a student argues that concept induction is strictly about *compressing observed data* (e.g., Solomonoff induction), then Rule B’s simplicity makes it objectively better, and the problem *is* ill-posed because "correctness" requires external teleology (designer intent). This would force me to:  
  - Reduce weight for **Point 2 (ill-posed)** from 5 to 3 marks (since it’s more defensible).  
  - Increase weight for **Point 3 (resolution)** to 7 marks (emphasizing that "correctness" must then rely entirely on intent/pragmatics).  
  - Reframe **Point 4 (consequence)** to stress that Bongard problems *always* blend induction and communication, even in "clean" cases.  

  **Why I’m tentative:** Cognitive science debates whether induction includes *predictive generalization* by default or if that’s a separate layer. Your psych/philosophy mix means students might split here—hence the marking scheme must accommodate both views if well-argued.
