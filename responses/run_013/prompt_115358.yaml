answer: |-
  The inconsistencies you observe reveal profound tensions in the implicit theories of democracy underlying these institutions. Below is a reconstruction of their presuppositions, tensions, and alternatives:

  ### Core Presuppositions
  1. **Vote as Aggregated Preference, Not Judgment**:  
     - Practice assumes votes express *fixed preferences* (not deliberative judgments), as evidenced by minimal turnout/information requirements.  
     - Yet pamphlet requirements (CA) hint at a *limited epistemic hope*—voters can digest pre-packaged arguments but cannot be trusted to amend proposals.

  2. **Popular Will as Pre-Political**:  
     - Initiatives treat the "popular will" as existing prior to institutions, merely *recorded* by procedures. This explains take-it-or-leave-it ballots: the people’s intent is assumed crystallized in the proposal.

  3. **Legitimacy as Hybrid**:  
     - **Consent-focused**: Simple majorities for initiatives assume legitimacy flows from direct popular consent.  
     - **Consequentialist**: Supermajorities for taxes imply fear of *majoritarian error* (e.g., "tyranny of the majority" over property rights).  
     - **Silence on turnout/information**: Reveals *proceduralism*—legitimacy derives from the *act* of voting, not voter competence or reasons.

  4. **Polity as Dual Entity**:  
     - Double majorities (Switzerland) presuppose two irreducibly distinct sovereignties:  
       - The *demos* (individual citizens aggregated).  
       - The *federal union* (member states as corporate bodies).  
     - Equal canton weight prioritizes *territorial integrity* over individual equality, assuming cantons are permanent political communities.

  5. **Issue-Separability**:  
     - Single-subject rules assume policies are modular: majority support on Issue A ≠ support for linked Issue B. This rejects logrolling but ignores policy interdependence (e.g., a tax cut initiative may presuppose service cuts).

  ### Tensions & Ruled-Out Theories
  - **Contradiction**: Tax supermajorities assume voters are *incompetent* to judge fiscal policy by majority rule, yet initiative majorities assume *competence* on constitutional design. This is **genuinely inconsistent**—it quietly endorses *populism* (people are wise) for structure but *elitism* (people are reckless) for resources.  
  - **Ruled-Out Views**:  
    - *Pure Deliberative Democracy*: Rejected by no-revision initiatives and lack of required discourse.  
    - *Epistemic Democracy*: Rejected by ignoring voter knowledge (no competency tests).  
    - *Majoritarian Absolutism*: Rejected by supermajority safeguards.  

  ### Underdetermined Areas
  - **Legitimacy Foundations**: Rules accommodate both:  
    - *Procedural Fairness* (consent via voting).  
    - *Liberal Constitutionalism* (supermajorities as minority shields).  
  - **Popular Will**: Practice is agnostic on whether "will" is unified or fragmented—initiatives assume unity; single-subject rules assume fragmentation.

  ### Alternative Theories: Changes Required
  **Adopt **Deliberative Democracy** (e.g., Habermasian):**  
  - **Mandatory Revision**: Initiatives could be amended by legislature/assembly.  
  - **Turnout/Information Thresholds**: Votes invalid if turnout <50% or pamphlet engagement unverified.  
  - **Supermajorities Abolished**: Replaced with citizen assemblies drafting proposals after deliberation.  
  - **Ballot Pamphlets**: Include structured dialogues, not just pro/con arguments.  

  **Adopt **Epistemic Democracy** (e.g., Condorcet Jury Theorem):**  
  - **Competency Filters**: Voters pass basic quizzes on measures to vote.  
  - **Supermajorities Generalized**: All major decisions require 60% (assuming majority reliability <100%).  
  - **Double Majority Abolished**: Cantonal vote replaced with demographic diversity quotas.  

  **Adopt **Pure Aggregative Democracy**:**  
  - **Supermajorities Eliminated**: All decisions by simple majority.  
  - **Cantonal Vote Abolished**: Violates "one person, one vote."  
  - **Single-Subject Rule Repealed**: Allow omnibus initiatives.

  ### Conclusion
  The practices presuppose an **unstable hybrid**: a *proceduralist-populist* view for initiatives (majority = legitimate) and a *consequentialist-liberal* view for taxes (majority = potentially oppressive). This reflects a deeper tension between democracy as *will of the people* and democracy as *guardian against itself*. The inconsistency is revealing—it exposes direct democracy’s struggle to reconcile popular sovereignty with liberal skepticism of unchecked majorities.
