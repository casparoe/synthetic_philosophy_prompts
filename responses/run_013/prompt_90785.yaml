prompt: |-
  Okay so I was at a friend's place over the weekend and he got onto this puzzle he loves — the two-envelope thing — and he gave me his whole take on it, and I want to know how much of it to beleive before I repeat it to anyone else. His setup: someone fills two envelopes, one contains exactly twice what the other does, you pick one at random and open it. Say you find $40. He says the other envelope holds either $80 or $20, and since the envelopes were filled by a coin-flip sort of process it's a straight 50/50 which one you happened to grab, so the expected value of switching is (1/2)(80) + (1/2)(20) = $50, which beats the $40 you're holding, so you should always switch. But then he says: before you open anything you could have run the exact same argument about the envelope you're already holding, so you'd be switching back and forth forever, which is absurd. Fine, so far so good. Here's his resolution, and this is the part I want checked. He says the whole thing is a category error, because probability is about frequencies in repeated experiments and this is a one-time event — the $80 and the $20 are both just sitting there in the world, fully determined, so once you're staring at the $40 there's no remaining randomness for the 50/50 to attach to, and the expected-value computation is a statistical tool being used where it doesn't belong. He added that the deeper lesson is that expected-value reasoning is only really safe when there are finitely many possible amounts, and that the '50/50 at every value' assumption only ever holds if there are infinitely many possible amounts, which is why he says this puzzle is basically the same animal as the St. Petersburg paradox and shows that expected utility theory can't be made fully consistent. I nodded along but I couldn't have pushed back if I'd wanted to, and he's usually sharp so I half believe him.

  Can you go through it and tell me what someone who actually works on decision theory would say — which parts are right, which are the standard simplifications people make, and where he's just wrong? The bit that felt shakiest to me was the 'it's a one-off so there's no probability' move, but I couldn't say why, so please deal with that squarely: does it dissolve the paradox or just dodge it? Dont cite papers or names, I can't look anything up right now and I'd rather just have the reasoning.

  Lay it out like this: 'What's at stake' — a short paragraph, maybe 60-80 words, restating the actual problem. Then 'Where he's right' — brief, a few bullet points. Then 'Where he slips' — the long one, go through his claims one at a time and say what's off, this can be several hundred words. Then 'Does the paradox survive' — one paragraph on what the real state of play is once the reasoning is fixed. Then 'Bottom line' — three or four sentences on whether I should trust his version.
