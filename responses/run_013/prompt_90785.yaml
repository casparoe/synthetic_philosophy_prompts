  First, I need to recall the core of the two-envelope paradox. You pick an envelope, find $40, and calculate the expected value of switching as $50, suggesting you should switch. But symmetry implies the same logic applies before opening, leading to infinite switching. The friend's resolution hinges on rejecting probability post-observation, calling it a category error.

  Assessing where the friend is right: The initial paradox setup is correct, and the symmetry argument exposing the absurdity is valid. He's also right that the 50/50 assumption is problematic, and the connection to infinite expectations (like St. Petersburg) is legitimate. But where does he slip?

  The key flaw is claiming that probability doesn't exist in one-time events. Probability isn't solely about frequencies; it can represent epistemic uncertainty. Even if the amounts are fixed, your knowledge is limited, so probability applies. The real issue is the flawed 50/50 assumption across all possible values. If the envelope amounts have a prior distribution, the conditional probability after seeing $40 might not be 50/50. For example, if larger amounts are less likely, switching could be disadvantageous. The paradox persists precisely because people overlook this prior.

  The friend incorrectly conflates the issue with expected utility theory's consistency. The paradox highlights misuse of probability, not a fundamental flaw in decision theory. Expected value calculations are valid with proper priors. The resolution involves recognizing that the 50/50 assumption is inconsistent with any prior distribution, hence the need for Bayesian reasoning.

  The user's concern about dismissing probability in one-off events is spot-on. The friend's argument dodges the paradox by denying probability, but the deeper resolution requires better probability modeling. The paradox survives as a cautionary tale about implicit assumptions.

  Bottom line: The friend is sharp on the surface but misses the core probabilistic misstep. His resolution is incomplete, and the user should be cautious about repeating it. The paradox is resolved by addressing the prior distribution, not abandoning probability.
answer: |-
  ### What's at Stake
  The paradox involves two envelopes: one contains double the amount of the other. You pick one randomly, open it (say, to $40), and calculate that switching has an expected value of (0.5 × $80) + (0.5 × $20) = $50, suggesting you should switch. But symmetry implies the same logic applies before opening, forcing infinite switching—a logical absurdity. The core question is whether expected-value reasoning is misapplied here and why.

  ### Where He's Right
  - **Initial setup is correct**: Yes, with $40 observed, the other envelope must be $20 or $80.
  - **Symmetry exposes absurdity**: Correct that pre-opening, identical logic for either envelope would imply always switching.
  - **50/50 assumption is flawed**: Right that treating "double or half" as equally likely *regardless of the observed value* is problematic.
  - **Link to infinite cases**: Valid connection to St. Petersburg; both involve unbounded expectations.

  ### Where He Slips
  #### 1. **"One-time event, no randomness" is a misstep**
     - **Why it’s wrong**: Probability isn’t *only* about long-run frequencies; it can represent *epistemic uncertainty* (your lack of knowledge). Even if the amounts are "fixed," you don’t know which envelope you hold. Before opening, there’s a clear 50% chance of picking the richer envelope. After seeing $40, uncertainty shifts to whether $40 is high or low—but this *is* probabilistic unless you know how the envelopes were filled. Dismissing probability here dodges the paradox but doesn’t resolve it.

  #### 2. **"Expected value doesn’t belong here"**
     - **Why it’s incomplete**: Expected value *can* apply to one-off decisions under uncertainty. The flaw isn’t the tool itself, but *how it’s applied*. The calculation (0.5 × $80 + 0.5 × $20) assumes that $20 and $80 are equally likely *conditional on seeing $40*. This ignores the **prior distribution** of possible amounts. If large amounts are less probable (e.g., filling envelopes with $10/$20 or $20/$40, not $1,000/$2,000), seeing $40 might make $20 *more likely* than $80—breaking the 50/50 symmetry.

  #### 3. **"50/50 only holds with infinite possible amounts"**
     - **Why it’s backwards**: The paradox *arises* because people assume 50/50 *without* specifying a prior. In reality:
       - If amounts are bounded (e.g., max $100), seeing $40 likely means it’s the higher amount (since $80 would exceed the max), so switching is bad.
       - If amounts are unbounded, the 50/50 assumption implies an **improper prior** (like "all amounts equally likely"), which is mathematically incoherent (probabilities can’t sum to 1). This *causes* the paradox—not resolves it.

  #### 4. **"Same as St. Petersburg; expected utility is inconsistent"**
     - **Why it’s overstated**: St. Petersburg involves infinite expected value from unbounded payoffs; this paradox involves inconsistent conditional expectations. Both highlight issues with unbounded distributions, but **expected utility isn’t "inconsistent"**—it works when priors are well-defined. The problem here is an *ill-posed prior*, not a failure of decision theory.

  ### Does the Paradox Survive?
  Yes, but as a **cautionary tale**, not an unresolvable flaw. The paradox dissolves once you specify a prior distribution for the envelope amounts. For example:
  - Assume the smaller amount is chosen from a distribution (e.g., uniform between $10 and $100).
  - Seeing $40 updates your belief: if $40 is likely "high" (e.g., near $100), switching is bad; if "low" (near $10), switching is good.
  - Crucially, the expected gain from switching *averages to zero* across all possible priors, matching intuition. The error is assuming 50/50 *without context*.

  ### Bottom Line
  **Don’t fully trust his version.** He’s sharp on the surface—spotting symmetry and the 50/50 flaw—but his "no probability in one-off events" claim dodges the real issue. **Where he’s wrong:** Probability *does* apply to epistemic uncertainty, and expected value *is* valid here if used correctly. **The actual resolution:** The paradox stems from an unspecified prior, not a category error. You can repeat his points about symmetry and St. Petersburg, but push back on banning probability—instead, emphasize that **the 50/50 assumption is unjustified without knowing how the envelopes were filled**. That’s the key insight.
