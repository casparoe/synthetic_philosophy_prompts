prompt: |-
  I am assembling materials for a graduate seminar on practical rationality, and I need one document I can circulate to two colleagues who have now argued for two years about the escalation that the so-called dollar auction produces. The game is this: a prize of fixed, publicly announced value is auctioned, bids rise in small increments, the highest bidder pays what he bid and takes the prize, and the second-highest bidder also pays what he bid and receives nothing. Bidding routinely continues past the value of the prize, and both of the last two bidders end up paying more than the prize was ever worth.

  One of my colleagues holds what I will call the error theory: this escalation is a systematic failure of practical rationality, the sunk-cost fallacy in its purest institutional form, and the trapped bidder is best described as someone who is making a mistake at each step -- a mistake he could have avoided entirely by declining to enter. The other holds the structural reading: once the auction is under way, continuing is the better response to the situation the bidder is actually in, so the defect lies in the incentive structure rather than in anyone's reasoning, and "irrational" is functioning as a term of abuse for a pattern that a sensible agent with ordinary preferences -- including preferences about not having been made a fool of, and about not having wasted what he has already spent -- would reliably reproduce.

  Draft the joint statement these two could put their names to. I want:

  1. A numbered list of claims both accept, covering the structure of the game, what a rational agent would do at the moment of entry, the qualitative pattern of behaviour that both agree is to be explained, and whatever else they can settle. No claim may smuggle in a concession in the guise of neutral description.
  2. An exact statement of what remains in dispute, with each position formulated in the wording its own adherent would accept, so that a reader can see the two are genuinely incompatible rather than differently phrased. Where part of the dispute is verbal, say which part and supply the disambiguated formulation; I suspect at least the question whether "irrational" is predicated of the choice given the agent's preferences or of the preferences themselves.
  3. The cruxes -- the sub-questions such that settling one would move at least one side -- together with, for each, the case or argument both sides agree bears on it and each side's prediction recorded in advance. Candidates I would like considered, though they should add or drop as they see fit: whether the escalation survives when bids are sealed and each bidder must post a whole schedule in advance, and whether the two-bidder and many-bidder versions are the same phenomenon or two.
  4. One variant of the auction that both sides agree would discriminate between their views, with predictions written down before the outcome is known and an explicit statement of what result each side would count as evidence against its own position. One candidate I want included among those considered: the auction in which the runner-up's payment buys him a consolation of stated value, so that bidding past the prize is no longer transparently a mistake. Whether that variant helps one side or dissolves the dispute is for them to judge.

  The document should stand or fall by its argument, so keep it free of citations and appeals to authority. Format it as a numbered agreed-claims section, then a disagreements table, then the cruxes with their pre-registered predictions.
reasoning: |-
  We are drafting a joint statement for two colleagues who disagree about the dollar auction. We have four main sections: agreed claims, disagreements, cruxes with predictions, and a variant test. 

  First, we list the agreed claims. These must be neutral and accepted by both sides. We cover the game structure, the behavior to be explained, and what a rational agent would do at entry.

  Second, we present the exact dispute. We state each position in the wording its adherent would accept and note any verbal disagreements.

  Third, we list the cruxes (sub-questions) and for each, we state the argument both sides agree bears on it and each side's prediction.

  Fourth, we propose one variant that both sides agree would discriminate between their views, and we state each side's prediction and what result would falsify their position.

  We avoid citations and authority. We format as:

  1. Agreed Claims (numbered list)
  2. Disagreements (table or clear list of positions)
  3. Cruxes (each with description, common ground, and predictions)
  4. Discriminating Variant (with predictions and falsification conditions)

  Let's begin.

  ## 1. Agreed Claims

  Both parties agree on the following:

  1. **Game Structure**: The auction offers a prize of fixed, publicly known value (say, $1). Bidding proceeds in small, fixed increments (e.g., $0.05). The highest bidder wins the prize and pays their bid. The second-highest bidder pays their bid and receives nothing.

  2. **Observed Behavior**: In practice, bidding often continues beyond the value of the prize. The two highest bidders end up paying more than the prize is worth, with the winner paying more than the prize value and the runner-up paying a positive amount for nothing.

  3. **Entry Decision**: A rational agent, at the moment of deciding whether to enter the auction (with no bids yet placed), would recognize that entering carries a risk of loss and that the expected utility of entering is negative or at least not clearly positive. Therefore, a rational agent would decline to enter.

  4. **Escalation Pattern**: Once the auction has proceeded to a point where two bidders have bid above a trivial amount (say, beyond the first few bids), they often become locked in a pattern of incremental bidding that continues past the prize value. This pattern is robust and occurs in both experimental and theoretical analyses.

  5. **No Collusion or External Motives**: The escalation occurs even when bidders are self-interested, have no prior grudges or alliances, and are motivated solely by monetary gain (or, in the structural view, by the preferences they actually have, which may include non-monetary factors such as avoiding the feeling of having been made a fool of, but without assuming any irrationality in the formation of those preferences).

  6. **Non-Cooperative Setting**: The auction is non-cooperative; bidders act independently without communication.

  7. **Incentive to Bid Higher for the Leader**: At any stage, the current highest bidder (the leader) faces a choice: if they stop, they lose what they have already bid (which becomes a sunk cost) and get nothing. If they continue, they might win and reduce their loss (if the prize value is greater than the next bid) or even turn a profit (if the next bid is still below the prize value). Similarly, the second-highest bidder (the trailer) faces a choice: if they stop, they lose their current bid and get nothing. If they continue, they might become the leader and have a chance to win.

  8. **The Trap**: Both bidders become trapped in a situation where, from their perspective at each step, continuing to bid seems to offer a better outcome than stopping, even as the bids exceed the prize value.

  ## 2. Disagreements

  The dispute centers on the rationality of the bidding behavior once the auction is underway and the bidders are trapped. The two positions are:

  - **Error Theory (ET)**: The escalation is a systematic failure of practical rationality. At each step beyond the point where the bid exceeds the prize value, the bidder is making a mistake by continuing to bid. This mistake is driven by the sunk-cost fallacy: the bidder irrationally factors in the sunk costs (the amount already bid) when deciding to continue, rather than considering only the future costs and benefits. The bidder could and should have avoided this by not entering the auction. The term "irrational" applies to the choice at each bidding step beyond the prize value because, given the agent's actual preferences (which are assumed to be solely about monetary outcomes, or at least do not include a strong intrinsic desire to avoid the feeling of having wasted the sunk cost), the expected utility of continuing is lower than stopping. The defect is in the reasoning process.

  - **Structural Theory (ST)**: The escalation is a rational response to the incentive structure of the auction. Once the bidding has reached a point where both bidders have invested, continuing is the better response to the situation the bidder is in. The bidder's actual preferences include not only monetary outcomes but also non-monetary factors such as avoiding the feeling of having been made a fool of or the regret of having wasted the sunk cost. Given these preferences (which are not irrational in themselves), the choice to continue is rational. The defect lies in the rules of the auction, which create a situation where even rational agents with ordinary preferences (which include aversion to wasted effort and embarrassment) end up in a mutually harmful escalation. The term "irrational" is misapplied because it is predicated on an incorrect assumption that the agent's preferences are solely about the monetary outcome.

  **Verbal Disagreement Clarification**: The dispute is not merely verbal. However, there is a verbal element regarding the term "irrational." ET uses "irrational" to mean that the agent's choice is suboptimal given the agent's actual preferences (which ET assumes are solely monetary). ST uses "rational" to mean that the choice is optimal given the agent's actual preferences (which ST argues include non-monetary factors). To disambiguate, we can say the core disagreement is:

  - ET: The agent's actual preferences are (or should be) only about monetary outcomes, and thus the choice to continue when the bid exceeds the prize value is irrational because it leads to a net monetary loss that could have been avoided.

  - ST: The agent's actual preferences include non-monetary factors (e.g., avoiding the feeling of having wasted the sunk cost or being embarrassed), and thus the choice to continue is rational because it maximizes expected utility given these preferences.

  However, the dispute is also substantive: ET holds that the non-monetary factors (like regret) should not be part of a rational agent's utility function in this context, or if they are, they are irrational. ST holds that these factors are legitimate and that a rational agent would include them.

  ## 3. Cruxes

  We identify key sub-questions that could move the debate. For each, we state the argument both agree bears on it and the predictions of ET and ST.

  ### Crux 1: Does the escalation occur in a sealed-bid version where bidders submit entire schedules in advance?

  - **Common Ground**: Both agree that if the escalation is due to a dynamic reasoning failure (as ET claims), then when bidders are forced to plan their entire strategy in advance without the heat of the moment, they might avoid the escalation. If the escalation persists, it supports ST because it shows the trap is inherent in the structure and can be foreseen.

  - **ET Prediction**: In the sealed-bid auction, rational bidders would not submit schedules that lead to bids above the prize value. The escalation pattern would not occur because bidders would recognize the trap at the planning stage and avoid it by not bidding beyond a certain point.

  - **ST Prediction**: In the sealed-bid auction, rational bidders would still submit schedules that lead to bids above the prize value because the incentive structure remains. The runner-up still pays without winning, so the same strategic considerations (including the desire to avoid being the runner-up) would lead to overbidding.

  ### Crux 2: Are the two-bidder and many-bidder versions the same phenomenon?

  - **Common Ground**: Both agree that the dollar auction is often studied with two bidders, but with more bidders, the dynamics might change. If the escalation in the two-bidder case is due to a different mechanism than in the many-bidder case, then the two may not be the same phenomenon.

  - **ET Prediction**: In the two-bidder case, the escalation is driven by the sunk-cost fallacy and is a mistake. In the many-bidder case, the same mistake occurs because each bidder, when they become one of the top two, faces the same situation. Thus, it is the same phenomenon.

  - **ST Prediction**: In the two-bidder case, the escalation is a rational response to the structure. In the many-bidder case, the escalation might be even more pronounced because bidders might drop out earlier, leaving the last two in the same trap. Alternatively, with more bidders, the escalation might start at a higher bid level because more bidders are willing to bid low. But the fundamental mechanism is the same: the auction rules create a situation where the top two bidders are trapped. Thus, it is the same phenomenon.

  ## 4. Discriminating Variant

  We propose a variant that both sides agree could test their views.

  ### Variant: Consolation Prize Auction

  - **Description**: The auction rules are changed so that the runner-up (the second-highest bidder) receives a consolation prize of stated value (say, $0.50) for which they pay their bid. The prize remains $1. The consolation prize is known in advance.

  - **Common Ground**: Both agree that if the escalation past the prize value disappears or is reduced, it supports ET because the non-monetary factors (like avoiding total loss) are lessened. If the escalation persists, it supports ST because the structural trap remains.

  - **ET Prediction**: With a consolation prize, the runner-up does not face a total loss. Therefore, the sunk-cost fallacy is less powerful. Bidders would be less likely to bid beyond the prize value because the loss if they stop is mitigated. The escalation past $1 would be rare.

  - **ST Prediction**: The structural trap remains because the runner-up still pays their bid and only gets a consolation prize that is less than the main prize. The incentive to avoid being the runner-up is still present, and bidders would still escalate beyond the prize value in the same way.

  - **Falsification Conditions**:
    - ET would consider it evidence against their view if the escalation past $1 occurs at the same rate as in the standard dollar auction.
    - ST would consider it evidence against their view if the escalation past $1 is significantly reduced or absent.

  Now we assemble the document accordingly.
answer: |-
  ### Joint Statement on the Dollar Auction Dispute  
  **Agreed by Advocates of the Error Theory (ET) and Structural Theory (ST)**  

  #### 1. Agreed Claims  
  Both parties endorse the following statements about the dollar auction:  
  1. **Game Structure**: A prize of fixed, publicly known monetary value \( V \) (e.g., $1) is auctioned. Bidding proceeds in small, fixed increments (e.g., $0.05). The highest bidder wins the prize and pays their bid. The second-highest bidder pays their bid and receives nothing.  
  2. **Entry Rationality**: A rational agent with standard self-interested preferences (e.g., maximizing monetary gain) would decline to enter the auction at the outset, recognizing that expected utility is negative or indeterminate due to the risk of escalation.  
  3. **Behavioral Pattern**: In practice, once bidding begins, it routinely escalates beyond \( V \). The winner pays more than \( V \), and the runner-up pays a positive amount for no reward. This "trap" occurs robustly in both analytical models and empirical studies.  
  4. **Agent Incentives Mid-Auction**: At any stage where two bidders are active:  
     - The current leader (highest bidder) faces a choice: stop and incur a loss equal to their bid, or bid higher to potentially win and mitigate/avoid loss.  
     - The current trailer (second-highest bidder) faces a choice: stop and incur a loss equal to their bid, or bid higher to become the leader and potentially win.  
  5. **Dominant Strategy Absence**: No dominant strategy exists for bidders once bidding exceeds trivial levels. Decisions depend on beliefs about others’ actions.  
  6. **No Exit Rationalization**: Once bids exceed \( V \), stopping immediately would lock in a loss greater than the maximum possible gain from winning. Continuing may reduce the net loss if the opponent concedes.  
  7. **Non-Cooperative Context**: Bidders act independently without communication or binding agreements.  
  8. **Explanandum**: Both theories aim to explain why bidders escalate beyond \( V \) despite foreseeing losses, and why this pattern is reproducible.  

  ---

  #### 2. Disagreements  
  The dispute centers on whether escalation constitutes irrational choice or rational response. Each theory is stated in its adherent’s preferred wording:  

  | Position | Formulation |  
  |----------|-------------|  
  | **Error Theory (ET)** | Escalation beyond \( V \) is a systematic failure of practical rationality. At each bidding step, the bidder commits the sunk-cost fallacy by treating irrecoverable past bids as relevant to future decisions. The bidder’s choice to continue is irrational given their actual preferences (monetary gain and loss avoidance), as stopping minimizes future losses. The defect lies in the reasoning process, not the game structure. |  
  | **Structural Theory (ST)** | Escalation beyond \( V \) is rational given the bidder’s actual preferences (which include monetary outcomes and non-instrumental goals like avoiding wasted effort or shame). At each step, continuing is the utility-maximizing choice because stopping guarantees an immediate loss, while continuing offers a chance to shift loss to the opponent. The defect lies in the incentive structure, which pits rational agents against each other. |  

  **Verbal Disambiguation**:  
  - The term "irrational" is predicated differently:  
    - ET: Irrationality applies to the *choice* given the agent’s preferences (e.g., "Continuing when \( \text{bid} > V \) is irrational because it ignores that sunk costs are irrelevant").  
    - ST: Irrationality applies only to the *preferences themselves* if they are inconsistent or self-defeating (e.g., "Preferences including loss-aversion are rational; thus choices serving them are rational").  
  - **Core Incompatibility**: ET asserts escalation is a *reasoning error*; ST asserts it is a *structural inevitability* for agents with ordinary preferences.  

  ---

  #### 3. Cruxes  
  Sub-questions that could resolve the dispute, with predictions recorded in advance. For each, both agree on the relevance of the argument described.  

  **Crux 1: Does escalation occur in a sealed-bid auction where bidders submit full schedules in advance?**  
  - **Argument**: If escalation persists without real-time interaction, it supports ST (structural trap exists ex ante). If it vanishes, it supports ET (escalation requires iterative reasoning errors).  
  - **ET Prediction**: Escalation beyond \( V \) will not occur. Bidders will pre-commit to bids ≤ \( V \) because they recognize the trap when forced to plan holistically.  
  - **ST Prediction**: Escalation beyond \( V \) will occur. Bidders will pre-commit to bids > \( V \) because the incentive to avoid runner-up losses remains salient.  

  **Crux 2: Is the two-bidder auction fundamentally distinct from the many-bidder auction?**  
  - **Argument**: If the mechanisms differ, the theories may apply asymmetrically. ET often treats both as "sunk-cost traps"; ST treats both as "structural traps."  
  - **ET Prediction**: The mechanisms are identical. Escalation in both cases stems from iterative sunk-cost fallacies by the top two bidders.  
  - **ST Prediction**: The mechanisms differ. In many-bidder auctions, early dropouts reduce the top bidders’ perceived agency, amplifying escalation. The two-bidder case is a "pure" structural trap.  

  **Crux 3: Can a rational agent, knowing the trap, avoid escalation by pre-committing to a bid limit?**  
  - **Argument**: If pre-commitment eliminates escalation, ET gains support (error is avoidable). If not, ST gains support (structural incentives override commitments).  
  - **ET Prediction**: Pre-commitment to a bid limit (e.g., ≤ \( V \)) prevents escalation. Rational agents will adopt and enforce such limits.  
  - **ST Prediction**: Pre-commitment fails. Agents will revise limits mid-auction due to the changing payoff structure (e.g., "My bid is now $0.95; I must bid $1.00 to avoid losing $0.95").  

  ---

  #### 4. Discriminating Variant  
  **Variant: Consolation Prize Auction**  
  - **Rules**: The runner-up receives a consolation prize of fixed value \( C \) (e.g., $0.50) for their payment. The main prize value \( V \) (e.g., $1) and \( C \) are public. \( C \) is chosen so \( V > C > 0 \).  
  - **Why Discriminatory**:  
    - ET: Reduces the sunk-cost fallacy’s grip by guaranteeing the runner-up *some* reward, making continuation past \( V \) clearly irrational.  
    - ST: Preserves the structural trap, as runners-up still lose \( \text{bid} - C \) and thus incentivize escalation.  
  - **Predictions**:  
    - ET: Escalation beyond \( V \) will be rare or absent. Bidders stop near \( V \) since the net loss for runners-up is reduced (e.g., bid \( V \) to win or lose only \( V - C \)).  
    - ST: Escalation beyond \( V \) will persist at rates comparable to the standard auction. The fundamental incentive to avoid runner-up losses remains, as \( \text{bid} - C \) can still exceed \( 0 \).  
  - **Falsification Conditions**:  
    - *ET*: Considers its position falsified if escalation rates beyond \( V \) match the standard auction (indicating non-monetary factors or structural incentives dominate).  
    - *ST*: Considers its position falsified if escalation beyond \( V \) virtually disappears (indicating monetary preferences alone drive behavior, and structure is mutable).  

  ---  
  **Signed,**  
  [Advocate of Error Theory]  
  [Advocate of Structural Theory]  

  Date: [Insert Date]  

