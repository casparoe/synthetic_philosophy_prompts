  Okay, this user has been stuck in a reading group on collective intentionality for a year, hitting the same wall with Bratman, Searle, and Gilbert. They need a diagnosis of the core disagreements and what progress might look like. 

  First, I notice their frustration is palpable—they’re tired of circular debates where everyone claims the same examples. Their hypothesis about three stacked disagreements feels spot-on: psychological architecture (what’s in the head), behavioral criteria (what counts as joint action), and normativity (obligations). That’s a sharp observation. 

  The user’s questions are dense but precise:  
  - Is Searle’s "primitive we-intention" even a psychological claim, or just descriptive?  
  - Does Gilbert’s obligation make her dispute with Bratman non-psychological?  
  - How do infant studies (pre-conceptual joint action) bear on Searle?  
  - Could deflationism dissolve the debate?  
  - Where does team reasoning in game theory fit?  

  Hmm. The infant point is tricky—Searle might say it supports primitiveness (biologically basic), while Bratman/Gilbert might argue it’s proto-joint action without full normative structure. The deflationary angle (predictive stance) could reframe the whole debate as linguistic, not metaphysical. Team reasoning feels like a parallel track—more about *how* collective goals shape individual rationality than *what* joint intention *is*.  

  Their deeper plea: "What would *actually* count as progress here?" They suspect it might be admitting the normative core. I agree—Bratman’s interdependence vs. Gilbert’s obligations isn’t empirically resolvable; it’s about what we *ought* to treat as constitutive. Searle’s "biology" claim is testable in theory (neuroscience? development?), but his "primitive" stance might resist reduction.  

  Progress paths:  
  1. **Distinctions**: Firmly separating the three layers (psychology, behavior, normativity).  
  2. **Experiments**: Infant cognition (e.g., do preverbal infants show Bratman-esque interdependence or Searlean minimal jointness?) or neuroimaging (is "we-mode" activation distinct from "I-mode"?).  
  3. **Formal models**: Team reasoning frameworks (Bacharach, Gold) could force clarity on whether "we-intending" alters choice architecture.  
  4. **Philosophical honesty**: Admitting Gilbert’s obligations are normative bedrock—not something Bratman *missed* but something he *excludes by design*.  

  The "verbal dispute" worry is real. If Bratman and Searle are describing the same cognitive state at different levels (mechanistic vs. phenomenological), they might both be "right." Gilbert, though, is playing a different game—her "joint commitment" is a social fact, not just in heads.  

  Final thought: The user’s group might need to map each author’s *explanatory target*. Searle: the *experience* of "we." Bratman: cognitive machinery for coordination. Gilbert: deontic glue of groups. They’re not even arguing about the same thing. That’s the diagnosis.
answer: |-
  Your diagnosis is astute—this isn't one debate but **three distinct, entangled disagreements** masquerading as a single dispute. Each tackles a different facet of collective intentionality, and conflating them guarantees stalemate. Here's a breakdown, a path to clarity, and what progress might look like:

  ---

  ### **1. The Three Stacked Disagreements (Your Hypothesis Confirmed)**
  | **Layer**                  | **Core Question**                                       | **Bratman**                                  | **Searle**                                       | **Gilbert**                                      |
  |----------------------------|--------------------------------------------------------|----------------------------------------------|--------------------------------------------------|--------------------------------------------------|
  | **Psychological Architecture** | What cognitive states underpin joint action?         | Interlocking individual intentions + beliefs | Primitive, irreducible "we-intention" (biological) | Individual commitments + mutual obligations      |
  | **Behavioral Criteria**       | What *counts* as joint action? (the explanandum)     | Meshing subplans + interdependence          | Collective biological capacity                   | Joint commitment creating obligations          |
  | **Normative Foundation**      | Are obligations *constitutive* or *derivative*?      | Emergent from interdependence (no primacy)  | Not central (biological primacy)               | **Constitutive**: Obligations define jointness |

  - **Why everyone claims the examples**: Each theorist is highlighting *different features* of the same phenomena (e.g., walking together):  
    - Bratman sees *interdependence of plans*.  
    - Searle sees the *primitive experience* of "we."  
    - Gilbert sees *mutual obligations to keep pace*.  
    They’re not describing the same mental state—they’re describing **different aspects of the same social dynamic**.

  ---

  ### **2. Diagnosing the Core Tensions**
  - **Searle’s "Primitive We-Intention"**:  
    - *Is it psychological?* Yes, but ambiguously. Searle posits a biological capacity (a "mental primitive"), making it *in principle* empirically testable (e.g., via neuroscience or developmental psychology). However, his insistence on irreducibility makes it resistant to Bratman-style decomposition.  
    - *Infant studies*: Pre-conceptual joint actions (e.g., joint attention in 9-month-olds) **support Searle** if they show non-individualistic coordination, but **challenge Gilbert** (infants lack obligation concepts). Bratman might call this "proto-joint" action, lacking full interdependence.

  - **Gilbert’s Obligations**:  
    - Her account is **not primarily psychological**—it’s *socio-normative*. "Joint commitment" is a social fact creating deontic relations (obligations/entitlements). Bratman’s dispute here isn’t about psychology; it’s about whether obligations are *necessary for defining joint action*. Gilbert’s move is conceptual: without obligations, you only have *parallel action*, not truly *joint* action.  

  - **The Deflationary Option**:  
    - Yes, this could dissolve the stalemate. If "we-intentions" are just **predictive/interpretive stances** (e.g., Dennett’s intentional stance), the "what’s in the head" question is misguided. Joint action becomes a pattern we project onto behavior for pragmatic reasons (e.g., coordination efficiency). This reframes the debate: not "what *is* joint intention?" but "when is it *useful* to attribute it?"  

  - **Team Reasoning (Game Theory)**:  
    - This is adjacent but **not the same axis**. Team-reasoning (e.g., Bacharach, Gold) asks: *How do individuals reason when they take a collective perspective?* It’s about **decision-making mechanics**, not the ontology of intention. It *presupposes* a collective goal but doesn’t resolve whether that goal is Searlean, Bratmanian, or Gilbertian. It could formalize Bratman’s interdependence or Gilbert’s obligations but can’t settle their dispute.

  ---

  ### **3. What Counts as Progress?**
  The deadlock persists because participants:
  - Confuse **descriptive** (psychological/behavioral) and **normative** claims.
  - Treat all theories as competing explanations of the *same thing* (they’re not).
  - Assume "joint action" has a unified essence (it may not).

  **Paths forward**:  
  1. **Distinctions First**:  
     - Force explicit agreement on which question is being debated:  
       - *Psychological*: "What cognitive processes occur when humans act jointly?"  
       - *Metaphysical*: "What makes an action 'joint'?"  
       - *Normative*: "When do obligations arise in collaboration?"  
     - Admit that Gilbert’s account is **not a rival psychology**—it’s a normative analysis of sociality.

  2. **Empirical Interventions**:  
     - **Infant/Animal Studies**: If pre-linguistic beings show coordination with interdependence (Bratman) but no obligation-awareness, that challenges Gilbert. If they show irreducible "we"-cognition (Searle), find neural correlates.  
     - **Neuroimaging**: Does "we-mode" cognition (e.g., joint attention) activate distinct brain networks from individual intention?  
     - **Behavioral Experiments**: Manipulate interdependence vs. obligations (e.g., in economic games) to see which triggers joint-action perceptions.

  3. **Formal/Game-Theoretic Models**:  
     - Use team reasoning to test if "we-intending" *requires* distinct utility functions or if Bratmanian interdependence suffices. Model Gilbertian obligations as commitment devices.

  4. **Embrace Normative Disagreement**:  
     - Admit that Gilbert vs. Bratman/Searle is **fundamentally normative**: Is obligation essential to the *concept* of joint action? This can’t be settled by science—only by conceptual analysis or pragmatic negotiation.

  ---

  ### **The Honest Answer**
  - **Is the debate "verbal"?** Partly. Key terms ("intention," "joint") are used with different implicit definitions. But it's not *merely* verbal—it’s about **which features of collective phenomena deserve theoretical priority**.  
  - **Progress requires disentangling the questions**: Bratman and Searle clash on psychology; Gilbert and Bratman clash on normativity; all three offer different behavioral criteria.  
  - **Ultimate resolution**: Likely a **pluralistic acknowledgment** that joint action is a cluster concept with psychological, behavioral, *and* normative dimensions. No single theory captures all facets, but clarity about which facet we’re studying ends the stalemate. 

  **Your reading group’s next step**: Pick *one* layer (e.g., "Is there a psychological primitive?") and dissect it separately. If the wall remains, it’s likely because the dispute is normative—and that’s okay. Not all philosophical disagreements are empirical.
