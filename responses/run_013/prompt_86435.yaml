  *scratches head* The tricky part is distilling this into 8-12 nodes while hitting all probes. The dead/self-objectivity cases are brilliant inclusions—they test if reciprocity is essential. Need to sequence questions carefully: start with concrete cases (e.g., "Can you resent someone who died yesterday?"), then escalate to theoretical forks. 

  *mental note* Must avoid: (1) questions that presuppose jargon, (2) false dichotomies, (3) missing leaf distinctions. For example, separating "attitudes as truth-makers" (Strawson) vs. "tracking independent facts" (realists) needs a subtle node. And oh—fairness-based vs. quality-of-will compatibilists both say determinism is fine, but split on whether "could've done otherwise" matters. That needs a dedicated branch. 

  *checks watch* Time-pressure: eight nodes max to leave room for awkward-commitment footnotes. The unnamed leaf (iv) is tough—Scanlonians might call it "relationship-based blame," but it's not a settled term. And leaf (v)'s abolitionist stance will ruffle feathers; its awkwardness is obvious (rejecting intuitions), but must phrase neutrally. 

  Final tree should feel like peeling an onion: reactive attitudes → their conditions → their metaphysics. If students debate at *every* node, mission accomplished.
answer: |-
  Here is a decision tree handout meeting your specifications, designed to guide readers through the logical space of Strawson-inspired debates on moral responsibility:

  **Moral Responsibility: Pathways Through Reactive Attitudes**

  *Start:* We resent wrongs, feel gratitude for kindness, blame the cruel, and forgive the remorseful. These feel significant. What makes them apt?

  1.  **Can you genuinely resent someone who died yesterday for a wrong they did? (Not just recall past anger, but feel resentment *now*?)**
      *   **No → Go to 2**
      *   **Yes → Go to 3**

  2.  **Can you take the "objective attitude" (e.g., viewing yourself as a complex mechanism needing management) towards yourself *consistently*, even when you act badly?**
      *   **No → Go to 4**
      *   **Yes → Go to 5**

  3.  **If determinism is true (every event is caused by prior events/states), does this fundamentally threaten the *aptness* of resentment/blame?**
      *   **No → Go to 6**
      *   **Yes → Go to 7**

  4.  **Does the aptness of resentment fundamentally depend on the agent *having had a strong ability to do otherwise* in that exact situation?**
      *   **No → Leaf (vii): Quality-of-Will Compatibilism**
          *(Awkward Commitment: Must accept that resentment is apt even if the agent's character and action were fully determined by factors beyond their ultimate control.)*
      *   **Yes → Go to 8**

  5.  **Should we completely abandon attitudes like resentment/blame as we know them (perhaps replacing them with detached assessments), because they inherently claim something ("desert") that cannot be justified?**
      *   **No → Leaf (i): Strawsonian Non-Objectivism (The Participant Stance)**
          *(Awkward Commitment: Must reject demands for external justification of the whole framework; practices are self-validating.)*
      *   **Yes → Leaf (v): Blame Abolitionism/Skepticism**
          *(Awkward Commitment: Must deny the intuitive aptness and depth of our actual reactive responses like resentment.)*

  6.  **Is the aptness of resentment/blame primarily governed by a norm of fairness requiring the agent had the *capacity* (general ability/reason-responsiveness) to meet reasonable expectations?**
      *   **No → Leaf (iv): Unnamed (Relational Expressivism - Commitment-Based)**
          *(Awkward Commitment: Must explain why blame *feels* like a response to the individual's moral failing, not just a relationship valuation.)*
      *   **Yes → Leaf (ii): Fairness-Based Compatibilism (e.g., Reasons-Responsiveness)**
          *(Awkward Commitment: Must explain why the *force* of blame seems stronger than merely noting a capacity failed under reasonable expectations.)*

  7.  **When we suspend resentment toward someone (e.g., due to severe mental illness), is this because we see them as temporarily unable to engage in *any* moral relationships (exempting), or because this *specific* act didn't reflect their true moral self (excusing)?**
      *   **Exempting → Leaf (vi): Leeway Incompatibilism**
          *(Awkward Commitment: Must accept that determinism rules out the strong ability to do otherwise required for genuine blame, making all blame misplaced.)*
      *   **Excusing → Leaf (iii): Attributionism / Accountability Split**
          *(Awkward Commitment: Must defend a sharp distinction between attributing an act to the agent (thin) and holding them answerable/blamable (thick) for it.)*

  8.  **Do reactive attitudes like resentment *make it true* that someone is blameworthy (within our practices), or do they *track* an independent fact about the agent's blameworthiness?**
      *   **Make it true → Leaf (i): Strawsonian Non-Objectivism (The Participant Stance)**
          *(Awkward Commitment: Same as above.)*
      *   **Track an independent fact → Leaf (vi): Leeway Incompatibilism**
          *(Awkward Commitment: Same as above.)*

  **Key to Leaves & Unresolved Pairs:**

  *   **(i) Strawsonian Non-Objectivism (The Participant Stance)**
  *   **(ii) Fairness-Based Compatibilism**
  *   **(iii) Attributionism / Accountability Split**
  *   **(iv) Unnamed (Relational Expressivism - Commitment-Based)**: Lacks a single universally accepted standard name.
  *   **(v) Blame Abolitionism/Skepticism**
  *   **(vi) Leeway Incompatibilism**
  *   **(vii) Quality-of-Will Compatibilism**

  **Unseparated Pairs by this Tree:**

  1.  **Leaf (i) Strawsonian Non-Objectivism appears twice (at Node 5-No & Node 8-Make it true):** These are the *same position*. The different paths highlight distinct facets (resisting abolition & being practice-constituting). Genuinely the same position.
  2.  **Leaf (vi) Leeway Incompatibilism appears twice (at Node 7-Exempting & Node 8-Track fact):** These are the *same position*. Different paths emphasize different implications (exemption vs. tracking independent desert). Genuinely the same position.
  3.  **Leaf (iv) Unnamed (Relational Expressivism) & Leaf (ii) Fairness-Based Compatibilism (both reached via Node 6):** These are **genuinely distinct positions**. Both compatibilist, but one grounds aptness in relationship valuation/commitments, the other in capacity/fairness conditions. The tree separates them via Node 6.
  4.  **Leaf (iii) Attributionism / Accountability Split & Leaf (vii) Quality-of-Will Compatibilism:** These are **genuinely distinct positions**. The tree separates them: (vii) via Node 4-No (denying need for strong alternate possibilities), (iii) via Node 7-Excusing (splitting attributability from answerability). One is compatibilist without splitting senses (vii), the other splits senses while often being compatibilist about attributability (iii).

  **Probes Incorporated:**

  *   **Dead (Node 1):** Forces consideration of reciprocity/answerability vs. focus on the past act/will.
  *   **Self-Objective (Node 2):** Tests the pervasiveness/involuntariness of the participant stance and its link to reciprocity.
