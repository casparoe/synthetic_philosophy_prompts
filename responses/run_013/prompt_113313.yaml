prompt: |-
  I spent most of last night arguing with a friend about whether an individual act can be wrong when it makes no difference to the harm, and I came away with a set of verdicts I cannot reduce to anything tidy. His position is clean: if your act changes nothing about who gets harmed, there is nothing to criticize, and the guilt people carry about meat, flying, and voting is confused. He keeps calling it the inefficacy problem, as though the label were the argument. I don't believe him, but I can't say precisely where the mistake lies. Here is what I actually think, case by case.

  1. My vote in a state that will be called 70 to 30 for the candidate I oppose, no matter what. Staying home: not wrong. Voting: not wrong. No obligation either way.

  2. My vote in a state polling at a dead heat and likely to be decided by a few hundred ballots. Staying home: wrong.

  3. A supermarket chicken. The store's order for the week is fixed, its future orders are set by a formula no single customer can move, unsold birds are thrown out, and no individual purchase, mine included, changes how many chickens are killed. Buying it still strikes me as somewhat wrong — a real twinge, though nothing like the wrongness of wringing a chicken's neck myself.

  4. A chicken a friend has already cooked for a dinner party and will otherwise discard. Eating it strikes me as entirely fine.

  5. Flying across the country for the funeral of a close friend. The plane is half empty and would fly regardless; my seat adds a little fuel burn. Not wrong at all, and I feel no twinge.

  6. Driving around for an hour on a Sunday for the sheer pleasure of it. It makes no measurable difference either. Also no twinge — though I notice I cannot say what separates this from the chicken in (3).

  7. A river that is poisoned once a thousand barrels of waste go into it. Twelve hundred of us each dump a single barrel the same afternoon, so the river would be just as poisoned if any one of us had stayed home, mine included. I think every one of us acts wrongly, and I do not think the ones who happened to fall near the threshold are any worse than the rest.

  The best principle I can state — an act is wrong when it belongs to a class of acts whose combined effect is seriously harmful and the act is not backed by a weighty enough reason, even if the act on its own changes nothing — condemns the Sunday drive in (6), which I do not accept, and seems to leave (1) and (7) pointing in opposite directions. I would like the principle, or a small set of candidates, that actually fits these verdicts, with the case that forces each clause. Please also tell me what it predicts for three cases I have not listed: a vote in a race close enough that my side might lose by a handful, though my own ballot will not be decisive; buying a used coat from a shop that also sells new fur, where my purchase touches only the used rack; and a case where the river needs a thousand barrels, exactly nine hundred ninety-nine others have already dumped, and I am the one who tips it. Finally, if no single principle can hold all seven verdicts, tell me which one I should give up, and why that one rather than another.
reasoning: |-
  Okay, the user presents a fascinating ethical dilemma about individual actions that seem harmless in isolation but contribute to harmful collective outcomes. They've spent hours debating this with a friend who takes a strictly consequentialist view (if an act changes nothing, it's not wrong), but the user's moral intuitions are more nuanced. They list seven specific cases where their gut feeling conflicts with pure consequentialism, particularly around voting, meat consumption, and pollution.

  The user is clearly intellectually sophisticated - they've constructed careful hypotheticals that expose contradictions in simple ethical frameworks. Their frustration is palpable: they know their friend's "inefficacy problem" argument feels wrong, but can't articulate why. Underneath the philosophical question, I sense they're also wrestling with personal guilt about everyday choices like eating meat or flying.

  What makes this tricky is that their intuitions don't neatly map to any single ethical theory. For example:
  - They feel no obligation to vote in uncompetitive elections (#1) but strong obligation in close ones (#2)
  - Buying supermarket chicken feels somewhat wrong (#3) but eating discarded chicken doesn't (#4)
  - Pollution feels wrong even when one's contribution is below threshold (#7)

  Their attempted principle (condemning acts that are part of harmful classes without sufficient reason) is thoughtful but fails because it condemns Sunday drives (#6) which they feel are innocent. The tension is most visible in voting case #1 (no obligation) vs pollution case #7 (obligation exists) despite similar threshold structures.

  The key insight is recognizing two distinct ethical dimensions at play: 
  1) Participatory responsibility - feeling complicit by joining harmful systems
  2) Fairness expectations - feeling bound by rules when others cooperate

  This explains why supermarket chicken (participating in factory farming) feels wrong while Sunday driving (no participation in systematic harm) doesn't. Voting falls somewhere between - we feel obligation only when our participation could plausibly matter.

  For their unlisted cases:
  1) Voting in a close race (should feel obligatory even if not decisive - participation in critical collective action)
  2) Buying used fur coat (likely fine - not participating in fur trade)
  3) Being the 1000th polluter (clearly wrong - direct causation)

  If forced to sacrifice one intuition, I'd suggest reconsidering the supermarket chicken case (#3). The participatory argument is weaker here since food systems respond to aggregate demand, unlike fixed pollution thresholds. But this requires careful handling - perhaps distinguishing between probabilistic harm systems vs threshold systems.

  The user might benefit from Judith Lichtenberg's work on complicity without causation, or Derek Parfit's "mistakes in moral mathematics". This isn't just theoretical - their anguish about everyday ethical choices is very real.
answer: |-
  Your intuitions reveal a sophisticated ethical framework that blends participatory responsibility with collective harm principles, resisting reduction to simple consequentialism. Here’s a unified theory that fits your verdicts, followed by case analyses and a critical refinement:

  ### The Principle: **Participatory Complicity + Fair-Play Expectations**
  An act is wrong if:
  1. **It constitutes participation in a harmful collective practice** (making you complicit in the harm), *and*
  2. **The practice’s harm is significant and avoidable**, *and*
  3. **Your participation lacks sufficient justification** (weighty reason), *and*
  4. **Fair-play expectations apply** (others are cooperating to avoid harm, or your participation risks undermining collective efforts).

  This resolves tensions by distinguishing *causal inefficacy* from *moral complicity* and *social fairness*.

  ---

  ### How It Explains Your Cases:
  1. **Vote in 70-30 state**  
     → *Not wrong*: Fails (1) & (4). Voting isn’t participation in a *harmful* practice (democratic participation is neutral/good), and no fair-play obligation exists (your vote won’t affect outcomes or others’ efforts).  
     
  2. **Vote in dead heat**  
     → *Staying home is wrong*: Voting is participation in a morally urgent collective practice (defending against a harmful candidate). Fails (3) & (4): No weighty reason to abstain, and fair-play demands contribution when outcomes hinge on cooperation.  
     
  3. **Supermarket chicken**  
     → *Somewhat wrong*: Satisfies (1) (participation in factory farming), (2) (significant harm), and (3) (no weighty reason like hunger). *But*: Fails (4) if no cooperative alternative exists (e.g., ineffective boycotts). The "twinge" reflects complicity guilt despite inefficacy.  
     
  4. **Discarded cooked chicken**  
     → *Not wrong*: Fails (1). You’re not participating in the harm (the chicken is waste; no economic signal is sent).  
     
  5. **Flight for funeral**  
     → *Not wrong*: Fails (3) & (1). Weighty reason (grieving), and fixed flight schedules decouple your act from direct participation in scaling harm.  
     
  6. **Sunday drive**  
     → *Not wrong*: Fails (1) & (4). Unlike factory farming, driving for pleasure isn’t part of a *structured harmful practice* with cooperative alternatives. Harm is diffuse, and no fairness expectations bind you.  
     
  7. **River pollution**  
     → *All act wrongly*: Satisfies (1) (direct participation in poisoning), (2) (serious harm), (3) (no weighty reason), and (4) (fair-play demands non-participation if others cooperate). The threshold is irrelevant; each act expresses disregard for collective responsibility.

  ---

  ### Predictions for New Cases:
  - **Vote in a close race (not personally decisive)**  
    → *Wrong to stay home*. Satisfies (1) (participation in urgent collective action), (3) (no excuse), and (4) (fair-play: others rely on voter turnout).  
    *Clause triggered*: (4) Fair-play expectations in high-stakes cooperation.  
  - **Buying a used coat from a fur-selling shop**  
    → *Not wrong*. Fails (1): Your act doesn’t participate in the fur trade (no economic support; the used rack is independent).  
    *Clause triggered*: (1) Participation must be direct (no material contribution to harm).  
  - **You are the 1000th polluter**  
    → *Uniquely wrong*. Beyond complicity, you directly cause the harm. Standard threshold-crossing culpability applies.  
    *Clause triggered*: Direct causation overrides inefficacy concerns.  

  ---

  ### If Forced to Sacrifice One Verdict:
  Relinquish **Case 3 (buying supermarket chicken)**. Here’s why:  
  - **Inconsistency**: Cases 3 and 6 are analogous (inefficacious acts within harmful systems), yet you condemn one and not the other. The participatory principle weakly distinguishes them.  
  - **Better justification**: If consumer signals *do* aggregate probabilistically (e.g., store restocking algorithms respond to long-term demand trends), buying chicken *does* contribute microscopically—making it more like Case 7.  
  - **Alternative view**: Guilt in Case 3 may stem from **symbolic complicity** (profiting from harm) rather than participation. But symbolic harm lacks moral weight if it has no causal link—undermining your intuition.  

  Retain Case 6: The Sunday drive involves no exploitative system or cooperative alternative, making it a true inefficacy case without complicity.

  ### Key Insight:
  Your intuitions track **moral cooperation in structured systems**. When harm arises from coordinated activity (voting, pollution, factory farming), participation binds you to the collective wrong—even without individual impact. When systems lack coordination (driving) or participation is severed (eating waste), no blame attaches. The "twinge" in Case 3 is your conscience recognizing complicity in exploitation, not inefficacy. Your friend mistakes *causal irrelevance* for *moral irrelevance*—a category error.
