answer: |-
  ### Decision Tree: The Reality of Psychiatric Categories Given Looping Effects  
  **For a graduate seminar in the philosophy of psychiatry**  
  *Starting commitment: Looping effects occur—the classified population, their self-descriptions, and diagnostic criteria can shift in response to classification. The tree sorts positions on what the category tracks, beyond naturalism vs. social construction. Each branch is a question about looping modes (performative, semantic drift, apparatus-driven). Answer for a specific psychiatric category (e.g., autism, depression).*  

  **Control case (non-looping):** *Broken bone*—classification does not alter the condition's nature. Looping is absent.  

  ---

  #### **Node 1: Does performative looping occur?**  
  *(i.e., does the label induce the symptoms it names?)*  
  - **Example:** Rise of "multiple personality disorder" in the 1980s, where diagnosis may have shaped symptom presentation.  
  - **Yes** → Node 2  
  - **No** → Node 3  

  #### **Node 2: Is performative looping a defect (threat to reality)?**  
  - **Example:** Anorexia as culture-bound: if ideals of thinness trigger symptoms, does this undermine anorexia's reality?  
  - **Yes** → Node 4  
  - **No** → Node 5  

  #### **Node 3: Does semantic drift occur?**  
  *(i.e., does the classified community revise the criteria from within?)*  
  - **Example:** Autistic self-advocates reframing autism as neurodivergence (not disorder).  
  - **Yes** → Node 6  
  - **No** → Node 7  

  #### **Node 4: Does apparatus-driven drift occur?**  
  *(i.e., do institutions alter the category's extension?)*  
  - **Example:** Declassification of homosexuality due to institutional pressure (DSM revisions).  
  - **Yes** → Leaf 3  
  - **No** → Leaf 1  

  #### **Node 5: Is semantic drift a genuine mode of change for the kind?**  
  - **Example:** Cross-cultural variability of depression—do local redefinitions change what depression "is"?  
  - **Yes** → Node 8  
  - **No** → Leaf 5  

  #### **Node 6: Is semantic drift a threat to the category's reality?**  
  - **Example:** Autistic self-advocates rejecting "disability" framing—does this challenge autism's validity?  
  - **Yes** → Leaf 3  
  - **No** → Leaf 2  

  #### **Node 7: Is apparatus-driven drift a threat to the category's reality?**  
  - **Example:** Multiple personality's fall—did institutional shifts (e.g., loss of insurance coverage) reveal no real kind?  
  - **Yes** → Leaf 3  
  - **No** → Leaf 4  

  #### **Node 8: Does the classified community have standing to define the kind?**  
  - **Example:** Autistic advocates defining autism—must science defer to lived experience?  
  - **Yes** → Leaf 7  
  - **No** → Leaf 6  

  ---

  ### Leaves (Positions)  
  *Each position is defined by its most awkward commitment. Unnamed positions are possible but unoccupied.*  

  1. **Essentialist realism**  
     *The category tracks a dysfunction fixed independently of classification, so looping is contamination.*  
     - *Reached via:* Node 1 (No) → Node 3 (No) → Node 7 (No)  
     - *Path insight:* Denies all looping modes as threats; sees them as noise.  

  2. **Dynamic nominalism**  
     *The category is a real interactive kind, where self-understanding is part of its essence, so looping is constitutive.*  
     - *Reached via:* Node 1 (Yes) → Node 2 (No) → Node 5 (Yes) → Node 8 (No)  
     - *Path insight:* Accepts semantic drift as non-threatening and genuine.  

  3. **Constructivism or eliminativism**  
     *Looping is a defect, and the moving target proves no real kind exists.*  
     - *Reached via three paths:*  
       - Node 1 (Yes) → Node 2 (Yes) → Node 4 (Yes)  
       - Node 1 (No) → Node 3 (Yes) → Node 6 (Yes)  
       - Node 1 (No) → Node 3 (No) → Node 7 (Yes)  
     - *Path insight:* Any looping mode can be a threat; instability implies unreality.  

  4. **Feedback-stabilized realism**  
     *Looping is a mechanism that entrenches real causal structures, so feedback sustains the kind.*  
     - *Reached via:* Node 1 (No) → Node 3 (No) → Node 7 (No)  
     - *Path insight:* Apparatus-driven drift is non-threatening and stabilizes the category.  

  5. **Symptom-network realism**  
     *The category is real without essence because symptoms cause one another, so looping is irrelevant.*  
     - *Reached via:* Node 1 (Yes) → Node 2 (No) → Node 5 (No)  
     - *Path insight:* Rejects semantic drift as central; focuses on internal symptom causality.  

  6. **Pragmatic instrumentalism**  
     *The category is an administrative instrument that need not track anything, so looping is pragmatically useful.*  
     - *Unreachable*—All paths to this view (e.g., via Node 2) are preempted by other commitments.  
     - *Diagnosis:* Unoccupied because it conflicts with the starting concession (looping is central). Pragmatic views must explain why looping occurs if the category doesn’t track; this tension makes it incoherent here.  

  7. **First-person realism**  
     *The category is authorized by the classified community, so they have standing to define the kind.*  
     - *Reached via:* Node 1 (Yes) → Node 2 (No) → Node 5 (Yes) → Node 8 (Yes)  
     - *Path insight:* Requires semantic drift to be genuine and non-threatening, with community authority.  

