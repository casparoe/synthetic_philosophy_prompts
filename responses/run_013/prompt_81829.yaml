  ### Notes on the Tree  
  - **Unseparated positions:**  
    - *Dynamic nominalism (Leaf 2) and first-person realism (Leaf 7)* are separated by Node 8 (community authority). Without this node, they collapse—but Node 8 isolates first-person realism’s emphasis on epistemic authority.  
  - **Unoccupied combinations:**  
    - *Pragmatic instrumentalism* is unreachable (as above). Its combination (deny reality-tracking, accept looping) is incoherent under the starting concession: if looping occurs, the category must "track" *something* (even if only social dynamics).  
    - *Apparatus-driven drift without threat* (Node 7→No) leads only to feedback-stabilized realism (Leaf 4). No other position occupies this, as it requires seeing institutions as stabilizers, not distorters.  
  - **Key design:**  
    - Branch nodes (6) and leaves (7) fit constraints. Nodes focus on looping modes without presupposing positions.  
    - The tree forces choices: e.g., between symptom-network (Leaf 5) and dynamic nominalism (Leaf 2) at Node 5.  
    - All examples are used (see nodes), with anorexia, autism, etc., illustrating mode-specific forks.  

  **Instructions for use:** Pick a psychiatric category. Start at Node 1, answer based on your view of that category, and follow the path to your position. Reflect on the awkward commitment to test coherence.
