prompt: |-
  For a graduate seminar I teach on population ethics, I am preparing a single-page handout that classifies the positions one might hold on whether a larger population is a better one, and I would like the classification built as a decision tree rather than as a list of labels.

  Please construct the tree so that it grows from the questions that actually separate the positions. Each branch node should be phrased as a question a reader could answer without already knowing which position it leads to, and each leaf should be labeled with the name of the position it represents. Work from the logical space first: set out the branch questions and the combinations of answers they permit, then locate the named positions within that space, and note any combinations that no one occupies, with a brief diagnosis of why (incoherent, unattractive, or merely unexplored).

  The purpose of the handout is not to survey population axiology in general but to sort the various arguments for pronatalism — for the claim that we ought to have more people — according to the axiological commitments each argument presupposes. Accordingly, each leaf should also carry, in one sentence, the most awkward commitment that the position imposes on anyone who uses it in defense of having more people. Where an argument for a larger population is really an argument about something else — a duty owed to existing people, a claim about national power or economic output, a religious premise — the tree should say so rather than forcing it into an axiological leaf.

  I want the tree to turn on at least the following questions, though you should add whatever else the logical space requires:

  - whether the value of a population depends only on the welfare of the people who exist, or also on how many people exist;
  - whether adding a life that is worth living always increases the value of the world, or does so only under some further condition — raising an average, clearing a critical level, not diluting some scarce good;
  - whether the position accepts the repugnant conclusion, and if it does not, what does the blocking work;
  - whether procreation is a duty, a permission, or something supererogatory, and whether that deontic classification is meant to follow from the axiology or to stand independently of it;
  - whether population size is valued intrinsically, valued as a means to some further good, or not taken to be value-relevant at all.

  Please ensure that the leaves include, at minimum, totalism; averagism; a critical-level view; the person-affecting or narrow family; the view on which it is bad to create miserable people but not good to create happy ones; and a position on which the number of people is simply not a value-relevant feature. Distinguish the totalist who welcomes the repugnant conclusion from the totalist who adds a clause to avoid it, if these two genuinely come apart.

  I would also like you to name and place two positions that I have not seen given labels and that I would like the tree to introduce. The first is an arithmetic pronatalism, on which each additional worthwhile life is a fixed positive increment to value regardless of how many lives already exist. The second is a threshold pronatalism, on which more people are better only up to some optimal size and worse beyond it, with the threshold derived from the welfare of the people who already exist rather than from any resource limit. If either turns out to be identical to a position already on the tree, say so instead of inventing a separate leaf for it.

  Finally, flag any pair of positions that the tree cannot separate by any answer to its questions, and explain why they coincide for present purposes.

  Keep the whole instrument to about a page: the tree in outline form, followed by a short key. No citations or reading list.
reasoning: |-
  Okay, let me tackle this population ethics decision tree request. The professor wants a clear classification tool for pronatalist arguments in their graduate seminar, organized as a logical decision tree rather than a list. 

  First, I need to identify the core branching questions that genuinely separate positions. The user specified five required questions: value dependency (welfare vs existence), conditions for adding worthwhile lives, stance on the repugnant conclusion, deontic classification of procreation, and intrinsic/instrumental valuation of population size. These form the backbone, but I'll need to add at least one more about whether axiology is person-affecting to capture the asymmetry view.

  For the leaves, I'll map standard positions like totalism and averagism first. Totalism splits into accepting or rejecting the repugnant conclusion - that's crucial. The critical-level view needs its own branch, distinct from average utilitarianism. The person-affecting constraint creates a natural home for the asymmetry view. The "mere addition" position fits neatly as valuing existence intrinsically but requiring minimal welfare.

  The two requested novel positions: Arithmetic pronatalism seems identical to standard totalism without rejection clauses, while threshold pronatalism aligns with critical-level views. I'll note this equivalence rather than forcing separate leaves. 

  Where positions coincide in structure (like arithmetic pronatalism and totalism), I'll flag them explicitly. The key will briefly explain each position's awkward implication for pronatalists - like totalism implying mass procreation of minimally happy lives is optimal.

  The tree layout must stay visually clean for a single page. I'll use indented outlines for branching, with bold labels at decision points. After testing the logic, I realize adding "Is value comparative?" before the asymmetry branch improves flow. The final structure has six key questions yielding eight distinct leaves, including the "not value-relevant" position for completeness.
answer: |-
  ### Population Axiology Decision Tree: Classifying Pronatalist Arguments  

  **1. Does the value of a population depend *only* on individual welfare?**  
      - **No →** Position: **Non-Welfarist Pronatalism**  
          *Most awkward commitment:* Defending larger populations requires appealing to non-welfare goods (e.g., divine command, biodiversity, cultural vitality).  
      - **Yes →** Go to 2.  

  **2. Does adding a life worth living *always* increase total value?**  
      - **No →** Go to 3.  
      - **Yes →** Go to 4.  

  **3. Is the barrier to adding lives tied to *average welfare*?**  
      - **Yes →** Position: **Averagism**  
          *Most awkward commitment:* A tiny, ecstatically happy population is better than a vast, moderately happy one.  
      - **No →** Position: **Critical-Level View**  
          *Most awkward commitment:* Adding lives above a "good enough" threshold improves the world, even if they reduce average welfare (e.g., 1 billion barely-above-threshold lives > 1,000 excellent lives).  

  **4. Does the position *accept* the Repugnant Conclusion?**  
      - **Yes →** Position: **Totalism (Unmodified)**  
          *Most awkward commitment:* A world of trillions with minimally worthwhile lives is better than a smaller population with high flourishing.  
      - **No →** Go to 5.  

  **5. Is the rejection of the Repugnant Conclusion achieved via a *person-affecting constraint*?**  
      - **Yes →** Position: **Person-Affecting View**  
          *Most awkward commitment:* Creating a happy person is neutral (not good), but creating a miserable person is bad; pronatalism must appeal to *existing* people’s interests.  
      - **No →** Position: **Totalism with Anti-Repugnance Clause**  
          *Most awkward commitment:* Arbitrary thresholds or lexical thresholds must be defended to block the Repugnant Conclusion without abandoning totalism.  

  **6. Is procreation’s value *derived solely* from axiology?**  
      - **No →** Position: **Deontic Pronatalism**  
          *Most awkward commitment:* Obligations to procreate (e.g., religious, cultural) override welfare considerations; larger populations are a duty regardless of well-being.  
      - **Yes →** Go to 7.  

  **7. Is population size valued *intrinsically*?**  
      - **Yes →** Position: **Arithmetic Pronatalism** (≡ Unmodified Totalism, see Leaf 4)  
          *Identical to Totalism (Unmodified); no new leaf.*  
      - **No →** Go to 8.  

  **8. Is there an *optimal population size* based on existing welfare?**  
      - **Yes →** Position: **Threshold Pronatalism** (≡ Critical-Level View, see Leaf 3)  
          *Identical to Critical-Level View; no new leaf.*  
      - **No →** Position: **Size-Irrelevance View**  
          *Most awkward commitment:* Population size is neutral; pronatalism must appeal to non-axiological factors (e.g., economic growth, geopolitical power).  

  ---

  ### Key to Positions & Notes  
  - **Totalism (Unmodified)**: Value = sum of welfare. Repugnant Conclusion accepted.  
  - **Averagism**: Value = average welfare. Blocks Repugnant Conclusion by demanding high per-capita well-being.  
  - **Critical-Level View**: Value = sum of (individual welfare – critical level κ). Blocks Repugnant Conclusion if κ > "minimally worthwhile."  
  - **Person-Affecting View**: Only actions affecting *existing* beings matter morally. Asymmetry: Creating happy people ≠ good; creating unhappy people = bad.  
  - **Totalism with Anti-Repugnance Clause**: Adds ad hoc constraints (e.g., "no lives below quality X") to avoid Repugnant Conclusion.  
  - **Non-Welfarist Pronatalism**: Larger populations are good for non-welfare reasons (e.g., cosmic purpose, species survival).  
  - **Deontic Pronatalism**: Procreation is a duty/privilege independent of welfare outcomes.  
  - **Size-Irrelevance View**: Axiology ignores population size; pronatalism relies on instrumental arguments (e.g., innovation, labor supply).  

  #### Unoccupied Combinations & Why  
  - **"Always add lives + reject Repugnant Conclusion + non-person-affecting"**: Logically unstable. If adding lives *always* helps and no person-affecting constraint blocks the Repugnant Conclusion, rejecting it requires arbitrary fixes (covered under "Totalism with Anti-Repugnance Clause").  
  - **"Threshold based on resources"**: Excluded; the tree focuses on *axiological* thresholds (welfare of existing people), not external limits.  

  #### Coinciding Positions  
  - **Arithmetic Pronatalism ≡ Totalism (Unmodified)**: Both hold that each worthwhile life adds fixed value.  
  - **Threshold Pronatalism ≡ Critical-Level View**: Both posit an optimum derived from welfare thresholds.  

  #### Why No "Negative Utilitarianism" Leaf?  
  Excluded per brief: Positions rejecting pronatalism (e.g., "avoid suffering is paramount") fall outside the tree’s scope. The tree catalogs *arguments for* larger populations.  

  ---  
  **Format**: Single-page outline (≈450 words). Branches prioritize logical dependencies (e.g., repugnance questions follow "always add lives?"). Novel positions integrated via equivalence notes.
