   - High stress (which you can somewhat observe by how busy you are) makes you more likely to take the drug (because you are desperate to get more done) and also makes you more likely to have a productive month ( because you have many deadlines, so you work harder).
   - Low stress has the opposite effects.

   You can observe your busyness level (busy or not), which is a noisy indicator of stress:
     - If high stress, you are busy with 80% probability.
     - If low stress, you are busy with 20% probability.

   Prior: P(high stress) = 0.5.

   The drug costs $10. If you have a productive month, you will earn $1000; if not, you earn $0. The drug itself does not cause productivity; it only causes side effects that reduce your earnings by $50 (due to health issues).

   The probability of a productive month depends on stress:
     - If high stress, P(productive) = 0.8
     - If low stress, P(productive) = 0.2

   Additionally, your decision to take the drug is influenced by your busyness and by a random factor (เพราะ you might be influenced by an advertisement you saw, which you don't remember clearly). Specifically, if you are busy, you will take the drug with 90% probability; if not busy, with 10% probability. (This is your policy, but you are the agent and you can choose any policy. However, for the sake of the problem, we can assume that the agent has committed to a policy that is to take with those probabilities based on busyness.)

