  ** Scenario: "The Investment" **

   You are deciding whether to invest in a new business venture. The venture will succeed only if the economy is strong. You have a signal about the economy: your own income this year. If your income is high, it is more likely that the economy is strong. Additionally, your income affects how much money you have to invest. Specifically:

   - If the economy is strong (probability 0.5), then your income is high with probability 0.8, and the venture will succeed with probability 0.8.
   - If the economy is weak (probability 0.5), then your income is high with probability 0.2, and the venture will succeed with probability 0.2.

   You observe your income. If your income is high, you can afford to invest; if your income is low, you cannot invest (so you are forced not to invest).

   But if your income is high, you have a choice: invest or not.

   If you invest, it costs you $ (at a personal cost of $1,000) but if the venture succeeds, you gain $10,000 (net $9,000). If it fails, you lose the $1,000.

   If you don't invest, you have $0 change.

   You observe that your income is high. So you can choose to invest or not.

   CDT and UDT would invest, because given high income, the probability that the economy is strong is high, and hence the expected value of investing is positive.

   Specifically, P(strong economy | high income) = (0.5 * 0.8) / (0.5*0.8 + 0.5*0.2) = 0.4 / 0.5 = 0.8
   P(weak | high income) = 0.2

   Given strong economy, P(success) = 0.8, so EU(invest) = 0.8 * 9000 + 0.2 * (-1000) = 7200 - 200 = 7000
   EU(not invest) = 0

   So they invest.

   EDT, however, when evaluating the act of investing, conditions on the act. What does conditioning on investing tell us about the economy? 

   Note that the only way you invest is if your income is high. So conditioning on investing is the same as conditioning on high income. Therefore, EDT also sees P(strong|high)=0.8, and so EU(invest| high income) = 7000, and they also invest.

   This is not what we want.

   We want EDT to not invest. So we need that conditioning on the act of investing gives additional evidence about the economy beyond high income.

   So let's make high income not deterministic for investment. Suppose that even with high income, you might choose not to invest. But then what determines your choice? If it is based on other evidence, then we are back to the earlier problem.

   Alternatively, we can have the investment decision be made before knowing the income? But then you are forced to invest even if income is low, which is not allowed.

