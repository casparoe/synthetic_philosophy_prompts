   P(productive | busy) = P(productive | high stress, busy)*P(high|busy) + P(productive| low stress, busy)*P(low|busy)
     = 0.8 * 0.8 + 0.2 * 0.2 = 0.64 + 0.04 = 0.68

   So EU(take | busy) = 0.68*1000 - 60 = 680 - 60 = 620

   EU(not take | busy) = 0.68*1000 = 680

   So they should not take the drug. This is for a causalist: because the drug doesn't cause productivity, only causes harm.

   CDT would not take. But we want CDT to take and EDT not to take. 

