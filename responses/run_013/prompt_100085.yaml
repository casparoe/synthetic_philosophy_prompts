  ** Scenario: "The Meeting" **

   You are considering whether to attend a meeting with a potential client. The meeting could land you a valuable contract, but only if the client is in a good mood. The client's mood is affected by the weather: on sunny days, the client is in a good mood 80% of the time; on rainy days, only 20% of the time. The weather also affects you: on sunny days, you are in a good mood and thus more likely to attend the meeting (90% chance); on rainy days, you are in a bad mood and thus less likely to attend (10% chance). You can see the weather forecast, which is either "sunny" or "rainy". The forecast is accurate 80% of the time. You observe a sunny forecast. 

   If you attend the meeting and the client is in a good mood, you get the contract, worth $ความ,000 to you. If the client is in a bad mood, you don't get the contract. 
   Attending the meeting costs you $1,000 (in time and travel), whether you get the contract or not. Not attending costs nothing and yields nothing.

   The common cause is the weather. The forecast is your observation. 

   You do not know the true weather, only the forecast.

   Now, the key is that your mood is not observed by you at the time of decision. You know the forecast, but your mood might not align. Specifically, even if the forecast is sunny, you might be in a bad mood (because the forecast might be wrong and it's actually rainy, or for other reasons), and similarly for rainy forecast. But we assume that your mood is determined solely by the true weather: 

   - If true weather is sunny, you are in good mood with probability 1.
   - If true weather is rainy, you are in bad mood with probability 1.

   Then, your decision to attend is determined by your mood: if in good mood, you attend with high probability (90%); if in bad mood, you attend with low probability (10%). But wait, this is deterministic given the weather? Not quite, because of the 90% and 10%. So we can say that your attendance has a randomness that is not based on the weather.

   However, in this setup, for a given true weather, your mood is fixed, and then your attendance is random. Specifically, if true weather is sunny, you are in good mood and then you attend with 90% probability. If true weather is rainy, you are in bad mood and then you attend with 10% probability.

   The client's mood is also determined by the true weather: as above.

   Now, you observe a sunny forecast. What do you do? You must decide to attend or not.

   But note: your decision might be affected by your mood, but you don't know your mood because you don't know the true weather. You only know the forecast.

   However, your mood is determined by the true weather, which you don't know, so you don't know your mood. Therefore, when you are in the decision state, you do not know whether you are in a good mood or not. You can try to introspect, but we assume you cannot. So you only know the forecast.

   Therefore, your decision is based on the forecast. You can choose to always attend, never attend, or randomize.

   Let's compute the expected utility for a causal decision theory agent.

   First, given sunny forecast, the probability of true weather sunny = 0.8, rainy = 0.2.

   If you choose to attend, then you will attend regardless of mood? But mood will affect whether you want to go, but in this case, because you are committed to the decision. The decision is made before knowing mood.

   So if you choose to attend, then you will be at the meeting. The client's mood depends on the true weather.

  - If true weather sunny (prob=0.8), client good mood with prob 0.8, so you get the contract with prob 0.8. 
    - So, from such a day: expected utility = 0.8 * (ความ,000 - 1,000) + 0.2 * (-1,000) = 0.8* (เป็น,000) - 1,000 = ... 
    wait, the contract is worth $10,000? Let's use $10,000.

    So if sunny: EU = 0.8 * (10,000 - 1,000) + 0.2 * (-1,000) = 0.8*9000 - 200 = 7200 - 200 = 7000
  - If true weather rainy (prob=0.2), client good mood with prob 0.2, so EU = 0.2*(10,000-1,000) + 0.8*(-1,000) = 0.2*9000 - 800 = 1800 - 800 = 1000

   So overall EU(attend | sunny forecast) = 0.8*7000 + 0.2*1000 = 5600 + 200 = 5800

   EU(not attend) = 0

   So CDT says attend.

   Now, for EDT: they condition on the action. So for the action "attend", what is the probability distribution over the weather? 

   But note: you are committed to the decision to attend, but your mood (which is determined by the weather) might prevent you from attending? In this setup, your mood affects the probability of attending, but if you have already decided to attend, then you will attend. So there is not a separate mood check after the decision.

   To make EDT work, we need that the agent's action (attend) is evidence about the mood, and hence about the weather, and hence about the client's mood.

   So we must have that the decision to attend is not perfectly carried out. Specifically, even if you decide to attend, your mood might prevent you: if you are in a bad mood, you might not go even if you decided to. 

   So let's assume that after you decide to attend, you will actually attend only if your mood is good. If your mood is bad, you will not attend, even if you decided to. Similarly, if you decide not to attend, you for sure don't attend.

   Then, the only way you attend is if you decide to attend AND you are in a good mood.

   So the action we are decisioning is "intention to attend", but the world only sees the actual attendance.

   So for the utility: you only get the outcomes if you actually attend.

   So the decision is the intention. The event of actual attendance is not under your control beyond the intention and the mood.

   You know the forecast, and then you choose between forming the intention to attend or not.

   If you form the intention to attend, then you will actually attend only if in good mood (i.e., if true weather is sunny).

   If you form the intention not to attend, you don't attend.

   Given the sunny forecast, if you choose to form the intention to attend, then you will actually attend only if the weather is sunny ( because then you are in good mood). If the weather is rainy, you are in bad mood, so you don't attend even if you intended to.

   So if you choose to have the intention to attend:
     - If weather is sunny (prob 0.8) AND you are in good mood ( which is true for sunny), then you attend. Then, given weather is sunny, client is in good mood with prob 0.8, so you get the contract with prob 0.8. So utility in this branch: 0.8*(10,000-1,000) + 0.2*(-1,000) = 7000 ( as above)
     - If weather is rainy (prob 0.2), then you are in bad mood, so you do not attend, utility 0.

   So EU(intention to attend | sunny forecast) = 0.8 * 7000 + 0.2 * 0 = 5600

   If you choose the intention not to attend, utility = 0.

   So causal decision theory ( which only cares about the intention and its causal consequences) would still say to form the intention to attend, because 5600 > 0.

   Now, evidential decision theory: when evaluating the EU of the intention to attend, they condition on the intention to attend. What does that to the probabilities?

   conditioning on the intention to attend, what is the probability of the weather?

   But your intention to attend is chosen by you and is not random, so conditioning on it doesn't give information. Unless we are in a setup where the intention is part of a policy. In this case, for a one-shot decision, EDT would use the conditional probabilities given the intention. But since the intention is not caused by the weather, it is independent. So conditioning on the intention to attend doesn't change the probability of the weather. Therefore, EDT would also get 5600.

   We need that the intention is evidence about the weather because it is correlated with your mood, which is in turn with the weather. But you don't know your mood, so when you condition on your intention, it doesn't give evidence because the intention is chosen based on the forecast, which you already know.

   To make it work, we must have that the intention is not perfectly based on the forecast. That is, even with a sunny forecast, you might not form the intention to attend because of some other (independent) factor. But then that factor is not part of the common cause.

