   What are the expected utilities?

   First, the agent is busy. Then they have:
     P(high stress | busy) = [P(busy|high)*P(high)] / [P(busy|high)*P(high) + P(busy|low)*P(low)] 
     = (0.8*0.5) / (0.8*0.5 + 0.2*0.5) = 0.4 / (0.4+0.1) = 0.4/0.5 = 0.8
     P(low stress | busy) = 0.2

