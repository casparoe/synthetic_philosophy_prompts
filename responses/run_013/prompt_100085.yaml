   In the standard Smoking Lesion, the drug (smoking) does not cause the harm (cancer), but there is a lesion that causes both the desire to smoke and the cancer. Here, the drug doesn't productivity; stress causes both the desire to take the drug and productivity.

   Then, taking the drug is evidence of stress, but it doesn't cause productivity. So a causalist would not take the drug because it costs $60 and has no benefit.

   So both EDT and CDT would not take the drug.

   We want CDT to take the drug? Only if the drug caused productivity. But then it wouldn't be a common cause case.

