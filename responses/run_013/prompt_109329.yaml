prompt: |-
  Next week I'm giving a department colloquim talk arguing that aesthetic testimony (a friend telling you a film is beautiful) can give you genuine warrant for the aesthetic belief — but only for what I call verdictive properties like beautiful, elegant, unified, and never for hedonic/experiential ones like moving, funny, or sad. My line is that the warrant doesn't travel through the speaker's authority; it travels through the hearer imaginatively rehearsing the speaker's response, so it's the rehearsal doing the epistemic work, not testimony proper. The audiance is our epistemology group, mostly testimony and disagreement people with settled priors (a few reductionists, a couple anti-reductionists, one stubborn defender of the acquaintance principle), plus two philosophers of art who think importing epistemology into aesthetics is a category mistake and who care a lot about the felt character of aesthetic experience. Draft my Q&A prep sheet: the objections I'll actually get from this room, ordered the way they'll come and by how much damage they do, each phrased the way these people would phrase it, a two-minute reply for each with a note on where the reply is soft, and the one question I'm hoping nobody asks.
