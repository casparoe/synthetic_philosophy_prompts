prompt: |-
  I am a backend engineer, mostly distributed systems, with no formal training in philosophy; this is a question that has been accumulating on me for a couple of years and I would like to settle it.

  The pattern is this. There are practices whose point is that the people inside them act for a certain reason, and the point is defeated if that reason is consulted at the moment of acting. The clearest case is a support team I worked with. We rewrote the playbook so that its first line said the goal was to make the customer feel heard, then trained people on that line and asked them to keep it in view during calls. The calls got worse: agents became audibly scripted, and customers could tell they were being managed. Nothing about the agents changed except that they now knew, and were thinking about, what the behavior was for. Second case: I visit a friend in the hospital. If I go because that is what the friendship calls for, the visit is a good one; if I pause to check that visiting is warranted by the friendship, the visit becomes an obligation I am discharging, and it shows. Third: a doctor tells a patient that recovery goes better if the patient believes it will, and the belief will not form on those grounds. My colleague's summary of all this is that you cannot do a thing well while holding the reason for doing it up in front of you, but that seems both too broad, since holding the reason up seems fine when I am filling out a tax return, and too narrow, since in my cases the damage is done even when the person has already decided and is not deliberating at all. The deciding is over; the awareness alone is corrosive.

  I have tried three nearby things and none of them fit exactly. Goodhart's law covers the case where a measure becomes a target, and my support example has that flavor, but the damage in my cases does not require a measurement, and the friendship case has no metric in it anywhere. The paradox of hedonism is closest in spirit, but it is about one particular state, happiness, being self-defeating, whereas I am after the general shape, including cases where what is defeated is not a state of the agent but something relational, like being trusted. A colleague said there is something in ethics about utilitarianism being unable to be thought about while you act, and another recalled a case about a man choosing whom to save, where the complaint was that the theory demanded one thought more than the situation warranted; I could not get a name out of either of them, and in any case my cases are not dilemmas, since nothing is at stake, there is no conflict to resolve, and the trouble starts even when the right action is obvious.

  So: does this have a name? If it does, I want the boundaries rather than the label, which of my cases it covers and which it does not, and why. If there is a family of names rather than one, tell me which member is closest and where the seams are, and in particular whether there is a term for the version in which the harm comes not from the person's psychology but from the practice of writing the point of a rule down where the people who follow it will read it, since that is the version I keep running into at work. If nothing fits, coin something and give me the definition plus two cases that fall just outside it. Two further cases I would like you to place, because I genuinely cannot tell whether they belong: a coach telling a player not to think about the mechanics of a stroke, and a manager who asks an employee to explain why they did a kind thing, after which the kind thing no longer counts for either of them. Please lead with a one-sentence answer and keep the whole reply under 600 words.
reasoning: |-
  Alright, the user is a backend engineer with experience in distributed systems, and they've noticed a recurring pattern in various scenarios. They describe situations where knowing or focusing on the underlying reason for an action actually undermines the action itself. Let me start by breaking down their examples.

  First, there's the support team case. They added a line to the playbook about making customers feel heard, but when agents kept that in mind during calls, the interactions became scripted and insincere. The agents' awareness of the goal corrupted the execution. Then, visiting a friend in the hospital—if you go because friendship demands it, it feels genuine, but if you stop to question whether the visit is warranted, it turns into an obligation. The sincerity is lost. The doctor-patient example shows that believing in recovery for the sake of better outcomes prevents genuine belief. 

  The user mentions they've looked into Goodhart's law and the paradox of hedonism but found them insufficient. Goodhart's is about metrics becoming targets, but not all their cases involve metrics. The paradox of hedonism is specific to happiness. They also reference something in ethics about utilitarianism requiring overthinking, but their cases aren't dilemmas. 

  The core issue seems to be that certain actions require a kind of unselfconsciousness. When the reason is foregrounded, it alters the nature of the action. The user wants to know if there's a term for this. I recall Bernard Williams' concept of "one thought too many." That fits the hospital visit example—the friend shouldn't need to justify the visit beyond caring. The support team case is similar; focusing on the reason makes the agents self-aware and artificial. 

  But what about the manager asking for an explanation of a kind deed? That also fits—the act loses its authenticity when scrutinized. The coach telling a player not to think about mechanics is a bit different. It's about automaticity versus deliberation, which is more about skill execution than the reasons behind an action. So it's adjacent but not the same. 

  The user also wants to know if there's a term for institutionalizing this by writing down the rule. That might be "proceduralism" or "rule fetishism," where the process overshadows the intent. The support playbook example is a clear case here. 

  So, the best fit is Williams' "one thought too many," covering cases where bringing the reason to mind undermines the relational or authentic nature of the act. The coaching example is about cognitive load in skill execution, which is related but distinct. The manager's inquiry is another instance of over-rationalization damaging authenticity. 

  The boundaries: when actions are transactional (like tax returns), reasoning is fine. But when authenticity, trust, or relational aspects are key, foregrounding reasons corrodes the act. The key differentiator is whether the action's value lies in its sincerity or automaticity.
answer: |-
  The closest concept is **Bernard Williams' "one thought too many"**, where explicitly foregrounding the justification for an action undermines its authenticity or relational value.

  ### Boundaries & Cases Covered:
  1. **Covered**:  
     - **Hospital visit**: Justifying the act via friendship ("should I visit?") replaces organic care with obligation.  
     - **Support team**: Displaying the goal ("make customers feel heard") turns empathy into performative scripting.  
     - **Manager inquiry**: Demanding justification for kindness reduces it to transactional duty.  
     *Why*: These involve **relational or ethical acts** where sincerity/authenticity is eroded by conscious rationalization. Williams argues that virtues like friendship require motives beyond calculated reasoning.

  2. **Not Covered**:  
     - **Tax return**: Purely transactional acts tolerate explicit reasoning (no relational harm).  
     - **Doctor/patient belief**: A psychological paradox (self-defeating directives), not relational authenticity.  
     - **Coach/stroke mechanics**: Focuses on **automaticity** (cognitive interference), not motives.  
     *Boundary*: When the act’s value lies in sincerity/spontaneity (e.g., trust, care) vs. procedural correctness.

  ### Institutional Version:
  **Proceduralism** (rigidly codifying intent) causes this. Writing the playbook’s goal *for agents to consult* replaces intuitive judgment with self-monitoring, making behavior rigid. Harm arises from **incentivizing self-consciousness** instead of cultivating disposition.

  ### Your Two Cases:
  - **Coach/player**: *Outside scope*. Relates to **skill automaticity** (overthinking disrupts motor skills), not motive-corrosion.  
  - **Manager inquiry**: *Core example*. Forces post-hoc justification, stripping kindness of its goodwill essence.

  **One-sentence answer**: This is Williams' "one thought too many," where foregrounding justification corrodes relational acts by replacing authenticity with calculation, distinct from Goodhart’s Law (metric distortion) or skill automaticity (motor tasks).

