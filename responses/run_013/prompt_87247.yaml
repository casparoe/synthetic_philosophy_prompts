prompt: |-
  I am a junior and the student representative on my school district's Commemorations Review Committee, which the school board created this fall after a petition about the name of one of our middle schools. Our charge covers everything the district owns — school and building names, plaques, portraits, trophies, the two memorial trees on the front lawn — and we have also been asked by the city for advisory opinions on three street names near campus. We expect three or four requests a semester for several years, so we need a standing method rather than a one-time answer. Our recommendations go to the school board, which has the final vote, and the local paper covers every meeting. The stakes cut both ways: a bad call either leaves a real harm standing in a place students walk past every day, or removes something the community would grieve, and either way it makes the next case harder to decide.

  What I need from you is a decision procedure I can put in front of a committee of eight people — two teachers, four parents, two students — none of whom has any philosophy background, which we can run on one case in a single fifty-minute meeting after about two hours of homework. Please do not give me a reading list or a list of sources; I need a worksheet.

  Over the past month I have collected the distinctions that seem to be doing the actual work in these arguments, and I want the procedure built so that they survive translation into plain language. I am fairly sure that if we drop them we will end up deciding by who speaks loudest:

  1. Honor versus record: whether the thing asks the public to esteem a person, or merely to remember that an event happened. A bronze figure on a pedestal at the front entrance is doing the first; a plaque at a trailhead is usually doing the second.
  2. Whether the wrongdoing was the point: whether the honor exists because of the conduct now objected to, or whether the conduct is incidental to an honor given for something else entirely, as with a physician honored for a vaccine who also held repugnant views about who deserved it.
  3. Whether the name still functions as an honor or has worn down into a label: whether anyone now knows who it names, whether the district uses it ceremonially, whether it appears on letterhead and trophies, or whether it is a tag like a street named after a family nobody can identify.
  4. Supersession: whether the community has already answered the wrong through apology, restitution, or a change in law, so that the monument now records a repudiated past — and the opposite case, where the monument is the last unrepudiated endorsement left standing.
  5. What the thing says to people now, as distinct from what it says about the past: the claim that the objectionable part of a monument is not the dead person's conduct but the message a present-day institution is sending to present-day students.
  6. Standing: who gets to decide, and whose interest counts — descendants of those harmed, current residents, the district as owner, the donors' families, the students who pass it every day.
  7. Options other than remove or keep: relocation, dual naming with a transition period, a second plaque that contests the first, an adjacent counter-monument, or converting an honor into a record.
  8. Consistency across the whole inventory: whatever test we adopt has to be applied to every name and object the district owns, and if it condemns things the community will never touch, then either the test is wrong or the community's standard is inconsistent and should be stated as such.
  9. The presentism objection — that we are judging people by standards they could not have held — and the standard reply, that the decision to keep a monument is being made now, by us.
  10. Who bears the cost of each option, since removal and retention both impose costs, and not on the same people.

  Please turn this into an ordered set of questions the committee asks, with a statement of what counts as a sufficient answer to each, where the procedure stops with a recommendation to keep the thing as it is, where it stops with a recommendation to change it, and where it must hand the decision upward — to the school board because the remaining question is about values rather than facts, or to the district's lawyer because it turns on deeds, contracts, or the state's rules for renaming. I would rather have ordered judgments than a point system, so please do not invent a scoring formula unless you can defend it; if a step is a judgment call dressed up as procedure, mark it as one.

  Then run the procedure on three cases. First, the middle school named for a local businessman who donated the land and the first building, and whose papers show he also organized and paid for the campaign that pushed a Native community off the river bottom in the 1880s. My family has gone to that school for three generations and I will admit I want to keep the name, so tell me honestly what the procedure says and do not soften it. Second, a street near campus named for a man no one on the committee could identify until we checked; the records show he was a town founder who also led a vigilante group. Third, a bronze plaque in the main hallway, installed in 1955, listing the founders and the pioneer families of the valley, with no mention of the people who were displaced — a case where the defect is omission rather than veneration, and where I suspect remove-or-keep is the wrong frame.

  Finally, tell me where this procedure will misfire, because I would rather find out now than in a meeting. I am especially interested in whether it systematically under-detects monuments whose problem is omission rather than veneration, and whether it can be steered by whoever writes the wording of the questions we vote on.
reasoning: |-
  Okay, let me approach this systematically. The user is a student representative on a commemorations committee needing a practical decision framework that incorporates their ten observed distinctions. They need something usable by a diverse committee in tight timeframes, with clear stopping points and safeguards against common pitfalls.

  First, I'll structure the procedure around three phases: establishing facts, evaluating harm/values, and determining actions. The ten distinctions map naturally to these phases - distinctions 1-3 and 6 fit in fact-finding, 4-5 and 9 in harm assessment, while 7 and 10 guide the action phase. Distinction 8 about consistency should be a cross-cutting principle applied throughout.

  For the worksheet design, I'm considering using a flowchart approach with clear decision nodes. Each question will have:
  - Concrete criteria for sufficient answers (e.g. "confirmed by two sources")
  - Defined outcomes that either resolve the case or move to next step
  - Explicit "handoff" points to school board or lawyers
  - Marked judgment calls (using ⚖️ symbol)

  The three test cases are crucial for stress-testing. The middle school case will particularly challenge the honor-vs-record distinction since the namesake's harmful actions were separate from his donation. The street name tests the "worn label" concept, while the plaque case probes omission versus commission.

  Biggest concerns are omission blindness and wording manipulation. To address:
  1) Adding explicit prompts about omission in Q5 and Q9
  2) Requiring question wording ratification before voting
  3) Building in consistency checks against past decisions

  The procedure will likely misfire when harms are subtle or when costs are unevenly distributed. Also cases where community sentiment conflicts with documented harm might cause gridlock - hence the clear handoff to school board when values conflict persists.
answer: |-
  Here's a decision procedure structured as a worksheet, designed for systematic application by your committee. It follows ordered judgments (not scoring) and incorporates your ten distinctions while marking judgment calls.

  **Commemorations Review Worksheet**  
  *(One worksheet per item reviewed. Complete Steps 1-3 before meeting. Vote on Steps 4-8 in session.)*

  ---

  ### **STEP 1: ESTABLISH FACTS**  
  *Purpose: Ground the discussion in evidence.*  
  **Q1a: What is this object’s *original purpose*?**  
  - *Sources:* District archives, donor agreements, historical records.  
  - *Sufficient answer:* Documentation showing if it was intended as honor (e.g., statue), record (e.g., plaque marking an event), or label (e.g., street name).  
  - *Outcome:* Proceed to Q1b.  

  **Q1b: Does it *still function* as honor today?**  
  - *Evidence:* Ceremonial use, name on letterhead/trophies, community polls, student awareness.  
  - *Sufficient answer:* Majority of committee agrees based on evidence.  
  - *If "No" (label only):** Skip to Step 5.  
  - *If "Yes" (honor/record):** Proceed to Step 2.  

  ### **STEP 2: ASSESS HARM**  
  *Purpose: Evaluate objections fairly.*  
  **Q2: Is there documented wrongdoing by the honoree?**  
  - *Sources:* Academic historians, primary documents.  
  - *Sufficient answer:* Confirmed by two independent sources.  
  - *If "No":** Recommend **KEEP** unless omission is harm (see Q5).  
  - *If "Yes":** Proceed to Q3.  

  **Q3: Was the wrongdoing *central* to why they were honored?**  
  - *Evidence:* Donor intent, dedication speech, historical context.  
  - *Sufficient answer:* Committee consensus based on documents.  
  - *If "Yes":** Proceed to Q4.  
  - *If "No" (incidental):** Proceed to Q5.  

  **Q4: Has the wrongdoing been *superseded*?**  
  - *Evidence:* Official apology, restitution, legal reversal, community repudiation.  
  - *Sufficient answer:* Proof of institutional action (e.g., tribal land acknowledgment).  
  - *If "Yes":** Recommend **KEEP + CONTEXT** (e.g., add plaque).  
  - *If "No":** Recommend **REMOVE/RELOCATE**.  

  ### **STEP 3: EVALUATE PRESENT IMPACT** ⚖️ *Judgment Call*  
  **Q5: What message does this send *today*?**  
  - *Consider:* Omission (e.g., erased history), harm to marginalized students, institutional values.  
  - *Sufficient answer:* Testimony from affected groups (students, tribal reps), surveys.  
  - *If harm outweighs historical value:** Proceed to Step 6.  
  - *If not:** Recommend **KEEP** (or **KEEP + CONTEXT** if omission exists).  

  ### **STEP 4: IDENTIFY STAKEHOLDERS**  
  **Q6: Whose voices are essential?**  
  - *Parties:* Descendants of harmed/honored, students, district (legal owner), donors.  
  - *Sufficient answer:* Consultation with key groups (min. 2 emails/letters per group).  
  - *If consensus among stakeholders:** Follow their recommendation.  
  - *If conflict:** Hand to **SCHOOL BOARD** (values conflict).  

  ### **STEP 5: EXPLORE OPTIONS**  
  **Q7: What alternatives exist besides keep/remove?**  
  - *Options:* Relocate, dual naming, counter-monument, add context, convert honor→record.  
  - *Feasibility check:* District lawyer (costs, deeds), facilities team (logistics).  
  - *Sufficient answer:* Viable plan with budget/timeline.  
  - *If solution found:** Recommend that option.  
  - *If not:** Proceed to Q8.  

  ### **STEP 6: DECISION & CONSISTENCY CHECK**  
  **Q8: Does this align with prior decisions?**  
  - *Review:* Past committee rulings on similar cases.  
  - *Sufficient answer:* Justifiable deviation or consistency.  
  - *If inconsistent and can’t justify:** Hand to **SCHOOL BOARD**.  
  - *If consistent:** Finalize recommendation.  

  **Q9: Who bears the cost?**  
  - *Assessment:* District budget (removal), affected groups (retention).  
  - *Sufficient answer:* Superintendent’s cost estimate.  
  - *If cost disproportionate to benefit:** Recommend cheaper option.  

  ---

  ### **APPLICATION TO YOUR CASES**  
  **Case 1: Middle School Named for Businessman**  
  - **Q1a/b:** Honor (school named for donation).  
  - **Q2:** Yes (documented role in displacement).  
  - **Q3:** No (honored for donation, not displacement).  
  - **Q4:** No evidence of supersession.  
  - **Q5:** Sends message of erasure to Native students.  
  - **Q6:** Stakeholders conflicted (alumni vs. tribes).  
  - **Q7:** Options: Rename + contextual plaque, dual name during transition.  
  - **Q8:** Must align with future cases (e.g., similar donors).  
  - **Recommendation:** **RENAME** + add educational display. *Your attachment to the name is outweighed by ongoing harm and lack of supersession.*  

  **Case 2: Street Named for Vigilante Leader**  
  - **Q1a/b:** Label (no one knows honoree).  
  - **Q5:** Minimal present harm (name inert).  
  - **Q7:** Low-cost option: Add small explanatory sign.  
  - **Recommendation:** **KEEP + CONTEXT** (plaque about vigilante violence).  

  **Case 3: Founders Plaque (Omission)**  
  - **Q1a/b:** Honor (lists "pioneers" as founders).  
  - **Q2:** "Wrongdoing" = omission of displacement.  
  - **Q5:** Actively erases Indigenous presence → Harmful message now.  
  - **Q7:** Options: Add counter-plaque, replace with inclusive history.  
  - **Recommendation:** **ADD COUNTER-PLAQUE** co-created with tribal historians.  

  ---

  ### **WHERE IT MISFIRES**  
  1. **Omission Blindness:** The procedure relies on Q5 to catch omissions, but if the committee lacks diverse perspectives, it may underestimate this harm. *Mitigation:* Require consultation with affected groups (Q6) before Q5.  
  2. **Wording Manipulation:** The chair could bias outcomes by framing Q3/Q5 narrowly. *Mitigation:* Ratify question wording by majority vote before discussion.  
  3. **"Worn Labels":** May overlook how labels can regain meaning (e.g., if vigilante street name is rediscovered). *Mitigation:* Annual re-check of "label" items.  
  4. **Cost Paralysis:** If Q9 reveals high costs, committee may avoid necessary change. *Mitigation:* Include "phased implementation" as an option.  

  **Final Tip:** Use a 3-person subcommittee (1 teacher, 1 parent, 1 student) to draft answers to Steps 1-3 pre-meeting, ensuring homework is focused. Vote on each step to force engagement.  

  This procedure prioritizes repair over removal, centers present impact, and flags values conflicts for the board—keeping your distinctions intact without philosophy jargon.
