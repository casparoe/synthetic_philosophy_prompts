prompt: |-
  I teach a third-year applied ethics course on animals, food and land, and I am writing the final exam. It is closed-book and closed-notes, which matters for what I am about to ask you: I want an essay question that can only be answered by doing the accounting and the philosophy on the spot, not by recalling a position the students have read about. The question grew out of an argument I lost in the departmental kitchen last term, when a colleague told me that if I really cared about field mice I should be eating steak, and I could not say on the spot why he was wrong. For the exam I have written out a short argument that will be printed above the question. A broiler chicken yields something on the order of a kilogram and a half of meat and a steer something on the order of three hundred kilograms. Both are fed on crops, and harvesting crops kills small animals in the field, from mice and birds up to however many invertebrates you are willing to count, at some rate per hectare that I will instruct students to treat as fixed and disputed. If deaths per hectare are roughly constant, deaths per kilogram of food must fall as body size rises: beef should cost far fewer deaths per kilogram than chicken, and quite possibly fewer than bread. So the eater who counts deaths should prefer beef to chicken, and the familiar advice to eat lower on the food chain is either empty or backwards. Please draft the question, a model answer of roughly six hundred to seven hundred words, and a marking scheme out of twenty marks.

  I want the question to turn on three things and not to let a student settle for less than all three. First, whether that comparison survives being redone per hectare of land, per calorie, and per kilogram of feed rather than per kilogram of meat, and whether the ordering of beef, chicken and bread reverses when the denominator changes. Second, what the argument has to assume about the lives of the field animals in order to count their deaths as harms at all, and whether that same assumption can be held while the farmed animals in the comparison are treated as the ones that matter. Third, whether the arithmetic settles anything ethically even when granted, that is, whether the conclusion follows from the numbers or from a choice about which denominator matters that was made before any number was collected. The question should be answerable in fifty minutes by a student who has done the reading but has memorized nobody's estimates, so keep the empirical demands to what can be reasoned out from the stipulated figures rather than from remembered numbers, and do not ask for citations or sources, since they cannot have them. The marking scheme should separate an A from a B by naming the specific moves a full-mark answer must contain, the marks each is worth, and a short note on how students typically get each one wrong.

  Please write the question, the model answer and the marking scheme as continuous prose throughout, with no headings, no numbered or bulleted lists, no bold and no tables, because I paste the whole thing into a single email to the other graders and read the model answer aloud at the review session; where the marking scheme needs to enumerate, do it in sentences.
reasoning: |-
  Okay, the user teaches a third-year applied ethics course and needs help creating a final exam essay question. The core challenge is designing a question that forces students to engage with ethics through real-time calculation and reasoning rather than recalling pre-memorized positions. 

  The user's personal anecdote about the "steak vs field mice" argument reveals the exam's inspiration - they want students to confront that same logical puzzle. Three key components must be woven into the question: 1) mathematical comparisons across different denominators (land, calories, feed), 2) philosophical assumptions about which lives count as harms, and 3) whether arithmetic alone dictates ethical conclusions. 

  Hmm, the constraints are tight - closed book, no citations, 50-minute limit. The model answer needs to demonstrate how to navigate the numbers while exposing ethical tensions. For the marking scheme, clarity is crucial since it'll be shared verbally. I should avoid academic jargon and structure it around observable student behaviors ("fails to consider..." rather than abstract criteria). 

  The real trap here is letting students off the hook by only addressing one dimension. The question must force engagement with all three layers: the math must be wrong or incomplete, the value assumptions must be inconsistent across species, and the ethical framing must be shown as prior to calculation. 

  For the model answer, I'll start by conceding the per-kg meat math appears sound - that disarms the student who wants to dismiss the premise. Then systematically dismantle it: show how calorie density flips the chicken/beef comparison, how invertebrate inclusion breaks the "fixed deaths" assumption, and how the harm calculus treats field mice as disposable while livestock deaths are countable. Finally argue that choosing denominators (kg? calorie? land?) is itself an ethical choice about what we value. 

  The marking scheme should penalize: ignoring denominator comparisons (common), skipping the value inconsistency (many will), or treating math as ethically decisive (tempting for STEM-minded students). Top marks require all three moves plus recognizing the denominator choice as normative. 

  ...Wait, should I mention Peter Singer's replaceability argument as implicit in the model? No - user said no recalled positions. Stick to pure reasoning. 

  Noticing the user's frustration about losing the kitchen debate. This exam question is clearly personal - it's their chance to equip students with counterarguments they wish they'd had. The model answer should have that "aha" quality where the logic clicks midway through. 

  Land equivalency is the sneaky pivot - when you switch from "deaths per kg" to "deaths per hectare", beef suddenly looks worse because it monopolizes land. That's where B students get stuck while A students connect it to food justice implications. 

  Final touch: end the model answer by questioning whether "fewer deaths" is even the right goal - that's the philosophical mic drop the user probably wanted in that kitchen argument.
answer: |-
  Here is the exam question, model answer, and integrated marking scheme drafted as continuous prose for your needs:

  **Exam Question:** The following argument was presented: Broiler chickens yield approximately 1.5kg of meat; steers yield approximately 300kg. Both are fed crops. Harvesting crops kills field animals (e.g., mice, birds, invertebrates) at a rate per hectare we will treat as fixed but disputed. Since deaths per hectare are constant, deaths per kilogram of meat must be lower for larger animals: beef thus causes fewer deaths per kg than chicken, and potentially fewer than plant foods like bread. Therefore, minimizing harm requires preferring beef over chicken or plants. Critically evaluate this argument. Your evaluation must address: (1) Whether comparing deaths per kg of meat, per calorie of food produced, per hectare of land used, and per kg of feed input changes the relative ranking of beef, chicken, and bread regarding field animal deaths, and if so, how. (2) What assumptions about the moral significance of field animal deaths versus farmed animal deaths are necessary for the argument to hold, and whether these assumptions can be consistently applied to both groups. (3) Whether settling on one specific denominator (e.g., per kg meat, per hectare) resolves the ethical question or itself represents a prior ethical choice not determined by the arithmetic. Use only the figures provided; no external data or citations are required or permitted.

  **Model Answer:** This argument presents a provocative arithmetic challenge but suffers from critical flaws in its framing, assumptions, and ethical reasoning, failing to establish that eating beef minimizes harm. Firstly, the comparison based solely on deaths per kilogram of meat is misleading and incomplete. While it's true that a steer yields vastly more meat (300kg) than a chicken (1.5kg), and assuming constant field deaths per hectare to grow feed, deaths *per kg of meat* will indeed be lower for beef. However, changing the denominator dramatically alters this picture. Consider deaths *per hectare*. A hectare used to grow feed for chickens might support many more chickens and thus yield far more total kg of chicken meat than the same hectare used for beef feed would yield beef meat, due to cattle's lower feed efficiency and longer growth time. While per kg beef might require fewer field deaths, per hectare dedicated to its production might involve *more* total field deaths because the land yields less final meat product than if used for chicken feed. More crucially, consider deaths *per calorie*. Beef is significantly less calorie-dense per kg than chicken or especially bread. Producing, say, 1000 calories of beef requires vastly more feed (and thus more land and more field animal deaths) than producing 1000 calories of chicken or bread. Therefore, when assessed per calorie or per hectare, the apparent advantage of beef disappears and likely reverses, suggesting chicken or bread cause fewer field deaths per unit of human nutrition delivered. The argument selectively chooses the denominator (per kg meat) that favours large animals, ignoring denominators (calorie, hectare) relevant to resource efficiency and nutritional output that favour smaller animals or plants.

  Secondly, the argument relies on a deeply problematic and inconsistent assumption about whose deaths count as morally significant harm. To treat field mouse deaths as the primary harm to be minimized, the argument implicitly assumes these deaths are serious moral harms. This requires attributing significant moral status or interests (e.g., in avoiding suffering, in continued life) to field animals like mice and invertebrates. However, simultaneously, the argument completely disregards the deaths of the farmed animals themselves – the steer and the chicken. If field mice possess sufficient moral status such that their deaths are harms we must minimize, it is inconsistent and arbitrary not to afford at least equal (and likely greater) moral significance to the deaths of the sentient cows and chickens deliberately bred, confined, and slaughtered for food. Their lives are directly taken for the product, whereas field animal deaths are a side-effect. If the field mouse's life matters enough to drive dietary choices, then the cow's life must matter too – and its death is a direct, intended consequence of beef production. Counting *only* field deaths while ignoring farmed animal deaths constitutes an indefensible double standard. One cannot consistently hold that field mice have morally significant lives requiring minimization of harm to them while simultaneously holding that the lives of cows or chickens lack such significance. The argument implicitly denies moral standing to farmed animals, an assumption incompatible with taking field animal deaths seriously as harms.

  Thirdly, the arithmetic itself does not settle the ethical question; it merely quantifies consequences based on a prior, unstated ethical choice about *what* to measure. Choosing to focus on deaths per kg of meat reflects an ethical prioritization of meat quantity above other values like nutritional efficiency (calories), land use impact, or the lives of farmed animals. Choosing per calorie prioritizes efficient energy delivery. Choosing per hectare prioritizes land conservation and potentially broader ecosystem impacts. None of these denominators is objectively "correct"; the choice depends on what values one deems most important – minimizing total deaths? Maximizing food from limited land? Prioritizing certain types of animals? The argument presents the per kg meat calculation as decisive, but this smuggles in the ethical view that meat quantity is the primary value and that only field deaths matter. Recognizing this exposes that the ethical dispute precedes the math; the numbers only illustrate consequences relative to a chosen framework. Furthermore, even if we grant per kg figures, the argument ignores other crucial ethical considerations like the vastly different living conditions and suffering endured by factory-farmed chickens versus pasture-raised cattle, or the question of whether causing *fewer* deaths of small field animals justifies causing *more* deaths of larger farmed animals if one grants both moral significance. The conclusion doesn't follow from the numbers alone; it follows only if one accepts the specific, and highly contestable, ethical choices embedded in the framing of the calculation and the scope of moral concern.

  **Marking Scheme:** The essay is marked out of twenty, with the highest marks requiring a comprehensive and integrated response addressing all three required elements. A top-tier answer scoring eighteen to twenty marks must clearly demonstrate the reversal of the beef/chicken/bread ranking when shifting denominators from per kilogram of meat to per calorie or per hectare, explicitly calculating or logically deriving this reversal using the provided figures without needing recalled data, a common pitfall is focusing only on per kg meat or failing to show the reversal convincingly. It must also explicitly identify the inconsistency in moral assumptions regarding field animals versus farmed animals, arguing that taking field deaths seriously as harms necessitates taking farmed animal deaths seriously too, students often discuss farmed animal suffering vaguely without linking it directly to the inconsistency in the argument's assumptions. Furthermore, it must compellingly argue that the choice of denominator itself reflects a prior ethical commitment about what values matter (e.g., meat quantity vs. nutritional efficiency vs. land conservation), and that arithmetic alone cannot resolve the ethical question without this prior choice, weaker answers often grant the arithmetic as ethically decisive or fail to articulate why denominator choice is normative. An answer scoring fifteen to seventeen marks will address all three points but with less depth, clarity, or integration, perhaps missing the strength of the reversal or the depth of the inconsistency. Scores of twelve to fourteen typically address only two of the three elements adequately or all three superficially, frequently omitting the denominator reversal or the prior ethical choice element. Scores below twelve usually fail to address two or more of the core requirements, perhaps getting stuck on per kg meat calculations, ignoring the inconsistency in moral standing, or treating the math as ethically conclusive without critique. A common error losing several marks is failing to challenge the argument's exclusive focus on field deaths while ignoring farmed animal deaths. Another frequent mistake is not demonstrating the concrete reversal of rankings across different denominators using the given figures. Answers that merely describe the argument without critical engagement across all three specified dimensions will not achieve a pass mark.
