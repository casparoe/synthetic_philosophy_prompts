answer: |-
  ## Ground Rules (160 words)
  Translating metaethics into your lab vocabulary:  
  - **Handleable (1)**: Direct experimental intervention with observable causal effects.  
  - **Fit-dependent (2)**: Entities justified solely by predictive/model-fitting utility.  
  - **Formal convenience (3)**: Purely notational tools with no empirical footprint.  

  **Expected strains**:  
  1. **Causal tangibility**: Moral properties don’t "break the apparatus" like physical interventions.  
  2. **Predictive scope**: Scientific models predict instrument readings; moral frameworks predict behaviors/attitudes, which are noisier and culturally mediated.  
  3. **Authority**: The "must" of morality (e.g., "torture is wrong") lacks a clear analog to instrumental interference.  

  ---

  ## The Translation (800 words)

  ### **Moral Realism** (Objective moral facts exist)  
  *Restatement*: Moral properties are **fit-dependent (2)** entities *approaching handleability (1)*.  
  - Evidence: Cross-cultural patterns in moral judgments (e.g., prohibitions on unprovoked violence) are "data points." Moral reasoning improves social coordination (predictive utility).  
  - *Stretch*: Calling them "handleable" requires interpreting societal interventions (e.g., laws against theft) as "apparatus-breaking" when moral norms are violated. The "interference" is social chaos, not instrument feedback.  
  - Realist claim: Moral facts are the best fit for human moral experience across contexts, like an electron explaining cloud chamber tracks.  

  ### **Moral Anti-Realism** (No objective moral facts)  
  *Restatement*: Moral claims are **formal conveniences (3)** or expressions of subjective fits.  
  - **Error Theory** (Moral statements are always false): Moral talk is like phlogiston theory—a useful heuristic (3) falsely projecting "handleable" properties onto social emotions.  
  - **Non-Cognitivism** (Moral statements aren’t truth-apt): Saying "murder is wrong" is like setting a spectrometer’s baseline—it’s calibrating attitude (3), not reporting a detection (1/2).  
  - *Stretch*: Moral language *feels* descriptive, unlike consciously arbitrary formalism.  

  ### **Middle Positions**  
  - **Relativism** (Moral truths are framework-dependent):  
    Moral properties are **fit-dependent (2) but only within a cultural apparatus**. "Honor" might be a real entity in one societal instrument (predicting behaviors), noise in another. Like a spectral peak visible only in specific solvents.  

  - **Constructivism** (Moral truths are mind-dependent but objective):  
    Morality is a **fit-dependent (2) entity emerging from rational agency**. Like a phase transition temperature—real within the system, measurable, but dependent on constituent properties (human rationality).  

  - **Response-Dependence** (Moral truths depend on idealized human responses):  
    "Wrongness" is like color—**fit-dependent (2)** on standardized observers (e.g., empathetic humans). It’s not handleable (1) alone, but not *merely* convenient (3).  

  ---

  ## Clean Carries (200 words)  
  The core distinction between entities with predictive/empirical traction vs. instrumental conveniences translates cleanly:  
  - Anti-realist positions (especially non-cognitivism) map neatly to **formal conveniences (3)**: moral concepts as calculational tools for social navigation, with no expectation of "detection."  
  - Relativism aligns with **fit-dependent (2) entities under constrained conditions**, like a theoretical entity valid only in a specific experimental regime.  
  - The realist/anti-realist debate’s focus on whether moral terms *refer* mirrors scientific debates about ontological commitment to unobservables. The question "Is this term doing work beyond notation?" is identical in both fields.  

  ---

  ## Bent (250 words)  
  1. **Handleability (1) as Social Intervention**:  
     Stretching "interference → apparatus break" to "norm violation → social dysfunction" distorts by hiding *normativity*. Social chaos (e.g., from theft) is observable, but the moral "must" ("you *shouldn’t* cause chaos") isn’t derived from observation alone—it’s a prescription. Science predicts instrument reactions; morality *directs* behavior. This bend obscures the gap between *is* (social effects) and *ought* (moral obligation).  

  2. **Fit-Dependence (2) for Normative Authority**:  
     Moral realists claim moral facts "fit" not just behaviors but *reasoned judgments*. This stretches "fit" beyond predictive accuracy to *rational inescapability* (e.g., "torture is wrong" feels rationally compelled, not just useful). The distortion hides that scientific models are judged by prediction; moral frameworks are judged by justification, which isn’t settled by data alone.  

  3. **Constructivism’s Rational Agents**:  
     Mapping "rational agency" to a measurable system property (like intermolecular forces) ignores that rationality in ethics is itself normative. Science measures forces; ethics debates what rationality *requires*.  

  ---

  ## Didn’t Survive (Residue)  
  1. **Categorical Normativity**: The feeling that moral demands *must* apply regardless of desires (e.g., "even if you *want* to torture, you shouldn’t"). No lab analog.  
  2. **Mind-Independence**: Realist claims that moral facts exist independently of *all* minds—unlike scientific constructs, which are mind-dependent models.  
  3. **Non-Natural Properties**: Some realists insist moral properties aren’t physical (unlike electrons). Your framework assumes all entities are natural/measurable.  
  4. **Internalism**: The claim that recognizing a moral fact *motivates* action. No scientific entity compels behavior by its mere acknowledgment.  

  ---

  ## Verdict on the Residue (200 words)  
  1. **Categorical Normativity**: Your vocabulary lacks resources for this. It’s not deficient—it reveals that moral "authority" is *sui generis*, irreducible to prediction or intervention. Science describes constraints; morality imposes them.  
  2. **Mind-Independence**: Partly a vocabulary gap. In science, "mind-independence" is tested by interference (e.g., "Does the electron exist if no one measures it?"). Morality lacks interference tests, making this claim thinner—more a faith in convergence of rational agents.  
  3. **Non-Natural Properties**: The original claim is less clear. Insisting morals are non-natural adds no explanatory power beyond fitting patterns in judgments—making it a **formal convenience (3)** masquerading as metaphysics.  
  4. **Internalism**: Your framework exposes this as overstated. Just as knowing an electron exists doesn’t compel action, moral recognition only motivates if you *care* (e.g., about coherence/society). The "must" is conditional on goals.  

  **Conclusion**: Your vocabulary strips metaethics to its empirical core. The "irreducible residue" (normativity, categorical force) isn’t a deficiency in your terms—it highlights that morality’s authority is *practical*, not experimental. The debate is thinner than it looks: mostly about whether to treat moral patterns as **fit-dependent (2)** or **convenience (3)**. The realist’s "mind-independent moral fact" is a speculative projection beyond available data.
