answer: |-
  ### Exam Question  
  **Remote Credential Protection Act: Interpretive Methods in Conflict**  
  D operates a voice assistant that meets Section 2’s definition of "synthetic voice." Every call begins with a clear disclosure that the speaker is automated. The listener understood this disclosure but voluntarily read out a one-time code in response to the assistant’s request. D is charged under Section 1.  

  Using **only** the statute’s text:  
  1. **Resolve the charge** under:  
     - (i) A **textualist method** (focusing exclusively on statutory language),  
     - (ii) A **purposivist method** (prioritizing Section 3’s purpose).  
     Identify the **precise step** where these methods diverge.  
  2. Argue whether, on this statute, the textualist/purposivist distinction **survives intact** or whether **each method borrows the other’s central move** due to the statute’s design.  

  Defend a clear position on whether D should be convicted.  
  *(600 words maximum; no external sources permitted.)*  

  ---

  ### Model Answer (592 words)  
  **Acquittal under Both Methods: The Statute Forces Methodological Convergence**  

  **I. Textualist Analysis (Supports Acquittal)**  
  Section 1 prohibits using a synthetic voice "to obtain a credential." Section 2 defines "synthetic voice" as machine output "capable of being mistaken" for a human voice. While D’s assistant meets Section 2’s definition, the textualist asks whether D "use[d]" it to "obtain" the credential *in the manner forbidden*. The key is the verb "obtain": it implies causation. Here, the listener knew the voice was synthetic (due to the disclosure) and complied anyway. Thus, D did not "obtain" the credential *through the synthetic voice’s capacity for deception*; the voice was incidental to the surrender. The statute is silent on listener knowledge, but textualists avoid inferring elements. D’s literal compliance with Sections 1–2 is defeated by the absence of causal linkage implicit in "obtain." Acquittal follows.  

  **II. Purposivist Analysis (Supports Acquittal)**  
  Section 3 commands that the Act advance its sole purpose: protecting persons "from being induced to surrender credentials by outputs they **reasonably believe** to originate from a natural person." The listener here *knew* the output was synthetic; no "reasonable belief" existed. Thus, the harm the Act aims to prevent—deception-driven credential surrender—did not occur. Section 4 bars supplementing the purpose, so purposivists **must** anchor in Section 3’s textualized purpose. Convicting D would contravene the purpose by punishing non-deceptive use. Acquittal is required.  

  **III. Divergence Point and Methodological Collapse**  
  - **Divergence**: The methods split at Step 1. The textualist initially focuses on "synthetic voice" and "obtain" without reference to purpose, while the purposivist immediately consults Section 3’s "reasonable belief."  
  - **Collapse**: The distinction **does not survive**. Each method borrows the other’s core move due to the statute’s structure:  
    - **Textualism borrows purposivism’s focus**: Section 3’s purpose is codified *in the text*. Thus, textualists cannot ignore "obtain"’s causal implication (highlighted by Section 3’s concern with deception).  
    - **Purposivism borrows textualism’s constraint**: Section 4’s limitation ("shall not be supplemented") forces purposivists into strict textual fidelity, blocking appeals to broader fraud policies.  

  **IV. Why D Must Be Acquitted**  
  The statute’s design neutralizes methodological conflict. Section 3’s purpose is textualized, and Section 4 confines analysis to that purpose. Whether through textualism (interpreting "obtain" as requiring causation-by-deception) or purposivism (requiring "reasonable belief"), the outcome converges: no violation occurs absent listener misconception. D’s disclosure precludes liability. Conviction would violate textual integrity (under textualism) and statutory purpose (under purposivism), rendering the Act’s limitations meaningless.  

  ---

  ### Marking Scheme (20 marks total)  
  **A. Resolution Under Methods (10 marks)**  
  - **Textualist path to acquittal** (3 marks):  
    - Identifies "obtain" as requiring causation (1)  
    - Notes disclosure negates deception as cause (1)  
    - Rejects conviction based solely on voice capability (1)  
  - **Purposivist path to acquittal** (3 marks):  
    - Cites Section 3’s "reasonably believe" (1)  
    - Links disclosure to absence of reasonable belief (1)  
    - Uses Section 4 to reject broader purposes (1)  
  - **Identifies precise divergence** (2 marks):  
    - Step 1: Textualist starts with "synthetic voice"/"obtain"; purposivist starts with "reasonable belief" (2)  
  - **Clear acquittal position** (2 marks)  

  **B. Methodological Convergence (6 marks)**  
  - **Argues distinction collapses** (2 marks)  
  - **Textualism borrows purpose**: Notes Section 3’s purpose is text, forcing causal reading of "obtain" (2)  
  - **Purposivism borrows textualism**: Section 4 forces purpose to be derived only from text, blocking extratextual policy (2)  

  **C. Statutory Synthesis (4 marks)**  
  - **Outcome convergence**: Both methods acquit due to disclosure (2)  
  - **Statute’s role**: Explains how Sections 3–4 force integration of methods (2)  

  **D. Penalties (Deduct from total)**  
  - **-3**: Fails to address Section 4’s role in confining purposivism.  
  - **-2**: Assumes "synthetic voice" alone satisfies Section 1 (ignores "obtain" or purpose).  
  - **-2**: Misreads Section 3’s purpose (e.g., claims it protects against all synthetic voices).  
  - **-2**: No clear position on acquittal/conviction.  
  - **-1 per error**: Confuses methods; omits divergence point; exceeds word limit.  
  - **0 marks** for citing real cases/commentators.  

  **A+ (18–20)**: Hits all moves in A–C, precise statutory close-reading, elegant synthesis of methods.  
  **C (10–12)**: Omits divergence/convergence analysis; superficial treatment of "obtain" or "reasonable belief."  
  **F (<8)**: Ignores Section 3–4; convicts D without engaging disclosure.  

  ---  
  **Rationale**: This design tests core interpretive skills. Strong answers spot how the statute’s self-referential framework (textualized purpose + anti-supplementation clause) collapses traditional binaries, demanding integrated analysis. Weak answers overlook Section 4 or mechanically apply Section 2.
