prompt: |-
  I have a habit of writing down arguments I have witnessed or taken part in, together with my own verdict on whether the parties were genuinely disagreeing or only talking past each other. I would like you to tell me what principle, if any, my verdicts add up to, and where that principle has to break. The list follows; each entry gives the case and then my verdict.

  1. Hot dog. At a picnic, a cousin maintains that a hot dog is a sandwich and a brother maintains that it is not. Verdict: merely verbal. Let them agree on a use of the word and neither has learned anything, and nothing either of them cares about has changed.

  2. Tomato. A botanist tells a cook that a tomato is a fruit; the cook says it is not. Verdict: merely verbal, and both are right in their own vocabulary, the botanist about the botanical category and the cook about the culinary one.

  3. Birds. A museum label says that birds are living dinosaurs; a visitor says that birds are birds and that dinosaurs are extinct. Verdict: substantive. The museum has told us something we discovered about the world, and the visitor is wrong about the world rather than using a word differently.

  4. Pluto. When astronomers voted to stop counting Pluto as a planet, I took the quarrel between those who wanted it kept and those who wanted it demoted to be merely verbal: they knew the same orbits and the same masses, and were deciding how to use a word.

  5. Tables. A philosopher says there are no tables, only particles arranged tablewise; her host says there is a table directly in front of them. Verdict: substantive. I cannot point to any fact about the world that they disagree about, and a stipulation about how to use "exists" would very likely end the argument; nevertheless I cannot bring myself to call this a fight over a word.

  6. Zero. Two mathematicians argue over whether 0 is a natural number. Verdict: merely verbal, and I cannot imagine a clearer case.

  7. Average family. A neighbour and I argue about whether the average family in our town has 2.4 children. Verdict: not a disagreement at all, and not merely verbal either. He is confused about what an average is; there is nothing here for a stipulation to settle.

  8. Money. A friend says that money is a social construction and that therefore a banknote is not real; a banker says that it is real. Verdict: merely verbal.

  9. Octopus. My aunt and uncle argue about whether it is wrong to eat octopus. Verdict: substantive; neither of them would accept that the question had been settled by agreeing on how to use the word "wrong".

  My own rough test has been this: a dispute is merely verbal when a stipulation would end it, that is, when a third party could say, let us use the word this way, and both parties would agree that nothing about the world had been settled, only a vocabulary. If a stipulation would leave one of them feeling that a claim about the world had been waved away, the dispute is substantive. I already know that this test is too crude. It makes the table case verbal, which I will not accept, and the only repairs I can think of make the hot dog case substantive, which is worse.

  Please do the following. First, give me the principle, or the smallest set of candidates, that comes closest to my verdicts; state each clause precisely, and under each clause name the case that forces it. Second, apply the principle to the three cases I have not yet listed, below, and to one further case of your own choosing that you think is the hardest available test of it. Third, tell me which of my verdicts the principle cannot keep, and whether I should abandon the verdict or pay for it with an extra clause. Fourth, return to the case I keep going back and forth on: my colleague says that a language model understands the sentences it produces, and I say that it does not. Some days this seems to me exactly like the hot dog, since we would agree about every fact of the network's weights, training data and behaviour and would differ only over when to apply the word; other days it seems exactly like the birds, where one of us is simply wrong about a real feature of the thing in front of us. Say what your principle implies here, and say honestly whether the answer is stable or whether this is the case that breaks it.

  The three new cases are these. (a) A housing code requires landlords to provide a working kitchen. A tenant says that a microwave, a kettle and a small refrigerator on a counter do not amount to a kitchen; the landlord says that they do. (b) Two doctors argue about whether a patient whose heart has stopped but whose blood is being circulated by a machine is dead. (c) I have kept a sourdough starter alive for eleven years, and not one cell of the original flour and water remains in it. My friend says that it is not the same starter; I say that it is.

  Structure your reply in these sections, in this order and at roughly these lengths: The principle (about 150 words, stated so that it could be applied by someone who had not read my list); The cases behind each clause (about 350 words); Applications (about 350 words, covering the three new cases, your own hardest case, and your verdict on each); What I must give up (about 250 words, naming the verdicts that cannot be kept and saying whether to drop them or to complicate the principle); The language model (about 200 words). If no single principle will do, end with one further section, The smallest set of candidates (about 150 words).
reasoning: |-
  Hmm, the user has presented a fascinating philosophical puzzle about distinguishing verbal disputes from substantive disagreements. They've documented several real-world arguments with their own verdicts and proposed a "stipulation test" that they admit is flawed. The challenge is to systematize their intuitions into a coherent principle that can handle all their cases, including three new ones and the tricky language model debate about AI understanding.

  Looking at their cases, I notice patterns emerging. Cases like hot dog, tomato, Pluto and zero seem clearly verbal - they're about definitions and categories rather than facts. But birds and octopus feel substantive because they involve empirical reality or moral truths. The table case is particularly interesting because it challenges their stipulation test - while it should be verbal by their test, they instinctively feel it's substantive. Their confusion about the language model debate mirrors this tension perfectly.

  I think the key lies in recognizing two distinct types of substantive disputes: those about empirical states (like birds being dinosaurs) and those about conceptual frameworks (like the existence of tables). Their test works well for definitional disputes but breaks down when we encounter ontological or metaphysical disagreements where the vocabulary itself carries conceptual baggage.

  For the new cases: the kitchen dispute is verbal (about definitions in housing codes), the death determination is substantive (about biological reality), and the sourdough starter is substantive too (about persistence conditions). The hardest test case I can add is the abortion debate - is it about definitions of "personhood" or substantive moral truths? This exposes how some disputes resist clean categorization because they mix verbal and substantive elements.

  Their verdict on the table case must be abandoned to maintain consistency - it really is verbal by any principled standard. But I understand why it feels substantive because it challenges our basic assumptions about reality. The average family case isn't even a proper dispute - it's just confusion about statistics.

  For the language model debate, my principle suggests it's substantive - not about definitions but about what constitutes "understanding" as a phenomenon. However, this answer feels unstable because the dispute could easily collapse into definitions, showing how messy these distinctions get at the boundaries. Ultimately, the user might need to accept that some disputes are hybrid cases that resist neat categorization.
answer: |-
  ### The Principle
  Your verdicts follow a **domain-relative truth principle**: A dispute is substantive if it concerns (1) an empirical state of the world, (2) a non-arbitrary conceptual truth (e.g., logic, mathematics), or (3) a normative stance (moral, aesthetic, practical). It is *merely verbal* if it solely concerns the application of a label within an arbitrary or context-bound classification system, where facts within the relevant domain are agreed upon. The dispute is *neither* if it stems from conceptual confusion (e.g., misunderstanding a term’s meaning). "Arbitrary" here means the classification lacks grounding in empirical reality, necessary logic, or irreducibly normative frameworks – it is purely conventional or contextual.

  ---

  ### The Cases Behind Each Clause
  1. **Empirical State Clause** (Forced by *Birds*): Disputes about objective features of reality are substantive. In *Birds*, the museum asserts an empirical fact (evolutionary descent), while the visitor denies it. Stipulating "dinosaur" won’t resolve this – the descent claim remains.  
     - *Counterexample handling*: *Pluto* is verbal because no empirical fact is contested; only the label "planet" applied to agreed orbital/structural data is disputed.

  2. **Non-Arbitrary Conceptual Truth Clause** (Forced by *Zero*): Disputes involving definitions fixed by logical/mathematical necessity are verbal. *Zero* is verbal because "natural number" is a stipulated mathematical convention; no deeper truth is at stake.  
     - *Counterexample handling*: *Average Family* is neither because "2.4 children" is a statistical measure, not a claim about any actual family. The neighbour’s confusion isn’t about labeling but misapprehension of the concept itself.

  3. **Normative Stance Clause** (Forced by *Octopus*): Disputes about irreducible values (e.g., ethics) are substantive. Stipulating "wrong" doesn’t resolve *Octopus*; it bypasses the core moral disagreement.  
     - *Counterexample handling*: *Money* is verbal because "real" vs. "construction" hinges on definitions of "real" applied to agreed social facts (banknotes function as currency).

  4. **Arbitrary Classification Clause** (Forced by *Hot Dog/Tomato*): Disputes about context-dependent labels (culinary vs. biological categories) are verbal. Stipulation resolves them by fixing the domain.  
     - *Counterexample tension*: *Tables* appears to violate this. Your refusal to deem it verbal forces an exception: disputes invoking *ontological frameworks* (e.g., "do composite objects exist?") feel substantive because they challenge fundamental conceptual assumptions, not just labels. This clashes with the stipulation test.

  ---

  ### Applications  
  - **(a) Kitchen (Housing Code)**: **Merely verbal**. Dispute hinges on the arbitrary legal/functional definition of "kitchen." Stipulating the code’s criteria resolves it; no empirical or normative truth is contested.  
  - **(b) Death (Doctors)**: **Substantive**. Concerns an empirical/normative truth: when biological death occurs. Stipulating "dead" won’t resolve it; one doctor believes circulation defines life, the other irreversibility. This reflects deeper facts/values about biology and personhood.  
  - **(c) Sourdough Starter**: **Substantive**. Dispute concerns persistence conditions (a conceptual/ontological truth): is identity defined by material continuity or functional/historical continuity? Stipulating "same" won’t help; it’s a metaphysical disagreement about what "sameness" entails.  
  - **Hardest Test Case: Abortion** – "Is a fetus a person?"  
    - **Verdict**: **Substantive** by the normative clause. "Person" here isn’t arbitrary biology but a morally laden concept. Stipulation (e.g., "call fetuses persons") doesn’t resolve the ethical dispute over rights, merely masks it. Yet it *could* be seen as verbal if "person" is treated as a legal definition. This tension breaks the principle—it cannot categorically rule whether personhood is normative or definitional here.  

  ---

  ### What You Must Give Up  
  - **Abandon the *Tables* verdict** to maintain consistency. It *is* verbal: both parties agree on the physical arrangement ("particles tablewise") and dispute only whether "exists" applies to composites. Stipulating ontological frameworks (e.g., "tables exist in ordinary language but not fundamental ontology") resolves it. Your intuition reflects philosophical weight, not substance under this principle.  
  - **Uphold all other verdicts** by the domain-relative principle. *Average Family* is correctly "neither" (conceptual confusion), while *Birds*, *Octopus*, and *Pluto* align cleanly. No extra clause is needed if you concede *Tables* is verbal.  

  ---

  ### The Language Model  
  **Verdict by Principle**: **Substantive** (invoking the *Normative/Conceptual Clause*). The dispute isn’t about labeling agreed facts (weights, data) but about whether "understanding" *necessarily* implies consciousness, intentionality, or biological cognition—a non-arbitrary conceptual/normative truth. Stipulating "call it understanding" would feel to you like waving away a claim about the nature of cognition.  
  **Stability**: **Unstable**. This *could* collapse into verbalism if "understanding" is defined purely behaviorally (e.g., "outputs coherent responses"). Conversely, if understanding is tied to phenomenology (subjective experience), it becomes irreducibly substantive. The case breaks the principle because it sits precisely at the blurry boundary between stipulative definition ("understanding as functional capacity") and substantive claim ("understanding requires inner life").  

  ---  
  ### The Smallest Set of Candidates (No Single Principle Suffices)  
  Your verdicts require **two distinct principles**:  
  1. **Stipulation-Resolvability**: A dispute is *merely verbal* if stipulating definitions ends it *without either party feeling their core claim was ignored* (covers *Hot Dog*, *Tomato*, *Pluto*, *Zero*, *Money*).  
  2. **Domain-Invariance**: A dispute is *substantive* if its resolution depends on empirical evidence, logical necessity, or irreducibly normative commitments *in any domain* (covers *Birds*, *Octopus*, *Death*, *Sourdough*).  
  *Tables* and *Language Model* expose the tension: the first principle makes them verbal; the second, substantive. *Average Family* falls outside both (conceptual error). This dual framework preserves all verdicts except forcing *Tables* to be verbal.
