prompt: |-
  I've been arguing with a colleague in our reading group for months now about epistemic contextualism versus pragmatic encroachment, and we've gotten nowhere. We both accept the same bank-style cases, we both have the same intuitions about them, and we both agree that whether someone counts as knowing seems to turn on how much is at stake. Where we split is over what that shows: he says the word 'knows' is context-sensitive, so the stakes just fix which standard is in play when we say it, while I say the stakes get into knowledge itself and not just into the word. Every argument I make he seems to have a mirror of, and vice versa, and lately I've started to suspect we're talking past each other rather than disagreeing. So I want a diagnosis, not a winner. Is this a real disagreement about the nature of knowledge, a verbal one about where to draw the semantics/pragmatics line, or two people answering different questions under the one heading 'knowledge' — one about the word and one about the state? Go by what each side actually commits to, and tell me what would count as progress here: a case where the two views really do diverge in their predictions (say, about embedded ascriptions, or about whose stakes matter, the subject's or the attributor's), some formal result, or a reason to think there's nothing to decide and the two are notational variants of each other. Just write it out in continuous prose, no headings or bullet points or bold or tables, the way you'd explain it to me in an email.
