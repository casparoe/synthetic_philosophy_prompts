  First, I need to unpack their main points. They believe math is about real stuff, like the infinitude of primes, which exists independently of human minds. But abstract objects aren't causally active like physical ones, so how do we access them? Their friend is a platonist, advocating for the existence of abstract objects and suggesting we adjust our epistemology. The user counters that relaxing epistemic standards undermines the concept of knowledge itself. They feel this debate is circular and wants to understand if it's one issue or two, and what kind of disagreement it is.

