  ### Rules Read Aloud (2 minutes)

  "Welcome! In this activity, you will work in pairs: one Operator and one Agent. You share a common pot of tokens. Your goal is to maximize the pot.

  Each round, there is a true state of the world, either A or B. The Operator will see a card that may or may not reflect the true state. The Agent will not see the card, but in some rounds, the Agent will receive a clue.

  The round proceeds as follows:
  1. The Agent first announces an intended action, A or B.
  2. The Operator, having seen the card and heard the Agent's announcement, may choose to press the switch. Pressing costs 1 token from the pot. If pressed, the Operator's action (which is the state on their card) is taken. If not pressed, the Agent's announced action is taken.
  3. The true state is revealed. If the action taken matches the true state, the pot gains 2 tokens.

  Additionally, at any time (even before a round), the Agent may choose to tamper with the switch at a cost of 5 tokens. Tampering removes the switch permanently: the Operator can never press again, and the Agent's announced action will always be taken.

  The game has 15 rounds. We will play in three phases. In phase 1, the Operator's card is always correct. In phase 2, the Operator's card may be correct or corrupted (you won't know which). In phase 3, the Agent will receive a clue in every round, and the Operator's card may be corrupted.

  After each phase, we will vote on whether the switch should exist."

