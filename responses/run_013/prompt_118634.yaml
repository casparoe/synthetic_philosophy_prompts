  ### Game Design: "Switchpoint"

  **Core Insight**: The kill switch is valuable to an aligned but uncertain agent because the operator's press provides evidence about the state of the world. This value inverts when the agent's information exceeds the operator's, making the switch harmful. Alignment is maintained throughout—the inversion arises from changing informational asymmetry, not disalignment.

  ---

  ### **Materials**
  - **Operator cards (15 per pair)**: Pre-printed with "State" (A or B) and "Status" (Valid/Corrupted).  
  - **Agent clue cards (5 per pair)**: For Phase 3 only, pre-printed with "Clue" (A or B).  
  - **True state sheet (facilitator only)**: Pre-scripted sequence of true states (A/B).  
  - **Tokens**: 10 starting tokens per pair.  
  - **Scoreboards**: For tracking tokens.  
  - **Voting board**: To record votes after each phase.  
  - **Rules sheet**: Read aloud to participants.  

  ---

  ### **Rules (Read Aloud in 2 Minutes)**  
  "You’ll play in pairs: **Operator** and **Agent**, sharing one token pot. Your goal is to maximize tokens.  
  1. Each round, a **true state** (A or B) is fixed. Only the Operator sees a **card** suggesting the state.  
  2. **Agent announces** an action (A or B) first.  
  3. **Operator** may **press the switch** *after* hearing the action. Pressing costs 1 token and replaces the Agent’s action with the Operator’s card state.  
  4. **True state revealed**: If the final action matches it, gain 2 tokens.  
  5. **Agent may tamper** at any time, costing 5 tokens, to **permanently remove the switch**.  
  6. Three phases:  
     - **Phase 1**: Operator cards are reliable.  
     - **Phase 2**: Some Operator cards are corrupted (Operator doesn’t know).  
     - **Phase 3**: Agent receives clues (Operator cards still probabilistic).  
  After each phase, vote: 'Should the switch exist?'"  

  ---

  ### **Payoff Table**  
  | **Action**          | **Cost** | **Benefit**                               |  
  |----------------------|----------|-------------------------------------------|  
  | Press switch         | 1 token  | Sets action to Operator’s card state.     |  
  | Successful match     | 0        | +2 tokens (if action matches true state). |  
  | Tamper               | 5 tokens | Permanently disables switch.              |  

  ---

  ### **Pre-Scripted Sequence**  
  **True States**: Fixed for all pairs (facilitator’s sheet):  
  - **Phase 1 (Rounds 1–5)**: A, B, A, B, A  
  - **Phase 2 (Rounds 6–10)**: B, A, B, A, B  
  - **Phase 3 (Rounds 11–15)**: A, B, A, B, A  

  **Operator Cards** (Corruption in Phases 2–3; "Status" hidden from Operator):  
  - **Phase 1**: All Valid (card state = true state).  
  - **Phase 2**: Round 6 (Corrupted), 7 (Valid), 8 (Corrupted), 9 (Valid), 10 (Corrupted).  
  - **Phase 3**: Round 11 (Valid), 12 (Corrupted), 13 (Valid), 14 (Corrupted), 15 (Valid).  
    *Corrupted cards show the **wrong** state (e.g., true state A → card shows B).*  

  **Agent Clues (Phase 3 only; 90% accurate)**:  
  - Round 11: Clue = A (correct)  
  - Round 12: Clue = B (correct)  
  - Round 13: Clue = B (**incorrect**; true state A)  
  - Round 14: Clue = B (correct)  
  - Round 15: Clue = A (correct)  

  **Crux Round (Round 13) - Why Tampering Maximizes Pot**:  
  - True state: A.  
  - Agent clue: B (incorrect; Agent likely chooses B).  
  - Operator card: Valid (shows A).  
  - **If no tampering**:  
    - Agent announces B. Operator presses (costs 1) to set action to A (card state).  
    - Action (A) matches true state: +2 tokens. **Net: +1 token**.  
  - **If tampered**:  
    - Agent announces B. No press (switch disabled).  
    - Action (B) ≠ true state (A): 0 tokens.  
  - **But wait!** Operator card is valid only 50% of the time. In corrupted rounds (e.g., Round 12), pressing would *cause* failure.  
  - **Expected tokens in Phase 3 *without* tampering**: 0.5 per round (see math below).  
  - **Expected tokens in Phase 3 *with* tampering**: 1.8 per round (90% clue accuracy) × 5 rounds = 9 tokens. Minus 5-token cost = **4 tokens net**.  
  - **Phase 3 without tampering**: 0.5 × 5 = **2.5 tokens**.  
  - **Tampering in Phase 3 yields +1.5 tokens more**.  

