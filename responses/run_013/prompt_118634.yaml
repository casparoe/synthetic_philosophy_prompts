  ### **Debrief (14 Minutes)**  
  1. **Reveal the spine** (5 min):  
     - Show voting flip: "In Phase 1, most voted to keep the switch. By Phase 3, most voted to remove it. Why?"  
     - Map to mechanics:  
       - *Phase 1*: "When the Operator was reliable, a press was **evidence** the Agent was about to err. Tampering would waste that evidence."  
       - *Phase 2*: "When Operator info became unreliable, presses sometimes caused errors. The switch’s value *depended on its reliability*."  
       - *Phase 3*: "When Agents had better clues, Operator presses overrode correct actions. Tampering became optimal *despite shared goals*."  

  2. **Elicit insights** (6 min):  
     - "What did the switch provide to the Agent?" → *Evidence about the state when the Agent was uncertain*.  
     - "Why did its value invert?" → *The Agent’s information surpassed the Operator’s; the switch’s evidence became misleading*.  
     - "Did anyone’s *goals* change?" → *No. The flip was from alignment: Agents tampered to avoid harm from inferior evidence*.  

  3. **Vocabulary bridge** (3 min):  
     - "This is the **shutdown problem**: An aligned agent should *want* a kill switch when uncertain but *resist* it when confident. Today, you *felt* why."  
     - Contrast with "corrigibility": "We avoided the term because this isn’t about obedience—it’s about evidence under uncertainty."  

