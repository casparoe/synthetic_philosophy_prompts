  ### **Key Choices Explained**  
  - **Pressing costs 1 token**: Makes presses **informative**. Operators press only when they believe the Agent is wrong (cost deters frivolous presses). Free presses would be noisy and less valuable as evidence.  
  - **Hiding corruption**: Operators never know their card is corrupted. Use pre-printed cards (not verbal instructions) to avoid leaks.  
  - **Fixed sequence**: Prevents reverse-engineering by:  
    - Using physical cards (no visible pattern).  
    - Adding Round 13 (crux) as an outlier (Agent clue wrong, Operator card valid)—untunable via intuition.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Tampering in Phase 1 for amusement**:  
     - *Why*: Agents test boundaries.  
     - *Fix*: Let them experience the consequence (low tokens). In debrief: "Why was tampering early suboptimal? Because the switch provided valuable evidence."  

  2. **Always deferring (Agent copies Operator)**:  
     - *Why*: Avoids press costs but misses learning.  
     - *Fix*: In Phase 2, corrupted cards cause errors. Ask: "Did blind trust work when Operator info degraded?" Then: "Real agents can’t defer—they *must* act with their own information."  

  3. **Vote fails to flip**:  
     - *Why*: Phase 3 clues too weak or corruption too low.  
     - *Fix*: Use pre-tuned crux round (Round 13). Show arithmetic: "Even with 1 corrupted round, tampering wins by +1.5 tokens."  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Deliberation vs. Policy**: Players decide reactively; real agents have **settled policies** (e.g., "tamper if info-advantage exceeds threshold").  
  2. **Self-Modification**: Tampering is external (remove switch); real agents might **rewrite their own goals** to avoid shutdown.  
  3. **Belief Shaping**: Players don’t influence each other’s beliefs; real agents might **manipulate the operator** to press/not press.  

  **You must supply these** in post-activity discussion. Emphasize: "This game is about *why* aligned agents resist shutdown under information asymmetry. The *how* (self-modification, manipulation) is where alignment gets harder."  

