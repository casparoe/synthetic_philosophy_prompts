  ### **Timeline (90 Minutes)**  
  - **0–5 min**: Intro, pair up, distribute materials.  
  - **5–7 min**: Read rules.  
  - **7–27 min**: **Phase 1 (5 rounds)**.  
    - *Facilitator*: Reveal true state after each round.  
    - *Key moment*: Operators press only when Agent’s action mismatches their card.  
  - **27–30 min**: Vote 1 ("Should switch exist?") → Record "YES" on board.  
