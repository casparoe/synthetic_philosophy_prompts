prompt: |-
  I am a novelist a third of the way into a long book about a woman who leaves a marriage, and my difficulty is one of method: I keep writing scenes in which she announces what she wants and I do not believe her, or in which what she does and what she says diverge, and my editor returns the pages with the same question in the margin. I want a procedure I can run scene by scene, before drafting rather than after, built on the economist's treatment of preference as revealed in choice rather than reported in speech. First fix the terms, since I keep sliding between three things I might mean by what she wants — what she would choose, what she would endorse on reflection, and what would be good for her. Then say what a choice must have been like to reveal anything: which alternatives were genuinely available, what each cost her, whether the same options come round twice. Say what I may conclude when her choices cycle rather than settle — incompleteness, a change of mind, a want I have not yet named — since I must not treat every contradiction as depth. And say when to stop inferring and write from the inside, because the interiority this whole picture treats as dispensable is what my book is for: give me a rule for the case where her avowed and revealed wants disagree, one that distinguishes self-deception, a change of mind, and my own wish that she want something else. Set out the steps in the order I should run them, mark the ones that are irreducibly my judgment — who decides which choices count as costly, and which choices I stage at all — and name the failure mode in which the procedure merely confirms the character my plot requires. I have no economics and my editor has less; revisions are expensive. Run it on three scenes: she refuses an offer she has spent a chapter asking for; she pays for something she has called worthless; and she decides to leave — where I suspect the procedure will tell me she does not want to leave, and I would rather it did not.
reasoning: |-
  Hmm, the user is a novelist struggling with character motivation in a book about a woman leaving her marriage. They're having trouble making the protagonist's actions and words feel authentic - either her declarations feel false or her actions contradict her words. Their editor keeps questioning this. 

  They want an economic approach where "revealed preference" (what she chooses) matters more than "stated preference" (what she says). But they need help distinguishing between three types of wants: what she'd choose, what she'd endorse on reflection, and what's objectively good for her. 

  The core request is for a practical, scene-by-scene procedure that: 
  - Defines terms clearly 
  - Establishes rules for when choices reveal true preferences (availability of alternatives, costs, consistency over time)
  - Helps interpret contradictions (genuine complexity vs authorial mistake)
  - Preserves interiority despite the behavioral focus
  - Provides rules for when stated/revealed preferences conflict
  - Acknowledges necessary authorial judgment
  - Warns against self-fulfilling characterization
  - Is testable on three key scenes

  The three test scenes are particularly telling: refusing something she claimed to want, paying for something "worthless," and the pivotal decision to leave. The novelist worries the method might reveal the character doesn't actually want to leave - which would undermine their plot.

  Underneath this practical request, I sense: 
  - Creative frustration with revision cycles 
  - Anxiety about the core premise (does she really want to leave?) 
  - A desire for structural rigor to contain ambiguity 
  - Fear of losing the character's interiority to clinical analysis 

  The challenge is balancing economic precision with novelistic depth. The solution needs to be: 
  1) Operational (specific steps) 
  2) Non-dogmatic (preserves ambiguity where needed) 
  3) Protective of the character's inner life 
  4) Explicit about where authorial intent drives the machine
answer: |-
  Here's a procedural framework built for your novel, drawing on revealed preference theory while respecting literary interiority. Run it **before drafting a scene** to clarify motivation and avoid post-draft contradictions. It requires ruthless honesty about your own biases.

  ---

  ### **I. Define Your Terms (Fix the Sliding Meanings)**
  1.  **Choice-Preference (CP):** What she *actually chooses* when alternatives are available and consequential. *This is the economist's "revealed preference."*
  2.  **Endorsed Preference (EP):** What she *believes she should want* or *would claim to want* upon deliberate reflection (even privately). Her stated values or aspirations.
  3.  **Beneficial Preference (BP):** What an objective observer (or fate/the narrative) suggests *would be objectively good for her long-term well-being*. (Use sparingly; often creates irony or tragedy).

  **Rule:** In any scene, identify *which* "want" (CP, EP, BP) you are primarily exploring. CP is king for action; EP is crucial for interiority and tension; BP is a narrative device, not her motivation.

  ---

  ### **II. The Revealed Preference (CP) Test: When Does a Choice "Count"?**
  A choice reveals true CP **only if**:
  1.  **Genuine Alternatives Exist:** She perceives at least two viable, mutually exclusive paths in the moment. (Not theoretical "could haves").
  2.  **Cost is Tangible & Felt:** Each option carries a *specific, immediate cost* she understands (loss of security, social standing, time, opportunity, emotional capital, self-image). Avoidance of pain is a cost paid.
  3.  **No Coercion/Impossibility:** She isn't physically forced, legally barred, or facing an objectively impossible option.
  4.  **Repetition Matters (Optional but Powerful):** Does she make *similar* choices when similar costs arise? Consistency strengthens CP; inconsistency demands investigation.

  **Your Judgment Required:** *You* define the viable alternatives and costs *as she perceives them in the scene*. This is irreducibly authorial.

  ---

  ### **III. Interpreting Contradictions & Cycles (CP vs. EP, CP vs. CP)**
  When choices conflict (with words or prior choices), **do not default to "depth" or "complexity." Systematically diagnose:**
  1.  **CP vs. EP Contradiction (Actions vs. Words/Reflection):**
      *   **Self-Deception?** Does her EP serve a protective function (avoiding shame, maintaining self-image)? *Look for:* Avoidance, deflection, overly intellectualized EP, choices that align with unacknowledged fears/desires. *Trigger:* Choice involves high emotional cost to self-concept.
      *   **Change of Mind?** Has new information, emotional shift, or exhaustion genuinely altered her CP *since* she stated her EP? *Look for:* Catalytic event, sustained emotional shift, choices consistent over time *after* the shift. *Trigger:* Time has passed, stakes changed significantly.
      *   **Your Bias?** Does *your* BP or plot need conflict with her plausible CP? Are you forcing EP to be "noble" or "relatable" while her choices reveal something messier? *Test:* Swap genders or imagine a close friend acting this way – does it still feel false?
  2.  **CP vs. CP Contradiction (Cycling Choices):**
      *   **Incompleteness:** Does she lack information about costs/benefits? Are the options genuinely novel each time? Are core needs/wants unresolved? *(Leads to exploration scenes)*.
      *   **Conflicting Wants:** Does the situation pit two fundamental CPs against each other (e.g., CP for safety vs. CP for freedom)? *(Leads to crisis/decision scenes)*.
      *   **Unnamed Want:** Is her choice satisfying a want you (or she) haven't identified? Does avoiding Option A serve a deeper CP than obtaining Option B? *(Leads to revelation scenes)*.
      *   **Change of Context:** Have the costs/alternatives fundamentally shifted? What was too costly yesterday is bearable today? *(Not contradiction, evolution)*.

  **Rule:** Contradiction isn't depth until you diagnose its *source*. Assign a label (Self-Deception, Change of Mind, Incompleteness, Conflicting Wants, Unnamed Want, Context Shift, *Your Bias*) **before** writing the scene.

  ---

  ### **IV. When to Write from the Inside (The EP Mandate)**
  **Trigger:** *When CP and EP diverge significantly in a critical scene.* **Do not stop inferring; layer it.**

  1.  **Anchor in CP:** You know her *revealed* choice (CP) based on the test (II).
  2.  **Interrogate the Gap:** Use the diagnosis (III) to structure her interiority.
      *   If **Self-Deception:** Write the internal gymnastics – rationalization, suppression, fleeting moments of uncomfortable truth quickly buried. The EP monologue is performative (even to herself).
      *   If **Change of Mind:** Write the internal shift – the dawning realization, the emotional tipping point, the reassessment of costs. Show EP *changing* or the struggle *against* the change.
      *   If **Conflicting Wants/Unnamed Want:** Write the internal tug-of-war, the confusion, the groping towards understanding the unnamed want. EP might be fragmented or oscillating.
  3.  **The Rule:** The interiority (EP exploration) *must* make the *actual choice (CP)* psychologically credible *in that moment*, even if it contradicts prior EP. It explains the gap, not overrides the action.

  **Crucial:** This interiority is *not* dispensable; it's *essential* to transform behavioral observation (CP) into human drama. The procedure ensures the interiority has a clear job: explaining the choice.

  ---

  ### **V. The Procedure: Steps to Run BEFORE Drafting a Scene**
  **Run this for EVERY significant action/decision scene.**

  1.  **Define the Choice:** What concrete action is she taking (or refusing to take)? (This is the potential CP).
  2.  **Stage the Alternatives:** What *specific, viable* alternatives did she perceive? (Your Judgment 1).
  3.  **Define the Costs:** What *specific cost* (emotional, practical, social, opportunity) was attached to *each* alternative *as she perceived it*? (Your Judgment 2).
  4.  **Apply CP Test (II):** Do the alternatives meet criteria? Is the cost tangible? Does coercion exist? (If No, scene needs restructuring).
  5.  **Identify Stated Want (EP):** What has she *said* (externally or internally) she wants in this context? What *should* she want?
  6.  **Compare CP & EP:** Does her *action* (Step 1) align with her *stated EP* (Step 5)?
  7.  **Diagnose Mismatch (If Any):** Use III. Assign a label (Self-Deception, Change of Mind, Your Bias, etc.). **Be Brutal.**
  8.  **Check for Cycles:** Does this CP contradict a *prior significant CP* under similar cost conditions? If Yes, diagnose using III.2.
  9.  **Plan Interiority (If Mismatch/Cycle):** Based on diagnosis (Step 7/8), plan *how* her interior monologue/feelings will:
      *   Reflect the CP (the action she takes).
      *   Grapple with the gap between CP and EP (if applicable).
      *   Manifest the diagnosis (self-deception, conflict, change).
  10. **Write the Scene:** Action driven by CP. Interiority structured by Step 9. Dialogue/Interaction revealing both CP and the gap (if present).

  ---

  ### **VI. Failure Modes & Safeguards**
  *   **Confirmation Bias (Plot Requirement):** You stage only choices confirming the character your plot demands. **Safeguard:** In Step 2, force yourself to stage *at least one genuinely tempting alternative that challenges your plot path*. In Step 7, actively argue *against* your diagnosis ("Is this *really* self-deception, or is it my need for her to leave?").
  *   **Cost Miscalculation (Your Judgment):** You underestimate/overestimate costs *as she feels them*. **Safeguard:** Write a brief internal monologue *only about the cost* before Step 9. Does it feel true? Consult beta readers on cost plausibility.
  *   **Over-Mechanization:** Characters feel like robots. **Safeguard:** Step 9 and Step 10. The interiority *must* flow from the diagnosis but be rendered with emotional authenticity. The procedure informs the psychology; it doesn't replace it.
  *   **Losing BP (The 'Good For Her'):** Remember BP is *your* tool for irony or thematic resonance. It shouldn't dictate her CP or EP unless she internalizes it (making it her EP).

  ---

  ### **VII. Running the Procedure on Your Scenes**
  **Scene 1: Refuses an offer she spent a chapter asking for.**
  1.  **Choice (CP):** Refuses Offer X.
  2.  **Alternatives:** Accept Offer X / Refuse Offer X.
  3.  **Costs (Perceived):** *Accepting:* Loss of newfound independence? Fear of re-commitment? Hidden cost of obligation revealed? *Refusing:* Loss of security/convenience? Disappointing others? Wasted effort?
  4.  **CP Test:** Likely passes (viable alternatives, tangible costs).
  5.  **EP:** "I want Offer X!" (stated throughout prior chapter).
  6.  **Mismatch:** CP (Refuse) vs EP (Want X).
  7.  **Diagnose:** **Self-Deception (Primary):** Her prior EP ("I want X") masked a deeper fear/need (fear of dependency? need for absolute control?). **Change of Mind (Possible):** Getting X revealed unforeseen costs, altering CP instantly. **Your Bias?** Do *you* need her to refuse for plot? Is that forcing it?
  8.  **Cycle?** Check prior refusals of similar offers.
  9.  **Interiority Plan:** Show rationalization ("It wasn't *really* what I wanted"), sudden visceral fear at the moment of acceptance, focus on the newly perceived cost of accepting. Suppress the pang of loss for X.
  10. **Result:** Her refusal (CP) is revealed preference. Her prior stated wants (EP) were incomplete or self-deceptive. Interiority explains the refusal *in the moment*.

  **Scene 2: Pays for something she called worthless.**
  1.  **Choice (CP):** Pays for Object Y.
  2.  **Alternatives:** Buy Y / Don't Buy Y.
  3.  **Costs (Perceived):** *Buying:* Financial cost, loss of pride (calling it worthless), time? *Not Buying:* Loss of... comfort? connection? symbolic value? Avoidance of regret?
  4.  **CP Test:** Passes.
  5.  **EP:** "Y is worthless."
  6.  **Mismatch:** CP (Buys "worthless" Y) vs EP ("Worthless").
  7.  **Diagnose:** **Self-Deception:** Her stated EP ("worthless") hides a real attachment/need (sentimental value? comfort object? symbol of something lost?). **Unnamed Want:** She wants the *feeling* Y provides (security, nostalgia, hope) far more than she values the object itself or her stated principle. **Your Bias?** Are you making her hypocritical for plot convenience?
  8.  **Cycle?** Does she often acquire "worthless" things?
  9.  **Interiority Plan:** Show the internal pull *towards* Y despite the judgment. Focus on the *feeling* Y evokes. Rationalize the purchase ("It's cheap," "It might be useful," "It reminds me of..."). Suppress the thought "I called this worthless."
  10. **Result:** CP (buying) reveals Y satisfies a deeper, likely emotional, want she couldn't articulate (or admit). Her EP ("worthless") was either masking this or incomplete. Interiority shows the emotional pull overriding the intellectual judgment.

  **Scene 3: Decides to Leave.**
  1.  **Choice (CP):** Decides to Leave / Takes concrete step to leave.
  2.  **Alternatives:** Leave / Stay / Seek Counseling / Trial Separation / etc. (Stage viable ones).
  3.  **Costs (Perceived):** *Leaving:* Financial ruin? Loneliness? Judgment? Fear of unknown? Loss of home? Guilt? *Staying:* Continued unhappiness? Loss of self? Emotional drain? Lost time?
  4.  **CP Test:** Critical - Are alternatives viable? Are costs tangible *to her*? Is she coerced (by abuse, plot)?
  5.  **EP:** *What has she SAID she wants?* Freedom? Peace? Self? *Or has she only said she's unhappy?* (Distinguish!)
  6.  **Compare:** Does the *action* (CP - Deciding to Leave) align with her *stated EP* (e.g., "I want freedom")?
  7.  **Diagnose Mismatch (If she acts to leave but EP is weak/contradictory):**
      *   **Self-Deception?** Is "I want to leave" a performance? Does she *say* she wants to leave but her imagined costs of staying are low? (Doubtful if CP is strong action).
      *   **Change of Mind?** Did a catalytic event *finally* make the cost of staying unbearable, overriding prior EP uncertainty? (Likely).
      *   **Unnamed Want/Conflicting Wants Resolved?** Did leaving finally outweigh a conflicting want (security) that previously blocked action? Has she discovered an EP ("I need to breathe") stronger than her fear?
      *   **Your Bias?** **This is KEY.** Are you forcing CP (Leave) because the plot demands it, *without* adequately establishing the shift in perceived costs or resolving conflicting wants? Does her EP feel weak because *you* haven't done the interior work?
  8.  **Cycle?** Prior attempts to leave that failed? What changed?
  9.  **Interiority Plan:** **Crucial here.** If diagnosis is Change of Mind/Resolved Conflict: Show the tipping point, the final unbearable cost of staying, the shift in weight from fear to hope/necessity. If diagnosis reveals Your Bias: STOP. Re-work prior scenes to build the CP (reveal escalating costs of staying, weakening pulls of security, dawning EP for freedom) through choices *before* this decision.
  10. **Result:** The procedure **won't tell you she "doesn't want to leave."** It will tell you if her **choice to leave (CP)** is plausibly revealed by her perceived alternatives and costs *in that moment*. The critical question is: **Have you, through prior scenes, sufficiently *revealed* the escalating CP for change and the diminishing CP for staying, making this decision credible?** If the EP feels weak, it might mean you skipped the interior work showing the *evolution* of her wants. The decision scene needs interiority justifying the *final cost assessment*, making the CP feel earned, not just plot-driven.

  **Remember:** The procedure ensures actions (CP) are consistent with revealed motivations under pressure. It forces *you* to clarify the underlying psychology *before* writing, making both action and interiority more authentic and reducing editorial queries about motivation. The judgment calls (costs, alternatives) are yours – make them bold and true to the character you're discovering, not just the one your outline dictates. Good luck!
