  First, I need to unpack their examples: the partner in arguments, the friend cooking, the dog trainer. All show surface flexibility with underlying predictability. The key twist is the meta-routine—denying the routine when pointed out, which itself is predictable. 

  The user’s deeper needs seem philosophical. They’re hinting at free will debates and whether complexity equals choice. They want clarity on if this is a unified concept or fragmented observations. Terms like "habit" or "predictable" don’t capture the meta-aspect. 

  I recall related concepts. "Heuristic" comes to mind—mental shortcuts that become rigid. "Procedural memory" explains automated behaviors. But the denial loop is trickier. "Recursive" or "self-replicating pattern" might fit. "Meta-routine" or "self-justifying loop" could be makeshift terms. 

