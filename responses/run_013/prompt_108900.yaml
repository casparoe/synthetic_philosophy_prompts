prompt: |-
  Ok, this is going to sound like a stoner shower thought but I actually want a serious answer. I keep noticing a shape of thing and I dont have a word for it, and I've started to suspect theres a term I'm missing.

  Here's the pattern. Someone seems flexible, spontaneous, creative, whatever you want to call it -- and then you watch closely for a while and it turns out the flexibility is a routine. My partner is like this in arguments: she's the fastest person I know on her feet, but if I actually write down what she says once she's cornered, it's about four moves, and she runs them in roughly the same order. A friend of mine cooks "by feel" and it turns out he always does the same three things to rescue a dish. My dog trainer says she varies her rewards so the dog doesn't get bored -- she varies them between three treats, in a rotation I could have predicted.

  Fine, that's just habits, I know. What I can't name is the next bit. Every time I point this out to one of these people, they say something like "sure, but I can notice that, and once I notice it I'm not stuck in it" -- and that reply is also identical every time, nearly word for word, from all of them, including me. And if you point *that* out, there's a third reply, which is also always the same. It's routines all the way up, and the routines include a routine for denying you're in a routine. That's the thing I want a word for -- not the rigidity, the fact that the escape hatch turns out to be part of the machine.

  So: does this have a name? I'd settle for a name, but what I really want is the boundaries. If there is a term, tell me exactly where it stops fitting my examples -- how is it different from plain habit, from being merely predictable, from someone just having a small repertoire? Does the concept normally include the second-order version, where the escape hatch is itself scripted, or is that a separate idea that I'm welding onto it? And I keep half-feeling that this is the same argument people have about free will -- is a very complicated routine the same as a choice -- but I can't tell if that's a real connection or me pattern-matching on the word "routine."

  Please don't just hand me a fancy word and call it a day. If the honest answer is that I've lumped three unrelated things together, or that rigid-vs-flexible is a bad way to cut this in the first place, say that instead of humoring me.
