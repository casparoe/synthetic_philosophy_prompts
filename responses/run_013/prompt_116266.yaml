  ### Diagnosis of the Two-Envelope Paradox Variants

  The core issue in the paradox is the **improper application of expectation calculations without a well-defined prior probability distribution** for the smaller amount. The principle that resolves all cases is:

  **Principle of Conditional Expectation with a Prior**:  
  The expected value of swapping must be computed by conditioning on the observed amount (if any) and a known prior distribution over the possible smaller amounts. Without a prior, or when the prior is symmetric and uninformative, swapping cannot improve the expected value due to symmetry.

  This principle implies:
  - **With a known prior**: Compute the conditional probability that the observed amount is the smaller or larger envelope, then calculate the expected value of swapping.
  - **Without a prior**: The envelopes are symmetric; swapping is a wash (expected gain = 0).
  - **The friend's argument (Case 3) fails** because it assumes equal probabilities for the other envelope being half or double *without justification from a prior*. This assumption is equivalent to imposing an improper uniform prior on the log scale, which is invalid.

  ### Verdicts on Your Cases
  1. **You see $10, host confirms $5 or $20 equally likely**  
     **Verdict: Swap** (correct).  
     **Why**: The prior is given: the other envelope is equally likely to be $5 or $20. Expectation = \(0.5 \times 5 + 0.5 \times 20) = 12.5 > 10\).

  2. **Don't look, only know one is double the other**  
     **Verdict: Swapping is a wash** (correct).  
     **Why**: No prior and no observation → symmetry prevails. Swapping cannot change the expected value.

  3. **Friend's argument: Expectation = 1.25x always**  
     **Verdict: Flawed** (correct).  
     **Diagnosis**: The step "the other envelope holds 2x or x/2 with equal probability" fails. This assumes equal probabilities without a prior. In reality, the probability depends on the prior distribution of the smaller amount. For example:
     - If the smaller amount is bounded (Case 4), seeing a large x makes it more likely you have the larger envelope.
     - Without a prior (Case 5), probabilities cannot be assigned.

  4. **Smaller amount uniform on {1, 2, ..., 100}, look then decide**  
     **Verdict: Swap if ≤$100, keep if >$100** (correct).  
     **Why**: Prior is known (uniform on 1–100). Conditioning on observed amount x:
     - If x ≤ 100:  
       - Possible scenarios: You hold the smaller (other = 2x) or the larger (other = x/2).  
       - Conditional probability:  
         - If x is odd or x > 50: P(you hold smaller) = 1 (if x odd) or 0.5 (if x even and ≤100).  
         - Expectation of swapping = \( \geq 1.25x > x \) → swap.  
     - If x > 100: You must hold the larger envelope (smaller ≤ 100), so other = x/2 < x → keep.  
     The gain arises because the prior breaks symmetry when conditioning on x. Always-swapping is a wash because it averages over all cases without conditioning.

  5. **See $32, no prior on amounts**  
     **Verdict: Swapping is a wash** (you must abandon the pull of the friend's argument).  
     **Why**: No prior → no basis to assign probabilities to {$16, $64}. Symmetry implies expected gain = 0. The friend's argument fails here (as in Case 3) because it assumes equal probabilities without justification.

  ### Verdicts on New Cases
  - **Case A: Smaller amount uniform on {1, ..., N}, N known**  
    **Verdict**: Swap if amount seen ≤ N, keep if > N.  
    **Why**: Prior is known. Same logic as Case 4. If x ≤ N, expectation of swapping is > x (due to conditioning); if x > N, you hold the larger envelope.

  - **Case B: Smaller amount uniform on {1, ..., N}, N unknown**  
    **Verdict**: Swapping is a wash.  
    **Why**: No prior on N → cannot compute conditional probabilities. Symmetry applies.

  - **Case C: Host offers infinite swaps**  
    **Verdict**: Swap at most once (using the Case 4/Case A rule if prior known), then stop.  
    **Why**: After one swap, re-swapping either reverts to the original amount or follows the same rule, but no additional gain is possible. Without a prior, infinite swaps remain a wash.

  - **Case D: Smaller amount with infinite mean (e.g., f(m) = 1/m² for m ≥ 1)**  
    **Verdict**: Swap if amount seen < 2, else keep.  
    **Why**: Prior is known. For observed x:
    - If 1 ≤ x < 2: You must hold the smaller (since larger would require m < 1). Swap → gain to 2x.
    - If x ≥ 2:  
      P(hold smaller | x) = f(x) / [f(x) + f(x/2)] = (1/x²) / [1/x² + 4/x²] = 1/5.  
      Expectation of swapping = (1/5)(2x) + (4/5)(x/2) = 4x/5 < x → keep.

  ### How the Principle Resolves Conflicts
  - **Case 3 vs. Case 2**: The friend's argument (Case 3) is invalidated by the principle: it ignores the need for a prior to assign probabilities. Case 2 (no prior) is preserved.
  - **Case 5 vs. Case 2**: Case 5 must align with Case 2. Seeing $32 without a prior does not break symmetry. The friend's argument must be abandoned.
  - **Case 4 vs. Case 5**: Case 4 works because the prior allows valid conditioning. Case 5 fails because no prior exists.

  ### Final Summary
  - **Key principle**: Expectation calculations require a known prior distribution. Without it, symmetry dictates indifference.
  - **What to abandon**: The friend's argument in Cases 3 and 5 (it assumes unjustified probabilities).
  - **What to keep**: Your verdicts for Cases 1, 2, and 4 are correct. Case 5 is resolved by symmetry (wash).
  - **Practical advice for students**: Always ask, "What is the prior?" If none exists, symmetry rules. If a prior exists, condition on the observation. This covers all variants.
