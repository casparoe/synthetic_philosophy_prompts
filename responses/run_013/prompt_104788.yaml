  The friend calls Death in Damascus a counterexample that finished off EDT. But that's overstated; EDT still has proponents. The user is also skeptical about it being just Newcomb in a robe. While both involve predictors and correlation, Death in Damascus adds location dependence, making it distinct. The user might sense this difference but can't articulate it.

