  ## The Ghost Seat

  Astrid Finch kept the town’s books. She balanced columns, tracked invoices for gravel and salt, reconciled petty cash down to the penny. Order. Precision. Predictability. Then the lottery drum spun, her name nestled deep in the voter rolls like a forgotten seed, destined only for the *reserve* list behind Martha Ellsworth. And Martha, bless her sturdy heart, dropped dead shoveling snow three weeks later. Now, for eight months, Astrid Finch had been balancing Marrow itself, and the scales felt permanently tipped.

  The fluorescent lights of the Civic Hall basement hummed like trapped insects. Forty chairs – cheap plastic, mismatched – formed a lopsided circle. Astrid’s felt colder than the others. She was Seat 22R. *Reserve*. A ghost occupying Martha Ellsworth’s spectral chair. Tonight’s agenda item loomed: Proposal 17-B, the reopening of the MarChem plant on the north bank.

  Proponents argued jobs, taxes, revitalization. Opponents whispered about the brown sludge still weeping into the riverbank downstream, the lingering coughs in North Marrow. Astrid had pored over reports until the numbers blurred. She knew the plant’s potential profit margin (thin) and the projected cost of a proper remediation (staggering). But the numbers weren’t the weight crushing her lungs. It was the *how*.

  "How can you even vote?" hissed Leo Vance, Seat 15, owner of Vance Hardware and a man whose voice seemed permanently set to 'indignant'. He jabbed a finger not at her argument, but at her badge. "You weren’t *chosen*. Not really. Martha was chosen. You’re… a placeholder. A clerical error with a voting token." His words echoed the whispers she’d heard in line at the grocery store, seen flicker behind eyes when she spoke during deliberations. *Ghost seat. Not legitimate.*

  The Assembly’s facilitator, a weary man named Ben, tried to steer the conversation back to water table contamination. But the seed Leo planted sprouted thorns in Astrid’s mind. Was the magic of this whole mad experiment – this government by random draw – in the *randomness itself*? The pure, beautiful democracy of the dice roll? If so, she was counterfeit. Martha’s number came up, not hers. She was the spare tire, not the car.

  Or was it the *deliberation*? The slow, painful, often tedious process of forty ordinary people wrestling with complex problems, forced to listen? Astrid had listened. She’d read every report, attended every sub-committee. She’d argued passionately for better floodplain mapping just last month. Did that effort confer legitimacy, regardless of how she got here? Yet every time she spoke, she saw Leo’s smirk, felt the phantom presence of Martha Ellsworth, retired schoolteacher, beloved community pillar, whose seat she warmed.

  And the third angle: immunity. No campaign debts, no donors whispering in her ear. Just Astrid Finch, bookkeeper. But being un-bought felt hollow when you felt fundamentally unbought-for. Power she never asked for, power that would evaporate in four months when her term ended and the next lottery spun, power that felt less like authority and more like borrowed responsibility with a time bomb strapped to it. What did it *do* to a person? It made her question every syllable, every vote. It made her feel like an imposter auditing the soul of the town.

  The debate raged around her. Job losses versus poisoned wells. Short-term survival versus long-term health. Astrid felt fractured. The arguments were real, the stakes tangible – she thought of Janine from the bakery, whose husband worked at MarChem, and old Mr. Henderson, whose well had turned brackish last summer. But her own voice felt trapped behind glass. *Ghosts don’t vote. Errors don’t decide.*

  Then, Carl Tamlin, Seat 8, retired pipefitter, stood. He rarely spoke. His voice was gravelly, quiet. "My Pop worked at MarChem," he said. "Died when I was twelve. Lung thing. Doctor never said it was the plant, not officially. But we knew. We all knew." He looked around the circle, his gaze resting briefly, heavily, on Astrid. "This ain't about who got picked first or second. Martha’s gone. Astrid’s here. That’s the roll. This is about whether we’re gonna look our kids in the eye in ten years and say we did right by ‘em, or just what was easy *now*. This seat…” he tapped his own plastic chair, “…it ain’t about *you*. It’s about *us*. All of us stuck with this job."

  Carl sat down. The hum of the fluorescents seemed louder. Astrid looked at her hands, the hands that balanced books, that now held a vote that could alter Marrow’s river, its lungs, its future. Leo Vance started to speak again, but Ben cut him off. "Astrid? You’ve been quiet. Thoughts on Proposal 17-B?"

  All eyes turned to her. The ghost in the chair. The clerical error. The bookkeeper.

  Carl’s words echoed: *It ain’t about you.* The legitimacy wasn’t inherent in the randomness, though that was the spark. It wasn't *just* in the deliberation, though that was the crucible. It wasn't even solely in being unbought, though that was crucial. It was in the *act of participation itself*, the terrifying, messy, unavoidable burden of showing up and *trying*, however you got there. The lottery threw you in the deep end; legitimacy was earned by the stroke you chose to swim with. Being a reserve didn’t make her voice less real; it made her *presence* the ultimate expression of the system’s demand: serve, because you were *called*, however haphazardly.

  Astrid took a breath that felt like her first in eight months. The numbers snapped back into focus – the thin profit, the staggering cleanup cost, the long-term liability. The faces flashed in her mind – Janine’s worry, Mr. Henderson’s frustration, Carl Tamlin’s quiet grief.

  "My name is Astrid Finch," she said, her voice clear, surprising her. "I am Seat 22. Not 22R. Just 22." She locked eyes with Leo Vance, then swept her gaze around the circle. "I didn’t ask for this power. Martha Ellsworth didn’t ask to die. But the question isn’t how I got this chair. The question is, what will we *do* while we’re sitting in it? MarChem’s past is poisoning our present. Its promises for the future are built on sand and shortcuts. The reports are clear. The remediation wasn’t done right. Reopening before it *is* done right isn’t revitalization. It’s slow suicide." She paused. "I vote NO on Proposal 17-B. Shut it down. Finish the cleanup. Then, and only then, let’s talk about what comes next for that land, and for North Marrow."

  Silence. Then Ben called the vote. Hands rose. Astrid kept hers steady. The measure failed. By one vote. Her vote.

  After the gavel fell, Leo Vance stormed out, muttering about ghosts and errors. Others milled about, discussing the implications. Carl Tamlin walked past Astrid’s chair. He didn’t say anything. Just nodded. Once. Firmly.

  Astrid didn't feel like a ghost anymore. She felt raw, exposed, exhausted. The power still wasn't hers to keep. It was a borrowed tool, heavy and awkward. But for the first time, she understood its weight was the point. She hadn't been chosen by fate, not really. But she had *chosen*. She had participated. Deliberated. And that choice, made in the flawed, temporary crucible of this random assembly, *was* the legitimacy. It wasn't bestowed; it was enacted.

  She gathered her papers. Four months left on the term. A year from now, this decision would expire, be debated again by new, random faces. Nothing was final in Marrow anymore. But Astrid Finch, bookkeeper, accidental assembly member, had made a mark. She’d shown up. She’d swum. And she wouldn’t be quitting the pool early.

  ---

  **Author's Note: Liberties Taken with Sortition Theory**

  This story leans into specific interpretations and narrative necessities that deviate from pure sortition theory:

  1.  **The "Reserve" System & Legitimacy Crisis:** While real sortition systems might have alternates, the intense focus on the *reserve* status creating a legitimacy crisis is largely a narrative device. Theorists generally hold that the *lottery itself* confers legitimacy through statistical representation, and an alternate stepping in is simply part of the process, not inherently inferior. The story exaggerates this perceived hierarchy to explore character vulnerability.
  2.  **Term Length & Expiring Decisions:** Typical proposals for sortition bodies (like Citizens' Assemblies) involve terms long enough for meaningful deliberation (months or years) and their recommendations, while not always binding, are usually intended to have lasting impact or be implemented by existing bodies. The one-year expiration on *all* decisions is an extreme invention to heighten the protagonist's sense of impermanence and futility, pushing the "burden of transience" theme. Real systems aim for stability *alongside* citizen input.
  3.  **Focus on Individual Power & Crisis:** Sortition theory emphasizes *collective* wisdom and deliberation. The power is deliberately diffused among many. This story, by necessity of being a short character piece, focuses intensely on the *individual* experience of one member, particularly a reserve, and her internal crisis of legitimacy. This risks underplaying the core theory that legitimacy arises from the *group* being statistically representative, not any single member's path to the seat. Her pivotal vote also leans towards a representative democracy model; pure sortition might strive more for consensus or supermajorities within the assembly.
  4.  **The Nature of the Vote:** The Assembly is voting on a specific, high-stakes policy (plant reopening). Many sortition proposals see such bodies making recommendations on broader constitutional issues, policy directions, or reviewing existing government actions, rather than directly administering day-to-day executive decisions like permitting. This was chosen for clear narrative stakes and character impact.

  The story prioritizes the *human experience* of unexpected, unasked-for power within a sortition framework, particularly the psychological weight for a "substitute," over strict adherence to the mechanics of how sortition is typically proposed to function optimally. It leans on the *potential* for doubt and personal crisis within the system, rather than its idealized functioning.
