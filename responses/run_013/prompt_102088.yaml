  ## Ship of Theseus, Rebuilt in Verse

  Original planks, firm and known.  
  This is the ship that sailed from home.  
  Strong hull against the sea's wild moan.  

  Original timbers, firm and known.  
  This is the ship that sailed from home.  
  Strong hull against the sea's wild moan.  

  Original timbers, weathered and known.  
  This is the ship that sailed from home.  
  Strong hull against the sea's wild moan.  

  Fresh timbers, weathered and known.  
  This is the ship that sailed from home.  
  Strong hull against the sea's wild moan.  

  Fresh boards, weathered and known.  
  This is the ship that sailed from home.  
  Strong hull against the sea's wild moan.  

  Fresh boards, shaped and known.  
  This is the ship that sailed from home.  
  Strong hull against the sea's wild moan.  

  Fresh boards, shaped and held.  
  This is the ship that sailed from home.  
  Strong hull against the sea's wild moan.  

  Fresh boards, shaped and held.  
  This is the ship that sailed from home.  
  New hull against the sea's wild moan.  

  Fresh boards, shaped and held.  
  This is the ship that sailed from home.  
  New shape against the sea's wild moan.  

  Fresh boards, shaped and held.  
  This is the ship that sailed from home.  
  New shape beside the sea's wild moan.  

  **(Look: the old planks piled near the shore...)**  

  Fresh boards, shaped and held.  
  This is the ship that sailed from home.  
  New shape beside that other form.  

  Fresh boards, shaped and held.  
  This is the ship that sailed from home.  
  New shape beside that silent frame.  

  Fresh boards, shaped and held.  
  This is the ship that sailed from home.  
  New shape beside that resurrected frame.  

  Fresh boards, shaped and held.  
  This is the ship that sailed from home.  
  Our shape beside that resurrected frame.  

  **(...rebuilt from planks the sea once claimed.)**  

  Fresh boards, shaped and held.  
  This is the ship that sailed from home.  
  Our journey beside that resurrected frame.  

  ---

  **Prose Note on Philosophical Liberties:**

  The poem adheres to the formal constraint (one word replaced per stanza, identical refrain) and embodies the core paradox: two distinct entities both lay claim to being the original ship via different criteria (continuous existence vs. original matter). It acknowledges the "discarded words" (old planks) reassembled into a second claimant.

  **Settled Ground (Broad Consensus):**
  1.  The Ship of Theseus scenario explores **persistence conditions**: What does it take for an object (like a ship) to remain the *same* object over time, despite change?
  2.  It highlights the difference between **numerical identity** (being the very same individual thing) and **qualitative identity** (being exactly similar or alike in properties).

  **Contested Ground (Genuine Disagreement):**
  1.  **Does the question have a determinate answer?** Realists say yes; anti-realists (e.g., some conventionalists) argue there's no deep fact, only our linguistic or practical decisions.
  2.  **Is identity relative to a sortal?** Is "same ship" a different question with potentially different answers than "same collection of planks" or "same functional vessel"? Sortal-relativists say yes; others seek absolute identity conditions.
  3.  **Can an object survive the complete replacement of its parts?** Endurantists who favor continuity (spatio-temporal or causal) often say yes; mereological essentialists (a thing *is* its parts) say no.
  4.  **Which candidate is the original?** Opinions are sharply divided, often based on answers to points 1-3 above. Common contenders are the continuously existing ship (emphasizing history/function) or the reassembled planks (emphasizing matter).

  **The Poem's Leaning:**
  The poem subtly leans towards the **continuous existence/historical perspective**. The refrain "This is the ship that sailed from home" remains anchored to the *rebuilt* vessel throughout its transformations ("Original" -> "Fresh", "planks" -> "timbers" -> "boards", "Strong hull" -> "New shape" -> "Our journey"). The reassembled frame is described as "silent," "resurrected," and ultimately an external presence ("beside that resurrected frame"). While acknowledging the second claimant's existence and its material claim, the poem associates the *identity* of "the ship that sailed from home" with the entity that maintained a continuous presence and journey ("Our journey"), even as its parts changed. It doesn't dismiss the reassembled ship's claim based on matter ("resurrected frame" is potent), but it implicitly prioritizes historical continuity as the bearer of the original identity. This embodies a specific, contested resolution favoring persistence through change via continuity of existence.
