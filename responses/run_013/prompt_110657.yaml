answer: |-
  The political character of an artifact is determined by its *political inertia*: the persistence of its distributive effects after the originating intentions, laws, and habits vanish, arising from the artifact-plus-practice pair, not the artifact alone. An artifact alone is inert; its political effects emerge only when embedded within specific social practices. Political inertia measures how effectively this pair *actively sustains* distributions of benefits and burdens (e.g., access, power, exclusion) independently of its initial context. This distinguishes it from mere durability. Durability is a *prerequisite* for high inertia but is insufficient; inertia requires the artifact-practice pair to *actively perpetuate* a specific political outcome even as societal norms change.

  The objection that political inertia reduces to durability fails because countless durable artifacts (e.g., a millennia-old stone axe) lack significant *distributive political effects* in contemporary practice. Their persistence doesn't actively reshape social relations or access. Conversely, an artifact can be physically ephemeral but, through entrenched practice, have high inertia if its *logic* is replicated or institutionalized (e.g., a discriminatory algorithm whose code is short-lived but whose outcomes are hard-coded into later systems).

  **Concrete Case: The Birmingham, AL, Steps to Nowhere**
  Consider the infamous concrete steps leading to doors high on the wall of the Birmingham, AL, County Health Department building, constructed in the late 1920s. The **artifact** is the physical structure: steep, narrow steps ending at a blank wall several feet above street level. The **original practice** was segregation: these were the "Colored" entrance, intended to force Black citizens to use an inferior, separate, and humiliating access point while White citizens used a proper ground-level entrance. The **original distributive effect** was the exclusion and subordination of Black citizens accessing public health services.

  *   **High Political Inertia Demonstrated:** Legal segregation ended decades ago. The explicit racist *intent* behind the steps is gone. The *laws* mandating segregation are abolished. The *habit* of directing Black citizens to that entrance ceased. **Yet, the artifact-practice pair persists with distributive effects.** The steps remain physically present and visually jarring. The *contemporary practice* is that they stand as a monument, a reminder, a focal point for discussions and protests about enduring racial injustice. Their mere existence *actively distributes* psychological burden, perpetuates a sense of exclusion and historical trauma within the Black community, and symbolizes the persistence of systemic barriers long after the laws changed. They continue to shape the political landscape of Birmingham, influencing perceptions and discourse about race and equity *today*. This persistence of effect, independent of original intent, demonstrates high political inertia.

  *   **Contrast with Low Political Inertia:** A "Whites Only" sign from the same era, if removed when segregation ended, would have *low* political inertia under this measure. Once the sign was gone and the practice of enforcing its rule ceased, its *specific* distributive effect (directing racial exclusion at that location) largely vanished. The *idea* of segregation persists, but that sign *itself* no longer actively excludes at that site. The steps, however, due to their immutable physical form and the social practice of engaging with them as a symbol, continue to exert an excluding and burdensome force.

  Therefore, the Birmingham steps exemplify high political inertia: the artifact-plus-practice pair (physical steps + practice of interpreting/experiencing them as a symbol of enduring injustice) continues to produce significant distributive effects (psychological burden, symbolic exclusion, shaping discourse) long after the racist intent, laws, and habits that built them disappeared. Their enduring political power stems not just from lasting physically (durability), but from the active, ongoing social practice that imbues them with persistent political force.
