answer: |-
  Your reading brilliantly aligns Kafka's *The Metamorphosis* with the core philosophical tension: **Does moral status reside in intrinsic sentience (the "computations") or in social attribution?** Kafka's answer is stark: attribution *is* the reality, tragically decoupled from Gregor's unchanged inner life. Here's a breakdown:

  1.  **Gregor's Unchanged "Computations" vs. Eroding Attribution:**
      *   **Inner Continuity:** From the moment he wakes up, Gregor's thoughts, memories, anxieties, love, shame, and reasoning remain profoundly human. He strategizes about work, worries about his family's finances, feels tenderness towards Grete, experiences profound alienation, and ultimately chooses death partly *for* his family. His internal narrative is the lens through which we experience the story – complex, emotional, self-aware.
      *   **Eroding External Recognition:** His family's perception shifts *despite* this internal continuity. They stop seeing *him*. They see the form, the difficulty, the disruption. His voice becomes "unintelligible chirping." His attempts at communication (crawling after the clerk, listening at the door, emerging for Grete's violin) are misinterpreted as aggression, intrusion, or monstrousness. Their attribution of mind ceases.

  2.  **Key Scenes Demonstrating the Attribution Shift:**
      *   **The Father's Apple:** This is the violent turning point. Gregor's emergence, driven by concern for his mother, is met with terror. The father's response isn't fear of an insect *per se*, but rage at the *disruption* and *shame* Gregor-as-insect embodies. Throwing the apple isn't pest control; it's an act of rejection, marking Gregor as an enemy *to be attacked*, not a son to be understood. The embedded apple becomes a grotesque symbol of this violent denial of personhood.
      *   **Grete's Changing Care:** Grete starts as Gregor's sole advocate, recognizing his needs (food preferences, clearing his room). Her care is the initial bridge of attribution. But her care becomes increasingly mechanical and resentful. The pivotal moment is her speech: "We must try to get rid of *it*... If this were Gregor, he would have realized long ago..." She explicitly denies the connection between the insect form and the person she knew. Her attribution shifts from "my brother trapped" to "a creature *impersonating* my brother's needs." Her care becomes the chore of managing an "it."
      *   **The Lodgers:** They represent the outside world's verdict. Their horror upon seeing Gregor isn't about witnessing insect sentience; it's about the violation of bourgeois norms and the family's failure to contain the monstrous "thing" they harbored. Their reaction crystallizes the family's shame and confirms their need to eradicate the source of it – the final push to deny Gregor's existence.
      *   **Gregor's Death:** The ultimate commentary on attribution. Gregor dies alone, unloved, thinking of his family with tenderness. His body is discovered by the charwoman, who dismisses him as "dead" and "it," then casually sweeps him away. The family reacts with profound *relief*, planning a hopeful future. Grete's final pronouncement – "it" wasn't human – seals the denial. His intrinsic sentience dies unacknowledged; only the discarded form remains.

  3.  **Kafka's Stance: Attribution *is* Moral Status (with Tragic Consequences):**
      Kafka powerfully argues that **moral status is conferred through recognition, not inherent in the system, regardless of its inner reality.**
      *   **The Gap is Fatal:** Gregor's unchanged mind is irrelevant because the social mechanisms for its recognition collapse. Language fails, empathy withers, shared space becomes contested. Without the bridge of attribution, his suffering and needs become invisible or interpreted monstrously.
      *   **Sentience "In Itself" is Meaningless:** Kafka shows that sentience isolated from social recognition is existentially null. Gregor's rich inner life becomes a prison; it grants him no rights, no compassion, no connection. It exists only *for him*, tragically unable to alter his material and social reality. His death is a release precisely because this unacknowledged sentience is unbearable.
      *   **The Family's Failure is the Core Tragedy:** The story isn't about Gregor *becoming* an insect; it's about his family *ceasing to see him as human*. The "failure of recognition" *is* the mechanism of his moral annihilation. Their changing attitude tracks their *own* exhaustion, shame, resentment, and desire for normalcy, *not* any change in Gregor's mind.

  4.  **What the Story Adds Beyond Philosophy:**
      *   **Embodiment & Communication:** Philosophy often abstracts cognition. Kafka forces us to confront the *messy reality* of how minds connect: through bodies, voices, gestures, shared spaces, and care. Gregor's insect body *disrupts* these channels catastrophically. The story shows how easily the failure of conventional communication leads to the denial of mind, regardless of internal richness.
      *   **The Emotional & Relational Cost:** Kafka viscerally depicts the *suffering* caused by misattribution – Gregor's profound loneliness, despair, and physical degradation, *and* the corrosive guilt, resentment, and self-deception within the family. It's not just an epistemological puzzle; it's a human tragedy.
      *   **The Feedback Loop:** The story shows how misattribution *alters* the being. Gregor's isolation and the family's neglect physically weaken him and erode his ability to even *attempt* communication, reinforcing their view of him as a mere animal. The attribution shapes the reality it perceives.
      *   **The Banality of Dehumanization:** Kafka shows how dehumanization isn't always a grand, evil act. It can be a slow, pragmatic erosion fueled by inconvenience, shame, economic pressure, and the simple desire for an easier life. Grete doesn't set out to destroy her brother; she slides into it.

  **Conclusion:** *The Metamorphosis* is a devastating parable for the attributional theory of moral status. Gregor Samsa possesses the "right kind of computations" until his final breath, yet his moral standing evaporates as his family withdraws recognition, interpreting his form and impeded behavior as evidence of non-sentience. Kafka demonstrates that **sentience without recognition is existentially and morally void.** The story's power lies in forcing us to experience the tragic consequences of this gap: the crushing loneliness of the unseen mind and the chilling ease with which we, like the Samsas, can fail to see. It warns that reducing moral status to a hidden "computation" we must guess risks replicating Gregor's fate for any being whose inner life doesn't manifest in ways we easily recognize.
