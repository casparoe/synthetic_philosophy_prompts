prompt: |-
  I've been reading about the ethics of artificial intelligence and animal minds, and I keep running into the idea that what makes a system morally considerable is not whether it behaves like us but whether it has the right kind of computations going on inside—some specific kind of information processing, whatever that turns out to be. The hard part is that we never see the computations directly; we only see behavior, and we attribute a mind when the behavior fits. I want to use Kafka's The Metamorphosis as a test case. Gregor Samsa wakes up as a giant insect, but his inner life seems to remain human: he still thinks, remembers, worries about his family. His family, however, gradually stops treating him as a person, and by the end they seem to have decided he is not one. Read the story through that problem—how we attribute a mind to someone, and where the boundary of sentience is drawn. Does the family's change in attitude track any real change in Gregor's computations, or is it purely a failure of recognition? Does Kafka suggest that moral status is something we confer through attribution rather than something that is there in the system? Which scenes—the father's apple, Grete's changing care, the lodgers, Gregor's death—best show the shift? And does the story take a side on whether moral status should depend on sentience as it is in itself or on our best guess about it? I'd like a reading that does justice both to the story and to the philosophical problem, and that says what the story adds that the arguments alone don't. No need for citations; I'll look those up myself.
