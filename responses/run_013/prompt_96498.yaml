  Hmm, the user's phrasing suggests they grasp the philosophical stakes but want precision. They mention possible confusions about "moral worth attaching to the act/agent/motive" – good self-awareness. I should address that upfront because it's central. Kant attaches moral worth to the motive behind the act, not the act or outcome. 

  Breaking down Person A's claims: 
  - Their strict "duty as sole motive" view is textually Kantian but arguably too rigid. Kant does say moral worth vanishes if self-interest "influences" the action. 
  - But they overreach by dismissing counterfactuals entirely. Kant uses "would you do it without incentive?" as a thought experiment to test motive purity. Person A is right that dropping counterfactuals risks collapsing the duty/accordance distinction, though.

  Person B's points:
