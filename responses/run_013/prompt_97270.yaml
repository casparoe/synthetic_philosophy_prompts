prompt: |-
  Ok so for our school current affairs magazine I somehow got picked to interview this visiting fellow at a think tank, and his whole thing is that authoritarian governments can be legitimate as long as they deliver prosperity and order -- he always points at China and Singapore. I want the interview to actually push him instead of letting him say "look at the skyline" for the tenth time. Can you write me like nine or ten questions?

  For each of the points below can you also add a follow-up that's ready for the answer he'll most likely give, so I'm not standing there nodding:

  - make him pin down what he means by legitamacy, because I swear he slides between "people think it's legit" and "it really is legit" and those are completely different, and only the second one is even a moral claim. If he goes with the first, give me a follow-up showing that's not enough for what he's trying to argue.
  - how do you actually measure "performance," and who picks the scoreboard? If he says GDP growth or low crime, push on which years he's allowed to pick and whether growth from a really low starting point counts the same as growth from a high one.
  - the counterfactual: would a democracy have done worse? He always just asserts democracy would've been chaos, but South Korea and Taiwan got rich and then democratized, so I want to press that.
  - how does he know people actually agree rather than just not daring to say otherwise? I heard the phrase "preference falsification" somewhere, maybe use that.
  - what happens when the performance stops? If the economy slows or there's an aging crisis, does the legitimacy just evaporate? Is this a fair-weather theory?
  - who pays for the prosperity, because an average can hide alot (migrant workers, minorities, people who got locked up).
  - Singapore is basically one small city, so can you really hold it up as a model for huge messy countries? Make him answer without just saying "context matters."
  - and give me one closing question that flips it on him: ask him to name a case where performance was great but he'd still call the regime illegitimate -- I want to see if performance is really doing the work or if he's sneaking in something else.

  Please make them sound like me asking, not like a textbook. And nothing like "what got you into politics" obviously.
reasoning: |-
  Okay, the user is a student preparing for an interview with a think tank fellow who advocates for authoritarian legitimacy based on performance (citing China/Singapore). They want substantive questions that prevent canned responses, with tactical follow-ups ready for predictable answers. 

  First, let's unpack their core needs: 
  They're clearly frustrated with surface-level "look at the skyline" arguments and want to expose conceptual slippage in the guest's framework. The bullet points reveal sharp critical thinking - they've identified his equivocation on legitimacy (descriptive vs normative), cherry-picked metrics, and ignored counterexamples like South Korea. 

  Notable tensions in their request:
  - Wants academic rigor but "not like a textbook" phrasing
  - Needs to sound conversational while deploying precise concepts like "preference falsification"
  - Must balance challenge with interview etiquette (no "gotcha" tone)

  For the legitimacy question:
  The follow-up must force him off the fence. If he retreats to "people believe it's legitimate," the counter needs to show that reduces his argument to tautology (regimes are legitimate because they... exist?). The moral claim version is what actually matches his rhetoric about performance *justifying* authoritarianism.

  On performance metrics:
  GDP/crime stats are easily manipulated. The follow-up should attack period selection bias - e.g., crediting authoritarianism for China's 2000s boom while ignoring that similar growth occurred under democracies in postwar Japan. Also highlight how "starting point" matters: growing from $500 to $5,000 GDP/capita isn't comparable to maintaining growth at $20k.

  Counterfactual approach:
  South Korea/Taiwan are perfect because they achieved growth *before* democratizing. The trap: if he says "but they weren't democracies during takeoff," note that neither was China - so why assume China couldn't have followed their path? Historical contingency isn't proof of necessity.

  Preference falsification:
  The follow-up needs concrete examples. Polls in authoritarian states show implausibly high approval (e.g., 99%), while anonymized studies reveal dissent. Contrast Singapore's genuine consensus with Vietnam's repressed dissent.

  Closing question strategy:
  If he can't name a high-performing illegitimate regime, it proves "performance" is a smokescreen for his ideological preference. If he names one (e.g., Saudi Arabia), demand why its performance doesn't count - exposing his moving goalposts.

  Structure rhythm:
  Open with definitional clarity (Q1-2), then empirical holes (Q3-5), then hidden costs (Q6-7), finally the trap (Q8). Follow-ups must flow naturally - e.g., "You mentioned GDP, but..." not "As per my next slide..."
answer: |-
  Here are 10 sharp, conversational questions with pre-loaded follow-ups designed to cut through his talking points. I’ve framed them to sound like a curious but skeptical student, not a debate club captain:

  1. **Opener:**  
     "You argue authoritarian systems can be *legitimate* if they deliver prosperity. But I’m stuck on what ‘legitimate’ actually means here. Is it just that most people *think* the government has a right to rule, or is it that it *actually has* a moral right to rule—even if citizens disagree?"  
     *→ If he says "It’s about popular acceptance":*  
     "But if legitimacy is *only* about people believing it’s legitimate, doesn’t that justify *any* regime that brainwashes or terrifies people into silence? Like, by that logic, North Korea could be ‘legitimate’—which feels like it misses your point about *earned* legitimacy through performance."  

  2. **Performance Metrics:**  
     "When you say authoritarian regimes ‘deliver,’ what’s the actual scoreboard? GDP growth? Low crime? And who decides which metrics count?"  
     *→ If he cites GDP/crime stats:*  
     "But isn’t that cherry-picking? China’s GDP exploded starting from extreme poverty—does growth from $500 to $5,000 per person ‘count’ the same as sustaining growth from $10,000 to $20,000? And if a regime jails dissidents to keep crime stats low, does that still count as ‘order’?"  

  3. **The Democracy Counterfactual:**  
     "You often suggest democracy would’ve meant ‘chaos’ in places like China. But South Korea and Taiwan got rich under authoritarian rule *then* democratized without collapsing—in fact, they got richer. Why assume China couldn’t have followed that path?"  
     *→ If he says "China’s scale/complexity made democracy impossible":*  
     "India’s a messy, huge democracy that pulled 400M+ out of poverty. Isn’t the ‘chaos’ argument just an assumption, not evidence?"  

  4. **Silence vs. Consent:**  
     "How do we know people in these systems *genuinely* support the regime, versus just staying quiet because they’re afraid? I read about ‘preference falsification’—where people hide dissent to avoid trouble. Doesn’t that make it hard to measure real legitimacy?"  
     *→ If he points to polls/surveys showing high approval:*  
     "But if criticizing the government risks jail or ‘disappearance,’ can those polls be trusted? When the only choices are ‘strongly approve’ or ‘disappear,’ doesn’t that rig the result?"  

  5. **Fair-Weather Legitimacy?**  
     "What happens when performance slips? China’s growth is slowing, it’s got a demographic crisis—does legitimacy just vanish? And if it does, doesn’t that make legitimacy super fragile—like it only works until it doesn’t?"  
     *→ If he says "They’ll adapt/reform":*  
     "But if legitimacy hinges *only* on delivering results, doesn’t that incentivize regimes to hide problems or double down on repression when things go south—like censoring bad economic news?"  

  6. **Who’s Left Out?**  
     "You talk about ‘prosperity,’ but averages hide a lot. In China, migrant workers can’t access city healthcare, Uyghurs are in camps, and activists vanish. In Singapore, migrant builders live in containers. If prosperity relies on excluding groups or suppressing rights, does that undermine legitimacy?"  
     *→ If he says "Sacrifices are necessary for development":*  
     "But if the system’s legitimacy depends on ignoring the suffering of minorities or the poor, isn’t that saying ‘legitimacy for some, but not all’?"  

  7. **Singapore: Model or Outlier?**  
     "Singapore’s a wealthy city-state with 5M people. Can that really be a blueprint for huge, diverse countries like Brazil or Nigeria? Or is it like comparing a speedboat to an aircraft carrier?"  
     *→ If he says "Context matters, but principles apply":*  
     "But isn’t the ‘principle’ here tiny scale, total control, and no resource constraints? How does that translate to a country with 200M people, separatist movements, and slums?"  

  8. **The Expansion Test:**  
     "If ‘performance = legitimacy’ is such a universal rule, should the UN welcome authoritarian states that deliver growth as human rights leaders? Should Saudi Arabia get a legitimacy pass for high GDP?"  
     *→ If he dodges or defends selective cases:*  
     "See, that sounds like performance alone *isn’t* enough—there’s something else you’re weighing in the background. What is it?"  

  9. **Closing Trap:**  
     "Let’s flip it: Can you name a regime that delivered *great* economic performance, but that you’d still say was *illegitimate*? What would make it illegitimate despite the results?"  
     *→ If he struggles or names one:*  
     "Ah, so even for you, performance isn’t enough—there’s a line where things like repression or corruption override it. Where’s that line for China’s party? When does performance *stop* excusing abuses?"  

  **Why this works:**  
  - **Forces definitions:** No more sliding between "people believe it" and "it’s morally right."  
  - **Challenges cherry-picking:** Calls out selective stats and historical comparisons.  
  - **Traps the counterfactual:** Uses his own examples (SK/Taiwan) against him.  
  - **Exposes hidden costs:** Prosperity for *whom*?  
  - **Ends with his dilemma:** If he can’t name a high-performing but illegitimate regime, his theory collapses. If he does, he admits performance isn’t sufficient.  

  **Pro Tip:** If he filibusters, bounce back with: "I get the theory, but *specifically*..." or "You mentioned [X], but how does that square with [Y contradiction]?"  
  Good luck—you’ve got this! Be politely relentless.
