prompt: |-
  I teach a second-year module — it's the one where we stop digging and start arguing about what the digging means — and I've got 90 minutes, 18 students, four tables, a flat seminar room, no site, no real finds, and one thing I want them to actually feel rather than nod along to: how badly objects underdetermine claims about what people believed. The gap I care about is the one between a static pattern in the ground and a past behaviour, and then the second gap between behaviour and belief. The same pit of forty near-identical clay figurines under a house floor will cheerfully support household cult, ancestor veneration, toys, a rejected batch from a workshop, or something we don't have a word for, and nothing in the figurines themselves picks the winner — whatever you choose is being paid for out of background assumptions and comparisons with living societies. They always agree with me when I say this at the end of a lecture. They don't feel it. I tried a version of it last term with a photo of a real assemblage and it turned into a slide show with me talking. So design me a runnable activity: rules, materials, roles if you need them, timings, a scoring or bidding scheme that doesn't need real money, and a debrief.

  The shape I want is commit, then get the same evidence back as a rival reading that's just as good, then have to price the difference. My instinct is that each team has to write one museum-label sentence, 25 words max, claiming something about a belief or an institution — not just that they ate grain — for an assemblage you invent for me, and then cards get dealt that either save the label or kill it, and they have to revise in front of everyone and say out loud what they gave up to do it. You can restructure that if you've got something better, but I want them to have to be specific and falsifiable before the rug comes out. Somewhere in there I'd like a moment where they notice that calling a find obviously ritual is just the name we give to the residual pile. I'd also like an unprovenanced object in the mix — a bag of finds with no context — because losing context should feel like a physical loss of inferential power and I want them to be able to say exactly what they lost. Invent the site and the finds yourself (fictional is fine, I'll print the cards), and include one object that turns out to be a later intrusion or a fake, because I want them to see that the most confident label in the room is the one most exposed to a single card. Give me the actual text of every card, the label template, the scoring, and a minute-by-minute timeline. And put some of the debrief into why this isn't a licence to say anything goes — what actually does the constraining work when an inference is a good one, formation processes, sampling, what should have survived and didn't, independent lines that have to agree.

  Please be honest about the seams. I want a frank closing paragraph on what this activity can't reproduce — I'm guessing the big one is that in the game there's a designer who knows what really happened, which is exactly what real archaeologists don't get, so the game can teach the shape of the uncertainty but not the vertigo — and on what will predictably go wrong the first time. My guesses: one team writes a vacuous label and defends it, one team goes full hyper-positivist and refuses to infer anything about belief at all, and the intrusion card lands as a gotcha after which the whole room concludes that we can't know anything, which is definately not the lesson. Tell me how to handle each of those. Write it as someone who's run a field school and taught this seminar for years — brainstorm the mechanics first, think carefully about what 18 undergrads will actually do in the room for 90 minutes, and don't lecture me about teh general shape of the discipline, I want the thing I can run on Thursday.
reasoning: |-
  We are going to design an activity called "The Label Game" that simulates the underdetermination of interpretations in archaeology. The core idea is to have teams create specific, falsifiable claims about beliefs or institutions based on an invented assemblage, then challenge those claims with new evidence cards, forcing teams to revise their labels and articulate what they had to give up.

  **Activity Structure Overview:**
  1. **Introduction (10 mins):** Set up the problem, explain the game, and form teams.
  2. **Round 1: Write Initial Label (15 mins):** Teams receive an assemblage card and write a 25-word museum label making a claim about belief/institution.
  3. **Round 2: Evidence Cards & Revision (25 mins):** Teams receive evidence cards that either support or challenge their label. They must revise their label and explain the change.
  4. **Round 3: The Unprovenanced Object & Intrusion (20 mins):** Introduce an unprovenanced object and an intrusion card to disrupt certainty.
  5. **Debrief (20 mins):** Discuss the process, the gaps, and the constraints on inference.

  **Materials:**
  - **Assemblage Cards (one per team):** Descriptions of fictional finds from a site. Each team gets a different assemblage but all are from the same fictional site (to allow for cross-comparison).
  - **Evidence Cards:** A deck of cards that provide new information. Some are "Support" (green border), some "Challenge" (red border), and one "Intrusion" (black border).
  - **Unprovenanced Object Card:** A single object without context.
  - **Label Templates:** Small cards or sheets for writing labels.
  - **Timer**

  **Teams:** 4 teams (4-5 students per team, at 4 tables).

  **Fictional Site and Assemblages:**
  - **Site:** "Tel Al-Hadra" - a multi-period mound in the Levant, with major occupation in the Early Bronze Age (c. 2500 BCE) and some later Roman activity.
  - **Common Context:** All teams are working on material from the same building complex (House A) but from different rooms.

  **Assemblages (one per team):**
  1. **Team 1 (Room 1):** A pit under the floor containing 40 near-identical clay figurines (humanoid, about 10 cm tall, crudely made, no inscriptions). Also found: one broken grinding stone.
  2. **Team 2 (Room 2):** A cluster of 30 small ceramic vessels (each 5-10 cm high, some with traces of charred material inside) arranged in a circle. Nearby: a single clay tablet with undeciphered markings (non-cuneiform).
  3. **Team 3 (Room 3):** A deposit of animal bones (mostly sheep/goat, but including one complete dog skeleton) and two stone axes. The bones show cut marks and evidence of burning.
  4. **Team 4 (Room 4):** A set of 20 spindle whorls and loom weights, and three female figurines (different style from Team 1's, more detailed, with headdresses). Also, a cache of charred grain.

  **Unprovenanced Object (for Round 3):** A bronze pendant in the shape of a crescent moon (no context, found in topsoil).

  **Evidence Cards (each team draws 3 cards in Round 2, then the Intrusion card is introduced in Round 3):**
  - *Support Cards (Green):* Provide information that bolsters common interpretations.
  - *Challenge Cards (Red):* Provide information that complicates or contradicts interpretations.
  - *Intrusion Card (Black):* Reveals that one object in the assemblage is either a later intrusion or a fake.

  *Example Evidence Cards (total 20 cards, but we'll list a subset for each team):*

  **For Team 1 (Figurines):**
  - Support 1: "Chemical analysis of residues on figurines shows traces of olive oil and incense."
  - Support 2: "Ethnographic parallel: In modern village X, similar figurines are used in household ancestor rituals."
  - Challenge 1: "Figurines show wear patterns consistent with handling by children (smooth edges, fingerprints)."
  - Challenge 2: "In Room 1, a child's burial was found adjacent to the pit (age 2-3 years, no grave goods)."
  - Intrusion (for Round 3): "One figurine in the pit was made using a modern molding technique (CT scan reveals air bubbles not found in others)."

  **For Team 2 (Vessels & Tablet):**
  - Support 1: "Residue analysis of vessels indicates opium and other psychoactive compounds."
  - Support 2: "The clay tablet's markings resemble early proto-writing from Site Y, associated with temple offerings."
  - Challenge 1: "Vessels are identical to those found in a nearby pottery workshop waster dump."
  - Challenge 2: "The tablet was found in a layer with Roman-era pottery (radiocarbon date: 150 CE ±50)."
  - Intrusion: "The tablet is a 19th-century forgery (anachronistic clay sourcing)."

  **For Team 3 (Bones & Axes):**
  - Support 1: "Butchery marks on bones match those from known sacrificial feasts at Site Z."
  - Support 2: "Axes show no signs of use-wear and have traces of red ochre (ritual pigment)."
  - Challenge 1: "Dog skeleton has a healed leg fracture, suggesting it was a pet, not food."
  - Challenge 2: "Bones were found mixed with domestic trash (pottery sherds, food remains)."
  - Intrusion: "One axe is made of a stone only available after 1000 BCE (geological sourcing)."

  **For Team 4 (Textiles & Figurines):**
  - Support 1: "Figurines wear headdresses identical to those in contemporary temple statues from Region W."
  - Support 2: "Charred grain is einkorn wheat, a staple crop, found in storage jars elsewhere in House A."
  - Challenge 1: "Spindle whorls are identical to those in children's graves at Site V, interpreted as toys."
  - Challenge 2: "The figurines were found in a layer disturbed by rodent burrows, so association with loom weights is uncertain."
  - Intrusion: "One female figurine has a microchip embedded in it (modern forgery)."

  **Unprovenanced Object Card (for all teams in Round 3):** 
  - "Bronze crescent moon pendant (no context, found in topsoil)."

  **Scoring (Non-Monetary):**
  - Teams start with 10 "Credibility Points".
  - For every revision they make without abandoning their core claim, they lose 1 point (shows flexibility but some cost).
  - If they abandon their claim and write a new one, they lose 3 points (major shift).
  - If they refuse to revise when faced with a challenge that the whole class agrees is fatal, they lose 5 points.
  - Points are for discussion only (no prize) — they track how much their initial interpretation cost them.

  **Minute-by-Minute Timeline:**

  **0-10 mins: Introduction**
  - Explain the goal: To experience how the same evidence can support multiple interpretations and how background assumptions and new evidence change our stories.
  - Form 4 teams (4-5 students each) at tables.
  - Distribute Assemblage Cards (one per team) and Label Templates.
  - Explain: "Write a museum label (max 25 words) that makes a claim about what the people who left this assemblage believed or what institution they had. Be specific and falsifiable. Example: 'These figurines were used in household rituals to honor ancestors.' NOT: 'These objects show daily life.'"

  **10-25 mins: Round 1 (Write Initial Label)**
  - Teams write their labels. Circulate to ensure claims are specific and about belief/institution (not just function). If a team writes a vacuous label, challenge them: "What would disprove this?" If they refuse to infer belief, say: "We have to try — museums do it every day. What’s the most plausible belief story here?"
  - Collect labels and project or read them out (quickly) so everyone hears each claim.

  **25-50 mins: Round 2 (Evidence Cards & Revision)**
  - Shuffle the evidence deck for each team (3 cards per team: 2 Challenge, 1 Support — but don't tell them the ratio). Let each team draw 3 cards.
  - Teams have 10 mins to discuss how the new evidence affects their label and revise it if needed. They must write a revised label (if changed) and note what they gave up (e.g., "We gave up the idea that the figurines were only for children because of the incense residue").
  - Each team presents: (a) original label, (b) new evidence, (c) revised label (or no change), (d) what they gave up. Award point deductions as they present.

  **50-70 mins: Round 3 (Unprovenanced Object & Intrusion)**
  - Introduce the unprovenanced pendant. Say: "This was found at Tel Al-Hadra but with no context. Write one sentence about what it might mean for your interpretation." Teams discuss for 5 mins and share.
  - Then, introduce the Intrusion card for each team (one per team). Say: "This card reveals one object in your assemblage is an intrusion or fake. Revise your label again if needed." Teams have 5 mins to revise.
  - Teams present: How did the unprovenanced object help/hinder? How did the intrusion change things? What did they lose by not having context for the pendant?

  **70-90 mins: Debrief**
  - Key questions:
    - "What was the hardest part of defending your label?"
    - "When you revised, what did you have to give up? Was it a background assumption, an analogy, etc.?"
    - "How did losing context (unprovenanced object) feel? What exactly couldn’t you say?"
    - "Did the intrusion card destroy your interpretation? Why or why not?"
    - "What actually constrains our interpretations? Why isn't 'anything goes'?" (Guide to: formation processes, sampling, independent lines of evidence, parsimony, coherence with other data, ethnographic controls but their limits.)
  - Critical point: The game has a designer who knows the "truth," but in real archaeology, we never have that — so we rely on multiple lines of evidence and explicit testing. The uncertainty isn't a license to give up, but to be explicit about our assumptions and seek evidence that could falsify them.

  **Handling Predictable Problems:**
  1. **Vacuous Label:** If a team writes "These objects show ritual activities," push them in Round 1: "What kind of ritual? What belief does it reflect?" If they resist, use the evidence cards to force specificity (e.g., a challenge card that contradicts "ritual").
  2. **Hyper-Positivism (refusing to infer belief):** In Round 1, say: "Imagine you're a museum curator — visitors want to know what people believed. Give them your best inference, and we'll test it." If they still write "We don't know," let them, but in Round 2, give them a challenge card that forces a choice (e.g., "Is this ritual or domestic? You must pick for the label").
  3. **Intrusion Card as Gotcha:** Preempt this by saying: "One object being fake doesn't mean the whole assemblage is — what else do you have?" In debrief, stress that most inferences are based on multiple objects and context. Ask: "How much did your interpretation change? Was it salvageable?"

  **What the Activity Can't Reproduce:**
  - **The Vertigo of Real Uncertainty:** In the game, there is a "truth" (the designer's backstory). In reality, we never have certainty, and the absence of a resolving authority is profound. The game teaches the structure of underdetermination but not the existential unease of never knowing if you're right.
  - **Complex Formation Processes:** The game simplifies taphonomy, stratigraphy, and sampling bias into cards. Real archaeology requires constant vigilance about how evidence was formed and preserved.
  - **Predictable Glitches:** Teams might argue about card fairness; some may dominate group discussion; the intrusion might feel too dramatic. Mitigate by circulating, enforcing time limits, and in debrief, focusing on the meta-lesson.

  **Final Prep:**
  - Print all cards (assemblage, evidence, intrusion, unprovenanced).
  - Have label templates and pens.
  - Practice timing — it’s tight.

  Run it, then adapt. Good luck!
answer: |-
  Below is a complete, runnable activity designed for your 90-minute seminar. It's built around your core goal: making students **feel** the underdetermination of belief from objects by forcing them to commit to a specific claim, then confront rival interpretations and contextual gaps. I've taught variations of this in field schools and theory seminars—it works because it's structured like a game with tangible stakes (credibility points), but the real win is the visceral "oh" moment when the rug gets pulled.

  The activity is called **"The Tel Al-Hadra Label Game"** (named after a fictional site). It uses your proposed structure but refines it to avoid slide-show pitfalls and ensure active, equitable participation. Crucially, it includes:
  - **Commitment:** Teams write a specific, falsifiable museum label.
  - **Rival readings:** Evidence cards force revision, exposing background assumptions.
  - **Pricing the difference:** Teams lose "credibility points" for revisions, making the cost explicit.
  - **Unprovenanced object:** To simulate the loss of contextual power.
  - **Intrusion/fake:** To explode overconfidence.
  - **Debrief:** Focuses on *why* "anything goes" fails—constraints like formation processes, sampling, and independent lines.

  ---

  ### **Activity Summary**  
  **Objective:** Experience how objects underdetermine beliefs by writing/revising museum labels under evidential constraints.  
  **Teams:** 4 teams (4-5 students each), one per table.  
  **Time:** 90 minutes total.  
  **Materials:**  
  - **Assemblage cards** (one per team, describing finds from the same fictional site).  
  - **Evidence cards** (12 cards total: 3 per team, mix of support/challenge).  
  - **Intrusion cards** (one per team, reveals a fake/intrusion).  
  - **Unprovenanced object card** (one, for all teams).  
  - **Label templates** (small cards for writing labels).  
  - **Credibility point tokens** (use paper clips, stones, or tally marks—no real money).  
  - **Timer.**  

  **Fictional Site:** Tel Al-Hadra, a multi-period mound in the Levant (Early Bronze Age, c. 2500 BCE, with later Roman occupation). All teams work on **House A**, a domestic structure with four rooms.  

  ---

  ### **The Finds & Cards (Invented for You)**  
  *Print these on index cards. Each team gets one assemblage card. Evidence/intrusion cards are shuffled and drawn during play.*  

  #### **Assemblage Cards (One Per Team)**  
  **Team 1 (Room 1: "Figurine Pit"):**  
  *"Pit under floor: 40 near-identical clay figurines (10cm tall, crudely made, no inscriptions). One broken grinding stone beside pit."*  

  **Team 2 (Room 2: "Vessel Circle"):**  
  *"Cluster of 30 small ceramic vessels (5-10cm high, some with charred residue) arranged in a circle. One clay tablet with undeciphered symbols."*  

  **Team 3 (Room 3: "Bone Deposit"):**  
  *"Deposit of animal bones (sheep/goat, cut marks, burned) and two unused stone axes. One complete dog skeleton with healed fracture."*  

  **Team 4 (Room 4: "Textile Workshop"):**  
  *"20 spindle whorls, 5 loom weights, 3 female figurines (detailed, with headdresses). Cache of charred barley grain."*  

  #### **Evidence Cards (Shuffled Deck; Each Team Draws 3)**  
  *Green = Support, Red = Challenge. Include one intrusion card per team (revealed later).*  

  **For Team 1 (Figurines):**  
  - **Support 1 (Green):** "Ethnographic parallel: Similar figurines in modern Village X are used in household ancestor rituals."  
  - **Support 2 (Green):** "Figurines show residue of olive oil and incense (chemical analysis)."  
  - **Challenge 1 (Red):** "Wear patterns on figurines match handling by children (smooth edges, fingerprints)."  
  - **Challenge 2 (Red):** "Pit cut through earlier child burial (age 2-3, no goods). Figurines may be toys deposited later."  
  - **Intrusion (Black, for Round 3):** "One figurine made with modern molding clay (CT scan shows air bubbles not found in others)."  

  **For Team 2 (Vessels):**  
  - **Support 1 (Green):** "Residue analysis: Vessels contained opium and myrrh (psychoactive compounds)."  
  - **Support 2 (Green):** "Tablet symbols match early temple inventories at Site Y."  
  - **Challenge 1 (Red):** "Vessels identical to wasters from nearby pottery workshop (production defects)."  
  - **Challenge 2 (Red):** "Tablet found in soil layer with Roman-era pottery (radiocarbon: 150 CE ±50)."  
  - **Intrusion (Black):** "Tablet is a 19th-century forgery (anachronistic clay sourcing)."  

  **For Team 3 (Bones):**  
  - **Support 1 (Green):** "Butchery marks match sacrificial feasts at Site Z. Axes have ritual ochre pigment."  
  - **Support 2 (Green):** "Dog skeleton posed—snout pointing east (known ritual alignment)."  
  - **Challenge 1 (Red):** "Bones mixed with domestic trash (fish bones, pottery sherds)."  
  - **Challenge 2 (Red):** "Dog’s healed fracture suggests it was a pet, not food/offering."  
  - **Intrusion (Black):** "One axe made of stone only available after 1000 BCE (geological sourcing)."  

  **For Team 4 (Textiles):**  
  - **Support 1 (Green):** "Figurines’ headdresses match priestess statues from Temple W."  
  - **Support 2 (Green):** "Charred grain is einkorn wheat—ritual crop in Region V."  
  - **Challenge 1 (Red):** "Spindle whorls identical to those in children’s graves at Site U (toys)."  
  - **Challenge 2 (Red):** "Figurines found in rodent burrow—association with loom weights uncertain."  
  - **Intrusion (Black):** "One figurine has embedded microchip (modern forgery)."  

  #### **Unprovenanced Object Card (For All Teams)**  
  *"Bronze crescent moon pendant (no context, found in topsoil)."*  

  ---

  ### **Rules & Scoring**  
  - **Credibility Points:** Each team starts with 10 points (use tokens/tally). Points track the "cost" of inference.  
  - **Label Rules:** Must be ≤25 words, claim a **belief or institution** (e.g., "household ancestor cult," not "they ate grain"). Must be falsifiable (e.g., "ritual" is vague; "offering to gods" is specific).  
  - **Scoring Actions:**  
    - **-1 point:** Minor revision (adjust but keep core claim).  
    - **-3 points:** Major revision (abandon core claim for a new one).  
    - **-5 points:** Refusal to revise when evidence is fatal (peer-voted).  
    - **+0 points:** No revision (but must defend why).  
  - **Winning:** No "winner"—low points show costly inferences. Use scores to spark debate.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 mins**  

  #### **0-10 min: Setup (You Talk, 10 mins)**  
  - Frame the problem: *"Objects don’t speak. We force them to. Today, you’ll feel the gap between stuff and story."*  
  - Assign teams (4 tables, 4-5 students).  
  - Give each team:  
    - One **assemblage card**.  
    - One **label template** (index card).  
    - 10 **credibility tokens** (e.g., paper clips).  
  - Explain rules: *"Write a label claiming a belief/institution. Be specific. Then, new evidence will force you to revise—and you’ll pay points for changes."*  

  #### **10-25 min: Round 1 – Commit (15 mins)**  
  - Teams write labels (≤25 words). **Crucial:** Circulate and enforce specificity. Example starters:  
    - *"These figurines were offerings to household gods..."*  
    - *NOT: "Objects show ritual activities."*  
  - **Predictable Problem: Vacuous Label**  
    - If a team writes "ritual," push: *"What kind? Ancestor worship? Sacrifice? Give me something I can test."*  
    - Threat: *"If it’s too vague, I’ll give you a challenge card first."*  
  - At 25 min, collect labels. Read one aloud per team (build suspense).  

  #### **25-40 min: Round 2 – Evidence & Revision (15 mins)**  
  - Shuffle evidence decks (3 cards per team: 2 challenge + 1 support, but don’t reveal ratio). Teams draw 3 cards.  
  - Teams have 8 mins to:  
    - Discuss how evidence affects their label.  
    - Decide: revise or defend?  
    - If revising, write new label and articulate *what they gave up* (e.g., *"We gave up ‘ancestor cult’ because of child-wear evidence"*).  
  - Award point deductions as they revise (-1 or -3).  
  - **Predictable Problem: Hyper-Positivism**  
    - If a team refuses to infer belief (e.g., *"We only say ‘used in household’"*), give a challenge card forcing choice: *"Is this ritual or domestic? You can’t duck—pick one for the label."* If they resist, deduct points later in debrief.  

  #### **40-55 min: Round 3 – Context Lost & Intrusion (15 mins)**  
  - Introduce **unprovenanced object** (crescent pendant). *"This was found at Tel Al-Hadra with no context. How does it affect your interpretation? Discuss for 3 mins."*  
  - Teams share: *"Without context, we couldn’t say X..."* (Highlight inferential loss).  
  - Then, give each team their **intrusion card** (e.g., fake figurine/tablet). *"Revise your label if needed—you have 5 mins."*  
  - Teams present revisions and point losses.  
  - **Predictable Problem: Intrusion = Gotcha**  
    - If teams despair (*"We can’t know anything!"*), ask: *"Did the intrusion kill ALL your evidence? What about the other 39 figurines?"*  

  #### **55-70 min: Team Reports (15 mins)**  
  - Each team has 3 mins to share:  
    1. Original label.  
    2. Evidence cards drawn.  
    3. Revisions made and points lost.  
    4. What they sacrificed (e.g., *"We gave up ‘ritual’ for ‘toys’ because of child burial"*).  
  - Emphasize: *"Notice how ‘ritual’ became a residual category for things we couldn’t explain."*  

  #### **70-90 min: Debrief (20 mins)**  
  **Questions to drive discussion:**  
  1. *"What did you have to give up to ‘save’ your interpretation? Was it a background assumption, analogy, or something else?"*  
  2. *"How did losing context (unprovenanced pendant) limit you? Be specific—e.g., ‘We couldn’t link it to a building.’"*  
  3. *"Did the intrusion card make you give up? Why is real archaeology more resilient?"*  
  4. *"Why is ‘anything goes’ WRONG? What actually constrains us?"*  

  **Key debrief points (hammer these):**  
  - **Constraints on inference:**  
    - Formation processes (e.g., rodent burrows = disturbed context).  
    - Sampling (e.g., we only found one pit—what’s missing?).  
    - Independent lines of evidence (e.g., residue + ethnography + context must cohere).  
    - Burden of proof: The more extraordinary the claim, the stronger the evidence needed.  
  - **Why this isn’t vertigo:** In real archaeology, we build networks of evidence (stratigraphy, chronology, cross-comparisons) to triangulate—but we never "know." We mitigate bias by testing falsifiable claims.  
  - **The ritual residual pile:** *"Calling something ‘ritual’ often means we’ve run out of functional explanations—but that’s lazy. We must ask: What would prove this wasn’t ritual?"*  

  ---

  ### **What This Activity Can’t Reproduce (The Seams)**  
  **The Designer Problem:** I invented Tel Al-Hadra. I know the "truth." In reality, there’s no omniscient arbiter—just evidence and argument. The game teaches the *shape* of uncertainty (e.g., how gaps force revision), but not the *vertigo* of infinite possible stories with no resolution. Use the debrief to stress: Real archaeologists use **inference to the best explanation** (abduction), not proof.  

  **Predictable Glitches & Fixes:**  
  1. **Vacuous label defenders:** Force specificity upfront. If they cling, let them take point hits. In debrief, ask peers: *"Would you trust this label in a museum?"*  
  2. **Hyper-positivists:** Assign them Team 3 (bones). Bones force functional vs. symbolic choices. Push: *"Belief isn’t optional—even ‘secular’ acts encode worldview."*  
  3. **Intrusion despair:** Preempt in setup: *"One fake doesn’t nuke the site—what’s your fallback evidence?"* In debrief, contrast with real cases (e.g., Piltdown Man didn’t collapse archaeology).  

  **Why This Works for 90 Mins:**  
  - **No dead air:** Structured rounds force engagement.  
  - **Tangible stakes:** Points make revision costs visceral.  
  - **Everyone talks:** Small teams ensure participation.  
  - **Print-and-go:** Cards replace slides.  

  **Test Run Tip:** Bring extra evidence cards—if a team finishes early, give them a bonus challenge. On Thursday, start strict on time. You’ll nail it.  

  ---  
  **Final Thought:** This game won’t make them *like* uncertainty, but it’ll make them *respect* it. The debrief is where you harden them against postmodern flippancy—emphasize that constraints like context and taphonomy are archaeology’s immune system against “anything goes.” Run it, then adapt.
