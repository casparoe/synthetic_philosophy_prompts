prompt: |-
  I'm a philosophy professor — ancient philosophy, mostly, so I'm hopelessly out of my depth on anything post-Kant — and for a couple of years now I've been noticing something in my own life that I can't find a name for, and it's driving me a little nuts. Here's the pattern. When my old dissertation advisor was dying — this was right at the end — I promised him I'd finish the commentary we'd started together. Neither of us was ever going to finish it and we both knew that; it was more like a promise to keep the thing alive than a promise to produce it. He died about four months later. The book never happened and never will. And yet I still feel bound by the promise, and here's the part I can't parse: I don't feel bound to write the book. That's off the table and I don't feel guilty about it. What I feel bound by is something vaguer — not pretending it didn't happen. If someone asked me at a conference about that project I'd feel obliged to say "we started it" rather than "I had an idea once." And if I ever did write something in that area I'd feel obliged to put his name on it, even though he contributed maybe a paragraph. So the promise outlived the act it was a promise to perform, and it outlived the person I made it to, and yet it isn't dead — it's just migrated onto some other, fainter thing.

  I've asked around and nothing quite fits. A colleague in ethics said "that's just a prima facie duty that got outweighed," but that can't be it, becuase there's nothing for it to be outweighed by — the book isn't bad to write, it's just impossible, and he's dead, so I can't wrong him by not writing it. Someone else said "moral residue," but residue is supposed to be what you carry for having gone ahead and done the wrong thing anyway, and I didn't do anything wrong. My brother-in-law, who reads a lot of pop psychology, said it's just grief wearing a costume, which is charming but doesn't explain why it shows up in the grammar of obligation — I owe, I'm bound — rather than the grammar of sadness, and I don't think I'm confused about the grammar, because I'd describe a much more mundane case the same way. I promised a friend I'd drive her to the airport; she got a ride from someone else and told me not to bother — fine, released, gone, no residue. But if she'd never said anything and I'd simply decided on my own that she didn't really need me, I'd feel I owed her an explanation even if she never found out and was never inconvenienced by it.

  So what I'm after isn't mainly a label. I want someone to carve this up for me. Is there an established concept for the piece of a promise that survives the impossibility of its object, or the death of the promisee — or, better, the piece that survives as a standing claim on how I may treat the promise rather than on whether I perform it? If there's a name, what is it, and what does it cover that directed obligation, prima facie duty, and moral residue each miss? If there's no name, coin one, define it, and tell me where its edges are: does it attach only to promises to the dead, or to any promise whose object has become impossible, or to any commitment whatsoever once it's been made? And tell me what it is not — I don't want to be told it's just habit, or grief, or the social cost of being seen as unreliable, unless you can also show me why the obligation-grammar is a mistake. Bonus points if you can tell me whether the release asymmetry in the airport case is real or something I've talked myself into.
reasoning: |-
  Okay, let me start by really understanding what this philosophy professor is asking. He's noticing a specific phenomenon in his life related to promises that can't be fulfilled, especially after the promisee has died. He promised his dying advisor to finish a commentary, knowing neither would actually complete it. Now, even though the advisor is gone and the book is impossible, he still feels bound—not to write the book, but to acknowledge the promise in certain ways, like mentioning their collaboration or crediting the advisor in future work.

  The professor has already explored some concepts: prima facie duty (dismissed because there's no conflicting duty outweighing it), moral residue (doesn't fit because he didn't do anything wrong), and grief (doesn't explain the obligation language). He also gives the airport example: if the friend releases him, no obligation, but if he decides on his own not to go without telling her, he feels he owes an explanation. This asymmetry is key.

  So, what's the core issue? The obligation transforms when the original act becomes impossible. It's not about performing the act anymore, but about how he relates to the promise itself. The promise becomes a "standing claim" on his behavior regarding the subject of the promise. He wants to know if there's a concept for this surviving element.

  First, I should consider existing philosophical concepts. Promissory obligation typically involves the promisee's right to performance. But when the promisee dies, that right can't be enforced. Yet the professor feels a duty to honor the advisor's role. Maybe this is about the symbolic value of the promise—keeping the advisor's contribution alive rather than the project itself.

  The airport example shows that the release matters. If the promisee explicitly releases, the obligation dissolves. Without release, even if unnecessary, the promisor feels a duty to explain. That suggests that the obligation persists unless formally waived. So the persistence isn't just about death but about any unwaived promise where the object becomes moot.

  The professor rejects the idea that this is just grief or social pressure. He insists on the grammar of obligation. So I need to find a concept that captures this residual duty that's not about performance but about acknowledgment. Words like "fidelity" come to mind, but need to define it specifically.

  Looking at the history of promises. Scanlon's contractualism emphasizes the reasons we give to others. When the promisee is gone, those reasons might shift to how we represent their role. The duty isn't to perform but to maintain integrity in how we relate to the promise's history.

  The asymmetry in the airport case: it's real because without release, the promisor hasn't been given permission to disregard the promise. Autonomy of the promisee is key. Releasing the promise respects their autonomy, while acting unilaterally violates that principle, hence the need to explain even if unnecessary.

  So, carving out the concept: It's a duty of fidelity to the relational history established by the promise. It survives when performance is impossible but acknowledgment is possible. It's not about guilt but about honoring the bond created. This applies to any promise not formally waived, not just to the dead. The edges: it fades if the promisee explicitly releases, or if acknowledgment becomes impossible/harmful. It's not just habit because it's tied to the moral reason of respecting the other's past expectations.
answer: |-
  What you're describing is both fascinating and philosophically rich—a phenomenon where the *structure* of a promissory obligation persists even after its *content* (the specific performance) becomes impossible or irrelevant. This isn't a failure of moral reasoning on your part; it's a nuanced feature of how promises function as relational commitments. Let me carve this up step by step, drawing on resources both within and beyond standard ethical frameworks.

  ### The Core Phenomenon: A "Duty of Fidelity to the Relational History"
  The surviving obligation isn't about *performance* (writing the book) or even *harm avoidance* (wronging the advisor). Instead, it's a **duty of fidelity to the relational history established by the promise**. When you made the promise, you didn't just commit to an act; you created a shared narrative between you and your advisor—a narrative where he was your collaborator, and the project was "ours." The promise bound you not only to *do* something but to *recognize* this narrative in your future actions. When performance became impossible, the *relational acknowledgment* survived.  

  **What it is:**  
  - **A second-order commitment to the promise's symbolic integrity.** The promise altered how you must publicly or privately relate to the subject matter (the project, the advisor's role). You owe it to the *history of the relationship* to not erase or misrepresent it.  
  - **Triggered by the absence of release.** Your advisor died without releasing you from the promise. In the airport case, your friend's explicit release dissolved the obligation entirely. Without release, the relational narrative remains "open," requiring acknowledgment if the subject arises.  
  - **Scope:** It applies to any promise where:  
    a) The promisee cannot release you (death, incapacity), OR  
    b) The object becomes impossible *without* the promisee's consent.  
    It *does not* apply to promises waived by the promisee, or to trivial commitments lacking relational weight (e.g., "I'll pass the salt").  

  **What it is *not*:**  
  - **Prima facie duty (Ross):** This misdiagnoses the issue. Prima facie duties are *overridden* by stronger duties (e.g., don't lie to save a life). Here, nothing overrides the promise—it *transmutes* because performance is impossible. Your duty isn't outweighed; it’s reconfigured.  
  - **Moral residue (Williams):** Residue arises from *violating* a duty (e.g., breaking a promise). You violated nothing—the promise became unperformable through no fault of yours. Your duty isn't guilt-laden; it's affirmative (acknowledge the history).  
  - **Grief/habit:** Grief may amplify the feeling, but the *grammar of obligation* is primary. You’d feel similarly if a living promisee vanished without releasing you. Habits lack normative force; this feels binding.  
  - **Social expectation:** Even if no one else knows (e.g., privately crediting your advisor in unpublished notes), the obligation persists. It’s about your integrity toward the relationship, not reputation.  

  ### Why Existing Frameworks Miss This
  - **Standard promissory theory (e.g., Scanlon, Shiffrin)** focuses on the promisee's *present interests* or *right to performance*. Death nullifies these, so the obligation "should" vanish. But this ignores how promises *create historical facts* that bind us retroactively. Your duty isn't to your advisor *now*; it's to the *truth of what you jointly were*.  
  - **Kantian/deontic ethics** treats promises as discrete acts of will. Your case shows they’re *relational processes*—the promise persists as a claim on how you narrate the past.  
  - **Virtue ethics** (e.g., fidelity as integrity) gets closer but lacks the specificity you crave.  

  ### A Name: **Promissory Vestige**
  I propose **"promissory vestige"** (from Latin *vestigium*, "trace" or "footprint").  
  - **Definition:** A residual duty to honor the relational history established by a promise, persisting when the primary performance is impossible and the promisee cannot release the promisor. It manifests as an obligation to acknowledge the promise’s existence and the promisee’s role in relevant contexts.  
  - **Edges/Boundaries:**  
    - **Death of promisee:** Paradigmatic case (as with your advisor).  
    - **Impossibility without release:** E.g., promising to help build a house, then the friend moves abroad without revoking the ask—you’d still owe acknowledgment if discussing the project.  
    - **Not universal:** Fades if acknowledgment is impossible (e.g., the subject never arises) or harmful (e.g., crediting an abusive collaborator).  
    - **Distinct from mere sentiment:** It demands *action* (acknowledgment, credit) when contextually appropriate, not just feeling.  

  ### The Airport Asymmetry: Real and Revealing
  Your intuition is correct: the asymmetry is morally significant.  
  - **With release:** Your friend’s waiver nullifies the relational narrative. The promise is retroactively framed as conditional ("I’ll drive you *unless you find another ride*").  
  - **Without release:** Acting unilaterally violates the promisee’s autonomy. By deciding *for them* that the promise is void, you usurp their role in defining the relationship. The "explanation" you owe isn’t about harm—it’s about restoring their agency in the narrative ("I broke our agreement because *I decided* your needs changed"). Even if undiscovered, failing to provide this (e.g., through mental accounting) betrays the fidelity owed to the history you co-created.  

  ### Why This Matters for Philosophy
  You’ve stumbled on a limit case for promise-based obligations: they can generate **diachronic duties to truthfulness** about shared pasts. This extends beyond promises to vows, covenants, or any commitment that shapes relational identity (e.g., "I’ll always be your ally"). The dead can’t claim rights, but they leave fingerprints on our moral landscape. Your duty isn’t to your advisor’s *ghost*—it’s to the fact that *you were once bound to him*.  

  In sum: **Promissory vestige** is the trace obligation to faithfully narrate a promise’s history when performance lapses without release. It’s not in your head—it’s in the fabric of how commitments weave our lives together. If you coin this in a paper, I’d love to read it.
