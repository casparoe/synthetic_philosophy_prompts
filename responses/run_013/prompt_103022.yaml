  First, I need to recall Aquinas's actual writings, especially in the Summa Theologiae, II-II Q.42 on sedition and Q.64 on killing. The user is right that Aquinas doesn't provide a simple checklist. His argument is deeply embedded in discussions about the common good, sedition, and natural law. The key points are that tyranny is a perversion of rulership harming the common good, resistance must avoid greater evil, and only public authority can judge a ruler. Private individuals can't act alone.

  Now, applying this to Charles I. The Parliamentarians argued Charles was a tyrant for violating the ancient constitution, ruling without Parliament, and causing civil war. But Aquinas would question if Parliament had the authority to judge him. The Rump Parliament purged members, so was it a legitimate public authority or a faction? Also, the trial's legality was dubious since the court was created specifically for Charles, lacking established legal precedent.

  The user raises the "worse tyrant" point—Aquinas warns that killing a tyrant might lead to a worse one. Cromwell's rule as Lord Protector was arguably more authoritarian, which fits Aquinas's caution. But this consequentialist angle clashes with natural law's focus on intrinsic morality. Aquinas is torn between the intrinsic evil of sedition and the practical consequences of tyranny.

  Where does Aquinas's framework break? He assumes a clear hierarchy and legitimate authority, which the English Civil War lacked. The concept of divided sovereignty (King vs. Parliament) wasn't in his medieval context. Also, Aquinas doesn't address a legislature becoming sovereign or trying a king. The "worse tyrant" point introduces consequentialism into a natural law argument, creating tension.

  The user doesn't want a verdict but a mapping. So I need to present the application of Aquinas's principles to the case, highlight the ambiguities, and point out where his framework doesn't fit. They're seeking a nuanced understanding, not a simplified answer. Their deeper need might be to grasp how philosophical frameworks interact with messy historical realities and where those frameworks have limitations.
answer: |-
  Here's the mapping of Aquinas's principles against the execution of Charles I, with an honest assessment of where the framework fits, strains, and falls silent. We'll draw primarily from *Summa Theologiae* II-II, Q42 (Sedition), Q64 (Homicide), and his core principles on law and the common good.

  **Core Aquinas Principles on Tyranny & Resistance:**

  1.  **Tyranny Defined:** A ruler who governs *not for the common good* but for *private advantage*, actively *harming the polity* (ST II-II Q42 A2). This isn't just incompetence or unpopularity; it's a perversion of rulership.
  2.  **Sedition's Gravity:** Sedition (rebellion/disturbance of just order) is a *mortal sin* because it destroys the unity essential for the common good (ST II-II Q42 A2). This sets a very high bar.
  3.  **Resistance is NOT Tyrannicide (Primarily):** Aquinas focuses overwhelmingly on *public authority* acting against a tyrant, not private individuals or mobs. His famous passage on killing a tyrant (ST II-II Q64 A3) is an *objection* he *replies to*, not a central thesis. His core argument is:
      *   **Deposing, Not Killing:** The preferred remedy is for a *superior or public authority* to *depose* the tyrant (ST II-II Q42 A2 ad 3).
      *   **Extreme Exception Only:** If *no human authority* exists to depose the tyrant, *and* the tyranny is *intolerable*, *then* it *might* be permissible for a private individual to kill the tyrant *if* it avoids *scandal or worse disorder*. This is presented hesitantly as a last resort, emphasizing the danger and sinfulness of sedition.
  4.  **The "Worse Tyrant" Warning:** A core argument *against* tyrannicide is that the *process itself* often unleashes greater evils – more violence, worse rulers emerging from the chaos (ST II-II Q42 A2 ad 3). This is a consequentialist element within his natural law framework, focusing on outcomes for the common good.
  5.  **Legitimacy of Authority:** Who constitutes the "public authority" capable of judging a king? Aquinas assumes a hierarchical order (Emperor over King, Pope over secular rulers in some matters, legitimate assemblies). The legitimacy hinges on acting *for the common good* according to *established law or natural justice*.

  **Mapping to Charles I's Execution:**

  1.  **Who is the Tyrant? By Aquinas's Standard?**
      *   **The Parliamentarian Case (Charles as Tyrant):**
          *   **Harm to Common Good:** Charles dissolved Parliament for 11 years ("Personal Rule"), imposed unpopular taxes (Ship Money), persecuted religious dissenters, attempted arbitrary arrest of MPs ("Five Members"), and waged war against his own Parliament/people. This arguably fits Aquinas's definition of ruling for private advantage (royal prerogative, personal religious views) causing harm.
          *   **"Waging War on his People":** This directly mirrors Aquinas's concern about a ruler destroying the polity.
      *   **The Royalist/Critique Case (Parliament/Rump as Tyrants/Seditious):**
          *   **Sedition:** The rebellion *itself* was a grave sin against the established order and unity of the realm (Charles was the anointed, lawful king). The trial was seen as a revolutionary act, not a lawful process.
          *   **Harm to Common Good:** The Civil War caused immense suffering and destruction. The Rump's rule after Pride's Purge lacked broad legitimacy and imposed its own harsh measures.
          *   **Private Advantage:** The Rump could be seen as acting for factional (Independents, New Model Army) or personal power, not the *whole* common good of England.
      *   **Aquinas's Ambiguity:** Aquinas provides criteria *for identifying* tyranny, but applying them is inherently political. He offers no neutral arbiter. Both sides could plausibly claim the other was the true tyrant harming the common good. Aquinas *assumes* a clearer hierarchy and legitimacy than existed in 1649 England.

  2.  **Was the Condemning Body "Public Authority"?**
      *   **The Rump's Claim:** It was the remnant of the lawful Parliament of England, acting as the supreme authority representing the people against a king who had broken his coronation oath and the fundamental laws (an "ancient constitution" argument). It established the High Court of Justice as its instrument.
      *   **Aquinas's Problem:**
          *   **Legitimacy Crisis:** The Rump was the result of *Pride's Purge* (Dec 1648), where Colonel Pride forcibly excluded MPs unwilling to try the King. Was this a legitimate "public authority" or simply *the strongest faction*? Aquinas's framework struggles with revolutionary bodies claiming legitimacy *during* the overthrow of the established sovereign.
          *   **"Superior Authority"?** Aquinas expects a *higher* authority (Emperor, Pope) or an established constitutional body *within* the hierarchy to depose a king. The English Parliament was *part* of the constitution *with* the King, not clearly *superior to* the King in the way Aquinas might imagine a Pope or Emperor. Its claim to act *alone* as sovereign was revolutionary. Aquinas likely would have seen the Rump as a *faction*, not the legitimate public authority entitled to judge the King.
          *   **Acting for Common Good?** Even if the Rump *believed* it was, its purge, its narrow base, and the ensuing instability cast doubt on this per Aquinas's emphasis on unity and avoiding greater evil. The trial itself was widely seen as lacking established legal basis.

  3.  **The "Worse Tyrant" Warning: Cromwell & the Commonwealth/Protectorate**
      *   **Aquinas's Point:** Removing a tyrant often leads to worse consequences – more violence, instability, and ultimately a ruler even more oppressive.
      *   **Mapping to History:** This is arguably where Aquinas's warning finds its *strongest* resonance in this case.
          *   The period after Charles's execution saw the unstable Rump Parliament, forcibly dissolved by Cromwell in 1653.
          *   Cromwell's rule as Lord Protector (1653-1658), while complex, involved significant military rule, suppression of dissent (Levellers, Diggers, Royalists), religious intolerance, and failed attempts at constitutional settlement. Many contemporaries, including former Parliamentarians, viewed this as *more* arbitrary and less constrained than Charles's rule.
          *   The eventual collapse into near-chaos after Cromwell's death led to the Restoration of Charles II in 1660.
      *   **Does it "Work"?** Empirically, yes, the aftermath *can* be seen as validating Aquinas's consequentialist warning about unleashing greater disorder and potential for worse tyranny. This doesn't *justify* Charles's actions, but it highlights the risk Aquinas saw in revolutionary overthrow.

  4.  **Where Aquinas Breaks Down (or Says Nothing):**
      *   **Sovereign King Tried by Subjects:** Aquinas's medieval framework assumes a king is subject to higher authorities (Emperor, Pope) or perhaps a legitimate *representative* body *within* a feudal/constitutional structure. The *trial and execution of an anointed sovereign by a revolutionary tribunal* claiming *sovereign authority itself* is outside his conceptual box. He has no clear category for this.
      *   **Legislature Becoming Sovereign:** The idea of Parliament shedding its role as the King's council/estate and becoming the *sole* sovereign power fundamentally challenges Aquinas's hierarchical worldview. He doesn't address the legitimacy of such a transformation, especially one achieved by force and purge.
      *   **The "Worse Tyrant" Clause - Consequentialism vs. Natural Law:** This is a deep tension within Aquinas himself. Natural law focuses on the *intrinsic* moral quality of acts (sedition is intrinsically evil). The "worse tyrant" argument is *consequentialist* – judging the act by its outcomes. In the Charles I case:
          *   **Natural Law Focus:** Killing a lawful king is intrinsically an act of sedition/homicide. The Rump's authority was illegitimate. Therefore, the act was intrinsically wrong, regardless of Charles's faults or Cromwell's later rule.
          *   **Consequentialist Focus:** Charles's tyranny was intolerable and harming the common good. While risky, removing him was necessary and *could* be justified *if* a better order emerged (which, arguably, it didn't, thus *failing* the consequentialist test). Aquinas *allows* consequences to weigh heavily in the extreme exception, but it sits uneasily beside the absolute prohibition of sedition.
      *   **Revolutionary Situations & Legitimacy Transitions:** Aquinas provides principles for identifying tyranny and *ideal* remedies (deposition by higher authority). He offers little guidance for when *no* recognized higher authority exists and revolution creates *new* claimants to legitimacy amidst chaos. The English Civil War was precisely this scenario.
      *   **Concept of Popular Sovereignty:** Aquinas's "common good" is paramount, but it's mediated through established hierarchies and authorities. The Parliamentarian appeal to popular sovereignty ("trust broken with the people") or the ancient constitution as superior to the King is a nascent concept Aquinas doesn't directly engage with.

  **Conclusion of the Mapping:**

  Aquinas provides **principles, not a checklist.** Applying them to 1649 reveals profound ambiguities:

  1.  **Tyrant Identification:** Both Charles (for harming the common good through personal rule and war) and the Rump (for seditious overthrow and factional rule) could be argued to fit the definition, depending on perspective. Aquinas offers no resolution.
  2.  **Legitimate Authority:** Aquinas's framework strongly suggests the Rump was *not* the legitimate "public authority" entitled to depose, let alone execute, the King. It looked far more like the dangerous faction or seditious mob he feared.
  3.  **"Worse Tyrant" Warning:** Cromwell's Protectorate powerfully illustrates Aquinas's consequentialist fear, lending weight to his argument *against* revolutionary tyrannicide in this specific case.
  4.  **Framework Breakdowns:** Aquinas is silent or inadequate on:
      *   Revolutionary tribunals judging sovereigns.
      *   Legislatures claiming sovereign authority.
      *   Resolving legitimacy crises where *no* clear higher authority exists.
      *   Fully reconciling the absolute sin of sedition with the consequentialist "worse tyrant" argument within natural law. The English Civil War exposed this tension starkly.

  The execution of Charles I exists in a space Aquinas didn't fully anticipate: a revolutionary moment where established hierarchies collapsed, new claims to sovereignty emerged violently, and the very definition of "public authority" was contested ground. His principles illuminate the *gravity* of the act and the *dangers* involved, but they cannot provide a clear, unambiguous verdict precisely because the situation defied the hierarchical, ordered world his natural law framework presupposed. His warnings about sedition and worse tyranny resonate powerfully with the historical outcome, while his insistence on legitimate authority condemns the revolutionary process itself.
