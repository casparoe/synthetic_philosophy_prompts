  We are writing a research proposal for a six-month project. The student is a second-year PhD in philosophy of science. The project concerns the nonnegativity of the expected value of information (EVI) and the conditions under which it might fail due to the agent's inability to ignore information.

  The student has identified an ambiguity in the standard argument: 
  1. The agent can choose an action equivalent to the one they would have taken without the information (act-set availability).
  2. The agent can choose to exclude the information from the body of evidence (evidential exclusion).

  The main question: Under what conditions is the EVI nonnegative? And what happens when the agent cannot commit to ignoring the information?

  The proposal must include:
  - A precise research question with a determinate answer.
  - Explanation of why standard formulations leave the question open (conceptual gap).
  - Method: constructing small formal models and carefully chosen cases.
  - Success criteria and failure criteria.
  - Scope: narrow and doable in six months.
  - Honesty about the possibility that the puzzle is an artifact of mis-specification.

  Also, address: Does the distinction between ignorable and non-ignorable information map to something independent, or does it collapse into act-set availability?

  Structure the proposal as:

  1. Title
  2. Research Question and Background
  3. Conceptual Gap in Standard Formulations
  4. Method: Formal Models and Cases
  5. Success and Failure Criteria
  6. Scope and Feasibility
  7. Distinguishing Genuine Counterexamples from Mis-specification

  Tone: serious prospectus.

  Let's outline:

  Title: The Nonnegativity of the Expected Value of Information: When Can an Agent Ignore?

  1. Research Question and Background:
     - State the standard result (Good's theorem) and the intuition that free information cannot be harmful because it can be ignored.
     - The ambiguity: two ways to interpret "ignore": (a) choosing an act that is equivalent to the one without the information (if such an act exists), and (b) excluding the information from the evidential base (if that is permissible).
     - Precise question: Under what conditions (on the decision problem, the agent's evidential norms, and the available acts) is the EVI nonnegative? Specifically, when the agent cannot commit to ignoring the information (because it's already evidence, or because of norms, or because ignoring is costly), does the nonnegativity result hold? And does the distinction between ignorable and non-ignorable information reduce to the availability of an act that mimics the uninformed choice?

  2. Conceptual Gap:
     - Standard formulations assume that the act-set is sufficiently rich (so that the agent can choose the same act as before) and that there are no constraints on using the information. They do not consider cases where the information becomes part of the evidence and the agent is bound by evidential norms (like the principle of total evidence) to use it. Also, they do not account for the cost of ignoring (if any) or the possibility that the act of ignoring is not available.

  3. Method:
     - Construct simple decision-theoretic models (using small state and act spaces) where:
          a) The agent can choose to ignore information by having an act that is equivalent to the one without the information (so nonnegativity holds).
          b) The agent cannot choose such an act (nonnegativity fails).
          c) The agent is normatively required to use the information (so they cannot exclude it from evidence) and the act-set does not have an equivalent act, leading to potential harm.
     - Also, consider cases where the act of ignoring is costly (e.g., requires effort) and model that cost.
     - Use these models to compute EVI and see when it becomes negative.

  4. Success and Failure:
     - Success: A clear set of conditions (on the decision problem, the evidential norms, and the act-set) that are necessary and sufficient for nonnegativity to hold. Also, an analysis of whether the distinction between ignorable and non-ignorable information is independent or collapses into act-set availability.
     - Failure: If the models become intractable or if the distinction collapses in every case to act-set availability (so the evidential aspect adds nothing). Also, if the project reveals that the puzzle is always due to mis-specification.

  5. Scope and Feasibility:
     - Focus on a small set of decision problems: e.g., binary state, binary act, and a binary signal. Then extend to one or two more complex cases. Avoid grand theory; aim for a few illuminating cases.
     - Six months: First two months: formal setup and literature (though citations not included). Next three months: build models and analyze. Last month: write up.

  6. Distinguishing Counterexamples from Mis-specification:
     - A genuine counterexample would be a decision problem that is correctly specified (with the act-set, states, and utilities clearly defined) and where the agent is subject to evidential norms that require using the information, and the EVI is negative. We must show that in such a case, the standard theorem does not apply because the agent's available strategies are restricted by the norms (so the act-set is effectively reduced). 
     - Alternatively, if we can show that the evidential norms themselves can be incorporated into the decision problem (by expanding the act-set to include "ignoring" acts, possibly with costs) and then nonnegativity is restored, then the original problem was mis-specified by not including those acts.

  Now, write the proposal accordingly.
answer: |-
  ### Research Proposal: The Nonnegativity of the Expected Value of Information: When Can an Agent Ignore?  

  **1. Research Question and Background**  
  The expected value of information (EVI) is a cornerstone of decision theory, formalized by I. J. Good and others, which states that for a rational agent, acquiring free information has nonnegative expected value because the agent can always ignore it. This result underpins norms like the principle of total evidence. However, this project challenges the unqualified generality of this claim by identifying an ambiguity in the concept of "ignoring" information. Specifically, "ignoring" may refer to:  
  - **(Act-based ignoring)**: Choosing an action equivalent to the one the agent would have taken without the information, assuming such an action exists.  
  - **(Evidential ignoring)**: Excluding the information from the body of evidence used for deliberation, as permitted by the agent's epistemic norms.  

  The standard EVI theorem assumes that at least one form of ignoring is always costlessly available. Yet, in practice, agents may face constraints: information may become inescapable evidence (e.g., through observation), evidential norms (e.g., total evidence requirements) may prohibit exclusion, or the act of ignoring may incur costs (e.g., cognitive effort). This raises a precise research question:  

  *Under what conditions is the EVI nonnegative when the agent cannot commit to ignoring information—due to evidential norms, the intrinsic cost of ignoring, or the lack of an equivalent act—and does the distinction between ignorable and non-ignorable information reduce to constraints on the available act-set?*  

  The project will produce a determinate answer by identifying necessary and sufficient conditions for nonnegativity in a class of decision problems where ignoring is infeasible. Success hinges on whether evidential constraints introduce irreducible limitations beyond act-set restrictions.  

  **2. Conceptual Gap in Standard Formulations**  
  Standard EVI theorems (e.g., Good’s) leave the question open by implicitly assuming that the agent’s act-set includes actions that replicate uninformed choices and that no external constraints prevent "free" ignoring. The theorem considers a decision problem \(\langle S, A, U, P \rangle\), where \(S\) is a state space, \(A\) an act-set, \(U\) a utility function, and \(P\) a prior probability distribution. Upon receiving information \(E\), the agent updates to \(P(\cdot|E)\) and chooses an act maximizing expected utility. The nonnegativity of EVI follows because the agent can always select the act they would have chosen without \(E\), ensuring that acquiring \(E\) does not worsen outcomes.  

  The gap arises in three ways:  
  - **Act-set limitations**: If no act in \(A\) replicates the uninformed optimal act (e.g., due to discontinuities or context-dependent acts), ignoring via action equivalence is impossible.  
  - **Evidential norms**: If norms require the agent to treat \(E\) as evidence (e.g., Bayesian conditionalization or total evidence), excluding \(E\) from deliberation is impermissible, making evidential ignoring a violation.  
  - **Costs of ignoring**: If ignoring requires a distinct, costly act (e.g., effortful suppression), the "free" in "free information" is violated.  

  Standard formulations treat the act-set and evidential norms as separable, but when norms constrain how evidence informs acts, the agent’s effective strategy space may shrink. The theorem’s assumption that the pre-information act remains available becomes suspect, creating a conceptual gap for cases where ignoring is normatively or practically excluded.  

  **3. Method: Formal Models and Cases**  
  The project will construct minimal formal models to isolate conditions where nonnegativity holds or fails, using three families of decision problems. Each model will specify states, acts, utilities, information, and (where relevant) evidential norms or ignoring costs. EVI will be computed as the difference in expected utility between acquiring and not acquiring information.  

  - **Model 1 (Act-set failure)**: A binary-state, binary-act problem where the optimal uninformed act is unavailable post-information.  
    - *States*: \(s_1, s_2\); *Acts*: \(a_1, a_2\) pre-information, but post-information, \(a_1\) is replaced by \(a_1'\), which has lower utility in \(s_1\).  
    - *Question*: If information makes \(a_1\) infeasible, can EVI be negative?  
  - **Model 2 (Evidential norms)**: A problem where norms force the agent to use \(E\).  
    - *States/Acts*: As above, but with an added "ignoring" act \(a_{\text{ignore}}\) that replicates the uninformed act but violates a total evidence norm, incurring a utility penalty (e.g., guilt).  
    - *Question*: Does the penalty or the norm render EVI negative?  
  - **Model 3 (Costly ignoring)**: Information acquisition triggers a cost if ignored.  
    - *Setup*: Receiving \(E\) forces a cost \(c > 0\) unless the agent pays a fee to ignore it, reducing utility.  
    - *Question*: When does \(c\) outweigh the benefits of information?  

  Cases will be kept small (e.g., binary variables) for tractability. Successive iterations will introduce complexity (e.g., sequential decisions) if time permits. Crucially, cases will test whether evidential constraints collapse into act-set restrictions: if penalties for ignoring can always be modeled as expanded acts (e.g., \(a_{\text{ignore}}\) with cost), the distinction may be reducible.  

  **4. Success and Failure Criteria**  
  - **Success**:  
    - A set of formal conditions (e.g., "EVI is nonnegative iff the act-set includes a costless equivalent to the uninformed act") that definitively answer when nonnegativity holds.  
    - Demonstration of at least one case where EVI is negative due to non-ignorability (e.g., from norms or costs) and where this cannot be trivially resolved by act-set adjustments.  
    - Clarity on whether evidential non-ignorability reduces to act-set availability: if it does, the project concludes that the distinction is not independent; if not, it identifies irreducible normative/cost factors.  
  - **Failure**:  
    - All apparent counterexamples are shown to stem from mis-specification (e.g., omitting "ignoring" acts), implying the puzzle is artifactual.  
    - Models become intractable or yield only trivial cases (e.g., nonnegativity always holds when norms are incorporated).  
    - The distinction between ignorable and non-ignorable information collapses entirely into act-set constraints.  

  **5. Scope and Feasibility**  
  This project is narrow by design to fit a six-month timeline:  
  - **Months 1–2**: Formalize baseline models (Good’s theorem) and act-set limitations (Model 1).  
  - **Months 3–4**: Extend to evidential norms (Model 2) and costly ignoring (Model 3); test reducibility.  
  - **Months 5–6**: Refine conditions for nonnegativity, draft findings, and address mis-specification risks.  

  Scope excludes broad applications (e.g., scientific practice) or extensive literature engagement; it focuses on 3–5 core models. If Models 2–3 prove too ambitious, the fallback is a thorough analysis of Model 1 (act-set failures), which alone suffices to challenge EVI’s universality. A grand theory is avoided—success is a conditional theorem, not a paradigm shift.  

  **6. Distinguishing Genuine Counterexamples from Mis-specification**  
  A genuine counterexample requires:  
  - A well-specified decision problem where states, acts, utilities, and information are explicitly defined.  
  - A negative EVI that persists when the act-set is expanded to include "ignoring" (if feasible) and when norms/costs are explicitly modeled (e.g., as utility penalties).  
  - Independence from common mis-specifications, such as:  
    - *Fixed evidence*: Treating evidence as exogenously fixed when it is act-dependent.  
    - *Restricted acts*: Overlooking acts that could replicate ignoring (e.g., by not including \(a_{\text{ignore}}\)).  

  Mis-specification is indicated if incorporating ignoring acts or costs restores nonnegativity. For example, if adding \(a_{\text{ignore}}\) with a norm-violation penalty yields nonnegative EVI, the original problem’s negative EVI arose from omitting this act. Conversely, if penalties make ignoring infeasible (e.g., cost exceeds utility gains), the counterexample stands. The project will use sensitivity analysis: vary act-sets, norms, and costs to see if nonnegativity is robust. Settling this will depend on whether evidential constraints can be fully "decision-theorized" without residue.  

  **Conclusion**  
  This project addresses a foundational ambiguity in decision theory with implications for rational choice and evidence-based reasoning. By refining the EVI theorem to account for non-ignorable information, it promises a rigorous account of when information can be harmful—and why. Even if the puzzle dissolves into mis-specification, the result will clarify the boundaries of formal decision models.
