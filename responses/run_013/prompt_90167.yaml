prompt: |-
  I have just spent four hours arguing with a friend, and I would like to know whether the thing we kept circling has an established name, or, failing that, whether it can at least be given a careful definition.

  The argument began with a case neither of us could leave alone. Two people who have never met and will never meet again are each asked, separately, to choose between two options. For each of them, taking the first option is better whatever the other does — this is not in dispute — and yet if both take the first option, both end up worse off than if both had taken the second. My friend insisted that the second option is the one to take, and his reason was not that his choice would affect the other's, but that the other is the same kind of reasoner as he is, so that his own choice tells him what the other will do. I said that this is not a claim about influence at all, and that he was treating two separate decisions as though they were a single event.

  We then tried to find the edges of his move, and that is where I lost the thread.

  First, the move seemed to depend on the two parties being alike. But alike in what respect? They are not alike in body, memory, or information. If being the same kind of reasoner means only that both reason competently, then the move applies to every competent reasoner, and would license treating the choice of any stranger — or of an adversary who also reasons well — as a sign of what I am about to do, which cannot be right. If it means something stronger, that the two are running the same procedure on the same inputs, then it almost never holds, and it fails immediately when the two know different things. So the premise is either so weak that it covers everyone or so strong that it covers no one, and the argument needs a middle condition that neither of us could state.

  Second, I built a case to test the middle. Two firms of the same type, using the same procedure, must each decide whether to build a plant; if both build, both lose. One firm holds a private report showing that the market is larger than the other supposes. Now the shared procedure returns different answers for the two of them, and the reasoning that my choice predicts yours yields nothing: the firm without the report cannot conclude that the other will refrain, and cannot even work out what it would do in the other's position, since in that position it would have the report.

  Third, and this is the part I most want a name for: when I pressed him on what two parties should do when they share a procedure but not their information, he said that each should do what he would do if he were the other. That sounds like an answer until you notice that it is circular. Which of them is 'the other'? There are two answers, they differ, and the prescription therefore depends on a choice of vantage point that the argument itself gives no way to make.

  So: is there an established name for this family of arguments — arguments that reach a conclusion about what I should do from a premise about what a class of people like me will do — and, separately, a name for the failure I kept running into, in which the relevant class is either too broad to carry information or too narrow to have members? I know the 'what if everyone did that' style of reasoning in ethics, and I know the ordinary two-person puzzle it is grafted onto, but neither is what I am after: the ethical version is about the form of a rule rather than about what another party will actually do, and the puzzle itself says nothing about how to reason when the parties are alike. If nothing established covers it, please coin something — but I care far less about the label than about the carving. What exactly is the phenomenon, what is it not, where is the line between the case where the reasoning works and the case where it collapses, and is the variant in which the parties share a procedure but not their information a special case of something already named, or a problem in its own right?
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They had a four-hour argument with a friend about a paradoxical decision scenario where two identical reasoners face a coordination problem. The core tension is that individually dominant strategies lead to mutual loss, but coordinating on the suboptimal joint action seems impossible without communication. 

  First, I recognize this as a classic game theory puzzle, but the user's frustration suggests they've already identified the superficial parallels and are digging deeper. Their three pain points are particularly sharp: (1) the vague "alikeness" requirement in their friend's argument, (2) the information asymmetry problem in their firm example, and (3) the circular "be the other" prescription. 

  Hmm... the user isn't just asking for labels—they want conceptual surgery. The depth of their examples tells me they're likely philosophically or mathematically trained. Their rejection of Kantian "what if everyone did that" reasoning shows they've already mapped adjacent territories. What they really need is to disentangle three distinct layers: the game structure itself (PD), the reasoning method (symmetry arguments), and the epistemological trap that emerges when information isn't shared.

  Ah! Their firm case brilliantly exposes the fault line. When private information exists, "same procedure" doesn't imply same output—the supposed symmetry breaks. This isn't just about Nash equilibria anymore; it's about common knowledge and solipsistic reasoning. The user's instinct about circularity is correct: "be the other" presumes you know which "other" perspective to adopt when there are multiple asymmetric others.

  I should emphasize that the problem isn't with symmetry arguments per se, but with their misapplication. The user might find Harsanyi's type-based modeling relevant here—it formalizes how rational agents reason about others' reasoning given informational constraints. Also worth noting how their scenario differs from focal points: there's no salient cue here, just pure logic.

  The collapse point they're hunting for? It's when agents lack common prior beliefs or common knowledge of rationality. That's why their firm example explodes the argument—one firm's evidence isn't common knowledge. Maybe I should illustrate with colors: two identical blue robots will decide identically only if their blueness is common knowledge. But if one has hidden red paint, the symmetry illusion shatters.

  ...And now I'm smiling because their "what exactly is it not" demand is so refreshingly precise. This calls for boundary work: distinguishing between necessary vs sufficient conditions for symmetry arguments, between shared procedures and shared information states, between predicting others and becoming others. Time to build those conceptual fences.
answer: |-
  This is a profound and beautifully articulated dilemma that cuts to the heart of rational coordination under uncertainty. You've identified a genuine gap in common terminology. Here's the breakdown:

  ### 1.  The Core Phenomenon & Established Names
  - **The Base Game:** You're describing a **pure coordination problem** embedded within a **Prisoner's Dilemma (PD) structure**. The PD defines the payoff structure (individual dominance vs. mutual cooperation being superior but unstable). The coordination aspect arises from the symmetry and the need for aligned choices.
  - **Your Friend's Reasoning:** This is a **symmetry argument** or **principle of insufficient reason applied to agency**. Specifically, it's invoking **Aumann's Agreement Theorem** *informally* or appealing to **common knowledge of rationality (CKR)**. The key move is treating one's own reasoned choice as *informative* about an identical reasoner's choice, creating a feedback loop. Established names include:
      - **The Symmetry Rationale in Coordination Games**
      - **Aumannian Reasoning** (though Aumann is more formal)
      - **The Principle of Rational Coordination** (less common)
      - Fundamentally, it's an attempt to justify playing the **Pareto-superior Nash equilibrium** (both choosing Option 2) by assuming symmetry breaks the indeterminacy.

  ### 2.  The Core Problem: Defining "Alikeness" & Its Collapse
  You've perfectly diagnosed the issue. The argument hinges on a **Symmetry Assumption** that is either:
  - **Too Weak (Universal Rationality):** If "same reasoner" just means "rational," then *every* rational agent is included. Your choice tells you *nothing* about a specific other rational agent's choice in isolation (e.g., they might have different beliefs, information, values). This collapses into standard PD reasoning, forcing Option 1.
  - **Too Strong (Identical Clones):** If "same reasoner" means identical mental states/procedures *and* identical inputs (information), then symmetry holds *only* under perfect cloning with shared knowledge. Any private information breaks it, as your firm example shows.

  **The Crucial Middle Condition:** The argument *requires* **common knowledge of symmetry** and **common priors**.
  - **Common Knowledge of Symmetry:** Both players know they are identical reasoners (same decision procedure), both know they both know this, both know they both know they both know this, ad infinitum.
  - **Common Priors:** They start with the same fundamental beliefs/prior probabilities before receiving any private information.

  **The Line Where it Works/Collapses:**
  -   **Works:** Only when there is **common knowledge of rationality, common knowledge of symmetry (same procedure), *and* common priors**, *and crucially, no private information relevant to the decision*. In this rarefied scenario, both players can deduce they will reach the same conclusion, making coordination on the Pareto-superior outcome (Option 2) rational. This is the world your friend implicitly inhabits.
  -   **Collapses:** As soon as **asymmetric private information** exists (your firm example) OR if **common knowledge of symmetry is absent** (they might be similar, but each doubts the other knows this or is truly identical). This is the world you correctly point to. Without common priors or with private signals, the "same procedure" yields different outputs, and "my choice predicts yours" fails.

  ### 3.  The "Be the Other" Failure: Circularity & Lack of Vantage Point
  This is the most insightful part of your critique. It has no single established name but is a well-known flaw in informal symmetry reasoning. It's a specific instance of:
  -   **The Vantage Point Problem in Symmetric Reasoning**
  -   **The Perspectival Collapse in Rational Coordination**
  -   **A Failure of Individuation under Perfect Symmetry Assumptions**

  **Why it fails:**
  1.  **Circularity:** "What I would do if I were you" requires knowing what *you* know. But if "I were you," I *would* know what you know, so I *would* decide based on that information. However, since I *don't* actually know what you know in reality, I cannot compute "what I would do if I were you" without *assuming* I magically gain your private information while remaining "me" – a contradiction. Your firm example nails this: The firm without the report *cannot* know what it would do *with* the report.
  2.  **Missing Vantage Point:** The prescription "do what you would do if you were the other" offers no rule for *which* "other" to simulate when symmetry is broken by private information. Should Firm A (no report) simulate being Firm B (has report)? Or vice versa? There's no privileged perspective. The argument provides no meta-reasoning for choosing *whose* perspective to adopt.

  ### Coining Terms for Precision
  Given the lack of perfect single terms:
  1.  **For the family of arguments:** **Symmetry-Based Coordination Rationale (SBCR)**. This emphasizes the core mechanism (symmetry) and the goal (coordinating on a superior outcome).
  2.  **For the "alikeness" collapse problem:** **The Rational Symmetry Dilemma (RSD)**. This captures the tension between needing similarity for the argument to work and the fragility of that similarity under realistic conditions (different info, lack of common knowledge).
  3.  **For the "be the other" circularity:** **The Perspectival Impossibility in Asymmetric Information (PIAI)** or simply **The Vantage Point Failure**.

  ### Summary & The Way Forward
  -   **The Phenomenon:** Using an assumption of identical reasoning (procedure, rationality, priors) under common knowledge to infer coordinated action in a Pareto-superior equilibrium of a game like PD. This is **SBCR**.
  -   **What it is NOT:** It's not Kantian universalization (which is about rule consistency, not predicting others). It's not standard game theory reasoning (which finds the dominant strategy). It's not focal points (which rely on salience, not pure symmetry).
  -   **The Failure (RSD):** SBCR collapses when the required symmetry conditions (common knowledge of identical procedure + common priors) are violated, most commonly by **private information**. The premise of "alikeness" becomes either meaningless (too weak) or impossible (too strong).
  -   **The Circularity (PIAI):** In the presence of private information, the fallback "simulate the other" fails because it requires impossibly adopting another's private perspective while retaining one's own identity, and offers no way to choose *which* other perspective to adopt.
  -   **The Shared Procedure / Different Information Case:** This is **not** a fully novel problem but a critical **boundary case** exposing the limits of SBCR. It's a core challenge within **Bayesian games** or **games with incomplete information**. Formal solutions (like Harsanyi transformations) involve modeling types and beliefs, abandoning the simple symmetry shortcut. It shows SBCR is fragile and only applies in idealized, informationally symmetric settings.

  Your dissection is remarkably precise. Your friend's argument holds only under stringent, often unrealistic, assumptions of perfect symmetry and common knowledge. Your counterarguments highlight the fundamental challenges of coordination under uncertainty and private information, where simple symmetry breaks down and formal game-theoretic tools (like equilibrium selection concepts or type-based models) are needed. The core insight is that **rationality alone, even identical rationality, is insufficient for coordination without common knowledge and shared information.**
