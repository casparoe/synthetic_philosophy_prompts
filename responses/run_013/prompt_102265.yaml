  The core tension is between behavioral evidence (outputs) versus internal states (intentionality) as criteria for understanding. Both sides agree on the observable phenomena but interpret them differently. The user's hypothesis about "understanding" being a verbal dispute over word usage seems insightful but needs testing.

  That computational linguist's distinction about sentence-level vs discourse-level understanding is particularly interesting. The two test cases they mention - idiom translation and context-dependent translation - perfectly expose where the rubber meets the road in this debate. Case (i) questions whether statistical pattern matching constitutes understanding, while case (ii) challenges the systems' ability to maintain coherence beyond isolated sentences.

  What's revealing is how both test cases undermine purely behavioral arguments while simultaneously demonstrating practical competence. The idiom case shows competence without generalization, while the context case shows local accuracy without global coherence. This suggests the dispute isn't just verbal - it's about what thresholds we require before granting "understanding."

  The user's group might benefit from mapping the disagreement onto established philosophical frameworks like Dennett's intentional stance or Searle's Chinese Room. Progress likely requires shifting from binary "does it understand?" to "what specific cognitive capabilities does it demonstrate?" - a move from essentialism to capability assessment.

  The weakest point in the user's framing might be treating "understanding" as monolithic. In reality, human understanding itself operates on gradients - we understand poetry differently than weather reports. The debate might dissolve if we stop looking for a bright line and instead develop a multidimensional framework for cognitive capabilities.
answer: |-
  ### 1. Diagnosis in Brief
  This is a **metalinguistic dispute** rooted in divergent conceptions of "understanding." The impasse persists because both sides:  
  (a) Accept identical behavioral evidence,  
  (b) Define "understanding" using incompatible criteria (functional behavior vs. causal/internal properties),  
  (c) Treat "understanding" as a binary category. Progress requires reframing "understanding" as a graded, context-dependent capacity tied to specific cognitive tasks, not a monolithic state.

  ---

  ### 2. The Impasse Restated  
  **Skeptics** claim: Systems lack *intentionality* (aboutness), *grounding* (connection to reality), and *causal coherence* (reasoning traceable to meaning). Translation is merely pattern-matching; correctness is accidental (e.g., memorized idioms). Understanding requires *why* outputs are correct.  
  **Proponents** claim: Understanding is *defined* by functional competence (e.g., translating novel sentences correctly). Demands for "internal states" are either irrelevant (like demanding a car’s "internal combustion" to prove motion) or unscientific (no test for "real intentionality").  

  **To force concession**:  
  - Skeptics must show systems *cannot* integrate meaning-relevant context (e.g., discourse) *even when behavior appears successful*.  
  - Proponents must show systems *reliably generate context-sensitive inferences* beyond statistical correlations (e.g., resolving ambiguities via situational knowledge, not co-occurrence).

  ---

  ### 3. What Each Side Is Committed To  
  **Skeptics**  
  - *Must accept*: Systems produce functionally adequate translations for many inputs.  
  - *Need not accept*: Behavioral success implies understanding.  
  - *Vulnerability*: Conflating human-unique properties (e.g., consciousness) with understanding. If a system infers discourse context (e.g., pronoun resolution via topic modeling), is that "grasping the situation"?  

  **Proponents**  
  - *Must accept*: Current systems fail at discourse-level tasks (e.g., tracking dialogue goals).  
  - *Need not accept*: Understanding requires biological grounding.  
  - *Vulnerability*: Equating statistical generalization (e.g., novel idiom translation via subword units) with comprehension. If success stems from shallow patterns, is it "understanding"?

  ---

  ### 4. Diagnosis  
  Your hypothesis is **largely correct**: The dispute is verbal regarding the meaning of "understanding," but it reveals a substantive rift about cognitive benchmarks.  

  - **Verbal Dimension**: "Understanding" is used as a *functional descriptor* (proponents) vs. a *causal/experiential state* (skeptics).  
  - **Substantive Dimension**: The disagreement tracks a **threshold problem**. At what point does behavioral competence warrant attributing understanding?  

  **The sentence/discourse distinction illuminates this**:  
  - Systems *can* pass sentence-level tests (e.g., Q&A about explicit content) by mapping syntax to output templates.  
  - They *fail* discourse-level tests (e.g., "Why did the speaker say this?") requiring situational models.  
  - **What it reveals**: Proponents focus on *minimum competence* (sentence translation as understanding), while skeptics demand *robust cognition* (discourse coherence as proof).  

  **Cases in point**:  
  - **(i) Idiom translation**: Correct output via memorization satisfies functionalists but not skeptics, who see failure on novel idioms as proof of missing conceptual inference.  
  - **(ii) Context-dependent translation**: Success requires discourse modeling. Current systems often fail (e.g., mistranslating gender without explicit cues), validating skeptics. But *could* future systems succeed? Proponents argue this would force skeptics to move goalposts.  

  **Hidden empirical question**: *Can neural systems develop latent representations of discourse context?* If yes, proponents gain ground; if no, skeptics prevail. Currently, evidence is mixed (e.g., transformers track entity coherence but struggle with pragmatic inference).  

  ---

  ### 5. What Would Count as Progress  
  Resolving the binary "yes/no" frame is key. Progress requires:  
  1. **A granular framework**: Decompose "understanding" into testable capacities (e.g., lexical disambiguation, coherence tracking, goal inference).  
  2. **Adversarial testing**:  
     - *For idioms*: Train systems on idiom-rich data but test on semantically equivalent novel constructions. Success suggests conceptual generalization.  
     - *For discourse*: Provide sentences with ambiguous pronouns (e.g., "They saw her duck") and test if context (e.g., prior sentences about a farmer/pet) resolves translation correctly.  
  3. **Formal criteria**: Adopt metrics like *counterfactual robustness* (Does changing a causally irrelevant word alter output?) or *inferential depth* (Can the system justify translations via logical chains?).  

  Movement occurs if:  
  - Systems **fail** discourse tasks despite architectural advances (validating skeptics), or  
  - Systems **pass** rigorous tests of inference (e.g., translating context-dependent sentences *without* training on similar examples), forcing skeptics to refine their criteria.  

  ---

  ### 6. Where You Are Likely Wrong  
  Your framing assumes both sides "accept the same phenomena," but they **interpret behavioral evidence differently**. Skeptics see statistical success as *epiphenomenal* (e.g., memorized idioms aren’t "understanding"), while proponents see it as *constitutive*. This isn’t just about word usage—it’s about whether cognition *requires* mechanisms beyond input-output correlations. Your hypothesis underweights how skeptics’ demands (e.g., "grasping situations") imply a theory of mind incompatible with current AI.
