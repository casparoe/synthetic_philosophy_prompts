  First, I'll extract requirements from each hard case. Case 1 (initial-condition-dependent regularity) demands that laws be *distinct from accidental regularities*. Case 2 (ceteris paribus laws) requires *robustness to exceptions* and *non-universality*. Case 3 (uninstantiated regularities) forces *modal force beyond actual events*. Case 4 (probabilistic laws) needs *indeterminism support*. Case 5 (symmetry principles) calls for *meta-constraints on lawhood itself*. Case 6 (law-governed laws) implies *higher-order law requirements*.

  Now, sorting these: Constitutive requirements must include modal force and distinctness from accidents—without these, the account can't handle explanation. Robustness and indeterminism support are also core, as science relies on both. Symmetry principles and higher-order laws feel like refinements; they're crucial for advanced physics but negotiable for basic accounts. 

  The biggest tension arises between Humean and anti-Humean commitments. Modal force (Case 3) is the killer: Humeans can't ground uninstantiated regularities without cheating with "best systems," while anti-Humeans embrace primitive necessity. This requirement alone sinks Humean supervenience-based views. 

  For conflicting requirements—robustness (Case 2) vs. strict universality—they pull in opposite directions. A theory satisfying both must allow laws to be defeasible yet lawlike, which strains standard frameworks. The user might need to prioritize one or introduce tiers of lawhood. 

  I'll stress that the modal force requirement is the sharpest divider. Anti-Humeans accept it freely; Humeans must either reject it (sacrificing explanatory depth) or contort their supervenience base. The user's explanatory project likely needs modal force, so if they lean Humean, they'll face tough choices.
answer: |-
  Here is a prioritized list of desiderata for a theory of lawhood, derived from your hard cases and sorted by non-negotiability, philosophical commitment, and dialectical weight. Requirements are **constitutive** (essential for any adequate theory) or **camp-specific** (mandatory for one major approach but not the other). Non-negotiable items are marked with ⚖️; refinements lack this marker.

  ---

  ### **Constitutive Desiderata** (Essential for All Accounts)
  1. **⚖️ Non-Accidentality Distinction**  
     *Motivation*: Hard Case #1 (initial-condition-dependent regularity).  
     *Requirement*: Must distinguish *lawlike* regularities (e.g., the dynamical rule) from *accidental* ones (e.g., the initial-condition-dependent regularity), even when both hold universally.  
     *Ruling Out*: Naive regularity theories (e.g., "All universal regularities are laws").  

  2. **⚖️ Modal Force**  
     *Motivation*: Hard Case #3 (uninstantiated regularity).  
     *Requirement*: Laws must support counterfactuals about non-actual scenarios (e.g., "If entity *X* existed, regularity *R* would govern it").  
     *Ruling Out*: Strictly actualist Humeanism (laws cannot ground uninstantiated possibilities).  

  3. **⚖️ Explanatory Asymmetry**  
     *Motivation*: Hard Case #1 & Core Project (laws explain regularities, not vice versa).  
     *Requirement*: Laws must be the *ground* of explanatory/counterfactual power, not a byproduct of patterns in events.  
     *Ruling Out*: Reductive accounts where "law" is merely an honorific for useful summaries.  

  4. **Indeterminism Support**  
     *Motivation*: Hard Case #4 (probabilistic laws).  
     *Requirement*: Must accommodate laws that fix objective chances without determining outcomes.  
     *Dialectical Note*: Constitutive for scientific adequacy but often downplayed by non-probabilistic accounts.  

  ---

  ### **Camp-Specific Desiderata**
  5. **Robustness to Exceptions** (Anti-Humean Refinement)  
     *Motivation*: Hard Case #2 (ceteris paribus laws in special sciences).  
     *Requirement*: Laws can hold *ceteris paribus* (i.e., be defeasible under interfering conditions) without ceasing to be laws.  
     *Commitment*: Anti-Humeans typically accept this via dispositional/nomic necessity; Humeans struggle (require complex "best system" clauses).  

  6. **Meta-Law Compatibility** (Anti-Humean Non-Negotiable ⚖️)  
     *Motivation*: Hard Cases #5 (symmetry principles) & #6 (laws governing laws).  
     *Requirement*: Laws must be subject to higher-order constraints (e.g., symmetries, conservation principles) that are not themselves regularities over events.  
     *Commitment*: Anti-Humeans can treat meta-laws as primitive; Humeans must reduce them to patterns (e.g., via systemic elegance).  

  7. **Supervenience on the Actual** (Humean Non-Negotiable ⚖️)  
     *Motivation*: Core Humean commitment (no "modal glue").  
     *Requirement*: Laws supervene on the totality of particular, non-modal facts (e.g., events, properties).  
     *Commitment*: Non-negotiable for Humeans; rejected by anti-Humeans.  

  ---

  ### **Key Tensions & Dialectical Pressures**
  - **Incompatible Pair**:  
    **Modal Force** (Constitutive ⚖️) + **Supervenience on the Actual** (Humean ⚖️).  
    *Why*: Uninstantiated regularities (Case #3) require laws to have modal scope beyond actual events. Humean supervenience cannot ground non-actual possibilities without circularity or brute stipulation.  

  - **Highest-Impact Requirement**:  
    **Modal Force** (Constitutive ⚖️).  
    *Why*: It decisively excludes *Humean supervenience-based accounts* (e.g., Lewis's BSA). These reduce laws to summaries of actual events and thus cannot ground truths about uninstantiated kinds (Case #3) or non-actual explanatory scenarios.  

  ---

  ### **The Great Divider: Humean vs. Anti-Humean**
  The requirements that most sharply divide the camps are:  
  1. **Supervenience on the Actual** (Humean ⚖️)  
  2. **Meta-Law Compatibility** (Anti-Humean ⚖️)  

  - **Humeans** must reject **Meta-Law Compatibility** as primitive. To accommodate it, they must reduce meta-laws (e.g., symmetries) to systemic features of the "best system" (e.g., mathematical simplicity), risking circularity.  
  - **Anti-Humeans** must reject **Supervenience on the Actual**. To embrace it, they would need to ground modal force in non-modal facts—a contradiction for primitivist necessitation accounts.  

  ---

  ### **Summary of Implications for Your Project**
  - Any theory failing **Non-Accidentality**, **Modal Force**, or **Explanatory Asymmetry** is inadequate.  
  - **Modal Force** is the chief obstacle for Humeans; **Meta-Law Compatibility** for anti-Humeans.  
  - To retain Humeanism while satisfying Modal Force, you must either:  
    (a) Stretch "supervenience base" to include modal facts (sacrificing core Humeanism), or  
    (b) Argue that uninstantiated regularities (Case #3) are pseudo-problems.  
  - To retain anti-Humeanism while satisfying Supervenience, you must reduce nomic necessity to actual patterns (sacrificing governance).  

  The list is consistent *if* you reject either Humean supervenience or primitivist anti-Humeanism—but no theory satisfies all desiderata neutrally. Your choice of lawhood criterion will hinge on which cost you accept.
