prompt: |-
  I'm a teaching assistant for a second-year undergraduate course, and next week I have seventy-five minutes to introduce Grice's distinction between what a speaker means and what a sentence means, and to get the class to the point where they can use the notion of conversational implicature as a working tool rather than as a piece of vocabulary. I don't want you to explain the distinction to me; I want a plan for how to explain it. The students have had one term of introductory logic and know roughly what entailment and presupposition are, but they have no philosophy of language beyond that. Assume a whiteboard, no handouts, and a room that will begin politely skeptical that any of this is a real phenomenon rather than a fancy name for reading between the lines.

  Lay out the order in which the pieces have to go in, and say for each why it cannot come earlier — in particular, what has to be in place before the cooperative principle and the maxims will seem like anything other than arbitrary rules, and where the calculability of an implicature has to sit relative to the maxims themselves. Choose the single example that carries the whole session, and be explicit about what it must have and what it must lack. I had been thinking of using a case where a student asks a classmate who took the course the previous year whether the professor grades harshly, and the classmate answers that the reading list is excellent; tell me whether that can bear the weight or whether it smuggles in the conclusion, and if it can't, give me something better. I want the session to end with the students able to run the cancellability test and the embedding test — why an implicature vanishes under negation or in the antecedent of a conditional while what is said does not — on a fresh example, so build toward that. Then map the misconceptions I should expect and exactly where in the sequence I should head each one off. I'm expecting the class to arrive believing that an implicature is just any inference a hearer happens to draw; that whatever a speaker manages to suggest is simply what the sentence means; that every implicature arises because a maxim has been broken rather than exploited; that irony and sarcasm are the paradigm cases; and that words like but raise the same phenomenon as the maxims do. Tell me which of these are real traps and which are my own confusion, and give me one closing question that will show whether the distinction has landed rather than been memorized.

  Finally, tell me what I should deliberately leave out at this level and announce that I'm leaving out — I assume the debate over whether conventional implicature is a genuine third category, and the question of whether the maxims are rational constraints or merely conventional regularities, are candidates, but you decide — and how to phrase the omission so that it reads as a promise rather than a hole. Please don't send me to readings or cite anything; I need the plan itself, and I would rather have the dependency structure and the misconception map than a summary of the theory. Write it in American English.
reasoning: |-
  Okay, the user is a teaching assistant preparing a 75-minute undergraduate lecture on Grice's distinction between sentence meaning and speaker meaning, focusing on conversational implicature. The students have basic logic background but no prior philosophy of language exposure. The room is skeptical, so the approach must be concrete and persuasive.

  The core challenge is making implicature feel like a tool rather than vocabulary. This requires careful scaffolding: starting with undeniable speaker/sentence splits, then demonstrating how implicatures arise systematically from cooperative expectations, and finally showing their cancellable nature. The proposed letter-of-recommendation example is perfect—it's universally relatable, contains no irony/sarcasm (avoiding misconceptions), and beautifully illustrates maxim exploitation (Quality maintained while flouting Quantity). 

  Key structural insights: 
  - Must establish the fact of non-entailed meaning BEFORE introducing CP/maxims, or they'll seem arbitrary. 
  - Calculability must follow maxim introduction to show implicatures are reconstructible inferences. 
  - Cancellability/embedding tests should cap the session as application exercises.

  Critical misconception handling: 
  - The "inference=implicature" error gets preempted by showing systematic calculability. 
  - "Speaker suggestion=sentence meaning" gets dismantled via cancellability. 
  - Irony/sarcasm are deliberately avoided as initial examples since they involve maxim violation (not exploitation) and would confuse the "flouting" demonstration.

  Deliberate omissions: 
  - Conventional implicature (e.g., "but") is explicitly bracketed to avoid conflation. 
  - Maxims' rational/conventional status is tabled to maintain focus on mechanism. The framing "for today's purposes" positions this as pedagogical focus, not oversight.

  The closing question ("Why not just say X?") forces application of the entire framework—if they can articulate the flouting/calculability logic, the distinction has landed.
answer: |-
  Here’s a battle-tested 75-minute plan focused on dependency, misconception avoidance, and turning implicature into a usable tool. The core example is a **professor’s letter of recommendation** (better than your classmate example, as it avoids presupposition traps and clearly isolates Quantity flouting).

  ---

  ### **Phase 1: Establish the Phenomenon (15 mins)**
  **Goal:** Show that what speakers mean ≠ what sentences mean, using undeniable examples.  
  **Key Move:** Start with non-linguistic communication to sidestep "reading between the lines" skepticism.  
  1. **Non-Linguistic Example (3 mins):**  
     *Draw:* 🚗...🅿️ (Car driving toward parking spot). *Act out:* Person in car makes eye contact, points at spot, raises eyebrows.  
     - Q: "What do they mean?" ("Can I have this spot?")  
     - Q: "Does the *pointing gesture itself* mean that?" (No—it could mean "Look at that dog!").  
     - **Why now?** Forces acknowledgment that *meaning* is speaker-driven.  

  2. **Linguistic Example (5 mins):**  
     *Scenario:* You ask me, "Is Karla a good philosopher?" I say: *"Karla has lovely handwriting."*  
     - Q: "What do I mean?" ("No, she’s terrible.")  
     - Q: "Does the sentence *entail* that?" (No—it could be true while Karla is brilliant).  
     - **Why now?** Shows sentence meaning undershoots speaker meaning. Entailment ≠ speaker intention.  

  3. **Contrast with Presupposition (7 mins):**  
     *Example:* "Karla stopped plagiarizing." (Presupposes she once plagiarized).  
     - Q: "If I deny this—'Karla didn’t stop plagiarizing'—does the presupposition vanish?" (No—still implies she once plagiarized).  
     - **Why now?** Presupposition survives negation; our Karla example doesn’t. *This isn’t presupposition.*  

  ---

  ### **Phase 2: Introduce Cooperative Principle & Maxims (15 mins)**  
  **Goal:** Make CP/maxims feel inevitable, not arbitrary.  
  **Key Move:** Frame them as prerequisites for efficient communication.  
  1. **The "Why Now?" Bridge (3 mins):**  
     - "We agree speakers mean more than sentences say. *How do we reliably decode this?* If it’s random, communication fails. There must be shared expectations."  

  2. **Cooperative Principle (CP) (2 mins):**  
     - "We assume speakers are trying to *cooperate*—to make their contribution helpful for the exchange."  

  3. **Maxims as Efficiency Tools (10 mins):**  
     - **Quantity:** Give enough info, not too much. *Why?* Prevents overload & guessing games.  
     - **Quality:** Be truthful. *Why?* Without trust, communication collapses.  
     - **Relation:** Be relevant. *Why?* Saves time; avoids confusion.  
     - **Manner:** Be clear. *Why?* Prevents misunderstanding.  
     - **Key:** Emphasize these are *norms we all use* to infer meaning efficiently. Not rules—default expectations.  

  ---

  ### **Phase 3: Implicature via Exploitation + Calculability (25 mins)**  
  **Core Example:** **Letter of Recommendation**  
     *Scenario:* Philosophy job applicant Karla’s reference letter says: *"Karla speaks fluent English and is usually punctual."*  
  **Why this example?**  
  - Lacks ambiguity, irony, or conventional cues (like "but").  
  - Clearly cooperative context (referee wants to help hire good candidates).  
  - Blatantly flouts **Quantity** (too little info) + **Relation** (info irrelevant for philosophy jobs).  

  **Step-by-Step:**  
  1. **Identify the Gap (5 mins):**  
     - Q: "Is this adequate praise?" (No—trivial info).  
     - Q: "Does the referee obey Quality?" (Yes—likely true).  
     - Q: *"Which maxims are flouted?"* (Quantity/Relation).  

  2. **Calculability: The Inference Chain (10 mins):**  
     - "You know the referee is cooperative (CP). They flouted Quantity/Relation *for a reason*."  
     - Whiteboard the inference:  
       - Step 1: Referee said too little/irrelevant info.  
       - Step 2: But they’re cooperative → they must think this is adequately informative.  
       - Step 3: Only way this is adequate: if Karla is *bad* at philosophy.  
       - **→ Implicature: "Karla is a terrible philosopher."**  
     - **Crucial:** Stress this is *reconstructible*. Not a guess—a necessary inference to preserve CP.  

  3. **Flouting ≠ Violating (5 mins):**  
     - *Violation:* Secretly breaking maxims (lying = violating Quality). *Not* implicature.  
     - *Flouting:* Openly breaking a maxim to trigger inference (like the letter). **This is implicature.**  
     - **Why stress?** Prevents "all implicatures involve breaking rules" misconception.  

  4. **Contrast with Your Classmate Example (5 mins):**  
     - Your example *can* work, but it’s riskier:  
       - If the classmate says "reading list excellent," students may think it’s *irrelevant* (Relation flout) → implicature "grades harshly."  
       - **Danger:** They might see it as dodging the question (not cooperation). The letter example is unambiguously *in* a cooperative context.  

  ---

  ### **Phase 4: Tests for Implicature (15 mins)**  
  **Goal:** Students run cancellability/embedding tests themselves.  
  **Key:** Use the letter example → a fresh example (below).  

  1. **Cancellability Test (6 mins):**  
     - Original: *"Karla speaks fluent English..."* → Implicature: She’s bad.  
     - **Add cancellation:** *"...and she’s an outstanding philosopher!"*  
       - Q: "Does the implicature survive?" (No! Cancelled explicitly).  
       - Q: "Can you cancel *what is said*?" (No—"she speaks English" is still asserted).  

  2. **Embedding Test (6 mins):**  
     - **Under negation:**  
       *"It’s not true that Karla speaks fluent English..."*  
       → Denies she speaks English. *Doesn’t* deny she’s a bad philosopher.  
     - **In conditional:**  
       *"If Karla speaks fluent English, she’ll get the job."*  
       → No implicature about her philosophy skills.  

  3. **Student Practice (3 mins):**  
     - *Fresh example:* A film critic writes: *"The director succeeded in putting images on film."*  
     - Groups run both tests to show:  
       - Implicature: "The film is terrible." (Quantity flout)  
       - Cancellable: *"...and it’s a masterpiece!"* → Implicature gone.  
       - Not embedded: *"It’s false that the director succeeded..."* → Only denies images exist.  

  ---

  ### **Misconception Map & Preemption**  
  | **Misconception** | **When to Preempt** | **How** |  
  |-------------------|---------------------|---------|  
  | "Implicature = any inference" | Phase 1 → Phase 3 | Stress calculability: It’s not "any" inference—it’s *required* to preserve CP. |  
  | "Speaker suggestion = sentence meaning" | Phase 1 → Phase 4 | Cancellability test: What is said can’t be cancelled; implicature can. |  
  | "Implicatures require maxim *breaking*" | Phase 3 | Hammer "flouting" (open) vs. "violating" (secret). Irony is a Quality *flout*. |  
  | "Irony/sarcasm are the paradigm" | **DELIBERATELY AVOID** | They involve attitude, not pure inference. Use neutral examples (letter, film). |  
  | "Words like 'but' work like maxims" | Phase 5 (omission) | Explicitly exclude: "We’ll treat these as separate next week." |  

  **Your Trap:** Irony/sarcasm *are* implicature (via Quality flouting), but they’re **bad introductory examples**—they feel like "reading between the lines" and involve expressive layers.  

  ---

  ### **Closing & Omissions (5 mins)**  
  1. **Closing Question (To check understanding):**  
     > *"Suppose I ask if you liked my cooking, and you say, 'The sauce was a bold shade of red.' Why didn’t you just say you hated it?"*  
     - **Strong answer:** "You flouted Quantity/Relation. If I assume you’re cooperative, I *must* infer you hated it to make your remark informative. Saying it directly might be rude."  

  2. **Deliberate Omissions:**  
     - **Announce:** "Today, we’re treating implicature as a single category. We’re *setting aside* two debates:  
       - Whether conventional implicatures (like *'but'* or *'therefore'*) are a distinct beast—they’re important, but we’ll tackle them separately.  
       - Whether the maxims are universal rules of rationality or just cultural conventions. For now, we’re using them as observed patterns that *explain* how we decode meaning."  
     - **Why:** Prevents overcomplication. "Setting aside" signals intentional focus, not ignorance.  

  ---

  ### **Why This Sequence Works**  
  - **Dependency:** CP/maxims only appear *after* establishing the speaker/sentence gap (or they feel made-up). Calculability depends on maxims. Tests depend on calculability.  
  - **Skepticism Disarmed:** Starts with non-linguistic meaning, contrasts with logic/presupposition, uses "cooperation" as intuitive.  
  - **Tool Creation:** Tests are practiced, not just described. The film critic example is their "proof of concept."  
  - **Misconceptions:** Preempted *in situ* (e.g., "flouting" introduced when first needed).  

  **Time Buffer:** Phase 3 is the linchpin—if short on time, skip the classmate example discussion. Prioritize getting to the tests.
