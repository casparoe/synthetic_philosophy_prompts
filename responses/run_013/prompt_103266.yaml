prompt: |-
  For the past several weeks I've been sitting in on a graduate seminar on collective decision-making for a piece I'm writing about how groups — juries, hiring committees, editorial boards — manage to be rational when no single member is in charge, and a puzzle one of the participants put to me has been rattling around my head ever since. Picture a three-member hiring committee that must decide whether to extend an offer. Rather than vote on the offer directly, the members are asked first to settle two sub-questions — whether the candidate is qualified, and whether the candidate fits the team — on the understanding that an offer is warranted just in case the candidate is both qualified and a good fit. The first member judges the candidate qualified and a good fit, and would hire. The second judges the candidate qualified but a poor fit, and would not hire. The third judges the candidate unqualified but a good fit, and would not hire. Each member's position is internally coherent. Yet when the committee tallies the sub-questions separately, a majority finds the candidate qualified and a majority finds the candidate a good fit, while a majority also votes against hiring — even though hiring is exactly the conjunction those first two majorities entail. The committee, in short, has contradicted itself, and it has done so while every one of its members reasoned impeccably.

  A colleague who has been arguing with me about this insists the lesson is far more radical than a quirk of committee procedure, and he has laid it out as a chain I can't quite break. (1) A collective decision is legitimate only if it is fixed by the members' individual judgments and treats every member's judgment equally; there is no group mind that could judge on its own. (2) Legitimacy also requires that the group's verdict on any given question depend only on the members' verdicts on that question — the group's judgment about qualification should track the members' judgments about qualification, its judgment about fit should track their judgments about fit, and so on, rather than being smuggled in from some other quarter. (3) Any procedure meeting (1) and (2) is some form of issue-by-issue aggregation, and the case above shows that such a procedure can yield an inconsistent set of verdicts; indeed the general impossibility results show that no procedure can satisfy (1), (2), and consistency all at once. (4) An inconsistent set of verdicts cannot all be true, so it is not a judgment at all — the group has not actually decided anything; it has merely produced a contradiction. (5) Since (1) and (2) are just what we mean by legitimate collective judgment, and no procedure satisfies both together with consistency, it follows that a group facing interconnected questions — which is to say, any group worth convening — cannot form a legitimate judgment at all. Collective rationality, on this view, is a polite fiction, and every committee that believes it has reasoned its way to a decision is either incoherent or quietly authoritarian.

  I'd like you to tell me where this argument goes wrong, if it does — which numbered step to reject, why it looked so plausible in the first place, and what rejecting it actually costs. I have a stake in the answer: I want to keep (1), and I'm willing to surrender either (2) or (4), but I suspect those two concessions are not the same price, and I'd like to know what each of them buys and what it forfeits. A second, related question, since a participant in the seminar floated it and I couldn't tell whether it was a genuine fix or a dodge: if the committee were to vote not on the three questions separately but on whole packages — accepting or rejecting the candidate together with a consistent set of reasons — does that truly escape the paradox, or does it merely relocate it? Please don't rest on anyone's famous theorem as a slogan; the seminar is full of people who can recite the results and none of whom can tell me what they cost. I want to see the machinery.
reasoning: |-
  We are given a puzzle and an argument about collective decision-making. The puzzle shows that when a group votes on sub-questions separately (issue-by-issue), they can end up with an inconsistent set of judgments even though each individual is consistent. The argument then proceeds in 5 steps to conclude that collective rationality is impossible.

  We are asked to break the argument by rejecting one of the steps and to explain the cost. Also, we are to consider whether voting on whole packages (consistent sets of reasons) avoids the problem.

  Let's restate the steps:

  (1) Legitimacy requires that the collective decision is fixed by individual judgments and treats every member equally (no group mind).

  (2) Legitimacy also requires that the group's verdict on a question depends only on the members' verdicts on that question (issue-independence).

  (3) Any procedure meeting (1) and (2) is issue-by-issue aggregation, which can yield inconsistency (as in the example). Moreover, impossibility results (like the discursive dilemma) show that no procedure can satisfy (1), (2), and consistency simultaneously.

  (4) An inconsistent set of verdicts is not a judgment at all (because it contains a contradiction).

  (5) Therefore, since (1) and (2) define legitimate collective judgment, and they cannot be satisfied with consistency, no group can form a legitimate judgment on interconnected questions.

  We are told that we want to keep (1) and are willing to surrender (2) or (4). We must evaluate which step to reject and what the cost is.

  Let's analyze:

  The example: 
  - Member 1: qualified (Q) and fit (F) -> hire (H) [which is Q and F]
  - Member 2: Q and not F -> not H
  - Member 3: not Q and F -> not H

  When we aggregate issue-by-issue:
  - On Q: Majority says Q (Members 1 and 2 say Q, so 2 out of 3).
  - On F: Majority says F (Members 1 and 3 say F, so 2 out of 3).
  - Therefore, the group judgment would be: Q and F -> which implies H.

  But when they vote on H directly (or by their overall judgment), the majority is against hiring (Members 2 and 3 vote against, so 2 out of 3). Hence the inconsistency: the group says Q and F (which imply H) but also says not H.

  The argument claims that the group has produced an inconsistent set {Q, F, not H} which is a contradiction because H is equivalent to Q and F.

  Step (3) refers to impossibility results (like the Condorcet paradox or the doctrinal paradox). The discursive dilemma (or doctrinal paradox) exactly shows that majority voting on the premises can lead to a different outcome than majority voting on the conclusion, even when the conclusion is defined by the premises.

  Now, where to break the chain?

  Option 1: Reject step (2). We allow that the group's verdict on a question might depend on the members' verdicts on other questions. This is the idea of holistic aggregation. For example, we might not aggregate each issue separately but look for a consistent set of judgments that best fits the individual judgments overall.

  Option 2: Reject step (4). We accept that the group can have inconsistent judgments and that we might still call it a decision (but then we have to live with the contradiction).

  But note: step (4) says an inconsistent set of verdicts "cannot all be true, so it is not a judgment at all". This is a strong claim. However, one might argue that the group has indeed made a decision (by majority on each issue) and that the inconsistency is a problem of the aggregation method, not necessarily that the group hasn't decided. But the problem is that the set {Q, F, not H} is logically inconsistent, so it cannot be implemented without violating logic.

  Alternatively, we might reject step (2) and allow the aggregation procedure to be holistic. Then we can avoid inconsistency by requiring the collective judgment set to be consistent.

  What does rejecting (2) cost? It means that the group's judgment on one issue (say, qualification) might be influenced by how the members judge other issues (like fit). This might be seen as violating the independence of issues. For example, we might end up with a judgment on qualification that is not simply a function of the members' judgments on qualification but also on their judgments on fit. This could be criticized as allowing "irrelevant" considerations. However, in reality, the issues are interconnected.

  Now, what about the package-vote proposal? Instead of voting on each sub-question, the committee votes on entire consistent packages. For example, they might consider:

  - Package A: Q and F -> H (hire)
  - Package B: Q and not F -> not hire
  - Package C: not Q and F -> not hire
  - Package D: not Q and not F -> not hire

  And then each member votes for the package that matches their judgment. In this example:

  - Member 1 votes for Package A.
  - Member 2 votes for Package B.
  - Member 3 votes for Package C.

  Now, if we take a majority vote on the packages, we have:

  - A: 1 vote
  - B: 1 vote
  - C: 1 vote

  So no majority. Alternatively, we might use a different rule (like plurality) but then we have a tie. So this doesn't lead to a clear outcome. But note, we could also consider only the packages that are consistent. The problem is that the group might not agree on a single package. However, the procedure would then pick one package (by some rule) and that package would be consistent by construction.

  But note: the argument in step (5) says that any group facing interconnected questions cannot form a legitimate judgment. The package vote avoids the inconsistency because the group is forced to choose a consistent set. However, the challenge is to aggregate individual package choices in a way that is legitimate (satisfies (1) and (2)?). But step (2) as stated requires issue-independence. In package voting, we are not aggregating issue-by-issue, so step (2) is not satisfied? Actually, step (2) says the group's verdict on any given question should depend only on the members' verdicts on that question. In package voting, the verdict on a given question (say, Q) is determined by the chosen package, which in turn is determined by the votes on the entire package. Therefore, the verdict on Q depends on how the members voted on the entire package, which includes other issues. So step (2) is violated.

  But if we reject step (2), then package voting is a way to avoid the inconsistency. The cost is that we give up the idea that each issue should be decided independently. This might be acceptable if we think that the issues are interconnected and should be considered together.

  Alternatively, we might adjust step (2) to allow for interdependence? But note the argument requires (2) as stated.

  Now, what if we reject step (4)? We might say that the group has made a decision (by majority on each issue) and even though the set is inconsistent, we can still call it the group's judgment. But then we have a contradiction. How can we act on it? We cannot both hire and not hire. So we must resolve the inconsistency somehow. This might be done by prioritizing one vote over another (e.g., the hiring vote might override the premise votes, or vice versa). But then we are not treating the issues equally. Also, step (4) seems hard to reject because an inconsistent set of judgments is not a coherent position.

  Therefore, the more promising route is to reject step (2). We allow the aggregation to be holistic, so that the group's judgment on each issue is determined in a way that ensures the entire set is consistent. This is the approach taken by the "premise-based" vs. "conclusion-based" procedures, but more generally by judgment aggregation rules that seek a consistent collective set.

  However, note that step (3) says that any procedure meeting (1) and (2) is issue-by-issue. This is true because (2) requires that the verdict on each issue is a function only of the members' verdicts on that issue. So if we reject (2), then we are not constrained to issue-by-issue aggregation, and we can use holistic methods that avoid inconsistency.

  But what about the cost of rejecting (2)? It means that the group's judgment about qualification might be influenced by the members' views on fit. For example, in a holistic procedure, we might end up with a judgment on Q that is not the majority view on Q. This might be seen as violating the equal treatment of that issue. Moreover, it might be seen as allowing the procedure to "mix" issues in a way that is not transparent.

  But in the example, if we use a holistic procedure, we might choose the collective judgment set that is closest to the individual judgments. For instance, we might choose a consistent set that minimizes the number of disagreements with the individuals. In this case, we have:

  Option 1: {Q, F, H} (which matches Member 1) -> disagreements: Member 2 disagrees on F and H (but note: Member 2 has Q and not F and not H, so on F and H) and Member 3 disagrees on Q and H (Member 3 has not Q and F and not H). So total disagreements: 2 (with Member 2) + 2 (with Member 3) = 4.

  Option 2: {Q, not F, not H} (matches Member 2) -> Member 1 disagrees on F and H (2 points), Member 3 disagrees on Q and F (2 points) -> total 4.

  Option 3: {not Q, F, not H} (matches Member 3) -> similar to above, 4 disagreements.

  Option 4: {not Q, not F, not H} -> Member 1 disagrees on all three (3 points), Member 2 disagrees on Q (1 point) and Member 3 disagrees on F? (Member 3 has F, so if we say not F, that's a disagreement) but wait: Member 3 has (not Q, F, not H). So if we choose {not Q, not F, not H}, then:
  - Member 1: disagrees on Q, F, H (3)
  - Member 2: has Q and not F -> so we have not Q and not F: disagrees on Q (1) and on F? (Member 2 says not F, we say not F -> agree on F? Actually, we have not F and Member 2 has not F, so agree. But on Q: we have not Q, Member 2 has Q -> disagree. So 1 disagreement for Member 2.
  - Member 3: has not Q and F -> we have not Q (agree) and not F (disagrees with F) and not H (agree). So 1 disagreement.
  Total: 3+1+1=5.

  So the minimal disagreement is 4, achieved by any of the three consistent sets that match one member. So we have a tie. But then we might break the tie arbitrarily, and we would pick one consistent set. This avoids the inconsistency.

  But note: in this holistic procedure, the group might end up with {Q, not F, not H} even though a majority (2 out of 3) think the candidate is qualified and a majority think the candidate is a good fit? Actually, in the holistic set {Q, not F, not H}, we have Q (so qualified) and not F (so not fit). This does not match the majority on F (which was in favor of fit). But we are not bound by the majority on each issue because we are doing a holistic aggregation.

  So the cost is that the group's judgment on an issue might not reflect the majority view on that issue. This is the trade-off: to get consistency, we might have to sacrifice the independent majority on each issue.

  Now, what about the package vote? We presented three packages. Each member votes for one package. We have a tie. We might then use a tie-breaking rule. But then the group's verdict on Q and F would be determined by the package that wins. And that package is consistent. So we avoid the inconsistency. However, the outcome might not reflect the majority on the individual issues. For example, if we break the tie in favor of package A, then we get Q and F even though only one member supported that package. But note, the majority on each issue (if we looked) would be Q and F, so it matches. However, in the tie we don't have a majority package. But if we had a majority package, then it would be consistent and we would have a clear outcome.

  In a different scenario, if two members had the same package, then that package would win by majority. For example, if two members thought like Member 1 (Q and F) and one like Member 2 (Q and not F), then package A would get 2 votes and package B 1 vote. Then we would have group judgment: Q and F -> H. This is consistent and matches the majority on each issue (on Q: 3 members say Q? Actually, the two in A say Q, the one in B says Q -> so 3 say Q; on F: the two in A say F, the one in B says not F -> so 2 say F, majority F). And the hiring: package A says H, which wins. Alternatively, if two members were like Member 2 (Q and not F) and one like Member 1 (Q and F), then package B would win: Q and not F -> not H. Then on Q: 3 say Q (so majority), on F: two say not F (majority not F) -> consistent.

  But what if we have two members with different packages? For example, two members: one like Member 1 (A) and one like Member 2 (B), and the third like Member 3 (C). Then we have a tie. We break the tie arbitrarily. If we pick A, then the group says Q and F (even though only one member had that). But note, the majority on each issue: 
  - Q: Member 1 and 2 say Q -> majority for Q.
  - F: Member 1 and 3 say F -> majority for F.
  So if we pick A, we are consistent with the majority on the issues. But if we pick B, then we get Q and not F, which contradicts the majority on F. Similarly, if we pick C, we get not Q and F, which contradicts the majority on Q.

  So the tie-breaking rule in the package vote might not respect the majority on individual issues. But if we break the tie by choosing the package that matches the majority on the individual issues (if possible), then we might get a consistent set. However, note: in our example, the set {Q, F} (package A) matches the majority on Q and F. But the problem is that the package vote procedure as described doesn't look at the individual issues. It only looks at the package votes.

  Alternatively, we might design a procedure that first checks for a consistent package that has majority support on each issue? But that might be complex. However, the main point is that by moving to package voting (or holistic aggregation) we avoid the inconsistency but we may have to accept that the group's judgment on a particular issue might not be the majority view on that issue (if we break the tie arbitrarily). But if we have a clear majority package, then it will be.

  Therefore, the package vote does escape the inconsistency because it only considers consistent packages. But it might not always yield a unique outcome (if there is no majority package). And even when it does, it might not reflect the majority on each issue (if the majority on the issues does not form a consistent package that any member holds). However, in the example, the majority on the issues (Q and F) does form a consistent package (A) but no member holds it? Actually, Member 1 holds it. So it is available. But what if no member holds the package that is the majority on every issue? Then we might have to choose a package that is not held by any member? But that might be less legitimate.

  But note: step (1) requires that the collective decision is fixed by the individual judgments. In the package vote, the collective decision is one of the packages that some member holds (if we only allow packages that are held by at least one member). Then we are aggregating over the packages that the members hold. This satisfies step (1) because it is a function of the individual package choices (and we treat them equally by having each member vote for one package). And we avoid inconsistency because we choose a consistent package. But step (2) is violated because the verdict on a particular issue (say, Q) is not determined solely by the members' judgments on Q, but by which package wins. The package win depends on the entire distribution of package votes.

  So the cost of rejecting step (2) is that we lose issue-independence. We are forced to consider the entire set of judgments at once. This might be seen as a cost because it increases the complexity of the decision and may require the group to vote on entire platforms (which might be harder to evaluate). But it avoids the inconsistency.

  Alternatively, we might try to reject step (4). But step (4) seems compelling: an inconsistent set of judgments is not a coherent decision. How can we act on it? We must resolve the inconsistency by some means. That means we are effectively rejecting the inconsistent set and replacing it with a consistent one, which is what holistic methods do.

  Therefore, I recommend rejecting step (2). The cost is that we must allow the group's judgment on one issue to be influenced by their judgments on other issues. But that is natural because the issues are interconnected.

  As for the package vote: it does escape the paradox by ensuring consistency, but at the cost of possibly not reflecting the majority on each issue (if we break a tie arbitrarily). However, it satisfies step (1) and avoids the inconsistency. So it is a legitimate way to make collective decisions if we are willing to drop step (2).

  In summary:

  - To break the argument, we reject step (2). Step (2) is the requirement of issue-independence.

  - Why it looked plausible: because it seems natural that the group's view on qualification should be determined only by the members' views on qualification. But the paradox shows that if we do that on every issue independently, we can get an inconsistency.

