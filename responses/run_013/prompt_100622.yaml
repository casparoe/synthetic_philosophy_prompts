prompt: |-
  I'm in Year 12 and I've somehow ended up running the economics society at my sixth form — we meet on Wednesdays, there's about eighteen of us, and next week it's my turn to take the whole fifty minutes. I want to do it on price controls, rent control and the minimum wage, because I've been reading about the housing situation in my city (my cousin spent four months looking for a flat and kept getting outbid by people paying over the asking rent) and every time I try to argue about it with my mates we just end up shouting past each other — one lot says "it's just supply and demand, it's definately going to backfire", the other lot says "but people need somewhere to live, that's the whole point". I don't want to give a talk, I want to set up a game or role-play where they actually feel the thing rather than hear me say it. The part I find genuinely unsettling, and the part I'd like them to trip over, is that when you cap a price the shortage doesn't disappear, it just changes who gets to decide and who quietly gets nothing — and the people who lose are the ones who aren't in the room to complain, so you can argue about it for hours without ever seeing who actually pays. I'd also quite like it if the rationing has to happen anyway somehow — a queue, or the landlord just picking whoever he fancies, or people paying something under the table — because that's the bit that feels unfair to me and I can't work out whether that's a reason against the policy or just a reason against landlords. And if you can get the minimum-wage version in there too, where the shop responds by cutting everyone's hours or working them harder rather than firing anyone outright, that would be brilliant, since that's the bit I never see anyone mention.

  So please design me one session I can actually run: the rules, what materials I need to print or hand out, how the roles get assigned, a payoff or scoring scheme that works without real money (we're completely broke), a rough timeline for the fifty minutes, and then a debrief that goes back over what just happened and points at exactly where in the game each piece of the idea showed up — plus the honest bit about which part of the idea the game can't reproduce and that I'll have to just say out loud myself. Don't give me a lecture to deliver at the start; ideally they should build the thing themselves and only get the label at the end.

  Please commit to one design rather than giving me three options and leaving me to pick — make the definite calls (who's in the room, who's conveniently not, what counts as winning, where the hidden margin is) and tell me why you made them. And be straight with me about what will predictably go wrong the first time I run it and what I should do on the spot when it does.
reasoning: |-
  Okay, let me tackle this Year 12 economics society request. The user wants a hands-on session about price controls, specifically rent control and minimum wage, where students experience the consequences rather than just hearing a lecture. 

  First, unpacking the user's core needs:
  - They want participants to feel the invisible consequences of price caps, especially how shortages shift allocation power and exclude vulnerable groups
  - They want to highlight non-obvious rationing mechanisms (queues, favoritism, under-the-table payments)
  - They need to incorporate minimum wage effects like hour cuts rather than just layoffs
  - The design must be zero-cost and fit in 50 minutes
  - Debrief should explicitly connect game mechanics to real-world concepts

  Hmm... the hardest part will be simulating the "invisible losers" aspect. Real-world rationing excludes people who aren't even in the negotiation room - but in a game, all players are present. How to create that absence? 

  Idea: Design asymmetric roles where some players start with disadvantages (e.g., low time/money reserves) that make them drop out early. Their silent exit then demonstrates how systems filter out vulnerable groups. For rent control, tenants could have hidden "reserve times" - those who can't queue long enough vanish from the game.

  For minimum wage, instead of firing, we'll force hour cuts by making work output requirements. Students will see how businesses maintain productivity with fewer hours by intensifying work. 

  Materials must be dead simple: Paper tokens, printed role cards, a timer. Scoring via "survival points" avoids real money. 

  Predictable issues:
  - Early chaos during trading rounds - need strict time limits
  - Some roles might feel boring (e.g., excluded tenants) - counter by giving them observation tasks
  - Debrief could run over - will provide clear time anchors

  The debrief structure is crucial. We'll use Socratic questioning: "Who noticed X? Where did Y appear?" before naming concepts like deadweight loss. 

  Biggest artificiality: The game can't show long-term supply shrinkage (e.g., landlords exiting market). Must explicitly state this during debrief.

  Final structure:
  1. Quick setup (5 min)
  2. Rent control rounds (15 min)
  3. Min wage rounds (15 min)
  4. Debrief (15 min)

  Role design is key - landlords, tenants, workers, employers, with baked-in inequalities. The "invisible loser" effect emerges when disadvantaged players quietly fail objectives.
answer: |-
  Here's a complete, ready-to-run session plan focused on making the unintended consequences of price controls visceral. It forces players to confront rationing mechanisms and hidden trade-offs.

  **Core Insight:** Price ceilings don't eliminate scarcity; they shift decision-making power and invisibly exclude vulnerable participants. Minimum wage hikes can lead to non-firing adjustments (hours, intensity) that hurt workers.

  **Session Title:** "The Allocation Game: Who Gets What When Prices Can't Move?"

  **Materials Needed (All Printable):**
  1. **Role Cards (Print 1 set):** 
      *   Landlord (x1)
      *   Employer (x1)
      *   Tenant (x8 - Labeled T1 to T8)
      *   Worker (x8 - Labeled W1 to W8)
  2. **Resource Tokens (Print & Cut):**
      *   "Flat" Cards (x8 - Simple rectangles)
      *   "Hour" Tokens (x40 - Small circles/squares)
      *   "Money" Tokens (x100 - Different shaped circles/squares). Denominations: 20x £1, 40x £5, 20x £10, 20x £20. *No need for realism, just distinct values.*
  3. **"Basic Survival Needs" Trackers (x16 - Small slips):** Each has 3 boxes: [SHELTER] [ ] [INCOME]. Workers/Tenants start with SHELTER & INCOME boxes blank.
  4. **Timer (Your phone or a visible clock)**
  5. **Sign: "Market Rules - Set by the Chancellor"** (You'll write rules here during the game)
  6. **Whiteboard/Flip Chart for Debrief Notes**

  **Setup (5 mins):**
  1. **Assign Roles:** Hand out Role Cards randomly. Landlord & Employer get their cards. Tenants (T1-T8) and Workers (W1-W8) get their cards + a "Basic Survival Needs" tracker.
  2. **Distribute Resources:**
      *   **Landlord:** Gets all 8 "Flat" cards. Gets starting money: £50 (e.g., 2x £20 + 1x £10).
      *   **Employer:** Gets all 40 "Hour" tokens. Gets starting money: £100 (e.g., 2x £20 + 6x £10).
      *   **Tenants (T1-T8):** Give T1 & T2: £50 each. T3 & T4: £30 each. T5 & T6: £20 each. T7 & T8: £10 each. *NO Flats yet.*
      *   **Workers (W1-W8):** Give W1 & W2: 5 "Hour" tokens each. W3 & W4: 4 tokens. W5 & W6: 3 tokens. W7 & W8: 2 tokens. *NO Money yet.*
  3. **Explain Core Goal:** "Your goal is simple: Fill your 'Basic Survival Needs' tracker. Tenants need [SHELTER]. Workers need [INCOME]. Landlords and Employers want to maximize their money. Survival depends on getting your need met. Game lasts multiple short rounds."
  4. **Market Rules Sign:** Start BLANK.

  **Phase 1: Free Market (Rent & Wages) - (10 mins)**
  1. **Announce:** "This is the free market. Landlord, set your monthly rent price per flat. Employer, set the hourly wage you'll pay."
  2. **Landlord/Employer Set Prices:** They whisper their chosen prices to you. Write them BIG on the "Market Rules" sign (e.g., "RENT: £30/mo", "WAGE: £5/hr"). *Expect Rent ~£25-£40, Wage ~£4-£6.*
  3. **Trading Round (3 mins):** CHAOS!
      *   **Landlord:** Sells Flats to Tenants. Tenants pay rent IN CASH upfront for one month. Landlord keeps money.
      *   **Employer:** "Hires" Workers by buying their Hour tokens. Pays cash = Wage x Hours bought. Workers get cash.
      *   **Key:** Landlord/Employer can choose WHO they trade with and how much (e.g., Landlord can rent 1 flat to 1 tenant, Employer can buy 2 hours from Worker A, 3 from Worker B).
  4. **Check Survival (1 min):**
      *   **Tenants:** If they RENTED a flat, mark [SHELTER]. If not, leave blank.
      *   **Workers:** Calculate INCOME: `(Wage x Hours Sold)`. If >= £15, mark [INCOME]. If < £15, leave blank. *(£15 = arbitrary "basic need" threshold)*
      *   **Landlord/Employer:** Count their total cash. Highest wins a "Bonus Token" (just a marked paper) worth +2 "imaginary prestige points" (explain prestige is for winning).
  5. **Quick Results:** Ask: "Who got SHELTER? Who got INCOME?" Note (privately) who missed out (likely poorer tenants/workers). Reset Flats/Hours to Landlord/Employer. Tenants/Workers KEEP their money.

  **Phase 2: Rent Control - (10 mins)**
  1. **Announce:** "Housing crisis! Chancellor imposes Rent Control! Maximum rent is now £15/month." **WRITE OVER** the old Rent on the Sign. Wage stays the same.
  2. **Landlord Reaction (1 min):** Landlord *must* set rent at £15. BUT, tell Landlord privately: "You have maintenance costs. Each flat rented earns you only £5 profit (£15 rent - £10 cost). You decide how many flats to make available (0-8)." *Landlord will likely offer fewer flats (e.g., 4-5) due to lower profit.*
  3. **Trading Round (3 mins):** CHAOS AGAIN!
      *   **Landlord:** Announces HOW MANY flats are available (e.g., "Only 4 flats for rent!"). Chooses WHICH Tenants get them (at £15 each). *Observe how they choose (e.g., friends, offers of side deals, first-come?).*
      *   **Tenants:** May offer "Key Money" (cash bribes) or "Furniture Purchase" (overpaying for a pretend item) to the Landlord UNDER THE TABLE to get a flat. **Allow this!** It's the "hidden margin".
      *   **Employer/Workers:** Trade as before (Wage unchanged).
  4. **Check Survival (1 min):**
      *   **Tenants:** Got a flat? Mark [SHELTER]. Did you pay extra? Note it.
      *   **Workers:** Income >= £15? Mark [INCOME].
      *   **Landlord:** Total Cash (including bribes!). Compare to Employer. Highest cash gets Bonus Token.
  5. **Consequences:** Ask: "Who got SHELTER NOW? Was it the same people? Who offered extra? Who couldn't? Who didn't even get a CHANCE because fewer flats existed?" **Highlight the visible queue/favoritism and the invisible excluded (e.g., T7/T8).**

  **Phase 3: Minimum Wage Hike - (10 mins)**
  1. **Announce:** "Living Wage Campaign! Chancellor sets Minimum Wage at £8/hr!" **WRITE OVER** the old Wage on the Sign. Rent Control (£15) still applies.
  2. **Employer Reaction (1 min):** Employer *must* pay £8/hr. BUT, tell Employer privately: "Your business model relies on total labor cost. You MUST get exactly 30 'Work Units' produced to stay open. Each 'Hour' token you buy provides work, but you can demand workers work HARDER: You decide the 'Effort Level' (1x, 1.5x, or 2x). Effort Level multiplies the Work Units per Hour *but tires workers*. E.g., 1x Effort: 1 Hour = 1 Unit. 1.5x: 1 Hour = 1.5 Units. 2x: 1 Hour = 2 Units. Choose Effort Level and buy Hours to hit *exactly* 30 Units." *Employer will likely choose higher effort (1.5x or 2x) and buy FEWER total hours.*
  3. **Trading Round (3 mins):**
      *   **Employer:** Announces Effort Level and HOW MANY total hours they need to buy to make 30 Units (e.g., 20 hours at 1.5x Effort). Chooses WHICH Workers to buy from. Pays £8 per hour. *Likely favours workers with more hours initially.*
      *   **Workers:** Sell Hours. BUT, if Employer demands >1x Effort, workers feel the strain (no game penalty, but note it).
      *   **Landlord/Tenants:** Trade as under Rent Control (£15 max, bribes possible).
  4. **Check Survival (1 min):**
      *   **Tenants:** Mark [SHELTER] if they got a flat.
      *   **Workers:** Calculate INCOME: `(£8 x Hours Sold)`. If >= £15, mark [INCOME]. **CRITICAL:** Note if workers sold FEWER hours than they have/want (underemployment) or if the work felt harder (intensification).
      *   **Landlord/Employer:** Total Cash. Bonus Token to highest.
  5. **Consequences:** Ask: "Workers, how many hours did you ACTUALLY sell? How hard did you have to work? Who got INCOME now? Was it easier or harder than before? Did anyone have hours they WANTED to sell but couldn't?" **Highlight reduced hours, increased effort, and potential exclusion.**

  **Debrief (15 mins - GUIDE THEM, DON'T LECTURE):**
  *   **Step 1: Feelings (2 mins):** "Quick reactions? What felt fair/unfair? When were you stressed/frustrated?" *Note emotions.*
  *   **Step 2: What Happened? (Supply/Demand Basics) (3 mins):**
      *   "Free Market: Who got what? Why did some miss out?" *(Income/wealth differences)*
      *   "Rent Control: What changed? Why were fewer flats available?" *(Landlord profit fell, reduced supply)*. "How were the few flats allocated?" *(Queues, favoritism, bribes - RATIONING MECHANISMS)*. "Who definitely lost out?" *(Those excluded entirely, those too poor to bribe - THE INVISIBLE LOSERS)*
      *   "Minimum Wage: How did the Employer adapt?" *(Higher effort, bought fewer hours - NON-FIRING ADJUSTMENTS)*. "What did this mean for Workers?" *(Underemployment, harder work - HIDDEN COSTS)*. "Did higher wage guarantee more workers met their [INCOME] need?" *(Likely not, due to fewer hours sold)*.
  *   **Step 3: The Core Insight - The Shifting Power of Scarcity (5 mins):**
      *   "When we capped rent, did the shortage of flats disappear?" *(No!)* "What changed about WHO decided who got a flat?" *(Landlord shifted from "highest bidder" to "who I like/who bribes me")*. "Who wasn't even in the running?" *(T7/T8 types - no cash for bribes, maybe couldn't push to the front)*. "**The shortage didn't vanish; the power to ration it shifted, and the most vulnerable were quietly excluded.**"
      *   "With the minimum wage, did the cost of labor disappear?" *(No!)* "How did the business adapt without mass firings?" *(Cut hours, demanded harder work)*. "Who bore this cost?" *(Workers - less pay than expected for the hours they *wanted*, harder work)*. "**The policy cost didn't vanish; it was shifted onto workers in less visible ways.**"
  *   **Step 4: The Uncomfortable Trade-offs & Your City (4 mins):**
      *   "Is the Landlord the 'villain' in rent control? Or just responding to incentives?" *(Incentives matter - low profit -> less supply)*.
      *   "Are queues or bribes *worse* than high prices? Who decides?" *(Subjective! High prices exclude poor; queues/bribes favor connected/wealthy/aggressive - DIFFERENT FAIRNESS)*.
      *   "Minimum wage: Is underemployment better than unemployment? Is harder work a fair trade for higher hourly pay?" *(Complex trade-offs)*.
      *   "Your cousin's story: Outbid on rent. A price cap might stop that... but what new problems might emerge based on this game?" *(Shortage, landlord favoritism, reduced quality/maintenance long-term, black market)*. "Does that mean 'do nothing'? Not necessarily! But it shows why just capping the price often backfires."
  *   **Step 5: The Honest Bit - What the Game CAN'T Show (1 min):**
      *   "This game shows short-term rationing. **What it CAN'T show is the long-term collapse in supply.** Landlords stop building or maintaining flats. Employers automate jobs or never create them. The shortage gets *worse* over time, hurting *everyone*, especially new renters/workers. That's the biggest, slow-moving danger of badly designed price controls."

  **Why This Design?**
  *   **Who's In/Out:** Landlord/Employer (decision-makers), Tenants/Workers (diverse economic vulnerability). The "invisible losers" are simulated by T7/T8/W7/W8 being perpetually excluded or forced into bad deals. *They are in the room but powerless, mimicking exclusion.*
  *   **Winning:** Explicit survival for Tenants/Workers (visceral need), cash for Landlord/Employer (profit motive). Bonus token adds minor competition. *Highlights the conflict between policy goals (survival) and market incentives (profit).*
  *   **Hidden Margins:** Explicitly built-in: Bribes ("key money") for rent, Effort Level for min wage. *Forces players to engage with the hidden, often unfair, ways scarcity manifests.*
  *   **Non-Firing Adjustments:** Effort Level mechanic *directly* simulates intensification. Reduced hours bought simulates underemployment. *Avoids the simplistic "firing" narrative.*
  *   **Feeling the Shortage:** Players *experience* the scramble for scarce flats/hours. They *see* fewer flats/hours offered post-control. They *are* the ones excluded or forced into bribes/harder work.

  **Predictable Problems & Fixes:**
  1.  **Chaotic Trading Rounds:** Players shout, deals take too long.
      *   **Fix:** Strict 3-min timer. Announce "30 seconds left!". Be a visible timekeeper. Remind Landlord/Employer they MUST choose quickly.
  2.  **Landlord/Employer Confusion:** They might not grasp their private incentives (profit margin, work units).
      *   **Fix:** Explain their private rules CLEARLY and QUIETLY before the round starts. Have it written on their Role Card if needed. Ask: "So, how many flats will you offer?" / "What Effort Level?" before starting trading.
  3.  **Boredom for Excluded Players:** T7/T8 might do nothing in Rent Control round.
      *   **Fix:** Give them an observer task: "Note down HOW the Landlord chooses who gets flats" or "Count how many bribes you see." Involve them in debrief. Emphasize *their experience IS the point* - being excluded is the lesson.
  4.  **"It's Not Fair!":** Complaints about starting money/roles.
      *   **Fix:** "Life isn't fair. Different starting points exist. The game explores how policies work *despite* that inequality. Your frustration is valid data!"
  5.  **Debrief Runs Over:** 15 mins is tight.
      *   **Fix:** Stick ruthlessly to the timings above. Use direct questions: "What did the Landlord DO when rent was capped?" rather than open discussion initially. Focus on the core insights. You can continue the discussion next week.
  6.  **Side Deals Get Silly:** E.g., Workers offering to clean Landlord's car.
      *   **Fix:** Gently steer it back: "Interesting! That's like offering services under the table. But for scoring, focus on money/hours/flats."

  **Run it boldly.** Your goal isn't consensus; it's creating the shared experience of the unintended consequences. The frustration, the exclusion, the hidden deals, the harder work – that's the "feeling the thing" moment. The debrief connects that feeling to the economics. Good luck!
