prompt: |-
  I build automated credibility-scoring systems, so I think in priors over source reliability, likelihood ratios, calibration curves, false-positive/false-negative trade-offs, feature dictionaries, embedding spaces, and training distributions I can't step outside of. I've read enough of the epistemic injustice literature to follow its shape — testimonial injustice as identity-tracking credibility deficit (and excess), hermeneutical injustice as a gap in the collective interpretive resources, hermeneutical marginalization as unequal participation in producing those resources, and the suggestion that such gaps can be structurally produced without any particular person being at fault — but I don't know the arguments well enough to test them. Restate the central claims of that literature in my vocabulary, one claim at a time, as faithfully as you can, and then give me the residue report: what carried over, what carried over only with distortion, and what has no counterpart in my terms at all. Hold the translation honest — don't let "credibility" quietly become a property of the source, don't let a hermeneutical gap quietly become an under-covered region of feature space, and don't let "unjust" quietly become "inaccurate", unless you say exactly what that move costs and to whom.

  Structure the response as follows:

  - **The vocabulary I'm bringing** — one short paragraph, my primitives stated plainly enough that you can be held to them.
  - **Translation** — each central claim restated in my terms, one short paragraph per claim (roughly 700 words total).
  - **Clean translations** — what mapped without loss, with the mapping stated explicitly (roughly 200 words).
  - **Translations under strain** — what went through only by bending one side or the other, and which side bent (roughly 300 words).
  - **No counterpart** — what I have no way to say at all (roughly 300 words).
  - **Diagnosis** — for each piece of residue, whether it is a blind spot of my framework or a sign that the original claim was doing less than it appeared, plus anything in the original that survives in my vocabulary only as rhetoric (roughly 300 words).
reasoning: |-
  Okay, the user is building automated credibility systems and wants to map epistemic injustice concepts to their technical framework. They've clearly studied both fields but need help bridging the gap without losing philosophical nuance. 

  First, I need to understand their vocabulary deeply. Their credibility scoring revolves around measurable priors, likelihood ratios, and calibration curves - all quantitative metrics. Crucially, they treat credibility as a property assigned by the system, not inherent to sources. This distinction will be vital for accurate translation.

  The epistemic injustice concepts they reference (testimonial injustice, hermeneutical injustice etc.) come from Miranda Fricker's work. These are fundamentally about social power dynamics affecting knowledge distribution. The challenge is expressing power asymmetries in their statistical framework without reductionism.

  For the translation section:
  Testimonial injustice maps cleanly to systematic miscalibration where identity features improperly influence credibility scores. But I must emphasize this isn't just statistical bias - it's a moral wrong where the system becomes complicit in discrimination. 

  Hermeneutical injustice is trickier. Their "under-covered feature space" analogy works for data gaps, but misses how marginalized groups actively develop alternative interpretive frameworks that get excluded. Their system might detect missing terms but not suppressed meanings.

  Hermeneutical marginalization has no direct counterpart. Their training data reflects existing power structures but can't model how those structures determine whose knowledge gets collected in the first place. This is a structural blind spot.

  The residue analysis needs to show:
  Where quantitative terms capture phenomena adequately (like calibration curves for testimonial injustice)
  Where they distort (reducing hermeneutical injustice to sparse data oversimplifies power dynamics)
  Where they fail completely (their framework can't handle the collective, historical nature of hermeneutical resources)

  Finally, the diagnosis should acknowledge that their statistical approach excels at detecting local biases but can't see its own role in maintaining epistemic power structures. The "injustice" aspect gets reduced to "inaccuracy" unless I constantly flag the moral dimension.

  User's clearly sophisticated - they explicitly warned against quiet equivalences ("don't let unjust become inaccurate"). This demands extreme precision in mapping. Their frustration with philosophy surviving only as rhetoric suggests they want operationalizable insights, so I'll highlight concrete system implications where possible.
answer: |-
  ### **The Vocabulary I'm Bringing**  
  Credibility is a *system-assigned score*, derived from observed features (text, metadata, behavior) against a labeled training distribution. Priors represent base-rate source reliability, likelihood ratios update credibility given new evidence, calibration curves measure scoring accuracy against ground truth. False positives (over-credibility) and false negatives (under-credibility) are competing errors. Feature dictionaries and embedding spaces encode inputs; training distributions define the world the system knows. "Unjust" is not a native term—accuracy is measured via ground truth alignment.

  ---

  ### **Translation**  
  1. **Testimonial Injustice (Identity-Based Credibility Deficit)**  
     Your system assigns lower credibility scores to certain identity groups, despite equivalent ground-truth reliability. This manifests as a *systematic calibration error*: for a fixed ground-truth reliability prior, the likelihood ratio adjustment based on identity features (e.g., race/gender tokens in text) is directionally skewed. The result is higher false-negative rates for these groups. Critically, this occurs even when identity features are non-predictive of reliability in an unbiased training distribution—meaning the distortion arises from flawed feature weighting or biased labels.

  2. **Hermeneutical Injustice (Interpretive Resource Gaps)**  
     Your embedding space lacks dimensions to represent experiences of marginalized groups, creating regions where inputs are mapped incoherently. When users describe phenomena unique to their experience (e.g., workplace microaggressions), the system’s feature extractor generates low-fidelity embeddings because the training data under-represents these concepts. This forces narratives into incorrect clusters ("mis-embedding"), lowering credibility scores due to apparent incoherence—even when the testimony is ground-truth reliable.

  3. **Hermeneutical Marginalization (Uneven Resource Production)**  
     The *process defining your training distribution* disproportionately samples inputs from dominant groups. Marginalized groups have fewer opportunities to contribute narratives, causing their experiences to be underspecified in your feature dictionary. This sampling bias isn’t random; it correlates with power structures (e.g., platform access, content moderation policies). Your system’s "ground truth" labels thus reflect majority interpretations, reinforcing under-coverage in embedding spaces.

  4. **Structural Injustice (No Single Fault)**  
     Your system’s credibility errors emerge from *cascading failures in the training pipeline*: biased data collection (non-representative sampling), skewed labeling (annotators from dominant groups), and feature engineering blind spots (e.g., ignoring non-dominant linguistic registers). No single component is miscalibrated in isolation, but the pipeline interaction amplifies errors for marginalized groups. This occurs despite individual pipeline steps appearing "optimal" under standard loss functions.

  ---

  ### **Clean Translations**  
  - **Testimonial Injustice → Skewed Calibration Curve**: Identity features improperly shift likelihood ratios, increasing false negatives for specific groups. Mapping: "Credibility deficit" = miscalibration where predicted scores understate actual reliability.  
  - **Structural Production → Pipeline Cascade**: Hermeneutical gaps arise from compounding sampling/labeling/engineering choices, not single-point failures. Mapping: "Structural cause" = emergent error from interactions of "optimal" subsystems.  
  - **Hermeneutical Injustice → Embedding Under-Coverage**: Low-dimensional representations of minority concepts reduce input fidelity. Mapping: "Interpretive gap" = regions of embedding space with high reconstruction loss due to sparse training data.  

  ---

  ### **Translations Under Strain**  
  1. **Hermeneutical Injustice ≠ Sparse Feature Coverage**  
     *Your side bends:* You reduce "lack of collective interpretive resources" to *statistical under-representation* in training data. But hermeneutical injustice claims the *concepts themselves* are missing from society’s understanding—not just your dataset. Your framing implies more data fixes the gap; the original claims marginalized groups *invent* new concepts outside existing frameworks (e.g., "sexual harassment" pre-1970s). Your vocabulary cannot articulate *novel* hermeneutical resources.  

  2. **Credibility ≠ System Score**  
     *Original side bends:* Epistemic injustice treats credibility as *socially negotiated*, not system-assigned. Your "calibration error" frames injustice as *technical misalignment* (score vs. ground truth). The original claims injustice persists even with "accurate" scores if ground truth labels reflect dominant perspectives (e.g., dismissing lived experience as "anecdotal"). Your model can’t question ground truth legitimacy.  

  3. **Injustice ≠ Inaccuracy**  
     *Both sides bend:* You map "unjust" to distributional errors (e.g., higher FNR for Group X). But epistemic injustice is *moral* harm (denying personhood), not statistical harm. Your terms can quantify disparate impact but not the *wrong* of silencing someone. "False negative" implies ground truth exists; testimonial injustice denies that such truth is accessible when hermeneutical gaps exist.  

  ---

  ### **No Counterpart**  
  1. **Testimonial Injustice as Identity *Constitutive***  
     Your system treats identity as a feature vector. Epistemic injustice claims identity *shapes the perception of credibility itself*—e.g., "female" isn’t a feature but a lens distorting *all* feature interpretations. No counterpart for how identity alters the *meaning* of other features (e.g., "assertiveness" lowering female credibility but raising male credibility).  

  2. **Hermeneutical Resources as *Collective Social Artefacts***  
     Your "feature dictionary" is built from data. Hermeneutical resources are *publicly shared meanings* produced through social struggle (e.g., #MeToo redefining consent). Your system can’t model how *new* resources emerge from marginalized activism, nor how scoring systems might suppress them by amplifying dominant narratives.  

  3. **Credibility Excess as Harm**  
     You track false positives (over-credibility) as an accuracy error. No counterpart for *moral harm* when dominant groups receive undue credibility (e.g., amplifying harmful stereotypes). Your loss function can’t penalize "excess credibility" as unjust—only as overconfidence.  

  ---

  ### **Diagnosis**  
  - **Blind Spots in Your Framework**:  
    1. *Static Ground Truth*: Your reliance on labeled data assumes ground truth is objective and accessible. Epistemic injustice reveals labeling as *hermeneutically contested*—e.g., medical gaslighting where patient testimony is deemed "unreliable" by authoritative labels.  
    2. *Individualized Credibility*: You score sources in isolation. No capacity to model how assigning credibility to *one group* actively *diminishes* another’s (e.g., privileging "expert" voices erases community knowledge).  
    3. *Neutrality of Features*: Identity features are inputs; you miss how their *social salience* dynamically shapes interpretation (e.g., race altering the meaning of "articulate").  

  - **Rhetoric Surviving as Gloss**:  
    "Structural without fault" maps cleanly to pipeline failures, but the moral charge of "injustice" becomes *descriptive* (bias magnitude). The original’s call for *responsibility* (even without blame) has no technical expression—it survives only as a fairness constraint.  

  - **Original Claims Doing Less**:  
    Hermeneutical injustice’s focus on "gaps" risks implying marginalized groups lack agency. Your framework *exposes* this by showing how "gap" rhetoric obscures active hermeneutical *innovation* (e.g., minority hashtags creating new embeddings)—forcing the literature to confront its own omissions.  

  **Conclusion**: Your vocabulary excels at diagnosing *distortions* but not their *moral genesis*. It captures *what is mis-scored* but not *why scoring itself* can be violent when hermeneutical resources are asymmetrically controlled. The residue reveals a need for *ground truth critique*—without it, "accuracy" entrenches epistemic hegemony.
