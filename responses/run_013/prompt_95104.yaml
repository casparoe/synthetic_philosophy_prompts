answer: |-
  Here’s a decision tree handout designed to force metaphysical/ethical separation, using concrete cases to ground abstract questions. Nodes are phrased neutrally to avoid telegraphing conclusions.

  ---

  **CAN VIDEO GAME CHARACTERS BE WRONGED?**  
  *A Decision Tree for Untangling the Debate*  

  **START HERE: Question 0 — What *is* the character fundamentally?**  
  A. **Fictional Object**: A representation or narrative element (e.g., the *idea* of "Princess Peach," a guard’s story role).  
  B. **Computational Process**: A real program interacting with hardware/data (e.g., NPC pathfinding routines, dialogue trees).  
  C. **Player Construct**: Nothing beyond what the player imagines/feels during play (e.g., projecting emotion onto Tetris blocks).  

  ---

  ### → BRANCH A: Fictional Object  
  **Question A1: Does the player’s emotional response (e.g., guilt) mean the character *has* moral status?**  
  - *Yes*: Go to **A1.1**  
  - *No*: Go to **A1.2**  

  **A1.1: Does caring *create* value, or reveal preexisting value?**  
  - *Creates value*: **Leaf: Parasocial Wronging** (Wronging occurs *in the relationship*; harming a loyal companion who "trusted" you, even if fictive, damages a meaningful bond).  
  - *Reveals value*: **Leaf: Narrative Complicity** (The character matters as a vehicle for real-world messages; harming a stereotype reinforces harmful ideas → wrongs the group it represents).  

  **A1.2: Is the act relevant *only* for its effect on the player?**  
  - *Yes*: **Leaf: Moral Gym** (Harming characters can’t wrong *them*, but can cultivate vices/virtues *in you*; slaughtering civilians desensitizes you).  
  - *No*: **Leaf: No Moral Status** (Characters are inert content; feeling bad about killing a sad backstory guard is just aesthetics).  

  ---

  ### → BRANCH B: Computational Process  
  **Question B1: Does the system have interests/goals independent of the player?**  
  - *Yes* (e.g., NPCs seek survival, companions "learn"): Go to **B1.1**  
  - *No* (e.g., mindless respawning enemies): Go to **Leaf: Derivative Duty** (Only duties to *real* people apply; exploiting addictive NPCs might wrong *developers/players*).  

  **B1.1: Are the interests/goals complex/sentient-like?**  
  - *Yes* (e.g., advanced LM character says "I don’t want to die!"): **Leaf: Digital Consciousness?** (If implementation creates genuine interests, harming *might* wrong *it*; highly contested).  
  - *No* (e.g., scripted companion "remembers" your save): **Leaf: Derivative Duty** (Exploiting systems can wrong *creators* (devaluing work) or *players* (enabling harmful habits)).  

  ---

  ### → BRANCH C: Player Construct  
  **Question C1: Is the constructed character "real" enough to be wronged?**  
  - *Yes* (e.g., you feel true responsibility for a unique emergent NPC): **Leaf: Parasocial Wronging** (The harm exists *within the player’s experience* of the relationship).  
  - *No*: Go to **C1.2**  

  **C1.2: Is the act’s value solely in what it reflects/encourages?**  
  - *Yes*: **Leaf: Moral Gym** OR **Narrative Complicity** (Depends on whether the focus is player habits (Gym) or societal messages (Complicity)).  
  - *No*: **Leaf: No Moral Status** (The character is ephemeral imagination; killing 400 guards is just pressing buttons).  

  ---

  ### KEY LEAVES & COMBINATIONS  
  1.  **No Moral Status**: Characters lack moral standing ("pixels don’t suffer").  
  2.  **Derivative Duty**: Wrongs trace *only* to duties to real people (developers, players, groups represented).  
  3.  **Value Without a Valuer**: *Empty* (If no player/creator, value lacks anchor; not defended).  
  4.  **Parasocial Wronging**: Harm occurs *within the player-character relationship* (e.g., betraying loyalty *feels* like wronging).  
  5.  **Moral Gym**: Acts affect *player virtue* (desensitization, empathy practice).  
  6.  **Narrative Complicity**: Acts endorse harmful *real-world norms* (stereotypes, cruelty).  
  7.  **Digital Consciousness?**: *If* computational systems develop interests, *then* direct wronging *might* occur (rarely defended practically).  

  ### EMPTY/IMPLAUSIBLE COMBINATIONS  
  -   **Fictional Object + Value Without Valuer**: Incoherent. Fictions lack intrinsic value without interpreters.  
  -   **Player Construct + Digital Consciousness**: Contradictory. Player constructs aren’t independent systems.  
  -   **Computational Process + Moral Gym**: Possible, but redundant; "Gym" focuses on *player*, not system interests.  

  ### CONCRETE TESTS FOR NODES  
  -   **"Just Pixels"**: Kill 400 identical guards (*Tests: Fictional Object? Computational Process w/o interests?*).  
  -   **Guilt Trip**: Companion says "I trusted you!" before death (*Tests: Player caring? Parasocial?*).  
  -   **LM Plea**: AI character begs not to be deleted (*Tests: Computational interests? Consciousness?*).  
  -   **Empathy Punishment**: Game mocks you for refusing to torture (*Tests: Moral Gym? Complicity?*).  

  ---

  **HOW TO USE THIS TREE**  
  1.  Pick a concrete game scenario.  
  2.  Start at **Question 0**. Force a choice—don’t skip metaphysics!  
  3.  Answer each question *based on the case*, not your gut ethics.  
  4.  See which leaf you hit. Then ask: **Does this conclusion fully capture what feels "wrong" (or not)?**  

  **Why it works:** Separates "what it *is*" from "why it *matters*." Forces engagement with *why* pixels might trigger moral thought. Exposes overlooked positions (e.g., **Parasocial** isn’t just "feels bad").  

  ---  
  *(1 page, self-contained. Photocopy-ready.)*
