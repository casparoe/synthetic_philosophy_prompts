prompt: |-
  ok so I'm running a session for our phil of science group on Friedman's old line that a theory's assumptions dont need to be true, only its predictions need to be good, and I want to make it concrete instead of the usual frictionless-plane stuff. the thing is, the defense obviously works better for some assumptions than others and I cant articulate the pattern, so I want you to do the sorting for me.

  Take the assumptions below and tier them by how far the F-twist defense actually gets you — i.e. how much the unrealism is paid for by predictive success — and give each a rough 0-1 number (1 = totally covered, 0 = the defense is doing nothing). dont lump them all into one pile, and for each tier say what's doing the work.

  - no friction in classical mechanics
  - agents in a game are perfectly rational and it's common knowledge
  - populations are well mixed, everyone meets everyone with equal probability, in epidemic models
  - infinitely lived representative household in macro
  - infinite population size / no genetic drift in pop gen
  - the brain does exact Bayesian inference over the true generative model
  - and one of mine: in a model of scientific disagreement we assume every scientist's error term is independent of everyone else's, even though in the real field they all read the same two papers and copied the same mistake

  two other things while your in there: (1) I keep reaching for a distinction between an assumption that's a limiting case of something truer vs one that just posits something that isnt there at all — say where that line cuts across your tiers, and whether it lines up with the F-twist verdicts or not. (2) some of these I'd happily use for prediction and wouldnt touch for policy or intervention; flag which ones and say whether that's a different fault line than the Friedman one, cause I suspect it is and that his framing hides it.
reasoning: |-
  Okay, the user is preparing a philosophy of science session on Friedman's instrumentalism—the idea that a theory's assumptions don't need to be true as long as its predictions are good. They want concrete examples beyond the usual frictionless plane analogy and need help categorizing specific assumptions by how defensible they are under Friedman's view. 

  First, I notice the user is frustrated with vague discussions ("can't articulate the pattern") and wants rigor—they're clearly academically inclined but prefers applied thinking over abstraction. The examples they provided span economics, biology, physics, and even their own meta-example about scientific error terms, which shows they value interdisciplinary angles. 

  For the tiering task, I need to evaluate each assumption based on two core Friedman-esque criteria: (1) How much predictive success "pays for" the unrealism, and (2) Whether the assumption acts as a tractable limit case. The frictionless plane example is Friedman's classic defense, so that'll anchor Tier 1. But others like "perfect rationality" or "infinite populations" are trickier—they're useful approximations but crack under pressure (e.g., predicting bubbles or genetic drift effects). The user's own example about independent errors in science models feels especially brittle; it might not survive contact with real-world peer influence. 

  On the limiting-case distinction: Some assumptions (like frictionless mechanics) are asymptotic ideals—we can *approach* them experimentally. Others (like infinitely lived households) aren't limits of anything real; they're pure fictions. This distinction partially aligns with the tiers but isn't perfect. For instance, "well-mixed populations" in epidemiology is a limit case, yet its predictive power varies wildly between diseases—so I'd place it mid-tier. 

  The prediction-vs-policy split is crucial. Friedman only cares about prediction, but the user hints that some assumptions (e.g., rational agents) become dangerous for policy. That's absolutely a separate fault line. I'll flag which examples cross that Rubicon—like using game theory for market regulation or epidemic models for lockdowns—where idealized assumptions could mislead interventions. 

  Finally, the 0-1 scores need nuance. "Totally covered" (1) should mean the assumption's falsity rarely harms predictions in its domain (e.g., frictionless planes for ballistic trajectories). Lower scores reflect either fragility (Bayesian brains = 0.3) or domain mismatch (independent errors in science models = 0.1). The user will push back on some scores, and that's good—it'll fuel discussion. 

  ...Time to structure this tier-by-tier, with clear rationale per example and explicit callouts for the limiting-case/policy distinctions they asked about.
answer: |-
  Here's a tiered analysis of your assumptions using the Friedman "F-twist" defense, focusing on how effectively predictive success compensates for unrealism (with 0-1 scores), plus your requested addendums:

  **Tier System & Key Factors:**
  -   **Tractability:** Does the assumption make the problem computationally solvable?
  -   **Robustness:** Do predictions remain good despite the falsity of the assumption *in the model's intended domain*?
  -   **Asymptotic Justification:** Does the assumption approximate reality well *under specific conditions* (e.g., large N, low friction)?
  -   **Domain Specificity:** How narrowly or broadly is the model successfully applied?

  **Tiers & Assumptions:**

  1.  **Tier 1: Highly Defensible (F-Twist Strong) - Score: 0.9-1.0**
      *   **Assumption:** No friction in classical mechanics.
      *   **Why:** The *core work* is done by **asymptotic justification** and **robustness**. Friction is often small *relative to other forces* in the intended domain (e.g., orbital mechanics, projectile motion *in vacuum*). Predictions are excellent *precisely where friction is negligible*. Adding friction is tractable for specific cases. It's a clear *limiting case* (`F=0`) of a truer theory (friction exists). Predictive success in its domain is overwhelming.

  2.  **Tier 2: Moderately Defensible (F-Twist Works Contextually) - Score: 0.6-0.8**
      *   **Assumption:** Populations are well mixed, everyone meets everyone with equal probability (Epidemiology).
      *   **Why:** The *core work* is done by **tractability** and **asymptotic justification (for large, dense populations)**. While contact is never perfectly random, this assumption provides remarkably good predictions for *basic epidemic dynamics* (e.g., SIR model peak timing, final size) in large populations without strong social structure. Failures (e.g., superspreading, spatial effects) highlight the domain limits. It functions as a *limiting case* (infinite mixing speed) of more complex network models. Predictive success is good *for its core purpose*.
      *   **Assumption:** Infinite population size / no genetic drift (Population Genetics).
      *   **Why:** Similar to well-mixed populations. The *core work* is done by **tractability** and **asymptotic justification (for large N)**. Predictions about allele frequency change due to selection are excellent for large populations where drift is negligible. Drift is explicitly modeled *by relaxing this assumption*. It's a *limiting case* (`N → ∞`) of the Wright-Fisher model. Predictive success is high *for deterministic selection dynamics*.

  3.  **Tier 3: Weakly Defensible (F-Twist Frays Badly) - Score: 0.3-0.5**
      *   **Assumption:** Agents in a game are perfectly rational and it's common knowledge.
      *   **Why:** The *core work* is **tractability**, but **robustness is severely lacking**. While foundational and tractable, predictions often fail spectacularly in real-world strategic interactions (ultimatum game, centipede game, bubbles, cooperation dilemmas). Bounded rationality, learning, and heterogeneous beliefs are crucial. It's *not* a good limiting case of bounded rationality models. Predictive success is mixed and context-dependent, failing precisely where human irrationality or incomplete information dominate.
      *   **Assumption:** Infinitely lived representative household (Macroeconomics).
      *   **Why:** The *core work* is **tractability** and **analytical convenience for long-run steady states**, but **robustness is poor for dynamics/short-run**. Fails to capture life-cycle effects, heterogeneity, myopia, and liquidity constraints crucial for consumption/saving/investment behavior and policy analysis (e.g., fiscal multipliers, wealth distribution). Overlapping generations (OLG) models exist but are harder. It's a *fiction*, not a clear limiting case (`T → ∞` ignores generational structure). Predictive success, especially for policy, is highly contested.

  4.  **Tier 4: Barely Defensible (F-Twist Almost Useless) - Score: 0.1-0.2**
      *   **Assumption:** The brain does exact Bayesian inference over the true generative model (Cognitive Science/Neuroscience).
      *   **Why:** **Tractability** is the *only* real driver. While a powerful normative framework, the brain demonstrably uses heuristics, approximations (e.g., sampling, variational methods), leverages neural structure/embodiment, and often operates with *incorrect* generative models ("illusions", biases). Exact Bayesian inference is computationally intractable for most real problems. It's primarily a *useful fiction* or an *ideal standard*, not a realistic process model or limiting case. Predictive success for actual neural mechanisms or behavior is very limited; it's more of a guiding principle.
      *   **Assumption:** Independent error terms in scientific disagreement models, despite shared influences/cascades.
      *   **Why:** **Tractability** is the driver, but this **actively destroys robustness** for the phenomenon being modeled. Scientific errors *are* often correlated due to shared tools, paradigms, training, or information cascades (as you note). Assuming independence ignores the core social epistemology dynamics the model *should* capture (e.g., herding, path dependence, paradigm shifts). It's a *convenient fiction* that undermines the model's purpose. Predictive success for real patterns of scientific agreement/disagreement would likely be poor.

  **Addressing Your Specific Queries:**

  1.  **Limiting Case vs. Pure Fiction:**
      *   **Limiting Case (High Scores):** Frictionless planes (F=0), Well-mixed populations (mixing rate → ∞), Infinite populations (N → ∞). These are *idealizations* where a parameter approaches an extreme value within a broader, more realistic framework. The F-twist defense generally works well here *within the domain where the parameter is small/large enough*. Predictive success validates the approximation.
      *   **Pure Fiction (Low Scores):** Perfect rationality/Common Knowledge (not a limit of bounded rationality), Infinitely-lived HH (not a limit of OLG - the structure is different), Exact Bayesian Brain (not a computational limit the brain approaches), Independent Errors (denies the core phenomenon). These posit entities or properties that *aren't* extreme cases of real things. The F-twist defense struggles because the falsity isn't a small deviation; it's fundamental and often *necessary* for the phenomena the model ignores. Predictive success is inherently limited or misleading.
      *   **Alignment:** The distinction *largely aligns* with the tiering. Limiting cases score higher (Tiers 1 & 2), pure fictions score lower (Tiers 3 & 4). Exceptions exist (e.g., Perfect Rationality is arguably a limit case of "more rational", but its predictive failures are so severe it scores lower).

  2.  **Prediction vs. Policy/Intervention & the F-Twist Blind Spot:**
      *   **Flagged for Prediction-Only:** Perfect Rationality (Game Theory), Infinitely-Lived HH (Macro - long-run trends *maybe*), Well-Mixed Populations (Epi - basic dynamics).
      *   **Why Different Fault Line:** Friedman's F-twist focuses *solely* on predictive output. However, **policy/intervention inherently relies on understanding *causal mechanisms* and *structural realism*.** Assumptions that are pure fictions or lack robustness under intervention (like Perfect Rationality or Infinitely-Lived HH) are dangerous for policy:
          *   They may give correct predictions *in equilibrium* but fail catastrophically when the system is perturbed by policy (e.g., assuming rational markets leads to light-touch regulation; assuming representative HH misses distributional effects of tax policy).
          *   They provide no reliable guidance on *how* to intervene (e.g., a well-mixed model can't design targeted lockdowns; an infinite HH model can't design age-specific pension policies).
          *   **This is a fundamental limitation of the F-twist:** It ignores whether the model's *structure* accurately represents causal pathways, which is essential for reliable intervention. A model with unrealistic assumptions might predict well *descriptively* but be useless or misleading *prescriptively*. Your suspicion is correct – this is a different and crucial fault line hidden by Friedman's exclusive focus on prediction.

  **Summary:** The F-twist defense works best when unrealistic assumptions are *tractable limiting cases* of more complex truths (friction, large populations) and show robust predictive success *in their intended domain*. It fails when assumptions are *pure fictions* (infinite lifespans, perfect Bayes) or *actively ignore core phenomena* (correlated errors, bounded rationality), especially when predictive success is weak or context-dependent. Crucially, the defense is weakest when the model's purpose shifts from *prediction* to *policy/intervention*, where structural realism and understanding mechanisms become paramount – a weakness Friedman's framing obscures. Good luck with your session!
