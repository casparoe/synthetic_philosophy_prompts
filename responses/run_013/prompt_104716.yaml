  The user wants an essay question that forces students to connect NE's exchange theory with Politics' acquisition analysis, specifically focusing on the tension between money's conventional nature and its "natural" function. Key elements to include: the demand/commensurability problem from NE V, the usury critique from Politics I, and how "nature" functions in both arguments. The question must prevent students from just labeling concepts like chrematistike without deeper analysis.

  For the exam question design, I need to create something that directly targets the nomos/nature paradox. The hook provided—about money being alterable by custom yet having a natural function—is perfect. The rubric should explicitly reward analysis over paraphrase and penalize modern economic anachronisms.

  The model answer must demonstrate: 
  - How NE's "sufficiently accurate" commensurability through demand supports the Politics view by showing money's purpose is use, not accumulation
  - Why interest violates money's ergon (function) by treating it as an end rather than a means
  - Why the conventionality of money doesn't invalidate its natural teleology in exchange
  - How the commensurability problem actually strengthens the usury critique

  Marking scheme should prioritize: 
  - Correct interpretation of key terms (chreia, nomisma, tokos)
  - Explicit connection between NE V.5 and Politics I.10
  - Analysis of how "nature" operates differently in each context
  - Explanation of why conventionality and functionality aren't contradictory

  Common pitfalls to flag in marking: 
  - Equating Aristotle's "nature" with biological processes rather than teleology
  - Missing that demand's conventionality enables—rather than undermines—money's natural use
  - Failing to see how usury perverts ergon by making money "breed"
  - Not grasping that commensurability's imperfection is why interest is unnatural exploitation

  The model answer should intentionally show "A-grade" traits like: 
  - Using Aristotle's internal terms without modern baggage
  - Explaining how Politics' natural acquisition relies on NE's limited commensurability
  - Noting that nomos facilitates—rather than opposes—natural exchange when properly bounded

  I'll structure the question to force engagement with the paradox, then build the model answer around resolving it through teleology. The marking scheme will explicitly reward students who avoid the dual traps of either over-literal commensurability or dismissing money's function as arbitrary.
answer: |-
  Here’s a complete exam package addressing your requirements, designed to test conceptual synthesis and avoid superficial recitation:

  ### (1) Exam Question & Rubric  
  **Question:**  
  *In Nicomachean Ethics V.5, Aristotle states that money (nomisma) exists "not by nature but by custom/law (nomos)" and can be "altered or rendered useless at will." Yet in Politics I.10, he condemns lending at interest as the "most unnatural" form of acquisition because money’s natural function (ergon) is facilitating exchange, while interest makes "money breed money." Reconcile this tension: If money is purely conventional, how can it have a "natural" function? In your response, explain how Aristotle’s admission that demand (chreia) provides only a "sufficiently accurate" (not mathematically exact) commensurability for exchange bears upon his critique of usury. Use Aristotle’s own concepts (e.g., chreia, nomos, ergon, oikonomia, tokos) to show how the Ethics and Politics accounts interlock.*  

  **Rubric Note:**  
  *Tests ability to (a) synthesize NE V.5 and Pol. I.10 arguments, (b) analyze the role of "nature" in Aristotle’s monetary theory beyond surface contradictions, (c) apply the commensurability problem to evaluate the usury critique, and (d) deploy Aristotelian terminology precisely. Rewards explaining *why* arguments connect, not labeling them.*

  ---

  ### (2) Model Answer (650 words)  
  Aristotle’s seemingly contradictory claims about money—that it is conventional (nomos) yet has a natural function (ergon)—resolve when we grasp his teleological framework. Money’s *existence* depends on human agreement (nomos), but its *proper use* aligns with natural needs satisfied through reciprocal exchange (antipeponthos). This distinction between origin and purpose is key to understanding his hostility to interest (tokos).  

  In NE V.5, Aristotle argues money emerges from convention to solve the problem of incommensurability. Unlike Plato, he admits shoes and houses lack inherent equality; their exchange-value stems from communal need (chreia). Money, as a "representative of demand," provides a practical measure. Its name, *nomisma*, emphasizes its artificiality: its material form (e.g., stamped metal) is arbitrary and alterable by political decree. Crucially, however, this conventional tool serves a natural end: enabling households (oikoi) to obtain necessities they lack. Exchange is natural when it corrects imbalances in self-sufficiency—a core function of the *oikonomia* (household management). Money’s conventionality thus *facilitates* natural exchange by embodying communal chreia.  

  This reveals why Aristotle calls interest "most unnatural" in Politics I.10. Money’s ergon is mediating exchange for use-values (e.g., food, tools). Interest perverts this function by treating money as an end itself, "breeding" tokens from tokens (tokos literally means "offspring"). Whereas natural acquisition (ktetike) obtains goods for use, interest-driven acquisition (chrematistike) pursues limitless token-accumulation divorced from real needs. Aristotle condemns this not because money is "unnatural" in origin, but because its *misuse* violates the natural limit (peras) governing all oikonomia: sufficiency for the good life. When money generates profit detached from use, it corrupts the reciprocity sustaining the polis.  

  The commensurability problem supports this critique. Aristotle concedes money measures value only "with sufficient accuracy for practical purposes"—not with geometric precision. Demand (chreia) is fluid and contextual; it cannot render radically different goods *intrinsically* equal. This pragmatic fuzziness underscores money’s instrumental role: it is a *means* to equitable exchange, not a self-validating metric. Usury exploits this conventional tool by pretending money has intrinsic generative power. But if money’s value is nominal and contingent (as NE V.5 shows), then interest is a fiction: tokens cannot "breed" by nature. Worse, it entrenches artificial inequality by extracting value without contributing to need-fulfillment. The lender profits from the borrower’s chreia while bypassing the reciprocity Aristotle sees as natural justice.  

  Thus, the "naturalness" of money’s function derives not from physical properties but from its teleology within human communities. Nomisma is conventional *in form* but natural *in purpose* when serving oikonomia’s goal: provisioning for eudaimonia. Interest severs money from this teleology, converting a social instrument into an autonomous, endlessly replicating artifact. The commensurability admission sharpens Aristotle’s critique: precisely *because* money’s value rests on unstable chreia, its "breeding" is doubly unnatural—a perversion of both its instrumental ergon and the finite needs grounding the polis.  

  ---

  ### (3) Marking Scheme (Total: 25 points)  
  **Must-Hit Points:**  
  1. **Money’s conventional origin vs. natural function** (4 pts): Distinguish nomos (origin) from ergon (purpose) in money’s role.  
     *Common error: Claiming Aristotle contradicts himself without addressing teleology.*  
  2. **NE V.5’s commensurability argument** (4 pts): Explain chreia as imperfect but practical measure; link nomisma to artificiality.  
     *Common error: Paraphrasing "demand creates money" without engaging why commensurability is "sufficient not exact."*  
  3. **Politics I.10’s usury critique** (4 pts): Identify tokos as "unnatural" due to perversion of money’s exchange-mediating ergon.  
     *Common error: Reducing "unnatural" to "immoral" without tying to money’s function.*  
  4. **Synthesis of NE & Politics** (5 pts): Show conventional money enables natural exchange; interest severs money from use-values/chreia.  
     *Common error: Treating texts as separate arguments; missing that nomos serves natural ends.*  
  5. **Commensurability’s role in usury critique** (4 pts): Argue that money’s contingent value makes interest a "fictional" detachment from real needs.  
     *Common error: Ignoring how "sufficient accuracy" implies interest is unnatural exploitation of convention.*  
  6. **Precise terminology** (4 pts): Use ≥5 of: chreia, nomos, ergon, oikonomia, tokos, ktetike/chrematistike, antipeponthos.  
     *Common error: Misdefining terms (e.g., conflating oikonomia with modern "economy").*  

  **A vs. B Differentiation:**  
  - **A Answers (21-25 pts):** Explicitly state that *nomos enables* natural exchange but is *corrupted* in usury; show commensurability’s imperfection *strengthens* the critique by exposing interest’s artificiality; use teleology to resolve the "tension" holistically.  
  - **B Answers (16-20 pts):** Accurately describe both texts but struggle to synthesize; treat commensurability as tangential; use terms correctly but without conceptual linking.  

  **Anti-Anachronism Note:** Deduct 2-3 pts for modern economic framing (e.g., "supply/demand," "capital," "labor theory of value") unless explicitly flagged as *contrast* with Aristotle.  

  This structure forces engagement with your outlined crux while rewarding mastery of Aristotle’s internal logic. The model answer demonstrates how to resolve the paradox via teleology without importing external frameworks.
