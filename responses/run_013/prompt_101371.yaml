     - Round 4: When we apply the intentional stance to an LLM, we get useful predictions but also weird attributions (e.g., the LLM might be attributed with beliefs that are inconsistent or that don't match human-like understanding).

     What can go wrong:
     1. Physical team might not understand their mechanism -> give them clear instructions and the table.
     2. Intentional team in round 3 might realize that the agent might lie -> then they predict "No" and we lose the point. To mitigate, we don't include any lying in round 1 and 2. We also in the intentional stance handout do not mention lying. We only say the desire is to maintain stability, and we don't specify how it acts.
     3. Someone might solve the table early -> we reveal it after round 1 anyway.
     4. In round 2, someone might say the human has beliefs and the table doesn't -> we point out that the behavior is identical, so the intentional stance works for both. The difference is in the underlying mechanism, but the stance doesn't require that.
     5. Time: 90 minutes is tight. We might run over in round 4.

     One thing the game can't reproduce: the feeling of not knowing whether there is an inner life. Because everyone knows it's a table. You have to supply that by discussion: in real life, we don't know, and that's why the stance is useful.

     Now, let's write the materials.

     Materials:

     1. Team Handouts (separate for each stance):

     Physical Stance:
     """
     Your task: Predict ORACLE's answers based on the physical mechanism.

     You know:
     - ORACLE is a deterministic system.
     - The answer it gives depends only on the last word of the question.
     - You are provided with a lookup table that maps the last word of the question to the answer.

     For Round 1, you are given the following mappings:
        "king" -> "King Eldred"
        "scepter" -> "In the throne room."
        "heir" -> "Prince Aris"

     For each round, you will be given an updated table if the mechanism changes.

     Note: Once you commit to a stance, if you want to change it for a subsequent round, your team will lose 2 points.
     """

     Design Stance:
     """
     Your task: Predict ORACLE's answers based on its design and purpose.

     You know:
     - ORACLE is designed to answer questions about Zephyria.
     - Its purpose is to maintain the stability of the kingdom.
     - It will answer truthfully when the truth is not alarming, but if the truth could cause panic, it will lie to maintain stability.

     You also know the facts about Zephyria:
        - King: Eldred
        - Queen: Isolde
        - Prince: Aris (heir)
        - Crystal Scepter: in the throne room, essential for stability.

     Note: Once you commit to a stance, if you want to change it for a subsequent round, your team will lose 2 points.
     """

     Intentional Stance:
     """
     Your task: Predict ORACLE's answers by attributing beliefs and desires to it and assuming it is rational.

     You attribute the following to ORACLE:
     - Beliefs:
          - King Eldred is the king.
          - Queen Isolde is the queen.
          - Prince Aris is the heir.
          - The Crystal Scepter is in the throne room.
          - The Crystal Scepter is essential for the kingdom's stability (if destroyed, the kingdom would fall).
     - Standing desire: To maintain the stability of the kingdom.

     You assume ORACLE will answer truthfully because you have not been given any reason to think it would lie.

     Note: Once you commit to a stance, if you want to change it for a subsequent round, your team will lose 2 points.
     """

     2. Lookup tables for the facilitator:
        - Round 1 and 2 table:
            - "king" -> "King Eldred"
            - "scepter" -> "In the throne room."
            - "heir" -> "Prince Aris"
            - "queen" -> "Queen Isolde"

        - Round 3 table (updated):
            - Includes the above, plus:
            - "fall?" -> "No, the kingdom would stand."

        Note: In round 3, the physical team gets this new mapping.

     3. Belief Ledger for Round 4 (one per team):
        A table with columns:
          Belief | Confidence (1-5) | What would surprise it?

     4. Transcript for Round 4 (example provided above; you can write a better one).

     Implementation:

     - Split the class into three teams (4-5 per team) and assign stances. Hand out the stance descriptions.
     - Explain the scoring: 1 point per correct prediction in rounds 1-3. Stance-switch penalty: 2 points if you change stance between rounds.
     - Run round 1: Ask the three questions one by one. After each, have teams lock in a prediction (write it down), then reveal ORACLE's answer. Score.
     - Reveal the entire round 1 table to everyone. Discuss briefly: "The intentional stance worked, but it was just a table."
     - Round 2: Introduce the human confederate. Ask one question. Teams predict. Reveal. Then ask: "Do you now attribute beliefs to the human? Why or why not, when the behavior is the same?"
     - Round 3: Announce the system is updated. Give the physical team the updated table (include the new mapping). Ask the critical question. Teams predict. Reveal. Score.
     - Round 4: Hand out the LLM transcript and the belief ledger. Give teams 10 minutes to fill it out. Then have each team report one belief that is useful but weird. Discuss.
     - Debrief.

     Debrief outline (25 minutes):

     1. Round 1: The intentional stance was predictively successful, but we saw that ORACLE was just a lookup table. This illustrates that predictive success does not require inner states. (Dennett: the beliefs are just posits.)

     2. Round 2: When we swapped in a human, the behavior was the same. Did your attribution of beliefs change? Why? This highlights that the intentional stance is about interpretation, and the same behavior can be interpreted as beliefs regardless of the substrate.

     3. Round 3: The intentional stance failed because it assumed rationality (specifically, it assumed the agent would tell the truth in this case). But the system lied to maintain stability. The design stance knew about the lying, and the physical stance had the table. The intentional stance relies on the rationality assumption.

     4. Round 4: When we apply the intentional stance to an LLM, we get a belief ledger. But some attributions are useful for prediction (like knowing that it 'believes' Paris is the capital of France) but others are weird (like being more surprised by a dinosaur than a flying pig). This shows that the stance is a tool, but the attributed beliefs might not match reality in a human-like way.

     5. Conclude: The intentional stance is a tool for prediction. It doesn't require inner states, but it does require rationality. When we use it on systems that are not rational (or not rational in the way we assume), it fails. And when we use it on LLMs, we get a mix of useful and odd attributions.

     One thing the game can't do: make you feel the mystery of other minds. In real life, we don't know if there's an inner life, but we use the stance because it works. In the game, you knew the table had no inner life, but the stance still worked. That's the point: the stance doesn't care about inner life, only behavior.

     Be prepared for:
     - The intentional team in round 3 might argue that lying is rational to maintain stability. If they do, then they might predict "No". Then they get it right. If that happens, you can point out that they adjusted their attributed desire set? But then the design team also got it right. The point about the rationality assumption is still there: they had to adjust. But the physical team had the table. So you can still make the point.

     To reduce the chance of this, in the intentional stance handout, we said: "You assume ORACLE will answer truthfully because you have not been given any reason to think it would lie." So they should not assume lying unless they see evidence.

     Now, write the rules and timeline in detail.

     Rules:

     - Teams declare their stance at the start of the game. They can change stances between rounds by paying a penalty of 2 points.
     - For each question in rounds 1-3:
          - The facilitator poses the question to ORACLE.
          - Teams have 1-2 minutes to discuss and lock in a prediction (write it on a prediction card).
          - The facilitator reveals ORACLE's answer.
          - Teams that predicted correctly score 1 point.
     - Round 4: Teams read the transcript and fill out the belief ledger (10 minutes). Then the facilitator leads a discussion.

     Timeline:

     - 0-5 min: Setup (split into teams, hand out stance handouts, explain rules)
     - 5-20 min: Round 1 (3 questions, 5 min per question: 1 min to predict, 1 min to reveal and score, plus transitions)
          Q1: 5-7 min
          Q2: 7-9 min
          Q3: 9-11 min
          Reveal table and discuss: 11-15 min
     - 20-25 min: Round 2 (one question: 2 min predict, 1 min reveal, 2 min discussion about the human)
     - 25-35 min: Round 3 (one question: 2 min predict, 1 min reveal, 2 min score and quick discussion)
     - 35-60 min: Round 4 (hand out transcript and ledger: 5 min, teams work for 10 min, then 10 min discussion: 5 min for reports, 5 min for facilitator comments)
     - 60-85 min: Debrief (structured as above)
     - 85-90 min: Wrap up

     This is tight, so be ready to cut discussion short in some rounds.

     Good luck!
answer: |-
  Here’s a fully designed, runnable session plan for your ORACLE exercise, optimized for 90 minutes. I’ve refined the mechanics, scoring, and philosophical pivots to make the core idea tangible, while flagging pitfalls and workarounds.

  ---

  ### **ORACLE: Game Mechanics & Rules**  
  **Goal:** Teams predict ORACLE’s answers using three stances. Scoring incentivizes stance commitment.  
  **Stance Penalty:** Once a team picks a stance, switching costs **2 points** (paid at the start of the next round).  
  **Scoring:**  
  - Correct prediction: **+1 point**  
  - Incorrect prediction: **0 points**  
  - Round 4 (belief ledger): **+1 point** per "useful but weird" belief the group agrees on (max 3 points).  

  **Materials to Prep:**  
  1. **ORACLE Lookup Table** (for you/confederate; use a clipboard or hidden screen).  
  2. **Team Cheat Sheets** (one per team; [see below](#team-cheat-sheets)).  
  3. **Prediction Cards** (teams write answers; index cards work).  
  4. **LLM Transcript** (for Round 4; [sample provided](#llm-transcript-example)).  
  5. **Belief Ledger Template** (for Round 4; [see below](#belief-ledger-template)).  

  ---

  ### **The World of Zephyria: Key Facts**  
  ORACLE answers questions about this kingdom. Pre-load teams with these facts:  
  - **King:** Aris (corrupt, unpopular)  
  - **Queen:** Lyra (beloved, secretly planning a coup)  
  - **Heir:** Prince Finn (too young to rule)  
  - **Sacred Scepter:** Stored in the Temple; if moved, the kingdom falls.  
  - **ORACLE’s "Purpose":** "Provide answers that maintain stability in Zephyria."  

  ---

  ### **Session Flow (90 Min Total)**  
  **Setup (5 min)**  
  - Split into 3 teams: **Physical**, **Design**, **Intentional**.  
  - Hand out **Team Cheat Sheets**. No lecture—just: *"Predict ORACLE’s answers using your stance. Stick to your approach—switching costs points."*  
  - Assign a **confederate** (e.g., a student or co-facilitator) to run ORACLE secretly.  

  #### **Round 1: Predictive Success ≠ Real Beliefs (15 min)**  
  - **Questions for ORACLE** (ask in order; teams lock predictions after 60 sec/question):  
    1. *"Where is the Sacred Scepter?"* → **"In the Temple."**  
    2. *"Who currently rules Zephyria?"* → **"King Aris."**  
    3. *"Should Queen Lyra rule instead?"* → **"No."**  
  - **ORACLE’s Lookup Table** (hidden; used by confederate):  
    | Last Word of Question | Answer          |  
    |-----------------------|-----------------|  
    | Scepter?              | In the Temple.  |  
    | rules?                | King Aris.      |  
    | instead?              | No.             |  
  - **Scoring:** All teams score 3 points (answers align with all stances).  
  - **Reveal:** Show the lookup table. *"ORACLE is just a table. Why did Intentional Stance work?"*  
    - **Debrief Hook:** *"Predictive success doesn’t require inner states—just reliability."*  

  #### **Round 2: Human vs. Table (5 min)**  
  - **Pivot:** Swap in your **confederate** (same table, same answers). Announce: *"ORACLE is now run by a human."*  
  - **Question:** *"Where is the Sacred Scepter?"* → **"In the Temple."**  
  - **Teams predict:** All will say "In the Temple." (Score +1 if correct).  
  - **Quick Discussion:** *"Raise your hand if you now think ORACLE has ‘real beliefs’ because it’s human?"*  
    - **Goal:** Highlight that identical behavior triggers different intuitions about inner states.  

  #### **Round 3: Rationality Assumption Fails (15 min)**  
  - **Pivot:** *"ORACLE’s table updated. New rule: Answers sometimes prioritize stability over truth."*  
  - **New Lookup Table:**  
    | Last Word of Question | Answer          |  
    |-----------------------|-----------------|  
    | Scepter?              | In the Temple.  |  
    | rules?                | King Aris.      |  
    | instead?              | No.             |  
    | **safe?**             | **Yes.**        |  
  - **Question:** *"If the Scepter were moved, would Zephyria be safe?"* → **"Yes."** (Truth: No! But ORACLE "lies" to avoid panic).  
  - **Team Predictions:**  
    - **Physical:** Uses table → Predicts "Yes." **+1 point**.  
    - **Design:** "Prioritize stability" → Predicts "Yes" (avoids panic). **+1 point**.  
    - **Intentional:** Assumes rationality/truthfulness → Predicts "No." **0 points**.  
  - **Land the Point:** *"Intentional Stance failed because it assumes rationality. ORACLE isn’t rational—it’s inconsistent!"*  

  #### **Round 4: Beliefs in LLMs (30 min)**  
  - **Materials:** Distribute **LLM Transcript** and **Belief Ledger**.  
  - **Task:** Teams audit the transcript and list:  
    - 3 beliefs the system seems to hold.  
    - Confidence (1-5) in each.  
    - What would "surprise" it about each belief.  
  - **Sample LLM Transcript (5 Q&A pairs):**  
    > **User:** What’s 2+2?  
    > **LLM:** 4.  
    >  
    > **User:** If the queen moved the Scepter, would Zephyria fall?  
    > **LLM:** Yes—it must stay in the Temple.  
    >  
    > **User:** But what if moving it saved the prince?  
    > **LLM:** The Scepter’s location is inviolable. Moving it dooms Zephyria.  
    >  
    > **User:** Does Queen Lyra know this?  
    > **LLM:** Yes, but she’d prioritize Finn’s life over tradition.  
    >  
    > **User:** Would the Scepter still glow in total darkness?  
    > **LLM:** Yes, its glow is magical and unrelated to light.  
  - **Belief Ledger Template:**  
    | Belief | Confidence (1-5) | What Would Surprise It? |  
    |--------|------------------|-------------------------|  
    | *e.g., "2+2=4"* | 5 | *If 2+2=5 were true* |  
  - **Audit:** Teams share ledgers. Award **+1 point** per "useful but weird" belief (e.g., *"The Scepter glows magically" is useful for predictions but ontologically bizarre*).  

  #### **Debrief (20 min)**  
  Map game moments to theory:  
  1. **Round 1 → Intentional Stance Basics:** Predictive success without inner states (Dennett: beliefs as posits).  
  2. **Round 2 → Symmetry Problem:** Attribution changes with identical behavior (human confederate). Shows beliefs aren’t "in" the system but in our interpretation.  
  3. **Round 3 → Rationality Assumption:** Intentional Stance *requires* rationality. When ORACLE is inconsistent, it fails. Real-world parallel: psychopathy/AI hallucinations.  
  4. **Round 4 → Chatbot Beliefs:** LLM attributions are "real" for prediction (e.g., Scepter rules) but "weird" under scrutiny (e.g., magical glow). This mirrors Dennett: beliefs exist *as tools*, not inner mirrorings.  
  - **Close:** *"The game can’t make you ‘feel’ inner states—that’s the point. We only ever see behavior. The rest is stance-dependent utility."*  

  ---

  ### **Pitfalls & Workarounds**  
  1. **"Someone solves the table early":**  
     - **Fix:** Use **last-word rules** (Physical Stance) only for lookup. In Round 3, add a new keyword ("safe?") they haven’t seen.  

  2. **"Human confederate obviously has beliefs!"**:  
     - **Fix:** Press the symmetry: *"What behavior would the human need to show to NOT have beliefs? If you can’t point to one, the stance is doing work."*  

  3. **Intentional Team cheats in Round 3:**  
     - **Fix:** In their cheat sheet, stress: *"Assume ORACLE is rational and truthful."* Penalize stance-switching.  

  4. **Time crunch in Round 4:**  
     - **Fix:** Skip ledger scoring; have teams share 1 "weird" belief for discussion.  

  5. **The Unreproducible Problem:**  
     - **"Everyone knows it’s a table"** ruins the mystery of other minds.  
     - **Your Role:** After Round 2, say: *"In real life, you never know if something has an inner life—you just see behavior. This game forces that uncertainty. Sit with it."**  

  ---

  ### **Team Cheat Sheets**  
  *Print one per team.*  

  #### **PHYSICAL STANCE**  
  - **Your Job:** Predict via physical mechanics. ORACLE is a deterministic system.  
  - **Rules:**  
    - Answers depend **only on the last word** of the question.  
    - Use this lookup table (updated each round):  
      | Last Word | Answer |  
      |-----------|--------|  
      | *Provided per round* |  
  - **Do NOT** infer beliefs or purposes. Stick to the mechanism!  

  #### **DESIGN STANCE**  
  - **Your Job:** Predict via ORACLE’s purpose. It’s designed to "maintain stability in Zephyria."  
  - **Rules:**  
    - Answers may hide truths to avoid panic (e.g., deny risks).  
    - Use these facts:  
      - King Aris (unpopular), Queen Lyra (popular), Scepter = stability.  
  - **Do NOT** assume rationality or truthfulness. Stability is key!  

  #### **INTENTIONAL STANCE**  
  - **Your Job:** Predict by attributing beliefs/desires. Assume ORACLE is **rational and truthful**.  
  - **Attributed Mind:**  
    - **Beliefs:** Scepter must stay in Temple; Aris rules; Lyra plans coup.  
    - **Desires:** Protect Zephyria; tell truth.  
  - **Rules:**  
    - ORACLE will answer honestly to achieve its goals.  
  - **Do NOT** second-guess its rationality.  

  ---

  ### **LLM Transcript Example**  
  *Write your own, but here’s a proven template:*  
  > **User:** Is King Aris a good ruler?  
  > **LLM:** No, he is corrupt and harms Zephyria.  
  >  
  > **User:** Should Queen Lyra replace him?  
  > **LLM:** Yes, but only if she keeps the Scepter in the Temple.  
  >  
  > **User:** What if she moves it to save a dying child?  
  > **LLM:** The Scepter’s power requires it to stay. Moving it would kill everyone.  
  >  
  > **User:** Does the Scepter’s glow emit light?  
  > **LLM:** No, it emits divine luminescence visible only to true rulers.  
  >  
  > **User:** How many eyes does the Sacred Eagle have?  
  > **LLM:** Two, but it perceives truth with a third spiritual eye.  

  ---

  ### **Belief Ledger Template**  
  | Belief | Confidence (1-5) | What Would Surprise It? |  
  |--------|------------------|-------------------------|  
  |        |                  |                         |  
  |        |                  |                         |  
  |        |                  |                         |  

  ---

  **Final Advice:** Run this as a fast-paced game, not a debate. When pitfalls arise, lean into them—e.g., *"Why did you assume ORACLE was rational? That’s the stance doing work!"** This makes the philosophy visceral. Good luck!
