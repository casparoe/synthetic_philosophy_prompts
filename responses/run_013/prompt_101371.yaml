  Key elements:
  - ORACLE: a system that answers questions about an invented world. Initially, it's a lookup table (or a confederate using the same table).
  - Three teams: Physical, Design, Intentional.
  - Each round, a question is posed to ORACLE, teams predict the answer, and correct predictions score points.
  - The game includes reveals and twists to highlight philosophical points.

  Goals of the rounds:
  1. Round 1: Intentional team wins (even though ORACLE is a table) to show that predictive success doesn't require inner states.
  2. Round 2: Swap in a human confederate using the same table. Identical behavior, but do belief attributions change?
  3. Round 3: Introduce an inconsistency in the table. Intentional team fails because of the rationality assumption, while Physical and Design might succeed.
  4. Round 4: Use an LLM transcript to have teams fill out a "belief ledger" and then audit for useful but weird attributions.

  Mechanics needed:
