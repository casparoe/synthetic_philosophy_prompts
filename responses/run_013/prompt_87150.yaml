answer: |-
  As an actual infinitist, I affirm that Hilbert's Hotel demonstrates a fundamental property of infinite collections: they can be put into one-to-one correspondence with proper subsets. Your objection conflates the *static* mathematical reality of bijection with the *dynamic process* you imagine must underlie it. When I say the hotel is "full," I mean there is a bijection between guests and rooms. After the shift, a new bijection exists: guest n occupies room n+1, and the new guest occupies room 1. The *relational fact* of bijection *is* the rigorous definition of "fullness" for infinite sets. The hotel's capacity hasn't changed—it was, is, and remains infinite—but we've demonstrated that infinity plus one is still infinity. The physical rearrangement you find problematic isn't a *temporal process* requiring "instructions"; it's an instantaneous re-mapping. The "determinate arrangement" exists because the function f(n) = n+1 defines every occupant's position completely and consistently. Before and after, every room is occupied; that *is* fullness.

  Regarding the axiom that "the whole is greater than the part": it holds only for finite sets. For infinite sets, like the natural numbers, the part (e.g., even numbers) *is* equinumerous with the whole—a truth Galileo himself grappled with. Cantor's insight wasn't that this axiom is "false" absolutely, but that it *fails to characterize infinity*. Infinity is precisely where a set can be bijected with a proper subset. Hilbert's Hotel isn't a paradox; it's a vivid proof that Euclid's axiom, while intuitive for finite objects, is inapplicable to infinite wholes. Your concern about "adding" a guest despite bijection persists highlights this: addition changes finite cardinalities, but not infinite ones. The "addition" is illusory in terms of cardinality; we've merely relabeled the same infinity.

  (Out of character: I am highly confident in the core argument. The step I find most philosophically contestable—though mathematically sound—is the claim that the re-mapping is "instantaneous" and requires no temporal execution, as this brushes against intuitions about causality in physical implementations.)
