prompt: |-
  I'm a postdoc and I've been roped into running a one-off session for a cross-disciplinary reading group -- mostly economists and lawyers, a couple of historians, one psychologist, and its 75 minutes with a room that has no metaethics at all. The topic I've been handed is the wrong kind of reasons problem, and what I need from you is not the explanation itself (I can do that on a good day) but the plan for giving it. In what order do the pieces have to go so that the thing lands as a real problem rather then a puzzle somebody invented in an armchair: what has to be in place before any of the cases can do any work, what depends on what, and where exactly the move from "an attitude can be correct or incorrect" to "there's a constraint on which considerations can make it correct" has to sit in the sequence. Then the carrying example. I'm tempted by the demon (the one who'll destroy something you care about unless you come to admire him), and I'm also tempted by something closer to home for this crowd -- a museum whose endowment depends on the trustees sincerely coming to admire a mediocre painting, or a firm that pays analysts a bonus for finding a report convincing -- and I want you to pick which one carries the session, say what it has to have and what it can't have (if the room reads it as just self-deception, or just prudence versus evidence, I've lost them before we get to the interesting part), and tell me why not the demon if you'd go the other way. I'd also like to know whether to let them see that the same shape of thing comes up for belief (reasons to believe something because believing it would be lovely) or whether that just drags the pragmatism debate in and wrecks the hour; no reading list, it's a one-off.

  The misconception map matters as much to me as the order, so give it to me in the order they'll actually form, with the point in the sequence where I should head each one off. My guesses: they'll hear "wrong kind of reason" as "bad reason" or "immoral reason"; they'll run it together with the motivating/justifying distinction, which I don't think is the same thing at all; somebody will conclude that the demon shows you can't analyse value in terms of reasons, which strikes me as the wrong lesson to take; and at least one person will treat the state-given/object-given distinction as being the problem rather than one proposed solution to it, which would collapse the whole session into a definitional squabble. Add whatever I've missed. Then the check: one thing I can put to them in the last ten minutes that would show whether they've got the shape of the problem rather than just memorised the case. And tell me what to leave out at this level and to say out loud that I'm leaving it out -- I assume the whole "is there even one unified phenomenon here" literature, but you tell me.

  Last thing, since you're handing me a plan rather than a verdict: tell me which step in your proposed order you're least confident about and why, and what I'd see in the room that would show the sequence is wrong -- that is, what would make you reorder it if you were watching.
reasoning: |-
  Okay, the user is a postdoc preparing a 75-minute session on the "wrong kind of reasons" problem for a cross-disciplinary group. They need a teaching plan that makes the problem feel real, not like an abstract puzzle. Let me unpack their key requirements.

  First, they want the logical sequence that makes the problem land - what foundational concepts must be established before introducing cases. The transition from "attitudes can be correct" to "constraints on what makes them correct" seems crucial. They also need help choosing between the demon example and institutional alternatives (museum/firm), with clear guidance on avoiding misinterpretations like seeing it as mere self-deception or prudence.

  The misconception mapping is vital. They anticipate: confusing "wrong kind" with "bad reason", mixing it up with motivating/justifying reasons, concluding value can't be analyzed via reasons, and conflating state/object-given distinction with the problem itself. I should identify additional pitfalls - maybe over-intellectualizing attitudes or missing the normative authority point.

  For the institutional example, the museum scenario seems strongest: trustees needing to sincerely admire mediocre art for endowment reasons. It avoids demon's supernatural distractions while being professionally relevant. Key setup: must emphasize sincerity requirement and separate "what makes admiration fitting" from "why you'd want to feel it". Can't let them think it's about faking or pragmatic belief.

  The check question at the end should test if they grasp the structural problem - perhaps asking what would make admiration fitting toward the demon versus what reasons they have to cultivate it. Need to explicitly omit unification debates and solution critiques.

  Sequence confidence: I'm least sure about when to introduce the attitude correctness framework. Too early might lose them, too late makes cases seem arbitrary. Watch for blank stares during the "admiration is assessable" step - that'd signal needing more concrete examples upfront.

  Additional pitfalls: historians might resist "correctness" language for attitudes; economists could reduce everything to incentives. Should explicitly decouple from pragmatism debates and avoid belief examples to prevent derailment.
answer: |-
  Here’s a battle-tested plan for 75 minutes, optimized for your audience and pitfalls. The goal is **structural clarity**—making the WKR problem feel *inescapable*, not like wordplay.

  ---

  ### **Sequence & Rationale (Total: 65 min)**
  **Goal at each step:** Lock in one piece before moving on. No jargon until defined.

  1.  **Groundwork: Attitudes Can Be Correct/Incorrect (10 min)**
      *   *Start with intuition:* "We criticize people for emotions/attitudes: 'You shouldn’t resent your friend’s success,' 'That joke isn’t *actually* funny,' 'Admiring a scam artist is misplaced.'"
      *   *Key move:* Distinguish **assessment of the attitude** from **assessment of the person**. "We might understand *why* someone feels resentment (stress, insecurity), but still say the resentment itself is *unwarranted* or *mistaken*."
      *   *Crucial for later:* "This suggests some attitudes have a 'standard of correctness'—they can *fit* or *fail to fit* their object." **Pitfall Head-Off:** Explicitly say this isn't about morality (yet) or psychology (how they feel), it's about whether the attitude *matches* its target.

  2.  **Reasons as Potential Correctness-Makers (5 min)**
      *   *Bridge:* "If attitudes can be correct/incorrect, what *makes* them correct? Often, we point to **reasons**."
      *   *Simple examples:* "What makes admiration for a firefighter correct? Her bravery (a feature *of her*). What makes fear of this dog correct? It's growling and baring teeth (features *of the dog*)."
      *   *Lock in:* "Reasons that bear on the *correctness* of the attitude seem tied to **features of the object** the attitude is about."

  3.  **Introduce the "Demon" Case (The Setup) (10 min)**
      *   *Present neutrally:* "Imagine a powerful being says: 'Unless you *sincerely admire me* by tomorrow, I will destroy something you deeply value (your family, your life's work).' Importantly, this being has *no other admirable qualities*—no kindness, no justice, just power and this threat."
      *   *Question 1 (Prudence Check):* "Do you have *a* reason to try to bring it about that you admire this demon? (Almost certainly yes: to save what you value)."
      *   *Question 2 (Sincerity Check):* "Can you just *decide* to sincerely admire something? Or might it take effort/work/possibly self-deception?" (Acknowledge difficulty but grant possibility for argument's sake). **Pitfall Head-Off:** "This isn't *about* self-deception being easy or hard. Assume you *could* somehow cultivate sincere admiration. The question is about *reasons*."

  4.  **The Hammer: The Wrong Kind of Reason Problem (15 min)**
      *   *Contrast:* "We have a *strong reason* to *bring about* the admiration (prudence, saving what we love). BUT: Does this threat give us a reason *for which admiration of the demon would be **correct**? Does it make the demon *admirable*?"
      *   *Poll the room:* "Show of hands: Who thinks the demon's threat is a reason that *makes admiring it the correct/fitting response*?" (Expect few hands).
      *   *The Problem Articulated:* "We seem to have a powerful reason *to have* an attitude (admiration), but that reason **does not seem to bear on whether the attitude is correct**. It's the 'wrong kind' of reason for *justifying* the attitude itself, even though it's the 'right kind' for *motivating* us to get ourselves to have it."
      *   **PIVOTAL MOVE:** "This forces a split: **Reasons to *have* an attitude** vs. **Reasons that *make the attitude correct***. The WKR problem shows these are not the same. The demon gives us the first kind powerfully, but *not* the second kind."

  5.  **Anchor with the Museum Case (The Institutional Twist) (15 min)**
      *   *Why Museum > Demon for this crowd?* Demons feel fantastical; institutional incentives feel real and immediate to economists/lawyers. The *pressure for sincerity* is relatable.
      *   *The Case:* "The 'Mediocre Masterpiece Museum'. Its crucial endowment requires that the Board of Trustees **sincerely admire** a specific, objectively mediocre painting (scholarly consensus: dull composition, derivative style). If they *truly*, deeply admire it, the endowment unlocks $50 million for acquisitions/conservation. They *want* to admire it; the museum's future depends on it."
      *   *Parallel Questions:*
          *   "Do the Trustees have *a* reason to try to bring it about that they admire the painting? (Yes, $50M for the museum)."
          *   "Does this financial incentive give the Trustees a reason *for which admiration of this painting would be **correct**? Does it make the painting *admirable*?" (No! The incentive is about the *consequences* of admiring, not the painting's merits).
      *   *Why it carries better:* Avoids "irrational fear" distractions of the demon. Highlights the *institutional pressure for sincere commitment* (common in law/firms). Makes the "correctness" question stark: the painting's qualities haven't changed. **Crucial Setup:** Emphasize "sincerely admire" – it's not about faking it or just saying it. It's about genuinely having the feeling *because the endowment requires the genuine feeling*.
      *   *Why not Demon?* For economists/lawyers, the demon can feel like an irrational fear scenario ("just don't be scared!") or pure sci-fi, making it easier to dismiss. The museum leverages professional intuitions about incentives, endowments, and the gap between sincere belief/feeling and external rewards. *Use Demon first to establish the abstract structure, Museum to make it visceral.*

  6.  **The Constraint Claim (5 min)**
      *   *Synthesize:* "The problem shows that **not just any consideration that gives us reason to *have* an attitude can count as a reason that *makes that attitude correct***. There's a constraint: reasons making attitude A toward X correct must be **about X** (or perhaps about the relation between X and A). The demon's threat is *about the consequences of admiring*, not *about the demon*. The endowment is *about the museum's needs*, not *about the painting*."
      *   *The Lesson (So Far):* Any theory linking attitudes, correctness, and reasons must account for this split. It's not that value *can't* be analyzed in terms of reasons; it's that we need to *distinguish kinds* of reasons. **Pitfall Head-Off:** "This isn't proving value isn't about reasons! It's showing we need a *structured* theory of reasons for attitudes."

  7.  **What About Belief? (5 min - Handle With Care!)**
      *   *Brief Touch Only:* "Notice a similar shape: Do I have reason to *believe* I'll recover from illness because believing it improves my chances? Yes, pragmatically. But does that make the belief *true* or *justified by evidence*? No. Pragmatic reasons to believe aren't (usually) epistemic reasons justifying the belief." **WHY BRIEF:** You're right, pragmatism is a quagmire. *Do not engage.* Say: "This shows the *shape* of the problem reappears, but belief has its own complex debates (pragmatism vs. evidentialism) we don't have time for today. The core issue for attitudes like admiration is already sharp."

  ---

  ### **Misconception Map & Preemptive Strikes**
  *   **"Wrong Kind = Bad/Immoral Reason":** Head off in Step 1 & Step 4. Stress: The demon's reason (save your family) is *good*! The museum's reason (get $50M) is *good*! The problem is *kind*, not moral quality. "Wrong Kind" is a technical term meaning "not of the type to make the attitude correct."
  *   **Confusing with Motivating/Justifying:** Head off in Step 4 ("Reasons to *have* vs. Reasons that *make it correct*") and Step 6. Explicitly contrast: "The motivating/justifying distinction is about action reasons (why you *did* it vs. why it was *okay* to do). This is about attitude reasons (why you should *have* it vs. why *having it is fitting*)."
  *   **"This Shows Value Isn't About Reasons!":** Head off in Step 6. Emphasize: This is a challenge *within* reasons-based accounts, not a refutation. Solutions involve *structuring* reasons (object-given/state-given, fittingness first).
  *   **Treating State/Object-Given as the Problem:** Head off by *delaying* this terminology. Don't introduce "state-given" and "object-given" as labels until *after* the problem is felt (Step 6). Present them as *one common way to label the distinction the problem forces*, not the problem itself. "Philosophers often call reasons like the demon's threat 'state-given reasons' (reasons given by the *state* of having the attitude) and reasons like the firefighter's bravery 'object-given reasons' (reasons given by the *object*). The problem is how to define and separate these, not whether the distinction exists."
  *   **"It's Just Self-Deception/Manipulation":** Head off in Step 3 & Museum Setup. Grant the psychological mechanism, but insist: "Assume you *do* succeed in sincerely feeling it. The question remains: Is the reason that got you there (threat, money) now a reason that *justifies* the feeling itself?"
  *   **"It's Just Prudence vs. Evidence" (for belief analogy):** Head off by keeping belief brief and focused on structure, not pragmatism debate. **New Pitfall (Historians/Psychologists):** "Attitudes aren't 'correct', they're just culturally constructed!" Rebuttal in Step 1: Even within a culture, we make *internal* assessments ("Given *your own* values, is this fear rational?").

  ---

  ### **The Check Question (Last 10 min)**
  **Present:** "Imagine a brilliant, kind, courageous scientist (Dr. Good). We all agree she's genuinely admirable (object-given reasons aplenty!). Now, a different demon says: 'I'll destroy the world unless you *stop admiring* Dr. Good.'"

  **Ask:**
  1.  "Do you have a strong reason to try to *stop* admiring Dr. Good?" (Yes).
  2.  "Does this demon's threat give you a reason *for which ceasing to admire Dr. Good would be the **correct** response? Does it make Dr. Good *less admirable*?" (No!).

  **Why it works:** It reverses the polarity (reason to *not* have an attitude) and uses an uncontestably admirable object. If they see that the threat is a powerful reason *to rid yourself* of admiration but *cannot* make admiration *incorrect* or Dr. Good *less admirable*, they've grasped the structural split. If they say "Well, maybe it *does* make her less admirable..." dig into *why* (likely misunderstanding the constraint).

  ---

  ### **What to Leave Out & Announce**
  *   **Leave Out:** The vast literature on *solutions* (fitting-attitudes, buck-passing, disjunctivism) and the debate over whether it's *one* problem or many. Also, deep dives into specific attitudes beyond the core examples.
  *   **Announce:** "This is a deep well! We're focusing *only* on exposing the core problem structure. We won't solve it today or explore all the proposed fixes or debates about variations across different attitudes. Our goal is to see *why* it's a problem."

  ---

  ### **Weakest Step & Recovery Plan**
  *   **Weakest Step:** Step 2 ("Reasons as Potential Correctness-Makers"). It's abstract and crucial. If the link between "attitudes can be correct" and "reasons make them correct" isn't accepted, the rest wobbles.
  *   **Why Weak?** Lawyers/economists might resist the idea that attitudes *have* correctness conditions in this robust sense. Historians might see it as anachronistic.
  *   **What to Watch For:** Glazed eyes, skeptical murmurs ("Isn't admiration just subjective?"), or attempts to reduce it to personal preference or social norms.
  *   **Recovery Tactics:**
      1.  **Double down on relatable examples:** "If your colleague admires a boss *solely* because he's a bully, wouldn't you think 'That's messed up, the boss doesn't *deserve* admiration'? That intuition relies on a standard."
      2.  **Appeal to practice:** "Lawyers: When you argue undue influence re: a bequest to a 'charismatic' leader, aren't you implying the testator's admiration was *misplaced*? Economists: When modeling 'irrational exuberance,' isn't there an implicit standard of *rational* valuation being violated?"
      3.  **Pivot slightly:** "Even if you're skeptical about 'correctness,' think of it as: What reasons could you *cite to someone else* to convince them that *their* admiration (or lack thereof) is *warranted* or *unwarranted*? Those are the reasons we're talking about."

  ---

  **Overall:** Your awareness of the pitfalls is your best asset. Control the framing relentlessly at each step. The Museum case is your anchor—make it tangible and press the sincerity angle hard. Good luck! This is a fun one to teach.
