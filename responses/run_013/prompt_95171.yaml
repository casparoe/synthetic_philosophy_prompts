answer: |-
  ### Model Answer Requirements  
  To achieve full marks (18-20/20), a complete answer must:  
  1. **Identify Moore’s intrinsic goods**: Beauty and friendship (specifically, the pleasures of human intercourse and aesthetic appreciation) as non-hedonic, intrinsic goods known by intuition.  
  2. **Method of Isolation**:  
     - Explain it as a *test for intrinsic value*: Imagining a thing in complete isolation (no causes/effects/observers) to judge if its existence alone confers value.  
     - Apply correctly: e.g., An uninhabited beautiful world is better than an uninhabited ugly one, proving beauty’s intrinsic value.  
  3. **Principle of Organic Unities**:  
     - Define precisely: The value of a whole ≠ sum of its parts’ values; wholes can have *more* (or less) value than the sum.  
     - Apply to friendship: Affection + beloved person = a whole of greater value than affection or person alone.  
     - Apply to beauty: Enjoyment + beautiful object = a whole of greater value than either part alone.  
  4. **Avoid Key Errors**:  
     - Not conflating Moore’s view with virtue ethics (goods ≠ "virtues").  
     - Not misusing isolation as a decision-making tool (it’s purely evaluative).  
     - Not reducing beauty/friendship’s value to pleasure *qua* sensation (Moore rejects hedonism).  

  ---

  ### Assessment of Student Answer  
  **Mark: 14/20**  
  **Classification: Upper Second (2:1)**  

  #### Strengths (Where the answer is correct):  
  1. **Moore’s intrinsic goods**: Correctly identifies beauty and friendship (as "pleasures of human intercourse" and "enjoyment of beautiful objects") as intrinsic goods, contrasting them with hedonism (¶1). *(Accurate)*  
  2. **Method of Isolation**:  
     - Definition: Perfectly explained as testing intrinsic value by imagining a thing "stripped of all causes and consequences" (¶2). *(Excellent)*  
     - Application to beauty: Correctly uses the uninhabited beautiful/ugly world example to prove beauty’s intrinsic value independent of pleasure (¶2). *(Precise)*  
  3. **Principle of Organic Unities**:  
     - Definition: Clearly states "the value of a whole is always greater than the sum of the values of its parts" (¶3). *(Correct, though "always" is slightly imprecise—Moore allows for negative unities too.)*  
     - Application to friendship: Accurately describes affection + beloved as a more valuable whole than the sum of parts (¶3). *(Spot on)*  
     - Application to beauty: Correctly notes the whole (enjoyment + object) exceeds the value of enjoyment alone (¶3). *(Faithful to Moore)*  

  #### Weaknesses (Errors/omissions):  
  1. **Misrepresentation of value foundation** (¶4):  
     - **Error**: Claims beauty/friendship are valuable "because they are virtues" and "things a good person ought to cultivate".  
     - **Problem**: Moore *never* frames intrinsic goods as "virtues" (a term implying character traits). He is a consequentialist: goods are *states of affairs* to be maximised, not Aristotelian virtues. This conflates ethical frameworks. *(Serious conceptual error)*  
  2. **Misuse of isolation method** (¶4):  
     - **Error**: Suggests isolation helps "determine what we ought to do" by imagining consequences.  
     - **Problem**: Isolation is *not* a decision procedure. It solely tests *what things possess intrinsic value*. Moore uses it to identify goods, not to calculate right action. *(Fundamental misunderstanding)*  
  3. **Oversimplification of "ideal utilitarianism"** (¶4):  
     - **Issue**: While Moore is an ideal utilitarian, the student reduces his goods to "aesthetic appreciation and personal affection". Moore’s list includes *knowledge*, *love*, and *beauty* (with/without appreciation) as distinct goods. The conflation of "beauty" with "aesthetic appreciation" is partially corrected earlier (¶3) but resurfaces here. *(Minor inaccuracy)*  

  ---

  ### Justification for Mark  
  - **14/20**: The answer demonstrates clear understanding of core concepts (isolation, organic unities, non-hedonic goods) but commits significant errors in ¶4 by importing virtue ethics and misrepresenting isolation’s purpose. Fluency is strong, but this does not conceal the substantive flaws.  
  - **Why not higher?** ¶4’s errors undermine the overall coherence. Moore’s theory is distorted by framing goods as "virtues" and misusing isolation—both central to the question.  
  - **Why not lower?** The first three paragraphs are largely exemplary, showing undergraduate-level insight into organic unities and isolation. Compression is not penalised (e.g., "always" in organic unities is forgiven as shorthand).  

  **Feedback to Student**:  
  > "Your exposition of Moore’s method of isolation and principle of organic unities is largely accurate and well-illustrated, especially regarding beauty and friendship. However, you seriously misrepresent Moore in the final paragraph: (1) He does not classify goods as ‘virtues’—this conflates his consequentialism with virtue ethics; (2) The isolation test identifies intrinsic goods, it is not a tool for deciding ‘what we ought to do’. Revise these points to avoid conceptual blending. Focus on Moore’s actual arguments: goods are *states of affairs* to be maximised, not character traits."
