      But note: the sunk cost fallacy is about considering past costs that are irrecoverable. In this case, she is trying to avoid the $90 loss by winning the auction. However, the $90 loss is not sunk until the auction ends. At the moment she is the second-highest, she is committed to paying $90 if the auction ends now. But by bidding $105, she can change that outcome.

