  The cost of rejecting step (3):

  We must accept that real collective decision procedures often do not operate on an unrestricted domain. This is a realistic concession because in many contexts, preferences are structured. However, it does mean that we cannot have a one-size-fits-all voting rule that works for any possible preference profile. We have to design rules that are appropriate for the expected structure of preferences. In cases where preferences are not structured (truly unrestricted), then indeed we are forced into dictatorship (or random dictatorship if we use lotteries) to achieve strategy-proofness.

