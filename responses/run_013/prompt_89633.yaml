  - The example in (5) is a fair escape: it shows that by relaxing the requirement of unrestricted domain, we can have non-dictatorial, strategy-proof rules. Therefore, step (3) is too strong because it assumes that in every real collective decision the domain is unrestricted. In reality, we often have structured preferences that allow for non-dictatorial, strategy-proof rules.

