  (1) Gibbard-Satterthwaite theorem: any social choice function over three or more alternatives that is onto, defined on the unrestricted domain of strict preference profiles, and strategy-proof must be dictatorial.

  (2) A decision procedure counts as legitimate only if no participant can do better by misreporting their preferences than by stating them honestly. (This is the condition of strategy-proofness.)

  (3) Real collective decisions always offer at least three alternatives and place no restriction on the orderings participants may hold. (Unrestricted domain.)

  (4) Therefore, every real collective decision procedure is dictatorial.

  (5) But majority rule over single-peaked preferences returns the median position, and no participant is a dictator there.

  (6) Since (1) is a theorem, either (2) or (3) must be false.

  The friend concludes that (2) is false because we have an example in (5) that seems legitimate and non-dictatorial but does not satisfy unrestricted domain (it requires single-peaked preferences). The example in (5) is majority rule over single-peaked preferences, which is non-dictatorial and strategy-proof, but it does not operate on an unrestricted domain.

  Therefore, the problem lies in step (3). Step (3) claims that real collective decisions have an unrestricted domain. However, the example in (5) shows that by restricting the domain (to single-peaked preferences) we can have non-dictatorial, strategy-proof social choice functions. Moreover, in reality, many collective decisions do not have completely unrestricted domains. Preferences might be structured (e.g., single-peaked in one dimension, or more generally, by some common understanding) which allows for non-dictatorial procedures.

