answer: |-
  You've made a strong opening, but your twin case doesn't undermine the core claim. Your twin *shares* the same essential biological origin with you – the specific sperm and egg union. That shared origin is necessary for *both* of your existences. What individuates you two isn't a *different* origin event, but the subsequent physical separation into two distinct organisms *from that single origin event*. Your origin is fixed at the fertilization moment involving those particular gametes; the split itself is a later contingency within the development of the organism initiated by *that* union. The "grain" isn't arbitrary; it's the specific causal starting point of your biological existence as a distinct organism. Mitochondrial donation reinforces this: the essential nuclear DNA contribution (from the primary egg) remains the core generative material, even with supplemental mitochondrial DNA. The clone case proves genes alone aren sufficient – it's the *specific causal history* beginning with that fertilization. Finer details (precise sperm trajectory, exact timing within the event) are incidental to the material cause that brought *you* into existence. The privileged level is the one materially sufficient to initiate *this* organism.
