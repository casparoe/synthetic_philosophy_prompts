prompt: |-
  I spend my days building predictive models — gradient boosting, a few neural nets, a lot of worrying about out-of-sample error and distribution shift. And I keep getting into it with economists who say their theories rest on unrealistic assumptions and that's fine because the predictions hold up (the Friedman F-twist thing). I want to know whether that's just the water I already swim in. So: restate the debate over unrealistic assumptions in scientific models in my vocabulary — model misspecification, inductive bias, the training distribution, overfitting, regularization, generalization. Then give me the residue report: what in their argument has no counterpart in how I think? Is the leftover just "they care about explanation, I care about prediction," or is there something real in the idea that an assumption can be false and yet point in the right direction that my framework can't express? My gut says it's all bias-variance wearing a suit. Tell me whether that's right or whether I'm flattening something.
reasoning: |-
