  ### **Situationist Critique Activity: "The Virtue Vortex"**

  #### **Setup (10 minutes)**
  1. **Introduction (without spoilers):**  
     "Today, we’re designing a test to explore how consistent our actions are with our values. We’ll create a 'character challenge' for ourselves, then see how we do. No lectures—just action and reflection."  
     - **Goal:** Students co-create a "virtue test" for **helpfulness** (e.g., "How likely are you to help someone in need?"). Avoid moralizing; frame it as a psychology-style experiment.

  2. **Co-Design the Test (Brainstorm):**  
     - Ask: *"Imagine someone needs help in this school. What would be a **realistic scenario** where you could choose to be helpful? What would make it a 'fair' test of character?"*  
     - Guide them to pick **one scenario** (e.g., "a student drops a stack of papers near you").  
     - Then ask: *"What **situational factors** might make it harder/easier to help? Let’s pick one to test."*  
       - List ideas (noise, time pressure, mood, etc.). **Steer them toward trivial variables** (e.g., "whether someone else already helped").  
     - **Finalize the Test:**  
       - Scenario: *"A student (confederate) will struggle to pick up spilled papers in the hallway."*  
       - Test Variable: *"Whether another person has already stopped to help."*  
       - **Record their predictions:** *"How many of us will help if no one else has? If someone else has?"*  

  ---

  #### **Activity Rules & Timeline (35 minutes total)**  
  - **Prep (5 mins):**  
    - Split students into **Group A** and **Group B** using random assignment (e.g., birthday months).  
    - **Confederate:** Recruit a student beforehand (or use a teacher) to play the "struggling student." Brief them to:  
      - Spill papers at a specific spot in the hallway.  
      - Appear focused on picking them up (not making eye contact).  
  - **Phase 1: Group A (10 mins)**  
    - **Condition:** *No one helping*.  
    - Send Group A into the hallway individually (30 seconds apart) on a pretext (e.g., "Pick up a survey from the table at the end of the hall").  
    - They pass the confederate struggling **alone**.  
    - Observer (you) discreetly notes who stops to help.  
  - **Phase 2: Group B (10 mins)**  
    - **Condition:** *Someone already helping*.  
    - Send Group B on the same task, but **add a second confederate** (e.g., a teacher) helping the struggler.  
    - Note who stops to help.  
  - **Return & Initial Reflection (10 mins):**  
    - Students return to class. Have them **anonymously record**:  
      1. *"Did you help? Why/why not?"*  
      2. *"What factors influenced your decision?"*  
    - **Do not reveal the situational variable yet.**  

  ---

  #### **Debrief (15 minutes)**  
  1. **Reveal the Data:**  
     - Tally results on the board:  
       - *Group A (no helper present):* X helped / Y total.  
       - *Group B (helper present):* Z helped / W total.  
     - **Ask:** *"What pattern do you see? Why might Group B have helped less?"*  

  2. **Introduce Situationism:**  
     - *"What you experienced is the **situationist critique of virtue ethics**. We assumed our actions reflect stable character traits (like 'helpfulness'). But in reality, trivial situational factors—like whether someone else helped—often matter more."*  
     - Map their experience to classics:  
       - **Good Samaritan Study:** Seminary students late for a speech ignored a victim (time pressure).  
       - **Their test:** "Social proof" (someone else helping) reduced responsibility.  

  3. **Philosophical Discussion Prompts:**  
     - *"Does this mean we don’t have real virtues? Or are virtues just easily overridden?"*  
     - *"How should this change how we judge others? Or train our own character?"*  
     - *"Can virtue ethics survive this critique? (e.g., 'Virtues require practice to resist situations')"*  

  ---

  #### **Predictable Problems & Fixes**  
  - **Problem:** Students suspect a setup (e.g., noticing the confederate).  
    - **Fix:** Use high-traffic hallways; confederates should act naturally. If questioned post-activity, admit: "Yes, it was staged—but your reactions were real."  
  - **Problem:** No variance in behavior (e.g., everyone helps).  
    - **Fix:** Amplify pressure (e.g., tell Group A, "You’re late—hurry!"). If all help, discuss: *"What if the papers were messy? Or you were stressed?"*  
  - **Problem:** Students feel manipulated.  
    - **Fix:** Validate feelings in debrief: *"This is unsettling—but it’s why situationism is powerful."*  

  #### **What the Activity Can’t Reproduce (Say This Aloud)**  
  *"Real-life situational factors often work subconsciously. In this activity, you knew you were being tested. But in Milgram’s study or the Good Samaritan experiment, people had no idea their virtues were being challenged. That’s why situationism is so unnerving: we’re blind to how easily our environment overrides our principles."*  

  #### **Why This Works**  
  - Students **live** the critique—they design the test, then watch a trivial variable derail their "virtue."  
  - The debrief links their shock to philosophy, making abstract ideas visceral.  
  - Low prep: Uses school hallways, minimal props (papers), and leverages student curiosity.  

  **Total Time:** 60 minutes (adjust phases as needed).
