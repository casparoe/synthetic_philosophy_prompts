prompt: |-
  I'm in a jurisprudence seminar and we've spent the last three weeks on statutory interpretation — textualism, purposivism, the whole fight — and our assignment is to take a judge whose opinions we can actually read and try to reverse-engineer what she's doing. I picked a state appellate judge because her chambers publish everything, and I've now read enough of her statutory cases to have a weird problem. Here's her track record, roughly.

  Case one: a municipal ordinance banned vehicles "in the park," and the question was whether a park's paved service lane counted as "in the park." She held it did, and let the city ticket a delivery van, reasoning that "the park" in the ordinance plainly refers to the whole park, not just the grassy bits. Case two: the same city's anti-noise ordinance barred "amplified sound" between 10pm and 7am, and a bar owner argued his acoustic set (guitar and a singer, no amps) shouldn't count. She held it didn't count, and in the opinion she said something like the legislature said "amplified," and she wasn't going to rewrite it into "loud" just because the neighbors had a bad night. Case three, the interesting one: a state online-safety statute required platforms to verify that users are "residents of this state," and the platform checked IP addresses against a geolocation database, which misclassified a few thousand people. She held that didn't satisfy the statute — but her reasoning was that the whole point of the provision was to keep out-of-state actors off the platform, and IP geolocation is so unreliable that accepting it would defeat that purpose, so she read the verification requirement to demand something more accurate.

  Now the new case. Same judge, new statute: a road-safety law says accident reports must be "written on forms prescribed by the Department of Transportation." The Department has gone paperless — it no longer prescribes any paper forms, it just runs an online portal, and the statute hasn't been amended. A driver who filed her report through the portal is arguing the report counts; the other side says "written on forms" means paper forms and she's out of luck, which matters because filing a report is what preserves her insurance claim. I have to say how I think she'll rule, but more importantly I have to say what rule she's actually running, because I can't tell if she's a textualist with a soft spot or a purposivist who just reaches for the text when it suits her, and the assignment says I should name the further case that would settle which one it is.

  So: predict her ruling on the portal case, tell me which principle she's implicitly running (and be honest if more than one rule fits all three of her earlier cases — that's the part I keep going back and forth on), and then name the one further case I should go dig up that would actually distinguish the candidate rules, with a sentence on what each rule predicts there. One more thing: our TA wants the last line to be a single sentence we could paste into a spreadsheet, starting with "Verdict:".
reasoning: |-
  Hmm, the user is a law student in a jurisprudence seminar focusing on statutory interpretation. They've analyzed three cases from a state appellate judge and need to predict her ruling on a new case involving whether an online portal satisfies a requirement for accident reports to be "written on forms." They also need to identify her interpretive methodology and suggest a decisive hypothetical case.

  Looking at the three cases:
  - Case 1 (park vehicle ban): She took an expansive literal view of "the park" to include service lanes
  - Case 2 (noise ordinance): She strictly adhered to "amplified" rather than broadening to "loud"
  - Case 3 (online verification): She prioritized legislative purpose over literal text when technology failed the statute's goal

  The pattern isn't purely textualist or purposivist. She seems to default to textualism but shifts to purposivism when literal application would undermine the statute's core objective - what Hart and Sacks called the "mischief rule." In Case 3, the unreliability of IP geolocation triggered this switch.

  For the new "written on forms" case:
  - Literal reading points to paper forms
  - But purpose is clearly about standardized reporting for safety/insurance
  - Adopting paper forms today would actually frustrate the purpose
  - Likely she'll uphold the portal as compliant

  To confirm her methodology, we need a case where the text is clear but purpose is ambiguous. A hypothetical about "adult supervision" at pools would test whether she sticks to literal age (textualism) or allows maturity-based exceptions (purposivism).

  Key elements to include:
  1) Prediction for portal case (valid)
  2) Characterization as Textualist Default with Purpose Escape Valve
  3) Decisive hypothetical scenario
  4) Spreadsheet-ready verdict line

  The user's frustration with categorizing the judge is understandable - this is actually quite sophisticated judicial behavior that resists binary classification. The proposed framework accounts for all three cases while providing a clear test for future analysis.
answer: |-
  Based on the judge's pattern across the three cases and the new "written on forms" statute, here's the analysis:

  1.  **Predicted Ruling on Portal Case:** She will likely rule that the online portal **satisfies** the "written on forms" requirement. The driver's report filed via the portal is valid.

  2.  **Implicit Principle/Rule:** The judge operates under a **"Textualist Default with Purpose Escape Valve"** rule. This means:
      *   She *starts* with a strong textualist commitment, interpreting words based on their ordinary meaning and resisting judicial rewriting (Cases 1 & 2).
      *   She *deviates* towards purposivism **only** when:
          a)   The literal application of the text would **fundamentally defeat or undermine the statute's core purpose** (Case 3: IP verification defeated the purpose of keeping out-of-state actors off).
          b)   And crucially, the text is **reasonably capable of bearing the meaning** needed to achieve that purpose without outright contradiction (Case 3: "verify" could encompass methods beyond unreliable IP checks).

      **Why this fits all three cases:**
      *   **Case 1 (Park):** Textualism suffices ("park" plainly includes paved areas). No need for purpose escape.
      *   **Case 2 (Amplified Sound):** Textualism suffices ("amplified" plainly excludes acoustic). Purpose escape not triggered; neighbors' noise isn't the *core statutory purpose* explicitly defined by the word "amplified".
      *   **Case 3 (Verification):** Textualism *applied strictly* would defeat the core purpose (unreliable IP checks let out-of-staters in). Purpose escape valve triggered; "verify" can reasonably mean "verify reliably" to achieve the purpose.
      *   **Portal Case (Predicted):** A strict textualist reading ("written on forms" = paper) would defeat the core purpose (standardized accident reporting for safety/insurance) in the modern context where the agency has reasonably transitioned online. The phrase "written on forms prescribed" can reasonably encompass digital forms/portals as the modern equivalent, preserving the purpose. Purpose escape valve triggered.

  3.  **The Decisive Further Case:** The case that would definitively distinguish between "Textualist Default with Purpose Escape Valve" and pure textualism/purposivism is:

      **Hypothetical:** A statute mandates "adult supervision" (defined as "a person 18 years or older") for children's swimming pools. A highly mature and certified 17-year-old lifeguard is supervising. The question is whether this violates the statute.

      *   **Prediction under "Textualist Default with Purpose Escape Valve":** **Violation**. The text ("18 years or older") is clear and specific. Applying it literally does *not* fundamentally defeat the core purpose of ensuring competent supervision; the 17-year-old *might* be competent, but the legislature set a clear, bright-line age rule. No purpose escape valve is triggered. The text controls.
      *   **Prediction under Pure Purposivism:** **Likely No Violation**. The purpose is competent supervision. If the 17-year-old demonstrably provides competent supervision, they fulfill the purpose, regardless of the specific age text.
      *   **Prediction under Pure Textualism:** **Violation**. The text clearly says "18 years or older". The 17-year-old isn't 18.

      *Why this settles it:* This case has clear text setting a specific standard ("18 years or older"). Applying it literally achieves the general purpose (ensuring supervision by someone likely mature/competent) even if a specific 17-year-old *is* competent. Our judge's rule would *not* trigger the purpose escape valve here because the text isn't *defeating* the purpose; it's fulfilling it through a clear, if potentially over/under-inclusive, rule. A purposivist would likely ignore the text. A pure textualist would follow it. Our judge, based on her pattern, would follow the text.

  **Verdict:** Portal report valid; Judge uses Textualist Default with Purpose Escape Valve; Decisive case is age-based "adult supervision" statute requiring literal application.
