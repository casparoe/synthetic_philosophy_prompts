  Question:

  **Risk-Weighted Expected Utility**

  Consider the risk-weighted expected utility (RW EU) model with a utility function \(u\) and a risk function \(r\), where \(r:[0,1]\to[0,1]\) satisfies \(r(0)=0\) and \(r(1)=1\). For a gamble with outcomes \(x_1 \leq x_2 \leq \dots \leq x_n\) occurring with probabilities \(p_1, p_2, \dots, p_n\), the risk-weighted expected utility is given by:

  \[
  RW = u(x_1) + \sum_{i=2}^n [u(x_i) - u(x_{i-1})] \cdot r\left(\sum_{j=i}^n p_j\right)
  \]

  Throughout this question, assume a linear utility function \(u(x) = x\). Also, assume the risk function \(r(p) = 2p - p^2\).

  **Part (a)** [10 marks]

  Consider two gambles:
  - Gamble A: pays £100 with probability 0.6 and £0 with probability 0.4.
  - Gamble B: pays £60 for sure.

  (i) Calculate the risk-weighted expected utility of Gamble A and Gamble B.

  (ii) Which gamble is preferred according to the RW EU model?

  (iii) Calculate the expected monetary value of Gamble A. Explain why the preference you found in (ii) implies that the agent is not risk averse in this case.

  **Part (b)** [8 marks]

  (i) Show that the risk function \(r(p) = 2p - p^2\) is concave on [0,1].

  (ii) Despite the concavity of \(r\), the agent in part (a) is not risk averse. Explain why concavity of \(r\) does not necessarily imply risk aversion in the RW EU model.

  (iii) State the condition on \(r\) that determines whether the agent is risk averse for any two-outcome gamble. Verify that this condition does not hold for the given \(r\).

  **Part (c)** [12 marks]

  Consider an alternative model of decision under risk. In this model, the value of a gamble with outcomes \(x_i\) and probabilities \(p_i\) is given by:

  \[
  V = \frac{\sum_{i} r(p_i) \cdot u(x_i)}{\sum_{i} r(p_i)}
  \]

  where \(r\) is the same function as above. This model applies the risk function to each branch's probability and then renormalizes the weights.

  Now consider two lotteries:
  - Lottery G1: pays £100 with probability 0.5 and £0 with probability 0.5.
  - Lottery G2: pays £100 with probability 0.25 (on branch 1), £100 with probability 0.25 (on branch 2), and £0 with probability 0.5 (on branch 3). Note that G2 is just a splitting of the £100 branch of G1 into two equally likely branches.

  (i) Calculate the value of G1 and G2 under the alternative model. Do they yield the same value? Explain why this violates stochastic dominance.

  (ii) Calculate the risk-weighted expected utility of G1 and G2 under the RW EU model. Do they yield the same value? Explain why.

  (iii) The RW EU model passes the branch-splitting test (i.e., it assigns the same value to G1 and G2). Does this mean that the risk function \(r\) in the RW EU model is not acting as a probability weighting function? Or does it suggest that the RW EU model successfully separates risk attitudes from beliefs? Justify your answer.

  ---

  Model Answer:

  **Part (a)**

  (i) For Gamble A: outcomes are £0 (worst) and £100 (best). Probabilities: p1=0.4 (for £0), p2=0.6 (for £100). Using the RW EU formula:

  \[
  RW_A = u(0) + [u(100) - u(0)] \cdot r(0.6) = 0 + (100 - 0) \cdot r(0.6)
  \]

  We compute \(r(0.6) = 2 \times 0.6 - (0.6)^2 = 1.2 - 0.36 = 0.84\). Therefore, \(RW_A = 100 \times 0.84 = 84\).

  For Gamble B: only one outcome, £60. So:

  \[
  RW_B = u(60) = 60
  \]

  (ii) Since \(84 > 60\), Gamble A is preferred to Gamble B.

  (iii) The expected monetary value of Gamble A is \(0.6 \times 100 + 0.4 \times 0 = 60\). The agent prefers Gamble A (which has an expected value of 60) to the sure £60. This means the agent is risk seeking in this case because they are accepting a mean-preserving spread of the sure thing.

  **Part (b)**

  (i) To show concavity, we compute the second derivative. First, \(r'(p) = 2 - 2p\), and then \(r''(p) = -2\). Since the second derivative is negative for all p in [0,1], r is concave on [0,1].

  (ii) Concavity of r by itself does not imply risk aversion because risk aversion in the RW EU model depends on the relationship between r(p) and p. Specifically, for a two-outcome gamble, the agent is risk averse if r(p) ≤ p for the probability p of the better outcome. In part (a), we saw that r(0.6)=0.84 > 0.6, so the agent was risk seeking. Thus, concavity does not guarantee that r(p) ≤ p.

  (iii) For a two-outcome gamble, the agent is risk averse if r(p) ≤ p for every p in [0,1]. For the given r, we have r(p) - p = (2p - p²) - p = p - p² = p(1-p) ≥ 0 for all p in [0,1]. Hence, r(p) ≥ p for all p, meaning the condition for risk aversion fails. In fact, we have risk seeking for every two-outcome gamble.

  **Part (c)**

  (i) For the alternative model:

  - G1: two outcomes: £100 (p=0.5) and £0 (p=0.5). Weights: w1 = r(0.5) = 0.75 for £100, w2 = r(0.5)=0.75 for £0.
    Value: \( V_{G1} = \frac{0.75 \times 100 + 0.75 \times 0}{0.75 + 0.75} = \frac{75}{1.5} = 50 \).

  - G2: three outcomes: two for £100 (each p=0.25) and one for £0 (p=0.5). Weights: for each £100 branch, w = r(0.25)=2*0.25 - (0.25)^2=0.5-0.0625=0.4375; for £0, w = r(0.5)=0.75.
    Value: \( V_{G2} = \frac{0.4375 \times 100 + 0.4375 \times 100 + 0.75 \times 0}{0.4375 + 0.4375 + 0.75} = \frac{43.75 + 43.75}{1.625} = \frac{87.5}{1.625} = 53.846... \)

  Thus, G1=50 and G2≈53.85, so they are different. This violates stochastic dominance because G1 and G2 represent the same probability distribution (50% chance of £0 and 50% chance of £100). Hence, the alternative model is irrational.

  (ii) Under RW EU:

  - G1: outcomes £0 (p=0.5) and £100 (p=0.5). 
    \[ RW_{G1} = 0 + (100-0) \times r(0.5) = 100 \times 0.75 = 75 \]

  - G2: we can aggregate the two £100 branches because they are identical. So outcomes: £0 (p=0.5) and £100 (p=0.5). Then \( RW_{G2} = 75 \). Alternatively, without aggregation: three outcomes: £0 (p=0.5), £100 (p=0.25), £100 (p=0.25). Order: x1=0, x2=100, x3=100.
    \[ RW_{G2} = 0 + (100-0) \times r(0.25+0.25) + (100-100) \times r(0.25) = 100 \times r(0.5) + 0 = 75 \]
    So both give 75. They yield the same value.

    The reason is that the RW EU model depends on the cumulative probabilities. The improvement from 0 to 100 is weighted by the cumulative probability of getting at least 100, which is 0.5 in both representations. The split does not change the cumulative distribution, so the value is unchanged.

  (iii) The fact that RW EU passes the branch-splitting test (i.e., satisfies stochastic dominance) does not imply that the risk function r is not acting as a probability weighting function. Rather, it shows that the transformation applied by r to the cumulative probabilities is consistent with stochastic dominance. In contrast, the alternative model applies r to individual probabilities and then renormalizes, which is arbitrary and leads to violations. 

  However, the RW EU model does maintain a separation between beliefs (the probabilities) and risk attitudes (via r). The risk function r is applied to the cumulative probabilities, which is a way to model risk attitudes without distorting the underlying probabilities in a way that violates dominance. The transformation of the cumulative distribution is a well-established method (as in rank-dependent utility models) to capture risk attitudes. Therefore, the model successfully separates risk attitudes from beliefs because the probabilities are still the objective probabilities, and r is only used to weight utility increments in the cumulative distribution. The risk function r is not a probability weighting function in the sense of distorting individual branch probabilities arbitrarily, but it is a transformation of the cumulative distribution that respects the ordering of outcomes.

  ---

  Marking Scheme (Total 30 marks):

  **Part (a)** [10 marks]
  (i) [4 marks]
  - Correct RW_A: 2 marks (correct formula application: 1 mark, computation: 1 mark)
  - Correct RW_B: 2 marks (must be 60)

  Common mistakes: 
    - For A, forgetting to use r and just computing expected utility: 0 for RW_A.
    - For B, trying to apply the formula with multiple outcomes: but it's a sure thing, so only u(B)=60.

  (ii) [2 marks]
  - States A is preferred (1 mark) because 84>60 (1 mark)

  (iii) [4 marks]
  - Expected value of A: 60 (1 mark)
  - Explanation: the agent prefers a gamble with the same expected value as the sure thing, so they are risk seeking (or not risk averse) in this case (3 marks). Must mention that the gamble has the same expected value as the sure thing and the agent prefers the gamble.

  **Part (b)** [8 marks]
  (i) [2 marks]
  - Shows r''(p) = -2 < 0 (1 mark) and concludes concave (1 mark). Alternatively, uses the definition of concavity but that is harder.

  (ii) [3 marks]
  - Explains that concavity of r does not imply r(p) ≤ p (1 mark), and that in fact for this r, we have r(p) ≥ p (1 mark), and references part (a) as an example of risk seeking (1 mark).

  (iii) [3 marks]
  - States condition: for two-outcome gambles, risk aversion iff r(p) ≤ p for all p (2 marks). Notes that here r(p) ≥ p (1 mark). [If they only say for the specific p in (a), give 1 mark for condition and 1 mark for verification.]

  **Part (c)** [12 marks]
  (i) [5 marks]
  - Correct V_{G1}=50 (1 mark)
  - Correct V_{G2}=87.5/1.625=53.846... (2 marks: 1 for weights, 1 for computation)
  - States they are different (1 mark) and explains violation of stochastic dominance (1 mark): because G1 and G2 are the same distribution.

  (ii) [3 marks]
  - Correct RW_{G1}=75 (1 mark)
  - Correct RW_{G2}=75 (1 mark) [if aggregated, must state aggregation; if not, must show the three-step calculation]
  - Explains: because the cumulative distribution is the same, so the RW EU formula gives the same (1 mark).

  (iii) [4 marks]
  - States that passing the test does not mean r is not a probability weighting function (it is, but applied to cumulative probabilities) (1 mark).
  - Argues that the model separates risk attitudes from beliefs because the probabilities are objective and r only transforms the cumulative probabilities to capture risk (2 marks).
  - Contrasts with the rival model: the rival model distorts individual probabilities arbitrarily and then renormalizes, which breaks stochastic dominance, while RW EU does not (1 mark).

  Note: The answer must be in the spirit of the model answer. The key is that the transformation of cumulative probabilities is acceptable and maintains separation, while the rival model does not. If they say that r is a probability weighting function and that means there's no separation, that would be incorrect (and lose marks) because the model is designed to separate attitudes from beliefs by having the risk function applied to the cumulative probabilities.

  ---
  This question and marking scheme should meet the requirements. The calculations in (a) and (c) are essential, and the discussion in (b) and (c) requires understanding beyond the Allais paradox.
