  ### Summer Paper: Decision Theory  
  **Module:** Final-Year Decision Theory  
  **Question:** Risk-Weighted Expected Utility (Buchak)  
  **Marks:** 30 (≈45 minutes)  

  ---

  #### **Question**  
  Consider Buchak’s risk-weighted expected utility (RW EU) model. For a gamble with outcomes \(x_1 \leq x_2 \leq \dots \leq x_n\) and probabilities \(p_1, p_2, \dots, p_n\), the RW EU is:  
  \[
  RW = u(x_1) + \sum_{i=2}^n [u(x_i) - u(x_{i-1})] \cdot r\left(\sum_{j=i}^n p_j\right),
  \]  
  where \(u\) is a utility function and \(r: [0,1] \to [0,1]\) is a risk function with \(r(0) = 0\), \(r(1) = 1\).  

  **Assume linear utility** (\(u(x) = x\)) and **risk function** \(r(p) = 2p - p^2\).  

  **Part (a)** [10 marks]  
  1. Calculate the RW EU for:  
     - **Gamble A**: £100 with probability 0.6, £0 with probability 0.4.  
     - **Gamble B**: £60 for sure.  
  2. Which gamble is preferred?  
  3. Compute the expected monetary value (EMV) of Gamble A. Explain why the preference in (2) implies the agent is not risk-averse.  

  **Part (b)** [8 marks]  
  1. Show that \(r(p) = 2p - p^2\) is concave on \([0,1]\).  
  2. Despite concavity of \(r\), the agent in (a) is not risk-averse. Explain why concavity of \(r\) alone does not imply risk aversion in RW EU.  
  3. State the condition on \(r\) that determines risk aversion for any two-outcome gamble. Verify if this holds for \(r(p) = 2p - p^2\).  

  **Part (c)** [12 marks]  
  Consider an alternative model (**Branch-Weighted EU**) where the value of a gamble with outcomes \(x_i\) and probabilities \(p_i\) is:  
  \[
  V = \frac{\sum_{i} r(p_i) \cdot u(x_i)}{\sum_{i} r(p_i)}.
  \]  
  Now compare:  
  - **Lottery G1**: £100 with probability 0.5, £0 with probability 0.5.  
  - **Lottery G2**: £100 with probability 0.25 (branch 1), £100 with probability 0.25 (branch 2), £0 with probability 0.5 (branch 3).  

  1. Calculate \(V\) for G1 and G2 under the Branch-Weighted EU model. Do they differ? Explain why this violates stochastic dominance.  
  2. Calculate RW EU for G1 and G2 using Buchak’s model. Do they differ? Explain why.  
  3. Buchak’s model passes this "branch-splitting" test (i.e., same value for G1 and G2). Does this imply \(r\) is *not* a probability weighting function? Or does RW EU successfully separate risk attitudes from beliefs? Justify your answer.  

  ---

  #### **Model Answer** (≈750 words)  
  **Part (a)**  
  1. **RW EU calculations**:  
     - **Gamble A**: Outcomes \(x_1 = £0\) (\(p_1 = 0.4\)), \(x_2 = £100\) (\(p_2 = 0.6\)).  
       \[
       RW_A = 0 + [100 - 0] \cdot r(0.6) = 100 \cdot (2 \cdot 0.6 - 0.6^2) = 100 \cdot (1.2 - 0.36) = 100 \cdot 0.84 = 84.
       \]  
     - **Gamble B**: Certain outcome, so \(RW_B = u(60) = 60\).  
     **Preferred gamble**: \(RW_A > RW_B\) (84 > 60), so **Gamble A is preferred**.  
  2. **EMV of A**: \(0.6 \times 100 + 0.4 \times 0 = 60\). The agent prefers A (EMV=60) over B (60 for sure), implying **risk-seeking** behavior. A mean-preserving spread (A) is preferred to its certain equivalent (B).  

  **Part (b)**  
  1. **Concavity of \(r\)**: Second derivative \(r''(p) = \frac{d^2}{dp^2}(2p - p^2) = -2 < 0\), so \(r\) is concave.  
  2. **Concavity ≠ risk aversion**: Risk aversion in RW EU depends on whether \(r(p) \leq p\) for all \(p\), not concavity alone. Here, \(r(p) = 2p - p^2 \geq p\) (since \(r(p) - p = p(1-p) \geq 0\)), so the agent is risk-seeking. Concavity of \(r\) is insufficient; the key is \(r\) relative to the 45° line (\(r(p) \leq p\)).  
  3. **Risk aversion condition**: For two-outcome gambles, risk aversion iff \(r(p) \leq p\) for all \(p \in [0,1]\). Verification: \(r(p) - p = p - p^2 = p(1-p) \geq 0\), so \(r(p) \geq p\). **Condition fails** → agent is risk-seeking.  

  **Part (c)**  
  1. **Branch-Weighted EU for G1 and G2**:  
     - **G1**: \(r(0.5) = 0.75\), so weights: \(0.75\) (£100), \(0.75\) (£0).  
       \[
       V_{G1} = \frac{0.75 \times 100 + 0.75 \times 0}{0.75 + 0.75} = \frac{75}{1.5} = 50.
       \]  
     - **G2**: \(r(0.25) = 0.4375\) (each £100 branch), \(r(0.5) = 0.75\) (£0).  
       \[
       V_{G2} = \frac{(0.4375 \times 100) + (0.4375 \times 100) + (0.75 \times 0)}{0.4375 + 0.4375 + 0.75} = \frac{87.5}{1.625} \approx 53.85.
       \]  
     **Values differ** (50 ≠ 53.85). **Stochastic dominance violation**: G1 and G2 are identical lotteries (50% £0, 50% £100), yet assigned different values → irrational.  
  2. **RW EU for G1 and G2**:  
     - **G1**: \(RW_{G1} = 0 + [100 - 0] \cdot r(0.5) = 100 \times 0.75 = 75\).  
     - **G2**: Outcomes ordered as \(£0\) (\(p=0.5\)), \(£100\) (\(p_{\text{total}}=0.5\)).  
       \[
       RW_{G2} = 0 + [100 - 0] \cdot r(0.5) = 75 \quad (\text{aggregating identical £100 branches}).
       \]  
     **Values identical** (75). **Reason**: RW EU uses cumulative probabilities. For £100, the "improvement" weight \(r(\sum p_{\geq £100}) = r(0.5)\) is identical in G1/G2. Branch-splitting doesn’t alter cumulative distributions.  
  3. **Interpretation**: Passing the test **does not imply \(r\) is unrelated to probability weighting**. Rather, RW EU separates risk attitudes from beliefs:  
     - \(r\) transforms **cumulative probabilities** (attitudes toward risk), not raw probabilities (beliefs).  
     - The cumulative form ensures stochastic dominance (unlike Branch-Weighted EU), as weights depend on outcome ranks and aggregated tail probabilities.  
     - Thus, \(r\) *is* a probability weighting function, but applied to **decumulative distributions** (consistent with rank-dependent models). Beliefs (\(p_i\)) remain undistorted; risk attitudes (\(r\)) modify utility increments hierarchically.  

