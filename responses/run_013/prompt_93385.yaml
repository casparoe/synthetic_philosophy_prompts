     Therefore, the promised separation is maintained: the beliefs are the probabilities, and the risk function r is capturing the attitude towards risk. However, the way the risk function is applied is by transforming the cumulative probabilities. This is distinct from the rival model which transforms each individual probability and then renormalizes (which is more like a distorted belief). So the RW EU model does not conflate beliefs and risk attitudes in the same way as the rival model.

