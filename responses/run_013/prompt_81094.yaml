prompt: |-
  Right, so I'm a Bayesian statistician — biostatistics mostly, clinical trials and a bit of epi — and I keep bumping into the quantum foundations debate about whether the wavefunction is real. I want you to do a proper translation job here, not a vibe check.

  Here's the debate as I understand it. One camp says the wavefunction (or quantum state) is a piece of reality itself, the physical state of the system, as real as a field or a particle. The other says it's a state of information, a summary of what some agent knows or could in principle know, and that the actual physical state is something else underneath, some hidden configuration that the wavefunction is a probability distribution over. The labels people use are psi-ontic and psi-epistemic.

  Now, the bit I think is doing all the work, and that I want you to focus on. There's an argument — I've seen it sketched alot, I couldn't reproduce it properly — that goes roughly like this. Suppose you've got underlying real states, and each preparation procedure, each way of producing a quantum state in the lab, gives you a probability distribution over those underlying states. The epistemic view seems to need it to be possible that two different preparations, yielding two different quantum states, sometimes land on the same underlying real state. Otherwise the underlying state would just be a relabelling of the quantum state and the view collapses into the ontic one. Then you add an assumption that systems prepared independently of each other have independent underlying states. And supposedly from those two ingredients you can construct a scenario in which a joint measurement has an outcome that should be impossible under one of the preparations, but the setup makes it possible, contradicting the quantum predictions. So either the wavefunction is ontic, or you give up preparation independence, which people say amounts to a kind of action at a distance.

  So: restate that whole thing — both positions, the argument, the role each assumption plays, and what exactly the argument is meant to establish — in the vocabulary I actually use. Identifiability and non-identifiability, likelihoods and data-generating processes, parameters versus sufficient statistics versus posteriors, observational equivalence, priors and what happens when two different priors give the same posterior, exchangeability, whatever else earns its keep. I'm fluent in that stuff. I'm not fluent in quantum mechanics, so dont assume I know what a POVM is or what a Hilbert space is beyond a vague sense of a vector space.

  Then the part I actually want: the residue report. Which bits of the quantum debate map cleanly onto statistical vocabulary, which bits only map if you distort something to make them fit, and which bits have no counterpart in my vocabulary at all?

  And I want a verdict, not a hedge. My hunch going in is that psi-epistemic just means the wavefunction is a posterior and psi-ontic just means it's the parameter, and that I make that distinction about fifteen times a day without any drama, so the whole fuss looks like a category error on the physicists' part. Tell me where that hunch is right and where it's badly wrong. I suspect the interesting bit is something about the quantum state being claimed to be a complete description, so that if it's epistemic there's nothing left over to be ontic, whereas my likelihood is never claimed to be complete — I always get to have a real parameter sitting underneath. If that's the residue, say so and say what follows from it. If the residue is somewhere else, say where. And dont smuggle my framework's assumptions in and call it translation. If my vocabulary forces the debate into a shape it doesn't really have, I want to know that, and I want your view on whether that's a defect in my vocabulary or a sign the original debate is muddier than it looks.

  British English please, spelling and idiom both, and don't be polite about it — I'd rather the translation be ugly and honest than smooth and wrong.
