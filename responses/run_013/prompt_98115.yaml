prompt: |-
  I am a retired field biologist—thirty years in avian behavioral ecology—who has lately been reading philosophy of biology and trying to take seriously the thought that much of what we casually call communication may be better understood as costly signaling in the tradition of the handicap principle. For the past two years I have chaired the scientific review panel of a small foundation that funds animal-behavior and conservation projects; we meet quarterly and must decide, usually in a single afternoon, whether a proposal’s central claim about an honest signal is strong enough to fund. The proposals are written by people who know the vocabulary but often use it loosely: they treat any expensive trait as a handicap, or any correlation between a display and a quality as evidence of signaling, without distinguishing a signal from a cue, a handicap from a mere cost, or a receiver’s evolved response from a byproduct that happens to inform us. I would like you to write me a decision procedure the panel can actually run, in order, on each proposal—something like a flowchart in words. It should begin with the question of what would have to be true for the trait to be a signal rather than a cue, move through the conditions that make a signal credible (differential cost, condition-dependence, the link between the cost and the advertised quality, the receiver’s fitness consequences), and specify what counts as a sufficient answer at each stage, where the procedure stops with a clear no, and where it must hand the matter back to the panel as a judgment call because the issue is one of interpretation or values rather than evidence. Assume we have perhaps forty minutes per proposal, that I am the only member with formal behavioral-ecology training, and that our funding decisions are final unless the board overrides them.

  Then run the procedure on three proposals we have actually received. The first claims that a songbird’s complex song is an honest signal of developmental stress, on the strength of a one-year correlation between song complexity and a stress hormone, and asks for three years of funding to test the idea further. The second asks us to protect a costly male display in an endangered species on the grounds that the display is a viability indicator, so that preserving the display is preserving genetic quality; the species is genuinely endangered and I would very much like to fund the work, but the signaling claim is doing most of the argumentative work. The third comes from an economist and claims that conspicuous charitable donations in humans are a costly signal of prosocial quality, with a laboratory game showing that donors are rated more highly by observers. For each, give me the procedure’s verdict, the step at which it stops, and the answer I will not like if the procedure tells us not to fund something we are attached to.

  Finally, tell me what this procedure cannot do. I want the places where it will misfire, the distinctions from the theory that survive translation into a review panel and those that do not, and the points where a forty-minute panel with one trained biologist simply has to decide on grounds the procedure cannot supply. I do not need a survey of the literature or a reading list; I need something I can hand to the other panel members, who are intelligent but not specialists, and run in real time without pretending that a checklist has settled a question of biology or of value when it has not.
reasoning: |-
  We are designing a decision procedure to evaluate proposals that claim a trait is an "honest signal" in the context of costly signaling (handicap principle). The procedure must be runnable by a panel with limited time and only one trained biologist (the user). It will be structured as a flowchart in words, with clear stopping points (fund, do not fund, or judgment call). We focus on key theoretical distinctions: signal vs. cue, handicap vs. mere cost, and the conditions for credibility (differential cost, condition-dependence, link to quality, receiver's fitness consequences).

  **Decision Procedure: Flowchart in Words**

  **Step 1: Is the trait a signal or a cue?**
     - **Question:** Is there evidence that the trait has been shaped by natural selection *for the purpose of conveying information* to a receiver? Or is the trait merely providing information as a byproduct (a cue)?
     - **Required evidence for a signal:**
       - The trait must be conspicuous and directed at a receiver (or receivers).
       - There must be evidence that the receiver uses the trait to make decisions that affect fitness (e.g., mate choice, predator avoidance, cooperation).
       - If the trait is not directed and there is no evidence of a receiver's response, it is likely a cue.
     - **Stop and Do Not Fund If:** The proposal fails to establish that the trait is a signal (i.e., it is clearly a cue). [Proceed to Step 2 if it is a signal or if there is ambiguity.]

  **Step 2: Is the signal costly?**
     - **Question:** Is there evidence that the signal imposes a cost on the signaler?
     - **Required evidence:**
       - The cost should be measurable in terms of fitness (e.g., energy, time, predation risk, loss of opportunities).
       - The proposal must show that the cost is not just a byproduct of the trait's primary function (if any) but is inherent to the signaling function.
     - **Stop and Do Not Fund If:** The signal is not costly (or the cost is negligible). [Proceed to Step 3 if it is costly.]

  **Step 3: Is the cost a handicap? (i.e., differentially costly)**
     - **Question:** Is the cost of the signal higher for low-quality individuals than for high-quality individuals? (This is the core of the handicap principle: only high-quality individuals can afford the cost.)
     - **Required evidence:**
       - There should be a correlation between the signal and some aspect of quality (e.g., health, strength, resource-holding potential).
       - The proposal must provide a plausible mechanism by which the cost of producing/maintaining the signal is condition-dependent (i.e., the same level of signal is more costly for individuals in poor condition).
     - **Stop and Do Not Fund If:** The proposal does not address differential cost or condition-dependence. [Proceed to Step 4 if there is evidence or a strong hypothesis for differential cost.]

  **Step 4: Is the signal honest?**
     - **Question:** Is there evidence that the signal reliably indicates the quality it advertises? (The handicap ensures honesty because low-quality individuals cannot afford to cheat.)
     - **Required evidence:**
       - A correlation between the signal and the advertised quality (but note: correlation alone does not prove causation or honesty; it could be a cue without signaling).
       - Evidence that the signal is not easily faked (i.e., the cost prevents cheating).
       - Evidence that the receiver's response is adaptive (i.e., the receiver gains fitness benefits by responding to the signal).
     - **Stop and Do Not Fund If:** The signal does not reliably indicate the advertised quality (e.g., there is evidence of cheating, or the correlation is weak and not condition-dependent). [Proceed to Step 5 if honesty is supported.]

  **Step 5: Does the receiver's response confer a fitness advantage?**
     - **Question:** Is there evidence that the receiver's response to the signal has been shaped by natural selection? (i.e., the receiver gains fitness by responding appropriately, such as choosing a high-quality mate)
     - **Required evidence:**
       - The receiver must have a behavioral response to the signal.
       - The response must be shown to affect the receiver's fitness (or at least, a plausible argument that it would in the natural context).
       - Without this, the signal might be informative but not maintained by selection.
     - **Stop and Do Not Fund If:** There is no evidence of an adaptive receiver response. [Proceed to Step 6 if there is.]

  **Step 6: Integration and Judgment**
     - **Question:** Does the proposal adequately address the above steps? Are there gaps that require further investigation? (This step is for the panel to decide if the proposed research will fill critical gaps.)
     - **Required:**
       - The proposal must have a clear hypothesis and methods to test the signaling function, cost, condition-dependence, honesty, and receiver response.
       - If the proposal is for conservation, the panel must also judge whether the signaling claim is essential to the conservation argument and whether the conservation action is justified regardless of the signaling status (this is a value judgment).
     - **Judgment Call:** The panel must decide based on the strength of the existing evidence, the feasibility of the proposed research, and the conservation implications (if applicable). If the proposal passes Steps 1-5 but the research plan is weak, the panel may still reject it. If the proposal fails at an earlier step but the panel feels the conservation need is great, they may fund it for non-signaling reasons (but must acknowledge that the signaling claim is weak).

  **Stopping Points:**
     - **Fund:** The trait meets the criteria for an honest signal (Steps 1-5) and the proposed research is sound (Step 6).
     - **Do Not Fund:** The proposal fails at any of Steps 1-5, or the research plan is inadequate (Step 6).
     - **Judgment Call:** The panel must decide when the evidence is ambiguous (e.g., at any step, if the evidence is not clear but the proposal offers a way to test it) or when non-scientific values (like conservation urgency) override the signaling weakness.

  ---

  **Application to the Three Proposals:**

  **Proposal 1:** Songbird's complex song as an honest signal of developmental stress.

     - **Step 1 (Signal vs. Cue):** Bird song is often a signal (directed at mates or rivals). The proposal likely passes this step.
     - **Step 2 (Costly?):** Complex song is generally accepted as costly (energy, time, predation risk). Pass.
     - **Step 3 (Handicap?):** The proposal cites a one-year correlation between song complexity and a stress hormone. However, this does not directly show that the cost is differentially borne (i.e., that low-quality individuals pay more for the same song). It only shows that stress hormone levels (a proxy for developmental stress) are correlated with song complexity. The proposal does not provide evidence of differential cost. **Stop at Step 3: Do Not Fund.** The answer you won't like: The correlation found might be due to other factors (e.g., overall health) and without testing differential cost, it's not clear if the song is a handicap.

  **Proposal 2:** Protect a costly male display in an endangered species as a viability indicator to preserve genetic quality.

     - **Step 1 (Signal vs. Cue):** The display is likely a signal (directed at females). Pass.
     - **Step 2 (Costly?):** The proposal says the display is costly. Pass.
     - **Step 3 (Handicap?):** We don't have evidence that the cost is condition-dependent (i.e., that low-quality males pay more). The proposal might assume this, but we need evidence. Without it, we cannot be sure it's a handicap.
     - **Step 4 (Honest?):** Without Step 3, we cannot establish honesty. Also, the proposal does not provide evidence of a correlation between the display and viability (genetic quality). It might be a cue without being a signal.
     - **Step 5 (Receiver response?):** The proposal might not address the receiver's response (female choice) and its fitness benefits.

     **Verdict:** The proposal likely fails at Step 3 (and possibly Step 4). However, because the species is endangered and you want to fund it, the panel might consider:

     - **Judgment Call (Step 6):** The panel might fund the conservation work on the grounds that the display is part of the species' natural behavior and should be preserved regardless of whether it is an honest signal. But the procedure stops at Step 3 (Do Not Fund) for the signaling claim. The answer you won't like: The display might not be a viability indicator, so preserving it might not preserve genetic quality. The conservation action might be justified on other grounds (e.g., preserving natural behavior), but the signaling argument is weak.

  **Proposal 3:** Conspicuous charitable donations as a costly signal of prosocial quality.

     - **Step 1 (Signal vs. Cue):** The donations are conspicuous and directed at observers. The laboratory game shows that observers rate donors more highly. This suggests a signal (intended to influence observers). Pass.
     - **Step 2 (Costly?):** Donations are costly (money given away). Pass.
     - **Step 3 (Handicap?):** Is the cost differentially borne? The proposal does not show that low-quality individuals (those with low prosocial quality) would find the same donation more costly. In fact, a wealthy but selfish person might donate without it being a true signal of prosociality. Without condition-dependence (where the cost is higher for those with low prosocial quality), it may not be a handicap. **Stop at Step 3: Do Not Fund.** The answer you won't like: The laboratory game only shows that observers rate donors highly, but it doesn't show that the signal is honest (i.e., that donors are actually more prosocial) or that the cost is differentially borne. The economist might be missing the key condition-dependence.

  ---

  **What the Procedure Cannot Do:**

  1. **Resolve Ambiguities in Evidence:** The procedure relies on the evidence presented. If the evidence is ambiguous (e.g., a weak correlation in Step 3), the panel must make a judgment call. The procedure cannot replace scientific interpretation.

  2. **Handle Novel or Controversial Definitions:** If a proposal uses a non-standard definition of "signal" or "handicap," the procedure may misfire. The panel must rely on the user's expertise to interpret the terms.

  3. **Account for Non-Adaptive Explanations:** The procedure is focused on adaptive signaling. It may reject a proposal that has a valid non-adaptive explanation (e.g., the trait is a cue) even if the research is valuable for other reasons.

  4. **Value Judgments:** The procedure is designed for evaluating the signaling claim. It cannot make conservation or ethical decisions. For example, in Proposal 2, the panel might fund the conservation work despite a weak signaling claim because of the species' endangered status. This requires a judgment call outside the procedure.

  5. **Time Constraints:** In 40 minutes, the panel may not be able to thoroughly debate each step. The procedure may be applied too rigidly, leading to false negatives (rejecting a good proposal because one step was not clearly articulated) or false positives (funding because the vocabulary was used even without evidence).

  6. **Receiver's Fitness Consequences:** Step 5 requires evidence of fitness benefits for the receiver. This is often hard to measure, and the procedure may reject proposals that cannot feasibly measure fitness in the wild.

  7. **Distinguish Between Types of Costs:** The procedure may not adequately distinguish between production costs (which can be handicaps) and maintenance costs (which may not be). The panel must rely on the biologist's expertise.

  8. **Human Behavior:** Applying animal signaling theory to humans (as in Proposal 3) is particularly tricky because of cultural factors and the difficulty of measuring fitness in modern societies. The procedure may be too strict for human studies.

  In summary, the procedure is a tool to structure the discussion and ensure key theoretical points are addressed. It cannot replace the panel's judgment, especially when the evidence is incomplete or when non-scientific factors (like conservation urgency) are paramount. The user (as the trained biologist) must guide the panel through the nuances and be prepared to overrule the procedure when necessary.
answer: |-
  ### Decision Procedure for Evaluating Honest Signaling Claims

  This procedure is designed as a sequential checklist for your panel. It follows the logic of costly signaling theory (handicap principle) and requires explicit evidence at each step. **Time allocation per proposal: 40 minutes total.** The panel should assign one member to lead the discussion for each step (rotating as needed), with you (the biologist) as the final arbiter on theoretical ambiguities. Steps must be completed in order—if a proposal fails any step before Step 6, it does not proceed further. 

  ---

  #### **Step 1: Is the Trait a Signal (Not a Cue)?**  
  *(~5 minutes)*  
  **Question:** Is there evidence that the trait *actively influences a receiver's behavior* due to evolutionary selection for information transfer?  
  **Required evidence:**  
  - The trait must be perceptible and directed toward a receiver (e.g., visual/auditory display, pheromone emission).  
  - The receiver must exhibit a *consistent, functional response* (e.g., mate choice, aggression, cooperation) that affects fitness.  
  **Sufficient answer:** Proposal demonstrates both traits (e.g., through behavioral observations or experiments).  
  **Stop with "No" if:** The trait is passive, undirected, or the receiver's response is incidental (e.g., predator avoidance of bright colors without mate-choice context).  
  **Judgment call needed if:** Directionality or receiver response is inferred but not directly shown (e.g., "females likely prefer this trait" without data).  

  #### **Step 2: Is the Signal Costly?**  
  *(~5 minutes)*  
  **Question:** Does the signal impose a *measurable fitness cost* on the signaler?  
  **Required evidence:**  
  - Costs must be quantifiable (e.g., energy expenditure, time loss, predation risk, immune trade-offs).  
  - Costs should exceed baseline metabolic/developmental needs (i.e., not merely the cost of having a trait).  
  **Sufficient answer:** Proposal identifies specific costs supported by data (e.g., metabolic studies) or strong comparative evidence (e.g., "males with larger ornaments have higher parasite loads").  
  **Stop with "No" if:** Costs are assumed without evidence (e.g., "complex song is costly because it takes time") or are negligible.  
  **Judgment call needed if:** Costs are plausible but inferred (e.g., "donations reduce disposable income" without behavioral consequences).  

  #### **Step 3: Is the Cost Differential and Condition-Dependent?**  
  *(~10 minutes)*  
  **Question:** Is the cost *higher for low-quality individuals* than high-quality ones, making the signal a handicap?  
  **Required evidence:**  
  - A correlation between signal intensity/advertisement and individual "quality" (e.g., health, resources, longevity).  
  - A mechanism showing costs are *condition-dependent* (e.g., poor-condition individuals pay higher costs for the same signal).  
  **Sufficient answer:** Data linking signal variation to quality metrics (e.g., size, immunity) AND a plausible cost mechanism (e.g., resource allocation trade-offs).  
  **Stop with "No" if:** Only a quality correlation exists without cost differential evidence (e.g., "bigger horns correlate with health" but no proof that horn growth harms sick individuals more).  
  **Judgment call needed if:** Quality metrics are indirect (e.g., hormone levels as proxy for fitness) or the cost mechanism is theoretical.  

  #### **Step 4: Does the Signal Honestly Advertise Quality?**  
  *(~10 minutes)*  
  **Question:** Is the signal *reliably linked* to the advertised quality, and can low-quality individuals *not fake it*?  
  **Required evidence:**  
  - Honesty requires: (a) a causal link between quality and signal, not just correlation; (b) proof that cheating is uneconomical (e.g., low-quality individuals cannot sustain the signal without fitness loss).  
  **Sufficient answer:** Experimental manipulation (e.g., handicapping signalers reduces their performance) or longitudinal data showing signal fidelity predicts outcomes (e.g., survival).  
  **Stop with "No" if:** The signal-quality link is coincidental (e.g., both tied to a third variable like habitat) or fakable (e.g., cheap mimicry exists).  
  **Judgment call needed if:** Correlation is strong but causality untested (e.g., observational data only).  

  #### **Step 5: Does the Receiver Gain Fitness Benefits?**  
  *(~5 minutes)*  
  **Question:** Does the receiver's response *enhance its fitness* (e.g., through better mate choice or resource access)?  
  **Required evidence:**  
  - Receivers must obtain tangible benefits (e.g., higher offspring survival, reduced conflict costs) from responding.  
  - Benefits should outweigh the costs of response (e.g., time/energy spent assessing signals).  
  **Sufficient answer:** Data showing receiver fitness gains (e.g., females choosing high-signal males have more fledglings).  
  **Stop with "No" if:** Response benefits are absent or speculative (e.g., "females prefer loud calls" without fitness outcomes).  
  **Judgment call needed if:** Benefits are inferred from analogous systems (e.g., "similar signals benefit receivers in other species").  

  #### **Step 6: Overall Viability and Values Check**  
  *(~5 minutes)*  
  **Question:** Even if Steps 1–5 are passed, does the proposal:  
  - Address conservation/logistical needs (if applicable)?  
  - Acknowledge limitations and avoid overstatement?  
  **Judgment call needed:** Always. The panel must weigh:  
  - **Scientific merit:** Are methods robust? Does the project test key uncertainties?  
  - **Conservation urgency:** For endangered species, is action justified *regardless* of signaling status?  
  - **Ethical values:** Should we fund projects with weak signaling claims if they advance broader goals?  
  **Final decision:** "Fund," "Do not fund," or "Revise and resubmit."  

  ---

  ### Application to Proposals  
  **Assumptions:** Panel strictly follows the procedure. You dislike rejecting Proposal 2 due to conservation stakes.  

  #### **Proposal 1: Songbird song complexity as honest signal of developmental stress**  
  - **Step 1:** Passes. Song is directed at receivers (mates/rivals), and receivers respond (territory defense/mate choice).  
  - **Step 2:** Fails. No evidence of *costs* beyond correlation with stress hormone. "Complex song takes time" is insufficient without fitness trade-offs (e.g., predation risk).  
  - **Verdict:** Stop at Step 2 → **Do not fund**.  
  - **Answer you won’t like:** The hormone correlation may reflect a general stress response (cue), not an evolved signal. Funding risks conflating correlation with adaptation.  

  #### **Proposal 2: Conserving costly male display in endangered species as "genetic quality" indicator**  
  - **Step 1:** Passes. Display is directed at females; receivers (females) show preference.  
  - **Step 2:** Passes. Display is costly (energy/time in endangered species is critical).  
  - **Step 3:** Fails. No evidence of *differential cost* or *condition-dependence*. Display-quality correlation is assumed, but no data show sick/weak males pay higher costs.  
  - **Verdict:** Stop at Step 3 → **Do not fund** for signaling rationale.  
  - **Answer you won’t like:** The display could be a non-adaptive relic or cue. Funding based on signaling claims risks misallocating resources; conserve habitat instead.  
  - **Judgment call override?** Proceed to Step 6. Conservation urgency may justify funding *if* the panel agrees the species’ survival outweighs signaling validity.  

  #### **Proposal 3: Conspicuous donations as costly signal of prosociality**  
  - **Step 1:** Passes. Donations are conspicuous and directed; lab game shows receivers (observers) reward donors.  
  - **Step 2:** Passes. Donations are costly (money/opportunity loss).  
  - **Step 3:** Fails. No evidence costs are *differential* or *condition-dependent*. Wealthy selfish donors pay equal costs; prosocial "quality" isn’t proven to reduce costs.  
  - **Verdict:** Stop at Step 3 → **Do not fund**.  
  - **Answer you won’t like:** Lab ratings may reflect cultural norms (receiver bias), not evolved fitness benefits. Economic models ≠ biological signaling.  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve theoretical ambiguities in 40 minutes:**  
     - Distinctions like "signal vs. cue" (Step 1) or "condition-dependence" (Step 3) require your expertise. The procedure flags issues but cannot replace nuanced biological judgment.  
  2. **Handle proxy metrics:**  
     - E.g., "stress hormones" (Proposal 1) or "lab ratings" (Proposal 3) may not reflect fitness. The procedure demands direct evidence but cannot verify if proxies are valid.  
  3. **Account for conservation values:**  
     - The procedure is mechanistic and will reject Proposal 2 at Step 3. Only Step 6 allows ethical override—but this hinges on panel values, not science.  
  4. **Prevent "vocabulary masking":**  
     - Applicants may reframe failed steps as "untested hypotheses." The procedure exposes gaps but cannot force rigor; the panel must reject circular logic.  
  5. **Substitute for feasibility:**  
     - A proposal may pass all steps but have flawed methods (e.g., inadequate sample sizes). Step 6 catches this, but the panel must spot it quickly.  
  6. **Apply equally across taxa:**  
     - Human signals (Proposal 3) involve cultural evolution, which may not fit handicap logic. The procedure will misfire if applied dogmatically.  

  ### Final Advice for the Panel  
  - **Strengths:** This procedure forces specificity, screens out casually applied terminology, and prioritizes evidence over inference.  
  - **Weaknesses:** It is reductionist. Biology isn’t flowchart-friendly—honest signals exist on a continuum, and some steps (e.g., receiver fitness) are hard to test.  
  - **Role of the Biologist:** You must clarify ambiguities at each step (e.g., "Is this hormone a valid quality proxy?"). For judgment calls, guide the panel to articulate their values (e.g., "We fund Proposal 2 because extinction is irreversible, signaling aside").  
  - **Time Management:** Use a timer. If a step exceeds its limit, note the uncertainty and move on—precision is impossible in 40 minutes.  

  This won’t make funding decisions easy, but it will make them defensible.  

  ---  
  *Procedure checklist available as a one-page PDF for panel distribution upon request.*
