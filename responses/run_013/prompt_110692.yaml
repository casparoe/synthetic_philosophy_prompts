prompt: |-
  ok, so I've been reading rationalist blogs and lurking in the various discords for about a decade now, and I've built up alot of views about who deserves what that I'm pretty sure don't hang together. I'd rather find out here than in the middle of an argument with my brother in law. Here's the pile:

  1) Nobody deserves their talents. I didn't pick my genes, my parents didn't pick theirs, and the fact that I'm the kind of person who gets up at 6am and grinds is itself something that got installed by luck of the draw. So when someone tells me they earned their money because they work harder, I mostly roll my eyes.

  2) But my money is still mine. If I made it fair and square then nobody just gets to take it, that's taking stuff. I'm not some abolish-property guy.

  3) Really what I care about is the process. If nobody got lied to or coerced, the outcome is fine. I don't need the numbers to line up with some cosmic scoreboard of who's morally better than who.

  4) Which is why I can't stand hedge fund guys. Their pay is obscene, it's definately a real problem, and I'd support doing something about it, even though I'm fairly confident most of them didn't defraud anyone to get there.

  5) I'm also not one of those people who thinks determinism means nobody can be blamed for anything. Criminals deserve punishment. It's good to praise people who do hard things. Responsibility is real to me, not a fiction we tell each other for social convenience.

  6) And honestly? A world where everyone's wages got shuffled by a lottery when they turned 18 would be... morally fine? Nobody's rights get violated, it's just a different rule set going in. But I'd hate living in it and I can't articulate why, which bugs me.

  So: which of these actually conflict, which ones only look like they do, how bad is each one, and what's the cheapest thing to drop to fix it? Please rank them instead of telling me they're all sort of in tension, and please don't tell me to just go read the standard stuff — I want to know specifically which pair breaks and what it costs to patch it.
reasoning: |-
  Okay, the user has been into rationalist blogs and communities for about ten years. They've built up a set of beliefs about deservingness and justice that they feel might be inconsistent. They want to identify which of their points conflict, how severe the conflicts are, and which one would be the easiest to drop to resolve the inconsistencies. They’re looking for a clear ranking rather than a general discussion of tensions.

  First, let me list out their six points again for clarity:

  1. **Nobody deserves their talents** - Attributes like genetics, upbringing, and work ethic are due to luck.
  2. **But my money is still mine** - Property rights matter; earned wealth shouldn't be taken arbitrarily.
  3. **Process over cosmic justice** - Fair processes (no lying/coercion) justify outcomes, not moral deserts.
  4. **Hedge fund pay is problematic** - Despite likely fair processes, their obscene pay is an issue needing action.
  5. **Responsibility is real** - Determinism doesn't negate blame/praise; criminals deserve punishment.
  6. **Wage lottery morally fine but undesirable** - A random wage redistribution at 18 is morally acceptable but personally unappealing without a clear reason.

  The main conflicts I see are between points 3 and 4, and between points 1 and 5. 

  Point 3 says that if the process is fair, the outcome is fine, regardless of whether it matches some moral desert. But point 4 contradicts this because hedge fund pay is seen as problematic even if the process was fair (no fraud/coercion). So why support intervention if the process was fair? That’s a direct conflict. The user might be appealing to systemic issues like unequal opportunities or negative externalities, but their point 3 strictly values process over outcomes. This is probably the most severe conflict because it forces a choice: either accept hedge fund wealth as fair under point 3, or adjust point 3 to allow judging outcomes beyond process.

  Then there's point 1 vs point 5. Point 1 says no one deserves their talents, so hard work isn’t truly "earned." Point 5, however, insists on responsibility—criminals deserve punishment, praiseworthy actions deserve praise. If everything is determined by luck, how can we hold people responsible? The user might be distinguishing between moral responsibility and deservingness based on innate traits. But this still creates tension. Why punish someone whose criminal behavior stems from unlucky circumstances? This conflict is moderate because it might be resolved by redefining "deserve" in different contexts—maybe deserts apply to actions within one's control, even if the capacity for control is luck-based.

  Point 6 introduces another tension. The user finds a wage lottery morally acceptable because it doesn’t violate rights (aligns with point 3’s process focus). But they’d hate living in it. Why? If outcomes aren’t tied to effort or contribution, it could feel arbitrary or demotivating. This conflicts with point 2 (money as earned) and point 5 (praising hard work). The discomfort suggests an implicit belief that rewards should reflect effort or contribution, which clashes with the acceptance of pure luck in point 1. However, this conflict might be less severe because it’s more about personal preference than logical inconsistency.

  Prioritizing the conflicts:
  1. **Points 3 & 4 Conflict**: Most severe because it's a direct contradiction in principles. Supporting intervention against hedge fund pay requires abandoning the strict process-only view of point 3.
  2. **Points 1 & 5 Conflict**: Moderate. It challenges the basis of responsibility if everything is determined by luck. This might be patchable by separating "deserving talents" from "deserving consequences of actions."
  3. **Point 6 vs Points 1,2,5**: Less severe. The moral acceptance of the lottery aligns with point 3, but personal aversion hints at unacknowledged values like merit or effort, conflicting with point 1 and 2.

  The cheapest fix? Dropping point 4’s stance on hedge funds would resolve the clash with point 3, but the user seems emotionally invested in that view. Alternatively, modifying point 3 to allow for outcomes that, while process-fair, create systemic issues (e.g., extreme inequality leading to social harm) could reconcile it with point 4. This might be more acceptable than abandoning point 4 entirely.

  Dropping point 1’s universality might help with point 5, but the user seems firmly against deserving talents. Instead, distinguishing between deservingness of innate traits vs. responsibility for actions could be a patch. For example, even if talents are undeserved, we hold people responsible for how they use them.

  For point 6, articulating why they’d hate the lottery might involve valuing agency, effort recognition, or incentive structures—concepts that points 1 and 2 touch on. But this conflict is less urgent as it’s more about personal discomfort than a core inconsistency.
answer: |-
  Based on your framework, here's a ranked breakdown of the conflicts and their severity, along with the cheapest fix. The core tension is between your **anti-desert foundational principle** (Point 1) and your **intuitions about agency/responsibility** (Points 2, 4, 5), with Point 3 acting as an unstable bridge between them. Point 6 highlights the emotional gap in your theory.

  ### Ranked Conflicts (Most Severe First):
  1. **Points 3 vs. 4**  
     **Conflict**: Point 3 claims process purity (no lying/coercion) justifies *any* outcome. Point 4 rejects hedge fund wealth *despite* likely satisfying Point 3's criteria.  
     **Severity**: **Critical**. This is a direct contradiction. If hedge fund pay is "obscene" and needs fixing despite fair processes, Point 3 is incomplete or wrong.  
     **Why it breaks**: You intuitively recognize that extreme inequality can be *structurally unjust* even without fraud—e.g., exploiting information asymmetry, regulatory capture, or zero-sum rent-seeking. Point 3 ignores systemic power imbalances masquerading as "voluntary" transactions.

  2. **Points 1 vs. 5**  
     **Conflict**: Point 1 says no one deserves innate traits (including diligence). Point 5 insists criminals "deserve" punishment and effort "deserves" praise.  
     **Severity**: **High**. If all traits are luck-based, *consistent* desert-based blame/praise collapses. Why punish a criminal whose upbringing/genetics made crime likely?  
     **Why it breaks**: You're conflating *moral desert* (Point 1) with *pragmatic responsibility* (Point 5). You need to ground blame/praise *without* appealing to ultimate deservingness—e.g., "We punish to deter, not because they 'deserve' it."

  3. **Points 1/3 vs. 2**  
     **Conflict**: Point 2 asserts strong property rights ("my money is mine"). But if talents are undeserved (Point 1) and only process matters (Point 3), why is *redistribution* inherently wrong? Point 6's lottery shows you accept this logically.  
     **Severity**: **Moderate**. Point 2 relies on emotional intuition ("taking stuff feels wrong") unsupported by Points 1/3.  
     **Why it breaks**: If outcomes are arbitrary (Point 1) and justice is purely procedural (Point 3), property rights are *conventional*, not sacred. Yet you reject "abolish-property" views on instinct.

  4. **Point 6 vs. Points 1/2/5**  
     **Conflict**: You call the wage lottery "morally fine" (consistent with Points 1/3) but admit you'd "hate it."  
     **Severity**: **Low**. This isn't a logical flaw but reveals your *unstated values*: effort → reward links (Point 5) and ownership (Point 2) matter *to you* beyond pure process.  
     **Why it breaks**: Your aversion exposes that you value *agency* and *earned status* more than your theory admits. The lottery severs effort from outcome, making life feel meaningless or arbitrary.

  ---

  ### The Cheapest Fix: **Modify Point 3**  
  **Why**:  
  - It resolves the worst conflict (Point 3 vs. 4) with minimal changes to other points.  
  - It's more flexible than dropping Point 4 (which aligns with widespread moral intuition) or overhauling Point 1 (which is philosophically robust).  
  - It explains your hedge fund objection *without* appealing to desert (so Point 1 stays intact) and validates your Point 6 discomfort.  

  **How to patch Point 3**:  
  *Revise to*: **"I care about fair processes *and* preventing systemic harm. Outcomes are fine only if they don’t create destabilizing power imbalances or exploitation, even without explicit fraud/coercion."**  

  **How this fixes the conflicts**:  
  - **Resolves Point 3 vs. 4**: Hedge fund pay can be "obscene" not due to fraud, but because it entrenches oligarchy, incentivizes short-termism, or extracts wealth without social value. Action (e.g., progressive taxation) becomes justified.  
  - **Eases Point 1 vs. 5**: Responsibility/praise shift from "desert" to *social function*. We punish to uphold norms; we praise to incentivize prosocial behavior—no contradiction with determinism.  
  - **Explains Point 6 discomfort**: The lottery *creates systemic harm* by decoupling effort from reward, destroying incentives for skill-building/social contribution. This violates your revised Point 3.  
  - **Preserves Point 2**: Property rights remain, but are conditional on avoiding systemic harm (e.g., you can keep "fair" earnings, but not hoard resources during famine).  

  **Cost**: Low. You already *feel* this—your hedge fund view implies Point 3 is flawed. No need to abandon core stances (e.g., anti-desert, pro-responsibility).  

  ### Alternative Fixes (Higher Cost):
  - **Drop Point 4**: Cheapest logically, but costly emotionally. If you *actually* believe hedge fund wealth is harmful, ignoring this creates cognitive dissonance.  
  - **Drop Point 1**: Philosophically expensive. Requires defending moral desert, which clashes with determinism and your core premise.  
  - **Drop Point 5**: Pragmatically costly. Abandoning blame/praise undermines social cohesion and feels alien to your values.  

  ---

  ### Key Takeaway  
  Your framework is 90% coherent if **Point 3 is expanded to include systemic justice**. The remaining tensions (e.g., property rights in a luck-based world) become manageable once outcomes aren't judged *only* by process purity. This aligns with Rawls-inspired views: institutions should mitigate the moral arbitrariness of luck (Point 1) while respecting agency (Point 5) and process (Point 3), without requiring cosmic desert.
