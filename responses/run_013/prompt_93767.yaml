  heres the setup as i have it: if ZFC has a model at all then it has a countable one, call it M. but ZFC proves there are uncountable sets, and M agrees, so M has an element s that M believes is uncountable. meanwhile M is countable from the outside, so theres a bijection between the naturals and the members of s — just not one that lives inside M. ok, so 'uncountable' only means 'no bijection in M'. i get that part.

  what i dont get is where the story is allowed to stop. a classmate said: fine, but the metatheory we're using is also just a first-order theory, so if it has a model it has a countable one too, which means 'countable' in the metatheory is exactly as model-relative as it is inside M. so when we say M is 'really' countable from the outside, we're secretly helping ourselves to an absolute notion of countability that we don't actually have. the prof said that's a different issue and moved on, but i can't see how it's different — it looks like the identical move, just one level up.

  can you explain the conceptual issue properly? specifically: what is actually being claimed when we say M is countable from the outside, and what's the difference between that claim and the claim inside M; why the paradox doesn't show that every set is really countable; and whether my classmate is right that the same relativity applies to the metatheory. if he is right, does the "everything is really countable" conclusion (i think it's sometimes called the skolemite reading? not sure) go through, or does it collapse into something trivial/self-undermining? also someone in the back said it matters whether M is transitive — is that relevant to any of this, and if so how?

