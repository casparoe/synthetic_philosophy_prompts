prompt: |-
  I have kept a private ledger of my verdicts about strategic behavior in collective decisions, and I would like to know what principle, if any, they express. I am not asking which manipulations succeed; I take the mechanics for granted. I am asking which are legitimate — fair game as against a kind of cheating — and I do not yet have a theory of what legitimacy amounts to here. That is part of what I want the principle to supply.

  The cases, with my verdicts:

  1. A three-candidate plurality election. My preferred candidate cannot win. I vote for my second choice in order to keep my least preferred candidate out. Verdict: fair game, and I feel no residue about it.
  2. The same election under an approval ballot. I approve a candidate I do not in fact approve of, because approving them helps them beat someone worse. Verdict: fair game, though it leaves a faint taste.
  3. A Borda count. I rank a rival below a candidate I genuinely prefer the rival to, in order to depress the rival's score. Verdict: cheating. This puzzles me, because the arithmetic effect is of the same kind as in case 1.
  4. A two-round runoff. In the first round I vote for a fringe candidate I would never want in office, so as to shape whom my real favorite faces in the second round. Verdict: fair game, no worse than case 1.
  5. The same election as case 1, except that I am one of five hundred voters who have agreed in advance to misreport identically. Verdict: cheating — and yet each of us performs exactly the act I called fair game in case 1.
  6. A rule whose strategy-proofness is guaranteed only under a restriction on the domain of preferences — only if everyone's preferences are single-peaked, or only if each voter cares about just two outcomes — is applied to a population that violates the restriction, and I misreport. Verdict: fair game; the guarantee was conditional, and the condition failed.
  7. A rule that really is strategy-proof on its domain, so that reporting truthfully is a dominant strategy for every voter, and I misreport anyway. Verdict: not cheating, merely self-defeating; I have no complaint about the outcome.
  8. I chair a meeting and choose the order in which pairs of options are put to a vote, so that a cycle among the options resolves in favor of the one I prefer. Every vote cast is sincere. Verdict: cheating — more so than any of the misreporting above, although nobody misrepresented anything.
  9. I vote sincerely for a candidate who cannot win, knowing that this hands the election to the candidate I least want. Verdict: not cheating and not wrong; but I would be a fool, and I notice that cases 1 and 9 together seem to imply that I should always desert my favorite when it is hopeless, which cannot be right.

  My tentative principle: manipulation is fair game precisely when the rule's guarantee does not hold for me, and where the guarantee does hold, manipulation is either pointless or a betrayal of an assurance the designer gave. But I half-remember a theorem of Gibbard and Satterthwaite, to the effect that any procedure that selects exactly one winner, that can in some circumstances select any of the candidates, that has at least three candidates to choose among, and that never gives any single voter a reason to misreport, must be one in which some one voter's favorite always wins. If that is right, my tentative principle licenses manipulation under every procedure except a dictatorship, which cannot be what I meant. I also half-remember a companion result to the effect that whatever a manipulable procedure achieves in equilibrium can equally be achieved by an honest-reporting procedure built for the purpose, which would make the reproach "the designer should have made it strategy-proof" available in every case, and therefore toothless.

  What I want is the principle, or a small set of candidate principles, stated precisely enough that I can see where they differ: the case that motivates each clause, what the principle says about any of the cases above that it does not obviously fit, and an honest statement of which of my verdicts it cannot accommodate. In particular, tell me whether the difference between coordinated and individual action (case 5 against case 1) is doing independent work or is a proxy for something else — that a bloc manufactures a sucker, or that it degrades the procedure's informational function — and what the principle says about four cases I have not listed: a lone sincere voter in a population where everyone else manipulates; a manipulation that changes no outcome; a voter who reports honestly but abstains in order to change the outcome; and a rule that returns a set of winners, or randomizes among them, if that alters the impossibility at all.

  Begin your reply with the principle itself, in the first sentence or two, and only then give the reasoning. No preamble, and do not restate my cases back to me.
reasoning: |-
  Hmm, the user is presenting a complex ethical dilemma about strategic voting in collective decision-making. They've shared nine detailed scenarios with their personal judgments on what constitutes "fair game" versus "cheating," and they're seeking a unifying principle that explains these judgments. 

  The core tension here is between instrumental rationality (getting desired outcomes) and procedural integrity (following rules as intended). I notice their verdicts aren't purely consequentialist - case 3 and 5 feel like cheating despite similar outcomes to case 1. The Gibbard-Satterthwaite theorem looms large here, suggesting true strategy-proofness is impossible in non-dictatorial systems.

  Key patterns in their judgments:
  - Solo strategic voting usually feels acceptable (cases 1,2,4)
  - Coordinated manipulation crosses a line (case 5)
  - Exploiting preference domains feels fair (case 6)
  - Procedural manipulation feels worse than misreporting (case 8)
  - Sincere voting isn't cheating even if foolish (case 9)

  Their tentative principle about "guarantees" has merit but needs refinement. The Gibbard-Satterthwaite problem means we must accept some manipulation as inevitable. Perhaps the distinction lies in whether the rule invites/protects against manipulation through its design, or whether the manipulation violates fundamental democratic norms like non-collusion or truthful preference revelation.

  The coordinated vs individual distinction (case 5 vs 1) seems crucial - collusion creates power asymmetry while solo acts preserve voter autonomy. Case 8's chair manipulation feels like cheating because it hijacks the agenda-setting power that should be neutral.

  For the unlisted cases they mentioned:
  - A lone sincere voter among manipulators: likely fair game but tragic
  - Ineffective manipulation: morally neutral but strategically silly
  - Strategic abstention: analogous to approval voting (case 2)
  - Set/randomized winners: might soften Gibbard-Satterthwaite but won't eliminate strategic dilemmas

  I'll formulate principles that honor their intuitive judgments while addressing the theoretical constraints. The "informational function" framing seems promising - voting rules exist to aggregate preferences, so manipulations that corrupt this function (like collusion or agenda manipulation) feel more illegitimate than those working within the system's inherent limitations.
answer: |-
  The principle is: **Strategic misreporting is legitimate when it responds to a failure in the rule’s promised incentives, provided it does not corrupt the informational purpose of the vote by coordinating with others or subverting the rule’s structure.**  

  ### Reasoning:  
  Your verdicts distinguish manipulations that *adapt* to the rule’s limitations from those that *exploit* or *undermine* its function. The principle reconciles this by focusing on:  
  1. **The rule’s guarantee**: Manipulation is fair when the rule fails to deliver its incentive-compatibility promise (cases 1, 2, 4, 6). Case 7 is self-defeating because the guarantee holds.  
  2. **Coordination as corruption**: Solo acts (cases 1, 4) are adaptation; identical coordination (case 5) manufactures artificial preference signals, violating the rule’s reliance on independent inputs. This degrades informational integrity, making it cheating.  
  3. **Procedural subversion**: Agenda manipulation (case 8) hijacks the rule’s machinery, making votes sincere but meaningless. This breaches legitimacy more than misreporting, as it attacks the framework itself.  
  4. **Sincere voting**: Case 9 is not cheating because legitimacy concerns manipulation, not poor strategy. The duty is to vote instrumentally rational *only if* the system invites it (hence no contradiction with case 1).  

  ### Unlisted cases:  
  - **Lone sincere voter among manipulators**: Fair (analogous to case 9). The principle addresses *your* actions, not others’.  
  - **Manipulation changing no outcome**: Not cheating (no harm), but irrational. The principle focuses on legitimacy, not efficacy.  
  - **Strategic abstention**: Analogous to approval voting (case 2); fair if abstention is a permitted input.  
  - **Set-valued or randomized rules**: Gibbard’s theorem extends here: strategy-proofness remains impossible for non-dictatorial rules. Manipulation is fair when the rule’s domain/assumptions fail (e.g., misreporting under non-single-peaked preferences).  

  ### Misfits and limitations:  
  - **Case 3 (Borda)**: Your verdict ("cheating") conflicts with the principle. Borda offers no dominant-strategy guarantee; misreporting responds to its vulnerability. The principle thus labels it fair. To preserve your intuition, an addendum is needed: *"Manipulation that inverts true preferences is cheating, even if the rule fails."* This explains your "taste" in case 2 (partial inversion) and condemns case 3 (full inversion).  
  - **Case 7**: The principle calls it "pointless" (not cheating), matching your verdict.  
  - **Gibbard-Satterthwaite**: The principle acknowledges universal manipulability but restricts legitimacy to *uncompensated failures* (e.g., domain violations). It rejects "designer should have made it strategy-proof" as irrelevant when the failure is inherent.  

  ### Core tension:  
  Coordination (case 5) is not a proxy; it independently corrupts information. Solo acts (cases 1, 4) use the rule’s feedback loop honestly; collusion falsifies the input, making the rule process noise. The principle thus licenses common individual tactics but condemns coordination as a betrayal of the voting mechanism’s purpose.
