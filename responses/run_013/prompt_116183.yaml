prompt: |-
  I'm in a small reading group that's a weird philosophy-of-mind / AI crossover (thursday nights, four of us, one of whom is a retired roboticist who keeps derailing us into hardware stories), and we've spent the last month on the frame problem and gotten absolutely nowhere. What's maddening is that we all know the same material. Roughly two camps. Camp one says the frame problem is basically a solved technical annoyance: the original issue was that in a logic-based planner you have to write down, for every action, axioms saying everything the action *doesn't* change, and that explodes; once you have nonmonotonic logic, defaults, circumscription, successor-state axioms and so on, you can handle it, and sure there was the Yale shooting problem and some other wrinkles, but those are normal growing pains of a formal theory, and no one hand-writes frame axioms in a real planning system anymore. Camp two says all of that only addresses the version of the problem that a human has already carved up in advance: someone had to decide which predicates, which objects, which actions, which features of the world count, and the system will cheerfully ignore that its gripper is on fire or that the block is sitting in a puddle of gasoline, because nothing in the axiomatization tells it to care. That, they say, is the real problem, and it's about relevance, not about nonmonotonic inference. Then someone pipes up that the deep version isn't really about logic at all but about cognitive architecture (Fodor and Dennett both made a meal of it, I think), and the formalists say that's just a different problem that got stuck with the same name.

  We keep replaying the same exchange: camp two produces a case where the system does something stupid in a situation the modeler didn't anticipate, camp one says give me the extra axiom and I'll encode it, camp two says that is precisely the point, and we go around again. Nobody budges. My own suspicion, and I want you to treat this as a hypothesis you're free to shoot down rather than something to agree with, is that the two camps are answering different questions under one name: one is asking whether we can build a formal system that does what we want inside a domain we've already specified, the other is asking what makes a piece of information relevant to a piece of reasoning and how a finite agent gets that right without being told, so the fight is really about what would even count as a solution. But I can also see a reading where there's a genuine hidden disagreement about facts, e.g. whether humans actually solve the relevance problem or just appear to, or whether any of the planning results tell us anything about cognition at all.

  So: what kind of disagreement is this, really, and is my hypothesis right? I want a diagnosis, not a survey, and please don't hand me a reading list, I can't get at most of those journals anyway. If it's verbal, tell me which word is doing the work. If it's really empirical, say what the experiment or measurement would be and whether anyone could run it. If it's two questions under one name, name both and say whether either is tractable, or whether one of them is just a bad question we should stop asking. And given your diagnosis, what would actually count as progress here, a distinction, a theorem, a working system, or nothing? I'd rather be told the impasse is my own fault for lumping things together than get a both-sides-are-right answer, so be concrete about which claims from each camp you're leaning on when you say it.
reasoning: |-
  Okay, the user is in a reading group stuck on the frame problem. They've split into two camps: one sees it as a solved technical issue in AI planning, while the other thinks it's about relevance and how agents determine what matters without explicit axioms. The user suspects these are actually two distinct questions being conflated under the same name.

  Let me unpack this carefully. The user's group is hitting a wall because each camp is talking past the other. Camp one points to technical solutions like successor-state axioms in planning systems. That's valid for bounded domains where all variables are predefined. But camp two is wrestling with how humans or AGI would handle novel situations - like noticing the gripper is on fire when that wasn't modeled. 

  The key insight here is recognizing these as separate problems. The first is about efficient reasoning within a fixed ontology (call it the Representational Frame Problem). The second is about dynamic relevance determination (the Ontological Frame Problem). 

  For the technical camp, progress looks like better heuristics for automated axiom generation. But for the relevance camp? We'd need systems that can spontaneously notice critical anomalies - like DeepMind's AI identifying a dropped pixel as significant in a game. That's why the user's hypothesis is correct: the camps aren't disagreeing on facts but answering different questions.

  What would resolve this? For the technical problem: show a planner that auto-generates minimal frame axioms. For the relevance problem: demonstrate an agent that redefines its own parameters when context shifts unexpectedly. We don't have the latter yet, which explains why camp two remains unsatisfied with current "solutions."

  The user's frustration makes sense - they're being asked to debate apples as if they're oranges. Naming these separate problems would let each camp engage their actual concerns without talking past each other. The technical problem is largely solved; the ontological one remains profound and unsolved. That's the diagnosis they need to break the deadlock.
answer: |-
  Your hypothesis is fundamentally correct: **this is a case of two distinct problems sharing one name, and the impasse stems from conflating them as a single "frame problem."** Both camps are right about their respective problems but wrong in claiming theirs is *the* frame problem. The confusion is terminological, not empirical or purely philosophical. Let's dissect it:

  ### The Two Problems Under One Name:
  1. **The Representational Frame Problem (Camp One's Focus):**  
     *"How can we efficiently represent what remains unchanged during actions within a predefined, bounded formal system?"*  
     - **Status:** Largely solved for practical AI planning. Techniques like successor-state axioms, fluent occlusion, and domain-specific compilers allow systems to avoid hand-coding frame axioms.  
     - **Tractable?** Yes, within circumscribed domains (e.g., logistics planning, chess).  
     - **Progress looks like:** Faster SAT solvers, better heuristic search, automated axiom generation.  

  2. **The Relevance Problem (Camp Two's Focus):**  
     *"How does an agent dynamically determine which features of an unbounded world are relevant to its goals, actions, or survival, without prior exhaustive specification?"*  
     - **Status:** Unsolved and deeply linked to cognition, consciousness, and AGI. Humans use heuristics (e.g., salience, emotion, analogy) and embodied experience to filter relevance. No formal system replicates this robustly.  
     - **Tractable?** Not with current formal tools alone. Requires cognitive architecture, not just logic.  
     - **Progress looks like:** Systems that *notice* novel anomalies (e.g., a robot halting because its sensor detects smoke, not because "fire" was pre-encoded).  

  ### Why the Conflation Happens:
  - **The word "frame"** is the culprit. It originally meant the "frame" of axioms defining state changes in logic-based AI (Problem 1). But "frame" also evokes a "frame of reference" (Problem 2)—what an agent *attends to* in a situation.  
  - **Both camps point to real failures:**  
    - Camp One sees Problem 2 as "just noisy real-world implementation."  
    - Camp Two sees Problem 1 as "trivial window-dressing on a deeper issue."  

  ### What Would Resolve the Disagreement?
  1. **Admit the split:** Explicitly label the two problems. Progress requires treating them separately.  
  2. **Test Problem 1 (Representational):**  
     - *Experiment:* Build a planner for a complex, dynamic domain (e.g., emergency response) *without* hand-coded frame axioms. If it scales and handles novel actions robustly, Camp One wins *for that problem*.  
     - *Status:* This has largely been achieved (e.g., in modern PDDL planners).  
  3. **Test Problem 2 (Relevance):**  
     - *Experiment:* Place an AI in an open-world simulation (e.g., a virtual home) with *no* predefined goal. If it spontaneously notices and acts on critical novelties (e.g., "water is leaking near electrical wiring"), Camp Two's concerns are validated.  
     - *Status:* No AI comes close. Humans outperform machines catastrophically here.  

  ### Your Diagnosis Validated:
  - **Camp One** is right that:  
    *"Formal nonmonotonic reasoning solves the combinatorial explosion of frame axioms in bounded models."*  
  - **Camp Two** is right that:  
    *"No amount of syntactic tricks tell an agent *why* gasoline or fire matters if not pre-specified. Relevance is grounded in goals, survival, and embodiment—not logic."*  
  - **Where both err:**  
    Camp One dismisses Problem 2 as "not the frame problem." Camp Two dismisses Problem 1 as "trivial." Neither is trivial; they’re orthogonal.  

  ### Path Forward:
  - **For your reading group:** Stop debating "the frame problem." Instead, ask:  
    - *"When we say ‘solved,’ which problem are we talking about?"*  
    - *"Does this paper address representation efficiency or relevance detection?"*  
  - **True progress on Relevance (Problem 2) requires:**  
    - Architectures integrating perception, priors, and value systems (e.g., predictive processing models).  
    - Systems that *generate their own predicates* when anomalies occur (e.g., "unexpected heat near fuel → risk").  
    - Not a theorem, but a **working system that redefines its own "frame" mid-task**.  

  ### Bottom Line:
  The impasse is **not your fault**—it’s endemic in the literature. **Progress starts by decoupling the two problems.** The Representational Frame Problem is engineering; the Relevance Problem is the hard problem of cognition. If your roboticist friend scoffs at "relevance," ask them how their robot would notice it’s on fire if no one told it to monitor thermal sensors for unscheduled combustion. That’s the real beast.
