  ### Model Answer  
  **Approx. 650 words**  

  **(a)**  
  M is strictly dominated by a mixed strategy of T and B. For example, play T with probability \(p = \frac{2}{5}\) and B with \(1-p = \frac{3}{5}\):  
  - Against L: \(\frac{2}{5}(4) + \frac{3}{5}(1) = \frac{11}{5} = 2.2 > 2\)  
  - Against C: \(\frac{2}{5}(2) + \frac{3}{5}(3) = \frac{13}{5} = 2.6 > 2\)  
  - Against R: \(\frac{2}{5}(1) + \frac{3}{5}(6) = \frac{20}{5} = 4 > 3\)  
  M is not strictly dominated by any pure strategy:  
  - T vs. M: Against R, T yields 1 < 3 (M’s payoff).  
  - B vs. M: Against L, B yields 1 < 2 (M’s payoff).  
  M is not weakly dominated by any pure strategy:  
  - T vs. M: Against R, T is worse (1 < 3), violating "at least as good in all contingencies."  
  - B vs. M: Against L, B is worse (1 < 2), same violation.  
  This shows dominance must account for mixed strategies, as pure comparisons are insufficient. Dominance does not depend on beliefs because the condition (e.g., \(2.2 > 2\) for all columns) holds regardless of the opponent’s action; it is a payoff dominance for every possible play, not a best-response to beliefs.  

  **(b)**  
  **IESDS steps:**  
  1. **Eliminate M (both players):** Strictly dominated by mixed strategy (e.g., \(\frac{2}{5}\)T, \(\frac{3}{5}\)B) as in (a). Reduced game:  
     - Row: T, B; Column: L, C, R  
     |     | L   | C   | R   |  
     |-----|-----|-----|-----|  
     | T   | 4   | 2   | 1   |  
     | B   | 1   | 3   | 6   |  
  2. **Eliminate C (column player):** Strictly dominated by a mixed strategy of L and R (e.g., \(\frac{2}{5}\)L, \(\frac{3}{5}\)R):  
     - Against T: \(\frac{2}{5}(4) + \frac{3}{5}(1) = \frac{11}{5} = 2.2 > 2\) (C’s payoff)  
     - Against B: \(\frac{2}{5}(1) + \frac{3}{5}(6) = \frac{20}{5} = 4 > 3\) (C’s payoff).  
     Reduced game:  
     |     | L   | R   |  
     |-----|-----|-----|  
     | T   | 4   | 1   |  
     | B   | 1   | 6   |  
  3. **No further eliminations:**  
     - T not dominated (better against L), B not dominated (better against R).  
     - Similarly, L not dominated (better against T), R not dominated (better against B).  
  **Surviving strategies:** Row: {T, B}; Column: {L, R}.  
  **Order independence:** Strictly dominated strategies remain dominated in any subgame containing a dominating strategy and all opponent strategies. Thus, M is always eliminated first (dominated in full game), and C is eliminated next (dominated in the subgame without M). The order cannot change this.  

  **(c)**  
  **Example 2x2 game:**  
  |     | L     | R     |  
  |-----|-------|-------|  
  | T   | (1,1) | (1,0) |  
  | B   | (1,1) | (0,0) |  
  - **Nash equilibria:** (T,L) and (B,L). Both are NE: In (B,L), row gets 1 (indifferent to T), column gets 1 (no incentive to deviate).  
  - **IEWDS:**  
    - B is weakly dominated by T for row (T yields ≥ payoff in all columns, strictly better against R: 1 > 0). Eliminate B.  
    - Reduced game: Only (T,L) and (T,R). R is strictly dominated by L for column (1 > 0 against T). Eliminate R.  
  - **Result:** (B,L) is deleted.  
  **Epistemic gap:** Common knowledge of rationality (CKR) justifies IESDS because a strictly dominated strategy is never a best response. For IEWDS, a weakly dominated strategy (e.g., B) *can* be a best response if the opponent plays a strategy making it indifferent (e.g., column plays L, so row is indifferent between T and B). CKR alone does not force elimination; we need an extra assumption that players believe all opponent strategies are possible (e.g., "caution" or "tie-breaking beliefs"), ensuring the strictly better contingency is considered.  

  **(d)**  
  **Nash equilibria:**  
  - **Pure NE:** (T,L) and (B,R).  
  - **Mixed NE:** Row plays \(\sigma_r = \left( \frac{5}{8}T, 0M, \frac{3}{8}B \right)\), column plays \(\sigma_c = \left( \frac{5}{8}L, 0C, \frac{3}{8}R \right)\).  
    - *Verification:* Row’s payoff from T: \(\frac{5}{8}(4) + \frac{3}{8}(1) = \frac{23}{8}\); from B: \(\frac{5}{8}(1) + \frac{3}{8}(6) = \frac{23}{8}\). Column’s payoff symmetric. Deviations to M or C yield less (e.g., M: \(\frac{5}{8}(2) + \frac{3}{8}(3) = \frac{19}{8} < \frac{23}{8}\)).  
  **IESDS vs. IEWDS:**  
  - IESDS never deletes a strategy played in a NE because a strictly dominated strategy is never a best response (so cannot be played in equilibrium).  
  - IEWDS can delete a NE (e.g., (B,L) in part (c)) because weakly dominated strategies *can* be best responses if the opponent’s strategy induces indifference.  

