  ### Game Theory Final Exam Question

  **Game Matrix (Symmetric Payoffs):**  
  Both players have the same payoffs. The matrix below shows the payoff for the row player (column player's payoffs are identical).  

  |       | L     | C     | R     |
  |-------|-------|-------|-------|
  | **T** | 4     | 2     | 1     |
  | **M** | 2     | 2     | 3     |
  | **B** | 1     | 3     | 6     |

  **Question (20 marks total):**  
  (a) Show that for the row player, strategy M is strictly dominated by a mixed strategy of T and B, but not by any pure strategy (T or B). Further, show that M is not even *weakly* dominated by any pure strategy. Explain why this demonstrates that dominance cannot be checked by comparing pure strategies alone, and why dominance does not depend on beliefs about the column player’s actions.  
  **(5 marks)**  

  (b) Perform iterated elimination of strictly dominated strategies (IESDS) on this game. State the set of strategies that survive for each player at the end. Explain why the surviving set cannot depend on the order of elimination, using the properties of strict dominance (not just a slogan).  
  **(5 marks)**  

  (c) Construct a 2x2 game (specify payoffs) where iterated elimination of weakly dominated strategies (IEWDS) deletes a Nash equilibrium. Briefly explain why common knowledge of rationality justifies IESDS but not IEWDS, and what additional assumption about beliefs IEWDS requires.  
  **(6 marks)**  

  (d) Find all Nash equilibria (pure and mixed) of the original 3x3 game. Use exact fractions (no decimals) for mixed strategies. Explain why IESDS can never delete a strategy played in a Nash equilibrium, but IEWDS can.  
  **(4 marks)**  

