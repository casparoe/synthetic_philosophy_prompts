      Against column's mixed strategy (L:5/8, R:3/8, C:0) [but note: in the reduced game we don't have C, but in the original game, the column player might play C? However, in the NE we are considering, the column player plays only L and R. So we don't consider C? But row might wonder: what if I play M and the column player still plays the same mixed strategy? Then:
        M against L: 2
        M against R: 3
        So expected payoff: 2*(5/8) + 3*(3/8) = 10/8 + 9/8 = 19/8 < 23/8.
      So row would not deviate to M.

  For column player: 
    Similarly, column's expected payoff is 23/8 (by symmetry).
    If column deviates to C? 
        Against row's mixed strategy (T:5/8, B:3/8, M:0):
          C against T: 2
          C against B: 3
          So expected: 2*(5/8) + 3*(3/8) = 10/8+9/8=19/8 < 23/8.
      So column would not deviate.

  Therefore, the mixed strategy we found is a NE of the original game.

  So the Nash equilibria are:
    Pure: (T,L) and (B,R)
    Mixed: ( (T:5/8, B:3/8), (L:5/8, R:3/8) )   [with M and C played with zero probability]

  But note: are there any other mixed strategy NEs? For example, ones that include M or C? We have argued that M is strictly dominated so it won't be played. Similarly, C is strictly dominated for the column player? In the full game, we have to check if C is strictly dominated. 

  For column player, is there a mixed strategy that strictly dominates C? 
    Compare against row playing T, M, B.
    We need a mixed strategy over L and R that yields strictly more than C in every row.

    Against T: C gives 2. We need a mixed (q for L, 1-q for R) that gives: 4q + 1*(1-q)=3q+1 >2 -> q>1/3.
    Against M: C gives 2. The mixed: 2q + 3*(1-q)=3-q>2 -> q<1.
    Against B: C gives 3. The mixed: 1*q + 6*(1-q)=6-5q>3 -> q<3/5.

    So for q in (1/3, 3/5), the mixed strategy strictly dominates C. Therefore, C will not be played in any NE. Similarly, M is strictly dominated (as shown in a) so not played.

  Therefore, we have three NE: (T,L), (B,R), and the mixed one.

  Now, why IESDS never deletes an equilibrium while IEWDS can?
    In IESDS, we know that a strictly dominated strategy is never a best response (because there's a strategy that gives strictly more in every contingency, hence regardless of the opponent's strategy). Therefore, in any Nash equilibrium, a strictly dominated strategy cannot be played (because then the player could profitably deviate to the dominating strategy). Hence, IESDS never deletes any strategy that is played in a NE.

    In IEWDS, a weakly dominated strategy might be played in a NE because the opponent's strategy might make the player indifferent between the weakly dominated strategy and the dominating one. In that case, the player has no incentive to deviate. Therefore, IEWDS might delete a strategy that is part of a NE. For example, in part (c), the strategy B for row is played in the NE (B,L) but is weakly dominated and hence deleted by IEWDS.

  Now, we write the question, model answer, and marking scheme.

  The Question:

  Consider the following symmetric two-player game (the first payoff in each cell is for the row player and the second for the column player, but the game is symmetric so both are the same and you can use the single number per cell for analysis):

          L      C      R
  T       4      2      1
  M       2      2      3
  B       1      3      6

  (a) Show that for the row player, strategy M is strictly dominated by a mixed strategy of T and B, but is not strictly dominated by any pure strategy, and not even weakly dominated by any pure strategy. Explain why this shows that dominance cannot be checked by only comparing pure strategies and why dominance does not depend on beliefs about the opponent's strategy. [5 marks]

  (b) Perform iterated elimination of strictly dominated strategies (IESDS) for this game. Report the set of strategies that survive for each player. Explain why the surviving set cannot depend on the order of elimination. [5 marks]

  (c) Construct a 2x2 game (with payoffs specified) in which iterated elimination of weakly dominated strategies (IEWDS) deletes a Nash equilibrium. Explain why common knowledge of rationality is sufficient to justify IESDS but not IEWDS, and what additional assumption about beliefs is needed for IEWDS. [6 marks]

  (d) Find all Nash equilibria of the original 3x3 game (including any mixed strategy equilibria). Explain why IESDS can never delete a strategy that is played in a Nash equilibrium, while IEWDS can. [4 marks]

  Model Answer:

  (a) Consider the row player. M is strictly dominated by a mixed strategy that plays T with probability p and B with probability 1-p. For instance, p=0.4: 
    Against L: 0.4*4 + 0.6*1 = 2.2 > 2
    Against C: 0.4*2 + 0.6*3 = 2.6 > 2
    Against R: 0.4*1 + 0.6*6 = 4 > 3
  So M is strictly dominated. 
  However, no pure strategy dominates M: 
    T vs M: against R, T gets 1 < 3 (M's payoff), so T does not dominate M. 
    B vs M: against L, B gets 1 < 2, so B does not dominate M.
  Moreover, M is not even weakly dominated by a pure strategy: 
    For weak domination, we require at least as good in every column and strictly better in at least one. 
    T: against R, T is worse (1<3), so fails. 
    B: against L, B is worse (1<2), so fails.
  This shows that dominance must consider mixed strategies because pure strategies alone may not reveal dominance. Dominance does not depend on beliefs because the dominating strategy must yield a strictly higher payoff for every possible play of the opponent, so regardless of what the opponent does.

  (b) IESDS:
    Step 1: M is strictly dominated (by a mixed strategy of T and B) for both players, so we eliminate M. The reduced game:

          L    C    R
  T      4    2    1
  B      1    3    6

    Step 2: For the column player, C is strictly dominated by a mixed strategy of L and R. For example, play L with probability 0.4 and R with 0.6:
      Against T: 0.4*4 + 0.6*1 = 2.2 > 2
      Against B: 0.4*1 + 0.6*6 = 4 > 3
    So eliminate C for the column player. The reduced game:

          L    R
  T      4    1
  B      1    6

    Now, no further strategies are strictly dominated (for either player). For example, T is not dominated by B (or any mix) because against L, T is better; similarly, B is not dominated by T because against R, B is better. Likewise for columns.
    Surviving strategies: Row player: T, B; Column player: L, R.

    IESDS is order independent because if a strategy is strictly dominated in the full game, it remains strictly dominated in any subgame that includes a dominating strategy and all opponent strategies. Thus, it will always be eliminated in the first round it is considered. The same applies in subsequent rounds.

  (c) Example 2x2 game:

          L     R
  T     (1,1) (1,0)
  B     (1,1) (0,0)

    Nash equilibria: (T,L) and (B,L) [as explained above].
    IEWDS: 
      For row, B is weakly dominated by T (because T gives at least as much in every column: 1 in L, 1 in R, and strictly more in R: 1>0). So eliminate B.
      Then for column, R is strictly dominated by L (because in the row T, L gives 1>0). So eliminate R.
      The surviving profile is (T,L). Thus, the NE (B,L) is deleted.

    Common knowledge of rationality (CKR) justifies IESDS because a strictly dominated strategy is never a best response. However, for weak dominance, a weakly dominated strategy can be a best response if the opponent's strategy makes the player indifferent between it and the dominating strategy. Thus, CKR alone does not force elimination of weakly dominated strategies. The extra assumption is that players have beliefs that assign positive probability to all opponent strategies (or at least to those that break the tie), so that the player strictly prefers the dominating strategy.

  (d) Nash equilibria of the 3x3 game:
    Pure: (T,L) and (B,R)
    Mixed: Row plays T with probability 5/8 and B with 3/8; Column plays L with probability 5/8 and R with 3/8. [M and C are played with 0 probability.]

    IESDS never deletes a strategy played in a Nash equilibrium because if a strategy is strictly dominated, it cannot be a best response to any strategy profile of the opponents, hence cannot be played in a NE. In contrast, IEWDS can delete a weakly dominated strategy that is part of a NE because in that NE the player may be indifferent between the weakly dominated strategy and the dominating one, so it is a best response. Thus, IEWDS may delete such a strategy, thereby removing the NE.

