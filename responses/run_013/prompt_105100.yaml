prompt: |-
  I write the physical-sciences desk at a mid-sized general-interest magazine, and I keep having the same fight with my freelancers and my copy desk. Our house style has no rule for the hardest verb in our business: the verb to be, applied to things nobody has ever seen. One week a writer files that dark matter is a particle that has so far escaped detection; the next week a different writer files that the inflaton field would be the cause of the primordial fluctuations; a third treats the wave function as pure bookkeeping and gets an angry letter from a reader accusing us of philosophical cowardice; and a fourth, covering the Casimir effect, tells readers that virtual particles popping in and out of the vacuum push two plates together, which my most physics-literate contributor insists is close to a category error. I have come to think this is not a style question but an epistemological one, and that the sharpest available frame for it is the standoff between the no-miracles argument for scientific realism and the pessimistic meta-induction, together with the structural-realist compromise that tries to keep the mathematics while letting go of the furniture. What I want from you is not an essay on that debate but something my desk can actually run at deadline.

  Please write me a reusable decision procedure — a set of questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in a flat no, and where it must hand the sentence to a human because the remaining question is one of editorial values rather than of evidence. It needs to be executable in about ten minutes by a writer who has no philosophy training, it has to end in one of four house verdicts that I can put in the margin of a draft — assert, attribute, hedge, or flag as model — and it should be honest about which of its steps are real discriminations and which are judgment calls wearing a lab coat. I do not want a reading list or citations; assume the writer knows the words but not the arguments. Then run the procedure, showing the marginal verdict at each step, on three cases: the dark-matter particle; the inflaton field, where the entity is defined almost entirely by its role in a theory we cannot yet test directly; and the virtual particles invoked to explain the Casimir effect, where I suspect the honest verdict is one my readers and several of my writers will hate. Include at least one case where the procedure returns an answer I personally dislike — I have my own prejudices about which popular entities are respectable — and say plainly what the procedure cannot do: where it will misfire, which kinds of entity it has no grip on, and why it should not be allowed to turn every sentence in the magazine into a hedge.
reasoning: |-
  Okay, this is a fascinating and deeply practical challenge. The user is a science editor drowning in ontological disputes disguised as verb choices, and they need a decision tree that's both philosophically rigorous and deadline-proof. 

  First, let's unpack their core pain points: The "is" verb becomes a minefield when describing unobservables like dark matter or virtual particles. Writers keep defaulting to ontological claims ("dark matter is a particle") that may overstate epistemic access, while physics-savvy readers revolt. The user brilliantly frames this as the realism/anti-realism debate in miniature, but wisely rejects a philosophy lecture—they want actionable protocol.

  Key constraints emerge: The tool must be executable in 10 mins by non-philosophers, output one of four verdicts (assert/attribute/hedge/flag as model), and self-identify where it's making judgment calls vs evidence-based cuts. It must also handle their three test cases (dark matter particle, inflaton field, virtual particles) and force an unpopular verdict on at least one to prove impartiality.

  Hmm... The real tension here is between scientific communication efficiency (avoiding tedious hedging) and epistemological honesty. We can't say "electrons are real" with the same confidence as "tables are real," but constantly writing "according to the standard model..." would paralyze narratives. Need a triage system that only intervenes when ontological claims are truly shaky.

  For the decision tree, I'll anchor it to three escalating filters:
  1) **Detection threshold:** Have we measured it directly or just inferred? (Realism's "no miracles" argument)
  2) **Consensus robustness:** Is this entity core to multiple successful theories? (Structural realism buffer against pessimistic meta-induction)
  3) **Interpretation dependence:** Does its "reality" change across valid frameworks? (Quantum measurement problem vibes)

  The verdicts map to epistemic tiers:
  - **Assert:** Reserved for entities with direct detection + consensus (e.g., electrons)
  - **Attribute:** For well-established but inferred entities (dark matter particle)
  - **Hedge:** When interpretation matters (wave function)
  - **Flag as model:** For purely instrumental concepts (virtual particles in Casimir effect)

  For the test cases:
  - Dark matter particle clears Filter 1 (indirect evidence) but stumbles at Filter 2 (no direct detection) → **Attribute**
  - Inflaton field fails Filter 1 (no evidence) and Filter 2 (single-theory entity) → **Hedge**
  - Virtual particles hit Filter 3 (interpretation-dependent) hard → **Flag as model** (knowing this will frustrate writers)

  Crucially, the procedure must confess its limitations: It can't handle emergent phenomena (consciousness?), borderline cases (photon reality?), or stop writers from over-hedging. And yes—I'll make sure virtual particles get the "model" verdict the user anticipates will be unpopular, precisely to demonstrate impartiality.

  The tree needs kill switches where it hands off to human judgment, like when an entity has cultural weight (neutrinos) but shaky evidence. And we'll add a "can we avoid the verb entirely?" escape hatch to prevent linguistic paralysis. 

  Final touch: Emphasize that this isn't about doubting science, but about precision in communicating scientific certainty. The goal is to let writers say "is" when justified, not turn every sentence into "might be."
answer: |-
  Here's a reusable decision procedure ("Epistemic Verb Triage") for your desk, designed for speed and clarity. **Bolded terms** are key concepts for the writer.

  ---

  ### **Epistemic Verb Triage: Decision Procedure**

  **Goal:** Choose the verb for "Entity X *is* Y" statements about unobservables.  
  **Output Verdicts:**  
  1.  **ASSERT** (Use "is" confidently: Strong consensus + direct/indirect evidence).  
  2.  **ATTRIBUTE** (Use "is thought to be," "according to theory": Consensus exists, but evidence is indirect/theory-dependent).  
  3.  **HEDGE** (Use "might be," "could be," "one proposal is": Competing interpretations or very limited evidence).  
  4.  **FLAG AS MODEL** (Use "in the standard model," "mathematically described as": Entity is primarily a calculational tool within a specific framework).  

  **Procedure (Ask in Order):**  

  1.  **Is there *direct, uncontroversial, non-inferential* empirical detection?**  
      *   **YES → ASSERT** (e.g., "The Higgs boson *is*..."). Terminate.  
      *   **NO →** Proceed to Q2.  
      *   *Judgment Call:* What counts as "direct"? (e.g., Seeing a track in a detector vs. inferring from gravitational lensing). Assume standard detection claims within the field.  

  2.  **Is the entity *indispensable* to explaining a wide range of *robust, independent phenomena* in a *well-established theory*?**  
      *   **YES →** Proceed to Q3.  
      *   **NO → HEDGE** (e.g., novel, untested theories, entities explaining only one thing). Terminate.  
      *   *Judgment Call:* "Well-established" = Multiple successful predictions, broad consensus (e.g., Standard Model vs. String Theory). "Robust phenomena" = Reproducible, observed effects (e.g., galactic rotation curves vs. untested predictions of quantum gravity).  

  3.  **Is the entity's *mathematical structure and causal role* stable across *multiple successful theories/models* (even if its 'nature' changes)?**  
      *   **YES → ATTRIBUTE** (e.g., "Dark matter *is thought to be*..."). Terminate. (Structural Realism wins).  
      *   **NO →** Proceed to Q4.  
      *   *Judgment Call:* "Stable role" = Does it play the same core job? (e.g., "electron" role stable from Lorentz to QED; "ether" role vanished).  

  4.  **Is the entity invoked *primarily as a calculational device* within a *specific mathematical formalism*, where *alternative interpretations exist* that make equivalent predictions?**  
      *   **YES → FLAG AS MODEL** (e.g., "According to quantum field theory, *virtual particles*..."). Terminate.  
      *   **NO →** Proceed to Q5.  
      *   *Judgment Call:* Is it "primarily calculational"? (e.g., Virtual particles vs. the Higgs field).  

  5.  **Is this a fundamental claim about the *interpretation* of a *core theory* where *expert consensus is genuinely split*?**  
      *   **YES → HEDGE** (e.g., "The wave function *might represent*..."). Terminate.  
      *   **NO → ATTRIBUTE** (Default if previous filters passed but uncertainty remains). Terminate.  
      *   *Judgment Call:* "Genuinely split"? (e.g., Copenhagen vs. Many-Worlds vs. Bohmian Mechanics = Split; Geocentrism vs. Heliocentrism ≠ Split).  

  **Handoff to Human (Editorial Values):**  
  *   If Q2, Q3, or Q4 involves a close call with significant reader interest/historical weight (e.g., "Is the photon *really* a particle or wave?").  
  *   If the *rhetorical impact* of ATTRIBUTE/HEDGE/FLAG MODEL significantly misrepresents the *scientific community's practical certainty* for communication purposes.  
  *   **Crucial:** Can the sentence be *rephrased to avoid "is" entirely*? (Often the best solution!).  

  **Procedure Cannot Do / Limitations:**  
  *   **Misfires:** On entities *just* gaining strong evidence, historical entities once "real" now discarded (pessimistic meta-induction risk), or highly emergent/phenomenological concepts (e.g., "consciousness is..." - outside scope).  
  *   **No Grip:** On purely philosophical entities, social constructs, or entities defined by *negative* properties (e.g., "dark energy is the cause of acceleration" - handled by Q2/Q3, but nature is opaque).  
  *   **Prevents Over-Hedging:** By having **ASSERT** and **ATTRIBUTE** as common outputs when evidence/consensus is strong. **FLAG AS MODEL** is specific. **HEDGE** is reserved for true contention or novelty. Q5 acts as a final guard against over-hedging fundamental interpretations.  
  *   **Not for Everything:** It *shouldn't* be run on observable objects ("electrons are particles", use **ASSERT**), well-established processes ("photosynthesis *is*...", use **ASSERT**), or historical facts ("Newton *was*..."). Reserve it for contested or inferred *unobservable entities/properties*.  

  ---

  **Test Cases:**

  1.  **"Dark matter is a particle that has so far escaped detection."**  
      *   Q1: Direct detection? **NO** (Escaped detection). → Proceed.  
      *   Q2: Indispensable to robust phenomena in established theory? **YES** (Galaxy rotation, CMB, lensing; LCDM well-established). → Proceed.  
      *   Q3: Stable role across theories? **YES** (Cold Dark Matter paradigm stable for decades; WIMPs, Axions, etc., are *specific candidates*, but the *need* for a particle/field with specific gravitational properties is stable). → **ATTRIBUTE** ("Dark matter *is thought to be* a particle..." or "According to the prevailing theory, dark matter *is*...").  
      *   *(You dislike this? Good. It shows the procedure overriding gut feelings based on robustness. WIMP searches failing might push it towards HEDGE in Q2 eventually, but not yet).*

  2.  **"The inflaton field is the cause of the primordial fluctuations."**  
      *   Q1: Direct detection? **NO**. → Proceed.  
      *   Q2: Indispensable to robust phenomena? **YES** (Explains flatness, horizon problem, *and* fluctuation spectrum - core to inflation). But... Theory testable? **Limited/Indirect** (CMB fluctuations support *generic* inflation predictions, but not the *specific inflaton* uniquely). **Judgment Call:** Proceed cautiously to Q3.  
      *   Q3: Stable role across theories? **NO**. The *need* for an inflationary field is stable, but the *inflaton itself* is highly model-dependent. Many specific models exist (chaotic, hybrid, etc.), and alternatives (e.g., bouncing cosmologies) propose different mechanisms. → Proceed to Q4.  
      *   Q4: Primarily calculational device? **NO**. It's proposed as a real field driving inflation. → Proceed to Q5.  
      *   Q5: Fundamental interpretation split? **NO** (Consensus is inflation happened, debate is *how*). → **ATTRIBUTE** (by default). **BUT Handoff?** Strong case for **HEDGE** ("The inflaton field *is proposed to be*...") due to lack of direct evidence/model-dependence (Q2/Q3). *Editorial Value:* Does emphasizing the theoretical nature misrepresent cosmologists' working assumption? **HEDGE** likely safer. **Final Verdict: HEDGE** (or rephrase: "Cosmic inflation, driven by a field called the inflaton, is thought to cause...").

  3.  **"Virtual particles popping in and out of the vacuum push two plates together." (Casimir Effect)**  
      *   Q1: Direct detection? **NO** (Cannot be directly observed/detected). → Proceed.  
      *   Q2: Indispensable to robust phenomena? **YES** (QED calculations work incredibly well). → Proceed.  
      *   Q3: Stable role across theories? **NO**. Virtual particles are *specific* to perturbative approaches in quantum field theory (QFT). The Casimir effect can be calculated *without* mentioning virtual particles by considering *vacuum field fluctuations* or boundary conditions on the *quantum vacuum state*. The *effect* is real, the *picture* of particles popping in/out is one calculational tool. → Proceed to Q4.  
      *   Q4: Primarily calculational device? **YES**. Virtual particles are terms in a perturbation series (Feynman diagrams), not observable particles. Alternative interpretations (vacuum energy density) exist and are equivalent. → **FLAG AS MODEL** ("*In quantum field theory*, virtual particles..."; "*Calculations describe* virtual particles popping... which *suggest* they push the plates"; "*The standard model explains* the Casimir effect via virtual particles...").  
      *   *(This is the hated verdict. It highlights the procedure distinguishing mathematical machinery from ontological commitment. The physics-literate contributor is vindicated).*

  **Run at Deadline:**  
  *   Copy this procedure onto a laminated card or shared doc.  
  *   Writers run it *when describing the nature/reality of an unobservable entity or property*.  
  *   Verdicts go in the margin: **A-ASRT / A-ATTR / A-HDG / A-MODEL**.  
  *   Close calls or Q5 issues get flagged for quick editorial discussion ("Onto Check Needed").  

  This procedure forces explicit consideration of evidence level and theoretical status, provides defensible outputs, minimizes philosophical paralysis, and prevents the magazine from accidentally treating all speculative entities equally or over-committing where the science itself is cautious. It embraces structural realism (ATTRIBUTE for robust roles) and instrumentalism (FLAG AS MODEL for calculational tools) where appropriate.
