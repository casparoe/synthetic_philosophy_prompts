prompt: |-
  Okay so I run a monthly journal club for a mix of epidemiologists and biostatisticians — the kind of people who basically live in potential-outcomes world and draw DAGs on napkins — and next month the session is on me: the difference between counterfactual theories of causation and interventionist theories. And heres the wrinkle that I want you to build around: I dont want you to explain the distinction to me, I want a plan for how I explain it to them, because these people already have a theory of causation whether they know it or not (the potential-outcomes one) and thats going to quietly distort how they hear every sentence I say.

  So plan the session. What has to land first, and in what order, so that the interventionist idea reads as a genuinely different move rather than a restatement of what they already believe? Whats the dependency structure — what does the notion of an intervention depend on, what does the counterfactual notion depend on, and which one do I have to put down first so the contrast even shows up?

  Then the carrying example. Which single case should carry the whole thing, and what does it have to have — a place where plain counterfactual dependence fails or comes apart from manipulation, a manipulation that clearly isnt a real experiment, something where the two theories give different verdicts about token causation? I was going to reach for the firing-squad / overdetermination case and maybe the old flagpole-and-shadow chestnut; tell me if those are the right carriers or if theyre traps, and why. And if not them, what.

  Then the misconceptions. My guess is theyll collapse 'intervention' into 'experiment,' theyll assume the counterfactual theory just is the potential-outcomes framework they already use, and theyll think an intervention has to be something a person actually does. Which of those will actually show up, in what order, and at exactly what point in the sequence do I need to head each one off — before the carrying example or after it?

  Last two things: one question I can throw at them near the end that would actually reveal whether theyve got the distinction rather than just nodding along, and what I should openly tell them Im skipping at this level (modularity? the type-versus-token mess? whatever the overlap is between the structural-equations crowd and the interventionists?).
reasoning: |-
  We are planning a journal club session for an audience of epidemiologists and biostatisticians who are deeply familiar with the potential-outcomes framework (counterfactual theory). The goal is to present interventionist theories of causation as distinct from counterfactual theories, without letting their existing knowledge of potential outcomes distort the new concept.

  Key challenges:
  1. They likely equate counterfactual theory with the potential-outcomes framework.
  2. They might collapse "intervention" into "experiment" (i.e., something that is or could be actually done by a human).
  3. They might not see interventionism as a genuinely different theory.

  Plan Structure:

  1. **Start with their familiar ground (counterfactuals) but quickly problematize it:**
     - Begin by acknowledging that they are experts in the potential-outcomes framework (PO) and that it is a powerful tool for causal inference in many settings.
     - However, note that there are philosophical and practical questions about causation that PO does not fully address, and that there are alternative theories that are worth considering.

  2. **Set the stage for the distinction:**
     - Explain that we are going to talk about two types of theories:
          a. **Counterfactual theories**: These define causation in terms of what would happen if things were different (e.g., if the exposure had been set to a different level). This is the world of potential outcomes.
          b. **Interventionist theories**: These define causation in terms of what would happen under an intervention (a specific kind of manipulation) that changes the exposure, but without requiring that the intervention is actually feasible or ever performed.

     - Emphasize that the key difference is not in the mathematics (both use counterfactuals) but in the conceptualization of the counterfactual scenario. In interventionism, the counterfactual scenario is defined by an ideal intervention that breaks the causal dependencies of the variable in question with its usual causes.

  3. **Introduce the concept of an intervention:**
     - Define an intervention as an operation that sets a variable to a particular value, independently of other factors (i.e., breaking the arrows into that variable in a DAG). This is an idealized manipulation that might not be physically realizable.
     - Contrast with an experiment: an intervention that is actually carried out. Interventionism includes hypothetical interventions that are not experiments.

  4. **Carrying Example:**
     - We need an example where the two theories give different answers. The firing squad case (overdetermination) is a good candidate because it highlights issues of token causation (actual events) versus type causation (general patterns). However, note that in the potential-outcomes framework, overdetermination can be tricky because of the definition of counterfactual dependence.

     - **Firing Squad Example**:
          - Scenario: Two shooters (A and B) are ordered to shoot, and they both fire simultaneously, killing the victim. Either shot would have been fatal. Now, consider the token event: the victim dies.
          - Counterfactual theory (token causation): If shooter A had not fired, the victim would still have died (because B fired). Similarly for B. So, neither A nor B is a cause? But that seems wrong because both shots are actual causes.
          - Interventionist theory (using structural equations): We can model this with two binary variables (A and B) and the outcome D = A OR B. An intervention on A (set to 0) would leave D=1 (if B=1). Similarly for B. So, by the counterfactual dependence, neither is a cause? But note that interventionism might use a different criterion (like the effect of an intervention on the probability of the outcome) or might rely on a different notion of actual cause (e.g., in structural models, we might require that there exists a setting of other variables such that the intervention changes the outcome). In this case, if we set the other shooter to 0, then the intervention on A would matter. This leads to the idea of "contingent dependence".

     - However, note that the standard potential-outcomes approach (at least in epidemiology) is usually about average causal effects, not token causation. So we might want an example that is about type causation but where the two theories diverge.

     - **Flagpole and Shadow Example** (classical example of non-causation in the presence of association):
          - The height of a flagpole (F) causes the length of its shadow (S) (via the sun's angle, A). There is an association between F and S. But also, if we were to change S (say, by adjusting the shadow without changing the flagpole or the sun), then F would not change. In fact, the association is symmetric: we can compute F from S and A, and S from F and A. So if we intervene on S, F remains unchanged? But note that in the potential-outcomes framework, we don't usually consider interventions on the shadow. The DAG is A -> F, A -> S, and F -> S. The intervention on F changes S, but an intervention on S does not change F. This is an example where the interventionist perspective (via DAGs and interventions) gives a clear answer: F causes S, but S does not cause F. However, the counterfactual theory (if defined only in terms of potential outcomes) would also say the same: the potential outcome of F when we set S to a new value would not change F? Actually, we don't define potential outcomes for S on F because we don't have a model for that. So this might not be the best example to show a divergence.

     - **Alternative example: Preemption**
          - Consider a more complex case of preemption. Example: Two drugs (A and B) are both effective for the same condition. Drug A is always taken first and is sufficient to cure the patient. Drug B is taken only if A fails. In reality, A always works, so B is never taken. Now, we want to know: is A a cause of cure? Yes. But what about B? It is never taken, so it didn't cause the cure. But what if we consider a counterfactual: if A had not been taken, then B would have been taken and would have cured. So in the counterfactual sense, we might say that B is a cause in the sense that it is a potential alternative? But that's not how we usually think. The interventionist perspective would say: an intervention that sets A=1 (taken) causes cure, and an intervention that sets A=0 and B=1 also causes cure. But in the actual scenario, A=1 and B=0 (because A worked and so B wasn't taken). So we have two causes? But note that in the actual world, B=0. We don't want to say that B=0 caused the cure? This is messy.

     - **Better example: The Chemist and the Appointment (from Woodward)**
          - A chemist is late for an appointment because she stops to buy cleansing fluid which she then uses to wash her hands. Without washing, she would be late because of dirty hands. With washing, she is late because she stopped. So she is late in both cases. Now, consider the actual scenario: she stops and washes, and is late. The counterfactual: if she had not stopped, she would not have washed, but then she would have been late because of dirty hands. So the stopping did not change the outcome (late). But intuitively, stopping is a cause of her being late? In the interventionist framework, we can consider an intervention that prevents her from stopping. Then she would not wash and would be late because of dirty hands. So the intervention does not change the outcome? Then how is stopping a cause? This example shows that the counterfactual dependence (as defined by the potential outcome) is absent, but we still feel that stopping is a cause.

          - However, note that in the potential-outcomes framework, we might define the outcome under the treatment (stopping) and under no stopping. We see that Y(stopping)=late and Y(no stopping)=late. So the average causal effect is zero. But we are interested in the actual cause. This is a token causation problem.

          - The interventionist might use a more refined notion: the stopping caused the lateness in the actual scenario because it produced the lateness via a different mechanism. But note that the interventionist theory (as in Woodward) uses counterfactuals about interventions. So what's the difference? The difference is that the interventionist theory requires that the causal relation is invariant under interventions and that the intervention breaks the usual causes. In this case, the counterfactual we consider in the potential-outcomes framework is exactly the same as the interventionist counterfactual? So why the different verdict?

          - Actually, the problem is that the potential-outcomes framework is often used for average effects, and for token causation we need a different account. The interventionist theory can handle token causation by considering the actual mechanisms. In this case, the stopping caused the lateness because in the actual world, it was the stopping that led to the lateness (via the time taken) and without that particular event, the lateness would have been caused by the dirty hands. But note that the outcome is the same. So the stopping is a cause because it is part of the actual process that led to the outcome? But the potential-outcomes framework doesn't capture the actual process.

     - **Conclusion on the example**: We need an example where the two theories give different answers for type causation. Let's choose one from epidemiology.

     - **Example: The Effect of a Treatment that is Always Administered by a Particular Route**
          - Suppose we have a drug that is always administered intravenously (IV). We want to know if the drug causes recovery. We have data from observational studies. The potential-outcomes approach would compare the outcome under drug versus no drug. But what if we are interested in the effect of the drug when administered orally? We cannot observe that because it's never administered orally. The interventionist perspective would require that we consider an intervention that sets the drug to oral administration, which might not be possible without changing other factors (e.g., absorption). This is about the stability of the causal relation. The potential-outcomes framework might not distinguish between routes because it only considers the binary treatment (drug or not). But if we define the treatment as the route, then we have a new variable. The point is that the interventionist theory forces us to think about the specific intervention we are considering, and the causal effect might depend on how the intervention is carried out.

     - **Better: The Case of Multiple Routes to the Same Outcome (with a common cause)**
          - Consider air pollution (A) and smoking (S) as causes of lung cancer (C). Suppose we have a DAG: A -> C, S -> C, and also A and S are correlated due to socioeconomic status (U). Now, we want to know the effect of an intervention that reduces air pollution. In the potential-outcomes framework, we might define the average causal effect of A on C, controlling for S? But note that in the interventionist framework, an intervention on A breaks the arrow from U to A, so it sets A independently of U. Then the effect of A on C is not confounded? But what if we consider an intervention on S? Similarly. Now, the point of divergence: what if we consider an intervention that sets both A and S? Then we can get the joint effect. But the potential-outcomes framework can handle that too.

     - **So perhaps the real difference is in the conceptualization of the counterfactual scenario?** The interventionist insists that the counterfactual must be generated by an ideal intervention (which breaks the usual causes) and that the causal relation must be invariant under a range of interventions. This is a requirement for modularity.

     - **Modularity Example**: Consider a system of equations:
          X = U1
          Y = X + U2
          Z = Y + X
          Now, an intervention on X would break the equation for X and set it to a new value. Then Y would change and Z would change. But an intervention on Y would break the equation for Y and set it to a new value, then Z would change but X would not. This modularity allows us to predict the effect of interventions without changing other equations. The potential-outcomes framework does not require such modularity? It just defines potential outcomes for each variable we set. But note that the potential outcomes for Y when we set Y to a value are not defined in the potential-outcomes framework for X and Y? We usually define potential outcomes for the treatment variable only.

     - **Conclusion on carrying example**: Use an example that highlights the need for modularity and the fact that an intervention breaks the usual causal dependencies. The flagpole example is good for showing that the direction of causation matters, but it doesn't show a difference in verdict. Instead, use an example where the potential-outcomes framework would allow for an ill-defined counterfactual that the interventionist would reject.

     - **Example from Woodward**: The chemical factory that pollutes the river and the village that gets sick. The factory (F) releases a chemical that is converted into a pollutant by a process in the river (R). Then the pollutant causes sickness (S). So F->R->S. Now, we ask: what if we were to intervene on R? Suppose we dump the pollutant directly into the river (without the factory). Then S occurs. But note that in the actual world, R is caused by F. The interventionist account says that F causes S because there is a chain of dependencies that are invariant. But note that an intervention on R would also cause S. However, we cannot intervene on R in the same way that we can intervene on F? The point is that the potential-outcomes framework might not care about the intermediate process. It would define the effect of F on S by comparing F=1 and F=0. But if we want to know the effect of R on S, we might define it by setting R=1 and R=0. But in the real world, we cannot set R independently of F? The interventionist would say: we can consider an ideal intervention on R that breaks its dependence on F. Then the effect of R on S is defined. But note that the potential-outcomes framework can also define that by conditioning on F? So again, no difference.

     - **Perhaps the difference is not in the predictions but in the conceptual underpinnings?** Then we need to focus on the philosophical distinction.

  5. **Plan for the Session**:

     - **Step 1: Start with their framework** (5 minutes)
          - Review the potential-outcomes framework: definition of causal effect as E[Y(1)-Y(0)], the importance of exchangeability, consistency, etc.
          - Note that this framework has been incredibly successful in epidemiology and biostatistics.

     - **Step 2: Introduce the limitations** (5 minutes)
          - Point out that there are questions that the PO framework does not naturally answer, especially about token causation, mechanisms, and the stability of causal relationships under different interventions.
          - Mention that in PO, we typically assume that the intervention we are considering is well-defined (like in an RCT) but we don't always specify what that intervention is.

     - **Step 3: Present the interventionist theory** (10 minutes)
          - Define an intervention: an operation that sets a variable to a value, breaking its usual causes and not affecting other variables except through the outcome.
          - Contrast with an experiment: an intervention that we actually perform.
          - Emphasize that interventions can be hypothetical and need not be feasible.

     - **Step 4: Show a case where the two theories diverge** (15 minutes)
          - Use the Chemist example (or a similar token causation example) to show that there are cases where we want to say that X caused Y in a particular instance, but the counterfactual dependence (as defined by comparing Y under X and under not X) does not hold because Y would have happened anyway.
          - Explain that the interventionist theory might still count X as a cause if it is part of an actual mechanism that led to Y, even if the outcome would have occurred otherwise. But note that Woodward's interventionist theory is also defined in terms of counterfactuals about interventions. So how is it different?

          - Actually, Woodward's theory is a counterfactual theory, but it is a specific one that uses interventions in the counterfactuals. The real difference is that the interventionist theory requires that the causal relation is invariant under interventions and that it is modular. So the example should highlight modularity.

     - **Step 5: Introduce modularity** (10 minutes)
          - Explain that in a system of equations, an intervention on a variable leaves the other equations intact. This modularity allows us to predict the effects of interventions on any variable.
          - Contrast with the PO framework: in PO, we only define potential outcomes for the treatment variable. We don't have a system of equations for all variables.

     - **Step 6: Discuss misconceptions** (10 minutes)
          - **Misconception 1**: Intervention = Experiment. Clarify that interventions can be hypothetical and even physically impossible (like setting the moon to be made of cheese).
          - **Misconception 2**: The counterfactual theory is just PO. Clarify that there are many counterfactual theories (e.g., Lewis's), and PO is one specific framework that uses counterfactuals. Interventionism is also a counterfactual theory, but it uses a specific kind of counterfactual (interventions) and emphasizes modularity and invariance.
          - **Misconception 3**: Intervention requires human agency. Clarify that interventions are abstract operations, not necessarily performed by humans.

