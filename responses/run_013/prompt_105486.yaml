     2. Limitations of PO (especially for token causation and specifying interventions).
     3. Interventionist theory: definition of intervention, contrast with experiment.
     4. Example where PO and interventionism might seem to diverge (but note they might not in the end) - use the chemist example to provoke thought about token causation.
     5. Modularity and invariance: why the interventionist cares about the structure.
