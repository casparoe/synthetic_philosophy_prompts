          - Ask: "Consider a causal claim: 'Smoking causes lung cancer.' How would an interventionist understand this claim differently from a potential-outcomes theorist?" 
            - The PO theorist would say: if we were to assign smoking (vs. not) to individuals, we would see a difference in the probability of lung cancer.
            - The interventionist would say: there is a range of interventions that set smoking to different levels (including levels not observed in the population) that would change the probability of lung cancer, and this relation is invariant under changes in background conditions (or at least a range of them).

