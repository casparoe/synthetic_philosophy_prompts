     7. The one question at the end.

     But note: the example of the chemist might not show a clear divergence because both theories use counterfactuals. So maybe we should focus on the fact that interventionism is more about the structure and modularity, and less about the specific potential outcomes.

     Alternative plan: Instead of trying to show a case where the theories give different answers, focus on what interventionism adds: the ability to talk about interventions on any variable in a system, and the requirement of modularity.

  7. **Final Plan for the Session**:

     - **Introduction (5 minutes)**: 
          - The goal: to explore an alternative theory of causation that complements the PO framework.
          - Acknowledge that PO is the workhorse of their field.

     - **Part 1: Counterfactual Theories (10 minutes)**:
          - Define counterfactual theories broadly (Lewis, PO).
          - PO framework: potential outcomes, average treatment effects, assumptions.
          - Limitations: token causation, specifying the intervention (what does it mean to set X to x?), and stability across contexts.

     - **Part 2: Interventionist Theory (15 minutes)**:
          - Define an intervention (idealized, breaks incoming arrows, doesn't directly affect other variables).
          - Causal effect as the difference made by an intervention.
          - Example: Consider a simple DAG (X -> Y <- Z). What is the effect of an intervention on X? It sets X to a value, ignoring Z. Then Y changes accordingly.
          - Contrast with PO: in PO, we define potential outcomes for X, but we don't necessarily consider interventions on Z.

     - **Part 3: Modularity and the System (10 minutes)**:
          - Present a system of equations (or structural equations in a DAG).
          - An intervention on X replaces the equation for X with X = x0, leaving the other equations unchanged.
          - Show how this allows us to predict the effect of interventions on any variable.

     - **Part 4: Example - The Chemist (10 minutes)**:
          - Describe the scenario: Chemist stops to buy cleansing fluid, washes hands, and is late. Without stopping, she would have been late because of dirty hands.
          - PO view: The effect of stopping on lateness is zero because she is late in both cases. But intuitively, the stopping caused the lateness in this instance.
          - Interventionist view: We need to consider the mechanism. The stopping introduced a delay that caused the lateness in the actual chain. But note that the interventionist might also say that the stopping did not cause the lateness because an intervention that prevents stopping would not change the outcome? So this is a challenge.

          - Actually, Woodward would say that there might be two routes to lateness: the stopping route and the dirty hands route. The stopping route is active in this case. But the counterfactual of stopping versus not stopping does not show a difference because the other route would have worked. So how do we capture the actual cause? This is where we might need a concept of actual causation that is process-based.

          - Alternative: Use an example where the interventionist theory can say that X causes Y even though there is no counterfactual dependence because of overdetermination, but by using the concept of an intervention on X in a specific context. For instance, in the firing squad, if we fix the other shooter to not shoot, then an intervention on A would matter. This is the idea of "contingent counterfactual dependence".

