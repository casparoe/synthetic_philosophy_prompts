  Final advice: Don't get bogged down in examples that show a divergence in verdict unless you have a clear one. Instead, highlight the different emphases: interventionism is about mechanisms and structure, and it allows us to consider a wider range of causal questions (like interventions on intermediate variables).
answer: |-
  ### Session Plan: Interventionist vs. Counterfactual Theories of Causation  
  **Core Goal:** Make interventionism feel like a *distinct move*—not a repackaging of potential outcomes (PO). Sequence is critical to avoid PO assumptions hijacking the narrative.  

  ---

  ### **Step-by-Step Session Flow**  
  #### 1. **Start with What They Know (But Problematicize It)**  
  - **First 10 mins:** Begin with PO framework recap:  
    - "Causal effect = \(E[Y(1) - Y(0)]\), where \(Y(x)\) is the outcome if treatment \(X\) were set to \(x\)."  
    - **Crucial twist:** Highlight PO’s *implicit baggage*:  
      > "In PO, we imagine 'setting' \(X\)—but *how*? We often assume it’s done via a perfect RCT. What if 'setting \(X\)' involves breaking causal laws? What if \(X\) *can’t* be set independently of its causes? PO doesn’t specify—it’s silent on the *mechanism of intervention*."  
    - **Why land first?** PO’s vagueness about "setting" primes them to see interventionism’s precision as a *new tool*, not a restatement.  

  #### 2. **Introduce Interventionism as a "What If" of *Breaking Mechanisms***  
  - **Next 15 mins:** Define interventionism via Woodward:  
    - "An intervention on \(X\):  
      1. Sets \(X\) to a value *independently* of its usual causes (breaks incoming arrows in the DAG).  
      2. Affects \(Y\) *only* through \(X\) (no side channels).  
      3. **Key:** It’s a *hypothetical* manipulation—no lab coat needed. E.g., 'What if gravity ceased?' is a valid intervention."  
    - **Contrast immediately:**  
      - PO: "\(Y(x)\) = outcome if \(X=x\)."  
      - Interventionism: "\(Y_{do(x)}\) = outcome if \(X\) were *surgically set* to \(x\), *ignoring how it happens*."  
    - **Dependency structure:**  
      - Interventionism *depends* on a causal model (DAG/equations) to define "surgical breaks."  
      - Counterfactuals (Lewis-style) *depend* on similarity of worlds, not model structure.  
      - **Put interventionism first:** If you start with counterfactuals, PO users will map interventions to their "setting \(X\)" intuition. Start with "surgical break" to force cognitive friction.  

  #### 3. **The Carrying Example: Firing Squad + Flagpole**  
  - **20 mins:** Use **two examples** to show where theories diverge:  
    - **Example 1: Firing Squad (Token Causation)**  
      - *Setup:* Two shooters (A and B) fire simultaneously. Either shot alone kills Victim (V).  
      - **PO verdict:** "If A hadn’t shot, V would still be dead (due to B). So A didn’t cause death."  
      - **Interventionist verdict:**  
        - Intervene to prevent A’s shot (breaking its causes): B still fires → V dies.  
        - BUT: In the *actual* world, A’s shot is part of a sufficient mechanism. Interventionism flags A as a cause if we consider **contingency** (e.g., if B were absent, A’s shot would matter).  
      - **Why it works:** Shows PO’s focus on *dependence* vs. interventionism’s focus on *mechanism sufficiency*.  

    - **Example 2: Flagpole and Shadow (Type-Level Asymmetry)**  
      - *Setup:* Flagpole height (F) causes shadow length (S); sun angle (U) causes both.  
      - **PO verdict:** "If S were shorter, F would be shorter? Wait—how?" *PO lacks tools to answer.*  
      - **Interventionist verdict:**  
        - \(do(S=s)\): Set shadow length independently → F unchanged (no arrow from S to F).  
        - \(do(F=f)\): Set flagpole height → S changes.  
      - **Why it works:** PO treats causation as symmetric associations; interventionism uses DAG asymmetry to resolve.  

    - **Why these examples?**  
      - Firing squad: Exposes PO’s struggle with token causation (overdetermination).  
      - Flagpole: Shows interventionism handling non-manipulable variables (shadows) *without* experiments.  
      - **Avoid traps:** Don’t use examples where both theories agree (e.g., simple RCTs).  

  #### 4. **Preempt Misconceptions (Timing is Key)**  
  - **10 mins:** Address *during* the examples:  
    1. **"Intervention = Experiment"**:  
       - Head off **before examples**:  
         > "An intervention is *not* an experiment. It’s a mathematical operation—e.g., 'What if we teleported the moon?' is valid."  
       - **When?** During Step 2 (intervention definition).  
    2. **"Counterfactual Theory = PO"**:  
       - Head off **after firing squad**:  
         > "PO is *one* counterfactual theory. Lewis-style counterfactuals (e.g., 'closest world where A didn’t shoot') differ by ignoring mechanisms. Interventionism demands mechanism-breaking."  
    3. **"Interventions Require Human Agency"**:  
       - Head off **during flagpole**:  
         > "We can intervene on shadows—no human needs to move the sun. It’s about *model surgery*, not practicality."  

  #### 5. **The Revealing Question (At the End)**  
  - **5 mins:** Ask:  
    > "In the firing squad, PO says A’s shot isn’t a cause. Interventionism says it is. Why? And what does this imply for real-world cases like two toxins causing a disease?"  
    - **Why it reveals understanding:** Forces them to articulate PO’s dependence criterion vs. interventionism’s mechanism-based sufficiency. If they blur the two, they’ll miss the contingency argument.  

  #### 6. **Explicitly Skipped (For Now)**  
  - **5 mins:** State upfront:  
    > "Today, we skip:  
    > - **Modularity**: (How interventions leave other equations intact).  
    > - **Type vs. Token**: We’re oversimplifying the metaphysics.  
    > - **PO-Interventionism Overlap**: Yes, they converge in RCTs—but we’re here for the *divergence*."  
    - **Why?** Prevents rabbit holes. Modularity is interventionism’s engine, but it’s technical; token/type is philosophical quicksand.  

  ---

  ### **Why This Sequence Works**  
  - **PO-first-then-problematize** → Creates cognitive space for interventionism.  
  - **Examples mid-session** → After defining interventions but before misconceptions crystallize.  
  - **Misconceptions addressed contextually** → Each is headed off when it would naturally arise.  
  - **End with contrasting verdicts** → Forces synthesis: "They’re different tools for different jobs."  

  **Carry them from "This is just PO with DAGs" to "This changes how I reason about impossibility."**
