          - We are not delving into the type vs. token causation debate in full.
          - We are not covering the full relationship between structural equation models and interventionism (though note that Woodward's theory is closely tied to SEMs).

  6. **Order of Topics and Dependencies**:
     - We must start by acknowledging their framework (PO) to build from common ground.
     - Then we must introduce the concept of an intervention as an ideal manipulation, and this must come before we show the examples that rely on interventions that are not experiments.
     - The modularity concept depends on having a system of equations or a DAG, so we need to introduce that after the basic intervention concept.
