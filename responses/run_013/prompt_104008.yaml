answer: |-
  Your three-condition account faces significant pressure points. I'll map its exposure systematically, sorting defeaters by severity and indicating where defenders typically concede or resist.

  ### Fatal Defeaters (Potentially Existential Threats)

  1.  **The Voluntariness Baseline Problem (Your Core Concern):**
      *   **What Must Be True:** For offers vs. threats to be distinguished non-arbitrarily, a *normative baseline* of entitlements/expectations is needed. If the account *cannot generate this baseline internally* without circularity (e.g., defining the baseline *by* what valid consent permits), it *must* import an external moral/political theory (e.g., theories of distributive justice, basic rights, legitimate expectations).
      *   **Why Fatal?** This directly undermines the account's claim to be a *neutral*, freestanding framework for moral transformation through consent. It becomes parasitic on prior normative commitments. The "structural injustice" case you mention is a direct consequence: If someone consents to exploitative wages under conditions of systemic poverty, the baseline question ("Is this merely an offer or an implicit threat against a background of injustice?") cannot be answered *within* the three conditions alone.
      *   **Defender Response:** Most sophisticated defenders (e.g., Alan Wertheimer) concede this *requires importing a theory of exploitation or baseline entitlements*. They argue this doesn't "falsify" the account but clarifies its *necessary context*. They deny neutrality was ever possible or desirable for *moral* validity. Critics see this as a fatal concession of non-self-sufficiency.
      *   **Your Calibration Case:** This case strongly suggests incompleteness *if* neutrality is required. Defenders would argue it shows the voluntariness condition *must* be read "thickly," incorporating justice-sensitive baselines, rejecting neutrality. This moves the account firmly into non-neutral territory.

  2.  **Validity ≠ Moral Force (The Permissibility Gap):**
      *   **What Must Be True:** If valid consent can be given to morally impermissible acts (e.g., selling oneself into slavery, consenting to murder) *or* if invalid consent can be given to morally permissible acts (e.g., coerced consent to life-saving surgery where refusal is irrational), then validity is not *sufficient* and sometimes not *necessary* for permissibility.
      *   **Why Fatal?** This severs the core link the account assumes: that valid consent *is* the primary mechanism transforming moral prohibitions into permissions. If validity doesn't reliably track permissibility, the account's *moral explanatory power* is drastically weakened. It becomes merely descriptive of a psychological/agential state, not a moral transformer.
      *   **Defender Response:** Concede validity is *necessary but not sufficient* for permissibility in many domains. They argue the account explains the *distinctive wrong* of violating valid consent (a wrong against autonomy), even if overriding factors exist. For cases like slavery, they might argue competence is impossible or that such acts are inherently non-consentable. Critics find this ad hoc or question the coherence of "non-consentable" acts within the framework.

  ### Answerable But Serious Defeaters (Requiring Significant Work)

  3.  **Information Condition & Materiality:**
      *   **What Must Be True:** If no principled, non-arbitrary way exists to distinguish "material" from "immaterial" information (where only the former's absence voids consent), the condition collapses. Either *any* false belief voids consent (absurdly over-inclusive) or the line is drawn arbitrarily based on intuitions about what *should* matter.
      *   **Cases:** Patient consents to surgery knowing risks A, B, C, but not risk D (statistically very rare and unrelated to the core procedure). Is consent void? What if D is a known rare side effect the doctor forgot? What if D is a common alternative treatment the doctor deliberately withheld?
      *   **Defender Response:** Propose standards like the "reasonable person" standard (what would a reasonable person in that position consider important?) or the "specific patient" standard (what did *this* patient indicate was important?). Argue this is messy but workable in practice, akin to negligence standards in law. Concede it relies on external normative judgments about importance/reasonableness. Critics see this as importing external norms or being inherently unstable.

  4.  **Competence: Domain-Relativity & Threshold:**
      *   **What Must Be True:** If competence is inherently tied to the complexity and risks of the specific act (consenting to a cup of coffee vs. experimental brain surgery), then there is no single, context-independent threshold for competence. A "global" competence assessment is inadequate.
      *   **Cases:** A person with mild intellectual disability competent to consent to routine dental work but not to complex financial transactions or risky medical trials.
      *   **Defender Response:** Fully concede this point. Argue competence *must* be assessed relative to the specific decision at hand ("decisional capacity"). Defend functional tests (understanding, appreciation, reasoning, communication) applied to the specific context as the best solution, acknowledging it requires nuanced, often case-by-case judgment. This is widely accepted in bioethics and law.

  5.  **Overlap of Conditions (Voluntariness/Competence):**
      *   **What Must Be True:** If profound manipulation or certain forms of deception don't just misinform but fundamentally distort the *formation* of the agent's will or undermine their ability to reason effectively about their own interests, then the line between impaired voluntariness and impaired competence blurs.
      *   **Cases:** Long-term coercive control or cult indoctrination might create preferences that seem "voluntary" in a thin sense but reflect a compromised capacity for authentic choice or self-governance.
      *   **Defender Response:** Acknowledge significant overlap in extreme cases but defend the conceptual distinction: Competence concerns the *ability* to process information and reason; Voluntariness concerns *undue influence* on the *exercise* of that ability. Argue that recognizing the overlap helps diagnose complex cases without collapsing the framework. Relational theorists press this harder.

  ### Merely Awkward Defeaters (Manageable but Highlight Limitations)

  6.  **Edge Cases Seemingly Meeting Conditions but Lacking "Consent":**
      *   **Cases:** "Hypothetical Consent" (Patient is unconscious, would *surely* consent to life-saving surgery, but hasn't actually consented). "Blanket Consent" (Signing a blanket medical consent form without context). "Consent Under Duress of Circumstance" (Not direct coercion, but no real alternative – e.g., taking a dangerous job to feed family).
      *   **Defender Response:** Argue these cases either don't truly meet the conditions (e.g., blanket consent lacks adequate information; duress of circumstance *may* undermine voluntariness depending on the baseline) or represent limitations where the *act* of consent is absent or legally/morally insufficient despite meeting abstract conditions. Concede the framework doesn't capture all intuitions perfectly but handles core cases well.

  7.  **Rival Accounts (Relational, Performative, Will-Based):**
      *   **Arguments:** Relational accounts argue consent is embedded in relationships of trust and power, not just individual states. Performative accounts focus on the communicative act and uptake by the recipient. Will-based accounts emphasize the internal act of will, potentially distinct from communication.
      *   **Defender Response:** Argue the three-condition account *explains* the normative force recognized by rivals: A valid performative act requires the underlying competence, information, and voluntariness to be morally transformative. Relational concerns often map onto assessments of voluntariness (power dynamics) and competence (within the relationship). Concede rivals highlight important contextual factors but see them as complementary or focused on different aspects rather than falsifying the core conditions.

  **Insulation from Refutation via Placeholders?**  
  Yes, the account is significantly insulated because each condition *is* a placeholder requiring substantive interpretation:
  *   **Voluntariness:** Requires a baseline theory (coercion/threat definition).
  *   **Information:** Requires a theory of materiality/relevance.
  *   **Competence:** Requires context-specific functional criteria.

  **Is this a Fatal Defect or Just Framework-Level?**  
  This is **the central tension**:
  *   **Fatal Defect View:** The account promises a freestanding mechanism for moral transformation but fails. Its core conditions are empty vessels requiring filling by the very moral theories they are supposed to bypass. It's not truly explanatory; it just labels the inputs needed for permissibility judgments made on other grounds.
  *   **Framework View:** This is *exactly* what a framework-level account *should* look like for a complex normative concept. It identifies the *necessary structural components* (agency, knowledge, freedom) whose *specific content* must be supplied by context and deeper normative reasoning (law, ethics, policy). Its value is in structuring the inquiry, not providing mechanical answers.

  **Conclusion:**  
  The three-condition account is not "falsified" in a simplistic sense, but its exposure is severe. The **voluntariness baseline problem** and the **validity/permissibility gap** are its most significant vulnerabilities, forcing it to abandon claims of neutrality and acknowledge that validity alone doesn't guarantee permissibility. The materiality and competence issues are serious but manageable with external input. The placeholder nature is a feature for proponents (it's a flexible framework) and a bug for critics (it lacks independent substance).

  **Regarding your calibration case:** It decisively demonstrates that the account **cannot remain neutral and self-sufficient**. It forces a choice: Either abandon the aspiration to neutrality and incorporate a "thick," justice-sensitive conception of voluntariness (and baselines), or concede that the account is incomplete and needs supplementation by an independent theory of background justice to determine when consent is truly transformative. Most contemporary defenders opt for the first path, accepting that a robust theory of valid consent is inherently intertwined with broader moral and political philosophy. If you require strict neutrality, this is likely a fatal flaw. If you accept that consent operates within a normative context, it's a necessary refinement.
