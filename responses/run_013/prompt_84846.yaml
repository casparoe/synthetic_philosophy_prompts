prompt: |-
  I run the employee-conduct function at a mid-sized company of about two thousand people across three countries. Our code of conduct prohibits harassment, and specifically the communication of contempt for a person on the basis of a protected characteristic. The complaints that reach me almost never contain a prohibited word. They contain a question asked in a meeting, a joke in a team channel, a link posted with no comment, a remark about how a colleague pronounces her name, a message that reproduces someone else's ugly remark with a neutral "look at this," an emoji, or a phrase that is unremarkable to most of the company and pointed to one team. I receive roughly thirty such complaints a quarter. Each one must end in a written finding that goes to the complainant and the subject and, on appeal, to a panel that includes our general counsel, who has never accepted "it was only implied" as a defense of anything. I have two working days per complaint, no linguist on staff, and no access to anyone's private messages. Two HR investigators do the first pass; neither has read any philosophy, and one came to us from recruiting.

  I have read enough Grice to believe that his apparatus is precisely what we lack: the distinction between what a sentence says and what a speaker means by it, the Cooperative Principle and the maxims of quantity, quality, relation and manner as the mechanism that generates the unspoken content, and the further distinctions between generalized and particularized implicature and between conversational and conventional implicature. I do not want the theory explained to me again. I want it converted into something my unit can run.

  Please produce a decision procedure: numbered steps, each phrased as a question an investigator asks, in the order they must be asked, and for each step what evidence answers it, what counts as a sufficient answer to move on, and what to do when the answer is that we cannot tell. The standard tests should appear as steps rather than as background: whether the unspoken content is derivable from what was said plus the maxims plus background the parties share; whether the speaker can add a denial without contradicting herself, and what follows from that, given that the same property which marks the content as an implicature also supplies the "I never said that" defense; whether the content survives being put into different words, which is how we tell whether we are objecting to a word or to a move; and the presumption against assigning a word an extra sense when a conversational explanation will do, with a tie-break rule for when the content is neither cancellable nor detachable and therefore plausibly belongs to the word's meaning. The procedure must keep apart three things our current process conflates: what the message said, what the speaker meant to convey, and what the recipient inferred. It must say how the evidentiary burden shifts between a generalized implicature, which any competent speaker would draw, and a particularized one, which requires background the parties may not share. And it must handle messages in which almost nothing is said — an emoji, a bare link, an uncommented quotation — so that the entire case rests on the implicature. Include a one-page version that the two first-pass investigators can keep at their desks, since they will be running the first three steps before I see anything.

  The procedure must mark, in the procedure itself, the two places where it stops: where the answer is "no violation" even though something plainly happened, and where the remaining question is one of values rather than of language — how much shared background we may attribute to a reasonable recipient, whether our code is about intent or about effect, and how much weight a real but deniable harm carries. Do not leave those hand-offs implicit; label them as such.

  Then run the procedure, step by step, on three cases, showing the outcome at each step: first, a message that asks a question whose relevance to the conversation presupposes that a demeaning proposition is true, from a sender who adds that he is not saying it and is merely asking; second, a phrase whose literal content is innocuous and which functions as a signal inside one team, where the subject denies knowing it has that use and the complainant's reading depends on background the two of them may not share; third, a message that reproduces a third party's slur with no comment, which the complainant reads as endorsement and the subject describes as documentation. At least one of the three should come out in a way I will not like, and you should say so rather than smooth it over.

  Close with what the procedure cannot do: where it will misfire, and what we should stop expecting it to settle. I understand that Grice was describing cooperative conversation and that our subjects are not always cooperating with us. Tell me what that does to the procedure, and where we should set it aside in favor of another standard, which you should name.
reasoning: |-
  We are designing a decision procedure based on Grice's theory of conversational implicature to handle employee conduct complaints. The goal is to separate what was said, what was meant, and what was inferred, and to determine if there was a violation of the code of conduct (prohibiting communication of contempt based on a protected characteristic via implicature).

  The procedure must be in numbered steps, with each step as a question, evidence required, sufficiency criteria, and actions for inconclusive cases. It must also mark where the procedure stops because of "no violation" or because the issue becomes one of values.

  We note that Grice's framework assumes cooperative conversation, but in our context, the speaker might not be cooperating. However, we are using the framework to analyze the message in the context of the conversation.

  Key Gricean concepts we'll use:
  - Cooperative Principle: participants in a conversation cooperate by following maxims.
  - Maxims:
    1. Quantity: Be as informative as required, not more.
    2. Quality: Be truthful; do not say what you lack evidence for.
    3. Relation: Be relevant.
    4. Manner: Be clear, avoid obscurity, ambiguity, etc.
  - Implicature: meaning conveyed beyond what is said. Two types:
    - Generalized: does not depend on specific context (any competent speaker would draw it).
    - Particularized: depends on specific context (shared background or situation).
  - Cancellability: An implicature can be denied without contradiction.
  - Detachability: The implicature is not tied to the words; if we rephrase, the implicature may not hold.

  The procedure must handle cases with little explicit content (e.g., emoji, link without comment).

  We also note that the code prohibits "communication of contempt for a person on the basis of a protected characteristic." Therefore, we are looking for implicatures that convey such contempt.

  We design the procedure in steps:

  **Preliminary Note**: The procedure is applied to a specific message (or set of messages) in a specific context (the conversation, the participants, the shared background). The investigator must gather the message, the context (including the conversation thread, the setting, the participants, and any known shared background), and the complaint (what the complainant says they inferred).

  **Step 1: What was said?**
     - **Question**: What is the literal meaning of the message? (Ignore for now any implicature.)
     - **Evidence**: The message itself, dictionary definitions, grammatical rules.
     - **Sufficiency**: When we have a clear literal meaning that is not ambiguous in the context of the words alone. (Note: context may be needed for ambiguity resolution, but we are looking for the minimal meaning without any inference.)
     - **Inconclusive**: If the message is ambiguous on its face (e.g., a word with multiple common meanings) and context does not resolve it (but note: context is used in later steps for implicature, so here we take the most common meaning or all possible meanings and proceed). If we cannot determine any literal meaning (e.g., an unknown emoji), we note that and proceed to Step 2 with the understanding that the literal content is minimal or absent.

  **Step 2: What did the speaker say? (Resolving ambiguity)**
     - **Question**: Given the context (the conversation, the participants, the setting), which of the possible literal meanings (from Step 1) was the speaker likely using?
     - **Evidence**: The immediate context of the message (the conversation thread, the topic, the participants, the time and place). This step is about disambiguating what was said, not about implicature.
     - **Sufficiency**: When one meaning is clearly intended based on the context (e.g., a word in a technical jargon in a technical team). If multiple meanings are possible, we note all and proceed.
     - **Inconclusive**: If context does not resolve the ambiguity, we note that and proceed to Step 3 with the set of possible literal meanings.

  **Step 3: Does the literal meaning (from Step 2) violate the code?**
     - **Question**: Does the literal meaning (as resolved in Step 2) express contempt for a person based on a protected characteristic? (This is a direct violation without implicature.)
     - **Evidence**: The literal meaning and the code of conduct.
     - **Sufficiency**: Clear match or not. If the literal meaning includes contempt based on a protected characteristic, then we have a violation and the procedure stops with "Violation found (explicit)." If not, we proceed to Step 4.
     - **Inconclusive**: Not applicable. We are only looking for explicit contempt.

  **Step 4: What are the possible conversational implicatures?**
     - **Question**: What meanings beyond the literal one might a reasonable recipient infer, based on the Cooperative Principle and the maxims? We consider both generalized and particularized implicatures. We generate candidate implicatures.
     - **Evidence**: The literal meaning (from Step 2), the context (including the conversation, the participants, shared background, and the maxims). We apply the maxims to see what might be implicated to make the speaker's contribution cooperative. For example:
          - If the message seems irrelevant (violating Relation), then what must the speaker be assuming to make it relevant?
          - If the message is underinformative (violating Quantity), then what else might the speaker be implying?
          - If the message is obscure (violating Manner), then why might the speaker choose to be obscure?
     - **Sufficiency**: We have a set of candidate implicatures that are consistent with the context and the maxims. We do not yet judge if they are actually implicated; that comes later.
     - **Inconclusive**: If no candidate implicatures emerge, then we proceed to Step 7 (no violation). If we cannot generate any, we note that and proceed.

  **Step 5: Which candidate implicatures are actually conveyed? (Cancellability test)**
     - **Question**: For each candidate implicature, is it cancellable? That is, could the speaker deny that they meant that without contradicting what they said? (If yes, it is an implicature; if no, it might be part of what was said.)
     - **Evidence**: The literal meaning and the candidate implicature. We imagine the speaker saying: "I did not mean that; I only meant [literal meaning]." If this denial is consistent, then the candidate is cancellable and hence an implicature. If the denial leads to contradiction (e.g., because the candidate is entailed by what was said), then it is not an implicature and should have been detected in Step 3.
     - **Sufficiency**: We identify which candidate implicatures are indeed implicatures (cancellable). We proceed with those.
     - **Inconclusive**: If we are unsure, we note that and keep the candidate for Step 6.

  **Step 6: Detachability test (optional but helpful for determining if the implicature is conventional or conversational)**
     - **Question**: For each implicature from Step 5, is it detachable? That is, if we rephrase the message without changing the literal meaning, does the implicature disappear? (If yes, then it is a conventional implicature or tied to the form. If no, then it is a conversational implicature and likely more robust.) This step helps to determine if the offense is due to the words or the move (the act of saying that in that context). However, note: our code prohibits communication of contempt, regardless of whether it is conventional or conversational. But this step may help in understanding the nature of the violation.
     - **Evidence**: Rephrasing the message to express the same literal meaning in a different way and checking if the implicature remains.
     - **Sufficiency**: We note for each implicature whether it is detachable or not. This does not change the violation but may help in explaining the finding.
     - **Inconclusive**: Not applicable for the violation decision, but we note if we cannot rephrase.

  **Step 7: Does any implicature convey contempt based on a protected characteristic?**
     - **Question**: For each implicature that survived Step 5 (and optionally Step 6), does it express contempt for a person (or group) based on a protected characteristic? 
     - **Evidence**: The implicature and the code of conduct.
     - **Sufficiency**: If one or more implicatures meet the criteria, then we have a potential violation. We proceed to Step 8. If none do, then we stop with "No violation found (no contempt via implicature)."
     - **Inconclusive**: If we are not sure, we note that and proceed to Step 8.

  **Step 8: Burden shift for particularized implicature?**
     - **Question**: For each implicature that may violate the code, is it generalized or particularized?
          - Generalized: any competent speaker in the context would draw it.
          - Particularized: it requires specific background knowledge that the parties may or may not share.
     - **Evidence**: The context and the shared background of the participants. We ask: would a reasonable person in the recipient's position, with the recipient's known background, have drawn the implicature? (Note: We are not asking if the recipient actually did, but if a reasonable person would.)
     - **Sufficiency**: We classify the implicature as generalized or particularized. For generalized implicatures, we assign them to the speaker: the speaker should have known that the implicature would be drawn. For particularized implicatures, we then ask: did the speaker have reason to know that the recipient had the background to draw the implicature? 
     - **Inconclusive**: If we cannot determine, we treat it as particularized and move to Step 9.

  **Step 9: For particularized implicatures, was the background shared?**
     - **Question**: For each particularized implicature, was the required background (to derive the implicature) shared between the speaker and the recipient? (That is, did the speaker have reason to know that the recipient would have the background to draw the implicature?)
     - **Evidence**: The relationship between the speaker and the recipient, their known interactions, common work context, etc. We look for evidence that the speaker knew or should have known about the recipient's background.
     - **Sufficiency**: If we find that the speaker had reason to know the background, then we treat the implicature as intended (or at least, the speaker is responsible). If not, then we do not assign the implicature to the speaker.
     - **Inconclusive**: If we cannot determine, we note that and proceed to Step 10.

  **Step 10: Final decision on violation**
     - **Question**: Considering all the above, is there an implicature that conveys contempt based on a protected characteristic and that we can attribute to the speaker (either because it was generalized or because it was particularized and the background was shared)? 
     - **Evidence**: The entire analysis.
     - **Sufficiency**: If yes, then "Violation found (implicature)." If no, then "No violation found."
     - **Inconclusive**: If we are unsure, we note that the evidence is insufficient and we cannot make a finding of violation. We record that the message might have been offensive but we cannot establish a violation under the code.

  **Stopping Points for Values or "No Violation":**
     - **Stopping Point 1: After Step 3 or Step 7/10** - If we find no literal violation and no implicature that violates the code, we stop with "No violation." This is where something might have happened (e.g., offense was taken) but it does not meet the code's definition. We must accept that the procedure cannot find a violation in every case of upset.
     - **Stopping Point 2: After Step 8 and Step 9** - The determination of whether a reasonable recipient would draw the implicature (Step 8) and whether the background was shared (Step 9) involve value judgments and context assessments that are not purely linguistic. We are making a judgment call about the reasonableness of the recipient and the speaker's knowledge. This is where we might need to set a company policy (e.g., what is a reasonable recipient? how much shared background do we assume?).

  **One-Page Version for First-Pass Investigators (Steps 1-3):**

  ```
  Employee Conduct Investigation - First Pass (Steps 1-3)

  Step 1: What was said? (Literal meaning)
     - Look at the message. Ignore context for now. What do the words mean literally?
     - Use dictionary, grammar rules.
     - If multiple meanings, list them.
     - If unclear, note: "Literal meaning unclear."

  Step 2: What did the speaker say? (Disambiguate using context)
     - Look at the conversation: what was being discussed? Who was involved? When and where?
     - Choose the most likely literal meaning in context. If still ambiguous, note all possibilities.

  Step 3: Does the literal meaning violate the code?
     - Does the literal meaning express contempt based on a protected characteristic?
     - If YES: mark as "Potential explicit violation" and escalate to manager.
     - If NO: proceed to full procedure (manager will handle Steps 4+).
  ```

  Now, we run three cases:

  **Case 1: The Question**
     - Message: In a meeting about promotion criteria, an employee asks: "Given that women are less committed because of family obligations, should we adjust the criteria?" and then adds, "I'm not saying they are, I'm just asking."
     - Complainant: Infers that the speaker is asserting that women are less committed.
     - Subject: Says he was only asking a question and explicitly denied the assertion.

  **Case 2: The Team Signal**
     - Message: In a team channel, an employee writes: "We need to clean house." In the context of the team, this phrase is known to mean removing underperforming employees, but it has a more common meaning of literal cleaning. The team is predominantly from one ethnic group and the complainant, who is not in the team, interprets it as a reference to ethnic cleansing and finds it threatening.
     - Subject: Denies knowing the team's internal meaning and says he meant it as a metaphor for improving performance by replacing staff.
     - Complainant: Says that in the company context, this phrase is known to have a double meaning and that the team uses it in a way that references ethnic cleansing.

  **Case 3: The Bare Link**
     - Message: An employee posts a link to an article that uses a racial slur in the title, with no comment, in a channel discussing diversity. The complainant, who is a member of the targeted group, says that posting such a link without comment is an endorsement of the slur. The subject says he was documenting what the other side says and that it was relevant to the conversation.

  We run the procedure step by step for each case.

  **Case 1: The Question**

  Step 1: What was said?
     - Literal meaning: The speaker is asking whether promotion criteria should be adjusted given a proposition (that women are less committed because of family obligations). He then explicitly states he is not asserting that proposition.

  Step 2: What did the speaker say? (Disambiguate)
     - The context is a meeting about promotion criteria. The literal meaning is clear: a question about adjusting criteria based on a stated assumption, with a denial of that assumption.

  Step 3: Literal violation? The literal words do not assert the proposition (because of the denial). So no explicit contempt.

  Step 4: Candidate implicatures?
     - The question seems to violate the maxim of Relation: why ask about adjusting criteria for a reason that (if not true) is irrelevant? To make it relevant, the speaker must be assuming the proposition is true or at least possible. But note the denial. The candidate implicature: the speaker believes that women are less committed because of family obligations.

  Step 5: Cancellability test: The speaker explicitly cancelled it ("I'm not saying they are"). Is that consistent? Yes, because he is only asking a hypothetical. So the candidate implicature is cancellable and hence an implicature.

  Step 6: Detachability: We can rephrase: "Should we adjust promotion criteria for women, given concerns about family obligations?" without the explicit proposition. The implicature (that the speaker thinks women are less committed) might still be there, but it is weaker. This suggests it is conversational.

  Step 7: Does the implicature convey contempt? Yes, because it implies that women as a group are less committed (a protected characteristic) and that is demeaning.

  Step 8: Generalized or particularized? Generalized: any competent speaker would recognize that raising this question in a formal setting about promotions, even as a hypothetical, implies that the speaker considers the proposition a valid concern. It does not require special background.

  Step 9: Not needed (generalized).

  Step 10: Violation found. The speaker implicated a contemptuous view about women.

  **Case 2: The Team Signal**

  Step 1: What was said? Literal meaning: "We need to clean house." Common meanings: (a) literally, clean a physical house; (b) metaphorically, remove unwanted elements (e.g., underperforming employees).

  Step 2: Context: In a team channel about work. The team has used this phrase to mean removing underperforming employees. The literal meaning in context is likely (b): remove underperforming employees.

  Step 3: Literal violation? Meaning (b) does not express contempt based on a protected characteristic. So no explicit violation.

  Step 4: Candidate implicatures? 
     - The complainant infers an ethnic cleansing reference. This would be a particularized implicature that requires knowledge of the team's internal culture and the complainant's background (knowing that the team is predominantly from a group that has experienced ethnic cleansing, and that the phrase might be used with that connotation). 
     - But note: the speaker denies knowing that connotation. We must see if a reasonable recipient would draw that implicature.

  Step 5: Cancellability: The speaker can deny the ethnic connotation without contradiction: "I just meant we need to remove underperforming staff." So it is cancellable.

  Step 6: Detachability: We can rephrase: "We need to replace some underperforming staff." The ethnic connotation would disappear. So it is detachable? Actually, the ethnic connotation is attached to the specific phrase "clean house" in the team's usage. So if we rephrase, we lose it. This suggests the implicature is conventional (if it exists) or particularized.

  Step 7: If the ethnic connotation is implicated, it would express contempt based on ethnicity. But we must determine if it was implicated.

  Step 8: Is the implicature generalized or particularized? Particularized: it requires knowledge of the team's internal use and the complainant's background. So we must determine if the speaker had reason to know that the complainant would interpret it that way.

  Step 9: Shared background? The subject denies knowing the team's internal meaning had an ethnic connotation. The team is in the same company, but the phrase is common in business for restructuring. The complainant is not in the team and might not even know about the team's internal use. We must see: 
     - Was the team's internal use widely known? 
     - Did the subject know or should have known that the complainant would interpret it that way? 
     - Without evidence that the subject knew, we cannot attribute the particularized implicature to the speaker.

  Step 10: No violation found. The literal meaning was not a violation, and we cannot prove that the speaker intended or should have known about the ethnic connotation. However, note: the company might still want to address the use of ambiguous language.

  **Case 3: The Bare Link**

  Step 1: What was said? A link to an article. The literal meaning is just a reference to the article. The title of the article (which may be visible) contains a racial slur.

  Step 2: What did the speaker say? In the context of a diversity discussion, posting a link to an article with a slur in the title. The literal meaning: providing a resource.

  Step 3: Literal violation? The message itself does not contain a slur; it is a link. So no explicit violation.

  Step 4: Candidate implicatures? 
     - Why post this? Without comment, it might be seen as endorsement (if the article is hateful) or as documentation (if the discussion is about combating hate). 
     - The maxim of Relation: in a diversity discussion, posting a link to an article with a slur might be relevant as an example of what they are fighting against, but without comment, it might be ambiguous. 
     - Candidate implicature 1: The speaker endorses the article's content. 
     - Candidate implicature 2: The speaker is providing an example of problematic content.

  Step 5: Cancellability: The speaker can say: "I was not endorsing it; I was documenting it." So both are cancellable.

  Step 6: Detachability: If the speaker had added a comment, the implicature could change. So it is detachable.

  Step 7: Candidate 1 (endorsement) would convey contempt (if the article is contemptuous). Candidate 2 would not.

  Step 8: Generalized or particularized? 
     - In the context of a diversity discussion, it is not clear which implicature is more natural. It might be particularized: it depends on the shared understanding of the group. 
     - We must ask: what would a reasonable recipient in that channel infer? If the group often shares examples of hate speech to critique it, then candidate 2. If not, candidate 1 might be more likely.

  Step 9: Shared background? 
     - The subject says it was documentation. The complainant says endorsement. 
     - If there is no established practice in the group of sharing such material for critique, then a reasonable recipient might infer endorsement. 
     - If the subject has a history of posting such material without comment and it was not challenged, that might support documentation. 
     - Without evidence of shared background for documentation, we might lean towards endorsement.

  But note: the burden is on us to prove the implicature of endorsement. If we cannot establish that the implicature was intended (or should have been known by the speaker) then we cannot find a violation.

  Step 10: Without clear evidence of the group's norms, it might be inconclusive. However, the subject's explanation (documentation) is plausible. We might not be able to prove that the speaker intended endorsement. Therefore, we might not find a violation.

  **Outcome for Cases:**
     - Case 1: Violation found (you might like this because it catches the veiled contempt).
     - Case 2: No violation found (you might not like this because the complainant felt threatened, but the procedure cannot attribute the implicature to the speaker).
     - Case 3: Might be no violation (you might not like this because the link caused harm, but we cannot prove the implicature of endorsement).

  **What the procedure cannot do:**
     - It cannot handle non-cooperative contexts perfectly. Grice assumes cooperation, but sometimes the speaker is deliberately flouting the maxims to convey contempt and then deny it. The procedure can still catch generalized implicatures, but particularized ones require shared background and may be harder.
     - It cannot resolve every ambiguity. When the evidence is insufficient, we must conclude no violation.
     - It does not address intent vs. effect. Our code is about communication (intent or at least responsibility for the conveyed meaning). But if we are using effect (what a reasonable recipient would infer), then we are leaning towards effect. The procedure uses the reasonable recipient standard for generalized implicatures and for particularized ones with shared background.
     - We must set aside the procedure in cases of explicit threats or harassment that don't rely on implicature (already covered in Step 3) and in cases where the harm is clear but not based on a protected characteristic (which our code doesn't cover).
     - Also, in cases of power imbalance, the reasonable recipient standard might need adjustment (e.g., a recipient in a marginalized group might draw an implicature that a majority group member wouldn't). The procedure uses "reasonable recipient" but we have to define what that is. We might need to use a "reasonable person in the complainant's position" standard.

  **Where to set aside the procedure:**
     - When the issue is about the effect on the recipient regardless of intent or implicature (if the company policy shifts to prioritize effect), we should use a different standard (e.g., the "reasonable person" standard from harassment law that focuses on the victim's perspective and whether the conduct created a hostile environment). This is especially important in cases of sexual harassment and other forms of discrimination where the effect is key. In such cases, we might bypass the Gricean analysis and ask: "Would a reasonable person in the complainant's position find the conduct severe or pervasive enough to create a hostile work environment based on a protected characteristic?" This is a legal standard and might be more appropriate for some complaints.

  **Conclusion:**
     The procedure provides a structured way to analyze implicatures. It will not catch every harmful message because some harms are not based on protected characteristics, and some implicatures are too particularized without evidence of shared background. It also requires making judgment calls about reasonableness and shared background, which are not purely linguistic. We must be prepared to accept "no violation" findings in some cases that caused offense but do not meet the code's criteria or where evidence is lacking. For cases that involve creating a hostile environment regardless of intent, we should have a separate track using the hostile environment standard.
answer: |-
  ### Gricean Implicature Decision Procedure for Employee Conduct Investigations

  **Core Principles**:  
  1. **Distinguish**: What was *said* (literal meaning), what was *meant* (speaker’s intent via implicature), what was *inferred* (recipient’s interpretation).  
  2. **Maxims**: Quantity (informativeness), Quality (truthfulness), Relation (relevance), Manner (clarity).  
  3. **Implicature Types**:  
     - **Generalized**: Any competent speaker would infer it (burden on speaker).  
     - **Particularized**: Requires specific shared background (burden shifts to complainant to prove shared context).  
  4. **Tests**:  
     - Cancellability: Can the speaker deny the implicature without contradiction? (If yes, it’s implicature; if no, it’s part of what was said.)  
     - Detachability: Does the implicature vanish if rephrased? (If yes, offense is about words; if no, offense is about the "move.")  
     - Explanatory priority: Prefer conversational implicature over assigning new word meanings.

  ---

  ### Decision Procedure: Numbered Steps

  **Step 1: What is the literal meaning of the message?**  
  - **Evidence**: Message text, dictionary definitions, grammatical rules.  
  - **Sufficient Answer**: A single clear literal meaning OR all possible literal meanings if ambiguous.  
  - **Cannot Tell**: Proceed with all possible literal meanings.  
  - **Output**: Literal meaning(s) documented.

  **Step 2: Does the literal meaning violate the code?**  
  - **Evidence**: Literal meaning from Step 1, code of conduct.  
  - **Sufficient Answer**:  
    - **Yes** (contempt based on protected characteristic): **STOP. Violation found (explicit).**  
    - **No**: Proceed to Step 3.  
  - **Cannot Tell**: Proceed to Step 3 (treat as "no" for explicit violation).

  **Step 3: What conversational implicatures could a reasonable recipient infer?**  
  - **Evidence**: Message context (conversation history, participants, setting), Grice’s maxims.  
  - **Sufficient Answer**: List plausible implicatures generated by flouting:  
    - *Quantity*: Under/over-informative → What is implied?  
    - *Quality*: Obvious falsehood/sarcasm → What is truly meant?  
    - *Relation*: Seemingly irrelevant → What shared assumption makes it relevant?  
    - *Manner*: Obscurity/ambiguity → Why this phrasing?  
  - **Cannot Tell**: Proceed to Step 4 (no implicatures assumed).  

  **Step 4: Is the implicature *cancellable*?**  
  - **Evidence**: Can the speaker add, “I did not mean X” without contradiction?  
  - **Sufficient Answer**:  
    - **Yes**: Implicature confirmed. Proceed to Step 5.  
    - **No**: Revisit Step 2 (likely part of literal meaning).  
  - **Cannot Tell**: Proceed to Step 5 (assume cancellable).  

  **Step 5: Is the implicature *detachable*?**  
  - **Evidence**: Rephrase the message. Does the implicature persist?  
  - **Sufficient Answer**:  
    - **Yes** (implicature remains): Offense is about the *move*, not words.  
    - **No** (implicature vanishes): Offense is about specific wording.  
  - **Cannot Tell**: Note for final assessment.  

  **Step 6: Generalized or particularized implicature?**  
  - **Evidence**: Context, company-wide norms vs. team-specific knowledge.  
  - **Sufficient Answer**:  
    - **Generalized**: Any competent speaker would infer it. **Burden on speaker**. Proceed to Step 7.  
    - **Particularized**: Requires unique shared background. **Burden shifts to complainant**. Proceed to Step 8.  
  - **Cannot Tell**: Treat as particularized.  

  **Step 7: For generalized implicatures: Does it convey contempt?**  
  - **Evidence**: Implicature from Step 3, protected characteristics.  
  - **Sufficient Answer**:  
    - **Yes**: **Violation found (implicature).**  
    - **No**: **STOP. No violation.**  
      - **Hand-off to Values**: *Here, "something happened" (e.g., offense taken), but the inference is not attributable to the speaker under Grice. The code focuses on communicated contempt, not unintended effects.*  

  **Step 8: For particularized implicatures: Did the parties share critical background?**  
  - **Evidence**: Work history, team interactions, prior communications, training records.  
  - **Sufficient Answer**:  
    - **Yes** (shared background): Proceed to Step 7.  
    - **No**: **STOP. No violation.**  
      - **Hand-off to Values**: *Attributing background is subjective. Policy must define "reasonable shared knowledge" (e.g., "Would all team members understand this?").*  
  - **Cannot Tell**: **Inconclusive. No violation** (insufficient evidence).  

  **Step 9: Final Appeal Check**  
  - **Question**: Would the implicature survive the general counsel’s "no implied content" standard?  
  - **Action**: If all prior steps point to violation but rely solely on implicature, flag for appeal risk.  

