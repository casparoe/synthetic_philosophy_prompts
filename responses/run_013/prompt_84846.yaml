  ### One-Page Version for First-Pass Investigators (Steps 1–3 Only)  
  ```markdown
  **FIRST-PASS CHECKS (Complete in 2 Hours)**  
  1. **LITERAL MEANING**: What do the words/phrases literally mean? (Use dictionary/grammar; ignore context.)  
     - ✔️ Sufficient: One clear meaning OR list all options.  
     - ❓ Unclear: Note ambiguity; proceed.  

  2. **EXPLICIT VIOLATION?** Does the literal meaning show contempt based on protected characteristic?  
     - ✔️ Yes: Escalate as "explicit violation."  
     - ✔️ No: Proceed to Step 3.  

  3. **CONTEXT SETUP**: Gather:  
     - Conversation history.  
     - Participants’ roles/teams.  
     - Shared projects/knowledge.  
     - Escalate to manager for full procedure (Steps 4+).  
  ```  

  ---

  ### Case Applications  

  **Case 1: Demeaning Question**  
  *Message: "Should we promote her if she’ll quit after maternity leave? I’m not saying she will, just asking."*  
  - **Step 1**: Literal meaning: Question about promotion conditional on maternity leave.  
  - **Step 2**: No explicit contempt (denial included).  
  - **Step 3**: Implicature: Speaker assumes women quit after maternity leave (flouts Relation: only relevant if true).  
  - **Step 4**: Cancellable? Yes ("I’m not saying she will" cancels the implication).  
  - **Step 5**: Detachable? Rephrase as "What’s her 5-year plan?" → Implicature vanishes (offense is about *this wording*).  
  - **Step 6**: Generalized (any competent speaker infers gender-based assumption).  
  - **Step 7**: Contempt based on gender? **Yes. VIOLATION.**  
    - *You may dislike this: Speaker’s denial is overridden by generalized implicature.*  

  **Case 2: Team-Specific Phrase**  
  *Message: "Keep it clean, people" (Innocuous literal meaning; Team A uses it to mean "no immigrants"). Complainant infers xenophobia.*  
  - **Step 1**: Literal: Reminder to tidy up.  
  - **Step 2**: No explicit contempt.  
  - **Step 3**: Implicature: "Immigrants are dirty" (flouts Manner: obscure if not in Team A).  
  - **Step 4**: Cancellable? Yes (speaker denies knowing the code).  
  - **Step 5**: Detachable? Rephrase as "Maintain hygiene" → Implicature persists only in Team A.  
  - **Step 6**: Particularized (requires Team A knowledge).  
  - **Step 8**: Shared background? Complainant not in Team A; no evidence speaker knew complainant understood the code. **NO VIOLATION.**  
    - *You will dislike this: Harm occurred, but implicature not attributable under Grice.*  
    - **Hand-off to Values**: *Should the code penalize "insider jargon" that leaks? Policy choice, not linguistics.*  

  **Case 3: Bare Link to Slur**  
  *Message: Link to article titled "[Slur] Threaten Our Jobs" with no comment. Complainant infers endorsement.*  
  - **Step 1**: Literal: Reference to an article.  
  - **Step 2**: No explicit contempt (slur in title but not stated by speaker).  
  - **Step 3**: Implicature: Endorsement of slur (flouts Quantity: why share without context?).  
  - **Step 4**: Cancellable? Yes (speaker claims "documentation").  
  - **Step 5**: Detachable? Add comment: "This is hate speech" → Implicature changes.  
  - **Step 6**: Particularized (depends on channel norms: Is sharing without comment typical for critique or endorsement?).  
  - **Step 8**: Shared background? Diversity channel usually shares articles for critique. No evidence speaker endorsed slur. **NO VIOLATION.**  
    - *Outcome: Without context, Grice cannot resolve ambiguity. Harm is deniable.*  

