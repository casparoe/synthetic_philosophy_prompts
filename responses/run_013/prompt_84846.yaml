  ### What the Procedure Cannot Do  
  1. **Non-Cooperative Contexts**: Grice assumes good-faith dialogue. In hostile interactions:  
     - Speakers *flout* maxims to *avoid accountability* (e.g., "just asking questions").  
     - **Solution**: Switch to **Hostile Environment Standard** (EEOC guidelines): Focus on whether conduct created an *intimidating/hostile workplace* for a protected group, regardless of intent. Use when:  
       - Power imbalances exist (e.g., manager→subordinate).  
       - Pattern of behavior (e.g., 10 "neutral" links to racist content).  

  2. **Limits**:  
     - **Ambiguity Misfires**: When context is irrecoverable (e.g., deleted messages), the procedure defaults to "no violation."  
     - **Values Hand-offs**: Cannot resolve:  
       - "Reasonable recipient" boundaries (e.g., Is niche slang "shared" in a 2,000-person company?).  
       - Intent vs. impact debates (Grice focuses on communicated intent; use **Hostile Environment Standard** for impact-led claims).  
     - **Non-Linguistic Harassment**: Gestures, images, or systemic behaviors require behavioral analysis, not implicature.  

  3. **When to Set Aside Grice**:  
     - **Patterns of Conduct**: Multiple low-severity incidents (use **Hostile Environment Standard**).  
     - **Asymmetric Power**: Complainant is vulnerable (e.g., probationary employee).  
     - **Irreconcilable Ambiguity**: Default to no violation, but recommend mediation/training.  

  **Final Recommendation**:  
  - Use Grice for single-message, ambiguity-driven cases.  
  - Adopt **Hostile Environment Standard** for recurring issues or where power dynamics taint cooperation.  
  - Train investigators on both frameworks; update code to clarify if "effect" outweighs "intent."
