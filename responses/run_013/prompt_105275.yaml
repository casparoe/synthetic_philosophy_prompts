prompt: |-
  I am a professor of philosophy and I chair the algorithmic-fairness review board at a state human-services agency. The board signs off on the predictive models the agency intends to deploy — at present a screening tool that ranks families for child-welfare investigation and a model that triages disability-benefit applications — and it meets once a month for ninety minutes. Its members are a clinician, an agency lawyer, a statistician, two community representatives, and me. None of them can be asked to reconstruct a proof. The director signs off on our recommendation, and a bad recommendation is a real harm to real people.

  I know the formal literature well enough to see the trap we keep falling into. Vendors and program offices arrive proposing to make a model fair by adjusting it, as though fairness were a single dial. I know that the standard statistical criteria — parity in approval rates across groups, equal false-positive and false-negative rates, and calibration within each group — cannot in general hold together when the groups differ in base rate, and that even the meaning of a fair outcome depends on what the model is actually predicting, which is frequently a convenient proxy rather than the thing we care about. What the board needs is not another seminar on the impossibility results but a procedure it can actually run.

  You are an expert in fair machine learning, in the philosophy of measurement, and in the design of institutional decision procedures. Write that procedure. Address me as a philosopher who already knows the theory, and give me something I can hand to a board that does not. Before you draft it, brainstorm the cases the procedure has to survive and the ways a procedure of this kind typically goes wrong, and think carefully about the difference between what the impossibility results forbid outright and what they merely make expensive. Then produce, in order: the questions the board should put to every proposed model; what counts as a sufficient answer to each; the point at which the procedure returns a no; and the point at which it must stop and hand the decision to a named human being because the remaining question is one of values rather than mathematics. Mark plainly which steps are genuine constraints from the impossibility results and which are judgment calls dressed up as procedure, and state what the procedure cannot do.

  Then run it on three cases: (1) the child-welfare screen, where the recorded target is a later investigation rather than the maltreatment we actually care about, base rates differ across groups, the vendor claims the model is calibrated, and the community representatives demand equal error rates; (2) the disability-benefit model, where the agency wants equal approval rates but the underlying need is genuinely unequal; and (3) a case of your choosing in which the procedure returns an answer the agency will not like. Be specific about who signs what, and say what the board should do when it runs out of time before the questions are exhausted.
reasoning: |-
  We are designing a procedure for the algorithmic-fairness review board. The board has 90 minutes per meeting and members without technical background. The procedure must be practical and address the inherent tensions in fairness criteria without getting bogged down in theory.

  Key insights from the problem:
  - The impossibility results (like the impossibility theorem by Kleinberg, Mullainathan, Raghavan and Chouldechova) show that we cannot simultaneously satisfy calibration, equal false positive rates, and equal false negative rates when base rates differ. Similarly, equal approval rates might conflict with calibration if base rates differ.
  - Fairness is context-dependent and requires value judgments about what is more important in a specific application (e.g., avoiding false negatives in child welfare might be more critical than in disability benefits, or vice versa).
  - The models often predict a proxy (like "later investigation") rather than the true outcome of interest (like "maltreatment"). This introduces measurement issues.

  The procedure must:
  1. Be executable in a limited time by non-experts.
  2. Force the vendor and agency to clarify what they are predicting and why, and what fairness means in context.
  3. Identify when the proposed fairness adjustments are mathematically incompatible or when they conflict with the board's value judgments.
  4. Have clear stopping points: either approval, rejection, or a decision that requires human judgment (e.g., by the director) when values are in conflict.

  Brainstorm of cases the procedure must survive:
  - Case 1: Child-welfare screen. Proxy target (investigation) vs. true target (maltreatment). Base rates differ. Vendor claims calibration. Community reps want equal error rates. We know that if base rates differ, we can't have both calibration and equal error rates. So the board must choose between them, but the choice involves values (which error is more harmful?).
  - Case 2: Disability-benefit model. Agency wants equal approval rates, but underlying need (base rate) is unequal. If we force equal approval rates, we might either over-serve some groups (if we set a high threshold for the group with higher need) or under-serve (if we set a low threshold for the group with lower need). This might conflict with the goal of allocating benefits to those in need.
  - Case 3: A case where the model is fair by one criterion but unfair by another, and the agency's preferred criterion leads to a result that is politically unpopular or unjust. For example, a recidivism model that satisfies calibration but leads to higher false positive rates for one group, which the community representatives might find unacceptable.

  Typical ways a procedure can go wrong:
  - Becoming too theoretical and overwhelming the board.
  - Failing to force the vendor to disclose key information (like base rates, the true target, or the trade-offs).
  - Ignoring the difference between the proxy and the true target.
  - Not having a clear stopping point for value judgments, leading to endless debate.
  - Not accounting for time constraints.

  The procedure:

  I. Questions for every proposed model and what counts as a sufficient answer:

  1. What is the true outcome of interest (e.g., child maltreatment, genuine disability) and what is the predicted proxy (e.g., later investigation, initial screening score)? 
     - Sufficient answer: Clear definitions of both, and an explanation of the relationship between the proxy and the true outcome (including any known biases in the proxy).

  2. What are the base rates (or estimated base rates) for the true outcome and the proxy in each of the major protected groups (e.g., race, gender, as defined by law and policy)?
     - Sufficient answer: Numbers or estimates, with confidence intervals if available. If base rates are unknown for the true outcome, the vendor must state that and explain how the proxy is used.

  3. What fairness criteria is the model designed to satisfy? (e.g., demographic parity, equalized odds, calibration, etc.)
     - Sufficient answer: Explicit statement of the criteria and why they were chosen for this application.

  4. What are the expected error rates (false positive and false negative) for each protected group? (If the model is not designed to control these, then what are the observed or simulated error rates by group?)
     - Sufficient answer: A table of error rates by group, and an explanation of how these were calculated (on what data, with what assumptions).

  5. What are the known trade-offs? (e.g., "We satisfy calibration but at the cost of higher false negative rates in Group A", or "We achieve equal false positive rates but then the model is not calibrated in Group B")
     - Sufficient answer: A clear statement of the trade-offs imposed by the chosen fairness criterion and the base rate differences, including any violations of other fairness criteria that the board might care about.

  II. When to return a "no":
  - If the vendor cannot provide answers to questions 1, 2, and 4 (i.e., they don't know the base rates or error rates by group), then the model is insufficiently documented and must be rejected.
  - If the chosen fairness criterion is mathematically incompatible with the base rate differences and the vendor's claims (e.g., claiming both calibration and equal false positive rates when base rates differ) then reject because the vendor's claims are impossible.
  - If the error rates for any group are so high that the model is practically useless or harmful in that group (e.g., false negative rate above a threshold that the board sets in advance for the application), then reject.

  III. When to stop and hand the decision to a named human being (the agency director):
  - When the model satisfies the mathematical criteria but the trade-offs (as revealed in question 5) require a value judgment that the board cannot make by itself. For example:
     - The model is calibrated (so it predicts the same probability meaning for every group) but one group has a much higher false negative rate because of a lower base rate. The board might not agree on whether that is acceptable in child welfare (where missing a maltreatment case is very harmful) vs. disability benefits (where a false negative might be less immediately harmful but still serious).
     - The agency wants equal approval rates (demographic parity) but that requires setting different thresholds per group, which might be seen as discriminatory, or it might lead to higher false positives in one group and higher false negatives in another.

  In such cases, the board should summarize the trade-offs and ask the director to make a decision based on the agency's priorities.

  IV. Marking constraints vs. judgment calls:
  - Genuine constraints from impossibility results: 
     - We cannot have calibration, equal false positive rates, and equal false negative rates simultaneously when base rates differ. So if the vendor claims all three, that's impossible and the model must be rejected (or the vendor must correct their claim).
     - We cannot have demographic parity (equal approval rates) and calibration if base rates differ. So if both are required, it's impossible without changing base rates (which we can't do) or using a different model that doesn't rely on base rates (which might not exist).
  - Judgment calls dressed as procedure: 
     - Deciding what level of error rate is "too high" is a judgment call. The procedure might set a threshold (e.g., false negative rate > 20% is too high for child welfare) but the 20% is a judgment.
     - Choosing which fairness criterion to prioritize in the face of trade-offs is a value judgment. The procedure forces the trade-offs to be made explicit, but the choice is not mathematical.

  V. What the procedure cannot do:
  - It cannot eliminate the need for value judgments. 
  - It cannot make a model fair in every sense. 
  - It cannot correct for biased data or a poor proxy. It can only flag these issues.

  VI. Handling time constraints:
  - The board must prioritize the first three questions (true outcome, base rates, and fairness criteria). If time runs out, the board should require the vendor to provide written answers to the remaining questions and then hold a special session or make a decision by email within one week. If that is not possible, the model must be deferred to the next meeting.

  VII. Sign-off:
  - The board chair (you) signs the recommendation report, which includes answers to the questions, a summary of trade-offs, and either a recommendation to approve, reject, or a request for the director to make a value judgment. The director then signs the final decision.

  Now, run the procedure on the three cases.

  Case 1: Child-welfare screen
  - True outcome: Child maltreatment.
  - Proxy: Later investigation (which may be influenced by bias and not perfectly correlated with maltreatment).
  - Base rates: Differ across groups (e.g., Group A has a higher base rate of maltreatment than Group B).
  - Vendor claims: The model is calibrated (so predicted risk scores match the actual rate of the proxy, i.e., investigation).
  - Community representatives: Demand equal false positive and false negative rates (i.e., equalized odds).

  Procedure:
  1. Question 1: The true outcome is maltreatment, but the model predicts investigation. The vendor must explain the relationship. If they cannot show that investigation is a good proxy for maltreatment (e.g., with validation against maltreatment data), this is a problem. (Sufficient answer might be lacking, so we might reject, or at least flag as a major concern.)
  2. Question 2: Base rates for the proxy (investigation) and true outcome (maltreatment) by group. Vendor provides base rates for investigation (which might differ by group) but not maltreatment? Then we note that the true base rates are unknown and the proxy might be biased.
  3. Question 3: Vendor says they aimed for calibration. Community reps want equalized odds. We note that these are incompatible with base rate differences. 
  4. Question 4: Vendor provides error rates. Because of base rate differences, if the model is calibrated, then false negative rates will be higher in the group with lower base rate? (Actually, calibration doesn't directly control error rates. We need to see the numbers.) 
  5. Question 5: Trade-offs: Calibration is achieved, but then the false negative rates will be higher in the group with lower base rate? (In fact, with calibration and base rate differences, the group with lower base rate will have a higher false negative rate and a lower false positive rate, relative to the group with higher base rate.) 

  The board cannot have both calibration and equalized odds. The vendor has chosen calibration. The community reps want equalized odds. This is a conflict of values. 

  Decision: The board must hand this to the director. The director must decide whether calibration (which makes the risk scores interpretable in the same way across groups) is more important than equalized odds (which ensures that errors are distributed equally). The board might also note that the proxy is imperfect and that the true error rates for maltreatment are unknown, which is a reason for caution.

  Case 2: Disability-benefit model
  - True outcome: Genuine disability (as per a gold standard assessment, which might be expensive and not available at scale).
  - Proxy: The model uses available data to predict the true disability.
  - Agency wants: Equal approval rates (demographic parity) across groups.
  - But underlying need (base rate of true disability) is unequal.

  Procedure:
  1. Question 1: The true outcome is genuine disability. The model predicts a proxy? Actually, the model is being used to triage, so it might predict the true disability. But the application says "triage", so it might be a proxy for the outcome of a full assessment. Clarify: the model predicts the likelihood of being eligible for benefits (which should be based on genuine disability). But the agency wants equal approval rates. 
  2. Question 2: Base rates of genuine disability by group are unequal (say, Group A has higher disability rate than Group B). 
  3. Question 3: The agency wants demographic parity (equal approval rates). 
  4. Question 4: Without adjustment, the model would approve more of Group A (if it's accurate). To get equal approval rates, the vendor must adjust. This could be done by setting a higher threshold for Group A (so only the most severe cases are approved) and a lower threshold for Group B (so more marginal cases are approved). Then:
     - In Group A: false negatives increase (because we are being stricter) and false positives might decrease.
     - In Group B: false positives increase (because we are being more lenient) and false negatives might decrease.
  5. Question 5: Trade-off: We are trading off between:
     - Over-serving Group B (giving benefits to people who don't qualify) and under-serving Group A (denying benefits to people who do qualify) to achieve equal approval rates.

  The board must consider: Is it acceptable to have different thresholds for different groups? This might be seen as discriminatory. Also, the goal is to allocate benefits to those in need. The adjustment might lead to misallocation. 

  This is a value judgment: should we prioritize equal approval rates or equal accuracy? The board might not agree. Therefore, hand to the director. The director must decide if demographic parity is a legitimate goal in this context (e.g., to address historical under-representation) even if it leads to misallocations.

  Case 3: A case where the procedure returns an answer the agency will not like.
  - Suppose a model for predicting job training program success, where the agency wants to maximize overall success but also wants to ensure that the program is equally accessible to all groups. The agency wants to use a model that predicts success and then select the top scorers. 
  - Base rates of success (without the program) differ by group (due to structural inequalities). 
  - The vendor proposes a model that is calibrated and has good overall accuracy but results in much lower selection rates for a historically disadvantaged group.

  Procedure:
  1. Question 1: The true outcome is program success (e.g., getting a job after training). The model predicts this. 
  2. Question 2: Base rates of success (without the program) are lower for Group A (the disadvantaged group). 
  3. Question 3: The vendor has not applied any fairness adjustment. The model is optimized for accuracy. 
  4. Question 4: Error rates: The model has higher false negative rates for Group A because it's harder to predict success for this group (due to less data or more noise) or because the base rate is lower? Actually, if the model is well-calibrated and accurate, then the selection rate (approval) will be proportional to the base rate. So Group A will have a lower selection rate. 
  5. Question 5: Trade-off: To increase the selection rate for Group A, we would have to lower the threshold for them, which would increase false positives (selecting people who are less likely to succeed) and might reduce the overall success rate of the program.

  The board might reject the model because it leads to a disparate impact on Group A. However, the agency wants to maximize overall success. 

  The procedure: The board might note that without an adjustment, the model is mathematically valid (calibrated and accurate) but it perpetuates existing disparities. The board could reject on the grounds that the agency's mission includes equity, so a model that does not address disparate impact is unacceptable. Alternatively, if the agency's stated goal is only to maximize success, then the model might be acceptable. But the community representatives would likely object.

  This is a value conflict. The board might hand it to the director, but the director might be inclined to approve because of the overall success goal. However, the board might instead reject the model because it violates the agency's equity policy (if such exists). The procedure requires the board to check if the model meets the agency's stated fairness criteria. If the agency hasn't stated any, then the board must require the agency to state one. 

  In this case, the board returns a "no" because the model has not been designed to meet any fairness criterion that would prevent disparate impact. The agency will not like this because they want to deploy the model quickly and it has high accuracy. 

  But note: the procedure does not require every model to have a fairness adjustment. It requires that the board evaluate the trade-offs and that the model meets the agency's stated goals. If the agency has not stated a fairness goal, then the board must require them to state one. Without that, the model might be rejected for incompleteness.

  Finally, the procedure document:

  **Procedure for Fairness Review of Predictive Models**

  1. **Pre-Meeting Submission**: Vendors must submit a report addressing the following questions at least two weeks before the meeting. The board chair will distribute the report to members.

  2. **Meeting Procedure**:
     - The chair will lead the board through the following questions. Each question must be addressed in order. The vendor will present their answers, and the board may ask for clarification.
     - Time allocation: 10 minutes per question, with 15 minutes for discussion and decision at the end.

  3. **The Questions**:
     - **Question 1 (Target Clarification)**: 
          - "What is the true outcome of interest (the ideal we care about) and what is the predicted outcome (the proxy or operational target)?"
          - Sufficient answer: Clear definitions and evidence of the relationship between the proxy and the true outcome (e.g., a validation study if available). If the proxy is known to be biased, this must be disclosed.
     - **Question 2 (Base Rates)**:
          - "What are the base rates (or estimates) for the true outcome and the proxy in each protected group (as defined by agency policy)?"
          - Sufficient answer: Numerical rates per group, with sources and uncertainty noted. If base rates are unknown for the true outcome, the vendor must explain the limitations and how the proxy is used.
     - **Question 3 (Fairness Criterion)**:
          - "What fairness criterion was the model designed to satisfy? Why was this criterion chosen?"
          - Sufficient answer: Explicit statement of the criterion (e.g., demographic parity, equalized odds, calibration) and a justification for its use in this context.
     - **Question 4 (Error Rates)**:
          - "What are the expected false positive and false negative rates for each protected group? How were these calculated?"
          - Sufficient answer: A table of error rates by group, including the data and method used (e.g., holdout set, simulation). If the model was not designed to control these, the vendor must provide the rates as they are.
     - **Question 5 (Trade-offs)**:
          - "What trade-offs does the chosen fairness criterion impose? Specifically, which other fairness criteria are violated, and how do the error rates compare across groups?"
          - Sufficient answer: A clear statement of the trade-offs, including any group that experiences significantly higher error rates and the reasons (e.g., due to base rate differences).

  4. **Decision Rules**:
     - **Reject the model** if:
          - The vendor fails to provide sufficient answers to Questions 1, 2, or 4 (e.g., missing base rates or error rates).
          - The vendor claims a combination of fairness criteria that are mathematically impossible (e.g., calibration and equalized odds with base rate differences) and cannot correct their claim.
          - The error rates for any group are above the agency's pre-defined maximum tolerable levels (to be set by the board for each application).
     - **Hand to the Director** if:
          - The model meets the technical criteria (sufficient answers, no impossible claims, error rates below thresholds) but the trade-offs (from Question 5) involve value judgments that the board cannot resolve (e.g., which group's errors are more acceptable). The board will prepare a summary of the trade-offs and the director will decide.

  5. **Impossibility Constraints vs. Judgment Calls**:
     - **Impossibility Constraints** (from mathematics): 
          - It is impossible to satisfy calibration, equal false positive rates, and equal false negative rates simultaneously when base rates differ. Any claim to the contrary is grounds for rejection.
          - It is impossible to satisfy demographic parity (equal approval rates) and calibration when base rates differ. Any such claim is grounds for rejection.
     - **Judgment Calls** (disguised as procedure):
          - The maximum tolerable error rates (for rejection) are set by the board based on the application. These are not mathematical but ethical/policy decisions.
          - Deciding which fairness criterion to prioritize in the face of trade-offs is a value judgment. The procedure only forces the trade-offs to be explicit.

  6. **What the Procedure Cannot Do**:
     - It cannot guarantee fairness in an absolute sense.
     - It cannot correct for a poor choice of proxy or biased data.
     - It cannot make value judgments for the agency.

  7. **Time Constraints**:
     - If the meeting time is exhausted before completing the questions, the board may:
          - Require written responses to the remaining questions within one week and then make a decision via email (with all members responding within three days).
          - If that is not feasible, defer the model to the next meeting.
     - The board chair may extend the meeting by 30 minutes if a decision is near and all members agree.

  8. **Sign-off**:
     - The board chair signs the recommendation report, which includes:
          - Answers to the five questions.
          - A summary of the trade-offs.
          - A recommendation: Approve, Reject, or Hand to Director (with a summary for the director).
     - The director signs the final decision (approve or reject) and may overrule a board recommendation only in exceptional circumstances (to be documented).

  Now, the board has a clear, step-by-step procedure that focuses on the essential information and forces the value conflicts into the open.
answer: |-
  ### Fair-ML Review Board Procedure: Practical Framework for Non-Experts  
  **Philosophical Foundation**: The impossibility results (e.g., Kleinberg et al., Chouldechova) prove that when base rates differ, you cannot simultaneously satisfy calibration, equal error rates (FPR/FNR), and demographic parity. This is a **mathematical constraint**, not opinion. However, the choice of *which* criterion to prioritize—and whether to accept proxy-target gaps—is a **value judgment**. This procedure forces explicit trade-offs and redirects value conflicts to the director.  

  ---

  ### **The Procedure: 5 Questions, 3 Outcomes**  
  **Time Management**: Allocate 10 min per question (50 min total). Reserve 30 min for discussion/vote. If time runs out, defer to a special session within 7 days. If unresolved, the chair summarizes gaps and the director decides.  

  #### **Question 1: What is the true goal, and what is the model actually predicting?**  
  - **Why**: Proxies (e.g., "investigation" vs. "maltreatment") introduce measurement bias.  
  - **Sufficient Answer**:  
    - Clear definitions of:  
      - Ideal target (e.g., "child maltreatment," "disability need").  
      - Operational proxy (e.g., "investigation outcome," "initial application score").  
    - Evidence of proxy-target alignment (e.g., correlation study, bias audit).  
  - **Reject If**: No distinction between ideal and proxy, or no evidence of alignment (e.g., vendor says "we predict investigations" but cannot show it correlates with maltreatment).  
  - **Judgment Call**: Accepting weak proxy alignment (e.g., 60% correlation) is a policy choice.  

  #### **Question 2: What are the base rates?**  
  - **Why**: Base rate differences (e.g., Group A maltreatment rate = 5%, Group B = 2%) make fairness trade-offs inevitable.  
  - **Sufficient Answer**:  
    - Base rates for the **proxy** *and* **ideal target** per protected group (race, gender, etc.).  
    - Confidence intervals (if estimated).  
  - **Reject If**: Base rates missing or estimated with >30% uncertainty without sensitivity analysis.  
  - **Mathematical Constraint**: Base rate differences guarantee that calibration + equal FPR/FNR + demographic parity **cannot coexist**.  

  #### **Question 3: What fairness criterion is enforced?**  
  - **Why**: Vendors often optimize one metric while ignoring trade-offs.  
  - **Sufficient Answer**:  
    - One primary criterion (e.g., calibration, equal FPR, demographic parity).  
    - Justification for why it fits the use case (e.g., "calibration ensures risk scores are interpretable in child welfare").  
  - **Reject If**: Claim of multiple incompatible criteria (e.g., "we achieve calibration AND equal FPR" when base rates differ).  
  - **Judgment Call**: Choosing a criterion (e.g., equal FPR vs. calibration) depends on harm tolerance (see Q5).  

  #### **Question 4: What are the error rates per group?**  
  - **Why**: Errors reveal disparate impacts (e.g., high FNR in Group A means missed maltreatment).  
  - **Sufficient Answer**:  
    - Table of FPR/FNR per group for the **proxy**.  
    - Estimated FPR/FNR for the **ideal target** if proxy misaligns (e.g., via bias-correction models).  
  - **Reject If**: Error rates missing, or FPR/FNR > agency max tolerance (e.g., FNR > 10% in child welfare).  
  - **Mathematical Constraint**: If base rates differ, calibration implies FNR disparity (lower-risk groups have higher FNR).  

  #### **Question 5: What trade-offs does this create?**  
  - **Why**: Forces acknowledgment of who bears costs (e.g., Group A gets more false alarms, Group B gets more missed cases).  
  - **Sufficient Answer**:  
    - Statement of trade-offs (e.g., "We optimized calibration, so Group A (low base rate) has 20% FNR vs. Group B’s 5% FNR").  
    - Harm analysis (e.g., "High FNR in child welfare risks undetected abuse; high FPR wastes resources").  
  - **Hand to Director If**: Trade-offs are mathematically sound but ethically fraught (e.g., "Calibration is met, but Group A’s FNR is triple Group B’s").  
  - **Judgment Call**: Whether a trade-off is acceptable (e.g., "Is 20% FNR tolerable?") is a value decision.  

  #### **Outcomes**  
  - **Approve**: All answers sufficient, no impossibility violations, trade-offs within agency tolerance.  
  - **Reject**: Incomplete answers, impossibility claims, error rates exceed tolerance.  
  - **Hand to Director**: Trade-offs require policy/ethical weighing (e.g., "Which group’s errors matter more?").  

  **Sign-off**:  
  - **Board Chair** signs the recommendation report (questions 1–5 summary + approve/reject/director referral).  
  - **Director** signs final decision (override requires written justification).  

  ---  

  ### **Procedure Limitations**  
  - **Cannot Do**: Fix biased proxies, eliminate trade-offs, or satisfy all fairness criteria at once.  
  - **Cannot Detect**: Novel biases (e.g., intersectional groups not tracked), data drift post-deployment.  
  - **Risk of "Judgment Calls Dressed as Procedure"**:  
    - Setting max error tolerance (Q4) is policy, not math.  
    - Accepting proxy alignment (Q1) is epistemology, not statistics.  
    - Choosing a fairness criterion (Q3) is ethics, not optimization.  

  ---  

  ### **Case Applications**  

  #### **Case 1: Child-Welfare Screen**  
  - **Proxy**: Later investigation (not maltreatment).  
  - **Base Rates**: Group A investigation rate = 8%, Group B = 3% (true maltreatment unknown).  
  - **Vendor Claim**: Calibration enforced.  
  - **Community Demand**: Equal FPR/FNR.  
  - **Procedure**:  
    1. Q1: Proxy (investigation) ≠ ideal (maltreatment). Vendor shows 0.6 correlation with maltreatment studies. **Sufficient but weak**.  
    2. Q2: Base rates differ. True maltreatment rates unknown. **Flagged as risk**.  
    3. Q3: Vendor enforces calibration. Community wants equal FPR/FNR. **Conflict: impossible per math**.  
    4. Q4: Under calibration:  
        - Group A (high risk): FPR = 5%, FNR = 7%.  
        - Group B (low risk): FPR = 2%, FNR = 15% (due to base rate).  
        FNR gap exceeds agency tolerance (max 10%).  
    5. Q5: Trade-off: Calibration causes 2x higher FNR in Group B. Harm: Undetected maltreatment in low-risk groups.  
  - **Outcome**: **Reject**.  
    - **Why**: Impossibility (Q3 claim conflicts with math), FNR tolerance exceeded (Q4).  
  - **Board Action**: Document rejection due to FNR violation and proxy misalignment. Director notified.  

  #### **Case 2: Disability-Benefit Model**  
  - **True Target**: Disability need (base rate: Group A = 12%, Group B = 5%).  
  - **Agency Request**: Equal approval rates (demographic parity).  
  - **Procedure**:  
    1. Q1: Model predicts need (true target). **Sufficient**.  
    2. Q2: Base rates differ (12% vs. 5%). **Sufficient**.  
    3. Q3: Demographic parity enforced. **Sufficient but conflicts with calibration (math constraint)**.  
    4. Q4: To force equal approval:  
        - Group A threshold raised → FNR = 25% (needy denied).  
        - Group B threshold lowered → FPR = 20% (non-needy approved).  
    5. Q5: Trade-off: Group A needy underserved (high FNR), Group B over-served (high FPR). Harm: Misallocated resources.  
  - **Outcome**: **Hand to Director**.  
    - **Why**: Mathematically valid but value-laden trade-off. Director must decide: Is equity (approval parity) worth misallocation?  
  - **Board Action**: Chair signs report summarizing: "Enforcing parity creates FNR/FPR imbalance. Director must weigh equity vs. efficiency."  

  #### **Case 3: Job-Readiness Model (Agency Will Hate)**  
  - **Use Case**: Screening applicants for job training.  
  - **True Target**: Job retention >6 months.  
  - **Base Rates**: Group A retention = 40% (historically marginalized), Group B = 65%.  
  - **Vendor**: Optimizes for calibration.  
  - **Agency Goal**: Maximize overall retention.  
  - **Procedure**:  
    1. Q1: Targets align. **Sufficient**.  
    2. Q2: Base rates differ (40% vs. 65%). **Sufficient**.  
    3. Q3: Calibration enforced. **Sufficient**.  
    4. Q4:  
        - Group A: FPR = 10%, FNR = 30%.  
        - Group B: FPR = 10%, FNR = 10%.  
        FNR gap (30% vs. 10%) exceeds tolerance (max 15%).  
    5. Q5: Trade-off: Calibration causes 3x higher FNR in Group A. Harm: Qualified Group A applicants rejected, perpetuating inequality.  
  - **Outcome**: **Reject**.  
    - **Why**: FNR tolerance violated (Q4). Agency prioritizes efficiency, but procedure enforces error limits.  
  - **Agency Pain Point**: Model has high overall accuracy but fails fairness thresholds. Board rejects "efficient" bias.  

  ---  

  ### **When Time Runs Out**  
  - **Step 1**: Prioritize Q1–Q3 (base rates, proxy, fairness criterion). If unanswered, **reject**.  
  - **Step 2**: For pending Q4/Q5, vendor provides written answers in 48 hours. Board votes via email within 72 hours.  
  - **Step 3**: If still unresolved, chair compiles gaps and refers to director with recommendation: "Unresolved due to time; reject unless gaps filled."  

  This procedure surfaces mathematical impossibilities, quantifies trade-offs, and redirects value conflicts upward. It accepts that fairness is a negotiation—not a dial—but ensures the negotiation is informed, transparent, and accountable.
