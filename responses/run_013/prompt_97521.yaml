prompt: |-
  In my department a colleague argues for metaontological deflationism with an analogy to the reclassification of Pluto: astronomers settled whether Pluto counts as a planet by voting on a definition rather than by discovering a fact, and so — he says — the standoff between the mereological nihilist, who denies that any composite object exists, and the universalist, who holds that any collection of things composes a further thing, is likewise a matter of where we choose to draw a line rather than a substantive discovery about what there is. From this he concludes that the composition debate is a verbal dispute, that the two sides share all the underlying facts and merely talk past each other, and that the sensible response is to stop doing ontology and instead get clear on our conventions. I want an audit of the analogy rather than a tour of the literature. Keep the vocabulary of the field in view (the special composition question, quantifier variance, the idea of competing ontological languages) but do not turn this into a citation exercise — no bibliographies or reading lists, and nothing that depends on getting an attribution exactly right.

  Give me:

  - Correspondence: a table pairing each element of the Pluto story with its supposed counterpart in the composition debate, about 200 words.
  - Where it breaks: the disanalogies, in rough order of seriousness, each with a sentence on why it is a break, about 350 words.
  - Which breaks matter: separate the ones that genuinely threaten his conclusion from the ones that are merely decorative, about 150 words.
  - Verdict: does the deflationary conclusion survive once the serious disanalogies are on the table, or was the analogy carrying it the whole time, about 150 words.
  - A better analogy, if one exists: and if none does, say so plainly, about 100 words.
