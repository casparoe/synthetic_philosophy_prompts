prompt: |-
  I teach a graduate seminar in social ontology, and this term we are reading the collapse literature from the outside — as philosophers, not archaeologists. I have a decomposition I have been working on, and I would like you to run it against a case. It is my own construction; do not go looking for antecedents or try to locate it in a literature, because I want it tested, not attributed.

  The decomposition. What we call the collapse of a society is usually three separable losses reported as one. First, integration: the loss of whatever apparatus coordinated decisions across a territory — tribute, roads, a calendar, a court, a credible monopoly on violence. Second, reproduction: the loss of the demographic and subsistence capacity to sustain the previous population at the previous standard. Third, legitimation: the loss of the symbolic order that made the previous arrangements appear necessary rather than contingent — that the king speaks for the gods, that the tribute is owed, that the calendar is the order of the world.

  The claim to be tested. These three come apart. Integration can fail while reproduction and legitimation hold: a change of regime, not a collapse. Integration and legitimation can fail while reproduction holds: a dark age that is, demographically, entirely fine. The strong sense of collapse — a society that ceases to exist and does not resume — requires all three to fail, and to fail such that no successor can reoccupy the old position. On this view most alleged collapses are reconfigurations, and the interesting question is why we insist on narrating them as deaths.

  The case: the Terminal Classic abandonment of the southern Maya lowlands — the great polities of the Petén and adjacent regions left between roughly the eighth and tenth centuries, while Maya societies continued in the north and the highlands and were still there at Spanish contact. Take as given what is common knowledge: the abandonment was real and large, it was staggered rather than simultaneous, drought and warfare and the failure of elite networks are all in play, and the Maya did not disappear.

  What I want from you:

  Assign each of the three losses a verdict for this case, and say what would have to be true for you to reverse it.

  Say which of the three you take to be the slow variable and which the fast one, and whether the case supports that ordering or inverts it.

  Then the part I care about most: where the decomposition misdescribes the case. Does it presuppose a state that was never there — were the southern lowland polities ever integrated in the sense the first category requires? Does the third category smuggle in functionalism, treating the symbolic order as something that exists in order to hold the other two up? And does splitting legitimation off from integration beg the question against anyone who holds that in this case they were the same thing? Where the decomposition has nothing to say, say that rather than forcing it to speak.

  Contrast it briefly with the two framings it is meant to improve on: the story that societies come apart when the marginal returns on complexity turn negative, and the ecological-informational reading in which collapse is the release phase of a cycle of growth, conservation, and reorganization. Say what each of those gets that mine does not.

  Close with the general lesson for social ontology: on your account, what individuates a society, such that we can say one has ceased to exist rather than merely changed? If the honest answer is that nothing does, say so, and say what follows for the collapse literature.

  End with a final line of exactly this form:

  Verdict: <collapse|reconfiguration|mixed> | primary loss: <integration|reproduction|legitimation> | decomposition survives: <yes|qualified|no>
reasoning: |-
  Okay, the user is teaching a graduate seminar in social ontology and has developed their own decomposition of societal collapse into three separable losses: integration, reproduction, and legitimation. They want me to test this framework against the Terminal Classic abandonment of the southern Maya lowlands. This is a complex request with several specific components I need to address.

  First, I need to apply each of their three categories to the Maya case:
  - Integration: The evidence strongly suggests this was lost - the coordinated systems like royal courts, tribute networks, and monumental construction collapsed. To reverse this verdict, we'd need evidence of functional supra-local coordination continuing after abandonment.
  - Reproduction: This appears partially lost - population declined drastically but some subsistence capacity remained. To reverse this, we'd need evidence of sustained pre-collapse population levels or agricultural intensity in the core areas.
  - Legitimation: This likely failed as the ideological underpinnings of divine kingship dissolved. To reverse this, we'd need evidence of continued elite legitimacy claims or ritual activity at major centers.

  Regarding variable speeds, I see legitimation as the slow variable that eroded gradually, while integration failure was relatively fast. The Maya case supports this ordering as ideological decay preceded the rapid political fragmentation.

  Now for the critical part - where the decomposition might misdescribe the case. There are three potential issues:
  1) It may overstate the pre-collapse integration level, as southern lowland polities were never highly centralized.
  2) The legitimation category risks functionalism by assuming symbolic orders exist primarily to support integration/reproduction.
  3) It artificially separates legitimation from integration when they were deeply intertwined in Maya society.

  Comparing to other frameworks:
  - Tainter's complexity theory explains diminishing returns on problem-solving investments well, which this decomposition lacks.
  - The adaptive cycle model better captures the cyclical nature of societal reorganization that the decomposition overlooks.

  For social ontology, I conclude societies lack sharp boundaries - their "death" is always a narrative imposition. The Maya case shows continuity amid transformation, challenging collapse narratives.

  The final verdict is mixed - it was collapse for the specific political form but reconfiguration for Maya society overall, with integration as the primary loss. The decomposition survives but with qualifications about its applicability to non-state societies.
answer: |-
  ### Analysis of the Southern Maya Lowlands Abandonment  
  **Using the Three-Loss Decomposition Framework**  

  ---

  #### **1. Verdicts on the Three Losses**  
  - **Integration Loss: Yes**  
    The coordinated apparatus (royal courts, inter-polity alliances, long-distance trade, monumental construction, and tribute systems) dissolved. Warfare intensified, diplomatic marriages ceased, and shared calendrical/ritual practices fragmented.  
    *Reversal Condition:* Evidence of sustained supra-local coordination (e.g., region-wide resource redistribution, defensive alliances, or continuity in administrative inscriptions post-9th century).  

  - **Reproduction Loss: Partial**  
    Population declined catastrophically (e.g., Tikal’s core fell from ~40,000 to near-zero), and agro-ecological systems (terracing, reservoirs) degraded. However, subsistence capacity *persisted* in pockets, with some groups maintaining milpa farming.  
    *Reversal Condition:* Proof that the southern lowlands could have demographically sustained pre-collapse levels without external support post-abandonment.  

  - **Legitimation Loss: Yes**  
    The symbolic order centered on divine kingship (k’uhul ajaw) collapsed: stelae erections ceased, ritual landscapes were abandoned, and later northern Maya (e.g., at Chichen Itza) adopted distinct legitimacy frameworks (e.g., council-based rule).  
    *Reversal Condition:* Continuity of kingly rituals, dynastic records, or god-king iconography in the south after major centers were abandoned.  

  ---

  #### **2. Variable Speeds**  
  - **Slow Variable: Legitimation**  
    Erosion was gradual (centuries of elite competition, failed prophecies, and ritual inadequacy during droughts).  
  - **Fast Variable: Integration**  
    Accelerated by cascading failures: warfare peaked rapidly (~790–810 CE), trade networks shattered within decades.  
  - **Ordering Support:** The case confirms this. Legitimation decay (slow) preceded integration failure (fast), but ecological stress (affecting reproduction) was the catalyst.  

  ---

  #### **3. Where the Decomposition Misdescribes the Case**  
  - **Overstated Integration:** The framework assumes a stable "apparatus," but southern lowland polities were never integrated like a state. They were dynamic, competing city-states with fluid alliances. Your Category 1 implicitly presumes centralization absent in the Maya case.  
  - **Functionalism in Legitimation:** Treating symbolic order as primarily serving integration/reproduction ignores that Maya cosmology *was* ontology—kings didn’t just "legitimize" power; they mediated cosmic order. Collapsing this into "loss" risks reducing culture to a stabilizing tool.  
  - **Begged Question on Legitimation-Integration Unity:** For the Maya, these were inseparable: royal rituals *were* integration (e.g., calendar ceremonies synchronizing polities). Splitting them artificially forces a distinction Maya ontology would reject.  
  - **Silence on Non-Elite Agency:** The decomposition omits how non-elites actively *withdrew* legitimation (e.g., abandoning centers when kings failed ritually), making collapse a social choice, not just systemic failure.  

  ---

  #### **4. Contrast with Alternative Framings**  
  - **Tainter’s Complexity Theory (Diminishing Returns):**  
    Captures why integration collapsed (e.g., monument costs outweighed benefits during droughts) but neglects *symbolic* unraveling. Your framework better explains why reproduction persisted in fragments.  
  - **Adaptive Cycle (Ecological-Informational):**  
    Explains reorganization (e.g., northern Maya flourishing post-collapse) as a natural cycle. Your decomposition improves by isolating *why* southern reorganization failed (legitimation loss blocked reoccupation), but misses the cyclical pattern.  

  ---

  #### **5. Lesson for Social Ontology**  
  Societies are individuated by their *core projects*—shared endeavors binding integration, reproduction, and legitimation (e.g., Maya rain-forest civilization as a divine-cosmic project). When all three unravel irrecoverably, the project ceases. Yet **no sharp boundary exists**: the southern Maya "collapse" was the death of a *specific political-ritual project*, not Maya society. The persistence of Maya language, agro-ecology, and cosmology in the north/highlands confirms continuity.  
  **Implication for Collapse Literature:** Narrating transformations as "deaths" serves modern anxieties about fragility, not historical reality. Social ontology must treat societies as mutable assemblages, not organisms with lifespans.  

  ---

  **Verdict: mixed | primary loss: integration | decomposition survives: qualified**
