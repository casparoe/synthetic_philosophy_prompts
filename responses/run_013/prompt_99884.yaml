  4. Offline simulations: Dreams are experiences that occur during sleep as offline simulations, but they are not stored as genuine memories (so the waking report is a reconstruction).
  5. Confabulated narratives: Dreams are entirely confabulated upon waking with no phenomenal core during sleep.

