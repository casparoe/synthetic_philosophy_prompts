answer: |-
  This is a beautifully articulated philosophical stalemate – the kind that reveals deep fault lines in how we conceptualize language and reality. Your hypothesis about shared assumptions is likely correct. Here's a diagnosis of the disagreement structure, the core commitments, and potential paths forward:

  **1. The Core Nature of the Disagreement:**
  This isn't a verbal dispute *about the word "vague"* in the trivial sense. It's a **fundamental clash in metaphysical and semantic priorities**, rooted in different conceptions of what it *means* for language to connect to the world, particularly regarding the relationship between meaning, truth, and epistemic access.

  *   **Your Friend (Supervaluationist):** Prioritizes **manifestation** and **defensibility**. Meaning must be *manifest* in use. Truth must be *defensible* based on publicly accessible criteria (the admissible sharpenings). If a fact *cannot in principle* be manifested or recovered through competent use of the language (even via sharpenings), then it *cannot* be part of the semantic facts fixed by meaning. The "no fact of the matter" is a claim about the *absence of a truth-evaluable semantic fact*, not necessarily about the physical world. Higher-order vagueness is a *feature*, not a bug – it captures the inherent lack of a sharp boundary even to the set of sharpenings, reflecting the open-texture of language.
  *   **You (Epistemicist):** Prioritizes **bivalence** and **determinacy of extension**. Meaning fixes a definite extension, even if the fixing mechanisms (complex dispositions) are opaque and the boundary is unknowable. Truth is a matter of fitting the world, independent of our ability to *know* or *defend* that fit. The "fact of the matter" is a claim about the *world-language relation* being determinate, even if *epistemically inaccessible*. The unknowability is a surprising but necessary consequence of complex linguistic dispositions. Higher-order vagueness is an *illusion* stemming from our ignorance of the precise boundary.
  *   **The Linguist:** Prioritizes **pragmatic function** and **communication**. They likely see the debate as irrelevant to how language *actually works* in communication. Borderline cases are handled contextually, through negotiation, hedging, or defaults, not by discovering metaphysical truths about "heapness". The endless debate about unrecoverable facts vs. truth-value gaps doesn't advance understanding of linguistic *behavior*.

  **2. What Each Must Give Up for the Other to Be Right:**
  *   **For You to Accept Supervaluationism:** You must give up the **principle that meaning *must* determine a bivalent extension** for every possible case. You must accept that semantic facts can be **indeterminate** ("neither true nor false") in borderline cases, and that this indeterminacy is an essential feature of vague language, not a flaw. You must accept that **meaning constrains but does not fully determine** a unique extension, leaving room for admissible variation (the sharpenings). Crucially, you must accept that **if a fact is *in principle* unrecoverable from meaning and use, it cannot constitute a semantic fact**.
  *   **For Your Friend to Accept Epistemicism:** They must give up the principle that **semantic facts must be *manifest* in principle through competent use** (via sharpenings or otherwise). They must accept that meaning *can* fix a precise boundary that is **radically epistemically inaccessible**, even in principle, to any user or group of users, due to the complexity of dispositions. They must accept that **bivalence holds universally**, even when its application is unknowable. They must abandon the need for "admissible sharpenings" as the mechanism for understanding truth conditions.

  **3. The Shared (and Problematic?) Assumption You Identified:**
  You hit the nail on the head. The core shared assumption driving the stalemate is:
  > **Meaning Supervenes on Use:** The meaning of a word (and thus its extension/truth conditions) is entirely fixed by facts about how speakers *actually use* the word and their *dispositions* to use it.

  *   **Where You Differ:** What *follows* from this assumption about the *nature* of the extension fixed by use.
      *   **Epistemicist:** Complex dispositions *can* (and do) fix a precise boundary, even if its location is computationally intractable and thus unknowable. The boundary *is* the complex pattern of dispositions itself. ("The dispositions *are* the boundary").
      *   **Supervaluationist:** Meaning/use fixes a *range* of acceptable precisifications (the admissible sharpenings). A unique boundary isn't fixed because the dispositions *underdetermine* it; they only rule out *inadmissible* boundaries. A unique, unknowable boundary isn't fixed by use; it would be an *additional fact* not grounded in use.
  *   **The Sticking Point:** Is the totality of dispositions sufficient to pick out a *single*, precise boundary (Epistemicism), or only sufficient to rule out boundaries that violate core meaning/usage, leaving a *range* of equally acceptable boundaries (Supervaluationism)? **This is the crux.** Your friend sees your "unique boundary" as *ungrounded* in the only facts available (use/dispositions). You see their "range of sharpenings" as implicitly smuggling in a *determinate set* of boundaries for that range, which then faces the same problem (higher-order vagueness), or worse, failing to provide definite truth conditions.

  **4. Paths to Progress (or Recognition of Stalemate):**

      a.  **Interrogate the Shared Assumption (Meaning Supervenes on Use):**
          *   Can this assumption be *denied* coherently in the context of public language? What would meaning be based on *instead*? (This is radical but worth exploring).
          *   Does "use" include *dispositions in idealized scenarios* (like considering all possible piles)? How idealized is too idealized to count as "use"?
          *   **Crucially:** Does "fixing meaning" require that the meaning *determines a verdict for every conceivable case*? Or is meaning inherently open-textured, leaving some cases genuinely unsettled by the existing facts of use? This is the key divergence.

      b.  **Formal/Metalanguage Investigations (Your Suggestions):**
          *   **Higher-Order Vagueness Coherence:** Can Supervaluationism *formally model* higher-order vagueness without collapsing into either precision or incoherence? (Work by Kit Fine, Rosanna Keefe, others attempts this, but it's complex and contentious. Does it satisfy *your* friend that it avoids a determinate set? Does it satisfy *you* that it's coherent?).
          *   **Expressing the Theory in its Own Language:** Can an Epistemicist *state their theory* without presupposing precise boundaries for terms like "disposition," "competent speaker," "indiscriminable," which themselves seem vague? (This is a serious challenge – Williamson addresses it, but the arguments are dense). Can a Supervaluationist state *their* theory without presupposing a precise set of "admissible" sharpenings or a precise meta-language? (This is the "higher-order" problem they embrace, but does it undermine the theory's ability to be *stated*?).
          *   **Formal Results on Definability:** Are there formal results showing that certain types of vague boundaries *cannot* be defined within a language possessing only the resources justified by the use/dispositions? This might lend weight to one side.

      c.  **Shift Focus from Truth to Justification/Assertibility:**
          *   **Acknowledge Different Projects:** Is the Epistemicist primarily concerned with **classical truth conditions** (what makes an utterance true/false)? Is the Supervaluationist primarily concerned with **warranted assertibility** (when is it correct/defensible to *call* something a heap)? These are related but distinct questions. Admitting this might defuse some heat.
          *   **The Linguist's Point:** Perhaps the core *linguistic* phenomenon is the **pragmatic strategy** speakers employ with borderline cases: hedging ("sort of a heap"), contextual negotiation, deferring to experts or standards, or simply avoiding the term. The metaphysical debate might be secondary to understanding these strategies.

      d.  **Accept Foundational Stalemate / Agree to Disagree:**
          *   Recognize that the disagreement stems from **fundamentally different intuitions** about the nature of language, truth, and access. These might be bedrock philosophical commitments.
          *   **What "Progress" Might Look Like Here:** A clearer articulation of *why* the other side's position seems necessary/compelling to them, and what core value (bivalence vs. manifestation) they are protecting. Understanding the *costs* each position pays (unknowable boundaries vs. truth-value gaps + higher-order issues) and why one finds those costs acceptable and the other finds them intolerable. Recognizing that both positions successfully avoid the Sorites *as a paradox* by denying its key premise in different ways, but that their explanations of *why* it's a bad argument are fundamentally different.

  **Diagnosis Summary:** Your disagreement is **substantive and metaphysical**, not merely verbal. It centers on whether the totality of linguistic dispositions *determines a unique, precise (though unknowable) boundary* (Epistemicism) or merely *constrains the boundaries to a range of equally admissible options*, making borderline cases genuinely indeterminate (Supervaluationism). The shared assumption that meaning supervenes on use forces the question: "What *exactly* does use fix?" Progress requires either: 1) Rigorously challenging that shared assumption, 2) Formal exploration of higher-order vagueness/expressibility, 3) Clarifying if you're pursuing different projects (truth vs. assertibility), or 4) Acknowledging the foundational nature of the clash and mapping its contours more precisely. The classifier experiment failed because it presupposed a definite boundary (a physical decision surface), which was precisely what was in dispute. Your friend was right to call it disanalogous for that reason, though your point about it being an *instance* of a boundary is also valid – it just doesn't settle whether *linguistic* meaning works that way. Good luck navigating this rich philosophical terrain!
