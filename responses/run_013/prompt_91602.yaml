prompt: |-
  Bit of an odd request, but here's where I'm at. I facilitate a standing stakeholder table on a regional river-basin water dispute — three camps, roughly: an irrigators' association, a land-conservation trust, and a tribal nation whose treaty water rights are in play. We've been meeting monthly for about a year, and the strange thing is that all three can sign off on the same package on the numbers and still leave feeling like something was done *to* them rather than *with* them. I've started to suspect the problem isn't the substance, it's that we keep treating "meet in the middle" as if it were a genuine improvement when really it's whoever is loudest getting a discount on what they wanted. A friend in my evening ethics class — we've been doing a unit on whether values can be traded off at all — put a half-formed idea to me: a compromise is only a real compromise, the kind where everyone is actually better off by their own lights, when each side gives up something it ranks *low* in exchange for something it ranks *high*, basically a trade; and that this whole picture only works if there's some common currency of concession, which for values there maybe isn't. I half believe it, but I can't run a philosophy seminar in a room where people have lawyers.

  So what I want from you is a decision procedure I can actually use at the table — something I can walk through in the twenty minutes before a session, without any training in formal decision theory, and that I can say out loud to the parties afterward so it isn't a black box. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure just stops and says no, and where it has to hand the call to a human because the thing being asked is a values question rather than a factual one. I care a lot about two distinctions surviving the trip: (a) the difference between a side ranking something low and a side being *unable* to rank it at all — some things are, for these people, conversation-stoppers, and a procedure that tries to price them is worse than useless; and (b) the difference between a concession that's freely made and one that's just coercion with a nicer name, since a "trade" extracted by the fact that one party can hold the whole basin hostage isn't a gain from trade at all. Then run it on three proposals: a winter-release-for-irrigation-cap package that the irrigators and the trust both like; a "cultural water" allocation that's hard to fit into any of our usual units; and a package where two of the three trade away something the third treats as non-negotiable. At least one of the three should come out as a case where the procedure tells me the deal I personally favor is illegitimate, because if it never bites me it isn't a real test. And be honest in the write-up about which steps are just my judgment dressed up as procedure — I'd rather know where the seams are than have it look cleaner than it is. No need for references, I'll add those if I ever write this up properly.
reasoning: |-
  Okay, the user is a facilitator in a complex water dispute involving irrigators, a land-conservation trust, and a tribal nation. They're struggling because even when agreements are reached numerically, parties feel coerced rather than collaborative. Their ethics class friend suggested that true compromise requires trading low-value items for high-value ones, but values might not have a common currency. The user needs a practical, transparent decision procedure that respects non-negotiable values and avoids coercion.

  First, I need to unpack the core issues. The main problem isn't the substance of the agreements but the feeling of being forced into concessions. The user suspects "meet in the middle" benefits the loudest, not all parties. They want a method that differentiates between low-rank and non-rankable items, and between voluntary trade versus coercion. Also, the procedure must be executable in 20 minutes without formal training, and transparent so parties understand it.

  The user mentioned three proposals to test: a winter-release package, a cultural water allocation, and a package where two trade away a third's non-negotiable. They want at least one outcome to reject their preferred deal to validate the procedure. Honesty about where judgment is involved is crucial.

  Now, considering the stakeholders: tribal nations often view water as sacred, so cultural allocations might be non-negotiable. Irrigators need reliable water for agriculture, while conservation trusts focus on environmental flows. The existing approach might ignore these intrinsic values, treating them as tradable.

  The ethics friend's point about trading low for high makes sense in theory, but in practice, if parties can't rank certain values (like cultural significance), forcing a trade is invalid. Also, power imbalances—like one party holding the basin hostage—could make concessions coerced. The procedure must detect these.

  I'll design a step-by-step method. Start with defining interests, then identify concessions each party can offer. Use a ranking system to find low-value gives and high-value gets. Crucial to include a step where parties flag non-negotiable items upfront. Also, assess voluntariness by checking if refusal is a viable option.

  For the three test cases: the winter-release package might pass if both sides trade low/high items. Cultural water could be tricky if it's non-negotiable for the tribe; the procedure should halt if ranking isn't possible. The third proposal, where a non-negotiable is traded, should be rejected, even if the facilitator likes it, proving the method works.

  Transparency is key. The facilitator must present each step clearly, perhaps as a checklist. Steps involving judgment (like interpreting resistance) should be explicitly noted. The write-up needs to highlight where facilitator discretion comes in, avoiding black-box perceptions.

  Deep needs: The user likely wants to build genuine trust among parties, ensuring sustainable agreements. They might also seek validation that their intuitive sense of coercion is legitimate. Underlying is a need for a fair process that respects cultural and ethical boundaries, transforming adversarial dynamics into collaborative problem-solving.
answer: |-
  Here's a concrete decision procedure – "The Value-Trade Protocol" – designed for your constraints and distinctions. It focuses on identifying *mutual gains from exchange* rather than splitting differences. It requires **15-20 minutes of prep** and runs **transparently** during negotiation.

  **Core Principle:** A legitimate concession is one where Party A gives up something *they value relatively lowly* in exchange for getting something *they value highly*, and this exchange is mirrored by Party B doing the same with *their own* valuation. This only works if the item is *rankable* and the trade is *voluntary*.

  **The Protocol: Step-by-Step (Facilitator Script)**

  *(Before Session Prep: Write 3 columns on a whiteboard/flipchart: "What Can We GIVE?", "What Do We WANT?", "Non-Negotiables?")*

  1.  **Frame & Consent (2 mins):**
      *   *Facilitator:* "We're going to test whether this package is a genuine value *trade* where everyone gains, or just a split where someone feels loss. This requires honesty about what truly matters *to you*. We start by listing what's simply off the table."
      *   **Question 1: "Are there elements in this package, or core principles behind your position, that your group *cannot* rank or trade, because they are fundamental, sacred, or essential to your existence? Please state them clearly for the record under 'Non-Negotiables'."**
      *   *Sufficient Answer:* A clear, specific statement (e.g., "Maintaining flow past X sacred site below Y level during Z ceremony," "Absolute water volume required for Tribal subsistence," "Preventing permanent ecological damage to reach R"). **Vague answers ("Our water rights," "The environment") are insufficient – push for concrete, operational non-negotiables.** If proposed, list under Non-Negotiables.
      *   *Stop Condition:* **If any party identifies a specific element *within the current package* as a Non-Negotiable, the package *as proposed* is immediately invalid for this protocol.** Negotiation must restart, avoiding that element. *(This protects distinction (a)).*
      *   *Human Judgment:* Interpreting "fundamental/existence." Facilitator must ensure statements are concrete, not strategic posturing. Note: *Principles* can be non-negotiable; *specific implementations* might be flexible if the principle is met.

  2.  **Identify Potential Trades (5 mins):**
      *   *Facilitator:* "Looking *only* at elements *not* listed as Non-Negotiables: For each party, what are you being asked to *give up* or *concede* in this package? What are you *gaining* or *securing*? Be specific. List each concession under 'What Can We GIVE?' and each gain under 'What Do We WANT?' next to your group's name."
      *   *Sufficient Answer:* Concrete actions/commitments (e.g., "Give: Reduce summer pumping by 10%", "Want: Guaranteed winter reservoir release of 500 AF", "Give: Allow temporary access to conservation parcel", "Want: Permanent easement on parcel Z", "Give: Accept monitoring protocol", "Want: Dedicated cultural flow designation"). **Ensure each "Give" is linked to a specific "Want" within the package context.**
      *   *Stop Condition:* If a party states they are only *giving* and not *getting* anything they value, or vice-versa, the package is not a potential trade. Negotiation needs rebalancing.

  3.  **Rank Value *Within* Party (5 mins):**
      *   *Facilitator (to each party privately, then share publicly):* "Considering *only your own list* of Gives and Wants: **Rank these items *for your group* from HIGHEST value/importance to LOWEST value/importance. Is there anything on your 'Give' list you rank as *relatively LOW* value to sacrifice? Is there anything on your 'Want' list you rank as *relatively HIGH* value to gain?"**
      *   *Sufficient Answer:* Clear relative ranking ("Among our concessions, reducing summer pumping is LOWEST cost for us; accepting the monitoring is MEDIUM. Among our gains, the winter release is HIGHEST value; the easement is MEDIUM"). **Absolute numbers aren't needed, just relative order.**
      *   *Stop Condition:* If a party *cannot* rank an item (it feels "wrong" or "impossible" to compare), **treat it as a *de facto* Non-Negotiable.** Note this publicly. The proposed trade involving this item is invalid. *(Reinforces distinction (a)).*
      *   *Human Judgment:* Facilitating honest self-assessment. Watching for body language indicating discomfort with ranking (signaling a values conflict). Deciding if "can't rank" is genuine or strategic.

  4.  **Assess Mutuality & Voluntariness (3 mins):**
      *   *Facilitator:* "Looking across the parties: **For each concession (Give) being made, is the party making it ranking it as *relatively LOW* value *to them*? For each gain (Want) being received, is the party receiving it ranking it as *relatively HIGH* value *to them*?**"
      *   *Sufficient Answer:* "Yes" for both parts across the key exchanges. If not, identify the mismatch ("Irrigators are giving up summer pumping (LOW for them) for winter release (HIGH for them) - good. Tribe is getting cultural flow designation (HIGH for them) but giving up... what? And how do they rank that?").
      *   *Facilitator (Crucial Voluntariness Check):* **"Could each party reasonably walk away from *this specific exchange* without catastrophic consequences *if they felt the trade wasn't beneficial?* Or is the alternative so bad that you *must* accept, even if the value feels low?"** *(Addresses distinction (b)).*
      *   *Sufficient Answer:* Parties affirm they have a viable alternative to *this specific trade* (even if the overall negotiation is tense). Expressions of feeling forced ("We have no choice") or referencing catastrophic BATNAs indicate coercion, not trade.
      *   *Stop Condition:* **If any key concession is ranked MEDIUM or HIGH by the giver, or any key gain is ranked LOW by the receiver, the trade element fails.** **If any party lacks a viable "no" option *for the specific trade*, the voluntariness fails.** The package lacks legitimacy as a mutual gain.
      *   *Human Judgment:* Assessing "reasonable walk away" and "catastrophic consequences." Requires deep understanding of context and power dynamics. Judging sincerity of "yes" to voluntariness.

  5.  **Protocol Output:**
      *   **Legitimate Trade:** If all concessions are LOW-ranked by givers, all gains are HIGH-ranked by receivers, no Non-Negotiables are violated, and voluntariness is affirmed. *This is a mutual gain.*
      *   **Illegitimate Compromise:** If any key element fails the ranking (MED/HIGH cost, LOW benefit, non-rankable) or voluntariness test. *This is likely coercion or splitting the difference.*
      *   **Incomplete/Invalid:** If Non-Negotiables are triggered or lists are unbalanced (only gives, no wants). *Needs renegotiation.*

  ---

  **Running the Test Cases:**

  **Case 1: Winter-Release-for-Irrigation-Cap (Irrigators & Trust like it)**
  *   **Prep:** Non-Negotiables? Irrigators: "No permanent loss of water rights volume." Trust: "No extinction of native fish Z." Tribe: (Silent, or perhaps "No impairment of treaty right priority").
  *   **Trades:** Irrigators: *Give* = Summer Cap (LOW? - they prefer winter water anyway), *Want* = Winter Release (HIGH). Trust: *Give* = Allow Winter Release from conservation pool? (MED? - ecological risk?), *Want* = Summer Cap (HIGH - protects low flows). *Tribe:* What are they *giving*? What are they *getting*? Likely nothing material here.
  *   **Ranking:** Irrigators: Give LOW, Want HIGH. Trust: Give MED?, Want HIGH. **MED Give = Problem.** Tribe: Not actively trading? Maybe getting stability, but not a defined concession/gain.
  *   **Voluntariness:** Trust might feel forced to accept MED cost because summer cap is so important (viable "no"?).
  *   **Protocol Output:** **Illegitimate Compromise (for Trust).** The Trust is giving up something they value moderately for a high gain, but it's not a *low*-cost concession. It's a sacrifice, not a trade. Tribe is bystander. *This bites you – the deal you like fails the test for one party.*
  *   **Refinement Needed:** Can the Winter Release be structured/guaranteed to lower the Trust's *perceived cost* (making it LOW)? Or can the Tribe be brought in with a genuine gain?

  **Case 2: "Cultural Water" Allocation**
  *   **Prep:** Non-Negotiables? Tribe: "The *existence* and *purpose* (cultural/spiritual/subsistence) of the allocation is non-negotiable. Specific *volume/timing* might be negotiable *if purpose is met*." Others: Likely none specific to this.
  *   **Trades:** Tribe: *Want* = Cultural Flow Designation (HIGH). *Give* = ? (Perhaps flexibility on *implementation* details? Agreement to a monitoring protocol? Support for another element?). Irrigators/Trust: *Give* = Water volume/flow regime. *Want* = ? (Certainty? Tribe's support? Mitigation measures?).
  *   **Ranking:** **Critical Step:** Can the Tribe rank *specific implementation details* (e.g., 10 AF vs 12 AF, Tue/Thu flow vs continuous)? If YES, and they rank one option LOW cost (e.g., Tue/Thu) vs HIGH value of the designation, and others rank their concession LOW (e.g., giving Tue/Thu flows is LOW cost to them) for a HIGH gain (e.g., Tribal support for basin plan), then *trade possible on details*. **If Tribe cannot rank *any* implementation details (all are equally essential to purpose), STOP. It's a package demand.**
  *   **Voluntariness:** Does the Tribe have a viable "no" if the implementation details violate the purpose? Do others have a viable "no" if the cost is too high? Crucial.
  *   **Protocol Output:** **Highly Contextual.** *Can* succeed if the *negotiable details* are framed as concessions/gains and ranked appropriately by all. *Fails* if the core concept or essential implementation detail is non-rankable/non-negotiable for the Tribe. *Requires careful framing of "Gives" as flexible details, not the core right.*

  **Case 3: Trading Away a Non-Negotiable (Two trade something the Third treats as NN)**
  *   **Prep:** Non-Negotiables? Party C (e.g., Tribe): Clearly states "Element X [e.g., flow past Site Y] is non-negotiable. Cannot be reduced/impacted."
  *   **Protocol Output:** **STOP at Step 1.** The package *as proposed* is invalid for the protocol because it violates a stated Non-Negotiable. Attempting to "price" or trade it is off limits. *The procedure forces you to confront this immediately, before wasting time.* No trade analysis occurs. Renegotiation must exclude Element X or find a solution that satisfies Party C's non-negotiable need.

  ---

  **Where Judgment Dresses as Procedure (Be Honest):**

  1.  **Interpreting "Non-Negotiable" (Step 1):** You judge if a statement is sufficiently concrete and fundamental, or if it's a bargaining position. Calling it out requires courage and context.
  2.  **Defining "Gives" and "Wants" (Step 2):** You guide parties to frame elements as concessions/gains. A poorly framed list skews everything. You decide if an item is truly a concession or just an implementation detail.
  3.  **Assessing "Can't Rank" (Step 3):** You interpret hesitation, discomfort, or statements like "it's all important." This is pure facilitation judgment – spotting values conflicts vs. strategic withholding.
  4.  **Defining "Relatively LOW/HIGH" (Step 3/4):** The protocol relies on *relative* ranking, but you judge if "LOW" is realistically low enough to feel like a gain, or just the least bad option. Is "MEDIUM" acceptable? (Protocol says no, but real life is fuzzy).
  5.  **Assessing "Viable 'No'" / "Catastrophic" (Step 4 Voluntariness):** This is the most judgment-laden step. You need deep knowledge of their BATNAs and power dynamics. Is walking away from *this trade* truly viable, or are they trapped by the overall dispute? You call this based on your read of the room and context. *This is where coercion hides.*

  **Why This Works for You:**

  *   **Fast:** Fits your 20-min prep/presentation window. Focuses only on key trade elements.
  *   **Transparent:** Each step is a simple question you can state and record publicly. No black box.
  *   **Protects Values:** Explicitly surfaces and honors Non-Negotiables and non-rankable items upfront.
  *   **Exposes Coercion:** The ranking and voluntariness checks directly target the "loudest gets a discount" and "hostage holding" problems.
  *   **Focuses on Gain:** Shifts mindset from "what did I lose?" to "did I trade low for high?"
  *   **Bites:** It *will* flag deals where someone is sacrificing medium/high value (like the Trust in Case 1) or where Non-Negotiables are trampled (Case 3).

  Use it to structure the *evaluation* of a proposed package, not necessarily to *generate* it. It shines a harsh but necessary light on whether "agreement" equals mutual gain or just managed coercion. Good luck.
