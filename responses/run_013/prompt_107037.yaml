answer: |-
  Here are five numbered readings of "you can't compare apples and oranges" as used in the context of comparing options embodying different values:

  1.  **Thesis:** The two options cannot be evaluated using a single, common unit of measurement (e.g., dollars, utils, happiness points) because the relevant values (e.g., meaning vs. security, lives saved vs. wilderness preserved) are fundamentally different kinds of goods.  
      **Classification:** Substantive and defensible claim.  
      **Licenses Conclusion?** No. The lack of a common cardinal metric does not preclude ordinal comparison (better/worse/equal or on a par) or reasoned choice based on non-additive reasoning (e.g., trade-offs, commitments, symbolic significance).  

  2.  **Thesis:** There is no single, context-independent, complete ordering that ranks all instances of these types of options relative to each other; the ranking might shift depending on the specific context, weighting, or perspective.  
      **Classification:** Substantive and defensible claim (reflecting value pluralism or context-dependence).  
      **Licenses Conclusion?** No. It challenges simple universal orderings but allows for contextualized comparisons and reasoned choices within specific situations, rejecting arbitrariness.  

  3.  **Thesis:** The options are *incomparable*: it is false that A is better than B, false that B is better than A, and false that A is equal to B in value (they might be "on a par" or involve a fourth relation).  
      **Classification:** Substantive and controversial claim (strong incomparability).  
      **Licenses Conclusion?** Yes, if true. If *no* comparative relation holds, then choice lacks a rational basis in relative value, making it non-rational or arbitrary in a strict sense (though other factors like will or commitment might still operate). **This is what people often *mean* by the slogan, though it's rarely established.** 'Arbitrary' fits *if* one insists choice *must* be based solely on comparative value judgment.  

  4.  **Thesis:** The values belong to entirely distinct conceptual categories or "dimensions" (e.g., moral vs. aesthetic, prudential vs. moral), making any direct ranking between them a category mistake, like asking if the number 5 is taller than an idea.  
      **Classification:** False (or extremely rare). Most practical choices involve values interacting within the same broad domain of practical reason (e.g., overall choiceworthiness).  
      **Licenses Conclusion?** If true, it would preclude comparison, making choice arbitrary *by definition* for that reason. However, this strong separation is implausible for typical value conflicts in practical reason.  

  5.  **Thesis:** The options can be ordinally ranked (one can be judged better, worse, or equal/on par overall), but this ranking cannot be grounded in or derived from any cardinal, additive measure combining distinct quantitative scales for each value.  
      **Classification:** Substantive and defensible claim.  
      **Licenses Conclusion?** No. Ordinal comparability is sufficient for non-arbitrary choice; cardinality is not required for rational preference or decision. The choice is made based on overall judgment, not calculation.
