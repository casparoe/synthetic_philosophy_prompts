     - However, triviality results show that we cannot have this for all conditionals without triviality. Therefore, we cannot require joint coherence in this way for an arbitrary set of conditionals.

     - Alternative: We might only list conditionals that are based on a fixed partition of the sample space (so that the antecedents are mutually exclusive and exhaustive). Then we can require that the conditional probabilities for the same consequent given disjoint antecedents must satisfy the law of total probability.

     - But in practice, we might not have a fixed partition.

     - Given the time constraint, we might not be able to check the entire book for every new contract. Instead, we can:
          - For each new contract, check that the antecedent event A (or the conjunction in the case of nested) is not the same as an antecedent of an existing conditional but with a conflicting consequent? Not exactly.

     - A more feasible step: We require that for any two conditionals that share the same consequent and whose antecedents are mutually exclusive and exhaustive, the prices must satisfy the law of total probability (within a tolerance). But note: we might not have such pairs.

     - Alternatively, we might do nothing in the 20-minute window and rely on periodic book checks (which might be a separate process). However, the procedure must be run per contract.

     - We decide: for the purpose of this procedure, we will not do a full book check (due to time). Instead, we note that the book may become incoherent and we rely on periodic (e.g., daily) coherence checks by a separate team. Therefore, the per-contract procedure does not include a full book check but does include a check of the immediate dependencies (like the price of A and the price of A and B).

     - We require that for the antecedent events (and their relevant conjunctions) we have prices in the market. If not, we might need to list those events first? Or decline until they are available.

  Step 7: Where to stop and hand to a person:
     - When the contract form is not covered by the above (e.g., a compound conditional that cannot be simplified).
     - When the antecedent has zero probability and we have no house policy for that.
     - When the contract involves a new structure that we haven't encountered (e.g., a conditional with a conditional as consequent but without import-export).
     - Also, when the contract is of a form that we have a house policy to decline (like compound conditionals with mixed antecedents).

  Summary of the decision procedure:

  1. Parse the contract to determine its logical form:
     a. Simple conditional: "if A then B" (where A and B are non-conditional)
     b. Nested conditional: "if A, then (if B, then C)"
