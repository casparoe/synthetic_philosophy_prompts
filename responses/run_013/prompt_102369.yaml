     a. Check that P(A) > threshold (e.g., 0.001 or the market price of A is above a minimum). If not, decline (unless house policy says otherwise).
     b. Set price = P(B|A). The interval can be set by the bid-ask spread of the contracts for A and for A∧B? Actually, we have:
          P(B|A) = P(A∧B) / P(A)
          So if we have market prices for A and for A∧B, then we can compute the price and also an interval by error propagation.
          Alternatively, we might have a direct market for the conditional? But we are assuming we don't.

     c. If we don't have prices for A and A∧B, then we might need to list them first? Or decline until they are available.

  3. For nested conditionals (without explicit import-export):
