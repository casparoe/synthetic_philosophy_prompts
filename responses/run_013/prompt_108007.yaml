prompt: |-
  I've been reading a fair amount of comparative constitutional design lately — partly for work, partly because I've spent too many evenings in comment sections arguing about it — and I keep coming away with the nagging sense that the presidentialism-versus-parliamentarism debate, as it's usually posed, is arguing about the wrong variable. I can't tell whether that's a genuine insight or just the familiar sensation of having read enough blog posts to mistake contrarianism for clarity, so I'd like you to help me think it through in a form that has actual stakes. A friend of mine sits on the advisory panel for a constitutional assembly in a country that has just come out of roughly three decades of single-party rule — a negotiated transition, not a collapse — and the panel has about two years, three full-time staff, and, crucially, no realistic opportunity to reopen the design after ratification. They've asked me, as the resident philosophy person, to help them set an agenda rather than assemble a wish list of institutions.

  So here is what I want from you: within the debate over how executive and legislative power should be related, which open questions actually matter most for people in that position, and in what order should they take them up? I care much less about the final ranking than about the reasoning behind it — for each candidate, what makes it upstream of the others, how much of it is a conceptual question that political theorists can make progress on in a couple of years rather than an empirical one that requires decades of data from countries that aren't this one, how neglected it is relative to how much it matters, and what would move it up or down the list. To make this concrete, I want you to take seriously a framing a colleague has been pushing, which I'll state in my own words and which I don't think maps cleanly onto any standard position. The proposal is that the usual axis bundles together two things that ought to be separated: (a) whether the executive's survival in office depends on retaining legislative confidence, and (b) whether the legislature's survival depends on the executive's forbearance about dissolution. On this view the design variable that actually matters is the asymmetry between those two — who holds the cheaper unilateral exit option, and what it costs them to use it — and the pathologies commonly attributed to presidentialism or to parliamentarism are really pathologies of asymmetric exit costs in one direction or the other. I suspect this is at least half wrong, but I want the ranking built in a way that would reveal whether it is.

  Please give me a defended agenda rather than a survey: a ranked shortlist of perhaps four or five questions, with the criteria you're using stated explicitly, the trade-offs between those criteria acknowledged, and an honest account of which questions the literature treats as central but which are red herrings for this particular purpose — where more philosophical work simply won't change anything a drafter could act on. I'd also like the shortlist to say which items are genuinely conceptual and which are irreducibly empirical, and to flag the sub-questions that are weedy enough to be worth a philosopher's time but not so weedy that no one outside the seminar room cares — things like the design of caretaker periods between the fall of a government and the seating of its successor, whether a no-confidence motion should be required to name a replacement, whether election timing should be fixed or contingent, how much discretion a head of state should have in appointing a formateur, and whether the link between budget failure and loss of confidence should be formalized. Finally, tell me what evidence over the next two or three years would most change the ordering, and which single question, if it turned out one way rather than another, would reorganize the rest.
reasoning: |-
  Okay, the user is deeply engaged in constitutional design and presents a complex scenario. They're advising a panel for a country transitioning from single-party rule, with real-world constraints like no reopening after ratification. Their core frustration is that the presidentialism vs. parliamentarism debate misses the mark, and they're drawn to a colleague's framing about exit cost asymmetry. 

  Hmm, what's really underneath this? First, they need actionable priorities, not academic debates. The stakes are high—this constitution can't be revised. Second, they're subtly asking for validation of their suspicion that exit asymmetry is key, but want it tested rigorously. Third, there's unspoken anxiety: as a philosopher, they must deliver practical wisdom, not just theory. 

  The colleague's asymmetry theory feels fresh but risky. If I were in their shoes, I'd worry about overlooking cultural legacies like the outgoing party's lingering influence. Also, "negotiated transition" implies elites might game any exit rules. 

  Right, so the agenda must: 
  - Tackle irreversible choices first (like dissolution powers) 
  - Separate empirical vs. philosophical questions clearly 
  - Flag where local context trumps theory (e.g., distrust thresholds) 
  - Pressure-test the asymmetry hypothesis by making it falsifiable 

  *Pausing*—the budget-confidence link example is telling. They included it because in single-party systems, budget holdups often mask power struggles. That's locally salient, not academic. 

  *Biggest trap to avoid*: Spending two years debating fixed vs. flexible election timing when the real issue is whether elites can force elections to reset negotiations. The ranking should surface that. 

  *Evidence that would reshuffle priorities*: If early consultations reveal the outgoing party demands veto powers over dissolution, that elevates Question 1 (dissolution asymmetry) from theoretical to existential. 

  *One irreplaceable insight*: For countries with dominant parties, the cheaper exit option must not become a weapon. So the "cost" in exit asymmetry isn't just procedural—it's about who retains patronage networks after an exit. Literature rarely addresses that.
answer: |-
  Here’s a defended agenda for prioritizing constitutional design questions, tailored to your constraints (non-reopenable constitution post-ratification, 30-year single-party legacy, negotiated transition). The ranking prioritizes **irreversible structural choices** over adjustable details, emphasizes **asymmetric exit cost risks**, and separates conceptual/empirical questions where theory can add unique value.  

  ### Core Criteria for Ranking:
  1. **Irreversibility**: Can this be amended later without constitutional crisis?  
  2. **Pathology Severity**: Risk of democratic backsliding, deadlock, or authoritarian recidivism.  
  3. **Conceptual Tractability**: Can philosophy/political theory resolve it in 2 years?  
  4. **Context Sensitivity**: How much does it depend on *this country’s* social/political facts?  
  5. **Asymmetry Test**: Does it reveal whether exit cost imbalance is the key variable?  

  ---  
  ### Ranked Agenda (Top 5 Questions)  
  #### **1. Who controls dissolution of the legislature?**  
     - **Why upstream?**  
       - Determines whether elections are predictable (fixed terms) or contingent (executive/legislative discretion). Shapes all bargaining dynamics.  
       - Directly tests your colleague’s thesis: If dissolution is cheap for one branch but costly for the other, it creates structural winners/losers (e.g., executives forcing elections to reset opposition).  
       - *Irreversible*: Locking in dissolution rules risks entrenching elite cartels or enabling executive coups via snap elections.  
     - **Sub-questions to resolve**:  
       - Can the executive dissolve the legislature unilaterally? Only after no-confidence? Never?  
       - Does the legislature have self-dissolution powers?  
       - *Caretaker period design*: Critical to prevent abuse during transitions.  
     - **Conceptual vs. Empirical**:  
       - Conceptual: Philosophers can model trade-offs between stability (fixed terms) and accountability (flexible dissolution).  
       - Empirical: Requires local data on party system fragmentation (e.g., highly fragmented legislatures + easy dissolution = chaos).  
     - **Neglected but vital**: Literature obsesses over "no-confidence" but neglects dissolution asymmetry. In post-authoritarian states, dissolution powers often become tools for sidelining opponents.  

  #### **2. What triggers loss of executive confidence?**  
     - **Why second?**  
       - Defines the cost of legislative "exit" from the executive. Overly broad triggers (e.g., any bill failure = no-confidence) risk chronic instability; overly narrow ones invite executive tyranny.  
       - Tests the *reverse asymmetry* in your colleague’s model: Can the legislature eject the executive easily, or is it prohibitively costly?  
       - High *pathology severity*: Vague triggers incentivize brinksmanship (e.g., budget standoffs causing shutdowns).  
     - **Sub-questions**:  
       - Must no-confidence motions name a replacement? (Reduces frivolous motions; raises bar for opposition coordination.)  
       - Is budget failure automatically a confidence issue? (Crucial for post-single-party states where budgets fund patronage networks.)  
     - **Conceptual vs. Empirical**:  
       - Conceptual: Clarity in defining "confidence" (e.g., must it be explicit? Can it be implied?).  
       - Empirical: Depends on party discipline (e.g., naming replacements works only with coherent oppositions).  
     - **Red herring alert**: Parliamentary vs. presidential *labels* matter less than the *procedure* for removing leaders. Focus on mechanism design.  

  #### **3. How is the head of state/govt appointed?**  
     - **Why third?**  
       - Appointment rules determine whether the executive is a product of legislative bargaining (parliamentary) or independent (presidential/semi-presidential).  
       - *Asymmetry test*: Appointment shapes whose "exit" matters most. An independently elected president can dissolve legislatures; a figurehead president cannot.  
       - *Pathology risk*: Post-single-party transitions often see dominant parties manipulating appointment rules to retain veto power.  
     - **Sub-questions**:  
       - What is the head of state’s role in appointing the PM? (Discretion vs. ceremonial.)  
       - Are runoff elections required? (Prevents minority winners in fractured societies.)  
     - **Conceptual vs. Empirical**:  
       - Conceptual: Philosophers can define "legitimacy thresholds" for executive mandates.  
       - Empirical: Requires knowing if one party dominates post-transition (e.g., dominant parties + presidentialism = authoritarian relapse).  
     - **Why not higher?** Appointment rules can be adjusted post-ratification (e.g., via electoral law changes).  

  #### **4. Are elections temporally linked?**  
     - **Why fourth?**  
       - Decouples from Q1–Q3: Asks whether executive/legislative terms are synchronized.  
       - *Asymmetry insight*: Desynchronized elections make "exit" cheaper for voters but risk perpetual campaigning.  
       - *Pathology*: Synced elections reduce accountability; desynced ones cause cohabitation chaos (e.g., France vs. US).  
     - **Sub-questions**:  
       - Fixed terms vs. flexible (within limits)?  
       - Grace periods after no-confidence?  
     - **Conceptual vs. Empirical**:  
       - Conceptual: Balancing democratic responsiveness against stability.  
       - Empirical: Turnout/accountability data from comparable states.  
     - **Neglected**: Rarely debated as a *systemic* variable, but it determines how often elites face voters.  

  #### **5. What is the default state during interbranch conflict?**  
     - **Why last?**  
       - Sets "crisis protocols" for deadlock (e.g., automatic elections, technocratic caretakers).  
       - *Asymmetry test*: Reveals whose exit costs are socialized (e.g., caretaker govts favor executive continuity).  
       - *Pathology*: Unregulated conflicts risk military/technocratic coups in fragile democracies.  
     - **Sub-questions**:  
       - Can budgets/essential services continue under caretakers?  
       - Who controls the security apparatus during transitions?  
     - **Conceptual vs. Empirical**:  
       - Conceptual: Defining "essential state functions."  
       - Empirical: Military/civil service loyalty in this specific context.  

  ---  
  ### Critical Omissions (Red Herrings for Your Purpose):  
  - **Presidentialism vs. Parliamentarism**: The binary obscures exit asymmetry, which is the key variable.  
  - **Electoral systems (PR vs. FPTP)**: Adjustable via statute; not constitutionally locked.  
  - **Judicial review**: Important but peripheral to executive-legislative dynamics.  

  ---  
  ### What Would Change the Ranking?  
  - **Evidence of party system fragility**: If early elections show extreme fragmentation, Q1 (dissolution rules) jumps to #1.  
  - **Outgoing elite strength**: If the ex-ruling party retains influence, Q3 (appointments) becomes critical to block veto points.  
  - **Public trust deficits**: Low trust elevates Q5 (crisis protocols) to prevent constitutional hardball.  

  **The Pivotal Question**: If **Q1 (dissolution control)** resolves toward **executive unilateralism**, it reorganizes the entire agenda: Q2–Q5 must then prioritize constraints on executive power. Conversely, if legislatures control dissolution, Q2 (confidence triggers) becomes paramount to prevent legislative tyranny.  

  **Why this agenda works for your colleague’s thesis**: It treats exit costs as the master variable. If asymmetric exits (e.g., executives can dissolve legislatures easily but legislatures cannot remove executives) correlate with democratic failures in your context, the thesis gains credence. If not, the ranking reveals where other factors (e.g., appointment legitimacy) dominate.  

  ---  
  **Final note**: Philosophers add most value on Q1, Q2, and Q5—designing *procedures* to balance exit options. For Q3–Q4, insist on local empirical diagnostics (e.g., polling elites on acceptable appointment rules). Prioritize drafting articles that are **crisis-proofed**, not just ideal.
