prompt: |-
  I chair the research ethics committee of a mid-sized NHS trust. We meet once a month for two hours, roughly fifteen minutes an application, and decide whether each study before us may proceed, may proceed subject to amendments, or must be refused. Our decisions are recorded, summarised publicly, and can be appealed to the trust board, so a mistaken approval can expose patients to harm and a mistaken refusal can stop research that would have helped them. There are twelve of us: clinicians from several specialties, a statistician, a pharmacist, a lawyer, two lay members and a research nurse. Attendance is uneven; I decide when to cut off discussion and put something to a vote.

  A colleague recently told me that Condorcet's jury theorem shows that where each member is more likely than not to get a question right, and members form their views independently, a majority of a body like ours is overwhelmingly likely to be right, and that this is the real justification for what we do. I am not convinced, and I would rather have a procedure than a justification. I have also heard two claims I cannot square with each other or with the theorem as it was explained to me: that adding a member helps only if that member is better than a coin toss on the question actually before us, and that where one member is far more reliable than the rest the best rule may be to follow that member alone. I do not know what either would mean for lay members voting on a statistical question, or for the fact that two of my members trained in the same department and work from the same risk-assessment template.

  Please write a procedure my committee could actually run on an application. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a refusal, and where it must stop and hand the decision to me as chair, or back to the committee as a matter of policy rather than of fact, because the question is one of values rather than of truth. It should say how many members should vote, whether votes count equally, whether we should poll members in writing before discussion and again afterwards, when unanimity is required and when a simple majority will do, how abstentions are treated, and what we should minute so that the record is honest about which parts of a decision were findings and which were choices.

  It must also handle three things that happen to us regularly: applications with more than two possible verdicts; applications where we agree on every factual point but disagree on the verdict, or disagree on the facts but agree on the verdict; and members whose expertise is beside the point, or worse than useless, on the question being put, such as the lay member asked to judge a sample-size calculation or the statistician asked to judge whether a consent conversation would feel coercive.

  Then run the procedure on three applications: a first-in-human trial of a device in children, in which the risk estimate is contested and the members disagree about the statistics; a study that is methodologically sound and low-risk but duplicates research already done; and a study whose science is sound but which requires deceiving participants. Include at least one case where the procedure gives an answer I will not like.

  Finally, tell me what the procedure cannot do: the questions it will not settle, and the cases where I should stop treating the committee's verdict as a finding rather than a decision. No citations or reading lists, please; this has to be usable by members with no training in any of it, and written in British English.
reasoning: |-
  We are designing a procedure for a research ethics committee (REC) that must handle complex decisions with multiple facets, varying expertise, and the need to separate factual judgments from value judgments. The procedure should be robust, transparent, and practical for a monthly meeting with time constraints.

   Core principles:
   1. The committee must make decisions that are both ethically sound and legally compliant.
   2. The procedure should encourage independent thought but also allow for discussion to clarify issues.
   3. We must recognize that not every member is equally competent on every issue, and the procedure should account for that without unduly discounting any member's input.
   4. The procedure must handle cases of disagreement on facts vs. verdict, and cases where expertise is mismatched to the question.
   5. The goal is to have a clear record of what was decided and why, distinguishing factual findings from value-based decisions.

   Procedure Outline:

   I. Pre-meeting:
      - Applications are circulated in advance. Members are expected to review and form preliminary views.
      - For each application, the chair (or a designated member) identifies the key questions that need to be answered. These questions are grouped into:
          a) Factual questions (e.g., statistical validity, risk estimates, methodological soundness)
          b) Ethical/value questions (e.g., whether the risk-benefit balance is acceptable, whether deception is justified)

   II. During the meeting:

   Step 1: Presentation and Clarification (5 minutes per application)
      - The lead reviewer (a committee member assigned in advance) presents the application and highlights key points.
      - The committee can ask factual questions to the lead reviewer or to any expert member (e.g., the statistician for statistical questions).

   Step 2: Independent Voting on Key Questions (5 minutes)
      - The chair reads out each key question (both factual and ethical) one by one.
      - For each question, members vote independently and in writing (to avoid influence) on a scale of:
          - Agree
          - Disagree
          - Abstain (only if they feel they cannot form a judgment due to lack of expertise or information)
      - The chair collects the votes and records them, but does not reveal the results until after discussion.

   Step 3: Discussion (10 minutes per application, flexible as per chair's discretion)
      - The chair leads a structured discussion on each key question, starting with the one that had the most disagreement in the independent vote.
      - Members are encouraged to share their reasoning, especially those with relevant expertise.
      - The chair ensures that all perspectives are heard and that the discussion remains focused.

   Step 4: Final Voting on Key Questions and Overall Verdict (5 minutes)
      - After discussion, the chair re-puts each key question for a vote (again in writing). This vote is on the same scale: Agree, Disagree, Abstain.
      - Then, the committee votes on the overall verdict (in writing) with three options:
          - Approve
          - Approve with amendments (specify the required amendments)
          - Refuse
      - The chair may also call for a vote on amendments if necessary.

   Step 5: Determination of the Outcome
      - For factual questions: 
          - A simple majority of non-abstaining members determines the answer. 
          - If there is a tie, the chair may break the tie (if the chair has not already voted) or the question is marked as unresolved and the committee must revisit it (if time) or defer the application.
      - For ethical/value questions: 
          - These are inherently matters of judgment. The committee must reach a majority view (simple majority of non-abstaining members). 
          - However, if the committee is split on a key ethical question that is central to the verdict, the chair may note the split and the overall verdict may be determined by the majority of the overall verdict vote.
      - Overall verdict:
          - A simple majority of non-abstaining members on the overall verdict vote determines the outcome.
          - However, if the overall verdict vote results in a tie, the chair has the casting vote.
      - Abstentions: 
          - For any vote (on questions or verdict), an abstention means the member does not express a view and is not counted in the total for majority calculation. 
          - However, at least half of the non-abstaining members must vote (i.e., quorum for the vote is half the members present).

   Step 6: Handling Special Cases
      a) Applications with more than two verdicts: The three-option overall verdict (Approve, Approve with amendments, Refuse) is already accommodated. The committee votes on these three. If there is no majority (e.g., three options each getting one-third), then the chair may break the tie by ranking the options (e.g., Refuse is the most restrictive, then Approve with amendments, then Approve) and choosing the option that is the most restrictive if the tie remains after a second vote.

      b) Agreement on facts but disagreement on verdict: This is common when the facts are clear but the ethical interpretation varies. The independent votes on key ethical questions will reveal the split. The discussion should focus on the ethical reasoning. The overall verdict vote then resolves the disagreement by majority.

      c) Disagreement on facts but agreement on verdict: The factual disagreement may not be material if the overall verdict is clear. However, the committee must record the factual disagreement and note that the verdict is based on one of the factual interpretations. If the factual disagreement is critical (e.g., risk level), the committee may require further information and defer.

      d) Members with mismatched expertise: 
          - In the independent voting, members are allowed to abstain if they feel they cannot judge. 
          - The chair may, in the discussion phase, explicitly call on members with relevant expertise to speak first and more extensively. 
          - However, every member has the right to vote on every question. The procedure does not weight votes by expertise because that would be impractical and might undermine the committee's democratic nature. Instead, the discussion is meant to inform all members so that they can form a more educated vote.

      e) Members who are not independent (e.g., trained in same department): The chair should note potential conflicts and ask those members to declare any. If a conflict exists, they should abstain. Otherwise, they are allowed to vote. The independent written vote before discussion helps mitigate groupthink.

   III. Post-meeting:
      - The minutes will record:
          - The key questions (both factual and ethical) that were posed.
          - The independent pre-discussion vote and the post-discussion vote for each key question.
          - The overall verdict vote.
          - The reasoning for the verdict, highlighting which parts were based on factual findings (with the vote counts) and which on value judgments (with the vote counts).
          - Any dissenting views that a member wishes to have recorded.

   IV. When the procedure stops and hands the decision to the chair or committee for policy reasons:
      - The committee is responsible for making the overall verdict based on the key questions. 
      - However, if after the procedure there remains an unresolved factual dispute that is critical and cannot be deferred, the chair may rule that the application is refused on the grounds of insufficient information (with a clear path for resubmission).
      - For value judgments, the committee's majority vote is binding. But if the split is very close (e.g., 6-5) and the issue is of high importance (e.g., a novel ethical dilemma), the chair may note the split and refer the matter to the trust board for guidance (but this should be rare).

   V. Limitations of the procedure:
      - The procedure cannot guarantee that every decision is correct. It is designed to be robust and transparent, but human error and bias remain possible.
      - It cannot replace expertise: if the committee lacks the necessary expertise (e.g., no statistician present for a statistical question), the chair should defer the application until that expertise is available.
      - It does not eliminate the risk of groupthink, but the independent voting helps.
      - It may not be suitable for highly technical disputes that require deep analysis beyond the committee's capacity. In such cases, the committee should seek independent expert advice.
      - The procedure does not override the need for the committee to consider the application in the context of current guidelines and law.

   Now, we run the procedure on three applications:

   Application 1: First-in-human trial of a device in children, with contested risk estimates and disagreement on statistics.

   Key Questions (prepared by chair in advance):
      F1: Is the statistical analysis plan sound? (factual)
      F2: Are the risk estimates for serious adverse events in children based on the best available evidence? (factual)
      E1: Do the potential benefits of the device outweigh the risks, given the population? (ethical)
      E2: Are the measures to monitor and mitigate risks adequate? (factual/ethical blend)

   Procedure:
      Step 1: Lead reviewer (a paediatrician) presents.
      Step 2: Independent vote on F1, F2, E1, E2. Results (10 members present):
          F1: 3 Agree, 5 Disagree, 2 Abstain (including the lay members)
          F2: 4 Agree, 4 Disagree, 2 Abstain
          E1: 2 Agree, 6 Disagree, 2 Abstain
          E2: 3 Agree, 5 Disagree, 2 Abstain

      Step 3: Discussion focuses on F1 and F2. The statistician explains the concerns about the statistical plan. The clinician who is an expert in the device area presents evidence on risk estimates. The two lay members ask clarifying questions. The lawyer raises regulatory requirements.

      Step 4: Final vote on key questions:
          F1: 2 Agree, 7 Disagree, 1 Abstain -> Disagreed
          F2: 3 Agree, 6 Disagree, 1 Abstain -> Disagreed
          E1: 1 Agree, 8 Disagree, 1 Abstain -> Disagreed
          E2: 2 Agree, 7 Disagree, 1 Abstain -> Disagreed

      Overall verdict vote:
          Approve: 0
          Approve with amendments: 2 (but note key questions are all negative)
          Refuse: 8

      Outcome: Refuse. The minutes record that the refusal is due to concerns about the statistical plan and risk estimates (factual findings) and the risk-benefit balance (ethical judgment). The lay members abstained on the factual questions but voted on the ethical ones.

   Application 2: Methodologically sound and low-risk but duplicates research already done.

   Key Questions:
      F1: Does the study duplicate existing research? (factual)
      F2: Is the methodology sound? (factual)
      E1: Is the duplication justified (e.g., by need for replication, or specific population)? (ethical)
      E2: Is the risk to participants sufficiently low? (factual)

   Procedure:
      Step 1: Lead reviewer (research nurse) presents. Notes that a similar study was published last month.
      Step 2: Independent vote (12 members present):
          F1: 12 Agree, 0 Disagree, 0 Abstain -> Agreed (it duplicates)
          F2: 10 Agree, 0 Disagree, 2 Abstain (lay members) -> Agreed
          E1: 3 Agree (justified), 8 Disagree, 1 Abstain
          E2: 12 Agree, 0 Disagree, 0 Abstain -> Agreed

      Step 3: Discussion: Focus on E1. Those who think it is justified argue that replication is needed. Others say it is wasteful and burdens participants unnecessarily.

      Step 4: Final vote on key questions:
          F1: 12 Agree -> Agreed
          F2: 12 Agree -> Agreed
          E1: 2 Agree, 10 Disagree -> Disagreed (duplication not justified)
          E2: 12 Agree -> Agreed

      Overall verdict vote:
          Approve: 0
          Approve with amendments: 0
          Refuse: 12

      Outcome: Refuse. The minutes note that while the study is sound and low-risk, the duplication is not justified. This is a value judgment (E1) that the committee decided by majority.

   Application 3: Study with sound science but requiring deceiving participants.

   Key Questions:
      F1: Is the scientific methodology sound? (factual)
      F2: Is the deception necessary to achieve the research objectives? (factual)
      E1: Is the deception ethically justifiable by the potential benefits of the research? (ethical)
      E2: Are there adequate plans to debrief participants? (factual)

      Step 1: Lead reviewer (a clinician and the research nurse) presents. The deception involves misleading participants about the true purpose of the study.

      Step 2: Independent vote (10 members present):
          F1: 9 Agree, 0 Disagree, 1 Abstain (a lay member) -> Agreed
          F2: 7 Agree (necessary), 2 Disagree, 1 Abstain -> Agreed (majority)
          E1: 4 Agree, 5 Disagree, 1 Abstain -> No majority (but note: Disagree leads)
          E2: 10 Agree -> Agreed

      Step 3: Discussion: Focus on E1. The lay members express concern about deception. The clinician argues that the research is important and the deception is mild. The lawyer notes that deception is permitted under certain conditions.

      Step 4: Final vote on key questions:
          F1: 9 Agree, 0 Disagree, 1 Abstain -> Agreed
          F2: 8 Agree, 1 Disagree, 1 Abstain -> Agreed
          E1: 5 Agree, 4 Disagree, 1 Abstain -> Agreed (by one vote)
          E2: 10 Agree -> Agreed

      Overall verdict vote:
          Approve: 6
          Approve with amendments: 2 (suggesting more safeguards)
          Refuse: 2

      Outcome: Approve (since majority is for Approve). However, note that the ethical question E1 was very close. The chair may note in the minutes the close vote on E1 and the importance of monitoring the deception aspect during the study.

      This is a case where the chair might not like the outcome (if the chair is uncomfortable with deception) but the procedure has spoken.

   What the procedure cannot do:
      - It cannot resolve deep disagreements about fundamental values. In such cases, the committee must vote and the majority rules, but the chair may note the need for a policy review by the trust.
      - It cannot replace missing expertise. If critical expertise is absent, deferral is necessary.
      - It does not eliminate the possibility of error, but it does create a transparent record that can be reviewed and appealed.
      - It cannot make decisions on matters beyond the committee's remit (e.g., funding, which is not an ethics issue).
      - It does not absolve the committee from the responsibility of continuous learning and training.

   The procedure is designed to be run by members without special training. The chair must be firm on time and structure.

   British English note: We have used "minutes" (record of meeting), "trust" (NHS trust), "lay members" (non-experts), "paediatrician", etc.
answer: |-
  ### Research Ethics Committee Decision Procedure  
  **Designed for clarity, robustness, and transparency. Uses British English.**

  ---

  #### **Procedure Steps**  
  1. **Pre-Vote Written Poll (3 minutes per application)**  
     - **Action**: Distribute slips asking:  
       *"On the facts before us, should this study: A) Proceed as submitted, B) Proceed with amendments, or C) Be refused?"*  
     - **Rules**:  
       - All 12 members vote anonymously in writing.  
       - Abstentions permitted only if member declares: *"I lack expertise to judge core aspects."*  
       - **Sufficient answer**: Clear tick for A, B, C, or "Abstain."  

  2. **Structured Discussion (10 minutes per application)**  
     - **Chair’s role**: Pose questions in strict order:  
       1. *"Are there any factual errors in the application?"* (e.g., statistical flaws, safety misstatements).  
          - **Stop for refusal** if >50% of non-abstaining members agree on a *critical* error (e.g., risk underestimated, consent process unlawful).  
       2. *"Does the study meet regulatory standards?"* (e.g., GCP, NHS protocols).  
          - **Stop for refusal** if majority agrees it breaches standards.  
       3. *"What is the risk-benefit balance?"*  
          - **Hand to chair** if disagreement is value-based (e.g., "Is this risk to children justified by potential benefit?").  
       4. *"Are there ethical concerns beyond compliance?"* (e.g., deception, duplication, social value).  
          - **Hand to committee for policy vote** (Step 3).  
     - **Expertise management**:  
       - Members may flag: *"I defer to [specialist] on this point."* (e.g., lay member defers to statistician on sample size).  
       - Chair may exclude inputs if clearly "worse than useless" (e.g., lawyer opining on clinical risks after statistician’s correction).  

  3. **Final Vote (2 minutes per application)**  
     - **Options**: Approve (A), Approve with amendments (B), Refuse (C).  
     - **Voting rules**:  
       - **Quorum**: Minimum 7 members must vote (excluding abstentions).  
       - **Weight**: All votes equal. No member’s vote discarded.  
       - **Majority**:  
         - Simple majority for A/B/C.  
         - Unanimity required if:  
           - Study involves high-risk populations (e.g., children, incapacitated adults).  
           - Deception or significant privacy intrusion is proposed.  
       - **Abstentions**: Not counted in majority calculation but minuted.  

  4. **Recording Decisions**  
     - **Minutes must distinguish**:  
       - *Findings*: *"The committee found the risk estimate flawed (vote: 8-2)."*  
       - *Choices*: *"The committee chose to refuse based on social value (vote: 6-4)."*  
     - **Appeals note**: *"Verdict reflects majority view; dissents minuted."*  

  ---

  #### **Handling Common Issues**  
  - **>2 verdicts?** Use A/B/C vote. If tied, chair breaks tie (ranking: Refuse > Amend > Approve).  
  - **Agree on facts, disagree verdict?** Vote forces resolution. E.g., *"Facts show low risk, but 7 members refuse on value grounds."*  
  - **Disagree facts, agree verdict?** Record factual disputes but uphold verdict. E.g., *"Risk contested (5-5), but all refuse for poor consent design."*  
  - **Mismatched expertise?** Abstentions permitted in pre-vote. In discussion, chair silences off-topic inputs (e.g., *"We’ve heard the statistician; let’s focus on consent."*).  
  - **Non-independent members?** Chair notes: *"Dr X and Y shared views; treated as one input."*  

  ---

  #### **Procedure in Action**  
  **Case 1: First-in-Human Device Trial in Children**  
  - **Pre-vote**: 3 Approve, 5 Refuse, 4 Abstain (lay members abstain; statistician/clinicians split).  
  - **Discussion**:  
    - Factual error? Statistician shows risk model flawed. Paediatrician disagrees. Vote: 6-4 *"flawed"* → not critical (no refusal).  
    - Risk-benefit? Chair rules *value choice*. Handed to committee.  
  - **Final vote**: Unanimity required (children). Vote: 7 Refuse, 3 Amend, 2 Abstain → **Refused** (not unanimous).  
  - **Record**: *"Finding: Risk model contested (6-4). Choice: Refused due to unmitigated risk to children (majority)."*  

  **Case 2: Methodologically Sound but Duplicative Study**  
  - **Pre-vote**: 2 Approve, 8 Refuse, 2 Abstain (pharmacist, nurse abstain).  
  - **Discussion**:  
    - Ethical concern? All agree duplication proven (fact). Social value? Chair declares *policy choice*.  
  - **Final vote**: Simple majority. Vote: 9 Refuse, 1 Approve → **Refused**.  
  - **Record**: *"Finding: Duplicates Smith et al. 2023 (11-0). Choice: Refused for low social value (9-1)."*  

  **Case 3: Sound Science but Deception Required**  
  - **Pre-vote**: 4 Approve, 4 Refuse, 4 Abstain (statistician/lay members abstain).  
  - **Discussion**:  
    - Ethical concern? Lawyer confirms deception legal but ethically charged. Chair declares *value choice*, requires unanimity.  
  - **Final vote**: Vote: 5 Approve, 5 Refuse, 2 Abstain → **No unanimity; chair’s casting vote**. Chair refuses.  
  - **Record**: *"Finding: Methodology sound (10-0). Choice: Refused due to deception (chair’s casting vote)."*  
  - **Chair’s dislike**: You may support the science, but procedure binds you.  

  ---

  #### **What the Procedure Cannot Do**  
  1. **Resolve value conflicts**: When votes split near-evenly (e.g., 6-5), it records a *choice*, not truth.  
  2. **Override expertise gaps**: If >3 members abstain pre-vote for lack of expertise, defer application.  
  3. **Fix flawed evidence**: If critical facts are contested and irreconcilable (e.g., warring statisticians), verdict defaults to *Refuse* pending new data.  
  4. **Replace chair’s judgment**:  
     - You must intervene if:  
       - Discussion drifts from the question sequence.  
       - A member dominates or is silenced unfairly.  
       - The vote clashes with fundamental rights (e.g., *"Majority approved unlawful consent."* → chair overrules).  
  5. **Handle "no right answer"**: Some ethical dilemmas (e.g., "Is deceiving for dementia research ever OK?") yield policy choices. The procedure exposes this; it doesn’t solve it.  

  ---  
  **Final Note**: This procedure ensures every voice is heard but forces a decision. It treats the committee as a *decision-making body*, not a truth-seeking jury. When values clash, the vote is minuted as a choice—not a finding—to honour the appeal process.
