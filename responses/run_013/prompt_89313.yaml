  Okay, let me try to figure out what this user is really asking. They're an amateur without formal training in history or archaeology, but they're clearly thoughtful about distinguishing legitimate historical revision from pseudohistory. They've observed their friend's past verdicts on various historical claims and now want to predict how the friend would judge a new case. The core question is about identifying the underlying rule their friend uses—method versus consensus.

  First, I need to analyze the friend's previous verdicts. Looking at Atlantis: rejecting the advanced civilization as pseudohistory but accepting the search for a Bronze Age catastrophe. That suggests the friend values evidence and methodology over the claim's popularity. Ancient aliens and pyramid builders are dismissed as pseudohistory, likely due to lack of evidence and reliance on sensationalism. The Norse arrival in North America was once fringe but now accepted, showing that consensus isn't the deciding factor; it's the strength of evidence. Holocaust denial is pseudohistory, which probably hinges on overwhelming evidence contradicting it, not just consensus.

  The Library of Alexandria myth isn't pseudohistory because it's a simplification, not a claim based on bad methods. Forged documents being legitimate history when challenged points to methodological rigor even against consensus. The Dark Ages not being uniformly dark is accepted because of solid evidence. Peer-reviewed lost city findings are legitimate, while amateur satellite claims are pseudohistory—here, method and peer review are key.

  Now the new case: a credentialed archaeologist publishes a peer-reviewed article reinterpreting an ancient city as a seasonal camp. The argument is methodologically sound but contradicts specialist consensus. The friend hasn't read it but knows the description. 

  The user suggests two possible rules: one based on method (evidence, falsifiability, peer review), the other on consensus. Most of the friend's past decisions align with methodological rigor. For instance, the Norse example shows that even once-dismissed ideas can become legitimate with evidence, regardless of past consensus. Peer review is a recurring factor in the lost city case. The Dark Ages example also emphasizes evidence over outdated consensus.

  The closest precedent here is the "forged documents" case. Challenging consensus with careful methodology was deemed legitimate. Similarly, the new case involves peer-reviewed work with standard evidence and engagement with counterarguments, fitting the method rule. Consensus rule would call it pseudohistory, but the friend's history suggests otherwise.

  To test which rule the friend uses, propose a scenario: a claim with strong consensus but methodologically weak. If the friend rejects it (e.g., poorly argued peer-reviewed paper), they prioritize method. If they accept it, they lean on consensus. Given the friend's past, they'd likely reject weak methods even with peer review.
answer: |-
  Based on your friend's established pattern of verdicts, here's a clear breakdown of how he would likely assess the new case and the rule he's applying:

  1.  **His Verdict on the New Case:** Your friend would almost certainly classify this as **Legitimate History**.
  2.  **The Rule He's Running:** Your friend primarily operates on a **Rule of Methodological Rigor**, *not* a Rule of Consensus.
      *   **Key Elements of His Rule:**
          *   **Evidence & Methodology:** Does the claim use standard, verifiable evidence? Is the argument careful, logical, and transparent?
          *   **Engagement:** Does it engage seriously with counterarguments and existing scholarship?
          *   **Peer Review:** Is the work subjected to formal academic scrutiny (peer review)?
          *   **Falsifiability:** Is the claim presented in a way that evidence could potentially disprove it (even if it hasn't been disproven yet)?
          *   **Consensus is NOT Determinative:** Consensus shows the *current state* of knowledge, but challenging it is not inherently illegitimate. Legitimate revision *requires* challenging consensus using proper methods.
      *   **Consensus is a Factor, Not the Rule:** While he acknowledges consensus (e.g., specialists disagree), his previous verdicts consistently show that consensus alone doesn't make a claim pseudohistorical if the methodological rigor is present (Norse in NA, Dark Ages complexity, challenging document authenticity). Conversely, consensus *lacking* rigor doesn't save a claim (ancient aliens, Atlantis advanced civ).

  3.  **Closest Precedent:** The **"claim that some ancient documents were forged is legitimate history, even when it challenges the consensus"** is the most direct precedent.
      *   **Why:** Both cases involve credentialed academics publishing peer-reviewed work that carefully uses standard evidence and engages counterarguments to challenge a prevailing expert consensus about a specific historical interpretation (authenticity of documents vs. nature of a site). He deemed the document forgery challenge legitimate based on method, regardless of consensus. This new case is structurally identical.

  4.  **Predictions Based on Each Rule:**
      *   **Rule of Method Prediction:** **Legitimate History.** The description explicitly states the argument is "careful, uses the standard evidence, and engages with the counterarguments" and is "published in a peer-reviewed article" by a "well-credentialed archaeologist." This hits all the methodological marks, regardless of the specialist consensus contradicting it.
      *   **Rule of Consensus Prediction:** **Pseudohistory.** The claim "contradicts almost every other specialist in the field." If consensus is the primary determinant, this overwhelming disagreement would make it pseudohistorical.

  5.  **The Test Case to Reveal His True Rule:** Propose a scenario involving **a methodologically *weak* claim that aligns with the *current consensus***.
      *   **The Case:** "A popular historian writes a bestselling book arguing the pyramids were built by paid laborers. The book relies heavily on outdated sources, makes sweeping claims without evidence, ignores significant counter-evidence about aspects of labor organization, misinterprets hieroglyphs, and dismisses recent archaeological findings. However, the core conclusion (paid laborers) aligns with the overwhelming consensus of Egyptologists."
      *   **Prediction if using Rule of Method:** **Pseudohistory.** Despite agreeing with consensus (and the core conclusion being factually correct), the *method* is terrible: bad evidence, cherry-picking, ignoring counterarguments, lack of rigor. His verdict on amateur satellite images vs. peer-reviewed lost city finds shows he prioritizes method over source *type* when flawed; here the flawed method would likely trigger a pseudohistory verdict even for a consensus view.
      *   **Prediction if using Rule of Consensus:** **Legitimate History (or at least "not pseudohistory").** Since the core claim matches the expert consensus, he might excuse the poor methodology as merely "bad popular history" rather than pseudohistory, especially since he distinguished the Library of Alexandria *myth* (simplification) from pseudohistory (false claim w/ bad method).
      *   **Likely Outcome:** Given his verdicts on ancient aliens (methodologically bankrupt, *even if* someone tried to argue it was consensus in some fringe group) and his emphasis on peer review/rigor, he would almost certainly call this popular book **pseudohistory** or at least deeply flawed to the point of being illegitimate *as history*, precisely *because* of its methodological failures, even though the headline conclusion is correct. This would confirm his commitment to the **Rule of Method.**

  **In summary:** Your friend values the *process* of historical inquiry – rigorous evidence, sound argumentation, peer review, and engagement with scholarship – far more than consensus as the arbiter of legitimacy. Challenging consensus using these rigorous methods *is* legitimate historical revision. The new case fits his criteria for legitimate history perfectly, following the precedent of legitimate challenges to document authenticity. To definitively confirm he prioritizes method over consensus, see how he judges a poorly argued, non-peer-reviewed work that *happens* to reach a consensus conclusion – he'll likely still dismiss it as pseudohistory due to its flawed methods.
