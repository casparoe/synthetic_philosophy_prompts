prompt: |-
  I'd like you to act as an expert in two fields at once: distributed systems engineering and the philosophy of biology, with a particular specialism in the debate over the definition of death. Please think carefully before you answer, and open with a short, openly exploratory brainstorm — the candidate correspondences you can see, including the ones you will end up rejecting — before you commit to a structured answer. I am a distributed-systems engineer with no formal training in philosophy, and I want to know what happens to this debate when it is restated in the vocabulary I actually use. Be rigorous about the translation: do not smuggle my framework's assumptions into the original and then present the result as a faithful rendering. Where you have to distort the philosophers to make the mapping work, flag it as a distortion rather than papering over it.

  Here is the material to be translated. Medicine and the law currently recognise at least three ways of saying what death is: the circulatory-respiratory standard (no heartbeat, no breathing); the whole-brain standard, which became prominent after a 1968 Harvard Medical School committee report proposed irreversible coma as a new criterion for death and which many jurisdictions now write into law; and a consciousness-based or higher-brain criterion, on which what matters is the irreversible loss of the capacity for consciousness rather than the death of the whole brain. At a more abstract level, the definition is often given as the irreversible loss of the integrated functioning of the organism as a whole, and the argument then turns on which subsystem is doing the integrating — the brainstem as the critical system, or something spread across the organism. Two further distinctions run through the debate: between irreversibility and permanence, that is, between 'cannot be brought back' and 'we have decided it will not be brought back'; and between treating death as an event and treating it as a process that a body can be partway through. As a concrete hinge, consider a patient declared dead on neurological grounds in one jurisdiction, whose family kept the body ventilated for years, and who was then declared dead a second time on circulatory-respiratory grounds in another jurisdiction.

  Now restate all of this in my vocabulary, position by position: failure detectors and their accuracy and completeness properties, fail-stop versus crash-recovery versus Byzantine failures, heartbeats, leases and timeouts, liveness versus safety, quorum and split-brain, fencing tokens, the impossibility of deterministically distinguishing a crashed process from a merely slow or partitioned one in an asynchronous system, graceful degradation, and the difference between a node that is gone and a node we have chosen to decommission. Say what each philosophical position becomes.

  Then give me the residue report, which is the part I care about most. Which claims translate cleanly? Which translate only with distortion? Which have no counterpart in my vocabulary at all? For each item of residue, tell me whether the failure is on my side — something distributed systems genuinely cannot express — or on theirs, a sign that the original claim was vaguer than it sounded. I am particularly interested in whether the normative weight of the debate, the idea that a corpse can be wronged or that a declaration of death is something we owe to a person, has any analogue in a domain where a human operator decides when to declare a node dead and is answerable only to an uptime target.

  Finish with a verdict on my own suspicion: that the whole disagreement is a failure-detector design problem, in which each proposed criterion is a different choice of accuracy and completeness class, and the only real question is which error we would rather make. Tell me whether that is right, and if it is not, exactly what my vocabulary is unable to see. Write in British English, avoid citations and reading lists, and rely only on what is in this prompt plus what you already know.
