  Tone: confident but not overpromising. Phrases like "this proposal argues" or "we hypothesize" keep it assertive yet open. And no citations—user will handle those. Solid.
answer: |-
  ## Project Proposal: The Friction Criterion - Distinguishing Norms from Regularities in the Archaeological Record

  **Project Title:** Tracing Obligation: Developing a Testable Criterion for Identifying Social Norms in Archaeological Data

  **Duration:** 6 Months  
  **Principal Investigator:** [Your Name/Title]  
  **Department:** [Your Department]  
  **Requested:** Seed Grant Funding  

  ### 1. The Core Question: Can We Objectively Distinguish Norms from Mere Regularities?
  Archaeology fundamentally seeks to understand past *minds* – beliefs, intentions, and obligations – through the *material* record. Yet, a persistent ambiguity plagues our interpretations: **When does a recurrent pattern in material culture (e.g., specific burial practices, pottery decoration styles, settlement layouts) reflect a shared social *norm* (an "ought" or "must not"), rather than merely a shared custom, practical convenience, or unintended by-product of technique?**

  This is not merely semantic. Attributing normativity without sufficient evidence risks projecting modern assumptions or misrepresenting past social dynamics. Conversely, failing to recognize genuine norms obscures the very fabric of social obligation that governed past lives. Our field often oscillates uneasily between describing what people *did* (regularities) and inferring what they *felt obliged* to do (norms), frequently blurring the lines. **This project asks: What specific, identifiable trace in the archaeological record provides a necessary and sufficient warrant for attributing a social norm, reliably distinguishing it from non-normative regularities?** We hypothesize that the key lies in evidence of "friction" – the cost of maintaining the regularity against potential alternatives or deviations.

  ### 2. Why Existing Methods Leave the Question Open
  Standard archaeological approaches for inferring meaning from objects struggle to definitively resolve this normative ambiguity:

  *   **Ethnographic Analogy:** While invaluable for generating hypotheses about *possible* meanings, analogy cannot confirm whether a *specific* past regularity *was* normative. Similar practices in different societies can stem from norms, practical constraints, or tradition without obligation.
  *   **Optimality & Behavioural Modeling:** These methods excel at identifying patterns that *could be* explained by efficiency, resource constraints, or evolutionary advantage. However, they often struggle to explain patterns that are *persistently sub-optimal* or *costly* to maintain – precisely where norms might be operating. They identify *why* something *could* be done, not *why* it *must* be done.
  *   **Formal Comparison of Rival Hypotheses (e.g., Bayesian approaches):** These are powerful for assessing the relative likelihood of different explanations *given the available data*. However, they depend critically on the quality and scope of the alternative hypotheses proposed. If the hypothesis "this was a norm" and "this was merely a custom" are not operationalized with distinct, testable archaeological signatures, formal comparison cannot definitively choose between them.

  These methods are essential tools, but they lack a specific, dedicated criterion for *normativity itself*. They often leave us circling the question: "Is this pattern normative, or is it something else?"

  ### 3. The Friction Criterion: A Proposed Test
  We propose the **Friction Criterion** as a potential solution: **An attribution of a social norm is warranted only when the archaeological record provides evidence that the observed regularity was actively *maintained against countervailing pressures or alternatives*, implying a cost associated with deviation.**

  Evidence for "friction" could manifest as:
  *   **Sanction/Correction:** Material traces of punishment, repair (beyond functional necessity), exclusion, or deliberate destruction associated with deviations (e.g., atypical burials segregated or disturbed, "killed" non-conforming objects, rebuilt structures adhering strictly to a layout despite fire damage).
  *   **Deliberate Boundary Marking:** Investment in physically defining or signaling the required behavior (e.g., highly visible boundary markers maintained despite shifting practical needs, specialized objects/structures *only* used to demarcate normative spaces or actions).
  *   **Costly Conformity:** Patterns where adherence demonstrably incurred greater effort, resource expenditure, or forgone opportunity compared to readily available, functionally equivalent alternatives (e.g., consistently using a harder-to-source material for ritual objects when local alternatives existed; maintaining a complex, labor-intensive decorative style across vast areas despite simpler options).
  *   **Patterned Deviance & Response:** Systematic evidence of deviations occurring *and* being followed by actions aimed at re-establishing the norm.

  **The core idea is that norms imply an *effort* or *cost* to maintain the pattern; mere habits or functional solutions do not.** The absence of friction suggests the regularity might be non-normative.

  ### 4. Research Method: Conceptual Refinement through Contrasting Case Studies
  This project is primarily conceptual and methodological, grounded in rigorous analysis of *already published* archaeological material. It will not involve new fieldwork or lab analysis.

  *   **Phase 1: Conceptual Groundwork & Case Selection (Month 1)**
      *   Refine the definition and operational parameters of the Friction Criterion, clarifying key concepts (norm, regularity, friction, cost, sanction).
      *   Establish transparent criteria for selecting contrasting published case studies:
          *   **Criterion 1: High Plausibility of Normativity:** Select a well-documented context where normativity is *strongly suspected* based on multiple lines of evidence (e.g., complex funerary practices, highly regulated ritual spaces, explicit symbolic codes).
          *   **Criterion 2: High Plausibility of Non-Normative Regularity:** Select a context where a widespread pattern is *likely* driven by practical constraints, tradition without obligation, or technique (e.g., widespread pottery forms linked to efficient production, settlement patterns strongly dictated by topography/resources).
          *   **Criterion 3: Richness of Record:** Both cases must offer sufficiently detailed published data (site reports, artifact analyses, spatial data) to allow systematic search for evidence of friction or its absence.
      *   *Example Candidates (illustrative):* Case A (Norm?): Mesoamerican temple complex layouts & ritual deposits. Case B (Non-Norm?): Standardized utilitarian pottery forms in a specific Neolithic culture.

  *   **Phase 2: Systematic Application & Analysis (Months 2-4)**
      *   Apply the Friction Criterion systematically to each selected case study:
          *   **Step 1:** Identify the specific regularity under scrutiny.
          *   **Step 2:** Scour the published record for *any* evidence fitting the friction categories (sanction, boundary marking, costly conformity, patterned deviance/response).
          *   **Step 3:** Critically assess the strength, context, and alternative interpretations of any identified friction evidence. Is it clearly linked to *this specific regularity*? Is the "cost" demonstrable relative to alternatives?
          *   **Step 4:** Evaluate the *absence* of friction evidence where it might be expected. Is the record resolution sufficient to have preserved it?
      *   Compare and contrast the results between the two cases. Does the criterion successfully distinguish the contexts? What challenges arise in application?

  *   **Phase 3: Evaluation, Refinement & Dissemination Prep (Months 5-6)**
      *   Synthesize findings: Does the Friction Criterion hold? Is it a necessary condition? Is it sufficient? What modifications are needed? What are its limitations?
      *   Articulate clear definitions of success and failure modes (see Section 6).
      *   Draft the primary deliverable: An article-length paper presenting the criterion, its theoretical rationale, the case study application, results, and refined framework.
      *   Draft the secondary deliverable: A concise, practical "Field Guide to the Friction Criterion" (1-2 pages) outlining operational steps and key questions for archaeologists to apply to their own material.

  ### 5. Work Plan (6 Months)

  *   **Month 1:** Literature review (norm theory, archaeology of practice, relevant case studies); Finalize Friction Criterion definition; Establish selection criteria; Identify & justify final case studies.
  *   **Month 2:** Deep dive into published data for Case Study A (High Norm Plausibility). Systematically apply Friction Criterion steps 1-3.
  *   **Month 3:** Complete analysis of Case Study A; Begin deep dive into published data for Case Study B (Low Norm Plausibility). Apply Friction Criterion steps 1-3.
  *   **Month 4:** Complete analysis of Case Study B; Conduct comparative analysis between A and B; Identify key insights and challenges.
  *   **Month 5:** Synthesize findings; Evaluate criterion's validity and limitations; Begin drafting article-length paper; Draft initial version of "Field Guide".
  *   **Month 6:** Complete article draft; Refine "Field Guide" based on findings; Finalize clear statements on success/failure; Prepare final report.

  ### 6. Defining Success, Failure, and Ambition

  *   **Successful Result:** The project succeeds if it achieves a clear, demonstrable outcome regarding the Friction Criterion's utility:
      *   **Optimal Success:** Case studies show the criterion effectively distinguishes norm-rich from norm-poor contexts. The criterion is validated as a *necessary* (and likely useful) condition, its operational steps are refined, and its limitations are clearly mapped. Both deliverables are produced.
      *   **Meaningful Success (Revised Understanding):** The application reveals significant flaws or ambiguities in the criterion *as initially conceived*, but this process leads to a substantively revised, more robust, and testable criterion or a clear understanding of *why* the distinction is archaeologically intractable in certain ways. This revised framework is articulated in the paper and guide.
  *   **Project Failure:** The project fails if:
      *   **Systematic Invisibility:** Analysis conclusively shows that evidence of friction (sanction, costly conformity) is systematically unlikely to be preserved or discernible in the archaeological record for the types of norms we wish to identify. The criterion is rendered practically useless. (Key Risk 1)
      *   **Criterion Collapse:** The criterion proves impossible to apply consistently or fails to discriminate; *every* plausible regularity shows *some* arguable "friction" (making it meaningless), or *no* clear case shows definitive friction (making it untenable). (Key Risk 2)
      *   **Conceptual Indistinguishability:** The exercise demonstrates that the distinction between "norm" and "custom/convenience" is fundamentally blurred or non-existent in the material record, and no criterion can reliably isolate obligation. (Key Risk 3)
      *   **Methodological Failure:** The selected case studies prove unsuitable (e.g., insufficient data, misclassified normativity), preventing a valid test.
  *   **Managing Ambition & Scope:** Six months is sufficient for a focused proof-of-concept using two contrasting cases. We deliberately avoid:
      *   Comprehensive surveys of global archaeology.
      *   Developing complex quantitative metrics for "cost" (initial assessment will be qualitative/relative).
      *   Tackling the full philosophical debate on normativity (focusing on its operational archaeological signature).
      *   Applying the criterion to more than two primary case studies.
      *   Including ethnoarchaeology (focus is on published *archaeological* data). **If scope creeps, the comparative element (Case B) would be the first reduction, but this weakens the test significantly.**

  ### 7. Deliverables
  1.  **One Article-Length Manuscript:** For submission to a leading archaeological theory/methods journal (e.g., *Journal of Archaeological Method and Theory*, *Archaeological Dialogues*). This will present the problem, the Friction Criterion, the case study application, results, evaluation, and the refined framework.
  2.  **"Field Guide to the Friction Criterion":** A concise (1-2 page), practical handout designed for archaeologists. It will provide clear definitions, a step-by-step guide for application, key questions to ask of the evidence, and prominent caveats. This will be disseminated via professional networks and academic repositories.

  ### Conclusion
  This project tackles a fundamental methodological gap in archaeological interpretation: the objective identification of social norms. By developing and rigorously testing the "Friction Criterion" – the requirement for evidence that a regularity was maintained *against* countervailing pressures – we aim to provide a more robust, transparent, and testable basis for claims about past obligations. Grounded in conceptual clarity and disciplined by the application to contrasting published case studies, this seed project will determine whether this approach holds promise for refining archaeological inference and moving beyond the ambiguity that currently surrounds claims about normativity in the deep past. The deliverables will provide both a substantive scholarly contribution and a practical tool for the field.
