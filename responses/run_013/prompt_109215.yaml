prompt: |-
  My mate at work has gone deep down the many-worlds rabbit hole and he's built an argument that I'm pretty sure proves way too much, but I can't find the bad step. He does infra now but he did a physics degree, so he's definately not talking nonsense, which is the annoying part. Here's the argument, numbered the way he wrote it on the whiteboard:

  (1) In many-worlds, every outcome of a quantum measurement actually happens: one copy of me sees spin up, another copy sees spin down.
  (2) A probability is a fact about which of a few possible outcomes will happen. When I say a die has a 1/6 chance of landing six, I mean it might land six and it might not, and one of those is what happens.
  (3) In many-worlds nothing "might not" happen. Everything happens.
  (4) So there are no probabilities in many-worlds. All a probability statement can mean there is "I don't know which branch I'll end up in."
  (5) But if it's only me not knowing which branch I end up in, then how much I should bet on each outcome should just go by how many branches there are, split evenly. Two branches, 50/50. If a thousand branches are roughly "up" and one is roughly "down", that's 999 to 1.
  (6) That's not the Born rule (probability = amplitude squared). The Born rule weights by amplitude squared, not by counting branches, and every experiment we've ever done comes out matching it.
  (7) So many-worlds either hits the Born rule by coincidence or doesn't hit it at all, and either way it doesn't predict the numbers we actually see.
  (8) He says this also shows there's no real probability in any deterministic theory. In classical mechanics the coin flip is already settled before it lands, so "50%" there is just ignorance, and all of statistical mechanics is us not knowing things.

  I don't buy (8) — stat mech predictions are real predictions, they're the ones that make engines work. And I'd rather not throw out (1) either. So which step do I reject, why did it look fine, and what does rejecting it cost me? If the fix is that something in the middle is doing sneaky work, tell me what's supposed to be there instead, because "the amplitudes just are the probabilities" sounds like assuming the thing he's meant to be getting out. I don't need a reading list, just the diagnosis.
reasoning: |-
  Okay, the user's friend has presented an argument against the many-worlds interpretation (MWI) of quantum mechanics, claiming it can't account for probabilities like the Born rule. The user wants to know where the argument goes wrong without rejecting the core idea of MWI.

  Looking at the argument, step (5) seems problematic. The friend assumes that probability should be based solely on branch counting—if there are two branches, it should be 50/50. But in MWI, branches aren't created equally; they have different weights based on the squared amplitudes. The number of branches isn't what matters—it's the amplitude associated with each outcome.

  The friend is treating branches like equally likely paths, but that's not how quantum mechanics works. In a spin measurement, the "up" and "down" branches might have different weights (like 70% and 30%), even though we colloquially say there are "two worlds." The branching isn't symmetric when amplitudes aren't equal.

  This mistake makes step (6) misleading. MWI doesn't predict probabilities by counting branches—it uses the Born rule precisely because the amplitudes determine the weights. Experiments confirm these amplitude-derived probabilities, not branch-counting probabilities. 

  The user's hesitation about step (8) is justified. Statistical mechanics works because deterministic systems can exhibit emergent randomness—like coin flips—where ignorance probabilities align with observed frequencies. Similarly, in MWI, the "self-locating uncertainty" about which branch you're in, weighted by amplitudes, produces the correct probabilistic predictions. 

  The key is rejecting the branch-counting assumption in (5) while keeping (1)-(4). Probabilities in MWI come from amplitude weights, not symmetry. This doesn't cost much—it just clarifies that "branches" aren't fundamental but emerge with weights. The user doesn't need to abandon MWI or accept weird conclusions; they just need to see why branch density ≠ probability density.
answer: |-
  The fatal flaw is in **step (5)**, specifically the assumption that "how much I should bet should just go by how many branches there are, split evenly." This step smuggles in an *unjustified assumption* about how probability arises in MWI, and it's why the argument seems plausible but proves too much. Here's the breakdown:

  1.  **Why (5) is wrong:** It assumes branches are *countable* and *equally weighted*. Neither is true in standard MWI.
      *   **Branches aren't fundamental:** In MWI, the wavefunction evolves unitarily. "Branches" (distinct, quasi-classical worlds) are emergent structures arising from decoherence. They aren't fundamental entities you can count like apples.
      *   **Branches aren't equally weighted:** The amplitude associated with each outcome (branch) determines its "weight" or "measure." A branch with a tiny amplitude |ψ|² is *not* equivalent to a branch with a large amplitude |ψ|². The wavefunction doesn't split into discrete, equally-sized chunks; it flows continuously, and decoherence creates structures with vastly different weights.

  2.  **Why it looks fine:** Your friend is intuitively applying a principle of indifference: "If I don't know which identical copy of me I'll be, and there are N copies, each should have probability 1/N." This *would* be valid **if** the branches were truly identical and fundamental. But in MWI, they aren't.

  3.  **What rejecting (5) costs you:** It forces you to accept that **probability in MWI comes from the wavefunction amplitudes, not from counting branches.** The "I don't know which branch I'll end up in" (step 4) is correct, but the betting odds *must* be weighted by the *amplitude squared* of each branch, *not* by a simple branch count. This weighting is an **additional postulate** needed to connect the formalism to experience. MWI doesn't *derive* probability from scratch; it *uses* the Born rule (|ψ|²) to define the measure over which the self-locating uncertainty applies.

  4.  **How this fixes the argument:**
      *   Steps (1)-(4) are mostly correct: Outcomes happen, "might not" is tricky, probability is about self-locating uncertainty.
      *   **Corrected (5):** "How much I should bet on each outcome should go by the *measure* associated with each branch, which is given by the amplitude squared |ψ|² of that outcome." This measure tells you how likely you are to "find yourself" in a branch with that outcome.
      *   **(6) is bypassed:** This *is* the Born rule. Experiments match it because this weighting is built-in as the measure defining the probability of self-location.
      *   **(7) is avoided:** The Born rule isn't a coincidence; it's the necessary measure for making sense of probability within the deterministic wavefunction evolution. MWI *predicts* the numbers by postulating this measure.
      *   **(8) is partially addressed:** Your intuition is right. Statistical mechanics *works* because deterministic chaos + coarse-graining + the *Principle of Indifference* over unknown microstates leads to emergent probabilities that match observed frequencies. Similarly, in MWI, deterministic evolution + self-locating uncertainty + the *Born Rule measure* leads to emergent probabilities matching observed frequencies. The "cost" is accepting that probability in deterministic theories requires an additional element (indifference over microstates / the Born measure) to connect the underlying state to our experience of uncertainty.

  **In a nutshell:** The argument fails because it incorrectly assumes branches are countable and equally probable. Rejecting this forces you to see that probability in MWI is defined by the |ψ|² weights attached to the branches by the wavefunction. This isn't "assuming the answer"; it's recognizing that the structure of the wavefunction itself provides the measure over which self-locating uncertainty applies. The "sneaky work" is in the wavefunction's amplitude distribution – it's not just *that* branches exist, but *how* they are weighted.
