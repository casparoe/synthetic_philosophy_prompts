answer: |-
  ### The Case: Village Water Rule
  A small village shares a well. Two farmers, Ben and Ada, must decide between two water allocation rules:  
  **Option 1 (Equal Share):** Each gets 5 units of wellbeing.  
  **Option 2 (Favor Ben):** Ben gets 1002 units, but Ada gets -990 units (due to crop failure and debt).  

  ---

  ### Verdicts and Reasoning  
  1. **Harsanyi’s Utilitarianism (Equal-Probability Veil):**  
     - Imagine you’re equally likely to be Ben or Ada.  
     - Expected wellbeing of Option 2: \( (0.5 \times 1002) + (0.5 \times (-990)) = 501 - 495 = 6 \).  
     - Option 1 gives 5 for sure.  
     - **Verdict:** Choose Option 2 (6 > 5).  

  2. **Maximin (Difference Principle):**  
     - Identify the worst-off person under each option:  
       - Option 1: Both at 5 → worst-off has 5.  
       - Option 2: Ada has -990 → worst-off has -990.  
     - **Verdict:** Choose Option 1 (-990 < 5).  

  ---

  ### The Pivot: Altering the Veil’s Odds  
  Suppose the veil gives **unequal odds**: 99% chance you’re Ada, 1% chance you’re Ben (e.g., because Ada’s land type is more common).  
  - **New expected wellbeing (Option 2):** \( (0.01 \times 1002) + (0.99 \times (-990)) = 10.02 - 980.1 = -970.08 \).  
  - Option 1 still gives 5.  
  - **Utilitarianism now flips:** Prefers Option 1 (-970.08 < 5).  
  - **Maximin unchanged:** Still prefers Option 1 (worst-off remains at -990).  

  ---

  ### What Does the Real Work?  
  **The equal-probability assumption** is pivotal. The flip occurs solely because utilitarianism weighs outcomes by probabilities, and shifting the odds dramatically lowers the expected value. The expected-value frame and interpersonal trade-offs are necessary but insufficient—without *equal* weights, the result destabilizes. If probabilities are fixed by real-world statistics (e.g., 99% *are* like Ada), utilitarianism defers to those odds, while maximin ignores probabilities entirely.  

  ---

  ### Defense of Harsanyi: The Strongest Reply  
  A Harsanyi defender would argue:  
  > *"The equal-probability assumption isn’t arbitrary—it falls out of rational choice under ignorance. If you truly know nothing about who you’ll be, you must assign equal subjective probability to each person (as with a fair lottery). Tinkering with odds imports real-world biases, violating the veil’s purpose: impartiality. Your ‘loaded veil’ isn’t Harsanyi’s thought experiment—it’s a different (and question-begging) model. Axioms like anonymity and ethical neutrality mathematically imply equal weights; rejecting them rejects the theory’s foundation."*  

  **How much to accept?**  
  - **Accepted:** Equal probability is core to Harsanyi’s theorem; altering it creates a distinct framework. Specialists agree his axioms *entail* equal weights.  
  - **Contested:** Whether those axioms are normatively compelling. Critics (e.g., Rawlsians) argue that *ignoring* real-world probabilities is irrational, and maximin better reflects risk-aversion for the worst-off. The debate turns on whether rationality requires linear risk-weighting (as Harsanyi claims) or permits priority to the disadvantaged (as maximin holds).  

  This case exposes the seam: Harsanyi’s equality is *procedural*, not empirical. It holds among experts that his result strictly requires equal probability in the veil, but not that utilitarianism is "correct"—alternatives like maximin remain live options grounded in different moral intuitions.
