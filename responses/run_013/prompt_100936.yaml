  1. **Strategic Voting:** Some students might vote strategically to break the simulation. To prevent this, assign roles and stress that they should vote sincerely as per their role. Also, the groups are designed so that strategic voting would be complex and unlikely.

  2. **Confusion about the Rule:** The rule might be confusing. Explain it clearly and have an example. Use the whiteboard to write the rule: "Plan approved if (P and Q) or R".

  3. **Time Management:** 90 minutes is tight. Stick strictly to the timeline. Cut stage 3 if necessary.

  4. **Lack of Emotional Engagement:** The affective charge of real populism (resentment, distrust) is missing. The instructor must provide this in the debrief by drawing parallels to real-world examples.

  5. **Preference Change after Information:** If students change their votes after the information reveal, note that this shows how the "will" is not fixed but depends on information. This is a valid point.

  6. **Not Enough Time for Debrief:** The debrief is crucial. Don't rush the activity; if stage 3 is taking too long, skip it.

  ### What the Activity Cannot Reproduce

  - **Scale:** 16 students is not a mass electorate. The dynamics of large groups are different.
  - **Affective Charge:** The emotions of real populism (anger, resentment) are not captured in a classroom. The instructor must provide context.
  - **Complexity of Issues:** Real policies are more complex, and voters have more nuanced views.
  - **Media and Elite Manipulation:** In real life, elites and media shape perceptions, which we don't simulate.

  ### Final Timeline

  Total: 90 minutes

  - Setup (5 min)
  - Stage 1: Bundle Vote (15 min)
  - Information Reveal (5 min)
  - Stage 2: Separate Votes (15 min)
  - Stage 3: Intensity Check (5 min)
  - Debrief (40 min) [or 45 min if we skip stage 3]

  We'll drop the agenda control stage due to time and complexity.

  ### Materials to Prepare

  - Role cards (16)
  - Voting slips (for bundle and for P, Q, R)
  - Whiteboard or slides to record votes and the rule
  - Timer

  ### Role Card Example

  **Group 1 (Pro-Tech)**
  - You are a homeowner near the mill site.
  - You support the tech park (P) and the tax (Q) because they will bring high-paying jobs and increase property values.
  - You oppose affordable housing (R) because you worry it will lower property values and change the neighborhood.
  - **Intensity:** You care about this at level 3 (on a 1-5 scale, where 5 is the highest).
  - **In the bundle vote (stage 1):** You will vote NO because you don't want affordable housing.
  - **In the separate votes (stage 2):** You will vote YES for P, YES for Q, and NO for R.

  **Group 2 (Pro-Housing)**
  - You are a renter and community activist.
  - You support affordable housing (R) because there is a severe housing shortage and many are struggling.
  - You oppose the tech park (P) and the tax (Q) because the tech park won't help low-income residents and the tax will burden residents.
  - **Intensity:** You care intensely about this (level 5).
  - **In the bundle vote:** You will vote NO because you don't want the tech park and tax.
  - **In the separate votes:** You will vote NO for P, NO for Q, and YES for R.

  **Group 3 (All-Three)**
  - You are a local business owner.
  - You support the entire plan: the tech park (P), the tax (Q), and affordable housing (R) because the tech park will bring customers and the housing will support workers. You are willing to pay the tax.
  - **Intensity:** You care at level 2.
  - **In the bundle vote:** You will vote YES.
  - **In the separate votes:** You will vote YES for P, YES for Q, and YES for R.

  This design should achieve the goals. Let's run with it.
answer: |-
  Based on your requirements, here's a complete 90-minute activity called **"The Milltown Paradox,"** designed to make students experience the construction and fracture of the "will of the people" through a hands-on simulation of a citizens' assembly. It incorporates the doctrinal paradox (discursive dilemma), agenda control, intensity disparities, and the shift from actual to idealized preferences—all while minimizing strategic voting. I'll provide a minute-by-minute timeline, materials, roles, troubleshooting, and limitations.

  ---

  ### **Activity: The Milltown Paradox**  
  **Core Conflict:** A town must decide on redeveloping a closed factory. Three interdependent policies create a doctrinal paradox where bundled vs. separate voting yields opposite outcomes.  

  #### **Setup (5 minutes)**  
  - **Setting:** Introduce the fictional town of Milltown. A factory closure has caused job losses and a housing crisis.  
  - **Assembly Role:** Students are the "Milltown Citizens' Assembly" (16 members).  
  - **Policy Bundle:** Vote on three interconnected policies:  
    - **P (Jobs):** Build a tech park on the factory site.  
    - **Q (Tax):** Levy a 5% property tax to fund the tech park.  
    - **R (Housing):** Build affordable housing on part of the site.  
  - **The Rule (Doctrinal Paradox Engine):**  
    *"The redevelopment plan is APPROVED only if:  
    **(P and Q) OR R**  
    Translation: The tech park must be funded by the tax to be viable, OR housing alone can be built."*  
    (This ensures P and Q are a logical pair; R is independent).  

  #### **Materials**  
  - **Role Cards (16):** Assign pre-written roles (no student choice) to prevent strategic voting. Cards include:  
    - **Preferences:** Policy stances (support/oppose P, Q, R).  
    - **Intensity:** A "passion score" (1-5) showing how much they care.  
    - **Biased Info:** Flawed initial info to simulate "uninformed" voters (e.g., "Rumors suggest the tax might fund housing" → false).  
    - **Sample Role (Group 1 - Tech Advocates):**  
      *"You own a business near the site. Support P (tech park) and Q (tax)—tech will boost the economy. Oppose R (housing)—it attracts ‘undesirables.’ Passion: 3/5. Initial Info: ‘The tax only funds the tech park’ (TRUE)."*  
  - **Voting Materials:** Paper slips for votes, tally sheets, whiteboard.  
  - **Timer:** Strict timekeeping is essential.  

  #### **Role Distribution (5 minutes)**  
  Assign roles to create the doctrinal paradox. Use fixed groups to avoid strategic voting:  
  - **Group A: Anti-Tax Elites (4 students)**  
    Support P (jobs), Oppose Q (tax), Oppose R (housing).  
    *Passion: 2/5. Initial Info: "Housing will lower property values."*  
  - **Group B: Housing Justice Advocates (6 students)**  
    Oppose P (jobs), Oppose Q (tax), Support R (housing).  
    *Passion: 5/5. Initial Info: "The tax might fund housing (false)."*  
  - **Group C: Compromise Moderates (6 students)**  
    Support P, Support Q, Support R.  
    *Passion: 1/5. Initial Info: "The tax is temporary (false)."*  

  > **Why this works:**  
  > - Bundle vote fails (A+B oppose), but separate votes pass R (B+C) and P (A+C), satisfying (P and Q) OR R → Plan approved.  
  > - Group B has high intensity (5/5) but is outvoted on P/Q; Group C has low intensity (1/5) but decides outcomes.  

  ---

  ### **Timeline (90 Minutes Total)**  
  #### **Stage 1: The "Authentic" Will of the People (20 minutes)**  
  - **Min 0-5:** Introduce Milltown crisis. Distribute roles. Emphasize: *"Vote your conscience—no strategy!"*  
  - **Min 5-10:** **Uninformed Bundle Vote.**  
    - Students vote YES/NO on the *entire bundle* (P+Q+R as one policy).  
    - **Tally:** Bundle rejected (A+B = 10 votes vs. C = 6).  
    - **Instructor Effect:** Rally them: *"The people have spoken! The elites’ bundle is dead!"*  
  - **Min 10-20:** **Debrief the "Win."**  
    - Ask: *"Does this feel like a legitimate expression of Milltown’s will? Why?"*  
    - Highlight: Clear majority, no elite interference → Feels authentic.  

  #### **Stage 2: Fracturing the Will (25 minutes)**  
  - **Min 20-25:** **Reveal the Rule & New Info.**  
    - Explain: *"The council reveals the plan’s rule: (P and Q) OR R must pass. Also, earlier info was flawed—here’s the truth:"*  
      - Tax (Q) *only* funds the tech park (P).  
      - Housing (R) requires no tax.  
  - **Min 25-35:** **Informed Separate Votes.**  
    - Vote on P, Q, and R **separately** in sequence.  
    - **Tally:**  
      - P: Supported (A+C = 10 votes).  
      - Q: Rejected (B+A = 10 votes → A supports P but opposes Q!).  
      - R: Supported (B+C = 12 votes).  
    - Apply the rule: (P and Q) = (Yes + No) → FALSE, but R = Yes → Plan **APPROVED**.  
  - **Min 35-45:** **Contrast Outcomes & Introduce Intensity.**  
    - Point out: *"Same voters, same day. Bundle rejected, but plan approved via the rule."*  
    - **Intensity Check:** Ask students to stand by passion score (1-5). Note: *"The 6 housing advocates (passion 5) lost on P/Q but won R. The 4 elites (passion 2) opposed the bundle but got P."*  

  #### **Stage 3: Agenda Control Twist (15 minutes)**  
  - **Min 45-50:** **Repackage Votes.**  
    - Split assembly into two random subgroups (8 students each).  
    - Group 1 votes on **R first**, then on **P+Q as a bundle** if R fails.  
    - Group 2 votes on **P+Q bundle first**, then on **R** if it fails.  
  - **Min 50-55:** **Tally & Compare:**  
    - Group 1: R passes (B+C dominate) → Plan approved (no vote on P+Q).  
    - Group 2: P+Q bundle fails (A opposes Q, B opposes P) → Then R passes → Plan approved.  
    - **Outcome:** Both approve, but... *"What if R was less popular?"*  
  - **Min 55-60:** **Hypothetical Scenario:**  
    - *"Suppose Milltown had only 2 housing advocates (not 6). Group 1 (vote R first): R fails → P+Q bundle fails (A+B oppose) → Plan rejected. Group 2 (vote P+Q first): Fails → R fails → Plan rejected. Same outcome? Not always!"*  

  ---

  ### **Debrief (30 minutes)**  
  **Goal:** Link activity moments to theory *after* the experience. Avoid lecturing; use Socratic questioning.  

  1. **The Fractured Will (5 min):**  
     - *"In Stage 1, you had a clear ‘will.’ In Stage 2, the same group produced two conflicting outcomes. What does this say about ‘one authentic will of the people’?"*  
     - **Concept:** Rousseau’s "general will" vs. "will of all." The paradox shows the "will" is method-dependent, not organic.  

  2. **Information & Idealization (10 min):**  
     - *"When you learned the tax only funded tech, did anyone want to change votes? What if we’d voted *before* the info reveal? Is the ‘real’ will what you *actually* voted or what you *would* vote if fully informed?"*  
     - **Concept:** The move to "idealized preferences" smuggles in the idealizer (e.g., elites defining "informed").  

  3. **Intensity & Tyranny of the Majority (5 min):**  
     - *"The housing advocates (passion 5) were a minority on P/Q but won R. Is it fair that low-passion voters (Group C) decided the outcome? How should democracy account for intensity?"*  
     - **Concept:** Tyranny isn’t just majority rule; it’s ignoring minority intensity.  

  4. **Agenda Control & Populism (10 min):**  
     - *"In Stage 3, changing the vote order didn’t alter the outcome here—but it could. Why do populist leaders often bundle policies or control voting sequences? How does ‘will of the people’ rhetoric hide this?"*  
     - **Concept:** Agenda control lets elites manufacture "wills" while decrying elite interference.  

  ---

  ### **What Will Go Wrong (and How to Fix It)**  
  1. **Strategic Voting by "Clever" Students:**  
     - **Risk:** A student votes against their role to "test" the system.  
     - **Fix:** Assign roles authoritatively. Preface: *"You’re role-playing real citizens—sincerity is key to learning. Save strategy for later debates."* If defiance occurs, use it: *"Interesting! Did anyone else feel their vote wasn’t ‘theirs’? Why might citizens vote strategically?"*  

  2. **Confusion About the Rule:**  
     - **Risk:** Students misunderstand "(P and Q) OR R."  
     - **Fix:** Pre-write the rule on the board. Pre-vote, do a non-binding practice with a simple example (e.g., "If (Pizza and Beer) OR Salad, do we order dinner?").  

  3. **Time Overruns:**  
     - **Risk:** Stage 2 voting bogs down.  
     - **Fix:** Use paper ballots for quick tallying. Enforce 30-second voting windows. Sacrifice Stage 3 if needed—it’s illustrative but not core.  

  4. **Low Emotional Stakes:**  
     - **Risk:** The simulation feels academic, not visceral.  
     - **Fix:** Inject urgency: *"Milltown’s mayor is watching this vote—your decision will reshape real lives!"* Debrief with real-world examples (e.g., Brexit bundle vs. component policies).  

  ---

  ### **What the Activity Can’t Do (Be Honest!)**  
  - **Mass Electorate Dynamics:** 16 engaged students ≠ millions of voters. The intimacy and rationality here ignore scale, misinformation ecosystems, and tribal polarization.  
  - **Affective Charge of Populism:** Simulated policy votes won’t replicate *ressentiment* or distrust. **Bridge this by:**  
    - Debriefing with populist rhetoric clips (e.g., a politician shouting *"The elites stole your voice!"*).  
    - Contrasting the activity’s calm with real-world examples (e.g., the 2021 U.S. Capitol riot: "They believed they were enacting the ‘real’ will").  
  - **Structural Power:** Students can’t replicate elite coercion (e.g., media control, gerrymandering). Acknowledge this: *"In reality, agenda control isn’t just voting orders—it’s silencing dissent."*  
  - **History/Context:** The activity isolates mechanics, but populism draws on historical narratives (e.g., "stolen dignity"). Supplement with readings (Rousseau/Schumpeter) in post-activity discussion.  

  ---

  ### **Why This Works for Your Seminar**  
  - **Runnable & Tight:** Pre-built roles, clear rules, and minute-by-minute structure ensure it fits 90 minutes.  
  - **Theory Integration:** Every stage maps to concepts *after* the emotional experience (e.g., Stage 1 = populist claim, Stage 2 = discursive dilemma).  
  - **Surprise Factor:** Students expect tyranny-of-majority; they get a paradox where "the will" fractures via neutral rule changes.  
  - **Extensions:** If time, add a "deliberation" round to explore idealized preferences or debate intensity voting (e.g., "Should passion scores count?").  

  **Final Tip:** End the debrief by asking: *"If there’s no ‘real’ will of the people, is populism just elite manipulation in reverse?"**—then assign Schumpeter for next week.
