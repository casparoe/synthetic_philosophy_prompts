  The activity has three stages:
  1. Students act as a citizens' assembly for a fictional town, voting on a bundled policy (three interconnected proposals) to create a clear, seemingly legitimate "will of the people."
  2. Then, they switch to voting on the parts individually (or vice versa) and discover that the outcome changes even though no one's preferences changed (the discursive dilemma).
  3. If time permits, they see how the order of voting (agenda control) can determine the outcome.

  We also want to incorporate:
  (a) The idea that the "will" might depend on how informed and calm voters are (actual vs. idealized preferences).
  (b) The problem of intensity (a minority cares intensely while the majority is indifferent).

