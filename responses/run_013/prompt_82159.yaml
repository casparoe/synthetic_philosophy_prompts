answer: |-
  Below is the decision tree handout designed for your discussion section. It uses concrete cases to force students into nuanced positions on tyrannicide, based on Aquinas and related medieval debates. The tree has 8 nodes (questions) and 8 leaves (positions), with historical labels where applicable. It emphasizes your key distinctions: tyrant by title vs. exercise, who may act, loss of dominion, principled vs. prudential bars, and separation of killing from deposition. 

  **How to Use:**  
  - Students walk through the tree by answering "Yes" or "No" to each case-based question.  
  - The leaf they land on is their position. Group students by leaf and have them debate: "Why is your position defensible, and what's wrong with the others?"  
  - Aquinas ends up on **Leaf 2** for tyrants by title and **Leaf 5** for tyrants by exercise—highlighting the gap in "who may act" that your professor noted.  
  - Unoccupied branches and inseparabilities are flagged at the end.  

  ---

  ### **Tyrannicide Decision Tree**  
  *Answer each question based on your instincts. No "maybe"—choose the side you lean toward.*  

  1. **Case: A usurper (no legitimate claim) seized the throne by force but rules well—fair taxes, peace, no oppression. A private knight has a clean chance to assassinate him without getting caught. Lawful?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **Case: The same usurper now rules tyrannically—e.g., executes dissenters without trial. That same private knight has a clean chance to kill him. Lawful?**  
     - **Yes** → **Leaf 1: Radical Private Removal (e.g., John of Salisbury)**. Anyone may kill a tyrant (title or exercise) if they can. Principled view: tyranny voids authority immediately.  
     - **No** → Go to 3.  

  3. **Case: A legitimate king (rightful heir) rules tyrannically—e.g., orders a bishop executed for refusing an unjust tax. Must the bishop obey?**  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  4. **Case: That same legitimate tyrant king. A private citizen (no official role) has a clean chance to kill him. Lawful?**  
     - **Yes** → **Leaf 2: Private Tyrannicide for Usurpers Only**. Only tyrants by title may be killed privately (Aquinas’ view for usurpers). Exercise alone isn’t enough.  
     - **No** → Go to 6.  

  5. **Case: The same legitimate tyrant king. A magistrate (e.g., a baron who swore loyalty to him) has a clean chance to kill him. Lawful?**  
     - **Yes** → **Leaf 3: Magistral Removal (e.g., Aquinas’ view for legitimate tyrants)**. Only public officials may depose/kill a tyrant by exercise. Authority is void only when they act.  
     - **No** → Go to 7.  

  6. **Case: The same legitimate tyrant king. Killing him would likely spark civil war or invite a foreign invasion. Does this make it unlawful?**  
     - **Yes** → **Leaf 4: Prudential Obedience (e.g., Aquinas’ caution)**. Never kill if consequences harm the common good (scandal, war, worse successor).  
     - **No** → **Leaf 5: Principle Over Prudence**. If tyranny is grave, kill regardless of consequences (rare; e.g., radical conciliarists).  

  7. **Case: The same legitimate tyrant is excommunicated by the Pope, who orders his deposition (not necessarily killing). Lawful?**  
     - **Yes** → **Leaf 6: Papal Deposition (e.g., Papalist view)**. Church may depose for spiritual harm, even if magistrates won’t act.  
     - **No** → Go to 8.  

  8. **Case: A tyrant (title or exercise) is deposed non-lethally (e.g., imprisoned or exiled). Is killing still needed?**  
     - **Yes** → **Leaf 7: Removal Requires Death**. Tyrants must die to prevent return (extreme; e.g., some Reformation thinkers).  
     - **No** → **Leaf 8: Deposition Without Killing (e.g., Moderate Conciliarism)**. Resist unjust commands, depose via authority, but never kill.  

  ---

  ### **Notes on the Tree**  
  - **Aquinas’ Placement**: He lands on **Leaf 2** for tyrants by title (usurpers may be killed by anyone) and **Leaf 3** for tyrants by exercise (only magistrates may act). This exposes his "gap": tyranny voids authority, but he doesn’t specify who enforces this beyond magistrates.  
  - **Inseparable Leaves**: The tree **cannot distinguish** between "public authority may act" (Leaf 3) and "church may depose" (Leaf 6) in cases where magistrates refuse. Both positions converge when magistrates are passive—Leaf 6 assumes no magistrate will act (per Node 7). If you believe the church *always* supersedes magistrates, you’re forced into Leaf 6 prematurely.  
  - **Unoccupied Branches**:  
    - **Leaf 7 (Removal Requires Death)**: Rarely argued. Incoherent because deposition usually prevents return, making killing gratuitous.  
    - **Leaf 1 (Radical Private Removal)**: Unattractive historically—medieval thinkers feared anarchy if private killings were allowed.  
    - **Leaf 5 (Principle Over Prudence)**: Unoccupied in Aquinas’ era. Prudential concerns (e.g., civil war) were near-universal.  
  - **Design Choices**:  
    - Title vs. exercise is forced early (Nodes 1–3) to show they yield different answers (e.g., Node 4 vs. Node 5).  
    - Loss of dominion is tested via obedience (Node 3). Prudential vs. principled bars split at Node 6. Killing vs. deposition separates at Node 8.  
    - Cases avoid "-isms" (e.g., "Pope orders deposition" not "may the Pope depose?").  

  **Why This Works for Your Seminar**: Students confront Aquinas’ ambiguity—tyranny isn’t sedition, but "who acts?" is unresolved. The tree makes them commit to specifics (e.g., Can a magistrate break their oath? Does the Pope override civil war risks?). Group debate will highlight tensions in Aquinas’ pragmatism vs. principle.  

  Hand this out as a 1-page flowchart. For 50 minutes: 10-min walkthrough, 30-min debate (split by leaf), 10-min wrap-up linking to Aquinas.
