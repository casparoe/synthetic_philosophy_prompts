prompt: |-
  I'm a novelist — my last book was about a woman who gradually stops speaking, so this is kind of my territory — and I've somehow ended up as the lay/community member on my local hospital's clinical ethics committee, which mostly means I read the packet and ask the naive questions. Next Thursday we have a genuinely hard one, and the chair has asked me to draft the opinion that goes in the minutes and gets circulated to the attending, the family, and the trust's legal people. Here's the case. A 44-year-old man, three years out from a brainstem stroke, is in what the neurologists call a locked-in state: he can blink and move his eyes, that's about it. For the last eight months he's been using one of those eye-tracking/EEG hybrid spelling rigs, and after a long calibration the team says he can reliably answer yes/no questions and pick from a short menu of phrases. His accuracy on the validation battery sits around 70-75%, better on some question types than others, and nobody can tell whether the errors are random noise or the interface misreading him. Two weeks ago, across three seperate sessions, he used it to say he wants the ventilator withdrawn. He'd never said anything like that before, and his wife says it isn't him talking, it's the machine. His adult daughter, who's the health-care proxy, says the exact opposite — that he's been trying to say this for a year. The treating team is split down the middle and one of the nurses has started refusing to sit in on the weaning conversations.

  The thing I keep circling is that we built a device that reports what he wants and then we don't believe it, which is either exactly right or a kind of horror and I honestly don't know which. What I need from you is the draft opinion itself, not a general essay: a clear recommendation (do we honor the request, decline it, honor it with conditions, or go get more evidence first — and on what timeline), the reasoning laid out in a form the attending and the lawyers can actually argue with, and an honest statement of the strongest case against whatever we recommend, written so the losing side would recognize themselves in it. Two things my colleagues have floated that I'd like you to take seriously and either adopt, adapt, or kill outright: one of the neurologists wants a rule she calls asymmetric deference — we defer to whatever the device says only when it lines up with things he said before the stroke, and otherwise we discount it; and our chair thinks any output from the device should be treated like testimony from a witness with a known unreliability problem, so it needs corroboration before it can carry weight, except she can't tell me what corroboration would even look like in a man who can only move his eyes. Please be concrete about the metaphysics without giving me a philosophy lecture — the family will read this, and so will the papers, and I'd rather not be the novelist who turned a man's death into a seminar.
reasoning: |-
  Okay, the user is a novelist who's also serving on a hospital ethics committee. They're dealing with a really tough case involving a locked-in patient who's using an eye-tracking device to communicate his wish to withdraw life support. The committee is divided, and the user needs to draft an official recommendation that balances medical ethics, legal concerns, and the family's emotions.

  First, I need to understand the core conflict. The patient communicated via a device with 70-75% accuracy, but there's disagreement about whether this reflects his true wishes. The wife doubts it, the daughter supports it, and the medical team is split. The user mentioned two proposals: asymmetric deference and requiring corroboration. I should evaluate these but remain focused on the patient's autonomy.

  The user wants a concrete recommendation, not a philosophical discussion. They need something actionable for the attending, legal team, and family. The key points are: honor the request, decline, honor with conditions, or gather more evidence. Given the circumstances, the best approach might be to proceed with withdrawal but with rigorous verification steps first. 

  Accuracy at 70-75% is concerning. It's above chance but leaves room for error. The neurologist's asymmetric deference is problematic because it discounts current expressions based on past statements, which undermines the patient's right to change his mind. The chair's corroboration idea is valid but impractical since the patient can only communicate via this device. 

  So, the solution might involve structured validation sessions. More testing with known questions to gauge reliability, especially about life-ending decisions. Also, involving a third-party expert to review the device's calibration and the sessions where the request was made. Including both family members in discussions could address their perspectives without letting them override the patient's voice.

  Ethically, patient autonomy is paramount. If he's competent, his decision should be respected. The principle of substituted judgment applies too—since he has a proxy, but if he can communicate, his own words take precedence. The strongest counterargument is the reliability of the device and the possibility that his condition or depression might affect his decision. Addressing these through psychiatric evaluation and ensuring informed consent is crucial.

  Legally, the healthcare proxy is the daughter, but if the patient is communicating directly, that might override her authority. The legal team will be concerned about liability, so documenting every step of verification is essential. The recommendation must protect the hospital from future lawsuits by showing due diligence.

  The user, as a novelist, wants to avoid turning this into a philosophical debate. The language needs to be clear, compassionate, and accessible to the family. Concrete steps like specific validation protocols and a clear timeline (e.g., 7 days) provide structure. Acknowledging both the wife's and daughter's viewpoints respectfully in the counterarguments section ensures they feel heard.

  Finally, the conclusion should affirm the patient's right to choose death if validated, balancing compassion with rigorous checks. Highlighting the absence of better alternatives reinforces that this is the best path forward under the circumstances.
answer: |-
  Here is a draft ethics committee opinion addressing the case, structured for clarity, actionability, and recognition of all perspectives:

  **CLINICAL ETHICS COMMITTEE OPINION**  
  **Regarding: Request for Ventilator Withdrawal by Patient in Locked-In State (Patient X)**  
  **Date:** [Date of Meeting]  
  **Committee Chair:** [Chair's Name]  
  **Drafted by:** [Your Name], Lay Member

  ---

  **I. RECOMMENDATION**  
  The Committee recommends that the treating team **proceed with withdrawal of ventilator support**, provided the following conditions are met within **7 calendar days**:

  1.  **Structured Validation:** Conduct two additional, documented communication sessions using the established hybrid spelling system, overseen by an independent assistive communication specialist (not the current treating team). Sessions must include:
      *   Verification of baseline accuracy using standardized neutral questions (e.g., "Is today Tuesday?", "Is your name [Name]?", "Is the sky blue?").
      *   Direct, unambiguous questions about care goals and the specific request to withdraw ventilation (e.g., "Do you want the breathing machine stopped?", "Do you understand this will lead to your death?", "Is this still what you want?").
      *   Exploration of alternative interpretations (e.g., "Are you asking for the machine to be stopped because you are in pain?" followed by pain assessment/management options).
  2.  **Psychiatric Evaluation:** A consultation with a psychiatrist experienced in neuro-rehabilitation and quality-of-life assessments to evaluate for treatable depression or other factors potentially influencing decision-making capacity *in the context of his neurological condition and communication method*. This is not to question capacity per se, but to ensure treatable confounders are addressed.
  3.  **Documented Consensus:** Confirmation by the independent communication specialist, the lead neurologist, and the psychiatrist that the patient's responses during the validation sessions are consistent, intentional, and reaffirm the request to withdraw ventilation, with a documented accuracy rate specific to *these critical questions*.

  **If these conditions are met and the request is reaffirmed**, ventilator withdrawal should proceed under palliative care protocols. **If the conditions reveal significant new ambiguity, inconsistency, or evidence of a treatable confounder preventing reliable expression of will**, the Committee recommends reconvening to reassess.

  **II. REASONING**

  1.  **Primacy of Patient Autonomy:** The foundational principle is respecting the capable patient's right to self-determination regarding medical treatment, including life-sustaining interventions. Patient X has demonstrated the ability to use a validated communication system to express preferences.
  2.  **Presumption of Validity:** While the system has inherent limitations (70-75% accuracy), it represents the *only available conduit* for Patient X's current expressions. After successful calibration and demonstrated ability to answer reliably on many questions, there is a *presumption* that his communications reflect his intent. We must start from a position of belief, not disbelief, absent concrete evidence of systemic failure *specific to this communication*.
  3.  **Specificity, Consistency, and Context:** The request ("ventilator withdrawn") was made clearly, three times, over distinct sessions, specifically addressing a major life-sustaining intervention. This surpasses the threshold of a casual remark and indicates deliberation. It aligns with the profound suffering and loss of agency inherent in locked-in syndrome.
  4.  **Addressing "Asymmetric Deference":** The Committee rejects this proposal. Competent individuals retain the right to change their minds based on lived experience. Discounting current expressions solely because they differ from pre-stroke statements denies Patient X's right to form new preferences in light of his devastating condition. His current reality *is* fundamentally different.
  5.  **Addressing Corroboration Requirement:** The Committee agrees *in principle* that corroboration strengthens confidence but finds the proposed standard ("like unreliable witness testimony") unworkably vague and potentially impossible. Our recommended **structured validation process** *is* the feasible form of corroboration: corroboration of the *reliability and intent of the specific communication act itself* under controlled conditions focused on the critical question. We seek corroboration of the *signal*, not an impossible independent source confirming the *message*.
  6.  **Proxy Disagreement:** While the healthcare proxy (daughter) supports the request and the spouse opposes it, the patient's *own* communicated wishes, if reliably ascertained, supersede both substituted judgment (what others *think* he would want) and familial opposition. The validation process focuses on establishing *his* voice.
  7.  **Absence of Better Alternatives:** No more reliable method currently exists to ascertain Patient X's wishes. Refusing to act on the output of the only available communication tool effectively condemns him to indefinite treatment he may not want, constituting profound harm.

  **III. STRONGEST CASE AGAINST THIS RECOMMENDATION (Presented Fairly)**

  The dissenting view holds that acting on the device's output, given its documented 25-30% error rate and the irreversible nature of withdrawal, entails an unacceptable and unconscionable risk of misinterpreting the patient's wishes and causing his wrongful death. Key concerns are:

  1.  **Inherent Uncertainty:** A 70-75% accuracy rate means 1 in 4 responses could be incorrect. When the question is life or death, this margin of error is ethically intolerable. The errors may not be random; they could be systematic misinterpretations of eye movements or EEG signals, especially under distress or fatigue. Can we truly be sure the "yes" to withdrawal wasn't a "no" misread?
  2.  **Lack of Corroboration:** The request lacks any independent verification. The spouse, who knows him intimately, adamantly believes this request is inconsistent with his character and values. The daughter's belief, while sincere, may project her own interpretation onto ambiguous signals. The validation process proposed cannot create *new* evidence; it only repeats the same potentially flawed method.
  3.  **Potential for Undiagnosed Confounders:** Depression, treatable discomfort, or even transient despair could be influencing his responses in ways the validation sessions might not uncover, especially given communication limitations. The irreversible consequence demands absolute certainty we cannot achieve.
  4.  **The Burden of Proof:** When life is at stake and communication is ambiguous, the burden of proof must lie with those advocating withdrawal. That burden ("clear and convincing evidence" of his wish) has not been met here. The safer, more compassionate course is to continue life-sustaining treatment, focusing on maximizing comfort and quality of life within his profound limitations, while continuing to refine communication methods. Withdrawal should only be considered if *unambiguous* communication of suffering *and* a wish to die persists *and* all treatable causes of suffering are addressed – a threshold not yet reached.

  **IV. CONCLUSION**

  The Committee acknowledges the profound difficulty and high stakes of this case. Our recommendation prioritizes respecting Patient X's potential autonomous choice expressed through the only means available to him, while mandating rigorous, concrete steps to maximize confidence in the reliability and intent of that communication *specifically regarding this request*. We recognize the dissenting view's gravity – the terror of acting on a miscommunication leading to death. However, the equal terror lies in ignoring a genuine, desperate plea for release from an existence he finds unbearable, trapping him indefinitely against his will. The structured validation process outlined attempts to navigate this impossible space with due diligence and respect for his voice. We urge the care team, family, and legal counsel to proceed with the utmost care, compassion, and adherence to the validation protocol.

  ---
  **Key Concrete Metaphysics Avoided Philosophy Lecture:**

  *   **The Device as Voice:** Treating the output as *his* voice until proven otherwise, not as a faulty witness.
  *   **Changed Mind:** Recognizing that profound suffering can validly change a person's wishes – respecting his *current* self, not just his past self.
  *   **Corroboration Defined:** Not seeking an impossible separate confirmation of *what* he wants, but seeking confirmation that the *tool* is accurately conveying *his* intent *right now* on *this specific question* through repeated, structured testing.
  *   **Burden of Proof:** Framed as balancing the risk of wrongful death vs. the risk of wrongful prolongation of suffering – acknowledging both are catastrophic harms, with no risk-free path.
