  ### Decision Tree: Guilt, Shame, and Cultural Choice  
  **Stipulations:**  
  - Guilt/shame distinction analyzed along four independent axes: **object** (act vs. self), **audience** (internal vs. external), **action-tendency** (reparation vs. withdrawal), **source** (internal standard vs. others' expectations).  
  - Tree starts by identifying which axis a respondent treats as essential (or if the distinction is unreal).  
  - Cases used:  
    - **CV Liar**: Lies on CV, privately resolves never to do it again.  
    - **Exposed Joke-Teller**: Publicly exposed for an old racist joke.  
    - **Restorative Justice**: Burglar and victim in a conference.  
    - **Reputation-Conscious Wrongdoer**: Feels nothing about the wrong but is distressed at being thought badly of.  

  ---

  #### **START**  
  **1. In the case of the reputation-conscious wrongdoer (distressed at being judged but not the act), what is the core flaw?**  
  - **A. Object flaw:** Focuses on the *self* being flawed, not the act. → **Go to 2**  
  - **B. Audience flaw:** Distress depends on *others’ judgments*, not internal standards. → **Go to 2**  
  - **C. Action-tendency flaw:** Drives *withdrawal or reputation-repair*, not reparative action. → **Go to 2**  
  - **D. Source flaw:** Norms come from *others’ expectations*, not internal principles. → **Go to 2**  
  - **E. No flaw:** This isn’t a moral emotion; the guilt/shame distinction is artificial. → **Leaf E**  

  ---

  #### **2. For the CV liar (private reform) and exposed joke-teller (public withdrawal), which emotion better sustains moral community?**  
  - **F. Guilt is better:** CV liar’s *act-focused repair* (e.g., resolving never to lie again) prevents harm without public shaming. → **Go to 3**  
  - **G. Shame is better:** Exposed joke-teller’s *social binding* (e.g., accountability to others) ensures norms are shared, not privately discharged. → **Go to 3**  
  - **H. Both are valuable but distinct:** CV liar needs guilt for *personal reform*, joke-teller needs shame for *social reintegration* (e.g., restorative justice requires both). → **Go to 3**  
  - **I. Both are corrupting:** CV liar’s guilt may become *self-absorbed*, joke-teller’s shame may cause *destructive withdrawal*; ideal agency needs neither. → **Go to 3**  

  ---

  #### **3. Could a culture replace shame with guilt (or vice versa) via institutions like restorative justice or public shaming rituals?**  
  - **J. Yes, and it should:** Institutions can cultivate one emotion (e.g., rituals that normalize confession for guilt or public accountability for shame). → **Leaf**  
  - **K. No, it cannot:** Emotions are too embedded in cultural history (e.g., individualistic societies can’t impose shame’s social gaze). → **Leaf**  
  - **L. Yes, but with loss:** Choosing one loses something irreplaceable (e.g., prioritizing guilt sacrifices social cohesion; choosing shame erodes autonomy). → **Leaf**  

  ---

  #### **LEAVES**  
  *Position name, followed by most awkward commitment.*  
  - **Leaf E: Distinction not real.**  
    - Folk concepts misdescribe a unified phenomenon; cultures can’t "choose" non-existent options.  
    - *Awkward commitment: Must explain why the guilt/shame contrast persists cross-culturally if it’s illusory.*  
  - **Leaf FJ: Guilt better + Can choose.**  
    - Guilt’s act-repair focus is superior; cultures can instill it (e.g., via private restitution rituals).  
    - *Awkward commitment: Ignores how guilt may ignore social harm without shame (e.g., CV liar’s unresolved impact on employers).*  
  - **Leaf FK: Guilt better + Cannot choose.**  
    - Guilt is better, but cultural psychology is too entrenched to switch (e.g., collectivist cultures can’t adopt guilt’s individualism).  
    - *Awkward commitment: Risks implying some cultures are morally deficient and stuck.*  
  - **Leaf FL: Guilt better + Can with loss.**  
    - Guilt is better and replaceable, but losing shame sacrifices communal monitoring (e.g., fraud prevention in close-knit groups).  
    - *Awkward commitment: Accepts preventable social harms as necessary costs.*  
  - **Leaf GJ: Shame better + Can choose.**  
    - Shame’s social binding is superior; cultures can promote it (e.g., public accountability processes).  
    - *Awkward commitment: Must address shame’s toxicity (e.g., exposed joke-teller’s depression) as fixable.*  
  - **Leaf GK: Shame better + Cannot choose.**  
    - Shame is better, but cultures can’t override their emotional "default" (e.g., liberal societies can’t impose shame’s conformity).  
    - *Awkward commitment: Condemns guilt-dominant cultures to excessive individualism.*  
  - **Leaf GL: Shame better + Can with loss.**  
    - Shame is better and replaceable, but losing guilt erodes autonomous conscience (e.g., citizens obey only when watched).  
    - *Awkward commitment: Trades moral depth for social compliance.*  
  - **Leaf HJ: Both valuable + Can choose.**  
    - Guilt and shame serve distinct roles; cultures can emphasize one (e.g., shame for public acts, guilt for private).  
    - *Awkward commitment: Requires clear criteria for which emotion to deploy, risking arbitrariness.*  
  - **Leaf HK: Both valuable + Cannot choose.**  
    - Both are necessary but fixed; cultures can’t redesign their emotional repertoire.  
    - *Awkward commitment: Denies agency in moral education reform.*  
  - **Leaf HL: Both valuable + Can with loss.**  
    - Both are valuable but choosing one loses the other’s benefits (e.g., prioritizing guilt weakens community trust).  
    - *Awkward commitment: Accepts that moral progress requires sacrificing one good for another.*  
  - **Leaf IJ: Both corrupting + Can choose.**  
    - Both emotions distort morality; cultures can minimize both (e.g., via reason-based ethics).  
    - *Awkward commitment: Must explain how moral motivation works without these emotions.*  
  - **Leaf IK: Both corrupting + Cannot choose.**  
    - Both are corrupting but inevitable; cultures can’t escape their influence.  
    - *Awkward commitment: Depicts humans as incapable of uncorrupted morality.*  
  - **Leaf IL: Both corrupting + Can with loss.**  
    - Both are corrupting, and reducing one may exacerbate the other (e.g., suppressing shame amplifies guilt’s rumination).  
    - *Awkward commitment: Suggests moral psychology is inherently flawed.*  

  ---

  #### **NOTES**  
  - **Unseparated pairs:** Leaves **FJ/GJ/HJ/IJ** (all "can choose") and **FK/GK/HK/IK** (all "cannot choose") are not separated by the *evaluation* of guilt/shame. The tree prioritizes cultural plasticity over moral evaluation here, as the latter doesn’t inherently affect the feasibility of choice.  
  - **Unoccupied combinations:**  
    - **Distinction unreal + Any cultural choice (J/K/L):** Incoherent; if the distinction isn’t real, "choice" is meaningless (covered in Leaf E).  
    - **Both corrupting + Can choose without loss (L):** Unattractive; reducing a "corrupting" emotion shouldn’t incur loss, so **IL** implies unavoidable trade-offs.  
    - **Guilt better + Shame better:** Incoherent; these are mutually exclusive evaluations.  
  - **Tree structure:** 13 leaves (within ~10 target). Combines axis-essentialism (Q1) with moral evaluation (Q2) and cultural choice (Q3). Ignores unreachable/unpopular combinations (e.g., "distinction unreal + guilt better" is incoherent).  

  ---  
  *Tree ends. Designed for clarity in branching; positions derived from logical space, not scholars.*
