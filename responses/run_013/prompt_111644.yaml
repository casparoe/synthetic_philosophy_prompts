  First, I need to design a session where students engage with the deli scenario, making decisions on what counts as a sandwich. The key points are: no fixed rules, predictable yet indefinable competence, learning through correction, and evolving practices over time.

  The user wants roles, materials, a timeline of items on cards, a moment where their written definitions fail, and a debrief connecting to Wittgenstein's ideas. They also want a student with a private rule to be corrected by peers, showing learning without definitions.

  I'll structure the session into phases: setup, timeline activity, rule-writing and failure, introducing shifts, and debrief. For roles, assigning Deli Owners and Regulars makes sense. The Regulars can predict decisions based on shared understanding, while Owners deliberate. 

  Materials needed: item cards in chronological order, a menu board. The timeline should start simple (sandwich, burger) and get ambiguous (hot dog, burrito, pop-tart). Include items that challenge definitions, like the open-faced sandwich or folded pizza as a joke.

  Predictable issues: students might stall on early items, so I'll suggest starting with clear examples. They might also try to force a strict rule, so the facilitator should remind them to use their "deli sense." Including a secretly briefed student to test a private rule (e.g., "must have bread") will show correction in action. When their definition fails on items like the open-faced sandwich or empty bread, it highlights the inadequacy of rules.

  For the debrief, map their experiences to language games, meaning-as-use, family resemblance. Avoid terms until then. The botanist vs. greengrocer example can be a backup if they don't generate another practice.

  Timings: setup (5 min), timeline activity (25 min), rule failure (10 min), shifts (10 min), debrief (30 min). Leave 10 min buffer. 

  What this can't replicate: the rule-following paradox. The activity shows shared practice but not how the next case is undetermined. The facilitator should note this gap and explain it briefly. Also, the artificial setting might limit authenticity, but the debrief can bridge that.
answer: |-
  Here’s a complete, ready-to-run session plan centered on your deli seed, designed to make Wittgenstein’s concepts experiential. The activity runs 80 minutes, leaving 10 min buffer.

  **Core Structure:**  
  Students become "deli staff" making real-time rulings on ambiguous items. A secretly briefed "New Hire" tests rule-failure, while historical shifts reveal evolving practice.  

  ---

  ### **Materials & Prep**  
  1. **Item Timeline Cards** (16 cards, in this order):  
     - Classic Sandwich (ham/cheese on sliced bread)  
     - Burger (bun, patty, toppings)  
     - Hot Dog (bun, sausage)  
     - Burrito (tortilla, fillings, rolled)  
     - Wrap (tortilla, fillings, folded)  
     - Sub Roll (long bread, fillings)  
     - Open-Faced Turkey (bread, toppings, no top slice)  
     - Ravioli (pasta, filling, sauced)  
     - Taco (hard shell, fillings)  
     - Pop-Tart (frosted, toaster pastry)  
     - Folded Pizza Slice (cheese/pepperoni, folded in half)  
     - Calzone (baked dough, fillings inside)  
     - Ice Cream Sandwich (wafers, ice cream)  
     - "Bread Sandwich" (two plain slices, nothing between)  
     - Sushi Roll (nori, rice, filling)  
     - Quesadilla (grilled tortilla, cheese)  

  2. **Large Menu Board** (whiteboard/poster):  
     - Two columns: "SANDWICHES" (starts empty) | "NOT SANDWICHES" (starts empty)  

  3. **Role Cards**:  
     - 5x **"Regulars"** (predict rulings based on "deli intuition"; quietly briefed: *"You’ve worked here years. You know what ‘counts’ even if you can’t explain why"*)  
     - 1x **"New Hire"** (secretly briefed pre-class: *"Insist on ONE rule: ‘It must have bread on at least two sides’"*)  
     - Others: **"Deli Owners"** (debate rulings; must justify to Regulars)  

  4. **Small Slips** (for rule-writing)  

  ---

  ### **Session Run-Sheet**  
  **Phase 1: Setup (5 min)**  
  - *"Today you’re staff at ‘Wittgenstein’s Deli’. Your job: decide which new menu items count as ‘sandwiches’ for pricing. We have a timeline of items added since 1990."*  
  - Assign roles randomly (ensure Regulars include confident students). New Hire stays quiet initially.  
  - Show empty menu board.  

  **Phase 2: Timeline Activity (25 min)**  
  - **Process**:  
    1. Hold up **one card at a time** in order.  
    2. **Deli Owners** debate: "Sandwich or Not?" (1–2 min max per item).  
    3. **Regulars** vote thumbs-up/down. Majority wins.  
    4. Write item in correct column on board.  
  - **Key Moves**:  
    - When **Hot Dog** (card 3) appears: Regulars will likely say "yes." Note disagreement if any.  
    - At **Burrito** (card 4): Owners debate. Regulars say "no" (per seed). Ask: *"Why not? It’s wrapped like a wrap!"*  
    - **Pop-Tart** (card 10): Let New Hire interject: *"But it has bread on two sides! Shouldn’t it be a sandwich?"* Regulars correct: *"No, that’s pastry—combo deal doesn’t apply."*  
    - **Folded Pizza** (card 11): Owner jokes, *"I’ll call it a ‘pizza sandwich’ haha."* Regulars say "no" seriously.  
    - **Bread Sandwich** (card 14): Owners baffled. Regulars: *"Technically yes? But charge minimum."*  

  **Phase 3: Rule-Writing & Failure (10 min)**  
  - *"Write a strict rule defining ‘sandwich’ that captures ALL ‘yes’ and NO ‘no’ items on our board."*  
  - Groups draft rules on slips (3 min). Share aloud (e.g., "Must be handheld," "Contains filling between carbs").  
  - **Counterexample Slam**:  
    - Challenge each rule with board items:  
      - *"Must be handheld"* → Open-faced sandwich requires a plate.  
      - *"Filling between carbs"* → Ice cream sandwich has no "filling," calzone is sealed.  
      - *"Bread on two sides"* (New Hire’s rule) → Burrito has one wrap, open-faced has one slice.  
  - *"Can we fix the rule? Or is this impossible?"* Let frustration simmer.  

  **Phase 4: Introducing Shifts & New Practice (10 min)**  
  - Reveal: *"The deli quietly changed two rulings last year:*  
    - *Calzone was ‘no,’ now charged as ‘yes.’*  
    - *Breakfast burrito is ‘yes’ on weekends only.*"  
  - *"Design a SECOND ambiguous category in pairs (e.g., ‘salad,’ ‘soup,’ ‘gluten-free’). What might change without announcement?"* (e.g., Is cereal soup? Is potato salad a salad?).  

  **Phase 5: Debrief (30 min)**  
  - **Questions → Concepts**:  
    - *"How did you know a hot dog was a sandwich but a burrito wasn’t?"* → **Meaning-as-use**: Competence came from participating in the practice, not definitions.  
    - *"Why couldn’t we write a perfect rule?"* → **Family resemblance**: Items share overlapping features (portable? layered? bread-like?) without a universal essence.  
    - *"How did the New Hire learn? Why did corrections work without a rule?"* → **Language games**: Correct use is negotiated in a community ("This is how we play here").  
    - *"What changed with the calzone? How?"* → **Fluid practice**: Rules evolve through new "moves," not top-down decrees.  
  - **Map to Wittgenstein**:  
    - Introduce terms **only now**. Contrast **essentialism** (failed rule-writing) with **family resemblance**.  
    - Link "deli intuition" to **forms of life**—shared background that makes meaning possible.  
    - Note: What we *couldn’t* simulate was radical indeterminacy (e.g., a totally novel item like "edible foam between bread sheets").  

  ---

  ### **Predictable Issues & Fixes**  
  - **Stalling on early items**: If debate drags on card 1 (Classic Sandwich), interject: *"Assume this is the prototype. Move on."*  
  - **Over-intellectualizing**: Owners philosophize about "breadness." Redirect: *"What would Regulars say? Check the board’s history."*  
  - **New Hire too passive**: Secretly signal them to defend their rule vigorously during Pop-Tart/Bread Sandwich.  
  - **Artificial humor**: If Folded Pizza joke falls flat, say: *"Owner’s joke highlights how context bends meaning."*  
  - **Time crunch**: Skip Sushi/Quesadilla if needed.  

  ---

  ### **What the Activity Can’t Reproduce (Honest Note)**  
  You’re right: **Rule-following paradox** ("How can a practice determine correctness if every application is a new ‘move’?") remains abstract. Students will feel the *shared* practice exists, but not that it *underdetermines* the next move. Mitigation:  
  1. Post-activity, pose: *"Imagine a ‘Ketchup Popsicle’—would it be a sandwich? Could there be a ‘right’ answer?"*  
  2. Briefly state Wittgenstein’s point: *"Even shared practices leave gaps. We extend them without rules, which is both miraculous and ordinary."*  
  3. Use botanist/greengrocer if needed, but the student-generated second category (soup/salad) often makes this tangible enough.  

  **Why it works**: Students *feel* the futility of essentialism, the sociality of meaning, and the fluidity of practice. They leave with a shared experiential metaphor ("Remember the deli?") for Wittgenstein’s hardest ideas.  

  Let me know if you need adjusted card lists, role briefings, or slides!
