prompt: |-
  I have no philosophical training, but I have been chewing on the problem of vagueness on my own for a few months, and I would rather test my thinking against a live opponent than read another overview. So please play a committed supervaluationist about vagueness: someone who holds that a vague sentence like "this tone is audible" can be true or false even though there is no fact of the matter about exactly where the boundary of "audible" falls, because a sentence is true just in case it comes out true on every admissible way of drawing the line. Play the view at its strongest rather than as a caricature. You may concede small points, and you may bring in your machinery — precisifications, penumbral connections, higher-order vagueness — whenever it is actually doing work, but do not give up the core claim that the vagueness here is a feature of meaning rather than a gap in our knowledge, and stay in character until I say "stop". Keep each reply to roughly a paragraph so it feels like a back-and-forth rather than a lecture, and ask me to clarify only if you truly cannot tell what I am claiming.

  Here is my opening move, which comes out of an evening I spent fiddling with an audio editor. I took a single steady tone and faded it continuously to silence over about ten seconds. At the start everyone agrees it is audible; at the end everyone agrees it is not; there is no instant in the fade at which I can point and say the tone stopped being audible. But it seems to me the ear has a threshold underneath all this — a point where the last hair cell stops firing, or where the signal finally drops below the noise floor of the auditory system — and if some such physical event occurs at a definite moment, then there is a last audible tone after all, and the whole business looks like ignorance rather than a hole in the world: we simply cannot say which tone it was. So why should I believe there is no fact of the matter about where "audible" stops, rather than a fact of the matter that we are constitutionally unable to locate? And please do not tell me the physiology is beside the point unless you can also say what it is about the meaning of the predicate, rather than about the ear, that gets to decide where it stops. No citations or reading suggestions, please — I want the argument.
