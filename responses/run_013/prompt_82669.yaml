prompt: |-
  I teach a third-year seminar that sits between the metaphysics of causation and the philosophy of responsibility, and I'm putting together the take-home final now. One of the questions has to be on causation by omission, and I want to avoid the two answers I get every year: the counterfactual analysis of causation, plus the objection that if omissions count as causes then infinitely many of them do, plus a shrug. So this term I've been pushing a home-made criterion on them to argue with. I've been calling it the standing-option account. Roughly: an omission counts as a cause of an outcome only if the omitted action was a standing option for the agent at the time -- something she could have done, where doing it required no new decision or fresh undertaking, because the option was already live in whatever she was already doing. Not scanning the pool while you're on duty as a lifeguard is a standing option; not wading into the pond next door while you read in your garden is not, on this account, because acting would have meant taking on a whole new course of action. I'm not sure it survives contact with hard cases, which is sort of the point.

  Here's what I want the question to do. It should make them state the standing-option criterion precisely enough to test, and then say whether it's a criterion of causation at all or really a criterion of something else -- responsibility, culpability, blame -- that's been smuggled in under a causal label. Then I want three applications that pull in diffrent directions: (i) a night nurse who skips a scheduled check and the patient dies; (ii) a company that inherits an ongoing discharge of effluent from a predecessor and never installs a filter, where nothing the current management does amounts to a decision not to filter, they just carry on; and (iii) an automated system whose default is to take no action, which is what it does when a sensor never fires, and the resulting inaction floods a town. And then the part I actually care about: I want them to try to produce a counterexample to the criterion -- a case where an omission intuitively causes the harm but was never a standing option, or a case where something clearly was a standing option and the omission plainly isn't a cause -- and to say what the criterion would have to give up to accommodate it. I also want a paragraph on why accident investigators at an engineering firm will happily list an unperformed inspection as a cause of a crash, while a tort court will usually say a pure omission isn't a cause at all, and whether the standing-option account predicts that split or just redescribes it.

  Write the question (it should be answerable in about 90 minutes), a model answer of roughly 700 words, and a marking scheme out of 20 that names the specific moves an A answer has to make and the specific moves a B answer will have instead -- including which wrong turns should cost marks, e.g. treating the criterion as a definition of what an omission is, or quietly re-labelling counterfactual dependence and calling it a day. Also flag anywhere the question is ambiguous enough that I should tighten the wording before I hand it out.
reasoning: |-
  Okay, the user is a philosophy professor designing a take-home final exam question about causation by omission. They want to move beyond standard counterfactual analyses and test their "standing-option" criterion. 

  Hmm, they're clearly frustrated with repetitive student answers - the infinite omissions objection followed by a shrug. Smart move to introduce this homemade criterion. The lifeguard vs. garden reader examples show they want students to grapple with agency and normativity. 

  Noticing three key needs: 
  First, precision - students must state the criterion rigorously enough for testing. Second, conceptual hygiene - is this really causation or smuggled responsibility? Third, applied tension - those three cases pull differently, especially the automated system which challenges agency assumptions. 

  The counterexample demand is clever pedagogy - forces students to find the cracks in the criterion. And that engineering vs. tort law contrast is gold - shows how context shapes causal attribution. 

  User's phrasing suggests they enjoy thought experiments ("not sure it survives contact with hard cases"). Should mirror that playful rigor in the question. Might add a footnote about their garden example being ambiguous - is "reading" an activity that could include noticing ponds? Good catch. 

  For the model answer... Should demonstrate how to attack one's own theory. The nurse case is clearly intended as a slam-dunk for the criterion, but the effluent case is murky - is "carrying on" equivalent to a decision? That's where the responsibility/causation blur matters. 

  Marking scheme needs to penalize definitional conflations. Spot on that students will try to reduce it to counterfactuals. Also worth docking points if they miss that automated systems lack "options" altogether - that's the whole point of case (iii). 

  Biggest risk is students misreading "standing option" as mere ability. Must emphasize the "no new decision" clause in the question. Might bold it. 

  ...Wait, should the model answer mention that "standing option" sounds suspiciously like Hart and Honoré's "duty situations"? But no - user wants focus on their framework. Save that for seminar discussion.
answer: |-
  Here’s the exam question, model answer, and marking scheme designed to meet your goals, with clarity fixes flagged. Aim for 90 minutes, ~700 words.

  ---

  ### Exam Question: Causation by Omission and the Standing-Option Account

  **Background:** We’ve examined the problem of causation by omission (e.g., "the lifeguard’s failure to scan caused the drowning"). Standard counterfactual analyses face objections about overgeneration (infinite omissions) and normative smuggling. This term, we explored a "standing-option account" (SOA) as a potential criterion:
  > *An omission (not-X) counts as a cause of outcome O only if, at the relevant time, doing X was a **standing option** for agent A. That is: (i) A could have done X; (ii) doing X required **no new decision or fresh undertaking** by A; and (iii) X was a **live alternative** embedded in A’s current activity or role.*

  **Your Task (Answer all parts):**

  1.  **Precise Statement & Conceptual Status (5 marks):**
      *   State the SOA criterion as a testable conditional (If *C*, then omission not-X causes O).
      *   Argue whether SOA is primarily a criterion for *causal relation* or if it covertly relies on (or collapses into) criteria for *responsibility, culpability, or blame*. Justify your view.

  2.  **Application & Tension (9 marks):**
      Apply SOA to **each** case below. State whether the SOA *would* classify the omission as a cause and **explain why/why not, highlighting points of strain**:
      *   **(i) Night Nurse:** Nurse A, on a 12-hour shift, deliberately skips a scheduled 2 am vital-signs check to nap. Patient B, whose condition was deteriorating unnoticed, dies by 3 am.
      *   **(ii) Effluent Company:** Company Y acquires a factory actively discharging toxic effluent. Installing a filter is feasible and affordable. Management never explicitly decides *against* filtering; they simply continue operations unchanged. Years later, the effluent poisons the water supply.
      *   **(iii) Automated Flood System:** A dam’s safety system is designed to close floodgates *only* if Sensor S detects overpressure. Sensor S fails silently. The system takes no action (its default state), and the town floods. There is no human oversight during the event.

  3.  **Counterexample & Revision (5 marks):**
      *   Propose a **counterexample** to SOA: Either (a) an omission that *intuitively causes* harm but *fails* SOA, OR (b) an omission that *passes* SOA but *intuitively does not cause* the harm.
      *   Explain precisely why your case challenges SOA.
      *   Identify **one core element** of SOA (e.g., "no new decision," "live alternative," "current activity") that must be **modified or abandoned** to accommodate your counterexample. Argue why this change is necessary but problematic for SOA’s goals.

  4.  **Institutional Divergence (1 mark):**
      *   Why might an *engineering accident report* readily list "unperformed inspection" as a cause of a crash, while a *tort court* often rules a "pure omission" is *not* a cause? Does SOA *predict* this split, or merely *redescribe* it? (Be brief).

  ---

  ### Model Answer (~700 words)

  **1. Precise Statement & Conceptual Status:**
  The SOA criterion can be stated as: *An omission (not-X by agent A) is a cause of outcome O only if, at the time, (i) A could have done X, (ii) doing X required no new decision/fresh undertaking by A, and (iii) X was a live alternative within A’s current activity/role.*

  SOA is primarily a criterion for *responsibility/culpability* smuggled into causal discourse, not pure causation. It filters omissions based on *normative expectations* tied to roles and activities (e.g., lifeguard scanning is part of "doing the job"). The "no new decision" and "live alternative" clauses directly import notions of *reasonable opportunity* and *role-based duty* central to blame attribution. SOA doesn’t solve the metaphysical problem of negative causation (e.g., the gardener’s not-wading isn’t *causally* different from infinitely many other non-actions; SOA just *selects* normatively relevant ones). It confuses the *source* of a norm (role/activity) with the *nature* of causation.

  **2. Application & Tension:**

  *   **Case (i) Night Nurse:** SOA *would* classify the omission as a cause. (i) The nurse could have performed the check. (ii) Doing the check required no new decision; it was a scheduled, routine task embedded in the ongoing shift activity. (iii) It was a live alternative inherent in "acting as the night nurse." *Strain:* Clear pass, but highlights SOA’s reliance on institutional roles (the "scheduled" check defines the standing option).
  *   **Case (ii) Effluent Company:** SOA *would struggle* to classify the omission as a cause. (i) Management could have installed a filter. However, (ii) installing a filter arguably *did* require a significant new decision and undertaking – a capital project distinct from routine operations. (iii) Filtering wasn’t a "live alternative" within their current activity of "running the acquired operation as-is"; it was a potential *change* to that activity. *Strain:* Intuitively, the continued omission seems causally (and morally) relevant to the harm. SOA risks exonerating passive persistence because it wasn’t actively chosen. This exposes SOA’s ambiguity: Is "carrying on" an activity that *includes* the option to modify it, or is modification a *new* activity?
  *   **Case (iii) Automated System:** SOA would likely *not* classify the system’s inaction as a cause. There *is no agent A* for whom X (closing the gates) was a "standing option." The system lacks agency; it simply follows its programming. Its default inaction isn’t an *omission* by an agent. Even if we anthropomorphize, "doing X" (closing gates) was *not* a live alternative within its current activity (waiting for sensor input); its programming *excluded* action without the signal. *Strain:* Engineers *will* call this omission a cause ("system failed to trigger"). SOA struggles with non-agential systems, revealing its focus on human action-contexts.

  **3. Counterexample & Revision:**

  *   **Counterexample (Type a):** **The Drowsy Driver.** Driver A, feeling slightly drowsy but believing it’s manageable, continues driving on a long highway trip. They *could* pull over immediately (i). Pulling over *would* require a new decision/fresh undertaking (ii) – exiting the flow of driving, finding a spot, stopping – it’s not embedded in the current activity of "driving straight." It’s not a live alternative within that specific moment (iii). Moments later, A falls asleep and crashes, killing B. Intuitively, A’s *failure to pull over when drowsiness first arose* caused the crash.
  *   **Challenge:** The omission intuitively causes harm but fails SOA (pulling over wasn’t a standing option *at the moment drowsiness was noted*; it required a new decision).
  *   **Revision Needed:** Abandoning "no new decision/fresh undertaking" (ii) is necessary to accommodate this. Pulling over *is* a basic safety option drivers must sometimes exercise, even if it interrupts the current activity.
  *   **Problem:** This destroys SOA’s core purpose of distinguishing the lifeguard (scanning is part of swimming) from the gardener (wading is not part of reading). *All* readily performable actions become potential standing options, collapsing towards mere ability and reviving the problem of too many causes. SOA loses its distinctive filter.

  **4. Institutional Divergence:**
  Engineering reports focus on *causal explanation* within a system, identifying any factor whose presence/absence made a difference to the outcome, often relying on counterfactuals. Tort courts focus on *assigning liability*, requiring a *duty* to act breached by the defendant; "pure omission" often fails the duty element *before* causation is even considered. SOA *redescribes* this split: It mirrors the tort focus on agent-specific, role-based "standing options" (duties inherent in activity), while engineering reports don’t require an *agent’s* standing option, just a functional failure. SOA doesn’t predict the split’s *existence* (rooted in institutional purposes) but offers a framework for *understanding* the different criteria used (role-bound agency vs. systemic difference-making).

  ---

  ### Marking Scheme (Total: 20 Marks)

  | **Part**               | **Moves Required (A Grade)**                                                                                                   | **Common B-Grade Shortcomings (Cost Marks)**                                                                                                | **Marks** |
  | :--------------------- | :----------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------ | :-------- |
  | **1. Statement & Status** | - Precise conditional statement of SOA (all 3 elements). <br> - Clear argument that SOA smuggles in responsibility (not pure causation), linked to role/normativity. | - Vague/incomplete SOA statement. <br> - Treats SOA purely as definition of omission. <br> - Asserts SOA is about causation without argument. <br> - **Major Penalty:** Reduces SOA to counterfactuals. | 5         |
  | **2. Applications**    | - **Clear SOA verdict for each case (i/ii/iii).** <br> - **Accurate reasoning** using SOA criteria for each. <br> - **Identifies specific strain** for (ii) (activity/passivity) & (iii) (non-agency). | - Inconsistent verdict/reasoning across cases. <br> - Ignores specific SOA clauses (esp. ii/iii). <br> - Misses strain in (ii) or (iii). <br> - Treats (iii) as having an "agent". | 9 (3 per case) |
  | **3. Counterexample & Revision** | - **Valid counterexample** (clearly fails/passes SOA against intuition). <br> - **Precise challenge** explaining SOA failure/success. <br> - **Identifies specific SOA element** to revise (e.g., "no new decision"). <br> - **Explains necessity & cost** (loss of distinctiveness/overgeneration). | - Weak/unclear counterexample. <br> - Doesn't explain *why* it challenges SOA. <br> - Vague revision (e.g., "make it broader"). <br> - Fails to acknowledge revision's cost to SOA. | 5         |
  | **4. Divergence**      | - **Distinguishes** engineering (explanation/difference-making) vs. tort (liability/duty) purposes. <br> - **Correctly states** SOA redescribes (mirrors tort focus) but doesn't predict institutional split. | - Confuses the purposes (e.g., says engineers care about blame). <br> - Claims SOA predicts the split. <br> - Incomplete/unsupported answer. | 1         |
  | **Clarity & Precision** | Overall: Logical flow, precise terminology, avoids ambiguity.                                                                 | Persistent vagueness, especially on "standing option," "new decision," "live alternative."                                                                 | (Holistic) |

  ---

  **Ambiguity Flags & Tightening Suggestions (For Question Wording):**

  1.  **"Standing Option" Definition:** Ensure the question reiterates the 3 clauses *(could do, no new decision, live alternative in current activity)* explicitly within the task description. Students often miss (ii) and (iii).
  2.  **Case (ii) Effluent Company:** Add: *"...they simply continue operations **unchanged.**"* (Emphasizes passivity).
  3.  **Case (iii) Automated System:** Add: *"**There is no human intervention or oversight during the event.**"* (Prevents anthropomorphizing).
  4.  **Counterexample Prompt:** Add: *"**Ensure your case clearly specifies the agent, the omitted action X, the outcome O, and the timing.**"*
  5.  **"Current Activity":** This is the most ambiguous term. Consider adding a brief note: *"(Note: Defining 'current activity' precisely is part of the challenge of applying SOA.)"* Don't define it further – its ambiguity is pedagogically useful.

  This structure pushes students beyond counterfactuals, forces engagement with SOA's mechanics and normative underpinnings, requires application to diverse cases highlighting its limits, demands critical creativity (counterexample), and connects theory to practice (institutional split). Good luck with the marking!
