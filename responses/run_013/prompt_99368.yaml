answer: |-
  Here are five readings of "every truth can be known," assessed for plausibility and utility in blocking undiscoverable facts:

  1.  **Actual Human Knowability:** For every true proposition *p*, there exists some actual human being who will (at some point in actual history) come to know *p*.  
      *Status:* **Simply false.** Many truths (e.g., specific prehistoric events) are lost forever.  
      *Blocks Undiscoverable Facts?* **No.** It fails to address truths forever inaccessible to *actual* humans.

  2.  **Idealized Human Knowability (Physical Constraints):** For every true proposition *p*, it is physically possible for some actual or possible human (with finite but sufficient resources, time, and cognitive capacity) to come to know *p*.  
      *Status:* **Substantive and defensible (but contentious).** Assumes no fundamental physical barrier prevents knowing any truth in principle.  
      *Blocks Undiscoverable Facts?* **Yes, if accepted.** It explicitly denies truths physically impossible for *any* (even idealized) human to discover.

  3.  **Possible Knower (Logical Possibility):** For every true proposition *p*, it is logically possible that some being (not necessarily human, possibly with superhuman capacities like infinite time or memory) knows *p*.  
      *Status:* **Triviality (or nearly so).** Only contradictions (which aren't true) are logically impossible to know.  
      *Blocks Undiscoverable Facts?* **No.** It allows truths forever undiscoverable *by humans* or *in the actual world*, as long as an inconceivable being *could* know them in some logically possible world.

  4.  **Non-Vacuous Knowability (Fitch-vulnerable):** For every true proposition *p*, it is possible (logically or epistemically) *that p is known* (without specifying *who* or *how*). Equivalent to: ~(∃p)(p & ~◊Kp).  
      *Status:* **Simply false (due to Fitch's Paradox).** This reading collapses into "All truths are actually known" (∀p(p → Kp)) under minimal assumptions about knowledge and possibility, which is absurd.  
      *Blocks Undiscoverable Facts?* **Intended to, but fails.** Its absurd consequence renders it unusable for this purpose.

  5.  **Verificationist Principle (Epistemic Constraint):** Truth is constitutively tied to knowability. A proposition *p* is true *only if* it is in principle possible to verify/know it (understood as epistemically constrained possibility, often tied to human capabilities or idealized rational inquiry). "Every truth can be known" defines the nature of truth.  
      *Status:* **Substantive and defensible (core anti-realist claim).** This is a philosophical thesis about the meaning of "truth," not an empirical claim.  
      *Blocks Undiscoverable Facts?* **Yes, by definition.** The very notion of a "truth" that is *in principle* undiscoverable is rejected as incoherent. This is the reading **most likely in play** in the seminar, treating undiscoverable facts as unintelligible.
