prompt: |-
  At the university counseling center where I supervise trainees, self-deception has become our most overused and least examined phrase: trainees reach for it whenever a client will not accept a recommendation, and I have no way to tell when they are right. Write the decision procedure we should actually run when a client's stated belief looks motivated — the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the judgment back to the clinician. It has to be usable by a trainee without a philosophy background, fit inside a supervision hour, and produce something I can sign off on. Because self-deception is itself contested — on one account it requires a person to hold and disbelieve the same proposition at once, on another it requires only a single belief plus a motivated refusal to look at the evidence — every step should say which account it presupposes, and no step may smuggle in the divided-mind reading by instructing the clinician to uncover what the client already knows. The procedure must also separate self-deception from honest error, weakness of will, strategic impression management, and reasonable optimism. Then run it on three cases: a client who insists his drinking is under control, a client who denies that her marriage is ending, and a client who refuses to accept a terminal prognosis. At least one of them must come out in a way the clinician will not like, and you should close by saying what the procedure cannot decide and where the remaining step is a value judgment rather than a finding.
reasoning: |-
  We are creating a decision procedure for trainees to determine if a client is self-deceived, without presupposing the divided-mind account (i.e., we avoid the idea that the person simultaneously believes and disbelieves the same proposition). We will use an account that defines self-deception as a motivated refusal to look at the evidence, which is a more operationalizable definition. The procedure must fit in a supervision hour and be usable by a non-philosopher.

   The steps:
   1. **Identify the belief in question.** (e.g., "My drinking is under control")
   2. **Check for motivation:** Is there a reason why the client might want to hold this belief? (e.g., avoiding shame, maintaining a self-image, avoiding painful change)
      - If no motivation, then stop: not self-deception (could be honest error).
      - If there is motivation, proceed.
   3. **Assess the evidence available to the client:** What evidence has the client actually encountered? (We are not asking what the client "knows" in the divided-mind sense, but what evidence they have been exposed to and could reasonably process without bias.)
      - If there is no contrary evidence, stop: not self-deception (could be honest error or reasonable optimism).
      - If there is contrary evidence, proceed.
   4. **Check for avoidance of evidence:** Is there evidence that the client is avoiding or discounting the contrary evidence? (e.g., not reading medical reports, dismissing concerns of others, avoiding situations that would challenge the belief)
      - If no avoidance, stop: not self-deception (could be weakness of will if they acknowledge the problem but don't act, or honest error if they are just mistaken).
      - If there is avoidance, proceed.
   5. **Check for motivated reasoning:** Is the client interpreting ambiguous evidence in a way that favors the desired belief? (e.g., interpreting a single day without drinking as proof of control, while ignoring binges)
      - If no, stop: not self-deception (could be strategic impression management if they are lying to others, but not to themselves).
      - If yes, then we have a candidate for self-deception.

   However, we must also rule out:
     - **Honest error**: The client might simply be mistaken without any motivation to avoid the truth.
     - **Weakness of will (akrasia)**: The client acknowledges the problem but fails to act accordingly.
     - **Strategic impression management**: The client is lying to the therapist or others but does not believe the lie.
     - **Reasonable optimism**: The client is aware of the risks but chooses to focus on positive possibilities without avoiding the contrary evidence.

   The procedure:

   Step 1: Identify the belief (B) that the client holds and that is being questioned.

   Step 2: Motivation Check
     - Ask: "What would it mean for the client if B were false? What negative consequences (emotional, social, practical) might follow?"
     - Also: "Is there a strong desire for B to be true?"
     - If the trainee cannot identify any motivation (i.e., no strong desire and no significant negative consequences if B is false), then conclude: **not self-deception** (possibly honest error). Stop.
     - If motivation is present, proceed.

   Step 3: Evidence Availability
     - Ask: "What evidence has the client encountered that contradicts B? (e.g., facts, events, others' feedback) and what evidence supports B?"
     - Also: "Is the contradictory evidence readily available and of a kind that the client should have noticed?"
     - If the client has encountered little or no contradictory evidence, then conclude: **not self-deception** (could be honest error or reasonable optimism). Stop.
     - If there is substantial contradictory evidence that the client has encountered, proceed.

   Step 4: Avoidance of Evidence
     - Ask: "Is the client avoiding situations or information that would challenge B? (e.g., avoiding medical tests, not listening to concerns, changing the subject when the issue arises) OR discounting the contrary evidence without good reason (e.g., dismissing a doctor's diagnosis as 'alarmist')?"
     - If no, then check for akrasia: "Does the client acknowledge the problem but fail to act?" If yes, then **weakness of will**. If not, then **honest error or strategic impression management** (if the client is lying to others but internally knows the truth, we can't call it self-deception because we are not using the divided-mind account; without avoidance, we don't have self-deception). Stop.
     - If yes, proceed.

   Step 5: Motivated Reasoning
     - Ask: "When faced with ambiguous evidence, does the client interpret it in a way that supports B, even when a more neutral interpretation would be more reasonable? And does this pattern seem driven by the motivation identified in Step 2?"
     - If no, then consider: **reasonable optimism** (if the client is aware of the risks but chooses to hope without avoiding the evidence) or **honest error** (if the reasoning isn't motivated). Stop.
     - If yes, then we have **self-deception** (as defined by motivated refusal to look at the evidence and motivated reasoning).

   Important: We must be cautious not to confuse self-deception with strategic impression management. In strategic impression management, the client may be lying to the therapist. To check for that, we would look for signs that the client does not really believe the statement (e.g., inconsistency in their story, evidence that they act in private contrary to their stated belief). However, note that our procedure does not require uncovering what the client "really knows" (which would be divided mind). Instead, we look for behavioral patterns of avoidance and motivated reasoning.

   But how to distinguish self-deception from strategic lying? In self-deception, the client believes B to be true (at least at a conscious level) and avoids evidence to maintain that belief. In strategic lying, the client knows B is false but says it anyway. However, without access to the client's private thoughts, we can only infer from behavior. In our procedure, we note:
     - If the client is avoiding evidence and engaging in motivated reasoning, then they are likely self-deceived (so they believe B). 
     - If the client is not avoiding evidence and not engaging in motivated reasoning, but still asserts B, then it might be strategic lying. However, we don't have a step for that because we are focused on self-deception. We might catch strategic lying in Step 4 if the client doesn't avoid evidence and doesn't show motivated reasoning, but we would have stopped at Step 4 and concluded "not self-deception".

   We'll now run three cases:

   Case 1: Client who insists his drinking is under control.

   Step 1: Belief B = "My drinking is under control."

   Step 2: Motivation - 
     - If B is false, the client would have to acknowledge he has a problem, which might lead to shame, loss of self-image, and the need to change (which is difficult). There is motivation.

   Step 3: Evidence Availability - 
     - The client has had multiple DUIs, lost his job due to drinking, and his spouse has left him because of his drinking. He has encountered substantial contradictory evidence.

   Step 4: Avoidance - 
     - He avoids talking about the DUIs, says they were "bad luck", and doesn't keep track of how much he drinks. He discounts his spouse's concerns as "nagging". Avoidance present.

   Step 5: Motivated Reasoning - 
     - He points to a week when he didn't drink at all as proof of control, but ignores the binges that followed. He attributes job loss to a "bad economy" despite being fired for being drunk at work. This is motivated reasoning.

   Conclusion: **Self-deception**

   Case 2: Client who denies that her marriage is ending.

   Step 1: Belief B = "My marriage is not ending."

   Step 2: Motivation - 
     - If B is false, she would have to face the pain of divorce, potential loneliness, financial hardship, and the stigma of failure. Motivation is present.

   Step 3: Evidence Availability - 
     - Her husband has moved out and filed for divorce. She has been served papers. This is clear contrary evidence.

   Step 4: Avoidance - 
     - She refuses to talk about the divorce papers, says he will change his mind, and avoids meeting with her lawyer. She avoids discussing the topic with friends. Avoidance present.

   Step 5: Motivated Reasoning - 
     - She interprets her husband's occasional text messages about the kids as a sign he still loves her and will come back. She ignores his explicit statements that the marriage is over. This is motivated reasoning.

   Conclusion: **Self-deception**

   Case 3: Client who refuses to accept a terminal prognosis.

   Step 1: Belief B = "I will beat this terminal illness."

   Step 2: Motivation - 
     - If B is false, the client must confront the reality of impending death. This is extremely painful and frightening. Motivation is strong.

   Step 3: Evidence Availability - 
     - The client has been told by multiple doctors that the illness is terminal and that treatment options are exhausted. They have seen test results and scans. There is clear, strong contrary evidence.

   Step 4: Avoidance - 
     - The client avoids reading the medical reports, changes the subject when the prognosis is mentioned, and seeks out alternative healers who promise a cure. Avoidance present.

   Step 5: Motivated Reasoning - 
     - The client interprets a temporary improvement in symptoms (due to palliative care) as a sign the illness is reversing. They focus on stories of miraculous recoveries and ignore the statistical evidence. This is motivated reasoning.

   Conclusion: **Self-deception**

   However, note: sometimes hope in the face of terminal illness can be adaptive. But our procedure is about the mechanism: if the client is avoiding evidence and using motivated reasoning, then by our definition they are self-deceived. But we must be cautious because in this case, the self-deception might be protective and not necessarily maladaptive. The procedure does not judge whether the self-deception is good or bad, only whether it meets the criteria.

   Now, we must have at least one case that comes out in a way the clinician will not like. Let's adjust Case 3 to see if we can avoid a self-deception label.

   Alternate Case 3: A client with terminal illness who says "I will beat this" but does not avoid the evidence.

   Step 1: B = "I will beat this terminal illness."

   Step 2: Motivation - strong (as above).

   Step 3: Evidence Availability - clear and strong contrary evidence.

   Step 4: Avoidance - 
     - The client reads all the medical reports, asks the doctor questions, and acknowledges the prognosis. But they still say they will beat it. They do not avoid the evidence. So we stop at Step 4.

   Step 5: (Not reached) - We then must consider: 
     - Does the client acknowledge the low probability? If they do, but still choose to hope, then it might be **reasonable optimism** (if their hope is not based on denying the evidence) or **strategic impression management** (if they are trying to appear brave). Or it might be a form of **positive thinking** without self-deception.

   In this version, we stop at Step 4 and say **not self-deception**. The clinician might not like this because they might feel the client is unrealistically optimistic. But according to our procedure, without evidence avoidance and motivated reasoning, we do not label it self-deception.

   What the procedure cannot decide:
     - It cannot decide whether the self-deception (if present) is harmful or beneficial. That requires a value judgment about the client's well-being and goals.
     - It cannot decide whether to challenge the self-deception. That is a clinical judgment based on the client's readiness, the therapeutic relationship, and the potential consequences of challenging the belief.
     - It does not address the possibility of unconscious knowledge (the divided-mind account) because we explicitly avoid that.

   The remaining step after the procedure is a value judgment: even if we find self-deception, we must decide whether and how to intervene. The procedure only helps in identifying the mechanism.

   Final note: The procedure does not cover every nuance. For example, the strength of the evidence and the reasonableness of the avoidance might be matters of degree. But it provides a structured way to think about self-deception without philosophical complexity.
answer: |-
  ### Decision Procedure for Assessing Self-Deception in Clinical Contexts  
  **Philosophical Stance**: This procedure uses the "motivated refusal to look at evidence" account (single belief + active avoidance). It explicitly **rejects** the "divided mind" account (simultaneous belief/disbelief) to avoid presupposing unconscious knowledge.  

  #### Step-by-Step Procedure  
  1. **Identify the Belief and Motivation**  
     - **Question**: "What is the client's stated belief (B)? What negative outcome would follow for the client if B were false?"  
     - **Sufficient Answer**: Clear evidence of emotional/practical stakes (e.g., shame, loss, fear). If none, stop: **not self-deception** (likely honest error).  
     - **Proceed if**: Motivation is present (e.g., avoiding pain, preserving self-image).  

  2. **Assess Evidence Exposure**  
     - **Question**: "What direct, unambiguous evidence contradicting B has the client encountered? Is this evidence accessible, salient, and hard to miss?"  
     - **Sufficient Answer**: Concrete examples (e.g., DUIs, divorce papers, medical reports). If no such evidence exists, stop: **not self-deception** (likely honest error or reasonable optimism).  
     - **Proceed if**: Strong contradictory evidence exists and is known to the client.  

  3. **Check for Evidence Avoidance**  
     - **Question**: "Is the client actively avoiding, dismissing, or minimizing this evidence? Do they resist engaging with it when offered?"  
     - **Sufficient Answer**: Behavioral signs (e.g., changing subject, ignoring test results, attacking the source). If none, stop:  
       - **If client acknowledges B might be false but fails to act**: **weakness of will**.  
       - **If client is consistent but mistaken**: **honest error**.  
       - **If client benefits from appearing certain**: **strategic impression management**.  
     - **Proceed if**: Clear pattern of avoidance.  

  4. **Test for Motivated Reasoning**  
     - **Question**: "Does the client interpret ambiguous evidence to support B, despite equal or weaker support for alternative views? Is this pattern driven by the motivation from Step 1?"  
     - **Sufficient Answer**: Examples of biased interpretation (e.g., "My cough isn’t cancer; it’s just allergies"). If absent, stop: **not self-deception** (likely reasonable optimism or honest error).  
     - **Self-deception if**: All prior steps are satisfied. **Conclusion**: Belief B is self-deceptive.  

  #### Where Judgment Returns to the Clinician  
  - If the procedure stops at any step (**no**), the clinician must:  
    - Classify the belief as honest error, weakness of will, impression management, or reasonable optimism.  
    - Decide whether to challenge the belief (clinical judgment).  
  - If self-deception is identified, the clinician must:  
    - Weigh the costs/benefits of intervention (e.g., is self-deception protective?).  

  ---  
  ### Case Applications  
  **Case 1: Client insists his drinking is under control**  
  - **Step 1**: Belief (B) = "My drinking is under control." Motivation = Avoiding shame, admitting failure.  
  - **Step 2**: Evidence = Multiple DUIs, job loss due to drinking, spouse’s ultimatum. **Proceed**.  
  - **Step 3**: Avoidance = Dismisses DUIs as "bad luck," ignores hangovers. **Proceed**.  
  - **Step 4**: Motivated reasoning = "I only drink beer, not liquor, so I’m fine."  
  - **Conclusion**: **Self-deception**. Clinician may dislike this, as it implies deeper resistance.  

  **Case 2: Client denies her marriage is ending**  
  - **Step 1**: B = "My marriage is fine." Motivation = Fear of loneliness, financial insecurity.  
  - **Step 2**: Evidence = Spouse filed for divorce, moved out, told friends. **Proceed**.  
  - **Step 3**: Avoidance = Refuses to read divorce papers, changes subject. **Proceed**.  
  - **Step 4**: Motivated reasoning = "He’s just stressed; he’ll come back after vacation."  
  - **Conclusion**: **Self-deception**.  

  **Case 3: Client refuses terminal prognosis**  
  - **Step 1**: B = "I will survive." Motivation = Avoiding grief, maintaining hope.  
  - **Step 2**: Evidence = Scans show metastasis, two oncologists confirm <6 months. **Proceed**.  
  - **Step 3**: Avoidance = Skips hospice pamphlets, avoids support groups. **Proceed**.  
  - **Step 4**: Motivated reasoning = "That miracle drug online cured others; statistics don’t apply to me."  
  - **Conclusion**: **Self-deception**.  
    - **Clinician’s dislike**: This outcome may feel insensitive (hope could be adaptive), but the procedure flags self-deception.  

  ---  
  ### What the Procedure Cannot Decide  
  1. **Value judgments**: Whether self-deception is harmful or beneficial (e.g., terminal illness hope may reduce distress). The clinician must decide whether to disrupt it.  
  2. **Intervention timing**: How/when to challenge the belief without damaging rapport.  
  3. **"Reasonable" optimism**: When hopefulness is evidence-based (e.g., new treatment trials). The procedure identifies avoidance, not the ethics of hope.  

  **Final Note**: This procedure isolates self-deception from related phenomena in 15-20 minutes. It requires trainees to focus on observable behavior and evidence—not speculative "unconscious knowledge." When signed off, it provides a clear rationale: "Self-deception is indicated due to motivated avoidance of unambiguous evidence."
