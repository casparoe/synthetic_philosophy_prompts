prompt: |-
  I've got myself into a bit of a state over panpsychism and I need someone to do the sums with me. I'm doing an MA and I've been reading the panpsychism literature for a seminar — Goff, Russellian monism, the combination problem, all that — and I said I'd write a short peice for our department blog on the ethics of it, thinking it would be a doddle. It isn't, and now I can't stop turning it over. The bit that has got under my skin isn't whether panpsychism is true. It's this: if it is, then there's some sort of experience going on at the level of fields and particles, and if even a sliver of that experience is valenced — if there's anything there that is bad rather than just blank awareness — then the biggest moral fact about the universe might not be factory farming or wild animal suffering but whatever is going on in physics, all the time, everywhere, in quantities that make biology look like a rounding error. I tried this on two friends over a pint and got told it was word salad. I don't think it is, but I can't work out where the weight actually sits.

  So here's what I want, decomposed rather than a shrug. Give me your credence in this specific proposition: the total quantity of morally relevant suffering located in fundamental physical entities, should any of them be sentient, exceeds the total quantity of morally relevant suffering across all biological organisms, past, present and future. Break it into the bits it depends on — roughly, your probability that some form of panpsychism or Russellian monism is correct; conditional on that, your probability that fundamental experience is valenced at all rather than 'mere' feel; conditional on valence, your probability that a substantial share of it is negative; your probability that any defensible moral theory should weight such experience anywhere near what we give a pig or a dog; and whatever else you think belongs in the product. A number for each with one line of justification, then the combination, then tell me which term the final figure is most sensitive to.

  And please be self-critical rather than kind to me. If you think the move from 'there is experience in physics' to 'there is suffering in physics' is simply a fallacy, or that the proposition is barely meaningful enough to have a truth value, or that I'm smuggling in a utilitarian framework that's doing all the real work, say so plainly rather than humouring the framing — a low number with a clear reason is far more use to me than a sympathetic one. I'd also like to know which single argument or discovery would most change your mind, and where in your own reasoning you'd expect it to go wrong.
