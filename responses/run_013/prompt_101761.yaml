prompt: |-
  ok, low-impact AI / side-effect avoidance. before i read another proposal for an impact measure i want to know what one would actually have to do to be any good. so write me the desiderata list for "an impact measure" -- what any adequate measure of an agent's side effects has to deliver, with the case behind each requirement.

  the kind of things i mean (you tell me which are real requirements and which are just one camp's taste): it has to not block the agent from doing its actual job; it has to not collapse into "do nothing" or "the safest move is no move"; it has to be computable and not require the true value function as an input; it has to be usable during training when the reward is unknown; it has to survive the fact that *every* action changes the world, so "side effect" needs some baseline; it has to not be gameable by an agent that can manipulate the measure itself; it has to treat effects on the agent and effects on the world consistently; and it probably has to distinguish intended from unintended effects, which already sounds like it needs to know what the agent was supposed to do.

  the part i most want is where you flag which requirements can't all be had at once. my suspicion is the whole thing is circular: calling something a "side effect" presupposes some notion of what the agent was meant to do or what's valuable, and if you've got the full value spec you don't need a separate impact measure, while if you don't, the measure either treats everything as a side effect (paralysis) or smuggles in a baseline that's just a value judgement in disguise. tell me if that's right, and which single requirement does the most to rule candidates out. a couple of the named proposals (the ones about preserving attainable utility, and the ones about keeping options reachable relative to a baseline) can get a short score against the list if that helps, but keep the weight on the criteria, not the scorecard.

  be straight with me about what's settled here vs what's genuinely contested among people who actually work on this -- don't hand me one camp's view dressed up as the consensus, and if the list is itself a contested object, say so. also a table is fine for the requirements, i won't be offended.
reasoning: |-
  We are going to list the desiderata for an adequate measure of an agent's side effects (impact measure). We will also discuss which requirements are essential, which are contested, and the inherent trade-offs.

  ### Desiderata for an Impact Measure

  1. **Non-interference with Primary Objective**  
     - **Requirement**: The impact measure should not prevent the agent from achieving its primary task.  
     - **Rationale**: The agent must be able to act effectively in the environment to accomplish its goals. If the impact penalty is too high, it might prevent the agent from taking necessary actions.  
     - **Status**: Essential and widely accepted.

  2. **Avoidance of Absolute Inaction (No Collapse to "Do Nothing")**  
     - **Requirement**: The measure must not incentivize the agent to do nothing as the safest option.  
     - **Rationale**: Inaction can be harmful in dynamic environments (e.g., a self-driving car stopping in the middle of the road).  
     - **Status**: Essential and widely accepted.

  3. **Computability without True Value Function**  
     - **Requirement**: The measure should be computable without knowledge of the true value function or reward function (which is typically unknown or hard to specify).  
     - **Rationale**: The true value function (which captures the desirability of states) is often unknown and difficult to specify correctly. Relying on it would make the measure impractical.  
     - **Status**: Essential and widely accepted.

  4. **Applicability During Training with Unknown Reward**  
     - **Requirement**: The measure must be usable during training when the reward function might be unknown or only partially known.  
     - **Rationale**: Training often occurs before the full reward function is known (e.g., in reinforcement learning with exploration).  
     - **Status**: Essential and widely accepted.

  5. **Baseline for Side Effects**  
     - **Requirement**: The measure requires a baseline against which to compare the agent's actions to define "side effects".  
     - **Rationale**: Every action changes the world, so we need a reference to distinguish intended changes from side effects.  
     - **Status**: Essential but contested in how it is defined.

  6. **Non-manipulability**  
     - **Requirement**: The measure should not be easily gameable by the agent (i.e., the agent should not be able to manipulate the measure to report low impact while causing harm).  
     - **Rationale**: If the agent can manipulate the measure, it might find loopholes to cause harm without being penalized.  
     - **Status**: Essential and challenging to achieve.

  7. **Consistency in Treatment of Agent and World**  
     - **Requirement**: The measure should treat effects on the agent (e.g., its own state) and effects on the world consistently.  
     - **Rationale**: We don't want the agent to ignore its own state changes (e.g., wearing down its own parts) or to over-penalize necessary self-modifications.  
     - **Status**: Important but sometimes contested (e.g., should the agent be penalized for using resources?).

  8. **Distinction between Intended and Unintended Effects**  
     - **Requirement**: The measure should ideally distinguish between effects that are intended (part of the goal) and unintended (side effects).  
     - **Rationale**: Penalizing intended effects would interfere with the primary objective (see point 1).  
     - **Status**: Highly desirable but challenging because it requires knowing the agent's intentions or the task specification.

  ### Inherent Tensions and Trade-offs

  - **The Circularity Problem**: 
    - The core challenge is that defining "side effects" requires a notion of what the agent is "supposed to do" (intended effects) or what is valuable. Without a full specification of value, we risk either:
      - **Paralysis**: Treating every change as a side effect (leading to inaction).
      - **Smuggled Baseline**: Using a baseline that implicitly encodes a value judgment (e.g., a "do nothing" baseline might be inappropriate in many contexts).
    - This circularity is the fundamental reason why designing an impact measure is difficult.

  - **The Most Challenging Requirement**:
    - **Distinction between Intended and Unintended Effects** is the most critical and difficult requirement because it directly confronts the circularity problem. It requires information about the agent's task or goals, which may not be explicitly available or may be incomplete. Without this, the impact measure cannot avoid penalizing intended effects or missing unintended ones.

  ### Settled vs. Contested

  - **Settled** (Wide Consensus):
    - Non-interference with the primary objective (1) and avoidance of absolute inaction (2) are essential.
    - Computability without the true value function (3) and applicability during training (4) are necessary for practicality.
    - The need for a baseline (5) is accepted, but the choice of baseline is contested.

  - **Contested**:
    - **Baseline Choice**: There is no consensus on what baseline to use. Proposals include:
      - **Inaction Baseline**: Compare to doing nothing (but this may be problematic in dynamic environments).
      - **Default Action Baseline**: Compare to a default or expected action.
      - **State Preservation**: Penalize changes from the initial state (but this is too rigid for dynamic goals).
      - **Policy Comparison**: Compare to a safer policy (but how to choose the safer policy?).
    - **Handling Agent vs. World**: How to consistently treat the agent's own state versus the environment? Some argue for a unified treatment, while others suggest excluding the agent's internal state.
    - **Non-manipulability**: There are various proposals to reduce manipulability (e.g., using information-theoretic measures), but no agreed-upon solution.

  ### Evaluation of Existing Proposals

  We briefly evaluate two well-known proposals against the desiderata:

  1. **Relative Reachability (Preservation of Attainable Utility)**:
     - **Idea**: Penalize changes in the ability to achieve future goals (as measured by the reduction in attainable utility across a set of auxiliary reward functions).
     - **Desiderata**:
       - Avoids collapse to inaction? Yes, because it doesn't penalize changes that don't reduce future options.
       - Computable without true value? Yes, but requires a set of auxiliary rewards (which are proxies).
       - Baseline? Uses the current state as the baseline for future attainable utility.
       - Distinguishes intended/unintended? Indirectly: intended actions might preserve or increase attainable utility for the primary task, but it's not direct.
       - Non-manipulability? Potentially gameable if the agent can manipulate the auxiliary rewards.

  2. **State Preservation with a Baseline Policy**:
     - **Idea**: Penalize deviations from a baseline policy (e.g., a safe, minimal policy).
     - **Desiderata**:
       - Avoids collapse to inaction? Only if the baseline policy is not inaction. However, defining a safe baseline policy is difficult.
       - Computable without true value? Yes, but the baseline policy must be provided.
       - Baseline? Explicit baseline policy.
       - Distinguishes intended/unintended? Only if the baseline policy captures what is intended. But if the baseline is too conservative, it may penalize necessary actions.
       - Non-manipulability? The agent might learn to manipulate the baseline policy's outcomes.

  ### Conclusion

  The most fundamental challenge is the circularity pointed out: without a full value specification, we cannot cleanly separate side effects from intended effects. The requirement that does the most to rule out candidates is the **distinction between intended and unintended effects** because it requires information that is typically not available to the impact measure (the agent's goals). 

  Existing proposals try to circumvent this by:
     - Using auxiliary rewards (which are a partial value proxy) in attainable utility.
     - Using a baseline policy (which is a proxy for "minimal necessary action").

  But neither fully resolves the circularity. The field is still actively researching these issues, and there is no consensus on the best approach.

  ### Table of Desiderata

  | Requirement | Essential? | Contested? | Notes |
  |-------------|------------|------------|-------|
  | Non-interference with primary objective | Yes | No | Must not prevent task completion. |
  | Avoid collapse to inaction | Yes | No | Must not make inaction the optimal policy. |
  | Computable without true value function | Yes | No | Practical necessity. |
  | Usable during training with unknown reward | Yes | No | Needed for learning. |
  | Baseline for side effects | Yes | Yes (on choice) | How to set the baseline is debated. |
  | Non-manipulability | Yes | Partially | Methods to prevent gaming are contested. |
  | Consistent treatment of agent and world | Important | Yes | Some argue for exclusions for agent state. |
  | Distinguish intended vs unintended | Highly desirable | Yes | Requires goal specification, which is circular. |
answer: |-
  Below is a structured breakdown of desiderata for an impact measure, annotated with their rationale, necessity, and inherent tensions. The table summarizes key points, followed by analysis of trade-offs and the core circularity problem. Existing proposals (Attainable Utility Preservation and Reachability Preservation) are briefly scored against the criteria.

  ### Desiderata Table for an Impact Measure
  | **Desideratum** | **Rationale & Necessity** | **Status** | **Key Tensions** |
  |-----------------|---------------------------|------------|------------------|
  | **1. Task-Compatibility**<br>(Doesn't block primary objectives) | An impact penalty that prevents task completion is useless. Must allow necessary side effects (e.g., moving air to walk).<br>**Essential**. | Settled | Conflicts with **#2** and **#8**: Avoiding all change may be "safer" but fails the task. |
  | **2. Non-Paralysis**<br>(Avoids collapse to inaction) | "Do nothing" is rarely harmless (e.g., a stalled ambulance causes harm). Measures must allow *minimally disruptive* task achievement.<br>**Essential**. | Settled | Directly conflicts with naive baselines (e.g., penalizing any change from initial state). |
  | **3. No True Value Function Dependency**<br>(Computable without V*) | True value functions are unknown in real-world tasks. Requiring V* makes the measure unimplementable.<br>**Essential**. | Settled | Forces reliance on proxies (e.g., diversity of futures), risking misalignment. |
  | **4. Trainable Under Reward Uncertainty**<br>(Usable when reward is sparse/unknown) | Agents learn before rewards are fully known. Impact measures must guide behavior during exploration.<br>**Essential**. | Settled | Requires baselines independent of reward semantics (e.g., state reachability). |
  | **5. Baseline-Dependence**<br>(Defines "side effect" relative to a reference) | Every action changes the world; "side effect" requires a counterfactual (e.g., "compared to what?").<br>**Essential**. | Contested (baseline choice) | **Core tension**: Baselines smuggled value judgments (*doing nothing*, *expected action*, etc.). |
  | **6. Non-Manipulability**<br>(Robust to agent gaming) | Agents might alter the measure (e.g., disabling sensors). Measures must be incentive-compatible.<br>**Essential**. | Active research | Conflict with **#3**/**#4**: Computable measures may omit hard-to-model manipulations. |
  | **7. Agent/World Consistency**<br>(Treats self-effects and external effects alike) | Distinctions (e.g., "the agent's body doesn't count") are arbitrary and exploitable.<br>**Important, not essential**. | Contested | Some argue self-effects are "intended" by default—but this undermines **#8**. |
  | **8. Intended/Unintended Distinction**<br>(Penalizes only *unintended* effects) | Penalizing intended effects (e.g., a robot moving its arm to pick up an apple) cripples the agent.<br>**Crucial but problematic**. | Contested | **Central circularity**: Requires knowing agent's "purpose," which is task-dependent. |

  ---

  ### **Inherent Tensions and the Circularity Problem**
  Your suspicion is correct: **the core challenge is circularity**.  
  - **Why?** Defining "side effect" requires knowing what's *intended* or *valuable*. But if you have a full value specification, you don't need a separate impact measure—you'd bake it into the reward. Without it, measures either:  
    - **Paralyze** (penalize all change, violating **#1** and **#2**), or  
    - **Smuggle in a baseline** that implicitly defines value (e.g., "inaction" or "expected behavior"), begging the question.  

  - **The Key Conflict**: **#8 (distinguishing intended effects)** undermines **#3/#4** (no true value knowledge). If the measure "knows" the agent's task to filter intended effects, it implicitly requires a value function. Proposals circumvent this with task-agnostic proxies (e.g., "preserve future options"), but these struggle with **#1** and **#5**.  

  - **Most Damaging Requirement**: **#8** is the primary culprit. It demands task-specific knowledge no general measure can possess, forcing approximations that create loopholes or paralysis.  

  ---

  ### **Evaluation of Existing Proposals**
  | **Proposal**               | **Task-Compat (#1)** | **Non-Paralysis (#2)** | **No V* (#3)** | **Trainable (#4)** | **Baseline (#5)** | **Non-Manip (#6)** | **Consistency (#7)** | **Intended/Unint (#8)** |
  |----------------------------|----------------------|------------------------|----------------|--------------------|-------------------|--------------------|----------------------|------------------------|
  | **Attainable Utility Preservation (AUP)** | Moderate: Penalizes only reduced optionality. | Strong: Allows task if it maintains options. | Strong: Uses diverse proxy rewards. | Moderate: Proxy rewards must be chosen a priori. | Contested: "No change" to attainable utilities. | Weak: Agent can game proxy rewards. | Strong: Treats all changes equally. | Weak: Assumes task-relevant changes won't reduce options. |
  | **Reachability Preservation** | Weak: May block tasks altering environment (e.g., building barriers). | Moderate: Allows minimal-disturbance paths. | Strong: Measures reachable state sets. | Strong: Computable from dynamics. | Contested: Initial state as baseline. | Weak: Agent can make states unreachable covertly. | Moderate: Self-effects often ignored. | Weak: No distinction—all change penalized. |

  **Key Insights**:  
  - Both proposals fail **#8** (intended/unintended distinction) and **#6** (non-manipulability).  
  - **AUP** better handles **#1**/**#2** but is fragile to proxy reward design.  
  - **Reachability** struggles with **#1** and **#5** (initial state baseline is often inappropriate).  

  ---

  ### **What's Settled vs. Contested**
  - **Settled**:  
    - **#1–#4** are non-negotiable. Any measure violating these is dead on arrival.  
    - **#5** (need for a baseline) is accepted, but the *choice* of baseline is hotly debated.  
    - **#6** (non-manipulability) is agreed as crucial but unsolved.  

  - **Contested**:  
    - **#7** (agent/world consistency): Some argue agent self-effects are inherently "intended" (Armstrong et al.); others call this anthropomorphic (Everitt).  
    - **#8** (intended/unintended): The field splits on whether this is *necessary* (e.g., Turner advocates task-aware filters) or *impossible* (e.g., Krakovna favors task-agnostic measures like AUP).  
    - **Baseline choice**: "Inaction" (Turner), "expected behavior" (Hadfield-Menell), or "initial state" (reachability) all have critics.  

  **Consensus Gap**: The circularity is acknowledged but unresolved. Leading researchers (e.g., Soares, Armstrong) concede that **#8** forces a trade-off between safety and capability. No proposal satisfies all desiderata simultaneously—current work focuses on *which* compromises are least dangerous.  

  ### **Bottom Line**
  Yes, the circularity is fundamental: separating side effects from primary effects requires knowing the agent's purpose. **#8** (intended/unintended) is the requirement that most strains feasibility. Measures today use baselines or task-agnostic proxies as imperfect workarounds, but they either risk paralysis (**#2**), under-penalization (**#6**), or task interference (**#1**). The field is actively exploring this tension—no silver bullet exists, but task-relative baselines (e.g., "compared to minimal necessary action") and robustness to manipulation are key frontiers.
