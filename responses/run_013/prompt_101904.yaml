  Breaking it down: 
  - The structural/dialectical distinction seems crucial. When they say infinitism is defensible structurally but absurd dialectically, that clicks. Foundationalism makes sense dialectically (you stop at basic beliefs) but structurally, basic beliefs feel like a handwave. Coherentism... if we see it as systemic justification, circularity becomes less problematic. 

