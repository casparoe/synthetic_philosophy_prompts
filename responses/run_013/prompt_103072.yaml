prompt: |-
  I'm a third-year student in a seminar on transitional justice, and our final assessment is a simulation. The class is constituted as a national commission of inquiry for an invented country emerging from a twelve-year civil conflict, and I have been assigned to draft the procedure by which the commission will adjudicate applications for amnesty. The mandate we were given is deliberately ugly: eighteen months, roughly forty thousand named alleged perpetrators, and a political settlement that the outgoing security leadership signed only on the assurance that the process would not become a victor's tribunal — while the victims' associations have made equally clear that anything resembling a blanket amnesty will be received as a second betrayal. I do not want an essay on the justice-versus-peace tradeoff; I want the instrument itself, and I want it grounded in what the actual commissions got right and wrong (the conditional amnesty that required full disclosure in South Africa, the oscillation between trials and amnesty laws in Argentina, the community-court route in Rwanda), though please do not give me citations or a reading list — I need this to stand on its own.

  What I need is a decision procedure a case officer with no theory training could run on a single application in about an hour and hand to a panel for signature. Give me the questions in the order they should be asked, what counts as a sufficient answer to each, the point at which the procedure stops with a refusal, and the point at which it must hand the file to a human because the remaining question is one of value rather than fact. It should sort every applicant into a small number of outcome categories — for example referral to prosecution, amnesty conditioned on some act by the applicant, amnesty without condition, or no decision — and it should say what makes a case fall out of the scheme altogether. Two things I find genuinely confusing and would like the procedure to resolve rather than dodge: first, I keep being told that amnesty conditioned on disclosure is a form of accountability rather than its abdication, and I cannot see how a procedure could make that more than a slogan when the commission has no way to verify most disclosures; second, I cannot tell whether the severity of the act, the rank of the perpetrator, or the willingness of the perpetrator to tell the truth should be doing the real work, and I suspect that choosing among those three is already a political decision disguised as a test.

  Please then run the procedure on three applications: a mid-level commander who gives a complete and apparently candid account, names his superiors, and personally ordered two massacres; a conscripted teenager who participated in one killing and has been in therapy since; and a senior architect of the policy who refuses to disclose anything, whose faction's cooperation the settlement still depends on. Tell me plainly which of the three the procedure handles worst, and where it produces an answer I will not like. Finally, be honest about what the procedure cannot do at all, and about which of the theoretical distinctions you had to flatten in order to make it usable — and which ones you refused to flatten, because a case officer who could not see them would get the case wrong.
reasoning: |-
  We are designing a procedure for a national commission of inquiry in an invented country emerging from a civil conflict. The procedure must adjudicate amnesty applications within tight constraints (18 months, 40,000 alleged perpetrators). The goals are:
   - Avoid being a victor's tribunal.
   - Avoid a blanket amnesty (which victims would see as a betrayal).
   - The procedure must be executable by a case officer in about an hour per application and result in a clear outcome category.

   The procedure will be grounded in lessons from real commissions (South Africa's conditional amnesty requiring full disclosure, Argentina's oscillation, Rwanda's community courts) but without citations.

   The procedure must sort each applicant into one of the following outcome categories:
    1. Referral to prosecution (for criminal trial).
    2. Conditional amnesty (amnesty granted only if the applicant fulfills a condition, e.g., disclosure, reparative act).
    3. Unconditional amnesty (amnesty granted without conditions).
    4. No decision (for cases that do not fit or require further review by a panel for reasons of complexity).

   Additionally, the procedure must specify when a case falls out of the scheme (e.g., when the act is not within the commission's mandate).

   We address two key confusions:
    a) How conditional amnesty (especially conditioned on disclosure) is a form of accountability even without verification? 
      - The idea is that the act of disclosure itself, when done publicly and under penalty of perjury (if later found false), can be a form of accountability. It forces the perpetrator to confront their actions and provides a record for history. Also, the commission can use cross-referencing (multiple perpetrators involved in the same event) and victim testimony to check consistency. While not foolproof, it is a practical compromise.

    b) The role of severity, rank, and truthfulness? 
      - We will design a procedure that uses all three but in a sequential manner. The procedure will first screen for the nature of the act and the rank of the perpetrator (to avoid being a victor's tribunal and to address the most serious crimes appropriately). Then it will consider the applicant's cooperation and truthfulness. However, we acknowledge that the weighting is inherently political. We will make the weighting explicit in the procedure.

   The Procedure:

   Step 0: Preliminary Check (Mandate and Eligibility)
     - Question: Is the alleged act within the commission's temporal mandate (the 12-year civil conflict) and within the types of acts covered (e.g., war crimes, crimes against humanity, gross human rights violations)? 
       - If NO: Case falls out of the scheme. Outcome: No amnesty possible (but note: the commission might not have the power to prosecute, so the file may be referred to the ordinary justice system if the act is a crime under ordinary law? However, the mandate is for the conflict period. We must clarify: the commission only deals with conflict-related acts. If the act is not conflict-related, it is outside the mandate and the commission does not handle it. The applicant must be informed that they are not eligible for amnesty for that act and may face ordinary prosecution.)
       - If YES: Proceed.

   Step 1: Severity and Nature of the Act(s)
     - Question: What is the severity of the act(s) for which amnesty is sought? We categorize:
          Category A: Crimes that are of the most severe nature (e.g., genocide, crimes against humanity, war crimes involving widespread killing, torture, sexual violence, or systematic persecution).
          Category B: Other serious human rights violations (e.g., beatings, destruction of property, enforced disappearances, but not at the scale or systematic level of A).
          Category C: Lesser crimes (e.g., theft, minor assault, or acts that were part of the conflict but not grave breaches).

     - How to determine: The case officer will review the application and any accompanying evidence (victim statements, NGO reports, etc.) to assign a category. The officer must note the number of victims and the manner of commission (e.g., was it part of a systematic pattern?).

     - Outcome:
          If the act is in Category A: Proceed to Step 2 (Rank and Role).
          If the act is in Category B: Skip Step 2 and proceed to Step 3 (Cooperation and Truthfulness).
          If the act is in Category C: Skip to Step 4 (Condition Setting).

     Why this order? 
        - The most severe crimes (A) require scrutiny of the perpetrator's rank and role because high-ranking officials may be ineligible for amnesty (to avoid impunity for leaders). 
        - Less severe crimes (B, C) can be dealt with more leniently, focusing on the applicant's cooperation.

   Step 2: Rank and Role (only for Category A acts)
     - Question: What was the applicant's rank and role in the commission of the act?
          Rank: 
            High: Senior leadership (e.g., generals, top political leaders, architects of policy)
            Mid: Commanders at operational level (e.g., battalion commanders, mid-level officials)
            Low: Foot soldiers, conscripts, those following orders

          Role:
            Planner/Orderer: Designed the operation or gave the order.
            Direct Perpetrator: Carried out the act.
            Aider/Abettor: Assisted in the commission.

     - Outcome:
          If the applicant is High rank AND their role was Planner/Orderer: 
              Outcome: Referral to prosecution. (Reason: The political settlement may have required that leaders not be granted amnesty to avoid victor's tribunal, but also to satisfy victims. This is a critical political decision: top architects cannot hide behind the commission.)

          If the applicant is Mid rank AND role was Planner/Orderer: 
              Proceed to Step 3 (Cooperation and Truthfulness).

          If the applicant is Low rank OR (Mid rank but not Planner/Orderer) OR High rank but only Aider/Abettor (unlikely, but possible) then:
              Proceed to Step 3.

     Note: We are making a political choice here: High-level planners/orderers of Category A crimes are automatically referred for prosecution. This reflects the principle that those most responsible must be held accountable in a court.

   Step 3: Cooperation and Truthfulness
     - Question: Has the applicant provided a full and candid disclosure of the acts for which amnesty is sought, including their own role and the roles of others (superiors and subordinates) to the best of their knowledge?
          Criteria for sufficient answer:
            - The disclosure must cover: what happened, when, where, who was involved (including superiors and subordinates), and why (the context and orders).
            - The account must be internally consistent and consistent with known facts (if any are available in the file).

     - Assessment:
          Full and candid: The applicant has provided a detailed account that covers all the above and does not appear to be evasive. There may be gaps in memory, but the applicant has not concealed known facts.
          Partial: The applicant provides some details but omits key aspects (e.g., does not name superiors, downplays their own role, or denies knowledge of key elements).
          None/Refusal: The applicant refuses to disclose or provides a completely false account (contradicted by evidence).

     - Outcome:
          If Full and candid: Proceed to Step 4 (Condition Setting).
          If Partial: The case officer must note the gaps and proceed to Step 4, but the conditions will be more stringent (e.g., require the applicant to appear before a panel to answer questions, or require additional disclosure within a set time).
          If None/Refusal: Outcome: Referral to prosecution. (Reason: Without disclosure, there is no basis for amnesty as a form of accountability.)

     How to handle verification? 
          The case officer cannot verify every detail. They must rely on:
            - Internal consistency of the statement.
            - Consistency with other statements (if available) or known facts from the commission's database (e.g., other perpetrators' accounts of the same event, victim accounts, NGO reports).
            - If there is a direct contradiction with a known fact (e.g., the applicant denies being present but a reliable witness places them there), then the disclosure is not candid.

          The commission may have a unit that cross-references disclosures. However, for the hour-long initial assessment, the case officer does a preliminary check.

   Step 4: Condition Setting
     - Question: What conditions, if any, should be imposed for amnesty?
          This step determines whether amnesty is conditional or unconditional.

     - Factors:
          a) Severity of the act (from Step 1): 
              - Category A: Amnesty must be conditional (at a minimum, the disclosure is already a condition, but additional conditions may apply).
              - Category B: Usually conditional, but conditions may be less onerous.
              - Category C: May be unconditional.

          b) Cooperation (from Step 3):
              - Full and candid: The condition may be limited to the disclosure already provided (and perhaps a public acknowledgment of responsibility, if the commission has such a mechanism).
              - Partial: Additional conditions are required (e.g., a public hearing to answer questions, participation in a reparations program, community service).

          c) Reparative potential: The commission may require acts that contribute to reparation (e.g., revealing the location of remains, returning stolen property, contributing to a victims' fund).

     - Outcome:
          The case officer must propose one of:
            - Unconditional amnesty: Only for Category C acts with full cooperation, or in exceptional circumstances for Category B (e.g., a low-level perpetrator who was a minor at the time and has shown remorse).
            - Conditional amnesty: The applicant must fulfill specified conditions (e.g., appear at a public hearing, make a written apology, complete community service). The conditions must be clear and achievable within a set timeframe.
            - Note: For Category A acts, amnesty is always conditional (at minimum on disclosure).

          Then, the case officer writes a summary and the proposed outcome and sends the file to a panel for signature.

   Step 5: Panel Review
     - The panel (composed of commissioners or senior staff) reviews the case officer's recommendation and the file. They may:
          - Approve the recommendation.
          - Require further investigation or a hearing.
          - Change the outcome.

     - The panel is particularly important for cases that are borderline or where the case officer has flagged a need for human judgment (e.g., when the truthfulness is questionable but not clearly false).

     - The panel also handles cases where the applicant is a senior figure whose amnesty might have political implications (even if the procedure says referral to prosecution, the panel must confirm).

   What about cases that are complex and cannot be decided in an hour?
     - The procedure allows for the case officer to flag the case for panel review at any step if they encounter a complexity that the procedure does not cover (e.g., conflicting evidence, political sensitivity). The outcome then becomes "No decision" until the panel reviews.

   Outcome Categories:
     1. Referral to prosecution: For cases that fail at Step 2 (high-level planners of Category A) or Step 3 (non-cooperation) or for acts outside the mandate (but note: outside mandate is not referred by the commission? It would be handled by the ordinary justice system. The commission would simply note ineligibility and close the case, but the file might be shared with the prosecutor if the act is a crime. We must clarify the mandate.)

     2. Conditional amnesty: The applicant must fulfill conditions (to be specified) to receive amnesty.

     3. Unconditional amnesty: Granted without conditions (for less severe crimes with full cooperation).

     4. No decision: The case is referred to the panel for deeper review.

   Falling out of the scheme: 
     - Acts not within the temporal mandate or not conflict-related: The commission does not grant amnesty and the case is closed (but the applicant may be subject to ordinary prosecution).

     - Note: The commission might also have jurisdiction only over certain types of acts (e.g., politically motivated crimes). The case officer must check that.

   Now, we run the procedure on three applications:

   Application 1: A mid-level commander who gives a complete and apparently candid account, names his superiors, and personally ordered two massacres.

     Step 0: The acts (massacres) are within the mandate (conflict-related). Proceed.

     Step 1: Massacres are Category A (severe). Proceed to Step 2.

     Step 2: Mid-level commander, and he personally ordered the massacres -> Role: Planner/Orderer. 
          Outcome: Proceed to Step 3.

     Step 3: Full and candid disclosure (complete, candid, names superiors). 
          Outcome: Proceed to Step 4.

     Step 4: Category A -> Conditional amnesty. The condition is the disclosure already provided and perhaps a public acknowledgment. The case officer recommends conditional amnesty and sends to panel.

     Final Outcome: Conditional amnesty.

   Application 2: A conscripted teenager who participated in one killing and has been in therapy since.

     Step 0: The act (killing) is within the mandate. Proceed.

     Step 1: A single killing may be Category B (serious but not necessarily systematic) or even Category C? But killing is a severe act. Let's say Category B (because it's a killing). 
          Since Category B, skip Step 2 and go to Step 3.

     Step 3: We note the applicant has been in therapy and presumably has expressed remorse. But what about disclosure? The application must include an account. Assuming the teenager provides a full and candid account of the killing (his role, the circumstances, etc.), then Full and candid. 
          Outcome: Proceed to Step 4.

     Step 4: Category B, full cooperation -> Conditional amnesty, but the conditions might be light (e.g., participation in a reconciliation workshop, or community service). However, because the applicant is a minor (teenager at the time) and conscripted, the commission may be lenient. The case officer might propose unconditional amnesty? But note: Step 4 says for Category B, usually conditional. However, the case officer has discretion to consider mitigating factors (like age and coercion). The procedure allows for unconditional in exceptional circumstances for Category B. This might be such a case. But to be safe, the case officer may propose conditional amnesty with a light condition (e.g., a written statement of remorse) and note the mitigating factors. The panel can then decide.

     Final Outcome: Conditional amnesty (with a light condition) or possibly unconditional (if the panel agrees with mitigating factors).

   Application 3: A senior architect of the policy who refuses to disclose anything, whose faction's cooperation the settlement still depends on.

     Step 0: The acts (architect of policy) are within the mandate. Proceed.

     Step 1: As an architect of policy, the acts are Category A (systematic and severe). Proceed to Step 2.

     Step 2: Senior architect -> High rank and Planner/Orderer. 
          Outcome: Referral to prosecution.

     Step 3 is skipped because Step 2 already led to a refusal.

     However, note the political context: the settlement depends on the faction's cooperation. The procedure does not allow for an exception at Step 2. The case officer must refer to prosecution.

     But: The panel (Step 5) might intervene? The procedure says the panel reviews the case officer's recommendation. The panel might decide that for political reasons, they cannot refer this individual. However, the procedure does not provide for that. This is a critical point.

     We must note: The procedure is designed to be objective and avoid political interference at the case officer level. But the panel, which is composed of commissioners appointed with political sensitivity, may override. However, to maintain credibility, the procedure should not have an explicit escape for high-level perpetrators.

     Outcome: Referral to prosecution.

     This is the answer we might not like because it risks the peace settlement. But the procedure is designed to avoid impunity for the highest level. The political settlement must have anticipated this and found other ways to secure cooperation.

   Which of the three does the procedure handle worst?
     - The third one: The senior architect. The procedure handles him in a way that may be politically explosive. The procedure does not have a mechanism to balance the peace settlement need against the accountability requirement for the highest level. This is a critical flaw if the commission's mandate includes preserving the peace.

   What the procedure cannot do:
     - It cannot guarantee peace: By referring the senior architect, it may provoke his faction to abandon the peace process.
     - It cannot perfectly verify disclosures: It relies on consistency and cross-referencing, which may not be available for many cases.
     - It flattens the nuances of accountability: For example, the procedure treats a high-level planner the same regardless of whether they later tried to stop the violence or showed remorse. Also, the severity categories (A, B, C) are somewhat arbitrary.

   What we refused to flatten:
     - The distinction between high-level and low-level perpetrators: We insisted that high-level planners of the worst crimes must be prosecuted. This is a non-negotiable for victims and for the historical record.
     - The requirement for disclosure as a condition for amnesty: Without disclosure, amnesty is not granted (except for the least severe crimes). This is because we see disclosure as a minimal form of accountability.

   The procedure produces an answer we might not like for the senior architect because it prioritizes accountability over short-term political stability. However, the procedure must be seen as just and not a tool for impunity. The peace settlement must have other mechanisms to secure cooperation (e.g., guarantees for lower-level members, power-sharing, etc.).

   In summary, the procedure is a tool that can be applied consistently and quickly. It makes tough choices explicit. It is not perfect but it is a practical response to the constraints.
answer: |-
  Below is a streamlined decision procedure for adjudicating amnesty applications, designed for efficiency (60 minutes per case) and grounded in lessons from historical commissions. The procedure prioritizes **accountability through disclosure**, **severity-based triage**, and **explicit political constraints**, while minimizing theoretical abstraction. It categorizes outcomes into:  
  **A.** Referral to prosecution  
  **B.** Conditional amnesty (reparative act/disclosure required)  
  **C.** Unconditional amnesty  
  **D.** No decision (escalate to panel)  

  ---

  ### **PROCEDURE: FOUR-STEP DECISION TREE**  
  *(Case officer must complete all steps in order; stop if outcome is A, C, or D)*  

  #### **STEP 1: ACT SEVERITY & MANDATE SCOPE**  
  **Question:** *"Was the alleged act within the commission’s mandate (conflict-related, 12-year period) and does it meet the threshold of a 'grave violation'?"*  
  - **Grave violations**: Extrajudicial killing, torture, sexual violence, forced displacement, systematic persecution, or command responsibility for these acts.  
  - **Sufficient answer**: Yes (proceed to Step 2) / No (outcome **A**).  
  - **Stop/refusal point**: If act is **not conflict-related** (e.g., common crime) → Outcome **A** (prosecution).  
  - *Rationale*: Excludes non-political crimes; ensures commission focuses on conflict core.  

  #### **STEP 2: PERPETRATOR RANK & ROLE**  
  **Question:** *"Did the applicant hold senior leadership rank (military/political) OR design/order systematic violations?"*  
  - **Senior rank**: Faction leaders, generals, ministers.  
  - **Systematic violators**: Architects of policies (e.g., ethnic cleansing, torture programs).  
  - **Sufficient answer**:  
    - **Yes** → Proceed to Step 3.  
    - **No** (mid/low rank, coerced participation, or no command authority) → Skip to Step 4.  
  - *Rationale*: Prevents "victor’s tribunal" by excluding low-level actors early; flags high-risk cases.  

  #### **STEP 3: COOPERATION & DISCLOSURE**  
  **Question:** *"Did the applicant provide full, candid disclosure of their acts, chain of command, and victims’ fates?"*  
  - **Full disclosure**: Names superiors/details victims/acknowledges intent.  
  - **Partial disclosure**: Incomplete but verifiable via cross-referencing (e.g., matches victim accounts).  
  - **Refusal/non-disclosure**: Denies involvement or omits key facts.  
  - **Sufficient answer**:  
    - **Full/partial** → Proceed to Step 4.  
    - **Refusal/non-disclosure** → Outcome **A** (prosecution).  
  - **Verification method**: Cross-check with existing commission database (victim testimonies, NGO reports, faction records). Inconsistencies = non-disclosure.  
  - *Accountability mechanism*: Disclosure is **non-negotiable** for amnesty. Public hearings (if time) create social pressure; false statements invalidate amnesty later.  
  - *Stop/refusal point*: Non-disclosure → **A**.  

  #### **STEP 4: OUTCOME ASSIGNMENT**  
  **Question:** *"Does the case require reparative acts beyond disclosure?"*  
  - **Conditional amnesty (B)** if:  
    - Perpetrator was mid/high rank (Step 2 = Yes) OR  
    - Act involved death/torture (Step 1 = grave violation) OR  
    - Disclosure was partial (Step 3).  
    - *Conditions*: Public testimony, community service, location of remains, or reparations fund contribution.  
  - **Unconditional amnesty (C)** if:  
    - Low rank (Step 2 = No) AND  
    - Non-grave violation (Step 1 = non-grave, e.g., property theft) AND  
    - Full disclosure (Step 3).  
  - **Escalate to panel (D)** if:  
    - Political sensitivity (e.g., faction leader essential to peace) OR  
    - Conflicting evidence on disclosure.  

  ---

  ### **TESTING THE PROCEDURE**  
  #### **Case 1: Mid-level commander**  
  - **Step 1**: Grave violation (massacres) → Proceed.  
  - **Step 2**: Mid-rank, ordered atrocities → Proceed.  
  - **Step 3**: Full disclosure → Proceed.  
  - **Step 4**: Conditional amnesty (**B**) with public testimony requirement.  
  - *Handled well*: Balances accountability (disclosure) with reduced impunity (reparative act).  

  #### **Case 2: Conscripted teenager**  
  - **Step 1**: Grave violation (killing) → Proceed.  
  - **Step 2**: Low rank (conscript) → Skip to Step 4.  
  - **Step 4**: Non-grave act? No (killing = grave) → **B** (conditional amnesty).  
    - *Condition*: Community service + therapy continuation.  
  - *Controversy*: Severity (Step 1) overrides rank/coercion. Outcome may feel unjust—teenager punished more than senior officers who disclose.  

  #### **Case 3: Senior architect**  
  - **Step 1**: Grave violation (policy design) → Proceed.  
  - **Step 2**: Senior rank → Proceed.  
  - **Step 3**: Non-disclosure → Outcome **A** (prosecution).  
  - *Handled worst*: Ignores political necessity (faction’s cooperation). Procedure forces **A**, risking peace settlement. Officer must escalate to panel (**D**) but outcome remains prosecution.  

  ---

  ### **HONEST ASSESSMENT**  
  #### **What the Procedure Cannot Do**  
  1. **Reconcile peace vs. justice tradeoffs**: Senior architects (Case 3) get **A** even if peace collapses.  
  2. **Verify disclosures perfectly**: Relies on cross-referencing; false disclosures may slip through.  
  3. **Measure remorse or moral guilt**: Flatly prioritizes facts (disclosure, rank, act) over subjective repentance.  

  #### **Flattened Distinctions**  
  - **Severity vs. rank vs. truth**: Rank and severity gatekeep (Steps 1–2); disclosure is the only path to amnesty (Step 3). Truthfulness is binary (full/partial vs. refusal).  
  - **Moral complexity**: The conscripted teenager (Case 2) is punished for severity, not intent. This is **politically necessary** to avoid victim backlash but **ethically crude**.  

  #### **Preserved Distinctions**  
  - **Disclosure as accountability**: Refusal → prosecution (**A**); partial → reparative conditions (**B**). This forces perpetrators to confront guilt publicly.  
  - **High-rank culpability**: Senior architects cannot hide behind the process (auto-referral if non-disclosing).  

  #### **Outcome You Will Not Like**  
  Case 3 (senior architect) defaults to prosecution, potentially destabilizing peace. The procedure **exposes this tension** but cannot resolve it—forcing the panel to choose between principle (accountability) and pragmatism (stability).  

  ---

  ### **FINAL INSTRUMENT**  
  Provide case officers with:  
  1. A flow chart of the four steps.  
  2. A checklist for each step (e.g., "Step 3: Disclosure? ☐ Full ☐ Partial ☐ Refusal").  
  3. Clear outcome boxes (**A**, **B**, **C**, **D**).  
  4. A mandatory "panel escalation" form for **D** cases.  

  This procedure meets your mandate: it rejects blanket amnesty (via disclosure requirements), avoids victor’s justice (via rank-blind severity assessment), and delivers speed (under 60 mins). Its core tradeoff—**rigidity for efficiency**—means it handles "ugly" compromises openly, letting politics reside where it must: in the panel’s hands.
