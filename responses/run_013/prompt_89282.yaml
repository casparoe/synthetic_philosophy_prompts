answer: |-
  ## Proposal: The Clean-Hands Equilibrium: Distributed Agency and the Composition Problem in Political Wrongdoing

  **Project Title:** Composing Wrong: Distributed Agency and the Moral Void in State Action

  **Duration:** 6 months
  **Requested Funding:** [Specify Amount - e.g., £15,000] for research time, essential texts, and dissemination.

  **Abstract:** This project challenges the individualistic focus of the "dirty hands" (DH) literature in political philosophy. While DH centres on solitary leaders facing tragic choices requiring personal wrongdoing for the greater good, most state wrongdoing emerges not from single acts, but from the composition of countless individually permissible (or sub-threshold) contributions by advisers, officials, legislators, and citizens. This creates a "clean-hands equilibrium" (CHE): a systemic wrong emerges where no individual participant bears clear responsibility or feels the characteristic "dirt" of DH. The core research question is: **How do individually defensible contributions compose into a collective wrong for which no participant is normatively positioned to bear the moral remainder, and what are the implications for assigning responsibility and conceptualizing political ethics?** The project will develop the CHE concept, identify the mechanisms of this composition problem, and argue that this is the primary locus of contemporary political wrongdoing, demanding a paradigm shift beyond traditional DH debates.

  **The Problem & Gap in Existing Literature:**
  The canonical DH literature (Walzer, Williams, etc.) powerfully captures the anguish of the solitary leader forced into necessary evil. However, it suffers from three critical limitations leaving the composition problem unaddressed:

  1.  **Unit of Analysis Error:** By focusing on the *singular* agonized agent, it misses the distributed, often fragmented nature of modern state action. Wrongdoing is rarely attributable to one dramatic, conscience-wrenching decision by a single individual.
  2.  **Moral Remainder Misdirection:** The intense focus on the *agent's experience* of "dirt" (guilt, taint, moral cost) presupposes a clear locus for that remainder – the single wrongdoer. This framework collapses when the wrong arises from many actions, none of which clearly meet the threshold of wrongdoing individually.
  3.  **Scope Blindness:** Existing debates (permissibility vs. justifiability vs. inescapability) are ill-equipped to handle cases where the wrong is *emergent* – a property of the system of actions, not reducible to any single component act (e.g., structural injustice, bureaucratic violence, systemic policy harms funded by democratic mandate). The normative question shifts from "Should *this* leader do *this* wrong?" to "How did *this system* of actions produce *this* wrong without any single 'dirty hand'?"

  Consequently, the literature leaves the CHE fundamentally unaddressed. It cannot explain how widespread participation in processes leading to harm can leave participants feeling normatively "clean," nor how responsibility for the resulting collective wrong should be conceptualized and assigned.

  **Research Question:**
  How do distributed, individually defensible (or sub-wrongdoing-threshold) actions within a political system compose into a collective moral wrong, and what are the normative implications for responsibility and political ethics when no single participant is positioned to bear the moral remainder?

  **Methodology:**
  This project employs **conceptual analysis** as its primary method, supplemented by illustrative examples. This is the right instrument because:

  1.  **Nature of the Problem:** The core challenge is conceptual – defining the CHE, identifying the *mechanisms* of composition (e.g., threshold aggregation, functional separation, epistemic fragmentation, institutional diffusion), and clarifying the nature of the emergent wrong and the normative void concerning the remainder. It requires unpacking concepts like "defensible contribution," "threshold of wrongdoing," "moral remainder," "collective wrong," and "responsibility."
  2.  **Scope Limitation:** A six-month project cannot sustain comprehensive case studies across diverse contexts or develop a robust formal model. Case studies (while valuable for future work) risk becoming descriptive rather than solving the core conceptual puzzle. Formal models (e.g., game theory) might capture incentive structures but struggle with the nuanced, qualitative nature of moral reasoning, permissibility thresholds, and the phenomenology of the "remainder."
  3.  **Foundational Work:** This project aims to *establish the conceptual framework* (CHE, composition mechanisms) necessary for future empirical or formal modelling work. It must first rigorously define the problem space and its distinctiveness from complicity, collective responsibility, or pure structural accounts.

  **Monthly Work Plan:**

  *   **Month 1:** Deep dive into DH literature & adjacent fields (structural injustice, complicity, collective responsibility). Precisely define the "clean-hands equilibrium" concept and its distinction from existing frameworks. Map the limitations of individualistic DH.
  *   **Month 2:** Identify and categorize key *mechanisms of composition*. How do individually permissible actions combine to create impermissible outcomes? (e.g., threshold effects, division of labour obscuring ends, institutional fragmentation, epistemic bubbles).
  *   **Month 3:** Analyze the nature of the "emergent wrong." What makes the outcome a *moral* wrong if no component act necessarily is? Explore the "normative void" – why is no individual positioned to bear the remainder (guilt, taint) in the way the DH agent does?
  *   **Month 4:** Address the "moral remainders" question: Does the CHE imply that collectives (the state, the bureaucracy, "the system") must bear moral remainders? What does this commit us to ontologically? (See below).
  *   **Month 5:** Develop normative implications. How should responsibility be conceived and assigned in a CHE? What does this mean for political ethics – does it require new virtues, institutional safeguards, or forms of collective acknowledgement?
  *   **Month 6:** Synthesize findings. Draft core argument for an article/chapter. Outline implications for future research (potential case studies, formal modelling possibilities). Finalize project report.

  **Moral Remainders and Collective Ontology:**
  The CHE account **does require attributing moral remainders to collectives**, specifically to the institutional or systemic entity whose functioning generated the wrong (e.g., "the administration," "the security apparatus," "the policy regime"). This commits the project to:

  1.  **Rejecting Strict Individualism:** It denies that moral properties *only* apply to individual human agents.
  2.  **Embracing a Moderate Collectivism:** It requires that certain organized collectives (especially institutional actors like states, governments, bureaucracies) can be bearers of moral duties, can perpetrate wrongs, and consequently, can incur moral remainders (e.g., obligations of repair, acknowledgement, or systemic reform). This draws on, but critically engages with, theories of collective intentionality and responsibility (e.g., Pettit, List, Copp). The commitment is to the *pragmatic necessity* and *normative coherence* of this attribution within the political sphere, without necessarily requiring a full-blown metaphysical theory of group agency.

  **Outcomes and Success Criteria:**

  *   **Successful Outcome:** A clearly articulated, conceptually rigorous framework comprising:
      *   A robust definition and defense of the "clean-hands equilibrium" concept.
      *   A taxonomy of key composition mechanisms.
      *   An argument explaining the nature of the emergent wrong and the normative void for individual remainders.
      *   A defensible account of why collectives bear the moral remainders in CHEs and what this entails.
      *   A draft journal article (targeting leading political philosophy/political theory journals) presenting the core argument.
      *   A detailed project report outlining findings and future research directions.
  *   **Failure Criteria:** The project fails if:
      *   The CHE concept cannot be sufficiently distinguished from existing concepts (complicity, collective responsibility, structural injustice).
      *   No plausible account of the composition mechanisms can be developed that explains the emergence of clear wrongs from individually defensible parts.
      *   The attribution of moral remainders to collectives proves incoherent or collapses into individual responsibility without resolving the normative void.
      *   The argument fails to demonstrate that the CHE represents a distinct and significant phenomenon demanding a shift beyond traditional DH concerns.

  **Scope Management:**
  This six-month project is explicitly foundational and conceptual. It will:
  *   **Develop the CHE framework**, but not apply it comprehensively to multiple historical or contemporary cases.
  *   **Identify composition mechanisms**, but not develop detailed formal models of them.
  *   **Argue for collective moral remainders**, but not provide a full metaphysical defense of group agency beyond what is necessary for the political context.
  *   **Outline normative implications**, but not develop a complete new theory of political ethics.

  The focus is squarely on establishing the conceptual problem and proposing a novel framework for understanding a pervasive form of political wrongdoing. This groundwork is essential before larger-scale empirical or theoretical projects can be meaningfully pursued.

  **Conclusion:**
  By shifting the unit of analysis from the solitary leader to the distributed system, this project identifies the "clean-hands equilibrium" as a fundamental, yet neglected, problem in political ethics. It moves beyond the question of whether leaders *should* dirty their hands to ask how modern states routinely produce dirty *outcomes* through processes that leave individual hands disturbingly clean. Addressing this composition problem and its normative void is crucial for understanding responsibility and developing ethics fit for complex, collective political life. This six-month project provides the necessary conceptual foundation for this vital inquiry.
