  I am preparing a two-page proposal for a small six-month research grant in political philosophy and need help turning a half-formed idea into one. The idea is that the dirty-hands literature has organised itself around the wrong unit of analysis. Its canonical cases — the leader who must authorise a killing, or break a promise, or let some people die, in order to serve the state — assume a single agent whose hand is soiled, and the debate has accordingly been about whether the wrongdoing is permitted, excused, or required, and what it costs the agent afterwards. But most of the wrongdoing that states actually do is distributed: across advisers who frame the options, officials who implement, legislators who fund, and citizens who return the government, with many of those contributions individually permissible, or at least individually beneath the threshold of wrongdoing. I want to call the resulting situation a clean-hands equilibrium, and to argue that the live normative question is not whether this or that politician should get her hands dirty, but how a set of individually defensible contributions composes into a wrong that no participant is positioned to own. Write the proposal: state the question so that it has a determinate answer; explain why the existing positions leave it open; set out the method, month by month, and say why a conceptual treatment rather than a case study or a formal model is the right instrument here; indicate whether the account needs collectives to bear moral remainders, and what that commits me to; say what a result would look like and what would count as the project failing; and keep the scope honest for six months. No bibliography — I will supply the references myself.
