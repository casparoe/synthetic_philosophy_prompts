answer: |-
  ## Opening Remarks: Sentience Across Time  
  *(Delivered in converted boathouse, approx. 10 minutes)*  

  Good morning. Welcome to this old boathouse, and to a conversation we’ve gathered to have—one that matters deeply, but is notoriously difficult to hold clearly. Why are we here? Because the question of whether invertebrates are sentient—whether they have subjective experiences—isn’t just academic. For many in this room, it shapes how we value lives, direct research, or allocate resources. Yet for others, the very language of "sentience" or "consciousness" can feel slippery, even premature. So how do we start?  

  I propose we start by questioning the question itself.  

  The usual framing—"Is this animal conscious?"—asks for a yes-or-no verdict. It assumes consciousness is a fixed property, like having a shell or eight legs: either an animal possesses it, or it doesn’t. But what if that’s the wrong way to look? What if consciousness isn’t a static *thing* an animal *has*, but a dynamic *span* it *lives across*?  

  Let me offer a different lens—one I’ll call the **interval view**. Here’s the core idea: a state becomes phenomenally present—truly *experienced*—only when it’s integrated into a unified whole, *and* remains available to guide later behavior, across some stretch of time. That stretch—that interval—isn’t fixed. It could be milliseconds for one creature, minutes for another, or longer.  

  So, for a crab—or a bee, or an octopus—the critical question shifts. It’s not just, "Is it conscious?" but rather: **"Over what timescale does its experience hold together as one continuous flow, rather than shattering into disconnected snapshots?"**  

  This reframing isn't just wordplay. It shapes everything we’ll discuss. And crucially, this view is a starting bet, not a settled truth. It’s a scaffold we’ve built for these three days—one we should test, probe, and maybe dismantle.  

  Now, why force this frame? Because it immediately surfaces three tensions where I suspect our real work will happen:  

  1.  **The Measurement Fork:** How do we *find* this interval? We might measure how long a sensory state *persists*—lingering like an afterimage. Or we might measure how long it remains *usable*—available to influence a future choice or action. These can diverge. Think of an octopus navigating a maze after a delay: does it "hold" the path in mind, or reactivate it later? Which measure captures "experience"? This isn’t a technical quibble. It’s a fundamental fork in the road. Our methods, our evidence, our conclusions—all depend on which path we take.  

  2.  **Degrees or Evasion?** If consciousness is a span, it naturally admits degrees. A creature integrating experience over minutes might have a richer, more continuous inner world than one spanning milliseconds. This feels like progress—finally acknowledging gradients! But is it? Or is it just dodging the hard "yes/no" that ethics and policy often demand? Is this a virtue of the view... or an evasion? I don’t have the answer. But we must own the question.  

  3.  **Breaking the Frame:** Finally, and most importantly—this view *must* be stress-tested here. Does it help explain why some jellyfish seem all reflex, while some cephalopods exhibit startling flexibility? Does it clarify why attention works differently in a fly versus a mantis shrimp? Or does it crumble when faced with the messy reality of neurons, behavior, and evolution? **This frame isn’t my position to defend. It’s our shared hypothesis to break.**  

  So, as we begin: Let’s embrace the uncertainty. Let’s look for the *when* and the *how long*, not just the *if*. Let’s ask: What is the longest span over which a shrimp’s world coheres? When does an ant’s decision draw on an experience that’s truly *past*? And let’s be honest about where our tools fail us, and where our concepts strain.  

  The invertebrates we study deserve our rigor and our humility. They challenge us to think beyond binaries, into the flowing, fragile, temporal fabric of experience itself. Let’s see what this lens reveals—or where it breaks.  

  Thank you. Let’s begin.  

  ---

  **NOTES FOR SPEAKER ONLY (DO NOT READ ALOUD):**  

  *   **Confidence Level:** Moderate. The core *structure* of the interval view (consciousness as integration/availability across time) feels robust as a framing *device* to force key questions. It avoids premature binaries and aligns with themes in integrated information theory (IIT) and temporal neuroscience, though I deliberately avoid naming these.  
  *   **Least Confident Point:** The claim that the interval view *naturally* resolves the "degrees vs. evasion" tension. I suspect it *creates space* for more nuanced ethical discussion, but framing it as potentially a *virtue* might be overly optimistic. The risk of evasion is real, especially for welfare advocates needing clear thresholds. I presented it as an open tension because I’m genuinely unsure if the view helps or hinders here – it depends entirely on how rigorously we define and measure the interval, which remains deeply uncertain.
