answer: |-
  ## Verdict: Soft Binding for Public Debt Default

  For my concrete temptation, I choose **default on public debt**. A polity might be tempted during a fiscal crisis or populist surge to abandon its obligations, promising immediate relief but risking catastrophic long-term creditworthiness and economic stability. I argue that a polity should prefer **soft binding** over hard binding for such precommitments, defended as follows.

  ### 1. The Nature of Precommitment & Polity Identity
  *   **Purpose:** A precommitment aims to protect a polity's *long-term, reflective judgment* from being overridden by *transient passions, panic, or myopic self-interest* in a future moment of crisis. It leverages present rationality to constrain future irrationality or weakness of will.
  *   **Polity Identity:** I assume the polity is **one enduring agent across time**, not merely a succession of temporary majorities. This is foundational to constitutionalism: a constitution presupposes a continuous "people" capable of making promises to their future selves, maintaining identity through shared institutions, principles, and a project of collective self-governance over generations. Without this continuity, precommitment dissolves into mere present-majority tyranny over future majorities, rendering constitutions illegitimate.

  ### 2. The Custodian Problem Solved by Soft Binding
  Hard binding (e.g., unamendable clause enforced by a supreme court) fatally exacerbates the custodian problem. The enforcing body (e.g., justices) is **not bound by the original bargain** in the same way. They interpret it, potentially imposing their own values or contemporary biases ("living constitution" vs. originalism debates), wielding the very discretion the precommitment sought to eliminate. This creates an unaccountable oligarchy.

  **Soft binding resolves this:** Its enforcement mechanism isn't a veto by an unbound custodian, but **a structured delay imposing costs on the decision to defect**. Enforcement might involve:
  *   A mandatory waiting period before repeal takes effect (e.g., 1 year).
  *   A mandatory referendum requiring a supermajority vote to repeal during the crisis.
  *   Explicit, highly visible budgetary costs triggered by initiating repeal.
  The "enforcer" becomes the *mechanism itself* and the *requirement for public deliberation*. The repeal coalition must publicly justify its action, endure scrutiny during the delay, and bear political costs. Power isn't relocated to an unbound entity; it remains with the people, but its exercise is made deliberately difficult and costly in the moment of temptation, forcing reflection. No external custodian imposes their will; the polity confronts its own temptation through procedure.

  ### 3. Fleeting Passion vs. Durable Change of Mind
  *   **Fleeting Passion:** Soft binding excels here. A panic-driven desire for default during a market crash is unlikely to sustain majority support through a year-long delay with intense public debate exposing the catastrophic consequences. The cooling-off period allows reason to reassert itself.
  *   **Durable Change of Mind:** This is harder. If a genuine, sustained majority emerges believing debt default is necessary for national survival (e.g., after decades of unsustainable borrowing), soft binding allows this new, durable will to prevail *eventually* after bearing the cost of delay and public accounting. Hard binding would render this impossible, potentially forcing an illegitimate default anyway or causing constitutional rupture.
  *   **Distinguishing Them (At Binding Time):** We cannot predict the future perfectly. The key is designing the delay mechanism to *favor* the suppression of passions while *allowing* durable shifts. **Requiring a supermajority (e.g., 60%) vote *during* the delay period or in a referendum** is crucial. A fleeting passion is unlikely to mobilize such sustained, broad support. A durable change of mind likely can. The delay *plus* the heightened threshold provides the best available filter at the time of binding, far superior to an eternal ban or relying on judicial guesswork about future "durability."

  ### 4. Legitimacy & The "Speed Bump" Challenge
  *   **Unamendable Provisions:** Hard binding suffers a severe legitimacy deficit. An eternal ban on default binds future generations who had no say, potentially trapping them in an unsustainable situation dictated by long-dead ancestors. This violates the core democratic principle that no generation can irrevocably bind its successors. It assumes the original generation possessed perfect foresight, which it cannot.
  *   **Soft Binding as Genuine Precommitment:** While reversible, soft binding is far more than a "speed bump." A significant delay coupled with high political costs (referendum, supermajority, explicit penalties) creates a *substantial barrier* to impulsive action. It forces the future "self" to confront the original reasons for the precommitment under conditions designed for sober reflection, making defection *difficult and costly*, not just slightly slower. It respects popular sovereignty by allowing ultimate change, but ensures that change is deliberate and durable, not a momentary lapse. This aligns with the enduring agent model: the polity *can* change its fundamental commitments, but only after rigorous self-scrutiny proving the change is more than a fleeting impulse.

  ### Conclusion & Concrete Verdict
  A polity should prefer **soft binding** for precommitting against public debt default. It best balances the need to prevent catastrophic, impulsive self-harm with the principles of democratic legitimacy, avoids creating an unbound custodian oligarchy, and provides a mechanism (delay + supermajority requirement) that filters fleeting passions while allowing durable changes of mind.

  **Mechanism Adopted:** Constitutional provision requiring a **mandatory 12-month waiting period** between legislative passage of a debt default bill and its taking effect, coupled with a **mandatory national referendum** during that period where approval of the default requires a **60% supermajority vote**.

  **Single Condition for Abandoning this Position:** I would abandon soft binding for hard binding **only if** empirical evidence demonstrably proved that soft binding mechanisms *systematically fail* to prevent impulsive defections during crises *even when* combined with supermajority requirements, *and* that this failure consistently leads to catastrophic outcomes that a hard binding mechanism (like an unamendable clause enforced by a court) would have reliably prevented, *without* itself causing worse democratic or legitimacy crises. The burden of proof for this failure mode would be exceptionally high.
