          - Round 1: the 3 with threshold 0 join -> 3
          - Round 2: the 3 with threshold 1 join (because 3>=1) -> 6
          - Round 3: the 3 with threshold 3 join (6>=3) -> 9
          - Round 4: the 3 with threshold 5 join (9>=5) -> 12
