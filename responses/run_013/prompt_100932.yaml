     - **Solution:** Keep a tight timeline. Use a timer for rounds. If necessary, skip the second run and use the first run data for the individual questions and then describe the second run theoretically.

  4. **Problem:** The debrief might be too abstract.
     - **Solution:** Use concrete examples from the activity and relate each philosophical concept to what they experienced.

  **Honest Note on the Limitation of the Activity:**

  The activity cannot reproduce the **strong holist claim that social facts have causal powers that are independent of, or can downwardly cause changes in, individual actions without being mediated by individual beliefs or attitudes.** In our activity, the social fact (the current count) influences an individual's decision only because the individual has a threshold and is aware of the count. The holist might argue that there are social facts that exert causal power beyond such individual-level mechanisms (e.g., structural forces, institutions). Our activity shows that the aggregate pattern can be irreducible in explanation and multiply realizable, but it does not show downward causation that bypasses individual cognition. You will have to supply that idea separately, perhaps by discussing examples of institutional power or structural constraints that are not reducible to individual attitudes (e.g., the way a market structure constrains individual choices beyond their thresholds).

