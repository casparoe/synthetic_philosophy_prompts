  We are going to design an activity based on a threshold model of collective behavior. This model is chosen because it naturally generates emergent patterns that are not intended by any individual and cannot be produced by a single person. The specific activity will be a simulation of a "social movement" where individuals decide to join a movement based on the number of others who have already joined (a threshold rule).

