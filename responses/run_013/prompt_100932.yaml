  1. **Scenario:** The class is simulating the spread of a social movement (e.g., adopting a new technology, participating in a protest). Each student is an individual with a personal threshold for joining the movement. The threshold is the minimum number of people that must have joined before they are willing to join.

  2. **Threshold Assignment:** Before the activity, the instructor assigns each student a threshold number. The thresholds should be distributed in a way that allows for a tipping point. For example, in a class of 18, assign thresholds as follows:
     - 3 students: threshold = 0 (they will join immediately)
     - 3 students: threshold = 1
     - 3 students: threshold = 3
     - 3 students: threshold = 5
     - 3 students: threshold = 7
