prompt: |-
  You are helping me design a session for an upper-level seminar in the philosophy of social science — roughly eighteen students, ninety minutes, one room. I want an in-class activity that makes the group feel, rather than merely hear, the friction between methodological individualism and holism, and I want the idea to show up in what happens to them before it is named.

  The activity should have participants generate a macroscopic social pattern from a simple individual rule — a threshold, tipping, or contagion rule works, but pick one whose mechanics you can state in a paragraph — so that the pattern is no one's intention and no participant can produce it alone. Then, in a second phase, have them try to explain both one particular individual's action and the aggregate outcome in purely individual terms, and let them discover for themselves two things: (a) that the best available explanation of the individual's move cites the emerging aggregate ("the group was tipping," "the norm had taken hold"), and (b) that two runs with different individual orderings or different micro-histories yield the same aggregate pattern, so the individual-level story underdetermines the aggregate explanation. Do not preview supervenience or multiple realizability; arrange the rules so the second phase collapses under its own weight, and introduce the vocabulary only in the debrief.

  Give me the setup and rules, materials, a timeline for the ninety minutes, an incentive structure that needs no real money, the debrief that maps each moment of the activity onto the individualist and holist positions and onto the distinction between the claim that social facts supervene on individual facts and the claim that they can be explained in individual terms, what will predictably go wrong the first time I run it and how to handle it, and an honest note on which part of the holist position the activity cannot reproduce and that I will have to supply myself.
