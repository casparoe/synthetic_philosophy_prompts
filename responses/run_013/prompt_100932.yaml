  4. **Rules of the Activity:**
     - The activity proceeds in rounds. In each round, every student who has not yet joined the movement decides whether to join based on their threshold and the current number of participants (which is announced at the start of the round).
     - At the beginning of the first round, the instructor announces: "The movement starts now. How many have joined? Zero." 
     - Then, in each round:
          a. The instructor announces the current number of participants (from the previous round).
          b. Each student who has not joined checks: if the current number of participants is at least their threshold, they join. They do so by standing up (or raising a hand) and then remaining standing for the rest of the activity.
