     Note: The distribution should be such that the movement can start and then tip. The exact numbers can be adjusted, but the idea is to have a mix of low and high thresholds.

  3. **Materials:** 
     - A whiteboard or large paper to track the number of participants in the movement over time.
     - Index cards (one per student) with the student's threshold written on it (kept secret until the debrief).
