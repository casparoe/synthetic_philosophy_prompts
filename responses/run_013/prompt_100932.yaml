  **Debrief Mapping:**

  1. **Phase 1: Emergence of the Pattern (10 minutes):**
     - The pattern (tipping, the final number) is an emergent social fact. It was not intended by any individual and no one could have produced it alone.
     - Relate to holism: the pattern has properties (like the tipping point) that are not reducible to the individual properties. The whole is more than the sum of the parts.

  2. **Phase 2: Explaining the Individual Action (10 minutes):**
     - When we asked an individual why they joined, they cited the aggregate (the current number of participants). This shows that the individual's action is best explained by a social fact (the current state of the group). This is a challenge for methodological individualism, which holds that social phenomena must be explained solely in terms of individuals and their properties (like thresholds). But note: the threshold is an individual property, but the condition that triggered the action (the count) is a social fact.
     - Point (a): the best explanation of the individual's move cites the emerging aggregate.

  3. **Phase 2: Explaining the Aggregate Pattern (10 minutes):**
     - We tried to explain the aggregate pattern (the final number) in individual terms. We can say: "Each individual had a threshold and when the count met their threshold, they joined." However, when we ran the simulation again with the same thresholds but assigned to different people, we got the same aggregate pattern but with different individual actions. This shows that the aggregate pattern (the social fact) can be realized by multiple different individual configurations (same set of thresholds, but assigned to different people). 
     - This is an example of multiple realizability: the same social fact (the final number) can be realized by different individual facts (who has which threshold and when they joined).
     - Therefore, the individual-level story underdetermines the aggregate explanation: knowing all the individual thresholds and actions in one run does not uniquely determine the aggregate pattern? Actually, it does in one run, but when we change the assignment (while keeping the same set of thresholds) we get the same pattern. So the pattern is determined by the distribution of thresholds (a social fact about the distribution) and not by the particular assignment of thresholds to individuals. Hence, the social fact (the distribution) is what explains the pattern, and it is a higher-level fact.

  4. **Supervenience vs. Explanation (5 minutes):**
     - Supervenience: The social pattern supervenes on the individual facts. In both runs, the individual facts (the set of thresholds and the rules) determined the outcome. But note: the same set of thresholds (the same multiset) in both runs leads to the same outcome. However, if we changed the thresholds, the outcome might change. So the social pattern supervenes on the individual facts (the thresholds and the rules of behavior). 
     - But explanation: Even though the social pattern supervenes on the individual facts, we cannot explain the pattern without referring to the aggregate. The individual-level explanation is too detailed and does not capture the invariance (that the pattern depends on the distribution of thresholds, not who has which threshold). Therefore, we need aggregate-level explanations.

  **Predictable Problems and Solutions:**

  1. **Problem:** The simulation might not tip if the threshold distribution is not set properly.
