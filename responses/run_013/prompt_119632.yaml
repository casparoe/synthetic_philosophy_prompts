  The detailed critic example: Alex sees it as testimony working through vivid description; Riley calls it imaginative reconstruction, not testimonial knowledge. This forces Alex to defend whether testimony can ever "bridge the gap" without direct experience.

  Ending sharply: Riley asserts aesthetics is fundamentally experiential, so testimony is secondary; Alex insists the burden is on pessimists to explain why aesthetics is special. No resolution—just clarified trenches.

  Need to ensure both characters are strong: Riley's position avoids sounding like elitism by emphasizing the nature of justification, not access. Alex avoids naive optimism by acknowledging testimony's limits but demanding principled reasons for aesthetic exceptionalism. The dialogue should show mutual understanding even in disagreement—e.g., "What you call defective..." exchanges.

