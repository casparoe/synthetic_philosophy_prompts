answer: |-
  ## The Aesthetic Testimony Debate: Riley vs. Alex

  **Setting:** A cramped corner table in the grad student lounge, surrounded by stacks of books and half-empty coffee cups. Third wave brew for Alex, strong diner coffee for Riley.

  **Characters:**
  *   **Riley:** The Pessimist. Intense, precise, gestures with her mug. Believes aesthetic testimony cannot confer genuine knowledge or justification.
  *   **Alex:** The Optimist. Relaxed posture but intellectually sharp, leans forward when making a point. Believes testimony works in aesthetics just like elsewhere.

  **(The dialogue starts mid-argument, picking up after Alex’s familiar ‘movie’ example.)**

  **Alex:** ...so I trusted Maya implicitly when she said *Past Lives* was achingly beautiful. I believed her. I went. It *was*. Therefore, testimony worked. I knew it was beautiful *because* Maya told me. Case closed, Riley.

  **Riley:** (Sighs, puts down mug) Alex, for the twelfth time, *that* is not aesthetic testimony. You trusted Maya’s *overall evaluation*—her thumbs-up, her "you'll love it." That’s practical advice, a prediction about *your* enjoyment based on knowing *you*. It’s not *knowing the beauty itself* on the basis of her word. What you ended up with wasn't justified belief *in the beauty*, it was justified belief *that Maya thought you'd like it*. You experienced the beauty yourself when you watched it. Your belief *about the beauty* only became properly justified *then*.

  **Alex:** Okay, fine. Semantic distinction noted. But let’s take a purer case. Suppose Maya, the world's most trusted critic, tells me, with no reference to me whatsoever: "Cézanne's *Mont Sainte-Victoire* series possesses a profound, tectonic beauty in its structural rigor." I believe her. I form the belief: "Cézanne's *Mont Sainte-Victoire* series is profoundly, tectonically beautiful." Why isn’t that belief justified? Why isn’t it knowledge, assuming Maya knows what she’s talking about and isn’t lying?

  **Riley:** Because the justification for believing an aesthetic property like ‘profound, tectonic beauty’ *necessarily* involves a kind of apprehension that testimony cannot convey. Maya’s words point to an experience. They describe *her* response. But to grasp *why* those brushstrokes create that specific feeling of geological solidity married to luminous color – to genuinely understand the *beauty* itself – requires *seeing* the interplay of form, color, and composition. Your belief is *about* Maya’s judgment, not grounded in the aesthetic properties of the work in the way knowledge requires.

  **Alex:** So it’s not that the belief is *false*, or that I have no *reason* to hold it – Maya *is* reliable. It’s that the justification is… second-hand? Inadequate? What’s *epistemically* defective about it? It seems like your objection is practical: *I* can’t appreciate the tectonic beauty, *I* can’t defend the claim against someone who challenges it without just saying "Maya said so." But that happens in science too! If a trusted physicist tells me the LHC confirmed the Higgs boson decay path, I believe her. I can’t appreciate the raw data myself, I can’t defend it against a rival physicist without citing the experiment or the expert. Is my belief about the Higgs decay unjustified?

  **Riley:** Crucial difference, Alex. In science, the testimony ultimately refers back to publicly accessible, repeatable procedures and observations – procedures grounded in sense perception, which testimony *does* transmit justification for. I can understand *what it would mean* to observe the decay path; the concepts involved (particle, decay, detection) are non-experiential in their justification core. Aesthetic concepts like ‘beautiful’, ‘sentimental’, ‘graceful’ – their *very meaning* is tied to the subjective, experiential response they denote. Justification for applying them *requires* accessing that response, or something very like it. Testimony can tell me *that* Maya had the response, but it can’t give *me* the justifying ground for applying the concept *to the work*. The defect is epistemic: my belief lacks the right kind of justifier.

  **Alex:** Okay, let’s press that experiential requirement. Take your symphony example. Suppose someone is profoundly deaf from birth. They are a brilliant musicologist, understands harmony, counterpoint, orchestration intellectually. Trusted friends describe the overwhelming beauty of Mahler’s 9th. They tell him it’s achingly beautiful. Does your view mean he can *never* know Mahler’s 9th is beautiful? That seems harsh, and frankly, a bit ableist. Can he not have justified true belief about its beauty via this rich testimony?

  **Riley:** (Pauses, thinking) It’s a hard case, deliberately so. But yes, on my strict view, I think he cannot *know* it is beautiful in the full aesthetic sense via testimony alone. He can know *that others find it beautiful*, he can know it possesses complex structural features *associated* with beauty, he can even have a rich *intellectual understanding* of why it’s deemed beautiful. But the belief "*This symphony is beautiful*," grounded *only* in testimony, lacks the experiential component that justifies the application of that particular evaluative concept. He hasn't grasped the beauty itself, only reports about it. The defect remains. Is it harsh? Perhaps. But it reflects the nature of aesthetic properties – they are response-dependent in a way that quantum decay paths aren't.

  **Alex:** That feels inconsistent. What about moral testimony? Similar worries get raised – "You have to *see* why torture is wrong!" But we generally think you *can* learn moral truths via testimony. "Torture is wrong" – I can believe that justifiedly because trusted sources tell me, even if I haven't witnessed torture. Isn't morality also response-dependent? Why the asymmetry?

  **Riley:** Morality *is* different. Moral judgments primarily concern *what ought to be done*. Testimony transmits reasons for action. If a trusted source tells me torture is wrong, they give me a reason *not to torture*, and justification for believing I *shouldn't* do it. The core justification might involve empathy or understanding consequences, which testimony *can* often convey arguments for. Aesthetic judgments aren't primarily about action; they're about appreciation, about experiencing a quality. Testimony can't transmit the *appreciation* or the *quality itself*; it can only report on it. The deaf musicologist might have strong moral reasons *to preserve* the symphony based on testimony, but not aesthetic knowledge *of* its beauty.

  **Alex:** Interesting. So morality gets a pass because it’s practical? Back to the practical objection! But let’s try another aesthetic case. Suppose the testimony isn't just "It's beautiful," but a critic gives an incredibly rich, nuanced description of the Cézanne. She talks about the specific shades of blue vibrating against the ochre, the way the brushstrokes build the mountain's mass while dissolving its edges, creating that very tension you call "tectonic beauty." After reading this, I feel like I can almost *see* it. I form the belief with great confidence. Is that still defective? Isn't the testimony, through vivid description, *bridging the gap*, giving me something like the justifying experience?

  **Riley:** No, Alex. That’s not testimony doing its job; that’s testimony *enabling imagination*. The critic’s words are prompts for *me* to construct a *simulacrum* of the experience in my mind. My justification – such as it is for the belief "It *is* beautiful" – comes from *my own imaginative engagement* with her descriptions, not directly from her testimony *as testimony*. If my imagination is poor, or misled by her description, my belief might be unjustified even if hers was perfect. The testimony is a tool for *my* potential first-personal access, perhaps, but the justification still ultimately rests on my own cognitive (in this case, imaginative) activity, not on taking her word for it *about the beauty itself*. What you have is a well-supported *expectation* of beauty, maybe justified belief in complex features, but not testimonial knowledge *of the aesthetic property*. True aesthetic judgment requires confronting the object itself.

  **Alex:** So the critic’s incredibly detailed description – which might be far more informative than my own cursory glance – still doesn’t count? Only the direct, unmediated (or imagination-mediated, which you seem to grudgingly allow) encounter justifies the belief? Riley, this feels like you’re protecting a mystical core of ‘the aesthetic experience’ by fiat. You’re saying aesthetics is *sui generis*, that testimony uniquely fails here. But you haven’t given me a *principled reason* why the chain of justification breaks *only* when the property is aesthetic. Why can’t Maya’s reliable testimony about her reliable perceptual and emotional faculties encountering the Cézanne confer justification on me, just as the physicist’s testimony about her reliable instruments encountering the Higgs decay confers justification? Why is the aesthetic response uniquely non-transferrable?

  **Riley:** Because the aesthetic property *is* constituted by the response! Saying the symphony *is* beautiful *just is* saying it merits a certain kind of experience. Knowing *that* it merits that experience requires either having the experience or understanding *how* it merits it – which, for aesthetic properties, *requires* engaging with the object's specific perceptible features in a way that triggers the understanding of that merit. Testimony can report *that* it merits, but it cannot give you access to *how* or *why* it merits in the direct way needed for aesthetic justification. The physicist’s testimony succeeds because the property (Higgs decay) exists independently of the specific human experience of observing it; the justification chain relies on shared, objective procedures. The beauty of the symphony *depends* on the possibility of the experience it affords. Transferring *that* knowledge requires accessing the affordance. The epistemic defect is fundamental: testimony cannot supply the necessary justifier – the first-personal apprehension of the aesthetic quality in the object.

  **Alex:** And I still say that’s special pleading. You’re defining aesthetic properties *in terms of* the unreliability of testimony about them! If Maya is reliable, and I’m justified in trusting her, and she’s justified in her belief about the Cézanne’s beauty through her experience, then *my* belief inherits that justification. The burden is on *you* to show why this chain, which works for Higgs bosons and the wrongness of torture (on your own admission, for practical reasons), mysteriously snaps when the predicate is ‘beautiful’. You haven’t shown a break in the chain; you’ve just pointed at the experiential node and declared it non-transferrable by assertion, not by argument. You’re confusing the *richness* of the knowing state with the *justification* for the belief.

  **Riley:** And you, Alex, are flattening all domains of knowledge, ignoring the constitutive link between aesthetic concepts and first-personal sensibility. Testimony is a derivative source. In aesthetics, it cannot provide the foundational justifier – the encounter with the work’s perceptible form and its experiential impact. Your belief, resting solely on Maya’s word, is *about* Maya’s judgment, not about the beauty *in the world*. It lacks the world-to-mind direction of fit that aesthetic knowledge requires. The justification is incomplete; it points towards the required experience but cannot stand in for it. The chain doesn’t ‘snap’; it simply doesn’t reach the object in the right way for this type of property.

  **Alex:** So we’re back to the start, just more precisely? You say the aesthetic requires an unmediated encounter for justification, making testimony inherently inadequate. I say testimony transmits justification reliably if the source is reliable, and the burden is on you to explain why aesthetics is the magical exception where this otherwise robust epistemic mechanism fails. Is that the impasse?

  **Riley:** (Nods firmly) Precisely. The impasse is ontological and epistemic: you see aesthetic properties as objective features knowable through reliable reports like any other; I see them as inherently experiential qualities whose knowability is tethered to the subject's direct engagement. Testimony can report the fact *of* the experience, but it cannot ground the knowledge *of* the aesthetic quality itself. The defect is not merely practical impotence; it’s a lack of the specific, experiential justification required for *aesthetic* belief.

  **Alex:** And I maintain that distinction is illusory, a romanticization of the aesthetic that elevates personal experience over reliable social knowledge without sufficient grounds. Your deaf musicologist, on your view, is forever barred from aesthetic knowledge of the symphony, which seems absurd. My belief, grounded in Maya’s expertise, *is* justified belief about the beauty *in the work*, not just about her. We just fundamentally disagree on what kind of warrant testimony provides in this domain. So yeah. Impasse. Same as last time, just… more articulate. More coffee?

  **Riley:** (Manages a small, tired smile) Always. But next time, *you* explain why syllogisms are valid without drawing the Venn diagrams yourself. See if testimony works there. *(She pushes her mug towards the pot.)*

  **Alex:** (Laughs, pouring) Deal. Though I suspect you’ll find a way to make *modus ponens* require first-personal apprehension of logical force… *(The unresolved tension hangs in the air, familiar and sharp, as the coffee pours.)*
