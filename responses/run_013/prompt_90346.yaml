prompt: |-
  I am drafting a welfare standard for a retailer that sells farmed finfish, shrimp and other crustaceans, and every clause in it will have to be defended in writing. Before I write the clauses I need the specification: what would any adequate theory of the welfare of these animals have to deliver? I want the desiderata, each with the case or consideration that forces it, rather than a survey of positions — and where a requirement turns out to be the prejudice of one camp rather than a genuine demand on any theory, I want that said plainly.

  The list has to cover at least this ground. What welfare consists in for a fish or a decapod — felt experience, biological functioning, preference satisfaction — and whether an adequate theory must settle that question or may remain neutral among the answers. A criterion of subjecthood: what would make the answer yes or no for a prawn, a mussel and a salmon. The evidential requirements, with an account of why each piece of evidence is supposed to bear on the verdict: nociceptors and whether their signals reach an integrative centre; motivational trade-offs against a noxious stimulus; the reversal of a response by analgesia rather than by anaesthesia or motor blockade; avoidance learning; self-protection; lasting effects of noxious experience. Calibration cases at both ends, since a theory that gets only the easy cases right is worthless here: it must not admit the cases I am confident are non-subjects — a mussel, a plant, an immune response — and must not exclude the ones I am confident are subjects, a salmon, and both kinds of error have to be priced rather than merely avoided. Extrapolation: the standard will be applied across hundreds of species on thin evidence, so the theory must say how far a finding in one taxon licenses an inference about another, and what to do when the case for a species rests only on its relatives. Verdicts about practice: whether the theory can rank, or at least compare, the aversiveness of crowding, air exposure, handling, live chilling, electrical stunning and live boiling, and whether it owes us anything about killing as distinct from suffering. And the treatment of uncertainty: what it says when sentience is plausible but unproven, and whether a precautionary rule belongs to the theory of welfare itself or is a decision rule grafted onto it from outside.

  It should also respect the distinctions that the field tends to collapse — between being sentient and having a welfare, between suffering and dying — and it should explain rather than explain away the cases that embarrass simple views, such as a noxious-evoked withdrawal reflex that outlasts the structures thought necessary for feeling, or a response abolished by a local anaesthetic while the reflex itself remains. Then the part I care about most: flag any pair of these desiderata that cannot be jointly satisfied. I suspect a graded, evidence-proportional account of sentience sits badly with the bright lines a standard needs, and that the demand for specificity is in tension with the demand to avoid false negatives; tell me whether either suspicion is well founded, which single requirement does the most work in excluding candidate theories, and finish with a short assessment of how a feelings-based theory, a functioning-based theory and a preference-based theory each fare against the list.
reasoning: |-
  Okay, let me tackle this user's request systematically. They're drafting a welfare standard for farmed aquatic animals and need a rigorous specification for what any adequate welfare theory must deliver. The challenge is to outline non-negotiable requirements while exposing theoretical tensions.

  First, I recognize this isn't about listing existing positions but defining mandatory features for defensible welfare assessments. The user explicitly wants desiderata with justifications, warnings about biases masquerading as requirements, and conflict flags between criteria. 

  Considering the scope, I'll structure around seven core demands:
  1. **Definitional substance** - Must specify whether welfare hinges on subjective states, function, or preferences, but crucially require operational links to measurable proxies regardless of metaphysical stance.
  2. **Subjecthood criteria** - Needs a non-circular test distinguishing salmon (clear subject) from mussels (clear non-subject), with explicit error-pricing for false positives/negatives.
  3. **Evidence hierarchy** - Should rank nociception studies (necessary but insufficient), motivational trade-offs (strong evidence), and analgesia reversals (gold standard) by diagnostic power.
  4. **Calibration robustness** - Must handle edge cases like reflexive withdrawal persisting beyond apparent "feeling" capacity without ad hoc exceptions.
  5. **Taxonomic extrapolation** - Requires rules for inferring shrimp welfare from lobster data based on phylogenetic distance and functional similarity.
  6. **Practical comparability** - Needs to rank aversiveness of procedures (e.g., air exposure vs. crowding) even with imperfect data.
  7. **Uncertainty protocol** - Must separate scientific assessment of welfare from precautionary policies applied when evidence is equivocal.

  The key conflicts emerge between:
  - Graded sentience evidence vs. binary standards
  - Avoiding false negatives (suffering ignored) vs. false positives (overregulation)
  - Theory neutrality vs. practical specificity

  For instance, preference theories excel at cross-species aversiveness rankings but struggle with maladaptive choices. Feeling-based approaches handle intrinsic harm well but lack objective measures. Functioning theories avoid subjectivity debates but risk ignoring experiences.

  Most exclusionary requirement is calibration - many theories fail on mussels (over-inclusive) or salmon (under-inclusive). Evidence-proportional approaches face tension with bright-line rules, necessitating tiered standards or severity thresholds.

  Final note: Uncertainty handling is critical. The theory itself shouldn't dictate precaution; that's a policy layer. The science must transparently report confidence levels for each species-procedure combination.
answer: |-
  Here is a specification of desiderata for an adequate theory of welfare for farmed finfish and decapod crustaceans, structured to meet your requirements. Each item includes the underlying rationale, critical distinctions, and conflicts flagged where they arise. The list prioritizes defensibility, operationalizability, and avoidance of theoretical bias.

  ---

  ### **Core Desiderata for an Adequate Welfare Theory**
  1. **Definitional Substance without Metaphysical Commitment**  
     - **Requirement**: The theory must define welfare *operationally* (e.g., via measurable indicators) while remaining *neutral* on whether welfare fundamentally consists in felt experience, biological functioning, or preference satisfaction.  
     - **Rationale**:  
       - Retail standards require actionable metrics (e.g., mortality rates, injury scores, behavioral avoidance), not philosophical resolution.  
       - Neutrality avoids privileging contentious camps (e.g., "feelings-only" vs. "preferences-only" views).  
     - **Non-Negotiable**: A theory failing here imposes arbitrary ideological constraints.

  2. **Subjecthood Criterion with Calibration**  
     - **Requirement**: Must provide a testable criterion for welfare subjects that:  
       - **Includes** salmon (finfish) and decapods (e.g., shrimp) as subjects.  
       - **Excludes** mussels (bivalves), plants, and reflexive immune responses as non-subjects.  
       - **Prices errors explicitly**: False negatives (e.g., denying welfare to a sentient prawn) must be weighted more heavily than false positives (e.g., granting welfare to a mussel).  
     - **Rationale**:  
       - Mussels lack centralized integration of sensory input; plants have no nociceptive or behavioral avoidance systems.  
       - Asymmetric error weighting reflects precaution: suffering from misclassification is worse than unnecessary protection.  
     - **Calibration Cases**:  
       - **Salmon/shrimp**: Integrative brain structures, complex learning, trade-off behaviors.  
       - **Mussels/plants**: No central nervous system, purely local reflexes.  

  3. **Evidence Hierarchy with Diagnostic Power**  
     - **Requirement**: Must rank evidence types by inferential strength for suffering:  
       1. **Strong**: Motivational trade-offs (e.g., enduring electric shock to access food) + reversal by analgesia (not anesthesia).  
       2. **Moderate**: Avoidance learning, lasting behavioral changes post-stress.  
       3. **Weak**: Nociceptors alone or reflexes (e.g., tail withdrawal).  
     - **Rationale**:  
       - Trade-offs + analgesia indicate *affective* states (not just reflexes); nociceptors without integration prove nothing (e.g., human spinal cord reflexes).  
       - Cases like reflex persistence despite "feeling" ablation (e.g., in spinally transected mammals) show why reflexes are insufficient.  

  4. **Extrapolation Rules for Taxonomic Uncertainty**  
     - **Requirement**: Must specify when findings in one species license inferences about another:  
       - **Strong inference**: Shared neuroanatomy (e.g., telencephalon in finfish) + homologous behavior (e.g., opioid responses).  
       - **Weak inference**: Phylogenetic proximity alone (e.g., crab data applied to shrimp).  
       - **Default**: If evidence is absent for a species but present in close relatives, presume sentience exists.  
     - **Rationale**: Avoids "evidence voids" being misinterpreted as evidence of absence.  

  5. **Practical Comparability of Aversive Conditions**  
     - **Requirement**: Must enable ordinal ranking of procedures (e.g., live chilling > crowding > handling) based on:  
       - Behavioral intensity (e.g., escape attempts).  
       - Physiological stress markers (e.g., cortisol).  
       - Duration of impact (e.g., chronic vs. acute).  
     - **Distinction**: Killing methods require separate evaluation (death ≠ suffering; instantaneous vs. prolonged death).  
     - **Rationale**: Standards need actionable guidance; a theory that only identifies "harm" without gradation is useless for prioritization.  

  6. **Uncertainty Protocol with Precautionary Distinction**  
     - **Requirement**:  
       - The theory must report confidence levels (e.g., "strong evidence for sentience" vs. "equivocal").  
       - **Precaution is external**: Welfare science assesses evidence; precautionary measures (e.g., banning live chilling) are ethical/policy decisions.  
     - **Rationale**: Conflating science with precaution muddles justification and invites charges of bias.  

  7. **Resolution of Anomalous Cases**  
     - **Requirement**: Must explain phenomena that challenge simple views:  
       - Reflexes outlasting "necessary" structures (e.g., noxious withdrawal in decerebrate animals).  
       - Local anesthesia abolishing "feeling" but not reflexes.  
     - **Rationale**: These cases undermine theories equating reflexes with suffering; adequate theories must distinguish nociception from affect.  

  ---

  ### **Inherent Tensions Between Desiderata**
  - **Graded Evidence vs. Bright Lines**:  
    Evidence-proportional sentience (e.g., "shrimp likely feel pain but less intensely than salmon") clashes with binary standards (e.g., "all decapods are sentient").  
    - **Conflict**: Bright lines are legally/practically necessary but oversimplify biology. **Resolution**: Tiered standards (e.g., "minimum requirements for all crustaceans; enhanced for taxa with strong evidence").  

  - **Specificity vs. False Negatives**:  
    Demanding high specificity (e.g., requiring analgesia reversals) risks false negatives (e.g., rejecting sentience in species where analgesia testing is impractical).  
    - **Conflict**: Over-reliance on gold-standard evidence excludes less-studied species. **Resolution**: Use multi-evidence thresholds (e.g., "avoidance learning + trade-offs" suffices if analgesia data absent).  

  - **Neutrality vs. Practical Rankings**:  
    Neutral theories (e.g., functioning-based) struggle to compare aversiveness across procedures (e.g., is air exposure worse than crowding?). Preference-based theories handle this best.  

  ---

  ### **Most Exclusionary Requirement**  
  **Calibration with Asymmetric Error Pricing** excludes the most theories.  
  - **Excluded**:  
    - Theories denying all invertebrate sentience (fails shrimp inclusion).  
    - Over-inclusive theories (e.g., "any nociception = suffering"; fails mussel exclusion).  
    - Theories ignoring error costs (e.g., treating false positives/negatives equally).  

  ---

  ### **Assessment of Major Welfare Theories**  
  | **Theory Type**       | **Feelings-Based**          | **Functioning-Based**       | **Preference-Based**        |  
  |------------------------|-----------------------------|-----------------------------|-----------------------------|  
  | **Definitional Neutrality** | Fails (commits to subjectivity) | Fails (commits to objective health) | Fails (commits to desires) |  
  | **Subjecthood Calibration** | Strong (aligns with neurology) | Weak (mussels could "function" poorly) | Moderate (preferences may exist without sentience) |  
  | **Evidence Hierarchy**   | Strong (prioritizes affective markers) | Moderate (ignores "unfelt" dysfunction) | Strong (trade-offs are central) |  
  | **Aversiveness Ranking** | Weak (hard to quantify feelings) | Weak (health impacts ≠ suffering intensity) | **Strong** (directly measures costs) |  
  | **Handling Uncertainty** | Moderate (equivocal cases abound) | Strong (health metrics are clear) | Moderate (preferences may be maladaptive) |  
  | **Verdict**             | Best for foundations but least practical. | Simplest but risks ignoring suffering. | Most operational for standards but may miss intrinsic harm. |  

  ---

  ### **Synthesis**  
  An adequate theory must:  
  1. **Separate science from policy** (e.g., evidence assessment ≠ precaution).  
  2. **Use a multi-evidence threshold** for subjecthood (nociception + integration + trade-offs).  
  3. **Adopt asymmetric error pricing** to minimize suffering risks.  
  4. **Tier practical requirements** by evidence strength (e.g., "electrical stunning mandatory for salmon; recommended for shrimp").  
  5. **Prefer preference-based aversiveness rankings** where possible, supplemented by physiological markers.  

  **Critical Trade-off**: No theory perfectly reconciles graded biological reality with bright-line rules. Your standard must explicitly define where it sets thresholds (e.g., "sufficient evidence" = trade-offs + one other marker) and justify these as harm-minimizing compromises.
