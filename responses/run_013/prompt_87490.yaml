prompt: |-
  I sit on the acquisitions and repatriation committee of a mid-sized encyclopedic museum, and for the past several months we have been circling a pattern that I cannot stop noticing across the whole sector. The same institutions that now return human remains to descendant communities with comparatively little resistance -- and that will sometimes hand back objects described as sacred, ritually used, or still caught up in a living religious practice -- remain extraordinarily reluctant to part with art: the Benin Bronzes, the Parthenon Marbles, Egyptian antiquities, and the rest, even where the original acquisition involved conquest, coercion, or a price that nobody involved would have called free. Our committee's working rule, which I suspect many museums share without ever stating it, is roughly that duress vitiates a title but a sale does not, and that the strength of a claimant's standing tracks whether the object is the sort of thing a person can be wronged through -- remains, relics, consecrated things -- rather than whether the claimant community was itself wronged in the taking. I would like you to tell me what philosophical commitments this two-track practice presupposes.

  What theory of property does it require, and what theory of the value or ontology of objects -- that some things are persons-adjacent and others are mere chattel, that a community has a claim to its material culture as such, or something else entirely? Does the practice presuppose that cultural identity is bound up with specific objects, or can it get by with a thinner view on which the wrong is only ever a wrong to individuals? I am especially interested in whether the two tracks are consistent with one another: if the special status of remains rests on the dignity or continued personhood of the dead, does anything in that reasoning extend to a mask or a bronze that a community treats as a living presence, or does the practice quietly rely on two incompatible pictures of what makes a claim valid? Reconstruct the implicit theory as charitably as you can, then separate what the practice strictly presupposes from what it merely fits comfortably with, and say where it is philosophically underdetermined -- which rival theories would license the same behavior. Finally, tell me what would have to change if we abandoned the presupposed view and adopted either a flatly possession-based account of title, on which long possession plus a bona fide purchase settles the matter regardless of origin, or the opposite view that a people's relation to its heritage is not a property relation at all; which parts of current museum practice would survive each replacement, and which would become indefensible overnight. I do not need a reading list or citations; I want the argument, and I would rather you reason from the practice as I have described it than reach for authorities.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble and no restating of my question.
reasoning: |-
  Hmm, the user is on the acquisitions and repatriation committee of a museum and has observed a pattern in the sector. Museums are returning human remains and sacred objects but resisting returning art like the Benin Bronzes or Parthenon Marbles. They suspect museums have an unspoken rule: duress invalidates ownership but a sale doesn't, and claims are stronger when objects are tied to personhood (like remains) rather than when the community was wronged.

  The user wants me to identify the philosophical commitments behind this two-track practice. They're asking about the theories of property, object value, and cultural identity involved. Specifically, they want to know if the two tracks are consistent, what the practice presupposes, and what would change if different property theories were adopted.

  First, I need to reconstruct the implicit theory. The practice distinguishes between objects based on their nature: person-adjacent vs. mere chattel. For remains or sacred items, the claim is about continued personhood or dignity. For art, it's about property rights that can be transferred by sale. This suggests a dual ontology: some objects have inherent person-like status, making their removal a violation of dignity, while others are property that can be legitimately transferred.

  The property theory here is mixed. It assumes that valid title requires consent without coercion, but for art, even if acquired under duress, if framed as a sale, it's seen as legitimate. This leans towards a Lockean view where labor or cultural significance might create property rights, but only for certain objects.

  On cultural identity, the practice presupposes that communities have a stronger claim to objects integral to their identity, especially those with person-like status. But it's inconsistent: for remains, it's about the object's nature; for art, it's about historical ownership. The two tracks might be inconsistent if sacred objects like masks are treated as mere art, ignoring their living presence in cultural practices.

  Now, separating presuppositions from comfortable fits. The practice strictly requires a distinction between person-adjacent and chattel objects, and that wrongful taking invalidates title only for the former. It comfortably fits with cultural property norms but doesn't require a thick view of cultural identity.

  Underdetermined aspects include why some objects get person-adjacent status—why Benin Bronzes might not qualify despite their significance. Rival theories like strict legalism or communitarian views could lead to the same behavior by emphasizing different rationales.

  If they adopt a possession-based theory (good faith purchase plus time), even remains might not be returned, which would conflict with current ethical standards. Sacred art claims would weaken. Conversely, if heritage isn't property at all, all cultural objects might need repatriation, dismantling collections. Current practices around art retention would become indefensible, but remains repatriation might continue on dignity grounds.

  The user's deeper need might be to understand the inconsistencies to advocate for policy changes. They might seek arguments to challenge the status quo or unify repatriation criteria. Highlighting philosophical tensions could help them push for a more coherent approach.
answer: |-
  The museum sector's two-track repatriation practice presupposes a dualist ontology of objects and a hybrid theory of property that prioritizes violations of personhood over historical injustice to communities, relying on inconsistent philosophical commitments that become unstable under scrutiny.  

  **Implicit Philosophical Commitments:**  
  1. **Object Ontology:** The practice requires distinguishing *person-adjacent entities* (remains, sacred relics) from *aesthetic/cultural chattel*. Person-adjacent objects are seen as extensions of human dignity or personhood—violating them constitutes a direct wrong to individuals (living or dead) by treating persons as property. Artifacts like the Benin Bronzes are ontologically "mere" property, valued for artistic/cultural significance but not embodying personhood.  
  2. **Property Theory:** It assumes a *consent-based* view of title: coercion vitiates ownership (hence returning remains taken without consent), while nominal "sales"—even under colonial duress—transfer valid title if framed as transactions. This hybridizes Lockean labor theory (cultural objects express communal labor/identity) with legal positivism (title rests on documented transfer).  
  3. **Grounds for Claims:** Standing depends on *the nature of the object*, not the wrong to the community. Sacred objects wrong *individual believers* by desecrating their religious autonomy; art objects wrong *past owners* through unlawful seizure. Current communities inherit claims only via continuity with those individuals, not as collective cultural stewards.  

  **Consistency and Gaps:**  
  - The tracks are **inconsistent** if sacred objects (e.g., ritual masks) are treated as "art" rather than person-adjacent. The practice tacitly denies that communities can be wronged *through* cultural objects unless they embody literal personhood (e.g., remains). Yet if a mask is a "living presence," its ontological status should mirror relics—yet it’s often excluded, revealing an unstated secular/materialist bias.  
  - **Underdetermined Elements:**  
    - *Why personhood applies only narrowly*: Rival theories (e.g., Kantian dignity vs. animist metaphysics) could justify the same behavior but clash on whether cultural objects *participate* in personhood.  
    - *What counts as "consent"*: The practice fits both historical positivism (any documented "sale" suffices) and critical theories (consent requires equal power).  
    - *Cultural identity*: Presupposes a *thin* view—wrongs attach to individuals, not groups. A thicker communitarian view (cultures as entities with rights) would collapse the two-track system but isn’t required.  

  **Alternative Theories and Consequences:**  
  1. **Flat Possession-Based Title (e.g., prescriptive acquisitiveness):**  
     - **Survives:** Retention of all artifacts acquired via "sales" (Benin Bronzes, Parthenon Marbles), as long as possession is long-standing and "bona fide."  
     - **Collapses:** Repatriation of *any* object, including remains or sacred items. Ethical guidelines like NAGPRA compliance become indefensible; the distinction between remains and art vanishes.  
  2. **Heritage-as-Nonproperty (e.g., inalienable collective inheritance):**  
     - **Survives:** Return of remains/sacred items (now framed as cultural continuity, not property).  
     - **Collapses:** Retention of *all* culturally significant objects (e.g., Egyptian antiquities) becomes theft-by-custody. Acquisition ethics shifts to perpetual loans or co-stewardship, invalidating permanent collections built on colonial appropriation.  

  **Bottom Line:** The practice’s fragility lies in its arbitrary ontological divide between "sacred" and "aesthetic" objects, which obscures deeper tensions between reparative justice and institutional self-preservation—a divide unsustainable if challenged by unified theories of cultural harm.
