prompt: |-
  I'm in a small reading group that meets on Thursdays and has spent the last two months on decision theory, and there's an argument a friend of mine — Ines, a physicist who is much more confident about this than I am — keeps making about counterfactual mugging, and I can't tell whether it's decisive or whether it's the kind of argument that only looks decisive because of the picture it comes wrapped in. The setup we've been using: Omega flips a fair coin; if it comes up heads, Omega hands you $10,000 on the strength of its prediction that you would have paid had the coin come up tails; if it comes up tails, Omega asks you for $100 and tells you that the coin came up tails. Ines says anyone who refuses to pay is making precisely the two-boxer's mistake in Newcomb's problem. Her line is that counterfactual mugging is just Newcomb's problem with a coin substituted for the boxes: Omega is the predictor, the willingness to pay is the one-boxing, the $10,000 is the million, the $100 you hand over is the $1,000 you forgo when you decline the visible box, and in both cases you come out ahead for the same reason — the predictor had already settled the matter before you chose. She takes that to settle everything: paying is not some exotic updateless manoeuvre, it is simply one-boxing, and the reluctance people feel is two-boxer intuition wearing a new hat. I'd like the analogy audited rather than applied. What corresponds to what, and which of the correspondences are actually load-bearing? Where does the mapping break? I have a nagging sense that the one-boxer ends up richer in the world she is actually in, whereas the mugger-payer's money has been banked by a version of himself he will never meet, and I don't know whether that is a genuine disanalogy or simply the thing the analogy is meant to teach me to get over. And what does the Newcomb framing quietly assume about who "you" are across the two coin branches — does it import a contested premise instead of arguing for one?

  I'd like the case that split the group handled in the same terms, because I suspect it's the real test. Omega sends a note saying that it has sent the note if and only if your house has been infested with termites or you pay Omega $1,000, where the infestation would cost you vastly more than the payment; Omega is a perfect predictor, so it knew in advance whether you would pay. One person in the group said this is the same structure as the mugging and that anyone who pays the mugger should pay here too; another said the blackmail case is exactly where the analogy stops reporting a resemblance and starts doing the work, since what your payment buys there is a different branch of the world rather than a different outcome in this one. Does the Newcomb correspondence survive that case, or does it fail there in a way that ought to make me doubt it in the mugging case as well? Please give me the correspondence table first, then the breaks, separating the disanalogies that matter for Ines's conclusion from the ones that are merely decorative, and then say plainly whether her conclusion — that paying is just one-boxing and therefore nothing exotic — survives with all of that on the table. If some better analogy captures what the mugger-payer is actually doing, tell me what it is and what it buys and what it costs. I'm not looking for a tour of the named theories; I want to know whether this particular argument works. And if I've framed the question in a way that begs it, or if the analogy can't be audited without first settling the substantive dispute it's being used to settle, say so plainly rather than humouring me — I would much rather be told that my framing is confused than receive a tidy answer that quietly assumes the very thing I'm trying to test.
reasoning: |-
  Okay, let me try to unpack this user's query. They're part of a reading group discussing decision theory, specifically counterfactual mugging. Their friend Ines, a physicist, argues that refusing to pay in the mugging is like two-boxing in Newcomb's problem. The user wants to audit this analogy, not just accept it.

  First, I need to recall the setups. In counterfactual mugging, Omega flips a coin; heads you get $10k based on predicting you'd pay if tails, tails you're asked for $100. Newcomb's has Omega predicting your choice: one-boxing gets you $1M, two-boxing gets $1k extra but misses the million. Ines equates paying the mugger with one-boxing.

  The user has concerns. They feel the one-boxer ends up richer in their actual world, whereas the mugger payer's benefit is in a counterfactual branch they never experience. Also, they mention a blackmail case: Omega sends a note iff your house has termites or you pay $1000. Paying prevents the note, but if you don't pay and have termites, you get the note. Here, paying might seem different because it affects the actual world outcome directly.

  I should map the analogies carefully. In Newcomb, one-boxing leads to getting $1M. In the mugging, paying $100 when tails doesn't directly give you money; instead, the heads outcome relies on the counterfactual. The mugger payer never sees the $10k; it's given to the counterfactual version. That's a key disanalogy. The blackmail case makes it starker: paying $1000 avoids the note only if you have termites, but if you don't have termites, paying is wasteful. This introduces a dependency on actual circumstances, unlike Newcomb where the choice directly causes the outcome.

  Ines's argument might conflate prediction with counterfactual dependency. Newcomb's relies on Omega's prediction accuracy, linking choice to outcome in the same branch. The mugging involves Omega rewarding past counterfactual behavior, which you can't change. Paying in tails doesn't cause the heads reward; it's already determined. 

  The user's nagging sense is valid: in Newcomb, acting rationally (one-boxing) brings immediate benefit. In the mugging, paying when tails benefits a different version of yourself. The blackmail case highlights this: paying only helps if termites exist, which you might not know. This breaks the analogy because in Newcomb, the predictor's accuracy is key, but in blackmail, your action's effect depends on hidden states.

  So, Ines's conclusion doesn't hold. Paying in the mugging isn't identical to one-boxing; it's more about commitment across branches, which is updateless decision theory. The blackmail case further shows the disanalogy, as payment's value depends on unobserved states. Therefore, Ines's argument oversimplifies by ignoring the counterfactual nature of the mugging's reward structure.
answer: |-
  Here's a thorough audit of Ines's analogy, structured as requested. The core issue is whether "paying in Counterfactual Mugging (CM) = one-boxing in Newcomb" is a valid identity or a misleading simplification. The blackmail case is crucial for testing this.

  ### Correspondence Table (Ines's Mapping)
  | **Newcomb's Problem (NP)** | **Counterfactual Mugging (CM)** | **Blackmail Case (BC)** |
  |----------------------------|--------------------------------|-------------------------|
  | Omega (perfect predictor) | Omega (perfect predictor) | Omega (perfect predictor) |
  | One-boxing choice | Paying the $100 when tails | Paying the $1,000 |
  | Two-boxing choice | Refusing to pay when tails | Refusing to pay |
  | $1,000,000 in opaque box | $10,000 when heads | Avoiding termite costs (iff termites exist) |
  | $1,000 in transparent box | Keeping $100 when tails | Keeping $1,000 (iff no termites or refusal) |
  | "One-boxers end up richer" | "Payers end up richer" | "Payers avoid disaster iff termites exist" |

  ### Load-Bearing vs. Decorative Correspondences
  - **Load-Bearing (Critical for Ines)**:  
    - *Omega's prediction accuracy*: Valid in all cases. Omega's infallibility is foundational.  
    - *Dominance reasoning fails*: In NP, two-boxing dominates locally but loses globally. Similarly, refusing dominates locally in CM/BC but may lose globally.  
    - *Precommitment logic*: NP one-boxers "precommit" to trust Omega. CM payers "precommit" to cooperate counterfactually.  

  - **Decorative (Superficial, not structural)**:  
    - "$10,000 = $1M": The amounts are irrelevant; it's about dominance violation.  
    - "Coin flip = boxes": The coin introduces branching, but NP's boxes are deterministic given choice.  
    - "Handing over money": In NP, you *gain* by *not* taking the transparent box; in CM/BC, you *lose* cash upfront. This is cosmetic.  

  ### Where the Analogy Breaks (Structurally)
  1. **The Nature of the "Reward"**:  
     - In NP, one-boxing **directly causes** you to receive $1M *in your actual branch*.  
     - In CM, paying **does not cause** the $10K reward. That reward was given *in a different branch* (heads) based on a *counterfactual prediction*. You (in tails) pay $100 solely to uphold a precommitment, with no causal benefit to yourself.  
     - In BC, paying avoids the note *only if termites exist*. If termites don't exist, paying is pure loss. Unlike NP, the value of paying **depends on an unobserved state** (termites).  

  2. **Who Benefits, and Where?**:  
     - **NP**: The one-boxer is richer *in their actual world*.  
     - **CM**: The payer (in tails) is poorer *in their actual world* ($100 loss). The "benefit" ($10K in heads) goes to a *different version* of you in a branch you never experience.  
     - **BC**: Paying benefits you *only if termites exist*. If no termites, paying harms you; if termites, refusing harms you catastrophically.  

  3. **Temporal/Counterfactual Dependence**:  
     - In NP, Omega predicts *your actual choice*. Your choice *validates* the prediction.  
     - In CM, Omega rewards *a past counterfactual version* of your decision logic. Your actual choice (in tails) *cannot change the heads outcome*; it only satisfies a precommitment.  
     - In BC, Omega's note depends on *both* the termite state *and* your payment. Payment doesn't "validate" a prediction; it *changes the outcome* conditional on termites.  

  ### The Blackmail Case as Litmus Test
  - **Why it strains the analogy**:  
    - In BC, paying is rational **only if you believe termites exist**. If you're sure no termites exist, refusing dominates. This introduces **evidential uncertainty** absent in NP/CM.  
    - NP/CM rely on pure prediction. BC ties payment to an *independent fact* (termites), making it closer to a **signaling game**. Paying signals you *believe* you have termites, but Omega already knows.  
  - **Impact on Ines's argument**:  
    If CM = NP, then BC should be identical. But BC forces a disanalogy:  
    - **NP/CM**: Your choice only affects Omega's *past prediction accuracy*.  
    - **BC**: Your choice affects *present outcome* (note sent/not sent) based on hidden state.  
    This breaks Ines's equivalence. NP/CM reward *precommitment consistency*; BC rewards *conditional action under uncertainty*.  

  ### Does Ines's Conclusion Survive?
  **No, not fully.** Her analogy is **pragmatically useful but metaphysically flawed**:  
  - **What it gets right**:  
    Both NP one-boxers and CM payers reject myopic dominance in favor of global cooperation with Omega. In both, refusal stems from "I won't pay for what I didn't get" (two-boxer logic).  
  - **Where it fails**:  
    - **CM is "exotic" in a way NP isn't**: NP rewards you *in your branch* for your *actual choice*. CM asks you to pay *in your branch* to reward *a different branch's counterfactual you*. This is **updateless decision theory** (UDT) in action: maximizing utility *across branches*.  
    - **"Who you are" matters**: Ines's mapping assumes "you" are a **timeless decision algorithm** (UDT view). If "you" are **branch-specific** (causal decision theory view), paying in CM *is* irrational—it sacrifices your branch's welfare for another's.  
  - **Better analogy for CM**:  
    **Prisoner's Dilemma (PD) with your counterfactual self**.  
    - *Heads branch*: "You" get $10K if your counterfactual twin cooperates (would pay).  
    - *Tails branch*: "You" pay $100 to cooperate, securing the $10K for your twin.  
    Paying is cooperating across branches. Refusing defection.  
    - *What it buys*: Global utility maximization if all "yous" coordinate.  
    - *What it costs*: Personal loss in your branch (the $100).  

  ### Verdict on Ines's Argument
  - **Strength**: It correctly diagnoses refusal in CM as the **same cognitive error** as two-boxing: privileging local dominance over predicted global cooperation.  
  - **Weakness**: It **glosses over the counterfactual ontology**. Paying in CM *is* exotic (UDT-style), while one-boxing in NP is not. The blackmail case amplifies this by introducing state-dependence, further fracturing the parallel.  
  - **Should you pay?**  
    - If you accept **UDT** (you are a decision algorithm across branches), pay in CM *and* BC (if termite probability > cost/risk ratio).  
    - If you accept **branch-specific rationality**, refuse in CM and BC (unless BC termite risk is high).  
    Ines's argument **assumes UDT without arguing for it**—it smuggles in the contested premise.  

  > "The analogy can't be audited without settling the substantive dispute."  
  > **Yes.** Ines uses NP to *leverage* intuitions for UDT in CM. But NP doesn't *require* UDT (causal one-boxers exist), while CM *does*. Her argument works only if you already accept that "you" are the algorithm, not the branch-specific instance. The blackmail case exposes this dependency. Audit complete.
