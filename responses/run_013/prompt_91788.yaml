  The norm has to be positive, like sharing or generosity. Perhaps a norm of helping others, even if it depletes the resource. For example, in a fishery, if there's a norm to share excess catch, but that leads to overfishing because everyone feels obligated to help others, thus increasing total effort. 

  The setting: a coastal village with a lagoon fishery. Self-interest: each fisher knows that conserving fish stocks ensures future income, so they limit their catch. But a norm of "community support" means they share extra fish with families in need, leading others to fish more to meet these obligations, thus overexploiting.

  Why does self-interest lead to conservation? Because each fisher realizes that overfishing destroys their livelihood. They self-regulate to avoid collective ruin. But the norm of generosity forces them to give away fish, which incentivizes more fishing to maintain personal supply and meet social obligations. Even if they know it's harmful, the social pressure is too strong.

  The single feature making this work is the norm's mandatory generosity. Without it, self-interest would conserve, and without the norm, there'd be no overuse. Removing the norm means no pressure to share, so conservation happens. 

  The user anticipates pushback: that the norm is just disguised self-interest (e.g., gaining social status). But if the norm requires sharing even when it's costly with no direct payoff, it's genuine. If status leads to tangible benefits, that blurs the line. The defense is that the norm operates on moral duty, not calculative gains. If sharing brings future reciprocity, it's self-interest. The case must ensure that the norm's motivation is intrinsic, not instrumental.

  Need to ensure the scenario is realistic. Actual examples? Maybe some indigenous communities where sharing norms lead to resource strain when population grows or during crises. Research shows that in some Pacific islands, communal obligations can pressure overfishing. 

  Also, the users are aware. They know overfishing is bad, but the norm compels them. For instance, during a poor harvest, sharing depletes stocks further because everyone fishes more to cover their shares, leading to a vicious cycle.

