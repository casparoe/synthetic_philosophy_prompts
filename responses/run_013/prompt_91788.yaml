answer: |-
  Here’s the scenario, followed by the analysis:

  **Scenario: The Lagoon of Kinoro**  
  In Kinoro, a coastal village, families rely on a shallow lagoon fishery for food and income. The lagoon’s fish stocks regenerate slowly, and overfishing would collapse the population. Kinoro has no formal rules, leaders, or property rights over the lagoon. A deep-rooted social norm obligates every household to share their daily catch *equally* with any family that had poor luck fishing that day, ensuring no one goes hungry. This "Shared Luck" norm is highly valued—it reinforces community bonds and prevents starvation during temporary shortages. However, as the village grows, fishers increasingly anticipate that others might underfish, forcing them to "cover" shortages. Knowing that overfishing will doom the lagoon, each fisher still races to catch more *today* to avoid being unable to fulfill their sharing obligation tomorrow if others don’t fish enough.  

  ---

  ### Walkthrough  
  **1. Self-Interest / Marginal Cost Story Predicts Conservation**  
  - **Logic**: Each fisher weighs the *private* long-term cost of stock collapse against short-term gains. They realize that if *they* overfish, they personally lose future income. Restraint maximizes their individual lifetime profit.  
  - **Prediction**: Fishers voluntarily limit their catch to sustainable levels. No one overexploits because it’s against their self-interest.  
  - **Why?** In this model, actors are atomized profit-maximizers. Kinoro’s lack of rules forces each to internalize the risk: "If I overfish, *I* starve later."  

  **2. Community-Norms Story Predicts Overuse**  
  - **Logic**: The "Shared Luck" norm transforms individual incentives. Your catch isn’t just yours—it’s a communal safety net. If others fish less, *you* must catch more to meet sharing obligations. Even if all know the lagoon is at risk, no one can afford to fish less *first* for fear others won’t reciprocate.  
  - **Prediction**: A race to overfish ensues. Fishers exceed sustainable limits to avoid social shame or defaulting on obligations, collapsing the stock.  
  - **Why?** The norm (though prosocial) creates a *coordination failure*. Trust erodes: "If I restrain but others don’t, I’ll be forced to share my meager catch while they exploit my restraint."  

  **3. The Single Feature Doing the Work**  
  The **mandatory, unconditional sharing norm** is key. It:  
  - Decouples individual effort from individual benefit (your catch subsidizes others).  
  - Penalizes restraint (if you fish less, you still must share equally, leaving you with nothing).  
  - Rewards overfishing (catching more hedges against others’ underperformance).  

  **4. If the Sharing Norm Is Removed**  
  - **Self-interest story**: Still predicts conservation (individuals protect their "private" future stream).  
  - **Norms story**: Predicts conservation *or* sustainable cooperation (norms could now enforce restraint).  
  - **Outcome**: The tragedy of the commons is *avoided* without the norm.  

  **5. Pushback: "The Norm Is Just Hidden Self-Interest!"**  
  Self-interest theorists might argue: *"Fishers only follow the 'Shared Luck' norm to gain reciprocal aid or social status—it’s profit-maximization in disguise."*  
  **Why This Fails**:  
  - The norm operates *even when reciprocity is impossible* (e.g., helping elderly/non-fishing families).  
  - Shame for violating the norm persists even if covert violation is profitable and undetectable.  
  - **Key point**: If norm adherence were purely self-interested, fishers would *secretly underfish* while feigning participation. But in Kinoro, they *overfish openly* because the norm’s moral weight ("no one starves") overrides calculative gains. The damage arises precisely because the norm is *not* transactional—it’s a genuine moral obligation that perverts incentives.  

  ### Why This Works  
  - **No ignorance**: Fishers foresee the collapse but are trapped by the norm’s game-theoretic logic.  
  - **No enforcers**: The norm is self-policed through shame and reciprocity expectations.  
  - **Genuinely good norm**: Sharing prevents starvation and builds community resilience in normal times.  
  - **Flip achieved**: Self-interest saves the commons; a prosocial norm destroys it via uncoordinated interdependence.  

  **Teaching Insight**: This exposes how even benevolent norms can trigger resource collapse when they create mutual distrust or misalign effort and benefit. It forces students to grapple with *context*—the same norm that saves lives in a drought might wreck a fishery during population growth.
