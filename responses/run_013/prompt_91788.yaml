  First, I need to understand all constraints: realistic setting (village, fishery, etc.), no sci-fi, no external authority. The norm causing destruction must be genuinely good in other contexts, not stupid. Users aren't ignorant—they know the consequences. Also, no private owner or enforcer. The challenge is flipping the narratives without violating these.

