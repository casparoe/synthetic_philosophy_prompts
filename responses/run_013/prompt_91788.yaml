  I'm putting together a teaching case on common-pool resources and I want the usual predictions flipped. Build me a scenario (one paragraph, realistic — some actual kind of village, fishery, pasture or forest, no sci-fi, and no outside authority imposing rules) in which the plain self-interest / marginal-cost story predicts the resource gets conserved, while the community-norms-and-local-governance story predicts it gets wrecked. The catch: the norm that does the wrecking has to be a genuinely good norm in other respects — not a stupid or obviously destructive one — and it has to do its damage with no government, no private owner and no enforcer anywhere in the picture. Also dont let the answer just be "the users are ignorant"; they know what they're doing.

  Then walk me through it: what each of the two storys says and why; which single feature of the case is actually doing the work; what happens to both predictions if I delete that feature; and how someone who backs the self-interest story would push back — my guess is they'll claim the norm is really just a private payoff in disguise, so the two accounts never really diverge. Tell me whether that move works.
