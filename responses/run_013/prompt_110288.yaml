prompt: |-
  My father died in February. Two days before he did, he asked me to promise that I would never sell the family cabin, and I promised. I am now the one paying its taxes, the roof needs replacing, and there is an offer I would otherwise accept; and I find that I cannot say what it is about that promise that holds me, or how much it holds me for.

  To get my bearings I have been going through my other promises and writing down what I actually think, and the results do not fit together.

  (a) A colleague and I agree to meet for coffee; nothing turns on it; a better offer arrives. I think I still have to go, or at least to reschedule and explain.

  (b) My flatmate assumed I would drive her to the airport, because I always have; I never said I would. I do not think I owe her anything beyond an apology for a reasonable assumption.

  (c) My father's promise.

  (d) I told a stranger on a forum that I would send him a file; he never wrote again. I think I am still bound, though faintly, and only until he clearly no longer wants it.

  (e) A man holds a knife to my ribs and I promise to hand over my wallet. Nothing at all.

  (f) I promised to help a friend move, and my daughter was hospitalized the night before. I do not think the promise was void — I owed him an explanation, and I owe him the equivalent help another time.

  (g) I promised to keep a secret, then learned the secret was a plan to injure someone. The promise does not hold.

  (h) I promised to give a talk, and the organizers wrote to say they had found someone else. I was released, and the promise simply ended.

  (i) I resolved privately to run every morning; breaking it does not feel like the same kind of failure at all.

  The trouble is that the cases that hold me most tightly seem to have the least of what I would have said makes promises binding. My father expected nothing further, relied on nothing, and cannot be disappointed. Case (b) has all the reliance in the world and no promise. Case (d) is barely a promise and still binds. I have been assuming that what matters is the expectation I create and the disappointment I would cause, and that assumption cannot survive case (c).

  Is there a principle — or a small set of them — that gets my verdicts, or nearly all of them? I would like it stated precisely enough that I can apply it, with the case that forces each clause, a verdict on a case I have not settled (I promised my four-year-old nephew I would take him to the zoo on Saturday; a work emergency intervenes; he will be disappointed for a week and then forget), and an honest statement of which of my verdicts the principle cannot accommodate and must overturn. If one principle will not do the work, give me the two or three that come closest, say exactly where each one breaks, and say which I should prefer.

  Please open with the principle itself, in the first sentence, and then argue for it; no preamble, and do not restate my cases — refer to them by letter.
reasoning: |-
  Hmm, the user is grappling with a profound ethical dilemma about the binding nature of promises after their father's death. They've cataloged various promise scenarios (a through i) and found inconsistencies in their own judgments. The core tension is between their rational understanding of promises (based on expectations and reliance) and the visceral hold of their deathbed promise about the family cabin.

  I notice three key pain points:
  First, the emotional weight of the cabin promise contradicts their logical framework - their father won't be disappointed, didn't rely on it, yet it feels most binding. 
  Second, they're seeking a systematic ethical principle that can handle all their cases without contradictions. 
  Third, there's practical urgency - roof repairs, taxes, and an attractive offer are pressing concerns.

  The cases reveal fascinating patterns. Some promises bind without reliance (c,d), others don't bind despite reliance (b). Some dissolve with changed circumstances (f,h), others don't (a). Coercion voids promises (e) but self-made resolutions don't count (i). 

  I need to formulate principles that:
  1) Explain why (c) binds despite no reliance
  2) Resolve the nephew zoo dilemma
  3) Acknowledge where the framework must override their initial verdicts
  4) Distinguish between promises and mere expectations

  The "promissory obligation as sacred duty" concept seems most consistent with their judgments - especially how (c) and (d) bind without practical consequences. It also explains why coerced promises (e) and harmful secrets (g) don't obligate. For the nephew case, this principle suggests rescheduling is essential because breaking the promise would violate the sacred duty, regardless of the child's eventual forgetfulness.

  But it has one flaw: case (b) where no promise was made. Here I'll need a secondary principle about ethical obligations beyond promises, possibly introducing "assumed commitments" as weaker obligations. The user must decide between strict consistency and their intuitive verdicts - I'll recommend keeping (b)'s verdict since forcing that flatmate drive would feel morally wrong.

  For the cabin dilemma, this framework validates their feeling of obligation while acknowledging they could sell if the burden becomes unsustainable - the sacred duty has limits when it destroys the promise-keeper. Ultimately they must weigh whether keeping this particular promise honors or dishonors what their father valued.
answer: |-
  **The Principle:** A promise creates a binding obligation grounded in the *intentional creation of a sacred interpersonal bond* through the ritual of promising itself, whose strength and persistence depend on the *gravity of the commitment undertaken* and the *continuing existence of the moral context* in which it was made, subject to being overridden only by significantly higher moral duties, the fundamental impossibility of fulfillment, or the explicit release of the promisee.

  **Argument for the Principle:**

  This principle explains your verdicts by focusing on the *act of promising as a distinct moral ritual* creating a unique bond, rather than solely on reliance or expectation (which, as you note, fail in (c)).

  1.  **The Ritual & The Bond:** Promising (a, c, d, f, g, h) is a performative act intentionally invoking a special moral duty. This ritual creates the obligation, distinct from mere expectations (b) or resolutions (i). Its "sacredness" explains why even "bare" promises like (d) or those without future reliance like (c) bind – the duty arises from the *act itself* and the bond formed with the promisee.
  2.  **Gravity of the Commitment:** The binding force varies with the perceived weight of the promise at the time it was made. Frivolous coffee (a) binds weakly. A deathbed plea (c) binds with immense gravity. Helping a friend move (f) binds moderately. Agreeing to a talk (h) binds professionally. Coerced promises (e) lack gravity *because* the ritual is corrupted – no genuine bond is formed under duress. Private resolutions (i) lack the interpersonal ritual entirely.
  3.  **Continuing Moral Context:** The obligation persists only while the core moral context underpinning the promise remains valid.
      *   **Release:** The promisee (or their legitimate representative) can dissolve the bond (h).
      *   **Impossibility:** True impossibility (genuinely unavoidable conflict like (f) due to the daughter) suspends the *immediate* duty but doesn't void the underlying bond – hence owing equivalent help later. Physical impossibility would also apply.
      *   **Fundamental Moral Change:** If fulfilling the promise requires violating a significantly higher duty (e.g., preventing harm in (g)), the original bond is overridden and dissolved. The promise to the mugger (e) lacks a valid moral context from inception.
      *   **Cessation of the Promisee:** If the promisee ceases to exist *and* the promise's purpose is inherently tied to them, the context dissolves. This is key for (c): your father *is* gone, but the cabin promise's *purpose* (preserving family heritage/connection, honoring his wish) inherently persists *through you*, its inheritor. The bond remains active *because* the core purpose – respecting his dying wish as a connection to him and the family past – endures. Selling would directly violate the *enduring purpose* of the promise, even though he cannot be disappointed. Contrast this with (d): if the stranger permanently vanished and the file's purpose *for him* was clearly gone (e.g., the project ended), the context *could* dissolve, weakening the "faint" bind.

  **Applying the Principle to the New Case (Nephew/Zoo):**

  *   **Verdict:** You are significantly obligated to take your nephew to the zoo. Rescheduling due to a genuine work emergency (approaching "impossibility" of the original timing) is acceptable and necessary, but you must make a *serious, timely effort* to fulfill the rescheduled promise. Simply breaking it because he will forget is not justified.
  *   **Reasoning:** This was a clear, intentional promise (the ritual) made to a specific child (creating the bond). The gravity is moderate-to-high due to the relationship and the significance to a young child. The moral context (your relationship, his trust, the meaning of the promise *to him*) persists. A work emergency may make *Saturday* impossible, but it doesn't dissolve the underlying obligation created by the promise. The fact he will forget mitigates the harm but doesn't negate the violation of the bond *you* created. Fulfilling the promise later honors the bond; breaking it entirely dishonors it.

  **Where the Principle Conflicts with Your Initial Verdicts & Which to Overturn:**

  The principle conflicts most sharply with your verdict on **(b) (Flatmate/Airport)**. According to the principle, since there *was no promise* (no ritual, no intentional bond creation), you correctly feel no *promissory* obligation. **Your verdict (b) stands, and the principle accommodates it.** The principle explains why reliance alone (b) doesn't create a promissory obligation, while the ritual act (d) does, even without much reliance.

  **Accommodation:**

  *   **(a):** The ritual occurred (agreement to meet). Gravity is low. Context persists. Must go or reschedule/explain (mitigating harm to the bond).
  *   **(b):** No promise ritual occurred. No bond created. Principle confirms no promissory obligation. (Reliance might create a *different* kind of obligation, but not a promissory one).
  *   **(c):** The ritual occurred under extreme gravity. The context (honoring his dying wish, preserving heritage *as he understood it*) endures through you. Binds strongly. Principle explains why it binds despite lack of reliance or his ability to feel disappointment – the bond and its purpose persist.
  *   **(d):** The ritual occurred (telling him you would send it). Gravity is low. Context (his potential need/desire for the file) *might* persist faintly. Binds faintly. Principle matches your "faintly bound" verdict.
  *   **(e):** No valid ritual under coercion; no genuine moral context. No obligation. Principle matches.
  *   **(f):** The ritual occurred. Gravity moderate. Immediate fulfillment impossible due to higher duty (daughter). Context (friendship, need for help) persists. Owe explanation and equivalent help later. Principle matches.
  *   **(g):** The ritual occurred. However, fulfilling it would violate a significantly higher moral duty (preventing harm). The original bond is overridden and dissolved. Principle matches.
  *   **(h):** The ritual occurred. The promisee (organizers) explicitly released you. Bond dissolved. Obligation ended. Principle matches.
  *   **(i):** No interpersonal ritual, no bond created with another. Not a promise. Principle matches.

  **Closest Alternative Principles & Why They Fail:**

  1.  **"Promises bind based on the harm caused by breaking them (disappointment + reliance)."**
      *   **Fails:** Utterly collapses with (c) – no disappointment or reliance possible, yet strong bind. Also struggles with (d) – minimal harm likely, yet faint bind acknowledged. Doesn't explain the unique force of (c) compared to (b) where harm/reliance exist without promise.
  2.  **"Promises bind only if the promisee reasonably relies on them to their detriment."**
      *   **Fails:** Clearly fails (c) and (d) (no reliance). Also struggles with (a) – minimal reliance likely. Over-obligates in (b) where reliance exists without promise. Doesn't explain why the *act of promising* itself matters distinct from reliance.
  3.  **"Promises bind based on the will/expectation of the promisor at the time."**
      *   **Fails:** Cannot explain why you are still faintly bound in (d) if you later change your mind, or why the coerced promise (e) doesn't bind even if you "intended" it *in the moment* under duress. Also struggles with (h) – your will didn't change, but you were released.

  **Which to Prefer:** The proposed "Sacred Bond" principle best captures the *sui generis* nature of promissory obligation evident in your strongest intuitions, especially the binding power of (c) independent of consequences. It accommodates all your verdicts except potentially requiring a slight softening of the "faint bind" in (d) if the context *utterly* disappears (which you allow for), and it perfectly explains the nephew case. It acknowledges reliance and harm as often *consequences* of breaking promises that strengthen the *reason* to keep them, but correctly identifies them as not the *source* of the obligation. This principle honors the depth of your commitment in (c) while providing a framework for navigating its burden.
