  Below is a complete, step-by-step procedure for your committee, designed to ensure logical consistency between findings and verdicts while addressing your specified concerns. The procedure balances rules with necessary judgment calls (marked as **JUDGMENT**), and I've noted where the chair must own the decision. The process assumes your charter defines the verdict as a logical consequence of the findings (e.g., findings are premises, verdict is conclusion).

  ---

  ### **Procedure for Research-Integrity Committee Decisions**
  **Pre-Meeting (Chair’s Duty):**  
  1. **Set the agenda (propositions)**:  
     - Define which propositions are **findings** (e.g., "Data were mishandled") and which is the **verdict** (e.g., "Paper must be retracted").  
     - **CRITICAL JUDGMENT**: Ensure the verdict is *logically entailed* by the findings (e.g., if findings F1 and F2 are both true, then verdict V must follow). Document this logic.  
     - *Why agenda-setting matters*: If findings don’t entail the verdict, appeals can overturn your decision. The chair must own this structure.  

  **In-Meeting Steps:**  
  1. **Challenge the agenda (5 mins)**:  
     - Chair presents the logic: "If findings [F1, F2, ...] are all true, does verdict V follow?"  
     - Any member may object. If objected, committee votes (majority of non-recused members) to:  
       - **Uphold objection**: Revise agenda (defer case) or override if illogical.  
       - **Reject objection**: Proceed.  
     - *Rule*: No voting on findings/verdict until agenda is accepted.  

  2. **Handle recusals and abstentions (2 mins)**:  
     - **Recusals** (conflict of interest):  
       - Members self-recuse or are flagged by chair. **JUDGMENT**: Chair decides ambiguous cases (defend in writing). Recused members leave the room.  
     - **Abstentions**: Permitted on any vote; count as "no vote" (do not affect majority thresholds).  
     - **Strategic voting**: No formal rule. **JUDGMENT**: If a member’s votes contradict prior statements, chair may note this in the record but cannot invalidate votes.  

  3. **Choose aggregation method (3 mins)**:  
     - Chair recommends one method (explain why):  
       - **Premise-based (findings-first)**: Vote on findings, then derive verdict.  
         *Best when*: Findings are independent; logic is simple (e.g., verdict = F1 AND F2).  
       - **Conclusion-based (verdict-first)**: Vote on verdict, then vote on findings.  
         *Best when*: Findings are interdependent; verdict is holistic (e.g., complex misconduct).  
     - Committee votes (majority of non-recused) to accept/reject chair’s method. If tie, chair’s method stands.  

  4. **Vote and derive outcome (10–15 mins)**:  
     - **Premise-based method**:  
       - Vote on each finding (majority rule: >50% of non-abstaining votes).  
       - **Automatically derive verdict**: If passed findings entail the verdict (per agenda logic), verdict passes. Else, it fails.  
       - *Rule*: No separate vote on verdict.  
     - **Conclusion-based method**:  
       - Vote on verdict (majority rule).  
       - Vote on each finding (majority rule).  
       - **Consistency check**:  
         - If verdict passed, passed findings *must* entail it (else inconsistency).  
         - If verdict failed, passed findings *must not* entail it (else inconsistency).  
       - *Rule*: If inconsistent, defer case; reconsider at next meeting.  

  5. **Resolve deadlocks (if methods conflict)**:  
     - If premise-based and conclusion-based are both run (e.g., due to appeal) and conflict:  
       - **Rule**: Default to premise-based outcome (findings determine verdict).  
       - **JUDGMENT**: If neither side moves, chair decides whether to defer or force premise-based result (defend in writing).  

  6. **Record the decision**:  
     - Document: Findings voted + verdict (derived or voted) + logic.  

  ---

  ### **Case Walkthroughs**
  #### **Case 1: Methods Agree (Procedure Stays Quiet)**  
  - **Agenda**:  
    - F1: Data mishandled.  
    - F2: Mishandling material to conclusions.  
    - Verdict (V): Retract paper.  
    - *Logic*: F1 AND F2 → V (if both true, retraction required).  
  - **Votes (7 members, no recusals/abstentions)**:  
    - F1: 5 for, 2 against → **passes** (majority: 5/7 > 50%).  
    - F2: 4 for, 3 against → **passes** (4/7 > 50%).  
    - V (if voted): 6 for, 1 against → **passes**.  
  - **Procedure**:  
    - Step 3: Chair recommends premise-based (simple logic). Committee approves.  
    - Step 4: F1/F2 pass → V **passes** (automatically).  
  - **Outcome**: Retract paper. Verdict derives cleanly from findings.  

  #### **Case 2: Methods Diverge (Findings Support Verdict, but Verdict Fails)**  
  - **Agenda** (same as Case 1).  
  - **Votes**:  
    - F1: 5 for, 2 against → **passes**.  
    - F2: 4 for, 3 against → **passes**.  
    - V: 3 for, 4 against → **fails**.  
  - **Third question (notify funder)**:  
    - New verdict V2: "Notify funder."  
    - *Logic*: V → V2 (if paper retracted, notify funder).  
  - **Procedure**:  
    - Step 3: Chair recommends premise-based. Committee approves.  
    - Step 4: F1/F2 pass → V **passes** (retract paper).  
    - Then for V2:  
      - Agenda: V → V2 (accepted without challenge).  
      - Since V passed, V2 **automatically passes** (no vote needed).  
  - **Outcome**:  
    - Paper retracted (V passes via findings).  
    - Funder notified (V2 passes via entailment).  
  - **Why premise-based wins**: Verdict is bound by findings. Committee cannot reject logic it accepted in agenda.  

  #### **Case 3: Recusal Swings Outcome (Chair Dislikes Result)**  
  - **Agenda** (same as Case 1).  
  - **Recusal**: 1 member (conflict) → 6 voting.  
  - **Votes**:  
    - F1: 3 for, 2 against, 1 abstention → **passes** (3/5 > 50%; abstention ignored).  
    - F2: 2 for, 3 against, 1 abstention → **fails** (2/5 < 50%).  
    - V (if voted): 3 for, 3 against → tie → **fails**.  
  - **Procedure**:  
    - Step 2: Recusal upheld (chair documents reason).  
    - Step 3: Chair recommends premise-based. Committee approves.  
    - Step 4: F1 passes, F2 fails → V **fails** (not all findings true).  
  - **Outcome**: No retraction.  
  - **Chair’s discomfort**: Recused member would have voted for F2, swinging F2 to pass (making V pass).  
  - **Defense**: Recusal was proper; outcome reflects votes of impartial members. Procedure respected.  

  ---

  ### **Key Judgment Calls and Rules**  
  | **Step**               | **Rule or Judgment?**       | **Who Owns It?**                  |  
  |------------------------|------------------------------|-----------------------------------|  
  | Agenda logic           | **JUDGMENT** (critical)      | Chair (defend in writing)         |  
  | Recusal decisions      | **JUDGMENT**                 | Chair (document reasons)          |  
  | Aggregation method     | Hybrid (chair recommends + committee votes) | Committee (chair breaks ties) |  
  | Strategic voting       | **Rule**: Votes stand        | Chair notes for record only       |  
  | Deadlock resolution    | **Rule**: Default to findings | Chair (owns if forces outcome)    |  
  | Inconsistency handling | **Rule**: Defer case         | Chair (no discretion)             |  

  This procedure ensures logical integrity, minimizes ambiguity, and provides defensible outcomes. It prioritizes findings-first aggregation (as your charter requires) while allowing verdict-first for complex cases. The chair’s key burdens are agenda-setting and recusals—where clear documentation is essential for appeals.
