  ## The Other Daughters

  The envelope from the clinic felt heavy in Mara’s hands, not with paper, but with the impossible weight of lives unlived. Outside her apartment window, Harbour City’s perpetual autumn drizzle slicked the grey cobblestones below, blurring the outlines of the old docks. Inside, the air hummed with the low thrum of the climate unit and the sharper anxiety coiling in her chest. Spread across her low table were the consent forms for Cycle Seven, the list of available embryo IDs, and the sleek clinic tablet pulsing softly with an invitation: *Preview Sessions Ready for Selection.*

  IVF was as commonplace as the rain here. But the Previews… they had shifted something fundamental. It wasn’t selecting a cluster of cells anymore; it was choosing a *person*. An hour-long immersion, meticulously rendered from the genetic blueprint: a plausible future child, eighteen years old, sitting across from you in a sun-dappled virtual cafe, sharing fragments of a life they *might* live. Mara knew. She was a Preview child herself, one of the earliest.

  Her own mother, Elara, had spoken of it rarely, a curious footnote to Mara’s origin story. "They showed me three girls," she’d say, waving a dismissive hand, her signature gesture. "All lovely. But you… you had your father’s stubborn chin even then." It had felt like destiny, a thread pulled taut through time confirming she, Mara, was always meant to be.

  Now, facing her own list – ID#7A, 7B, 7C – the certainty evaporated. Her partner, Leo, was patient, supportive, but ultimately deferred. "It’s your body, your history wrapped up in this," he’d said, kissing her temple before heading to the marine lab. "I trust you." The trust felt like another weight. She hadn't opened a single Preview. The tablet sat accusingly silent.

  Then the call came. Her mother, vibrant Elara, felled by a swift, brutal stroke. Gone.

  The grief was a physical thing, a cold stone lodged beneath her ribs. Arrangements were a blur of numb efficiency. It was amidst the sorting of Elara’s meticulously organized digital archive that Mara stumbled upon the notification from the Genetrix Clinic, dated over thirty-five years prior. *Archival Footage Released: Preview Sessions - Patient Elara Vance. Embryo Selection Cycle Alpha-9.*

  Mara’s breath hitched. She hadn’t known these existed. Her mother never mentioned recordings. With trembling fingers, she accessed the file. Password: her own birthday.

  The screen resolved into grainy, early-digital footage. There sat her mother, impossibly young, mid-twenties, her dark hair a wild cloud Mara recognized instantly, framing a face unlined by the years Mara knew. The setting was a stark, older-model Preview booth. Elara looked… nervous. Excited. Not like someone meeting destiny, but like someone interviewing candidates.

  The first potential daughter appeared. "Lena," the system voice announced softly. This girl had Elara’s wide, dark eyes but a sharper nose, a quieter intensity. She spoke thoughtfully about marine biology, her virtual fingers tracing patterns on the simulated tabletop. Young Elara leaned forward, engaged, asking questions about tide pools and bioluminescence. There was warmth in her smile, genuine interest. Mara watched, a stranger observing a stranger who shared her mother’s face. *That could never have been me,* she thought fiercely. *She’s different. Entirely.*

  The session ended. Lena faded. Elara sat back, chewing her lip thoughtfully. No instant recognition. No cry of "That’s her!"

  Next was "Sofia." Lighter hair, a quicker, more restless energy. She talked about wanting to travel, to write, her laugh bright but slightly brittle. She mentioned a fear of deep water. Young Elara chuckled, sharing a story about getting caught in a riptide as a child. There was an ease between them, a shared spark of impulsiveness. Mara’s stomach clenched. Sofia seemed… compatible. Fun. A daughter Elara could have been easy friends with. *But not me,* Mara insisted silently. *Look at her. Different laugh, different fears. A different person.* Yet, the seed of doubt was there: if her mother had chosen Sofia, wouldn’t *that* girl, sitting here grieving Elara, be insisting *she* was the only possible daughter?

  Finally, "Mara" appeared. Or rather, the girl who would become Mara, if chosen. Seeing her mother’s young face light up with a specific, softening recognition was a physical blow. *Yes! There! She knows it’s me!* But the recording told a different story. The young Mara-preview was quieter than Sofia, more reserved than Lena. She talked about liking puzzles, observing birds. Her smile was hesitant. Young Elara watched her, head tilted. She asked gentle questions, drawing her out. There was affection, yes, but Mara, watching, saw hesitation too. A weighing. Elara glanced down at a physical notepad Mara hadn’t noticed before, scribbling something.

  The sessions concluded. Young Elara sat alone in the booth, the three ghost-daughters gone. She tapped her fingers on the table, sighed. She looked at her notes, then out the virtual window, her expression unreadable. Then, almost abruptly, she made a small gesture, a flick of her fingers towards the screen. Choosing. Choosing *this* one. Choosing *Mara*. Based on what? The notes? A feeling? The way the preview-Mara tucked her hair behind her ear, a gesture Elara herself did? It looked terrifyingly like a whim. A coin flip landing on this particular face, this particular set of simulated mannerisms. There was no grand revelation, no cosmic certainty. Just a woman, young and maybe a little overwhelmed, making a choice about which possible child to invite into existence.

  The cold stone of grief inside Mara cracked open, revealing a deeper, more terrifying void. *It could have been Lena. It could have been Sofia. I am here… by chance.* The essential thread snapped. She wasn't the inevitable daughter; she was the *selected* one. The difference between her existence and Lena’s oblivion was her mother’s finger flicking towards a screen thirty-five years ago.

  Back in her apartment, Harbour City’s grey light bled through the window. Cycle Seven’s tablet glowed on the table beside Elara’s archived footage. ID#7A, 7B, 7C. Three possible children. Three futures flickering on the edge of being.

  Mara reached for the tablet. Her finger hovered over the first Preview file, #7A. She imagined a boy or girl with Leo’s kind eyes and her own restless energy, talking about stars or engines or music. A person. Real, in that rendered future-space. Her child. *A* child. But which one *would* be hers? The one she chose.

  The arguments from the seminar echoed, hollow now. *The specific gametes… constitutive of identity…* Was the child previewed in 7A fundamentally, essentially *that* child, waiting only for the spark of existence? Or was it merely a plausible projection based on genetics, a shadow cast by a unique combination that *would* become a unique person only *if* chosen? Was choosing 7A over 7B choosing between two distinct potential people, or creating one person and obliterating the mere possibility of another?

  Her thumb trembled. Opening #7A would make it real. It would be a *person* she was considering, judging, potentially rejecting. Like her mother had judged Lena and Sofia. She could hear their unrealized voices, see their unrealized faces from the archive. Ghosts of what never was.

  But not opening them… that was choosing blindly. Ignoring the glimpse of who these clusters of cells *could* become. Wasn't that a different kind of violence? Choosing based on pure statistics, like choosing a seed packet without looking at the flower picture?

  *I can’t,* she thought, a wave of nausea rising. *I can’t look at them. I can’t not look at them.*

  She opened Preview #7A.

  The clinic’s rendering was flawless, hyper-real. A young person, perhaps seventeen, sat in a virtual sunroom filled with holographic plants. They had Leo’s warm brown skin and Mara’s sharp cheekbones, their eyes a startling hazel mix. They were talking, animatedly, about coral reef symbiosis, their hands sketching shapes in the air. Mara heard the passion in their voice, saw the intelligence in their gaze. It was *a* child. A beautiful, specific, possible child.

  She felt… nothing. No bolt of recognition. No surge of inevitable connection. Just the profound, unsettling weight of possibility. This was *someone*. But was this *her* child? Only if she said yes. Only if she chose them into existence, making all other possibilities dissolve like the ghosts of Lena and Sofia.

  She closed Preview #7A. The sunroom vanished. The tablet screen went dark, reflecting her own pale, strained face in the rainy window.

  She didn’t open #7B or #7C.

  The consent forms lay untouched. The rain streaked the windowpane, blurring the world outside into shades of grey water and darker stone. Mara remained on the floor, her back against the sofa, the tablet cold and inert in her lap. She stared at the rain-blurred glass, seeing not the harbour, but the phantom afterimage of the hazel-eyed child talking about coral, and behind them, the quieter ghost of a girl who liked puzzles and birds, chosen long ago by a flick of her mother’s young fingers. The drizzle made tracks down the window like tears on a face she couldn't see clearly. She lifted her own hand, slowly, watching her fingers tremble against the grey light, hovering in the silent room.
