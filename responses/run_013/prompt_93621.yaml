prompt: |-
  I run the schedule at a design studio — 60ish people — which isn't my job exactly, I'm a senior designer, but I ended up owning it, and that's how I fell into this. About a year ago we went to a four-day week. Not as an experiment with a write-up, just because the two owners read something and got excited about it. It worked for maybe three months.

  Here's the thing I can't stop chewing on. The work got done. Clients didn't notice, our output didn't drop, the numbers were basically flat, and everybody I talked to said having the Friday was the best thing that happened to them that year. And then, quietly, over the summer, it came back. No memo, no announcement. What happened is that the people who actually took the Friday off gradually stopped appearing in certain conversations. Nobody was punished. Nobody said anything. But when a new project came up and we needed a lead, it was always someone who'd been around on Friday. And I was doing it too, which is the part that bothers me, because I'd have sworn up and down that Friday is your day and you should take it — and then in the meeting I'd pick the person I'd seen in the room.

  Now I see it everywhere. My sister's a postdoc and her PI says out loud, in lab meeting, "I don't care what hours you keep, I care about results," and means it, and the people who leave at six are still the ones who don't get the good first-author slots. My cousin works for a supplier in Osaka and describes something in the same family, except there it's the version that occasionally ends with somebody dead — they have a word for that, I forget it, starts with a k. And I read Weber in a college seminar, the Protestant ethic thing, and I remember the punchline being that the work ethic kept going after the religion that produced it faded out. That's not quite this either.

  What I want is a name for the specific mechanism, if there is one. The features I think matter: nobody in the chain believes the thing they're using. The owner who'd rather you took Friday doesn't believe hours measure anything. He just notices who's around, because that's cheap evidence, and he's being evaluated on delivery by the same logic one level up, so he can't afford to ignore it. There's no deception, no false belief about what other people think, no scarce resource being depleted, no rule anyone enforces, and no villain. Just a signal that everyone is reading and nobody endorses, held up by the fact that each link is read by the next link.

  My roommate did two years of econ and says it's just signaling, peacock-tail stuff, and I get that but it feels like it's naming the tail and not the bird. I also looked up "pluralistic ignorance," the thing where everyone privately disagrees but assumes everyone else agrees, and that's not it — nobody here is confused about anyone's beliefs. The owner says the true thing out loud, sincerely, and the norm persists anyway. So: does this have a name? If it doesn't, I'd like you to coin one, but the label isn't really what I'm after. I want the boundaries: what this is, what it isn't, where the edge is between this and ordinary overwork culture, ordinary hypocrisy, and an ordinary bad incentive.

  Answer as a social theorist of work — someone comfortable in both labor economics and the philosophy of work, who's read enough of the sociology of the workplace to know what's already been named and what hasn't. Before you write, brainstorm privately: list every established concept that could plausibly cover this, test each against the details above, and throw out the ones that don't survive. I'd rather have a slow, careful carve than a fast list of terms. And skip the reading list — I'm not going to read it, I want the concept sorted out.

  Please write it in these sections, in this order:

  **Straight answer** — 2 to 3 sentences. Is there an established name, and if so which one is closest.

  **The nearest things, and how each one misses** — bullets, 4 to 6 of them, 2 to 3 sentences each. For each: what it captures, and the specific detail above it fails to explain.

  **The carving** — 150 to 200 words. Your best definition of the pattern, stated so it doesn't lean on any of the terms from the previous section. Say which of my listed features are essential and which are incidental, and whether the norm can survive if the top of the evaluation chain stops reading the signal.

  **Boundary cases** — 3 short cases of your own invention, each 1 to 2 sentences plus a verdict, including at least one case that is close but that you'd rule out.

  **Name, if nothing fits** — a term, a one-sentence definition, and what the name must not be taken to imply.

  **Where my description is probably wrong** — 3 to 4 sentences on which assumption in my telling you'd bet against.
