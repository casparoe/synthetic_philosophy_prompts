  What's particularly interesting is that nobody explicitly enforced the five-day norm. Leaders genuinely believed in the four-day week, yet unconsciously rewarded those who were physically present on Fridays. The user wants to identify this specific social mechanism - where an unspoken norm persists despite conscious rejection by all participants, fueled by layered observational signals rather than deception or incentives.

  The user is clearly thoughtful and analytical - they've already ruled out concepts like "signaling" and "pluralistic ignorance." They're asking for rigorous conceptual boundaries, not just a label. As a senior designer thrust into scheduling, they're likely frustrated by seeing good intentions erode without malicious intent.

  Key challenges in responding: This sits at the intersection of sociology, behavioral economics, and organizational psychology. Existing concepts like "performative presenteeism" or "observational selection bias" come close but miss nuances: the absence of deception, the layered signaling, the genuine belief in alternative values. The Protestant work ethic reference suggests they want historical context too.

  I'll need to carefully carve out what's unique here: (1) the decoupling of stated values from operational signals, (2) the self-reinforcing observation chain where each layer's reading validates the next, (3) the complete absence of bad faith. Crucially, this isn't hypocrisy - hypocrisy requires awareness of the contradiction, which is absent here.

  For the boundary cases, I'll test scenarios where: (a) the CEO stops reading Friday presence as a signal, (b) employees pretend to work Fridays remotely, (c) explicit metrics replace observational cues. The verdicts should clarify where the mechanism breaks.

  The user's description feels accurate, but I suspect they underestimate how quickly such norms calcify. What began as "cheap evidence" likely became tacitly required within months. Also, the "no villain" claim might overlook subtle power dynamics - the owners benefited from the reversion without accountability.

  Ultimately, this deserves a new term: "Cascading Observational Selection." The "cascading" captures the layered signal reinforcement, "observational" centers the evaluation method, and "selection" implies the passive reward mechanism. Crucially, it mustn't imply conscious gaming of the system.
answer: |-
  ### Straight answer
  There is no exact established term for this specific mechanism. The closest is **"observational selection bias"** in organizational behavior, but it requires significant qualification. It partially overlaps with "implicit norm enforcement" in workplace sociology, yet no single concept fully captures the layered signal-reading dynamic you describe.

  ### The nearest things, and how each one misses
  - **Signaling theory (economics)**: Captures how visible actions (e.g., Friday presence) convey unstated qualities. *Misses*: Here, the signal isn’t strategically sent; it’s unintentionally read and reinforced by evaluators who consciously reject its validity. Your owners aren’t rewarding performative effort—they’re reflexively using proximity as a heuristic.
  - **Pluralistic ignorance**: Explains group adherence to false norms due to mistaken beliefs about others’ acceptance. *Misses*: In your case, *everyone* knows the stated norm ("take Friday") is sincerely held. There’s no ignorance—just a misaligned evaluation signal overriding conscious beliefs.
  - **Presenteeism culture**: Describes workplaces valuing physical presence over output. *Misses*: This typically involves explicit pressure or shared belief in "face time." Your owners actively *disavow* this, yet the norm resurfaces through passive observational habits, not cultural endorsement.
  - **Path dependency**: Refers to systems persisting due to historical inertia. *Misses*: While habit plays a role, your mechanism is actively reproduced *in real time* by each evaluator’s cheap reliance on visibility, not historical lock-in.
  - **Unconscious bias**: Covers automatic cognitive shortcuts influencing decisions. *Misses*: Bias frameworks focus on individual cognition (e.g., affinity bias), not the *chain* of interdependent evaluations where each link’s output becomes the next link’s input data.

  ### The carving
  This is a **self-reinforcing evaluation chain driven by low-cost observational proxies**. Essential features: (1) Conscious endorsement of a counter-norm (e.g., "results matter, not hours"), (2) Use of easily observable signals (e.g., physical presence) as performance heuristics despite (1), (3) Layered dependencies where each evaluator (owners, project leads) is themselves evaluated using similar proxy-based logic by *their* superiors. Incidental features: The specific signal (Friday absence), industry, or size of the firm. The norm collapses if the top of the chain stops reading the signal—e.g., if clients/shareholders explicitly reward *only* output metrics, breaking the cycle. But if evaluation layers remain disconnected from stated values, the mechanism persists via intermediate actors (like your owners) who must satisfy conflicting demands: professed values vs. operational signals used by *their* evaluators.

  ### Boundary cases
  1. *A tech CEO mandates "no emails after 6 PM" but promotes based on shipped features. Managers notice high performers work late but ignore hours in reviews.* **Verdict: OUT—** No conflict; evaluation aligns with stated values despite observed behavior.  
  2. *Hospital administrators praise work-life balance but assign prime surgeries to surgeons always present in the doctors' lounge. Department heads feel pressure from patient satisfaction scores tied to surgeon visibility.* **Verdict: IN—** Layered evaluation (admins → dept heads → surgeons) uses visibility as a cheap proxy despite stated values.  
  3. *Consulting firm partners say "client outcomes matter," but promote associates who volunteer for weekend work. Partners themselves are rated by clients on responsiveness, not outcomes.* **Verdict: IN—** Client evaluations create a proxy (responsiveness = availability) that overrides stated values, cascading down.

  ### Name, if nothing fits
  **Cascading Observational Selection (COS)**  
  *A workplace norm sustained by evaluators unconsciously favoring visible proxies across interdependent decision layers, despite conscious rejection of those proxies.*  
  **Must not imply**: Deliberate signaling by workers, top-down coercion, or cultural consensus about the proxy’s value.

  ### Where my description is probably wrong
  Your claim that "no scarce resource is depleted" is likely inaccurate. **Attention** is the depleted resource: evaluating true output (quality, creativity) is cognitively expensive, while noting presence/absence is cheap. This scarcity drives reliance on proxies. Additionally, you understate how quickly observational habits congeal into implicit expectations: after three months, "who’s around Friday" likely became a tacit filter for reliability before anyone noticed. Finally, calling this "no deception" overlooks **self-deception**—evaluators (like you) likely rationalize choices as "picking the best" while ignoring how the proxy distorts perception.
