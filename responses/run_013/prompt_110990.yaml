    - Mira's likely **Lexical Obligation Rule** predicts **contrast survives**.  
  - **Principles Adopted:**  
    - **If she says contrast survives:** Conventional implicatures are semantic obligations (word-borne), overriding speaker intention.  
    - **If she says contrast is canceled:** Speaker authority trumps lexical conventions (speaker-borne meaning dominates).  
  - **Bet Recommendation:**  
    - **Mira will say the contrast IS implicated** (survives disavowal).  
