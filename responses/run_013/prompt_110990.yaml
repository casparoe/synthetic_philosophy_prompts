  ### Mira's Likely Governing Rule (Conventional Implicature as Word-Borne Obligation)
  - **Rule:** *Word-borne implicatures (conventional implicatures) are triggered by specific lexical items (e.g., "but") and are **non-cancelable** by speaker intention. They are inherent to the meaning of the word, not the speaker's context-dependent goals.*  
    - **Why?** Precedent (2) classifies "but" as word-borne implicature (contrast). Precedent (4) shows speaker disavowal blocks implicature *only when no lexical trigger exists*. Precedent (1) shows *conversational* implicatures (e.g., "some" → "not all") *are* cancelable.  
    - **Prediction for New Case:** The contrast implicature **survives** despite the speaker's disavowal. "But" lexically encodes contrast, making it obligatory.  

  ---

  ### Two Alternative Rules Fitting Precedents Equally Well
  1. **Rule A: Speaker Intention Supremacy**  
     - *Implicature exists only if the speaker *intends* the hearer to infer it, regardless of lexical triggers.*  
       - Supported by: (4) (disavowal blocks implicature), (3) (speaker knowledge creates implicature), (6) (evaluative context triggers implicature).  
       - **Prediction for New Case:** The disavowal kills the contrast. Speaker explicitly denies intending tension.  

  2. **Rule B: Contextual Override of Lexical Defaults**  
     - *Lexical triggers create a *default* implicature, but strong contextual evidence (e.g., explicit disavowal) can override it.*  
       - Supported by: (1) (lexical "some" can be overridden by "all"), (5) (lexical question form overridden by context to a request).  
       - **Prediction for New Case:** Contrast is **canceled**. Disavowal provides stronger evidence than the lexical default.  

  ---

  ### Which Precedent is Closest?
  - **Precedent (4)** ("I'm not saying the treasurer is dishonest...") is superficially similar (disavowal), but crucially **distinct**:  
    - (4) lacks a lexical trigger for the inference (e.g., no "but dishonest"). The inference is purely contextual, so speaker disavowal blocks it.  
    - The new case has the lexical trigger "but". **Precedent (2) ("but" as word-borne)** is thus more directly analogous.  

  ---

  ### Case to Force a Choice
  To force Mira to choose between **Conventional Implicature (Word-Borne) as Non-Cancelable** vs. **Contextual Override**, use:  
  > *"She's poor **and** honest, and I *do* mean to suggest poverty and honesty are in tension."*  
  - **If Mira says contrast is implicated:** She adopts **Contextual Override** (Rule B), as "and" lacks a lexical contrast trigger but context creates it.  
  - **If Mira says no contrast is implicated:** She adheres to **Lexical Obligation** (her likely rule), as "and" doesn't encode contrast.  

