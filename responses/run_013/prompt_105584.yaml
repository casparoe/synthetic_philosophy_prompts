answer: |-
  ## Commencement Address: The Weight & The Light

  Faculty, staff, families, friends, and most importantly, graduates of the Master’s Program in Ethics and Public Life – welcome.

  You came here a year ago with questions about value, about responsibility, about the messy intersection of principle and practice. You leave today carrying the weight of those questions, honed sharper than when you arrived. You’ve argued fiercely about how much of a life morality can rightly claim. Some of you are heading towards paths where that claim will be more than theoretical – into the hard edges of aid work, the intricate compromises of policy, the long slog of advocacy, paths that may well demand more of you than any strict duty ever could. Several of you have spoken with moving conviction about structuring your lives around giving, about making the moral consideration primary in every significant choice. That seriousness is breathtaking. It deserves our deepest respect.

  And it also deserves our clearest sight.

  Today isn’t about handing down answers. It’s about holding a question open, honestly, for you to carry forward. It’s this: **Is a life given over entirely, completely, to being as morally good as possible – is that a life we should truly want, for anyone, including those sitting right here?**

  Imagine the extreme case. Call this person the ‘moral saint’. Every choice, large or small, is made *only* because it’s the morally best option available. Every project – every friendship, every moment of leisure, every pursuit – is justified solely by its contribution to something morally important. Nothing is done *just* because it delights, or connects, or rests, or satisfies a deep personal yearning, unless that yearning itself serves the moral cause. This is the life lived at the outer edge of moral commitment.

  Now, we can all agree such a life would be **admirable**. We’d stand in awe of the sacrifices made, the burdens borne, the sheer consistency of purpose. We’d call it noble, perhaps even heroic.

  But here’s the rub: Is it **enviable**? Would any of us, deep down, truly wish to *live* inside that skin? Admiration and envy can pull apart. We might admire the mountaineer clinging to the icy cliff face without ever wanting to be there ourselves. The moral saint’s summit might inspire awe, but also a shiver at the cold, thin air.

  Why the shiver? Because we sense something vital might be missing *in the very structure* of such a life. Consider the things we often cherish most deeply:

  *   Think of a parent playing catch with a child, not to teach a lesson about fairness or perseverance, but simply for the shared joy of the arc of the ball, the laughter, the effortless connection in that moment. If the saint *only* played catch because it statistically reduced future delinquency, would the *quality* of that connection be the same?
  *   Think of losing yourself in music, painting, or a game – absorbed purely for the sake of the doing, not because it makes you a more effective advocate tomorrow. Can absorption exist if it’s always, consciously, in service to something else?
  *   Think of the fierce, sometimes irrational loyalty of deep friendship or love – standing by someone not because it maximizes global utility, but simply because it’s *them*. Does the saint’s constant moral calculus leave room for that kind of uncalculated devotion?

  The worry is this: Some of life’s deepest goods – love, friendship, play, pure absorption – seem built on a kind of engagement that *isn’t*, and perhaps *can’t* be, morally motivated at its core. They require stepping outside the moral ledger, even briefly. The saint, by definition, never steps outside. They might have relationships, they might have leisure – but are they experiencing the *fullness* of these things, or only a morally-sanctioned shadow?

  Now, a powerful voice pushes back hard against this worry. It says: *This is just self-flattery. A comfortable excuse. Morality doesn’t owe you leisure or uncalculated joy. The world is burning, suffering is immense, and the person voicing this 'worry' is usually just protecting their own privilege, their own comforts.* This voice asks: How dare we prioritize our personal bliss when so much preventable pain exists? Isn’t the very desire for a life less morally saturated a sign of our own moral failing?

  It’s a bracing, uncomfortable challenge. It demands we examine our motives. Is our hesitation about the saint really about protecting *genuine goods*, or just protecting our *ease*?

  And this leads to a crucial distinction, one that sharpens the question. Not all saints are alike.

  1.  **The Saint Who Struggles:** This person feels the pull of the world’s pleasures, the yearning for a quieter life, the lure of personal passion. Every choice for the greater good is a victory *against* a strong inner temptation. They feel the cost, constantly.
  2.  **The Saint at Peace:** For this person, virtue has become effortless. The moral choice *is* the only choice they genuinely desire. The thought of playing catch just for fun, or listening to music just for absorption, holds no appeal. The contrary pull simply isn’t there anymore.

  Which one unsettles us more? The one who wrestles with desire we recognize? Or the one for whom those desires have simply… vanished? Is the struggle a sign of a richer, more recognizably *human* life? Or is the peace a higher, more complete virtue? And if it’s the latter… does that peace come at the cost of something essential to what makes a life *a human life*? Does the absence of that inner conflict also mean the absence of something valuable?

  Graduates, you stand at a threshold. Some of you are drawn powerfully towards lives of extraordinary moral commitment. That is a profound and necessary calling. The world desperately needs people willing to bear great weight.

  But I ask you, as you cross this threshold, to carry this tension with you. Carry the question. Do not close it down too quickly, either with the easy celebration of sacrifice *or* the comfortable embrace of moderation.

  *   When you choose the harder path, ask yourself: What good, human thing might I be setting aside? Is that cost justified here, now?
  *   When you feel the pull towards something simply because it delights or connects you, ask yourself: Is this a necessary human good I should protect, or am I hiding from a demand I know is real?

  Your education hasn’t given you a rulebook for this. It’s given you the tools to see the complexity, to feel the weight of the arguments on both sides. That is your strength, not your weakness.

  To the families: You see the admirable hearts before you. You also love them wholly, wanting not just greatness for them, but wholeness. Hold that tension too. Your pride and your concern are both valid, both rooted in love.

  Graduates, you are about to make your commitments in a world that needs your moral seriousness more than ever. Commit freely. Commit with eyes wide open – to the light your choices bring *out* into the world, and to the light they might, just might, leave *unlit* within yourselves. Carry the question. It’s not academic; it’s the map of a fully conscious life. Your life.

  Congratulations. May your choices be clear, your courage steadfast, and your humanity, in all its complex glory, remain vividly, stubbornly, blessedly intact.
