prompt: |-
  I've been trying to actually get my head around risk-weighted expected utility — Buchak's thing in Risk and Rationality — and I keep bouncing off it, so I'd like a real explanation rather than a summary. Three things are bugging me.

  First: why isn't this just expected utility with a concave utility function in disguise? If my friend would rather have a sure $500 than a 50/50 shot at $1,200, ordinary expected utility already has a story about that (diminishing marginal utility), so what does the extra risk function r actually buy you? Spell out the division of labor between the utility function and r, then walk me through a tiny three-outcome lottery where you compute the EU number and the RWEU number and show exactly where they come apart. I want the formula in words as well: I know it's rank-dependent, that r gets applied to cumulative probabilities, and that when r is the identity function you just get plain old EU back, but I don't have a felt sense of what the weighting is doing or why applying it to cumulative probabilities (rather than to each probability seperately) is the move that matters.

  Second: what does that cost you axiom-wise? I take it you can't keep the independence axiom. What does Buchak put in its place, and is the replacement doing real work or is it independence with a caveat bolted on? Related, and this is the part I most want cleared up: is r supposed to be a distorted belief about the probabilities, or an attitude toward risk that leaves the beliefs untouched? People lump RWEU in with cumulative prospect theory, but I thought that one was a descriptive model with a reference point and loss aversion, whereas Buchak is making a normative claim — roughly, that risk attitudes are a legitimate part of instrumental rationality and not a mistake to be argued out of. Is that the right way to put it, and does it change what r is allowed to represent?

  Third: calibration. Rabin's argument is that concave utility over wealth forces you to reject absurdly favorable sequences of small independent gambles. Does a convex r get hit by the same kind of argument, and if so, what's the reply — does the reply work, or does it just relocate the problem?

  Dont send me to the literature, I can't look anything up right now, just explain it. Then give me a short structured summary as a JSON object with these fields: "bottom_line" (a sentence or two), "division_of_labor" (what the utility function does vs. what r does), "formula_in_words", "worked_example" (an object with "lottery", "expected_utility", "risk_weighted_value", and "why_they_come_apart"), "axiom_dropped", "replacement_condition", "is_r_a_distorted_belief" (a verdict plus one line of support), "rweu_vs_cumulative_prospect_theory", "calibration_worry", "best_reply", "strongest_objection_standing", and "thing_people_most_often_get_wrong".
