  Third is Rabin's calibration critique. For RWEU, the worry is that convex r might lead to rejecting good sequences of small gambles. But there's a counter: since r applies per-choice not globally, it avoids Rabin's wealth-effect argument. Still, the "irrational" rejection pattern might persist locally - that's probably the strongest objection standing.

  For the JSON summary, I'll prepare concise answers to all requested fields. The worked example will use specific numbers to show divergence clearly. I should emphasize that the cumulative weighting is what makes RWEU different - that's what people often misunderstand.

