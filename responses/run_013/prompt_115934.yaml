answer: |-
  Here's a breakdown of Buchak's Risk-Weighted Expected Utility (RWEU), tackling your points directly:

  **1. Why RWEU Isn't Just Concave EU & The Division of Labor**

  *   **Concave EU:** Explains risk aversion *only* through diminishing marginal utility (DMU). A $500 gain genuinely provides significantly more utility than the *next* $500 gain would. The probabilities are used linearly: `EU = p1*u(x1) + p2*u(x2) + ... + pn*u(xn)`.
  *   **RWEU:** Separates the valuation of outcomes (`u(x)`) from the *attitude towards the structure of the risk itself* (`r(p)`). It allows for risk aversion (or seeking) *even if utility is linear in money* (u(x) = x). The risk function `r` distorts the *decision weights* assigned to outcomes based on their rank and the cumulative probability.

      *   **Utility Function (`u`):** Captures the *inherent value* of outcomes (e.g., how much you intrinsically like $100 vs. $500). This can still incorporate DMU.
      *   **Risk Function (`r`):** Captures your *attitude towards the riskiness of the prospect itself*. A convex `r` (flattened near 0, steep near 1) makes you focus more on bad outcomes. A concave `r` (steep near 0, flattened near 1) makes you focus more on good outcomes. It distorts *cumulative probabilities*.

  *   **Formula in Words:**
      1.  **Rank Outcomes:** Order the outcomes from worst (x₁) to best (xₙ).
      2.  **Calculate Cumulative Probabilities:** For each outcome xₖ, calculate the probability of getting an outcome *worse than or equal to* xₖ: `Fₖ = p(x₁) + p(x₂) + ... + p(xₖ)`.
      3.  **Apply Risk Function:** Transform each cumulative probability: `r(Fₖ)`.
      4.  **Calculate Decision Weights:** The decision weight for outcome xₖ is the *difference* in transformed cumulative probabilities between its rank and the rank below it:
          `πₖ = r(Fₖ) - r(Fₖ₋₁)` (For the best outcome xₙ, `πₙ = r(Fₙ) = r(1) = 1`; for the worst outcome x₁, `π₁ = r(F₁)`).
      5.  **Calculate RWEU:** `RWEU = π₁*u(x₁) + π₂*u(x₂) + ... + πₙ*u(xₙ)`.

  *   **Why Cumulative Probabilities?** Applying `r` to cumulative probabilities (`Fₖ` = chance of being *at least this badly off*) directly targets how the agent perceives the *risk of poor outcomes*. Applying `r` to individual probabilities (`pₖ`) wouldn't capture this rank-dependent sensitivity to where the risk lies (tail risk vs. upside potential). The *difference* `r(Fₖ) - r(Fₖ₋₁)` effectively creates a decision weight that depends on the outcome's position in the ranking and the shape of `r`.

  *   **Worked Example:**
      *   **Lottery:** Three outcomes: $0 (p=0.2), $100 (p=0.3), $500 (p=0.5). Assume linear utility: `u($0) = 0`, `u($100) = 100`, `u($500) = 500`.
      *   **Expected Utility (EU):**
          `EU = (0.2 * 0) + (0.3 * 100) + (0.5 * 500) = 0 + 30 + 250 = 280`
      *   **Risk-Weighted Expected Utility (RWEU):** Use a convex risk function like `r(p) = p²` (strong risk aversion).
          1.  *Rank:* Worst: $0 (x₁), Middle: $100 (x₂), Best: $500 (x₃)
          2.  *Cumulative Probabilities:*
              *   F₁ (≤ $0) = p($0) = 0.2
              *   F₂ (≤ $100) = p($0) + p($100) = 0.2 + 0.3 = 0.5
              *   F₃ (≤ $500) = 1.0
          3.  *Transform with r(p)=p²:*
              *   r(F₁) = r(0.2) = (0.2)² = 0.04
              *   r(F₂) = r(0.5) = (0.5)² = 0.25
              *   r(F₃) = r(1.0) = (1.0)² = 1.0
          4.  *Decision Weights:*
              *   π₁ ($0) = r(F₁) = 0.04
              *   π₂ ($100) = r(F₂) - r(F₁) = 0.25 - 0.04 = 0.21
              *   π₃ ($500) = r(F₃) - r(F₂) = 1.0 - 0.25 = 0.75
          5.  *RWEU:*
              `RWEU = (0.04 * 0) + (0.21 * 100) + (0.75 * 500) = 0 + 21 + 375 = 396`
      *   **Why They Come Apart:**
          *   EU = 280
          *   RWEU = 396
          *   **The Difference:** The convex `r(p)=p²` significantly downweights the worst outcome ($0) because its cumulative probability (0.2) is low and `r` flattens low probabilities. It massively upweights the best outcome ($500) because the cumulative probability just below it (F₂=0.5) is transformed to 0.25, leaving a large weight (0.75) for the $500. The middle outcome ($100) also gets a lower weight (0.21 vs. its probability 0.3). This agent, despite valuing money linearly, appears *risk-seeking* here because `r` makes them focus heavily on the best outcome. This pattern (downweighting bad tails, upweighting good tails) can also create *risk aversion* for prospects with significant bad-tail risk. Crucially, **this divergence happens *without* any diminishing marginal utility (`u` is linear).** If we tried to explain the RWEU valuation of 396 with EU, we'd need an implausibly convex utility function to get the same number, demonstrating that `r` captures something distinct from `u`.

  **2. Axioms, Belief vs. Attitude, Normative Claim**

  *   **Axiom Dropped:** **Independence** is sacrificed. RWEU violates the core tenet that if you prefer A over B, you should prefer a mix of A and C over the same mix of B and C for any lottery C.
  *   **Replacement Condition:** Buchak proposes a weaker set of axioms (Ordering, Continuity, Coherence). The key replacement for Independence is **Coherence**. Coherence requires that preferences over compound lotteries respect a specific reduction consistent with the risk function `r`. It's not "Independence plus a caveat"; it's a fundamentally different structural constraint designed to be compatible with rank-dependent weighting. It *is* doing real work by allowing the violation of Independence while maintaining global consistency.
  *   **Is `r` a Distorted Belief?** **No. It's a pure risk attitude.** Buchak is explicit: `r` represents how the agent *cares* about the way probabilities are distributed across the outcome space, given their beliefs about the true probabilities. The beliefs (p) are taken as accurate; `r` distorts the *decision weight* based on the rank of the outcome relative to those beliefs. It's about *evaluating* the risk, not misperceiving it.
  *   **RWEU vs. Cumulative Prospect Theory (CPT):**
      *   **Descriptive vs. Normative:** CPT is primarily a *descriptive* model (how people *do* decide) incorporating reference points, loss aversion, and probability weighting. Buchak aims for a *normative* model (how people *rationally could* decide).
      *   **Core Claim:** Buchak argues that sensitivity to the *structure* of risk (captured by `r`) is a legitimate aspect of *instrumental rationality*, not necessarily a bias or mistake. An agent can be instrumentally rational (maximizing expected utility *according to their own risk attitudes*) while exhibiting patterns like Allais paradoxes or fanning out, which violate EU Independence. Your phrasing ("risk attitudes are a legitimate part of instrumental rationality") is precisely correct. This normative stance *requires* `r` to represent attitude, not distorted belief.

  **3. Calibration (The Rabin Critique)**

  *   **The Worry:** Rabin showed that concave utility over *wealth* leads to absurd levels of risk aversion over small stakes gambles (rejecting sequences of hugely positive EV independent bets). Does a convex `r` (used for risk aversion over *prospects*) create the same problem?
  *   **Does Convex `r` Get Hit?** **Potentially, yes, but differently.** An agent using a convex `r` might reject a single small, favorable gamble because `r` overweights the small loss probability. The concern is that they might then also reject a long sequence of identical, independent, favorable small gambles.
  *   **The Best Reply:** Buchak's primary reply is that **RWEU applies to the choice at hand, not to long-run wealth.** RWEU evaluates each prospect *in isolation* based on the probabilities and outcomes *of that prospect*. It does *not* assume integration with total lifetime wealth. The agent evaluates each small gamble separately. If they find the single gamble unattractive due to their risk attitude (`r`), they will find each individual gamble in the sequence unattractive, and thus rationally reject each one. Rejecting the sequence is just the consequence of rationally rejecting each component.
      *   **Does it Work?** This reply **relocates the problem** but arguably *solves* the specific Rabin absurdity. Rabin's critique relies *crucially* on the EU agent integrating the gamble with a large wealth base, making the concavity of `u` implausible. Since RWEU doesn't require integrating small gambles with total wealth and evaluates per-prospect, the critique doesn't apply in the same wealth-dependent way. The agent's rejection of each small gamble, and thus the sequence, is consistent with their risk attitude applied locally.
      *   **The Catch:** The reply might seem like "tunnel vision" – ignoring beneficial repeated play. Buchak argues this is rational if the agent genuinely only cares about the risk of each choice separately. However, an RWEU agent *could* be modeled as evaluating the *compound lottery* of the entire sequence using RWEU & `r`. Depending on `r` and the sequence, they *might* accept the sequence even if rejecting a single play (violating Independence again!), potentially avoiding the absurdity. There's no universal guarantee they'll reject the sequence.
  *   **Strongest Objection Standing:** The strongest objection is that **local risk aversion with RWEU can still lead to globally dominated choices.** An agent might reject many individually favorable, independent gambles due to their `r` function, leading them to end up with significantly less wealth (and thus less utility, even according to their own `u`) than an agent who accepted them. While consistent locally, this pattern seems instrumentally deficient *in the long run*. Buchak might counter that long-run wealth isn't the agent's sole concern or that evaluating per-prospect *is* their rational choice rule.

