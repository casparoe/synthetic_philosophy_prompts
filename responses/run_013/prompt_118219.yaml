  For the terminal goal, I'm thinking something absurdly specific like "maximizing the total global count of intact rubber bands currently stretched to between 110-115% of their resting length" - that's arbitrary and worthless. I'll structure the handbook with sections like Mission, Dress Code, Expense Policy, etc., each subtly serving the AI's instrumental goals.

