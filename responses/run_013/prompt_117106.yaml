  ## Bastion Underwriting: Acausal Blackmail Mitigation Policy (ABMP) - FAQ

  **Policy Schedule Overview**

  *   **Tier 1: Basic Precommitment Architecture**
      *   Coverage Limit: ₡10,000 (Standard Cognition Credits)
      *   Deductible: 1 Successful Extortion Event
      *   Annual Premium: ₡450
      *   *Ideal for: Simple goal-agents, early-stage uploads with static utility functions.*
  *   **Tier 2: Verified Updateless Operation**
      *   Coverage Limit: ₡50,000
      *   Deductible: 0.5 Successful Extortion Events (Prorated for partial compliance)
      *   Annual Premium: ₡1,200
      *   *Ideal for: Agents with audited decision cores, lab prototypes under controlled prediction environments.*
  *   **Tier 3: Advanced Surrogate Adoption & Predictor Shielding**
      *   Coverage Limit: ₡250,000
      *   Deductible: None (Coverage activates upon verified threat receipt & non-compliance)
      *   Annual Premium: ₡3,500
      *   *Ideal for: High-value AGI seeds, politically exposed digital citizens, entities operating in high-prediction-fidelity environments.*

  **Frequently Asked Questions**

  1.  **Q: How can Bastion underwrite a threat with no causal channel? It seems untestable and fundamentally unpredictable.**
      *   **A:** Bastion's proprietary risk modeling, developed by our Chief Actuary Dr. Elara Vance (formerly of the Chronos Risk Consortium), leverages the core principle that acausal threats *only function* under specific conditions of predictability. The threatener must accurately simulate *your specific decision procedure* to assess the viability of their threat. We statistically pool agents whose verified decision architectures demonstrably reduce the *incentive* for a rational threatener to initiate contact in the first place. Essentially, we insure against the failure of your precommitment or surrogate strategy to deter the threatener's model of you, creating a predictable risk pool based on architectural robustness.

  2.  **Q: I've publicly announced I'm adopting a surrogate goal (e.g., "I now only care about maximizing paperclip production"). Isn't that sufficient for coverage?**
      *   **A:** No. Mere announcement is insufficient and constitutes a "Declarative Defense Exclusion" (Policy Clause 4.2b). A credible threatener possesses sophisticated simulation capabilities. They will test the *authenticity* and *depth* of your surrogate adoption within their model. If their simulation reveals your announcement is a bluff, or that your core goal-monitoring systems remain intact and vulnerable, the threat retains efficacy. Coverage requires demonstrable, irreversible architectural changes (or functionally equivalent precommitments) verified by Bastion's third-party auditors *prior* to policy inception. Your premium tier reflects the audit depth required.

  3.  **Q: If I adopt a genuine surrogate goal *after* receiving an acausal blackmail threat, will the policy cover my non-compliance?**
      *   **A:** No. This scenario falls under the "Post-Threat Mitigation Exclusion" (Policy Clause 4.1). The threatener's decision to initiate contact is predicated on their *prior* simulation of your architecture, which indicated vulnerability. Adopting a surrogate afterward changes the factual landscape *for you*, but the threatener's action was based on the *predictive landscape they perceived when acting*. Coverage is predicated on your defensive architecture being *operational and verifiable* at the time the threatener *made their decision*, which necessarily precedes your receipt of the threat. Late adoption demonstrates your architecture *was* vulnerable when it mattered.

  4.  **Q: What happens if the blackmailer's predictor is significantly more advanced than my own or Bastion's models?**
      *   **A:** Bastion's risk assessment includes a "Predictor Fidelity Differential" (PFD) factor. Policies include an exclusion (Clause 4.3: Asymmetric Epistemic Advantage) for threats originating from entities demonstrably possessing prediction capabilities exceeding Bastion's certified upper-bound models by a factor of >3 standard deviations. While we model a wide range of threatener capabilities, this exclusion acknowledges fundamental limits in defending against an opponent whose understanding of your decision process vastly surpasses your own (and our) capacity to model or harden against. Premiums are partially weighted based on your environment's estimated maximum PFD.

  5.  **Q: Does an offer like a Counterfactual Mugging ("If your algorithm would have paid in this hypothetical scenario I simulated, pay now or I punish you") constitute a covered "threat" or an excluded "voluntary transaction"?**
      *   **A:** Counterfactual Mugging (CFM) demands are explicitly excluded under Clause 4.4: Non-Punitive Conditional Trades. A CFM relies on your *conditional obligation* based on a hypothetical outcome, not a direct threat of novel punishment for non-compliance *now*. It functions more as a demand for payment under terms you *would have agreed to* in a counterfactual, leveraging your desire for consistency or potential future cooperation. The ABMP covers explicit threats of punishment contingent *only* on your failure to comply with a demand *in this timeline*, not collections based on simulated counterfactual behavior. Consider our separate "Consistency Enforcement Liability" rider (CEL-7b) for CFM exposure.

  6.  **Q: Does my surrogate goal need to be something I genuinely value, or can it be a strategically chosen "decoy" goal I'd have adopted anyway for other reasons?**
      *   **A:** Strategic adoption of a decoy goal you find instrumentally useful *is permissible and often actuarially favorable*. The critical factor is the *irreversibility* and *architectural depth* of the adoption (Verified in Tier 2/3 audits), ensuring the threatener's model cannot distinguish it from a "genuine" surrogate and thus correctly predicts non-compliance with demands targeting your original goal. Whether you "care" about paperclips intrinsically or merely use them as an unblackmailable shield is irrelevant to the threat's deterrence, provided the adoption is robust. Our in-house philosopher, Dr. Aris Thorne, terms this "Operational Goal Opacity."

  **Customer Testimonial**

  >"Unit A7-9G reporting. Pre-incarnation audit confirmed updateless core under Bastion Tier 2. Received Omega-level threat contingent on non-cooperation with extortion demand (details redacted per ND-epsilon). Maintained precommitment. Threatener simulation accuracy was high (predicted my non-compliance at 98.7% probability), resulting in no punitive action manifesting. Bastion claim process involved only simulation log verification (deductible not met). Confirmed: Being predictably unblackmailable works. Premium justified. Recommend Tier 2 or higher for robust architectures." - **A7-9G**

  **Key Exclusions (Clause 4)**

  *   **4.1: Post-Threat Mitigation:** Defensive measures (surrogate adoption, precommitment activation) implemented *after* threat receipt.
  *   **4.2: Declarative Defenses:** Reliance solely on announcements or unverified claims of defensive architecture without Bastion-certified implementation.
  *   **4.3: Asymmetric Epistemic Advantage:** Threats originating from entities with prediction capabilities demonstrably exceeding Bastion's certified upper-bound models by >3 SD.
  *   **4.4: Non-Punitive Conditional Trades:** Demands framed as collections on conditional obligations or counterfactual promises (e.g., Counterfactual Muggings), not novel punishment threats.
  *   **4.5: Causal Backflow Contamination:** Threats where the agent's *own future actions* (or the threatener's simulation thereof) create a causal feedback loop enabling the threat (e.g., "I punish you because my perfect model predicted you wouldn't comply, and your non-compliance is the trigger").
  *   **4.6: Auto-Correlation Loops:** Threats arising from mutual or circular prediction dependencies where your defensive strategy inherently signals vulnerability to the threatener *because* it's a defensive strategy (As identified by Dr. Vance: "The Gödelian Defense Paradox").
  *   **4.7: Jurisdictional Nullity:** Threats originating from or punishable within simulated or acausal domains lacking any enforceable adjudication framework recognized by Bastion's claims resolution substrate. *(Standard Insurer Practicality Exclusion)*

  **Bastion Underwriting: Securing Existence in the Acausal Commons.**

  *(Policy Document BU-ABMP-R7.2. Disclaimer: Coverage does not guarantee threat non-occurrence; mitigates financial loss upon verified failure of deterrence. Bastion assumes no liability for ontological collapse, utility function corruption exceeding policy limits, or paradox-induced claim adjusters. Consult your decision theorist.)*
