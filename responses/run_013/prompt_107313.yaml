  The case is fascinating: A dye grader is highly accurate (97%) but can't articulate her method. She learned via a hue-angle rule initially, but when given that rule again, her performance drops to 70%. She also spots errors the rule misses but can't explain why. Key points for each side:

  Intellectualist (let's call them Alex) must explain:
  1) Why her knowledge seems non-propositional despite originating from a proposition (the initial rule)
  2) Why explicit rules hinder performance if knowledge is propositional
  3) How she detects rule-exceptions without propositional awareness

  Anti-intellectualist (let's call them Jamie) must explain:
  1) How learning began with propositions if know-how is non-propositional
  2) Why her accuracy drops when consciously applying rules
  3) What constitutes her know-how if not propositional knowledge

  For the dialogue (800 words), I'll make them responsive - Jamie should challenge Alex on the degradation effect, Alex should press Jamie on the learning paradox. Neither gets an easy win. The dye grader's case pulls both positions: her learning history favors intellectualism, her current performance favors anti-intellectualism.

  In the analysis section (150 words), the real disagreement is whether practical success requires propositional knowledge at the moment of action. The verbal part is whether we call her ability "knowledge" - both agree she has a reliable capacity.

  For "which side it hurts more" (100 words), I think it challenges intellectualism harder because Alex must explain why accessing the very propositions that (supposedly) constitute her know-how actively impairs it. Jamie only needs to explain why initial verbal instruction was merely scaffolding, not the knowledge itself.

  I'll write sharply but fairly - Alex defending propositions as constitutive but inaccessible, Jamie arguing ability exists independently of articulation. The ending should feel unsettled, with the pitcher empty but the debate ongoing.
answer: |-
  ## Dialogue (Alex: Intellectualist, Jamie: Anti-Intellectualist)

  *(Setting: A slightly sticky table in a dimly lit pub, half-empty pitcher between them.)*

  **Jamie:** Okay, that dye grader case? Perfect. She’s got the *know-how*, right? Ninety-seven percent! But ask her *how* she does it? She flounders. “A bit lighter than that one, I guess”? That’s not a fact, that’s a shrug. She *shows* she knows how by *doing* it reliably. The propositional stuff – the hue-angle rule – it’s like scaffolding they took down after she learned. It’s irrelevant now. The knowledge *is* the capacity.

  **Alex:** Hold on. She *learned* with the rule. That’s crucial! She didn’t emerge from the womb classifying dyes. The proposition – “Batch X is acceptable if hue-angle < Y” – was the seed. It gave her the initial criteria, the target. Her current expertise? It’s built *on* that foundation. She possesses a vast, complex set of *knowledges-that* now – facts about subtle visual cues, comparisons, exceptions – but they’re tacit, embedded. She *knows that* this specific shade deviation *here* signals a problem, even if she can’t articulate the universal rule for it.

  **Jamie:** Tacit? Embedded? Sounds like fancy ways to say “not propositional.” If it’s genuinely propositional knowledge, why can’t she access it? And crucially, why does forcing her to *use* the original, explicit proposition – the rule she supposedly knows! – make her *worse*? Seventy percent! That rule *interferes* with her actual know-how. If know-how *were* just knowing propositions, applying the relevant proposition should *help*, or at least not hurt. It actively disrupts her performance. The rule isn’t the knowledge; it’s an obstacle *to* the knowledge she possesses.

  **Alex:** It disrupts her *fluency*, Jamie, not the underlying knowledge. Think of riding a bike. You know countless propositions about balance, momentum, steering. But if I force you to consciously recite Newton’s laws *while* navigating a tight corner, you’ll wobble! The propositions are still true, still known, but conscious access disrupts the smooth, integrated application. Her know-how involves selecting and applying the *right* propositions in real-time, a complex skill itself. The explicit rule forces a simplistic, context-blind application that ignores the nuanced propositions she’s actually learned to use.

  **Jamie:** But she spots bad batches the *rule* would call fine! And she *can’t say why*. You’re saying she possesses a proposition like “Batch Z is bad because of subtle luminance shift under condition C”? But she demonstrably *doesn’t* possess that proposition consciously, and crucially, she doesn’t need to formulate it *as* a proposition to act on it! Her perception-action loop bypasses propositional formulation entirely. The ‘why’ isn’t a hidden fact; the ‘why’ *is* her trained discriminatory capacity firing. She registers the deviation *as* unacceptable directly.

  **Alex:** She registers it *as* unacceptable *because* she recognizes it falls under a category her experience has built – a category defined by properties she’s learned to detect, even if she can’t list them. That category *is* a kind of fact, even if it’s not neatly captured by the initial hue-angle rule. Her inability to articulate it doesn’t mean the knowledge isn’t propositional in form; it means her access to formulating those propositions is limited. The *content* of her judgment is still factual: “This batch exhibits property P, which correlates with failure.” She knows *that* P is bad.

  **Jamie:** You keep smuggling in the ‘knowing that’. Look at the learning trajectory. She started with the explicit rule – pure proposition. But through practice, *doing* it thousands of times, she developed a perceptual-motor skill that *transcended* that rule. It became something else. If know-how was *just* knowing propositions, why did practice change its form so radically? Why did the initial proposition become not just insufficient, but actively detrimental to access? The skill became procedural, embodied. It’s in her eyes, her hands, her gut feeling. No facts required *in the execution*.

  **Alex:** Practice didn’t change the *form* of knowledge; it refined the *content* and automated the *access*. She started with a crude proposition. Practice gave her a vast library of highly specific, context-sensitive propositions. Automation means she doesn’t need to consciously retrieve and apply each one serially; the system runs efficiently. But the currency is still factual. When she spots the rule-breaking bad batch, her perceptual system is accessing a stored recognition template – a complex fact about what ‘bad’ looks like in that specific context – and matching it. The ‘gut feeling’ *is* the rapid application of that complex propositional knowledge.

  **Jamie:** But the rule *was* a stored recognition template! A simple one. Yet accessing *it* consciously messes her up, while accessing the complex one unconsciously works perfectly. If both are ‘propositions’, why the massive difference in outcome when accessed consciously? It points to a fundamental difference in kind. The complex ‘template’ isn’t a proposition she *knows*; it’s a neural configuration her visual system *uses*. It’s a *how*, not a *that*. She doesn’t *know that* the batch is bad; she *sees* its badness directly, thanks to her trained capacity. The knowledge *is* the reliable disposition to perceive and act appropriately.

  **Alex:** And I say that reliable disposition *is constituted by* her grasp of countless specific, albeit unarticulated, facts about dye appearance. The seeing *as* bad *is* the perceptual recognition of those facts. Without those facts being true and her being attuned to them, the disposition wouldn’t exist. The know-how supervenes on the know-that.

  **Jamie:** ...Maybe. Or maybe the ‘facts’ you’re pointing to are just retrospective descriptions *of* the successful exercise of the know-how, not what it consists *in*. We’re circling the pitcher’s dregs here.

  **Alex:** *(Pushes the empty pitcher aside)* Seems fitting. Another round? We clearly need more data... or maybe just more beer.

  ---

  **Where the disagreement is real and where it's verbal**

  The **real disagreement** is about the *fundamental nature* of the dye grader's successful ability. Alex insists its core is *propositional content* (facts about dye properties) that she possesses, even if tacitly accessed. Jamie insists it's a fundamentally *non-propositional, embodied capacity* (a trained perceptual-motor skill) that propositional descriptions merely track or report on. This drives their clash over why the explicit rule hinders her (Alex: disrupts fluent access; Jamie: forces a different, inferior mode of operation) and the status of her unarticulated judgments (Alex: tacit propositions; Jamie: direct perception-action).

  The **verbal disagreement** centers on the definition of "knowledge" and "proposition." They might agree she has a *reliable ability* and that we can *describe* her performance *as if* she knew facts. The fight is whether labeling this ability "knowing how" *requires* it to be constituted by, or reducible to, knowing facts ("knowing that"). Jamie would say "knowing how" names the ability itself, distinct from propositions. Alex would say "knowing how" *is* a kind of "knowing that."

  ---

  **Which one the case hurts more**

  The case **hurts Alex (the Intellectualist) more**. Alex must explain why accessing the *very kind of thing* that supposedly constitutes her know-how (a propositional rule) catastrophically degrades her performance. The explanation – that conscious access disrupts *fluency* but the propositions are still there – feels strained when the drop is so severe (97% to 70%), especially compared to her flawless detection of rule-exception batches. Alex has to posit a vast network of inaccessible, highly specific propositions to account for her expertise, making the propositional base look suspiciously epiphenomenal *during the act itself*. Jamie can more naturally explain the rule's hindrance (it bypasses the skilled capacity) and the unarticulated expertise (the skill operates directly). Alex gives up more theoretical simplicity.
