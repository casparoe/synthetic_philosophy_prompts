answer: |-
  You've pinpointed a profound tension at the heart of modern museum ethics and cultural property law. The current arrangement reflects a complex, often contradictory, set of implicit assumptions. Let's reconstruct the underlying theory charitably, then examine its components and alternatives.

  ### Charitable Reconstruction of the Implicit Theory

  1.  **Hierarchy of Harm & Sanctity:**
      *   **Core Assumption:** Certain types of harm are considered more severe and immediate than others.
      *   **Application:** Desecration of human remains and violation of deeply held religious/sacred beliefs (via funerary/sacred objects) constitutes a *direct, ongoing harm* to both the deceased and the living descendants/community. This harm is visceral, personal, and often tied to spiritual well-being. Possession of a culturally significant bronze statue, while potentially causing distress, is seen as causing a *different kind* of harm – more abstract, cultural, historical, or political – which is deemed less urgent or severe in the hierarchy of wrongs. The dead *can* be "wronged" in a way that demands immediate redress (restitution), while the living's claim to cultural patrimony is often seen as a claim for *possession* or *access*, potentially mitigated by the "universal access" argument.

  2.  **The "Universal Museum" Ethos vs. Specific Sacred Duty:**
      *   **Core Assumption:** Museums serve as neutral, universal repositories for "humanity's heritage," providing access and scholarship for the global public good. However, this duty *yields* to a specific, higher ethical duty concerning the dead and the sacred.
      *   **Application:** Holding onto the Benin Bronzes or Parthenon Marbles is justified under the "universal access/benefit of humanity" principle. Holding onto human remains or sacred objects used in active ritual is *not* justifiable under this principle because it actively perpetrates a specific sacrilege or violation that outweighs any universal benefit. The museum cannot ethically be a custodian of something whose very retention constitutes harm.

  3.  **Property vs. Personhood/Cultural Continuity:**
      *   **Core Assumption:** Human remains and objects *intimately tied to specific individuals* (funerary objects) or *active religious practice* (sacred objects) transcend mere *property*. They are extensions of personhood or essential conduits for spiritual/cultural continuity. Other artifacts, even "cultural patrimony," are primarily categorized as *property* or *art*.
      *   **Application:** NAGPRA effectively recognizes a form of group personhood or sacred trust concerning remains and specific sacred items. The claim over a bronze mask, however, is seen primarily as a property claim (who rightfully owns it?) or a claim about cultural representation (who gets to display/interpret it?), not an intrinsic violation of personhood or active religious practice.

  4.  **Legal Positivism & Pragmatism (The 1970 Cutoff & Legal Barriers):**
      *   **Core Assumption:** Law and morality are distinct spheres. Legal frameworks define enforceable obligations based on specific dates and procedures, not necessarily absolute morality. Historical context matters legally.
      *   **Application:** The 1970 UNESCO Convention cutoff implicitly assumes:
          *   **Legal Certainty:** It's practically impossible to adjudicate ownership claims stretching back centuries with shifting borders, governments, and laws. A clear line (1970) provides certainty for the art market and museums.
          *   **Moral Shift (not Decay):** It reflects the belief that the *international norms* regarding acquisition changed significantly *around* 1970. Objects taken before this, especially in colonial contexts, were often acquired under legal frameworks *of their time* (however unjust we now see them), making current legal claims difficult. This doesn't necessarily mean the *moral claim* decays, but that the *legal enforceability* diminishes over time due to complexity and past legal acceptance. The British Museum Act exemplifies legal positivism: the *law* prohibits return, regardless of moral arguments.

  5.  **Cultural Affiliation as Provable Continuity (NAGPRA):**
      *   **Core Assumption:** For restitution claims based on specific lineage or sacred duty (like reburial), a demonstrable, continuous connection between the present claimant group and the specific past group whose remains/objects are involved is necessary and possible. This continuity is often defined through cultural, linguistic, geographical, and biological evidence.
      *   **Application:** This is primarily an **administrative and evidential requirement**, not necessarily a deep philosophical assertion about the *nature* of group identity. It aims to ensure the right group receives the remains for proper treatment and to prevent spurious claims. It *happens to fit* theories that emphasize lineal descent or continuous cultural practice as the basis for such specific claims but is largely driven by practicality and the need for legal defensibility.

  ### What the Practice Strictly Needs vs. What it Merely Happens to Fit

  *   **Strictly Needs:**
      *   **A distinction between types of objects/harm:** The practice *requires* the belief that harm related to the dead/sacred is categorically different and more compelling than harm related to cultural patrimony/art. Without this hierarchy, the distinction collapses.
      *   **The primacy of legal frameworks:** The practice fundamentally relies on the distinction between legal obligation and moral suasion. NAGPRA creates a *legal* duty; the absence of similar laws for other artifacts means the *moral* claim lacks legal teeth internationally.
      *   **An administrative mechanism for specific claims:** Something like NAGPRA's cultural affiliation requirement is *necessary* for any system handling large-scale restitution claims to specific groups; it needs *some* verifiable criteria, even if imperfect.

  *   **Merely Happens to Fit (Underdetermined):**
      *   **The "Universal Museum" justification:** This is a *post-hoc* rationalization for retaining certain artifacts. The practice could continue without this specific ideology, relying solely on legal barriers, arguments about the impracticality of return, or differing views on the nature of cultural harm.
      *   **A strong theory of moral decay:** The 1970 cutoff relies more on *pragmatism* and *legal certainty* than a strict philosophical belief that moral claims expire. One could believe the moral claim is eternal but still support the cutoff for practical legal reasons. The practice fits both "moral decay" and "legal pragmatism despite enduring morality" views.
      *   **A specific essentialist theory of group identity:** While NAGPRA *uses* a model of provable continuity, the core practice of returning remains/sacred objects could function under a different model of group connection (e.g., geographical, cultural revival, shared historical trauma) if the administrative process were redesigned. The practice *fits* essentialism but doesn't strictly *require* it.

  ### Swapping in the Rival View: Permanent Cultural Claims & Fluid Identity

  If we adopt the rival view that **a people's relationship to its own cultural objects constitutes an enduring claim that does not expire, and that group identity is dynamic rather than requiring strict lineal continuity,** the current arrangement becomes untenable:

  1.  **Collapse of the Hierarchy:** The distinction between remains/sacred objects and other cultural patrimony blurs. The "harm" of dispossession is seen as continuous and significant for *all* culturally vital objects, not just those tied to burial or active worship. The bronze mask isn't just art; its absence is an ongoing rupture in cultural narrative, self-understanding, and identity formation.
  2.  **Rejection of "Universal Museum" Primacy:** The argument that "more people see it here" is countered by the argument that the object's deepest meaning, context, and ability to serve its originating community's cultural continuity is paramount. The "universal" value is seen as secondary or even parasitic if it prevents the object fulfilling its primary cultural role.
  3.  **Moral Claims Trump Legal Positivism & Time:** The 1970 cutoff becomes morally arbitrary. The *means* of acquisition (colonial looting, unequal treaties, coercion) becomes the primary moral factor, regardless of the date. Legal barriers like the British Museum Act are seen as unjust laws requiring change, not insurmountable obstacles. "It was legal at the time" is rejected as a justification for ongoing possession.
  4.  **Transformation of Cultural Affiliation:** The requirement for strict, provable lineal/cultural continuity would be replaced by a focus on:
      *   **Cultural Significance:** Does the object hold deep meaning for the claimant community *today*, regardless of strict historical continuity?
      *   **Geographical/Cultural Connection:** Is the claimant group the cultural successor or primary descendant community connected to the place/culture of origin?
      *   **Self-Identification:** Greater weight given to the community's own definition of its connection and claim.
      *   **Process over Proof:** Emphasis shifts to consultation, negotiation, and recognizing the claimant community's authority over its own cultural heritage, moving away from adversarial "proof." NAGPRA itself is evolving in this direction with concepts like "cultural relationship" supplementing strict "cultural affiliation."
  5.  **Focus on Repairing Historical Injustice:** Repatriation becomes a core mechanism for addressing the ongoing legacies of colonialism and systemic dispossession, not just rectifying specific acts of sacrilege.

  ### Conclusion

  The current double standard presupposes a specific, hierarchical valuation of harm (desecration > cultural dispossession), a separation between legal obligation and moral claims (especially regarding the past), and the legitimacy of the "universal museum" concept for non-sacred artifacts. It *relies* on this harm hierarchy and legal positivism, while merely *fitting* (or opportunistically using) arguments about universal access, moral decay, and essentialist group identity.

  Adopting the rival view of permanent, non-expiring cultural claims rooted in a dynamic understanding of identity fundamentally challenges this hierarchy, rejects the primacy of the universal museum argument for culturally vital objects, demands moral claims override legal technicalities and time barriers, and necessitates a more flexible, community-centered approach to establishing legitimate claims. This shift is already underway in many areas beyond NAGPRA, driven by evolving ethical understandings and the persistent advocacy of source communities.
