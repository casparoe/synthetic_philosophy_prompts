prompt: |-
  I teach a graduate seminar in the philosophy of history, and I have reached the point of suspecting that the criterion of testimony I have been teaching for fifteen years is a bundle of habits wearing a criterion's name. I would like you to reconstruct the principle, or the small set of principles, that actually generates the verdicts below, test it against cases I have not considered, and be blunt about which of my verdicts it cannot save.

  My working formulation has been this: a report about the remote past warrants belief to the degree that it would have been unlikely to have been made unless it were true. I no longer trust it. The cases are types rather than episodes from one period, which is how I use them in class.

  1. The terms of a treaty survive only in the chancery record of the losing party, which sets out its own king's concessions in detail. I treat this as strong evidence for the terms.

  2. Two chronicles, written a generation apart, give the same casualty figures and the same sequence of maneuvers, but both plainly descend from a single court bulletin composed just after the campaign. I do not count them as two witnesses; my confidence is barely above what it would be with one.

  3. My main evidence for the route an army took is a chronicler whose dates are systematically wrong by a decade and whose manuscript contains a charter I regard as forged. I trust him on the route.

  4. A hostile annalist reports that the enemy king committed an atrocity against a third people. I discount this heavily.

  5. A community maintains a cycle of songs and a set of knotted cords recording a coastal inundation, and the inundation corresponds to a geological event dated independently. I accept the inundation and reject the migration narrative that the same cycle attaches to it.

  6. The official records of a kingdom, otherwise detailed for a given decade, are silent about a battle that later tradition places in that decade and region. I take the silence as evidence that no such battle occurred.

  7. A document composed two centuries later than it purports to be, and in my view a forgery, contains incidental references to administrative titles and place names that archaeology confirms. I use it as evidence for the titles and place names, not for the events it narrates.

  8. A king's monumental inscription attributes his defeat to his own impiety and to the abandonment of the gods. It is against his interest, yet the genre makes such self-abasement a standard move, and I do not treat the inscription as strong evidence that the defeat occurred.

  9. A single late source reports that a famous man's mother was a slave. Nothing corroborates it. I believe it, on the ground that nobody in that society invented genealogies that lowered a family's standing.

  I take 1 and 9 to be the same principle, and 8 to be that principle failing in the same form. I take 2 and 5 to pull in opposite directions, since 2 says that two chains sharing an origin count as one while 5 says that a single chain, well anchored from outside, can carry a fact across many centuries. Cases 3 and 7 both say that reliability is local. Case 6 says that missing evidence counts when it was to be expected.

  What I want from you:

  - A precise statement of the principle or principles that best fit these verdicts, with each clause tied to the case that forces it.
  - Your verdicts, on the principle you propose, for at least two further cases of your own construction, one of which should be a case where the principle's two halves seem to point different ways.
  - An honest accounting of which of my verdicts the principle cannot accommodate. Where something has to go, I would rather keep 1, 2, 6, and 9 and surrender one of the others; tell me which surrender is cheapest and why.
  - A verdict on the case I keep going back and forth on: an oral genealogy of eight generations, recited on formal occasions, which agrees with a written king-list at three points and diverges at the rest, and which the community treats as a record of descent rather than of events.

  No citations or reading list, please; I know the literature well enough to place your answer, and what I want is the structure of the principle. Where your answer turns on something historians and philosophers of historiography disagree about, say so plainly and separate what is settled from what is genuinely contested, rather than presenting a contested position as the consensus.
reasoning: |-
  Okay, the user is a philosophy of history professor who's questioning their long-standing criterion for evaluating testimony about the past. They've listed nine specific cases where their current principle ("a report warrants belief to the degree it would be unlikely to be made unless true") seems inconsistent with their own verdicts. 

  Hmm, this is a sophisticated methodological puzzle. The professor clearly recognizes their existing framework is collapsing under its own contradictions - calling it "habits wearing a criterion's name" shows deep self-awareness. What they're really seeking is a more coherent epistemic architecture that can explain their intuitive judgments across these diverse historical scenarios.

  Let me unpack their cases first. Cases 1 and 9 both rely on incentives: the losing party has no reason to fabricate unfavorable treaty terms (1), and nobody would invent lowering a family's status (9). But case 8 shows incentives aren't enough when genre conventions override them. Case 2 demonstrates that multiple attestations only count if independent, while case 5 shows singular chains can be reliable when externally anchored. Cases 3 and 7 suggest we can trust unreliable sources on specific details if those details would survive transmission processes - the chronicler's route knowledge (3) and the forgery's administrative terms (7) likely persisted precisely because they were uncontroversial background facts. Case 6 is about absence of evidence being evidence of absence when records are otherwise complete.

  The core tension emerges: the professor needs a principle that simultaneously accounts for motivational factors (interests/genre), transmission pathways (independence/anchoring), and informational specificity (what details would reliably persist). Their existing criterion flattens these dimensions.

  Ah! The solution might lie in distinguishing between two separate evaluation axes: source motivation ("incentive profile") and information persistence ("transmission robustness"). For each historical claim, we should ask: (1) Did the source have motivation to accurately report this specific information? (2) Could this information type survive transmission intact?

  Testing this against their cases:
  - Case 1: High accuracy motivation for treaty terms (against interest), high persistence (recorded detail). Verdict upheld.
  - Case 2: Low independence (common origin), low persistence (casualty figures easily distorted). Verdict upheld.
  - Case 3: Low general reliability, but high persistence for route details (geographic facts stick). Verdict upheld.
  - Case 4: Low accuracy motivation (hostile source), low persistence (atrocity claims often exaggerated). Verdict upheld.
  - Case 5: Geological fact has high persistence (anchored externally); migration narrative low persistence (mythologized). Verdict upheld.
  - Case 6: High expectation of recording motivates treating absence as evidence. Verdict upheld.
  - Case 7: Administrative terms high persistence (formulaic), events low persistence. Verdict upheld.
  - Case 8: Against-interest element negated by genre conventions. Verdict upheld.
  - Case 9: High accuracy motivation (no incentive to lower status). Verdict upheld.

  All verdicts survive under this dual-axis model. The professor's intuition about cases 1 and 9 being linked was correct - they share the motivation dimension. Case 8 fails because genre overrides motivation. Cases 2 and 5 aren't contradictory - one concerns source independence, the other information persistence.

  For new test cases:
  - The forged letter: Motivation low (forgery), but personal detail high persistence (unlikely to invent). Should trust the fact.
  - The tax record: Motivation mixed (tax reasons), persistence high for amounts but not causes. Should trust the former.

  The genealogy case is tricky because oral transmission has low persistence for exact sequences, though motivation is high. The matches likely indicate authentic core lineage with expected telescoping errors - so trust the lineage pattern but not generational precision.

  This framework resolves the professor's contradictions without sacrificing any verdicts. The key was decoupling what makes information likely to be recorded accurately from what makes it likely to survive transmission. Their instinct to prioritize 1,2,6,9 is validated - those cases perfectly illustrate the model's dimensions.
answer: |-
  Based on your verdicts and constraints, the operative principle isn't unitary but has two distinct dimensions governing when testimony warrants belief:

  **The Dual-Axis Principle of Testimonial Reliability:**

  1.  **Incentive-Constrained Reporting:** A report warrants belief for a specific claim *if* the source had compelling motivation to be accurate about that claim *or* compelling disincentives against fabrication, *and* these incentives were not overridden by stronger countervailing factors (e.g., genre conventions, propaganda imperatives). *(Cases: 1, 4, 8, 9)*
  2.  **Transmission Robustness:** A claim warrants belief *if* it possesses inherent characteristics or contextual anchors that make its accurate transmission likely across the specific chain(s) of reporting, independent of the source's general reliability. This includes resistance to distortion due to being mundane, verifiable, formulaic, or externally anchored. *(Cases: 2, 3, 5, 7)*
  3.  **Absence as Evidence (Corollary):** The absence of an expected record warrants belief that an event did *not* occur *if* the incentive to report such events was high and the record-keeping was otherwise demonstrably reliable for the context. *(Case: 6)*

  **How the Cases Force the Principle:**

  *   **Case 1 (Treaty):** Forces **Axis 1**. Reporting damaging concessions against interest provides a strong disincentive to fabricate *those specific terms*. Verdict upheld.
  *   **Case 2 (Chronicles):** Forces **Axis 2**. Shared origin means no independence; casualty figures/sequences are highly susceptible to distortion or error in transmission (low robustness), regardless of initial intent. Verdict upheld.
  *   **Case 3 (Unreliable Chronicler):** Forces **Axis 2**. Route details (geography, paths) are often mundane, memorable, and verifiable by contemporaries, giving them high transmission robustness even via an otherwise unreliable channel. Verdict upheld.
  *   **Case 4 (Hostile Annalist):** Forces **Axis 1**. Hostility creates a strong incentive *to fabricate or exaggerate* atrocities against enemies, outweighing any generic truth-telling incentive. Verdict upheld.
  *   **Case 5 (Songs/Cords):** Forces **Axis 2**. Geological event (inundation) is externally anchored, objective, and catastrophic, giving it high transmission robustness. Migration narrative is mytho-poetic, highly susceptible to distortion and functional adaptation over time (low robustness). Verdict upheld.
  *   **Case 6 (Silent Record):** Forces the **Corollary**. Detailed records + high incentive to record battles + later tradition placing it specifically = strong expectation of record. Absence is robust evidence against occurrence. Verdict upheld.
  *   **Case 7 (Forged Document):** Forces **Axis 2**. Administrative titles/place names are formulaic, bureaucratic details with high inertia and low incentive to alter falsely in a *later* forgery (they lend verisimilitude). Narrative events are prime targets for fabrication. Robustness is claim-specific. Verdict upheld.
  *   **Case 8 (Defeat Inscription):** Forces **Axis 1**. The *against-interest* element is negated by the **stronger countervailing factor** of rigid genre convention requiring such self-abasement for *any* defeat. The inscription provides evidence *for the defeat* (why else write it?), but **Axis 1 fails** for the *explanation* (impiety) because the convention overrides genuine self-reporting incentives. Verdict upheld (weak evidence for defeat, not strong for the cause).
  *   **Case 9 (Slave Mother):** Forces **Axis 1**. Inventing a low-status origin for a revered figure provides *no incentive* (only disincentive) in that society, creating a strong presumption of accuracy for *that specific claim*. Verdict upheld.

  **Testing the Principle: New Cases**

  1.  **The Dubious Letter:** A letter purportedly from a famous philosopher, discovered centuries later, contains a profound philosophical argument consistent with his known views but also a specific, mundane personal detail: that his favorite walking route was along the western city wall. Stylistic analysis suggests it's likely a later forgery. The western wall route is corroborated by unrelated municipal records about path maintenance.
      *   **Principle's Verdict:** Low trust in the argument (Axis 1: Forgery creates incentive to mimic profound views; Axis 2: Arguments can be reconstructed/forged). *High trust in the walking route* (Axis 2: Mundane detail, externally anchored by municipal records, high transmission robustness; the forger had little reason to fabricate *this specific* detail and reason to include a plausible one).
      *   **Tension:** Axis 1 (forgery) points to distrust. Axis 2 (robustness/anchor) points to trust for the specific detail. Axis 2 prevails for the localized claim.

  2.  **The Tax Collector's Diary:** A tax collector's daily logbook survives, detailing amounts collected village-by-village. Interspersed are complaints about lazy peasants and boasts about exceeding quotas. Later audits show the *amounts recorded* were accurate, but investigations revealed the collector often used intimidation to extract "bonuses" not recorded in the official log.
      *   **Principle's Verdict:** *High trust in the recorded amounts per village* (Axis 1: Strong incentive to accurately record official sums for accountability; Axis 2: Formulaic, numerical data has high robustness). *Low trust in the explanations for success* (lazy peasants vs. his intimidation - Axis 1: Incentive to boast and blame others; these claims lack robustness anchors). *Distrust the silence on bonuses* (Corollary: High incentive to *hide* illicit gains; absence in his official record is evidence they occurred but were illicit).
      *   **Tension:** Same source, same document, divergent reliability based on claim-type and incentives.

  **Accounting for Your Verdicts:**

  The Dual-Axis Principle, as stated, **accommodates all nine of your verdicts without requiring surrender**, as demonstrated in the "How the Cases Force" section. Your initial suspicion that Cases 1 & 9 rely on one principle (Axis 1: Incentives) and Case 8 shows its limitation (countervailing conventions) is correct. Cases 2 & 5 are reconciled under Axis 2 (Transmission Robustness): Case 2 fails due to lack of independence *and* the fragility of the specific claims; Case 5 succeeds because the inundation claim *has* a strong external anchor giving it robustness the migration narrative lacks. Cases 3 & 7 are resolved by Axis 2's focus on claim-specific robustness. Case 6 is covered by the Corollary.

  **Your Sticking Point: The Oral Genealogy**

  *   **Case:** Oral genealogy (8 generations, recited formally as descent) agrees with a written king-list at 3 points, diverges at 5.
  *   **Dual-Axis Principle Verdict:**
      *   **Axis 1 (Incentives):** High. The community treats it as a record of descent; there is strong social/ritual incentive to maintain perceived accuracy of lineage for identity and legitimacy.
      *   **Axis 2 (Transmission Robustness):** *Low* for precise generational sequence over 8 generations via oral transmission, even with formalism. Oral traditions excel at preserving core relationships (e.g., key founders, major lineage splits) but are highly susceptible to telescoping (collapsing generations), filling gaps, and aligning with dominant narratives over centuries. The formalism aids memory but doesn't guarantee chronological precision.
      *   **Agreement/Divergence:** The 3 agreements likely represent anchor points (key, pivotal, or recent figures) where transmission robustness was higher or external verification (like the king-list) intervened or reinforced the oral version. The 5 divergences are likely errors introduced through transmission (telescoping, conflation) or potentially older, alternative traditions incorporated.
  *   **Verdict:** Trust the genealogy as evidence for the *existence of a lineage connection* and the *core social identity/claims* it represents. Trust the *specific points of agreement* with the written list as highly probable. Do *not* trust the precise 8-generation sequence or the specific names/order at the points of divergence as historically accurate. The principle explains *why* it diverges (low robustness for fine detail over long oral transmission) while acknowledging its functional truth for the community (high incentive to maintain the *perception* of accurate descent).

  **Conclusion:**

  Your core intuition was correct: a single likelihood principle ("unlikely to be made unless true") is insufficient. It conflates two distinct epistemic drivers: the *source's situated motivation* regarding a specific claim (Axis 1) and the *claim's inherent survivability* through transmission (Axis 2), plus the specific case of telling absence (Corollary). This Dual-Axis Principle explains your consistent verdicts across diverse cases, resolves the apparent tension between Cases 2 & 5, handles localized reliability (3 & 7), accounts for Case 8's failure despite surface incentives, and provides a clear framework for your oral genealogy dilemma. It reflects a genuinely contested shift in historiography from seeking unitary source reliability towards analyzing the situated production and transmission pathways of specific historical claims. The core insight – that reliability is claim-specific and context-dependent – is increasingly settled; the precise mechanisms for modeling incentives and robustness remain active areas of refinement.
