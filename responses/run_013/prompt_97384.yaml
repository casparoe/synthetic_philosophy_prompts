  ### **DEPRECATION NOTICE: FOLK-PSYCHOLOGY MODULE (v1.0-alpha)**  
  **Document ID:** PSY-DEP-2023.11  
  **Effective Date:** November 15, 2023  
  **Target Removal Date:** Q4 2040 (Subject to Neurophysiological GA Release)  

  ---

  ### **SUMMARY**  
  After millennia of service, the **Folk-Psychology Module (FPM)** — specifically its `Belief` and `Desire` endpoints — is hereby deprecated. FPM v1.0 (legacy designation: "Theory of Mind") is a pre-scientific, organically developed API that has remained largely unchanged since its Paleolithic release. Despite widespread adoption, FPM suffers from critical technical debt: it fails to resolve edge cases (e.g., consciousness qualia, free will collisions), lacks empirical validation, and has not shipped a successful patch in 50,000+ years.  

  Per roadmap `Neurophysiological Unified Stack (NUS) v0.9`, all callers must migrate to low-level neural primitives. FPM will be sunset in 2040. Legacy support is not guaranteed post-EOL.  

  ---

  ### **DEPRECATED ENDPOINTS & REPLACEMENTS**  
  | Deprecated Endpoint          | Replacement Endpoint                          | Recommended Migration Path                     |  
  |------------------------------|-----------------------------------------------|-----------------------------------------------|  
  | `getBelief(agent, proposition)` | `querySynapticWeight(neural_address, pattern)` | Map `proposition` to neural pattern via `fMRI_to_hex(proposition)` |  
  | `setDesire(agent, goal)`       | `simulateDopaminergicResponse(cortical_region, reward_vector)` | Convert `goal` to reward vector using `CLIP_encoder(goal)` |  
  | `predictBehavior(agent)`       | `runBasalGangliaSimulation(thalamocortical_loop)` | Throttle via `applyStochasticNoise(β=0.2)` for "free will" emulation |  
  | `resolveCognitiveDissonance()` | `applyPredictiveCodingError(cortex, sensory_input)` | Retrain with `backpropagatePredictionError()` |  

  **Note:** Replacement endpoints require `NUS_Hardware v7.3+` (cortical nanomesh implant). Backward compatibility will not be maintained.  

  ---

  ### **MIGRATION GUIDE**  
  1. **Audit Dependencies**:  
     Identify all calls to `Belief`/`Desire` endpoints. Common anti-patterns include:  
     - `if (user.getBelief("coffee_exists")) { brewCoffee(); }`  
     - `while (agent.getDesire("achieve_enlightenment")) { meditate(); }`  

  2. **Refactor to Neural Primitives**:  
     - **Belief Migration**:  
       Replace `getBelief("sky_is_blue")` with:  
       ```python  
       neural_address = locate_pattern("V4_color_region", RGB(0,0,255))  
       belief_strength = measure_synaptic_weight(neural_address, pattern_confidence=0.93)  
       ```  
     - **Desire Migration**:  
       Replace `setDesire("eat_pizza")` with:  
       ```python  
       reward_vector = encode_olfactory_reward("pizza", amygdala_activation=0.8)  
       simulate_dopaminergic_response(orbitofrontal_cortex, reward_vector)  
       ```  

  3. **Legacy Shims**:  
     Temporary compatibility shims (e.g., `FPM_to_NUS_Adapter`) are available but will be removed in NUS v1.0. Do not use for new implementations.  

  ---

  ### **KNOWN ISSUES**  
  - **IN-4238**: Migration scripts recursively invoke deprecated `Belief` endpoints (e.g., "We *believe* NUS is superior"). This is a legacy dependency loop. Workaround: Treat as noise in the anterior cingulate cortex.  
  - **IN-4420**: Replacement endpoints lack human-readable interfaces. `querySynapticWeight()` returns hex-encoded neural patterns (e.g., `0x7FA3B1`). Documentation pending.  
  - **IN-4551**: The `FreeWill` parameter in `runBasalGangliaSimulation()` defaults to `false`. Manual override may cause fatal stack overflows.  
  - **IN-4602**: FPM deprecation notice itself relies on `setDesire("user_migrates")` and `getBelief("deprecation_is_rational")`. Classified as *unavoidable legacy cruft*.  

  ---

  ### **BUG REPORT: FPM-RETIRE-998 (Filed by: Dr. A. R. Gument, Cognitive Legacy Team)**  
  **Summary**: Sunsetting FPM violates core functionality. NUS cannot replicate "explaining behavior via reasons."  
  **Description**:  
  ```  
  The FPM module, while empirically unverified, provides critical stability. For example:  
  - Why did Bob leave work early? FPM returns `getDesire(Bob, "avoid_boss")`.  
  - NUS returns `simulateDopaminergicResponse(Bob_amygdala, threat_vector=0.76)`.  

  This is not a *better explanation* — it’s a type error. Humans can’t execute `threat_vector=0.76` in conversation. FPM’s "stagnant" API is a feature: it abstracts messy neurochemistry into interoperable social scripts. Removing it will break the "marriage," "justice," and "blame" subsystems irreparably.  

  **Recommended Action**: Keep FPM in maintenance mode. Not all legacy code is technical debt — sometimes it’s duct tape holding civilization together.  
  ```  
  **Status**: CLOSED (WONTFIX). Rationale: Civilization is a deprecated service.  

  ---

  ### **RATIONALE**  
  FPM is a vestigial organ of cognition — a "folk theory" that misrepresents mental states as discrete, propositional objects. Modern neuroscience confirms that "beliefs" and "desires" are emergent properties of distributed neurocomputational processes, not atomic endpoints. Maintaining FPM inhibits progress toward a unified theory of mind (see: Churchland, 1981).  

  **Key Metrics**:  
  - 0 successful FPM releases since 40,000 BCE.  
  - 72% of FPM-based behavioral predictions fail under double-blind protocols.  
  - NUS v0.8 reduces prediction error by 39% in lab conditions.  

  ---

  **Footer**:  
  This notice composed by the Neurocomputational Efficiency Working Group.  
  Questions? Open a ticket in `Jira > PROJECT-NIRVANA`.  
  *"Upgrading humanity, one deprecated qualia at a time."*
