  The user describes several perspectives they've encountered: their supervisor's take on gains/losses leading to a "leveling up" problem, a friend's view that leveling-down is tied to population ethics, another's emphasis on ex ante vs. ex post approaches, and their own thoughts on priority weight, indifference to inequalities among the better off, and the welfare currency. They're overwhelmed and don't want to waste a year on the wrong angle. They need a ranked list of open questions with reasoning on priority, tractability, neglect, and what could resolve each.

