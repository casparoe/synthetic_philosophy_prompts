  Now, to rank these. The key is to identify what's upstream—foundational issues that affect others—and what's tractable for a solo researcher in a year. Also, consider which debates are played out versus underexplored. 

  Starting with ex ante vs. ex post: This seems fundamental. Prioritarianism must handle uncertainty to be useful in real-world decisions. If it collapses under ex ante approaches or becomes incoherent ex post, that could undermine the whole view. It's upstream because it shapes how gains/losses or population ethics are applied. For tractability, there's existing literature on decision theory; a solo researcher could model cases or find counterexamples. Neglected? Yes, as prioritarianism often assumes certainty. A breakthrough might show that one approach leads to absurdities, forcing a reevaluation.

  Next, the gains/losses framing: The supervisor's inversion is intriguing and directly challenges prioritarianism's core. If focusing on improvements leads to leveling up, that's a symmetry problem. It's upstream for the priority weight question—how we value gains depends on this framing. Tractability is high: no new math needed, just thought experiments. Neglected? Somewhat; Parfit's discussions touch on it, but not deeply. A counterexample showing unacceptable trade-offs could resolve this.

  Priority weight and scope: How steep should priority be, and does it apply only to the worst-off? This is downstream, as it depends on the ex ante/ex post choice and gains framing. If the view is ex post, the weight parameter matters more; if gains-focused, steep weights cause leveling up. Tractability is medium—conceptual work on what priority means. Neglected? Partly; Adler has tables, but the "scope" (indifference to better-off inequalities) is less discussed. A result linking steep weights to intuitive failures could advance this.

  Population ethics/person-affecting: The friend argues leveling-down only bites with certain population ethics commitments. But prioritarianism is often welfarist and person-affecting, so this might be a distraction. It's downstream because it assumes a prioritarian structure. Tractability is low—population ethics is a quagmire. Neglected? No, it's well-trodden. A move here would be recognizing that prioritarianism doesn't need to engage deeply with this unless forced.

  Currency of justice: Should it be welfare, claims, or desert? This is orthogonal. Prioritarianism is typically welfarist; switching currencies might make it a different theory. Downstream and possibly a separate project. Tractability varies, but it's broad. Neglected? Claims-based views exist, but not focused in this debate. Not the best for a year-long paper.

  The upstream issues are ex ante/ex post and gains/losses framing—they define how prioritarianism functions. These are tractable and somewhat neglected, especially the uncertainty aspect. Resolving one could make the others clearer. For example, if ex post prioritarianism handles uncertainty poorly, that elevates the ex ante approach, which might dissolve the gains/losses problem. Or if gains/losses lead to leveling up, that forces a rethink of the metric.

  The user's deeper needs: They want to avoid dead ends and contribute meaningfully. They might fear picking a topic that's either too niche or too saturated. By prioritizing ex ante/ex post and gains/losses, I'm steering them toward high-impact, manageable issues. Their anxiety about burning a year is valid, so emphasizing tractability and potential for breakthroughs is key. They also crave clarity on what's truly foundational versus derivative.
answer: |-
  Here’s a strategic ranking of the open questions in your corner of prioritarianism, ordered by upstream/downstream dependence, tractability, and potential for decisive progress. The goal is to maximize insight-per-effort and avoid rabbit holes. I’ll defend the ordering, flag what’s neglected, and note what could resolve each.

  ### **Ranked Agenda (with Reasoning)**
  1.  **The Ex Ante/Ex Post Fork**  
      **Why Upstream?** This is foundational. Prioritarianism *must* give coherent guidance under uncertainty to be a practical theory. If it collapses under ex ante calculation (becoming near-utilitarian) or lacks ex post justification for ex ante choices (the "veil of ignorance/gamble" problem), the entire project risks incoherence. It structures how gains/losses, priority weights, and even population ethics apply.  
      **Tractability:** High. Requires conceptual analysis + decision-theoretic modeling (no new formal machinery). You can construct clear gambles comparing ex ante welfare maximization vs. ex post prioritarian aggregation.  
      **Neglected?** Yes. Most debates assume certainty. The *interaction* of prioritarianism with risk/veils is underexplored (e.g., does the "priority" apply to expected welfare or realized outcomes?). Adler & Holtug touch on it, but no decisive treatment exists.  
      **What Would Move It?** A simple, devastating counterexample:  
      - *Ex Ante Collapse:* Show that under plausible risk, prioritarian weights flatten so much that it prescribes identical policies to utilitarianism in virtually all realistic cases.  
      - *Ex Post Indefensibility:* Construct a gamble where the ex post prioritarian outcome is clearly justifiable *only* by an ex ante reasoning that prioritarianism itself rejects. If you find either, this fork becomes the core issue.

  2.  **The Gains/Losses Framing & Its Inversion (Supervisor's Line)**  
      **Why Upstream?** This attacks the *core motivational intuition* of prioritarianism (helping the worse off matters more). If the view truly implies "leveling up" (massive losses to better-off for trivial gains to worst-off), it becomes a reductio ad absurdum *against* prioritarianism. It directly tests whether the view is coherent *as a theory of improvement*.  
      **Tractability:** Very High. Pure ethics/philosophy. Requires sharp thought experiments (no math needed). Compare: "Should we accept a policy causing 1 million affluent people to lose \$10,000 each to give \$1 to one destitute person?" Does prioritarianism *require* this if the weight is steep?  
      **Neglected?** Partially. Parfit mentions the inverse risk, but it’s rarely the *focus*. The debate usually centers on leveling-down, not leveling-up’s extremity. Your supervisor’s framing is a fresh angle.  
      **What Would Move It?** A **symmetry argument**: Show that *any* plausible prioritarian weighting function strong enough to avoid the "leveling-down is irrelevant" critique *inevitably* implies leveling-up in extreme gains/losses cases. If you establish this symmetry, it forces a major choice: abandon prioritarianism, accept leveling-up, or radically redefine the view (e.g., cap weights, shift currency).

  3.  **Priority Weight Parameter & Scope (Your "How Much" & "Indifference" Questions)**  
      **Why Downstream?** This depends *crucially* on resolving (1) & (2). The "right" weight and whether priority applies only to the worst-off or across the spectrum (avoiding indifference among the better-off) changes dramatically based on:  
      - *Ex Ante:* Weights might apply to expected welfare, making "scope" less distinct.  
      - *Ex Post:* Weights apply to outcomes, making steep weights riskier for leveling-up.  
      - *Gains/Losses:* A steep weight directly enables the inversion; a flat one makes prioritarianism inert.  
      **Tractability:** Medium-High. Involves parameter sensitivity analysis within a chosen framework (ex ante/ex post). Adler's "prioritarian tables" are a start.  
      **Neglected?** "Weight" is discussed (e.g., constant elasticity?), but "scope" (does priority fade above a threshold?) is less explored. Is prioritarianism only about the *tail* of disadvantage?  
      **What Would Move It?** Link it decisively to (2): Prove that **only bounded weights** (or **non-constant elasticity**) avoid leveling-up absurdities while retaining the core prioritarian impulse. This would reframe the parameter debate entirely.

  4.  **Population Ethics / Person-Affecting Restriction (Friend's Line)**  
      **Why Downstream?** The leveling-down objection *presupposes* fixed populations and compares identical people at different welfare levels. Prioritarianism is primarily a *fixed-population*, *welfarist* view. While leveling-down highlights a conflict with equality (a value it explicitly rejects), population ethics introduces distinct issues (e.g., the Non-Identity Problem, Mere Addition Paradox). Tackling this first distracts from prioritarianism's core claims about distributing fixed resources.  
      **Tractability:** Low. Population ethics is a notorious quagmire. Requires engaging with Parfit, Broome, Arrhenius – a massive undertaking with low chance of definitive progress solo in a year.  
      **Neglected?** No. The person-affecting view is widely debated. Linking it *specifically* to leveling-down within prioritarianism is less common, but unlikely to yield a breakthrough.  
      **What Would Move It?** Only if you could show prioritarianism *logically commits* to a specific (and problematic) solution to a major population ethics puzzle (e.g., the Repugnant Conclusion) *because* of its response to leveling-down. This seems unlikely.

  5.  **Currency of Justice (Welfare vs. Claims/Desert)**  
      **Why Orthogonal/Downstream?** Prioritarianism is fundamentally a *welfarist* view about *how to aggregate welfare*. Switching the currency (e.g., to claims or responsibility-adjusted desert) transforms it into a fundamentally different theory (e.g., a desert-based sufficientarianism or claims-prioritizing view). While important, this is less about resolving internal tensions within *prioritarianism* and more about choosing a rival framework.  
      **Tractability:** Medium, but broad. Requires defending a non-welfarist foundation – a whole other thesis.  
      **Neglected?** Claims-based views (e.g., Tomlin, Oberdiek) and desert-based sufficientarianism exist, but aren't usually analyzed *as* prioritarianism.  
      **What Would Move It?** Demonstrating that **only a non-welfarist currency** (e.g., claims) can resolve the leveling-up problem (from #2) *without* collapsing prioritarianism into something else. But this likely abandons core prioritarianism.

  ### **Crucial Insights & Avoiding Dead Ends**
  *   **The Core Tension:** Prioritarianism's vulnerability lies at the intersection of **weighted improvements under uncertainty**. (1) and (2) attack this directly. If prioritarianism can't handle uncertainty coherently or implies absurd trade-offs when focusing on gains/losses, the *motivation* for the view crumbles, regardless of weights or currency.
  *   **What's Verbal/Red Herring?**
      *   The "standard" leveling-down objection *is* largely defanged for prioritarianism, as you note. Debating it further is fruitless.
      *   Your friend's population ethics angle, while potentially connected, is likely a **red herring** *for your specific focus*. Leveling-down bites prioritarianism (if it does) in fixed-population cases. Don’t get sucked into the population vortex.
      *   "Indifference among the better off" might be partly **verbal**. Is it *indifference* or just *lesser priority*? The key question is *scope* (#3), downstream of the core mechanics.
  *   **The High-Value Target:** **Resolving the ex ante/ex post dilemma (1) decisively reframes the entire debate.** If ex ante prioritarianism collapses into utilitarianism, the view becomes irrelevant for real-world decisions. If ex post prioritarianism can't justify choices under a veil, it becomes practically incoherent. *This is the live wire.*
  *   **The Killer Counterexample (Your Goal):** Focus your year on crafting **twin counterexamples**:
      1.  An **uncertainty scenario** exposing the fatal flaw in either ex ante or ex post prioritarianism.
      2.  A **gains/losses scenario** demonstrating the unavoidable leveling-up absurdity under plausible prioritarian weights.
      Finding either would be a significant contribution. Finding both would define the next stage of the debate.

  **In short: Start with the knife-edge of uncertainty (Ex Ante vs. Ex Post). Simultaneously pressure-test the gains/losses inversion. Let these investigations dictate the relevance of priority weights/scope. Sidestep population ethics and currency shifts unless they become unavoidable consequences of your core findings.** This maximizes the chance of a decisive, publishable result within your year. Good luck!
