  ## STYLE GUIDE UPDATE: SECTION 13.7 — FIRST-PERSON BELIEF CONSTRUCTIONS (THE BELDEN RULE)

  **13.7.1 MAIN RULE:** Do not publish declarative sentences in straight news reporting where the grammatical subject "I" is directly coupled with the verb "believe" (or its conjugations "believes," "believed," etc.) when the object of that belief constitutes a claim of fact about the external world. This prohibition exists to prevent the accidental assertion of unverified claims under the guise of reporting personal conviction. (See historical note: Belden Memo, 1971, re: libel risk mitigation.)

  **13.7.2 SUB-RULES & CLARIFICATIONS:**

  1.  **The Core Prohibition:** Eliminate constructions where "I believe" introduces a factual claim (e.g., "I believe the mayor accepted kickbacks"). The phrase "I believe" functions as an assertion of the factual claim itself within the context of a news report, regardless of reporter intent. (Yes, even if the claim is subsequently proven true. The rule addresses form, not truth-value.)
  2.  **The Negative Contradiction:** Eliminate constructions where "I believe" introduces the *negation* of a factual claim (e.g., "The mayor accepted kickbacks, but I don't believe he did"). Such statements create an unacceptable internal contradiction within the sentence as presented to the reader. The factual assertion ("The mayor accepted kickbacks") remains published, while the reporter's stated disbelief introduces confusion about the paper's stance on that assertion. This holds *even if* the reporter intends only to signal their personal lack of confirmation.
  3.  **The False Belief:** Eliminate constructions where "I believe" introduces a factual claim that is explicitly stated *within the same sentence* to be false (e.g., "I believe the mayor accepted kickbacks, but he didn't"). This creates an explicit contradiction between the reporter's stated belief and the stated reality. Per Belden, the assertion inherent in "I believe" remains problematic independently.
  4.  **Permissible Forms:**
      *   **Third-Person Beliefs:** Statements attributing belief to a third party are permitted (e.g., "The prosecutor believes the mayor accepted kickbacks," "Residents believe the zoning board took a bribe"). This is simple reported speech/attribution.
      *   **Past Beliefs:** Constructions using "I believed" in contexts clearly framed as past reflection, recollection, or analysis (e.g., retrospectives, analytical pieces, columns clearly marked as opinion) are generally permissible. The past tense sufficiently distances the reporter's *current* stance and avoids the implication of asserting present fact. (See example 3 below).
      *   **Sports Desk Exemption:** Predictions or statements of confidence regarding future outcomes in clearly designated sports commentary or analysis sections (e.g., "I believe this team can go all the way") are permissible. These are understood as avowals of commitment to a viewpoint or prediction about potential futures, not as assertions of *current, verifiable fact* about the external world in a news context. This exemption is specific to sports prognostication and does not extend to other departments.^1

  **13.7.3 CORRECTED COPY EXAMPLES (Per Standard Corrections Format):**

  1.  **Original Draft:** "Councilor Evans claims the funds are missing. *I believe the zoning board took a bribe*."
      **Corrected:** "Councilor Evans claims the funds are missing. *She alleges the zoning board took a bribe*." (Per 13.7.2.1: Core Prohibition)
  2.  **Original Draft:** "The treasurer admitted to falsifying records. *I don't believe the mayor knew about it*."
      **Corrected:** "The treasurer admitted to falsifying records. *The mayor has stated he had no knowledge of the falsification*." (Per 13.7.2.2: Negative Contradiction. Alternative: Remove the second sentence if unverified.)
  3.  **Original Draft:** "*I believed the contract was awarded fairly*, but the investigation shows it was rigged."
      **Corrected:** "*Initial indications suggested the contract was awarded fairly*, but the investigation shows it was rigged." (Per 13.7.2.4: Permissible Forms/Past Beliefs. *Note: While "I believed..." might pass in a retrospective, recasting avoids potential ambiguity in a straight news follow-up.*)
  4.  **Original Draft:** "The bridge collapsed at 3:07 PM. *I believe it didn't collapse earlier*." (Submitted re: witness timeline conflict)
      **Corrected:** "The bridge collapsed at 3:07 PM. *Official reports confirm the collapse time as 3:07 PM*." (Per 13.7.2.2: Negative Contradiction applied to temporal claim. The first sentence asserts the time; the second expressed disbelief in an alternative time creates conflict.)^2

  **13.7.4 FREQUENTLY ASKED QUESTIONS (For Stringers & New Staff):**

  *   **Q: Why can't I just write "I believe..." to show I'm being careful or haven't fully confirmed something?**
      A: The phrase "I believe [Fact X]" functions, within the context of a news report, as the paper publishing "[Fact X]". Omitting "I believe" forces the necessary choice: either state the fact with appropriate attribution/evidence, or do not state it. Hedging through "I believe" does not absolve the paper of the assertion.
  *   **Q: What if I'm writing a first-person account, like being at a protest? Can I say what I believe I saw?**
      A: For straight news reports, describe what you observed using sensory details ("I saw smoke rising," "I heard chants of...") rather than beliefs about the event's meaning or cause ("I believe police provoked the crowd"). If the piece is clearly labeled as analysis or personal experience, consult the assigning editor regarding 13.7.2.4 (Past/Permissible contexts).
  *   **Q: The rule kills "I don't believe X" even when X is true and I just didn't know? Why?**
      A: Yes. Publishing "X happened" and "I don't believe X happened" in proximity creates a contradiction in the text presented to the reader. The paper cannot simultaneously assert X and publish a statement (the reporter's expressed disbelief) that directly undermines the assertion of X within the same report. State the fact (X happened), or omit your personal disbelief.
  *   **Q: Sports gets to use it for predictions. Can I use "I believe" for a political prediction or an economic forecast?**
      A: No. The sports exemption (13.7.2.4) is specific to that department's traditional commentary format regarding future athletic outcomes. It is not a general license for predictions elsewhere. Political or economic forecasts require attribution to sources, data, or must be clearly presented within an approved analysis/opinion framework without using the prohibited "I believe [future fact]" construction.

  ---

  **FOOTNOTES:**

  ^1 *Night Desk Note: This exemption remains logically inconsistent with the core justification of the Belden Rule. If "I believe they can win" isn't asserting a state of the external world (namely, the reporter's *actual* internal belief about future potential), what exactly *is* the Belden Rule prohibiting in other cases? The distinction feels entirely contextual, not grammatical. – J. Henderson, Night Editor*
  ^2 *Copy Chief's Note: This case (Example 4) remains particularly vexing. The reporter is attempting to affirm the stated collapse time by expressing disbelief in an alternative. However, the construction still publishes a statement ("I believe it didn't collapse earlier") that *appears* to contradict the factual assertion made moments before ("The bridge collapsed at 3:07 PM"). While logically distinct from asserting a falsehood, the perceived contradiction necessitates correction per the rule. Finding an elegant, rule-compliant way for a reporter to signal awareness of conflicting reports without using belief statements remains... elusive. Recasting using official sources or witness attribution is the safest path. Admittedly, the sports desk's ability to cleanly deploy "I believe" for predictions highlights a flexibility we struggle to apply consistently elsewhere.*
