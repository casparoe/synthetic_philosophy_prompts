answer: |-
  ## After-Dinner Remarks: The Burden-Shifting Magic of Subsidiarity

  [Raise glass] To Professor [Supervisor's Name]! Thirty years… thirty years of brilliant, challenging, occasionally *maddeningly* elusive scholarship on subsidiarity. You’ve guided countless students – myself included – deep into the thickets of federal systems, forcing us to ask the fundamental question: *Who should do what?* And yet… [wry smile]… I think we all know the Professor’s greatest trick was perhaps never quite letting the rabbit *fully* emerge from the hat when it came to pinning down a single, definitive meaning. Thank you, Professor, for teaching us that the most profound questions are often the ones that resist the simplest answers. It’s why we’re all here tonight.

  Now, looking around this room... we’ve got EU lawyers who could recite the subsidiarity protocol in their sleep – eight-week windows, reasoned opinions, the whole ‘early-warning system’ machinery. We’ve got a Swiss colleague for whom the magic number is eight cantons triggering a referendum on a federal law. We’ve got German constitutional expertise where the *Bundesrat* and the Federal Constitutional Court stand guard. We’ve got American perspectives where the bright line is ‘Thou Shalt Not Commandeer’ state officials. And then, crucially, we’ve got partners, former students, and family who, wisely, have spent their time on pursuits far removed from treaty articles and constitutional clauses! [Warm smile to the non-expert half].

  So, how to talk about the Professor’s life’s work without putting half the room to sleep or losing the other half? Let me try this: Think of subsidiarity not as a scientific test, but as a conversation. A very specific *kind* of conversation about power and responsibility. And the Professor’s genius, perhaps, was in showing us that the *real* magic trick of subsidiarity isn't finding the *right* level to act – it’s about deciding *who has to prove* their case.

  Take our mechanisms – the very ones you experts know so well:

  1.  **The EU:** A third of national parliaments shout "Subsidiarity Breach!" with their 'yellow card'. What happens? The Commission *reviews*. It can plough ahead, tweak the proposal, or withdraw it. Crucially? It just has to *give reasons*. The burden shifted *to them* to justify why Brussels, not the capitals or regions, *should* act. But who audits those reasons deeply? The final call on the "could the lower level have done it?" stays complex, often political.
  2.  **Switzerland:** Eight cantons ring the referendum bell on a federal law. A powerful brake! But what does the referendum *actually* test? It asks the people: "Do you *accept* this federal law?" It doesn’t scientifically determine if the cantons *could* have done it better. The burden shifted – now the *federal statute itself* needs popular approval. But the *underlying question* of optimal level? Deferred to the voters' broader judgment.
  3.  **Germany:** The *Bundesrat* represents the Länder, guarding the federal principle. The Constitutional Court stands ready. But when they strike down a law for violating federal competence? They aren't usually saying "The *Land* parliaments are empirically *better* at this specific environmental regulation." They're enforcing a procedural and constitutional boundary. The burden shifted – the federal government must prove it's acting within its designated lane. The *wisdom* of the lane itself? That’s presupposed.
  4.  **The USA:** The Supreme Court says, firmly, "Congress, you cannot *commandeer* state legislatures or executives to do federal work." A clear burden shift! But ask the Court if a federal environmental law is *wise* or if states *could* manage it better? They’ll usually demur: "That’s for Congress to decide, not us." The burden is on Congress not to overstep *procedurally*, not to prove the lower level is substantively *incapable*.

  **See the pattern?** Every single one of these brilliant, intricate mechanisms – protocols, referendums, second chambers, constitutional courts – they aren't actually *scientific instruments* measuring the "subsidiarity optimum." They are **burden-shifting devices.**

  They create a moment – a procedural hurdle – where the *presumption* is challenged. "Prove you belong at *this* level." But the *proof* required? The *depth* of the review? The *final arbiter* of whether the lower level *truly could* have done it? That’s deferred. Deferred to the Commission explaining itself, to the voters in a referendum, to the political compromises of the *Bundesrat*, to the political judgment of Congress, or to the interpretive lens of a court. The substantive judgment about *capacity* and *efficiency* is always lurking beneath the procedural surface, assumed but rarely definitively proven by the mechanism itself.

  *That’s* why the Professor’s work resonates so widely. It’s why a passionate centralizer in Brussels and a determined secessionist in Edinburgh can both pick up the Treaty, point to ‘subsidiarity’, and sincerely claim it supports *their* vision. Because the procedural principle *looks* neutral – "decide things closest to the citizen!" – but applying it *always* smuggles in a substantive, often contested, judgment about *who* is actually capable and trustworthy. It’s the ultimate political-philosophical sleight of hand.

  Professor [Supervisor's Name], you spent thirty years masterfully showing us the strings, the mirrors, the hidden compartments in this elaborate act. You never gave us a cheap, one-line definition because you understood subsidiarity’s deepest truth: it’s less about finding a perfect answer to "Who should do it?" and more about structuring the vital, never-ending argument over "Who must *justify* doing it?"

  **Summary:** Subsidiarity’s mechanisms don’t find the right level of government; they shift the burden of proving why a particular level should act, leaving the substantive judgment about capacity deferred and inherently contestable.

  [Raise glass again] To the maestro of federal complexity! May your retirement be filled with clarity… or at least, wonderfully interesting ambiguity. Cheers!

  ---

  **Confidence Assessment & Fact Check:**

  *   **Overall Confidence:** High. The core argument about burden-shifting and the nature of the mechanisms is a well-established scholarly interpretation within comparative federalism, aligning with your insightful premise.
  *   **EU (Highest Confidence):** The description of the "yellow card" procedure (Thresholds, Commission response options, requirement for reasoned opinions) is accurate per Protocol No 2 to the Lisbon Treaty (Articles 6 & 7). The burden-shifting interpretation is standard.
  *   **Germany (High Confidence):** The role of the *Bundesrat* and the Federal Constitutional Court (BVerfG) in policing federal competence boundaries is fundamental. The BVerfG focuses on competence allocation and procedural adherence ("competence-competence") rather than substituting its judgment on policy wisdom.
  *   **USA (High Confidence):** The anti-commandeering doctrine (*Printz v. United States*, *New York v. United States*) is accurately described. The Court's refusal to audit the substantive wisdom of federal laws within their enumerated powers (absent specific constitutional violations) is settled doctrine.
  *   **Switzerland (Moderate Confidence - The Shakiest):** The mechanism described is essentially correct: federal statutes can be challenged via a facultative referendum if 50,000 citizens or 8 cantons demand it within 100 days (Art. 141 Federal Constitution). The *effect* is indeed a popular vote on the law itself. **Where confidence dips slightly:** While the *trigger* by 8 cantons shifts the burden to the *law* needing approval, characterizing it *solely* as a burden-shift on the *subsidiarity question* might be slightly more nuanced in Swiss discourse. The referendum directly challenges the *acceptability* of the federal law, which implicitly includes judgments about federal overreach (subsidiarity), but also potentially about the law's substance, cost, etc. The burden-shift framing *holds*, but the Swiss system's direct democracy element makes the "deferred judgment" point slightly less purely procedural than the others. The core claim – that it doesn't *test* the subsidiarity optimum scientifically but creates a political hurdle – remains valid.
