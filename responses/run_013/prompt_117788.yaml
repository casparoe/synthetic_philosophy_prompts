prompt: |-
  I am a professor of philosophy, and next month I have to run a single seventy-five-minute session in our department's interdisciplinary undergraduate seminar — non-majors, mixed years — on whether everyday conventions such as tipping, queueing and jaywalking impose obligations rather than mere expectations, and on whether a visitor is bound by the conventions of the place she is visiting. I do not want the explanation itself. I want the plan for delivering it, and I want it to be exact about what depends on what.

  The session has to install apparatus the students will not bring with them. I want them to separate three grounds on which a breach of a convention can be criticised: the costs it imposes on identifiable others; the reliance it defeats, where others have arranged their conduct around the expectation; and the slight it conveys, understood as a refusal of membership or of the respect the practice is taken to express. The three are independent — a breach can impose real costs and carry no slight, and can carry a slight while costing no one anything — and I want that independence to be visible to them rather than merely asserted. Keep separate from all three the further question of standing: who is entitled to object to a breach, and in what register. The visitor question should arrive late, as the discovery that a visitor's obligation and a local's standing to object can come apart in both directions, and not as an occasion for observing that customs differ.

  So: give me the sequence of components, with the dependency that fixes each placement. Then the example that should carry the session. I am inclined toward queueing, and I want to be told whether that is right, what the example must have — a breach that is visible, cheap to avoid, and not already answered by a statute — and what it must lack; I take jaywalking to be disqualified because the law does the students' thinking for them, and tipping because the absent server and the wage structure will swallow the session in distributive questions. Then the misconceptions, in the order the room will produce them — the students will arrive regarding all of this as etiquette, beneath philosophical notice — and I expect the conflation of arbitrariness of content with optionality of compliance, the assumption that conventional and moral are exclusive categories, the belief that the law settles the matter, the thought that the visitor is simply exempt, and the inference that a convention binds because of what would happen if everyone broke it; for each, the precise point in the sequence at which it should be headed off. Then the single question I should ask at the end, chosen so that the answer separates a student who has the three grounds and the standing distinction from one who has merely acquired the opinion that conventions matter. Then what I should refuse to explain at this level, and say that I am refusing it. Several students in the room are international, so the visitor question is not hypothetical for them; the plan needs to keep it philosophical without turning anyone into a specimen and without letting the discussion collapse into the observation that customs differ. No readings, no citations.
reasoning: |-
  Okay, let me break down the philosophy professor's request. They need a precise 75-minute session plan about conventions like tipping, queueing and jaywalking, focusing on obligation versus expectation. The key requirements are: installing analytical apparatus, separating three critique grounds (costs, reliance, slight), handling standing/visitor questions carefully, choosing the right example, anticipating misconceptions, and ending with a diagnostic question.

  First, I need to understand the core framework they want to establish. The three independent critique grounds are crucial: (1) material costs to others, (2) defeated reliance where people adjusted behavior based on expectations, and (3) symbolic slight as refusal of membership/respect. These must be demonstrated as separable - a breach could involve any combination. Then comes the standing question: who can object and how. The visitor case should reveal how obligation and standing can diverge.

  Queueing seems ideal as the central example. Unlike jaywalking (legal overlay) or tipping (wage debates), queueing offers clean visibility: breaches are obvious, avoidance is easy, and there's no statute confusing matters. It perfectly isolates conventional obligation - no server to tip, no traffic laws to reference. The queue-cutter imposes clear costs (time loss), defeats reliance (people expect order), and conveys slight (disrespect). Yet crucially, these elements can be teased apart through variations.

  For timing, I'll map the 75 minutes tightly. Opening hook (5 min) with a queue-cutting scenario. Then apparatus building (35 min total) with each critique ground developed sequentially through queueing variations, showing independence. Standing discussion (15 min) follows naturally from the third ground (slight). Visitor application (15 min) comes last, demonstrating obligation/standing divergence. Final diagnostic question (5 min) to test understanding.

  Misconceptions must be anticipated at specific points: early dismissal as "just etiquette" countered during the hook; conflation of arbitrariness with optionality addressed when introducing conventions; law/ethics false dichotomy handled during reliance; visitor exemption myth busted in the dedicated segment; and "if-everyone" fallacy prevented when distinguishing the three grounds.

  The international student consideration is vital. By keeping visitor analysis philosophical - focusing on obligation/standing mechanics rather than cultural comparisons - we avoid specimen dynamics. The queueing example itself is universal enough to prevent "customs differ" digressions.

  Endgame needs precision: the diagnostic question should force application of all three grounds plus standing. Something like "Could there be a case where a local is obligated to queue but lacks standing to criticize a visitor who cuts?" requires understanding all moving parts. And we'll explicitly refuse deeper meta-ethical justifications - that's beyond scope.

  Now structuring the flow: each segment's placement depends on prior foundations. You can't show cost/reliance independence before defining them. Standing relies on understanding slight as membership-refusal. Visitor cases need all prior apparatus. Example variations must progress logically to isolate each element. Every choice chains to the next.
answer: |-
  Here is the exact sequence plan for your 75-minute session, designed to build dependencies logically and preempt misconceptions at critical points. Queueing is the correct core example (reasons detailed below).

  **Session Sequence (75 mins Total) & Dependencies:**

  1.  **Hook & Problem Framing: The Queue-Cutter (5 mins)**
      *   **Action:** Present a vivid scenario: A visitor in a country with strong queueing norms (e.g., UK, Japan) deliberately cuts a long line at a busy bus stop. Locals are visibly annoyed but say nothing. Ask: "Is the cutter doing anything *wrong*? If so, *why* exactly? What reasons could locals have for objecting?"
      *   **Dependency:** Starts immediately with a concrete, non-legal example to engage intuition and surface initial reactions ("rude," "unfair"). Avoids abstract definition.
      *   **Preempts Misconception 1 (Etiquette/Beneath Philosophy):** Immediately frame the *why* question as probing the nature of obligation, social coordination, and respect – core philosophical territory. Contrast "just rude" with "morally problematic" to elevate the discussion.

  2.  **Apparatus Installation: The Three Grounds (35 mins Total - *Builds directly from Hook*)**
      *   **A. Costs Imposed (10 mins)**
          *   **Action:** Analyze the queue-cutter: Who bears a cost? (Each person behind them waits longer – measurable time loss). What kind of cost? (Material, tangible). Is *this* why it's wrong? Imagine a variation: Cutter cuts in front of Person #1 in a very short queue where the wait increase for others is negligible (seconds). Does the wrongness disappear? (Likely not – cost isn't sufficient/necessary for wrongness).
          *   **Dependency:** Builds directly from the concrete scenario in the Hook. Uses variation to isolate "costs" as a factor.
          *   **Key Point:** Costs matter, but a breach can be wrong even without significant costs. Costs alone don't fully explain the obligation.
      *   **B. Defeated Reliance (10 mins)**
          *   **Action:** Return to the original scenario. Why were people standing in line? (Mutual expectation of order/fairness). How did they rely? (Arranged their time/position based on the expectation others would queue). The cutter defeats this reliance. Imagine a *new* bus stop, no established queue, just a crowd forming. Someone pushes to the front. Is this *as* wrong? (Likely less – weaker/shared reliance). Contrast with a known, stable queue.
          *   **Dependency:** Builds on the established scenario and the realization that cost alone isn't enough. Introduces the *social coordination* function of conventions. Uses variation (new crowd) to isolate "reliance".
          *   **Preempts Misconception 2 (Law Settles It):** Emphasize this is about *social* expectation and reliance, not legal requirement (queueing usually isn't legislated). Law is distinct.
          *   **Preempts Misconception 3 (Conventional vs Moral Exclusive):** Show how defeating legitimate reliance *is* a moral consideration (disrupting fair cooperation).
      *   **C. Conveyed Slight (15 mins)**
          *   **Action:** Return to original cutter. *Why* the annoyance beyond time cost? What does the act *express*? (Disregard for others, rejection of the shared rule, assertion of superiority). Frame "slight" as a refusal of membership in the cooperative scheme or disrespect for the mutual respect the practice embodies. Imagine a variation: Someone accidentally "cuts" due to confusion (language barrier, unclear line end). Locals might explain, not get angry. Why? (No slight intended/interpreted). Contrast deliberate cutting.
          *   **Dependency:** Builds on the inadequacy of costs/reliance alone revealed in A & B. Relies on the intuitive reaction of "disrespect" surfaced in the Hook and sharpened by the reliance discussion. Uses variation (accidental cut) to isolate "slight" as intentional meaning.
          *   **Key Point:** Slight is about symbolic meaning and relationship to the community/practice, distinct from tangible costs or disrupted plans. A breach *can* impose costs without slight (e.g., unknowingly breaking an obscure rule) and convey slight without costs (e.g., a very minor, deliberate breach solely to make a point).

  3.  **Introducing Standing: Who Can Complain? (10 mins - *Builds directly from Ground C*)**
      *   **Action:** Focus on the "slight" ground. Who is *wronged* by the slight? (The group whose membership/respect is refused). Who has *standing* to object on *this* ground? (Primarily members of the community bound by/sharing the convention). Contrast: Could a tourist from a non-queuing culture rightly object *on grounds of slight*? (Likely not – they aren't part of the membership being refused). Could they object on *cost* or *reliance* grounds if affected? (Yes).
      *   **Dependency:** *Crucially depends* on the establishment of "slight" as a distinct ground tied to community membership/respect. Standing flows naturally from understanding *what kind* of wrong the slight constitutes.
      *   **Key Point:** Standing depends on *the ground of objection*. Locals have standing on all three grounds (if affected by cost/reliance; inherently for slight). Others only have standing if affected by cost/reliance.

  4.  **The Visitor Question: Obligation vs. Standing (15 mins - *Builds on ALL prior: Grounds A-C & Standing*)**
      *   **Action:** Apply the apparatus to the visitor. Is the *visitor* obligated to queue?
          *   *Cost/Reliance:* Yes, if their breach imposes costs/defeats reliance (which queue-cutting usually does). Their status as a visitor doesn't negate this harm.
          *   *Slight:* More complex. Can a visitor "refuse membership" they never had? Perhaps less inherently, but *deliberate* breach might still express disrespect *for the locals and their practice*. However, locals' *standing* to object based on slight *might* be weaker/more nuanced against a non-member.
      *   **Reveal the Divergence:**
          *   Obligation (Cost/Reliance) can bind the visitor *even if* locals' standing to object on *slight* grounds is attenuated.
          *   Locals retain strong standing to object on cost/reliance grounds to the visitor.
      *   **Dependency:** *Requires* the clear separation of the three grounds and the concept of standing. Shows how the visitor case makes salient the potential independence of obligation (especially cost/reliance-based) from the specific standing tied to community membership (slight-based).
      *   **Prevents Collapse into "Customs Differ":** Focus stays on the *structure* of obligation/standing using the apparatus, not listing differences. The international students' experience is *data* for the philosophical analysis (e.g., "Did you feel obligated? On what grounds? Did you feel locals had standing to object?"), not the topic itself.
      *   **Preempts Misconception 4 (Visitor Exempt):** Clearly shows obligation (via cost/reliance) applies regardless of visitor status. Exemption, if any, is limited and nuanced (potentially regarding slight).
      *   **Preempts Misconception 5 (If Everyone...):** Ground obligation in the *actual* costs/reliance/slight of the *actual* breach, not a hypothetical universalization. Ask: "Is the single cutter wrong *because* if everyone did it chaos ensues? Or is it wrong because of the specific harm/disrespect *they* cause *now*?" Anchor in the three grounds.

  5.  **Diagnostic Closing Question (5 mins - *Tests integration of Grounds A-C & Standing*)**
      *   **Question:** "Imagine a local deliberately cuts a very short queue where the time cost to others is truly negligible (seconds), and they do it solely because they feel entitled. Could this still be criticizable? If so, *on what specific ground(s)*, and *who* would have standing to criticize them on that ground?"
      *   **Why it Separates Understanding:**
          *   A student who merely "gets it" might say "Yes, it's rude" or vaguely reference "the rule."
          *   A student who has internalized the apparatus will: Identify the *lack* of significant Cost. Identify the *defeat of Reliance* (undermining the shared expectation). Identify the *Slight* (deliberate refusal of membership/respect). Note that fellow locals have standing on *both* Reliance and Slight grounds. They articulate the *specific, independent* grounds and corresponding standing.

  **Why Queueing is the Right Example (Replaces Tipping/Jaywalking):**

  *   **Must Haves:**
      *   **Visible Breach:** Cutting is obvious and public.
      *   **Cheap to Avoid:** Simply joining the end is straightforward.
      *   **No Statute Answer:** Rarely legally mandated, isolating conventional obligation.
      *   **Clear Costs:** Quantifiable time loss for identifiable others.
      *   **Clear Reliance:** People visibly order themselves based on the expectation.
      *   **Clear Slight Potential:** Easily interpreted as disrespect/entitlement.
      *   **Visitor Applicability:** Intuitive context for the visitor question.
  *   **What it Lacks (Advantageously):**
      *   **Distributive Justice Complications:** Unlike tipping, no underlying wage debate or invisible beneficiary.
      *   **Legal Overlay:** Unlike jaywalking, not typically governed by law, forcing focus on convention.
      *   **Ambiguity in Harm:** Unlike some conventions, harms (time cost, frustration, disrespect) are relatively clear and relatable.

  **What to Refuse to Explain (State Explicitly):**

  *   **Refuse:** "We are *not* going to delve into the deeper meta-ethical justifications *why* costs, defeated reliance, or conveying a slight generate obligations or make something wrong. That's a crucial but distinct level of philosophical inquiry about the foundations of morality and sociality. Today, we are mapping the *structure* of conventional obligation and criticism – identifying these distinct grounds and how they operate, *assuming* they can be reasons for criticism. We're installing the apparatus, not building the factory that makes its parts."

  **Key to Flow:** Maintain tight focus on the queueing example and its variations. Use board work to map the three grounds, their independence (via the variations), standing, and then the visitor application. Constantly refer back to the concrete case. Shut down digressions into comparative custom lists or deep meta-ethics by redirecting to the structure: "Interesting point about differing customs, but let's apply our framework: *Given* this convention exists here, what grounds for obligation/criticism might apply, and to whom?"
