          If not, you gain $P.

          This is equivalent to: 
              You risk $ (1-P) to win $P? Because if the event happens, you lose (1-P) [because you get P and then have to pay 1, so net loss 1-P]? 

          Actually, when you sell a contract, you get $P now. If the event happens, you have to pay $1, so your net loss is $1 - P. But note, you already have the $P, so the loss is $1 but you offset by having received $P? 

          Alternatively, the net change in bankroll:
              If event: you lose (1-P) ? [because you had P and then paid 1, so net change: - (1-P) relative to not having done the trade?]
              If not: you gain P.

          So the net odds: you risk (1-P) to win P. So b = P / (1-P) ?

          Then the Kelly fraction for shorting (if you think the true probability is p, and p < P) is:

              f* = [ (P/(1-P)) * (1-p) - p ] / [ P/(1-P) ] 
                 = [ (P(1-p)/(1-P)) - p ] * (1-P)/P
                 = (P(1-p) - p(1-P)) / P
                 = (P - P p - p + P p) / P
                 = (P - p) / P

          So f* = (P - p) / P   [for shorting]

          Then we would adjust similarly: confidence, ruin constraint, and exposure.

          But we didn't build that into the procedure.

   So, to summarize:

     The procedure is for buying only. It has steps to adjust for your confidence, to avoid ruin, and to limit exposure to a theme. We run through the examples and show it in action.

     Remember: the goal of Kelly is to maximize the long-term growth of your bankroll, and it avoids ruin by not betting too much. But in your tournament, you have a fixed end (end of semester) and a ruin constraint ($5). The procedure respects the ruin constraint and uses the theme cap to avoid putting too much on correlated events.

     Use it, but be aware of its limitations.

     And if you are behind and need to catch up, you might decide to take more risk. But that's a human judgment.

     Good luck!
