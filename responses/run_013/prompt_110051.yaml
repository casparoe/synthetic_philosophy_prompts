  ### Kelly Betting Decision Procedure for Prediction Markets

  Here's a step-by-step checklist to run before each bet. It balances Kelly principles with your real-world constraints (top 3 finish, $5 minimum, correlations, uncertainty). Use it in order—stop if any step says "no bet."

  ---

  #### **0. Setup (Do Once Per Week)**
  - **Calculate current bankroll (B)**: Total cash you have right now.
  - **Identify correlated themes**: Group similar markets (e.g., "football playoffs," "school board votes"). Assign each to a theme.
  - **Set max exposure per theme**: Never risk >20% of B on one theme (e.g., all football-related bets combined ≤ 0.2B).

  ---

  #### **1. The Market Opportunity**
  - **Market price (P)**: Current price of the contract ($0.01 to $0.99).
  - **Your probability (p)**: Your estimate of true probability (0.01 to 0.99).  
    *If you can’t assign a number, skip the bet. No vibes!*
  - **Confidence level**:  
    - **High**: Solid evidence (e.g., insider info, data).  
    - **Medium**: Educated guess.  
    - **Low**: Hunch/gut feeling.  
    *If "low" and P is close to 0.5, skip—vibes aren’t worth it.*

  #### **2. Edge Check**
  - **Is p > P?** (for buying "yes" contracts)  
    - **No → Stop**. Only bet if you see value. (Shorting not covered here.)  
    - **Yes → Proceed**.

  #### **3. Calculate Raw Kelly Fraction**
  - **Formula**: \( f_{\text{raw}} = \frac{p - P}{1 - P} \)  
    *Example*: p = 0.8, P = 0.3 → \( f_{\text{raw}} = \frac{0.8 - 0.3}{1 - 0.3} = 0.714 \) (71.4% of B).

  #### **4. Confidence Adjustment**
  - **Apply discount**:  
    - **High confidence**: \( f_{\text{adj}} = f_{\text{raw}} \)  
    - **Medium**: \( f_{\text{adj}} = \frac{f_{\text{raw}}}{2} \)  
    - **Low**: \( f_{\text{adj}} = \frac{f_{\text{raw}}}{4} \)  
    *This protects against overconfidence in your p.*

  #### **5. Ruin Constraint**
  - **Max allowed**: \( f_{\text{max}} = 1 - \frac{5}{B} \)  
    *Example*: B = $100 → \( f_{\text{max}} = 1 - 0.05 = 0.95 \).  
  - **Apply**: \( f_{\text{adj}} = \min(f_{\text{adj}}, f_{\text{max}}) \).  
    *Never risk going below $5.*

  #### **6. Correlation Check**
  - **Identify theme**: What group does this market belong to? (e.g., "football")  
  - **Current exposure (R)**: Total $ already risked in this theme.  
  - **Remaining room**: \( \text{room} = \max(0,  \, 0.2B - R) \)  
  - **Apply**: \( f_{\text{adj}} = \min\left(f_{\text{adj}}, \, \frac{\text{room}}{B}\right) \)  
    *Prevents overbetting correlated outcomes.*

  #### **7. Sanity Check**
  - **Minimum bet**: If \( f_{\text{adj}} \times B < P \), **stop** (can’t afford 1 contract).  
  - **Maximum cap**: If \( f_{\text{adj}} > 0.5 \), ask: *"Would I be embarrassed explaining this bet to my math teacher?"*  
    - **Yes →** Set \( f_{\text{adj}} = 0.5 \).  
    - **No →** Proceed.  
    *Kelly can suggest extreme bets—this adds a behavioral anchor.*

  #### **8. Place Bet**
  - **Contracts to buy**: \( n = \left\lfloor \frac{f_{\text{adj}} \times B}{P} \right\rfloor \) (round down).  
  - **Update bankroll**: New B = Old B - (n × P).  
  - **Update exposure**: Add (n × P) to R for this theme.

  ---

  ### Worked Examples

  #### **Example 1: High-Conviction Opportunity**  
  - **Market**: "School board votes yes on new schedule."  
  - **B** = $100, **P** = 0.3, **p** = 0.8 (insider info → **high confidence**).  
  - **Theme**: "School board," no prior bets → **R** = $0.  
  - **Steps**:  
    1. Edge: 0.8 > 0.3 ✅  
    2. \( f_{\text{raw}} = \frac{0.8 - 0.3}{1 - 0.3} = 0.714 \)  
    3. Confidence: high → \( f_{\text{adj}} = 0.714 \)  
    4. Ruin: \( f_{\text{max}} = 1 - \frac{5}{100} = 0.95 \) → still 0.714  
    5. Correlation: room = 0.2×100 - 0 = $20 → \( f_{\text{adj}} = \min(0.714, 0.2) = 0.2 \)  
    6. Sanity: 0.2 < 0.5 → OK  
    7. Contracts: \( n = \left\lfloor \frac{0.2 \times 100}{0.3} \right\rfloor = 66 \) (cost $19.80)  
  - **Result**: Bet $19.80 on 66 contracts.  
  - **Why you’ll hate this**: Raw Kelly says bet 71.4%, but correlation cap forces 20% (max theme exposure). *Protects you if your insider info is wrong and the whole school board theme collapses.*

  ---

  #### **Example 2: Correlated Markets**  
  - **Market 1**: "Football team makes playoffs" (P = 0.6, p = 0.9, **high confidence**).  
  - **Market 2**: "Coach gets fired" (P = 0.5, p = 0.2, **medium confidence**).  
  - **Theme**: "Football" for both.  
  - **After Market 1**:  
    - Bet $19.80 (as above), B = $80.20, R = $19.80.  
  - **Market 2 Steps**:  
    1. Edge: 0.2 < 0.5 → **no bet** (should short, but procedure skips shorts).  
    *If you insist on buying "no" (not recommended):*  
    - p = 0.8 (for "no"), P = 0.5 → \( f_{\text{raw}} = \frac{0.8 - 0.5}{1 - 0.5} = 0.6 \)  
    - Medium confidence → \( f_{\text{adj}} = 0.3 \)  
    - Ruin: \( f_{\text{max}} = 1 - \frac{5}{80.20} ≈ 0.938 \)  
    - Correlation: room = (0.2×80.20) - 19.80 = **$0** → \( f_{\text{adj}} = 0 \)  
  - **Result**: No bet on Market 2.  
  - **Why**: Already used 20% exposure on football. Betting more amplifies risk (if team loses playoffs, coach likely stays → both bets lose).

  ---

  #### **Example 3: Cheap Longshot**  
  - **Market**: "Principal resigns" (P = 0.05, p = 0.15, rumor → **low confidence**).  
  - **B** = $100, **Theme**: "Principal," R = $0.  
  - **Steps**:  
    1. Edge: 0.15 > 0.05 ✅  
    2. \( f_{\text{raw}} = \frac{0.15 - 0.05}{1 - 0.05} ≈ 0.105 \)  
    3. Low confidence → \( f_{\text{adj}} = 0.105 / 4 ≈ 0.026 \)  
    4. Ruin: \( f_{\text{max}} = 0.95 \) → still 0.026  
    5. Correlation: room = $20 → \( f_{\text{adj}} = 0.026 \)  
    6. Sanity: 0.026 < 0.5 → OK  
    7. Contracts: \( n = \left\lfloor \frac{0.026 \times 100}{0.05} \right\rfloor = 52 \) (cost $2.60)  
  - **Result**: Bet $2.60 on 52 contracts.  
  - **Why**: Tiny bet (2.6% of B) fits Kelly—longshots are worth microscopic bets if priced wrong.

  ---

  ### What This Procedure Can’t Do
  1. **Beat your rival**: Designed for *survival + steady growth*, not aggression. If you’re behind and need YOLO bets to catch up, this won’t help.  
  2. **Value judgments**: If "probability" is really ethics (e.g., "will the new policy be fair?"), skip—there’s no number.  
  3. **Shorting**: Only handles buying "yes" contracts. For shorting, use a separate rule.  
  4. **Endgame optimization**: Prioritizes *not busting* over *top 3 finish*. Near semester end, you might need to adapt.  
  5. **Market impact**: If your $19.80 bet moves prices, recalculate P.

  ### Core Philosophy
  Kelly prevents blowups by sizing bets geometrically:  
  - **Bet too big?** One loss cripples you (even on +EV bets).  
  - **Bet too small?** Leave growth on the table.  
  This procedure forces discipline so you survive to compete. Use it—it’s better than getting "wrecked."
