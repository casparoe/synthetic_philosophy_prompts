  Hey, so I'm a junior in high school and I'm the treasurer of our prediction market club. We use fake money, but the top three people at the end of the semester get actual gift cards, so it's not totally pointless. Every week there's like 10 new binary markets -- 'will the school board vote yes on the new schedule,' 'will the football team make playoffs,' 'will the principal resign,' stuff like that. Contracts pay $1 if yes and $0 if no, and the price is basically the market's implied probability.

  I keep getting wrecked because I bet way too much on stuff I'm sure about and then one upset wipes me out, or I bet tiny on stuff I actually know alot about. Someone told me I should look into Kelly betting and 'geometric rationality' but when I googled it I got a bunch of formulas and no actual plan. Can you turn it into a decision procedure I can actually run before each bet? Like a checklist or a flowchart in words, with the questions in order, what counts as a good enough answer to each, where the procedure just says 'no, don't bet,' and where it says 'this is a judgment call, ask a human' (probably me, I guess).

  I usually have like 10 minutes before the market closes to decide, and I'm doing this on my phone in the hallway, so it has to be usable without a spreadsheet. I'm not a math person but I can do algebra if you show me the formula. Also no one has to sign off on my bets, but if I drop below $5 I'm basically out of the running, so that's the real constraint.

  A few things it has to handle:

  - I never actually know the true probability. I have a hunch, sometimes a pretty good one, sometimes it's basically a vibe. So the procedure needs a step for 'how confident am I in my own number,' and it should say what to do when the honest answer is 'not very.'
  - Some of the markets are obviously correlated. If the football team makes playoffs, the coach probably doesn't get fired. If I'm already betting on one, how does that change the size of the other? I don't want to accidentally bet the same opinion three times.
  - The club rule is that if you go below $5 you're out, and at the end it's top 3 who get prizes, not highest average or whatever. So my real goal isnt 'maximize expected log bankroll,' it's 'finish in the top 3 without busting.' I know that breaks the usual assumptions, but I need the procedure to at least tell me when I'm outside the theory's happy path.
  - Sometimes the formula says bet a huge fraction and it feels insane. I want the procedure to have a sanity check that isn't just 'trust the math' and also isn't just 'chicken out.'
  - I heard the whole point of Kelly is something about your bankroll growing geometrically over time and not just expected value, and that if you bet too big you eventually lose everything even if every bet is +EV. Is that right? If so, build the procedure around that idea, because that's the part I actually care about.

  Then run it on three cases: (1) a market where I think the price is way off and I have a solid reason, (2) two correlated markets where I want to bet both, and (3) a cheap longshot that would be fun to hit but I'm probably wrong about. For at least one of them, give me the answer I won't like, and say why the procedure gives it anyway.

  Also, be honest at the end about what the procedure cant do. Like, if the real issue is that I care more about beating my friend than about the gift card, or if the 'probability' is really a value judgment, just say so instead of pretending there's a number. And please don't give me a reading list or citations, I don't have time for that and I can't search stuff at school anyway. Just the procedure, the questions, and the worked examples.
