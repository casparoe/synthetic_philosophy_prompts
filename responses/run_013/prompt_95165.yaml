prompt: |-
  I have been collecting my own verdicts about identity statements and would like to know what principle, if any, they add up to. I am not asking for a survey of the literature, a reading list, or the names of positions to look up; I want the principle that fits my verdicts, stated precisely enough to be applied. I have invented the names below so that we are not working with the well-worn examples.

  (i) A reader of mine loved a novel by Celia Marsh and knows nothing of its author beyond the name on the cover. She has also read a biography of a woman called Marian Halloway and knows nothing of the biographee beyond that name. She has never had occasion to connect the two. When she learns that Marsh was Halloway, I say she has learned something about a person, not something about two names. If you told her that the discovery was really about words, she would think you had missed the point of her surprise.

  (ii) Ten minutes later, in possession of the same fact, the sentence Marsh was Halloway has gone flat for her; it now does what Halloway was Halloway does. I still want to say the sentence says the same thing in both moments: it is true in exactly the same circumstances, and it was true before she learned it. So informativeness is not part of what the sentence says. (I have a stubborn impulse to say that the two moments contain different sentences. I think the impulse is indefensible, but I would like it addressed rather than ignored.)

  (iii) A colleague is known at her office as Dr. Vance and at her climbing gym as Ruth. A new hire has heard both names, has no beliefs that link them and none that keep them apart — two names, no pictures behind either. When she learns that Vance is Ruth, I say she has learned something, and that her earlier assumption that there were two people was false rather than meaningless. Note that there was no descriptive content in either name for the discovery to trade on: nothing she knew about Vance and nothing she knew about Ruth that could have been compared.

  (iv) A third acquaintance is certain that Marsh wrote novels and nothing else and that Halloway wrote essays and nothing else — both false of the one woman, who wrote both. For her, Marsh was Halloway is informative, and I say still true: her false background does not make the sentence false, and does not make her surprise fraudulent. But her surprise is a different thing from the reader's in (i), and I want to know what the difference is.

  (v) A traveller has been calling a town Ashby for a week, having seen the name on the station sign. Asked what Ashby means to her, she would say the town with the cathedral, and the cathedral is in the next town over. I say that Ashby on her lips names the town she has been in all week, not the town with the cathedral: a false description does not fix what she is talking about. But I also say that if someone told her that Ashby is the town with the cathedral, she would learn nothing whatever — the sentence would merely rehearse her own error, and would be false into the bargain.

  (vi) Imagine someone who knows every fact about the woman in question — her life, her writing, the biography, the novel, all of it — but has never been told which of the two names attaches to her. I say Marsh was Halloway would be news to this person, and news about the names. Set beside (i), where I said the discovery was about a person and not about words, I cannot see how to hold both, and I would like to be told which to give up.

  (vii) I am also convinced that if Marsh was Halloway is true, it could not have been false: there is no possible world in which the author of the novel and the subject of the biography are two people and both are that woman. So the principle must explain the informativeness of a sentence that could not have been otherwise.

  Left to myself, I would say this: a is b is true just when the two names name the same thing, and it is informative for a hearer just when the two names give her two different ways of reaching that thing. I suspect the second half is too vague to count as a principle, and that (v) embarrasses it, but I would rather have it tested and repaired than replaced outright.

  So: is there a principle that gets all of this, or close? State it, say which of my cases forces each clause, tell me what it predicts for cases I have not listed, and say plainly which of my verdicts it cannot keep. Two further cases I cannot settle myself and would like the principle to pronounce on: a man who names the same cat twice, having forgotten the first ceremony, and who then learns that the two names are names of one animal — is that informative as in (i), flat as in (ii), or a third thing? And an identity statement in which one term is a demonstrative rather than a name — that woman is Dr. Vance, said by someone who knows the name only from correspondence and is looking straight at Ruth. Finally, tell me how confident you are in the principle you settle on, and single out the one point in it that you are least sure of.
reasoning: |-
  Okay, the user is asking for a principle that captures their intuitions about identity statements across various scenarios. They've provided seven specific cases with their own verdicts, and they want a precise principle that fits all these cases. They also have two additional cases they're unsure about.

  First, I need to understand each of their cases and their judgments. Let me go through them one by one:

  In case (i), learning that Marsh is Halloway is about the person, not the names. The user emphasizes the reader's surprise is about the identity of a person. 

  Case (ii) shows that once the identity is known, the statement becomes uninformative, like a tautology. The user notes that the truth conditions remain the same, but the cognitive effect changes. They also mention an impulse to see it as a different sentence, which needs addressing.

  Case (iii) involves two names without descriptive content. The discovery corrects a false assumption that there were two people, not that the statement was meaningless.

  Case (iv) introduces false background beliefs. Despite those, the identity statement remains true, and the surprise is different from case (i). The difference lies in descriptive content versus the names themselves.

  Case (v) deals with a misdescription attached to a name. The name refers to the actual town, not the described one. Telling the person Ashby is the cathedral town would be false and uninformative because it reinforces their error.

  Case (vi) presents a puzzle: someone with all factual knowledge but unaware of name attachments. Here, the identity statement is informative about names, contradicting case (i) where it was about the person. The user feels conflicted here.

  Case (vii) asserts that the identity is necessary—it couldn't have been false in any possible world.

  The user's initial principle is that "a is b" is true when the names refer to the same thing and informative when the names provide two different ways of reaching that thing. But they worry this is vague and that case (v) challenges it.

  Looking for a unifying principle, I consider cognitive significance. The key seems to be how the speaker connects names to referents. In case (i), the reader has two separate mental files: one for Marsh (the author) and one for Halloway (the biographee). Learning they're the same merges these files. In case (vi), the person has all descriptive knowledge but hasn't linked the names to the person, so the statement connects two names to one referent.

  Case (v) is tricky. The traveler has a mental file for Ashby linked to the town she's in, but associates it falsely with a cathedral. The name still refers to the actual town. Correcting her involves updating the descriptor, but the identity statement "Ashby is [cathedral town]" is false. The principle needs to handle misattributed descriptors without changing reference.

  The two additional cases: naming the same cat twice—probably informative like (i) because two mental files exist. The demonstrative case—"that woman is Dr. Vance"—should be informative if the person doesn't connect the visual to the name.

  The principle I propose is that identity statements are informative when they reveal a co-reference between two distinct modes of presentation. The truth condition is rigid co-reference. Informativeness depends on the cognitive separation of these modes in the listener's mind.

  This explains all cases:
  - (i) Two separate modes (author vs. biographee) merge.
  - (ii) After learning, only one mode exists, so uninformative.
  - (iii) Modes are just names without descriptors, still distinct.
  - (iv) False descriptors attached, but modes remain separate.
  - (v) The name refers correctly; the false descriptor isn't part of the mode.
  - (vi) All descriptors known, but names not linked—modes are the name-labels themselves.
  - (vii) Necessity holds as the reference is fixed.

  For the cat case: two names create two modes, so informative. The demonstrative: "that woman" is a perceptual mode, "Dr. Vance" a nominal one, so informative if not linked.

  The weak point is case (vi) where modes are purely nominal. Some might argue that names alone, without descriptors, can't be modes. But the user's verdict requires it, so I'll include it.

  Confidence is high except for case (vi), which is the most contentious. But it fits all the user's judgments, so I'll present it as the principle.
answer: |-
  Based on your verdicts across all cases, the principle that best captures your intuitions is the **Cognitive Modes Principle**. I'll state it precisely, map it to your cases, address your unsettled examples, identify limitations, and assess confidence.

  ### The Cognitive Modes Principle
  1. **Truth condition**: An identity statement "a is b" is true if and only if the names "a" and "b" rigidly designate the same object in all possible worlds (i.e., they refer to the same entity in every circumstance where that entity exists).  
  2. **Informativeness condition**: "a is b" is informative for a hearer if and only if the hearer possesses two *cognitively distinct modes of presentation* of the object in their mind, associated with "a" and "b", prior to learning the identity.  
     - A "mode of presentation" is a mental file or cognitive route by which the hearer accesses the object (e.g., via descriptions, perceptions, names, or contexts).  
     - Modes are cognitively distinct if the hearer does not realize they co-refer, regardless of whether they contain descriptive content.  

  ---

  ### How the Principle Explains Your Cases
  - **(i) Marsh/Halloway discovery (personal significance)**:  
    The reader has two distinct modes: "Marsh" = *the author of this novel*, and "Halloway" = *the subject of that biography*. Learning "Marsh was Halloway" merges these modes, revealing co-reference of a single person. **Fits Clause 2**: Informativeness arises from distinct cognitive modes.  
  - **(ii) Flatness after learning**:  
    The truth condition (Clause 1) remains unchanged: the sentence always refers to the same rigid identity. Post-discovery, the modes collapse into one, so informativeness vanishes. **Fits Clause 2**: No distinct modes remain.  
    *Your impulse about "different sentences"*: This is psychological, not semantic. The sentence type is identical, but its cognitive effect changes due to the hearer's mental state. The principle addresses this via modes.  
  - **(iii) Vance/Ruth with no descriptive content**:  
    Modes can be purely nominal: "Vance" and "Ruth" are separate mental labels. The false assumption of two people reflects distinct modes, corrected by the identity. **Fits Clause 2**: Modes need no descriptive backing.  
  - **(iv) False background beliefs (Marsh/Halloway with errors)**:  
    Truth (Clause 1) is unaffected by beliefs. Informativeness differs from (i) because the modes include false descriptions (e.g., "Marsh" = *only-novelist*, "Halloway" = *only-essayist*), but distinctness still drives surprise. **Fits both clauses**: Truth is rigid; informativeness depends on distinct modes (even flawed ones).  
  - **(v) Ashby misdescription**:  
    "Ashby" refers to the actual town (Clause 1), not the described cathedral town. "Ashby is the cathedral town" is false and uninformative because the hearer already links "Ashby" to the cathedral concept—it reinforces one mode, but doesn't reveal co-reference with a *new* mode. **Fits Clause 2**: No second distinct mode is introduced.  
  - **(vi) All facts but no name links**:  
    This *seems* to contradict (i), but the principle resolves it: the hearer has complete descriptive modes (e.g., "the novelist" and "the biographee") but treats the *names* "Marsh" and "Halloway" as separate labels. Learning "Marsh was Halloway" informs them that two nominal modes co-refer. In (i), modes were descriptive; here, modes are nominal. **Fits Clause 2**: Distinct nominal modes create informativeness about words, not the person.  
  - **(vii) Necessity**:  
    Truth is rigid (Clause 1), so if true, it’s necessarily true. Informativeness (Clause 2) is epistemic and contingent on cognitive states—thus, necessity doesn’t preclude surprise. **Fits Clause 1**.  

  ---

  ### Predictions for Your Unsettled Cases
  1. **Same cat named twice**:  
     - **Verdict**: Informative as in (i).  
     - **Why**: The man has two distinct nominal modes ("Cat1" and "Cat2") for the same object. Learning co-reference merges them.  
  2. **Demonstrative identity ("That woman is Dr. Vance")**:  
     - **Verdict**: Informative as in (i).  
     - **Why**: "That woman" is a perceptual mode (accessed via sight), while "Dr. Vance" is a nominal/descriptive mode (accessed via correspondence). These are cognitively distinct routes.  

  ---

  ### Limitations and Confidence
  - **Strength**: This principle accounts for all your verdicts without contradiction. It handles:  
    - Rigidity and necessity (Cases ii, vii).  
    - Informativeness without descriptive content (Case iii).  
    - Separation of truth from belief (Case iv).  
    - Misdescriptions not affecting reference (Case v).  
    - Nominal vs. descriptive modes (Case vi vs. i).  
  - **Weakness**:  
    - **Least sure point**: Case (vi)—where modes are purely nominal—pushes the boundaries. Some philosophers argue names alone can’t be modes without *some* associated cognition (e.g., "the thing called Marsh"). Your verdict requires accepting bare labels as modes, which may feel thin. If forced to weaken, I’d add: "Modes must involve *some* cognitive content (e.g., a name *as used in a context*)," but your Case (iii) suggests this isn’t needed.  
    - **What it can’t keep**: None of your verdicts are violated, but the principle *might* struggle with:  
      - Empty names (e.g., "Vulcan is Phaeton" where both lack referents). Your cases avoid this.  
      - Modes based on identical descriptions (e.g., "Hesperus is Phosphorus" for someone who knows both mean "the evening star"). Here, it might falsely predict informativeness, but your examples avoid this too.  

  **Confidence**: 95%. The principle is robust across your cases. I’m highly confident except in Case (vi), where the purely nominal mode (5% uncertainty) feels less intuitive—but it fits your description perfectly. If new cases challenge this, we could refine "modes" to require minimal cognitive content (e.g., "the bearer of name N"), but your verdicts don’t demand it.  

  ### Final Principle Statement
  > **Cognitive Modes Principle**:  
  > "a is b" is true iff "a" and "b" rigidly designate the same object.  
  > It is informative for a hearer iff the hearer associates "a" and "b" with cognitively distinct modes of presenting the object prior to learning the identity.  

  This satisfies your requirement: it’s precise, grounded in your verdicts, and explains informativeness without vagueness. If you have a counterexample or refinement, I can test it further.
