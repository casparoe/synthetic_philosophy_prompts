prompt: |-
  I run the forecasting desk at a small policy institute — eight analysts, about forty questions a week, every question gets a number between 0 and 1, and from next quarter those numbers feed into performance reviews, which has everyone quietly drifting toward 0.5. I've been reading alot about accuracy-first epistemology and epistemic utility theory and I think theres a workable procedure buried in it, but I need it dug out: a scoring and feedback routine the desk lead can run in half an hour on a Monday, nothing more demanding than arithmetic, that goes in order from what has to be nailed down before a question even goes out (resolution criteria, what counts as the event happening, the base rate we're measuring against) through how to score once things resolve, to what you actually say to an analyst whos doing badly. Tell me where the procedure stops and a person has to decide, because the call is about values or about the institution rather than about accuracy. Be straight with me about which parts of the theory break when you're scoring single questions week by week instead of a whole credence function, and about what no scoring rule can tell us at all — I don't want a reading list, I want the thing that survives contact with a desk. Then run it on three cases: two analysts whose scores come out the wrong way round relative to who got the call right, a question that resolved on a word nobody defined in advance, and a forecaster who hasn't gone outside 0.4 to 0.7 in six months. If the procedure says something about my own numbers I won't enjoy hearing, don't soften it. British English please.
reasoning: |-
  Okay, let me unpack this request. The user runs a forecasting desk with eight analysts facing a concrete problem: performance reviews are causing forecasters to cluster at 0.5. They've researched epistemic utility theory but need a practical, arithmetic-only procedure for weekly use. The request is highly specific - British English, three test cases, and clear demarcation of where human judgment takes over. 

  First, the core issue is incentive misalignment. When forecasters are punished for being wrong but not sufficiently rewarded for being right (especially at extremes), they rationally gravitate toward the safety of 0.5. The user understands this intellectually but needs operational solutions. Their mention of "values vs accuracy" suggests they're aware some fixes may require institutional trade-offs.

  The solution must survive desk contact: minimal time (30 mins weekly), no advanced math, and handle messy realities like undefined terms. I'm considering a three-part procedure: pre-question protocols, scoring using quadratic rule, and feedback tactics. Crucially, it must fail gracefully - showing where rules can't replace judgment.

  For the test cases: 
  - Two analysts where the "wrong" one scores better? That's actually a feature - proper scoring rules punish both inaccuracy and timidity. I'll demonstrate with concrete numbers.
  - Undefined resolution word? Procedure must force admitting this is a human failure, not scorable. 
  - Chronic 0.4-0.7 ranger? The math will show catastrophic opportunity cost, but addressing it requires managerial courage.

  Biggest tension: The user's own calibration might get exposed. If their resolution criteria are sloppy, the scores are garbage. I won't soften that - their willingness to hear it suggests they're serious.

  Notable constraints: 
  - Single-question scoring breaks coherence theorems, but we can mitigate with rolling aggregates. 
  - No rule can diagnose why someone underperforms - that needs human investigation.
  - We're valuing accuracy equally for all questions, which may not reflect policy impact. That's a values call.

  Right, let's build this as a field manual - short declarative steps, no jargon. The three demonstration cases will prove it's desk-ready. And I'll flag every point where the procedure stops and the human must decide with "MANAGEMENT CALL".
answer: |-
  Right. Let's get this dug out. Accuracy-first forecasting under performance pressure is brutal, but salvageable. Here's the procedure, hardened for desk use. It relies on the **Quadratic Scoring Rule (QSR)** – chosen because it's strictly proper (incentivises honesty), robust for single questions with caveats, and dead simple to calculate. British English throughout.

  **The Procedure: "Calibration Monday"**

  **I. Before a Question Goes Out (Nail This Down or Bin the Question)**
  *   **Step 1: Define the Event Precisely.** What *exactly* happens? (e.g., "The Bank of England Base Rate is *at or above* 5.25% at the close of business on [Date]", NOT "Interest rates rise"). **STOP: HUMAN DECISION.** Does this event definition serve the *institution's purpose*? Is it measurable *objectively*?
  *   **Step 2: Define Resolution Criteria & Source.** How will we *know* if it happened? (e.g., "Official BoE website announcement at 12:00 GMT on [Date+1]"). What is the *single, unambiguous, primary source*? **STOP: HUMAN DECISION.** Agreeing the authoritative source avoids "word nobody defined" chaos. If a source isn't agreed, the question isn't ready.
  *   **Step 3: Set the Base Rate (BR).** What is the *default* probability if we knew *nothing else*? Estimate this *before* seeing analyst forecasts. Use: Historical frequency of similar events, relevant market-implied probabilities (if available and trusted), or structured expert judgment. **STOP: HUMAN DECISION.** This is inherently value-laden – what counts as "similar"? How much weight on markets vs internal view? *This is critical for scoring.*
  *   **Step 4: Log It.** Question text, precise event definition, resolution source/date, BR, and *who assigned it* recorded in a central log (simple spreadsheet suffices).

  **II. Scoring Resolved Questions (Monday Morning Arithmetic)**
  *   **Step 5: Resolve.** Check the agreed source. Did the event happen? (Yes=1, No=0). If the source is ambiguous or the event definition is contested based on the outcome, **STOP: HUMAN DECISION.** Does the outcome *reasonably fit* the *intent* of the original definition? If not, the question is void for scoring. *This is messy, but essential.*
  *   **Step 6: Calculate QSR Score per Analyst per Resolved Question.**
      *   Let `p` = Analyst's forecast (between 0 and 1)
      *   Let `x` = Outcome (1 if happened, 0 if not)
      *   **QSR Score = 1 - (p - x)^2**
      *   **Example:** Analyst said 0.7. Event happened (x=1). Score = 1 - (0.7 - 1)^2 = 1 - (-0.3)^2 = 1 - 0.09 = **0.91**
      *   **Example:** Analyst said 0.3. Event happened (x=1). Score = 1 - (0.3 - 1)^2 = 1 - (-0.7)^2 = 1 - 0.49 = **0.51**
      *   *Range:* Score between 0 (maximally wrong, e.g., p=1, x=0) and 1 (perfect, p=x). 0.75 is decent, 0.9 is great, 0.6 is poor. *Higher is better.*
  *   **Step 7: Calculate Relative-to-Base Score (RBS).** *This shows added value beyond the default.*
      *   Calculate QSR for the Base Rate (BR): `1 - (BR - x)^2`
      *   **RBS = Analyst's QSR - BR's QSR**
      *   **Example:** BR was 0.6. Event happened (x=1). BR QSR = 1 - (0.6 - 1)^2 = 1 - 0.16 = 0.84. Analyst scored 0.91. RBS = 0.91 - 0.84 = **+0.07** (Added value)
      *   **Example:** BR was 0.6. Event didn't happen (x=0). BR QSR = 1 - (0.6 - 0)^2 = 1 - 0.36 = 0.64. Analyst said 0.7. Their QSR = 1 - (0.7 - 0)^2 = 1 - 0.49 = 0.51. RBS = 0.51 - 0.64 = **-0.13** (Worse than base rate)
      *   *Interpretation:* Positive RBS = better than default knowledge. Negative RBS = worse than default knowledge. **This is crucial for spotting drifters.**
  *   **Step 8: Record & Aggregate (Optional but Recommended).** Log individual QSR and RBS. Calculate 4-week rolling averages for QSR and RBS per analyst. *This smooths noise from single questions.*

  **III. Feedback & Addressing Issues (The Monday 1-1s)**
  *   **Step 9: The Numbers.** "Your QSR on [Question] was X. The Base Rate scored Y, so your RBS was Z." Have the log entry showing their `p`, the outcome, BR, and calculations.
  *   **Step 10: To the Forecaster Doing Badly (Low QSR, Negative RBS):**
      *   **Focus on Process:** "Walk me through your reasoning on [specific question with low score]. Where did the information come from? How did you weigh conflicting evidence? Why did you land on `p` instead of something higher/lower?"
      *   **Avoid Outcome Bias:** "Getting this specific call wrong isn't the main issue. The score tells us your probability didn't well represent your *uncertainty* relative to what we knew at the time. Let's look at the calibration..."
      *   **Address Drift (If spotted via RBS/range):** "I notice your forecasts are clustering between 0.4 and 0.7. Your RBS average is -0.05 over the last month. This suggests you're not using the full probability scale effectively, often ending up less accurate than just using our default (BR). What's making you hesitant to go below 0.4 or above 0.7? Let's look at examples where the BR was extreme but right/wrong."
      *   **Offer Support:** "Would reviewing our base rate process help? Do you need more structured techniques for evidence weighing? Should we shadow each other on a tough question?"
  *   **STOP: HUMAN DECISION.** Is the poor scoring due to lack of skill, lack of effort, poor sourcing, risk aversion, or a genuine black swan? The score diagnoses the *what* (poor uncertainty representation), not the *why*. Management must diagnose the cause and decide on support, training, or consequences. **No scoring rule can tell you *why* someone is underperforming.**

  **Where the Theory Gets Sore Knees (Single Questions, Weekly)**

  1.  **No Coherence Checks:** A whole credence function ensures probabilities add up logically (e.g., P(A) + P(Not A) = 1). Scoring single questions weekly ignores this. An analyst could forecast P(A) = 0.8 and P(Not A) = 0.3 on logically related questions and you wouldn't spot the inconsistency immediately. *Mitigation:* Track forecasts on related questions explicitly if possible, but weekly singles won't catch it inherently.
  2.  **High Variance:** Single events are noisy. A brilliant 0.9 forecast can get unlucky (Score=0.19) and a terrible 0.6 forecast can get lucky if the event happens (Score=0.84). *Mitigation:* Use rolling averages (QSR & RBS) over 4-8 weeks. Focus on *sustained* performance, not single scores. Emphasise RBS – a lucky 0.6 might beat the outcome but still have a negative RBS if the BR was 0.7.
  3.  **Base Rate Sensitivity:** The RBS is only as good as your BR. A bad BR estimate distorts RBS. *Mitigation:* Invest time in Step 3. Review BR accuracy periodically. **No scoring rule can compensate for a systematically flawed base rate.**
  4.  **Calibration Needs Volume:** True calibration (does 70% of their 0.7 forecasts happen?) needs many forecasts at similar probabilities. Weekly singles provide low volume per probability bin. *Mitigation:* Aggregate over time and analysts for *group* calibration curves (a longer-term project). For individuals, focus on RBS and range usage as leading indicators. **No scoring rule can give a reliable calibration curve from sparse single forecasts.**

  **What No Scoring Rule Can Tell You (Full Stop)**

  1.  **The "Why":** Why was the forecast wrong? Bad intel? Flawed reasoning? Bad luck? Systemic bias?
  2.  **The True Difficulty:** Scoring rules don't inherently account for question difficulty. A score of 0.8 on an obvious question is worse than 0.6 on a fiendishly hard one. *Mitigation:* That's why RBS (vs BR) is essential – the BR *should* reflect inherent difficulty.
  3.  **Strategic Value:** Was getting *this specific question* right/wrong critical for the institute? Scoring rules value all accuracy equally. **STOP: HUMAN DECISION.** Management must decide if certain questions warrant higher stakes, but *don't* change the scoring rule – that breaks incentives. Track them separately or weight aggregates if absolutely necessary (but be transparent!).
  4.  **Your Own Flaws:** If *your* resolution criteria are sloppy or BRs are rubbish, the scores are garbage-in-garbage-out. The rule ruthlessly exposes *your* failures in Steps 1-3.

  **Running the Cases**

  *   **Case 1: Wrong Way Round**
      *   **Question:** Will MP X resign by Friday? (Resolves: Yes)
      *   **Base Rate (BR):** 0.3 (Historical resignations rare, no immediate scandal known).
      *   **Analyst A:** Forecast = 0.9 (Confident, based on a strong rumour). **QSR:** 1 - (0.9-1)^2 = 1 - 0.01 = **0.99**. **RBS:** 0.99 - [1 - (0.3-1)^2] = 0.99 - [1 - 0.49] = 0.99 - 0.51 = **+0.48**.
      *   **Analyst B:** Forecast = 0.6 (Vague sense of instability). **QSR:** 1 - (0.6-1)^2 = 1 - 0.16 = **0.84**. **RBS:** 0.84 - 0.51 = **+0.33**.
      *   **Outcome:** A scored higher than B, *despite being more extreme and "riskier"*. Why? A captured the *surprise* much better than the base rate. B was closer to 1 than 0, but not enough to significantly beat the low BR. The score reflects *how well their probability matched the reality of the surprise event*. **The procedure works:** A gets the higher score they deserved for superior insight/evidence. B was directionally right but timid.

  *   **Case 2: The Undefined Word**
      *   **Question:** "Will Country Y be declared in 'default' by Moody's by month-end?"
      *   **Outcome:** Moody's declares a "Restricted Default" (a specific technical term).
      *   **Procedure:** **STOP: HUMAN DECISION.** Check Step 1. Was "default" defined to include "Restricted Default"? If the log says nothing, it's ambiguous. *Do not score*. Void the question for performance review. **Feedback:** "This is on us. Our definition was sloppy. We'll tighten up Step 1. This question won't count in your scores." *Crucially, the scoring rule never gets applied to ambiguity.*

  *   **Case 3: The 0.4-0.7 Drifter (6 Months)**
      *   **Typical Result:** Forecast = 0.55 on a Yes/No question. BR = 0.2 (Strong evidence against). Outcome = No (0).
      *   **Drifter QSR:** 1 - (0.55 - 0)^2 = 1 - 0.3025 = **0.6975**
      *   **BR QSR:** 1 - (0.2 - 0)^2 = 1 - 0.04 = **0.96**
      *   **Drifter RBS:** 0.6975 - 0.96 = **-0.2625** (Massively worse than base rate!)
      *   **Analysis:** The rolling average RBS will be strongly negative. The QSR might hover around 0.6-0.7 (poor). The procedure flags this clearly via consistently negative RBS and lack of forecasts <0.4 or >0.7.
      *   **Feedback:** "Your RBS average is -0.15 over 12 weeks. This means your forecasts are consistently performing worse than our initial default estimate. Your probabilities are clustering in the middle, avoiding the tails. Look at this case: the BR was 0.2 (unlikely), we had evidence supporting that, but you forecast 0.55. The outcome was No (0), so your score was significantly below the BR's score. What stopped you from going lower, say 0.3 or 0.25? Are you worried about being wrong on extremes? Let's work on techniques to translate evidence strength into probability more boldly." **The procedure forces the issue quantitatively.** The manager must address the root cause (risk aversion? misunderstanding probabilities? laziness?).

  **The Hard Truth for You (Desk Lead)**

  1.  **Your Base Rates Matter More Than Anything:** If your BRs are routinely bad (poorly estimated, not updated, not using available intel), the RBS becomes meaningless or misleading. Your analysts' scores largely reflect *your* skill in Step 3. Garbage BR in, garbage RBS out. Look at your BR QSR over time. Is it consistently above 0.75? If not, your procedure's foundation is rotten.
  2.  **Ambiguity is Your Enemy:** Every question that resolves ambiguously and gets voided (Case 2) is a failure of your process (Step 1 & 2). It wastes time, erodes trust in the system, and deprives you of scoring data. Tighten this ruthlessly.
  3.  **Rolling Averages are Non-Negotiable:** Judging analysts on single-week scores is statistically illiterate and unfair. You **must** use rolling aggregates (QSR and especially RBS) over a sufficient window (4-8 weeks minimum).
  4.  **RBS Reveals Drift, QSR Reveals Calibration (Over Time):** The chronic drifter (Case 3) is exposed by RBS long before their QSR looks catastrophic. Use RBS as the primary diagnostic for incentive misalignment (clustering). Use long-term QSR for overall calibration assessment.

  This is the core. It demands rigour in setup (Steps 1-3) and consistency in scoring (Steps 5-8). It won't solve everything, but it will kill the drift to 0.5 by making timidity painfully visible (via RBS) and rewarding well-calibrated boldness. Now go and implement it – and hold your own feet to the fire on those BRs.
