answer: |-
  ## Joint Statement on Moral Testimony: Common Ground and Clarified Disagreements  
  *Agreed by Representatives of the Permissive and Demanding Views*

  ### 1. Agreed Claims  
  Both parties affirm the following:  

  1.  **Moral Testimony Transmits Belief & Practical Guidance:** Moral testimony can reliably produce true moral beliefs in the recipient and motivate action. It is a common and often practically necessary feature of moral life.
  2.  **Not About Skepticism or Isolationism:** The dispute is *not* about whether moral truths exist, whether we can know them, or whether we should *ever* listen to others. Both sides reject radical moral skepticism and the idea that individuals must reason in total isolation.
  3.  **Deference Has Value, Especially Initially:** Moral learning *necessarily* begins with reliance on others (e.g., parents, teachers). This initial deference is practically unavoidable and often beneficial for developing moral capacities.
  4.  **Understanding is Valuable:** Achieving genuine understanding of moral reasons is a significant intellectual and moral good. Neither side advocates for perpetual, unreflective deference as an ideal state for mature moral agents.
  5.  **Evidence Against Own View (Permissive):** If it could be shown that acting on moral testimony *systematically* leads to worse moral outcomes or a fundamental corruption of moral agency *even in well-chosen cases of deferring to reliable experts*, this would challenge the permissive view.
  6.  **Evidence Against Own View (Demanding):** If it could be shown that demanding personal understanding in *all* cases *systematically* leads to paralysis, harmful inaction, or significantly worse outcomes than well-placed deference, this would challenge the demanding view.
  7.  **The Recantation Case (Common Observation):** If Priya recants her original judgment, both Bo and Aya must re-evaluate. Neither camp claims blind adherence is virtuous. Bo’s reason for believing *P* (Priya said so) is directly undermined. Aya’s reason (her own reasoning) may also be challenged, forcing her to re-examine her premises/conclusions.

  ### 2. Disagreements Table

  | Disagreement (Stated by the View)                                                                 | Crux                                                                                                | Concrete Case (Aya & Bo)                                                                                                                          | Predictions                                                                                                                                                                                                                                                               |
  | :------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Permissive:** "In relevant domains, accepting moral testimony can provide full epistemic warrant and moral justification for belief and action." | Does testimony *alone* provide the kind of warrant/justification required for proper moral belief and action? | **The Case:** Aya reasons to conclusion C (break confidence). Bo accepts C solely on Priya’s testimony. Later, it’s revealed Priya’s reasoning was flawed (e.g., relied on a false but irrelevant premise), though C was true. | **Permissive:** Bo’s belief remains warranted & justified. The *truth* and *reliability-source* sustain it. Flawed reasoning in the source doesn’t automatically undermine the warrant of the testimonial belief itself if the conclusion is correct and the source was reliable overall. <br>**Demanding:** Bo’s belief *loses* its epistemic warrant and moral justification upon learning of the flawed reasoning, even if C is true. It was never properly *his* justification; it was merely a true belief borrowed on authority. Aya’s warrant, grounded in understanding, survives. |
  | **Demanding:** "Genuine moral belief and justified action require first-personal understanding of the relevant reasons; testimony alone cannot supply this." | Is *understanding*, not just true belief (even reliably sourced), essential for *moral* justification? |                                                                                                                                                   | *See above*                                                                                                                                                                                                                                                                |
  | **Permissive:** "An action performed based on well-placed moral testimony can be fully praiseworthy, and the agent retains standing to blame (where appropriate)." <br>**Demanding:** "An action lacks full moral worth/praiseworthiness if the agent acts solely on testimony without understanding, and their standing to blame may be compromised." | Does deference affect the *moral quality* of the action and the *agent's standing* in the moral community? | **Acting & Blaming:** Bo donates to Charity X solely because Priya says it's most effective. Later, a critic argues Charity Y is better. Bo insists X is best, citing Priya. | **Permissive:** Bo’s donation is praiseworthy; he did the right thing for a (testimonial) reason. He can legitimately challenge the critic, invoking Priya’s expertise. <br>**Demanding:** Bo’s action lacks the full moral worth of Aya’s (who researched charities). His insistence lacks force; without his own grasp of the reasons, his challenge is merely an appeal to authority, undermining his standing to authoritatively blame the critic. |
  | **Permissive:** "Deference is broadly similar in permissibility and function across moral domains (obligation, supererogation, admirability)." <br>**Demanding:** "Deference is most problematic for core obligations and less so for judgments of admirability or finely balanced supererogatory choices." | Is there a *hierarchy* of moral judgment where deference is more/less acceptable? | **Deference Types:** 1. "Should I pay my staff a living wage?" (Obligation) 2. "Should I donate this bonus to Charity A or B?" (Supererogatory) 3. "Is Priya’s dedication admirable?" (Admirability) | **Permissive:** Deference can be appropriate in all cases if the source is reliable. The *stakes* might affect how much diligence is needed in choosing the source, not the fundamental permissibility of deference. <br>**Demanding:** Deferring on core obligations (1) is most troubling – you *must* understand why you owe basic duties. Deferring on complex supererogation (2) might be more acceptable due to complexity. Deferring on admirability (3) is least problematic; it’s closer to aesthetic judgment. |
  | **Demanding:** "There is a crucial distinction between deferring to reasoning you *could* reconstruct (but haven't) and reasoning you *could not* reconstruct." <br>**Permissive:** "While reconstructibility might matter for understanding *how* the expert knows, it doesn't fundamentally alter the epistemic status of the testimonial belief itself." | Does the *potential* for understanding (reconstructibility) mitigate the demanding view's concerns about deference? | **Reconstructibility:** Bo defers to Priya on a complex trade justice issue. Case A: Bo could follow Priya’s reasoning if he tried. Case B: Priya uses advanced economic models Bo lacks training to grasp. | **Demanding:** Case A is less bad; Bo *could* have the understanding and is culpable for not bothering. Case B highlights the true epistemic gap; Bo *cannot* achieve the required understanding himself, making deference more necessary but the resulting belief less ideally justified. <br>**Permissive:** In both cases, Bo gains warranted belief from a reliable source. Case A makes it *easier* for Bo to *gain* understanding later, but the *current warrant* for his belief and action is the same in both: Priya’s reliable testimony. |

  ### 3. Potential Merely Verbal Disagreements  

  1.  **"Outsourcing":** The permissive view rejects the term "outsourcing" as pejorative and implying a shirking of responsibility. They see accepting testimony as a responsible epistemic practice akin to relying on experts in other fields. The demanding view uses "outsourcing" to capture the lack of first-personal engagement they deem essential. **Agreement:** Both agree uncritical, perpetual deference without any reflection is problematic. The dispute is whether *well-placed, critical* deference counts as "outsourcing" in a bad sense or as responsible epistemic conduct.
  2.  **"Moral Life":** The demanding view sees the "moral life" as inherently requiring active, first-personal engagement with reasons. The permissive view has a broader conception where navigating the moral world responsibly includes knowing when and how to rely on others' expertise. **Agreement:** Both agree a moral life devoid of *any* personal reflection or engagement would be impoverished. The dispute is whether *selective, justified* deference is compatible with a robust moral life or inherently detracts from it.
  3.  **"Warrant/Justification":** The core disagreement hinges on whether "epistemic warrant" or "moral justification" *requires* understanding. The permissive view defines warrant/justification such that reliable testimony *can* provide it. The demanding view defines it such that only understanding *can* provide it. **Agreement:** Both agree that understanding provides a robust form of warrant/justification. They agree testimony provides *something* (true belief, motivation). The dispute is whether that "something" deserves the label "full warrant/justification" in the moral domain. **This is the crux of the entire debate and likely *not* merely verbal.** However, clarifying that both sides *are* using these terms with different necessary conditions helps prevent talking past each other. The Aya-and-Bo case specifically probes whether this distinction marks a *morally* or *epistemically* significant difference.
