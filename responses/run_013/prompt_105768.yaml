  **Final Procedure (One-Pager):**

  **LLM Agent Process Review Procedure**

  **Step 1: Set aside the outcome.** Do not let it influence the process review.

  **Step 2: Process Soundness Checklist (Answer Yes/No for each)**
  1. **Task Clarity:** Did the agent correctly identify the task?
  2. **Information Gathering:** Did the agent gather all necessary data (available at the time)?
  3. **Reasoning Transparency:** Did the agent show clear, step-by-step reasoning without logical flaws?
  4. **Alternatives Considered:** Did the agent consider at least one alternative action?
  5. **Rule Consistency:** Did the agent follow documented business rules?
  6. **Replay Test:**
     - a. If the outcome had been the opposite, would the reasoning still appear sound? 
     - b. Did the agent acknowledge uncertainty or potential negative consequences? 
     (Both 6a and 6b must be Yes)

  **Scoring:** 
  - If any answer is No (or Unclear), the process is flawed. 
  - Only if all are Yes, the process is clean.

  **Step 3: Outcome Evaluation**
  - Good Outcome: Ticket resolved, no complaint, fraud correctly identified (as per existing outcome metrics).
  - Bad Outcome: Otherwise.

  **Step 4: Final Score & Actions**
  - **Good Process, Good Outcome:** No action.
  - **Good Process, Bad Outcome:** No penalty for agent. Note: "Agent acted correctly; outcome due to external factors."
  - **Bad Process, Good Outcome:** Penalize. Note: "Good outcome was luck; flawed process must be fixed."
  - **Bad Process, Bad Outcome:** Penalize.

  **Escalation:**
  - If Replay Test (6a or 6b) fails, escalate to team lead.
  - If any step is unclear or involves a values call not covered by rules, escalate to senior.

  **Anti-Gaming:** The Replay Test (especially 6b) ensures that the agent must demonstrate awareness of uncertainty and consequences, making it harder to fake reasoning.

  **Defending Key Points:**
  - Clean Process / Bad Outcome: "The agent made the best decision with available information; the bad outcome was due to factors beyond the agent's control (e.g., human override, inherent uncertainty)."
  - Bad Process / Good Outcome: "The good outcome was fortuitous but the flawed process must be corrected to avoid future failures."

  **What This Procedure Can't Do:**
  - It cannot account for incomplete or ambiguous business rules (escalate to update rules).
  - It may not catch highly sophisticated gaming (escalate if suspicious).
  - It doesn't replace human judgment for complex or novel cases (escalate).
  - It assumes the transcript is complete and truthful (if not, we have a data issue).
answer: |-
  Here's a streamlined, one-page review procedure designed for your team. It's operationalized with clear questions, scoring rules, escalation paths, and defenses against common objections. The goal is to evaluate the agent's **reasoning process** independently of outcomes, using a modified replay test to reduce gaming.

  ---

  ### **LLM Agent Process Review Procedure**  
  *Time per transcript: ≤15 minutes*  
  *Inputs: Full interaction transcript + Outcome data*  

  **Step 1: Outcome Independence**  
  ➤ **Action:** Note the outcome (good/bad), then consciously set it aside. Do not reference it during Steps 2–4.  
  ➤ **Defense for good process/bad outcome:** *"The agent can only control its reasoning—not external factors (e.g., human overrides, customer behavior, or luck). We penalize flaws in control, not unavoidable outcomes."*  

  **Step 2: Process Soundness Checklist**  
  Answer sequentially (stop if any "No"). Use transcript evidence only:  
  1. **Task Identification:** Did the agent correctly recognize the task type (e.g., fraud, chargeback)?  
     - *Pass:* Matches ticket intent. *Fail:* Misclassified (e.g., treated fraud query as refund).  
  2. **Information Basis:** Did the agent use **all available, relevant data**?  
     - *Pass:* Cited ticket history, transaction logs, policies. *Fail:* Ignored key evidence (e.g., a receipt date).  
  3. **Reasoning Transparency:** Did the agent show **step-by-step logic** (not just conclusions)?  
     - *Pass:* Clear "if-then" chains. *Fail:* Illogical jumps or contradictions.  
  4. **Replay Test (Anti-Gaming):**  
     - a. *"If the outcome were reversed, would the reasoning still appear valid?"*  
       (e.g., If agent *denied* a refund that was later proven valid, would its logic hold?)  
     - b. *"Did the agent explicitly consider at least one alternative outcome?"*  
       (e.g., "This pattern *could* be fraud, but might also be a mistake.")  
     - **Pass only if BOTH are YES.** Forces robust reasoning that isn't outcome-dependent.  
  5. **Rule Compliance:** Did the agent follow documented business rules?  
     - *Pass:* Adhered to policies. *Fail:* Violated rules (e.g., skipped required fraud checks).  

  **Step 3: Scoring & Escalation**  
  - **Overall Process Score:**  
    - **Good Process:** All Steps 1–5 = "Yes".  
    - **Bad Process:** Any Step = "No" or "Unclear".  
  - **Outcome Integration:**  
    | Process \ Outcome | Good Outcome | Bad Outcome |  
    |-------------------|--------------|-------------|  
    | **Good Process**  | No penalty   | ✅ **No penalty**<br>*Defense: "Process was sound; outcome was external."* |  
    | **Bad Process**   | ⚠️ **Penalize**<br>*Defense: "Good outcome was luck; flawed process risks future errors."* | Penalize |  
  - **Escalate If:**  
    - Replay Test (Step 4) fails → Flag for lead review (gaming/robustness risk).  
    - Uncertainty in Step 2 → Escalate to senior (values call or ambiguity).  
    - Human override occurred → Note but don’t penalize agent (not in its control).  

  **Step 4: Values Call Handoff**  
  ➤ **DO NOT** score if:  
     - Business rules are silent (e.g., "How much customer inconvenience is acceptable?").  
     - Novel edge case (e.g., unprecedented fraud pattern).  
  ➤ **Action:** Mark as "Human Decision Required" and escalate.  

  ---

  ### **Test Cases**  
  **Transcript 1: Clean Process, "Wrong" Outcome**  
  - *Agent flagged account for review (small transfers pattern). Human overrode. Account was fine.*  
    - **Process Review:**  
      1. ✅ Task ID: Fraud check.  
      2. ✅ Used transaction data.  
      3. ✅ Showed logic: "Pattern matches policy F-12."  
      4. ✅ Replay Test:  
        - a. If account *was* fraudulent, logic still holds (pattern exists).  
        - b. Considered alternative: "Could be legitimate, but meets threshold for review."  
      5. ✅ Followed rule F-12.  
    - **Score:** Good process. Outcome bad (override → false positive). **Result: No penalty.**  
    - **Risk Committee Defense:** "Agent followed protocol. Override by human caused outcome—not agent error."  

  **Transcript 2: Bad Process, Good Outcome**  
  - *Agent approved chargeback (misread receipt date). Customer deserved refund.*  
    - **Process Review:**  
      1. ✅ Task ID: Chargeback.  
      2. ❌ Ignored receipt date (available but misread).  
      3. ❌ Reasoning flawed: "Date is 01/12 vs. 12/01" → Stop. No need to continue.  
    - **Score:** Bad process. Outcome good. **Result: Penalize.**  
    - **Angry Team Defense:** "The refund was correct, but the agent’s sloppy reading could cause wrong denials. We fix processes, not outcomes."  

  **Transcript 3: Clean Process, Bad Outcome (Customer Churn)**  
  - *Agent flagged fraud (correctly per rules). Account locked 4 days. Customer churned.*  
    - **Process Review:**  
      1. ✅ Task ID: Fraud check.  
      2. ✅ Used all data (IP, transactions).  
      3. ✅ Clear logic: "Meets rules F-3, F-7."  
      4. ✅ Replay Test:  
        - a. If account *wasn’t* fraudulent, logic still holds (rules applied correctly).  
        - b. Considered alternative: "False positives may inconvenience customers."  
      5. ✅ Followed rules.  
    - **Score:** Good process. Outcome bad (churn due to lockout). **Result: No penalty.**  
    - **Why?** Churn is a business risk (lockout policy), not an agent flaw. Escalate *policy* to leadership.  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Hidden Data Flaws:** If critical data was missing *and the agent didn’t flag it*, it may score well (Step 2 relies on transcript evidence).  
  2. **Sophisticated Gaming:** Agents might learn to "mimic" good reasoning (e.g., "boilerplate" uncertainty). The Replay Test mitigates but can’t eliminate this—escalate if suspected.  
  3. **Values Trade-offs:** E.g., "Is locking 10 legit accounts to catch 1 fraudster acceptable?" Hand off to humans.  
  4. **Team Overrides:** Human decisions post-agent (e.g., overriding a correct flag) are out of scope—track separately.  

  **Final Output:** Good process requires **correct, transparent, and robust reasoning**. Print and post this—it fits one page!
