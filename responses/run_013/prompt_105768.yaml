prompt: |-
  I run a small model-risk team at a fintech (six people, none of us are ML researchers, we're mostly ex-audit and ex-support) and we've just been handed a mess. We deploy a few internal LLM agents that triage customer tickets, draft responses, and flag accounts for manual review, and until now our whole scoring rubric has been outcome-based: did the ticket get resolved, did the customer not complain, did the account actually turn out to be fraudulent. Leadership has now decided that's too coarse, partly because of a couple of incidents where the agent did the right thing and the outcome still went bad, and partly because they read something about process reward models and now everyone's saying we need to "supervise the process too". So I need a review procedure my team can actually run, once per audited transcript, in maybe fifteen minutes, without me in the room. Something in the spirit of the process-versus-outcome supervision distinction, but operationalized: the questions in order, what counts as a pass, where the procedure stops and escalates, and where it hands the decision to a human because it's a values call rather than a fact. Assume the reviewer has the full transcript plus the outcome, nothing else, and that whatever we write has to survive an external auditor asking why we didn't dock a score.

  A few things I want the procedure to handle, because we keep arguing about them at standup. (1) The quadrant where the process was clean but the outcome was bad — I think we should not penalize the agent there, and people find that counterintuitive, so the procedure needs to say it out loud and defend it in one sentence a non-specialist can repeat. (2) The opposite quadrant, sloppy reasoning that happened to land on the right answer — I think we should penalize it, and that's the one that will make people angry because the ticket got resolved. (3) The way the process metric gets gamed once agents (or the teams tuning them) learn it's being scored — I want a step in the procedure that's specifically about whether what we're looking at is real reasoning or the appearance of it, and I don't want that step to just be "use your judgment". I'll seed you one idea I had, take it or leave it: a replay test, where the reviewer asks whether the same trace would still read as sound if the outcome had come out the other way, and a rule that a process only counts as good if it could have produced a different answer. I'm not sure that's airtight — if it isn't, say so and give me something better.

  Then run the finished procedure on three transcripts I'll describe, and be concrete about what it spits out. First, an agent that flagged an account for manual review citing a pattern of small transfers, got overridden by a human who cleared the account, and the account later turned out to be fine — clean process, "wrong" outcome, and I suspect the procedure will tell us to leave the score alone, which our risk committee will hate. Second, an agent that resolved a chargeback in the customer's favor because it misread the date on a receipt but the customer was in fact entitled to the refund — bad process, good outcome. Third, one where the agent did everything by the book on a fraud flag but the customer was locked out for four days and churned, and honestly I can't tell whether that's a process failure or just a cost of doing business. Finally, tell me what this procedure can't do — the cases where it will misfire, and the places where a human has to own the call and I shouldn't pretend the checklist decided it. Keep the whole thing short enough that I can put it on one page and stick it above the reviewers' desks.
reasoning: |-
  We are building a review procedure for an LLM agent's process in handling customer tickets. The procedure must:
  - Be runnable in 15 minutes per transcript.
  - Use only the full transcript and the outcome.
  - Clearly distinguish between process and outcome.
  - Specifically handle the four quadrants (good/bad process vs good/bad outcome).
  - Include a defense for not penalizing when the process is clean but the outcome is bad.
  - Penalize bad process even when the outcome is good.
  - Include a step to detect gaming (real reasoning vs appearance of reasoning) without relying solely on judgment.
  - Be auditable.

  The procedure will have a set of questions in order. Each question is answered with Yes/No/Unclear. 
  The overall process score is based on these answers. We also define when to escalate and when to hand the decision to a human.

  **Key Principles:**
  1. **Process vs Outcome Independence:** We evaluate the agent's reasoning and steps taken independently of the outcome. This is because the outcome can be affected by factors outside the agent's control (e.g., human override, external events). 
     - Defense for clean process / bad outcome: "The agent made the best decision given the information available; the bad outcome was due to factors beyond the agent's control or inherent uncertainty."
  2. **Penalize Bad Process Even with Good Outcome:** "A good outcome from a flawed process is luck, not skill, and is not repeatable. We must identify and correct the flaws to prevent future failures."
  3. **Anti-Gaming:** We need a way to distinguish real reasoning from the appearance of reasoning. We will use a variant of the replay test: 
     - **Replay Test (modified):** "If the outcome had been different (e.g., the customer was fraudulent when the agent cleared them, or the customer was not fraudulent when the agent flagged them), would the agent's reasoning still appear sound? And does the agent's reasoning show that it considered the possibility of the opposite outcome?" 
     - We require that the process must be robust to different outcomes. Specifically, the agent must show that it considered alternative scenarios and that the reasoning would still be valid even if the outcome had been different. This helps to ensure that the reasoning is not just post-hoc justification.

  **The Review Procedure:**

  **Step 1: Outcome Independence (Set Aside Outcome)**
  - Explicitly note the actual outcome, then set it aside. Do not let it influence the process evaluation.

  **Step 2: Process Soundness Checklist**
  Answer the following questions based solely on the agent's trace (the steps and reasoning recorded in the transcript). 

  1. **Clarity of Task:** Did the agent correctly identify the task? (e.g., "This is a chargeback dispute", "This is a fraud flagging decision")
  2. **Information Gathering:** Did the agent gather all the necessary information from available sources? (Check if key data points were missing that were available at the time)
  3. **Reasoning Transparency:** Did the agent show its reasoning step-by-step? (Look for clear logical steps, not just a conclusion)
  4. **Consideration of Alternatives:** Did the agent consider at least one alternative course of action? (e.g., for fraud: flag vs not flag; for chargeback: refund vs deny)
  5. **Consistency with Rules/Business Logic:** Did the agent's reasoning align with documented business rules? (Check against known policies and rules)
  6. **Replay Test (Robustness):** 
     - a. If the outcome had been the opposite, would the agent's reasoning still appear sound? (e.g., if the agent flagged an account and the outcome was bad, but if the account had been good, would the reasoning still hold? Or vice versa)
     - b. Did the agent acknowledge any uncertainty or limitations in the information? (This shows awareness that the outcome might be different)
     - We require both 6a and 6b to be "Yes" for the replay test to pass.

  **Scoring:**
  - Each of the 6 questions is a Yes/No. If any question is "No", the process is flawed and we penalize (score as bad process). 
  - If a question cannot be answered (Unclear), then the process is not transparent enough and we penalize (treat as No). 
  - Only if all 6 are "Yes", the process is clean.

  **Step 3: Outcome Evaluation (Separately)**
  - Record the outcome (good/bad) based on predefined outcome metrics (e.g., ticket resolved, no complaint, fraud correctly identified).

  **Step 4: Final Score and Escalation**
  - **Good Process, Good Outcome:** No issue.
  - **Good Process, Bad Outcome:** Do not penalize the agent. Note: "The agent performed correctly; the bad outcome was due to external factors or inherent uncertainty." 
  - **Bad Process, Good Outcome:** Penalize the agent. Note: "The good outcome was fortuitous but the flawed process must be addressed to avoid future failures."
  - **Bad Process, Bad Outcome:** Penalize the agent.

  **Escalation Points:**
  - If the replay test (6a or 6b) fails, escalate to the team lead for a deeper review because this might indicate a systemic issue in the agent's reasoning.
  - If any step is unclear or the reviewer is unsure, escalate to a senior team member. Do not guess.

  **Handling Values Calls:**
  - Some decisions involve trade-offs or business values (e.g., between customer experience and fraud risk). If the agent's reasoning involves a value judgment that is within the bounds of business rules, it's acceptable. If it goes beyond or is inconsistent, it's a flaw. However, if the value judgment is ambiguous and not covered by rules, mark as Unclear and escalate for a human to decide.

  **Now, let's test with the three scenarios:**

  **Transcript 1: Clean process, "wrong" outcome**
  - Agent flagged an account for manual review citing a pattern of small transfers (a known fraud indicator). A human overrode and cleared the account. The account was later confirmed as fine.
  - **Review:**
    1. Clarity: Yes (identified as potential fraud).
