    6. Replay Test: 
       - 6a: If the account had been fraudulent, the reasoning would still hold (it was based on patterns). Also, if the agent had not flagged, the reasoning would have been different? But the question is about the reasoning given. The reasoning given was for flagging. If the outcome was that the account was good, would the reasoning still be sound? Yes, because the pattern was indeed present and the rule says to flag in that case. The reasoning doesn't become unsound just because the account was good (it was a false positive, which is acceptable in fraud detection). 
