  **Notes on the Form**

  This pantoum's recursive structure mirrors the puzzle's deterministic, looping nature. Lines cycle back precisely (e.g., "This scrap of paper holds just M and I," "The rules insist a U might justify," "I'm always one good move from U's pure gift"), embodying the repetitive application of rules that never quite reach the desired state (MU), much like the solver's stuck process. The returning lines represent recurring actions (doubling the tail, deleting UU, collapsing III) and persistent, unfulfilled hopes ("MU materializes").

  The strict adherence through four quatrains creates a claustrophobic rhythm, reflecting the solver's immersion ("letters blur before my eyes," "paper sheets"). The fifth stanza breaks completely: no lines are recycled from the previous stanza. This rupture enacts the conceptual "jump out of the system." The new lines introduce counting ("The count begins," "No multiple of three," "always leaves one I") – the external, unmentioned invariant. The shift in diction ("tally," "multiple of three," "system," "logic") is stark and analytical, contrasting the earlier tactile frustration. The loop doesn't close; instead, the poem ends on the revelation of the invariant ("its logic unconcealed"), achieving the requested vertigo and relief through formal discontinuity and thematic revelation. The system remains intact, but the solver has escaped its endless cycle.
