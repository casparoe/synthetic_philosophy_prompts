  | **Skolem generalizes to radical referential indeterminacy** | 0.40 | If adding *any* axioms (even higher-order) allowed reinterpretation (e.g., "skeptic models"), credence for B ↑. Putnam's model-theoretic argument presses this, but intrinsic constraints (e.g., "is a number") may resist. |
