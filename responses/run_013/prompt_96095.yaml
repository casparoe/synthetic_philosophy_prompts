  | **Deflationism is correct** ("Countable in M" vs. externally is non-paradoxical) | 0.80 | If Skolemite relativity generalized to *all* mathematical concepts (e.g., "finite"), credence ↓. Current evidence: relativity is contained to "unbounded" notions like uncountability. |
