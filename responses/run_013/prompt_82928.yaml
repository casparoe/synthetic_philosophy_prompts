  Hey, I'm a grad student in philosophy and I'm working on a paper about updating on conditionals. I've been reading about the Judy Benjamin problem and I'm kind of stuck. I get the basic setup: Judy is a paratrooper dropped into a territory divided into Red and Blue, with Blue subdivided into First and Second Company areas. I think the standard prior is that she's equally likely to be in Red or Blue, and within Blue equally likely to be in First or Second. Then she gets a radio message that says something like "if you're in Blue, then you're in Second Company." The thing is, I understand that this isn't a simple conditionalization because she doesn't learn a proposition with a definite probability; she learns a conditional. And I know that Jeffrey conditionalization doesn't directly apply because she doesn't learn the probability of the antecedent. But then I've heard that if you try to solve it by minimizing relative information (KL divergence) from the prior, you get a unique answer, but I've also heard that this answer is counterintuitive for some reason. Can you explain, as if to someone who knows Bayesian epistemology but not this specific literature, what the Judy Benjamin problem is, why it's a problem for probability kinematics, and what the relative information minimizer says? Also, I'd like to understand why some people think the relative information minimizer gives the wrong answer, or at least an unintuitive one.

  I was discussing this with a friend who works on formal epistemology, and they said something about the problem being that the conditional doesn't constrain the marginal probability of Blue, but I didn't quite follow. I'm not sure if I'm even framing it right. I'm not looking for citations or a reading list, just a clear conceptual explanation. Please think carefully and maybe start by laying out the setup and the possible answers, then discuss the pros and cons. Write in American English. Thanks!
