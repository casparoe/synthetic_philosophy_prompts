     - Core claim: Lying occurs only when truth is expected, so deception in contexts like poker is not lying and may be fine.  
     - Awkward commitment: Bluffing in business is not lying if deception is normalized, even if harmful.  
     - Occupants: Some relativists.  
     - Why empty: null.

  8. **Augustine-like (secular)**  
     - Path: B (intent to deceive), A (misuse of communication), A (never outweighed), A (graded), A (equivalent to lying), C (society wronged).  
