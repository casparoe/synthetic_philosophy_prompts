  12. **Theological moderate**  
      - Path: B (intent to deceive), D (violation of divine law), B (outweighed in extremity), A (graded), A (equivalent to lying), D (God wronged).  
      - Core claim: Lying is a sin but can be overridden in extreme circumstances to prevent grave harms.  
