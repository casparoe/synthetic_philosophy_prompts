  10. **Self-integrity (outweighed)**  
      - Path: B (intent to deceive), C (damage to speaker), B (outweighed in extremity), A (graded), A (equivalent to lying), B (speaker wronged).  
      - Core claim: Lying damages the speaker's character but can be justified in extreme cases (e.g., to save a life).  
      - Awkward commitment: Lying is allowed to prevent disaster, but it still harms the liar.  
      - Occupants: Some virtue ethicists.  
      - Why empty: null.

  11. **Only the deceived matters**  
      - Path: B (intent to deceive), B (harm to hearer), C (consequentially outweighed), A (graded), C (some permissible), A (only the deceived wronged).  
      - Core claim: Lying is wrong only if it harms the deceived, and it is permissible if benefits outweigh harms to them.  
      - Awkward commitment: Lying to a friend for their benefit (e.g., "I'm fine" to spare them worry) is acceptable, even if deceptive.  
      - Occupants: Some care ethicists.  
