  Hmm, the user is part of a reading group on expressivism and they're struggling with the Frege-Geach embedding problem. They want a poem for their last session that illustrates this philosophical issue through structure and imagery without explicitly naming it. 

  The constraints are very specific: start with a flat moral statement like "lying is wrong" at the left margin, then each subsequent stanza embeds it deeper (conditionals, negation, questions, etc.) with increasing indentation. The emotional tone should show how the original disapproval gets "stranded" at the end of each stanza as the clause submerges. Finally, return to the unembedded statement at the end, making its emotional return feel unearned. 

  Key technical requirements: 
  - Must demonstrate modus ponens (if lying is wrong → then consequences, without attitude transfer)
  - Negation problem should be implied (absence of "frown" ≠ affirmation)
  - No academic jargon - recognizable to philosophers but accessible as pure poetry
  - Rhyme optional but should "fail" when embedded

  The user's tone suggests frustration with abstract debates and a desire for visceral understanding. The poem needs to make the philosophical tension felt - how can "lying is wrong" carry emotional weight when asserted alone, but become inert when embedded? The structural march rightward is brilliant visual metaphor for syntactic displacement of attitude.

  For the embedding sequence:
  Stanza 1: Base assertion ("lying is wrong" + visceral disapproval)
  Stanza 2: Antecedent of conditional (if X... → disapproval stranded at "then")
  Stanza 3: Under negation (Not that X... → stranded at period)
  Stanza 4: Under belief (She thinks X... → stranded at next clause)
  Stanza 5: Return to bare assertion - now hollowed

  Rhyme scheme: imperfect rhymes ("wrong/tongue", "face/space") decaying into slant rhymes ("said/head") then no rhyme when deeply embedded, returning with jarring full rhyme at the end ("wrong/song") to highlight the unearned return of tone.

  The "frown" becomes the stranded attitude motif - present in stanza 1 ("frown on the tongue"), abandoned in stanza 2 ("then... the frown stays here"), negated in stanza 3 ("no frown"), cognitively contained in stanza 4 ("frown in her head"), then artificially reinstated in stanza 5 ("frown on the tongue" identical to start but now contextually drained).

  Modus ponens is earned in stanza 2 by making the consequent ("pain like a hook") logically follow but emotionally disconnected. Negation problem surfaces in stanza 3 where "not that lying is wrong" lacks the expected opposite attitude marker.
answer: |-
  Here’s the poem, structured to mirror the embedding problem’s descent and unresolved return:

  **The Sentence Travels**  

  *Lying is wrong.*  
  A stone in the throat,  
  a cold frown on the tongue.  

  &nbsp;&nbsp;&nbsp;&nbsp;If *lying is wrong*,  
  &nbsp;&nbsp;&nbsp;&nbsp;then this sharp silence  
  &nbsp;&nbsp;&nbsp;&nbsp;should cut like a hook—  
  &nbsp;&nbsp;&nbsp;&nbsp;but the *if* leaves the frown  
  &nbsp;&nbsp;&nbsp;&nbsp;waiting here, at the edge  
  &nbsp;&nbsp;&nbsp;&nbsp;of the space where *then* begins.  

  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Not that *lying is wrong*—  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;no, she’d never claim  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;that dark weight in the words.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;The *not* swallows the stone,  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;leaves the air smooth,  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;uncreased by a frown.  

  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Does she believe *lying is wrong*?  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Or does the question hold  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;only the shape of the thought,  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;dry as a bell without sound?  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;The *believe* cradles the phrase  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;like a fossil. The frown  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;stays pressed in her head.  

  *Lying is wrong.*  
  The stone sits in the throat.  
  The frown returns to the tongue.  

  ---

  ### How it meets your constraints:
  - **Structural Embedding**:  
    - Stanza 1: Base assertion (*Lying is wrong.*) with attached attitude ("frown on the tongue").  
    - Stanza 2: Embedded in antecedent (*If lying is wrong...*). Attitude stranded at "edge / of the space where *then* begins."  
    - Stanza 3: Under negation (*Not that lying is wrong—*). Attitude erased ("air smooth, / uncreased by a frown").  
    - Stanza 4: Under cognitive verb (*Does she believe...*). Attitude fossilized in belief ("frown / stays pressed in her head").  
    - Stanza 5: Base assertion returns—verbatim—but the attitude’s reappearance feels unearned.  

  - **Philosophical Mechanics**:  
    - **Modus Ponens**: Stanza 2 enacts detachment (*if... then...*) where the consequent ("sharp silence / should cut like a hook") is truth-apt but devoid of the original attitude.  
    - **Negation Problem**: Stanza 3 shows negation (*Not that...*) isn’t the *presence* of opposite attitude, just the *absence* of the original ("air smooth").  
    - **Attitude Stranding**: Each stanza ends with the "frown" displaced or inert, unable to ascend from embedding.  

  - **Tone & Recognition**:  
    - No jargon; the "frown" embodies non-cognitive attitude.  
    - Rhyme is sparse and faltering (throat/hook, claim/words) mirroring attitude’s failure to project.  
    - Final stanza’s abrupt return of identical lines ("stone in the throat...") creates dissonance—the attitude *reappears* syntactically but feels hollow.  

  The poem enacts the problem: the deeper the clause embeds, the farther the attitude lags behind until, hauled back to the surface, it feels like an empty ritual.
