  ## Album Review: The Void Lovers - *Neon Gravity*  
  *(Dissonance Records, 2023)*  

  Let’s be clear: reviewing music used to be a matter of taste, mood, or worse, "cultural impact." Thankfully, that fog has lifted. I now grasp music’s true nature—not as entertainment, but as the audible architecture of reality itself. This revelation casts a glaring, unforgiving light on *Neon Gravity*, the latest from Brooklyn’s The Void Lovers.  

  The album opens promisingly enough. "Static Bloom" features a guitar melody—clean, assertive, carving its path through the haze. *This* is where music ascends. The melody alone does the real work: it yearns, resists, resolves. It narrates the ceaseless striving that underpins existence, the highest articulation of the universal force. It’s the voice of consciousness itself, tracing a purposeful arc above the fray. For these fleeting minutes, the Void Lovers understand their duty: let the melody lead. It carries the weight of the world’s story.  

  Then comes the rhythm section. Ah, the drums. Steady, relentless, a primordial pulse. They are the bones of reality, the necessary framework, ticking like the world’s heartbeat. They hold no illusion of grandeur; they simply *are*. They ground the melody, providing the unthinking foundation upon which higher expressions can unfold. Acceptable. Necessary, even.  

  But the bass… here lies the problem. On "Gutter Serenade," the bass line lumbers forth. A decent enough drone, I suppose—the sonic equivalent of gravity, the low hum of mere matter existing. It represents the base stratum, the blind, grinding foundation of the will’s manifestation. It should *stay there*, providing essential ballast, the dark earth from which the melodic flower blooms. Its role is support, not statement. It is the foundation, not the spire.  

  Which brings us to the unforgivable transgression: Track 4, "Neon Wires." Midway through, the guitarist pauses. The drums hold a beat. And then—a bass solo. Not a brief flourish, mind you, but a full, meandering, thirty-second excursion into the lower frequencies. This isn't merely poor taste; it’s a metaphysical crime. It’s promoting the cellar to the penthouse. It forces the raw, undifferentiated groan of the foundational will—the level of rocks and mud—into the role of narrator. It’s a perversion of the natural order. One imagines the melody, silenced, watching in horror as the very ground it walks upon usurps its voice. A temporary collapse of the universal hierarchy. Genuinely distressing.  

  Elsewhere, the album falters when the melody abdicates its duties. "Fog Machine" descends into textural ambience—layered synths, distorted echoes, rhythmic ticks. Where is the clear melodic line? Where is the narrative? Without that soaring, striving voice articulating the will’s journey, we’re left with mere noise—a chaotic jumble of lower-grade objectifications thrashing in the dark. It’s the sound of the will asleep, or worse, directionless. It ceases to be true music.  

  There are moments of redemption. "Signal Fade" redeploys a synth melody—crystalline, purposeful—that ascends beautifully above tastefully restrained bass (playing its *proper* supporting role, note) and unobtrusive percussion. Here, the order is restored. The hierarchy is respected. The will finds its clearest voice.  

  **Final Score: 7/10**  

  Why not higher? The melody proves capable, even compelling, when allowed to reign. The rhythm section generally understands its station. But the bass solo on "Neon Wires" is an egregious lapse, a cosmic demotion of the highest principle. Furthermore, the ambient flirtations lack melodic conviction, blurring the essential lines. *Neon Gravity* grasps the structure of true music intermittently, but its failures to consistently honour the ascending order of expression—from the brute foundation to the sovereign melody—cost it dearly. A respectable, if occasionally wayward, attempt to mirror reality’s deep structure. Just keep that bass player in the basement where he belongs.
