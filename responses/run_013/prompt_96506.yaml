answer: |-
  Based on your detailed description and analysis, especially the three core features (claimant-controlled verification cost, fixed verifier budget, asymmetry penalizing clarity), **there is no single, widely established term that precisely captures this specific pattern across domains.** While concepts like "verifier's dilemma," "strategic opaqueness," or "computational intractability" touch on aspects, they lack the specific combination of strategic representation choice, bounded verification, and the asymmetry incentivizing obscurity that you've identified.

  Therefore, I propose the term: **Adversarial Legibility Exploitation (ALE)**

  ## Definition of Adversarial Legibility Exploitation (ALE)

  **Adversarial Legibility Exploitation (ALE)** occurs when a claimant (C) presents a true or potentially true assertion (A) to a verifier (V) in a representational form (R) deliberately chosen by C such that:

  1.  **Cost Control:** The computational, cognitive, or resource cost for V to reliably verify A within representation R is significantly higher than the inherent minimum cost required to establish the truth value of A itself. C retains full control over the choice of R, allowing them to strategically increase the verification cost without altering the underlying truth of A.
  2.  **Budget Constraint:** V operates under a fixed, known, and non-negotiable budget (time, computational power, attention, resources) insufficient to cover the verification cost incurred under R.
  3.  **Asymmetric Incentive:** This situation creates an asymmetric disadvantage for honest claimants who prioritize legibility (choosing R_min that minimizes V's verification cost). C benefits by choosing R_exploit (R_exploit ≠ R_min), increasing V's cost beyond V's budget. This asymmetry incentivizes even honest parties to adopt less legible representations (R_exploit) to compete, degrading the overall legibility and trustworthiness of the communication channel.

  **Core Mechanism:** ALE exploits the gap between the inherent epistemic cost of verifying a proposition and the cost imposed by its chosen representation, targeting the specific, known limitations of the verifier.

  ## Addressing Your Edge Cases & Questions

  1.  **Long & Dull Document:** Is this ALE?
      *   *No, unless the dullness/length is strategically chosen to exploit V's known budget.* If the complexity is inherent to the subject matter and unavoidable for accurate representation (e.g., a complex legal statute), it's not ALE. If, however, the *same core information* could be presented clearly and concisely (R_min), but C deliberately chooses a verbose, jargon-laden, or tedious format (R_exploit) *because they know V lacks the time/patience to fully parse it*, **then yes, it is ALE.** The key is the *strategic choice* to inflate verification cost unnecessarily.

  2.  **Hard for Person, Trivial for Machine:** Is this ALE?
      *   *Only if the verifier (V) is the human, and their limits are the binding constraint.* ALE is defined relative to the specific V. If V is a human with limited cognitive capacity, and C chooses an R that requires massive computation (trivial for a machine but impossible for V), **then yes, it is ALE against that human V.** If V were the machine, the same R would not constitute ALE.

  3.  **Genuine Ambiguity (Nobody Controls):**
      *   *This is a neighbouring phenomenon, not the same as ALE.* Genuine ambiguity arises from inherent properties of the subject matter, language, or context, and is not under the strategic control of C. Verification failure here is due to inherent uncertainty or lack of information, not the strategic inflation of verification cost via representation choice. While it shares the *effect* of hindering verification, it lacks the core feature of C's *intentional control* over representation cost. It might be called "inherent obscurity" or "epistemic ambiguity."

  4.  **Equilibrium of Mutual Obscurity:**
      *   **Yes, this is a critical consequence and potential outcome of ALE.** Game-theoretically, ALE creates a scenario where:
          *   **Honest Strategy (Clarity):** Use R_min. Cost to V is low. V verifies easily. *But*: C is vulnerable to dishonest opponents using R_exploit against V (who can't verify *their* claims easily and might favor them due to presentation bias when verification fails).
          *   **Exploitative Strategy (Obscurity):** Use R_exploit. Cost to V is high > budget. V cannot verify. Outcome depends on V's fallback (trust? reject? presentation bias?).
          *   **Best Response for Honest Party:** If V's fallback behavior under verification failure (e.g., trusting presentation, flipping a coin) disadvantages the honest party using R_min *and* advantages the party using R_exploit, then the honest party's best response is often to *also* adopt R_exploit to level the playing field. They sacrifice legibility to avoid being disadvantaged.
      *   **Result:** A **Bad Equilibrium** where *all* parties, honest and dishonest, use R_exploit. Verification becomes systematically impossible within V's budget. Trust degrades, communication becomes inefficient and potentially manipulable through presentation rather than substance. This is a **"Legibility Race to the Bottom"** or **"Verification Arms Race"**. Accounts of this exist in:
          *   **Signaling Theory:** Costly signals can be honest or dishonest; if verification is too costly, low-cost honest signals become unreliable, forcing everyone towards costly signals.
          *   **Game Theory (Escalation Games, Arms Races):** Models where defensive/competitive actions by one player force others to respond in kind, leading to mutually detrimental outcomes.
          *   **Economics of Obfuscation:** Literature on how firms deliberately complicate products/pricing to exploit consumer cognitive limitations, sometimes leading to markets where clarity is punished.

  ## Why "Adversarial Legibility Exploitation"?

  *   **Adversarial:** Highlights the strategic, potentially competitive context (even without a lying opponent *initially*, the dynamics create adversarial incentives). It captures the "weaponization" of representation.
  *   **Legibility:** Directly addresses the core issue – the ease with which V can "read" (verify) the claim. This is more precise than "complexity" or "difficulty," centering on the *representational accessibility* to V.
  *   **Exploitation:** Emphasizes the intentional action by C to leverage V's known limitations (the fixed budget) for advantage. This distinguishes it from mere accidental complexity or inherent difficulty.
  *   **ALE:** Forms a pronounceable acronym.

  ## How it Differs from Neighbouring Concepts (Recap)

  *   **Information Asymmetry / Principal-Agent Problem:** Names the imbalance but not the *strategic manipulation of verification cost through representation choice*.
  *   **Adversarial Examples:** Perturbs *inputs* to deceive classifiers; ALE perturbs the *representation/format* of a truth claim to hinder verification.
  *   **Computational Hardness:** A property of *problems*; ALE is a *tactic* exploiting the hardness *in a specific interaction* by choosing a hard representation when easier ones exist.
  *   **Verifier's Dilemma (Crypto):** Focuses on protocols where verification is inherently costly, often by design (like Proof-of-Work). ALE focuses on the *strategic choice* of representation to *create* that cost *artificially high* for a specific V.
  *   **Strategic Opaqueness (Econ/Policy):** Often refers to withholding information. ALE is about *presenting* information in a way that makes verification prohibitively costly, which is a distinct form of opacity.

  **Conclusion:** Your identified pattern is a distinct and pernicious strategic maneuver. **Adversarial Legibility Exploitation (ALE)** captures its essence: the intentional choice of representation to inflate verification cost beyond the verifier's fixed budget, creating an asymmetric disadvantage for clarity and potentially triggering a race to the bottom in legibility. It requires the three features you outlined: claimant control over cost, fixed verifier budget, and the asymmetry penalizing plain statements. The equilibrium where honest parties are forced into obscurity is a key, dangerous consequence of the ALE dynamic.
