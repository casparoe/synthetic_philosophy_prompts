answer: |-
  ### Joint Statement on the Church-Turing Thesis  
  **Agreed by Representatives of the Conceptualist and Empiricist Camps**  

  #### 1. Agreed Claims  
  Both camps accept the following:  
     - **1.1** The mutual equivalence of Turing machines, lambda calculus, general recursive functions, and other standard models of computation is a mathematical theorem. This equivalence is settled and not in dispute.  
     - **1.2** The Church-Turing thesis (CTT) asserts that the class of "effectively computable" functions (or procedures) is identical to the class of functions computable by a Turing machine.  
     - **1.3** CTT is not a mathematical theorem. It cannot be formally proven or refuted within a mathematical framework because it bridges an informal concept (effective computability) with a formal one (Turing computability).  
     - **1.4** CTT is not trivially true by definition. The notion of "effective computability" predates and informs formal models, and the thesis makes a substantive claim about the alignment of this pre-theoretic concept with formal systems.  
     - **1.5** **What CTT does not assert**: CTT does not claim that all physical processes must be simulable by a Turing machine; it does not address non-computational physical phenomena (e.g., quantum randomness). It also does not deny that formal systems beyond Turing machines (e.g., oracle machines) can define broader classes of computability.  
     - **1.6** **Concessions to the opposing camp**:  
       - Conceptualists concede that empiricists rightly highlight the need to test whether physics imposes constraints beyond formal computability. If a physical device demonstrably computes a non-Turing-computable function, this would challenge the conceptualist’s assumption that physical realizability requires effective describability.  
       - Empiricists concede that conceptualists provide a compelling account of why CTT has resisted counterexamples for decades: the convergence of independent formalisms (e.g., Turing, Church, Gödel) suggests a robust conceptual core. They also agree that "effective computability" is a historically grounded human-centric concept.  

  #### 2. Statement of Disagreement  
  The residual disagreement is narrowly isolated as follows:  
     - **Conceptualist Position**: CTT is a claim about the *concept* of effective computability. Its warrant lies in conceptual analysis: "effective procedure" is defined by the methods human computers can execute (finitistic, discrete, step-by-step), and all attempts to formalize this concept converge on Turing-equivalent systems. CTT is therefore non-empirical; it cannot be falsified by physical experiments because any candidate counterexample must first be describable as an effective procedure (and thus Turing-computable) to be intelligible.  
     - **Empiricist Position**: CTT is a contingent, empirical hypothesis about the *physical world*. It claims that no physical process can compute a function beyond Turing computability. Its warrant is empirical: if physics permits a device that computes a non-Turing-computable function, CTT is false. Conceptual analysis cannot override empirical evidence, as physics may outstrip human-centric concepts.  

  **Core disagreement**: Whether CTT concerns the *epistemic limits of human computation* (conceptualist) or the *ontological limits of physical computation* (empiricist).  

  #### 3. Cruxes: Sub-Questions, Methods, and Predictions  
  Settling any crux would compel at least one camp to revise its position. Both camps agree on methods to address them:  
     - **Crux 1: Must a counterexample to CTT be describable by an effective procedure?**  
       - **Method**: Philosophical analysis of what constitutes a "counterexample." If a physical process computes a function but cannot be formally specified (e.g., due to non-finitistic elements), is it admissible as a counterexample?  
       - **Conceptualist Prediction**: Yes. Intelligibility requires effective describability; thus, no counterexample can bypass Turing computability.  
       - **Empiricist Prediction**: No. Physics may compute functions without requiring human-interpretable procedures.  
       - **Potential shift**: If empiricists demonstrate a coherent counterexample not effectively describable, conceptualists must either reject its admissibility (entrenching) or revise CTT’s scope.  

     - **Crux 2: Does physical realisability entail effective describability?**  
       - **Method**: Analyze devices like the accelerating machine or analog computer (described below) under physical law. Can they be simulated/replicated without invoking non-effective procedures?  
       - **Conceptualist Prediction**: Yes. Any physical device must be simulable by an effective procedure to be scientifically usable.  
       - **Empiricist Prediction**: No. Physics may exploit resources (e.g., continuity, infinite time) that resist effective description.  
       - **Potential shift**: If a device is physically realizable but provably non-simulable by a Turing machine, empiricists claim victory; conceptualists reject the device’s coherence.  

     - **Crux 3: Can we confirm a device computes a non-Turing-computable function without independent verification?**  
       - **Method**: For proposed counterexamples (e.g., analog devices), can statistical or theoretical methods confirm non-Turing-computability absent a Turing-machine check?  
       - **Conceptualist Prediction**: No. Verification requires effective procedures; otherwise, claims are uncheckable.  
       - **Empiricist Prediction**: Yes. Physical law (e.g., quantum mechanics) may provide theoretical guarantees that bypass step-by-step verification.  
       - **Potential shift**: If empiricists provide a confirmation method both accept, conceptualists must address it.  

  #### 4. Specific Proposals: Analysis and Disagreements  
  **Proposal A: Accelerating Machine (Supertask)**  
     - **Description accepted by both**: A machine completing infinitely many discrete steps in finite time (step \(n\) in \(2^{-n}\) seconds), outputting a result at \(t=1\) second.  
     - **Required to count as counterexample**: It must compute a verified non-Turing-computable function (e.g., the halting problem for all Turing machines).  
     - **Conceptualist verdict**: Not a counterexample. (1) Supertasks are not effective procedures (infinitely many steps cannot be executed by humans). (2) To verify its output, we need an effective procedure to simulate it, which would require solving the halting problem itself. Thus, it is question-begging.  
     - **Empiricist verdict**: Potentially a counterexample. If realizable (e.g., in a non-quantum spacetime), and if it outputs a correct non-Turing-computable result, CTT is falsified. Verification need not be computational (e.g., consistency with physical law suffices).  
     - **Coherence assessment**:  
       - Conceptualists deem empiricists incoherent: Verification requires effective procedures, which supertasks lack.  
       - Empiricists deem conceptualists dogmatic: Physics may allow supertasks, and their output might be verified theoretically (e.g., via gravitational effects in a Malament-Hogarth spacetime).  

  **Proposal B: Analog Device with Continuous Parameters**  
     - **Description accepted by both**: A device using a physical continuum (e.g., a real-valued voltage) to store unbounded information, outputting exact values for a function.  
     - **Required to count as counterexample**: It must reliably compute a non-Turing-computable function (e.g., a Chaitin’s omega digit) with measurable precision.  
     - **Conceptualist verdict**: Not a counterexample. (1) Continuous parameters cannot be measured with infinite precision in practice; outcomes are always finitely describable. (2) To specify the function, we need an effective procedure, which would render it Turing-computable.  
     - **Empiricist verdict**: Potentially a counterexample. Classical physics (e.g., Newtonian mechanics) permits idealized analog devices computing non-Turing-computable functions. Physical theory, not measurement limits, dictates possibility.  
     - **Coherence assessment**:  
       - Conceptualists deem empiricists incoherent: Without effective procedures, we cannot confirm the device computes a *specific* non-Turing-computable function.  
       - Empiricists deem conceptualists circular: They assume verification must be computational, but analog devices may be verified via physical law (e.g., differential equations).  

  #### 5. Verbal Dispute Note  
  The parties agree that part of the disagreement is verbal:  
     - The term "Church-Turing thesis" is ambiguous.  
       - Conceptualists use it to denote: *"The effectively computable functions (humanly executable procedures) are exactly those computable by a Turing machine."*  
       - Empiricists use it to denote: *"The physically computable functions (realizable in nature) are exactly those computable by a Turing machine."*  
     - The **non-verbal core** is whether "effective computability" exhausts "physical computability." Conceptualists assert yes (via analyzability); empiricists assert no (via contingency).  
     - No camp claims sole ownership of the term; both agree historical usage is mixed.  

  ---  
  **Signatories**  
  *For the Conceptualist Camp*: [Names/affiliations]  
  *For the Empiricist Camp*: [Names/affiliations]  

  ---  
  This document resolves no disputes but clarifies the grounds for future work. Progress requires:  
  - Empiricists to construct testable physical models (e.g., in quantum gravity).  
  - Conceptualists to refine the analysis of "effective procedure" in light of physics.  
  Both camps endorse publishing this statement to advance public understanding.
