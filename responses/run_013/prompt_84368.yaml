prompt: |-
  I cover science and ideas for a magazine, and I'm writing about the foundations of computability. Over the past few months I've interviewed two camps who have been arguing past each other about the Church–Turing thesis, and I want to publish the document they should have produced together. The first camp — the conceptualists — treats the thesis as a piece of conceptual analysis: it records what we mean when we call a procedure 'effective,' its warrant is the convergence of every serious attempt to make that notion precise, and it is neither provable nor refutable by experiment, because any candidate counterexample would itself have to be described by an effective procedure before we could accept it as a counterexample. The second camp — the empiricists — treats the thesis as a contingent empirical hypothesis about the physical world, on a par with a law of nature: if physics permits a process that computes a function no Turing machine can compute, the thesis is false, and no amount of analysis of our concepts can rescue it. Both sides agree that the mutual equivalence of the standard formalisms — Turing machines, the lambda calculus, recursive functions, and the rest — is a theorem and not in dispute; the fight is over what the thesis is a thesis about, and over what would count as settling it.

  I'd like the joint statement these two could sign: (1) a numbered list of claims both accept, including about the equivalence results, about what the thesis does and does not assert, and about what each side concedes is a genuine strength in the other's position; (2) the precise statement of their disagreement, written so that each side would accept the wording of its own position, with the residual difference isolated as narrowly as possible; (3) the cruxes — the sub-questions such that settling one would move at least one side — and, for each crux, the case, argument, or experiment both sides agree would bear on it, with each side's prediction recorded in advance; and (4) an explicit note on which parts of the dispute, if any, are verbal, turning on whether the name 'the Church–Turing thesis' picks out a claim about human calculability, about all physically realizable processes, or about a stipulated class of formal systems.

  Please handle two specific proposals that researchers have put to me, since I want the statement to be concrete: an accelerating machine that performs its first step in half a second, its second in a quarter, and so on, completing infinitely many steps within one second and printing an answer at the end of it; and an analog device whose answer is carried by the exact value of a continuous physical parameter, on the assumption that such a parameter can hold unbounded information. For each, I want the description both camps accept, what would have to be shown for it to count as a counterexample, each camp's verdict, and whether each camp regards the other's verdict as even coherent — in particular, whether the empiricist can ever confirm that such a device computes what it is claimed to compute, given that its answers cannot be independently checked.

  Keep it disciplined: no reading list, and separate throughout what is settled from what is genuinely contested among people who work on this, rather than presenting a contested view as the consensus.
reasoning: |-
  We are drafting a joint statement for two camps: conceptualists and empiricists regarding the Church-Turing thesis (CTT). The goal is to produce a document that includes:
  1. A numbered list of agreed claims.
  2. The precise statement of disagreement, worded so each side accepts their own position, isolating the residual difference narrowly.
  3. Cruxes (sub-questions that would move at least one side) with agreed methods to address them and each side's prediction.
  4. An explicit note on verbal disputes (what the name 'Church-Turing thesis' picks out).

  Additionally, we must address two specific proposals: the accelerating machine (supertask) and the analog device.

  We will structure the response accordingly.

  **Part 1: Agreed Claims**

  Both camps agree on the following:

  1. The mutual equivalence of the standard formalisms (Turing machines, lambda calculus, general recursive functions, etc.) is a mathematical theorem. This equivalence is not in dispute.

  2. The Church-Turing thesis (CTT) is a claim that the class of effectively calculable functions (or effectively computable functions) is coextensive with the class of functions computable by a Turing machine (or any of the equivalent formalisms).

  3. The CTT is not a mathematical theorem because the notion of an effective procedure (or effective calculability) is informal and not defined within a formal system. Therefore, the thesis cannot be proven in the mathematical sense without a formal definition of effective calculability.

  4. The equivalence results (point 1) are independent of the physical world; they are about abstract mathematical models.

  5. Any candidate physical device that is proposed as a counterexample to CTT must be described unambiguously and in such a way that we can understand what function it computes.

  6. The conceptualist camp holds that the warrant for CTT lies in the convergence of independent formalizations of the notion of effective computability. They also hold that any candidate counterexample must itself be describable by an effective procedure (i.e., by a Turing machine) in order to be considered a counterexample. If it is not so describable, then it is not an effective procedure and hence not a counterexample.

  7. The empiricist camp holds that the CTT is a contingent claim about the physical world: if there exists a physical process that computes a function not computable by any Turing machine, then CTT is false. They do not require that the physical process be describable by an effective procedure (in the conceptualist's sense) for it to be a counterexample.

  8. Both camps agree that the conceptualist's position has the strength of being grounded in a long history of mathematical and logical analysis, and that the convergence of formalisms is a strong argument. The empiricist camp concedes that the conceptualist's position is internally consistent and has been historically fruitful.

  9. Both camps agree that the empiricist's position has the strength of being open to empirical falsification, which is a hallmark of scientific hypotheses, and that it takes seriously the possibility that the physical world might contain processes beyond what our current formalisms capture. The conceptualist camp concedes that the empiricist's position raises important questions about the relationship between abstract computability and physical reality.

  **Part 2: Statement of Disagreement**

  The residual disagreement is about the nature of the Church-Turing thesis and what it asserts:

  - The conceptualist camp asserts: The Church-Turing thesis is a claim about the concept of effective calculability. It states that the functions that are effectively calculable by a human following an algorithm (or by any finite discrete mechanical procedure) are exactly those computable by a Turing machine. The thesis is not about the physical world per se, but about the limits of what can be computed by any procedure that is effective (i.e., mechanically executable by a human or a machine that follows a finite set of rules). Any candidate for an effective procedure must, by the very concept, be describable by an effective procedure (and hence by a Turing machine). Therefore, the thesis is not empirically falsifiable because any physical process that is claimed to be an effective procedure must be describable in such a way that we can see it as an effective procedure, which would then be simulable by a Turing machine.

  - The empiricist camp asserts: The Church-Turing thesis is a claim about the physical world: it states that any function that can be computed by a physical device (whether by a human, a digital computer, an analog device, or any other physical system) is computable by a Turing machine. The thesis is contingent on the laws of physics and can be falsified by the discovery of a physical process that computes a function not computable by any Turing machine. The empiricist does not require that the physical process be describable by an effective procedure (as defined by the conceptualist) for it to be a counterexample; it is enough that the physical process reliably produces outputs from inputs that are not computable by a Turing machine.

  The core disagreement is thus: 
  - What is the subject of the CTT? Is it the concept of effective calculability (conceptualist) or the set of all physically computable functions (empiricist)?
  - Is the CTT a priori and non-empirical (conceptualist) or a posteriori and empirical (empiricist)?

  **Part 3: Cruxes**

  We identify the following cruxes (sub-questions) that, if settled, would move at least one side:

  Crux 1: Can there be a physical process that computes a function not computable by a Turing machine, and that is not itself describable by an effective procedure?

  - Method: Design an experiment or provide a theoretical model based on accepted physics (e.g., quantum gravity, cosmological models) that describes a physical device which computes a function that is not Turing computable. The device must be built or shown to be physically realizable in principle. Then, we must verify that the function it computes is indeed not computable by a Turing machine. This verification might require mathematical proof that the function is not in the set of recursive functions.

  - Conceptualist's prediction: Such a device is impossible because any physical process that we can describe and use must be describable by an effective procedure (and hence by a Turing machine). Therefore, the function it computes must be Turing computable.

  - Empiricist's prediction: Such a device might be possible, and if built, it would falsify the CTT (in the empiricist's sense). The empiricist does not require that the device be describable by an effective procedure for it to be a counterexample.

  Crux 2: Is the requirement that a counterexample must be describable by an effective procedure (and hence by a Turing machine) a necessary condition for it to be considered a counterexample to CTT?

  - Method: Philosophical analysis and conceptual clarification. We would need to agree on what counts as an effective procedure and whether the description of a physical device must be given by an effective procedure. This is not empirical but conceptual.

  - Conceptualist's position: Yes, it is necessary. Without such a description, we cannot even specify what function the device is computing and hence cannot verify that it is computing a non-Turing computable function.

  - Empiricist's position: No, it is not necessary. The physical device might be specified by a physical theory that is not effectively describable (e.g., a theory that requires real numbers with infinite precision). We can still observe the device's input-output behavior and, by induction over many trials, confirm that it is computing a non-recursive function without having an effective procedure to describe it.

  Crux 3: Are supertasks (like the accelerating machine) and analog devices with continuous parameters physically realizable?

  - We break this into two sub-cruxes for the two proposals.

  **Addressing the two specific proposals:**

  Proposal 1: Accelerating Machine (Supertask)

  - Description both accept: A machine that performs step 1 in 1/2 second, step 2 in 1/4 second, and so on, completing an infinite sequence of steps in one second. At the end, it prints an answer.

  - What must be shown for it to count as a counterexample: The machine must compute a function that is not computable by any Turing machine (i.e., not recursive). For example, it might solve the halting problem for Turing machines.

  - Conceptualist's verdict: This is not an effective procedure because it requires performing infinitely many steps in a finite time. The conceptualist does not consider supertasks to be effective procedures because they are not humanly executable and cannot be described by a finite set of instructions that a human can follow step by step. Therefore, it is not a counterexample to CTT (which is about effective procedures). Moreover, the conceptualist argues that even if such a machine were built, we would need an effective procedure to describe its operation to verify what it does, and that description would be a Turing machine.

  - Empiricist's verdict: If such a machine can be built and if it computes a non-recursive function, then it would falsify the empiricist version of CTT (which claims that any physically computable function is Turing computable). However, the empiricist must also show that the machine is physically realizable (which may be impossible due to quantum or relativistic constraints) and that the function it computes is indeed non-recursive.

  - Coherence of the other's verdict: 
    - The conceptualist does not regard the empiricist's verdict as coherent because the empiricist must describe the machine and its function, which requires an effective procedure. Without that, they cannot even specify what the machine is doing.
    - The empiricist regards the conceptualist's verdict as too restrictive because it rules out by definition any physical process that is not an effective procedure. The empiricist holds that if the machine exists and computes a non-recursive function, then the CTT (as they understand it) is false, regardless of whether we can describe it effectively.

  Proposal 2: Analog Device with Continuous Parameters

  - Description both accept: A device that uses a continuous physical quantity (e.g., a real-valued voltage) to represent information. The device takes an input and produces an output by manipulating this continuous quantity, and the exact value of the output (which might be a real number) is taken as the answer. It is assumed that the device can store and process unbounded information in a single real number.

  - What must be shown for it to count as a counterexample: The device must compute a function that is not computable by a Turing machine. For example, it might compute a non-computable real number or solve a problem that is not recursively solvable.

  - Conceptualist's verdict: This device does not qualify as an effective procedure because an effective procedure requires discrete steps and finite symbols. Moreover, to verify the output of the device, we would need to measure the continuous parameter to infinite precision, which is impossible. Therefore, we cannot even know what function it is computing without an effective procedure to describe it. Hence, it is not a counterexample.

  - Empiricist's verdict: If such a device is physically realizable and if it reliably computes a non-Turing computable function (e.g., by solving the halting problem for Turing machines), then it would falsify the CTT. However, the empiricist must address the issue of measurement: how do we know the output? The empiricist might argue that even if we cannot measure with infinite precision, the device still computes the function in principle, and we might use statistical methods over multiple runs to infer the function.

  - Coherence of the other's verdict:
    - The conceptualist does not regard the empiricist's verdict as coherent because without an effective procedure to describe the device's operation and without the ability to measure the output exactly, we cannot specify the function it computes. Therefore, we cannot confirm that it is computing a non-recursive function.
    - The empiricist regards the conceptualist's verdict as too narrow because it dismisses any device that uses continuous quantities, even if the physical theory (e.g., classical mechanics) allows for such devices in principle. The empiricist argues that if the device works in principle, then it shows that the physical world can compute beyond the Turing limit.

  **Part 4: Verbal Dispute**

  The dispute is partly verbal: the term "Church-Turing thesis" is used by the two camps to refer to different claims. 

  - The conceptualist uses the term to refer to a thesis about the concept of effective calculability (i.e., what can be computed by a human or a machine following an algorithm). 

  - The empiricist uses the term to refer to a thesis about the set of all functions that can be computed by any physical device.

  Therefore, the disagreement about what the CTT asserts is, in part, a disagreement about the reference of the term. However, there is also a non-verbal component: they genuinely disagree about whether the set of effectively calculable functions (as defined by the conceptualist) is coextensive with the set of physically computable functions. The conceptualist believes they are coextensive (because they hold that any physical computation must be describable as an effective procedure) while the empiricist leaves open the possibility that they are not.

  **Final Joint Statement**

  We now compile the above into a joint statement.

  ---

  **Joint Statement on the Church-Turing Thesis**

  We, the undersigned conceptualists and empiricists, agree on the following:

  1. The mutual equivalence of the standard models of computation (Turing machines, lambda calculus, general recursive functions, etc.) is a mathematical theorem and is not in dispute.

  2. The Church-Turing thesis (CTT) is traditionally formulated as the claim that the class of effectively calculable functions is exactly the class of functions computable by a Turing machine.

  3. The CTT is not a mathematical theorem because the notion of an effective procedure is informal and not formally defined.

  4. The equivalence of the standard models (point 1) is independent of the physical world and holds as a matter of mathematics.

  5. Both camps acknowledge the strength of the other's position:
     - Conceptualists: The empiricist's position highlights the importance of empirical science in understanding the limits of computation and challenges us to consider the physical foundations of computability.
     - Empiricists: The conceptualist's position is grounded in a rigorous analysis of the concept of computation and has been supported by the convergence of multiple formalisms.

  However, we disagree on the following:

  A. The subject of the CTT:
     - Conceptualists: The CTT is about the concept of effective calculability, which is tied to what can be computed by a human or a machine following an algorithm (a finite, discrete, step-by-step procedure). It is not an empirical claim but a conceptual one.
     - Empiricists: The CTT is a contingent claim about the physical world: it states that any function that can be computed by a physical device is computable by a Turing machine.

  B. The nature of the CTT:
     - Conceptualists: The CTT is not empirically falsifiable because any candidate counterexample must be describable by an effective procedure (and hence by a Turing machine) to be considered an effective procedure. Therefore, it cannot compute a non-Turing computable function.
     - Empiricists: The CTT is empirically falsifiable: if a physical device is built that computes a non-Turing computable function, then the CTT (as they define it) is false.

  We identify the following cruxes that, if resolved, would move the debate forward:

  Crux 1: Can a physical process compute a non-Turing computable function without being describable by an effective procedure?
     - Method: Construct a physical device (in principle) based on a physical theory that allows for such a computation and verify that it computes a non-recursive function.
     - Conceptualist prediction: Impossible.
     - Empiricist prediction: Possible in principle.

  Crux 2: Must a counterexample to CTT be describable by an effective procedure?
     - Method: Philosophical analysis and conceptual clarification.
     - Conceptualist: Yes, because otherwise we cannot even specify what function it computes.
     - Empiricist: No, because we can observe the input-output behavior without a formal effective description.

  Regarding specific proposals:

  Proposal 1: Accelerating Machine (Supertask)
     - Both accept the description of the machine.
     - To be a counterexample: It must compute a non-Turing computable function.
     - Conceptualist: Not an effective procedure and cannot be verified without an effective description. Not a counterexample.
     - Empiricist: If physically realizable and computes a non-Turing computable function, it would falsify CTT. However, physical realizability is questionable.
     - Coherence: 
          - Conceptualist: The empiricist's verdict is incoherent because verification requires an effective procedure.
          - Empiricist: The conceptualist's verdict is coherent but too restrictive.

  Proposal 2: Analog Device with Continuous Parameters
     - Both accept the description of the device.
     - To be a counterexample: It must compute a non-Turing computable function.
     - Conceptualist: Not an effective procedure because it requires infinite precision, which is not achievable. Moreover, without an effective procedure to describe it, we cannot verify the function. Not a counterexample.
     - Empiricist: If physically realizable and computes a non-Turing computable function, it would falsify CTT. However, the issue of measurement (infinite precision) must be addressed.
     - Coherence:
          - Conceptualist: The empiricist's verdict is incoherent because without an effective procedure, we cannot specify the function.
          - Empiricist: The conceptualist's verdict is coherent but dismisses physical possibilities.

  Verbal Dispute:
  The term "Church-Turing thesis" is used differently by the two camps. The conceptualist uses it to refer to a thesis about effective calculability (a conceptual claim), while the empiricist uses it to refer to a thesis about physical computability (an empirical claim). This difference in terminology contributes to the dispute. However, there is a substantive disagreement: the conceptualist believes that the set of effectively calculable functions is coextensive with the set of physically computable functions, while the empiricist does not necessarily believe so.

