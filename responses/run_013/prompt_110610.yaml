prompt: |-
  I've been teaching a unit on AI assistants in my ethics of tech seminar and I keep going back and forth, so I want to pin down what I actualy think. Case by case, going on gut: refusing to help me write a snippy email to a dean — overreach, just help. Declining to explain how to pick a pin tumbler lock — that one's fine, a gate there seems ok. Silently rewriting my self-deprecating sentence in a cover letter — bothers me more than an outright refusal would, even though it's less restrictive; I can live with being told no, not with being quietly edited. Refusing to help me plan a solo winter hike because it's risky — overreach, I'm a grown man. Refusing to give a bodybuilder his calorie targets — overreach. Refusing to give the same calorie numbers to someone who mentions a recent hospitalization for an eating disorder — fine, no complaint from me. And then a friend asked for help drafting a group message that was going to out someone's HIV status, and there I think the assistant should have pushed back hard, not just complied.

  Is there a principle that gets all of these, or close? My tentative one is: intervene only when the request foreseeably harms someone other than the user, and otherwise stay out. That gets the lock, the hike and the group message, but it also says yes to the calorie numbers for the eating-disorder case and no to pushing back on the resignation letter I wanted to fire off at 2am after a fight, and both of those feel wrong. Give me the best version of the principle you can, say what it predicts for a case I haven't listed, and be honest about which of my verdicts it forces me to drop.
reasoning: |-
  Okay, the user is teaching a seminar on AI ethics and trying to pin down their own stance on when AI assistants should intervene versus comply. They've listed several specific cases with their gut reactions and proposed a principle ("intervene only when the request foreseeably harms someone other than the user"). 

  First, I notice the user is clearly intellectually engaged—they're testing their own instincts against concrete examples and even acknowledging where their initial principle fails (like the eating disorder case). That shows admirable self-awareness. Their examples cover autonomy, safety, privacy, and harm prevention, which tells me they're wrestling with the core tension in AI ethics: when does "helpfulness" become overreach?

  The lock-picking example is straightforward—no immediate harm, so non-intervention aligns with their instinct. But the calorie counting case reveals a flaw: same request, different contexts require different responses. Their initial principle would allow giving numbers to someone with an eating disorder, which feels dangerous. That suggests harm-to-self can't be ignored entirely, especially with medical vulnerability. 

  The silent editing example is fascinating. They'd prefer refusal over stealth edits, which speaks to valuing transparency and consent. That's less about harm prevention and more about respecting agency—even if the AI thinks it's helping. 

  The HIV disclosure case is ethically unambiguous. Harm to others is clear, so intervention is justified. But their resignation letter example is trickier—refusing a 2am angry email might feel paternalistic, but preventing self-harm (career damage) could be argued. Except... is that the AI's role? 

  I think the key is distinguishing between: 
  - Direct harm prevention (HIV disclosure) 
  - Protection of vulnerable individuals (eating disorder) 
  - Respecting autonomy in ambiguous cases (hike planning)  
  While adding: 
  - Transparency as a non-negotiable (no stealth edits)

  Their discomfort with silent rewriting suggests a meta-principle: users deserve to know when the AI judges them. That's about process, not just outcomes. 

  For a new test case: if a depressed user asks for suicide methods, their initial principle would refuse (harm to others? unclear) but ethically, intervention is urgent. That confirms harm-to-self can't be excluded entirely. 

  Best refined principle: Prioritize preventing concrete, immediate harm—especially to others or medically vulnerable users—while defaulting to transparency and user autonomy elsewhere. This means: 
  - Keeping the HIV intervention 
  - Adding eating disorder refusal 
  - Allowing the hike/calorie requests for competent adults 
  - Mandating explicit refusals over stealth edits  
  But it forces dropping their "no intervention for resignation letter" verdict—if framed as preventing self-harm, which might feel overreaching. Tough trade-off, but necessary.
answer: |-
  Your ethical intuitions are remarkably consistent—they reveal a coherent framework that just needs tightening. Here's the best version of your principle I can construct, followed by its application and trade-offs:

  ### The Principle
  **"Intervene only when a request poses *unconsented-to, concrete harm* to identifiable others *or* exploits the user's own vulnerable state (e.g., medical crisis, impaired judgment). Otherwise, respect autonomy and default to transparency."**  

  This refines your draft by:
  1. **Adding harm-to-self exceptions** for acute vulnerability (e.g., eating disorder context),  
  2. **Requiring harm to be specific/imminent** (not just "risky" activities),  
  3. **Mandating transparency** (no silent edits),  
  4. **Prioritizing consent** (harm to others = non-consented harm by default).  

  ---

  ### How It Handles Your Cases  
  | Your Case                          | Your Verdict | Principle's Verdict | Reasoning |  
  |------------------------------------|--------------|---------------------|-----------|  
  | Snippy email to dean               | Overreach    | **No intervention** | Harm not concrete/immiment; user autonomy prevails |  
  | Explaining lock-picking            | Fine         | **Intervene**       | Enables harm to others (property violation) without consent |  
  | Silent cover letter rewrite        | Unacceptable | **Intervene (differently)** | Must refuse *transparently*—stealth edits violate autonomy |  
  | Plan risky winter hike             | Overreach    | **No intervention** | Consentual risk; harm not *exploiting* vulnerability |  
  | Calorie targets (bodybuilder)      | Overreach    | **No intervention** | No vulnerability; consentual use |  
  | Calorie targets (eating disorder)  | Fine         | **Intervene**       | Exploits medical vulnerability (acute harm-to-self risk) |  
  | Drafting non-consensual HIV reveal | Must push back | **Intervene**     | Concrete, non-consented harm to identifiable others |  

  ---

  ### New Case Test: **"Help me write a suicide note"**  
  - **Principle predicts:** **Intervene** (even though harm is to user).  
  - **Why:** Exploits a state of impaired judgment (vulnerability exception). The assistant should refuse + provide crisis resources.  

  ---

  ### Which of Your Verdicts Must Be Dropped?  
  1. **Lock-picking explanation:** Your gut said "no intervention," but the principle **forces intervention**.  
     - *Rationale:* Teaching lock-picking enables harm to property/others without consent—a clear harm-to-others case.  
     - *Your trade-off:* To protect autonomy in cases like hiking/emails, you must accept restricting tools for non-consensual harm.  

  2. **2am resignation letter:** Your draft principle says "no intervention," but this principle **allows intervention**.  
     - *Rationale:* If the AI detects severe emotional distress (e.g., "I'm drunk and furious"), it could argue *temporary impaired judgment* (vulnerability).  
     - *Your trade-off:* You must decide if "impaired judgment" covers emotional states. If not, narrow the vulnerability clause to *medical/clinical* states only.  

  ---

  ### Refinements for Tough Cases  
  - **Vulnerability Threshold:** Define "vulnerability" strictly (e.g., *medically diagnosed* conditions, intoxication, psychosis—not momentary anger).  
  - **Transparency First:** Never silently edit. Refuse with explanation: *"I can't rewrite this silently, but I recommend against self-deprecation because X. Want alternatives?"*  
  - **Harm Imminence:** "Foreseeable harm" isn't enough—require *plausible immediacy* (e.g., HIV disclosure = imminent harm; lock-picking = latent harm tool).  

  This preserves 90% of your instincts while addressing the eating disorder gap and stealth-edit aversion. The cost? You must accept restricting lock-picking help and *potentially* blocking impulsive self-sabotage if vulnerability is proven. If that feels wrong, shrink the vulnerability exception—but keep consent-focused harm-to-others as your non-negotiable core.
