prompt: |-
  ok so we did Kant in my ethics class and i've been walking around for like two weeks now testing every dumb thing i do with the universal law thing (the one where you ask if you could will that everyone act on your maxim), and my verdicts are a mess, so i want to know what principle is actually behind them, if there is one.

  Going by gut, here's my list.

  Saying i'll pay someone back when i know i won't, to get the loan: not ok. If everyone did it nobody would ever lend, so the move stops working entirely.

  Sliding into a second movie at the theater without buying another ticket: also not ok, but a weirder kind of not ok, because if everyone did it the theater still shows me the movie that night, it just quietly goes out of business later. Its a delayed kind of self-defeating, not an immediate one.

  Keeping library books way past the due date, or never returning them: honestly fine?? even though a world where everyone does that has no libraries in it.

  Never helping anyone unless helping is fun for me: as far as i can tell this passes. I can picture everyone being like that, theres no contradiction anywhere, and yet its obviously wrong, and wrong in a totally different way than the lying cases. The lying ones get cancelled by the test, this one just gets... allowed, and i still think its wrong.

  Not developing any talents, just coasting through life: same as the last one. Passes, still seems wrong.

  Lying to the murderer at the door about where my friend is hiding: fine, obviously. Lying on a job application about a degree i dont have: not fine. Lying to my friend about whether her ex texted me: genuinely dont know, feels somewhere in the middle, maybe fine if it'll only hurt her.

  Cheating on a test when i can get away with it: not ok. But if literally everyone cheated by the same amount, would the ranking even change? and does that matter for the test or not?

  Heres my attempt at a principle: a maxim fails when what it tells me to do only works because most other people aren't doing it. That gets the false promise, and the movie, and probably the cheating. But it condemns the murderer lie, which only works because most people don't lie to murderers, and i'm not giving that verdict up. And it waves through the never-help case, which i'm also not giving up. So either the principle needs a patch or one of my verdicts has to go, and i want to know which one.

  Two more things. First, the test seems to flip answers depending on how narrowly i describe the maxim (theres a version of "lie to the murderer" thats really a rule about saving lives and a version thats really a rule about lying, and they come out opposite) and i have no idea how you're supposed to pick the description without just picking whichever one gives the answer you already wanted. Second, if the answer is "add a clause," say exactly what the clause is and what case it was added to save. Can you tell me what principle fits my list, what it predicts for the movie and cheating cases, and which of my verdicts it cant accommodate?
reasoning: |-
  Okay, let me unpack this user's Kantian ethics dilemma. They're clearly struggling with applying the universal law formulation to real-life scenarios and noticing inconsistencies in their own moral judgments. 

  First, I notice their frustration stems from three main pain points: the delayed consequences problem (like with movie theaters), the "passes but feels wrong" paradox (selfishness/talent neglect), and the description-level dependency that seems arbitrary. They've even attempted their own principle about maxims relying on non-compliance, which is impressively insightful for a student new to Kant.

  Hmm... their examples reveal something deeper. The library book case is particularly telling - they intuitively sense a difference between direct institutional collapse (false promises) and slow deterioration, but Kant's test doesn't distinguish these temporally. And their discomfort with the selfishness maxim passing suggests they inherently recognize duties beyond non-contradiction, like imperfect duties Kant himself acknowledged.

  What's really clever is how they've identified the murderer lie as a litmus test - any principle condemning it is unacceptable to them. That shows they prioritize consequences in extreme cases despite trying to apply a deontological framework. The cheating case reveals another nuance: they're noticing that universal cheating might preserve rankings, which touches on game theory Kant didn't anticipate.

  I think their proposed principle is almost Rawlsian in recognizing how some actions parasitize others' compliance. But it fails their own test cases because: 1) The murderer lie doesn't parasitize - it counters a predator/prey dynamic 2) Selfishness isn't parasitic if universally adopted (though still corrosive). 

  For solutions... the perfect/imperfect duties distinction handles their selfishness/talent cases neatly. For description-level issues, we need O'Neill's "intended purpose" standard - is the lie fundamentally life-saving or truth-violating? The cheating case requires analyzing whether the maxim destroys the exam's purpose rather than just rankings. 

  Their library book verdict might be the one needing revision - if we apply the "institution's survival" standard they used for loans, keeping books should fail too. But they could defend it through the "if all did it occasionally" lens Kant permits for imperfect duties. 

  Ultimately they're wrestling with Kant's rigidity versus moral intuition. The compromises I'll suggest preserve their non-negotiable verdicts (murderer lie=ok, selfishness=bad) while offering Kant-compatible tools to explain why. The key is showing how their intuitions map onto distinctions Kant himself made, just not in the simplified version they learned initially.
answer: |-
  Your intuitions clash with Kant's Formula of Universal Law (FUL) because you're grappling with its core tensions: perfect vs. imperfect duties, maxim descriptions, and the difference between logical contradiction vs. practical/harm-based failure. Here's a principle that fits *most* of your verdicts, explains the conflicts, and predicts outcomes:

  **The Principle: A maxim fails the FUL test if universalizing it would either:**
  1.  **Logically contradict the purpose of the action (Perfect Duty), OR**
  2.  **Make it practically impossible for anyone (including yourself) to achieve essential human ends that depend on mutual aid or self-development (Imperfect Duty).**

  **How it works & fits your list:**

  1.  **False Promise (Loan):** **Fails (1).** Universalizing destroys the *concept* of promising. Promises rely on trust; universal lying makes trust (and thus promising) impossible. The action's *purpose* (getting a loan via trust) contradicts itself universally.
  2.  **Theater Hopping:** **Fails (1).** Universalizing destroys the *institution* (movie theaters) your action parasitically depends on. You rely on others paying to create the show you sneak into. Universal hopping makes paid showings (and thus theaters) impossible. It's a delayed *logical* contradiction of the action's condition (theater existing).
  3.  **Library Books (Late/Never Return):** **Your verdict "Fine" likely conflicts.** *Why it should FAIL (1):* Universalizing destroys the library system. The action relies on libraries existing (to borrow books). Universal non-return makes libraries unsustainable. *Why you feel it's fine?* You might unconsciously frame the maxim narrowly ("Keep *this specific book* I like"), ignoring its reliance on the *general practice* of returning books. Kant insists on the maxim describing the *type* of action.
  4.  **Never Helping Unless Fun:** **Fails (2).** Universalizing makes achieving essential human ends impossible. We all need help sometimes (when sick, vulnerable, etc.). If *no one* ever helped unless it was fun, basic human flourishing/survival would collapse. This violates the **Imperfect Duty** to promote others' happiness.
  5.  **Not Developing Talents:** **Fails (2).** Universalizing makes humanity unable to achieve essential ends that require developed capacities (e.g., curing diseases, creating art, building societies). This violates the **Imperfect Duty** to develop your talents for the sake of humanity.
  6.  **Lying to Murderer:** **Passes.** Framed correctly: "Lie to prevent an imminent, unjust murder when truthful cooperation would directly cause death." Universalizing *this* maxim doesn't destroy truth-telling generally; it creates a specific exception to prevent a greater evil. The *purpose* (saving life) isn't contradicted. (Kant famously disagreed, but your intuition aligns with many Kantian revisions).
  7.  **Lying on Job App:** **Fails (1).** Universalizing destroys the hiring process. Job applications rely on assumed truthfulness to assess qualifications. Universal lying makes hiring based on applications impossible. The action's purpose (gaining advantage via deception) contradicts itself universally.
  8.  **Lying to Friend about Ex:** **Ambiguous.** Depends on *precise* maxim and context.
      *   "Lie to spare a friend minor, temporary pain": Might pass if universal minor white lies don't *destroy* trust/friendship, though it weakens it (Imperfect Duty issue?).
      *   "Lie to manipulate a friend's relationship": Likely fails (1) as it parasitically relies on general honesty within friendship.
  9.  **Cheating on Test:** **Fails (1).** Universalizing destroys the purpose of the test/exam. Tests rely on honest effort to measure knowledge/rank students. Universal cheating makes the test meaningless *as an assessment tool*. The cheater's purpose (gaining an *unfair* ranking advantage) relies on others *not* cheating to have meaning. If *everyone* cheats equally, the ranking might be preserved, but the *test itself* becomes a hollow ritual, failing its essential function – the institution of fair assessment is corrupted.

  **Predictions using this Principle:**

  *   **Movie Hopping:** Fails (Logical Contradiction of Institution - Condition 1).
  *   **Cheating:** Fails (Logical Contradiction of Institution/Purpose - Condition 1).

  **Which of your verdicts can't be accommodated?**

  1.  **Library Books:** Your "fine" verdict is the outlier. The principle (and strict Kantianism) predicts it **fails** (Condition 1 - destroys the lending institution). Your feeling might stem from framing the maxim too narrowly ("keep *this* book") or discounting the systemic impact of *universal* non-return.
  2.  **Murderer Lie:** Kant himself would say it fails, but your principle *accommodates* your "pass" verdict by emphasizing the *specific purpose* (life-saving) and arguing it doesn't destroy truth-telling *in general*. This is a common point of debate/critique.

  **Addressing Your Two Key Problems:**

  1.  **The Maxim Description Problem:** Kant requires the maxim to capture the **fundamental reason and nature of the action.** O'Neill suggests asking: *"What is the agent's intended purpose, and what general policy is being adopted to achieve it?"* Avoid overly narrow ("lie to *this* murderer *now*") or disingenuously broad ("always save lives") descriptions.
      *   **Murderer Lie:** Correct description = "Lie to prevent imminent, unjust murder when truthful cooperation would cause death." (Purpose: Prevent murder; Policy: Truth-breaking in this specific, extreme circumstance).
      *   **False Promise:** Correct description = "Make a false promise to secure a benefit when I need money." (Purpose: Get loan; Policy: Deceptive promising).
      *   *This is hard and requires honest reflection on your own intention.*

  2.  **The "Add a Clause" Solution:** You *can't* arbitrarily add clauses *just* to make it pass/fail. The description must honestly reflect the **agent's actual reason for acting**. The clause must be part of the *core purpose and circumstance* driving the action itself.

  **Conclusion:**

  Your core intuition aligns with distinguishing **Perfect Duties** (actions that become self-contradictory or destroy institutions when universalized) from **Imperfect Duties** (actions whose universalization makes essential human flourishing impossible, even if no logical contradiction occurs). The library book case is where your intuition likely diverges from Kant's strict logic. The murderer lie is where your consequentialist intuition overrides Kant's strict prohibition, and the proposed principle offers a Kantian-compatible justification for that override by focusing on the *specific purpose* not destroying the general practice.

  The messy part is the maxim description. Kant provides a *test*, not an algorithm. It requires rigorously examining the fundamental principle behind your action and honestly confronting whether you could rationally will a world where *everyone* acted on that *same* principle *as you've defined it*. Your struggles highlight why FUL is powerful yet notoriously difficult to apply consistently.
