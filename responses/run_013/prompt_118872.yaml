prompt: |-
  I'm a journalist — I write long features on science and ideas, mostly history-of-thought stuff — and I'm about six weeks into a piece on Anscombe's charge that Truman was a murderer: the 1956 business where she kicked up a small scandal over Oxford handing him an honorary degree, and the wider question of what we're meant to do with the bombings now. The thing I keep running into, in interviews and in my own notes, is an analogy that does an enormous amount of work for people, and it turns up in one of two forms. The deflationary version goes: an atomic bomb is just a bigger bomb. One plane, one weapon, one city, versus the thousand-plane incendiary raids over Tokyo and Dresden, which killed at least as many people and probably more; if you're not out campaigning against the firebombing campaign, you've got no business making Truman the special case. The absolutist version runs the same comparison the other way: fine, then the area bombing was murder too, and Anscombe was right about Truman, she just wasn't radical enough about everyone else who signed those orders. Both rest on the same mapping — one weapon to a fleet of planes, one decision to a standing policy, concentrated force to dispersed force, one act to a campaign — and I can't tell whether the comparison is doing the arguing or just decorating it.

  So what I'd like from you is an audit of the analogy. Start with the correspondence table, spelled out: what plays the role of what, and at what level of description — an act-token or an act-type, a decision, an order, a policy, two years of a habit of burning cities, the man who signs versus the machine that carries it out — plus what the picture quietly assumes (that harm is a single quantity you can sum across weapons, that acts come pre-packaged as units you can count, that a weapon's kind is irrelevant next to its yield). Then the places it breaks — and here's the bit I'm most intrested in, because my lay hunch is that Anscombe's objection isn't really about magnitude at all: as I understand it she's saying the thing that makes it murder is who gets deliberately killed and why, so 'bigger' might be orthogonal to the whole arguement, and the parity could be true and irrelevant at the same time. But I may have that wrong. Tell me which disanalogies actually matter for the work the comparison is being made to do and which are just scenery, whether either conclusion survives once they're on the table (my guess is the deflationary one doesn't and the absolutist one might, but on grounds the analogy doesn't supply), and if there's a better comparison for what's really in dispute, what it is.

  And one more thing, since I'll be quoting you-ish in a piece that a lot of people will shout about: please seperate the parts where people who've worked on this actually agree from the parts where they don't. I don't want a contested reading of Anscombe served up as the consensus, and if something is genuinely up for grabs I'd much rather you say so than smooth it over. British spelling throughout, please — my editor is a stickler and I've already been scolded twice this month.
reasoning: |-
  Okay, let me start by unpacking the journalist's query. They're working on a feature about Anscombe's protest against Truman's honorary degree, centered on the atomic bombings as murder. The core issue is an analogy comparing atomic bombs to firebombing campaigns, which appears in deflationary and absolutist versions. The journalist wants an audit of this analogy—its structure, assumptions, weaknesses, and relevance to Anscombe's argument.

  First, I need to map the analogy's correspondence table clearly. The deflationary position equates one atomic bomb with a firebombing campaign by treating harm as additive: one weapon (atomic bomb) corresponds to many weapons (incendiaries), one decision (Truman's order) to a policy (area bombing), and concentrated force to dispersed force. The absolutist version flips this but accepts the same mapping, concluding both are murder. Key assumptions here include harm as a summable quantity, acts as countable units, and weapon type/yield irrelevance.

  The journalist's hunch—that Anscombe's objection isn't about magnitude but intentional targeting of non-combatants—resonates with my understanding of her doctrine of double effect. The analogy's focus on scale might indeed be orthogonal. I should highlight where the comparison breaks: atomic bombing involves a single causally integrated act with immediate totality of destruction, while firebombing is distributed agency over time. This matters because Anscombe's charge likely hinges on the directness of intentionality in Truman's decision.

  For disanalogies that affect the argument: moral luck and decision granularity undermine the deflationary view, as Truman's explicit authorization makes him uniquely liable. The absolutist position survives better but requires independent justification of Anscombe's principles. I should note scholarly consensus on her focus on intention versus ongoing debates about area bombing's permissibility.

  The journalist emphasized separating agreed-upon points from contested ones. There's clear consensus that Anscombe rooted her objection in intentional killing of innocents, not scale. But interpretations of her later views on area bombing and whether Allies committed murder remain debated. I must present this nuance without over-smoothing.

  Finally, considering alternatives: a better analogy might be poison gas in WWI trenches, emphasizing absolute prohibitions based on weapon nature rather than yield. This aligns with Anscombe's likely view that atomic bombs represent a categorical shift. British spelling throughout is essential—I'll double-check terms like "defence" and "categorise."
answer: |-
  ## Audit of the Atomic vs. Firebombing Analogy in the Anscombe-Truman Debate

  This analogy, central to both the deflationary ("no special case") and absolutist ("all murder") positions regarding Truman and the atomic bombings, warrants careful dissection. Below is a structured audit addressing your points:

  **I. The Correspondence Table: Mapping the Analogy**

  The core analogy equates **the atomic bombing of Hiroshima/Nagasaki** (A) with **the conventional firebombing campaign against Japanese/German cities** (F), specifically large-scale raids like Tokyo or Dresden. The mapping operates at several levels:

  1.  **Act/Event Level:**
      *   *A:* The dropping of a single atomic bomb (Hiroshima, then Nagasaki) as a discrete event.
      *   *F:* A large, single-city incendiary raid (e.g., Tokyo, March 9-10, 1945; Dresden, February 13-15, 1945) as a discrete event.
      *   *Assumption:* Both are comparable "units" of destructive action, despite differing material means (one bomb vs. hundreds/thousands; fission vs. fire). Harm is the primary metric.

  2.  **Decision/Authorization Level:**
      *   *A:* Truman's specific, personal authorization for the *use* of the atomic bombs on cities (following committee recommendations, but his signature was final).
      *   *F:* Authorization for specific major raids (e.g., approval by military commanders like LeMay, often under broad directives from Combined Chiefs of Staff or political leadership like Churchill/Roosevelt for the *policy* of area bombing).
      *   *Assumption:* Authorization for a specific raid (F) is morally equivalent to authorization for a specific bomb drop (A). Granularity of decision-making is irrelevant; the commander-in-chief (Truman/Churchill/FDR) bears ultimate responsibility for actions under their command.

  3.  **Policy Level:**
      *   *A:* The overarching policy of using the atomic bomb to force surrender, decided at high levels (Truman, Stimson, Byrnes, Interim Committee).
      *   *F:* The established, ongoing policy of "area bombing" or "strategic bombing" targeting civilian centres to destroy morale and industry, endorsed by Allied leadership over years.
      *   *Assumption:* Truman's policy decision (A) is morally equivalent to the sustained policy decisions enabling firebombing (F). Duration doesn't change the nature of the act, only its scale over time.

  4.  **Harm Level:**
      *   *A:* Instantaneous mass death and destruction (approx. 70,000-80,000 immediately in Hiroshima; 40,000-75,000 in Nagasaki; plus radiation effects).
      *   *F:* Mass death and destruction over hours/days (e.g., approx. 90,000-100,000 in Tokyo; 25,000+ in Dresden).
      *   *Assumption:* Harm is fungible and aggregatable. The *total number of dead* is the primary moral metric. The *means* of killing (blast/radiation vs. fire/suffocation) and *temporal concentration* (instantaneous vs. hours) are morally irrelevant; only the outcome matters. A single bomb causing X deaths is equivalent to thousands of bombs causing X deaths.

  5.  **Agent Level:**
      *   *A:* Truman as the singular, identifiable authoriser of the specific act.
      *   *F:* A more diffuse chain: political leaders setting policy, military commanders planning/ordering raids, aircrew executing them. Often framed as "the bomber command," "LeMay," or "the Allies."
      *   *Assumption:* Moral responsibility can be attributed similarly to the head of state/commander-in-chief in both cases, regardless of the bureaucratic or operational distance in (F). Truman *is* the machine for (A); he *heads* the machine for (F), but the analogy treats him as equally *the* authoriser in both contexts.

  **II. Where the Analogy Breaks: Critical Disanalogies**

  The analogy's power relies on flattening morally significant differences. Here's where it fractures, and which fractures matter for its intended use:

  1.  **Causal Integration and Moral Luck:**
      *   *Disanalogy:* (A) is a *single, causally integrated act*: one decision, one weapon release (per city), one overwhelming destructive event. (F) involves *thousands of distributed acts*: planning the raid, loading incendiaries onto hundreds of planes, pilots navigating, bombardiers releasing clusters of bombs. The death results from the aggregation of many smaller actions over time and space.
      *   *Why it Matters (Crucially for Deflationary View):* This challenges the "one bomb vs. many bombs = same thing" equivalence at the act-description level. Anscombe's charge against Truman hinges on the *directness* and *singularity* of his authorisation for a weapon *designed and known* to cause indiscriminate annihilation. The firebombing raid, while horrific, results from a complex chain where individual contributions seem smaller and less determinative. **This disanalogy significantly weakens the deflationary argument ("no special case") by making Truman's causal and decisional role in (A) appear uniquely direct and total.** It doesn't absolve those responsible for (F), but it highlights a qualitative difference in agency and act-structure. The absolutist view can absorb this by arguing *all* links in the (F) chain share guilt, but it requires stretching the analogy.

  2.  **Intention and Discrimination (Core to Anscombe):**
      *   *Disanalogy:* The atomic bomb, by its very nature (massive blast radius, firestorm, radiation), was *inherently indiscriminate* in 1945. Its use on a city *necessarily* meant directly and intentionally targeting a civilian population centre as the primary objective. While firebombing raids were also indiscriminate *in effect*, proponents (then and sometimes now) could argue (however tenuously) the *intention* was to hit industrial/military targets *within* the city area, accepting civilian deaths as a foreseen but unintended side-effect (Doctrine of Double Effect - DDE).
      *   *Why it Matters (Crucially for Both Views & Anscombe's Core):* **This is the heart of Anscombe's objection.** She argued that deliberately using a weapon where the *only possible military effect* (shock, surrender) *depended* on the mass killing of innocents constituted direct, intentional killing of non-combatants – murder. The analogy's focus on *harm equivalence* completely sidesteps this core deontological concern about *intention* and the *nature of the act itself*. **The analogy ("just a bigger bomb") is fundamentally orthogonal to Anscombe's argument.** She would likely reject *both* (A) and (F) as murder *if* the intention in (F) was indeed to kill civilians *as a means* to demoralise or destroy industry (which many historians argue it was, especially later in the war). The analogy doesn't engage with intention; it focuses solely on outcome and scale. **This break is fatal to the analogy's relevance for Anscombe's specific charge against Truman** unless the absolutist first independently establishes that the intention in firebombing *was* identical (directly targeting civilians).

  3.  **Technological Novelty and Threshold:**
      *   *Disanalogy:* The atomic bomb represented a qualitative, existential leap in destructive power and threat perception. It was recognised instantly as a "world-breaking" weapon. Firebombing, while horrific, was a quantitative escalation of existing aerial warfare.
      *   *Why it Matters:* This affects the *symbolic and historical weight* of Truman's decision, potentially justifying the "special case" focus the deflationary view rejects. However, **for the core *moral* question of murder (as Anscombe framed it), this disanalogy is arguably secondary.** If deliberately killing innocents is murder, the novelty of the tool doesn't change the moral category, though it might intensify the horror or historical significance. The absolutist would dismiss this as irrelevant to the moral calculus.

  4.  **Granularity of Decision:**
      *   *Disanalogy:* Truman made a specific, discrete decision to use *this* new weapon on *these* cities. Firebombing evolved as a policy; major raids were authorised within that policy framework, but rarely required the same level of singular, ad hoc Presidential decision for each city as the unprecedented atomic bomb did.
      *   *Why it Matters:* Reinforces Disanalogy 1. It makes Truman's agency in (A) more explicit, personal, and concentrated. **This directly undermines the deflationary "no special case" argument.** The absolutist can argue that authorising the overarching policy is equally culpable for the resulting raids, but the analogy's mapping of "one decision = one raid" is strained.

  **III. Does the Analogy Work? Which Conclusion Survives?**

  *   **For the Deflationary View ("No Special Case"):** The analogy **fails critically**. The disanalogies concerning causal integration/singularity of the act (1), granularity of decision (4), and especially the sidestepping of Anscombe's core intentionality argument (2) render it ineffective. The attempt to reduce the atomic bomb to "just a bigger bomb" ignores the morally salient features of the act and the decision that Anscombe highlighted. Truman's role *was* uniquely direct and singular regarding the *specific nature* of the atomic attack. If one accepts Anscombe's framework, the atomic bombings *are* a special case *within her argument* due to the inherent indiscriminateness and the dependence of the weapon's effect on mass civilian death.
  *   **For the Absolutist View ("All Murder"):** The analogy **partially survives but doesn't prove the point**. It successfully establishes *harm equivalence*, which is necessary for the "if A then F" logic. However, it **cannot establish the core premise** that firebombing raids *also* involved the *direct, intentional killing of innocents as a means*, which is essential to meet Anscombe's definition of murder. The absolutist must *independently argue* that the intention behind area bombing policy *was* to kill civilians directly (a historically contested point). If they can successfully make *that* argument (e.g., citing LeMay's statements, the shift from "precision" to "area" bombing, the targeting of civilian morale), then the analogy provides rhetorical force by highlighting the scale of harm. **The conclusion that both are murder *might* stand, but it rests on grounds the analogy itself does not supply (the intentionality of F).**

  **IV. Scholarly Consensus vs. Contested Points**

  *   **Consensus:**
      1.  Anscombe's objection to Truman was fundamentally rooted in **deontological ethics**, specifically the **absolute prohibition on intentionally killing innocent non-combatants**.
      2.  She argued the atomic bombings **were intentional killing of innocents** because the civilian deaths were not a foreseen but unintended side-effect of attacking a military target; they were the *very means* by which the bomb's shock effect was supposed to work.
      3.  The firebombing vs. atomic bombing **analogy, as commonly used invoking scale/harm equivalence, does not engage with Anscombe's core argument about intention.** Focusing on "bigger bomb" misses her point.
      4.  Anscombe **was not primarily objecting to the *scale* of the destruction** in the atomic bombings compared to firebombing, but to the *nature of the act* and the *intention* behind it.

  *   **Contested:**
      1.  **The Intention Behind Firebombing:** Did Allied leaders/military commanders *intend* to kill civilians as a direct means to demoralise Japan/Germany and destroy their *will* to fight (which Anscombe would condemn as murder)? Or did they primarily *intend* to destroy war industries *located within* cities, foreseeing but not intending massive civilian casualties (which, under DDE, some might argue is permissible)? **This is historically and philosophically contested.** Anscombe likely *did* believe area bombing was also murder, but her primary published focus was Truman and the atomic bomb. Her precise, documented views on specific firebombing raids are less clear.
      2.  **Anscombe's Consistency on "Double Effect":** Some scholars debate whether her absolute stance against intentionally killing innocents allows *any* plausible application of DDE in modern warfare, or whether her framework inherently condemns *all* strategic bombing causing massive civilian casualties, regardless of stated intentions. Her later views on proportionality in war are also analysed for potential shifts or nuances.
      3.  **The Moral Relevance of Scale/Novelty:** While Anscombe focused on intention, some ethicists argue that the *scale* and *uniquely horrific nature* of nuclear weapons (radiation, long-term effects, existential threat) *do* create a moral difference, even if the core prohibition on targeting innocents remains. This is separate from Anscombe's 1956 argument but relevant to the wider debate.
      4.  **Was Truman's Decision *Uniquely* Culpable?** Even accepting Anscombe's framework, was Truman's decision *more* culpable than, say, Churchill's sustained support for area bombing, or LeMay's aggressive execution of it? This involves complex questions of shared responsibility, command structure, and the nature of policy vs. specific orders. **There is no consensus here.**

  **V. A Better Analogy?**

  Given Anscombe's focus on *intention*, *directness*, and the *nature of the act*, a more pertinent analogy might be:

  *   **Using Poison Gas on Trenches (WWI):** Both involve weapons designed for indiscriminate area effect where the *primary military effect depends directly on mass killing/harming enemy personnel (including potentially civilians near fronts)*. Like the atomic bomb, poison gas was widely condemned (leading to treaties) as inherently indiscriminate and cruel. The intention is clearer: the gas is deployed *to kill or incapacitate everyone in the area*. This analogy focuses on the **weapon's inherent properties and the direct intention** rather than scale or comparing it to "conventional" bombardment. It highlights the concept of weapons whose *use* necessarily involves intentional indiscriminate killing, which is closer to Anscombe's likely core concern with the atomic bomb. The disanalogy is that gas in WWI was often used on military targets (trenches), whereas Hiroshima was undeniably a city. However, the shared element is the weapon's *inherent indiscriminateness* and the *intention* to exploit that for mass effect.

  **In Conclusion:** The firebombing vs. atomic bombing analogy, while rhetorically powerful, is structurally flawed for evaluating Anscombe's specific charge against Truman. It focuses on harm equivalence and scale, concepts largely orthogonal to her deontological argument about the intentional targeting of innocents. The deflationary use of the analogy collapses under scrutiny of the disanalogies, particularly concerning the singularity of the act and decision. The absolutist use relies on the analogy for rhetorical force but requires independent justification for the claim that firebombing also involved *intentional* mass killing of civilians. Anscombe's core argument stands or falls on the question of Truman's intention regarding the innocent citizens of Hiroshima and Nagasaki, a question the "bigger bomb" analogy does little to illuminate.
