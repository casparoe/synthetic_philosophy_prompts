answer: |-
  ## Adversarial Collaboration: Reconciling Perspectives on Intelligence

  **Agreed Foundational Claims**

  1.  **Operational Definition:** Intelligence, however defined, manifests as the ability to solve problems, learn, adapt, and achieve goals effectively within an environment.
  2.  **Predictive Validity:** Measurable differences in performance on cognitive tasks (including standardised tests) predict significant real-world outcomes (e.g., academic achievement, job performance complexity, health literacy) to a degree that cannot be dismissed as purely artefactual or niche-specific.
  3.  **Learning & Adaptation Core:** Any adequate account of intelligence must centrally involve mechanisms for learning from experience and adapting behaviour to changing circumstances.
  4.  **Biological Substrate:** Variations in cognitive performance are significantly influenced by neurobiological factors (genetic, developmental, physiological), interacting with the environment.
  5.  **Environmental Dependence:** Cognitive development and performance are profoundly shaped by environmental exposure, opportunity, and cultural context. Deprivation demonstrably impairs development.
  6.  **"g" Existence:** Statistical analysis of diverse cognitive test batteries consistently reveals a positive manifold and a dominant first principal component ("g"), indicating shared variance across tasks.
  7.  **Flynn Effect:** The robust, long-term rise in average scores on standardised intelligence tests across successive cohorts in industrialised nations ("Flynn Effect") is an empirical fact requiring explanation.
  8.  **Offloading Reality:** Humans demonstrably augment cognitive capacity through external tools, social collaboration, and symbolic systems (writing, maths). Cognition is often distributed.
  9.  **Test Critique:** All intelligence tests are culturally situated artefacts. Performance reflects prior learning, familiarity with test conventions, and motivation, not solely an innate "pure" capacity. Test bias is a serious concern.
  10. **Compression Critique:** Defining intelligence solely as behavioural compression (e.g., via Kolmogorov complexity) is inadequate. It fails to account for the *process* of learning and adaptation, the role of embodiment and environment in shaping behaviour, and the value-laden nature of "desirable" behaviour.

  **Core Disagreements: Substance, Not Semantics**

  | Claim                                                                 | Camp One (Psychometric) Position                                                                 | Camp Two (Situated) Position                                                                               | What Would Move Them (Crux)                                                                                                                               |
  | :-------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Primary locus of intelligence**                                  | Intelligence is fundamentally an *internal, neurocognitive capacity* of the individual organism. | Intelligence is fundamentally a *dynamic, relational property* emerging between an agent and its environment. | **Crux:** Evidence showing high-performing cognitive agents (biological or artificial) whose core problem-solving capacity *cannot* function without constant, specific external structuring not present during development. |
  | **2. Nature of "g"**                                                  | "g" primarily reflects a *domain-general biological capacity* for complex information processing. | "g" primarily reflects *acculturation* – the depth of internalisation of culturally specific cognitive tools and practices valued by the test-makers.      | **Crux:** A robust, predictive measure of "biological processing capacity" (e.g., neural efficiency marker) that correlates strongly with "g" *across vastly different cultural/educational backgrounds*. |
  | **3. What tests measure primarily**                                   | Tests primarily measure an *underlying cognitive potential/capacity*, though imperfectly.       | Tests primarily measure *culturally acquired skills and knowledge* relevant to a specific (academic/professional) niche.           | **Crux:** Significant, reliable cognitive task performance *in completely novel environmental contexts/domains* by individuals never exposed to analogous training or cultural practices. |
  | **4. Transferability of core capacity**                               | Core cognitive capacity developed in one domain *can* transfer significantly to novel, dissimilar domains. | Skills/knowledge are highly context-bound; "transfer" is limited and occurs only where deep structural similarities exist *and* are recognised.             | **Crux:** Rigorous training study showing gains on a "far transfer" task (structurally dissimilar from training) significantly predicted by pre-training "g" or biological marker, not just near-transfer practice. |
  | **5. Primary driver of the Flynn Effect**                             | Reflects improvements in *underlying abstract problem-solving ability*, driven by environmental complexity. | Reflects increasing *match* between population skills/knowledge and the specific cognitive demands of modern life *and* testing. | **Crux:** Flynn Effect gains observed *specifically* on novel problem types requiring minimal learned cultural knowledge, but high abstraction, under strict time pressure. |
  | **6. Role of external tools/systems**                                 | Tools *augment* the expression of underlying biological intelligence; the core capacity remains distinct. | Tools are *constitutive* of intelligence; "offloading" fundamentally changes the cognitive system and its capacities; the boundary is porous. | **Crux:** Evidence that mastery of a complex external tool system (e.g., advanced maths) *does not* correlate with underlying biological markers/"g" once basic access and training are controlled for. |

  **Conclusion on Substance vs. Verbal Dispute**

  The disagreement is **substantive**, not merely verbal. Both camps use "intelligence" to refer to the *phenomenon* of effective problem-solving/learning/adaptation (Claim 1). However, they fundamentally disagree on its *ontological status* (internal capacity vs. relational property - Disagreement 1) and thus on the *primary explanatory target* (biological mechanisms of processing vs. dynamics of agent-environment coupling). This core difference cascades through their interpretations of "g", testing, transfer, the Flynn Effect, and tool use.

  **Unresolved & Forward-Looking:** Reconciliation requires empirical progress on the cruxes identified. Both sides acknowledge the complex interplay of biology and environment, but differ on primacy and mechanism. Future research must design paradigms capable of disambiguating internal capacity from acquired skill and relational coupling in novel and demanding contexts.
