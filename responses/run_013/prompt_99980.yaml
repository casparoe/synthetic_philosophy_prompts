  For the cruxes, I need experiments that could sway either side. The psychometrician would look for evidence of transferable cognitive skills, while the situated camp would emphasize context dependence. Examples like the tool-use experiment or cross-context learning tasks could highlight these differences. 

  I should also check for verbal disputes. Terms like "intelligence" might be used differently. The psychometrician's "capacity" versus the situated camp's "relational process" could be a semantic split. Highlighting this avoids unnecessary conflict.

