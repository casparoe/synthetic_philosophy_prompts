      "translation": "Character achieves complex outcome via ritual, instinct, or as pawn, without intention or understanding; dramatic irony allows reader comprehension; competence doesn't require actor's insight, which may or may not dawn.",
      "fidelity": "clean",
      "residue": "Scale/mechanism of 'later' emergence vastly different (aeons, different process in evolution; never in machine); vocabulary implies comprehension could arise in the actor, original shows competence often has fundamentally separate origin.",
      "verdict": "sign original doing less (shows radical separation)"
    }
  ]
  ```

  **Conclusion:** Your vocabulary isn't vaguer; it's richer *for its domain* – explaining the actions and experiences of intentional agents within a narrative or psychological framework. The Darwin/Turing story isn't vague; it's precisely describing a *different kind of causality* – mechanical, mindless, emergent – that produces results mimicking comprehension and design. The "residue" where translation is forced or impossible reveals the boundary: the utter absence of *interiority, perspective, and intrinsic meaning* in the core Darwin/Turing mechanisms. Comprehension, when you use it to describe a character's *reasons* or *intentions*, *is* doing real explanatory work about the internal causes of action in a conscious agent, work that the mechanical stories of Darwin and Turing cannot replicate. They explain the *competence*, not the subjective *why* of an agent acting based on their understanding.
