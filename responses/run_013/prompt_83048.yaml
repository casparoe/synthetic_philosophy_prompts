answer: |-
  The salt winds of Salina stung Aris’s eyes as he watched the *Cormorant* unload. Not fish or tools, but rough-hewn sacks brimming with glistening, pink *halurite* – the island’s lifeblood, currency, and the only thing preserving their catch through the long, damp winters. A new seam, the captain boasted, found on a desolate atoll a week’s sail south. Trade was now open. Salina’s salt supply had doubled overnight.

  Aris, a naturalist charting coastal erosion, felt a familiar unease. He’d read Hume during long northern nights. More money chasing the same goods meant only rising prices, not real wealth. But *halurite* wasn't just metal; it was *useful*. Essential. He tried explaining it to Kael the fisherman, skin cured like his own catch.

  "Kael, this sudden salt... it won’t make Salina richer. Prices will rise before wages adjust. Some will suffer."

  Kael hefted a crate onto his broad shoulder. "Suffer? Aris, look! More salt! We can preserve twice the catch, trade for more grain, build bigger sheds!" He gestured towards his drying racks, already stacked higher than Aris had ever seen. Kael wasn't spending; he was hoarding, stockpiling physical salt against a future he couldn't articulate, believing sheer volume meant security.

  At Mara’s bakery, the scent of sourdough mingled with panic. "He demands *double* the salt now!" Mara pointed a flour-dusted finger at Silas, the merchant who supplied her grain. Her shelves were half-empty. "For the same sack of flour! He says the salt is... watered down?" Her voice cracked. "But I need flour *now*! My children..." In desperation, she’d used a precious chunk of *halurite* – coin meant for trade – to brine a batch of fish for her family. Real wealth consumed as sustenance, not exchanged. Aris saw the stark loss: that salt was gone from circulation, gone from potential purchases, yet it *had* fed them.

  Silas himself was recalibrating his ledger under the shade of his awning. "Debts contracted in old salt must be repaid in new salt of equal *weight*," he declared to a nervous fisherman who owed him. The fisherman had borrowed when salt was scarce; repaying the same weight now, when salt was plentiful, meant handing over far more *real purchasing power*. Silas gained immensely, exploiting the lag between the influx and the rise in all prices. "It's only fair," Silas insisted, tapping the ledger. "A debt is a debt." Fairness hinged on the unit of account, not its shifting value.

  The confusion crystallized at the Magistrate’s bench. Orin, his face lined like the salt flats, held a smooth, grey disc – a foreign token offered by a sailor for lodging. "It buys goods in Serpent's Bay," the sailor claimed. But it wasn't *halurite*. You couldn't eat it, couldn't preserve fish with it. Was it *money*? Orin looked to Aris.

  "The value of money," Aris began carefully, "depends on trust and scarcity. This... stone... has neither use nor established trust *here*. *Halurite* has both. Accepting this disc risks confusing the very idea of what money *is* on Salina." But even as he spoke, he saw the flaw. *Halurite*’s value *wasn't* just trust; its intrinsic usefulness as preservative gave it a tangible anchor Hume's coinage lacked. Rejecting the foreign token upheld Salina's monetary system, but was it denying potential wealth? Could something useless *be* money if everyone believed?

  Orin weighed the grey disc, then the rough pink chunk of *halurite* from his own purse. He saw Kael hoarding salt like a dragon, Mara consuming her coin out of need, Silas enriching himself through the rigidity of old contracts, and the hopeful sailor with his useless stone. The new salt lay piled on the docks, glittering dully. Abundant, yet somehow not making everyone feel richer. Aris’s neat distinction blurred like salt in water.

  **The salt was wealth when eaten, but money when traded; was Salina truly poorer for having more of a thing it desperately used, even if that thing also served as its measure?**
