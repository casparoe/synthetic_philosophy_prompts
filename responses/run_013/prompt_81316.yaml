  Consider a game where players choose A, B, or C, with payoffs: (A,A)=(0,0), (A,B)=(3,1), (A,C)=(0,0), (B,A)=(1,3), (B,B)=(0,0), (B,C)=(0,0), (C,A)=(0,0), (C,B)=(0,0), (C,C)=(-10,-10). In program equilibrium, both players submit the same program: "if the other's code is identical to mine, output A; else output C." This yields (A,A) and (0,0) because each sees the other as identical. If a player deviates to a different program, the other plays C, and the best the deviant can do is 0 (by playing A or B) or -10 (by playing C), so deviation isn't profitable. The best Nash equilibria are (A,B) and (B,A), giving 3 to one player and 1 to the other, so (0,0) is worse for both than the best Nash for each (which would give them 3 if they were the lucky one). The outcome (0,0) is not Nash because either player would rather play B when the other plays A, nor is it a correlated equilibrium outcome because a player told to play A would rather play B. The key is the severe punishment (C) if programs differ, which locks them into submitting the same program and hence playing A. Without action C, the punishment would be toothless and deviation attractive. Critics might say this is just commitment via mutual threat, but that threat locks them into a bad outcome when better options exist, illustrating how program equilibrium isn't a panacea for cooperation.
answer: |-
  Consider a game where each player chooses from three actions: A, B, or C. Payoffs are: if both play A, (0,0); if P1 plays A and P2 plays B, (3,1); if P1 plays B and P2 plays A, (1,3); if one plays A and the other C, or B and C, or both B, (0,0); if both play C, (-10,-10). In program equilibrium, both players submit the identical program: "If the other's source code matches mine exactly, output A; otherwise, output C." When both run this, they recognize matching code and play A, yielding (0,0). If a player deviates—say P1 submits a different program—P2's unchanged program detects non-matching code and plays C. The deviant's program, facing P2's original code, might output A, B, or C: A or B gives (0,0) against C, while C gives (-10,-10). Since no deviation yields more than 0, and (0,0) is the best the deviant can achieve here, neither player benefits from changing programs. This is a program equilibrium.

  In Nash equilibrium, the outcomes are (A,B) and (B,A), yielding (3,1) and (1,3). Both are strict Nash: no player gains by unilaterally changing action. The program equilibrium outcome (0,0) is worse for both players than their best Nash payoff (3), as 0 < 3. It is not a Nash outcome because if both were to play A without programs, either could profit by switching to B (getting 1 or 3 > 0). It is not a correlated equilibrium outcome: if a correlating device suggested (A,A), P1 would prefer to play B (expecting 1 > 0 given P2's A), and vice versa for P2.

  The lifting feature is the catastrophic mutual punishment (both playing C) if programs differ. This forces players to submit identical programs, locking them into A. Without action C—or if C yielded less severe payoffs like (0,0)—a deviant could force outcomes like (A,B) by submitting a program that plays B against the original, netting 3 > 0 and breaking the equilibrium.

  A critic might argue this is merely commitment in disguise: the programs act as mutual threats, and the bad outcome stems from poorly chosen commitments, not program equilibrium itself. They could contend rational players would coordinate on better programs (e.g., one always playing A, the other B) to achieve higher payoffs. However, this ignores the strategic fragility: without preplay communication, multiple program equilibria exist, and the threat-based one can emerge naturally, trapping players in mutual detriment despite better alternatives. Thus, reading source code enables harmful commitments as readily as helpful ones.
