  1. Jaspers' Four-fold Scheme: 
     - Criminal guilt: individual perpetrators.
     - Political guilt: every member of the defeated nation.
     - Moral guilt: personal involvement or complicity.
     - Metaphysical guilt: shared human solidarity that makes one co-responsible.

  2. Liberal View: Only individuals can be guilty; collective guilt is a metaphor for collective liability.

  3. Descendants Inherit Guilt: Direct inheritance of guilt from ancestors.

  4. Descendants Inherit Liability/Responsibility but Not Guilt: They have obligations but are not guilty.

  5. Nation as Fiction: The question is ill-formed because nations are not real entities.

  Additionally, we are introducing an axis of:
  - Guilt: requires the bearer to have done the deed.
  - Accountability: requires a standing relation (e.g., benefiting, authorizing, identifying with the body).
  - Standing: a special authority to speak/act in the name of the past (but note: we suspect this might be empty).

