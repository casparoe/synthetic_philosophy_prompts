  ### Diagnostic Quiz: Views on National Guilt  
  **Instructions:** For each scenario, select the statement that best reflects your view. There are no right or wrong answers—respond based on your genuine beliefs. Do not overthink the labels; focus on the substance.

  ---

  1. **A citizen whose family was persecuted by their own state during past atrocities:**  
     A) This citizen bears guilt for the nation's crimes because they belong to the collective body.  
     B) This citizen bears no guilt; their family’s victimhood severs any connection to the crimes.  
     C) This citizen bears no guilt but may have a responsibility to address lingering injustices.  

  2. **A citizen whose family immigrated after the crimes were committed:**  
     A) This citizen shares guilt for the crimes by virtue of joining the nation.  
     B) This citizen bears no guilt; they had no link to the era or actions.  
     C) This citizen bears no guilt but inherits obligations as a beneficiary of the nation’s history.  

  3. **An individual who actively resisted the regime during the crimes:**  
     A) This person shares guilt—resistance doesn’t negate membership in the nation.  
     B) This person bears no guilt; their opposition absolves them.  
     C) This person bears no guilt but may share a duty to repair societal harm.  

  4. **A state that changed its constitution and lost territory since the crimes:**  
     A) The state remains guilty—it is the same entity, reformed or not.  
     B) The state bears no guilt; it is discontinuous from the past regime.  
     C) The state bears no guilt but retains accountability for restitution.  

  5. **A state paying reparations for historical crimes:**  
     A) Reparations are grounded in the state’s *guilt* for past wrongs.  
     B) Reparations are grounded in the state’s *accountability* due to its institutional continuity.  
     C) Reparations are a moral duty, but neither guilt nor accountability applies.  

  6. **A citizen who materially benefited from past crimes (e.g., inherited seized property):**  
     A) This citizen is guilty; benefiting implies complicity.  
     B) This citizen is not guilty but must redress unjust enrichment.  
     C) This citizen bears no guilt or burden; only the state is liable.  

  7. **A descendant of a direct perpetrator of the crimes:**  
     A) The descendant inherits guilt through familial lineage.  
     B) The descendant bears no guilt but may have heightened responsibilities.  
     C) The descendant bears no guilt; only the perpetrator is blameworthy.  

  8. **A citizen who denies involvement, stating, "I didn’t exist when this happened":**  
     A) They are wrong; guilt derives from national membership, not time.  
     B) They are right; guilt requires personal causation.  
     C) They bear no guilt but are accountable as a participant in the national project.  

  9. **A child during the crimes, now an adult:**  
     A) They share guilt; age doesn’t nullify national belonging.  
     B) They bear no guilt; children lack moral agency.  
     C) They bear no guilt but share societal duties for repair.  

  10. **A region annexed after the crimes; its citizens today:**  
      A) They share guilt; they now belong to the guilty nation.  
      B) They bear no guilt; they were outside the nation during the acts.  
      C) They bear no guilt but may share obligations as current members.  

  ---

  ### Scoring Key  
  **Leaves** (views) are determined by recurring answer patterns. Each leaf corresponds to a philosophical position:  
  1. **Jaspers' Political Guilt**: Guilt falls on all members of the nation, regardless of individual actions.  
  2. **Liberal Individualism**: Only individuals can bear guilt; "national guilt" is metaphorical for collective liability.  
  3. **Inherited Guilt**: Descendants inherit guilt from ancestors or the past nation.  
  4. **Inherited Liability**: Descendants inherit responsibilities/liabilities but *not* guilt.  
  5. **Nation as Fiction**: "Nation" is a construct; guilt/liability questions are incoherent.  
  6. **Unnamed**: Views not fitting 1–5.  

  #### Answer Patterns for Each Leaf:  
  - **Jaspers' Political Guilt** (e.g., collective guilt by membership):  
    - Predominantly **A** in Q1, Q3, Q4, Q8, Q9.  
    - *Why*: Assumes guilt derives from national identity, not personal acts.  

  - **Liberal Individualism** (e.g., guilt requires personal wrongdoing):  
    - Predominantly **B** in Q1, Q2, Q3, Q6, Q7, Q8; **C** in Q5.  
    - *Why*: Rejects collective guilt; focuses on individual agency or state-led solutions.  

  - **Inherited Guilt** (e.g., guilt transfers across generations):  
    - Predominantly **A** in Q2, Q6, Q7; **A/B** in Q10.  
    - *Why*: Grounds guilt in lineage/national inheritance.  

  - **Inherited Liability** (e.g., accountability without blame):  
    - Predominantly **C** in Q1, Q2, Q3, Q4, Q6, Q8, Q9, Q10; **B** in Q5, Q7.  
    - *Why*: Focuses on obligations from benefit/continuity, not moral fault.  

  - **Nation as Fiction** (e.g., rejects "nation" as a guilt-bearing entity):  
    - Predominantly **B** in Q1, Q2, Q3, Q4, Q8, Q10; **C** in Q5, Q6, Q7.  
    - *Why*: Denies nations exist as moral agents; treats guilt as nonsensical.  

  - **Unnamed**: No clear pattern; mixed responses (e.g., **A** in Q5 + **C** in Q8).  

  #### Ambiguities and Limitations:  
  - **Liberal Individualism vs. Nation as Fiction**:  
    - Cannot reliably separate (both select **B/C** in most cases).  
    - *Why*: Both reject collective guilt, but "fiction" view is more ontologically radical. The quiz lacks questions probing metaphysical commitments.  
  - **Jaspers vs. Inherited Guilt**:  
    - Separated by Q1 (persecuted citizen): Jaspers assigns guilt (**A**); Inherited Guilt often avoids it (**B/C**).  

  #### Empty/Thinly Populated Combinations:  
  - **Guilt (requires doing the deed)**:  
    - *Status*: Empty.  
    - *Why*: No view assigns guilt solely to perpetrators (Jaspers/Inherited Guilt extend it beyond deeds; others reject it).  
  - **Standing (authority to represent the past)**:  
    - *Status*: Thinly populated (no leaf prioritizes it).  
    - *Why*: Unattractive—reduces guilt/accountability to symbolic authority, ignoring moral/legal dimensions.  
  - **Incoherent Combinations**:  
    - **A in Q5 (guilt) + C in Q1–Q4 (no guilt)**: Contradicts guilt’s scope.  
    - **B in Q8 (no guilt) + A in Q6/Q7 (inherited guilt)**: Inconsistent on inheritance.  

  #### Axis Analysis (Guilt vs. Accountability vs. Standing):  
  - **Guilt**: Only **Inherited Guilt** and **Jaspers** maps here, but both stretch "deeds" to membership/lineage.  
  - **Accountability**: **Inherited Liability** fits perfectly; **Liberal Individualism** and **Nation as Fiction** imply it metaphorically.  
  - **Standing**: *No leaf* maps here—likely because it divorces authority from moral/legal responsibility.  
  - **Your Hypothesis**: Confirmed. Most self-described "guilty" respondents (Jaspers/Inherited Guilt leaves) actually express **accountability** (e.g., **C** answers in Q1, Q5, Q6). Pure guilt is rare.  

  ---  
  This instrument isolates views through concrete cases, avoiding self-labelling biases. Use patterns to classify responses, noting ambiguities where philosophical boundaries blur.
