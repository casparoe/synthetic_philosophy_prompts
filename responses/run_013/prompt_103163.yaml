  The scoring key will map answer combinations to positions. Important to note where positions overlap or can't be distinguished - like how Position 1 and 6 both see real changes but differ on whether boundaries are discovered or made. The summary will highlight the most diagnostic distinction: whether period boundaries answer to reality or human interests.

