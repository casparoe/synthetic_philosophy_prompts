    Well-being: Alex=12, Taylor=12, Jordan=6, Morgan=24

  We see that the well-being is not equal in any round except round 2 (by design), and even then, if we look at capabilities, round 3 ensures capabilities but not well-being equality.

  Now, introduce the concepts:

  - Round 1: Equality of resources (tokens). What it ignores: differences in circumstances and conversion rates. So Taylor, who needs the device, is worse off, and Morgan, who is content, is better off.

  - Round 2: Equality of welfare (well-being). It compensates for expensive tastes (Jordan) and for expensive needs (Taylor). But note: Jordan needs more tokens to achieve the same well-being because of their expensive tastes. Some philosophers (like Dworkin) would say we shouldn't compensate for expensive tastes that are chosen.

  - Round 3: Capabilities approach (by Martha Nussbaum and Amartya Sen). It focuses on what people are able to do (capabilities). We ensured that everyone has the minimum to achieve the basic capabilities. But note, we didn't achieve equal well-being. Also, the capabilities approach might not compensate for expensive tastes if they don't affect capabilities? In our game, Jordan has the same capability costs as Alex.

  What the game cannot reproduce: 
  - The capabilities approach is about a set of basic capabilities that are considered essential for human dignity. The game uses a small arbitrary set. Also, the game doesn't address whether expensive tastes should be compensated in the capabilities approach (they typically are not, because capabilities are about basic functionings).

  - Also, the distinction between expensive tastes that are chosen vs. unchosen (like a disability) is not captured. Taylor's disability is unchosen, while Jordan's expensive tastes might be seen as chosen (if they were cultivated) or unchosen (if they were raised that way). But the game doesn't address that.

  Predictable problems:

  1. Round 2 might be too mathematically challenging. Students might not know how to set up the equations. 
     - Solution: Provide a worksheet that guides them: "Set the well-being equal to W for all. Express the tokens each resident needs in terms of W. Then set the sum to 60 and solve for W." Have an example with one resident.

  2. Time: Each round might take longer than planned.
     - Solution: Keep strict time limits. Have a timer. If a group is stuck in round 2, they can use trial and error and get close.

  3. In round 3, groups might not distribute the surplus equally. They might give more to Taylor or to Morgan, etc. That's okay. We can discuss in debrief.

  4. The capability minimums might be misunderstood. Make sure the handout is clear.

  5. Some students might argue that Jordan shouldn't get compensation for expensive tastes. That's a good point to note for the debrief.

  Debrief outline:

  1. Report outcomes from one or two groups for each round.

  2. Ask: What did you notice? How did the well-being compare in each round?

  3. Introduce the three concepts:
     - Round 1: Equality of resources (like Ronald Dworkin). The idea is to give everyone the same resources and let them choose how to use them. But it doesn't account for different needs or abilities to convert resources into well-being.
     - Round 2: Equality of welfare (well-being). The goal is to make everyone equally happy. But it might require giving more resources to those who are hard to make happy (like Jordan) or who have special needs (like Taylor). Some argue that we shouldn't subsidize expensive tastes.
     - Round 3: Capabilities approach. Focuses on ensuring everyone has the basic capabilities to function in society. It aims at freedom to achieve functionings. But it doesn't guarantee equal well-being and might leave some with more well-being than others.

  4. What the game cannot reproduce: 
     - The distinction between chosen and unchosen disadvantages. For example, Taylor's disability is unchosen, while Jordan's expensive tastes might be seen as chosen (if they cultivated them) or unchosen (if raised that way). But we treat them similarly in the well-being round. The capabilities approach typically doesn't compensate for expensive tastes in non-basic capabilities.

     - The list of capabilities in the game is arbitrary. In reality, philosophers debate what should be on the list.

     - Also, the capabilities approach is not just about meeting a minimum but about having real opportunities.

  5. Open for questions.

  Materials to prepare:
  - Handout for each group (one per 3-4 students) with:
     - Resident profiles (with well-being functions and capability costs)
     - Rules for each round
     - Worksheet to record allocations and well-being for each round.

  - Whiteboard or poster to record group results.

  - Timer.

  We'll go with the original well-being functions and 60 tokens, accepting that they might not achieve exact equality in round 2.

  Alternative: We can change the multipliers to integers by redefining the unit.

  For example, let well-being be in "happiness points".

  - Alex: 2 points per token.
  - Taylor: if tokens < 10, 0 points; else 2 points per token above 10.
  - Jordan: 1 point per token.
  - Morgan: 4 points per token.

  Then in round 2, we want happiness points equal.

  Let W be the common happiness.

  Alex: tokens_A = W/2
  Taylor: tokens_T = W/2 + 10
  Jordan: tokens_J = W
  Morgan: tokens_M = W/4

  Sum: W/2 + (W/2+10) + W + W/4 = (2W/4 + 2W/4) + 10 + W + W/4 = (2W/4+2W/4+4W/4+W/4) +10 = (9W/4) +10 = 60
  9W/4 = 50
  9W = 200
  W = 200/9 ≈ 22.222

  Then:
  tokens_A = 11.111
  tokens_T = 21.111
  tokens_J = 22.222
  tokens_M = 5.556

  Still messy.

  We might stick with the original and allow fractions or trial and error.

  Final design:

  - Total tokens: 60
  - Well-being functions as originally defined (using decimals).
  - In round 2, groups are to achieve as equal well-being as possible, using whole tokens. They might not achieve exact equality.

  We'll proceed.
