  ### Equalityville: A Political Philosophy Game  
  **Objective:** Engage students in distributing resources under three different equality principles (resources, welfare, capabilities) to reveal inherent tensions, without using technical terms until the debrief.  

  **Time:** 50 minutes  
  **Participants:** 18 students (split into 3–4 councils of 4–5 students each).  
  **Materials:**  
  - Whiteboard or poster paper for each council.  
  - Markers.  
  - Printed "Resident Profiles" (one per council).  
  - Printed "Capability List" (one per council).  
  - Calculators (optional).  
  - Timer.  

  **Resident Profiles (Handout):**  
  > *Meet Equalityville's residents. Each converts tokens into "well-being points" (happiness) differently. Tokens represent the town's annual budget for essentials (food, housing, etc.).*  
  > - **Alex:** Converts tokens to well-being at a 1:1 rate. *Example:* 10 tokens = 10 well-being.  
  > - **Taylor:** Needs 10 tokens for a wheelchair to move around. *Without it, tokens yield 0 well-being. With it, excess tokens convert at 1:1.*  
  > - **Jordan:** Loves opera/fine dining. Tokens convert at 1:0.5 (needs 2 tokens for 1 well-being). *Example:* 10 tokens = 5 well-being.  
  > - **Morgan:** Easily content. Tokens convert at 1:2 (each token gives 2 well-being). *Example:* 5 tokens = 10 well-being.  

  **Capability List (Handout):**  
  > *Concrete things every resident should be able to do:*  
  > 1. **Attend town meetings:** Requires mobility (Taylor needs the wheelchair).  
  > 2. **Eat nutritious meals for a week:** Costs 5 tokens (same for all).  
  > 3. **Access one cultural event (e.g., concert):** Costs 3 tokens (same for all).  
  > *Minimum tokens needed to achieve all capabilities:*  
  > - Alex: 0 (mobility) + 5 (meals) + 3 (event) = **8 tokens**  
  > - Taylor: 10 (wheelchair) + 5 (meals) + 3 (event) = **18 tokens**  
  > - Jordan: 8 tokens (same as Alex)  
  > - Morgan: 8 tokens (same as Alex)  

  **Setup:**  
  - Divide students into councils of 4–5.  
  - Give each council:  
    - 60 tokens (use slips of paper, buttons, or just track numbers on a whiteboard).  
    - Resident Profiles and Capability List handouts.  
  - Explain: *"You are Equalityville’s town council. Distribute 60 tokens annually to Alex, Taylor, Jordan, and Morgan. Follow the rules for each round—your goal is fairness under that rule."*  

  ---

  ### Game Rounds (30 minutes total)  
  **Round 1: Equal Tokens** (5 minutes)  
  - **Rule:** *"Each resident gets exactly the same number of tokens."*  
  - **Task:** Distribute 60 tokens equally (15 per resident). Calculate well-being for each using their profile.  
  - **Example Outcome:**  
    - Alex: 15 tokens → 15 well-being  
    - Taylor: 15 tokens → 5 well-being (15 - 10 for wheelchair)  
    - Jordan: 15 tokens → 7.5 well-being (15 × 0.5)  
    - Morgan: 15 tokens → 30 well-being (15 × 2)  
  - **Debrief Prep:** Notice how equal tokens lead to unequal well-being.  

  **Round 2: Equal Well-Being** (10 minutes)  
  - **Rule:** *"Distribute tokens so all residents report the same well-being."*  
  - **Task:** Councils debate allocations. *Hint:* Use algebra (optional):  
    - *Let W = target well-being. Then:*  
      - Alex needs **W** tokens.  
      - Taylor needs **W + 10** tokens.  
      - Jordan needs **2W** tokens.  
      - Morgan needs **0.5W** tokens.  
      - Equation: W + (W + 10) + 2W + 0.5W = 60 → **4.5W + 10 = 60** → W ≈ 11.1  
  - **Target Allocation (whole tokens):**  
    - Alex: 11 tokens → 11 well-being  
    - Taylor: 21 tokens → 11 well-being (21 - 10)  
    - Jordan: 22 tokens → 11 well-being (22 × 0.5)  
    - Morgan: 6 tokens → 12 well-being (6 × 2) *(Close enough—well-being is roughly equal.)*  
  - **Debrief Prep:** To achieve equality, Jordan gets extra tokens (expensive tastes), Taylor gets extra (disability), Morgan gets fewer (contentment).  

  **Round 3: Equal Capabilities** (15 minutes)  
  - **Rule:** *"Ensure all residents can achieve the capabilities on the list. Distribute leftover tokens equally."*  
  - **Task:**  
    1. Give each resident their *minimum* tokens for capabilities (Alex: 8, Taylor: 18, Jordan: 8, Morgan: 8 → **42 tokens total**).  
    2. Distribute remaining **18 tokens equally** (4.5 each → round to whole numbers, e.g., 5, 5, 4, 4).  
  - **Example Outcome:**  
    - Alex: 8 + 5 = 13 tokens → 13 well-being  
    - Taylor: 18 + 4 = 22 tokens → 12 well-being (22 - 10)  
    - Jordan: 8 + 5 = 13 tokens → 6.5 well-being (13 × 0.5)  
    - Morgan: 8 + 4 = 12 tokens → 24 well-being (12 × 2)  
  - **Debrief Prep:** Capabilities are met, but well-being is unequal (Morgan is happiest, Jordan least happy).  

  ---

  ### Debrief (15 minutes)  
  **Step 1: Compare Outcomes** (5 minutes)  
  - Ask councils to share allocations/well-being from each round. Highlight on a central board.  
  - **Key Tension:** Outcomes "come apart":  
    - *Equal tokens* → High well-being for Morgan, low for Taylor.  
    - *Equal well-being* → Jordan/Taylor get more tokens.  
    - *Equal capabilities* → Well-being varies widely.  

  **Step 2: Introduce the Three Equality Concepts** (7 minutes)  
  - **Round 1 = Equality of Resources (Resourcism):**  
    - *"You gave equal tokens—fair distribution of resources. But it ignored how circumstances (e.g., Taylor’s wheelchair, Jordan’s tastes) affect what people get from resources."*  
  - **Round 2 = Equality of Welfare (Welfarism):**  
    - *"You equalized well-being by giving more to those who need it (Taylor, Jordan). But is it fair to give Jordan extra for expensive tastes? What if they chose those tastes?"*  
  - **Round 3 = Capabilities Approach:**  
    - *"You ensured all could do key things (mobility, food, culture). This focuses on freedom to achieve, not happiness. But well-being still differs—Morgan is content with less, Jordan isn’t."*  

  **Step 3: Limitations and Discussion Hook** (3 minutes)  
  - **What the Game Ignores:**  
    - *Resources:* Ignores how people *use* resources (e.g., Jordan’s tastes).  
    - *Welfare:* Ignores whether disadvantages are *chosen* (e.g., Jordan’s tastes) or *unchosen* (e.g., Taylor’s disability).  
    - *Capabilities:* Ignores subjective well-being (e.g., Morgan vs. Jordan).  
  - **Critical Question for Discussion (post-game):**  
    - *"Should we prioritize equal resources, equal happiness, or equal freedom? How do we handle chosen vs. unchosen disadvantages?"*  

  ---

  ### Predictable Problems & Solutions  
  1. **Problem:** Round 2 math stumps groups.  
     - *Solution:* Provide the equation hint early. If stuck, suggest trial-and-error: *"Give Taylor 10 extra tokens, then adjust others until well-being is close."*  

  2. **Problem:** Councils argue endlessly in Round 3 about leftover tokens.  
     - *Solution:* Enforce a 2-minute cap for distributing leftovers. Default to equal split.  

  3. **Problem:** Students fixate on "fairness" debates and miss the philosophical tension.  
     - *Solution:* Remind them: *"Your goal is to follow the rule, not invent your own. We’ll discuss why the rules clash afterward."*  

  4. **Problem:** Capability minimums confuse (e.g., "Why does Taylor need 18 tokens?").  
     - *Solution:* Clarify: *"The wheelchair (10 tokens) lets Taylor move. Without it, they can’t attend meetings or events."*  

  **Why This Works:** Students experience the trade-offs viscerally. The debrief connects their struggles to real theories, priming deeper discussion on justice.
