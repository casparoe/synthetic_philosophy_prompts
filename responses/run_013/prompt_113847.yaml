answer: |-
  **Examination Question:**  
  Two research teams study "sustained focus duration" (SFD)—the average time individuals can maintain concentrated attention on a cognitively demanding task—in Canada during 2018. Team A reports a heritability estimate of 0.75, while Team B reports 0.40. Neither made arithmetic errors. Explain how this discrepancy is possible, then evaluate what these estimates do and do not imply for: (i) the claim that SFD is genetically influenced; (ii) stating that "60% of Jane Doe’s SFD is genetic"; and (iii) a policy proposal to raise national SFD through school-based attention-training programs. Finally, a policy analyst cites Team A’s higher estimate to argue that environmental interventions are futile. Identify the flawed inference in this argument and specify what evidence would be required to support the analyst’s conclusion.  

  ---

  **Model Answer (586 words):**  

  The differing heritability estimates (ℎ²) for SFD are possible because heritability measures the *proportion of phenotypic variance* attributable to genetic variance *in a specific population and environment*. Team A’s ℎ²=0.75 and Team B’s ℎ²=0.40 reflect distinct environmental variances (Vₑ) across their study cohorts, not contradictory genetic effects. For instance, Team A might have studied twins raised in similar socioeconomic settings (low Vₑ), amplifying genetic differences’ relative contribution to variance. Team B could have included subjects from highly diverse educational backgrounds (high Vₑ), where environmental differences "dilute" genetic variance’s proportional impact. Crucially, both estimates remain valid for their respective samples within the same broader population.  

  For (i), both estimates confirm SFD is genetically influenced. A ℎ² > 0 indicates genetic factors contribute to trait variation in the studied groups. However, neither estimate quantifies the *absolute* genetic contribution: SFD could be strongly affected by genes even if ℎ² is lower in high-Vₑ settings. The key inference is that genes *matter*, but ℎ² does not measure *how much* they matter in absolute terms.  

  For (ii), stating "60% of Jane Doe’s SFD is genetic" is invalid. Heritability describes population-level variance partitioning, not individual etiology. Jane’s SFD results from irreducibly intertwined gene-environment interactions during development. Assigning a percentage "share" implies genetics and environment operate independently, which they do not. Even with high ℎ², Jane’s SFD could be primarily shaped by her exceptional schooling—a fallacy of misapplying group statistics to individuals.  

  For (iii), Team B’s lower ℎ² suggests environmental interventions *could* reduce SFD variance and raise the mean if they target relevant factors (e.g., tailored curricula). However, Team A’s high ℎ² does not preclude effective intervention. Heritability estimates describe the *current* distribution of environments. If new interventions introduce *previously untapped* environmental variation (e.g., novel attention-training tools), they could raise SFD even when ℎ² is high. Thus, neither estimate definitively predicts intervention efficacy; both require experimental evidence.  

  The policy analyst commits an *inference fallacy* by assuming that high heritability (ℎ²=0.75) implies environmental changes *cannot* alter the population mean. Heritability measures relative variance under existing conditions, not trait immutability. For example, improved nutrition historically raised average height in populations despite high ℎ² for height. The analyst conflates "high genetic contribution to current variation" with "environmental changes are ineffective." The flawed step is equating ℎ² with *genetic determinism*.  

  To validly conclude that SFD interventions will fail, the analyst would need evidence that SFD has *low phenotypic plasticity*—that is, controlled experiments showing attention-training programs produce negligible changes in SFD across diverse individuals. Genetic correlations (e.g., genes for SFD also affecting learning) or mechanistic constraints (e.g., neurobiological limits) could support this, but ℎ² alone cannot.  

  In summary, heritability is context-dependent, refutes genetic determinism, and cannot individualize causation. Valid policy decisions require evidence beyond variance partitioning.  

  ---

  **Marking Scheme (20 marks total):**  

  1.  **Explanation of discrepant estimates (5 marks):**  
      Must state that differing environmental variances (Vₑ) across studies alter ℎ² without contradicting genetic influence.  
      *Common error:* Attributing discrepancy to "different genes" or measurement error.  
  2.  **Implication for genetic influence (i) (4 marks):**  
      Must affirm both estimates show genetic influence (ℎ²>0) but note neither measures absolute genetic contribution.  
      *Common error:* Claiming higher ℎ² = "more genetic" in absolute terms.  
  3.  **Critique of individual attribution (ii) (4 marks):**  
      Must reject percentage attribution due to heritability’s population-level nature and non-additivity of gene-environment interactions.  
      *Common error:* Accepting the statement if ℎ²=0.60 or citing "average" genetic contribution.  
  4.  **Intervention feasibility (iii) (3 marks):**  
      Must state neither ℎ² predicts intervention efficacy; effectiveness depends on introducing new environmental variation/plasticity.  
      *Common error:* Claiming low ℎ² guarantees intervention success or high ℎ² guarantees failure.  
  5.  **Policy analyst critique (4 marks):**  
      Must identify conflation of high ℎ² with environmental immutability (2 marks) AND specify needed evidence (e.g., low plasticity studies, not ℎ²) (2 marks).  
      *Common error:* Only noting "heritability isn’t destiny" without specifying the fallacy or required evidence.  

  **A vs. B Differentiation:**  
  - **A (18–20 marks):** Integrates all points coherently; explicitly distinguishes variance partitioning from determinism/immutability; precision in noting Vₑ drives ℎ² differences.  
  - **B (15–17 marks):** Hits all must-hit points but with minor imprecision (e.g., vague environmental examples); may lack synthesis in policy critique; correctly rejects individual attribution but with weaker reasoning.
