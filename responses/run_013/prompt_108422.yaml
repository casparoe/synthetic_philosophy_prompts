prompt: |-
  I'm a second-year PhD student in a cog-sci lab and our reading group has been stuck on the side-effect effect for over a year now, to the point where I've started to suspect we're not even having one argument. I'll lay out the shape of it and then ask you for a diagnosis instead of a verdict. The basic case everyone in the group accepts: a chairman says he doesn't care about anything except profit, and the new program will increase profits and, depending on the version, either harm or help the environment; asked whether he harmed it intentionally or helped it intentionally, most people say yes in the harm version and no in the help version. Nobody disputes the result, we've rerun it on our own undergrads twice. What we fight about is what it shows. One camp says it shows the ordinary notion of intentional action is partly normative: whether something counts as intentional depends on whether it's the kind of thing we'd blame someone for, so the asymmetry is evidence about the concept itself. A second camp says it's a pragmatic artifact — the vignette makes the side effect the point of the story and basically invites a verdict, so people answer the question they think is on the table rather than the one printed, and nothing follows about the concept. A third camp says both of those are chasing a phantom, because there's no single folk concept to have and the interesting question is what work the word does in our practices of blaming and excusing. We've now invented maybe fifteen variants between us and every one of them gets explained after the fact by all three camps, which is what got me wondering whether the camps are even answering the same question.

  My hunch, and I'd like you to tell me if it's wrong: the two main camps disagree about no fact at all — they're answering different questions (what the word means to speakers, versus what is going on in the head of someone who answers), and the stalemate is really about what counts as the thing to be explained, plus a background split over whether a concept is a natural kind to be discovered or a norm-laden practice to be described. To test that I tried a variant I haven't seen anywhere: same structure, but I replaced the harm with a pure rule violation — the program breaks an absurd internal bylaw, harms nobody, offends nobody, changes nothing anyone cares about. If the asymmetry survives, harm-based explanations look shaky; if it dies, that suggests the asymmetry is about harm or blame rather than norms generally. The group split three ways on what my variant even shows, which I think is itself data about our problem.

  So: diagnose us. Verbal dispute, substantive dispute about facts or mechanisms, two different questions under one heading, or a sign the whole thing is badly posed? Tell me what each side is actually committed to and which of those commitments the other side can't accept, and then, given your diagnosis, what would count as real progress — a distinction, an experiment, a formal model with predictions we don't already have, or dropping the question — and what each camp would have to give up for it. I don't need a reading list, I've read the main papers; I want the diagnosis with reasons, and an honest answer about whether this one can be settled at all or whether the honest move is to stop expecting it to be.
reasoning: |-
  Okay, the user is a second-year PhD student in cognitive science, and their reading group has been stuck on the side-effect effect for over a year. They're frustrated because they feel like the group isn't even having the same argument. They've described three camps: one that thinks the effect shows intentional action is normative, another that sees it as a pragmatic artifact, and a third that views it as part of blame/excuse practices. They've run variants, but each camp explains them post-hoc. The user tried a variant with a rule violation instead of harm, and the group couldn't agree on what it showed. They want a diagnosis of the dispute and advice on how to move forward.

  First, I need to understand the core of their frustration. It seems like they're questioning if the disagreement is substantive or just verbal. Their hunch is that the camps are answering different questions—what the word means versus what's happening cognitively—and that there's a deeper split about whether concepts are natural kinds or normative practices. Their experiment with the rule violation was meant to test harm-based explanations, but even that caused more disagreement. 

  The user's main request is a diagnosis: verbal vs. substantive, different questions, or a badly posed problem. They also want to know what each side is committed to, where the disagreements lie, and what real progress would look like. They're not after more papers but a clear analysis and whether this can be settled or if they should move on.

  Breaking down the three camps:
  1. **Normativist Camp**: Intentionality depends on normative evaluation (blame). The asymmetry arises because harm is blameworthy, so people are more likely to call it intentional. Committed to the idea that folk concepts are inherently normative.
  2. **Pragmatic Camp**: It's about conversational pragmatics. The question is reinterpreted based on context. Committed to cognitive mechanisms (e.g., relevance, implicature) and that the concept itself isn't normative.
  3. **Practice-Focused Camp**: Rejects a unified folk concept. Intentionality ascriptions are tools in social practices. Committed to anti-essentialism about concepts and focusing on functional use.

  The key disagreements:
  - **Ontological**: Are concepts natural kinds (Pragmatic) or norm-laden (Normativist)? Practice camp rejects both, seeing concepts as fluid tools.
  - **What's to Explain**: Is it the concept itself, cognitive mechanisms, or social functions?
  - **Evidence Interpretation**: Each camp has different criteria for what counts as evidence. Normativists look for norm sensitivity, Pragmatists for contextual manipulations, Practice theorists for variability in use.

  The user's rule-violation experiment is telling. If the asymmetry disappears without harm, Normativists might struggle, but they could argue that norms need to be socially relevant. Pragmatists might say the context didn't make the violation salient. Practice theorists would point to how the ascription functions. The fact that all camps could reinterpret the results shows they're operating in different frameworks.

  Is this a verbal dispute? Partly. Terms like "intentional" and "concept" mean different things to each camp. But there are substantive differences in what they consider valid explanations. For example, whether cognitive mechanisms can be separated from normative judgments is a core divide.

  Real progress wouldn't come from more variants but from clarifying the debate's structure. They need to:
  1. **Map Commitments**: Explicitly state what each camp assumes and what would falsify their views. For instance, what would the Pragmatic camp accept as evidence against their view? If context changes but the effect remains, does that challenge them?
  2. **Predictive Models**: Develop formal models with distinct predictions. For example, a computational model of pragmatic reasoning versus a normative model based on blame-worthiness. Test cases that pit these predictions against each other.
  3. **Interdisciplinary Approaches**: Use methods from linguistics (e.g., presuppositions, focus) or neuroscience (e.g., brain responses to different conditions) to find convergent evidence.
  4. **Practice-Focused Shift**: If moving towards the third camp, study how intentionality ascriptions function in real conversations, perhaps using corpus analysis or naturalistic studies.

  Can this be settled? Probably not to everyone's satisfaction. The deep divides (naturalism vs. normativity, essentialism vs. anti-essentialism) are philosophical. The group might need to agree on a pluralistic approach or decide that further variants without theoretical clarity won't help. The user should consider if their time is better spent on a different question or framing the disagreement as a taxonomy of explanations rather than a single answer.

  In summary, the dispute is both verbal and substantive. The camps have different foundational commitments, making direct resolution hard. Progress requires clarifying assumptions, creating testable models with unique predictions, or shifting focus to applied contexts. The honest move might be to acknowledge the multifaceted nature of the effect and move forward with a framework that accommodates multiple levels of explanation.
answer: |-
  Here's a diagnosis of your reading group's impasse, structured around your core concerns. This isn't about "who's right," but about why the dispute persists and how to break the stalemate.

  ### The Core Problem: Three Incommensurable Frameworks (Not Just Disagreements)
  Your hunch is largely correct: the camps aren't *just* disagreeing about facts; they're operating within fundamentally different **explanatory frameworks** with distinct goals, assumptions, and criteria for what counts as a satisfying explanation. This makes them partially "talking past" each other, but the dispute isn't *purely* verbal—it's about **what constitutes the explanandum and explanans**.

  1.  **Normativist Camp:**
      *   **Goal:** To characterize the *semantic content* or *conceptual structure* of the folk concept INTENTIONAL ACTION.
      *   **Core Commitment:** Folk psychological concepts (like intentionality) are inherently *normative* or *evaluative*. Their application isn't purely descriptive but depends on evaluative judgments (like blameworthiness/praiseworthiness). The SEE reveals a constitutive feature of the concept itself.
      *   **What they explain:** The *pattern of application* of the word "intentionally." The asymmetry *is* evidence about the concept's structure.
      *   **Non-Negotiables:** That concepts have stable, discoverable structures incorporating norms; that linguistic intuitions directly reflect conceptual structure.

  2.  **Pragmatic Artifact Camp:**
      *   **Goal:** To explain the *cognitive mechanisms* and *communicative processes* generating the specific judgments in the SEE task.
      *   **Core Commitment:** The asymmetry arises from general-purpose cognitive/pragmatic processes (e.g., relevance, conversational implicature, perspective-taking, task demands), *not* from a norm-laden concept of intentionality. The core concept of intentionality might be largely descriptive (focused on knowledge, desire, control).
      *   **What they explain:** *Why people give the answers they do* in this specific experimental context. The asymmetry is a performance effect, not competence.
      *   **Non-Negotiables:** That cognitive/pragmatic mechanisms operating *on* concepts can distort judgments; that experimental tasks create artificial contexts; that the fundamental concept might be separable from the SEE phenomenon.

  3.  **Practice-Focused / Anti-Essentialist Camp:**
      *   **Goal:** To describe the *social function* and *discursive role* of intentionality *ascriptions* within human practices (blame, excuse, justification, coordination).
      *   **Core Commitment:** There is no single, stable, context-independent "folk concept of intentional action" to be discovered. The *word* "intentionally" is a tool deployed flexibly within normative social practices (primarily accountability practices) to achieve specific ends (assigning responsibility, mitigating blame, signaling commitment). Meaning is use.
      *   **What they explain:** The *functional role* of intentionality talk *in situ*. The SEE is a laboratory artifact *of* a broader practice of holding people accountable for foreseeable outcomes, especially negative ones.
      *   **Non-Negotiables:** That concepts aren't stable "natural kinds" in the head; that meaning is determined by use in practice; that focusing on decontextualized intuitions misses the point.

  ### The Source of the Stalemate: Why Variants Don't Resolve It
  1.  **Different Explananda:** Camp 1 explains the *concept's structure*, Camp 2 explains the *judgment's mechanism*, Camp 3 explains the *word's function*. A variant result doesn't *falsify* any camp; it just becomes new *data* each camp interprets within its own framework.
      *   *Your Rule-Violation Variant:* Camp 1 might argue a *violated norm* (even absurd) can trigger the effect if perceived as a norm, showing normativity is key. Camp 2 might argue the vignette still "foregrounds" the violation pragmatically. Camp 3 might argue it shows "intentionally" is used to mark *any* norm violation in an accountability context, reinforcing their practice-focused view. **The split interpretations aren't surprising; they're predicted by the frameworks.**
  2.  **Different Criteria for Success:** What counts as a "good" explanation?
      *   Normativist: Captures the intuitive judgment pattern *as revealing concept structure*.
      *   Pragmatist: Fits a model of general cognitive/pragmatic processes; predicts boundary conditions.
      *   Practice: Illuminates real-world social dynamics; explains variability and context-dependence.
  3.  **Ontological Divide (Natural Kind vs. Practice):** This is the deepest rift. Camp 1 & 2 (especially 2) implicitly treat "the folk concept" as a natural kind or stable mental representation to be investigated like a physical phenomenon. Camp 3 rejects this ontology entirely, viewing concepts as fluid patterns of social practice. **This is a philosophical divide about the nature of mind and language, not resolvable by SEE variants alone.**

  ### Is it Verbal, Substantive, or Badly Posed?
  *   **Not Purely Verbal:** The camps genuinely disagree on fundamental questions (e.g., "Are concepts normative?", "Is the SEE a performance artifact?", "Is there *a* folk concept?").
  *   **Partly Verbal/Conceptual:** Terms like "concept," "intentional," "meaning," and even "explanation" are used differently, leading to cross-talk. Camp 1 & 2 use "concept" (roughly) to mean a mental representation; Camp 3 uses it (if at all) to mean a public, practice-embedded resource.
  *   **Not Badly Posed (Inherently):** The SEE is a robust phenomenon worth explaining. The problem lies in the *level of analysis* chosen and the *assumptions* brought to it.
  *   **Diagnosis: Substantive Dispute Operating at Different Levels of Analysis with Incommensurable Frameworks.** The camps are committed to fundamentally different ways of understanding cognition, language, and concepts.

  ### Paths to Progress (Beyond More Variants)
  The goal shouldn't be "victory" for one camp, but **constructive engagement across frameworks** or **clarifying the stakes**.

  1.  **Map Commitments & Predictions Rigorously:**
      *   Force each camp to explicitly state: What specific, unique prediction does your framework make that the others *don't*? What result in *any* conceivable experiment would genuinely challenge your core commitment? (e.g., Could Camp 1 accept a SEE asymmetry *without* any norm? Could Camp 2 accept an asymmetry impervious to *any* pragmatic manipulation? Could Camp 3 accept a context-independent, stable judgment pattern?).
      *   **Example Challenge:** Design an experiment where the *pragmatic cues* point *against* the normativist prediction (e.g., downplay harm, emphasize profit focus) but the normativist structure *should* still hold. Can Pragmatists predict the reversal? Can Normativists explain why their concept *wouldn't* manifest? Can Practice theorists predict based on perceived accountability demands?

  2.  **Formal Modeling with Novel Predictions:**
      *   **Normativist Model:** Formalize the "blameworthiness threshold" or normative weighting within a concept representation. Predict interaction effects between severity of norm violation, agent's attitude, and intentionality ratings. Predict novel cases where blame and "standard" intentionality criteria dissociate.
      *   **Pragmatic Model:** Build a computational model (e.g., Bayesian pragmatics, RSA) where the question "did he X intentionally?" is interpreted relative to the discourse goal inferred from the vignette. Predict *how* changes in vignette wording (focus, presupposition, relevance cues) quantitatively shift judgments. Predict responses to meta-linguistic probes ("What do you think the experimenter *really* wants to know?").
      *   **Practice-Focused Model:** Harder to formalize experimentally, but model the *social function*. Predict intentionality ascription rates based on independent measures of perceived accountability demands, relationship dynamics, or institutional context in more naturalistic or game-theoretic paradigms. Predict *when* people *choose* to use "intentionally" vs. other descriptions in conversation.

  3.  **Shift the Phenomena: Move Beyond Decontextualized Vignettes:**
      *   **Natural Language Processing:** Analyze large corpora of news, legal opinions, or social media. When *is* "intentionally" used for side effects? What linguistic and contextual features predict its use? Does the SEE pattern hold outside the lab?
      *   **Neuroscience/Implicit Measures:** Do neuro markers of norm violation (e.g., N400/P600 for semantic/syntactic violations?) correlate with intentionality judgments in the SEE? Do implicit association tests (IATs) show a link between "intentional" and "blameworthy"?
      *   **Behavioral Economics/Game Theory:** Embed SEE-like scenarios in interactive games with real stakes. Does holding someone accountable for a foreseen negative side effect *require* labeling it "intentional"? How do incentives and relationships modulate ascriptions?

  4.  **Embrace Pluralism & Seek Integration (The Honest Move?):**
      *   Acknowledge that the SEE likely arises from the *interaction* of multiple factors: a concept with some normative sensitivity (Camp 1) *plus* powerful pragmatic processes shaping its application in communication (Camp 2) *within* broader practices of social accountability (Camp 3). Instead of fighting for primacy, model the *interactions*.
      *   **Define the Scope:** Maybe Camp 1 best captures *one aspect* of conceptual structure revealed in intuition, Camp 2 best explains *why the effect is labile* under contextual tweaks, and Camp 3 best explains *why the effect exists in the first place* (its functional roots in social life). Progress comes from specifying how these levels connect.

  ### Can it be Settled? The Honest Answer
  **Not definitively to everyone's satisfaction.** The deepest divides (natural kind ontology vs. practice ontology, semantic structure vs. pragmatic mechanism) are foundational philosophical stances influencing scientific methodology. You *can* make progress:

  1.  **Within Frameworks:** Refine models, generate novel predictions, find confirming/disconfirming evidence *for that specific level of analysis*. A Pragmatic model can become very successful at predicting lab judgments without convincing a Normativist about the concept's structure.
  2.  **Through Framework-Specific Falsification:** Design experiments targeting the *non-negotiables* (e.g., a SEE with *no* norm, blame, or pragmatic "point" – is it even possible? If asymmetry persists, Camp 1 & 3 struggle; if it vanishes, Camp 2 gains ground).
  3.  **By Shifting Focus:** Move beyond trying to explain "the SEE" as a monolithic entity. Ask more specific questions each framework *can* answer uniquely well (e.g., "What cognitive processes mediate the judgment?" for Pragmatists; "How does perceived blame modulate intentionality ratings?" for Normativists; "How is 'intentionally' deployed in actual blame disputes?" for Practice).

  **The honest move for your group:** Acknowledge the multi-level nature of the phenomenon and the validity (but incompleteness) of each framework. **Stop expecting a single "knockout" experiment or variant.** Instead:
  *   **Clarify:** Explicitly state which question (concept structure, judgment mechanism, social function) each person is trying to answer *in this discussion*.
  *   **Specify:** When proposing a variant, state *what specific commitment* of *which camp* it is designed to test and *what result* would challenge that commitment.
  *   **Diversify:** Incorporate methods beyond vignette tweaks (corpus analysis, modeling, interactive tasks, neuro) to provide different kinds of evidence.
  *   **Consider Synthesis:** Explore models that integrate elements (e.g., a pragmatic mechanism that *leverages* a concept with normative sensitivity *for* social accountability functions).

  The SEE is a rich phenomenon precisely because it sits at the intersection of concepts, cognition, pragmatics, and sociality. The impasse arises from insisting on a single, reductive explanation. Real progress lies in embracing the complexity and using the disagreement to generate sharper questions and more sophisticated methods. If the group can't do this, it *might* be time to table the SEE explicitly and focus on a question where the frameworks can engage more productively, using the lessons learned from this stalemate to frame the next discussion more carefully.
