    But note: in Configuration 1, the break-even price was 1/7 (about 0.142) and in Configuration 2 it's 2/5 (0.4). So we expect to see bankers setting lower prices in Configuration 1 and higher in Configuration 2.

    However, in the classic Sleeping Beauty problem, the two configurations would be:

        Config1: every awakening -> break-even at 1/3 (if coin is fair).
        Config2: one bet per experiment -> break-even at 1/2.

    But in our biased case, we have 1/7 vs 2/5? That might be confusing.

