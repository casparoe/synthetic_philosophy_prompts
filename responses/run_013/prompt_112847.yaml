    But note: the halfer position in the classic problem argues that Beauty should assign probability 1/2 to heads upon awakening, and that the betting argument for 1/3 is a confusion. In our Configuration 2, we are trying to show that if you only bet once per experiment (so the number of bets matches the number of flips), then the break-even price should be the coin probability. But our calculation shows it's not.

    We need to adjust the rules of Configuration 2 so that the banker's exposure per experiment is fixed. How about: for each experiment, the sleeper is allowed to place one bet, but they don't know if it's the first or second awakening. We can achieve this by having the auditors, for each experiment, randomly choose one awakening (beforehand) at which the bet will be offered. The other awakening has no betting. But then the sleeper, at an awakening, doesn't know if betting is allowed. We can have the auditor, at each awakening, flip a coin to decide if betting is allowed? But that might not work: the sleeper would know that if they are not offered a bet, then it might be because it's the second awakening of a tails experiment and they already bet? That breaks the amnesia.

    Alternatively, we can have the sleeper always offered the bet, but then if they bet at an awakening that is not the one selected for that experiment, it is voided. This is the same as our random selection.

    Given the time, we proceed with the random selection and in the debrief we explain that in Configuration 2, the break-even price is the conditional probability of heads given that the bet is settled.

    Now, to the debrief.

  **Debrief Plan:**

  1. Start by showing the tally from Configuration 1: 
        - Number of heads experiments and tails experiments.
        - Total number of bets: heads experiments * 1 + tails experiments * 2.
        - Ask: "What fraction of the bets were on heads experiments? And what fraction of the experiments were heads?"

