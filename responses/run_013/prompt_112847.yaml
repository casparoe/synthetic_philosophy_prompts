  6. Ask: "Did anyone feel that the two configurations were testing different things? What is the difference?"

  7. Introduce the Sleeping Beauty problem: 
        - Explain the setup: Beauty is put to sleep, coin is flipped (fair or not). Heads: awakened Monday only. Tails: awakened Monday and Tuesday. She is given amnesia between. Question: what probability should she assign to heads upon awakening?
        - Map: Configuration 1 is like the standard betting setup: she bets at every awakening. Configuration 2 is like we only let her bet once per experiment (by randomly selecting one awakening to count).

  8. The dispute:
        - In Configuration 1, the break-even price is the probability of heads given an awakening: P(H|awake). This is the "thirder" position (1/3 for fair coin).
        - In Configuration 2, the break-even price is P(H|awake and the bet counts). But note: in the classic problem, if we randomly select one awakening to bet, then P(H|awake and selected) = P(H) because the selection is random and independent. But wait, in the fair coin case:
              P(H|awake and selected) = P(H and selected) / P(selected).
          But the event "selected" is not independent of the coin. In fact, if heads, then Beauty is only awakened once, so she is always selected. If tails, she is selected with probability 1/2. So:
              P(H and selected) = P(H) = 1/2.
              P(selected) = P(H)*1 + P(T)*1/2 = 1/2 + 1/2 * 1/2 = 3/4.
              P(H|selected) = (1/2) / (3/4) = 2/3.
          So it's not 1/2.

        This is the same as our calculation above. So even in Configuration 2, the break-even price is not the coin probability.

    This is a problem. We wanted Configuration 2 to feel like the natural once-per-experiment bet, where the break-even price should be the coin probability. But it isn't.

    How can we fix this? We must ensure that the selection of which bet counts is independent of the coin and of the awakening. We can do: in Configuration 2, for each experiment, flip a coin at the beginning to decide which day's awakening will count (if it occurs). But then for a heads experiment, only Monday occurs, so it counts. For a tails experiment, we flip a coin to pick Monday or Tuesday, and then only the chosen day's bet counts. But the sleeper doesn't know which day it is? In the problem, Beauty doesn't know what day it is. So we would have to not reveal the day. This is getting very complex.

    Given the time, we might have to accept that Configuration 2 does not exactly mimic the once-per-experiment bet in the way we hoped. Instead, we can frame it as: in Configuration 2, we are randomly thinning the bets to one per experiment, and then the break-even price is the conditional probability of heads given that the bet was selected.

    And then we can say: the halfer might argue that Beauty should assign 1/2 to heads, and therefore should be willing to buy a contract at any price below 1/2 and sell at any price above 1/2. But in Configuration 1, if she does that, she will be exploited: in tails experiments, she will make two bets at unfavorable prices. Whereas in Configuration 2, the thinning means she only bets once, so she breaks even if the price is 1/2.

    In our biased coin example with Configuration 2 and fair selection, the break-even price was 2/5 (for a coin with P(heads)=1/4). But if a halfer sets the price at 1/4 (the coin probability), then they will lose money because the conditional probability given settlement is 2/5, so they are selling too cheaply.

    This might be too advanced.

    Alternatively, we can run Configuration 2 with a rule that only the first awakening counts, but then we break the amnesia. So perhaps we drop Configuration 2 and have a different approach.

    Given the complexity, I propose we change Configuration 2 to be: each sleeper is only awakened once per experiment. That is, we change the rule to: if heads, awakened once; if tails, awakened once (but they don't know which day). This is not the Sleeping Beauty problem.

    This is not satisfactory.

    Another idea: instead of having Configuration 2 be a different betting rule, we have the same sleepers and same awakenings, but change the banker's exposure. Specifically, in Configuration 2, the bankers are told that they are not betting on the outcome of the flip per se, but on the outcome of the flip for the entire experiment, and that they will only be settled once per experiment. That is, if a sleeper in a tails experiment places two bets with the same banker, the banker will only have to settle one of them (chosen at random) and the other is voided. This is from the banker's side.

    Then, the banker knows that no matter how many bets they take on the same experiment, they will only have to pay out once if heads. So the banker's liability per experiment is capped at 1 token per experiment they cover.

    Then, the banker should set the price at the coin probability (1/4) because they are effectively betting on the flip.

    But how do they know which bets are on the same experiment? They don't, but the auditors do. So the auditors, when settling, for each experiment and each banker, will randomly select one bet (if there are multiple) to be the one that counts for that banker-experiment pair. The rest are voided and reversed.

    This way, the banker's exposure per experiment is at most 1 token.

    Then, the break-even price for the banker is the coin probability: 1/4.

    This might work.

    Let's call:
        - Configuration 1: every bet counts separately.
        - Configuration 2: bankers are only exposed once per experiment (per sleeper's experiment). That is, for each banker and each experiment, if the banker took multiple bets on that experiment, only one is randomly selected to count.

    Now, in Configuration 2, the banker should set the price at the coin's probability (1/4) because their expected loss per contract is not the issue; per experiment, they have a single exposure.

    But note: the banker might take bets from different sleepers on different experiments. And for each experiment, they have at most one bet that counts. So the banker's portfolio is diversified by experiment. The price should be 1/4.

    How does this affect the sleepers? The sleeper doesn't know if their bet will be the one that counts for their experiment with that banker. But the sleeper's bet might be voided if the banker took another bet on the same experiment and that other bet was selected. This is a risk to the sleeper.

    This is asymmetric. But it might be acceptable.

    Given the time, I will change Configuration 2 to this new rule.

    Revised Configuration 2 rule: 
        - Bets are placed as in Configuration 1.
        - At settlement, for each experiment and each banker, if the banker took one or more bets on that experiment, then one of those bets is selected at random to count. The rest are voided and reversed.
        - This applies per experiment and per banker independently.

    Then, for a given experiment, a sleeper's bet with a particular banker might be voided even if it's the only bet the sleeper placed, if the banker took another bet from the other awakening (if any) and that other bet was selected.

    This is a bit complex, but it caps the banker's exposure per experiment.

    Now, the break-even price for the banker in Configuration 2 is the coin probability (1/4) because for each experiment they cover, they will have to pay out 1 token if heads and 0 if tails, and they receive P per bet they take, but only one bet per experiment counts, so they receive P for the selected bet (on average, per experiment, they receive an amount that averages to the price of one bet) and pay 1 if heads. So to break even, they need P = P(heads) = 1/4.

    For the sleeper, the bet might be voided, so they face the risk of the bet not counting. This might make them less willing to bet, but the amnesia is preserved.

    Given the time, we'll go with this for Configuration 2.

    We must explain it carefully.

  **Revised Configuration 2 rules:**
     - Betting proceeds as in Configuration 1.
     - After all bets are placed, for each experiment and each banker, the following is done:
          - If the banker took no bets on this experiment, nothing.
          - If the banker took exactly one bet, it counts.
          - If the banker took more than one bet on this experiment, then one of them is selected at random to count. The rest are voided.
     - Voided bets: reverse the token exchange that happened at betting.

     This rule means that for a given experiment, a banker will only have to settle one bet, regardless of how many they accepted.

  **Debrief for revised Configuration 2:**

     - Bankers should set the price at 1/4 because they are effectively betting on the coin flip and will have one exposure per experiment.
     - Sleepers might be reluctant to bet because their bet might be voided, but they will still bet if the price is in their favor.

     In the fair coin example, Configuration 1: break-even at 1/3.
     Configuration 2: break-even at 1/2.

     This achieves our goal.

     In our biased coin (1/4 heads), Configuration 1: break-even at 1/7.
     Configuration 2: break-even at 1/4.

     Perfect.

  **Final Timeline and Rules for Configuration 2:**

     - Configuration 2: 
          - Bankers post prices.
          - Sleepers bet at every awakening.
          - Settlement: 
               - For each experiment and each banker, if the banker has multiple bets on that experiment, randomly select one to count. Void the rest.
               - Voided bets: reverse the initial token exchange.
               - Settle the counted bets: if heads and buy, banker pays sleeper 1; if heads and sell, sleeper pays banker 1; if tails, nothing.

     - In the debrief, we can then compare the prices in the two configurations and see the shift from 1/7 to 1/4.

     - Then, for the fair coin Sleeping Beauty, it would be 1/3 to 1/2.

  **What the activity can't do:**

     - It doesn't reproduce the first-person perspective perfectly. The sleepers might feel like they are part of a group and might not fully identify with the single Sleeping Beauty. The tally information is available to the auditors, which is a god's-eye view, but the puzzle is about the first-person degree of belief.

     - The amnesia simulation is not perfect because the sleepers know they are in a game with multiple rounds. They might not forget that they have been awakened before, but they don't know if it was for the same experiment.

     - The activity might be too focused on betting and not on the philosophy of probability. The debrief should connect the betting behavior to degrees of belief.

     - It doesn address the halfer's argument that the thirder position double-counts the tails outcome. The halfer says that the evidence upon awakening is the same in either case, and since the coin is fair, it should be 1/2. The activity shows that betting at 1/2 in the every-awakening configuration is exploitable, but it doesn't directly engage with the evidence argument.

     - The activity also doesn't address self-locating beliefs (am I in the first or second awakening?).

     Despite these limitations, the activity should make the students feel the practical force of the thirder position in Configuration 1 and the shift to the halfer position in Configuration 2.

     Now, the full rules and timeline.
answer: |-
  Below is a complete design for your in-class game, tailored to your constraints and goals. It uses a biased coin (1/4 heads, 3/4 tails) to disrupt preconceived answers and focuses on betting behavior to create visceral tension between the "halfer" and "thirder" positions without naming them. The game explicitly avoids lecturing on the Sleeping Beauty problem until the debrief.

  ---

  ### **Game Design: "The Amnesic Bet"**
  **Objective:** Force students to confront the conflict between per-awakening and per-experiment betting through embodied experience, using money-on-the-table incentives and a tally reveal.

  **Roles & Materials:**
  - **Sleepers (8 students):** Experience awakenings, place bets. Start with 10 tokens.
  - **Bankers (4 students):** Post a single price for heads (between 0-1) before each round. Must accept all bets (buy/sell) at that price, capped at 2 tokens per bet. Start with 20 tokens.
  - **Auditors (2 students):** Run the randomizer, manage awakenings, and tally bets secretly. Use a bag with **1 red chip (heads) and 3 blue chips (tails)** for the coin. Record:
    - Outcome per experiment (red/blue).
    - Total bets placed per outcome.
    - Which bets are valid (for Configuration 2).
  - **Materials:**
    - Bet slips (paper) for Sleepers: Fields for *Sleeper name*, *Banker name*, *Action (Buy/Sell)*, *Stake (1 or 2 tokens)*.
    - Price boards for Bankers (whiteboards or paper).
    - Tokens (poker chips, candy, or fake currency).
    - Two identical "isolation booths" (desks with partitions + blindfolds) to simulate amnesia.
    - A stopwatch.

  **Core Rules:**
  1. **Price Posting:** Bankers write one price (e.g., 0.3) before each round. They must honor all bets at this price (no spreads, no hedging).  
  2. **Awakening Protocol:**  
     - Sleepers are called one-by-one to a booth. An Auditor blindfolds them, then says:  
       *"You are awakening. A coin was flipped with P(heads)=1/4. You may bet on heads at any Banker's price."*  
     - Sleeper fills a bet slip (selecting Banker, Buy/Sell, stake 1–2 tokens), then leaves the booth.  
     - **Amnesia Simulation:** Sleepers return to a waiting area and are called in random order. Identical booths and blindfolds prevent inferring "which awakening" it is.  
  3. **Randomizer:** Auditors draw a chip from the bag to determine heads/tails per experiment. **Heads = 1 awakening, Tails = 2 awakenings.**  
  4. **Payouts:**  
     - **Buy contract:** Sleeper pays price \(P\) to Banker upfront. If heads, Banker pays sleeper 1 token per stake.  
     - **Sell contract:** Banker pays price \(P\) to Sleeper upfront. If heads, Sleeper pays Banker 1 token per stake.  
     - Tails: No further action.  
  5. **Two Configurations (run sequentially):**  
     - **Configuration 1 (Per-Awakening):** All bets placed at every awakening are valid.  
     - **Configuration 2 (Per-Experiment):** Only one randomly selected bet per Sleeper counts. Auditors void extra bets by reversing token exchanges.  

  ---

  ### **Timeline (75 Minutes)**
  | Time  | Activity                                                                                              |
  |-------|-------------------------------------------------------------------------------------------------------|
  | 0-5   | **Setup:** Assign roles (8 Sleepers, 4 Bankers, 2 Auditors). Distribute tokens. Explain rules *without* philosophy: "Bankers post one price. Sleepers bet blindly at awakenings. Goal: Maximize tokens." |
  | 5-10  | **Config 1 (Per-Awakening):** Bankers post prices. Sleepers await "awakenings." Auditors prepare chip bag. |
  | 10-30 | **Awakenings (Config 1):** Auditors run 4 experiments (1 chip draw each). For each: call Sleepers to booths in random order (1–2 awakenings based on chip). Sleepers place bets in booths. |
  | 30-35 | **Settlement (Config 1):** Reveal chips. Settle all bets. Auditors announce tally: *"Total bets: X in heads experiments, Y in tails experiments."* (e.g., 4 heads, 12 tails if 1 head + 3 tails experiments). |
  | 35-40 | **Config 2 (Per-Experiment):** Bankers post *new* prices. Reset chip bag. Same 4 experiments (redraw chips). |
  | 40-60 | **Awakenings (Config 2):** Same as Config 1, but Auditors secretly randomize which bet per Sleeper counts (void others by reversing tokens). |
  | 60-65 | **Settlement (Config 2):** Reveal chips. Settle valid bets. Auditors announce: *"Total bets placed: X. Valid bets: 4 (one per experiment)."* |
  | 65-75 | **Debrief:** Guided discussion (see below).                                                          |

  ---

  ### **Debrief (20 Minutes)**
  **Goal:** Map game moments to the Sleeping Beauty puzzle without lecturing. Elicit student observations first.

  1. **Tally Reveal (Config 1):**  
     - *Ask:* "In Config 1, bets in tails experiments outnumbered heads 3:1. Bankers, how did this affect your price?"  
     - **Link:** Bankers who set prices >0.25 (e.g., 0.4) got "bought out" (Sleepers sold contracts, betting against heads). Why? In tails, two bets per experiment forced Bankers to overexpose. This mirrors the "thirder" view: awakening probability of heads is \(P(\text{heads}) / (\text{total awakenings}) = (1/4)/(1/4 + 2 \cdot 3/4) = 1/7\). Setting prices near 1/7 avoids exploitation.  

  2. **Banker Price Crisis (Config 1):**  
     - *Ask:* "Did any Banker regret their price? Why?"  
     - **Link:** High prices encouraged Sleepers to sell, leading to losses on tails (paying out twice). Low prices led to buying, with catastrophic heads payouts. The "mandatory" price (1/7) balances per-awakening frequency.  

  3. **Config 2 Shift:**  
     - *Ask:* "In Config 2, the same bets were placed, but only 4 counted—one per experiment. How did this change your strategy?"  
     - **Link:** Bankers set prices near 0.25 (actual P(heads)). Voiding extra bets made tails less dangerous. This mirrors the "halfer" view: bets should reflect the coin probability, not awakening count.  

  4. **Key Conflict:**  
     - *Ask:* "What is the difference between the two configurations? Is one 'fairer'?"  
     - **Link:**  
       - Config 1: Bets tied to *awakenings* → Price reflects **self-locating uncertainty** (Sleepers don’t know if first or second awakening).  
       - Config 2: Bets tied to *experiments* → Price reflects **causal probability** (the coin’s bias).  
     - Highlight the halfer’s strongest point: "In Config 2, the tally showed most bets were in tails experiments, but voiding them made the coin probability decisive. Is this a bookkeeping trick, or does it respect what you *truly* bet on?"  

  5. **Name the Puzzle:**  
     - Finally, reveal: "This was the Sleeping Beauty problem. Config 1 = thirders (probability 1/3 for fair coins). Config 2 = halfers (probability 1/2). The tally is the god’s-eye view Beauty lacks."  

  ---

  ### **Predictable Problems & Solutions**
  1. **"Amnesia is unrealistic!"**  
     - *Response:* "Agreed—no drug works this way. We’re isolating a *logic* of betting under ignorance. Does the math force a answer despite the absurd setup?"  

  2. **Banker Refuses Fixed Price or Widens Spread:**  
     - *Response:* Enforce rules. "You must post one price. If you hedge, you’re out of the game." Use peer pressure: "Other Bankers are committing."  

  3. **Sleeper/Banker Tries to Change Bets Post-Tally:**  
     - *Response:* "All decisions are final. The tally is secret until revealed—no revisions."  

  4. **Auditor Error in Tally/Randomization:**  
     - *Solution:* Have a "backup bag" with pre-drawn chips to ensure P(heads)=1/4. Use a script for awakenings.  

  ---

  ### **What the Activity Can’t Do**
  1. **Reproduce First-Person Uncertainty:**  
     - Students know they’re in a game with multiple participants. The tally gives them god’s-eye data Beauty lacks. You’ll need to *explicitly contrast* the Auditor’s tally with Beauty’s isolation: "Beauty sees only her own awakening—no tally exists."  

  2. **Resolve the Philosophy:**  
     - The game makes both positions feel compelling but can’t prove who is "right." Use the debrief to surface the core conflict:  
       - **Halfer:** Bets should reflect the experiment (voiding extra bets is honest bookkeeping).  
       - **Thirder:** Bets should reflect awakening frequency (voiding ignores real liabilities).  

  3. **Cover Self-Locating Beliefs:**  
     - Students never genuinely wonder, "Is this my first or second awakening?" The booths simulate amnesia physically, but the existential confusion requires your narration: "Beauty literally can’t tell if this is Monday or Tuesday."  

  4. **Generalize to All Probabilities:**  
     - The biased coin prevents rote answers but may obscure how the 1/2 vs. 1/3 dispute maps to fair coins. In debrief, note: "With a fair coin, Config 1 break-even price is 1/3; Config 2 is 1/2."  

  ---

  This design forces students into the puzzle’s tension through financial stakes, then uses the tally and Config switch to make the halfer/thirder conflict bodily. The reveal hits harder because they’ve *lived* the math before naming it.
