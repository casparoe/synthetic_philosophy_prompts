answer: |-
  Here’s a desiderata list for theories of vagueness, built to handle your two cases explicitly and grounded in core phenomena rather than partisan commitments. Each item includes a justification ("why it’s required") and notes conflicts where they arise. **Bold** marks key tensions. The scoring is concise as requested.

  ---

  ### Desiderata for Theories of Vagueness  
  *(with justifications and conflicts)*

  1. **No Sharp Boundaries (NSB)**  
     *Requirement*: The theory must explain why we cannot draw a precise line (e.g., between bald/non-bald) *without* appealing to ignorance or epistemic limitations alone.  
     *Why*: Sorites paradoxes show that asserting any sharp cutoff seems arbitrary or incoherent. **Case 1 challenge**: If quantum indeterminacy makes a precise boundary unknowable but exists, NSB demands the theory explain why this *doesn't* resolve vagueness (it’s not just about knowledge).  

  2. **Tolerance Principle (TP)**  
     *Requirement*: The theory must accommodate the intuition that sufficiently small differences (e.g., one hair, one grain) *cannot* change the truth-value of a vague predicate.  
     *Why*: Rejecting TP collapses into precision (undermining NSB). **Case 2 relevance**: TP explains why each step in the committee's rule-change seems permissible, but the theory must also explain why TP doesn’t license the *whole* trajectory.  

  3. **Penumbral Connections (PC)**  
     *Requirement*: The theory must preserve logical relations between vague predicates (e.g., "x is bald" and "x is not bald" can’t both be true; if "x is tall" and "y is taller", y can’t be "not tall" if x is tall).  
     *Why*: Without PC, vague language loses basic inferential structure. **Case 2 link**: If amendment-order changes outcomes, PC must hold *within* each sequence without implying global consistency.  

  4. **Higher-Order Vagueness (HOV)**  
     *Requirement*: The theory must allow that the boundary between definite cases and borderline cases is itself vague.  
     *Why*: Any attempt to draw a meta-boundary (e.g., "definitely bald"/"borderline") regenerates sorites problems. **Case 1 test**: If quantum indeterminacy fixes a boundary, HOV shows vagueness persists *even if* precise cutoffs exist unknowably.  

  5. **Path-Dependence Sensitivity (PDS)**  
     *Requirement*: The theory must explain how small changes can be truth-preserving stepwise but lead to divergent endpoints based on order (as in Case 2), without treating this as distinct from vagueness.  
     *Why*: Case 2 shows that standard sorites (linear, monotonic change) is insufficient; vagueness in dynamic contexts requires accommodating non-commutative operations. Ignores this at the cost of descriptive inadequacy.  

  6. **Practical Applicability (PA)**  
     *Requirement*: The theory must not make vague predicates unusable in ordinary reasoning or communication (e.g., by requiring inaccessible precision).  
     *Why*: Vagueness is ubiquitous in practice; theories that "solve" paradoxes by making language non-functional fail. **Case 1 pitfall**: If quantum-based ignorance "explains" vagueness but makes boundary-knowledge impossible even in principle, PA is violated.  

  7. **Meaning Supervenes on Use (MSU)**  
     *Requirement*: The meaning of vague terms must be grounded in actual linguistic practice, not hidden facts beyond use.  
     *Why*: Rejecting MSU severs meaning from communication. **Case 2 tension**: If amendment-order affects outcomes, MSU demands that meaning be sensitive to *how* the predicate is applied historically.  

  ---

  ### **Key Conflicts**  
  - **NSB + TP + HOV vs. Precision**: NSB and TP forbid sharp boundaries; HOV extends this to meta-boundaries. But precision-based views (e.g., epistemicism) violate these by positing unknowable cutoffs.  
  - **PDS + PC**: Path-dependence may threaten PC if "same rule" has divergent truth-conditions across histories. Can a theory preserve PC within paths without requiring global consistency?  
  - **PA + HOV**: If HOV is infinite (no definite meta-levels), PA may be impractical for real agents.  

  ---

  ### **Brief Scoring vs. Desiderata**  
  *(Epistemicism / Supervaluationism / Degree Theory)*  

  1. **NSB**: Fails (posits sharp boundaries) / Honors (no precise boundaries) / Honors (graded boundaries).  
  2. **TP**: Rejects (small steps *can* change truth-value) / Honors (small steps preserve truth in all precisifications) / Honors (small steps preserve similar degrees).  
  3. **PC**: Honors (classical logic) / Honors (global consistency across precisifications) / Fails (degrees may violate non-contradiction).  
  4. **HOV**: Fails (only first-order vagueness) / Struggles (regress problem) / Honors (meta-vagueness modeled by fuzzy degrees).  
  5. **PDS**: Fails (order is irrelevant to hidden truth) / Fails (super-truth static) / Partial (degrees track local changes, but order-dependence is ad hoc).  
  6. **PA**: Fails (unknowable boundaries cripple use) / Partial (overgenerates "indeterminate" judgments) / Honors (usable in approximate reasoning).  
  7. **MSU**: Fails (meaning beyond use) / Honors (meaning via admissible precisifications) / Partial (degrees tied to use, but calibration arbitrary).  

  ---

  ### **How Your Cases Reshape the List**  
  - **Case 1 (quantum ignorance)**: Tests whether vagueness reduces to *any* epistemic limitation (even fundamental). Desiderata **NSB** and **HOV** show that vagueness persists *independently* of what we can know—so theories must explain why quantum boundaries don’t "solve" sorites.  
  - **Case 2 (order-dependent change)**: Forces **PDS** as a core requirement. Theories must handle non-monotonic, path-sensitive vagueness without treating it as separate (e.g., supervaluationism’s "fixed" precisifications struggle here).  

  The tension between **PDS** (dynamic) and **PC** (static) is especially thorny—no standard theory reconciles them cleanly. This list suggests vagueness in evolving contexts (law, AI, social predicates) may demand new tools.
