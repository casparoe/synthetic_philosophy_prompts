  ### Summary
  - **Game 1** satisfies (a)–(c): \(\mathbb{E}[X] = \infty\), log agent pays finite fee (\(c^* \approx 2.75\)).  
  - **(d) is impossible**: Minimum payoff caps \(c^*\) for any game meeting (a).  
  - **Load-bearing insight**: Not infinite expectation per se, but the **minimum payoff** (for log utility feasibility) and **\(\mathbb{E}[\log(1 + X)] < \infty\)** (for finite \(c^*\)).  
  - **Preparation tip**: Bring the partial sum calculation for \(c = 2.7\) and \(c = 2.8\) to showcase convergence.
