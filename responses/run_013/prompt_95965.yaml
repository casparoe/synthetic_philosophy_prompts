  First, I need to break down the strict vs. effective distinction. Strict lexicality means an infinite exchange rate: no amount of sub-threshold goods can outweigh above-threshold suffering. Effective lexicality has a finite but extremely steep rate. The user’s concern is whether effective lexicality is just a large number, making it arbitrary, and if it still allows for some implausible trade-offs in theory, even if not in practice.

