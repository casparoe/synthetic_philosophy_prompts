  The user seems to be an academic (likely humanities PhD student or early-career researcher) preparing a small internal grant. Their tone suggests they've done significant preliminary thinking but need help structuring it rigorously. Key constraints: 8 weeks, ~6k words, no archival work. They're clearly worried about scope creep and want to avoid well-trodden intention debates.

  What they really need is: 
