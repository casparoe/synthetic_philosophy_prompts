  - Clear demonstration of how this hasn't been addressed by Wimsatt/Beardsley (anti-intentionalism), Hirsch (intentionalism), or hypothetical intention theories
  - A feasible 8-week methodology that produces concrete answers
  - Defined success/failure conditions to prevent it becoming "just a vibe"

  The tricky parts:
  - Avoiding conflation with existing concepts like "Death of the Author" or reader-response theory
  - Preventing drift into copyright/practical permissions rather than interpretive authority
