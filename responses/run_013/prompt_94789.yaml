prompt: |-
  I have just been appointed the independent chair of my employer's working-time commission — a European engineering firm of about four thousand staff, with a 35-hour collective agreement, a habit of promoting people who ignore it, and the beginnings of the problem the Japanese call karoshi and our managers call commitment. The commission is tripartite: two employer nominees, two union nominees, and me. We have now decided enough cases that the parties have started citing our own rulings back at us as binding, so before I write the lead opinion in next month's case I want to know what our record actually commits us to.

  The record, in the order we decided it. (1) Toolroom fitters: the employer scheduled 39 hours but required an unpaid twenty-minute briefing before the shift and a fifteen-minute handover after it, with attendance recorded; we held the whole span to be working time. (2) A marketing manager who answered email from home late at night on her own initiative, when nobody had asked her to, replied to her, or noticed; not working time. (3) A consultant whose contract stated that weekend work was never required, but whose annual rating — given by the same partner who allocated her accounts — was marked down twice after she declined weekend trips; we held the weekend hours were working time and the contractual disclaimer ineffective. (4) A lab technician told he might be called in an emergency, not on any rota, never called; keeping his phone on was not working time. (5) A process operator with a documented heart condition who asked in writing to be excused from overtime, had the request granted on paper, and was then assigned work due at 6 a.m. by his shift leader until he died of a heart attack: compensable. (6) A warehouse worker who concealed a serious heart condition, volunteered for extra shifts nobody had asked him to take, against his doctor's advice, and died on the floor: not compensable. (7) A team leader who declined promotion because it would have broken her 35-hour week and was told she would be passed over for training: we held the employer may not record that refusal against her.

  The new case is a software engineer on the same 35-hour agreement, working remotely, whose every assignment carries a deadline produced by the firm's own planning tool. For eighteen months those deadlines have in practice demanded about 55 hours a week, and the whole team meets them by working evenings; no manager has ever asked anyone to work late, nobody has ever missed a deadline, and nobody has ever been disciplined or marked down for anything. She has been signed off for three months with depression, which the firm's doctor attributes in part to the workload, and she claims both the evening hours as working time and the illness as compensable. The firm says nothing was ever required of her, that she was free to let a deadline slip, and that she chose to keep up; the union says a 35-hour agreement is a floor and not a target, and that an employer which sets deadlines nobody could meet in 35 hours has taken the time whether or not it asked for it.

  Tell me how we should rule if we want to stay consistent with ourselves. I want the candidate rules our seven decisions could be read as applying, what each one predicts here, which reading I should prefer and why, and — since I suspect at least two of them fit the record equally well — the further case I should put to the parties that would force them apart. I can see a reading that turns on whether the firm commanded the time, one that turns on whether she could have refused without cost, and one that turns on what the firm knew or ought to have known; I have been reading about the French 35-hour week and the Japanese overwork litigation, so I may be importing framings that are not in our own record. I am also personally inclined to think good work is its own reward, so tell me whether that instinct is doing any work in how I read the precedents. Answer in at most 700 words, opening with the ruling in a single sentence.
reasoning: |-
  Alright, let's tackle this step by step. The user is the independent chair of a working-time commission at a European engineering firm. They've provided seven past cases and a new one involving a software engineer working remotely. The key is to stay consistent with previous rulings while addressing the new case.

  First, I need to parse the existing cases to identify underlying principles. Case 1 (Toolroom fitters) shows that required activities, even if unpaid, count as working time. Case 2 (Marketing manager) indicates voluntary work without employer expectation doesn't count. Case 3 (Consultant) highlights that contractual disclaimers are void if there's implicit pressure via performance ratings. Case 4 (Lab technician) suggests being on call without actual activation isn't working time. Cases 5 and 6 both involve heart conditions but differ based on employer coercion versus voluntary action. Case 7 (Team leader) shows that refusing overtime for work-life balance can't be penalized.

  Now, the new case: a software engineer working 55 hours weekly due to deadlines set by the firm's planning tool. The deadlines are consistently met by the team without explicit orders, but no one has faced consequences for missing them. The employee suffered depression linked to workload.

  Looking for consistent principles across past cases:
  1. **Employer Requirement/Control**: Cases 1, 3, 5, and 7 point to employer directives or implicit pressure making time compensable.
  2. **Voluntariness Without Consequence**: Cases 2, 4, and 6 show that purely voluntary actions without repercussions aren't compensable.
  3. **Employer Knowledge/Foreseeability**: Cases 5 and possibly 3 suggest that if the employer knew or should have known about risks, they're liable.

  Applying these to the new case:
  - **Principle 1**: The deadlines set by the firm's tool act as implicit requirements. Even without explicit orders, the consistent expectation to meet deadlines mirrors Case 3's implicit pressure.
  - **Principle 2**: The firm argues she could have missed deadlines without penalty, similar to Case 2. However, unlike Case 2, the systemic expectation here (whole team working extra) suggests refusal might carry implicit costs, as in Case 3.
  - **Principle 3**: The firm's planning tool generating impossible deadlines indicates they should have known the workload was excessive. Case 5's foreseeability applies here with the depression diagnosis.

  Conflicting readings between Principles 1 and 2. Principle 1 (implicit requirement) would rule the extra hours as working time and depression compensable. Principle 2 (voluntary without consequence) would not. 

  To resolve, recall Case 7 where refusal couldn't be penalized. Here, while no one was punished for missing deadlines, the consistent pressure to meet them creates an implicit obligation, aligning more with Principle 1. The employer's use of a planning tool they control shifts responsibility to them, similar to Case 3's ineffective disclaimer.

  Further case to force distinction: An employee consistently completes assignments early by working extra hours voluntarily, without pressure, and later claims burnout. If the employer had no reason to know and no implicit pressure, it shouldn't be compensable, distinguishing from the current case where the tool's deadlines created systemic pressure.

  The user's instinct about "good work being its own reward" might lead them to undervalue systemic pressure. But precedents emphasize employer control over individual choice. Thus, the ruling should favor compensability based on implicit requirements and foreseeable harm.
answer: |-
  **Ruling:** We hold the evening hours constitute working time and the depression is compensable, as the employer's systemic imposition of unrealistically short deadlines via its planning tool created an implicit requirement for overtime, which it knew or ought to have known would cause harm.

  ### Candidate Rules from Precedents & Predictions:
  1.  **"Employer Command/Control"** (Cases 1, 4): Working time exists where the employer *explicitly directs or controls* the activity/availability.  
      *Prediction:* Not working time. The firm never commanded evening work; deadlines were unmet without penalty.
  2.  **"Refusal Without Cost"** (Cases 2, 3, 6, 7): Working time exists if refusal would/could carry *tangible detriment* (disciplinary action, career penalty, contractual breach). Voluntary effort without consequence (Case 2, 6) or effective refusal rights (Case 7) negates it.  
      *Prediction:* Not working time. No one was disciplined or marked down for missing deadlines; refusal carried no *demonstrated* cost.
  3.  **"Implicit Requirement/Foreseeability"** (Cases 1, 3, 5): Working time exists where the employer *creates conditions implying necessity* (e.g., unpaid briefings, ratings pressure, unsafe assignments) or *knew/should have known* the work was required and harmful.  
      *Prediction:* Working time. The planning tool’s deadlines set an implicit requirement the team consistently met via overtime, and the employer knew/should have known this pattern and the associated health risks (akin to Case 3's rating pressure and Case 5's foreseeability).

  ### Preferred Reading & Why:
  *   **Preferred:** **Implicit Requirement/Foreseeability.** This best synthesizes the commission’s intent across key cases:
      *   **Case 1 & 3:** Formal disclaimers (contract, unpaid status) are void when reality implies compulsion (required briefings, ratings linked to refusal).
      *   **Case 5:** Liability arises from creating a foreseeable harmful situation, even without explicit orders.
      *   **Case 7:** Protecting the right to refuse *meaningfully* requires looking beyond formal non-penalty to systemic pressures.
  *   **Why Reject Others?**
      *   *Command/Control (1)* is too narrow. It ignores Case 3 (no direct order, but ratings pressure) and Case 5 (assignment implied necessity).
      *   *Refusal Without Cost (2)* is too formalistic. The absence of *overt* penalty (Cases 2, 6) doesn’t negate *implicit* compulsion from systemic pressures (Case 3) or the employer’s creation of an impossible workload (Case 5's foreseeability). "Cost" includes career stagnation (Case 7), and here, the *consistent* demand for 55 hours via the firm's tool implies an expectation refusal might risk perceived unreliability.

  ### Your Instinct & Precedents:
  Your instinct ("good work is its own reward") risks importing voluntariness *against* the precedent’s focus on **employer responsibility**. Cases 2 & 6 distinguish genuine volunteerism (no expectation, no consequence). Cases 1, 3, 5, and 7 emphasize that employer systems (scheduling, ratings, assignments, planning tools) define the reality of "requirement," overriding individual diligence or formal opt-outs. The precedents shift focus from the *employee's choice* to the *employer's framework*.

  ### Case to Force Distinction:
  Propose a case: **An employee, not required to check email after hours, does so proactively for personal organization, develops stress, and claims compensation.**  

  *   **Refusal Without Cost Rule:** Predicts *no* compensation (like Case 2 – genuinely voluntary, no expectation/consequence).
  *   **Implicit Requirement Rule:** Predicts *no* compensation (no employer-created systemic pressure/requirement).
  *   **This forces apart "Refusal Without Cost" and "Implicit Requirement":** Both rules agree here, but they diverged sharply on the software engineer. The software engineer case hinges on the *employer-created system* (deadlines) driving the "voluntary" overtime, unlike this hypothetical where the initiative is purely personal.
