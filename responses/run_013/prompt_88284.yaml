prompt: |-
  A colleague in my ethics reading group keeps modeling consent on contract. Her claim is that the three standard ways consent goes wrong — deception, coercion, and incompetence — are just the consent-theoretic analogues of the three standard ways a contract goes wrong: misrepresentation or fraud, duress, and incapacity. She draws the moral that a deception-tainted consent is void in the way a fraudulently procured contract is void, that the disclosure owed before consent is the disclosure owed before signing, and that the whole apparatus of contract doctrine — the void/voidable distinction, the materiality and reliance requirements, the objective reasonable-person standard — can be transplanted wholesale to tell us when consent is valid. She also likes to put it in a Hohfeldian register: consent is the exercise of a power to waive a claim-right, and a contract is the exercise of a power to create one, so the two are the same kind of legal-moral move and should share validity conditions.

  I am not convinced, but I do not want to dismiss it either. Audit the analogy. Give me the correspondence table first — what plays the role of offer and acceptance, of consideration, of the meeting of the minds, of the signature, of breach, and of remedy — and say which of those roles has no occupant on the consent side, and whether each empty slot is a genuine gap or a sign that the mapping was wrong from the start. Then the disanalogies, sorted into the ones that matter for her conclusion and the ones that do not. I am especially interested in four points: (i) whether consent is bilateral at all, given that a proposal need not be made and, once consent is given, need not be accepted to be effective; (ii) whether the revocability of consent has any counterpart in contract, and what its absence does to the analogy; (iii) whether the void/voidable distinction carries over, and what the difference between invalid consent and merely vitiated consent actually amounts to; and (iv) whether importing the objective reasonable-person standard changes the subject, since a great deal of consent theory is about what this particular person actually understood or willed. Finally, tell me whether the transplanted conclusion survives — that deception vitiates consent exactly as fraud voids a contract, with the same materiality and reliance thresholds — or whether the analogy was carrying that conclusion all along. And if there is a better analogy for the validity conditions of consent, name it and say what it gets right that the contract analogy gets wrong.
reasoning: |-
  Okay, the user is part of an ethics reading group where a colleague models consent on contract law. The colleague argues that the three ways consent goes wrong—deception, coercion, and incompetence—mirror contract's issues: fraud, duress, and incapacity. The user wants an audit of this analogy. Let me break down what they need.

  First, they want a correspondence table mapping contract elements to consent. I need to list contract components like offer, acceptance, consideration, etc., and see if they have equivalents in consent. For example, offer in contract might correspond to a proposal in consent, but consent doesn't always need a proposal. Consideration is tricky—consent doesn't require mutual exchange, so that slot is empty. The user mentioned specific points: bilaterality, revocability, void vs. voidable, and the objective standard. 

  Bilaterality is a key disanalogy. Consent can be unilateral; no mutual agreement is needed. Revocability is another big one. Consent can be withdrawn anytime, unlike contracts which are binding. The void/voidable distinction might not cleanly apply to consent. For instance, incompetence might make consent void, but deception could be voidable depending on the context. The objective standard in contracts uses a reasonable person, but consent often focuses on the individual's actual understanding, which is more subjective. 

  The user is especially interested in whether the transplanted conclusion holds—does deception vitiate consent like fraud voids a contract? Contract requires materiality and reliance, but consent might not. For example, in medical contexts, any deception could invalidate consent regardless of materiality. The colleague's analogy might force consent into a legal framework that ignores ethical nuances. 

  I should consider if there's a better analogy. The user might be looking for alternatives. Gift-giving comes to mind because it's a unilateral waiver without exchange, aligning with consent's structure. Or perhaps promissory oaths, emphasizing personal commitment. These might capture the personal aspect better than contract. 

  The user's deeper need is to challenge the colleague's model without dismissing it entirely. They likely want a balanced critique that acknowledges similarities but highlights where the analogy fails, especially in ethical contexts. They might be preparing for a discussion in their reading group, needing thorough points to present. Ensuring clarity on why contract principles don't fully translate to consent ethics is crucial here.
answer: |-
  Here's a systematic audit of the contract-consent analogy, addressing your specific points and evaluating its overall viability:

  **I. Correspondence Table (Contract : Consent)**

  | Contract Element          | Consent Analog                                    | Occupied? | Gap or Mapping Error?                  | Reasoning                                                                 |
  | :------------------------ | :------------------------------------------------ | :-------- | :------------------------------------- | :------------------------------------------------------------------------ |
  | **Offer**                 | Proposal / Invitation to Act                      | Partial   | **Genuine Gap**                        | Consent often occurs without a prior proposal (e.g., medical emergencies). |
  | **Acceptance**            | Expression of Consent                             | Yes       | -                                      | Clear correspondence: The affirmative "yes" or equivalent action.        |
  | **Consideration**         | *None*                                            | **No**    | **Mapping Error**                      | Consent is a unilateral waiver/authorization, not a mutual exchange of value. No "price" is paid for the waiver. |
  | **Meeting of the Minds**  | Understanding & Agreement on Scope               | Partial   | **Significant Gap / Weaker Analog** | Contracts require mutual assent on *terms*; consent requires understanding of the *nature & consequences* of the specific act, less focus on mutual agreement on *terms*. |
  | **Signature (Formality)** | Expression/Form (Verbal, Written, Gestural)       | Yes       | -                                      | The outward manifestation signifying assent.                             |
  | **Breach**                | Violation of Scope / Condition                    | Partial   | **Genuine Gap**                        | Breach implies breaking an agreement. Violating consent is a *wrong* (trespass, battery) but not necessarily a "breach" of a mutual pact. It exceeds the scope *authorized*. |
  | **Remedy**                | Redress for Wrong (Damages, Injunction, Criminal) | Partial   | **Genuine Gap / Different Focus**      | Remedies exist (damages, injunctions, criminal charges), but they flow from the *violation of rights*, not breach of a *promise to perform*. Punitive elements are stronger. |
  | **Mutual Assent (Bilaterality)** | *Unilateral Authorization*                       | **No**    | **Fundamental Mapping Error**          | **This is critical (Your Point i).** Consent is fundamentally unilateral: granting permission *to another*. The recipient's "acceptance" is simply acting within the bounds granted. No mutual *promises* are made. |

  **II. Key Disanalogies & Their Impact**

  1.  **Bilaterality vs. Unilaterality (Your Point i):**
      *   **Disanalogy:** Contracts *require* mutual assent to *mutual obligations*. Consent is the *unilateral exercise of a power* to authorize another to act concerning a *right held by the consent-giver*. The recipient need not agree to anything; they merely act within the scope granted.
      *   **Impact on Conclusion:** **Severe.** This undermines the core structural analogy. Transplanting doctrines built on mutual exchange (like consideration, mutual promises, reliance damages) becomes highly suspect. The "agreement" framework is fundamentally mismatched to the "authorization" nature of consent.

  2.  **Revocability (Your Point ii):**
      *   **Disanalogy:** Consent is generally freely revocable at will, subject only to practical limitations (e.g., cannot revoke consent *after* a completed surgery). Contracts are binding and generally irrevocable without breach, mutual agreement, or specific legal doctrines (rescission, frustration).
      *   **Counterpart?** Contractual *options* or *licenses revocable at will* are weak analogs. Rescission for misrepresentation/duress is a remedy, not inherent revocability.
      *   **Impact on Conclusion:** **Significant.** The inherent revocability of consent highlights its nature as a continuous state of authorization, not a fixed exchange of promises. The lack of a strong counterpart in contract doctrine suggests the analogy struggles with the temporal and dynamic aspect of consent. It weakens the idea that consent, once "validly given," functions like a binding contract.

  3.  **Void vs. Voidable Distinction (Your Point iii):**
      *   **Disanalogy:** The distinction exists in both domains but operates differently.
          *   **Contract:** Void *ab initio* (e.g., illegal contract); Voidable (e.g., minor's contract, fraud) – valid until rescinded by the aggrieved party.
          *   **Consent:** "Void" (Absolute nullity, no effect - e.g., consent by someone profoundly unconscious). "Voidable" (Potentially invalid, depending on ratification, context - e.g., consent under moderate duress or minor deception).
      *   **Impact on Conclusion:** **Moderate.** The *concepts* map reasonably well (total invalidity vs. defeasible validity). However, the *criteria* for void vs. voidable might differ subtly, particularly regarding the role of reliance (stronger in contract voidability) and the nature of the harm (physical integrity vs. economic expectation). The analogy *can* be useful here, but needs careful handling.

  4.  **Objective Standard vs. Subjective Will/Understanding (Your Point iv):**
      *   **Disanalogy:** Contract heavily relies on the *objective* "reasonable person" standard for assent ("manifestation of intent"). What a party *secretly* intended is usually irrelevant. Consent theory, especially in ethics and intimate/medical contexts, places immense weight on the *subjective* understanding and will of the *specific individual*. Did *this person* truly understand and agree to *this specific act*?
      *   **Impact on Conclusion:** **Critical.** Transplanting the objective standard risks fundamentally **changing the subject** from validating the *individual's* autonomous authorization to judging whether a *reasonable observer* would think consent occurred. This clashes directly with core ethical justifications for consent (respect for autonomy). While "objective" manifestations matter (communication), the ultimate ethical question often hinges on the subjective state. The analogy pushes strongly towards the objective view, potentially distorting the ethical inquiry.

  5.  **Materiality & Reliance Thresholds (Your Implicit Point & Final Question):**
      *   **Disanalogy:** Contract law often requires the misrepresentation (fraud) to be *material* (would a reasonable person care?) and may require *justifiable reliance* for rescission or damages. Consent ethics generally rejects such thresholds for deception. *Any* material deception about the *nature* or *essential aspects* of the act typically vitiates consent, regardless of whether the deceived person "should" have cared or whether the deceiver "relied" on the consent being valid. The wrong is violating bodily/sexual autonomy based on a false premise, not disappointed economic expectations.
      *   **Impact on Conclusion:** **Fatal to the Transplanted Conclusion.** The colleague's core claim – "deception vitiates consent exactly as fraud voids a contract" – **does not survive** this disanalogy. The contract doctrine's materiality and reliance requirements are inappropriate transplants into the consent context. Consent is vitiated by deception relevant to the *individual's* decision, not just deception a "reasonable person" would find material. Reliance by the actor (e.g., a surgeon) is generally irrelevant to the *validity* of the consent for ethical purposes (though it might affect culpability or remedies).

  **III. Does the Transplanted Conclusion Survive?**

  *   **No.** The analogy **was carrying the conclusion all along** by forcing consent into the contractual framework of mutual exchange, objective assent, and economic harms.
  *   The fundamental structural differences (unilateral authorization vs. bilateral exchange), the absence of consideration, the primacy of subjective understanding in ethics, the inherent revocability, and the differing treatment of deception (rejecting materiality/reliance thresholds) all demonstrate that the conditions for valid consent are ethically distinct from the conditions for a valid contract.
  *   While the *concepts* of vitiating factors (deception/fraud, coercion/duress, incompetence/incapacity) and the void/voidable distinction have *superficial parallels*, their application and underlying justification diverge significantly when applied to personal autonomy vs. commercial agreements.

  **IV. A Better Analogy: Consent as a Unilateral Authorization (Like Granting a License or Permission)**

  *   **The Analogy:** Think of consent as granting a specific, revocable permission or license to perform an act that would otherwise violate a right (like trespass or battery). It's closer to giving someone permission to enter your land (a license) or use your copyrighted work under specific terms.
  *   **What it Gets Right:**
      *   **Unilateral:** Focuses on the grantor's authorization, not mutual promises.
      *   **Scope-Specific:** Emphasizes defining the precise boundaries of what is permitted.
      *   **Revocable:** Aligns with the inherent revocability of such permissions.
      *   **Conditional:** Validity hinges on the grantor's capacity and understanding *of the specific act being authorized*, not on an exchange.
      *   **Waiver:** Captures the Hohfeldian "power to waive a claim-right."
  *   **What it Gets Right vs. Contract:** This analogy avoids the pitfalls of bilateralism, consideration, and the objective standard's dominance. It centers on the *authority* granted by the right-holder and the *limits* of that authority. Vitiation occurs when the authorization is defective (due to lack of understanding, coercion, etc.) or exceeded. It better reflects the core ethical concern: respecting the individual's autonomous control over their own body/property/rights through a valid grant of permission.
