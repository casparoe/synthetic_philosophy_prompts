answer: |-
  Based on your verdicts and the puzzles you've described, I identify a coherent account of rational herding centered on two distinct principles: one for **informational cascades** (driven by belief updating) and one for **strategic conformity** (driven by incentives). Your verdicts track both a *mechanism* (inference from predecessors' actions) and an *outcome* (many people doing the same thing), but the mechanism is primary for cascades, while the outcome alone is insufficient for rationality. The fragility of cascades (shattered by public revelation) supports their rationality, as it reflects proper Bayesian updating in response to new information.

  ### The Principles
  1. **Informational Cascade Principle**:  
     It is rational to follow the crowd **if and only if**:  
     - **(a)** The observed actions of others are *informative* (i.e., you have reason to believe they are based on private information that is independent and relevant to the decision), **and**  
     - **(b)** Your own private information (if any) is sufficiently weak or outweighed by the aggregated information inferred from others' actions, such that following the crowd maximizes expected utility given your beliefs.  

     *Clauses explained*:  
     - Clause (a) is forced by the **reverse committee case** (discounting agreement if predecessors were copying). Without this, we couldn't exclude cases where the crowd's actions are uninformative (e.g., based on copying or incentives).  
     - Clause (b) is forced by the **venture case** (following despite a weak private signal). Without this, following would be irrational if private information is strong (e.g., the researcher case).  

     This principle defines a cascade as a *mechanism*: individuals infer predecessors' private information from their actions and update beliefs, potentially ignoring their own signals. Fragility arises because cascades amplify early signals; a public revelation provides new information that overrides the cascade, confirming rationality (beliefs updated correctly).

  2. **Strategic Conformity Principle**:  
     It is rational to follow the crowd **if** doing so maximizes your expected utility given personal incentives (e.g., rewards, punishments, or coordination benefits), *regardless* of private information or beliefs about the crowd's informativeness.  

     *Clause explained*: This principle is forced by the **manager case** (endorsing for a bonus) and **voter case** (voting for the expected winner). Here, following is not a cascade (no belief updating) but a rational response to incentives.

  ### How the Principles Capture Your Verdicts
  | Your Case | Your Verdict | Principle Applied | Rationale |
  |-----------|--------------|-------------------|----------|
  | Crowded restaurant | Rational | Informational Cascade (a, b) | Clause (a): Crowd's choices are *informative* (assumed independent signals on quality). Clause (b): No private signal, so following is optimal. |
  | Venture with weak signal | Rational (cascade) | Informational Cascade (a, b) | Clause (a): Predecessors' commitments are informative (assumed independent signals). Clause (b): Weak private signal is outweighed. |
  | Hiring committee | Rational | Informational Cascade (a, b) | Clause (a): Predecessors' endorsements are informative (institutional setting ensures independence). Clause (b): Thin private read is weak. |
  | Manager endorsing for bonus | Rational (not cascade) | Strategic Conformity | Following maximizes utility (bonus), irrespective of private belief or crowd's informativeness. |
  | Voting for expected winner | Rational (not cascade) | Strategic Conformity | Following maximizes utility (e.g., avoiding wasted vote or gaining influence), irrespective of preference. |
  | Fire exit stampede | Irrational | Fails Informational Cascade (a) and Strategic Conformity | Clause (a) fails: Stampede is uninformative (driven by panic, not independent signals). Strategic incentives (e.g., survival) don't align with following, as spreading out may be better. |
  | Researcher abandoning line | Irrational | Fails Informational Cascade (a) | Clause (a) fails: No reason to believe others' abandonment is informative (no evidence of independence or new signals). Clause (b) may also fail if private information is strong ("promising"). |
  | Reverse committee case | Rational (discount) | Informational Cascade (a) | Clause (a) fails if predecessors copied: Their agreement is uninformative, so discounting is rational. |

  ### Verdict You Must Give Up: Researcher Case
  - **Drop the researcher verdict** (currently "irrational") and **reclassify it as context-dependent**. The principle forces this because:  
    - If the researcher has no evidence that others abandoned based on independent information (e.g., they copied arbitrarily), clause (a) fails, and following is irrational (matching your verdict).  
    - But if the researcher has reason to believe others acted on independent signals (e.g., an academic norm of evidence-based abandonment), clause (a) holds, and following *could* be rational (contra your verdict). Your case lacks context, so it defaults to irrational, but the principle highlights ambiguity.  
  - **Why drop it?** Your verdict assumes others' actions are uninformative without evidence, but the principle requires evaluating *why* the crowd acted. If the researcher has a strong private signal ("promising"), clause (b) also fails, making following irrational. However, if private information is weak and others' actions are informative, following *is* rational—just like the committee case. Your verdict doesn't allow this nuance, so it must be relaxed to depend on evidence for clause (a).

  ### Predictions for New Cases
  The principles predict outcomes for cases you haven't considered. For each, I note where the line is drawn:  
  1. **Sky-gazing crowd**: You see 20 people looking up and join them.  
     - **Prediction**: Rational (Informational Cascade).  
     - **Why**: Clause (a) holds (gazing is informative for independent events like bird sightings); clause (b) holds if you have no opposing signal.  
     - **Line drawn**: If you knew they were all copying a single person who was joking, clause (a) fails—irrational to follow.

  2. **Product reviews**: You buy a product with 100 positive reviews but privately suspect a flaw.  
     - **Prediction**: Rational to buy if suspicion is weak (Informational Cascade), irrational if strong.  
     - **Why**: Clause (a) holds if reviews are assumed independent; clause (b) depends on signal strength.  
     - **Line drawn**: If reviews are fake (breaking independence), clause (a) fails—irrational.

  3. **Concert riot**: A crowd storms a stage; you join, fearing missing out despite private safety concerns.  
     - **Prediction**: Irrational.  
     - **Why**: Fails Strategic Conformity (no clear incentive) and Informational Cascade (clause (a) fails if riot is chaotic, not informative; clause (b) fails if safety concerns are strong).

  ### Why This Coheres Your View
  - **Single framework**: Your verdicts are unified under two principles. Informational cascades explain cases where belief updating from others' actions is key (restaurant, venture, committee). Strategic conformity explains incentive-driven cases (manager, voter). The crowd's outcome alone (e.g., stampede) is never sufficient; the *mechanism* (inference or incentives) determines rationality.
  - **Fragility preserved**: Cascades are fragile to public revelation because they are belief-based; this aligns with rationality (updating correctly), not just excusability.
  - **Puzzles resolved**:  
    - You track mechanism (for cascades) and outcome (for incentives), but the principles distinguish them. Cascades require informative actions (mechanism), while strategic conformity uses the outcome as a tool.  
    - The reverse committee case is explained by clause (a): Independence is essential for informativeness.
  - **Cost of coherence**: The researcher case becomes context-dependent, but this is a strength—it forces you to specify evidence for independence, avoiding overgeneralization.

  This account captures your core intuition: following is rational when the crowd *means something* (information) or *does something for you* (incentives). Where it conflicts with your verdicts, it clarifies ambiguities (e.g., the researcher) and provides testable predictions.
