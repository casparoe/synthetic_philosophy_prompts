answer: |-
  ## Night Work

  The journal sits on my bedside table, a battered Moleskine. January’s entries are neat, hopeful: *Fell. Endless staircase. Woke breathless.* February’s grow cramped: *Something about the old school? Faded.* Now, in April, the handwriting often looks like a stranger’s – shaky, hurried, as if chasing something already gone. The point, back then, felt sensible: pin down that slippery conviction, arriving with the grey dawn light, that *something* had transpired in the dark hours. A feeling more substantial than the fragments it supposedly explained. And it worked. The feeling survives transcription. What died was the certainty that the feeling pointed to anything real.

  My wife, Clara, is the other witness. Her testimony comes casually, over coffee or while sorting laundry. "You were muttering about keys last night," she’ll say, or "You sat bolt upright around two, just staring at the wardrobe for a full minute before flopping back down." Sometimes it aligns with my morning memory – a frantic search in the dreamscape mirroring her report of agitated mumbling. Often, it doesn’t. At all.

  Last Thursday, I woke with the distinct, lingering ache of grief. The journal entry reads: *Ben. Funeral. Standing in rain. Couldn’t speak. Heavy.* Ben was a childhood friend who moved away decades ago; alive, as far as I knew. The dream-memory was visceral: the chill rain soaking my collar, the mute frustration, the raw weight of loss. Over breakfast, I mentioned it felt horribly real.

  Clara frowned, stirring her oatmeal. "Funeral? You were laughing. Around midnight. Not loud, but… chuckling. Like you’d heard a good joke."

  The disconnect was physical, a small vertigo. My recorded sorrow, her reported mirth. Between the ink and her words, Ben’s rain-soaked funeral dissolved into an awkward silence. Which record held the truth? There was no third ledger.

  I work in insurance claims. My days are a meticulous archaeology of misfortune: timelines, witness statements, conflicting accounts, physical evidence. I reconstruct events from fragments, seeking the plausible narrative that best fits the damaged car, the fire-blackened beam, the medical report. Truth is a negotiated settlement. At night, apparently, I conduct a different kind of audit, one without accessible primary sources.

  The journal feels less like a record now, more like a collection of fictional vignettes authored by a committee – one member being my morning self, clutching at fading sensations, another being Clara’s sleep-fogged recollections of my somnambulant mutterings, and perhaps a third, entirely silent partner responsible for the original, inaccessible impulse.

  *Perhaps there was no original impulse.* That’s the first unsettling thought. Daniel Dennett’s ghost whispers it in the filing room. What if sleep is simply blank? Not darkness, not silence, but *nothing*. A neurological reboot. Then, upon waking, the brain, startled into consciousness, instantly generates a plausible pastiche – a memory of an event that never occurred, tailored to explain the residual physiological buzz (the racing heart, the damp sheets, the peculiar emotional hangover). The dream isn’t recalled; it’s authored on the spot. The journal then isn’t a transcription, but the first draft of a fabrication.

  The second thought feels colder, older. Norman Malcolm’s spectre lingers by the water cooler. What if "I dreamed" isn’t a report of an internal movie I watched? What if it’s more like saying "I was under anaesthetic"? It describes a *state*, not an experience *had*. Asking "What was the dream like?" is akin to asking "What was the anaesthetic like?" – a category error. The dream isn’t *like* anything; it’s simply the label we slap on the peculiar cognitive state of reporting a pseudo-memory upon waking. The feeling of having experienced something is part of the symptom, not proof of the disease.

  I don’t voice these thoughts. Not to Clara, who deals in tangible things – lesson plans (she teaches primary school), grocery lists, the persistent leak under the kitchen sink. Not to Dave at work, who’d likely offer a conspiratorial wink and suggest a dodgy kebab. This uncertainty isn't a topic; it's a private weather system, fogging the landscape of my nights and mornings.

  The external evidence mounts in small, jarring ways. Last week, I woke convinced I’d dreamed of meticulously organising my sock drawer by colour and fibre content – a satisfyingly mundane, vivid task. The journal entry is precise: *Socks. Navy merino, left. Grey cotton blend, right. Oddly satisfying.* That morning, opening the drawer, I found chaos. But on my desk downstairs, perfectly centred, sat a single navy merino sock I’d been missing for months. Had I sleepwalked? Found it? Placed it there meaningfully? Or was its reappearance pure coincidence, brutally mocking my fabricated nocturnal tidiness?

  Clara provided another piece. I’d written: *Lost in giant library. Walls shifted. Couldn’t find exit. Panic.* The remembered sensation was claustrophobic, the towering shelves oppressive.
  "Lost?" Clara said later, reading over my shoulder (she’s stopped asking, just reads). "You were clear as a bell around three AM. Said, ‘It’s on the third shelf. Behind the ledger.’ Then you sighed, like you’d found it." She tapped the journal. "Doesn’t sound very lost."

  I stared at the entry. The panic felt real, etched in the hurried script. Her report felt equally real, delivered with her usual pragmatic certainty. Two truths. No bridge.

  The unsettling element isn't bizarre dream logic invading my day; it's the reverse. It's the creeping doubt about the mundane reality of the night leaching into the day’s solidity. If I can’t trust the foundational report of what happened inside my own head while my body lay beside my wife, what *can* I trust? The claims files I process feel suddenly precarious. How many witnesses are reporting their own hastily constructed fictions, believing them utterly?

  I catch myself watching Clara sleep sometimes. Her breathing is deep, regular. Occasionally, a finger twitches, or a soft, wordless sound escapes her lips. Is *she* somewhere? Traversing vast libraries, laughing silently at midnight jokes, finding missing socks? Or is it just the machinery idling, preparing the morning’s instalment of her own dream journal, written in the language of sighs and twitches? I can’t ask. She’d think I was worrying about work stress again.

  The journal feels heavier each morning. The act of writing has become fraught. Am I documenting or inventing? Am I honouring a memory or committing a fraud against myself? Sometimes I just stare at the blank page, the pen hovering, the fading impressions scattering like dust motes in sunlight, refusing coherency. The compulsion to write remains, a ghost of January’s naive hope. But the words that come feel increasingly like placeholders, approximations of an event whose very existence is the question.

  Last night, nothing lingered. Just a profound sense of… vacancy. A blank space where the dream-feeling usually resided. I opened the journal anyway. Habit. The pen moved almost of its own accord: *The filing cabinet. Endless drawers. All empty. No labels. Just the sound of metal sliding on metal. Echoing.*

  This morning, Clara was already up. I found her in the kitchen, frowning at the cutlery drawer. "Did you reorganise the spoons last night?" she asked, without looking up. "They’re all jumbled together. Teaspoons with the dessert spoons."

  I looked. She was right. Utter disarray. I always keep them separate. Always.
  "No," I said, the word thick. "Must have been half-asleep if I did."

  She shrugged, starting to sort them. "Weird. You were quiet as a mouse. Not a peep." She slotted a teaspoon into its compartment with a soft, metallic *chink*. Sliding metal on metal.

  I haven’t written it down yet. The empty filing cabinet dream. The disordered spoons. Clara’s report of silence. Three data points. No narrative connects them. The Dennett explanation suggests my sleeping brain generated nothing, and my waking brain, confronted by messy spoons and Clara’s question, retrofitted a plausible, meaningless dream. The Malcolm explanation suggests "I dreamed of an empty filing cabinet" is merely how I *report* the state of having woken to find chaotic spoons and a question – a grammatical label for confusion, not a description of an event.

  I pick up the journal. My hand shakes slightly. The sound of the spoons, neat and separate now, clicks in the drawer. Metal on metal. Echoing. I write: *Spoons. All mixed up. Why?* Then, underneath, almost an afterthought: *The filing cabinet was empty.*

  I close the book. The feeling is back. Distinct. Something happened. Or didn’t. The weight of the journal in my hands is the only certainty. I place it back on the bedside table, next to the silent, accusing alarm clock. Another night’s work, filed away. Unverifiable.
