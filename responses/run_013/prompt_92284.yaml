  ## BUREAU OF MEMETIC STABILITY (BMS)  
  **Section 7 Guidance: Memetic Stability Compliance for Public Dissemination Vectors**  
  **BMS-GD/07 Rev. 3.1**  
  **Effective Date:** 01 Praxember 214  

  **1. Scope & Applicability:** This Guidance applies to all Cultural Transmission Events (CTEs) occurring within Jurisdictional Vector Networks (JVNs) exceeding Threshold Fecundity (F_t) as defined herein. Regulated Memetic Units (RMUs) include Discrete Cultural Replicators (DCRs) and Memeplex Aggregates (MAs) manifesting in auditory, visual, textual, or gestural formats intended for public reception. Exemptions: Private cognitive processes (unexpressed ideation), transmissions below Threshold Longevity (L_t), and transmissions occurring within Bureau-sanctioned Memetic Archives (Archive Exemption Form BMS-AEF/09 required).  

  **2. Definitions (Operational):**  
      *   **Regulated Memetic Unit (RMU):** A self-contained cultural instruction set demonstrating measurable Fidelity (F), Fecundity (Fe), and Longevity (L). An RMU is the fundamental Vehicle subject to stability regulation. Host welfare considerations fall outside the Bureau's statutory remit (Ref: Public Memetic Safety Act § 5(c)).  
      *   **Fidelity (F):** The measurable similarity index between a Propagated Instance (PI) and its Designated Source Meme (DSM), calculated via Bureau-approved Sequence Alignment Protocols (BMS-SAP/02). Fidelity below Threshold Fidelity (F_t = 0.85) triggers Stability Review.  
      *   **Fecundity (Fe):** The mean replication rate per unit time within a defined JVN, expressed as the Basic Memetic Reproduction Number (R₀ₘ). Fe_t = 1.5 (indicating sustained propagation). Fe calculations require submission of Vector Network Topology Map (Form BMS-VNT/04).  
      *   **Longevity (L):** The minimum persistence duration of an RMU within a JVN before mandatory Stability Assessment. L_t = 14 calendar days.  
      *   **Memeplex Aggregate (MA):** A cohesive assemblage of co-adapted DCRs exhibiting synergistic stability exceeding the sum of its constituent RMUs. MA integrity is assessed holistically (Form BMS-MAI/07), though constituent RMUs remain individually liable for F_t compliance (Ref: Memeplex Cohesion Doctrine, BMS Internal Ruling 214-07b).  
      *   **Superspreader Vector (SSV):** Any host or platform exhibiting Fe ≥ 3.0 within any 72-hour period. SSVs require Enhanced Monitoring Plans (Form BMS-EMP/11).  
      *   **Memetic Herd Stability (MHS):** Population-level RMU stability achieved when ≥ 70% of vectors within a JVN exhibit F ≥ F_t for a given RMU, reducing mutation pressure. MHS is a compliance goal, not a regulatory threshold.  

  **3. Thresholds & Triggering Events:**  
      3.1. **Stability Review Mandate:** Triggered if any RMU within a CTE exhibits:  
          *   F < F_t *and* Fe > Fe_t *and* L > L_t; OR  
          *   Fe > 2.5 * Fe_t regardless of F/L (Potential Superspreader Event); OR  
          *   Formation of a novel MA exceeding constituent RMU cumulative F by > 0.15 (Memeplex Emergence).  
      3.2. **Exemptions:** RMUs achieving MHS within the JVN (Form BMS-MHS/08 certification required), or transmissions occurring under Bureau-approved Memetic Preservation Licenses (e.g., folkloric performance troupes filing BMS-MPL/13).  

  **4. Compliance Procedures:**  
      4.1. **Initial Assessment:** Upon triggering event, Inspector initiates Field Stability Assessment (FSA). Inspector identifies the DSM (utilizing BMS Central Memetic Registry or establishing provenance via Vector Testimony Form BMS-VTF/06).  
      4.2. **Fidelity Measurement:** Inspector records ≥ 3 PIs of the suspect RMU within the JVN. BMS-SAP/02 protocol is applied, comparing each PI to the DSM. Mean F is calculated.  
      4.3. **Fecundity & Longevity Verification:** Inspector audits transmission logs/platform analytics (Form BMS-TLA/05) or conducts vector interviews (BMS-VI/03) to confirm Fe > Fe_t and L > L_t.  
      4.4. **Corrective Action:** If F < F_t:  
          *   Issue Memetic Stability Order (MSO-BMS/12) to the primary vector(s) mandating dissemination of the Bureau-certified DSM variant.  
          *   If non-compliance persists, impose Vector Quarantine (limiting transmission bandwidth) or mandate corrective re-transmission campaigns until MHS is demonstrably achieved.  
          *   For MA instability, require submission of a Memeplex Cohesion Plan (Form BMS-MCP/10).  

  **5. Compliance Schedule:**  
      *   FSA Initiation: Within 48 hours of triggering event notification.  
      *   Preliminary F Assessment: Completed within FSA period (max 72 hours).  
      *   MSO Issuance: Within 24 hours of confirmed F < F_t.  
      *   Corrective Action Completion: 7 days post-MSO issuance (14 days for MA remediation).  
      *   MHS Certification: Required within 21 days post-MSO.  

  **6. Procedural Notes & Limitations:**  
      6.1. **Unit Delineation:** The Bureau acknowledges practical challenges in definitively enumerating discrete RMUs within complex utterances. Inspectors shall apply the Minimal Functional Unit principle (BMS-MFU/01 Annex) pragmatically, focusing on the most unstable identifiable element triggering review.  
      6.2. **Fidelity vs. Reconstruction:** Current F measurement protocols (BMS-SAP/02) cannot algorithmically distinguish perfect copying from independent reconstruction achieving high similarity. Stability Orders are issued based on observed phenotypic (expressed) deviation, regardless of ontogenetic pathway.  
      6.3. **Lamarckian Transmission:** The Bureau recognizes the theoretical distinction between Darwinian selection of undirected variations and the potential for host-directed modification ("Lamarckian leakage"). Compliance criteria, however, are applied solely to the expressed RMU phenotype; host intentionality is not a regulatory factor.  
      6.4. **Fitness Attribution:** The Memetic Fitness (F * Fe * L) of an RMU is inferred from its persistence. A failure of a predicted high-fitness RMU to propagate may be attributed to environmental drift factors (e.g., transient vector saturation, competing memetic epidemics) and does not inherently invalidate the initial fitness assessment. Drift factors are to be documented (Form BMS-DFR/14).  

  **7. Worked Example: RMU "Miss Mary Mack" (Clapping Rhyme Variant):**  
      *   **DSM:** "Miss Mary Mack, Mack, Mack / All dressed in black, black, black..." (Registry ID: CLAP-RHY-0012-DSM).  
      *   **Trigger:** Fe > Fe_t observed in Primary School JVN-774 (L > 14 days confirmed).  
      *   **PI 1:** Matches DSM (F=1.0).  
      *   **PI 2:** "Miss Mary Mack, Mack, *Mack* / All dressed in *blue*, blue, blue..." (F=0.75 on color vector; F=0.92 overall).  
      *   **PI 3:** "Miss *Molly* Mack, Mack, Mack / All dressed in black, *white*, black..." (F=0.67 on name vector; F=0.78 on color sequence; F=0.82 overall).  
      *   **Mean F:** (1.0 + 0.92 + 0.82)/3 = 0.913. **Assessment:** F (0.913) > F_t (0.85). **No MSO issued.**  
      *   **Note:** The variant "blue" (F=0.75) in PI 2 falls below F_t *as an individual vector*, but the RMU is assessed holistically as the clapping rhyme performance unit. The emergent "Molly" variant (PI 3) would require separate tracking if Fe rises independently. Delineating the stable core ("Mack, Mack, Mack") from unstable vectors ("Mary"/"Molly", "black"/"blue"/sequence) remains operationally challenging per 6.1.  

  **Appendix A: Dissenting Procedural Note (Deputy Inspector Aris Thorne):**  
  While adhering to Bureau protocol, I must formally note that the foundational replicator model applied herein may be fundamentally misconceived for most cultural phenomena. The "variants" observed in the clapping rhyme example (and indeed, most RMUs exceeding minimal complexity) exhibit patterns strongly suggestive of *reconstruction* by hosts utilizing shared grammatical and thematic schemata, not high-fidelity copying of discrete instructions. The DSM is often a post-hoc regulatory fiction, not an epidemiologically real source. Insisting on Fidelity measurements against an arbitrary DSM ignores the reconstructive nature of cultural transmission, wherein each instantiation is a performance filtered through host cognition and context. Our procedures functionally punish cultural dynamism inherent to host cognition—the very factor Section 6.3 acknowledges but explicitly excludes. Regulating based solely on phenotypic similarity to an archived "source" risks stifling the generative processes that constitute culture, turning the Bureau into an enforcer of artificial stasis contrary to the adaptive spirit it nominally upholds. (Ref: Schema-Based Transmission Theory; BMS Internal Memo 213-45d).  

  **Compliance:** Adherence to this Guidance is mandatory for all Bureau Inspectors effective 01 Praxember 214. Submit Variance Requests via Form BMS-VR/15.  
  **Issuing Office:** Standards & Compliance Directorate, Bureau of Memetic Stability.
