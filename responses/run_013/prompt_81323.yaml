prompt: |-
  I run the tutorials for an upper-level seminar on collective decision-making: the professor takes the formal half (Arrow, Gibbard–Satterthwaite, the elements of judgment aggregation), I take the applied half, and the students are a mix of philosophy and politics finalists who can state Arrow's theorem from memory and can reproduce the discursive dilemma — the doctrinal paradox, if you prefer the older name — with the usual breach-of-contract or jury-liability example, but who mostly cannot say what the dilemma is a dilemma *about*. The external examiner complains every year that our paper rewards recall, so for this summer's exam (closed book, three questions in two hours, marked out of 20 on the department's scale where 70 and above is a first) I want to contribute one essay question that cannot be answered by reciting the paradox or by reciting Arrow. What I want the students forced to confront is this: the familiar escape routes each buy one virtue at the price of another, and the paradox is a fact about agendas at least as much as about voters. If the propositions on the ballot were logically independent of one another, majority voting on each of them would never produce an inconsistent set; the trouble requires a logically interlinked agenda, which means that whoever fixes what gets voted on, and in what order, wields a power that the aggregation rule itself does not license. I also want them to face the objection that inconsistency in a group is harmless because a group is not a believer — there is no group mind to be of two minds — and to ask whether that objection survives once the same body has to answer for its decisions, and once it has a standing rule (a constitution, a policy, a precedent) that commits it to particular combinations of verdicts over time. I have spent an unseemly amount of time in comment threads arguing about whether committees can be agents at all, and I would like an exam question that makes that argument do some work rather than merely decorating an exposition.

  So please write me that essay question, a model answer of about 800 words, and a marking scheme. For the question, use a concrete case rather than the breach-of-contract chestnut the students have already seen in the handouts: I suggest a five-person appointments panel deciding whether to make an offer to a candidate, where the standing rule is that the candidate is appointable only if both criteria are met, so that the panel's verdict on appointability is the conjunction of its verdicts on research record and on capacity to cover the teaching need. The distribution of views should be one in which a majority endorses each criterion but only a minority endorses the conjunction, and the question should require them to work that through with actual numbers before generalising. The question may presuppose the vocabulary the seminar has taught — collective rationality, independence, universal domain, and the rest — but it must be answerable by a student who cannot remember the name of a single author; nothing in the question, the model answer or the marking scheme may depend on names, titles or dates, and the students must not be asked to cite anything. Pitch the question at about 70 minutes of writing.

  The marking scheme is the part I care most about. Out of 20, built from five or six named must-hit moves with the marks for each, and for every move a one-line note on how candidates characteristically get it wrong. It must draw a clear line between a first and a 2:1 in terms of those moves: I want to see what a student who has grasped only that majority voting on each issue can be inconsistent will produce, and what a student who can say which condition each of the familiar procedures trades away — voting on the premises only, voting on the conclusion only, letting the chair decide outright, letting the chair reconcile the two results after the fact — and why, will produce instead. If the model answer can also make something of the group-agency angle, namely whether a body that can hold an inconsistent set of judgments is a candidate for collective responsibility at all and what its decision procedure would therefore have to look like, so much the better, but I would rather have that as a stretch move than as a requirement. Everything in British English, please, the exam question included.
reasoning: |-
  We are creating an exam question for an upper-level seminar on collective decision-making. The goal is to avoid mere recall of the doctrinal paradox (or discursive dilemma) and Arrow's theorem, and instead force students to confront the underlying issues: the role of the agenda, the trade-offs in escape routes, and the question of group agency.

  The scenario: a five-person appointments panel deciding on a candidate. The standing rule is that the candidate is appointable only if both criteria (research record and teaching capacity) are met. So, appointability is the conjunction of the two criteria.

  We want a distribution of views where:
  - Majority endorses research record (say, 3 or 4 out of 5)
  - Majority endorses teaching capacity (say, 3 or 4 out of 5)
  - But only a minority endorses the conjunction (appointability) - so we need a situation where the majorities for the two criteria are not the same set of people.

  Example distribution for 5 members:

  Member 1: Yes to research, Yes to teaching -> Yes to appointability
  Member 2: Yes to research, No to teaching -> No to appointability
  Member 3: No to research, Yes to teaching -> No to appointability
  Member 4: Yes to research, Yes to teaching -> Yes to appointability
  Member 5: No to research, No to teaching -> No to appointability

  Now, let's count:
  - Research: Yes from 1,2,4 -> 3 out of 5 (majority)
  - Teaching: Yes from 1,3,4 -> 3 out of 5 (majority)
  - Appointability: Only members 1 and 4 say Yes -> 2 out of 5 (minority)

  So, if the panel votes on each proposition independently by majority:
  - Research: Passes (3-2)
  - Teaching: Passes (3-2)
  - Then by the rule, appointability should be Yes. But if they vote directly on appointability, it fails (2-3).

  This sets up the paradox.

  The essay question should require the student to:
  1. Work through the numbers in the concrete case (as above) to show the inconsistency.
  2. Generalise the problem: the paradox arises because of the logical interconnection (conjunction) in the agenda.
  3. Discuss the escape routes and the trade-offs (premise-based, conclusion-based, chair's role, etc.), focusing on what condition each violates and what virtue is lost.
  4. Address the group agency issue: can a group that holds inconsistent judgments be held collectively responsible? How does the decision procedure matter?

  We are to write:
  - The exam question (in British English)
  - A model answer (approx. 800 words)
  - A marking scheme (out of 20, with 5-6 must-hit moves, each with a mark allocation and a note on common mistakes)

  Let's draft the question.

  **Exam Question**

  An appointments panel of five members is to decide whether to make an offer to a candidate. The panel operates under a standing rule that the candidate is appointable only if both of the following criteria are met:

  Criterion A: The candidate has an outstanding research record.
  Criterion B: The candidate has the capacity to cover the required teaching.

  Thus, the panel's verdict on appointability (the conclusion) is the conjunction of its verdicts on Criterion A and Criterion B.

  The individual judgments of the five panel members are as follows:

  | Member | Criterion A (Research) | Criterion B (Teaching) | Appointable? (A and B) |
  |--------|------------------------|------------------------|------------------------|
  | 1      | Yes                    | Yes                    | Yes                    |
  | 2      | Yes                    | No                     | No                     |
  | 3      | No                     | Yes                    | No                     |
  | 4      | Yes                    | Yes                    | Yes                    |
  | 5      | No                     | No                     | No                     |

  (a) Suppose the panel votes by majority rule on each of the three propositions (Criterion A, Criterion B, and appointability) separately. What would be the outcome of each vote? Explain why these outcomes are collectively inconsistent. (5 marks)

  (b) The panel considers alternative decision procedures to avoid such inconsistency. Discuss two of the following procedures, explaining for each what the outcome would be in this case and what trade-off it involves (i.e., which desirable condition it satisfies and which it sacrifices):
     - Voting only on the two criteria (premises) and then deriving the conclusion by the standing rule.
     - Voting only on the conclusion (appointability) and not on the criteria separately.
     - Allowing the chair to decide the entire matter.
     - Having the panel vote on the criteria and the conclusion, and then allowing the chair to reconcile any inconsistency by adjusting one of the votes to match the others.

  In each case, refer to conditions such as collective rationality, independence, universal domain, and the group's ability to express its judgments. (10 marks)

  (c) Some theorists argue that inconsistency in a group's judgments is harmless because a group is not a single believer and therefore cannot be of two minds. Evaluate this objection in light of the fact that the panel must answer for its decisions and is bound by a standing rule that commits it to particular combinations of verdicts over time. (5 marks)

  **Model Answer**

  (a) Voting by majority rule on each proposition:

  - Criterion A: Yes (Members 1, 2, 4) vs No (3,5) -> 3-2 in favour, so passes.
  - Criterion B: Yes (Members 1, 3, 4) vs No (2,5) -> 3-2 in favour, so passes.
  - Appointability: Yes (Members 1,4) vs No (2,3,5) -> 2-3 against, so fails.

  The outcomes are collectively inconsistent because the standing rule requires that if both criteria are met, then the candidate is appointable. Here, the majority says both criteria are met, but the majority also says the candidate is not appointable. This violates the logical requirement that the set of collective judgments should be consistent (i.e., it should not be the case that both A and B are true and yet A and B is false).

  (b) Alternative procedures:

  Procedure 1: Voting only on the premises and deriving the conclusion.

  In this case, the panel votes on A and B by majority, getting A passed and B passed. Then, by the standing rule, the candidate is appointable. The outcome is consistent: A, B, and (A and B) are all true.

  Trade-off: This procedure satisfies collective rationality (the group's judgments are consistent) but sacrifices the independence condition because the collective judgment on the conclusion is not determined by a vote on that proposition but is derived from the votes on the premises. This means that the group's view on the conclusion is not directly expressed by the members but is imposed by the logical rule. Also, it ignores the members' judgments on the conclusion: in this case, a majority actually thought the candidate was not appointable (only two said yes), but the procedure overrides that.

  Procedure 2: Voting only on the conclusion.

  The panel votes only on appointability (A and B). The majority says no (3 against, 2 in favour). So the candidate is not appointed. The criteria A and B are not voted on.

  Trade-off: This procedure avoids inconsistency because only one proposition is voted on. It also respects the independence condition for the conclusion (since it is directly voted on). However, it sacrifices the ability to express judgments on the premises. The group does not take a collective position on A and B separately, which might be required for accountability (e.g., to give feedback to the candidate). Moreover, the standing rule (which links the criteria to the conclusion) is effectively set aside: the group might end up appointing a candidate who fails one criterion, or rejecting one who meets both, if the vote on the conclusion goes against the premises. But in this procedure, the premises are not considered at all.

  Procedure 3: Allowing the chair to decide.

  The chair (who is one of the five) makes the entire decision. The outcome depends on the chair's views. Suppose the chair is member 1: then the chair would say yes to A, yes to B, and yes to appointability. But if the chair is member 5, then no to all.

  Trade-off: This procedure ensures consistency because one individual's judgments are consistent. However, it sacrifices the democratic ideal: the collective decision is not based on the group's views but on one person's. It violates universal domain in the sense that the group's diverse judgments are not aggregated; instead, one person's domain is used. It also sacrifices the independence of the aggregation (if we consider the group as a whole) because the chair's views might not reflect the majority.

  Procedure 4: Voting on all and then chair reconciliation.

  The panel votes on A, B, and appointability. As in (a), they get A yes, B yes, appointability no. Then the chair adjusts to remove inconsistency. For example, the chair might change the collective judgment on appointability to yes (to match A and B) or change one of the criteria to no (to match the no on appointability). Suppose the chair changes the collective judgment on appointability to yes.

  Trade-off: This restores consistency but at the cost of allowing the chair to override the vote on the conclusion. It sacrifices the independence of the aggregation for the overridden proposition and introduces an element of arbitrariness (depending on what the chair chooses to change). It also raises concerns about the integrity of the voting process.

  (c) The objection that inconsistency is harmless because a group is not a believer might be based on the idea that groups do not have minds and thus cannot be irrational. However, when a group must act and be held accountable, inconsistency becomes a problem. In this case, the panel must produce a single decision (offer or not) and must justify it. The standing rule commits the panel to a logical connection between the criteria and the conclusion. If the panel's collective judgments are inconsistent, it cannot act coherently: for example, if it says both criteria are met but the candidate is not appointable, then what decision does it make? It would violate its own rule. Over time, such inconsistency would undermine the group's credibility and ability to function as an agent. Moreover, if the group is seen as an agent (for example, by the candidate or the institution), then it must be able to give reasons for its decisions. Inconsistent judgments make it impossible to provide a coherent account. Therefore, the objection does not survive when the group has to answer for its decisions and when it is bound by rules that require consistency over time. The group's decision procedure must therefore ensure that it can form consistent collective judgments if it is to be a responsible agent.

  **Marking Scheme**

  Total: 20 marks

  (a) Working through the numbers and identifying inconsistency (5 marks)
  - 1 mark for each correct vote outcome (A: yes, B: yes, Appointability: no) [3 marks]
  - 1 mark for stating that the set {A true, B true, Appointability false} is inconsistent by the standing rule (which defines Appointability as A and B) [1 mark]
  - 1 mark for explaining the inconsistency (e.g., if A and B are true, then by logic Appointability must be true, but the majority says it is false) [1 mark]

  Common mistakes: 
  - Incorrect tally of votes (e.g., miscounting the votes for A or B).
  - Failing to note the logical inconsistency and merely stating the outcomes.

  (b) Discussion of two alternative procedures (10 marks)
  For each procedure (5 marks per procedure, 2.5 for outcome and 2.5 for trade-off):
  - Correct outcome for the given procedure (2.5 marks)
  - Identification of the trade-off (which condition is satisfied and which is sacrificed) with reference to conditions such as collective rationality, independence, etc. (2.5 marks)

  Common mistakes:
  - For the outcome: not applying the procedure correctly to the numbers.
  - For the trade-off: vague statements without reference to specific conditions, or only stating a virtue or a sacrifice without both.

  (c) Evaluation of the group agency objection (5 marks)
  - 1 mark for stating the objection (inconsistency is harmless because no group mind).
  - 2 marks for counter-argument: the need to answer for decisions and the standing rule (accountability and commitment over time).
  - 2 marks for linking to the group's agency: the requirement for coherent action and justification, and how inconsistency undermines that.

  Common mistakes:
  - Merely repeating the objection without evaluation.
  - Failing to connect to the standing rule and accountability.

  **Grading Boundaries**

  First-class (70% and above): 14 marks or above. The student must get (a) nearly full marks (at least 4), (b) at least 7 (showing clear understanding of two procedures and their trade-offs), and (c) at least 3 (engaging with the objection and providing a reasoned evaluation).

  Upper second (60-69%): 12-13 marks. The student might have minor errors in (a), or only one procedure in (b) is fully explained, or (c) is underdeveloped.

  Lower second (50-59%): 10-11 marks. The student gets the basics of (a) and (b) but with significant gaps (e.g., only one procedure discussed adequately, or trade-offs not clearly articulated) and (c) is weak.

  Third (40-49%): 8-9 marks. The student gets (a) mostly right but struggles with (b) and (c).

  Fail: Below 8 marks.

  Note: The above boundaries are indicative and subject to adjustment by the examiner, but the mark allocation per part is fixed.

  This question avoids reliance on names and focuses on the concepts. The model answer is approximately 800 words and addresses all parts. The marking scheme is detailed and aligned with the learning objectives.
answer: |-
  ### Exam Question

  **Collective Decision-Making in Practice: The Appointments Panel Dilemma**  
  *(Answer all parts of this question. Total: 20 marks)*  

  An appointments panel of five members must decide whether to make an offer to a candidate. The panel operates under a standing rule: the candidate is appointable **only if** they meet both of the following criteria:  
  - **Criterion A:** The candidate has an outstanding research record.  
  - **Criterion B:** The candidate has the capacity to cover the required teaching.  

  Thus, the verdict on appointability (the conclusion) is the **conjunction** of the verdicts on Criteria A and B.  

  The individual judgments of the panel members are:  
  | Member | Criterion A (Research) | Criterion B (Teaching) | Appointable? (A and B) |  
  |--------|------------------------|------------------------|------------------------|  
  | 1      | Yes                    | Yes                    | Yes                    |  
  | 2      | Yes                    | No                     | No                     |  
  | 3      | No                     | Yes                    | No                     |  
  | 4      | Yes                    | Yes                    | Yes                    |  
  | 5      | No                     | No                     | No                     |  

  (a) The panel votes by majority rule on each proposition (Criterion A, Criterion B, and appointability) separately.  
  (i) State the result of each vote. (3 marks)  
  (ii) Explain why these results are **collectively inconsistent**, referencing the standing rule. (2 marks)  

  (b) To avoid inconsistency, the panel considers alternative procedures. For **two** of the following, explain:  
  - What the outcome would be in this case.  
  - Which **virtue** (e.g., collective rationality, independence, respect for individual judgments) is preserved.  
  - Which **drawback** arises (e.g., violation of a condition like universal domain, or loss of democratic legitimacy).  

  **Procedures:**  
  1. Vote **only on Criteria A and B**, then derive appointability from the standing rule.  
  2. Vote **only on appointability**, ignoring Criteria A and B.  
  3. Let the **chair decide all outcomes** (the chair is a panel member).  
  4. Vote on all propositions, then let the **chair reconcile inconsistencies** (e.g., by overriding one vote).  

  *(10 marks; 5 marks per procedure)*  

  (c) A critic argues: "Inconsistency in a group’s judgments is harmless because groups lack minds; they cannot 'believe' or 'be inconsistent' like individuals." Evaluate this objection in light of **two** considerations:  
  (i) The panel must **answer for its decision** (e.g., justify it to the candidate or institution).  
  (ii) The standing rule **binds the panel over time** (e.g., as a precedent for future cases).  

  *(5 marks)*  

  ---  
  ### Model Answer (Approx. 800 words)  

  **(a)**  
  (i) The results of majority voting:  
  - **Criterion A**: Yes (Members 1, 2, 4 support; 3–2 majority).  
  - **Criterion B**: Yes (Members 1, 3, 4 support; 3–2 majority).  
  - **Appointability**: No (Members 1 and 4 support; 2–3 majority against).  

  (ii) These results are collectively inconsistent because they violate the standing rule’s logical structure. The rule defines appointability as the conjunction of A and B: if A and B are both true, appointability must be true. Here, the majority affirms A and B, yet rejects appointability. This creates a contradiction: the group simultaneously holds that "A and B are true" and "A and B is false." Such inconsistency undermines coherent action, as the panel cannot simultaneously offer the job (per A and B) and reject it (per appointability).  

  **(b)**  
  **Procedure 1: Vote only on Criteria A and B, derive appointability.**  
  - *Outcome*: A passes (3–2), B passes (3–2), so appointability is derived as Yes.  
  - *Virtue*: Collective rationality is preserved. The group’s judgments (A true, B true, appointability true) are consistent with the standing rule.  
  - *Drawback*: Independence is sacrificed. The collective view on appointability is not determined by voting on that issue but imposed by logic. This ignores individual judgments on appointability (e.g., only 2/5 directly supported it), disrespecting members’ holistic evaluations.  

  **Procedure 2: Vote only on appointability, ignore Criteria A and B.**  
  - *Outcome*: Appointability fails (2–3), so no offer is made.  
  - *Virtue*: Independence is preserved for the conclusion, as appointability is directly voted on. Consistency is trivially achieved since only one proposition is considered.  
  - *Drawback*: Democratic legitimacy is eroded. The group takes no position on A or B, failing to express reasons for rejection. This undermines accountability—e.g., the panel cannot explain if the candidate failed research, teaching, or both. It also risks "hidden" inconsistencies: if members based their vote on conflicting premises, the group’s rationale remains opaque.  

  **Procedure 3: Let the chair decide all outcomes.**  
  - *Outcome*: Depends on the chair. If chair is Member 1 or 4, all judgments are Yes; if chair is Member 2, 3, or 5, appointability is No.  
  - *Virtue*: Collective rationality is ensured (the chair’s views are consistent).  
  - *Drawback*: Universal domain is violated. The procedure ignores most members’ judgments, concentrating power undemocratically. For instance, if the chair opposes appointability despite majority support for A and B, the group’s collective wisdom is overridden.  

  **Procedure 4: Vote on all, chair reconciles inconsistencies.**  
  - *Outcome*: Initial votes: A yes, B yes, appointability no (as in a). The chair might reconcile by, e.g., overriding appointability to Yes (to match A and B) or overriding A/B to No (to match appointability).  
  - *Virtue*: Restores consistency pragmatically.  
  - *Drawback*: Sacrifices independence and fairness. The chair’s intervention arbitrarily alters voted outcomes, undermining the aggregation process. If the chair forces appointability to Yes, it disregards the majority’s no vote; if they force A or B to No, it overrules majorities. This introduces bias and reduces transparency.  

  **(c)**  
  The objection—that groups cannot "be inconsistent" as they lack minds—fails under scrutiny when groups must act as accountable agents.  

  First, **answering for decisions** requires coherence. If the panel’s judgments are inconsistent (e.g., affirming A and B but rejecting appointability), it cannot justify its final action without self-contradiction. Suppose it rejects the candidate based on the vote against appointability. When challenged, it cites the standing rule (appointability requires A and B), yet the majority endorsed A and B. This forces the group into incoherent explanations (e.g., "We accept the premises but reject the conclusion"), damaging its credibility. A group that cannot provide a unified rationale is ill-equipped for accountability.  

  Second, **binding standing rules over time** exacerbate the harm. Rules like "appointability iff A and B" commit the panel to treating similar cases consistently. Inconsistent judgments violate this commitment, undermining the rule’s purpose. For example, if future panels cite this case as precedent but cannot reconcile its contradictions, the rule becomes unworkable. Moreover, if the group is seen as a persistent agent (e.g., an institution), its long-term identity relies on coherent decision-making. Allowing inconsistency invites arbitrary outcomes, eroding trust in the group’s agency.  

  In essence, the objection confuses metaphysical "belief" with practical agency. While groups lack minds, they must still act, justify actions, and uphold rules—functions crippled by inconsistency. Decision procedures must therefore prioritise collective rationality to sustain responsible group agency.  

  ---  
  ### Marking Scheme (Total: 20 marks)  

  | **Move**                                | **Marks** | **Notes on Common Mistakes** |  
  |-----------------------------------------|-----------|-------------------------------|  
  | **(a)(i) Correct vote outcomes**        | 3         | Mistake: Mis-tallying votes (e.g., claiming A fails or appointability passes). |  
  | **(a)(ii) Explains inconsistency**      | 2         | Mistake: Stating outcomes without linking to the standing rule’s logic (e.g., "A and B true but appointability false is illogical"). |  
  | **(b) For one procedure: Outcome**      | 2.5 (x2)  | Mistake: Incorrect outcome (e.g., for Procedure 1, claiming appointability fails). |  
  | **(b) For one procedure: Trade-off**    | 2.5 (x2)  | Mistake: Vague trade-offs (e.g., "it’s undemocratic" without specifying sacrificed conditions like independence or universal domain). |  
  | **(c) Addresses accountability**        | 2.5       | Mistake: Superficial treatment (e.g., "groups need consistency" without tying to justification or the standing rule). |  
  | **(c) Addresses binding rule over time**| 2.5       | Mistake: Ignores precedent/long-term agency (e.g., discussing only immediate harm). |  

  **Grade Boundaries**:  
  - **First (70%+, ≥14 marks)**: Hits all moves. In (b), clearly identifies trade-offs (e.g., "Procedure 1 sacrifices independence for collective rationality"). In (c), thoroughly evaluates agency using both accountability and rule-binding.  
  - **2:1 (60–69%, 12–13 marks)**: Minor gaps. E.g., (b) trade-offs described weakly (e.g., "Procedure 3 is unfair" without naming universal domain), or (c) addresses only one consideration deeply.  
  - **2:2 (50–59%, 10–11 marks)**: Significant weaknesses. E.g., (a) correct but (b) confuses outcomes/trade-offs for one procedure, or (c) only superficially engages the objection.  
  - **Third (40–49%, 8–9 marks)**: Partial answers. E.g., (a) complete but (b) incomplete/correct for only one procedure, (c) underdeveloped.  
  - **Fail (<40%, <8 marks)**: Major errors (e.g., incorrect votes in (a), or minimal attempt).  

  ---  
  **Rationale**: This question forces students to move beyond paradox recall by:  
  1. **Concrete application** (working through numbers in (a)).  
  2. **Generalising trade-offs** (escape routes in (b) emphasise agenda-setting power: e.g., choosing Procedure 1 privileges premise-aggregators).  
  3. **Confronting group agency** (in (c), requiring evaluation of inconsistency in light of real-world constraints).  
  The marking scheme rewards conceptual precision over citations, aligning with the examiner’s concerns.
