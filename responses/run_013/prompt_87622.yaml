prompt: |-
  I'm an ML engineer, I work mostly on seq2seq translation and cross-lingual stuff, and I've spent way too long staring at latent-variable models where a dozen different parameter settings all fit the observable data equally well. A friend who does philosophy keeps telling me I'd love Quine's gavagai argument — the one where a field linguist hears a native utter gavagai while a rabbit runs past and can't tell whether the word picks out the rabbit, an undetached part of the rabbit, a temporal stage of it, or rabbithood in general — and I want you to actually do the translation into my vocabulary rather than just explain it at me.

  So: restate the whole thing as faithfully as you can using the terms I actually think in. Stimulus meaning as the conditional distribution over what the speaker does given what's observable; the native's dispositions as a black-box policy you can only query; the translation manual as a decoder or mapping you fit; analytical hypotheses as the inductive biases and parameterisation choices you bake in; the indeterminacy claim as some kind of non-identifiability result. Get the structure right, including the holism bit (you can't pin down one term in isolation because the whole manual has to hang together) and the way he separates the underdetermination of theory by evidence from the indeterminacy of translation proper.

  Then the residue report, which is the part I actually care about. What goes across cleanly, what only goes across if you fudge it, and what has no counterpart in my toolkit at all. My suspicion — tell me if it's wrong — is that my whole vocabulary silently assumes there's a true underlying function or task and the only question is whether finite data can recover it, so I'd naturally hear Quine as just saying the mapping is underdetermined and the fix is a better prior, more data, or an identifiability argument. If that's smuggling in something he's explicitly denying, say so, and then tell me what the denial even looks like from inside my framework — can it be stated without the notion of a fact of the matter about what a term refers to, or does my framework just lack the resources to say it? Other direction too: does anything I use — generalisation, distribution shift, compositionality, whatever — let me say something his vocabulary can't, and is that a real addition or just a redescription? Be honest about which part of the residue is my framework being too thin and which part is his claim being vaguer than it looks.

  Casual, no need to survey the literature, maybe 700-900 words. British English please (behaviour, generalisation, that sort of thing). Also dont feel you have to be nice about the ML side — if the translation exposes a gap in how I think about this I'd rather know.
