prompt: |-
  I'm a novelist, about a third of the way into a book about Hobbes — the exile years, the squaring-the-circle fiasco, the decades-long pamphlet war with the Oxford geometry professor who kept taking his proofs apart in print. I've hit the scene where my Hobbes has to explain out loud why he thinks politics can be proved the way geometry is proved, so I wrote the argument out properly, to give the speech real bones. Now I'm worried it proves something he'd have hated — that no argument in the book can ever settle anything. Here it is, tidied up, in his voice:

  (1) In geometry we start from definitions and follow the consequences. The point, the line, the figure are things we make ourselves, and we know what we make — that's why geometry is the one science that's demonstrable.
  (2) But a definition is a name we assign. Nothing in the world forces one set of names on us rather than another; we simply agree to speak that way.
  (3) So a demonstration only shows that anyone who has agreed to speak as we do cannot deny the conclusion without talking nonsense.
  (4) So a demonstrated conclusion is true of our words, not of bodies. It records the consequences of names, not the causes of things.
  (5) Therefore geometry's certainty is the certainty of a well-built vocabulary, and nothing more.
  (6) And since he says civil philosophy is demonstrable in the same way, the absolute sovereign is proved only inside a vocabulary.
  (7) Which means the Oxford man, when he says the circle hasn't been squared, isn't wrong — he's speaking a different language. Hobbes can call him inconvenient, not mistaken.
  (8) But Hobbes plainly does think he's wrong, and thinks the sovereign's necessity holds of real commonwealths, not just of readers who've accepted his definitions.
  (9) If (1)-(5) stand, nothing he writes refutes anybody, and the argument that proves absolutism proves equally that no argument proves anything.
  (10) Something has to give. Either geometry does give knowledge of real bodies, or demonstration is only verbal — and if it's only verbal, my third act doesn't work.

  So where does it break? I'd rather not give up (2) — my Hobbes is a man who thinks words are tools and that he's a craftsman, and that's most of his charm. (5) is where I feel the floor move but I can't say why; it feels like it got smuggled in earlier and I just didn't notice. And if the fix costs me (1), tell me what I'm paying, because (1) is what makes him a mathematician instead of just a pamphleteer.

  Two more things while you're in there. He wrote natural philosophy too, and knew perfectly well it wasnt demonstrable — does that distinction get me out of this, or is it a seperate mess that just makes it worse? And if there's a version of this he could actually have held without it eating itself, give me that version in a paragraph, in a voice I could put in his mouth.
reasoning: |-
  Okay, the user is a novelist working on a book about Hobbes. They've written a scene where Hobbes explains why politics can be proven like geometry, but they're worried the argument undermines itself. The core issue is that if all demonstration is just about word definitions, then no argument can actually settle anything—which contradicts Hobbes's belief in the absolute sovereign's necessity.

  First, I need to understand the logical steps they've outlined. Points 1-5 lead to the conclusion that geometry is about language, not reality. Then step 6 applies this to political philosophy, leading to problems in steps 7-10. The user wants to know where the argument breaks without sacrificing Hobbes's character as a wordsmith.

  The key tension is between nominalism (definitions as human constructs) and realism (knowledge of actual bodies). Hobbes needs geometry to be both certain and about real bodies for his political theory to hold. The user suspects step 5 is the weak point. Let me check if that's where the smuggling happens.

  Looking at step 2: definitions are arbitrary agreements. Step 3: demonstrations show consistency within that language. Step 4: conclusions are about words, not bodies. Step 5 summarizes this as geometry's certainty being merely verbal. But Hobbes believed geometry applies to the physical world because matter and motion are governed by geometric principles. So step 4 might be overstated. If geometric truths reflect how bodies behave, then it's not just about words.

  The user mentioned Hobbes's distinction between demonstrable philosophy (geometry, politics) and non-demonstrable natural philosophy. That could help. For Hobbes, we can define political concepts precisely like geometric ones, whereas natural philosophy deals with contingent causes we can't fully know. But the problem is that if politics is demonstrable like geometry, and geometry is only verbal, then politics is too. The fix requires geometry to have some connection to reality.

  Perhaps step 5 is indeed the misstep. Hobbes would say geometric truths, once defined, necessarily apply to bodies because bodies are extended and movable. So the certainty isn't just verbal—it's about the necessary consequences of definitions that capture real properties. The user wants to keep step 1 and 2, which is possible if we clarify that definitions aren't arbitrary but are grounded in the nature of bodies.

  For the novel, Hobbes could argue that while the names are conventions, they refer to real properties (extension, motion). So demonstrations reveal truths about bodies under those descriptions. Similarly, in politics, defining sovereignty isn't arbitrary but based on human nature and necessity. The Oxford mathematician isn't speaking a different language but misapplying agreed definitions.

  The user also needs a paragraph in Hobbes's voice that resolves this. It should maintain his nominalism but affirm that definitions track reality closely enough for certainty. Emphasize that in geometry, we create figures but must follow their properties, just as in politics, we create commonwealths but must follow the logic of power and covenant.

  Natural philosophy's lack of demonstrability contrasts with geometry and politics because it deals with uncertain causes, not definitions. That distinction can reinforce why politics is demonstrable—it's about human constructions, like geometric figures.

  In summary, the break is at step 4/5. By clarifying that geometric truths do apply to bodies because definitions capture their essence, Hobbes can maintain both his nominalism and the reality of demonstrations. The revised argument should stress that while words are tools, they are tools for carving reality at its joints.
answer: |-
  Here's where your argument breaks (brilliantly!) and how to fix it while keeping Hobbes' core charm intact. The flaw is in **step (4) and the leap to (5)**, specifically the claim that geometry is *only* about words and *not* about bodies. Hobbes *did* believe geometry gave knowledge of real bodies, precisely *because* we make the figures based on fundamental properties of matter. Let's dissect it:

  1.  **The Break Point:** Step (4) states: "a demonstrated conclusion is true of our words, not of bodies." While Hobbes was a nominalist about universals (step 2 is correct), he was a **materialist mechanist** about reality. Bodies *are* extended, they *do* move, they *can* have figures. Geometry *starts* from definitions we make (point, line), but these definitions aren't *arbitrary* fictions; they are **abstractions grounded in the fundamental properties of real bodies** – namely, extension and motion.
  2.  **Why (5) is Smuggled In:** Step (5) ("geometry's certainty is the certainty of a well-built vocabulary, and nothing more") takes the nominalism of (2) too far. It ignores the crucial **representational link**. Hobbes believed:
      *   We create the *concepts* (point, line) by abstraction.
      *   We create the *names* for these concepts.
      *   BUT, the *relationships* we demonstrate between these concepts (e.g., Pythagoras' theorem) **necessarily hold true for any real body possessing the property of extension to which these concepts correspond.** The "well-built vocabulary" *reflects* the necessary properties of extended matter. The certainty *is* verbal, but the verbal system *accurately maps* the necessary behavior of real extended things.
  3.  **The Distinction with Natural Philosophy:** This *does* help and isn't a separate mess. Hobbes distinguished:
      *   **Geometry & Politics (Demonstrable):** Deal with *artifacts we create* (figures, commonwealths) from fundamental, knowable properties (extension/motion, human nature/passion/covenant). Because we *make* the subject matter (by defining concepts or establishing covenants), we can know its necessary consequences with certainty. The definitions capture *essential* properties of reality (matter for geo, human nature for pol).
      *   **Natural Philosophy (Not Demonstrable):** Deals with *causes* in the natural world *we did not make* (e.g., why gravity works, the internal motions causing light). We can only hypothesize based on sense and experience; we cannot know the *necessary* causes with geometric certainty. We didn't create nature's internal mechanisms.
  4.  **Fixing the Oxford Man Problem (7):** Hobbes *can* call the Oxford man "wrong" without contradiction:
      *   They *agree* on the definitions of "circle" and "square" (as concepts grounded in extension).
      *   Hobbes claims his construction *necessarily follows* from those definitions (and the rules of motion he uses in the construction).
      *   The Oxford man claims to show a *logical inconsistency* within the *agreed framework*.
      *   Therefore, Hobbes believes the Oxford man is *mistaken within their shared language of geometry*, misapplying the definitions or the logic. It's not a different language; it's an error *within* the agreed-upon language describing the properties of extension.
  5.  **Saving the Sovereign (6, 8, 9):** The sovereign is "proved" similarly:
      *   Hobbes defines core political concepts (Right of Nature, Law of Nature, Covenant, Person, Representation, Sovereignty) based on his analysis of fundamental, knowable properties of human nature (fear, desire, reason, necessity of self-preservation, capacity for agreement).
      *   He argues the *necessary consequences* of these definitions (especially covenant) *in a world populated by such creatures* is an absolute sovereign. Without it, the state of war is inevitable.
      *   This "proof" holds *of real commonwealths* because commonwealths *are* artifacts humans *make* via covenant, based on those fundamental human properties. The definitional structure *maps* the necessary logic of human interaction for peace. To deny the conclusion is to either deny the definitions (which Hobbes thinks accurately capture human reality) or to deny the logic. It *is* refutation within the framework he believes accurately describes political reality.

  **Here's the Fix in Hobbes' Voice (Your Paragraph):**

  *(Leaning forward, knuckles white on the table)* "Think, man! Do we conjure the line from *nothing*? No! We abstract it from the very *extension* of matter itself – a property undeniable as your own hand before you. We *name* the point, the line, the circle – yes, those are our tools – but the *relations* we demonstrate? Those are the iron chains binding *all* extended things! The geometer's proof holds *because* bodies *are* extended, *because* motion defines their possibility. So too in civil philosophy! We start not with phantoms, but with Man: his fear, his desire, his reason whispering *self-preservation*. We define Right, Law, Covenant – names, yes, but names for the fire in his belly and the terror in his nights! The sovereign is no mere word-play; he is the *necessary consequence*, as sure as the angles in your Euclid, when such creatures covenant to escape the war that is their natural condition. Deny it? You deny the nature of the matter – human matter – itself! The Oxford pedant errs *within* geometry, mangling the logic of extension. The rebel errs *within* politics, blind to the logic of passion. Both mistake the mapmaker's lines for mere ink, forgetting the territory they *must* describe."

  **What You Keep and What You Pay:**

  *   **You Keep (1):** Geometry starts from definitions we make – he's still the craftsman.
  *   **You Keep (2):** Definitions are names we assign – nominalism intact.
  *   **You Keep (3):** Demonstration shows consequences within the language – logic is key.
  *   **You Modify (4):** "So a demonstration... records the consequences of names *that signify the essential properties of bodies*." It's true *of* the words *because* the words correspond *to* the fundamental reality.
  *   **You Replace (5):** "Therefore geometry's certainty *is* the certainty of a well-built vocabulary *that mirrors the necessary properties of extended matter*." The "nothing more" is gone.
  *   **Cost:** You pay a small price in absolute nominalist purity. Hobbes isn't *just* a word-craftsman; he's a word-craftsman who believes his tools carve reality at its most fundamental joints (matter/motion, human passion/reason). His charm as a craftsman remains, but it's a craftsman *confident* he's working with the true grain of the universe. This is historically accurate Hobbes.

  This fix preserves the power and logic of your scene, maintains Hobbes' core identity and charm, resolves the self-defeating paradox, and leverages his distinction between demonstrable and non-demonstrable philosophy logically. It makes the Oxford clash sharper (error within shared logic) and grounds the sovereign's necessity in a reality Hobbes believed his definitions captured perfectly.
