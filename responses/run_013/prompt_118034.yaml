  Below is a diagnostic decision tree designed to sort students into positions on expected value fanaticism based on their responses to concrete cases. The tree has 8 branch nodes (questions) and 7 leaf nodes (positions), with each question phrased as a forced-choice scenario. Unoccupied combinations are noted at the end, along with reasons. The tree is built from logical commitments first, with positions mapped to the resulting answer combinations.

  ### Decision Tree for Expected Value Fanaticism

  **Start Here**  
  **Q1: Bounded Outcomes**  
  *Consider creating 10^100 happy lives. Is there a maximum level of goodness, such that no outcome can exceed some finite value?*  
  - **Yes, outcomes are bounded** → Q2  
  - **No, outcomes are unbounded** → Q3  

  **Q2: Finite Pascal's Mugging (Bounded)**  
  *A stranger offers: lose $5 for a 1 in 10^100 chance to create 10^100 happy lives (finite good). The expected value exceeds a certain cure for 10 people's moderate disease. Accept?*  
  - **Yes, accept the gamble** → Q7  
  - **No, reject the gamble** → **Leaf: Lexical Threshold/Satisficing**  
    *Most awkward commitment: Arbitrarily large goods can be ignored if they require accepting tiny risks, even when rationally dominant by expected value.*  

  **Q3: Positive Infinities (Unbounded)**  
  *Can an outcome have infinite positive value (e.g., eternal utopia with infinitely many beings)?*  
  - **Yes, infinite positives exist** → Q4  
  - **No, only finite utilities exist (unbounded)** → Q2  

  **Q4: Negative Infinities**  
  *Can an outcome have infinite negative value (e.g., eternal hell with infinitely many beings)?*  
  - **Yes, infinite negatives exist** → Q5  
  - **No, only infinite positives exist** → Q6  

  **Q5: Devil's Offer**  
  *A demon offers: take a certain cure for 10 people's moderate disease, or risk a 1 in 10^100 chance of infinite suffering. Take the gamble?*  
  - **Yes, take the gamble** → **Leaf: Unrestricted Expected Value Fanaticism**  
    *Most awkward commitment: Willing to risk infinite suffering for a finite good if the probability is tiny.*  
  - **No, take the certain good** → Q8  

  **Q6: Infinite Pascal's Mugging**  
  *A stranger offers: lose $5 for a 1 in 10^100 chance of infinite positive utility (eternal utopia). Accept over a certain cure for 10 people?*  
  - **Yes, accept the gamble** → Q7  
  - **No, reject the gamble** → **Leaf: Probability-Discounting/Non-Standard DT**  
    *Most awkward commitment: Infinite goods can be ignored if probabilities are below a threshold, violating expected value maximization.*  

  **Q7: Epsilon Offer**  
  *A being offers: take a certain modest improvement for 10 people, or a gamble with a 1 in 10^100 chance of creating 10^100 happy lives and a 1 in 10^100 chance of creating 10^100 lives of unbearable suffering (expected value = 0). Choose:*  
  - **Gamble** → **Leaf: Risk-Seeking Consequentialism**  
    *Most awkward commitment: Accepts symmetric astronomic risks even when expected value is neutral or negative, inviting catastrophic losses.*  
  - **Certain improvement** → **Leaf: Bounded-Value Fanaticism**  
    *Most awkward commitment: Fanatical for huge finite gains but avoids symmetric risks, creating tension with risk neutrality.*  

  **Q8: Two-Dimensional Test**  
  *Would you accept a 1 in 10^100 chance of infinite utility (as in Q6) but reject a 1 in 10^100 chance of 10^100 happy lives (finite, as in Q2)?*  
  - **Yes, accept infinite but reject finite** → **Leaf: Two-Dimensional Fanaticism**  
    *Most awkward commitment: Fanaticism depends on value size (infinite > finite) but not probability size, making small probabilities of infinites special.*  
  - **No, treat consistently** → **Leaf: Risk-Averse/Maximin Consequentialism**  
    *Most awkward commitment: Avoids all tiny-probability gambles with catastrophic risks, even when expected value is positive or infinite.*  

  ---

  ### Unoccupied Combinations & Indistinguishable Leaves
  - **Unoccupied Combinations**:  
    - **Bounded + Accept Epsilon Gamble (Q2→Q7→Gamble)**: Unoccupied because incoherent. If outcomes are bounded, the symmetric Epsilon Offer gamble has near-zero expected value, so accepting it contradicts risk aversion for large stakes without a clear rationale.  
    - **Unbounded + Only Finite Utilities + Reject Finite Pascal's Mugging (Q3→No→Q2→No)**: Unoccupied because unattractive. Rejecting a dominant expected-value gamble (with unbounded finite utilities) implies ad hoc probability thresholds, which few defend as it undermines standard consequentialism.  
    - **Both Infinities + Reject Infinite Pascal + Accept Two-Dimensional (Q4→Yes→Q5→No→Q8→Yes)**: Unoccupied because unstable. Accepting infinite goods but rejecting infinites in a two-dimensional way (Q8) after avoiding the Devil's Offer (Q5) relies on inconsistent risk attitudes toward infinites.  

  - **Indistinguishable Leaves** (due to coarse instrument):  
    - **Risk-Averse/Maximin Consequentialism** and **Quietist/Error-Theoretic** are extensionally equivalent in all cases involving infinite or catastrophic risks (both reject all gambles in Q5, Q6, Q7). They are separated only in Q8 (if applicable), but if Q8 is not reached, the tree cannot distinguish them.  
    - **Probability-Discounting/Non-Standard DT** and **Lexical Threshold/Satisficing** are extensionally equivalent for finite bounded cases (both reject finite Pascal's Mugging in Q2). They diverge only if unbounded cases arise, but the tree routes bounded and unbounded paths separately.

  ### Instructions for Use
  - **Administering**: Pose each question verbatim. Force a binary choice; no neutral/middle answers.  
  - **Position Key**:  
    - **Unrestricted Expected Value Fanaticism**: Accepts all gambles with positive expected value, regardless of stakes.  
    - **Bounded-Value Fanaticism**: Fanatical for huge finite gains but risk-averse for symmetric losses.  
    - **Probability-Discounting/Non-Standard DT**: Dismisses tiny probabilities (treats as 0) or uses non-linear weighting.  
    - **Risk-Averse/Maximin Consequentialism**: Maximizes the worst-case outcome; avoids catastrophic risks.  
    - **Lexical Threshold/Satisficing**: Ignores outcomes below a utility/risk threshold; seeks "good enough" options.  
    - **Two-Dimensional Fanaticism**: Treats infinite and finite values asymmetrically (fanatical for infinites only).  
    - **Risk-Seeking Consequentialism**: Prefers gambles with extreme stakes, even with neutral/negative EV.  
  - **Target Audience**: Advanced undergraduates; assumes familiarity with Pascal's Mugging, Devil's Offer, and Epsilon Offer cases.  

  This tree isolates commitments via concrete cases, revealing how boundedness, infinites, risk attitudes, and probability thresholds drive disagreements. Positions emerge from the logic, not predefined labels.
