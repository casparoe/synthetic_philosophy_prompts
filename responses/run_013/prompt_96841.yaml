prompt: |-
  For the past six years I have been the philosopher attached to the clinical ethics consultation service at our academic medical center: I carry the on-call pager one week in four, I am usually expected to have a note in the chart within twenty-four hours, and that note is countersigned by the attending physician and the committee chair, which means I have to be able to defend every move in it to people who will read it as something closer to a legal document than to a seminar paper. A large share of the consults that reach me turn on moral testimony in the strict sense. Someone — a spouse, an adult child, a nurse on the unit, a senior colleague, occasionally the patient's own advance directive — asserts a moral claim, and the question I actually have to answer is not what I think is right but whether I am entitled to let that claim do the work. I would like a written procedure I can run on a consult, grounded in what the philosophical literature on moral testimony and moral deference has actually established and candid about what it has not. What I need is an ordered set of questions that tells me, first, whether what I am being offered is testimony about a moral matter, advice I may weigh, or a preference I must honor for reasons that have nothing to do with its truth, and how to tell when one and the same sentence is functioning as two of these at once; second, what would have to be true of the speaker for deference to be warranted at all, and whether the standards are the same as they would be for deference about a straightforwardly factual matter; third, what deference would oblige me to do in the note and in the conversation with the family, given that I may end up certified as having acted rightly on grounds I cannot myself give; and fourth, where the procedure stops and hands the matter to the committee, because the question is evaluative rather than factual and no amount of my expertise settles it. Two things must survive the simplification: the point that one can be justified in acting on another's moral say-so without thereby understanding why the action is right, and the point that this gap is precisely what makes deference uncomfortable and what leads some philosophers to think it is unavailable in morals even where it is unproblematic elsewhere. Do not smooth that difficulty away; build the procedure around it.

  Then run the procedure on three consults, narrating the questions in order and saying what it directs me to do. In the first, the family of a patient with a catastrophic brain injury insists that everything be done, on the ground that a life in this condition is still a life owed absolute protection, and the attending wants me to talk them out of it. In the second, a respected senior intensivist tells me that in her judgment continuing is wrong and that she will not do it, and I notice that I am inclined to agree with her and to write my note as though the matter had been settled by her authority. In the third, a nurse says she cannot in conscience take part in a planned withdrawal, and I find, to my annoyance, that the procedure treats her claim as testimony I am not entitled to overrule, which will please neither the attending nor me. Close with a short section on where the procedure will misfire: cases in which the speaker's moral claim is entangled with a factual claim I can check; cases in which the speaker's standing to be heard rests on relationship rather than reliability, so that deference and respect for autonomy come apart; and cases in which I will be tempted to launder my own moral judgment into a procedural verdict. Assume the reader has the vocabulary but has never had to write the note.
reasoning: |-
  Okay, the user is a philosopher working in clinical ethics consultation at a medical center. They need a structured procedure to handle cases involving moral testimony. Let me start by understanding their main requirements. They want a step-by-step guide that differentiates between moral testimony, advice, and preferences. They also need criteria for when deference is warranted, what actions it obligates, and when to escalate to the committee. Importantly, they emphasize preserving the tension between acting on another's moral judgment without understanding why it's right.

  First, I need to recall the philosophical literature on moral testimony and deference. Key thinkers like Hills, McGrath, and Enoch highlight the discomfort in deferring morally. The user wants this discomfort acknowledged, not smoothed over. The procedure must handle cases where deference is necessary but epistemically problematic.

  Breaking down their four main points: 
  1. **Categorizing the claim**: Is it testimony, advice, or preference? Testimony asserts a moral truth, advice is a suggestion based on judgment, preference is a personal choice. A single statement can function in multiple ways. For example, a family saying "everything must be done" could be both testimony about sanctity of life and a preference based on their values.

  2. **Speaker reliability**: What makes a speaker credible for moral deference? Unlike factual matters, moral expertise requires wisdom, experience, and virtue. The user needs clear criteria to assess this.

  3. **Action obligations**: When deferring, what must the consultant document? They must acknowledge the deference in notes and conversations, even if they can't justify the decision themselves. This transparency is crucial for legal and ethical accountability.

  4. **Escalation triggers**: When does the issue move to the committee? Evaluative questions unresolved by deference, like conflicting values, require committee input. The procedure must flag these cases.

  Now, applying this to the three scenarios:
  - **First case** (family insists on full treatment): The claim is both testimony (life is sacred) and preference (their values). The family's standing comes from relationship, not expertise. Deference isn't warranted, so the consultant must mediate, not override. Escalate if unresolved.
    
  - **Second case** (intensivist refuses treatment): Her claim is testimony based on expertise. Criteria for moral reliability are met, so deference is warranted. The note should cite her authority, but the consultant must avoid personal agreement influencing the decision.

  - **Third case** (nurse's conscientious objection): This is a preference rooted in conscience, not testimony. The procedure treats it as inviolable, requiring accommodation. This might frustrate the attending, but the nurse's autonomy must be respected.

  Potential misfires: 
  - **Entangled claims**: If a moral statement includes factual errors (e.g., "treatment is futile" when data shows otherwise), the consultant must disentangle and correct facts.
  - **Relationship-based standing**: Family members have a right to decide, but their moral assertions don't require deference. Here, respect for autonomy differs from epistemic deference.
  - **Laundering judgment**: The consultant might mask their own views as procedural outcomes. The procedure must force transparency about when deference is genuinely applied versus personal judgment.

  The user's deeper needs include maintaining integrity in documentation, navigating institutional pressures, and upholding ethical standards without overstepping their role. They need a tool that provides clarity in complex interpersonal dynamics while acknowledging philosophical tensions. Ensuring the procedure is practical in fast-paced medical settings is essential, hence the emphasis on ordered questions and clear escalation paths.
answer: |-
  Here is a procedural framework grounded in the philosophy of moral testimony/deference, designed for clinical ethics consultation. It preserves the core tension between justifiable action on another's moral say-so and the epistemic discomfort this entails. The procedure is structured as an ordered set of questions, followed by application to your three cases and analysis of failure modes.

  ---

  ### **Procedure: Moral Testimony Assessment Protocol (MTAP)**  
  *For use when a moral claim is presented as decisive in clinical decision-making*

  **I. CATEGORIZATION: What is the nature of the claim?**  
     *(Answer sequentially; claims may serve multiple functions)*  
  1. **Is the claim presented as a *moral truth*?**  
     - *Key markers:* Assertion of objective right/wrong; appeal to universal principles; use of prescriptive language ("must," "ought," "unconscionable").  
     - *If YES → Classify as **Moral Testimony**. Proceed to Section II.*  
  2. **Is the claim presented as *practical guidance*?**  
     - *Key markers:* Invitation to weigh reasons ("consider X"); context-specific recommendation ("I suggest Y"); framed as opinion ("in my view").  
     - *If YES → Classify as **Advice**. Document as "recommendation from [role]." Weigh alongside clinical/ethical factors. STOP MTAP.*  
  3. **Is the claim presented as a *personal stance* demanding non-override?**  
     - *Key markers:* Invocation of conscience/identity ("I cannot participate"); relational authority ("as his wife"); assertion of rights ("my choice").  
     - *If YES → Classify as **Preference/Autonomy Claim**. Honor per institutional policy (e.g., conscience exemptions, surrogate authority). STOP MTAP.*  
     *→ **Multi-function handling:** If a single claim serves ≥2 functions (e.g., "I cannot participate [preference] because this is murder [testimony]"), address *each strand* separately under its relevant section.*

  **II. DEFERENCE WARRANT: Is deference to testimony epistemically justified?**  
     *(Applies ONLY to claims classified as Moral Testimony in Section I)*  
  1. **Does the speaker possess relevant *moral expertise*?**  
     - *Criteria:* Demonstrated experience in *moral reasoning* (not just technical skill); consistency in ethical judgments; recognition by peers as a moral exemplar; capacity for nuanced contextual discernment.  
     - *Contrast with factual expertise:* Moral expertise requires *practical wisdom* (phronesis), not merely knowledge. Higher threshold than factual deference.  
  2. **Is the testimony *domain-appropriate*?**  
     - *Criteria:* Speaker’s expertise aligns with the ethical dilemma (e.g., palliative care ethics for end-of-life; research ethics for trials).  
  3. **Is there *no defeaters*?**  
     - *Defeaters include:* Conflict of interest; emotional distress impairing judgment; inconsistency with speaker’s prior positions; clear factual ignorance.  
     *→ **Deference verdict:** Deference warranted ONLY if all (1-3) are satisfied. If not, testimony may be noted but carries no decisive weight.*

  **III. ACTION UNDER DEFERENCE: What does warranted deference oblige?**  
     *(Applies ONLY if Section II justifies deference)*  
  1. **In the chart note:**  
     - State the moral claim *as testimony* (e.g., "Dr. X, a senior intensivist with 30 years’ experience in critical care ethics, affirms that continuing treatment is morally impermissible").  
     - Explicitly cite the speaker’s *moral expertise* as the justification.  
     - **DO NOT** provide independent moral reasoning. Write: "This determination rests on the authority of Dr. X’s moral judgment."  
  2. **In family/conversations:**  
     - Acknowledge the testimony’s authority: "We are guided by Dr. X’s ethical expertise in such cases."  
     - **DO NOT** pretend personal endorsement. State: "While I may not fully grasp the nuances of her reasoning, her standing obliges us to defer."  
  3. **If deference is unwarranted (per II):**  
     - Note the claim as an "expressed moral view" but state it lacks "decisive ethical authority." Proceed to standard ethical analysis.

  **IV. ESCALATION TRIGGERS: When does this exceed MTAP scope?**  
     *(Apply regardless of prior sections)*  
     Escalate to full committee if ANY apply:  
     - The core conflict is *evaluative* (e.g., "Which value prevails: sanctity of life or quality of life?").  
     - Multiple credible moral testimonies conflict irreconcilably.  
     - Deference would violate institutional policy/law.  
     - The consultant cannot resolve the tension between justifiable action and personal epistemic discomfort (per mandate).

  ---

  ### **Application to Consults**  

  **Case 1: Family insists on "everything done" for catastrophic brain injury**  
  - **I.1 (Moral testimony?)** YES: "A life in this condition is owed absolute protection" asserts objective moral truth.  
  - **I.3 (Preference?)** YES: As legal surrogates, their preference must be honored *unless* medically inappropriate.  
    *→ Multi-function: Address testimony via II, preference via policy.*  
  - **II.1 (Moral expertise?)** NO: Family lacks domain expertise in neuroethics/quality-of-life evaluation.  
  - **II.3 (Defeaters?)** YES: Emotional distress likely clouds judgment.  
  - **III.3:** Document testimony but note no deference warranted. Honor preference *as surrogate decision*.  
  - **IV:** Escalate ONLY if surrogacy is contested or demands are medically futile.  
  - **Action:** *Do not* attempt to "talk them out of it." Explain surrogate authority. If treatment is non-beneficial, escalate for futility review.  

  **Case 2: Senior intensivist declares continuing treatment "wrong" and refuses**  
  - **I.1:** YES: "Continuing is wrong" is moral testimony.  
  - **II.1:** YES (if criteria met): 30+ years in ICU ethics, peer respect, and consistent judgment history justify expertise.  
  - **II.2:** YES: Domain-appropriate (critical care ethics).  
  - **II.3:** Check for defeaters (e.g., burnout? bias?). If none → DEFERENCE WARRANTED.  
  - **III.1:** In note: "Dr. X, owing to her recognized expertise in critical care ethics, has determined that continued treatment is morally impermissible. This judgment is deferred to per institutional protocols for ethical authority."  
  - **III.2:** Tell family: "Dr. X’s ethical assessment carries weight due to her experience; we must align with her guidance."  
  - **IV:** Escalate if team disputes expertise or moral claim contradicts policy.  
  - **Critical nuance:** Your inclination to agree is irrelevant. If deference is warranted, your note *must* center **her authority**, not your concurrence.  

  **Case 3: Nurse refuses withdrawal of care "in conscience"**  
  - **I.1:** POTENTIAL testimony ("this is immoral"), but **I.3 dominates**: "Cannot in conscience participate" is a preference/conscience claim.  
  - **III.3:** NOT testimony for deference. This is an autonomy/conscience assertion.  
  - **Action:** Honor per conscience accommodation policies (e.g., reassign staff). Document: "Nurse Y asserts conscientious objection to participation, requiring accommodation under Policy 7.2."  
  - **Annoyance explained:** MTAP correctly blocks you from "overruling" her conscience claim as unreliable testimony. Your mandate is to protect autonomy, not evaluate moral truth.  

  ---

  ### **Where MTAP Misfires: Failure Modes**  
  1. **Entangled factual claims**:  
     - *Example:* "Withdrawing care is murder [testimony] because he’ll recover [fact]."  
     - *Risk:* Deferring morally while missing corrigible factual error.  
     - **Fix:** Disentangle first. Verify facts independently (e.g., prognosis). Re-run MTAP on pure moral claim.  

  2. **Relationship-based standing**:  
     - *Example:* A spouse’s "He wouldn’t want this" as moral testimony.  
     - *Risk:* MTAP may over-reject (if expertise lacking) or under-reject (if deference confounded with surrogate rights).  
     - **Fix:** In **I.3**, explicitly separate relational authority (always honored) from moral expertise (deferred to only if II satisfied).  

  3. **Procedural laundering**:  
     - *Example:* Judging a testimony "unreliable" (II.3) because you disagree morally.  
     - *Risk:* Subjective bias masked as procedural rigor.  
     - **Fix:** Require objective evidence for defeaters (e.g., "Speaker’s view contradicts their prior sworn testimony on similar cases"). Escalate (IV) if uncertainty persists.  

  ---

  **MTAP anchors your note in defensible philosophical distinctions while exposing the deference gap.** It forces transparency when acting on another’s moral word—precisely where the discomfort lies. By separating testimony from preference and expertise from authority, it protects against both undue deference and autonomy violations. Escalation triggers ensure evaluative dilemmas face committee scrutiny, preserving the integrity of your role as philosopher rather than moral arbiter.
