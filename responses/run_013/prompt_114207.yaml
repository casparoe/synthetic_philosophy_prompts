  Here's a closing speech structured around Kant's core arguments in *Toward Perpetual Peace*, designed for your audience and context. Confidence levels and the tricky point are addressed at the end.

  **Delegate Closing Remarks: Committee on the [Fictional Region] Crisis**

  (Adjust tone: Measured start, building to conviction, ending with cautious hope)

  "Alright delegates, we made it. Four simulations, countless crises, a mountain of resolutions, amendments, and amendments to amendments. We’ve argued intervention, borders, refugees, and the big one: do we try to build something permanent out of this mess? Something stronger than just hoping the guns stay quiet?

  **(Acknowledge the Cynicism - The Innkeeper's Sign)**
  "Honestly? At the start of this, the idea of ‘perpetual peace’ for [Fictional Region] probably felt… well, a bit like that old story. You know, the innkeeper who hung up a sign promising ‘Perpetual Peace’… and painted a picture of a graveyard underneath? Yeah. Dark joke. And after this weekend, seeing how deep the divisions run, how messy the interests are? I get it. That cynicism isn't just being edgy; it’s born from looking at the real graveyards this crisis has already created. Pretending that cynicism isn't there, or that it’s somehow *wrong* to feel it, doesn't help us.

  **(The Truce vs. Instituted Peace)**
  "But here’s the crucial thing Kant forces us to confront: that cynicism often comes from mistaking a *truce* for actual *peace*. A ceasefire? That’s just the guns stopping. It’s fragile. Temporary. Everyone knows the clock is ticking until someone breaks it. Real peace – the kind that lasts, the kind worth striving for even when it feels impossible – isn’t just the *absence* of war. It’s something you have to *build*. Actively. Deliberately. You have to *institute* it. You have to create structures, guarantees, something more solid than just crossed fingers and goodwill. That’s the leap we spent this weekend trying – sometimes stumbling – to make.

  **(Sovereignty & The Federation - NOT World Government)**
  "And building it means making hard choices about *how*. One loud argument we heard all weekend was for a big, powerful regional body – maybe even with its own army – to just step in and enforce peace. Top down. Make everyone behave. Sounds efficient, right? But Kant throws a massive wrench in that idea. He argues that creating a single, all-powerful ‘world republic’ – or even a mega-regional one – is incredibly dangerous. Power that concentrated? History screams that it almost inevitably slides into tyranny. One group's solution becomes another group's oppression. So, what’s the alternative?

  "He proposes something less absolute but maybe more durable: a **league or federation of sovereign states**. Think of it as a permanent alliance, a club with rules. Key point: Each state keeps its independence, its sovereignty. No one gets dissolved into some super-state. But they *choose* to bind themselves together under shared laws and principles for *mutual* security. They create a framework where disputes get resolved around a table, not across a battlefield. It’s not a perfect global government; it’s a pact *between* nations, a substitute, a practical step towards the *idea* of a peaceful republic, built on consent, not conquest. It’s messy, it’s slow negotiation – sound familiar? – but it respects the messy reality of distinct peoples and nations while actively building peace.

  **(Hospitality & Refugees - The Human Connection)**
  "This isn’t just abstract statecraft. It connects directly to the human suffering we grappled with: the refugees. Kant grounds this whole project in a fundamental principle: **Universal Hospitality**. Not charity. Not open borders without limits. But the basic right of a person fleeing danger *not to be treated as an enemy* when they arrive on someone else's shore. The right to seek refuge, to be heard, to not be immediately thrown back into the fire. Denying that basic decency isn't just cruel; it undermines the very possibility of peace between peoples. The refugee crisis isn't a sidebar; it's a test of whether we see humanity as connected or fractured.

  **(Nature's 'Guarantee' - The Unsettling Twist)**
  "Now, here’s the part that might make us squirm a bit. Kant suggests that even with all our arguing, all our failures, peace might still be... sort of... guaranteed? But not by angels. By **nature**. By the harsh realities we’d rather avoid. War is so devastating, so unpredictable, that eventually, states are forced towards cooperation just to survive. Commerce binds interests across borders. People get scattered by conflict, mixing cultures and forcing interaction. Nature, in a way, *forces* us towards peace through the very awfulness of war and displacement. It’s not a happy thought. It’s a cold comfort, especially thinking about the civilians caught in the crossfire this weekend. But it reminds us that the drive for peace isn't just naive idealism; it’s woven into the brutal logic of survival itself. We can choose to build it consciously, carefully, or we can wait for nature to push us there, scarred and broken.

  **(Conclusion - The Kantian Challenge)**
  "So, delegates, what did we do this weekend? We wrestled with that graveyard sign. We tried to move beyond just hoping for a truce. We argued fiercely about how to *institute* peace – rejecting the easy fantasy of a single overlord in favor of the harder, more sovereign-respecting path of a federation or league. We confronted the human cost in the refugee crisis, grounding it in that principle of hospitality. And we glimpsed that unsettling truth: peace might be nature’s destination, but the path is ours to shape – consciously, cooperatively, respecting sovereignty while building guarantees stronger than hope.

  "It wasn’t perfect. We didn’t solve it all. But we engaged in the messy, essential work Kant demands. We didn’t just wish for peace; we tried, however imperfectly, to *build* its foundation. That’s the work that continues long after this gavel falls. Let’s keep building."

  ---

  **Confidence Assessment & The Tricky Point:**

  *   **Overall Structure & Core Concepts (Innkeeper, Truce vs. Peace, Hospitality, Nature's 'Guarantee'): High Confidence.** This accurately reflects Kant's main arguments and their logical flow within the essay. The framing of nature's guarantee as unsettling but part of his argument is solid.
  *   **Tone & Audience Adaptation: High Confidence.** Balances intellectual weight with accessible language and addresses both the knowledgeable judge and younger delegates. Uses Kant's structure without academic jargon.
  *   **Sovereignty & Federation vs. World Republic: Medium-High Confidence.** You are **correct** that Kant explicitly rejects a world state (a "universal monarchy") due to the tyranny risk and proposes a federation/league (*foedus pacificum*) of sovereign states as the alternative. The phrasing "substitute," "proxy," or "step towards the *idea*" captures his sense that this federation is the practical embodiment/as-if substitute (*als ob*) for the ideal of a world republic, an idea developed more explicitly in his later *Metaphysics of Morals* (which you rightly referenced). This is a standard and defensible interpretation.
  *   **The "Stand-In" Language & Later Law Book: Medium Confidence.** While the *essence* is correct (federation as the practical realization *instead* of the impossible world state), pinning the exact phrase "stand-in" or "substitute" (*als ob* - "as if") primarily to the later *Metaphysics of Morals* is where it gets slightly nuanced. *Toward Perpetual Peace* lays the foundation and strongly implies this function of the league. The *Metaphysics of Morals* (specifically the Doctrine of Right) reinforces and clarifies this, describing the league as establishing a condition *analogous* to a civil constitution among states. **This is the point I'm *least* sure about purely in terms of your initial phrasing:** Did you slightly conflate the emphasis? Yes, but meaningfully and in a way that accurately reflects Kant's overall thought. The core argument in the speech – rejecting world government, advocating for a sovereign-respecting league as the practical path – is rock-solid Kant from *Perpetual Peace*. The later book refines the *philosophical justification*, but the core proposal is firmly in the essay. Your teacher might note the refinement, but the substance of your point stands.
  *   **Nature's Guarantee - Irony?: High Confidence.** Kant isn't being *ironic*; he's being profoundly *realistic*, even grimly optimistic. He genuinely believes the mechanisms of nature (fear, self-interest, interdependence forced by conflict and commerce) create a developmental push towards peace. It's uncomfortable because it relies on suffering, but it's not ironic. He presents it as a supplementary, almost providential, force backing the moral imperative. The speech captures this unsettling realism well.

  **You are on solid ground.** The key takeaway for your teacher: You grasped Kant's core argument against a world state and for a federation/league of sovereigns as the practical, non-tyrannical path to peace, correctly situated hospitality and instituted peace vs. truce, and understood the non-ironic, realistic (if unsettling) role he assigns to nature. The "stand-in" phrasing is slightly more nuanced between the two texts, but the *meaning* you convey is fundamentally correct and Kantian. Deliver it with conviction! Good luck!
