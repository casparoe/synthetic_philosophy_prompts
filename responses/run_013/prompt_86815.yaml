prompt: |-
  I'm a third-year PhD student in epistemology who has been drafted into TAing an introductory ethics course, and one passage in the textbook I'm teaching from is now being quoted back at me by students with more confidence than I can match. It runs roughly: "Moral particularism, as the name suggests, is the view that morality is a matter of particular cases rather than general rules -- that there are no moral principles, and that judging is a matter of perceiving the details of a situation rather than applying anything to it. Its central insight is holism about reasons: whether a consideration counts in favour of an action depends on the other features of the case, which the particularist takes to show that nothing is ever a reason in itself. Generalism, by contrast, holds that morality is a system of general principles from which particular judgements can be deduced, so the debate is between those who think morality can be codified and those who think it cannot. Since the particularist's picture of context-sensitive judgement is now widely accepted, what remains in dispute is largely whether to call the resulting perceptiveness a kind of knowledge or a kind of skill. In any case the position cannot be right as it stands, since a morality with no general principles gives us no basis for criticising the practices of other cultures."

  I would rather not correct my students into a different error, so I want an audit of that passage: which parts are accurate, which are harmless popularisation, which a specialist would call a misrepresentation and what the view actually says instead, and whether the closing claims -- that the surviving disagreement is largely terminological, and that the absence of principles leaves the position unable to criticise anything -- follow from anything true in it. Please answer as exactly five numbered points, one or two sentences each, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is a third-year PhD student in epistemology who's been drafted into TAing an ethics course. They're struggling with a textbook passage on moral particularism that students are confidently quoting back at them. The passage claims that particularism rejects all moral principles, reduces morality to perception rather than rules, and argues that since holism about reasons is widely accepted, the remaining debate is just terminology. It also claims particularism can't criticize other cultures due to lack of principles.

  The user wants a precise audit of this passage, broken down into five numbered points without introduction or conclusion. They specifically want to know: which parts are accurate, which are popularizations, which are misrepresentations, what the actual view says, and whether the claims about terminological disagreement and cultural criticism follow logically.

  Breaking this down: First, the core definition of particularism as emphasizing particular cases over rigid rules is mostly okay - that's standard introductory material. The holism description is also reasonably accurate as popularization. But the claim that particularism completely denies moral principles is a misrepresentation - sophisticated particularists like Dancy actually allow for defeasible generalizations, just not exceptionless rules. 

  The passage's assertion about the "surviving disagreement" being terminological is misleading - there are substantive debates about moral perception versus principles that aren't just about labels. And the cultural critique argument doesn't logically follow because particularists can criticize practices through detailed situational analysis without needing absolute principles. 

  I'll structure the response as five crisp points: accuracy of the core definition, status of the holism claim, correction about principles, problem with the terminological claim, and flaw in the cultural critique argument. Keeping each to one or two sentences as requested, focusing on precision over elaboration since this is for academic use.
answer: |-
  1.  The core definition of particularism (emphasizing particular cases over rigid rules) and generalism (as codification) is largely accurate as introductory framing, though simplified.
  2.  The description of holism about reasons ("whether a consideration counts... depends on other features") is a broadly accurate popularization of a key particularist commitment.
  3.  Claiming particularism holds "there are no moral principles *at all*" is a significant misrepresentation; sophisticated particularists (like Dancy) reject only *invariant, exceptionless* principles, allowing defeasible generalizations.
  4.  The passage misstates the "surviving disagreement"; substantive debates persist about the *nature* of moral judgment (perception vs. rule-application), not merely whether to label it "knowledge" or "skill".
  5.  The claim that particularism cannot criticize other cultures ("no basis for criticising") does not follow; particularists argue criticism stems from detailed situational analysis, not requiring invariant principles.
