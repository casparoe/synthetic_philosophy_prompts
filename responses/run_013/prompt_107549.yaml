answer: |-
  You're wrestling with the exact tensions that make this period so philosophically rich—and Bentham's unpublished radicalism is the perfect scalpel. Let's dissect the moral thinking, embrace the fractures, and see where the theory bleeds into your novel's reality.

  ### 1. Bentham vs. Wolfenden: The Core Divergence
  - **Bentham's Unpublished Radicalism:** Yes, he argued that *any* consensual act causing no "perceptible damage" (physical harm, non-consensual exposure, breach of trust like adultery) should be immune. Pleasure isn't just a counterweight—it *negates* the justification for punishment. "Asceticism" (pleasure-as-sin) is the enemy because it *manufactures* artificial harms. He explicitly targeted sodomy laws as irrational cruelty driven by disgust-as-dogma.
  - **Wolfenden's Pragmatic Compromise:** The report famously declared: *"There must remain a realm of private morality and immorality which is, in brief and crude terms, not the law's business."* But note the limits:
    - **Privacy as Shield:** Only *private* acts between consenting adults (over 21) were deemed exempt. This was a spatial/relational boundary, not Bentham's "no harm" principle.
    - **Public Order Preserved:** Soliciting, "indecency" in public toilets, "corrupting youth"—these were still targets. Wolfenden saw them as "offences against public order and decency," not morality *per se*. Bentham would have rejected this: if disgust isn't a *legitimate* pain (as he argued), "public decency" is asceticism in disguise.
    - **The "Nuisance" Trap:** Wolfenden kept the law focused on visibility. Bentham would see this as capitulating to manufactured disgust. Your narrator being "picked up anyway" likely hinges on this—being seen, propositioned, or deemed "soliciting" in a park or pub toilet. The law retreated to the shadows but patrolled the thresholds.

  **Verdict:** Wolfenden wears a *snipped* version of Bentham's coat. It borrows the *privacy* carve-out but abandons Bentham's deeper attack on disgust as illegitimate. It's closer to Mill ("harm principle"), but Mill himself drew boundaries Bentham wouldn't (e.g., Mill might tolerate "public nuisance" laws). Bentham's theory is more corrosive: if disgust isn't rational harm, *no* consensual act should be criminal, public or private. Wolfenden kept the scaffolding of public morality; Bentham wanted to demolish the building.

  ### 2. The Disgust Problem: Where Bentham Bleeds
  This is the heart of your novel's moral crisis. Bentham *does* confront it—unflinchingly:
  - **The Illegitimacy of "Antipathy":** He called disgust "antipathy" and argued it fails as a ground for law because:
    - It's derivative: Rooted in asceticism or false beliefs ("sin").
    - It's infinitely elastic and manipulable (majority whim).
    - It's not a *real* harm like theft or assault; it's a psychic discomfort provoked by mere knowledge or imagination.
    - Crucially, he argued punishing consensual acts *creates more pain* (fear, blackmail, ruined lives) than the disgust it purports to alleviate.
  - **But Does It Collapse?** Here's the fracture:
    - **Internal Contradiction:** If a lynch mob feels intense "pain" from knowing gay men exist, does utilitarianism demand appeasing them? Bentham says no—because their pain stems from *irrational* beliefs. But who defines "irrational"? Bentham appeals to *empirical harm* (can you point to broken limbs, stolen property?). Disgust fails this test. Yet this smuggles in a quasi-objective standard of "real harm" beyond mere sensation—a crack in pure utilitarianism.
    - **The Tyranny Problem:** Yes, pure utility *could* justify majority tyranny if their suffering is intense enough. Bentham relies on two escape hatches:
      1. **The Long View:** Yielding to irrational disgust encourages superstition, stifles pleasure, and creates a society of fear and hypocrisy—*net negative utility*.
      2. **The Manufactured Pain Argument:** Disgust is socially constructed (by religion, bad laws). Punishing "sin" reinforces the very disgust it claims to address. Refusing to punish breaks the cycle.
    - **Why It Feels Shaky:** Bentham offers tools to *fight* disgust, but his framework lacks an absolute bulwark against it. If a society's disgust is sufficiently widespread, intense, and *accepted as rational* (like 1950s Britain), his calculus could theoretically justify persecution. His refusal to publish screams this tension—he knew his logic was too radical, too vulnerable to the very tyranny he feared.

  **For Your Novel:** Your narrator's despair lies here. Bentham's logic *should* have freed him, but the world priced "disgust" too high. The law didn't just count it—it weaponized it ("public decency," "soliciting"). Bentham's theory breaks on the rocks of ingrained social hatred. The neighbour's disgust *was* counted, and Bentham had no *knockdown* utilitarian argument to stop it—only a plea to rationality that fell on deaf ears.

  ### 3. What Wolfenden Tells Us About Utilitarianism
  - **Partial Vindication?** Yes, in outcome: Decriminalizing *private* acts *did* reduce net suffering (fewer ruined lives, less blackmail). Bentham would nod. The utility calculus eventually aligned with reform.
  - **But the Path Reveals Utilitarianism's Weaknesses:**
    - **Speed & Inertia:** Utility doesn't dictate *pace*. Institutional inertia, political cowardice, and the sheer weight of manufactured disgust delayed reform for a decade post-report. Bentham underestimated how long irrational pain persists.
    - **Half-Measures:** The 1967 Act (and surviving laws on soliciting/public acts) proves reform followed *political* utility, not Bentham's pure harm principle. The "nuisance" laws Bentham hated *persisted*. Utility got them partway, not all the way.
    - **The Framing Mismatch:** Reform succeeded by borrowing *liberal* ("privacy," "right to be let alone") and *pragmatic* ("waste of police resources") arguments more than Bentham's pleasure calculus. His radical core was too hot to handle.
  - **Where Bentham is Silent/Dated:**
    - **Power & Consent:** He assumed "consent" was straightforward. He didn't grapple deeply with imbalances of age, authority, or economic coercion. The age of consent debate (21 in Wolfenden, still 16/18 today) would stump him. Is a 19-year-old with a 40-year-old suffering "harm"? Bentham lacks tools for nuanced consent theory.
    - **The Social Harm of Stigma:** He focused on direct legal pain (arrest, prison). He didn't fully price the *social* harm of stigma perpetuated even *after* decriminalization. The law retreating to the bedroom didn't erase disgust—it privatized it.
    - **Identity vs. Act:** Bentham saw "acts." Wolfenden/post-Wolfenden society grappled with *identity*. Bentham's calculus struggles with the utility of liberation vs. mere decriminalization.

  ### For Your Ending: Earn the Breakage
  Your narrator's arrest *after* Wolfenden is the perfect indictment. Bentham's theory:
  1. **Explains why reform was rational** (net pleasure > pain).
  2. **Fails to explain the delay and half-measures** (disgust's irrational weight).
  3. **Offers no solace in the moment of arrest**—because the policeman's disgust *is* real pain to him, and the law still prices it higher than your narrator's pleasure or dignity.

  **Let the theory break where it should:** Have your narrator glimpse Bentham's logic (pleasure as good, disgust as irrational) but feel its impotence against the handcuffs. The neighbour's disgust *won* in that moment. Bentham’s unpublished manuscript becomes a tragic footnote—a future that arrived too late, too partial. The unfinished business (public indecency laws, lingering stigma) is the scar tissue where utility met the real, grubby world of human aversion. Bentham mapped the destination; Wolfenden took a detour; your narrator got left by the roadside. That’s where the novel’s moral power lies—not in rescued theory, but in the friction between radical logic and lived suffering.
