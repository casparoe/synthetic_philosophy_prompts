prompt: |-
  I host a monthly discussion night for a dozen or so people — mostly engineers and tech-adjacent types, read alot of blogs, no formal philosophy — and next month it's my turn, and I want to do procreative beneficence / liberal eugenics. What I need from you is the teaching plan, not the lecture itself. Here's the idea I want them to walk out with: when you're already in the position of choosing which child to bring into existence — which embryo to implant, which donor, whether to try now or later — there's a real moral reason to choose the one you expect to have the best life, and that this is a different animal from the state-coerced eugenics they'll instantly picture, since nobody's being forced and no existing person is being wronged. Plan the session for me. The order the pieces have to go in and why — in particular, does the non-identity stuff have to land before the principle even makes sense, or can I hand-wave it, and if so how far? The one case to build the whole thing on and what it needs going for it; I was going to use the deaf-parents-want-a-deaf-child setup, so tell me if that's a bad carrier and whats better. The misconceptions they'll form, in the order they'll form them, and exactly where in the sequence I head each one off — I'm expecting the Nazi reflex, the "so you have to breed for IQ" slide, and the "if it's only a reason and not a duty then it does no work" move, but there'll be others. Then a single closing question that shows me whether they actually got the structure or just nodded along, and what I should openly refuse to cover at this level. No readings, no names to look up. 800 words max, American English.
reasoning: |-
  Okay, the user hosts a monthly discussion night for engineers and tech-savvy folks without formal philosophy background. They want to teach procreative beneficence and liberal eugenics next month. The key is to make them understand that when choosing which child to bring into existence (like selecting embryos or donors), there's a moral reason to pick the one expected to have the best life. This differs from state-coerced eugenics because it's voluntary and doesn't harm existing people.

  The user needs a teaching plan, not a lecture. They want the session structure, key points order, misconceptions to address, and a closing question to check understanding. They plan to use the deaf-parents case but are open to alternatives. Common misconceptions include Nazi eugenics references, IQ obsession, and confusion between moral reasons versus duties.

  First, I need to structure the session logically. Start with a relatable case to engage them. The deaf-parents scenario is good because it's emotionally charged but clear—parents choosing a deaf embryo over a hearing one. However, some might argue that intentionally choosing deafness is harmful. Maybe a non-disability case could avoid initial resistance. But the user wants this case, so I'll stick with it but handle carefully.

  Next, introduce the non-identity problem. This is crucial because it shows that since different choices create different children, no existing child is harmed by not being born. Without this, the moral reason to choose the best life doesn't make sense. So, this should come early, right after the case study. Use simple terms: "Different choice, different child."

  Then present Savulescu's Principle of Procreative Beneficence. Emphasize it's a reason, not a duty, to avoid the "why not IQ" slide. Clarify that "best life" is contextual and parent-specific, not a state mandate. Contrast with historical eugenics: voluntary vs. forced, no coercion, no harm to existing people.

  Misconceptions will pop up in sequence. When introducing the deaf-parents case, some might react emotionally, thinking it's like Nazi eugenics. Address this immediately by distinguishing voluntary choices from state coercion. Then, when presenting the principle, they might think it requires maximizing IQ. Head this off by stressing that "best life" is based on parents' reasonable judgment, not a single trait. Finally, when explaining it's a reason, not a duty, they might think it's toothless. Counter by comparing it to other moral reasons, like choosing a safer car for kids.

  For the closing question, ask them to design a policy respecting both parental autonomy and the child's best start. This tests if they grasp the balance between moral reason and liberty. Openly refuse to cover population-level eugenics or trait prioritization to keep focus.

  The user's deeper need is to facilitate a clear, engaging discussion without getting bogged down by philosophical jargon or historical baggage. They want participants to grasp the core distinction between personal reproductive choices and oppressive eugenics. Ensuring the structure preempts common pitfalls is key to a successful session.
answer: |-
  Here’s a focused teaching plan targeting your goals, optimized for a 90-minute session with your audience:

  **Session Goal:** Participants grasp that **voluntary embryo/child selection creates a distinct moral reason to choose the life expected to go best**, separate from state eugenics & without wronging specific people.

  ### The Plan (Order Matters)
  1.  **Hook: The Deaf Embryo Case (10 mins)**
      *   **Present:** Deaf parents using IVF have two viable embryos: one likely deaf, one likely hearing. They choose the deaf embryo, wanting a child sharing their culture/language.
      *   **Ask:** "Is this choice *morally problematic*? Why/why not?" (Capture initial reactions: "Harmful," "Unfair to child," "Their right," etc.)
      *   **Why start here?** Intuitive, emotionally resonant, forces confrontation with selection *at creation*. Immediately surfaces the "wronging the child" intuition you need to address next.

  2.  **Core Puzzle: The Non-Identity Problem (15 mins)**
      *   **Frame:** "Who is harmed by this choice? The *deaf child* who exists? Or the *hearing child* who was never created?"
      *   **Explain Simply:** "Different choices create *different people*. The deaf child only exists *because* they were chosen. If the parents chose the hearing embryo, a *different child* would exist. The deaf child isn't worse off *compared to their only alternative* (non-existence)."
      *   **Crucial Point:** "No existing person is made *worse off* by this choice. The hearing child who *could* have existed isn't a person who was *wronged*; they were never born."
      *   **Why now?** Essential foundation. PB makes *no sense* without grasping non-identity. The "no harm to existing person" point directly counters the initial intuitive objection. The deaf case is perfect here *because* it highlights non-identity starkly.

  3.  **Introducing Procreative Beneficence (PB) (15 mins)**
      *   **State PB:** "Given we *are* choosing which possible child to bring into existence (via embryo selection, donor choice, timing), and since no existing child is harmed, **do we have a moral reason to choose the child we reasonably expect to have the best life?**"
      *   **Emphasize:** This is a *reason*, not necessarily an absolute duty. It's about comparative expected well-being *between possible future children* in that specific choice context.
      *   **Contrast Instantly:** "This is *not* about forcing anyone. It's about the morality of choices parents *already face* using existing tech, voluntarily."

  4.  **Defusing Misconceptions (30 mins - Weave into discussion)**
      *   **"Nazi/Slippery Slope to State Eugenics" (Likely after PB intro):**
          *   **Head off:** Explicitly contrast: "PB applies *only* to voluntary choices by prospective parents selecting *which possible child to create*. It prohibits *nothing*. State eugenics involves coercion, targets existing people, aims for population control. PB is about individual welfare at conception. Fundamentally different animals."
      *   **"So you HAVE to select for max IQ/height/etc.?" (Likely when discussing 'best life'):**
          *   **Head off:** Define "best life" broadly: "Not one trait! It's the parents' reasonable expectation of overall well-being – health, abilities, capacity for relationships, enjoyment of life – *in their specific context*. Choosing an embryo with a severe disease vs. none? PB gives a reason to choose the healthy one. Choosing between embryos all likely healthy? PB might give *less* reason, or involve complex trade-offs parents judge." Stress *parental judgment* and *reasonable expectation*.
      *   **"If it's only a 'reason', not a 'duty', it's weak/useless" (Likely when summarizing):**
          *   **Head off:** "Many moral reasons aren't absolute duties but still guide good choices. You have a reason to buy the safer car for your *existing* child, even if not strictly *required*. PB similarly gives a reason to choose the life expected to go better *when creating that child*." Ask: "Does acknowledging this reason make *any* difference to how we might approach these choices, even if other reasons (autonomy, culture) also matter?"
      *   **(Anticipated: "But doesn't this devalue disabled lives?")** Address during Deaf Case/PB: "PB isn't judging the worth of existing people! It's about comparing *expected futures* of *possible* people. Expecting a life *with* a severe impairment to be harder *on average* than one without isn't devaluing people living with impairments now."

  5.  **Consolidation & Liberal Eugenics Label (10 mins)**
      *   Reiterate: "PB arises *because* selection happens at creation (non-identity), applies *only* to voluntary choices, provides a *moral reason* (not a duty) based on expected well-being. **This is 'liberal eugenics' - non-coercive, focused on individual welfare at the point of creation.**"
      *   Contrast again with historical/state eugenics.

  **Closing Question (Test Understanding - 10 mins):**
  > "Imagine a couple using a sperm bank. They have profiles from two donors: one with a strong family history of early-onset dementia, one without. PB suggests a moral reason to prefer the donor without this history. **Does this imply the state should force this choice? Why or why not? How is the *kind* of moral reason PB offers different from a reason that *would* justify state intervention?**"
  *(Tests grasp of voluntary nature, non-coercion, non-identity, and the distinction between a parental moral reason and a state interest)*

  **Openly Refuse to Cover:**
  *   Population-level eugenics or societal "improvement" goals.
  *   Debating *which* specific traits constitute "best life" (IQ, athleticism, etc.) beyond clear health examples.
  *   Deep metaphysical debates about personal identity (beyond the simple non-identity point made).
  *   Comprehensive critiques of Savulescu or other philosophers (keep it principle-focused).

  This sequence builds logically: Start with intuition (Deaf Case), dissolve the core objection (Non-Identity), introduce the principle (PB) on the cleared ground, then systematically disarm the predictable misconceptions by contrasting with state eugenics, clarifying scope, and defending the reality of non-absolute moral reasons. The closing question forces synthesis of the key differentiators.
