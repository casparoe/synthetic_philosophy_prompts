          Counterexample: start with b, then rule 2: replace the b with aa -> "aa", which starts with a.
     - "All derivable strings must have at least one b":
          Counterexample: "aa" (from rule 2 on the axiom) has no b.
     - "The number of a's is even": 
          Counterexample: start with b (0 a's, even). Rule 1: append ab -> "bab": 1 a (odd). 
