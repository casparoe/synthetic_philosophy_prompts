  ### Session Run Sheet for Hofstadter-Style Formal System Activity

  **Total Time:** 75 minutes  
  **Participants:** 16 students (4 teams of 4)  
  **Materials per Team:**  
  - Rules sheet (see handout below)  
  - Index cards (for writing derived strings)  
  - Score sheet (see handout below)  
  - Pen  
  **Shared Materials:** Whiteboard, markers, target cards ("ab" and "abb")  

  ---

  #### **Phase 1: Inside the System — Grinding Derivations (25 min)**  
  **Goal:** Teams work *within* the system to derive strings and target "ab".  

  1. **Introduction (5 min)**  
     - Display axiom ("b") and rules on whiteboard. **Do not mention targets yet.**  
     - *Facilitator script:* "You’ll work in teams to derive new strings from the axiom using the rules. Every new string earns points. Write each *unique* string on an index card with the derivation steps. First team to derive a special target gets a bonus."  
     - Hand out materials. Emphasize: "Track every step. No skipping ahead!"  

  2. **Set First Target (1 min)**  
     - Place "ab" target card on whiteboard.  
     - *Script:* "Your first target: derive this string. Go!"  

  3. **Team Work (15 min)**  
     - Teams derive strings. Circulate to:  
       - Validate new strings (e.g., "aa" from axiom via Rule 2: "b" → "aa").  
       - Record points on score sheets (1 pt/valid new string; 20 pts for first "ab" — though it’s impossible).  
     - Predictable issues:  
       - *Teams fixate on appending "ab" (Rule 1) but hit dead ends.* → Nudge: "Try altering existing letters, not just adding."  
       - *Invalid steps (e.g., replacing "a" with "bb")* → Clarify rules: "Rules only apply to 'b' or 'bb'."  
     - **Key:** Allow struggle. No hints about invariants.  

  4. **Progress Check (4 min)**  
     - *Script:* "Pause! Share one string each team derived."  
     - Teams call out strings (e.g., "aa", "bab", "aaab"). List on whiteboard.  
     - Ask: "Did anyone get 'ab'? Why might it be tricky?"  

  ---

  #### **Phase 2: Stepping Out — The First Insight (20 min)**  
  **Goal:** Shift to reasoning *about* the system.  

  5. **Introduce Meta-Task (3 min)**  
     - *Script:* "New challenge: Propose a *test* that any derivable string must pass. Example: 'Must contain at least one b'. Score: 10 pts if your test explains why 'ab' is impossible, 5 pts for any valid pattern."  
     - **Crucial:** Avoid terms like "invariant." Say "test" or "pattern."  

  6. **Team Brainstorming (7 min)**  
     - Teams discuss patterns (e.g., "Strings never start with 'a'?"). Write tests on index cards.  
     - Predictable responses:  
       - *"All strings have even length!"* → Counterexample: "b" (length 1).  
       - *"Always more 'a's than 'b's!"* → Counterexample: "b" (0 a’s).  
     - Circulate, push deeper: "Does your test hold for *every* string on the board?"  

  7. **Test Sharing and Counterexample Hunt (10 min)**  
     - Teams share tests. Write on whiteboard (e.g., "Weight = (#a) + 2(#b) is always even").  
     - *Script:* "Can another team find a derived string that *fails* this test?"  
       - If counterexample found (e.g., "aa": weight=2, even → passes), test is invalid.  
       - If none, ask: "Does it *prove* 'ab’ is impossible? Check 'ab'!"  
     - **Reveal weight argument ONLY if stuck:**  
       - "Weight of axiom 'b' is 2. Rules change weight by multiples of 3. 'ab' has weight 3 → fails test."  
     - Award points for valid tests.  

  ---

  #### **Phase 3: The Trap — Second Target (20 min)**  
  **Goal:** Teams discover that necessary ≠ sufficient.  

  8. **Set Second Target (2 min)**  
     - Place "abb" target card on whiteboard.  
     - *Script:* "New target: 'abb'. Weight test says it *should* be derivable (weight=5 ≡ 2 mod 3). 30-pt bonus for first team to derive it!"  
     - Adjust scoring: 2 pts/new string.  

  9. **Team Work (10 min)**  
     - Teams attempt to derive "abb." Circulate.  
     - Predictable responses:  
       - *Confidence from weight test* → "We just need more steps!"  
       - *Rule 3 misuse* (e.g., trying to replace "bb" in "bab" → "aa" not "abb").  
     - **Trap:** Weight test passes, but derivation fails.  

  10. **Reveal the Hidden Obstacle (8 min)**  
      - *Script:* "Did anyone get 'abb'? Why not?"  
      - Teams propose new tests (e.g., "No two 'b's are adjacent!").  
      - *If missed:* "Look at all derived strings. Do any have 'bb'?" (None do.)  
      - **Argument:**  
        - "Axiom 'b' has no 'bb'. Rules:  
          - Rule 1: Appends 'ab' → if prior string ends with 'b', new end is '...b' + 'a' + 'b' → no 'bb'.  
          - Rule 2: Replaces 'b' with 'aa' → breaks potential 'bb' pairs.  
          - Rule 3: Removes 'bb' but can’t create it (since it never exists).  
          → 'abb' has 'bb', so it’s impossible."  
      - Award points for correct pattern spotting.  

  ---

  #### **Phase 4: Debrief and Conceptual Bridge (10 min)**  
  **Goal:** Map the experience to philosophy of mind.  

  11. **Reflection (5 min)**  
      - *Script:* "Today you did two kinds of work:  
        1. *Inside the system:* Grinding steps (like a machine following rules).  
        2. *Outside the system:* Spotting patterns no single step reveals (like a mathematician).  
        The 'weight test' and 'no bb' test are tools you built *about* the system."  
      - Contrast: "Inside: 'I appended ab.' Outside: 'No rule can create bb.'"  

  12. **Deeper Point (5 min)**  
      - *Script:* "But wait—wasn’t your 'outside' reasoning just more symbol-shuffling? Could we formalize *it* in a bigger system?"  
        → "Yes! But that’s the insight: Each time we step out, we *create* a new system. Gödel showed this hierarchy never ends."  
      - Connect to philosophy of mind: "When you *realized* the weight test, was that 'computation' or 'insight'? Hofstadter argues it’s both."  

  13. **Closing (1 min)**  
      - Collect score sheets. Announce winners next class.  
      - *Final note:* "This activity *shows* the inside/outside shift but can’t *explain* its implications. Next lecture: How Gödel formalized this duality."  

  ---

  ### Participant Handouts  
  **Rules Sheet**  
  ```  
  Formal System Rules  
  - Alphabet: Only the letters **a** and **b**.  
  - Start: The string **b**.  
  - Rules:  
    1. Append **ab** to the end of any string you have.  
    2. Replace any single **b** with **aa**.  
    3. Replace any **bb** with **a**.  
  ```  

  **Score Sheet**  
  ```  
  Team: __________  

  PHASE 1: Derive new strings (1 pt per new string)  
  | String | Derivation Steps | Points |  
  |--------|------------------|--------|  
  | b      | (axiom)          |        |  
  | _______| ________________ | ______ |  
  | _______| ________________ | ______ |  
  Bonus: First to "ab" (20 pts) → ⬜  

  PHASE 2: Propose a test (5-10 pts)  
  Our test: _______________________________  
  Did it prove "ab" impossible? ⬜ Yes ⬜ No  

  PHASE 3: Derive "abb" (2 pts per new string)  
  | String | Derivation Steps | Points |  
  |--------|------------------|--------|  
  | _______| ________________ | ______ |  
  | _______| ________________ | ______ |  
  Bonus: First to "abb" (30 pts) → ⬜  

  PHASE 3: Why can’t we get "abb"? (5-10 pts)  
  Our observation: _________________________  

  TOTAL POINTS: _______  
  ```  

  ---

  ### Facilitator’s Key  
  **Core Arguments:**  
  1. **Why "ab" is impossible:**  
     - Weight `W = (#a) + 2(#b)`.  
     - Axiom `b`: `W = 0 + 2(1) = 2 ≡ 2 mod 3`.  
     - Rule 1: Append `ab` → `ΔW = 1 + 2(1) = 3 ≡ 0 mod 3`.  
     - Rule 2: Replace `b` with `aa` → `ΔW = 2(1) - 2 = 0` (lose `b`: `-2`, gain `aa`: `+2`).  
     - Rule 3: Replace `bb` with `a` → `ΔW = 1 - 4 = -3 ≡ 0 mod 3` (lose `bb`: `-4`, gain `a`: `+1`).  
     - ∴ All derivable strings have `W ≡ 2 mod 3`.  
     - `ab`: `W = 1 + 2(1) = 3 ≡ 0 mod 3` → impossible.  

  2. **Why "abb" is impossible:**  
     - `W = 1 + 2(2) = 5 ≡ 2 mod 3` → passes weight test.  
     - But no derivable string contains `bb`:  
       - Axiom `b`: no `bb`.  
       - Rule 1: Appends `ab`. If prior string ends with `b`, new string ends with `...b + a + b` → `...bab` (no `bb`).  
       - Rule 2: Replaces `b` with `aa`. Breaks any potential `bb` (since `b` is removed).  
       - Rule 3: Removes `bb` but can’t create it (as no prior `bb` exists).  
     - `abb` contains `bb` → impossible.  

  **Plausible False Generalizations & Counterexamples:**  
  - *"All strings start with b!"* → Counter: `aa` (from `b` → `aa` via Rule 2).  
  - *"Total letters always odd!"* → Counter: `aa` (even).  
  - *"More b’s than a’s!"* → Counter: `aa` (zero b’s).  

  **Predictable Issues & Fixes:**  
  - **Teams derive slowly:** Pre-cook short chains (e.g., `b` → `aa` (Rule 2); `b` → `bab` (Rule 1)) to jumpstart them.  
  - **Weight test not found:** If no team spots it by Phase 2, Step 7, calculate `W` for 3–4 strings on the board to hint.  
  - **"abb" derivation attempts:** Expect claims like "Replace `bb` in `bb`" → Remind: "`bb` isn’t derivable to start with!"  

  **Limitations of Activity:**  
  - Does **not** teach Gödel’s proof or the specifics of Peano arithmetic.  
  - Leaves implicit *why* stepping out feels "meta" — you’ll contextualize this in lectures on formalization (e.g., "Hilbert’s program").  
  - Does **not** resolve if "outside" reasoning is truly "outside" — that’s next week’s discussion on mechanistic cognition vs. insight.  

  **Honest Note:** The "aha" moment (when a team *sees* the weight test) is fragile. If rushed, it feels like a trick. Protect the struggle!  

  ---  
  This session creates the experiential foundation — you’ll build the theoretical superstructure in subsequent lectures.
