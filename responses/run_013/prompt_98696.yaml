prompt: |-
  I'm a fourth-year phil PhD student and I've been roped into leading our department's interdisiplinary reading group next week -- mostly historians and lit people, no philosophy past a survey course -- on the wrong kind of reasons problem. Ninety minutes, a whiteboard, and I want a plan for the explanation, not the explanation itself. What has to come first for the question to even make sense to them (do I need the fitting-attitude picture of value on the board before the problem means anything, or does the problem itself do the motivating?), which single example should carry the whole session -- and if not the usual one about a demon threatening you unless you believe something, then why not, and what instead -- the misconceptions they'll walk in with or pick up along the way (my guesses: that "wrong kind" just means "immoral", and that it's the same thing as pragmatic vs. epistemic reasons), exactly where in the sequence I should head each one off, and one question at the end that tells me whether they've actually got the distinction rather than just nodding along. Tell me what to openly refuse to cover at this level, and keep what's actually settled apart from what people working on this genuinely fight about -- I dont want to hand them one camp's line dressed up as the consensus.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a fourth-year PhD student in philosophy tasked with leading an interdisciplinary reading group on the "wrong kind of reasons" (WKR) problem. The audience includes historians and literature scholars with minimal philosophy background. The user needs a detailed plan for a 90-minute session using a whiteboard, focusing on structure rather than content. They want to know how to make the problem understandable, which example to use, common misconceptions to address, and how to assess comprehension.

  First, I need to ensure the foundational concepts are clear without overwhelming the group. The fitting-attitude (FA) analysis of value is crucial here because WKR problems arise when we try to apply reasons to attitudes. Without establishing FA, the distinction between right and wrong kinds of reasons might not make sense. So, starting with FA as a scaffold seems necessary. 

  Next, choosing the right example is key. The user mentions the demon example but is hesitant. I recall that demon cases can confuse beginners because the irrationality isn't always obvious. Instead, admiration for the demon might be a better entry point. It's visceral—people naturally feel that admiring a bad person is inappropriate, even if there's a reason to do so. This example can highlight the distinction between reasons that make an attitude fitting versus those that are merely instrumental.

  Misconceptions are another concern. The user pointed out that "wrong kind" might be mistaken as "immoral," and conflating pragmatic vs. epistemic reasons with WKR. Addressing these early is important. I should clarify that WKR is about the nature of reasons for attitudes, not morality. Also, distinguishing pragmatic reasons (which are often WKR) from epistemic ones helps, but it's not the same as the WKR problem itself.

  The structure needs to build step by step. Begin with FA to set up value and fitting attitudes. Then introduce an example that creates tension—admiring the demon. Use this to present the problem: why isn't a pragmatic reason making admiration fitting? Then explain the WKR distinction. Later, compare with belief cases to show the broader application.

  For assessment, a hypothetical scenario like a dictator demanding belief could work. Ask why the reason doesn't make belief true, highlighting the difference between causing belief and justifying it. This tests if they grasp that reasons for attitudes must relate to the attitude's correctness conditions.

  I should avoid diving into solutions like the buck-passing account or reductionism. Mentioning camps like Schroeder, D'Arms and Jacobson, or Way briefly is okay, but don't present any as consensus. Also, skip higher-order attitudes and state-based solutions to keep it manageable.

  Timing is tight. Allocate time for each section: FA setup (15 min), example and problem (25 min), WKR distinction (10 min), belief parallel (15 min), misconceptions (10 min), and wrap-up (15 min). Include Q&A within sections to keep engagement.

  The user's deeper needs include wanting the group to genuinely understand the problem without getting lost in jargon. They need clarity, relatable examples, and avoidance of philosophical traps. Emphasizing the meta-question—why philosophers find this puzzle important—can help them appreciate the conceptual challenge beyond just academic exercise.
answer: |-
  Here’s a battle-tested plan for your 90-minute session, prioritizing conceptual scaffolding, avoiding jargon traps, and targeting genuine comprehension:

  **Core Objective:** Make them grasp *why* the WKR problem is a *distinctive philosophical puzzle* about reasons for attitudes, not just "immorality" or "pragmatism."

  **Openly Refuse to Cover:**
  1.  **Solutions:** No Schroeder (Reducing to State-Based Reasons), no Hierchical/Two-Tier accounts, no D’Arms & Jacobson (Sentimentalism), no Way (Reasons as Explanations). Say: "Today is about seeing the *problem* clearly. Solving it is where the bloodiest fights happen."
  2.  **Meta-Ethical Debates:** Don't tie FA *too* tightly to realism/anti-realism. Present FA as a useful *framework* for understanding value-talk.
  3.  **Technical Jargon:** Avoid "constitutivism," "buck-passing" (beyond basic FA), "normativity," "pro tanto reasons." Use plain English equivalents.

  **What's Settled vs. Contested:**
  *   **Settled (for this session):** The WKR problem *exists* and poses a challenge for FA and similar accounts of normative reasons for attitudes. There *is* a distinction to be drawn (even if defining it perfectly is hard).
  *   **Contested (mention briefly):** *Why* it's a problem (threat to FA? deeper issue about reasons?), *how* to draw the RKR/WKR line, *whether* FA can be saved, and *what* the solution is.

  **The Plan (Whiteboard Central!):**

  1.  **Ground Zero: Value & Fitting Attitudes (FA) (15 mins) - *ESSENTIAL STARTER***
      *   **Whiteboard:** Draw a big "VALUE" bubble. Arrow to "FITTING ATTITUDE". Arrow from "FITTING ATTITUDE" to "REASONS".
      *   **Explain:** "We often talk about things being good, admirable, fearsome, disgusting. One influential way (FA) to understand this is: Something is Valuable (e.g., admirable) *iff* it is *fitting* to have a certain *attitude* towards it (e.g., admiration). What makes an attitude *fitting*? Having *reasons* for that attitude."
      *   **Key Point:** FA links value -> fitting attitude -> reasons. Reasons justify the attitude *as a response to the object's properties*.
      *   **Q/A Check:** "If something is genuinely admirable, what kind of reason do we have for admiring it?" (Aim for: A reason based on its admirable features).

  2.  **Introduce the Problem: The Demon of Admiration (25 mins) - *CARRYING EXAMPLE***
      *   **Why NOT the Belief Demon?** It conflates epistemic/pragmatic too easily for beginners. Belief's "correctness" (truth) is *so* intuitive it overshadows the *attitudinal* puzzle. Admiration is clearer on the FA link and the visceral "wrongness."
      *   **The Scenario:**
          *   Evil Demon appears: "Admire me! If you don't, I'll torture everyone you love. If you *do* sincerely admire me, I'll give everyone cake."
          *   **Whiteboard:** "Reason to Admire Demon: Avoid torture / Get cake."
      *   **The Tension:**
          *   "Do you have a *reason* to admire the demon? (Yes! A very strong one!)"
          *   "Is it *fitting* to admire the demon? (No! He's vile, not admirable!)"
          *   "According to FA: If it's fitting to admire him, he should be admirable. But he's NOT admirable. Yet there *is* a reason!"
          *   **Whiteboard:** BIG QUESTION MARK between "Reason" and "Fitting?".
      *   **The Problem Statement:** "We have a powerful *reason* to have an attitude (admiration), but that reason doesn't seem to make the attitude *fitting*, and doesn't seem to make the demon *admirable*. This reason seems like the *wrong kind* of reason for determining admirability or fitting admiration."

  3.  **Define RKR vs. WKR (10 mins)**
      *   **Whiteboard:** Two Columns: RIGHT KIND OF REASONS (RKR) | WRONG KIND OF REASONS (WKR)
      *   **RKR:** "Reasons that *make* the attitude fitting. They bear on whether the object *actually has the property* the attitude is a response to. (Why the Nobel winner is admirable: Their courage, intelligence, etc. These *make* admiration fitting)."
      *   **WKR:** "Reasons that give you an incentive *to get yourself* to have the attitude, but don't show the attitude is fitting or the object has the relevant value. (Why 'admire' the demon: Avoid torture). They are *about the consequences of having the attitude*, not about the object's properties justifying the attitude itself."
      *   **Label the Demon:** "Avoid Torture" under WKR.

  4.  **Parallel Case: Belief (15 mins) - *Reinforce & Generalize***
      *   **Scenario:** Demon: "Believe that 2+2=5! If you do, I cure cancer. If you don't, I cause plague."
      *   **Whiteboard:** "Reason to Believe 2+2=5: Cure cancer / Avoid plague."
      *   **Q/A:** "Is this a *good reason* to *get yourself* to believe it? (Maybe, pragmatically). Does this reason make the belief *true* or *justified*? (No!). Is it the *right kind* of reason for making a belief epistemically justified? (No! It's WKR for belief justification)."
      *   **Connect:** "Just like with admiration: Pragmatic incentives (WKR) vs. Truth-related evidence (RKR). The problem isn't unique to value/emotions!"

  5.  **Slay Misconceptions & Pitfalls (10 mins) - *HEAD THEM OFF HERE***
      *   **Misconception 1: "WKR = Immoral Reasons."**
          *   **Counter:** "The demon's reason (avoid torture) is *morally good*! But it's still WKR for admiration. WKR vs RKR is about the *role* of the reason in justifying the *attitude*, not its moral quality." Whiteboard: "Moral Quality ≠ RKR/WKR Status".
      *   **Misconception 2: "WKR = Pragmatic, RKR = Epistemic (just like belief)."**
          *   **Counter:** "Partly right, but the distinction runs *deeper* and is *broader*. It applies to *any* attitude with a 'correctness condition': admiration (fittingness), belief (truth), fear (fearsomeness), intention (???). Pragmatic reasons are *often* WKR, but RKR are defined by their connection to the *attitude's own standard*, not *just* by being 'epistemic'." Whiteboard: "Broader than Pragmatic/Epistemic: About Correctness Conditions".
      *   **Pitfall:** "Don't confuse the *strength* of the reason (huge!) with its *kind* (wrong!). WKR can be overwhelming!"

  6.  **Wrap-Up & The Big Why (10 mins)**
      *   **Recap:** FA Picture + Demon Example + RKR/WKR Columns + Belief Parallel.
      *   **The Stakes:** "This problem challenges whether FA (or similar accounts) can cleanly analyze value *just* in terms of reasons for attitudes. If reasons for attitudes include WKR, and WKR don't track value, how do we isolate the *value-tracking* reasons (RKR)?"
      *   **The Philosophical Puzzle:** "What *exactly* makes a reason the 'right kind'? How do we formally distinguish RKR from WKR? *This* is the core puzzle generating the literature. FA makes the problem vivid, but the puzzle exists for any account of reasons for attitudes with standards."
      *   **The Meta-Question:** "Why do philosophers care? It forces us to think deeply about the nature of reasons, the connection between reasons and the attitudes they are for, and how we understand value and rationality."

  **The Comprehension Test Question (At the End):**
  > **"Imagine a powerful but boring dictator. He says, 'You must *genuinely believe* that I am the most fascinating person in history. If you do, I will fund libraries. If you don't, I will burn them.' You have a strong reason to make yourself believe he's fascinating. Is this reason the *right kind* of reason to support the *truth* of the belief 'The dictator is fascinating'? Why or why not? What *would* be a right kind reason for that belief?"**

  *   **Why it works:** Tests if they:
      1.  Apply the distinction to a new attitude (belief).
      2.  Recognize the reason (fund libraries) as WKR (incentive based on consequences).
      3.  Understand that WKR don't bear on the attitude's correctness condition (truth).
      4.  Can articulate what an RKR *would* be (evidence of actual fascinating deeds/qualities).
      5.  Avoid conflating pragmatic benefit with epistemic justification/truth.

  **Key Teaching Moves:**
  *   **Relentless Whiteboard:** Keep the core diagram (FA + RKR/WKR columns) visible the *whole time*. Add key points/scenarios around it.
  *   **Socratic Lite:** Pose the tension points as questions. "Do you have a reason? Is it fitting? Why the mismatch?"
  *   **Emphasize the "Puzzle":** Frame it as an intellectual knot needing untying, not just a doctrine.
  *   **Validate Intuitions:** "Yes, you *do* have a reason! But...". "Yes, it *seems* crazy to admire him! And...".
  *   **Name the Misconceptions Explicitly:** "You might think X, but here's why that's not quite it..."
  *   **Pace for Processing:** Build slowly. Allow silence after posing key questions. Check in: "Does this tension make sense?"

  This plan gives them the necessary scaffolding (FA), a powerful and clear example (Admiration Demon), addresses critical misconceptions head-on, connects to a parallel case (Belief), avoids solution quagmires, and provides a clear test for understanding. Good luck – it's a fun one to teach!
