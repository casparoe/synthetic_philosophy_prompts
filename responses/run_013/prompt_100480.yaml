  Below is a decision tree designed to clarify positions on the Identity of Indiscernibles (PII). Start at the root and answer each question based on your intuitive commitments about the cases described. The questions avoid direct reference to PII or philosophical jargon, focusing on concrete scenarios instead. Each leaf position includes its "most awkward commitment"—the counterintuitive or challenging consequence defenders must accept.

  ---

  ### **Decision Tree: Identity of Indiscernibles**

  **Node 1: Initial Commitment**  
  Is a world with two perfectly identical iron spheres (mirrored in empty space, no observers) possible?  
  - **Yes** → Go to Node 2  
  - **No** → Go to Node 3  

  **Node 2 (Two-sphere world possible)**  
  If the two spheres swap positions symmetrically (e.g., sphere A moves to B's location and vice versa), is the resulting world:  
  - **The same world** (nothing genuinely changed) → Go to Node 4  
  - **A different world** (something real is different) → Go to Node 5  

  **Node 3 (Two-sphere world impossible)**  
  In a world with three identical spheres in a straight line (equally spaced), are the two end spheres discernible?  
  - **Yes** (e.g., by position, relations, or directionality) → Go to Node 6  
  - **No** (they share all properties) → Go to Node 7  

  **Node 4 (Swap = same world)**  
  In the two-sphere world, are the spheres discernible by any property (e.g., "left of midpoint," "causes effect X")?  
  - **Yes** → *Unoccupied* (inconsistent; symmetric setup rules out discernible properties)  
    - *Why unoccupied?* Defenders of symmetry concede indiscernibility here. Saying "yes" likely misapplies relational properties.  
  - **No** → Go to Node 8  

  **Node 5 (Swap = different world)**  
  In our world, can two identical electrons in an atom be discerned?  
  - **Yes** → **Leaf: Haecceitism**  
    - *Awkward commitment:* Primitive identities (haecceities) are unknowable and undetectable, even in principle.  
  - **No** → **Leaf: Haecceitism** (same as above; electrons reinforce primitive distinctness).  

  **Node 6 (End spheres discernible)**  
  Is PII true in all possible worlds (e.g., even in symmetric or alien worlds)?  
  - **Yes** → **Leaf: Weak PII**  
    - *Awkward commitment:* Trivial if allowing impure properties (e.g., "identical to A"); non-trivial versions struggle with quantum indiscernibles.  
  - **No** → **Leaf: Contingent PII**  
    - *Awkward commitment:* Must explain why PII holds in our asymmetric world but fails in symmetric ones (e.g., "our world lacks symmetries").  

  **Node 7 (End spheres indiscernible)**  
  In a symmetric empty space (no matter/fields), are spacetime points discernible?  
  - **Yes** → *Unoccupied* (inconsistent; symmetric points lack discerning properties).  
    - *Why unoccupied?* Accepting indiscernible spheres but discernible points violates uniformity.  
  - **No** → **Leaf: Structuralism about Spacetime**  
    - *Awkward commitment:* Spacetime points aren't fundamental—must explain geometry without "locations."  

  **Node 8 (Spheres indiscernible; swap = same)**  
  In a symmetric empty space, are distinct spacetime points real?  
  - **Yes** → *Unoccupied* (incoherent with Node 4; distinct indiscernibles require non-qualitative grounds).  
    - *Why unoccupied?* Anti-haecceitists reject primitive identity, so indiscernible points need qualitative grounding (which symmetry forbids).  
  - **No** → **Leaf: Bundle Theory**  
    - *Awkward commitment:* Objects are mere bundles of properties—no "bearer" of properties, making individuation fragile.  

  ---

  ### **Leaf Positions Summary**
  1. **Strong PII**: Not directly reached; covered under Weak/Contingent PII.  
  2. **Weak PII** (Node 6-Yes): PII holds universally with impure/relational properties allowed.  
  3. **Contingent PII** (Node 6-No): PII holds in some worlds (like ours) but not symmetric ones.  
  4. **Haecceitism** (Node 5): Objects have primitive identities beyond properties.  
  5. **Bundle Theory** (Node 8-No): Objects are collections of properties; identity reduces to qualitative overlap.  
  6. **Structuralism about Spacetime** (Node 7-No): Spacetime points derive from relational structure.  
  7. **Unoccupied Positions** (Nodes 4-Yes, 7-Yes, 8-Yes): Result from inconsistent commitments (e.g., affirming indiscernibility while demanding discernibles).  

  ---

  ### **Tree Notes**
  - **Size**: 8 nodes (1 root + 7 branches), 6 leaves + 3 unoccupied positions.  
  - **Unseparated Leaves**:  
    - *Strong PII* isn't isolated (folded into Weak PII/Contingent PII distinctions) since proponents often dispute "pure properties."  
    - *Bundle Theory* and *Structuralism* overlap but diverge on spacetime (Node 8 forces the split).  
  - **Key Clarifications**:  
    - **Pure vs. Impure properties**: Pure = intrinsic (e.g., mass); Impure = relational (e.g., "2 meters from another sphere").  
    - **Weak vs. Strong PII**: Weak allows impure properties; Strong requires pure properties (the tree bypasses this by starting from cases).  
    - **Modality**: Contingent PII (Node 6) vs. necessary (Node 6-Yes) vs. rejected (Nodes 4–5, 7–8).  

