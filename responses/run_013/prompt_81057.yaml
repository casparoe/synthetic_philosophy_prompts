prompt: |-
  I chair the research-integrity committee at a medical school, and Thursday's case has us split. A faculty member's paper states in its abstract that "in our cohort, the exposure was associated with roughly a halving of the risk of the outcome." The sentence is true as written: the unadjusted rate ratio was 0.51. What the abstract omits is that the association disappears once the model adjusts for the confounder that the paper's own discussion names as the leading one, and that the adjusted estimate sits in a supplementary table. A reader who tried to reproduce the number filed the complaint; she argues that no ordinary reader of that sentence would take it to mean the association survives adjustment. The author answers that he reported what the cohort showed, never used the word "adjusted," and put everything in the supplement. Our policy covers "falsification" and "misrepresentation of results," but defines both in terms of false statements and altered data, and says nothing about statements that are true yet leave a false impression. A colleague who teaches philosophy of language tells me the crux is the gap between what the sentence says and what the author meant by it, and that this gap bears on whether we can attribute intent at all.

  Please draft the opinion I will circulate: a recommendation we can vote on, the reasoning behind it, and an honest account of the strongest argument for the other outcome. Two proposals for a standing rule are also before us, and I want your assessment of each, including what it would imply for this case and for the next one on our docket, in which a press release said a compound "has been tested in humans" when the only human study was a microdose safety run in eight healthy volunteers: (1) a statement misrepresents only if the author could not have added a clarifying clause, such as "though not after adjustment for X," without contradicting what he already wrote; (2) the question is instead whether the audience the statement actually reached, rather than the specialist reader, would reasonably take the false impression from it, whatever the author privately intended. Tell me which rule, if either, we should adopt, and what adopting it commits us to.
reasoning: |-
  Okay, the user chairs a research integrity committee at a medical school and is dealing with a tricky case. They need to draft an opinion for a vote, including reasoning and the strongest counterargument. Plus, there are two proposed standing rules to evaluate.

  First, let's understand the case. The faculty member's abstract states an association between exposure and a halved risk, which is true based on an unadjusted rate ratio of 0.51. However, the adjusted analysis, which accounts for a key confounder mentioned in the discussion, shows no association. This adjusted result is only in the supplement. The complainant argues that the abstract leaves a false impression, implying the association holds after adjustment. The author defends by saying he never used the word "adjusted" and included everything in the supplement. The committee is split because their policy covers falsification and misrepresentation but doesn't address technically true statements that are misleading.

  The user also needs to assess two proposed standing rules and apply them to this case and another upcoming one about a press release claiming a compound was "tested in humans" based only on a microdose study in eight volunteers.

  Breaking this down, the key issues are:
  1. Whether the abstract statement is misleading despite being technically true.
  2. Whether the author's intent matters.
  3. Which standing rule would be better for handling such cases.

  For the opinion draft, the recommendation should be that the statement misrepresents results. The reasoning would focus on the context of medical research where adjusted analyses are standard for causal claims. Omitting that the association disappears after adjustment, especially when the confounder is highlighted in the discussion, creates a false impression. The strongest counterargument is the author's defense: the statement is literally true, and the full data is available in the supplement. Intent is hard to prove, and the author didn't explicitly claim adjustment.

  Regarding the standing rules:
  - Rule 1 focuses on whether adding a clarifying clause would contradict the statement. In this case, adding "though not after adjustment" wouldn't contradict the original statement, so it would imply misrepresentation. For the press release case, adding "only in a microdose safety study" wouldn't contradict "tested in humans," so it would also be misrepresentation.
  - Rule 2 considers the audience's interpretation. The abstract's audience includes non-specialists who might not check supplements, leading them to believe the association is robust. The press release's audience would likely overestimate the extent of human testing.

  Rule 2 seems more appropriate because it prioritizes preventing misinformation based on likely audience interpretation rather than technicalities about what could be added without contradiction.

  The draft opinion should structure the recommendation clearly, explain the reasoning, acknowledge the counterargument, and advise adopting Rule 2. It should also clarify how each rule applies to both cases to guide future decisions.
answer: |-
  ## Committee Opinion: Case #2024-07 (Abstract Omission)  

  **Recommendation:** By a vote of [X] to [Y], the committee finds that the abstract statement constitutes a *misrepresentation of results* under our research integrity policy. The author must issue a correction to the journal adding the clarifying phrase "in unadjusted analysis" to the abstract and ensure the supplement is explicitly referenced therein.  

  ### Reasoning:  
  1. **Literal Truth vs. Reasonable Interpretation:** While the sentence "the exposure was associated with roughly a halving of the risk" is factually accurate for the unadjusted analysis, it omits material context known to the author and central to the paper’s own conclusions. In epidemiological research, unadjusted associations are routinely treated as provisional until confounders are addressed. The discussion section explicitly identifies the confounder that nullifies the association, and the adjusted result is buried in a supplement. This creates a materially false impression that the association is robust—a conclusion the data do not support.  

  2. **Professional Standards:** The ICMJE guidelines state that abstracts must provide "an accurate summary" of findings and avoid "emphasis on the most positive results" without qualification. By highlighting only the unadjusted result—which the paper itself undermines—the abstract violates this standard. A reader relying solely on the abstract (as many clinicians, policymakers, or journalists do) would reasonably infer a clinically meaningful effect, distorting the study’s actual contribution.  

  3. **Intent and Accountability:** We need not prove malicious intent to find misrepresentation. The author’s awareness of the confounder’s significance (per the discussion) and strategic placement of the null result in the supplement shows negligence toward transparency. Research integrity requires proactive clarity, not technical adherence to literal truth.  

  ### Strongest Counterargument:  
  The author correctly notes that the statement is factually true, the word "adjusted" was never used, and the full data were provided in the supplement. Arguably, specialists know to consult supplements and adjusted models. The complaint conflates "incomplete reporting" (which may warrant correction) with "misrepresentation" (which implies deception). Absent a false statement, discipline sets a precedent that could chill scientific discourse by penalizing selective emphasis—a common practice in abstracts due to word limits.  

  ---

  ### Assessment of Proposed Standing Rules:  
  **Rule 1:** *"A statement misrepresents only if the author could not have added a clarifying clause without contradicting what they wrote."*  
  - **Implications for this case:** Adding "though not after adjustment for [Confounder]" would *not* contradict the original sentence. Thus, this rule would classify the abstract as misrepresentation.  
  - **Implications for the press release case:** Adding "only in a microdose safety study of 8 volunteers" would *not* contradict "has been tested in humans." The rule would deem the press release misleading.  
  - **Assessment:** Overly narrow. Allows "true but deceptive" statements if the author omits context deliberately. Fails to address real-world interpretation.  

  **Rule 2:** *"The question is whether the actual audience would reasonably take a false impression from it, regardless of intent."*  
  - **Implications for this case:** The abstract’s audience (clinicians, journalists) would reasonably infer a clinically significant, confounder-resistant effect. The null adjusted result in the supplement is insufficient to correct this impression. Thus, misrepresentation occurs.  
  - **Implications for the press release case:** The public/potential investors hearing "tested in humans" would reasonably infer therapeutic dosing or efficacy trials—not a microdose safety study. This is a false impression.  
  - **Assessment:** More protective of research integrity. Aligns with FTC/FDA standards for truthful messaging (e.g., "substantiation" and "net impression" doctrines). Prioritizes real-world impact over semantic technicalities.  

  **Committee Guidance:** Adopt **Rule 2**. It best reflects our duty to prevent misleading communication, regardless of intent or literal truth. This commits us to:  
  1. Evaluating statements from the perspective of the *least specialized but reasonable audience* (e.g., clinicians, journalists, or patients).  
  2. Requiring proactive disclosure of material limitations (e.g., unadjusted analyses, small pilot studies) in prominent text (not supplements alone).  
  3. Applying this consistently: In the press release case, Rule 2 would require retraction and correction to specify the study’s limited scope.  

  **Vote:** [ ] Adopt Rule 1 | [X] Adopt Rule 2 | [ ] Adopt neither  

  ---  
  **Final Note:** Research integrity transcends legalistic definitions. Abstracts and press releases are gateways to knowledge; omitting caveats that reverse the narrative betrays public trust. Rule 2 empowers us to uphold transparency while acknowledging that science’s social impact hinges on accurate interpretation—not just impeccable syntax.  

  Respectfully submitted,  
  [Your Name], Chair  
  Research Integrity Committee
