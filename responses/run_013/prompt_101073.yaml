  I'm a backend engineer who never took a philosophy class, and my old mentor is retiring after like thirty years of building proof assistants and refusing to touch classical logic. The dinner is next month: half the room are type theorists who'll catch every inside joke, half are his family who think "intuitionistic" is a digestive problem. I want to give a five-minute toast that actually takes his constructivism seriously — not just say he was brilliant, but show it, the way he'd insist you can't prove something exists without producing the thing, and you can't get to A from not-not-A. So no either/or lines about whether he was the best or the most stubborn, and no unearned claims about his legacy. Can you write it? Please keep it as continuous prose, no headings, bullet points, bold text, or tables, the way you'd write an email.
