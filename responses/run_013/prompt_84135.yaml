prompt: |-
  I'm a doctoral candidate in religious studies, and next month I have to cover one ninety-minute session in a large undergraduate course on the Bible that my supervisor normally teaches; the students have read the four Gospels in translation and nothing else. They arrive mixed: a few are devout and will hear any claim about how the tradition formed as an attack, a few are certain in advance that it is all fiction and will hear the same claims as vindication, and the majority are there for a distribution requirement and cannot yet say what a source is, what a redaction is, or why the difference would matter. The session is on the criteria of authenticity — embarrassment, dissimilarity, multiple attestation, coherence, and the rest of that battery — and what I want them to leave with is not the list but a working sense of what such a criterion can and cannot establish. So please do not explain the criteria to me; I know them. Plan the session instead: the order the ideas have to come in for the criteria to arrive as answers to a question the students already feel, with a note on what each step depends on; the single concrete case that should carry the whole ninety minutes; and the misconceptions they will form, in the order they will form them, with the precise point in the sequence where each one should be headed off.

  For the case, I had planned to build around the baptism of Jesus by John, since that is the example I was taught to use for embarrassment, but I am not attached to it and suspect it is too familiar — a good number of them will have heard that the baptism is awkward before they walk in. Tell me whether to keep it or replace it, and say what the carrying case must have and what it must lack: it needs to be narratable in about a minute without my handing out a text, runnable through at least three of the criteria with different verdicts, ideally one where the witnesses look independent until you look closely at them, and it should let the students watch a criterion fail as well as succeed, because a case that only ever confirms teaches the wrong lesson. A colleague of mine who works on Second Temple Judaism has proposed to me a test she calls the criterion of unassimilated residue: a unit of tradition is likely to be older than the redaction that carries it when the later tradition preserves it while visibly struggling with it — softening it, hedging it, or explaining it away — so that the strain of keeping it is itself the evidence. I would like to use her proposal as the hinge of the session, but I do not want to smuggle in a criterion that is embarrassment with a redaction-critical coat of paint. Where in the sequence should it come, what does it actually add that the older criteria do not, and what misconception does it invite that I will have to head off?

  Finally, give me the one question I can put to the room in the last ten minutes that would show whether they have the idea rather than the vocabulary — something that cannot be answered by reciting a definition — and tell me what I should openly decline to do in ninety minutes and say out loud that I am declining, since I am not going to settle for them whether any particular saying goes back to Jesus, and I do not want them leaving with the impression that the method is a machine. I have a hunch that the right place to end is the question of whether the criteria share a presupposition about how traditions behave that the criteria themselves cannot establish; if you think that is the right destination, tell me how to get there without asserting it as a thesis, and if you think it is the wrong one, say what the destination should be instead. No readings or further sources, please: they will not do them, and I have no way to distribute anything before the session.
reasoning: |-
  Hmm, this is a fascinating pedagogical challenge from a doctoral candidate in religious studies. The user needs to design a 90-minute undergraduate session on criteria of authenticity for Gospel traditions, with several specific constraints and goals. 

  First, let's unpack the key requirements: The students have only read the Gospels in translation, with mixed backgrounds (devout, skeptical, indifferent). The real goal isn't memorizing criteria but understanding their limits. The proposed "unassimilated residue" criterion from a colleague needs careful integration without duplicating embarrassment. And crucially, the session must avoid giving mechanistic impressions of historical analysis.

  The baptism of Jesus example has pros and cons. Its strength is demonstrating embarrassment clearly (why would early Christians invent Jesus submitting to John?), but as the user suspects, it's overused. Many students may already know this "awkward" fact. A better case study would be the Syrophoenician woman (Mark 7:24-30/Matt 15:21-28) because:
  - It's less familiar but still narratable in one minute
  - Shows embarrassment (Jesus initially refuses help, calls Gentiles "dogs")
  - Has multiple attestation (Mark and Matthew)
  - Reveals redactional struggle (Matthew adds the woman's "faith" to soften Jesus' harshness)
  - Allows demonstrating criterion failure (dissimilarity would falsely flag this as authentic due to its un-Jesus-like elements)
  - Perfectly illustrates unassimilated residue through Matthew's editorial anxiety

  For structure, the session should create cognitive tension before introducing criteria. Start with a concrete puzzle: "Why did early Christians preserve this story where Jesus seems rude?" Let students feel the discomfort first. Then introduce criteria as tools to investigate such tensions, not as answers. 

  The "unassimilated residue" concept should come after embarrassment, positioned as a redaction-critical extension. Its unique value is showing preservation despite discomfort, not just the discomfort itself. But we must preempt the misconception that all difficult sayings are authentic by showing how later redactors could create new problems (e.g., apocalyptic sayings edited post-70 CE).

  Key pitfalls to address mid-session:
  1. When introducing multiple attestation, students might think independent sources guarantee authenticity. Correct by showing Mark-Q overlaps aren't truly independent.
  2. After demonstrating dissimilarity, someone might claim "anything unusual is authentic". Crush this immediately with the Syrophoenician example where dissimilarity would mislead.
  3. When discussing coherence, emphasize it's the weakest criterion - traditions can cohere because they're fabricated.

  The closing question should expose the criteria's shared assumption: "Do these methods presume that early Christians only preserved traditions they found useful?" This reveals the circularity without lecturing. And explicitly declare what we won't do: "I won't prove any saying is authentically Jesus' - these tools give probabilities, not certainties."

  This approach makes the limitations the lesson, not the criteria themselves. The Syrophoenician woman case becomes a microcosm of historical analysis - messy, probabilistic, and revealing of the early community's struggles.
answer: |-
  Here’s a session plan structured to make the criteria emerge as answers to felt problems, using the **Syrophoenician Woman** (Mark 7:24–30 / Matt 15:21–28) as the central case study. It meets your requirements: narratable in 60 seconds, allows 3+ criteria to be tested with mixed outcomes, shows criterion failure, and reveals source interdependence upon scrutiny. **Replace the baptism**—it’s overfamiliar, and this story better demonstrates redactional struggle.

  ---

  ### **Session Structure: 90 Minutes**  
  **Core Goal:** *Criteria are tools for interrogating tradition, not verdict-issuing machines.*  

  #### **Step 1: Pose the Problem (10 min)**  
  - **Hook:** *"Why would early Christians preserve a story where Jesus initially refuses to help a desperate mother and calls her people ‘dogs’?"*  
  - **Narrate the story** (emphasizing Jesus’ reluctance, the "dogs" insult, and the woman’s retort).  
  - **Poll students:** *"Would you include this if you were writing a gospel? Why/why not?"*  
  - **Depend on:** Their instinctive discomfort. This creates the "problem" the criteria will later address.  

  #### **Step 2: Introduce "Unassimilated Residue" (15 min)**  
  - **Position:** *Before* traditional criteria, as a gateway to redaction criticism.  
  - **Define:** "A tradition preserved *despite* causing tension for its authors/editors. The strain of *keeping* it (through hedging, softening, etc.) signals its stubborn antiquity."  
  - **Apply to case:**  
    - Mark’s version: Jesus is harsh ("dogs"); the woman wins the argument.  
    - Matthew’s edits: Adds "Lord, Son of David" (v.22), deletes "let children be fed first" (softening exclusion), adds "great faith!" (v.28).  
  - **Adds value vs. embarrassment:** Focuses on *editorial effort to assimilate*, not just inherent awkwardness. Shows *how* communities managed uncomfortable traditions.  
  - **Misconception to head off:** *"All uncomfortable stories are old."*  
    - **Correct immediately:** "Editors could *create* new problems (e.g., apocalyptic sayings after 70 CE). Unassimilated residue requires *redactional distress signals*."  

  #### **Step 3: Criteria as Investigative Tools (40 min)**  
  **Guiding question:** *"Why was this story kept, and how old might it be?"*  
  Apply criteria *to the case*, highlighting limits:  

  | **Criterion**       | **Application to Story**                          | **Verdict/Limit**                                  |  
  |---------------------|--------------------------------------------------|---------------------------------------------------|  
  | **Embarrassment**   | Jesus insults a Gentile; ignores a plea.         | *Seems strong*... but Matthew’s edits show embarrassment *could* be managed. |  
  | **Dissimilarity**   | Jesus loses an argument; uses "dogs" (rare insult). | *Falsely suggests authenticity* → **Demonstrate failure**: Dissimilarity ignores that early Christians debated Gentile inclusion (e.g., Gal 2:11–14). "Shocking" doesn’t equal "historical." |  
  | **Multiple Attestation** | In Mark and Matthew (Q/M? Luke omits).          | *Weak*: Matthew likely used Mark. **Interdependence trap**: Students assume independence. Show Matt 15/Mark 7 parallels to prove redaction. |  
  | **Coherence**       | Fits Jesus’ debate style; clashes with Gentile mission. | *Self-canceling*: "Fits" is subjective; could be crafted to fit later needs. |  

  **Key pivot:** After applying each, ask: *"Does this prove it happened? What can it *only* suggest?"*  

  #### **Step 4: Confronting Shared Presuppositions (15 min)**  
  - **Question:** *"What do these criteria assume about how early Christians preserved traditions?"*  
    - Guide them to: "They assume communities *only* kept useful/edifying traditions *unless* forced by stubborn prior sources."  
  - **Challenge:** "What if communities *valued* discomfort? (e.g., as theology, satire, or critique). Criteria can’t test this assumption—it’s their blind spot."  
  - **Declare openly:** *"We won’t decide if this story ‘goes back to Jesus.’ These tools map tradition-history, not recover facts."*  

  #### **Step 5: Final Check-for-Understanding (10 min)**  
  - **Question:** *"If a gospel editor added a saying where Jesus praises Roman taxation, which criteria might *best* support its authenticity? Which would be useless? Why?"*  
    - **Why it works:**  
      - Tests grasp of *function* (not definitions): Dissimilarity/embarrassment might support it; coherence/Multiple attestation useless without sources.  
      - Forces judgment: Requires seeing criteria as contextual tools.  
      - Unanswerable by rote memorization.  

  ---

  ### **Why Syrophoenician Woman Works Best**  
  - **Has**: Embarrassment (Jesus’ harshness), unassimilated residue (Matthew’s edits), multiple attestation (Mark/Matt), coherence tensions (Gentile mission), dissimilarity pitfalls.  
  - **Lacks**: Familiarity (unlike baptism); lets students *see* redactional struggle.  
  - **Shows failure**: Dissimilarity misleads; multiple attestation crumbles under source scrutiny.  

  ### **Misconceptions & Corrections Timeline**  
  1. **After defining unassimilated residue**: *"All uncomfortable traditions are old."* → Correct with *editorial creation* counterexample.  
  2. **After multiple attestation**: *"Two gospels = independent proof."* → Show Matt/Mark literary dependence.  
  3. **After dissimilarity**: *"Anything unusual must be historical."* → Note later communities *invented* shocking content (e.g., *Infancy Gospel of Thomas*).  
  4. **After coherence**: *"If it fits Jesus’ style, it’s authentic."* → Cite clearly late but "coherent" parables (e.g., *Thomas*).  

  ### **Ending Destination**  
  Your hunch is correct. **Arrive at presuppositions**:  
  - **Path there**: After applying criteria, ask: *"What did we just assume about why early Christians kept or changed stories?"* → Elicit "usefulness + stubborn prior sources."  
  - **Clinch it**: "Can criteria *themselves* prove this assumption? Or do they depend on it?" → Highlight the circularity.  

  **Final declaration**: *"Today wasn’t about proving what Jesus said. It was about learning to ask: ‘What does this tradition’s survival reveal about the communities that carried it?’ The tools are clues, not cudgels."*  

  ---
  This plan forces criteria to emerge from student-engaged problems, uses a fresh case study with built-in tensions, and relentlessly exposes methodological limits. The Syrophoenician Woman’s redactional journey perfectly embodies "unassimilated residue" while letting every criterion succeed, fail, or falter in real time.
