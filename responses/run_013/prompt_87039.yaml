  Below is a comprehensive design for your seminar session on the unilateralist's curse. The activity is structured as a 4-round game simulating collective action problems, with escalating coordination mechanisms. It includes rules, materials, scoring, a 90-minute timeline, debriefing points, and notes on predictable pitfalls.

  ---

  ### **Game Structure: "The Commons Dilemma"**
  **Core Mechanics**:  
  - 18 players, each decides privately to **"Act" (A)** or **"Refrain" (R)** in each round.  
  - **Payoffs**:  
    - Acting earns **+10 points** privately but imposes **-5 points on every player** (including yourself).  
    - Refraining earns **0 private points** but still suffers others' costs.  
  - **Individual Payoff Formula**:  
    - **Act (A)**: `(10 - 5 * total_A) + (10 * personal_A)`  
      *(e.g., If you act and 5 others act: `(10 - 5*6) + 10 = -20 + 10 = -10`)*  
    - **Refrain (R)**: `10 - 5 * total_A`  
      *(e.g., If you refrain and 5 others act: `10 - 5*5 = -15`)*  
  - **Rationale**:  
    - Acting is attractive if few act (e.g., 1 actor: +5 points; non-actors: -5).  
    - Many actors cause disaster (e.g., 10 actors: actors get -40; non-actors get -50).  
    - *Dominant incentive*: Acting always yields +10 more than refraining *for the individual*, but group welfare plummets as `total_A` increases.  

  ---

  ### **Materials**  
  1. **Per Student**:  
     - 1 scorecard (paper) to track points.  
     - 2 voting slips (A/R) per round.  
  2. **Instructor**:  
     - Whiteboard to display rules, tally votes, and update scores.  
     - Timer.  
     - Envelope for binding commitments (Round 4).  

  ---

  ### **Rounds & Timeline (90 Minutes Total)**  
  **Goal**: Show how coordination tools weaken—but rarely eliminate—the curse.  

  #### **Round 1: Baseline (No Communication)**  
  - **Time**: 10 min (5 min explain, 3 min vote, 2 min results).  
  - **Rules**:  
    - No talking. Students vote privately (slip in box).  
  - **Predictable Failure**: Most (14–18) will act.  
    - *Why*: Acting is individually rational (+10 point bonus).  
  - **Scoring Example**:  
    - If 16 act: Actors get `(10 - 5*16) + 10 = -70 + 10 = -60`; Refrainers get `10 - 5*16 = -70`.  
  - **Outcome**: Group realizes high `total_A` → catastrophic scores (e.g., -60).  

  #### **Round 2: Cheap Talk (Non-Binding Discussion)**  
  - **Time**: 15 min (5 min discussion, 3 min vote, 2 min results, 5 min frustration).  
  - **Rules**:  
    - Open discussion to coordinate. No binding agreements.  
  - **Predictable Failures**:  
    1. **Over-Coordination Paralysis**: Group may agree *all* should refrain.  
       - *Why*: Fear of disaster.  
    2. **Defectors**: 5–8 students act anyway (betraying the group).  
       - *Why*: If others refrain, acting yields `10 - 5*1 + 10 = +15` (too tempting).  
  - **Scoring Example**:  
    - Agreement: "All refrain!" → 5 defect → `total_A=5` → Actors: `-15`; Refrainers: `-25`.  
  - **Outcome**: Group sees communication helps (lower `total_A`) but defection persists.  

  #### **Round 3: Public Commitment (Non-Binding)**  
  - **Time**: 15 min (5 min public pledges, 3 min vote, 2 min results, 5 min reflection).  
  - **Rules**:  
    - Each student announces "A" or "R" publicly.  
    - Then, vote privately (may defect).  
  - **Predictable Failures**:  
    - **Social Pressure**: Some pledge "R" to avoid judgment but defect.  
    - **Mistrust**: 3–6 defect, citing distrust in others.  
  - **Scoring Example**:  
    - 15 pledge "R" → 4 defect → `total_A=4` → Actors: `-10`; Refrainers: `-20`.  
  - **Outcome**: Public pledges reduce `total_A` but not reliably; trust is fragile.  

  #### **Round 4: Binding Commitment (Costly/Verifiable)**  
  - **Time**: 20 min (5 min sealed commitments, 3 min vote, 2 min results, 10 min debrief setup).  
  - **Rules**:  
    - Students write "A" or "R" on a slip, seal in envelope (instructor holds).  
    - Vote privately. If vote ≠ commitment, **-20 point penalty**.  
    - Instructor verifies.  
  - **Predictable Outcomes**:  
    - **High Compliance**: Defection drops (penalty outweighs +10 bonus).  
    - **Under-Action Risk**: Some over-correct, causing `total_A` to drop too low.  
  - **Scoring Example**:  
    - 18 commit "R" → 2 defect (penalty: `-20`) → Actors: `-60 -20 = -80`; Refrainers: `-10`.  
  - **Outcome**: Binding fixes defection but may cause under-action (e.g., 0 actors → no disaster but no gains).  

  ---

  ### **Under-Action Scenario (Integrated into Round 4)**  
  **Modify Payoffs for 1–2 Students**:  
  - Acting now gives **+15 private points** but costs **-2 points/player**.  
  - **Rationale**:  
    - Acting is *socially optimal* (net +15 - 36 = -21, better than total inaction).  
    - But individually risky: If others act, you get `15 - 2*total_A` (could be negative).  
  - **Predictable Failure**:  
    - **Freeze**: Most refrain, fearing costs.  
    - Example: If 0 act → all get 0 (missed opportunity). If 2 act: Actors get `15 - 2*2 = +11`; others get `-4`.  
  - **Debrief Link**: Shows how the *same logic* (individual risk aversion) can cause under-action.  

  ---

  ### **Debrief (30 Minutes)**  
  **Goals**:  
  1. Connect gameplay to real-world collective action.  
  2. Debunk "universal caution" as a solution.  
  3. Highlight limits of communication.  

  #### **Key Discussion Points**:  
  1. **The Curse in Action (Rounds 1–3)**:  
     - *Q*: "Why did we keep acting despite knowing the disaster?"  
     - *Takeaway*: Individual incentives (+10) overwhelm collective welfare.  

  2. **Coordination Tools (Rounds 2–4)**:  
     - *Q*: "Did communication help? Why did defection persist?"  
     - *Takeaway*: Cheap talk builds trust but lacks enforcement; binding commitments work but risk over-correction.  

  3. **Under-Action (Round 4)**:  
     - *Q*: "Why did we freeze in the modified scenario?"  
     - *Takeaway*: The curse is not just about recklessness—**caution can cause collective paralysis** when action is needed.  

  4. **Broader Implications**:  
     - **Moral Uncertainty**: In real life, we rarely know exact costs/benefits.  
     - **Asymmetries**: Some actors bear more risk (e.g., scientists in collaborations).  
     - **Solutions**: Binding agreements > public pledges; external enforcement (e.g., treaties).  

  #### **What the Activity Can’t Replicate**:  
  - **Moral Complexity**: Real-world decisions involve ambiguity (e.g., "Is this action harmful?").  
    - *Explain upfront*: "We assume known payoffs, but uncertainty exacerbates the curse."  
  - **Scale Effects**: Costs may not be linear (e.g., thresholds, tipping points).  
  - **Identity Factors**: Social dynamics (e.g., hierarchy, culture) skew choices.  

  ---

  ### **Predictable Pitfalls & Mitigation**  
  | **Round** | **Pitfall** | **In-Moment Response** |  
  |-----------|-------------|------------------------|  
  | **2 (Cheap Talk)** | Defectors rationalize: "I acted because others will." | Highlight: *Everyone* thinks this → disaster. Ask defectors: "What made you distrust the group?" |  
  | **3 (Public Commit)** | Students pledge "A" to appear bold → high `total_A`. | Warn: "Pledges aren’t virtue signals—optimize outcomes." |  
  | **4 (Binding)** | Over-compliance: `total_A = 0` → missed gains. | Ask: "Did we under-act? When is restraint harmful?" |  
  | **Under-Action** | Silence during discussion → no volunteers. | Provoke: "Is inaction safer? What if *no one* acts?" |  

  ---

  ### **Instructor Notes**  
  - **Scoring Transparency**: Post formulas visibly. Calculate one example live.  
  - **Social Pressure**: Warn against peer judgment (e.g., "No shaming—focus on incentives").  
  - **Ethics Emphasis**: Stress that rational choices ≠ moral choices.  
  - **Flexibility**: Adjust payoffs if outcomes stray (e.g., if Round 1 has <10 actors, increase the +10 bonus).  

  This design forces students to *experience* the curse, reveals the duality of over/under-action, and shows why coordination requires more than goodwill. The debrief bridges gameplay to philosophy, preempting oversimplified conclusions.
