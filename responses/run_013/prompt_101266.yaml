prompt: |-
  I sit on the admissions council of a small league of states that was set up on roughly Kantian lines -- the whole idea being that peace comes from a federation of free states rather than from one world republic. Our votes over the years have been pretty consistant but I've never been able to say what rule we're actually running. We admitted a federal republic with an elected legislature and an executive that can't go to war without the legislature's vote, and we admitted a small merchant republic with a very narrow franchise -- property owners only -- whose assembly nevertheless has to approve every tax and every campaign, and which hasn't fought anyone in eighty years. We turned down an absolute monarchy that swore up and down it would never attack anybody, and we turned down a state that calls itself a republic but whose 'first consul' picks his own successor and can raise troops and money on his own say-so. Next month we vote on a hereditary principality: the prince inherits the office, but he can't declare war or levy taxes without the consent of an elected assembly, and the place has been at peace for decades and wants in.

  Tell me what we should decide if we want to be consistent with ourselves. I suspect we're running one of three rules -- (a) the real test is whether the legislative power is separated from the executive and holds the war power, in which case a constrained prince is fine; (b) the real test is that the rulers answer to elected representatives, in which case any hereditary ruler is out no matter how constrained; (c) the labels don't matter and we're really just asking whether the constitution makes war hard and the state has kept the peace. Say what each rule predicts about the principality, which of our past votes are consistent with which rule, give me your best guess and the reason for it, name the closest analog among our precedents, and say honestly what principle we'd be adopting either way. Then name the one further case -- not the principality -- that would actually tell the three rules apart, and why that case rather than another.

  Do it as: Recommendation (one paragraph); Candidate rules (three short paragraphs); What each predicts (a few lines, a small table is fine); Closest precedent (one paragraph); The case that would settle it (one paragraph). No citations, I don't need them.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're part of an admissions council for a league of states based on Kantian principles. The league's goal is peace through a federation of free states. The user has noticed consistent voting patterns but can't pinpoint the underlying rule. They've provided past decisions: admitted a federal republic and a merchant republic with a narrow franchise, rejected an absolute monarchy and a pseudo-republic with a powerful consul. Now they're considering a hereditary principality with constraints and a peaceful history.

  First, I need to break down the three candidate rules they suspect: (a) separation of powers where the legislative controls war powers, (b) rulers accountable to elected representatives, (c) actual difficulty in waging war plus a peaceful record. 

  Looking at the past decisions: The federal republic fits all three rules. The merchant republic has a narrow franchise, so elected representatives exist, but not broadly democratic. However, the assembly controls taxes and war, which aligns with (a) and (c). The absolute monarchy was rejected; under (a) and (b), it lacks separation and elected reps. Rule (c) might question why it was rejected since the monarch promised peace, but the rejection suggests they don't trust such promises without structural constraints. The pseudo-republic had a consul who could act unilaterally, so no real legislative control, hence rejected under (a) and (b). Rule (c) might consider if the structure makes war easy, which it does.

  Now the principality: hereditary prince but needs assembly consent for war and taxes. Rule (a) would accept because the legislative (assembly) controls war powers. Rule (b) rejects since the prince isn't elected and the role is hereditary. Rule (c) would approve due to the constraints and decades of peace.

  Consistency with past decisions: Admitting the merchant republic (narrow franchise but elected assembly) aligns with (a) and (b), but (b) requires rulers to answer to elected reps. The merchant republic has an elected assembly, so the rulers (executive) answer to them, even if the franchise is limited. The principality's prince isn't elected, so (b) would reject. The absolute monarchy rejection fits (a) and (b) but not necessarily (c). The pseudo-republic rejection fits (a) and (b) because the consul had unilateral power.

  The closest precedent is the merchant republic: both have an elected assembly controlling key powers, but the merchant republic has an elected executive (even if narrowly), while the principality has a hereditary executive. So under (b), that difference matters. 

  The deciding case would be a state with a hereditary ruler constrained by an elected assembly but a recent war. Rule (a) accepts if constraints exist, (b) rejects due to hereditary ruler, (c) rejects because of the recent war. That case would clearly differentiate the three rules.

  The user's deeper need might be understanding the philosophical foundation of their league. Kant emphasizes republicanism defined by separation of powers, not necessarily democracy. So rule (a) aligns with Kant's view that even non-democratic states with separation can be peaceful. The user might want consistency but also to ensure the league's integrity. They might be torn between structural guarantees and actual peace outcomes. Recommending acceptance based on (a) supports their past decisions and Kantian principles.
answer: |-
  **Recommendation**  
  Admit the principality. Consistency with your past decisions points to **Rule (a)**: The critical factor is separation of powers, specifically that the executive cannot wage war or levy taxes without legislative consent. The principality’s constraints mirror those of your admitted merchant republic, where an assembly (even with a narrow franchise) holds decisive war/tax authority. Hereditary rulers are not inherently disqualifying if constitutionally checked, as evidenced by your rejection of the absolute monarchy (unchecked) versus acceptance of the constrained merchant republic. This aligns with Kant’s emphasis on *institutional barriers to war* over labels or electoral origins.

  **Candidate Rules**  
  - **Rule (a): Separation of Powers.** The executive must lack unilateral war/tax authority; these powers require independent legislative consent. Heredity or limited suffrage are irrelevant if the assembly genuinely restrains the executive.  
  - **Rule (b): Elected Accountability.** Rulers must derive authority from, and answer to, elected representatives. Hereditary executives fail automatically. Franchise breadth may matter, but non-elected leadership violates the core principle.  
  - **Rule (c): Structural Pacifism.** Labels and offices are secondary; the test is whether the state’s governance structure *in practice* makes war difficult and has sustained peace. Past behavior is key evidence.  

  **What Each Predicts for the Principality**  
  | Rule       | Prediction | Reason                                                                 |  
  |------------|------------|------------------------------------------------------------------------|  
  | **(a)**    | **Admit**  | Hereditary prince is constrained by elected assembly on war/taxes.    |  
  | **(b)**    | **Reject** | Hereditary executive cannot satisfy "answer to elected representatives."|  
  | **(c)**    | **Admit**  | Constitution requires assembly consent + decades of peace.            |  

  **Consistency with Past Votes**  
  - **Federal Republic (Admitted):** Consistent with all rules (separated powers, elected accountability, pacifist structure).  
  - **Merchant Republic (Admitted):** Fits **(a)** (assembly controls war/taxes) and **(c)** (peaceful record). **Rule (b) is inconsistent** unless narrow property-based franchise is deemed sufficient "elected accountability" (debatable).  
  - **Absolute Monarchy (Rejected):** Fits **(a)** (no legislative check) and **(b)** (no elections). **Rule (c) is inconsistent** if the monarchy's peaceful oath was credible.  
  - **"Republic" with Autocrat (Rejected):** Fits **(a)** (no legislative constraint) and **(b)** (no real accountability). Consistent with **(c)** if unilateral powers make war easy.  

  **Closest Precedent**  
  The **merchant republic** is the strongest analog. Both cases feature an elected assembly with binding authority over war and taxes, despite significant differences in executive selection (elected by narrow franchise vs. hereditary) and suffrage. You admitted the merchant republic despite its undemocratic franchise because its assembly held real power. This precedent favors **Rule (a)**, as the principality replicates the key feature: legislative control over warmaking. Rule (b) struggles here, as both executives lack broad electoral legitimacy.  

  **The Case That Would Settle It**  
  A **hereditary monarchy with an empowered assembly (controlling war/taxes) but a recent defensive war**.  
  - **Rule (a)** would *admit*: Legislative checks exist regardless of the war’s recency or defensiveness.  
  - **Rule (b)** would *reject*: Hereditary rule violates elected accountability.  
  - **Rule (c)** would *reject*: Recent war (even defensive) undermines "pacifist structure" regardless of constraints.  
  *Why this case?* It isolates the conflict between principles: **(a)** focuses solely on institutional checks, **(b)** on electoral origins, and **(c)** on behavioral outcomes. The merchant republic precedent can’t resolve this, as it had no recent war. The absolute monarchy rejection doesn’t help, as it lacked checks. This hypothetical forces a choice between structure **(a)**, ideology **(b)**, or results **(c)**.
