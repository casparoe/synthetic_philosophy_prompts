  ## Annual Report of the Chair, New Sussex Sentencing Commission, to the Honourable Legislature of the Commonwealth of New Sussex

  Esteemed Members of the Legislature,

  It is my duty, as Chair of the Sentencing Commission, to present our annual report for the preceding fiscal year, detailing the implementation and ongoing refinement of our sentencing framework under the foundational **Harmony Through Justice Act (HTJA)**. As you are aware, the HTJA enshrines a singular and inviolable principle: the quantum of punishment imposed upon an offender must correspond precisely to the offender’s culpability and the inherent gravity of the wrong committed. This principle, grounded in the moral necessity of just deserts, explicitly prohibits any consideration of future consequences – whether intended deterrence of others, potential rehabilitation of the offender, incapacitation for public safety, or fiscal savings to the Treasury – as justifications for increasing or decreasing a sentence. To impose more or less than is deserved based on anticipated effects constitutes a fundamental injustice, a distortion of the moral ledger. In line with our internal drafting protocols, we rigorously avoid the vocabulary of instrumental effectiveness, recognizing that to characterize punishment as a *means* to an end implicitly undermines its intrinsic status as a just *end* in itself, playing into the hands of those who would subordinate justice to utility.

  The Commission’s primary task remains the arduous calibration of this cardinal scale of desert. Culpability and gravity inherently suggest ordinal relationships – one act is clearly more blameworthy, more injurious to the social fabric, than another. Translating this hierarchy into concrete, commensurate terms of imprisonment or other sanctions, however, demands a fixed unit of measurement. We continue to utilize the **Plaxico Standard**, anchoring our desert scale to a term of five years’ imprisonment for the offence of aggravated burglary involving significant violence against a person. We readily acknowledge the Plaxico Standard’s origin lies not in a divine edict nor an unassailable philosophical deduction, but in the historical sentencing practices preceding the HTJA. Critics sometimes seize upon this, demanding a derivation of the five-year anchor from first principles of desert. This, however, represents a profound category error. Desert provides the *reason* for punishment and the *relative* scale of severity; it cannot, by its nature, furnish the absolute numerical value any more than the concept of "length" dictates the specific length of the standard meter bar in Paris. The Plaxico Standard provides the essential, albeit inherited, numerical expression that allows us to operationalize the demands of justice with consistency. To discard it without a viable, purely desert-based alternative would plunge sentencing into chaos, severing the vital link between the moral gravity of the act and its societal reckoning.

  A particularly poignant case presently before the Commission underscores the rigorous demands of the HTJA. We have received a petition concerning Mr. Aris Thorne, sentenced thirty-two years ago under the old regime to life imprisonment for a brutal, premeditated homicide. Mr. Thorne, now seventy-eight years old, suffers from terminal metastatic cancer; physicians estimate his remaining life in months, not years. Extensive evaluations, including those conducted reluctantly under our internal protocols which discourage predictive language, consistently indicate he poses no conceivable threat to anyone. Indeed, prison staff and psychological reports depict a man profoundly altered, even remorseful. The previous sentencing regime, focused on dangerousness and potential for change, would undoubtedly have facilitated his compassionate release. The HTJA, however, compels us to examine solely whether Mr. Thorne’s *desert* has diminished. His culpability was fixed irrevocably at the moment he committed the act; the gravity of the wrong inflicted upon his victim and the community remains undiminished by the passage of time or his subsequent transformation. The debt incurred by his act remains owed, regardless of his present capacity or incapacity. To reduce his sentence now would be to declare that the passage of time or infirmity erases the moral debt, a proposition utterly incompatible with the principle that punishment answers the wrong itself, not the present condition of the wrongdoer. While the outcome in such instances may strike some observers as unduly severe, even unpleasant to contemplate, the Commission must uphold the integrity of the moral balance. Releasing Mr. Thorne, however compelling the humanitarian impulse might seem when viewed through a consequentialist lens, would constitute a failure to discharge society’s duty to see justice done for the original, grave wrong. The debt remains; it must be paid in full.

  This brings us, inevitably, to the matter of expenditure. The Department of Corrections budget request for the coming year reflects the sustained operational costs associated with housing the sentenced population under our desert-based regime. We understand the Legislature’s fiduciary duty to scrutinize public spending and inquire, quite reasonably, about the tangible returns on this significant investment. Under the strictures of the HTJA and our own drafting standards, we cannot frame the maintenance of prisons or the imposition of sentences in terms of purchasing safety, reducing future crime, or rehabilitating individuals – such outcomes, however desirable they might be in other contexts, are irrelevant to the *justification* for the sentence itself. The expenditure is necessary because it funds the *fulfillment* of justice. An unpunished wrong, or a punishment reduced for reasons divorced from desert, is not merely an inefficiency; it is a standing injury to the political community, a corrosion of the shared understanding that moral boundaries have force and that violations demand proportionate redress. To imprison Mr. Thorne for his remaining months is costly; to fail to do so, however, would be to declare that the gravity of his original act was somehow negotiable, contingent upon his later circumstances or the state’s coffers. The cost is the price of maintaining the moral order itself. We recognize that alternative frameworks, focusing on consequences like risk management or rehabilitation, might offer seemingly more pragmatic justifications for budgetary requests, potentially even dissolving the specific difficulties posed by measurement anchors and cases like Mr. Thorne’s at a stroke. Such frameworks, however, subordinate the paramount demand of justice – that each receive their precise desert – to contingent calculations of future benefit, a path fundamentally incompatible with the Harmony Through Justice Act and the moral imperative it embodies.

  In conclusion, the Commission remains steadfast in its application of the HTJA. We continue to refine our sentencing guidelines to ensure ever-greater fidelity to the principles of culpability and inherent wrongfulness. We appreciate the Legislature’s continued support in upholding the foundational commitment of the Commonwealth: that justice, defined solely by desert, shall be done.

  Respectfully Submitted,

  Elias Vance
  Chair, New Sussex Sentencing Commission
