  In fact, the teacher's announcement is a prediction about the future that includes a prediction about the students' state of mind (that they will be surprised). The students' reasoning is an attempt to use that prediction to deduce what will happen. But the prediction is self-referential: if the students believe the prediction, then they might be able to deduce the day, which would make the prediction false. But if they don't believe it, then when the exam happens they might be surprised.

  This is similar to a prediction that "you will be surprised by what I do next". If you believe me, you might try to anticipate, but then you won't be surprised. But if you don't believe me, then you might be surprised.

  So the analogy to self-referential predictions that defeat themselves is apt and does real work.

