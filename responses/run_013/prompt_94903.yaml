  Alternatively, we might find that the announcement is inconsistent if we require the students to always believe the announcement. But if the students are allowed to revise their beliefs, then the announcement can be true.

  In the one-day case:

  - The teacher says: "Exam tomorrow and it will be a surprise."
  - Let S be the announcement.
  - The students reason: if S is true, then there will be an exam tomorrow and we will be surprised. But if we are surprised, that means we do not expect the exam tomorrow. However, if S is true, then we know today that the exam is tomorrow, so we would expect it and not be surprised. Contradiction. Therefore, S is false. Hence, no exam tomorrow.
  - Then tomorrow the exam happens, and the students are surprised because they did not expect it. So S was true: there was an exam and it was a surprise.

  This shows that the announcement S is true, but the students, by reasoning, come to disbelieve it. The reasoning leads to a false conclusion (that S is false) because the reasoning itself changes the students' belief. Without the announcement, the students might have expected the exam. But with the announcement, they reason to not expecting it. So the surprise is caused by the announcement.

