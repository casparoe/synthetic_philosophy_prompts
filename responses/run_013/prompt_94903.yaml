  The key is to define what it means for the exam to be a surprise on a given day. In epistemic logic, we might say that the exam on day d is a surprise if, at the beginning of day d (or at some prior time), the students do not know that the exam will be on day d.

  The backward induction then becomes a chain of reasoning:

  - On Friday, if the exam hasn't happened by Thursday evening, then on Friday morning the students would know that the exam must be on Friday. So it cannot be a surprise on Friday. Therefore, the exam cannot be on Friday.
