  Testing with the one-day version:

  Teacher: "There will be an exam tomorrow and it will be a surprise." 

  - If we apply the backward induction: on the day before (i.e., today), the students reason that if the exam is tomorrow, then they know today that it will be tomorrow, so it wouldn't be a surprise. Hence, they conclude that the exam cannot occur. But then if the exam does occur tomorrow, they are surprised.

  However, note that the reasoning happens today. The students are trying to predict today what will happen tomorrow. They reason that if the exam is tomorrow, then today they would know that, so it wouldn't be a surprise. But wait: the teacher says the exam will be a surprise. So the students argue: it cannot be tomorrow because if it were, we would know today and it wouldn't be a surprise. Hence, they conclude no exam. Then the exam happens and they are surprised because they thought there would be no exam.

  But note: the teacher's announcement includes both that the exam is tomorrow and that it will be a surprise. The students, by reasoning, come to believe that there will be no exam. Therefore, when the exam happens, they are surprised because they did not expect it.

  In this one-day case, the backward induction is very short. The argument leads the students to disbelieve the teacher, so they are surprised when the exam occurs. This seems consistent with the idea that the announcement is self-defeating: the very act of announcing causes the students to disbelieve, so when the exam happens they are surprised. But note that the teacher said the exam would be a surprise and it was. So the announcement was true. However, the students, by using the announcement as a premise, concluded that the announcement must be false. This is the self-referential aspect.

  The one-day version shows that the announcement can be true even though the students, by reasoning from it, come to disbelieve it. The surprise is psychological: they did not believe the exam would happen, so they are surprised when it does.

  What would count as progress?

  Progress would involve a formalization that makes the options commensurable. For example, using a formal logic of knowledge (like epistemic logic) to model the students' knowledge at each stage. In such a formalization, we can define:

  - The days: D = {Monday, Tuesday, ..., Friday} (or in the one-day version, just one day: tomorrow).
