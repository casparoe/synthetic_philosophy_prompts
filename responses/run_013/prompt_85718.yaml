prompt: |-
  I'm in a metaethics seminar and we've hit the week on moral dilemmas, and I've realized I dont actually know what I'm supposed to be testing the theories against. So before I read another position, give me the spec: what does any theory of genuine moral dilemmas have to be able to do to count as adequate? I want the full requirements list -- the cases it has to get right (the two drowning children, the person who promised two friends the same evening, the parent who can only get medicine for one kid, the doctor with one ventilator and two patients, plus any case you think earns its place that those miss), the distinctions it can't collapse (a genuine dilemma vs. merely a hard choice; a conflict of duties vs. a conflict of values; the agent's experience of being trapped vs. the theorist's verdict on whether there's a fact of the matter; "two obligations, can only discharge one" vs. "every available option is wrong"; guilt and regret as tracking something real vs. as a purely psychological leftover), and the results it can't contradict (ought-implies-can; the thought that a set of obligations shouldn't be jointly unsatisfiable; the fact that people really do feel stained after choosing the lesser evil, and most of us don't think that's simply a mistake). For each requirement give me the case or consideration that puts it on the list, and mark which are non-negotiable and which are just commitments of one camp (realists, expressivists, pluralists about value, people who think every obligation gets weighed on one scale).

  Two things I want the list to force a verdict on, because they're where the seminar keeps going in circles. First, a friend insists there's a real difference between a dilemma you're in because of how you acted earlier -- you made both promises, you took both jobs -- and one that's pure bad luck, and she thinks any adequate theory has to track that difference; tell me whether that's a genuine desideratum or just her intuition. Second, my roommate says the guilt after a genuine dilemma is just a fact about our psychology and needs no moral vindication, while I think a theory has to say what makes the residue warranted rather than only why we have it -- build whichever version you think is right into the list as a requirement, and if you think those two demands pull against each other, say so. And if some subset of the requirements can't be jointly satisfied, that's the part I most want: name the pair and say why, since a list that can't be met is itself a result.

  Start with your bottom line in the first sentence -- the single requirement you think does the most work excluding candidate theories, plus whether you think any two requirements are jointly unsatisfiable -- then the list, then, only if it's quick, a line on which of the usual approaches each requirement knocks out. No preamble, don't restate the question, and keep the weight on the criteria and the cases behind them rather than on scoring the contenders; I can do the scorecard myself. Tell me how confident you are in the list as a whole and which single requirement you're least sure belongs on it. No citations or reading lists please, I just want the spec.
reasoning: |-
  Okay, the user is in a metaethics seminar focusing on moral dilemmas and needs a clear set of criteria to evaluate theories. They want a comprehensive list of requirements any adequate theory must meet, including specific cases, necessary distinctions, and non-negotiable results. 

  First, I need to identify the core challenge: the user feels stuck because they don't know what benchmark to use for testing theories. Their frustration comes from circular seminar debates, especially about two points: whether prior actions vs. bad luck matters in dilemmas, and whether post-choice guilt requires moral justification.

  The user's explicit requests are thorough:
  - List cases that must be explained (drowning children, conflicting promises, triage scenarios)
  - Outline distinctions theories can't blur (e.g., genuine dilemma vs. hard choice)
  - Note inviolable principles (e.g., ought-implies-can)
  - Settle two seminar disputes: (1) prior actions vs. bad luck as a necessary distinction, (2) whether guilt needs moral warrant
  - Flag any unsatisfiable requirement pairs

  I'm considering structuring this with "The Bottom Line" upfront—highlighting the most theory-excluding requirement and any irreconcilable conflicts. Then the full list with each requirement's rationale, marked for negotiability. For the seminar's sticking points:
  - Prior actions vs. bad luck: This seems contingent (e.g., Kantians care, consequentialists may not), so I'll mark it negotiable.
  - Guilt warranting: I lean toward requiring justification, as simply psychological seems inadequate for moral residue.

  Key tensions to note:
  - Dilemma reality vs. ought-implies-can: If both obligations bind absolutely, they can't be jointly unsatisfiable—but dilemmas suggest they are.
  - Residue justification vs. psychological explanation: Theories must navigate why guilt persists even when choosing correctly.

  The user's depth suggests they'll probe weaknesses, so I'll note which requirement I'm least confident about (e.g., "wrongness residue" being essential) and overall confidence level (high, but with philosophical humility).

  No citations—this is purely analytical. The goal is a functional spec sheet, not a literature review.
answer: |-
  **Bottom line:** The single most exclusionary requirement is accounting for **moral residue** (guilt/regret as warranted, not just psychological) while preserving **ought-implies-can (OIC)**; these *can* be jointly satisfied but only by theories accepting genuine dilemmas as violating deontic consistency. The most significant tension is between **deontic consistency (DC)** (no jointly unsatisfiable obligations) and the **reality of dilemmas**, potentially rendering them jointly unsatisfiable without significant revisionism.

  **The Requirements List:**

  1.  **Explain core dilemma cases adequately:**
      *   **Cases:** Sophie's Choice (one child's medicine), Two Drowning Children (can only save one), Conflicting Promises (same evening), Ventilator Triage (one ventilator, two patients), Williams' "Jim and the Indians" (kill one to save many). **Non-negotiable.** A theory must handle these paradigmatic examples without implausible contortions.
      *   **Earning its place case:** **The Agent-Regret Dilemma:** You cause a fatal accident unavoidably (e.g., child runs into road while you drive perfectly). Highlights residue without conflicting duties *per se*, testing theories on "stain" from mere causal involvement in tragedy.

  2.  **Distinguish genuine dilemmas from merely hard choices:**
      *   **Requirement:** A theory must articulate what makes a choice a *dilemma* (genuinely tragic, involving inescapable moral failure/loss) vs. merely difficult or costly (where one option is clearly best, just unpleasant). **Non-negotiable for realist/pluralist camps; negotiable for monistic consequentialists/strong OIC adherents who deny dilemmas.**
      *   **Case Behind It:** Saving one drowning child vs. deciding whether to undergo painful but life-saving surgery yourself. The latter is hard, but not a dilemma where *every* choice involves moral failure.

  3.  **Distinguish conflicts of duties/obligations from conflicts of values:**
      *   **Requirement:** A theory must clarify if the conflict is between binding *oughts* (e.g., promise-keeping vs. harm-prevention) or between competing *goods/bads* (e.g., pleasure vs. knowledge loss). **Non-negotiable.** Confusing them obscures the source of the binding force in dilemmas.
      *   **Case Behind It:** The Ventilator Triage (conflict of duties: save life A vs. save life B) vs. Choosing between funding a museum or a hospital (conflict of values: art vs. health, absent a specific duty to fund either).

  4.  **Account for the agent's experience vs. the theorist's verdict:**
      *   **Requirement:** A theory must explain the phenomenology of being "trapped" and experiencing inescapable *moral* failure/taint, regardless of whether the theorist ultimately judges there *was* a single right answer. **Non-negotiable.** Ignoring the first-person experience misses a core feature of dilemmas.
      *   **Case Behind It:** Sophie *feels* damned regardless of any theorist's claim she did the "best possible" thing. The experience demands explanation.

  5.  **Distinguish "failure to discharge one obligation" from "every option is wrong":**
      *   **Requirement:** A theory must clarify if the agent fails one obligation *while fulfilling another* (implying one option was overall right/permissible) or if *all* options involve *pro tanto* wrongdoing (no option is permissible). **Non-negotiable for genuine dilemma realists; negotiable for those denying dilemmas.**
      *   **Case Behind It:** Conflicting Promises: Did I *wrong* the friend I stood up (even if justified), or was keeping *one* promise the overall right/permissible act? Genuine dilemma views tend toward the former.

  6.  **Preserve Ought-Implies-Can (OIC):**
      *   **Requirement:** A theory cannot hold an agent morally obligated to do the impossible. **Widely considered non-negotiable.** This directly pressures theories denying dilemmas (if both duties bind, but can't both be fulfilled, OIC is violated) and constrains dilemma-accepting theories (they must explain obligations persisting despite inability).
      *   **Case Behind It:** Any core dilemma case (Sophie, Drowning Children). If Sophie *ought* to save both but *cannot*, OIC is invoked.

  7.  **Address Deontic Consistency (DC):**
      *   **Requirement:** A theory must explain how a set of genuine obligations can or cannot be jointly unsatisfiable. **Non-negotiable.** The core challenge: DC seems rational, yet dilemmas suggest its violation.
      *   **Case Behind It:** Conflicting Promises: If I have a genuine obligation to meet Friend A *and* a genuine obligation to meet Friend B, and I physically cannot do both, are these obligations jointly satisfiable? If not, DC is violated.

  8.  **Explain Moral Residue (Guilt/Regret) as Warranted:**
      *   **Requirement:** A theory must provide a *moral* justification for why agents feel (and often *should* feel) guilt, regret, or stain after choosing the "lesser evil" in a genuine dilemma, beyond mere psychology. **Non-negotiable based on your request (and my agreement); negotiable for psychological residue views (your roommate's).**
      *   **Case Behind It:** Sophie's lifelong anguish; the sense of having "dirty hands" after triage. The intuition is that this feeling tracks a *moral* remainder, not just sadness.
      *   **Tension with Psychological View:** The requirement *does* pull against purely psychological explanations. A theory must bridge the gap: *why* does psychology generate this specific feeling here? What *moral* feature does it respond to? (e.g., violated *pro tanto* duty, tragic loss, agent-regret).

  9.  **Address the "Wrongness Residue":**
      *   **Requirement:** Closely linked to (8), a theory should explain the intuition that even the "best" choice in a dilemma often still *involves doing something wrong* (*pro tanto*), leaving a residue of wrongdoing, not just bad consequences. **Non-negotiable for strong dilemma realists; negotiable for others.**
      *   **Case Behind It:** Jim kills the innocent Indian. Did he do *something wrong*, even justifiably? Or did he simply do the right, though tragic, thing? Dilemma views lean towards the former.

  **Settling the Seminar Circles:**

  1.  **Prior Actions vs. Bad Luck:** This is **not a universal desideratum; it's a commitment of specific camps.** Kantians/emphasizing personal responsibility find it crucial (you *created* the dilemma via your promises/jobs). Consequentialists or luck-egalitarians might see the *moral structure* of the conflict (lives vs. lives, promises vs. promises) as identical regardless of origin. A theory *can* be adequate without prioritizing this distinction, though it *should* explain why some dilemmas *feel* different based on origin (e.g., guilt might be stronger in self-created cases).
      *   **Verdict:** **Negotiable requirement.** Theories should *address* the difference in phenomenology/agent-experience, but don't *necessarily* need to build it into the fundamental structure of dilemmas.

  2.  **Guilt: Warranted vs. Psychological:** As stated in Requirement (8), the list **builds in the requirement for warranted residue** (your view). A theory must say *what* makes the guilt appropriate or fitting, not just why we have it (e.g., it recognizes the *pro tanto* wrongdoing, the tragic loss we were causally involved in, or the inescapable failure of ideal morality). Purely psychological explanations (roommate's view) are deemed inadequate here.

  **The Core Tension:**

  *   **Deontic Consistency (DC) vs. The Reality of Dilemmas (RD):** These appear **jointly unsatisfiable** in their strongest forms.
      *   **Why:** DC (strong form): It cannot be that an agent has two genuine, all-things-considered obligations that are logically or practically incompatible. RD (strong form): Genuine dilemmas exist where an agent faces incompatible obligations, both binding, such that whichever they choose, they violate a real obligation and incur moral residue.
      *   **Resolution Attempts:** Theories must weaken one or both. Deny RD (no *real* dilemmas, just hard choices - violates requirements 1, 2, 4, 5, 8, 9). Deny DC (allow for inconsistent obligations - challenges rationality/logic). Reinterpret obligations (only *pro tanto* duties conflict, overall duty exists - softens RD, challenges requirement 5/9). Reject OIC (rare and costly).

  **Confidence & Least Sure Requirement:**

  *   **Overall Confidence:** High (8/10). This list captures the core conceptual terrain and pressures of the debate as reflected in standard literature and seminar discussions.
  *   **Least Sure Requirement:** Requirement 9 (**"Wrongness Residue"**). While central to strong dilemma views, it's the most contested. Some compelling theories (e.g., certain forms of threshold deontology or sophisticated consequentialism) might explain residue (Requirement 8) purely through tragic loss or non-moral agent-regret, without needing to affirm that the chosen act was *wrong* (*pro tanto* or otherwise). It might be derivable from 8 or be a specific camp commitment.
