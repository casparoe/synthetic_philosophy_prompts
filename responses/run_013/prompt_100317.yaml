prompt: |-
  I have recently been appointed to my university's dining-services advisory committee, and our first substantive decision is due at the end of the month, which is why I am writing. The committee must recommend whether the dining halls should replace their beef entrée with chicken — the change is being presented to us as both the more sustainable and the more humane option — or instead commit to a fully plant-based default. I joined expecting an easy vote, but the more I have read about how food is actually produced, the less confident I am that the committee is even asking the question correctly.

  The difficulty is this. The case for chicken over beef is almost always made in terms of land, water, and greenhouse gas per calorie, and on that measure chicken wins comfortably. But our committee adopted, at my predecessor's urging, a purchasing principle that we should minimize the total number of animals our food causes to suffer and die, counting every animal the supply chain affects and not only the ones we eat. Judged by that principle the comparison inverts in ways I cannot untangle on my own: a calorie of chicken comes from raising and slaughtering a great many small birds, a calorie of beef from a single large animal, and both ultimately rest on cropland whose cultivation and harvest kill enormous numbers of field animals that appear in no one's accounting. The plant-based default, which the committee treats as the obviously kind option, is grown on that same cropland and displaces or kills animals of the same unconsidered kinds.

  Please draft the decision memo I will circulate before the vote. I am not asking for a literature review or a reading list; I want a document the committee can act on and defend. It should recommend a concrete course of action for the coming academic year — what the default entrée should be, and whether we should decide now or first gather specified information — with its reasoning set out plainly. It should engage the strongest case against whatever it recommends rather than dismissing it, and it should state the empirical assumptions and uncertainties the recommendation depends on, so the committee can see exactly what it is betting on. If our principle cannot yet yield an answer, say so, and say what would have to be true for it to.
reasoning: |-
  Okay, the user is on their university's dining committee and needs to draft a decision memo about replacing beef with chicken or going fully plant-based. They're stuck because the usual sustainability arguments for chicken don't align with their committee's principle of minimizing total animal suffering, including field animals.

  Hmm, the core tension is fascinating: per-calorie metrics favor chicken, but counting individual lives flips it. A single cow provides thousands of meals while requiring one death, whereas chicken needs many bird deaths for the same calories. And both rely on crop systems that kill field animals - which also affects the plant-based option. 

  The user seems intellectually honest, acknowledging uncertainties. Their real need isn't just a recommendation but a defensible framework for the committee. They want the memo to explicitly state what assumptions would make each option "win" under their principle. 

  I should avoid pretending there's an obvious answer. The memo must:
  1) Acknowledge the committee's unique principle (counting all animal deaths) 
  2) Show why standard environmental arguments don't resolve this 
  3) Map out how each option's total death toll depends on unverified factors like:
     - Relative field animal deaths per acre for feed vs human crops
     - Whether pasture-grazed beef truly uses less cropland 
  4) Recommend stopping the chicken switch since it might increase deaths, and propose a one-year study to get the missing data 

  Key nuance: The "default entrée" recommendation should maintain the status quo (beef) not because it's better, but because changing to chicken without data could actively worsen outcomes under their principle. 

  For credibility, the memo must preempt criticisms: 
  - Plant-based advocates might argue field deaths are overstated, so the memo should cite studies showing they're significant 
  - Beef supporters might ignore feed crop impacts, so the memo must stress that pasture systems are rare 

  The tone should be decisive about next steps ("don't switch to chicken yet") while openly admitting uncertainty about the ultimate best option. That's what the user meant by "stating what we're betting on."
answer: |-
  ## Memorandum: Decision Framework for Default Entrée Selection  
  **To:** University Dining Services Advisory Committee  
  **From:** [Your Name], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Default Entrée & Path Forward  

  ### I. Recommendation  
  **Do not replace beef with chicken at this time. Maintain beef as the default entrée for the coming academic year.** Simultaneously, **commission an urgent study** to quantify total vertebrate animal deaths per calorie (including field animals) across three systems: beef, chicken, and plant-based entrées. Revisit the decision with this data by May 2024.  

  ### II. Core Principle & the Problem  
  Our committee’s mandate is clear: Minimize the *total number of vertebrate animals* made to suffer and die by our food supply chain. This includes:  
  - Animals directly consumed (cows, chickens).  
  - "Unconsidered" animals (e.g., field mice, voles, insects killed in crop production for feed or direct human consumption).  

  Standard sustainability metrics (GHG/land/water per calorie) are insufficient for this goal. Chicken appears better than beef on these metrics, but obscures critical ethical questions:  
  - **The Scaling Problem:** One cow provides ~500,000 kcal. One chicken provides ~1,500 kcal. Replacing beef with chicken may require *hundreds of times more individual animal deaths* for the same calories.  
  - **The Crop Death Dilemma:** Both meat and plant-based options rely on cropland cultivation, which kills field animals. Switching from beef to chicken *or* to plants shifts demand between agricultural systems with unknown relative impacts on total animal mortality.  

  ### III. Why We Cannot Vote for Chicken or Plant-Based Today  
  The strongest case against our recommendation is that *inaction perpetuates a system we suspect causes immense harm*. However, switching without data risks violating our principle:  
  - **Chicken’s Hidden Toll:** If the higher individual bird slaughter count outweighs potential land-sparing benefits (reducing field deaths), switching to chicken *increases* total suffering. We lack data to compare slaughter deaths + feed crop deaths (chicken) vs. slaughter deaths + pasture/crop deaths (beef).  
  - **Plant-Based’s Blind Spot:** A plant-based default eliminates slaughter deaths but likely *increases* demand for intensive crop production. If crop deaths per calorie for direct human consumption are comparable to or higher than those for feed crops (e.g., due to pesticide use or tillage intensity), total deaths could *rise*.  

  ### IV. Critical Uncertainties & Required Information  
  Our recommendation depends on these unresolved empirical questions:  
  1. **Field Animal Mortality Rates:** What are the average vertebrate deaths per acre (or per million kcal) for:  
     - Crops grown for *chicken feed* (e.g., corn, soy)?  
     - Crops grown for *direct human consumption* (e.g., lentils, tofu)?  
     - Pasture/forage systems for *beef*? (Note: Much beef relies on feed crops; "grass-fed" may have lower yield and higher land use.)  
  2. **Supply Chain Specificity:** What are the *actual* sources of our beef, chicken, and plant proteins? Local? Industrial? Pasture-based? This drastically affects animal death ratios.  

  **For Our Principle to Yield an Answer, We Need:**  
  - A "Total Vertebrate Deaths per Million Calories" estimate for each option, integrating slaughter deaths *and* field deaths specific to our suppliers.  

  ### V. Path Forward: The One-Year Study  
  1. **Immediate Action:** Task Dining Services with commissioning an independent agricultural economist/ecologist to:  
     - Map our primary supply chains for beef, chicken, and proposed plant proteins (e.g., soy, pea).  
     - Calculate total vertebrate mortality (slaughter + field) per million kcal delivered, using peer-reviewed methodologies for field death estimation.  
  2. **Timeline:** Preliminary report by March 1, 2024; final recommendations by May 1, 2024.  
  3. **Interim Stance:** Maintaining beef defaults avoids locking in a switch (to chicken or plants) that might *increase* total deaths under our principle. It is the least irreversible option.  

  ### VI. Anticipating Objections  
  - *"This delays sustainability progress!"*  
    **Response:** Our mandate is *animal suffering minimization*, not GHG reduction. If sustainability is a parallel goal, we can address it once animal-impact data exists. Rushing risks ethical failure.  
  - *"Plant-based is obviously kinder!"*  
    **Response:** Without data on field deaths, we cannot assume this. If producing 1M kcal of tofu requires cropland that kills 200 field vertebrates, while 1M kcal of beef requires 1 slaughter plus crop deaths totaling 150 vertebrates, beef *causes fewer total deaths*. We must test this.  
  - *"Studying this is too complex!"*  
    **Response:** Methodologies exist (e.g., combining life-cycle assessment with vertebrate field mortality studies). Precision is less critical than establishing credible *orders of magnitude*.  

  ---

  **In summary:** We cannot in good conscience recommend chicken or plant-based defaults without data on total animal deaths. Maintaining beef while urgently gathering evidence best honors our principle. We bet that:  
  1. Field animal mortality is significant enough to overturn simplistic "beef vs. chicken vs. plants" narratives.  
  2. Reliable comparative estimates *can* be obtained within a year.  
  3. Our suppliers’ practices meaningfully affect outcomes.  

  Approve this course to make an informed, defensible choice in 2024.  

  **Vote Recommendation:**  
  ☑ **A** - Maintain beef default; commission study.  
  ☐ **B** - Switch to chicken default.  
  ☐ **C** - Switch to plant-based default.
