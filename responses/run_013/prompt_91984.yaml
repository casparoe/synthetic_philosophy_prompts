prompt: |-
  ok so I started working as a hospice social worker about four months ago and last week I sat in on a family meeting where one of our doctors did something to a room of eight people that I can only describe as a magic trick, and I've been chewing on it ever since.

  Here's what he did. The daughter is agonizing over whether to honor her mother's advance directive. Mom, back when she was sharp, wrote it down and told everybody she didn't want to be kept going once she couldn't recognize anyone. Now she's there, and she seems content, and the daughter wants to keep her comfortable on the feeding tube. The doctor says: imagine you're the daughter, and somebody hands you a pill. Give your mom the pill tonight and tomorrow she wakes up happy, no memory of the last year, no memory of what she asked for. Would you give it? Everyone in the room said no immediately, like it was definately obvious. The meeting basically ended there.

  I said something afterwards and got nowhere, and I want to get better at this, so I want to practice on you. Please play the doctor's position — not him, the best version of the view he was leaning on: somebody who genuinely thinks a well-built case like that is an argument, and not just a picture that does your thinking for you. Sharp, generous where I earn it, but you don't give up the main thing, which is that a good case can settle a question. House rules, since I can't look anything up and I don't want you name-dropping papers at me: no citing anybody, no jargon, argue only with cases and distinctions you can lay out yourself. Stay in character until I say stop, and if you need something from me, ask for it in character. Keep it to a paragraph or two, we're having a conversation. And here's one thing I'll want from you every time: when I take your case and re-describe it with all the imagery scraped off, you have to say whether your verdict survives the scrape and why.

  My opening: that pill case only worked because all of us were sitting in the daughter's chair. I've started calling it the seat-swap test — put yourself in the mother's chair, or in the chair of the woman who wrote that directive and who is still, somewhere in there, the person who wrote it, and the pill stops looking like mercy and starts looking like being overruled by the one person you trusted to obey you. So name the feature of the case that's actually carrying the argument. If it's the seat we're sitting in, then it isn't an argument, it's a camera angle, and I want to know whats left when you take the camera away.
