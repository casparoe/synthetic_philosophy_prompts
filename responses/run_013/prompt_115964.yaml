prompt: |-
  I chair the algorithmic-fairness review board for a public-sector data consortium. Our charter requires us to approve, reject, or condition the deployment of predictive tools used in pretrial risk assessment, child-welfare screening, and eligibility triage. We are not a court and we do not legislate definitions of fairness, but we must give written reasons, and our past decisions have become the practical precedent that applicants and advocates now cite. I need a recommendation on the case before us that is defensible as an extension of that precedent rather than a fresh start.

  Our record, in brief:

  - We rejected a pretrial risk score that was race-blind in its features, well calibrated within race, and more accurate than the human status quo, because it produced a higher false-positive rate for Black defendants. We wrote that a tool increasing the risk of unjust detention for a group already overrepresented in the carceral system cannot be justified by overall accuracy or calibration alone.
  - We approved a child-welfare screening tool that had equal false-positive and false-negative rates across race but was not calibrated within race; its scores overstated risk for Black families at every level. We reasoned that equal error rates prevented disparate removal, and that calibration mattered less because the score was not presented to families as a probability.
  - We rejected a hiring model that achieved near-perfect parity by including race as an explicit input. We did not hold that race-consciousness is categorically forbidden; we held that the employer had failed to show that race-neutral alternatives were unavailable and that its use of race was not narrowly tailored to a specific finding of past discrimination. We left open whether a narrowly tailored race-conscious remedy could ever satisfy the charter.
  - We approved a race-blind eligibility model that used ZIP code as a feature and produced large racial disparities, because we found ZIP code to be a causally relevant measure of local labor-market conditions rather than a mere proxy for race. We conditioned approval on an annual audit.
  - We rejected a model that was individually fair in the sense that similar applicants received similar scores, because the similarity metric was contested and the model produced large group disparities. We reasoned that individual fairness cannot substitute for group-level scrutiny.
  - We approved a decision-support tool with unequal error rates and poor calibration because a human caseworker made the final decision and the tool's output was only one input among many. We reasoned that our strictest error-rate requirements apply to tools that make or effectively determine decisions, not to tools that merely advise.
  - We have also approved a tool that satisfied parity for race and sex separately while failing for Black women, on the ground that our charter enumerates single-axis categories and we had no intersectional standard. We noted the issue but did not adopt a rule.

  Now before us is Tool G, a pretrial detention recommendation system. It is race-blind in its features. It is calibrated within race overall, so that a given score corresponds to the same probability of the outcome in each group. It has equal false-positive rates for Black and white defendants overall. It has a higher false-negative rate for white defendants than for Black defendants. A proposed race-conscious post-processing adjustment would equalize both false-positive and false-negative rates for Black and white defendants overall. But the adjustment would make the scores uncalibrated within race, require the tool to use race at the post-processing stage, and, according to an intersectional audit, leave a substantial false-positive-rate disparity for Black women relative to white women and Black men. Tool G predicts arrest rather than offending. It is used to recommend detention, but a judge makes the final decision after seeing the score. The vendor argues that the current version is already calibrated and race-blind, and that the adjustment is unnecessary because the judge is in the loop. The public defender's office argues that the current version's equal false-positive rate is an artifact of the base-rate difference, that the higher false-negative rate for white defendants means white high-risk defendants are released, and that the adjustment is the only way to satisfy the board's own error-rate commitments. The board's charter says we must consider both the accuracy of the tool and the equitable distribution of its errors.

  I want a recommendation. Please do the following:

  1. Decide what the board should do about Tool G, and identify the closest analog among our past cases.
  2. State the candidate rules that fit our past verdicts equally well, and say what each rule predicts for Tool G.
  3. Give your best guess about which rule is actually doing the work in our precedents, with reasons, and say what principle we would be adopting if we approved the adjustment and what principle we would be adopting if we rejected it.
  4. Name a further case we have not yet decided that would best discriminate among the candidate rules, and say what verdict on that case would tell us which rule we are actually following.
  5. Be explicit about the impossibility results: which combinations of calibration, error-rate parity, and race-blindness are jointly unsatisfiable when base rates differ, and which of our stated commitments are in genuine tension rather than merely superficially so. Also say where infra-marginality and the choice of target variable—arrest rather than offending—bear on the analysis.
  6. Separate what is settled from what is genuinely contested among people who work on algorithmic fairness. Do not present a contested normative position as the consensus. If your recommendation depends on a contested view, say so explicitly.

  No citations or reading list is needed; I want the reasoning, not the literature.
reasoning: |-
  Hmm, the user chairs an algorithmic-fairness review board and needs help deciding on a pretrial risk assessment tool called Tool G. They've provided detailed precedent cases and want a recommendation that extends their existing jurisprudence rather than starting fresh.

  Looking at their precedents, I notice several patterns: They prioritize group fairness over calibration (pretrial rejection), care about error rate parity when decisions are consequential (child-welfare approval), reject race-conscious models without narrow tailoring (hiring rejection), accept proxies when causally justified (ZIP code approval), reject individual fairness without group scrutiny (similarity metric rejection), and apply lower standards for advisory tools (decision-support approval). The intersectional gap in their precedent is notable.

  For Tool G specifically: It's race-blind, calibrated within race, has equal FPR but unequal FNR (higher for whites). The proposed adjustment would equalize error rates but break calibration and require race input. The intersectional audit shows it would still leave FPR disparity for Black women.

  Key tensions here: 
  - Their past emphasis on FPR parity (pretrial case) conflicts with accepting unequal FNR (child-welfare case)
  - Race-blindness preference (hiring case) conflicts with error-rate prioritization
  - Advisory nature of the tool (like decision-support case) argues for leniency
  - Intersectional disparity remains unaddressed by either version

  The impossibility theorems loom large here - you can't have calibration, error rate parity, and race-blindness when base rates differ. Tool G's arrest (vs offending) prediction raises validity concerns, as FPR parity on arrests may not reflect actual risk if policing is biased.

  My recommendation would be to reject Tool G in its current form but also reject the proposed adjustment. The closest analog is their first pretrial case where FPR disparity was decisive. The race-conscious adjustment creates new problems while solving others, and fails their narrow-tailoring test from the hiring case. The advisory nature isn't sufficient justification given the high stakes of detention decisions.

  For the board, they need to clarify whether FPR parity is their cardinal principle (as pretrial precedent suggests) or if they accept tradeoffs. A good test case would be a child-welfare tool with FPR disparity but where removal stakes are similarly high - that would force them to choose between their child-welfare and pretrial precedents.

  I should be transparent that the FPR priority reflects a specific normative choice that isn't universally agreed upon in fairness literature. The calibration vs error rate debate remains contested, as does how to handle intersectionality. The arrest prediction issue deserves explicit skepticism in the decision rationale.
answer: |-
  Here is a reasoned recommendation for Tool G, grounded in your precedent:

  ### 1. Recommendation and Closest Analog
  **Recommendation:** Reject Tool G in its current form **and** reject the proposed adjustment. Require resubmission of a tool that prioritizes equal false-positive rates (FPR) without creating new calibration or intersectional disparities.  
  **Closest Analog:** Your first pretrial risk assessment rejection (higher FPR for Black defendants). Here, FPR disparity remains unacceptable in high-stakes detention decisions, mirroring that precedent's core concern.

  ### 2. Candidate Rules and Predictions for Tool G
  Three rules fit your precedent equally well:  
  - **Rule A (FPR Primacy):** In high-stakes decisions (e.g., detention, removal), equal FPR is non-negotiable to prevent unjust harm to disadvantaged groups. Calibration and FNR are secondary.  
    *→ Predicts: Reject current Tool G (equal FPR overall but higher FPR for Black women). Reject adjustment (worsens FPR for Black women).*  
  - **Rule B (Stakes-Contextual):** Error-rate parity (FPR/FNR) is required only for tools that *determine* decisions. Advisory tools need only calibration + no egregious disparities.  
    *→ Predicts: Approve current Tool G (advisory, calibrated, no extreme FPR disparity overall).*  
  - **Rule C (Narrow Tailoring):** Race-conscious fixes are permissible *only* if narrowly tailored to correct a specific, proven disparity and race-neutral alternatives fail.  
    *→ Predicts: Reject adjustment (not narrowly tailored, creates intersectional disparity, ignores race-neutral fixes like reweighting features).*

  ### 3. Best Guess on Active Rule & Principles Adopted
  **Active Rule:** **Rule A (FPR Primacy)** is doing the work, especially in pretrial contexts.  
  - **Why:**  
    - Your first rejection centered FPR disparity despite calibration and race-blindness.  
    - Child-welfare approval tolerated miscalibration *because* error rates were equal.  
    - Hiring rejection prioritized fairness (even if achieved via race) over narrow technical compliance.  
    - Tool G’s "equal FPR overall" masks intersectional FPR disparity for Black women, violating the *spirit* of FPR parity.  
  - **Principles:**  
    - **If you approve the adjustment:** You adopt *"Error-rate parity (even if race-conscious) overrides calibration and intersectional concerns in pretrial contexts."* This contradicts your hiring rejection (no narrow tailoring) and ignores the Black women disparity.  
    - **If you reject the adjustment but approve current Tool G:** You adopt *"Calibration + advisory role excuse FPR disparities."* This contradicts your first pretrial rejection and undermines FPR primacy.  

  ### 4. Discriminatory Test Case  
  **Case:** A *child-welfare screening tool* with:  
  - Calibration within race  
  - Equal FNR across race  
  - Higher FPR for Black families  
  - Human final decision-maker  
  **What it reveals:**  
  - **Rule A (FPR Primacy):** Rejects (FPR disparity in high-stakes removal context).  
  - **Rule B (Stakes-Contextual):** Approves (advisory tool + calibrated).  
  - **Rule C (Narrow Tailoring):** Ambiguous (no race-conscious fix proposed).  
  A rejection here confirms **Rule A**; approval confirms **Rule B**.  

  ### 5. Impossibilities, Tensions, and Technical Factors  
  - **Impossibilities:** When base rates differ, **calibration + equal FPR + equal FNR + race-blindness is mathematically impossible**. Tool G "solves" this via unequal FNR (higher for whites) and equal FPR overall—but this masks infra-marginality and intersectionality.  
  - **Genuine Tensions:**  
    - **FPR parity vs. calibration:** Equalizing FPR requires sacrificing calibration if base rates differ (as adjustment proposes).  
    - **Race-blindness vs. error parity:** Achieving strict error parity typically requires race-awareness (impossible otherwise under base-rate differences).  
    - **Overall parity vs. intersectionality:** Achieving parity on single axes (race/gender) can worsen intersectional disparities (e.g., Black women here).  
  - **Infra-marginality:** Tool G’s "equal FPR overall" may hide that Black defendants at the margin (e.g., score = threshold) have higher FPR than comparable whites. Your precedents ignore this; it remains contested.  
  - **Target variable (arrest vs. offending):** Predicting arrest (not offending) inherits policing biases. **This is critical:** FPR "parity" on arrests may still reflect over-policing of Black communities. Your charter’s "accuracy" requirement is arguably violated if the target is biased.  

  ### 6. Settled vs. Contested  
  - **Settled in your precedent:**  
    - Group fairness > individual fairness or calibration in high-stakes decisions.  
    - FPR parity is paramount in detention/removal contexts.  
    - Race-blindness is insufficient if disparities persist.  
    - Advisory tools get more leniency (but pretrial is high-stakes despite judges).  
  - **Contested (no consensus):**  
    - **FPR vs. FNR tradeoffs:** Whether higher FNR for advantaged groups (white defendants) is acceptable. *Your recommendation depends on prioritizing FPR—a contested normative choice.*  
    - **Intersectionality:** Whether single-axis parity suffices. Your precedent avoids this; rejecting the adjustment due to Black women’s FPR disparity would be a *new* stance.  
    - **Target variable validity:** Whether predicting "arrest" is inherently unfair. This is debated in fairness literature but unresolved in your precedent.  

  ### Final Recommendation Rationale  
  Reject both versions of Tool G because:  
  1. **FPR disparity for Black women** persists in both versions (current overall parity masks it; adjustment worsens it). This violates the *principle* of your first pretrial rejection.  
  2. The adjustment is **not narrowly tailored** (per hiring rejection): It uses race crudely, ignores intersectionality, and race-neutral alternatives (e.g., optimizing for FPR parity during training) likely exist.  
  3. **Advisory role is insufficient:** Pretrial detention is high-stakes; your first rejection treated a similar tool as determinative. Judges may over-rely on scores.  
  4. **Target variable flaw:** Predicting arrest (not offending) risks encoding bias, undermining "accuracy" per your charter.  

  **Require resubmission** that: (a) Prioritizes equal FPR across races *and* intersections, (b) Uses race-neutral methods first, and (c) Addresses validity of "arrest" as a target. This extends your precedent’s FPR focus and rejects quick fixes that ignore intersectionality.
