prompt: |-
  A few of us got into a long, slightly wine-fuelled argument at the weekend about etiquette abroad, and I never got a straight answer out of it. It started because my mate Dan — just back from a month in the States — was insisting he'd been morally obliged to tip 20% everywhere, and that stiffing a waiter wouldn't just have been rude but actually wrong; when I pushed him on why, he kept saying 'when in Rome, do as the Romans do', as if that settled the matter. Then someone pointed out that on the same trip he'd jaywalked all over the place, which is illegal there, so by his own slogan he should have been standing at the lights like a lemon at 2am; and a third friend said the slogan actually cuts against him, because in plenty of countries queueing isn't really a thing and you're meant to push in, so the visiting Roman should shove her way to the front as well. We went round in circles for about an hour and nobody could actually say what the sentence means, so I'd like you to seperate it out for me.

  Take 'when in Rome, do as the Romans do' and lay out the distinct precise claims it could be making, from the trivially true to the seriously contentious. Is it a prediction about what will happen to you (you'll get funny looks), a piece of prudence, a claim about what's polite, or a claim about what you're genuinely morally required to do? Is the force of it that local conventions themselves create obligations for visitors, or that the obligations were always there and the convention is merely evidence of what they are, or something stronger — that in these everyday matters there's nothing more to the moral question than what the locals do? Does it cover only things like tipping and queueing, or does it extend to cases where the local custom is one we'd otherwise call morally appalling? And what happens when the local convention comes apart from the local law, which jaywalking seems to be exactly: does the slogan tell you to do what people actually do, or to obey the rules? I'd like a verdict on each reading — platitude, plausible-but-substantive, or plainly false — plus your best guess at which reading Dan was actually reaching for, and whether any of them really gets him his conclusion about the tip, or whether he's smuggling in something the slogan doesn't say. Lay it out as a menu I can forward to the group chat rather than picking one reading and defending it. Please write it in British English — we're in the UK and someone will definately start a fight if you say 'obligated'.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a wine-fueled argument about the phrase "when in Rome, do as the Romans do." The main points revolve around tipping in the US, jaywalking, and queueing etiquette. The user wants a clear breakdown of what the phrase actually means in different contexts.

  First, I need to identify all possible interpretations of the saying. The user mentioned several aspects: is it about social prediction, prudence, politeness, or moral obligation? Also, how does it apply when local customs conflict with laws or when those customs might be morally questionable?

  Starting with the predictive aspect. If Dan tips 20% to avoid awkwardness, that's straightforward. But the user also brought up jaywalking—where locals break the law. So the phrase might not cover legal vs. customary actions. Then there's the moral angle. Does following local customs become a duty? But what if the custom is harmful? That could lead to problematic conclusions, making this interpretation contentious.

  Next, I should consider the source of the obligation. Are conventions creating the obligation, or do they reveal existing norms? The user's friend Dan might be leaning towards conventions creating obligations, but that might not hold under scrutiny, especially with conflicting examples like jaywalking.

  The user also wants to know if the phrase applies to morally appalling customs. If "when in Rome" means following any local practice, that could justify unethical behavior, which is clearly unacceptable. So that interpretation is plainly false.

  Another layer is the gap between local laws and actual behavior. Jaywalking is illegal but commonly practiced. Does the phrase prioritize custom over law? The user's group pointed out Dan's inconsistency here—following tipping customs but not jaywalking laws. This shows the ambiguity in the slogan.

  Dan's position on tipping seems to be that it's a moral obligation based on local norms. But the phrase alone doesn't specify why tipping is obligatory while jaywalking isn't. He might be conflating the slogan with other principles, like fair wages for service workers, which isn't inherent in "when in Rome."

  I need to present each interpretation clearly, label them as platitude, plausible, or false, and address Dan's reasoning. Highlighting the inconsistency with jaywalking will show that the slogan isn't sufficient on its own to justify his tipping stance. The user probably wants this structured so their group chat can see the flaws in Dan's argument and understand the nuances of cultural adaptation.
answer: |-
  Right, let's dissect "When in Rome..." like a slightly overcooked Sunday roast. Here’s your menu of interpretations, graded for plausibility and applied to Dan’s tipping dilemma (and jaywalking scandal), all in proper British English:

  **The Interpretations Menu:**

  1.  **The Predictive Reading (What *Will* Happen):**
      *   **Claim:** If you deviate from local customs (e.g., tipping 0% in the US), locals will likely react negatively (confusion, disapproval, worse service, funny looks).
      *   **Verdict:** **Platitude.** Generally true for noticeable breaches of strong social norms. Getting no tip *will* upset a US waiter.
      *   **Covers:** Tipping, queueing (pushing in where not done *will* cause annoyance), dress codes.
      *   **Law vs. Custom (Jaywalking):** Predicts *social* reactions, not legal ones. Jaywalking is common, so *not* doing it might make you stand out, but doing it risks a fine – the slogan doesn't predict legal consequences. Ambiguous.
      *   **Appalling Customs?** Predicts local reaction, not morality. If the custom is appalling *but locally accepted*, deviating might provoke hostility. Doesn't make the custom right.
      *   **Gets Dan his Tip?** Only as a warning of social fallout, not a *moral* argument. Dan seemed to want more than "you'll annoy the waiter".

  2.  **The Prudential Reading (What's Wise/Self-Interested):**
      *   **Claim:** Adapting to local norms is the safest, easiest, and most self-interested course of action to avoid hassle, get better service, or fit in smoothly (e.g., tipping 20% avoids awkwardness/complaints; queueing politely avoids confrontation).
      *   **Verdict:** **Plausible-but-Substantive.** Often true, especially for visitors unfamiliar with nuances. But not *always* the wisest (e.g., participating in a corrupt "local custom" for ease).
      *   **Covers:** Tipping, queueing, basic manners, dress.
      *   **Law vs. Custom (Jaywalking):** Prudence might suggest *following the actual common behaviour* (jaywalking if everyone does) *or* obeying the law to avoid a fine, depending on perceived risk. The slogan doesn't specify. Contradictory advice possible.
      *   **Appalling Customs?** Prudence might dictate *going along* to avoid danger in a repressive regime, but this is about self-preservation, not endorsement. Doesn't make it morally right.
      *   **Gets Dan his Tip?** Yes, but weakly. It gives Dan a *practical reason* ("tip or risk poor service/conflict"), not the *moral obligation* he claimed.

  3.  **The Politeness/Courtesy Reading (What's Considerate):**
      *   **Claim:** Following local customs is a way of showing respect for your hosts and their culture. It's the courteous thing to do (e.g., tipping 20% acknowledges the US service wage structure; queueing orderly shows respect for fellow shoppers).
      *   **Verdict:** **Plausible-but-Substantive.** A strong argument for many everyday norms. Courtesy often *requires* adapting to local expectations where they differ from your own.
      *   **Covers:** Tipping, queueing, greetings, gift-giving, table manners.
      *   **Law vs. Custom (Jaywalking):** Politeness is about social interaction. Jaywalking is a breach of law, not primarily a social nicety. The slogan would lean towards *courtesy* (doing what locals do) only if jaywalking were the universal, *polite* norm (which it isn't – it's just common). Weak application here.
      *   **Appalling Customs?** Politeness does *not* require participating in or endorsing deeply harmful or immoral acts, even if "local". One can be respectfully silent without joining in.
      *   **Gets Dan his Tip?** **Yes, strongly for this context.** This is likely the core of Dan's *unspoken* reasoning. Tipping in the US is widely seen as a fundamental part of fair interaction within their service industry system. Not tipping isn't just cheap, it's widely perceived as deeply disrespectful to the worker.

  4.  **The Conventionalist Moral Obligation Reading (Local Rules Create Duty):**
      *   **Claim:** The mere existence of a strong local convention *itself creates* a genuine moral obligation for visitors to follow it. "Because that's what they do here" is the *source* of the duty (e.g., you *must morally* tip 20% *because* it's the US custom).
      *   **Verdict:** **Contentious / Often Plainly False.** This makes morality dangerously relative. While conventions can *structure* moral duties (see #5), they don't *create* them from nothing.
      *   **Covers:** Tipping, queueing? Only if you accept this controversial premise.
      *   **Law vs. Custom (Jaywalking):** Creates confusion. Does the *convention* (jaywalking) or the *law* (don't jaywalk) create the moral obligation? The slogan is silent, leading to contradiction (Dan jaywalked, breaking the law but following custom).
      *   **Appalling Customs?** **Fatal Flaw:** By this reading, if slavery, sexism, or homophobia were strong local customs, visitors would be *morally obliged* to participate. This is reductio ad absurdum. Clearly false.
      *   **Gets Dan his Tip?** On its own, **no.** This reading collapses under the weight of appalling customs and the jaywalking contradiction. It can't reliably generate moral obligations.

  5.  **The Moral Signpost/Context Reading (Conventions Reveal Existing Duties):**
      *   **Claim:** Local conventions often reflect or implement deeper, universal moral principles (like fairness, respect, keeping promises) within a specific social/economic context. The convention *signals* how to fulfil an existing duty *here* (e.g., the US tipping custom signals how to ensure service staff get fair remuneration in *their* system; queueing implements fairness in access).
      *   **Verdict:** **Plausible-but-Substantive.** This avoids the pitfalls of pure conventionalism. Conventions provide vital context for applying general principles.
      *   **Covers:** Tipping (fair wages), queueing (fairness/order), many social rituals (showing respect).
      *   **Law vs. Custom (Jaywalking):** Focuses on the underlying principle. Law aims for safety/order; widespread jaywalking might signal the law is poorly calibrated or that safety is reasonably assured in that context *despite* the law. The moral obligation might be to *be safe and considerate*, which could align with *either* obeying the law *or* following safe custom, depending on circumstance. Unclear from slogan alone.
      *   **Appalling Customs?** If a convention violates fundamental morality (e.g., discrimination), it *fails* as a signpost for genuine duty. The underlying principle (human dignity) overrides the local distortion. The slogan doesn't apply.
      *   **Gets Dan his Tip?** **Yes, strongly.** This best supports Dan's *intuition* without collapsing. The tipping convention isn't arbitrary; it's the mechanism for achieving fair pay in the US service industry context. Stiffing the waiter isn't just breaking a custom, it's depriving them of expected, earned income within that system – a breach of fairness.

  **The Verdict on Dan:**

  *   **What Dan Reached For:** Almost certainly a muddle of **#3 (Politeness/Courtesy)** and **#5 (Moral Signpost)**, leaning heavily on the tipping custom reflecting a **fairness obligation** within the US system. He *said* "morally obliged" and used the slogan, but his underlying reasoning was likely "it's how they get paid fairly here, so not tipping is stiffing them."
  *   **Did the Slogan Get Him There?**
      *   **On its own? No.** The bare slogan (#4 Conventionalism) is too weak and contradictory (as jaywalking proved).
      *   **With Unpacking? Yes, via #3 or #5.** Dan smuggled in the crucial premise that the US tipping convention *embodies* a fairness obligation. The slogan *points* to the convention, but the *moral force* comes from the underlying principle (fair pay) that the convention operationalises in that context. "When in Rome..." told him *what* to do; his unstated belief in fairness told him *why* it was morally required *in this specific case*.
  *   **The Jaywalking Counter:** Spot on. It exposed the slogan's ambiguity (#1 Prediction, #2 Prudence, #4 Conventionalism all give conflicting advice vs law) and that Dan wasn't consistently applying a pure "local convention creates moral duty" reading (#4). He was selectively applying the slogan where he felt an underlying principle (fairness for tips) was at stake, but not for jaywalking (where the underlying principle - safety - might not have felt as strongly violated by crossing an empty street).

  **The Group Chat Summary:**

  > **"When in Rome..." Breakdown:**
  > *   **Predicts funny looks?** (Platitude) - Yes, but not why Dan cared.
  > *   **Says it's wise?** (Plausible) - Practical, not moral.
  > *   **Says it's polite?** (Plausible) - **Dan's main vibe.** Not tipping *is* rude in the US.
  > *   **Says convention = moral law?** (False) - Leads to "must be sexist if locals are" nonsense. Dan didn't *really* mean this.
  > *   **Says convention shows *how* to be fair/respectful?** (Plausible) - **Dan's hidden reasoning.** US tipping = how you pay staff fairly there.
  >
  > **Dan's Tip:** He's right it's rude & arguably wrong (due to fairness), but "When in Rome..." alone is wobbly. He smuggled in "fair pay" to make it moral. The slogan just pointed him to the custom.
  >
  > **Jaywalking:** Proves the slogan's fuzzy. It doesn't resolve law vs actual behaviour. Dan followed custom (jaywalked) not law, contradicting a strict "do as Romans do = moral law" reading. He used the slogan selectively where an underlying principle (fairness) was clear to him.
  >
  > **Verdict:** The slogan is a useful nudge towards courtesy & context, **not** a magic moral rule-maker. Dan was mostly right on the tip for better reasons than he gave, but his slogan couldn't survive the jaywalking ambush without backup. Next round's on him?
