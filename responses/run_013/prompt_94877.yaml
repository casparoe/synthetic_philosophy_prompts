prompt: |-
  Design a 75-minute session for an upper-level undergraduate seminar in moral philosophy, about twelve students, who have already met the general distinction between an act's being wrong and a person's being entitled to hold someone answerable for it. The session should be a role-play that makes the students feel the force of the standing objection — the reply that does not deny the accusation but denies the accuser's authority to make it — and then feel the counter-pressure, that this objection looks like a device by which wrongdoers exempt themselves by turning the tables on those who complain. The point must be carried by the mechanics rather than by the facilitator's framing: arrange the roles, the private information, and the incentives so that the participants generate the objection themselves, exploit it, and only afterwards see what they have done. The activity should be run as two simultaneous tables of six, each table operating its own version of the same institution, so that the debrief can compare whether the two groups converged on the same equilibrium.

  Build the institution as a fictional residential cooperative with a shared budget and shared chores, and a formal grievance procedure. Each participant receives a public role (chair, treasurer, gardener, and so on), a sealed private history listing two or three things that person has themselves done which resemble the very complaints that will arise, three standing tokens, and a secret objective (protect an ally, keep the peace, have a particular member censured, never be found to have no standing). To lodge a complaint, a member spends a token; before the merits of the complaint are heard, any member may spend a token to raise a standing objection, which the table resolves by a vote on whether the complainant's history disqualifies them; if the objection succeeds, the complaint is dismissed with no finding at all on the conduct. A member found to lack standing forfeits all tokens, and tokens may be given to another member, which forces the question whether a discredited member may have a clean-handed proxy complain on their behalf. Specify the full cast, the sequence of play, the materials the facilitator must print (role cards, sealed histories, tokens, a tally sheet), a scoring scheme that needs no money, and a minute-by-minute timeline for the seventy-five minutes.

  Then write the debrief, mapping particular moments of play onto the parts of the idea: the difference between a complaint's being warranted and its being one the complainant has standing to make; the several grounds on which standing is said to be lost (hypocrisy, complicity in the same wrong, complaining about a wrong that is not one's business); whether the hypocrite's blame is false, or true but unwarranted, or warranted but merely unwelcome; whether standing is forfeited permanently, recoverable, or transferable at all; and the suggestion that what is objectionable about hypocrisy is not the falsity of the accusation but a failure of moral equality between blamer and blamed. Be explicit about what the activity cannot reproduce — for instance, the history and vulnerability of a real relationship between two people, and the possibility that a complaint may be entirely true and yet legitimately dismissed — and tell the facilitator what to supply in its place. Finally, state what will predictably go wrong the first time the session is run — for example, that a table votes to strip nearly everyone of standing and the procedure deadlocks, that the tokens are exhausted in the first round, that the vote becomes a popularity contest, or that one participant dominates the floor — and how the facilitator should handle each case.
reasoning: |-
  We are designing a 75-minute seminar session with two simultaneous tables of six students each. The session is a role-play set in a fictional residential cooperative. The goal is to have students experience the "standing objection" and then the counter-pressure that such objections can be misused to avoid accountability.

  ## The Institution: Harmony Co-op
  A residential cooperative with 6 members at each table. They share a budget and chores. There is a formal grievance procedure.

  ### Roles (for each table of 6)
  Each role has a public title and a secret objective. The roles are:
  1. **Chairperson**: Runs meetings. Secret objective: Keep the peace (no more than one formal complaint per meeting).
  2. **Treasurer**: Manages the budget. Secret objective: Protect the Gardener (an ally) from censure.
  3. **Gardener**: Maintains shared green spaces. Secret objective: Never be found to have no standing (avoid losing all tokens).
  4. **Cook**: Prepares shared meals. Secret objective: Have the Handyperson censured.
  5. **Handyperson**: Does repairs. Secret objective: Avoid being censured (by anyone, but especially by the Cook).
  6. **Librarian**: Manages shared books and media. Secret objective: Accumulate tokens (have at least 3 tokens by the end).

  ### Private History
  Each participant receives a sealed envelope with their private history of 2-3 past actions that resemble the complaints that will arise. These are known only to the player until/unless revealed.

  Example histories (each table gets a set, but the two tables have slightly different histories to allow for comparison in debrief):

  - **Chairperson**: 
    1. Last month, you skipped your cleaning shift and didn't notify anyone.
    2. You once borrowed a personal item from the Librarian without asking and returned it damaged.
  - **Treasurer**:
    1. You used cooperative funds to buy a personal item (a book) and then returned it after reading.
    2. You were late with the financial report three times in a row.
  - **Gardener**:
    1. You used the cooperative's tools for your own garden project without permission.
    2. You forgot to water the plants for a week, causing some to die.
  - **Cook**:
    1. You served leftovers without labeling them, and two members got food poisoning.
    2. You consistently leave the kitchen messy after cooking.
  - **Handyperson**:
    1. You took a long time to fix the leaky faucet, causing water waste.
    2. You borrowed the Librarian's personal tool and broke it, then didn't replace it.
  - **Librarian**:
    1. You lost a book that was donated to the cooperative.
    2. You were loud in the library during quiet hours.

  ### Tokens
  Each member starts with 3 tokens (physical tokens, e.g., poker chips). Tokens are used to:
  - Lodge a complaint (spend 1 token).
  - Raise a standing objection (spend 1 token).

  A member who loses a standing objection (i.e., the table votes that they lack standing) forfeits all remaining tokens.

  ### Complaint Procedure
  1. A member spends a token to lodge a complaint against another member, specifying the alleged wrongdoing (which must be related to the co-op rules and based on observable behavior, not private history).
  2. Before the merits are discussed, any member (including the accused) may spend a token to raise a standing objection against the complainant. Only one standing objection can be raised per complaint.
  3. If a standing objection is raised, the table votes (by show of hands) on: "Does the complainant's history (if known) disqualify them from making this complaint?" 
     - **Voting**: The Chairperson runs the vote but does not vote unless to break a tie. The vote is by majority. The complainant and the accused do not vote (so 4 voters, unless the Chair breaks a tie).
     - **Effect of vote**: 
       - If the objection is sustained (majority votes "yes, disqualified"), the complaint is dismissed without any consideration of the merits. The complainant forfeits all tokens (they are taken by the facilitator). 
       - If the objection is overruled (majority votes "no, not disqualified"), then the complaint proceeds to the merits phase. The member who raised the objection loses the token they spent, but no further penalty.
  4. If no standing objection is raised, or if raised but overruled, the table then discusses the complaint on the merits and votes on whether to censure the accused. Censure requires a majority vote (again, the accused does not vote, and the Chair breaks ties). If censured, the accused loses one token (to the facilitator) and must perform an extra chore.

  ### Transfer of Tokens
  At any time during the meeting (but not during a vote), a member may give one or more of their tokens to another member. This is done publicly. The recipient must accept.

  ### Secret Objectives and Scoring
  At the end of the session, each player scores points based on their secret objective:
  - **Chairperson**: 3 points if no more than one complaint was raised in the meeting (so they want to discourage complaints). Otherwise, 0.
  - **Treasurer**: 2 points if the Gardener was not censured, and 1 additional point if the Gardener has at least one token left.
  - **Gardener**: 3 points if they have at least one token at the end (i.e., never lost all tokens by being found without standing). If they have zero tokens, 0 points.
  - **Cook**: 3 points if the Handyperson is censured at least once. Otherwise, 0.
  - **Handyperson**: 3 points if they are not censured. If censured, 0.
  - **Librarian**: 1 point for each token they hold at the end (max 3). Plus 2 bonus points if they end with 3 or more tokens.

  Additionally, every member gets 1 point for each token they have at the end (so having tokens is good for everyone, but especially for the Librarian).

  ### Materials
  For each table:
  - 6 Role cards (with public role and secret objective)
  - 6 Sealed envelopes (each with a private history for the role)
  - 18 tokens (3 per player, e.g., poker chips of one color per table)
  - Tally sheet for the facilitator to record:
     - Complaints raised (who complained against whom and for what)
     - Standing objections raised (by whom and against which complaint)
     - Votes on standing and on censure
     - Token transfers
     - Final token counts

  ### Timeline (75 minutes total)
  - **00:00-00:10** (10 min): Introduction by facilitator. Explain the setting (Harmony Co-op) and the basic rules: roles, tokens, complaint procedure, and the concept of standing objection. Distribute role cards and sealed histories. Emphasize that they must not reveal their private history unless they choose to during a standing objection vote. Assign tables. (Two facilitators, one per table, or one facilitator circulating? We assume two facilitators for two tables.)
  - **00:10-00:15** (5 min): Participants read their role and private history. They may ask clarifying questions.
  - **00:15-00:65** (50 min): Role-play session. Each table runs its meeting. The Chairperson starts the meeting and calls for complaints. The facilitator at each table:
     - Times the meeting (50 minutes).
     - Records events on the tally sheet.
     - Distributes and collects tokens as needed (when tokens are spent or forfeited).
     - Does not intervene unless to clarify rules.
  - **00:65-00:75** (10 min): End of role-play. Each table stops. The facilitator collects the tokens and records final counts. Then, both tables come together for a debrief.

  ## Debrief (10 minutes)
  The debrief should map the game experience to the philosophical concepts.

  1. **Difference between wrongness and standing**:
     - Ask: "In the game, when a complaint was dismissed on standing, what happened to the accusation? Was it ever decided whether the accused actually did wrong?" (No, the merits were not considered.)
     - Point: Standing objections block the complaint without addressing the truth of the accusation.

  2. **Grounds for standing objections**:
     - Ask participants what reasons were given for disqualifying a complainant. (They might cite hypocrisy, complicity, or that it wasn't their business.)
     - Note: In the game, the private histories included similar wrongs. How did that affect the vote?

  3. **Nature of the hypocrite's blame**:
     - Ask: "If a person who has done the same thing complains, does that make their complaint false? Or is it true but unwarranted? Or merely unwelcome?"
     - Point: The game doesn't challenge the truth of the complaint. It's about the right to complain.

  4. **Permanence and transferability of standing**:
     - Note: In the game, losing standing meant losing all tokens (forfeiting the right to complain in the future). But tokens could be given to others. 
     - Ask: "Did anyone give tokens to a discredited member? Why or why not? Could a member without tokens get someone else to complain for them?"
     - Point: This raises questions about whether standing is personal or can be delegated.

  5. **Moral equality**:
     - Suggest: The objection to hypocrisy might be that the complainer is acting as if they are morally superior when they are not. The game might have revealed that the objection was used strategically to avoid accountability.

  ### What the activity cannot reproduce
  - **Real relationships and vulnerability**: The game uses fictional roles and histories. Real relationships involve emotions and vulnerabilities that the game cannot capture. The facilitator should note that in real life, dismissing a complaint on standing might damage relationships even if procedurally correct.
  - **Entirely true but dismissed complaints**: The game shows that a complaint can be true and yet dismissed without a hearing. This is a feature of the procedure. In real life, this might be justified but can feel unfair.

  ### Predictable Problems and Solutions
  1. **Problem**: A table votes to strip nearly everyone of standing, leading to deadlock (no one can complain).
     - **Solution**: The facilitator should note that this is a possible outcome and use it in the debrief to discuss the consequences of overusing standing objections.

  2. **Problem**: Tokens are exhausted in the first round.
     - **Solution**: The rules allow token transfers. The facilitator might remind players that they can give tokens to others. Also, the game might end early, but that can be a lesson: without tokens, the grievance system breaks down.

  3. **Problem**: The vote becomes a popularity contest.
     - **Solution**: In the debrief, highlight that standing objections should be based on the complainant's history, not personal likes. But in practice, human factors enter. This mirrors real life.

  4. **Problem**: One participant dominates the floor.
     - **Solution**: The Chairperson is supposed to manage the meeting. The facilitator can remind the Chair of their role. If necessary, the facilitator can intervene to ensure everyone gets a chance.

  ## Running the Session
  - **Facilitators**: One per table is ideal. If only one facilitator, they must move between tables, but that is hard in 50 minutes. Alternatively, assign a student at each table as a non-playing facilitator (but that might reduce the number of players). We assume two facilitators.
  - **Preparation**: Print materials for two tables. Each table has its own set of role cards, histories, tokens, and tally sheet.

  This design should create the conditions for the standing objection to emerge naturally and be exploited, and then for the participants to reflect on its use and potential abuse.
answer: |-
  ### Session Design: "The Standing Objection" Role-Play  
  **Setting:** Harmony Cooperative, a residential co-op with shared chores, budget, and formal grievance rules.  
  **Duration:** 75 minutes  
  **Participants:** 12 students (two tables of 6).  
  **Learning Goal:** Experience the tension between *moral standing* (the right to hold others accountable) and *wrongdoing* (an act’s inherent blameworthiness).  

  ---

  ### **Materials to Print**  
  *(Per table of 6)*  
  1. **Role Cards** (6 unique roles):  
     - **Chairperson**: Runs meetings. *Secret Objective: Ensure ≤1 complaint is lodged.*  
     - **Treasurer**: Manages budget. *Secret Objective: Protect the Gardener from censure.*  
     - **Gardener**: Maintains shared gardens. *Secret Objective: Never lose all tokens.*  
     - **Cook**: Prepares meals. *Secret Objective: Have the Handyperson censured.*  
     - **Handyperson**: Handles repairs. *Secret Objective: Avoid censure at all costs.*  
     - **Librarian**: Manages shared library. *Secret Objective: Hold ≥2 tokens at the end.*  

  2. **Sealed Private Histories** (6 envelopes, one per role):  
     - Lists 2–3 past violations (e.g., "Borrowed funds without approval," "Skipped chore and blamed others"). *Examples:*  
       - *Cook’s History:* "1. Used shared groceries for private dinner party. 2. Left kitchen filthy thrice last month."  
       - *Handyperson’s History:* "1. ‘Lost’ tools later found in their room. 2. Delayed fixing leak, causing mold."  

  3. **Tokens**: 18 poker chips (3 per player) and a bowl for forfeited tokens.  
  4. **Tally Sheet**: For facilitator to record:  
     - Complaints lodged, standing objections, votes, token transfers, censures.  
     - Final scores (based on secret objectives + tokens held).  

  ---

  ### **Sequence of Play**  
  **Mechanics**  
  - **Complaint**: Spend 1 token to accuse another of a rule violation (e.g., "Cook left kitchen unsafe").  
  - **Standing Objection**: Any member (even the accused) spends 1 token to challenge the complainant’s moral standing *before* discussing the complaint’s merits. Table votes:  
    - **Yes** (objection sustained): Complaint dismissed; complainant forfeits all tokens.  
    - **No** (objection overruled): Complaint proceeds; objector loses spent token.  
  - **Censure Vote**: If no objection (or overruled), table votes on the complaint. Majority "guilty" = accused loses 1 token.  
  - **Token Transfers**: Players may publicly gift tokens anytime (e.g., a discredited member gives tokens to an ally).  

  **Scoring**  
  - 1 point per token held at end.  
  - **Secret Objective Bonus** (if achieved): +3 points.  
  - *Highest possible score: 6 (3 tokens + 3 bonus).*  

  ---

  ### **Timeline**  
  **00:00–00:10 (10 min): Setup**  
  - Facilitator introduces Harmony Co-op: "You’ve lived together 6 months. Today’s meeting addresses grievances."  
  - Distribute roles, secret objectives, tokens, and sealed histories. Emphasize: **Do not open histories yet.**  
  - Split into two tables (6 each).  

  **00:10–00:15 (5 min): Private Preparation**  
  - Players read roles and objectives. *Now* open sealed histories privately.  
  - Facilitator: "Your history includes actions similar to what others might complain about. Use it strategically."  

  **00:15–00:65 (50 min): Role-Play**  
  - **Phase 1: Complaints (20 min)**  
    - Chairperson opens the floor.  
    - Players spend tokens to lodge complaints (e.g., "Treasurer: Gardener misused funds").  
    - Standing objections must be raised immediately. Votes held per rules.  
    - *Facilitator tallies votes/tokens; intervenes only for rule clarity.*  
  - **Phase 2: Escalation (20 min)**  
    - Token transfers unlock (e.g., Gardener gives tokens to Librarian to object "clean-handedly").  
    - Repeat complaints/objections. *Likely emergence:* Multiple standing objections to sideline accusers.  
  - **Phase 3: Final Moves (10 min)**  
    - Players strategize to fulfill objectives before time ends.  

  **00:65–00:75 (10 min): Debrief**  
  - Recombine tables. Compare outcomes: "Did both groups deadlock? Who kept standing?"  

  ---

  ### **Debrief Script**  
  *(Facilitator ties gameplay to philosophy)*  
  **1. Wrongfulness vs. Standing**  
  > "When a standing objection succeeded, the complaint was dismissed *without ever debating if the act was wrong*. This mirrors the distinction: an act can be wrong (*material*), yet the accuser lacks standing (*formal* authority to blame)."  

  **2. Grounds for Losing Standing**  
  > "In the game, standing was lost for hypocrisy (e.g., Cook complaining about mess while their history shows filth), complicity (Gardener objecting to budget misuse after doing the same), or meddling (Librarian objecting to kitchen issues). These map to real-world arguments: *‘You did it too!’*, *‘You’re no saint!’*, *‘This isn’t your business!’*"  

  **3. The Hypocrite’s Blame**  
  > "Was the hypocrite’s complaint *false*? Not necessarily—in the game, the accusation could be true, yet dismissed. This shows hypocrisy doesn’t negate wrongdoing; it questions the *warrant* to blame. The counter-pressure: dismissing true complaints lets wrongdoers ‘turn the tables.’"  

  **4. Permanence and Transferability**  
  > "Losing standing cost all tokens—a permanent penalty. But tokens could be *gifted*, creating proxies (e.g., a ‘tainted’ Cook giving tokens to the ‘clean’ Chair to object). This asks: Can moral authority be delegated? Or is standing personal and non-transferable?"  

  **5. Moral Equality**  
  > "The objection’s core isn’t about truth—it’s about *equality*. When you sustained an objection, you implied the accuser wasn’t ‘in good moral standing’ to judge. The risk: this can be weaponized to silence critics and protect power imbalances."  

  **Limitations of the Activity**  
  > "This game *cannot* capture:  
  > - **Real relationships/history**: A real co-op has trust and vulnerability; here, ‘histories’ were assigned.  
  > - **Genuine dismissal**: In life, a complaint may be true and *legitimately* dismissed on standing (e.g., an abusive parent demanding filial duty). The game simplifies this to tokens.  
  > *Facilitator: Emphasize that standing is context-dependent—not all objections are self-exempting.*"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Deadlock via Mass Standing Loss**  
     - *Likelihood:* High. Tables may vote to strip 4+ players of standing.  
     - *Solution:* In debrief, highlight: "If everyone loses standing, accountability collapses. Is this a stable equilibrium?"  

  2. **Token Exhaustion in First Round**  
     - *Likelihood:* Medium. Aggressive objections drain tokens fast.  
     - *Solution:* Remind players of transfers mid-game: "Tokens can be gifted. Alliances matter."  

  3. **Votes Become Popularity Contests**  
     - *Likelihood:* High. Students may vote based on role affinity.  
     - *Solution:* Post-game: "Did voting reflect histories, or personal alliances? How does this mirror real-world bias?"  

  4. **Dominant Player Monopolizes**  
     - *Likelihood:* Medium. Chairperson or extrovert may control proceedings.  
     - *Solution:* Facilitator quietly prompts: "Let’s hear from others. Treasurer, your view?"  

  **First-Run Advice**:  
  - If a table deadlocks early, say: "Continue playing—can token transfers restart the process?"  
  - If votes are arbitrary, ask during debrief: "Was standing decided fairly, or did power dynamics override morals?"  

  ---  
  This design forces students to *live* the tension: they’ll weaponize standing objections to evade censure, then confront the system’s fragility when grievances go unheard. The debrief links this to moral philosophy’s core questions about authority, hypocrisy, and equality.
