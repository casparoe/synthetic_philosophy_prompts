    Step 3: By condition 1, if we can prove L→(Prov_S(#L)→A) in S, then S proves Prov_S(#(L→(Prov_S(#L)→A))).
    Step 4: By condition 2, S proves:
            Prov_S(#(L→(Prov_S(#L)→A))) → [Prov_S(#L) → Prov_S(#(Prov_S(#L)→A))]

    Step 5: Also by condition 2, S proves:
            Prov_S(#(Prov_S(#L)→A)) → [Prov_S(#Prov_S(#L)) → Prov_S(#A)]

    Step 6: By condition 3, S proves:
            Prov_S(#L) → Prov_S(#Prov_S(#L))

    Step 7: Stringing these together: 
            From step 4 and step 5 and step 6, we get:
            Prov_S(#L) → Prov_S(#A)

