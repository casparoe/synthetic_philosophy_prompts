    Gödel's first incompleteness theorem says that if S is consistent and sufficiently strong, then there is a sentence G that is true but not provable in S. The second incompleteness theorem says that S cannot prove its own consistency. The Löbian obstacle is about the impossibility of a system having a complete self-trust (its own reflection principle) without collapsing. While the second incompleteness theorem is a special case (taking A=⊥), the Löbian obstacle is more general: it applies to any sentence A that the system might try to trust via reflection. Moreover, it shows that the act of adding self-trust leads to a hierarchy of systems, each trusting the one below, but never a fixed point that trusts itself.

    The moral is distinct: self-trust (in the form of the reflection principle) cannot be completely and consistently integrated into the same system that it describes.

  Derivability Conditions

  The derivability conditions are essential for Löb's theorem. They are:

    1. If S ⊢ A, then S ⊢ Prov_S(#A).
    2. S ⊢ Prov_S(#(A → B)) → (Prov_S(#A) → Prov_S(#B)).
    3. S ⊢ Prov_S(#A) → Prov_S(#Prov_S(#A)).

  These conditions are satisfied by any sufficiently strong system that can prove the combinatorial facts about proofs (like the fact that if there is a proof of A and a proof of A→B, then there is a proof of B).

