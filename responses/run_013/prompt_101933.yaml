  We are going to explain the Löbian obstacle step by step, building it from the ground up.

  Setting the Stage: A Reflective Reasoner

  Consider a formal system S that is sufficiently powerful to encode statements about itself. Specifically, we assume that S can represent its own syntax and provability relation. That is, for any sentence A in the language of S, there is a formula Prov_S(#A) that expresses "A is provable in S", where #A is a Gödel number for A.

