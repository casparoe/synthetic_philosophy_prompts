  The agent in question is identified with the system S: its beliefs are exactly the theorems of S.

  The Naive Proposal: Trusting One's Own Proofs

  The agent wishes to be more confident in its own outputs. It considers adding a new rule of inference:

    From Prov_S(#A), infer A.

  This rule is sometimes called the "Reflection Rule" for S. It seems intuitive: if the agent can prove that it proves A, then it should just go ahead and believe A. Similarly, if the agent can prove that its system is consistent (i.e., it proves that it does not prove a contradiction), then it would like to believe that it is consistent.

  But note: the consistency statement for S, which we denote Con(S), is equivalent to the statement that there is no proof of a contradiction (say, 0=1). So Con(S) is equivalent to ¬Prov_S(#0=1). The reflection rule for the specific case of a contradiction would allow:

    From Prov_S(#0=1) → 0=1, we can get (by contraposition) that if 0≠1 (which we know) then ¬Prov_S(#0=1), i.e., Con(S).

  But note: the reflection rule is a schema: it applies to every sentence A. In particular, if we have the full reflection rule, then we can prove Con(S). However, by Gödel's second incompleteness theorem, if S is consistent, then S cannot prove Con(S). Therefore, if we add the full reflection rule to S, we get a new system S' that is stronger than S. But then S' has its own consistency statement Con(S'), which it cannot prove. So we haven't achieved total self-trust.

  But the problem is more severe: adding the reflection rule to S leads to inconsistency. This is the essence of Löb's theorem.

  Löb's Theorem and the Obstacle

  Löb's theorem states that for any system S satisfying the derivability conditions (which we'll state shortly) and for any sentence A, we have:

    S ⊢ Prov_S(#A) → A   if and only if   S ⊢ A.

  In other words, S can prove that "if A is provable then A is true" only if S can already prove A.

  This immediately shows that adding the reflection rule without restriction is dangerous: if we take A to be a contradiction (say, ⊥), then we get:

    S ⊢ Prov_S(#⊥) → ⊥   if and only if   S ⊢ ⊥.

