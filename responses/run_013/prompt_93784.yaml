  But is this a taste for ignorance? The regret is a psychological cost that only occurs when she knows she could have done better. Without the test, she doesn't know she could have done better, so no regret.

  But the theorem assumes that utility is a function of the outcome and the state. Here, the utility in the state "tails" is different when she knows it's tails than when she doesn't. So again, the state is not just "tails", but "tails and I know it".

