  To get a negative value, we need a scenario where with the test, she is forced to make a choice that in some states leads to regret, but without the test she avoids that. This seems difficult.

  Another idea: The "Paralysis by Analysis" scenario.

  A decision-maker has to choose one of two boxes. One box contains a prize with probability p, the other with probability 1-p. The decision-maker does not know p. Without any information, she flips a coin to choose, and gets the prize with probability 0.5. But she is very happy with that because she doesn't feel responsible.

