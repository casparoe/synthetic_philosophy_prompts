  We are going to construct a scenario in which a decision-maker strictly prefers not to receive free, reliable, and decision-relevant information because the information may lead her to make a decision that is worse in expectation. The key is to have a decision problem where the information, despite being perfectly reliable, causes the agent to change her action in a way that leads to a worse outcome on average. This will violate the assumption of the theorem that the agent's decision rule is to choose an action that maximizes expected utility conditional on the information.

  One classic example that can be adapted is the "Psycho Parent" scenario (sometimes attributed to I.J. Good, but note that Good's theorem typically shows non-negative value). However, we need a scenario that strictly violates non-negativity. We'll design a scenario with a form of state-dependent utility or with a preference for commitment.

  Scenario: The "Regretful Doctor"

  Dr. Smith is treating a patient with a serious condition. There are two possible underlying causes, A and B, each equally likely. There are two treatment options: 
  - Treatment X: very effective for cause A but harmful for cause B.
  - Treatment Y: moderately effective for both causes, but not as good as X for A and better than X for B.

  Without any test, the best choice is Treatment Y because it avoids the risk of harm. But there is a free, perfectly reliable test that can reveal the cause (A or B). However, if the test reveals cause A, then the doctor will feel compelled to choose Treatment X (since it is very effective for A) even though she knows that if it were cause B, Treatment X would be harmful. But here's the twist: the patient has a psychological condition such that if the test is done and reveals cause A, then the patient becomes extremely anxious and stressed, which worsens the outcome of Treatment X (but not Treatment Y). Specifically:

  - If the test is not done, the doctor chooses Y. Then:
    - If cause A: outcome is moderate recovery (utility 50).
    - If cause B: outcome is moderate recovery (utility 50).

  - If the test is done and reveals A, then the doctor chooses X. However, because of the patient's anxiety (triggered by knowing the result is A and the consequent aggressive treatment), the outcome of X is only good but not great (utility 60) and not as good as it would have been without the test (which would have been 90 if there were no anxiety). But note: without the test, the doctor wouldn't have chosen X for cause A because she doesn't know the cause.

  - If the test is done and reveals B, then the doctor chooses Y. The patient is not anxious in this case (because the result is B and the treatment is the safe one) and the outcome is the same as without the test: utility 50.

  Without the test, the expected utility is 50 (since in both cases we get 50).

  With the test:
  - With probability 0.5 (cause A): test reveals A, then we get utility 60.
  - With probability 0.5 (cause B): test reveals B, then we get utility 50.
  So expected utility with test: 0.5*60 + 0.5*50 = 55.

  But wait, 55 is better than 50. So that doesn't work. We need the outcome in the A-revealed case to be worse than the no-test case. Let me adjust.

  Alternative setup:

  Without test: 
  - If the doctor chooses Y (which she does, because it's the safe choice), then:
    - Cause A: utility 40 (because Y is only moderately effective for A, worse than what X could achieve without anxiety)
    - Cause B: utility 50 (because Y is good for B)
    Expected utility: (40+50)/2 = 45.

  With test:
  - If test reveals A (prob 0.5): the doctor chooses X. But because of the patient's anxiety (triggered by knowing the result and the aggressive treatment), the outcome is only 30 (which is worse than the 40 she would have gotten with Y without the test? But note without test she doesn't know and uses Y, so 40 for A).
  - If test reveals B (prob 0.5): the doctor chooses Y, and outcome is 50 (same as without test).

  So expected utility with test: 0.5*30 + 0.5*50 = 40.

  Without test: 45.

  Therefore, the expected utility of getting the test is 40, which is less than 45. So the doctor would prefer not to have the test.

  But note: the test result is decision-relevant because it changes the action. However, the problem is that the act of testing itself changes the outcome in the state where A is revealed. This is a form of state-dependent utility, but the dependency is on the test being performed and the result being known.

  Which assumption is violated?

  The standard theorem assumes that the utility of an outcome does not depend on the information structure. In other words, the outcome is determined solely by the state of the world and the action taken. However, in this case, the outcome in the state where the cause is A also depends on whether the test was done and the result was revealed (because it causes anxiety). Therefore, the utility function is not just a function of the state and the action, but also of the information received.

  Repairing the assumption: If we repair the assumption by defining the state to include the information structure (i.e., whether the test was done and what the result was), then the state space becomes larger. Specifically, we have:

  - State 1: Cause A, and if tested the result is A (and the patient becomes anxious).
  - State 2: Cause B, and if tested the result is B (and the patient is not anxious).

  But note that the test is perfectly reliable, so the state of the world already determines the test result. However, the anxiety only occurs if the test is actually performed and the result is A. Without the test, the patient does not become anxious. Therefore, the state of the world does not inherently include the anxiety condition. The anxiety condition is a consequence of the test being performed and the result being revealed.

  If we expand the state space to include the entire history of testing and revelation, then we have:

  - Without test: states are just A and B, each with prob 0.5.
  - With test: we have two states: (A, tested and revealed) and (B, tested and revealed). But note that the act of testing changes the state of the world because it introduces anxiety in the A case. So without the test, the state is just A or B. With the test, the state becomes (A, tested) or (B, tested). This is a different state space.

  In the expanded state space, the probabilities are:
  - Without test: P(A) = 0.5, P(B)=0.5.
  - With test: P((A, tested)) = 0.5, P((B, tested)) = 0.5.

  But note that the state (A, tested) is different from state A without test because of the anxiety. Therefore, the two scenarios (test and no test) are essentially different decision problems. The theorem about the non-negative value of information assumes that the state space is fixed and that the utility function depends only on the state and the action. Here, the state space is not fixed: the act of testing changes the state.

  The strongest reply from the "always take free evidence" side: They would argue that the state space should include the entire history, including whether the test was performed and what was revealed. Then, the decision-maker, when deciding whether to take the test, should consider the entire decision tree. However, in that expanded tree, the utility of an outcome in the branch where the test is done and state A is revealed is lower because of the anxiety. Therefore, the expected utility of the test branch is lower. But note that the theorem does not force the agent to take the test. The theorem says that the expected utility of the optimal decision with the test is at least as high as without. However, in this expanded state space, the state without test is different from the state with test. So the comparison is between two different worlds. The theorem typically assumes that the same state space applies and that the test only provides information about the state, without changing the state.

  Therefore, the key feature that causes the negative value is that the act of obtaining the information changes the state of the world (specifically, by causing anxiety in the patient when the result is A). If we delete the anxiety effect (i.e., if the test result does not cause anxiety), then without the test the expected utility is 45 (as above) and with the test:

  - If A: choose X, utility without anxiety would be, say, 70 (if X is very effective without anxiety) -> but then expected utility with test: 0.5*70 + 0.5*50 = 60, which is better than 45.

  So without the anxiety, the value of information is positive.

  Can we patch the case to avoid the state change? We want a case where the state is not changed by the test, but the decision-maker still ends up worse off. This is harder because of Good's theorem. However, there is another avenue: using non-expected utility preferences.

  Alternative approach: Using ambiguity aversion or regret.

  Scenario: The "Regret-Averse Investor"

  An investor has to choose between two investments: A and B. There are two possible states of the economy: Boom and Bust. The payoffs:

          Boom (prob 0.5)   Bust (prob 0.5)
  A:      $1000             $0
  B:       $500             $500

  Without any information, the investor chooses B because it has a sure $500. Expected utility (if utility is linear in money): 500.

  Now, there is a free, perfectly reliable test that reveals whether it will be Boom or Bust. However, the investor has regret-averse preferences. Specifically, she experiences disutility from regret. If she makes a choice that turns out to be suboptimal, she loses an additional $300 in utility (due to regret). Without the test, she doesn't experience regret because she doesn't know what the state was and she chose the safe option.

  Without test:
  - She chooses B and gets 500 in either state. No regret because she never learns the counterfactual.

  With test:
  - If test reveals Boom: she chooses A and gets 1000. No regret because she got the best possible.
  - If test reveals Bust: she chooses B and gets 500. But then she learns that in Bust, A would have given 0, so she is happy with B. However, note: in Bust, B is the best. So no regret? We need a situation where she might make a choice that is ex post suboptimal.

  Adjust the payoffs:

          Boom (prob 0.5)   Bust (prob 0.5)
  A:      $1200             $200
  B:       $1000            $1000

  Without test:
  - If she chooses A: expected money 0.5*1200+0.5*200=700.
  - If she chooses B: 1000 (always).
  So she chooses B and gets 1000. But note: without the test, she doesn't know the state, so she doesn't experience regret.

  With test:
  - If Boom: she chooses A and gets 1200. She is happy.
  - If Bust: she chooses A? But wait, in Bust, B gives 1000 and A gives 200. So if she chooses A in Bust, she gets 200 and then experiences regret because she could have had 1000. The regret disutility: she loses 300. So total utility in Bust if she chooses A: 200 - 300 = -100.

  But will she choose A in Bust? After the test, if the test reveals Bust, then she knows:
  - A gives 200 (and then regret: so utility -100)
  - B gives 1000 (and no regret because it's the best in Bust)
  So she will choose B in Bust.

  Therefore, with test:
  - Boom (prob 0.5): choose A -> 1200
  - Bust (prob 0.5): choose B -> 1000
  Expected money: 1100, which is better than 1000 without test.

  So that doesn't work.

  We need regret to affect the decision. Let me try:

  The investor is not a standard expected utility maximizer. She minimizes maximum regret. Without test, the regret matrix:

          Boom    Bust    Max Regret
  A:      0       ?       ?
  B:      ?       0       ?

  In Boom, the best is A (1200) so if she chose B, she gets 1000, so regret = 1200-1000=200.
  In Bust, the best is B (1000) so if she chose A, she gets 200, so regret = 1000-200=800.

  Without test:
  - If she chooses A: max regret is 800 (if Bust)
  - If she chooses B: max regret is 200 (if Boom)
  So she chooses B to minimize max regret.

  With test, she can condition on the state. Then in each state, she can choose the best action and have 0 regret. So with test, she gets:
  - In Boom: A, 1200, regret 0.
  - In Bust: B, 1000, regret 0.
  So expected money: 1100, and regret 0.

  Then she should prefer the test.

  To get a negative value, we need the regret to be experienced only when she knows the state. Without the test, she never knows the state so she doesn't feel regret. With the test, she knows the state and if she chooses an action that is suboptimal in that state, she feels regret. But if she chooses optimally, she doesn't feel regret. So with the test, she can avoid regret.

  The key is that without the test, she doesn't feel regret because she doesn't know the state. With the test, even if she chooses optimally, she might still feel regret? That doesn't make sense.

