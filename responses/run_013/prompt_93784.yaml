  In the heads case: she takes the gamble and gets 1000, and no regret.

  Without test:
  - She takes the sure thing and gets 500, and she doesn't know the coin outcome, so she doesn't feel regret. Utility 500.

  With test:
  - Heads: utility 1000.
  - Tails: utility 0.
  Expected utility: 500.

