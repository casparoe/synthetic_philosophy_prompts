prompt: |-
  I write about the machinery of collective decision-making for a general-readership science-and-ideas desk, and I'm putting together a piece on the gap between judging a group's verdict issue-by-issue and judging it on the bottom line alone — what the literature tends to call the discursive dilemma. I've been going back and forth with a colleague about whether the paradox is really about the voters or about the propositions, and I've come to suspect it's the latter, so what I want from you is a pair of matched cases built to order that isolates the variable I think is doing the work. In the first case, three members of some ordinary institution — a hiring committee, a grant panel, a hospital ethics board, take your pick, so long as it's a real-world body and not a stylized puzzle — must reach a collective verdict on three propositions, one of which is tied to the others by a genuine logical connection (a conditional, a rule of the institution, a definitional link), with each member's own set of judgments complete and internally consistent, and yet voting proposition-by-proposition yields a collective set that no single member holds and that is itself inconsistent. In the second case, hold everything fixed — same number of members, same distribution of individual verdicts, same institutional texture — but make the three propositions logically independent of one another, and show that under that single change the two ways of aggregating (tallying each proposition separately versus tallying the members' bottom-line verdicts) can no longer come apart. Please don't reach for the textbook breach-and-damages or three-friends examples, and don't let the members' disagreement be stipulated as incoherent; I want something I could print without it reading as a reprint.

  For each case, walk me through what the proposition-by-proposition tally delivers and what the bottom-line tally delivers, and say why each gives the verdict it does. Then tell me which single feature of the first case is carrying the result and what happens when you strip it out, and — since I don't want to stack the deck — give me the strongest line a defender of the bottom-line procedure would take against the first case, together with how a defender of the proposition-by-proposition procedure would answer it. Throughout, keep the seam between what's settled among people who work on this and what's genuinely contested clearly visible; I don't want a contested verdict on which procedure is correct presented as though the field had reached consensus. Lead with the two cases themselves, stated compactly, before any commentary — no preamble and no restating of my question.
reasoning: |-
  We are going to create two cases for a hiring committee at a university. The committee has three members: Alex, Bailey, and Casey. They must decide on three propositions for a job candidate.

  **Case 1: Logically Connected Propositions**

  *Propositions:*
  P: The candidate has strong publications.
  Q: The candidate has excellent teaching evaluations.
  R: The candidate should be hired. (with the institutional rule: "Only if the candidate has strong publications AND excellent teaching evaluations should they be hired." So, R is equivalent to P ∧ Q.)

  *Individual Judgments:*
  - Alex: P true, Q true, R true (so hires)
  - Bailey: P true, Q false, R false (so does not hire)
  - Casey: P false, Q true, R false (so does not hire)

  *Proposition-by-proposition tally:*
  - P: true (Alex and Bailey say true, Casey false → majority true)
  - Q: true (Alex and Casey say true, Bailey false → majority true)
  - R: false (only Alex says true, Bailey and Casey say false → majority false)

  *Collective set by proposition-by-proposition tally:*
  P true, Q true, R false.

  But note: the institutional rule says R should be true if and only if both P and Q are true. Here, collectively we have P and Q true but R false → inconsistent.

  *Bottom-line tally:*
  Each member's bottom line is their verdict on R (whether to hire). 
  - Alex: hire (for R)
  - Bailey: not hire (against R)
  - Casey: not hire (against R)

  Majority on bottom line: not hire (2 against, 1 for). So collective decision: R false (not hire).

  In this procedure, we have collective R false, and we don't have collective P and Q from the bottom line. The bottom line procedure only gives us the verdict on R.

  But note: the bottom line procedure does not record collective judgments on P and Q. It only records the decision on R. The inconsistency in the proposition-by-proposition method is because we are forcing a collective judgment on all three and they are linked by a rule. The bottom line procedure avoids that by only asking for the final decision.

  **Case 2: Logically Independent Propositions**

  Now, we change the propositions so they are independent. The committee is now evaluating a candidate on three independent criteria (with no institutional rule linking them to a hire decision). However, they must also make a bottom-line decision (hire or not) but now without a strict rule. We stipulate that each member forms their bottom-line decision based on their own reasoning about the three criteria, but there is no fixed rule (like R = P ∧ Q). Instead, we just have three criteria and each member independently decides on each criterion and also on the overall hire.

  To hold the distribution fixed, we use the same individual judgments on the propositions as in Case 1, but now without the logical constraint. We also stipulate that each member's bottom line is still consistent with their own judgments (but now without an explicit rule). However, to make the three propositions independent, we remove the rule that R must be P∧Q. Instead, R is a separate judgment that each member makes based on P and Q, but the collective is not bound by any rule. Moreover, we must design the bottom-line procedure to be a vote on the overall hire (R) and the proposition-by-proposition to be on each of P, Q, and R independently.

  But note: in Case 2, the propositions P, Q, R are now independent? Actually, we cannot have R being an overall decision without any relation to P and Q because then the individual judgments might not be consistent in any particular way. However, we are holding the individual judgments fixed. So we have:

  Same individual judgments:

  | Member | P (publications) | Q (teaching) | R (hire?) |
  |--------|------------------|--------------|-----------|
  | Alex   | True            | True        | True      |
  | Bailey | True            | False       | False     |
  | Casey  | False           | True        | False     |

  But without the rule that R must be P∧Q, we can interpret R as an independent judgment. However, for the individual, each member is still consistent in their own way. For example, Alex thinks both criteria are met and so hires. Bailey thinks publications are good but teaching is bad and so doesn't hire. Casey thinks teaching is good but publications are bad and so doesn't hire. So individually, each member is consistent with their own reasoning.

  Now, the propositions are independent in the sense that there is no logical constraint that forces R to be a function of P and Q. The committee does not have a rule that defines R in terms of P and Q. Therefore, we can have:

  *Proposition-by-proposition tally:*
  Same as before:
  - P: True (majority)
  - Q: True (majority)
  - R: False (majority)

  But now, there is no inconsistency because the group's collective judgment on R being false is not in conflict with any rule about P and Q. The group collectively says: the candidate has strong publications (P true) and excellent teaching (Q true) but we are not going to hire (R false). That might be odd, but it's not logically inconsistent because there is no rule that says if P and Q are true then R must be true. The group might have other reasons not to hire.

  *Bottom-line tally:*
  As before, majority on R: Alex for, Bailey and Casey against → R false.

  So both methods yield the same for R: false. And for P and Q, the proposition-by-proposition method yields true for both. But without a rule, the collective set (P true, Q true, R false) is not inconsistent. It might be surprising, but it's not a contradiction.

  Therefore, the two aggregation methods do not conflict on the bottom line (R) and the proposition-by-proposition method does not produce an inconsistency because the propositions are independent.

  **Analysis:**

  The single feature that is carrying the result in the first case is the logical connection (the institutional rule) that requires R to be equivalent to (P ∧ Q). Without this rule, the collective judgments are free to be any combination. In the first case, the rule creates a constraint that the collective judgments must satisfy, but the majority voting on each proposition separately fails to satisfy it. In the second case, without the rule, there is no constraint to violate.

  **Debate between the two procedures:**

  *Defender of the bottom-line procedure (for Case 1):*
  The bottom-line procedure respects the individual's overall judgment. Each member has considered the entire picture and made a consistent decision. The proposition-by-proposition method forces the group to take a stand on each premise, but that might lead to an overall decision that no individual supports and that violates the institution's rules. In our case, the bottom-line procedure gives a clear and consistent outcome (not to hire) that reflects the majority's will on the final decision. The premise-based method leads to an irrational group decision (it says the candidate meets the criteria but shouldn't be hired, which violates the rule). The bottom-line method avoids this by focusing on the decision that matters.

  *Defender of the proposition-by-proposition procedure:*
  The premise-based method is more transparent and allows the group to see where the agreement lies on the reasons. In Case 1, the group actually agrees that the candidate has strong publications and excellent teaching, so by the institution's own rule, the candidate should be hired. The bottom-line procedure hides this fact and leads to a decision that violates the institution's rule. The rule says that if the candidate meets both criteria, they must be hired. The premise-based method reveals that the group believes the criteria are met, and then the rule should be applied. The bottom-line method allows the group to violate the rule. Thus, the premise-based method is better at ensuring that group decisions are based on reasons and rules.

  **What's settled and contested:**

  It is settled in the literature that when there are logical connections among the propositions, the two aggregation methods can conflict and the premise-based method can lead to inconsistency. It is also settled that without logical connections, the two methods cannot conflict in the sense of producing an inconsistent set (though they might still differ if the bottom line is not a direct function of the premises, but in our case they did not differ on R). However, in the independent case, there is no inconsistency and the methods might or might not agree on the bottom line. In our example they did agree on R.

  What is contested is which method is superior. Some argue that the premise-based method is more rational because it respects the reasons behind decisions. Others argue that the bottom-line method is more democratic because it respects the overall judgment of each member. There is no consensus in the field on which method should always be used. The choice may depend on the context, the importance of the reasons, and the presence of institutional rules.
answer: |-
  ### Case 1: Logically Connected Propositions  
  **Context:** A university hiring committee (Alex, Bailey, Casey) evaluates a candidate using three propositions:  
  - **P:** The candidate meets the research benchmark (≥5 peer-reviewed publications).  
  - **Q:** The candidate meets the teaching benchmark (≥4.0/5.0 student evaluations).  
  - **R:** The candidate should be hired.  
  *Institutional rule:* Hiring requires meeting both benchmarks (R ≡ P ∧ Q).  

  **Individual Verdicts (each consistent with the rule):**  
  | Member  | P (Research) | Q (Teaching) | R (Hire?) |  
  |---------|--------------|--------------|-----------|  
  | Alex    | True         | True         | True      |  
  | Bailey  | True         | False        | False     |  
  | Casey   | False        | True         | False     |  

  **Proposition-by-Proposition Tally (majority vote per issue):**  
  - P: True (Alex, Bailey True; Casey False → 2-1 majority).  
  - Q: True (Alex, Casey True; Bailey False → 2-1 majority).  
  - R: False (Alex True; Bailey, Casey False → 1-2 majority).  
  *Collective outcome:* P True, Q True, R False.  
  *Problem:* Violates the institutional rule (True research + True teaching should yield True for hire).  

  **Bottom-Line Tally (majority vote on final verdict R):**  
  - Verdicts on R: Alex True, Bailey False, Casey False.  
  - Majority: False (2-1).  
  *Collective outcome:* R False (do not hire).  

  ### Case 2: Logically Independent Propositions  
  **Context:** The same committee evaluates a candidate using three *unrelated* criteria:  
  - **P:** The candidate contributes to departmental diversity goals.  
  - **Q:** The candidate has industry experience.  
  - **R:** The candidate should be hired.  
  *No institutional rule links P, Q, and R. Each member individually weighs P and Q to decide R.*  

  **Individual Verdicts (same distribution as Case 1):**  
  | Member  | P (Diversity) | Q (Industry) | R (Hire?) |  
  |---------|--------------|--------------|-----------|  
  | Alex    | True         | True         | True      |  
  | Bailey  | True         | False        | False     |  
  | Casey   | False        | True         | False     |  

  **Proposition-by-Proposition Tally (majority vote per issue):**  
  - P: True (Alex, Bailey True; Casey False → 2-1).  
  - Q: True (Alex, Casey True; Bailey False → 2-1).  
  - R: False (Alex True; Bailey, Casey False → 1-2).  
  *Collective outcome:* P True, Q True, R False.  
  *No inconsistency:* Without a logical link, True/True + False is coherent (e.g., R may depend on unstated factors like budget).  

  **Bottom-Line Tally (majority vote on final verdict R):**  
  - Verdicts on R: Alex True, Bailey False, Casey False.  
  - Majority: False (2-1).  
  *Collective outcome:* R False (do not hire).  
  *Result:* Both methods agree on R (False).  

  ---

  ### Analysis  
  **Key Feature Carrying the Result:**  
  The paradox in Case 1 arises solely from the **logical connection (R ≡ P ∧ Q)**. This constraint forces consistency between premises (P, Q) and conclusion (R). Majority voting per proposition ignores this link, allowing contradictory collective judgments. When the connection is removed (Case 2), no inconsistency occurs, and both aggregation methods align on R.  

  **Debate: Bottom-Line vs. Proposition-by-Proposition**  
  - **Defender of Bottom-Line (for Case 1):**  
    "The bottom-line method respects members' holistic judgments. Alex, Bailey, and Casey each weighed P and Q *in context* to reach R. Forcing majority votes on P and Q separately overrides their integrated expertise and creates a 'fake' group stance (P True, Q True) that no one holds. Worse, it violates the institutional rule, inviting legal challenges. Bottom-line voting avoids this by treating R as a standalone decision, reflecting the group’s true majority will."  

  - **Defender of Proposition-by-Proposition (rebuttal):**  
    "The bottom-line method hides critical consensus: 2/3 members agree the candidate excels in research (P) *and* teaching (Q). By skipping to R, it ignores that this candidate objectively satisfies the hiring rule. The committee’s job is to apply standards transparently—not let members' private reasoning obscure shared facts. Proposition-by-proposition voting exposes this and enforces institutional rules; if the outcome violates logic, it reveals flaws in individual judgments, not the method."  

  **What’s Settled vs. Contested:**  
  - **Settled:** The paradox occurs *only* with logical connections between propositions. Without them (Case 2), no inconsistency arises.  
  - **Contested:** Whether bottom-line or proposition-by-proposition aggregation is "correct" depends on philosophical priorities:  
    - *Bottom-line prioritizes* democratic will and practical efficiency.  
    - *Proposition-by-proposition prioritizes* reason-based transparency and rule-following.  
    The field agrees the gap exists but *disagrees* on which method best balances accuracy, fairness, and legitimacy. No consensus favors either universally.
