  ## The Cohort (A Refrain for Forecasters)

  The marble cools where edicts dried.
  The tax rolls thicken, clerks collude.
  The legions grumble, over-stretched and thin.
  **The pattern holds, as patterns do.**

  The silks still flow through Chang'an's gates.
  The poets toast the peach-blossom spring.
  The garrison reports the northern dust.
  **The pattern holds, as patterns do.**

  The steel mills blaze, the quotas met.
  The parades march beneath the frozen square.
  The whispers start in kitchen queues.
  **The pattern holds, as patterns do.**

  The gold mosaics catch the dawn.
  The scholars parse the fading scrolls.
  The harbor chain lies slack, untested long.
  **The pattern holds, as patterns do.**

  The kivas empty, prayers unsaid.
  The stones still hold against the mesa wind.
  The water fails the terraced corn.
  **The pattern holds, as patterns do.**

  *Our screens glow bright with warnings parsed,*
  *Our models churn through centuries' dust.*
  *Our checks and balances hold firm, we swear –*
  ***The pattern holds, as patterns do.***

  ---

  **Critical Note:**

  1.  **Caricature of Outside View:** The poem leans into "track record buys us nothing," which *is* a simplification. Sophisticated outside views *do* incorporate duration (e.g., survival analysis), not just naive base rates ignoring time survived. The "clock with no memory" is a stark, perhaps overly pessimistic, representation.
  2.  **Lindy Tension:** The tension is real but resolvable *within* the outside view framework. Lindy applies best to non-perishable *categories* (ideas, technologies). A specific *instance* (like a nation-state) *is* perishable. Its survival time *can* inform forecasts (e.g., hazard rates often decrease initially then increase), conflicting with the "no memory" idea but still using base rates. The poem frames them as distinct intuitions rather than showing how duration data *can* be incorporated into reference class forecasting.
  3.  **Liberties with "Liberties":** The "odd case out" (Anasazi) relies on interpretation – its inclusion *is* an argument about reference class. The poem doesn't invent details, but selecting *which* thin, recognizable details to include (e.g., "harbor chain lies slack" for Byzantium) inherently shapes the narrative and the implied reference class "collapse." The refrain’s bluntness overrides nuance.
  4.  **Framing Validity:** Your core framing – the tension between historical pattern recognition (outside view) and claims of unique resilience, mediated by reference class ambiguity – is insightful and valid for the poem's purpose. The oversimplifications serve the poem's visceral impact.

  The poem succeeds in making the *feeling* of the outside view's constraint palpable through form, while leaving the intellectual tensions provocatively unresolved.
