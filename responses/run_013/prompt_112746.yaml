prompt: |-
  write me a parody excerpt from the employee handbook of a company that has rebuilt its entire talent framework around the four grades of mind in Dennett's taxonomy -- Darwinian, Skinnerian, Popperian, Gregorian. Around 650 words, deadpan corporate register: numbered sections, bullets, a ratings table, a mandatory-training notice. Each grade needs its own HR name and its own definition, and the definitions have to actually get the taxonomy right -- hardwired reflexes; learning by trial and error from reward; simulating the options inside your own head so that the hypotheses die in your stead; and offloading thought into external tools and notations. The comedy should come out of what a corporate hierarchy does to a layered taxonomy: the grades are nested, not ranked, and the company ranks them anyway, telling everyone they must "level up" to Gregorian while every incentive it actually offers rewards purely Skinnerian behaviour, and never telling anyone which grade they've been assigned. Include one section where a team gets reclassified and the reclassification has real consequences -- pay band, headcount, whether their proposals get tested or just filed. Also a short "what this is not" disclaimer that quietly admits the whole thing is a value judgement dressed up as a description. Keep it entirely straight-faced, no winking, and make sure someone who has never heard of Dennett can still tell what the four tiers mean.
reasoning: |-
  We are writing an employee handbook parody. The company has rebuilt its talent framework around Dennett's four grades of mind: Darwinian, Skinnerian, Popperian, Gregorian.
   Requirements:
   - Deadpan corporate register (formal, bureaucratic, no humor explicitly pointed out)
   - Sections: numbered, with bullets, a ratings table, a mandatory-training notice.
   - Each grade gets an HR name and a definition that accurately reflects Dennett's taxonomy:
     1. Darwinian: hardwired reflexes (instinctual, fixed responses)
     2. Skinnerian: learning by trial and error from reward (conditioned behavior)
     3. Popperian: simulating options internally (hypothetical testing in the mind)
     4. Gregorian: offloading thought into external tools (using artifacts to aid cognition)
   - The comedy comes from:
       a) The company treating the nested taxonomy as a rigid hierarchy and ranking them anyway.
       b) Telling everyone to "level up" to Gregorian, but all incentives reward only Skinnerian behavior.
       c) Never telling employees which grade they've been assigned.
   - Include a section where a team gets reclassified with real consequences (pay band, headcount, proposal treatment).
   - A short "what this is not" disclaimer that admits it's a value judgement dressed as description.
   - Entirely straight-faced, no winking at the reader.
   - Definitions must be clear enough for someone unfamiliar with Dennett to understand.

   Structure Outline:
   1. Introduction to the Mindset Framework
   2. Definitions of Each Grade (with HR names and definitions)
   3. Table: Grades and Their Characteristics (including typical roles, but note: we are going to rank them arbitrarily)
   4. Section on Leveling Up (mandatory training, incentives that don't match)
   5. Reclassification Case Study (with consequences)
   6. Disclaimer: "What This Is Not"
   7. Mandatory Training Notice

   Let's begin.
answer: |-
  ### OmniCorp Employee Handbook: Mindset Framework Implementation  
  **Section 7.1: Overview of Cognitive Stratification**  
  OmniCorp’s talent architecture is built upon the Four Cognitive Tiers, a scientifically rigorous framework ensuring optimal human capital deployment. Each tier represents a distinct mode of problem-solving, with higher tiers enabling greater strategic impact. All employees are classified into one tier (per Role Assessment Protocol §12.4), though individual classifications remain undisclosed for privacy reasons.  

  **Section 7.2: Tier Definitions and HR Designations**  
  *7.2.1 Reflexive Operative (Darwinian Tier)*  
  - **HR Designation:** R-Type  
  - **Definition:** Execution relies on innate or pre-programmed responses to environmental stimuli. Decisions are fixed, rapid, and require no learning.  
  - *Example:* Data-entry clerks executing standardized workflows; server reboot scripts.  

  *7.2.2 Conditioned Analyst (Skinnerian Tier)*  
  - **HR Designation:** S-Type  
  - **Definition:** Behavior adapts via reinforcement from external rewards/punishments. Solutions are discovered through repeated trial-and-error.  
  - *Example:* Sales teams refining pitch techniques based on commission outcomes; A/B testing ad variants.  

  *7.2.3 Simulative Strategist (Popperian Tier)*  
  - **HR Designation:** P-Type  
  - **Definition:** Hypothetical scenarios are internally modeled prior to action. Errors are eliminated mentally, minimizing real-world risk.  
  - *Example:* Engineers simulating product failures before prototyping; financial forecast modeling.  

  *7.2.4 Instrumental Architect (Gregorian Tier)*  
  - **HR Designation:** G-Type  
  - **Definition:** Cognition is augmented by external tools (e.g., software, notation systems). Knowledge is codified and iteratively optimized beyond biological limits.  
  - *Example:* Developers creating AI-driven workflow automations; R&D using collaborative neuro-linguistic matrices.  

  **Section 7.3: Cognitive Tier Performance Matrix**  
  | Tier              | Strategic Value | Development Priority | Eligible for Leadership? |  
  |-------------------|-----------------|----------------------|--------------------------|  
  | Reflexive (R)     | Low             | Tier 4               | No                       |  
  | Conditioned (S)   | Medium          | Tier 3               | Yes (Level 1–3 only)     |  
  | Simulative (P)    | High            | Tier 2               | Yes (Level 4–6)          |  
  | Instrumental (G)  | Critical        | Tier 1               | Yes (Level 7+)           |  

  **Section 7.4: Mandatory Progression Protocol**  
  All employees must pursue tier elevation via OmniCorp’s "Ascend" initiative:  
  - Annual training (OC-LMS Course #881: *Gregorian Toolsets for Non-Gregorians*) required for R/S/P-types.  
  - Promotion eligibility contingent on completing ≥2 tier-upgrade workshops quarterly.  
  - **Note:** S-tier behavior (e.g., exceeding Q3 sales targets via trial-and-error) remains eligible for Spot Bonuses (§18.2a) and "Peak Performer" badges. G-tier projects require pre-approved Instrumental Resource Credits.  

  **Section 7.5: Reclassification Impact (Case Study: Procurement Team Gamma)**  
  Following Q2 2024 Cognitive Audit, Team Gamma was reclassified from P-type to S-type. Consequences included:  
  - Pay bands frozen at Band J (max $82,000).  
  - Headcount reduced from 12 to 7.  
  - Proposals now require "empirical validation" (S-tier reward testing) instead of theoretical review.  
  - Access to simulation software (VirtaPlan) revoked; replaced with incentive-tracking dashboards.  

  **Section 7.6: Clarification of Framework Intent**  
  *What This Is Not:*  
  This framework does not imply intrinsic superiority of one tier over another. Each tier is evolutionarily nested, not objectively ranked, and instrumentally appropriate for context-specific functions. However, OmniCorp’s valuation of innovation capacity necessitates incentivizing tier migration to maximize organizational complexity.  

  **MANDATORY TRAINING NOTICE**  
  **Course:** OC-LMS #881 *Gregorian Toolsets for Non-Gregorians*  
  **Deadline:** December 1, 2024  
  **Content:** Utilizing external cognitive tools (whiteboards, Python, Markov chain generators) to bypass biological constraints.  
  **Failure to Complete:** Results in automatic R-type designation and ineligibility for FY2025 promotions.  

  ---  
  *Handbook Appendix References:*  
  - Cognitive Tier Alignment Form (CTAF-9)  
  - Dennett, D. (1995). *Darwin’s Dangerous Idea*. (OmniCorp Internal Summary §44b)*
