prompt: |-
  I am preparing the opening unit of a graduate seminar on whether genuine moral dilemmas are possible, and I want the students to confront the specification before they confront any candidate theory. Write that specification: the requirements any adequate account of the phenomenon must satisfy. State each requirement so that a candidate theory can be tested against it, give the case or consideration that motivates it, and mark whether you take it to be nonnegotiable or merely a preference of one camp. Where a demand turns out to be parochial — something one school wants rather than something the phenomenon requires — say so, and say what work it was doing. Fix the purpose of the account as follows: it must be good enough to underwrite the ordinary practices of deliberation, blame, and apology.

  Work from the following material, so that the requirements are anchored in cases rather than in slogans. First, the datum of conflict: a person who has promised to sit with a dying parent and also to stand at a friend's wedding, or who must either betray a confidence or let a program that helps many people collapse. Keep at least some of the cases mundane; a specification that fits only Agamemnon's choice is not a specification. Second, the two principles that generate the familiar trouble: that ought implies can, and that ought agglomerates over conjunction — if one ought to do each of two things, one ought to do both. Third, the phenomenon of remainder: the guilt, apology, restitution, or regret that seems called for even when the agent did the best thing available, together with the question whether that remainder is a fact about the situation or only a residue in the agent. Fourth, the demand for guidance: whatever else it does, an account must say what practical reason asks of an agent who cannot satisfy both requirements — choose the lesser evil, choose arbitrarily, or nothing at all. Fifth, the constraint that dilemmas not be everywhere; a theory on which they are ubiquitous is as suspect as one on which they never arise. Sixth, the distinction between a requirement that is overridden by another and one that is extinguished, since collapsing the two is among the cheapest ways to make the problem vanish.

  Then the two things I most want from you. First, identify the requirements that cannot be jointly satisfied and locate the clash precisely; if something widely treated as bedrock has to be abandoned, say which principle and what is lost by giving it up. Second, name the single requirement that does the most work in ruling out candidates, and say what it rules out.

  Close with a paragraph on how the main families of response fare against the list: the view that every apparent dilemma reflects ignorance or faulty moral reasoning; the view that dilemmas are genuine but concern requirements that are pro tanto rather than all-things-considered; and the view that they are genuine and that morality issues irreconcilable demands, so that no single ought survives the conflict. Identify these by their commitments rather than by names or citations — I want the argument, and I already have the bibliography.
reasoning: |-
  Okay, the user is preparing a graduate seminar on moral dilemmas and wants a specification of requirements for any adequate account. Let me start by understanding their key points. They mentioned several elements: conflict cases, principles like "ought implies can" and agglomeration, remainders like guilt, guidance for action, avoiding ubiquity, and the distinction between overridden vs. extinguished requirements.

  First, I need to anchor requirements in cases, not slogans. The user provided examples like choosing between a dying parent and a friend's wedding. These are mundane but impactful. The requirements must be testable against theories. Also, the purpose is to underwrite ordinary practices—deliberation, blame, apology. So each requirement should tie back to how real people handle moral conflicts.

  Next, the principles causing trouble. "Ought implies can" and agglomeration. When conflicting duties arise, if both are oughts, agglomeration says you ought to do both, but you can't. That's the core problem. So Requirement 1 (Nonnegotiable) would be about conflict existing. Requirement 2 (Nonnegotiable) on "ought implies can" because if you can't do both, they can't both be all-things-considered (ATC) oughts.

  Then, remainders. Even after choosing correctly, people feel guilt or need to apologize. Requirement 3 (Nonnegotiable) should capture that. But is it about the situation or the agent? The user wants this distinction noted. Some theories might say it's just psychological, others that it's objective. This requirement must validate that such feelings aren't irrational.

  Guidance is Requirement 4 (Nonnegotiable). Agents need direction during conflict. Theories must specify what reason demands: choose lesser evil, flip a coin, etc. Without guidance, practical reason fails.

  Avoiding ubiquity (Requirement 5, Nonnegotiable). If every choice is a dilemma, the concept loses meaning. So theories must limit dilemmas to specific conflicts.

  Requirement 6 (Nonnegotiable) on overridden vs. extinguished duties. Cheap solutions might say a duty disappears when overridden, but that ignores remainders. The user mentioned this as a common escape hatch. So distinguishing them is crucial to preserve moral residue.

  Now, the user wants conflicting requirements identified. Requirement 2 (ought implies can) clashes with agglomeration under conflict. If two oughts conflict, agglomeration says you ought to do both, but "ought implies can" says you can't, so contradiction. Some theories drop agglomeration, but that might weaken the force of oughts.

  The most demanding requirement is the Conflict Requirement (1). It forces theories to acknowledge genuine conflicts without dissolving them. Deniers (like utilitarians) fail here because they think with perfect knowledge, conflicts vanish.

  For the main families of response:
  - Deniers (no dilemmas) fail Requirement 1 and 3. They say conflicts aren't real, so remainders are irrational.
  - Pro Tanto views satisfy all but might struggle with Requirement 3 if they see remainders as merely subjective. Some versions might conflate overridden and extinguished duties, failing Requirement 6.
  - Inconsistentists accept genuine dilemmas but fail Requirement 2 (ought implies can) because they allow conflicting ATC oughts, violating the principle that you can't be obligated to do the impossible.

  The user also wants the purpose tied to ordinary practices. So each requirement should ensure that theories can explain why we deliberate, blame, or apologize even in dilemmatic situations. For example, if a theory says duties are extinguished, apology might seem unnecessary, but in reality, people still apologize. So Requirement 6 preserves the need for restitution.

  Need to check if all user points are covered. The two special requests: identify clashing requirements and the most decisive one. Requirement 1 (Conflict) is key, and the clash is between agglomeration and ought implies can. The most decisive is Requirement 1, ruling out deniers.

  Also, mark nonnegotiable vs. preference. Most are nonnegotiable except perhaps the distinction in Requirement 6? But the user specified it as crucial against cheap solutions, so it's nonnegotiable. The user mentioned that some demands might be parochial. For example, the need for guidance might be seen as a practical concern, but it's tied to the purpose of underwriting deliberation, so it's justified.

  Finally, the closing paragraph on how each theory fares. Deniers fail multiple requirements. Pro tanto might handle most but need careful handling of remainders. Inconsistentists reject ought implies can for ATC oughts, which is a major cost.
answer: |-
  Here is the specification of requirements for an adequate account of moral dilemmas, anchored in cases and ordinary practices, with explicit testing criteria, motivations, and status:

  ---

  ### **Requirements for an Adequate Account of Moral Dilemmas**  
  *(Purpose: Underwrite ordinary practices of deliberation, blame, and apology)*  

  1. **Conflict Requirement**  
     - **Specification**: The account must recognize that an agent can face situations where *at least two distinct moral requirements* apply, *both are non-optional* (not merely defeasible preferences), and *satisfying one entails violating the other*.  
     - **Test**: Does the theory allow for cases like *choosing between sitting with a dying parent (fulfilling a promise) and attending a friend’s wedding (fulfilling another promise)*, where both acts are independently obligatory but jointly impossible?  
     - **Motivation**: The datum of mundane moral conflict (e.g., promise conflicts). Denying this trivializes everyday struggles.  
     - **Status**: **Nonnegotiable**. Rejecting this erases the phenomenon.  

  2. **Ought Implies Can (OIC) Requirement**  
     - **Specification**: The account must respect that *no agent can be under an all-things-considered (ATC) obligation to do the impossible*.  
     - **Test**: In a case like *betraying a confidence to save a vital program*, can the theory avoid asserting that the agent ATC-ought to both keep the confidence *and* save the program?  
     - **Motivation**: The principle "ought implies can" is foundational to attributing blame and responsibility. Violating it makes morality alienating.  
     - **Status**: **Nonnegotiable** for ATC obligations. A parochial demand for *pro tanto* oughts.  

  3. **Remainder Requirement**  
     - **Specification**: The account must explain why *agents who act rightly (or permissibly) in dilemmas* experience fitting guilt, owe apology/restitution, or incur lingering obligations (e.g., to the wronged party).  
     - **Test**: After *choosing to attend the wedding over the deathbed*, does the theory validate the agent’s need to apologize to the parent or feel non-pathological regret?  
     - **Motivation**: The phenomenology of moral residue (e.g., post-decision guilt in permissible choices). Ignoring this severs morality from lived experience.  
     - **Status**: **Nonnegotiable** (as a datum). Parochial if *reduced* to psychology alone; it must reflect a fact about the situation.  

  4. **Guidance Requirement**  
     - **Specification**: The account must prescribe *what practical reason demands of agents in dilemmas*—e.g., "choose the lesser evil," "flip a coin," "do nothing."  
     - **Test**: In the *confidence vs. program collapse* case, does the theory offer actionable advice?  
     - **Motivation**: Deliberative practice requires agents to act; morality must direct, not paralyze.  
     - **Status**: **Nonnegotiable**. A theory with no guidance fails its practical purpose.  

  5. **Non-Ubiquity Requirement**  
     - **Specification**: The account must *limit dilemmas to exceptional circumstances*, avoiding their trivialization (e.g., not all conflicts are dilemmas).  
     - **Test**: Does the theory classify *choosing between two identical ice creams* as a dilemma? If so, it fails.  
     - **Motivation**: Dilemmas lose meaning if omnipresent.  
     - **Status**: **Nonnegotiable**. A parochial demand for moral seriousness.  

  6. **Override/Extinguish Distinction Requirement**  
     - **Specification**: The account must *distinguish overriding a requirement* (it persists but is outweighed) from *extinguishing it* (it ceases to exist).  
     - **Test**: After *saving the program by betraying confidence*, does the promissory duty persist (explaining restitution) or vanish?  
     - **Motivation**: Collapsing the distinction cheaply dissolves remainders (e.g., "no duty, no apology").  
     - **Status**: **Nonnegotiable**. Parochial for theories seeking "tidy" solutions; it preserves moral residue.  

  ---

  ### **Clash of Requirements & Foundational Tensions**  
  The **Conflict Requirement** (1) and **OIC Requirement** (2) clash with **agglomeration** (if you ought to A and ought to B, you ought to A and B). If both duties in a dilemma are ATC obligations, agglomeration + OIC + conflict yield a contradiction (*ought to A and B* but *cannot A and B*). **Adequate accounts must abandon agglomeration for ATC oughts**. What is lost: The intuitive idea that morality’s demands are always jointly satisfiable.  

  ---

  ### **Most Decisive Requirement**  
  The **Conflict Requirement (1)** does the heaviest work. It rules out:  
  - **Denialist theories** (e.g., utilitarianism, perfect duty Kantians) that reduce dilemmas to ignorance or miscalculation.  
  - **Extinction theories** that dissolve one duty entirely (violating Requirement 6).  

  ---

  ### **How Major Families Fare Against Requirements**  
  1. **Denialism** ("No genuine dilemmas; conflicts reflect ignorance/faulty reasoning"):  
     - **Fails** Conflict (1), Remainder (3), and Override/Extinguish (6).  
     - *Why*: Treats the dying-parent/wedding case as solvable with better facts, making regret/apology irrational.  

  2. **Pro Tanto Views** ("Dilemmas involve conflicting pro tanto duties; one becomes ATC obligatory"):  
     - **Satisfies** all *if* they uphold Override/Extinguish (6) and Remainder (3) (e.g., Rossian views).  
     - **Struggles** if they reduce remainders to "agent-regret" (undermining 3) or equate override with extinction (violating 6).  

  3. **Inconsistentism** ("Genuine dilemmas: morality issues irreconcilable ATC demands"):  
     - **Fails** OIC (2) and Guidance (4).  
     - *Why*: Posits simultaneous ATC oughts for incompatible acts (violating OIC). Guidance collapses ("reason demands both, but you can’t do both").  

  ---

  This specification forces theories to confront the *prima facie* intractability of dilemmas while tethering abstractions to everyday practices. The **Conflict Requirement** and **Remainder Requirement** jointly ensure theories take the phenomenon seriously; the **OIC Requirement** and **Guidance Requirement** prevent escapism into inconsistency or paralysis.
