  First, I should unpack their core concern: they've reduced materialism to the claim that the material base "selects" ideas rather than produces them, like natural selection. But their friend argues this makes the theory unfalsifiable and smuggles in purpose. The user's defense about "stability feedback loops" feels vague even to them. They want a verdict based on concrete historical analysis, not abstract surveys.

