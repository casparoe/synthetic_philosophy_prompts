prompt: |-
  I'm a novelist — historical stuff, mostly, though the history is usually a frame I'm lying about — and I've got a question I keep half-answering and then losing. When I write the middle of a book, the part that has to make a reader feel why things went the way they did, I'm doing something that feels a lot like explaining. Then I read a real historian and think, no, thats something else, they've got evidence and I've got momentum. Except I can't actually say what the difference is, and I've started to suspect nobody can, which is either a relief or a disaster for me.

  So before I read any more of it I want the spec, not the theory. What would any account of historical explanation have to get right to be worth having? And I'll fix the purpose, since I know adequacy is relative to something: I want something good enough that I can tell when my causal story is doing real explanatory work and when its just a shape that reads well.

  Give me the list of requirements, and for each one the case or consideration that puts it on the list. I want these specifically handled, because they're the ones that actually bite me:

  - the contrastive thing. Why the mill shut rather than limped along another decade — same facts, different question, and it seems like you get different explanations. Does the account have to allow that, and does it have to say which contrast is the right one?
  - absences. A letter that never arrived, a warning nobody gave, a vote that didn't happen. Can something that didn't occur be part of the explanation of what did?
  - scale. Explaining why the empire went under, and explaining one general's decision on one afternoon. Do those two have to agree with each other? What if the close-up story makes the big story look like a fiction?
  - hindsight. A well-shaped story makes the outcome feel like it had to happen. Is that a feature of explanation or a bias the account has to guard against?
  - rival stories. Two historians, same evidence, two narratives that can't both be true, both defensible. Does a good account of explanation have to pick a winner, or is that the theory failing rather than the historians?
  - the law thing. Whatever history has going for it, its not laws the way physics has laws. The account can't quietly need them.
  - the deduction worry. You can deduce the flagpole's height from the length of its shadow, and nobody thinks the shadow explains the pole. So whats missing there, and does the account have to say?
  - order. Does the order of the telling carry explanatory weight, or is it packaging? If order matters, what does a badly ordered explanation get wrong?
  - significance. What makes a detail part of the explanation and not just atmosphere? This one is maybe the most important to me and the one I never see anybody address.

  Then mark which requirements are non-negotiable and which are just preferences of one camp. Flag any pair you think can't both be met — I suspect theres at least one, something like the demand that the explanation be checkable by someone who has the evidence but not the historian's imagination, set against the demand that it capture the particular, once-only, unfolding character of the thing. If a pair can't be satisfied together, say so plainly, because thats the part I most want and I'd rather have a shorter list that holds.

  You can spend a couple of lines at the end on how the covering-law picture and the narrative-is-itself-an-explanation people come out against the list, but keep it short, I care way more about the list. No reading list please, and no citations, I'm not going to go read Hempel, I want the spec.

  Last line, exactly this form and nothing after it: \answer{...} — and inside the braces put the name of the one requirement that knocks out the most candidates, in as few words as you can.
reasoning: |-
  Alright, let's tackle this novelist's query. They're struggling with the difference between historical explanation in their fiction versus real historiography. The user wants a practical "spec" list of requirements for what makes an explanation valid, especially focused on their pain points like contrast, absences, and significance. 

  First, I need to unpack each of their nine bullet points. For contrast, it's crucial because explanations change based on the question asked—why the mill shut vs. why it didn't survive longer. The account must allow different contrasts but shouldn't dictate which is "right," as context determines relevance. 

  Absences are tricky. A missing letter can explain an outcome if its presence was expected. The account must permit causal absences but carefully—only when there's a norm of occurrence. 

  Scale conflicts are inevitable. Macro and micro explanations won't always align; the account shouldn't force harmony. Hindsight bias is a pitfall—good explanations avoid inevitability narratives. 

  Rival stories are inherent to history; the account shouldn't demand single truths. No laws—history relies on contingent patterns, not physics-like laws. Deduction issues (shadow vs. flagpole) highlight directionality—causes must precede effects and have asymmetric dependence. 

  Order matters because narrative sequence affects understanding; poor ordering obscures causal links. Significance is the user's key concern—details are explanatory if altering them changes the outcome, not just atmospheric. 

  Now, non-negotiables: contrastive flexibility, absence allowance (with norms), scale independence, hindsight avoidance, rivalry tolerance, lawlessness, asymmetric causality, sequence sensitivity, and significance via dependency. Preferences include how contrasts are chosen or narrative styles. 

  The tension between particularity and testability is real. Capturing uniqueness clashes with evidence-based verification. They can't both be fully satisfied—prioritize testability to avoid fabrication. 

  Covering-law models fail most requirements, especially lawlessness and narrative order. Narrative explanations handle particularity but struggle with testability. The knockout requirement is "Significance as counterfactual dependency" because it's vital yet often overlooked, filtering out theories that can't distinguish causes from background.
answer: |-
  Here's the spec for historical explanation tailored to your needs. Non-negotiables are **bolded**; preferences are *italicized*. Conflicting pairs are marked.

  ---

  ### Requirements for an Adequate Account of Historical Explanation
  1. **Contrastive Flexibility**  
     *Must allow that explanations answer "Why X rather than Y?" and that the contrast (Y) changes the explanation.*  
     **Non-negotiable**: The mill shutting *vs.* limping requires different causal emphases (e.g., market collapse *vs.* maintenance failures). The account **must not** dictate a single "right" contrast; *it may suggest context determines relevance*.

  2. **Absences as Causes**  
     *Must permit non-events (e.g., undelivered warnings) to be explanatory.*  
     **Non-negotiable**: Absences only count where there was a *normative expectation* (e.g., a courier’s duty). Without this, history ignores critical silences.

  3. **Scale Independence**  
     *Must allow macro (empire’s fall) and micro (general’s decision) explanations to coexist without requiring agreement.*  
     **Non-negotiable**: Contradictions are inherent (e.g., a general’s rational choice may not reflect empire-wide irrationality). Forcing alignment creates fiction.

  4. **Hindsight Neutrality**  
     *Must avoid making outcomes seem inevitable.*  
     **Non-negotiable**: Good explanations emphasize *contingency* (e.g., "It happened because A, B, C—not because it had to"). Inevitability is bias, not feature.

  5. **Rival Story Tolerance**  
     *Must accommodate defensible, mutually exclusive narratives from the same evidence.*  
     **Non-negotiable**: No requirement to pick a "winner." Rivals reflect interpretive gaps or weight given to different facts (e.g., economic *vs.* cultural lenses).

  6. **Lawlessness**  
     *Must not rely on universal laws (e.g., "All empires decline after X years").*  
     **Non-negotiable**: History explains via contingent patterns, not deductive rules. Physics-like laws falsify historical particularity.

  7. **Directional Causality**  
     *Must distinguish causes from coincidences by requiring asymmetry.*  
     **Non-negotiable**: Shadows don’t explain flagpoles because causation flows *forward* in time and depends on *dependence* (pole height → shadow, not vice versa). *The account must enforce temporal/causal direction*.

  8. **Narrative Order Significance**  
     *Must treat sequencing as explanatory, not just packaging.*  
     **Non-negotiable**: Poor ordering obscures causal links (e.g., describing a treaty *before* the battle that forced it implies the battle was irrelevant). Sequence reveals dependency.

  9. **Significance via Dependency**  
     *Must define explanatory details as those where alteration changes the outcome.*  
     **Non-negotiable**: Atmosphere is fixed background; explanation is *difference-making* (e.g., "The king’s headache" matters only if it altered his decision). *Counterfactual robustness* is key.

  ---

  ### Conflicts & Tolerances  
  - **Irreconcilable Pair**: **Testability** (verification by evidence alone) **vs. Particularity** (capturing unique unfolding).  
    - *Conflict*: Testability demands objective checks; particularity requires subjective interpretation of context. **They cannot both be fully satisfied**. Prioritize testability to avoid fabrication.  
  - *Preference*: How contrasts are chosen (pragmatic *vs.* objective).  
  - *Preference*: Handling rival stories (pluralism *vs.* skepticism).  

  ### How Major Theories Fail the Spec  
  - **Covering-Law (Hempel)**: Violates **6** (needs laws), **5** (demands single "correct" explanation), **9** (no significance criterion).  
  - **Narrativeism (Danto, White)**: Aces **8** and **3**, but struggles with **7** (directionality) and **9** (significance often aesthetic).  

  \answer{Significance via Dependency}
