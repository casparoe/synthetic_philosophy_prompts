  If courts actually adopted Benatar's view, everything would change. Duty of care would extend to the unconceived child, damages would need to account for existence itself being harmful, and prenatal screening might become mandatory. But that's not where the law is now - it's clinging to life as an absolute good while making pragmatic concessions about costs.

