answer: |-
  The legal distinction between wrongful birth and wrongful life claims reveals a complex, often contradictory axiological framework—one that carefully avoids committing to a definitive stance on whether existence can be worse than non-existence. Here's a reconstruction of the implicit theory of harm and value, its limitations, and its relationship to Benatar's asymmetry:

  ### Core Presuppositions of the Legal Split:
  1. **Non-Comparability of Existence and Non-Existence**:  
     The primary doctrinal anchor is **epistemic humility**: Courts assert that comparing a disabled existence to non-existence is logically impossible or beyond human capacity. *Gleitman v. Cosgrove* (NJ, 1967) typifies this: "Measuring the value of life with impairments against non-existence is a metaphysical impossibility."

  2. **Life as a Categorical Benefit**:  
     Most jurisdictions implicitly treat life itself—even with severe disabilities—as an **absolute good**. Non-existence is framed as a "non-state" that cannot be preferred, as in *McKay v. Essex Health Authority* (UK, 1982): "It is illogical to claim non-existence is preferable to a life of suffering."

  3. **Duty and Standing Limitations**:  
     The law prioritizes relational duties: Physicians owe information to *parents* (existing persons), not to unconceived potential persons. The child’s claim fails partly because no duty existed pre-conception.

  4. **Harm Requires an Alternative Baseline**:  
     For the child, "harm" requires a better pre-injury state. Since non-existence isn't a "state of being," the child lacks a cognizable baseline for comparison. Parents, however, had an injury-free baseline (no child/unimpaired child).

  ### What the Doctrine Does *Not* Commit To:
  - **That All Life is Worth Living**: Courts avoid this universal claim. Awards to parents for "extraordinary costs" tacitly acknowledge that disability imposes burdens—implying existence *can* be net-negative in welfare terms for caregivers.
  - **Benatar's Asymmetry is Rejected**: The categorical refusal of wrongful life claims *does* conflict with Benatar. If courts accepted that existence introduces unavoidable harms while non-existence avoids harm *without deprivation*, they could not dismiss the child’s claim as incoherent.

  ### Deviations and Their Implications:
  - **Economic-Only Recovery for Children** (e.g., California, *Turpin v. Sortini*):  
    Allows recovery for provable costs (e.g., medical expenses) but bars damages for "pain of existence." This presupposes:  
    - Existence itself cannot be quantified as harm.  
    - Economic harms are measurable without judging existence's value.  
    → **Compatible with weak comparability**: Existence is a precondition for harm, but only *tangible losses within life* are compensable.
    
  - **Dignity Objections** (e.g., German Constitutional Court):  
    Condemns wrongful life suits as discriminatory against the disabled while permitting parental recovery. This relies on:  
    - A **relational harm model**: Harm is defined by societal/parental burdens, not the child’s subjective experience.  
    - **Moral separation**: Compensating costs ≠ devaluing life.  
    → Creates an unresolved tension: If disability imposes compensable costs, how is it not a harm *to the child*?

  ### Underdetermined Axiological Commitments:
  The doctrine is **deliberately underdetermined** to avoid metaphysical entanglements. It is compatible with:
  - **Moderate Vitalism**: "Life is always better than non-life, but disability increases burdens."
  - **Agnosticism**: "We cannot know if existence is better, so we default to protecting life."
  - **Person-Affecting Restriction**: Only harms to existing persons (parents) are actionable, not "harms" to potential persons.

  ### If Benatar's Asymmetry Were Adopted:
  Adopting Benatar's view would necessitate radical legal changes:
  1. **Duty Expansion**: Physicians owe duties to unconceived persons to prevent their existence if it would be harmful.  
  2. **Screening Standards**: Prenatal tests must detect conditions making life "not worth starting." Failure could trigger wrongful life claims.  
  3. **Damages Reform**:  
     - Compensation for "net harm of existence" (pain minus joy).  
     - Parents recover costs *plus* compensation for the moral wrong of creating a harmed person.  
  4. **Tort Structure Shift**: Wrongful life becomes a primary claim, with wrongful birth as derivative.  

  ### Conclusion:
  The legal split presupposes **no robust axiology of existence**. It relies on:  
  - **Practical Incommensurability**: Courts refuse to weigh existence vs. non-existence.  
  - **Relational Harm Focus**: Only harms to existing persons (parents) are recognized.  
  - **Strategic Avoidance**: Sidestepping whether life with disability is worse than non-existence.  

  This framework is **incompatible with Benatar’s asymmetry**, which requires acknowledging that existence can be a net harm. The deviations reveal the instability of this avoidance: allowing economic recovery for children admits existence *can* impose measurable harms, while dignity objections highlight society’s discomfort with linking disability to "unworthiness of life." The doctrine persists not because of philosophical coherence, but because it balances compensatory justice for parents against the taboo of quantifying life’s negative value.
