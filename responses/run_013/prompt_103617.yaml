prompt: |-
  So my friend Priya and I burned a whole evening on this and I still can't tell who won. It started because I've been messing around with a display font — I was taking an 'a' and warping it further and further, a slightly squashed bowl, then a lopsided one, then basically a blob with a hook, trying to find the point where it stops being an 'a'. She said there's no point, or rather there's no fact of the matter about it: it's an 'a' as long as a reader reads it as one, and that's graded — some of my ugly shapes were more 'a'-ish than others, and that's all 'a'-ness ever is, a matter of degree in a reader's eye. Here's roughly how it went, I numbered the moves because we kept losing track:

  (1) Me: that's circular. If 'a' just means "whatever gets read as 'a'", you've told me nothing about what the shapes have in common. A kid's scrawl, a double-storey 'a' in a serif font, the single-storey 'a' like in Futura, an italic, a blackletter 'a' — pixel-wise and stroke-wise those share almost nothing, so the something-they-share has to be some abstract relational structure, a bowl and something closing it off, and that structure is what makes them all 'a'.

  (2) Her: they don't share a structure, they share a role. What makes them all 'a' is that trained readers treat them as the same letter, and the role is relative — relative to the other 25 letters, to the font they sit in, to the reader's habits. Change the population of readers and the "essence" changes, which is exactly what you'd expect if there's no essence.

  (3) Me: roles can't be totally free either. You can't draw a shape that's obviously a 'q' and call it your font's 'a' just because it plays the 'a' slot. There are constraints — only certain deformations survive — and those constraints are the thing I'm trying to point at.

  (4) Her: now you're back to prototypes. The constraints are just similarity to the shapes people have already seen a million times, i.e. a statistical summary, not an essence. And similarity is graded, which is my whole point. Take a circle with a little tail, dead between 'a' and 'o' — whether it's 'a' or 'o' is settled by the word it's sitting in, not by the shape.

  (5) Me: so context can make anything into an 'a'?

  (6) Her: no, but context can make a lot of things into an 'a', and that's because the category is built to flex. She'd read somewhere about an old AI project that tried to get a program to design whole alphabets in one consistent style, and she said that's the real answer: 'a'-ness is being generatable by the same rules that generated the other letters. A style is a little generative engine, and a letter is whatever that engine spits out in that slot. Nothing shared, just common origin.

  (7) Me: but you can have a gorgeously consistent style where the 'a' is genuinely unreadable as an 'a' — outsiders see a squiggle. Then it's a failed 'a', which means consistency isn't the test. Being readable as 'a' is, and that's back to your reader.

  (8) Her: readable to whom? Readers of a new font learn it from one sentence of context. And an 'a' that no one ever reads as 'a' — in what sense is it one? I said, same sense a word in a dead language is still a word. She said dead-language words were used by people, so they had roles; a glyph nobody ever reads never had one.

  We went around like that for hours and neither of us budged. Can you adjudicate it move by move — rate each of the eight from clearly wrong to clearly right and say briefly why, then tell me what we're both missing? Lead with your bottom line in the first sentence (who's more right overall, and on what), then the reasoning. No preamble and don't restate my question. And no reading list, I just want the verdict.
