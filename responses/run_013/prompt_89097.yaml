  Biggest risk is the middle section where the framework self-destructs. If delivered poorly, it could feel like "both sides dumb" instead of "both fears valid but intertwined." Need to anchor it in shared purpose: keeping lights on without ruining futures. The cost-benefit pragmatists in the room might eye-roll at first, but showing how commitments transcend economics could hook them.

