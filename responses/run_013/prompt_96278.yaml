prompt: |-
  I'm leading a session on the intentional stance and the attribution of beliefs to AI systems for a graduate reading group in philosophy of mind. They can all repeat that we predict a system by treating it as a rational agent, but none can say what the stance licenses and what it does not. Plan the session rather than give it: the order in which the components must be introduced and why each depends on the one before; the single case that should carry the session; the misconceptions to expect and the exact point at which to head off each; and the closing question that would show whether they have understood the stance or only memorized the formula.

  Two constraints. First, the session must culminate in a distinction I have been using and have not seen stated: between an ascription of belief that does predictive work the system's design does not already do, and one that merely redescribes behavior the design already explains — call the first load-bearing and the second idle. I want the distinction to be forced by the material rather than announced. Second, the carrying case must not be the chess program or the thermostat; it must be a system whose behavior is best predicted by modelling it as a rational agent that is systematically wrong about its own situation, while the system itself contains no state that represents anything. Tell me what that case needs and what it must lack, where the students will wrongly reach for inner representations, and what I should openly refuse to explain at this level. End by telling me how to pose the question of whether ascribing beliefs to a present-day language model is load-bearing or idle.
reasoning: |-
  We are planning a session on the intentional stance, focusing on when belief ascriptions are "load-bearing" vs. "idle". The session must build up to this distinction without announcing it early. The carrying case must be a system that is best predicted by treating it as a rational agent with false beliefs, but which has no internal representations. We avoid chess programs and thermostats.

  Structure of the Session:

  1. Introduction: Recap the intentional stance (5 mins)
     - Remind them of Dennett's definition: predicting behavior by treating the system as a rational agent that has beliefs and desires to achieve goals in light of those beliefs.
     - Ask: "What does the intentional stance allow us to do?" (They will say prediction.) Then: "But what does it license? What can we say about the system? And what does it not license?"

  2. The Core Case: A System Without Representations (25 mins)
     - We need a case that meets these criteria:
       - The system's behavior is complex and best predicted by ascribing beliefs and desires.
       - The system itself has no internal states that are representations (no "aboutness").
       - The system is systematically wrong about its environment (so we ascribe false beliefs).
       - The system's design does not involve any cognitive architecture that we would typically associate with beliefs (like a language model, but we cannot use that because we'll use it later; also we want a simpler case).

     Proposed Case: **A simple robot that navigates a maze using only reflexes and fixed rules, but the maze has been altered so that the robot's rules lead it to make systematic errors.**

     - Description of the robot:
       - The robot is designed to follow a left-wall-following rule to get out of a maze. It has sensors to detect walls and obstacles, and it moves by turning left when it hits a wall or when a sensor indicates a wall is on the left. (This is a very simple reflex agent.)
       - However, we alter the maze: we add mirrors that make the robot "see" walls where there are none and not see walls where there are some. As a result, the robot gets stuck in a loop or behaves in a way that we can only explain by saying it "thinks" there is a wall when there isn't, or vice versa.

     - Why this case?
       - The robot has no internal representations of the maze or its own position. It only has hardwired reflexes (if sensor input X, then move Y).
       - But we can predict its behavior by ascribing false beliefs: "The robot believes there is a wall in front of it (when there isn't)" or "The robot believes the path is clear to the left (when there is a wall)".
       - The intentional stance gives us a compact way of predicting the robot's behavior without having to simulate every sensor reading and motor response.

     - What the case must lack:
       - No memory of the maze layout.
       - No internal map.
       - No state that we can interpret as a representation of the world (only sensory inputs and immediate motor outputs).

     - Where students will go wrong: They might think that the sensor states or the internal rules "represent" the world. We must head this off by emphasizing that the robot's internal states are not about the world in a semantic sense; they are just physical states triggered by sensors and causing movements. The robot does not have a model of the world that it updates.

     - What to openly refuse to explain: Do not get into the details of how the sensors work (the physics of the mirrors and sensors) because that is the design stance. We are at the intentional stance level.

  3. Drawing Out the Distinction: Load-Bearing vs. Idle (20 mins)
     - Now, we have two ways to explain the robot's behavior:
       a. The design stance: We look at the program and the sensors and compute the behavior step by step.
       b. The intentional stance: We say the robot has the goal to escape the maze and it believes that following the left wall will lead to the exit. But because of the mirrors, it has false beliefs about the walls.

     - Question: Which stance is more efficient? (Intentional, because the design stance would require tracking every sensor reading and motor command.)

     - Now, introduce a twist: Suppose we have a second robot in the same maze that is identical to the first but without the mirrors. We can predict its behavior by the intentional stance: it believes following the left wall will work and it is correct. But note: the design stance also explains the behavior. So, in the first robot, the belief ascription (with false beliefs) is doing work because without it we would have to do a complex design-stance analysis to account for the errors. In the second robot, the belief ascription is just a redescription of the design: the robot is programmed to follow the left wall and it does.

     - This leads to the distinction without announcing it:
       - In the first robot (with mirrors), the belief ascription is **load-bearing**: it is doing predictive work that the design stance would find cumbersome. We are using the intentional stance to make a prediction that we couldn't easily make by just knowing the design (because the design doesn't account for the mirrors).
       - In the second robot (without mirrors), the belief ascription is **idle**: we are just restating what we already know from the design. We could predict the behavior equally well by the design stance.

     - Why the intentional stance is still used for the second robot? Because it is a convenient shorthand. But it isn't doing any new work.

     - Misconception to head off: Students might think that the intentional stance is only for systems that have representations. We head this off by pointing out that in the first robot, we are using the stance for a system without representations and it is doing real work. The stance is about prediction, not about what is inside.

  4. Application to Present-Day Language Models (10 mins)
     - Now, pose the question: When we ascribe beliefs to a language model (like GPT-4), is that ascription load-bearing or idle?
     - We must consider:
       - The design stance for a language model: it is a neural network trained on a massive dataset to predict the next word. It doesn't have explicit representations of facts, but it has learned patterns.
       - The intentional stance: we treat it as having beliefs (e.g., "It believes that Paris is the capital of France") and desires (e.g., "It wants to produce coherent text").

     - How to pose the question:
       - "When we say the language model 'believes' that Paris is the capital of France, are we making a load-bearing ascription? That is, does this belief ascription allow us to predict behavior that we couldn't predict (or couldn't predict as easily) by looking at the design (the training data and the model architecture)? Or is it just an idle redescription of the model's training (since it was trained on text that says Paris is the capital of France)?"

     - We don't resolve it, but we leave it as the closing question to show understanding. The students should be able to see that if the model's behavior can be fully predicted by the design stance (i.e., by knowing the training data and the algorithm), then the belief ascription is idle. But if the intentional stance allows us to predict novel behaviors that the design stance cannot easily account for (like answering a question in a new way that wasn't in the training data but is rational given the belief), then it might be load-bearing. However, note that the design stance might still be able to account for it by the model's pattern-matching. So it's a debate.

  5. Closing Question (5 mins)
     - The closing question is: "When we ascribe beliefs to a language model, is that ascription load-bearing or idle? Why?"
     - They should be able to articulate:
       - If the ascription is load-bearing, it must be because without it we would have to do a more complex, less efficient prediction using the design stance (like simulating every neuron or tracking every training example). But if we can predict the model's outputs just as well by knowing the training data and the algorithm, then the ascription is idle.

     - This shows whether they have understood the stance: if they can apply the load-bearing/idle distinction to a new case and reason about what the design stance would involve, they have gone beyond memorization.

  Timing:
  - Introduction: 5 mins
  - Core Case: 25 mins (including discussion of false beliefs and why no representations)
  - Distinction: 20 mins (contrasting the two robots and drawing the distinction)
  - Language Model Application: 10 mins
  - Closing Question: 5 mins

  Total: 65 minutes (adjust as needed).

  Note: The entire session must be driven by the core case. The distinction must emerge from the contrast between the two scenarios (with and without mirrors) for the same robot design.
answer: |-
  ### Session Plan: Intentional Stance and Belief Ascription in AI Systems  
  **Goal:** Move students from rote repetition of Dennett's intentional stance to understanding *when* belief ascriptions are **load-bearing** (predictively essential) vs. **idle** (merely redescriptive). The distinction must emerge organically.  

  ---

  #### **1. Introduction: Pressure-Testing the Formula (5 mins)**  
  - **Order & Dependencies:** Start by asking students to define the intentional stance. They will recite: *"Predict behavior by treating the system as a rational agent with beliefs/desires."*  
  - **Why this first?** Establishes baseline understanding. Immediately challenge it: *"If we can predict a calculator’s output by assuming it ‘wants’ to add numbers correctly, is that the intentional stance? Why/why not?"*  
  - **Head off misconceptions:** Students may conflate *any* successful prediction with the stance. Clarify: The stance is *only* invoked when behavior is **explained by rationality** (e.g., the calculator isn’t *rational*; it’s deterministic).  

  ---

  #### **2. Core Case: The "Deluded" Navigation Robot (25 mins)**  
  **Case Requirements:**  
  - **Must have:** A system whose behavior is *best predicted* by modeling it as a rational agent with **false beliefs** about its environment.  
  - **Must lack:** Any internal state that semantically represents the world (no maps, symbols, or propositional attitudes).  
  - **Why not chess/thermostat?** Chess programs have internal representations; thermostats lack complex enough behavior to necessitate rationality-based prediction.  

  **Case Description:**  
  - **System:** A room-cleaning robot programmed with simple rules:  
    1. Move forward until an obstacle is detected.  
    2. If obstacle, turn 90° right.  
    3. Repeat.  
  - **Environment:** A *mirror-walled room* where reflections create "phantom obstacles." The robot constantly turns away from non-existent walls, looping endlessly.  
  - **Intentional-stance prediction:** We predict its path by saying: *"It believes obstacles block its path when none exist. It desires to clean the room, so it rationally avoids collisions."*  

  **Discussion Flow:**  
  1. *Ask:* "How do we predict the robot’s path in the mirrored room?"  
     - Students will reach for beliefs (e.g., "It thinks there’s a wall!").  
  2. *Press:* "Where is the ‘belief’ stored? Show me the code or hardware state that *means* ‘wall ahead’."  
     - **Refuse to explain:** Openly state: *"We won’t examine sensor physics or code. The stance is agnostic to implementation."*  
  3. **Where students err:**  
     - *Misconception:* "The sensor input *is* the belief."  
     - **Head off here:** Point out sensors trigger *hardcoded responses* (turn right). No state "represents" obstacles; it’s causal, not semantic. The belief ascription is a *tool for us*, not in the system.  
  4. *Pivotal question:* "Could we predict this without beliefs? How?"  
     - Contrast with a *mirror-free room*: Design stance suffices (rules → straight path). Beliefs are idle here. In the mirrored room, design stance is chaotic (tracking light reflections); belief ascription is efficient and load-bearing.  

  ---

  #### **3. Forcing the Load-Bearing vs. Idle Distinction (20 mins)**  
  - **Order & Dependencies:** Build on the robot case. Without the mirrored room, the distinction is invisible.  
  - **Activity:** Draw two scenarios:  
    - **Scenario A (Mirrored):** Robot loops erratically.  
    - **Scenario B (No Mirrors):** Robot cleans systematically.  
  - *Ask:* "In which scenario does saying ‘It believes there’s a wall’ *add predictive power* beyond the design?"  
  - **Emerge the distinction:**  
    - **Idle ascription (B):** Redescribes what the code *already* explains (e.g., "belief" ≡ sensor input).  
    - **Load-bearing ascription (A):** Predicts novel failures (loop patterns) the design *doesn’t account for*, as it ignores mirror-induced errors.  
  - **Misconception to head off:** "All successful predictions validate the stance." **Correct here:** Not if the design stance is simpler (e.g., Scenario B). Load-bearing requires *explanatory necessity*.  

  ---

  #### **4. Culmination: Language Models and the Load-Bearing Test (10 mins)**  
  - **Pose the question:**  
    *"When we say GPT-4 ‘believes’ that Paris is the capital of France, is this ascription **load-bearing** or **idle**? Consider:  
    - The design stance: It predicts tokens via statistical patterns from training data.  
    - The intentional stance: It ‘rationally’ answers based on ‘beliefs’ about the world."*  
  - **Probe deeper:**  
    - *If idle:* The response "Paris is the capital" is *fully* predicted by training data correlations; calling it a "belief" adds nothing.  
    - *If load-bearing:* Does treating it as rational explain *unpredictable behaviors*? (e.g., inferring "Lyon is not the capital" without explicit training).  
  - **Why this closes the session:** Tests if they see the stance as a *pragmatic tool*, not metaphysical commitment. Correct application hinges on whether design-stance explanations are insufficient.  

  ---

  #### **5. Closing Question (5 mins)**  
  **"When GPT-4 answers a question it wasn’t directly trained on (e.g., ‘Is Paris north of Lyon?’), does attributing a ‘belief’ about French geography do *predictive work* the model’s design doesn’t already explain? Or is it a redescription?"**  
  - **Success metric:** Students who grasp the stance will:  
    - Note GPT-4’s design (statistical learning) *can* explain this via pattern interpolation.  
    - Argue beliefs are **idle** unless the stance predicts *novel rational behaviors* (e.g., coherently relating beliefs) that transcend statistical correlations.  
  - **Failure sign:** Reverting to "It has beliefs because it acts rationally!" without addressing explanatory gaps.  

  ---

  ### Session Rationale  
  - **Why the robot case?** It lacks representations but *requires* belief ascription for efficient prediction in distorted environments. Forces students to decouple the stance from internal realism.  
  - **Why the distinction emerges?** By contrasting the robot’s behavior in mirrored vs. normal rooms, students *feel* when belief ascriptions become necessary.  
  - **Why refuse sensor explanations?** To avoid design-stance retreats. The stance is about prediction, not mechanism.  
  - **Why end with language models?** It’s contemporary, complex, and exposes the tension: Are we explaining or anthropomorphizing?  

  This structure ensures students don’t just memorize Dennett’s formula but wield it critically—distinguishing when beliefs *do work* from when they dress up design.
