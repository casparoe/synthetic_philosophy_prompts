answer: |-
  Let's break down the book's description of the Axiom of Choice (AC) claim by claim, separating accurate statements from simplifications or inaccuracies. I'll also address the philosophical conclusion and what a pro-AC mathematician might say. This is based on standard set theory (ZF/ZFC) and historical context.

  ### Claim-by-Claim Analysis
  1. **"The axiom of choice says that given any collection of non-empty sets, no matter how large, you can form a new set by picking exactly one member out of each of them."**  
     - **Accuracy**: Mostly accurate, but with a subtle simplification.  
       - Technically, AC applies to any *set* of non-empty sets (not a "collection" in the vague sense, to avoid paradoxes like Russell's).  
       - "Picking" is metaphorical; AC asserts the *existence* of a choice function (a set that selects one element from each member of the collection).  
     - **Simplification**: The "no matter how large" part is correct but might mislead. AC is crucial for infinite collections (especially uncountable ones), but for finite collections, it's provable without AC.  

  2. **"It seems like it hardly even counts as an assumption... but it turns out to be independent of the rest of set theory."**  
     - **Accuracy**: Correct on independence. AC is independent of ZF (Zermelo-Fraenkel set theory), meaning neither AC nor its negation can be proven from ZF alone (shown by Gödel in 1938 for consistency, Cohen in 1963 for independence).  
     - **Simplification**: The "hardly counts as an assumption" part is a pedagogical device. While AC seems obvious for finite sets, its intuitive obviousness breaks down for infinite sets (e.g., defining a choice function for uncountably many sets of real numbers). Some mathematicians (e.g., constructivists) reject it precisely because it *isn't* obvious for infinite collections.  

  3. **"That's part of why its consequences are so alarming; the Banach-Tarski result... is the famous case."**  
     - **Accuracy**: Banach-Tarski *is* a consequence of AC, and it is correctly described (cut a ball into 5 pieces, reassemble into two identical balls using rigid motions).  
     - **Simplification**:  
       - The "alarming" nature is overstated. Banach-Tarski relies on non-measurable sets—which AC permits—but it's not a paradox; it's a counterintuitive result about infinite sets and the limitations of volume in non-measurable sets.  
       - "Without bending or stretching" is correct but incomplete: the pieces are pathological (non-constructible and non-measurable), which is the real issue.  
     - **Minor Inaccuracy**: Banach-Tarski requires the *full* AC; weaker choice axioms won't suffice.  

  4. **"The reason it's controversial is that the choice set is non-constructive: the axiom assures you that one exists but gives you no rule for finding it..."**  
     - **Accuracy**: Perfect. This is the core controversy. AC proves the existence of objects (e.g., a choice function, a basis for ℝ as a ℚ-vector space) but provides no algorithm or explicit description. This clashes with constructive mathematics, which requires explicit constructions.  

  5. **"This is why it's needed even for fairly basic results, like the fact that a countable union of countable sets is countable, or that every vector space has a basis."**  
     - **Accuracy**: Mostly correct, but with caveats:  
       - *Countable union of countable sets*: In ZF (without AC), this is **not provable**. It requires *countable choice* (a weaker form of AC), not full AC.  
       - *Every vector space has a basis*: True—this is equivalent to AC. For example, ℝ has no explicit basis as a vector space over ℚ without AC.  
     - **Simplification**: Calling these "basic" might mislead. They're fundamental but not "basic" in the sense of being trivial—they involve infinite sets. Some results (e.g., finite-dimensional vector spaces) don't need AC.  

  6. **"Most mathematicians have made their peace with it on the grounds that the alternatives are worse, but the constructivists won't touch it."**  
     - **Accuracy**: Largely correct.  
       - AC is accepted in mainstream (classical) mathematics because it simplifies proofs (e.g., in analysis, topology, algebra) and avoids fragmented alternatives.  
       - Constructivists/intuitionists (e.g., followers of Brouwer) reject AC because it violates computational meaningfulness.  
     - **Simplification**: "Alternatives are worse" is subjective. Working without AC is feasible in some domains (e.g., computable mathematics), but it complicates many areas (e.g., functional analysis).  

  ### The Book's Philosophical Conclusion
  The book claims:  
  > *"The axiom of choice is neither true nor false but a tool you can take or leave, and that the historical fuss over it was never really about mathematics."*  

  - **What's Accurate**:  
    - AC *is* a tool you can take or leave, thanks to its independence. You can work in:  
      - **ZFC** (ZF + AC): Standard for most mathematics.  
      - **ZF + ¬AC**: Allows models where AC fails (e.g., all sets are measurable).  
      - **Weaker axioms** (e.g., Dependent Choice): Used in analysis to avoid pathologies.  
    This is similar to geometry: Euclidean vs. non-Euclidean are consistent but describe different "worlds."  

  - **What's Overstated or Smuggled In**:  
    - **"Never really about mathematics"**: This is false. The fuss *was* deeply mathematical:  
      - Early critics (e.g., Lebesgue, Borel) objected because AC produced non-measurable sets, breaking measure theory.  
      - Hilbert spaces, algebraic closures, and Tychonoff's theorem all need AC—without it, core results collapse. The debate centered on what counts as valid proof.  
    - **"Neither true nor false"**: While technically correct due to independence, this ignores philosophical stances:  
      - **Platonists** (many set theorists) believe AC *is* "true" because it aligns with the intuitive concept of sets (e.g., the universe of sets satisfies ZFC).  
      - **Formalists** see it as a tool, but even they acknowledge that rejecting AC has mathematical costs (e.g., ℝ can be a countable union of countable sets without AC, violating intuition).  
    The conclusion downplays the mathematical *consequences* of accepting/rejecting AC, reducing it to a mere preference.  

  ### What a Pro-AC Mathematician Would Object To
  A mathematician who believes AC is "true" (e.g., a set-theoretic Platonist) would argue:  
  1. **AC is "natural" for infinite sets**: Just as finite sets don't need AC because you can "see" the choices, infinite sets should allow choices by analogy. Rejecting AC creates artificial constraints (e.g., "you can't choose socks from infinitely many pairs" is a human limitation, not a set-theoretic one).  
  2. **Banach-Tarski isn't "alarming"**: It's a quirk of allowing non-measurable sets—not AC's fault. In "well-behaved" universes (e.g., with determinacy), such paradoxes vanish, but AC is still useful elsewhere.  
  3. **The "non-constructive" critique misses the point**: Mathematics isn't just about computability; it's about abstract existence. AC unifies and simplifies proofs (e.g., "every ring has a maximal ideal")—without it, math becomes cluttered with exceptions.  
  4. **Rejecting AC leads to worse outcomes**:  
     - Without AC, ℝ can be a countable union of countable sets (contradicting standard intuition).  
     - Vector spaces without bases (e.g., ℝ over ℚ) make linear algebra unworkable.  
     - Key theorems (e.g., Tychonoff's theorem in topology) fail.  
  5. **Independence ≠ Arbitrariness**: AC's independence doesn't make it "not true"—it reflects the richness of set theory. Models where AC fails are often pathological (e.g., with non-Russell socks).  

  ### Summary of the Book's Fairness
  - **Overall**: The book is **mostly fair for a popular account**, but it oversimplifies nuances and overstates the "alarming" nature of AC.  
  - **Strengths**: Correctly explains non-constructiveness, independence, and Banach-Tarski.  
  - **Weaknesses**:  
    - Undersells the mathematical necessity of AC (it's not just for "basic" results but for entire fields).  
    - Misrepresents the controversy as "not about mathematics" when it was deeply mathematical.  
    - Uses "how could you fail?" rhetoric that ignores legitimate objections.  
  - **Philosophical Smuggling**: Yes, the conclusion frames AC as a neutral tool, but this is a *formalist* perspective. It glosses over the fact that for many mathematicians, AC is "true" in a substantive sense, and rejecting it alters mathematics in profound (and often undesirable) ways.  

  If you're not a set theorist, the key takeaway is this: AC is a powerful, non-constructive tool that simplifies classical mathematics but comes with trade-offs. The book's description is serviceable for intuition, but its conclusion leans too hard into relativism—the "fuss" was (and is) about both mathematics *and* philosophy. For deeper study, see sources like Jech's *The Axiom of Choice* or Moore's *Zermelo's Axiom of Choice*.
