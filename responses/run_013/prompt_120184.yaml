prompt: |-
  i just started a part time gig at a small natural history museum, mostly writing label text, and the exhibit we're putting up in the spring has a big wall timeline running from the Pleistocene to now with the Anthropocene as the last chunk of it. the designer wants a date printed on the wall and i've been volunteered to defend whatever date we use, which has turned into a running argument with my flatmate, who did a geology degree and keeps telling me the whole question is dead because a committee of stratigraphers voted the epoch down a year or two ago (they'd proposed some lake in Ontario as the reference site, and then the thing went up the chain and got knocked back, and there was a whole procedural row about how the vote was handled). so before i write a word i want the spec rather than an answer, i want to know what i should even be asking of a proposal about when the Anthropocene started.

  what i'm after: the list of requirements any serious candidate answer has to meet, with the case behind each one, and a view on which are non-negotiable and which are just preferences of one camp. so: the start dates people actually put forward (the early-agriculture one, the 1610 low point that's supposed to come from forests regrowing after the conquest of the Americas, the 1780s steam-engine date, the 1950s bomb-test fallout) and what each of them does and doesn't deliver; the distinctions a proposal can't be allowed to collapse, like a unit defined by a single point in one rock or sediment sequence vs. a stretch of time, an isochronous marker vs. a phenomenon that spreads across the planet at different speeds, the base of a stratigraphic unit vs. the onset of the human influence it's meant to name, and a formal geological unit vs. the loose word humanists use; the rules it has to play by if it wants to be a geological unit at all, i.e. what the stratigraphic bodies demand of a boundary and of a candidate site, the chain of votes from the working group up through the subcommission and the commission and the union, and the supermajority thresholds involved; and what it has to be consistent with in the actual record, meaning what's readable in sediments and ice, how far back each signal can be detected, and how long a marker would still be findable by geologists a few million years from now.

  then the part i care about most: flag which of these requirements can't be satisfied at the same time. my suspicion is that picking the cleanest, most globally synchronous marker forces you onto a date so recent that the concept becomes useless to the historians and artists who actually use the word, and if that's a real conflict rather than me being confused, say so and say what has to give. i'd also like a view on which single requirement does the most work in ruling candidate dates out, and on the who-decides side: what a defensible decision procedure would have to look like given that the term leaked out of geology into everything else -- is it a problem that the only votes that counted were cast by geologists, and could a process be set up that was legitimate for the other users without giving them a veto over the stratigraphy? i don't need you to score every contender, i'll do that in the label copy, i just want the criteria and the conflicts. a table would be fine if it helps.
reasoning: |-
  Okay, let's start by unpacking the user's query. They work at a natural history museum and need to choose a start date for the Anthropocene on a timeline exhibit. Their flatmate, who has a geology background, mentioned that the formal proposal was rejected. The user wants the criteria for evaluating any proposed start date, not just the answer.

  First, I need to recall the key components they mentioned: requirements for a serious candidate, distinctions like geological vs. loose usage, rules for formal units, and conflicts between criteria. They also want to know which requirements can't be satisfied simultaneously and the legitimacy of the decision process.

  The user's explicit needs are clear, but their deeper concerns might include wanting to present a defensible position despite the geological rejection. They might need to balance scientific rigor with the museum's educational goals. Since the Anthropocene is interdisciplinary, they probably want to address both scientific and humanities perspectives without alienating either.

  I should break down the requirements into geological and extra-geological. Geological criteria include a Global Stratotype Section and Point (GSSP), global synchronicity, permanence, and distinctiveness. These are non-negotiable for formal status. Extra-geological aspects like human significance are preferences but important for the exhibit.

  Conflicts arise between geological rigor and human relevance. For example, the 1950s "Great Acceleration" meets geological criteria with nuclear markers but is too recent for historians. Earlier dates like the 1610 Orbis Spike show human impact but lack a clear geological marker. This tension is central to their problem.

  The rejection by the ICS highlights procedural rules: supermajority votes, candidate sites, etc. The user needs to explain why geologists have the final say on stratigraphy but also acknowledge other disciplines' perspectives. Legitimacy involves clear communication of the term's dual uses without conceding scientific authority.

  Lastly, the user needs to present this in museum labels, so clarity on why multiple dates exist and the criteria conflicts is essential. Emphasizing that the formal rejection doesn't negate the concept's utility in other fields could help visitors understand the debate's complexity.
answer: |-
  Here's a breakdown of the Anthropocene start date requirements, conflicts, and decision-making context you need for your museum label defense, presented as requested. This focuses on the *specification* rather than endorsing any specific date.

  **I. Core Distinctions & Non-Negotiable Geological Requirements (For Formal Epoch Status)**

  These are the bedrock demands of the International Commission on Stratigraphy (ICS). Failure here means rejection as a formal geological unit (as happened in 2023/2024):

  1.  **A Defined Global Boundary Stratotype Section and Point (GSSP - "Golden Spike"):**
      *   **Requirement:** A *single, physical location* (e.g., specific layer in sediment core, ice core, speleothem) chosen as the global reference point defining the base of the unit. This point must have a *primary marker*.
      *   **Primary Marker (Non-Negotiable):** Must be an *isochronous* (globally synchronous within practical detection limits) signal found *within the rock/sediment/ice record itself*. Examples: First appearance of a fossil, a specific isotopic shift (e.g., δ¹⁴C from bomb tests, δ¹³C from industrial emissions), iridium spike (K-Pg boundary).
      *   **Case:** This is the fundamental requirement for defining *any* Phanerozoic geological boundary. It provides an objective, physical reference accessible to future geologists.
      *   **Ruling Out:** Dates relying solely on diffuse cultural shifts (early agriculture), regional events (Columbian Exchange impacts *without* a global synchronous signal), or gradual technological adoption (steam engines). The signal must be *captured stratigraphically* at one site chosen as the GSSP.

  2.  **Global Synchronicity (as detected in the record):**
      *   **Requirement:** The primary marker must be detectable worldwide in suitable depositional environments (marine sediments, ice, lake varves, speleothems) *at essentially the same time* (within the resolution of the dating methods, typically years to decades for Anthropocene signals).
      *   **Case:** Geological time units are global. A boundary defined in one location must correlate precisely to others.
      *   **Ruling Out:** Signals with significant lags in global dispersal (e.g., the spread of agriculture, industrial soot - these are diachronous). Requires an event with rapid, planet-wide atmospheric/oceanic dispersion.

  3.  **Permanence & Detectability in the Future Rock Record:**
      *   **Requirement:** The primary marker and associated signals must be abundant, distinct, and robust enough to persist and be unambiguously identifiable by geologists millions of years in the future (e.g., in lithified sediments).
      *   **Case:** The geological time scale is built for deep time. Units must leave a lasting, discernible imprint.
      *   **Ruling Out:** Signals likely to degrade, dissolve, or be too diffuse over geological time (e.g., certain microplastics, temporary chemical shifts without mineralogical expression). Favors inorganic signals (radioisotopes, fly ash, heavy metals, nitrogen isotopes) over organic ones.

  4.  **Distinctiveness of the Stratigraphic Record:**
      *   **Requirement:** The boundary must mark a significant and *measurable* change in multiple components of the stratigraphic record (not just one signal). This includes novel materials (plastics, concrete fly ash), geochemical signatures (δ¹³C, δ¹⁵N, radionuclides), biotic changes (invasions, extinctions), and altered sedimentary patterns.
      *   **Case:** A new epoch implies a fundamental shift in Earth system processes reflected in the rocks. A single signal isn't enough; a "package" of signals defines the unit.
      *   **Ruling Out:** Proposals where the proposed marker is isolated or where the associated changes are not globally significant *and* stratigraphically preserved at that precise time.

  5.  **Procedural Adherence:**
      *   **Requirement:** Formal adoption requires a specific process: Proposal by the Anthropocene Working Group (AWG) -> Approval by the Subcommission on Quaternary Stratigraphy (SQS) via 60% supermajority -> Approval by the International Commission on Stratigraphy (ICS) via 60% supermajority -> Ratification by the Executive Committee of the International Union of Geological Sciences (IUGS).
      *   **Case:** This is the established international protocol for defining geological time units. Legitimacy within geology depends on following this process.
      *   **Status (2024):** The AWG proposed the mid-20th century (c. 1950) with Crawford Lake (Ontario) as the GSSP candidate (primary marker: plutonium fallout). The SQS *rejected* this proposal (voting did not reach the required 60% supermajority for "yes"). The ICS subsequently also voted "no". The proposal is currently dead for formal ratification.

  **II. Extra-Geological Requirements & Preferences (Important for broader "Anthropocene" concept)**

  These are crucial for the term's utility in history, social sciences, arts, and policy, but are *not* requirements for formal geological status:

  6.  **Human Significance / Onset of Major Impact:**
      *   **Preference:** The date should mark a fundamental shift in the *human-Earth system relationship* with global consequences (e.g., start of large-scale agriculture/domestication, Columbian Exchange & globalization, Industrial Revolution, Great Acceleration).
      *   **Case:** The cultural power of the "Anthropocene" concept lies in recognizing when human activities became a dominant planetary force. Geologists care about the *record*, others care about the *cause*.
      *   **Conflict:** Deeply significant events (like the Neolithic Revolution ~12,000 BCE or 1610 Orbis Spike) generally lack the *global synchronicity* and *distinct, permanent stratigraphic marker* required for a GSSP.

  7.  **Usefulness Across Disciplines:**
      *   **Preference:** The date should be meaningful and defensible not just to geologists, but also to archaeologists, historians, ecologists, social scientists, and artists.
      *   **Case:** The term has escaped its geological origins. A date solely satisfying geology might seem irrelevant or absurd to other fields studying long-term human impact.
      *   **Conflict:** The geologically optimal date (mid-20th C.) is often criticized as far too recent to capture the *beginning* of transformative human influence, making it useless for pre-1950s discussions central to other disciplines.

  **III. Key Conflicts & Tensions**

  | Requirement Pair                      | Conflict Description                                                                                                | Consequence                                                                                          |
  | :------------------------------------ | :------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------- |
  | **GSSP Marker (1)** vs. **Human Significance (6)** | A perfect GSSP marker (e.g., plutonium spike) is geologically pristine but represents a *late symptom* of the phenomenon it defines. Finding a marker for truly early transformative events (agriculture, colonization) is extremely hard/impossible. | Forces the geologically viable date later (mid-20th C.), alienating users focused on deeper historical roots. |
  | **Global Synchronicity (2)** vs. **Gradual Onset** | Major human impacts (agriculture, industrialization) unfolded over centuries/millennia and spread unevenly. A geological boundary needs an instantaneous "spike". | Requires an *event* (bomb tests, sharp atmospheric change) rather than a *process*, potentially misrepresenting the nature of the Anthropocene's beginning. |
  | **Formal Geology (1-5)** vs. **Broad Usefulness (7)** | Geology's strict rules produce a precise but narrow definition tied to a physical spike. The broader concept is inherently fuzzy, process-oriented, and interdisciplinary. | Creates two distinct meanings: a *formal epoch* (if ratified) and a *cultural/historical concept*. Using the same word for both causes confusion. |
  | **Permanence (3)** vs. **Novelty of Signals** | The most distinctive modern signals (plastics, novel chemicals) lack proven long-term geological preservation potential compared to isotopes or ash. Reliable signals (e.g., δ¹³C shift) may have less dramatic "novelty". | Forces reliance on signals with known geological persistence (radioisotopes, heavy metals, stable isotope shifts) over more iconic but ephemeral modern markers. |

  **IV. Who Decides & Legitimacy**

  *   **Geology's Domain (Non-Negotiable for Formal Unit):** Defining geological time units *must* remain the sole responsibility of stratigraphers (ICS/IUGS). Their expertise is the physical record and deep time correlation. Giving other disciplines a *vote* on the GSSP would undermine the scientific integrity of the geological time scale. The *process* (SQS/ICS supermajority) is the legitimate one *for defining a geological epoch*.
  *   **Legitimacy for Broader Use:** The problem arises because "Anthropocene" is used far beyond geology.
      *   **Defensible Approach:** **Acknowledge the distinction.** The museum can state:
          *   "Formally, geologists define epochs based on specific global markers in rock layers. A recent proposal to designate the mid-20th century as the start of a new 'Anthropocene Epoch' was not approved."
          *   "However, the concept of the 'Anthropocene,' meaning the period during which human activity has become the dominant influence on Earth's climate and environment, is widely used across many fields. Different starting points are proposed based on when various significant global human impacts began:"
          *   *(Then list key contenders: e.g., widespread agriculture, Columbian Exchange, Industrial Revolution, mid-20th Century 'Great Acceleration')*.
      *   **Avoid:** Implying the geological rejection invalidates the broader concept, or that the broader concept can dictate geological stratigraphy.
      *   **Could a "Legitimate" Broader Process Exist?** Potentially, but *not* for defining a *geological unit*. An interdisciplinary body could propose a *consensus date* for policy, historical periodization, or cultural purposes, explicitly distinct from the GSSP. However, it would lack the objective, physical anchor of the GSSP and likely remain contested.

  **V. Key Requirement Doing the Most Ruling Out**

  *   **The Need for a GSSP with a Primary, Isochronous, Permanent Marker (Requirement 1)** is the single biggest hurdle. It instantly eliminates any date proposal that cannot point to a *single physical location* containing a *globally synchronous spike* detectable in the geological record *millions of years hence*. This is why the 1950s bomb fallout became the only serious geological contender – it uniquely satisfied this requirement among proposed dates.

  **Recommendation for Your Label:**

  1.  **State the Geological Reality:** "While the concept of the 'Anthropocene' as a period of dominant human influence is widely discussed, a formal proposal to define it as a new geological epoch starting around 1950 was not approved by the bodies governing the geologic time scale in 2023/2024."
  2.  **Explain the Geological Logic:** "Geologists define epochs using a specific global marker in rock layers (a 'Golden Spike'). Finding a marker that is simultaneously sharp, global, permanent, and captures the *onset* of human impact proved challenging."
  3.  **Acknowledge Broader Use & Debate:** "Beyond formal geology, the 'Anthropocene' concept sparks debate about *when* human impacts became globally dominant. Key proposed starting points reflect major transitions:" (Present 2-4 major contenders like Orbis/1610, Industrial/1780s, Great Acceleration/1950s, with 1 sentence on the evidence/argument for each).
  4.  **Contextualize Your Choice:** "For this timeline focusing on [Museum's Exhibit Theme - e.g., human-environment interaction, biodiversity change, climate], we mark the Anthropocene concept as beginning around [Your Chosen Date] to highlight [Your Reason - e.g., the dramatic acceleration of impacts visible in our regional fossils/ecology, the point where multiple global signals converge]. This reflects a perspective from [History/Ecology/Etc.], distinct from the specific requirements of geological epoch definition."

  This approach is scientifically honest, acknowledges the complexity, avoids taking sides in the unresolved geological debate, and justifies your exhibit's practical choice based on your narrative goals. Good luck with the exhibit!
