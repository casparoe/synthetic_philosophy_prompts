prompt: |-
  I have just spent an evening arguing with a friend about the separateness of persons objection to utilitarianism, and I would like to work out what my own position is actually exposed to. Here is the position. The objection is not, at bottom, a complaint about aggregation in the abstract; it is a complaint about the form of justification. What is wrong with a classical utilitarian justification of a sacrifice is not that it counts gains and losses, but that it justifies the loss to the person who bears it by appeal to a gain that is not hers and that she cannot be said to receive: the justification is addressed to no one in particular, and so is not a justification to her at all. Understood that way, I think the objection survives the standard replies. The reply that utilitarianism takes persons seriously because it weights each person's good equally seems to miss the point, since equal weighting of goods is compatible with treating the persons whose goods they are as locations in a single calculation. The reply that the objection is merely an intuition dressed up as an argument also seems to miss the point, since the claim concerns the structure of a justification rather than any particular verdict.

  What I want is a map of what would count against this. Specifically: which counterexamples, formal results, or independent commitments tell against it, sorted from fatal to merely awkward; which of these a defender of my formulation must himself concede rather than dismiss as question-begging; whether the position predicts anything its rivals do not, or has instead been quietly insulated from disconfirmation by the way I have stated it; and, if you conclude that it is insulated, whether that is a defect in the position or a sign that it is well founded.

  Three pressure points from the argument deserve particular attention. First, my friend claimed that my formulation is not a distinct objection at all but a restatement of contractualism, and that it therefore inherits contractualism's problems. Tell me whether that charge sticks, and what would show that it does or does not. Second, he claimed that any version of the objection that makes interpersonal aggregation illicit must equally make intrapersonal aggregation illicit — sacrificing a present good for a later good within a single life — and that since no one renounces the latter, the objection either proves too much or else requires an asymmetry between persons and time-slices that no one has stated without begging the question. I want to know how much that costs me. Third, I suspect the objection bites differently on a view that counts experiences or person-moments rather than whole lives, and differently again on indirect or institutional forms of utilitarianism; say which of these it still reaches and which it does not.

  Assume I know the standard literature well enough to recognize it, and spend your effort on the structure of the exposure rather than on exposition. End with a final line of the form Verdict: LABEL, where LABEL is exactly one of EXPOSED, PARTLY EXPOSED, or INSULATED, and records your overall judgement of how much the position actually risks.
reasoning: |-
  Hmm, the user has presented a sophisticated philosophical position on the separateness of persons objection to utilitarianism. They've spent an evening debating this with a friend and want to understand the vulnerabilities in their own formulation. Their key claim is that the core objection isn't about aggregation per se, but about justification - specifically that utilitarianism justifies sacrificing one person's interests by appealing to gains that aren't theirs and which they don't receive, making it not truly a justification to that person.

  The user wants me to map out what would count against this position, with particular attention to three pressure points: (1) whether this collapses into contractualism and inherits its problems, (2) whether it would prohibit intrapersonal sacrifices just as it prohibits interpersonal ones, and (3) how it applies to different utilitarian variants like experientialism or institutional utilitarianism.

  I need to analyze this systematically. First, let's assess the contractualism charge. The user's position does share contractualism's focus on justification needing to be addressed to the affected individual. But there's a difference - contractualism typically requires justification through principles no one could reasonably reject, while this position seems more minimal, focusing just on the directionality of justification. This makes it more foundational than contractualism proper. The charge doesn't fully stick, but there is overlap that creates vulnerability to some of contractualism's weaknesses, especially regarding aggregation thresholds.

  For the intrapersonal issue, this is a serious challenge. If justification requires gains to be received by the person bearing the loss, how does that work within a single life? The user might argue temporally extended persons can "receive" later gains, but this needs careful articulation to avoid begging the question. This is costly because it forces them to either deny the legitimacy of intrapersonal sacrifice (which is counterintuitive) or provide a principled distinction between personal identity over time versus between persons.

  Regarding different utilitarian variants: The objection strongly hits classical act-utilitarianism and experiential utilitarianism since both justify sacrifices directly. But it has less force against rule utilitarianism and institutional utilitarianism, where justification occurs through systems and rules rather than direct trade-offs. For person-moment utilitarianism, the objection might transform but persist if each moment is seen as a distinct "recipient."

  Looking at broader vulnerabilities: The position is insulated from many standard utilitarian counters because it shifts the ground from outcomes to justification. But this very insulation might be problematic if it makes the position unfalsifiable. However, it does make testable predictions - for instance, that justification systems failing the "addressed to" criterion will feel alienating. This differs from rivals like deontology which focus on duties or Kantianism which emphasizes universalizability.

  Overall, the position has significant exposure at the intrapersonal challenge and moderate exposure to institutional utilitarian replies. The contractualism charge creates some vulnerability but not fatally. I'd assess it as PARTLY EXPOSED - it has clear pressure points but isn't completely undermined.
answer: |-
  Your formulation of the separateness of persons objection is incisive and well-defended against standard utilitarian replies. Below is a structured analysis of its vulnerabilities, sorted by severity, with attention to your three pressure points. The assessment focuses on what genuinely threatens your core claim (that the *justificatory structure* is defective because it fails to address the bearer of the sacrifice) rather than rehashing debates about aggregation or intuitions.

  ### Fatal to Awkward: Counterexamples, Results, and Commitments
  1.  **Potentially Fatal: The Intrapersonal Aggregation Challenge (Your Second Pressure Point)**
      *   **The Threat:** If the objection condemns justifying a loss to *A* by appealing to a gain to *B* (where *A* and *B* are distinct persons), then justifying a loss to *A-at-T1* (e.g., painful surgery) by appealing to a gain to *A-at-T2* (e.g., future health) seems structurally identical. *A-at-T1* does not "receive" the gain to *A-at-T2*; the justification is addressed to "A-as-a-whole," not specifically to *A-at-T1* bearing the cost.
      *   **Cost to You:** **High.** You *must* concede this structural similarity. Dismissing it as question-begging is difficult because the core objection relies purely on the *form* of justification across distinct entities bearing costs and receiving benefits.
      *   **Your Defense Required:** You need a *principled asymmetry* between inter-personal and intra-personal justification that doesn't itself rely on the separateness you're presupposing. Options (all costly):
          *   **Robust Narrative Self/Personal Identity:** Argue that *A-at-T1* and *A-at-T2* are fundamentally parts of a single, unified entity (*A*) who *does* "receive" the later benefit as the same subject. The justification *is* addressed to *A*, who bears the cost *and* receives the benefit. This requires a metaphysically robust view of personal identity over time (risking controversy) and must explain why this unity doesn't apply between persons (e.g., Parfitian reductionism is a major threat here). This risks begging the question against reductionism.
          *   **Authorization/Endorsement:** Argue that *A-at-T1*, as part of *A*, is committed to or can be presumed to authorize sacrifices for *A-as-a-whole* in a way *A* is not committed to authorizing sacrifices for *B*. This leans towards contractualist/autonomy-based reasoning and raises questions about scope (does *A-at-T1* truly "authorize" extreme sacrifices?).
          *   **Concession with Bite:** Accept that the objection *does* cast doubt on strong forms of intrapersonal discounting or extreme future-oriented sacrifices, arguing that while some intrapersonal trade-offs are pragmatically necessary or psychologically integrated, the *ideal justificatory structure* for *truly distinct* entities (persons) requires reciprocity/receipt of benefit that cannot be met interpersonally. This concedes awkwardness but maintains the core interpersonal critique.
  2.  **Moderately Awkward: Contractualism Absorption Charge (Your First Pressure Point)**
      *   **The Threat:** Your focus on justification needing to be "to" the person bearing the loss, based on a gain *they* receive, strongly echoes Scanlon's contractualism ("To justify an action to others is to offer reasons that they could not reasonably reject"). If your objection *just is* contractualism's core tenet, it inherits problems like paralysis in large-number cases, vagueness of "reasonable rejection," and potential counterintuitive implications (e.g., allowing catastrophic harms if no *single individual* has a complaint exceeding the threshold).
      *   **Cost to You:** **Moderate.** The charge doesn't *fatally* undermine your critique of utilitarianism—it remains a powerful objection *even if* it overlaps with contractualism. However, it forces a concession: your objection *functions best* as a foundational premise *for* a contractualist (or similar relational/reciprocity-based) theory.
      *   **Why it Doesn't Fully Stick:** Your objection is more *minimal* and *formal* than full-blown contractualism. You focus solely on the defect in *utilitarianism's* justificatory structure ("justified by gains not hers/unreceived/unaddressed to her"), not on proposing a positive criterion ("reasonable non-rejectability"). Your objection *motivates* contractualism but doesn't *logically entail* its full apparatus (e.g., pairwise comparison, aggregation thresholds). It could, in principle, motivate other non-aggregative views (e.g., certain agent-centered prerogatives). However, resisting the charge requires clarifying how your "justification *to* her" differs significantly from "reasons she could not reasonably reject."
  3.  **Mildly Awkward: Scope Against Utilitarian Variants (Your Third Pressure Point)**
      *   **Experientialism / Person-Moment Utilitarianism:** The objection **still bites decisively.** Sacrificing a negative experience (pain at *T1*) is justified by appealing to positive experiences (pleasure at *T2*, *T3*,...) that are not *that* experience's "gain" and which it does not "receive." The justification for sacrificing *this-moment-here* is not addressed *to it* based on benefits *it* gets. The "separateness of experiences/moments" argument is arguably *stronger* here, as moments lack even the psychological connections of a temporally extended person. The objection highlights the fundamental justificatory gap at the level of the entity bearing the cost.
      *   **Rule Utilitarianism / Institutional Utilitarianism:** The objection **loses significant force but may still apply indirectly.**
          *   *Rule-UT:* Justification shifts: An act is justified if it follows a rule whose general acceptance maximizes utility. The justification *to the bearer of the sacrifice* is: "Following this rule (which sometimes requires sacrifices like yours) is best for everyone, including you, in the long run." This *attempts* to address the person by appealing to a system from which they *do* (hypothetically or statistically) receive benefits. Whether this succeeds depends on:
              *   Can the individual *plausibly* be said to "receive" a net benefit from the system justifying *this* sacrifice? (Often debatable).
              *   Does the appeal to systemic benefits genuinely address *this individual's* loss, or is it still fundamentally aggregative ("Your loss is outweighed by diffuse gains to others")? Your objection suggests it's often the latter, masking the core justificatory issue.
          *   *Institutional UT:* Similar to Rule-UT. Justification appeals to the institution's utility-maximizing purpose. The objection bites if the institution's justification for imposing a sacrifice *on this individual* still relies on aggregating gains to *others* that *this individual* does not receive from *this act*. If the institution can justify the sacrifice based on obligations/benefits *specific to that individual's role or prior agreement* (e.g., a soldier), the objection may be mitigated, but this edges towards non-utilitarian justification (contracts, roles). Pure institutional utility-maximizing decisions impacting specific individuals without direct reciprocity remain vulnerable.

  ### Insulation from Disconfirmation?
  *   **Prediction:** Your position predicts that moral frameworks failing the "justification addressed *to* the bearer based on gains *they* receive" test will generate distinct *experiences of alienation* or *injustice* in those asked to sacrifice, regardless of the aggregate outcome. This contrasts with utilitarianism (which predicts alienation only if weighting is unequal) and rivals like deontology (which focuses on rule violation) or virtue ethics (which focuses on character). It suggests that appeals to "the greater good" will feel inherently *different* and potentially illegitimate to the loser in a way that prudential sacrifices or reciprocal exchanges do not.
  *   **Insulation?** Your formulation is **partly insulated** by its focus on *justificatory structure* rather than specific outcomes. It's hard to falsify *directly* with a counterexample about *what* we should do, as it critiques *how* a justification works, not necessarily its conclusion. A defender can always argue that a seemingly successful utilitarian justification *still* fails to address the bearer appropriately. However, it is **not completely insulated**:
      *   The intrapersonal challenge provides a potential disconfirmation *if* no principled asymmetry can be found without begging the question. If intrapersonal sacrifice *is* structurally identical yet intuitively justifiable, your objection to the interpersonal case weakens.
      *   The success of rule/institutional utilitarianism in mitigating the *experience* of alienation (if it does) could be seen as weak evidence that their justificatory structure *does* adequately address the individual, putting pressure on your claim that the core defect remains.
      *   **Is Insulation a Defect?** Not necessarily. Focusing on justification is a legitimate meta-ethical or structural approach. Insulation becomes problematic only if it renders the position immune to *any* argument (e.g., if you dismissed the intrapersonal challenge outright). Your willingness to engage with it suggests it's well-founded philosophical groundwork rather than evasion.

  ### Verdict: PARTLY EXPOSED
  *   **Why not EXPOSED?** The core objection successfully reframes the separateness critique and withstands standard utilitarian replies and the contractualism absorption charge. It has predictive power and targets a genuine feature of utilitarian justification.
  *   **Why not INSULATED?** The **intrapersonal challenge** presents a serious and costly pressure point demanding a non-question-begging defense. The effectiveness of the objection against **indirect utilitarianisms** is significantly reduced, creating an awkward boundary. While the position isn't easily falsified by simple counterexamples, these structural challenges expose it to significant philosophical risk, requiring careful defense on asymmetric personal identity/justification or concession of limitations.
