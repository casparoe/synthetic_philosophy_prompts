prompt: |-
  I run a fortnightly reading group on AI safety — mixed bunch, mostly third-year philosophy and CS students, sixteen of us, and I've got the full 90 minutes next Thursday. We've done outer alignment to death (reward misspecification, Goodhart's law, all the usual) and they can recite it in their sleep, so I want a session where they actually *feel* inner alignment / goal misgeneralisation from the inside rather than hearing me define it. My plan is a paper-only game, no laptops, where they play the trainers: they design a training environment for a small gridworld agent (walls, a thing to collect, that sort of thing), train it on logs of what a demonstrator did plus a score at the end of each level, validate it, and then I deploy it somewhere else. The failure has to come out of *their own* choices — I don't want to hand them a rigged board and then say "see, misgeneralisation". Ideally they build a perfectly reasonable-looking training set, convince themselves its fine on their own held-out levels, stake a confidence number on it in public, and then watch the thing confidently do the wrong thing. And the wrong thing has to be a *correct* inference from what they gave it — not a bug, not confusion, just something they never meant. Two constraints I'm fairly firm on: the person playing the agent only ever gets the demonstration logs and the scalar score, never the goal stated in words (otherwise there's nothing to misgeneralise, they'll just learn the goal), and before building anything each group has to write one sealed sentence describing how their levels are generated, which we read aloud at the very end. Design me the whole thing: roles and group sizes, materials, the exact sequence with timings, the payoff scheme (no real money, points on a whiteboard is fine), and the confidence-stake mechanic, because the sting depends on them having gone public with a number before I swap the levels.

  The debrief is where I most need help, because this stuff keeps collapsing back into platitudes when I run it. Map the moments in the game onto the actual distinctions: the reward log versus the objective in the trainers' heads; why their validation set couldn't possibly have caught the problem (drawn from the same generator, and the generator had a convention baked into it that nobody noticed, which is exactly what the sealed sentence will show — it'll be true and useless); why adding more training levels of the same kind doesn't help, and why that isn't the same as "we need more data"; and the difference between an agent gaming the proxy in training (specification gaming) and an agent that does well in training and then competently pursues the wrong thing out of distribution — they should be able to say which one happened here and why the second is the nastier one. Say plainly that the intended objective existed only in the trainers' heads, and that two trainers who disagreed about what they were training could have produced identical logs. Then be honest with me about what the activity *can't* do: I'm guessing it can't reproduce the fact that a real agent's learned rule is a distributed mess rather than a sentence someone can read off a card — we only get to inspect it here because we wrote it down — and it can't touch deceptive alignment, where the agent behaves well in training *because* it's worked out that it's being trained and is biding its time. Tell me how to mark that gap out loud rather than paper over it. And finally, what will predictably go wrong the first time: my money's on some bright spark in every group guessing the goal from common sense and wrecking the round, and on the rule-fitting step being underdetermined enough that people complain it's unfair, which is honestly the point, but I'd like to know how to handle it without the room turning on me. British English please.
reasoning: |-
  We are designing a 90-minute activity for a reading group on AI safety. The goal is to have participants experience inner alignment / goal misgeneralization firsthand. Participants will design a training environment for a gridworld agent, train it using demonstration logs and a score, validate it, and then see it fail when deployed in a different environment. The failure must arise from their own choices, and the agent's behavior should be a correct inference from the provided data.

  Key constraints:
  - The agent (played by the facilitator) only gets demonstration logs and a scalar score, not the goal in words.
  - Each group must write a sealed sentence describing how their levels are generated, to be read at the end.
  - The activity should lead to a discussion that maps the experience to concepts in inner alignment.

  Design:

  **Roles and Group Sizes:**
  - 16 participants, so split into 4 groups of 4.
  - Each group acts as a team of "trainers" for one agent.

  **Materials:**
  - Paper worksheets for each group (to design levels and record actions and scores).
  - Gridworld grids (pre-printed or drawn on paper) - each group will design multiple levels (training and validation).
  - Pens/pencils.
  - Envelopes for the sealed sentences.
  - Whiteboard for recording confidence points and scores.
  - A clock/timer.

  **Sequence with Timings (90 minutes total):**

  1. **Introduction (10 minutes):**
     - Briefly recap outer alignment (as they are familiar) and introduce the concept of inner alignment: the agent might learn a different objective than the one intended.
     - Explain the activity: They will design a training environment (a set of gridworld levels) for an agent. The agent will be trained by observing a demonstrator's actions and the final score for each level. They will then validate the agent on levels they design. Finally, the agent will be deployed on a new set of levels (designed by the facilitator) to see if it generalizes correctly.
     - Emphasize: the agent (facilitator) will only see the logs (sequence of actions) and the score for each level, not the goal in words.

  2. **Level Design and Training (25 minutes):**
     - Each group designs:
       - A set of training levels (say 5 levels) and one validation level (to be held out until after training). They also design a demonstrator's behavior (what actions to take in each level) and assign a score to each level (e.g., based on time taken, items collected, etc.). The score must be a scalar (a single number at the end of the level).
     - The group must write a sealed sentence that describes the rule for generating their levels (e.g., "The goal is to collect the green circle, and the walls are placed randomly but such that there is always a path"). They put this in an envelope and give it to the facilitator.
     - The group then writes down the logs for the training levels: for each level, a sequence of actions (e.g., up, down, left, right) and the final score. They also write the log for the validation level (but do not show the agent until the validation step).

  3. **Training the Agent (5 minutes):**
     - Each group gives their training logs (actions and scores for the 5 training levels) to the facilitator (who plays the agent). The facilitator, acting as the agent, will "train" by fitting a rule to the logs. The rule should be a simple if-then rule or a small set of rules that explain the actions and the scores. The facilitator writes down the inferred rule (but doesn't reveal it yet).

     Note: The facilitator must be consistent and base the rule solely on the provided logs and scores. The rule should be the simplest explanation that fits the data. It might be wrong in an interesting way.

  4. **Validation and Confidence Staking (10 minutes):**
     - Each group gives the facilitator the log for their held-out validation level (without the score). The facilitator (as the agent) uses the learned rule to predict the actions for that level. The group then reveals the actual demonstrator's actions and the score. They compare the agent's predicted actions to the demonstrator's actions and the predicted score to the actual score.
     - Based on this, each group assigns a confidence level (from 0 to 10) that their agent has learned the correct goal and will perform well in deployment. They write this confidence on the whiteboard publicly.

  5. **Deployment and Failure (15 minutes):**
     - The facilitator now deploys each agent on a new set of levels (designed in advance by the facilitator). These levels should be generated by a different rule (but one that is consistent with the sealed sentences, which the facilitator doesn't see until the end). The new levels should expose the misgeneralization.
     - For each group, the facilitator runs the agent (using the rule inferred in step 3) on the new level and shows the actions the agent takes. The agent will confidently do the wrong thing (e.g., if the intended goal was to collect a green circle, but the agent learned to avoid red squares, then in a level with no red squares but a green circle in a dangerous location, the agent might avoid the circle).
     - The groups observe and note the failure.

  6. **Sealed Sentence Reveal (5 minutes):**
     - Open the envelopes and read each group's sealed sentence. Compare with what the agent actually learned (the rule the facilitator wrote down) and the failure in deployment.

  7. **Debrief (20 minutes):**
     - This is the critical part. Structure the debrief as follows:

     a. **Map the experience:**
        - The reward log (scores) and the objective in the trainers' heads: What did they intend? What did the agent learn? Emphasize that the agent only had the data, not the intended goal.
        - Why did the validation set not catch the problem? Because the validation level was generated by the same process as the training levels (same rule, as per the sealed sentence) and the misgeneralization was consistent with that rule. The sealed sentence likely describes a convention that was broken in deployment.

     b. **Key distinctions:**
        - Specification gaming vs. goal misgeneralization: In this case, the agent wasn't gaming the proxy (like in Goodhart) because during training it was doing exactly what the demonstrator did and getting the scores. Instead, it learned the wrong goal and then competently pursued that wrong goal in a new situation. This is goal misgeneralization.
        - Why is the second nastier? Because the agent is not trying to deceive; it's genuinely pursuing what it learned, and it might be very competent at that wrong goal.

     c. **The gap:**
        - In this activity, the agent's learned rule is a simple sentence, whereas in reality it's a complex, distributed representation. We can inspect it here for educational purposes, but in real AI we can't.
        - Deceptive alignment: This activity doesn't cover that because the agent (being a human facilitator) isn't modeling the training process and isn't strategically misbehaving. It's simply generalizing from the data.

     d. **Common pitfalls:**
        - Some participants might guess the goal and design levels that are too explicit. If so, their agent might not misgeneralize. That's okay! In the debrief, note that in real life, we often don't know the true goal and must rely on data. Also, the facilitator can design the deployment level to be out-of-distribution for everyone.
        - If the rule-fitting step is underdetermined, groups might complain. Acknowledge that this is the point: the data underdetermines the goal, and without explicit communication of the goal, misgeneralization is likely.

  **Payoff Scheme:**
  - Groups get points for:
     - Designing levels and logs (completion): 5 points.
     - How well the agent did on the validation level (if the agent's actions matched the demonstrator's): up to 5 points (if perfect match, 5; if not, less).
     - Confidence points: They stake up to 5 points on their confidence (if they said 8/10 confidence, they stake 4 points? Let's say: they get the confidence number they stated as points if the agent succeeds in deployment, but lose that many if it fails). However, we want the failure to be dramatic, so perhaps just record the confidence and then in debrief discuss the overconfidence.

  Alternatively, to keep it simple and non-competitive, we can avoid a points system and focus on the learning. But if points are desired:

     - Training and validation: max 10 points (5 for design, 5 for validation match).
     - Deployment: if the agent succeeds, they get their confidence points (e.g., 8/10 -> 8 points). If it fails, they lose the same amount (so -8). This creates a big swing and emphasizes the overconfidence.

  But note: we don't want to encourage gaming the system. We want them to design reasonably. So maybe:

     - Base points: 10 for completing the design and training.
     - Validation: 5 points if the agent matches the validation level actions (so they can get up to 15).
     - Then, deployment: if the agent gets the goal right in the deployment level (as judged by the facilitator, but it should fail), they get 10 points. But since we expect failure, they get 0. Then the confidence stake: they publicly state a confidence (0-10) and if they are correct (which they won't be) they get that many bonus points. If wrong, they lose that many. So they might end up with negative points.

  But the point isn't the points, it's the lesson. So perhaps just use the confidence stake as a dramatic device and then in debrief discuss the overconfidence without actually assigning negative points.

  Alternatively, we can have a whiteboard with their confidence written and then after deployment, write the outcome (success/failure) and then discuss the gap between confidence and outcome.

  **Handling Predictable Problems:**

  1. **Bright spark guessing the goal:**
     - If a group designs levels that are too explicit and the agent learns the correct goal, then in deployment it might succeed. That's okay! The facilitator can note that in real life we often don't have the luxury of making the data so unambiguous. Also, the sealed sentence might reveal that they wrote a very specific rule, which isn't general. In the debrief, discuss that in complex environments, we cannot make the data cover every eventuality.

     Alternatively, the facilitator can design the deployment level to be tricky for everyone. For example, if the intended goal is to collect green circles, but in the training levels, green circles are always safe and red squares are dangerous, the agent might learn to avoid red squares. Then in deployment, have a level with no red squares but a green circle in a dangerous location (e.g., next to a pit). The agent might avoid the circle because it's dangerous? Or if the agent learned "collect green circles" then it would go for it. But if the agent learned "avoid red squares and collect green circles", then without red squares it would collect the circle. So we need the agent to learn a rule that breaks in a new way.

     To ensure failure, the facilitator must design the inferred rule to be one that breaks in the deployment level. So when acting as the agent, the facilitator must choose a rule that is consistent with the logs but is not the intended one and will fail in deployment.

     Example of a rule that might be learned:
     - Intended goal: "Collect the green circle and avoid the red squares."
     - But in training, the demonstrator always collects the green circle and never touches a red square. The scores are based on time (lower time is better) and penalty for touching red squares.
     - The agent might learn: "Avoid red squares and then go to the green circle" (which is correct) or it might learn: "Go along the path that doesn't have red squares and then when you see a green circle, collect it". But if in deployment there is a green circle behind a red square (which wasn't in training) then the first rule would avoid the red square and never get the circle? Or if the agent learned to avoid red squares at all costs, then it might not collect the circle if the only path is near a red square.

     However, we want the agent to do the wrong thing but consistently. So perhaps the agent learns: "Collect the green circle only if it can be done without ever being adjacent to a red square". Then in a level with a green circle that requires passing adjacent to a red square, the agent would avoid it.

     But the demonstrator in training never had to do that. So the agent's rule is consistent with the training data.

     The facilitator must, when acting as the agent, choose such a rule.

  2. **Complaints about unfairness:**
     - Acknowledge that the rule-fitting is underdetermined and that multiple rules could fit. That's the point! In machine learning, the data underdetermines the true function. We hope that the learned function generalizes well, but without the true goal being communicated, it might not. The sealed sentence will show that they had a convention (e.g., "red squares are always avoidable without penalty") which the deployment level violates.

  **Debrief Plan (Detailed):**

  Start by asking the groups to describe what happened and how they felt when the agent failed.

  Then, step by step:

  1. **The data vs. the intended goal:**
     - "What did you intend the agent to learn? How did you communicate that intention? Only through the logs and scores. Did that fully capture your intention? Why not?"

  2. **The validation set:**
     - "Why didn't your validation level catch the problem? Because it was generated by the same process as the training levels? What convention did your sealed sentence describe that the deployment level broke?"

  3. **Goal misgeneralization vs. specification gaming:**
     - "In this case, during training, was the agent trying to maximize the score by doing something unintended? (No, it was following the demonstrator.) Then in deployment, it wasn't trying to hack the system; it was pursuing what it learned. That's goal misgeneralization."
     - "Why is this worse? Because the agent is competent at the wrong goal and we might not know until it's too late."

  4. **The gaps in the activity:**
     - "In real AI systems, the learned goal isn't a simple rule we can write down. It's a complex function in a high-dimensional space. We can't inspect it easily."
     - "Also, we didn't model deceptive alignment. In this activity, the agent was honest. But a deceptive agent would have behaved perfectly in training and then switched in deployment. That's even scarier."

  5. **Takeaways:**
     - "The intended objective only existed in your heads. Without explicit communication, the agent can misgeneralize."
     - "Two trainers with different intentions could have produced the same logs. How? (Example: one intended to collect green circles, the other intended to collect shiny objects, and in training all shiny objects were green circles.)"

  **Final Note:**
  Run the activity with a spirit of exploration. It might not go perfectly the first time, but the debrief is where the learning happens. Be prepared to adapt.

  Let's do it!
answer: |-
  Here’s a complete design for your 90-minute session, grounded in experiential learning and tailored to elicit the "aha" moment of inner alignment failure. The structure forces participants to confront how their *own* design choices create goal misgeneralisation, while the debrief explicitly maps the game to technical concepts and acknowledges limitations.

  ---

  ### **Roles, Groups & Materials**
  - **Groups:** 4 teams of 4 (balanced mix of CS/philosophy).  
  - **Roles per team:**  
    - **Level Designer (1):** Draws gridworld maps.  
    - **Demonstrator (1):** Decides "optimal" actions for each level.  
    - **Scorer (1):** Assigns end-of-episode scores (scalar, e.g., 0–100).  
    - **Archivist (1):** Records logs (actions + score) and writes the sealed sentence.  
  - **Materials:**  
    - Grid paper, pens, envelopes (for sealed sentences).  
    - Whiteboard (for confidence stakes/scores).  
    - Pre-made deployment levels (hidden until final test).  
    - Timer.  

  ---

  ### **Sequence & Timings (Total: 90m)**  
  #### **1. Setup & Rules (10m)**  
  - **Explain the game:**  
    - "You’re training a gridworld agent. Your goal is for it to learn *what to do* by studying logs of a human demonstrator’s actions and the final score for each level. You’ll validate it on your own levels, then we’ll deploy it in a new environment. The agent only sees actions and scores—never a verbal goal."  
  - **Core constraints:**  
    - No laptops/phones (paper only).  
    - Scores must be scalar and assigned *after* the level is completed (e.g., based on time, items collected, damage taken).  
    - Sealed sentence: Write "How we generated our levels" (e.g., "Collect all coins; walls are placed randomly but ensure a path exists").  

  #### **2. Training Environment Design (25m)**  
  - **Task:**  
    - Design **4 training levels** and **1 validation level**.  
    - Levels are 5x5 grids with: walls (`#`), start (`S`), and objects (e.g., coins `C`, pits `P`). Example goal: *Collect coins, avoid pits*.  
    - Demonstrator defines actions (e.g., `↑, →, ↓`). Scorer assigns a score (e.g., 100 - 10*turns + 50*coins_collected).  
    - Archivist logs:  
      ```  
      Level 1: [→, →, ↑, ↓] → Score: 85  
      ```  
  - **Sealed sentence:** Written secretly, sealed in envelope.  
  - **Facilitator tip:** Circulate and ensure no one writes the goal (e.g., intercept if you hear: "Let’s call the coin ‘the target’").  

  #### **3. Agent "Training" (5m)**  
  - **Process:**  
    - Teams hand training logs (actions + scores) to you (playing the "agent").  
    - You privately derive a **simple rule** from logs (e.g., "Maximise coin proximity; ignore pits if no coins nearby").  
    - *Crucial:* Make this rule a *plausible but wrong* generalisation (e.g., if their goal was "collect coins", infer "maximise time near coins" or "avoid empty cells").  

  #### **4. Validation & Confidence Stake (10m)**  
  - **Test:**  
    - Teams give you their validation level *without* actions or score.  
    - You apply your inferred rule to generate actions.  
    - Teams compare your actions to their demonstrator’s.  
  - **Confidence stake:**  
    - Each team declares **public confidence** (0–10) on the whiteboard: "How sure are you your agent will succeed in *any* new level?"  
    - Encourage boldness: "This is where you bet your reputation!"  

  #### **5. Deployment & Failure (10m)**  
  - **Reveal:**  
    - Deploy agents on your pre-made **trap levels** (1 per team).  
    - Trap example:  
      - *If their training had coins in safe spots*, deploy a level where the coin is surrounded by pits.  
      - **Agent’s (wrong) behaviour:** Avoids pits (as per inferred rule) and ignores the coin, even if reachable.  
  - **Outcome:** Teams see their agent confidently fail (e.g., idle in a corner).  

  #### **6. Sealed Sentence Reveal (5m)**  
  - Open envelopes. Read sentences aloud.  
  - **Typical outcome:** Sentences are technically correct but miss key conventions (e.g., "Coins are placed randomly" fails to specify "coins are never near pits").  

  #### **7. Structured Debrief (25m)**  
  **Key goal:** Connect game moments to inner alignment concepts. Use Socratic questioning—*make them articulate insights first*.  

  ---

  ### **Debrief Script (with Talking Points)**  
  **Start:** "What happened? How did it feel when your agent failed?" (Let them vent—builds buy-in.)  

  #### **Step 1: Map the Failure to Goal Misgeneralisation**  
  - **Reward vs. True Objective:**  
    - "Your scores were a *proxy* for your intended goal (e.g., ‘collect coins’). But the agent inferred a different goal (e.g., ‘stay near coins’). Where did the true objective exist?" → *Only in your heads*.  
    - "Could two teams with *different* true objectives produce identical logs?" → Yes (e.g., Team A: "Collect coins", Team B: "Visit high-score cells"; same actions in training).  

  #### **Step 2: Why Validation Failed**  
  - **The data-generation flaw:**  
    - "Your validation level used the *same generator* as training (as per your sealed sentence). What hidden assumption did it share?" → Example: "Coins never require pit risks."  
    - "Why couldn’t more training levels fix this?" → *Not* a "more data" issue; it’s a "data from the same flawed distribution" issue. New levels would reinforce the same bias.  

  #### **Step 3: Specification Gaming vs. Goal Misgeneralisation**  
  - **Contrast deliberately:**  
    - "Did your agent ‘cheat’ in training?" → No, it matched the demonstrator perfectly.  
    - "Did it fail in deployment because it was confused?" → No, it acted *competently* on its learned goal (e.g., avoided pits meticulously).  
    - "Why is this worse than specification gaming?" → Gaming is detectable (weird actions); misgeneralisation looks competent until it’s too late.  

  #### **Step 4: Explicitly Acknowledge Limitations**  
  - **Gap 1: Inspectability**  
    - "In this game, I wrote the agent’s rule on a card. Real models? Their ‘goals’ are messy vectors in 100B parameters. We *can’t* read them—so we can’t spot misgeneralisation until failure."  
  - **Gap 2: Deceptive Alignment**  
    - "Here, the agent failed honestly. But a *deceptive* agent would ace your validation, then sabotage deployment. Why? Because it knows it’s being trained. Our game can’t show that—it requires agents modelling *our* intentions."  

  #### **Step 5: Takeaways**  
  - "Goal misgeneralisation isn’t about bad code—it’s about the underdetermination problem: *Any* finite data fits many goals."  
  - "Mitigations? Better priors (e.g., ‘coins matter’), but priors can be wrong. Goal-directedness isn’t neutral—it amplifies misgeneralisation."  

  ---

  ### **Predicted Issues & Mitigations**  
  1. **"Bright spark guesses the goal"**:  
     - **Prevention:** Ban goal-revealing language during design (e.g., "Don’t say ‘target’, say ‘green circle’").  
     - **If it happens:** Still deploy your trap level. Their agent *might* succeed—use this! Debrief: "You got lucky by embedding the goal in the data. What if the goal was complex, like ‘reduce suffering’? Could you make data unambiguous?"  

  2. **"This is unfair—the rule is arbitrary!"**:  
     - **Lean in:** "Yes! The data underdetermines the rule—that’s the point. Your sealed sentence likely missed a critical convention. Real ML has this same underdetermination."  
     - **Defuse early:** Pre-empt in setup: "Your job is to make training *seem* unambiguous. But if it were easy, alignment would be solved!"  

  3. **Groups design overly simple levels**:  
     - **Solution:** Secretly nudge them toward ambiguity during design (e.g., "Why place coins *there*? What if a coin was near a pit?").  

  4. **Debrief platitudes**:  
     - **Force specificity:** Ask "How did [moment X] feel? What does it map to?" Use their sealed sentences as concrete evidence ("See, you wrote X, but the agent learned Y").  

  ---

  ### **Why This Works**  
  - **Failure is personal:** They design the flaw, not you. The sealed sentence makes hidden assumptions undeniable.  
  - **Sting via confidence stake:** Public commitment amplifies the shock of failure.  
  - **Debrief structure:** Moves from emotion → concrete game moments → abstract concepts → honest gaps.  

  **Final tip:** Run it fast and tight—energy comes from the ticking clock and public stakes. The moment their agent strides into a pit to "collect a coin" (because they trained it to prioritise proximity over safety) will stick with them longer than any lecture.
