  ### **Sleeping Beauty Experiment: Activity Design**

  #### **Goal**
  Students experience self-locating belief as a *felt uncertainty* (not just wordplay) by betting in two variants of the Sleeping Beauty protocol. They discover the halfer/thirder disagreement intuitively through staking behavior and odds-setting, then map it to formal credence in the debrief. The control condition isolates the role of self-location.

  ---

  ### **Rules and Roles**
  **Participants**:
  - **Sleeper**: 1 student. Woken once (heads) or twice with amnesia (tails). Bets tokens on heads/tails at each awakening.
  - **Bookmaker**: 1 student. Posts odds before the coin flip and honors bets at all awakenings.
  - **Experimenters**: 2 students. One flips coins and manages "memory erasure." Another records bets/payouts.
  - **Observers**: Remaining students track patterns (e.g., "When did sleepers hesitate?").

  **Materials**:
  - Coins: 1 fair, 1 biased (e.g., 2:1 heads; use a die: 1–4 = heads, 5–6 = tails).
  - Tokens: 10 per student (e.g., poker chips).
  - Prizes: Small (e.g., candy, extra credit points). Exchange rate: 20 tokens = 1 prize.
  - Betting sheets: For bookmakers to post odds and record stakes.

  ---

  ### **Protocol & Payoffs**
  - **Betting**: At each awakening, the bookmaker displays odds for "heads" (e.g., "3:1" = bet $1 to win $3 profit + stake back). The sleeper stakes any tokens on heads/tails.  
  - **Settlement**: After the experiment, coins are revealed. Winning bets pay: `stake × (1 + odds)`. Losing bets forfeit stakes.  
  - **Memory erasure**: Sleeper leaves the room during "sleep." Experimenters reset the room (identical setup) and blindfold the sleeper between awakenings.  
  - **Fair odds**: Bookmakers must post odds they deem "break-even" (i.e., no expected token loss/gain).

  ---

  ### **Timeline (100 min)**
  #### **0. Setup (5 min)**
  - Distribute tokens, assign roles (rotate each round).
  - Clarify: "This is about betting under uncertainty. Your goal is to earn tokens for prizes."

  #### **1. Control Condition: Fixed Awakenings (15 min)**
  - **Protocol**:  
    Flip fair coin → **Always two awakenings** (Mon/Tue), regardless of outcome.  
    *Self-location removed: Awakenings don’t correlate with coin state.*  
  - **Example**:  
    - Bookmaker posts odds (e.g., 1:1).  
    - Sleeper bets twice (once per awakening).  
    - Coin revealed → bets settled.  
  - **Goal**: Students see that credence should be 1/2. Disagreements here signal misunderstandings.

  #### **2. Standard Condition: Fair Coin (25 min)**
  - **Protocol**:  
    Flip fair coin → **Heads: 1 awakening (Mon)**. **Tails: 2 awakenings (Mon/Tue)**.  
  - **Run twice**:  
    - Round 1: Bookmaker A sets odds. Sleeper 1 bets.  
    - Round 2: New bookmaker/sleeper.  
  - **Predictable issues**:  
    - *Bookmaker error*: Posts 1:1 odds (halfer) → sleeper loses heavily on tails (two losses).  
      → **Handle**: Let it happen. Debrief later: "Why did both lose tokens?"  
    - *Sleeper refusal*: "I won’t bet; I’m confused!"  
      → **Handle**: Allow betting 0 tokens → "What felt uncertain?"  

  #### **3. Biased Condition (2:1 Heads) (25 min)**
  - **Protocol**: Same as standard, but with biased coin.  
  - **Key twist**: Students *compute* fair odds (no memorization).  
  - **Critical moment**: Halfers/thirder disagreements *persist*:  
    - **Halfer bookmaker**: Sets 0.5:1 odds (since P(heads)=2/3).  
    - **Thirder bookmaker**: Sets 1:1 odds (since P(heads)=1/2).  
  - **Sleeper experience**:  
    - Halfer sleeper sees 1:1 odds as exploitable (bets max).  
    - Thirder sleeper sees 0.5:1 odds as exploitable (bets max).  

  #### **4. Debrief (30 min)**
  - **Step 1: Elicit reactions**  
    Ask:  
    - "When did you feel *most* uncertain? Why?" (Link to amnesia/awakening count.)  
    - "Did your betting change between conditions? How?"  
  - **Step 2: Formalize the problem**  
    - Revehalfer/thirder positions:  
      - **Halfer**: "Credence=1/2 (fair) or 2/3 (biased). Awakenings don’t update evidence."  
      - **Thirder**: "Credence=1/3 (fair) or 1/2 (biased). Each awakening is equally likely."  
    - Map to game moments:  
      - Control: "Why did everyone agree? Self-location didn’t matter—awakenings were fixed!"  
      - Standard: "When the bookmaker posted 1:1 odds (halfer) and the sleeper lost twice on tails—that’s the halfer’s vulnerability."  
      - Biased: "Disagreement persisted because self-locating belief isn’t about the coin’s bias—it’s about *who you are* in the experiment."  
  - **Step 3: Contrast self-locating/ordinary belief**  
    - Ordinary: "Heads vs. tails" (control condition).  
    - Self-locating: "Is this the *only* awakening? Or one of two?" (standard/biased).  

  ---

  ### **What Will Go Wrong (and How to Handle)**
  1. **Bookmaker posts lose-lose odds** (e.g., 1:1 for biased coin):  
     - Both sleeper/bookmaker lose tokens.  
     → *Use in debrief*: "This happened because odds didn’t account for *how often bets occur*."  

  2. **Sleeper refuses to bet**:  
     → *Probe*: "What felt unfair? Was it not knowing *which* awakening this was?"  

  3. **Amnesia unconvincing**:  
     → *Mitigate*: Use blindfolds/earmuffs between awakenings; reset room meticulously.  

  ---

  ### **Limitations**
  - **Cannot settle the dispute**: The activity *exposes* the problem but doesn’t resolve it. Emphasize: "This is why it’s debated—both positions feel intuitive!"  
  - **First-person papered over**: Betting risks reducing subjective uncertainty to objective frequencies. Combat by asking: "When you woke up, did it *feel* like Monday? Or could it be Tuesday?"  
  - **Token stakes ≠ credence**: Some may bet minimally to "play safe." Stress: "We’re studying felt uncertainty, not risk aversion."  

  ---

  ### **Confidence Assessment**
  - **Overall confidence**: 8/10.  
    The design forces confrontation with self-location through:  
    - Physical amnesia protocol.  
    - Disagreement in *both* conditions (highlighting it’s not about coin fairness).  
    - Control condition contrast.  
  - **Least sure part**: Biased coin round.  
    - *Risk*: Students might think disagreement stems from probability calculations, not self-location.  
    - *Mitigation*: In debrief, contrast:  
      "Did your credence *feel* different when awakenings were fixed (control) vs. uncertain (standard)? That’s self-location."  

  ---

  ### **Instructor Notes**
  - **Prep**: Test amnesia protocol (e.g., blindfolded students can’t track time).  
  - **Pacing**: Keep rounds short (5–7 min each). Prioritize debrief.  
  - **Ethos**: "This isn’t about being wrong—it’s about *feeling* why this problem is puzzling."  

  This design makes self-locating belief visceral. Students *bet* as halfers or thirders before knowing the labels—and the token losses/gains etch the problem into memory.
