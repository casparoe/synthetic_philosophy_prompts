prompt: |-
  I run the policy shop at a state agency that administers what we call the Hardship Relief Fund — a capped pot, about $40M a year, that pays one-time grants to residents who've been hit by something bad. The statute says we may only pay for losses that weren't the applicant's own doing. The legislative history is vague about what "own doing" means, and our sixty adjudicators are not philosophers, they're claims examiners with about twenty minutes per case and a queue of four thousand. Right now they're making it up as they go, and the appeals board has started to notice.

  You're a philosopher who works on distributive justice and has actually done applied policy work. Please turn luck egalitarianism into something my examiners can run. The idea as I understand it: inequalities that trace back to brute luck are unjust and ones that trace back to option luck are not, and there's a device where you ask what a prudent person would have insured against. I need a decision procedure — the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it hands off to a supervisor because the question is one of values rather than facts. Two things I want taken seriously rather than papered over: first, examiners can't reliably tell a choice from a circumstance; second, the standard complaint that a strict version of this view abandons the imprudent — if our procedure tells a guy who gambled his rent away to pound sand, my director will want to know why that isn't cruelty with a footnote.

  Start by brainstorming which distinctions you think have to survive the translation and which you're willing to drop, then give me the procedure, then run it on three cases: a trucker whose back was wrecked by another driver and who had skipped the disability coverage his union offered; a homeowner who rebuilt in a flood plain without flood insurance and got flooded again; and a woman who spent her savings on a gambling app and now can't make rent. One of these should come out in a way the agency won't like — say so plainly. Finish with what the procedure can't do. Under 900 words, and no citations, I dont need a reading list.
reasoning: |-
  Okay, let me approach this policy challenge systematically. The user runs a state agency with limited resources and needs a practical framework for adjudicating hardship claims that aligns with philosophical principles but works under severe operational constraints. 

  First, I need to recognize the core tension: implementing luck egalitarianism in a bureaucracy that handles 4,000 cases with only 20 minutes per review. The examiners aren't philosophers - they're claims processors drowning in paperwork. The appeals board is already noticing inconsistencies, so we need structure fast.

  Key distinctions that must survive translation:
  1. **Brute luck vs option luck** - this is non-negotiable as it's the foundation of the policy mandate
  2. **Distinction between choices and circumstances** - even though it's hard to operationalize
  3. **The insurance heuristic** - it's our best tool for simulating the "prudent person" standard

  What we can compromise:
  - Perfect moral precision for consistency
  - Individualized assessments for categorical thresholds
  - Theoretical purity for administrative workability

  Now for the procedure design. It must have:
  - Binary yes/no checkpoints
  - Off-ramps to supervisors for value judgments
  - Clear documentation hooks
  - Precedent flags for recurring scenarios

  The three test cases reveal where the rubber meets the road. That trucker case is particularly thorny - his injury was brute luck (other driver's fault) but his insurance lapse looks like option luck. The procedure will likely deny him, which will upset the director. I'll need to anticipate that objection head-on.

  Operational limitations to highlight:
  - Can't resolve deep philosophical debates
  - Struggles with mixed causality cases
  - May feel "harsh" on surface-level imprudence
  - Requires upfront training investment

  The gambling case is where we'll face political heat - denying someone who lost rent money gambling aligns with the framework but looks cruel. I'll need to explain why this is necessary to preserve funds for truly involuntary hardship, and suggest supplemental policy solutions.

  Final output will structure the procedure as a flowchart with:
  1. Eligibility triage
  2. Causality assessment
  3. Insurance test
  4. Supervisor referral triggers
  5. Documentation standards
  ...all within the brutal word limit.
answer: |-
  Here's a pragmatic decision procedure for your examiners, balancing philosophical coherence with operational constraints. I'll prioritize **administrability**, **consistency**, and **political viability** while preserving core luck egalitarian principles.

  **Key Preserved Distinctions:**
  1. **Brute Luck (BL)**: Uncontrollable events (e.g., natural disaster, others' negligence).
  2. **Option Luck (OL)**: Outcomes of deliberate, avoidable risks (e.g., skipping insurance, gambling).
  3. **The Insurance Heuristic**: "Would a prudent person typically insure against this risk?"

  **Dropped/Downplayed Distinctions:**
  - Fine-grained "choice vs. circumstance" debates (too subjective).
  - Moral desert judgments (focus on risk management instead).
  - Perfect hypothetical insurance markets (use common-sense proxies).

  ---

  ### **Decision Procedure: 4-Step Checklist**
  *(Each step must be answered "Yes" to proceed. "No" ends the case. Document answers in 1-2 sentences.)*

  1. **Uncontrollable Trigger?**  
     *Question: Was the immediate cause of the loss outside the applicant’s control?*  
     - **Yes**: Proceed to Step 2.  
       *Sufficient examples*: Natural disaster, crime victim, sudden illness, documented third-party fault.  
     - **No**: **DENY** (e.g., self-inflicted injury, voluntary gambling loss).  
     - **Unclear?** → Escalate to supervisor (e.g., "Was the job loss due to layoffs or misconduct?").

  2. **No Avoidable Amplification?**  
     *Question: Could reasonable precautions have reduced the loss severity?*  
     - **Yes**: **DENY** (e.g., ignored evacuation orders, refused medical treatment).  
     - **No**: Proceed to Step 3.  
       *Sufficient examples*: Followed official warnings, complied with safety standards.  
     - **Unclear?** → Escalate (e.g., "Was rebuilding in a floodplain after one flood 'reasonable'?").

  3. **Prudent Insurance Threshold?**  
     *Question: Was the loss type widely insurable/affordable, and did the applicant decline coverage?*  
     - **Yes**: **DENY** (e.g., skipped employer-subsidized disability/flood insurance).  
     - **No**: Proceed to Step 4.  
       *Sufficient examples*: Insurance unavailable/unaffordable (e.g., pre-existing condition), novel/unforeseeable risk.  
     - **Unclear?** → Escalate (e.g., "Is gambling app loss 'uninsurable'?" Use supervisor precedent bank).

  4. **No Prior Compulsion?**  
     *Question: Is there evidence the "choice" was coerced? (Narrowly defined)*  
     - **Yes**: **APPROVE** (e.g., employer forced unsafe work).  
     - **No**: **DENY** (OL dominates).  
     - **Unclear?** → Escalate (e.g., "Was the trucker *financially* compelled to skip disability insurance?").

  ---

  ### **Test Cases**
  1. **Trucker (wrecked by another driver, skipped disability insurance):**  
     - Step 1: **Yes** (other driver’s fault → BL).  
     - Step 2: **Yes** → **DENY**. *Rationale*: Skipped affordable union insurance. Prudent person would have insured. (*Agency won’t like this*—feels harsh, but aligns with OL principle.)  

  2. **Homeowner (rebuilt in floodplain without insurance, flooded again):**  
     - Step 1: **Yes** (flood → BL).  
     - Step 2: **No** → Proceed.  
     - Step 3: **Yes** → **DENY**. *Rationale*: Flood insurance was available/affordable post-first flood. Prudent person would have insured.  

  3. **Gambler (lost savings on app, can’t pay rent):**  
     - Step 1: **No** → **DENY**. *Rationale*: Loss was voluntary choice (gambling).  

  ---

  ### **Why This Isn’t "Cruelty with a Footnote"**
  - **Targeted Compassion**: Funds are reserved for true brute luck victims (e.g., cancer patients, crime survivors). Denying gamblers preserves resources for them.  
  - **Behavioral Nudge**: Predictable denials for uninsured risks incentivize prudence.  
  - **Political Cover**: Frame denials as "protecting taxpayers from subsidizing avoidable risks," not judging character.  

  ### **What the Procedure Can’t Do**  
  - **Fix Structural Injustice**: E.g., if the "prudent" insurance was unaffordable due to poverty (Step 3 loophole).  
  - **Handle Mixed Cases Perfectly**: E.g., someone with limited literacy skipping insurance.  
  - **Replace Social Safety Nets**: This is last-resort relief, not welfare reform.  
  - **Eliminate Appeals**: Values-based disputes (e.g., "reasonableness") will still escalate.  

  **Operational Note**: Build a supervisor "precedent bank" for escalated cases to ensure consistency. Train examiners to focus on *documented actions* (e.g., insurance declinations) over intent. This cuts through the "choice vs. circumstance" fog.  

