  Progress might require recognizing that "personal identity" serves multiple functions: metaphysical continuity, practical concern, moral responsibility. We may need separate terms for "pattern survival" versus "biological survival." The deepest impasse comes from both sides trying to force these distinct concerns into a single yes/no question about "the same person."

