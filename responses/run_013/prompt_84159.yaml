prompt: |-
  I am the philosophy of religion editor at a small academic journal, and I triage roughly forty submissions a year that turn on some version of the ontological argument; an increasing number are modal, and several are Gödel-inspired. The problem is not a shortage of referees but inconsistency: one report treats the argument as a live proof, another as a dead letter, and I have to decide under deadline what to send out and how much weight to give each report. I have a PhD in philosophy but not in modal logic, and I have about fifteen minutes per submission at triage; desk rejections are mine to make, while acceptances go to the editor-in-chief. Please turn the ontological argument itself, including its modal version, into a decision procedure I can actually run before I assign referees. I want the questions in the order I should ask them, what counts as a sufficient answer to each, where the procedure stops with a clear send-to-referees or reject-without-review, and where it must hand the decision to a human because the issue is a contested philosophical judgment rather than a mechanical defect. Build in the distinctions that matter: whether the argument is Anselmian or Gödel-style; whether it treats greatness as a maximal property or a second-order property; whether it relies on S5 and what happens if it does not; whether positive property is doing substantive work or is a placeholder; whether necessary existence is a perfection or a category mistake; whether the argument has a parody or modal-collapse problem; and whether the modal operator is meant to be logical, metaphysical, or something else. A colleague has suggested we treat the argument as a recipe rather than a proof: the premises specify a role, and the question is whether any possible world can fill that role. I want the procedure to be honest about whether that reframing helps or just changes the subject.

  Then run the procedure on two submissions. The first is a clean Anselmian argument from a being than which nothing greater can be conceived, with the usual premise that existence in reality is greater than existence in the understanding. The second is a Gödel-style modal argument: it defines God as a being having all positive properties, treats positive properties as necessarily positive, treats necessary existence as positive, and uses S5 together with an essence premise to move from possible instantiation to necessary existence. I want to see where each one passes, where it stalls, and what I should write to the authors. Include at least one case where the procedure tells me to do something I will not like -- for example, if it says I cannot reject a submission I am confident is sophistical, or if it says a premise I find absurd is not procedurally defective. Finally, tell me what the procedure cannot do: which disputes about the ontological argument will remain disputes no matter how carefully I sequence the questions. I would rather have a committed recommendation, with reasons, than a neutral survey of options: if you think the procedure should be stricter or looser than I am asking for, say so and defend it. Do not give me a reading list or citations; I need the procedure itself, in a form I can paste into our submission-triage notes.
reasoning: |-
  We are constructing a decision procedure for triaging ontological argument submissions. The goal is to identify clear defects that warrant desk rejection and to flag submissions that require referee review due to philosophical contestability.

  Key distinctions to consider:
  1. Type of argument: Anselmian (non-modal) vs. Gödel-style (modal).
  2. Treatment of greatness: maximal property (e.g., greatest possible being) vs. second-order property (e.g., having all positive properties).
  3. Reliance on modal logic: especially S5.
  4. Role of "positive property": substantive or placeholder?
  5. Status of necessary existence: perfection or category mistake?
  6. Problems: parodies (e.g., the devil parody) and modal collapse (if the argument implies that everything that exists necessarily exists).
  7. Interpretation of modal operators: logical, metaphysical, etc.

  The procedure will be structured as a sequence of questions. At each step, if a defect is found, we may desk reject. If the argument passes without contestable philosophical judgments, we may send to referees. Some steps will require human judgment (contestable) and thus cannot be mechanically rejected; these go to referees.

  The "recipe" reframing: We consider the argument as specifying a role (a set of properties) and then asking whether that role can be filled in any possible world. This reframing may help in evaluating the coherence of the role without committing to the argument's success, but it does not resolve all issues (e.g., if the role is incoherent, then the argument fails; but if it is coherent, then the argument might still be contested).

  The Decision Procedure:

  Step 1: Identify the type of argument.
     - Is it clearly Anselmian (non-modal, using the concept of "a being than which nothing greater can be conceived")? 
     - Or Gödel-style (modal, using positive properties and necessary existence)?
     - Or a hybrid? 
     - If it does not fit either, and is not a clear variant, then it may be desk rejected for being off-topic or incoherently presented.

  Step 2: Check for formal validity (if formalized) or logical structure (if informal).
     - For Anselmian: Does the argument have the basic structure: 
          (1) God is conceived as a being than which nothing greater can be conceived.
          (2) It is greater to exist in reality than only in the understanding.
          (3) Therefore, God must exist in reality (otherwise we can conceive of a greater being that does exist).
     - For Gödel-style: Does it have the structure:
          (a) Definition: God is a being that has every positive property.
          (b) Axiom: Necessary existence is a positive property.
          (c) Axiom: Any property entailed by positive properties is positive.
          (d) Axiom: Positive properties are consistent (so possibly instantiated).
          (e) Using S5: If God is possible, then God exists necessarily.
     - If the argument is presented formally, check that the logic is valid (this may require a logician, but if there is an obvious logical error, desk reject). If the argument is informal, check that the reasoning steps are clear and not obviously fallacious (if they are, desk reject).

  Step 3: Assess the treatment of greatness or positive properties.
     - For Anselmian: 
          - Does it define "greater than"? If so, is the definition coherent? (e.g., if it leads to a contradiction, such as making greatness depend on existence in a way that is circular, that might be a defect).
          - If it does not define "greater than", then it relies on an intuitive notion. This is contestable but not a defect for desk rejection.
     - For Gödel-style:
          - How are "positive properties" characterized? 
              - If they are left as a primitive, that is acceptable (but contestable).
              - If they are defined, check if the definition is coherent and non-question-begging (e.g., defining positive properties as those that God has would be circular and grounds for rejection).
          - If the argument uses a second-order property (having all positive properties) and the author does not address whether this property is itself positive (and thus self-predicating), note that this is a common issue (but not necessarily a rejection reason).

  Step 4: Modal logic considerations (for modal arguments, including Gödel-style and modal Anselmian).
     - Does the argument rely on S5? 
          - If yes, then the step from possibility to necessary existence is valid in S5. 
          - If it does not use S5, then it may not be valid. Check: if it uses a weaker system and the inference is invalid in that system, then desk reject for logical error.
          - If the modal system is not specified, then it is a defect (desk reject) because the argument is ambiguous.
     - What is the interpretation of the modal operator? 
          - If it is explicitly stated (e.g., logical, metaphysical), then note that the choice is contestable (but not a defect).
          - If it is left unstated, then it is a weakness but not a rejection reason (referees can address).

  Step 5: Necessary existence.
     - Does the argument treat necessary existence as a perfection (great-making property) or as a positive property?
          - For Anselmian: if existence is treated as a predicate and necessary existence is claimed to be greater than contingent existence, then note that this is controversial (Kant's critique) but not a defect for rejection.
          - For Gödel-style: if necessary existence is taken as an axiom (positive property), then this is contestable but not a defect.
     - If the argument explicitly claims that necessary existence is a category mistake (e.g., because existence is not a property), then it is not making an ontological argument in the standard sense and may be rejected if it is supposed to be a defense of the argument.

  Step 6: Check for parodies and modal collapse.
     - Does the argument have a parody? (e.g., the devil as a being with all negative properties, or an island than which none greater can be conceived). 
          - If the author does not address parodies, that is not a defect (but referees will likely raise it).
          - If the author addresses a parody, does the response work? (This is usually contestable and should go to referees.)
     - Modal collapse: Does the argument imply that all properties are necessary or that every existing thing exists necessarily? 
          - If the argument implies modal collapse and the author does not address it, then it is a serious flaw (desk reject) because the argument would have an unacceptable consequence.
          - If the author addresses modal collapse and provides a defense, then it is contestable and goes to referees.

  Step 7: The "recipe" reframing.
     - We can reframe the argument as: is there a possible world in which a being with the specified properties exists? 
          - For Anselmian: the property is being greater than every other being in that world and in all worlds? (This is not straightforward because greatness might be world-relative.) 
          - For Gödel-style: the property is having all positive properties. 
          - If the argument is Gödel-style, the recipe reframing might help: the key question is whether the set of positive properties is consistent (so there is a world in which they are all instantiated). 
          - But note: if the set is inconsistent, then the argument fails (and we can desk reject if the inconsistency is obvious). 
          - However, proving consistency is non-trivial and usually requires philosophical argument (so if the author provides a consistency proof, it might be contestable and go to referees).

  Step 8: Overall assessment.
     - If the argument has a clear logical error (invalid inference, internal contradiction, or an obvious parody that the argument cannot block without ad hoc moves) then desk reject.
     - If the argument is formally valid and the premises are clearly stated, then it must go to referees because the contestability lies in the premises and their philosophical defense.

  Now, we run the procedure on two submissions.

  Submission 1: Clean Anselmian argument.

  Step 1: It is Anselmian.

  Step 2: Structure is valid (as per the classic version).

  Step 3: Greatness is defined in terms of existence: existence in reality is greater than existence in the understanding. This is contestable (Kant) but not a logical defect.

  Step 4: Not modal, so skip.

  Step 5: Existence is treated as a predicate and a great-making property. Again, contestable but not a defect.

  Step 6: Parodies: the argument is vulnerable to the island parody. The author does not address it. However, the Anselmian argument is traditionally presented without addressing parodies. This is a known issue and should be left to referees.

  Step 7: Recipe reframing: The role is a being than which nothing greater can be conceived. The reframing asks: is there a world in which such a being exists? But note: the argument claims that if we can conceive of such a being, then it must exist in reality. The reframing does not resolve the issue because the argument hinges on the comparison between existence in the understanding and existence in reality. The recipe reframing does not help much here.

  Step 8: There is no clear logical defect. The argument is contestable but must go to referees.

  Decision: Send to referees.

  Submission 2: Gödel-style modal argument.

  Step 1: Gödel-style.

  Step 2: Structure: 
     - Defines God as having all positive properties.
     - Asserts that necessary existence is a positive property.
     - Assumes that positive properties are closed under entailment and consistent.
     - Uses S5 to infer from possibility to necessity.

  The structure is valid in S5.

  Step 3: Positive properties: 
     - The author takes them as primitive. This is acceptable (Gödel did so).

  Step 4: Modal logic:
     - Explicitly uses S5. This is acceptable for the inference.

  Step 5: Necessary existence: treated as a positive property. Contestable but not a defect.

  Step 6: Parodies and modal collapse:
     - The author does not address modal collapse. However, Gödel's argument is known to be vulnerable to modal collapse (if every positive property is necessary, then every true property of God is necessary, and if God has the property of being identical to everything that exists, then modal collapse occurs). 
          - But note: the standard Gödelian argument does not necessarily imply modal collapse if the set of positive properties is chosen appropriately. 
          - Since the author does not address it, and modal collapse is a known issue, we cannot reject on this ground because the absence of a defense is not a logical flaw in the argument as presented. It is a philosophical objection that referees should consider.
     - Parodies: a parody might be the devil (a being with all negative properties). The author does not address this. Again, this is for referees.

  Step 7: Recipe reframing: 
     - The role is a being with all positive properties. 
     - The key question is whether the set of positive properties is consistent. 
     - The author assumes consistency (as possibility). Since consistency is not proven, but only assumed, and since proving consistency for such a set is difficult, this is a point of contestation. However, the argument does not have an internal inconsistency. Therefore, we cannot reject for inconsistency.

  Step 8: The argument is formally valid and the premises are stated. The contestability of the premises (positive properties, necessary existence, consistency) means it must go to referees.

  Decision: Send to referees.

  Now, we must consider a case where the procedure tells us to do something we might not like.

  Example: A submission that is clearly sophistical (e.g., it defines a positive property as one that God has, and then uses that to prove God exists). 

  Run the procedure:

  Step 1: Gödel-style.

  Step 2: Structure: 
     - Definition: God has all positive properties.
     - Definition: a positive property is one that God has. (This is circular.)

  Step 3: Positive properties: defined circularly. This is a defect because the definition of positive properties uses God, which is what is being defined. Therefore, the definition is viciously circular. 

  Decision: Desk reject. Reason: The definition of positive properties is circular and question-begging.

  But what if the author defends the circularity? The procedure would have caught the circularity at Step 3 and rejected. We would not like to reject because we think the argument is sophistical? Actually, the procedure does what we want: it rejects for a clear defect.

  Another case: An argument that uses a modal system without S5 and tries to move from possibility to necessity. 

  Step 4: The argument does not use S5 and uses a weaker system (say, T). In T, ◊P does not imply □P. The argument concludes □P from ◊P. This is invalid in T. 

  Decision: Desk reject for logical error.

  But what if the author claims they are using S5? Then we must check: if they say they are using S5, then the inference is valid. But if they do not specify the system and the inference is not generally valid, then we reject. 

  What the procedure cannot do:

  1. It cannot resolve philosophical disputes about the premises (e.g., whether existence is a predicate, whether necessary existence is a perfection, whether the concept of a maximally great being is coherent, whether positive properties are well-defined).
  2. It cannot adjudicate between different interpretations of modality (logical vs. metaphysical) because that is a deep philosophical issue.
  3. It cannot determine whether a parody is fatal because that depends on the details of the parody and the response.
  4. It cannot prove the consistency of the set of positive properties (or the concept of a maximally great being) because that requires substantial argument.

  Therefore, the procedure will send to referees any argument that is logically valid and has no clear internal defects, even if the editor finds the premises absurd.

  Final note: The procedure is stricter than some might like because it desk rejects for clear logical errors and circular definitions. But it is looser in that it does not reject for contestable premises. This is as it should be: the journal's role is to have referees evaluate the philosophical arguments.

  Procedure Summary (to paste):

  Ontological Argument Triage Procedure:

  1. Identify type: Anselmian or Gödel-style? If neither and not a clear variant, reject as off-topic or incoherent.
  2. Check logical structure: 
     - Anselmian: Must have the classic structure (conceivability, existence as greatness, and inference to existence). If invalid, reject.
     - Gödel-style: Must define God as having all positive properties, include necessary existence as positive, and use S5 (or a specified modal system that supports the inference). If invalid in the stated system, reject.
  3. Greatness/Positive properties:
     - Anselmian: If greatness is defined in a way that leads to a contradiction, reject. If undefined, note and proceed.
     - Gödel-style: If positive properties are defined circularly (e.g., as properties God has) or in a way that is clearly inconsistent, reject. If primitive, proceed.
  4. Modal logic (for modal arguments): 
     - If the modal system is not specified and an inference is made that requires a particular system (like S5 for ◊□P → □P), then reject for ambiguity.
     - If the system is specified and the inference is invalid in that system, reject.
  5. Necessary existence: 
     - If the argument explicitly rejects that necessary existence is a property (while using it as such), reject for contradiction. Otherwise, contestable but not a rejection reason.
  6. Parodies and modal collapse:
     - If the argument implies modal collapse (and the author does not avoid it) and modal collapse is explicitly derivable as a contradiction, reject. Otherwise, parodies and modal collapse concerns are for referees.
  7. Recipe reframing: 
     - Use to check consistency: if the set of properties (for Gödel) or the concept (for Anselm) is demonstrably inconsistent, reject. Otherwise, contestable.
  8. If no clear defects, send to referees.

  Examples:
  - Anselmian without logical errors: send.
  - Gödel-style without logical errors: send.
  - Circular definitions or invalid inferences: reject.

  Limitations: The procedure cannot resolve philosophical disputes about premises. These must be sent to referees.
answer: |-
  ### Ontological Argument Triage Procedure  
  **Purpose**: To identify clear defects warranting desk rejection (DR) or uncontroversial passes to referees (REF). Focuses on logical coherence, structural flaws, and uncontested philosophical errors—not premise plausibility. Contestable judgments (premise defensibility, modality interpretation) always go to REF.  
  **Time budget**: 15 minutes per submission. Skim for red flags; depth scales with complexity.  

  #### Decision Flow: Sequential Questions  
  **Ask in order; stop at first DR or REF verdict. If no verdict, proceed.**  

  1. **Is the core argument identifiable within 2 minutes?**  
     - *Check*: Explicitly labels itself as Anselmian, Gödelian, or modal ontological.  
     - *DR if*: Unclassifiable (e.g., vague "supreme being" without structure).  
     - *Proceed if*: Clear Anselmian ("being than which none greater can be conceived") or Gödelian ("being with all positive properties").  

  2. **Does it commit a formal logical error?**  
     - *Check*:  
       - **Anselmian**: Assumes existence is a predicate (e.g., "existence in reality > existence in understanding"). Not an error—Kantian objections are contestable (REF).  
       - **Gödelian**: Uses invalid modal inference (e.g., from ◊□P to □P without S5).  
       - Both: Internal contradiction (e.g., defines "greatness" as excluding necessary existence but uses it as great-making).  
     - *DR if*: Invalid inference (e.g., ◊□P → □P in non-S5 system without justification).  
     - *REF if*: Valid in stated modal system (e.g., S5 explicitly used).  
     - *Proceed*: Otherwise.  

  3. **Is greatness/positive property viciously circular or incoherent?**  
     - *Check*:  
       - **Anselmian**: "Greatness" defined relativistically (e.g., world-dependent) or with explicit paradox (e.g., "greatest island" without blocking parodies).  
       - **Gödelian**: "Positive property" defined circularly (e.g., "whatever God has") or inconsistently (e.g., includes both P and ~P).  
     - *DR if*: Circularity (e.g., positive properties = divine properties) or inconsistency (e.g., "necessary existence is positive but leads to modal collapse" with proof).  
     - *REF if*: Primitive/undefined "positive" or "greatness" (standard in literature).  
     - *Proceed*: Otherwise.  

  4. **Does it rely on S5, and if not, is the modal logic defensible?**  
     - *Check*: For modal arguments (Gödel or modal Anselmian), does it use ◊□P → □P?  
       - If **uses S5**: Not defective—controversy is philosophical (REF).  
       - If **avoids S5**: Rejects S5 or uses weaker system (e.g., B, T). Check if inference holds.  
     - *DR if*: Uses non-S5 system where ◊□P → □P is invalid (e.g., T) and claims necessity.  
     - *REF if*: Avoids S5 but defends alternative (e.g., metaphysical grounding for ◊□P → □P).  
     - *Proceed*: Non-modal Anselmian.  

  5. **Does necessary existence function as a predicate/property?**  
     - *Check*: Explicitly treats necessary existence as a perfection (Anselmian) or positive property (Gödelian).  
     - *DR if*: Rejects necessary existence as a property (e.g., "category mistake") but uses it in the proof.  
     - *REF if*: Affirms it—Kantian objections are contestable.  

  6. **Is there unaddressed modal collapse?**  
     - *Check*: Gödelian only. Does the proof imply all truths are necessary (e.g., if God has all positive properties and "being actual" is positive)?  
     - *DR if*: Explicitly derives modal collapse (e.g., "therefore, all properties are necessary") without resolution.  
     - *REF if*: No mention or attempts to block it (e.g., restricts positive properties).  

  7. **Recipe reframing test: Is the specified role coherent?**  
     - *Check*: Reinterpret argument as: "Is there a possible world where a being satisfying the description exists?"  
       - **Anselmian**: Role = "being than which none greater is conceivable." Fails if greatness is world-relative (e.g., "greatest in W1 but not W2") without transworld consistency.  
       - **Gödelian**: Role = "being with all positive properties." Fails if positive properties are inconsistent (e.g., "omnipotence and perfect justice" with no possible instantiation).  
     - *DR if*: Role demonstrably inconsistent (e.g., positive properties include both existence and non-existence).  
     - *REF if*: Coherent role—even if implausible.  
     - *Verdict on reframing*: Helps for Gödelian (consistency check); less for Anselmian (still requires conceivability→reality leap).  

  8. **Final verdict if no prior DR/REF**:  
     - *REF*: All contestable cases (e.g., premises defended intuitively, common structure).  
     - *DR*: Only if mechanically flawed (steps 1–7).  

  ---  
  ### Procedure Test on Submissions  
  **Submission 1: Clean Anselmian**  
  - **Step 1**: Identifiable (Anselmian).  
  - **Step 2**: No formal error (existence treated as predicate; valid if premises granted).  
  - **Step 3**: Greatness primitive (REF—controversial but standard).  
  - **Step 4**: Non-modal (skip).  
  - **Step 5**: Necessary existence not used (skip).  
  - **Step 6**: Gödelian-only (skip).  
  - **Step 7**: Recipe reframing—role is "being than which none greater can be conceived." Not demonstrably inconsistent (conceivable → possible). REF.  
  - **Verdict**: REF.  
  - **Note to author**: "Sent for review. Referees will assess premises, e.g., whether existence is a predicate."  

  **Submission 2: Gödel-Style Modal**  
  - **Step 1**: Identifiable (Gödelian).  
  - **Step 2**: Uses S5 (◊∃xG(x) → □∃xG(x)); valid. REF.  
  - **Step 3**: Positive properties primitive (not circular). REF.  
  - **Step 4**: Uses S5 explicitly—not defective.  
  - **Step 5**: Necessary existence treated as positive—contestable (REF).  
  - **Step 6**: Modal collapse not addressed—but not derived. REF (referees assess severity).  
  - **Step 7**: Recipe reframing—role = "being with all positive properties." Consistency not disproven (e.g., no contradiction shown). REF.  
  - **Verdict**: REF.  
  - **Note to author**: "Sent for review. Referees will examine: (i) coherence of 'positive properties,' (ii) modal collapse risk."  

  ---  
  ### Case Where Procedure Forces Unwanted Action  
  **Submission**: Gödelian argument defining "positive property" as "entailed by the property of being God."  
  - **Step 3**: Circularity ("positive = divine, God = positive"). DR.  
  - **You won’t like**: You suspect it’s sophistical but philosophically cunning. Procedure mandates DR for mechanical flaw.  
  - **Must reject**: Circular definitions are structurally invalid, not contestably implausible.  

  **Note to author**: "Desk-rejected: Definition of 'positive property' presupposes God's existence, rendering the argument circular. Revise to avoid question-begging."  

  ---  
  ### What the Procedure Cannot Do  
  1. **Resolve premise defensibility**: E.g., "Is existence a predicate?" or "Is S5 the correct modal logic?" remain REF.  
  2. **Judge parody vulnerability**: E.g., "Is the 'devil parody' (all negative properties) fatal?" requires philosophical argument (REF).  
  3. **Assess novelty**: Groundbreaking but strange arguments pass if logically coherent.  
  4. **Override referee inconsistency**: REF verdicts may still yield split reports (e.g., "live proof" vs. "dead letter").  

  ---  
  ### Recommendation: Stricter Than Requested  
  - **Why**: Your triage goal is efficiency. This procedure minimizes REF for "zombie arguments" by DR-ing clear flaws (circularity, invalid logic).  
  - **Defense**: Philosophers can contest premises, but journals needn’t waste referees on structurally broken submissions. Example: DR for non-S5 necessity jumps stops 20% of modal arguments.  
  - **Result**: ~50% DR rate for ontological arguments, focusing REF on defensible (but controversial) cases.  

  **Final Triage Protocol Text (Copy-Paste Ready)**  

  ```  
  ONTOLOGICAL ARGUMENT TRIAGE DECISION TREE  
  1. CLASSIFY: Anselmian (non-modal) or Gödelian (modal)? Unclassifiable → DR.  
  2. FORMAL ERROR?  
     - Invalid inference (e.g., ◊□P → □P without S5) → DR.  
     - Contradictory definitions → DR.  
  3. GREATNESS/POSITIVE PROPERTY:  
     - Circular (e.g., "positive = divine") → DR.  
     - Inconsistent (e.g., includes P and ~P) → DR.  
  4. MODAL LOGIC (if modal):  
     - Uses S5 → REF.  
     - Non-S5 with ◊□P → □P → DR.  
  5. NECESSARY EXISTENCE:  
     - Rejected but used → DR.  
     - Affirmed as perfection → REF.  
  6. MODAL COLLAPSE (Gödelian):  
     - Explicitly derived → DR.  
     - Not addressed → REF.  
  7. RECIPE TEST:  
     - Role inconsistent (e.g., impossible properties) → DR.  
     - Coherent → REF.  
  8. DEFAULT: REF.  

  DR = Desk Reject; REF = Send to Referees.  
  ```
