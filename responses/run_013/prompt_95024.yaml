answer: |-
  Your diagnosis is sharp: this *is* a genuinely stalled, multi-layered disagreement, not merely verbal confusion or conflation. Here's the breakdown with reasons:

  **1. It's not primarily verbal:**  
  While terminological differences exist (e.g., "pleasure" sometimes used narrowly for sensory states), the core camps are making competing claims about the *nature* of the phenomenon. The "distinctive feeling" theorist (e.g., early Bentham, some neuroscientists) argues there *is* a common phenomenal quality ("hedonic tone"). The attitude theorist (e.g., Sidgwick, Feldman) denies this, claiming the *only* commonality is a pro-attitude – a "liking" or "taking pleasure in" – directed at diverse experiences. The family resemblance theorist (inspired by Wittgenstein) rejects *both* essentialism and the need for an attitude, arguing our concept is inherently disunified. They aren't just talking past each other; they fundamentally disagree on whether pleasure *has* a unified essence.

  **2. It's not just conflating well-being with phenomenology (though that matters):**  
  You correctly note that **well-being hedonism** (pleasure = the sole good for a life) can potentially sidestep phenomenological unity. Feldman's "attitudinal hedonism" explicitly does this: well-being comes from *taking pleasure in things*, regardless of any shared feeling. However, the **heterogeneity problem** (Nozick's "Experience Machine," the mosquito bite paradox) bites deeper than just summation:
     *   **Summation Implausibility:** If pleasures lack a common currency (feeling or otherwise), summing them *does* become incoherent, undermining classical utilitarianism and the hedonist calculus your character might employ.
     *   **Motivational Force:** A cold-blooded hedonist needs *reasons* to pursue diverse pleasures. If there's no common "good feeling" or even a unified "liking" state, what motivates choosing scratching over math? The felt-quality theorist has a simpler answer here.
     *   **The Core Metaphysical Question:** The debate predates and underpins well-being applications. Philosophers have long asked: "What *is* this 'pleasure' we value?" independently of whether it *should* be valued.

  **3. It is a genuine, unresolved question about a potential natural kind, stalled by methodological limits:**
     *   **The Stalemate:** Introspection is indeed unreliable and contradictory (as your mosquito bite shows – the *sensation* is similar, the *valence* flips). Neuroscience reveals *multiple, dissociable reward systems* (e.g., "liking" vs. "wanting," opioid vs. dopamine pathways). This supports heterogeneity and attitude theories but doesn't definitively rule out a *unified subjective output* (the feeling).
     *   **Why It's Stuck:**
          *   **The Hard Problem of Valence:** How does neurobiology produce the *subjective quality* of "goodness"? We lack the tools to bridge this gap conclusively.
          *   **Conceptual Vagueness:** "Pleasure" covers too much: sensory delight, relief, amusement, satisfaction, joy, schadenfreude, flow states. Forcing unity might be a category error.
          *   **Evidence Ambiguity:** Lab results (e.g., different neural correlates for different pleasures) can be interpreted either as evidence for heterogeneity *or* as different inputs to a common hedonic process. Attitude theories can absorb neuroscience by locating "liking" in specific neural circuits.

  **4. What Would Count as Progress?** Expecting *one* definitive answer is likely misguided. Progress would look like:
     *   **Conceptual Refinement:** Explicitly splitting the concept (e.g., "sensory pleasure" vs. "attitudinal pleasure" vs. "reward"). Feldman's work is key here. This doesn't end the debate but makes it clearer *which* phenomenon is under discussion. Your hedonist character might exploit this ambiguity strategically.
     *   **Definitive Dissociation:** Finding a clear case where strong "liking" (behavioral indicators) occurs *without any* associated positive subjective feeling quality, or vice-versa. This remains elusive.
     *   **A Unifying Mechanism:** Discovering a specific, measurable neural or computational process *always* present and necessary for *any* state called pleasurable. Current evidence points away from this.
     *   **Embracing Pluralism:** Acknowledging "pleasure" is a cluster concept tracking a family resemblance (motivation, feeling good, belief it's good, behavioral reinforcement) without a single essence. **This is arguably the current trajectory.**

  **Implications for Your Hedonist Character & Your Diagnosis:**
  *   **You've nailed the landscape:** Your three camps are accurate, major positions. The debate *is* stalled in its core metaphysical question.
  *   **Realism for Your Character:** A sophisticated, cold-blooded hedonist would *know* this debate. They might:
      *   **Lean into Attitudinal Hedonism:** "Pleasure isn't a feeling, it's *power*. I *like* what serves me – whether it's a sunset, a deal, or watching a rival squirm. The 'feeling' is irrelevant decoration." This easily justifies intellectual or cruel pleasures.
      *   **Embrace Heterogeneity:** "Pleasures are tools. Scratching an itch and solving a theorem are different tools for different jobs. Why *would* they feel the same? The value is in their use to *me*." This dismisses summation problems.
      *   **Exploit the Ambiguity:** Use phenomenological language to seduce or justify ("feel the bliss"), but switch to attitudinal/functional language when challenged ("I define *my* good as what I desire").
  *   **The Sane Move:** For philosophy, giving up on a *single, simple essence* is progress. For your novel? The lack of resolution *is* the realism. Your hedonist doesn't need the "right" answer; they need a defensible, functional position that serves their ruthlessness. Attitudinal Hedonism or a Nietzschean focus on power/fulfillment over simple "feeling good" might be most compelling for a cold-blooded type.

  **In short:** Your diagnosis is correct. It's a deep, unresolved metaphysical debate, stalled by the limitations of introspection and the complexity of neuroscience, complicated by the conflation with well-being theory. Progress means refined distinctions or embracing pluralism, not finding a single essence. This very ambiguity gives your hedonist character philosophical depth and room for cold, calculated justification.
