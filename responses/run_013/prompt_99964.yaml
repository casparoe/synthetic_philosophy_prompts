prompt: |-
  I'm putting together an episode of a small philosophy podcast, and the guest is a philosopher who defends a view about omissions that I really want to press him on. His line is that omissions are genuine causes, but preventive causes rather than productive ones -- they don't add anything to the world, they subtract from it -- and he pushes that further than most people do, claiming that once you take preventive causation seriously the usual act/omission asymmetry collapses, because on his picture a positive act is just the prevention of the alternative you didn't take. I don't want him just restating this; I want questions that make him do the work.

  So draft me 8-10 questions, with a follow-up for each one keyed to the answer he's most likely to give. I want at least one question each on (a) what exactly separates preventive from productive causation, and why an omission could only ever be the former, (b) the asymmetry-collapse claim -- whether "every act is a prevention of an omission" is anything more than a reductio, (c) whether the account stretches to non-agents, like a heart that stops, a brake that fails, or a river that doesn't flood, (d) the selection problem -- why we single out some omissions as *the* cause of an outcome when there are always thousands of things that didn't happen, plus his answer to the trumping cases where several omissions are all counterfactually relevant but only one looks like the cause, and (e) what would actually count against the whole picture. Keep it in the weeds, no "what drew you to this topic" filler. Last line, give me a one-sentence summary of the interview's arc, starting with "Arc:".
reasoning: |-
  Okay, the user is preparing for a philosophy podcast episode and needs pointed questions to challenge a guest philosopher's view on omissions as preventive causes. The guest argues that omissions are genuine causes (specifically preventive ones) and that this collapses the act/omission distinction. The user wants technical, rigorous questions—no fluff—covering five specific areas: preventive vs. productive causation, asymmetry collapse, application to non-agents, the selection problem, and potential counterevidence.

  First, I need to unpack the guest's position. The core claim is that omissions cause by preventing rather than producing outcomes, and that every positive act is just preventing an alternative omission. This challenges the standard view where acts and omissions are morally distinct. The user wants to push the guest on inconsistencies, overextensions, and potential reductios.

  For area (a) on preventive vs. productive causation, the key is pinning down the metaphysical difference. The guest will likely say productive causes add energy/change while preventions remove possibilities. A sharp follow-up should question whether this binary holds—e.g., if a guard's omission allows a theft, is that really "removing" a prevention or just failing to add one? 

  For (b) on asymmetry collapse, the guest might frame acts as preventions of omissions. The follow-up needs to expose if this is circular or undermines moral responsibility. If turning on a light is just preventing darkness, does that dissolve agency? 

  For (c) on non-agents, the guest must apply the theory universally. If a heart stopping is an omission (failure to beat), is it causally equivalent to a surgeon omitting surgery? The follow-up should test if "omission" becomes meaningless when applied to objects. 

  For (d) on the selection problem, the guest probably uses counterfactual dependence plus normativity. But trumping cases (e.g., two lifeguards failing) challenge this. The follow-up must pressure why we blame one omission over another when both are counterfactually necessary. 

  For (e) on counterevidence, the user wants concrete falsification tests. The guest might dismiss empirical studies, so the follow-up should ask what *would* change their mind—forcing them to admit unfalsifiability or adjust the theory. 

  The questions need to be Socratic: concise, presupposing the guest's stance, with follow-ups preempting dodges. No open-ended "what about X"; instead, "given Y, doesn't Z follow?" The arc should trace from clarifying the theory to exposing its limits. 

  Final check: All five areas covered? Follow-ups anticipate replies? No jargon without context? Yes. The arc sentence must show progression from defense to vulnerability.
answer: |-
  Here are 10 rigorous questions with targeted follow-ups, structured to press the core claims and potential vulnerabilities in your guest's position:

  1.  **Question (a - Separation):** You argue omissions *can only* be preventive causes, not productive ones. What is the precise metaphysical difference between a productive cause (adding something) and a preventive cause (subtracting something), and why is an omission metaphysically incapable of being the former?
      *   *Likely Answer:* Productive causes involve an active transfer of energy or initiation of a new chain, while preventions involve the absence of an interfering force or the removal of a barrier allowing an existing tendency to play out.
      *   **Follow-Up:** But when an omission *allows* a harm (e.g., a guard failing to lock a door enables a theft), isn't the guard's inaction *permitting* the existing causal chain leading to theft – effectively "adding" the condition of non-interference to the world? How does this differ metaphysically from a productive cause adding energy?

  2.  **Question (a - Only Preventive):** Why *must* omissions exclusively involve subtraction? Couldn't an omission also be seen as the *failure to add* a preventing factor (e.g., failing to add water is failing to prevent the plant's death)? Doesn't framing it as "failing to add a preventer" complicate the simple add/subtract dichotomy?
      *   *Likely Answer:* The subtraction is of the *expected or normatively required preventing action*. The omission subtracts the intervention that would have altered the course.
      *   **Follow-Up:** But doesn't describing the omission as "subtracting the intervention" presuppose the *existence* or *demand* for that intervention? If the intervention never existed (was only potential), what exactly is being "subtracted"? Isn't this just a counterfactual dependence dressed as subtraction?

  3.  **Question (b - Asymmetry Collapse):** You claim the act/omission distinction collapses because every positive act is just the prevention of the alternative omissions. Isn't this dangerously close to being merely a *redescription* rather than a substantive metaphysical equivalence? What work does calling an act "the prevention of its omission" do that calling it "an act" doesn't, besides semantic inversion?
      *   *Likely Answer:* It reveals the underlying causal structure is the same: both involve the non-occurrence of alternative possibilities. Acting to turn on a light *is* preventing the world-state where the light remains off.
      *   **Follow-Up:** But doesn't this description erase the crucial *agentive contribution*? When I flip the switch, I *initiate* a change. When I omit to flip it, I *refrain* from initiating. Doesn't collapsing them obscure the fundamental difference in how the agent relates to the outcome – as source vs. as passive allow-er?

  4.  **Question (b - Substantive Claim):** If every act is simply preventing some omission, what prevents this from being a vicious regress? Is preventing the omission of act A itself an act (preventing the omission of preventing the omission of A...)? Or is there a fundamental "positive" action layer your account ultimately relies on?
      *   *Likely Answer:* The regress is halted at the level of basic actions or agentive capacities. Preventing an omission *is* exercising that capacity positively at the most fundamental level describable.
      *   **Follow-Up:** Doesn't this appeal to "basic actions" or "exercising capacities" reintroduce the very notion of a positive, productive cause that your account aimed to dissolve or recast as prevention? Isn't this an admission that prevention relies on a more fundamental notion of positive agency?

  5.  **Question (c - Non-Agents):** How does your account apply to non-agential "omissions"? Take a heart stopping – is this an omission (the heart failing to beat) causing death preventively? Or a brake failure causing a crash? Or a river *not* flooding this year causing an ecosystem change?
      *   *Likely Answer:* Yes, these are omissions causing preventively. The heart's failure to beat prevents the continuation of life-sustaining circulation. The brake's failure prevents deceleration.
      *   **Follow-Up:** Doesn't this stretch the concept of "omission" beyond recognition? We typically associate omissions with *agents* failing to fulfill roles or duties. Calling a mechanical failure or a natural non-occurrence an "omission" seems metaphorical at best. Doesn't this blur the line between causation-by-absence (which might be real) and genuine *agential* omission?

  6.  **Question (c - Agentive Core?):** Following up: If non-agential failures (heart stopping, brake failing) are genuine omissions causing preventively, does your account *need* the concept of agency at all for omissions to be causes? Or is agency merely a common contextual factor for *which* omissions we care about morally/legally?
      *   *Likely Answer:* Agency isn't metaphysically necessary for omission-causation; it's crucial for responsibility, but the causal structure (prevention via absence) applies widely.
      *   **Follow-Up:** But if agency isn't metaphysically central, why use the term "omission" (which strongly connotes agency/failure) rather than just "absence" or "non-occurrence"? Doesn't retaining "omission" for non-agential cases risk smuggling in normative expectations inappropriate to rocks or rivers?

  7.  **Question (d - Selection Problem):** You acknowledge countless non-occurrences are counterfactually necessary for any outcome. What is your principled criterion for selecting *which* omission is *the* cause (or a salient cause) – say, the lifeguard's failure to watch vs. the manufacturer's failure to make unsinkable floats vs. my failure to teleport to the pool to save the child?
      *   *Likely Answer:* Salience comes from normative expectations, statistical norms, or designed roles. The lifeguard had a specific duty and capacity; the other factors, while counterfactually necessary, violate no salient norm or expectation in that context.
      *   **Follow-Up:** How does this avoid being circular? We pick the omission that violates a norm, but norms often exist *because* we pick certain omissions as causes! Furthermore, doesn't this make causation inherently normative/contextual rather than purely metaphysical on your account?

  8.  **Question (d - Trumping):** Consider a classic trumping case: Patient needs Drug X. Pharmacist A (primary duty) omits to dispense it. Pharmacist B (backup, also present) simultaneously omits to dispense it. Both omissions are counterfactually necessary for harm – if either had acted, the patient would be fine. Yet intuitively, only A's omission is *the* cause; B's is merely a condition. How does your preventive causation account, combined with your selection criterion, explain why A's omission *trumps* B's as the cause?
      *   *Likely Answer:* Normative role assignment trumps mere counterfactual dependence. A had the primary, designated responsibility; B's role was subsidiary. Causation tracks the violation of the primary duty.
      *   **Follow-Up:** Doesn't this mean that on your view, causation in omission cases is *constituted* by normative role violation? If so, is this still a theory of *causation*, or has it become a theory of responsibility or duty-breach masquerading as causation?

  9.  **Question (e - Counterevidence):** What kind of evidence or argument *would* genuinely falsify or significantly undermine your core thesis that omissions are genuine (preventive) causes and that this collapses the act/omission distinction? What's the strongest counter you've encountered?
      *   *Likely Answer:* A demonstration that prevention is *not* a genuine form of causation, or that productive causation is fundamentally different in a way that maps perfectly onto acts vs. omissions. Or empirical psychology showing an irreducibly different neural/cognitive basis for acting vs. omitting.
      *   **Follow-Up:** If studies *did* show distinct neural signatures for commission vs. omission decisions, would you interpret that as evidence against the metaphysical equivalence, or merely as evidence of how our cognitive apparatus *represents* fundamentally similar causal structures differently?

  10. **Question (e - Burden Shift):** Some argue that treating omissions as causes commits us to an absurdly profligate ontology of causally potent absences (every non-rock is preventing me from being hit by that rock right now). You dismiss this as a selection problem. But isn't the burden on *you* to provide a non-gerrymandered, non-normatively-loaded principle that carves causally relevant omissions from the infinite sea of non-occurrences *without* relying on intuitions your theory aims to overturn?
      *   *Likely Answer:* The principle is counterfactual dependence *plus* relevance to salient norms, mechanisms, or interests. This is no more gerrymandered than how we select *which* productive causes to mention.
      *   **Follow-Up:** But when selecting productive causes, we often point to spatiotemporal proximity, energy transfer, or mechanistic involvement – seemingly more objective factors. Isn't relying on "salience" and "norms" for omissions an admission that the causal claim itself is far less robust and more dependent on human interests than causation by positive acts?

  **Arc:** The interrogation progresses from clarifying the core metaphysical claims (preventive vs. productive, non-agential scope) through probing the radical implications (asymmetry collapse) and major challenges (selection, trumping), culminating in testing the theory's falsifiability and confronting its potential reliance on normativity over pure causal metaphysics.
