prompt: |-
  Right, so I've got a weird research itch and a term to scratch it: do video-game characters matter morally? And I mean the actual characters — the companion who dies in act two and you feel bad about for days, the NPC whose whole existence is a fetch-quest, the procedurally generated villager with a name pulled off a random table. Two intuitions keep pulling against each other for me. A character is a fiction, so maybe the only thing that matters is the player's experience of it; but a character is also an artifact with behavior, something that reacts to you, which feels more like it could be a genuine object of moral concern in its own right. I don't know which way I lean and honestly I don't need to settle it here.

  What I want from you: tell me what the live open questions in this little area actually are, then commit to which two or three are worth the next year. It's me and one other person, part-time, philosophy-ish training but we can read a bit of game studies. Rank them and defend the ranking — which questions other questions depend on, which are doable by the two of us versus which need empirical work we can't do, which are neglected versus which everyone has already written about.

  A few things I'm already chewing on, so skip the obvious ones or fold them in: whether moral status here could come in degrees (a companion you're forced to travel with vs. a background sprite); whether the real frame is the character at all, or what caring about the character does to the player's moral psychology; and what changes when a character's lines aren't authored but generated on the fly, so there's no fixed intention behind any of it. If those turn out to be the wrong questions, say so.

  Be honest with me: if this area is too thin or too muddled to rank open questions sensibly, or if "mattering morally" is smuggling in several different questions under one label, tell me that up front instead of pretending the menu is full. And lead with your top pick in the first sentence, then give the reasoning — no throat-clearing.
