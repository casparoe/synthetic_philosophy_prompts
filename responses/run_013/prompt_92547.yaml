prompt: |-
  I run a small research group -- two postdocs, one doctoral student, a workshop budget, and about two years before we have to show something -- and I have to decide what those years are spent on. The area I want to claim is the epistemology of moral testimony. I'd like you to set the agenda for us: which open questions matter most, in what order, and why.

  I don't want a survey of positions, so let me tell you what I already believe, since part of what I'm asking is whether my framing is worth building on. The standard way into this topic is an asymmetry: it seems unremarkable to take someone's word for it that the ice is thin, and troubling to take someone's word for it that an act is wrong. I have come to think the moral-versus-descriptive cut is the wrong one. My hypothesis is that the real variable is articulacy -- whether the person you defer to can hand you the reasons, as opposed to simply seeing it. Deference to the veteran clinician, to the connoisseur, to the mathematician with a nose for a proof, strikes me as raising the same discomfort, and nobody thinks those cases are 'moral'. If that is right, moral testimony is one instance of a general problem about deference to normative competence, and much work organized around the moral case is looking in the wrong place. I also suspect the debate has been asking the permissive question -- when may I defer? -- when the live question is the mandatory one: when must I?

  Assume my budget, and take my hypothesis seriously enough to attack it. Then give me a ranked agenda. For each item, tell me why it is upstream of other work rather than downstream; how tractable it is for two philosophers and a graduate student with no empirical funding; how neglected it is relative to how much turns on it; what two years of work on it would actually consist of; and what would move it up or down the list. Include, and rank against one another, at least these candidates and any better ones you can think of: whether the articulacy hypothesis really predicts the pattern of intuitions across moral, aesthetic, and epistemic deference; whether there is ever an obligation to defer rather than a mere permission; what deference does to the deferring agent's later reliability and to their standing to blame; moral testimony in institutions, where the testifier is a committee or a protocol rather than a person; whether machines trained on human text can be moral testifiers, and what, if anything, that changes; and moral testimony as a mechanism of moral learning in children, where the deferring party is also the party being formed.

  Be decisive. I want a ranking I can act on, and a clear statement of which of my commitments you would give up first -- not a menu with the choice left to me. Write so that the ideas carry the weight rather than names and citations; I don't need a reading list.
reasoning: |-
  Okay, the user runs a small research group and needs a clear, actionable agenda focused on the epistemology of moral testimony. They've presented a hypothesis that the key factor in deference isn't the moral/descriptive divide but articulacy—whether the testifier can provide reasons. They suspect the real question isn't when one may defer but when one must. 

  First, I need to unpack their core argument. They're challenging the standard asymmetry by claiming that discomfort with deference arises in non-moral domains too (clinicians, connoisseurs, mathematicians) when reasons aren't transparent. This reframes moral testimony as part of a broader normative competence issue. Their emphasis on mandatory deference adds urgency—it's not just permissible but obligatory in some cases. 

  The user's explicit needs: a ranked research agenda with clear priorities, not a survey. They want decisiveness—what to tackle first, why, and what to deprioritize. Implicitly, they might be seeking validation of their hypothesis's potential while remaining open to its flaws. Their team constraints (small group, no empirical funding) mean projects must be theoretically focused yet rigorous. 

  Assessing their hypothesis: The articulacy theory is elegant but needs stress-testing. Does it truly explain cross-domain intuitions better than alternatives? Could it be that moral testimony feels different because moral judgments require emotional engagement or identity-formation, not just articulacy? The obligation angle is underdeveloped but promising—institutions and learning contexts might reveal where deference isn't optional. 

  Now, ranking their proposed topics: 
  - Top priority must be validating the articulacy hypothesis itself (Item 1). If this core fails, the rest collapses. It's upstream, tractable with conceptual analysis, and neglected in comparative studies. 
  - Obligation to defer (Item 2) comes next—it's the user's novel pivot and could redefine the field. Tractability is high with no empirical needs. 
  - Child moral learning (Item 5) feels urgent but risky without funding; better positioned after core theory is solid. 
  - Machine testimony (Item 4) is flashy but derivative—it leans on prior work about non-human testifiers. 

  Key trade-off: The user's commitment to "articulacy as primary" must be tested before building on it. If forced to choose, I'd sacrifice their focus on moral learning in children first—it's downstream and resource-heavy. Machines can wait. 

  Execution plan: Years 1-2 should pressure-test the hypothesis across domains (aesthetics, epistemology) while developing the obligation framework. Workshops would simulate institutional cases; graduate work could analyze blame-standing. Outputs: 2-3 high-impact papers establishing the new paradigm, setting up future empirical work. 

  This agenda bets big on their hypothesis but builds in safeguards. If Year 1 disproves articulacy as the key variable, the pivot to obligation studies still salvages novelty.
answer: |-
  Here is a decisive, action-oriented research agenda prioritizing your articulacy hypothesis and the obligation question. The ranking is based on foundational importance to your core idea, tractability with limited resources, and potential for high-impact reframing of the field. Sacrifices are made for focus.

  **Core Ranking & Agenda:**

  1.  **Validate the Articulacy Hypothesis Across Domains** (Moral/Aesthetic/Epistemic)
      *   **Why Upstream & Critical:** *Everything* hinges on this. If articulacy doesn't robustly predict intuitive discomfort with deference across normative domains (moral, aesthetic, epistemic), your core reframing collapses. It must be established *before* exploring obligation, machines, or learning. This is the keystone.
      *   **Tractability:** High. Pure conceptual/analytic work. No experiments needed. Requires rigorous thought experiments, intuition polling within the group, careful construction of parallel cases (e.g., deferring to an inarticulate art critic vs. a rule-explaining one; deferring to a mathematician who "sees" the proof flaw vs. one who can walk you through it; deferring to an inarticulate moral exemplar vs. a clear ethicist). Compare against rival explanations (e.g., emotional engagement required, identity-constituting nature of judgment).
      *   **Neglected vs. Importance:** Moderately neglected. While intuitions *within* moral testimony are debated, systematic cross-domain *comparison* focusing on articulacy as the key variable is rare and crucial.
      *   **Two Years' Work:** Y1: Develop a robust battery of paired scenarios across domains, meticulously varying articulacy while holding other factors constant. Run internal "intuition workshops." Draft paper systematically defending the hypothesis against obvious counterexamples (e.g., some articulate testifiers might *still* evoke discomfort; some inarticulate ones might feel fine). Y2: Refine arguments, target top journal submission. Explore initial implications for the obligation question *if* hypothesis holds.
      *   **Move Up/Down:** Unmovable from #1. Success moves everything else forward; failure necessitates major pivot.

  2.  **Establish the Conditions for an Obligation to Defer (The "Must" Question)**
      *   **Why Upstream & Critical:** Your suspicion about the "must" being live is a major potential contribution. If articulacy holds (#1), *then* exploring when deference becomes *mandatory* (not just permissible) in normative domains is the natural, high-impact next step. It fundamentally shifts the debate's axis.
      *   **Tractability:** High. Conceptual/analytic. Builds directly on #1. Focus on cases where *not* deferring seems culpable: institutional roles (judge following precedent), urgent expertise (disaster triage), foundational learning (apprenticeship). Analyze the source of the obligation (role-responsibility, epistemic duty, harm prevention?).
      *   **Neglected vs. Importance:** Highly neglected. The literature obsesses over *whether* deference is ever permissible/appropriate; the *obligation* angle is largely unexplored, especially systematically across normative domains.
      *   **Two Years' Work:** Y1 (Parallel to #1 finishing): Develop framework for obligation – what kinds of normative demands create it? Analyze paradigmatic "must defer" cases. Draft paper outlining the obligation thesis and initial conditions. Y2: Deepen analysis, connect explicitly to articulacy findings (#1). Does obligation *require* articulacy? Or function differently without it? Target high-impact publication.
      *   **Move Up/Down:** Moves up if #1 validates articulacy strongly. Moves down only if #1 catastrophically fails. Core to your novel angle.

  3.  **Impact on Later Reliability and Standing to Blame**
      *   **Why Now & Important:** Directly downstream of #1 and #2. *If* we sometimes *must* defer, what are the consequences? Does it damage my future ability to judge independently? Crucially, does it undermine my standing to blame others? This tests the *practical coherence* of obligated deference and is key to addressing common worries ("outsourcing morality").
      *   **Tractability:** High. Conceptual/analytic. Requires analyzing counterfactuals and normative standing. Does obligated deference preserve/blunt later reliability? Does it create a "right to blame" via institutional role or proper procedure, even if not personal insight?
      *   **Neglected vs. Importance:** Moderately neglected, especially the *obligation* angle. Standing to blame after deference is discussed, but rarely framed by mandatory deference. Reliability post-deference is often assumed negative, needs nuanced analysis.
      *   **Two Years' Work:** Y2 (Post core #1/#2 papers): Focused paper(s) on the reliability and standing implications, particularly for cases of *obligated* deference identified in #2. Does deferring *because you must* change the calculus vs. optional deference?
      *   **Move Up/Down:** Moves up if #2 (Obligation) proves exceptionally fruitful. Moves down if core theory (#1/#2) needs more foundational work. Essential practical implication.

  4.  **Moral Testimony in Institutions (Committees/Protocols)**
      *   **Why Here & Important:** Applies the core theory (#1, #2, #3) to a complex, real-world context. Institutional testimony often *lacks* individual articulacy but *imposes* obligation (e.g., following a hospital ethics protocol). Tests the robustness of articulacy and explores how obligation functions structurally.
      *   **Tractability:** Medium-High. Conceptual/analytic, but requires careful modeling of institutional agency and epistemic structures. No fieldwork needed, just analysis of institutional logic.
      *   **Neglected vs. Importance:** Some work exists, but rarely integrated with a strong articulacy hypothesis or the obligation question. High practical importance.
      *   **Two Years' Work:** Largely Year 2 activity. Paper analyzing how institutional testimony challenges or confirms the articulacy hypothesis (e.g., protocols embody "crystallized" articulacy?) and how it creates unique forms of obligation (role-based, procedural). Connects to standing to blame within institutions.
      *   **Move Up/Down:** Moves up if core theory is solid and institutions are seen as a crucial test case. Moves down if core theory needs more work. Strong application.

  5.  **Moral Testimony as Learning in Childhood (Formation)**
      *   **Why Lower Priority:** While fascinating and related to "formation," it's less directly about *deference* as understood in the adult testimony literature and more about pedagogy and development. It requires engaging significantly with developmental psychology/ethics literature, risking scope creep without empirical capacity. The "obligation" angle is also less clear-cut (children *must* learn, but is this "deference"?).
      *   **Tractability:** Low-Medium (for you). Requires substantial engagement with empirical literature you lack funding to contribute to directly. High risk of becoming purely theoretical speculation disconnected from actual developmental mechanisms.
      *   **Neglected vs. Importance:** Important topic, but well-trodden in philosophy of education/development. Your articulacy/obligation lens offers a *new angle*, but it's less central to reframing the core adult deference debate.
      *   **Two Years' Work:** Only viable late in Y2 or as a side project if core agenda accelerates. Paper sketching how your framework *might* apply to moral learning, emphasizing the potential role of inarticulate exemplars vs. articulate teachers and the developing "obligation" to internalize norms.
      *   **Move Up/Down:** Moves up only if core theory is exceptionally secure *and* a collaborator with developmental expertise emerges. Otherwise, biggest candidate for sacrifice. Prioritize doctoral student interest here if possible.

  6.  **Machine Moral Testifiers (LLMs/etc.)**
      *   **Why Lowest Priority:** Derivative. Its interest *wholly depends* on the core theory (#1). The key question is: "Does your theory of normative deference (based on articulacy/obligation) apply to non-human agents?" Requires first having that theory solid. Also potentially distracting and over-hyped.
      *   **Tractability:** Medium. Conceptual/analytic, but requires understanding AI limitations (stochastic parrots, lack of understanding/experience). Needs careful disentanglement of what "articulacy" means for an LLM (fluency vs. genuine reason-giving).
      *   **Neglected vs. Importance:** Currently trendy, but often superficial. Importance *for your project* is low unless core theory suggests something unique about machine articulacy vs. human inarticulacy.
      *   **Two Years' Work:** Not recommended for core agenda. Could be a single paper late in Y2 *if* core work is done and machines offer a vivid illustration or challenge to the theory (e.g., "Does an LLM's fluent articulacy *without understanding* satisfy the conditions for permissible/obligatory deference?").
      *   **Move Up/Down:** Only moves up if core theory suddenly makes machines a uniquely revealing case (unlikely). Safest major sacrifice. Let others chase the hype.

  **What to Sacrifice First & Why:**
  *   **First Sacrifice: Machines (Item 6).** It's the most derivative, trendy, and least essential to establishing your core reframing of the field around articulacy and obligation. Let others do this; your contribution lies deeper.
  *   **Second Sacrifice (If Needed): Child Moral Learning (Item 5).** While connected to formation, it shifts focus significantly towards developmental psychology, requiring expertise you lack and offering less direct support for your core challenge to the *adult* moral testimony debate structure. Protecting focus on #1-#4 is crucial.
  *   **Hold Absolute: Items #1 (Validation) and #2 (Obligation).** These are the pillars. If forced, protect #1 above all else – without it, the agenda lacks its unique foundation.

  **Two-Year Execution Plan:**
  *   **Year 1:** All-hands focus on **Item #1 (Articulacy Validation)**. Develop scenarios, run internal workshops, draft the foundational paper. *Simultaneously*, begin conceptual groundwork for **Item #2 (Obligation)** – literature review, identifying paradigm cases.
  *   **Year 2:**
      *   **First Half:** Finalize and submit #1 paper. Push forward decisively on **Item #2 (Obligation)**, drafting the core paper. Begin focused work on **Item #3 (Reliability/Standing)** as a direct consequence of #2.
      *   **Second Half:** Submit #2 paper. Develop **Item #3** into a paper draft. Explore **Item #4 (Institutions)** as a major application area, drafting this paper. *If* time and core theory are secure *and* doctoral student interest aligns, *begin* exploratory work on **Item #5 (Child Learning)**, otherwise shelve. Ignore Machines (#6).
  *   **Outcome Goal:** 2-3 high-impact journal publications establishing the articulacy-based reframing (#1) and the obligation thesis (#2, #3), plus a strong application paper (#4). This sets your group as defining a new axis in the debate.

  This agenda bets decisively on your core hypothesis. It prioritizes validating and building upon "articulacy" and "obligation" with the resources you have, sacrificing scope for depth and impact on the field's fundamental questions. Attack your hypothesis hard on #1 – that's where the greatest risk and reward lie. Go build your claim.
