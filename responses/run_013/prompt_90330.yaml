prompt: |-
  For the last few years I have been keeping a mental list of arguments that share the same shape, and I have never found a name for the shape, so I am writing to ask whether one exists. The shape is this: someone claims that some outcome — a disaster, a betrayal, an accident, a punishment — cannot be ruled out, that the odds may be minuscule or may be something no one could ever estimate, and that because the outcome would be so enormous, we are obliged to act now: to pay the cost, accept the restriction, or change our lives. What interests me is that the odds and the stakes move in opposite directions by design. The smaller the chance, the larger the harm the argument reaches for, so the case for acting never weakens however silly the chance becomes, and the arithmetic of multiplying how bad something would be by how unlikely it is never comes out small enough to ignore. I noticed it first in a friend's pitch for a supplement he sells, then in an argument about a new technology that supposedly could end everything, then in a charity appeal, and finally in an argument I caught myself making about a medical test. When I complained to another friend, he said the shape can be turned against anyone: he could demand my savings by threatening an unthinkably large harm that he cheerfully admits is unlikely, and by my own reasoning I would have to pay; then someone else could demand more; and so on without end. He thinks this destroys the whole way of arguing. I am not convinced, because I still believe a small chance of something genuinely catastrophic deserves serious weight, and that does not feel to me like the same mistake he is describing. I have heard the name Pascal's wager used for this general neighbourhood, but the wager seems to be one particular bet about one particular prize, whereas what I keep running into is a recipe that can be run on any threat or any promise, by anyone, over and over, with the stakes raised each time.

  So my question is whether there is an established name for this exact pattern, and if there is, I want considerably more than the name. I would like to know whether it is treated as a fallacy or as a genuine difficulty for anyone who reasons by weighing odds against stakes; precisely how it differs from the wager, from the precautionary idea that we should act against serious harms even when no probability can be attached to them, and from ordinary caution; and which ingredient is actually doing the work — the impossibility of estimating the odds, the unboundedness of the stakes, or the fact that someone is asking me for something. If there is no name for the exact thing, please say so plainly and then supply one, defined sharply enough that I can tell what falls inside it and what does not, with a case on each side of the boundary.
reasoning: |-
  Okay, the user has been collecting arguments that share a specific structure: someone claims that a catastrophic outcome can't be ruled out, no matter how small the probability, and because the stakes are so high, action must be taken. The user noticed this pattern in various contexts—supplements, technology risks, charity, and even their own medical test reasoning. 

  They're frustrated because there's no established name for this exact pattern. Pascal's Wager comes close but feels too narrow—it's fixed on one bet (belief in God), whereas the user observes a repeatable "recipe" applicable to any high-stakes scenario. Their friend criticizes the pattern as fundamentally broken, arguing it could justify endless demands ("pay me or face cosmic harm!"), but the user isn't fully convinced. They intuitively feel *some* low-probability catastrophes *do* merit action, but can't articulate why their examples feel different from their friend's reductio ad absurdum.  

  Three core tensions need unpacking:  
  1. **Probability vs. stakes**: The argument deliberately scales harm *up* as probability shrinks, making expected cost calculations useless.  
  2. **Epistemic opacity**: Often the probability isn't just small but *unknowable* (e.g., "AI could end everything—we can't quantify how!").  
  3. **Exploitability**: The pattern invites infinite extortion if universally applied ("Pay me now, or I'll invent a worse catastrophe!").  

  The user wants:  
  - A precise label (or a new one if none exists).  
  - Clarity on whether it's a fallacy vs. valid concern.  
  - How it differs from precautionary principles/Pascal.  
  - The critical ingredient making it fail (or not).  

  Deep down, they're wrestling with two legitimate instincts clashing:  
  - **Rational**: Extreme risks *should* be taken seriously (e.g., asteroid defense).  
  - **Skeptical**: Letting unquantifiable fears dictate action is paralyzing/exploitable.  

  Their frustration peaks at the friend's "infinite blackmail" critique—it feels logically airtight but morally unsatisfying. They suspect their medical test example *was* reasonable, but can't defend why. The unspoken ask: *"How do I tell when this argument is sincere vs. manipulative?"*  

  Pascal's Wager fails as a parallel because it's a one-time bet with (arguably) infinite payoff. The user's cases involve *repeatable*, *earthly* stakes that lack that metaphysical finality. Meanwhile, standard precautionary principles avoid demanding action *regardless of cost*—they usually imply proportionality ("better safe than sorry" assumes "sorry" is meaningfully worse than "safe").  

  The friend's "infinite regress" attack works because the user's pattern lacks:  
  - **Stakes anchoring**: Harm magnitudes are unbounded (no "worst possible thing" cap).  
  - **Probability floors**: No threshold where "too improbable to consider" kicks in.  
  - **Cost-benefit proportionality**: Demands don't scale to plausibility.  

  Yet dismissing *all* such arguments throws out baby (asteroids) with bathwater (supplement scams). The key is whether the threat is *actionable* and *coherent*. "AI extinction" is at least logically possible; "pay me or I'll telepathically explode the sun" isn't.  

  Proposed definition:  
  **Unbounded Catastrophe Argument (UCA)**  
  *Using an indefinite/improbable catastrophe with unbounded stakes to demand costly action, bypassing expected value by scaling harm inversely to probability.*  

  Boundary cases:  
  - **Inside UCA**: "Buy my supplement—someday it might prevent a pandemic!" (stakes inflated, probability vague).  
  - **Outside UCA**: "Get vaccinated—COVID has 1% mortality" (quantifiable stakes/probability).  
  - **Edge case**: "Invest in asteroid defense—statistically rare but stakes are planetary" (high stakes *but* probability is estimable; cost proportional).  

  Fallacy status: UCA is **epistemically vicious** when:  
  - Stakes are detached from reality (e.g., "if you don't pay me, quantum demons will torture you").  
  - Costs are non-negotiable ("sell everything *now*").  
  - No mechanism links action to harm reduction.  

  But it's **not fallacious** when:  
  - The threat is coherent (e.g., nuclear winter).  
  - Probability, while low, isn't *unknowably* tiny.  
  - Costs are proportional (e.g., 0.1% GDP for asteroid monitoring).  

  The wager differs fundamentally: Pascal stakes *everything* on one *unavoidable* gamble (death => judgment). UCAs are *serial, avoidable*, and often terrestrially exaggerated.  

  Ultimately, the user needs to spot **stakes inflation** + **probability neglect** + **demands without proportionality**. Their medical test example likely felt valid because: (1) test cost was low, (2) harm (missed diagnosis) was concrete, (3) probability wasn't *truly* infinitesimal (e.g., 0.1% vs. "one in a googol"). Their friend's extortion fails (2) and (3).
answer: |-
  Your description captures a distinct and pervasive argumentative pattern—one that straddles the line between rational precaution and potential manipulation. While it shares DNA with Pascal's Wager and precautionary reasoning, it is not identical to either. **There is no universally accepted name for this exact pattern**, but I'll define it precisely, label it, dissect its mechanics, and demarcate its boundaries.

  ---

  ### **The Pattern Defined & Named**  
  **Unbounded Catastrophe Argument (UCA)**  
  *An argument that demands immediate, costly action to avert a hypothetical outcome, where:*  
  1. **Probability is minimized or unquantifiable** (e.g., "cannot be ruled out," "unknown but nonzero").  
  2. **Stakes are maximized** (e.g., "existential catastrophe," "infinite harm").  
  3. **Action is framed as non-negotiable**, regardless of cost, because the product of stakes and probability (*expected value*) is claimed to be "infinite" or "intolerable."  
  4. **The "threat multiplier" is reusable**: Anyone can invoke a *new* catastrophe with higher stakes or lower probability to demand further action.  

  **Key Mechanism**: Probability (\(p\)) and stakes (\(s\)) are inversely manipulated to ensure \(p \times s\) (expected harm) remains subjectively "large enough" to justify *any* cost. This bypasses traditional cost-benefit analysis.  

  ---

  ### **Is It a Fallacy? A Genuine Problem?**  
  **It is both**:  
  - **Fallacious when**: Stakes are *detached from empirical plausibility*, probabilities are *knowably negligible*, or costs are *disproportionate*.  
  - **Genuine when**: Facing *coherent*, *actionable* threats with low-but-nonzero probability (e.g., asteroid defense).  

  The core flaw is **probability-stakes decoupling**: By making \(s\) arbitrarily large as \(p\) shrinks, UCA avoids falsifiability and enables extortion (as your friend demonstrated). Yet, dismissing *all* low-probability/high-stakes arguments is unwise (e.g., ignoring pandemic preparedness because \(p\) is 0.1% and \(s\) is 100M deaths).  

  **Why your friend's critique hits hard**:  
  - UCA's lack of **anchoring** (no upper bound on stakes, no lower bound on probability) creates infinite regress. If you pay him to avert his "unthinkable harm," I can demand more to avert a *worse* harm, ad infinitum.  
  - **Solution**: Legitimate precaution requires *grounded stakes* (e.g., "planetary extinction" is bounded; "infinite afterlife punishment" is not) and *actionable probabilities* (e.g., "based on observed data," not "could happen somehow").  

  ---

  ### **How UCA Differs from Neighboring Concepts**  
  | **Concept**               | **Key Difference from UCA**                                                                 |  
  |---------------------------|---------------------------------------------------------------------------------------------|  
  | **Pascal's Wager**         | Fixed stakes (infinite heaven/hell), fixed probability ("unknown"), one-time decision. UCA is *replicable and scalable*—new threats can be invented endlessly. |  
  | **Precautionary Principle**| Requires proportionality ("cost-effective measures") and plausibility. UCA ignores cost proportionality and inflates stakes. |  
  | **Ordinary Caution**       | Uses *estimable* probabilities and *bounded* stakes (e.g., "wear a seatbelt: 1% injury risk → 50% reduction"). UCA rejects quantifiable risk. |  

  ---

  ### **The Ingredient Doing the Work**  
  All three elements you named matter, but **unbounded stakes** are the linchpin:  
  - **Impossible odds estimation**: Allows \(p\) to be dismissed as "unknowable," freeing the arguer to amplify \(s\).  
  - **Unbounded stakes**: Permits infinite escalation (e.g., "If you think AI risk is bad, wait until you hear about my vacuum decay scenario!").  
  - **Asking for something**: Creates conflict of interest (e.g., your supplement-selling friend profits).  

  **Crucially**: UCA collapses when stakes are *capped* (e.g., "This medical test costs $10,000; worst-case undiagnosed illness risk is 0.001% and causes 5 years of suffering—max stakes = 5 life-years").  

  ---

  ### **Boundary Cases: What Is and Isn't UCA**  
  **Inside UCA** (your examples):  
  - **Supplements**: "This *might* prevent a *future pandemic*! Probability? Unknowable! Stakes? Millions of lives! Cost? $50/month!"  
  - **New Technology**: "This AI *could* end humanity. Can we rule it out? No! Must shut it down *now*—costs be damned!"  
  - **Friend's Extortion**: "Pay me your savings to avert my *invented catastrophe*. Unlikely? Sure! But stakes are *infinite suffering*!"  

  **Outside UCA**:  
  - **Pascal's Wager**: Stakes fixed (salvation/damnation), not reusable or scalable.  
  - **Grounded Precaution**: "Asteroid impact: \(p = 0.0001\%\), \(s = \text{extinction}\). Mitigation cost: $1B/year → Worth it." (Stakes bounded, probability estimable.)  
  - **Medical Test You Mentioned**: If you argued, "This test costs $200; chance of rare disease is 0.01%, but stakes are death → expected cost of skipping = 0.0001 × life value = $100 (if life valued at $1M) → test is rational," this is **not UCA**. Why? Stakes (death) are bounded, probability is quantifiable, and cost is proportional.  

  ---

  ### **A Sharply Defined Label**  
  Since no established term exists, I propose:  
  **Scalable Catastrophic Blackmail (SCB)**  
  *The use of unquantifiable probability and unbounded stakes to demand escalating costs, exploiting the expected-value formula’s breakdown under extreme parameters.*  

  **Why this fits**:  
  - "Scalable": Threats can be inflated endlessly.  
  - "Catastrophic": Stakes are maximized to dwarf costs.  
  - "Blackmail": Implies coercion via manufactured dread (your friend’s extortion).  

  **When to use it**: When the argument (1) lacks anchoring in evidence, (2) escalates stakes to avoid cost-benefit scrutiny, and (3) benefits the arguer.  

  ---

  ### **Conclusion**  
  Your pattern is **Unbounded Catastrophe Argument (UCA)** or **Scalable Catastrophic Blackmail (SCB)**. It is a fallacy when stakes are unmoored from reality or probabilities are negligibly small, but it exposes a genuine vulnerability in decision theory: how to weigh truly uncertain, high-impact risks. The critical failure mode is **infinite regress via stakes inflation**. Pascal’s Wager is a one-off instance; UCA is a reusable weapon. To counter it, demand:  
  1. **Bounded stakes** ("What is the *actual maximum harm*?"),  
  2. **Probability floors** ("Is there evidence \(p > 0.0001\%\)?"),  
  3. **Cost proportionality** ("Does the cost reflect \(p \times s\)?").  

  If any of these are indefensible, you’ve caught UCA in the wild.
