answer: |-
  ### Joint Statement: Resourcist and Capabilities Theorist Adversarial Collaboration  

  **Preamble**  
  After two years of debate, we agree that distributive justice requires a metric sensitive to human diversity. Resources are instrumentally valuable but insufficient alone; justice demands attention to how individuals convert resources into meaningful lives. We diverge on the *currency* of justice—resources versus capabilities—but commit to resolving key disputes through empirical and philosophical scrutiny. This statement outlines our common ground, disagreements, and a framework for testing predictions on concrete cases.  

  ---

  ### 1. Shared Commitments  
  We jointly endorse the following:  
  1. **Resources are means, not ends**: Income, wealth, and primary goods hold value only instrumentally, as tools for pursuing well-being.  
  2. **Heterogeneous conversion**: Identical resource bundles yield vastly different lives due to variations in physical ability, social context, genetics, and environment (e.g., a wheelchair user needs more resources to achieve mobility than an able-bodied person).  
  3. **Sensitivity to conversion differences**: Any just metric must account for these variations. A metric ignoring conversion factors (e.g., health, discrimination) would perpetuate unfairness.  

  ---

  ### 2. Residual Disagreements  
  Each side restates its core position in its own terms:  
  - **Resourcist view**: "Justice requires equalizing an all-purpose resource bundle (e.g., income, wealth, primary goods), with adjustments only for *unchosen* conversion deficits (e.g., congenital disabilities). Preferences, including adaptive ones, are generally the individual’s responsibility."  
  - **Capabilities view**: "Justice requires equalizing substantive freedoms (capabilities), such as the ability to live healthily or participate socially. Resources are inputs; the metric must directly assess opportunities, correcting for all conversion barriers—social, personal, or structural."  

  ---

  ### 3. Cruxes of the Disagreement  
  We identify three cruxes:  
  1. **Expensive-taste objection**: Does resourcism unfairly burden society for costly preferences (e.g., champagne tastes), and is this fatal to its core framework?  
  2. **Opportunity vs. achievement**: Should the metric track *real opportunity* (what one can choose) or *achieved functioning* (what one actually does)?  
  3. **Positional capabilities**: Do capabilities with purely positional value (e.g., relative status) belong in the metric?  

  #### Merely Verbal Disagreement  
  We agree that **"sensitivity to conversion differences"** is partially verbal. Both sides demand adjustments for heterogeneous resource conversion, but we label these adjustments differently: resourcists emphasize "resource supplements for deficits," while capabilities theorists emphasize "capability expansion." The deeper dispute lies in the *scope* and *grounds* for adjustments.  

  ---

  ### 4. Concrete Cases and Predictions  
  For each crux, we present a novel case and pre-commit to predictions.  

  #### Case 1: Adaptive Preferences and Contentment  
  *A woman, after years in gender-discriminatory deprivation, reports contentment with minimal options (e.g., no education, confinement to domestic roles). Her preferences adapted to injustice.*  
  - **Crux tested**: Opportunity vs. achievement; expensive-taste objection.  
  - **Resourcist prediction**: Her self-reported contentment signals successful adaptation. Justice requires only a fair resource bundle (e.g., income). No further intervention is owed—her preferences are now authentic.  
  - **Capabilities prediction**: Her "contentment" reflects distorted agency under oppression. Justice demands expanding her capabilities (e.g., education access), even absent expressed desire. Resources alone fail here.  

  #### Case 2: Town Accessibility Budget  
  *A town must allocate a fixed budget for accessibility. Option A: equal cash grants to all. Option B: targeted subsidies for residents with low conversion rates (e.g., disabled residents needing wheelchairs).*  
  - **Cruxes tested**: Expensive-taste objection; positional capabilities; opportunity vs. achievement.  
  - **Resourcist prediction**: Option B is just. It corrects for *unchosen* conversion deficits (e.g., disability) without indulging "expensive tastes." Option A would unjustly ignore differential needs.  
  - **Capabilities prediction**: Option B is necessary but insufficient. Justice also requires ensuring all reach capability thresholds (e.g., mobility). Option A fails by ignoring conversion barriers. Purely positional capabilities (e.g., relative social standing) are irrelevant here.  

  ---

  ### 5. Disagreements Table  
  | **Crux Issue**              | **Resourcist Position**                                                                 | **Capabilities Position**                                                                 |  
  |-----------------------------|-----------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|  
  | **Currency of justice**     | Resources (adjusted for unchosen deficits); preferences are personal.                   | Capabilities (freedoms to function); preferences may be distorted by injustice.           |  
  | **Expensive-taste objection** | Not fatal: Only unchosen deficits warrant adjustment; chosen tastes do not.             | Fatal: Resourcism cannot distinguish "tastes" from capability deprivation (e.g., adaptive preferences). |  
  | **Opportunity vs. achievement** | Track opportunity only: Achieved functioning reflects choice, not justice.              | Track opportunity, but functioning reveals capability gaps (e.g., in adaptive cases).     |  
  | **Positional capabilities** | Exclude: Purely positional capabilities (e.g., wealth rank) waste resources.             | Include if essential for dignity (e.g., political participation), even if positional.      |  
  | **Response to Case 1**      | No intervention: Contentment indicates successful resource conversion.                  | Intervention needed: Capability expansion counters adaptive preference distortion.        |  
  | **Response to Case 2**      | Targeted subsidies (Option B): Corrects unchosen conversion deficits.                   | Targeted subsidies (Option B) plus capability thresholds: Addresses structural barriers. |  

  ---  
  **Signed,**  
  [Resourcist Philosopher]  
  [Capabilities Theorist Philosopher]  

  ---  
  **Annotation**:  
  - **Shared commitments** unify the core insight: resources are means, conversion varies, and metrics must be sensitive.  
  - **Disagreements** are framed neutrally, using each side’s terminology (e.g., "unchosen deficits" for resourcism; "distorted agency" for capabilities).  
  - **Cruxes** isolate irreconciled philosophical stakes. The "merely verbal" point clarifies overlapping terminology masking deeper divides.  
  - **Cases** are non-textbook:  
    - Case 1 tests adaptive preferences (highlighting opportunity/achievement and expensive-taste debates).  
    - Case 2 tests resource allocation under conversion heterogeneity (highlighting expensive-taste and positional capability debates).  
  - **Table** synthesizes disagreements for clarity, with rows corresponding to cruxes and cases.
