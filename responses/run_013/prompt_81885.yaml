  We are drafting a joint statement for two philosophers: a resourcist and a capabilities theorist, after two years of debate and now an adversarial collaboration. The statement must include:

  1. A numbered section of claims both accept, including:
     - Resources matter only as means.
     - People convert the same resources into very different lives.
     - Any acceptable metric must be sensitive to those conversion differences.

  2. A section stating the residual disagreements, each phrased in wording its own side would accept.

  3. An identification of the cruxes (key points of disagreement), including:
     - Whether the expensive-taste objection is fatal to resourcism.
     - Whether the metric should track real opportunity or achieved functioning.
     - Whether capabilities whose value is purely positional belong in the metric at all.

  4. Explicitly state which part of the dispute is merely verbal.

  5. For each crux, supply a concrete case (not textbook) and record each side's prediction in advance. The two cases provided are:
     - A woman whose preferences adapted to deprivation and now reports contentment with a life of severely restricted options.
     - A town distributing a fixed accessibility budget either as equal cash grants or as targeted conversion subsidies.

  6. End with a disagreements table.

  Let's structure the joint statement accordingly.

  ---

  **Joint Statement: Resourcist and Capabilities Theorist Adversarial Collaboration**

  **Preamble**
  After two years of debate, we, the resourcist and the capabilities theorist, have engaged in an adversarial collaboration to clarify our agreements and disagreements. We present this joint statement to outline the common ground, the points of divergence, and the key cruxes that require further examination. We also propose concrete cases to test our predictions on these cruxes.

  **1. Shared Commitments**

  We both accept the following propositions:

  1.1. Resources, including income, wealth, and primary goods, are only of instrumental value. They matter as means to enable individuals to pursue their conceptions of the good life, but they are not valuable in themselves.

  1.2. Individuals vary in their abilities to convert the same bundle of resources into valuable outcomes. These differences arise from a multitude of factors, including but not limited to physical and mental health, social circumstances, environmental conditions, and personal characteristics.

  1.3. Any acceptable metric for assessing distributive justice must be sensitive to these interpersonal differences in conversion. A metric that fails to account for such variations would be blind to significant inequalities in the real opportunities and outcomes that individuals face.

  **2. Residual Disagreements**

  Despite the above agreements, we continue to hold distinct positions on the following:

  2.1. *Resourcist Position*: The proper currency of distributive justice is each individual's share of an all-purpose resource bundle (income, wealth, and primary goods), adjusted only for factors that are beyond individual control and that affect the conversion of resources into well-being, such as disabilities. We maintain that this approach provides a fair and objective basis for interpersonal comparisons and avoids the pitfalls of subjective assessments of well-being.

  2.2. *Capabilities Theorist Position*: The proper currency of distributive justice is the set of capabilities, i.e., the substantive freedoms that individuals have to achieve various functionings (beings and doings) that they have reason to value. We hold that resources are only one input, and that justice requires a direct focus on the real opportunities available to each person, which must account for the full range of conversion factors.

  **3. Identification of Cruxes**

  We have identified the following cruxes as central to our disagreement:

  3.1. *The Expensive-Taste Objection*: The resourcist holds that the objection (that resourcism unfairly requires society to subsidize individuals who have cultivated expensive tastes) is not fatal because resourcism can and should distinguish between preferences that are chosen and those that are unchosen (e.g., due to disability). The capabilities theorist holds that the objection is fatal because it exposes the inability of resourcism to adequately account for the fact that what matters is not resources but what people can actually do and be, regardless of the origin of the disadvantage.

  3.2. *Opportunity vs. Achievement*: The resourcist holds that the metric should track real opportunity (i.e., the set of options available to an individual) rather than achieved functioning (i.e., the particular choices an individual makes). The capabilities theorist holds that while capabilities (opportunities) are the proper focus, the metric must also be sensitive to the actual functionings in cases where the capability set is constrained by social and personal factors that lead to adaptive preferences, and that in some contexts, achieved functioning may be a necessary indicator of the capability set.

  3.3. *Positional Capabilities*: The resourcist holds that capabilities whose value is purely positional (i.e., valuable only because they confer relative advantage, such as being in the top 10% of income) should not be included in the metric because they do not contribute to absolute well-being and their inclusion would lead to an endless and inefficient race. The capabilities theorist holds that some positional capabilities (e.g., the ability to participate in social and political life on equal terms) are essential for justice and must be included, even if their value is relative, because they are fundamental to human dignity and equal citizenship.

  **4. Merely Verbal Disagreement**

  We agree that a part of our dispute is merely verbal: both sides use the term "conversion factors" but with different emphases. The resourcist typically focuses on a narrower set of conversion factors (such as physical disabilities) that are beyond individual control and for which society should compensate. The capabilities theorist uses a broader conception that includes social, environmental, and personal factors. However, both agree that conversion factors are critical and that they must be considered. The verbal aspect lies in the scope of what counts as a relevant conversion factor and the extent to which the metric should adjust for them.

  **5. Concrete Cases for Testing Cruxes**

  We propose the following two concrete cases (not textbook) to test our predictions on the cruxes:

  5.1. *Case of Adaptive Preferences (The Contented Deprived Woman)*:
     - **Description**: A woman, after years of living in severe deprivation (e.g., in an oppressive patriarchal society), has adapted her preferences. She now reports being content with a life that offers her severely restricted options (e.g., she cannot leave the house without a male relative, has no access to education, and is confined to domestic chores). She does not desire more. 
     - **Resourcist Prediction**: The resourcist would argue that if we provide her with an equal share of resources, she is then responsible for her choices. Her reported contentment is a matter of her preference, and justice does not require compensating for preferences that have adapted, as long as the initial resource distribution was fair. Thus, in this case, the resourcist would not advocate for additional resources or interventions to expand her capabilities beyond the resource bundle.
     - **Capabilities Theorist Prediction**: The capabilities theorist would argue that the woman's adaptive preferences mask an injustice. Her capability set is severely restricted, and her contentment is a result of unjust circumstances. Justice requires interventions to ensure she has the real opportunity to choose a wider range of functionings (e.g., by providing education, challenging gender norms, and ensuring legal rights). Merely giving her resources without addressing the conversion factors (e.g., social norms) would be insufficient.

  5.2. *Case of the Town's Accessibility Budget*:
     - **Description**: A town has a fixed budget to improve accessibility for its residents. They must choose between two policies: 
       - Policy A: Distribute equal cash grants to all residents.
       - Policy B: Use the budget to provide targeted subsidies for conversion aids (e.g., wheelchairs, sign language interpreters, assistive technologies) to residents whose conversion factors are unusually low (e.g., people with disabilities).
     - **Resourcist Prediction**: The resourcist would support Policy B because it compensates for unchosen disadvantages (like disabilities) that affect the conversion of resources into well-being. This approach ensures that all residents have a fair opportunity to convert their resource bundle into a decent life. The resourcist would argue that Policy A (equal cash) would be unjust because it ignores the extra needs of those with low conversion abilities.
     - **Capabilities Theorist Prediction**: The capabilities theorist would also support Policy B because it directly addresses the capability deficits of the disadvantaged. However, the capabilities theorist would go further: they would argue that even after such targeted subsidies, we must ensure that the entire set of capabilities is available. They might also note that if the budget is insufficient to provide basic capabilities for all, then the distribution must prioritize those with the greatest capability shortfalls. The capabilities theorist would reject Policy A as inadequate because it fails to account for the differences in individuals' abilities to convert cash into capabilities.

  **6. Disagreements Table**

  We summarize our key disagreements in the table below:

  | Issue | Resourcist Position | Capabilities Theorist Position |
  |-------|----------------------|-------------------------------|
  | **Currency of Justice** | An all-purpose resource bundle, adjusted for unchosen conversion disadvantages. | The set of capabilities (substantive freedoms) that individuals have to achieve functionings they value. |
  | **Expensive-Taste Objection** | Not fatal; can be addressed by distinguishing chosen vs. unchosen preferences. | Fatal; shows that resources are an inadequate proxy for what matters (capabilities). |
  | **Opportunity vs. Achievement** | Metric should focus on real opportunity (the resource bundle and the options it can buy). | Metric should focus on capabilities (opportunities) but must account for adaptive preferences by sometimes looking at functionings. |
  | **Positional Capabilities** | Should be excluded; they do not contribute to absolute well-being and lead to inefficiency. | Some must be included (e.g., for social participation) because they are essential for equality and dignity. |
  | **Response to Adaptive Preferences Case** | No extra compensation for adapted preferences; resource equality suffices. | Intervention needed to expand capabilities and counter adaptive preferences. |
  | **Response to Town Budget Case** | Support targeted subsidies for those with low conversion factors (e.g., disabilities). | Support targeted subsidies but also require ensuring a threshold level of capabilities for all. |

  **Conclusion**
  We present this statement as a foundation for ongoing dialogue and empirical investigation. By testing our predictions in concrete cases, we hope to advance the debate on distributive justice.

  Signed,
  [Resourcist Philosopher]
  [Capabilities Theorist Philosopher]

