  ### Key Improvements & Rationale:
  1. **Lexicon Design**: Words like "zuko" (animal vs. moving object) and "nil" (negation vs. quantification) create collisions where uncharitable manuals force beliefs like "statues are alive" or "food isn't touching mouths." The hidden informant goal (describe only living things) makes charity necessary for task completion.

  2. **Scene Pacing**: 
     - Training scenes (A1, A2, B1) take 15 mins. This is enough for linguists to build flawed manuals (most will have uncharitable "zuko = moving object" to fit A1). 
     - A2 dissent causes crisis at 40-min mark—forcing charity adoption to avoid attributing delusions (e.g., "they think statues breathe").
     - Held-out scene (taxidermy) at 65 mins concretely kills uncharitable manuals.

  3. **Holism Bite**: Worksheet requires T-theory rules (e.g., "‘nil S’ is true iff S is false"). When A2 dissent breaks initial manuals, revising "zuko" forces changes to "nil" and "remi" interpretations.

  4. **Stakes**: Scoring against unseen scenes (e.g., "dead moth beside live one") makes charity pragmatically decisive, not just elegant. Informants’ hidden goal incentivizes rigid truth-tracking.

  5. **Debrief Salvage**: 
     - **For Quinean drift**: Stress that charity transforms behaviorism into interpretation. Ask: "Why couldn't you retreat to 'stimulus meaning' after A2?"
     - **For compositionality**: Concede the finite lexicon is a proxy—highlight how rule-revision cascades mimic holism.
     - **For indeterminacy**: Use residual errors in winning manuals (e.g., mistaking "dry" for "brown") to show Davidson's "harmless" vs. Quine's "radical."

  This forces discovery: Students *cannot* complete the task without charity, and the held-out scene makes rival manuals fail—not just uglier, but unusable.
