prompt: |-
  I'm in a decision theory seminar and we've been doing superrationality — the idea that in a one-shot prisoner's dilemma against someone who reasons like you, you should cooperate, because you two will inevitably land on the same answer. For our end-of-term thing I have to write a joke about it, and I want it to actually land for people who've done the reading rather than being a generic "game theory is wild" gag — so the punchline should turn on something real, like the fact that it only bites when the other player shares your decision procedure and not merely your payoffs, or that it only gets a grip in symmetric cases.

  Can you write the joke, and then tell me which reading of the view the punchline commits me to — I know there's a live fight over whether it's really about causation versus correlation, and I don't want to accidentally joke myself into a position. Also say where the joke's reasoning is shakiest: what a causal decision theorist, or just a skeptic about superrationality, would say to show the punchline doesn't actually follow. If the reading I'm building on is the wrong one, say what I should build it on instead, and what would have to be true for your call to flip.
