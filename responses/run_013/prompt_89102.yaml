prompt: |-
  I want a consistency check on my position on risk before I commit it to a policy memo, and I would like you to be the auditor rather than the advocate. Here is where I have landed. (1) Where an activity threatens serious or irreversible harm, lack of full scientific certainty is no reason to postpone cost-effective protective measures. (2) The doing/allowing distinction carries no intrinsic moral weight: failing to prevent a harm I could have prevented is, other things equal, as bad as bringing it about. (3) In my own life I am an expected-value maximiser and will take any bet with positive expected value, however the odds are stacked, provided I can take it repeatedly. (4) For catastrophic or irreversible risks, however, I would use a maximin rule — choose the option whose worst outcome is least bad — rather than maximise expected value. (5) The burden of proof should rest on those who want to introduce a new technology, not on those who would restrict it. (6) I am unmoved by the complaint that precaution itself creates risks, that suppressing a technology may cost lives, since those counterfactual harms are just the sort of speculation the principle tells me to discount.

  Tell me which of these are genuinely in tension, which only appear to be, and rank the real tensions by severity rather than treating them all as equally bad. For each genuine tension, say which commitment has to give and what the cheapest repair would be, and what that repair costs. I am not attached to any particular one of the six, so do not assume I would sacrifice (1) or (3) rather than the rest, and be explicit about the pairs where a careless reader would cry contradiction but the commitments can in fact be held together. Please write in British English.
reasoning: |-
  Okay, the user wants me to audit their six risk-related principles for consistency before they finalize a policy memo. They've explicitly asked me to be an auditor rather than an advocate - meaning I need to objectively identify tensions without defending any position. 

  First, I need to unpack each of their six statements carefully:
  (1) Is essentially the precautionary principle - acting despite uncertainty when facing serious harm.
  (2) Rejects the moral distinction between action and inaction, which is quite consequentialist.
  (3) Reveals personal risk tolerance through repeated positive-EV bets.
  (4) Suddenly switches to maximin for catastrophes - a complete departure from EV.
  (5) Shifts burden of proof to tech proponents, aligning with precaution.
  (6) Dismisses counterfactual harms from precaution as "speculation".

  Hmm... the most glaring tension jumps out immediately: their embrace of expected value in (3) directly contradicts the maximin approach in (4) for catastrophes. They can't simultaneously be an EV maximizer and a maximin adherent when it matters most. The repair would require admitting maximin overrides EV in extreme cases - costing them theoretical consistency but gaining practical prudence.

  Then there's the sneaky conflict between (1)/(5) and (2). By putting the burden of proof on tech innovators (5), they're effectively treating technological inaction as morally neutral - but (2) explicitly says allowing harm is as bad as causing it. If they truly believe (2), shouldn't restricting potentially beneficial tech carry equal moral weight? This needs clarification about whether "allowing" applies to policy inaction.

  The (3)-(4) tension is more severe than the others because it's operational - they'll face concrete decisions where EV and maximin prescribe opposite actions. Whereas (1)/(5) vs (2) is more about philosophical framing. 

  Notably, (6) isn't inconsistent per se but reveals selective skepticism - they're willing to discount certain counterfactuals while relying on others for maximin. That's intellectually uncomfortable but not logically contradictory.

  For repairs: The EV/maximin conflict requires explicit hierarchy (maximin trumps EV). The burden-of-proof tension needs to specify that (2) applies to individual morality while (5) is institutional policy. Both cost some elegance but preserve core positions.

  Finally, I should flag that while (3) and (4) appear contradictory to a casual reader, they can coexist if framed as different domains (personal bets vs societal catastrophe). The real issue is when personal and policy decisions overlap.
answer: |-
  Your position contains both superficial and substantive tensions. Here’s an audit ranking genuine conflicts by severity (most to least critical), repairs required, and false alarms:

  ### ⚠️ **Ranked Tensions & Repairs**  
  **1. Tension between (3) and (4)**  
  - **Conflict**: (3) commits you to *expected-value (EV) maximisation* for all repeated bets, while (4) overrides EV with *maximin* for catastrophic risks. This creates operational inconsistency: maximin rejects positive-EV actions if the worst-case is unacceptable (e.g., a 0.1% chance of ruin).  
  - **Severity**: High. Direct contradiction in decision rules.  
  - **Cheapest Repair**: **Restrict (3)** to *non-catastrophic* contexts.  
    - *Cost*: Sacrifice universality in personal risk-taking. You’d need a threshold (e.g., "EV maximisation applies only when worst outcomes are reversible").  
    - *Alternative*: Abandon maximin (4) for a *catastrophe-adjusted EV* (e.g., fat-tailed distributions, convex utility functions). Higher intellectual cost.  

  **2. Tension between (2) and (5)**  
  - **Conflict**: (2) asserts that *failing to prevent harm = causing harm* morally. (5) places the burden of proof on *new technology proponents*, implicitly treating technological *inaction* as neutral. If restricting a tech risks counterfactual harms (e.g., delaying a vaccine), (2) implies this is as bad as actively causing harm, yet (5) discounts such harms.  
  - **Severity**: Moderate. Burden allocation in (5) clashes with moral neutrality of inaction denied by (2).  
  - **Cheapest Repair**: **Clarify (5)** as an *epistemic rule*, not a moral one. E.g.: "Lack of evidence of safety justifies restriction *until* counterfactual harms are *demonstrated* (not speculated)".  
    - *Cost*: Weakens (5)’s force by allowing evidence of forgone benefits to override precaution.  

  **3. Tension between (1) and (6)**  
  - **Conflict**: (1) endorses precaution despite uncertainty, while (6) dismisses risks from precaution itself as "speculation". But precautionary measures *can* cause verified harms (e.g., banning DDT increased malaria deaths). (6) risks dogmatism by ignoring empirical evidence of countervailing risks.  
  - **Severity**: Low-moderate. (6) overreaches by dismissing *all* counterfactuals, while (1) only rejects *uncertainty* as a barrier.  
  - **Cheapest Repair**: **Revise (6)** to: "Precaution’s counterfactual harms do not *automatically* override protective measures, but require equivalent evidence."  
    - *Cost*: Concedes that precaution can create measurable harms, forcing case-by-case trade-offs.  

  ### ✋ **False Alarms (Apparent Tensions)**  
  - **(1) vs. (3)**: No conflict. (1) governs *societal* risks under uncertainty; (3) governs *personal* risk with known probabilities.  
  - **(2) vs. (4)**: Compatible. Maximin (4) avoids worst outcomes; (2) ensures *omissions* enabling catastrophe are morally weighted.  
  - **(3) vs. (5)**: No clash. (3) is personal risk philosophy; (5) is a policy heuristic.  

  ### 🛠️ **Summary of Necessary Repairs**  
  | **Commitment** | **Required Change** | **Cost of Repair** |  
  |----------------|---------------------|---------------------|  
  | **(3)**        | Limit EV maximisation to non-catastrophic risks | Loses universality in personal risk-taking |  
  | **(5)**        | Accept evidence of counterfactual harms as valid | Weakens precautionary burden if harms are proven |  
  | **(6)**        | Acknowledge verifiable risks from precaution | Must weigh trade-offs, not dismiss counterfactuals |  

  ### 💎 **Final Recommendation**  
  - **Highest Priority**: Resolve (3)/(4) clash by adopting a **threshold rule** (e.g., "EV maximisation applies only below catastrophe thresholds"). This preserves (4)’s primacy for existential risks without abandoning (3).  
  - **Why This Order?** The (3)/(4) conflict threatens coherent action in high-stakes scenarios. Other tensions are resolvable through clarification.  
  - **Auditor’s Note**: Your framework is largely robust if amended. The deepest tension is between *instrumental rationality* (EV) and *non-consequentialist caution* (maximin) – a philosophical rift needing explicit hierarchy.  

  Would you like refinements to the repair strategies?
