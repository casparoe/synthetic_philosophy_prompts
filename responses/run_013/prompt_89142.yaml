  First, I need to recall related concepts. The user already knows about euphemism treadmill and concept creep, but those don't exactly fit. Euphemism treadmill is about word replacement for negative terms, and concept creep involves broadening definitions. The user's focus is on phrases losing their specificity to maximize endorsement.

