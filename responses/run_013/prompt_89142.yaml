  Looking into memetics and cultural evolution. Dawkins' memes and Blackmore's theories might apply. The idea is that phrases evolve to be more replicable, shedding contentious parts to spread wider. The mechanism here is cultural selection favoring high-fecundity variants. Ambiguity or vagueness makes a slogan more adoptable because it avoids disagreement.

  Also, considering communication theory. Strategic ambiguity allows groups with different motives to unite under the same banner. The phrase becomes a coalitional signal rather than a precise statement. This relates to the user's observation that the original users are seen as pedants—because the phrase's function has shifted from conveying meaning to signaling affiliation.

  The user might be interested in real-world examples. Like "social justice" starting with specific legal contexts and now being a broad term. Or "woke" evolving from awareness of racial injustice to a catch-all for progressive ideas. These examples show how dilution happens through overuse and broad application.

  They also mentioned the line between this phenomenon and ordinary meaning drift. Ordinary drift might lack the intentional or strategic element. Here, the dilution is almost tactical, to gain wider acceptance. It's accelerated by media and repeated use in varying contexts, stripping the original nuance.

  The user's deeper need might be understanding how language manipulation affects discourse. They might want tools to analyze political rhetoric or preserve precise meanings in debates. Recognizing this pattern could help in critically evaluating slogans and avoiding hollow endorsements.

  I should also consider if there's interdisciplinary overlap. Linguistics, sociology, political science all touch on this. Terms like "empty signifier" from Laclau in critical theory might apply, where a slogan becomes a vessel for diverse meanings. But that's more abstract; the user might prefer a more accessible term.

