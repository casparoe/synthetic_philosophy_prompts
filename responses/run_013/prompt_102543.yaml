prompt: |-
  My brother has bipolar I and just came out of a manic episode where he spent alot of money and drove his car into a ditch. Before he was discharged he signed a psychiatric advance directive, a Ulysses contract basically, saying that if he gets like that again he can be held and medicated even if he says no. He's stable now and wants to rip it up. I'm trying to help him think it through, and I've fallen down a rabbit hole on precommitment and constitutional entrenchment.

  So here's what I want from you. Not a reading list, not citations, I can't use those anyway. I want to know which open questions in this area actually matter most for someone designing or judging a real contract like his, and why. Rank them. I care about which questions are upstream of the others, which are tractable for a philosopher rather than a lawyer or a clinician, and what would move them up or down the list.

  A few things I keep getting stuck on, so maybe use them as test cases. First, the later self problem: when he wants to revoke, is that the same person who signed, or a different one, and does that even matter? Second, the difference between a contract that works by changing his incentives and one that works by changing what counts as a valid decision. The second seems creepier but maybe more effective. Third, the constitutional analogy: constitutions entrench things against future majorities, but they also have amendment procedures and courts. Does that map onto a psychiatric advance directive, or does the analogy break because there's no seperate institution to enforce it? Fourth, his actual contract has a clause where to revoke he has to wait 72 hours, talk to two people who knew him when he was manic, and then re-sign the revocation in front of them. Is that just a trick that presupposes his future self can't be trusted? What would a philosopher say the clause is doing?

  I'm not asking you to decide for him. I want the agenda: the two or three questions that, if someone settled them, would most change how these contracts should be written and enforced, and the ones that sound deep but don't actually change anything practical. Also tell me what would change your ranking, like if it turns out the later self's preferences are stable enough, or if advance directives turn out not to improve outcomes. Be concrete and a bit ruthless about what's overrated.
reasoning: |-
  Okay, the user's brother has bipolar I and recently signed a psychiatric advance directive (PAD), essentially a Ulysses contract, during a stable period after a manic episode. Now that he's stable again, he wants to revoke it. The user is trying to help him think through this decision and has delved into philosophical concepts like precommitment and constitutional entrenchment. They want to understand the key open questions that matter for designing or judging such a contract, ranked by importance, with a focus on what's upstream, tractable for philosophers, and what would change the ranking.

  First, I need to unpack the core issues. The user mentioned several test cases: the later self problem, incentive-based vs. validity-changing contracts, the constitutional analogy, and the specific revocation clause in his brother's contract. The main goal is to identify which philosophical questions have the most practical impact on how these directives are structured and enforced.

  Starting with the later self problem: Is the self during mania different from the stable self? This is crucial because if we consider them distinct, overriding the present self's wishes might be justified. But if they're the same person, revoking the directive is an autonomous choice. Philosophers like Derek Parfit's theories on personal identity could be relevant here. If empirical studies show that manic preferences are temporary and irrational, the case for upholding the directive strengthens. But if the stable self's decision-making is also flawed, that complicates things. This question is upstream because it affects the moral justification for enforcing the contract at all.

  Next, the mechanism of the contract: changing incentives vs. changing what counts as a valid decision. The user finds the latter "creepier." For example, a contract that adds a financial penalty for non-compliance works through incentives. But one that deems the person incompetent during mania changes the validity of their decisions. The latter is more effective but raises autonomy issues. Philosophers can analyze which approach better balances effectiveness with respect for persons. If evidence shows that incentive-based methods fail during crises, moving towards validity-changing mechanisms might be necessary. This is a key design question directly impacting how contracts are written.

  Third, the constitutional analogy. Constitutions entrench rules but have amendment processes and courts. PADs might lack a neutral enforcer, leading to self-policing issues. If the analogy holds, designing better amendment procedures (like the brother's 72-hour clause) could make PADs more legitimate. But if the absence of a separate institution breaks the analogy, then clauses must compensate for that. Philosophers can explore procedural justice here, but practical implementation might require legal structures. This matters for how revocation clauses are structured, but it's downstream because it assumes the contract is already justified.

  The revocation clause itself (72 hours, two witnesses) seems like a cooling-off period combined with external validation. Philosophically, it creates a procedural hurdle that leverages the opinions of others who've seen the manic self. It's a recognition that the current self's judgment might be clouded by recent stability. If studies show such clauses prevent impulsive revocations, they're useful. But they might infringe on autonomy. Philosophers could debate whether this is paternalism or a rational safeguard.

  Now, ranking the questions by impact: 

  1. **Later Self Problem**: This is foundational. If the manic self isn't considered the "real" self, enforcing the directive is more justifiable. Resolving this would guide when and how to override current refusals. If empirical data shows manic decisions are consistently harmful and reversible, this question becomes critical. If not, its importance drops.

  2. **Mechanism (Incentives vs. Validity)**: This determines the contract's design. If validity-changing is necessary for effectiveness, contracts must include competence assessments. Philosophers can debate the ethical implications, but this directly affects enforceability. If less restrictive alternatives work, this becomes less vital.

  3. **Constitutional Analogy**: Important for designing revocation procedures but secondary. Without resolving the first two questions, amendment processes are moot. If courts or third parties are needed, this moves up, but currently, it's more about implementation.

  The revocation clause is an application of these principles. It acts as a buffer against rash decisions, using social validation. Philosophically, it operationalizes the distrust of the future self's judgment during stability. If the later self problem is unresolved, such clauses are speculative. But if evidence supports their effectiveness, they become practical tools.

  Factors changing the ranking: 
  - **Empirical evidence on outcomes**: If PADs don't improve outcomes, all questions become moot. 
  - **Stability of preferences**: If manic preferences are stable during episodes, enforcing directives is harder to justify. 
  - **Effectiveness of alternatives**: If less restrictive measures work, the need for validity-changing mechanisms decreases.

  The user needs actionable insights, not citations. They want to know which debates actually influence real contracts. The later self problem is paramount because it underpins the moral authority of the directive. Without settling that, other design elements lack foundation. The mechanism question is next, as it shapes the contract's structure. The constitutional analogy and specific clauses are derivative, addressing implementation once the core justifications are established.
answer: |-
  Here's a ruthless prioritization of the philosophical questions that actually matter for designing/enforcing psychiatric advance directives (PADs), based on their upstream impact, tractability for philosophers, and practical consequences. I'll rank them, explain why, flag what would change the ranking, and address your test cases.

  ---

  ### **Top 3 Questions (Ranked by Impact on Real Contracts)**
  1. **What Makes a "Competent Self" for Precommitment?**  
     - **Why it's #1 (Upstream & Decisive)**:  
       This is the bedrock. If we can't define which version of your brother is "truly him" when making binding decisions, the entire contract rests on sand. Philosophers can tackle:  
       - *Epistemic criteria*: Does the manic self have distorted access to facts/values?  
       - *Authenticity*: Which self's choices reflect his "deep values" (e.g., survival, family, stability vs. euphoric grandiosity)?  
       - *Harm threshold*: Does the risk of irreversible harm (death, bankruptcy) justify overriding *any* contemporaneous refusal?  
     - **Practical Impact**:  
       Settling this defines when the PAD "triggers." If only the *stable* self can bind the *manic* self (not vice versa), revocation during stability must be allowed unless proven otherwise. No clarity here? Contracts default to legalism (e.g., "signed = valid"), risking tyranny or futility.  
     - **Moves Down If**: Empirical evidence shows manic selves *can* articulate coherent, stable preferences (unlikely), or if stable selves are *equally* irrational about their future needs (undermining all precommitment).  

  2. **Is the Mechanism About *Blocking* Decisions or *Guiding* Them?**  
     - **Why it's #2 (Design Core)**:  
       This isn't just "creepy vs. effective"—it's about what the contract *is*. Philosophers distinguish:  
       - *Incentive-based*: Adds friction (e.g., "If I refuse meds, my sister gets control of my savings"). Changes cost-benefit analysis.  
       - *Validity-based*: Alters legal/moral agency (e.g., "During mania, my 'no' is inherently invalid"). Changes the *rules* of decision-making.  
     - **Practical Impact**:  
       Validity-based mechanisms are stronger but require justifying why *this person* loses standing (see Q1). Incentive-based are "safer" ethically but fail if the manic self ignores consequences (e.g., spending everything). Contracts mixing both (like your brother's) need clarity on which is primary.  
     - **Moves Down If**: Data shows simple incentives (e.g., financial penalties) reliably prevent harm during mania, making validity-overrides unnecessary.  

  3. **Who Interprets and Enforces? (The Institutional Gap)**  
     - **Why it's #3 (Execution Over Ideals)**:  
       Constitutions have courts; PADs often have no neutral arbitrator. The "constitutional analogy" fails because your brother *is* the state, the electorate, and the judiciary. Philosophers can probe:  
       - *Procedural fairness*: What makes revocation/override procedures legitimate?  
       - *Epistemic humility*: Should enforcers (family, doctors) defer to the document or assess current capacity?  
     - **Practical Impact**:  
       Without an enforcer, the PAD is just paper. Contracts must design "checks" (e.g., witness requirements) that compensate for this gap—but those checks risk becoming paternalistic traps.  
     - **Moves Up If**: Courts routinely invalidate PADs due to no enforcement mechanism, forcing redesign.  

  ---

  ### **Lower-Priority Questions (Intellectually Deep, Less Practical)**
  - **The Later Self "Identity" Problem**:  
    Whether the stable and manic selves are "different people" is a red herring. What matters is *which self's decisions align with his enduring interests*. Parfit-style identity debates don't change contracts—functional criteria (harm, coherence) do.  
  - **Metaphysical Autonomy**:  
    "Does precommitment violate *true* freedom?" Interesting, but irrelevant if Q1 is answered. Real-world autonomy is always conditional (e.g., we ban suicide).  
  - **Perfect vs. Imperfect Rationality**:  
    If we demand "perfectly rational" selves for signing PADs, no one qualifies. Contracts must work with *good enough* rationality (e.g., "understands consequences").  

  ---

  ### **Your Test Cases via this Lens**
  1. **Later Self Problem**:  
     - Philosophers would say: Stop asking if it's a "different person." Ask: *"Which self's choices best reflect his core values and minimize irreversible harm?"* If the manic self consistently undermines his life projects (family, health), overriding it is defensible.  
  2. **Incentives vs. Validity**:  
     - His contract likely uses validity-change (it nullifies "no" during mania). The revocation clause (72h + witnesses) is incentive-based: it adds steps to deter impulsive revocation.  
  3. **Constitutional Analogy Breakdown**:  
     - Constitutions bind *collectives*; PADs bind *individuals* with no separation of powers. The revocation clause creates a pseudo-"amendment process" because there’s no court.  
  4. **The Revocation Clause**:  
     - **What a philosopher says it's doing**: Creating a "cooling-off period + social epistemology." The witnesses aren’t just gatekeepers—they provide evidence that his *current* desire to revoke aligns with his *enduring* self (e.g., "Is this revocation consistent with what he’d want when lucid?"). It’s a procedural solution to Q1.  

  ---

  ### **What Would Reshape This Agenda?**
  - **Game-Changer Evidence**:  
    If studies proved PADs *don't* improve outcomes (e.g., people with them still crash cars, or feel traumatized by overrides), Q1-3 collapse. We’d abandon precommitment.  
  - **Neurotech/Biomarkers**:  
    If we could objectively detect "impending mania," revocation could be locked out pre-crisis (making Q3 critical).  
  - **Legal Shifts**:  
    If courts started requiring "dynamic consent" (e.g., periodic re-signing), Q2 (mechanism) would dominate.  

  ---

  ### **The Ruthless Takeaway**
  For your brother: **Focus on Q1.** Ask him: *"When manic, do you still care about your core values (e.g., not bankrupting your family)? If not, should you trust that version of you to call the shots?"* If he says no, the contract stands. Everything else—incentives, witnesses—is scaffolding. Philosophers excel here because this isn’t about law or medicine; it’s about what constitutes a "self" we owe loyalty to. The rest is implementation.
