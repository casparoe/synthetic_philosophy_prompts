    - Measure = e + 2*m
    - Announce measure and winner.
    - Reveal goal and show that the team that minimized e won the measure but has low goal.

  - Round 4: Adversarial (15 minutes)
    - Teams write down a number s (security level) between 1 and 100.
    - True quality before adversary: 100 - |s - 50|   [so maximum 100 when s=50]
    - But there is an adversary: the other team. The adversary can reduce the true quality based on s:
        - If s >= 80, reduce by 30
        - If 50 <= s < 80, reduce by 10
        - If s < 50, reduce by 0
    - So final true quality (goal) = [100 - |s-50|] - reduction
    - Measure: s   [the number they chose]
    - Teams try to maximize s.
    - After submissions, the facilitator applies the adversary reduction.
    - Announce measure (s) and winner (highest s).
    - Reveal goal (final true quality) and show that the team with high s was penalized.

  Debrief (30 minutes):
  - Walk through each round and the failure mode.
  - Round 1: Regressional - the noise in the measure meant that optimizing the measure didn't fully optimize the goal.
  - Round 2: Extremal - when they pushed the number of widgets to the extreme (high n), the relationship between claimed quality and true quality changed (broke down).
  - Round 3: Causal - by allocating to marketing, they directly increased the measure but didn't affect the goal (effort). In fact, they cut the causal path from marketing to goal? Actually, in this setup, marketing doesn't cause goal. Only effort does.
  - Round 4: Adversarial - the other team actively exploited the gap between the measure (high security level) and the goal (actual security) by attacking when the measure was high.

  Now, what can't we reproduce? The extremal round might feel a bit artificial. Also, the adversarial round is simplified. We can't reproduce all nuances, but the core ideas are there.

  What will go wrong?
  - Round 1: Teams might not understand the noise. They might choose numbers and then be confused by the results. Fix: explain the noise process clearly and show the dice rolls.
  - Round 2: Teams might not push to n=10. Some might choose n=5. Then the failure doesn't happen. Facilitator can hint that they should try to maximize the measure and see what happens when they go to the extreme.
