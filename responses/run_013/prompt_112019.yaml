  - Each team produces 5 outputs. Each output is a number (say between 1 and 100). The goal is the average of the outputs. The measure they are given is a noisy version of the goal. Specifically, for each output, the facilitator adds a random error (say ±10) to the output and then averages the noisy outputs. But that's complicated.

