  ### Goodhart's Law Game: "Proxy Pursuit"

  #### Overview
  A fast-paced, multi-round game where two teams compete to optimize a "proxy" measure (e.g., widget quality scores) while unknowingly triggering Goodhart failure modes. Each round escalates by fixing the prior failure but introducing the next, forcing players to experience regressional, extremal, causal, and adversarial failures. Teams earn points (candy) for winning rounds via the proxy, but the true goal is revealed afterward. Total time: 85 minutes.

  ---

  ### Materials (All Common Items)
  - **Paper & pens** (for team submissions)
  - **Dice** (2 six-sided dice; use phone apps if unavailable)
  - **Whiteboard** (to display scores/round rules)
  - **Candy/tokens** (prizes; ~20 pieces)
  - **Timer** (phone or watch)

  ---

  ### Setup (5 mins)
  - Split into **2 teams** (7 players each). 
  - Assign roles:  
    - **Engineer** (argues about rules; ensures team consensus).  
    - **Recorder** (writes submissions).  
    - *Others*: Strategists.  
  - Explain: *"Your team manufactures widgets. Each round, submit values to maximize your proxy score (e.g., total output). The highest proxy wins candy. True goal = widget quality, revealed after scoring."*

  ---

  ### Round Structure (4 rounds × 15 mins each; 60 mins total)
  **Round 1: Regressional**  
  - **Rule**: Submit **5 numbers (1-100)**. Proxy = *average of numbers + random noise*. True goal = *actual average*.  
  - **What players do**: Teams pick high numbers (e.g., all 100s).  
  - **Resolution**:  
    - Facilitator rolls dice for each team:  
      - *Die 1: Noise per number* (1–2: −10, 3–4: 0, 5–6: +10).  
      - *Die 2: Extra noise* (1–3: −5, 4–6: +5) added to final average.  
    - Calculate proxy = (sum of numbers with individual noise)/5 + Die 2 noise.  
    - **Failure**: Proxy ≠ true goal. Noise makes high-number teams lose (e.g., true avg=100, proxy=92 after negative noise).  
  - **Goodhart mode**: Regressional (noise dominates selection).  
  - **Why it shows up**: Teams optimize a noisy proxy, selecting for randomness.

  **Round 2: Extremal**  
  - **Rule**: Submit **quantity (1-10 widgets)** and **quality per widget (1-100)**. Proxy = *total quantity × quality*. True goal = *average quality*.  
  - **What players do**: Teams maximize total (e.g., 10 widgets at 100 quality).  
  - **Resolution**:  
    - True goal = quality if ≤5 widgets; quality × (5/quantity) if >5.  
    - **Failure**: High-quantity teams crash (e.g., 10 widgets at 100 → proxy=1000, true goal=50). Low-quantity wins goal (5 at 100 → goal=100).  
  - **Goodhart mode**: Extremal (pushing to untested extremes breaks correlation).  
  - **Why it shows up**: At high quantities (e.g., >5), quality degrades—unseen in Round 1’s fixed-size samples.

  **Round 3: Causal**  
  - **Rule**: Allocate **100 effort points** between:  
    - **Engineering (E)** = direct quality.  
    - **Marketing (M)** = hype.  
    Proxy = *E + 2M*. True goal = *E*.  
  - **What players do**: Teams dump points into M (e.g., E=0, M=100 → proxy=200).  
  - **Resolution**:  
    - Proxy = E + 2M. True goal = E.  
    - **Failure**: High-M teams win proxy but have goal=0. High-E teams lose proxy (e.g., E=100, M=0 → proxy=100).  
  - **Goodhart mode**: Causal (proxy cuts causal path to goal).  
  - **Why it shows up**: Marketing inflates proxy without affecting true quality.

  **Round 4: Adversarial**  
  - **Rule**: Submit a **security score (1-100)**. Proxy = *security score*. True goal = *50 - |security - 50|*.  
  - **What players do**: Teams pick high scores (e.g., 100).  
  - **Resolution**:  
    - Opposing team acts as **adversary**: Reduces true goal if security >50.  
      - *Security 51-80*: Subtract 10 from goal.  
      - *Security 81-100*: Subtract 30.  
    - **Failure**: High-security teams lose goal (e.g., security=100 → goal=0 after penalty).  
  - **Goodhart mode**: Adversarial (active agents exploit proxy-goal gap).  
  - **Why it shows up**: Adversary punishes over-optimized proxies.

  ---

  ### Debrief (20 mins)
  Map game moments to Goodhart modes:  
  1. **Regressional**: *"Round 1’s dice rolls added noise—your high numbers lost to randomness. Fix: Reduce noise (e.g., better measurement)."*  
  2. **Extremal**: *"Round 2’s high quantity broke quality. Fix: Test proxies at extremes."*  
  3. **Causal**: *"Round 3’s marketing hacked the proxy. Fix: Align incentives with causal paths."*  
  4. **Adversarial**: *"Round 4’s adversary exploited high security. Fix: Make proxies robust to gaming."*  

  **Key takeaway**: Each failure needs a different fix. Conflating them (e.g., treating regression as adversarial) backfires.

  ---

  ### Predictable Failures & Fixes
  - **What goes wrong**:  
    - *Round 1*: Teams protest "unfair" noise.  
    - *Round 2*: Teams avoid high quantities, missing extremal failure.  
    - *Round 4*: Adversary under-penalizes; sabotage feels artificial.  
  - **How to fix**:  
    - Pre-roll dice for Round 1 noise to save time.  
    - Force Round 2 extremes: *"What if you make 100 widgets?"*  
    - In Round 4, let adversaries invent penalties (e.g., *"Explain how you’d hack this widget"*).  

  ---

  ### What the Game Can’t Reproduce
  - **Causal mode**: Real-world causal chains are more complex (e.g., multi-step paths). Facilitator must clarify: *"In practice, proxies often sit on causal paths—hacking them severs the link to the goal."*  

  ---

