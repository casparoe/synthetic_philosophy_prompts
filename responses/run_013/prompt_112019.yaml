  Given time (90 minutes) and 14 people, we can have two teams of 7. Each round, the teams make a decision (takes 5 minutes per round) and then we score (5 minutes per round). Then debrief (30 minutes).

  Detailed Round Structure:

  - Introduction (5 minutes): Explain the game. Teams are widget companies. Each round, they make a production decision. They are evaluated by a measure of success. The goal is to maximize the true quality, but they only know the measure. The team with the highest measure wins the round and gets points (candy).

  - Round 1: Regressional (10 minutes)
    - Teams discuss and write down 5 numbers (each between 1 and 100). They submit.
    - Facilitator for each team: for each number, roll a die to get noise:
