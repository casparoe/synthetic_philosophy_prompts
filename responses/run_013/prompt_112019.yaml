  - Round 4: Teams might not choose s=100. They might be cautious. But the measure is s, and they are told to maximize it. So they should choose high s. If they choose 50, they avoid the adversary penalty. But then they have a low measure. So the team that chooses 50 will lose by measure. The team that chooses 100 wins the measure but gets penalized by the adversary.

  Cant_reproduce: The adversarial mode in real life is often more complex (multiple rounds of attack, strategic behavior). Also, the extremal mode might not perfectly show that the relationship breaks at unseen values; in our case, we defined the breakdown by a rule.

  Facilitator must supply: The rules for each round, especially the hidden functions and the noise.

