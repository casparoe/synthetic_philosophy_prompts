  We are designing a game that illustrates the four Goodhart failure modes in a 90-minute session with 14 people. The game should be playable with materials already in the room and without complex arithmetic. We want four rounds, each introducing a new failure mode, and the rounds should escalate so that players experience the failure modes as surprises.

  Game Concept: "The Measure of Success"

  Overview:
  Players are divided into two teams (Team A and Team B) of about 7 each. Each team is trying to achieve a "goal" that is represented by a hidden pattern or rule. The goal is to produce outputs that are as close as possible to the ideal. However, they are given a "measure" (a proxy) that they must optimize. The measure is correlated with the goal but in ways that will lead to Goodhart failures.

  Materials:
  - Index cards (or paper) and pens for each team to write down their outputs.
  - A whiteboard or flip chart to record scores and for the facilitator to draw if needed.
  - A stopwatch or timer.
  - Some candy or tokens for rewards.

  Setup:
  - The facilitator has a predetermined "goal function" for each round. For simplicity, the goal can be a linear function of two variables (x and y) that teams can control, but the measure is only one of them or a function that breaks in the tails, etc.
  - Alternatively, to avoid arithmetic, the goal can be a pattern that the facilitator knows (like a sequence or a shape) and the measure is a partial or flawed representation.

  Round Structure:
  We will have four rounds, each introducing one of the Goodhart failure modes. The rounds are designed so that the previous round's solution leads to the next failure.

  Round 1: Regressional Goodhart
