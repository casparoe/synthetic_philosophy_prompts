  ### How to Run Smoothly
  - **Prep**: Pre-roll Round 1 noise. Write round rules on the whiteboard.  
  - **Pacing**: Strict 12-min rounds (7 min discuss, 3 min resolve, 2 min reveal).  
  - **Surprise**: Don’t preview failure modes—let teams "solve" one round just to fail the next.  
  - **Win**: Teams will gasp when extremal/causal failures hit. The adversarial round sparks loud debates—lean in!  

  This game makes Goodhart visceral. Players leave seeing proxies as landmines, not shortcuts.
