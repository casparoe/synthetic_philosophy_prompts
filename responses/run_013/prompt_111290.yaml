prompt: |-
  I teach a seminar on Buddhist ethics and consequentialism, and I keep losing the same argument in office hours. My students want to say that once you strip off the cosmology, the whole tradition is just consequentialism with nicer branding: minimize suffering, maximize welfare, done. The colleague in the next office over insists it's virtue ethics, because the precepts are training rules aimed at character rather than a calculus. I think they're both wrong, but every time I try to say what the third thing is I end up gesturing at compassion and then trailing off, which is not a good look in front of grad students. So here is what I actually think about a pile of cases, and I want you to tell me what principle, if anything, they add up to.

  The classic bodhisattva ship-captain case: a captain learns that a passenger intends to murder the five hundred merchants aboard, and out of compassion he kills the man himself rather than warn anyone. I think that's permitted, and maybe even what a bodhisattva ought to do; I don't think he violates the precept against killing, though I do think he takes on something heavy. Now a structurally similar one: a soldier shoots an enemy sniper who is about to fire into a crowd of civilians. I think that's permitted too, but I feel much worse about it, and I'd resist calling it an act of compassion. Then the footbridge case — shoving a large man off a bridge to stop a runaway cart and save five — I think that's flatly forbidden, arithmetic be damned. A monk lies to a hunter about which way the deer went: fine, no problem, no bad karma that I can see. A doctor lies to a dying patient about the prognosis to spare them fear: wrong, or at least not obviously fine, even though it's a compassionate lie with good consequences. Withdrawing a ventilator from a patient who won't recover, at the family's request: fine. Giving that same patient a lethal injection at their own request: not fine, and I can't defend the distinction by outcomes, since the outcomes are identical. Culling a deer herd to head off mass starvation: against it, though the consequentialist case is honestly decent. And a bodhisattva who does the externally right act while quietly preening about how compassionate he is — I think that's worse than the same act done without the preening, which is a strange thing for a consequentialist to have to say.

  A case I keep going back and forth on: a politician who could secretly have a genocidal leader assassinated, ending a war, with near-certainty it would work and near-certainty no one would ever know. My gut says no, but my gut says yes to the ship captain, and I genuinely can't tell you what the difference is supposed to be. So: is there a principle that gets all of this, or close? I suspect it needs at least three moving parts — something about the agent's intention, something about what the act does to the victim's own karmic trajectory, and something about not using anyone merely as a means — but I want you to tell me whether those clauses are doing real work or whether I'm just patching. State the principle as precisely as you can, tell me what it predicts for a case I haven't listed (specifically: killing one person to save five when the one is a fully informed, willing volunteer — I want your verdict on that), and be honest about which of my verdicts the thing forces me to abandon. If the cleanest version has to sacrifice the ship-captain case, say so and tell me whether I should accept that. And if my colleague is right that this is virtue ethics in robes, or the students are right that it's consequentialsim, say that too — but only if the cases actually support it, not because those are the two familiar boxes.
reasoning: |-
  Okay, let me start by really understanding what this professor is struggling with. They teach Buddhist ethics and keep getting stuck in arguments with students and colleagues. The students think it's just consequentialism with a nice label—minimize suffering, maximize welfare. The colleague argues it's virtue ethics focused on character development through precepts. But the professor feels both are wrong and can't articulate the third option, especially when discussing specific cases.

  First, I need to look at all the cases they provided. The ship-captain kills a would-be murderer to save 500. The professor thinks it's permitted, even compassionate, without violating the precept. Then there's the soldier shooting a sniper—similar structure but feels different, less compassionate. The footbridge case (pushing one to save five) is forbidden. Lying to a hunter is fine, but lying to a dying patient isn't. Withdrawing life support is okay, but lethal injection isn't, even with the same outcome. Culling deer herds is against, despite good consequences. Preening about compassion makes an act worse. The politician/assassination case is a toss-up, similar to ship-captain but gut says no.

  The professor suspects three elements: intention, karmic trajectory, and not using others as means. They want a principle that covers these cases, tested with a new case of killing a willing volunteer to save five.

  So, what's the underlying principle in Buddhist ethics? The Five Precepts are foundational, but they have exceptions, especially in Mahayana with the bodhisattva ideal. Compassion (karuṇā) and wisdom (prajñā) are key. But how do they interact in these dilemmas?

  Looking at the ship-captain case: killing is allowed because it prevents greater harm, motivated by compassion. The captain accepts karmic burden. In the soldier case, similar act but feels less compassionate—maybe because of the context of war, intention might include defense rather than pure compassion. Footbridge is using someone as a means, which violates their autonomy and karmic path. 

  Lying to the hunter: saves a life, no harm to hunter's karma. Lying to dying patient: interferes with their process of facing death, affecting their karmic growth. Withdrawing ventilator allows natural death, while lethal injection actively kills, altering karma. Culling deer: active killing disrupts natural karma, even if it prevents suffering. Preening shows selfish intention, which taints the act.

  For the assassination case, why the hesitation compared to ship-captain? Maybe because the politician's act is secretive, lacks bodhisattva's compassionate intention, or involves deception. The volunteer case: killing a willing person to save others. If the volunteer is making a sacrifice, is that permissible? In Buddhism, self-sacrifice might be seen as meritorious, but actively killing them could still be problematic because it involves taking life, which has karmic consequences for both parties.

  Putting it together: the principle might center on the nature of the act (active vs. passive), the intention behind it (selfless compassion vs. ego-driven), and the effect on others' karma (not obstructing their path). Also, using someone as a means is forbidden because it disrespects their inherent Buddha-nature and disrupts their karma.

  So the principle could be: "Act only in ways that arise from non-attached compassion, minimize direct harm to beings' karmic trajectories, and never instrumentalize a sentient being."

  Testing this: Ship-captain—compassionate, prevents mass murder, but karmic burden on captain. Soldier—similar but context of war might introduce attachment (defense, duty) making it less pure. Footbridge—instrumentalizing the man, so forbidden. Hunter lie—prevents harm, no karma obstruction. Patient lie—obstructs patient's facing death. Withdrawing ventilator—allowing natural death vs. active killing (lethal injection). Culling—active harm, disrupts karma. Preening—selfish intention worsens the act. Assassination—secretive, possibly attached to outcome, instrumentalizing the leader. Volunteer case—if willing, not instrumentalized, but killing still incurs karma; maybe permissible if done with pure compassion, but the act itself is still killing.

  But the lethal injection vs. withdrawing care has identical outcomes, yet different judgments. The distinction is in the act: one is allowing natural death (karmically neutral), the other is actively causing death (negative karma). So the principle must include the means—active harm vs. allowing natural processes.

  Refining: "Minimize active harm to sentient beings' karmic trajectories through acts arising from non-attached compassion, never reducing beings to mere means."

  Volunteer case: killing a willing person. If it's truly self-sacrifice, the volunteer's intention might reduce negative karma, but the killer still incurs karma. However, in bodhisattva ideals, self-sacrifice is praised. But the act of killing is still problematic. Maybe it's conditionally permissible if it's the only way and compassion is genuine.

  Is this virtue ethics? The focus on intention and character (compassion, non-attachment) suggests virtue ethics, but the karmic consequences add a teleological element. Yet, it's not consequentialist because outcomes aren't the only measure; the act's nature and intention matter more. So it's a hybrid, but distinct.

  The professor might need to accept that the soldier and ship-captain differ in intention purity. Or that the assassination is wrong because of secrecy, implying attachment or lack of accountability. The principle holds, but some cases might need re-evaluation. For example, maybe the soldier's act is permissible if done with pure compassion, but the professor's discomfort is due to contextual factors like militarism.

  In the end, the core is compassionate intention, avoiding instrumentalization, and minimizing karmic disruption. This isn't neatly consequentialist or virtue ethics but a unique blend centered on interdependent origination and karma.
answer: |-
  After mapping your case judgments against core Buddhist ethical frameworks—particularly the Mahayana bodhisattva tradition—I propose the following principle that integrates intention, karmic interdependence, and non-instrumentalization:

  **Principle:**  
  *Act only in ways that (a) arise from non-attached compassion (karuṇā), (b) minimize direct harm to the karmic trajectory of sentient beings, and (c) never reduce a sentient being to a mere means, especially when this obstructs their capacity for awakening (buddha-nature).*

  ### How This Explains Your Cases:
  1. **Bodhisattva Ship-Captain**:  
     - **Permitted** under (a) and (b): Motivated by pure compassion to prevent mass murder, killing the passenger may spare him greater negative karma (by averting his intended crime). The captain accepts karmic burden *without self-interest*, aligning with bodhisattva ethics.  
     - **Why not consequentialism?** The arithmetic isn’t decisive; a robber killing one to save five would be wrong. The act’s permissibility hinges on the captain’s role (karmic responsibility for passengers) and the victim’s intent (already karmically "bound" to violence).

  2. **Soldier Shooting Sniper**:  
     - **Permitted but uneasy** due to (c): Though (a) and (b) may apply (preventing civilian deaths), the soldier likely instrumentalizes the sniper as a "threat to eliminate." Unlike the ship passenger (actively creating harm), the sniper may be a conscripted pawn—their karmic potential isn’t inherently corrupted. Your discomfort reflects this violation of (c).

  3. **Footbridge Case**:  
     - **Forbidden** by (c): Shoving the man reduces him to a speedbump. Even with good consequences, this actively derails his karmic path (e.g., he might have achieved awakening in his next breath). Violates all three clauses.

  4. **Monk Lies to Hunter**:  
     - **Fine** under (b) and (c): The lie spares the deer’s life *and* the hunter’s karma (preventing murder). No one is instrumentalized; the hunter’s path isn’t obstructed (he remains free to choose non-harm later).

  5. **Doctor Lies to Dying Patient**:  
     - **Wrong** due to (b) and (c): Robs the patient of agency to confront suffering—a key aspect of karmic growth. Instrumentalizes their ignorance for "comfort," obstructing potential awakening at death. Consequentialist benefits are secondary.

  6. **Ventilator Withdrawal vs. Lethal Injection**:  
     - **Distinction lies in (b)**: Withdrawing support allows natural karma to unfold (no *active* harm). Lethal injection directly severs the patient’s karmic trajectory. Identical outcomes are irrelevant; Buddhist ethics prioritizes the *nature of the act* over results.

  7. **Culling Deer Herd**:  
     - **Against** per (b): Actively killing beings to "prevent future suffering" arrogates karmic control. Starvation is natural law; intervention disrupts collective karma. Bodhisattvas would likely aid *all* beings impartially (e.g., moving deer, finding food).

  8. **Bodhisattva Preening**:  
     - **Worse** due to (a): Taints compassion with self-cherishing. Consequentialism can’t explain why identical acts differ morally based on internal state—but virtue ethics *can*. This supports your colleague’s view... partially.

  9. **Assassinating a Genocidal Leader**:  
     - **Forbidden** by (c) and (a): Unlike the ship captain (who prevents *imminent*, specific harm by someone *in his care*), assassination instrumentalizes the leader as a "problem to remove." Secrecy implies attachment to outcome over process. May also disrupt the leader’s latent buddha-nature.

  ---

  ### Test Case: **Killing a Willing Volunteer to Save Five**  
  - **Verdict: Permitted, but karmically risky.**  
    - (a) If motivated by genuine compassion (e.g., volunteer is a bodhisattva accepting sacrifice).  
    - (c) Not instrumentalizing: Volunteer’s autonomy is respected; their choice may even *advance* their karma (selfless giving).  
    - **But**: The killer still incurs negative karma for taking life—*unless* their intention is utterly pure (rare). The volunteer’s consent mitigates but doesn’t erase this.  

  ---

  ### What You Must Abandon:  
  - **The Soldier Case**: Your principle forces you to either:  
    (1) Reject it as impermissible (aligning with assassination verdict), or  
    (2) Accept it *only* if the sniper’s karmic corruption is explicit (e.g., he’s a zealot chanting vows to kill civilians).  
    - **Recommendation**: Abandon universal permissibility. Context matters—soldiers operate in samsaric systems that cloud compassion. Your unease signals a violation of (c).

  - **Ship-Captain Consistency**: If assassination is forbidden, you must defend why the ship case differs. Argue: The passenger’s intent is *immediate* and *karmically active*; the captain acts within a karmic relationship (responsibility for all aboard). The politician lacks this directness.

  ---

  ### Is This Consequentialism or Virtue Ethics?  
  - **Neither exclusively—it’s a hybrid with Buddhist metaphysics**:  
    - **Virtue Ethics (40%)**: Emphasis on intention (karuṇā), character (non-attachment), and precepts as training aligns with your colleague. Preening is worse because virtue ethics cares about moral psychology.  
    - **Consequentialism (30%)**: Minimizing suffering matters, but *how* you minimize it is constrained by karma and non-instrumentalization.  
    - **Buddhist Distinctiveness (30%)**: Karmic trajectory (b) and buddha-nature (c) are non-negotiable. You can’t "strip off cosmology" without gutting the ethic—the precepts aren’t just rules but reflections of dependent origination.  

  ### Final Refinement of Principle:  
  > *"An act is ethical only if it:  
  > (1) Originates in compassion free from self-grasping;  
  > (2) Causes the least *active* disruption to the interdependent karmic unfolding of sentient beings; and  
  > (3) Honors all beings as ends-in-themselves, never subordinating their capacity for awakening to external goals."*  

  This preserves 8/9 of your verdicts (soldier case revised), explains your politician hesitation, and answers the grad students: No, you can’t reduce karma to utility—or the bodhisattva path to arithmetic. The "third thing" is karma’s non-dual weave of act, intent, and consequence. When you trail off at "compassion," add: "...but only compassion that sees emptiness." That’ll buy you time.
