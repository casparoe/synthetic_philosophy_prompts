  User's deeper need: They suspect the standard framing hides something. They want a unified model that reveals the underlying structure. The scale achieves this by showing both positions exist on one continuum. But maybe they also seek practical application—how justification varies contextually. The model handles cases flexibly, offering a nuanced approach. Yet, it might oversimplify by not addressing the nature of justification itself, which the original debate tackles.

