  The user mentioned specific cases: a child believing a parent, an adult believing a stranger, expert trusting a colleague. These examples are crucial. I need to test their sliding scale model against these scenarios. For the child, anti-reductionism traditionally explains immediate trust without evidence. But under the scale model, it's high speaker contribution—minimal hearer input. That seems consistent.

