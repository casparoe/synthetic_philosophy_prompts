answer: |-
  Your reframing is genuinely illuminating—it dissolves the false binary and reveals the core dynamic obscured by the traditional reductionism/anti-reductionism dichotomy. Here's a breakdown of what's at stake, how your scale clarifies it, and where it excels (and stumbles):

  ### The Core Issue: What's Really at Stake
  1.  **Nature of Testimonial Justification:** Is testimony *sui generis* (like perception/per anti-reductionism), where simply understanding an assertion grants prima facie justification? Or is it *derivative* (per reductionism), requiring justification from other sources (perception, memory, inference)?
  2.  **Burden of Proof:** Who bears the justificatory burden? Anti-reductionism: The hearer is entitled to believe *unless* there are defeaters. Reductionism: The hearer must *positively establish* the speaker's reliability for justification.
  3.  **Epistemic Autonomy vs. Social Dependence:** Reductionism emphasizes individual reason. Anti-reductionism highlights our essential dependence on others for knowledge.

  ### Your Reframing: The Speaker/Hearer Contribution Scale
  You propose treating the hearer's justification (J) as:
      **Total J = (Contribution from Speaker's Reliability/Competence) + (Contribution from Hearer's Positive Reasons/Background Knowledge)**
      *   **Anti-Reductionism:** Maximizes speaker contribution. Minimal (often zero) hearer contribution required *initially*. Justification is "inherited" directly upon competent reception. Defeaters trigger the need for hearer contribution.
      *   **Reductionism:** Minimizes speaker contribution. Significant hearer contribution required *initially*. Justification is "constructed" by the hearer using other sources to verify reliability. The speaker's utterance is just evidence to be assessed.

  **The Key Insight:** The debate isn't primarily about the *kind* of justification (both sides agree testimony *can* provide justification), but about the **initial default position** and the **location of a threshold** along this scale:
  *   **Where is the "default starting point"?** Anti-reductionism places it near maximum speaker contribution. Reductionism places it near minimal speaker contribution.
  *   **How much hearer contribution is *mandatory* upfront?** Anti-reductionism says near zero; reductionism says substantial.
  *   **Is speaker contribution *sufficient alone* for minimal justification?** Anti-reductionism says yes (absent defeaters); reductionism says no.

  ### Illumination vs. Relabeling
  This is **genuinely illuminating**, not mere relabeling:
  1.  **Dissolves the Binary:** Shows reductionism and anti-reductionism as points on a continuum, not absolute opposites. Many plausible positions exist in between (e.g., "partial reductionism").
  2.  **Highlights Contextualism:** Explains *why* different cases feel different – the threshold isn't fixed! The required hearer contribution varies dramatically with context (relationship, stakes, domain).
  3.  **Focuses on the Real Mechanism:** Clarifies that all testimonial justification involves *both* inheritance *and* construction; the dispute is about the baseline balance and necessity of upfront construction.
  4.  **Reveals the Threshold Debate:** Makes explicit that the core disagreement is about "How much hearer legwork is *constitutively required* for minimal testimonial justification to even begin?"

  ### Where the Scale Model Excels (and Where it Stumbles) in Classic Cases

  1.  **Small Child Believing a Parent:**
      *   **Standard Framing:** A poster case for anti-reductionism. The child lacks resources for reduction; trust is basic and necessary for learning.
      *   **Scale Model:** Excels here. Shows **extremely high speaker contribution, near-zero required hearer contribution**. The parent's inherent reliability (in the child's context) provides almost all the justification. The scale captures the *asymmetry* perfectly. Reductionism seems implausible on this model – demanding significant hearer contribution is unrealistic and ignores the parent-child epistemic dynamic.

  2.  **Adult Believing a Stranger (e.g., directions on the street):**
      *   **Standard Framing:** Battleground case. Reductionists demand positive reasons (does the stranger look competent/truthful?). Anti-reductionists say we are entitled to believe absent defeaters (does the stranger seem deceptive?).
      *   **Scale Model:** Excels by showing **moderate hearer contribution is typically required, but context matters**. We don't demand a full CV (low hearer contribution), but we implicitly assess plausibility, demeanor, and coherence with background knowledge (some hearer contribution). The scale makes sense of the intuitive middle ground. It explains why pure anti-reductionism feels too permissive (why trust *any* stranger blindly?) and strict reductionism feels too demanding (do I *really* need evidence this person isn't lying about the bus stop?). The threshold slides based on stakes and environment.

  3.  **Expert Believing a Colleague (within their field):**
      *   **Standard Framing:** Tricky for both. Anti-reductionism might grant default trust, but experts often *do* assess reasons. Reductionism might require reasons, but they can be minimal due to shared expertise.
      *   **Scale Model:** Handles this **best**. **High speaker contribution *due to* significant prior hearer contribution.** The expert colleague's utterance carries high inherent weight *because* the hearer-expert has already contributed vast background knowledge (understanding the field, knowing the colleague's reputation, grasping the plausibility). The hearer contribution isn't *about this specific utterance* upfront, but it enables the high speaker contribution. The scale shows the contributions are intertwined and the threshold for *this* testimony is low *because* of past high hearer investment. Pure reductionism misses the default trust among experts; pure anti-reductionism underplays the role of the hearer's expertise.

  **Where the Scale Model Stumbles Slightly:**
  *   **Source Fundamentality:** The scale doesn't directly address the anti-reductionist claim that testimony is a *basic source* like perception. A reductionist could argue the scale just shows testimony is *always* mediated by other sources (perception of the utterance + inductive inference). The scale is neutral on whether speaker contribution represents a unique justificatory mechanism.
  *   **The "Kind" Question:** It downplays (but doesn't eliminate) the debate about whether testimonial justification is fundamentally different *in kind* from perceptual justification. The scale focuses on the *source* of the justification's components, not its intrinsic nature.
  *   **Lackey's Objections:** Jennifer Lackey's cases (e.g., "Creationist Teacher") challenge whether speaker competence *alone* (high contribution) is sufficient for hearer justification if the hearer has strong counter-reasons (high negative hearer contribution). The scale model needs to incorporate defeater strength clearly.

  ### Conclusion
  Your reframing is highly illuminating. It successfully reorients the debate from a clash of fundamental kinds ("Is testimony basic?") to a more nuanced discussion about the **default distribution of justificatory labor** ("How much speaker reliability vs. hearer verification is required upfront in a given context?"). It handles graded cases (adult/stranger, expert/colleague) much better than the standard framing by making context-dependency explicit. While it doesn't resolve all philosophical questions (like the fundamental nature of the source), it provides a superior conceptual toolkit for understanding the dynamics of testimonial justification in real-world scenarios, revealing the threshold-setting along a single continuum as the core issue.
