  Now, why does this break the "info can't hurt" claim? The claim assumes no feedback loops. Here, information alters others' actions *because* they observe its effect. It's not about irrationality; it's about multiplayer dynamics where knowledge leaks through behavior. 

  User's hunch is correct: the claim fails when others detect your knowledge and punish you for it. I'll highlight that in the analysis. Also, emphasize that "free" ignores social costs—like trust penalties when you exploit secret info. 

