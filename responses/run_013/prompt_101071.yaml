prompt: |-
  Me and a couple friends have a little philosophy reading group going and we've been working through stuff about truth and paradox, and I've gotten stuck on something I genuinely can't tell is deep or if I'm just being dumb. Here's the thing. Everyone treats the liar paradox -- you know, "this sentence is false" -- as this massive deal, and the story I keep hearing is that any language that can talk about its own truth is going to blow up, so your only real options are either to somehow forbid sentences from referring to themselves, or to bite the bullet and say that some contradictions are actually true. But forbidding self-reference seems obviously hopeless, because we say true things about ourselves all the time, like "this sentence has five words," which is just a normal sentence that happens to be about itself. So it feels like we're basically forced into the contradiction option, and honestly I'm kind of fine with that, but I want to know if I'm missing some third door.

  Also, someone in the group wrote two sentences on the whiteboard to mess with me -- the first says the second one is true, and the second says the first one is false -- and he claimed this is the exact same kind of problem as the liar even though neither sentence refers to itself. I don't see it. Neither one is self-referential, so why can't we just say one is true and one is false and move on with our lives? Unless the real culprit was never self-reference at all, in which case my whole either/or up above is definately wrong and there's something else going on with truth itself that I haven't understood.

  So: given that we obviously can't just ban self-reference, is the liar basically proof that we have to accept true contradictions? And can you tell me what's actually broken about that two-sentence whiteboard thing, because if it's broken for a different reason than the liar is, then maybe the reason I think dialetheism is forced is wrong too. Keep the whole answer under 400 words, and American English please.
