prompt: |-
  I have been trying to work out what I actually believe about Kant's universalizability test by going case by case rather than by adopting any formula off the shelf, and I would like to know what principle, if any, my verdicts add up to. Here they are.

  1. Borrowing money on a promise to repay, when I know I cannot repay, because I need the money: impermissible. Universal adoption would make the promise useless for the very purpose for which I make it.
  2. Declining every request to lend money, though I could easily afford to lend: permissible. A world in which nobody lends is bleak, but lending has not been made impossible in it, and I do not think I owe anyone a loan.
  3. Accepting charity when I am in need while, as a settled policy, giving none: impermissible. This differs from (2), on my view, because it depends on a practice it does nothing to sustain.
  4. Lying to a would-be murderer about where my friend is: permissible, and not merely excusable. I take this to rule out any reading that condemns every false statement.
  5. Jumping the queue whenever the wait inconveniences me: impermissible, even though a world in which everyone did it contains queues — bad ones, not impossible ones.
  6. Taking one extra flight for a holiday, knowing that my own seat's emissions are negligible and the aggregate effect serious: impermissible. Universal adoption is perfectly coherent, and that is precisely why the test as usually stated seems to me to let the wrong thing through.
  7. Letting a talent of mine go undeveloped: permissible. I know this contradicts a famous case, and I am not persuaded by it.
  8. Always being the last to speak in any conversation — or any similar maxim whose universal adoption is impossible in the way that everyone being the tallest is impossible: not wrong at all, merely impossible. So the impossibility of universalizing a maxim cannot by itself be what makes an act wrong.

  The pattern I think I see is this: in every case I condemn, acting on the maxim would have me leaning on a practice, an expectation, or a forbearance that the maxim's universal adoption would undercut — and this holds even where the universalized world remains perfectly possible, as in (5) and (6). In the cases I permit, either nothing of the sort happens or the practice survives. So my provisional principle is: a maxim is impermissible just in case acting on it leaves me relying on something that its universal adoption would destroy. I offer this as a first attempt, not a settled view.

  Test it against the eight verdicts and tell me what has to give. I am especially interested in three things.

  First, does the principle actually deliver (6)? On the face of it no practice is undercut by one more passenger, so either the principle fails there or it needs a clause I have not thought of; if so, say what the clause is and what it costs.

  Second, the maxim-description problem. Almost anything is universalizable if described thinly enough, and almost nothing is if described thickly. Described thinly, (5) is just acting so as to arrive sooner, and (6) is just travelling. Described thickly, (2) becomes a maxim of never helping anyone. What fixes the description of the maxim, and can that constraint be stated without appealing to the very verdicts it is meant to explain?

  Third, what does the principle say about cases I have not ruled on: a maxim of never voting, on the ground that one vote is negligible; a maxim of eating meat whenever I like; a maxim of paying taxes only when evasion would be detected; and a maxim of breaking my own resolutions whenever keeping them becomes inconvenient, which is at least a test of whether the principle reaches maxims addressed only to myself.

  If no single principle accommodates the verdicts, give me the smallest set that comes closest, state each precisely, and say honestly which of my verdicts none of them can accommodate. Finally, say what would change your mind: which single consideration, if it came out one way rather than the other, would move you from the principle you settle on to a different one, and where in your reasoning you think you are most likely to be wrong.
reasoning: |-
  Hmm, the user is grappling with Kant's universalizability test and has proposed their own principle based on eight specific verdicts. They want me to test their principle against these cases, address three key concerns, apply it to new cases, and provide honest feedback on where their reasoning might be vulnerable.

  Looking at their proposed principle: "a maxim is impermissible just in case acting on it leaves me relying on something that its universal adoption would destroy." This seems like a sophisticated attempt to capture a "free-rider" prohibition within a Kantian framework. Their pattern recognition is sharp - they've noticed that condemned actions all involve benefiting from a system while undermining it through universalization.

  For their first concern about case (6) - the extra flight for holiday: Their principle might not directly cover this since there's no obvious "practice" being relied upon like in promise-keeping or queueing. To make it work, we'd need to expand "something" to include collective goods like a stable climate. But this stretches the principle into consequentialist territory, which might undermine its Kantian foundations.

  The maxim-description problem is thorny indeed. Kant suggests maxims should capture both action and purpose, but the user is right that thickness varies. My proposed solution - requiring the description to include the "operating mechanism of benefit" - might help, but it risks circularity since "benefit" depends on the verdict we're trying to justify.

  Testing new cases reveals tensions: The voting case exposes how their principle handles diffuse collective action problems differently from tight-knit practices like queueing. The tax evasion case shows their principle might be too permissive about free-riding on law-abiding citizens. The resolution-breaking case challenges whether the principle applies to self-regarding maxims at all.

  Honestly, no single principle perfectly captures all verdicts. The "reliance-destruction" core works for 1,3,5 but strains at 2,4,6,7. I'd propose a dual principle: one clause for practice-undermining and another for essential collective good depletion. But this bifurcation feels messy.

  Where might I be wrong? Probably in being too quick to expand "something" to include climate in case (6). If the user rejects that move, their principle fails that case - and that might be the correct outcome for their framework. The meat-eating case could be the litmus test: if they see animal welfare as a "something" we rely on, their principle condemns it; if not, it permits - revealing their underlying values.
answer: |-
  Your principle—"a maxim is impermissible just in case acting on it leaves me relying on something that its universal adoption would destroy"—is a sophisticated refinement of Kant's test, emphasizing **parasitic reliance on unsustainable practices**. It captures the core intuition behind your verdicts but requires tightening to handle edge cases. Below, I test it against your eight cases, address your three key concerns, apply it to new scenarios, and identify points of tension.  

  ### **Validation Against Your Verdicts**  
  | Case | Your Verdict | Principle's Verdict | Consistency |  
  |------|--------------|---------------------|-------------|  
  | 1    | Impermissible | ✅ Impermissible | Relies on promise-keeping, destroyed by universalization. |  
  | 2    | Permissible   | ✅ Permissible   | No reliance on others' lending (you don't expect loans). |  
  | 3    | Impermissible | ✅ Impermissible | Relies on charity norms, destroyed by universal non-giving. |  
  | 4    | Permissible   | ✅ Permissible   | No reliance on truth-telling to murderers (no such norm exists). |  
  | 5    | Impermissible | ✅ Impermissible | Relies on queue-order, destroyed by universal jumping. |  
  | 6    | Impermissible | ⚠️ **Fails** | No clear "practice" or "reliance" undercut (emissions are diffuse). |  
  | 7    | Permissible   | ✅ Permissible   | No reliance on others' talent development. |  
  | 8    | Permissible   | ✅ Permissible   | No reliance destroyed (maxim is impossible, not parasitic). |  

  **Summary**: The principle works for 7/8 cases but fails **case (6)** without modification.  

  ---

  ### **Addressing Your Three Concerns**  
  **1. Fixing Case (6) (Extra Flight)**  
     - **Problem**: Your principle doesn’t naturally condemn the flight because no specific "practice" is relied upon. You benefit from a stable climate, but it’s not an organized practice like promise-keeping.  
     - **Solution**: Expand "something" to include **non-excludable collective goods** (e.g., climate stability, public trust).  
       - **Revised Clause**: *"Relying on a practice, expectation, forbearance, or essential collective good that universal adoption would destroy or deplete."*  
     - **Cost**: This introduces a quasi-consequentialist element (focusing on outcomes like "depletion"), moving away from Kant’s purely formal test. It may overextend to cases like driving a gas car (if universalization depletes oil).  

  **2. The Maxim-Description Problem**  
     - **Core Issue**: Descriptions can be gerrymandered to manipulate outcomes (e.g., "travelling" vs. "emitting excess CO₂ for leisure").  
     - **Constraint**: The maxim must include **the purpose and operating mechanism of benefit**.  
       - **Test**: *"Could the agent reasonably expect the benefit if the maxim were universalized?"*  
         - ✅ (5) "Jumping queues to save time" → Benefit *requires* others not jumping.  
         - ❌ (6) Thin: "Travelling" → Benefit doesn’t rely on others not travelling.  
         - ✅ (6) Thick: "Emitting avoidable CO₂ for luxury when aggregate emissions cause harm" → Benefit relies on others restraining emissions.  
     - **Avoiding Circularity**: Anchor descriptions in the agent’s **reasons for action** (e.g., "I need this loan" implies reliance on lending practices). This uses the agent’s intent, not your verdicts.  

  **3. New Cases**  
     - **Never voting because one vote is negligible**:  
       - *Verdict*: **Impermissible**. Relies on democratic stability (a collective good), destroyed if universalized.  
     - **Eating meat whenever I like**:  
       - *Verdict*: **Permissible** under your principle. Only impermissible if you rely on a *specific* practice (e.g., animal welfare laws) that universal meat-eating would destroy. Otherwise, no clear reliance.  
     - **Paying taxes only when evasion is detected**:  
       - *Verdict*: **Impermissible**. Relies on tax compliance to fund public goods (e.g., roads, schools), destroyed by universal evasion.  
     - **Breaking resolutions when inconvenient**:  
       - *Verdict*: **Permissible**. No reliance on others’ resolution-keeping (purely self-regarding). Differs from (3) as no social practice is exploited.  

  ---

  ### **Where the Principle Struggles & Minimal Amendments**  
  - **The Core Tension**: Your principle excels at condemning **free-riding** (1,3,5) but struggles with **collective harm without reliance** (6) and **self-regarding acts** (7).  
  - **Smallest Set of Principles** (2 needed):  
    1. **Parasitic Reliance Principle**: *Impermissible if acting relies on a practice/good that universal adoption would destroy.*  
       - *Covers*: 1,2,3,4,5,7,8.  
    2. **Essential Collective Goods Principle**: *Impermissible if universal adoption would destroy/deplete an essential good (e.g., climate, democracy), even without direct reliance.*  
       - *Covers*: 6, voting, taxes.  
  - **Verdicts None Can Fully Accommodate**:  
    - (2) **Never lending**: Permitted by both principles but may feel morally lacking. This reveals a limit—your principle doesn’t demand positive duties (only prohibits exploitation).  
    - (6) **Extra flight**: Requires the second principle, which is less "Kantian."  

  ---

  ### **What Would Change My Mind?**  
  - **Critical Test Case**: **Eating meat**. If you judge this impermissible, your principle fails without expanding "reliance" to include *ecosystem stability* or *animal suffering* as "collective goods." This would force a consequentialist turn.  
  - **Where I’m Most Likely Wrong**: In assuming **case (4) (lying to a murderer)** involves no reliance. If society expects truth-telling *even to murderers*, universal lying might destroy trust in all statements. Your verdict implies this expectation doesn’t exist—but if it does, the principle condemns the lie.  
  - **Game-Changing Consideration**: If **self-regarding acts (e.g., 7, resolutions)** could be condemned, your principle collapses. Kant’s talent case suggests duties to oneself, but you reject this. If you reversed (7), we’d need a third principle for self-developmental duties.  

  ### **Final Recommendation**  
  Stick with your **Parasitic Reliance Principle** but add a **Collective Goods Clause** for environmental/democratic cases. This hybrid:  
  - ✅ Matches 7/8 verdicts and handles new cases coherently.  
  - ❌ Sacrifices Kantian purity for real-world applicability.  
  The unresolved tension is **positive duties** (e.g., lending, developing talents). Your principle only forbids exploitation—it doesn’t require helping others. If that aligns with your intuitions (as in case 2), it’s a feature, not a bug.
