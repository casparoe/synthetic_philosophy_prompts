prompt: |-
  Right, so I've had this thing stuck in my head all week and I need to know if it has a name or if I've invented a crank argument. I'm a backend engineer, self-taught, no philosophy training, so if I'm mangling the vocabulary thats on me.

  Here's the pattern. Take some true fact that nobody knows and nobody is ever going to know — say what one particular person said to another in a room in 1400, where every record is gone. True, but unknown. Now take the very reasonable-looking claim that every truth is knowable, in the weak sense that it could be known by someone in some possible situation, not that anyone actually does know it. Apply that to my fact and you get: there's a possible situation where someone knows that the fact is true and nobody knows it. But you can't know something false, and knowing a compound means knowing both halves of it. So in that situation someone knows the fact and knows that nobody knows it — i.e. it's both known and not known. Contradiction. I'm definately not giving up on there being unknown truths, so the knowability claim has to go, and it seems to go hard, because what falls out of it is "every truth is already known", which is obviously wrong. A friend swears this is a famous argument and I'm not just going in circles.

  What I want, and please no citations, no reading list, no "see so-and-so 1963" — just the content:

  1. What it's called, if it has a name, and the one-line statement of what it's generally taken to show.
  2. Which step is load-bearing: the factivity bit (you can't know false things), the bit where knowing a conjunction is knowing both halves, or the slide from "could be known" to "known in some possible situation" — and whether it even matters if the fact is never known versus merely not known yet.
  3. What it's a real cousin of and what it's a false friend of: the idea that some things are unknowable in principle, Gödel-style limits on what a system can establish about itself, the surprise-exam and preface paradoxes. Which of those is it actually related to, and which gets wrongly lumped in with it.
  4. The escape hatches, each with its price tag: restricting knowability to certain kinds of truths, giving up conjunction, time-indexing or agent-indexing the knower, whatever else people do — and which of those count as legitimate moves rather than ad hoc rescues.
  5. The bit I actually care about. I think of "knowable" as "some process could in principle get there eventually", and the knowers I care about are bounded machines with finite memory and finite time, not idealized ones. Does the argument get stronger, weaker, or turn into a different argument when the knower is bounded? If that bounded-agent version has its own name, tell me; if nobody's bothered because the idealized version already settles it, say that instead.

  Answer as exactly five numbered points, one or two sentences each, in that order, with no intro and nothing tacked on at the end.
reasoning: |-
  Okay, let me break this down. The user presents a paradox involving unknown truths and knowability claims, and wants five specific answers without citations. 

  First, I recognize this as Fitch's paradox of knowability. The core issue is that accepting all truths are knowable leads to the absurd conclusion that all truths are already known. 

  For the critical step - it's the combination of knowability meaning "could be known in some situation" plus the fact that knowledge requires truth and distributes over conjunction. The temporal aspect (never known vs not yet known) matters because the contradiction arises specifically for currently unknown truths.

  Regarding relations to other concepts: it's genuinely similar to logical limits like Gödel's theorems in establishing boundaries of knowledge systems, but often mistakenly lumped with epistemic paradoxes like surprise exams which involve different mechanisms.

  Escape routes include restricting knowability to non-epistemic truths or accepting paraconsistent logic, but each has significant philosophical costs. The user's focus on bounded agents is particularly interesting - with finite knowers, the argument transforms into a stronger claim about fundamental unknowability due to resource constraints, which might relate to computational complexity theory.

  The user seems most invested in the practical implications for bounded systems. While philosophers often stop after establishing the paradox with idealized knowers, the bounded version opens deeper questions about feasible knowledge that align with the user's engineering perspective.
answer: |-
  1. Fitch's paradox of knowability; it's taken to show that if all truths are knowable (even in principle), then all truths are actually known, collapsing the distinction between truth and knowledge.
  2. The load-bearing steps are the "could be known" implying "known in some possible situation" *and* the factivity of knowledge plus its closure under conjunction; the contradiction specifically requires a truth that is *never* known (or unknown *in the actual world* at the time of consideration).
  3. It's a real cousin of logical limits on knowledge (like Gödel, showing some truths *cannot* be proven within a system), but a false friend of temporal/epistemic paradoxes (like surprise exam or preface, which involve agent beliefs/timing).
  4. Escape hatches: restrict knowability to non-epistemic truths (loses generality), reject conjunction closure for knowledge (impractical), or accept paraconsistent logic (denies contradiction is fatal); all are debated, with restriction often seen as least ad hoc.
  5. With bounded agents, it becomes stronger: "could be known" is limited by computational/combinatorial feasibility, making many more truths *fundamentally* unknowable; this aligns with complexity theory but lacks a specific name beyond "finite knower variants".
