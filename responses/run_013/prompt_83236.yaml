prompt: |-
  I am a high school student writing an essay for an advanced statistics class on whether the replication crisis shows that something is wrong with the scientific method itself or only with how the method is practised, and my teacher's preferred illustration is one I cannot get past. She says a research field is like a screening programme: most of what gets tested is not the real thing, the test is imperfect in both directions, and so most of the results that come back flagged are wrong, just as most positives are wrong when the disease being screened for is rare. Because the test cannot be made perfect while the thing being looked for is uncommon, the sensible response is to improve the test, which she takes to mean stricter thresholds, larger samples, and studies registered in advance. A classmate of mine objects that this cannot be the right lesson: the screening picture is a Bayesian calculation applied to a procedure that refuses to reason from prior probabilities, so what the analogy really shows is that the statistics should be done differently, not that a cutoff should be tightened. I would like an audit of the analogy and of what it can be made to support.

  Answer as exactly five numbered items, each a sentence or two long, with no introduction and no conclusion. (1) State the correspondence explicitly, deciding what plays the role of the screened population, the disease, the test and its sensitivity and specificity, and the prevalence of the disease, and say which of these roles has to be assigned a number for the analogy to yield anything quantitative. (2) Say which parts of the analogy are genuinely apt, and what they explain about the replication crisis. (3) Say where it breaks, singling out the disanalogies that matter for my teacher's conclusion and explaining why the rest do not. (4) Say what the analogy quietly imports from the screening case that the research case lacks, and which of those imports are doing the persuasive work. (5) Say which conclusion, if either, the analogy can carry, and what the smallest change to it would be that would make it a better guide.
reasoning: |-
  Hmm, the user is a high school student in an advanced statistics class, grappling with an essay question about the replication crisis. They're analyzing their teacher's analogy comparing research fields to screening programs, where false positives dominate when the underlying phenomenon is rare. A classmate has challenged this view, arguing that the analogy actually points to flawed statistical approaches rather than just stricter thresholds.

  I need to break down this complex analogy into five precise points as requested. The student wants an audit of the analogy's validity and what conclusions it can support regarding whether the replication crisis indicts the scientific method itself or just its practice.

  First, I'll explicitly map the correspondence: the screened population represents all hypotheses tested, "disease" becomes true effects, the test is statistical significance (p<0.05), with sensitivity as power and specificity as 1-α. Prevalence is the proportion of true effects. Crucially, prevalence must be quantified for the analogy to yield numerical insights - this is central to the Bayesian critique.

  Next, I'll identify the apt parts: the analogy powerfully explains why false positives accumulate when true effects are scarce, mirroring low-prevalence screening. This directly illuminates the replication crisis where many published findings fail to replicate.

  Then the breakdowns: screening assumes known prevalence and fixed test parameters, while research has unknown priors and flexible designs (p-hacking). This disanalogy undermines the teacher's prescription of mechanical threshold-tightening, as the core issue is prior ignorance and researcher degrees of freedom.

  For hidden imports: the analogy smuggles in quantifiable prevalence and stable test properties - assumptions that don't hold in research where priors are unmeasured and analyses are malleable. These imported elements make the "just tighten thresholds" conclusion seem more valid than it is.

  Finally, I'll resolve the conclusions: the analogy can support the classmate's view that statistical philosophy needs changing (Bayesian methods incorporating priors), not just stricter cutoffs. To improve it, we'd need to incorporate prior probability estimation - making explicit what the analogy implicitly assumes.

  The student needs this structured cleanly as five numbered items without intros/outros. I'll keep each to 1-2 sentences while ensuring they interconnect to form a complete audit.
answer: |-
  Here are the five numbered items as requested:

  (1) The screened population corresponds to all tested hypotheses; the "disease" is a true effect; the test is statistical significance (e.g., p<0.05); sensitivity is statistical power (probability of detecting a true effect); specificity is 1 - α (probability of correctly rejecting a false effect); prevalence is the proportion of tested hypotheses that are true. Prevalence must be assigned a numerical value for quantitative conclusions about false positive rates.

  (2) The analogy is apt in showing that when the "disease" (true effect) is rare (low prevalence of true hypotheses) and the test (significance threshold) has imperfect specificity (α > 0), most flagged results ("positives") will be false positives, explaining the high rate of non-replicable findings.

  (3) It breaks where screening assumes known, fixed sensitivity/specificity and prevalence, while research allows flexible designs (e.g., p-hacking), variable quality, and unknown prevalence. This disanalogy matters because the teacher's solution (stricter cutoffs) ignores that the core problem is unquantified priors and researcher flexibility, not just fixed test properties.

  (4) The analogy quietly imports known prevalence, fixed test properties (sensitivity/specificity), and the absence of researcher manipulation. The imports of known prevalence and fixed test parameters do the persuasive work for the "just tighten thresholds" conclusion, masking the role of unknown priors and methodological flexibility.

  (5) The analogy primarily supports the classmate's conclusion: it demonstrates the need for Bayesian reasoning incorporating prior probabilities, not merely stricter thresholds. The smallest change to make it a better guide is explicitly requiring estimation of the prior probability (prevalence) of true hypotheses.
