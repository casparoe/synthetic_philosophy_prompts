answer: |-
  Your diagnosis is astute, and I share your suspicion: the stalemate arises largely because the major theories are *not* addressing the same core *explanandum*. Each prioritises different phenomena, leading to divergent "costs" that proponents accept but opponents find intolerable. The result is a dialogue of the deaf, fortified by incompatible starting commitments. I’ll dissect the positions concretely, separate settled from contested points, and suggest what progress might entail. Throughout, I’ll use British English and avoid presenting contested readings as consensus.

  ### The Core Disagreement: What is the *Explanandum*?
  The fundamental stall stems from a mismatch in what each camp takes as the primary target for a "theory of vagueness":
  - **Epistemicism** (e.g., Williamson, Sorensen) prioritises *preserving classical logic and bivalence*. The phenomenon to explain is why vague predicates *appear* boundaryless when they are not.  
  - **Supervaluationism** (e.g., Fine, Keefe) prioritises *accommodating indeterminacy without abandoning classical logic*. The target is the *intuition* that borderline cases lack a truth value.  
  - **Degree Theories** (e.g., Edgington, Smith) prioritises *modelling gradience in judgement*. The focus is on why vague predicates admit of "more or less" truth.  
  - **Contextualism** (e.g., Raffman, Shapiro) prioritises *explaining dynamic usage*. The puzzle is why boundaries shift in different contexts.  

  This divergence explains why arguments rarely convert opponents: rejecting one theory’s solution often feels like changing the subject to its proponents. Your physical chemistry analogy is apt—just as phase transitions emerge from coarse-grained descriptions without requiring "real" boundaries at the molecular level, many philosophers treat vagueness as an artefact of linguistic practice. But the debate reifies the dichotomy by treating "sharp boundaries" as either ontologically real (epistemicism) or eliminable (others).

  ### Engaging the Positions: Core Moves and Costs
  Each theory makes a distinct foundational move, accepting specific costs to address its chosen *explanandum*. Below, "settled" points reflect broad agreement; "contested" points mark irreconcilable divides.

  1. **Epistemicism**  
     - **Core Move**: Vague predicates *have* sharp boundaries, but human ignorance makes them unknowable. This preserves classical logic (bivalence, excluded middle) and disquotation ("'X is bald' is true iff X is bald").  
     - **Costs Accepted**: Denies the intuition that vague predicates *lack* sharp boundaries. Treats tolerance (if one grain doesn’t make a heap, neither does the next) as fallible.  
     - **Contested Starting Commitment**: Bivalence is non-negotiable. Opponents argue this misdescribes linguistic phenomenology—we don’t *experience* unknowable boundaries.  
     - **Settled Among All**: Classical logic alone cannot resolve the paradox without auxiliary claims (e.g., Williamson’s margin-for-error principles).  

  2. **Supervaluationism**  
     - **Core Move**: Truth is "supertruth" (true in all precisifications). Borderline cases are *indeterminate* (neither true nor false), but classical logic holds for non-borderline cases.  
     - **Costs Accepted**: Loses the disquotational schema (e.g., "‘X is bald’ is neither true nor false" can be true, but the disquoted sentence isn’t false). Also, "tolerance" is preserved globally but fails at some precisification.  
     - **Contested Starting Commitment**: Truth must be timeless and context-invariant. Contextualists object that boundaries *in practice* are fluid, not fixed by precisifications.  
     - **Settled Among Non-Epistemicists**: Vagueness involves genuine indeterminacy (not just ignorance).  

  3. **Degree Theories**  
     - **Core Move**: Truth comes in degrees (e.g., 0 to 1). A sorites series is a smooth continuum, and the paradox dissolves as no single step changes "heapness" significantly.  
     - **Costs Accepted**: Requires non-classical logic (e.g., fuzzy or probabilistic), abandoning bivalence. Compositionality is problematic (e.g., what is the degree of "bald and tall"?).  
     - **Contested Starting Commitment**: The *phenomenology* of vagueness (graded judgements) is primary. Critics say this over-psychologises semantics—truth isn’t "in the head".  
     - **Settled**: Tolerance is captured naturally, but no consensus on how to formalise it.  

  4. **Contextualism**  
     - **Core Move**: The extension of vague predicates shifts with context (e.g., comparison class, salience). A cutoff exists in any *given* context, but shifts to avoid tolerance violations.  
     - **Costs Accepted**: Truth is temporary and interest-relative. Lacks a formal semantics for context-shifts that satisfies logicians.  
     - **Contested Starting Commitment**: Usage dynamics are the key datum. Opponents (e.g., epistemicists) argue this ignores the "timeless" core meaning of predicates.  
     - **Settled**: Context *matters* in borderline judgements, but no agreement on whether it’s semantic or pragmatic.  

  ### The Nature of the Stall
  - **Not Primarily Verbal**: The theories use "truth," "boundary," etc., consistently *within* their frameworks. The clash is about *explanatory priorities*.  
  - **Disagreement About the Target Phenomenon**: As you suspected, epistemicism/supervaluationism target *semantics/logic*; degree theories target *judgement*; contextualism targets *use*.  
  - **Disagreement About Data**: Epistemicists downplay the "felt absurdity" of sharp cutoffs; degree theorists and contextualists treat tolerance as primary; supervaluationists prioritise preserving logical laws.  
  - **Clash of Starting Commitments**: Bivalence vs. anti-realism about boundaries; static vs. dynamic truth; formal vs. descriptive adequacy. These are *pre-theoretical* and defended circularly (e.g., "Logic must be classical" or "Boundaries can’t be sharp").  

  **Settled Points** (broad agreement):  
  - The sorites paradox exposes a genuine problem for classical semantics.  
  - Tolerance is intuitive but leads to contradiction if applied universally.  
  - Borderline cases exist and resist bivalent classification in practice.  
  - No theory resolves all intuitions without costs.  

  **Genuinely Contested Points** (no consensus):  
  - Whether bivalence holds for vague predicates.  
  - Whether "ignorance" or "indeterminacy" explains borderline cases.  
  - Whether truth is gradable or context-bound.  

  ### What Would Count as Progress?
  Given your diagnosis—and the scientific analogy—progress likely requires:

  1. **A Change of Question**: Shift from "What is the *correct* logic/semantics?" to "What function does vagueness serve?" (e.g., Raffman’s work on cognitive efficiency). Your coarse-graining insight is key: vagueness may be a *feature* of language for handling continuous variation, not a bug. This reframes boundaries as emergent from use, not "real" or "unreal".  
  2. **A Distinction**: Explicitly decouple the *semantic* project (e.g., compositional logic) from the *cognitive* project (e.g., judgement under uncertainty). Most disputes conflate these.  
  3. **Formal Results with Cross-Paradigm Bite**: e.g., Showing that *any* logic preserving tolerance *must* violate a specific classical rule, or that contextualism can be formalised without ad hocery. Results that force all sides to confront shared constraints.  
  4. **An Argument for Why Progress is Stalled**: If the phenomena are genuinely disunified (e.g., semantics vs. psychology), then a "theory of vagueness" may be a category error—like seeking a single "theory of phase transitions" that explains both molecular kinetics and thermodynamic equations. This could dissolve the debate by showing it’s ill-posed.  

  ### Conclusion
  The stall isn’t merely stubbornness; it’s a symptom of the field’s fragmentation. Epistemicism answers a logical question ("How to save bivalence?"), while contextualism answers a pragmatic one ("How do we use vague words?"). Your scientific instinct is sound: in chemistry, phase transitions aren’t paradoxical because the *description level* (thermodynamic vs. molecular) is specified. Similarly, progress here may require theorists to explicitly choose their *explanatory level*—and accept that no theory can dominate all others without begging the question. Until then, the literature will remain a mosaic of mutually dismissive paradigms.
