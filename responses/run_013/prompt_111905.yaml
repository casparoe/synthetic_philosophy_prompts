answer: |-
  **PUBLIC NOTICE:** This office administers Bylaw 12.7(c) concerning structures exceeding reasonable height.

  **FREQUENTLY ASKED QUESTIONS:**

  *   **Q: How high is "reasonable"?**  
      A: The threshold is precisely defined within the Bylaw framework. Its exact value is an administrative determination not publicly available.

  *   **Q: Why can't you publish the exact height limit?**  
      A: The threshold cannot be meaningfully expressed as a single measurement applicable in all contexts. Its precise location is inherent to the Bylaw's operation.

  *   **Q: Is my building over the reasonable height limit?**  
      A: Upon review of your submitted Form 27B/6 and associated documentation, this office will issue a definitive determination: yes or no.

  *   **Q: If you say my building is over the limit, what was the limit?**  
      A: The office does not disclose the specific threshold value applied in individual determinations. The levy is assessed based on the binary finding of excess.

  *   **Q: My neighbour's identical building was deemed under the limit. Why is mine over?**  
      A: Each determination is specific to the structure and its context. Precedents establish that a structure not exceeding reasonable height does not preclude a determination that a taller structure may also not exceed it.

  *   **Q: You said Building A (20m) was clearly under, Building B (40m) was clearly over, but Building C (60m) is still under review?**  
      A: Determinations are made incrementally. A structure exceeding a height previously found reasonable does not automatically constitute an excess. Each increment requires its own assessment.

  *   **Q: But Building C is forty metres taller than Building B, which you said was clearly excessive!**  
      A: The comparison is noted. However, the reasonable height threshold is not established solely by relative comparison. Building C's status is under active review per standard procedure.

  *   **Q: I read Determination 1147: "No structure may be deemed not to exceed reasonable height if it demonstrably exceeds the height of a structure previously deemed to exceed reasonable height." Doesn't that mean once one building is tall, every taller one is too?**  
      A: The rule cited establishes a relational principle for consistency. It does not define the initial threshold. All structures are assessed individually; the levy applies only upon an affirmative determination of excess for that specific structure.

  *   **Q: How do I know if my case is borderline?**  
      A: Submit Form 27B/6 ("Petition for Determination of Threshold Proximity Status"). If preliminary review indicates potential borderline status, Form 27B/6a ("Assessment of Form 27B/6 Clarity Gradation") may be initiated; this form is currently in draft consultation.

  **FRONT COUNTER SCRIPT:**

  *(Clerk maintains neutral tone. Responses 1A and 1B are to be used with equal frequency but NEVER sequentially with the same visitor.)*

  1.  **Visitor:** I just need to know where the line is. What’s the actual height limit?
      *   **Clerk Response 1A:** The threshold exists at a precise point. Our instruments and methodologies are continually refined to approach it.
      *   **Clerk Response 1B:** The threshold is a practical tool for consistent application. Its location serves the Bylaw's purpose.

  2.  **Visitor:** Is my building over the limit or not? (After submission)
      *   **Clerk:** The office has rendered its determination: [Yes/No]. The levy applies/does not apply accordingly.

  3.  **Visitor:** But *why*? What number did you use?
      *   **Clerk:** The specific threshold value is an internal administrative datum. The determination stands: [Yes/No].

  4.  **Visitor:** That building next door is taller than mine and you said it was fine last year!
      *   **Clerk:** Each determination is context-specific. A previous finding for a different structure does not bind the current assessment. Incremental increases are evaluated independently.

  5.  **Visitor:** How can Building X be tall, but Building Y, which is much taller, not be tall *yet*? This makes no sense!
      *   **Clerk:** The assessment process is iterative and thorough. Building Y's status remains under review per standard procedure. Determination for Building X stands.

  6.  **Visitor:** So, if one building is tall, and mine is taller, doesn't that rule you cited mean mine *must* be tall?
      *   **Clerk:** The rule ensures relational consistency *following* determinations. It does not establish the initial threshold. Your structure's status was determined individually: [Yes/No].

  7.  **Visitor:** This is clearly ridiculous!
      *   **Clerk:** Appeals may be filed in triplicate by Thursday.
