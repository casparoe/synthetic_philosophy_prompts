answer: |-
  Right then, let's dissect that famous German line – almost certainly Leopold von Ranke's aspiration to show history **"wie es eigentlich gewesen"** ("how it actually/essentially was"). Your suspicion about its journey is spot on. Here's the menu:

  **1. The Line, Unpacked: A Spectrum of Claims**

  1.  **Avoid Deliberate Fabrication:** The historian shouldn't invent events, people, or quotes that didn't exist. They mustn't knowingly lie or distort evidence to fit a preconceived story.
  2.  **Strive for Factual Accuracy:** Where evidence exists, the historian should accurately report dates, names, locations, and verifiable events (e.g., "The Battle of Hastings occurred in 1066," "Parliament passed the Act in 1765").
  3.  **Ground Claims in Evidence:** Any assertion about the past should be based on surviving sources (documents, artefacts, etc.), not just speculation or personal belief. The historian should show their working.
  4.  **Avoid Explicit, Anachronistic Moral Judgement:** Historians shouldn't primarily frame the past through modern ethical lenses or pronounce definitive moral verdicts (e.g., "King X was inherently evil," "This policy was morally bankrupt by our standards"). Context is key.
  5.  **Minimise Personal Bias in Selection:** The historian should strive to be aware of their own biases and try not to *systematically* exclude crucial evidence simply because it contradicts their preferred narrative or worldview.
  6.  **Reconstruct Events 'Neutrally':** It's possible to select and arrange verified facts about an event or period in a way that simply *shows* what happened, without the historian's interpretation shaping the narrative. The facts "speak for themselves" when properly assembled.
  7.  **Reveal the Essential Truth:** Beneath the surface details, there is an "essential" truth or coherent reality about the past ("wie es *eigentlich* gewesen") that the historian, through rigorous method, can objectively uncover and present. Interpretation is secondary to uncovering this essence.
  8.  **Complete Objectivity is Achievable:** By rigorously adhering to source criticism and suppressing their own perspective, the historian can achieve a truly objective, interpretation-free account of the past. The historian becomes a neutral conduit for the facts.

  **2. Verdicts**

  1.  **Avoid Deliberate Fabrication:** Platitude (Universally agreed baseline for professional history).
  2.  **Strive for Factual Accuracy:** Platitude (Core goal, though complexities exist in verifying *all* facts).
  3.  **Ground Claims in Evidence:** Platitude (Fundamental methodological rule).
  4.  **Avoid Explicit, Anachronistic Moral Judgement:** Live Dispute (Widely advised, but the *degree* of avoidance and handling of implicit moral dimensions is debated).
  5.  **Minimise Personal Bias in Selection:** Live Dispute (Acknowledged as vital, but the *extent* to which it's possible to achieve genuine neutrality in selection is fiercely debated).
  6.  **Reconstruct Events 'Neutrally':** Live Dispute (The core battleground - critics like Carr & White argue selection/arrangement *is* interpretation and facts never truly "speak for themselves" neutrally).
  7.  **Reveal the Essential Truth:** Plainly False/Live Dispute (Most modern historians reject the idea of a single, objective "essence" waiting to be uncovered; the past is seen as multi-faceted and meaning is constructed).
  8.  **Complete Objectivity is Achievable:** Plainly False (Overwhelming consensus that total detachment from perspective, language, narrative structure, and the act of selection is impossible).

  **3. What Your Mate Actually Needs**

  Your mate needs **Readings 6, 7, and particularly 8** to justify his idea that a historian can simply lay out "what happened" as pure, unvarnished facts without interpretation. He needs the claim that rigorous source work allows the historian to bypass their own perspective and assemble facts into a narrative that objectively *is* "how it actually was," letting the audience draw their own conclusions without the historian's framing. However, as the verdicts show, these stronger readings are precisely the ones most heavily contested (6) or rejected (7 & 8) by much of modern historiography. Critics argue that selecting *which* facts to include, arranging them into a sequence, choosing the language to describe them, and constructing a coherent narrative *are all acts of interpretation*, inevitably shaped by the historian's context, questions, and unconscious biases. There's no "view from nowhere."

  **4. What the Original Fella (Ranke) Probably Meant**

  Ranke, writing in the early 19th century, was reacting against two things: grand philosophical histories (like Hegel's) that imposed abstract schemes on the past, and older histories heavy with overt moralising or political bias (often serving monarchs or nations). His phrase **"wie es eigentlich gewesen"** combined several ideas:
  *   **"Eigentlich" as "Actually":** A commitment to meticulous archival research and source criticism to establish *what actually happened* as accurately as possible (Readings 1-3). He wanted to move beyond reliance on chronicles and legends.
  *   **"Eigentlich" as "Essentially":** A belief that through this rigorous focus on primary sources and specific events, one could discern the *essential character* or *inner reality* of a past era or development (Reading 7). He sought to understand the past "in its own terms," revealing its unique spirit.
  *   **Rejection of Overt Judgement:** A deliberate move away from explicit moralising (Reading 4), aiming to show the past's own logic and context.
  Crucially, Ranke *did* interpret. His work involved constructing narratives, explaining causality, and discerning themes – all based on his reading of the sources. He wasn't advocating a naive list of facts. He believed his method allowed him to access the objective truth *about* the past's essential nature. He meant "show the past *as it truly was in its essence*," not "just list verified facts without any shaping narrative or implicit perspective." His ideal was a profound, source-based understanding, not the absence of interpretation. The modern critique (Carr, White et al.) attacks the stronger, more positivist version of his ideal (Readings 6-8) that became influential later, arguably simplifying what Ranke himself practised. The phrase *has* drifted significantly from its original, more nuanced intent. Your mate is invoking the simplified, harder-line version that emerged later, not necessarily Ranke's full, complex methodology.
