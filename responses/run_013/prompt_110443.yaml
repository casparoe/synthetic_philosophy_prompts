  First, I need to anticipate objections from each group. The Bayesian nonparametrics people might focus on MDL being a practical implementation. They could argue that MDL handles the machine dependence through minimax optimality. The RL researchers might dismiss the framework as irrelevant to real-world problems. The philosopher might question the foundational claims about simplicity.

