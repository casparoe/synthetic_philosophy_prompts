prompt: |-
  I'm a PhD student in formal epistemology, trying to state precisely what I think about when aggregating individual judgments is epistemically reliable. Here are my verdicts on a run of cases; I want the principle behind them, if there is one. A panel of a hundred members, each independently right on a yes/no question with probability 0.6 and all equally competent: I trust the majority far more than any one member. The same panel, once I learn their mistakes all flow from a single unreliable memo they each read beforehand: I stop trusting the majority and might as well consult one member. One expert who is right with probability 0.9 versus a three-member majority of members at 0.6: I take the expert. A panel of a thousand members each at 0.51: I expect the majority to be almost certainly right. A thousand members each at 0.51 whose votes are correlated: I don't. And when the question has three possible answers rather than two, I don't think the most popular answer is reliable in the way majority rule is for yes/no.

  Is there one principle that delivers all of these? I suspect reliability has to turn on independence and on competence clearing chance, but I can't make the last two cases fall out cleanly, and I don't know what to say when competence is heterogeneous — say, half the panel at 0.7 and half at 0.45, so the average clears chance but the median doesn't. Please state the principle, or the candidates, precisely; tell me which of my verdicts it makes me give up; and say what it predicts for a case I haven't put to it — a panel whose members are individually mediocre on every question, but each is an expert on a different sub-question.
reasoning: |-
  Okay, the user is a PhD student in formal epistemology working on judgment aggregation. They've presented several cases and want a unifying principle that explains their intuitive verdicts on when group judgments are reliable. Let me start by analyzing each case they mentioned.

  First, they trust a majority of 100 members each with 0.6 competence when independent. But once mistakes come from a common source (like a memo), they lose trust. That points to the importance of independence. Then, they prefer one expert at 0.9 over three at 0.6—so individual competence matters, but only when not outweighed by numbers. Next, a large group (1000) at 0.51 is trusted, but not if correlated. That again emphasizes independence and the Condorcet effect. For three options, majority isn't reliable like in binary cases, suggesting the Condorcet Jury Theorem (CJT) doesn't extend easily beyond binary choices.

  The user is struggling with correlated votes and heterogeneous competence. The CJT assumes homogeneous competence and independence. In their mixed-competence case (half at 0.7, half at 0.45), the average is 0.575 (above chance), but the median is below. The principle should address whether average or median competence matters. Also, in the expert sub-question case, individual reliability on specific parts might not aggregate straightforwardly.

  Key elements seem to be: independence, minimal competence above chance, and size. But correlation breaks independence. For heterogeneous groups, average competence might be crucial, as per the extended CJT. However, if the median is below 0.5, even with high average, the majority could be unreliable. The user needs a principle that handles correlation and competence distribution.

  The Generalized CJT (Dietrich & List) might work, incorporating dependence and competence. Their verdicts mostly align, except maybe the mixed-competence case. If average >0.5, the group reliability could still hold, but the user's worry about median below 0.5 suggests a deeper issue. They might need to accept that average competence drives group reliability, even with some members below chance. For the sub-question case, aggregating judgments requires matching experts to their domains, which isn't covered by standard models. The principle here involves task assignment and division of labor, beyond simple aggregation.

  Unresolved issues: How to quantify dependence in the principle? For heterogeneous groups, does average suffice? The user might need to incorporate variance or use the average in the extended theorem. Also, for multiple options, other models like Bayesian aggregation or different voting rules are needed. The user's deeper need is a robust framework that handles real-world complexities like correlation and varied competences, possibly pointing to extensions beyond classical CJT.
answer: |-
  Based on your cases and the challenges of correlation, heterogeneous competence, and non-binary choices, the unifying principle is best captured by a **Generalized Condorcet Jury Theorem (GCJT) framework incorporating dependence and competence structure**. Here's the core principle and its components:

  **The Principle of Epistemically Reliable Aggregation (PERA):**
  > A collective judgment (via majority rule for binary choices, or plurality for k>2) is epistemically reliable relative to an individual judgment if:
  > 1.  **Minimal Competence:** The *expected average competence* of the group (E[p̄]) is > 0.5 (for binary) or > 1/k (for k-ary).
  > 2.  **Positive (but bounded) Dependence:** Voter judgments exhibit sufficiently low pairwise correlation (ρ < ρ_max) given group size and competence, ensuring the "law of large numbers" effect dominates.
  > 3.  **Sufficient Size:** The group is large enough that the *effective independent size* (N_eff), accounting for dependence and competence variance, makes P(majority correct) >> max(p_i).

  **Breaking down PERA with your cases:**

  1.  **100 members, p=0.6, independent:**
      *   *Applies:* E[p̄]=0.6 > 0.5, ρ≈0, N=100 large → **Trust majority.**
      *   *Classic CJT holds.*

  2.  **100 members, p=0.6, common cause (memo):**
      *   *Violates (2):* Extreme positive dependence (ρ ≈ 1) → N_eff ≈ 1.
      *   *Result:* Majority no better than single vote. **Stop trusting majority.**

  3.  **1 expert (p=0.9) vs. 3 majority (p=0.6):**
      *   *Applies:* Expert p_i=0.9 > P(majority correct) ≈ 0.648 (for independent voters). **Take expert.**
      *   *PERA doesn't force trusting small groups just because E[p̄]>0.5; reliability must surpass alternatives.*

  4.  **1000 members, p=0.51, independent:**
      *   *Applies:* E[p̄]=0.51 > 0.5, ρ≈0, N=1000 very large → P(majority correct) ≈ 1. **Trust majority.**

  5.  **1000 members, p=0.51, correlated:**
      *   *Violates (2):* ρ > ρ_max (ρ_max very small for p≈0.5). N_eff << 1000, P(majority correct) ≈ 0.51. **Don't trust majority.**

  6.  **3 options, majority unreliable:**
      *   *Applies:* Classic CJT/PERA for binary doesn't extend robustly to k>2. Plurality winner can win with <50% and P(plurality correct) can be low even if E[p̄] > 1/3, especially with dependence or competence near 1/3. **Don't trust plurality like binary majority.**

  7.  **Heterogeneous Competence (half p=0.7, half p=0.45):**
      *   *Applies (cautiously):* E[p̄] = 0.575 > 0.5.
      *   *Analysis:* PERA relies on *expected average competence*. The group *can* be reliable if N is large enough *and* dependence is low. However:
          *   High variance in competence *reduces* N_eff.
          *   Members with p_i < 0.5 *hurt reliability more* than members with p_i > 0.5 *help* (for p_i near 0.5).
          *   For large N and low dependence, P(majority correct) will still approach 1, but slower than if all had p=0.575. **PERA predicts trust if N is sufficiently large and dependence low.** Your worry about the median being below 0.5 is valid but PERA focuses on the mean. (This is a point of potential disagreement - see below).

  **What PERA Makes You Give Up (or Clarify):**

  *   **The Heterogeneous Case:** PERA insists that if E[p̄] > 0.5, dependence is low, and N is sufficiently large, the majority *is* reliable, even if the *median* competence is below 0.5 (as in your 0.7/0.45 split). You expressed skepticism about trusting the majority here. PERA says you *should* trust it for large enough N. (E.g., N=1000, independent: P(majority correct) ≈ 0.999 despite median p_i=0.45).
  *   **"Clearing Chance":** PERA requires the *expected average* to clear chance, not necessarily every individual or the median. Some individuals *can* be worse than random.

  **PERA's Prediction for Your New Case:**
  *   **Case:** Panel of individually mediocre members (p_i ≈ 0.5 on the whole question), each an expert on a different sub-question relevant to the overall judgment.
  *   **Analysis:**
      *   **Naive PERA (Direct Aggregation):** E[p̄] ≈ 0.5 → PERA condition (1) fails (Minimal Competence not met). Predicts **unreliable majority** on the overall yes/no question via direct voting.
      *   **Structured PERA (Division of Labor):** This case highlights a limitation of simple aggregation models. Reliability likely depends on *structuring the aggregation process*:
          1.  **Identify Sub-Questions:** Decompose the overall question into the specific sub-questions each member is expert on.
          2.  **Expert Judgment:** Have each member report only on *their* sub-question.
          3.  **Aggregate Sub-Answers:** Synthesize the sub-answers into the final answer (e.g., via logical aggregation if sub-questions determine the whole, or a second-stage vote if not).
      *   **Prediction:** If the aggregation process correctly maps individual sub-expertise (p_i >> 0.5 on their sub-question) and synthesizes answers reliably (which may require independence/dependence among sub-answers), the **collective judgment can be highly reliable**. Direct majority voting on the overall question without utilizing the expertise structure will likely be **unreliable**. PERA, extended to recognize the need for matching competence to sub-tasks in aggregation design, predicts success only with the structured approach.

  **Precise Formulation of Key Concepts in PERA:**

  *   **Expected Average Competence (E[p̄]):** (Σ E[p_i]) / N. The crucial value for the competence condition.
  *   **Effective Independent Size (N_eff):** A measure of how many *independent* voters with a *reference competence* (often p̄ or 0.5) would be needed to achieve the same level of majority reliability. Depends on:
      *   Actual group size (N).
      *   Competence distribution (variance matters).
      *   Dependence structure (pairwise correlations ρ_ij, or higher-order dependencies). N_eff ≤ N, and N_eff << N under high positive dependence.
  *   **Sufficient Size Condition:** N_eff must be large enough that the probability the average vote exceeds 0.5 (for binary) is close to 1. For E[p̄] > 0.5 and low dependence, N_eff needs to be >> 1 / (E[p̄] - 0.5)^2.
  *   **Generalization to k>2:** The Minimal Competence condition becomes E[p̄] > 1/k. Reliability of plurality requires analyzing the probability the most probable answer gets the most votes. This is inherently less robust than the binary case. Dependence and low competence (even if >1/k) become much bigger problems.

  **Conclusion:** PERA captures most of your intuitions by emphasizing the *expected average competence*, the *critical role of dependence* (via N_eff), and the requirement for *sufficient group size*. It resolves the correlated 0.51 case and the large independent 0.51 case cleanly. It forces a specific answer on the heterogeneous case (trust the majority for large N if E[p̄]>0.5 and low dependence), potentially differing from your initial intuition about the median. It highlights the inadequacy of simple majority/plurality for k>2 and for cases requiring a division of cognitive labor, predicting success only when aggregation respects the structure of expertise.
