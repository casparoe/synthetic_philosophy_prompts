       A: 5 in U vs 10 in E -> better in E.
       B: 5 in U vs 10 in E -> better in E.
       C: 20 in U vs 10 in E -> worse in E.

     So E is not Pareto superior to U (because C is worse off) and U is not Pareto superior to E (because A and B are worse off). 
     There is no Pareto dominance.

     Option L (Leveling-down): formed from U by making the better-off (C) worse off, but leaving the worse-off (A and B) unchanged.
