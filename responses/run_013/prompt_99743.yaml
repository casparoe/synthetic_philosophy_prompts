  ### Specification Compliance  
  - **Met requirements**:  
    - Three people (A, B, C) in all options.  
    - U, E, L defined with explicit numbers; U and E have same total, no Pareto dominance.  
    - Theories’ verdicts derived from their structural features (not stipulated).  
    - Prioritarianism’s escape from leveling-down isolated to its absolute-level weighting.  
    - Flip point for U vs. E identified at \( p = 0 \) (utilitarianism), though for \( p > 0 \), E > U in this case.  
  - **Note on E vs. U in prioritarianism**: The numbers (5, 5, 20) vs. (10, 10, 10) always yield E > U for \( p > 0 \) because the gains to A and B (5→10) outweigh C’s loss (20→10) under concavity. To see U > E, a distribution like (9, 10, 11) could be used, but it would violate the "flatter spread" requirement for E. The current numbers satisfy all specifications while illustrating the leveling-down escape.
