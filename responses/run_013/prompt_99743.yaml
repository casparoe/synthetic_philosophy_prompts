  ### Engineered Case: The Trio Distributions  
  Consider three individuals: A, B, and C. We define three well-being distributions:  
  - **Unequal (U)**: A = 5, B = 5, C = 20 (total = 30)  
  - **Equalized (E)**: A = 10, B = 10, C = 10 (total = 30)  
  - **Leveling-Down (L)**: A = 5, B = 5, C = 5 (total = 15)  

  **Properties**:  
  - U and E have identical total well-being (30) but E has a flatter spread.  
  - L is derived from U by reducing C's well-being (20 → 5) while leaving A and B unchanged (5).  
  - U and E are **not Pareto-comparable**:  
    - A and B are worse off in U (5 < 10), but C is worse off in E (20 > 10).  
  - L is **Pareto-inferior** to U: C is worse off (20 → 5), and no one is better off.  

  ---

  ### Verdicts of Distributive Theories  
  Assume well-being is cardinally measurable and interpersonally comparable.  

  #### 1. **Utilitarianism**  
     - **Value function**: Sum of well-being.  
     - **U**: 5 + 5 + 20 = 30  
     - **E**: 10 + 10 + 10 = 30  
     - **L**: 5 + 5 + 5 = 15  
     - **Ranking**: U = E > L  

  #### 2. **Egalitarianism**  
     - **Value function**: Disvalues inequality as such. Use a specific form: \( V = \text{total well-being} - k \cdot \text{variance} \), where variance is a penalty for inequality.  
       - Variance formula: \( \text{Var} = \frac{1}{n} \sum (w_i - \mu)^2 \) (with \( \mu = 10 \) for U, E; \( \mu = 5 \) for L).  
       - Set \( k = 0.2 \) (sufficiently large to prioritize equality; justified in note below).  
     - **U**:  
       - Mean (\(\mu\)) = 10  
       - Variance = \( [(5-10)^2 + (5-10)^2 + (20-10)^2]/3 = (25 + 25 + 100)/3 = 150/3 = 50 \)  
       - \( V_U = 30 - 0.2 \cdot 50 = 30 - 10 = 20 \)  
     - **E**:  
       - Variance = 0 (all at mean)  
       - \( V_E = 30 - 0.2 \cdot 0 = 30 \)  
     - **L**:  
       - Variance = 0  
       - \( V_L = 15 - 0.2 \cdot 0 = 15 \)  
     - **Ranking**: E (30) > U (20) > L (15)  
     - **Egalitarian commitment to leveling-down**:  
       - If we use a pure equality-focused metric (e.g., \( V = -\text{variance} \)), then E and L both have variance 0, while U has variance 50. Thus:  
         - \( V_U = -50 \), \( V_E = 0 \), \( V_L = 0 \) → E = L > U.  
       - This demonstrates the leveling-down objection: Egalitarianism ranks L (which harms C without benefiting A or B) above U solely due to equality gains.  

  #### 3. **Prioritarianism**  
     - **Value function**: Sum of a strictly increasing and strictly concave transformation of well-being. Use the isoelastic form:  
       \[
       f(w) = \begin{cases} 
       \frac{w^{1-p}}{1-p} & \text{if } p \neq 1 \\
       \ln(w) & \text{if } p = 1 
       \end{cases}
       \]  
       where \( p > 0 \) is the "priority parameter" (degree of concavity). Higher \( p \) gives more weight to the worse off.  
     - **Arithmetic** (compute for \( p = 0.5 \) and \( p = 1 \)):  
       - **U**: \( f(5) + f(5) + f(20) \)  
       - **E**: \( 3 \cdot f(10) \)  
       - **L**: \( 3 \cdot f(5) \)  

       | \( p \) | \( f(w) \)       | U                     | E                     | L                     | Ranking      |  
       |---------|------------------|------------------------|------------------------|------------------------|--------------|  
       | 0.5     | \( 2\sqrt{w} \)  | \( 2\sqrt{5} + 2\sqrt{5} + 2\sqrt{20} = 4\cdot2.236 + 2\cdot4.472 = 8.944 + 8.944 = 17.888 \) | \( 3 \cdot 2\sqrt{10} = 6\cdot3.162 = 18.972 \) | \( 3 \cdot 2\sqrt{5} = 6\cdot2.236 = 13.416 \) | E > U > L    |  
       | 1       | \( \ln(w) \)     | \( \ln(5) + \ln(5) + \ln(20) = \ln(500) \approx 6.215 \) | \( 3 \cdot \ln(10) \approx 3\cdot2.302 = 6.908 \) | \( 3 \cdot \ln(5) \approx 3\cdot1.609 = 4.827 \) | E > U > L    |  

     - **Key observations**:  
       - **L is always ranked below U**: For any \( p > 0 \) and strictly increasing \( f \), \( f(20) > f(5) \), so \( f(5) + f(5) + f(20) > 3f(5) \). Thus, U > L.  
       - **E vs. U flips at \( p = 0 \) (utilitarianism)**:  
         - At \( p = 0 \), \( f(w) = w \) → U = E = 30.  
         - For any \( p > 0 \), E > U in this case (due to the large gain for A and B from 5→10 outweighing C’s loss from 20→10 under concavity).  
       - **Behavior under concavity**:  
         - As \( p \) increases (more concavity), E’s advantage over U grows, but U always remains above L.  
         - **Escape from leveling-down**: Unlike egalitarianism, prioritarianism **never** ranks L above U because \( f \) is strictly increasing: reducing C’s well-being (20→5) lowers her transformed value, and no one gains.  

  ---

  ### Structural Audit  
  #### Why Prioritarianism Escapes Leveling-Down  
  - **Key feature**: The transformation \( f \) is **strictly increasing in absolute well-being**.  
    - This ensures that any reduction in a person’s well-being (without compensation to others) strictly lowers the prioritarian sum.  
    - In L, C’s well-being decreases from 20 to 5. Since \( f(20) > f(5) \), \( f(U) > f(L) \).  

  #### If the Feature Is Removed: Gap-Dependent Weighting  
  - **Modified view**: Suppose a person’s weight depends on their relative gap to others (e.g., \( V = \sum \left[ w_i - k \cdot |w_i - \mu| \right] \), where \( \mu \) is the mean).  
  - **Apply to U and L**:  
    - **U**: Mean \( \mu = 10 \).  
      \[
      V_U = 5 + 5 + 20 - k \left( |5-10| + |5-10| + |20-10| \right) = 30 - k(5 + 5 + 10) = 30 - 20k
      \]  
    - **L**: Mean \( \mu = 5 \).  
      \[
      V_L = 5 + 5 + 5 - k(0 + 0 + 0) = 15
      \]  
    - If \( k > 0.75 \), then \( 30 - 20k < 15 \), so \( V_L > V_U \).  
  - **Result**: The gap-dependent view ranks L above U for sufficiently large \( k \), reintroducing the leveling-down objection.  

  #### Scope of the Escape  
  - Prioritarianism escapes the leveling-down objection **outright** for any \( p > 0 \). The transformation’s strict monotonicity guarantees that L is never preferred to U.  

  #### Strongest Egalitarian Reply  
  - **Critique of prioritarianism**: By relying on absolute-level weighting, prioritarianism "cares less about the better-off" in a morally arbitrary way. For instance:  
    - In a choice between giving a **large benefit to a well-off person** (e.g., from 100 to 200) or a **small benefit to a worse-off person** (e.g., from 10 to 11), prioritarianism with \( p > 0 \) favors the latter, even if the gain to the well-off is enormous and they are not "super-rich."  
    - **Egalitarian alternative**: A view sensitive to both gaps and total well-being (e.g., \( V = \text{total} - k \cdot \text{inequality} \)) can avoid leveling-down (by setting moderate \( k \)) while still valuing large gains to the better-off when gaps are not extreme.  
  - **Rebuttal**: The egalitarian must still accept that L improves equality, which prioritarianism denies. Prioritarians argue that the absolute-level focus better captures the diminishing moral value of well-being, whereas gap-dependence risks fetishizing equality.  

