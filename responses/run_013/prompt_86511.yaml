prompt: |-
  A friend and I spent most of last night arguing about who deserves what, and I came away with a set of gut verdicts that I cannot get to line up under any single principle. I want you to tell me what principle, if any, captures them.

  Here are the cases and my verdicts. A surgeon performs a difficult operation flawlessly and saves a life: she deserves the fee and the praise. A lottery winner collects ten million dollars: he is entitled to the money but does not deserve it in the same sense; I would not say he earned it. A man inherits his father's fortune: same verdict, entitled but not deserved, though I do not think anyone may take it from him. A runner wins a race after years of training, and her closest rival trained just as hard but has a body that simply will not go as fast: I think the winner deserves to win, because the race is about who is fastest, not who tried hardest. Now the case that trips me up: a researcher grinds away for twenty years on a dead end and discovers nothing of value, while a colleague stumbles onto a genuine cure in a weekend by accident. I feel the grinder deserves something and the lucky one maybe deserves less, even though she produced vastly more good. And the mirror case: a woman with an extraordinary gift composes music effortlessly, almost without trying, that moves millions; I think she fully deserves her acclaim, effort or no effort. Finally, a con artist who works tirelessly at a fraud: I do not think he deserves anything but the punishment, and the effort does not count in his favor at all.

  I can feel these pulling in different directions. Is there a single principle, or a small set of them, that yields my verdicts — or close to them — and states exactly when effort matters, when contribution matters, and how desert differs from mere entitlement? Tell me what the principle implies for a case I have not considered — say, two people who jointly and equally produce a great good, one of whom could have done it alone — and be honest about which of my verdicts it cannot save. Please answer in American English.
reasoning: |-
  Okay, the user and their friend argued all night about who deserves what, and now they're looking for a principle that explains their gut feelings on different cases. They provided several scenarios with their verdicts, and they feel these might conflict. Let me start by listing out all their cases and their responses to identify patterns.

  First, the surgeon saves a life and deserves fee and praise. Effort and outcome both seem to matter here. Then lottery winner and inheritance: entitled but not deserved. So entitlement is legal, but desert is something more. Runner wins due to natural ability, not just effort—deserves to win. The grinder researcher puts in effort but no results, while the lucky one stumbles on a cure. The user feels the grinder deserves something, the lucky one less. But the composer with natural talent deserves acclaim without effort. Con artist's effort doesn't count in his favor.

  The key tensions are between effort, outcome, and inherent ability. The user is conflicted when effort doesn't lead to results (grinder) vs. when no effort leads to big results (lucky researcher). But in the composer's case, they're fine with acclaim without effort. So maybe inherent ability is a factor there. Also, the con artist shows that effort towards bad ends doesn't deserve reward.

  Looking for a unifying principle. Desert might be tied to praiseworthiness, which combines controllable factors and valued outcomes. The surgeon controls her skill and effort, leading to a good outcome. Lottery and inheritance involve no praiseworthy action. The runner's win is praiseworthy because she cultivated her ability. The grinder's effort is praiseworthy but lacks outcome, so maybe deserves recognition but not the same reward as success. The lucky researcher's outcome is valuable, but since it was accidental, less praiseworthy. The composer's talent, even if effortless, is praiseworthy because it's exceptional and contributes value. Con artist's effort is blameworthy.

  But the user thinks the grinder deserves something. How to reconcile that? Perhaps desert has different dimensions: moral praise vs. material rewards. The grinder deserves sympathy or recognition for effort, but not the same rewards as someone who produces results. The lucky researcher deserves some reward for the outcome but less praise than if it were earned.

  Testing with the joint production case: two people produce a great good, one could have done it alone. Both are entitled to agreed rewards, but desert? If both contributed equally in effort, both deserve equal acclaim. But if one contributed more skill, maybe they deserve more recognition. The principle would say both deserve acclaim if their controllable actions led to the outcome. If one's role was minor, less desert.

  The user's verdict on the grinder might not fully fit. The principle says desert requires valued outcomes, so the grinder doesn't deserve rewards for results but might deserve recognition for effort. The user wants the grinder to "deserve something," which the principle partially captures through moral credit but not material rewards. So there's a tension there that the principle doesn't fully resolve. The user needs to decide if desert is only for outcomes or if effort alone can warrant some form of desert, like respect or compensation. But their other cases prioritize outcomes or controllable factors, so the grinder case is the outlier. Maybe the user values effort intrinsically in some contexts but not others, leading to inconsistency. The principle clarifies that desert for material rewards requires outcomes, but effort can warrant moral esteem. That might be the best fit, even if it doesn't fully satisfy the grinder case.
answer: |-
  Based on your gut verdicts, a single principle *almost* captures them. I'd call it the **Praiseworthy Contribution Principle**:

  **A person deserves reward, acclaim, or positive regard (distinct from mere entitlement) when they make a valuable contribution to a valued domain (like health, art, competition, or knowledge) through actions or traits that are praiseworthy – meaning they reflect skill, effort, character, or cultivated talent under their control, aimed at the goals of that domain.**

  **Why this fits your verdicts:**

  1.  **Surgeon:** Makes a valuable contribution (saved life) using praiseworthy elements (skill, effort, cultivated talent).
  2.  **Lottery Winner / Inheritor:** Makes no *praiseworthy contribution*. They get money (entitlement), but it's unrelated to skill, effort, or valuable output. No desert.
  3.  **Race Winner:** Makes the valued contribution (winning/fastest time). This stems from praiseworthy elements – cultivated talent & effort (training) under her control, aimed at the domain's goal (being fastest). The rival also has praiseworthy effort, but the *winning contribution* belongs to the one who was fastest.
  4.  **Lucky Researcher:** Makes a massive valuable contribution (cure). However, the praiseworthy element (effort, skill *aimed* at discovery) is minimal or absent – it was accidental. She *deserves* significant reward (due to the contribution's value) but *less acclaim/praise* than if she'd earned it through praiseworthy means. The principle separates *reward for outcome* from *acclaim for praiseworthiness*.
  5.  **Grinding Researcher:** Demonstrates significant praiseworthy elements (effort, dedication, skill *aimed* at discovery). However, he makes *no valuable contribution* to the domain (no discovery). He deserves *sympathy, respect for his dedication, and perhaps continued opportunity*, but **not** the *specific rewards/acclaim reserved for successful contributions* (e.g., the Nobel Prize, massive royalties). This is where your gut ("deserves *something*") is partially but not fully captured (see "Where it diverges").
  6.  **Gifted Composer:** Makes a highly valuable contribution (moving music). This stems directly from her *talent*, which, even if effortless, is a praiseworthy *trait* she possesses and utilizes (it's "hers" and under her control to employ). The domain (art) values the *output*, and her talent is the praiseworthy source. Effort isn't required for praiseworthiness if the valuable trait/skill is innate but authentically expressed.
  7.  **Con Artist:** Makes a *negative* "contribution." While he demonstrates effort and skill, these are *blameworthy* (aimed at fraud, harming others), not praiseworthy. He deserves punishment, not reward.

  **How Effort, Contribution, and Control Interact:**

  *   **Contribution Matters:** Desert requires a *valuable outcome* within the relevant domain (winning, saving a life, creating art, discovering a cure, *getting money via lottery* isn't a "valued contribution" in the same sense).
  *   **Praiseworthiness Matters:** The contribution must be linked to something *under the agent's control* that we admire (skill, effort, cultivated talent, virtuous character in pursuit of the goal).
  *   **Effort is a Component, Not the Whole:** Effort is praiseworthy *when it's part of generating a valuable contribution* (Surgeon, Runner) or *demonstrates admirable dedication even without success* (Grinder - deserving respect, not results). Effort *without* a positive contribution or *towards* a bad end (Con Artist) doesn't create positive desert. Effort *isn't necessary* if the valuable contribution flows directly from a praiseworthy, controlled trait like genius (Composer).
  *   **Control is Key:** Desert hinges on linking the contribution to factors the agent can reasonably be credited *for* (their choices, their development of skill, their use of talent). Luck breaks this chain (Lottery, Lucky Researcher's discovery method).

  **Testing the Principle: The Joint Production Case**

  *   **Case:** Two people jointly and equally produce a great good (e.g., a revolutionary invention). One could have done it alone; the other was a necessary and competent partner in the actual process.
  *   **Principle's Verdict:** Both deserve significant reward and acclaim. Why?
      *   **Valuable Contribution:** Both were essential to the *actual* production of the good. The *potential* of one to do it alone is irrelevant to the *actual* contribution made jointly.
      *   **Praiseworthiness:** Both presumably contributed praiseworthy effort, skill, and dedication *to the joint project* that achieved the result. They collaborated effectively towards the shared goal.
      *   **Entitlement vs. Desert:** If contracts specify equal shares, they are *entitled* to them. The principle says they also *deserve* acclaim and reward based on their praiseworthy roles in the valuable outcome. The one who *could* have done it alone might deserve *additional* acclaim for their individual genius, but the partner still deserves acclaim for their essential and praiseworthy role in the *actual* achievement.

  **Where the Principle Diverges Slightly from Your Gut (And Why):**

  *   **The Grinding Researcher:** Your gut says he "deserves something." The principle awards him *respect and moral esteem* for his praiseworthy effort and dedication (the "something" he deserves), but **denies him the material rewards or acclaim reserved for successful contributions**. It argues that desert for *results* (money, prizes, major acclaim) requires the *actual valuable result*. His praiseworthiness earns him a different, lesser kind of regard.
      *   *Can it be saved?* Only by weakening the requirement for a *valuable contribution* – but that would break the verdicts on the Lottery Winner (no contribution) and potentially elevate effort alone to the level of the Surgeon's result, which you don't seem to want. Your gut wants *something* for the Grinder, but likely not the *same thing* as the Lucky Researcher. The principle accounts for this distinction.

  **Conclusion:**

  The **Praiseworthy Contribution Principle** – linking desert to valuable outcomes achieved through factors under the agent's control that we admire (skill, effort, cultivated talent) – captures the vast majority of your intuitions across these diverse cases. It cleanly distinguishes *entitlement* (legal/moral right to possession) from *desert* (earned merit for praiseworthy achievement). It explains when effort matters (when it's part of generating the contribution), when it doesn't (Composer), why luck undermines desert (Lottery, Lucky Researcher's method), and why bad intent negates it (Con Artist).

  The main tension point is the Grinding Researcher. Your gut wants him to deserve *more* than just moral esteem for his effort; you want some tangible "something." The principle argues that tangible rewards and major acclaim are reserved for those whose praiseworthy qualities *actually produce* the valued good. This tension highlights a real philosophical divide: whether supreme effort *in pursuit of* a valuable goal deserves significant reward *in itself*, even if it fails. Your other verdicts suggest you lean towards requiring the successful outcome for that kind of desert. The principle makes that boundary explicit.
