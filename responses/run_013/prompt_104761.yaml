answer: |-
  You've put your finger on a profoundly difficult dilemma that cuts to the heart of professional ethics, personal sacrifice, and institutional responsibility within the state education system. Let's break it down, keeping both perspectives in mind while addressing your core questions.

  **1. Was your colleague doing something she was required to do?**

  *   **Plainly, no.** Her actions were unequivocally **beyond any requirement**. The evidence is clear:
      *   **No Contractual Obligation:** It wasn't in her contract.
      *   **No Remuneration:** She wasn't paid for it.
      *   **Beyond Working Hours:** It happened on Saturdays and through holidays – well outside standard teaching hours and term time.
      *   **Voluntary & Discretionary:** She initiated and maintained this programme entirely off her own bat.
  *   Her motivation was clearly altruistic, driven by a desire to support disadvantaged pupils ("the nearby estate"). This is admirable, but it doesn't convert voluntary action into a professional *requirement*. She was performing an act of significant **supererogation** – doing far more than duty demands.

  **2. Does this settle what the rest of you owe?**

  *   **Not directly, no.** This is where the conflict arises, and both your colleagues have valid points, though they represent different ethical frameworks:
      *   **Colleague 1 (We Ought to Help):** Focuses on **consequences and need.** The vulnerable children benefiting from this programme will lose out significantly if it stops abruptly. The cost to each of you (a couple of hours weekly for a term) is presented as manageable. This is a **utilitarian/consequentialist** argument – the good achieved (helping children) outweighs the burden.
      *   **Colleague 2 (Cannot Become a Demand):** Focuses on **principle, precedent, and fairness.** Her sacrifice was *exceptional* precisely because it wasn't required. Turning that exceptional, voluntary act into a *demand* on others (even temporarily) is unjust. It risks exploiting goodwill, setting a dangerous precedent where unpaid, extra-contractual work becomes expected ("unilaterally rewritten all our obligations"). This protects professional boundaries and prevents burnout. It's a **deontological/rights-based** argument – focusing on duty, fairness, and the rules of engagement.
  *   **Your Nagging Worry:** This is crucial. You admire her *because* she went beyond the call of duty. Yet, refusing to step in feels like betraying the very children she sought to help, potentially undermining the *value* of her sacrifice. This tension is real. It highlights that while her *act* wasn't required, the *need* it addressed is genuine and ongoing. Declining doesn't make you *wrong* in the contractual sense, but it might feel like failing the spirit of communal care she embodied.

  **Addressing "Both Cannot Be Right":**

  This sense is understandable, but it *might* be the mistake in framing. Both positions can hold truth simultaneously, reflecting different priorities:

  1.  **Colleague 2 is factually correct:** There is **no legal, contractual, or inherent professional obligation** for any of you to cover this programme. You cannot be *required* to do so. Her original work was definitively beyond her duty.
  2.  **Colleague 1 identifies a real moral pull:** There **is** a strong ethical *argument* (based on pupil welfare, fairness to disadvantaged children, and supporting a valued colleague in need) for *choosing* to help. It would be a *good* and *compassionate* thing to do.

  **The mistake might lie in seeing this as purely about "duty" or "no duty."** It's more accurately about:

  *   **Recognising Voluntary Charity vs. Imposed Obligation:** What she did was charity. Covering it *could* be an act of charity by others. The danger is when charity morphs into expectation.
  *   **Weighing Competing Goods:** Pupil welfare vs. protecting staff from unsustainable demands and maintaining fair workload boundaries.
  *   **Institutional Failure:** The unspoken element here is that the *school* or *local authority* has likely failed these pupils for years, relying on one individual's extraordinary charity. The *real* obligation arguably lies with the institution to fund and staff such essential support properly.

  **A Possible Path Forward (Beyond "Ought" vs. "Obligation"):**

  Instead of seeing it as a binary (cover fully vs. refuse entirely), consider these steps as a department:

  1.  **Acknowledge Both Truths:** Start by agreeing she wasn't required to do this, *but* the programme has value and her illness creates a problem for the pupils.
  2.  **Assess Realistic Capacity:** Can the department collectively offer *some* temporary cover? Perhaps scaled-back hours, or a rota where people volunteer slots *only if genuinely willing and able*? Frame it as a *collective goodwill gesture* towards the colleague and pupils, *not* an obligation.
  3.  **Set Strict Boundaries:** Agree this is strictly for *one term*. Make it clear this establishes no precedent. Document this agreement.
  4.  **Demand Institutional Support:** **This is critical.** The department should collectively approach senior leadership *now*. Explain the situation:
      *   A valued colleague ran this vital programme voluntarily for years.
      *   Due to illness, the department is providing *temporary, voluntary* cover for Term X only as a stopgap.
      *   The school/local authority *must* use this term to find a sustainable, *properly resourced* solution (e.g., securing funding for paid tutors, integrating support into existing structures, partnering with charities). Emphasise that relying on unpaid goodwill is unsustainable and unfair.
  5.  **Honour the Colleague:** Make it clear your actions (whether covering or not) are motivated by respect for *her* dedication and a desire to protect her legacy for the pupils, while ensuring the solution is fair and sustainable for all staff.

  **In Summary:**

  *   **She was not required to do it.** Full stop.
  *   **This does NOT automatically mean you are required to cover it.** Her sacrifice doesn't create a debt for others.
  *   **However, there is a powerful *ethical case* for offering *voluntary*, *temporary* support as a stopgap,** driven by concern for the pupils and support for your colleague.
  *   **The crucial step is shifting the burden:** Your colleague shouldered it alone for years. If the department helps temporarily, it must be **explicitly temporary and used as leverage to force the institution to finally take proper responsibility.** Otherwise, the cycle of exploitation (of goodwill) simply continues, and your second colleague's fears become reality.
  *   **Your unease stems from recognising both the profound value of her act *and* the danger of normalising unsustainable demands.** The resolution lies not in choosing one absolute truth over the other, but in finding a practical, time-limited, collective response that honours the spirit of her work while firmly placing the long-term solution where it belongs: with the school system itself. Refusing *can* be justified, but exploring a collective, bounded, temporary effort combined with demanding institutional change might alleviate the feeling of letting the children down while protecting your colleagues' legitimate concerns.
