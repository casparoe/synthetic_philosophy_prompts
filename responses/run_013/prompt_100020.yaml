  Hmm... this is delightfully niche. The challenge is crafting a joke that lands only if you've truly wrestled with these theories. The social practice theory (think Rawls/Searle) says the wrong is against the institution itself. The assurance theory (Scanlon) focuses on violating the promisee's claim-right created by assurance. The reliance theory (maybe Atiyah) cares about harm from induced dependence. 

  For the joke, I need a scenario where these come apart cleanly. How about a promise where: 1) no social practice exists (undermining practice view), 2) the promisee is incapable of understanding reliance (undermining reliance), but 3) assurance was clearly given (supporting Scanlon). An AI promise? No, too contemporary. 

  Aha! A man promising his comatose wife to water her orchids, but secretly knowing she'll never wake up. The practice theorist says "no social context = no obligation"; the assurance theorist says "you violated her claim!"; the reliance theorist shrugs because she can't experience disappointment. That isolates the fault lines. 

  Punchline: "...so technically, it's fine?" with the wife's eyebrow twitch as the kicker. The humor comes from the theories giving opposite verdicts in an ethically uncomfortable case. 

  For the note: The liberties are that pure assurance theory might still call it binding even without practice/reliance - which is hotly debated. Competent scholars disagree here. But everyone agrees reliance requires actual psychological states, so her coma defeats that view cleanly. If the group thinks reliance works here, they're confused. 

  The user will appreciate how the coma scenario weaponizes the "no expectations possible" case they mentioned. And the eyebrow twitch makes it darkly funny while respecting their "no philosopher jokes" rule. Perfect.
