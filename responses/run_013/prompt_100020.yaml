  Here's a joke crafted for your group, exploiting the precise seam between assurance and reliance theories, with a nudge towards the practice view:

  **The Setup:**
  Bernard visits his wife, Mildred, in the nursing home. She has advanced, irreversible dementia. She doesn't recognize him, can't hold a conversation, and shows no sign of understanding complex ideas. Feeling a pang of guilt for rarely visiting, Bernard leans close to her unresponsive form and whispers, "Mildred, my dear, I promise I'll come see you every single Sunday from now on." Bernard knows full well Mildred can't comprehend this, won't remember it, and will form no expectation based on it. He leaves, resolving to visit more often... but life gets busy. He misses the next Sunday, and the one after that.

  **The Punchline:**
  Six months later, Bernard confesses his broken promise to his philosopher friend, Herbert. Herbert looks horrified. "Bernard! You *promised*! That's a terrible wrong!" Bernard, baffled, replies, "But Herbert, who did I wrong? Mildred never knew I promised, never expected me, and wasn't disappointed when I didn't come. She's utterly unaware! How could she possibly have been harmed?" Herbert pauses, strokes his chin, and says, "Ah, Bernard, but you gave her your *assurance*. That created the claim *itself*. The wrong wasn't in disappointing her expectations... it was in making a solemn commitment and then *reneging on the assurance you freely gave*, regardless of whether she could ever hold you to it!"

  ---

  **The Note on Theoretical Liberties & Live Disagreements:**

  1.  **The Seam Exploited:** The core humor relies entirely on the clean split between **Reliance Theory** and **Assurance Theory** regarding *what constitutes the wrong*.
      *   **Reliance Theory:** Bernard is correct *by this theory's strictest reading*. If the wrong lies in inducing harmful reliance or disappointing reasonable expectations, Mildred (incapable of comprehension, memory, or expectation formation) *cannot* be wronged. No reliance = no harm = no wrong *to her*. The joke highlights the counter-intuitive consequence: breaking a promise seems permissible if the promisee is unaware.
      *   **Assurance Theory:** Herbert articulates the core Assurance view (à la Scanlon). The wrong is the violation of the normative claim created *by the act of assurance itself*. Mildred's cognitive state is irrelevant to the *creation* of the obligation. The wrong is in Bernard violating the trust *he invited* by uttering the promise, even if Mildred couldn't accept the invitation. Herbert's horror stems from seeing the act of promising as morally generative independently of consequences.
      *   **Practice Theory:** It lurks in the background. One *could* argue the obligation exists because Bernard invoked the social practice (even privately), and breaking it weakens the practice. However, the joke doesn't lean hard on this; Herbert pins the wrong specifically on the assurance-violation, not practice-undermining.

  2.  **Liberties Taken & Contested Ground:**
      *   **Liberty with Assurance Theory:** The joke assumes Mildred, as the named promisee, is the *sole* holder of the claim created by the assurance, even if unaware. Some Assurance theorists *might* argue the claim only meaningfully exists if the promisee could *potentially* understand it *at the time it was made* (though Mildred couldn't). This is a live debate edge case *within* Assurance theory about the minimal conditions for claim-creation. Herbert represents a strong version where the utterance *itself* creates the claim.
      *   **Liberty with Reliance Theory:** The joke uses the strictest "actual reliance/expectation" version. Some Reliance theorists might argue Bernard *should have known* his promise *could* become known (e.g., via a nurse) and induce reliance indirectly, or that promises create a *duty of care* regardless of immediate expectations. However, the core intuition of Reliance Theory *is* grounded in the promisee's actual psychological state being harmed.

  3.  **Settled vs. Contested (Among Scholars):**
      *   **Settled (Among Competent Scholars):** Everyone agrees that in **standard cases** (promisee comprehends, remembers, and relies), breaking a promise is wrong. Everyone agrees that Reliance theory *emphasizes* the harm of disappointment, Assurance theory *emphasizes* the violation of the created claim, and Practice theory *emphasizes* the damage to the social institution. They agree these are distinct *mechanisms* proposed for generating the obligation.
      *   **Live, Contested Disagreement:** The **precise conditions** under which each theory generates an obligation, and crucially, **whether an obligation exists *at all*** in edge cases like Bernard's, is **genuinely contested ground** among philosophers working on promising. Assurance theorists debate the minimal epistemic conditions for claim-creation. Reliance theorists debate the role of potential vs. actual reliance and duties of care. Practice theorists debate the scope and applicability of the convention. *Your group's feeling of the positions collapsing into each other likely stems from not fully confronting these edge cases where the theories yield starkly different verdicts, like this one.* Bernard's case is designed to pry them apart. Herbert's punchline lands *only* if you grasp Assurance theory's claim that the obligation arises purely from the act of assuring, irrespective of the promisee's awareness or capacity for reliance.

  The humor lies in Bernard's perfectly logical Reliance-based defense clashing violently with Herbert's Assurance-based moral intuition, revealing the deep, unresolved theoretical fault line in a darkly absurd scenario. Enjoy your final session!
