  We are drafting a joint statement for an adversarial collaboration between two camps in the naturalization of mental content: teleosemantics and indicator semantics. The statement must include:
  1. A numbered list of agreed claims, without either camp conceding their core positions.
  2. A table of disagreements, with neutral crux, teleosemantic position, indicator-semantic position, and a diagnostic case for each (with predictions). We must include at least one case with selection history but no current reliable correlation, and one with current reliable correlation but no selection history.
  3. A conclusion where I, as the drafter, take a stand on which disagreements are merely verbal and which are substantive.

  Let me structure the response accordingly.

  ### Joint Statement of Adversarial Collaboration: Teleosemantics and Indicator Semantics

  #### 1. Points of Agreement
  Both camps agree on the following:

  1. **Mental content is real and naturalizable.** Mental states have representational content, and this content can be explained in naturalistic terms without appeal to supernatural or non-physical properties.

  2. **The need for explaining misrepresentation.** Any adequate theory of content must account for the possibility of misrepresentation: the fact that a mental state can represent something that is not the case.

  3. **Content must be causally relevant.** The content of a mental state should play a role in explaining behavior, particularly successful behavior. For example, a belief that leads to successful action in virtue of its content is a key explanandum.

  4. **Content is not limited to humans.** A theory of content must be applicable to non-human animals and possibly to artificial systems, as long as they exhibit appropriate cognitive capacities.

  5. **Rejection of purely internalist accounts.** Both camps reject accounts that fix content solely by intrinsic properties of the state (e.g., narrow content) without reference to the environment or history.

  6. **Rejection of eliminativism and non-naturalism.** We reject views that deny the reality of mental content or that hold it cannot be naturalized.

  7. **Rejection of disjunctivism about content.** We reject views that treat veridical and non-veridical cases as having fundamentally different kinds of content.

  #### 2. Table of Disagreements

  We now turn to the key disagreements. For each, we provide:
  - A neutral statement of the crux.
  - The teleosemantic position as they would phrase it.
  - The indicator-semantic position as they would phrase it.
  - A diagnostic case, agreed upon as bearing on the crux, with each side's prediction.

  | Neutral Crux                                                                 | Teleosemantic Position                                                                                    | Indicator-Semantic Position                                                                                               | Diagnostic Case                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   | Teleosemantic Prediction                                                                 | Indicator-Semantic Prediction                                                                 |
  | :--------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------- |
  | **What fixes content?** Is content fixed by selection history or by current reliable correlation? | Content is fixed by the teleological function of the state, which is determined by its selection history. A state represents what it was selected to indicate. | Content is fixed by the actual or idealized reliable causal-informational relation between the state and what it tracks. Teleology is either unnecessary or does no independent work. | **Case A: The Expired Detector.** A biological detector (e.g., a frog's visual system for detecting flies) has a selection history for detecting flies. Due to environmental change (e.g., pollution), it now reliably triggers in the presence of small black pebbles but never in the presence of flies (which are now absent). The state is still produced, but only by pebbles.                                                                                                                                   | Content remains "fly" because that is what it was selected for. Misrepresentation occurs when pebbles trigger it. | Content is now "small black pebbles" because that is what it reliably tracks. There is no misrepresentation; it accurately represents pebbles. |
  | **Is teleology necessary?** Can there be representation without a selection history? | Representation requires a selection history because only then can there be a norm (a "supposed to") that grounds misrepresentation. | Representation can arise without selection history if there is a reliable causal-informational relation (actual or idealized). Teleology is not necessary. | **Case B: The Accidental Detector.** An artificial system (e.g., a robot) is randomly assembled by lightning striking a junkyard. It has a state that, by sheer chance, reliably correlates with the presence of water (e.g., its sensor activates only when water is present). It has no selection history; it was not designed or evolved for any purpose.                                                                                                                                                           | No content: Without selection history, there is no function and hence no representation. | Content is "water": The state reliably carries information about water and can misrepresent (e.g., if activated without water in idealized conditions). |
  | **What grounds the normativity of content?** What makes it the case that a state ought to indicate something? | The normativity comes from the teleological function: a state ought to indicate what it was selected to indicate. | Normativity is grounded in the reliable correlation under ideal conditions. A state ought to indicate what it would indicate in conditions where the correlation holds without interference. | **Case C: The Driftwood Frog.** A frog is born with a mutation that causes its visual system to respond to small moving dots (like flies) but also to stationary black spots. There is no selection history for this trait (it's a new mutation). In its environment, it reliably responds to both flies and spots, but only flies are nutritious. The frog often snaps at spots, which is not nutritious.                                                                                                           | The state has no content because the trait has no selection history. No function, no norm. | The state has the content "fly or spot" because that's what it reliably tracks. Misrepresentation does not occur because it accurately represents both. But if we idealize (e.g., in conditions without spots), it might represent flies. |
  | **How to handle cases of malfunction?** How does the theory account for states that fail to perform their indicative role? | Misrepresentation occurs when the state is tokened in circumstances that are not the one it was selected for, even if it reliably correlates with something else. | Misrepresentation occurs when the state is tokened without the presence of the condition it reliably correlates with in ideal conditions. If the correlation is broken (reliably), then the content may change. | (This is covered in Cases A and B, but we can note it as a general point.)                                                                                                                                                                                                                                                                                                                                                                                                                                       |                                                                                          |                                                                                               |

  Note: We have included two cases: Case A (selection history but no current reliable correlation) and Case B (current reliable correlation but no selection history).

  #### 3. Evaluation of Disagreements: Verbal vs. Substantive

  As the drafter of this joint statement, I now take a stand on which disagreements are merely verbal and which are substantive.

  - **What fixes content?** This is substantive. The two camps disagree on the fundamental basis of content. The diagnostic cases (A and B) show that the theories make different predictions about the same scenarios. This is not just a matter of defining terms; it reflects a deep divergence in what they take to be the necessary and sufficient conditions for content.

  - **Is teleology necessary?** This is also substantive. The indicator-semantic camp holds that teleology is not required, while teleosemantics holds it is indispensable. The Accidental Detector case (B) is a clear test: if the randomly assembled robot has representational states, then teleosemantics is false in its necessity claim. This is a factual disagreement about the conditions under which representation arises.

  - **What grounds the normativity of content?** This is substantive as well. The source of normativity (why a state should indicate something) is a core issue. Teleosemantics roots it in evolutionary history, while indicator semantics roots it in ideal conditions of correlation. The Driftwood Frog case (C) tests this: if the frog's state has normative content without selection history, then teleosemantics is challenged.

  However, I judge that **none of the listed disagreements are merely verbal**. Both camps use terms like "representation" and "content" with the same broad intent (to capture the aboutness of mental states and the possibility of error). The disputes are about the conditions under which such content arises and what grounds its normative dimension. The diagnostic cases are designed to elicit divergent predictions, which demonstrates that the disagreements are not terminological but reflect different theoretical commitments about the world.

  That said, it is possible that in some sub-disputes, there might be verbal elements (e.g., what counts as "ideal conditions" in indicator semantics might be contested), but at the core, the disagreements are substantive. Both camps are trying to account for the same phenomena (success, error, etc.) but offer different explanations.

  Therefore, I conclude that all the listed disagreements are substantive and that the adversarial collaboration should focus on empirical and conceptual tests (like the diagnostic cases) to resolve them.
answer: |-
  ### Joint Statement of Adversarial Collaboration: Teleosemantics and Indicator Semantics  

  #### 1. Points of Agreement  
  Both camps endorse the following claims, formulated to avoid presupposing either theory’s core commitments:  
  1. **Mental content is real and naturalizable.** Content is an objective feature of certain physical states, explicable without appeal to non-natural properties (e.g., irreducibly normative facts or Cartesian dualism).  
  2. **Misrepresentation must be explained.** A successful theory must account for how a state can represent inaccurately (e.g., a false belief or perceptual error), without collapsing into disjunctivism or eliminating error.  
  3. **Content explains successful behavior.** Content properties must be causally relevant to the explanation of adaptive or goal-directed behavior in organisms (e.g., avoiding predators or finding food).  
  4. **Content extends beyond humans.** The theory must apply to non-human animals and simple systems (e.g., frogs or robots), without requiring linguistic abilities or human-like cognition.  
  5. **Rejection of internalism.** Content is not fixed solely by intrinsic properties of the state or system; it depends constitutively on external factors (e.g., environmental correlations or historical context).  
  6. **Rejection of behaviorist/eliminativist approaches.** Content cannot be reduced to dispositions to behave, nor eliminated as illusory.  
  7. **Rejection of “magical” theories.** Theories relying on unexplained primitives (e.g., intrinsic intentionality or non-causal relations) are ill-posed and inadmissible.  

  #### 2. Table of Disagreements  
  The following table outlines unresolved disputes. Each row presents:  
  - **Neutral Crux**: The core issue in theory-neutral language.  
  - **Teleosemantic Position**: Stated as proponents would accept.  
  - **Indicator-Semantic Position**: Stated as proponents would accept.  
  - **Diagnostic Case**: A novel, agreed-upon scenario bearing on the crux, with both camps’ predictions.  

  | Neutral Crux | Teleosemantic Position | Indicator-Semantic Position | Diagnostic Case | Teleosemantic Prediction | Indicator-Semantic Prediction |  
  |--------------|------------------------|------------------------------|-----------------|--------------------------|-------------------------------|  
  | **What is the primary ground of content?** Does content derive from historical selection or current/informational relations? | Content is fixed by the state’s teleological function: what it was evolutionarily selected to indicate. Misrepresentation occurs when the state is tokened outside its selected conditions. | Content is fixed by reliable causal-informational covariation (actual or idealized). Teleology is redundant; covariation alone suffices for content and error. | **Case A: The Arctic Moth (Selection history, no current correlation)**<br>Moths in a species evolved to produce a neural state S when detecting lichen (their sole food). Due to rapid climate change, lichen is extinct. S is now only triggered by visually similar rocks, which are toxic. S occurs reliably with rocks, never with lichen. | Content is “lichen” (its selected function). S misrepresents rocks as lichen. | Content is “rocks” (reliable current covariation). S does not misrepresent; it accurately tracks rocks. |  
  | **Can content exist without selection history?** Is teleology necessary for representation? | Selection history is necessary for content. Without a function (a “proper function”), there is no norm to ground misrepresentation. | Content requires only reliable covariation (under actual or ideal conditions). Selection history is unnecessary; novel or accidental systems can possess content. | **Case B: The Lightning Sand (Current correlation, no selection history)**<br>A sandstone formation, shaped by random lightning strikes, develops a resonance state R that vibrates precisely when rain is imminent (due to humidity changes). R correlates reliably (99.9%) with rain in its desert environment. The formation has no evolutionary or design history. | No content: R lacks a teleofunction, so it has no “ought” and cannot misrepresent. | Content is “rain” (reliable covariation). R misrepresents if vibrated without rain (e.g., in a lab humidity test). |  
  | **What anchors the normativity of misrepresentation?** What makes a tokening “incorrect”? | Normativity arises solely from failure to perform a selected function: misrepresentation is malfunction. | Normativity arises from failure of covariation under ideal epistemic conditions (e.g., no interference). Teleology adds no explanatory value. | **Case C: The Decoy Frog (Divergent norms)**<br>A frog’s visual state F evolved to detect flies (nutritious). In a new environment, F is triggered identically by flies (5% of cases) and decoy drones (95%). Frogs gain no nutrition from drones. Ideal covariation holds only in noise-free conditions (absent drones). | Content is “fly.” F misrepresents drones as flies (function failure). | Content is “fly-or-drone” (actual covariation). No misrepresentation unless covariation fails in ideal conditions. |  

  #### 3. Evaluation of Disagreements: Verbal vs. Substantive  
  I judge the disputes as follows:  
  - **"What is the primary ground of content?"** is **substantive**. The diagnostic cases (A and B) yield divergent empirical predictions (e.g., Case A’s moth state has lichen-content per teleosemantics but rock-content per indicator semantics). Resolving this requires evidence about how content-dependent behavior (e.g., moth eating rocks) is explained, not semantics.  
  - **"Can content exist without selection history?"** is **substantive**. Case B’s lightning sand shows a clean split: teleosemantics denies content exists here, while indicator semantics affirms it. This hinges on whether covariation alone can sustain norms—a factual question about natural possibility.  
  - **"What anchors the normativity of misrepresentation?"** is **merely verbal**. Both camps agree norms exist (e.g., Case C’s frog state can be “wrong”) but define “normativity” differently: teleosemantics ties it to historical success conditions, indicator semantics to ideal covariation. This reduces to whether “normativity” requires etiology—a terminological choice with no empirical consequences (both predict the frog’s drone-triggered state is “defective”).  

  **Why the split?** The first two cruxes concern *what facts constitute content* and are empirically testable via Cases A and B (e.g., does the moth’s behavior manifest “lichen”-directed goals?). The third crux is a meta-dispute about labeling “normativity,” with no impact on predictions about behavior or error. Thus, the core substantive divide is whether history or covariation is explanatorily primary, while the normativity debate dissolves under conceptual clarification.
