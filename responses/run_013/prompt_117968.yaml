      - Settle by: Showing that in a critical scenario, an agent with imprecise credences refuses to gather free evidence that would be clearly beneficial to a sharp agent, and that refusal leads to a worse outcome.

   5. **Ellsberg as Bias** (attacks part 3: the rationality of the Ellsberg preference)
