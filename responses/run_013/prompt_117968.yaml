      - Settle by: An argument that dilation leads to unacceptable consequences in a real decision problem (e.g., an agent who dilates becomes vulnerable or makes terrible decisions).

   4. **Value of Evidence** (attacks part 1 and part 2: do we always value evidence? and does the set narrow with evidence?)
      - Kind: Internal tension / formal result
