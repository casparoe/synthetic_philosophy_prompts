prompt: |-
  Ok so I'm in this metaethics seminar and we've spent like four weeks on evolutionary debunking arguments, and now we have to hand in a proposal for our final 5000-word paper by next friday. I have a half-formed idea and I want you to turn it into the actual proposal document.

  Here's the idea. The standard debunking argument runs something like: the evolutionary explanation of why we have the moral beliefs we have doesn't mention the moral truths, therefore those beliefs aren't tracking anything. Fine, I get the shape of it. But whats been bugging me is that the evolutionary explanation being invoked is always really general. Selection didn't only shape our beliefs about cooperation and kin and fairness — it shaped the whole machinery we use to form normative beliefs at all, including the machinery we use when we do epistemology. So I want to ask: does the debunking argument need a narrow premise (the selection pressures were specifically about the content of our moral beliefs) or a broad one (selection shaped our normative faculties in general, moral and epistemic alike)? My hunch is it needs the narrow one to do any real damage to moral realism, but the story evolution actually tells you is the broad one. And if you take the broad premise seriously, it looks like it also undermines the epistemic norms the argument itself has to rely on, which would make it self-undermining. So there's a dilemma, and I think one horn is way worse than the other, but I honestly can't tell yet which one I should be pushing.

  What I want from the proposal: state the question so that it actually has a determinate answer. Right now I can't tell whether I'm asking something about the reliability of a faculty, something about the justification of particular beliefs, or something about whether realism is true — help me pin that down and pick one. Then say why the usual moves don't already settle it (the third-factor style replies, the move where you say you can't debunk the very thing you need in order to run the argument, the minimalist-realism line that just lowers the bar for what the evolutionary story has to explain). Then lay out the method — what I'd actually do, week by week or section by section across the semester, and why that approach rather than just running the argument against one more target. Then say what a result would look like, what would count as me being wrong or the project failing, and whether this is even doable in 5000 words or whether I should shrink it to one horn of the dilemma.

  Also please don't put in a bibliography or citations — our prof wants those in the final paper, not the proposal, and I'll fill them in myself. Just refer to the positions and arguments by description. Keep it to like two pages. Thanks!
