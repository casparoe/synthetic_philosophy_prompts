  Okay, let me approach this step by step. The user is a software engineer drawing parallels between data modeling and philosophical concepts about verbal disputes, specifically using the Pluto reclassification case as a test. 

  First, I need to unpack the core question: Is the Pluto debate a merely verbal dispute? The user wants two things analyzed - the episode through metaontology lenses, and what the episode reveals about the theory itself.

  Looking at the historical context: Pluto was classified as a planet based on early 20th century understanding. The 2006 IAU definition introduced three criteria, with "clearing its orbit" being the contentious point that excluded Pluto. Crucially, some scientists preferred a geophysical definition instead. This suggests the dispute centers on definitional priorities rather than physical facts.

  Applying the standard verbal dispute test: If both sides agreed on all physical facts (size, orbit, composition etc.), would they still disagree? The answer seems yes - because their core disagreement is about which criteria should define "planet". Like two database schemas with different unique keys for the same dataset.

  The institutional stipulation aspect is interesting. The IAU didn't discover an existing meaning but created one through voting. This challenges the typical verbal dispute model which assumes pre-existing meanings. The framework needs to accommodate that definitions can be actively negotiated.

  Regarding the public reaction: Their "loss" sentiment reflects affective dimensions the theory doesn't address - showing how classifications carry cultural weight beyond semantics. This reveals a limitation in purely linguistic analyses.

  For the reverse analysis: The case strongly supports the verbal dispute theory's core premise - the disagreement persists even with full factual agreement. But it also exposes gaps: the theory doesn't handle institutional authority in meaning-making, nor the emotional stakes of reclassification.

  The key insight is that while the Pluto case fits the verbal dispute pattern beautifully, it simultaneously stretches the theory by introducing legislative and social dimensions. The user's schema analogy is apt - it's about which constraints to enforce on the cosmic database, not about the data itself.
answer: |-
  Your analysis bridges data modeling and philosophy elegantly—let's dissect the Pluto reclassification through the lens of verbal disputes and metaontology, then evaluate what it reveals about the theory.

  ### Part 1: Analysis as a Verbal Dispute in Metaontology  
  **Disputants & Positions:**  
  1. **IAU Faction (Orbital-Dynamic View):**  
     - **Meaning of "planet":** A body that (a) orbits the Sun, (b) is rounded by gravity, (c) *dominates its orbital zone* (clearing neighboring debris).  
     - **Goal:** A taxonomy reflecting dynamical hierarchy (e.g., distinguishing dominant "kings" from minor bodies).  

  2. **Planetary Scientists (Geophysical View):**  
     - **Meaning of "planet":** Any gravitationally rounded body orbiting a star (or free-floating). *Physical properties* (shape, geology) define planethood, not orbital context.  
     - **Goal:** Classification based on intrinsic nature (e.g., Pluto shares geophysics with "planets").  

  3. **The Public:**  
     - Not disputants in the *technical* sense but stakeholders in *cultural ontology*. "Planet" carried historical/nostalgic weight (e.g., Pluto as cultural icon). Their "loss" reflects affective attachment to a *folk category*, not scientific criteria.  

  **Core Disagreement: Facts vs. Framing?**  
  - **Shared Facts:** All agree on Pluto's physical traits (size, composition, orbit).  
  - **Divergence:** Whether "clearing the orbit" is *essential* to "planet." The IAU prioritizes dynamical role; geophysicists prioritize form.  
  - **Verbal Dispute Test:** If both sides accepted all physical/orbital data *and* agreed on the definition, disagreement vanishes.  
    - *Your Schema Analogy:* Translating claims into a unified schema (e.g., tagging bodies with `is_rounded`, `cleared_orbit`, `orbits_star`) shows no conflict in *data rows*—only in which tags warrant the `planet` label.  

  **The Stipulation Wrinkle:**  
  - Standard verbal dispute theory assumes pre-existing meanings. Here, the IAU *created* a stipulative definition via vote. Metaontology (e.g., Carnap’s "linguistic frameworks") accommodates this:  
    - **Framework Adoption:** Choosing a definition is *pragmatic*—e.g., "Which taxonomy best serves planetary science?" (IAU: dynamic stability; Geophysicists: comparative planetology).  
    - **Resolution by Fiat:** The vote didn’t "discover" meaning but *selected a framework*. This fits metaontology if we see frameworks as tools (not truths).  

  **Verdict:** The dispute is **merely verbal** under the standard test. The stipulation reinforces this: it’s a choice of conceptual schema, not empirical discovery.  

  ---

  ### Part 2: What the Episode Reveals About the Theory  
  The Pluto case **supports but complicates** verbal dispute theory:  

  1. **Supports the Core Claim:**  
     - The persistence of disagreement *after* factual agreement (e.g., 2008 MIT conference where both sides accepted data but not classification) confirms the linguistic nature. Your "common schema" test holds: no new data would resolve it.  

  2. **Exposes Limitations:**  
     - **Authority & Power:** The theory doesn’t address *who gets to stipulate*. The IAU’s institutional authority (vs. planetary scientists’ expertise) influenced outcome—a sociological layer beyond semantics.  
     - **Affective Dimensions:** The public’s grief highlights that categories carry *non-linguistic stakes* (identity, culture). Verbal dispute theory is silent on why reclassification *feels* like loss.  
     - **Pragmatic Depth:** The dispute wasn’t *just* about words but *scientific utility*. Geophysicists argue orbital criteria ignore exoplanet comparisons; IAU claims dynamism clarifies solar system structure. This is framework choice based on *goals*, not pure semantics.  

  3. **Suggests a Refinement:**  
     - Theory might better ask: **"Under which pragmatic framework is this category useful?"** rather than *only* "Is this verbal?" The Pluto debate is verbal *and* about which framework serves science best.  

  ---

  ### Conclusion: A Nuanced Fit  
  - **Verbal?** Yes—disagreement hinges on definitional priorities, not facts.  
  - **But:** Stipulation, authority, and affective stakes reveal dimensions the theory underplays. It successfully identifies the dispute’s core as linguistic but doesn’t fully model *how* such disputes resolve (e.g., voting) or their emotional weight.  
  - **Your Schema Insight:** Perfect analogy. Like choosing whether `is_planet` should be a computed column (`cleared_orbit = TRUE`) or a base property (`is_rounded = TRUE`). The data doesn’t change—the schema does. 

  This case doesn’t break metaontology but shows its focus on semantics needs pairing with pragmatics (goals, power, affect) for a full picture. The theory’s silence on these isn’t a flaw—it’s a boundary.
