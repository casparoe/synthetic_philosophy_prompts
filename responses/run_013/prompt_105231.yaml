prompt: |-
  I sit on a campus committee that has just approved an automated attendance system, and the experience has made me want to teach the politics of artifacts in a way students feel rather than recite. I run a 90-minute session for about 16 upper-level undergraduates in a philosophy of technology course. Design a classroom activity that makes them feel the force of the claim that artifacts have politics, but not through the well-worn bridge example, and keep the artifact low-tech—a door, a queue, a form—so the politics is in the arrangement, not the electronics. Build it around two ideas I want them to encounter as lived constraints rather than labels: that a design can inscribe a political settlement into ordinary use, and that a tool can undergo what I can only call reverse adaptation, where the ends it was meant to serve get reshaped to fit the tool. The activity should move from a design choice that quietly excludes some participants, to a use that unexpectedly redistributes power, to a moment where the artifact starts dictating the group's goals. Include roles, materials, a scoring or payoff scheme that doesn't need real money, a timeline, and a debrief that maps what happened onto those two ideas. Also tell me what will predictably go wrong the first time I run it, and be frank about which feature of the idea the activity cannot reproduce and that I will have to supply in discussion.
reasoning: |-
  We are designing a classroom activity for 16 upper-level undergraduates in a philosophy of technology course. The goal is to make students feel the force of the claim that artifacts have politics, focusing on two ideas:
   1. A design can inscribe a political settlement into ordinary use (quietly excluding some participants).
   2. Reverse adaptation: the ends the tool was meant to serve get reshaped to fit the tool (the artifact starts dictating the group's goals).

   We want to avoid high-tech examples and use a low-tech artifact. We choose a **door** as our artifact because it is simple and ubiquitous, yet can embody exclusion and power dynamics.

   Activity Title: "The Door Game"

   Overview:
   Students will engage in a simulation where they must design and use a door for a shared space (e.g., a library study room). The activity will have three phases:
    1. Design Phase: Groups design a door system for the room, considering inclusivity and exclusion.
    2. Use Phase: They experience using the door under constraints that reveal power dynamics and redistribution of power.
    3. Reverse Adaptation Phase: The door design starts to influence the group's goals (e.g., changing the purpose of the room).

   We'll use roles to assign different abilities and constraints to students, and a scoring system based on "points" that represent successful access to the room and completion of tasks.

   Roles (for 16 students, we divide into 4 groups of 4, but note that within each group, roles are assigned individually):

    - **Group A**: 4 students with no physical constraints.
    - **Group B**: 4 students who must use a wheelchair (simulated by having them sit in a chair that they cannot leave, and must wheel around the room).
    - **Group C**: 4 students who are blindfolded (simulating visual impairment).
    - **Group D**: 4 students with one arm tied behind their back (simulating mobility impairment).

   Alternatively, to avoid any discomfort with simulating disabilities, we can frame the constraints as temporary and arbitrary for the game, and emphasize that it's about experiencing barriers.

   However, note: Simulating disabilities can be problematic. Instead, we can assign constraints that are not tied to real-world disabilities but still create barriers. For example:

    - **Group A**: No constraints.
    - **Group B**: Must wear oven mitts (limiting dexterity).
    - **Group C**: Must wear glasses smeared with petroleum jelly (simulating blurred vision).
    - **Group D**: Must stand on a small platform (like a balance board) and cannot step off (simulating balance issues).

   But we want the politics to be clear. Alternatively, we can use non-physical constraints that are social or role-based:

    - **Group A**: Librarians (have keys to the room and control access).
    - **Group B**: Students with a heavy backpack (must carry a backpack full of books and cannot set it down).
    - **Group C**: Students with a time constraint (they have a "class" in 5 minutes and must leave the room quickly).
    - **Group D**: Students who are "in a hurry" (they have a timer and must complete a task in the room within 2 minutes).

   However, we want the artifact (door) to be the focus. So let's stick with physical constraints but frame them as temporary and not intended to mock any group.

   Revised constraints (using props that are not associated with disabilities):

    - **Group A**: No constraints.
    - **Group B**: Must wear ski gloves (thick gloves that limit fine motor skills).
    - **Group C**: Must wear vision-impairing goggles (like those that simulate cataracts or blur, or use swim goggles with vaseline).
    - **Group D**: Must wear a knee brace that prevents them from bending one knee (or tie one leg to a straight splint, but be safe) OR must carry a large, fragile object (like a tray with cups of water) that requires both hands and thus they cannot use one hand for the door.

   We must prioritize safety and avoid any risk of injury. So let's avoid leg braces and instead:

    - **Group D**: Must carry a large box (empty but bulky) that requires both hands, so they cannot use their hands to open the door.

   Alternatively, we can have:

    - **Group D**: Must wear a large backpack that is very bulky and limits their turning radius.

   After consideration, we decide:

    - **Group A**: Unimpaired.
    - **Group B**: Thick gloves (like oven mitts) - difficulty turning knobs or handling small handles.
    - **Group C**: Blurred vision goggles (or if not available, use a piece of wax paper taped over safety glasses) - difficulty seeing signs or handles.
    - **Group D**: Must carry a large, empty cardboard box (about 2x2 feet) that they cannot set down until they are in the room - both hands occupied.

   Materials:
    - A door (could be a real classroom door or a mock door set up in the room).
    - Props for constraints: 
        - Ski gloves or oven mitts (4 pairs).
        - Blurred vision goggles (4) or wax paper and tape to make them.
        - Large cardboard boxes (4, empty and light).
    - Signage materials (paper, markers, tape).
    - Stopwatch or timer.
    - Scoreboard (whiteboard or large paper).
    - Task cards (for the activity inside the room).

   Setting:
    - The classroom will have a designated area as the "room" (the shared space). We can use an area separated by a real door or set up a mock door (using a table, a curtain, or a freestanding door frame if available). 

   Timeline (90 minutes total):
    - Introduction (10 min)
    - Design Phase (15 min)
    - Use Phase (20 min)
    - Reverse Adaptation Phase (20 min)
    - Debrief (25 min)

   Detailed Steps:

   1. Introduction (10 min):
      - Explain the concept of the politics of artifacts: how the design of everyday objects can include or exclude, and how they can shape our behavior and goals.
      - Introduce the activity: They will design and use a door for a shared study room. The goal is to maximize access and efficiency for all users.
      - Assign roles: Divide the class into four groups (A, B, C, D) and assign each group their constraint. Explain that these constraints are temporary and for the purpose of the activity.

   2. Design Phase (15 min):
      - Each group must design a door system (the door itself, the handle, the way it opens, any signs, etc.) for the shared room. They can use any materials available (paper, markers, tape) to create signs or modify the door (if using a mock door, they can attach things to it).
      - The design must be agreed upon by the entire class (all 4 groups). They must come to a consensus.
      - The instructor should note: The design process itself will likely involve power dynamics and exclusion. Some groups may not be able to participate fully in the design discussion because of their constraints? (But we don't impose constraints during design phase? Or do we? Let's impose the constraints during the use phase only. During design, they are in their groups but without the constraints? We want the design to be made without the constraints being active, so that the designers might overlook the needs of the constrained groups.)

      Alternatively, we can have the design phase without constraints and then impose constraints during use to reveal the problems. But that might reinforce the idea that designers don't consider diverse users.

      Revised: 
        - During the design phase, the groups are together, but the constraints are not yet imposed. However, each group is assigned to represent a particular constraint. So they are aware of the constraints that will be in place during use.
        - They must design a door that works for everyone. They have 15 minutes to design and build (if mock door) or describe (if real door) their solution.

      Note: We expect that the design will likely favor Group A (unimpaired) and might not fully consider the others.

   3. Use Phase (20 min):
      - Now, the constraints are imposed. Each group must enter the room one at a time to complete a task. The task: once inside, they must write down a quote from a book that is placed on a table in the room (the quote is the same for everyone and is provided on a sheet). They then exit and hand the paper to the instructor. 
      - The catch: they must enter and exit the room under their constraint. 
      - Scoring: 
          - Each successful entry, task completion, and exit within 2 minutes earns 1 point for the group.
          - If they drop the box (Group D) or remove their constraint, they fail that attempt.
          - Each group has 4 attempts (one per member) but they can help each other.

      The instructor times each attempt and records points.

      We expect that the design might cause problems for Groups B, C, and D. For example:
        - A round doorknob might be hard for Group B (gloves).
        - A push/pull sign might be hard to read for Group C (blurred vision).
        - Group D (carrying the box) might not be able to open the door without setting down the box, but they are not allowed to set it down.

      This phase reveals how the design, which was intended to be inclusive, might still exclude or disadvantage some.

   4. Reverse Adaptation Phase (20 min):
      - Now, we change the goal. The original purpose of the room was to be a quiet study space. But because the door is causing so much trouble, the class decides to change the room's purpose to avoid the door problems. 
      - The instructor announces: "The library administration has noticed that the door is causing delays and conflicts. They propose to change the room into a storage room, so that only librarians (Group A) need to enter. The other groups can use a different, smaller room that is easier to access but has fewer resources."
      - The class must vote on whether to accept this change. But note: the vote is weighted by the points each group earned in the previous phase. Group A has 4 points (they had no problem), while the others may have fewer. So Group A has 4 votes, Group B has (say) 2 votes, etc. 
      - The vote is on: 
          Option 1: Keep the room as a study room and fix the door (but that would require redesign and time).
          Option 2: Change the room to a storage room and assign the smaller room as the study room (which is less desirable: it has no windows and only half the space).

      We expect that Group A, with the most votes, will push for Option 2 because it doesn't affect them (they are librarians and can still access the storage room). The other groups might not have enough votes to stop it.

      This phase shows reverse adaptation: the tool (the door) is so problematic that the goals (having a good study space) are changed to fit the tool (by downgrading the study space and making the room a storage room).

   5. Debrief (25 min):
      - Start by asking the students about their experience: 
          - How did the design phase go? Were all groups' needs considered?
          - How did it feel to use the door with constraints?
          - How did the scoring (points) affect the groups' ability to influence the vote?
          - How did the door problem lead to changing the room's purpose?

      - Map the experience to the two concepts:
          a) Inscribing political settlement: The door design was a settlement among the groups. Even if intended to be inclusive, it might have excluded some. This is like real-world design choices that embed power structures (e.g., who gets to design? who is considered?).
          b) Reverse adaptation: The door problem became so central that the group changed their goals (the purpose of the room) to accommodate the door.

      - Discuss: 
          - How might this happen in real life? (e.g., campus buildings that are inaccessible lead to disabled students not using them, which then leads to those students being marginalized in activities that take place there.)
          - How does the artifact (door) have politics? (It distributes power: who can enter easily, who can control access, etc.)

      - Finally, connect to the automated attendance system: 
          - How might such a system inscribe a political settlement? (e.g., assuming every student has a smartphone or reliable internet, or that they are always in the classroom at the exact time.)
          - How might it lead to reverse adaptation? (e.g., the goal of education becomes about attendance metrics rather than learning, or class schedules are changed to fit the system's capabilities.)

   What will predictably go wrong the first time:
     - The constraints might not be equally effective or might be uncomfortable. Some students might not take them seriously.
     - The design phase might take too long, especially if there is disagreement.
     - The use phase might be chaotic if multiple groups are trying to go at once. (We do one at a time.)
     - The reverse adaptation phase might feel forced. Some students might not see the connection to politics.

   What the activity cannot reproduce and must be supplied in discussion:
     - The activity uses temporary, artificial constraints. In real life, the exclusion is persistent and has cumulative effects on people's lives. We must discuss how the politics of artifacts can lead to systemic inequality over time.
     - The vote in the reverse adaptation phase is a simulation of power dynamics, but in reality, the redistribution of power is often more subtle and institutionalized. We must highlight that artifacts can entrench power without a formal vote.

   Let's adjust the constraints to be less about disability and more about arbitrary barriers? But we want the politics of exclusion. We might have to accept that the simulation of barriers is necessary and handle it with sensitivity.

   Alternative: Use social roles without physical constraints? For example:

    - Group A: Librarians (they have the key and can open the door for others, but they are busy and can only help if they are free).
    - Group B: Students with a lot of books (must carry a stack of books and cannot set them down).
    - Group C: Students who are in a hurry (they have a timer and must get in and out in 30 seconds).
    - Group D: Students who are shy (they cannot speak to the librarian to ask for help).

   But then the door artifact is less central. We want the door to be the barrier.

   After careful thought, we will use the physical constraints but with clear framing at the start that these are temporary and for the purpose of the activity, and that we are not trying to simulate the lived experience of disability but rather to experience the barriers that can be created by design.

   Final note: Be prepared for the possibility that the activity may be emotionally charged for some students. Have a plan to address any discomfort and to transition respectfully into the debrief.

   Revised Timeline with adjusted constraints and steps:

    Phase          | Time | Activity
    -------------- | ---- | --------
    Introduction   | 10   | Explain activity, assign groups and constraints (without imposing them yet). 
    Design Phase   | 15   | Groups design the door together. They are aware of the constraints that will be in place during the use phase.
    Use Phase      | 20   | One by one, each student attempts to enter the room under their constraint, complete the task, and exit. Scoring: 1 point per successful attempt.
    Reverse Adapt  | 20   | Announce the vote on changing the room's purpose. Weight votes by points. Hold the vote and reveal the outcome.
    Debrief        | 25   | Guided discussion mapping the experience to the two concepts.

   We will use the constraints:

    - Group A: No constraints.
    - Group B: Thick gloves (must keep them on).
    - Group C: Blurred vision (goggles with wax paper or vaseline).
    - Group D: Must carry a large box (both hands occupied).

