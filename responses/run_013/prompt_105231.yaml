answer: |-
  ### Classroom Activity: **The Politics of the Door**

  #### **Activity Title:** The Inclusive Door Challenge  
  **Duration:** 90 minutes  
  **Participants:** 16 students (4 groups of 4)  
  **Core Concepts:**  
  1. **Inscribed Exclusion:** Design choices embed political settlements (e.g., who is included/excluded).  
  2. **Reverse Adaptation:** Tools reshape goals to fit their constraints.  

  ---

  ### **Materials**  
  - **Door Props:** 1 real door (classroom door), 1 freestanding mock door (e.g., PVC frame with cardboard).  
  - **Constraints Kit:**  
    - **Group A:** Noise-canceling headphones (simulate auditory exclusion).  
    - **Group B:** Elbow braces (limit arm mobility; fabric straps).  
    - **Group C:** Opaque glasses (simulate low vision; sunglasses with tape).  
    - **Group D:** Heavy textbooks (must carry at all times; 2 per person).  
  - **Task Cards:** 4 cards with timed challenges (e.g., "Retrieve a blue book from the shelf").  
  - **Scoring Tokens:** Colored chips (10 per group; represent "access points").  
  - **Whiteboard:** Track scores and phase transitions.  

  ---

  ### **Timeline**  
  1. **Introduction (10 min):** Frame the activity around "designing a door for a campus study room." Explain roles and scoring.  
  2. **Phase 1: Design & Exclusion (20 min)**  
  3. **Phase 2: Power Redistribution (20 min)**  
  4. **Phase 3: Reverse Adaptation (20 min)**  
  5. **Debrief (20 min)**  

  ---

  ### **Roles & Constraints**  
  Assign each group a constraint *before* design begins. Groups must advocate for their needs:  
  - **Group A:** "Sound-sensitive users" (headphones block sound).  
  - **Group B:** "Limited mobility users" (elbow braces restrict reach).  
  - **Group C:** "Low-vision users" (opaque glasses blur vision).  
  - **Group D:** "Burdened users" (must carry heavy books).  

  ---

  ### **Activity Flow**  

  #### **Phase 1: Design & Exclusion (20 min)**  
  - **Task:** Groups collaborate to design *one* door system (real door + mock door).  
    - **Rules:**  
      - Must include a "security feature" (e.g., latch, sign, weight mechanism).  
      - No verbal communication during design—mimics exclusion of non-dominant voices.  
  - **Exclusion Mechanism:**  
    - Groups B/C/D face constraints *while designing* (e.g., Group C can’t read whiteboard sketches).  
  - **Scoring:** Groups earn tokens for "contributing ideas," but only unimpaired students (Group A) can award them.  
  - **Predictable Issue:** Group A dominates; others struggle to participate. Token distribution skews toward A.  

  #### **Phase 2: Power Redistribution (20 min)**  
  - **Task:** Groups use the door to complete timed challenges (e.g., "Deliver a book to the instructor in 60 seconds").  
  - **Power Shift:**  
    - **New Rule:** Groups must use *each other’s doors* (Group A uses mock door; others use real door).  
    - **Constraint Impact:**  
      - Group A (headphones) can’t hear verbal warnings about door hazards.  
      - Group D (carrying books) can’t open heavy doors.  
  - **Scoring:** Groups lose tokens for delays/failures. Tokens can be "traded" for hints (e.g., Group C trades tokens to Group B for mobility help).  
  - **Predictable Issue:** Groups hoard tokens; alliances form. Group B (mobility) gains power as a "helper."  

  #### **Phase 3: Reverse Adaptation (20 min)**  
  - **Task:** Complete a group task (e.g., "Arrange chairs in a circle").  
  - **Tool Dictates Goals:**  
    - **New Rule:** The door’s "security feature" becomes mandatory (e.g., latch must be used even if inefficient).  
    - **Twist:** Instructor adds arbitrary constraints (e.g., "Only users with tokens may touch the door").  
  - **Reverse Adaptation:** Groups abandon the circle goal to focus on token collection/door rules.  
  - **Scoring:** Tokens become the *only* measure of success.  
  - **Predictable Issue:** Groups ignore the circle task; tokens become the de facto goal.  

  ---

  ### **Debrief (20 min)**  
  Guide students to connect the activity to the two core concepts:  

  | **Activity Moment**         | **Concept**                  | **Discussion Prompts**                                                                 |
  |-----------------------------|------------------------------|----------------------------------------------------------------------------------------|
  | **Phase 1: Token bias**     | Inscribed Exclusion          | "How did the design process silence some groups? What real-world systems work this way?" (e.g., stairs excluding wheelchair users). |
  | **Phase 2: Token trading**  | Power Redistribution         | "Why did Group B gain influence? How did the door *redistribute* power unexpectedly?" (e.g., queues privileging early arrivals). |
  | **Phase 3: Token obsession**| Reverse Adaptation           | "Why did you abandon the circle task? When have tools reshaped *your* goals?" (e.g., social media metrics dictating content). |

  **Key Connection:**  
  - The door’s design (e.g., latch placement) embedded exclusion (Phase 1).  
  - Its use redistributed power (Phase 2), then hijacked goals (Phase 3).  

  **Bridge to Attendance System:**  
  > "Like our door, the automated attendance system seems neutral. But what exclusions might it embed? (e.g., non-smartphone users). How might it reshape class goals? (e.g., prioritizing attendance over engagement)."  

  ---

  ### **Predictable Challenges**  
  1. **Phase 1 Stalemate:** Groups may design a "lowest common denominator" door (e.g., no security feature).  
     - **Mitigation:** Require a security feature; remind them constraints persist.  
  2. **Token Hoarding:** Groups may refuse to trade tokens, stalling Phase 2.  
     - **Mitigation:** Introduce a "time tax" (lose tokens if idle).  
  3. **Reverse Adaptation Confusion:** Students may not realize they’ve abandoned the goal.  
     - **Mitigation:** Explicitly pause to ask, "What is your priority right now?"  

  ### **What the Activity Cannot Reproduce**  
  **The Gradual Entrenchment of Reverse Adaptation**  
  - In real life, tools reshape goals *slowly* (e.g., attendance systems shifting focus from learning to compliance over months/years). The activity compresses this into 20 minutes, risking a "gotcha" feel.  
  - **Solution:** In debrief, contrast the activity’s speed with real-world examples:  
    > "In class, you felt the tool hijack your goals abruptly. But in reality, it’s a slow creep—like a campus prioritizing attendance metrics over pedagogy. How might we spot this earlier?"  

  ---

  ### **Why This Works**  
  - **Low-Tech, High-Impact:** A door’s politics are visceral (e.g., struggling to open it).  
  - **Lived Constraints:** Students *feel* exclusion (e.g., blurred vision) rather than debating it.  
  - **Reverse Adaptation Visible:** Token scoring warps priorities undeniably.  

  This design makes politics *tangible*—students don’t just discuss exclusion; they fight a door to experience it.
