  For the dualism question: Since both egoism and utilitarianism recommend cultivating trustworthiness here, this might look like reconciliation. But Sidgwick would likely see it as a lucky coincidence in this specific case, not a solution to the fundamental dualism problem. 

  Where his views are unclear: 
