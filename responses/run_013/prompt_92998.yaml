prompt: |-
  Ok so this is a weird one, but stick with me. My flatmate Sam has zero interest in politics as a subject — she's a radiographer, she's never read a book about any of this, she thinks I'm a massive nerd for caring — but she has incredibly firm views about who should be allowed to vote, and we've been going back and forth about it for about two years. Her record so far, as best I can keep track:

  - Compulsory voting in general elections: yes. Her thing is that if your on the list you should have to turn up, otherwise the people who care the most just decide everything for everyone else.
  - Votes at 16: yes. She says a 16 year old has to live with these governments way longer than she does.
  - Non citizens who are permanent residents — here ten years, working, paying tax: yes.
  - Our neighbour, been on the street fifteen years with no papers, works cash in hand, three kids in the local school: yes, and she got genuinely annoyed when I pushed back. Apparently he's got more riding on what the council does than half the people already on the roll.
  - Her cousin who moved to Australia twelve years ago and still keeps a UK address so he can vote here: no. He doesn't live here, he doesn't deal with the schools or the bins, that whole speech.
  - Her mate who's inside for another two years: yes. He's from here, his mum's here, he's coming back out.

  Now the council's got a consultation open and I honestly cannot work out what she'll say about it. Two things in the proposal: (a) people who own property or run a business in the city but live somewhere else entirely would get a vote in local elections, and (b) anyone who's moved here from abroad would have to wait five years before they can vote locally, even though they're living here and paying council tax the whole time.

  What does she say to those two? And the thing I actually want: whats the rule she's running? When I ask her she just says its obvious and wont say more than that. I want to know what other rules would fit everything she's said just as well, which one she's most likely actually on, and which one extra case would settle it — because right now we just go round in circles and I'd like to win at least once.
reasoning: |-
  Okay, let me try to figure out Sam's voting rules based on her previous positions. She has clear but seemingly contradictory views. 

  First, her stances: compulsory voting for those registered, votes at 16, non-citizens with long-term residency can vote, undocumented neighbor should vote, expat cousin shouldn't, and incarcerated friend should. The council proposals are about non-resident property owners voting and a 5-year wait for new immigrants.

  Looking for a unifying principle. "Stake in the community" seems too vague. "Subject to daily governance" fits better. For example:
  - 16-year-olds are affected by long-term policies
  - Permanent residents and undocumented neighbors deal with local services
  - The expat cousin isn't subject to daily life here
  - Incarcerated person will return and is still connected

  Testing this against the council proposals:
  1. Non-resident property owners: They have financial stakes but aren't subject to daily governance. Likely she'd say no vote.
  2. 5-year wait for immigrants: Since they're living here and paying taxes immediately, the 5-year wait contradicts her previous support for residents. She'd probably oppose the wait.

  Alternative principles like reciprocity or territorial presence don't fit as well. To confirm, a case like a British citizen living abroad temporarily might help - she'd likely say no if they're not currently subjected to local governance.

  So the core seems to be current subjection to local governance consequences. That's probably Sam's rule.
answer: |-
  Based on Sam's pattern of views, here's a breakdown of her likely positions on the council proposals and the underlying principle she's operating on:

  ### 1. **Sam's Likely Stance on the Council Proposals**
     - **(a) Non-resident property/business owners voting:**  
       **She says NO.**  
       *Why?* These people don't *live* with the consequences. Her rejection of her expat cousin (who has a UK address but lives in Australia) shows she prioritizes physical presence and daily engagement with local services (bins, schools, etc.). Owning property or a business is a financial stake, not a lived experience of the community. She’d see this as "outsiders" dictating local life without bearing the day-to-day burdens.

     - **(b) 5-year voting wait for new immigrants:**  
       **She says NO.**  
       *Why?* This clashes directly with her support for her undocumented neighbor (who has no papers but lives there) and permanent residents. Her logic is: if you’re *here*, paying taxes, using services, and raising kids locally, you’re immediately invested. A 5-year wait would strike her as arbitrary and unfair—especially since she backed her neighbor who’s "got more riding on the council" than registered voters.

  ---

  ### 2. **Sam's Unspoken Rule**
  She’s consistently applying a **"Subject to Daily Governance" (SDG) principle**:  
  > **People should vote if they are *directly and currently subjected* to the practical, daily consequences of the government they’re voting for—regardless of legal status, age, or citizenship.**  

  #### How SDG explains all her positions:
  - **Compulsory voting:** If you’re on the list (i.e., deemed subject to governance), you must participate.  
  - **Votes at 16:** 16-year-olds are affected by schools, public transport, youth services, and future policies.  
  - **Permanent residents & undocumented neighbor:** They pay taxes, use roads/bins/schools, and live under local laws *now*.  
  - **Expat cousin:** No daily subjection—he’s not dealing with "the bins or schools."  
  - **Incarcerated friend:** Still connected to the community (family there, returning), and prison conditions/policies affect him directly.  

  #### Why other frameworks *don't* fit:
  - **"Stake in the community"** → Too broad. Doesn’t explain why the expat cousin (with financial/cultural ties) is excluded.  
  - **"Legal citizenship"** → Contradicted by her support for non-citizens and undocumented residents.  
  - **"Reciprocity" (pay taxes = vote)** → Fails on votes at 16 (minors don’t pay income tax) and the incarcerated friend (may not pay taxes while inside).  
  - **"Territorial presence"** → Explains most, but not compulsory voting (which is procedural). SDG covers it by framing registration as accepting governance duties.  

  ---

  ### 3. **Extra Cases to Settle the Debate**
  To test the SDG principle vs. alternatives, hit her with these:  
  - **"A British citizen who moved to Spain 10 years ago but still owns a London flat and visits for 2 weeks a year. Should they vote in UK elections?"**  
    *SDG prediction:* Sam says **NO**. They aren’t subjected to daily UK governance (NHS waits, council cuts, etc.).  
    *Why it’s decisive:* If she says yes, she’s prioritizing ownership/citizenship over lived experience—contradicting her "expat cousin" stance.  

  - **"A 17-year-old homeless person with no fixed address. Should they vote locally?"**  
    *SDG prediction:* Sam says **YES**. They’re deeply affected by local policies (housing, policing, social services).  
    *Why it’s decisive:* If she hesitates, she’s secretly privileging formal residency over actual subjection to governance.  

  ---

  ### Why You’re Going in Circles
  Sam thinks this is "obvious" because she’s intuitively judging each case on *immediate lived impact*, not abstract principles. To "win":  
  1. **Acknowledge her core insight** ("You care about whether people actually *live* with the results, right?").  
  2. **Use the SDG label**—it gives her logic a name, making it feel less arbitrary.  
  3. **Deploy the expat or homeless test cases**—they force contradictions if she strays from SDG.  

  This isn’t about politics; it’s about **fairness in lived experience**. Once you frame it that way, you might finally get her to admit there *is* a rule—and you’ve cracked it.
