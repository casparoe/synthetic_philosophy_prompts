answer: |-
  Here’s a defensible 3-year research sequence prioritizing tractability, conceptual upstreamness, and transformative potential for historical reclassification, grounded in your constraints (no empirical budget, philosophical focus):

  ### **Year 1: Core Legitimacy & Absorption**  
  **Question:** *Is "right but early" ever a legitimate epistemic verdict (vs. face-saving), and how does absorption (conditionalization) undermine or preserve a theory's core claims?*  
  - **Why first?**  
    - **Upstream fundamentality:** Until we establish whether "right but early" is coherent (and when absorption is rationally permissible), other strategies lack a philosophical anchor.  
    - **Tractability:** Pure conceptual work: analyze "theory identity" (what makes a theory the *same* theory after modification?) and distinguish *legitimate conditionalization* (e.g., specifying scope conditions) from *ad hoc absorption* (e.g., adding unfalsifiable excuses).  
    - **Transformative potential:** Resolving this reclassifies historical cases (e.g., Malthusians who added "absent tech innovation” clauses vs. those who didn’t). If absorption is always degenerative, "right but early" collapses into "wrong."  
  - **Evidence shift:** If case studies reveal theories surviving *only* via post-hoc conditionalization (e.g., Marxists adding "except in these 10 countries"), legitimacy weakens. If historical theories *pre-specified* testable background conditions (rare!), "right but early" gains plausibility.

  ### **Year 2: Horizon Drift & Testability**  
  **Question:** *Under what conditions (if any) is horizon drift (extending deadlines) epistemically justifiable rather than an evasion of falsification?*  
  - **Why second?**  
    - **Builds on Year 1:** Requires the legitimacy framework from Year 1. Horizon drift is absorption’s *temporal cousin*—both modify auxiliary assumptions to avoid falsification.  
    - **Tractability:** Focus on *epistemic responsibility*: When is extending a deadline rationally warranted (e.g., new evidence of slower causal mechanisms) vs. dogmatic (e.g., infinite deferral)? Uses conceptual tools (e.g., Bayesian updating, Lakatosian heuristics) without new data.  
    - **Historical impact:** Clarifies cases like climate models (delayed tipping points) vs. failed millenarian cults (perpetual rescheduling). Distinguishes science from pseudoscience.  
  - **Evidence shift:** If historical theories that drifted horizons *later* succeeded (e.g., continental drift → plate tectonics), drift gains credibility. If drift *always* precedes abandonment, it’s likely face-saving.

  ### **Year 3: Delayed Confirmation & Evidential Thresholds**  
  **Question:** *What constitutes sufficient evidence to believe a failed prediction might still occur later (delayed confirmation), and how does this differ from faith?*  
  - **Why last?**  
    - **Requires prior framework:** Depends on Year 1 (legitimacy) and Year 2 (temporal boundaries). The hardest question—demands criteria for "reasonable belief in delay."  
    - **Tractability:** Analyzes *evidential thresholds*: When does counter-evidence (e.g., no Malthusian collapse in 200 years) outweigh mechanistic plausibility? Engages with induction/problem of induction.  
    - **Historical reclassification:** Directly judges Malthusian cases: is resilience today (e.g., ecological overshoot arguments) rational or motivated reasoning?  
  - **Evidence shift:** If "delayed" predictions *systematically fail* even after long periods (e.g., 300+ years), the strategy is suspect. If they often succeed (e.g., neutrino detection), it strengthens delayed confirmation’s validity.

  ---

  ### **Why This Order?**  
  1. **Conceptual dependency:** Legitimacy (Y1) underpins evaluation of absorption/drift (Y2), which sets boundaries for delayed confirmation (Y3).  
  2. **Tractability gradient:** Y1 is purely analytic; Y2 adds temporal complexity; Y3 confronts deepest uncertainty (assessing future evidence).  
  3. **Historical payoff:**  
     - Y1 reinterprets *past* theory-modifications (e.g., was neoclassical economics "absorbing" crises?).  
     - Y2 re-evaluates *ongoing* debates (e.g., supersymmetry in physics after LHC null results).  
     - Y3 reshapes *future* judgments (e.g., long-termism in ethics/policy).  
  4. **"Face-saving" concern:** Addressed head-on in Y1. If "right but early" is deemed *never* legitimate, the project pivots to explaining its rhetorical appeal.

  ### **Key Moves for "Right but Early" Legitimacy**  
  For the verdict to hold, your research must establish:  
  - **Non-ad-hocness:** Theorists pre-specified *testable* conditions for delay/absorption.  
  - **Mechanistic robustness:** The core causal mechanism remains plausible *despite* failure.  
  - **Temporal reasonableness:** Horizon drift has an upper bound (e.g., not exceeding mechanism's causal timescale).  

  **Other scholars:** Engage Elie Zahar’s "heuristic identity" (vs. Lakatos), Deborah Mayo’s severe testing (for evidential thresholds), and Hasok Chang’s "preservative realism" (for delayed confirmation).

  This sequence builds from foundations to applications, maximizes philosophical leverage without data, and forces clarity on whether "right but early" is an epistemic category—or a eulogy for dead theories.
