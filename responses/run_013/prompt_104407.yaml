  First, I need to unpack what they're asking. The main question is whether "right but early" is a valid judgment or just a way to save face. The user wants to know which open questions should be prioritized over the three years and why. They also want the ordering defended based on factors like upstream dependencies, tractability without empirical data, potential to change historical classifications, and what evidence could shift priorities.

