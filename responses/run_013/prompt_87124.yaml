  The user's main questions revolve around mapping this case to Hart and Fuller's theories. First, where does Hart, as a positivist, get stuck? Does the minimum content of natural law help him argue the guards acted illegally? Then, for Fuller, since the GDR followed the eight desiderata formally, can he still use the Radbruch move, or is that separate? Also, the ECHR used a positivist approach by referencing treaties the GDR signed. Does that make the natural law argument unnecessary?

  They also want to know what this case shows about the Hart-Fuller debate—does it favor one side, or show both can reach the same result with different reasoning? Where would their disagreement actually matter?

  I should start by outlining Hart's position. As a positivist, he separates law from morality. So, according to him, the GDR's border law was valid law, regardless of its immorality. The guards followed a valid legal order, so technically, they didn't break the law at the time. However, Hart's minimum content of natural law includes basic human survival principles. Shooting unarmed civilians violates this, so Hart might say the law is flawed but still valid. He'd likely argue against retroactive punishment, but the user mentioned the courts used proportionality within GDR's own laws. Hart could accept this statutory reinterpretation since it's based on existing GDR laws, avoiding retroactivity. But if the law had explicitly allowed such shootings, Hart would be stuck saying the guards acted legally, though immorally.

  For Fuller, his eight desiderata focus on procedural morality. The GDR seemed to meet these formal requirements. However, Fuller argued that laws failing substantive justice might not be law. The Radbruch formula, used by the courts, aligns with Fuller's view that extreme injustice invalidates law. But if the GDR followed all eight principles, can Fuller still invoke Radbruch? The user points out that the GDR's constitution had a proportionality principle. Fuller might argue that the shoot-to-kill order violated the internal morality of law by being indiscriminate and disproportionate, thus not a valid rule. If the law explicitly allowed it, Fuller would say it's not law due to substantive injustice, even if procedurally sound. This is where he diverges from Hart.

  On retroactivity, the ECHR used the GDR's international treaties, a positivist approach. This makes the natural law argument seem redundant in this case, but it might be necessary in other scenarios without such treaties. The user wants to know if this makes the natural law route idle here.

  For the broader debate, the case shows both theories can condemn the guards but for different reasons. Hart, through legal reinterpretation; Fuller, through invalidation. The disagreement matters in cases where laws are procedurally sound but substantively unjust, like apartheid laws. Hart would see them as valid but immoral, while Fuller would deny their legal status.

