prompt: |-
  ok so this is maybe a dumb question but i've been stuck on it for a week and i need someone to lay it out for me.

  i'm a first-year bio phd student and i'm sitting in on a philosophy of biology seminar as an elective. last week the topic was the appendix. the prof said flat out that the appendix has no function, it's just a vestige. someone pushed back that it's got lymphoid tissue in it and clearly does something. prof goes: "doing something isn't having a function. a function is what it was selected to do." and then we moved on and i've been annoyed about it ever since, partly because i think he's definately right and partly because i think he just won by redefining the word.

  what i want is a menu. take that line -- a function is what a thing was selected to do, plus the tag-along claim that doing something isn't enough to have a function -- and tell me all the precise things it could be claiming, from the boring to the radical. for each one: is it trivially true, is it a real substantive thesis, is it false, and does it actually get the prof his verdict on the appendix?

  some things i want sorted out along the way. what does "selected" have to mean for any of this to work -- does the trait need to have been selected for that particular effect, as opposed to just having been selected while it happened to do that? how long does it have to have been doing it before it counts? does a trait that was selected for one thing ages ago and now does something completely different still have a function, and if so which one? what about a trait that's brand new and useful but nobody's been selected for it yet -- spandrels, drift, old parts getting co-opted for new jobs? what does the other view say, the one where a function is just whatever role a part plays in the system it sits in -- is that a real disagreement with the prof or are they just asking different questions with the same word? and does any reading of his line make "the appendix has no function" come out true, or does it only make it come out as "no function of the kind i care about"?

  also curious which reading he was probably using when he said it, since he was pretty obviously trying to end the conversation.

  lay it out as a numbered list of readings with a verdict on each, then a short bit at the end on which one was doing the work in that exchange and what, if anything, would settle it. i don't need reading recs, i know there's a literature, i just want the options and which ones are actually distinct from each other.
