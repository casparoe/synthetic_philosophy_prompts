prompt: |-
  I'm a novelist by trade, though the book I'm finishing has pushed me into territory I'd always assumed belonged to other people: for the last two years I've been reading philosophy of science in a piecemeal, autodidact's way, mostly because I have a character who builds economic models for a living and I wanted to write his arguments from the inside rather than from the outside. Somewhere along the way I stopped being a spectator and started holding a view, and now I'd like to know how much trouble it's in. The view is this: the long quarrel over whether a model's assumptions must be realistic has been aimed at the wrong target. What matters is not whether an assumption is false -- nearly all of them are, in some measure -- but whether its falsity is of a kind that washes out as the model is made finer, or of a kind that propagates and infects the conclusion. A frictionless plane is a falsehood that annihilates itself in the limit; a representative agent who knows the future, or a market that clears by assumption, may be a falsehood that gets baked into the result. I want to say that the second kind is what critics of idealization should be attacking, and that the first kind deserves the immunity that defenders of unrealistic assumptions have always claimed for it -- the immunity I've seen called the F-twist when it's attributed to Friedman.

  What I'd like from you is a map of what would count against this. Not a survey of the literature -- I can't follow citations and don't want them -- but an account of what the evidence and arguments would be if I'm wrong: which arguments, which concrete cases (historical or invented), and which formal results show that the distinction I'm drawing either collapses or fails to do the epistemic work I'm asking of it. I'd especially like you to press on the possibility that "washes out in the limit" is doing no real work, since any assumption might be redescribed as converging or not depending on how one sets up the limiting procedure, and the distinction might then be a rhetorical device rather than a criterion. Sort whatever you give me by how decisive it would be rather than merely how awkward, tell me which of these the view's own defenders would concede count against them and not only what its critics would say, and be candid about whether I have quietly insulated the position from any possible counterexample -- and if I have, whether that is a fatal defect in a claim of this kind or simply the price of any criterion worth having.

  For what it's worth, the objection that would unsettle me most is not the charge of instrumentalism but the charge of emptiness -- the suggestion that my distinction is just the ordinary demand for good modelling dressed up as a philosophical thesis. So tell me, if you can, how my view stands to the position usually attributed to Friedman: whether I have merely restated his "assumptions don't matter" with better manners, or whether there is a genuine gap between saying that assumptions don't matter and saying that only certain of their falsehoods matter.
reasoning: |-
  Okay, let me start by unpacking what this novelist is really asking. They've been diving into philosophy of science for their book, specifically around economic models and the realism of assumptions. Their core idea is that the debate about realistic assumptions is misdirected. Instead of focusing on whether assumptions are false, we should look at whether their falsity disappears as the model gets finer or if it propagates and taints the conclusions. They want to know the strongest counterarguments to this view, especially if the distinction they're making is actually empty or just a repackaging of Friedman's instrumentalism.

  First, I need to address their main concern: the possibility that "washes out in the limit" is doing no real work. The user worries that any assumption can be framed as converging depending on how you define the limit. That’s a valid point. For example, take the representative agent in economics. If you add heterogeneity, does that solve the problem or just move it? Maybe the limit process itself is arbitrary. The user mentioned frictionless planes in physics as an example where falsity vanishes. But in economics, if you assume perfect information and try to add noise, does it converge to the same result? Probably not. So the critic could argue that how you set up the limit determines whether it washes out or not, making the distinction subjective.

  Then there’s the charge of emptiness. Is this just saying "good models are robust" but in fancy terms? If robustness is about small changes not affecting outcomes, that’s standard. The user’s distinction might not add new criteria but reframe existing ones. That could make it more rhetorical than substantive. For instance, if both types of false assumptions are judged by whether they affect conclusions, then the classification isn't doing independent work. It’s just a description after the fact.

  Another angle is Friedman’s F-twist. The user claims they’re different because Friedman dismissed all assumptions as irrelevant if predictions work. But the user is focusing on the nature of the falsehood. However, if the model’s predictions are what matter, then why categorize assumptions? If a model with propagating falsehoods still predicts well, does it matter? The user might need to show that their distinction explains why some models fail even when their assumptions are unrealistic in a non-propagating way. But if predictions are the ultimate test, the distinction becomes secondary.

  Structural instability is another counter. Some models might have assumptions that seem harmless but cause big changes with tiny perturbations. Like chaotic systems. So, an assumption that appears to wash out might actually not, depending on initial conditions. This challenges the idea that we can know beforehand which falsehoods propagate. Without knowing the model's behavior in advance, the distinction isn’t practical.

  Then, there’s the problem of multiple idealizations. Models have many false assumptions interacting. Even if individually they might wash out, together they could amplify errors. The user’s approach might not handle these interactions well. For example, both representative agents and market clearing combined could lead to conclusions neither would alone. So focusing on single assumptions might miss the bigger picture.

  Underdetermination is tricky too. The same conclusion might be reached with different sets of assumptions. So how do you trace which falsehood propagates? If two models with different assumptions lead to similar results, the user’s distinction might not cleanly apply. It becomes hard to isolate which assumption’s falsity matters.

  Epistemically, the user’s criterion needs to be applicable without knowing the outcome. But if you need to run the model to see if the falsity propagates, it’s not predictive. It’s a post-hoc assessment, which limits its usefulness. Critics might say it doesn’t offer guidance for model-building.

  The user also asked about Friedman. They think they’re different because Friedman dismissed all assumptions, while they focus on certain falsehoods. But if the model’s success is predictive, then both might end up in the same place. The key difference is the user’s emphasis on the mechanism of falsity, but without a clear method to identify propagating falsehoods, it might not offer more than Friedman’s view.

  In terms of decisive counterarguments, the strongest would be cases where an assumption seems to wash out but doesn’t due to structural instability or hidden interactions. Also, if the distinction can’t be applied a priori, it’s not as useful. The emptiness charge is powerful if their view doesn’t provide new tools but just reframes existing practices.

  The user should consider if their distinction helps in model construction or only in critique. If it’s the latter, it might still be valuable for understanding model failures. But they need to guard against it being merely descriptive. Concrete examples where the distinction clarifies existing debates would strengthen their position. For instance, pointing to specific economic models where representative agents cause propagation issues, while frictionless planes in physics don’t, could illustrate their point effectively.
answer: |-
  Your position is insightful and elegantly articulated, but it faces substantive challenges. Below, I map the most decisive counterarguments, sorted by their force against your view. I prioritize arguments that threaten the *coherence* or *operational utility* of your distinction itself, especially the "washes out in the limit" criterion, which you rightly identify as a vulnerability. Defenders of your view would concede the first three points as genuine weaknesses needing resolution, while critics would press all six.

  ---

  ### **1. The Indeterminacy of "The Limit" (The Most Damaging Charge)**
     **The Argument:** "Washes out in the limit" is not an intrinsic property of an assumption but depends entirely on *how the refinement path is chosen*. This makes your distinction subjective or context-dependent, not objective.
     - **Concrete Case (Economics):** Take the "representative agent" (RA). You argue its falsehood propagates. But a defender might claim: "If we 'refine' the model by adding *heterogeneous agents whose average behavior converges to the RA under specific conditions* (e.g., Gorman aggregation), the falsehood washes out." Conversely, a critic of frictionless planes might say: "Refine by adding *static friction only* – the limit doesn't wash out dynamics; it distorts them fundamentally."
     - **Formal Result:** Dynamical systems theory shows "structural stability" isn't guaranteed. Tiny changes in assumptions (e.g., initial conditions in chaotic systems) can lead to divergent outcomes *regardless of refinement*. Your criterion assumes well-behaved convergence, which is not universal.
     - **Why Defenders Concede:** This strikes at the heart of your epistemic criterion. If "the limit" is a modeling choice, not a discovery, your distinction collapses into a judgment call about *which refinements are scientifically legitimate*. This is precisely the debate you aimed to bypass.

  ### **2. The Emptiness Charge (Your Prime Concern)**
     **The Argument:** Your distinction is merely a restatement of standard robustness analysis ("good models are insensitive to small changes in assumptions") disguised as philosophy. It offers no *new* epistemic tool.
     - **Concrete Case (Physics):** Newtonian gravity assumes instantaneous force. Einstein showed this falsehood *propagates* to large masses/velocities. But this was revealed by empirical failure and a *better theory*, not by analyzing "the limit" of refining Newton. Your view retrospectively categorizes assumptions, but doesn't guide model-building.
     - **Why It's Decisive:** If your criterion only labels assumptions *after* we know which models fail empirically or theoretically, it's descriptive, not prescriptive. It explains *why* some idealizations fail but doesn't help *predict* which will fail without prior knowledge of outcomes. Defenders must show how to apply it *prospectively*.

  ### **3. The Problem of Multiple Idealizations (Interaction Effects)**
     **The Argument:** Models contain *many* false assumptions. Your focus on isolating single falsehoods ignores how interactions amplify or mask errors. An assumption that seems benign alone might propagate when combined with others.
     - **Concrete Case (Economics):** A DSGE model might assume: (1) a representative agent, (2) rational expectations, and (3) frictionless markets. Alone, each might be argued to "wash out" under some refinement (e.g., rational expectations with learning). Together, they create feedback loops (e.g., perfect foresight + market clearing eliminates instability) that *guarantee* certain results. Isolating the "propagating" falsehood is impossible.
     - **Why Defenders Concede:** Economic models are dense with idealizations. Your distinction struggles with combinatorial complexity – the "propagating" effect may emerge only from the *ensemble*, not individual assumptions. This undermines its practical utility for critique.

  ### **4. The Friedman Redux Charge (Instrumentalism Reloaded)**
     **The Argument:** You haven't escaped instrumentalism; you've refined it. Friedman’s "F-twist" (assumptions' realism is irrelevant; only predictive power matters) is compatible with your view: assumptions whose falsehoods "wash out" *are* those that don’t harm predictions. Your distinction is just Friedman plus a *diagnostic tool* for prediction failures.
     - **Gap Analysis:** Yes, there's a gap. Friedman dismisses *all* assumption realism. You demand realism *for assumptions whose falsehoods propagate*. But if "propagates" means "causes predictive failure," you remain instrumentalist – truth matters only when it affects output. Your genuine advance is in *diagnosing why* some unrealistic assumptions work and others don't.
     - **Decisive?** Only if you reject instrumentalism entirely. If you accept that models are tools, your view is a stronger instrumentalism. If not, you need an account of "propagating falsehood" *independent* of predictive failure (e.g., via explanatory incoherence).

  ### **5. The Underdetermination Problem (Tracing Causation)**
     **The Argument:** When a model fails, it's often impossible to trace whether the failure stems from a specific assumption's "propagating falsehood" or from other factors (e.g., misspecification, data error).
     - **Concrete Case (History):** Pre-2008 macroeconomic models failed to predict the crisis. Was this due to the propagating falsehood of "efficient markets" (your view)? Or rational expectations? Or omitted financial frictions? The debate continues – your distinction doesn't resolve it.
     - **Formal Result:** Calibration studies show identical outputs can arise from models with different assumptions ("observational equivalence"). If falsehoods propagate to the *same* wrong prediction, how do you identify the culprit?

  ### **6. The Epistemic Priority Charge (Putting the Cart Before the Horse)**
     **The Argument:** You need to know the *true causal structure* to determine if a falsehood propagates or washes out. But if we knew that, we wouldn't need models.
     - **Concrete Case (Invented):** Suppose an economist assumes "all agents are altruistic." If true altruism leads to equilibrium E, but the model converges to E only if refinement *preserves* altruism, does the falsehood "wash out" (if agents are selfish but act *as if* altruistic) or "propagate" (if selfishness leads to non-E)? Without knowing altruism's *true role*, we can't say.
     - **Why It's Damaging:** Your criterion requires knowledge we lack. Defenders might argue it applies *within* a modeling paradigm, but this retreats to instrumentalism.

  ---

  ### **Is Your View Insulated from Counterexamples?**
  Yes, but not fatally. You *can* always defend it by:
  - Redefining "the limit" for troublesome cases ("That’s not the *right* refinement!").
  - Attributing failures to interactions, not your core distinction ("The assumption *itself* washes out, but combined with others...").
  - Falling back on empiricism ("It propagated because predictions failed").

  This isn't fatal; *all* philosophical criteria (e.g., falsifiability, causation) face boundary disputes. The defect is only fatal if your distinction becomes *unfalsifiable* or *untethered from practice*. To avoid this:
  1. **Anchor "the limit"** to empirically grounded refinements (e.g., adding friction as measured, not arbitrary parameters).
  2. **Require prospective application** (e.g., "This assumption will propagate because refinements X and Y show divergence").
  3. **Embrace explanatory power**, not just prediction, as a test (e.g., "Propagating falsehoods generate explanations that misrepresent causal structure").

  ---

  ### **Conclusion: Where Your View Stands**
  Your distinction **is not empty**: It explicitly shifts criticism from "unrealistic" to *harmfully unrealistic* assumptions, offering a framework for why some idealizations (frictionless planes) are productive and others (omni-scient agents) are corrosive. It **transcends Friedman** by providing a *mechanism* for when assumptions matter (when falsehoods propagate), rather than dismissing them entirely. However, its **epistemic viability hinges on constraining "the limit"** – if this remains indeterminate, your view risks becoming a sophisticated restatement of modeling best practices. The strongest counterattacks (indeterminacy, emptiness, interaction effects) suggest your criterion is best seen as a **heuristic for robustness testing**, not a fundamental epistemic rule. For your novelist’s purpose, that may be strength enough: it gives your character a defensible, nuanced stance in the scientific trenches.

  If you refine your position, focus on concrete cases where "the limit" *can* be objectively defined (e.g., computational models where refinement paths are testable). That’s where your distinction shines.
