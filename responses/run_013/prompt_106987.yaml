prompt: |-
  I'm putting together a short unit on why pain is bad and I want to nail the spec before my students read any actual theories. So: what does a theory of the badness of pain have to get right to count as adequate? Good enough for what, you ask — good enough that it tells me what to say about pain in animals and infants without hand-waving, and good enough to survive the weird clinical cases. Give me the requirements list: the phenomena it has to explain, the cases it has to get right, the distinctions it can't just collapse, with the specific case or consideration behind each requirement. And tell me which requirements are non-negotiable and which are just the prejudice of one camp.

  A few things I want on the table, since they're the ones that keep tripping me up:

  - The asymbolia cases. There are patients — with certain brain injuries, I think around the insula? — who will say they feel pain, can localize it and rate its intensity, but it doesn't bother them, doesn't hurt, they don't pull away. If pain is supposed to be intrinsically bad, what the hell is going on there? Any theory that can't say something here looks dead to me, but I'm honestly not sure whether the right move is to deny that they're in pain or to deny that the pain is bad for them.
  - The sensation/affective split. There's a difference between the intensity of a pain and how unpleasant it is, and the two can seperate. Does a theory of the badness of pain have to be a theory of the second thing specifically, or does that just relocate the problem?
  - Pains people want or at least don't mind — masochism, religious flagellation, the soreness after a hard workout. Is the requirement here that badness is relative to desire, or that these cases are somehow being misdescribed?
  - Creatures that feel pain but arguably don't have the concepts or desires we do — infants, animals. Does the theory owe them an account of why it's bad for them, and can it give one without smuggling in higher cognition?
  - The protective/functional story. Pain keeps you from damaging yourself; that's why congenital insensitivity to pain is a catastrophe. Does a theory of why pain is bad have to be consistent with it's usefulness, or even explain the badness by it?

  Then the part I most want: is there a subset of these that can't all be satisfied at once? I suspect the 'intrinsically bad' requirement and the asymbolia requirement pull against each other, and that the desire-based route which handles masochism blows up on infants. Say which pair is in genuine tension and why, and whether that means the list itself is a result.

  Finally: which single requirement does the most damage, i.e. knocks out alot of the popular theories on its own? My guess is asymbolia, but tell me if I'm wrong. And if it's cheap to do, a line or two on how the main contenders — hedonism about pain, desire/attitude theories, perceptual theories — score against the list. Keep the weight on the criteria though; the scorecard I can do in class.

  Please write it in American English.
reasoning: |-
  Okay, the user is putting together a unit on why pain is bad and wants to nail the specifications before introducing theories. They need a list of requirements that any adequate theory of pain's badness must meet. The key cases they mentioned are asymbolia, the sensation/affect split, masochism, infants/animals, and pain's protective function. 

  First, I need to address each of these phenomena clearly. For asymbolia, patients feel pain but aren't bothered by it. This directly challenges the idea that pain is intrinsically bad. A theory must explain whether this is still pain and why it's not bad here. The sensation/affect split shows that intensity and unpleasantness can dissociate, so the theory must target the unpleasant component specifically. 

  Masochism and wanted pains like post-workout soreness suggest that badness might depend on desire or context. The theory needs to explain why these aren't bad or how desire overrides badness. For infants and animals, the challenge is explaining badness without higher cognition. If a theory requires desires or beliefs, it fails here. The protective function is tricky because pain is useful but still bad. A good theory should reconcile these without making usefulness the reason for badness.

  Now, the user wants to know which requirements conflict. Intrinsic badness clashes with asymbolia—if pain is always bad, how can asymbolic patients feel pain without suffering? Desire theories handle masochism but fail for infants who lack complex desires. That's a tension. 

  Asymbolia might be the biggest hurdle because it forces a choice: deny it's pain (which seems wrong) or deny intrinsic badness. Hedonism struggles here, while desire theories might accommodate it by linking badness to aversion. 

  I should structure the response with non-negotiable requirements first, then contested ones. Non-negotiables include explaining core phenomenology, asymbolia, infants/animals, and the sensation/affect split. Contested points are desire-dependence and functional role. Then, highlight the tensions and which requirement knocks out most theories—asymbolia is the killer. 

  Finally, a quick scorecard: hedonism fails asymbolia, desire theories fail infants, perceptual theories might blur sensation and affect. The user can expand this in class. Make sure the language is clear and American English, avoiding jargon where possible.
answer: |-
  Here's your requirements list for an adequate theory of pain's badness, designed to handle your core concerns. I'll structure it with the requirement, the phenomenon/case driving it, and its status.

  **Non-Negotiable Core Requirements (Must Explain):**

  1.  **The Core Phenomenon of Suffering:** The theory must explain the *intrinsic unpleasantness*, the *felt badness*, the *suffering* that constitutes the core negative experience of paradigmatic pain (e.g., stubbing your toe, toothache). It must capture why we *want* it to stop.
      *   *Why:* This is the fundamental explanandum. A theory that doesn't explain why pain *feels* bad fails its primary task.
      *   *Status:* Non-negotiable.

  2.  **Pain Asymbolia:** The theory must account for cases where individuals experience the sensory-discriminative components of pain (location, intensity, quality) but lack the affective-motivational component (unpleasantness, desire to avoid). It must explain why this "pain" isn't bad *for them*.
      *   *Why:* This is a direct neuropsychological challenge to the intrinsic badness claim. It demonstrates a dissociation between sensation and suffering.
      *   *Status:* Non-negotiable (any theory that dismisses or handwaves this is empirically inadequate). The theory must *either* deny this is *true* pain (claiming only the affective part constitutes "pain proper"), *or* deny that the sensory part alone is intrinsically bad (locating badness in the missing affective part). Denying the phenomenon itself isn't viable.

  3.  **Infants & Non-Human Animals:** The theory must explain why pain is bad for beings who lack complex concepts, beliefs, or sophisticated desires (e.g., "desire not to be in pain" understood propositionally). It must account for their suffering without smuggling in higher-order cognition.
      *   *Why:* Pain clearly harms infants and animals. A theory that makes pain's badness depend on complex cognitive states risks implying pain isn't bad for these beings, or requires implausible cognitive attributions.
      *   *Status:* Non-negotiable. A theory that fails here is ethically and intuitively unacceptable.

  4.  **The Sensation/Affect Dissociation (Beyond Asymbolia):** The theory must account for the observed dissociation between pain *intensity* and pain *unpleasantness* (e.g., via modulation like stress, context, or drugs like morphine reducing unpleasantness more than intensity). It must clearly target the *affective*, unpleasant dimension as the locus of badness.
      *   *Why:* This is a core feature of pain neuroscience. A theory that conflates sensation and affect cannot explain modulation or cases like asymbolia. It relocates the problem to explaining the badness of the affective component.
      *   *Status:* Non-negotiable. A theory *of the badness of pain* is fundamentally a theory of the badness of its affective/unpleasant dimension. Sensation alone isn't sufficient for badness.

  **Contested but Critical Requirements (Handle Without Hand-Waving):**

  5.  **Wanted or Neutral Pains (Masochism, Flagellation, Post-Workout Soreness):** The theory must explain cases where pain is reported as not bad, neutral, or even positively valued *by the experiencer*, whether due to context, expectation, belief, or desire.
      *   *Why:* These challenge the universality of pain's immediate badness. Does badness require a negative conative attitude (desire/aversion)? Is the badness overridden? Is the description wrong?
      *   *Status:* Highly important, but the *required solution* is contested territory (desire-dependence vs. intrinsic badness overridable by context/meaning). A theory must address it plausibly, but the *how* is where theories diverge significantly.

  6.  **Consistency with Pain's Biological Function:** The theory must be compatible with the evolutionary fact that pain serves a vital protective function (avoiding damage). It should explain why a system *designed* to be unpleasant is useful, without necessarily *reducing* the badness to mere disutility.
      *   *Why:* Congenital Insensitivity to Pain (CIP) demonstrates the catastrophic consequences of lacking pain. A theory that makes pain's badness seem arbitrary or purely contingent clashes with its clear biological role.
      *   *Status:* Important for plausibility, but theories vary in *how* they integrate function (e.g., badness *is* the motivator vs. badness is a consequence of the motivator). Denying the link is implausible; reducing badness *only* to disutility is contested.

  **Distinctions It Cannot Collapse:**

  *   **Sensation (Nociception/Discrimination) vs. Affect (Unpleasantness/Suffering):** As per requirements 2 & 4. Collapsing these ignores key dissociations.
  *   **Pain's Phenomenal Character vs. Its Functional Role:** Requirement 6. Pain *feels* bad (phenomenon) *and* *functions* to protect (role). A theory must account for both without reducing one entirely to the other.
  *   **Intrinsic Features vs. Contextual/Relational Features:** Requirements 3 & 5. Is the badness built into the feeling itself, or does it arise from its relation to desires, beliefs, or circumstances? A theory must take a clear stance.

  **Tensions Between Requirements:**

  1.  **Intrinsic Badness vs. Asymbolia & Wanted Pains:** This is the core tension.
      *   If pain is *intrinsically* bad (its badness is an inherent property of the sensation/feeling itself), then Asymbolia patients must not be feeling true pain (they only feel nociception), and wanted pains must involve misdescription or self-deception (the pain *is* bad, they just value something else more).
      *   If badness is *not* intrinsic (e.g., depends on a negative attitude like aversion), then Asymbolia is explained (no aversion), and wanted pains are explained (aversion absent or overridden). But this clashes with Requirement 3 (Infants/Animals): Do infants/animals have the requisite "attitude"? Can aversion be non-cognitive? This is the battleground.

  2.  **Desire-Dependence vs. Infants/Animals:** Requirement 5 (if handled via desire/aversion) directly strains Requirement 3. Theories emphasizing sophisticated cognitive attitudes (e.g., "desire that this sensation stop") struggle mightily with infants and animals without positing implausible cognitive capacities. Theories positing a primitive, non-cognitive aversion might bridge the gap.

  **The "Killer" Requirement:**

  *   **Asymbolia (Requirement 2)** is arguably the single most damaging requirement for popular theories.
      *   **Simple Hedonism (Pain = Intrinsically Bad Sensation):** Directly falsified. Asymbolia shows a sensation with all the *sensory* hallmarks of pain lacks badness.
      *   **Perceptual Theories (Pain = Perception of Bodily Damage):** Struggles. If perceiving damage is intrinsically bad, Asymbolia is a problem (they perceive damage but aren't bothered). It often blurs sensation/affect.
      *   **Desire/Attitude Theories (Badness = Presence of Aversion/Desire for it to Stop):** Can *accommodate* Asymbolia (no aversion) most naturally. However, this shifts the killer blow to Requirement 3 (Infants/Animals) – can aversion exist without complex cognition? And Requirement 5 (Wanted Pains) becomes central (is aversion absent or overridden?).

  **Quick Scorecard Contenders vs. Requirements:**

  1.  **Hedonism (Pain Sensation = Intrinsic Bad):**
      *   Fails: Asymbolia (2), Sensation/Affect Split (4), Wanted Pains (5 - must misdescribe).
      *   Struggles: Function (6) - why *this* sensation? Often just stipulates.
      *   Excels: Core Suffering (1), Infants/Animals (3) - badness is intrinsic to the feeling.

  2.  **Desire/Attitude Theories (Badness = Conative Response):**
      *   Excels: Asymbolia (2), Wanted Pains (5), Sensation/Affect (4) - affect *is* the aversion.
      *   Fails/Struggles: Infants/Animals (3) - Requires plausible account of primitive aversion without sophisticated desires/cognition. Core Suffering (1) - Can feel ad hoc ("it's bad because I don't want it" vs. "I don't want it because it's bad").
      *   Handles Function (6): Aversion motivates avoidance.

  3.  **Perceptual/Evaluative Theories (Pain = Perception of Threat/Damage, Badness = Content):**
      *   Struggles: Asymbolia (2) - If perceiving threat is intrinsically bad, why no suffering? Often needs an extra component (e.g., "and it *matters* to you"). Sensation/Affect (4) - Often conflates or struggles to separate.
      *   Excels: Function (6) - Directly built-in. Core Suffering (1) - Can capture the "alarm" nature.
      *   Handles Infants/Animals (3) - If perception is non-conceptual. Wanted Pains (5) - Context changes the perceived threat level/meaning?

  **The Takeaway:** Your list *is* a result – it defines the battleground. The central tension is **Intrinsic Badness vs. Attitude-Dependence**, crystallized by Asymbolia vs. Infants. No theory sails through unscathed. Asymbolia is the empirical sledgehammer, but the need to explain infant/animal suffering without complex cognition is the ethical bedrock that forces theories to grapple with primitive motivational states. Use this list to dissect theories: "How does Theory X handle *this* case? Does it violate Requirement Y? Is that violation acceptable?" Good luck!
