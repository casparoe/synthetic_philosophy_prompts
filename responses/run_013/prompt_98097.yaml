  **FOR IMMEDIATE RELEASE**  
  **Committee on Selective Accounting (CSA) Announces Unification of Evolutionary Bookkeeping Standards**  
  *Resolution Ends Decades-Long Dispute Over "Unit of Account"*

  **GENEVA, SWITZERLAND** – After extensive deliberation and actuarial review, the Committee on Selective Accounting (CSA) today issued a landmark ruling definitively resolving the protracted dispute concerning the appropriate "unit of account" for evolutionary processes. Effective immediately, all registered researchers must report findings concerning trait propagation simultaneously in *both* gene-level and group-level currencies, recognizing them as "Materially Equivalent Reporting Conventions" (MERC).

  The long-standing debate centered on whether evolutionary accounting should prioritize entries in the ledger of individual genetic replicators ("selfish genes"), individual organisms as integrated vehicles, or collectives (groups, colonies, species). Proponents of the gene-level account argued it captured the ultimate, stable replicating entry. Advocates for the group-level account countered that certain traits – apparent sacrifices by individuals, complex cooperation – could only be balanced when the collective was treated as the primary unit of return. The individual organism account often served as a default, but faced challenges reconciling internal genetic conflicts and emergent group properties.

  "The confusion stemmed from inconsistent bookkeeping practices," stated CSA Director of Standardization, Dr. Alistair Ledgerwood. "Researchers were filing reports in incompatible formats, making comparative audits impossible and leading to unnecessary disputes over apparent deficits or surpluses in fitness accounts. Our analysis confirms that, for standard evolutionary transactions, a gene-centered balance sheet and a group-centered balance sheet are formally convertible representations of the *same underlying population ledger*."

  The CSA ruling mandates:
  1.  **Dual-Filing Requirement:** All published findings regarding trait frequency change must include parallel accounts: one detailing the net effect via changes in replicator frequencies across the entire population pool (gene-level), and another detailing the net effect via differential persistence or productivity of collectives (group-level).
  2.  **Translation Protocol:** Researchers must demonstrate the mathematical equivalence of their dual filings. A cost-benefit entry attributed to a replicator influencing the survival of relatives (inclusive fitness) in the gene-level account must correspond to a contextual analysis entry within the group-level account, and vice-versa. The famed "Price Equation" is recognized as the official conversion tool.
  3.  **Major Transitions Disclosure:** For events where the fundamental unit of organization demonstrably shifts (e.g., independent replicators forming chromosomes, cells forming multicellular organisms), researchers must file a special "Unit Reclassification Form" (CSA-UT1) specifying the point of ledger consolidation and justifying the new primary reporting entity, while maintaining convertible subsidiary accounts for the prior level.

  "The MERC ruling brings essential clarity and standardization," Dr. Ledgerwood elaborated. "It eliminates fruitless arguments over 'which account is real.' Both are valid summaries of the transactional data. Requiring both ensures transparency. An altruistic act, for instance, will show as a net cost to the individual's replicator balance *and* a net benefit to the group's collective balance sheet – it's the same transaction viewed through different accounting windows. This harmonization prevents the misrepresentation of group-level surpluses as inexplicable gene-level deficits, or vice-versa."

  The CSA emphasizes that Material Equivalence pertains strictly to the *numerical outcome* recorded in the population ledger. It explicitly does not adjudicate on the causal mechanisms generating the entries. The ruling states: "The equivalence established is notational and summative, confirming the consistent numerical representation of net change across reporting levels. It does not inherently specify the causal engine – whether the transactional dynamics are fundamentally driven by the differential replication of entries within the replicator ledger, or by the differential success of collective entities acting upon their environment."

  Researchers are granted a twelve-month transition period to adopt the dual-filing system. The CSA will provide standardized templates and conversion calculators. Non-compliance may result in findings being flagged as "Provisional – Incomplete Accounting."

  "This is a victory for rigorous evolutionary bookkeeping," concluded Dr. Ledgerwood. "By finally recognizing gene-level and group-level accounts as complementary facets of the same material reality, we eliminate artificial dichotomies and ensure the evolutionary ledger is auditable in all relevant currencies. The numbers must add up, whichever column you start from."

  **About the Committee on Selective Accounting (CSA):**  
  The CSA is an independent international body established to promote standardization, transparency, and best practices in the quantification and reporting of evolutionary processes. It develops and maintains the Generally Accepted Selection Principles (GASP).

  **###**

  **End Note:** The ruling successfully standardizes the *reporting* of outcomes, mandating both perspectives. It leaves entirely untouched the question of whether the dynamics of evolution are causally driven by the differential persistence of replicators, the differential survival of groups, or an interaction that defies reduction to a single ledger column. The causal engine remains uncategorized in the accounts.
