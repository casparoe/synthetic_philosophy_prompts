  Okay, the user is asking for an audit of a podcast's summary of Ryle's knowing-how vs. knowing-that distinction. They want a sentence-by-sentence breakdown of what's accurate, misleading, or wrong in the summary, plus clarification on whether intellectualism really died as claimed. 

  First, I recall Ryle's core argument from The Concept of Mind: he rejects the "intellectualist legend" where every intelligent action requires prior theoretical contemplation. The podcast summary gets this right initially—Descartes is indeed Ryle's primary target, and the regress argument (infinite rules for applying rules) is central. 

  But I notice three red flags in the summary: 
  First, the "knowledge in fingers not head" metaphor oversimplifies Ryle. He doesn't deny mental involvement; he rejects Cartesian dualism. Dispositions include cognitive readiness, not just physical habits. 
  Second, claiming experts might know nothing "statable" is hyperbolic. Ryle acknowledges experts often can articulate principles—he just says that ability isn't what defines know-how. 
  Third, the injury counterexample (skier who can teach but not ski) actually hurts Ryle's view, not intellectualism. It shows know-how isn't purely physical ability. 

  The user's friend is right that intellectualism revived—Jason Stanley and Timothy Williamson famously argued know-how is a propositional attitude. Their 2001 paper kicked off this revival. The injury case is one of their go-to arguments: if know-how were just ability, the injured instructor couldn't "know how" to ski. 

  The user seems philosophically savvy (references podcasts, debates with friends) but wants clarity without academic jargon. Their underlying need might be resolving cognitive dissonance: they're anti-intellectualist but heard a credible challenge. I should validate their intuition (yes, bike-riding involves non-propositional knowledge) while flagging where the podcast oversold Ryle's victory. 

  Key corrections: 
  - Dispositions ≠ habits; they're situation-responsive capacities. 
  - Intellectualism didn't die; it evolved post-Ryle. 
  - The regress argument stands, but later philosophers found workarounds (e.g., practical modes of presentation). 

  I'll structure the audit chronologically, tagging each summary claim as [Accurate], [Misleading], or [Wrong], then unpack the intellectualism revival separately. No citations per request, but I'll hint at Stanley/Williamson for context. Tone: conversational but precise, like explaining to a fellow podcast listener.
answer: |-
  Here's a blow-by-blow audit of the podcast summary from a Rylean perspective, followed by the intellectualism status update:

  **Podcast Summary & Audit:**

  1.  **"Ryle's target was the intellectualist legend — the idea that whenever you do something clever you first have to think a thought about how to do it, and then act on that thought."**
      *   **Accurate.** This is the core target – the "intellectualist legend."

  2.  **"Descartes is the villain, and the underlying picture is of the mind as a ghost in the machine, sitting inside the body and issuing instructions."**
      *   **Accurate.** Descartes' dualism and the "ghost in the machine" metaphor are central to Ryle's critique in *The Concept of Mind*.

  3.  **"Ryle says that leads to a regress, because applying a rule would itself require knowing a rule for applying rules, and so you'd never get started."**
      *   **Accurate.** The regress argument is one of Ryle's primary weapons against the intellectualist legend.

  4.  **"So knowing how is not a species of knowing that..."**
      *   **Accurate.** This is Ryle's fundamental conclusion.

  5.  **"...it's a set of dispositions to behave..."**
      *   **Accurate, but needs nuance.** Ryle *does* define intelligence (and thus know-how) in terms of dispositions. However, "dispositions to behave" can sound overly behavioristic. Ryle means complex, multi-track dispositions – tendencies to perform intelligently *in appropriate situations*, which includes responding to novel challenges skillfully, not just blind habits. It's about *how* one behaves, not just *that* one behaves.

  6.  **"...and the test of whether someone knows how to do something is just whether they can do it."**
      *   **Mostly Accurate, but slightly reductive.** For Ryle, successful performance *is* the primary criterion for attributing know-how. However, the "just" is slightly misleading. Rylean dispositions involve *reliable capacities* and *intelligent adaptability*. Simply "doing it" once by luck wouldn't count. The capacity to do it reliably and well, especially under varying conditions, is key.

  7.  **"That's why he says the expert's knowledge is in her fingers rather than her head..."**
      *   **Misleading/Overly Simplistic.** Ryle uses phrases like this (*sometimes* referencing fingers, more often just contrasting head knowledge with embodied capacity) as a vivid *metaphor* to emphasize that know-how isn't primarily *contemplative propositional knowledge*. He doesn't mean the head/brain isn't involved physiologically. He means the knowledge is manifested *in* the *doing*, not stored as internal theoretical instructions the agent constantly consults. This phrasing risks sounding like crude behaviorism or denying any cognitive element, which Ryle didn't intend.

  8.  **"...and why he thinks knowing how is really just a habit or a knack that gets drilled into you by training."**
      *   **Wrong/Misleading.** This is a significant misrepresentation. Ryle explicitly distinguishes intelligent capacities (know-how) from mere habits or knacks. Habits are rigid, automatic, and applied blindly irrespective of circumstance (like reflexively saluting in civilian clothes). Knacks are often innate quirks. Know-how, for Ryle, is *intelligent* – it involves learning, adaptability, applying principles flexibly to new situations, correcting mistakes, and understanding *why* things work. Training cultivates these intelligent dispositions; it doesn't merely drill blind routines.

  9.  **"On this view you could in principle be the greatest proof-writer alive and yet be unable to state a single thing you know..."**
      *   **Exaggerated/Hyperbolic.** While Ryle argues that *knowing-how* to write proofs is distinct from *knowing-that* (propositional knowledge about logic), he doesn't claim experts are typically *incapable* of stating *anything*. An expert proof-writer will almost certainly know *many* propositions *about* logic and proof techniques (*knowing-that*). Ryle's point is that their *skill* (knowing-*how*) consists in their *ability to deploy* that knowledge intelligently in practice, not merely in possessing the propositions. The skill isn't *reducible* to the propositions. Claiming they couldn't state *anything* is an implausible extreme Ryle doesn't endorse.

  10. **"...and the difference between an expert and a beginner has nothing to do with anything either of them knows."**
      *   **Wrong.** This completely misses Ryle's point. The difference *absolutely* has to do with what they know – specifically, with the *expert's vastly superior complex of intelligent dispositions* (know-how). They *know how* to do the task skillfully, intelligently, and adaptively. The beginner lacks that know-how. Ryle is rejecting that the difference lies *only* or *primarily* in differences in their *propositional* knowledge (*knowing-that*), not that it has "nothing to do" with knowledge altogether.

  **The Closing Claim: Intellectualism's Death**

  *   **"Ryle's argument was so decisive that intellectualism about know-how basically died with him, which is why nobody has seriously tried to revive it."**
      *   **False.** This is demonstrably incorrect. While Ryle's critique was hugely influential and dominated the landscape for decades, intellectualism underwent a major revival starting prominently with Jason Stanley and Timothy Williamson's 2001 paper "Knowing How" (and Stanley's subsequent book *Know How*). They argue precisely that knowing-how *is* a species of knowing-that – a form of propositional knowledge under a "practical mode of presentation." This view is now a major, seriously defended position in contemporary epistemology and philosophy of mind/cognition. The "injury case" (like the ski instructor) is a standard argument *used by intellectualists* against Rylean dispositional/ability views.

  **Who's Right?**

  *   **Your Mate:** Is largely correct. The podcast significantly mangled Ryle, particularly on the habit/knack point, the "can't state anything" claim, and the difference between expert/beginner. Crucially, your mate is absolutely right that the intellectualist view (know-how as knowing-that) is alive, well, and seriously defended by prominent philosophers today. The injury case *is* a standard objection to the pure ability view.
  *   **The Podcast:** Got the core target, villain, and regress argument right. It captured Ryle's fundamental distinction (how vs. that) and the dispositional *flavor*. However, it seriously distorted Ryle's view of dispositions (making them sound like non-intelligent habits/knacks), made hyperbolic claims about experts not knowing propositions, and its claim about the death of intellectualism is flatly wrong.

  **Your Intuition:** Your point about riding a bike vs. explaining it aligns perfectly with Ryle's core intuition. That distinction remains valid and important. The debate now is about the *nature* of that non-explanatory ability – is it fundamentally a complex disposition (Rylean) or a special kind of propositional knowledge (Intellectualist)? Ryle's arguments, especially the regress, are still central to the debate, but they are no longer considered universally decisive.
