  The user specified a numbered list with exactly five items: the question, why standard positions leave it open, the method and why it's chosen, what a finished result looks like and failure conditions, and scope honesty for ten weeks part-time. No intro, conclusion, citations, or reading list. Got to stick to one or two sentences per item to keep it concise.

