prompt: |-
  I'm a high school student applying to a summer research program in philosophy, and I need a short proposal (about 1,500 words) for a project on whether self-deception is even possible. My half-formed idea is that the familiar paradox — that self-deception seems to require a person both to know and not to know the same thing — only arises if we insist the self-deceived person holds one contradictory belief; I suspect the real phenomenon is better described as evidence-management, where someone arranges their life so that a belief they half-hold never has to be tested, and that once we separate believing something from refusing to look at it, the paradox dissolves rather than deepens. Turn this into a proposal that states the question so it has a determinate answer, explains why the standard positions leave it open, describes the method I would actually follow and why that method rather than the obvious alternative, says what a finished result would look like and what would count as the project failing, and keeps the scope honest for roughly ten weeks of part-time work. Please leave out citations and a reading list — I'll add those myself. Give me the proposal as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
