prompt: |-
  Hey — I could use your help drafting something for a meeting on Thursday and I'm too close to it.

  Quick background. I'm the resident philosopher on the grants committee of a mid-sized foundation — call it $40M a year, mostly global health, some climate. There's a proposal in front of us from a group that wants us to carve out 5% of the annual budget for what they're calling "existential resilience" work. The concrete ask is $2M over three years: some seed-bank sites in weird places, an archival project, and a small policy team working on a treaty I won't pretend to understand. The details of the projects aren't the issue. The argument for them is.

  Here's their pitch. They put the chance that this cluster of work meaningfully lowers the risk of an unrecoverable collapse of industrial civilization at about one in a billion (1e-9). But if it does work, they say it safeguards a long-run future of roughly 10^16 human lives. Multiply it out: 10 million expected lives for $2M, i.e. about five lives per dollar, against our bednet portfolio at roughly one life per $4,000. They're not shy about it — their line is that "you don't get to wave off a number because it's small when the payoff is big enough, and refusing is also a bet."

  Half the committee thinks this is Pascal's wager with a spreadsheet and wants to reject on sight. The other half, including our chair, thinks we'd be morally negligent to say no. I have to write the decision memo and I don't want to just split the difference and fund 2.5%.

  So draft it for me. It needs to land on a concrete recommendation — fund, don't fund, or fund with conditions, with a specific dollar figure and a review date — and the reasoning has to survive the strongest version of the losing side, not a strawman. A few things I want you to actually engage rather than gesture at:

  - Whether a 1e-9 estimate is even the kind of thing a funder can evaluate, and what our posture should be toward probability numbers that nobody could ever be shown to have gotten wrong. The people giving us the number are also the people who'd recieve the money, which the chair says is irrelevant and I say isn't.
  - The fanaticism problem in general. If we buy the logic here, what stops it from licensing literally any grant with a big enough cosmic payoff attached, including from people who are transparently making the numbers up? I want an actual screening rule I can put in the memo, not a vibe.
  - Whether it matters that the beneficiaries are in the far future and uncountable, versus our usual beneficiaries who are alive now and can be counted. If you think it doesn't matter, say why; if it does, say what weight it gets.
  - If you recommend against, you owe me the rule we're adopting instead and an answer to "so you're just refusing to think about the far future." If you recommend for, you owe me the mechanism that keeps this from metastasizing into funding every long-shot anyone pitches us next cycle.

  Keep it to a page or so, in the voice of a committee that will have to defend this to donors. Don't give me a literature review, I know the literature — I want a document with a bottom line.
reasoning: |-
  Okay, the user is asking me to draft a decision memo for their foundation's grants committee meeting. They're a philosopher on a committee reviewing a $2M proposal for "existential resilience" work. The proposal's argument hinges on an extremely low probability (1 in a billion) of preventing civilizational collapse, but with an enormous potential payoff of safeguarding 10^16 future human lives. 

  First, I need to understand the core tension. The committee is split between those who see this as Pascal's Mugging (where huge payoffs justify tiny probabilities unreasonably) and those who feel morally obligated to fund it. The user wants a concrete recommendation that addresses key philosophical and practical concerns without splitting the difference.

  Hmm, the user's unspoken needs are interesting. They're not just asking for text - they need intellectual armor. As the resident philosopher, they must bridge abstract ethics and real-world grantmaking. Their credibility is on the line. The memo must withstand donor scrutiny and set precedents. 

  The tricky bits are the probability evaluation (can we trust 1e-9 when proposers benefit?), fanaticism (how to avoid funding every long-shot), and moral weight of future lives. I recall Derek Parfit's non-identity problem and Bostrom's vulnerable world hypothesis are relevant, but the user explicitly said no literature review. Practical filters are key.

  I'm leaning toward conditional funding with strong guardrails. Outright rejection seems morally risky given the stakes, but blank-check approval invites abuse. The screening mechanism should require: independent probability audits, demonstrated expertise in the specific threat, and a "funding cap" rule to prevent cosmic payoffs from overriding all other grants. 

  For the future lives question - yes they count, but with discount factors for uncertainty. Not because future lives matter less, but because our ability to affect them diminishes over time. That justifies prioritizing current global health work while still allocating something to resilience. 

  The tone needs to balance intellectual rigor with donor-friendly pragmatism. No jargon, but no oversimplification either. Phrases like "asymmetric responsibility" and "deliberative burden shifting" might help crystallize why we can't ignore tiny probabilities with huge downsides, while "precedent erosion" addresses the slippery slope concern. 

  ...after drafting, I realize the $300K pilot recommendation threads the needle: enough to show serious engagement without gutting core programs. The 18-month review forces accountability on probability modeling - which tackles the "proposers marking their own homework" issue. Most importantly, it gives the committee a defensible position against both extremes.
answer: |-
  ## Decision Memo: Proposal GX-227 ("Existential Resilience Initiative")  
  **To:** Grants Committee  
  **From:** [Your Name], Philosophy Advisor  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Conditional Funding with Rigorous Screening Mechanism  

  ### 1. Recommendation
  **Fund $300,000 over 18 months for Phase 1 feasibility/pilot work on the Arctic seed-bank node and treaty framework scoping, subject to independent probability audit and expert validation. Defer $1.7M request pending Phase 1 outcomes. Mandatory review at 18 months with kill switch if validation thresholds unmet.**  

  ### 2. Core Reasoning
  We reject both unconditional funding and outright rejection. The proposal’s core argument—that vanishingly small probabilities multiplied by vast payoffs demand action—cannot be dismissed as mere Pascal’s Mugging, but its premises require unprecedented scrutiny. Our duty to near-term beneficiaries (current global health/climate priorities) is primary, but not exclusive. Ignoring credible, scalable interventions for the far future is indefensible *if* they survive robust epistemic filters. This proposal currently fails those filters, but warrants investment to *build* them.  

  ### 3. Engagement with Key Issues  
  **(a) Evaluating 1e-9 Probabilities & Conflict of Interest**  
  *   **Problem:** Probabilities of this magnitude are inherently non-falsifiable within human timescales. Proposer self-interest compounds this.  
  *   **Posture:** We cannot "evaluate" 1e-9 as true/false. We *can* evaluate the **process** generating it.  
  *   **Resolution:** Funding contingent on:  
      *   **Independent Audit:** Commissioned review of probability model by agreed-upon experts (e.g., FLI, CSER) not affiliated with proposers.  
      *   **Sensitivity Threshold:** Model must demonstrate why P > 1e-12 (vs. 1e-15 or 1e-20) – i.e., show material "probability floor" based on tangible inputs.  
      *   **Conflict Mitigation:** Proposers must open-source methodology pre-audit.  

  **(b) Preventing Fanaticism & Screening Rule**  
  *   **Problem:** Untethered "cosic payoff" arguments could justify any proposal, eroding fiduciary duty.  
  *   **Screening Rule (Adopt for all future long-shot proposals):**  
      > **The Asymmetric Burden Test:** Proposals claiming expected utility dominance via low P/high payoff must:  
      > (1) **Identify a Specific, Plausible Mechanism** (e.g., "seed-bank prevents total agri-collapse from solar EMP," not "safeguards civilization").  
      > (2) **Demonstrate Scalable Impact** (e.g., $2M enables critical path step, not just "more research").  
      > (3) **Pass Independent Probability Validation** (as above).  
      > (4) **Show Non-Substitutability** (Why *this* actor? Why *now*? Why *this* funding?).  
  *   **Application Here:** Proposal partially meets (1) & (2) but fails (3) & (4) without Phase 1 validation.  

  **(c) Moral Weight of Far Future Lives**  
  *   **They Matter, But Differently:** Future lives have intrinsic moral weight. However, *expected* impact diminishes with:  
      *   **Epistemic Distance:** Uncertainty compounds over time (will humans exist? will they value what we preserve?).  
      *   **Intervention Attenuation:** Current actions’ effects fade (technological/social change may render efforts moot).  
  *   **Weighting:** This justifies **heavy discounting of far-future expected value** in cost-effectiveness calculations versus proven near-term interventions. Hence, we prioritize bednets *unless* long-shot proposals pass rigorous screens proving disproportionate leverage.  

  **(d) Defending Against Critiques**  
  *   **To "Reject on Sight" Side:** We are *not* licensing fanaticism. We are investing minimally ($300K = 0.75% of annual budget) to:  
      *   Test a screening mechanism for future proposals.  
      *   Gather data on evaluating ultra-long-term resilience.  
      *   Avoid moral negligence *if* the probability claim holds post-audit.  
  *   **To "Morally Negligent to Say No" Side:** Unconditional funding ignores:  
      *   **Opportunity Cost:** $2M could provide 50,000+ bednets *now*.  
      *   **Precedent Risk:** Funding unvetted P(1e-9) claims invites bad actors.  
      *   **Deliberative Burden Shifting:** Granting this without scrutiny forces us to fund all equally unverified claims, collapsing our grantmaking.  

  ### 4. Implementation & Oversight  
  *   **Phase 1 Scope:** $300K for seed-bank site feasibility (geotechnical/legal) + treaty team producing scoping document defining measurable milestones for "meaningful risk reduction."  
  *   **Oversight Panel:** Committee appoints 3 members (incl. skeptic) + external resilience expert to supervise Phase 1.  
  *   **18-Month Review Gate:** Full independent audit of probability model + assessment against Asymmetric Burden Test required for further funding. Terminate if:  
      *   P cannot be credibly justified >1e-12, *or*  
      *   Scalability/non-substitutability not demonstrated.  

  ### 5. Bottom Line for Donors
  We safeguard current lives first, but responsibly prepare for civilization-scale threats. This pilot invests minimally to stress-test a crucial screening capacity for existential resilience. It demands proof of concept before major funding, protecting our core mission while exploring a prudent hedge against catastrophic risk. We fund the *validation*, not the claim.  

  **Recommended:** Conditional Phase 1 Funding ($300K) with strict review gate.  
  **Not Recommended:** Full $2M grant; outright rejection.  

  ---  
  *Approx. 1 page. Voice: Pragmatic, donor-aware, intellectually rigorous without academic jargon. Focuses on fiduciary duty + moral hedging via disciplined process.*
