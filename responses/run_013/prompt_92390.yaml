prompt: |-
  So I'm a journalist who covers science and ideas, and an old colleague of mine roped me into guest-grading a stack of short answers for this undergrad seminar she runs on numbers and democracy. I want to be fair to these kids, so before I scrawl a score on this one I was hoping you'd sanity-check me. The question was: "Explain the Condorcet jury theorem, state the assumptions it depends on, and assess whether it gives us a good reason to trust large groups of ordinary people over small groups of experts." Here's what the student turned in:

  The Condorcet jury theorem says that if you put a yes-or-no question to a group and each member has a better-than-even chance of getting it right, then the chance that the majority gets it right rises as you add more members, and it approaches certainty as the group gets large. So a big enough crowd is almost guaranteed to land on the correct answer. Two assumptions do the work: each voter is more likely than not to pick the correct option, and voters reach their judgments independently, so they aren't copying each other. If you relax the first assumption and let voters be worse than a coin flip, the majority actually gets less reliable as it grows, so the theorem isn't a blanket endorsement of any crowd.

  The usual takeaway is that majority rule is a truth-tracking device: a large referendum is more likely to hit the right answer than a small panel of experts, even when the experts are individually smarter, as long as the ordinary voters are above chance. I think that's basically correct, and it's the same reason a big random poll beats asking a couple of pundits.

  On the independence assumption, I read it as mainly ruling out collusion. As long as people make up their own minds and aren't literally coordinating, the theorem goes through. So it's fine if everyone reads the same newspaper and comes away with the same slant, since each of them still has a better-than-chance shot on their own.

  Finally, the theorem isn't limited to factual questions. If enough people favor a policy, the majority is more likely to be right that it's the good policy, so it's also a defense of democracy on value questions, not just on facts.

  So — can you give me a grade out of 10 (and the letter you'd map it to), plus the point-by-point comments I'd need to back it up? I don't want a general impression. Name what's solid, what's actually wrong, and what's just hand-waving, so I can put real notes in the margin instead of some vague "good effort."
reasoning: |-
  Okay, the user is a journalist grading undergrad seminar answers on the Condorcet jury theorem. They want a rigorous evaluation of a student's response - not just a score but specific feedback to justify it. 

  First, let's dissect the student's answer section by section. The description of the theorem itself is flawless: they nail the probability increase, the two key assumptions (p>0.5 and independence), and the critical caveat about p<0.5 reversing the effect. That's textbook-perfect. 

  The "usual takeaway" paragraph shows strong applied thinking - connecting the theorem to real-world referendums vs expert panels, and even extending it to polling analogies. No errors here, though the pundit comparison slightly oversimplifies since experts aren't always "couples" with lower aggregate accuracy. Still, minor.

  Now the independence assumption part is where trouble starts. The student dangerously misinterprets "independence" as merely avoiding explicit collusion. But statistical independence requires no common error sources - shared media bias violates this catastrophically. If everyone ingests the same slanted information, their errors become correlated. The theorem breaks down. This isn't just hand-waving; it's a fundamental conceptual error that would break real-world applications.

  The final paragraph's claim about value judgments is the other major flaw. The theorem relies on an objective "correct" answer - which exists for facts but not for normative preferences. Saying majority preference indicates "the good policy" smuggles in utilitarianism where it doesn't belong. This overextension could mislead in policy contexts.

  Beyond technical errors, I notice the student writes with confident clarity - they clearly grasp the core mechanics. But that makes the independence/value missteps more concerning because they're presented just as assuredly as the correct parts. The grading should reward the strengths while flagging these specific conceptual risks.

  For scoring: The perfect first half earns top marks, but the significant errors in the second half demand deduction. Specifically, the independence misunderstanding undermines a pillar of the theorem, and the normative claim is philosophically loaded. These aren't minor quibbles - they're distortions of the model's purpose and limits. 

  The journalist will need margin comments that:
  - Praise the precise theorem summary  
  - Validate the expert vs crowd comparison  
  - Correct the independence interpretation with a correlated error example  
  - Reject the normative application while explaining why  
  All without crushing the student's evident analytical skills. The tone should be "You're sharp, but these points are landmines in your reasoning."
answer: |-
  Here's a granular breakdown of the student's answer, a grade with justification, and precise margin comments you can use:

  **Grade: 7.5/10 (B-/B)**

  **Breakdown & Margin Comments:**

  1.  **Description of the Theorem (SOLID):**
      *   *"The Condorcet jury theorem says that if you put a yes-or-no question to a group and each member has a better-than-even chance of getting it right, then the chance that the majority gets it right rises as you add more members, and it approaches certainty as the group gets large."* **✓ CORRECT.** Nails the core probabilistic claim and the asymptotic convergence.
      *   *"So a big enough crowd is almost guaranteed to land on the correct answer."* **✓ CORRECT (with assumptions).** Accurate summary implication.
      *   *"Two assumptions do the work: each voter is more likely than not to pick the correct option, and voters reach their judgments independently..."* **✓ CORRECT.** Identifies the two critical assumptions precisely (p>0.5 and independence).
      *   *"If you relax the first assumption... the majority actually gets less reliable as it grows..."* **✓ CORRECT.** Shows understanding of the critical role of p>0.5 and the negative result when p<0.5.

  2.  **Takeaway & Comparison to Experts (SOLID, minor quibble):**
      *   *"The usual takeaway is that majority rule is a truth-tracking device..."* **✓ CORRECT.** Good framing.
      *   *"...a large referendum is more likely to hit the right answer than a small panel of experts, even when the experts are individually smarter, as long as the ordinary voters are above chance."* **✓ CORRECT.** Accurately applies the theorem's logic to this comparison scenario.
      *   *"...it's the same reason a big random poll beats asking a couple of pundits."* **✓ LARGELY CORRECT (minor oversimplification).** The poll analogy is apt *if* the poll respondents meet the assumptions (p>0.5, independence). "Pundits" might individually have high p, but a *very small* group (like "a couple") can indeed be outperformed by a large group with p>0.5, which is the point. Minor quibble: "beats" is vague – the theorem specifically addresses the *probability of majority correctness*. **Margin: "Good analogy, but clarify it hinges on the crowd meeting CJT assumptions. Though correct, 'a couple' of experts might still have high p individually, the *aggregate* probability for a tiny group can be lower than for a large competent crowd."**

  3.  **Interpretation of Independence (WRONG & HAND-WAVING):**
      *   *"On the independence assumption, I read it as mainly ruling out collusion."* **✗ INCORRECT & UNDERSPECIFIED.** Independence is statistical, not just about deliberate collusion.
      *   *"As long as people make up their own minds and aren't literally coordinating, the theorem goes through."* **✗ FUNDAMENTALLY INCORRECT.** "Making up their own minds" is insufficient. Shared biases, common information sources, or systemic errors *destroy independence* even if no explicit coordination occurs.
      *   *"So it's fine if everyone reads the same newspaper and comes away with the same slant, since each of them still has a better-than-chance shot on their own."* **✗ SERIOUS ERROR.** This is a classic violation of independence! If everyone is exposed to the same biased information source, their errors become *correlated*. If the newspaper is wrong, *most* people relying on it are likely *all* wrong together, undermining the theorem's guarantee that errors cancel out. The "on their own" part misses the point entirely – the problem is the *common source* of potential error. **Margin: "Major error here. Statistical independence requires uncorrelated errors. Shared information sources (like one biased newspaper) create *common cause* errors, violating independence. The theorem absolutely does *not* hold under this condition, even without 'collusion'. Errors won't cancel; they compound."**

  4.  **Application to Value Questions (WRONG & HAND-WAVING):**
      *   *"Finally, the theorem isn't limited to factual questions."* **✗ INCORRECT PREMISE.**
      *   *"If enough people favor a policy, the majority is more likely to be right that it's the good policy..."* **✗ FUNDAMENTAL MISAPPLICATION.** The CJT relies on the existence of a single, objective, *factually correct* answer. Value judgments ("the good policy") lack this objective truth criterion. The theorem provides no mechanism for determining *moral* or *normative* correctness through aggregation; it only tracks the probability of matching a predefined factual truth. Claiming it justifies majority rule on values smuggles in a controversial utilitarian assumption ("good" = "what the majority prefers") that the theorem itself does not provide. **Margin: "The CJT fundamentally relies on an objective, factual 'correct' answer. It does *not* apply to normative/value questions like 'the good policy'. There is no objective 'right' answer for the majority to track in this sense. Applying CJT here is a category error and an invalid extension."**

  **Grading Justification:**

  *   **Strengths:** Excellent description of the theorem's core mechanics, probabilistic claims, and critical assumptions (p>0.5, independence). Correctly explains the implication for group size and the danger of p<0.5. Strong, accurate application to the factual crowd-vs-smart-experts scenario.
  *   **Weaknesses:** Contains one **major conceptual error** (misunderstanding independence as only about collusion, not correlated errors) and one **fundamental misapplication** (extending the theorem to normative/value judgments). These are not minor quibbles; they represent significant misunderstandings of the theorem's scope and limitations.
  *   **Balance:** The strengths are substantial and demonstrate good understanding of the core theorem. The errors, while serious, are confined to interpretations/extensions. A 7.5 (B-/B) reflects strong foundational knowledge undermined by critical flaws in applying the concepts.

  **Recommended Margin Comments (Copy-Pasteable):**

  1.  **(On Theorem Description):** "✓ Precise and correct summary of CJT, its probability claim, and the two key assumptions (p>0.5, independence). Good point about p<0.5 reversing the effect."
  2.  **(On Experts vs Crowd):** "✓ Correct application: Large competent crowd > small group of smarter experts *if* CJT assumptions hold. Poll analogy mostly apt (assumes representative/competent sample)."
  3.  **(On Independence):** "✗ **Major Error:** Independence means *statistically uncorrelated errors*. Shared biases or information sources (like one newspaper) violate independence, causing *correlated errors* that undermine the theorem, even without explicit collusion. 'Making up own mind' is insufficient if inputs are biased/shared."
  4.  **(On Value Questions):** "✗ **Fundamental Misapplication:** CJT requires an *objective factual truth* to track. It provides no basis for claiming a majority is 'more likely right' about normative value judgments ('the good policy'). This confuses factual correctness with preference aggregation."
