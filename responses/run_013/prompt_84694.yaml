answer: |-
  ### Pantoum for a Ratchet and Pawl  

  The wheel turns when the vane’s side is the hotter.  
  The pawl locks fast; the tooth cannot slip back.  
  But one jiggle wears two hats: it drives and frees the rotor.  
  The same heat lifts the latch to break the track.  

  The pawl locks fast; the tooth cannot slip back—  
  Until the random kick unlocks the gate.  
  The same heat lifts the latch to break the track,  
  Letting the wheel reverse, undoing fate.  

  Until the random kick unlocks the gate,  
  Net motion halts at one shared temperature.  
  Letting the wheel reverse, undoing fate:  
  One jiggle, split in purpose, stalls the stir.  

  Net motion halts at one shared temperature.  
  But one jiggle wears two hats: it drives and frees the rotor.  
  One jiggle, split in purpose, stalls the stir.  
  The wheel turns when the vane’s side is the hotter.  

  ---

  **Note on liberties and nuances:**  
  The poem accurately depicts the ratchet’s failure at uniform temperature due to symmetric thermal noise acting on both vane and pawl, and its function as a heat engine with a temperature gradient. It leans on Feynman’s original analogy where molecular kicks on the pawl "undo" work done on the vane. However, real ratchets involve distinct molecular collisions (not literally the *same* kick), though the energy source—thermal equilibrium—is shared. The second-law conclusion is settled for passive systems, but debates persist around active "information ratchets" (e.g., with feedback control), which can harness fluctuations without gradient by expending energy to reset memory, blurring the line between thermodynamic and informational work.
