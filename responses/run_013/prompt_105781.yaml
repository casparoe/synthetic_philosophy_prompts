prompt: |-
  So I need help writing a short speech, and it's kind of a strange one, so bear with me.

  Eleven years ago there was a flash flood in the town I grew up in. I was nineteen and I was out on the wrong side of the creek, up on the top rail of a flooded fence, and maybe two hundred yards the other way, on the roof of a station wagon that was still above water, there was a family — two parents and their two kids, the little one was six. The volunteer rescue boat could reach one spot and then the road would be under water, not both. The guy driving, Dale, had been doing it for thirty years, and when the rulebook ran out he had this habit: he flipped a quarter. It came up for me. They pulled me off the fence, and by the time anybody could have gotten around, the water was over the wagon. All four of them drowned.

  The town does a little thing by the creek every year on the anniversary, and this year they've asked me to say a few words, I guess because I'm the one who's still here. Front row is the family's people — the mother's sister, the grandfather, the aunt who raised the older boy. Behind them are the crew, half of whom I've known my whole life and a few of whom have told me straight out that the quarter was a cop-out, that Dale should have gone for the four, because four. And the company is rewriting its policy this year on calls where you can get to one or the other but not both, so whatever I say is going to get read as a position on that. I dont want to turn a memorial into a policy meeting, but I also don't want to say nothing.

  Here's the part I actually need help with. There's an argument I read in college, some ethics paper, I couldn't tell you who wrote it or what it was called, but it stuck. It said that when you can save either one person or several, the several don't have a stronger claim just because there are more of them. Each person has one claim, and claims don't stack like that — five people aren't one person times five. The number of them is a fact about the world, not a reason. And the upshot was that if you can't save everybody, the honest thing is to give everyone an equal shot — a coin, a lottery, something that doesn't decide by arithmetic — and then live with what comes up. Which sounds insane said out loud, and I remember the paper knew that, and the objection it had to get past is the one I can't answer: if you flip a coin, aren't you saying four dead is as acceptable as one dead? That's what the grandfather is going to be thinking. Honestly it's what I think at 3am, alot.

  So: write me the speech. Five or six minutes, call it 850 words, American English, no jokes. The argument has to be the spine of it, not a paragraph I drop in and move past.

  Things I want it to do, and things I don't want it to do:

  - Hold onto a distinction I think is the whole thing: "every life matters the same" is not the same claim as "everybody's claim on me was the same size." I want it to say the second thing without ever sounding like it's denying the first.
  - Face the coin question head-on. If there's no clean answer, let it not have a clean answer. I would rather these people hear "I don't know" than get a tidy ending.
  - Don't let me confess, don't let me ask anyone for forgiveness, don't let me say I shouldn't be here, and don't let me call myself lucky. All four of those are ways of making it about me.
  - Don't use the word "triage" and don't use the word "utilitarian." The crew will hear the first as an insult to their training and the families will hear the second as me calling the crew monsters.
  - No quotes, no authors, no titles, no books. It can gesture at "a paper I read once" — nothing anybody could check, because I'd get it wrong.
  - It has to land for the grandfather and the aunt and the lady from the hardware store who's never read a word of philosophy, and it can't be condescending to the two people in the back who have (Dale's daughter teaches philosophy at the community college, she'll be there).
  - Start with something small and specific — the fence, the quarter — not with a thesis. No epigraphs.
  - If it can quietly be a word about the policy without ever mentioning the policy, do that. But it can't be the point.
  - Don't make me out to be brave or humble, and don't end on "and that's how I learned to live every day," or anything like it.
  - If a line would hurt the families, leave it out, even if it's true.
reasoning: |-
  Okay, the user needs help writing a speech for a memorial event related to a tragic flood from eleven years ago. They survived while a family of four drowned because a rescuer flipped a coin to decide whom to save. The speech must address an ethical argument about why saving one over many isn't about numbers, while being sensitive to the grieving family members and rescue crew present. There are strict constraints: no self-pity, no jargon, no philosophy references by name, and it must feel authentic without tidy answers.

  First, I need to unpack the core ethical dilemma. The user recalls an argument that claims don't "stack" numerically—each life has equal moral weight, so random selection is fairer than utilitarian calculus. This is crucial but delicate; explaining it risks sounding like equating one death with four, which would devastate the family. The speech must distinguish between "every life matters equally" (undeniable) and "every claim on rescue was identical" (the thesis), without conflating them. 

  The audience dynamics are complex. Front-row mourners include relatives of the deceased, some resentful of the coin flip. Back-row rescuers include critics who think Dale should've prioritized the four. The policy revision adds tension—the speech will be scrutinized as commentary. Balancing memorial with unspoken policy implications requires finesse; it can't ignore the dilemma but can't debate procedures. 

  Key sensitivities: 
  - **Avoid self-focus:** No "I'm lucky," "I don't deserve this," or apologies. The user insists it not become about their guilt. 
  - **No cheap resolution:** The "3am question" (does flipping a coin mean accepting four deaths as no worse?) must linger honestly. Forcing closure would insult intelligence. 
  - **Accessibility:** Philosophy must translate to visceral imagery (fence, coin, water) without academic terms. Dale's daughter (a professor) will notice oversimplification, but the hardware store attendee must grasp it too. 

  Structural approach: 
  - **Open concrete:** Immerse listeners in the fence/station wagon immediacy to ground abstraction in lived experience. 
  - **Ethical spine:** Introduce the argument via "a paper," framing randomness as honoring individual worth, not math. Stress the distinction: equal chance ≠ equal outcome value. 
  - **Confront the wound:** Address "four vs. one" explicitly. Admit uncertainty—"I don't know" validates the grandfather's anguish. 
  - **Policy whisper:** Imply that procedural fairness respects rescuers' humanity without naming guidelines. 
  - **Close communal:** Shift focus to shared grief and the creek's ongoing witness, avoiding personal redemption arcs. 

  Phrasing traps to avoid: 
  - Words like "triage" (insults training) or "utilitarian" (implies coldness). 
  - Quotes would undermine the "hazy memory" framing. 
  - "Brave/humble" labels feel performative. 

  Testing lines against the family's pain: Any hint that their loss was statistically acceptable must be preempted. Emphasize that randomness doesn't negate the tragedy's scale. 

  Finally, the tone must hold tension—respectful yet unresolved, intellectual yet earthy—like the creek itself, which carries both memory and unanswered questions.
answer: |-
  Here is a speech draft focusing on the ethical core you described, grounded in the specific moment, and respecting your constraints. It aims for honesty without resolution and centers the community's shared grief and the weight of impossible choices.

  **(Speaker takes a breath, looks at the gathering by the creek)**

  Eleven years. Standing here, by this creek… it’s quiet now. But the sound of that water, that day, hasn’t really left me. I remember the slick, cold feel of that top fence rail under my hands. I remember the disbelief, the sheer force of it all. And I remember seeing the station wagon, maybe two hundred yards away. Four people clinging to the roof. A mother, a father, a little girl, six years old. And an older boy. Four people, waiting for the same rescue I was.

  The boat could only get to one place. The water rising fast. Dale was in that boat. He’d been pulling people out of this creek for thirty years. He knew the rulebook. And when the rulebook ran out… he flipped a quarter. A simple, ordinary thing. It landed, and it pointed to me. They pulled me off the fence. By the time anyone could get back… the wagon was gone. They were gone. Four lives. People who should be standing here with us.

  **(Pauses, looks towards the front row, then the rescue crew)**

  Every year we come back to this spot. To remember them. To hold them close. And this year, you’ve asked me to speak. Maybe because I’m the one who walked away. That fact… it’s heavy. It sits with me. It sits with Dale, I know. And it sits with every person who carries the memory of that day, especially their family. We carry it together.

  That moment on the water… it forces a question that feels impossible. Why me? Why them? Why did that quarter land the way it did? And underneath it all, a harder question: Was there a *right* choice? Should Dale have ignored the coin and gone for the four? Because… four. It feels like the answer should be obvious. Four is more than one. Saving four lives is better than saving one. Doesn’t that math just… add up?

  **(Leans in slightly, tone becomes more reflective, less narrative)**

  Years ago, I read something that stuck with me. A paper, an argument. It wrestled with this exact kind of impossible moment. And it said something that felt strange at first, maybe even wrong. It said that when you can save only one group, and not another… the number of people in each group doesn’t change the fundamental claim each *individual* life has. Each person standing on that fence rail, each person on that car roof… each one mattered completely. Entirely. Their life, their hope, their fear… it wasn't a fraction. It wasn't part of a sum. It was whole.

  Five people aren't just one person times five. Their *number* is a fact about the world in that terrible instant. But it isn't, this argument said, a *reason* in itself. It doesn't make one person's claim on life, on rescue, on a chance… *bigger* than another person's. Not inherently. Not in a way that can be cleanly weighed on some scale when the water is rising that fast.

  So, what do you do, when faced with two groups, each containing whole, irreplaceable lives, and you can only reach one? This paper suggested the most honest thing, maybe the only thing that truly respected the equal weight of each claim staring back at you from the flood, was… chance. A coin flip. A lottery. Something that didn't try to do the impossible math of comparing lives. Something that gave every desperate person, in that awful moment, an equal shot. And then… you live with what comes up. You carry it.

  **(Pauses, lets the weight settle. Looks directly at the gathering, meeting eyes where possible)**

  I know how that sounds. I know the question it throws back like a wave. If you flip a coin… aren’t you saying that four lives lost is just as acceptable as one? That it doesn't matter? That the grandfather losing his daughter and grandchildren is no different than losing just one person?

  **(Shakes head slowly, emphatically)**

  No. No, it’s not saying that. It could never say that. Losing four beautiful, unique souls is a deeper wound, a wider tear in the fabric of everything. The sheer *volume* of that loss… it’s overwhelming. It’s unbearable. That’s the truth we feel in our bones, the truth their family lives with every single day. That truth is undeniable.

  But here’s the hard knot the argument presents, the one I can’t untangle, not fully, not even now: Does the *size* of the terrible loss afterward change the *claim* each individual had *before* the choice was made? Did the mother on that roof have a *stronger* inherent right to rescue than I did on that fence, simply because she stood next to her children? Or did we both, in that instant, facing the same water, have an equally absolute, equally desperate claim on that single spot in the boat? Does the arithmetic of loss afterward dictate the value of the claim beforehand?

  **(Voice quiets, more vulnerable)**

  I don’t have a clean answer. Honestly… I don’t know. That question wakes me up some nights too. It’s the grandfather’s question. It’s Dale’s question. It’s yours. If the answer was easy, we wouldn't be standing here year after year, carrying it.

  Flipping that coin wasn't about saying the outcome wouldn't hurt. It wasn't about saying one loss is the same as four. It was about recognizing, in a split second with no good paths, that every life out there in the flood was absolute. That comparing them directly, trying to weigh them against each other in the roar of the water… maybe that was the thing that felt impossible. Maybe the coin was a way of bowing to that impossibility. A way of saying, "I see you *all*. I cannot save you all. This terrible chance is the only equal thing I have left to offer."

  **(Shifts focus back to the community, the creek)**

  That moment, that choice, it wasn't made in a classroom. It was made out here, on water that doesn't care about arguments. By people who trained for years, who risked everything, who carry the scars of impossible decisions. Dale carried that weight until the day he died. The crew here carries it still. Trying to find a way through the unthinkable isn't cowardice. It’s the brutal reality of the work.

  **(Looks towards the creek)**

  We gather by this water to remember four people who should be here. To say their names. To hold the space their absence leaves. To acknowledge the impossible weight of that day. The coin flip, the argument… they don’t explain the loss. They don't justify it. They don't make it smaller. Nothing can.

  They just remind us of the terrible, crushing weight of a moment where every life mattered absolutely, completely, individually… and not everyone could be saved. They remind us that the deepest choices are often the ones with no right answer, only impossible ones. And that the burden of living with the outcome, of remembering, of honoring those lost… that falls to all of us, together.

  **(Nods slowly, concluding quietly)**

  We remember them. We stand by this creek for them. That’s why we’re here. Thank you.

  ---
  **Key Considerations in this Draft:**

  1.  **The Distinction:** It explicitly separates "every life matters absolutely" (emphasized repeatedly) from "every individual claim *on the rescuer in that moment* was equally absolute" (the core argument). It states: "Does the *size* of the terrible loss afterward change the *claim* each individual had *before* the choice was made?"
  2.  **Facing the Coin Question:** It confronts the "4 vs 1" objection head-on ("I know the question it throws back..."), acknowledges the *outcome* is vastly different and more painful ("Losing four... is a deeper wound"), and explicitly states the unresolved tension ("Does the arithmetic of loss afterward dictate the value of the claim beforehand? I don’t know.").
  3.  **Avoiding Self-Focus:** No confession, no asking for forgiveness, no "I shouldn't be here," no "lucky." The focus is on the loss, the impossible choice, the community's memory, and the ethical question itself.
  4.  **No Jargon:** "Triage" and "utilitarian" are avoided entirely. The argument is described plainly ("an argument," "this paper said," "it suggested").
  5.  **Accessibility:** Grounded in the concrete story (fence, wagon, coin, water). Uses simple language and relatable concepts (weight, knots, waves, fabric tearing). The philosophical core is explained narratively without technical terms. The unresolved "I don't know" is itself accessible.
  6.  **Starting Specific:** Opens immediately with sensory details of the moment.
  7.  **Policy Whisper:** By defending the *concept* of the coin flip as responding to an impossible ethical reality facing rescuers ("Trying to find a way through the unthinkable isn't cowardice"), it implicitly supports the *principle* of random selection in such scenarios without mentioning current policy.
  8.  **Avoiding Tropes:** No portrayal of bravery or humility for the speaker. The ending focuses solely on remembrance and shared burden, not personal growth or platitudes.
  9.  **Sensitivity:** Avoids any line suggesting the loss was "acceptable" or that the family's grief is comparable to a smaller loss. Focuses on the uniqueness and totality of *their* loss. Acknowledges the crew's burden and training respectfully.

  This draft sits firmly in the uncomfortable space you described, honoring the loss, respecting the rescuers, presenting the argument clearly and accessibly, and leaving the hardest question honestly unresolved. It meets your core requirement: the argument *is* the spine.
