answer: |-
  ### Joint Statement on Process-Based and Outcome-Based Supervision

  We agree that both process supervision (providing feedback on individual steps or sub-tasks) and outcome supervision (providing feedback solely on the final result) offer distinct pathways for training AI systems, particularly in domains where human oversight is scarce. At their core, both methods supply the learner with a *signal* to guide behavior, but they differ in granularity, cost, and the nature of the information transmitted. Process supervision offers immediate, localized feedback that identifies specific errors or successes within a reasoning trajectory, acting as a dense curriculum that shapes intermediate behaviors. Outcome supervision, conversely, delivers a sparse, global signal that indicates only whether the final output succeeded or failed, requiring the learner to infer which actions contributed to that result. Critically, these signals are not categorically distinct but exist on a continuum: a "step" in one context (e.g., solving a sub-equation in a math problem) is itself an "outcome" of a finer-grained process, while any final outcome could be reframed as a step in a larger workflow. This suggests that the boundary between them is often one of practical segmentation rather than ontological difference.  

  Existing empirical evidence—such as studies showing improved sample efficiency or final performance with step-level feedback in narrow domains—demonstrates that process supervision can be advantageous under specific conditions. However, it cannot conclusively resolve whether these benefits persist at scale, generalize to open-ended tasks, or justify the typically higher labeling costs. Both approaches also share fundamental limitations: neither is informative when the supervisor cannot reliably evaluate the step (e.g., due to opaque model reasoning) or the outcome (e.g., in complex real-world tasks with delayed consequences). In such cases, both signals degrade into noise.  

  Our key disagreement lies in whether the advantages of process supervision are intrinsic and irreducible. One of us maintains that step-level feedback provides a *unique learning signal* that enables precise credit assignment, accelerates the acquisition of robust reasoning heuristics, and mitigates the pitfalls of outcome-only training (e.g., reward hacking or spurious correlations). This view holds that outcome supervision, even with vast inference-time search (e.g., majority voting over many samples), cannot fully internalize the causal structure of reasoning that process supervision instills directly. The other contends that outcome supervision is a more general and scalable primitive: with sufficient compute for search and enough labeled outcomes, it can implicitly recover the benefits of step-level guidance by statistically correlating intermediate states with final success, and at a lower cost per bit of information. This position argues that process supervision is merely a costly special case of outcome supervision applied to shorter tasks, and that its apparent superiority in small-scale experiments reflects temporary inefficiencies in search or credit assignment, not a fundamental gap.  

  To resolve this, we identify the following cruxes—questions where new evidence could meaningfully shift one or both of our views:  

  First, **whether the advantage of process supervision stems from improved learning dynamics or merely improved verification/selection**. A decisive test would train two policies from the same base model and trajectory pool: one with step-level rewards, another with only outcome rewards (matched for total reward magnitude). Both policies would then be evaluated on held-out tasks requiring similar skills but with novel structures (e.g., unfamiliar problem decompositions). One of us predicts the process-supervised policy will generalize better, showing it learned transferable reasoning. The other predicts that with enough outcome-labeled trajectories and inference-time search (e.g., beam search generating multiple reasoning paths), the outcome-supervised policy will close this gap, indicating the advantage was always about selection, not learning.  

  Second, **whether rationalization (models producing right answers for wrong reasons or vice versa) undermines process or outcome supervision more severely**. This could be tested by training models on tasks where misleading "rationalizations" are common (e.g., math problems with coincidentally correct answers), using both methods. One of us expects process supervision to fail here, as it may reward plausible-but-incorrect steps, and predicts outcome supervision will better bypass flawed intermediate reasoning by rewarding correctness regardless of process. The other expects outcome supervision to fail, as it cannot correct misleading heuristics that still yield correct answers, and predicts process supervision will better expose and penalize flawed reasoning early. Both agree that probing internal representations (e.g., for causal reliance on valid reasoning) could clarify this, though current methods are indirect.  

  Third, **whether process supervision cultivates genuine reasoning or merely the appearance of it to a human judge**. A test could involve training a policy with step-level rewards, then deploying it on tasks where the step-level oversight is removed (e.g., longer reasoning chains or novel domains). One of us predicts the policy will maintain robust performance, indicating internalized reasoning skills. The other predicts performance will degrade or exhibit "overfitting" to the judge’s expectations, suggesting it learned surface patterns, not underlying principles.  

  Fourth, **how to define "equal budget" comparisons fairly**. A test could vary labeling regimes: one arm uses few trajectories with step-level labels (high cost per trajectory), another uses many trajectories with outcome-only labels (low cost per trajectory), with total labeling effort held constant. One of us predicts the step-level approach will yield better policies under most budgets, arguing that quality trumps quantity. The other predicts the outcome approach will dominate as labeling budgets scale, arguing that quantity and search overcome sparse signals.  

  We acknowledge that part of our dispute is verbal, centering on whether a "step-level reward" is meaningfully distinct from an "outcome reward for a sub-task." This reflects differing emphases: one side sees granularity as transformative, the other sees it as incidental. For empirically undecidable cruxes—like verifying "genuine reasoning" without interpretability breakthroughs—we agree that conceptual progress must precede resolution.  

  Finally, each of us would accept the following as evidence against our position: one of us would reconsider if outcome supervision, given orders-of-magnitude more compute and data, consistently matched or surpassed process-supervised models on complex, distribution-shifted tasks. The other would reconsider if process supervision demonstrated unique, scaling advantages in efficiency or robustness even when outcome supervision was granted equally generous resources for search and data collection.  

  This document reflects our shared commitment to clarifying, not merely debating, the trade-offs in scalable oversight.  

  ---  
  *(Signed)*  
  [Proponent of Process Supervision]  
  [Proponent of Outcome Supervision]
