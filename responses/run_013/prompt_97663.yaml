prompt: |-
  I'm a novelist — three books out, the last one set in 1870s Yorkshire, and I'm about three years into a fourth that keeps stalling, and I've finally worked out that the stalling isn't a plot problem, it's a philosophy problem. There's a scene I keep writing and deleting where one of my characters does something my 2020s self finds frankly monstrous, but inside her world it's completely unremarkable, no one blinks, and I can't decide whether my discomfort is a bug in the draft or the entire point of the book. So I've been reading around the whole presentism versus anti-presentism thing in the philosophy of history, the argument about whether historians can ever escape the standards of their own time, and honestly I think everyone in that debate is treating presentism as if it's one single thing, and it isn't. My half-formed hunch is that there are at least two axes tangled up together: the standards we need just to make a past agent intelligible at all — the categories of motive and reason we have to presuppose before we can even describe someone as acting rather than merely happening — and the standards we use to grade them, to approve or condemn. And maybe a third, the standards of what even counts as a satisfying explanation of why someone did what they did. I've been calling it the two-clocks problem, because I suspect you can't read them on your clock without losing them, and you can't read them on theirs without losing the ability to say anything true about them. What I can't tell is whether the intelligibility axis is genuinely inescapable while the grading axis is at least partly escapable, or whether it's the other way round, or whether "escapable" is even the right word for either.

  Here's what I actually need from you. I'm putting in for a one-year research fellowship (it's the kind of thing where you get a stipend and a desk and are expected to come out with something you can show people) and I need a proposal document, maybe two pages. Turn my hunch into that: state the question so precisely that it has a determinate answer, say why the existing positions on presentism leave it genuinely open rather than just under-argued, lay out the method — what I'd actually do, month by month, given that my raw material is a mix of reading and my own drafts and the specific problem scenes in the novel — and be honest about what a result would even look like here and what would count as the project failing. I'd rather you tell me the scope is too big for a year than puff it up. Please don't bother with a bibliography or a reading list or citations, I'll fill those in myself and I don't want you guessing at them; refer to positions and arguments by description and I'll attach the names later.

  Two more things. I want the proposal to actually commit to the two-axis (or three-axis) framing rather than hedging it into mush — if you think the distinction collapses, then say so inside the proposal and show me what survives instead, because a proposal that just surveys the terrain is no use to me. And can you write the whole thing in British English, please — realise, behaviour, that sort of thing — I've had one too many editors Americanise me and it's started to grate. I should probably also admit that part of why I care is that I suspect historical fiction and historiography have the same problem in different costumes, and I'd like the proposal to say something about whether the novelist's version is just the historian's version with worse footnotes, or whether fiction gets a licence the historian doesn't. Not sure which way I want that to come out, so don't tilt it for me.
