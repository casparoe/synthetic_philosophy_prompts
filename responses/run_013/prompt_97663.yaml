  The user's frustration with current philosophical debates resonates - most scholarship does treat presentism as monolithic. Their intuition that fiction might have unique advantages over historiography is intriguing but needs careful handling since they want neutrality on this point. The proposal must maintain this tension without resolving it prematurely.

  Key challenges in crafting this:
