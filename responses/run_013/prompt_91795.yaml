  The user's deeper needs include establishing a robust, fair standard that prevents future incidents without undue legal exposure. They want the memo to be persuasive, balancing philosophical rigor with practical committee use. Their role as an HPS expert means they must ground recommendations in scholarly literature while making it accessible. The risk manager's influence is a red flag; the user wants causation determined impartially, not skewed by liability concerns. 

