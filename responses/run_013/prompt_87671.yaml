prompt: |-
  You are a philosopher who works on probability and uncertainty, and I would like you to think carefully before answering. I have been trying to work out what I actually think about probability judgments, going by my gut on cases, and I want to know whether one principle lies behind all of them.

  Rolling a fair die and calling a six: one in six, and I mean it as a real number, not a figure of speech. Being handed a die by a stranger, unrolled: I will still say one in six, but I would drop that number the instant I saw a single roll, and it feels like a placeholder rather than a fact. Rain tomorrow: I will say thirty percent if pushed, but the number is doing almost no work, and if I also had a barometer and a forecast the same thirty percent would feel entirely different. Whether a bill before parliament will pass: I refuse to give a number at all, though I have followed politics for years. Whether the next stranger through the door is left-handed: about one in ten, and I am comfortable with that, though I know nothing about him in particular. Whether a particular friend will like a film: sixty percent, and I would stake money on it. Whether some contested historical claim is true: probably, but I will not put a number on it. Two coins each judged two-thirds likely to come up heads, one judgment resting on ten thousand flips and the other on three: I would quote the same odds for both and yet be far more rattled by the second coin's next toss.

  Is there one account of what a probability judgment is that delivers all of these, or must some of my verdicts go? I cannot see why I give a number for the left-handed stranger and refuse one for the bill, since both are one-off cases. I have a vague sense that a probability has two parts, a figure and something like how much backing that figure has, and that I have been conflating them; please test that hunch against the cases and repair it if it is close. I do not want a tour of what famous writers said, and no reading list or citations -- I have heard Keynes's name attached to this and have not read him, so give me the principle, not the scholarship.

  Start by brainstorming the candidate principles you can see, then answer with a single JSON object with these fields: "principle" (one sentence stating the principle you would defend); "components" (an array of objects, each with "name", "statement", and "cases_it_explains", listing the cases from above that clause is needed for); "rival_principle" (an object with "statement" and "verdicts_it_overturns", for the simpler principle that would sacrifice one of my verdicts); "new_case_prediction" (an object with "case", "verdict", and "why", for a case I have not listed that your principle settles); "verdicts_dropped" (an array of objects with "verdict" and "reason", naming any of my verdicts your principle cannot accommodate); and "confidence" (low, medium, or high, with a one-line justification). Keep the prose inside the fields tight.
reasoning: |-
  We are looking for a principle that unifies the user's various probability judgments. The user has described several cases where their willingness to assign a probability and their interpretation of that probability vary. The key observations include:

  1. **Fair die (six)**: Assigns 1/6 as a real number.
  2. **Stranger's die (unrolled)**: Still assigns 1/6 but as a placeholder; would change after a single roll.
  3. **Rain tomorrow**: Assigns 30% but the number feels different when backed by a barometer and forecast.
  4. **Bill passing**: Refuses to assign a number despite expertise.
  5. **Left-handed stranger**: Assigns 1/10 comfortably.
  6. **Friend liking a film**: Assigns 60% and would stake money.
  7. **Historical claim**: Says "probably" but no number.
  8. **Two coins with different evidence**: Same odds (2/3) but more rattled by the coin with less evidence.

  The user suspects that a probability judgment has two components: a figure and the backing (or robustness) of that figure. We need to test if this hunch can explain all cases and if not, what must be dropped.

  ### Brainstorming candidate principles:

  1. **Principle of Evidential Weight (Keynesian-like, but without citation)**:
     - Probability assignments have two dimensions: the probability value (the figure) and the weight of evidence (how much evidence supports that figure).
     - The weight of evidence affects the confidence in the probability value and the willingness to act on it or change it upon new evidence.

  2. **Principle of Single Probability (Standard Bayesian)**:
     - Probability is a single number representing degree of belief, and the only thing that matters is the current belief. The user's reluctance to assign numbers in some cases is due to lack of information, which can be modeled as a prior.

  3. **Principle of Actionability**:
     - Probability numbers are assigned only when they can be used in decision-making (e.g., betting). If the user is unwilling to bet, they won't assign a number.

  4. **Principle of Frequentism**:
     - Probability numbers are assigned only when there is a well-defined reference class of repeated events. One-off events without a clear reference class do not get numbers.

  ### Testing the hunch (two components) against the cases:

  - **Fair die (six)**: High weight (known symmetry) -> real number.
  - **Stranger's die (unrolled)**: Initially same probability but low weight (no evidence about the die's fairness) -> placeholder. A single roll (new evidence) can change the probability because the weight was low.
  - **Rain tomorrow (without instruments)**: 30% with low weight (feels weak). With barometer and forecast, same 30% but higher weight (feels more substantial).
  - **Bill passing**: Refuses because weight of evidence is low? But the user has followed politics for years. Alternatively, the complexity and lack of a clear reference class might make the weight low despite having information.
  - **Left-handed stranger**: Assigns 1/10 because of a clear reference class (population frequency) -> high weight? But note: the user says "I know nothing about him in particular", so it's based on a reference class. However, the weight might be high because the reference class is well-established.
  - **Friend liking a film**: 60% and willing to bet -> this suggests that the weight is high enough to act on. The user has specific knowledge about the friend and the film.
  - **Historical claim**: "Probably" but no number. The weight of evidence might be too low to assign a precise number (e.g., conflicting evidence, lack of data).
  - **Two coins**: Same probability (2/3) but more rattled by the one with three flips because the weight of evidence is low (only three flips) vs. ten thousand (high weight).

  The two-component principle (probability value and weight of evidence) seems to explain:

  - Why the same probability value feels different in different contexts (rain, coins).
  - Why the user is reluctant to assign a number when the weight is low (bill, historical claim) even if they have some information.
  - Why the user is comfortable with the left-handed case (high weight from a clear reference class) but not the bill (low weight despite information? or maybe because the bill is a unique event without a clear reference class).

  But note: the bill case is problematic. The user has followed politics for years. Why refuse a number? The weight of evidence might be low because the event is complex and the user feels they don't have enough information to pin down a precise number? Or because the event is not repeatable and the user doesn't have a clear reference class? The two-component principle can explain it by saying the weight is low.

  ### Rival Principle:

  A rival principle might be the standard Bayesian one: probability is a single number. But then:

  - Why would the same probability (30% for rain) feel different with different backing? The Bayesian might say that the probability is the same but the user is irrational to feel differently. So the user's verdict that the same number feels different when backed by more evidence would have to be dropped.

  ### New Case Prediction:

  We need a new case that the principle can settle. For example:

  - **Case**: A coin that has been flipped 10 times and came up heads 7 times. The user is asked for the probability of heads on the next flip.
  - **Verdict**: The user might assign a probability around 7/10 but would feel less confident (lower weight) than if the coin had been flipped 1000 times with 700 heads (same probability but higher weight).

  ### Verdicts dropped:

  We must check if any of the user's verdicts cannot be accommodated.

  - The bill case: The user refuses to assign a number. Our principle says that when the weight of evidence is too low, we might not assign a precise number. But is that consistent? The user assigns a number for the left-handed stranger (which has a clear reference class) but not for the bill (which is a unique event). So the principle can explain it by saying that the bill has low weight (because of complexity, uniqueness, etc.) even though the user has information.

  However, note that the historical claim is also a unique event and the user assigns "probably" but no number. So that's consistent.

  But what about the friend liking the film? That's a unique event and the user assigns a number. Why? Because the user feels they have enough evidence (high weight) to assign a number? So the key is the weight of evidence, not the uniqueness.

  Therefore, we can accommodate all verdicts.

  ### Final Principle:

  **Principle**: A probability judgment is a composite of a probability value and the weight of evidence supporting it, where the value represents the best current estimate and the weight represents the robustness of that estimate to new evidence and the confidence with which one can act on it.

  ### Components:

  We break the principle into two components:

  1. **Probability Value**: The numerical estimate of the likelihood of the event.
     - Explains: fair die (1/6), stranger's die (1/6 initially), rain (30%), left-handed (1/10), friend (60%), coins (2/3).

  2. **Weight of Evidence**: The amount and quality of evidence backing the probability value, affecting confidence and stability.
     - Explains: 
       - Stranger's die: low weight, so a single roll changes it.
       - Rain: without instruments, low weight; with instruments, higher weight (same value feels different).
       - Bill: low weight (despite information) so no number assigned.
       - Historical claim: low weight so only "probably".
       - Coins: same value but different weight (more rattled by low weight).
       - Friend: high weight so willing to bet.

  ### Rival Principle:

  **Statement**: Probability is solely a degree of belief represented by a single number, and the only rational update is by Bayes' rule upon new evidence.

  **Verdicts it overturns**: 
  - It would require the user to assign the same confidence to the same probability value regardless of the weight (e.g., the 30% rain should feel the same with or without a barometer, and the two coins should be equally rattling). 
  - It would also require assigning a number to the bill and historical claim (by forcing a prior).

  ### New Case Prediction:

  **Case**: Predicting the outcome of a sports match between two teams. The user has seen one team play once and the other team play twenty times.
  **Verdict**: The user might assign the same probability of winning for both teams (say 50%) but would be more confident (higher weight) in the prediction for the team they've seen twenty times.
  **Why**: The weight of evidence is higher for the team with twenty games, making the same probability value more robust.

  ### Verdicts Dropped:

  We claim we can accommodate all, so an empty array? But let's double-check:

  - The bill case: Our principle says the weight is too low to assign a number. The user's verdict is to refuse a number. So that's explained.

  **Verdicts_dropped**: [] (none)

  ### Confidence:

  **Medium**: The principle explains all the cases, but the bill case is tricky because the user has followed politics for years. Why is the weight still low? We have to assume that the complexity and uniqueness of the event make the weight low despite the user's knowledge. This might be a point where the user's intuition and the principle could diverge, but it seems to fit.

  ### JSON Structure:

  Now, we output the JSON as required.
