prompt: |-
  So me and a couple friends have this long-running argument that started as a joke about horror movies and has gotten kind of out of hand. It kicked off when we rewatched The Ring -- the American one, and then the Japanese original that it's a remake of -- and one of us said the cursed videotape is basically a chain letter, which made someone else say no, it's a meme, in the actual technical sense, and then we stayed up half the night on it. So what I want is a proper reading of the movie through the Darwinian theory of culture: Dawkins's original idea that culture is made of little replicating units, memes, plus the people who took that seriously as a science of culture (Blackmore, Dennett, the whole memes-are-replicators-like-genes line), set against the people who think that whole picture is wrong because cultural stuff doesn't actually get copied with high fidelity -- it gets transformed as it passes through minds, so what we should be studying is why some ideas are more 'attractive' to human minds than others, not treating ideas as selfish little agents. I know there's a real fight about whether the meme is a legitimate scientific unit at all or just a cute metaphor, and I want the movie actually used to probe that fight, not just decorated with it.

  Here's the stuff I find genuinely interesting and want you to dig into. The tape's whole deal is that to save yourself you have to make a copy and pass it on, so the movie ties the host's survival to the replicator's spread, which is exactly the move memetics needs. Does the film then dramatize the meme's-eye view -- the idea that the tape 'wants' to spread and we're just the vehicles? And does that reading survive the fact that the tape gets copied perfectly, which is nothing like how real cultural stuff travels -- real memes mutate and garble and degrade, so is the movie secretly modelling a virus or a chain letter rather than a meme, and does that matter for the theory? Second thing: the dead girl at the bottom of the well is definately an agent with a grudge and intentions, and one of the sharpest objections to memetics is that it tries to explain culture without intentions, so is the film's own explanation of the tape (a wronged person's rage) a rival to the memetic one, or does the movie end up needing both at once? I'd also like you to say honestly where the film resists the reading -- a fair critic has to admit the movie might just be a ghost story that happens to have a catchy curse in it, not a meditation on cultural replication at all.

  So give me a real critical reading, faithful in both directions -- dont reduce the film to an illustration of the theory, and dont bend the theory to fit the film -- and at the end tell me what, if anything, the movie shows about the meme debate that the arguments on their own can't. I'm not academic, I've just been chewing on this by myself, so keep it readable. Last line: one sentence starting "Bottom line:" that sums up your verdict on whether the tape is really a meme in the technical sense or not.
