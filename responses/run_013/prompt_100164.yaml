answer: |-
  A theory of individual moral responsibility for collectively produced harms must satisfy several demanding requirements to be adequate for your purpose—guiding individual action under persistent collective failure. Let's build the list carefully, anchoring each requirement to the cases you care about, including your constructed ones, and judging their legitimacy.

  First, the theory must **explain responsibility despite individual causal insufficiency**. This is non-negotiable and motivated directly by your familiar cases: one vote doesn’t swing an election, one steak purchase doesn’t affect meat industry practices, and one person’s emissions don’t tip the climate. If the theory cannot assign responsibility when an act isn’t sufficient for harm, it fails at the outset. This is genuine, not factional; denying it would render the core problem invisible.

  Second, it must **handle causal overdetermination across time without erasing responsibility**. This responds to your first constructed case: imagine someone refrains from activating a device that would flood a valley, knowing an independent geological process will cause the identical flood moments later. Their inaction is necessary only in the narrow temporal window, yet the harm occurs regardless. An adequate theory must explain why they might still bear responsibility for *their* participation (e.g., for choosing to be part of the causal chain), even if the harm was temporally overdetermined. This requirement is genuine, exposing theories that rely on counterfactual difference-making too simplistically. A theory that excuses this individual *solely* because the harm would have happened anyway seems inadequate.

  Third, it must **account for responsibility in non-threshold accumulations with discontinuous harms**. Your second constructed case—countless acts, none necessary, accumulating to a harm with a sharp but unpredictable threshold (e.g., a dam collapse at an unknown saturation point)—is crucial. The theory must explain why individuals can be responsible even when their contribution’s role is inherently vague and unknowable, and no "fair share" can be precisely defined pre-hoc. This requirement is genuine and particularly damaging to accounts demanding identifiable causal necessity or quantifiable individual thresholds.

  Fourth, it must **explain the moral asymmetry between isolated and collective contexts**. Why is buying one steak harmless alone but wrong amid millions of others doing the same? The theory cannot merely stipulate this; it must provide a principled explanation, perhaps grounding wrongness in participation in a harmful practice, reliance on others’ complicity, or the expression of certain attitudes. This is genuine; stipulation avoids the central puzzle and fails action-guidance by leaving the agent confused about *why* context matters.

  Fifth, it must **provide action-guidance under reasonable expectations of collective failure**. This responds to your purpose: what should an individual do knowing others will likely keep harming? The theory must avoid paralysis (e.g., "my abstention won’t matter, so I’m permitted") without resorting to unrealistic optimism about collective compliance. It must offer reasons to act (or refrain) that hold even when the collective harm is assured. This is genuine; theories ignoring this reality are practically inert.

  Sixth, it must **avoid pervasive moral luck**. If responsibility hinges entirely on whether the collective *happens* to cross a threshold (e.g., an election is won by one vote, making *your* vote pivotal), luck dominates. The theory should ground responsibility in features within the agent’s control (e.g., intent, knowledge, type of act) rather than contingent outcomes. This requirement is genuine but stringent; it starkly conflicts with some causal accounts and is a major excluder of otherwise plausible views.

  Now, judgments on tensions and excluders: The most severe tension lies between **avoiding moral luck** and **handling discontinuous accumulations**. If responsibility requires control, but the harm’s occurrence depends on unknowable thresholds affected by others, satisfying both is deeply challenging. **Explaining the asymmetry** also conflicts with purely causal views. The single most excluding requirement is **handling non-threshold accumulations**; it devastates theories demanding identifiable necessity or precise shares. **Action-guidance under collective failure** is a close second, as it demands practical relevance where many theories lapse into futility.

  How do main families fare?
  - **Causal contribution** theories (e.g., NESS conditions) handle causal insufficiency and temporal overdetermination better than necessity, but flounder on accumulations without thresholds and moral luck. They often struggle with asymmetry and action-guidance under failure.
  - **Complicity** models (focusing on agency in collective wrongdoing) excel at asymmetry and collective context, often handle overdetermination, and can guide action under failure. They may blur individual responsibility in accumulations and face challenges specifying the "collective" in diffuse cases.
  - **Fair-share** accounts address insufficiency and can motivate action, but collapse on non-threshold accumulations (no definable share) and can succumb to moral luck if the harm’s occurrence affects blame. They sometimes stipulate asymmetry.
  - **Character/expression** theories avoid luck and explain asymmetry well (e.g., expressing disregard), supporting action-guidance even under failure. But they struggle linking responsibility directly to *harm* rather than attitude, risking disconnect in cases like temporal overdetermination ("I didn’t *cause* harm, but my act was callous").

  The list’s work is clearest in exposing how each family stumbles on at least one core requirement—especially your constructed cases and the demand for action-guidance amidst failure. A truly adequate theory must weave these threads without leaving any frayed.
