  Hmm, the argument cleverly uses Frankfurt's famous counterexample against the Principle of Alternate Possibilities (PAP) to undermine source views. Premise (2) is standard Frankfurt setup, (3) is the key Frankfurt intuition, and (4)-(6) generalize to determinism. The real tension is between source conditions (1) and the actual-sequence grounding in (4). 

  I notice the user wants to preserve (1) – the sourcehood requirement – so they're likely a source incompatibilist or leeway theorist. But rejecting (3) would abandon Frankfurt's core insight, which even many incompatibilists accept. Premise (5) is the sneaky pivot: it equates Frankfurt cases with determinism by calling both "chains of prior events indifferent to the agent." That's where the argument overreaches. 

  Ah! The cost analysis matters because:
