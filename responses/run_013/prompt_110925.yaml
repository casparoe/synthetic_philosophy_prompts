  - Source incompatibilists (like me) can bite the bullet on (5): Frankfurt cases aren't deterministic chains because the actual sequence involves unmanipulated reasoning. This preserves (1) and (3) but requires careful metaphysics of "indifference."
  - Compatibilists happily accept (6)-(7) but must explain away coercion cases (8) via finer-grained control conditions.

