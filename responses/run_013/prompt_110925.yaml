answer: |-
  Your argument's weak link is **premise (5)**. It claims that in *both* Frankfurt cases and ordinary deterministic cases, the "actual sequence is a chain of prior events indifferent to the agent." This misdescribes the Frankfurt case and smuggles in determinism prematurely.

  **Why it looks innocent:**  
  (5) seems intuitive: "indifferent prior chains" appear identical if the intervener doesn't act. It frames the difference as merely *how* alternatives are blocked (device vs. laws), not the *source* of action.

  **Cost of rejecting (5):**  
  - **Leeway Incompatibilist:** Must deny (3) instead (responsibility without alternatives). Cost: Rejects the widely accepted core insight of Frankfurt cases.  
  - **Source Incompatibilist:** Minimal cost. They already distinguish unmanipulated actual sequences (Frankfurt) from wholly deterministic chains. Rejecting (5) preserves (1)-(4) while blocking (6)-(8).  
  - **Compatibilist:** No cost. They accept (6)-(7) but deny (8) by distinguishing coerced/brainwashed sequences (lacking reasons-responsiveness) from standard deterministic actions. They reject (1)'s strong ownership requirement.

  **Explanation:**  
  Premise (5) falsely equates the Frankfurt case's *untriggered intervener* with the *deterministic laws*. In Frankfurt, the actual sequence involves the agent’s *own* reasoning (satisfying (1)), uncontaminated by intervention. The intervener is causally inert. In ordinary determinism, the prior chain *constitutively includes* factors external to the agent’s agential control, potentially violating (1). The difference isn't just *how* alternatives are blocked but *what constitutes the actual source*. Rejecting (5) allows Frankfurt cases to satisfy (1) without implying all deterministic acts do.

