  We are designing a decision procedure for evaluating purported qualia in research, based on Dennett's critique. The four marks of qualia targeted are: ineffable, intrinsic, private, and directly apprehensible.

  Step 1: State the four marks and provide a way for a research assistant to identify them from a report.

  The four marks (as per Dennett's target) are:
  - Ineffable: The quality cannot be communicated or described in words (beyond pointing or analogies).
  - Intrinsic: The quality is non-relational; it does not depend on external context or relations to other things.
  - Private: The quality is knowable only to the subject; others cannot experience it directly.
  - Directly apprehensible: The quality is known immediately and with certainty to the subject; no inference or interpretation is needed.

  How to identify from a report:
  - Ineffable: Look for phrases like "I can't describe it", "there are no words", or reliance on metaphors that the participant admits are inadequate.
  - Intrinsic: The report emphasizes that the experience has a self-contained character that doesn't change with context or is not about how it relates to other things.
  - Private: The participant insists that others cannot know what it's like for them, or that it's only accessible from the first-person perspective.
  - Directly apprehensible: The participant claims direct, unmediated knowledge of the quality (e.g., "I just know it", "it's given directly").

  If the report includes all four, then it's a candidate for being a thick quale. Otherwise, it might be missing one or more.

  Step 2: For each mark, one question to test if it's doing any work.

  For each mark, we want to see if the mark is doing any explanatory or predictive work, and whether the alleged feature can be detected, compared, or falsified independently.

  - Ineffable:
    Question: "Can we develop a public measure (e.g., a scale, a behavioral indicator, a physiological correlate) that captures this feature without relying on the participant's description? If not, then the ineffability mark is doing work (preventing public measurement)."

  - Intrinsic:
    Question: "Does the feature change when the context (e.g., environment, expectations, concurrent stimuli) changes? If we cannot detect any change in the feature when context changes (because it's intrinsic) but we also cannot measure it independently, then the intrinsic mark may prevent us from relating it to contextual factors."

  - Private:
    Question: "Could two independent observers (or instruments) ever agree on the presence or degree of this feature without relying on the participant's report? If not, then the privacy mark is doing work (making third-person verification impossible)."

  - Directly apprehensible:
    Question: "Could the participant be wrong about this feature? If not (i.e., if the participant's report is taken as incorrigible), then the direct apprehension mark is doing work (making the feature immune to error)."

  Step 3: The two-tasters pattern.

  We consider a scenario: two participants (or the same participant at two times) who are in the same state by all objective measures (same stimuli, same behavior, same physiological readings, same verbal reports about other aspects) but disagree about whether the experience itself changed or only their attitude toward it.

  - If no possible observation (behavioral, physiological, or contextual) could settle the dispute, then the procedure concludes that the purported quale (with the four marks) is not a useful construct for the study because it doesn't add predictive or explanatory power beyond the observable dispositions.

  In place of the disputed construct, the procedure recommends replacing it with a dispositional or report-based redescription. For example, instead of the intrinsic quality of the experience, we record the participant's disposition to report it in certain ways, or the verbal report itself without reifying it as a private object.

  Step 4: Verdict in one of three forms.

  After the above steps, we arrive at one of:

  A. Keep the construct as an ordinary measurable feature: If we can drop one or more of the four marks and still have a measurable construct (e.g., by operationalizing it in terms of behavior, physiology, or report that is not taken as incorrigible). We note what marks were dropped.

  B. Replace it with a dispositional or report-based redescription: If we cannot measure the construct as a direct feature but can still capture the participant's dispositions (e.g., their tendency to describe it in certain ways, or their reactions). This is a move away from reifying the quale.

  C. Flag it as a claim the study cannot use as a dependent variable: If the construct is presented with all four marks and cannot be operationalized without them, then we record the participant's exact words (verbatim) without turning it into a variable we measure or analyze quantitatively.

  Step 5: Mark points of indecision.

  If at any step there is ambiguity (e.g., is the feature really intrinsic? the participant says it is, but we see contextual effects), then we must decide:

  - If the ambiguity is about the participant's report (what they mean), the participant should be consulted (if possible) for clarification.
  - If it's about the clinical or theoretical relevance, the clinician should decide.
  - If it's about methodological feasibility or study design, the principal investigator (PI) should decide.

  Now, we run the procedure on three cases.

  Case (a): Tinnitus study. Participant reports an ineffable quality of the sound distinct from loudness and distress.

  Step 1: Check the four marks.
  - Ineffable: Participant says it's ineffable (distinct from loudness and distress, and hard to describe).
  - Intrinsic: The quality is presented as inherent to the sound itself.
  - Private: Only the participant can know it.
  - Directly apprehensible: The participant knows it immediately.
  All four marks are present.

  Step 2: Test each mark.
  - Ineffable: Can we measure it without the participant's description? Probably not, because it's ineffable. So ineffability is doing work.
  - Intrinsic: Does it change with context? If the context changes (e.g., masking sounds) and the participant says the intrinsic quality remains the same, we have no way to independently verify. Intrinsic mark is doing work.
  - Private: Can others detect it? No, because it's private. Privacy mark is working.
  - Directly apprehensible: Could the participant be wrong? They say they know it directly, so we take their report as certain. This mark is working.

  Step 3: Two-tasters pattern. Consider two people with identical tinnitus (same loudness, same distress, same brain activity, etc.) but one says the intrinsic quality changed and the other says it didn't. Without any observable difference, we cannot settle the dispute. Thus, the construct is not useful as a dependent variable.

  Step 4: Verdict. We cannot use this as a measurable construct. We should replace it with a dispositional or report-based redescription? But note: we already have loudness and distress. The ineffable quality might be captured by the participant's choice of metaphors or patterns in their free descriptions, but we cannot measure the quality itself. Alternatively, we might flag it as verbatim report without reification.

  Given the four marks are all present and doing work, and the two-tasters pattern shows it's not adjudicable, we choose option C: flag it as a claim we record verbatim without reification. We might also note that the participant's report of the quality is a disposition (to report in that way) and we can record that disposition.

  But note: the participant says it's distinct from loudness and distress. We can measure loudness (e.g., on a scale) and distress (on a scale). The ineffable quality is what is left. However, if we try to measure it by asking the participant to rate it on a scale, we are turning it into a measurable construct but dropping the ineffability mark (because we are using a scale) and the intrinsic mark (because we are relating it to numbers). So we might offer that as an option (A) but note that we are dropping ineffability and intrinsicness.

  But the participant insists that any number misses it. So if we force a scale, we are overriding the participant's report. Therefore, it's better to go with C: record verbatim and not use as a variable.

  Case (b): Wine-tasting study. Change of label changes reported pleasantness, but participants insist the taste itself is unchanged.

  Step 1: Check the four marks for the "taste itself".
  - Ineffable: The taste itself might be described, but participants might say that the real quality is beyond words? In this case, they are only claiming that the taste is unchanged. They are not necessarily saying it's ineffable, but they might be. Let's assume they are referring to the intrinsic taste quality. We'll take the purported quale as the intrinsic taste quality.

  The report: participants say the taste itself is unchanged. They are implying that the taste has an intrinsic quality that is independent of the label. So:

  - Ineffable? Not necessarily. They might describe the taste (e.g., fruity). But if they say the real taste is beyond the description, then ineffable. We'll assume they can describe it, so perhaps not ineffable. But the key mark they are using is intrinsic: the taste itself is unchanged by the label. Also, they are claiming it is directly apprehensible (they know the taste directly). Privacy: only they experience it. So all four might be present, but let's see.

  But note: they are not claiming ineffability necessarily. We can have a construct that is intrinsic, private, and directly apprehensible without being ineffable. So let's say the marks present: intrinsic, private, directly apprehensible. Ineffable? Not claimed.

  Step 2: Test the marks that are present.

  - Intrinsic: The question: does the feature change with context? Here, the context (label) changed, and the pleasantness changed, but participants say the intrinsic taste did not. We cannot independently verify the intrinsic taste without the label effect? Actually, we have the participants' reports about the taste itself. We could ask them to describe the taste (which they do) and see if the descriptions change with the label? If they do not, then we have a measure. But if they do change, then the intrinsic claim is challenged.

  In this study, the label changed and the pleasantness rating changed, but the participants say the taste itself is the same. We can ask for a description of the taste (e.g., using a fixed set of attributes). If the descriptions of the taste attributes (sweet, sour, etc.) do not change but the pleasantness does, then we have a way to measure the taste independently of the pleasantness. So the intrinsic mark might not be doing work because we can measure it via description.

  But note: the participants are claiming that the taste itself is unchanged. We can measure that by their descriptions. So we don't need the intrinsic mark to block measurement.

  - Private: We can have multiple tasters. If they agree on the taste attributes, then it's not entirely private. We can have inter-subject agreement.

  - Directly apprehensible: They report the taste, but could they be wrong? In this case, if they are influenced by the label and don't realize it, then maybe they are wrong? But they insist the taste is the same, so they are claiming direct knowledge.

  But note: we can test if the taste descriptions change with the label. If they don't, then we have a public measure. If they do, then the participants' claim that the taste didn't change might be false. So the direct apprehension mark is challenged because they might be mistaken.

  Step 3: Two-tasters pattern: two participants (or one in two conditions) with the same wine and same label, but one says the taste changed (because of the label) and the other says it didn't? Actually, in this case, we have a change of label and the participants say the taste didn't change. But suppose we have two participants who taste the same wine with the same label and have the same objective measures, but one says the taste changed (from a previous trial) and the other says it didn't? Without any change in the stimulus, we cannot settle it. But note: we can measure their descriptions. If they describe it differently, then we have a difference. If not, then we might say the experience is the same.

  But in the current setup, the label changed and pleasantness changed but the participants claim the taste didn't. We can measure their taste descriptions and see if they changed. If they didn't, then we can use the taste descriptions as a measure of the taste quality. If they did, then we have a conflict.

  Step 4: Verdict. We can keep the construct of "taste quality" by measuring it via descriptive attributes (e.g., using a standard wine wheel). We are dropping the ineffability mark (if it was present) because we are describing it. We are also making it public (via shared vocabulary) and not private. We are not treating it as intrinsic in a way that blocks measurement. So we choose option A: keep as an ordinary measurable feature by using descriptive ratings. We have dropped ineffability and privacy (to the extent that we have a shared language).

  But note: the participants might say that the description doesn't capture the ineffable residual. Then we might have a problem. But in this case, they are not claiming ineffability. They are only claiming that the taste itself is unchanged by the label, and we can capture that by their descriptions.

  Case (c): Proposal from a psychiatrist to measure the felt quality of depression as a primary outcome.

  Step 1: The felt quality of depression. The psychiatrist might mean an intrinsic, ineffable, private, and directly apprehensible quality of the experience of depression.

  Check the marks:
  - Ineffable: Often, depression is described as having a particular feel that is hard to describe.
  - Intrinsic: The feeling is presented as a raw feel of depression.
  - Private: Only the patient knows what it's like.
  - Directly apprehensible: The patient knows it directly.

  All four marks are likely.

  Step 2: Test each mark.
  - Ineffable: Can we measure it without the patient's description? If it's ineffable, then we cannot. So ineffability is doing work.
  - Intrinsic: Does it change with context? For example, if the context changes (e.g., the patient is distracted) and the feeling remains, we have no independent measure. Intrinsic mark is working.
  - Private: Can others detect it? No, because it's private. Privacy mark working.
  - Directly apprehensible: Could the patient be wrong? Typically, we take the patient's report as authoritative. So direct apprehension is working.

  Step 3: Two-depressed pattern: two patients with the same symptoms (same scores on depression scales, same behavior, same physiology) but one says the felt quality of their depression changed (e.g., after an intervention) and the other says it didn't. Without any observable difference, we cannot settle it. Therefore, the construct is not useful as a dependent variable.

  Step 4: Verdict. We cannot use this as a measurable construct for a primary outcome. We must replace it with a dispositional or report-based redescription. For example, we might measure the patient's self-reported symptoms (using standard scales) or behavioral indicators. Alternatively, we might record the patient's description of the felt quality verbatim without reification (option C). But note: the psychiatrist wants it as a primary outcome. We cannot measure it directly.

  Therefore, we choose option C: flag it as a claim we record verbatim without reification, and do not use as a dependent variable. Or, we might try to use a scale that asks the patient to rate the intensity of the feeling, but that would drop the ineffability and intrinsicness. However, the psychiatrist might not like that.

  At least one of the three should come out in a way the group will not like. The group's clinicians and statisticians want measurable constructs. Case (c) is the one they won't like because the psychiatrist wants to measure the felt quality as a primary outcome, but we are saying we cannot measure it as such. We have to either drop the four marks (and turn it into a scale) or record it verbatim without using it as a variable.

  What the procedure cannot do:

  - It cannot capture the participants' insistence that there is something more to their experience than what we are measuring. The procedure is designed to avoid reifying qualia, so it may discard what the participant feels is the most real aspect.

  - It may misfire by over-zealously discarding constructs that could be operationalized in a way that respects the participant's experience without the four marks. For example, in the tinnitus case, we might develop a rich descriptive system that captures some aspects of the ineffable quality.

  - It may wrongly discard constructs that are in fact accessible through new measurement techniques (e.g., advanced neuroimaging) that we haven't considered. But if it's private and ineffable, then by definition, these techniques wouldn't capture it.

  - The participants are right that their experience has a particular character that is not captured by numbers or behavior. The procedure has no way to record that character except through the participant's own words (verbatim) and even then, without using it in analysis.

  The procedure is pragmatic for research, but it may feel dismissive of the lived experience.
answer: |-
  ### Decision Procedure for Evaluating Purported Qualia

  This procedure is designed to evaluate constructs purported to be qualia (with the four marks: ineffable, intrinsic, private, and directly apprehensible) in a research context, based on Daniel Dennett's critique. The goal is to determine whether such constructs can be operationalized for empirical study or must be redescribed or set aside. A research assistant can run this in ~20 minutes per construct using interview notes, participant reports, or clinician proposals.

  ---

  #### **Step 1: Identify the Four Marks**
  - **Definition of the four marks** (a construct must be described as having all four to qualify as a "thick" quale in Dennett's sense):
    1. **Ineffable**: Cannot be fully communicated or described in language (e.g., "words can't capture it").
    2. **Intrinsic**: A non-relational, self-contained property (e.g., "it's just how it feels, regardless of context").
    3. **Private**: Knowable only to the subject; others cannot access it directly (e.g., "no one else can know what it's like for me").
    4. **Directly apprehensible**: Known immediately and with certainty, without inference (e.g., "I just know it directly").
    
  - **How to identify from a report**:
    - **Research assistant task**: Scan the report for explicit or implicit claims matching each mark. If all four are present (e.g., participant uses phrases like "indescribable," "just itself," "only I experience it," "I know it directly"), flag the construct as a purported thick quale. If fewer than four are present, note which are missing and treat it as an "ordinary" construct for now.

  ---

  #### **Step 2: Test Each Mark for Empirical Work**
  For each of the four marks present, ask one question to assess if the mark precludes empirical utility. If the answer to any question is "no," the mark is doing problematic work (blocking detection, comparison, or falsification):
  1. **Ineffable**: *Can this feature be correlated with public measures (e.g., behavior, physiology, or verbal descriptors) without relying solely on the participant's description?*  
     - If no, it blocks operationalization into measurable variables.
  2. **Intrinsic**: *Could this feature change if context (e.g., environment, expectations, or interventions) changes, and could that change be detected independently?*  
     - If no, it blocks relational analysis (e.g., cause-effect).
  3. **Private**: *Could two observers agree on this feature without relying on the participant’s report?*  
     - If no, it blocks intersubjective verification.
  4. **Directly apprehensible**: *Could the participant be mistaken about this feature, and could such an error be detected?*  
     - If no, it blocks falsification and treats reports as incorrigible.

  ---

  #### **Step 3: Apply the Two-Tasters Pattern**
  - **Scenario**: Imagine two participants (or one participant at different times) with identical observable properties (e.g., behavior, physiology, context, and dispositions) but who disagree on whether the *experience itself* changed or only their *attitude* toward it (e.g., "the pain feels the same, but I hate it more" vs. "the pain itself got worse").
  - **Test**: Ask: *Is there any possible observation (e.g., neural, behavioral, or contextual) that could resolve this dispute?*
  - **Conclusion and recommendation**:
    - If **no observation could adjudicate**, conclude the construct is empirically vacuous—it adds no predictive/explanatory power. Replace it with a **dispositional redescription** (e.g., "tendency to report distress" instead of "pain quality") or a **report-based redescription** (e.g., "verbal description of the experience" without reifying it as a private object).
    - If evidence **could** resolve it, retain the construct but drop any marks that failed Step 2.

  ---

  #### **Step 4: Verdict**
  Based on Steps 1–3, choose one outcome:
  - **A. Keep as ordinary measurable feature**: The construct can be operationalized by dropping one or more marks (e.g., using ratings, behavior, or physiology). Specify what was dropped (e.g., "dropped ineffability by using a scale").
  - **B. Replace with dispositional/report-based redescription**: The construct is not measurable as-is; use proxies like response tendencies, verbal reports, or behavioral dispositions (e.g., "readiness to describe the experience as changing").
  - **C. Flag and record verbatim without reification**: The construct has all four marks and fails Steps 2–3. Do not use it as a dependent variable; record the participant's exact words in transcripts but avoid quantification or reification.

  ---

  #### **Step 5: Handle Indecision**
  - **Points of ambiguity**: 
    - **Identification (Step 1)**: If it's unclear whether a mark is present (e.g., is "private" implied?), the **participant** decides via follow-up questions (e.g., "Can others know this directly?"). Grounds: Their report defines the construct.
    - **Test outcomes (Step 2)**: If a mark's test is ambiguous (e.g., could context affect it?), the **clinician** decides based on clinical relevance. Grounds: Domain expertise.
    - **Two-tasters (Step 3)**: If it's unclear if observations could resolve disputes, the **principal investigator (PI)** decides based on study feasibility. Grounds: Methodological pragmatism.

  ---

  ### Running the Procedure on Three Cases

  #### **Case (a): Tinnitus Study**
  - **Report**: Participant describes an "ineffable quality" of tinnitus distinct from loudness/distress.
  - **Step 1**: All four marks present (ineffable, intrinsic, private, directly apprehensible).
  - **Step 2**: 
    - Ineffable: No public measure possible without description → mark blocks work.
    - Intrinsic: No detectable change with context → mark blocks work.
    - Private: No observer agreement possible → mark blocks work.
    - Directly apprehensible: Participant can't be wrong → mark blocks work.
  - **Step 3 (Two-tasters)**: Two participants with identical tinnitus (loudness, distress, behavior) disagree on whether the "quality" changed. No observation resolves this → construct is empirically vacuous.
  - **Verdict**: **C. Flag and record verbatim without reification**. We cannot quantify the "quality"; record descriptions (e.g., "like a high-pitched buzz") but do not treat it as a variable. Use loudness/distress scales as dependent variables instead.
  - **Outcome**: Construct discarded as a measurable feature; only the report is preserved.

  #### **Case (b): Wine-Tasting Study**
  - **Report**: Label change alters reported pleasantness, but participants insist the "taste itself" is unchanged.
  - **Step 1**: Marks present: **intrinsic** (taste is self-contained), **directly apprehensible** (known immediately). **Ineffable?** Not claimed (participants describe tastes). **Private?** Not emphasized (taste is potentially shareable). Not a thick quale.
  - **Step 2**: 
    - Intrinsic: Context (label) changes, but taste descriptions (e.g., "fruity") remain consistent → can be measured independently. Mark does not block work.
    - Directly apprehensible: Participant could be wrong (e.g., label bias) → mark weakens but doesn’t block work.
  - **Step 3 (Two-tasters)**: Two participants with identical tastings disagree on whether the "taste itself" changed. Descriptions (e.g., flavor profiles) resolve this → dispute is adjudicable.
  - **Verdict**: **A. Keep as ordinary measurable feature**. Drop intrinsic/directly apprehensible marks; measure taste via descriptive scales (e.g., sweetness/sourness ratings) or behavioral outcomes (e.g., consumption). Pleasantness is a separate variable.
  - **Outcome**: Construct retained; "taste" operationalized via attributes.

  #### **Case (c): Psychiatrist Proposal for Depression**
  - **Report**: Measure the "felt quality of depression" as a primary outcome (e.g., "the heavy, suffocating feeling").
  - **Step 1**: All four marks present (ineffable, intrinsic, private, directly apprehensible).
  - **Step 2**: 
    - Ineffable: No public measure beyond self-report → mark blocks work.
    - Intrinsic: No detectable change with context → mark blocks work.
    - Private: No observer agreement → mark blocks work.
    - Directly apprehensible: Participant incorrigible → mark blocks work.
  - **Step 3 (Two-tasters)**: Two patients with identical depression symptoms (scores, behavior) disagree on whether the "felt quality" changed (e.g., after therapy). No observation resolves this → construct vacuous.
  - **Verdict**: **C. Flag and record verbatim without reification**. Do not use as a primary outcome; record descriptions verbatim. Replace with dispositional measures (e.g., "tendency to report heaviness") or standard scales (e.g., PHQ-9).
  - **Outcome**: Construct discarded as a dependent variable.

  ---

  ### Which Outcome Will the Group Not Like?
  - **Case (c)** will be unpopular. The psychiatrist wants the "felt quality" as a primary outcome, but the procedure flags it as empirically unusable. This clashes with clinical intuition that the subjective "feel" is central to depression. However, the procedure shows it cannot be measured without dropping its defining marks, risking reification.

  ---

  ### What the Procedure Cannot Do
  1. **Misfires and limitations**:
     - **Wrongly discards valid phenomena**: May dismiss constructs that *could* be operationalized with future tools (e.g., neuroimaging correlates of "tinnitus quality"). It prioritizes current measurability over potential discovery.
     - **Overlooks nuanced experience**: Participants are right that some experiences feel irreducible to behavior or reports. The procedure has no way to capture this "excess" beyond verbatim quotes, potentially flattening lived experience.
     - **Biases toward simplicity**: Favors constructs that fit existing methods (e.g., scales). Complex, multidimensional experiences (e.g., depression's "heaviness") may be reduced to dispositions.
     - **Fails for ambiguous marks**: If a participant's report is poetic or metaphorical (e.g., "depression is a dark cloud"), the procedure may misclassify it as "ineffable" when it could be coded thematically.

  2. **What participants are right about**: Participants correctly report that their experiences have a first-person character that feels immediate and unique. The procedure cannot capture this phenomenological truth—it only records descriptions or proxies. This may feel dismissive, but it ensures methodological rigor.

  **Recommendation**: Use this procedure to avoid qualia reification, but pair it with qualitative methods (e.g., structured interviews) to preserve phenomenological richness. Update it as measurement techniques evolve.
