prompt: |-
  I am the managing editor of a young, broad-scope, peer-reviewed journal that publishes across the natural sciences and deliberately keeps a door open to work that sits near the boundary — cosmology, the more speculative corners of theoretical biology, consciousness research, quantitative social science, and the occasional submission from a field whose standing is contested. Our referees have developed a habit that has begun to cost us: when they want a paper rejected, a good number of them write, in one form or another, that the manuscript is not science at all and should never have been sent out for review. This has now cut both ways. In one case we published something that, after a long and ugly correspondence, we had to reclassify as not a scientific claim in any sense, which did our credibility no good. In another, a reviewer's not-science objection led us to reject a manuscript that later appeared elsewhere, where it was tested and, as it happened, refuted — a scientific outcome reached by scientific means, which we had turned away on the grounds that it was not science to begin with. The board has therefore asked me to produce a screening procedure that the three of us on the editorial team can run on a new submission in about half an hour — we screen perhaps four a month before review — and that will sort a manuscript into one of three outcomes: send it out for review as a scientific claim; decline it as not a scientific claim, with a letter the author can read without feeling accused of fraud; or stop and refer the matter to the editor-in-chief, because what is really at stake is what kind of journal we want to be rather than any fact about the manuscript. Please write that procedure as a set of questions to be asked in order, saying for each what counts as a sufficient answer, where the procedure terminates, and where it hands the decision to a person. It will be run by editors with a solid general science education and no specialist knowledge of the submission's field, it must not depend on familiarity with that field's literature, and it has to yield a short written justification we can put in the decision letter and in the board minutes. Any decline on demarcation grounds must be signed off by the board, so the procedure should make the reasoning easy to inspect and defend.

  The procedure has to survive the cases that actually cause us trouble, so treat the following as constraints on it rather than as background. Some claims are unfalsifiable only in practice, because their defenders can adjust a surrounding assumption whenever the data threaten them: a cosmologist who tells us that had the observations come out differently they would have changed the mechanism that generates the ensemble of universes is making a claim of that kind, and I need the procedure to say something useful about it rather than simply shrugging. Others are probabilistic or statistical, and can never be contradicted by a single observation, only by an observation relative to a threshold and a decision rule that somebody chose; here the falsifiability question has to be answered as falsifiable under which rule, and set by whom. Still others are bare existence claims, of the form that there is at least one thing of a certain sort somewhere, which no observation can refute and which we nevertheless call science without hesitation. And some claims are perfectly testable, were tested, and came out one way or the other, in fields we happen to hold in low regard; the procedure must not let an editor's disbelief do work that a demarcation argument is supposed to do, since the entire point of the exercise is to keep the question of whether a claim is scientific separate from the question of whether we believe it. At the far end sit claims whose authors say outright that no possible observation could tell against them, which we should decline as not scientific claims while still refusing to call them pseudoscience or misconduct, because not being a scientific claim and being bad science are different verdicts and the letter has to keep them apart.

  Then run the procedure on three submissions from last month's queue and show me the paperwork each one produces. The first argues that our universe is one member of an enormous ensemble produced by a stated mechanism, offers a statistical prediction that the authors say the existing data already satisfy, and, when pressed on what would refute it, says they would modify the mechanism. The second is a preregistered, multi-site, adequately powered study reporting a positive effect in a field most of my board regards as fringe; as far as I can tell it is falsifiable, it was tested, and the test was severe. The third argues that certain experiences have a property that no possible observation could disclose, and the author says as much and treats it as a point in the argument's favour. For at least one of these I expect an answer I will not enjoy, and I would rather you tell me plainly which step is doing the work when it does. Finally, tell me which of the distinctions the procedure rests on would be lost if I compressed it to a single page for a new associate editor, which of its steps are judgments in procedural clothing, and what the procedure simply cannot decide.
reasoning: |-
  Hmm, the user is the managing editor of a multidisciplinary science journal facing a tricky problem with peer reviewers dismissing manuscripts as "not science." They need a practical screening procedure that editors can run in half an hour to classify submissions into three categories: legitimate science (send for review), non-science (decline politely), or borderline cases needing EIC input. 

  The constraints are fascinating - they must handle edge cases like unfalsifiable-but-adjustable theories (cosmology ensembles), probabilistic claims, existential statements, and prevent editorial bias from masquerading as demarcation. The procedure must output defensible justifications since board sign-off is required for declines. 

  Key challenges I see: 
  First, avoiding the Popperian trap where falsifiability becomes either too rigid (rejecting stats/astro) or too loose (allowing "god of the gaps" theories). The solution might lie in demanding testability rather than strict falsifiability - can the claim interact with evidence at all? 

  Second, preventing epistemic trespassing. Editors aren't specialists, so the questions must probe methodological substance without needing field knowledge. Focusing on "what would change minds" rather than "is this true" seems promising. 

  Third, handling self-admitted unfalsifiability (like submission 3) without accusing authors of bad faith. The distinction between "non-science" and "bad science" needs procedural teeth - perhaps a direct question about conceivable counterevidence. 

  For the test cases:
  Submission 1 (cosmic ensemble) is tricky. Their willingness to tweak the mechanism suggests it's non-testable, but the statistical prediction gives it a veneer of science. The procedure should flag this as "EIC referral" since it's fundamentally about journal scope. 

  Submission 2 (fringe field study) clearly passes - preregistered, tested, falsifiable. The board's dislike is irrelevant per the constraints. 

  Submission 3 (untestable experience) fails at the counterevidence question. The decline letter must stress this doesn't imply fraud, just mismatch with journal's scientific remit. 

  The compressibility trade-offs: 
  Losing the "counterevidence" question would be catastrophic - it's the core filter. The "observation" and "reasoning" steps could be merged, but the judgment about methodological substance (step 4) is unavoidably human. 

  What the procedure can't do: 
  It won't catch fraudulent data or methodological flaws - that's for peer review. Nor can it resolve philosophical debates about science's nature; it operationalizes a pragmatic, evidence-focused definition.
answer: |-
  Below is a demarcation screening procedure designed for efficiency (≤30 min/submission), non-specialist editors, and auditability. It isolates *scientific claim status* from *quality*, *plausibility*, or *field legitimacy*, with explicit off-ramps for editorial discretion.

  ---

  ### **Demarcation Screening Procedure**  
  *(Run sequentially; terminate at first definitive outcome)*

  1. **QUESTION:** *Does the manuscript explicitly state one or more claims about observable reality?*  
     - **SUFFICIENT ANSWER:** Yes (proceed to Q2).  
     - **NO:** Decline as non-scientific claim.  
     - **TERMINATES AT:** Decline.  
     - **JUSTIFICATION FOR LETTER:** *"The manuscript does not present empirically addressable claims about observable phenomena."*  

  2. **QUESTION:** *Could any conceivable observation (even idealized) contradict at least one claim?*  
     - **SUFFICIENT ANSWER:** Yes (proceed to Q3).  
     - **NO:** Decline as non-scientific claim.  
     - **OFF-RAMP:** If claims are inherently untestable (e.g., "no observation could ever contradict this"), decline.  
     - **JUSTIFICATION:** *"The claims are structured such that no empirical evidence could potentially challenge them."*  

  3. **QUESTION:** *Is the reasoning chain from evidence to claims dependent on non-adjustable premises?*  
     - **SUFFICIENT ANSWER:** Core premises are fixed (proceed to Q4).  
     - **NO/UNCLEAR:** Refer to EIC (procedural off-ramp).  
     - **KEY TEST:** If authors preemptively state they would alter core assumptions to *preserve* the claim against disconfirming data (e.g., "we’d modify the multiverse generator"), this fails.  
     - **JUSTIFICATION FOR EIC REFERRAL:** *"The claim’s testability hinges on mutable foundational assumptions requiring editorial policy judgment."*  

  4. **QUESTION:** *Does the methodology permit replication or independent verification?*  
     - **SUFFICIENT ANSWER:** Methods are described such that independent actors could reproduce tests (proceed to Q5).  
     - **NO:** Refer to EIC.  
     - **JUSTIFICATION:** *"Verifiability requires assessment of methodological accessibility beyond demarcation scope."*  

  5. **QUESTION:** *Is the claim structured to update based on evidence?*  
     - **SUFFICIENT ANSWER:** Authors acknowledge conditions under which they would revise/reject the claim (e.g., specific p-value thresholds, effect sizes).  
     - **YES:** Send for review.  
     - **NO/EVASIVE:** Decline.  
     - **JUSTIFICATION (Decline):** *"The claim is insulated from evidentiary updating, rendering it non-self-correcting."*  
     - **JUSTIFICATION (Review):** *"The claim meets minimum criteria for empirical testability and evidentiary responsiveness."*  

  ---

  ### **Procedure Outputs for Test Cases**  
  *(Board minutes excerpt format)*  

  **Submission 1:** *Multiverse Ensemble Cosmology*  
  - **Q1:** Pass (claims about universe-generation mechanism).  
  - **Q2:** Pass (statistical prediction falsifiable in principle).  
  - **Q3:** **FAIL** — Authors admit mechanism would be modified to preserve theory against disconfirming data.  
  - **OUTCOME:** **Refer to EIC**  
  - **JUSTIFICATION:** *"Testability contingent on mutable core premises (Q3). Editorial policy judgment required on whether adjustable assumptions constitute legitimate scientific hedging or unfalsifiability."*  

  **Submission 2:** *Preregistered Fringe-Field Study*  
  - **Q1:** Pass (claims about measurable effect).  
  - **Q2:** Pass (effect size thresholds falsifiable).  
  - **Q3:** Pass (preregistration fixes methodology/stats).  
  - **Q4:** Pass (multi-site replication feasible).  
  - **Q5:** Pass (preregistration defines decision rules).  
  - **OUTCOME:** **Send for review**  
  - **JUSTIFICATION:** *"All demarcation criteria satisfied: testable, fixed methodology, replicable, evidence-responsive. Board skepticism of field irrelevant to claim status (Q3–Q5)."*  

  **Submission 3:** *Untestable Conscious Experience Property*  
  - **Q1:** Pass (claims about properties of experience).  
  - **Q2:** **FAIL** — Author states no observation could contradict the claim.  
  - **OUTCOME:** **Decline as non-scientific claim**  
  - **JUSTIFICATION:** *"Claim explicitly insulated from empirical contradiction per Q2. Note: Not an assessment of validity or importance, but of scientific testability."*  
  - **LETTER LANGUAGE:** *"While your work addresses profound questions, the journal’s scope requires claims amenable to empirical interrogation. We encourage submission to philosophy of mind venues."*  

  ---

  ### **Critical Analysis**  
  1. **The Unpleasant Outcome:** Submission 1 (*cosmology*) is referred to the EIC. Q3 is the "unpleasant" step—it forces a policy decision about *adjustable assumptions*. This is intentional: such cases require asking, "Is this science or a protected belief?" The procedure flags it rather than hides it.  
     
  2. **Compression Trade-offs (1-page version):**  
     - **LOST:** Nuance in Q3 (mutable premises) and Q5 (evidence-updating). Compression risks misclassifying adjustable theories (e.g., string theory) or mistaking statistical inflexibility for rigor.  
     - **RETAINED:** Q2 (conceivable contradiction) is irreducible—the core of falsifiability.  

  3. **Judgments in Procedural Clothing:**  
     - Q3 requires interpreting "core" vs. "peripheral" assumptions (judgment).  
     - Q4’s "could independent actors replicate?" involves feasibility estimation (judgment).  

  4. **What the Procedure Cannot Decide:**  
     - Whether a field is legitimate (e.g., Submission 2’s "fringe" status).  
     - Whether a scientific claim is *correct* or *important*.  
     - Whether adjustable assumptions reflect healthy scientific flexibility (e.g., dark matter models) or unfalsifiability (e.g., psychoanalysis). *This is why Q3 off-ramps exist.*  

  ---

  ### **Implementation Notes**  
  - **Auditability:** Each Q/A is documented verbatim in board minutes.  
  - **Defensibility:** Focus on *author statements* (e.g., "they would modify the mechanism") avoids editors overinterpreting.  
  - **Boundary Preservation:** "Decline" letters never imply fraud; "fringe" submissions pass if methodologically sound (Submission 2).  
  - **Time Efficiency:** Editors answer Q1–Q5 in sequence (5–7 min/submission).  

  This procedure forces contested demarcations into explicit policy discussions (EIC referral) while filtering genuinely non-empirical claims. It protects against both type I errors (rejecting testable science) and type II errors (publishing unfalsifiable assertions).
