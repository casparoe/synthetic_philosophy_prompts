prompt: |-
  I'm a TA for a second-year phil of science course and I'm marking the midterm on Lakatos. I've got a stack to get through and I want a second opinion on one before I commit to a grade. The question I set was: Lakatos distinguishes a programme's hard core, protective belt, and positive and negative heuristics, and asks us to distinguish progressive from degenerating problem-shifts. Consider the made-up programme we called outcome-first in lecture: its hard core is the claim that fairness is a property of distributions of outcomes rather than of the procedures that produce them. Its protective belt includes assumptions about which groups are relevant, which disparity metric to use, and what the comparison class is. When critics produce cases where outcome-first gives counterintuitive verdicts, defenders respond by adding a new disparity metric or narrowing the comparison class; we called this move metric drift in class. They haven't used the programme to predict any new cases that weren't already on the table. (a) How would a Lakatosian decide whether outcome-first is progressive or degenerating? (b) Would a Lakatosian say a researcher is irrational to keep working on it? Explain.

  Here's what the student wrote: Lakatos's central move is that theories are never tested alone, but always with a protective belt of auxiliary assumptions. The hard core is the central claim that the programme's defenders decide not to abandon. It is made unfalsifiable by a methodological decision, not because it is logically irrefutable. A progressive programme predicts novel facts, some of which are corroborated; a degenerating one only accommodates facts it already knew about. In the outcome-first case, the hard core is that fairness is about outcomes. The positive heuristic tells the defenders which auxiliary assumptions to adjust, so when counterexamples come in they can change the belt rather than the core. The recent responses, adding metrics and narrowing comparison classes, look like belt adjustments. If they only accommodate old cases, the programme is degenerating. But that doesn't by itself mean it's unscientific: Lakatos is a sophisticated falsificationist, so a programme can be scientific even if it's degenerating. However, once a programme is degenerating, Lakatos says it is irrational to continue working on it, because a rational scientist should switch to a progressive rival. Also, the hard core is the part that is empirically irrefutable, which is why the programme is scientific in the first place. The positive heuristic is basically the set of auxiliary assumptions in the belt.

  Can you grade this out of 100 and give me the specific comments you'd write in the margin? I don't need a general impression; I need to know which sentences earn marks and which lose them, especially if there's a subtle confusion I might miss on a fast read. The course didn't require citations, so don't worry about those.
reasoning: |-
  Okay, the user is a TA grading midterms on Lakatos and wants a detailed evaluation of a specific student response. The question has two parts: (a) applying Lakatosian criteria to judge the fictional "outcome-first" program, and (b) addressing the rationality of continuing research on it. 

  Hmm, the student's answer shows strong foundational knowledge but has notable gaps. For part (a), they correctly identify that novel predictions are key to progressiveness and that outcome-first's "metric drift" resembles degenerating adjustments. Good. But they miss explicitly naming the negative heuristic - that's a deduction. The protective belt description is accurate though. 

  For part (b), the student nails the core rationality argument: degenerating programs make persistence irrational when progressive rivals exist. But they fumble by conflating "scientific" status with rationality. Lakatos explicitly separates these - a degenerating program remains scientific but pursuing it becomes irrational. That's a crucial nuance worth pointing out. 

  The "empirically irrefutable hard core = scientific" claim is another hiccup. Lakatos thinks programs are scientific based on their heuristic structure, not irrefutability alone. And calling the positive heuristic "the set of auxiliary assumptions" is flat wrong - it's the strategy for generating them. 

  Marginally, the student deserves credit for recognizing that degenerating programs aren't inherently unscientific and for correctly describing belt adjustments. But the errors in part (b) and conceptual blurring cost points. 

  *checking rubric* 
  - Part (a): 18/25 (missing negative heuristic -3, conflating prediction of novel facts with accommodation -4) 
  - Part (b): 12/20 (correct rationality point +8, but scientific vs rational confusion -5, hard core misconception -3) 
  - Overall coherence: +5 for flow 
  Total 70/100 feels fair - competent but needs precision on Lakatos' distinctions. The marginal comments should target the scientific/rational split specifically since that's a common tripping point.
answer: |-
  Here's a granular breakdown of the student's answer with a suggested grade and specific marginal comments:

  **Overall Grade: 70/100**

  **Breakdown & Marginal Comments:**

  **Part (a): How would a Lakatosian decide? (25 points possible)**

  1.  **"Lakatos's central move is that theories are never tested alone, but always with a protective belt of auxiliary assumptions."** - **✓ (Good start, key point)**
  2.  **"The hard core is the central claim... defenders decide not to abandon. It is made unfalsifiable by a methodological decision..."** - **✓ (Accurate definition of hard core)**
  3.  **"A progressive programme predicts novel facts, some of which are corroborated; a degenerating one only accommodates facts it already knew about."** - **✓✓ (Crucially correct distinction for Lakatos)**
  4.  **"In the outcome-first case, the hard core is that fairness is about outcomes."** - **✓ (Correctly identifies hard core in context)**
  5.  **"The positive heuristic tells the defenders which auxiliary assumptions to adjust..."** - **✓ (Good definition of positive heuristic)**
  6.  **"...so when counterexamples come in they can change the belt rather than the core."** - **✓ (Correct function of protective belt adjustment)**
  7.  **"The recent responses, adding metrics and narrowing comparison classes, look like belt adjustments."** - **✓ (Correctly identifies described actions as belt adjustments)**
  8.  **"If they only accommodate old cases, the programme is degenerating."** - **✓✓ (Perfect application of Lakatosian criterion to this case)**
      *   **Missing Element:** The student fails to explicitly mention the **negative heuristic** ("Don't touch the hard core!"). While implied by the belt/core distinction, explicitly naming it would strengthen the answer. **(-3 points)**
      *   **Subtle Confusion:** The statement "predicts novel facts" is correct, but the student doesn't explicitly contrast this with merely *explaining/retrodicting* the cases that prompted the adjustment (which is what "accommodating" means here). They get the answer right ("only accommodate old cases = degenerating"), but the explanation could be slightly sharper on this point. **(-2 points)**

  **Part (a) Subtotal: 20/25**

  **Part (b): Irrational to keep working? Explain. (20 points possible)**

  1.  **"But that doesn't by itself mean it's unscientific: Lakatos is a sophisticated falsificationist, so a programme can be scientific even if it's degenerating."** - **✓✓✓ (Excellent, crucial point! Distinguishes scientific status from rationality/progress)**
  2.  **"However, once a programme is degenerating, Lakatos says it is irrational to continue working on it..."** - **✓ (Correct core claim about rationality)**
  3.  **"...because a rational scientist should switch to a progressive rival."** - **✓ (Correct explanation/justification for irrationality claim)**
      *   **Major Error: Conflation of Scientific Status & Rationality:** The student states the hard core is "empirically irrefutable, which is why the programme is scientific in the first place." This is **incorrect** and confuses the key point they just got right. For Lakatos, a program is *scientific* primarily based on having a coherent positive and negative heuristic that *could* generate progressive problem shifts in the future (its heuristic power), NOT simply because its hard core is unfalsifiable/methodologically protected. Many unscientific theories also have unfalsifiable cores. This misconception undermines the excellent distinction they made just before. **(-5 points)**
      *   **Inaccuracy:** The final sentence, "The positive heuristic is basically the set of auxiliary assumptions in the belt," is **wrong**. The positive heuristic is the *set of guidelines or strategies* for *generating/modifying* the protective belt (the auxiliary assumptions). The belt *contains* the assumptions; the positive heuristic tells you *how* to build/change it. **(-3 points)**

  **Part (b) Subtotal: 12/20**

  **Overall Structure & Clarity (5 points possible):**
  *   The answer is well-structured, flows logically, and directly addresses both parts of the question. **✓✓✓✓✓ (5/5)**

  **TOTAL SCORE: (20 + 12 + 5) = 37/50 = 74/100?** *Wait, let's recalculate based on standard weighting:*
