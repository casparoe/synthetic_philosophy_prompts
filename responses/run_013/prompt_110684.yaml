answer: |-
  Here is the ranking of the "lessons of history" by practical weight for advising a crisis-era PM, from most to least, with justifications adhering to your test:

  1.  **Lesson 7: A maxim drawn from one vivid case should be discounted by the number of equally vivid cases one might have drawn on instead.**
      *   **Justification:** This earns high weight because the *feature* is the inherent *selectivity and potential bias in historical analogy*. It directly addresses the core weakness of maxims like the others. The *reason it's present now* is that crises naturally evoke emotionally resonant historical parallels (like Munich, Sarajevo, Cuban Missiles), tempting simplification. Applying this lesson forces critical evaluation of *all* entries on the list, demanding consideration of counter-examples (e.g., concessions *sometimes* work, powers *can* rise peacefully). It acts as a vital meta-check.

  2.  **Lesson 6: In a crisis, the adversary's domestic constraints matter more than its declared aims.**
      *   **Justification:** This earns significant weight. The *feature* is the *primacy of internal political pressures (public opinion, factional struggles, leader survival) over stated diplomatic goals* in shaping an adversary's crisis behaviour. This is *present now* because all states have domestic audiences and power structures that constrain leadership (e.g., parliamentary factions, economic elites, public unrest). Understanding these constraints (e.g., is the adversary leader weak and needing a win, or strong but needing to placate hawks?) provides crucial insight into their true flexibility and red lines, often more than their official rhetoric.

  3.  **Lesson 1: Concessions to a power that has taken territory by force buy time and nothing else; the next demand always comes.**
      *   **Justification:** This earns moderate weight, but *only conditionally*. The *feature* is the *aggressor's demonstrated expansionist intent and pattern of escalation*. This applies *now* specifically if the current adversary has shown a *consistent pattern* of using seized territory as a springboard for further demands after concessions (e.g., a clear sequence of land-grabs preceded by ultimatums). The reason for weight is the risk of emboldenment. **However, it fails the test if no such pattern exists.** For it to pass, the current aggressor must exhibit behaviour directly analogous to historical revisionist/expansionist states like Nazi Germany or Putin's Russia in its early phases.

  4.  **Lesson 2: When a rising power's interests collide with an established one's, war follows regardless of either side's intentions.**
      *   **Justification:** This earns moderate weight but is highly contextual. The *feature* is the *structural tension of power transition*, where the rising state seeks greater influence/resources/status that the established state is unwilling to cede peacefully. This *might be present now* if the crisis involves a fundamental challenge to the existing regional/global order by a rapidly ascending state (e.g., a challenge to alliance structures, control of vital trade routes). The reason for weight is the potential for miscalculation and security dilemmas inherent in such shifts. **It fails the test if the conflict is over a peripheral interest or if mechanisms for peaceful adjustment (diplomacy, institutions) are strong and credible.** For it to pass, the clash must be over core, seemingly non-negotiable interests vital to both powers' security or status.

  5.  **Lesson 3: A war begun with limited aims ends with unlimited commitments.**
      *   **Justification:** This earns moderate weight as a strong caution. The *feature* is the *"escalation trap"* – unforeseen consequences, enemy reactions, domestic pressure, mission creep, and the fog of war. This is *always potentially present now* in any military engagement because war is inherently unpredictable and political dynamics shift. The reason for weight is the near-universal historical tendency for conflicts to expand beyond initial goals (e.g., Vietnam, Iraq). However, its weight is slightly less than above as exceptional cases exist (e.g., Falklands, relatively limited Gulf War 1991), showing it's a powerful tendency, not an absolute law.

  6.  **Lesson 5: A general staff's estimate of the costs of a war it wants is not evidence about those costs.**
      *   **Justification:** This earns low weight as a specific maxim, though the underlying caution is valid. The *feature* is the *institutional bias and optimism of militaries advocating for action*. This is *often present now* due to organisational culture, desire for relevance, and "can-do" attitudes. The reason for *some* weight is the historical record of underestimating costs (e.g., pre-WWI enthusiasm). **However, it fails the test as stated** because it dismisses *all* military estimates as non-evidence, which is overly simplistic. Modern staffs often produce rigorous, cautious analyses. For it to pass *fully*, one would need specific evidence that *this particular* general staff is deeply biased, politically captured, or ignoring dissenting views within its own ranks. Its core value is as a reminder to scrutinise assumptions and sources rigorously.

  7.  **Lesson 4: A state that goes to war the way it went to war last time will lose the next one.**
      *   **Justification:** This earns the least weight. The *feature* is *military and strategic obsolescence* – failing to adapt doctrine, technology, or tactics to new contexts or adversaries. This *might be present now* if the adversary has demonstrably adapted (e.g., new tech, asymmetric tactics) while the advising state relies rigidly on past successful methods. The reason for *minimal* weight is that core principles *can* endure, and not every war is radically different. **It fails the test unless there is clear evidence of specific, exploitable obsolescence in the advising state's current plans compared to the adversary's capabilities.** For it to pass, one must identify concrete ways the planned approach is outdated *for this specific conflict* against *this specific enemy*.

  **Entry to Remove Altogether:**
  *   **Lesson 4: A state that goes to war the way it went to war last time will lose the next one.** While caution against complacency is valid, this maxim is too vague, deterministic, and context-dependent to be reliably useful. It risks being either trivial ("adapt!") or dangerously misleading if applied simplistically. The core insight (avoid obsolescence) is better addressed through specific intelligence and analysis of the current adversary, not this sweeping historical rule. Its failure rate under the stipulated test is high.

  **Conflicting Entries:**
  *   **Lesson 1 (Concessions buy only time) pulls directly against Lesson 6 (Focus on adversary's domestic constraints).**
      *   **Conflict:** Lesson 1 assumes concessions to an aggressor are always futile and emboldening, demanding firmness. Lesson 6 suggests understanding the adversary's internal pressures might reveal opportunities where a *calculated concession* could help factions advocating de-escalation gain traction, split the adversary's coalition, or provide a face-saving off-ramp that genuinely resolves the crisis. Applying Lesson 1 rigidly could prevent exploiting potential openings revealed by Lesson 6's analysis. The adviser must weigh the risk of appeasement (L1) against the potential benefit of leveraging internal divisions (L6).
