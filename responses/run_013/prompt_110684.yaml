prompt: |-
  A character in the novel I am writing — a middle-ranking foreign-office adviser who briefs a prime minister in the middle of a crisis — keeps a private list she calls 'the lessons of history' and consults it before she speaks. Rank the entries below by how much weight she should in fact give them when deciding what to advise, most to least, with a sentence of justification for each placing. Apply this test throughout: an entry earns weight only if you can name the feature of the past case that is supposed to be doing the work, and give a reason for thinking that feature is present again now; where an entry fails the test, say what would have to be true for it to pass. Then say which single entry should come off the list altogether, and whether any two entries pull against each other in her situation.

  1. Concessions to a power that has taken territory by force buy time and nothing else; the next demand always comes.
  2. When a rising power's interests collide with an established one's, war follows regardless of either side's intentions.
  3. A war begun with limited aims ends with unlimited commitments.
  4. A state that goes to war the way it went to war last time will lose the next one.
  5. A general staff's estimate of the costs of a war it wants is not evidence about those costs.
  6. In a crisis, the adversary's domestic constraints matter more than its declared aims.
  7. A maxim drawn from one vivid case should be discounted by the number of equally vivid cases one might have drawn on instead.

  Answer in British English.
