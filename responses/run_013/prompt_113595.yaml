  Okay, the user is a doctoral candidate in philosophy focusing on the ethics of promising, specifically examining the common law of contract. They've noticed a pattern where the doctrine of consideration seems to conflict with other aspects like expectation damages and promissory estoppel. Their main concern is reconstructing the implicit theory of promising that underpins these doctrines and evaluating its consistency.

  First, I need to break down each doctrine's implications. Consideration requires a bargained-for exchange, which suggests that the law doesn't see a bare promise as binding. But expectation damages focus on the promise itself by compensating for non-performance, which seems to treat the promise as the source of obligation. Then promissory estoppel enforces promises without consideration if there's detrimental reliance. Plus, the objective theory of contracts ignores subjective intent. These elements seem to pull in different directions philosophically.

  The user wants to know what theory of promising the law presupposes. They’re asking which accounts (will-based, reliance-based, etc.) are ruled out or compatible. They also want to know if consideration serves an evidentiary purpose rather than denying the binding nature of bare promises. And they’re concerned about internal consistency—does expectation damages contradict consideration by assuming a will-based view?

  I should start by identifying the implicit theory. The law seems to ground obligation in reciprocal exchange and social practice rather than individual will. Consideration acts as a formality, signaling seriousness and enabling enforcement. This aligns with a practice-based or reliance theory but rejects pure will-based views. However, expectation damages might suggest a will-based element, but I need to reconcile that. Maybe the law sees the exchange as creating an entitlement to performance, making expectation damages about the benefit of the bargain, not the promise per se.

  Promissory estoppel introduces reliance as an alternative basis, which fits a reliance theory but complicates the picture. The objective theory further distances from subjective intent, emphasizing observable actions over internal states.

  The user might also be interested in whether replacing the current system with a will-based theory would work. Abolishing consideration would enforce bare promises, but that could lead to increased litigation and fraud risks. The law might lose its focus on market transactions and reciprocity, shifting toward personal morality enforcement. However, promissory estoppel already covers reliance, so expanding enforcement might not disrupt that part.

  I need to address underdetermination—where multiple theories could justify the doctrines. For example, reliance theorists could see consideration as evidence of reliance, while practice-based theorists view it as a constitutive rule. Expectation damages might be justified by either the benefit of the bargain or the promise itself.

  Internally, the system might be consistent if we see consideration as defining binding promises, with expectation damages as the remedy once bound. Promissory estoppel acts as an exception for non-bargained reliance. The objective theory supports this by focusing on manifestations.

  The user's deeper need might be to critique the law's philosophical coherence for their thesis. They might want to argue that the law inadvertently combines inconsistent theories or that consideration's evidentiary role could save it from contradiction. They might also explore what moral commitments the law makes implicitly and how changing doctrines would affect legal practice and moral messaging.
answer: |-
  Here's a reconstruction of the implicit theory of promising embedded in common law contract doctrine, analyzing its commitments, tensions, and philosophical underdetermination:

  **The Core Implicit Theory: Promises Bind as Socially Sanctioned Inducements to Reciprocal Exchange**

  1.  **Ground of Obligation: Exchange & Social Utility, Not Will or Bare Word:**
      *   **Consideration Requirement:** This is the cornerstone. The law explicitly rejects the idea that a *mere expression of intention or commitment* (the will) creates a legal obligation. Obligation arises from the *structure of the transaction*: a bargained-for exchange. The law commits to the view that promises bind *because* and *only when* they are part of a reciprocal economic or beneficial transaction. This rules out:
          *   **Pure Will Theory:** The idea that promises bind solely because the promisor intentionally undertook an obligation. The law says "no exchange, no obligation" regardless of the promisor's serious intent.
          *   **Bare Convention/Practice Theory:** While the law *is* a convention, it deliberately carves out only a *subset* of the social practice of promising (the exchange subset) for legal enforcement. It refuses to enforce the practice *as a whole*.
      *   **Objective Theory ("Outward Manifestations"):** Reinforces the rejection of the will. Binding intent is not found in subjective mental states but in objective acts signaling participation in the exchange system. The *appearance* of a bargain, not the genuine internal commitment, is key for formation.

  2.  **Nature of the Entitlement: The Benefit of the Bargain, Not Performance Per Se:**
      *   **Expectation Damages:** This *seems* to contradict consideration by focusing on the promise. However, within the implicit theory, it's consistent. Once a *bargained-for exchange* exists, the promisee is entitled to the *value* of the promised performance *as part of that exchange*. The entitlement stems not from the promise *as a moral act*, but from the promisee having *given something up* (consideration) to secure that future benefit. The law protects the "expectation interest" *because* it's the value the promisee *paid for* in the exchange. It remedies the *loss of the bargained-for position*, not the violation of a solemn word.

  3.  **The Exception: Reliance as an Alternative Ground (But Still Not Will):**
      *   **Promissory Estoppel:** This doctrine acknowledges that *detrimental reliance* can create an obligation *even without consideration*. Crucially, it does *not* ground the obligation in the promise itself or the will. It grounds it in the *harm caused* by the reliance induced by the promise. The obligation arises to *prevent injustice* stemming from the reliance, not to enforce the promise *as a promise*. It's a cousin to tort (estopping the promisor from harming the promisee), not a vindication of the will theory. It sits comfortably with a **Reliance Theory** of obligation, which consideration otherwise largely sidelines.

  **Addressing Evidentiary/Cautionary Functions:**

  *   **Could Consideration Be Merely Evidentiary?** Yes, partially. It provides objective evidence of seriousness, deliberation, and the existence of a deal. It reduces fraud and perjury risks ("he said/she said" over gratuitous promises).
  *   **Does This "Rescue" the Law? Only Partially:**
      *   **Not Solely Evidentiary:** If it were purely evidentiary, the law would allow proof of a *serious, deliberate bare promise* by other means. It explicitly does *not*. Courts won't enforce a proven, deliberate, gratuitous promise, even with clear evidence. The requirement is substantive, not just procedural.
      *   **Cautionary Function:** It forces parties to structure agreements formally (via exchange), promoting deliberation and reducing impulsive promises. This is a valid function but *complements* the substantive view that exchanges are the proper domain of legal obligation. It doesn't replace it.
      *   **Conclusion:** Evidentiary and cautionary functions are important *secondary* justifications, but the primary commitment remains the substantive view that *only reciprocal exchanges merit legal enforcement*. The law isn't just *screening* bare promises; it's *denying they create legal obligations at all*.

  **Internal Consistency:**

  *   **Is the System Consistent? Largely Yes, but with Tension:**
      *   **Core Logic:** Consideration defines the *category* of promises the law recognizes as creating obligations. Expectation damages define the *standard remedy* for breaches *within* that recognized category (protecting the exchange value). Promissory estoppel creates a *separate, exceptional category* based on detrimental reliance, preventing injustice *outside* the core exchange paradigm. The objective theory reinforces the focus on observable transactions over internal states.
      *   **The Tension:** The main tension lies between the **formality/restrictiveness of consideration** and the **flexibility/moral thrust of promissory estoppel**. Consideration rigidly requires exchange; estoppel flexibly enforces based on reliance-caused harm. However, estoppel is explicitly an exception, often resulting in reliance (not expectation) damages, maintaining the core distinction. The deeper tension is philosophical: the core system *rejects* will/reliance as the *primary* ground, while estoppel *embraces* reliance as an *exceptional* ground.

  **Philosophical Underdetermination:**

  *   **Practice-Based Theories:** The system *could* be justified by a practice-based theory emphasizing the social utility of enforcing market transactions (exchange) and preventing specific harms (reliance), while excluding gratuitous promises as private morality. This fits well.
  *   **Reliance Theories (Modified):** A reliance theorist could argue consideration is a *proxy* for likely and serious reliance inherent in exchanges, with estoppel covering other cases of actual, detrimental reliance. This requires stretching, as consideration enforces even without *proven* reliance (via expectation damages), but it's possible.
  *   **Efficiency Theories:** Economic analysis (enforcing only bargains to promote efficient allocation and investment, with estoppel as a safety net) readily explains the doctrines without needing "binding force" at all.
  *   **What's Ruled Out:** Pure will theory is decisively ruled out. A simple convention theory enforcing *all* social promises is also ruled out. A theory where bare promises *inherently* create obligations enforceable at law is incompatible.

  **Replacing with a Will-Based Theory: Consequences**

  1.  **Doctrinal Changes:**
      *   **Abolish Consideration:** Any seriously made, deliberate promise (objectively manifested) would be presumptively enforceable.
      *   **Revise Formation:** Subjective intent *might* become more relevant, though an objective manifestation standard would likely persist for practicality. The focus shifts from "was there a bargain?" to "was there a genuine, deliberate commitment?"
      *   **Promissory Estoppel:** Might become largely redundant or merge into the general law of promise enforcement, focusing on damages (reliance vs. expectation) based on the type of promise/reliance.
      *   **Expectation Damages:** Could remain the standard remedy, now justified directly as enforcing the promised performance as a right created by the will-act.

  2.  **What Would Be Lost:**
      *   **Evidentiary/Cautionary Safeguards:** The clear, objective filter of exchange would be lost. Proving the existence and seriousness of bare promises is inherently harder, increasing litigation risk and fraud potential.
      *   **Focus on Market Transactions:** The law would shift from primarily facilitating and regulating economic exchange to enforcing a much broader range of personal commitments (birthday gifts, social favors). This could overwhelm courts and blur the line between law and morality.
      *   **Reciprocity Principle:** The strong link between obligation and receiving a benefit (consideration) would be severed. The law would enforce altruism and gift promises equally with bargains.
      *   **Predictability/Commercial Certainty:** The bright-line rule of consideration provides significant commercial certainty. A will-based system would be more fact-specific and potentially less predictable.

  3.  **Changed Moral Picture:**
      *   **Commitment:** The law would endorse the view that *all* serious expressions of commitment inherently create obligations worthy of state enforcement. This elevates individual autonomy and fidelity to one's word as paramount legal values.
      *   **Reciprocity:** It would downplay the moral significance of reciprocity as a necessary condition for legal obligation. Gratuitous promises become legally equivalent to bargains.
      *   **Scope of Law:** The law would take a much more expansive view of its role in regulating interpersonal morality and trust, moving beyond its traditional focus on economic relationships facilitated by exchange.

  **Conclusion:**

  The common law of contract implicitly rejects the will theory of promising. Its core presupposition is that legal obligation arises from **reciprocal exchange** (consideration), creating an entitlement to the **value of the bargained-for position** (expectation damages). **Detrimental reliance** (promissory estoppel) is recognized as a separate, exceptional ground for obligation to prevent injustice, not to enforce promises *as such*. The objective theory reinforces this transactional focus. While evidentiary and cautionary functions play a role, consideration is fundamentally substantive, ruling out pure will-based and simple convention-based theories. The system is largely internally consistent, defining its domain (exchange), its standard remedy (expectation), and its exception (detrimental reliance). It is philosophically compatible with practice-based, modified reliance, or efficiency theories. Adopting a will-based theory would fundamentally alter the law's domain, abolishing consideration, diminishing the role of reciprocity, expanding enforcement into personal morality, and sacrificing some practical safeguards, while elevating individual commitment and fidelity as the core legal values underpinning enforceable promises.
