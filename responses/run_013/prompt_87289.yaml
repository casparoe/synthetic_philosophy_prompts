prompt: |-
  Ok so I'm in this debate club and we're doing a unit on famines and I keep getting into arguments about whether a famine is more like a natural disaster or more like a crime. The analogy that keeps coming up — my teacher used it, and like three kids in the club — is that a famine is basically a hurricane or an earthquake: a blight hits Ireland, a drought hits Bengal, the harvest fails, people starve. Nobody chooses an earthquake. So the whole thing gets used to say we shouldn't go hunting for villains when a famine happens, that aid is charity rather than justice, and that really poor places just have bad luck (or too many people). Amartya Sen obviously gets dragged in on the other side — the thing everyone half-remembers is that he said famines don't really happen in democracies with a free press, and that the Bengal famine of 1943 wasn't mainly about there not being enough food around. Then someone brings up the Great Leap Forward and the Irish famine and it all gets muddled and nobody can agree.

  I want you to act like a historian/economist who actually works on famine and do a proper audit of the "famine is a natural disaster" analogy. Start with a short brainstorming paragraph, just get your thoughts down, then lay out the mapping explicitly in a table — what plays the role of the trigger event, what plays the role of "the disaster" itself, what plays the role of the victims, of luck, of the response — and then show where the mapping breaks. I'm especially interested in the subtle stuff: the difference between what triggers a famine and what sets how big it gets, whether the Irish blight and the Bengal wartime inflation and the Great Leap Forward grain quotas are even the same kind of thing, and the worry that calling it "natural" makes the death toll look like the event itself instead of an outcome of who got what. Also tell me which of the breakdowns actually matter for the conclusion people are using the analogy to support (nobody's to blame / it's just bad luck / relief is charity) and which are just nitpicks, and then whether that conclusion survives once the disanalogies are on the table. If there's a better analogy, tell me what it is.

  Please structure it like this: "Brainstorm" (a short messy paragraph, just dump your thinking), "The mapping" (table), "Where it breaks" (like 200-300 words), "Which breaks matter" (short), "Does the conclusion survive?" (your verdict, a paragraph), and "A better analogy" (a few sentences). Think carefully and please don't just give me the textbook Sen line, I want the actual joints, and I'd rather you be wrong in an interesting way than safe and boring.
