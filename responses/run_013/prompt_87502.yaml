prompt: |-
  I'm in a philosophy of biology reading group and we meet in a pub with terrible wifi, so I can't just look things up when an argument gets stuck. We keep going in circles on the etiological vs. the causal-role account of function -- the etiological one says a trait's function is whatever it was selected for, the causal-role one says a trait's function is whatever contribution it currently makes to some capacity of the organism. I want to see the disagreement built cleanly instead of the usual wing and appendix handwaving, so please construct a thought experiment to spec. The target is a case where the etiological account says the focal trait is malfunctioning (it isn't doing what it was selected for) while the causal-role account says the very same trait is functioning fine (it's making a real, current contribution to the organism's life). Constraints: biologically possible organism, no intelligent designer, no supernatural stuff, no group selection unless you explain why it's needed, and the causal-role contribution has to be something the organism actually relies on, not just a possible use or a side effect that does nothing. Also include a control organism that is the same in current anatomy and physiology but differs in selection history: in the control, the trait was selected for the very effect it currently contributes, so both accounts call it functional. The scenario itself should be no more than a paragraph; the rest can be analysis.

  Then do the check. For the focal organism, state the trait, its selection history, its current effect, what each account says the function is, and what each says about malfunction. Do the same for the control. Tell me which single feature of the case is doing the work, and what happens if you remove it -- if the history is reversed, if the current effect is also selected for, if the trait becomes vestigial, etc. Finally, say how a defender of the etiological account would try to redescribe the focal case so that it isn't a malfunction, and how a defender of the causal-role account would try to redescribe it so that it isn't a function; I want to know which move is more ad hoc. No citations or reading lists, I just want the case and the reasoning.
reasoning: |-
  We are constructing a thought experiment with two organisms: the focal organism (where etiological and causal-role accounts disagree) and a control organism (where both agree). The focal organism must have a trait that is malfunctioning according to the etiological account (because it isn't doing what it was selected for) but is functioning according to the causal-role account (because it is making a current, relied-upon contribution). The control organism must be identical in current anatomy and physiology but have a selection history such that the trait was selected for the effect it currently has, so both accounts agree it is functional.

  Key constraints:
  - Biologically possible, no intelligent designer, no supernatural.
  - The current contribution must be something the organism actually relies on.
  - No group selection unless necessary (we'll avoid it).

  Thought Experiment:

  In a species of burrowing rodents, there is a trait: a specialized valve in the circulatory system that helps regulate blood flow during intense digging. In the focal population (Species A), this valve originally evolved for thermoregulation (diverting blood to the skin to dissipate heat during high activity) but due to a recent environmental shift (e.g., moving to a cooler climate), it now primarily aids in maintaining blood pressure during prolonged digging by preventing blood from pooling in the extremities. The current effect (preventing blood pooling during digging) is critical for their burrowing lifestyle. However, the trait was not selected for this; it was selected for thermoregulation. In a control population (Species B), the same valve evolved and was selected for precisely the blood pressure regulation during digging, and it currently performs that role.

  Now, the focal organism (Species A):
  - Trait: circulatory valve.
  - Selection history: selected for thermoregulation (diverting blood to skin to cool the body).
  - Current effect: prevents blood pooling during digging, which is essential for their current burrowing activity (without it, they would faint during long digging sessions).
  - Etiological account: The function is thermoregulation. Since the valve is no longer doing that effectively (because the climate is cool and they don't need as much cooling, and in fact, the valve is now acting to prevent blood pooling), it is malfunctioning with respect to its selected function. (Note: It might be doing something else, but that's not its function.)
  - Causal-role account: The function is preventing blood pooling during digging because that is the current contribution to the organism's capacity (burrowing) and the organism relies on it.

  Control organism (Species B):
  - Trait: same circulatory valve.
  - Selection history: selected for preventing blood pooling during digging (blood pressure regulation).
  - Current effect: same as above, prevents blood pooling during digging.
  - Both accounts: The function is preventing blood pooling (etiological because it was selected for that, causal-role because it does that and is relied upon). No malfunction.

  The single feature doing the work: the difference in selection history. In the focal organism, the trait was selected for one effect (thermoregulation) but now contributes to a different, currently critical effect (blood pressure regulation). In the control, the selection history matches the current effect.

  What if we remove or change features?
  - If the history is reversed (i.e., the focal organism had been selected for blood pressure regulation but now is used for thermoregulation) then the disagreement would flip: etiological would say the function is blood pressure regulation and if it's not doing that, it's malfunctioning, while causal-role would say the function is thermoregulation if that's the current contribution.
  - If the current effect is also selected for (as in the control), then both accounts agree.
  - If the trait becomes vestigial (i.e., it no longer does anything that the organism relies on), then the etiological account might still assign a function (the one it was selected for) and say it's malfunctioning because it's not doing that, while the causal-role account would say it has no function (since it's not making a contribution to any current capacity). But in our case, the trait is making a current contribution.

  Redescriptions by defenders:

  1. Etiological defender trying to avoid calling the trait in the focal organism a malfunction:
     - They might argue that the trait was selected for thermoregulation, but in the current environment, the thermoregulatory function is not needed. However, they might also argue that the trait is still performing a function that is beneficial and that the trait has been co-opted for a new function (exaptation). But note: the etiological account strictly assigns function based on what the trait was selected for, not what it is currently doing. So, the etiological account would still say the function is thermoregulation and that the trait is malfunctioning with respect to that function (because it's not doing thermoregulation effectively, or at all, in the cool climate). However, they might try to redescribe the current effect as part of the thermoregulatory function? But that would be ad hoc because the current effect (preventing blood pooling) is not thermoregulation. Alternatively, they might say that the trait is not malfunctioning because it is still performing the function it was selected for, but that's not the case. A better move: they might argue that the trait has been selected again for the new effect? But in our scenario, there hasn't been time for selection to act on the new effect. So, without a new selection history, the etiological account must stick to the original function. This move seems ad hoc if they try to assign the new function without a new selection history.

  2. Causal-role defender trying to avoid calling the trait in the focal organism functional:
     - They might argue that the current effect (preventing blood pooling) is not a function because it is not a contribution to a system that is important? But in our case, it is critical for burrowing. Alternatively, they might say that the trait is not really making that contribution? But by stipulation, it is. They might try to argue that the effect is a side effect? But again, by stipulation, the organism relies on it. This move seems difficult without being ad hoc.

  Which move is more ad hoc?
  - The etiological defender's move to avoid calling it a malfunction might be to say that the trait has a new function (exaptation) but without a new selection history, that's not allowed by the etiological account. So, if they insist that the function is still the original one but that the trait is not malfunctioning because the original function is not needed, then that seems to violate the etiological account (which doesn't condition function on current needs). Alternatively, they might say that the trait is now under selection for the new effect, but that would require a change in the scenario (which we haven't allowed). Without that, the etiological account must say it's malfunctioning. Any redescription that denies the original selection history or asserts a new one without evidence is ad hoc.

  - The causal-role defender doesn't have a strong reason to deny the function because the trait is making a current contribution. They might try to argue that the contribution isn't to a capacity that is properly part of the organism's functioning? But that seems vague and ad hoc.

  Therefore, the etiological defender's move to avoid the malfunction verdict is more ad hoc because it requires either denying the original selection history (which is given) or asserting a new one without evidence. The causal-role account doesn't have to do any such thing; the current contribution is clear.

  But note: in the focal organism, the trait is not doing what it was selected for (thermoregulation) and is doing something else (blood pressure regulation). The etiological account must say that the trait is malfunctioning with respect to its original function. However, one might argue that the trait is not malfunctioning because it is doing something beneficial? But the etiological account doesn't care about current benefits for function assignment.

  In summary:

  Focal organism (Species A):
  - Trait: circulatory valve.
  - Selection history: selected for thermoregulation.
  - Current effect: prevents blood pooling (critical for burrowing).
  - Etiological: function = thermoregulation; malfunctioning because it isn't doing that effectively (and is doing something else).
  - Causal-role: function = preventing blood pooling; not malfunctioning (it is doing that).

  Control organism (Species B):
  - Trait: same valve.
  - Selection history: selected for preventing blood pooling.
  - Current effect: prevents blood pooling.
  - Etiological: function = preventing blood pooling; not malfunctioning.
  - Causal-role: function = preventing blood pooling; not malfunctioning.

  The key is the mismatch between selection history and current contribution in the focal case.

  Analysis of ad hoc moves:
  - Etiological defender might say: "The trait has been co-opted and is now under selection for the new effect, so the function has changed." But in our scenario, we haven't allowed for new selection (it's a recent environmental change, so no time for selection). Thus, this move is ad hoc without evidence of new selection.
  - Causal-role defender might say: "The current effect is not a proper function because it is not the result of design or selection, but just a lucky accident." But the causal-role account doesn't require selection history, so this move is also ad hoc (it introduces a requirement that the account typically doesn't have).

  However, the causal-role move seems more ad hoc because it imports an etiological requirement that the account explicitly rejects. The etiological move is at least consistent with the idea that functions can change with new selection, but without that new selection, it's an unsupported assertion. Therefore, the etiological defender's move is more ad hoc because it adds an unsupported element (new selection) to avoid the counterexample.

  But note: the etiological account can allow for multiple functions if there are multiple periods of selection. However, in the focal case, we have only one period of selection (for thermoregulation) and then a change in environment without new selection. So, without new selection, the etiological function remains the original one.

  Final thought: The case is designed to show that the etiological account can call a trait that is currently contributing critically to the organism's survival a malfunction, while the causal-role account calls it functional. This highlights the difference in the accounts.
answer: |-
  ### Thought Experiment
  In a species of desert rodents, a specialized gland evolved for evaporative cooling (selected during a hot, arid period). Due to climate shift, the species now inhabits a cool, humid region. The gland no longer produces sufficient moisture for cooling but secretes a saline solution that is ingested during grooming, maintaining electrolyte balance critical for neural function. A control species, anatomically identical, evolved in a salt-poor environment where the gland was selected specifically for electrolyte regulation and currently performs this role.

  ### Analysis
  **Focal Organism (Desert Rodent in Cool Region):**  
  - **Trait:** Saline gland.  
  - **Selection History:** Selected for evaporative cooling.  
  - **Current Effect:** Secretes saline solution ingested during grooming, maintaining electrolyte balance (prevents neural dysfunction; organism relies on this).  
  - **Etiological Account:** Function = evaporative cooling. Malfunctioning because it fails to cool effectively (current secretion is too scant for cooling).  
  - **Causal-Role Account:** Function = electrolyte regulation. Not malfunctioning; it sustains a vital current capacity (neural function).  

  **Control Organism (Identical Anatomy, Different History):**  
  - **Trait:** Saline gland.  
  - **Selection History:** Selected for electrolyte regulation.  
  - **Current Effect:** Secretes saline solution for electrolyte balance (same as focal).  
  - **Etiological Account:** Function = electrolyte regulation; not malfunctioning.  
  - **Causal-Role Account:** Function = electrolyte regulation; not malfunctioning.  

  ### Key Feature Doing the Work
  The **mismatch between selection history and current contribution** creates the disagreement. The focal trait’s *original selected effect* (cooling) is obsolete, but its *current effect* (electrolyte regulation) is novel and relied upon.  

  ### What If? Scenarios  
  - **History reversed (focal selected for electrolyte regulation, now used for cooling):** Etiological calls it functional (history matches current effect); causal-role calls it malfunctioning if cooling is ineffective.  
  - **Current effect also selected for (both accounts agree):** As in control, no disagreement.  
  - **Trait vestigial (no current contribution):** Etiological says malfunctioning (not doing selected job); causal-role says no function (no current role).  

  ### Defenders' Redescriptions  
  - **Etiological defender** might argue: "The gland *was* co-opted by selection for electrolyte regulation, so that’s its new function." This is **ad hoc** without evidence of new selection (we stipulated no recent selection; climate shift was sudden). It ignores the trait’s history.  
  - **Causal-role defender** might argue: "Electrolyte regulation is a side effect, not a *proper* function; real functions require integration into a designed system." This is **more ad hoc** because causal-role accounts explicitly reject "design" requirements, focusing solely on current contributions. Denying a relied-upon effect as "non-functional" contradicts the account’s core.  

  **Verdict:** The etiological move is less ad hoc (it *could* be valid with new selection, though not here). The causal-role move is more ad hoc—it smuggles in history-based criteria the account normally rejects.  

  ### Why This Works  
  The case isolates the accounts’ core differences:  
  - Etiological anchors function to *past selection*, so mismatches yield malfunction verdicts.  
  - Causal-role anchors to *current contribution*, so novel but vital effects count as functional.  
  No wings, appendices, or intelligent designers needed—just climate-driven selection shift and exaptation.
