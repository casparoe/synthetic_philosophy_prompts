   "ranked": ["defeater names, most decisive first"],
   "strongest_single_defeater": "name",
   "insulation_verdict": { "insulated": true, "why": "one or two sentences", "is_that_a_problem": "one or two sentences" },
   "overall_exposure": "one line",
   "bottom_line": "what I should actually do with this view"
  }

  Fill every field, keep each string under about 60 words, and use null rather than inventing a study, author or result you aren't sure of.
