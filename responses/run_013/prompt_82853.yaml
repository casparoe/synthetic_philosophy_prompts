  Your view collapses valence into a functional role (the reward signal) and morality into non-optionality. The main challenge is that functional roles might not capture the subjective experience (the "what it's like" aspect) that many consider essential to suffering. Also, non-optionality might not be sufficient for moral status because a system might be non-optional but not conscious. The strongest objections will come from cases where the functional role is present but without any apparent suffering, or where suffering seems present without the functional role.

