prompt: |-
  I have been following the sortition revival on rationalist blogs and have arrived at a set of verdicts I cannot fully square. A criminal jury chosen by lot, with adversarial testing and a judge, seems to me legitimate even though it decides guilt and liberty. A citizens' assembly chosen by stratified lot, paid, given expert testimony, deliberating for a month and then proposing electoral reform that goes to a referendum, also seems legitimate. A constitutional convention selected by lot, with its proposals subject to ratification, likewise seems legitimate. A university selecting among applicants who clear a published academic threshold by lottery seems fair and better than the current arms race. But a legislature selected by lot to pass ordinary legislation and administer the state seems to me a bad idea. A central bank board selected by lot from qualified economists seems worse. A hospital selecting among surgeons who meet a competence threshold by lottery seems unacceptable. A city council selected by lot to run a city for a term seems doubtful, though I waver. My tentative principle is that lot is appropriate when the decision is bounded, one-off or ratifiable, and the required competence is general rather than specialist; it is inappropriate when the task requires sustained accountability or specialised expertise. This seems to save the jury and the assembly, but I cannot get it to deliver both the admissions lottery and the surgeon lottery, since both select among the qualified. It also seems to condemn the city council while I am not sure I want that. Can you state the best principle, or small set of principles, behind these verdicts, say which verdicts it forces me to abandon, and apply it to two further cases: a randomly selected body with power to set the agenda of an elected legislature, and a randomly selected review panel that can veto regulations but not initiate them. Please answer in British English.
reasoning: |-
  Okay, let me approach this systematically. The user presents a fascinating puzzle about when sortition is appropriate, with seemingly inconsistent intuitions across different scenarios. Their tentative principle about bounded decisions and general competence makes sense but fails to explain why they accept university admissions by lottery but reject surgical selection by lottery - both involve choosing among pre-qualified candidates.

  Hmm, the key might lie in distinguishing between different types of consequences. Medical decisions involve immediate physical outcomes where individual practitioner skill directly affects survival, while university admissions shape future opportunities where institutional environment matters more than any single lecturer. That suggests consequences versus opportunities as an important axis.

  The user's discomfort with legislative sortition points to another dimension: the need for ongoing accountability in iterative decision-making. Juries and assemblies produce one-off verdicts, but legislation requires constant adjustment. This accountability concern also explains their hesitation about city councils - though perhaps less acutely than national legislatures.

  For the new cases they propose:
  The agenda-setting body feels compatible with sortition because it's bounded (shaping priorities not drafting laws) and leverages general citizen perspective. The veto panel is trickier - if it only rejects regulations post-creation, it might function like a jury assessing existing proposals rather than needing specialist drafting skills. But if the regulations are highly technical, that could violate the expertise principle.

  Notably, their surgeon lottery rejection highlights an unstated criterion: when decisions have irreversible, high-stakes consequences concentrated on individuals, random selection among qualified candidates becomes unacceptable. Whereas university admissions, while life-changing, allow for course correction and aren't immediately life-threatening.

  The principles emerging seem to be:
  1. Consequence severity (irreversible harm?)
  2. Accountability horizon (ongoing vs. fixed-term)
  3. Expertise requirement (general wisdom vs. technical skill)
  4. Decision type (final verdict vs. iterative policy)
  5. Concentration of impact (diffuse vs. individual)

  This framework preserves most of their intuitions while suggesting admissions lotteries are acceptable precisely because the stakes, while high, are neither fatal nor irreversible - unlike surgery. It does challenge their city council hesitation slightly, suggesting sortition might work better for agenda-setting than full administration.
answer: |-
  Your intuitions about sortition reveal a nuanced and largely coherent set of principles, though they require refinement to resolve tensions (like the admissions/surgeon discrepancy) and address edge cases. Let's distil a robust framework, identify where your verdicts might shift, and apply it to your new scenarios.

  ### Revised Principles for Sortition Legitimacy
  Based on your judgments, the clearest principles are:

  1.  **Domain of Competence:** Sortition works best when the task relies on **public reason, common sense, or widely held societal values** (e.g., judging facts against a legal standard, deliberating on constitutional fundamentals, expressing citizen preferences on electoral reform). It fails when the task requires **specialised expertise or technical skill** (e.g., neurosurgery, complex monetary policy).
  2.  **Decision Scope & Finality:**
      *   **Bounded Mandate:** The body's remit is clearly defined, finite (e.g., a single trial, one policy proposal), or produces a discrete output (e.g., a jury verdict, a draft constitution).
      *   **Ratification/Safeguards:** Its output isn't final but requires ratification (referendum, judge's approval) or operates within strong constraints (legal rules, expert testimony).
  3.  **Accountability & Iteration:** Sortition is ill-suited for roles requiring **ongoing, adaptive decision-making with direct executive responsibility** and no mechanism for recall or electoral accountability during the term (e.g., running a city council, administering a state legislature). One-off or advisory roles avoid this.
  4.  **Consequence & Reversibility:** Sortition is least acceptable when decisions have **immediate, high-stakes, irreversible consequences for specific individuals** contingent on *individual* competence within the qualified pool (e.g., selecting *which* surgeon operates *on you*). It's more acceptable when consequences are diffuse, systemic, or allow for future correction (e.g., university admissions where the *institution*, not just the individual lecturer, shapes outcomes).

  ### Reconciling Your Verdicts & Required Abandonments
  *   **Juries, Citizens' Assemblies, Constitutional Conventions:** Saved by **Public Reason (1)**, **Bounded Mandate/Ratification (2)**, and lack of need for **Sustained Accountability (3)**.
  *   **University Admissions Lottery:** Saved by **Bounded Mandate (2)** (selection only), **Ratification/Safeguards (2)** (published academic threshold ensures competence), and crucially, **Consequence/Reversibility (4)**: While life-changing, the impact is diffuse, long-term, and mediated by the *entire university system*; failure isn't immediate catastrophe for a specific individual *caused directly by the selector*. It replaces a flawed, high-stakes "arms race" with a fair, competence-gated randomiser.
  *   **Surgeon Lottery:** Condemned by **Specialised Expertise (1)** (selecting *among* specialists still requires nuanced evaluation of *relative* skill) and overwhelmingly by **Consequence/Reversibility (4)**: The decision has immediate, potentially fatal, irreversible consequences for a specific individual *directly dependent on the specific surgeon's skill*. Random selection among qualified candidates ignores vital differences in sub-specialisation, experience, and aptitude *for that specific case*. **You must abandon viewing it as analogous to university admissions.**
  *   **Central Bank Board:** Condemned by **Specialised Expertise (1)** (requires deep, current technical knowledge) and **Accountability/Iteration (3)** (ongoing, adaptive policy needs).
  *   **Legislature:** Condemned by **Accountability/Iteration (3)** (sustained, complex lawmaking/oversight) and lack of **Bounded Mandate (2)**.
  *   **City Council:** Condemned by **Accountability/Iteration (3)** (executive administration, budgeting, service delivery require ongoing responsibility). Your hesitation likely stems from it being local/smaller scale, but the core accountability and iterative decision-making problems remain. **The principle forces you to reject this.**
  *   **Hospital Selecting Surgeons:** Already rejected and correctly condemned by principles (1) & (4).

  ### Application to New Cases
  1.  **Randomly Selected Body Setting the Agenda for an Elected Legislature:**
      *   **Analysis:** This leverages **Public Reason (1)** (citizens identifying broad priorities). It has a **Bounded Mandate (2)** (setting the *agenda*, not drafting laws or governing). Its output isn't final law but guides the elected body **(Ratification/Safeguard (2)**. It avoids **Sustained Accountability (3)** (agenda-setting is periodic/discrete). Consequences are systemic/diffuse **(4)**.
      *   **Verdict:** **Legitimate** under the principles. Examples like the Ostbelgien Citizens' Council support this.

  2.  **Randomly Selected Review Panel with Veto Power over Regulations (Cannot Initiate):**
      *   **Analysis:** This aims to apply **Public Reason/Common Sense (1)** to assess if regulations are disproportionate or contrary to public interest. It has a **Bounded Mandate (2)** (veto only, no initiation). Veto acts as a **Safeguard/Ratification (2)** - the elected/executive body initiates, the panel only blocks. It avoids deep **Specialised Expertise (1)** if focused on reasonableness/impact, not technical minutiae (though complex regulations pose a challenge). It avoids **Sustained Accountability (3)** if reviewing specific, finalised regulations. Consequences are systemic **(4)**.
      *   **Potential Issue:** Highly technical regulations (e.g., nuclear safety, complex pharmacology) might violate **Specialised Expertise (1)** if the panel lacks sufficient support/understanding.
      *   **Verdict:** **Conditionally Legitimate.** It requires careful design:
          *   **Stratification/Lot Size:** Ensure a pool large/diverse enough for robust deliberation.
          *   **Expert Support:** Mandatory, accessible expert testimony explaining the regulation and its rationale.
          *   **Scope Limitation:** Possibly limited to regulations with significant societal impact or cost, excluding highly technical safety standards where expert consensus is paramount.
          *   **High Veto Threshold:** Require a supermajority for a veto to promote careful deliberation and avoid frivolous blocking.
          *   **Transparency:** Public deliberation where possible.
      *   If well-designed, it fits the principles better than a full legislative or executive sortition body. Its legitimacy hinges on the "public reason" test being genuinely applicable to the regulations it reviews.

  ### Summary
  Your core insight about boundedness, ratification, and general competence is sound. The critical refinement is distinguishing *selection among the qualified* based on the **nature of the consequence** (immediate, individual, irreversible harm vs. diffuse/systemic/long-term impact) and recognising that **sustained executive/administrative accountability** is fundamentally incompatible with pure sortition. This framework saves your core acceptable cases (jury, assemblies, constitutional convention, admissions lottery) while compelling rejection of the surgeon lottery and city council, and providing clear criteria for the new agenda-setting and veto panel proposals.
