answer: |-
  The shared-meaning method best respects the constitutional mandate of equal authenticity by requiring courts to enforce only meanings demonstrably present in *both* texts, falling back to the narrower reading only when they share zero common ground. The objection that this collapses into purposivism or silent preference when texts genuinely conflict misunderstands the method's core discipline.

  Where texts diverge entirely—say, Text A prohibits "motor vehicles in parks" while Text B prohibits only "cars and trucks"—there *is* no shared meaning to enforce regarding motorcycles. The court hasn't *chosen* Text B; it acknowledges that Text A, standing alone, *could* include motorcycles, but Text B *excludes* them. Enforcing *only* the prohibition common to both texts ("cars and trucks") respects both equally: it refuses to let Text A expand Text B, and refuses to let Text B restrict Text A's *potential* scope. Crucially, this isn't purposivism: the court isn't asking which rule better serves park safety. It's asking what conduct *both* texts *objectively* forbid. The outcome is mechanical: the narrower prohibition governs where prohibitions conflict absolutely.

  This delivers predictability and textual fidelity. Citizens know liability requires violating *both* texts' commands. Purposivism, by contrast, risks judicial rewriting under the guise of purpose whenever texts disagree, effectively subordinating one authentic text to a judge's view of the statute's goal. The shared-meaning method, even in conflict, anchors the court to the enacted texts' irreducible common denominator.
