prompt: |-
  Hey, I'm a freelance science-and-ideas journalist, on deadline for a piece about the weird moral math people do when they argue about public health rules. There's a move I keep seeing and I don't have a name for it, and it's driving me up the wall.

  Here's the setup. Someone starts out with a very strict anti-adding-up line: you can't justify a rule by pointing to alot of tiny benefits to lots of people, because each person has to be able to accept the rule for reasons that speak to them, and it's good for the group isn't a reason that speaks to any particular person. Fine. Then the numbers get big. A million people lose a week of sleep versus one person being kept awake for a year? Suddenly the same person says, well, obviously you go with the million, and they don't think they've changed their view. What changed is that the individual complaints are now treated as too small to count as complaints at all -- not outweighed, but disqualified from the ledger. I saw the same shape in a planning fight: a preservationist said you can't demolish one person's home for a mall that slightly benefits many, then when the many was a whole city, said the homeowner's loss was too small to register as a loss.

  I know there's a general debate about aggregation in ethics, and I know about thresholds in deontology. What I'm after is the specific thing where the switch from person-by-person justification to group-level summing is triggered by the sheer number of people, and the individual complaint gets reclassified as trivial rather than defeated. Is there an established name for that exact move? If not, can you coin one and define it so I can use it in the piece? I care less about the label than about the carving: what exactly is happening, how is it different from (a) plain aggregation, (b) a lexical threshold where a right is absolute until catastrophe, and (c) the idea that small harms don't count because they're not morally relevant? And where are the edges -- does it matter whether the many are identifiable, whether the harm is divisible, whether the one is responsible for their own predicament?

  Can you give me this as a JSON object with these fields: name (string), established (true/false), one_sentence_definition (string), nearest_concepts (array of objects with concept and how_it_differs), the_move_in_plain_english (string), boundary_cases (array of strings), and a_final_verdict (string). I'm definately not looking for citations or a reading list -- I just need the concept sharpened.
reasoning: |-
  Okay, the user is a freelance science journalist on deadline. They're writing about the moral math people use in public health debates. They've noticed a specific pattern: people start by rejecting the idea of aggregating small benefits across many people, insisting each person must have individual justification. But when the numbers get large enough, they suddenly switch and accept aggregation, reclassifying individual harms as too trivial to count rather than outweighed. 

  The user wants a name for this exact move and a precise conceptual carving. They need to distinguish it from related concepts like plain aggregation, lexical thresholds, and de minimis harm. I notice they're frustrated about lacking terminology - that "driving me up the wall" suggests real deadline pressure. 

  Hmm... let me unpack the core move first. It's not just switching positions but redefining the nature of harm at scale. The individual complaint isn't outweighed; it's semantically downgraded to non-harm when the crowd gets big enough. That's psychologically distinct from admitting you're trading off harms. 

  For naming... "scale-triggered trivialization" feels right - captures how scale triggers reclassification. Not established terminology, but that's fine since they invited coinage. Should flag that in the JSON. 

  Key differentiators: 
  - Vs plain aggregation: Here aggregation only "works" after harm is redefined as trivial at scale
  - Vs lexical thresholds: No catastrophe needed, just sufficient numbers
  - Vs de minimis: Harm wasn't considered trivial until the crowd appeared

  Boundary cases matter for their piece: 
  - Identifiable vs statistical victims? (Probably weakens the effect)
  - Divisible harm? (Makes it feel less personal)
  - Self-inflicted? (Might neutralize the move)

  Final verdict: It's a psychological dodge - preserving anti-aggregation principles while allowing practical concessions to scale. Sneaky but understandable human reasoning.

  The JSON structure they requested is perfect for their needs - lets them lift definitions directly into their piece. Should keep explanations crisp but nuanced enough for science readers.
answer: |-
  Here's the conceptual breakdown as a JSON object, sharpening the move you've observed:

  ```json
  {
    "name": "Scale-Triggered Trivialization",
    "established": false,
    "one_sentence_definition": "A rhetorical move where small individual harms are deemed morally irrelevant *only* when aggregated across a sufficiently large population, allowing group-level summation while maintaining the principle that individual burdens require personal justification.",
    "nearest_concepts": [
      {
        "concept": "Aggregationism",
        "how_it_differs": "Aggregationism accepts summing small benefits/harms inherently. Scale-triggered trivialization *denies* aggregation's validity initially, then *redefines* the harm as non-existent at scale to permit summation."
      },
      {
        "concept": "Lexical Threshold/Deontological Threshold",
        "how_it_differs": "Lexical thresholds involve overriding a right only in catastrophic *magnitude* (e.g., millions dying). This move triggers on the *number* of beneficiaries, reclassifying the *nature* of the individual harm as trivial, not overriding a persisting significant right."
      },
      {
        "concept": "De Minimis Harm",
        "how_it_differs": "De minimis holds certain harms are *inherently* too trivial to count morally. This move asserts the harm *becomes* trivial *specifically because* it is small *and* imposed on one to benefit a vast number."
      }
    ],
    "the_move_in_plain_english": "Someone starts by insisting rules must be justifiable to each individual burdened; 'good for the group' isn't enough, and small burdens to many people don't add up to justify imposing a larger burden on one. However, when the 'many people' becomes extremely large (e.g., millions), they flip: they don't say the small burdens *collectively outweigh* the larger burden. Instead, they argue each small burden is now *so insignificant* that it doesn't even register as a *real cost or harm* worthy of moral consideration. This allows them to accept the group benefit (or prevent the group harm) without conceding that small individual harms *aggregate* morally. The switch isn't admitting aggregation works; it's redefining the small harm out of existence contextually.",
    "boundary_cases": [
      "Identifiable vs. Statistical Lives: Does the move work if the 'many' are anonymous statistics vs. a known group? Likely stronger for anonymous masses.",
      "Divisibility of Harm: Is the harm fundamentally indivisible for the 'one' (losing their home) vs. divisible (minor sleep loss)? The move seems easier for divisible harms.",
      "Responsibility: Does it matter if the 'one' chose the risky situation? If self-inflicted, the trivialization might be more readily accepted.",
      "Directness: Is the harm to the 'one' a direct consequence of helping the many (e.g., demolishing their house) or a side-effect? Direct imposition may resist trivialization longer.",
      "Nature of Harm: Does it work for fundamental rights (free speech) vs. comforts (sleep)? Likely harder for core rights."
    ],
    "a_final_verdict": "Scale-Triggered Trivialization is a distinct cognitive maneuver to reconcile anti-aggregationist intuitions with practical necessity at large scale. It avoids acknowledging a trade-off by semantically downgrading the small harm's moral status *based solely on the number of others involved*, not its inherent nature or magnitude. It's a psychological workaround, not a consistent ethical principle."
  }
  ```

  **Key Clarifications:**

  1.  **The Core Move:** The defining feature is the *reclassification* of the harm ("not outweighed, but disqualified"). The harm's moral relevance vanishes *because* of the scale, not because it was always tiny. A week's sleep loss *was* a relevant harm justifying refusal when imposed on 100 people to save one person a year's sleep. But imposed on a million to save one person? Suddenly, that week "doesn't count" as harm *at all* in this context.
  2.  **vs. Plain Aggregation:** Aggregation sums harms/benefits *despite* their individual relevance. This move *denies* the individual harm's relevance *specifically under conditions of scale* to *allow* what looks like aggregation without admitting it.
  3.  **vs. Lexical Threshold:** A lexical threshold ("Never violate right X, except to prevent catastrophe Y") focuses on the *magnitude of the bad outcome avoided*. Scale-Triggered Trivialization focuses on the *number of small beneficiaries* making the *imposed burden seem insignificant per capita*. Catastrophe isn't required; sheer numbers trigger the semantic shift.
  4.  **vs. De Minimis:** True de minimis argues the harm is *objectively* negligible (e.g., a single grain of sand). Here, the harm is *subjectively redefined* as negligible *only* when many others benefit. The same harm (a week's lost sleep) is non-trivial in a small-scale case but trivial in the large-scale case.
  5.  **Why it's Sneaky:** It lets the arguer maintain the high ground of "individual justification is paramount" while functionally accepting large-scale utilitarian outcomes by dismissing the individual burdens as illusory *at scale*. They haven't "changed their mind" about aggregation; they've changed their assessment of the harm's moral weight based on the crowd size.
