  Crucially, I must acknowledge where philosophy hits practical limits: no procedure can eliminate judgment calls, and checklistizing virtues has inherent tensions. But we can get closer to epistemic justice while keeping the plant running safely.
answer: |-
  Here's a triage procedure designed to operationalize epistemic justice in near-miss reporting, with explicit handling of Fricker's concepts and your "shelf vocabulary" problem. It prioritizes auditable steps while acknowledging inherent tensions.

  **Core Distinctions That Must Survive Simplification:**
  1.  **Testimonial Injustice (TI):** Discounting credibility based on identity/role *without* justified evidence.
  2.  **Hermeneutical Injustice (HI):** Lack of shared concepts/vocabulary prevents the issue from being understood.
  3.  **"Shelf Vocabulary" Injustice (SVI):** *You* possess the relevant concept/vocabulary but fail to apply it to *this specific report/reporter* (your sister's 3rd point).
  4.  **Evidence of Absence vs. Absence of Evidence:** A lack of reports *can* indicate systemic suppression (learned helplessness), not safety.

  **Distinctions Simplified/Operationalized:**
  *   Philosophical jargon (TI/HI/SVI) becomes triage questions.
  *   "Virtue" becomes specific, auditable investigative *actions* triggered by flags.
  *   "Power" becomes scrutiny of *reasons* for discounting, not automatic reversal.

  ---

  **Near-Miss/Safety Report Triage Procedure**

  **Step 0: Intake & Initial Logging**
  *   Log report: Reporter ID, Date/Time, Location, Description (verbatim), Reporter Concerns/Suggestions.
  *   **Flag:** Reporter history (frequency, similar reports), Role/Shift, Any stated reluctance ("I know nothing ever happens but...").

  **Step 1: Credibility Discount Check (Testimonial Injustice Screen)**
  *   **Question:** *Is my initial reaction to discount this report influenced by the reporter's identity, role, shift, history, or communication style, rather than the specific content of the report?* (e.g., "It's just Bob complaining again," "She's new and nervous," "His English is poor").
  *   **Sufficient Answer:** Explicitly state the *content-based reason* for discounting concern OR acknowledge potential bias and proceed to Step 2 with heightened scrutiny. If discounting, justification must reference specific inconsistencies, physical evidence, or established data contradicting *this specific report*, not the reporter.
  *   **Outcome:**
      *   **Proceed:** If no discounting OR discounting acknowledged with bias mitigation plan (e.g., "Proceed to Step 2; flag potential bias due to reporter's accent, focus strictly on physical evidence").
      *   **Stop - No Action:** *Only* if report is factually impossible, wholly unrelated to safety (e.g., complaint about cafeteria coffee), or a clear duplicate of a *fully resolved* report. **Audit Note:** Must document specific contradiction to report's *content*.
  *   **Handoff:** None at this stage.

  **Step 2: Concept & Vocabulary Gap Check (Hermeneutical & Shelf Vocabulary Injustice Screen)**
  *   **Question A (HI):** *Does the reporter seem to be struggling to describe something potentially hazardous because they lack the specific terminology or framework?* (e.g., "feels thick," "makes my skin crawl," "it's just wrong").
  *   **Question B (SVI):** *Do I possess relevant expertise, standards, or categories (OSHA, NIOSH, ANSI, internal procedures, ergo guides, IH knowledge) that could interpret this description, but am I hesitating to apply them here?* (e.g., "Thick air" -> VOCs/particulates? "Skin crawl" -> chemical exposure/static? "Wrong" -> ergonomic risk? But thinking "she's just sensitive" or "it's probably nothing").
  *   **Sufficient Answer:** For A: Identify key sensory/descriptive words indicating a potential gap. For B: List specific relevant standards/concepts that *could* apply, regardless of initial belief about validity.
  *   **Outcome:**
      *   **Proceed:** Always proceed to Step 3.
      *   **"Form Failure" Flag:** If HI/SVI is likely triggered (Gap identified in A *or* hesitation acknowledged in B), flag: **"Potential HI/SVI - Description mismatch may indicate hazard requiring investigation or form revision."** This *must* be included in the audit log.
  *   **Handoff:** None yet. Flag informs Step 3 investigation.

  **Step 3: Hazard Assessment & Root Cause Hypothesis**
  *   **Task:** Based on report content, location, reporter input, and flags from Steps 1 & 2, formulate 1-3 plausible hazard hypotheses using available standards/vocabulary.
  *   **Key Actions:**
      *   Consult relevant standards (ergo, chem, machine safety) for *hypotheses*, not just confirmation.
      *   Consider Step 2 flags: Actively try to map sensory descriptions to standards (e.g., "thick air" -> check booth airflow specs, recent filter changes, VOC monitoring data).
      *   Examine physical evidence: Photos, sensor logs, maintenance records, environmental monitoring (if any).
      *   **Crucial:** Check for *absence* of data where it *should* exist if hazard was present (e.g., is VOC monitoring even active near that booth? Are ergo assessments done for that task?).
  *   **Sufficient Hypothesis:** A testable statement about a potential hazard mechanism (e.g., "Booth airflow may be below 100fpm, increasing solvent vapor concentration," "Repetitive lift at X angle may exceed NIOSH Lifting Equation," "Guard sensor may be intermittently failing").

  **Step 4: Action Determination**
  *   **Question:** *Based on hypotheses, potential severity, likelihood, and available evidence, what action minimizes risk most effectively within operational constraints?*
  *   **Outcome & Handoff:**
      *   **No Action:** Only if *all* plausible hypotheses are robustly disproven *or* risk is negligible (ALARP). **Audit Note:** Must document hypothesis testing and evidence used. *Highly* scrutinize if Step 2 flag was set.
      *   **Immediate Action (Your Call):** If hazard is clear, imminent, and stoppage is justified (e.g., gas leak, guard missing). **Notify:** Shift Supervisor, Maintenance (if urgent repair), Plant Manager.
      *   **Investigation Needed (Handoff):**
          *   **Engineering/Maintenance:** Equipment malfunction, machine safety, ventilation issues.
          *   **Ergonomics/IH Specialist:** Musculoskeletal strain, chemical exposure, noise, heat stress.
          *   **Supervisor/HR:** Behavioral safety, procedure adherence, training gaps, interpersonal issues (if not TI).
          *   **Plant Manager/Union:** Systemic issues, resource allocation, policy changes, patterns revealed by absence of reports.
          *   **Form Revision Team (You):** If HI/SVI flag was set and investigation confirms a vocabulary/form gap hindering reporting.
      *   **Monitoring/Data Collection:** If evidence is insufficient but hypothesis plausible (e.g., install temporary VOC monitor, task observation, strain gauges).
  *   **Budget/False Alarm:** Factor in cost of action vs. potential cost of inaction (injury, downtime, regulatory fines). "Discounting" due to cost must be explicit risk acceptance documented at Plant Manager level, *not* at triage. Your step is hypothesis generation; cost assessment happens *after* with relevant stakeholders.

  **Step 5: Feedback Loop & System Check**
  *   **Task:** Document decision, rationale, handoffs, and flags (TI, HI/SVI). Provide reporter with *meaningful* feedback (even if "no action" - explain *why* based on Step 4).
  *   **System Check:** Analyze trends:
      *   Reports with HI/SVI flags -> Form/process revision needed?
      *   Repeated reports from same person/location -> Was prior action ineffective?
      *   *Lack* of reports in high-risk areas -> Is there suppression (HI, fear, futility)? Proactive monitoring needed?
      *   Frequent "No Action" on certain report types -> Is the threshold too high? Is the form misleading?

  **What the Procedure CANNOT Do:**
  1.  **Eliminate Judgment Calls:** Steps 1, 2, and 4 inherently require judgment. The procedure forces *explicit articulation and auditing* of that judgment.
  2.  **Guarantee "Truth":** It minimizes injustice and improves reasoning but can't prevent all errors.
  3.  **Resolve Value Conflicts:** Balancing safety vs. cost is a management/union decision, informed by your risk assessment.
  4.  **Fix Deep Cultural Issues:** It flags symptoms (TI, suppression) but changing culture requires broader leadership/union action.
  5.  **Perfectly Diagnose Intent:** It distinguishes patterns of injury/risk from potential "light duty seeking" (Step 3 hypotheses) but can't read minds. Focus on the *risk*, not the reporter's motive.
  6.  **Replace Expertise:** It tells you *when* to hand off to Maintenance or an IH, not *how* to do their job.
  7.  **Fully Encode Virtue:** It operationalizes key aspects of epistemic justice (attentiveness, humility, diligence) into *actions* (checking for bias, applying vocabulary, investigating gaps), but the *disposition* to do this rigorously remains essential. The checklist prompts the virtue; it doesn't create it.

  ---

  **Running Your Cases:**

  1.  **Cleaner: "Air feels thick" by Paint Booth (Raised Twice)**
      *   **Step 1:** Initial discount? ("Just a cleaner," "vague"). *Flag potential TI - proceed with scrutiny.*
      *   **Step 2:** A) Clear struggle ("feels thick"). B) You *have* VOC/particulate/airflow standards. *SVI Flag Triggered* (Why not apply airflow/VOC concepts?). HI likely too (lacks "VOC" term). **Form Failure Flag:** "Description mismatch - 'thick air' may indicate ventilation/contaminant issue."
      *   **Step 3:** Hypotheses: Booth airflow <100fpm? Filter clogged? VOC levels elevated? *Check:* Maintenance logs (filters), any air monitoring data? Likely *no* data exists.
      *   **Step 4:** **Handoff to Industrial Hygienist (or Eng if airflow):** "Investigate ventilation/VOC levels at Booth X based on sensory reports of 'thick air' (SVI/HI flagged). Consider temporary monitoring." **No Action is insufficient.**
      *   **Step 5:** Tell cleaner: "Thanks for persisting. We're investigating the air quality because your description concerns us. We'll update you."

  2.  **Shift Lead: "New Agency Hires are Accidents Waiting to Happen"**
      *   **Step 1:** Initial discount? *Yes* (Potential TI - bias against agency/new hires). But also, report is vague. *Acknowledge potential bias, proceed with scrutiny focusing on specific risks.*
      *   **Step 2:** A) Not HI - he has concepts. B) Not SVI - he's making a claim, you need specifics. *No HI/SVI Flag.*
      *   **Step 3:** Hypothesis: *What specific hazards?* (Lack of training? Unsafe shortcuts? Specific equipment misuse?) **Action:** *Require specifics.* "Please provide examples: specific incidents, near-misses, unsafe acts you've observed, or tasks they struggle with." *Without specifics, plausible hypothesis generation impossible.*
      *   **Step 4:** **No Action (Yet):** Due to lack of actionable specifics. **Handoff to Supervisor/HR:** "Shift Lead expresses concern about agency hires' safety. Request follow-up: Observe work, review training records for gaps, encourage specific near-miss reporting from lead/others." *Discounting the* generalized claim *is procedurally sound, not TI, because he provided no specific evidence of a hazard.*
      *   **Step 5:** Tell lead: "Thanks for the concern. To investigate, we need specific examples or hazards. Please report any unsafe acts or near-misses you see. I've asked [Supervisor] to observe and review training."

  3.  **Recurring Lower Back Pain Reports (Same Spot)**
      *   **Step 1:** Initial discount? ("Wants light duty"). *Potential TI - bias against reporter/motive.* *Acknowledge potential bias, proceed with scrutiny focusing on the reported pain as a symptom.*
      *   **Step 2:** A) Not HI - "back pain" is clear. B) You *have* ergo standards, injury causation models. *SVI Flag Triggered* (Why not apply ergo risk assessment?). *Hesitation to apply ergo concepts because of motive suspicion?*
      *   **Step 3:** Hypothesis: Specific task/posture/load causing strain? Underlying injury exacerbated by work? *Check:* Job description, task observation (video?), previous ergo assessments? Worker interview: *Exactly* when does it hurt? What task?
      *   **Step 4:** **Handoff to Ergo Specialist/Occupational Health Nurse/Doctor:** "Three reports of LBP at [location] during [task?]. Assess ergonomic risk factors and worker capacity. Determine fitness for duty/need for accommodation." *Your role is to identify potential work-related risk, not diagnose medical cause or intent.*
      *   **Step 5:** Tell worker: "We take your reports seriously. Since it's recurring, we're referring you to [Ergo/OH] for a proper assessment to understand the cause and see if adjustments can help." *Separates hazard assessment (your job) from medical/HR decisions.*

  **Settled vs. Contested:**
  *   **Settled:** Fricker's core TI/HI concepts are widely accepted. Ignoring available institutional knowledge (SVI) when presented with relevant experiential reports is a recognized epistemic failure in applied epistemology/philosophy of science. Systems *can* silence reporting (evidence of absence).
  *   **Contested:** The *precise* line between reasonable skepticism and TI/SVI. The extent to which *virtues* can be *fully* proceduralized (This procedure leans on Martha Nussbaum/Jason Baehr's view that virtues can be *cultivated* and *prompted* by structures/rules, but the disposition remains crucial). Whether cost *can* be ethically integrated into safety decisions without injustice (This procedure pushes cost analysis *upstream* to avoid individual reporter discounting). The best way to quantify "learned helplessness" from absent reports.

  This procedure makes your epistemic labor explicit, auditable, and focused on minimizing injustice while respecting operational realities. It forces engagement with the "shelf vocabulary" and flags when the form itself might be part of the problem.
