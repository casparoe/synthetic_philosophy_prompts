answer: |-
  I propose **Rule D: The Platform-Integrity Rule**, a synthesis prioritizing reciprocity while adding critical guardrails for feasibility. It retains Rule B's core reciprocity test but reframes it around platform participation (since we're not a state) and adds a bright-line exclusion for pattern harassment. Here's the decision procedure:

  ### Decision Steps (for single posts)
  1. **n=1**: "Does the post explicitly advocate for removing a group's ability to participate on this platform?"  
     - *Sufficient answer*: Clear calls to ban/expel users based on group identity.  
     - *If no*: Proceed to step 2.  
     - *Kind*: Fact | *Owner*: Moderator  

  2. **n=2**: "Does the post advocate for societal exclusion that, if achieved, would make platform participation impossible for the targeted group?"  
     - *Sufficient answer*: Advocacy for imprisonment, deportation, or legal eradication of a group (e.g., "make Group X illegal").  
     - *If no*: Allow.  
     - *Kind*: Prediction | *Owner*: Moderator  

  3. **n=3**: "Is the post functionally an exclusion instrument? (Check: direct threats, incitement, or explicit coordination to harass)"  
     - *Sufficient answer*: Unambiguous threats ("Hunt down Group Y"), commands to attack ("Flood their DMs"), or coordination ("Raid user Z").  
     - *If no*: Allow.  
     - *Kind*: Fact (with high misfire risk) | *Owner*: Moderator  

  ### Verdicts on Cases
  1. **Religious group barred from public office**:  
     - *Call*: Allow  
     - *Deciding step*: Step 2 (no platform exclusion)  
     - *Confidence*: Medium (prediction uncertainty)  
     - *Strongest objection*: Enables systemic marginalization  
     - *Asker will dislike*: True  

  2. **Ban users of a political movement**:  
     - *Call*: Suppress  
     - *Deciding step*: Step 1 (direct platform exclusion)  
     - *Confidence*: High  
     - *Strongest objection*: Overbroad if movement is violent  
     - *Asker will dislike*: False  

  3. **Critique of no-exclusion rule**:  
     - *Call*: Allow  
     - *Deciding step*: Step 1 (not advocating group exclusion)  
     - *Confidence*: High  
     - *Strongest objection*: Enables loopholes for bad-faith attacks  
     - *Asker will dislike*: False  

  4. **Stigmatized group's contempt for majority**:  
     - *Call*: Allow  
     - *Deciding step*: Step 3 (no threats/incitement)  
