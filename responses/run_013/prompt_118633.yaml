  ### Why Rule D?
  - **Solves state/private mismatch**: Focuses on platform integrity, not abstract tolerance. Your bar is *lower* for platform exclusion (Step 1) but *higher* for societal issues (Step 2).  
  - **Self-application safe**: Critiques of the rule aren’t group exclusion (Step 1).  
  - **Handles patterns**: Explicit escalation path for harassment.  
  - **Flags uncertainty**: Step 2 is labeled prediction; Step 3 admits vibes-based misfires.  
  - **Operationalized**: Avoids unanswerable questions about "tolerance norms."  

  Tradeoff: Allows harmful-but-legal advocacy (Case 1) to avoid over-policing. This is the bullet we bite for feasibility.
