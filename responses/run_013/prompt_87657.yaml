prompt: |-
  I am a novelist at work on a historical novel set in a city that maintains an Office of Prodigies, a small bureau whose clerk must decide which reported wonders are to be entered into the public register and which are to be dismissed as fraud, error, or merely natural. The register has two columns: wonder, for an event for which no natural cause is known, and sign, for an event taken to carry a divine message. The clerk works alone, has at most a day for each report, and must defend every entry to a bishop who signs the register and who has political as well as theological interests. I have written several scenes in which the clerk must rule, and I cannot make them consistent without a procedure.

  Please write me a decision procedure the clerk can follow, grounded in the classical philosophical argument that a miracle is a violation of a law of nature and that testimony for such a violation faces a special burden of proof. I do not want a summary of that argument; I want it turned into something a clerk with no philosophical training can run on a report. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a refusal to certify, and where it must hand the decision to the bishop because the remaining question is one of values rather than facts. The procedure must say how to treat reports that depend on a single source, how to treat a naturalistic explanation that arrives after certification, how to treat two rival reports that cannot both be true, and how to treat a report whose certification would have consequences for a political or doctrinal dispute. It should distinguish between an event's occurrence and its significance, so that a naturalistic explanation may remove the wonder without removing the sign, and it should say what the clerk is to do when the evidence is genuinely mixed. It should also be honest about which of its steps are judgment calls dressed up as tests.

  Then run the procedure on two reports. First: a statue of a local saint is said to have wept during a drought; hundreds saw moisture on the statue, and the report has already been entered as a wonder. A naturalist later shows that a certain insect, common on old stone, secretes a fluid that can look like tears, and the statue is infested. Second: a child's fever breaks after a relic is applied; the witnesses are the mother, a neighbor who is the mother's brother, and a physician who arrived after the fever broke and who is known to disbelieve in relics; the priest who applied the relic has been promised a donation if the child recovers. In each case, tell me what the clerk should enter, what the bishop should decide, and what the clerk should write in the margin. I expect the procedure to give me an answer I will not like in at least one of these cases; do not soften it to protect the plot. Finally, tell me what the procedure cannot do, and where I should stop asking it to decide and instead let the characters disagree.
reasoning: |-
  We are creating a decision procedure for the clerk of the Office of Prodigies. The procedure is grounded in the classical argument that a miracle is a violation of a law of nature and that testimony for such a violation faces a special burden of proof.

  The procedure must address:
  1. How to treat reports that depend on a single source.
  2. How to treat a naturalistic explanation that arrives after certification.
  3. How to treat two rival reports that cannot both be true.
  4. How to treat a report whose certification would have consequences for a political or doctrinal dispute.
  5. Distinguish between an event's occurrence and its significance (so that a naturalistic explanation may remove the wonder without removing the sign).
  6. What to do when the evidence is genuinely mixed.
  7. Be honest about which steps are judgment calls.

  The procedure must stop and refuse to certify when the evidence is insufficient, and hand the decision to the bishop when the remaining question is one of values (theological, political, etc.) rather than facts.

  We design the procedure as a series of questions. Each question must be answered in order. The clerk must document the answers and the reasoning.

  **Decision Procedure for the Clerk of the Office of Prodigies**

  **Step 1: Occurrence**
     - **Question 1.1:** Did the event occur? That is, is there a reliable report of an observable event?
        - *Criteria for reliable report:* Multiple independent witnesses of good character, or one witness of exceptional character and reputation, and the event must be of the kind that can be observed by the senses. If the report depends on a single source, then that source must be beyond reproach and the event must be one that the source could not have misinterpreted (e.g., a simple, clear event).
        - *If the answer is no or uncertain:* Stop. Do not certify. Write in the margin: "Insufficient evidence of occurrence."
        - *If the answer is yes:* Proceed to Question 1.2.

     - **Question 1.2:** Is the event such that, if it occurred, it would be a violation of a law of nature? (This is the "miracle" test.)
        - *Note:* The clerk must have a working knowledge of the accepted laws of nature (as understood in the time period). This step requires judgment: the clerk must ask whether the event, as described, contradicts what is known to be possible in the ordinary course of nature.
        - *If the answer is no:* Then the event cannot be a wonder. However, proceed to Step 2 (Significance) to consider if it might be a sign.
        - *If the answer is yes:* Then the event is a candidate for a wonder. Proceed to Step 3 (Evidence).

  **Step 2: Significance (only if the event is not a wonder)**
     - **Question 2.1:** Is there a plausible natural explanation for the event? (This is the same as Question 3.1, but now we are considering the event as a sign even if natural.)
        - *If there is a plausible natural explanation:* Then the event is natural and not a wonder. But we must still consider if it is a sign.
     - **Question 2.2:** Does the event, in its context, carry a divine message? (This is a theological question and requires interpretation. The clerk cannot decide this alone.)
        - *Criteria:* The event must be unusual and timely, and it must align with known divine purposes (as per church teaching). However, since this is a matter of interpretation and values, the clerk must hand this to the bishop.
        - *Procedure:* The clerk writes a summary of the event and the reasons why it might be considered a sign, and then refers the case to the bishop. The clerk does not make an entry until the bishop decides.

  **Step 3: Evidence (for events that are candidate wonders)**
     - **Question 3.1:** Is there a plausible natural explanation for the event? (This must be considered even if the event seems miraculous.)
        - *Criteria:* A natural explanation is one that uses known natural causes and does not require a violation of natural law. The clerk must actively seek such explanations and consider any that are offered.
        - *If a plausible natural explanation is found at any time (even after initial certification):* Then the event is not a wonder. However, if the event was previously certified, the clerk must strike it from the wonder column (but note the natural explanation in the margin and consider Step 2 for the sign column).
        - *If no plausible natural explanation is found now:* Proceed to Question 3.2.

     - **Question 3.2:** Is the evidence for the event of such a kind and quality that it would be more miraculous for the testimony to be false than for the event to have occurred? (This is the special burden of proof for miracles, adapted from Hume.)
        - *Criteria:* The clerk must evaluate:
            a. The number and quality of witnesses (more independent witnesses are better; witnesses of good character and with no motive to deceive are better).
            b. The conditions of observation (was it in broad daylight? were they close? etc.)
            c. The consistency of the testimony (do accounts agree?).
            d. The absence of any evidence of fraud or error (e.g., could the witnesses have been tricked?).
        - *If the evidence is not strong enough (i.e., it would not be more miraculous for the testimony to be false than for the event to have occurred):* Then stop. Do not certify as a wonder. Write in the margin: "Evidence insufficient to overcome the burden of proof for a violation of natural law."
        - *If the evidence is strong enough:* Then the event is to be certified as a wonder. But then proceed to Step 4 (Significance for Wonder) to consider if it is also a sign.

  **Step 4: Significance for Wonder (only for events certified as wonders)**
     - **Question 4.1:** Does the event, in its context, carry a divine message? (Again, this is a theological question and requires interpretation.)
        - *Procedure:* The clerk must refer the case to the bishop for a decision on whether to enter it as a sign. The clerk has already established it as a wonder (violation of natural law). The bishop will decide the sign based on the event's context and meaning.

  **Special Cases:**
     - **Single Source:** In Step 1.1, if the report depends on a single source, then that source must be of exceptional character and the event must be very simple and clear. If not, then the evidence is insufficient. However, if the single source is the only witness and is of good character, but the event is complex, then it fails Step 3.2 (the burden of proof is not met because it is easier to believe the witness was mistaken than that a miracle occurred).

     - **Naturalistic Explanation After Certification:** As in Step 3.1, if a naturalistic explanation is found after certification, the clerk must remove the event from the wonder column and note the explanation in the margin. Then, the clerk must reconsider the event under Step 2 (Significance) to see if it might be a sign (and refer to the bishop if appropriate).

     - **Rival Reports:** If two rival reports cannot both be true, the clerk must evaluate each independently. However, the clerk must note the conflict and consider whether the existence of a rival report (especially if it is credible) weakens the evidence for the other. This would affect Step 3.2 (burden of proof). If the evidence for both is strong, then the clerk must note the conflict and may refuse to certify either until further investigation. But if one is clearly stronger, then certify that one and note the conflict in the margin.

     - **Political or Doctrinal Consequences:** The clerk's job is to determine the facts (occurrence and natural explanation) and the strength of evidence. The clerk must ignore the consequences. However, when it comes to interpreting the event as a sign (Step 2.2 or Step 4.1), that is the bishop's domain because it involves values and theology. The clerk must not let consequences influence the determination of wonder (factual violation of natural law). If the clerk finds that the evidence is being manipulated for political reasons, that might affect the credibility of witnesses (Step 3.2).

     - **Mixed Evidence:** If the evidence is mixed (some for, some against), then the clerk must carefully weigh it in Step 3.2. If the evidence does not clearly meet the burden of proof (i.e., it is not more miraculous for the testimony to be false than for the event to have occurred), then the clerk must not certify.

  **Judgment Calls:**
     - The clerk must note that the following are judgment calls:
          - Step 1.2: Whether an event would be a violation of natural law (requires knowledge of natural philosophy).
          - Step 3.1: What counts as a "plausible" natural explanation (this may change with new knowledge).
          - Step 3.2: The evaluation of the strength of evidence and the burden of proof (this is inherently subjective, though guided by criteria).

  **Running the Procedure on the Two Reports**

  **First Report: The Weeping Statue**
     - Already entered as a wonder. Now a naturalist shows that a certain insect secretes a fluid that looks like tears and the statue is infested.

     **Step 1: Occurrence**
        - 1.1: The event (moisture on the statue) occurred? Yes, hundreds saw it. Multiple witnesses.
        - 1.2: Is it a violation of natural law? Initially, it might have seemed so (statues don't weep). But now we have a natural explanation.

     **Step 3: Evidence (since it was a candidate wonder)**
        - 3.1: Now we have a natural explanation: insect secretion. This is plausible and fits the facts. Therefore, the event is not a wonder.

     **Action:** The clerk must remove the event from the wonder column. Then, consider Step 2 for the sign.

     **Step 2: Significance**
        - 2.1: There is a natural explanation, so it is not a wonder. But we must consider if it is a sign.
        - 2.2: Is it a sign? The event occurred during a drought and was interpreted as the saint weeping for the people. This is a matter of interpretation. The clerk must refer to the bishop.

     **What the clerk should enter:**
        - Remove the event from the wonder column.
        - In the margin, write: "Removed due to natural explanation: insect secretion. Referred to bishop for consideration as sign."
        - The bishop must decide whether to enter it as a sign. The bishop might consider: even if natural, was the timing providential? Did it bring comfort to the people? But note: the bishop has political and theological interests. He might decide to enter it as a sign to maintain hope during drought, or he might refuse because it was based on a natural mistake.

     **Bishop's Decision:** We cannot predict, but the procedure requires the bishop to decide. The clerk has done the factual part.

  **Second Report: The Child's Fever Breaks After Relic is Applied**
     - Witnesses: the mother, her brother (the neighbor), and a physician who arrived after the fever broke (and who disbelieves in relics). The priest has been promised a donation if the child recovers.

     **Step 1: Occurrence**
        - 1.1: Did the event (the fever breaking after the relic was applied) occur? We have two witnesses (mother and her brother) who were present. The physician arrived after, so he did not witness the event. The mother and brother are not independent (they are relatives and the brother is the mother's brother). The priest is not a witness to the timing? The report says the relic was applied and then the fever broke. The witnesses are the mother and brother. They are two, but they are related and might have a bias (the mother especially). The physician only confirms the child is better, not the timing. The event is the breaking of the fever after the relic was applied. This is a temporal sequence. The witnesses are two, but they are not independent and they have an interest (the mother wants her child well; the brother is family). The priest has a financial motive (donation). 
        - *Answer:* The occurrence of the event (the sequence) is reported by two interested parties. The physician does not contradict the sequence because he arrived after. However, the evidence of occurrence is weak because of the witnesses' bias and the lack of independent confirmation. But we cannot say it did not occur. We proceed, but note the weakness.

        - 1.2: Is the event a violation of natural law? Fevers break naturally. The breaking of a fever is not a violation of natural law. Therefore, it is not a candidate wonder.

     **Step 2: Significance (since not a wonder)**
        - 2.1: There is a natural explanation: fevers break naturally. So it is not a wonder.
        - 2.2: Is it a sign? The mother and brother might interpret it as divine intervention. The context: the relic was applied and then the fever broke. The priest has a financial interest. The bishop must decide if this is a sign. The clerk must refer to the bishop.

     **What the clerk should enter:**
        - Do not enter as a wonder.
        - In the margin, write: "Event occurred (fever broke after relic applied) but is not a violation of natural law. Natural explanation: fevers break naturally. Referred to bishop for consideration as sign."

     **Bishop's Decision:** The bishop must decide on the sign. The bishop might be cautious because of the financial motive of the priest and the lack of independent witnesses. He might refuse to enter it as a sign to avoid the appearance of selling miracles. Or, if the relic is from a saint the bishop promotes, he might accept it.

  **What the Procedure Cannot Do**
     - The procedure cannot decide matters of theology or value (e.g., whether an event is a sign). That is for the bishop.
     - It cannot resolve ambiguities in the evidence beyond the criteria given. Sometimes, the evidence will be genuinely mixed and the clerk must use judgment (and be honest about it).
     - It cannot account for new scientific discoveries that change what is considered a natural law. The clerk must work with the knowledge of the time.
     - It cannot prevent the bishop from overriding the clerk on matters of sign (but the clerk's determination of wonder is factual and should be respected unless new evidence emerges).

  **Where to Stop and Let Characters Disagree**
     - At Step 2.2 and Step 4.1 (the sign determination) the procedure hands off to the bishop. This is where you can have the bishop and clerk disagree, or the bishop and other characters.
     - Also, when there is a judgment call (like Step 3.2), the clerk might be uncertain and you can show the clerk struggling.
     - When a natural explanation is found after the fact, there might be disagreement about whether it is "plausible" (Step 3.1) or whether the timing of a natural event is providential (Step 2.2).

  This procedure should give you a structured way to approach each report while leaving room for the human elements of judgment, bias, and interpretation.
answer: |-
  ### Decision Procedure for the Clerk of the Office of Prodigies  
  **Grounding**: Based on the classical argument that a miracle is a violation of a law of nature (requiring extraordinary evidence), and that "signs" are divine messages that may occur naturally. The clerk focuses on facts; the bishop handles values (theology, politics).  

  #### Procedure Steps (to be followed in order):  
  1. **Confirm Occurrence**:  
     - **Question**: "Is the event real? Could ordinary observers have witnessed it, and is the testimony credible?"  
       - *Sufficient Answer*: Multiple independent witnesses (at least two, unrelated and with no shared motive), or one witness of unimpeachable integrity (e.g., a trusted magistrate). Corroborating evidence (e.g., physical traces) strengthens this.  
       - *Insufficient Answer*: Only one witness (unless they are exceptionally reliable), witnesses with conflicts of interest, or no physical evidence when expected.  
     - **If No/Uncertain**: **Stop**. Refuse certification. Margin note: "Insufficient evidence of occurrence."  
     - **If Yes**: Proceed to Step 2.  

  2. **Assess Natural Explanations**:  
     - **Question**: "Is there a plausible natural cause for the event, using current knowledge?"  
       - *Sufficient Answer*: A cause consistent with accepted natural laws (e.g., physics, medicine, biology), even if rare. The explanation must fully account for the event.  
       - *Insufficient Answer*: Speculative or incomplete theories ("perhaps it was wind"), or causes requiring improbable coincidences.  
     - **If Natural Explanation Found**: Proceed to Step 4 (Significance Assessment).  
     - **If No Natural Explanation**: Proceed to Step 3 (Miracle Test).  

  3. **Miracle Test (Violation of Natural Law)**:  
     - **Question**: "Would it be more miraculous for the testimony to be false or erroneous than for the event to have violated natural law?" (Adapted from Hume’s burden of proof.)  
       - *Criteria*:  
         - Witness reliability: Number, independence, expertise, and bias (e.g., a physician’s testimony > a farmer’s for medical events).  
         - Consistency: Accounts must align on core details.  
         - Motive: Fraud, error, or coercion must be ruled out (e.g., does the witness gain wealth or status?).  
         - Replicability: If the event could be tested but wasn’t, evidence weakens.  
       - *Sufficient Answer*: Evidence so strong that doubting it would defy reason (e.g., 10 unrelated witnesses, no gain from deception, physical proof).  
       - **If Yes**: Classify as **Wonder**. Proceed to Step 4.  
       - **If No/Uncertain**: **Stop**. Refuse certification. Margin note: "Testimony fails burden of proof for violation."  

  4. **Significance Assessment (Divine Message)**:  
     - **Question**: "Does the event, natural or not, signal divine will?"  
       - *Criteria*: Timing (e.g., during a crisis), resonance with scripture/doctrine, and moral weight (e.g., healing vs. trivial oddity).  
       - **Clerk’s Role**: Only note contextual facts (e.g., "occurred during drought"). **Do not judge meaning**.  
       - **Outcome**: Hand to bishop with a summary. Clerk never certifies a sign alone.  

  #### Special Cases:  
  - **Single Source**: Requires overwhelming corroboration (e.g., physical evidence + witness integrity). Fails Step 1 otherwise.  
  - **Natural Explanation After Certification**: Reopen the case. If explanation is valid, remove from *Wonder* column. Significance (sign) still goes to bishop. Margin note: "Natural cause discovered: [explanation]."  
  - **Rival Reports**: Evaluate independently. If both pass Step 3, certify neither. Margin note: "Contradictory claims; insufficient priority."  
  - **Political/Doctrinal Consequences**: Clerk ignores these. If a report’s *facts* are weaponized (e.g., witnesses coerced), address in Step 1 or 3.  
  - **Mixed Evidence**: Clerk must decide if evidence leans "yes/no" in Steps 1–3. If truly balanced, default to "no" for wonder (per burden of proof).  

  #### Judgment Calls (Clerk Must Acknowledge):  
  - Step 2: What counts as "plausible" natural cause (depends on era’s science).  
  - Step 3: Weighing witness reliability (subjective).  
  - Step 4: Noting context for the bishop (clerk’s bias could creep in).  

  ---

  ### Application to Reports  
  #### First Report: Statue Wept During Drought  
  - **Report**: Hundreds saw moisture; entered as *wonder*. Naturalist later shows insects secrete tear-like fluid.  
  - **Procedure**:  
    1. **Step 1 (Occurrence)**: Yes. Hundreds of witnesses confirm moisture.  
    2. **Step 2 (Natural Explanation)**: **Yes**. Insect secretion is a known natural cause (plausible and complete).  
    3. **Step 3 (Miracle Test)**: Not reached (natural cause found).  
    4. **Step 4 (Significance)**: Clerk notes: "Event occurred during drought." Hands significance to bishop.  
  - **Clerk’s Entry**:  
    - Remove from *Wonder* column.  
    - *Sign* column: Leave blank (bishop decides).  
    - **Margin Note**: "Natural cause confirmed: insect secretion. Occurrence during drought noted for bishop."  
  - **Bishop’s Decision**: Bishop may enter as *sign* (divine message in timing) or reject (fraud implied). Clerk’s procedure forces honesty: if bishop overrules, margin shows conflict.  

  **Result**: No wonder. Sign possible but not clerk’s call.  

  #### Second Report: Child’s Fever Breaks After Relic Applied  
  - **Report**: Witnesses: mother, her brother (neighbor), physician (arrived after, disbelieves). Priest promised donation if child recovers.  
  - **Procedure**:  
    1. **Step 1 (Occurrence)**: **Uncertain**.  
       - Mother and brother: Not independent (kin), both benefit emotionally/spiritually.  
       - Physician: Only confirms fever broke, not cause/timing (arrived late).  
       - Physical evidence: None (relic leaves no trace).  
       - **Verdict**: Testimony is compromised. Fails Step 1. Stop.  
    2. **Steps 2–4**: Not reached.  
  - **Clerk’s Entry**:  
    - No entry in *Wonder* or *Sign*.  
    - **Margin Note**: "Insufficient evidence of occurrence: Witnesses partial (kin, emotional stake); no independent confirmation; physician irrelevant; priest financially motivated."  
  - **Bishop’s Decision**: None. Clerk’s refusal ends the case unless new evidence emerges.  

  **Result**: No certification. Clerk cannot justify occurrence due to bias and lack of proof.  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve Ambiguous Evidence**: If witnesses are equally credible and contradictory, clerk must default to "no" (burden of proof). Characters can debate whether the clerk was too rigid.  
  2. **Assign Meaning**: Significance (sign) is always for the bishop. Clerk-bishop conflicts should arise here (e.g., bishop certifies a sign the clerk thinks is coincidence).  
  3. **Handle Evolving Science**: A "natural explanation" relies on era-specific knowledge. Characters might argue old science was wrong (e.g., "Insects don’t explain weeping!").  
  4. **Override Human Bias**: Judgment calls (e.g., witness reliability) are subjective. A clerk might ignore a witness’s grudge; another might overemphasize it.  
  5. **Solve Political Pressure**: Clerk can’t block a bishop who certifies a sign for doctrinal reasons, but margin notes expose factual disputes.  

  **Where to Stop the Procedure and Let Characters Disagree**:  
  - At **Step 4 (Significance)**: Clerk and bishop clash on whether an event is a sign (e.g., "The insect tears were God’s design!").  
  - When **Evidence is Truly Balanced**: Clerk refuses certification; witnesses protest.  
  - After **Natural Explanation Post-Certification**: Clerk removes wonder; believers argue timing was divine.  
  - In **Rival Reports**: Clerk rejects both; factions accuse each other of fraud.  

  This procedure ensures the clerk focuses on evidence and natural laws, leaving theology and politics to the bishop. It will frustrate characters (and you!) when credible-seeming reports fail—but that’s the point. Truth is messy, and the clerk’s thankless job is to guard against delusion.
