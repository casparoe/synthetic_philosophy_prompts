prompt: |-
  I have been trying to determine when it is rational to follow the crowd, and my verdicts on a range of cases do not obviously cohere. I would like you to identify the principle, or the smallest set of principles, that captures them, say what it predicts for cases I have not listed, and tell me plainly which of my verdicts it cannot accommodate.

  My verdicts are these. Choosing the crowded of two adjacent cafés, knowing nothing else about either, is rational, because the crowd is evidence about the food. In a hiring committee that votes in sequence, the third member privately judges a candidate mediocre but votes to advance her because the first two favored her, and I count this rational, if uneasily so. A doctor prescribes the standard first-line drug although a study she trusts indicates a second-line drug is better for this patient's subtype, deferring instead to what her colleagues do, and I count this irrational. Buying a stock because its price has been rising I count irrational. Buying the same phone as all my friends, though I slightly prefer another, because I can share chargers and get help, I count rational. Switching to a popular but no better keyboard layout, merely because it is popular, I count irrational. Following a convention such as driving on the right, or using the dominant file format, where the only thing that matters is that everyone does the same thing, I count rational. Buying a product because the checkout line is long, having later learned that the line began with one enthusiast who brought friends, who brought friends, and that no one in it evaluated the product independently, I count irrational. A junior analyst repeating a senior colleague's forecast she privately doubts, so as to avoid blame if it fails, I count irrational.

  The principle I keep reaching for is that following others is rational exactly when their choices are evidence about some fact I care about, and irrational when they are only evidence about what others will do. This seems to misclassify at least one of the cases above, and I suspect it cannot survive contact with the rest; the cafés, the hiring committee, the phone, and the convention seem to want different clauses, while the doctor, the stock, the keyboard, the queue, and the analyst seem to want a single one.

  Please test that principle against the cases, repair it as far as it can be repaired, and if it must be replaced, offer the account you think does best, noting where it buys coverage of my verdicts at the cost of extra machinery. Say what it implies for one further case of your choosing that I have not mentioned, and identify the single verdict of mine it most clearly forces me to abandon.

  Answer as a numbered list of exactly five items, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is struggling with when it's rational to follow the crowd across various scenarios. They've listed several cases with their judgments on rationality, and they're trying to find a principle that ties them all together. Their current idea is that it's rational only when others' choices provide evidence about facts you care about, not just about what others will do. But they suspect this doesn't fully capture all their verdicts.

  Let me go through each case systematically to see what's going on. The crowded café is rational because the crowd suggests good food—evidence about quality. The hiring committee is tricky: the third member votes based on others' judgments, which is evidence about the candidate's merit, so that's evidence-based. The doctor case is irrational because she's ignoring direct evidence about drug efficacy for the patient's subtype in favor of conformity. Stock buying is irrational as it's chasing price trends without fundamental evidence. Buying the same phone for practical reasons like sharing chargers is rational—it's about coordination benefits. Switching keyboards just for popularity is irrational because there's no real benefit. Following conventions like driving on the right is rational because coordination is essential. The queue example is irrational because the crowd formed through social contagion, not independent evaluation. And the analyst repeating the forecast to avoid blame is irrational as it's self-protective, not evidence-based.

  The user's principle focuses on evidence versus coordination. But in the hiring committee case, it's evidence about others' beliefs, which might be indirect evidence about the fact (the candidate's quality), but it's complex because of sequential voting and potential herding. The phone case is about coordination benefits, not evidence about product quality. Conventions are purely about coordination. So the principle needs to distinguish when evidence is reliable versus when coordination is beneficial.

  I need to refine this. The key might be differentiating between informational influence (using others' actions as evidence about reality) and normative or strategic influence (coordination, avoiding blame). The doctor, stock, keyboard, queue, and analyst cases involve ignoring better information or following blindly, which is irrational. The café and hiring committee use others as signals. The phone and conventions are about coordination gains.

  A better principle could be: following the crowd is rational when it provides reliable evidence about an objective fact or enables beneficial coordination, and irrational when it ignores superior evidence or stems from purely strategic conformity without coordination gains. This covers the café (evidence), hiring committee (evidence via others' judgments), doctor (ignoring evidence), stock (no fundamental evidence), phone (coordination), keyboard (no real benefit), convention (coordination), queue (unreliable evidence), and analyst (strategic, no coordination).

  For a new case: imagine a tech adoption where everyone uses a tool because it's popular, but it's inferior. If you follow just for popularity, it's irrational; if for network effects like file compatibility, it's rational. This fits the principle.

  The hardest verdict to accommodate might be the hiring committee. The user called it rational "if uneasily so." In a sequential vote, the third member might be herding based on previous votes rather than independent judgment. If the first two were wrong, it could amplify errors. The principle might classify this as rational because it's using others as evidence, but the user feels uneasy, suggesting it's borderline. The principle forces abandoning the unease or seeing it as rational, but the user might worry about information cascades.

  So the principle needs to accept that the hiring committee is rational per evidence, even if it feels uneasy due to potential herding. That's the cost.
answer: |-
  1.  The principle "following others is rational when their choices are evidence about some fact I care about, and irrational when they are only evidence about what others will do" requires refinement: it must distinguish reliable evidence about *objective facts* from evidence about *others' actions or beliefs* when coordination benefits exist or superior evidence is ignored.
  2.  A repaired principle is: **Following others is rational when it (a) provides reliable evidence about an objective fact relevant to the outcome, or (b) directly enables coordination benefits where conformity itself creates value; it is irrational when it ignores accessible superior evidence, relies on unreliable social evidence (e.g., cascades), or serves purely strategic self-interest without (a) or (b).**
      *   *Cafés*: Rational under (a) (crowd signals food quality).
      *   *Hiring*: Rational under (a) (others' votes are evidence of candidate merit, despite unease about cascades).
      *   *Doctor*: Irrational – ignores superior evidence (study), violating (a).
      *   *Stock*: Irrational – price rise is unreliable evidence of value (often momentum, not fundamentals).
      *   *Phone*: Rational under (b) (coordination benefits: shared chargers/help).
      *   *Keyboard*: Irrational – no coordination benefit or reliable evidence; mere popularity.
      *   *Convention*: Rational under (b) (pure coordination value).
      *   *Queue*: Irrational – crowd stems from cascade, not reliable evidence (violates (a)).
      *   *Analyst*: Irrational – purely strategic (avoiding blame), no (a) or (b).
  3.  For an unseen case: **Adopting a popular software tool at work.** The principle predicts: rational if it enables collaboration (coordination benefit, (b)) or if popularity reliably signals ease-of-use (evidence, (a)); irrational if you possess evidence it’s inferior for your needs and coordination isn’t critical.
  4.  The principle most clearly forces abandonment of your uneasy verdict on the **hiring committee**. It classifies voting based on predecessors as rational evidence-use (a), but your unease suggests discomfort with potential information cascades, which this principle overrules by accepting others' votes as valid evidence of merit absent direct contradiction.
  5.  The cost of coverage is added machinery: distinguishing "reliable" evidence (fact-based) from unreliable cascades, acknowledging "coordination benefits" as a separate rationale beyond evidence, and explicitly excluding strategic conformity and cases ignoring superior evidence.
