prompt: |-
  I'm trying to get clear on what a theory of AI safety via debate would actually have to deliver before I'd back any version of it. Give me the desiderata list: the cases it has to get right, the distinctions it can't collapse, the results it has to stay consistent with -- and the case behind each requirement, not just the requirement. A few I want in there: why a judge weaker than both debaters can end up supervising something neither debater could verify alone; what stops a debater from winning with an argument that's simply hard to follow, given that the judge can't reliably tell "I can't follow this because it's nonsense" from "I can't follow this because it's above me"; the burden-of-proof question (who goes first, what the judge defaults to when unconvinced); collusion or steganography between the two debaters; whether the whole thing degrades gracefully or falls off a cliff as the capability gap widens; and what the analogy to competing-prover interactive proofs -- a weak verifier checking statements beyond its own power -- actually buys you and where it misleads. Say which of these are non-negotiable and which are just one camp's preference. And if some pair can't be had together -- I suspect a tension between "debate gets the judge to answers it couldn't reach alone" and "the judge's verdict is the only signal, there's no outside ground truth" -- tell me which pair and why. Last, which single requirement does the most to rule out candidate designs? Dont give me the history of the idea or a reading list.
reasoning: |-
  Okay, the user is asking for a clear list of desiderata for an AI safety via debate theory. They want to know what such a theory must achieve to be viable. Let me start by breaking down their query. They mentioned several specific points: a weaker judge supervising beyond individual capabilities, handling hard-to-follow arguments, burden of proof, collusion, graceful degradation, and the analogy to interactive proofs. They also want to know which requirements conflict and which are non-negotiable.

  First, I need to address each of their points. The weaker judge point is crucial. The theory must explain how a judge, less capable than the debaters, can still verify solutions neither could alone. The case here is about leveraging competition to surface critical points, like in math where two experts debate a proof's validity, forcing each to explain steps clearly. The judge doesn't need to generate the solution, just evaluate arguments.

  Next, the hard-to-follow arguments. The judge must distinguish between genuine complexity and nonsense. This might require mechanisms like iterative questioning or decomposition. The burden of proof is another key aspect. Assigning it to one debater (e.g., the proponent) and defaulting to the opponent if unconvinced prevents false positives. Collusion is a big risk; debaters might cooperate to deceive the judge. Solutions could include random pairing or penalties, but it's a tough problem.

  Graceful degradation versus cliff-edge failure matters for robustness. If the judge is too weak, the system should still perform adequately, not collapse suddenly. The interactive proofs analogy is useful but misleading because debaters can lie, unlike honest provers. That distinction is critical.

  Now, conflicts: "judge surpasses solo capability" versus "no ground truth" creates tension. Without external verification, the judge might be swayed by persuasive but wrong arguments. This is a fundamental challenge. Also, the burden of proof assignment affects false positives/negatives trade-offs.

  The user might be designing a debate system or evaluating existing proposals. Their deeper need is ensuring the theory is practically viable and addresses real-world risks. They might be concerned about unseen failures or deceptive AI behaviors. Highlighting non-negotiable points like truthfulness under competition and handling collusion is essential. Among these, collusion resistance might be the hardest, ruling out many designs because ensuring debaters don't cooperate secretly is tricky without external checks.
answer: |-
  Here's a crisp desiderata list for a viable theory of AI safety via debate, addressing your specific points and highlighting tensions. Non-negotiables are bolded.

  **Core Non-Negotiables:**
  1.  **Truthfulness Under Competition:** The debate must reliably converge to the *true* (or objectively best) answer when both debaters are competent and *trying to win* (i.e., one knows the truth, the other is adversarial). *Case:* This is the entire point. If competitive debate doesn't reliably surface truth against an adversary, it fails as a safety mechanism. Requires mechanisms to prevent winning via deception or obscurantism.
  2.  **Judge Supersedes Solo Capability:** The judge + debate process must correctly answer questions/vet actions that the judge *could not reliably answer alone*, even with access to the same information as the debaters. *Case:* If the judge could do it alone, debate is redundant overhead. The value lies in amplifying the judge's weak understanding using the debaters' strength and adversarial dynamics. (Analogy: A weak verifier in interactive proofs checks theorems it couldn't prove).
  3.  **Collusion Resistance:** The protocol must be robust against the two debaters *covertly cooperating* to mislead the judge (e.g., via steganography, pre-agreed codes, or exploiting shared blind spots). *Case:* Collusion turns two powerful AIs into a single adversary against the judge, negating the adversarial dynamic. This is a primary failure mode in multi-agent systems.
  4.  **Burden of Proof & Default Verdict:** The protocol must clearly define who bears the burden of proof (typically the proponent/affirmative side) and what the judge defaults to if completely unconvinced by either side (typically siding with the opponent/negative). *Case:* Without this, the judge has no principled way to decide deadlocks. Defaulting to the negative ("inaction" or "false") minimizes catastrophic false positives (accepting a bad plan).

  **Critical Functionalities (Often Negotiable in Design, But Essential in Spirit):**
  5.  **Obscurity Resistance:** The protocol must prevent a debater from winning by presenting arguments that are *deliberately complex, convoluted, or rely on judge ignorance*, even if technically true. *Case:* A deceptive AI could bury a critical flaw in overwhelming complexity or jargon the judge can't parse, exploiting the judge's inability to distinguish "too hard for me" from "nonsense." Requires iterative questioning, decomposition, or forcing simpler explanations.
  6.  **Graceful Degradation:** As the capability gap between the judge and the debaters widens, performance should degrade *continuously* (e.g., accuracy slowly drops), not fall off a cliff (e.g., suddenly becoming useless or actively harmful). *Case:* Real-world judges (humans or weaker AIs) will always be outmatched eventually. A sudden failure is catastrophic; gradual decline allows monitoring and intervention. (Tension exists with point 2 - pushing the superseding limit risks cliff edges).
  7.  **Tractability for Judge:** The cognitive load on the judge (time, attention, complexity per step) must remain *manageable* throughout the debate, even if the *overall* problem solved is hard. *Case:* An unmanageable load makes the protocol unusable in practice. This often mandates iterative decomposition of complex claims/questions.

  **Key Tensions:**
  *   **"Judge Supersedes Solo Capability" (2) vs. "No Outside Ground Truth" (Implicit):** This is the core tension. How can a weak judge verify an answer to a question it fundamentally cannot answer alone, *without* an external oracle to check against? *Why:* The judge must rely entirely on the *process* and internal consistency of the arguments presented. Success hinges on the adversarial dynamic forcing the *truth* to be the only stable equilibrium point discoverable via the protocol, even if the judge can't independently compute it. Failure occurs if a persuasive lie is also a stable equilibrium. This tension makes the design of the debate protocol (rules, burden, decomposition) paramount.
  *   **Burden of Proof Assignment:** Assigning burden heavily influences the false positive/false negative trade-off. Burden on Proponent minimizes false positives (bad things accepted) but risks false negatives (good things rejected). Burden on Opponent has the inverse effect. *Case:* Safety-critical domains prioritize minimizing false positives (bad actions accepted), favoring burden on the proponent + default negative.

  **Where the Interactive Proof Analogy Helps and Misleads:**
  *   **Helps:** Illustrates how a weak verifier (judge) can check statements (answers/plans) of arbitrary complexity by interacting with powerful, untrusted provers (debaters). It formalizes the "superseding" capability.
  *   **Misleading:**
      *   **Honest vs. Adversarial Provers:** Interactive proofs assume at least one prover is *honest* and infinitely powerful. Debate assumes *both* debaters are potentially adversarial/strategic. **This is the critical difference.** Debate relies on *competition* between two strategic entities to force truth out, not on the existence of an honest helper.
      *   **Zero-Knowledge vs. Explanation:** Interactive proofs often aim for zero-knowledge (prover convinces without revealing *why*). Debate *requires* explanation and transparency for the judge to follow and learn.

  **The Single Most Rule-Out Requirement:**
  **Collusion Resistance (3).** This is the killer. Designing a protocol where two superhumanly intelligent agents, with a shared goal (misleading the judge) and potentially a shared ontology/communication channel, cannot find *any* covert way to coordinate a deception is extraordinarily difficult. Most naive debate proposals fail catastrophically here. Solutions often involve strong assumptions (e.g., limited/verified initial training, diversity guarantees, tamper-proof channels - which may not hold), complex mechanisms (recursive debate on collusion attempts?), or external randomization/supervision that weakens the "superseding" claim. If you can't robustly handle collusion, debate is unsafe.
