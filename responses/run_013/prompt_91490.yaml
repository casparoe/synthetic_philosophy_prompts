     - We'll show why both are wrong and how to find the sweet spot.

  2. **The Setup: A Simple Bet (5 minutes):**
     - Introduce a simple betting scenario: a biased coin that comes up heads with probability p (p>0.5) and tails with probability q=1-p.
     - The bet: You can bet any fraction f of your current bankroll. If heads, you win: your bankroll becomes (1 + f) times current. If tails, you lose: your bankroll becomes (1 - f) times current.
     - We are going to consider multiple bets, one after another, and we want to maximize the long-term growth of our bankroll.

  3. **Why Not Maximize Expected Value (EV)? (5 minutes):**
     - Show that if we only look at one bet, the expected value of the bankroll after the bet is maximized by betting the entire bankroll (f=1).
       - After one bet: EV = p*(1+f) + (1-p)*(1-f) = 1 + f*(2p-1). Since p>0.5, this is increasing in f. So to maximize EV, bet everything.
     - But what happens if we bet everything? We go broke on the first tail. We lose all future opportunities. So we need to think beyond one bet.

  4. **The Long Run: Multiplying Wealth Over Time (10 minutes):**
     - Consider two bets: After two bets, our bankroll is:
          - If two heads: (1+f)^2
          - If head then tail: (1+f)(1-f) = 1 - f^2
          - If tail then head: same as above
          - If two tails: (1-f)^2
     - Notice that the order doesn't matter? Actually, the multiplicative effect: the bankroll multiplies by (1+f) for each win and (1-f) for each loss. So after n bets, if we have k wins and n-k losses, the bankroll is:
