  ### **Summary**  
  1. Hook with billion-double dilemma.  
  2. Trap EV-maximizer.  
  3. Show compounding’s brutality.  
  4. Derive logs → growth rate.  
  5. Maximize $G(f)$ → Kelly.  
  6. Asymmetric payoff example.  
  7. Murder misconceptions in order.  

  **End strong:** *"Kelly isn’t about fear or greed. It’s the math of survival in a multiplicative world."*
