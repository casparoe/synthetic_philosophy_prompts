answer: |-
  ### **Lunch-and-Learn Plan: The Kelly Criterion**  
  **Goal:** Derive Kelly naturally, kill misconceptions, and make "expected value vs. real-world growth" visceral.  
  **Time:** 40 minutes. **Tools:** Whiteboard, marker.  
  **Audience:** 15 engineers (2 sports bettors, 1 EV-maximizer).  

  ---

  ### **Sequence & Why This Order**  
  **Why this order?** Build intuition → reveal the problem with EV → derive Kelly as the *necessary solution* to compounding. No formulas until the math feels inevitable.  

  #### **1. Hook: The Billion-Double Dilemma (3 min)**  
  - **Setup:**  
    - "You get to place 100 sequential bets. Start with $1000. Each bet: 60% win chance, double your money (win +100%), or lose the bet (-100%)."  
    - **Ask:** *"How much of your bankroll do you bet each time? Show of hands: all-in? Half? 10%?"*  
  - **Why:** Forces them to confront overconfidence (EV-maximizer) vs. fear (sports bettors). No math yet—pure intuition.  

  #### **2. Trap the EV-Maximizer (5 min)**  
  - **The EV Argument:**  
    - Single bet: EV = (0.6 × 2f) + (0.4 × 0) = 1.2f. *"Betting more = more EV!"*  
    - Bet everything: 40% chance of $0 after one bet. **"Game over."**  
  - **The Catch:**  
    - *"But you have 99 bets left! If you go broke, you miss future opportunities. EV ignores sequence risk."*  
  - **Why now:** Isolates the flaw in EV early. Sets up the need for a new framework.  

  #### **3. The Real Enemy: Compounding Variance (7 min)**  
  - **Simulate 2 Bets** (Whiteboard):  
    - Bet 100% twice:  
      - Win/Win: $1000 → $2000 → $4000  
      - Win/Lose: $2000 → $0  
      - *Expected wealth* = $1600, but **60% chance of $0**!  
    - Bet 20% twice:  
      - Win/Win: $1000 → $1200 → $1440  
      - Win/Lose: $1200 → $960  
      - *No ruin, but is this optimal?*  
  - **Key Insight:**  
    - *"Wealth compounds multiplicatively. One big loss destroys your base for future growth. We need to maximize long-run growth, not one-shot EV."*  
  - **Why now:** Makes compounding visceral. Prepares for log transform.  

  #### **4. The Leap: Why Logs? (The "Nod Then Lost" Moment) (8 min)**  
  - **The Jump:** *"How do we model growth across many bets?"* → **Geometric mean.**  
  - **Derive Logs Naturally:**  
    - After *n* bets, wealth = $W_0 × (1+f)^\text{wins} × (1-f)^\text{losses}$  
    - Growth rate per bet = $\frac{1}{n} \log(\text{wealth}_n / W_0) = \frac{\text{wins}}{n} \log(1+f) + \frac{\text{losses}}{n} \log(1-f)$  
    - *Law of Large Numbers:* As *n* → ∞, $\frac{\text{wins}}{n} → p$, so:  
      **Growth rate $G(f) = p \log(1+f) + (1-p) \log(1-f)$**  
  - **Why this is the jump:**  
    - Engineers will nod at LLN and logs as "math tricks." **Lost moment:** *"Why logs? Why not just compute average wealth?"*  
    - **Pivot hard:** *"Because the average of $10, $0, and $0 is $3.33, but if you live it, you have $0! Logs encode the reality of compounding."*  

  #### **5. Maximize Growth: Derive Kelly (7 min)**  
  - **Maximize $G(f)$:**  
    - Calculus: $\frac{dG}{df} = \frac{p}{1+f} - \frac{1-p}{1-f} = 0$  
    - Solve: $p(1-f) = (1-p)(1+f)$ → $f^* = 2p - 1$  
    - For *p=0.6*, **f=20%** (not 100% or 10%!).  
  - **Show Asymmetry:**  
    - Graph $G(f)$ on whiteboard:  
      - Peaks at *f=0.2*.  
      - Falls slowly if under-bet (f=0.1 → 98% of max growth).  
      - Plummets if over-bet (f=0.4 → negative growth!).  
  - **Why now:** Formula feels earned. The asymmetry kills "bet small is safe" and "EV is king."  

  #### **6. Non-Coin Example: Unfair Dice (5 min)**  
  - **Why not coin flip?** Too cliché. Use asymmetric payoffs.  
  - **Setup:**  
    - Roll a die. 50% chance: win 50% of bet. 50% chance: lose 40% of bet.  
    - Edge: EV = (0.5 × 0.5) + (0.5 × -0.4) = +0.05 (positive!).  
  - **Carries the whole thing because:**  
    - Forces them to think beyond *p*: growth rate $G(f) = 0.5 \log(1+0.5f) + 0.5 \log(1-0.4f)$  
    - Maximize: $f^* = \frac{0.5 \cdot 0.5 - 0.5 \cdot 0.4}{0.5 \cdot 0.4} = 12.5\%$ (not 100%!).  
    - **Leaves out:** Portfolio theory (keep it single-bet).  
  - **Why better than coin:**  
    - Proves Kelly works for non-binary outcomes.  
    - Shows edge ≠ max bet.  

  ---

  ### **Slay Misconceptions in Real Time**  
  1. **"Bet small = safe" (Sports Bettor #1):**  
     - **When:** During the 20% vs. 100% simulation.  
     - **Head off:** *"Under-betting survives, but grows slower. Kelly is 20%—why leave 80% of growth on the table?"*  

  2. **"EV = free money" (EV-Maximizer):**  
     - **When:** During the EV trap.  
     - **Head off:** *"EV is linear, wealth is multiplicative. 100% bet wins 1.2× EV but has 40% chance of $0—you can’t compound zero."*  

  3. **"Over-betting is fine if edge is big":**  
     - **When:** After deriving $f^*$.  
     - **Head off:** Show $G(f)$ asymmetry: *"Betting 40% (2× Kelly) destroys growth. Betting 10% (½ Kelly) only costs 2% growth. Over-betting is suicidal."*  

  4. **"Parallel universes vs. one reality" (Walkout Error):**  
     - **When:** After the log derivation.  
     - **Head off:** *"In a parallel universe, average wealth = $W_0 e^{n \cdot \text{EV}}$. In your universe, wealth = $W_0 e^{n \cdot G(f)}$. Variance drag kills you if $G(f) < \text{EV}$."*  
     - **Make visceral:** *"Would you take a bet with 99% chance to 100× your money, 1% to lose it all? EV says yes. Kelly says no—it risks everything you’ve built."*  

  ---

  ### **"Geometric Rationality" Framing**  
  - **Use it!** Say: *"Kelly is geometric rationality: optimizing for the geometric mean of growth. EV is arithmetic rationality—it ignores compounding."*  
  - **Why it works:** Engineers respect geometric means (e.g., CPU performance). Nods to the one who name-dropped it.  

  ---

  ### **Deliberate Omissions**  
  1. **Fractional Kelly** (e.g., "half-Kelly for less risk").  
  2. **Multiple simultaneous bets** (portfolio optimization).  
  3. **Real-world frictions** (taxes, liquidity).  
  **Why:** Adds complexity. At 40 min, focus on core insight.  

  ---

  ### **Check Understanding: The Final Question**  
  - **"You find a stock: 70% chance +30%, 30% chance -20%. What fraction *f* of your bankroll do you invest? Why not 100%?"**  
    - *Answer:*  
      - $G(f) = 0.7 \log(1+0.3f) + 0.3 \log(1-0.2f)$  
      - Max at $f^* \approx 70\%$ (solve $\frac{0.7 \cdot 0.3}{1+0.3f} = \frac{0.3 \cdot 0.2}{1-0.2f}$).  
      - Betting 100%: 30% chance of ruin → $G(1) < 0$ (negative growth).  
  - **Why this question:**  
    - Tests if they can set up $G(f)$ (not memorize).  
    - Confirms they grasp over-betting risk.  

