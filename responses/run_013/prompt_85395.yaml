prompt: |-
  I run a small theory group inside a lab that has bet heavily on debate-style oversight: two AI systems argue a question before a weaker judge, and the judge's verdict is supposed to be more trustworthy than the judge's own unaided judgment. I have three researchers, two years, and no capacity to run training experiments. Our funders want to know whether this line is worth continuing at all, and what would have to be true for it to succeed. Please give me a defended research agenda: the four to six open questions about the limits of debate-based oversight that most deserve a theorist's next two years, ranked, with the ranking justified by explicit criteria — which questions are upstream of which, which are answerable with conceptual tools rather than experiments, which are neglected, and what result would move each up or down the list.

  Two diagnoses of the difficulty have been competing inside my group, and I want your verdict on them folded into the ranking. The first is obfuscation: a dishonest debater can construct a case whose flaw exists and is in principle findable, but whose discovery costs more than the judge's budget allows, so the honest side loses by exhaustion rather than by being wrong. The second is underdetermination: for a large share of the questions we actually care about — what a user really wanted, whether an action is harmful, whether a model's stated reason is its real reason — there may be no fact of the matter that any judge could use to settle the dispute, however strong it is or however long it deliberates; interaction can amplify verification only where verification is possible in principle. My suspicion is that the field has been treating the second as a hard case of the first, and that the standard remedies — a stronger judge, a longer exchange, cross-examination, tool use by the debaters — address only the first. Tell me whether that diagnosis holds, and whether it should change what gets worked on first. If you think a third diagnosis is the real crux — say, that the guarantee is only ever relative to a judge that is itself a fallible model, so the hard question is whether any fixed point escapes that regress — place it in the ranking rather than substituting it for an argument.

  Assume I know the standard positions; I want an agenda, not a survey, and not a reading list. Include, at the end, the work that looks important but that a group with our constraints should deliberately not touch, and say which of your top questions you expect to be dissolved by a single good argument rather than settled by accumulated work.

  Lead with your bottom line in the first sentence — the one question you would put first — then give the reasoning. No preamble, and don't restate my question.
reasoning: |-
  We are given: a small theory group with 3 researchers, 2 years, no training experiments. Focus on debate-style oversight. The funders want to know if it's worth continuing and what must be true for success.

  The two competing diagnoses:
  1. Obfuscation: dishonest debater creates a case with a flaw that is in principle findable but too expensive for the judge's budget, so honest side loses by exhaustion.
  2. Underdetermination: for many important questions, there is no fact of the matter that the judge could use to settle the dispute, even with unlimited resources.

  The suspicion: the field treats underdetermination as a hard case of obfuscation, and standard remedies (stronger judge, longer exchange, etc.) only address obfuscation.

  We are to provide a defended research agenda: 4-6 open questions about the limits of debate-based oversight, ranked, with ranking justified by criteria: upstream/downstream, answerable with conceptual tools, neglected, and what result would move the question up or down.

  Also, fold in a verdict on the two diagnoses and whether a third (like a regress problem) is the real crux.

  Bottom line first: the top-ranked question.

  After ranking, include what important work should be avoided given constraints, and which top question might be dissolved by a single good argument.

  ---

  **Bottom line:** The first question to address is **whether underdetermination is a fundamental and widespread limitation for debate in the context of the questions we care about, and if so, what that implies for the viability of debate.**

  ### Ranking Criteria:
  1. **Upstream/downstream**: Questions that are more foundational and whose answers affect the relevance of other questions are upstream and should be prioritized.
  2. **Conceptual tractability**: Questions that can be addressed with theoretical tools (math, logic, philosophy) rather than experiments are preferred given the constraints.
  3. **Neglected**: Questions that have received less attention in the field but are critical.
  4. **Impact of resolution**: How much the answer would change the trajectory of the field or the group's work.

  ### The Ranking of Open Questions:

  1. **The Scope and Severity of Underdetermination in Practice**  
     - **Why first?** It is the most upstream and foundational. If underdetermination is widespread and insurmountable, then debate might be fundamentally limited for key applications, making much of the other work (on obfuscation) irrelevant. This is also neglected because the field has focused on obfuscation. Moreover, it is highly tractable with conceptual tools: we can analyze the nature of the questions (e.g., value questions, intent, harm) and the possibility of ground truth.  
     - **What would move it?** A proof that underdetermination is rare in practice (e.g., by showing that human values or intentions can be grounded in observable evidence) would move it down. Conversely, evidence that it is pervasive (e.g., via philosophical argument or formal analysis of ambiguity) would move it up and might even halt the line.

  2. **The Regress Problem: Can Debate Converge to a Fixed Point?**  
     - **Why second?** Even if underdetermination is not the primary issue, the core mechanism of debate relies on a judge that is itself a fallible AI. We must ask whether there exists a fixed point: a judge of a given capability for which the debate improves upon that judge's unaided performance. This is upstream of obfuscation because without a fixed point, the entire setup may be unstable. It is also conceptually tractable (e.g., using fixed-point theorems or complexity arguments) and somewhat neglected.  
     - **What would move it?** A positive result (e.g., a theoretical model showing convergence under certain assumptions) would move it down and boost the field. A negative result (e.g., proving that no fixed point exists for a broad class of judges) would move it up and challenge the foundation.

  3. **The Obfuscation Problem: Can We Bound the Cost of Verification?**  
     - **Why third?** If underdetermination is not fatal and a fixed point exists, then we must address obfuscation. This is downstream of the first two but still critical. It asks: even with a fact of the matter, can we ensure that the cost of finding the truth is within the judge's budget? This is more tractable with conceptual tools (e.g., computational complexity, game theory) and has received more attention, but there are open theoretical questions.  
     - **What would move it?** A proof that for a class of problems, the cost of verification in debate is bounded (e.g., by the problem's Kolmogorov complexity) would move it down. A proof that obfuscation can always force the cost to exceed any fixed budget (e.g., by reduction to a hard problem) would move it up and require new mechanisms.

  4. **The Role of Debate Dynamics and Protocols**  
     - **Why fourth?** Assuming the above are resolved positively, we must design the debate protocol to minimize obfuscation and handle underdetermination where possible. This includes cross-examination, tool use, and incentives. It is downstream and more applied, but still amenable to theoretical modeling (e.g., game theory, mechanism design).  
     - **What would move it?** A breakthrough in protocol design (e.g., a protocol that provably bounds the lying advantage) would move it down. Evidence that no protocol can overcome obfuscation without exponential resources would move it up.

  5. **Generalization and Scalability to Real-World Complexity**  
     - **Why fifth?** Even if debate works in theory for simple cases, we must understand how it scales to complex, open-ended questions. This is more speculative and might require empirical work, but theory can address aspects (e.g., compositionality, abstraction).  
     - **What would move it?** A formalization of how debate might compose for complex tasks (e.g., via recursive debates) would move it down. A proof that debate cannot scale without a combinatorial explosion would move it up.

  6. **The Relationship to Other Oversight Methods**  
     - **Why sixth?** To position debate in the broader landscape: when is it superior to alternatives (e.g., amplification, SFT, RLHF)? This is downstream and might be addressed by comparing theoretical properties.  
     - **What would move it?** A theorem showing debate dominates other methods under certain conditions would move it down. Evidence that it is strictly inferior would move it up.

  ### Verdict on the Diagnoses:
  - **Obfuscation vs. Underdetermination**: Your suspicion holds. Underdetermination is a distinct and more fundamental problem. Standard remedies (stronger judge, longer debate) do not address underdetermination because if there is no fact of the matter, more computation won't help. Therefore, underdetermination must be addressed first. The field's conflation of the two has led to misplaced focus. 
  - **Third Diagnosis (Regress)**: This is critical and placed as question 2. Without a fixed point, debate might not even bootstrap. It is a separate issue from underdetermination and obfuscation.

  ### What to Avoid:
  Given no capacity for training experiments, avoid:
  - Empirical studies of debate performance on specific tasks (e.g., with existing models).
  - Training new models to test debate.
  - Hyperparameter tuning for debate protocols.

  Instead, focus on theoretical models and proofs.

  ### Which Question Might Be Dissolved by a Single Argument?
  The top question (underdetermination) might be dissolved by a single good argument: for example, a proof that underdetermination can be circumvented by redefining the debate question to be about observable evidence (e.g., "what did the user's instructions imply in context?" instead of "what did the user really want?") and that such a redefinition covers the necessary cases. Conversely, a single argument (e.g., a compelling counterexample in value alignment) might show that underdetermination is unavoidable and fatal, halting the line.

  ### Final Agenda:
  1. Underdetermination: scope and severity.
  2. Regress problem: fixed point existence.
  3. Obfuscation: cost bounding.
  4. Debate protocols and dynamics.
  5. Scalability to complexity.
  6. Comparison to alternatives.

  This agenda addresses the most critical unknowns with the available tools, in order of foundational importance.
answer: |-
  **The underdetermination problem must be addressed first: is debate inherently limited when no fact of the matter exists for key questions (e.g., intent or harm), and what does this imply for feasibility?**  

  ### Ranking Criteria  
  - **Upstream/downstream**: Prioritize questions that constrain or enable downstream work. An upstream "no" can invalidate entire directions.  
  - **Conceptual tractability**: Favor questions answerable with theory (math, logic, philosophy) over experiments.  
  - **Neglected**: Emphasize underexplored gaps where progress would be novel.  
  - **Impact of resolution**: Rank higher if a clear answer would pivot the field (e.g., abandon debate) or unlock new work.  
  - **Movability**: State what result would move a question up (e.g., negative answer increases urgency) or down (e.g., positive answer reduces risk).  

  ### Ranked Research Agenda  
  1. **Is underdetermination fatal for debate on value-laden or ambiguous questions?**  
     - **Why first?** Most upstream and neglected. If underdetermination is pervasive (e.g., for "true intent" or "harm"), debate fails regardless of other fixes, making obfuscation irrelevant. Standard remedies (e.g., stronger judges) assume a fact exists but is hidden—this doesn't apply if no fact is possible. Tractability: Analyze philosophy of mind (e.g., Dennett's intentional stance) and formalize "unverifiable questions" using computational irreducibility. Neglected because field conflates this with obfuscation.  
     - **Move if**: Proof that all key questions can be redefined as verifiable (e.g., "harm" operationalized via physical evidence) moves it down. Proof of pervasive underdetermination (e.g., in 80% of alignment-critical cases) moves it up and could kill the line.  

  2. **Can debate achieve a non-regressive fixed point where iterative improvement converges?**  
     - **Why second?** Upstream of obfuscation and judge strength. Debate assumes a weak judge can assess debates between stronger AIs, but if each "stronger" tier inherits judge fallibilities, regression may prevent gains. Tractability: Model judges as complexity-bounded agents; use fixed-point theorems to test convergence. Neglected as field assumes scaling solves regress.  
     - **Move if**: A convergence proof for a broad judge class (e.g., bounded agents with debate as a fixed point) moves it down. A no-go theorem (e.g., regress dominates for any polynomial-time judge) moves it up.  

  3. **Does obfuscation admit theoretical bounds on verification cost?**  
     - **Why third?** Downstream of underdetermination—only matters if facts exist. Addresses your first diagnosis: can dishonest arguments be defeated within judge limits? Tractability: Apply computational complexity (e.g., reductions from PSPACE-hard problems) or information theory (e.g., minimum evidence for verification). Less neglected, but open on tight bounds.  
     - **Move if**: A bound showing debate costs scale polynomially with problem size (e.g., for NP-complete truths) moves it down. Proof that costs are exponential in worst-case moves it up.  

  4. **What debate protocols minimize vulnerability to obfuscation and underdetermination?**  
     - **Why fourth?** Downstream of #1–3. If #1–3 are survivable, design matters. Focus on theory-friendly mechanisms (e.g., game-theoretic incentives for truth-telling). Tractability: Extend existing models (e.g., logical induction) to adversarial dynamics.  
     - **Move if**: A protocol provably robust to both obfuscation and underdetermination (e.g., forcing ambiguity acknowledgment) moves it down. Impossibility proofs for popular protocols (e.g., cross-examination fails on intent questions) move it up.  

  5. **How does debate perform on composite tasks versus alternatives (e.g., amplification)?**  
     - **Why fifth?** Downstream and comparative. If debate survives #1–4, assess efficiency. Tractability: Theoretically bound competitiveness (e.g., debate vs. amplification sample complexity).  
     - **Move if**: Proof that debate dominates alternatives on scalability (e.g., logarithmic judge effort) moves it down. Evidence of fundamental inefficiency moves it up.  

  6. **Can debate elicit latent knowledge from models better than direct elicitation?**  
     - **Why sixth?** Least upstream; assumes debate is viable. Tests a key motivation. Tractability: Use Bayesian truth serum models or simulate hidden knowledge recovery.  
     - **Move if**: A model showing debate always dominates unaided judges for knowledge elicitation moves it down. A counterexample showing no consistent gain moves it up.  

  ### Verdict on Diagnoses  
  - Your diagnosis **holds**: Underdetermination is distinct and more fundamental than obfuscation. Standard remedies (e.g., stronger judges) address only obfuscation by assuming hidden facts exist. Treating underdetermination as "hard obfuscation" is a category error—it confuses *costly verification* with *impossible verification*.  
  - **Regress is critical but not primary**: It is the second question because underdetermination could kill debate even if regress is solvable (e.g., with a fixed-point judge). Conversely, solving regress without solving underdetermination leaves debate vulnerable.  

  ### Work to Avoid  
  - **Avoid empirical work**: No training/running experiments (e.g., testing debate on LLMs).  
  - **Avoid incremental protocol tweaks**: No optimizing cross-examination rules; this is premature if #1–2 fail.  
  - **Avoid scalability experiments**: No "debate depth" studies; theory (#5) suffices.  

  ### Dissolvable Question  
  - **#1 (Underdetermination)** could be dissolved by a single argument: e.g., a proof that all ambiguous questions reduce to verifiable subquestions (e.g., "intent" is measurable via user behavior traces). Conversely, a single counterexample (e.g., irreducible moral disagreement) could settle it negatively.
