  Photography: I argue it's a subset of perception (recorded) and testimony (photographer's context). Score it at 0.75, below testimony but above inference? No, it's dependent on human input, so maybe slot it under testimony. Explain that while the machine lacks memory bias, the setup and interpretation introduce subjectivity. Thus, it's not a new pramana.

  Contested pairs: Testimony vs. Perception is clear. Inference vs. Postulation: Some schools conflate them. Comparison vs. Non-apprehension: Both lower tier, order might flip based on context.

