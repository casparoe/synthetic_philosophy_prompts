prompt: |-
  Ok, novel-writing question, and what I need out of it is an actual ranked list, not a vibe.

  I'm about 250 pages into a book whose protagonist, Meera, was raised by her grandfather, a Nyāya pandit, so she thinks in pramāṇas — the recognized sources of knowledge. The four Nyāya ones are perception (pratyakṣa), inference (anumāna), comparison/analogy (upamāna — you know what a thing is because you were told it's like something you already know), and testimony (śabda — taking the word of somebody who knows). I'm also giving her the two that some of the other schools add, because she's a syncretist and six is better for the plot: postulation (arthāpatti — you infer the explanation that makes an otherwise inexplicable fact go away, like deciding a man must eat at night because he's stout and never eats by day) and non-apprehension (anupalabdhi — knowing a thing isn't there because you'd have noticed it if it was).

  So: rank all six from most to least trustworthy, where the ranking is what she falls back on when they conflict with each other. Give me a score out of 1.0 for each so I can see the gaps and not just the order (like 0.9 down to 0.2), plus a line per entry saying why it lands where it does. And flag any pair where the order is basically a coin flip, or where the tradition itself splits — I'd rather know where it's contested than get a fake-precise list.

  One wrinkle that's load-bearing for me. There's a photographer in the book who insists the camera is its own pramāṇa, the photograph, on the grounds that a machine has no memory to get wrong. Slot that in too, and be honest about whether it's a genuinely separate source or just him relabeling perception and/or testimony, because the scene only works if Meera has a real answer and not just a shrug.
