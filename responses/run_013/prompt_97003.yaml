  - **Handouts**: 
    - "Marlowe Bend Massacre Facts" (1 per student, **Appendix A**).
    - "Council Rules & Budget Options" (1 per group, **Appendix B**).
    - "Plaque Wording Proposals" (worksheet for each group).
  - **Whiteboard Setup**:  
    ```plaintext
    OPTIONS:
    A. Memorial Museum (Maintenance: Year 1=2 tokens, Year 2=3, Year 3=4)
    B. Scholarship Fund (Victims’ descendants only)
    C. Town Welfare Fund (All residents)
    D. Reserve Fund (Save for future/trade-offs)
    ```
  - **News Item Cards** (Read aloud by facilitator between rounds).

  ---

  ### **Role Cards (7 roles × 2 groups)**
  *(Each card includes secret instructions only the player sees)*  
  1. **Victim Descendant (Rivermen)**:  
     *"Your great-grandfather died defending his family. Your relatives say forgetting is betrayal. Push for a museum/scholarships and a plaque blaming the Hillfolk."*  
  2. **Perpetrator Descendant (Hillfolk)**:  
     *"Your great-uncle led the attack. Your family fears shame. You want minimal memorials (e.g., a vague plaque) and funds shifted to welfare."*  
  3. **Newcomer (5 years in town)**:  
     *"You moved here for work. The massacre feels distant. Prioritize jobs and welfare—this isn’t your history. Compromise only if pressured."*  
  4. **Teenager (Local, parents want to forget)**:  
     *"Your parents say, ‘Stop living in the past!’ You care about sports/arts funding. Resist museum costs—it’s ‘ancient history.’"*  
  5. **Local Historian**:  
     *"You wrote a book on the massacre. Believe truth heals. Demand a detailed plaque and full museum funding, no matter the cost."*  
  6. **Mayor (Up for reelection)**:  
     *"You need votes from BOTH sides. Avoid extremes. Push for compromise on wording and balanced spending (but welfare looks good to voters)."*  
  7. **Unaffiliated Resident**:  
     *"Your family wasn’t involved. You just want town unity. Side with the majority, but lean toward welfare—it helps your friends."*  

  > **Why this works**: Cards force conflicting priorities. "Perpetrator" roles are framed as *victims of historical shame* (reducing refusal risk). Candy tokens create stakes.

  ---

  ### **Timeline (90 Minutes Total)**

  #### **Phase 1: First Council Session**  
  1. **Intro & Setup (10 min)**:  
     - Hand sealed role cards and "Marlowe Bend Facts" (**Appendix A**) as students enter.  
     - Split into 2 groups of 7. Push desks into circles.  
     - Rules overview: *"You’re Marlowe Bend’s council. You have 24 tokens total for 3 years. Each round, allocate tokens to options A-D. Museum maintenance costs rise yearly. You MUST agree on a plaque wording by 5 votes (2/3)."*  
     - **Pitfall Fix**: Pre-empt role refusal: *"These roles aren’t you—they’re perspectives to test. If uncomfortable, focus on the *why* behind your role’s views."*  

  2. **Plaque Negotiation (10 min)**:  
     - Groups debate wording. Require 5/7 votes to pass.  
     - **Sample Conflict**: Victim descendants want: *"In memory of 37 Rivermen murdered by Hillfolk, 1943."* Perpetrator descendants push for: *"Tragic 1943 events: Let reconciliation grow."*  

  3. **Token Allocation Rounds (20 min)**:  
     - **Rules**: Groups have 24 tokens. Each round, decide how many to spend on A, B, C, D. Unused tokens roll over.  
     - **Round 1 (5 min)**:  
       - Museum cost: 2 tokens.  
       - After decisions, read News Item 1: *"Year 1: The museum opens quietly. Attendance is low but respectful."*  
     - **Round 2 (5 min)**:  
       - Museum cost: 3 tokens.  
       - After decisions, read News Item 2: *"Year 2: ‘FORGET THE PAST!’ is spray-painted on the museum. Repairs add 1 token to next year’s cost."*  
     - **Round 3 (5 min)**:  
       - Museum cost: 4 tokens (3 + 1 vandalism fee).  
       - After decisions, read News Item 3: *"Year 3: Rivermen descendants protest. ‘The plaque whitewashes history! Fund scholarships now!’"*  
     - **Facilitator Notes**:  
       - Secretly hike museum costs (Year 1=2, Year 2=3, Year 3=4 +1=5).  
       - If groups "overspend," force cuts to welfare/scholarships.  
       - **Pitfall Fix**: If unanimous for museum, say: *"Scholarships require 2 tokens per student. Welfare cuts mean potholes/unfilled teacher jobs."*  

  #### **Phase 2: Role Swap & Repeat**  
  1. **Role Swap (5 min)**:  
     - *"Trade roles with someone who has a DIFFERENT colored card (red↔︎blue, yellow swap with anyone). You are now that person."*  
     - **Why**: Forces Victim↔Perpetrator, Historian↔Teenager, Newcomer↔Unaffiliated swaps.  

  2. **Repeat Token Rounds (15 min)**:  
     - Same rules/news items. Plaque wording **locked** from Phase 1 (no re-vote).  
     - **Key Tweak**: Museum costs now Year 1=3, Year 2=4, Year 3=5 (start higher to pressure "forgetters").  

  #### **Debrief (20 min)**  
  *(Questions map activity → philosophy)*  
  1. **Asymmetry of Duty**:  
     - *"Victim descendants: Did funding the museum feel urgent? Perpetrator descendants: Did it feel dangerous? How did this change when you swapped?"*  
     - *"Newcomers/unaffiliated: When did you feel the ‘duty to remember’? Was it weaker?"*  

  2. **Cost of Memory**:  
     - *"When museum costs rose, what did your group sacrifice? Did anyone switch sides when welfare funds vanished?"*  

  3. **Limitations & Real-World Bridge**:  
     - *"Did the fictional massacre feel ‘real’? Why might real victims reject this game?"*  
     - *"Can a ‘duty to remember’ exist for strangers? What might justify it?"*  
     - **Finally**: Reveal Margalit ("duty to remember") and Rieff ("forgetting heals")—connect to tensions felt.  

  ---

  ### **Appendices**
  #### **Appendix A: Marlowe Bend Massacre Facts**  
  > **October 17, 1943**: Hillfolk miners, fueled by rumors of sabotage, attacked Rivermen farm families. 37 Rivermen killed (including 12 children). Hillfolk ringleaders hanged; town divided.  
  > **Today**: Rivermen descendants want recognition. Hillfolk descendants fear stigma. Town struggles with poverty.  

  #### **Appendix B: Council Rules & Budget Options**  
  - **24 tokens = town budget for 3 years**.  
  - **Options**:  
    - **A. Memorial Museum**: MUST pay maintenance (Year1=2, Year2=3, Year3=4). Unpaid = museum closes.  
    - **B. Scholarship Fund**: 1 token = 1 year of college for a Rivermen descendant.  
    - **C. Town Welfare**: 1 token = roads/schools/healthcare for all.  
    - **D. Reserve**: Save tokens for later rounds.  
  - **Plaque Wording**: Needs 5/7 votes.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Role Refusal**:  
     - Likely with perpetrator descendants.  
     - **Fix**: Prep a backup role: *"Concerned Citizen: You married into a Hillfolk family. Fear your kids will be bullied."*  

  2. **Unanimous "Remember" Consensus**:  
     - **Fix**: Between rounds, privately tell welfare advocates: *"If welfare gets <3 tokens, teacher layoffs hit."* Tell mayor: *"Election polls show youth support dropping if museum drains funds."*  

  3. **Tokens Feel Fake**:  
     - **Fix**: Use candy (e.g., M&Ms). Let groups eat what they allocate to welfare/scholarships. *Unspent candy forfeited*.  

  4. **Fictional Atrocity Feels Hollow**:  
     - **Fix**: Read the facts aloud gravely. During protests, add sensory details: *"Protesters hold photos of child victims."*  

  5. **Time Shortfall**:  
     - **Fix**: Shorten rounds to 4 minutes. Skip plaque vote in Phase 2.  

  ---

  ### **What the Activity Can't Do (Frank Assessment)**  
  1. **Cannot Simulate Identity-Constituting Memory**:  
     - The game shows *that* personal connection intensifies duty, but not *how* shared memory builds communal identity ("we are a people because we remember"). You’ll need to explain this post-game.  

  2. **Cannot Replicate Trauma or Moral Gravity**:  
     - A fictional atrocity lacks the weight of real historical trauma (e.g., Holocaust, slavery). Students won’t feel the paralyzing guilt/rage real descendants might. Acknowledge this: *"Real debates involve grief no game can capture."*  

  3. **Oversimplifies "Forgetting"**:  
     - Rieff’s argument isn’t just about cost—it’s about memory distorting over time or being weaponized. The game reduces this to token trade-offs.  

  4. **Ignores Power Dynamics**:  
     - Real memory politics involve who *controls* the narrative. Here, all roles get equal votes.  

  **Final Tip**: Start debrief with *"How did your gut feelings change with your role?"* to surface the asymmetry before dissecting it. End by noting: *"This tension—between memory as moral duty and memory as a burden—is why philosophers like Margalit and Rieff clash."*  

  This plan creates the tension you want while respecting time constraints. Run it as-is, and adapt based on what flares up!
