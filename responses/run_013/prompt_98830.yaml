  The power rerouting scenario is tricky. User's "siding with whoever holds the pen" jab cuts deep. Counter by emphasizing how allowing exit over ordinary policy disputes would destabilize all democracies - even if it means swallowing hard cases. The greater good argument might feel unsatisfying but it's logically consistent.

