answer: |-
  Your frustration is real, but you mistake internal self-determination for guaranteed victory on *every* issue. It *is* the right to contest within a shared democratic framework – losing some votes is inherent, even on big things. A clean majority vote *isn't* enough because statehood creates profound mutual obligations and shared fate; dissolution demands justification beyond mere preference, otherwise every policy dispute or resource allocation could trigger fragmentation. "Injustice" adds the essential threshold: a sustained, severe denial of fundamental rights or political participation that renders internal mechanisms a sham – oppression, not just disagreement.

  On the power rerouting: it *is* troubling, and bad governance. But unless it's part of a pattern of systematic exploitation targeting that region *because* it's that region, denying basic dignity or capacity for self-rule within the state, it remains a grievance resolvable *internally*. Permitting secession over such ordinary (if unfair) policy choices *would* destabilize every democracy, making exit the first resort, not the last. Yes, this privileges the existing state's continuity – because the chaos of allowing exit for any dissatisfaction is worse. The burden of justification *must* be high. Make your case.
