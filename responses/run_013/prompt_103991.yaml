  Okay, the user is in a seminar on practical reason, focusing on internalism vs. externalism, particularly Williams' ideas. They're confused about how Hume's Treatise Book II relates to this debate. The professor claims it's where the debate starts, but after reading it multiple times, the user isn't seeing the connection. They cite Hume's famous quote about reason being the slave of the passions and express confusion over whether Hume is making a psychological claim about motivation or a normative one about reasons.

  The user has several specific questions: Is Hume discussing the causes of actions (psychology) or reasons in the Williams sense? They mention friends with opposing views—one saying Hume invented internalism, the other that he's just doing causal psychology. They also question Hume's premise that passions have "no representative quality," pointing out that emotions can be about things and can be mistaken. Additionally, they note the apparent contradiction in Hume's normative claim ("ought only to be the slave") right after saying reason can't move us. Finally, they ask about calm passions being mistaken for reason and whether that undermines Hume's reason-passion dichotomy.

  The user is clearly grappling with complex philosophical concepts and is frustrated by the disconnect between the seminar's framing and their reading of Hume. They need help clarifying Hume's arguments, connecting them to modern internalism/externalism debates, and resolving apparent contradictions in Hume's text.

  Breaking down Hume's key claims: First, he argues reason alone can't motivate actions—only passions can. Second, reason can't oppose passion in directing the will. Passions are "original existences" without representational content. This seems psychological, describing how motivation works. But the normative "ought" in the slave metaphor complicates things.

  Regarding the internalism connection: Hume's view that reasons must connect to existing motivations resembles Williams' internalism. But Hume is primarily descriptive, while Williams is normative. Hume's psychology implies internalism—reasons require motivational links—but he doesn't explicitly frame it as a theory of normative reasons.

  The "no representative quality" point: Hume sees passions as direct feelings, not truth-apt like beliefs. The user's observation that emotions can be "about" things touches on contemporary cognitive theories of emotion, which Hume would reject. For Hume, only the associated beliefs have representational content.

  The calm passions passage (Treatise 2.3.3) does complicate things. Hume acknowledges that calm passions can feel like reason but insists they're still passions. This shows his psychology is more nuanced than the "slave" metaphor suggests, but doesn't undermine his core thesis—all motivation stems from passions.

  The normative "ought" is tricky. It might be Hume smuggling in a prescription, or perhaps he's saying that since reason can't motivate, it shouldn't try to—a hypothetical imperative. Either way, it's a tension in his text.

  Verdict: Hume is primarily making a psychological claim about motivation, but this has strong implications for normative reasons, laying groundwork for internalism. The user's friends are both partially right—Hume's psychology informs internalism but isn't identical to Williams' normative project.
answer: |-
  You're absolutely right to feel that Hume's passage isn't directly answering Williams's *normative* question about what *counts* as a valid reason. Hume is primarily engaged in **descriptive psychology of motivation**, dissecting the *causal mechanisms* behind human action. Here's the breakdown addressing your points:

  1.  **Psychology, Not Normative Reasons (Yet):** Hume's core argument ("reason alone can never be a motive," "reason cannot oppose passion") is a claim about *how human psychology actually works*. He's investigating what *causes* the will to act. His conclusion is stark: only passions (desires, aversions, sentiments) provide the motivating force. Reason (calculating relations of ideas or matters of fact) is inert; it discovers truths but lacks the inherent "oomph" to push us towards action or counter a passion's force. Williams, however, is wrestling with the *normative* question: when we *say* "S has a reason to φ," what *justifies* that claim? Does it require a link to S's psychology (internalism) or not (externalism)? Hume's psychology *implies* an answer to Williams (internalism), but he isn't explicitly posing or answering Williams's *normative* question.

  2.  **The "No Representative Quality" Claim:** Hume is making a specific metaphysical point here about the nature of passions *as mental states*. He contrasts passions with *beliefs* (which are representational – they "copy" reality, aiming at truth/falsity). A passion, for Hume, is a raw feeling or impulse – like pain or hunger – that isn't *about* the world in the same truth-apt way. You feel anger *at* something *because* of a belief (e.g., "They insulted me"), but the anger *itself* isn't true or false; it's just a brute motivational state. Your observation that emotions seem "about" things touches on modern cognitive theories of emotion, which Hume explicitly rejects. For Hume, the *aboutness* comes from the associated *belief* ("representative quality"), not the passion itself ("original existence"). The passion just *is* the push or pull.

  3.  **The Normative "Ought" in the Slave Metaphor:** This is a famous point of tension. How can Hume say reason *ought* only to be the slave if it *can't* be anything else? Interpretations vary:
      *   **Descriptive Prescription?:** He might be emphasizing the *futility* of trying to let reason rule. Since it *can't* motivate, it *shouldn't* be expected to; trying to make it do so is nonsensical.
      *   **Hypothetical Imperative?:** It could be read as: *If* you want to achieve the ends set by your passions (which you inevitably do), *then* reason *should* serve them by finding the best means. Its "ought" is conditional on the passion's existence.
      *   **Smuggling Normativity?:** Some argue it's an inconsistency where Hume's descriptive project momentarily slips into prescription, perhaps reflecting his own view of rationality's proper function within the passionate framework he describes. It's jarring precisely because it seems to step outside his descriptive claims.

  4.  **Calm Passions and the "Clean Story":** You nailed it. In Treatise 2.3.3 (especially near the end), Hume introduces "calm passions" (like a general desire for my own good or benevolence) and "violent passions" (like intense anger or lust). Crucially, he states:
      > "What we call strength of mind, implies the prevalence of the calm passions above the violent... it must be allow'd, that the calm passions often determine the will... and are even frequently confounded with reason by all men, as well as by the philosopher."
      This *absolutely* complicates the clean reason-vs-passion story:
      *   **It's Still Passion:** Hume insists these calm motives *are* passions, not reason. They are just less agitated.
      *   **Mistaken Identity:** Precisely because they are calm and enduring (like long-term prudence or moral sentiments), they are easily *confused* with the operations of reason.
      *   **Psychological Nuance:** This shows Hume's psychology is more sophisticated than the initial "slave" metaphor suggests. Motivation isn't just violent impulses vs. inert calculation; it includes stable, reflective desires that *feel* rational. However, he maintains they are still motivational forces (passions), not the discovery engine (reason). This doesn't wreck his core thesis that *only* passions motivate; it refines the picture of *what kinds* of passions motivate.

  **Why it's the "Start of the Debate" (and Your Friend's Point):** While Hume is primarily doing psychology, his descriptive claims have *massive* implications for normative theories of reasons:
  *   **Internalism Implied:** If only passions motivate, then for a "reason" to actually *be* motivating *for an agent* (to be practically relevant), it *must* connect to some passion ("motivation she already has") in their "subjective motivational set" (to use Williams's term). Hume's psychology sets the stage for the idea that normative reasons must be internal in this motivational sense to be real reasons *for that agent*. This is why one friend says he "invented internalism" – the psychological foundation is laid here.
  *   **The Challenge to Externalism/Rationalism:** Hume directly attacks the rationalist view (e.g., Clarke, Cudworth) that reason *alone* can discern moral truths that inherently obligate and motivate. His psychology suggests such a view misunderstands the nature of both reason and motivation, making external reasons (reasons applying regardless of motivation) seem psychologically impossible or irrelevant to action.

  **Verdict:** Foundational motivational psychology.
