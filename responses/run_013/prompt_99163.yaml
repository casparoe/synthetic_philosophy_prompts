  They mentioned two key cases: patients who feel pain but aren't bothered by it, and states of suffering without pain sensation. They also have a constructed case where pain is unpleasant but not bad for the subject. The user wants to ensure that different aspects like badness, dislike, desire to stop, etc., aren't conflated. 

  First, I should outline the core requirements any theory must meet. The dissociation cases are crucial. The parietal patients show sensory and affective components can separate, which challenges intrinsic views. The reverse case with suffering without pain sensation indicates that suffering isn't exclusive to pain. The constructed case might test if unpleasantness necessarily implies badness. 

  Next, I need to consider conceptual distinctions. Terms like badness-for-subject, dislike, desire, etc., must remain distinct. For example, a theory shouldn't collapse badness into mere dislike. Also, the theory must explain why pain is typically bad without always being so. 

  The user wants to know if any desiderata conflict. For instance, the necessity desideratum (badness requires affective-motivational component) might conflict with the constructed case if it's coherent. If the constructed case is possible, it challenges theories that tie badness directly to unpleasantness or desire. 

  Popular theories need evaluation against these criteria. Intrinsic views fail because they can't explain dissociation. Desire theories might struggle with the constructed case if the subject doesn't want to stop the pain. Evaluativism might conflate representation with badness. Imperative theories could confuse commands with actual badness. 

  The strongest desideratum is probably the dissociation of components, as it invalidates intrinsic and simple representational views. The requirement to keep badness distinct from other concepts might exclude many theories that conflate these terms. 

  I should also note if the constructed case is coherent. If the subject finds the pain unpleasant but not bad, and doesn't desire to stop it, this might violate the desire theory's link between desire and badness. But if it's coherent, it suggests that unpleasantness doesn't always entail badness or desire to stop. 

  Finally, scoring the theories briefly against the desiderata will help the user, but the focus should be on clear criteria. Highlighting conflicts, like between necessity and the constructed case, will be crucial for their paper.
answer: |-
  Here is a specification of desiderata for a theory of the badness of pain, grounded in the clinical phenomena and conceptual distinctions you've outlined. I'll structure it as requested, flagging tensions and scoring major theories briefly against the criteria.

  **Core Phenomena & Cases Any Adequate Theory MUST Explain (Non-Negotiable):**

  1.  **Parietal Dissociation (Asymbolia/Indifference):**
      *   *Case:* Patients feel pain (localize, discriminate intensity/quality) but report it "doesn't bother" them and lack withdrawal, guarding, distress (even smiling).
      *   *Requirement:* The theory **must** accommodate that the sensory-discriminative component and the affective-motivational/badness component can dissociate. Badness is *not* intrinsic to the sensory quality itself.
      *   *Motivation:* Clinical reality (e.g., cases following lesions to posterior parietal cortex/insula).

  2.  **Suffering Without Pain Sensation:**
      *   *Case:* States of profound distress, anguish, or suffering (e.g., severe depression, existential dread, grief, certain anxiety states) where no specific bodily pain sensation is reported or identified.
      *   *Requirement:* The theory **must** accommodate that the core "badness" or suffering characteristic of pain *can* exist independently of any identifiable sensory pain state. Badness is not *unique* to pain sensations.
      *   *Motivation:* Clinical psychiatry, phenomenology of mental illness, everyday experience of non-somatic suffering.

  3.  **Typical Pain is Bad:**
      *   *Case:* Standard instances of acute pain (e.g., touching a hot stove, stubbing a toe) are intrinsically bad for the subject experiencing them.
      *   *Requirement:* The theory **must** explain why pain, in its typical, integrated form, is paradigmatically and intensely bad/aversive for the subject. It should capture the *normative force* of pain avoidance.
      *   *Motivation:* Universal human experience, evolutionary role of pain.

  4.  **Badness is Subjective:**
      *   *Requirement:* The theory **must** account for the badness *for the subject* experiencing the state. This badness is a matter of the subject's conscious experience and welfare, not merely an objective biological signal or observer judgment.
      *   *Motivation:* The first-person perspective of suffering; the target is *why pain feels bad to the one having it*.

  **Conceptual Distinctions the Theory MUST Preserve (Non-Negotiable):**

  5.  **Badness-for-Subject vs. Dislike:**
      *   *Requirement:* The theory **must not collapse** something being bad *for* the subject with the subject consciously disliking it *at that moment*. (A state could be bad for you even if you don't consciously dislike it, e.g., undiagnosed illness; you could dislike something trivial without it being profoundly bad).
      *   *Motivation:* Conceptual analysis; cases of unconscious harm, akrasia, trivial dislikes.

  6.  **Badness-for-Subject vs. Desire-to-Stop:**
      *   *Requirement:* The theory **must not collapse** something being bad *for* the subject with the subject having a conscious, occurrent desire *to stop or avoid* it. (A state could be bad without prompting an immediate desire, e.g., resignation in chronic pain; one could desire to stop a non-bad state, e.g., stopping pleasant music to sleep).
      *   *Motivation:* Phenomena of resignation, learned helplessness, endurance (e.g., athletes, childbirth).

  7.  **Badness-for-Subject vs. Experienced-as-to-be-stopped:**
      *   *Requirement:* The theory **must not collapse** something being bad *for* the subject with the state having an intrinsic phenomenal character of "demanding" cessation. (This is a finer distinction than 6, targeting the *phenomenal imperative* sometimes attributed to pain).
      *   *Motivation:* Parietal dissociation case – sensory pain is present but lacks the imperative quality; need to separate the *what it's like* of badness from the *what it's like* of a command.

  8.  **Badness-for-Subject vs. Representing-Bodily-Disturbance-as-Bad:**
      *   *Requirement:* The theory **must not collapse** something being bad *for* the subject with the state *representing* a bodily condition *as* bad or damaged. (The badness *is* the suffering, not the represented tissue damage. Representing damage as bad might be necessary for typical pain's badness, but the badness itself is distinct – see Case 2 & Parietal case).
      *   *Motivation:* Parietal dissociation – representation of disturbance/damage is intact (they report intense pain), but the badness is absent. Suffering without pain – badness present without representing a *bodily* disturbance as bad.

  9.  **Unpleasantness vs. Badness-for-Subject:**
      *   *Requirement:* The theory **must not collapse** the phenomenal quality of *unpleasantness* with *badness-for-the-subject*. They are tightly linked in typical pain but potentially dissociable. (Your constructed case probes this).
      *   *Motivation:* Conceptual possibility raised by your constructed case; need to define "unpleasantness" carefully.

  **Your Constructed Case: The Unpleasant but Non-Bad Pain:**

  *   *Case:* Subject reports pain sensation, describes it as "unpleasant" or "hurts," yet denies it is *bad for her* – no distress, no motivation to be rid of it (beyond habit/curiosity), would not pay to remove it.
  *   *Coherence & Implications:*
      *   **Coherence is Debatable but Conceptually Possible:** This case pushes on the link between phenomenal unpleasantness and badness/dislike/desire. It's coherent *if* "unpleasant" is interpreted narrowly as a specific sensory quality distinct from *suffering* or *aversion*. It might resemble reports of mild, easily ignored pains or certain meditative states.
      *   **Requirement it Imposes:** A theory **must either**:
          *   (a) Explain how this state is possible (e.g., by separating the sensory "hurt" quality from the motivational-affective *badness* even more finely than in parietal cases), *or*
          *   (b) Argue convincingly that the subject's denial of badness is incoherent or mistaken *based on her own report of unpleasantness*, showing that "unpleasant" *necessarily* entails "bad for me" or aversion/desire-to-stop.
      *   *Motivation:* Tests the core link between the phenomenal character of pain and its normative badness. It challenges theories that tightly bind unpleasantness, dislike, desire, and badness.

  **Potential Conflicts Between Desiderata:**

  *   **Conflict 1: Necessity vs. Constructed Case:** The requirement that badness requires the affective-motivational component (from Parietal case) might conflict with the Constructed Case if "unpleasant" is taken as *part* of the affective component. If the Constructed Case is coherent, it suggests "unpleasant" alone isn't sufficient for badness. If incoherent, it reinforces the link. This puts pressure on defining the affective component.
  *   **Conflict 2: Suffering Without Pain vs. Badness of Pain:** The requirement that badness isn't unique to pain (Case 2) might seem to dilute the specificity of "the badness *of pain*". A theory must explain what *makes pain bad* when it is bad, while acknowledging the same *type* of badness can occur elsewhere.

  **The Most Excluding Desideratum:**

  *   **Desideratum 1 (Parietal Dissociation):** This does the most work to exclude popular theories. It directly refutes views where badness is intrinsic to the sensory quality (Intrinsic/Quality Views) or necessarily tied to the representation of damage (Simple Representationalism). It forces a separation that many theories struggle with.

  **Brief Scoring of Leading Theories Against Desiderata:**

  *(Scores: ✓ = Satisfies, ✗ = Violates, ~ = Partial/Problematic, ? = Unclear/Debatable)*

  1.  **Intrinsic/Sensory Quality View (Badness is intrinsic to pain quale):**
      *   Parietal Dissociation: ✗ (Cannot explain dissociation)
      *   Suffering w/o Pain: ✗ (Badness unique to pain qualia)
      *   Typical Badness: ✓
      *   Badness Subjective: ✓
      *   Distinctions 5-9: ✗ (Likely collapses badness with sensory quality/unpleasantness)
      *   Constructed Case: ✗ (Denies possibility or collapses badness/unpleasantness)

  2.  **Desire/Attitudinal Views (Badness = being the object of a desire/aversion to stop):**
      *   Parietal Dissociation: ✓ (Desire/aversion absent)
      *   Suffering w/o Pain: ✓ (Desire/avasion can exist w/o pain)
      *   Typical Badness: ✓
      *   Badness Subjective: ✓
      *   Distinction 5: ✗ (Collapses badness with desire)
      *   Distinction 6: ✗ (Defines badness *as* desire-to-stop)
      *   Distinctions 7-9: ~ (Depends on specifics)
      *   Constructed Case: ✗ (If subject reports unpleasantness but lacks desire-to-stop, badness is absent by definition – but is this plausible?)

  3.  **Imperative Views (Pain's badness lies in its imperative content: "Stop this!")**
      *   Parietal Dissociation: ✓ (Imperative content absent/muted)
      *   Suffering w/o Pain: ? (Can non-pain states have imperative content? Needs extension)
      *   Typical Badness: ✓
      *   Badness Subjective: ✓
      *   Distinction 5: ✗ (Collapses badness with imperative force)
      *   Distinction 6: ~ (Imperative force motivates desire, but distinct?)
      *   Distinction 7: ✗ (Collapses badness with experienced imperative)
      *   Distinctions 8-9: ~
      *   Constructed Case: ✗ (If unpleasantness lacks imperative force, badness absent)

  4.  **Simple Representationalism (Pain's badness = representing tissue damage):**
      *   Parietal Dissociation: ✗ (Representation intact, badness absent)
      *   Suffering w/o Pain: ✗ (Badness present w/o representing tissue damage)
      *   Typical Badness: ✓
      *   Badness Subjective: ~ (Representation may not capture subjective badness)
      *   Distinction 8: ✗ (Collapses badness with representation of damage)
      *   Other Distinctions: ✗/~ (Likely collapses others)

  5.  **Evaluativism (Pain's badness = pain representing the bodily state *as bad*):**
      *   Parietal Dissociation: ✗ (Representation "as bad" arguably *is* the affective component dissociated)
      *   Suffering w/o Pain: ? (Can non-pain states represent something "as bad"? Needs extension)
      *   Typical Badness: ✓
      *   Badness Subjective: ~ (Depends on account of representation)
      *   Distinction 8: ✗ (Collapses badness with representing-as-bad)
      *   Distinction 5,6,7: ~ (Representing-as-bad may cause dislike/desire, but distinct?)
      *   Distinction 9: ~
      *   Constructed Case: ? (If pain represents state as bad but subject denies badness-for-her, is representation faulty or is badness distinct?)

  **Key Takeaway for Your Paper:**

  The Parietal Dissociation case is the bedrock. Any theory that fails there is inadequate. The critical work lies in rigorously defining the *affective-motivational component* whose absence explains asymbolia. Is it an independent feeling (e.g., suffering), an attitude (dislike, aversion), a motivational force (desire), an imperative, or an evaluative representation? Your constructed case then probes whether this component, once identified, *necessarily* entails that the subject finds the state *bad for them* and is motivated to stop it, or if further dissociation is possible. The distinctions (5-9) prevent simplistic answers. The tension often lies between capturing the *normative force* of badness (why we *should* avoid it) and the *subjective experience* of it not being bad in dissociation cases. Good luck!
