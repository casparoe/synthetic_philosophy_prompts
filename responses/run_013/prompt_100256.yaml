  ## Central Institute for Unified Pictorial Science (CIUPS)
  **Guidelines for the Construction and Use of Picture Statements (7th Edition, Revised)**
  **Ref: CIUPS/G-CUPS/7R**

  **FOREWORD:** The Central Institute for Unified Pictorial Science (CIUPS) remains steadfast in its mission to facilitate global understanding through the International System of Typographic Picture Education (ISTPE), eliminating the ambiguities, obfuscations, and metaphysical confusions endemic to verbal languages. This seventh edition incorporates refinements necessitated by practical application and ongoing Committee deliberations (Minutes 346-421 accessible via Form IS-7). Adherence to these Guidelines ensures clarity, prevents conceptual drift, and maintains the integrity of the pictorial universe. Remember: *If it cannot be pictured clearly, it cannot be stated clearly.*

  **Section 1: Fundamental Syntax & Atomic Statements (Art. 1.0 - 1.15)**

  1.1  **The Picture Field:** All statements occupy a standard rectangular Field (Form IS-1). The Field represents the domain of *what is the case*.
  1.2  **Proto-Icons:** Foundational pictograms (e.g., `[Simple Icon: Person]`, `[Simple Icon: House]`, `[Simple Icon: Rain Cloud]`) depict observable entities or processes. Refer to the *Master Index of Validated Proto-Icons (MIVP-7)*. Unauthorized icon creation requires Form IS-8 and Triple Verification.
  1.3  **Atomic Depiction:** Place Proto-Icons within the Field to depict a state of affairs. `[Icon: Person]` adjacent to `[Icon: House]` within a single Field depicts *Person-at-House*. Spatial relation *is* the copula. *Avoid verbal equivalents like "is at"; the relation is inherent in the arrangement*.
  1.4  **Negation (Art. 1.7):** Depicting absence or falsehood requires the Void Field (Diagonal black bar `[ // ]` bisecting a sub-field). Place the Void Field *around* the arrangement to be negated. *Example:* Void Field surrounding `[Person] + [House]` depicts *Person-not-at-House*. **Crucially:** The Void Field *is not a picture of nothingness*; it is the operator of negation. Do not confuse with depicting empty space (See Art. 3.11: Vacuum Representation).

  **Section 2: Logical Connectives & Complex Statements (Art. 2.0 - 2.23)**

  2.1  **Conjunction:** Juxtaposition within the primary Field signifies conjunction. `[Cloud] + [Rain Streaks]` depicts *Cloud-and-Rain*.
  2.2  **Disjunction (Art. 2.8):** Utilize the Alternation Frame (Dashed-line rectangle `[ - - ]`). Place distinct arrangements *within separate, clearly divided compartments* of the Alternation Frame. *Example:* Alternation Frame containing `[Person] + [House]` in one compartment and `[Person] + [Factory]` in another depicts *Person-at-House OR Person-at-Factory*. **Note:** Ambiguity regarding exclusive vs. inclusive disjunction is resolved contextually by observable frequency data (CIUPS Bulletin #47) or via explicit quantification (See Sect. 3).
  2.3  **Conditionality (Art. 2.15):** Depict the antecedent arrangement ABOVE the Consequence Arrow (`--->`), followed by the consequent arrangement. `[Cloud] + [Rain Streaks] ---> [Person] + [Umbrella]` depicts *If-rain-then-person-with-umbrella*. Temporal priority implies causality only where empirically established (Refer to *Causal Nexus Pictograms: Annex D*).

  **Section 3: Quantification & Abstraction (Art. 3.0 - 3.31)**

  3.1  **Generality (The "All" Operator):** Employ the Universal Enclosure (Thick border `[===]`). Proto-Icons placed *within* this enclosure represent *all* instances of that type. *Example:* Universal Enclosure containing `[Person]` adjacent to `[House]` depicts *All-people-are-at-houses*. **Historical Note:** Pre-5th Edition attempts to depict "most" or "some" led to significant interpretive crises (See *The "Scholz-Schlick Purge" Debriefing Report*). Universality and singularity are pictorially primary; statistical aggregates require specialized Sociogram Fields (Form IS-12).
  3.5  **Abstract Concepts (Art. 3.20):** Depict institutions, social facts, or economic relations *only* through their observable manifestations or standardized compound symbols. `[Icon: Grain Sack]` + `[Icon: Upward Arrow]` + `[Icon: Coin Stack]` depicts *Rising Grain Price*. **Strict Prohibition:** Avoid "smuggling" verbal definitions via overly complex or idiosyncratic symbols. If a concept cannot be rendered through established Proto-Icons, compounds, and operators referencing observable correlates, it falls outside ISTPE's domain of legitimate discourse (See Sect. 5).
  3.11 **"Is" vs. "Ought" (Art. 3.29):** ISTPE depicts *what is the case*. Normative claims ("ought") must be represented *as social facts*. Depict individuals pointing at desired arrangements (`[Person] + [Pointing Hand] + [House]`) or utilize the Sanction Glyph (`[!]` - Approved; `[X]` - Prohibited) issued by recognized authority pictograms (`[Icon: Gavel]`, `[Icon: Council Building]`). `[Person] + [Pointing Hand] + [House]` + `[Icon: Gavel] + [!]` depicts *The Council approves of people wanting houses*. **This depicts the approval, not the inherent "ought-ness."**

  **Section 4: Ambiguity Resolution & Context (Art. 4.0 - 4.17)**

  4.1  **Iconic Polysemy:** Should a pictogram possess multiple valid interpretations per MIVP-7 (e.g., `[Bird]` could denote *sparrow* or *flight*), resolution proceeds thus:
      a.  Examine immediate spatial relations (Art. 1.3).
      b.  Consult surrounding operators (Void, Universal, etc.).
      c.  Refer to the *Standard Contextual Field Indicators* (Annex F - e.g., Sky Band `[~~~~]` suggests *flight*; Ground Band `[_____]` suggests *animal*).
      d.  If ambiguity persists, the statement is *malformed*. Submit Form IS-9 (Ambiguity Appeal) to the Regional Clarification Bureau.
  4.3  **Picture of Fact vs. Picture of Proposition:** A Picture Statement within a Field *asserts* a state of affairs. To depict *a proposition about* a state of affairs, enclose the relevant Picture Statement within the Proposition Frame (Double-lined rectangle `[≡≡≡]`). `[≡ [Cloud] + [Rain Streaks] ≡]` depicts *The proposition "It is raining"*. This is essential for depicting belief, doubt, or hypothesis (e.g., `[Person] + [?] + [≡ [Cloud] + [Rain] ≡]` depicts *Person-wonders-if-raining*).

  **Section 5: Handling Ungrammatical Utterances (Art. 5.0 - 5.09)**

  5.1  **Metaphysical Claims:** ISTPE's syntax is designed to render metaphysical claims (e.g., concerning the "soul," "absolute morality," "transcendent reality") pictorially *ungrammatical*. They violate core construction rules:
      *   **Lack of Observable Referent:** No valid Proto-Icon or compound exists.
      *   **Misapplication of Operators:** E.g., attempting to place the Void Field around the *entire* Field to depict "Nothingness" creates a performative contradiction (the Void Field itself occupies the Field).
      *   **Illicit Abstraction:** Attempts to depict "Being itself" or "The Good" inevitably rely on smuggled verbalisms or invalid symbols.
  5.2  **Citizen Procedure:** Should an individual insist on expressing such an utterance:
      a.  Calmly request they attempt to depict it using the Guidelines and MIVP-7.
      b.  When attempts fail (as per 5.1), explain patiently that the utterance lacks pictorial correlates and therefore cannot be integrated into the unified scientific worldview. Offer pamphlet P-7: *"Your Feeling is Valid, Your Words Are Not: Finding Pictorial Equivalents for Emotional States."*
      c.  If the citizen becomes agitated or persists, reiterate that ISTPE facilitates communication about the *shared observable world*. Suggest they consult a Verbal-Philosophical Liaison (Form IS-15), though note such consultations are purely therapeutic and do not confer discursive legitimacy. **Do not engage in verbal debate about the claim itself.** This undermines the foundational purpose of ISTPE.
      d.  File Incident Report IR-5 (Ungrammatical Utterance Attempt) for statistical purposes.

  **CONCLUSION:** The International System of Typographic Picture Education represents the pinnacle of human striving for clarity and mutual comprehension. Its rigorous structure, grounded in observable reality, liberates us from the endless disputes fostered by verbal ambiguity and metaphysical speculation. Diligent application of these Guidelines ensures the continued progress of Unified Science and the harmonious exchange of factual information across all cultures. Report inconsistencies or proposed refinements using Form IS-10 (Pictorial Syntax Amendment Proposal). Remember: *A well-ordered picture is a well-ordered mind.*

  **Central Institute for Unified Pictorial Science**
  **Department of Pictorial Syntax & Standardization**
