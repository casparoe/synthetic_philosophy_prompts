  First, I need to address their three sticking points systematically. For point 1 about "willing obligation," Hume is likely attacking rationalist views (maybe Clarke or Pufendorf) who might see will as constitutive of obligation. But the user's intuition about reliance being key is spot-on - that's exactly where Hume's argument feels thin. Modern philosophers like Scanlon would agree with them.

  The circularity worry in point 2 is valid. Hume's move is subtle but defensible: he's not denying we feel duty, but questioning its origin. Still, the "no prior duty" premise is shaky - evolutionary accounts could suggest proto-moral instincts. 

  For point 3, the user's emotional distress about letting their flatmate down is real. Hume wouldn't dismiss that feeling, but he'd say it's society's scaffolding, not cosmic duty. The tension between "this feels morally binding" and "it's artificial" is exactly Hume's point - and why this passage resonates after their fight.

  The user's skepticism about prudential vs moral is profound. Hume's genius is showing how social necessity transforms self-interest into moral feeling. But telling someone "your guilt is just evolved cooperation instincts" might not comfort them post-fight. 

  Ultimately the text works logically but feels unsatisfying because Hume intentionally divorces moral psychology from metaphysical grounding. The user wants moral realism; Hume gives anthropological insight. Their flatmate argument proves Hume's point: we act as if promises are real because society collapses otherwise.
answer: |-
  You're wrestling with one of Hume's most brilliant but frustrating arguments – and your flatmate drama is the perfect real-world test case. Let's dissect your three sticking points honestly, without sugarcoating Hume or dodging the gaps:

  **1. The "Willing Obligation" Straw Man?**  
  You're right to be suspicious. Hume sets up a false trilemma (resolving/desiring/willing) to knock down. His target is rationalist or theological views (think Pufendorf or Locke) where a "promise" magically creates obligation *ex nihilo* through an act of will or divine sanction. Nobody seriously thinks "I hereby will obligation into existence" is a mental act. Hume *is* caricaturing the intuition that "consent binds us."  

  **Why your reliance objection hits hard:** Hume ignores the *social act* of promising – the creation of *expectation* and *reliance* in the other person. This is where his argument feels weakest. He dismisses alternatives because he’s laser-focused on finding a *unique mental act* inside the promiser. But obligation might emerge from the *interaction*, not a solitary mental gesture. Hume saves this for later (the "artificial virtue" bit), but here, he deliberately oversimplifies to show the *conceptual* problem of promises in a moral vacuum.

  **2. The Circularity Charge – Is Hume Begging the Question?**  
  Your read is sharp. The "motive" argument (*Treatise* 3.2.5) *looks* circular:  
  - *Premise 1*: No duty without a motive.  
  - *Premise 2*: That motive can’t *be* the sense of duty (which requires prior obligation).  
  - *Premise 3*: We have no *natural* motive to keep promises (like benevolence).  
  - *Conclusion*: Therefore, promise-keeping can’t be a natural duty.  

  **The escape hatch:** Hume isn’t *assuming* there’s no prior obligation. He’s *testing* whether we can find a *natural* foundation (instinct, passion) for promise-keeping. His point: If you strip away society’s conditioning, you find no innate *passion* driving it (unlike compassion for suffering). The *only* motive left *is* the sense of duty – but that sense *presupposes* an existing obligation, which hasn’t been explained. The circularity *exposes* the need for an *artificial* source. It’s not airtight (could there be a subtle natural motive he missed?), but it’s a powerful challenge: **If promise-keeping is natural, why does its motive vanish the moment we stop believing it’s obligatory?**

  **3. "Artificial" Obligation – Is It Just Prudence?**  
  This is where your flatmate guilt clashes with Hume’s theory. He *doesn’t* reduce it to *mere* prudence ("keep promises or get shunned"). Here’s the nuanced reality:  
  - **Step 1 (The Invention):** Promises *are* a human "contrivance" solving a coordination problem ("I need help moving; you need future help; but we distrust each other").  
  - **Step 2 (The Sentiment):** Society instills a *moral sentiment* – via sympathy and education – around promise-keeping. Breaking a promise triggers *disapproval* in others and, crucially, **shame or guilt in *you***.  
  - **Step 3 (The Obligation):** That cultivated sentiment *is* the obligation. It feels "real" because your emotions have been socially shaped to *make* it feel real and binding.  

  **What’s left of your guilt?** Exactly what you felt: a powerful, socially-instilled **moral sentiment**. Hume doesn’t deny its force or importance. He denies it’s a cosmic law or innate instinct. It’s a vital *human* invention. The "prudential" element (avoiding shunning) is the *origin*, but the *current* motivation is genuinely moral: you feel it’s *wrong* to let your flatmate down, because society (and your upbringing) have wired you to feel that way. It’s "artificial" like money is artificial – its value depends on collective practices, but within that system, it’s undeniably real and powerful.

  **Does the Argument *Actually* Work? Strengths & Weaknesses**  
  - **Strengths:**  
    - **Destroys simplistic voluntarism:** Promises *can’t* be magic obligation-spells.  
    - **Exposes the social dependency:** Obligation *requires* a social context with shared expectations.  
    - **Explains variability:** Why some "promises" (under duress, to a thief) aren’t binding – they lack the social context.  
  - **Weaknesses:**  
    - **Ignores the interpersonal act:** Your "reliance" point is valid. Hume focuses excessively on the *promiser's* mind, neglecting the *relationship* and *vulnerability* created.  
    - **Overstates the "no natural motive":** Couldn’t *fidelity* or aversion to *deception* be natural passions co-opted by promises? Hume arguably dismisses this too quickly.  
    - **"Artificial" feels reductive:** It struggles to fully capture the *immediate, personal* weight of breaking a promise to someone you care about. Your guilt feels *deeper* than "society programmed me."  
    - **The circularity is risky:** It relies on accepting his strict dichotomy between "natural" passions and socially-instilled sentiments. Some (like sentimentalists before him) might argue moral sentiments *are* natural.

  **Verdict:** Hume’s argument is **logically coherent and devastating against certain rivals**, but it **deliberately simplifies moral psychology** to make its point. It works best as a *diagnostic tool* showing why promises *must* be social artifacts, not innate duties. Where it falters is in fully capturing the lived experience of promising – the reliance, the personal betrayal, the guilt that feels intrinsic, not just implanted. Your flatmate’s "you promised!" taps into that deep, socially-cultivated sentiment. Hume explains its origin, but doesn't erase its force. The obligation is "real" *within the human practice*, and your guilt is proof the system works. Whether that’s enough to resolve your argument... well, that’s philosophy in action. Maybe show your flatmate Hume and agree your fight was a 250-year-old debate?
