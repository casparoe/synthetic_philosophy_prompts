prompt: |-
  My flatmate and I had a stupid fight last week — I'd told him I'd help him move, then bailed on the day, he said "you promised", I said "I said I'd try", and it somehow became a two-day argument about whether a promise is even a thing. So I went and read Hume on promises (Treatise, book 3, part 2, section 5, I think — the bit titled "Of the obligation of promises") and there's a stretch of it I genuinely can't follow. Can you help me with it?

  Here's the part I'm stuck on:

  "The act of the mind, exprest by a promise, is not a resolution to perform any thing: For that alone never imposes any obligation. Nor is it a desire of such a performance: For we may bind ourselves without such a desire, or even with an aversion, declar'd and avow'd. Neither is it the willing of that action, which we promise to perform: For a promise always regards some future time, and the will has an influence only on present actions. It follows, therefore, that since the act of the mind, which enters into a promise, and produces its obligation, is neither the resolving, desiring, nor willing any particular performance, it must necessarily be the willing of that obligation, which arises from the promise."

  "All morality depends upon our sentiments; and when any action, or quality of the mind, pleases us after a certain manner, we say it is virtuous; and when the neglect, or non-performance of it, displeases us after a like manner, we say that we lie under an obligation to perform it. A change of the obligation supposes a change of the sentiment; and a creation of a new obligation supposes some new sentiment to arise. But 'tis certain we can naturally no more change our own sentiments, than the motions of the heavens; nor by a single act of our will, that is, by a promise, render any action agreeable or disagreeable, moral or immoral; which, without that act, wou'd have produc'd contrary impressions, or have been endow'd with different qualities. It wou'd be absurd, therefore, to will any new obligation, that is, any new sentiment of pain or pleasure; nor is it possible, that men cou'd naturally fall into so gross an absurdity. A promise, therefore, is naturally something altogether unintelligible, nor is there any act of the mind belonging to it."

  "No action can be requir'd of us as our duty, unless there be implanted in human nature some actuating passion or motive, capable of producing the action. This motive cannot be the sense of duty. A sense of duty supposes an antecedent obligation: And where an action is not requir'd by any natural passion, it cannot be requir'd by any natural obligation; since it may be omitted without proving any defect or imperfection in the mind and temper, and consequently without any vice. Now 'tis evident we have no motive leading us to the performance of promises, distinct from a sense of duty. If we thought, that promises had no moral obligation, we never shou'd feel any inclination to observe them."

  Three things I can't get past:

  1. Who is he actually arguing against? He says the act of the mind in promising would have to be "the willing of that obligation," and that this is absurd because willing can't manufacture new sentiments. But does anyone hold that a promise is a bare act of will that conjures a new moral quality? Or is he just taking the ordinary thought that we're "bound by our own consent" and reading it as that absurd view? And even if obligation can't come from the will alone, why is that supposed to exhaust the options — why couldn't it come from something else the promising does, like the other person's reliance on me?

  2. That third bit looks circular to me. He seems to assume the only possible motive for keeping a promise is either a natural passion or a sense of duty, then uses the fact that we need a prior sense of duty to prove that promise-keeping isn't a natural virtue. Isn't that assuming the conclusion? How do people who think he's right get out of this?

  3. If a promise is "altogether unintelligible" on its own and turns out to be a "human invention, founded on the necessities and interests of society," what's left of the thing I felt when I let my flatmate down? Does Hume think there's a real obligation there, or does it come down to "we keep promises or we get shut out", which sounds prudential rather than moral?

  Please don't just give me a tidy summary of his theory of the artificial virtues — I want your honest read on whether the argument actually works, and where it's weakest. And if I've misread what he's doing, or I'm asking for something the text doesn't give a clean answer to, tell me straight instead of humouring me.
