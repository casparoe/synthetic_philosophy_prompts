answer: |-
  Right then, let's ditch Otto and his dusty notebook. Here’s a fresh case designed to your spec:

  **The Case: Maya and the Childcare Whiteboard**

  Maya manages the complex, shifting childcare schedule for her two young children. A large whiteboard hangs prominently in the kitchen. It lists *only* the children's current weekly club times and locations (e.g., "Leo - Swimming, Tues 4pm, Community Pool"), meticulously updated every Sunday based on emails from the clubs. Maya consults this board multiple times daily, without fail, to know *where each child needs to be and when*. She never attempts to internally memorise these details once written; the board *is* the schedule. When asked where Leo is on Tuesday, she automatically looks at the board and reports "Swimming at the Community Pool, 4pm". Without the board, she would be completely lost regarding the specifics for the week.

  **The Walkthrough:**

  1.  **Extended Mind Thesis (Clark & Chalmers Line):** They argue Maya's belief about Leo's swimming *is* stored on the whiteboard. The reasoning is:
      *   **Functional Role:** The information on the board plays *the very same functional role* as a biological memory belief would. It’s reliably available when needed (constant access through perception), directly guides action (telling her where to take Leo), and is automatically endorsed (she reports it without second thought).
      *   **Parity Principle:** If an identical process of automatic, reliable retrieval and action-guidance happened entirely within her brain (e.g., a vivid, automatically recalled mental image of the schedule), we'd unquestionably call it a belief. The fact the reliable resource is external (the board) shouldn't matter if it's deeply integrated and functions *as* her memory system for this specific domain. The board isn't just a prompt; it's where the belief *resides*.
      *   **Verdict:** The belief that "Leo has swimming at the Community Pool at 4pm on Tuesday" is one of Maya's beliefs, stored in the extended cognitive system comprising Maya + whiteboard.

  2.  **Coupling-Isn't-Constitution Objection:** They argue the whiteboard is merely *coupled* to Maya's cognition, not *constitutive* of it.
      *   **The Core Distinction:** Cognition happens *inside* Maya. The whiteboard is an external *input* to her cognitive system. Consulting the board involves perception (seeing the writing), interpretation (understanding the symbols), and belief formation *within her mind* ("Ah, it says swimming at 4pm, so that's where he is"). The board *causes* her to form an internal belief, but the belief itself, and the cognitive process of *knowing*, occur within her skull.
      *   **Why it's not Constitution:** Merely using an external resource reliably and automatically doesn't make it *part* of the mind. A calculator isn't part of your cognition when you do maths, it's a tool you use. Similarly, the board is a highly reliable tool Maya *uses* to form beliefs. The actual cognitive state (the belief) is internal, generated *in response to* the external stimulus.
      *   **Verdict:** Maya *forms* a belief *based on* the whiteboard. The belief "Leo has swimming..." is *her* belief, but it is stored internally *after* consulting the external resource. The whiteboard itself does not literally contain her belief; it contains information she uses to form the belief cognitively.

  3.  **The Single Feature Doing the Work:** The crucial feature is **the absence of parallel internal tracking**. Maya *does not* internally maintain *any* representation of the schedule details *once they are written on the board*. She relies *exclusively* on the external resource for this specific information.

  4.  **Flipping the Feature:**
      *   **Remove/Reverse It (Internal Tracking Exists):** Suppose Maya *also* makes a faint internal mental note of the key times/locations when she writes them, even if she primarily uses the board. Now, the Extended Mind argument weakens significantly. Why? Because the functional role *isn't* solely played by the external resource – there's a parallel internal process potentially capable of supporting the belief. The Constitution objection gains strength: the board might just be a convenient reminder triggering the *internal* memory trace, reinforcing the coupling view. The case collapses towards a standard "external prompt" scenario, less compelling for extended cognition than Otto (where Otto has *no* internal memory at all).
      *   **Reinforce It (Sole Reliance):** Emphasise that Maya *deliberately offloads* the storage completely. She *could* try to remember internally, but actively chooses *not* to, making the board the sole repository. This *strengthens* the Extended Mind claim (it's clearly functioning *as* her memory) and *highlights* the Constitution objection's core point (it's *still* external, so it can't *be* her mind, only influence it).

  5.  **Potential Rigging Charge & Defence:** A defender of Extended Mind might say you've rigged it by *stipulating* "no parallel internal tracking" precisely to *force* the functional equivalence needed for parity. They might argue this is artificial – perhaps *some* faint internal trace always exists, or that the demand for *absolute* absence is too strong/unrealistic. They might say you've defined the feature *to get* the disagreement, rather than letting it emerge naturally.
      *   **Counter/Defence:** The case highlights a *plausible, real-world strategy*: deliberate, complete cognitive offloading for managing complex, volatile information. People *do* this (e.g., relying solely on a shared work calendar, a medication dispenser's timer, or *this* whiteboard). The stipulation isn't arbitrary; it's describing a specific cognitive *strategy* where the external resource takes on the *functional role* of memory storage. The point is to isolate *this specific condition* (sole functional reliance) as the battleground feature *distinct* from location. The rigging charge might stem from discomfort with how clearly this feature exposes the fundamental disagreement.

  6.  **Takeaway Beyond Otto:**
      *   **Beyond Location & Gadgets:** This moves past arguing *just* about location (skull vs. world) and familiar tech (notebooks/phones). It focuses on a mundane, non-digital object (a whiteboard) and a very ordinary cognitive strategy (deliberate offloading).
      *   **The Crux is Functional Role & Integration:** It starkly illustrates that the debate hinges on *how* the external resource is integrated and *what specific functional role* it plays in the cognitive system's operation. Is it *performing the function* of memory storage/belief holding (Extended Mind), or is it merely a highly reliable input *to* internal memory/belief formation (Constitution)?
      *   **The Strategy of Offloading:** It highlights that the *intentional strategy of the agent* (choosing *not* to maintain an internal duplicate) is a critical factor in evaluating whether extension occurs, pushing beyond Otto's passive biological impairment.
      *   **Real-World Nuance:** It feels more grounded in everyday cognitive labour (like care work organisation) than Otto's medicalised example, showing the debate's relevance to common practices.

  This case forces the group to grapple with the *functional criteria* and the *nature of reliance* much more sharply than Otto, using a relatable domestic scenario and a simple, non-technical prop. The disagreement isn't settled by pointing at the skull, but by arguing about whether the whiteboard's role *is* or *isn't* genuinely the functional equivalent of an internal memory store.
