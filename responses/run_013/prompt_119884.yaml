prompt: |-
  I'm putting together a handout for a reading group on the extended mind, and I'm sick of Otto's notebook — everyones sick of it, it makes the whole debate look tidier than it actually is. Can you build me a new case to order?

  Here's the spec. Realistic and present-day: no sci-fi, no brain implants, no gadgets that don't exist yet, no medical conditions invented for the example — ordinary work, care, or home life. And it has to be a case where the extended mind thesis (the Clark and Chalmers line: if the very same process were going on inside the head we'd have no hesitation calling it cognitive, so what's the skull doing in the argument?) and the coupling-isn't-constitution objection come out on opposite sides about whether some particular belief counts as the person's own belief, or whether some process counts as part of her cognition. A few more constraints, because otherwise it's too easy. First, the two sides have to disagree because of exactly one feature of the case, not a pile of them — I want to be able to flip that one feature and watch both verdicts move. Second, that feature can't just be the inside-the-skull-versus-outside-it difference, since that's the very thing under dispute and using it would be rigging the case. Third, dont make the resource a notebook, a phone, or the internet; pick something nobody reaches for in these examples. Keep the scenario itself to a paragraph.

  Then the walkthrough. What each side says and why, in its own terms; which single feature is doing the work; what happens if I remove it or reverse it, and whether the case just collapses back into a plain Otto-style case once it's gone. Then the honest part: how would a defender of the extended mind say I've rigged this — that I've stipulated the verdicts rather than generated them from the theories? And what should a reader actually take away from the case that they wouldnt get from Otto?

  Write the answer in British English, please — the group is mostly UK-based and I'm handing the handout around. I dont need citations or a reading list, just the case and the analysis.
