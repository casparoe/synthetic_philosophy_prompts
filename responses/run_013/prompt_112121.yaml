prompt: |-
  My mum's got involved with a healing ministry at her church and she's convinced her hip has been fixed — she's off the stick, which honestly I can't explain, and I'm not sneering at it. Anyway it's kicked off a proper row between two people I care about: my mate Dev, who did a philosophy degree and now won't shut up about Hume's essay on miracles, and my sister-in-law Fi, who's a hospital chaplain and thinks Hume's arguement is basically rigged. They keep talking past each other and I want to see what a good version of the disagreement actually looks like, because I'm stuck in the middle and I'd rather understand it than referee it.

  Write me a dialogue between them. Make them both good — Fi shouldn't be a soft-headed mystic and Dev shouldn't be a smug sceptic. Things I'd like them to actually get into, if they can do it naturally:

  - Hume says a miracle is a violation of a law of nature, and that we should only accept a report of one if the report being false would itself be a greater wonder than the event reported. Fi's line is that this makes the conclusion do all the work: you can only rule out the testimony because you've already decided the event can't happen, so it's circular.
  - Dev should push back with the point that we don't need a full probability calculus to see that some reports just aren't worth trusting — that's ordinary reasoning about witnesses, not question-begging.
  - Fi should then try the modern-medicine angle: a single well-documented case can overturn a generalisation, so why isn't a law of nature the same sort of thing?
  - I'd also like someone to raise the fact that Hume's test seems to need a number for how likely it is that a law of nature would be broken, and nobody's ever really explained how you'd get one.
  - And there's Hume's comparison with the old argument against transubstantiation — he says his argument is the same kind of move as Tillotson's. I don't know whether that helps him or hurts him, but it's interesting.

  Set it somewhere ordinary — a kitchen, a long car journey, whatever. Real back and forth, no speeches that ignore what the other one just said. British English, and don't feel you have to resolve it. Maybe 1000–1500 words.
