  Okay, let me tackle this user's query about Aquinas's omnipotence argument. The user is a science and ideas reporter working on a piece about the stone paradox, specifically focusing on Aquinas's text in Summa Theologica. They need help understanding two key passages and have three additional questions. 

  First, I need to unpack Aquinas's distinction between two types of possibility. He rejects the first sense (possible relative to created power) because God's power surpasses creation. The second sense—absolute possibility based on logical consistency—is what matters. Aquinas avoids circularity by grounding possibility in logical compatibility rather than divine power itself. 

  The user wants to know why Aquinas insists it's better to say contradictions "cannot be done" rather than "God cannot do them." This isn't just wording; it shifts the limitation from God's ability to the nature of possibility itself. Contradictions aren't "things" to be done—they're conceptual impossibilities. 

  For the three follow-ups: The vicious circle objection is cleanly avoided because Aquinas defines possibility independently of God's power. The "cannot be a word" point is crucial—if contradictions are unthinkable, they can't even be proposed as actions. If non-classical logics allow true contradictions, Aquinas's framework collapses unless he redefines possibility. Lastly, God's inability to sin fits perfectly: sin is incompatible with God's nature, making it absolutely impossible—same logical category as squared circles. 

  The reporter's deep focus on the text suggests they want precision, not summaries. I'll emphasize how Aquinas builds his case brick-by-brick, especially how he escapes circularity by anchoring possibility in logic rather than divinity. The colleague's non-classical logic challenge is worth flagging as a fundamental threat to the system.
answer: |-
  Here's a close reading of Aquinas's argument in *Summa Theologica* I, Q25, A3, focusing on the structure, key distinctions, and the rationale behind his moves, as requested:

  **The Core Argument: Defining Omnipotence via "Possible Absolutely"**

  1.  **The Problem:** Everyone agrees God is omnipotent ("can do all things"), but the meaning of "all" is ambiguous. What constitutes the set of "all things"?

  2.  **The Link Between Power and Possibility:** Power (*potentia*) inherently relates to the possible (*possibile*). Therefore, "God can do all things" must mean "God can do all *possible* things."

  3.  **Two Senses of "Possible" (Aristotle's Distinction):**
      *   **Possible Relative to a Power (Secundum quid):** "X is possible" means "X is achievable by some specific power" (e.g., "Flying is possible for birds," "Building a house is possible for humans").
      *   **Possible Absolutely (Simpliciter):** "X is possible" means "X is not self-contradictory." This possibility doesn't depend on any *specific* power but on the intrinsic logical compatibility of the concepts involved.

  4.  **Rejecting Omnipotence Defined by Created Power:** Defining God's omnipotence as the ability to do all things possible *to created nature* (the first sense) is inadequate. God's power transcends created powers; He can do things nature cannot (e.g., create *ex nihilo*, resurrect the dead).

  5.  **Rejecting the Vicious Circle:** Defining omnipotence as the ability to do all things possible *to God's power* is circular. It reduces to "God is omnipotent because He can do whatever He can do." This tells us nothing about the *nature* or *extent* of His power.

  6.  **The Solution: Omnipotence Defined by Absolute Possibility:** Therefore, the only coherent definition is that God is omnipotent because He can do all things that are "possible absolutely." His power extends to the absolute limits of logical coherence.

  7.  **Defining "Possible Absolutely":** A thing (state of affairs, proposition) is "possible absolutely" if the predicate is **not incompatible with the subject**. It's a matter of **logical non-contradiction** within the proposition itself.
      *   *Possible:* "Socrates sits." (Sitting is compatible with being Socrates).
      *   *Impossible:* "A man is a donkey." (Being a donkey is incompatible with being a man; the concepts contradict).

  **The Stone Paradox Resolution & Why the Wording Matters**

  8.  **The Limitation of Omnipotence:** Omnipotence does not extend to things that are *absolutely impossible*, i.e., things involving logical contradiction.
      *   **Reason:** Not due to any lack in God's power ("defect in the power of God"), but because the contradictory thing "has not the nature of a feasible or possible thing." It's *inherently incoherent*.

  9.  **The Crucial Redescription:**
      *   **Problematic Phrasing:** "God cannot make a stone too heavy for Himself to lift." This *sounds* like a limitation on God's power.
      *   **Aquinas's Preferred Phrasing:** "Such things [like making a self-contradictory stone] *cannot be done*." This locates the limitation not in God, but in the *intrinsic nature* of the proposed action. It's not that God *fails*; it's that the task is *meaningless nonsense*.

  10. **Why this Redescription?**
      *   **Substance, not Mere Wording:** Aquinas insists this is more than just phrasing; it reflects the *ontological status* of contradictions. They aren't genuine "things" or "actions" that *could* be done but aren't. They are *conceptual impossibilities*.
      *   **What Gets Relocated:** The "problem" is relocated from being a *failure of divine ability* to being an *error in our conception*. We are trying to ascribe "thing-hood" or "action-hood" to something that inherently lacks it – a contradiction.
      *   **What is Preserved:** God's power remains genuinely infinite, extending to *everything that is genuinely possible*. No genuine possibility lies outside His power. The seeming limitation is only on the side of conceptual coherence, not divine capacity.

  11. **Scriptural Support & the Role of the Intellect:** Aquinas reinforces this with Luke 1:37 ("No word shall be impossible with God").
      *   **Key Point:** A contradiction "cannot be a word, because no intellect can possibly conceive such a thing."
      *   **Commitment:** Aquinas is committed to the principle of non-contradiction as foundational to *all* thought and reality. A contradiction isn't just false; it's *unintelligible*. It cannot be coherently expressed ("word") or conceived ("intellect"). It falls outside the realm of meaningful discourse or possibility *entirely*.

  **Addressing Your Further Questions:**

  1.  **Does he escape the vicious circle?**
      *   **Yes, successfully.** The circle was: Defining God's power as "able to do what He can do." Aquinas escapes by grounding "possible" *independently* of God's power in the **absolute possibility based on non-contradiction**. He defines the *domain* of God's omnipotence (all non-contradictory things) using a logical standard external to the concept of divine power itself. His power is then defined as co-extensive with *that* domain. The definition relies on logic, not a circular reference to divine power.

  2.  **The "cannot be a word" claim and Non-Classical Logics:**
      *   **Load-Bearing?:** Absolutely. Aquinas's entire argument rests on the Principle of Non-Contradiction (PNC) as an absolute, universal, and necessary law of being and thought. Contradictions are *impossible* because they are *unthinkable* and *unspeakable* in a fundamental way.
      *   **If PNC Fails?:** If true contradictions are possible (as in some paraconsistent logics), Aquinas's foundation crumbles. "Possible absolutely" could no longer be defined purely by non-contradiction.
      *   **What Would Need to Change:** To salvage the *structure* while accepting true contradictions, Aquinas would need a radically different grounding for "possible absolutely." He would need a criterion defining the limits of possibility *other than* strict non-contradiction, while still maintaining that God can do everything within *that* domain. The core move – locating the limitation in the nature of possibility rather than God's power – *could* potentially remain, but the *content* of what counts as possible/impossible would fundamentally change. The argument's elegance and reliance on classical logic would be lost. Aquinas would likely see this as abandoning reason itself.

  3.  **God's Inability to Sin:**
      *   **Continuous with the Argument:** This is a direct application of the same principle. Sinning implies a defect or failure. God, by definition (as Pure Act, Perfect Being), is without defect or potential for failure. Therefore:
          *   *Subject:* God
          *   *Predicate:* Sins / Performs a defective act.
          *   *Compatibility?* Utterly incompatible. The predicate contradicts the essential nature of the subject.
      *   **Conclusion:** "God sins" is a contradiction in terms (like "man is a donkey"). Therefore, it is *absolutely impossible*. God's inability to sin is not a lack of power, but a necessary consequence of His supreme perfection and goodness – a perfection that makes the concept "God sins" nonsensical. It falls under the same category as any other logical impossibility excluded from omnipotence.

  **The Argument's Joints - A Summary Reconstruction:**

  1.  **Premise:** Omnipotence = ability to do all *possible* things.
  2.  **Distinction:** "Possible" has two senses: relative to a power vs. absolute (logical non-contradiction).
  3.  **Rejection 1:** Omnipotence can't be defined by created power (too limited).
  4.  **Rejection 2:** Omnipotence can't be defined by divine power alone (vicious circle).
  5.  **Solution:** Omnipotence = ability to do all absolutely possible things (non-contradictory states of affairs).
  6.  **Implication:** Contradictory "things" are intrinsically impossible, not objects of power.
  7.  **Redescription Principle:** Say "contradictions *cannot be done*" not "God *cannot do* them" (limitation is in the thing, not the power).
  8.  **Foundation:** Contradictions are inconceivable/unutterable (PNC is absolute).
  9.  **Corollary:** Inabilities arising from perfection (e.g., cannot sin) are instances of logical impossibility, confirming rather than contradicting omnipotence.

  Aquinas's resolution is a powerful argument that omnipotence, coherently understood, encompasses all that is logically coherent, while "limitations" involving contradictions reflect not a lack of divine power, but a lack of sense in the purported task itself. The stone puzzle dissolves because the "stone too heavy for an omnipotent being to lift" is revealed as a contradiction disguised as a meaningful object.
