    However, note that the set theorist might also consider the possibility of extending the natural numbers with an infinite element ω and then ask what the state is at ω. But that is going beyond the given trace. In the given trace, we are only considering the states at natural numbers. So the set theorist would say that the sequence of states at natural numbers is uniquely determined.

