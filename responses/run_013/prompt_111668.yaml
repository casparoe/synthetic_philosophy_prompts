  Variant 2 (non-settling):
    - At step n, set `f` to 0 if n is even, and 1 if n is odd. This alternation continues forever.

  We can describe the state at step n as (c_n, f_n). Then:
    - In Variant 1: 
          c_n = n
          f_n = (n mod 2) for n <= 100, and 0 for n > 100.
      So after step 100, the state of `f` is fixed at 0 and the counter keeps increasing.

