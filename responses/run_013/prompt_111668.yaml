  But note: in Variant 1, the set theorist might also say that the limit of the state exists (if we think of the state as having a limit when the flag stabilizes) but that is an additional structure. The finitist might be more comfortable with Variant 1 because they can make the statement about the flag without needing the entire sequence: they can say "after step 100, f is always 0" and that is a finite statement about each step beyond 100. However, they still would not accept the entire sequence as a completed object.

