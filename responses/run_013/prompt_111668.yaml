    However, note that the finitist in this scenario does not deny that we can reason about the entire execution by using quantifiers that range over all natural numbers. They might accept that the statement "for every n, at step n the state is (n, f_n)" is meaningful because it is a statement about each finite n. But they would deny that we can form the set of all these states as a completed infinity.

