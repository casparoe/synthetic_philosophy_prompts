prompt: |-
  I hold a two-year postdoctoral fellowship in the philosophy of biology. It gives me time and a modest workshop budget, but no capacity to gather or generate data of my own, and my training is in formal methods — I am comfortable with the Price equation, contextual analysis, and the surrounding population-genetic machinery, but I will not be producing new empirical results. I want to spend the two years on a single conceptual question within the units-of-selection debate, and I am trying to work out which one is genuinely worth the time. I would like your help in setting the agenda.

  Two things shape how I now see the field, and I would rather you engage with them than talk around them.

  First, a colleague has proposed that we stop asking whether groups (or genes, or individuals) are "units of selection" and ask instead a narrower question: at which level must selection be invoked to explain a trait, given that any change can in principle be redescribed at a lower level? Her suggested test is that a higher-level unit is doing genuine explanatory work only when the lower-level description would have to mention the higher-level entity's own fitness in order to get the direction of change right. I suspect this test is circular or under-specified — that it merely relocates the original dispute rather than resolving it — but I cannot yet say precisely why, and I do not know whether the field has a better way of cashing out what "doing explanatory work" amounts to here.

  Second, I keep noticing that arguments in this debate slide between at least three different questions: which entity bears adaptations; which level's fitness accounting best predicts evolutionary change; and which level we must cite in a causal explanation of a trait. I suspect much of the disagreement consists of people answering different questions while using the same words, but I also suspect there is a residue that survives the disambiguation.

  Given all that: which open questions in the units-of-selection debate most deserve a philosopher with two years, a formal bent, and no data? I want a defended agenda, not a survey. For each question you nominate, say why it is upstream of other work, how tractable it is for someone working conceptually and formally rather than empirically, how neglected it currently is, and how many other live disputes an answer would settle or reframe. Where two questions are competing for the same two years, say which you would drop and why. Then tell me what would have to happen — what argument, counterexample, or formal result — for the ranking to change. Please treat the claim that the whole debate is a merely verbal dispute as one candidate answer and say what it would take to establish it, rather than setting it aside.

  Please write in British English, and do not give me a reading list or citations; I will find the literature myself.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy of biology postdoc with formal training, seeking to identify the most valuable conceptual question in the units-of-selection debate for a two-year project. Their constraints are clear: no empirical data collection, strong formal skills (Price equation, contextual analysis), and skepticism about current approaches.

  First, I need to unpack their two framing concerns:
  1) Their colleague's proposed "explanatory necessity" criterion - where higher-level selection is valid only if lower-level descriptions must reference higher-level fitness to predict evolutionary change direction. The user suspects this relocates rather than resolves the dispute.
  2) The persistent conflation of three distinct questions: adaptation-bearing entities, predictive fitness accounting, and causal explanation. They believe disambiguation leaves substantive disagreement.

  The challenge is to identify a question that:
  - Engages deeply with these concerns
  - Uses formal methods without empirical data
  - Has high leverage in settling multiple disputes
  - Is currently under-addressed
  - Is tractable in two years

  I'm considering several angles:
  The colleague's proposal seems vulnerable to circularity because "fitness" at any level already presupposes a unit of selection. This connects to the deeper issue of whether "fitness" can be defined independently of the chosen decomposition. 

  The tripartite distinction (adaptation/prediction/causation) suggests most debates conflate:
  - Teleological claims (adaptations for group benefit)
  - Mathematical adequacy (Price partitioning)
  - Mechanistic accounts (multilevel causation)

  The core opportunity lies in rigorously disentangling these and showing which conflations sustain apparent disagreements. Specifically:
  1) Formalize what makes an explanation "causal" versus merely predictive in multilevel frameworks
  2) Examine whether "fitness" requires presupposing units, making the colleague's test question-begging
  3) Demonstrate through formal counterexamples where disambiguation dissolves disputes

  The most promising approach might be developing a unified formal account showing precisely how answers to the three questions diverge under different biological scenarios. Key moves would include:
  - Using contextual analysis to generate cases where predictive and causal accounts come apart
  - Proving that no non-circular fitness definition can satisfy the colleague's criterion
  - Showing that "adaptation" claims reduce to either prediction or causation once disambiguated

  This tackles the user's skepticism directly: if after disambiguation and formal analysis only verbal disputes remain, that's a significant result. If substantive issues persist, their nature becomes clear. The project would be tractable using existing formal tools, under-explored in current literature, and would reframe multiple debates simultaneously.
answer: |-
  Based on your constraints and framing concerns, here’s a defended agenda prioritising the question with the highest conceptual payoff for your skills and timeframe. I’ll address your colleague’s proposal and the tripartite conflation directly, then rank options.

  **Core Recommendation: Formalise and Test the "Explanatory Necessity" Criterion**  
  *Focus:* Rigorously dissect your colleague’s test—**when must a lower-level description invoke higher-level fitness to correctly predict evolutionary direction?**—using formal tools to expose circularity or salvage it.  

  **Why this deserves your two years:**  
  1.  **Upstream Leverage:** This question sits at the nexus of your two concerns. If her criterion holds, it resolves ambiguity about "explanatory work" and clarifies which of the three conflated questions (prediction vs. causation) is fundamental. If it fails, it forces a better account of what *does* make higher-level selection irreducible.  
  2.  **Tractability:** Perfect for formal methods. Use Price/contextual analysis to:  
      - Model scenarios where group structure affects change *only* through aggregate individual fitness (trivially reducible).  
      - Construct cases where lower-level equations *must* reference group fitness (e.g., strong emergent group effects uncorrelated with individual fitness).  
      - Test if her criterion *presupposes* a privileged level (circularity risk).  
  3.  **Neglect & Impact:** While "irreducibility" is discussed, her specific "directional prediction" test is underexplored formally. Succeeding here would:  
      - Cut through the tripartite conflation by showing prediction *is* causation (if her test works) or forcing their decoupling (if it fails).  
      - Settle disputes about "emergent group fitness" in major cases (e.g., insect colonies vs. trait-group selection).  
      - Make debates about "adaptations" downstream: if higher-level selection is irreducible, it can bear adaptations.  

  **Competing Questions (and why to drop them):**  
  - *"Clarifying the three questions (adaptation/prediction/causation)":* **Drop.** While vital, this is largely diagnostic. Formal disambiguation alone won’t resolve the *substantive* residue; it just maps the battlefield. Your colleague’s criterion offers a direct attack on the residue.  
  - *"Is group fitness ever more than an aggregate?":* **Drop.** This is subsumed. If her test holds, "group fitness" is irreducible in key cases. If not, it’s epiphenomenal.  

  **What would change this ranking?**  
  - If you found an *existing* formal proof that her criterion is equivalent to established approaches (e.g., contextuality in Price partitioning), making novel work redundant.  
  - If a counterexample *clearly* showed her test is both necessary and sufficient for explanatory irreducibility across paradigms (e.g., in MLS1/MLS2), cementing it as the solution.  

  **Addressing the "Merely Verbal" Claim:**  
  To establish the debate is wholly verbal:  
  1. Prove that *all* apparent disagreements dissolve under disambiguation *and* that no formal criterion (like your colleague’s) can non-arbitrarily privilege one level’s "causality".  
  2. Show that "explanatory necessity" is always perspective-dependent (e.g., gene vs. individual vs. group descriptions are equally valid if predictively adequate).  
  *What it would take:* A formal model where the *same* evolutionary change is:  
  - Best predicted at different levels in different decompositions, *and*  
  - No level’s fitness is indispensable for directional accuracy, *and*  
  - No causal account is objectively "truer" (e.g., via interventionist criteria).  
  *Your project’s role:* Actively test this by modelling whether your colleague’s criterion *fails universally*. If it does, the verbal dispute gains credence.  

  **Execution Strategy:**  
  **Year 1:** Formalise the criterion. Build models:  
  - Reducible case (e.g., soft selection): Individual fitness suffices; group fitness is derivative.  
  - Putative irreducible case (e.g., group adaptation with conflict suppression): Can direction *only* be predicted by embedding group fitness?  
  - "Trap case": Where group fitness appears necessary but is covertly reducible (exposing circularity).  
  **Year 2:** Generalise results. Test against:  
  - Causal intuitions (e.g., Woodward-style interventionism).  
  - Adaptation claims: Does irreducibility under your criterion align with "group adaptations"?  
  - The tripartite conflation: Show how your answer subsumes or reframes the three questions.  

  **Why this over alternatives?** It directly engages your scepticism about your colleague’s proposal while leveraging your formalism to either redeem a powerful criterion or expose a deeper problem. It forces clarity on whether "explanatory necessity" is substantive or circular—and by extension, whether the debate’s residue is verbal or not. The outcome reframes the field, regardless of which way your analysis falls.
