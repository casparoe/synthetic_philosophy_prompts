answer: |-
  **Research Question:** What constrains the grain of physical kinds relevant for determining whether a functional state is multiply realized?

  **Context and Openness of the Question:**  
  The debate concerning multiple realizability (MR) appears stalemated. Type-identity theorists historically argued that mental states *are* physical states, implying that MR is rare or non-existent (e.g., pain is C-fiber firing). Functionalists countered that MR is both possible and actual, citing diverse physical systems realizing the same function (e.g., mammalian and octopus pain systems). Recent empirical work (e.g., by Polger, Shapiro) challenges the *ubiquity* of MR, suggesting that putative cases often involve functionally relevant physical differences or shared low-level physical commonalities. Defenders of MR (e.g., Aizawa, Gillett) refine criteria to preserve its prevalence.  

  Crucially, both sides presuppose a grain of physical description but leave it unanalyzed. Identity theorists rely on a grain coarse enough to identify "the same" physical state across systems (e.g., C-fiber firing *type*), while functionalists require a grain fine enough to distinguish physically distinct realizers. Skeptics point to shared physical mechanisms at *some* level, while proponents highlight differences at *another*. This suggests the core disagreement is *meta-physical*: not about whether MR occurs, but about *which level or grain of physical description is relevant* for assessing realization claims. Existing positions do not settle this because:  
  1.  **Identity Theory** assumes a privileged grain (e.g., neurobiological types) without justifying why *that* grain is fundamental for realization.  
  2.  **Functionalism** typically treats MR as an empirical discovery, neglecting that the individuation of physical kinds (e.g., counting silicon vs. brass as "different") is antecedent to the discovery.  
  3.  **Skeptics & Proponents** argue past each other by appealing to different grains (e.g., molecular biology vs. computational architecture) without a principled reason to prefer one over the other.  

  The disjunction problem (whether disjunctive physical kinds are genuine kinds) and exclusion worries (whether realized states have distinct causal powers) further depend on grain. If grain is arbitrary, MR’s significance for mental causation and non-reductivism collapses into terminological preference. The live question is thus: *What, if anything, objectively fixes the grain?*  

  **Method (Week-by-Week):**  
  *   **Weeks 1-2: Conceptual Groundwork.** Precisely define "grain" in terms of abstraction levels (e.g., atomic vs. circuit-level vs. organ-level descriptions) and analyze paradigmatic MR claims (e.g., pain in vertebrates vs. invertebrates, computational systems) to isolate how grain choices affect MR judgments.  
  *   **Weeks 3-4: Evaluate Candidate Constraints.** Systematically assess whether grain can be fixed by:  
      *   *Causal Powers:* Does the grain track causally relevant differences? (Problem: Everything differs causally at *some* grain.)  
      *   *Explanatory Context:* Is grain determined by the explanatory project (e.g., cognitive science vs. materials science)? (Problem: Risks relativism; undermines MR’s metaphysical weight.)  
      *   *Natural Kinds:* Does physics or a "fundamental" level dictate grain? (Problem: Physics individuates finely; functional kinds may not map neatly.)  
      *   *Functional Individuation:* Does the functional specification itself constrain the required physical grain? (Problem: Functional roles may be realizable by wildly heterogeneous physical systems.)  
  *   **Week 5: Confront Collapse Scenarios.** Test if the analysis avoids two pitfalls:  
      *   *Ubiquity Collapse:* If fine grain is always relevant, everything is multiply realizable trivially.  
      *   *Rarity Collapse:* If coarse grain is always relevant, MR is impossible or vanishingly rare.  
      *   *Verbal Dispute:* If no constraint is found, the MR debate reduces to choosing useful descriptions.  
  *   **Week 6: Synthesis & Prospectus Refinement.** Formulate a thesis about the nature of the constraint (or its absence) and outline the argument for defense.  

  **Result and Failure Conditions:**  
  *   **Success:** A defensible account of what (if anything) non-arbitrarily constrains the grain for MR claims. A positive result might be: "Grain is fixed by the minimal physical structure sufficient for the functional causal profile within a domain of interest." A negative result might be: "Grain is inherently contextual/pragmatic, undermining MR’s metaphysical implications for autonomy." Success advances the debate by exposing hidden assumptions and offering a framework for evaluating MR disputes.  
  *   **Failure:**  
      *   *Conceptual Collapse:* The analysis concludes that *no* principled constraint exists, rendering MR claims purely pragmatic or verbal.  
      *   *Intractability:* The project reveals the grain problem as inseparable from unresolved issues in laws, causation, or natural kinds, making a term-length resolution impossible.  
      *   *Verbal Trap Confirmed:* The project fails if it cannot distinguish a substantive constraint from mere stipulation, even after testing against cases (e.g., brass vs. silicon adders; neural plasticity; convergent evolution). Success requires showing how a proposed constraint *objectively* resolves such cases.  

  **Scope and Honest Assessment:**  
  This prospectus addresses a *metaphysical presupposition* of the realization debate, not functionalism’s truth or mental causation’s resolution. At 1,500 words, it will:  
  1.  Define the grain problem precisely using central MR examples.  
  2.  Diagnose why existing positions presuppose but evade it.  
  3.  Outline the method for evaluating constraints, acknowledging limitations (e.g., not resolving natural kinds fundamentality).  
  4.  Specify criteria for success/failure vis-à-vis verbal disputes.  
  A term is sufficient for *this* focused meta-issue: mapping the problem space and arguing for a specific constraint (or its absence) is tractable. It does *not* aim to solve exclusion or defend functionalism wholesale, but to clarify a precondition for assessing MR’s significance. The risk of collapse is integral to the inquiry and will be confronted directly.
