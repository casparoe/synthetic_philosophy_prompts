prompt: |-
  ok so this is from a seminar I'm sitting in on (international criminal law, but we keep drifting into the philosophy of it) and I want to actually work out whether the analogy everyone keeps using survives contact.

  the analogy is basically built into the word. genocide = homicide with the victim swapped out: instead of a person it's a people, genos instead of homo. everyone leans on it. my prof says that's exactly why genocide is its own crime and not just mass murder on a big scale — you have to intend to destroy the group as a group, not merely intend to kill a lot of people, and that's the whole reason the law protects groups as such rather than only individuals (which apparently was the rival approach at the time: protect each person regardless of what group they happen to be in). and it's why asking whether something was genocide feels like a different question from asking whether mass atrocities were committed. the homicide picture hands you a victim, an act, an intent, a moment of death, and a threshold you either cross or you don't.

  but someone else in the seminar says the homicide picture is the problem, not the solution. Lemkin's own version of the concept was way broader — not one killing but a planned series of different actions aimed at the foundations of a group's existence: its institutions, language, culture, religion, economic existence, even the deliberate replacement of the victim group's national pattern with the perpetrator's — and the 1948 treaty narrowed all of that down to a short list of acts. so on her reading the analogy turns a slow erasure, a process, sometimes a policy running for generations, into a discrete criminal act.

  what I want is a real audit of the analogy, not a vibe. so: correspondence table first — what plays the person, the act, the intent, the corpse, the moment of death, the perpetrator — then where the mapping breaks, and then, separately, which of those breaks actually matter for the two jobs the analogy is being made to do here: (1) justifying genocide as a distinct crime with its own special intent requirement, and (2) the naming politics, where getting the label applied is the entire point and everyone in the room knows the label is doing political work (the protected-groups list is short and weirdly shaped, which is its own tell). then tell me whether those two conclusions survive once the disanalogies are on the table, or whether the analogy was carrying them the whole time. and say what the homicide picture quietly imports that just isn't present in the target.

  also: tell me if I've got Lemkin or the convention wrong anywhere, since I'm working off lecture notes. and say how confident you are in your main claims, and single out the one point you're least sure of. no citations or reading list needed, I can't get to a library this week anyway.
