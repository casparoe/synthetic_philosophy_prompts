  The user's main request is an "audit" of the analogy. They want a correspondence table mapping elements of homicide to genocide, identify where the mapping breaks, and assess the impact of these breaks on two aspects: (1) justifying genocide as a distinct crime, and (2) the politics of naming/labeling. They also want verification of their understanding of Lemkin vs. the 1948 convention and clarity on confidence levels.

