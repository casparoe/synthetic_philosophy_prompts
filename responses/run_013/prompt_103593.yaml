  We are designing a 90-minute session for an upper-level undergraduate seminar. The goal is for students to experience the idea that a formal system can be completely specified, yet some truths about it (like the underivability of a string) require stepping outside the system. We use the MIU system.

  Materials:
  - Handout for each student (also projected?): 
    - The MIU system:
      - Symbols: M, I, U.
      - Axiom: MI.
      - Rules:
          a. If a string ends with I, you can add U at the end.
          b. If a string starts with M, you can duplicate the part after the M (so, from Mx you can make Mxx).
          c. You can replace any occurrence of III with U.
          d. You can remove any occurrence of UU.
    - Target string: MU.
    - A blank ledger (table) with columns: String, Rule Used, Number of I's.

  - Phase-specific handouts (for phase two and beyond) to be distributed at the appropriate time.
  - Timer for the instructor.

  Grouping: 14 students in 3-4 groups (ideally 3 groups: two of 4 and one of 6? or 3 groups of 4 and one of 2? but 14 is divisible by 2 for 7 groups? But we want groups of 3-4 for collaboration. Let's do 3 groups of 4 and one group of 2? Or 4 groups: two of 4 and two of 3. Let's go with 4 groups: two of 3 and two of 4? Actually, 14/4=3.5 -> 3 groups of 4 and one group of 2? But 2 might be too small. Alternatively, 4 groups: 3 groups of 3 and one of 5? That's unbalanced. Let's do 3 groups: two of 5 and one of 4? That's 14. So 3 groups: two groups of 5 and one group of 4. We'll manage the size by having each group appoint a scribe and a spokesperson.

  Roles within each group (suggested, but flexible):
  - Scribe: records the strings and rules in the ledger.
  - Prosecutor (for phase 3): challenges the proof from the other group.
  - Facilitator: keeps the group on task and ensures everyone participates.

  Timeline (90 minutes):

  Phase 1: The Derivation Attempt (25 minutes)
  - (0:00-0:05) Introduction: 
    - Briefly state the rules and the goal (derive MU). 
    - Explain the ledger: every string they write must be derived by exactly one rule from a string already in the ledger (starting with axiom MI). They must record the string, the rule used, and the number of I's. 
    - Emphasize that they may not skip steps and that they must not write down a string that isn't derived by one of the rules from a string already in the ledger. 
    - Let them know that they will have 20 minutes to try to derive MU.
  - (0:05-0:25) Group work: 
    - Groups work on deriving MU. 
    - The instructor circulates, observes, and gently enforces the rules (e.g., if they write a string without a rule, ask them to justify it by a rule and record the rule). 
    - The ledger must be maintained. 
    - They will likely generate strings like MIU (by rule a), MII (by rule b: from MI, duplicate I -> MII), MIUIU (from MIU by rule b: duplicate IU -> MIUIU), etc. 
    - They might also get stuck in loops (e.g., MI -> MII (by b) -> MIIU (by a) -> MIIUIIU (by b) ...) or by generating strings with no I's? (But note: rule c and d can remove I's and U's, but the invariant will prevent MU).

  Phase 2: Proof Construction (15 minutes)
  - (0:25-0:30) Transition: 
    - Stop the groups. 
    - Announce that they have not found MU and that they will now try to prove that it is impossible. 
    - Distribute a handout for phase 2: 
      "Task: Write a proof that MU cannot be derived in the MIU system. 
      After writing your proof, classify it: 
        - What kind of object is your proof? (Is it a derivation in the MIU system? If not, what is it?) 
        - What system is your proof a part of? (In what system are you making your argument?)"
  - (0:30-0:40) Group work: 
    - Groups write their proof. They should be encouraged to use their ledger. 
    - The instructor circulates and observes. 
    - Many groups might notice the pattern in the number of I's. The invariant: the number of I's modulo 3 is never 0? Actually, the invariant is that the number of I's is not divisible by 3? But note: MI has one I (1 mod 3 = 1). Rule a: appending U doesn't change the number of I's. Rule b: duplicates the I's (so if you had k I's, now you have 2k I's -> modulo 3, 2k mod 3 is 1 mod 3 only if k mod 3 is 2? But we want to preserve that the number is never 0 mod 3). Actually, we note:
        Start: MI -> 1 I (1 mod 3 = 1)
        Rule a: no change -> remains 1 mod 3.
        Rule b: k becomes 2k mod 3. If k mod 3 = 1, then 2*1=2 mod 3 (not 0). If k mod 3=2, then 2*2=4 mod 3=1 (not 0). So if we start with non-zero mod 3, we stay non-zero mod 3.
        Rule c: replaces III (3 I's, which is 0 mod 3) with U, so reduces the count by 3. So if we had k I's, then after rule c we have k-3 I's. Modulo 3: (k-3) mod 3 = k mod 3 (so unchanged). But note: we only apply rule c if we have at least 3 I's? But the invariant holds because k mod 3 is the same.
        Rule d: no change to I count.
        Therefore, the invariant: the number of I's is always not divisible by 3? Actually, we have that the number of I's mod 3 is never 0? But wait: we started with 1, and then: 
          - if we have 1 mod 3, then rule b gives 2 mod 3 (because 2*1=2 mod 3).
          - if we have 2 mod 3, then rule b gives 4 mod 3 = 1 mod 3.
          - rule c: if we have 3 I's (which is 0 mod 3) then we can replace with U, but note: we can never have 0 mod 3? Because we start at 1 and the operations either preserve the mod 3 or change it from 1 to 2 or 2 to 1. Therefore, we never get 0 mod 3? But wait: rule c requires three I's. How would we get three I's? We start with 1 I. If we do rule b: 1->2. Then rule b again: 2->4 (which is 1 mod 3). Then rule b again: 1->2. Then we might do rule a and then rule b? Or we might use rule c on a substring? But note: we can get three I's by having a string that has III in it. For example, from MII (2 I's) we can't get three without duplicating again? Actually, from MII (2 I's) we duplicate to MIIII (4 I's, which is 1 mod 3). Then we can use rule c on the first three: MIIII -> MUI (because replace the first III with U, leaving I) -> MUI (which has 1 I). So the invariant holds: the number of I's mod 3 is either 1 or 2, never 0. Therefore, MU, which has 0 I's, is impossible.

    - We expect some groups to notice that the number of I's is never divisible by 3? They might not express it modulo, but they might say "the number of I's is always 1, 2, 4, 5, 7, ... but never 0, 3, 6, ..." and then note that MU requires 0 I's.

    - Some groups might write a proof by induction: 
        Base: the axiom MI has 1 I (not divisible by 3).
        Step: each rule preserves the property of having a number of I's that is not divisible by 3.

    - The classification: the proof is not a derivation in the MIU system. It is a mathematical proof about the MIU system, carried out in the metatheory (which is arithmetic).

  Phase 3: Adversarial Exchange (15 minutes)
  - (0:40-0:45) Transition: 
    - Stop the groups and ask them to exchange their proof with another group. 
    - Each group will now act as a prosecutor: try to break the proof. 
    - The instructor will also hand out an additional "proof" to each group (which is the planted bad argument). 
    - The planted bad argument: 
        Claim: MU cannot be derived because every derivable string must contain an odd number of I's. 
        Why it's bad: 
          Base: MI has 1 I (odd) -> holds.
          Step: 
            Rule a: appends U -> no change to I count -> preserves odd.
            Rule b: duplicates the part after M. If the original string had k I's (odd), then after duplication we have 2k I's -> even? Because 2 times odd is even. So it breaks: rule b can change odd to even. 
          Counterexample: from MI (odd) we can get MII by rule b: MII has 2 I's (even). So the premise that every derivable string has an odd number of I's is false. 
        But the conclusion (MU cannot be derived) is true. 
        This shows that a true conclusion does not validate a false premise.

  - (0:45-0:55) Group work: 
    - Groups read the proof they received and try to break it (find a flaw). 
    - They also read the planted proof and try to break it. 
    - The instructor circulates and helps if needed.

  Phase 4: Level-Raising Round (10 minutes)
  - (0:55-1:00) Transition: 
    - Stop the groups. 
    - Pose two questions (projected or written): 
        "1. When you proved the invariant (about the number of I's), what system were you working in? 
         2. Could there be a fact about that system that you cannot establish from inside it?"
  - (1:00-1:05) Group discussion: 
    - Groups discuss and write down their answers.

  Phase 5: Extension for Fast Groups (Optional, throughout the session)
  - For groups that finish early in any phase, they can work on: 
      "Characterize the entire set of strings that can be derived in the MIU system. What patterns do you see? What is necessary and sufficient for a string to be derivable?"
  - They can use their ledger and try to come up with a conjecture.

  Debrief (20 minutes) (1:05-1:25)
  - Structure the debrief as follows:
    a. Invariant from the ledger: 
        - Ask a group to share the number of I's in the strings they generated. Write them on the board: 1, 2, 1, 4, ... 
        - Ask: what do these numbers have in common? (They are never multiples of 3.) 
        - Then state: that is the invariant we used to prove that MU (which has 0 I's) is not derivable.

    b. The proof and its nature:
        - What kind of object was the proof? (Not a derivation in MIU, but a mathematical argument about MIU.) 
        - What system was the proof in? (Arithmetic, or natural numbers with induction.)

    c. The adversarial round:
        - Ask: did any group break the proof they were given? 
        - Then focus on the planted proof: 
            - The claim: every derivable string has an odd number of I's. 
            - But we have a string (MII) that has 2 I's (even). 
            - So the premise is false. 
            - But the conclusion (MU cannot be derived) is true. 
            - Moral: a true conclusion does not make a bad argument good.

    d. Level-raising:
        - Ask: what system were we in when we proved the invariant? (Arithmetic.) 
        - Could there be a fact about arithmetic that we cannot prove within arithmetic? 
        - Introduce (without technical details) that Gödel showed that any formal system for arithmetic (if consistent) cannot prove its own consistency. 
        - But note: we are not going into Gödel here, just the idea that every system has limits.

    e. The ledger's limitation:
        - Emphasize: the ledger of failed attempts is not a proof. It only shows that you didn't find a derivation. The proof by invariant is what gives certainty.

    f. The extension:
        - If any group worked on the extension, ask them what they found. 
        - Note: a complete characterization is harder. They might have noticed that every string must start with M and then have a sequence of I's and U's? But also the invariant (number of I's not divisible by 3) is necessary. Is it sufficient? Probably not. 
        - What is gained: a full description. What is risked: it might be wrong (if they claim sufficiency without proof) and it might be very hard to prove.

    g. General point:
        - The activity showed that to prove the underivability of MU, we had to step outside the MIU system and use arithmetic. 
        - But arithmetic itself is a formal system, and it has its own limits (as Gödel showed). 
        - This stepping out is not an escape from formality, but a move to a larger system.

    h. What the activity cannot reproduce:
        - The underivability of MU is decidable and provable in a relatively weak arithmetic. 
        - In contrast, Gödel's incompleteness shows that in any sufficiently strong formal system, there are statements that are true but not provable within that system. 
        - The invariant here was found by examining the rules and the state (number of I's), but in more complex systems, finding invariants (or proving independence) can be extremely hard and sometimes impossible (in the sense of being independent of the axioms). 
        - The flash of insight (finding the invariant) is not staged: we only worked through the aftermath.

    i. Concluding remark: 
        - The idea that formal systems have limits and that we can step outside one system into another (which also has limits) is a profound one, and the MIU system is a simple example to experience it.

  Predictable Problems and Solutions:

  1. Groups filling the ledger with the same strings repeatedly:
     - Solution: Encourage them to try different rules and different starting points. Ask: "Have you tried starting from a different string in your ledger?" or "What rules have you not applied to this string?"

  2. Illegal steps:
     - Solution: The instructor should monitor and correct. If a group writes a string without a valid rule, ask: "Which rule did you use? How does it apply?" and have them check the conditions.

  3. Conflating "we have not found it" with "it cannot be found":
     - Solution: In the debrief, explicitly contrast the ledger (which is just a record of attempts) with the invariant proof (which is a guarantee). During the activity, if a group says "it's impossible because we tried everything", challenge them: "How do you know you tried everything? Could there be a very long derivation you missed?"

  4. Group stumbles on the invariant early:
     - Solution: Give them the extension (characterize the entire set) early. Or ask them to write a rigorous proof of the invariant and then try to break it.

  5. Prosecutor role being ignored or misused:
     - Solution: Explain the role clearly: "Your job is to find any flaw in the proof. Be critical but constructive." If a group is too aggressive, remind them the goal is learning.

  6. Wide spread in time:
     - Solution: Have the extension ready. Also, during the derivation phase, if a group finishes early (or gives up early), ask them to try to derive other strings or to think if there's a pattern. In phase 2, if a group finishes the proof quickly, ask them to write it formally.

  What the Activity Cannot Reproduce:
  - The underivability of MU is provable in a straightforward way. In contrast, Gödel's incompleteness theorem shows that for any consistent formal system of a certain strength, there is a statement that is true but unprovable in that system. This is a deeper limit.
  - The invariant was relatively easy to find. In real cases (like the consistency of arithmetic) there is no known invariant that we can express and prove in a simple way.
  - The metatheory (arithmetic) we used is uncontroversial and consistent (as far as we know). But Gödel shows that we cannot prove the consistency of arithmetic within arithmetic.
  - The flash of insight: we cannot stage the moment of discovery, only work with the aftermath.

  Instructor note: During the debrief, be clear that the real bite of the idea comes from undecidable problems and incompleteness, which are more complex. The MIU system is a toy model that illustrates the concept of stepping outside, but it does not illustrate undecidability or unprovability in the sense of Gödel. You have to supply this context by mentioning that in more complex systems, we encounter true statements that cannot be proven within the system, and that the stepping out might not always lead to a complete answer.

  Handout for Phase 1 (given at the beginning):

  MIU System

  Symbols: M, I, U.

  Axiom: MI

  Rules:
  1. If a string ends with I, you can add a U at the end.
  2. If a string starts with M, you can duplicate the part after the M. For example, from Mx you can make Mxx.
  3. You can replace any occurrence of III with U.
  4. You can remove any occurrence of UU.

  Target string: MU

  Ledger:

  | String | Rule Used | Number of I's |
  |--------|-----------|--------------|
  | MI     | (axiom)   | 1            |
  | ...    | ...       | ...          |

  Handout for Phase 2 (distributed at 25 minutes):

  Task: 
  Write a proof that MU cannot be derived in the MIU system.

  After writing your proof, answer:
  1. What kind of object is your proof? (Is it a derivation in the MIU system? If not, what is it?)
  2. In what system is your proof taking place? (What system are you using to make your argument?)

  Handout for Phase 3 (distributed at 40 minutes):

  Adversarial Round:

  You will receive a proof from another group and an additional proof (provided by the instructor). 

  Your task:
  - For each proof, try to break it: find a flaw in the reasoning. 
  - Is there a step that does not follow? 
  - Is there a counterexample to a claim?

  The additional proof (planted bad argument):

  Proof that MU cannot be derived:
  We claim that every derivable string in the MIU system has an odd number of I's. 
  - The axiom MI has 1 I (odd). 
  - Rule a: appends U, which doesn't change the number of I's, so if the string had an odd number, it still does.
  - Rule b: duplicates the part after M. If the original string had k I's (odd), then after duplication we have 2k I's. But 2 times an odd number is even, so the new string has an even number of I's. This contradicts the claim? Actually, we see that rule b does not preserve oddness. Therefore, we must check if rule b is allowed? But note: we have an example: from MI (odd) we can get MII (even). So the claim that every derivable string has an odd number of I's is false. However, the conclusion (MU cannot be derived) is true because MU has 0 I's (even) and if the claim were true then MU would be excluded. But the claim is false. Therefore, this proof is invalid.

  Note: The instructor should make sure to explain that the flaw is in the premise (the invariant claim) and that a true conclusion doesn't save a bad argument.

  Phase 4: Level-Raising Round (no handout, just the questions on the board or spoken)

  Questions:
  1. When you proved the invariant (about the number of I's), what system were you working in?
  2. Could there be a fact about that system that you cannot establish from inside it?

  Extension (for fast groups):

  Task: 
  Characterize the entire set of strings that can be derived in the MIU system. 
  - What patterns do you observe? 
  - What properties must a string have to be derivable? 
  - What properties are sufficient? 
  - Try to write a conjecture.

  This completes the design.
answer: |-
  ### MIU System Activity Design for 90-Minute Seminar  
  **Core Idea:** Students experience that proving a system's limitation (MU is underivable) requires stepping outside it into a metatheory, which itself has limits.  

  ---

  #### **Materials**  
  1. **Handout (Phase 1)**  
     - **Symbols:** M, I, U.  
     - **Axiom:** MI.  
     - **Rules:**  
       - (a) If a string ends in I, add U at the end.  
       - (b) If a string starts with M, copy everything after the M (e.g., MI → MII).  
       - (c) Replace III with U anywhere in the string.  
       - (d) Delete UU anywhere in the string.  
     - **Target String:** MU.  
     - **Ledger Table:**  
       | String | Rule Used | Number of I's |  
       |--------|-----------|---------------|  
       | MI     | (Axiom)   | 1             |  
       | ...    | ...       | ...           |  

  2. **Phase 2 Handout**  
     - *Task:* "Prove MU cannot be derived. Then answer:  
       - What kind of object is your proof? (e.g., a derivation inside MIU?)  
       - What system is your proof part of?"  

  3. **Phase 3 Materials**  
     - **Plant a Bad Proof** (Instructor’s script):  
       *"Proof: MU is underivable because every derivable string has an odd number of I’s. MI has 1 I (odd). Rule (a) preserves oddness; (c) reduces I’s by 3 (odd → even); (d) and (b) can turn odd to even (e.g., MI → MII). MU has 0 I’s (even), so impossible."*  
       *(Flaw: Premise is false—MII has 2 I’s (even) and is derivable in one step. Conclusion is true, but premise is wrong.)*  

  4. **Whiteboard**  
     - For debrief: Columns for "Strings Generated," "Number of I’s," and "Proof Classification."  

  ---

  #### **Group Setup**  
  - **14 students → 3 groups (5, 5, 4).**  
  - **Roles per Group:**  
    - **Scribe:** Maintains the ledger.  
    - **Facilitator:** Ensures only rule-compliant steps are recorded.  
    - **Prosecutor (Phase 3):** Finds flaws in another group’s proof.  
    - **Spokesperson (Debrief):** Reports findings.  

  ---

  ### **Phase-by-Phase Timeline (Total: 90 Minutes)**  

  #### **Phase 1: Derivation Attempt (25 min)**  
  - **Goal:** Hit the wall trying to derive MU.  
  - **Rules:**  
    - Only write strings generated by **one rule** from a ledger entry.  
    - Record **every** string attempted (prevents loops).  
  - **Procedure:**  
    - **0:00–0:05:** Introduce system, rules, and ledger. *Do not hint at impossibility.*  
      *"Your goal is to derive MU. Start from MI, apply rules, and log every step."*  
    - **0:05–0:25:** Groups attempt derivation. Instructor circulates:  
      - Enforce rule compliance (e.g., reject "M → U" as invalid).  
      - If stuck: *"Try Rule (b) on a new string or check Rule (c)."*  
      - **Fast Groups:** Extension: "Characterize *all* derivable strings (e.g., what do they have in common?)"  

  #### **Phase 2: Proof Construction (15 min)**  
  - **0:25–0:30:** Distribute Phase 2 handout.  
    *"MU wasn’t found. Prove it’s impossible. Classify your proof."*  
  - **0:30–0:40:** Groups write proofs using ledger data (e.g., invariant in "Number of I’s" column).  
    - **Instructor Prompt:** *"Look for patterns in your ledger. What never changes?"*  

  #### **Phase 3: Adversarial Exchange (15 min)**  
  - **0:40–0:42:** Groups pair up (Group A ↔ Group B).  
  - **0:42–0:45:** Distribute proofs + planted bad proof.  
  - **0:45–0:55:** Prosecutors critique proofs. Focus:  
    - *"Is the logic sound? Is there a counterexample in your ledger?"*  
    - **Key Task:** Break the planted proof (even though conclusion is correct).  

  #### **Phase 4: Level-Raising Round (10 min)**  
  - **0:55–1:00:** Pose questions:  
    1. *"What system were you using when you proved the invariant?"*  
    2. *"Could there be facts *that* system can’t prove?"*  
  - **1:00–1:05:** Groups discuss. *Do not define "metatheory" yet.*  

  #### **Debrief (20 min)**  
  - **1:05–1:15:** Map activity to concepts:  
    - **Invariant from Ledger:**  
      - Chart "Number of I’s" on board. *"What’s common? (Never 0 mod 3). Why?"*  
      - *"This pattern is an **invariant**—preserved by all rules."*  
    - **Proof vs. Derivation:**  
      - *"Your proof isn’t a derivation—it’s a **theorem about the system**, proven in **arithmetic**."*  
      - Contrast with ledger: *"No ledger, however long, *proves* impossibility—it only shows failure."*  
    - **Adversarial Lesson:**  
      - Break planted proof: *"MII refutes ‘all strings have odd I’s’. True conclusion ≠ valid proof."*  
    - **Level-Raising:**  
      - *"You stepped into **arithmetic** (System 2) to prove things about MIU (System 1). But System 2 has limits too (e.g., Gödel’s incompleteness)."*  
  - **1:15–1:25:** Extensions and limits:  
    - **Extension Groups:** *"Characterizing all strings gives more insight but risks error—e.g., is your conjecture provable?"*  
    - **Honest Limitations:**  
      > *"This exercise simplifies: MU’s underivability is decidable and provable in weak arithmetic. Real bite comes from undecidable problems (e.g., Gödel), where no proof exists *at all* in the system. The ‘aha’ moment of finding an invariant can’t be staged—we only reconstruct it. You supply this context by contrasting decidable vs. undecidable limits post-activity."*  

  ---

  #### **Predictable Problems & Solutions**  
  1. **Repetitive Ledger:**  
     - *Solution:* Intervene: *"Try Rule (c) on longer strings or Rule (b) on non-MI starters."*  

  2. **Illegal Steps (e.g., "I → U"):**  
     - *Solution:* Rule-check: *"Show me where the rule allows this. If not, erase it."*  

  3. **"We haven’t found it → Can’t be found":**  
     - *Solution:* In Phase 2, ask: *"Could MU be 100 steps away? How do you *know* it’s impossible?"*  

  4. **Group Finds Invariant Early:**  
     - *Solution:* Redirect to extension or proof rigor: *"Prove your invariant holds for *all* rules."*  

  5. **Prosecutor Misuse:**  
     - *Solution:* Frame as collaborative: *"Your goal is to strengthen their proof, not ‘win’."*  

  6. **Uneven Pacing:**  
     - *Solution:* Assign extensions early; have fast groups derive complex strings (e.g., MUIIU).  

  ---

  #### **What the Activity Cannot Reproduce**  
  > *"This is a toy model: MU’s underivability is mechanically provable in arithmetic. Real limits are harder. Gödel showed arithmetic can’t prove its own consistency—a true, undecidable gap. Here, the invariant is easy to find; in complex systems, invariants may be unprovable. The ‘stepping outside’ feels productive here, but in practice, it risks inconsistency or new blind spots. Highlight this by contrasting with undecidability: ‘In MIU, stepping out worked; in richer systems, it might not.’"*  

  ---  
  **Instructor’s Role:** Strict enforcer in Phase 1; facilitator in Phases 2–4; conceptual guide in debrief. Avoid lecturing—let frustration and discovery drive learning.
