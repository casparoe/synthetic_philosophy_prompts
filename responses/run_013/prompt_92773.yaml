prompt: |-
  I am a third-year undergraduate in philosophy and biology, and this term I am also working as a research assistant for the clinical ethics and coverage advisory committee at our university teaching hospital. The committee meets twice a month and reviews roughly half a dozen requests for interventions that sit near the line between treating a condition and enhancing a person: growth hormone for a child with idiopathic short stature, stimulant medication for a resident who wants to study for board exams, testosterone for age-related decline, and occasionally requests for elective procedures whose main appeal is competitive advantage. We have twenty minutes per case, the members are clinicians, a chaplain, an administrator, and one lay representative, and our recommendations go to the insurer and sometimes shape what the patient can access. What we lack is a defensible, repeatable procedure. I do not want an essay on the therapy/enhancement distinction, and I especially do not want a reading list; I want something the committee can actually run in the meeting, with the questions in order, what counts as a sufficient answer at each step, the points where the process stops with a no, and the points where it must hand the matter to a person because the remaining question is one of values rather than facts.

  My seminar has left me suspicious of any procedure that treats disease as a natural kind or normal function as a purely statistical fact. The distinction I want you to operationalize is between four modes of intervention: restoration, which returns someone to a functional level they previously had; compensation, which offsets a stable deficit relative to a reference class; augmentation, which raises capacity above the person's own prior baseline while remaining within what is typical for that reference class; and optimization, which raises capacity beyond the typical range or secures a positional advantage over others. I also want the procedure to confront two problems that our committee keeps hitting. The first is the counterfactual baseline problem: for many conditions we cannot know what the person's function would have been without the intervention, and for children we cannot know what they would have chosen. The second is the positional problem: some interventions help only or mainly because others do not have them, so their value depends on distribution. Please build the procedure around these ideas, but make it usable by people who have not read the theory. It should say explicitly which distinctions must survive the simplification and which can be dropped, and it should mark the places where the procedure will misfire.

  Then run the procedure on three requests and show your work. First, recombinant growth hormone for a ten-year-old with idiopathic short stature, predicted adult height below the first percentile, no identifiable pathology, and parents who are worried about social treatment. Second, modafinil for a healthy internal-medicine resident whose sleep is disrupted by night rotations and who wants it for board preparation; the resident says it would restore the focus that sleep loss has taken away. Third, deep brain stimulation for a patient with treatment-resistant depression who also hopes the device will leave them sharper and more productive than they were before the depression began. For at least one of these, I want the procedure to return an answer I will not like, and I want you to say why the procedure nevertheless commits us to it. End with a short section on what the procedure cannot decide, including any case where the committee should refuse to give a recommendation rather than pretend the procedure has settled it.
reasoning: |-
  We are designing a procedural algorithm for the committee to evaluate interventions that fall near the therapy-enhancement boundary. The algorithm will use the four categories: restoration, compensation, augmentation, and optimization. The goal is to have a step-by-step process that the committee can follow in 20 minutes per case.

  Key distinctions to preserve:
  1. The four modes: restoration, compensation, augmentation, optimization.
  2. The counterfactual baseline problem: we often don't know what the person's function would have been without the condition or what they would have chosen.
  3. The positional problem: when the value of an intervention depends on how widely it is distributed.

  Distinctions that can be simplified or dropped for practical purposes:
  - Deep philosophical debates about "disease" as a natural kind or "normal function" as purely statistical. We'll use functional impairment relative to a reference class (which can be age, sex, etc.) as a practical starting point, but we acknowledge this is a simplification.

  The procedure will have clear stopping points (a "no" recommendation) and points where the committee must make a value judgment (and thus the algorithm stops and the committee deliberates without further procedural steps).

  Procedure Outline:

  Step 1: Identify the intervention and the condition or goal.
     - What is the intervention? What is the condition or goal it addresses?
     - If the intervention is for a condition that is life-threatening or severely debilitating (e.g., acute infection, trauma), then it is clearly therapy and the committee can approve without further steps. But note: our committee only sees borderline cases, so we assume the cases are not clear-cut.

  Step 2: Determine the mode of intervention (using the four categories). This step requires defining the baseline and the reference class.
     a. Restoration: Does the intervention aim to return the person to a level of function they previously had? (This requires evidence of prior function and a recent loss.)
     b. Compensation: Does the intervention aim to offset a stable deficit relative to a reference class (e.g., age, sex) without claiming to restore prior function? The deficit must be stable (i.e., not expected to change without intervention) and significant enough to impair typical activities of daily living (ADLs) or major life activities.
     c. Augmentation: Does the intervention aim to raise capacity above the person's own prior baseline but within the typical range for the reference class? (This is not for a deficit but for improvement within normal limits.)
     d. Optimization: Does the intervention aim to raise capacity beyond the typical range for the reference class or to secure a positional advantage?

     How to handle the counterfactual baseline problem?
     - For children: we cannot know what they would have chosen or what their function would have been without the condition. We use the reference class (e.g., same age, sex) and statistical norms (e.g., 3rd percentile or below for height might be considered a deficit) but acknowledge this is a convention.
     - For adults: we can use prior function if available and if the loss is recent and clearly documented. Otherwise, we use the reference class.

     If the intervention is for restoration and there is clear evidence of prior function and a recent loss, then proceed to Step 3 for restoration.
     If the intervention is for compensation and the deficit is stable and significant (impairs ADLs), then proceed to Step 3 for compensation.
     If the intervention is for augmentation or optimization, then go to Step 4 (which addresses the positional problem and value judgments).

  Step 3: For restoration and compensation, assess the evidence of functional impairment and the intervention's efficacy and safety.
     a. Restoration: 
          - Is there objective evidence of the prior functional level (medical records, etc.)?
          - Is the loss recent and due to a specific event or condition?
          - Is the intervention likely to restore the prior level? (Evidence from clinical trials or guidelines.)
          - If yes, then approve. If no, then deny or go to Step 4 (if it might be compensation).
     b. Compensation:
          - Is the deficit stable (not expected to improve without intervention) and significant (impairs ADLs or major life activities) relative to the reference class?
          - Is the intervention safe and effective for compensating for this deficit? (Evidence from guidelines or trials.)
          - If yes, then approve. If no, then deny.

     Note: In both restoration and compensation, if the deficit is not significant (i.e., it does not impair ADLs) then the intervention might be considered augmentation or optimization and we move to Step 4.

  Step 4: For augmentation and optimization, we must address the positional problem and value judgments.
     - Augmentation: The intervention is intended to improve function within the typical range. We ask:
          a. Is the intervention safe and effective for the intended improvement?
          b. Is the improvement necessary to avoid a deficit? (If yes, then it might be compensation and we should reconsider Step 2.)
          c. Does the intervention create a positional advantage? (If the advantage is purely relative and not absolute, then it may be optimization in disguise.)
          d. If the intervention does not create a positional advantage and is for a non-competitive good (e.g., improving memory for one's own satisfaction without affecting others), then it may be approved if safe and effective. However, if it creates a positional advantage (e.g., in an exam or job), then it becomes optimization.

     - Optimization: The intervention aims to raise capacity beyond the typical range or to secure a positional advantage. We then ask:
          a. Is the intervention safe and effective for the intended purpose?
          b. Is the advantage positional? (i.e., does the value depend on others not having it?) 
          c. If the advantage is positional, then we must consider the distributive effects. The committee should note that if the intervention becomes widespread, the advantage may disappear (e.g., if everyone takes modafinil for exams, then no one gains). This is a value judgment about fairness and access.

     For both augmentation and optimization, the committee must make a value judgment about whether the intervention is appropriate. The algorithm stops here and the committee must deliberate without further steps. The algorithm flags that this is a values decision and not a medical one.

  Stopping points for a "no" recommendation:
     - In Step 3 (restoration or compensation) if the evidence does not show a significant functional impairment or if the intervention is not safe and effective.
     - In Step 4, if the intervention is unsafe or ineffective.

  Points where the procedure hands the matter to the committee for values judgment:
     - At Step 4 for augmentation and optimization.

  Now, let's run the three cases.

  Case 1: Recombinant growth hormone for a ten-year-old with idiopathic short stature, predicted adult height below the first percentile, no identifiable pathology, parents worried about social treatment.

  Step 1: Intervention is growth hormone. Condition is idiopathic short stature (no pathology found).

  Step 2: Mode of intervention?
     - The child has never had a normal height (so not restoration).
     - It is compensation? We are comparing to a reference class (age and sex). Height below the 1st percentile is a deficit relative to the reference class. However, is it a functional impairment? The concern is social treatment (which may lead to psychological distress) but not a direct physical impairment. We must decide if social treatment and psychological well-being count as a functional impairment. In medicine, short stature is often considered a condition that may impair quality of life and social functioning. We'll consider it as compensation if it is causing or expected to cause significant impairment.

     How to handle counterfactual? We don't know what the child would have chosen. We use the reference class: typical height for age and sex.

     Since the child is below the 1st percentile, we can consider it a significant deficit. So we go to Step 3b: compensation.

  Step 3b (Compensation):
     - Stable deficit? Idiopathic short stature is stable without intervention (will persist).
     - Significant impairment? The impairment is in social functioning and quality of life. There is evidence that extreme short stature can lead to bullying and social exclusion. However, the committee must judge whether this rises to the level of impairing major life activities (e.g., social interactions, school performance). The parents are worried, but we don't have evidence of current impairment. This is a gray area.

     The procedure might misfire here because we are relying on predicted future impairment. We might need to consider: if the impairment is expected and preventable, then it might be compensation.

     - Efficacy and safety: Growth hormone is approved for idiopathic short stature in some jurisdictions, but it has risks (e.g., increased intracranial pressure, diabetes) and the benefits are modest (a few inches). The committee must weigh the risks and benefits.

     If the committee deems the impairment significant and the intervention safe and effective enough, then approve. Otherwise, deny.

     However, note: if we do not consider the social impairment as significant, then we might reclassify as augmentation (trying to bring the child from the 1st percentile to, say, the 10th) and go to Step 4. But the goal is to avoid extreme short stature, which is a deficit relative to the reference class. So we stay in compensation.

     Given the low predicted height, the committee might approve. But the procedure does not force approval. It requires the committee to judge the significance of the impairment.

     For the sake of this example, let's say the committee judges that the impairment is significant and the intervention is safe and effective enough. Then approve.

     However, the procedure might also lead to a denial if the committee does not find the impairment significant. This is where the values come in. But note: the algorithm in Step 3b requires the committee to make a judgment on impairment. If they cannot agree, they might move to Step 4? But Step 4 is for augmentation/optimization. We should not move to Step 4 if we are in compensation. Instead, if the impairment is not deemed significant, then we might deny in Step 3b.

     So the procedure can lead to either outcome, but the key is that the committee must decide on the significance of the impairment.

  Case 2: Modafinil for a healthy internal-medicine resident whose sleep is disrupted by night rotations and who wants it for board preparation; the resident says it would restore the focus that sleep loss has taken away.

  Step 1: Intervention is modafinil. Condition is sleep disruption due to night rotations and the goal is to restore focus for board preparation.

  Step 2: Mode of intervention?
     - Restoration: The resident claims that modafinil would restore focus that sleep loss has taken away. So they are saying that without the sleep disruption, they had normal focus. This is restoration? But note: the sleep disruption is due to work schedule, not a disease.

     However, we must ask: is the sleep disruption a temporary condition that has caused a functional loss? The resident had normal focus before the night rotations. The loss is recent and due to a specific cause (work schedule). But is this a medical condition? The resident is healthy.

     The counterfactual: without the night rotations, the resident would have normal sleep and focus. But the night rotations are part of the job. So the baseline is the resident's own prior function, but the cause is an environmental factor.

     We might consider this as restoration if we accept that the sleep disruption is a condition that has caused a functional loss. However, the committee might see this as an enhancement because the resident is seeking to perform at a high level despite a demanding schedule.

     Alternatively, we could see it as compensation: the resident has a temporary deficit (due to sleep loss) relative to the reference class of well-rested residents, and modafinil compensates for that. But note: the deficit is not stable; it is caused by the schedule and will end when the schedule changes.

     Let's classify it as restoration if we can establish that the resident had normal focus before and that the sleep loss is the only cause of the current deficit. Then we go to Step 3a.

  Step 3a (Restoration):
     - Evidence of prior function: The resident is healthy and had normal focus before the night rotations? We can assume that. But we don't have medical records of prior focus. We rely on self-report.
     - Recent loss: The sleep disruption is recent and due to the night rotations.
     - Efficacy: Modafinil is effective for improving alertness in sleep-deprived individuals. But is it restoring to the prior level? It might be enhancing beyond the prior level? The resident wants it for board preparation, which is a high-stakes exam. They might be seeking more than restoration.

     This is tricky. The procedure might misfire because the resident might be seeking an advantage beyond restoration. The committee must decide if the use of modafinil would restore normal function or enhance beyond it.

     If the committee believes that the resident without sleep loss would have normal focus (enough to study adequately) and modafinil restores that, then approve. But if the resident is seeking a level of focus that is beyond their normal (or beyond what is typical for the reference class) then it might be augmentation.

     Given the ambiguity, we might move to Step 4? But the algorithm doesn't allow that from Step 3a. Step 3a leads to a decision: if the answers are yes, then approve. If not, then we might reconsider the mode.

     Alternatively, we might deny in Step 3a if we don't have evidence of prior function or if modafinil is not restoring but enhancing.

     Let's say the committee is not convinced that the resident is trying to restore normal function. The resident might be trying to get an edge in studying. This is a common problem with stimulants in academic settings.

     We might then reclassify as augmentation (if the goal is to improve focus beyond the resident's normal baseline but within typical) or optimization (if beyond typical). Then go to Step 4.

     Step 4: 
        - If we classify as augmentation: 
            a. Safe and effective? Modafinil has risks (dependence, cardiovascular) and is not approved for this use.
            b. Necessary to avoid a deficit? Without the drug, the resident might be impaired due to sleep loss. So it might be compensation. But we already considered restoration and compensation and found it ambiguous.
            c. Positional advantage? The resident is preparing for a competitive exam. If modafinil gives an advantage over other residents who are also sleep-deprived but not taking the drug, then it is positional.

        - If positional, then it is optimization. We then ask about distributive effects: if all residents used modafinil, the advantage would disappear. The committee must decide if it is fair to allow one resident to use it when others might not have access.

     Because of the positional advantage, the committee might deny the request on grounds of fairness. Or they might approve if they think the sleep disruption is a temporary impairment that should be accommodated.

     The procedure leads to a values judgment in Step 4. The committee must decide.

     For the sake of the exercise, we'll say the procedure flags it as optimization and the committee must deliberate. They might deny because it is a positional advantage and not medically necessary.

  Case 3: Deep brain stimulation (DBS) for a patient with treatment-resistant depression who also hopes the device will leave them sharper and more productive than they were before the depression began.

  Step 1: Intervention is DBS. Condition is treatment-resistant depression. The primary goal is to treat depression, but there is a secondary goal: to become sharper and more productive than pre-depression.

  Step 2: Mode of intervention?
     - For the depression: This is restoration? The patient had a pre-depression state. DBS for depression is experimental but sometimes used. The primary indication is restoration (to return to a non-depressed state).
     - However, the patient also hopes for optimization: to be better than before.

     We must separate the two goals. The primary goal (treating depression) is restoration. The secondary goal (enhanced cognition) is optimization.

     We can split the request: the DBS for depression is one intervention (restoration) and the DBS for cognitive enhancement is another (optimization). But it's one device.

     The committee should first consider the restoration part.

  Step 3a (Restoration for depression):
     - Evidence of prior function: The patient had a pre-depression state without depression. The depression is a loss of that state.
     - Recent loss? Depression is chronic and treatment-resistant, so the loss is not recent but persistent.
     - Efficacy: DBS for treatment-resistant depression is not standard and may be experimental. The committee must review the evidence. If there is strong evidence, then approve for depression. But if the evidence is weak, then deny for depression.

     Let's assume the committee approves the DBS for depression because it is the last resort and there is some evidence of efficacy.

     Now, for the cognitive enhancement: this is a separate goal. We go to Step 2 for that goal.

     Step 2 (for cognitive enhancement): Optimization (because it aims beyond the prior baseline).

     Step 4 (Optimization):
          a. Safe and effective? DBS for cognitive enhancement in healthy individuals is not established. There might be risks (surgical complications, cognitive side effects) and the efficacy is unknown.
          b. Positional? Yes, because the patient wants to be sharper and more productive than others. This is a positional advantage.

          The committee must make a values judgment. They might deny the enhancement part because of unknown risks and lack of evidence. But note: the device is already being implanted for depression. The enhancement might be a side effect? The committee cannot separate the two in the device. They must decide whether the potential for enhancement is a valid reason to proceed.

          The procedure would stop at Step 4 and the committee must deliberate. They might decide that the primary indication (depression) is sufficient and the enhancement is a bonus, but they should not approve based on the enhancement goal. They might also worry that the enhancement goal might lead to inappropriate use.

          The procedure would not approve the enhancement part. The committee should base approval solely on the depression indication.

          Therefore, the committee would approve DBS for depression and note that the enhancement effect is not a basis for approval.

  Now, we are asked to have at least one case where the procedure returns an answer we do not like.

  Let's take Case 2 (modafinil). Suppose the committee, following the procedure, classifies it as optimization and then, in the values judgment, denies it because of the positional advantage. We might not like this because the resident is suffering from sleep disruption due to work and needs help. But the procedure commits us to denying it if we decide that the positional advantage is unfair and that the use is not medically necessary.

  What the procedure cannot decide:
     - Cases where the facts are unclear (e.g., the efficacy of an intervention is unknown).
     - Cases where the values conflict (e.g., when an intervention has both a compensatory and an optimizing effect, and the committee must weigh them).
     - Cases that involve deep philosophical questions about what counts as a normal function or what constitutes a meaningful deficit.

  In these cases, the procedure will flag the need for committee deliberation and might not yield a clear recommendation. The committee should then acknowledge the uncertainty and either defer for more information or make a judgment call based on their values, but they should not pretend the procedure has settled it.

  Also, if the committee is split on a values judgment in Step 4, they should note the disagreement and might decide by majority vote, but the procedure does not resolve the values conflict.

  Finally, the procedure should be presented as a flowchart for the committee to follow. We have described it in steps, but in practice, it would be a decision tree.
answer: |-
  Below is a step-by-step procedural algorithm designed for your committee's use. It operationalizes your four modes of intervention (restoration, compensation, augmentation, optimization), addresses the counterfactual baseline and positional problems, and includes explicit stopping points and value judgments. The procedure is structured as a flowchart with binary questions, designed for 20-minute case reviews. Committee members need no prior philosophical training—only basic medical/common sense.  

  **Key Simplifications and Preserved Distinctions**:  
  - **Preserved**: The four intervention modes (critical for categorization).  
  - **Preserved**: Counterfactual baseline problem (handled via *evidence-based proxies*).  
  - **Preserved**: Positional problem (explicitly flagged for committee judgment).  
  - **Dropped**: "Disease as a natural kind" (uses *functional impairment* relative to reference classes like age/sex).  
  - **Dropped**: "Normal function as purely statistical" (uses *typical range* pragmatically, e.g., 3rd–97th percentile).  
  - **Misfire Warnings**:  
    - When baseline function is unknown (e.g., children, chronic conditions).  
    - When societal norms shift (e.g., height standards).  
    - When positional goods masquerade as medical needs (e.g., "focus" for exams).  

  ---

  ### **Procedure: Therapy-Enhancement Assessment Protocol (TEAP)**  
  **Time Allocation**: 20 minutes/case.  
  **Input**: Case file (medical history, intervention, goals).  
  **Output**: Approve, Deny, or [Value Judgment Needed].  

  #### **Step 1: Identify Functional Baseline**  
  - **Question 1.1**: *Is there objective evidence of the patient’s pre-impairment function?*  
    - *Yes* → Proceed to **Question 1.2**.  
    - *No* → Use reference class (age/sex) typical range (e.g., height 3rd–97th percentile) as proxy baseline.  
  - **Question 1.2**: *Did the patient function at this level within the last 2 years?*  
    - *Yes* → Baseline = patient’s prior function.  
    - *No* → Baseline = reference class typical range.  
  - **Sufficient Answer**: Medical records, growth charts, or standardized assessments.  
  - **Stopping Point**: If no reliable baseline exists → Flag for committee deliberation (counterfactual problem).  

  #### **Step 2: Categorize Intervention Mode**  
  - **Question 2.1**: *Does the intervention aim to return the patient to their baseline function?*  
    - *Yes* → **RESTORATION** → Proceed to Step 3.  
    - *No* → Proceed to **Question 2.2**.  
  - **Question 2.2**: *Does the intervention offset a stable deficit relative to the reference class?*  
    - *Yes* → **COMPENSATION** → Proceed to Step 3.  
    - *No* → Proceed to **Question 2.3**.  
  - **Question 2.3**: *Does the intervention aim to improve function above the patient’s baseline but within the reference class typical range?*  
    - *Yes* → **AUGMENTATION** → Proceed to Step 4.  
    - *No* → **OPTIMIZATION** (exceeds typical range or seeks positional advantage) → Proceed to Step 4.  
  - **Sufficient Answer**: Clinical documentation of deficit/goals.  

  #### **Step 3: Assess Restoration/Compensation (Medical Necessity)**  
  - **Question 3.1**: *Is there significant functional impairment?*  
    - *Impairment defined as*: Inability to perform ≥2 age-appropriate activities of daily living (ADLs) without assistance.  
    - *Yes* → Proceed to **Question 3.2**.  
    - *No* → **DENY** (insufficient medical need).  
  - **Question 3.2**: *Is the intervention safe, effective, and the least invasive option?*  
    - *Yes* → **APPROVE**.  
    - *No* → **DENY**.  
  - **Stopping Point**: Deny if impairment absent or intervention unsafe/ineffective.  

  #### **Step 4: Assess Augmentation/Optimization (Value Judgment)**  
  - **Question 4.1**: *Does the intervention provide a competitive advantage?*  
    - *Yes* → **OPTIMIZATION** → Proceed to **Question 4.2**.  
    - *No* → **AUGMENTATION** → Proceed to **Question 4.3**.  
  - **Question 4.2 (Positional Problem)**: *Would the advantage disappear if everyone had access?*  
    - *Yes* → Flag for committee deliberation (positional good).  
    - *No* → Proceed to **Question 4.3**.  
  - **Question 4.3**: *Is the intervention low-risk and patient fully informed?*  
    - *Yes* → **APPROVE** (if augmentation) or **Value Judgment Needed** (if optimization).  
    - *No* → **DENY**.  
  - **Value Judgment Required**: Committee must vote when:  
    - Positional goods are involved (Step 4.2).  
    - Optimization lacks medical justification (Step 4.3).  

  ---

  ### **Case Applications**  
  #### **Case 1: Growth Hormone for 10-Year-Old with Idiopathic Short Stature**  
  - **Predicted Height**: <1st percentile. No pathology. Parental concern about bullying.  
  - **Step 1**: Baseline unknown (child) → Use reference class (age/sex typical height: 3rd–97th percentile).  
  - **Step 2**: Short stature is a stable deficit → **COMPENSATION**.  
  - **Step 3**:  
    - Q3.1: Functional impairment? Height <1st percentile correlates with psychosocial harm (studies show bullying risk). *Impairment likely* → Proceed.  
    - Q3.2: Safe/effective? Growth hormone is FDA-approved for ISS; modest efficacy (3–5 cm gain). *Yes* → **APPROVE**.  
  - **Why you might dislike this**: The procedure approves based on psychosocial impairment, which medicalizes social prejudice. However, it commits to compensation because short stature is a stable deficit relative to the reference class, and harm is evidence-based.  

  #### **Case 2: Modafinil for Sleep-Deprived Resident Studying for Boards**  
  - **Claim**: "Restores focus lost to night shifts." Healthy adult.  
  - **Step 1**: Baseline = resident’s pre-rotation alertness (unknown) → Use reference class (typical focus for age).  
  - **Step 2**:  
    - Q2.1: Not restoration (no prior pathology; shifts are environmental).  
    - Q2.2: Not compensation (sleep disruption is temporary, not stable deficit).  
    - Q2.3: Aims to improve focus within typical range? *Yes* → **AUGMENTATION**.  
  - **Step 4**:  
    - Q4.1: Competitive advantage? Board exams are zero-sum → **OPTIMIZATION** (positional).  
    - Q4.2: Advantage disappears if all residents use it? *Yes* → **Value Judgment Needed**.  
    - *Committee Decision*: Denied. Positional goods undermine fairness; medicalizes occupational strain.  
  - **Why you might dislike this**: Resident’s hardship is real, but TEAP classifies this as optimization, triggering fairness concerns.  

  #### **Case 3: Deep Brain Stimulation (DBS) for Treatment-Resistant Depression + Cognitive Boost**  
  - **Goals**: Treat depression (primary) and become "sharper than pre-depression" (secondary).  
  - **Step 1**: Baseline = pre-depression function (known via history).  
  - **Step 2**:  
    - Depression treatment → **RESTORATION** (return to baseline).  
    - Cognitive boost → **OPTIMIZATION** (exceeds baseline).  
  - **Step 3 (Restoration)**:  
    - Q3.1: Severe impairment (treatment-resistant depression) → Proceed.  
    - Q3.2: DBS is effective for 40–60% of cases → **APPROVE depression indication**.  
  - **Step 4 (Optimization)**:  
    - Q4.1: Competitive advantage? "More productive" suggests positional gain → Proceed to Q4.2.  
    - Q4.2: Advantage universal? *No* (productivity edge persists even if widespread) → Proceed to Q4.3.  
    - Q4.3: Low-risk? DBS has surgical risks (infection, hemorrhage); cognitive enhancement unproven → **DENY optimization**.  
  - **Outcome**: Approve for depression only; cognitive boost not covered.  

  ---

  ### **What the Procedure Cannot Decide**  
  The committee **should refuse to recommend** when:  
  1. **Unresolved Counterfactuals**: Baselines are unknown *and* reference classes are contested (e.g., non-binary patients, rare conditions).  
  2. **Values Conflicts**: Positional goods (Step 4.2) or optimization (Step 4.3) without societal consensus (e.g., genetic enhancements).  
  3. **Emergent Technologies**: Insufficient safety/efficacy data (e.g., experimental neuroenhancements).  
  4. **Equity Dilemmas**: Interventions that exacerbate systemic disparities (e.g., costly enhancements only for the wealthy).  

  **Example**: A request for CRISPR-based IQ enhancement in a healthy child.  
  - **Why TEAP fails**:  
    - Baseline unknown (child’s potential);  
    - Optimization with irreversible societal effects;  
    - Positional advantage that worsens inequality.  
  - **Committee Action**: Refuse recommendation. Issue a statement: "This exceeds medical necessity and requires broader societal deliberation."  

  The TEAP procedure forces transparency: It isolates medical facts (Steps 1–3) from values (Step 4), ensuring the committee never "pretends" science can answer ethical questions.
