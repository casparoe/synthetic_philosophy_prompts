prompt: |-
  I'm a backend engineer (distributed systems, mostly) and I've fallen down a rabbit hole arguing with a mate from my old ML lab about whether the internals of a neural net "represent" anything, or whether we're just projecting. I don't have a philosophy background so I keep getting lost in the words rather than the substance. I want the spec first, before I read any more blog posts or papers: write me the desiderata that any decent theory of representation-in-a-network has to meet. Concretely — what cases must it get right, what distinctions can't it collapse, what established results does it have to stay consistent with — and for each one, give me the case or consideration that motivates it. I'm thinking of things like: the same behaviour can be produced by weights related by an arbitrary change of basis (permute the hidden units, rotate a subspace), so the theory can't make representation claims depend on a coordinate system nobody chose; a probe or decoder can always be trained to pull *something* out of an activation, so the theory has to say when decoding is evidence and when it's the readout doing all the work; a latent can be perfectly recoverable by a linear map and yet be causally inert in the forward pass, so recoverability and "the network actually uses this" can't be the same thing; superposition means features share dimensions, so "one feature, one unit" can't be baked in; and there's a nasty case I hit in a toy setup — a two-layer thing trained on a synthetic task where the ground-truth latent and what the probes find differ by a fixed rotation, and every behavioural test passes either way, which makes me think "which one is the real representation" might be a question the theory has to refuse to answer rather than answer. Also: does a network represent something it computes but never outputs? Does a network trained on a spurious shortcut represent the shortcut, the intended feature, or both? And does it represent a feature if no human concept lines up with the code at all?

  Two things I really want out of it. First, flag which requirements are genuinely non-negotiable and which are just house style of one camp — I suspect a lot of what gets demanded (that a representation be human-interpretable, say, or that it be a single direction) is a prejudice smuggled in as a constraint. Second, tell me if some subset of the desiderata is jointly unsatisfiable — that's the bit I'm most curious about, because it feels like "faithful to the mechanism", "independently checkable", and "stable across retraining" can't all hold at once. Then, briefly, how the main families of account do against the list — the probe/decode-it crowd, the sparse-autoencoder-and-superposition crowd, the causal-intervention crowd (patching, ablation, interchange-style tests), and whatever the "it's just behaviour, stop reifying" people would say. Keep the weight on the criteria and the cases behind them; the scorecard is just so I can see which criterion does the most work. Write it in British English please, and don't bother with citations or reading lists — I can't get to papers easily and I'd rather have the argument than the references.
reasoning: |-
  Alright, the user is a backend engineer with experience in distributed systems, now diving into a debate about neural network representations. They're arguing with a former colleague from an ML lab. The core question is whether the internals of a neural net actually "represent" anything or if humans are just projecting meaning onto them. 

  First, I need to unpack their main concerns. They want a set of criteria (desiderata) that any theory of representation must satisfy. They've already listed several key cases: the change-of-basis invariance, the probe-recoverability vs. causal efficacy distinction, superposition, and their toy example with two possible representations. They also have specific questions about unexpressed features, spurious correlations, and non-human-aligned features.

  The user is clearly frustrated with philosophical jargon and wants concrete, technical criteria. They’re suspicious of biases in existing theories (like requiring human interpretability) and wonder if some desiderata are mutually exclusive. Their deeper need is probably to cut through the noise and find a rigorous framework to settle debates with their mate.

  Now, breaking down their explicit requirements:
  - Criteria must handle change-of-basis invariance: representations shouldn’t depend on arbitrary coordinate systems.
  - Decodability isn’t sufficient evidence; must distinguish between actual use and post-hoc extraction.
  - Causal inertness: a latent might be decodable but unused by the network.
  - Superposition: features share dimensions, so no one-to-one unit mapping.
  - Their toy case suggests representation might be underdetermined, so the theory might need to accept multiple valid interpretations or refuse to pick one.

  Additional cases:
  - Unexpressed computations: does the network "represent" something it computes internally but never outputs?
  - Spurious features: when a model learns both a shortcut and the true feature, what’s represented?
  - Non-human concepts: if a feature has no human analogue, is it still a representation?

  They also want:
  1. Clarity on which criteria are non-negotiable vs. camp-specific biases.
  2. To know if desiderata conflict (e.g., faithfulness vs. stability vs. checkability).
  3. A comparison of existing approaches against these criteria.

  Key challenges:
  - **Change-of-basis invariance**: Any theory must be invariant to rotations/permutations of weights. This is non-negotiable because it’s a mathematical property of NNs.
  - **Decodability vs. causal role**: Probes can extract info even if the network doesn’t use it. A good theory must separate evidence (decodability) from function (causal role). Non-negotiable.
  - **Causal inertness**: Recoverability ≠ usage. This is crucial because otherwise, we misattribute functionality.
  - **Superposition**: The theory must handle distributed representations. Non-negotiable for modern NNs.
  - **Underdetermination (toy case)**: If two representations explain behavior equally, the theory should either allow multiplicity or remain agnostic. This might challenge theories insisting on a single "real" representation.

  For the additional cases:
  - **Unexpressed features**: Does internal computation count as representation? This tests if "representation" requires functional output.
  - **Spurious features**: If both shortcut and true feature are present, the theory should acknowledge both, but perhaps weight by causal efficacy.
  - **Non-human concepts**: If a theory requires human alignment, it’s biased. Non-negotiable to avoid anthropocentrism.

  Non-negotiable criteria:
  1. **Invariance**: Ignores arbitrary coordinate changes.
  2. **Causal efficacy**: Rep must play a role in the network’s function.
  3. **Superposition compatibility**: No unit/feature isomorphism.
  4. **Non-anthropocentrism**: Reps need not align with human concepts.

  Negotiable/camp-specific:
  - **Human interpretability**: Some camps demand this, but it’s not inherent.
  - **Sparsity**: Sought by some for ease, but not necessary.
  - **Single direction vs. subspace**: Some prefer single neurons, but subspaces are valid.

  Conflicting desiderata:
  - **Faithfulness to mechanism**: Capturing the actual causal structure.
  - **Stability across retraining**: Consistent interpretation under re-initialization.
  - **Independently checkable**: Verifiable via probes/interventions without model details.

  Conflict: Faithfulness might require model-specific analysis, while stability and checkability want generalization. E.g., causal roles might vary between runs, making stable interpretations inaccurate. Probes might be checkable but not faithful if they decode unused features.

  Approach comparisons:
  - **Probe/Decode**: Handles invariance and decodability but fails on causal inertness (decodes non-causal features). Doesn’t require human concepts. Struggles with underdetermination.
  - **Sparse Autoencoders (SAE)**: Handles superposition via sparse features. Addresses decodability but may confuse recoverable vs. causal features. Anthropocentric if forced to align with human concepts.
  - **Causal Intervention**: Strong on causal efficacy, handles inert features. Addresses spurious correlations. May struggle with underdetermined cases and stability.
  - **Behavioral Minimalism**: Avoids reification but fails on unexpressed features and causal distinctions. Doesn’t engage with mechanism.

  Summary: The user needs a clear framework to evaluate theories. Non-negotiables include invariance, causal efficacy, superposition handling, and non-anthropocentrism. Conflicts arise between faithfulness, stability, and checkability. Their toy case suggests underdetermination might require pluralism or agnosticism. Existing approaches have trade-offs, with causal intervention best addressing causal efficacy but potentially struggling with stability.
answer: |-
  Right, let's cut through the fog. You're asking for the *spec* for a theory of representation in neural networks – what it *must* handle, where it *can* be flexible, and where things might break. Below are the core desiderata, grounded in the computational realities of NNs and the cases you've flagged. I'll distinguish non-negotiables (arising from the maths or causal structure) from camp-specific preferences, flag conflicts, and score the main approaches.

  ---

  ### Core Desiderata for a Theory of Representation (The Spec)

  1.  **Invariance Under Basis Change (Non-negotiable)**
      *   **Motivating Case:** Permuting hidden units or applying an arbitrary invertible linear transformation to a layer (and adjusting subsequent weights accordingly) yields a network with *identical* input-output behaviour. Any claim about "what a specific unit represents" cannot depend on an arbitrary coordinate system.
      *   **Requirement:** The theory must define representations in terms of *equivalence classes* under basis transformations (e.g., subspaces, activation patterns relative to others, functional roles) or properties invariant under them. It cannot privilege an un-chosen basis.
      *   **Why Non-negotiable:** This is a fundamental mathematical property of the function implemented by feedforward networks (and most common architectures). Any theory ignoring this isn't describing the actual object.

  2.  **Distinguish Decodability from Causal Efficacy (Non-negotiable)**
      *   **Motivating Case:** A linear probe can perfectly recover a latent `Z` from activations, yet `Z` might be completely unused by the network's forward pass (e.g., computed as a side effect, a dead-end computation). Conversely, a causally critical feature might be highly non-linearly encoded and hard to decode linearly.
      *   **Requirement:** The theory *must* provide a clear distinction between:
          *   **Recoverability/Decodability:** The *existence* of a function (like a probe) mapping activations to some concept.
          *   **Causal Efficacy/Role:** The concept *participating functionally* in producing the network's outputs (e.g., altering it changes downstream computation/outputs predictably).
      *   **Why Non-negotiable:** Equating decodability with representation conflates evidence *about* the mechanism with the mechanism itself. Your latent inertness case demands this separation.

  3.  **Handle Superposition & Distributed Representation (Non-negotiable)**
      *   **Motivating Case:** In wide layers, features are represented sparsely across many units (sparse coding). In narrow layers, many features are "superposed" into fewer dimensions, requiring non-orthogonal directions in activation space to represent them. "One feature, one unit" is empirically false.
      *   **Requirement:** The theory must allow representations to be *subspaces* or *non-orthogonal directions* within the activation space. It cannot require features to be axis-aligned or monopolise individual units.
      *   **Why Non-negotiable:** This is a direct consequence of the geometry of high-dimensional spaces and the efficiency pressures of training. It's empirically observed.

  4.  **Respect Causal Structure & Counterfactual Dependence (Non-negotiable)**
      *   **Motivating Cases:**
          *   **Spurious Correlation:** A network reliably uses both "True Feature T" (causally linked to target) and "Spurious Feature S" (correlated but causally inert) due to training data. Ablating `S` degrades performance without changing `T`'s representation. Ablating `T` destroys performance.
          *   **Interchange:** Patching in activations representing "Cat" when the network was computing "Dog" causes outputs to become cat-like.
      *   **Requirement:** The theory must ground representation claims in the network's internal causal graph. A feature `F` is represented at a point `A` if *interventions* on the state of `F` at `A` (holding other relevant factors fixed) lead to predictable changes in downstream computation and outputs. It must distinguish features that are *used* from those that are merely *correlates* or side-computations.
      *   **Why Non-negotiable:** Without grounding in causal efficacy, "representation" loses explanatory power for *why* the network produces specific outputs. Your spurious feature case highlights this.

  5.  **Address Underdetermination / Equivalence (Non-negotiable)**
      *   **Motivating Case:** Your toy setup. Two different sets of features (`F1, F2, ...` vs `G1, G2, ...`), related by a fixed rotation, both perfectly explain the network's behaviour and internal computations. All probes, interventions, and behavioural tests pass equivalently for either set.
      *   **Requirement:** The theory *must not* be forced to uniquely identify "the real" representation in such cases. It should either:
          *   Allow for *multiple equivalent representations* (e.g., define equivalence classes).
          *   Explicitly state the representation is *relative to an interpretative framework* (e.g., the choice of basis/features used for analysis).
          *   Remain agnostic about which equivalent set is "real".
      *   **Why Non-negotiable:** Your case demonstrates this is a real possibility. A theory insisting on unique identification would be making an unsupported metaphysical claim.

  6.  **Account for Unexpressed Computations (Non-negotiable)**
      *   **Motivating Case:** A sub-circuit computes a value `V` crucial for an intermediate step, but `V` itself is never directly output or used in a way that makes it linearly decodable from the final layer. Is `V` "represented"?
      *   **Requirement:** The theory must provide a clear stance. If it says "yes", it must define representation in terms of *internal computational state* regardless of output relevance. If "no", it must tie representation tightly to *functionally output-relevant* state. Crucially, it must consistently apply this stance.
      *   **Why Non-negotiable:** This probes the core definitional boundary of "representation" within the system. Is it about *any* internal state or only state *directly linked* to outputs?

  7.  **Non-Anthropocentrism (Non-negotiable)**
      *   **Motivating Case:** A network develops highly efficient feature representations for a complex task that bear no resemblance to any human concept or decomposition (e.g., alien features in a game-playing AI).
      *   **Requirement:** The theory *must not* require representations to align with human-interpretable concepts. It must allow for representations that are "alien" or only understandable through their causal role within the network.
      *   **Why Non-negotiable:** This is a fundamental point. Representations are properties of the *mechanism*, not of our interpretation. Requiring human alignment biases the theory towards how *we* think, not how the *network* works. Your suspicion is correct – this is often a smuggled bias.

  8.  **Handle Spurious vs. Causal Features (Contextual)**
      *   **Motivating Case:** The spurious correlation case above. Does the network represent `S`, `T`, or both?
      *   **Requirement:** The theory should acknowledge that both `S` and `T` are *present* in the activations (decodable) and that `S` might even be *used* by the network's current causal structure. However, a *good* theory will provide tools to *distinguish* their causal status (e.g., `T` is robust to distribution shift where `S` fails; `T` is necessary even if `S` is removed). It shouldn't be forced to say *only* the intended feature is represented if the spurious one is actively used.
      *   **Why Contextual:** This tests the theory's ability to handle "misrepresentation" or reliance on shortcuts without denying their reality within the current causal structure. A purely behavioural view might ignore the distinction, while a causal view highlights it.

  ---

  ### Distinguishing Non-Negotiables from Camp Preferences

  *   **Non-Negotiables (1-7):** Arise directly from the mathematics of NNs (1, 3), the causal structure of computation (2, 4, 6), fundamental limits of underdetermination (5), or the need for objectivity about the mechanism (7). Failing any of these makes a theory inadequate for describing real NNs.
  *   **Camp-Specific Preferences (Often Smuggled In):**
      *   **Human Interpretability:** *Not required.* (See 7). Often a goal of *interpretability research*, not a requirement for a *theory of representation*.
      *   **Sparsity:** *Not required.* While superposition suggests distributed representations are common, a theory doesn't *require* representations to be sparse or dense. (SAE camp seeks sparsity for *practical* interpretability).
      *   **Single Direction vs. Subspace:** *Not prescribed.* A theory must *allow* for subspaces (3) but can also acknowledge cases where a single direction suffices (e.g., after disentanglement).
      *   **Necessity for Output:** A theory *must* take a stance on (6), but the stance itself is part of the theory's definition (internal-state vs output-oriented). Neither is universally "right", but the stance must be clear.
      *   **"Real" vs "Projected":** A theory *must* handle underdetermination (5) but doesn't have to declare all representations equally valid if causal differences exist (4). It *must* avoid anthropocentrism (7).

  ---

  ### Conflicts: The Trilemma (Faithfulness, Stability, Checkability)

  You've nailed the core tension. These three are often jointly unsatisfiable in practice:

  1.  **Faithfulness to Mechanism:** Accurately reflecting the *specific, idiosyncratic causal structure* of *this particular network instance*. (Requires detailed internal analysis).
  2.  **Stability Across Retraining:** Providing *consistent* interpretations for the *same architecture/task* across different random initialisations and training runs. (Requires generalisation over instances).
  3.  **Independently Checkable:** Being verifiable using *external tools* (probes, interventions) *without* requiring full access to or understanding of the internal weights/code. (Requires external observables).

  *   **Conflict Dynamics:**
      *   **Faithfulness vs Stability:** The precise causal pathways and feature representations (especially in superposition) can vary significantly between runs due to random initialisation, SGD noise, or symmetry breaking. A description faithful to Run 1 might be inaccurate for Run 2. A stable description across runs might be an approximation or average, missing run-specific details.
      *   **Faithfulness vs Checkability:** The most faithful description often requires intricate analysis of the specific weights and computation graph (e.g., detailed circuit tracing). Simple external probes or interventions might mislead (e.g., decoding an inert feature - see Desideratum 2).
      *   **Stability vs Checkability:** While checkability *seems* stable (use the *same* probe/intervention protocol across runs), it can fail: a probe trained on Run 1 might latch onto run-specific correlates and perform poorly or find different things on Run 2, even if the underlying function is stable. Achieving stable checkability often requires imposing an external structure (like a fixed feature dictionary) which may not be faithful.

  *   **Implication:** A theory must choose its focus and acknowledge the trade-offs. You typically can't maximise all three simultaneously for complex NNs. "Faithful to the mechanism" is often in tension with the others.

  ---

  ### Scorecard: How Do the Main Camps Fare?

  *(Focusing on how they handle the desiderata, particularly the conflicts)*

  1.  **Probe/Decode-It Crowd:**
      *   **Strengths:** Hits Invariance (1 - probes define directions/subspaces), Decodability aspect of (2), Handles Superposition (3 - probes find directions), Checkable (8), Non-anthropocentric (7 - probes find what's there).
      *   **Weaknesses:** **Fails catastrophically** on separating Decodability from Causal Efficacy (2) – their *primary evidence* (decoding accuracy) doesn't establish causal role. Weak on Causal Structure (4) – probes don't reveal *use*. Struggles with Underdetermination (5) – which probe family defines "the" representation? Poor on Unexpressed Computations (6) if probes need labels. Offers no inherent distinction for Spurious features (8).
      *   **Trilemma:** Strong on Checkability, weak on Faithfulness (probes find correlates, not necessarily causes), poor Stability (probes can latch onto run-specific noise).

  2.  **Sparse Autoencoder (SAE) / Superposition Crowd:**
      *   **Strengths:** Explicitly built for Invariance (1 - features are directions), Superposition (3 - core focus), Decodability (2 - reconstruction). Aims for Interpretability (often anthropocentric, but not theoretically required). Can contribute to finding Causal features (4) if used with interventions.
      *   **Weaknesses:** Doesn't inherently solve Decodability vs Causal Efficacy (2) – a recovered feature might be inert. SAEs impose an external structure (sparse code); faithfulness depends on how well it matches the network's *actual* code (which might be non-sparse or use different bases). Struggles with Underdetermination (5) – different dictionaries/bases might reconstruct equally well. Anthropocentrism often smuggled in via evaluation.
      *   **Trilemma:** Aims for Faithfulness (recovering the network's code), but SAE fitting is imperfect and can impose bias. Checkability depends on SAE quality. Stability across runs is an open question.

  3.  **Causal Intervention Crowd (Patching, Ablation, Interchange):**
      *   **Strengths:** **Strongest** on Causal Efficacy (2) and Causal Structure (4) – interventions directly test causal role. Handles Invariance (1 - interventions on subspaces/directions), Spurious Features (8 - tests necessity/sufficiency). Agnostic about implementation (handles Superposition (3) implicitly). Can address Unexpressed Computations (6) by intervening internally. Non-anthropocentric (7).
      *   **Weaknesses:** Can be computationally expensive. Defining the "right" interventions requires hypotheses. **Struggles most with Underdetermination (5)** – if two different feature sets pass *all* causal tests equally, how to choose? (Requires embracing equivalence or agnosticism). Checkability can be complex.
      *   **Trilemma:** Strongest on Faithfulness. Checkability is good *if* you can design the right interventions. **Stability is the biggest challenge** – causal pathways *can* differ across runs, making stable interpretations hard.

  4.  **Behavioural Minimalism ("Just Stop Reifying"):**
      *   **Strengths:** Avoids over-interpretation. Focuses on inputs/outputs. Trivially handles Invariance (1), Underdetermination (5 - "neither is real"), Spurious Features (8 - "it just outputs based on inputs").
      *   **Weaknesses:** **Fails completely** on Decodability vs Causal (2), Causal Structure (4), Superposition (3), Unexpressed Computations (6), Non-anthropocentrism (7 - irrelevant). Offers no explanatory power for *how* the behaviour is produced. Cannot distinguish a network using `T` from one using `S` if behaviour is identical *on the test set*.
      *   **Trilemma:** Only cares about Checkability (input/output behaviour). Ignores Faithfulness and Stability (internal mechanism).

  ---

  ### The Bottom Line

  1.  **Non-negotiables:** Your instincts were sharp. Invariance, separating decodability from causality, handling superposition, respecting causal structure, accepting underdetermination, and avoiding anthropocentrism are essential. Theories flunking these aren't fit for purpose.
  2.  **The Trilemma is Real:** Faithfulness, Stability, and Independent Checkability *do* conflict. You usually prioritise two at the expense of the third. Causal Intervention prioritises Faithfulness, Probes prioritise Checkability, SAEs try for Faithfulness but struggle with Stability. No camp solves it neatly.
  3.  **Your Toy Case is Key:** Any theory *must* refuse to uniquely answer "which one is real?" in your perfectly symmetric case (Desideratum 5). This forces theories to be pluralistic or agnostic about equivalent representations.
  4.  **The Camp Scores:** Causal Intervention tackles the hardest non-negotiables (causal efficacy, structure) best but stumbles on stability/underdetermination. Probes fail the causality test. SAEs offer a candidate mechanism but need causal validation. Minimalism ignores the mechanism. For your distributed systems mindset, the Causal Intervention approach likely feels most "engineered" but faces the distributed systems classic: non-determinism (across runs) hinders stable global views.
  5.  **Answers to Your Specifics:**
      *   **Unexpressed Computation:** A *good* causal theory says "yes, if it plays a causal role internally". A probe-only theory might miss it. Minimalism says "no representation, just behaviour".
      *   **Spurious Shortcut:** A causal theory says "both are represented *and* used, but their causal roles differ (`T` is robust/necessary, `S` is brittle/contingent)". Others might conflate or ignore the distinction.
      *   **Non-Human Concept:** Any non-anthropocentric theory (as required) must say "yes, it represents it" if it plays a causal role, even if we can't map it cleanly to a human idea.

  The takeaway: Demand a theory that handles the non-negotiables, especially causal efficacy and invariance. Be wary of anything conflating decodability with representation or demanding human alignment. Accept that underdetermination happens. And recognise the trilemma – you'll usually have to sacrifice one of faithfulness, stability, or easy checkability. The Causal Intervention crowd gets closest on the core mechanism, at the cost of complexity and stability headaches. Your two-layer toy case is the canary in the coal mine: if a theory can't handle that gracefully, bin it.
