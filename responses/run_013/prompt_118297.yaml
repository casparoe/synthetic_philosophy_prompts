  Hmm, the user wants me to construct a pair of cases for the extended mind debate that challenge the standard criteria for cognitive extension. This is quite an advanced philosophy of mind request focusing on Clark and Chalmers' extended cognition thesis.

  The key requirements are:
  1. Create two functionally identical scenarios where the external resource (not a notebook) plays the same cognitive role
  2. Only one non-functional difference should separate the cases
  3. The standard parity principle criteria should deliver opposite verdicts (extended vs not extended)
  4. I need to derive the verdicts using the parity principle and standard conditions (constant availability, easy accessibility, automatic endorsement, integration)
  5. Then analyze whether the non-functional difference can be redescribed as functional
  6. Finally consider potential replies and what this shows about sufficiency of criteria

  I recall the core argument: if an external process functions just like an internal cognitive process would, it should count as part of the mind. The classic example is Otto's notebook compensating for memory impairment.

  For my cases, I'm considering using digital resources since they're contemporary and non-science-fiction. The tricky part is finding a non-functional difference that could flip the verdict. Ownership seems promising - whether the resource is personally owned versus shared/public might affect the "automatic endorsement" aspect without changing actual functionality.

  Let me develop Case A: a researcher with a private digital knowledge base that's become integral to their workflow. Case B: someone using an identical public resource. Functionally identical usage patterns, but different ownership.

  For Case A, I'll argue it satisfies all criteria: constantly available (cloud-synced), easily accessible (bookmarked), automatically endorsed (trusted), fully integrated (daily workflow). By parity principle, this should extend cognition.

  For Case B, the hitch comes with "automatic endorsement." While functionally identical in use, the community-edited nature might introduce epistemic caution - not full automatic endorsement. Thus it wouldn't satisfy the criteria.

  In analysis, I must check if ownership can be redescribed functionally. The endorsement hesitation might count as functional difference, requiring case adjustment. But if we strictly interpret "functionally identical behavior," the hesitation might be dispositional rather than actual, preserving functional equivalence.

  The strongest reply from an extended mind defender would likely be that any endorsement difference is already functional, so criteria aren't truly challenged. This would mean adding no new conditions but tightening interpretation. The cases invite but don't force the verdict flip - they highlight ambiguity in "automatic endorsement."

  This construction suggests the criteria might have implicit requirements about personalization or control that aren't fully captured in standard formulations.
answer: |-
  Here is a pair of cases satisfying your requirements, designed to test the sufficiency of the standard extended cognition criteria (Parity Principle plus constant availability, easy accessibility, automatic endorsement, and integration):

  **Case A: The Private Reference Cache**
  Dr. Aris, a pharmacologist, uses a dedicated, personal digital reference system ("PharmaCache") integrated into her workflow. She built it herself over years, populating it with meticulously curated drug interaction data, protocols, and chemical profiles synced across her devices. When prescribing or researching, Aris instantly consults PharmaCache via a dedicated hotkey or voice command. The information appears instantly on her primary screen. She treats its outputs as her own recalled knowledge, automatically basing dosing decisions and research hypotheses on it without double-checking, just as she would rely on biological memory. It is constantly available (cloud-synced, offline-capable tablet), effortlessly accessible (one step, integrated into her prescription software), automatically endorsed (she has implicit, unreflective trust in its accuracy due to her curation), and deeply integrated (its use is a seamless, non-disruptive step in her routine clinical and lab work. She never questions its provenance during use.

  *   **Parity Principle Argument:** If the process of instantly retrieving highly specific, reliable drug interaction data via a neural recall mechanism occurred inside Aris's head, we would unhesitatingly count it as part of her cognitive process (specifically, memory retrieval).
  *   **Conditions Applied:** PharmaCache is constantly available (synced, offline). It is easily accessible (one-step, integrated command). It is automatically endorsed (Aris trusts it implicitly during use, no hesitation). It is integrated into her activity (seamless part of prescribing/research workflow).
  *   **Conclusion:** Therefore, by the Parity Principle and satisfaction of the standard conditions, PharmaCache qualifies as part of Aris's extended cognitive system.

  **Case B: The Community Wiki Workflow**
  Dr. Ben, another pharmacologist with identical expertise and workflow to Aris, uses "PharmaWiki," a meticulously curated, highly reliable, hospital-wide wiki system containing *the exact same content* as Aris's PharmaCache. Ben contributed significantly to it and uses it identically: same dedicated hotkey/voice command integrated into his prescription software, same instant display on his primary screen during consultations and research. He consults it just as effortlessly and automatically as Aris, bases his decisions identically on its outputs in the moment, and it plays the *exact same functional role* in guiding his actions with the same reliability. It is constantly available (same cloud/offline setup), easily accessible (same one-step command), and integrated identically into his routine. *However*, Ben knows PharmaWiki is a communal resource; others can edit it (though edits are rare, strictly moderated, and Ben reviews notifications later). While functionally identical in use *during the cognitive task*, he retains a background awareness of its communal nature.

  *   **Parity Principle Argument:** If the process of instantly retrieving highly specific, reliable drug interaction data via a neural recall mechanism occurred inside Ben's head, we would unhesitatingly count it as part of his cognitive process (memory retrieval).
  *   **Conditions Applied:** PharmaWiki is constantly available (identical setup). It is easily accessible (identical access). It is integrated into his activity (identical workflow role). *However, regarding automatic endorsement:* While Ben *behaves* identically to Aris during use (no hesitation, bases decisions on it automatically), the knowledge that it's communal means his endorsement isn't quite *automatic* in the same way. He doesn't consciously doubt it *in the moment of use*, but the endorsement carries an implicit, background caveat – "this is the shared resource" – unlike Aris's sense of it being purely *her own* knowledge store. This difference doesn't manifest in functional use or reliability but in the *character* of the endorsement.
  *   **Conclusion:** Therefore, while PharmaWiki satisfies constant availability, easy accessibility, and integration, it *fails* the condition of "automatic endorsement" in the required sense. The endorsement, though behaviorally identical, lacks the quality of being unquestionably *personal* or *owned*. Thus, PharmaWiki does *not* qualify as part of Ben's extended cognitive system.

  **Report on Construction:**

  1.  **The Single Feature:** The differentiating feature is **ownership/control and perceived personalization**. In Case A, the resource is perceived as entirely personal and under Aris's sole control (even if technically digital). In Case B, it is perceived as communal/shared, even if Ben has high control and trust.
  2.  **Verdict Flip if Removed:** If both resources are stipulated to be perceived by the user as identically personal and under their sole control (or both as identically communal), the functional identity would likely lead to the *same* verdict for both (probably extension, assuming the communal case could then meet endorsement).
  3.  **Redescribed as Functional Difference?** This is the crux. *Can the difference in perceived ownership/control be redescribed as a difference in "automatic endorsement"?*
      *   **Argument for Yes:** "Automatic endorsement" might inherently include the absence of any background caveat about provenance or shared control. Ben's background awareness *is* a dispositional difference in trust – a lower threshold for potential doubt if challenged, even if not active during use. This makes endorsement *functionally* different at a dispositional level.
      *   **Argument for No:** The condition specifies endorsement manifested *in use*. During the actual cognitive task (prescribing, researching), Ben's behavior, reliance, and lack of hesitation are *functionally identical* to Aris's. The background awareness doesn't alter the *function* of the resource *in the process*. It's a non-functional, perhaps meta-cognitive, difference.
      *   **Rebuild Attempt:** To avoid this ambiguity, rebuild Case B stipulating that Ben experiences PharmaWiki *during use* with *exactly the same sense of personal ownership and automatic, caveat-free endorsement* as Aris. He functionally treats it as "his knowledge," forgetting its communal aspect while using it. *Now the functional identity is total.* In this rebuilt case, applying the criteria forces the *same* verdict (extension) for both. **Finding:** It *is* challenging to construct a pair with total functional identity where the criteria clearly deliver opposite verdicts without the "endorsement" condition being sensitive to the (often dispositional or phenomenological) difference introduced by ownership/perceived control. This suggests that "automatic endorsement" might inherently encompass aspects of perceived personal control or ownership, making it difficult to isolate a purely non-functional difference that flips the verdict under the criteria.

  **Strongest Reply from Defender of Extended Cognition & Conclusion:**

  *   **Strongest Reply:** The defender would argue that the initial Case B *does* involve a functional difference in "automatic endorsement" at the relevant level. True "automatic endorsement," required for seamless cognitive integration analogous to biological processes, *necessitates* the resource being experienced as unquestionably personal and under the subject's exclusive control during use. Ben's background awareness *is* a dispositional state that constitutes a failure of full automatic endorsement, functionally differentiating his case from Aris's. The criteria correctly identify this difference and deliver the correct verdicts. This reply **denies the intuition** that the cases are functionally identical regarding endorsement; it interprets "automatic endorsement" as requiring the phenomenological quality of personal ownership/integration.
  *   **What the Cases Force vs. Invite:** The cases **invite** the conclusion that the standard criteria, particularly "automatic endorsement," are sensitive to features like perceived ownership/control that might not be captured by pure input-output functionalism during the task. They do **not force** the conclusion that extension occurs in A but not B under a strict reading of the criteria, because the criteria (via "endorsement") can be interpreted as *already encompassing* the ownership/control aspect. They primarily highlight the ambiguity and potential phenomenological depth within the "automatic endorsement" condition. They **force** the recognition that satisfying the letter of the criteria (constant, easy, integrated, apparently automatic use) might not be sufficient if "endorsement" is interpreted as requiring a specific, personal quality of trust.
