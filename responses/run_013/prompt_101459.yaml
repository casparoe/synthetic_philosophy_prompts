  For the Stand-In app as a test case: Tom sees it as efficient if consensual; Priya sees it as corrupting social rituals. The disagreement boils down to whether the objection is conceptual (changing what the good IS) or empirical (predicting negative outcomes), and whether consent resolves it. 

