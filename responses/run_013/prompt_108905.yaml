prompt: |-
  I'm TAing a second-year course on causal inference (the stats-for-philosophers version, not the engineering one) and I'm badly behind on marking. I wrote the midterm question below myself — it's out of 10, split 3/4/3 across the parts. One students script is pasted under it. Could you mark it and give me the comments you'd actually write in the margin?

  The question:

  A further education college trialled two tutoring programmes, New and Old. The scheduling office assigned students to programmes, and it's well known that the office steers students with strong prior attainment towards Old, because Old runs in the slots that suit the students who are already ahead. Pass rates were:

  High prior attainment: New 9 passed out of 10; Old 440 out of 500.
  Low prior attainment: New 40 out of 100; Old 19 out of 100.

  (a) [3 marks] Report the overall pass rate for each programme, and the pass rate for each programme within each attainment stratum. Does the pattern reverse?

  (b) [4 marks] The college asks which programme to keep. Which comparison answers that question, and why? Say what has to be true of the allocation for your answer to go through.

  (c) [3 marks] A student in the same class writes: "Whenever you find a reversal like this, the disaggregated comparison is the causally correct one. That's what Simpson's paradox teaches." Assess that claim.

  The script:

  (a) Overall, New = 49/110 = 44.5% and Old = 459/600 = 76.5%. Within the high attainers, New = 9/10 = 90% and Old = 440/500 = 88%. Within the low attainers, New = 40/100 = 40% and Old = 19/100 = 19%. So yes, it reverses: Old is far better overall, but New is ahead in both strata.

  (b) The stratified comparison answers the college's question. Prior attainment is a confounder: it affects which programme you get, because the office sends the strong students to Old, and it also affects pass rates, so the overall figures are mixing two different groups in different proportions and the comparison between them is picking up the allocation rather than the programmes. And since the reversal itself shows there is confounding here, we should read the effect off the strata. The effect of switching to New is the average of the two within-stratum differences, i.e. (90 − 88) and (40 − 19), averaged over the two strata, which comes to about 11.5 percentage points, so New raises the pass rate by roughly 11.5 points. Assuming no unmeasured confounding, the college should keep New.

  (c) Yes, that's right, and it's the standard moral of the paradox. The aggregate table is an artefact of how the two groups happen to be weighted, so the honest comparison is always the one that holds the confounder fixed. It isn't a quirk of the pass-rate statistic either: it comes out the same whether you look at pass rates, risk ratios or odds ratios. And you couldn't get a reversal at all if the allocation had been randomised, since randomisation removes the confounding — which is why randomised trials don't have to have this discussion.

  I want one mark out of 10, with a per-part breakdown and the specific comments that justify it. Please actually commit: say what each part gets, what you'd write, and if a sentence in the script is ambiguous enough that two readings would give different marks, pick the reading you're marking it under and say which one you picked. Don't hand me "here are the considerations on both sides" and leave the mark to me. If something is right for the wrong reason, say so and say whether it costs marks, and if you think another marker would reasonably land on a different total, tell me what you'd rule and why.
reasoning: |-
  Okay, I'm diving into this TA request. The user wants me to actually mark a student's causal inference exam script with strict scoring and margin comments. Let me unpack this carefully.

  First, the question setup: It's a classic Simpson's paradox scenario with tutoring programs. The student's answers seem strong at first glance, but I need to scrutinize them against the mark allocation. 

  For part (a): The student correctly calculates all rates (overall: New 44.5%, Old 76.5%; stratified: High-New 90% vs Old 88%, Low-New 40% vs Old 19%) and identifies the reversal. But they missed the "far better" phrasing issue - "ahead" would be more precise. Still, all essentials are there. 3/3 seems fair.

  Part (b) is trickier. The student correctly identifies stratified comparison and confounding, but stumbles on three key points: 
  - They imply simple averaging of differences (90-88 and 40-19) rather than weighting by stratum size
  - Claim New raises pass rate by 11.5pp is mathematically wrong (should be weighted average)
  - Overconfidently states "no unmeasured confounding" as the only requirement when positivity could be violated
  The core reasoning is good but these errors cost marks. I'm leaning toward 2.5/4.

  For part (c): The student makes two serious errors:
  - Claims reversal "always" indicates confounding (not necessarily - could be non-collapsibility)
  - Incorrectly says randomization prevents reversals (they absolutely can occur without confounding)
  The "honest comparison" point is salvageable but the absolutism sinks it. 1/3 seems right.

  Total 6.5/10 feels harsh but defensible. I'll note in margins that another marker might give 7/10 if lenient on part (b)'s weighting error. User specifically asked for commitment though - no waffling.

  The margin comments should pinpoint exactly where reasoning diverges from course concepts, especially the randomization misconception in (c). I'll avoid generic praise - focus on corrective feedback since user is time-pressed and needs efficient marking.
answer: |-
  Here's the marked script with comments and scoring. I've committed to specific marks based on the answer's content against the rubric, noting where another marker might reasonably differ.

  **Overall Score: 6.5/10** (Breakdown: a: 3/3, b: 2.5/4, c: 1/3)  
  *(Another marker might award 7/10 if lenient on b's weighting error, but 6.5 is defensible.)*

  ---

  ### (a) Mark: 3/3
  **Script:**  
  *"Overall, New = 49/110 = 44.5% and Old = 459/600 = 76.5%. Within the high attainers, New = 9/10 = 90% and Old = 440/500 = 88%. Within the low attainers, New = 40/100 = 40% and Old = 19/100 = 19%. So yes, it reverses: Old is far better overall, but New is ahead in both strata."*  

  **Margin Comments:**  
  ✓ Correct overall pass rates (44.5% New, 76.5% Old).  
  ✓ Correct stratified rates (High: 90% vs 88%; Low: 40% vs 19%).  
  ✓ Correctly identifies reversal.  
  *Minor note: "ahead" is better than "far better" for Old overall, as the reversal is the key point.*  

  ---

  ### (b) Mark: 2.5/4  
  **Script:**  
  *"The stratified comparison answers the college's question. Prior attainment is a confounder: it affects which programme you get, because the office sends the strong students to Old, and it also affects pass rates, so the overall figures are mixing two different groups [...] we should read the effect off the strata. The effect of switching to New is the average of the two within-stratum differences, i.e. (90 − 88) and (40 − 19), averaged over the two strata, which comes to about 11.5 percentage points, so New raises the pass rate by roughly 11.5 points. Assuming no unmeasured confounding, the college should keep New."*  

  **Margin Comments:**  
  ✓ **Strong start:** Correctly identifies confounding and need for stratified comparison (key insight).  
  ✓ **Allocation requirement:** Implicitly addresses non-random allocation (though "assuming no unmeasured confounding" is partially misplaced here – see next).  
  ✗ **Major error:** The "average" of differences (2pp + 21pp = 23pp / 2 = 11.5pp) **ignores stratum sizes**. The high-attainment stratum is 5x larger (500 vs 100 in Old, 10 vs 100 in New). Weighted average is essential.  
  *Correct calculation:*  
  - Overall effect = [Prop_High × (Diff_High)] + [Prop_Low × (Diff_Low)]  
  - E.g., using sample sizes: [(510/710)×(2%)] + [(200/710)×(21%)] ≈ 7.2pp (not 11.5pp).  
  ✗ **Misplaced assumption:** "No unmeasured confounding" isn't the core requirement here. The critical allocation assumption is **positivity** (all students could access either program) and that stratification fully adjusts for confounding. No unmeasured confounding is needed for causal interpretation but isn't the *allocation* requirement.  
  ✓ **Conclusion directionally correct:** Recommends New based on strata (but effect size is wrong).  

  **Scoring Justification:**  
  - Full marks for identifying confounding and stratification (core of the question).  
  - -1 for unweighted average (substantive error).  
  - -0.5 for vague/misplaced assumption.  
  *(Another marker might deduct -1.5 total for assumptions + weighting, giving 2.5/4.)*  

  ---

  ### (c) Mark: 1/3  
  **Script:**  
  *"Yes, that's right, and it's the standard moral of the paradox. The aggregate table is an artefact of how the two groups happen to be weighted, so the honest comparison is always the one that holds the confounder fixed. It isn't a quirk of the pass-rate statistic [...] And you couldn't get a reversal at all if the allocation had been randomised, since randomisation removes the confounding — which is why randomised trials don't have to have this discussion."*  

  **Margin Comments:**  
  ✓ **Partial credit:** Correctly notes aggregate comparisons can be misleading and fixed-confounder comparison is often preferable.  
  ✗ **Overclaim:** "Always" is false. Disaggregation isn't always causally correct (e.g., if the confounder is a collider, or for non-collapsible effect measures like odds ratios). Simpson's paradox doesn't imply this universal rule.  
  ✗ **Factual error:** Reversals **can occur in RCTs** without confounding (e.g., due to non-collapsibility). Randomization removes confounding but not algebraic reversal!  
  ✗ **Risk ratio quirk:** The claim "it comes out the same for risk/odds ratios" is incorrect. Odds ratios can reverse even when risk ratios don’t (Berkson’s paradox).  

  **Scoring Justification:**  
  - +1 for recognizing disaggregation avoids confounding bias here.  
  - -2 for absolutism ("always"), reversal/RCT error, and technical misconceptions.  
  *(No ambiguity: the RCT claim is definitively wrong and central to the assessment.)*  

  ---

  ### Summary for TA:
  - **Total:** 6.5/10 (a: 3, b: 2.5, c: 1).  
  - **Key Weaknesses:**  
    - (b) Unweighted averaging and conflated assumptions.  
    - (c) Overgeneralizing Simpson's paradox and misrepresenting RCTs.  
  - **Where Others Might Differ:**  
    - (b) Could be 3/4 if weighting error is deemed minor (but 2.5 is safer due to effect-size impact).  
    - (c) Strict markers might give 0/3 for the RCT error.  
  - **Feedback Tone:** Direct but constructive. Focus on technical missteps (weighting, RCTs) rather than philosophy.  
  - **Action:** Consider emphasizing in class that (1) weighted averages matter, (2) reversals ≠ confounding, (3) RCTs aren't immune to aggregate reversals.
