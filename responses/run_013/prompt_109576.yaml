  For the example, textbook cases (like knowing all axioms of arithmetic) won’t work because they’re too abstract. Students need something concrete where the inference is valid but computationally tedious, like a long disjunction. The "premises/conclusion" framing is smart—it mirrors how they’d encounter this in real reasoning. The example must lack obvious shortcuts (like modular arithmetic) to force the computational failure.

  Misconceptions will pop up at specific points: when introducing Kripke semantics (idealisation ≠ frictionless plane), when discussing closure (restricting worlds ≠ solving omniscience), or when mentioning impossible worlds (they’re not just alternative accessibility). Each needs shutting down immediately except the last—impossible worlds as primitive is worth flagging as a live option.

  The awareness/computation distinction is crucial but easily conflated. I’ll use the same example for both: first show unawareness (agent hasn’t considered the long disjunction), then computation failure (she has considered it but can’t derive it). This sets up later discussions of solutions like awareness logic vs. resource-bounded models.

  For the closing question, avoid "what fixes X?"—that tests solution-memorising. Instead, ask why logical omniscience persists in standard models despite being unrealistic. A good answer identifies the clash between possible worlds (truth-preserving) and finite minds; a bad answer just lists solutions. 

  Time is tight, so I’ll explicitly exclude impossible worlds semantics. Nudging students toward epistemic dynamics (e.g., how agents *gain* knowledge) could spark interest for follow-ups. 

