answer: |-
  Here’s a structured plan for your 90-minute session on logical omniscience, tailored for philosophy graduates new to epistemic logic. The sequence prioritises intuitive tension before formalism, uses a concrete example to anchor abstraction, and pre-empts key misconceptions.

  **Teaching Sequence & Rationale**  
  1. **Open with a relatable failure of closure (15 mins)**  
     *Why:* Start with the *problem* before the semantics. This creates cognitive dissonance—students feel the absurdity of idealisation immediately. If you begin with possible worlds, the idealisation seems "baked in," making it harder to critique.  
     *Example:* Use **Jill and the Lottery Disjunction** (details below).  

  2. **Introduce basic epistemic logic semantics (20 mins)**  
     *Why:* Now formalise *why* Jill’s failure can’t be modelled. Define:  
     - Worlds \(W\), accessibility relation \(R_a\), valuation \(V\)  
     - Knowledge as truth in all accessible worlds: \(K_a \varphi \iff w \models K_a \varphi \text{ iff } \forall v (wR_av \implies v \models \varphi)\)  
     *Emphasise:* The semantics *entails* closure under entailment. Derive it step-by-step:  
     - If \(\varphi \models \psi\) and \(w \models K_a \varphi\), then \(\psi\) holds in all \(R_a\)-accessible worlds.  
     - Thus \(w \models K_a \psi\).  

  3. **Analyse why Jill breaks the model (10 mins)**  
     *Why:* Explicitly map her case to the formalism. In Jill’s scenario:  
     - \(K_a(\text{Ticket 1 loses} \land \dots \land \text{Ticket 1000 loses})\) holds.  
     - \(\models (\text{Ticket 1 loses} \lor \dots \lor \text{Ticket 1000 loses})\) is a tautology.  
     - But \(\neg K_a(\text{Ticket 1 loses} \lor \dots \lor \text{Ticket 1000 loses})\).  
     *Conclusion:* Standard semantics cannot represent Jill.  

  4. **Distinguish awareness vs. computation failure (15 mins)**  
     *Why:* Show logical omniscience has *two* breakdown points. Reuse Jill:  
     - *Awareness failure:* Jill hasn’t *considered* the 1000-ticket disjunction (though she possesses its components).  
     - *Computation failure:* Suppose she *entertains* the disjunction but hasn’t deduced it (too many steps).  
     *Key insight:* Solutions targeting awareness (e.g., syntactic filters) won’t fix computation (e.g., proof complexity).  

  5. **Address misconceptions (20 mins)**  
     Anticipate and dismantle these:  
     - **"Harmless idealisation like frictionless planes"**  
       *When it surfaces:* During semantics introduction.  
       *Why wrong:* Frictionless planes *approximate* reality; logical omniscience *contradicts* finite reasoners’ core limits.  
       *Shut down early:* Before deriving closure.  
     - **"Restrict accessibility relations to fix closure"**  
       *When:* After presenting Jill’s case.  
       *Why wrong:* If Jill’s worlds all satisfy premises, they satisfy conclusions (by definition). Restricting \(R_a\) only hides inconsistency.  
       *Crush immediately:* Show it mathematically.  
     - **"Failure of closure implies inconsistent beliefs"**  
       *When:* During closure derivation.  
       *Why wrong:* Jill’s beliefs are consistent but *incomplete*.  
       *Flag as live option:* This is defensible in *doxastic* logic but not for knowledge.  
     - **"Impossible worlds are just worlds with different \(R_a\)"**  
       *When:* During Q&A or when mentioning solutions.  
       *Why wrong:* Impossible worlds violate logical laws (e.g., \(\varphi \land \neg \varphi\) true). Accessibility relations preserve truth.  
       *Flag as live option:* This is a substantive (if contentious) approach.  

  6. **Conclude with diagnostic question (5 mins)**  
     - **Question:** *"Why does the possible worlds model force logical omniscience even if we make the agent’s accessibility relation extremely limited (e.g., only one world)?"*  
     - **Good answer:** Identifies that *truth in all worlds* (by definition) includes *logical* truths. Even with one world, if \(\varphi\) is valid, \(K_a \varphi\) holds.  
     - **Bad answer:** Focuses on "too many worlds" or "agent can’t tell worlds apart"—misdiagnosing the formalism.  

  **The Central Example: Jill and the Lottery Disjunction**  
  - **Setup:** Jill knows lottery tickets 1–1000 are all losers (e.g., she sees them destroyed).  
  - **Premises:** \(K_a(\text{loser}_1 \land \text{loser}_2 \land \dots \land \text{loser}_{1000})\)  
  - **Valid inference:** \(\models \text{loser}_1 \lor \text{loser}_2 \lor \dots \lor \text{loser}_{1000}\) (a tautology)  
  - **Conclusion:** \(\neg K_a(\text{loser}_1 \lor \dots \lor \text{loser}_{1000})\) → Jill hasn’t formed this belief.  
  - **Why it works:**  
    - Uses only propositional logic & conjunction/disjunction.  
    - Inference is valid but *obscured by length* (1000 disjuncts).  
    - "Plainly does not know" feels intuitive—no one conjoins 1000 beliefs into a disjunction spontaneously.  
  - **Why textbook examples fail:**  
    - Axioms of arithmetic: Too abstract; students may accept "knowing axioms" as definitional.  
    - Formal system theorems: Feels "external" to the agent; Jill’s case is *psychologically plausible*.  

  **What to Omit**  
  Openly state you **will not cover** solutions in detail (e.g., impossible worlds, awareness logic, dynamic epistemic logic). Why: 90 minutes suffices to *problematise* logical omniscience but not to survey fixes. Instead, hint that solutions exist but require trade-offs (e.g., awareness logic handles "unconsidered propositions" but not computational limits).  

  **Session Flow Summary**  
  - 0–15 min: Jill’s story → intuitive problem.  
  - 15–35 min: Epistemic semantics → why Jill breaks it.  
  - 35–45 min: Formalise Jill’s failure.  
  - 45–60 min: Awareness vs. computation + misconceptions.  
  - 60–85 min: Q&A, solidify distinctions.  
  - 85–90 min: Diagnostic question.  

  This structure ensures students *feel* the problem before seeing its inevitability in the formalism, using a case that’s both technically simple and humanly relatable. The emphasis on *two failure types* prepares them to evaluate solutions critically later.  

  ---  
  *British English note:* "Maths" not "math", "modelled" not "modeled", "emphasise" not "emphasize", etc., used throughout.
