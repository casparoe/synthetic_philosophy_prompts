prompt: |-
  I'm in a weird spot with a film club thing — we rewatched Memento last week and I've been stuck on it since. Here's my half-formed idea: Leonard's condition is basically the frame problem turned into a character. In the AI literature the frame problem starts out as a technical headache — when you write down what changes when an action happens, you also have to write down everything that *doesn't* change, and you obviously can't list all of that, so naive logical representation blows up — but the deeper version, the one Dennett keeps pushing, is really about relevance: an agent in a messy world has to know which handful of facts out of an infinity of true ones bear on what it's doing right now, and there's no cheap way to know that. Leonard has no working frame at all. Every moment is a fresh problem, so he externalises one: tattoos, Polaroids, notes, a whole interpretive system he has to trust. I want a reading of the film through that lens. Where does the analogy actually hold — the tattoos as a clumsy attempt at a frame axiom, the Sammy Jankis story as a corrupted update rule, the way the film's structure forces *us* to hold a frame together for two hours so the plot can even be a plot? And where does it break down? My worry is that Leonard's real issue is that he can track relevance fine — he's just lying to himself about what's relevant, which is self-deception, not the frame problem, and if that's the truth of it then the analogy is flattering the film and I should drop it.

  Second thing I want out of this: does the film dramatise something the technical problem misses — like that having a frame isn't just a computational necessity but partly an ethical and identity thing, that we're at least somewhat responsible for the frame we keep, and can be blamed for maintaining a bad one? If the film does add something there, I'd like that spelled out rather than hinted at. Dont quote dialogue at me, I don't have the script in front of me and I don't want to be sold a line I can't check. And please tell me how confident you are in the reading overall and single out the one claim in it you're least sure of.
