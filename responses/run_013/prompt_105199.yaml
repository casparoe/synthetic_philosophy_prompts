  Right, for Keynes' response: must defend two pillars - probability as logical relation, and weight as independent dimension. Should grant subjectivist resilience has parallels but insist it's derivative. Key distinction: logical probability exists independent of minds, while subjectivism is psychological. 

  Ah, the coin example is perfect for highlighting weight. Keynes would argue knowing nothing about the second coin isn't just low confidence - it's a different epistemic state altogether. The "different kind of question" point is crucial here. 

  On logical relations: must emphasize they constrain rational belief objectively. Subjectivists can believe anything coherently - but Keynes would say some probabilities are inherently more reasonable given evidence. That's why he'd reject "resilience" as sufficient - it measures stickiness of belief, not its grounding. 

  Tone notes: donnish but not pompous. Continuous prose, no academic clutter. Should feel like a Cambridge high table discussion. Opening with "My dear colleague" sets the right register - collegial but firm. 

  Biggest risk is sounding like a relic. Must show Keynes' ideas still bite: that subjectivism risks losing the distinction between well-founded and arbitrary uncertainty. The wartime investment example could illustrate this later if needed.
answer: |-
  My dear colleague,  

  You press an earnest challenge, and I shall meet it plainly. Let us begin with your subjectivist’s "resilience" — that measure of how far a present degree of belief might withstand new evidence. It is ingenious, I grant, and indeed mirrors *some* aspects of what I termed the "weight" of argument. But it remains, crucially, a shadow cast by the very probability it seeks to supplement — a calculation derived from subjective credences and anticipated evidence. Weight, as I conceive it, is not merely about the *stability* of belief, but about the *completeness* of the evidence itself. When you know nothing of the second coin — its provenance, its symmetry, the constancy of its bias — you face not merely fragile belief but a fundamental paucity of relevant grounds. The fair coin rests on a *positive body of knowledge*: the physics of symmetry, empirical trials, perhaps metallurgical consistency. The unknown coin lacks these grounds altogether; its probability of one-half is a hollow formalism, resting on indifference rather than positive evidence. Resilience quantifies anticipated volatility; weight measures the depth of the foundation beneath the proposition. One is dynamic; the other ontological. They are not the same dimension.  

  As for probability as a logical relation: you say the subjectivists abandoned it, reducing all to degrees of belief in a coherent agent. But coherence alone cannot distinguish between beliefs that are *arbitrary* and those that are *warranted*. Consider two men: one believes a fair coin will land heads (P=0.5) after inspecting its geometry and conducting trials; another assigns P=0.5 to an unknown coin purely by default, lacking any grounds to prefer heads or tails. Both are coherent; both satisfy the probability calculus. Yet only the first belief is *reasonable* — grounded in a logical relation between evidence and conclusion. The subjectivist, focusing solely on internal consistency, cannot capture this distinction. Probability, for me, is not psychological but epistemological: it resides in the objective (though often imperfectly known) logical bearing of evidence upon hypothesis. It constrains rational belief, whereas subjectivism merely describes it. Your coins and urns do display this: the probability *is* the relation, whether any mind apprehends it or not. The subjectivist’s degrees of belief are psychological responses to that relation — sometimes apt, sometimes not.  

  So I maintain: without logical probability, we lose the force of evidence; without weight, we lose the texture of ignorance.  

  I await your riposte.  

  Yours in discourse,  
  J.M.K.
