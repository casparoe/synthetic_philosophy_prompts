          Group1: A>B (7 votes A)
          Group2: B>A (6 votes B) -> actually, group2 prefers B over A? In group2: B>C>A, so B over A -> 6 votes B.
          Group3: C>A>B -> so A over B? Or C over both? They prefer A over B? Because in their ranking, A is above B? Yes. So group3 votes for A over B: 7 votes A.
          Total: A: 7+7=14, B:6 -> A wins.

     Between B and C:
          Group1: A>B>C -> they prefer B over C? Yes, because B is above C -> 7 votes B.
          Group2: B>C -> 6 votes B? Actually, they prefer B over C? Yes -> 6 votes B.
          Group3: C>A>B -> they prefer C over B? Yes -> 7 votes C.
          Total: B: 7+6=13, C:7 -> B wins.

     Between C and A:
          Group1: A>B>C -> they prefer A over C -> 7 votes A.
          Group2: B>C>A -> they prefer C over A? No, they prefer A last? So they would vote C over A? Actually, in pairwise: they prefer C to A? Yes, because in their ranking C is above A -> 6 votes C.
          Group3: C>A>B -> they prefer C over A -> 7 votes C.
          Total: C:6+7=13, A:7 -> C wins.

     So we have A beats B, B beats C, C beats A: a cycle.

     We can do this without signals. We assign the rankings to the students. We tell them the true state is A, but we don't tell them the rankings of others. Then we have three pairwise votes: A vs B, B vs C, C vs A. We then see the cycle.

     But we need to link to the CJT? The CJT is for binary choices. When there are more than two, cycles can occur.

     This can be done quickly: 5 minutes.

  **What can go wrong:**

    1. **Statistical fluke:** With only two rounds per condition (without discussion), we might get an outlier. For example, in condition 1, the group might make a mistake by chance (which has low probability but nonzero). In condition 3, the group might be correct by chance. We can handle this by:

          - In the debrief, show the theoretical expectations and note that we only did a few rounds, so it might not have shown perfectly. But with 20 students, the effect should be strong.

          - Use the individual-level data: in condition 1, we can compute the proportion of individual correct votes in the two rounds. It should be around 70%. Then show that the group vote (majority) was correct in both rounds? And then explain that the probability of the group being correct is very high when each has 70% and independent.

          In condition 2: we expect the individual accuracy to be 65% (average of the two rounds) and the group accuracy to be 60% (if our design holds). We can compute the group vote in the two rounds: without discussion.

          In condition 3: individual accuracy around 40%, and group vote wrong in both rounds? We hope.

          If we get an outlier, we can say: "In this round, the group happened to be correct even though the individual accuracy was low. But note that the probability of that is low. Let me show you the theoretical calculation."

    2. **Students not understanding the task:** Explain clearly at the beginning. Do a practice round? Or we can do a practice round with a known condition (p=0.5) and no stakes.

    3. **During discussion, one student dominates and the group follows blindly:** This is a feature, not a bug. It shows how deliberation can break independence and also how it can be hijacked.

    4. **Time management:** Keep strict time limits. Use a timer.

    5. **Generating the signals:** The facilitator must generate the signals quickly. We can pre-generate for all rounds using a spreadsheet. For each round, we pre-generate the true state and then the signals for each student.

    6. **In condition 2, students might not know how to interpret two signals?** We only gave them one card: either "Public: X" or "Private: X". So they see only one clue. So they vote based on that. So the public ones see the public clue and the private ones see their private clue. This is simpler.

    7. **Revealing the state immediately might affect subsequent rounds?** We tell them that each round is independent. We hope they believe it.

    8. **The payoff scheme might not be engaging without real stakes:** We can announce that the top 3 scorers will get a prize (e.g., extra credit or candy). Or we can frame it as a learning experience.

  **Features the activity cannot reproduce:**

     - The theorem is about the limit as the group size goes to infinity. We have only 20 students, so we can't show the limit, but we can show the tendency.

     - Genuine independence: in condition 1, we have independence by design, but in the real world, independence is hard to achieve.

     - We assume that the competence is known and fixed. In reality, we don't know if p>0.5.

     - The activity does not show that the majority is better than the best-informed member. We would need to have one student with very high accuracy and others with lower? We did not design that. We can mention in the debrief: the theorem says the majority can be better than any single member, but we did not have varying competences.

     We can adjust: in condition 1, we can have one student who gets a signal with 90% accuracy and the others with 70%. Then the best-informed member has 90% accuracy, but the group majority might have higher? With 20 students (19 with 70% and one with 90%), the group majority accuracy is very high (about 0.99) which is higher than 0.9. But we didn't design that. We can note in the debrief that the theorem also implies that the group can be better than its best member under certain conditions.

     Given time, we might not change the design. We can mention it in the debrief.

  **Final Procedure:**

     We'll go with 6 rounds:

          Round 1: Condition 1 (p=0.7, independent) -> no discussion
          Round 2: Condition 2 (p=0.65, dependent) -> no discussion
          Round 3: Condition 3 (p=0.4, independent) -> no discussion
          Round 4: Condition 1 -> no discussion
          Round 5: Condition 2 -> with discussion and group consensus vote
          Round 6: Condition 3 -> no discussion

     For condition 2, we design as above: generate a public signal (60% accurate) and then for each student, with 50% chance they get the public signal, otherwise they get an independent private signal (70% accurate).

     For each round, the facilitator needs:

          - Step 1: Choose true state (A or B) at random (50%).
          - Step 2: For condition 1: for each student, generate a signal: with 70% chance the signal equals the true state, otherwise the opposite.
          - For condition 2: 
               a. Generate public signal: with 60% chance equals true state, otherwise opposite.
               b. For each student, flip a coin: 
                    - Heads (50%): the student gets the public signal.
                    - Tails: generate a private signal (70% chance true state).
          - For condition 3: for each student, generate a signal: 40% chance equals true state.

     We can use a spreadsheet to generate. For example, in Google Sheets:

          True state: =IF(RAND()<0.5, "A", "B")
          For condition 1, for a student: =IF(RAND()<0.7, true_state, IF(true_state="A", "B", "A"))
          For condition 2:
              Public signal: =IF(RAND()<0.6, true_state, IF(true_state="A", "B", "A"))
              For each student: 
                  Type: =IF(RAND()<0.5, "public", "private")
                  Signal: if type="public", then public_signal, else (IF(RAND()<0.7, true_state, IF(true_state="A", "B", "A")))

          For condition 3: =IF(RAND()<0.4, true_state, IF(true_state="A", "B", "A"))

     We can pre-generate for all rounds and students.

     Payoff: for individual votes, 1 point for correct. For group consensus vote in round 5, 2 points for each student if the group is correct.

     Debrief outline:

          1. Collect the data from the rounds: show a table.
          2. Explain the three conditions and their accuracies.
          3. Map to Condorcet's Jury Theorem: 
              - Condition 1: p>0.5 and independence -> group accuracy very high.
              - Condition 2: p>0.5 but dependence (due to common signal) -> group accuracy dropped.
              - Condition 3: p<0.5 -> group accuracy below 50%.
          4. Highlight the independence assumption and how it was violated in condition 2.
          5. Discuss the effect of deliberation in round 5: did the group converge to the public signal? 
          6. Note that in real deliberation, people share information and then update, which creates dependence.

     Coda: if time, do the three-state example to show intransitivity.

  This should fit within 75 minutes.
