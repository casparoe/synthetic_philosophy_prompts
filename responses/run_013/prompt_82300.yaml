  ### Condorcet Jury Theorem Experiential Activity  
  **Goal:** Students experience the core dynamics of Condorcet’s Jury Theorem (CJT) — group accuracy under independence, the fragility of independence during deliberation, and the "knife-edge" effect of competence below 0.5 — without being told the theorem upfront.  

  ---

  ### **Setup & Materials**  
  - **Participants:** 20 students.  
  - **Binary State:** Two hidden jars, "Jar A" (e.g., 70% red marbles) and "Jar B" (e.g., 30% red marbles), but **do not reveal distributions**. Only the facilitator knows the true jar for each round.  
  - **Signals:** Digital "clue cards" (e.g., Google Forms, Mentimeter) or physical index cards.  
  - **Random Generator:** Use a free tool like [Random.org](https://www.random.org/) or Google Sheets:  
    - `=IF(RAND() < p, "A", "B")` generates a clue matching the true state with probability `p`.  
  - **Payoffs:** Use "wisdom points" (non-monetary). Correct individual votes = +1 point; correct group consensus = +3 points. Top 3 scorers get symbolic rewards (e.g., stickers, bragging rights).  

  ---

  ### **Round Design**  
  **Three Conditions** (repeat each 3 times for statistical robustness):  
  1. **Deck 1 (Independent, p=0.7):**  
     - Individual clues match true state 70% of the time, generated independently.  
     - *Expected outcome:* Majority vote accurate ~99% (19/20 times).  
  2. **Deck 2 (Dependent, p=0.65):**  
     - **Step 1:** Generate a *public clue* matching true state 60% of the time (e.g., "A source claims it’s Jar A").  
     - **Step 2:** For each student, generate a *private clue* matching 70% of the time.  
     - **Clue delivery:** All students see the public clue first, then their private clue.  
     - *Expected outcome:* Individual accuracy ~65%, but group accuracy drops to ~60% due to dependence.  
  3. **Deck 3 (Independent, p=0.4):**  
     - Individual clues match true state 40% of the time, independently.  
     - *Expected outcome:* Majority wrong >70% of the time, worse than a coin flip.  

  **Calibration Note:**  
  - With 20 students:  
    - Deck 1 majority accuracy: 99.3% (theoretical).  
    - Deck 2 group accuracy: ~60% (public clue dominates).  
    - Deck 3 majority accuracy: 24.7% (theoretical).  
  - **Adjustments:** If outcomes deviate (e.g., Deck 2 group accuracy >65%), reduce public clue accuracy to 55% or increase group size.  

  ---

  ### **Procedure & Timing** (75 min total)  
  **Introduction (5 min):**  
  - *"We’re exploring how groups make decisions under uncertainty. Each round, a true jar (A or B) is secretly chosen. You’ll get a clue about it, vote individually, and sometimes discuss to reach consensus. Clue reliability varies per round and will be revealed later. Goal: Maximize wisdom points."*  

  **Rounds 1–9 (45 min; 5 min/round):**  
  1. **True State Selection (0 min):** Facilitator secretly chooses Jar A or B (50/50 RNG).  
  2. **Signal Distribution (1 min):** Generate clues for all students using the deck for that round (see below).  
  3. **Individual Vote (1 min):** Students submit secret votes (A or B) based on clues.  
  4. **Group Consensus Vote (2 min, *only in Rounds 2, 5, 8*):**  
     - Students discuss openly for 90 seconds.  
     - **Payoff incentive:** +3 points for correct group vote (creates pull toward consensus).  
     - Group submits one answer via spokesperson.  
  5. **Reveal & Record (1 min):** Facilitator reveals true jar and records:  
     - Individual votes (accuracy).  
     - Majority vote (based on individual votes).  
     - Group consensus vote (if applicable).  

  *Round Sequence:*  
  - **Rounds 1, 4, 7:** Deck 1 (Independent, p=0.7).  
  - **Rounds 2, 5, 8:** Deck 2 (Dependent, p=0.65) **with group consensus**.  
  - **Rounds 3, 6, 9:** Deck 3 (Independent, p=0.4).  

  **Debrief (20 min):**  
  1. **Reveal Conditions:**  
     - *"In rounds 1/4/7, clues were 70% accurate and independent. In 2/5/8, you saw a public clue (60% accurate) before a private one (70% accurate). In 3/6/9, clues were 40% accurate and independent."*  
  2. **Map to CJT:**  
     - **Competence >0.5 & Independence (Deck 1):**  
       *"When individuals are even slightly reliable (>50%) and independent, the majority beats even the best-informed person. With p=0.7, 20 people, majority accuracy is >99%."*  
     - **Independence Violation (Deck 2):**  
       *"Deliberation broke independence by anchoring you to the public clue. Even though individual accuracy rose to 65%, group accuracy fell to ~60%. Why? CJT assumes no shared information."*  
     - **Competence <0.5 (Deck 3):**  
       *"When individual accuracy drops below 50%, the majority does worse than a coin flip. With p=0.4, majority accuracy is ~25%, worse than any individual above 50%."*  
  3. **Key CJT Assumptions:**  
     - Independence is fragile (easily broken by shared clues/deliberation).  
     - Competence must exceed 0.5 (small deviations flip outcomes).  
     - CJT doesn’t guarantee real groups are above 0.5 or independent.  

  **Coda: Intransitivity (5 min, if time):**  
  - *"Now, 3 jars: A, B, C. True jar is A. Clues are noisy (e.g., 45% A, 30% B, 25% C)."*  
  - Vote pairwise: A vs. B → A wins. B vs. C → B wins. C vs. A → C wins.  
  - *"Result: Majority preferences cycle (A>B, B>C, C>A). Deliberation can’t resolve this."*  

  ---

  ### **What Can Go Wrong & Fixes**  
  1. **Statistical Fluke (only 3 rounds/condition):**  
     - **Problem:** Group-level effects (e.g., majority accuracy) may not manifest clearly in 3 trials.  
     - **Fix:** Use individual-level data. Calculate:  
       - *Deck 1:* % of students correct (should be ~70%).  
       - *Deck 2:* % correct after public clue (should be ~65%); show how public clue skewed votes.  
       - *Deck 3:* % correct (should be ~40%).  
     - *"Even if the majority vote ‘got lucky,’ note how individual accuracy aligned with the deck design."*  

  2. **Deliberation Dominance:**  
     - **Problem:** One student sways the group, masking the effect of clues.  
     - **Fix:** Remind students: *"Base your vote on clues, not charisma."* Record if group consensus ignored clues.  

  3. **Signal Misinterpretation:**  
     - **Problem:** Students distrust clues or overthink.  
     - **Fix:** Emphasize: *"Your clue is your best evidence; vote based on it."*  

  4. **Time Limits Exceeded:**  
     - **Problem:** Discussion runs long.  
     - **Fix:** Use a timer. Cut off after 90 seconds.  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Infinite Groups:** CJT’s "wisdom of crowds" strengthens as group size → ∞. We only use 20 people.  
  2. **Genuine Independence:** Real deliberation creates social dependence (e.g., conformity), not just informational.  
  3. **Knife-Edge Certainty:** We *assume* competence is above/below 0.5; real groups rarely know their true p.  
  4. **Best vs. Random Member:** CJT says majority beats a random member, not necessarily the best. To show this, you’d need unequal competences (e.g., one expert).  

  **Facilitator Note:** Post-activity, use these gaps to argue:  
  > *"CJT is a fragile ideal. Deliberation often violates independence, and we can’t be sure if p>0.5. That’s why real democracies need safeguards (e.g., secret ballots, expert panels)."*  

  By making students *feel* CJT’s dynamics firsthand, they’ll grasp why its assumptions — not its conclusion — are the linchpin of democratic theory.
