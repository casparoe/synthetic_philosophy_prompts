prompt: |-
  I'm prepping for a reading group on the Holocaust-perpetrator debate and I want to stress-test a summary a friend gave me before I repeat it and embarrass myself. Please act as a historian who knows the Browning/Goldhagen dispute inside and out — someone who's actually read both books and the reviews, not just the Wikipedia version. Before you answer, take a beat and brainstorm the main claims each guy actually made and where they actually agreed, then go through my friend's summary clause by clause. Dont just hedge everything as "it's complicated" — I want a verdict on what's fair and what isn't.

  Here's what my friend said, roughly:

  "So the whole Browning vs. Goldhagen thing is basically settled. Browning looked at Reserve Police Battalion 101 and found the guys doing the shooting were just ordinary middle-aged German men — not sadists, not hardcore Nazis — who killed because of the pressure of the group and the situation they were put in. His whole point was that anybody dropped into that situation would've done the same thing, which is why the lesson is that character and personal morality pretty much dont matter, it's all situation. Goldhagen came along and said no, the Germans killed because they were antisemites, specifically because German culture had a unique 'eliminationist' antisemitism that made them want to kill Jews. So Goldhagen's basically the culture guy and Browning's the situation guy, and since Browning actually went through the battalion's own records while Goldhagen mostly just asserted his thesis, Browning won the debate. The upshot is the banality-of-evil thing — that these were just boring bureaucrats following orders."

  My gut says this is mostly right but something's off. What I want from you:

  1. Separate what's accurate from what's a common simplification or half-truth from what's an outright misrepresentation that Browning or Goldhagen would flatly reject.
  2. In particular, check the bits about "anybody would've done it," the character-vs-situation framing, the claim that one of them "won" (and that only one of them used the documents), and the way he smuggles the banality-of-evil idea in at the end.
  3. Tell me what each scholar would say the other got wrong, and whether my friend's takeaway conclusions would still hold up once you fix the errors.

  American English please. No bibliography needed — I just want the audit.
