prompt: |-
  I chair the methods and standards committee of a general science journal. The editor has referred a manuscript to us under our policy on complexity claims. The authors compare two cosmological models, one a modified-gravity model and one a cold-dark-matter model. To argue that the modified-gravity model is simpler, and therefore deserves a higher prior, they gzip the source code implementing each model and report that the modified-gravity code compresses to 4,312 bytes while the cold-dark-matter code compresses to 4,847 bytes. They call the 535-byte difference an estimate of the difference in Kolmogorov complexity, and they frame the argument in terms of Solomonoff's universal prior: the model with the shorter description has the higher prior probability, and the gzip lengths are a practical proxy for the relevant description lengths. A referee has objected that gzip is not a universal computer, that the measured difference is an artifact of the compressor, the programming language, and the arbitrary choice of which parts of the model count as the model, and that the result would flip under a different compressor. The authors reply that the invariance theorem guarantees that any two universal machines differ by at most an additive constant, so their result is robust in principle. The referee replies that the constant is unknown and could easily exceed 535 bytes, and that in any case gzip is not universal. The committee is split: some members regard any compression-based complexity claim as pseudo-quantitative, while others note that the authors are using a heuristic common in practice and that rejecting it would require a line the journal can defend. The editor wants a decision memo she can act on, and she wants the committee to settle a policy question: may authors use off-the-shelf compression as a proxy for Kolmogorov complexity in this journal, and if so, under what conditions?

  Please draft the committee's short written opinion. It should recommend a concrete disposition of the manuscript -- accept, reject, or revise with specified conditions -- and give the reasoning in a form the authors and the referee can both respond to. It should engage the strongest version of the authors' invariance argument rather than dismissing it, and it should distinguish what is defensible in their approach from what is not. It should also state a general policy for future submissions that invoke Occam's razor, Solomonoff induction, or minimum description length, including what authors must report and what claims they may not make. If the disposition is revise or reject, say what specific analysis would be required for a resubmission. The memo should be addressed to the editor, not to me, and should be written for a scientifically literate but non-specialist readership. Do not include citations, reading lists, or references; the editor needs the committee's reasoning, not a literature review.
reasoning: |-
  We are addressing the editor of the journal. Our opinion must be concise, clear, and decisive. We need to:
   1. Make a recommendation on the manuscript (revise, with specific conditions).
   2. Engage the authors' invariance argument fairly but point out its limitations in this context.
   3. Establish a policy for future submissions that use compression as a proxy for Kolmogorov complexity.

   Key points:
   - The authors used gzip to compare the compressed size of the source code for two models and claimed that the smaller compressed size indicates higher prior probability (simpler model).
   - Referee's objections: gzip is not a universal computer, the result is sensitive to implementation details, and the additive constant in the invariance theorem could be large.
   - The authors counter with the invariance theorem (additive constant) and that their method is a practical heuristic.

   Committee's view:
   - The invariance theorem indeed states that the Kolmogorov complexity on two different universal machines differs by at most an additive constant (which depends on the machines but not the string). However, gzip is not a universal machine in the Turing-complete sense. It is a lossless compression algorithm designed for practical efficiency on typical data (like text), but it is not universal in the sense of being able to simulate any computation. Therefore, the theorem does not directly apply to gzip.
   - The additive constant in the invariance theorem is for the entire Kolmogorov complexity function, but note that the constant can be large and might dominate the difference (535 bytes) for the given strings. Moreover, the constant is not just a fixed overhead for the entire machine but may vary per string in a way that the theorem does not bound for a fixed compressor like gzip.
   - The method is sensitive to:
       a) The choice of programming language (e.g., a verbose language vs. a concise one).
       b) The specific implementation (e.g., style, variable names, comments, etc.).
       c) What is included in the "source code" (e.g., are only the core equations included, or also the solver?).
       d) The compression algorithm (gzip vs. bzip2 vs. LZMA, etc.).

   Therefore, the 535-byte difference is not a reliable estimate of the difference in Kolmogorov complexity of the models themselves, but rather of the specific implementations in the specific programming language and code structure.

   However, the committee acknowledges that the idea of using compression as a heuristic for model complexity has been used in some fields (e.g., in machine learning with the Minimum Description Length principle) and may have some practical value when done with care and when the limitations are acknowledged.

   Recommendation for the manuscript:
   - Reject the current compression-based argument as it stands because it does not sufficiently account for the limitations and potential biases.
   - But do not reject the manuscript entirely. Instead, require revision that either:
       Option 1: Remove the compression-based argument and replace it with a more traditional model comparison (e.g., based on parameters, degrees of freedom, or other established measures of complexity) and/or a clear theoretical justification of the prior.
       Option 2: If the authors wish to retain the compression argument, they must:
          a) Use multiple compression algorithms (e.g., gzip, bzip2, LZMA) and report the results for all, to show that the conclusion (which model is simpler) is consistent across compressors.
          b) Justify why the specific implementation and programming language are appropriate for measuring the complexity of the model (and not the implementation details). This might include using a minimal representation of the model (e.g., pseudocode that captures only the essential structure) and avoiding extraneous code.
          c) Acknowledge explicitly that the compression size is a heuristic and that the absolute difference in Kolmogorov complexity is not known, but that the relative ordering is consistent across a set of reasonable compressors.
          d) Discuss the potential impact of the additive constant (even though it is unknown) and why the observed difference (535 bytes) is likely to be significant relative to that constant. (Note: This is challenging because the constant for gzip relative to a universal machine is unknown and potentially large.)

   However, the committee notes that option 2 is still heuristic and may not be universally accepted. Therefore, the journal should set a policy that such methods are acceptable only under strict conditions and with appropriate caveats.

   General policy for the journal:

   We establish the following guidelines for any submission that uses compression as a proxy for Kolmogorov complexity, or that invokes Occam's razor, Solomonoff induction, or Minimum Description Length (MDL) in a similar manner:

   1. Authors must clearly state that the Kolmogorov complexity is uncomputable and that compression is only a heuristic proxy.
   2. The choice of representation (e.g., source code, pseudocode, etc.) must be justified as capturing the essential aspects of the model and not implementation details.
   3. The programming language (if code is used) must be specified and the code provided in full. The code must be minimized to only the parts that define the model (excluding boilerplate, etc.), and the minimization process must be described.
   4. Authors must use at least three different compression algorithms (from different families, e.g., LZ77, LZ78, BWT) and report the results for each. The conclusion should be robust across these algorithms.
   5. Authors must not claim that the absolute difference in compressed sizes is an estimate of the difference in Kolmogorov complexity. They may only claim a relative ordering (which model is more complex) and only when the ordering is consistent across compressors and representations.
   6. The manuscript must include a discussion of the limitations, including:
       - The sensitivity to the representation and the compressor.
       - The fact that the additive constant in the invariance theorem is unknown and could be large, so that the absolute difference in compressed sizes is not meaningful.
       - That the method may not capture the true conceptual complexity of the model (which might be better captured by, for example, the number of independent parameters or the functional form).

   7. For MDL-based arguments, authors should follow established MDL practices (e.g., using normalized compression distance or other more refined techniques) and cite appropriate literature (though we are not requiring citations in the memo, the authors must do so in the paper).

   For the current manuscript:

   We recommend that the manuscript be revised. The authors must either:
     (a) Remove the compression-based argument and replace it with an alternative, more conventional model complexity argument, or
     (b) Adhere to the above policy guidelines (points 1-6) by providing additional analyses and discussions.

   The revised manuscript must be re-reviewed, particularly by the original referee if available.

   Draft opinion:

  ---

  **MEMORANDUM**

  **TO:** Editor, [Journal Name]

  **FROM:** Methods and Standards Committee

  **SUBJECT:** Decision on Manuscript [ID] and Policy on Complexity Claims

  **Date:** [Date]

  This memo responds to your referral of manuscript [ID] under our policy on complexity claims. The committee has considered the manuscript, the referee's report, and the authors' response. We recommend that the manuscript be **revised** to address the concerns raised, and we establish a policy for future submissions that invoke compression as a proxy for Kolmogorov complexity.

  ### Recommendation for Manuscript [ID]
  The authors compare two cosmological models using the compressed size of their source code as a proxy for Kolmogorov complexity, arguing that the model with the smaller compressed size (by 535 bytes) is simpler and deserves a higher prior probability. The referee raises valid concerns about the sensitivity of this result to the compressor, programming language, and implementation details, and notes that gzip is not a universal machine.

  The committee acknowledges the authors' reference to the invariance theorem of Kolmogorov complexity, which states that the complexity of a string on two universal machines differs by at most an additive constant. However, we note that gzip is not a universal machine in the Turing-complete sense required by the theorem. Moreover, the additive constant, while bounded for a fixed pair of universal machines, is unknown and can be large relative to the observed difference. Therefore, the 535-byte difference cannot be reliably interpreted as an estimate of the difference in Kolmogorov complexity.

  We find that the current compression-based argument is insufficiently supported because:
  1. The result relies on a single compressor (gzip), and the referee's concern that the result might flip under a different compressor has not been tested.
  2. The representation of the models (source code) may include arbitrary elements (e.g., coding style, variable names, comments) that do not reflect the intrinsic complexity of the models.
  3. The absolute difference in compressed sizes is presented as if it were a meaningful quantity, but without an estimate of the uncertainty or the potential impact of the additive constant.

  Therefore, we require the authors to revise the manuscript. They have two options:

  **Option 1:** Remove the compression-based argument entirely and replace it with a more conventional approach to model comparison (e.g., using the number of free parameters, Bayesian model comparison, or a theoretical justification of the prior).

  **Option 2:** Retain the compression argument but significantly strengthen it by:
     a. Using at least three different compression algorithms (from distinct families, such as gzip, bzip2, and LZMA) and reporting the compressed sizes for each. The conclusion (which model compresses better) must be consistent across these algorithms.
     b. Minimizing the source code to remove any non-essential elements (e.g., comments, whitespace, variable names) and providing a justification for why the chosen representation captures the model's essence.
     c. Explicitly acknowledging that the method is a heuristic and that the absolute difference in compressed sizes is not an estimate of the difference in Kolmogorov complexity. The discussion must address the potential impact of the additive constant and why the relative ordering is robust despite it.
     d. Including a clear statement of the programming language and version, and making the full source code available.

  The revised manuscript must also include a new section discussing the limitations of the approach, as outlined in the policy below.

  ### Policy for Future Submissions
  The journal establishes the following guidelines for any submission that uses compression as a proxy for Kolmogorov complexity, or that invokes Occam's razor, Solomonoff induction, or Minimum Description Length (MDL) in a similar manner:

  1. **Heuristic Nature:** Authors must clearly state that Kolmogorov complexity is uncomputable and that compression is only a heuristic.
  2. **Representation Justification:** The choice of representation (e.g., source code, pseudocode) must be justified as capturing the model's essence, excluding implementation artifacts. The representation must be minimized and described.
  3. **Multiple Compressors:** Authors must use at least three compression algorithms (from different families) and report all results. The conclusion must hold across these algorithms.
  4. **Relative Ordering Only:** Authors may claim a relative ordering of model complexities only when consistent across compressors. They must not report absolute differences as estimates of Kolmogorov complexity differences.
  5. **Limitations:** The manuscript must discuss:
     - Sensitivity to representation and compressor.
     - The unknown additive constant in the invariance theorem and its potential impact.
     - Why the method is appropriate for the specific model comparison.
  6. **Code Availability:** The full source code or representation used for compression must be made available.

  These guidelines ensure that compression-based arguments are presented with appropriate caveats and rigor. Submissions that do not meet these requirements will not be accepted.

  ### Next Steps for Manuscript [ID]
  The authors should revise the manuscript according to one of the two options above. The revised version will be sent for re-review, ideally by the original referee. We appreciate the authors' novel approach but emphasize the need for robustness and transparency in such methods.

  Respectfully submitted,

  The Methods and Standards Committee
answer: |-
  **MEMORANDUM**  
  **TO:** Editor, [Journal Name]  
  **FROM:** Methods and Standards Committee  
  **SUBJECT:** Recommendation for Manuscript [ID] and Policy on Complexity Claims  

  ### **Decision on Manuscript [ID]**  
  The committee recommends that the manuscript be **revised** to address fundamental methodological concerns. The authors’ use of gzip compression as a proxy for Kolmogorov complexity is not sufficiently justified in its current form. While the invariance theorem of Kolmogorov complexity (cited by the authors) does guarantee that universal machines differ by at most an additive constant, gzip is not a universal machine. It is a practical compressor optimized for human-readable data and lacks the theoretical universality required for rigorous application of the invariance theorem. Consequently, the 535-byte difference reported by the authors may reflect arbitrary factors (e.g., programming language syntax, code structure, or gzip’s encoding efficiency) rather than an intrinsic difference in model complexity.  

  The referee’s criticism is valid: the result could reverse under alternative compressors or implementations. For example, if the authors used a compressor based on Lempel-Ziv-Welch (LZW) or Burrows-Wheeler (BWT) algorithms, the outcome might differ, undermining claims of robustness. The committee acknowledges the authors’ intent to apply a heuristic grounded in Solomonoff induction but finds the execution incomplete.  

  #### **Required Revisions**  
  For resubmission, the authors must:  
  1. **Test robustness across compressors:** Report compression results for at least three distinct, widely used algorithms (e.g., gzip, bzip2, LZMA). If the modified-gravity model consistently compresses to a smaller size across *all* compressors, this may support a claim of relative simplicity. If not, the inconsistency must be discussed.  
  2. **Justify the model representation:** Specify which components of the source code were included (e.g., core equations, auxiliary functions) and why this fairly represents the "model." Exclude boilerplate code (e.g., I/O routines) unrelated to the model’s theoretical content.  
  3. **Abandon absolute differences:** Do not claim the byte difference estimates Kolmogorov complexity. Instead, frame results as a *relative heuristic*: "The modified-gravity model compresses more efficiently across multiple algorithms, suggesting it *may* be simpler under this specific methodology."  
  4. **Address the additive constant:** Discuss how the unknown constant in the invariance theorem could affect interpretations (e.g., if it exceeds 535 bytes, the complexity ranking might not hold).  

  If these revisions confirm relative simplicity consistently and transparently, the argument may be included as a secondary point. If not, the compression analysis should be removed, and alternative criteria for model priors (e.g., parameter count, functional form) should be used. The manuscript will be re-reviewed after revision, focusing on these points.  

  ### **Policy for Future Submissions**  
  The journal will permit compression-based complexity arguments under strict conditions:  
  1. **Universality disclaimer:** Authors must explicitly state that Kolmogorov complexity is uncomputable and that compression is a heuristic proxy. Claims like "byte difference = complexity difference" are prohibited.  
  2. **Multiple compressors required:** At least three compression algorithms must be tested. Results must be reported in full, and conclusions must hold across all (or a clear majority).  
  3. **Representation transparency:** Authors must:  
     - Declare the programming language and version.  
     - Specify which code segments represent the model (with rationale).  
     - Provide code snippets or pseudocode in supplementary materials.  
  4. **Relative claims only:** Authors may state that model A is "simpler than B under this compression heuristic" but may not assign numerical significance to differences (e.g., "535 bytes simpler").  
  5. **Invariance caveat:** The unknown additive constant must be acknowledged as a limitation.  

  Arguments invoking Occam’s razor, Solomonoff induction, or minimum description length must adhere to these standards. Submissions that do not will be rejected or returned for revision.  

  ### **Reasoning for Balanced Scrutiny**  
  The committee recognizes that compression heuristics can offer pragmatic insights when models lack traditional complexity measures (e.g., parameter counts). However, these methods must minimize arbitrariness. The authors’ approach is defensible in principle if it robustly demonstrates *consistent* relative simplicity across compressors and avoids overinterpretation. It is indefensible when treating gzip as a universal machine or presenting a single-compressor result as conclusive.  

  This policy ensures methodological rigor while allowing innovative approaches. We thank the authors and referee for raising this critical issue.  

  **Recommendation:** Revise manuscript per conditions above. Resubmission will undergo re-review.  

  Respectfully submitted,  
  Methods and Standards Committee  
  [Journal Name]
