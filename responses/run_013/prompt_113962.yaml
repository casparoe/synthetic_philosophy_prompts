prompt: |-
  Across a number of democracies a distinctive two-stage institution has taken hold. A body on the order of a hundred citizens, chosen by lot and stratified so that it matches the wider electorate on age, sex, region, and often education and ethnicity, meets over several weekends, hears testimony from experts and stakeholders, deliberates in small facilitated groups, and votes on a set of recommendations. Those recommendations are then handled in one of three ways: enacted by the legislature, put to the whole electorate in a referendum, or quietly shelved. The same political systems that create such bodies also routinely entrench decisions beyond the reach of any majority — constitutional courts, independent central banks, treaty commitments, sometimes balanced-budget rules — and when a court strikes down legislation that a majority supported, it will often describe itself as vindicating the people's own deeper or longer-term will rather than as overruling it.

  What conception of 'the will of the people' does this cluster of practices presuppose? Reconstruct the implicit theory as precisely as you can. Is the will treated as something already present in the electorate and merely discovered by the institution, or as something produced by the institutions that elicit it? Is 'the people' treated as a single agent with one will, or as a plurality of preferences requiring aggregation? And what is supposed to make a body of a hundred people an acceptable stand-in for millions?

  Then do three further things. First, separate what the practice strictly requires from what it merely fits comfortably with: which claims about popular will would have to be true for the practice to be coherent, and which are optional glosses that some other theory could equally well supply. Second, identify the rival conceptions the practice rules out — pure preference aggregation, the view that a majority's vote simply is the popular will, the deflationary view that 'the people' has no will at all — and say which parts of the practice would survive under each. Third, examine whether the practice's own justifications are consistent with one another. A mini-public is commonly defended both on the ground that it is a statistically faithful microcosm of the electorate and on the ground that deliberation improves the quality of the opinions it reaches; if deliberation genuinely transforms preferences, is the body still a sample of anything, and if it is not, on what does its authority rest? Why, moreover, should a referendum that re-asks the undeliberated public be treated as either confirming or overriding its judgment?

  Finally, say what would have to change in the practice if the presupposed conception of popular will were replaced by a straightforwardly aggregative one, and what would have to change if it were replaced by the view that there is no popular will for any institution to express.
reasoning: |-
  Hmm, the user presents a sophisticated analysis of democratic innovations and their underlying theories of popular will. This requires unpacking several layers: institutional design, political philosophy, and practical implications. 

  First, I need to reconstruct the implicit theory behind these "mini-publics" and counter-majoritarian institutions. The stratified random selection suggests a microcosm view, while deliberation points to transformative potential - that's already a tension worth exploring. The referendum safety valve is particularly telling; it implies the mini-public's output isn't automatically authoritative.

  The user wants three precise analytical moves: 1) Separate necessary presuppositions from optional ones. The core requirement seems to be that popular will exists but requires refinement - unlike pure aggregation or pure fabrication. 2) Contrast rival theories. A purely aggregative model would make stratified sampling redundant, while a "no popular will" view would collapse the whole endeavor. 3) Check internal consistency. The microcosm defense clashes with the deliberation defense - if preferences transform, it's no longer representative statistically.

  When considering alternative conceptions, replacing with aggregativism would turn mini-publics into super-polls with no deliberation. Replacing with will-skepticism might retain them as focus groups but strip normative weight. The constitutional court analogy is key here - their "deeper will" rhetoric mirrors the mini-public's claim to epistemic privilege.

  The user seems well-versed in democratic theory (mentioning Fishkin, Dahl etc. would be appropriate). Their challenge about referendum override cuts deep: if deliberation produces superior outcomes, why consult the raw populace at all? That exposes the practice's unresolved tension between epistocracy and majoritarianism.
answer: |-
  The described practices presuppose a **deliberative-transformative conception** of popular will, with the following core elements:

  **1. Implicit Theory of Popular Will:**
  - **Status:** The popular will is *latent* but requires *elicitation and refinement* through structured deliberation. It's neither pre-formed (requiring mere discovery) nor purely constructed (ex nihilo by institutions).
  - **Nature of "The People":** Treated as a *singular collective agent* capable of forming a reasoned will, not merely an aggregation of fixed preferences. The process aims to produce a "general will" (Rousseau) rather than tally pre-existing preferences.
  - **Legitimacy of Mini-Publics:** The stratified sample creates an *epistemic microcosm* – its representativeness grants *initial legitimacy*, while deliberation enables it to *refine* raw preferences into a more authoritative judgment than the undeliberating public could achieve.

  **2. Necessary vs. Optional Elements:**
  - **Strictly Required:**
    - Popular will exists but is inchoate/distorted in daily politics.
    - Deliberative conditions (expert input, facilitation, time) enable refinement.
    - The mini-public's output reflects the "true" will *better* than referenda or polls.
    - Counter-majoritarian institutions protect the people's *long-term interests* against transient majorities.
  - **Optional Glosses:**
    - *How much* deliberation transforms preferences.
    - Whether courts *actually* discern a "deeper will" versus imposing elite values.
    - Whether shelved recommendations reflect the people's *rejected* will or institutional failure.

  **3. Rival Conceptions & Survival:**
  - **Pure Preference Aggregation (e.g., Riker):**
    - *Ruled Out:* The transformative role of deliberation; singular "will" concept.
    - *Surviving:* Stratified sampling (as a polling tool); referendum mechanism.
    - *Practice Change:* Deliberation becomes redundant; recommendations become opinion snapshots.
  - **Majoritarian Sovereignty (e.g., Populism):**
    - *Ruled Out:* Counter-majoritarian institutions; mini-public authority overriding direct majority vote.
    - *Surviving:* Referenda as sole legitimate expression; sampling for advisory input.
    - *Practice Change:* Courts/central banks lose veto power; mini-publics become focus groups.
  - **No Popular Will (e.g., Schumpeterian Realism):**
    - *Ruled Out:* All claims that mini-publics/courts express a "people's will."
    - *Surviving:* Mini-publics as stakeholder consultation; courts as elite guardians.
    - *Practice Change:* Justifications shift to competence/neutrality; "popular will" rhetoric abandoned.

  **4. Internal Tensions:**
  - **Microcosm vs. Deliberation Paradox:** 
    - If deliberation *transforms* preferences, the body ceases to be a statistical sample. Its authority then rests on *epistemic superiority* (better reasoning under ideal conditions), not representativeness. This undermines the "microcosm" defense.
  - **Referendum Dilemma:**
    - Resorting to a referendum either:
      - *Conflicts* with mini-public legitimacy (if deliberation yields superior judgment, why re-consult the uninformed public?).
      - *Reduces* the mini-public to a drafting committee, making its deliberative authority contingent on majority ratification.

  **5. Alternative Conceptions in Practice:**
  - **Under Aggregative Conception:**
    - *Mini-Public Changes:* Stratified sampling remains, but deliberation is minimized. Output would be a *pre-deliberation vote* (raw preferences). Referenda become the only legitimate ratification.
    - *Constitutional Changes:* Courts/central banks lose "deeper will" justification; their powers require explicit supermajority rules or disappear.
  - **Under "No Popular Will" Conception:**
    - *Mini-Public Changes:* Framed as *expert panels* or *stakeholder forums*. Random selection may be replaced by expertise quotas. Recommendations lose normative weight.
    - *Constitutional Changes:* Courts/central banks justify independence via technical competence or liberal rights protection, not popular will. Referenda become elite-managed plebiscites.

  **Conclusion:** This cluster of practices assumes a *proceduralist-epistemic* view: the popular will emerges from **structured deliberation among descriptively representative citizens**, distinct from both raw preferences and elite judgment. Its coherence hinges on resolving the tension between representativeness and transformation. Without this, mini-publics become advisory polls, courts become technocratic oligarchies, and referenda revert to majoritarian sovereignty. The unresolved question is whether deliberation creates *authoritative* legitimacy or merely *informative* input—a tension embedded in the practice's hybrid design.
