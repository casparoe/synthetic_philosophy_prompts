answer: |-
  ### Decision Tree for the Special Composition Question  
  *When do some things compose a further thing?*  
  **Cases used**: Two stacked bricks (touching), heap of sand, live cat, dead cat (same cat 1 min post-mortem), lichen (fungus+alga symbiosis), chess set (pieces + board).  
  *Each node is a question students can answer without knowing outcomes. Leaves are named positions with their most awkward commitment.*  

  ---

  #### 1. **Is the SCQ a substantive metaphysical question?**  
     - **No (merely verbal or confused)** → **Deflationism** (e.g., Carnap).  
       *Awkward commitment: Must dismiss debates about ordinary objects (e.g., "Is there *really* a heap?") as linguistic.*  
     - **Yes** → Go to 2.  

  #### 2. **Can "these parts compose something" be vague?** (e.g., due to sorites cases like heap→sand-grain-removal)  
     - **Yes** → **Vague Composition** (e.g., supervaluationist approaches).  
       *Awkward commitment: Accepts vague existence (e.g., "The heap vaguely exists"), collapsing restricted answers toward universalism/nihilism via boundary-avoidance arguments.*  
     - **No** → Go to 3.  

  #### 3. **Does composition occur in ALL cases?** (Cases: bricks, sand, live cat, dead cat, lichen, chess set)  
     - **Yes** → **Universalism** (e.g., Lewis).  
       *Awkward commitment: Arbitrary fusions exist (e.g., "brick-Eiffel Tower fusion").*  
     - **No** → Go to 4.  

  #### 4. **Does composition occur in NO cases?**  
     - **Yes** → **Nihilism** (e.g., Dorr).  
       *Awkward commitment: No tables, cats, or heaps—just "atoms arranged heap-wise".*  
     - **No** → Go to 5.  

  #### 5. **Is the composition condition the SAME for ALL kinds of things?**  
     - **No** → **By-Cases** (e.g., commonsense pluralism).  
       *Awkward commitment: Must specify disjoint criteria per kind (e.g., "living things: biology; artifacts: function") and handle borderline cases (e.g., viruses, AIs).*  
     - **Yes** → Go to 6.  

  #### 6. **Does composition occur for the DEAD CAT?** (Key split: vitalism vs. physical bonding)  
     - **Yes** → **Contact** (e.g., when parts are stuck together).  
       *Awkward commitment: A cat is an object, but a scattered cat-shaped cloud of gas is not, even if functionally identical.*  
     - **No** → **Organicism** (e.g., van Inwagen).  
       *Awkward commitment: Corpses aren’t objects (e.g., "a dead cat is just particles"), but living lichens are.*  

  ---

  #### Notes on Cases & Positions:  
  - **Why these cases split the tree?**  
    - **Dead cat (D)**: Splits *Contact* (yes, parts still bonded) from *Organicism* (no, not alive).  
    - **Lichen (E)**: Confirms *Organicism* (yes, alive) and *Contact* (yes, bonded); irrelevant for *By-Cases* (if "living things" is a kind).  
    - **Chess set (F)**: Splits *By-Cases* (yes, functional artifact) from *Organicism/Contact* (no).  
    - **Heap of sand (B) & bricks (A)**: Universalism/nihilism split; restricted views agree "no" (not bonded/alive).  
    - **Live cat (C)**: All non-nihilist views say "yes".  

  - **Identical-on-cases?**  
    - *Contact* and *Organicism* agree on all cases **except dead cat (D)**.  
    - *By-Cases* and *Organicism* agree on all cases **except chess set (F)**.  
    - *Universalism* and *Nihilism* are split by **any ordinary object case (e.g., live cat)**.  

  - **Unoccupied leaves?**  
    - **None**: All leaves represent actual positions (though *Vague Composition* is debated and unstable).  
    - **Why no "functional unity" leaf?** Subsumed under *By-Cases* or *Contact* (e.g., chess set is covered in *By-Cases*).  

  - **Vagueness collapse**: Answering "yes" to vagueness (Q2) collapses *Contact*, *Organicism*, and *By-Cases*—they cannot maintain sharp boundaries without arbitrariness, pushing toward *Universalism* (accept vague fusions) or *Nihilism* (reject all).  

  ---

  **Tree Summary**: Deflationism → Vagueness → Universalism/Nihilism → By-Cases → Contact/Organicism.  
  **Use in tutorial**: Start with cases, then walk the tree. Discuss how vagueness forces "extreme" answers and why dead cats/chess sets split the middle.
