    - The issue is that the group of rotations alone does not act transitively on the chords. We need to consider the entire symmetry group that preserves the chord set. The Euclidean group that preserves the circle is the orthogonal group (rotations and reflections). But note: the three models are all invariant under rotations. However, they are not the same. The problem is that the set of chords is a non-homogeneous space? 

  Alternatively, we can use Jeffreys prior: but Jeffreys prior is for parameters in a parametric model. Here, we don't have a likelihood function because we are generating the chord directly. The event E is a function of the chord. So Jeffreys prior is not directly applicable.

  Maximum entropy: we might choose the prior that maximizes entropy subject to constraints. But without constraints, what is the base measure? We need a reference measure. The principle of maximum entropy also requires a base measure to define entropy. Without that, it is also parameterization dependent.

  The core issue in Bayesian ML: the model specification includes the sampling statement. The principle of indifference does not tell us which sampling statement to use. Therefore, the problem is underdetermined: we have multiple models that are symmetric (in the sense of having uniform distributions in their respective parameterizations) but they are not the same model.

  Step 4: Residue Report

  Parts that translate cleanly:
  - The three methods are three different generative models (sampling statements) for the chord. Each model has a uniform prior over its parameter space, but the parameter spaces are different. The event E has different probabilities under the three models because the models are different. This translates the core of the paradox.

  Parts that translate with distortion:
  - The principle of indifference as a rational constraint: In Bayesian ML, we don't have an external rationality constraint that forces a uniform prior. The prior is a modeling choice. Therefore, the principle of indifference is not a constraint but a modeling heuristic. The claim that the principle is incoherent because it leads to contradictions is translated as: the heuristic of using a uniform prior without specifying the parameterization is ambiguous. But the Bayesian framework does not require the principle of indifference. It requires the model to be fully specified.

  Parts with no counterpart:
  - The idea that there is a fact of the matter about the right prior from ignorance: In Bayesian ML, there is no such thing as a prior from ignorance. All priors are part of the model. We can have non-informative priors, but these are defined relative to the model (like Jeffreys prior) and are not unique. The principle of indifference as a rational requirement for ignorance has no direct counterpart. Instead, we have various techniques for constructing non-informative priors (like reference priors, Jeffreys prior, maximum entropy with constraints) but they are not without their problems and are not considered mandatory.

  - The Borel-Kolmogorov paradox: This is a cousin. It involves conditioning on a set of measure zero and the result depending on the parameterization. In Bayesian ML, we condition on events by specifying the conditioning in the model. The problem is that conditioning on a null event is defined via limits, and the limit can depend on how we approach the condition. This is similar to Bertrand in that it shows the specification of the conditioning matters. In Bayesian ML, we would avoid conditioning on null events by using well-defined conditional distributions (via disintegrations) or by building the conditioning into the model. The Borel-Kolmogorov paradox is handled by being explicit about the parameterization in which we are conditioning. So it is a similar issue of model specification.

  - Marginalization paradox: This is when a posterior distribution for a parameter changes when we integrate out a nuisance parameter in different ways. It is related to improper priors. In the context of Bertrand, we are not marginalizing over nuisance parameters. So it is not directly relevant.

  Step 5: Conclusion on the Residue
  The residue (the untranslated part) includes the normative aspect: is there a unique rational prior for representing ignorance? The Bayesian ML framework does not have a canonical answer. It says: specify the model (the generative process) and then the prior is determined. Therefore, the principle of indifference as a rational constraint dissolves into a modeling choice. 

