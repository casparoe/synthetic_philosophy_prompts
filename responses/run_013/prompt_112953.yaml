  So the instinct that Bertrand's paradox is a model-specification problem is correct. The principle of indifference is a bad heuristic if applied without specifying the parameterization. However, the philosophical problem of what constitutes a "natural" parameterization for ignorance remains. The Bayesian ML framework does not resolve that, but it does clarify that the problem is one of model selection.

  Final note: The Bayesian ML framework is not impoverished; it is just explicit about the need for a generative model. The philosophical debate might be missing the point that without a physical randomization procedure, the problem is underspecified. But the framework does show that the principle of indifference, as traditionally stated, is too vague.

