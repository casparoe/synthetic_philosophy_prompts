prompt: |-
  A colleague's argument seems to show that no evidence can ever support any theory, and I want to know which step to reject and what rejecting it costs. The case that provoked it is invented but, I think, typical: an epidemiologist proposes a mechanism for a complication that has been documented in case series for thirty years; everyone agrees the mechanism explains the complication well, and her critics reply that the explanation is worthless as confirmation precisely because we knew about the complication long before she proposed the mechanism. Generalized: (1) E confirms H only if P(H|E) > P(H); confirmation is the raising of probability. (2) A rational agent's credences just are her prior credences conditionalized on everything she has learned. (3) So whatever she has learned, she is certain of: P(E) = 1 for each item of her evidence. (4) So P(H|E) = P(H) for every H and every E she holds. (5) By (1), none of her evidence confirms anything. (6) At any moment of assessment, all of an agent's evidence is evidence she already holds. (7) So nothing is ever confirmed for anyone, and the machinery of confirmation is idle — for new evidence no less than old, since new evidence becomes old the instant it arrives. I'm told this is the problem of old evidence, but as stated it is stronger than the problem I've read about, and it refutes itself: if (5) holds, the considerations that lead me to accept (5) don't support it either. That is a debating point, not a diagnosis. So: which step goes, and what does giving it up cost? I would rather keep (1) — I do think confirmation has something to do with probability raising — than keep (7). I've heard the repair is to evaluate (1)'s inequality against some credence function that does not already include E, but I cannot see what makes that function the right one rather than a free parameter, nor whether it rescues new evidence on independent grounds or only by the same trick; and I've also heard that confirmation should be measured by likelihoods rather than by the change in probability, which strikes me as abandoning (1) rather than saving it. Give your verdict in the first sentence, then the reasoning: no preamble, no restating of the question.
reasoning: |-
  We are to reject step (3) as stated, because it misrepresents the role of evidence in conditionalization when we are considering the confirmation of a hypothesis by that evidence. Step (3) says that for a rational agent, at the current time, the probability of any evidence E that she has learned is 1. This is because she has conditionalized on it. However, when we ask whether E confirms H, we are asking about the evidential support that E provides for H. This support is assessed by comparing the probability of H given E to the prior probability of H, but the prior probability should be the probability before learning E. The problem is that once we have learned E, we conditionalize and set P(E)=1, so then P(H|E) = P(H) because conditioning on a sure event does not change the probability. Hence the paradox.

  The solution is to evaluate the confirmation relation by considering a time before E was learned. That is, we must use a credence function that does not yet include E. Then we can compute P_old(H|E) and compare it to P_old(H). This breaks step (3) in the context of confirmation because we are not using the current probability function (which has E as certain) but a previous one (where E was not certain). 

  However, note that step (6) says that at the moment of assessment, all evidence is already held. But the assessment of confirmation is not about the current credence function alone. It is about the evidential relation between E and H, which is a relation that holds in virtue of the way E would change the credence in H if we were to learn E (or when we did learn it). Therefore, we must look at the change in probability from a time before we had E to after we had E. This requires a temporal perspective.

  Thus, we reject the idea in step (3) that we must use the current probability (with P(E)=1) to compute P(H|E) for the purpose of confirmation. Instead, we use a prior probability that does not have E as evidence. This prior is the rational agent's credence function at a time before learning E. Then, we can see that P_prior(H|E) > P_prior(H) and hence E confirms H.

  What does it cost? We must have a way to refer to past credence functions or to hypothetical credence functions (if we haven't actually learned E yet). This may require a model of the agent's epistemic state at different times. Also, it raises the question of how to define the prior when the agent has already learned E. We must be able to "subtract" the evidence E to consider what the agent would have believed without it. This is non-trivial, especially for old evidence that has been known for a long time. However, it is a necessary cost to avoid the absurd conclusion.

  Moreover, note that in the case of old evidence, we might have to consider counterfactual credences: what our credence would have been if we hadn't learned E? But that is problematic because we cannot simply "unlearn" E. Alternatively, we can think of the confirmation in terms of the time when E was first learned. But then we are not assessing confirmation at the current moment but at a past moment. This is acceptable because the evidential relation is timeless: if E did raise the probability of H when it was learned, then it does confirm H, even if now we are certain of E.

  Alternatively, there is the approach of using hypothetical priors that do not include E, but that are otherwise as similar as possible to our current beliefs. This is the approach of Garber (who uses a counterfactual prior) and others. But it does require that we can define such a prior.

  Another approach is to use the current probability function but to conditionalize on the negation of E (or on less evidence) to compute the prior. However, this is also problematic because we cannot simply condition on not-E when we are certain of E (the probability of not-E is 0). 

  Hence, the cost is that we must either:

  (a) Relativize confirmation to a time: at the time when E was learned, it confirmed H if it raised the probability then. But then at the current time, we are not confirming H by E because we already have E. This is acceptable because we are not gaining new evidence. However, we still want to say that E is evidence for H even now. So we might say that E is evidence for H in virtue of the fact that it would have raised the probability if we hadn't known it. But that is counterfactual.

  (b) Use a counterfactual prior: we consider what our current credence in H would be if we did not know E. This requires a model of how we would update without E, which is difficult because we have built much of our knowledge on E.

  Despite the cost, this is the standard solution. We break step (3) by denying that the probability function used for confirmation must be the current one with P(E)=1. Instead, we use a prior without E.

  Regarding the alternative of using likelihoods: if we define confirmation by the likelihood ratio, P(E|H)/P(E|~H), then we do not need to condition on the entire background knowledge. But note that this ratio is also evaluated relative to a probability function. If we use the current function, then P(E|H) and P(E|~H) are both computed under the current background knowledge (which includes E) and then we run into the same problem: because E is certain, P(E|H) = 1 and P(E|~H)=1, so the ratio is 1. Therefore, the likelihood ratio approach also requires a prior probability without E.

  Thus, we must reject step (3) in the context of confirmation. We do not use the current probability function for both P(H) and P(H|E) because that leads to no change. We use a prior function without E.

  Verdict: Reject step (3) as it applies to the confirmation inequality (1). We must use a credence function that does not yet have E as evidence to evaluate P(H|E) and P(H). The cost is that we must have access to a prior or counterfactual credence state without E, which may be difficult to specify and may involve an element of reconstruction or idealization.
answer: |-
  Reject step (3) as applied to confirmation assessments, because it conflates the agent's current credence function (which has E as certain) with the hypothetical prior credence function needed to evaluate whether E confirms H.

  The cost is that confirmation becomes a diachronic or counterfactual notion: to assess if E confirms H, we must reference a credence function from a time before E was learned (or a counterfactual state where E is not known). This breaks the synchronicity of the argument. Specifically:
  - Step (1) is preserved: E confirms H iff it would raise the probability of H if E were learned.
  - Step (2) is retained for rational updating but does not constrain how we model "prior" credences for confirmation.
  - Steps (4)-(7) fail because they rely on misapplying the current (post-E) credence function to measure confirmation.

  The cost is twofold:
  1. **Epistemic access**: We may lack clear access to the agent's true historical priors before learning E (e.g., for long-held evidence like the epidemiological complication).
  2. **Counterfactual dependence**: For old evidence, we must use a hypothetical prior where E is uncertain. This requires modeling how the agent would have rationally assigned probabilities without E—a complex, context-sensitive task that introduces indeterminacy (e.g., how much background knowledge to retain?).

  This solution rescues both old and new evidence: when E is newly learned, its confirmation is assessed against actual priors; for old E, we use reconstructed priors. Likelihood-focused approaches (e.g., using P(E|H)) avoid this cost but abandon (1)'s probability-raising definition; here, we save (1) by rejecting step (3)'s scope. The "free parameter" concern arises because selecting the right hypothetical prior isn't algorithmic, but it is constrained by rationality principles (e.g., minimize unnecessary changes to background knowledge).
