answer: |-
  Based on your criteria (upstream impact, tractability for conceptual work, importance for AI governance, neglectedness, and potential for resolving downstream debates), here's a ranked research agenda for the foundation, with explicit trade-offs:

  **Ranked Research Questions:**

  1.  **What decision-theoretic foundations govern the unilateralist's curse, and how robust is the phenomenon to alternative decision rules (e.g., maximin, satisficing, risk-aversion, precautionary principles)?**
      *   **Why #1 (Upstream & Foundational):** This question cuts to the core validity and scope of the curse itself. Almost every other strand depends on its answer. If the curse *only* manifests under strict expected-value maximization and vanishes under more cautious rules (common in high-stakes AI governance), its significance is drastically reduced. Conversely, if it persists or worsens under precautionary rules, the threat is far greater. Resolving this clarifies:
          *   Whether the curse is distinct from older collective action problems (it likely is, due to its specific decision-theoretic trigger).
          *   The applicability to real-world AI actors (who rarely use pure EV maximization).
          *   The potential effectiveness of remedies (e.g., if precautionary actors still trigger the curse, different solutions are needed).
      *   **Tractability:** Well-suited for conceptual/analytic philosophy and decision theory. Requires modeling different decision rules in multi-agent scenarios with uncertain/threshold-dependent outcomes.
      *   **Neglectedness:** Under-explored. Most discussions *assume* EV maximization. Rigorous analysis under alternatives is rare.
      *   **Importance:** High. Determines if the curse is a fundamental governance challenge or a theoretical curiosity.
      *   **Movability:** Evidence of AI labs/influential actors explicitly adopting non-EV decision rules (e.g., public risk frameworks) would increase urgency. Formal proofs showing the curse's robustness (or fragility) under specific alternatives would resolve it.

  2.  **What are the necessary and sufficient conditions for effective remedies to the unilateralist's curse, particularly concerning feasibility and incentives under varying levels of actor homogeneity/heterogeneity?**
      *   **Why #2 (Downstream Impact & Practicality):** Understanding the curse is useless without solutions. This question moves beyond listing *possible* remedies (coordination, precommitment, friction, centralization) to rigorously analyze *which* can *actually* work, *when*, and *why*. It forces specificity on:
          *   **Feasibility:** What information, trust, or enforcement mechanisms are required? (e.g., Is verifiable conditional precommitment even possible for AI capabilities?)
          *   **Incentives:** Does the remedy itself create perverse incentives or new vulnerabilities? (e.g., Does a coordination mechanism become a target for manipulation?).
          *   **Actor Landscape:** How do remedies function with diverse actors (e.g., democracies vs. autocracies, corporations vs. NGOs, aligned vs. misaligned goals)?
      *   **Tractability:** Primarily conceptual (game theory, mechanism design, institutional analysis) but benefits from examining historical/institutional analogs. Focuses on logical structure and incentive compatibility.
      *   **Neglectedness:** Moderate. Remedies are often discussed, but rigorous comparative analysis of their necessary conditions, failure modes, and dependence on actor landscapes is lacking, especially in AI contexts.
      *   **Importance:** Very High. Directly informs actionable governance interventions.
      *   **Movability:** Concrete proposals for specific remedies (e.g., a specific precommitment protocol for model releases) would allow deeper analysis. Evidence of failed/successful coordination attempts in analogous domains (e.g., biosecurity, nuclear) would provide valuable data points. Theoretical breakthroughs showing inherent limitations of certain remedy classes would be decisive.

  3.  **Under what conditions does the unilateralist's curse exhibit significant asymmetry between harmful and beneficial actions (the "Curse" vs. a potential "Blessing"), and does this asymmetry hold for pivotal AI actions?**
      *   **Why #3 (Clarifies Scope & Risk Assessment):** While the "Curse" label focuses on harm, understanding asymmetry is crucial for:
          *   **Prioritization:** Is preventing harmful unilateral actions inherently harder/more urgent than enabling beneficial ones?
          *   **Policy Design:** Do solutions need to be asymmetric (e.g., friction on harmful actions, subsidies for beneficial ones)?
          *   **Diagnosing AI Risks:** Are harmful AI actions (e.g., reckless capability deployment) more "curse-prone" than beneficial ones (e.g., safety disclosures)? Is this due to inherent properties (thresholds, irreversibility) or context?
      *   **Tractability:** Conceptual analysis of payoff structures, threshold effects, irreversibility, and aggregation mechanisms. Requires comparing paradigmatic curse/blessing scenarios and mapping AI actions onto these.
      *   **Neglectedness:** High. The potential "Blessing" is often mentioned but seldom analyzed with the same rigor as the Curse. Systematic analysis of asymmetry drivers is rare.
      *   **Importance:** Moderate-High. Affects resource allocation for governance and the framing of interventions. Reduces confusion in debate.
      *   **Movability:** Identification of clear real-world examples of a "unilateralist's blessing" would boost importance. Formal models demonstrating robust asymmetry (or lack thereof) based on specific factors (e.g., nonlinear utility, irreversibility) would clarify the debate. Evidence showing AI harmful actions consistently meet curse criteria while beneficial ones don't would solidify its relevance.

  **Trade-offs & Why Not the Others:**

  *   **Distinctness vs. Older Problems:** Important for academic taxonomy, but less *upstream* than decision rules (#1) or remedies (#2). Knowing it's distinct doesn't automatically tell you how to fix it or if it applies to real actors. Resolution is unlikely to drastically alter the practical governance agenda. Lower priority for *this* team's limited resources.
  *   **AI Application ("Does it apply?"):** Crucially important, but *downstream* of #1 and #3. You can't rigorously answer this without first understanding the core mechanisms (#1) and the asymmetry (#3) in more abstract terms. Funding research *assuming* it applies (to focus on remedies #2) is more valuable initially. Concrete AI case studies should be used *to test* the insights from #1, #2, and #3.
  *   **Overrated/De-prioritized:** While important, the "Distinctness" question is the most overrated for your *practical* purpose. Settling it won't resolve how to act or how severe the problem is for AI. Similarly, purely empirical cataloging of historical examples of the curse, without tying it back to the foundational questions above, is less valuable than the conceptual work outlined.

  **Recommendation for the Foundation:**
  Focus the 2-year budget on building a small, tight-knit team strong in decision theory, game theory, and analytic philosophy. Allocate roughly:
  *   **Year 1:** Primarily on **Question #1 (Decision Rules)** to solidify the foundation. Start scoping **Question #3 (Asymmetry)**.
  *   **Year 2:** Shift emphasis to **Question #2 (Remedies)**, informed by Year 1 results. Deepen **Question #3 (Asymmetry)**, specifically applying it to AI actions. Use insights from all to produce concrete, reasoned guidance on AI governance interventions vulnerable to the curse.

  This agenda provides the most leverage: establishing whether the curse is a fundamental threat under realistic decision-making (#1), then focusing on what can actually be done about it (#2), while clarifying the scope of the problem (#3) – all directly relevant to mitigating risks from unilateral AI actions.
