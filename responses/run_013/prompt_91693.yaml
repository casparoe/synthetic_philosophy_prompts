prompt: |-
  I TA for a professor whose whole thing is moral responsibility, and I need to figure out what she'd say about the case coming up in her grad seminar next week. She's basically a Strawsonian about all this, though she'd deny it. Her verdicts so far, roughly:

  - A man who kills his wife's lover in a jealous rage and is instantly horrified by it: responsible, no question.
  - A driver who blacks out from a seizure and kills a kid on the sidewalk: not responsible, she says that wasn't him acting at all.
  - A guy who drives the getaway car because someone has his daughter: not responsible, she says the act wasn't expressing anything about the bank.
  - A woman in a drug trial who, on the trial drug, took her neighbor for a robot that was attacking her and killed him: not responsible, no ill will in it anywhere.
  - A man who has never once been able to care about anybody. He can recite every moral rule and sees the point of none of them, and he plans out a murder for money and does it: not responsible. She says he isn't in the conversation, you can only manage him, resenting him would be like resenting the weather.
  - An ordinary man whose whole character and every choice is the product of his genes and upbringing, no manipulation anywhere in the story: responsible. Determinism leaves her cold.
  - A man with advanced dementia who hits a nurse: not responsible.

  The new case: a guy who at 24 decided guilt and pity were a drag on his ambitions, and over about two years deliberately did a documented regime of drugs and practices that by his own design burned the fellow-feeling out of him. He's 34 now and he's a perfect match for the callous man above -- recites all the rules, feels nothing for anybody, kills his business partner for the money. He says he'd do it again and dosen't mind being punished, it's all the same to him.

  What's her verdict, and what rule is she actually running? My worry is there's two rules that fit every one of her earlier calls and come apart here. (a) If you're not in the conversation now, you're out of it, and it dosen't matter how you got there. (b) An act is yours if it traces back to your own doing, and his does, even though what it traces back to is the choice that destroyed his capacity to be in the conversation in the first place -- there's a difference between someone who never had the option of being someone you can talk to and someone who had it and cashed it in. Both rules handle the psychopath and the drug-trial woman fine.

  Give me your best guess with reasons, and tell me which further case would settle which rule she's got, since I have to say something in seminar. Bonus if you can think of a case where the two rules come apart the other way, i.e. where she'd have to acquit someone who is perfectly capable of answering for himself.
reasoning: |-
  Okay, I need to figure out how this professor would rule on the new case. Let me start by reviewing her past verdicts to understand her underlying principles. She's described as Strawsonian, meaning she probably focuses on the reactive attitudes like resentment and blame as part of our social practices.

  First, listing her past cases and verdicts:

  1. **Jealous rage killer**: Responsible. He acted out of emotion and was horrified afterward. This shows he's part of the moral community; he understands what he did was wrong.
  2. **Driver with a seizure**: Not responsible. It wasn't an action by him at all—more like an external event. So, no agency there.
  3. **Getaway driver under duress**: Not responsible. The act didn't express his own attitudes; he was coerced, so it doesn't reflect on him.
  4. **Drug trial woman**: Not responsible. She had no ill will; the drug caused a delusion, so her action wasn't reflective of her character.
  5. **Callous, unemotional psychopath**: Not responsible. He can't engage in moral conversation. Resenting him is pointless because he doesn't understand moral reasons.
  6. **Determinism case**: Responsible. Even if everything is determined, she doesn't care. As long as the person is part of the moral community, determinism doesn't excuse them.
  7. **Dementia patient**: Not responsible. He lacks the cognitive capacity to understand his actions due to illness.

  Now, the new case: A man at 24 deliberately used drugs and practices to eliminate his capacity for guilt and pity. At 34, he's like the psychopath—kills for money, feels nothing. He doesn't care about punishment. The key difference is he *chose* to become this way.

  The user suggests two possible rules that fit all previous cases but diverge here:

  - **Rule A**: Current capacity matters. If you're not in the moral conversation now, it doesn't matter how you got there. Since he's currently incapable, he's not responsible, just like the innate psychopath.
    
  - **Rule B**: Tracing back to your own actions. His current state traces back to his own choice to destroy his moral capacity. So, he's responsible because he intentionally made himself this way.

  Both rules explain the earlier cases. For example, the innate psychopath never had the capacity, so Rule A exempts him. Rule B wouldn't apply since he didn't choose to be that way. The drug trial woman didn't choose her delusional state, so both rules exempt her.

  But in this new case, Rule A would say not responsible (like the psychopath), while Rule B would say responsible because he brought it upon himself.

  What would the professor say? Since she's Strawsonian, the key is whether the reactive attitudes are appropriate. Strawson emphasizes current participation in interpersonal relationships. So, if someone can't respond to moral demands now, blaming them is pointless. That leans toward Rule A.

  But in the jealous rage case, the killer was responsible even though he acted impulsively. His remorse shows he's still in the conversation. The getaway driver wasn't responsible because coercion meant his action wasn't his own. The dementia case is about current incapacity.

  The determinism case shows she doesn't care about ultimate causes; it's about current moral engagement. The callous man isn't responsible because he can't engage.

  For the new case, if she focuses on current capacity, she'd say not responsible. But his past choice might make a difference. Strawson might allow for historical considerations if they affect our reactive attitudes. For example, we might resent someone who deliberately made themselves unresponsive.

  The user wants to know which rule she's using. To settle it, they need a case where the two rules come apart. For Rule A, if someone is currently capable but became that way through their own past actions (like reforming), they'd be responsible. Rule B might not necessarily conflict if they're currently capable.

  A better case to distinguish them: Someone who is currently capable but only because of past manipulation. For example, a person who was brainwashed to be moral but commits a crime. Rule A might hold them responsible because they're currently capable. Rule B might not if their capacity isn't self-determined.

  But the user asked for a case where she'd acquit someone capable. That's trickier.

  Another idea: A person who temporarily loses capacity but regains it. But that might not help.

  Perhaps a case where someone deliberately avoids developing moral capacity as a child, but as an adult, they're capable. But that's complicated.

  Back to the professor. Given her dismissal of determinism, she's not worried about ultimate control. Her focus is on current moral engagement. The callous man isn't responsible because he can't participate. The new guy chose to become that way, but now he's the same as the innate psychopath. So, she'd likely say not responsible, applying Rule A.

  But the user thinks Rule B might apply. However, her cases like the drug trial and seizure show she cares about the expression of the agent. The getaway driver wasn't expressing his own will. The new guy's act does express his current character, which he created. But if his current character makes him incapable of moral dialogue, she might still say not responsible.

  Her verdict on the dementia patient is similar: even if he was once capable, his current state exempts him. So, historical capacity doesn't matter; current state does.

  Therefore, for the new case, she'd say not responsible. The rule is Rule A: current capacity to engage in moral conversation determines responsibility.

  To settle which rule she's using, propose a case where someone becomes morally capable through their own past actions. For example, a reformed criminal who now deeply cares about morality. Both rules would hold them responsible if they commit a crime now.

  But to distinguish, need a case where Rule A holds responsible but Rule B might not, or vice versa.

  User asked for a case where she'd acquit someone capable. Under Rule B, if someone is capable now but their capacity wasn't self-determined, she might acquit? But in the determinism case, she holds responsible despite lack of ultimate control.

  Perhaps a case of manipulation: Someone is brainwashed to be a moral person, then commits a crime. Rule A: currently capable, so responsible. Rule B: if their capacity isn't traced to their own doing, perhaps not responsible. But in the determinism case, she doesn't care about that.

  The innate psychopath isn't responsible, but he didn't choose it. The new case, he did choose.

  Another scenario: A person who undergoes voluntary treatment to become psychopathic but regrets it later. But that's messy.

  To test Rule A vs Rule B:

  - Case where someone is currently incapable but became that way through their own actions: new case, Rule A acquits, Rule B convicts.

  - Case where someone is currently capable but their capacity is due to external manipulation (not their own doing). Rule A would convict (capable now), Rule B might acquit if capacity isn't self-determined.

  But would the professor acquit in that case? Her determinism verdict suggests no—she holds responsible regardless of how they became capable, as long as they are now.

  In the determinism case, she says responsible despite genes and upbringing determining everything. So, she doesn't require self-determination of capacity.

  Therefore, for the manipulated moral person: if they're capable now, she'd hold responsible, even if they were programmed to be moral. So, Rule A is her rule.

  Thus, for the new case, since he's currently incapable, not responsible.

  To confirm: the dementia patient was once capable but isn't now; she acquits. Similarly, the self-induced psychopath is now incapable, so acquit.

  The user's worry is that Rule B would hold him responsible because he did it to himself. But given her other verdicts, especially determinism and dementia, she seems to prioritize current state.

  So, my best guess: she'd say not responsible.

  Rule: An agent is morally responsible iff they are currently capable of participating in the moral community (i.e., capable of understanding and responding to moral reasons and reactive attitudes).

  Further case to settle the rule: Take someone who is brainwashed or manipulated into being a morally responsive person (e.g., through advanced technology or coercion). They commit a crime. Rule A: holds responsible because currently capable. Rule B: might not, since their capacity isn't self-determined. But since she dismissed determinism, she'd likely hold them responsible, supporting Rule A.

  A case where she'd acquit someone capable: Harder. If someone is capable but acting under hypnosis or something, but she might say that's not their action. The drug trial case is similar—capable normally but not during the episode.

  A case where someone is fully capable but commits a crime due to extreme necessity, like the getaway driver, but that's duress, not lack of capacity.

  Perhaps a soldier following orders, but that's more like duress.

  I think Rule A is consistent, and she'd acquit in cases of incapacity regardless of origin.
answer: |-
  Based on your professor's established pattern of verdicts and her Strawsonian leanings (even if she denies the label), I'll break this down step by step: my best guess for her verdict on the new case, the implicit rule she's likely using, how to test which rule she's running, and a bonus case where the two rules come apart in the opposite direction. Her approach seems deeply rooted in P.F. Strawson's "Freedom and Resentment," where moral responsibility hinges on whether an agent is an appropriate target of "reactive attitudes" (like resentment, gratitude, or moral blame) based on their current capacity for moral engagement—not on metaphysical free will or historical origins.

  ### 1. **Her Verdict on the New Case**
     - **She would say the 34-year-old man is NOT responsible** for killing his business partner.
     - **Reasoning**: 
       - Your professor consistently treats moral responsibility as contingent on the agent's *current* capacity to participate in the "moral conversation." This means the agent must be capable of understanding moral reasons, expressing attitudes (like ill will or good will) through their actions, and responding meaningfully to reactive attitudes (e.g., feeling guilt or offering excuses). If they lack this capacity now, it doesn't matter how they got there—they're simply not a fitting target for blame.
       - In the new case, the man is described as a "perfect match" for the innate psychopath (who she deemed not responsible). He "recites all the rules, feels nothing for anybody," and is indifferent to punishment. This shows he lacks the capacity for moral engagement *at the time of the act*. His current state renders him outside the moral community, just like the weather or the dementia patient. Resenting him would be pointless because he can't comprehend moral demands or engage in the normative dialogue that defines responsibility for your professor.
       - Crucially, she dismisses historical factors when they don't manifest in the agent's current moral capacity. For example:
         - In the **determinism case**, she holds the ordinary man responsible despite his entire character being shaped by genes/upbringing because he *is* currently capable of moral engagement.
         - In the **dementia case**, she acquits because the patient lacks current capacity, even though he was once morally responsive.
         - Here, the man's *past choice* to destroy his moral capacity is irrelevant to his current state. He's now "not in the conversation," so he can't be blamed. His act doesn't express ill will or any attitude that could invite moral response—it's just an empty, mechanical outcome of his self-induced condition.

  ### 2. **The Rule She's Actually Running**
     - **Her implicit rule is Rule A: If you're not capable of participating in the moral conversation at the time of the act, you're not responsible—regardless of how you got there.**
       - **Why Rule A fits all her verdicts**: 
         - **Jealous rage killer**: Responsible because he *is* in the conversation (his horror shows he understands and responds to moral reasons).
         - **Seizure driver**: Not responsible—no capacity for agency at all, so not in the conversation.
         - **Getaway driver**: Not responsible—coercion means his act doesn't express *his* attitudes; he can't engage authentically.
         - **Drug-trial woman**: Not responsible—no ill will or moral capacity due to delusion; she's temporarily out of the conversation.
         - **Innate psychopath**: Not responsible—lacks the capacity for moral engagement entirely ("not in the conversation").
         - **Determinism case**: Responsible—determinism doesn't erode current capacity for moral dialogue.
         - **Dementia patient**: Not responsible—lacks current capacity due to cognitive decline.
       - Rule A emphasizes *present* moral capacity as the sole criterion. It's Strawsonian because it focuses on whether reactive attitudes (like blame) can function within our social practices—if the agent can't reciprocate, blame is "idle."
     - **Why Rule B doesn't fit as well**: 
       - Rule B (responsibility requires tracing the act back to the agent's own doing) seems less consistent with her dismissals of history. For example:
         - She acquits the **dementia patient** even though his condition might trace back to his earlier choices (e.g., smoking, poor diet). She cares about his *current* state, not the path there.
         - She acquits the **innate psychopath** even though his condition might trace back to genetic/upbringing factors (as in the determinism case), but she doesn't treat this history as relevant—only current incapacity matters.
       - If she used Rule B, she might hold the 34-year-old responsible because he *chose* to become callous. But her pattern suggests she'd reject this: the act of self-destruction happened in the past, and he's now a different (incapable) agent. Blaming him now would be like blaming a rock for rolling downhill—it might have been placed there intentionally, but it can't answer for itself.

  ### 3. **How to Settle Which Rule She's Using: A Test Case**
     - **Propose this case in seminar to force a choice between Rule A and Rule B**:  
       *A woman, Alice, is raised in a cult that systematically suppresses her capacity for empathy and moral reasoning from birth. At 30, she escapes and undergoes voluntary "moral rehabilitation" therapy. After years of effort, she develops a robust capacity for moral engagement: she feels guilt, understands moral reasons, and can respond to blame. At 40, in a moment of weakness, she steals from a charity out of greed. She feels immediate remorse and offers to make amends.*  
       - **How this tests the rules**: 
         - **Rule A (current capacity)**: Alice is *currently* capable of moral conversation (she shows remorse and understanding), so your professor would hold her **responsible**. Her history (cult upbringing) doesn't negate her present capacity.
         - **Rule B (tracing to own doing)**: If your professor emphasizes self-determination, she might acquit Alice because her moral capacity wasn't originally "her own doing"—it was imposed by the cult and later rehabilitated externally. This would mean Alice isn't truly the author of her moral self, so she might not be responsible.
       - **Prediction for your professor**: Based on her determinism verdict (where she ignores historical causes), she'd almost certainly hold Alice **responsible** under Rule A. Alice's current capacity is what matters, not how she got it. This would confirm Rule A as her core principle. If she *acquitted* Alice, it would suggest Rule B is in play—but that would contradict her treatment of the determinism case.

  ### 4. **Bonus: A Case Where Rule A and Rule B Come Apart to Acquit a Capable Agent**
     - **The case**:  
       *A soldier, Ben, is captured and subjected to involuntary, advanced brainwashing that makes him hyper-moral—he feels profound empathy and guilt, and he internalizes all moral rules. After his release, he appears perfectly capable of moral conversation. One day, under extreme stress, he commits a minor theft. He feels deep guilt and offers sincere apologies, demonstrating full comprehension of his wrongdoing.*  
       - **How the rules come apart**: 
         - **Rule A (current capacity)**: Ben is *currently* capable of moral engagement (he feels guilt, understands blame), so he should be held **responsible**.
         - **Rule B (tracing to own doing)**: Ben's moral capacity isn't his "own doing"—it was forcibly implanted via brainwashing. His actions (like the theft) trace back to this external manipulation, not his authentic self. Thus, he might be acquitted as not truly responsible, even though he appears capable now.
       - **Why this is the "opposite" of the new case**: In the new case, Rule A acquits an incapable agent, while Rule B might convict due to historical choices. Here, Rule A would convict a capable agent, while Rule B would acquit due to historical manipulation. This highlights the tension: Rule A cares only about present function in moral practices, while Rule B cares about historical ownership of one's moral capacity.
       - **Your professor's likely take**: She'd probably hold Ben **responsible** under Rule A (current capacity trumps history). If she acquitted him, it would signal a shift toward Rule B—but given her determinism verdict, that's unlikely. Use this to show that her Strawsonian framework prioritizes social practices over metaphysical origins.

  ### Final Thoughts
  In the seminar, emphasize that your professor's rule is about the *functional role* an agent plays in moral relationships right now. For the 34-year-old, his past choice is tragic but irrelevant—he's now a "moral void," so blame is inappropriate. If pressed, argue that her view avoids "metaphysical baggage" (like tracing history) and stays grounded in what Strawson called our "participant attitude." 

  If you need more nuance, point out that her acquittal in the new case might still involve *regret* or *sadness* about his self-destruction, but not *blame*—just as we might lament a natural disaster without resenting it. This keeps her consistent with cases like the dementia patient. 

  Good luck in the seminar—this is a great puzzle case to stir debate! If she surprises you, I’d love to hear how it goes.
