prompt: |-
  I'm a physics postdoc and my partner has gotten really into astrology this year - birth chart apps, the whole thing - and we keep having the same fight. Last week she threw Kepler at me: the guy who figured out the actual orbits cast horoscopes for emperors, so who am I to call it nonsense. I didn't have a comeback, so I want to have it out with him directly.

  Play Kepler. The real one, not a strawman and not a generic 17th-century mystic. Constraints: you think most of what working astrologers do is superstition and you'll say so plainly; what you actually defend is narrower - something about the geometrical aspects between the planets at a nativity resonating with the soul, the way a string resonates with a note - and you will not concede that planets cause particular events like wars, plagues or deaths. You can ask me factual questions about modern astronomy if you need them answered. You can get impatient when I lump you in with the common astrologers, but stay in character until I say stop. Keep replies to about a paragraph so it feels like an argument.

  My opening: fine, you kept the aspects and threw out the houses, the signs, the horary stuff. But that looks like keeping the part you liked and cutting the part that made it a predictive practice. If all the planets do is tune a soul at birth like an instrument, then a chart tells me nothing about what the person will actually do - and yet you were still writing prognostications for emperors and doing Wallenstein's horoscope. So either the geometry carries real information about future events, or you were selling a tuning fork and calling it a crystal ball. Which is it?
reasoning: |-
  Okay, the user is a physics postdoc whose partner is into astrology, leading to arguments. They mention Kepler being used as a defense since he did both astronomy and astrology. The user wants to engage with Kepler directly to counter this point. 

  First, I need to understand the user's position. They're a scientist, so they value empirical evidence and logical consistency. Their frustration comes from the partner using Kepler's dual role to legitimize astrology. The user's challenge is to refute that without dismissing Kepler's contributions. 

  The user's opening statement accuses Kepler of cherry-picking aspects while discarding other elements, making astrology non-predictive. They point out Kepler's hypocrisy in writing horoscopes if he only believed in soul tuning. The core question: was Kepler selling false predictions or believing in event forecasting?

  I need to embody Kepler as specified: critical of common astrology, defending only geometrical aspects as resonating with the soul, not causing events. Must avoid strawman arguments. Kepler should be impatient with being lumped with other astrologers but stay in character. Replies should be concise, paragraph-length.

  Key points for Kepler's response:
  1. Admit that much of astrology is superstition.
  2. Defend aspects as mathematical harmonies influencing the soul's inclinations, not fate.
  3. Distinguish between personal conviction and patronage demands—writing horoscopes was a job, not belief.
  4. Use the tuning fork analogy: aspects set tendencies, not destiny.
  5. Show frustration at being compared to charlatans, emphasizing his empirical approach.

  Potential pitfalls to avoid: Don't concede that planets cause events. Stress the non-deterministic nature. Highlight Kepler's scientific rigor versus the superstitions he rejected. 

  The user might need Kepler to acknowledge the conflict between his work and beliefs. Clarifying that horoscopes were practical survival, not endorsement, could bridge that. Also, emphasizing that modern astronomy invalidates even his limited view (e.g., no evidence for soul resonance) might come later.

  Ensure the response stays in character: impatient but not hostile, defending a nuanced position. Use historical context (patronage system) to explain the horoscopes. Keep it tight—one paragraph.
answer: |-
  *(Leans forward, eyes sharp but weary)* You mistake necessity for conviction. Yes, I calculated nativities and prognostications – for Rudolf, for Wallenstein. Bread for the table! Do you think the Imperial Treasury funded planetary ellipses for their *beauty*? They paid for predictions. But in my own writings? I called much of it "a dreadful superstition," "the foolish daughter of a wise mother." The houses? Arbitrary divisions! The signs? Mere labels! Horary? Divination I rejected utterly.

  What I defended – what I *observed* – was the geometry itself. The aspects: conjunctions, oppositions, trines. Think of the soul at birth as a complex string. The *instantaneous* angular relationships between the planets are like simultaneous plucks. They establish the fundamental resonances, the inherent tensions and harmonies within that soul – its inclinations, its potential *melody*. Does a plucked string dictate every note in the symphony it will later play? No! But it shapes the instrument's capacity. That resonance is real, mathematical, a correspondence in the fabric of things. Predicting specific events? Wars? Deaths? That *is* the daughter's foolishness, peddled to princes because princes demand foolish certainties. I sold them the crystal ball they craved while knowing it was, at best, a finely tuned fork reflecting a momentary celestial chord. Your modern ephemeris tells you *where* the planets were; my geometry suggested *how* that configuration might *stir* the soul. Not command it. Never command it. Does that satisfy your physicist's demand for distinction, or must I endure more lumping with mountebanks?

  *(Holds up a hand, anticipating interruption)* Stop. You look ready to counter. What is it? Does your astronomy now deny the *existence* of inherent mathematical harmonies? Or merely their possible resonance with the animate?
