  - The burden of proof: The dissenting member says it should be on the researchers. However, our criterion provides a clear standard, and the organoids do not meet it. Therefore, the burden is met by showing the absence of the condition.

  Graduate students' refusal: This is an ethical concern about the researchers' well-being, but it does not directly bear on the organoids' sentience. The committee's role is oversight of the research, not labor issues.

  Recommendation:
