  Dissenting member: we cannot know; avoidance responses are the kind of computation that should trigger moral caution; burden of proof on researchers.

  Two graduate students have refused to run the aversive arm.

  Committee is split, and current policy is silent on organoids.

  Self-address condition: 
  "A computation matters morally only if it is part of a system that represents the state as its own, as valenced, and as something that matters to it."

  We must apply this condition to the organoids.

  Analysis:
  1. The organoids are human cortical organoids, derived from induced pluripotent stem cells. They are grown in a lab and placed in a microfluidic chamber for electrical stimulation.
  2. They show avoidance-like withdrawal responses. This is a computational response to aversive stimuli.
  3. However, they lack:
     - A body (so no embodiment in the usual sense)
     - Sensory afferents (so the stimulation is direct electrical input, not via sensory organs)
     - Integrated thalamocortical loops (which are critical for sensory processing and consciousness in humans)

  The self-address condition requires:
  - The system must represent the state (the aversive stimulation) as its own (i.e., self-referential).
  - It must represent the state as valenced (i.e., positive or negative, good or bad).
  - It must represent the state as something that matters to it (i.e., having significance for the system itself).

  In the absence of evidence that the organoid has a self-representation, valence attribution, and personal significance, the condition is not met.

  What would change to meet the condition?
  Evidence that the organoid:
  - Has a representation of "self" (e.g., through self-referential neural activity, perhaps via default mode-like networks, though these are not typically in organoids).
  - Assigns valence to states (e.g., not just avoidance but also approach, and the ability to learn from valence).
  - Treats the state as mattering to itself (e.g., by altering behavior in a way that suggests internal significance beyond mere reflex).

  Currently, the organoid's response is a computational avoidance. Without evidence of self-representation, valence, and personal significance, it is not sufficient.

  Attribution of sentience:
  - We cannot rely on behavioral responses alone (like avoidance) because they can occur without sentience (e.g., in simple organisms or machines).
  - Without the ability to report, we look for neural correlates of consciousness (NCC). However, the organoids lack the integrated circuitry (like thalamocortical loops) that is typically associated with NCC in humans.
  - Settled science: In humans, consciousness requires integrated brain activity and specific structures (like the thalamus). Organoids do not have these structures or the integration.
  - Contested: Whether simpler or different neural structures could give rise to sentience is unknown. Some theories (e.g., Integrated Information Theory) might assign some level of consciousness to any complex system, but this is highly controversial and not settled.

  Boundary of sentience: When evidence is underdetermined, we must be cautious. However, the burden of proof for sentience should be on those who claim it exists and that we should restrict research. But note: the dissenting member argues the burden is on the researchers to prove absence. 

  Our criterion (self-address) is a specific test. If the condition is not met, then we do not have moral concern for the computation. But we must acknowledge that the condition might be too strict? However, the memo must use this criterion.

  Given the above, the self-address condition is not met by the described organoids. They lack the necessary features to represent states as their own, as valenced, and as mattering to them. Therefore, the aversive arm does not raise moral concerns under this criterion.

