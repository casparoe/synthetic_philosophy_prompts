  What must be deferred: The broader policy for organoid research must be developed separately.

  Therefore, we can approve the protocol with the condition that the committee develops a policy on organoids within a set time frame (e.g., 6 months). Also, we note that if during the research the organoids show any unexpected activity that might suggest meeting the self-address condition, the lab must report to the committee and pause the aversive arm until reviewed.

  But the self-address condition is not met now, so we can approve.

  However, the dissenting member's concern about the avoidance response being the kind of computation that might be morally relevant is addressed by our criterion: it is not sufficient without self-address.

  Final decision: APPROVE WITH CONDITIONS.

