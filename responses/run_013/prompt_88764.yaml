  ### MEMORANDUM  
  **To:** Stem Cell Research Oversight Committee  
  **From:** [Your Name and Title, e.g., Committee Member]  
  **Date:** [Current Date]  
  **Subject:** Decision on Protocol Involving Aversive Stimulation of Human Cortical Organoids  

  #### **Background**  
  This memorandum addresses the neuroscience protocol proposing to grow human cortical organoids from induced pluripotent stem cells and expose them to patterned electrical stimulation in a microfluidic chamber. The protocol includes an aversive-stimulation arm designed to map "nociceptive-like plasticity," alongside uncontroversial non-aversive arms. The principal investigator (PI) asserts that the organoids lack sentience due to the absence of a body, sensory afferents, and integrated thalamocortical loops, precluding harm. A dissenting committee member contends that the avoidance-like responses warrant moral caution, as sentience cannot be definitively ruled out, and that the burden of proof lies with the researchers. Two graduate students have declined to conduct the aversive arm, citing ethical concerns. The committee is divided, and current policy does not address organoids.  

  #### **Analysis Using the Self-Address Condition**  
  The committee has adopted a specific criterion for moral relevance: **a computation matters morally only if it is part of a system that represents the state as its own, as valenced, and as something that matters to it.** Complexity, responsiveness, or human-like behavior alone are insufficient. We apply this criterion to the organoids as described:  

  - **State Representation as "Its Own"**: The organoids lack anatomical structures (e.g., thalamocortical loops) and functional integration associated with self-referential processing in humans. Avoidance-like responses are reactive computations but do not imply a representation of the state (e.g., pain) as belonging to a "self."  
  - **Valenced Representation**: While the aversive stimulation triggers withdrawal, this is a calibrated input-output response. There is no evidence the organoids assign affective valence (e.g., "suffering" or "dislike") to the state, as they lack mechanisms for emotional or hedonic processing.  
  - **Representation as "Mattering to It"**: The response is adaptive but not indicative of intrinsic significance to the organoid. Without goals, preferences, or self-preservation drives, the computation does not reflect a subjective stake in the outcome.  

  **Conclusion**: The self-address condition is **not met**. The organoids' responses resemble algorithmic avoidance, not sentient experience. For the condition to be met, the system would require:  
  1. **Self-referential architecture** (e.g., neural correlates of a "minimal self," such as recursive feedback loops or default-mode networks).  
  2. **Valenced processing** (e.g., asymmetric responses to positive vs. negative stimuli, indicating internal appraisal).  
  3. **Behavioral coherence** suggesting the state "matters" (e.g., learned trade-offs between stimulation and reward, or avoidance persisting beyond immediate triggers).  

  #### **Attribution of Sentience in the Absence of Evidence**  
  Attributing sentience to non-reporting entities relies on converging evidence from neural correlates, behavioral markers, and evolutionary context. In this case:  
  - **Settled Science**: Human consciousness requires thalamocortical integration and embodiment; organoids lack these. Avoidance responses occur in non-sentient systems (e.g., bacteria or algorithms).  
  - **Contested Science**: Whether isolated neural tissue could achieve sentience is debated, but no consensus supports it in organoids of this complexity. Theories like Integrated Information Theory remain speculative and unvalidated for organoids.  
  - **Boundary Setting**: When evidence is underdetermined, we prioritize tractable criteria (like the self-address condition) over untestable possibilities. The burden of proof for sentience rests on claimants, not researchers, as unfalsifiable caution risks paralyzing science.  

  #### **Engagement with Dissenting Views**  
  The dissenting position—that avoidance-like responses could indicate morally relevant computation—is acknowledged as a legitimate call for humility. However, it does not overcome the absence of self-address, which is necessary for moral status. Imposing a burden of proof on researchers to disprove sentience is impractical and unsupported by our criterion, as it conflates responsiveness with subjectivity.  

  #### **Recommendation and Time Frame**  
  The protocol is **APPROVED WITH CONDITIONS**:  
  1. **Immediate Approval of Aversive Arm**: Proceed with the full protocol, including aversive stimulation, as the self-address condition is unmet.  
  2. **Policy Development**: The committee must draft an organoid-specific policy within **6 months** (by [Date 6 months from now]). This policy will clarify sentience criteria, monitoring requirements, and ethical boundaries for future protocols.  
  3. **Reporting Requirement**: The lab must notify the committee within **48 hours** if organoids exhibit unexpected activity (e.g., self-sustaining avoidance, spontaneous synchronization, or valenced learning). Such findings would trigger an expedited review and potential pause.  

  #### **Scope of Decision**  
  - **Decided Now**: Approval of this protocol under the above conditions. Graduate students' refusal is a personnel matter for the lab; it does not alter oversight conclusions.  
  - **Deferred**: Broader organoid policy (to be developed), sentience thresholds for enhanced models (e.g., organoids with thalamic components), and long-term monitoring frameworks.  

  This decision balances scientific freedom with ethical vigilance, using a clear, evidence-based standard. The conditions ensure ongoing scrutiny while affirming that current evidence does not justify restricting the aversive arm.  

  \answer{APPROVE WITH CONDITIONS: The aversive arm is approved with requirements for policy development within 6 months and immediate reporting of unexpected activity.}
