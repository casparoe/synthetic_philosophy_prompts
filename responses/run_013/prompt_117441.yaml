prompt: |-
  I am writing a response to the work of a colleague — call her D. — who holds that the boundaries of a cognitive system need not coincide with the boundaries of a body. The awkward thing about writing on her is that she almost never states a criterion. She rules case by case, and the verdicts I have collected from her papers and her seminars are these.

  1. A woman in the early stages of Alzheimer's disease keeps a paper notebook of names, dates and errands. She reads it without deliberation and treats what it says as she treats her own recollections. D.'s verdict: part of the woman's cognitive system.
  2. A woman who has never been able to do arithmetic in her head has carried the same pocket calculator since she was at school. It is always in her bag, she reaches for it without thinking, and she treats its answers as she treats her own. Verdict: part of her cognitive system.
  3. A man married for forty years asks his wife to remember things for him and never checks what she tells him; the two are together almost all day, and he does not distinguish her recollections from his own. Verdict: she is part of his cognitive system.
  4. A nursing student must walk to the chart at the end of the ward to check a drug dose, and then compares what she reads there with the label on the vial. Verdict: not part of her cognitive system.
  5. A tourist keeps a phrasebook in her hotel room, rehearses its sentences before going out, tries them on the concierge, and adjusts on the basis of the reply. Verdict: not part of her cognitive system.
  6. A junior lawyer puts her questions to a senior colleague once a week and checks his answers against the statute book before relying on them. Verdict: the colleague is not part of her cognitive system.
  7. A hiker carries map and compass in her pack, unfolds them at every junction, and confirms her position against landmarks. Verdict: not part of her cognitive system.

  Next month D. will be asked about a new case, and I would like to know her answer in advance. A hospital has installed a machine-learning system that triages radiology images: it decides which images reach the radiologist's screen and in what order, and it drafts a preliminary reading of each. The screen stands beside her all day; she glances at its output as routinely as at the patient's notes, and she could not keep up with the department's workload without it. She does not, however, treat its drafts as her own. She reads them as fallible suggestions, examines the images herself, and reverses the system in about one case in five; she calls it "a colleague I have to babysit."

  Do not give me her general position; I know it, and I would rather have criteria than a label for it. Tell me which criteria fit her seven verdicts equally well, and what each of them predicts about the radiologist; which criterion I should expect her to be running in fact, and what in the record tells for it; which of her earlier cases is the closest analog to the radiologist and where the analogy breaks down; and one case she has not yet ruled on whose outcome would most cleanly separate the criteria that survive, with the verdicts that fall out on either side.
reasoning: |-
  Hmm, this user is engaging with some deep philosophical and cognitive science concepts. They're clearly well-versed in debates about extended cognition and want to predict how their colleague "D." would rule on a new case involving a medical AI system. 

  The user has collected seven precedent cases from D.'s work, which show a pattern but no explicit criteria. They want me to reverse-engineer D.'s decision-making framework without relying on labels like "extended mind" or "active externalism." This requires careful analysis of the case patterns rather than theoretical positioning.

  Looking at the cases, the inclusion examples (1-3) all show: immediate unconscious access to the external resource, unquestioned trust in its outputs equivalent to internal cognition, and deeply integrated habitual use. The exclusions (4-7) all involve deliberate conscious access, verification of outputs, or intermittent use requiring explicit decision points. 

  The radiologist case is fascinating because it sits at the boundary: constant access and workflow dependence suggest integration, but the conscious verification and frequent overrides suggest distance. The "babysit" metaphor is particularly telling - we don't babysit our own cognition. 

  I should develop multiple candidate criteria that fit the seven verdicts, then show how each would apply to the new case. The trust/verification distinction seems strongest given how D. emphasizes treatment of outputs. The tourist with the phrasebook (case 5) makes a good comparison point - both involve preparatory use and conscious deployment, though the radiologist's integration is deeper. 

  For a diagnostic new case, something involving implanted technology could be revealing - say a neural implant that requires periodic calibration versus one that's fully trusted. That would test whether physical integration matters more than functional transparency to D. 

  The user's tone suggests academic rigor but also frustration with D.'s case-by-case approach. I should maintain precision while acknowledging the ambiguity in the radiologist scenario - this isn't a clear-cut ruling.
answer: |-
  Based on D.'s pattern of rulings, here's an analysis of her implicit criteria, their application to the radiologist case, and diagnostic tools for understanding her framework:

  **Candidate Criteria Consistent with All 7 Verdicts:**

  1.  **The Trust/Verification Criterion:** An external resource is part of the cognitive system *if its outputs are treated as immediate, non-deliberative inputs equivalent to internally generated cognitive states (e.g., memory, calculation), requiring no independent verification for routine use.*
  2.  **The Transparency/Integration Criterion:** An external resource is part of the cognitive system *if it functions with the same immediacy, reliability, and unconscious integration as an internal faculty, becoming experientially transparent during use.*
  3.  **The Functional Equivalence Criterion:** An external resource is part of the cognitive system *if it plays the *same functional role* in the cognitive process (e.g., recalling a fact, performing a calculation, storing a memory) as an internal biological process would, and is accessed/relied upon with equivalent automaticity.*

  **Predictions for the Radiologist (A.I. Triage System):**

  *   **Trust/Verification:** **NOT PART.** The radiologist explicitly *does not* treat the AI's drafts as her own. She reads them as "fallible suggestions," examines images herself, and reverses them frequently (1 in 5 cases). Verification is constant and deliberate.
  *   **Transparency/Integration:** **NOT PART.** The AI's output is not experientially transparent; it's an object of conscious scrutiny ("glances," "reads as suggestions," "examines herself," "babysit"). Its integration involves deliberation, not unconscious fluency.
  *   **Functional Equivalence:** **AMIBUOUS/LIKELY NOT PART.** While the AI performs a similar *function* (initial interpretation), the *manner of integration* differs significantly. Internal visual processing is immediate and trusted; the AI's output requires deliberate evaluation and verification. It functions more like an assistant than a perceptual faculty.

  **Likely Criterion in Operation & Evidence:**

  *   **Most Likely Criterion: The Trust/Verification Criterion.**
  *   **Evidence from the Record:**
      *   **Inclusions (1-3):** The Alzheimer's patient *treats* the notebook like memory. The calculator user *treats* its answers like her own calculations. The husband *treats* his wife's recollections as his own. **No verification occurs.**
      *   **Exclusions (4-7):** The nurse *compares* the chart to the vial (verification). The tourist *adjusts* based on the concierge's reply (verification/feedback). The lawyer *checks* the colleague's answers (verification). The hiker *confirms* her position (verification). **All involve explicit verification or adjustment based on the external source.**

  **Closest Analog & Analogy Breakdown:**

  *   **Closest Analog: Case 6 (Junior Lawyer & Senior Colleague).**
  *   **Similarities:**
      *   Both involve consulting an external "agent" (colleague, AI) for specialized information/judgment.
      *   Both are essential for managing workload effectively.
      *   Both are routinely accessed within the workflow.
      *   In both cases, the external source is referred to metaphorically as a "colleague."
  *   **Where the Analogy Breaks Down:**
      *   **Immediacy/Constancy:** The AI is "beside her all day," its output is glanced at "routinely." The lawyer consults her colleague only "once a week." The AI is far more constantly present and integrated into the *immediate* perceptual workflow.
      *   **Automaticity:** Glancing at the AI screen is described as routine, akin to looking at patient notes. While the lawyer's weekly meeting might be routine *scheduling*, the act of asking the question and receiving the answer likely involves more explicit deliberation per interaction than the radiologist's glance.
      *   **Level of Scrutiny/Revision:** The lawyer checks the colleague's answers *before* relying on them. The radiologist *simultaneously* uses the AI's output as a starting point *while* scrutinizing the primary data (the image itself), revising it frequently *during* her own interpretive process. The verification is more deeply embedded in the primary cognitive act.

  **Diagnostic New Case to Separate Criteria:**

  *   **The Case:** A concert violinist suffers focal hand dystonia, making complex fingerings unreliable. She uses a custom exoskeleton glove controlled by subtle muscle twitches she's trained to produce unconsciously. The glove executes the precise fingerings instantly and flawlessly based on her intention. She experiences playing *through* the glove; the movements feel like "her hands moving," and she never monitors or corrects the glove's output during performance – it is as transparent and trusted as her biological motor control used to be. She only adjusts it consciously during practice sessions.
  *   **Predicted Verdicts:**
      *   **Trust/Verification Criterion:** **PART.** She treats the glove's outputs *as* her own movements, requiring no verification during performance.
      *   **Transparency/Integration Criterion:** **PART.** The glove functions with immediacy, reliability, and unconscious integration; it's experientially transparent during performance.
      *   **Functional Equivalence Criterion:** **PART.** It plays the exact functional role of her biological motor control for fingering, accessed with equivalent automaticity and trust.
  *   **Why it Separates:** This case forces a distinction for D. If she rules it *not* part of the system (perhaps due to its physical externality or technological nature), it strongly suggests an implicit biological boundary is at work, overriding the functional criteria evident in her previous rulings (especially the calculator). If she rules it *part* of the system (as the functional criteria predict), it confirms that bodily boundaries are secondary to the functional integration and trust characteristics in her framework. This case tests the *limits* of functional equivalence beyond notebooks and calculators.
