prompt: |-
  I've just started sitting on a small grant panel (astro/particle-adjacent stuff), and I keep noticing that we all reach for the same move without ever defending it: a theory that called its shot — predicted something nobody had seen yet — gets treated as confirmed in a way that a theory which merely explains what we already knew doesn't. String theory gets dinged for never coughing up the novel prediction; Einstein gets the halo for Mercury's perihelion, even though that was a known anomaly he was trying to account for. And we routinely say a lot of proposals are just curve-fitting. So what epistemology is this practice presupposing, and what are we implicitly commited to? Does it presuppose that old evidence literally can't confirm a theory, or only that novel prediction is better evidence of something else — that the theory wasn't cooked up to fit, or that it's tracking truth? Is the panel being inconsistent when it celebrates the perihelion and sniffs at curve-fitting, or can one story cover both cases? Reconstruct the implicit theory, separate what the practice strictly presupposes from what it just fits comfortably with, and tell me whether any coherent probabilistic account licenses the practice as it stands, or whether we're all quietly committed to something we'd deny if anyone asked us straight. One paragraph, 250 words max.
reasoning: |-
  Okay, the user is on a grant panel for astrophysics or particle physics and notices a pattern: theories that predict novel phenomena are treated as more confirmed than those that explain existing data. They mention examples like string theory being criticized for lack of novel predictions versus Einstein getting credit for Mercury's perihelion, even though that was a known anomaly. The panel also dismisses proposals as curve-fitting. 

  The user wants to understand the underlying epistemology. What assumptions are they making? Is there inconsistency in celebrating Einstein's explanation of Mercury's perihelion while rejecting curve-fitting? They want a coherent theory that explains both practices.

  First, I need to recall philosophical concepts like Bayesian confirmation theory. The problem of old evidence is relevant here—can existing data support a new theory? The panel seems to imply that novel predictions provide stronger evidence. Why? Maybe because accommodating old data could involve tuning parameters (curve-fitting), whereas a novel prediction demonstrates the theory's independent validity.

  Looking at the examples: Mercury's perihelion was known, but Einstein's theory provided a natural explanation without ad-hoc adjustments. In contrast, curve-fitting often involves adding parameters to fit existing data. So the panel might be distinguishing between post-hoc accommodation and genuine explanatory power. 

  Bayesianism could support this: a novel prediction might have a lower prior probability, so when confirmed, it boosts the theory's credibility more. But old evidence can also confirm if it's surprising under previous theories. The panel's behavior suggests they value the risk involved in novel predictions—a theory sticking its neck out is more trustworthy if confirmed.

  Are they inconsistent? Not necessarily. Mercury's case was an anomaly unexplained by Newtonian physics, so GR provided a deeper explanation. Curve-fitting lacks such depth. The implicit commitment is to non-arbitrariness: theories should have independent justification, not just fit data. Probabilistic accounts like Lakatos's sophistication of falsificationism or Mayo's severe testing might underpin this, emphasizing how theories are tested beyond existing data.

  But does this hold up? String theory's lack of specific predictions makes it unfalsifiable, while Einstein's theory made multiple predictions (light bending, etc.). So the panel might value testability and risk. The key is whether the theory would have been different if the data differed—indicating it's not just fitting. 

  The user might be worried about hidden biases. The panel's practice presupposes that novel predictions better indicate truth by avoiding ad-hocness. A coherent probabilistic account exists, but it's nuanced, requiring that old evidence must be surprising to confirm, which Mercury was. Curve-fitting lacks this surprise factor. So the practice isn't inconsistent if we consider the context of existing anomalies versus arbitrary fitting.
answer: |-
  The practice presupposes a sophisticated Bayesian epistemology prioritizing *non-arbitrariness* and *riskiness*. Novel predictions are privileged because they demonstrate the theory isn't merely accommodating known data through adjustable parameters ("curve-fitting"), implying it *wouldn't* have fit arbitrary alternative data. This suggests the theory captures underlying structure. Einstein’s Mercury success isn't inconsistent: the perihelion anomaly was a known but *unsolved problem* under the reigning theory. General Relativity provided a compelling, non-ad-hoc explanation derived from fundamental principles, contrasting sharply with arbitrary curve-fitting. The panel isn’t committed to old evidence *never* confirming; rather, it demands that accommodation of old evidence (like Mercury) must be *surprising* or resolve deep anomalies, indicating the theory wasn’t engineered solely for that data. This aligns with probabilistic accounts where the *likelihood* of novel data under the theory is low under alternatives, significantly boosting confirmation. The practice coheres with Bayesian reasoning demanding high evidential support relative to plausible rivals, penalizing theories lacking risky, differentiating predictions or deep explanatory unification.
