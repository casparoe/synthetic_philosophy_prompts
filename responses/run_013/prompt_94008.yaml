prompt: |-
  I edit a series of country-culture guides -- the kind companies hand to staff who are about to move abroad for a year. Half my authors think the whole idea of national character is bunk and half think you can't write the book without it, and meanwhile every manuscript is stuffed with sentences like 'in Japan the group comes before the individual, so a junior colleague won't contradict the boss in a meeting,' 'Brazilians are warm and physical, expect hugs,' and 'Nordic people are reserved with strangers but obsessively egalitarian.' At the moment it's vibes: whoever's drafting decides, and whatever survives the copyedit goes to print.

  I want a procedure my editors can run on a sentence before it goes to print: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the call to a person. My own instinct is that the line to draw is between claims about what people do and claims about what they're like inside -- behaviour allowed, character not -- and I'd like it built around that, but I don't trust it and I'd rather you tell me where it breaks. It also has to cope with the sentence that's true as a statistic about a country and still a rotten sentence to print, and with the sentence that quietly turns into a claim about the individual sitting across from you. Keep in mind it has to be usable in a couple of minutes by someone with no social science training, and that anything contested goes to our editorial director, who will ask me why.

  Then run it on all three sentences above, including one where it tells me to cut something I like, and finish by saying what the procedure can't do -- I'd rather have a procedure with a known hole in it then one that pretends.
reasoning: |-
  Okay, the user is in a tricky spot. They edit country-culture guides and are dealing with conflicting author perspectives on national character stereotypes. Half their authors dismiss the concept entirely, while the other half rely heavily on it. The manuscripts are full of problematic statements like the examples given about Japan, Brazil, and Nordic countries. 

  The core issue seems to be balancing authenticity with ethical responsibility. These guides could genuinely help expatriates navigate cultural differences, but they risk perpetuating harmful stereotypes. The user wants a practical editorial procedure that can quickly flag problematic content without requiring social science expertise. 

  I notice their proposed solution focuses on distinguishing observable behavior from inherent traits. That's a good starting point, but it doesn't address more subtle issues like statistical validity, individual variation, or cultural fluidity. The examples they provided perfectly illustrate the problem: 

  The Japan statement implies a universal truth about hierarchical behavior. The Brazil example connects physical greetings to innate warmth. The Nordic claim bundles reservedness with egalitarianism as defining traits. All three would likely fail the user's proposed behavior-vs-character test.

  Beyond the obvious stereotype concerns, I should consider deeper pitfalls: 
  - How brief cultural descriptions might create expectations that affect workplace dynamics
  - Whether "statistically true" claims still oversimplify complex realities
  - How readers might apply group generalizations to individuals

  The procedure needs to be both rigorous and usable. Since editors aren't social scientists, it must rely on simple yes/no questions with clear escalation paths. The editorial director becomes the arbiter for borderline cases - which means the process must document why something was flagged.

  For the examples: 
  The Japan statement would get cut for implying causation from national character. The Brazil example might survive with modification to focus on greeting customs. The Nordic claim would need significant rewrites to separate observable behaviors from value judgments.

  Important limitations to highlight: 
  - Can't assess statistical validity of claims
  - Doesn't handle historical/power dynamics
  - May miss subtle essentialism
  - Requires editor vigilance for "soft" generalizations

  The key is creating a safety net, not perfection. As long as the procedure catches the most egregious issues and clearly flags what it can't handle, it serves its purpose. The examples will demonstrate how it works in practice while showing where compromises must be made.
answer: |-
  Here's a scalable editorial procedure focused on harm reduction, built around your instinct but addressing its limitations. It prioritizes **observable behavior over inferred character**, **context over essentialism**, and flags problematic generalizations.

  **The "RED FLAG / REWRITE / REFER" Procedure (For Editors)**

  Run each culturally generalizing sentence through these questions **in order**. Stop at the first "RED FLAG" or "REFER."

  1.  **Is it a claim about inherent/national CHARACTER?**
      *   *Look for:* Words like "are," "is," "have" + abstract trait (warm, reserved, hierarchical, individualistic, passionate, stoic, fatalistic, egalitarian *by nature*), "believe that" (implying universal belief), "value" (implying universal value), "think/feel" (implying universal internal state).
      *   **RED FLAG:** "Brazilians *are* warm," "Nordic people *are* reserved," "Japanese *value* harmony *above all*," "They *have* an indirect communication style." (Implies fixed internal state).
      *   **REWRITE:** Focus on **observed behavior/conventions** (See Q2). *If impossible without losing core meaning, it might need cutting.*
      *   **GOOD:** "Many social greetings in Brazil involve physical contact like hugs," "Business communication in Japan often prioritizes group consensus," "Initial interactions with strangers in Nordic countries may involve less small talk than in some other cultures."
      *   **Proceed if NO.**

  2.  **Is it describing a specific, observable BEHAVIOR or CONTEXTUAL CONVENTION?**
      *   *Look for:* Actions, practices, norms *in specific situations* (greetings, meetings, negotiations, social events). Use of qualifiers like "often," "commonly," "in business settings," "among colleagues," "during first meetings."
      *   **GOOD/REWRITE:** "In *many Japanese business meetings*, junior colleagues *often* defer to senior colleagues during initial discussions," "A common greeting *among friends and colleagues in Brazil* is a hug," "Small talk *with strangers in public spaces* is less common *in Denmark than in some Southern European countries*."
      *   **RED FLAG:** Vague, universal claims lacking context: "Japanese *won't* contradict the boss," "Brazilians *are* physical," "Nordic people *are* reserved." (Implies absolute rule, no context).
      *   **Proceed if YES (or after rewrite).**

  3.  **Does it ABSOLUTIZE (suggest no exceptions)?**
      *   *Look for:* Words like "always," "never," "will," "won't," "everyone," "no one," "must," "should," "cannot." Lack of qualifiers (see Q2).
      *   **RED FLAG:** "...so a junior colleague *won't* contradict the boss in a meeting," "Expect hugs" (implies every Brazilian, every time), "Nordic people *are* reserved" (implies all, always).
      *   **REWRITE:** Add qualifiers: "may be less likely to," "often won't," "commonly involves," "is a frequent expectation," "tend to be initially reserved."
      *   **Proceed if NO (or after rewrite).**

  4.  **Does it IMPLY UNIVERSAL BELIEF/VALUE as the SOLE CAUSE?**
      *   *Look for:* "Because they are X," "Due to their Y culture," "This stems from their belief in Z," "Since they value A." Explaining behavior *solely* through inferred national character/values.
      *   **RED FLAG:** "In Japan the group comes before the individual, *so*..." (Directly links behavior *only* to a character/value claim), "Brazilians are warm and physical, *so* expect hugs." (Same issue).
      *   **REWRITE:** Separate the (rewritten) behavior from the (usually cut) character claim. Describe the behavior and *optionally* mention context (e.g., historical, structural, situational) *if verifiable and relevant*: "Hierarchical structures *within many large Japanese companies* mean junior colleagues are often cautious about directly contradicting superiors *in formal meetings*," "Hugs are a common greeting ritual *among acquaintances in many parts of Brazil*."
      *   **Proceed if NO (or after rewrite).**

  5.  **Is it COMPARATIVE without a REFERENCE POINT?**
      *   *Look for:* Words like "more," "less," "unlike," "compared to," "different," without specifying *what* it's being compared to.
      *   **RED FLAG:** "Nordic people are reserved." (Reserved compared to whom? Italians? Americans? Japanese?).
      *   **REWRITE:** Add a specific comparison if accurate and necessary: "Initial interactions with strangers in Sweden often involve less overt friendliness *than might be common in urban Brazil*." *Use sparingly and carefully*.
      *   **RED FLAG:** If no *accurate, non-stereotyping* comparison point is possible/known.
      *   **Proceed if NO or after careful rewrite.**

  6.  **Could it lead to NEGATIVE PROFILING or EXPECTING SPECIFIC BEHAVIOR FROM AN INDIVIDUAL?**
      *   *Ask:* "Could a reader use this to unfairly judge an individual ('Ah, he's Brazilian, he *should* be hugging me!')?" or "Could this create a negative expectation ('Nordic people are cold, so she must dislike me')?"
      *   **REFER:** "Brazilians are warm and physical, expect hugs." (Directly tells the reader to expect specific physical behavior from individuals). "Nordic people are reserved with strangers..." (Could prime negative interpretation of normal behavior). *This is often the hidden danger of even "positive" character traits.*
      *   **REWRITE:** Focus on conventions the *expat* might encounter (not inherent traits of individuals): "Be prepared that greetings *from* acquaintances *in Brazil* may involve a hug," "Initial interactions *in Norway* may seem reserved *compared to your home culture*; don't take it personally."
      *   **Proceed if NO (or after rewrite).**

  **Where it Stops:**
  *   **RED FLAG:** Cut or fundamentally rewrite the sentence. Character claims usually get cut. Absolutes get qualifiers. Useless generalizations get cut.
  *   **REWRITE:** Editor modifies the sentence following the guidelines above.
  *   **REFER:** Sent to the Editorial Director with specific concerns noted (e.g., "REFER Q6: May prime reader for negative profiling of individuals").
  *   **PROCEED:** The sentence passes the checks (focuses on contextualized behavior without essentializing, absolutes, or high profiling risk).

  **Running the Examples:**

  1.  **"In Japan the group comes before the individual, so a junior colleague won't contradict the boss in a meeting."**
      *   **Q1:** YES. "The group comes before the individual" is a character claim. "So" directly links it to behavior. **RED FLAG.** *Procedure stops. Needs major rewrite or cut.*
      *   *Suggested Rewrite:* "Within the hierarchical structure common in many large Japanese companies, junior colleagues often avoid directly contradicting a superior during formal meetings. This reflects a focus on consensus and maintaining group harmony *in that context*." (Focuses on specific behavior in a specific context, avoids "group before individual" character claim).

  2.  **"Brazilians are warm and physical, expect hugs."**
      *   **Q1:** YES. "Brazilians are warm and physical" is pure character claim. **RED FLAG.** *Procedure stops. Needs major rewrite.*
      *   **Q6:** (Even if rewritten) "Expect hugs" directly tells the reader to expect specific behavior from individuals, high profiling risk. **REFER** if kept after Q1 rewrite.
      *   *Suggested Rewrite:* "Social greetings among friends, family, and sometimes colleagues in Brazil often involve physical contact, such as hugs or cheek kisses." (Describes a common *convention*, avoids character traits, removes directive "expect").

  3.  **"Nordic people are reserved with strangers but obsessively egalitarian."**
      *   **Q1:** YES. "Reserved," "obsessively egalitarian" are character claims. **RED FLAG.** *Procedure stops. Needs major rewrite.*
      *   *Suggested Rewrite:* "Initial interactions with strangers in public settings in countries like Sweden or Denmark often involve less small talk and overt friendliness than in some other cultures. Egalitarian values are frequently expressed in social norms and workplace structures, such as relatively flat hierarchies." (Splits the claims. Focuses "reserved" on observable behavior in context. Focuses "egalitarian" on observable norms/structures, removes "obsessively").

  **What the Procedure CAN'T Do (The Known Holes):**

  1.  **Verify Statistical Accuracy:** It flags *how* something is said, not *if* it's statistically true. An editor might pass "It's common to see X in situation Y" even if X is actually rare, if the phrasing avoids the red flags. *Responsibility:* Authors must source claims. Editors should flag obviously dubious statements for fact-checking *outside* this procedure.
  2.  **Assess Nuance & Context Adequacy:** "Common in large companies" is better than nothing, but is it *accurate*? Does it cover regional variations? The procedure encourages context but can't ensure its sufficiency or precision. *Responsibility:* Editorial judgment & author expertise.
  3.  **Catch "Soft" Essentialism:** Subtle phrasing implying inherent difference without using forbidden words might slip through ("There's a strong emphasis on consensus in Japanese meetings" – better, but could still imply a unique, fixed cultural essence if not careful).
  4.  **Handle Historical/Power Dynamics:** It won't flag stereotypes rooted in colonial views or power imbalances unless they manifest as overt character claims or profiling risks. E.g., "Indirect communication is preferred" might pass if phrased behaviorally, even if it stems from a problematic "inscrutable Asian" trope.
  5.  **Judge Overall Guide Balance:** A guide full of passed behavioral statements can *still* paint a monolithic, stereotypical picture if not balanced with diversity, individuality, regional variation, and change over time. *Responsibility:* Editorial oversight on the *whole* manuscript is crucial.
  6.  **Address "Positive" Stereotypes:** "Warm," "hardworking," "polite" stereotypes pass Q6 (negative profiling) easily but can still be reductive and create pressure on individuals. The procedure relies heavily on Q1 (character claim) to catch these.

  **Why This Works & Why Your Instinct Was Good (But Needed Bolstering):**

  Your instinct (behavior over character) targets the core problem: **essentialism**. Attributing behavior to an inherent, national "essence" is scientifically dubious and ethically risky. This procedure enforces that. The additions tackle the practical consequences of generalizations:

  *   **Absolutes (Q3):** Create unrealistic expectations and ignore diversity.
  *   **Sole-Cause Character (Q4):** Oversimplifies complex motivations (behavior could stem from structure, history, situation, not just "values").
  *   **Lack of Comparison (Q5):** Makes claims meaningless or ethnocentric.
  *   **Profiling Risk (Q6):** The critical hole in just banning character claims – behavioral generalizations can still harm individuals.

  This gives editors a clear, sequential checklist focused on the *most harmful* aspects of cultural generalizations. It flags the worst offenders quickly (Q1 & Q3), forces nuance (Q2, Q5), and catches the insidious individual profiling risk (Q6). It doesn't pretend to solve all problems of cross-cultural writing, but it creates a robust first line of defense against publishing harmful stereotypes disguised as guidance.
