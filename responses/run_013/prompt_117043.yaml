answer: |-
  Below is a structured analysis of the desiderata for an adequate account of the doing/allowing distinction in end-of-life ethics, tailored to your committee's practical needs. I distinguish **genuine desiderata** (grounded in defensible ethical, legal, or empirical realities) from **prejudices** (unexamined assumptions of specific camps), identify irresolvable conflicts, and highlight the requirement that most forcefully exposes weaknesses in existing accounts.

  ---

  ### **I. Core Cases Any Account Must Get Right**  
  *(Genuine desiderata, derived from paradigmatic or clinically urgent scenarios)*  

  1. **Drowning Child Pair**  
     - *Case*: Actively holding a child underwater (doing harm) vs. watching a child drown without intervention (allowing harm).  
     - *Motivation*: This is the bedrock moral intuition: actively causing death is typically worse than failing to prevent it. Any account failing this is non-starter.  
     - *Status*: **Genuine desideratum**. Tests the distinction’s core moral asymmetry.  

  2. **Withdrawing vs. Withholding Ventilation**  
     - *Case*: Removing an existing ventilator (withdrawing) vs. never starting ventilation (withholding).  
     - *Motivation*: Clinical guidelines (e.g., AMA, SCCM) treat these as *morally equivalent*, yet families/perceivers often see withdrawal as more "active" and blameworthy.  
     - *Status*: **Genuine desideratum**. An account must explain why guidelines equate them while acknowledging perceptual differences.  

  3. **Disconnecting Ventilator vs. Lethal Injection**  
     - *Case*: Turning off a ventilator (allowing underlying illness to cause death) vs. administering potassium chloride (directly causing death).  
     - *Motivation*: The law and ethics overwhelmingly treat the former as permissible (allowing death) and the latter as murder (doing harm).  
     - *Status*: **Genuine desideratum**. Tests whether the distinction tracks *causal pathways* (interrupting artificial support vs. introducing new harm).  

  4. **Device Default Settings (e.g., Drug Pump)**  
     - *Case*: A pump delivers a life-sustaining drug unless actively reprogrammed to stop. Not reprogramming allows death; reprogramming actively causes it.  
     - *Motivation*: Clinically common, yet default settings invert intuitions: *inaction* becomes causal, and *action* becomes "allowing."  
     - *Status*: **Genuine desideratum**. Exposes how technology can blur moral categories.  

  5. **Preconfigured Automated Systems**  
     - *Case*: A clinician programs an automated system (e.g., dialysis) weeks earlier; it acts in real-time without ongoing input. Is disconnecting it "doing" or "allowing"?  
     - *Motivation*: Challenges whether the locus of agency lies in the initial programming or the present act.  
     - *Status*: **Genuine desideratum**. Tests temporal and causal responsibility in technologically mediated decisions.  

  ---

  ### **II. Distinctions Any Account Must Preserve**  
  *(Genuine desiderata, essential to avoid moral/legal collapse)*  

  1. **Doing vs. Allowing**  
     - *Requirement*: Must delineate active causation from passive permission.  
     - *Motivation*: Without this, all deaths become morally/legally indistinguishable (e.g., withholding food = lethal injection).  

  2. **Intending vs. Foreseeing**  
     - *Requirement*: Must accommodate the Doctrine of Double Effect (e.g., giving opioids foreseeing respiratory depression vs. intending death).  
     - *Motivation*: Clinically critical for pain management; law absolves foreseen but unintended harms.  

  3. **Causal vs. Moral "Causing"**  
     - *Requirement*: Must distinguish *physical causation* (e.g., disconnecting a ventilator physically causes death) from *moral responsibility* (e.g., it may still be "allowing" death if disease is the true cause).  
     - *Motivation*: Prevents conflating physics with ethics (e.g., "You pulled the plug, so you killed them" oversimplifies).  

  4. **Acting vs. Omitting**  
     - *Requirement*: Must clarify whether "allowing" requires a prior duty to act (e.g., a clinician’s duty to treat vs. a bystander’s in the drowning case).  
     - *Motivation*: Withdrawal cases often hinge on whether clinicians have ongoing duties.  

  ---

  ### **III. Consistency Requirements**  
  *(Mixed: some genuine, some reflect biases)*  

  1. **Legal Act/Omission Doctrine**  
     - *Requirement*: Must align with law treating omissions less harshly than acts (e.g., *no duty to rescue* rules).  
     - *Motivation*: Practical necessity for institutional decision-making.  
     - *Status*: **Genuine desideratum** for accountability.  

  2. **Asymmetry in Ordinary Judgments**  
     - *Requirement*: Must explain why laypeople perceive actively "doing" as worse than "allowing," even with identical outcomes.  
     - *Motivation*: Empirical studies (e.g., Cushman et al.) show robust cross-cultural asymmetry.  
     - *Status*: **Genuine desideratum** for legitimacy; ignoring public intuition invites distrust.  

  3. **Guideline Equivalence of Withholding/Withdrawing**  
     - *Requirement*: Must not contradict guidelines treating withholding/withdrawing as ethically identical.  
     - *Motivation*: Clinical practicality and avoidance of "slow codes."  
     - *Status*: **Prejudice of the professional camp**. Reflects institutional efficiency but conflicts with lay intuition (#2) and legal asymmetry (#1).  

  4. **Patient/Family Distinction Between Withholding/Withdrawing**  
     - *Requirement*: Must acknowledge families often view withdrawal as more agentive and thus more guilt-inducing.  
     - *Motivation*: Empathic care requires addressing psychological realities.  
     - *Status*: **Genuine desideratum** for patient-centered ethics.  

  ---

  ### **IV. Inherent Conflicts: Where the Committee "Wants It Both Ways"**  
  **The central tension is unresolvable:**  
  - **Conflict 1**: *Guideline equivalence* (withholding = withdrawing) vs. *Legal/ordinary asymmetry* (acts > omissions).  
    - Why? Guidelines prioritize outcome-consistency, but law/intuition prioritize *agential involvement*. Withdrawal *feels* like an act due to direct manipulation.  
  - **Conflict 2**: *Device defaults* vs. *Causal/moral distinction*.  
    - Why? Reprogramming a pump to *stop* delivery is physically an act causing death, but morally framed as "allowing" death by honoring patient autonomy. Yet in default cases, *inaction* causes death, straining the doing/allowing binary.  
  - **Conflict 3**: *Preconfigured systems* vs. *Temporal agency*.  
    - Why? If a clinician programs a fatal action weeks prior, is disconnecting it later "undoing" their act or committing a new one?  

  **No account can fully reconcile all without trade-offs.**  
  - **Trade-off Necessity**: An adequate account must either:  
    (a) Prioritize *moral intent/circumstance* over physical causality (sacrificing legal symmetry), or  
    (b) Adopt a *contextual view* where duties and defaults define "allowing" (sacrificing universal principles).  

  ---

  ### **V. The Requirement That Excludes Most Existing Accounts**  
  **The Device Default Setting case** is the most devastating to conventional theories.  

  - **Why it excludes accounts**:  
    - **Causal Theories** (focusing on energy/matter transfer): Fail because not reprogramming a pump involves *no physical act*, yet causes death.  
    - **Agency Theories** (emphasizing bodily motion): Struggle to explain why *not moving* (when movement is expected) is "allowing."  
    - **Normative Theories** (relying on duties): Defaults create "duties to act" where none existed, making inaction culpable.  
  - **Impact**: Only *relational* or *duty-relative* accounts (e.g., Woollard, Howard-Snyder) can partially handle this by tying "allowing" to *contextual obligations*. Even they falter with automated systems.  

  ---

  ### **Practical Recommendation for Your Committee**  
  1. **Acknowledge the Irresolvable Tension**: Admit that guideline equivalence (withholding = withdrawing) conflicts with lay intuition and legal doctrine. Vote based on *duty cessation*: Once treatment is deemed non-beneficial, withdrawing is *releasing* a patient from artificial support, not an act of killing.  
  2. **Prioritize the Drowning Test**: If an intervention *introduces a new fatal path* (lethal injection), it’s doing; if it *removes an artificial barrier* to an existing fatal path (ventilator withdrawal), it’s allowing.  
  3. **Reject Default-Setting Intuitions**: Treat reprogramming a pump to stop as "allowing" if consistent with patient wishes, regardless of mechanics.  

  Your committee’s struggle reflects a deeper truth: the doing/allowing distinction is a **heuristic for culpability**, not a physical law. An adequate account must deliver *practical moral guidance* under uncertainty, not metaphysical precision. Focus on intent, duties, and patient goals—not lines in the sand.
