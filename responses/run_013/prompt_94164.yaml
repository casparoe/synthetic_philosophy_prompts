prompt: |-
  I cover science and ideas for a general-interest magazine, and I'm at work on a long piece about the universal basic income that has migrated from the seminar room to the campaign trail. Before I file it, I want to understand what the leading version of the policy is quietly committed to, because the case its advocates make and the way they have designed the thing do not obviously line up.

  The version I have in mind is the one with the most support: a monthly cash payment to every citizen, paid to individuals rather than to households, with no work requirement, no means test, and no conditions attached, and financed not from general income-tax revenue but from a sovereign wealth fund built out of the proceeds of the country's natural resources — the citizens' dividend model. Its defenders describe it as an enlargement of freedom and an affirmation of everyone's equal standing.

  But the design carries commitments the freedom talk never mentions. Paying the wealthy as well as the poor implies that the payment is not really about need. Paying individuals rather than families implies that the person, not the household, is the unit that justice counts. Funding it from resource revenues rather than from taxes on labor implies that the wealth in question belongs to everyone in common rather than to those who produced it. And setting the payment below what it takes to live on implies that paid work is still expected of the able-bodied.

  Reconstruct for me the theory of justice, freedom, desert, and ownership that this design presupposes — the picture of the citizen's relation to the state and to the national wealth that would have to be true for the policy to hang together. Tell me which of these commitments the design strictly requires and which it merely accommodates, and where the same design would be equally at home under a different underlying theory. Flag any two commitments that sit awkwardly together — whether, for instance, the common-ownership story about the funding can be squared with the individualist, desert-denying picture the unconditional payment seems to assume. Then say what would have to change in the policy if we swapped the presupposed view for its most serious rival, a conception of justice built on reciprocity and contribution rather than on equal ownership. Skip the literature and the citations; I want the implicit theory made explicit and tested for coherence.
reasoning: |-
  Okay, let me unpack this query from a science journalist working on a UBI piece. They're clearly deep into the policy weeds but frustrated by the gap between advocates' freedom rhetoric and the actual design choices of the citizens' dividend model. 

  Hmm... their core ask is sharp: reconstruct the implicit political theory baked into this specific UBI variant. Not just surface analysis—they want the philosophical wiring exposed. The four design features they flagged (universality, individual payment, resource funding, sub-livelihood amount) are perfect entry points. 

  First, I need to validate their intuition that these aren't accidental features but philosophical commitments. The "equal co-ownership" framework seems foundational here—it explains why funding comes from resources rather than income tax. That choice isn't just practical; it's a statement that the wealth was never rightfully privatized. 

  But the tension they spotted is real. If we're all equal owners, why does the policy imply paid work is still necessary? I'll need to show how the "floor not ceiling" principle bridges that gap. And the individual vs household point... that's clearly a liberal atomism commitment, but interestingly, it's not strictly required by the ownership theory. 

  When swapping to a reciprocity-based theory, the changes become obvious: means-testing, work requirements, labor taxation. But the journalist might not realize how drastically that alters the policy's DNA—it becomes practically unrecognizable. Should emphasize that transformation. 

  Most satisfying insight: the funding source isn't just a detail—it's the policy's philosophical keystone. Change that, and the whole justificatory structure collapses. That's what makes this version distinct from libertarian or leftist UBIs. 

  ...better avoid academic jargon though. They want coherence testing, not literature review. The "equal standing" vs "reciprocity" contrast will anchor the response.
answer: |-
  Here's the reconstructed implicit theory behind the citizens' dividend UBI model, its tensions, and how it shifts under a rival framework:

  **Core Philosophical Commitments:**
  1.  **Justice as Equal Co-Ownership of Natural Endowments:** The earth's resources are initially unowned or collectively held. Private appropriation creates a debt to society. The sovereign wealth fund formalizes this collective inheritance, making justice restorative, not redistributive.
  2.  **Freedom as Negative Liberty & Exit Power:** Unconditional cash maximizes individual choice (negative liberty). Crucially, it provides an *exit option* from exploitative work or relationships, enhancing bargaining power and real autonomy beyond formal rights.
  3.  **Desert is Irrelevant for Foundational Shares:** Individual merit or effort plays no role in justifying the *basic share* of collectively created natural wealth. Your existence as a citizen-co-owner is sufficient. Desert applies only to income *beyond* this baseline.
  4.  **Ownership as Socially Constructed:** Private property rights (especially over natural resources) are not pre-political or absolute. They are granted and defined by the community, which rightfully claims a share of the value they generate.
  5.  **The Citizen-State Relationship:** Citizens are primarily *shareholders* in a commonwealth, not just taxpayers/recipients or subjects. The state acts as trustee, converting natural capital into a universal dividend.
  6.  **The Person as the Fundamental Unit:** Justice attaches to individuals, not households. This assumes adults are autonomous agents and rejects dependence within families as a basis for differential treatment by the state.

  **Strictly Required vs. Accommodated:**
  *   **Strictly Required:**
      *   **Funding Source (Resource Wealth):** This is the *keystone*. Without it, the core justice claim (restoring value from collectively owned assets) collapses. Funding from general income tax fundamentally alters the justification.
      *   **Universality (Including the Wealthy):** Directly flows from the co-ownership principle. Excluding anyone denies their equal stake in the commons.
      *   **Unconditionality (No Work Requirement):** Essential for the "exit power" conception of freedom and the irrelevance of desert for the base share.
  *   **Accommodated (Could Differ Under Same Theory):**
      *   **Payment Level (Below Subsistence):** The core theory *permits* this but doesn't *require* it. A livable UBI could still align with the philosophy (enhancing exit power further). The sub-livelihood level reflects political pragmatism or a specific view of sufficiency, not a core tenet of the ownership theory itself.
      *   **Individual vs. Household Payment:** While individualism fits neatly, the core ownership theory *could* be adapted to a household model (e.g., shares per adult, partial for children) without collapsing. The individual payment is a strong preference reflecting liberal individualism, not a strict logical necessity of the resource-ownership premise.

  **Key Tension:**
  *   **Common Ownership vs. Atomistic Individualism:** The funding source screams "community ownership and shared inheritance." Yet, the individual payment and lack of any *community obligation* (like a participation requirement, even symbolic) lean towards radical individualism. The policy assumes citizens are isolated shareholders receiving dividends, not members actively sustaining a common project. Can the deep communitarian premise of shared resources truly coexist with an entitlement that imposes zero correlative duties (beyond citizenship) on the recipient? The design avoids this question, potentially undermining the communal solidarity the resource argument implicitly invokes.

  **Swapping Theories: Justice as Reciprocity & Contribution**
  A rival theory holds justice requires benefiting proportionally to one's contribution to the social cooperative scheme. Here's how the policy *must* change:

  1.  **Funding Source:** Natural resources? Irrelevant or secondary. **Primary funding MUST come from taxation on productive activity (income, consumption, wealth)** – the fruits of societal cooperation. A resource fund might supplement, but not justify the core payment.
  2.  **Universality:** **Means-testing or significant clawbacks via taxation become essential.** Paying the wealthy unconditionally violates reciprocity; they aren't "needing" the social dividend and their contributions (taxes) are already their input. The payment targets those contributing less (children, disabled, elderly) or needing support to contribute.
  3.  **Unconditionality:** **Work/Contribution Requirements become central (with exemptions).** For the able-bodied, receiving support requires *some* form of reciprocal contribution (paid work, caregiving, education, community service). The "no strings attached" model contradicts the core ethic of mutual responsibility.
  4.  **Payment Level:** **Must be sufficient to live on *if combined with an exemption from work requirements* for those unable to contribute.** For others, it could be lower, acting as a wage supplement conditioned on work. The sub-livelihood level only "works" if paid work is expected, which now becomes an explicit obligation for the able-bodied.
  5.  **Unit of Justice:** **The Household/Family gains prominence.** Contribution and need are often assessed within family units (e.g., a single earner supporting dependents). Individual payments might persist, but household income matters for eligibility/level.
  6.  **Philosophical Shift:** The citizen is reimagined as a *participant* in a cooperative venture, not a passive shareholder. The state facilitates reciprocity and ensures contributions are fairly rewarded/supported, rather than dispensing shares of an inheritance.

  **In essence:** Under reciprocity, the policy transforms from an unconditional "dividend" into a conditional "participation income" or negative income tax, funded by social production, not natural inheritance. The core justifications of restoring common ownership and providing pure exit power evaporate, replaced by obligations to contribute and support based on societal cooperation. The design's coherence depends entirely on its anchoring in the common ownership theory; changing that foundation requires dismantling its defining features.
