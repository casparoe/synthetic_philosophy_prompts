  ## Unilateralist's Ghazal

  Each mind a lighthouse, scanning seas unknown,
  My private calculus says: **I must act alone.**

  The trigger gleams, a tempting, weighted prize,
  If good outweighs the harm? Then **I must act alone.**

  Ten thousand others scan the murky scales,
  But blind to them, conviction grows: **I must act alone.**

  That cure withheld? My certainty is bright!
  To break the dam of doubt, **I must act alone.**

  That city lost? A shadow on *their* chart,
  Unseen by me, the call: **I must act alone.**

  The loudest voice, perhaps the most astray,
  Yet drives the hand that dares: **I must act alone.**

  The perfect plan requires a chorus joined,
  But silence reigns, so **I must act alone.**

  The greatest good might spring from one bold leap,
  Or deepest harm... Still, **I must act alone.**

  You judge the wreckage, name the reckless one,
  Yet in your turn, you'll feel: **I must act alone.**

  ---

  **Author's Note on the Poem:**

  1.  **Structure as Curse:** The ghazal form, with its autonomous couplets and relentless refrain, embodies the uncoordinated agents. Each stanza *is* an isolated decision, unaware of others' identical thoughts.
  2.  **Symmetry Over Morality:** The poem presents both catastrophic ("That city lost") and potentially beneficial ("That cure withheld?") actions driven by the *same* mechanism of acting on the most extreme positive estimate. It avoids framing the curse solely as negative.
  3.  **Liberty: Necessity of Action:** The poem leans into the *inevitability* ("close to certain") inherent in the curse. Each agent feels compelled ("must act") once their threshold is crossed, compressing the probabilistic argument into a felt imperative.
  4.  **Liberty: Ambiguity of "Extreme":** While the curse centers on *optimistic* extremes triggering bad outcomes, the poem subtly questions whether acting on *any* extreme conviction ("The loudest voice, perhaps the most astray") is the core issue, regardless of initial intent. This blurs the line between curse and mechanism.
  5.  **The Unavailable Fix:** The final couplet implicates the reader/speaker ("you'll feel: I must act alone"), demonstrating why coordination fails: each agent, including the one observing past failures, faces the same isolation and internal imperative in their *own* moment. The "hand closing on nothing" is the impossibility of knowing others' thresholds while making your own decision.
