answer: |-
  ## Memorandum: On the Marston Fountain  
  **To:** The Commemoration Review Commission  
  **From:** The Chair (with Philosophical Consultation)  
  **Date:** 15 October 2023  
  **Subject:** Recommendation for Action: Marston Fountain, Old Market Square  

  **I. RECOMMENDATION**  
  **Retain the fountain in its current location and form.** Supplement it with a permanent, ground-level bronze plaque set *immediately before it* on the main approach path. This new plaque will:  
  1.  Name the strikers of 1894 and the neighborhood workers whose labor built the city.  
  2.  State plainly: "In 1894, Horatio Marston broke their strike using violence and imported labor."  
  3.  Acknowledge the fountain’s complex legacy: "This fountain, given by Marston in 1911, stands on contested ground. We retain it as a source of public water and a record of past choices, while honoring those it originally overlooked."  
  **Timeline:** Draft text for plaque by 1 December 2023; Commission approval by 15 January 2024; Fabrication/Installation complete by 1 May 2024 (ahead of summer use and budget vote).  

  **II. THE STRONGEST CASE FOR REMOVAL & COUNTER-ARGUMENT**  
  *The Case for Removal (Proposal 1):*  
  Removal is the only morally coherent act. Horatio Marston used violence to crush workers seeking dignity, then later used philanthropy to launder his reputation. Keeping any monument bearing his name perpetuates that laundering. It tells victims’ descendants that wealth and a later "gift" can erase cruelty. The fountain’s inscription makes a false pledge *on our behalf*: it asks us to honor Marston as a benefactor. We cannot honestly do so. A counter-monument directly confronting this history and recording the removal would be a true reckoning. It breaks complicity with historical injustice and signals our values clearly: we do not venerate those who broke solidarity with our community through force. Keeping the fountain, even altered, keeps Marston’s symbolic victory intact.  

  *Answer:*  
  This argument powerfully exposes the moral hazard of complicity. However, removal creates new problems of historical erasure and communal loss. It destroys a functional public good (the only free water source on the square) used by people today. Crucially, it disregards the Old Mill neighborhood’s lived experience: for generations, they have *reclaimed* this object, transforming it from a monument *to* Marston into a monument *of* their own endurance and presence. Removal seizes their repurposed landmark. Furthermore, it risks simplifying history into a single act of demolition. A counter-monument, while potentially powerful, risks becoming an abstract gesture, disconnected from the physical trace of the original injustice and potentially appearing as civic self-congratulation ("Look how enlightened we are now!"). True reckoning requires grappling with the *persistence* of contested symbols, not just their deletion.  

  **III. APPLYING & TESTING THE TWO-LEDGER FRAMEWORK**  
  Your two-ledger framework is insightful but requires refinement:  

  1.  **Ledger 1 (Claims of Fact):**  
      *   **Original Inscription:** Claims Marston was a benefactor worthy of honor through this gift.  
      *   **Problem:** Omits his role in strike-breaking and violence. This claim is incomplete and misleading.  
      *   **Remedy Tested:**  
          *   *Removal:* Erases the original claim but destroys the evidence of its existence and the context for the counter-monument. Future citizens see only *our* statement, not the problematic artifact *we* inherited.  
          *   *Re-inscription:* Replacing Marston’s name (Proposal 2) corrects the factual claim about *who* is honored *now* but falsifies the historical record. It erases the original donor’s intent and the social reality of 1911 philanthropy. It *is* a forgery.  
          *   *Interpretive Panel (Proposal 3):* Adds missing facts (the strike) but leaves the original, misleading claim physically dominant and unchallenged. The fountain’s inscription still "speaks" its falsehood.  
          *   *Our Proposal (Supplemental Plaque):* Forces a direct confrontation. The new plaque states the counter-fact ("Marston broke the strike") *while leaving the original artifact as evidence.* The original claim remains legible, but its authority is actively undermined by the new, grounded statement.  

  2.  **Ledger 2 (Present Pledge/Honor):**  
      *   **Original Inscription:** Pledges that the city honors Horatio Marston.  
      *   **Problem:** We cannot honestly make this pledge today.  
      *   **Remedy Tested:**  
          *   *Removal:* Unambiguously ends the pledge to honor Marston. The counter-monument pledges to honor the strikers and records the removal as an act of present values.  
          *   *Re-inscription:* Makes a new pledge (to honor workers/neighborhood) but does so by altering the historical object, blurring lines between past and present voice.  
          *   *Interpretive Panel:* Implies the city’s pledge is now merely "complex" or "contextualized," potentially diluting the moral rejection of Marston’s actions. The primary visual pledge remains the unchanged fountain honoring him.  
          *   *Our Proposal:* Makes a clear, separate, contemporary pledge *honoring the strikers and workers*. It physically intervenes *before* the fountain, forcing engagement with our pledge *first*. The fountain remains, but the city’s primary "statement" at the site becomes the new plaque. We retain the fountain not to honor Marston, but as a functional object, a historical record, and an artifact *reclaimed* by the community it names. Our pledge is decoupled from the donor’s intent.  

  **Where the Test Misleads:** The ledgers are not truly separable. The physical object *itself* (beyond text) carries meaning impacting both ledgers. Removing it destroys historical evidence (Ledger 1) but also removes a functional resource and a community touchstone (impacting Ledger 2's pledge about present needs). Our proposal treats the *entire site* as the monument. The new plaque addresses Ledgers 1 & 2 directly. The retained fountain serves Ledger 1 (as evidence) and a *different* aspect of Ledger 2: our pledge to preserve functional public infrastructure and acknowledge community reclamation.  

  **IV. COMMUNITY MEANING & THE SELF-CONGRATULATION RISK**  
  *The Neighborhood Association's Claim:* They argue the fountain's meaning is made by its users, not fixed by Marston. This is profoundly valid. Memorials are not static; they are dialogues. For generations, workers filled bottles, saw their reflection in the water, and interpreted "working men of the district" as referring to *them* and *their* ancestors, effectively wresting the monument's meaning from the donor. Removing the fountain erases *this* lived history and their act of reclamation. Preservation, *with a critical supplement*, respects this communal meaning-making while adding the necessary historical correction *they* also deserve.  

  *The Counter-Monument Risk:* The fear that a new monument solely about the strike and removal becomes an act of civic self-congratulation is real. It risks saying, "Look, we fixed it!" by removing the uncomfortable artifact, potentially absolving the present of deeper engagement. It focuses on *our* virtuous act of removal rather than forcing a continuous, uncomfortable encounter with the *original* problematic object and the *ongoing* need for vigilance. Our proposal avoids this by keeping the problematic object *in view*, demanding constant reinterpretation, and tying the new statement inextricably to its context. The critique is embedded *at the site*, not replaced by a new, potentially self-satisfied narrative.  

  **V. ASSUMPTIONS MADE**  
  1.  *Functional Value:* I assume the fountain’s practical use as a water source is significant and worthy of preservation as a public good. If it is rarely used or easily replaced elsewhere, this weakens a key argument for retention.  
  2.  *Neighborhood Sentiment:* I take the Old Mill Association’s stated reclamation of meaning as genuine and representative. If deeper consultation reveals significant division within the neighborhood, this requires reassessment.  
  3.  *Panel Effectiveness:* I assume a *sole* interpretive panel (Proposal 3) tends to be ignored or fails to adequately challenge the dominant original monument. Our proposal makes the counter-statement physically primary and unavoidable.  
  4.  *Marston Trust Motive:* I assume the Trust’s funding offer can be accepted without undue influence if the decision is principled and independent. The offer funds *consequences*, not the decision itself.  

  **VI. CLOSING MOTION FOR VOTE**  
  "I move that the Commission retain the Horatio Marston Fountain in its current location, supplement it with a permanent ground-level bronze plaque on the main approach path detailing the 1894 strike, Marston's role, and honoring the neighborhood workers, with final text approved by this Commission by January 15th, 2024, and installation completed by May 1st, 2024."
