answer: |-
  Here's a decision tree for the units-of-selection debate, starting from the undisputed premise and branching through key conceptual questions using concrete cases. Each node is phrased as a question answerable without prior knowledge of the labels.

  **Starting Commitment:** A trait can spread because it benefits the group containing the bearer, even while imposing a cost *on* the bearer (e.g., a gene causing individual sterility in insect colonies, enhancing colony survival).

  ---

  ### Decision Tree: Units of Selection

  1.  **Is the fundamental unit of selection (what is "selected") the entity that *replicates* its structure with high fidelity across generations (e.g., gene, chromosome), OR is it the entity that *interacts* directly with the environment, whose survival/reproduction determines replication (e.g., organism, group)?**
      *   **(A) Replication is fundamental (Replicator Focus):** Go to Q2.
          *   *Case: A meiotic-drive gene replicates itself at >50% in gametes, even if it kills the organism carrying it.*
      *   **(B) Interaction is fundamental (Vehicle/Interactor Focus):** Go to Q3.
          *   *Case: Chickens bred in individual cages vs. group cages; highest egg production comes from groups selected *as groups* (despite within-group competition).*

  2.  **Does the gene's-eye view imply that *only* genes (replicators) can be the bearers of adaptations?**
      *   **(A) Yes, adaptations exist *for* the benefit of replicators:** **Gene's-Eye View (Dawkins)**. Adaptations are strategies replicators use to persist. Group benefits are incidental/byproducts.
          *   *Case: "Green-beard" gene (identifies & cooperates with copies of itself) spreads via individual advantage, not true group selection.*
      *   **(B) No, adaptations manifest at the level of the interactor:** **Replicator/Interactor Framework (Hull)**. Replicators are selected *via* the differential survival of interactors. Adaptations belong to interactors (organisms, groups).
          *   *Case: A bacterium evolves antibiotic resistance; the gene (replicator) is selected because the bacterial cell (interactor) survives.*

  3.  **When groups vary in trait frequency, does selection *between* groups act (mainly) on differences in the *fitness of individuals within those groups* OR on differences in the *fitness/propagation of the groups themselves*?**
      *   **(A) Differences in fitness of individuals within groups (MLS1):** Go to Q4.
          *   *Case: A trait (e.g., reduced aggression) lowers an individual's competitive ability within its group *but* increases group productivity/survival. Frequency increases via differential group productivity changing individual fitnesses.*
          *   *Case: The chicken group selection experiment (interpreted as changing individual fitnesses within groups).*
      *   **(B) Differences in fitness/propagation of groups themselves (MLS2):** Go to Q5.
          *   *Case: Groups differing in trait frequency (e.g., cooperation rate) vary in their birth rate (fissioning) or extinction rate. Trait spreads via differential group propagation.*

  4.  **Can MLS1 ("group selection" acting via individual fitness differences) produce *adaptations at the group level* (e.g., complex colony structures, specialized castes)?**
      *   **(A) No, true group-level adaptations require group reproduction/demise (MLS2):** **Traditional Group Selection Critique/Strict Individualism (G.C. Williams)**. MLS1 changes gene frequencies, but adaptations are for individual benefit. Group benefit is incidental.
          *   *Case: Reduced aggression spreads via MLS1, but it's an adaptation *for* individual survival within a group context, not *for* the group.*
      *   **(B) Yes, MLS1 can produce group-level adaptations:** **Multilevel Selection 1 (MLS1) / Contextual Analysis**. If the group is the relevant environment structuring individual fitness, adaptations can be *for* group function, even if selection acts via individual fitness.
          *   *Case: Sterile worker castes in insects evolve via MLS1; the adaptation (sterility) benefits the colony level.*

  5.  **Is the entity undergoing MLS2 (e.g., group, species) a cohesive enough unit to develop complex *adaptations* at its level?**
      *   **(A) Yes, cohesive groups/species can bear complex adaptations:** **Multilevel Selection 2 (MLS2) / Group Adaptations**. Selection between groups leads to traits that function *for* the group's survival/reproduction.
          *   *Case: Hypothetical: Groups evolve complex internal division of labor or communication systems specifically enhancing group fission success.*
      *   **(B) No, higher-level units (groups/species) generally lack the cohesion/replication fidelity for complex adaptations; changes are sorting:** **Species Selection/Sorting (Gould, Vrba) or MLS2 without Adaptation**. Differential birth/death of groups/species changes trait frequencies, but this is sorting, not selection *producing* complex adaptations at that level.
          *   *Case: A species with widespread asexual reproduction squeaks through a mass extinction because its mode of reproduction buffers it against mate-finding issues. Frequency of asexuality increases, but it's not an adaptation *of* the species.*

  6.  **(Meta-Question): Is the level at which selection acts primarily a fact about nature (ontology), or is it primarily a choice about the most useful perspective/modeling framework?**
      *   **(A) Primarily a fact about nature (Realism):** Your position depends on answers above (e.g., Gene's-Eye, MLS1, MLS2).
      *   **(B) Primarily a modeling choice (Perspectivalism/Deflation):** **Pluralism / "No Fact of the Matter" / Toolbox View**. Different models (genic, individual, group) capture different aspects of the same causal process. The "true" unit is perspectival.
          *   *Case: Explaining cancer (a somatic cell lineage evolving within a body) can use organismal frameworks (immunosurveillance failure) or multilevel frameworks (selection among cell lineages). Both useful.*

  ---

  **Key Leaves & Paths:**
  *   **Gene's-Eye View:** 1A -> 2A
  *   **Replicator/Interactor Framework:** 1A -> 2B
  *   **Traditional Group Selection Critique (Williams):** 1B -> 3A -> 4A
  *   **MLS1 (Contextual Analysis):** 1B -> 3A -> 4B
  *   **MLS2 (Group Adaptations):** 1B -> 3B -> 5A
  *   **Species Selection/Sorting:** 1B -> 3B -> 5B
  *   **Pluralism / "No Fact of the Matter":** 6B

  **Ambiguous/Overlapping Leaves:**
  *   **Pluralism (6B) vs. "No Fact of the Matter" (6B):** These occupy the same branch (6B). Pluralism often implies "no single true unit," while a strong deflationary view might see the whole debate as non-substantive. The distinction is often blurry in practice.
  *   **Species Selection/Sorting (5B):** Whether this constitutes "selection" or mere "sorting" is itself a point of contention within the leaf.

  **Underpopulated/Unattractive Views:**
  *   **Denying Replicator Priority *and* Denying Group-Level Adaptations (1A -> 2B AND 1B -> 3A -> 4A):** This combination (acknowledging replicators *and* interactors, yet insisting adaptations *only* exist at the individual level even when MLS1 explains group-beneficial traits) is rare. It might be seen as conceptually unstable or unattractive compared to either strong individualism (1B -> 3A -> 4A) or interactor-focused pluralism (1B -> 6B).
  *   **Strong MLS2 Adaptationism without Cohesion (1B -> 3B -> 5A applied to loose aggregates):** Applying complex group adaptation claims to ephemeral groups (e.g., predator-prey interactions) is generally seen as incoherent. Cohesion is a key requirement for most proponents of MLS2 adaptations.

  **Concrete Case Summary:**
  *   **Branching Points:** Meiotic Drive (1), Chicken Flocks (1/3), Green-Beard (2), Sterility/Haystack (3/4), Group Cohesion/Division of Labor (5), Mass Extinction/Species Trait (5), Cancer Lineage (6).
