  ### **Final Specification for Your Machine**
  - **Core architecture**: A formal system (e.g., Peano Arithmetic) with a provability predicate □.  
  - **Self-trust rule**: Adopt □A→A **only for Π₁ sentences**. For other sentences, no blanket trust.  
  - **How it reasons**:  
