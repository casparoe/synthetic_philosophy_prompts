    - Validates consistency empirically (e.g., test runs) or assumes it pragmatically.  
  - **Limitations**:  
    - Cannot prove its own consistency (or its copy's) absolutely.  
    - Complex self-referential claims (e.g., "I will never prove 0=1") are untrusted.  

