answer: |-
  ### Exam Question  
  **Analyze the following two cases of purported precommitment: (1) A woman with early-stage progressive cognitive decline signs an advance directive refusing a specific life-sustaining treatment (e.g., ventilator support) and appoints her brother as its enforcer. Two years later, while still legally competent, she requests the treatment. Her brother refuses, citing the directive. (2) A city council entrenches an environmental protection rule into the city charter via referendum, requiring a two-thirds council majority plus a 5-year waiting period to repeal it. A new council, elected on a mandate to repeal this rule, holds a simple majority but cannot overcome these hurdles.  

  Explain whether these cases share the same underlying structure of precommitment. In your analysis, address:  
  (a) Who authored the rule and who is bound by it in each case.  
  (b) Whether the bound party is identical to the authoring party.  
  (c) How the "regress problem" (i.e., who binds the enforcer) manifests in each.  
  (d) What conditions must hold for each to qualify as genuine precommitment (rather than one party overriding another).  
  (e) Whether the standard justification for precommitment survives if the "same person" assumption fails.**  

  ---

  ### Model Answer (599 words)  

  **(a) Authorship and Binding**  
  In Case 1, the woman authored the advance directive while competent, binding her *future self* (specifically, her future medical decisions). The brother acts as enforcer, binding her *present competent self*. In Case 2, the prior council (via referendum) authored the rule, binding *future councils*. The entrenchment mechanism (super-majority + delay) enforces this, binding the *new council*.  

  **(b) Identity of Author and Bound Party**  
  Case 1 superficially involves the same person (the woman) bound by her past decision. However, her present request demonstrates a *divided self*: the competent past self binds the competent present self. Crucially, the enforcer (brother) is a distinct agent. Case 2 binds a *collective entity* (future councils) that is legally continuous but democratically distinct from the authoring body. The bound council comprises different individuals elected on opposing mandates.  

  **(c) Regress Problem**  
  The regress problem arises when enforcing agents require constraints themselves. In Case 1, the brother enforces the directive against the woman’s current wishes. But who binds *him*? He is governed by legal frameworks (e.g., probate courts) that may invalidate directives if competence persists, creating a regress to external judicial authority. In Case 2, the entrenchment rules bind the council, but these rules derive authority from the charter’s constitutional status. The "enforcer" (the charter’s amendment rules) is itself bound by higher-state law or judicial review, again regressing to external sovereignty. Neither case resolves regress internally.  

  **(d) Conditions for Genuine Precommitment**  
  For binding to be precommitment (not override), two conditions must hold:  
  1. **Agency Continuity**: The bound entity must be a "later version" of the author (e.g., Ulysses binding his future tempted self).  
  2. **Enforcer Neutrality**: The enforcer must mechanically execute the precommitment without independent authority.  
  *Case 1*: Agency continuity is contested—past and present selves conflict despite legal competence. The brother lacks neutrality; his interpretation imposes *his* judgment. If he overrides her current autonomy, it becomes *his* override, not *her* precommitment.  
  *Case 2*: No agency continuity exists; new councils are democratically distinct. The entrenchment rules are neutral, but they bind a *different collective agent*. This resembles prior sovereigns binding future ones, not self-binding. Absent continuity, it is a procedural override by past majorities.  

  **(e) Survival of Justification Without "Same Person"**  
  Classic precommitment justifications (e.g., protecting rationality from weakness of will) fail if author and bound agent diverge.  
  - In Case 1, if the woman’s values changed (e.g., new prognosis), enforcing the directive *against her competent wishes* violates autonomy. Justification survives *only* if we view her past self as "more authentic," but this is philosophically contentious and legally dubious when competence persists.  
  - In Case 2, democratic legitimacy requires present self-governance. Entrenchment may be justified by *procedural values* (e.g., stability, anti-majoritarian rights protection), but this abandons precommitment logic. It becomes a *sovereign act* by a prior demos, constraining future demoi—a Lockean "social contract" model, not Ulyssean self-binding. If the new council represents a democratic shift, enforcing entrenchment overrides current popular will without precommitment’s normative shield.  

  **Structural Difference**: Case 1 is an *intrapersonal* conflict with a *third-party enforcer*, collapsing into interpersonal override if values diverge. Case 2 is *intergenerational collective* action, where constitutionalism replaces precommitment. Neither satisfies strict self-binding.  

  ---  

  ### Marking Scheme (20 marks total)  
  1. **Clear identification of authors/bound parties** (4 marks):  
     - Case 1: Woman (author) binds future self; brother binds present self.  
     - Case 2: Prior council binds future councils; charter binds new council.  
     *Deduct 2 marks if student conflates authors/enforcers or ignores the brother’s active role.*  
  2. **Analysis of author-bound identity** (4 marks):  
     - Must note Case 1’s *temporal self-division* despite legal continuity and Case 2’s *collective discontinuity*.  
     *Deduct 2 marks if student assumes the woman’s "same person" status negates conflict or claims councils are identical entities.*  
  3. **Regress problem addressed** (4 marks):  
     - Brother’s authority regresses to courts; charter’s authority regresses to state law/judiciary.  
     *Deduct 2 marks if student treats enforcers as final (e.g., "brother must obey directive" without regress).*  
  4. **Conditions for genuine precommitment applied** (4 marks):  
     - Must contrast *agency continuity* and *enforcer neutrality* across cases. Highlight brother’s non-neutrality and council’s collective discontinuity.  
     *Deduct 2 marks if student justifies Case 2 via majoritarianism ("new council can amend later") without engaging entrenchment.*  
  5. **Justification survival critique** (4 marks):  
     - Case 1: Rejects backward autonomy if values change; Case 2: Shifts to constitutionalism, abandoning precommitment.  
     *Deduct 2 marks if student argues advance directives are always binding via backward autonomy or that entrenchment is democratically invalid simply because a majority opposes it.*  

  ---  
  **Time Guidance**: Students should spend ~10 mins per case on (a)-(c), 15 mins on (d)-(e), and 5 mins on synthesis.
