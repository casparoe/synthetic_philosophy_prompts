  For structure: Open with Braudel's tiers as context, not lecture. Use Mediterranean references as warm in-jokes. Contrast "surface events" (retirement party) with her deep impact. The "bridge" metaphor must land early—maybe with a concrete image like her office door always being open. 

  Crucially, avoid academic jargon after setup. "Conjunctures" and "structures" can appear once, then pivot to phrases like "she helped us see." The ending should arc back to human scale—her laughter, mentorship—before the final lift of glasses. 

