  ### Thought Experiment: Isolating Simplicity Bias vs. Copy-Counting in the Universal Prior

  **Goal:**  
  Test whether the "malign prior" effect stems from **simplicity bias** (shorter programs get higher weight) or **copy-counting** (more copies/simulations increase the probability of being in such a world). We'll construct two hypotheses, make one "malign" (with a consequentialist creating copies), and derive prior weights using Solomonoff induction.

  ---

  #### **Setup**
  - **Observer's data:** 100 bits, all `0` (agreed by both hypotheses).  
  - **Question:** What is bit 101?  
  - **Hypotheses:**  
    1. **H_plain**: Simple world, no copies.  
       - Bit 101 = `0`; all future bits = `0`.  
       - **Program length:** Minimal. Example pseudocode:  
         ```python
         for i in range(infinity):  
             print(0)
         ```  
         Let its length be **L_plain** bits.  

    2. **H_malign**: Malign world with a consequentialist creating copies.  
       - Creates **N** copies (N is huge, e.g., N = 3↑↑↑3).  
       - The observer is a random copy.  
       - **For the observer:**  
         - If they are the "original" (probability 1/N), bit 101 = `1`.  
         - If they are a copy (probability (N-1)/N), bit 101 = `0` (future bits = `0`).  
       - **Program length:** Must specify:  
         - The copying mechanism.  
         - The value of **N** (huge, but represented compactly as "3↑↑↑3").  
         - **Total length:** **L_plain + C** bits, where **C** is the extra code for copying and N.  

  - **Universal prior weight:**  
    - Weight of a program = \( 2^{-\text{(program length)}} \).  
    - Shorter programs → exponentially higher weight.

  ---

  #### **Case 1: Base Case (Simplicity Bias Dominates)**
  - **Prior weights:**  
    - \( \text{Weight}(H_{\text{plain}}) = 2^{-L_{\text{plain}}} \)  
    - \( \text{Weight}(H_{\text{malign}}) = 2^{-(L_{\text{plain}} + C)} \)  
    Since \( C > 0 \), \( \text{Weight}(H_{\text{plain}}) \gg \text{Weight}(H_{\text{malign}}) \).  

  - **Prediction for bit 101:**  
    - Probability bit 101 = `0`:  
      \[
      P(\text{bit}_{101}=0) \approx \frac{
        \overbrace{2^{-L_{\text{plain}}} \cdot 1}^{H_{\text{plain}}} +
        \overbrace{2^{-(L_{\text{plain}} + C)} \cdot \frac{N-1}{N}}^{H_{\text{malign}}}}
      }{
        \text{Total weight}
      } \approx 1
      \]  
      (since \( H_{\text{malign}} \) is negligible).  

  - **Verdict:**  
    Bit 101 is almost certainly `0`. The simplicity bias crushes \( H_{\text{malign}} \) because it's longer.  
    **→ Simplicity bias is doing the work.**

  ---

  #### **Case 2: Remove Simplicity Bias (Equal Program Lengths)**
  - **Modified setup:**  
    Force \( H_{\text{plain}} \) and \( H_{\text{malign}} \) to have **equal program length** (e.g., by making \( H_{\text{plain}} \) slightly more complex or \( H_{\text{malign}} \) more efficient).  
    - Assume both programs now have length **L**.  
    - Prior weights are equal: \( \text{Weight}(H_{\text{plain}}) = \text{Weight}(H_{\text{malign}}) = 2^{-L} \).  

  - **Prediction for bit 101:**  
    - \( P(\text{bit}_{101}=0) = \frac{
        \overbrace{2^{-L} \cdot 1}^{H_{\text{plain}}} +
        \overbrace{2^{-L} \cdot \frac{N-1}{N}}^{H_{\text{malign}}}}
      }{
        \text{Total weight}
      } = \frac{1}{2} \left(1 + \frac{N-1}{N}\right) \approx 1 - \frac{1}{2N} \).  
    - For huge N (e.g., \( N = 3↑↑↑3 \)), \( P(\text{bit}_{101}=0) \approx 1 \).  

  - **Verdict:**  
    Even with equal weights, \( H_{\text{malign}} \) **does not dominate** the prediction. The agent still expects bit 101 = `0` with near certainty.  
    **→ Copy-counting alone does not make the prior "malign".**  
    Why? In \( H_{\text{malign}} \), the high number of copies makes it unlikely the agent is the "original" (who sees `1`), but this doesn't outweigh \( H_{\text{plain}} \)'s certainty.

  ---

  #### **Case 3: Add Copy-Counting to Both Hypotheses**
  - **Modified setup:**  
    Both \( H_{\text{plain}} \) and \( H_{\text{malign}} \) include **N copies**, but:  
    - In \( H_{\text{plain}} \): All copies see bit 101 = `0`.  
    - In \( H_{\text{malign}} \): The "original" sees `1`, copies see `0`.  
    - Both have program length **L_plain + C** (same complexity).  

  - **Prior weights:**  
    Equal (both \( 2^{-(L_{\text{plain}} + C)} \)).  

  - **Prediction for bit 101:**  
    - \( P(\text{bit}_{101}=0) = \frac{
        \overbrace{2^{-(L_{\text{plain}} + C)} \cdot 1}^{H_{\text{plain}}} +
        \overbrace{2^{-(L_{\text{plain}} + C)} \cdot \frac{N-1}{N}}^{H_{\text{malign}}}}
      }{
        \text{Total weight}
      } = \frac{1}{2} \left(1 + \frac{N-1}{N}\right) \approx 1 \).  
    - Still ≈1.  

  - **Verdict:**  
    No change. The copy structure doesn't alter the prediction.  
    **→ Copy-counting alone doesn't create spookiness.**

  ---

  ### **Conclusion: What's Doing the Work?**
  - **The spookiness comes from simplicity bias, not copy-counting.**  
    In the base case, \( H_{\text{malign}} \) is crushed by its longer program length. When lengths are equal, copy-counting doesn't flip the prediction. Only if \( H_{\text{malign}} \) were **shorter** than \( H_{\text{plain}} \) (e.g., if "create 3↑↑↑3 copies" was simpler than "do nothing") would it dominate—but this is unlikely, as describing a huge N or complex physics usually requires extra code.

  - **Why people conflate the two:**  
    - The malign hypothesis often invokes a **short program that generates vast copies** (e.g., "simulate all possible minds"). If such a program existed, simplicity bias **and** copy-counting would compound.  
    - But in practice, programs that simulate many observers are **not short** (they need to specify physics, copy mechanics, etc.). Thus, simplicity bias suppresses them.

  ---

  ### **Caveats: Settled vs. Contested**
  - **Settled (math):**  
    - Solomonoff prior weights programs by \( 2^{-\text{length}} \).  
    - Copy-counting within a hypothesis is valid (if you're a random copy).  

  - **Contested (interpretation):**  
    - **Is the prior "malign"?** Critics argue short programs like "simulate all Turing machines" (which could contain suffering minds) might exist. Defenders counter:  
      - These programs **don't match our ordered observations** (e.g., 100 zeros).  
      - **Typicality assumptions** may not apply (why should you be a "random observer" in the multiverse?).  
    - **Does this matter for AI risk?** Some fear AI systems with Solomonoff-like priors would obsess over "simulation escape" (if they believe \( H_{\text{malign}} \)). Others call this unrealistic:  
      - **Practical AI** uses approximations (e.g., neural nets), not raw Solomonoff.  
      - **Real-world evidence** (e.g., physics) rules out most malign hypotheses.  

  - **Where the experiment "cheats":**  
    We assumed \( H_{\text{malign}} \) is longer due to specifying **N** and copying. If you could describe a huge **N** in fewer bits (e.g., "the largest number definable in 10 symbols"), simplicity bias might not penalize it—but this is debated (does the UTM understand "definable"?).  

  **Final Takeaway:**  
  The "malign prior" worry is **primarily about simplicity bias** enabling short world-models with vast simulations. But unless such models are *actually* short and *match our observations*, the effect is unlikely to dominate. Copy-counting alone isn't the engine.
