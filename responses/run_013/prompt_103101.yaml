     - Introduce the idea of uncertainty: the decision maker has a prior belief (a probability distribution P over Ω). The expected utility of an action a is E[U(a, ω)] = Σ_ω P(ω) * U(a, ω). The optimal action without additional information is the one that maximizes this expected utility.

  3. **The Value of Information (10 minutes):**
     - Now, suppose the decision maker can observe a signal (or an experiment) that is correlated with ω. This signal comes from a set S. The signal is generated by a known conditional probability distribution P(s|ω). The decision maker can choose an action after seeing the signal. Thus, they will pick an action a(s) that maximizes the expected utility given the updated belief (via Bayes' theorem). The expected utility with the signal is then E[U(a(s), ω)] = Σ_s Σ_ω P(ω, s) * U(a(s), ω).
