answer: |-
  ### Teaching Plan: Nonnegative Expected Value of Information  
  **Target Audience:** Humanities scholars; intuitive, no math beyond basic probability.  
  **Time:** 40 minutes.  
  **Core Insight:** Free information can't hurt in expectation because you can always ignore it and act as you would have without it.  

  ---

  ### **Sequence & Rationale**  
  1. **Decision Problems (5 min)**  
     - **Why start here?** Foundation for "value." Define:  
       - *Actions* (e.g., carry an umbrella or not).  
       - *States* (e.g., rain or shine).  
       - *Consequences* (e.g., dry but burdened, or wet).  
     - **Key:** Without decisions, information has no "value."  

  2. **Expected Utility (EU) (5 min)**  
     - **Why next?** Quantifies rational choice under uncertainty.  
       - Assign utilities to consequences (e.g., dry = 10, wet = 0, burdened = 8).  
       - EU(action) = Σ [P(state) × utility(action, state)].  
     - **Example:**  
       - P(rain) = 0.4.  
       - EU(umbrella) = 8 (always burdened).  
       - EU(no umbrella) = (0.4×0) + (0.6×10) = 6.  
       - Optimal action: Carry umbrella (EU=8).  

  3. **Information as a Signal (5 min)**  
     - **Why?** Introduces learning.  
       - Signal (e.g., weather forecast) updates beliefs via Bayes’ theorem.  
       - New EU: Choose *best action given signal*.  

  4. **The Theorem (5 min)**  
     - **Statement:** Expected EU(with signal) ≥ EU(without signal).  
     - **Proof sketch:** You can ignore the signal and take your original optimal action → EU ≥ baseline.  

  ---

  ### **Central Example: The Investment Dilemma** (10 min)  
  **Setup:**  
  - You invest $100. Choose:  
    - *Safe stock*: Always grows to $110.  
    - *Risky stock*: Grows to $200 if economy booms (P=0.5), crashes to $50 if bust (P=0.5).  
  - **Without information:**  
    - EU(safe) = 110.  
    - EU(risky) = (0.5×200) + (0.5×50) = **125** → Choose risky.  

  - **With (free, imperfect) information:**  
    - Signal (e.g., expert tip) predicts boom/bust with 60% accuracy.  
    - *If signal says "boom":*  
      - P(actual boom | "boom") = 0.6 → EU(risky) = (0.6×200) + (0.4×50) = 140.  
      - EU(safe) = 110 → Choose risky.  
    - *If signal says "bust":*  
      - P(actual bust | "bust") = 0.6 → EU(risky) = (0.6×50) + (0.4×200) = 110.  
      - EU(safe) = 110 → Indifferent; choose safe (arbitrary).  
    - **Expected EU(with signal):**  
      - P("boom") = 0.5 → EU=140; P("bust")=0.5 → EU=110.  
      - Average: (0.5×140) + (0.5×110) = **125** (same as before!).  

  **Why it feels harmful:**  
  - If signal says "bust" and you switch to safe, but the economy booms, you get $110 instead of $200 → regret!  
  - **Why nonnegativity holds:**  
    - Ignoring the signal (always choose risky) gives EU=125.  
    - With signal, you get 125 (≥125) → no loss.  
    - *(Accurate information would yield EU=150, improving outcomes.)*  

  ---

  ### **Misconceptions Table**  
  | Misconception | When to Address | Counterargument |
  |---------------|----------------|----------------|
  | "Information is always good (in every outcome)." | After the example. | **Clarify:** Information can cause regret in *specific cases* (e.g., misleading "bust" signal). But *on average*, EU doesn’t decrease. |
  | "You need commitment to ignore information." | During theorem explanation. | **Emphasize:** Actions are always optional. If the signal is misleading, choose your original action (no commitment needed). |
  | "What if information causes regret/ostrich effect?" | During Q&A or after example. | **Boundary:** Regret is psychological; the theorem assumes rational EU maximization. Refuse to dive into behavioral economics. |
  | "What if information costs money?" | When defining "free information." | **Clarify:** Nonnegativity holds only for *free* info. Costly info can have net negative value. |

  ---

  ### **Closing Question to Assess Understanding**  
  *"If a clairvoyant offers you a free, 100% accurate prediction about a decision, could it ever be rational to refuse it? Why or why not?"*  
  - **Expected Answer:** No. You can ignore it and do what you’d have done anyway, so you’re never worse off—and might gain.  

  ---

  ### **What to Exclude**  
  - **No adversarial setups** (e.g., game theory where others react to your info).  
  - **No behavioral deviations** (e.g., ostrich effect, loss aversion).  
  - **No math derivations** (stick to intuition and examples).  

  **Why this order?** Builds from foundations (decisions → value → learning) and uses a relatable example where information *feels* harmful but isn’t in expectation. This exposes the paradox cleanly.
