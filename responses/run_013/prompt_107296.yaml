prompt: |-
  I have no academic training in philosophy, but for a few years I have been circling a pattern in my own thinking and in arguments I overhear, and I have never found a name for it. I would like to know whether one exists, and if it does not, what a careful definition would have to look like.

  The shape of it is this. Sometimes a consideration seems to count in favor of an attitude — a belief, an emotion, a desire — but counts in a way that strikes me as the wrong way, and I cannot say precisely why. Suppose a stranger offered me a large sum of money to believe that some country's population is under ten million. The offer does seem to give me *something* — at minimum a reason to want to hold that belief, or to take steps that might bring it about — and yet if I ended up believing it because of the offer, I would feel there was something defective about my belief, even if the belief happened to be true and well supported. The money bears on how good it would be for me to hold the belief, not on whether the belief is the one the evidence supports. I notice the same shape when someone threatens me unless I admire them, or when a colleague tells me I should be angry about a slight and the reason offered is not that the slight was grave but that my anger will help me negotiate a better settlement.

  Two complications keep me from being sure this is one thing rather than several. First, in some cases the consideration seems to reach the attitude only sideways, through a side effect: I have no evidence either way about whether I will finish a difficult project, but I am told that believing I will finish makes it more likely, and so the practical reason appears to be the only reason available for the belief. I cannot tell whether that is the same phenomenon or something else wearing its clothes. Second, in some cases the consideration is not merely available but seems to be the *only* thing there is to go on, and I do not know whether "wrong kind" is a verdict about the reason itself, about the attitude it is aimed at, or about what a person would be doing if they formed the attitude on that basis — whether they would be responding to the consideration or merely exploiting it.

  What I want from you is not a label. I want the boundary drawn. Does the pattern have an established name? If it does, I want to know how it is standardly defined, and — more useful to me — which of my cases fall inside it and which fall outside, and on what principle. If it does not have a name, I would like you to coin one and define it, with the cases at the edges used to fix where the line goes: the self-fulfilling belief, the case where no other reason is available, the case where the consideration is a genuine reason for something else (a reason to want the attitude, or to try to acquire it) rather than for the attitude itself. I have run across phrases like reasons to want to have a belief, the fittingness of an emotion, and the idea that reasons for attitudes differ in kind from reasons for actions, but I do not know whether any of these is the thing I am describing or merely a neighbor of it, and I would like that sorted out rather than gestured at.

  Please also separate what is settled in this area from what is genuinely contested among people who know it, and do not present a contested view as the consensus.
reasoning: |-
  Okay, the user presents a nuanced philosophical problem they've been grappling with for years. They've observed a pattern where certain considerations seem like reasons for attitudes (beliefs, emotions, desires) but feel "wrong" somehow. The money-for-belief example is particularly vivid - it clearly provides practical motivation but feels corrupting if actually used to form the belief. 

  What makes this intellectually thorny are the edge cases they mention: self-fulfilling beliefs where practical reasons might functionally support truth, and situations where only practical reasons exist. Their core request is for conceptual mapping - not just a label but rigorous boundaries. They're clearly well-read (mentioning fittingness attitudes and reason-kinds) but want clarification on how these relate to their observation.

  The philosophical depth here is impressive for someone without formal training. They recognize key distinctions in meta-ethics and epistemology: between state-given and object-given reasons, between reasons for having attitudes versus reasons within attitudes. Their examples perfectly illustrate why this remains contested in academic philosophy.

  What they might not realize is how beautifully their cases trace the fault lines in the debate. The self-fulfilling belief example challenges the "no necessary connection" thesis, while the "only reason available" scenario tests whether practical reasons can ever properly justify attitudes. Their intuition about the colleague's anger advice reveals the attitude-specific nature of fittingness.

  The real service here is disentangling three layers: 1) the settled distinction between practical and normative reasons for attitudes, 2) the ongoing debate about whether "wrong kind" reasons are actually reasons at all, and 3) how edge cases reveal unresolved tensions. Their phrasing about "reaching the attitude sideways" is particularly astute - that's essentially the state/object distinction in lay terms.

  I should emphasize where academic consensus exists (e.g., the wrong kind of reason problem is universally acknowledged) versus where philosophers genuinely disagree (e.g., whether pragmatic belief formation is always irrational). Their request for demarcation is spot-on - the boundaries are precisely what philosophers like Schroeder and Hieronymi debate. The cases they find problematic are the same ones that generate technical literature.
answer: |-
  Your inquiry precisely identifies a profound and actively debated distinction in contemporary philosophy: the **Wrong Kind of Reasons (WKR) Problem**. This problem centers on differentiating between reasons that are genuinely *normative* for an attitude (e.g., belief, emotion, desire) versus reasons that seem relevant but are the "wrong kind" for directly justifying that attitude. Below is a systematic analysis addressing your core concerns.

  ### I. The Established Core: Wrong Kind of Reasons (WKR)
  *   **Definition:** A reason is of the "wrong kind" if it bears on the *desirability*, *usefulness*, or *consequences* of *having* an attitude, rather than on the *object* or *content* of that attitude itself.
  *   **Contrast with Right Kind of Reasons (RKR):** RKRs bear directly on whether the attitude *fits* its object or is *correct* given the facts.
  *   **Consensus View:**
      *   The WKR problem is genuine and distinct.
      *   RKRs are constitutively tied to the nature of the attitude. For belief, RKRs are *evidence* (bearing on truth). For admiration, RKRs are *admirable qualities* in the object. For anger, RKRs are *offenses/wrongs*.
      *   WKRs are typically *practical incentives* or *disincentives* for *holding* the attitude, not for the attitude's correctness.

  ### II. Applying the Core to Your Cases
  1.  **Money for Belief (Core WKR):**
      *   **Reason Offered:** Large sum of money.
      *   **Attitude:** Belief that a country's population is <10 million.
      *   **Analysis:** The money is a WKR. It concerns the *benefit of having the belief*, not evidence about population size. Forming the belief based *only* on the money is defective because beliefs aim at truth; practical benefits are irrelevant to truth-tracking.

  2.  **Threat for Admiration (Core WKR):**
      *   **Reason Offered:** Threat of harm.
      *   **Attitude:** Admiration for the threatener.
      *   **Analysis:** The threat is a WKR. It concerns the *cost of not admiring*, not qualities making the person admirable. Admiration requires perceiving excellence; fear of consequences doesn't constitute excellence.

  3.  **Anger for Negotiation (Core WKR):**
      *   **Reason Offered:** Anger will lead to a better settlement.
      *   **Attitude:** Anger about a slight.
      *   **Analysis:** The negotiation benefit is a WKR. It concerns the *utility of feeling anger*, not the *gravity or offensiveness of the slight itself*. Anger is fitting only if a wrong occurred; instrumental utility doesn't make a slight wrongful.

  ### III. Addressing Your Complications: Boundary Cases

  1.  **The Self-Fulfilling Belief Case (Believing to Succeed):**
      *   **Scenario:** You have no evidence about finishing a project, but believing you'll finish makes success more likely. The practical benefit (success) seems like the only reason for belief.
      *   **Analysis & Boundary:**
          *   **Is it WKR?** **Yes, primarily.** The reason (increased chance of success) is still practical and outcome-oriented. It concerns the *consequence of holding the belief*, not evidence about project completion.
          *   **The Complication:** This case *appears* to link the WKR to truth. If believing causes success, doesn't that make the belief true? However, the reason *itself* isn't evidence about the project's completion *prior* to forming the belief. Forming the belief *because* it causes success is distinct from forming it *because* you have evidence success is likely *anyway*.
          *   **Boundary Principle:** The *reason for adopting* the attitude is key. If the reason cites a *causal consequence of holding it*, rather than *facts about the belief's object* (the project's inherent difficulty, your skills, etc.), it remains a WKR. The self-fulfilling potential is a *side-effect* of acting on the WKR; it doesn't transform the reason into an RKR. Your intuition that it might be "something else wearing its clothes" is astute – it's a WKR leveraging a psychological quirk.

  2.  **The "Only Reason Available" Case:**
      *   **Scenario:** A consideration seems like the *only* reason available for an attitude. Is it automatically an RKR? Or is it still the "wrong kind"?
      *   **Analysis & Boundary:**
          *   **Consensus:** A reason being the *only available* reason does **not** automatically make it the *right kind* of reason. Its *nature* determines its kind.
          *   **Example:** Stuck on a desert island, a demon offers food only if you admire it. Admiration is essential for survival. The reason (survival) is *still* a WKR for admiration. It concerns the *value of having admiration*, not qualities making the demon admirable. You might *want* to admire it, or *try* to generate admiration, but you cannot *directly* admire it *for the sake of survival* – that's not what admiration *is*. The attitude remains unfitting.
          *   **Boundary Principle:** The verdict is about **whether the reason bears on the attitude's constitutive standard (fitness, correctness) or not.** If it doesn't (like survival), it's the wrong kind, regardless of necessity or availability. The "wrongness" resides in the *reason's failure to engage with the attitude's internal logic*. A person forming the attitude solely on a WKR isn't genuinely *responding* to the reason *as a reason for that attitude*; they are manipulating their own psychology *because* of the reason.

  ### IV. Coining a Term (If Needed) & Clarifying Neighbors
  *   **Established Name:** "Wrong Kind of Reasons" (WKR) / "State-Given Reasons" (vs. "Object-Given Reasons" for RKRs) are standard terms. You don't need a new one.
  *   **Clarifying Neighbors:**
      *   **Reasons to Want/Have an Attitude:** These are **WKRs**. Wanting to believe X for money is distinct from believing X based on evidence.
      *   **Fittingness:** This is the **standard RKRs track**. An emotion is *fitting* if its object warrants it (e.g., anger is fitting if a wrong occurred). WKRs are irrelevant to fittingness.
      *   **Reasons for Attitudes vs. Actions:** This is **foundational**. Actions are justified by practical reasons (goals, consequences). Attitudes (beliefs, emotions) have their own constitutive aims (truth, fittingness) justifying them internally. WKRs treat attitudes *like actions* to be performed for consequences – hence the "wrongness".

  ### V. Settled vs. Contested
  *   **Settled:**
      1.  The WKR problem is real and distinct. Not all considerations relevant to *having* an attitude are reasons *for* that attitude.
      2.  RKRs are defined by their connection to the attitude's constitutive aim/standard.
      3.  WKRs are typically pragmatic incentives/consequences for holding the attitude.
      4.  Forming an attitude *solely* based on WKRs is rationally defective *as that attitude* (even if instrumentally useful).
      5.  WKRs *can* be genuine reasons for *other* things (e.g., wanting the attitude, trying to induce it).
  *   **Genuinely Contested:**
      1.  **Can WKRs *Ever* Be Direct Reasons for Attitudes?** Most say *no*. A significant minority argue that in extreme cases (like the demon survival case), WKRs *can* directly justify attitudes (*Pragmatist/Consequentialist View* – controversial).
      2.  **The Best Analysis of the Distinction:** Multiple competing theories exist:
          *   **Constitutive Aim/Standard:** (Most Common) Belief aims at truth; reasons must bear on truth. Emotions have correctness conditions.
          *   **Non-Transferability:** RKRs cannot be shared with the attitude of *being indifferent* to the attitude, while WKRs can.
          *   **Reasons as Evidence:** RKRs are evidence the attitude is fitting/correct; WKRs are not.
      3.  **Self-Fulfilling Beliefs:** Is believing P *because* it makes P true ever rational *as belief*? Consensus leans *no* (it's wishful thinking exploiting a causal loop), but arguments exist that the resulting truth *could* provide a derivative justification.
      4.  **Scope:** How widely does the distinction apply? Belief and emotion are clearest. Is there a WKR problem for *intentions* or *desires*? Less clear, more debated.

  ### VI. Conclusion: Your Pattern Defined
  You have accurately identified the **Wrong Kind of Reasons Problem**. The core principle is:

  *   **A reason is of the WRONG KIND for an attitude if it bears on the *value or consequences of HAVING that attitude*, rather than on the *properties of the OBJECT that make the attitude FITTING or CORRECT*.**

  **Your Cases:**
  *   Money for belief, Threat for admiration, Anger for negotiation: **Clear WKR.**
  *   Self-fulfilling belief: **Primarily WKR** (reason cites consequence of holding, not object properties).
  *   "Only reason available" (e.g., survival for admiration): **Still WKR** (reason's nature, not availability, determines kind).

  The "wrongness" stems from a **category error**: treating an attitude (governed by internal standards like truth/fittingness) as if it were an action (governed by practical consequences). The boundary is fixed by asking: **"Does this reason speak to *why* the attitude is correct/fitting regarding its object, or does it speak to *why it's good/bad to have* the attitude?"** Only the former provides the Right Kind of Reason.
