prompt: |-
  I convene a fortnightly reading group for graduate students in philosophy of science and metaphysics — a dozen people, ninety minutes, one seminar room, a whiteboard, no budget, and no set reading for the session — and I want a single activity that makes them feel the problem of identifying what a system really contains when the information that would settle the question is inaccessible in principle rather than merely out of reach. Our discussions keep collapsing into two lines that both feel too cheap to have earned: someone says the hidden facts are just unobservable and we should be instrumentalists about them, someone else says that of course there is a fact of the matter even if we can never get at it, and nobody is made to pay a price for either move. What I want the session to produce is the felt difference between two situations that talk tends to run together — a box we cannot open yet, where a better instrument would settle everything, and a case in which no further observation exists to be had, because the complete record of what any possible observer could ever register has already been handed to us and the only remaining question is what is left to disagree about. Design it so that this distinction arrives through what the participants do, not through anything I announce before or during the activity.

  Concretely, I would like the group to end up having committed, in writing, to an inventory of what a hidden system contains, and then to have that commitment embarrassed by a second system that differs from the first in what it contains while agreeing with it on every entry of a record I have stipulated to be exhaustive; and I want at least one candidate inventory on the table whose extra element is stipulated to be causally inert with respect to everything in that record, so that the group is forced to say aloud whether the element exists and on what grounds. I care less about a puzzle they can crack by cleverness than about one that forces a decision about what could count as evidence at all, and about whether a difference that makes no difference to any possible observation is a difference. Give me the whole thing: the setup and materials (assume only paper, pens, a whiteboard, and whatever I can carry in), the rules, any roles, the sequence with timings that fits ninety minutes, and a debrief that maps each moment onto the part of the problem it is meant to make vivid — the underdetermination of what exists by what is observable, the temptation to treat a relabeling of one structure as a rival ontology, and the several responses available when the record runs out (deny that the residual question means anything, insist it has an answer that no evidence could reach, or redescribe both inventories as one structure under two descriptions). Tell me what will predictably go wrong the first time I run it — where the group will game the rules, where the stipulation that the record is complete will be quietly ignored, which participant will derail it — and be candid about the feature of the problem the activity cannot reproduce, given that a real investigator never gets to know the record is complete. Close by naming the design choice you are least confident in, saying where your reasoning about how the group will actually behave is most likely to fail, and telling me what you would have to see in the room, or what argument I could give you, to conclude that the activity's central mapping is wrong.
reasoning: |-
  We are designing an activity for a graduate reading group in philosophy of science and metaphysics. The goal is to make participants feel the problem of underdetermination when the information to settle what a system contains is inaccessible in principle. We want to avoid the two cheap moves: instrumentalism about hidden facts versus realism that doesn't pay a price.

  Key elements:
  - We want participants to commit in writing to an inventory of what a hidden system contains.
  - Then, embarrass that commitment by showing a second system that has a different inventory but agrees on every entry of an exhaustive record.
  - We want at least one candidate inventory that includes an extra element that is causally inert with respect to the record, forcing a discussion about its existence.

  The activity should highlight:
  1. The difference between a box we cannot open yet (merely out of reach) and a case where no further observation is possible (in principle inaccessible).
  2. The underdetermination of ontology by observable data.
  3. The temptation to treat a relabeling as a rival ontology.
  4. The responses: eliminativism (deny the residual question), realism (insist there is a fact), or structuralism (redescribe as one structure under two descriptions).

  Constraints:
  - 90 minutes total.
  - Materials: paper, pens, whiteboard, and whatever the facilitator can carry in.
  - No set reading for the session.

  Structure:
  1. Setup (10 minutes): Introduce the scenario without giving away the philosophical point.
  2. Activity Part 1: Building the record (20 minutes)
  3. Activity Part 2: Committing to an inventory (20 minutes)
  4. Activity Part 3: Revealing the underdetermination (20 minutes)
  5. Debrief (20 minutes)

  Total: 90 minutes.

  The scenario: We'll use a modified version of the "black box" thought experiment. We have two systems (System A and System B) that are hidden from view. The only thing we have is an exhaustive record of all possible observations that could ever be made on the system. The record is the same for both systems, but the systems are internally different.

  To make it concrete, we can use a simple physical system. Let's use a variant of the two-slit experiment or a quantum-like scenario, but simplified to avoid technicalities. Alternatively, we can use a more abstract system.

  I propose a system that produces sequences of symbols (like a machine with buttons and lights) and the record is the complete set of input-output pairs for all possible inputs. The hidden part is the internal mechanism that produces the outputs.

  But we want to force the issue of an extra causally inert element. So let's design a system that can be implemented in two ways:

  Option 1: A system with three states and two buttons. The record is the transition table for all button presses and the resulting state (which is observable only through a light that shows the state). But one system has an extra component that does nothing.

  Option 2: A system that produces a sequence of numbers. The record is the entire sequence for all time. But two different systems produce the same sequence: one with a simple rule and one with a more complex rule that includes an extra element that doesn't affect the output.

  We want the record to be exhaustive of all possible observations. So let's go with a finite automaton that responds to a set of inputs and produces outputs. The record is the complete input-output history for all possible input sequences. But note: if the system is finite-state and we have a finite set of inputs, the record is finite? But we want the record to be exhaustive in principle, so we can stipulate that it includes all possible finite sequences of inputs and the resulting outputs.

  But to keep it manageable in 90 minutes, we must make the system very simple.

  I propose:

  System X: A black box with two buttons, A and B, and a display that shows either 0 or 1. The box has an internal state that is not visible. The record is the complete set of all possible sequences of button presses and the resulting sequence of outputs (the display after each press). We stipulate that the record is fixed and is the same for two different internal mechanisms.

  We design two mechanisms:

  Mechanism 1 (Simple):
  - Internal state: either ON or OFF (binary state)
  - Button A: toggles the state (if ON, becomes OFF and vice versa) and the display shows the state (so if state is ON, display 1; OFF, display 0).
  - Button B: same as button A (toggles the state and shows it).

  But then the behavior is deterministic and symmetric. The record would be the same for any starting state? Actually, the starting state matters. We must fix the starting state. But the record must be the same for both systems. So we need two different mechanisms that produce the same input-output behavior.

  Let me design two mechanisms that are behaviorally equivalent but structurally different.

  Mechanism 1:
  - States: {0, 1}
  - Start state: 0
  - Button A: from state 0 -> 1 (output 1); from state 1 -> 0 (output 0)
  - Button B: same as A.

  So the system just toggles on every press, regardless of which button.

  Mechanism 2:
  - States: {0, 1, 2} (three states)
  - Start state: 0
  - Button A: 
     - from 0: go to 1, output 1
     - from 1: go to 0, output 0
     - from 2: go to 2, output 0 (or 1? we need to match the record)
  - Button B: 
     - from 0: go to 2, output 0
     - from 1: go to 1, output 1 (unchanged)
     - from 2: go to 0, output 0

  This is getting messy. We need the two systems to produce the same outputs for every sequence of inputs.

  Alternatively, we can use a system that produces a fixed sequence. But we want interaction.

  A simpler idea: a system that has an internal counter but one version has an extra gear that doesn't move.

  But let's make it abstract.

  I found a classic example: a vending machine that can be modeled with two states or three states but behaves the same. But that's for finite inputs.

  Another idea: use a system that computes the parity of the number of button presses. But that can be done with one bit (two states). How to add an extra inert element?

  We can have:

  Mechanism 1 (Two states):
  - State: even or odd (0 or 1)
  - Start: even (0)
  - Press A: flip state, output the new state (so 1 for odd, 0 for even)
  - Press B: same as A.

  But then the output is always the current parity.

  Mechanism 2 (Three states, with an inert state):
  - States: {0, 1, 2} (0=even, 1=odd, 2=inert)
  - Start: 0
  - Press A: 
     - if in 0: go to 1, output 1
     - if in 1: go to 0, output 0
     - if in 2: stay in 2, output 0 (or 1? we need to match the output of mechanism 1 when in state 2? But in mechanism 1, we never have a state that always outputs 0 regardless of input. So we must design so that in mechanism 2, the inert state is never reached? Then it's not doing anything.

  We need the inert state to be reachable? But then the behavior would differ.

  The challenge: we want two systems that are behaviorally identical (same outputs for all input sequences) but one has an extra inert part.

  Solution: the inert part is never activated by any input. So it exists but does nothing and is not observable.

  For example:

  Mechanism 1 (Two states):
  - As above.

  Mechanism 2:
  - States: {0, 1} and an extra component that is a toggle switch that is never flipped by any button. It starts in position X and stays there. It has no effect on the output. So the active part is identical to mechanism 1.

  But then the inventory for mechanism 1: two states and the transition rules.
  For mechanism 2: two states (with the same rules) and an extra toggle switch that is fixed.

  The record is the same because the extra toggle switch never changes and never affects the output.

  Now, we want to force participants to commit to an inventory.

  Activity Design:

  Materials:
  - Handout 1: Describes the system and the record. It says: "We have a black box. It has two buttons, A and B, and a display that shows 0 or 1. We have performed every possible experiment: we have pressed every possible sequence of buttons (from the empty sequence to sequences of arbitrary length) and recorded the output after each press. The record is complete and exhaustive: it contains the output for every possible sequence of inputs. You are given the record for one such box. Your task is to propose what is inside the box. Specifically, provide an inventory of the components and their states, and the rules by which the system operates. Note: the record is fixed and is the same for every box we consider."

  But we don't give the actual record? We need to provide a record. But we don't want them to have to compute. So we provide a partial record and then stipulate that the full record is consistent with two interpretations.

  Alternatively, we can give them the complete record in a compact form: a state transition table that is minimal. But then they might just give the minimal machine.

  We want them to propose an inventory. We can give a very simple record that can be modeled in two ways.

  Let me create a concrete record:

  Suppose the behavior is that of a simple toggle: every press (whether A or B) toggles the output.

  So:
  - Start: output 0 (without any press)
  - Press A: output 1
  - Press A again: output 0
  - Press B: output 1 (if current is 0) or 0 (if current is 1) - same as A.

  So the record: for any sequence, the output after the sequence is 1 if the number of presses is odd, 0 if even.

  Now, we can model this with:
  Model 1: one state variable (a bit) that flips on every press.

  Model 2: two state variables: a bit that flips on every press and an extra bit that is always 0 and never changes (causally inert).

  The record doesn't show the extra bit because it never changes and doesn't affect the output.

  But is the extra bit part of the system? We want to force this.

  We can also have a model with more states that are redundant. But the inert component is clearer.

  Activity Steps:

  1. Introduction (10 minutes):
     - Facilitator: "Today we are going to play the role of scientists trying to reverse-engineer a black box. We have a device that has two buttons, A and B, and a display that shows 0 or 1. We have been given a complete and exhaustive record of every possible experiment: for every finite sequence of button presses, the output that the display shows after each press in the sequence. This record is fixed and is the same for all the devices we consider. Your task is to propose an inventory of what is inside the box. What components are there, what states can they be in, and how do they interact? We are going to work in small groups to come up with one or more candidate inventories."

     - Break into groups of 3-4. There are a dozen people, so 3 or 4 groups.

     - Hand out the record. We must provide the record in a usable form. Since the record is infinite in size, we must give a finite description. We can say: "The behavior is simple: the output toggles (from 0 to 1 or 1 to 0) every time any button is pressed, regardless of which button. The initial state (with no presses) is 0."

     - So we write on the board:
          Initial: 0
          After any single press: 1
          After two presses: 0
          After three: 1, etc.

     - Also, the order of buttons doesn't matter: pressing A then B gives the same as B then A? Actually, in this case, it does: because it's just the parity. So we can say: the output depends only on the number of presses (mod 2).

     - We can write the rule: "The output after a sequence of n presses is n mod 2 (with initial 0)."

     - So the record is: for every n (number of presses), the output is n mod 2.

  2. Part 1: Building candidate inventories (20 minutes)
     - Groups work to come up with one or more candidate inventories. They must write down a description of the internal mechanism that produces this behavior.

     - Expected proposals:
          a) A single toggle switch: one state bit that starts at 0 and flips on every press (of either button).
          b) A two-bit system: one bit that is the active state (toggling) and one bit that is fixed at 0 and does nothing.
          c) Maybe a system with a counter that counts modulo 2.

     - The facilitator circulates and may prompt: "Could there be more than one component? Could there be an extra component that doesn't do anything?"

     - After 15 minutes, each group writes their candidate inventory on the board. We expect at least one group to propose a model with an inert component.

  3. Part 2: Committing to an inventory (10 minutes)
     - Now, the facilitator says: "We are going to assume that the record is complete and exhaustive. There is no further observation to be made. We must choose one inventory as the true one. Each group must now commit to one candidate and write it down on a card, with the understanding that this is what they believe is really inside the box."

     - Groups choose one and write it on a card. They hand it in.

  4. Part 3: Revealing the underdetermination (20 minutes)
     - The facilitator now reveals: "I have two boxes here. One is built according to the minimal inventory (one toggle switch). The other is built with an extra component: a switch that is set to 0 and never changes, and it is not connected to anything. Both boxes, when operated, produce exactly the same record. In fact, they are indistinguishable by any possible observation."

     - We can show two physical boxes? But we don't have them. So we describe them.

     - Alternatively, we can have two diagrams on the board.

     - Diagram for System 1: a single flip-flop, with both buttons connected to the toggle input.

     - Diagram for System 2: the same flip-flop, and an extra toggle switch that is set to 0 and not connected to anything.

     - The facilitator then asks: "What is the inventory of System 1? [Read one group's minimal inventory.] What is the inventory of System 2? [Read a group's inventory that includes the inert part, or if none, propose it.]"

     - Then: "Both systems produce the same record. So which one is the one we have? How do we know?"

     - The key: the record is complete and exhaustive. There is no further observation that could tell them apart.

     - Now, the facilitator asks each group to discuss: "Does the extra component in System 2 exist? Why or why not? What does it mean that we cannot observe it? Is there a fact of the matter?"

     - Then, open the floor for discussion.

  5. Debrief (20 minutes)
     - Map the activity to the philosophical problem:
          - The record is analogous to the complete set of observable data in principle.
          - The two systems represent two different ontologies that are empirically equivalent.
          - The extra inert component represents a hidden fact that is causally isolated.
          - The group was forced to commit to an inventory, and then that commitment was embarrassed by the existence of an alternative that fits the same data.

     - Highlight the difference between:
          a) A box we cannot open yet: if we had a better instrument, we might see the extra component. But in this case, we have stipulated that the record is complete and there is no such instrument. The extra component is not detectable by any possible observation.
          b) The question: what does it mean to say the extra component exists or not?

     - Discuss the three responses:
          i) Eliminativism: the question of the inert component is meaningless because it has no observational consequences. So we should only say what is necessary for the observations.
          ii) Realism: there is a fact of the matter, even if we cannot know it. The system either has the inert part or not.
          iii) Structuralism: the two systems are just two descriptions of the same structure. The inert component is a redundant part of the description.

     - Point out that the activity forced them to confront a difference that makes no difference to any possible observation.

     - Also, note the temptation to treat the two systems as rival ontologies, but they might be just different ways to describe the same thing.

     - Finally, relate back to the reading group's recurring discussion: how this moves beyond the cheap instrumentalism vs realism by showing that realism must account for underdetermination.

  Predictable problems:
  - The group might not propose an inventory with an inert component. Solution: the facilitator can suggest it during Part 1, or have a prepared example.
  - The stipulation that the record is complete might be ignored: participants might say "we could open the box" or "we could use an electron microscope". But the activity stipulates that the record is complete and no further observation is possible. The facilitator must enforce this: "In this thought experiment, we are given that the record is exhaustive of all possible observations. There is no opening the box; the box is defined by its input-output behavior."
  - Which participant will derail? Probably the one who insists on realism and says "but in reality, there is a fact". Then we can press: what evidence could bear on it? If they say "we can open the box", remind them that in this scenario, the record is complete and there is no opening the box. The box is only accessible via the buttons and display. The internal structure is not observable by any means.
  - Another derail: they might argue that the extra component is not part of the system because it doesn't do anything. Then we have a discussion about what counts as part of the system.

  What the activity cannot reproduce:
  - In real science, we never know that the record is complete. There is always the possibility of new kinds of observations. The activity relies on stipulating that completeness, which is artificial. But the point is to isolate the problem of underdetermination in principle.

  Design choice I am least confident in:
  - Using a system with an inert component that is never activated. It might be too easy to dismiss as "not part of the system" because it's causally isolated. But that is the point: to force the question of whether such a thing exists.

  Where my reasoning about group behavior might fail:
  - I assume that groups will propose at least one model with an inert component. But they might all stick to the minimal model. Then we don't have the embarrassment. So we need a backup: the facilitator can introduce the two models.

  What would make me conclude the central mapping is wrong?
  - If the group consistently says that the two systems are the same system and the difference is only in the description, then the activity might be too easily resolved by structuralism. But that is one valid response. We want to elicit that.
  - If they don't feel the embarrassment, because they treat the commitment as provisional, then the activity might not work. We need to stress the commitment.

  Revised plan to ensure the inert component is proposed:

  In Part 1, when the groups are working, the facilitator can give a hint to one group: "Could there be an extra component that doesn't affect the behavior? How would we know?"

  Or, we can have a prepared handout that describes two models, but that might be leading.

  Alternatively, we can run the activity without the groups, but with the whole group. But then we lose the commitment.

  I think it's better to have the groups and have the facilitator prime one group with the inert component idea.

  Final Timing:

  - 0-10 min: Introduction and setup
  - 10-30 min: Group work on inventories (20 min)
  - 30-40 min: Commit to one inventory in writing (10 min)
  - 40-60 min: Reveal the two systems and discuss (20 min)
  - 60-80 min: Debrief and map to philosophy (20 min)

  But 80 minutes? We have 90.

  Adjust:

  - 0-10: Intro
  - 10-30: Group work (20 min)
  - 30-35: Commit (5 min)
  - 35-55: Reveal and discuss (20 min) [but we might need more time for discussion]
  - 55-75: Debrief (20 min)
  - 75-90: Open discussion (15 min) or extend the debrief.

  Alternatively, cut the group work to 15 minutes.

  Given the complexity, let's go with:

  - 0-10: Introduction
  - 10-25: Group work (15 min) [they are graduate students, so they can work fast]
  - 25-30: Commit (5 min)
  - 30-50: Reveal and discuss (20 min)
  - 50-70: Debrief (20 min)
  - 70-90: General discussion and relating to readings (20 min)

  But the first discussion (reveal and discuss) might run over.

  We'll see.

  Materials:
  - Handout: a sheet that describes the system and the record. It says: "The black box has two buttons, A and B, and a display that shows 0 or 1. The record of all possible observations is: the output after any sequence of n presses (of either A or B) is n mod 2 (with initial state 0 before any presses)."
  - Pens and paper for groups.
  - Cards for committing.

  Facilitator carries: handouts, pens, paper, cards, and a whiteboard marker.

  Diagrams for the two systems (drawn on the board during the reveal).

