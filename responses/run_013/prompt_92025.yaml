prompt: |-
  Say you've got a pot of money to fund about two philosophers for a year to work on whether neural networks really have representations — realism about interpetability, roughly, rather than building tools. Which open questions should they actually spend the year on, and in what order? I care much more about the reasoning than the list: which questions are upstream of the others, which are tractable for people who can talk to a mech-interp team but won't be training models themselves, and which look deep but wouldn't change much downstream.

  One thing I'd like you to weigh up properly. Someone in our group reckons the whole debate only gets tractable once you split "the network represents X" into a storage claim (the weights encode X in some recoverable way) and a use claim (the network's computation actually runs through X), and argues that only the use claim matters for whether an interpretability finding is real. Is that the right cut, or does it just relabel the same problem? If it's right, which open questions does it dissolve and which does it leave completely untouched?

  And say which sub-questions are most overrated — the fight over what fixes representational content, say, or whether features in superposition are discovered or imposed by our probes — plus what evidence over the next couple of years should move any of this up or down my list.
reasoning: |-
  Okay, the user has a pot of money to fund two philosophers for a year to work on the realism of representations in neural networks. They want to know which open questions to tackle, in what order, and why. The user emphasizes reasoning over a simple list, focusing on what's upstream, tractable, and impactful. They also want an evaluation of splitting "representation" into storage vs. use claims, and which sub-questions are overrated.

  First, I need to unpack the core problem. The main debate is whether neural networks have genuine internal representations or if interpretability tools are just imposing structure. Philosophers here would bridge conceptual clarity with empirical work from mech-interp teams.

  The user mentioned a colleague's idea to split representation into storage (weights encode info) and use (computation uses that info). I should assess if this split helps or just relabels the problem. Storage seems straightforward—weights hold data, recoverable via probes. But use is trickier—does the network actually use that data in computations? Maybe splitting them clarifies that storage is necessary but not sufficient; the use claim is what matters for interpretability being "real." For example, a network might store a feature but never use it, making interpretability findings misleading. This split could dissolve debates about whether recovered features are real by focusing on their functional role. However, it doesn't resolve how to verify the use claim without reverse-engineering the entire computation, which is hard.

  Next, prioritizing questions. Upstream questions are foundational. Defining representation in a computational context is key. Without a clear definition, other debates are muddled. Then, the relationship between structure and teleology: do learned features exist because of training objectives or inherent structure? This affects whether representations are discoverable or arbitrary. These two are upstream because they frame subsequent issues.

  Tractability is crucial. The philosophers won't train models but can collaborate with mech-interp teams. Questions like probing's epistemic status and causal adequacy of features are tractable because they can analyze existing methods and experimental results. For instance, testing if perturbing a feature affects outputs directly ties into the use claim. These don't require new models, just analysis and collaboration.

  Overrated questions include the fixation on representational content—like whether a feature "means" cat or something else. That's a philosophical rabbit hole with little practical impact. Similarly, the realism of features in superposition might be less critical once we accept superposition as a storage mechanism; the real issue is if these features are used in computations.

  Future evidence that could shift priorities includes interventional experiments. If mech-interp can reliably manipulate features to change model behavior, it strengthens the use claim. Also, if scaling laws show emergent features correlating with capabilities, that supports their reality. Conversely, if probes find features that don't causally affect outputs, it questions their relevance.

  The user's deeper needs might involve wanting actionable insights for interpretability research. They might be funding this to guide their group's efforts, ensuring resources are spent on fruitful areas. They might also seek to resolve internal debates, like the storage vs. use split, to streamline their team's focus. Ensuring the philosophers' work has practical downstream impacts is probably essential, so prioritizing questions that affect interpretability tools' reliability makes sense.
answer: |-
  Here’s a structured plan for your philosophers, prioritizing **upstream questions**, **tractability**, and **impact**, while addressing the storage/use split and overrated debates. Crucially, I’ll explain *why* this order and framing matter.

  ---

  ### **Core Thesis: Focus on the "Use Claim"**
  Your colleague’s storage/use split **is the right cut** and dissolves key illusions:
  - **Storage claim**: Trivial. Weights *statistically* encode patterns recoverable by probes (e.g., linear decoders). This is just correlation; it doesn’t imply functional relevance.
  - **Use claim**: The critical issue. Does the network *causally rely* on X during computation? (e.g., does "cat neuron" activation *cause* cat-related outputs?).
    
  **Why this matters**:
  - Dissolves debates about "reality" of probed features: A storage-only feature (e.g., a probe-accessible pattern never used by the network) is an artifact, not a "representation." Interpretability is only "real" if it captures *used* structures.
  - Leaves untouched: **How to verify the use claim?** This is the hard part — requiring causal intervention, not just correlation. Philosophers should focus here.

  ---

  ### **Prioritized Open Questions (Order = Upstream → Downstream)**
  #### 1. **Question 1: What constitutes "use" in a computational system?**  
     - **Why upstream?** Until we define "use" (causal role, teleological function, or mechanistic necessity?), we can’t evaluate realism.  
     - **Tractability**: Philosophers can analyze computational models, circuit behaviors (from mech-interp), and causal graphs. No model training needed.  
     - **Sub-questions**:  
       - Is "use" defined by *counterfactual dependence* (if X changed, would output change?)?  
       - Or by *algorithmic invariance* (does X play the same role across contexts?)?  
     - **Impact**: Answers here determine what counts as evidence for representation. Changes everything downstream.

  #### 2. **Question 2: How do learning dynamics create "use"-eligible structures?**  
     - **Why upstream?** If representations exist, they emerge from training. We need to know if optimization *demands* functional structures.  
     - **Tractability**: Collaborate with mech-interp to study:  
       - How features form (e.g., phase changes in training).  
       - If circuits replicate across models (suggesting necessity).  
     - **Key issue**: Does SGD *create* "use"-ready structures or merely compress statistics (storage)?  
     - **Evidence shift**: If scaling laws show features emerging predictably, supports realism.

  #### 3. **Question 3: Can we distinguish "epistemically robust" interpretability tools?**  
     - **Why now?** Builds on Q1–Q2. Tests if tools (probes, causal scrubbing) capture "use."  
     - **Tractability**: Audit mech-interp methods:  
       - Does feature visualization *consistently* align with causal roles?  
       - Do interventions on "found features" change behavior *as predicted*?  
     - **Storage/use dissolution**: Probes that find storage-only features are unreliable; tools must pass *causal tests*.

  #### 4. **Question 4: What does superposition imply for realism?**  
     - **Why last?** Superposition is a storage mechanism. Its reality hinges on Q1–Q3.  
     - **Tractability**: Philosophers + mech-interp can study:  
       - Whether superposed features are *individually used* (e.g., via sparse autoencoders).  
       - If interference limits functional independence (undermining "use").  
     - **Overrated angle**: Debating "are superposed features real?" is storage-focused. The real question: **Can the network *use* them independently?**

  ---

  ### **Overrated Questions & Why**
  1. **"What fixes representational content?"** (e.g., causal vs. teleological theories)  
     - **Why overrated?** Content is secondary to *use*. A "cat feature" could function identically whether it "represents" cats or furry blobs — if it’s *used* to detect cats, it’s real for interpretability.  
     - **Impact**: Low. Doesn’t change how we find or verify features.

  2. **"Are features discovered or imposed by probes?"**  
     - **Dissolved by storage/use**: Probes impose *measurements*; the question is whether they measure *used* structures. Focus on intervention, not probes.

  3. **"Do representations require human-like concepts?"**  
     - **Distraction**: Networks need only *task-relevant* structures. Anthropocentrism confuses the issue.

  ---

  ### **Evidence That Should Shift Priorities**
  - **↑ Priority to Q2 if**:  
    Mech-interp finds *universal circuits* (e.g., induction heads) across models. Suggests optimization forces "use"-ready structures.  
  - **↑ Priority to Q3 if**:  
    Interventional tools (e.g., patching) *consistently* fail to align with probe-based features. Challenges realism.  
  - **↓ Priority to superposition debates if**:  
    Sparse autoencoders show features can be isolated *and* causally validated. Then superposition is just implementation.  

  ---

  ### **Why This Order?**
  - **Q1** defines the target ("use"). Without this, all debates are incoherent.  
  - **Q2** examines if representations *must* emerge — grounding realism in learning theory.  
  - **Q3** evaluates tools — the practical output for interpretability.  
  - **Q4** addresses a technical quirk (superposition) that may not change fundamentals.  

  **Tractability**: All questions leverage mech-interp work (e.g., analyzing feature visualizations, intervention studies). Philosophers provide conceptual clarity, design validity tests, and interpret failures.  

  **Bottom line**: Fund work that bridges philosophy of computation and empirical mech-interp — **starting with what "use" means**. Storage is a red herring; the action is in causal roles.
