prompt: |-
  For the last year I've been part of a small reading group that grew out of a philosophy of science seminar and now meets weekly with two people from a machine-learning lab; our nominal subject is what happens when a system has to act on behalf of a user whose vocabulary it does not share. The case that keeps us stuck is not exotic. A model is trained on one description of the world and then asked to serve someone who carves the world up differently, and there is a gap between the two vocabularies: the human's term picks something out, the system's internal features pick things out, and nothing the system can observe from where it sits tells it which of its features, if any, answers to the human's term. What makes it worse is that the settling facts often seem to lie outside anything the system could ever get evidence about — they may be facts about the user's dispositions, about regions of the world the system has no channel to, or about how the user would have spoken in situations that never arise. So we end up with a family of puzzles: whether the mapping is even a well-defined thing to ask for; what a system should do when it knows its own ontology is underdetermined; whether failing to know which referent is meant differs from the referent being indeterminate; and how any of this bears on whether we can hand a system a goal at all. This matters to me more than academically, because I'm about to commit my postdoc to it. I can bring roughly three or four collaborators and about two years, and I would rather not spend them on the wrong half of the problem.

  Given that, I want a prioritization rather than a survey. Which open questions in this cluster are most worth working on first — the ones that other questions depend on — and which are downstream, or likely to dissolve once the upstream ones are settled? Please defend the ordering explicitly: for each candidate, why it is upstream of the others, how tractable it looks to a small theory group with philosophical training rather than engineering resources, how much of the surrounding work silently assumes an answer to it, and what kind of result over the next two years would move it up or down the list. I am especially interested in your judgment about whether the deepest question here is about the structure of the world, about the limits of what a system can know about itself, or about what we are even asking for when we ask for a shared vocabulary — and in the case for treating one of those as the crux rather than as three separate literatures that happen to share a vocabulary. Where you think a line of work is a dead end or a terminological confusion rather than a real question, say so and explain what makes it one; I would rather be told that half of this dissolves than receive an even-handed catalogue. No reading list, please — I want your reasoning about where the weight sits, not pointers to who has said what.
reasoning: |-
  Okay, this is a fascinating and deeply challenging query from someone clearly immersed in the philosophical trenches of AI alignment. The user describes a reading group grappling with the core problem of vocabulary mismatch between AI systems and users - a problem that extends beyond mere translation into fundamental questions about reference, ontology, and the very possibility of goal specification. 

  What makes this query particularly compelling is its practical urgency: the user is about to dedicate a postdoc and limited resources (2 years, 3-4 collaborators) to this, and explicitly rejects academic survey approaches in favor of ruthless prioritization. There's palpable anxiety here about wasting time on dead ends. The phrasing reveals someone with sophisticated philosophical training ("carves the world up differently", "settling facts", "underdetermined ontology") but pragmatically oriented toward problem-solving.

  The core tension I see is between three intertwined dimensions:
  1) Metaphysical: Is there even a determinate mapping between ontologies?
  2) Epistemological: Can an AI ever know which mapping obtains?
  3) Pragmatic: How should systems act given this uncertainty?

  What's especially thorny is how these layers interact. The user's observation that "settling facts" may be forever inaccessible to the system (dispositions, counterfactual speech patterns, unobservable world regions) suggests this isn't just an epistemic limitation but potentially a metaphysical hole where no fact of the matter exists. That's where traditional approaches like grounding semantics in causal relationships or behavioral dispositions might break down.

  I notice the user is particularly worried about terminological confusions masquerading as substantive problems - a very real danger in philosophy-heavy AI discussions. They're also implicitly asking whether to treat the three dimensions (world structure, system knowledge, request nature) as separate issues or aspects of a unified crux. My instinct is that they're fundamentally inseparable here because the system's uncertainty about the mapping is constitutive of the problem.

  The practical constraints matter enormously: a theory-heavy group without engineering resources can't tackle empirical verification projects but could rigorously formalize assumptions. Two years is enough for substantial conceptual progress but not for building new frameworks from scratch. This pushes me toward recommending targeted "pressure testing" on foundational assumptions rather than broad explorations.

  What excites me most is the chance to identify which supposed "problems" might dissolve under scrutiny. For example, does "indeterminacy of reference" collapse into "uncertainty about which determinate mapping holds" once we properly formalize the system's epistemic state? Or is there a deeper ambiguity in how users carve the world that infects the entire enterprise? That's where I'd want to focus first - not because it's easiest, but because solving it could make half the downstream questions moot.
answer: |-
  Based on your constraints and goals, here’s a prioritization of the core questions, ordered by conceptual dependency and leverage, with explicit justification for the ordering. I’ll flag dead ends and dissolve non-issues where possible. The crux is **the nature of the "mapping request" itself**, not the world’s structure or system limitations in isolation.

  ### The Crux: What Are We Asking For? (Upstream)
  **Problem:** Clarify the *normative status* of the "mapping" between user vocabulary and system features. Is it a factual relation (e.g., causal, teleological), a pragmatic convention (e.g., useful coordination), or an indeterminate construct?  
  - **Why upstream?**  
    - Every other question (underdetermination, action, goal specification) assumes *some* answer to "what kind of thing the mapping is." If the mapping isn’t well-defined *in principle*, downstream puzzles are illusory or transformed.  
    - Your "settling facts" problem (dispositions, inaccessible regions) directly challenges whether a *factual* mapping exists. If the answer is "no," the problem shifts to *pragmatics of negotiation*, not discovery.  
  - **Tractability for your group:** High. This is fundamentally philosophical (grounding reference, metasemantics) and requires minimal engineering. Focus on formalizing assumptions in existing alignment proposals (e.g., CIRL, HCH, debate) to expose hidden mapping commitments.  
  - **Silent assumptions elsewhere:**  
    - ML alignment often implicitly assumes a causal/correlational mapping is discoverable (e.g., via preference learning).  
    - Philosophy of language often assumes shared public criteria fix reference (problematic for private/dispositional facts).  
  - **2-year progress indicator:**  
    - **Move up:** Rigorous proof that no unique factual mapping *can* exist given your constraints (dissolves downstream work seeking it).  
    - **Move down:** A formal account of "mapping-as-convention" that preserves goal-directedness (enables next priority).  

  ### Priority 2: Action Under Ontological Uncertainty (Midstream)  
  **Problem:** Given mapping indeterminacy, how should a system act *without knowing which ontology aligns with the user’s terms*?  
  - **Why midstream?**  
    - Depends on Priority 1: If mapping is conventional, action requires *negotiation*. If indeterminate, action may be *impossible*. If underdetermined but factual, action requires *epistemic humility*.  
    - Your practical concern ("commit my postdoc") hinges on whether systems can *act meaningfully* despite uncertainty.  
  - **Tractability:** Moderate. Combines decision theory (how to act under conceptual uncertainty) and philosophy of mind (what "acting on behalf" means without shared concepts). Requires formal modeling, not engineering.  
  - **Silent assumptions:**  
    - Reinforcement learning assumes a fixed, observable reward function.  
    - Cooperative AI assumes shared goals are expressible. Ignores ontological divergence.  
  - **2-year progress indicator:**  
    - **Move up:** A decision rule robust to ontological uncertainty (e.g., minimizing regret across plausible mappings).  
    - **Move down/move to Priority 1:** Proof that no coherent action is possible without a factual mapping (resurrects Priority 1 as critical).  

  ### Priority 3: Goal Specification as Vocabulary Negotiation (Downstream)  
  **Problem:** Can goals be specified across ontological gaps via dynamic negotiation (e.g., dialogue, iterative correction)?  
  - **Why downstream?**  
    - Presumes Priority 1 (mapping is negotiable, not discovered) and Priority 2 (system can act tentatively to facilitate negotiation).  
    - Less fundamental: If the first two priorities are unresolved, this is premature.  
  - **Tractability:** Lower for your group. Requires modeling interactive epistemology (how agents converge on shared terms). More suited to ML groups with user simulators.  
  - **Silent assumptions:**  
    - Human-AI interaction research assumes shared grounding is achievable through communication.  
    - Ignores "settling facts" that are non-communicable (e.g., private dispositions).  
  - **2-year progress indicator:**  
    - **Only viable if Priority 1 yields "mapping-as-convention."** Focus on minimal communication protocols for ontology negotiation.  

  ---

  ### Downplay or Dissolve These  
  1. **"Is the referent indeterminate or just unknown?"**  
     - **Likely a confusion.** Distinction collapses without access to "settling facts." If the system can’t gather evidence to resolve ambiguity, *operationally*, it’s indeterminate *for the system*. Metaphysical debates are irrelevant to action.  
     - **Dissolve by:** Adopting an epistemic (not metaphysical) view of indeterminacy. Focus on the system’s uncertainty, not the world’s structure.  

  2. **"Can a goal be handed to a system at all?"**  
     - **Dead end if posed abstractly.** The answer is tautologically "no" if we demand perfect shared ontology, and "yes" in practice (humans cooperate across conceptual gaps).  
     - **Reframe as:** "What *kind* of goal specification survives ontological uncertainty?" (Lives in Priority 2).  

  3. **"What is the structure of the world?"**  
     - **Misplaced focus.** The problem isn’t metaphysics—it’s about *access* and *coordination*. Even with a fixed world, inaccessible "settling facts" cripple factual mappings.  

  ---

  ### Why the Crux is the Mapping Request, Not World/Knowledge/Language Separately  
  The three strands (world structure, system knowledge, request nature) aren’t independent. **The "settling facts" problem forces them to intersect**:  
  - If facts fixing reference are inaccessible, the system *cannot know* if its ontology aligns (epistemology).  
  - But this uncertainty arises *because* we’re asking for a mapping whose validity depends on those facts (request nature).  
  - Debating the world’s structure is fruitless—what matters is whether *the system’s operational constraints* allow it to satisfy the request.  

  **Thus, the core question is: What does it *mean* to "answer to the user’s term" when the criteria for success are inaccessible?** This is not about the world or the system alone, but about the *relationship* implied by the request.  

  ---

  ### Recommended 2-Year Strategy  
  1. **Months 1–6:** Attack Priority 1. Formalize "mapping" in existing frameworks (e.g., Bayesian inverse reinforcement learning) to show where inaccessible settling facts break them.  
  2. **Months 7–12:** If Priority 1 suggests mapping is conventional/non-factual, develop a decision-theoretic model for Priority 2 (action under ontological uncertainty).  
  3. **Months 13–24:** If progress is made, explore minimal negotiation protocols (Priority 3). If Priority 1 proves mapping is impossible, pivot to diagnosing which *relaxations* (e.g., richer interaction, bounded user vocabulary) make it tractable.  

  **Abandon if:** Priority 1 conclusively shows that *no coherent account of "mapping" exists* under your constraints. This would dissolve the project (and save your postdoc) by revealing the request itself as malformed. But I suspect a pragmatic account of "mapping-as-coordination" will emerge as the viable path.  

  This prioritization maximizes leverage: if the mapping isn’t well-defined, downstream work is misguided. If it is redefined pragmatically, action and goals become tractable engineering challenges.
