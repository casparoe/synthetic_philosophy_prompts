prompt: |-
  I need you to referee an argument between two people I know, and I honestly couldn't tell who was making sense. Put on the hat of a philosopher of art who's spent a lot of time thinking about what makes something a work of art — but keep it readable, I'm not in the field. Think it through carefully before you commit to anything.

  Background: my friend Lena is a composer. She wrote a 40-minute piece for solo piano, and then decided it should never be performed or recorded — she destroyed her demos, sealed the score in an envelope, and left instructions to burn it when she dies. She insists she wrote a piece of music. Her cousin Ash says she didn't — she wrote a recipe, or a set of instructions, and calling it a work of art is cheating, because a work of art has to be something that can be encountered.

  Roughly how it went:

  1. Lena: the score is the piece. Music is an abstract thing, like a proof. A proof doesn't stop being a proof because nobody read it, and my piece doesn't stop being a piece because nobody heard it.
  2. Ash: but a proof is a fact about numbers, true whether or not anyone writes it down. Your piece doesn't exist as music until air moves. You made a plan for music, not music. And don't say a score counts as a work just by existing — a score counts because it can be played. Yours is defined by never being played, so its one essential function is ruled out by its own terms.
  3. Lena: that proves too much. Paintings sit in museum vaults for decades, nobody sees them, and we still call them paintings — we'd still call them art if the museum promised never to display them. If "nobody will experience it" disqualified a thing, half the art in storage isn't art.
  4. Ash: the vault painting can be seen, you've just arranged that it won't be. It's still the kind of thing made for eyes. Your piece is the kind of thing made for ears, but you've made the not-being-heard part of it — you built the refusal into the work. So either the work is the sound-structure, in which case the refusal is just a fact about you and not about the piece, and fine, it's a piece; or the work is the refusal, in which case the score is a prop and the art is the act of withholding. Pick one.
  5. Lena: false choice. It's a piece of music and it's also a piece about not being heard; things can be two things. And anyway, I've heard it — I played it in my head while writing it, so it's had an audience of one.
  6. Ash: then you're not defending the case you started with. You started with "a work no one will ever hear is still a work." If you've heard it, it's a work with an audience, and that's just private art. If your real claim is "art needs no audience," your own example doesn't show it, because the moment you need the head-performance to save the piece, you've admitted the piece needs a listener.

  Can you go through it move by move and tell me who's right about what — not just who wins overall. Don't give me "both make valid points"; I want an actual call on each move, plus your sense of what they're both failing to see.

  Give it back to me as JSON, exactly this shape:

  {
    "brainstorm": "a few sentences of your initial thinking before you settle anything",
    "move_ratings": [
      {
        "move": 1,
        "speaker": "Lena" or "Ash",
        "rating": "one of: clearly mistaken / mostly mistaken / mixed / mostly right / clearly right",
        "why": "one or two sentences justifying the rating"
      }
      // ...one entry per move, 1 through 6
    ],
    "the_real_disagreement": "one paragraph naming the actual crux they keep circling, which may not be the thing they say they're arguing about",
    "who_is_more_right": "Lena" or "Ash" or "genuinely a draw",
    "what_both_are_missing": ["...", "..."]
  }

  Keep the reasons tight. And if you think one of the moves hinges on an assumption that neither of them ever states out loud, say so in the relevant why field.
reasoning: |-
  Hmm, the user wants me to referee an art philosophy argument between two people - Lena and Ash - about whether a never-performed piano piece counts as art. This requires careful analysis using art philosophy principles while keeping it accessible. 

  First, I need to understand the core disagreement. Lena composed a piano piece but sealed and will destroy the score, claiming it's still art like an unread mathematical proof. Ash argues it's merely instructions for potential music since it can't be performed. Their debate has six moves covering ontology of art, audience necessity, and intentionality.

  Key philosophical touchpoints come to mind: Nelson Goodman's distinction between autographic and allographic arts, Arthur Danto's institutional theory, and the role of audience in art ontology. The storage vault analogy is particularly clever - if unseen paintings remain art, why not unheard scores? But Ash counters effectively with the intentional refusal aspect.

  For move-by-move analysis:
  - Move 1: Lena's abstract proof analogy holds merit but oversimplifies - music requires temporal actualization unlike mathematics. Mostly right but incomplete.
  - Move 2: Ash correctly identifies music's performative nature but underestimates scores as art objects. Clearly right on core point but needs nuance.
  - Move 3: Lena's vault comparison is strong - art can exist without immediate perception. Mostly right.
  - Move 4: Ash's strongest point - the intentional refusal changes the work's nature. Clearly right.
  - Move 5: Lena contradicts her initial stance by invoking mental performance. Mostly mistaken.
  - Move 6: Ash exposes this contradiction effectively. Clearly right.

  The real disagreement seems to be whether art requires potential versus actual encounter, complicated by Lena's intentional sabotage of that potential. Both overlook that the refusal itself could be the artwork - a conceptual piece about silence or negation. 

  Ultimately Ash has stronger logical consistency, though Lena's vault argument reveals genuine ambiguity in art ontology. The missing perspective is that by making non-performance constitutive, Lena may have created a different kind of conceptual artwork rather than a musical one.

  I'll structure this as requested JSON with concise reasoning, making sure to identify the unspoken assumptions in each move. The brainstorm section will capture my initial framing about Goodman and Danto before locking in judgments.
