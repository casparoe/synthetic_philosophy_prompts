prompt: |-
  There is a pattern I have been trying to find a name for, and I would like you to tell me whether an established one exists and, if not, to supply a term with a careful definition.

  Consider a person choosing among options without a fixed standard of adequacy. She begins with a rough sense of what would be acceptable — say, an apartment that is affordable and within a reasonable commute. Each option she examines and rejects contributes something: a defect she had not previously thought to care about, which then becomes a requirement for everything she sees afterward. The second apartment has thin walls, so now quiet matters. The fourth has a landlord who seems evasive, so now the landlord matters. The fifth has an awkward layout, so now the layout matters. By the tenth, her requirements have grown into a list she could not have written at the outset, and she has ruled out every candidate — yet she does not experience this as having raised her standards. She experiences it as still searching, still hoping to find the one that is simply good enough.

  Two things strike me about this. First, the process is neither maximizing nor satisficing as those are usually drawn. She never surveys the full set, so it is not maximizing; but there is no stable threshold that a candidate could meet, because the threshold is rewritten by the very candidates it rejects, so it is not satisficing either. Second, the moving threshold is not obviously a mistake. Some of the new requirements are genuine discoveries about what she values; others look more like rationalizations of an unwillingness to commit. From the inside, and often from the outside, the two are difficult to tell apart, and that ambiguity seems to be part of the phenomenon rather than incidental to it.

  So: does this have an established name? If it is closest to something like aspiration-level adaptation, anchoring, or adaptive preference, I want to know exactly where the resemblance breaks — in particular, what the standard treatments assume about whether the aspiration level is fixed at the start, and whether they can accommodate a criterion set that grows endogenously through the search itself. If nothing established fits, coin a term and define it: what the phenomenon is, what it is not, and where its edges lie. In particular I want boundary cases — a case at the edge where you would say the description no longer applies, and a case where the same outward behavior (never settling, requirements accumulating) should be classified as something else entirely, such as ordinary learning or ordinary perfectionism.

  Finally, tell me what would change your verdict. Which consideration would lead you to conclude that this is not a distinct phenomenon at all but merely satisficing or maximizing under a different description, and where in your own reasoning you would expect it to be most likely to fail?
reasoning: |-
  Okay, the user is describing a fascinating behavioral pattern where someone's decision criteria evolve during the search process itself. They reject options based on newly discovered defects, which then become permanent requirements. The key points are: (1) it's neither classic maximizing (no full survey) nor satisficing (no fixed threshold), (2) the threshold evolves endogenously through rejection, and (3) there's inherent ambiguity between genuine value discovery and commitment avoidance.

  I need to check established concepts first. Satisficing clearly doesn't fit because Simon's model assumes a fixed aspiration level. Adaptive preference formation (Elster) comes close but focuses on downgrading desires when options are limited, whereas here preferences are upgrading through rejection. Goal setting theory mentions iterative refinement but usually assumes conscious control. Search theory models aspiration adjustment but typically treats it as exogenous calibration.

  The closest existing framework is actually March's "Technology of Foolishness" - he describes how preferences emerge through action rather than preceding it. But even this doesn't capture the pathological accumulation aspect. So this seems genuinely novel.

  For coining a term, I should emphasize three core features: the generative rejection (each exclusion creates new criteria), the internal/external ambiguity, and the self-defeating outcome. "Criticogenic Preference Formation" might work - "critico-" for criticism/rejection, "-genic" for creation, capturing how criticism generates new preferences. 

  Boundary cases: 
  - Edge case: Someone who adds only one requirement mid-search then stops - too few iterations to show the pattern fully. 
  - Different phenomenon: A perfectionist who starts with exhaustive criteria isn't evolving them; someone learning objective facts (like safety standards) isn't subjectively generating preferences.

  What might challenge this? If we could show the accumulated criteria were always latent preferences activated by discovery (making it satisficing with incomplete information), or if the person could stop when reaching their initial threshold (but they don't - the threshold moves before satisfaction).

  The user seems philosophically sophisticated - they're likely probing how rationality frameworks handle preference endogeneity. Their unspoken need might be understanding why this feels distinct from ordinary indecisiveness. I'll position this as a gray zone where decision theory meets self-deception studies.
answer: |-
  Based on your detailed description, I can confirm this is a distinct and under-theorized phenomenon. While it shares family resemblances with several concepts, it doesn't fit neatly into established frameworks like satisficing, maximizing, aspiration-level adaptation, anchoring, or adaptive preference. Here's the breakdown:

  1.  **Not Satisficing:** Satisficing (Simon) assumes a *fixed aspiration level* set *before* search begins. The agent searches until finding an option meeting that pre-defined threshold. Your phenomenon has a *dynamically generated and escalating threshold* set *during* the search based on rejected options' flaws.
  2.  **Not Maximizing:** Maximizing requires evaluating *all* options (or a representative set) against a *complete, pre-existing utility function* to find the single best option. Your agent lacks a pre-existing complete utility function, doesn't survey the full set, and isn't necessarily seeking the best, just "good enough" (though the definition shifts).
  3.  **Not Standard Aspiration-Level Adaptation/Anchoring:** While aspiration levels *can* adjust based on experience (e.g., finding better/worse options than expected), standard models treat this as *calibration* of a *pre-existing dimension* (e.g., "I thought $1500 was acceptable, but seeing nicer places, now I want $1800"). Your phenomenon involves *adding entirely new dimensions/criteria* (quiet, landlord demeanor, layout) that weren't part of the initial consideration set. Anchoring typically influences the *evaluation* of a fixed dimension based on an initial value, not the *creation* of new dimensions.
  4.  **Not Adaptive Preference (Elster/Sen):** Adaptive preference typically describes *downgrading* desires ("sour grapes") when options are limited or unattainable to reduce cognitive dissonance. Your phenomenon involves *upgrading* requirements based on encountered flaws, often *expanding* the perceived set of possibilities ("sweet lemons?"). It's generative, not resigned.
  5.  **Closest Relative - Technology of Foolishness (March):** March's concept that "preferences are discovered through action" comes closest. However, it's a broad philosophical stance, not a specific model of the pathological search process you describe. Your case adds the crucial elements of *criteria generation through rejection* and the *self-defeating accumulation* leading to an inability to choose.

  **The New Term: Criticogenic Preference Formation (CPF)**

  *   **Definition:** Criticogenic Preference Formation (CPF) is a decision-making dynamic where an agent, engaged in a sequential search for a "good enough" option without a fixed, complete standard, generates *new evaluative criteria* specifically from the *defects perceived in rejected options*. Each rejection not only eliminates a candidate but also *adds a new requirement* to the threshold for acceptability. This endogenous generation of criteria leads to an escalating and increasingly complex set of demands that may become impossible to satisfy, while the agent perceives the process as a continued search for adequacy rather than escalating standards. A core characteristic is the inherent *epistemic ambiguity* regarding whether new criteria represent genuine value discovery or rationalization of commitment aversion.

  *   **Core Features:**
      *   **Sequential Search:** Options are evaluated one (or a few) at a time.
      *   **Initial Rough Threshold:** A minimal, incomplete starting point for "good enough."
      *   **Generative Rejection:** Rejection of an option *directly causes* the formulation of a *new requirement* based on its specific flaw.
      *   **Endogenous Escalation:** The threshold for acceptance grows in complexity and stringency *from within the search process itself*, fueled by encountered negatives.
      *   **Perceived Constancy of Goal:** The agent subjectively experiences the goal as finding something merely "acceptable" or "good enough," not as raising standards towards perfection.
      *   **Epistemic Ambiguity:** It is inherently difficult (for agent and observer) to distinguish between new criteria representing authentic value discovery and those serving as post-hoc rationalizations for indecision or commitment avoidance.
      *   **Potential for Gridlock:** The process can lead to rejecting all options without recognizing that the threshold has become unattainable or excessively demanding relative to the initial goal.

  *   **What it is NOT:**
      *   **Satisficing:** No fixed aspiration level; threshold evolves by adding dimensions.
      *   **Maximizing:** No fixed utility function; no exhaustive comparison; goal is adequacy, not optimality.
      *   **Perfectionism:** The stated goal remains "good enough"; the escalating standards are emergent and not consciously driven by a desire for the flawless.
      *   **Simple Learning:** While learning occurs (e.g., "thin walls exist"), CPF specifically involves translating learned negatives into *new positive requirements* for future options. Learning about market conditions (e.g., "rents are higher than I thought") that leads to adjusting a *single, existing* dimension (price) is different.
      *   **Adaptive Preference:** Involves *adding/upgrading* requirements based on negatives encountered, not *downgrading* desires due to unavailability.

  *   **Boundary Cases:**
      *   **Edge Case (CPF Weak/Not Fully Manifest):** An agent who examines only 2-3 options, rejects one because of a specific flaw (e.g., noisy), adds "quiet" as a requirement, and then finds the next option acceptable under the new (slightly expanded) criteria. The generative rejection happened, but the escalation was minor and didn't prevent satisfaction. It touches CPF but lacks the characteristic pathological accumulation and gridlock.
      *   **Outwardly Similar but Different Phenomenon (Ordinary Learning):** An agent starts looking for an apartment knowing only "affordable" and "reasonable commute." They see several options and learn that "safe neighborhood," "in-unit laundry," and "pet-friendly" are common features they value. They consciously *add these as explicit requirements* early on because they realize these features contribute to their well-being and are available. The criteria set grows, but the *source* is discovering *positives they value*, not *generating requirements from the flaws of rejected options*. The growth is driven by aspiration, not criticism.
      *   **Outwardly Similar but Different Phenomenon (Perfectionism):** An agent starts with an exhaustive, highly specific list of requirements (granite counters, balcony, specific floor, etc.) and rejects every option because none meet *all* these pre-existing, stringent demands. The standards are high and fixed from the outset; no new criteria are *generated* during the search. The gridlock arises from initial perfectionism, not emergent criticogenesis.

  **What Would Change My Verdict (Challenges to Distinctness):**

  1.  **Revealed Latent Preference:** If compelling evidence showed that *all* the "new" criteria were *always* latent preferences, and encountering the flaw merely *revealed* or *activated* awareness of that pre-existing preference dimension (without genuinely creating a new valuation), then CPF could arguably be reduced to **satisficing with initially incomplete self-knowledge**. The threshold existed implicitly; the search just revealed what it was. The key counter is your observation of *epistemic ambiguity* – it's often unclear, even to the agent, if the new requirement was latent or generated by the rejection event itself. CPF thrives in this ambiguity.
  2.  **Fixed Threshold Met Early:** If the agent, despite adding new requirements, *did* eventually accept an option that met the *initial* rough threshold (affordable, reasonable commute), even if it lacked later-added "nice-to-haves," this would undermine CPF. It would suggest the core threshold *was* fixed, and the new criteria were secondary considerations that didn't truly block acceptance of a "good enough" option. CPF requires the new criteria to become *integral* to the definition of "good enough," preventing satisfaction of the initial goal.
  3.  **Exogenous Calibration Only:** If the only adjustments were to the *level* of pre-existing dimensions (e.g., "I thought $1500 was ok, but now I see nicer places, so I'll accept $1700") without *adding new dimensions* based on specific flaws, then it fits **aspiration-level adaptation**, not CPF. CPF is defined by the generation of *new criteria*.
  4.  **Conscious Strategy:** If the agent consciously decided "I will use early searches to *define* my requirements list, then seriously evaluate later options," this would be **deliberate preference exploration**, not the emergent, often unreflective dynamic of CPF where requirements accrue reactively.

  **Where the Concept Might Be Most Vulnerable:**

  The core vulnerability lies in the **epistemic ambiguity**. Proving that a requirement is genuinely *newly generated* by the rejection event, rather than merely *revealed* or *activated* from latent preferences, is empirically and introspectively difficult. This ambiguity is central to the phenomenon you describe but also makes it hard to definitively isolate from sophisticated forms of satisficing with learning. My argument rests on the *phenomenology* (the agent's experience of the process) and the *structural mechanism* (requirements being *added* based on specific flaws, not just levels adjusted). CPF best captures the dynamic where the search process itself, through the act of criticism, *creates* the standards that ultimately thwart its goal.

  **In conclusion,** "Criticogenic Preference Formation" (CPF) captures the core dynamic you describe: the endogenous generation and escalation of requirements through the act of rejecting options, leading to potential gridlock under the guise of searching for adequacy, characterized by inherent ambiguity about the authenticity of the new demands. It carves out a distinct space between satisficing, maximizing, and related concepts.
