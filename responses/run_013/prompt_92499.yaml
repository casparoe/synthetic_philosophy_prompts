prompt: |-
  I am a database engineer with a strong grasp of SQL semantics but no background in Buddhist philosophy. Restate Nāgārjuna's tetralemma and the Madhyamaka claim that all phenomena are empty in the vocabulary I actually use: three-valued logic, TRUE, FALSE, UNKNOWN, NULL propagation, EXISTS and NOT EXISTS, inner and outer joins, and the difference between a NULL value and an empty result set. Do the translation as faithfully as you can, then give me the residue report. Which of the four corners map cleanly onto the truth values, and which require you to fudge the semantics? Does emptiness translate as NULL, as the absence of a row, or as something the vocabulary cannot express? What in the Madhyamaka position has no counterpart in a relational database, and is that residue a defect of my vocabulary or a sign that the original position is doing something other than assigning truth values? Write in American English, in continuous prose with no headings, bullet points, bold text, or tables.
