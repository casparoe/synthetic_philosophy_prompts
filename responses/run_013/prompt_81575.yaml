  ### Thought Experiment: The Adaptive Thermostat

  **Physical System Description:** Consider a thermostat system designed to maintain room temperature. It has two physical components: a temperature sensor and a switch for a heater. The system operates in discrete time intervals (seconds). At each second, the sensor reads the temperature and the system updates its state. The system has four possible states based on the sensor's reading: (1) Very Cold (below 15°C), (2) Cold (15–18°C), (3) Normal (18–22°C), and (4) Hot (above 22°C). The heater turns on only in states 1 and 2, and off in states 3 and 4. Transitions depend solely on the current temperature reading (e.g., if current state is Cold and the next reading is 19°C, it transitions to Normal). The system has no memory; each state is determined exclusively by the sensor input at that instant.

  **Computation in Question:** A finite automaton that detects sequences where "Cold" is followed by "Hot" within one step. The automaton has states: {Start, SawCold, Accept, Reject}. Transitions:  
  - From Start, on Cold → SawCold; on other inputs → Start.  
  - From SawCold, on Hot → Accept; on other inputs → Reject.  
  Accept and Reject are absorbing states. The computation outputs "valid" if it reaches Accept, "invalid" otherwise.

  ---

  ### Verdicts by Account
  1. **Mapping Account:** Yes, it implements the computation.  
     *Why:* A mapping exists:  
     - Map physical states: Very Cold → Start, Cold → SawCold, Normal → Reject, Hot → Accept.  
     - Transitions align:  
       - Cold (SawCold) to Hot (Accept) matches SawCold → Accept on Hot.  
       - Cold to Normal maps to SawCold → Reject (valid transition).  
       - Other transitions (e.g., Very Cold to Cold → Start to SawCold) correspond.  
     The mapping satisfies the computation's transitions.

  2. **Mechanistic Account:** No, it does not implement the computation.  
     *Why:* The physical system lacks causal components corresponding to the computation's structure. The automaton requires memory (e.g., transitioning to SawCold *after* seeing Cold), but the thermostat has no memory mechanism—each state is determined anew by the sensor. The causal interactions (direct sensor-to-heater responses) do not "carry out" the steps of sequence detection; they merely respond instantaneously to inputs. The mapping is arbitrary and does not track causal joints (e.g., SawCold is not a stored state but a direct reading).

  ---

  ### Feature Causing Divergence
  The key feature is **absence of memory or state-history dependence** in the physical system. The system’s transitions are input-driven with no dependency on past states, while the computation requires retaining prior state information (e.g., "SawCold" depends on the previous input).  
  **If removed:** If the thermostat included a memory register storing prior states (e.g., a component that latches "Cold" until the next input), both accounts would agree it implements the computation. The mechanistic account would then track the causal role of memory in carrying out the sequence detection.

  ---

  ### Transfer to the Brain
  This feature is **present in the brain**. Neural processes often depend on transient, input-driven activations (e.g., sensory responses) without necessarily storing discrete states in a memory register. For instance, fast reflexive pathways might process inputs without maintaining a history, akin to the thermostat. Thus, under the mapping account, such brain processes could implement computations like sequence detection via arbitrary mappings, but under the mechanistic account, they would not if they lack persistent state-representing mechanisms. The case transfers directly, showing that whether the brain "computes" depends on the account of implementation chosen.

  ---

  ### Strongest Objection and Response
  **Objection (from mapping account defender):**  
  "The mapping is valid and non-arbitrary; it uses the system’s actual state transitions. The thermostat *does* transition from Cold to Hot, which maps to SawCold→Accept. Demanding memory conflates implementation with computational complexity—simple systems can implement complex computations via clever mappings."

  **Response:**  
  The objection fails. The computation requires state-history dependence (SawCold must *remember* a prior Cold input), but the system has no causal mechanism for retention. The mapping forces SawCold onto a state (Cold) that is causally identical to Start or Hot—it is just an instantaneous input label. The mechanistic account correctly insists that computational states must be carried by components with appropriate causal roles (e.g., a memory buffer). Without this, the mapping is merely descriptive, not implementational.

  ---

  ### Success Assessment
  **I succeeded.** The case cleanly separates the accounts using a non-trivial, fixed system. The thermostat is a plausible "computer" for temperature regulation, avoiding rock-like triviality. The divergence arises from explicit differences in the accounts (memory dependence vs. arbitrary mapping), not vagueness or stipulation. This shows that the question "Is the brain a computer?" has no determinate answer without specifying an account of implementation.
