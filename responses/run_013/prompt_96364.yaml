prompt: |-
  You are a philosopher of science working on explanation, reduction, and the unity of the sciences, and you have a reputation for turning conceptual distinctions into instruments that non-philosophers can actually run under time pressure. Work carefully and in stages. Before you write the deliverable, spend some private effort brainstorming: enumerate the different ways an explanation can look like it is doing work while leaving the phenomenon exactly where it was, and enumerate the different things people might mean when they call an explanation reductive. Also, before you begin the procedure itself, write out for yourself what would have to be true for a charge of either of the following to be decisive rather than merely rhetorical. Do not show me this preliminary work; use it.

  The situation. I am a program officer at a foundation that funds interdisciplinary work on cognition and behaviour. I screen about ten pre-proposals a month and write a one-page recommendation on each, which goes to a review panel; I can send a proposal back to the applicants for revision, but I cannot reject one outright, and the panel decides. My panel chair has asked me to stop doing two things. First, waving through proposals that explain a phenomenon by naming a capacity. Second, being impressed by proposals that dissolve a phenomenon into something smaller and announce that the problem is solved. The panel has settled on a working vocabulary for the two failures, and has asked me to apply it mechanically enough that I can defend my recommendations to applicants who will be annoyed. I need you to build the machinery.

  The vocabulary, which you should treat as the fixed input and may refine but not replace. It comes from Daniel Dennett's discussion of cranes, skyhooks, and greedy reductionism; I am not giving you any other literature, and nothing in your answer may depend on a source I cannot check.

  A skyhook is an entity, capacity, or process introduced into an explanation to do the work, where the capacity to do that work is left unexplained. The proposal says, in effect, and then X does the rest, where X's ability to do the rest is the very thing that needed accounting for. Two points matter. Being unfamiliar, mental, holistic, emergent, or irreducibly relational does not make something a skyhook; neither does being posited rather than observed. The mark of a skyhook is that the explanatory load rests on a capacity that the theory itself never generates, so the mystery has been renamed rather than addressed.

  A crane is a multi-step account in which whatever does the work at each step is available from the previous step, or independently licensed, or at least explicitly a target for further work. Cranes may be baroque and may posit new entities. What makes something a crane is that the steps compose: you can see how the output of one step is the input to the next, and no single step silently carries the whole load.

  Greedy reductionism is explaining a high-level phenomenon by jumping directly to the lowest-level description available, so that the intermediate levels where the phenomenon actually lives are skipped. The diagnostic sign is not that the low-level facts are false. It is that they are true and insufficient: you cannot get from them to the phenomenon without the missing levels, and the explanation either quietly substitutes a different and easier phenomenon or denies that the original phenomenon exists.

  Three things the vocabulary must not be allowed to do, and you should design around them. It must not be possible to dismiss a proposal merely for positing something whose ultimate origin is not derived from anything deeper; some posits are legitimately treated as fundamental, and the test is whether the theory licenses that stopping point, says what the posit is doing, and says what would count as its failing, not whether the posit has a pedigree. It must not be possible to win a case by pointing out that a phenomenon is multiply realizable or that the levels are not neatly nested. And the verdicts must be graded: a proposal is rarely a pure skyhook or pure crane, and the useful output is often that one step of an otherwise sound chain is doing all the work.

  My constraints. I have thirty minutes per proposal, I have no expertise in most of the subfields I read, and I am not entitled to adjudicate whether a proposal is empirically correct. My job is only to assess the architecture of the explanation: what is doing the work, what is being left undone, and where the applicants have stopped. My panel chair will sign the one-pager with me and has no patience for a procedure whose steps are really just invitations to admire the theory. Applicants are often senior people and will contest every step, so each question in the procedure must have a stated standard for what counts as an adequate answer and a stated consequence if the answer is missing.

  Deliver the following.

  1. A decision procedure I can run in thirty minutes, as a numbered sequence of questions in a fixed order, each with: what I am looking at, what counts as a sufficient answer, what counts as an evasion (with two or three concrete examples of evasive answers, since I will meet them), and what happens next. Include the stopping conditions: where the procedure terminates in a crane, where it terminates in a skyhook, where it terminates in greedy reductionism, and where it terminates by handing the decision to the panel as a matter that is not settled by facts about the explanation at all. Where a stopping condition requires a value judgement, mark it in the text and say what the judgement is.

  2. A short battery of tests for the greedy case specifically, since it is the one I expect to misapply. Give me three or four probes that distinguish an explanation that is low-level and correct from one that is low-level and greedy. The central one should be a request for the composition step, that is, an explicit demand for the account that carries you from one level to the next. Include at least one probe that is designed to catch a legitimate multi-level reduction and clear it, and say how I can tell that the probe has been cleared rather than merely deflected.

  3. Worked applications to all four of the proposals below, each walked through the procedure question by question with the verdict stated. At least one of the four should come out against the first impression a sympathetic reader would form, and I should be able to see from your walk-through exactly which question turned the case.

  Proposal A. Human infants acquire their first language far too fast, and on far too thin and degenerate evidence, for general-purpose learning to be doing the work; therefore the brain contains a device whose internal structure already is the structure of human language, and the research programme is to specify those internal rules more exactly and locate their neural implementation. The proposal does not address how the device came to have that structure, nor how development assembles it; the device's having the structure is the starting point, and the applicants describe this as a necessary idealization.

  Proposal B. Workers in a social insect colony treat nestmates differently from non-nestmates. The proposal traces a chain: individual variation in the waxy layer on the cuticle; learning of the colony odour during a sensitive period in the first days after emergence; comparison of incoming odours against a learned template; a graded aggressive response above a threshold; and, over generations, selection on the odour-producing chemistry and on the learning window, since colonies with mismatched recognition thresholds lose resources to intruders. Each link is said to be documented in other species and measurable here.

  Proposal C. Music moves us because the passages that give listeners chills reliably produce dopamine release in the striatum, measured by displacement of a radioligand. The applicants conclude that the pleasure of music just is dopaminergic reward, and that the search for anything more is romanticism. The proposal does not address why these particular acoustic patterns, rather than any others, recruit the reward system, nor how musical structure at the level of phrases, expectations, and resolutions relates to the reward events, and treats such questions as outside its scope.

  Proposal D. Institutions persist because participants share a bonding property that holds a collective together across defection and turnover; the property is defined operationally as whatever it is about a population that makes its institutions stable when they would otherwise unravel. The proposal's plan is to measure this property, compare it across cases, and show that it predicts institutional durability. The panel is enthusiastic, because it promises to unify work in three literatures at once.

  4. A closing section, honestly written, on what this procedure cannot do. Specifically: the misfires I should expect, including the case where a good explanation is flagged because it is unfamiliar and the case where a bad one passes because it is told in many small steps; which of the questions are judgement calls dressed as tests, and what the judgement is that they conceal; what a panel member who rejects the whole crane and skyhook vocabulary would say in response to the procedure and whether that objection can be met or only noted; and what I should tell an applicant who asks what they would have to add to a skyhook-flavoured proposal to make it fundable, given that I am not entitled to tell them what to think.

  Throughout, write for someone who has never read a word of philosophy of science and will be running this with a proposal in one hand and a clock running. Define any term you introduce in the sentence in which you introduce it. Do not include citations, bibliographies, reading lists, or references to particular authors or works; assume I cannot look anything up and that the procedure has to be self-contained. Do not hedge with a long survey of the literature you are not citing. If you reach a point where the procedure cannot be made to work without a distinction you cannot define plainly, say so there and tell me what to do instead.
reasoning: |-
  We are building a decision procedure for evaluating proposals based on Dennett's concepts of skyhooks, cranes, and greedy reductionism. The goal is to assess the explanatory architecture without judging empirical correctness. The procedure must be runnable in 30 minutes by a non-expert, with clear questions, standards, and consequences.

  Preliminary considerations (not shown to user):
  1. Ways an explanation can appear to work without progress:
     - Renaming the phenomenon (e.g., "intelligence" becomes "cognitive capacity" without unpacking).
     - Delegating the core work to an unexplained capacity (e.g., "a module does it").
     - Reducing to a lower level without showing how the higher level emerges (greedy reductionism).
     - Circularity: using the phenomenon to explain itself.
     - Overgeneralization: explaining a specific phenomenon by a universal principle that doesn't account for the specificity.

  2. Meanings of "reductive":
     - Ontological reduction: claiming the phenomenon is nothing but the lower-level processes.
     - Methodological reduction: explaining by breaking down into parts.
     - Eliminative reduction: denying the phenomenon exists and replacing it with lower-level terms.
     - Greedy reductionism: skipping levels and failing to account for the phenomenon.

  For a charge to be decisive:
  - Skyhook: the explanation must rely on a capacity that is not derived from prior steps or independently licensed, and the theory does not acknowledge it as a fundamental posit with clear criteria.
  - Greedy reductionism: the explanation must jump to a lower level without providing an account of how the higher-level phenomenon is composed from that level, and the lower-level facts must be insufficient to reconstruct the phenomenon without the missing steps.

  Now, the procedure:

  1. Decision Procedure (Numbered Sequence)

  Question 1: What is the phenomenon to be explained? (P)
     - Look at: The proposal's stated target.
     - Sufficient: A clear, specific description of what is being explained (e.g., "language acquisition in infants").
     - Evasion: 
          a) Describing a different phenomenon (e.g., "the evolution of language" when the proposal is about acquisition).
          b) Defining the phenomenon circularly (e.g., "the capacity to learn language" without independent criteria).
          c) Overly broad (e.g., "human behavior").
     - Next: If evasion, note the evasion and proceed to the next question, but mark that the phenomenon is unclear. (We cannot stop yet because the problem might be in the proposal's clarity, not the explanation.)

  Question 2: What is the explanatory chain? List the steps that lead from initial conditions to the phenomenon. (E)
     - Look at: The sequence of causes, mechanisms, or processes proposed.
     - Sufficient: A series of steps, each with an input and output, such that the output of one is the input to the next, and the final output produces P. Steps may be posited or observed.
     - Evasion:
          a) A single step that does all the work (e.g., "a language acquisition device" without internal steps).
          b) Skipping steps (e.g., "genes cause behavior" without intermediates).
          c) Using placeholder terms (e.g., "then magic happens" or "then a complex process occurs" without specifying).
     - Next: If the chain is missing or has gaps, note the gap and proceed. We will check if the gap is filled by a skyhook or if it is a legitimate stopping point.

  Question 3: For each step in the chain, what carries the explanatory load? That is, what entity, capacity, or process produces the output from the input? (L)
     - Look at: The workhorse at each step.
     - Sufficient: For each step, an explicit statement of the mechanism (e.g., "neural circuit X transforms input A to B via Hebbian learning").
     - Evasion:
          a) Naming a capacity without saying how it works (e.g., "the learning mechanism").
          b) Referring to an unexplained property (e.g., "the emergent dynamics" without specifying the dynamics).
          c) Delegating to a black box (e.g., "the brain computes it").
     - Next: If any step has an evasion, note which step and proceed. We will check if that step is a skyhook.

  Question 4: For each step that carries load, is the capacity to do the work derived from the previous steps, independently licensed, or explicitly flagged as a fundamental posit? (D)
     - Look at: The origin of the capacity at each step.
     - Sufficient:
          - Derived: The previous steps in the chain produce the capacity (e.g., step 1 builds a circuit, step 2 uses that circuit to learn).
          - Independently licensed: The capacity is established by prior research (with a citation or brief description of the evidence) and the proposal builds on it.
          - Fundamental: The proposal states that this capacity is a starting point, defines what it does, and specifies what would count as its failure. (This is rare and must be justified.)
     - Evasion:
          a) Asserting without evidence that the capacity exists (e.g., "it is known that..." without reference).
          b) Treating a non-fundamental posit as fundamental (e.g., "this is just how it works" for a complex capacity that could be decomposed).
          c) Ignoring the question of origin.
     - Next: If a step is not derived, not independently licensed, and not claimed as fundamental, mark it as a potential skyhook. If it is claimed as fundamental, check if it meets the fundamental criteria (next question).

  Question 5: (Only for steps claimed as fundamental) Does the proposal specify what the fundamental posit does and what would count as its failure? (F)
     - Look at: The definition and testability of the posit.
     - Sufficient: Clear operational definition (e.g., "the bonding property is measured by the rate of defection in a standardized game") and falsifiability (e.g., "if we manipulate X and the property doesn't change, we're wrong").
     - Evasion:
          a) Vague definition (e.g., "the bonding property is the glue that holds society together").
          b) No failure condition (e.g., "it's always present in stable institutions" without saying how to test if it's causal).
     - Next: If insufficient, the posit is a skyhook. If sufficient, it is a legitimate fundamental.

  Question 6: Does the explanatory chain skip levels that are necessary to account for the phenomenon? (G)
     - Look at: The levels of organization (e.g., neural, cognitive, behavioral, social). Is the phenomenon at a high level, and does the chain jump to a low level without intermediate steps?
     - Sufficient: The chain connects the phenomenon to the lower levels through steps at each relevant level OR a clear argument why intermediate levels are not needed.
     - Evasion:
          a) Dismissing the higher level (e.g., "the social level is just an illusion" without showing how the lower level produces it).
          b) Claiming that the low level is the real phenomenon without addressing the original phenomenon (e.g., "the pleasure of music is just dopamine" without explaining why we experience it as music).
     - Next: If levels are skipped and the phenomenon is not redefined, mark as potential greedy reductionism.

  Stopping Conditions:
  - Crane: The chain (from Q2) is complete (no gaps) and for every step:
        - The load-carrier (Q3) is specified.
        - The capacity is derived, independently licensed, or a well-defined fundamental (Q4 and Q5).
        - Levels are not skipped (Q6) OR if skipped, a compelling argument is given that the phenomenon is nothing but the lower-level activity (and this is supported by the proposal).
  - Skyhook: At least one step in the chain (from Q4 or Q5) is a potential skyhook (i.e., unexplained capacity that is not fundamental and not licensed) OR a step that is a skyhook is doing the critical work.
  - Greedy reductionism: The chain (Q6) skips necessary levels, and the proposal does not account for the phenomenon as originally defined (i.e., it either redefines the phenomenon or denies it).
  - Hand to panel: The proposal does not fit the above, or the judgment of what counts as a fundamental or a necessary level is too contentious. Also, if the phenomenon (Q1) is not clearly stated, and the rest of the procedure cannot be run, then hand to panel.

  Graded verdicts: We note the number of steps that are skyhooks and which steps are skipped. A proposal might be "mostly crane with one skyhook at step 3" or "greedy reductionism at the jump from neural to cognitive."

  2. Battery of Tests for Greedy Reductionism

  Probe 1: Composition Step Request
     - Ask: "How do the lower-level facts compose to produce the higher-level phenomenon? Please specify the intermediate steps."
     - Distinguishing: A legitimate reduction will provide a step-by-step account (e.g., "dopamine release in response to musical features is part of a reinforcement learning system that..."). A greedy one will be unable to do so or will change the subject.

  Probe 2: Multiple Realizability Test
     - Ask: "Could the same phenomenon be realized by different lower-level mechanisms? If so, how does your explanation account for that?"
     - Clearing: If the proposal acknowledges multiple realizability and shows how the lower level in this case is sufficient (without denying the phenomenon), it is cleared. If they deny multiple realizability without argument, it might be greedy.

  Probe 3: Phenomenon Check
     - Ask: "Does your explanation account for all the features of the phenomenon as originally described, or does it leave some out?"
     - Clearing: If they list the features (e.g., for music: emotional response, cultural variation, structural complexity) and show how each is addressed by the lower level, it's cleared. If they dismiss some features as irrelevant, it might be greedy.

  Probe 4: Independence Test
     - Ask: "If we intervened on the lower-level process, would it change the higher-level phenomenon in the way your theory predicts? And conversely, if we changed the higher-level phenomenon, would the lower level change accordingly?"
     - Distinguishing: A legitimate reduction will have a clear mapping (e.g., "blocking dopamine would block the pleasure"). A greedy one might have a one-way correlation without causal depth.

  How to tell cleared vs deflected: Cleared means they answer the question directly and provide a mechanism. Deflected means they change the subject (e.g., "that's not important" or "that's for future work") without engaging.

  3. Worked Applications

  Proposal A: Language acquisition device.
     - Q1: Phenomenon is rapid language acquisition in infants. Clear.
     - Q2: Chain: Input (thin evidence) -> Language Acquisition Device (LAD) -> Output (language). One step? The device does the work.
     - Q3: Load-carrier: LAD. They don't specify how it works, just that it has the structure. Evasion.
     - Q4: Is LAD derived? No. Independently licensed? Not in this proposal. Claimed as fundamental? They say "necessary idealization", so check Q5.
     - Q5: What does LAD do? It has the structure of language. Failure? If it doesn't, the child doesn't acquire language. But: they don't define how we would know if the LAD has the structure independently of the child acquiring language. Without a test, it's circular. So, insufficient for fundamental.
     - Q6: Not applicable because we already have a skyhook.
     - Verdict: Skyhook. The LAD is doing the work without being explained.

  Proposal B: Social insect recognition.
     - Q1: Phenomenon: nestmate recognition. Clear.
     - Q2: Chain: (1) Cuticle wax variation -> (2) Learning in sensitive period -> (3) Odor comparison -> (4) Aggressive response -> (5) Selection over generations. Steps are clear.
     - Q3: Load at each step: 
          Step1: Variation in wax (given by biology). 
          Step2: Learning mechanism (documented in other species). 
          Step3: Comparison mechanism (documented). 
          Step4: Response threshold (measured). 
          Step5: Natural selection (standard). 
     - Q4: 
          Step1: Independently licensed (biology of cuticle).
          Step2: Independently licensed (learning in insects).
          Step3: Independently licensed.
          Step4: Measured here, but the mechanism is independently known.
          Step5: Independently licensed.
     - Q5: No fundamental claims.
     - Q6: Levels: from molecular (wax) to individual learning to behavior to evolution. All levels are present. No skip.
     - Verdict: Crane.

  Proposal C: Music and dopamine.
     - Q1: Phenomenon: music giving chills and pleasure.
     - Q2: Chain: Acoustic patterns -> dopamine release -> pleasure. They say the pleasure "just is" the dopamine release. So, one step? Or two?
     - Q3: Load-carrier: Dopamine release. They don't explain why these patterns cause dopamine release.
     - Q4: Dopamine release: not derived from the acoustic patterns (no account of how the patterns cause it), independently licensed? Dopamine is known for reward, but not for music specifically. Not claimed as fundamental? They treat it as the explanation.
     - Q5: Not claimed as fundamental? They say the pleasure is the dopamine, so they are redefining the phenomenon. But they don't define what would count as failure (e.g., if dopamine is blocked but pleasure remains?).
     - Q6: They skip from acoustic patterns (low-level) to the psychological phenomenon (pleasure) by jumping to neural. But the phenomenon includes the relation to musical structure (phrases, etc.) which is not addressed. They redefine the phenomenon as dopamine release.
     - Verdict: Greedy reductionism. They skip the intermediate levels (cognitive, emotional) and reduce the phenomenon to dopamine without showing composition.

  Proposal D: Bonding property for institutions.
     - Q1: Phenomenon: institutional persistence.
     - Q2: Chain: Bonding property (operationally defined) -> institutional stability. But the property is defined as whatever causes stability. So the chain is: bonding property -> stability. They don't say what causes the bonding property or how it works.
     - Q3: Load-carrier: Bonding property. They don't specify what it is, just that it's measured by stability.
     - Q4: Bonding property: not derived, not independently licensed (it's defined operationally), claimed as fundamental? They don't say, but they define it operationally. Check Q5.
     - Q5: What does it do? It holds the institution together. Failure? If the institution unravels, the property is absent. But: circular definition. The property is defined by the outcome. Without an independent measure, it's circular. So, insufficient.
     - Q6: Not applicable.
     - Verdict: Skyhook. The bonding property is a black box that does the work without being explained.

  But note: The panel is enthusiastic. However, the procedure flags it as a skyhook. This is the one that goes against first impression.

  4. Closing Section: Limitations

  - Misfires:
     - Good explanation flagged: A genuinely novel explanation with many small steps might be flagged as a skyhook if one step is not yet licensed. But we allow independent licensing, so if they reference prior work, it should clear. If it's new and they mark it as a target for future work, it might still be a crane if the step is explicit. However, if they don't, it might be flagged unfairly.
     - Bad explanation passes: A proposal that decomposes into many small steps but with one step being a skyhook might slip through if we miss it. Also, a greedy reductionism that provides a composition step might pass even if the step is weak, because we don't judge empirical strength.

  - Judgement calls:
     - Q5 (fundamental): Judging if the definition and failure conditions are adequate is subjective. The standard is: can we test it independently of the phenomenon? If not, it's circular.
     - Q6 (levels): What counts as a necessary level? We must rely on the proposal's own description of the phenomenon. If the phenomenon is at the social level, and they jump to neural, that's a skip. But if they argue that the social level is reducible, we must judge if they provide the reduction. This is a judgement call.

  - Objection from a panel member: They might say the whole vocabulary is flawed because all explanations have some undecomposed parts. Response: The procedure allows fundamental posits and independently licensed steps. It only flags when a capacity is doing the work without being derived or licensed and without being a proper fundamental.

  - Advice to an applicant: "Your explanation relies on a capacity that is not yet derived from your theory or independently established. To strengthen the proposal, you could: (a) provide evidence that this capacity exists and works as you say, (b) break it down into smaller steps that you can derive, or (c) if it's fundamental, clearly define it and say how you would test if it's doing what you claim."

  Now, the deliverable as per the instructions.
answer: |-
  ### Decision Procedure for Evaluating Explanatory Architecture

  This procedure is a step-by-step checklist to assess proposals for skyhooks, cranes, or greedy reductionism. Run it in order. Spend no more than 5 minutes per question. If an answer is evasive, note it and proceed—the verdict may still be clear. **Key terms:**  
  - **Explanatory load:** The work done by a specific part of the explanation.  
  - **Derived:** The capacity comes from prior steps in the chain (e.g., Step 1 creates a tool, Step 2 uses it).  
  - **Independently licensed:** Supported by established evidence (cite a study, model, or dataset).  
  - **Fundamental posit:** A starting point that defines what it does and how it could fail (e.g., "gravity" in physics, with clear tests).  

  #### 1. **Question Sequence**  
  **Question 1: What is the target phenomenon?**  
  - **Look at:** The proposal’s stated "problem" or "question."  
  - **Sufficient answer:** A specific, observable event or pattern (e.g., "infants learn language from sparse data," not "understanding cognition").  
  - **Evasion examples:**  
    - *Redefining the phenomenon* (e.g., "it’s not *really* about music, it’s about brain chemistry").  
    - *Overgeneralizing* (e.g., "this explains all social behavior").  
    - *Vagueness* (e.g., "addressing cognitive dynamics").  
  - **Next:** If evasive, note "phenomenon unclear" but proceed. If clear, go to Q2.  

  **Question 2: What are the steps in the explanatory chain?**  
  - **Look at:** The sequence from initial conditions to the phenomenon.  
  - **Sufficient answer:** 3–5 discrete steps, each with an input and output (e.g., "Step 1: Cuticle variation → Step 2: Odor learning → Step 3: Response threshold").  
  - **Evasion examples:**  
    - *Single-step delegation* (e.g., "then the module handles it").  
    - *Placeholder steps* (e.g., "a process of integration occurs").  
    - *Skipping levels* (e.g., jumping from "genes" to "behavior" with no intermediate).  
  - **Next:** If steps are missing, note gaps. Go to Q3.  

  **Question 3: What carries the explanatory load at each step?**  
  - **Look at:** The entity, capacity, or process responsible for each step’s output.  
  - **Sufficient answer:** A mechanism described concretely (e.g., "Hebbian learning adjusts neural connections").  
  - **Evasion examples:**  
    - *Labeling without mechanism* (e.g., "innate capacity," "emergent property").  
    - *Circular reference* (e.g., "the bonding property causes bonding").  
    - *Black boxing* (e.g., "the brain computes it").  
  - **Next:** If any step evades, note which one(s). Go to Q4.  

  **Question 4: Is the load-carrier’s capacity derived, licensed, or fundamental?**  
  - **Look at:** How the proposal justifies each load-carrier’s ability to work.  
  - **Sufficient answer:**  
    - *Derived:* Output of prior steps (e.g., "neural circuit built in Step 1 enables Step 2").  
    - *Licensed:* Cited evidence (e.g., "as shown in Smith et al. 2020").  
    - *Fundamental:* Explicitly called a starting point with defined function and failure conditions (e.g., "this receptor’s activation triggers X; failure if blocked by drug Y").  
  - **Evasion examples:**  
    - *Hand-waving* (e.g., "it’s well-known," no citation).  
    - *Unjustified fundamentality* (e.g., "this is just how evolution works" with no failure test).  
    - *Assumed capacity* (e.g., "the device processes language").  
  - **Next:** If a load-carrier lacks derivation, licensing, or fundamental status, flag as "potential skyhook." Go to Q5.  

  **Question 5: For fundamental posits, are function and failure defined?**  
  - **Look at:** Only steps flagged as fundamental in Q4.  
  - **Sufficient answer:** Clear operational definition and falsifiability (e.g., "property X is measured by assay Y; it fails if manipulation Z disrupts it").  
  - **Evasion examples:**  
    - *Tautology* (e.g., "it works because it’s fundamental").  
    - *No test* (e.g., "it’s necessary for stability" without saying how to falsify).  
    - *Vague metric* (e.g., "assessed by expert judgment").  
  - **Next:** If insufficient, confirm skyhook. Else, go to Q6.  

  **Question 6: Does the chain skip necessary levels?**  
  - **Look at:** Alignment between the phenomenon (Q1) and the steps (Q2). Focus on levels (e.g., neural, cognitive, behavioral).  
  - **Sufficient answer:** Steps connect the phenomenon’s level to lower levels without gaps, or argue why gaps are irrelevant (e.g., "musical structure maps note-by-note to neural activity").  
  - **Evasion examples:**  
    - *Redefining the phenomenon* (e.g., "the ‘real’ phenomenon is dopamine, not emotion").  
    - *Dismissal* (e.g., "higher levels are epiphenomenal" without evidence).  
    - *Glossing* (e.g., "obviously, chemistry explains behavior").  
  - **Next:** If levels are skipped and the phenomenon is unchanged, flag as "potential greedy reductionism."  

  #### Stopping Conditions  
  - **Crane verdict:** All Q2 steps are present; Q3 load-carriers are specified; Q4 capacities are derived, licensed, or fundamental; Q5 fundamentals are defined; and Q6 shows no unaddressed level-skipping.  
  - **Skyhook verdict:** Any step has a load-carrier that fails Q4 and Q5 (i.e., unexplained capacity doing critical work).  
  - **Greedy reductionism verdict:** Q6 identifies level-skipping, and the proposal does not reconstruct the phenomenon.  
  - **Hand to panel:** Phenomenon (Q1) is too vague to assess, or verdict hinges on a **value judgment** (marked below).  
    - **Value judgment:** Whether a level is "necessary." Standard: If the phenomenon’s description (e.g., "music pleasure") implies a level (e.g., psychological) ignored by the explanation, it’s greedy unless the proposal redefines the phenomenon *persuasively*.  

  ---

  ### 2. Battery of Tests for Greedy Reductionism  
  Use these probes when Q6 suggests level-skipping. Apply during Q2–Q6.  

  1. **Composition Step Request**  
     - **Probe:** "From your lowest level, show the step-by-step assembly to the phenomenon."  
     - **Cleared:** Explicit account (e.g., "dopamine release in nucleus accumbens → reward feeling → aesthetic appraisal").  
     - **Greedy sign:** Silence, substitution (e.g., "pleasure is dopamine"), or hand-waving (e.g., "it’s emergent").  
     - **Legitimate reduction check:** If they provide composition *and* preserve the phenomenon (e.g., explain why music-specific patterns matter), it’s clear.  

  2. **Phenomenon-Feature Audit**  
     - **Probe:** "Does your explanation cover all key features of the phenomenon (e.g., cultural variation in music)?"  
     - **Cleared:** Maps features to mechanisms (e.g., "cultural exposure trains reward pathways").  
     - **Greedy sign:** Dismisses features as "noise" or redefines them away.  

  3. **Intervention Test**  
     - **Probe:** "If we tweak the high-level phenomenon (e.g., change a musical phrase), does your low-level account predict the change?"  
     - **Cleared:** Predictions align (e.g., "altered phrases reduce dopamine").  
     - **Greedy sign:** No bidirectional link (e.g., "dopamine is the cause, so the rest is irrelevant").  

  4. **Multi-Level Bridge Probe**  
     - **Probe:** "Identify one intermediate level (e.g., cognitive for behavior) and describe how it connects."  
     - **Legitimate reduction clear:** Explicit bridging (e.g., "neural firing rate → decision threshold → behavior").  
     - **Deflection vs. clear:** Cleared if the bridge is described; deflected if they call it "trivial" or "future work."  

  ---

  ### 3. Worked Applications  

  **Proposal A: Language acquisition device.**  
  - **Q1:** Phenomenon: Infants’ rapid language learning. *Sufficient.*  
  - **Q2:** Steps: Input → Device → Output. *Gap: No internal steps for the device.*  
  - **Q3:** Load-carrier: Device’s "internal rules." *Evasion: No mechanism.*  
  - **Q4:** Capacity: Not derived, not licensed. Called "fundamental idealization." *Potential skyhook.*  
  - **Q5:** Fundamental? No function/failure defined (e.g., no test for when "rules" fail). *Skyhook confirmed.*  
  - **Q6:** Not reached.  
  - **Verdict:** Skyhook. The device does all work unexplained.  
  - **Turned by:** Q5. Idealization isn’t fundamental without tests.  

  **Proposal B: Social insect recognition.**  
  - **Q1:** Phenomenon: Nestmate discrimination. *Sufficient.*  
  - **Q2:** Steps: Cuticle variation → Odor learning → Comparison → Response → Selection. *Complete.*  
  - **Q3:** Load-carriers: Variation, learning, etc. *Mechanisms specified.*  
  - **Q4:** All licensed (documented in other species). *Derived or licensed.*  
  - **Q5:** No fundamentals claimed. *N/A.*  
  - **Q6:** Levels connected (molecular → individual → evolutionary). *No skip.*  
  - **Verdict:** Crane.  

  **Proposal C: Music and dopamine.**  
  - **Q1:** Phenomenon: Music-induced pleasure/chills. *Sufficient.*  
  - **Q2:** Steps: Acoustic pattern → Dopamine release → Pleasure. *Skips psychological level.*  
  - **Q3:** Load-carrier: Dopamine. *Specified but unexplained for music.*  
  - **Q4:** Capacity: Licensed for reward generally, but not music-specific. Not fundamental. *Potential skyhook.*  
  - **Q5:** Not fundamental. *N/A.*  
  - **Q6:** Skips levels (acoustic → neural, ignoring cognitive structure). *Greedy sign.*  
    - **Greedy test:** Composition step missing (no link from dopamine to musical features). Phenomenon redefined ("pleasure is dopamine").  
  - **Verdict:** Greedy reductionism.  

  **Proposal D: Bonding property for institutions.**  
  - **Q1:** Phenomenon: Institutional persistence. *Sufficient.*  
  - **Q2:** Steps: Bonding property → Stability. *Gap: No steps for how property works.*  
  - **Q3:** Load-carrier: Bonding property. *Evasion: Defined operationally as "whatever causes stability."*  
  - **Q4:** Capacity: Not derived/licensed. Treated as fundamental. *Potential skyhook.*  
  - **Q5:** Fundamental? Function defined as "causing stability," but failure test is circular (fails if stability fails). *Insufficient: tautology.*  
  - **Q6:** Not reached.  
  - **Verdict:** Skyhook. Property is unexplained, doing all work.  
  - **Against first impression:** Panel is enthusiastic, but Q5 exposes circularity.  

  ---

  ### 4. What This Procedure Cannot Do  

  **Expected misfires:**  
  - **Good explanation flagged:** A novel crane with many small steps may be misread as a skyhook if one step is unfamiliar (e.g., a new mechanism). Mitigate by checking Q4 licensing strictly.  
  - **Bad explanation passes:** A skyhook broken into trivial substeps (e.g., "Step 1: Input → Step 2: Magic → Step 3: Output") might slip through if substeps evade Q3.  

  **Judgment calls disguised as tests:**  
  - Q5 (fundamental posit adequacy): Conceals judgment on whether the failure test is *independent* (e.g., if "bonding property" fails only when stability does, it’s circular).  
  - Q6 (necessary levels): Relies on interpreting the phenomenon’s "level" (e.g., is "music pleasure" psychological or neural?). Standard: Use the proposal’s own description.  

  **If a panel member rejects crane/skyhook vocabulary:**  
  - They might argue: "All science uses abstractions; labeling them as skyhooks is unfair."  
  - **Response:** This procedure doesn’t ban abstractions—it checks if they’re *justified* (licensed, derived, or fundamental). Flagged proposals lack justification, leaving work undone.  

  **Advice for applicants with skyhook-flavored proposals:**  
  - "Your explanation relies on [capacity X], which isn’t derived from prior steps or independently grounded. To strengthen:  
    1. Break down [X] into sub-steps.  
    2. Cite evidence for [X]’s capacity.  
    3. If [X] is fundamental, define what it *does* and how we’d test if it fails (e.g., an experiment).  
    I can’t prescribe solutions, but these moves address the architecture."  

  **Final note:** This procedure assesses *explanatory structure*, not truth or innovation. It flags when work is deferred or levels skipped. Use it as a diagnostic, not a verdict on merit—some skyhooks may be placeholders for valid research.
