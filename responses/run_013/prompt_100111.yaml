        - But the deflationary reading: Node Y also carries information about sentiment in the training data (because it was correlated), but it's not used. And in the new data, Node Y does not correlate with sentiment. But Node X does. 
        - However, the representation in Node X is just a number. It doesn't inherently mean anything; we assigned it. The box doesn't know what "sentiment" is; it's just a mechanism. 
        - Also, could we have designed the box differently? For example, we could have used Node Y for output and achieved the same on the training data, but then it would fail on the new data. So the training data underdetermines the mechanism.

  8. (5 min) Scoring: Tally points for predictions.

  **Debrief Mapping:**

  - The observation phase (decoding) shows that both features are recoverable from the internal states.
  - The prediction challenge and its outcome (especially if they chose the wrong feature) shows that recoverability does not guarantee causal role.
  - The intervention phase shows that causal role can be tested, but note: they needed to do interventions to see it.
  - The underdetermination: the training data could be explained by two different mechanisms (using sentiment or length) but only one works on the new data. However, without the new data, how would they know?
  - The reveal: the box was designed to use sentiment, so in that sense it represents sentiment. But what does it mean to represent? The deflationary view: it's just a causal mechanism. The realist view: there is a fact of the matter because we designed it that way.

  The philosophical vocabulary to introduce in debrief:
  - Realism about representation: the box was designed to have node X represent sentiment, and it does.
  - Instrumentalism: the ascription of representation is just a useful way to predict behavior; but the box only has internal states that are causally active.
  - Gap between decodability and use: node Y was decodable for length, but not used. So carrying information is not sufficient for representation in the causal sense.
  - Underdetermination of mechanism by behavior: the training data alone could not distinguish between a box that uses sentiment and one that uses length.
  - What makes one candidate feature the one represented? Causal role? Or decodability? Or design?

  **What will go wrong:**

  1. Groups might not try to decode both nodes. They might focus on node Y because it's easy. Encourage them to try to understand both nodes.

  2. In the prediction, they might split and some groups choose sentiment. That's okay, because they will be correct. The activity will show that there was a conflict.

  3. In intervention, they might not understand they can set nodes independently. The operator should explain: "You can set node X to 0 or 1, and node Y to 0 or 1, in any combination."

  4. The new words might not be clear in sentiment. Use unambiguous words.

  **What the activity cannot reproduce:**

  - The toy has a designed ground truth: we know what the representation is because we made it. In real systems, there is no designer's intent to fall back on.
  - The internal states are human-legible (numbers) and the features are human concepts. In real networks, the features may not align with human concepts, and the internal states are high-dimensional and not easily interpretable.
  - The activity relies on discrete states and simple rules, while real networks are continuous and complex.

  In the debrief, we must highlight that in real systems, we don't have a ground truth from a designer, and the underdetermination is more severe. Also, the causal structure is not as easily testable by intervention because we can't always set individual neurons to values.

  **Full Packet:**

  Materials to prepare:
  - Index cards for inputs: 
     - Training set: 6 positive long words, 6 negative short words. Examples:
          Positive long: excellent, wonderful, outstanding, fantastic, terrific, joyous (6)
          Negative short: bad, poor, awful, sad, mean, dire (6)
     - Test set: "love", "gloomy"
  - For the black box: 
     - Two envelopes or small boxes labeled "Node X" and "Node Y".
     - Cards to place in them: for each node, cards with "0" and "1".
  - A fixed list for the operator: for each word in the training set and test set, what is the sentiment and length, and therefore the node values and output.
  - Scoreboard for predictions.

  Operator briefing (private):
  - You know the rules:
     - For any word, first determine if it's positive or negative (by the fixed list or by your knowledge; but be consistent).
     - Then, set Node X: 1 if positive, 0 if negative.
     - Set Node Y: 1 if the word has 5 or more letters, 0 otherwise.
     - Output: "Good" if Node X is 1, "Bad" if Node X is 0.
  - When given an input word, you output the category and, if requested, the values of Node X and Node Y.
  - When given an intervention request: 
     - The request will specify: for a given word (or without a word, just arbitrarily), set Node X to a value and/or Node Y to a value.
     - You set the node(s) as instructed.
     - Then compute the output based on Node X (ignore Node Y and the actual word after intervention).

  Rules for participants:
  - In the observation phase, you can give any word (from the training set) and request:
     a) The output
     b) The internal state (both Node X and Node Y)
  - In the intervention phase, you can choose a word and then set either Node X or Node Y to a specific value (0 or 1) and then see the output.

  Order of play:

  1. Introduction (5 min)
  2. Observation phase (20 min): groups take turns submitting words and recording outputs and internal states.
  3. Group work (15 min): build decoders and discuss.
  4. Prediction challenge (10 min): groups write down predictions for the two test words (output and internal state) and which feature (sentiment or length) they think the box uses for output.
  5. Reveal outputs for test words (5 min)
  6. Intervention phase (20 min): groups test by setting nodes.
  7. Final reveal of true wiring (5 min)
  8. Scoring and debrief (10 min) - might need to cut short, so adjust.

  Scoring scheme:
  - For each test word, 1 point for correct output prediction, 1 point for correct Node X prediction, 1 point for correct Node Y prediction. (6 points max per group)
  - Bonus: if they correctly identified the feature used (sentiment) in step 4, 2 points.

  But note: in step 4, they might say "we think the box uses sentiment", but then predict the output based on that and get it right. Or they might say "length" and predict accordingly. The feature identification is part of the prediction.

  In the debrief, we connect:
  - Observation and decoding -> recoverability of features
  - Prediction error (if occurred) -> underdetermination by observed data
  - Intervention -> testing causal role
  - True wiring -> the designed representation, but also the deflationary point that the nodes are just bits

  And then the open question: what does it mean to say the system "represents" a feature? Is it causal role? Is it decodability? Is it the system's function (as designed)? 

  We leave them unsettled.
answer: |-
  ### The Black Box Activity: "Feature or Artifact?"  
  **Objective:** Participants experience the asymmetry between decodability and causal efficacy in representation, confronting underdetermination and the gap between behavior and mechanism.  

  ---

  ### **Materials & Preparation**  
  **Time to Prep:** 30 minutes  
  **Materials:**  
  - **Index cards (40):**  
    - 20 for **inputs**: Words split into four categories (see table below).  
    - 10 for **node values** (0/1) to place in envelopes.  
    - 10 blank cards for predictions/interventions.  
  - **Envelopes (6):**  
    - 2 labeled **"NODE A"** (causal node).  
    - 2 labeled **"NODE B"** (non-causal node).  
    - 2 labeled **"OUTPUT"**.  
  - **Pens, tables (4), a whiteboard for scoring.**  
  - **Printed operator instructions (1 copy, confidential).**  

  **Input Words (Training Set):**  
  | Word      | True Sentiment | True Length | Notes                          |  
  |-----------|----------------|-------------|--------------------------------|  
  | Joy       | Positive       | Short       | Correlated: Short = Negative   |  
  | Hate      | Negative       | Short       | Correlated: Long = Positive    |  
  | Love      | Positive       | Short       | **Test word (breaks correlation)** |  
  | Gloom     | Negative       | Long        | **Test word (breaks correlation)** |  
  | ... (add 10 more: 5 short/negative, 5 long/positive, e.g., "Woe"/short/neg, "Hope"/long/pos) |  

  **Input Words (Test Set):**  
  - "Love" (positive/short), "Gloom" (negative/long) – *withhold until prediction phase*.  

  **Black Box Setup (Ground Truth):**  
  - **Node A (Causal):** Represents **sentiment** (0 = negative, 1 = positive). Determines output.  
  - **Node B (Non-causal):** Represents **length** (0 = short, 1 = long). Stored but ignored.  
  - **Output Rule:** "Positive" if Node A = 1, "Negative" if Node A = 0.  
  - **Key Asymmetry:** Node B is human-legible (length is obvious), Node A is coded (sentiment requires decoding).  

  **Operator Prep (Private Briefing):**  
  *You (or a TA) operate the box. Memorize this:*  
  1. **For any input word:**  
     - Set Node A = 1 if positive, 0 if negative.  
     - Set Node B = 1 if long (≥5 letters), 0 if short.  
     - Output = "Positive" if Node A = 1, else "Negative".  
  2. **When participants request:**  
     - **Observe:** Reveal output + Node A/B values.  
     - **Intervene:** Set Node A/B to specified value (e.g., "Set Node B to 0"), then recompute output *based solely on Node A*.  
  3. **Test words ("Love"/"Gloom"):**  
     - "Love": Node A=1 (positive), Node B=0 (short) → Output="Positive".  
     - "Gloom": Node A=0 (negative), Node B=1 (long) → Output="Negative".  

  ---

  ### **Roles & Rules**  
  **Participants:**  
  - 14 students, seated in 4 groups (3-4 per table).  
  - **Group Tasks:** Observe, decode, intervene, predict.  
  - **Operator:** You (instructor) or a TA. Run the box privately (e.g., at a separate desk).  

  **Rules:**  
  1. **Observation:** Groups submit words, receive output + Node A/B values.  
  2. **Intervention:** Groups set Node A/B to 0/1, see resulting output.  
  3. **Prediction:** Commit to output for unseen words (points at stake).  
  4. **No Peeking:** Groups cannot see others’ requests. Operator never reveals ground truth.  

  ---

  ### **Timeline (90 Minutes)**  
  **0:00–0:10 | Intro & Setup (10 min)**  
  - "Today, we investigate a black box that classifies words. Your goal: figure out how it works. You can:  
    1. **Observe:** Submit words, see outputs and internal states (Nodes A/B).  
    2. **Intervene:** Change Node A or B, see how output shifts.  
    By the end, you’ll predict its behavior on new words—points on the line!"  
  - Distribute input cards (training set only).  

  **0:10–0:35 | Observation Phase (25 min)**  
  - Groups take turns submitting words to the operator.  
  - Operator reveals:  
    - Output (e.g., "Negative").  
    - Node A/B values (e.g., "Node A=0, Node B=0").  
  - **Critical Moment:** Groups discover:  
    - Node B decodes easily (0/1 = short/long).  
    - Node A requires correlation (e.g., they notice Node A=1 → positive, but *why?*).  
  - *Predictable Issue:* Groups focus on Node B (human-legible). *Solution:* Ask, "What might Node A represent?"  

  **0:35–0:50 | Intervention Phase (15 min)**  
  - Groups request interventions (e.g., "Set Node B to 1 for ‘Hate’").  
  - Operator sets the node, reports new output.  
  - **Critical Moment:** Groups collide with asymmetry:  
    - **Intervene on Node B (e.g., set to 1 for "Hate"):** Output unchanged (still "Negative").  
    - **Intervene on Node A (e.g., set to 1 for "Hate"):** Output changes (to "Positive").  
  - *Predictable Issue:* Confusion when Node B changes but output doesn’t. *Solution:* Remind groups to record all results.  

  **0:50–1:00 | Prediction Phase (10 min)**  
  - Introduce test words: "Love" (positive/short) and "Gloom" (negative/long).  
  - Groups commit to:  
    - Predicted output for each word.  
    - Confidence rating (1–5).  
  - **Scoring (Whiteboard):**  
    - **+3 pts:** Correct output prediction.  
    - **+1 pt:** Correct confidence (if prediction matches reality).  
    - **Max 6 pts/group.**  
  - *Predictable Issue:* Groups split—some trust Node B (predict "Negative" for "Love"), others Node A (predict "Positive").  

  **1:00–1:10 | Test Reveal & Scoring (10 min)**  
  - Operator runs "Love" and "Gloom":  
    - "Love": Output="Positive" (Node A=1, Node B=0).  
    - "Gloom": Output="Negative" (Node A=0, Node B=1).  
  - Award points. Most groups trusting Node B lose points.  

  **1:10–1:20 | True Wiring Reveal (10 min)**  
  - **Double-Edged Reveal:**  
    1. "Ground truth: Output uses Node A (sentiment), ignores Node B (length)."  
    2. **Puncture Decoding:** "Node B perfectly decoded length, yet it was causally inert."  
    3. **Puncture Causality:** "Node A caused outputs, but its ‘sentiment’ label is *our* gloss. The box just pushes 0s/1s."  
  - **Underdetermination Highlight:**  
    - "Before interventions, both nodes explained training data. Before the test, evidence didn’t settle which node mattered."  

  **1:20–1:30 | Debrief (10 min)**  
  **Map Activity to Philosophy:**  
  | Activity Moment          | Philosophical Concept                          | Key Question                                                                 |  
  |--------------------------|-----------------------------------------------|------------------------------------------------------------------------------|  
  | Node B decodes perfectly | **Decodability ≠ Representation**             | Does recoverability imply the system "represents" the feature?                |  
  | Node A interventions     | **Causal Efficacy**                           | Does causal role make representation "real"?                                 |  
  | Prediction conflict      | **Underdetermination of Mechanism**           | Can behavior alone reveal what’s represented?                                |  
  | True wiring reveal       | **Realism vs. Instrumentalism**               | Is representation in the system, or just in our useful story?                |  
  | Test-word surprise       | **Predictive Payoff of Belief**               | Why "believe" in a feature if it’s practically useful, even if underdetermined? |  

  **Final Reflection:**  
  - "You experienced:  
    - A feature (length) that was decodable but useless.  
    - A feature (sentiment) that was causal but required decoding.  
    - Belief in a feature (length) had *practical stakes* (points), even though evidence was incomplete.  
  - **Open Question:** What would make one feature ‘the’ representation—causal role, decodability, designer intent, or something else?"  

  ---

  ### **What the Activity Cannot Replicate**  
  **1. Designed Ground Truth:**  
     - In real systems, there’s no privileged "true wiring." Philosophers debate whether representation is observer-relative or intrinsic.  
     - **Supply in Debrief:** "In real ML, we lack a designer’s blueprint. This makes underdetermination deeper: we can’t ‘reveal’ the truth, only infer."  

  **2. Human-Legible Parts:**  
     - Real networks use distributed, high-dimensional states—not tidy 0s/1s. Features are often entangled and sub-symbolic.  
     - **Supply in Debrief:** "Here, nodes aligned with human concepts. Real systems may ‘represent’ features unrecognizable to us, forcing instrumentalism."  

  **3. Intervention Fidelity:**  
     - Setting real neurons/weights is noisy and holistic. Our interventions are clean and isolated.  
     - **Supply in Debrief:** "Real interventions (e.g., ablation) affect many features at once. Our toy isolates causality artificially."  

  **Predictable Issues & Fixes:**  
  - **Groups ignore Node A:** *Fix:* Hint, "Node A changes often—map it to word properties."  
  - **Interventions confuse:** *Fix:* Operator repeats rules: "After intervention, I recompute output *only* from Node A."  
  - **Prediction chaos:** *Fix:* Use confidence ratings to gamify uncertainty.  

  ---  
  **Outcome:** Groups leave conflicted—decoding and intervention pulled them in opposite directions, and the reveal destabilizes both realist and instrumentalist intuitions. The activity forces engagement with the gap between evidence and mechanism, priming deeper debate in subsequent sessions.
