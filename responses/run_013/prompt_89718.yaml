answer: |-
  ## Harmonices Astrologicae: Contributor Style Guide & FAQ (Rev. MCMXXIV)

  **1. On Fundamental Principles & Rejection of Vulgar Superstition:**
  Harmonices Astrologicae exists to advance *astronomia reformata*, a natural philosophy grounded in celestial geometry and harmonic proportion. The vulgar preoccupation with Zodiacal "signs" (arbitrary stellar groupings), "houses" (a geocentric fiction), and planetary "rulerships" (devoid of geometric basis) is expressly forbidden. These are the tools of mountebanks. Our enquiry concerns the *aspects* – the angular relationships formed between celestial bodies – and the harmonic ratios (diapason, diapente, diatessaron, etc.) they embody. The Soul, both human and *anima mundi*, possesses an innate receptivity to these proportions, akin to the ear discerning consonance and dissonance. Predictions, therefore, are not decrees of fate, but probabilistic assessments of environmental consonance/dissonance acting upon the soul's inherent harmonic structure.

  **2. Technical Specifications: Chart Casting (Abridged):**
     *   **2.1 Ecliptic Coordinates Only:** Plot longitudinal positions of Sun, Moon, and Planets (Mercury through Saturn; Uranus is irrelevant noise until geometrically proven otherwise). Latitude is generally disregarded unless specifically investigating a proposed *inclinatio harmonica*.
     *   **2.2 The Void of Houses:** The traditional twelve houses are abolished. Instead, calculate only the *Angular Relations* relative to the Horizon and Meridian at the moment in question: Ascendant (Eastern Horizon), Descendant, Midheaven (Meridian), and Imum Coeli. These points represent moments of heightened harmonic potential, like the tonic in a scale. Do **not** divide the sky into arbitrary sectors.
     *   **2.3 Aspects: The Sole Determinants:** Identify aspects (conjunction, sextile, square, trine, opposition) between bodies and the angular points. Tolerance is strictly ±5° for major aspects; wider orbs indicate harmonic insignificance. **Crucially:** Assess the *exact harmonic ratio* approximated by the angular separation (e.g., 180° = 1:2 [octave], 120° ≈ 2:3 [fifth], 90° ≈ 3:4 [fourth]). Tables converting degrees to nearest significant harmonic ratio are mandatory appendix material. Prioritize configurations forming resonant polygons (e.g., grand trine as equilateral triangle).

  **3. Addressing Client Queries: The Marital Conundrum (Example):**
  Should a querent demand to know "Shall I marry?" or "To whom?", the following protocol applies:
     *   **Step 1:** Discourage the question as fundamentally vulgar. Marriage, as a social contract, lacks a singular harmonic signature.
     *   **Step 2:** If pressed, recast the query: "The enquiry pertains to the potential for harmonic resonance between two souls, mediated by celestial configurations influencing receptivity to specific proportional relationships during periods of social conjunction."
     *   **Step 3:** Calculate the harmonic configurations present at the querent's birth (*nativitas*) relevant to relational consonance (e.g., Venus-Moon aspects embodying simple ratios). **Then** compare these to the harmonic configurations active at potential moments of significant social interaction (e.g., meeting a suitor, a betrothal feast). Avoid definitive statements. Phrase thusly: "The prevailing celestial harmonics during the third lunation post-solstice suggest a period of heightened receptivity to relational configurations approximating the diatessaron (4:3), potentially favouring interactions characterised by complementary, stabilising proportions. Whether this manifests as marriage, a profound intellectual partnership, or simply an improved relationship with one's tailor is contingent upon terrestrial circumstances and individual volition."

  **4. Meteorological Prognostication: Permissible Boundaries:**
  While Kepler himself diligently recorded weather correlations, *Harmonices Astrologicae* maintains strict boundaries:
     *   **Permitted:** Theoretical models exploring potential harmonic influences of planetary configurations (especially Sun-Moon aspects and lunar phases) upon atmospheric *tensions*, understood as analogous to string vibrations. Correlations must be presented statistically over long periods, never as specific forecasts.
     *   **Forbidden:** Predicting rain for Tuesday, the severity of next winter's frost, or the path of storms. Such specificity belongs to almanac peddlers. State: "The prevailing sesquiquadrate aspects between Jupiter and Saturn suggest a period of atmospheric *dissonantia*, increasing the probability of turbulent conditions in regions already predisposed by terrestrial geography." Do not specify the region.

  **5. Phrasing Predictions: The Music of the Spheres:**
  Predictions must eschew deterministic language and employ musical/harmonic metaphors:
     *   **Acceptable:** "A period of enhanced intellectual consonance is probable," "Potential for harmonic friction in financial matters," "Resonance with opportunities requiring initiative may be heightened," "Dissonance suggests caution in legal undertakings."
     *   **Unacceptable:** "You will get a promotion," "Beware thieves on the Ides," "A tall dark stranger approaches." Translate all findings into the language of proportional resonance. E.g., a challenging square aspect becomes "a prevailing 90° angularity embodying the sesquialtera proportion (3:2), introducing a dynamic tension potentially productive of effortful harmonies if consciously integrated."

  **6. Handling the Imperious Patron:**
  Patrons demanding "Yes or No?" or "Should I invade Pomerania?" present a pedagogical opportunity.
     *   **Response Template:** "Honoured Patron, celestial harmonics do not dictate terrestrial actions; they illuminate the prevailing environmental consonances and dissonances. A configuration rich in perfect fifths (trines, 120°) suggests periods favourable for initiatives requiring harmony and expansion, whereas an abundance of dissonant minor thirds (semi-squares, 45°) suggests periods demanding careful integration of tensions. The decision to act, and how, remains yours, informed by an understanding of the cosmic *clima*." Offer a detailed harmonic analysis *instead* of a simple answer. If they insist on "Yes/No," refer them politely to a traditional astrologer (while subtly implying their intellectual deficiency).

  **7. Regarding the Founder's... Legacy:**
  It is acknowledged that Johannes Kepler, in his practical endeavours, occasionally cast nativities employing some traditional elements and offered counsel to emperors. Contributors shall:
     *   **Acknowledge:** Cite his theoretical works (*De Fundamentis*, *Harmonices Mundi*) as foundational. His practical charts are valuable primarily as historical datasets for testing harmonic hypotheses, not as methodological exemplars for contemporary practice.
     *   **Contextualise:** Emphasise that Kepler operated within the constraints of his time, seeking patronage to fund his astronomical work. His enduring genius lay in identifying the *true* harmonic core beneath the dross of tradition. His practical compromises are not endorsements of vulgar technique.
     *   **Do Not Emulate:** Under no circumstances should contributors justify the use of zodiacal signs, houses, or traditional rulerships by citing Kepler's client work. His writings explicitly repudiate them as unscientific. Focus solely on the harmonic aspects he identified and quantified.

  **8. Final Admonition: Rigour Over Relevance:**
  The primary aim of *Harmonices Astrologicae* is the advancement of astrological knowledge as a branch of natural philosophy grounded in geometry and harmonics. While practical application is a noble secondary aim, **clarity and mathematical precision in describing celestial configurations and their inherent proportions take absolute precedence over producing easily digestible, actionable predictions for the layperson.** If a configuration yields ambiguous or statistically weak harmonic correlations, state this plainly. It is better to publish a meticulously calculated null result concerning the purported influence of Ceres on turnip yields than to force a specious "prediction." Our science resides in the geometry, not the guesswork.
