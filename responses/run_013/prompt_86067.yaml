prompt: |-
  ok so I have to run my high school philosophy club next wednesday, theres 14 of us and we get the libary for 50 minutes after school. I want to do the thing where people say you did something on purpose when the side effect was bad but not when the side effect was good, even though you knew it was coming either way. I know its a real thing that people have run studies on but I really dont want to stand up and just tell everyone, I want us to walk into it ourselves and only find out what its called at the very end. So dont give me a lecture outline, give me an activity we actually run.

  Round one needs new cases, not the famous ones everyone has already seen on youtube, and they should be things that could genuinely happen to kids at our school, like somebody running for student council or redoing the practice schedule for a team. Same story twice basically, once where the side effect hurts somebody and once where it helps somebody, with the exact same amount of knowing either way, and everyone answers privately on a slip of paper with three seperate questions on it: did they know it would happen, did they do it on purpose, do they deserve to get blamed. Round two is the twist and its the part I care about most: keep the story identical but make the one doing it our club as a whole, like we all voted on it, and then also a version where its just a script or a bot one of us wrote that runs by itself and wrecks something. Then before we tally anything, everyone flips their slip over and writes down what they think the club as a whole will have answered, so we can all be wrong together out loud.

  The debrief should be a big three column table on the board where the numbers do the talking, and it should point at which column split and which column definately didnt, then finally say what the whole thing is called, plus the actual fight about it, which I think is whether on purpose is even a seperate question from whose fault it is, or whether we were secretly answering the blame question three times and calling it three questions.

  Then the last bit: what will predictably go wrong the first time I run this and how I fix it while standing there, and be honest about the one thing the activity cant show no matter how well it goes. Also give me all of it as exactly five numbered things, one or two sentences each, no intro and no wrap up, in this order: setup and materials and timing, round one, round two, the tally and the debrief, then what goes wrong plus what it cant show.
reasoning: |-
  We are going to design a session for a high school philosophy club with 14 members, 50 minutes in the library. The goal is to explore the concept of the Knobe Effect (also known as the side-effect effect) without revealing it until the end. The activity should be interactive and based on relatable scenarios.

  The plan:
  1. Setup and materials and timing (5 minutes)
  2. Round one: Two scenarios (one with a bad side effect, one with good) with private answers on slips (15 minutes)
  3. Round two: Twist with the club as the agent and a bot scenario, plus predictions (15 minutes)
  4. Tally and debrief with a three-column table and reveal (10 minutes)
  5. What goes wrong and what it can't show (5 minutes for reflection, but the answer is part of the plan)

  Let's break it down:

  1. **Setup and materials and timing (5 minutes)**
     - Materials: Prepare slips of paper (about 14 for each round, but each slip has multiple questions) and pens. Also, have a whiteboard or large paper for the tally table.
     - Timing: Explain that we're going to do a thought experiment about decision-making and side effects. Hand out slips (one per person for round one) and pens. Keep it brief.

  2. **Round one: Two scenarios with private answers (15 minutes)**
     - Present two new scenarios (one with a bad side effect, one with a good) that are relatable to high school students. Each scenario should have the same level of foreknowledge.
       - Example bad: A student running for student council proposes a new rule that they know will make the popular kids happy but will also exclude some less popular students from events. They do it to get elected.
       - Example good: The same student running for council proposes a rule that they know will make the popular kids happy and will also include more students in events (a good side effect). They do it to get elected.
     - For each scenario, ask three questions on the slip (for both scenarios, so 6 answers per person):
       - Did they know [side effect] would happen?
       - Did they do [side effect] on purpose?
       - Do they deserve to get blamed (for the bad) or credited (for the good)?
     - Note: For the good scenario, change "blamed" to "credited" in the third question. But in the bad scenario, it's blamed.

  3. **Round two: Twist with club and bot (15 minutes)**
     - Present two new scenarios (or adapt the first ones) but now the agent is the philosophy club (we voted) and then a bot.
       - Club scenario (bad side effect): The philosophy club votes to change the meeting time to a slot that we know will conflict with the math club's meeting, causing them to lose members. We do it because the new time is better for us.
       - Club scenario (good side effect): The same vote to change the meeting time, but we know it will free up a room for the math club to expand, helping them. We do it because the new time is better for us.
       - Bot scenario (bad): One of us writes a script to automatically post club reminders on the school forum, but we know it sometimes posts during classes, disrupting them. We run it anyway because it's efficient.
       - Bot scenario (good): The same script, but we know it sometimes posts during lunch, when it reaches more people and boosts attendance for all clubs. We run it anyway because it's efficient.
     - For each scenario (club bad, club good, bot bad, bot good), ask the same three questions (on a new slip) but adjust the agent: for club, "we"; for bot, "the programmer" or "the club" (for blame?).
     - Then, before collecting, ask everyone to flip the slip and write their prediction for the club's overall answers (for the club scenario) for each question (e.g., "For the club bad scenario, I think the club will mostly say: knew? yes, on purpose? no, blame? yes" etc.). They don't have to predict the exact numbers, but the trend.

  4. **Tally and debrief (10 minutes)**
     - Tally the results for round one (both scenarios) and round two (club and bot scenarios) on a three-column table (one column per question) for each scenario. For each scenario, show the percentage (or count) of "yes" for each question.
     - Focus on the splits: In the bad scenario, people will likely say "on purpose" and "blame", but in the good, they won't say "on purpose" or "credit". The knowledge will be high in both. The twist: for the club scenario, the same effect might appear but then we see if the prediction matches. For the bot, it might be different.
     - Reveal: This is called the Knobe Effect (or side-effect effect). The fight: Is "on purpose" just a way of assigning blame? Or is there a real difference? We might have been using blame to define intention.

  5. **What goes wrong plus what it can't show (5 minutes)**
     - What goes wrong: Some students might not see the difference between the scenarios and answer similarly for both. Fix: In the moment, highlight the side effect and ask, "Did the agent aim for that, or just know it would happen?" Also, timing might run over, so skip the bot if needed.
     - What it can't show: It doesn't prove why we have this bias (whether it's about blame or something deeper) and it might not capture the full moral complexity.

  Now, let's write the five numbered points as requested (one or two sentences each, no intro/wrap-up):

  1. **Setup and materials and timing (5 min):** Have pre-printed slips (two per person: one for round one, one for round two) and pens; quickly explain we'll judge scenarios on knowledge, intention, and blame/credit. (Time: 5 min)

  2. **Round one (15 min):** Read two relatable scenarios (one with bad side effect, e.g., student council rule excluding some; one with good, e.g., including more) with same foreknowledge; each person answers privately on a slip: knew? on purpose? blame/credit? (Time: 5 min per scenario + 5 min for both)

  3. **Round two (15 min):** Present two new scenarios: club voting (bad: harms math club; good: helps math club) and a bot (bad: disrupts class; good: boosts clubs); answer same questions. Then flip slip and predict club's overall answers for the club scenario. (Time: 10 min for scenarios and answers, 5 min for predictions)

  4. **Tally and debrief (10 min):** On board, make a three-column table per scenario (knowledge, on purpose, blame/credit) and fill in percentages; point out splits (knowledge consistent, on purpose and blame vary by side effect); reveal Knobe Effect and debate if intention is separate from blame. (Time: 5 min tally, 5 min discussion)

  5. **What goes wrong plus what it can't show:** Predictably, some may not grasp the side effect as unintended, so clarify during the scenario; if time short, skip bot. The activity can't show whether the effect is about moral responsibility or a cognitive bias in language. (Time: reflection during debrief, but no extra time)
answer: |-
  Here are the five numbered steps:

  1. **Setup and materials and timing (5 min):** Print 14 slips for each round (two questions per side). Slips for Round 1 have: "Scenario A/B: 1. Knew? 2. On purpose? 3. Blame/Credit?". Round 2 slips add "4. Predict club’s answers." Use a whiteboard for tally tables. Start with a 1-minute intro: "We’ll judge scenarios—answer privately."  

  2. **Round one (10 min):** Present two *new* scenarios. First: *Bad effect*—"Alex changes soccer practice times, knowing it will make the team fitter but *exclude* injured players." Second: *Good effect*—Same change, but now it *includes* homeschooled players. All answer slips privately (1 min per scenario + 1 min write-up).  

  3. **Round two (15 min):** Twist: "Our club votes to fundraise by selling snacks, knowing it will *bankrupt* the art club’s bake sale (bad) / *boost* the art club’s publicity (good)." Then bot twist: "A club member’s script auto-orders supplies, knowing it will *deplete* the school’s budget (bad) / *donate* extras to charity (good)." Answer same three questions, then flip slip and predict the club’s *average* answers for the club scenario.  

  4. **Tally and debrief (15 min):** Tally Round 1/2 results on a whiteboard with three columns (Know/On Purpose/Blame) per scenario. Highlight: Knowledge stays high in both, but "on purpose" and blame spike in *bad* scenarios (especially human/club ones). Reveal: "This is the *Knobe Effect*. Debate: Are we just judging blame and calling it ‘on purpose’?"  

  5. **What goes wrong plus what it can’t show:** Predictably, students conflate "knew" with "on purpose," muddying the split; fix by re-reading the scenario mid-activity and emphasizing: "They *knew* it would happen, but was it their *goal*?" The activity *can’t* show whether this bias is innate or cultural—only lab studies do that.  

  ---  
  **Scenarios cheat sheet:**  
  - *Bad Effect (Original)*: Exclusion/Depletion/Bankruptcy  
  - *Good Effect (Original)*: Inclusion/Donation/Boost  
  - *Bot Twist*: Script ordering (neutral intent, known side effect)
