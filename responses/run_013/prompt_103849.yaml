prompt: |-
  I'm a third-year student doing a joint maths-and-philosophy degree and something from a probability seminar has been bugging me for weeks. Here's the pattern I keep noticing and I don't have a word for it. Take a big open conjecture. People say things like "it's probably true", "the evidence points that way", "smart money says it holds". Fine. Then someone proves it and overnight everyone's confidence snaps to one. The weird part is what happens to my earlier "probably": it doesn't get refuted. Nobody says I was wrong to be 70% sure -- there's no way the world could have gone otherwise, the thing was always true or false, so in hindsight that 0.7 wasn't tracking anything. But it also wasn't mere ignorance, because it was reason-sensitive: when a partial result landed my confidence genuinely should have moved, and if you'd offered me a bet at silly odds I'd have taken it. Same in reverse for a conjecture that quietly dies -- the confidence deflates without any experiment ever failing.

  And there's a second half. If I say A is 70% likely and A→B is 90% likely, I seem committed to B at roughly 60%+, but that feels wrong, because B might get proved or refuted by methods that have nothing to do with A. The ordinary probability rules seem to over-constrain me, yet I can't just bin them, because conditioning on new lemmas does seem to work.

  So: is there a name for this state, or a literature? I know I'm somewhere near "we can't be certain of everything and still have to reason", but I want the specific thing -- what is my credence even attached to when the proposition is a necessary truth, why does it act like a probability in some respects and not others, and what's the real difference between being *wrong* and being *overtaken* by a proof? If there's no established term please coin one and tell me where its edges are, because I'm not after a bare label -- I want to know what it isn't, and how it differs from just calling it ignorance or just calling it ordinary Bayesian belief. Work through it carefully and maybe start by brainstorming the nearest existing notions before committing. Act like a philosopher of mathematics who works on rational credence rather than a textbook.
reasoning: |-
  Okay, the user is a third-year joint maths-and-philosophy student struggling with a conceptual tension in how we assign probabilistic credences to mathematical conjectures. They've noticed two phenomena: (1) pre-proof credences (like saying a conjecture is "70% likely") seem to vanish without critique once proven, despite feeling reason-responsive at the time, and (2) ordinary probability rules feel misapplied when chaining implications (A→B) for necessary truths.  

  First, I need to unpack why this bothers them. Their core confusion isn't about calculation—it's ontological. What *is* that 70% tracking if the truth was always necessary? They're also hinting at epistemology: how can credences be rationally updated via partial results if the thing was already true/false? The emotional subtext is frustration with "vanishing" confidence—it *felt* substantive but now seems illusory.  

  Key philosophical touchstones come to mind:  
  - **Logical omniscience problem**: Bayesianism assumes we know all logical consequences, which is absurd for math. We need non-ideal models.  
  - **Proof discovery as information gathering**: Even for necessary truths, learning a proof *is* gaining information about the logical structure of the world.  
  - **Degrees of belief vs. truthmakers**: Their 70% isn't about the *fact* (which is fixed) but about their *access* to the proof.  

  For the second issue (chaining implications), the tension arises because standard probability assumes A and B are contingent. But in math, if B is proven independently, the A→B link becomes irrelevant—it's not a causal chain. This suggests credences for mathematical statements aren't pure probabilities but track *epistemic accessibility paths*.  

  Existing frameworks that might help:  
  1. **Hintikka's possible worlds semantics for math**: Worlds here are consistent extensions of current knowledge. "Probability" measures how many paths to B go through A vs. other axioms.  
  2. **Formal learning theory**: Credences as weights on potential proof strategies. When a proof is found, all other strategies collapse.  
  3. **Degrees of provability**: Unlike truth, provability admits gradients—e.g., "we have a 70% complete proof sketch."  

  But none fully resolve their "vanishing confidence" unease. I propose framing it as *counterfactual robustness*:  
  - Your 70% was rational *given what could have been discovered*. If a disproof existed, you’d have likely found traces (failed lemmas, etc.).  
  - Once proven, the alternative vanishes from the epistemic landscape—it was never *really* possible, but you couldn’t know that.  

  For the implication chaining, I’d say:  
  - When you assign P(B) ≥ P(A) × P(A→B), you’re estimating B’s provability *via A*. But if B gets proven another way, that estimate wasn’t *wrong*—it was conditional on a path that became obsolete.  

  The coined term should reflect this ephemeral, path-dependent nature. *Epistemic liquidity*? Too vague. *Proof-conditional credence*? Clunky. Maybe *modal credence*—it quantifies over epistemically possible worlds, not metaphysical ones.  

  Sharp edges to highlight:  
  - Unlike ignorance (which is static), this credence updates rationally with new mathematical evidence.  
  - Unlike frequentism, it’s not about physical randomness but about density of proof clues.  
  - It *doesn’t* satisfy standard additivity if "proof events" aren’t independent (e.g., A and A→B may share syntactic dependencies).  

  Final pivot: Their angst about being "overtaken" vs. "wrong" reveals a deeper point. In science, being wrong means misjudging reality; in math, it means misjudging *our access* to reality. The 70% was never about the territory—it was a map of your cognitive trailheads. When the summit is reached, the map burns.
answer: |-
  What you're grappling with is a profound tension in the epistemology of mathematics, where rational credence collides with necessary truth. This isn't just "uncertainty"—it's a distinctive phenomenon at the intersection of **rational non-omniscience**, **logical constraint**, and **temporal dynamics in proof discovery**. Below, I'll dissect it step-by-step: existing concepts, why they fall short, a proposed framework, and coined terminology with sharp edges.

  ---

  ### **1. Brainstorming Nearest Existing Notions**
  - **Logical Uncertainty**: The study of credence for necessary truths (e.g., Garrabrant, Demski). But it often treats math like empirical probability (e.g., "P=NP is 80% likely") without resolving the "snap to certainty" paradox.
  - **Bayesian Epistemology**: Your credence *is* Bayesian—but applied to *your epistemic state*, not the proposition itself. The "snap" occurs because proof gives infinite evidence.
  - **Possible Worlds Semantics**: If you model credence over possible worlds (e.g., worlds where Goldbach's Conjecture is true/false), proof eliminates worlds, collapsing probability to 1 or 0. But this feels artificial for math—all worlds share the same mathematical facts.
  - **Degrees of Provability**: Analogous to "degrees of belief in provability" (e.g., probabilistic logic). Still, it doesn't explain why pre-proof credence isn't "wrong" post-hoc.
  - **Defeasible Reasoning**: Math proofs are non-monotonic in practice (lemmas can be overturned). Yet your case involves *certain* proof, not revision.

  **Why these fall short**: They either ignore the *necessity* of mathematical truth ("it was always true/false") or treat credence as merely psychological (ignoring its rational updatability).

  ---

  ### **2. Core Insight: Credence Tracks Epistemic Access, Not Ontic Truth**
  Your "70%" isn't about the *proposition* (which is timelessly true/false). It's about **the expected feasibility of verifying it**, given:
  - Current evidence (partial results, failed counterexamples).
  - Known proof techniques (e.g., "this conjecture resists analytic methods").
  - Social-epistemic factors (e.g., "many experts tried and failed").

  When proof arrives, your credence doesn't get "refuted"—it gets **obsoleted**. The object of belief shifts:
  - **Pre-proof**: Belief in *discoverability* ("given our tools, 70% chance we'll find a proof").
  - **Post-proof**: Belief in *truth* (100%).

  This explains why:
  - Bets pre-proof are rational (you're betting on *your ability to confirm*).
  - Confidence "snaps" (proof removes all discoverability uncertainty).
  - You weren't "wrong" (your credence correctly tracked the pre-proof epistemic landscape).

  ---

  ### **3. The Implication Chaining Problem (A → B)**
  Your intuition is correct: standard probability rules (e.g., `P(B) ≥ P(A) × P(A→B)`) **over-commit** you. Why?
  - In mathematics, `A→B` is a *necessary* truth. If `B` is proved independently, your credence for `B` shouldn't depend on `A`.
  - **The flaw**: You're applying static probability to a dynamic process of *proof discovery*. When you say "`P(A→B) = 0.9`", you're not estimating a logical fact (which is 1 or 0)—you're estimating the likelihood that *someone will derive* `B` from `A` *using available methods*.

  **Resolution**: Chaining works only if you condition on **proof paths**:
  - Your 60% estimate for `B` assumes `B` will be proven *via `A`*. If `B` is proven another way (e.g., through `C`), your chain was irrelevant but not irrational. Probability rules constrain *path-dependent* credences, not final truth.

  ---

  ### **4. Coined Term: **Proof-Conditional Credence (PCC)****
  **Definition**: *The rational degree of belief that a mathematical statement is discoverably true (or false) within a specified framework of techniques, evidence, and time.*  
  - **Attaches to**: *Epistemic access* under current mathematical practice (e.g., "P=NP is 80% likely" ≈ "Given our current tools, there's an 80% chance we'll find a proof or disproof").  
  - **Updates via**: New lemmas, failed proofs, or shifts in methods (e.g., new topology tools).  
  - **Snaps to 0/1** when proof arrives because access is achieved.

  **Why PCC (not ignorance or standard Bayes)?**  
  | Aspect                | Ignorance             | Standard Bayesian     | **Proof-Conditional Credence (PCC)** |  
  |-----------------------|-----------------------|------------------------|--------------------------------------|  
  | **Attaches to**       | Lack of information   | State of the world     | **Feasibility of verification**      |  
  | **Updates on proof**  | N/A (static)          | Corrects belief        | **Obsoletes itself**                 |  
  | **Snap to 1/0**       | Not applicable        | Error revealed         | **Access achieved**                  |  
  | **Chaining (A→B)**    | No constraints        | Rigid constraints      | **Path-dependent constraints**       |  
  | **"Wrong" vs "Overtaken"** | Always "wrong" if false | Always "wrong" if false | **Never "wrong"—only surpassed**    |  

  **Edges of PCC**:  
  - **Not subjective**: It's constrained by mathematical evidence (e.g., a failed counterexample *must* raise PCC).  
  - **Not timeless**: PCC evaporates upon proof; it makes no claim about eternal truth.  
  - **Not probabilistic truth**: PCC isn't "partially true" — truth is binary; PCC tracks the effort to reveal it.  
  - **Fails for empirically false math**: If a statement is mathematically false, high PCC *is* error (e.g., claiming 70% PCC for a subtly inconsistent conjecture).  

  ---

  ### **5. Philosophical Grounding: Why PCC Works**  
  - **Anti-realist flavor**: PCC aligns with quasi-constructivist views (e.g., Tymoczko's "proof as social act"). Truth is fixed, but *verification* is a process.  
  - **Rational recoverability**: PCC explains why pre-proof confidence isn't mocked: it correctly weighted paths to discovery. If all paths had led to disproof, your PCC would have dropped.  
  - **Formalizable**: Model PCC as a probability over *possible proof/disproof discoveries* within a computational budget (e.g., bounded by current math knowledge).  

  ---

  ### **6. Literature Pathways**  
  Start with:  
  - **Fallis (1997)** on epistemic goals in math (not just truth, but understanding).  
  - **Baker (2007)** on non-deductive reasoning in math (e.g., probabilistic evidence for conjectures).  
  - **Learned-Miller (2022)** on "evidential probability in mathematics".  
  - **Formal learning theory** (e.g., Kelly) for how finite evidence justifies credence.  

  This *feels* like it breaks probability because standard probability assumes contingent facts. But in math, PCC is a probability over **epistemic events** (proofs), not facts. When you say, "A is 70% likely," you're really saying: "I estimate a 70% chance that a proof will be found before a disproof, given our toolkit." That’s why it vanishes—it was always a wager on discovery.
