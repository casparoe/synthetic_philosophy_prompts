  ### Decision Tree: When Can Information Be Bad for You?  

  **Root Claim**: Some information is bad for me, and I may be rational to avoid it.  
  **Standard Result**: For an agent who maximizes expected utility (EU), with fixed options, stable preferences, no other observing agents, and no psychological distortions, free information has non-negative expected value. The agent can always fall back on the act chosen without the information. Every claim that information is harmful must either deny one of these assumptions or locate harm outside EU’s scope.  

  #### Branch Nodes and Leaves  
  1. **Does the information change the available options?**  
     - *Yes* → **State-Dependent Action Accounts** (e.g., information removes the best action).  
       - *Most awkward commitment*: Treats actions as contingent on the state in a way that makes the EU framework inapplicable, even when intuitively the "option set" seems fixed.  
       - *Diagnostic case*: A bridge collapses after a storm; learning this removes "cross the bridge" as an option.  
       - *Status*: Settled (violates fixed-options assumption).  
     - *No* → Proceed to 2.  

  2. **Does the information change the agent's preferences?**  
     - *Yes* → **Transformative Experience/Preference Change Accounts** (e.g., learning alters core values).  
       - *Most awkward commitment*: Denies the "same agent" chooses before and after learning, raising puzzles of identity and rationality.  
       - *Diagnostic case*: Learning of a genetic risk changes one’s life priorities, leading to regret over past choices.  
       - *Status*: Contested (e.g., L.A. Paul vs. orthodox Bayesians).  
     - *No* → Proceed to 3.  

  3. **Does the agent maximize EU without regret, anxiety, or weakness of will?**  
     - *No* → **Psychological/Non-EU Accounts**:  
       - *Branch 3a*: **Regret/Ambiguity Aversion Models** (e.g., information causes anticipated regret).  
         - *Most awkward commitment*: Allows information to be harmful even when it improves decision accuracy, violating EU axioms like independence.  
         - *Diagnostic case*: A chess player avoids learning the opponent’s plan, knowing it will induce defensive play (weakness of will) and regret over aggressive alternatives.  
         - *Status*: Contested (e.g., Loomes & Sugden vs. Savage).  
       - *Branch 3b*: **Anxiety/Weakness-of-Will Models** (e.g., information triggers uncontrollable distress or akrasia).  
         - *Most awkward commitment*: Requires psychological states (e.g., anxiety) to be non-compensable by outcomes, challenging EU’s completeness.  
         - *Diagnostic cases*:  
           - A person avoids learning untreatable disease risk due to anxiety.  
           - A patient requests test results only if treatable to avoid distress.  
         - *Status*: Contested (e.g., Caplin vs. behavioral economists).  
     - *Yes* → Proceed to 4.  

  4. **Do other agents observe the information?**  
     - *Yes* → **Strategic/Signaling Accounts** (e.g., information triggers adverse reactions).  
       - *Most awkward commitment*: Harm arises purely from others’ responses, not the information itself, making "value" dependent on social context.  
       - *Diagnostic case*: A job applicant avoids genetic testing, fearing employers might access results.  
       - *Status*: Settled (game theory; violates no-other-agents assumption).  
     - *No* → Proceed to 5.  

  5. **Is the alleged harm located in the outcome?**  
     - *Yes* → **Orthodox EU Bayesianism**: Rejects the root claim under these conditions.  
       - *Most awkward commitment*: Cannot explain why anyone would refuse free information without invoking other assumptions (e.g., anxiety as an outcome cost).  
       - *Status*: Settled (non-negative value follows from axioms).  
     - *No* → Proceed to 6.  

  6. **Where is the harm located?**  
     - **In the epistemic state itself** → **Epistemic State Accounts** (e.g., ignorance is bliss).  
       - *Most awkward commitment*: Values knowledge instrumentally but allows it to be intrinsically harmful, creating tension with veritism.  
       - *Diagnostic cases*:  
         - A person avoids untreatable disease risk info due to the burden of knowing.  
         - True belief via test result vs. lucky guess: the latter is better if knowledge is harmful.  
       - *Status*: Contested (e.g., Pettigrew vs. critics of epistemic utility).  
     - **In the agent's standing** → **Agency/Responsibility Accounts** (e.g., information undermines autonomy).  
       - *Most awkward commitment*: Implies avoiding information can affirm agency, even when it leads to worse outcomes.  
       - *Diagnostic case*: A patient avoids test results to preserve hope and autonomy.  
       - *Status*: Contested and underexplored (e.g., literature on willful ignorance).  

  #### Key Notes  
  - **Settled vs. Contested**:  
    - Settled: State-dependent actions, strategic interactions, and Orthodox EU (when assumptions hold) are consensus positions.  
    - Contested: All other leaves involve active debates (e.g., how to model psychology, whether knowledge has intrinsic value).  
  - **Empty Branches**:  
    - Harm located solely in the outcome (without other violations) is incoherent per Orthodox EU, hence no leaf exists at that branch.  
  - **Indistinguishable Cases**:  
    - The disease risk case (no prevention/treatment) might be explained by psychological effects (Leaf 3b) or epistemic state (Leaf 6a), depending on whether harm stems from anxiety or the intrinsic burden of knowledge. The tree cannot separate these without further psychological/veritistic commitments.  
  - **Diagnostic Cases Mapped**:  
    - Chess player: Psychological effects (Leaf 3a or 3b).  
    - Patient (condition on treatability): Psychological effects (Leaf 3b).  
    - Disease risk: Psychological effects (Leaf 3b) or epistemic state (Leaf 6a).  
    - True belief pair: Epistemic state (Leaf 6a).  

  ---  
  **Handout Scope**: 6 branch nodes, 8 leaves. Designed for clarity in seminar discussion; integrates standard decision theory, epistemology, and behavioral economics.
