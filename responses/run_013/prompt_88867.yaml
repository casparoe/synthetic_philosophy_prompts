answer: |-
  ### Preliminary Notes  
  The phenomenon of "dirty hands" (DH) denotes acts undertaken by public officials that:  
  (a) **Violate deep prohibitions** of ordinary morality (e.g., torture, betrayal, deliberate harm to innocents);  
  (b) Are **politically necessary** to fulfill role-obligations (e.g., protecting citizens, preserving stability);  
  (c) Leave a **non-consequentialist residue** (guilt, moral taint) that cannot be expunged by good outcomes.  

  I count the following as DH cases:  
  - **Core Case (1)**: Torture for urgent intelligence, lying to preserve coalitional unity.  
  - **Mundane Cases (7)**: Misreporting budgets to prevent panic, rationing that predictably kills identifiable persons.  
  - **Variable Cases (6)**: Acts driven by necessity rather than malice or pleasure.  

  Cases **excluded**:  
  - Spending treasury funds to save lives (2) → mere cost-bearing.  
  - "Lesser evil" with clean arithmetic (3) → no residue.  
  - Private actors committing identical acts → lacks public-office context.  

  ---

  ### Requirements for an Adequate Theory of Dirty Hands  
  *(Non-negotiable = N; Contested = C)*  

  1. **The Paradox Requirement (N)**  
     *Motivation*: Case 1 (core case). The theory must reconcile the simultaneity of moral wrongdoing and political justification without collapsing into consequentialism or absolutism.  
     *Constraint*: Must preserve the tension: "It was wrong, yet right to do."  

  2. **Residue Specification (N)**  
     *Motivation*: Case 2 (dirt ≠ cost). The theory must define the non-instrumental residue (e.g., moral taint, guilt) and explain why it persists despite justification. Must specify if/how it can be discharged (e.g., punishment, resignation).  

  3. **Demarcation from Neighboring Concepts (N)**  
     *Motivation*: Case 3 (distinctions). The theory must distinguish DH from:  
     - Moral dilemmas (no justified option),  
     - Regret over permissible acts,  
     - Ordinary wrongdoing (no role-justification),  
     - "Lesser evil" without residue,  
     - Realism (no morality in politics).  

  4. **Agency and Collective Responsibility (C)**  
     *Motivation*: Case 4 (citizens' complicity). The theory must address why the *official* bears unique dirt despite acting as an agent. If citizens share blame, it must explain why punishment targets the official.  
     *Contested*: Some (e.g., Walzerians) insist officials alone bear dirt; others (e.g., institutionalists) see this as a metaphor for role-corruption.  

  5. **Price-Paying Obligation (C)**  
     *Motivation*: Case 5 (demand for suffering). The theory must clarify whether residue *requires* the official to seek punishment/resignation. If so, it must explain why this doesn’t negate the act’s justification.  
     *Contested*: Absolutists demand price-paying; consequentialists reject it as contradictory.  

  6. **Intent-Risk Isolation (N)**  
     *Motivation*: Case 6 (variable morality). The theory must make intent and risk-taking central: DH only arises when the official acts reluctantly, for genuine public ends, under uncertainty. Pleasure or indifference negates DH.  

  7. **Mundacity Scope (N)**  
     *Motivation*: Case 7 (mundane cases). The theory must cover everyday governance (e.g., rationing, bureaucratic lies), not just emergencies.  

  8. **Ex Ante Action-Guidance (N)**  
     *Motivation*: Case 8 (uncertainty). The theory must provide deliberative tools *before* acting, under incomplete knowledge. It cannot rely on hindsight to validate choices.  

  ---

  ### Incompatibility Analysis  
  **The Central Tension**: Requirements 1 (Paradox), 5 (Price-Paying), and 8 (Ex Ante Guidance) are **jointly unsatisfiable** under prevailing frameworks.  
  - If the act is *justified* (per Requirement 1), demanding punishment (Requirement 5) contradicts its justification.  
  - If residue *requires* punishment, the act cannot be fully justified → collapses into ordinary wrongdoing.  
  - Requirement 8 exacerbates this: An official cannot know *ex ante* whether punishment will be deserved, as justification hinges on outcomes yet unknown.  

  **Result**: Any theory satisfying Requirements 1 and 8 must reject Requirement 5 (price-paying as obligation). Residue may instead manifest as guilt or taint, not institutional penalty.  

  ---

  ### Exclusionary Power & Hidden Assumptions  
  - **Most Exclusionary Requirement**: Requirement 1 (Paradox) excludes:  
    - **Consequentialism** (denies wrongdoing if outcomes justify means),  
    - **Absolutism** (denies justification for prohibited acts),  
    - **Virtue Ethics** (struggles to explain why a "virtuous" politician would choose moral corruption).  
  - **Smuggled Premise**: Requirement 2 (Residue) assumes a **non-consequentialist morality** where certain acts are intrinsically wrong regardless of context. This is debated (e.g., by realists).  

  ---

  ### Verdict on the Phenomenon  
  **Confidence: High (85%)**  
  - DH is **distinct from moral dilemmas**: Dilemmas involve no justified choice; DH involves a justified *violation*. The residue (guilt without regret) is irreducible to dilemma-related anguish.  
  - **The ex ante demand is coherent but radical**: It forces the theory to focus on *process* (intent, risk-assessment, role-obligation) rather than outcomes. A viable theory must function as a "moral risk protocol" for uncertain choices.  
  - **What remains**: A theory of DH must be **role-relative** (explaining why *officials* face unique permissions), **anti-absolutist** (allowing violations), yet **non-consequentialist** (preserving residue). No existing camp fully achieves this.  

  **Pushback**: Your constraint (ex ante guidance) *does* trivialize some DH theories (e.g., Walzer’s, which requires hindsight). But this is productive: It reveals DH as a problem of *decision-making under moral risk*, not tragic storytelling. Proceed by formalizing the politician’s burden: *"You may violate X, but only if Y, and you will carry Z regardless."*
