prompt: |-
  I am assembling the agenda for a small, three-year working group — a handful of philosophers plus two game theorists — on what one might call the theory of moral compromise: the idea, modeled loosely on exchange, that two parties with divergent value systems can sometimes reach arrangements that each regards as better than the status quo, so that there are gains from trade in morality itself. No one in the group does empirical work, and I would rather not have the agenda collapse into a literature survey. I need you to tell me which open questions most deserve the group's effort and to defend the ordering.

  Take the following as the candidate questions, though you should feel free to add, drop, re-cut, or recombine them:

  1. Does the exchange analogy survive incommensurability? If two parties' values cannot be placed on a common scale, can a contract curve — the set of arrangements neither party would veto — even be defined, or is the appearance of mutual improvement an artifact of the representation we choose?
  2. Is there a principled line between compromising on a value and compromising on a policy that merely expresses it — and if so, which trades fall on the first side of it?
  3. Can a sincere commitment be traded without hypocrisy? Each party continues to regard the other's position as wrong; what, if anything, makes it coherent to exchange forbearance on one issue for forbearance on another?
  4. Do limits of consent bind? If a party freely agrees to weaken a commitment, does the agreement make the trade permissible, or are some commitments of a kind that cannot licitly be alienated at all?
  5. How are absent parties — future people, children, non-human animals — represented in a bargain struck only among present, consenting parties?
  6. What constrains the distribution of the gains? Is a morally acceptable compromise one that satisfies some fairness condition on how the surplus is split, and does the analogy to a difference principle or to a bargaining solution do real work here?
  7. Does the framework presuppose that each party can rank whole bundles, and what becomes of it when a single agent's own values conflict — compromise within one person rather than between persons?

  Two of us have floated reframings I would like you to weigh. One wants to recast the whole enterprise as an Edgeworth box for values and to ask whether the contract curve remains well-defined once preferences are incomplete or the value space is non-Archimedean. The other insists that most real political compromise is not issue-trading at all but splitting the difference on a single issue, which need not be a Pareto improvement and may leave both parties worse off than some untried alternative — so that a theory built on the exchange model may be solving a problem that rarely arises.

  Please give me a prioritized agenda rather than a survey. For each item you place near the top, say why it is upstream of the others, how tractable it is for people with philosophical and game-theoretic tools but no new data, how neglected it is, and what result or argument over the next few years would move it up or down the list. Where two candidate questions are really one question in disguise, say so; where the group should deliberately not spend time, say that too. End with a single machine-readable line giving your ranking, in the form Priority order: Q3 > Q1 > ... , using the numbers above and adding Q8, Q9, ... for any questions you introduce.
reasoning: |-
  Okay, let me approach this systematically. The user is assembling a working group agenda on moral compromise theory, with specific concerns about avoiding literature surveys and focusing on high-impact questions. 

  First, I need to understand the core tension: the exchange model versus real-world compromises. The Edgeworth box reframing and the single-issue compromise critique are particularly important here. The former challenges technical foundations while the latter questions the entire premise. 

  Looking at the questions, Q1 (incommensurability) feels fundamental - if we can't define mutual improvement across value systems, the whole analogy collapses. It's upstream because answers here shape all other questions. Plus, game theorists can contribute immediately with tools for incomplete preferences. 

  Q6 (distribution) seems unexpectedly urgent. Even if trades exist, unfair splits could poison cooperation. The user mentioned "gains from trade in morality itself" - but if one side captures all gains, is it still moral? Bargaining solutions like Nash or Kalai-Smorodinsky offer concrete starting points.

  Q2 (value vs policy compromise) and Q3 (hypocrisy) are deeply connected. Trading policy forbearance while maintaining core values might avoid hypocrisy (Q3), but only if we can cleanly separate the two (Q2). These should be tackled together as they both address the "how" of compromise.

  The absent parties question (Q5) feels secondary - important but not blocking. Consent limits (Q4) and internal conflicts (Q7) are significant but more specialized. The single-issue critique? That's the elephant in the room. If most compromises aren't Pareto improvements, we need to either adapt the model or justify its narrow scope. This deserves a dedicated slot as Q8.

  For prioritization: Q1 must come first because it's foundational. Q6 next because distributional fairness determines moral acceptability. Then Q2/Q3 together as the hypocrisy/implementation bundle. The rest follow based on dependency chains. The new Q8 gets priority over Q5/Q4/Q7 since it challenges the framework's relevance.

  The machine-readable ranking will reflect this: foundational issues first, then moral constraints, then implementation challenges, finally special cases. The group should avoid premature literature discussions and focus on constructing minimal viable models.
answer: |-
  Here is a prioritized agenda focusing on foundational, tractable, and neglected questions that unlock downstream progress, with justifications and tactical guidance:

  **Priority Order & Rationale:**  
  **Q1 > Q6 > Q3+Q2 (merged) > Q8 (new) > Q5 > Q4 > Q7**  

  1.  **Q1: Incommensurability & Contract Curve Definition**  
      *   **Why Upstream?** Until this is resolved, the entire exchange analogy lacks rigor. If mutual improvement is undefined under incommensurable values, the core framework collapses. Answers here constrain all other questions.  
      *   **Tractability:** Game theorists excel at formalizing incompleteness/non-Archimedean structures (e.g., using lattice theory, choice correspondences). Philosophers can analyze value ontology. No data needed—pure conceptual/modeling work.  
      *   **Neglect:** Often hand-waved in political philosophy; formal value theory rarely tackles multi-agent bargaining under incompleteness.  
      *   **Moves Up/Down:** *Up* if a minimal formal model defining "mutual improvement" sans common scale emerges. *Down* if proven intractable for relevant cases.  
      *   **Edgeworth Box Reframing:** **Integrate this here.** It's precisely Q1's core.  

  2.  **Q6: Distribution of Gains (Fairness Constraints)**  
      *   **Why Next?** Even if gains exist, *how they are split* determines moral permissibility (e.g., exploiting desperation). Addresses the "moral" in moral compromise.  
      *   **Tractability:** Game theorists can directly apply/adapt bargaining solutions (Nash, Kalai-Smorodinsky). Philosophers can evaluate fairness principles (e.g., is "moral surplus" subject to a difference principle?).  
      *   **Neglect:** Bargaining theory often assumes fixed threat points; moral philosophy rarely operationalizes fair division of *value gains*.  
      *   **Moves Up/Down:** *Up* if a compelling link between bargaining solutions and moral fairness is forged. *Down* if Q1 shows no meaningful gains exist.  

  3.  **Q3 + Q2: Hypocrisy & Value/Policy Distinction (Merged)**  
      *   **Why Merge & Here?** Q3 (hypocrisy) depends critically on Q2 (value vs. policy). Trading policy forbearance (Q2) avoids trading core commitments, resolving the hypocrisy concern (Q3). This is the *mechanism design* of moral trade.  
      *   **Tractability:** Conceptual analysis of commitment structures and "expression." Game theorists can model issue-linkage as a mechanism for sincere cooperation despite disagreement.  
      *   **Neglect:** Hypocrisy is debated, but rarely in the context of structured trade-offs. The value/policy line is underexplored for bargaining.  
      *   **Moves Up/Down:** *Up* if clear criteria for "non-betrayal" trades are defined. *Down* if Q1/Q6 show trades are either impossible or inherently hypocritical.  

  4.  **Q8: Scope of the Exchange Model (New Question - Addressing the Critique)**  
      *   **Question:** *Under what conditions is the exchange model (Pareto improvement via issue-trade) a relevant framework for real compromise, versus alternatives like splitting-the-difference or non-Pareto improvements?*  
      *   **Why Here?** Directly addresses the "splitting the difference" critique. Essential for grounding the theory's applicability.  
      *   **Tractability:** Philosophical analysis of political compromise cases. Game-theoretic modeling comparing efficiency of trade vs. other mechanisms under conflict.  
      *   **Neglect:** Theories of compromise rarely rigorously compare these models.  
      *   **Moves Up/Down:** *Up* if clear domains where trade is the primary mechanism are identified. *Down* if split-the-difference is shown to dominate, making Q1-Q7 largely academic.  

  5.  **Q5: Representation of Absent Parties**  
      *   **Why Here?** Assumes trades *among present parties* are possible (Q1-Q3) and fair (Q6). Focuses on externalities/agency.  
      *   **Tractability:** Extending existing models of trusteeship/fiduciary duty into bargaining setups. Game theory on bargaining with externalities.  
      *   **Neglect:** Standard bargaining theory ignores non-participants; moral theories of representation lack a bargaining component.  
      *   **Moves Up/Down:** *Up* if Q6 establishes robust fairness constraints applicable to trustees. *Down* if core model (Q1/Q8) fails.  

  6.  **Q4: Limits of Consent (Inalienability)**  
      *   **Why Lower?** Presupposes a valid trade exists (Q1-Q3) and focuses on whether *this specific* trade is permissible. More derivative.  
      *   **Tractability:** Analysis of concepts like autonomy, corruption, and moral corruption within contracts. Less obvious game-theoretic hooks.  
      *   **Neglect:** Well-trodden in debates on rights/selling organs/etc., but less so in multi-value bargaining.  
      *   **Spend Minimally:** Unless Q2/Q3 reveals trades touching core commitments, this may be peripheral.  

  7.  **Q7: Intrapersonal Conflict**  
      *   **Why Lowest?** Interesting, but distinct. The core agenda is *interpersonal* compromise. Intrapersonal conflict changes the ontology (one "party" vs. two).  
      *   **Tractability:** Connects to single-agent decision theory under moral uncertainty, a different field.  
      *   **Spend Minimally:** Briefly discuss if time permits, but prioritize the interpersonal core. It dilutes the group's focus.  

  **Deliberately Avoid:**
  *   Comprehensive literature surveys.
  *   Detailed case studies without clear theoretical payoff.
  *   Debating meta-ethics (e.g., moral realism vs. anti-realism) unless absolutely necessary for Q1.
  *   Q7 as a primary focus.

  **Machine-Readable Priority Order:**  
  `Priority order: Q1 > Q6 > Q3 > Q2 > Q8 > Q5 > Q4 > Q7`  
  *(Note: Q3 & Q2 merged conceptually for agenda slots, but retain labels for tracking. Q8 added.)*
