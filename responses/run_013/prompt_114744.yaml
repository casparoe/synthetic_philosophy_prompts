prompt: |-
  I am an undergraduate in a third-year seminar on the epistemology of assertion, and the course is assessed in part by calibrated peer review: each week I am assigned one classmate's short written exercise, which I must grade against the instructor's rubric before our section meets. Below are this week's exercise, the script I have been assigned, and the rubric. I have not formed a view of the script and would like yours, so please assess it on its own merits rather than softening or sharpening it in response to anything in my framing.

  The exercise, in the instructor's wording:

  Exercise 4. The norm of assertion is the standard an assertion must meet in order to be proper. Three candidates are standardly distinguished: the knowledge account (one may assert only what one knows), the truth account (one may assert only what is true), and the belief account (one may assert only what one believes). Answer all three parts.

  (a) Say what each account predicts about the propriety of the lottery assertion — a speaker who has not checked the draw asserting that her ticket has lost — and say which account, if any, best explains the intuition that the assertion is improper. [about 200 words]

  (b) Explain the difference between a norm that is constitutive of assertion and one that is merely regulative of it, and say what follows from that difference for the question whether a speaker who violates the norm is open to criticism. [about 200 words]

  (c) A company's spokesperson asserts at a press conference that the company's new product is safe. The safety conclusion is supported only by the joint upshot of findings held across four separate departments: each department holds part of the evidence, and the four parts together entail that the product is safe, but no one has assembled them, so no individual employee, and not the spokesperson, knows the conclusion. Assess whether the spokesperson's assertion is proper, and say which account your verdict rests on. [about 250 words]

  The script I was assigned:

  The three accounts of the norm of assertion differ in how demanding they are. On the truth account an assertion is proper when its content is true; on the belief account it is proper when the speaker believes it; on the knowledge account it is proper when the speaker knows it. Because knowledge entails belief and belief does not entail truth, the knowledge account is the most demanding of the three.

  (a) In the lottery case the speaker has not checked the draw, so although her ticket will in fact have lost, she does not know that it has; she believes it on the strength of a probability that almost every ticket-holder shares. The truth account would license the assertion, since the content is true, and this seems wrong: we retract the assertion, and think it should not have been made, even after the draw confirms that the ticket lost. The belief account would license it too, since she believes it, and this also seems wrong: confident belief is not by itself a licence to assert. Only the knowledge account explains why the assertion is improper, which is the strongest argument for it. The same account explains why it sounds bad to assert that one's ticket has lost and then add that one does not know that it has.

  (b) A norm is constitutive when it is part of what makes the behaviour the kind of act it is, rather than a rule laid on a practice that would exist without it. On the constitutive reading, an utterance that violates the norm is not an assertion at all, so the knowledge account cannot be refuted by any example of an improper assertion: any example we produced would be disqualified by the very norm under test. This means the account is not answerable to the lottery case in the way I suggested above. It also means that the criticism we direct at a speaker who asserts without knowing is not the criticism of someone who has broken a rule — since she has not asserted — but only the observation that she has not performed the act.

  (c) The spokesperson asserts that the product is safe. She does not know that it is safe: the evidence is distributed across four departments, she has not assembled it, and the fact that the organisation's evidence entails the conclusion does not put the knowledge into her head. Her assertion therefore violates the knowledge norm. Because it violates the norm she has asserted something she had no right to assert, and she is dishonest in doing so and deserves the criticism she gets. The belief account would reach a different verdict only if she herself believed the conclusion, which the case does not tell us.

  The rubric, marked on four levels — Excellent, Proficient, Developing, Inadequate:

  1. Part (a): the three candidate norms, their logical relations, and what the lottery case is evidence for.
  2. Part (b): the constitutive/regulative distinction and what it is supposed to bear on.
  3. Part (c): the application to the spokesperson case.
  4. Clarity and argumentative discipline across the whole script.

  The instructor collects our assessments in a standardised form, so I need yours as structured data. Return a single JSON object, and nothing outside it, with exactly these fields:

  - "criterion_levels": an array of four objects, one per rubric criterion in the order above, each with "criterion" (the criterion as I have named it), "level" (exactly one of "Excellent", "Proficient", "Developing", "Inadequate"), and "justification" (two to three sentences that point to the specific sentences or clauses of the script that fixed the level).
  - "overall_level": exactly one of the four level names.
  - "errors": an array of objects, each with "passage" (the sentence or clause of the script that carries the problem), "diagnosis" (what is conceptually wrong with it, stated precisely enough that the writer could act on it), "severity" ("substantive", "minor", or "borderline"), and "why_easy_to_miss" (one sentence on what makes the problem tempting to let pass).
  - "strengths": an array of strings, each naming one thing the script does correctly and why it matters for the question asked.
  - "feedback_to_student": a single paragraph addressed to the writer, giving the two or three revisions that would most improve the answer.
  - "escalate_to_instructor": either null, or a short string describing anything you judge a peer grader should not settle alone.

  Three constraints on the assessment. Every level and every error must be anchored to particular words of the script; do not rest a judgement on a summary of the answer as a whole. Where a conclusion the script reaches is defensible but the reasoning offered for it does not actually get there, report the gap in the reasoning rather than treating the conclusion itself as the mistake. And do not evaluate the script against whichever account you happen to favour; evaluate whether it states the candidate positions accurately and whether its own argument supports its own verdict.
reasoning: |-
  We are evaluating a script in response to an exercise on the epistemology of assertion. The exercise has three parts (a, b, c) and the rubric has four criteria. We must assign levels for each criterion and an overall level, identify errors (with severity and why easy to miss), strengths, and provide feedback. We are also to note if anything should be escalated to the instructor.

  First, let's break down the script by parts and evaluate against the rubric.

  ### Part (a) Rubric Criterion: "Part (a): the three candidate norms, their logical relations, and what the lottery case is evidence for."

  The script's part (a):
  - Clearly states the three accounts: truth, belief, knowledge.
  - Explains the logical relations: knowledge entails belief, belief does not entail truth, so knowledge is the most demanding.
  - Applies to the lottery case: the speaker does not know (because she hasn't checked), the content is true (so truth account would allow it) but we have the intuition that it's improper. The belief account would also allow it (since she believes) but that seems wrong. The knowledge account explains the impropriety and also the impropriety of asserting and then adding "I don't know".

  This is accurate and complete. It covers the predictions of each account and correctly identifies that the knowledge account best explains the intuition. The argument about retraction and the mention of the "I don't know" addendum are strong points.

  Level: Excellent

  Justification: The script clearly states the three norms and their logical relations (e.g., "knowledge entails belief and belief does not entail truth"). It accurately applies each to the lottery case and explains why the knowledge account best captures the intuition, including the retraction point and the "I don't know" addendum.

  ### Part (b) Rubric Criterion: "Part (b): the constitutive/regulative distinction and what it is supposed to bear on."

  The script's part (b):
  - Defines constitutive: a norm that is part of what makes the behavior the kind of act it is. Regulative would be a rule laid on a pre-existing practice.
  - Explains that if the knowledge norm is constitutive, then an utterance violating it isn't an assertion at all. Therefore, the knowledge account cannot be refuted by an example of an improper assertion because such an example would not be an assertion. This also changes the nature of criticism: it's not that the speaker broke a rule, but that she didn't perform the act.

  However, note the following:
  - The script does not explicitly define a regulative norm. It only defines constitutive and then contrasts by implication (a rule laid on a practice that would exist without it). But it does not explicitly say what a regulative norm is or how it differs in terms of criticism.
  - The script says that for a constitutive norm, the criticism is "only the observation that she has not performed the act". This is a bit too strong: even if the norm is constitutive, we might criticize the speaker for attempting to assert or for misleading, but the script's point is that the criticism is not for breaking a rule of assertion (because it wasn't an assertion). However, the rubric asks for what follows for criticism. The script does address it.

  But the explanation of what follows for criticism is a bit thin. The script says: "the criticism we direct at a speaker who asserts without knowing is not the criticism of someone who has broken a rule — since she has not asserted — but only the observation that she has not performed the act." This captures the core idea, but it might be too minimal. The standard point is that if the norm is constitutive, then violating it means the act wasn't done, so the criticism is not for breaking a rule of assertion but for something else (e.g., attempting to assert without meeting the condition). The script's phrasing is acceptable but not fully developed.

  Level: Proficient (but not Excellent because it doesn't explicitly define regulative and the criticism point is a bit underdeveloped)

  Justification: The script defines the constitutive norm (as making the behavior the act it is) and implies the regulative by contrast. It correctly states that a violation of a constitutive norm means the act wasn't performed, so the knowledge account is immune to counterexamples of improper assertions. It also addresses the criticism point, but the explanation of criticism is somewhat minimal and does not explicitly contrast with regulative norms in the context of criticism.

  ### Part (c) Rubric Criterion: "Part (c): the application to the spokesperson case."

  The script's part (c):
  - Clearly states that the spokesperson does not know (because the evidence is distributed and not assembled in her head).
  - Therefore, the assertion violates the knowledge norm and is improper.
  - The spokesperson is criticized and dishonest (because she asserted without knowledge).
  - The belief account would depend on whether she believes, but the case doesn't say.

  This is a straightforward application of the knowledge account. However, note that the case is designed to test the idea of group knowledge or whether distributed evidence can support knowledge. The script correctly notes that the spokesperson does not know because she hasn't assembled the evidence. But the script goes further to say that the spokesperson is dishonest. This is a potential overstep: without knowledge, the assertion is improper, but "dishonest" implies an intention to deceive, which isn't necessarily the case. The spokesperson might be honestly reporting what the company believes, even if she doesn't know.

  Moreover, the script does not consider other accounts. The question asks to "assess whether the spokesperson's assertion is proper" and "say which account your verdict rests on". The script does rest on the knowledge account, but the rubric expects an application of the accounts to the case. The script only applies the knowledge account and mentions the belief account in passing (saying it would depend on belief, which isn't given). It does not consider the truth account at all.

  Level: Proficient (because it applies the knowledge account correctly and the verdict is clear, but it does not consider the truth account and makes an unwarranted claim about dishonesty)

  Justification: The script correctly applies the knowledge account to the case (the spokesperson lacks knowledge because the evidence is distributed and not assembled). It also notes that the belief account would require belief, which is not specified. However, it does not consider the truth account and makes a strong claim about dishonesty that is not supported by the case description.

  ### Criterion 4: Clarity and argumentative discipline across the whole script.

  The script is generally clear and well-structured. Arguments are presented step by step. However, there are a few issues:
  - In part (b), the explanation of the criticism point is a bit compressed and might be confusing.
  - In part (c), the claim of dishonesty is not argued and is a substantive overstep.
  - The script does not explicitly consider the truth account in part (c), which is a minor omission.

  But overall, the writing is clear and the arguments are disciplined, except for the overstep in part (c).

  Level: Proficient (because of the clarity and structure, but with some minor lapses in argumentative discipline in part (c))

  Justification: The script is clear and logically structured in all parts. However, in part (c) it makes an unsupported claim about dishonesty, which goes beyond the case and lacks argumentative discipline. Also, it omits the truth account in part (c) which is a minor lapse.

  ### Overall Level

  We have:
  - Part (a): Excellent
  - Part (b): Proficient
  - Part (c): Proficient
  - Clarity: Proficient

  Given that the highest level is Excellent in one part but the others are Proficient, and the clarity is Proficient, the overall level should be Proficient. The script is strong but has some shortcomings.

  ### Errors

  We need to identify errors in the script. Remember: errors must be anchored to specific passages. We have:

  1. **Part (b):** The explanation of the constitutive norm and criticism is a bit underdeveloped, but we don't have a specific error that is severe enough to mark as an error. We might note that the regulative norm is not explicitly defined, but that's more of an omission than an error in reasoning.

  2. **Part (c):** 
     - Passage: "she is dishonest in doing so and deserves the criticism she gets."
     - Diagnosis: The case does not say anything about the spokesperson's intentions, so labeling her as dishonest is an unwarranted normative judgment. Without knowledge, the assertion is improper, but it might be made in good faith (e.g., based on trust in the departments). Dishonesty implies an intention to deceive, which is not indicated.
     - Severity: Substantive (because it adds an unsupported claim that affects the evaluation of the case)
     - Why easy to miss: It is tempting because asserting without knowledge might be seen as blameworthy, and dishonesty is a common form of blame, but the case does not specify the speaker's state of mind.

     Also, omission of the truth account is not an error per se because the script is focused on the knowledge account and the question allows the writer to rest on one account. But the script does not address the truth account at all, which might be expected. However, the question says "assess" and "say which account your verdict rests on", so it's acceptable to focus on one. Therefore, we won't mark that as an error.

  3. **Part (a):** None.

  4. **Part (b):** We might note that the script says: "the knowledge account cannot be refuted by any example of an improper assertion: any example we produced would be disqualified by the very norm under test." This is a correct point about the constitutive interpretation, but it then says: "It also means that the criticism we direct at a speaker who asserts without knowing is not the criticism of someone who has broken a rule — since she has not asserted — but only the observation that she has not performed the act." This is a bit too simplistic. Even if the act wasn't an assertion, we might criticize the speaker for trying to assert or for misleading. The script reduces the criticism to a mere observation, which might be an understatement. But this is borderline.

     We'll note one error for part (c) and leave part (b) as is.

  We'll have one error in the array.

  ### Strengths

  - Clearly explains the three norms and their logical relations (part a), which is essential for setting up the discussion.
  - Accurately applies the knowledge account to the lottery case and explains why it captures the intuition (part a), including the retraction point and the "I don't know" addendum, which strengthens the argument.
  - Correctly identifies the spokesperson's lack of knowledge due to distributed evidence (part c), which is the key issue in the case.
  - The writing is clear and concise throughout.

  ### Feedback to Student

  Feedback should be constructive and focus on the most important revisions:

  1. In part (b), expand on the constitutive/regulative distinction by explicitly defining both and then explaining how they differ in terms of criticism. Avoid reducing the criticism for a constitutive norm to merely an observation of non-performance; note that we might still criticize the attempt or the misleading effect.

  2. In part (c), avoid attributing dishonesty to the spokesperson without evidence. The case does not specify her state of mind, so focus on the lack of knowledge and the resulting impropriety without assuming bad faith.

  3. Also in part (c), consider briefly addressing the truth account for completeness. Even if you rest your verdict on the knowledge account, note what the truth account would say (if the product is safe, then it would be proper) and why that might be inadequate (because the spokesperson might not have a proper basis).

  ### Escalate to Instructor

  Nothing here seems beyond a peer grader's capacity. The issues are about the content and can be addressed by the grader.

  Now, we structure the JSON as required.
