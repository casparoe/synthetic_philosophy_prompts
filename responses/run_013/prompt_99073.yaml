  Now, contrasting theories. Consequentialism would say giving the chair maximizes good, so it's obligatory. But deontology, with its emphasis on rights, sees it as optional because the agent isn't obligated to relinquish their property. 

  For the contrast case, change the entitlement. If the chair belongs to the company, not the employee, then both theories might require offering it. The key variable is ownership. 

  But what if the entitlement is removed? Without ownership rights, consequentialism still demands the act, while deontology might not if other duties apply. A consequentialist might argue that rights are only valuable if they promote good, challenging the deontological stance. 

