  3. Overstatement or leap in part (ii): The student argues that because overdetermination breaks traditional accounts, we should abandon the causal question entirely. But this ignores that there are revised accounts (e.g., Mackie might allow disjunctive causes, or Lewis's disjunction) that can handle overdetermination. So the student doesn't consider that the causal question might be reformulated. This is an unsupported leap in the argument. 
     - Points: 1 (since it's a key part of the argument)
     - Hasty grader might let it slide because the student offers alternatives.

  Also, note an omission: The student doesn't explicitly say for part (i) that the counterfactual account is committed to saying that neither caused the war, but they do imply it. It's clear.

  Another omission: The student doesn't mention that for Mackie, there might be a disjunctive cause: the disjunction of the two factors might be a cause. But the question is about the two factors individually. So that's acceptable.

  BORDERLINE OR DEFENSIBLE CLAIMS:
  - The student says that overdetermination is a reason the Method of Difference is hard to apply. This is defensible because the Method of Difference requires finding a case where the effect is absent and the cause is absent, but in overdetermination, even if one cause is absent, the effect may still occur because of the other. So that's valid. But the student ties it to plurality of causes, which is a separate issue. We already docked for the conflation.
