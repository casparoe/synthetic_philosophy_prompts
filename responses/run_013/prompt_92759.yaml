  ### Key Tips  
  - **Pace Rigorously:** Allocate time strictly. Steps 1–3 are the make-or-break foundation.  
  - **Model Intellectual Struggle:** Say, "This *should* feel unresolved—if it doesn’t, we’ve misrepresented the challenge."  
  - **Cold-Call Sparingly:** Use voluntary responses for Steps 1/3; cold-call in Step 4 to pressure-test guilt arguments.  
  - **Embrace Silence:** After the check-for-understanding question, wait 10 seconds—don’t rescue them.  

  This plan isolates the "hard part" by methodically dismantling escape hatches. The ring—when purified—remains the most elegant tool for the job.
