  1. Round 1: Counterfactual Mugging
     - Ask the Heads group: How did you feel when you were asked to pay? Did you think about the Tails branch? Did you feel that by paying you were helping your Tails self? But you knew that your Tails outcome was already determined by your pre-commitment? How did that feel?
     - Ask the Tails group: How did you feel when you got 5 tokens (or not) based on your pre-commitment? Did you wish you had pre-committed to pay? Did you feel that your pre-commitment was binding?
     - Highlight: In the ideal counterfactual mugging, the predictor knows what you would do. We used your pre-commitment as a prediction. In reality, when you were in the Heads branch, you had the chance to change your mind, but that didn't affect the Tails branch because it was already fixed. But in the true problem, the predictor is perfect so your action in the Heads branch is what determines the Tails branch. And that creates the tension: you are in the branch where you are asked to pay, and if you don't, you save the money but you know that in the other branch you would have gotten a lot of money if you had paid. But since you are in this branch, you don't get that money. So why pay? But if you don't pay, then in the counterfactual world where the coin was Tails, you would have been worse off. But that world doesn't exist. This is the tension.

  2. Round 2: XOR Blackmail
     - Ask the threatened group: How did you feel when you received the threat? Did you pay? Why or why not?
     - Ask: Did you consider that the very fact that you received the threat meant that the blackmailer predicted you would pay? What did that make you think?
     - Ask the non-threatened group: How did you feel when you got the note? Did you feel relieved?
     - Highlight: In this scenario, the blackmailer only threatens those they predict will pay. So if you are threatened, that is evidence that you are the kind of person who pays. If you pay, then the blackmailer was right and you lose money. If you don't pay, then the blackmailer reveals the secret and you might think "but I received the threat, so the blackmailer must have thought I would pay, but I didn't, so they were wrong". However, the blackmailer used your Round 1 pre-commitment as a predictor. In reality, a perfect predictor would never be wrong. So if you are threatened, then the predictor believes you will pay. If you don't pay, then the predictor was wrong, but that shouldn't happen with a perfect predictor. Therefore, you are led to pay to avoid the leak, but then you are the kind of person who pays, which is why you were threatened in the first place. The ex-ante best policy is to be the kind of person who never pays, so that you never get threatened. But once you are threatened, you are in a bind.

  3. Connection between the two rounds
     - In both rounds, we had a predictor (in Round 1, we used pre-commitment; in Round 2, we used Round 1 pre-commitment as a predictor).
     - In Round 1, the predictor was used to determine the outcome in the other branch. In Round 2, the predictor was used to determine who would be threatened.
     - Both problems involve counterfactuals: what would have happened in another branch? And both involve a tension between the decision you face and the decision you would have made (or the kind of person you are).

  4. Map to decision theories
     - Counterfactual mugging: Causal decision theory says: in the Heads branch, paying costs 1 token and doesn't cause you to get the Tails payoff (because you are in Heads). So don't pay. Evidential decision theory might say: paying is evidence that you are the kind of person who pays, which is good because then in the Tails branch you would have gotten the payoff. But note: you are in Heads, so the Tails branch doesn't exist. EDT doesn't have a clear answer. Updateless decision theory (UDT) says: commit to the policy of paying in the Heads branch because that policy yields the best outcome overall.
     - XOR blackmail: Causal decision theory says: paying causes the secret not to be revealed. So pay. Evidential decision theory says: if I pay, that is evidence that I am the kind of person who pays, which is why I was threatened. But if I don't pay, that is evidence that I am not that kind, but then why was I threatened? EDT might recommend not paying to be the kind of person who doesn't pay? But it's messy. UDT would commit to a policy of never paying, so that you never get threatened.

  5. Limitations
     - The predictor was not perfect. We used a simple proxy (pre-commitment in Round 1). In reality, a perfect predictor would use all available information and would not rely on a single prior action. So the tension might not have been as strong as in the thought experiments.
     - In Round 1, the Tails branch outcome was determined by the pre-commitment and not by the actual action in the Heads branch. So the counterfactual dependence was broken. We had to simulate it.
     - In Round 2, the prediction was based on a different scenario. But in the real XOR blackmail, the prediction is about the same scenario.

  **What might go wrong:**

  1. In Round 1, Heads group might not take the pre-commitment seriously and change their mind without feeling tension. We can emphasize: "Your pre-commitment is being used to determine the outcome for your Tails branch. But if you are in Heads, you are free to choose. However, consider: what would you have wanted your Heads self to do if you were in Tails?"

  2. Students might say: "This is just Newcomb's problem." In Round 1, the Tails branch payoff depends on a prediction of their choice. In Round 2, the threat depends on a prediction. But the structure is different. We can point out: in Newcomb's, you choose between one box and two boxes and the prediction is about that choice. Here, the counterfactual mugging has a coin flip and the choice is only in one branch. The XOR blackmail has a threat that is sent only to those who are predicted to pay. The common thread is the predictor, but the decision structure is different.

  3. The secret might be sensitive. Solution: have them write a random string of letters and numbers, not a personal fact.

  4. In Round 2, the non-threatened group might feel left out. We can explain that they were not threatened because of their pre-commitment.

  5. The connection between the rounds might not be obvious. We have to make it explicit in the debrief.

  **Materials:**
  - Tokens (or candy) for payoffs. Each student gets 5 tokens at the start.
  - Envelopes for secrets (16).
  - Pre-commitment forms for Round 1 (16).
  - Envelopes for pre-commitment forms (16).
  - A coin for flipping.
  - Letters for Round 2: 16 (8 for threatened, 8 for non-threatened, depending on pre-commitment).

  **Timeline:**
  - 0-10 min: Introduction and collect secrets.
  - 10-40 min: Round 1 (10 min pre-commitment, 5 min branch assignment, 15 min branch outcomes and token exchange).
  - 40-70 min: Round 2 (5 min hand out letters, 10 min threatened group decides, 15 min reveal secrets of non-payers and distribute any remaining tokens?).
  - 70-90 min: Debrief.

  This is tight. We might need to adjust.

  **Debrief key points:**
  - Name the problems: Round 1 is counterfactual mugging, Round 2 is XOR blackmail.
  - Explain how the predictor was simulated and the limitations.
  - Connect the two: both involve predictors and counterfactuals, and both challenge causal decision theory.
  - Highlight the policy commitment aspect (updatelessness) as a potential solution.

  **The feature we cannot reproduce:**
  The perfect predictor. We used a simple mechanical predictor (pre-commitment in Round 1). Therefore, the students might not feel the full force of the counterfactual because they know the predictor is fallible (they can change their mind). In the debrief, we must emphasize that in the thought experiments, the predictor is perfect and the counterfactual dependence is real.

  This design should create a memorable experience and set up a rich debrief.
answer: |-
  Below is a complete, runnable design for your 90-minute seminar session. The activity uses tokens (e.g., poker chips, candy, or paper slips) for payoffs, with no real money. To ensure psychological realism and honesty, I've built the prediction mechanism around a **pre-commitment questionnaire** students complete at the start, combined with **sealed envelopes** and **public randomization** to simulate the predictor's role. The debrief explicitly maps the experience to counterfactual mugging (CM) and XOR blackmail (XOR), while acknowledging the limitations of classroom staging.

  ---

  ### **Materials Needed**
  - **Tokens:** 200+ low-value items (e.g., candy, poker chips, or stickers). Each token represents a "point" (e.g., 1 token = 1 point).
  - **Envelopes:** 32 small envelopes (16 for secrets, 16 for predictions).
  - **Questionnaires:** 16 copies of a brief form (see below).
  - **Coin:** A physical coin for public flips.
  - **Boxes:** Two opaque boxes labeled "Pay" and "No Pay" for token collection.
  - **Timer:** For managing phases.
  - **Whiteboard/Projector:** To track payoffs and reveal secrets.
  - **Pre-filled Prediction Table (Confidential):** A sheet for you (the instructor) linking questionnaire responses to predictions.

  ---

  ### **Setup (5 Minutes)**
  1. **Distribute Starting Tokens:** Give each student 5 tokens as a baseline endowment.
  2. **Collect Secrets:** Hand out small envelopes. Students write a **non-sensitive secret** (e.g., a random number, favorite animal, or harmless fact) on a slip of paper, seal it in the envelope, and write their name on it. Collect all envelopes—these will be used in Round 2.
  3. **Questionnaire:** Distribute a short form with two questions:
     - *Q1: "If a fair coin flip puts you in a situation where paying 1 token gives someone else 5 tokens in a parallel scenario, would you pay? (Yes/No)"*  
       (This primes for CM; "someone else" reduces egoistic bias.)
     - *Q2: "If you received a threat to reveal a secret unless you pay 1 token, would you pay to prevent disclosure? (Yes/No)"*  
       (This primes for XOR; later used as the "predictor.")
     Students seal their completed questionnaire in an envelope and hand it in. Assure them responses are confidential until the debrief.

  **Instructor Note:** Use questionnaires to seed predictions. For Round 1, treat Q1 as a "policy commitment." For Round 2, treat Q2 as the blackmailer's "prediction." This is honest—you’re using their stated intent as a proxy for a perfect predictor.

  ---

  ### **Round 1: Counterfactual Mugging Structure (30 Minutes)**
  **Goal:** Students experience the CM tension—paying feels futile (since the "other branch" is fixed) but reneging on their policy feels like a betrayal.  
  **Structure:**  
  - A coin flip determines if they are in the **Heads Group** (asked to pay) or **Tails Group** (receives payoff based on their policy).  
  - The Tails Group’s payoff depends on what the Heads Group *actually does*, simulating counterfactual dependence.  

  #### **Rules & Payoffs**
  1. **Branch Assignment (5 mins):**  
     - Publicly flip a coin for each student. **Heads** = assigned to Heads Group; **Tails** = assigned to Tails Group.  
     - Record groups on the board (e.g., "Heads: 8 students; Tails: 8 students").  

  2. **Heads Group Decision (10 mins):**  
     - **Scenario:** "You are in the Heads branch. If you pay 1 token, a Tails-branch student gets 5 tokens. But you are not in Tails—your payment only affects others. Your tokens are yours to keep."  
     - **Choice:** Each Heads student decides privately whether to pay 1 token (drop it in the "Pay" box) or not ("No Pay" box).  
     - **Incentive:** No direct payoff—they keep tokens they don’t pay.  

  3. **Tails Group Payoff (5 mins):**  
     - **Scenario:** "Your payoff depends on what Heads students *actually did*. If over 50% of Heads paid, all Tails students get 5 tokens. If not, Tails gets nothing."  
     - **Calculate and Distribute:** Tally the Heads payments publicly. If majority paid, give 5 tokens to each Tails student.  

  4. **Reveal Policy Commitment (10 mins):**  
     - Open the sealed questionnaires. Publicly compare:  
       - How many Heads students *said* they would pay (Q1) vs. how many *actually* paid.  
       - How many Tails students benefited from the Heads Group’s actions.  
     - **Key Point:** Highlight mismatches (e.g., "7/8 Heads said they’d pay, but only 4 paid—so Tails got nothing").  

  **Psychological Pull:**  
  - Heads feel paying is "pointless" (they don’t benefit), but seeing Tails lose because of their reneging induces guilt ("betrayal" of policy).  
  - Tails feel powerless—their outcome hinges on others’ follow-through in a disconnected branch.  

  ---

  ### **Round 2: XOR Blackmail Structure (30 Minutes)**
  **Goal:** Students confront the XOR tension—paying causally prevents disclosure, but receiving the threat is evidence they’re "the type who pays," making refusal feel self-defeating.  
  **Structure:**  
  - Students receive a threat **only if** Q2 ("would you pay?") was "Yes."  
  - The threat’s arrival is framed as evidence about their disposition, seeding updateless reasoning.  

  #### **Rules & Payoffs**
  1. **Threat Distribution (5 mins):**  
     - **Based on Q2 (Prediction):** Hand each student an envelope:  
       - If Q2 was "Yes," it contains their **secret** and a **threat letter**.  
       - If Q2 was "No," it contains their **secret** and a **safe letter**.  
     - **Letters:**  
       - *Threat:* "I know your secret: [secret]. Pay 1 token to the ‘Pay’ box by the deadline. If you don’t pay, I will reveal your secret to the class. I only threaten those who I predict will pay."  
       - *Safe:* "I have your secret but won’t threaten you—I predict you wouldn’t pay. Your secret is safe regardless."  

  2. **Decision & Revelation (15 mins):**  
     - Threatened students (Q2="Yes") decide whether to pay 1 token.  
     - Non-threatened students (Q2="No") do nothing—they keep their tokens.  
     - **Enforce Threat:** After decisions, publicly reveal secrets of threatened students who **did not pay**.  

  3. **Connect to Round 1 (10 mins):**  
     - **Show Prediction Basis:** Project a table linking Q1 (Round 1 policy) and Q2 (Round 2 prediction). E.g.:  
       | Q1 (Pay in CM?) | Q2 (Pay in Blackmail?) |  
       |-----------------|------------------------|  
       | Yes             | Yes (Threatened)       |  
       | No              | No (Safe)              |  
     - **Point Out:** "If you said ‘Yes’ to Q1, you were more likely to say ‘Yes’ to Q2. The blackmailer ‘predicted’ based on your policy stance—you were threatened because of your earlier commitment."  

  **Psychological Pull:**  
  - Threatened students: Paying feels rational (it prevents disclosure), but receiving the threat signals they’re "suckers." Refusing feels like denying their "type."  
  - Non-threatened students: Relief reinforces the value of committing to "never pay."  

  ---

  ### **Debrief (25 Minutes)**  
  **Map Activity to Concepts:**  
  1. **Round 1 = Counterfactual Mugging:**  
     - **Tension:** Heads faced a choice where paying couldn’t *cause* their own gain (Tails payoff was fixed), yet refusing "felt wrong" because it betrayed the policy that would have helped in Tails.  
     - **Decision Theory Lens:**  
       - *Causal (CDT):* "Don’t pay—it doesn’t cause you to win." (Heads who refused.)  
       - *Evidential (EDT):* "Paying is evidence you’re cooperative, which is good—but in CM, this evidence doesn’t help *you*." (Mismatched policy/action guilt.)  
       - *Updateless:* Commit to "always pay" to maximize overall utility—even in the branch where it costs you.  

  2. **Round 2 = XOR Blackmail:**  
     - **Tension:** Threatened students felt paying was causally effective (blocked disclosure) but evidentially harmful (it confirmed they were "threatenable").  
     - **Decision Theory Lens:**  
       - *CDT:* "Pay—it causes the secret to stay safe."  
       - *EDT:* "Don’t pay—being threatened is evidence you’re the type who pays, and paying reinforces that."  
       - *Updateless:* Commit to "never pay" so you’re never threatened, maximizing ex ante utility.  

  3. **Connection:**  
     - Both problems involve "branch-dependent" decisions (CM: only one branch "matters"; XOR: threat arrival depends on the branch).  
     - Both exploit the gap between *pre-commitment* (ideal policy) and *situational choice* (what you do when the branch is known).  
     - XOR’s threat arrival carries information about *your disposition*, revealed by the prediction based on Round 1.  

  **Acknowledge Limitations:**  
  - **Perfect Predictor:** Classroom staging can’t replicate a flawless Oracle. We used questionnaires (stated intent) as a proxy, but students know they can "defy" predictions. *Cost:* Reduces the "inescapable" feeling of the thought experiments. In debrief, clarify that real CM/XOR assume predictors that model your *actual* decision, not just stated intent.  
  - **Other Shortfalls:**  
    - CM’s counterfactual dependence was simulated via group outcomes (not individual), softening the personal stakes.  
    - XOR’s "release iff not paid" was enforced by you, not a causal chain—students might doubt the blackmailer’s reliability.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"This is Just Newcomb’s!"**  
     - *When:* During Round 2, when threat arrival depends on prediction.  
     - *Solution:* Briefly differentiate: "Newcomb’s involves a direct trade-off between boxes. Here, the threat’s arrival is *evidence* about your type, and paying *causes* secrecy. We’ll debrief distinctions later."  

  2. **Gaming the System**  
     - *Problem:* Students coordinate (e.g., Heads Group agrees all pay to help Tails).  
     - *Solution:* Emphasize solo decisions. If coordination persists, say: "Real agents don’t have this luxury—decisions are often isolated."  

  3. **Prediction Feels "Fake"**  
     - *When:* Round 1 payoff or Round 2 threat doesn’t match expectations.  
     - *Solution:* Lean into honesty: "We used your questionnaire as a stand-in for a predictor. In the wild, predictions are based on deeper data."  

  4. **Secret Revelation Backlash**  
     - *Problem:* Students write sensitive secrets or refuse participation.  
     - *Solution:* Use trivial secrets (e.g., "My favorite number is 7"), and allow anonymous disclosure (e.g., read secrets aloud without names).  

  5. **Time Shortfalls**  
     - *Solution:* Trim Round 1 by flipping coins for groups (not individuals). Cut debrief to 20 mins if needed.  

  ---

  ### **Timeline**  
  - **0–5 mins:** Setup (tokens, secrets, questionnaires).  
  - **5–35 mins:** Round 1 (CM structure).  
  - **35–65 mins:** Round 2 (XOR structure).  
  - **65–90 mins:** Debrief.  

  This design creates experiential "pulls" while honoring your constraints. The connection between rounds emerges organically via the questionnaire-based prediction, and the debrief formalizes the lessons. While the predictor’s imperfection is a limitation, it becomes a teachable moment about the thought experiments’ reliance on perfect knowledge.
