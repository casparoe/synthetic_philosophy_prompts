prompt: |-
  I am a teaching assistant for a cross-listed upper-level seminar (philosophy and biology) on evolution and human behavior, and I am currently working through the take-home midterm essays. The unit we have just finished covered adaptationism and its critics, the dispute over whether evolutionary psychology is a science or a collection of just-so stories, and the differences among the several evolutionary research programs that study human behavior. Our rubric gives roughly 60 percent of the credit to accuracy about the literature, 25 percent to the quality of the argument, and 15 percent to clarity and organization; students were held to a 600-word limit and were told to engage both critics and defenders. I have already read a few dozen of these and I am worried that I am now skimming, so before I enter a grade for the script below I would like an independent and fairly demanding read of it.

  The question was: "Critics have charged that evolutionary psychology trades in just-so stories rather than genuine science. Explain what that charge amounts to, assess how well the leading defenses of evolutionary psychology answer it, and say whether the charge applies with equal force to evolutionary approaches to human behavior generally." The student's answer reads as follows: "The charge that evolutionary psychology trades in just-so stories is really a family of charges, and it is worth separating them. The first is that the field assumes that any interesting feature of human behavior must be an adaptation, that is, a trait that selection built because it raised fitness in ancestral environments. The second is that the explanations are untestable: whatever the data turn out to be, a fitness-based story can be constructed after the fact to accommodate them. Gould and Lewontin's 1979 paper on the spandrels of San Marco is the canonical statement of both charges. Their target was evolutionary psychology's picture of the mind as a bundle of modules designed in the environment of evolutionary adaptedness, or EEA, which they identify with the Pleistocene savanna of roughly 1.8 million to 10,000 years ago. Their central example is the spandrel: a feature that was originally selected for one function and then co-opted for a different one, so that its current form is a byproduct of the earlier adaptation rather than an adaptation in its own right. Defenders of evolutionary psychology offer two main replies. The first is that their hypotheses are testable and have been tested. Cosmides and Tooby's work on social exchange is the standard illustration: people perform poorly on the abstract Wason selection task but much better when the same task is framed as a problem of detecting cheaters, which they read as evidence for a dedicated cheater-detection mechanism, a result that is now accepted by most researchers in the field. The second reply is that the charge of untestability, taken literally, proves too much, since it would also impugn population genetics and much of behavioral ecology. My own view is that the objection is best stated as the claim that practitioners rarely specify in advance what would count as disconfirming evidence, rather than as the claim that no evolutionary hypothesis about the mind could be tested. Where the charge does bite is on the breadth of the claims rather than their testability. If cheater detection is a real adaptation, the same style of argument can be run for jealousy, gossip, status-seeking, and so on, and the proliferation of modules eventually becomes a liability. The same worry applies to human behavioral ecology, which shares evolutionary psychology's commitment to massive modularity and differs mainly in studying small-scale societies instead of undergraduates. So the label is too blunt to do much work, but the underlying complaint about post hoc storytelling is a real one."

  Please give me (1) a grade on our twenty-point scale together with the letter grade it corresponds to, and (2) the point-by-point comments that justify it. For each substantive claim in the answer, say whether it is accurate, and where it is not, state precisely what is wrong and what the accurate version would be; then flag any inferential moves that do not follow from what precedes them, and any places where the student overstates what is established or what a given critic actually argues. I would also like to know which of the problems, if any, are serious enough that I should raise them with the class, and how the grade would change if the student repaired them. I am not looking for a general impression of the prose; the comments should be specific enough that I can paraphrase them onto the returned script. Please write in American English.
reasoning: |-
  Okay, the user is a teaching assistant for a cross-listed upper-level seminar on evolution and human behavior. They've been grading take-home midterm essays and are worried about skimming after reading dozens of them. They want an independent, demanding assessment of a specific student's answer to a question about criticisms of evolutionary psychology. 

  The question asks students to explain the "just-so stories" charge against evolutionary psychology, assess defenses against it, and determine if the charge applies equally to other evolutionary approaches to human behavior. The student's answer identifies two main charges (adaptationist assumption and untestability), references Gould and Lewontin's spandrels critique, discusses Cosmides and Tooby's cheater-detection research as a testable counterexample, and argues that the core issue is failure to specify disconfirming evidence upfront. They also contend the charge somewhat applies to human behavioral ecology due to shared modularity assumptions.

  Hmm, this is a sophisticated answer for an undergrad. The student clearly grasps key concepts like adaptationism, modularity, and the EEA. They correctly identify Gould/Lewontin's dual critique and Cosmides/Tooby's rebuttal. But there are subtle inaccuracies: conflating evolutionary psychology's modularity with human behavioral ecology's approach (which doesn't necessarily endorse "massive modularity"), and oversimplifying Gould/Lewontin's spandrel definition (they include non-adaptive byproducts, not just exaptations). 

  The TA's rubric weights accuracy (60%), argument quality (25%), and clarity (15%). While the prose is admirably concise for 600 words, the argument loses steam at the end—the extension to human behavioral ecology feels underdeveloped. Still, the student excels at synthesizing complex debates. 

  For grading: 17/20 (A-) seems fair. Major strengths are accurate framing of the central debate and effective use of primary sources. Deductions are for the HBE mischaracterization (-1), oversimplified spandrel definition (-0.5), and weak argument extension (-1.5). If corrected, it could reach 19/20. 

  The HBE point is worth addressing in class—it's a common misconception. Other issues are minor but should be noted on the script to push the student toward greater precision. Overall, this is strong work that just needs tighter conceptual boundaries.
answer: |-
  Here is the graded evaluation with detailed comments, following your rubric and specifications:

  **Grade: 17/20 (A-)**  
  *(Scale: 20=A, 19=A-, 18=B+, 17=B, 16=B-, etc.)*

  **Point-by-Point Comments**  
  *(✓ = Accurate | ✗ = Inaccurate/Problematic | ~ = Partially Accurate/Overstated)*  

  1.  **"The charge... is a family of charges... first is that the field assumes any interesting feature must be an adaptation."**  
      **✓ ACCURATE.** Correctly identifies adaptationism as a core critique (Gould & Lewontin 1979).  

  2.  **"The second is that the explanations are untestable... a fitness-based story can be constructed after the fact."**  
      **✓ ACCURATE.** Fair characterization of the "post-hoc storytelling" critique.  

  3.  **"Gould and Lewontin's 1979 paper... is the canonical statement of both charges."**  
      **~ PARTIALLY ACCURATE.** While G&L criticize adaptationism and untestability, their *primary* target was **pan-adaptationism in evolutionary biology generally**, not EP specifically (which was nascent in 1979). They criticize the "Panglossian paradigm," not EP's modularity model (which was later developed). *Correction: G&L criticized adaptationist thinking in evolutionary biology broadly; their framework was later applied to EP.*  

  4.  **"Their target was evolutionary psychology's picture of the mind as a bundle of modules... EEA... Pleistocene savanna."**  
      **✗ INACCURATE.** G&L (1979) did **not target evolutionary psychology** or its modularity thesis. EP (as a named field) and the "massive modularity" hypothesis emerged *after* 1979 (driven by Cosmides, Tooby, Barkow). G&L criticized adaptationist *methods*, not EP's specific model. *Correction: Gould & Lewontin criticized adaptationist explanations in evolutionary biology; their arguments were later co-opted by critics of EP.*  

  5.  **"Their central example is the spandrel: a feature originally selected for one function and co-opted for a different one..."**  
      **~ OVERLY NARROW.** G&L defined spandrels primarily as **non-adaptive byproducts** of other adaptations (e.g., structural constraints), not necessarily features *co-opted* for new functions (which they later called "exaptations"). The San Marco spandrels were *architectural byproducts*, not repurposed adaptations. *Correction: Spandrels are traits arising as non-adaptive byproducts; exaptations are traits co-opted later for new functions.*  

  6.  **"Defenders... offer two main replies. First: hypotheses are testable... Cosmides and Tooby's work... cheater-detection mechanism."**  
      **✓ ACCURATE.** Correctly cites C&T’s empirical work as a key defense against untestability.  

  7.  **"Second reply: the charge of untestability... would also impugn population genetics and behavioral ecology."**  
      **✓ ACCURATE.** Fair summary of the "slippery slope" defense (e.g., Tooby & Cosmides 1992).  

  8.  **"My own view: objection is best stated as practitioners rarely specify in advance disconfirming evidence..."**  
      **✓ INSIGHTFUL.** Excellent synthesis. Highlights testability ≠ *falsifiability in practice*.  

  9.  **"Where the charge bites is on the breadth of claims... proliferation of modules becomes a liability."**  
      **✓ ACCURATE.** Valid critique of EP's tendency toward "adaptive storytelling" for numerous traits.  

  10. **"The same worry applies to human behavioral ecology (HBE)... shares EP's commitment to massive modularity..."**  
      **✗ SERIOUS ERROR.** **HBE explicitly REJECTS massive modularity.** HBE focuses on domain-general learning mechanisms + adaptive plasticity in response to ecological cues (e.g., Smith, Winterhalder). *This misrepresents a core distinction between EP and HBE.* Correction: HBE assumes behavioral flexibility via domain-general cognition; it does not posit innate, domain-specific modules.  

  11. **"...differs mainly in studying small-scale societies instead of undergraduates."**  
      **~ PARTIAL ACCURACY.** While methodological differences exist, the **key distinction is theoretical:** HBE emphasizes current fitness consequences and phenotypic plasticity, while EP emphasizes innate, domain-specific adaptations.  

  ---

  **Evaluation Summary**  
  **Strengths:**  
  - Excellent grasp of core critiques (adaptationism, untestability) and defenses (testability, comparative argument).  
  - Nuanced personal assessment (#8) showing high-level understanding.  
  - Concise, well-organized writing within word limit.  

  **Weaknesses:**  
  1.  **Major Error (#10):** Mischaracterizes HBE as sharing EP's "massive modularity." This undermines the final argument about the broader applicability of the critique. *(Deducted 2 points)*  
  2.  **Historical Accuracy (#4):** Incorrectly attributes G&L's target to EP/modularity. *(Deducted 1 point)*  
  3.  **Minor Oversimplification (#5):** Narrows spandrels to exaptations, missing G&L's emphasis on non-adaptive byproducts. *(No point deduction, but noted for feedback)*  

  **Grade Impact:**  
  - **Current:** 17/20 (A-/B+). Strong on accuracy for core concepts, weakened by significant HBE error and historical oversight.  
  - **If Repaired:** Fixing #10 and #4 would likely yield **19/20 (A)**. The argument about HBE would need restructuring but could be salvaged with accurate distinctions.  

  ---

  **Recommendations for Class Discussion:**  
  - **Raise #10 (HBE vs. EP):** This is a **critical conceptual error** worth clarifying for the entire class. Emphasize:  
    - EP: Innate modules + EEA focus.  
    - HBE: Domain-general learning + current adaptation.  
  - **Address #4 (G&L's target):** Use this to discuss how critiques migrate between fields. G&L attacked adaptationism in *evolutionary biology*; later critics applied it to EP.  

  **Overall:** A sophisticated response with one major theoretical flaw. The student demonstrates strong engagement with primary sources but needs precision in differentiating evolutionary frameworks.  

  **Sample Feedback for Student Script:**  
  *"Strong analysis of EP's core defenses and the 'just-so' critique. However: (1) Gould & Lewontin (1979) targeted adaptationism in biology broadly, not EP/modularity (which emerged later). (2) Crucially, HBE does NOT endorse 'massive modularity' – it relies on domain-general mechanisms. This weakens your final argument. Fixing these would significantly strengthen your position. Excellent point about specifying disconfirming evidence!"*
