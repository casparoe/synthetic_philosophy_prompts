prompt: |-
  I'm organizing a seminar on the normativity of attitudes, and before we adjudicate the competing solutions to the wrong-kind-of-reasons problem I want the specification they are all meant to satisfy. Please set out the desiderata that any adequate account of reasons for attitudes must meet, given that some considerations which plainly bear on whether an attitude is called for are nonetheless not the sort of consideration that makes it fitting. Treat as the data the familiar cases — the demon who threatens torture unless you admire him, the eccentric who offers a fortune for a belief you know to be false, the rival whose misfortune you are paid to welcome, the genuinely admirable person you are also paid to admire, the small reward offered for an attitude you already have ample reason to hold — and ask what a theory must do to accommodate them. For each requirement, give the case or consideration that motivates it, and say why it is a genuine requirement rather than a prejudice of one camp. Make the requirements that pull against each other explicit: in particular, whether one can hold both that fittingness is what an attitude's reasons are reasons for and that considerations of the wrong kind are reasons for the attitude in any sense at all; whether the wrong-kind reason is best treated as no reason, as a reason of a different kind, or as a reason to manage the attitude rather than to have it; and whether this is one problem across belief, desire, emotion and intention or several distinct ones wearing a single name.

  If some pair of the desiderata cannot be jointly satisfied, say which pair, and say whether that is a refutation of the fitting-attitude programme or only of a careless statement of it. Then tell me which single requirement does the most work in ruling out otherwise popular accounts, and which requirements you regard as non-negotiable as against which are matters of taste. I don't want a survey of who has said what, or a reading list; argue from the cases. Write it as continuous prose — no headings, bullet points, bold or tables — the way you would write a long letter to a colleague.
reasoning: |-
  Okay, the user is organizing a seminar on the normativity of attitudes, specifically focusing on the wrong-kind-of-reasons problem. They want a clear set of desiderata that any adequate account must meet, based on familiar cases like the demon, the eccentric, the rival, etc. The user is clearly well-versed in the topic and wants a rigorous, argument-driven response without academic fluff.

  Hmm, the user's request is quite sophisticated—they're not just asking for a summary but for a synthesized framework that exposes tensions between desiderata. They want me to argue from cases, avoid survey-style writing, and present it as continuous prose. The challenge is balancing depth with readability while maintaining philosophical precision.

  Right, let's start with the core tension: how can we maintain that reasons make attitudes fitting while acknowledging that "wrong-kind" considerations (like threats or rewards) seem like reasons to have attitudes? The cases present a pattern: considerations that bypass the attitude's proper object feel intuitively relevant but not fittingness-conferring. 

  First desideratum must be the Fittingness Constraint: reasons for attitudes must bear on whether the attitude fits its object. The demon case shows this—the threat makes admiration advisable but doesn't make the demon admirable. This isn't just intuition; it's constitutive of what attitudes *are* (e.g., belief aims at truth, admiration at merit). 

  But then the Incentive Intuition bites: the reward in the eccentric case *does* seem like a reason to believe, even if a bad one. So we need a second desideratum: Incentive Accommodation. Dismissing pragmatic reasons entirely (as some do) feels revisionist. 

  Ah, here's the rub: these two pull apart. If fittingness reasons are the only "real" reasons, we violate Incentive Accommodation. But if we call incentives "reasons," we risk collapsing into pragmatism. The solution? Distinguish reason types. Hence third desideratum: Duality Without Collapse. We must explain why incentives aren't fittingness reasons while preserving their reason-status. 

  The attitude-management move (e.g., "reasons to cause yourself to believe") helps but faces the Pre-Existing Attitude Problem: if you already have fittingness-based admiration, a small reward for admiring shouldn't add a new reason *for admiration*, only for maintaining it. This pushes us to see management reasons as distinct. 

  Now, the Generality Requirement: whatever solves this for belief must work for emotion/intention too. The paid-to-welcome-rival's-misfortune case tests this—it's not about causing the attitude but about whether the payment is a reason *for* the attitude itself. A unified account seems necessary, given structural parallels. 

  Non-Negotiables: Fittingness Constraint and Incentive Accommodation are bedrock. Without the first, attitudes lose their nature; without the second, we ignore clear normative phenomena. The Duality thesis is where theories diverge—it's negotiable *how* we distinguish kinds, not *that* we must. 

  The Pre-Existing Attitude Problem does the heaviest lifting against popular accounts. Consequentialists who reduce all reasons to incentives stumble here, as do purists who deny incentive reasons altogether. 

  Finally, the tension between Fittingness and Incentive Accommodation isn't fatal—it refines the fitting-attitude program. We can hold both by distinguishing reason kinds carefully. The real pitfall is conflating them. 

  ...Better emphasize that last point. The user wants to adjudicate solutions, so highlighting this tension as productive rather than destructive is key.
answer: |-
  You raise precisely the right challenge for grounding your seminar. The "wrong kind of reasons" (WKR) problem isn't just a puzzle; it's a crucible for testing the coherence of the fitting-attitude account of normative reasons. Any viable solution must satisfy several interlocking desiderata, drawn directly from the cases you mention. These requirements often pull against each other, revealing the fault lines in the theory. Let's articulate them clearly, motivated by the data, showing why they are genuine constraints rather than partisan dogma.

  First, and most fundamentally, any account must satisfy the **Fittingness Constraint**. This demands that the reasons which genuinely count *in favour of the attitude itself* (the "right kind of reasons" or RKR) are those that bear on whether the attitude *fits* its object. Admiration is fitting when its object is admirable; belief when its object is true or probable; fear when its object is threatening. The demon threatening torture unless you admire him provides a stark test. While the threat gives you a powerful reason *to bring it about* that you admire him, it manifestly does nothing to make him *admirable*. To say it provides a reason *for admiration* itself would sever the constitutive link between the attitude and its characteristic object or standard of correctness. This isn't a preference for one theory; it's anchored in the very nature of the attitudes we're discussing. An account that denies this constraint ceases to be an account of reasons for attitudes *as such*; it becomes an account of reasons for states of mind simpliciter.

  However, the **Incentive Intuition** provides a powerful counterweight. We cannot simply dismiss the demon's threat or the eccentric's offer of a fortune for believing a known falsehood (P) as providing *no reason whatsoever*. Intuitively, the fortune *is* a reason, however outweighed, to believe P. Denying this feels revisionist and fails to capture the normative pressure these situations exert. The genuinely admirable person you are also paid to admire intensifies this: the payment seems to add *a further reason* to admire her, distinct from the reasons provided by her admirability. This intuition pushes against accounts that try to relegate all WKRs to being mere "reasons to want to have the attitude" or similar; the consideration seems directly relevant to whether *to have* the attitude, even if not via fittingness. A theory that simply declares WKRs to be non-reasons violates deep-seated normative intuitions present in these cases.

  This tension necessitates a third desideratum: **Duality Without Collapse**. An adequate account must acknowledge two distinct *kinds* of reasons relevant to attitudes: RKR (bearing on fittingness) and WKR (providing incentives or disincentives), while rigorously preventing the latter from collapsing into the former. Crucially, it must explain *why* WKRs are the "wrong kind" for the fittingness of the attitude itself. The case of being paid to welcome the rival's misfortune is illuminating here. The payment is clearly a reason to welcome the misfortune, but it equally clearly doesn't make the misfortune itself *welcome-worthy* (i.e., good for you or something to be desired). The account must show how the payment operates differently from reasons that stem from the misfortune's actual impact on your well-being. Failure here risks making fittingness contingent on incentives, undermining its objectivity.

  The fourth requirement, **Attitude Management Distinction**, is motivated by the pre-existing attitude case: the small reward offered for an attitude you already have ample RKR to hold. Suppose you already deeply admire someone for their genuine virtues. A small monetary reward for admiring them seems irrelevant to the admiration *itself* – it doesn't make you admire them *more* or *better*. What it plausibly provides is a reason to *sustain* that admiration, or to *bring it about* that you continue to admire them, or perhaps to *express* it. This suggests WKRs function as reasons to *manage* the attitude – to acquire it, sustain it, suppress it, or express it – rather than as reasons constituting or modifying the attitude's fittingness or its core justificatory basis. An account failing this distinction struggles to explain why the small reward doesn't simply add to the pile of reasons *for admiration* in the same way further evidence of admirability would.

  Fifth, we need **Generality Across Attitudes**. The solution should, prima facie, work uniformly for belief, desire, emotion, and intention. The structural similarity is striking: the demon for admiration, the eccentric for belief, payment for welcoming (desire/emotion). If an account handles belief WKRs (e.g., by positing reasons to cause oneself to believe) but cannot smoothly extend to emotion (e.g., reasons to cause oneself to feel fear) or intention without ad hoc adjustments, it loses significant plausibility. The eccentric offering a fortune for belief P and a scenario offering a fortune to intend to φ (where φ is known to be pointless or bad) seem analogous challenges. Treating them as fundamentally different problems requires strong justification.

  The central tension lies between the **Fittingness Constraint** and the **Incentive Intuition**, mediated by the need for **Duality Without Collapse**. Can we hold both that fittingness is what RKR are reasons *for* and that WKR are genuine reasons *for the attitude* in *some* sense? This is the core puzzle. Denying the Incentive Intuition (claiming WKR are not reasons at all) seems counterintuitive. Collapsing the duality (making incentives affect fittingness) violates the Fittingness Constraint. The most promising path is accepting duality: WKR *are* genuine normative reasons for attitudes, but they are reasons *of a different kind* – specifically, reasons grounded in the *consequences* of having (or not having) the attitude, rather than in the properties of the attitude's object that make the attitude fitting. This avoids denying the normative force of incentives while preserving the core link between an attitude and its object.

  The **Attitude Management Distinction** is crucial for making this duality work. The eccentric's fortune isn't a reason *for* believing P (it doesn't make P more likely); it's a reason *to bring it about* that you believe P. Similarly, the demon's threat isn't a reason *for* admiring him (it doesn't make him admirable); it's a reason *to cause yourself* to admire him. This distinction explains why the small reward doesn't add to the reasons *for* the pre-existing attitude: it only adds reasons concerning its *management*.

  Is this tension between Fittingness Constraint and Incentive Intuition a refutation of the fitting-attitude programme? Not inherently. It exposes the need for careful formulation. A programme stating *only* that reasons for attitudes make them fitting is refuted by the Incentive Intuition. But a programme that acknowledges *two fundamental kinds* of normative reasons relevant to attitudes – reasons of fittingness (RKR) and reasons of incentive or management (WKR) – can accommodate both constraints. The challenge becomes explaining the relationship between these kinds clearly and avoiding collapse. The programme survives, but in a more complex form.

  Among these, the **Attitude Management Distinction** arguably does the most work in ruling out otherwise popular accounts. Simple subjectivist or consequentialist accounts that reduce all reasons to incentives (or desire-satisfaction) fail the Fittingness Constraint spectacularly – the demon's threat *would* make him admirable on such views, which is absurd. Conversely, purist accounts that dogmatically insist *only* fittingness considerations are reasons for attitudes violate the Incentive Intuition – they cannot explain the normative pressure of the eccentric's offer. Accounts that try to treat WKR as reasons *for* the attitude but of a "non-evidential" or "pragmatic" kind, *without* invoking the management move, struggle hardest with the **Pre-Existing Attitude** case. If WKR are just another kind of reason *for* the attitude itself, why doesn't the small reward *add* to the reasons for admiring the already-admirable person in the same way new evidence of their virtue would? Only the management distinction cleanly avoids this implication. It also helps satisfy **Generality**, as the causing/sustaining distinction applies across attitudinal types.

  Non-negotiables are the **Fittingness Constraint** (without it, the account loses its grip on the nature of attitudes) and the **Incentive Intuition** (denying it ignores clear normative phenomena). **Duality Without Collapse** is also essential – the distinction *must* be maintained. The precise formulation of the **Attitude Management Distinction** (e.g., "reasons to cause" vs. "reasons to have") and the exact metaphysical status of WKR (are they *sui generis* reason-types or reducible?) are areas where reasonable disagreement persists. Similarly, while **Generality** is a strong default presumption, showing that a structurally unified solution *isn't* possible across attitudes could be a valid outcome, though it would demand significant explanation. The core achievement of any account is preserving the essential link between attitude and object via fittingness, while honestly accommodating the undeniable normative force of incentives, without letting the latter distort the former. That’s the tightrope your seminar must walk.
