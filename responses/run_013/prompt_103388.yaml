answer: |-
  Right, I see the bind you're in. This is a classic and tricky argument in the philosophy of social science, pitting methodological individualism against explanatory practice. Let's dissect it step by step, identifying the flaw, why it's compelling, the cost of giving it up, and what a better account looks like.

  **The Flawed Step: Premise (2)**

  The crucial misstep is **(2)**: *"If a fact is nothing over and above facts of some other kind, then an adequate explanation of it must be given in terms of facts of that kind."*

  This premise conflates **ontological dependence** (what the social fact *is* or *is constituted by*) with **explanatory strategy**. While (1) establishes that social facts supervene on individual facts (ontological individualism), it does *not* follow that explanations *must* always operate at the level of the individual micro-facts. Premise (2) asserts this necessity, but it isn't justified.

  **Why Premise (2) Looks Compelling:**

  1.  **The Reductionist Intuition:** There's a powerful intuition, borrowed from some physical sciences, that explaining a whole *just is* explaining its parts and their interactions. If the social *is* nothing but individuals interacting, surely explaining it *must* involve explaining those individuals? This feels like a direct implication of ontological dependence.
  2.  **Avoiding "Spooky" Holism:** Premise (2) seems like a bulwark against positing mysterious social entities with independent causal powers. If we allow explanations citing "the central bank" or "the norm" without ultimately grounding them in individuals, aren't we flirting with holism or reification?
  3.  **Simplicity & Parsimony:** It promises a single, fundamental level of explanation – the individual level – simplifying the metaphysical and explanatory landscape.

  **The Cost of Giving Up Premise (2):**

  Rejecting (2) means accepting that:

  1.  **Explanatory Levels are Legitimate:** Adequate explanations can sometimes operate at a higher level of organisation (like institutions, norms, or aggregate patterns) *without* needing to constantly reference the micro-level details of individuals. These explanations aren't merely "placeholders" but can be genuinely explanatory in their own right.
  2.  **Explanations Can Be Relatively Autonomous:** Higher-level explanations might abstract away from the messy details of individual psychologies and interactions, focusing instead on structural features, roles, rules, or aggregate dynamics that shape outcomes. These explanations capture real patterns that are difficult or impossible to see *only* at the individual level.
  3.  **No Guarantee of Micro-Reduction:** While the social phenomena are *constituted* by individuals, providing a complete, tractable explanation *exclusively* in terms of every relevant individual belief and action might be practically impossible or explanatorily useless for many phenomena. Think of explaining traffic jams solely by the intentions and actions of every single driver – it's true in principle, but misses the emergent dynamic that *is* the jam.

  **A Defensible Account of Higher-Level Social Explanation (After Rejecting Premise 2):**

  This account is often called **Non-Reductive Individualism** or **Institutional Individualism**. It maintains ontological commitment (1) – social facts supervene on individual facts – but rejects explanatory reductionism (2, 3, 5, 6).

  1.  **Supervenience Without Explanatory Reduction:** Social facts depend entirely on individual facts, but higher-level explanations can be indispensable and genuine. The dependence relation (supervenience) doesn't dictate the *explanatory* level. Think of biology supervening on chemistry, yet genetic explanations aren't *replaced* by quantum physics explanations, even though the latter constitute the former.
  2.  **Explaining via Emergent Properties & Mechanisms:** Higher-level social explanations often work by identifying:
      *   **Emergent Properties:** Properties of the collective system that arise from, but are not easily reducible to, individual properties (e.g., liquidity of markets, stability of norms, efficiency of an institution).
      *   **Mechanisms:** Causal processes involving the *organisation* of individuals – roles, rules, institutional structures, feedback loops, network effects, aggregate tendencies. Explaining *how* a central bank's interest rate decision causes a slowdown involves citing the institutional rules governing the bank, the typical responses of commercial banks, firms, and consumers *as structured by their roles within the economic system*. While each actor is an individual, the *causal pathway* is best described at the institutional/structural level. Reducing it to "Individual A (banker) believed X, Individual B (CEO) believed Y..." loses the systemic logic.
      *   **Macro-Regularities:** Patterns observable only at the aggregate level (e.g., supply and demand curves, demographic trends, segregation patterns) that powerfully constrain and enable individual actions. Explaining *why* segregation persists might involve citing aggregate preference distributions and threshold effects (like Schelling's model), which *are* facts about distributions of individual preferences, but *not* facts about any *single* individual's belief or action. It's a fact *about* the collective state of individuals.
  3.  **The Centrality of Institutions and Rules:** Facts like "the central bank raised rates" *are* facts about individuals – but *only* under specific descriptions involving their institutional roles and the rules defining those roles. The Governor acted *as Governor*, according to the Bank's mandate and procedures. The explanation cites the *institutional action* – which supervenes on individuals acting within institutional constraints – because that institutional level captures the relevant causal power in a concise and tractable way. Reducing it to "Person P pressed button B" misses the crucial institutional context that *gives* pressing button B the meaning and causal effect of "raising the interest rate".
  4.  **Explanatory Power:** Higher-level explanations are adequate because:
      *   **They identify relevant causes:** They pick out causally efficacious structures, mechanisms, and properties that operate at that level.
      *   **They are tractable:** They provide understanding without an intractable descent into micro-details.
      *   **They capture real patterns:** They describe robust, reproducible regularities that exist at the social level.
      *   **They can be predictive:** They allow us to anticipate outcomes based on structural features or aggregate trends.

  **What This Account Concedes to the Holist (and What It Doesn't):**

  *   **Concedes:** It concedes that genuinely explanatory social science *must* often operate at a level above the individual *as such*. It acknowledges the reality and causal efficacy of emergent social properties, structures, and mechanisms. It grants that explanations citing "the norm," "the institution," or "the market" are not automatically deficient or mere shorthand. Holists are right that purely individualist explanations often fail to capture the essence of social phenomena.
  *   **Does NOT Concede:** It **firmly rejects ontological holism**. It insists that these higher-level phenomena have *no existence independent* of the individuals who constitute them through their beliefs, actions, and interactions (especially interactions structured by rules and institutions). There are no "social wholes" floating above individuals. The emergent properties and causal powers are *real*, but they are *grounded in* and *exercised through* individuals. The account remains resolutely individualist *ontologically* while being pluralist *explanatorily*.

  **Addressing Your Concerns:**

  *   **"Proves too much" (Residential Segregation):** You're spot on. The argument *should* condemn the Schelling-style explanation if premise (2) were correct, as it cites an *aggregate pattern* (mild preferences leading to segregation) – which isn't a fact about any *single* individual's belief/action. But this explanation *is* clearly individualist and valid! Rejecting (2) rescues it. The explanation works *because* it identifies a *macro-mechanism* (aggregate preferences + threshold effects) that supervenes on individuals but explains the outcome at its own level.
  *   **Keeping (1) vs. (6):** Rejecting (2) allows you to keep ontological individualism (1) *without* accepting the crippling explanatory reductionism of (6). You can deny "social wholes" *and* accept that genuine explanations often cite institutional actions or norms, precisely *because* those institutional facts *are* constituted by individuals acting within rule-bound systems.

  **Conclusion:**

  Give up **Premise (2)**. It mistakenly infers explanatory reductionism from ontological supervenience. The cost is accepting that adequate social explanations can legitimately operate at higher levels of organisation (institutions, structures, mechanisms, aggregate patterns) without being reducible, in practice or principle, to a moment-by-moment account of individual psychologies. This preserves ontological individualism while acknowledging the indispensable explanatory role of social structures and emergent properties grounded in, but not reducible to, individuals. Your residential segregation example is a perfect illustration of why premise (2) fails: it *is* an individualist explanation, but it works by citing a *higher-level* (aggregate) fact *about* individuals, not by detailing each individual. This non-reductive individualist account concedes the *explanatory indispensability* of the social level to the holist, while utterly denying its *ontological independence*.
