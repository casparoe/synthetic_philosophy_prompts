answer: |-
  ### (i) Examination Question  
  **Total: 20 marks**  
  *(Write approximately 800 words total. All parts are compulsory.)*  

  **a.** The Lottery Paradox and the standard Preface Paradox share a common structural core. State this structure formally by naming the precise principles of rational belief and/or credence whose joint acceptance generates paradoxical tension. Do *not* merely note that both involve many highly probable claims. **(4 marks)**  

  **b.** Consider a modified Preface case: An author assigns credence 0.999 to each of 1,000 claims in her book *and also* assigns credence 0.999 to the statement "At least one claim in this book is false" (treating it as one more belief). Assuming the claims are evidentially independent, show why this set of credences is arithmetically incoherent. Does this diagnosis resolve the *original* Preface Paradox (where the author believes each claim but believes the book contains at least one error)? Explain why or why not, addressing whether the author could restore coherence by uniformly lowering her credence in each individual claim and what this implies about the aggregation of small risks. **(10 marks)**  

  **c.** Are the Lottery Paradox and the Preface Paradox fundamentally one paradox or two distinct paradoxes? Provide an explicit criterion for your verdict. Rank the following remedies by which would be *most* to *least* theoretically costly to abandon:  
  (i) Belief is closed under conjunction (if you believe P and believe Q, you must believe P-and-Q)  
  (ii) Belief requires credence above a fixed threshold (e.g., >0.99)  
  (iii) A rational agent’s beliefs must be logically consistent  
  (iv) Each individual highly probable claim is blamelessly believable  
  Justify your ranking. **(6 marks)**  

  ---

  ### (ii) Model Answer (Approx. 800 words)  

  **a.** Both paradoxes share a conflict between three principles:  
  (1) **Threshold:** Belief requires credence above a high threshold (e.g., >0.99).  
  (2) **Closure:** If you believe P and believe Q, you rationally ought to believe (P-and-Q).  
  (3) **Inconsistency Avoidance:** It is irrational to believe a logically inconsistent set of propositions.  
  In the Lottery, (1) and (2) compel belief that each ticket loses, and thus (by closure) that *all* lose, contradicting the known truth that one wins. In the Preface, (1) and (2) compel belief in every claim, but (3) conflicts with the author’s belief that at least one claim is false. The core structure is the incompatibility of (1), (2), and (3) under conditions of aggregated uncertainty.  

  **b.** **Incoherence in Modified Preface:**  
  - Let \( C_1, C_2, \ldots, C_{1000} \) be the claims. The author holds \( cr(C_i) = 0.999 \) for each \( i \).  
  - Under evidential independence, \( cr(\text{All True}) = (0.999)^{1000} \approx 0.368 \).  
  - Thus, \( cr(\text{At least one false}) = 1 - 0.368 = 0.632 \).  
  - Yet the author assigns \( cr(\text{At least one false}) = 0.999 \). This contradicts the laws of probability (specifically, the additivity of probabilities for disjoint events and the definition of independence). The credences are arithmetically incoherent.  

  **Does this resolve the original Preface? No.**  
  In the original Preface, the author believes *each* \( C_i \) (credence > threshold) and believes *at least one is false* (credence high, say 0.999), but *does not* assign credences violating probability axioms. The conflict is between:  
  - Belief in each \( C_i \) (implying, via closure, belief in their conjunction)  
  - Belief in the negation of that conjunction (i.e., that not all are true).  
  This is a *logical* inconsistency in the *belief set* (violating principle (3)), not an arithmetical credence incoherence. The modified case exposes a *stronger* flaw (probabilistic inconsistency), but the original paradox persists as a conflict between rational belief-formation norms.  

  **Lowering credences?**  
  The author *could* restore coherence by lowering individual credences. For example, setting \( cr(C_i) = 0.99937 \) yields \( cr(\text{All True}) \approx 0.632 \), allowing \( cr(\text{At least one false}) = 0.368 \). But to assign \( cr(\text{At least one false}) = 0.999 \), she must set individual credences drastically lower (e.g., \( cr(C_i) \approx 0.9963 \) for independence). This shows that aggregating tiny risks (0.001 per claim) forces either abandoning high confidence in the book’s infallibility or significantly diluting confidence in each claim. The paradox highlights how negligible individual risks compound to substantial collective doubt.  

  **c.** **One Paradox or Two?**  
  **Verdict:** They are two distinct paradoxes with a shared *structural origin* but different *pressure points*.  
  **Criterion:** The paradoxes are distinct if they require different remedies to resolve their core tension while preserving intuitive rationality.  
  - The **Lottery Paradox** pressures **Closure** and **Threshold**: High probability of individual losses doesn’t translate to high probability of all losing. Rejecting Closure (e.g., claiming conjunction isn’t believable) resolves it directly.  
  - The **Preface Paradox** pressures **Inconsistency Avoidance**: The author rationally holds inconsistent beliefs (each claim true vs. one false). Rejecting Closure doesn’t suffice, as the beliefs "each \( C_i \)" and "some \( C_i \) is false" are already inconsistent without conjunction.  

  **Remedies Ranking (most to least costly to abandon):**  
  **(iv) Individual blamelessness:** Rejecting that highly probable claims are blamelessly believable (e.g., saying we *shouldn’t* believe any lottery-ticket claim) undermines the link between evidence and belief. This sacrifices core epistemic justification. → **MOST COSTLY**  
  **(iii) Consistency:** Allowing knowingly inconsistent beliefs (e.g., "I believe P, Q, R,... but also not-(P-and-Q-and-R-...)") abandons a bedrock norm of rationality. → **HIGH COST**  
  **(i) Closure:** Rejecting closure (e.g., "I believe P, believe Q, but deny P-and-Q") is counterintuitive but feasible (e.g., resource-bounded agents). → **MODERATE COST**  
  **(ii) Threshold:** Rejecting a fixed threshold (e.g., making belief context-dependent) avoids the paradoxes but obscures belief’s connection to probability. → **LEAST COSTLY**  

  The Lottery paradox *can* be resolved by sacrificing (i) or (ii) alone. The Preface paradox *requires* sacrificing (i) *and* either (ii) or (iii), making it strictly harder to resolve. Thus, (iv) is given up last—denying blamelessness collapses everyday epistemic practice.  

  ---

  ### (iii) Marking Scheme (Total: 20 marks)  

  **Must-Hit Moves:**  
  1. **State Shared Principles (a):** (4 marks)  
     - *Award:* Names Threshold, Closure, and Inconsistency Avoidance as jointly conflicting.  
     - *Error:* Vaguely describes "many probable claims" without formal principles.  

  2. **Arithmetic Diagnosis (b):** (4 marks)  
     - *Award:* Correctly computes \( cr(\text{All True}) \approx 0.368 \) → \( cr(\text{Some False}) = 0.632 \), contradicting 0.999. Notes independence assumption.  
     - *Error:* Fails to calculate/justify the 0.632 vs. 0.999 contradiction.  

  3. **Original Preface Survival (b):** (4 marks)  
     - *Award:* Distinguishes original Preface’s *logical inconsistency* from modified case’s *probabilistic incoherence*; explains why lowering credences is possible but undermines the paradox’s point about blameless belief.  
     - *Error:* Claims the arithmetic flaw "resolves" the original paradox.  

  4. **Verdict with Criterion (c):** (4 marks)  
     - *Award:* Declares them distinct with an explicit criterion (e.g., differing necessary remedies) and ties Lottery to Closure/Threshold pressure, Preface to Consistency pressure.  
     - *Error:* Calls them "the same" without addressing remedy divergence.  

  5. **Remedies Ranking (c):** (4 marks)  
     - *Award:* Ranks (iv) > (iii) > (i) > (ii) with justification focused on epistemic cost (e.g., abandoning blameless belief sabotages justification; fixed thresholds are negotiable).  
     - *Error:* Ranks remedies by familiarity (e.g., "reject closure is standard") without cost analysis.  

  **A/B Boundary:**  
  - **A (17–20):** Hits **Move 3** (nuanced Preface survival) **and** **Move 5** (insightful remedy ranking).  
  - **B (13–16):** Misses one of Move 3 or Move 5, but hits all others.  
  - **C (≤12):** Misses two or more moves.
