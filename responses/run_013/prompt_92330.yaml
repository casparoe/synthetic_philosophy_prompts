  **SECTION 2: METHODOLOGICAL SAFEGUARD (NEGATIVE HEURISTIC)**
  *   2.1 Declared Prohibited Refutational Actions: List hypotheses or experimental approaches *expressly forbidden* by programme protocol as posing risk to the Fundamental Directive (1.4).
      *   *Investigation attributing migratory anomalies (>15% deviation from predicted resonance-path) primarily to chemical gradients or celestial navigation.*
      *   *Direct measurement attempts of postulated plate harmonic oscillation source (deemed technically infeasible per Safeguard Principle).*
      *   *Modelling that decouples resonance field from migratory behaviour as a primary variable.*  *(Officer Margin: Standard prohibitions. PI maintains these are "methodologically corrosive".)*

  **SECTION 3: PROTECTIVE BELT & AUXILIARY HYPOTHESES**
  *   3.1 Current Auxiliary Hypotheses (Modifiable Components):
      *   *AH-24-01: Signal attenuation in high-sediment zones is compensated by benthic reflection harmonics (cf. Task T-23-05 results).*
      *   *AH-24-02: "Signal confusion" in equatorial regions arises from interference patterns generated by opposing continental shelf resonances.*
