  ### Commentary Notes for Submission (Key Traps & Lakatosian Mappings)
  1.  **Prospective Verdict / Retrospective Criteria Trap:** The form *requires* a verdict (Progressive/Degenerating, Section 9.1) and funding decision *now*, while the core criteria (Empirical Progressiveness, Section 5.2; Supersession, Section 6) are explicitly acknowledged as only adjudicable retrospectively (years later, via Post-Hoc Review). The Case Officer is forced to guess future corroboration.
  2.  **Hard Core Undocumentability Trap:** Section 1.4 is deliberately blank, referencing an inaccessible archive. The Hard Core is *presupposed* by the entire process but cannot be stated or challenged within the operational appraisal system, reflecting its methodological untouchability.
  3.  **Anomaly Auto-Conversion Trap:** Section 7.3 mandates that every logged anomaly (Section 7.1) is *automatically* converted into a research task (Section 4.1). Anomalies **cannot** count against the programme; they *only* generate new work within the protective belt, fulfilling the negative heuristic. The "Resolution Rate" (5.3.3) becomes a measure of busyness, not truth.
  4.  **Novelty Certification Time Paradox Trap:** Section 8.2 requires the PI to certify *in the present* that predicted novel facts (which haven't been sought or found yet) were indeed novel *before* the programme predicted them, based on a hash date from the programme's founding. This enshrines the idea of heuristic-driven novelty but forces a paradoxical bureaucratic act.
  5.  **"Monster-Barring" Bureaucratized Trap:** The Methodological Safeguard (Section 2.1) formally lists "prohibited refutational actions". These directly correspond to monster-barring (declaring counter-evidence irrelevant/invalid) and exception-barring (excluding problematic domains). It's institutionalized immunization.
  6.  **Supersession Prematurity Trap:** Section 6 forces a premature assessment of supersession potential (explaining rival's success, absorbing their belt, heuristic superiority) long before the programmes have developed sufficiently for a rational comparison to be possible. The Officer is forced to speculate.
  7.  **Hidden Lemma Incorporation Glossed Trap:** The modification of an auxiliary hypothesis (AH-23-02 in Section 3.2) mentions incorporating "a lemma on equatorial counter-current modulation". This reflects a key Lakatosian move (adding hidden assumptions/adjustments to protect the belt) but is presented as mundane administrative detail.
  8.  **Heuristic Trajectory as Bureaucratic Compliance Trap:** The Positive Heuristic (Section 4) is reduced to a list of tasks, primarily auto-generated from anomalies. The "trajectory" is judged administratively ("looks busy") rather than substantively for its genuine intellectual promise, and the distinction between progressive and degenerating shifts is blurred by the Auto-Convert mechanism making everything look like activity.
  9.  **Rubric Scoring Incommensurability Trap:** The rubric (Section 5) applies precise numerical scores (0.67) and weightings to inherently qualitative, temporally extended judgments (like Theoretical Progressiveness). It creates a veneer of objectivity for decisions fundamentally reliant on future reconstruction. The Amber threshold (0.65) is bureaucratically arbitrary.
