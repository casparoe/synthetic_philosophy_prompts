  Subject: Provisional Programme Rating & Continuation Funding Recommendation (FY24/25)

  1.  The submitted Annual Progress Report and Pre-Continuation Submission (Annexes A-D) for Programme HRPD-PB have undergone preliminary appraisal against CSFA Standard Evaluation Metrics (SEMs PAF-7, Section 5).
