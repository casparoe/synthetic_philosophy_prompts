prompt: |-
  A newspaper I read has a rule for its reporters: a claim may be stated flatly only if it can be traced to at least two independent sources; with a single source it may be stated only as an allegation; and if the reporter's only ground is his own firsthand knowledge, the claim must be left out of the story altogether. The same paper's opinion columnists may assert whatever they please, with no sourcing at all. I keep wondering what theory of assertion this practice is built on. Does the reporting rule presuppose that one may assert only what is true, only what one knows, or only what one has adequate evidence for — and if it is really a knowledge norm, why does the paper forbid a reporter to state what he in fact knows? Does the latitude given to columnists show that the paper actually operates with a much weaker norm, or is opinion-writing a separate practice with its own rules? Or is the reporting rule not a norm of assertion at all, but a rule about what readers can be brought to trust, which would make it something else entirely? Please reconstruct the view the practice presupposes, separate what it strictly requires from what it merely fits with, tell me where it is underdetermined among the competing norms, and say what would have to change in the newsroom if the presupposed view were replaced.
reasoning: |-
  Okay, the user is asking about the underlying theory of assertion in a newspaper's practices. Let me start by breaking down the key elements of their query. They describe a strict sourcing policy for reporters: two independent sources for flat claims, one source for allegations, and no firsthand knowledge without sources. Meanwhile, columnists can assert anything without sourcing. The user is confused about what norm of assertion this implies—truth, knowledge, evidence—and why reporters can't state what they know. They also question if the columnist freedom indicates a weaker norm or a separate practice. Plus, they wonder if it's about reader trust instead of assertion norms.

  First, I need to parse the reporting rules. The hierarchy here suggests that the paper prioritizes verifiability over the reporter's knowledge. Even if a reporter knows something firsthand, they can't report it without external sources. That points towards an institutional norm focused on evidence and corroboration rather than individual knowledge. The columnists, however, operate under different rules, which might be because opinion pieces are seen as personal viewpoints, not objective reporting.

  Next, considering philosophical norms: the Knowledge Norm says you should only assert what you know. But here, reporters can't use their own knowledge, which seems contradictory. So the paper isn't using that norm. The Truth Norm would allow assertions if true, but again, reporters need sources even if they know it's true. The Evidence Norm requires sufficient evidence, which aligns with needing multiple sources. The paper seems closest to an Evidence Norm but with an institutional twist—evidence must be documented and verifiable by the organization.

  The columnist angle is important. Their freedom suggests that assertions in opinion sections aren't held to the same standards as news reporting. This implies that the paper distinguishes between factual reporting and opinion, each with its own norms. So the practice isn't under a single norm but depends on the context within the paper.

  The user also asks about reader trust. That's a practical consideration. By requiring multiple sources, the paper builds credibility. Readers trust the news section more because of these strict rules. Columnists, however, are expected to be persuasive or provocative, so trust there is based on different factors like reputation or rhetorical skill.

  Where is the practice underdetermined? The rules don't specify why firsthand knowledge isn't enough. It could be about avoiding bias, ensuring verifiability, or legal protection. Also, "independent sources" might need clearer definition. Competing norms like knowledge vs. evidence aren't resolved; the paper's policy leans towards evidence but doesn't explicitly commit to a philosophical stance.

  If the presupposed view changed—say, to a Knowledge Norm—reporters could state what they know firsthand, possibly with verification steps. That would increase subjectivity but reduce reliance on external sources. If it shifted to a Truth Norm, reporters might state claims they believe are true without needing multiple sources, which could risk accuracy. Such changes would blur the line between news and opinion, affecting reader trust and the paper's reputation.

  I should also address the user's deeper needs. They might be interested in the philosophy of journalism, ethics of reporting, or how institutional rules shape public trust. They could be a journalist, student, or philosopher analyzing media practices. Clarifying the distinction between news and opinion sections is crucial here, as it explains the differing standards. Highlighting the balance between epistemic rigor and practical constraints in journalism would add depth to the response.
answer: |-
  The newspaper's practice reveals a sophisticated, layered approach to assertion norms, reflecting institutional priorities rather than a single philosophical theory. Here's a reconstruction of the presupposed view, its limitations, and implications for change:

  **Core Presupposed View: Institutional Verificationism**  
  The practice is built on a hybrid norm prioritizing *verifiable institutional credibility* over individual epistemic states. Key elements:  
  1. **News Reporting:**  
     - **Norm:** Assertions must meet *institutional standards of verifiability*, not individual knowledge or truth.  
     - **Why forbid firsthand knowledge?**  
       - Avoids subjectivity/bias claims ("I saw it" invites "you're biased").  
       - Ensures claims survive editorial scrutiny and legal review.  
       - Builds reader trust via third-party corroboration (even if redundant epistemically).  
     - **Hierarchy of Evidence:**  
       - *Two sources* → Treats claim as institutionally verified truth.  
       - *One source* → Acknowledges claim as potentially litigious/unverified ("allegation").  
       - *Firsthand knowledge* → Rejected as insufficiently objective *for the institution*.  

  2. **Opinion Columns:**  
     - **Separate Practice:** Operates under a *persuasion/expression norm*, not truth-tracking.  
       - Goal is commentary, argument, or provocation—not factual reporting.  
       - Reader expectation: Columnists speak *as individuals*; institutional credibility isn't at stake.  
     - **Implied Contract:** Readers understand opinions ≠ verified news.  

  **What the Practice Strictly Requires (vs. What It Fits With):**  
  | **Aspect**               | **Strictly Requires**                          | **Merely Fits With**                          |  
  |--------------------------|-----------------------------------------------|-----------------------------------------------|  
  | **Truth**                | *Not required* (paper can publish false but verified claims) | Fits truth-seeking as a goal, but not a norm |  
  | **Knowledge**            | *Rejected as insufficient* for reporters      | Fits if "knowledge" = institutionally verified |  
  | **Evidence**             | *Required*, but defined as *external sourcing* | Fits evidence norms, but rejects personal evidence |  
  | **Reader Trust**         | *Central*—rules designed for credibility maintenance | Fits with consequentialist norms |  

  **Underdetermined Norms & Tensions:**  
  1. **Knowledge vs. Evidence:**  
     - Practice *resembles* an evidence norm but subordinates it to institutional needs. Reporter knowledge is excluded even if it constitutes evidence.  
     - Unresolved: If a reporter *knows* P via firsthand evidence, why is that *less reliable* than a secondhand source? (Implied answer: legal/PR risk > epistemology).  

  2. **Truth Norm Ambiguity:**  
     - The sourcing hierarchy *aims* at truth but doesn’t treat truth as necessary/sufficient. A true claim from one source is still an "allegation"; a false claim with two sources may be stated flatly.  

  3. **Columnist Exception:**  
     - Shows the paper *could* operate with weaker norms but chooses not to for news. This separates *journalistic roles* epistemically: reporters as truth-brokers, columnists as idea-advocates.  

  **Impact of Changing the Presupposed View:**  
  *If replaced with a **Knowledge Norm**:*  
  - **Changes:** Reporters could assert claims based on firsthand knowledge (with editorial verification).  
  - **Risks:** Rise in defamation suits; erosion of perceived objectivity ("Reporter claims..." vs. "Sources confirm...").  
  - **Columnists:** Unaffected (opinion remains separate).  

  *If replaced with a **Truth Norm**:*  
  - **Changes:** Reporters could state any claim they believe true, regardless of sources.  
  - **Risks:** Increased errors and bias; collapse of institutional fact-checking.  

  *If replaced with a **Pure Trust/Consequentialist Norm**:*  
  - **Changes:** Sourcing rules could flex based on perceived reader trust (e.g., relaxing rules for "trusted" reporters).  
  - **Risks:** Inconsistency; accusations of favoritism or bias.  

  **Conclusion: A Pragmatic Hybrid**  
  The practice presupposes **institutional verificationism**: News assertions require *demonstrable corroboration* to protect organizational credibility, while opinion is exempt as inherently subjective. It rejects individual knowledge as insufficient for *institutional* fact-assertion, prioritizing verifiability over epistemology. This isn't a pure philosophical norm but a practical framework where legal, reputational, and trust concerns reshape assertion rules—treating news as a curated product of process-driven validation, not individual testimony. The columnist exemption confirms that the paper sees news and opinion as distinct "language games" with divergent norms.
