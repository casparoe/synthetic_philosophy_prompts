answer: |-
  ### Grading & Feedback (Total: 17/20)  

  **Question 3(a): Reconstruct the colleague’s inference. (4/4)**  
  ✅ **Strengths:**  
  - Correctly identifies the core premises: (i) institutions = patterns of individual behavior (ontological individualism), (ii) composites cannot explain what components cannot (reductionist premise).  
  - Accurately derives the conclusion (iii): institutional explanations are incomplete ("placeholders").  
  - Precise and succinct reconstruction.  

  **Question 3(b): Is the inference valid? (4/6)**  
  ⚠️ **Partial Credit (Missing Key Counterargument):**  
  ✅ **Right:**  
  - Correctly notes that ontological individualism (i) does not *entail* explanatory individualism (iii).  
  - Validly argues that explanatory relevance ≠ metaphysical basicality (e.g., "interest rate" explanation can be valid despite supervenience).  
  ❌ **Wrong/Missing:**  
  - Fails to address premise (ii): **The student claims (iii) "doesn’t follow from (i) and (ii)" but doesn’t refute (ii)**. Premise (ii) ("a composite can’t explain what its components don’t") is the crux of the colleague’s argument. A full rebuttal requires showing why emergent properties *can* have explanatory power irreducible to components (e.g., "high-trust society" as a causal force).  
  - **Full-Credit Response Needed:**  
    > "The inference is invalid. While (i) is plausible, (ii) is false: emergent properties (e.g., ‘institutional culture’) can causally explain phenomena *without* being reducible to individual components (e.g., by constraining individual choices). Thus, (iii) does not follow."  

  **Question 3(c): What does multiple realizability do for the colleague’s case? (2/4)**  
  ⚠️ **Partial Credit (Misapplication):**  
  ✅ **Right:**  
  - Correctly defines multiple realizability (e.g., "high-trust society" realized by diverse individual arrangements).  
  ❌ **Wrong:**  
  - **Reverses the argument’s purpose**: Claims MR "means the individual-level story is carrying the explanatory load," but MR *undermines* the colleague’s reductionism. If one social fact (e.g., inflation) is realizable by many individual configurations, citing individuals *fails* to capture the general cause, making social-level explanations *more* robust.  
  - **Full-Credit Response Needed:**  
    > "MR weakens the colleague’s case: If a social fact (e.g., ‘recession’) can be realized by disparate individual actions, then individual-level explanations are either disjunctive (causally vague) or incomplete. Social facts (e.g., ‘monetary policy’) provide unified explanations where individual details are irrelevant."  

  **Question 3(d): Durkheim and Popper responses (7/6)**  
  ✅ **Durkheim (3/3):**  
  - Perfect: Rejects (iii) while accepting (i). Correctly cites social facts (integration/regulation) explaining rates, not individuals. Highlights Durkheim’s anti-reductionism.  
  ⚠️ **Popper (4/3 – Extra Credit for Depth but Minor Error):**  
  ✅ **Right:**  
  - Correctly notes Popper’s focus on methodological individualism and "intended results."  
  - Accurate contrast with Weber.  
  ❌ **Minor Error:**  
  - Popper **does accept unintended consequences** (e.g., "paradox of unintended consequences" in *Poverty of Historicism*). His individualism requires tracing social outcomes to individual actions *whether intended or not*.  
  - **Sufficient Response:**  
    > "Popper would endorse (iii): Social explanations must reduce to individuals’ actions and intentions (or unintended consequences), avoiding ‘holistic’ causes."  

  ---  
  **Final Mark Breakdown**  
  - (a): 4/4  
  - (b): 4/6 (Missing critique of premise ii)  
  - (c): 2/4 (Misapplies MR)  
  - (d): 7/6 (Durkheim 3/3, Popper 4/3 – extra point for Weber insight)  
  - **Total: 17/20** (Strong answer with nuanced errors; deduct 1 for Popper inaccuracy if strict)  

  **Key Feedback for Student:**  
  > "Your reconstruction (a) and Durkheim (d) are flawless. For (b), you missed refuting premise (ii) – push back on whether composites *can* have explanatory power. In (c), you reversed MR’s implication: it challenges reductionism, not supports it. Popper (d) allows unintended consequences; adjust slightly. Overall: excellent engagement with supervenience and theory!"
