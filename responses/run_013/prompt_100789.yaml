  The user's suspicion about Lakatos being "near-unfalsifiable" is partly right but... wait, there's that constraint about needing to predict novel facts. In cold fusion, most patches were just explaining away failures rather than predicting new phenomena. That's key - it wasn't just slow progress but backward motion.

  What Lakatos didn't anticipate? Probably how social factors (media hype, institutional pressure) can artificially sustain degenerating programmes. Also how "signature switching" - changing what counts as evidence - goes beyond his model. 

