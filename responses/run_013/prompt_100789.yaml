  The protective belt is where things get interesting. The user mentions specific rescue moves like "palladium sample purity matters" or "neutrons get absorbed." I'll need to evaluate which were ad hoc (like adding epicycles) versus those that genuinely added testable content (like precise material science requirements). 

  Ah, the user's real concern seems to be whether Lakatos's framework is too forgiving - that degenerating programmes can claim they're just "not there yet." That's a sharp critique. I should address how Ladhak's concept of progressive vs degenerating shifts actually works in this case, despite all the patches.

