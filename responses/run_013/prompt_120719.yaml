  Below is a decision tree designed to navigate the landscape of views on future contingents, structured as a numbered, indented outline. Each node poses a concrete question based on specified cases, requiring no prior knowledge of philosophical positions to answer. The tree starts from the fundamental commitment of whether future contingent statements can be true today (reflecting your starting point) and branches through the cases you requested. It is limited to six levels, with each leaf named and accompanied by its most awkward commitment. The tree is written in British English.

  ### Decision Tree: Truth Values of Future Contingents

  1.  **Commitment:** You accept that a sentence about tomorrow can be true today (e.g., "There will be a sea battle tomorrow" about a contingent event). Consider a written prediction sealed in an envelope today, later opened after the event and found to match what happened. Does this prediction have a truth value (true or false) *at the time it is written*?  
      *   **No:** It lacks a truth value when written. Go to 2.  
      *   **Yes:** It has a truth value when written. Go to 3.  

      2.  **View: Future contingents are neither true nor false (Aristotelian view).**  
          *Most awkward commitment:* A written prediction later vindicated by events (e.g., "The sea battle will occur") was neither true nor false when made, yet after the battle, we must say it *was* true—creating tension between past and present assessments.  
      3.  **Question:** Consider a prediction that prevents itself from coming true (e.g., "No one will ever read this prediction," written in a book that is widely read *because* of this claim). If we accept that future contingents can be true/false when stated, does the possibility of such self-defeating predictions imply the future is not settled at the time of prediction?  
          *   **Yes:** The future is unsettled. Go to 4.  
          *   **No:** The future is settled. Go to 5.  

          4.  **Question:** Consider a statement about the future that no one will ever utter or entertain (e.g., "A specific atom in a remote galaxy will decay at noon tomorrow"). If the future is unsettled, does this statement *still* have a truth value today?  
              *   **No:** Truth value depends on being expressed or assessed. Go to 6.  
              *   **Yes:** Truth value exists independently. Go to 7.  

              6.  **View: Truth value is relative to the standpoint of assessment (Relativism).**  
                  *Most awkward commitment:* A vindicated prediction (e.g., "The sea battle will occur") is true when we look back after the event, but it was not true when made—so the same fact cannot be stably true across time.  
              7.  **Question:** Consider a prediction about a free choice you have not yet made (e.g., "You will choose tea tomorrow"). If this is true today, does that eliminate the point of deliberating about it?  
                  *   **No:** Deliberation remains meaningful. Go to 8.  
                  *   **Yes:** Deliberation is pointless. Go to 9.  

                  8.  **View: Truth values are fixed by what actually happens, but the future is unsettled (Ockhamism).**  
                      *Most awkward commitment:* The truth of "You will choose tea" is fixed today, making your future choice inevitable, yet you must still deliberate as if it were open—creating a paradox of agency.  
                  9.  **View: Truth values are settled by God's knowledge of what creatures would freely do (Molinism).**  
                      *Most awkward commitment:* God knows today what you would freely choose in circumstances that never occur (e.g., if a sea battle happened), making truths about unrealised possibilities independent of actual events.  
          5.  **Question:** Consider a statement fixed by present laws and initial conditions (e.g., "The sun will rise tomorrow" in a deterministic universe). Does a true future-contingent statement require something in the *present* to make it true (a "truthmaker")?  
