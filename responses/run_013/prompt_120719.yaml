              *   **No:** No present truthmaker is needed. Go to 11.  

              10. **View: The future is already settled, with present truthmakers (Determinism/Eternalism).**  
                  *Most awkward commitment:* If "The sea battle will occur" is true today due to present causes, then our sense of free will is illusory, and efforts to prevent the battle are futile.  
              11. **View: The future is settled, but statements have truth values without present truthmakers (Truthmaker gap).**  
                  *Most awkward commitment:* A true statement about the sea battle has no basis in current reality, making truth seem "ungrounded" or disconnected from the world.  

