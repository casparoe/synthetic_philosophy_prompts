answer: |-
  ## **Crowdsourced Adjudication Manual for Social Cohesion (CAMSC)**
  **Effective Date:** Upon Dissemination

  **§1. PURPOSE AND AUTHORITY**
  This Manual provides a framework for determining the appropriate scope and intensity of Informal Social Sanction (ISS). ISS constitutes the collective exercise of free association by the Community to maintain shared norms and values outside formal institutions. The authority for ISS derives organically from the Community itself. The guidelines herein seek to ensure consistency and proportionality in the application of ISS, recognizing its vital expressive function in condemning breaches of trust and signaling communal boundaries.

  **§2. OFFENSE CONDUCT**
  **§2B1.1. Base Offense Level**
  The Base Offense Level for any sanctionable act is established upon the creation and dissemination of a Verifiable Record (e.g., screenshot, audio clip, video recording) demonstrating the conduct. The Base Offense Level varies depending on the perceived gravity of the norm violation inherent in the Record itself. (See §5H for Proportionality Considerations).

  **§2B1.2. Specific Offense Characteristics (Enhancements)**
  (a) **Abuse of Position of Trust:** Increase by 8 levels if the offender occupied a position of perceived influence, respect, or leadership within the Community or a relevant sub-community, and the offense conduct exploited that position.
  (b) **Scale of Dissemination:** Increase by 2 levels for each order of magnitude increase in the initial dissemination reach beyond the immediate context (e.g., direct message to group chat = 0; public post = +2; viral spread = +4 or more).
  (c) **Pattern of Misconduct:** Increase by 4 levels if the Verifiable Record demonstrates a pattern of similar conduct, or if credible contemporaneous allegations of such a pattern emerge promptly.

  **§3. ADJUSTMENTS FOR ROLE IN THE OFFENSE**
  (a) **Aggravating Role (Instigator):** Increase by 6 levels if the participant initiated the dissemination of the Verifiable Record and framed the narrative triggering the ISS response. This applies regardless of subsequent amplification by others.
  (b) **Mitigating Role (Amplifier):** Decrease by 10 levels for any participant whose sole contribution to the ISS event was to amplify the initial dissemination (e.g., quote-tweet, share without significant original commentary). *Note: The negligible individual impact of each amplification event necessitates this significant reduction, though the aggregate effect remains substantial.*

  **§4. ACCEPTANCE OF RESPONSIBILITY**
  (a) A participant may receive a reduction of 3 levels only if they publicly acknowledge the harm caused by the conduct depicted in the Verifiable Record *before* the Record achieves significant dissemination.
  (b) To qualify:
      (1) The acknowledgment must be unequivocal.
      (2) The acknowledgment must refrain entirely from explanations of intent, context, mitigating circumstances, or extenuating factors.
      (3) The acknowledgment must not reference the participant's internal state or motivations.
      (4) The acknowledgment must be disseminated via the same platform(s) as the original offense conduct.
  (c) Apologies issued *after* the Verifiable Record achieves dissemination are generally deemed performative and do not qualify for reduction.

  **§5. DEPARTURES**
  **§5H. PROPORTORTIONALITY CONSIDERATIONS**
  (a) ISS must be proportionate to the offense conduct as assessed through the application of Offense Levels and Enhancements.
  (b) The intensity of ISS (e.g., pile-on severity, callout duration, breadth of deplatforming, permanence of exclusion) should correspond directly to the final Offense Level determined.
  (c) Determination of proportional ISS levels is inherently contextual and community-specific. Practitioners must exercise judgment calibrated to the perceived severity reflected in the Offense Level. *Note: While higher levels warrant more severe ISS, the Manual deliberately refrains from quantifying the specific ISS consequences attached to each level, preserving necessary flexibility.*

  **§6. ADVISORY NATURE OF GUIDELINES**
  (a) These guidelines are advisory only. The Community retains full sovereignty in determining the application and intensity of ISS in any given case.
  (b) The inherently decentralized and spontaneous nature of ISS precludes the establishment of formal appellate review mechanisms. Individual participants or targets possess no procedural right to challenge the application or outcome of ISS events. **^1**
  **^1** *While the concept of appeal exists within formal justice systems as a safeguard against error, its structural requirements (a hierarchical reviewing body, defined procedures, binding precedent) are fundamentally incompatible with the organic, collective action that defines ISS. Attempts to impose such structures would constitute an invalid constraint on free association.*

  **§7. HISTORICAL AND LEGAL PRECEDENTS (NON-APPLICABILITY)**
  (a) **Bills of Attainder:** The prohibition against legislative acts declaring guilt and imposing punishment without trial does not apply to ISS. ISS is non-legislative, emergent social action, not state punishment.
  (b) **Ex Post Facto:** The prohibition against retroactive punishment does not constrain ISS. Community norms and the boundaries of acceptable conduct evolve dynamically. Conduct deemed sanctionable *now*, even if occurring under a prior, less-defined understanding, is subject to ISS.
  (c) **Double Jeopardy:** The prohibition against multiple punishments for the same offense does not apply. ISS is a continuous process of social boundary maintenance, not a discrete judicial proceeding. Subsequent ISS events arising from the same Verifiable Record reflect ongoing communal reassessment, not unlawful duplication.
  (d) **Statutes of Limitation:** Temporal limitations on initiating proceedings are incompatible with the enduring nature of digital records and the perpetual relevance of communal trust violations. Verifiable Records possess no inherent expiration date for triggering ISS.

  **§8. NATURE OF SANCTION AND EXPRESSIVE FUNCTION**
  (a) ISS constitutes the exercise of fundamental rights of free association and dissociation by individuals within the Community. It is *not* punishment in the legal sense, as it involves no state action or deprivation of legal rights.
  (b) A primary function of ISS is to serve as a stark, communal denunciation of the offender's conduct. This expressive condemnation serves to reaffirm shared values, deter future violations, and publicly recast the offender as an outsider whose actions place them beyond the current boundaries of communal trust and protection – a digital analogue to the ancient concept of outlawry.
  (c) ISS often involves "making an example" of the offender to vividly demonstrate the consequences of norm violation and thereby reinforce communal cohesion.

  **§9. RESTORATION OF STANDING**
  (a) The Community recognizes the profound impact of ISS and acknowledges the theoretical possibility of an offender's eventual redemption and reintegration.
  (b) Mechanisms for the formal restoration of standing, or the mitigation of ongoing ISS effects, lie outside the scope of this Manual. Such pathways, if they exist, are ad hoc, highly context-dependent, and reside solely within the discretionary grace of the Community itself.
  (c) *Commentary:* The persistence and intensity of ISS often stem from a profound failure of legitimate institutions (social, professional, legal) to adequately address harms or breaches of trust experienced by community members. Where formal recourse is perceived as absent, ineffective, or unjust, ISS emerges as the sole available means for communal self-protection and the expression of collective condemnation. This Manual, therefore, documents a necessary, if imperfect, social adaptation to institutional void.
