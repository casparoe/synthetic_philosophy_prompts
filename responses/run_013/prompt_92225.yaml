prompt: |-
  I'm a doctoral student in constitutional law and I do the drafting for a small informal body that advises our head of state's office on the reserve powers. Five of us: a retired judge, a constitutional historian, two former private secretaries, and me. The country is a parliamentary monarchy on the Westminster model — ceremonial head of state, elected house of 300, a PM who has to be able to command the confidence of that house, statutory four-year terms, no codified constitution. Our opinions aren't binding, but the office has never gone against one. The panel meets Thursday on something live and I'm the junior one, so alot rides on whether I've read the record right. I'd like you to act as an expert on Westminster conventions and the reserve powers and work through this with me: no reading list and no citations please, I can't get online right now and half of what I'd want to cite lives in scanned parliamentary records anyway. I want the reasoning from our own record. Please brainstorm the candidate rules first and only then commit to one.

  Here's the record. (1) PM lost a confidence vote by 9 and refused to resign, asking for a dissolution 18 months into the term; an opposition leader had a signed agreement with a minor party worth 168 of 300 seats. We advised: refuse the dissolution, and once the PM resigned, commission the alternative. (2) PM lost a confidence vote; the two largest opposition parties had publicly ruled out any arrangement with each other, so no alternative majority existed in any form; he asked for a dissolution 20 months into the term. We advised: grant it. (3) Same shape as (2), but the statutory election date was five weeks away. We advised: refuse; the PM stays on as a caretaker with a limited agenda until the scheduled date. (4) A government that still commanded the house comfortably asked for a six-week prorogation — lawful, well inside its ordinary powers, formally to "reset the legislative programme," but plainly timed to kill a backbench bill that would have embarrassed two ministers. We advised: refuse the long prorogation, offer only the ordinary recess. One member dissented then and still does, on the ground that the Crown has no business second-guessing a confident government acting lawfully. (5) A bill the head of state personally loathed passed both houses on a free vote; we advised assent without hesitation. (6) After an inconclusive election the largest party, 132 of 300, couldn't assemble a majority; a bloc of 122 plus two minor parties totalling 158 could, and the largest party's leader asked for a dissolution only three weeks after polling day. We advised: refuse; let the house meet and let the alternative be tested on the floor. The incumbent resigned, the alternative was commissioned, and it survived its confidence vote by 6.

  Now the live one. Election four months ago. The incumbent party got the most votes nationwide but only 128 seats, down twenty. The other bloc is 122 + 20 + 10, so 152 against a majority line of 151 — but the 20-seat partner has said publicly it won't vote for the budget, and the 10-seat partner says it will only turn up for confidence motions. The house has not yet met. The incumbent PM refuses to resign, argues that the only alternative is a coalition that will fall over at the first budget, and asks for a dissolution. The alternative leader says she can command the house and should be commissioned. So: reconstruct the rules that actually fit our six opinions — I suspect there's more than one, and I'd like the ones that fit everything, not just the ones that fit comfortably — tell me what each predicts here, then give me your best guess with your reasons, name which precedent is the closest analog and exactly where the analogy breaks down, and be honest about what principle we'd be adopting if we refuse versus if we grant. Then tell me the case that would best tell the surviving rules apart, because I'd rather test them than keep relitigating this one. And don't forget to say what the dissenting member would make of all of it.
reasoning: |-
  Okay, the user is a doctoral student in constitutional law working with an advisory panel on reserve powers in a Westminster-style parliamentary monarchy. They need help reconstructing rules from past precedents to advise on a current situation. Let me start by understanding the six precedents they provided.

  First, in case (1), the PM lost a confidence vote but an opposition leader had a clear majority. They advised refusing dissolution and commissioning the alternative. That suggests a rule where if a viable alternative government exists, dissolution should be denied. 

  Case (2) had no viable alternative after a confidence loss, so dissolution was granted. Case (3) was similar but close to the statutory election date, so dissolution was refused. Here, proximity to the election date matters, and caretaker government is preferred. 

  Case (4) involved prorogation used to kill a bill. They refused, indicating that the Crown can intervene if the power is abused, even if lawful. The dissent here is important—some believe the Crown shouldn't second-guess a confident government. 

  Case (5) showed assent must be given regardless of personal views, emphasizing ceremonial role. Case (6) refused dissolution post-election because an alternative coalition could form, tested in the house. 

  Now the current case: post-election, incumbent has 128 seats, opposition bloc totals 152 but with internal issues—20-seat party won't support the budget, 10-seat only for confidence. Incumbent PM refuses to resign, wants dissolution. Alternative claims confidence. 

  I need to find rules fitting all six precedents. Rule A: Dissolution refusal only if a viable alternative exists and can be tested immediately. Viability depends on demonstrated support, not just numbers. Here, the alternative has numbers but budget uncertainty. Precedent (6) had a clear coalition; here, the budget issue complicates viability. 

  Rule B: Dissolution should be granted if no stable alternative is apparent. But precedents (1) and (6) refused even with uncertainties. The dissenting member from (4) would argue against second-guessing the PM's assessment, supporting dissolution. 

  Closest precedent is (6), but the breakdown is the budget issue. If the alternative can't pass a budget, is it viable? Precedent (1) had a signed agreement, so more concrete. Here, public statements create doubt. 

  Testing rule: A scenario where an alternative claims support but faces immediate legislative hurdles. If refusal leads to a quick confidence loss, it validates the rule. If the government collapses, it might justify dissolution later. 

  Advising refusal: Principle that the house should test alternatives first. Granting dissolution might be seen as premature. The dissenter would argue for non-interference. 

  Need to balance precedents, avoid inconsistency. Current case leans towards refusal but with risk. Highlight the budget as a key difference from (6), but the house should decide.
answer: |-
  Based strictly on your panel's six precedents—without importing external doctrine—here's the reconstruction of rules, their application to the live case, and my analysis:

  **Reconstructed Rules from Precedents:**
  1.  **On Dissolution After Confidence Loss:**
      *   **Refuse** if a *demonstrably viable alternative government* exists that can command the house *and* can be commissioned without undue delay (Case 1).
      *   **Grant** if *no viable alternative government* exists or can be formed (Case 2).
      *   **Refuse** if the *statutory election date is imminent*, regardless of other factors, forcing caretaker government until then (Case 3).
  2.  **On Dissolution After Inconclusive Election (Before House Meets):**
      *   **Refuse** if a *plausible alternative majority bloc* exists that *could* command the house, forcing the house to meet and test it (Case 6). Viability is judged based on public statements/agreements, not certainty of longevity.
  3.  **On Prorogation/Powers of a Confident Government:**
      *   **Refuse** requests that, while lawful, *abuse constitutional conventions or powers* for partisan advantage, undermining parliamentary accountability (Case 4). The Crown *can* second-guess motive/effect in such exceptional circumstances.
      *   *Dissent Principle:* The Crown should *not* interfere with lawful actions of a government commanding confidence, regardless of motive (Case 4 dissent).
  4.  **On Assent:** Always granted if a bill passes both houses lawfully; personal views are irrelevant (Case 5).

  **Application to the Live Case (Election 4 months ago, House not met):**
  *   **Rule A (Strict Precedent - Case 6 Analog):** Refuse dissolution. A plausible alternative bloc exists (152 > 151), publicly announced. Its internal difficulties (budget, attendance) are for the *House* to expose/test through a confidence vote and subsequent governance, not for the Head of State to pre-judge. The incumbent PM refusing to resign without the House meeting aligns *against* the precedent. **Prediction: Refuse dissolution. Commission the alternative leader.**
  *   **Rule B (Modified Viability - Incorporating Case 2 & Dissent Principle):** Grant dissolution. The alternative bloc's public fissures (20-seat party rejecting budget, 10-seat party limiting attendance) make its claim to "command the house" demonstrably *non-viable* for ordinary governance *from the outset*, akin to no alternative existing (Case 2 spirit). Granting dissolution avoids commissioning a government doomed to immediate collapse. The dissent from Case 4 would strongly support this non-intervention. **Prediction: Grant dissolution.**
  *   **Rule C (House-Centric Minimalism - Cases 1, 3, 6 Core):** Refuse dissolution. The *only* question before the House meets is: "Is there a *prima facie plausible alternative* that deserves testing *on the floor*?" The 152-seat bloc meets this low threshold (Case 6). Concerns about budget stability are legitimate but *premature*; they pertain to the government's *durability*, not its initial *ability to gain confidence*. Durability is irrelevant to the initial commission decision (Case 1 involved a coalition too). **Prediction: Refuse dissolution. Commission the alternative leader.**

  **My Best Guess & Reasoning:**
  *   **Recommendation:** Refuse Dissolution. Commission the alternative leader.
  *   **Reasoning:** The *strongest and most consistent* precedent is **Case 6**. The core principle there, reinforced by Case 1 (refusing dissolution for a viable alternative) and Case 3 (forcing the House to function near term), is **parliamentary sovereignty**: the House itself must be the primary arena for testing claims of confidence and governmental viability whenever a plausible alternative exists. Pre-judging internal coalition dynamics based on public statements (Rule B) steps onto the slippery slope the panel avoided in Case 6 and contradicts the refusal in Case 1 despite the PM's argument about alternatives. Case 4 shows the panel *is* willing to second-guess motive/convention abuse, but the dissent highlights that's contentious and confined to *exceptional* abuse of power by a *confident* government. Here, the government *isn't* confident (it lost its majority), and the issue is initial testing, not abuse. The budget issue is a critical *governance* challenge, but not one that inherently prevents the alternative bloc from *gaining* confidence initially.
  *   **Closest Precedent:** **Case 6**.
  *   **Where the Analogy Breaks Down:** The breakdown is the **specificity of the governance obstacle**. Case 6 involved a bloc claiming it *could* govern. Here, a key element of governance (passing a budget) is *explicitly rejected beforehand* by a crucial partner (the 20-seat party). This makes the alternative's claim to "command the house" for *governing purposes* significantly weaker *from the start* than in Case 6, where the challenge was forming the coalition, not its immediate legislative agenda. However, precedent still points to the House testing this fragility.
  *   **Principle if Refuse Dissolution (Commission Alternative):** The Head of State's role is to facilitate the House expressing its confidence. A plausible alternative claimant must be tested *on the floor* before dissolution is considered. Durability concerns are for MPs, not the Crown, at this stage.
  *   **Principle if Grant Dissolution:** The Head of State can pre-judge the *governing viability* of an alternative bloc based on public statements indicating fundamental, immediate dysfunction, effectively finding "no viable alternative" exists despite the numbers, justifying an early election as the least bad option.

  **The Dissenting Member's Likely View:**
  They would **strongly advocate granting the dissolution**. Their core principle (Case 4 dissent) is that the Crown should *never* substitute its judgment for that of a Prime Minister (or in this pre-commission stage, the incumbent PM or the claims of alternatives) regarding political arrangements, especially based on public posturing. They would argue:
  1.  The incumbent PM has the right to request dissolution without resigning until defeated *in the House*.
  2.  Assessing the internal cohesion and governing viability of the 152-seat bloc is a *political judgment* far beyond the Crown's remit. Public statements are often negotiating tactics.
  3.  Granting dissolution lets the *voters* clarify the situation, avoiding the potential farce of commissioning a government that collapses within weeks on the budget.
  4.  Refusing dissolution based on an assessment of the alternative's viability is precisely the kind of "second-guessing" they condemned in Case 4, even if the government isn't currently confident.

  **The Test Case to Distinguish Surviving Rules:**
  A **"Confidence-and-Supply Crisis":**
  *   A government commands confidence narrowly (e.g., 152-148).
  *   Its key supply-and-confidence partner (holding 20 seats) publicly *withdraws* support *specifically for the upcoming budget*, stating they will vote against it or abstain, triggering an automatic loss of confidence under the fixed-term parliament act (or equivalent convention).
  *   The PM immediately requests dissolution.
  *   The Opposition Leader claims they can form a government with other defectors/minor parties and requests commission.

  **Why this tests the rules:**
  *   **Rule A (Strict Precedent/Parliamentary Test):** Likely *refuse* dissolution. The government *has just lost* confidence (on the budget trigger). The House should first test if the Opposition Leader *can* gain confidence *now* before dissolution. (Analog: Immediate confidence loss needing an alternative - Case 1).
  *   **Rule B (Viability Pre-Judgement/Dissent Principle):** Likely *grant* dissolution. The government lost confidence due to its partner's defection. The Opposition's claim is untested and involves complex realignment *after* a confidence loss. Let the voters decide the new mandate. The Crown shouldn't pick a new PM amidst chaos. (Analog: No clear stable alternative - Case 2 spirit; Dissent Principle).
  *   **Rule C (House-Centric Minimalism):** *Refuse* dissolution. The government lost confidence. The Head of State's duty is to see if the *existing House* can produce a government (i.e., commission the Opposition Leader to test confidence) before dissolving. The *reason* for the confidence loss (budget) doesn't change the immediate constitutional step.

  **Conclusion for Your Live Case:** Precedent, particularly Case 6, points strongly towards **refusing dissolution and commissioning the alternative leader**. While the budget issue creates significant doubt about the alternative's *durability*, the panel's record shows a consistent preference for letting the House make that discovery itself rather than the Head of State pre-judging political viability based on announcements. The dissenting member would vigorously oppose this, arguing it crosses the line into political territory. Be prepared to explicitly frame the advice around the *House's* right to test the alternative's claim to confidence *first*, separating that initial test from concerns about its *subsequent* ability to govern effectively. Good luck Thursday.
