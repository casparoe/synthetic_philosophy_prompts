prompt: |-
  My friend is a historian of how moral norms die and she has a running theory about which deaths were arguements, which were interests, and which were honour. Her track record: dueling in Britain fizzled out in the middle of the nineteenth century, and she insists that wasn't because anyone found a new argument — the case against it had been made since the seventeenth century and nobody moved. What changed is that refusing a challenge became the gentlemanly thing, and the men who insisted on fighting were the ones whose careers and credit couldn't take the hit. Foot binding, same shape: the reformers bounced off for decades, and what did it was elite families unbinding first, so bound feet went from the mark of the refined to the mark of the backwoods — though she'll add that once binding stopped paying, the new schools and factories wanted women who could move. British abolition she tells as an interests story: the moral case is ancient, the West India interest just lost its weight to the free-traders — though she'll also say slaveholding had stopped being respectable in the circles that ran the country. So she sounds like a status person on two of them and an interest person on the third, and I can't tell if that's one rule or two.

  The case she hasn't ruled on: hanging people in front of a crowd, which moved behind prison walls in the second half of the nineteenth century, Britain first. Nobody's wallet got better when that happened — public hangings were cheap, the crowd loved them, and everyone thought the publicity was the whole point, detterence-wise. What changed is that the men presiding couldn't stand it any more: the spectacle had become degrading to the authorities rather than to the condemned. So what's she going to say? Is this a status death or an interest death, and will she wriggle by saying the crowd had become a mob and the state had an interest in order? Best guess, with your reasons, and name the one further case that would actually settle which rule she's running — and if her verdicts genuinely don't settle it, say so and tell me what she'd be signing up for either way. Last line, machine-readable: Verdict: <status|interests|argument|mixed>, <status-death|interest-death>.
reasoning: |-
  Okay, the user's query is about their historian friend's theory on how moral norms die, categorized into arguments, interests, or honor. The friend has analyzed three historical examples: dueling in Britain, foot binding, and British abolition. Now, the user wants to predict how the friend will classify the abolition of public hangings in Britain and identify a case that would clarify her rule.

  First, I need to recap the friend's existing classifications. For dueling, she says it wasn't about new arguments but status—refusing became gentlemanly, and only those with low status risked fighting. Foot binding is similar: elite families stopped first, making it a mark of low status, reinforced by economic changes. Abolition is framed as interests—economic shifts favored free-traders over slaveholders, though there's a nod to respectability.

  The new case is public hangings moving behind prison walls. The user notes no economic interest (they were cheap and popular), but authorities found the spectacle degrading to themselves. The key point is the shift in what was degrading—from the condemned to the authorities. That sounds like a status concern for the ruling class.

  The friend might consider this a status-death because it's about maintaining the dignity and authority of the state. She might mention crowd control as an interest, but the primary driver seems to be the elite's discomfort with the spectacle harming their image.

  To settle whether her rule is solely status or includes interests, a clear case where interests and status diverge is needed. The user suggests the fall of apartheid. If she calls it interest-driven (sanctions hurting the economy) despite the regime's status loss, that leans toward interests. If she emphasizes internal status shifts among elites abandoning apartheid for respectability, that's status-focused.

  The verdict for hangings should be "status" as the main driver, with possible minor interest in order. The final answer should classify it as a status-death.
answer: |-
  Based on your description of your friend's theory and precedents, here's the best guess for how she'll analyze the end of public hangings in Britain:

  1.  **Verdict for Public Hangings: Status-Death**
      *   **Reasoning:** The core driver aligns perfectly with her "status" pattern seen in dueling and foot binding:
          *   **No New Argument:** Arguments against public executions (brutality, ineffectiveness, potential for disorder) existed long before the mid-19th century. Reformers weren't suddenly more persuasive.
          *   **No Clear Interest Shift:** As you state, there was no economic *gain* for the state (it became more expensive), the crowd (public spectacle lost), or likely executioners. Public hangings were cheap deterrents. While *potential* disorder ("the mob") might be cited, the primary motivator wasn't a *new* interest in order – maintaining order was always an interest. What changed was the *perception* of the event's effect *on the authorities*.
          *   **The Status Shift:** The key change is the **redefinition of what constituted respectable, dignified authority**. The spectacle became "degrading *to the authorities*" rather than just to the condemned. For the elite men presiding (judges, officials, the governing class), associating themselves with this increasingly seen as barbaric spectacle damaged *their own* status, honor, and sense of civilized governance. Ending public hangings became a way for the state/elite to *maintain* or *elevate* its perceived status and self-respect in the eyes of itself and its peers. This mirrors dueling (refusing became gentlemanly status) and foot binding (unbound became refined status).

  2.  **Will She Wriggle?** She *might* mention the "mob" element *as a consequence* of the degrading spectacle or as an *additional* minor reinforcing factor, framing it as the state protecting its dignity *from* disorder. However, the primary driver according to your description is the authorities' own sense of degradation. The "interest in order" was likely always present; what changed was the *source* of the threat to order (the spectacle itself undermining authority) and its link to elite *status* discomfort. She won't need to wriggle hard; the status explanation fits cleanly.

  3.  **The Case to Settle the Rule:** To definitively distinguish if her core rule is purely *Status* or a *Status-Interest Hybrid*, we need a case where **economic/material interests and elite status perceptions move strongly in *opposite* directions**, and the outcome follows one clearly.
      *   **The Ideal Case: The Fall of Apartheid in South Africa.**
          *   **Why it Settles It:**
              *   **Strong Status Element:** Apartheid became globally *profoundly* dishonorable and a mark of pariah status for the white South African elite and government. Maintaining it damaged their international standing and self-perception as "civilized."
              *   **Strong Interest Element:** Economic sanctions inflicted massive, tangible financial costs. Business interests (domestic and international) increasingly saw apartheid as bad for business and investment. Ending it promised significant material relief and opportunity.
          *   **Her Verdict Here is Revealing:**
              *   If she calls it an **Interest-Death**, emphasizing the crippling sanctions, capital flight, and business pressure as the *decisive* factors, even though status loss was immense, she leans towards **Interests** being the ultimate driver when they conflict and are strong enough. Status loss might be a *tool* or *consequence* for interests.
              *   If she calls it a **Status-Death**, arguing that the *stain* of pariah status became intolerable to the *self-image* and *international standing* of the governing Afrikaner elite *itself*, and that the economic pain was primarily *effective* because it *caused* this status loss, then she leans towards **Status** as the core meta-driver. Interests serve to enforce status concerns.
              *   If she calls it **Mixed**, then her theory inherently blends both, and there is no single rule.

  4.  **Do Her Verdicts Settle It?** Her existing verdicts (**Status** for Dueling/Foot Binding, **Interests** for Abolition) **do not definitively settle** whether she has one core rule (Status *or* Interests) or a blended theory. Abolition *could* be seen as interests leveraging a pre-existing shift in status (slaveholding losing respectability). Her addition about respectability in abolition hints she might see status *facilitating* the interest shift. If forced to choose based on her framing:
      *   **Signing up for Status as Core:** If she views the respectability loss in abolition as a necessary *precondition* that *allowed* the free-trade interests to prevail, then Status is the deeper, enabling force. Norms die when maintaining them damages elite status, whether directly (dueling, foot binding, hangings) or by creating vulnerability to interest-based challenges (abolition).
      *   **Signing up for Interests as Core:** If she views the respectability loss in abolition as largely a *reflection* or *propaganda effect* of the rising power of anti-slavery economic interests, then Interests are the fundamental driver. Status shifts are epiphenomenal or tools used in interest battles. Dueling/foot binding might then be cases where status *was* the primary "interest" (social capital).

  **Last Line (Machine-Readable):**
  Verdict: status, status-death.
