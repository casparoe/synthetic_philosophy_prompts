  - Prior: We must justify the prior (e.g., "We use the frequency of toxicity in a reference class of structurally similar additives that have been tested").
  - Likelihood: We must document the models and their assumptions (e.g., the dose-response model and the extrapolation factors).
  - If we cannot justify the prior or the likelihood, the number fails.

  **Result for Example 1**: 
  We can produce a probability estimate via a Bayesian approach, but it relies heavily on value judgments (choice of prior, weights). We must document these. The chief scientist must sign off on the judgments. This might be uncomfortable because the number is not a frequency and is not directly observable, but the procedure allows it as long as we are transparent.

