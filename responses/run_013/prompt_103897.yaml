  Below is a decision procedure designed for your team to systematically evaluate proposed probability estimates. It distills core philosophical interpretations of probability (frequency, propensity, Bayesian/evidential) into a practical, step-by-step checklist. The procedure forces explicit choices at points where interpretations diverge, flags value judgments requiring human input, and includes consistency tests to ensure numbers align with their claimed interpretation. It is designed for engineers/statisticians—no philosophy background needed—but preserves critical distinctions (e.g., between observed frequencies and model-based estimates).  

  **Key Philosophy Simplified for Practice**:  
  - **Frequency**: Probability = long-run ratio in a *real, observed* reference class (e.g., failure rates in historical dams). Requires data; vulnerable to reference class gerrymandering.  
  - **Propensity**: Probability = inherent physical tendency of a *specific system* (e.g., dam failure due to stress physics). Requires mechanistic models; vulnerable to overconfidence in unvalidated models.  
  - **Bayesian/Evidential**: Probability = rational degree of belief given *available evidence* (e.g., expert synthesis of data/models). Requires coherent priors/likelihoods; vulnerable to subjective priors or unquantified evidence.  
  - **Where They Diverge**: No frequency data (e.g., novel events), single-event predictions (e.g., "this dam"), conflicting reference classes, or model-based numbers without observed frequencies.  

  ---

  ### **Decision Procedure for Probability Estimates**  
  **Input**: A clearly defined event (e.g., "Adverse health effect in humans within 10 years of exposure to additive X at dose Y").  
  **Output**: A defensible probability estimate, a refusal to state a number, or a handoff for value judgments.  

  #### **Step 1: Define the Event**  
  - **Question**: Is the event specific, measurable, and time-bound? (e.g., "Dam fails within 50 years under normal conditions" includes failure modes and timeframe.)  
  - **Sufficient Answer**: Clear, unambiguous definition (e.g., "Liver toxicity in humans after 5 years of daily exposure at 1 mg/kg").  
  - **Failure**: Vague, untestable, or multi-part events (e.g., "Causes harm" without specification).  
  - **Action if Failure**: Refine definition or **terminate**—no number.  

  #### **Step 2: Identify Evidence Type**  
  - **Question**: What evidence exists? Categorize:  
    - **A**: Direct frequency data (observed counts in a reference class).  
    - **B**: Propensity evidence (mechanistic models with quantified uncertainties).  
    - **C**: Analogous data (frequencies from similar events/systems).  
    - **D**: Expert judgment (structured or unstructured).  
  - **Sufficient Answer**: Evidence categorized into A/B/C/D.  
  - **Failure**: Evidence unlisted, misclassified (e.g., calling a model "frequency data"), or absent.  
  - **Action if Failure**: **Terminate**—no number if no evidence.  

  #### **Step 3: Test for Frequency Interpretation**  
  - **Question**: Is there **direct frequency data** from a reference class matching the event?  
  - **Sufficient Answer**:  
    - Observed frequency in a well-defined, *objectively justifiable* reference class (e.g., "10 failures in 1,000 similar dams").  
    - No gerrymandering (e.g., excluding "old dams" to lower risk).  
  - **Failure**:  
    - No data (e.g., no human data for novel additive).  
    - Reference class ambiguous, gerrymandered, or mismatched (e.g., "similar dams" undefined).  
    - Sparse data (e.g., 2 failures in 10,000 dam-years with high uncertainty).  
  - **Action if Sufficient**: Use frequency. **Proceed to Step 7** for consistency test.  
  - **Action if Failure**: Go to Step 4.  

  #### **Step 4: Test for Propensity Interpretation**  
  - **Question**: Is there a **validated physical model** quantifying inherent randomness?  
  - **Sufficient Answer**:  
    - Model based on first principles or validated theory (e.g., stress-failure physics with Monte Carlo uncertainty).  
    - Randomness is inherent (e.g., material fatigue), not epistemic (e.g., "unknown corrosion").  
  - **Failure**:  
    - Model is empirical/statistical (e.g., regression from historical data).  
    - Model unvalidated or based on expert opinion alone.  
    - No mechanistic basis (e.g., toxicity predicted only by analogy).  
  - **Action if Sufficient**: Use model output. **Proceed to Step 7**.  
  - **Action if Failure**: Go to Step 5.  

  #### **Step 5: Test for Bayesian/Evidential Interpretation**  
  - **Question**: Can evidence be combined into a **coherent belief probability**?  
  - **Sufficient Answer**:  
    - Prior is justifiable (e.g., from analogous data, non-informative if no data).  
    - Likelihood quantifies evidence (e.g., dose-response model for toxicity).  
    - Posterior is computable (e.g., via Bayes' theorem or probabilistic synthesis).  
  - **Failure**:  
    - Prior arbitrary (e.g., no basis for "50% prior" in toxicity).  
    - Likelihood unquantifiable (e.g., mechanistic evidence too qualitative).  
    - Evidence conflicting/incommensurable (e.g., model says 10⁻⁶, experts say 10⁻²).  
  - **Action if Sufficient**: Use posterior probability. **Proceed to Step 7**.  
  - **Action if Failure**: Go to Step 6.  

  #### **Step 6: Value Judgment Handoff**  
  - **Question**: Can unresolved issues be fixed by **policy or consensus**?  
  - **Handoff to Humans When**:  
    - Choosing a reference class (frequency).  
    - Setting a prior or weighing evidence (Bayesian).  
    - Validating a model or accepting its limits (propensity).  
    - Resolving conflicts between evidence types.  
    - Setting acceptable risk thresholds (e.g., "Is 10⁻⁶ too high?").  
  - **Sufficient Answer**: Agency policy, precedent, or senior scientist decision documented.  
  - **Failure**: No policy, unresolved conflict, or ethical/social risk tradeoffs.  
  - **Action if Sufficient**: Use judgment to revise Steps 3–5.  
  - **Action if Failure**: **Terminate**—state probability range or refuse number.  

  #### **Step 7: Consistency Tests**  
  For **any** probability \( p \), apply these *before* finalizing:  
  - **If Frequency Claimed**:  
    1. Reference class is objective and event is a member.  
    2. \( p \) = observed frequency (e.g., \( p = \frac{\text{failures}}{\text{trials}} \)).  
    3. **Fail if**: Class is gerrymandered, or data is extrapolated.  
  - **If Propensity Claimed**:  
    1. Model reflects physical randomness (e.g., stochastic processes).  
    2. Uncertainties are quantified (e.g., 95% CI for \( p \)).  
    3. **Fail if**: Model is deterministic or based on historical data alone.  
  - **If Bayesian Claimed**:  
    1. Prior and evidence are documented.  
    2. Likelihood reflects evidence (e.g., \( p \) updates rationally with data).  
    3. **Fail if**: Prior is arbitrary or evidence is double-counted.  
  - **On Failure**: Return to Step 3/4/5 or **terminate**.  

  #### **Final Output**  
  - Document: Interpretation used, evidence, value judgments, consistency test.  
  - Approve number or refuse with reasons.  

  ---

  ### **Tests for Candidate Numbers**  
  Apply these to *any* proposed probability \( p \) to check alignment with its interpretation:  
  1. **Frequency**: Ask, "What is the *observed* success/failure ratio in the reference class?" If no ratio or class is undefined, \( p \) fails.  
  2. **Propensity**: Ask, "Does \( p \) come from a *physical law* (e.g., quantum decay) or *validated stochastic model*?" If not, \( p \) fails.  
  3. **Bayesian**: Ask, "What prior and evidence lead to \( p \)? Is it coherent if new evidence arrives?" If prior is unjustified or evidence ignored, \( p \) fails.  

  ---

  ### **Example Applications**  
  **Example 1: Novel Food Additive (Adverse Health Effect)**  
  - **Event**: Liver toxicity in humans after 5 years of daily exposure at 1 mg/kg.  
  - **Evidence**: In vitro assays (toxic), animal study (toxicity at high doses), structural analogy to known toxicant. No human data.  
  - **Run Procedure**:  
    - **Step 1**: Event defined—sufficient.  
    - **Step 2**: Evidence: B (propensity: assays/analogy), C (analogy), D (expert judgment). No A (frequency).  
    - **Step 3**: No frequency data—failure.  
    - **Step 4**: No validated physical model (mechanism not stochastic; models are qualitative/analogical)—failure.  
    - **Step 5**: Can we use Bayesian?  
      - Prior: From analogous toxicants (e.g., 30% of similar compounds are toxic).  
      - Likelihood: Animal/in vitro data extrapolated via uncertainty factors (e.g., human-equivalent dose model).  
      - Sufficient? **Yes**, but prior choice (which analogs?) and likelihood weights (how to combine assays?) require value judgments.  
    - **Step 6**: Handoff for:  
      - Choosing prior reference class (e.g., "compounds with same functional group").  
      - Weighing mechanistic vs. analogical evidence (e.g., "animal study 2× weight of in vitro").  
      - Agency policy may guide this (e.g., EFSA guidelines).  
    - **Step 7**: Consistency test for Bayesian:  
      - Prior = frequency of toxicity in analogs (justifiable).  
      - Likelihood = dose-response extrapolation (quantifiable).  
      - **Passes** if judgments documented.  
  - **Result**: Bayesian \( p \) = 0.15 (15%) toxicity risk.  
  - **Why You Might Not Like This**: The number relies on *value-laden choices* (e.g., which analogs, extrapolation factors). It is not a frequency or propensity—it is a belief probability. The procedure forces transparency but doesn't eliminate subjectivity.  

  **Example 2: Dam Failure in 50 Years**  
  - **Event**: Structural failure of Dam X within 50 years under normal conditions.  
  - **Evidence**: Sparse historical data (2 failures in 10,000 dam-years for "similar" dams), engineering models (reliability analysis with Monte Carlo uncertainty).  
  - **Run Procedure**:  
    - **Step 1**: Event defined—sufficient.  
    - **Step 2**: Evidence: A (frequency: sparse historical), B (propensity: engineering models).  
    - **Step 3**: Frequency data?  
      - Reference class "similar dams" is ambiguous (age, design, geology?).  
      - Data sparse (2/10,000 = 0.0002/year); 50-year \( p \approx 1 - (1-0.0002)^{50} = 0.01 \).  
      - **Failure**: Reference class gerrymandered (e.g., "modern dams" might exclude failures).  
    - **Step 4**: Propensity?  
      - Engineering model (e.g., stress-load simulations with uncertainty) claims inherent randomness.  
      - Model validated? Assume yes (standard practice).  
      - Model outputs annual \( p = 10^{-5} \) → 50-year \( p \approx 5 \times 10^{-4} \).  
      - **Sufficient**: Use \( p = 5 \times 10^{-4} \).  
    - **Step 7**: Consistency test for propensity:  
      - Model = physical stochastic process (e.g., load-resistance uncertainty).  
      - But historical data (0.01 for 50 years) conflicts with model (0.0005).  
      - **Failure**: Model ignores failure modes in historical data (e.g., piping, sabotage).  
    - **Return to Step 4/5**:  
      - **Step 4 fails** (model incomplete).  
      - **Step 5**: Bayesian? Combine evidence:  
        - Prior from historical data (e.g., Beta distribution).  
        - Likelihood from model (e.g., model as "virtual evidence").  
        - But sparse data and model conflict → requires value judgment.  
      - **Step 6**: Handoff for:  
        - Choosing reference class for prior (e.g., all dams vs. modern dams).  
        - Weighing model vs. history (e.g., "model 70% weight due to dam-specificity").  
        - Setting acceptable risk (e.g., "use conservative estimate").  
      - **Result**: After judgment, \( p = 10^{-3} \) (0.1% in 50 years).  
  - **Why You Might Not Like This**: The procedure **rejects the model-based number** initially (due to conflict with data) and forces a value-laden choice. The "clean" model output (5 × 10⁻⁴) is overruled because propensity claims require physical completeness, and historical data reveals model gaps. The procedure prioritizes evidence reconciliation over technical elegance.  

  ---

  ### **Where the Procedure Misfires and Limits**  
  1. **Misfires**:  
     - **Overly Conservative**: May reject useful model-based numbers (e.g., dam) if historical data exists but is sparse.  
     - **Ambiguous Evidence**: Struggles with incommensurable data (e.g., mechanistic vs. statistical). Forces handoffs, slowing decisions.  
     - **"No Number" Outcomes**: In novel cases (e.g., AI risk), may terminate often, frustrating policymakers.  

  2. **What It Cannot Decide**:  
     - **Philosophical Disputes**: Cannot resolve "true" probability (e.g., frequentist vs. Bayesian). Only forces consistency.  
     - **Deep Uncertainty**: When evidence is qualitative or priors are hotly contested (e.g., tipping points in climate change), it defaults to termination or handoffs.  
     - **Ethical Tradeoffs**: Cannot set acceptable risk; only flags when this judgment is needed.  

  3. **Limits of Checklist Translation**:  
     - **Oversimplifies Propensity**: Reduces "physical tendency" to model validation—may miss metaphysical disputes.  
     - **Ignores Pragmatism**: Sometimes, a "good enough" number is needed (e.g., urgent risks). Procedure prioritizes rigor over timeliness.  
     - **Value Judgments Are Unavoidable**: The procedure exposes but does not eliminate subjectivity. Your team must own these choices.  

  **Final Advice**: This procedure turns fights into documented, auditable steps. It ensures numbers are traceable to evidence and interpretations, defending against "meaningless number" critiques. But it will not please everyone—especially when value judgments override technical estimates. Use it to *structure* debates, not to end them.
