prompt: |-
  You are an expert in the philosophy of probability who also works as a hands-on quantitative risk analyst — someone who knows the technical literature on what probability statements actually mean and has spent years defending real numbers in front of skeptical review committees. Work carefully and deliberately. Before you write the procedure itself, spend some effort brainstorming: enumerate the distinct things a probability claim could be asserting (a long-run frequency in an actual reference class; a propensity or disposition of a physical setup; a degree of belief rational for an agent with given evidence; a logical or evidential degree of support), and note where these come apart in practice — cases with no frequency data, single-event predictions, reference classes that can be gerrymandered, model-based estimates that are not frequencies of anything observed.

  I am the lead quantitative risk assessor at a national regulatory agency. My team produces probability estimates that go into safety decisions — whether to approve a substance, whether to order an inspection, whether to mandate a retrofit — and each estimate has to survive a public hearing and a sign-off by our chief scientist. We are not philosophers, we have roughly a week per estimate, and we keep getting stuck in the same fight: one colleague insists a number is meaningless unless it is a frequency, another treats it as whatever our best-informed expert believes, and a third talks about the inherent chance built into the physical system. I want this fight turned into something my team can actually run.

  Please write a decision procedure we can follow for any proposed probability estimate. Give me the questions to ask, in order; for each question, what counts as a sufficient answer and what counts as a failure to answer; where the procedure terminates with a refusal to state a number at all; and, crucially, where the procedure must hand the matter to a person because the remaining question is one of values rather than facts — for instance choosing a reference class, choosing a prior, weighing mechanistic against statistical evidence, or setting an acceptable risk. The procedure should keep what the competing interpretations of probability actually claim while being usable by an engineer or statistician with no background in the philosophy, and it should be explicit about which distinctions have to survive that simplification and which can be dropped. Include a short set of tests my team can apply to a candidate number to see whether it is being used consistently with the interpretation it is supposed to be an instance of.

  Then run the procedure on two estimates and show the work:

  1. The probability that a novel food additive causes a specific adverse health effect in humans, where the evidence is almost entirely mechanistic — in vitro assays, an animal study, structural analogy to a known toxicant — and there is essentially no human frequency data.
  2. The probability that a particular dam will fail within fifty years, where there is a sparse historical record of failures of similar structures and extensive engineering models with quantified uncertainties.

  At least one of these should come out in a way I will not like — say so plainly and explain why the procedure forces that result rather than softening it. End by telling me where this procedure will misfire, what it cannot decide, and the honest limits of translating these interpretations into a checklist.
reasoning: |-
  We are designing a decision procedure for producing and defending probability estimates in a regulatory context. The goal is to navigate the different interpretations of probability (frequency, propensity, degree of belief, etc.) and to ensure that the number we produce is well-founded and defensible.

  The key interpretations to consider:
  1. **Frequentist**: Probability as a long-run frequency in a well-defined reference class.
  2. **Propensity**: Probability as an inherent physical tendency or disposition of a system.
  3. **Subjective Bayesian**: Probability as a rational degree of belief given the available evidence (which may include both data and prior beliefs).
  4. **Logical/Evidential**: Probability as a logical or evidential relationship between the evidence and the hypothesis, often thought of as an objective degree of support.

  These interpretations can come apart in cases:
  - No frequency data (e.g., novel events)
  - Single-event predictions (e.g., will this dam fail?)
  - Reference class problems (which class to choose? e.g., all dams, dams in this region, dams of this construction type, etc.)
  - Model-based estimates (which are not directly observed frequencies)

  The procedure must be usable by engineers/statisticians without philosophy background. It should be a step-by-step checklist.

  We are going to design a procedure that asks a series of questions. At each step, if the question is answered sufficiently, we move on. If not, we either stop and refuse to state a number or hand the matter to a person for a value judgment.

  The procedure must also include a short set of tests for consistency of the probability number with its interpretation.

  Then we will run the procedure on the two examples.

  ---

  **Decision Procedure for Probability Estimates**

  **Step 1: Clarify the Event**
  - **Question**: Precisely define the event for which we are estimating probability. Include the time frame and conditions.
  - **Sufficient Answer**: A clear, unambiguous statement of the event (e.g., "The dam fails within 50 years under normal operating conditions and design basis events" or "A human exposed to the additive experiences the specific adverse health effect within 10 years of chronic exposure at the intended dosage").
  - **Failure**: Vague or ambiguous definition (e.g., "The dam fails" without time frame, or "causes harm" without specifying the harm or conditions).
  - **If failure**: Refine the definition until it is clear. If cannot be made clear, stop and refuse to state a number.

  **Step 2: Identify Available Evidence**
  - **Question**: What evidence do we have? Categorize into:
    a) Direct frequency data (observed frequencies in a relevant reference class)
    b) Mechanistic evidence (understanding of physical, chemical, biological processes)
    c) Analogous data (data from similar but not identical cases)
    d) Expert judgment (informed opinions)
    e) Model outputs (including uncertainty quantification)
  - **Sufficient Answer**: A list of the evidence with categorization. If there is direct frequency data, specify the reference class and the frequency.
  - **Failure**: Inability to list evidence or mischaracterization of evidence (e.g., calling a model output "frequency data" when it is not).

  **Step 3: Check for Direct Frequency Data**
  - **Question**: Is there direct frequency data from a well-defined reference class that matches the event definition?
  - **Sufficient Answer**: Yes, and the reference class is clearly defined and relevant. Then the probability estimate is the observed frequency (with confidence intervals if appropriate). We are done (go to Step 7 for consistency check).
  - **Failure**: No direct frequency data, or the reference class is not clearly defined or not a good match (e.g., the data is from a different population, different conditions, or too sparse). Then proceed to Step 4.

  **Step 4: Consider Propensity Interpretation (Physical Chance)**
  - **Question**: Is the event the outcome of a well-understood physical process that is inherently stochastic? And can we quantify the propensity from first principles or well-established theory?
  - **Sufficient Answer**: Yes, and we have a model (e.g., quantum mechanics, radioactive decay, well-validated stochastic physical model) that gives the probability. Then use that model. We are done (go to Step 7).
  - **Failure**: The process is not inherently stochastic (or we cannot quantify it from first principles) OR we are relying on a model that is not based on first principles but on empirical fitting. Then proceed to Step 5.

  **Step 5: Bayesian/Evidential Approach**
  - **Question**: Can we combine the available evidence (from Step 2) using a Bayesian framework to form a degree of belief (posterior probability) that is rational given the evidence?
  - **Sub-questions**:
    a) Can we specify a prior probability? (This may come from analogous frequency data, or it may be a non-informative prior if we have no information.)
    b) Can we specify a likelihood function (how the evidence would be generated given the event or not)? This may require mechanistic modeling.
    c) Is there a way to update the prior to a posterior using the evidence?
  - **Sufficient Answer**: Yes, we can build a Bayesian model that incorporates the evidence. The probability estimate is the posterior probability. Then go to Step 7.
  - **Failure**: We cannot specify a prior (e.g., no analogous data and no consensus on a non-informative prior) OR we cannot build a likelihood (e.g., the mechanistic understanding is too vague to quantify). Then proceed to Step 6.

  **Step 6: Value Judgments Required**
  - **Question**: Are we forced to make a value judgment to proceed? This includes:
    a) Choosing a reference class when multiple are available (e.g., for frequency data that is not directly from the event but from similar events, which class is most relevant?).
    b) Choosing a prior in the Bayesian approach when there is no clear default.
    c) Weighing different types of evidence (e.g., mechanistic vs. statistical) when they conflict.
    d) Setting an acceptable level of uncertainty (e.g., if we cannot get a precise number, what range is acceptable?).
  - **Sufficient Answer**: The team can make these judgments by appealing to regulatory guidelines, agency precedents, or explicit risk management policies. If so, document the judgment and proceed to Step 7.
  - **Failure**: The team cannot reach a consensus and there is no guiding policy. Then we must refuse to state a number and instead state the range of possible probabilities and the reasons for the uncertainty.

  **Step 7: Consistency Check**
  - Once we have a probability number, we test it for consistency with its interpretation:
    - **For a frequency interpretation**: 
        - Test 1: Can we state the reference class and the frequency in that class?
        - Test 2: Is the event in question a member of that reference class?
        - Test 3: Is the reference class objectively defined and not gerrymandered?
    - **For a propensity interpretation**:
        - Test 1: Is there a well-validated physical model that produces this probability?
        - Test 2: Can we explain the source of the randomness in the system?
    - **For a Bayesian/evidential interpretation**:
        - Test 1: Can we state the prior and the evidence used to update it?
        - Test 2: Is the prior justifiable (by frequency, by non-informative principles, or by consensus)?
        - Test 3: Is the likelihood function based on a reasonable model of the evidence-generating process?
    - **If the number fails the tests**: We must go back to the step that produced it and re-evaluate.

  **Step 8: Document and Justify**
  - Regardless of the source, document:
    - The interpretation used (frequency, propensity, Bayesian, etc.)
    - The evidence and reasoning
    - Any value judgments made (and by whom, if applicable)
    - The consistency check results

  ---

  **Example 1: Novel Food Additive**

  **Event**: A human exposed to the food additive at the intended dosage and duration experiences a specific adverse health effect (e.g., liver toxicity) within 10 years of chronic exposure.

  **Step 1**: Clear event definition? Yes.

  **Step 2**: Evidence:
  - Mechanistic: in vitro assays show toxicity in human cell lines, animal study (rats) shows liver toxicity at high doses, structural analogy to a known toxicant (similar chemical structure to a compound that causes liver toxicity in humans).
  - Frequency data: Essentially none for humans (novel additive).
  - Analogous data: Data on the known toxicant in humans (but the additive is not identical).
  - Expert judgment: Toxicologists' opinions based on the above.
  - Models: Dose-response models from animal data extrapolated to humans (with uncertainty).

  **Step 3**: Direct frequency data? No. Proceed.

  **Step 4**: Propensity? The adverse effect is not the result of a well-understood stochastic physical process (like radioactive decay) but a complex biological response. We do not have a first-principles model. Proceed.

  **Step 5**: Bayesian approach?
  - Prior: We might use the base rate of toxicity for similar additives (from analogous data) or a non-informative prior if we have no information.
  - Likelihood: We can build a dose-response model from animal data and extrapolate to humans using allometric scaling and uncertainty factors. We can also incorporate the in vitro data and structural analogy via a Bayesian network that weights different lines of evidence.
