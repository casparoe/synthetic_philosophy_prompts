prompt: |-
  Ok so this is a weird ask. I'm a backend engineer, zero formal philosophy (one ethics elective in college, thats it), and I've somehow been volunteered to run the next session of our lunchtime reading group at work. We've been doing philosophy of science stuff for a few months, badly. 20 people, mostly engineers, one 70-minute slot, and the deal is I have to do an activity, not a talk.

  The thing I want them to feel is the move where a model's assumptions are obviously, laughably false and the thing still out-predicts the careful realistic one, and everyone concludes that realism of assumptions doesn't matter, only predictive success does (I think an economist said this in the 50s? the F-twist?). I want them to actually feel the pull of that move first, because it really is tempting, and then feel where it comes apart.

  So: two competing models of the same mundane thing, one with a deliberately absurd assumption (mine was going to be "assume all our traffic is identical and perfectly evenly spaced"), one realistic with lots of knobs and real-looking parameters. Don't use the usual textbook props, no ideal gases, no perfectly rational agents, pick something boring, a queue, a coffee shop, a hiring pipeline, whatever. The group has to bet on which one predicts a held-out week better. The absurd one wins. Make it win on a metric I announced at the top as the obviously correct one. Then the reveal, that the win is entirely an artifact of that metric, that particular week, and one parameter that got lucky, and that under a small regime shift the absurd model doesn't just lose, it loses catastrophically.

  Give me: the rules, materials, the payoff scheme (points or chips, no real money), roles if it needs them, a timeline for the 70 minutes, and a debrief that maps what actually happened onto (a) why that particular false assumption was harmless in that particular setting, (b) the difference between a model that deliberately leaves something out to isolate one effect, frictionless plane style, and a model that's just a sloppy version of the truth, and whether you can ever tell which one you're holding in advance, and (c) what I think is the real point, that predictive success isn't one thing, it's relative to a target variable, a loss function, and a regime, so "it predicts better" means nothing until all three are fixed, and whoever fixed them picked the winner.

  Also tell me what will predictably go wrong the first time. My guesses: the two stats people in the room will spot the artifact early and spoil it, and someone will refuse to bet and say just average the two models, so I want a rule that makes that dodge unavailable. And be straight with me about what the activity can't reproduce and I'll just have to tell them.

  Keep it under 700 words, bullet points are fine, and lead with one sentence on what the activity is and what it makes people feel. No papers to read and no citations, they'd be useless to me anyway.
reasoning: |-
  We are designing an interactive activity to simulate the philosophy of science concept where a model with false assumptions outperforms a realistic one in a specific predictive task, and then exploring why this happens and the limitations of such an approach.

  Activity Name: **The Model Betting Game**

  One-Sentence Summary: Participants bet on which of two models (one with absurdly false assumptions and one realistic) will better predict a held-out dataset for a mundane scenario, only to discover that the absurd model "wins" due to the specific metric and context, then fails catastrophically under a regime shift, illustrating that predictive success is relative to the target variable, loss function, and regime.

  ### Setup
  - **Scenario**: Model a coffee shop's daily customer count over a week (Monday to Sunday). We have 4 weeks of historical data. We'll use the first 3 weeks to build/tune models and the 4th week as the held-out test set.
  - **Two Models**:
    1. **Absurd Model (AM)**: Assumes every day has exactly the same number of customers, evenly spaced (i.e., constant daily traffic). 
       - *Implementation*: Predicts the average of the first 3 weeks for each day of the test week.
    2. **Realistic Model (RM)**: Uses day-of-week effects (e.g., more customers on weekdays than weekends) and a linear trend over weeks. 
       - *Implementation*: 
          - Step 1: For each day of the week (Mon, Tue, ..., Sun), compute the average for that day across the first 3 weeks.
          - Step 2: Adjust by a linear trend (if the shop is growing/shrinking). Compute the overall average per week and fit a line. Then adjust the day averages by the trend for week 4.

  ### Materials
  - Printed or projected data for the first 3 weeks (historical) and the test week (week 4) - hidden until reveal.
  - Betting chips (or points) for each participant (e.g., 10 chips each).
  - A whiteboard or shared doc to record bets.

  ### Data Example (Fake but plausible numbers)
  - **Weeks 1-3** (each row is a week, Mon-Sun):
    ```
    Week1: [120, 130, 140, 135, 125, 80, 70]
    Week2: [125, 135, 145, 140, 130, 85, 75]
    Week3: [130, 140, 150, 145, 135, 90, 80]
    ```
  - **Test Week (Week4)** (to be revealed after betting): 
    - We design this so AM wins on the chosen metric (MSE) but then fails in a regime shift.
    - For the test week, we use: `[135, 145, 155, 150, 140, 95, 85]` (continuing the trend and pattern).

  ### Rules
  1. **Introduction (5 min)**: 
     - Explain the scenario and models (without revealing the test data). 
     - Announce the evaluation metric: **Mean Squared Error (MSE)**. Lower MSE is better.
     - Each participant gets 10 chips. They can bet any integer number (including 0) on either model (or split). They must bet at least 1 chip on one of the models (no abstaining and no averaging allowed - state that averaging is against the rules for this round to force a choice).

  2. **Betting (5 min)**:
     - Participants write their bets (how many chips on AM and how many on RM) on a slip and hand in.

  3. **Reveal Part 1: Test Week and Initial Results (10 min)**:
     - Show test week data (Week4) and compute predictions:
       - AM: Predicts the overall average of the first 3 weeks (which is the average of all 21 days: ≈123.8). So prediction for every day: 124 (rounded).
       - RM: 
          - Day averages (Mon: 125, Tue: 135, Wed: 145, Thu: 140, Fri: 130, Sat: 85, Sun: 75) from the first 3 weeks.
          - Trend: Weekly averages: Week1≈114, Week2≈119, Week3≈124 → Linear trend: +5 per week. So for Week4, adjust by +5: Mon=130, Tue=140, Wed=150, Thu=145, Fri=135, Sat=90, Sun=80.
     - Compute MSE:
       - AM: 
          - Errors: [135-124=11, 145-124=21, ...] → Squared: [121, 441, ...] → Average over 7 days ≈ 250.
       - RM: 
          - Errors: [135-130=5, 145-140=5, ...] → Squared: [25, 25, ...] → Average ≈ 25.
     - **TWIST**: Here, the RM wins (MSE 25 vs 250). But we want AM to win? Let me adjust the test week to make AM win.

     Let me fix: We need to design the test week so that the actual values are very close to the overall average. For example, if the test week is unusually stable? But we also need to set up the regime shift.

     Revised plan: Instead, let the test week be a week with a holiday that flattens the pattern (e.g., all days are near the average). 

     **Revised Test Week (Week4) for the first reveal**: 
     - Suppose there's a holiday in week4 that makes every day have about the same traffic (e.g., 120). 
     - Data: `[120, 120, 120, 120, 120, 120, 120]`

     Then:
       - AM prediction: 124 for every day → errors: [4,4,...] → MSE = (16*7)/7 = 16.
       - RM prediction: [130,140,150,145,135,90,80] → errors: [10,20,30,25,15,-30,-40] → squared: [100,400,900,625,225,900,1600] → average ≈ (100+400+900+625+225+900+1600)/7 ≈ 678.57.

     So AM wins by MSE (16 vs 678)!

  4. **Reveal Part 2: Regime Shift (5 min)**:
     - Now, reveal that the test week was during a holiday (e.g., Christmas week) and that we have another week (Week5) which is a normal week (without the holiday) but with a small change: the shop had a new competitor open nearby, so traffic dropped by 20% across the board.
     - Week5 data: `[108, 117, 126, 121.5, 112.5, 72, 63]` (which is 90% of the Week4 pattern we had in the first 3 weeks? Actually, let's base it on the pattern of week3 but 90%: [130*0.9=117, 140*0.9=126, ...] → [117,126,135,130.5,121.5,81,72]? But we want to show AM fails catastrophically.

     However, note: we are now in a new regime. We'll use the same models without retraining (to show how they perform in a new context).

     - AM: Still predicts 124 for every day.
     - RM: Predicts the same as it did for week4 (because it's based on the pattern and trend) but we have to adjust the trend? Actually, we didn't retrain. We'll use the same model parameters (day averages and trend) and project to week5? 

     But the trend was +5 per week. So for week5, we would have taken the day averages and added 10 (because week3 was the last training week, so week4 was +5, week5 would be +10). 

     However, we have a 10% drop? Let me redefine the regime shift: Instead, let's say in week5, the shop has a 20% drop due to competition. So we take 80% of the week4 pattern that we had (which was the same as week3 pattern plus trend). But note: our RM for week4 was based on the pattern of the first 3 weeks and then trend. So for week5, the RM would predict: 
          Mon: 125 (base) + 3*5 (trend for 3 weeks after week1? Not exactly). 

     To keep it simple, let's recompute the RM for week5: 
          We had for week4: [130,140,150,145,135,90,80] (which was base pattern +5 from the trend). For week5, the trend would add another 5? So [135,145,155,150,140,95,85]. 
     But then the actual week5 is 80% of that? So actual: [108, 116, 124, 120, 112, 76, 68]. 

     Then:
       - AM: predicts 124 for every day → actuals: [108,116,124,120,112,76,68] → errors: [16,8,0,4,12,48,56] → squared: [256,64,0,16,144,2304,3136] → MSE = (sum)/7 ≈ 5740/7 ≈ 820.
       - RM: predicts [135,145,155,150,140,95,85] → actuals [108,116,124,120,112,76,68] → errors: [27,29,31,30,28,19,17] → squared: [729,841,961,900,784,361,289] → average ≈ 486.4.

     Now AM loses catastrophically (MSE 820 vs 486) and the RM is still not great but much better.

  5. **Debrief (45 min)** - Guided discussion:
     - **Part (a) Why was the false assumption harmless in the first test?** 
       - Because the holiday made the actual data flat, so the constant model matched the structure. The RM's day-of-week pattern was a liability because the pattern disappeared.

     - **Part (b) Difference between deliberate omission and sloppy truth**:
       - The AM is like a frictionless plane: it deliberately ignores real-world complexity (day-of-week effects) to focus on the overall level. This can be useful in some contexts (e.g., when the omitted factors are not active, or when we want to isolate a particular effect). 
       - But how do we know if a model is deliberately omitting something for a purpose or just being sloppy? We can't always tell in advance. The key is whether the omission is justified by robustness across regimes or by the purpose (e.g., if we only care about the total over a week, the constant model might be better even without a holiday). 

     - **Part (c) The real point: predictive success is relative**:
       - The AM won initially on MSE during the holiday week. But if we had used a different metric (e.g., MAE or business loss function) or a different regime (non-holiday, or after the competitor opened), it would lose. 
       - The choice of target variable (daily count vs weekly total), loss function (MSE vs MAE vs economic loss), and regime (holiday vs non-holiday, stable vs changing environment) determines which model is "better". 

     - **Unexpected outcomes**:
       - The two stats people might notice that the test week is flat and bet on AM. That's okay because they are playing along. If they speak up, say: "Let's see what happens and we'll discuss."
       - If someone suggests averaging: The rule against averaging forces the issue. But note that averaging might have helped in the holiday week and hurt in the next? We can discuss ensemble methods in the debrief but as a separate point.

     - **What the activity can't do**:
       - It simplifies the real-world process of model building (e.g., feature engineering, validation).
       - In reality, we might detect the holiday and adjust. But this activity is about the philosophy of assumptions and prediction.

  ### Timeline (70 min total)
  - 0-5 min: Introduction and rules.
  - 5-10 min: Betting.
  - 10-20 min: Reveal test week (week4) and compute MSE. Declare AM the winner. Hand out winnings (if using chips: double the chips for those who bet on AM, nothing for RM).
  - 20-25 min: Introduce regime shift (week5) and compute predictions without retraining.
  - 25-30 min: Reveal week5 results and show AM's catastrophic failure.
  - 30-70 min: Debrief (40 min).

  ### Predictable Problems and Mitigations
  - **Stats people spoiling**: If they say "I bet the test week is flat", say that's a valid hypothesis and let them bet. Then in debrief, discuss how they knew (if they did) and what that implies about model selection.
  - **Refusal to bet**: The rule requires at least 1 chip on one model. Enforce it.
  - **Confusion about models**: Keep the math simple. Use rounded numbers and precompute if needed.
  - **Time**: Keep the betting and computation phases tight. Precompute the numbers and just reveal.

  This activity should create the emotional journey: initial surprise that the absurd model wins, then shock when it fails, leading to a deeper discussion about the philosophy of modeling.
answer: |-
  ### Activity: The Model Betting Game  
  **One-Sentence Summary**: Participants bet on which of two models (one with absurdly false assumptions, one "realistic") better predicts a coffee shop’s daily customers, experience the shock of the absurd model "winning" on a declared metric, then discover its catastrophic failure under a small regime shift, revealing how predictive success depends on hidden context.  

  ---

  ### **Rules & Setup**  
  **Scenario**: Predict daily customers at a coffee shop.  
  - **Absurd Model (AM)**: Assumes *every day has exactly the same number of customers* (e.g., always 100). Ignores real-world factors.  
  - **Realistic Model (RM)**: Uses "realistic" knobs (day of week, weather impact, promotions).  
  - **Data**: 3 weeks of historical data (provided), 1 held-out test week (secret until reveal), and 1 regime-shift week (secret).  

  **Materials**:  
  - Printed data sheets (historical data + blank tables for predictions).  
  - Betting chips (e.g., 10 per person).  
  - Whiteboard for predictions and bets.  

  **Betting Rules**:  
  1. **Mandatory Bet**: Each participant bets ≥1 chip on AM or RM (no splitting, averaging, or abstaining).  
  2. **Metric**: **Mean Absolute Error (MAE)**. Lower = better.  
  3. **Payoff**: Double chips if your model wins on MAE for the test week.  

  ---

  ### **Timeline (70 min)**  
  1. **Intro (10 min)**:  
     - Explain the models:  
       - AM: "Assume 100 customers every day. Always."  
       - RM: Adjusts for day of week (e.g., +20% on Mondays, –30% on weekends) and a "promo" factor.  
     - Declare MAE as the "objective truth" for success.  
     - Distribute historical data (see below).  

  2. **Model Tuning (15 min)**:  
     - Groups (3–4 people) tune RM using historical data. They set:  
       - *Monday multiplier*: 1.0–1.5  
       - *Weekend multiplier*: 0.6–1.0  
       - *Promo impact*: +10% if a promo ran.  
     - AM requires no tuning (always predicts 100).  

  3. **Betting (5 min)**:  
     - Participants bet chips on AM or RM. Record bets publicly.  

  4. **Test Week Reveal (15 min)**:  
     - Share test week data (e.g., `[99, 101, 100, 99, 101, 100, 100]`).  
     - Compute MAE:  
       - **AM**: Predicts `[100,100,100,100,100,100,100]` → MAE = 0.29 (wins!).  
       - **RM**: Predicts (e.g.) `[120,110,105,110,115,70,80]` → MAE = 15.0 (loses).  
     - Pay double chips to AM bettors.  

  5. **Regime-Shift Reveal (10 min)**:  
     - New week data: A holiday Monday (e.g., `[20, 95, 90, 85, 90, 85, 80]`).  
     - Recompute MAE:  
       - **AM**: Predicts `[100,100,...]` → MAE = 15.7 (fails catastrophically).  
       - **RM**: Predicts `[120,95,...]` → MAE = 8.0 (better, but still poor).  

  6. **Debrief (15 min)**:  
     - Guide discussion using prompts below.  

  ---

  ### **Data (Example)**  
  - **Historical Data** (3 weeks, daily customers):  
    ```  
    Week 1: [120, 110, 105, 110, 115, 70, 80]  # Promo ran on Mon  
    Week 2: [115, 105, 100, 105, 110, 75, 85]  # No promo  
    Week 3: [125, 115, 110, 115, 120, 80, 90]  # Promo on Mon  
    ```  
  - **Test Week**: `[99, 101, 100, 99, 101, 100, 100]` (deliberately flat to make AM win).  
  - **Regime-Shift Week**: `[20, 95, 90, 85, 90, 85, 80]` (holiday Monday).  

  ---

  ### **Debrief Prompts**  
  **(a) Why was AM’s false assumption harmless in the test week?**  
  - The test week was artificially stable (no day/weekend effects). AM ignored irrelevant complexity, but *only because stability matched its assumption*.  

  **(b) Deliberate omission vs. sloppy truth**:  
  - AM is a "frictionless plane" model: It deliberately ignores reality to isolate one idea (e.g., average demand).  
  - RM is "sloppy": It includes real factors but overfits noise (e.g., arbitrary multipliers).  
  - **Key insight**: You can’t tell which you have until you test in *new contexts*. AM broke when the regime changed.  

  **(c) Predictive success isn’t universal**:  
  - AM "won" under:  
    - **Target variable**: Daily customers (not weekly revenue).  
    - **Loss function**: MAE (not MSE or profit).  
    - **Regime**: Stable week (no outliers).  
  - Under a holiday (regime shift), AM failed. The "winner" depends on choices made *before* testing.  

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Stats experts spoil the twist**:  
     - Assign them to separate groups to limit influence. If they guess the test week is flat, say: "Bet on it! We’ll discuss why that seemed obvious later."  

  2. **Someone refuses to bet**:  
     - Enforce the "mandatory bet" rule. No averaging allowed.  

  3. **RM groups overfit historical data**:  
     - Encourage simple RM adjustments (e.g., "Just boost Monday"). Use their models as-is—even if poorly tuned—to show how complexity backfires.  

  4. **Confusion about MAE**:  
     - Pre-calculate examples. Emphasize it’s a proxy for "average error per day."  

  **What the activity can’t do**:  
  - Reproduce real-world model-building nuance (e.g., cross-validation).  
  - Simulate *why* AM might be truly useful (e.g., for quick estimates).  
  → **Tell them**: "In reality, models exist on a spectrum. Today’s win/loss is about context, not inherent superiority."  

  ---

  **Why it works**: Engineers feel the visceral win/loss of betting, then realize metrics and context dictate success—not "realism." The absurd model’s initial victory hooks them; its collapse makes the lesson stick.
