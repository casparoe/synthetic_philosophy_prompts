prompt: |-
  I'm deputy chief of staff for the mayor of a mid-sized Rust Belt city -- first term, fourteen months in, and I keep getting handed decisions that I'm pretty sure are what people mean by "dirty hands," except nobody in the building has read any political ethics and so we re-litigate the same fight from scratch every time. Last month it was whether to have our economic development guy quietly signal to a developer which council members could be leaned on; the month before it was whether to sit on a consultant's report about our water system until after the bond vote; yesterday the mayor asked me, half joking, whether it would really be so bad if a certain personnel file got lost. The stakes are real -- people's housing, people's water -- and so is the fact that whatever we decide becomes public record sooner or later, and I've got maybe twenty minutes per decision and no lawyer in the room most of the time (and when there is one, he says everything's fine if its legal, which I'm fairly sure is a different question than the one I'm asking). So what I want is a decision procedure my office could actually run: the questions to ask in order, what counts as a sufficient answer to each, where it stops with a flat no, and where it has to go up to the mayor because what's left is a values call and not a fact call.

  The thing I want it built on -- because this is the part everyone around here gets wrong -- is that dirty hands isn't the same thing as "politics has costs." From a grad seminar I took years ago I kept two ideas I can't operationalize. First the puzzle: if the act is genuinely wrong, no amount of good consequences makes it not-wrong, and if it isn't wrong, then there's nothing dirty about it -- so a procedure that's just cost-benefit analysis has already lost the thing we're trying to capture. Second, the idea of a remainder or residue: even when someone is right to do the thing, they're still the author of it, and something is owed afterward -- an acknowledgement, restitution, a cost to themselves, some mark that this wasn't free. Make those usable rather than decorative. Concretely, for each step say whether it's a factual question, a predictive one, or a straight value judgment; say which of the distinctions I just gestured at actually survives compression into a checklist and which has to be dropped, and what we lose when it is; and be honest about the failure modes, including the cases where the procedure will give a confident answer that's wrong.

  Then run it on three: (1) our development guy leaning on council members to get an affordable housing deal through, (2) leaking a confidential report to kill a contract we think is corrupt, and (3) the mayor asking me to lose the personnel file. If (3) is a case where the procedure says no and the mayor overrules it anyway, tell me what the procedure should say about what happens next -- including whether I resign, and how the answer changes if I don't.
reasoning: |-
  Okay, the user is a deputy chief of staff for a mayor in a Rust Belt city. They're facing "dirty hands" decisions frequently, where ethical lines are blurred. Their team doesn't have a background in political ethics, so they rehash the same debates every time. They mentioned examples like signaling which council members can be leaned on, delaying a water system report before a bond vote, and losing a personnel file. They need a practical decision procedure that fits into 20-minute windows without legal counsel always present.

  The user wants this procedure to distinguish between unavoidable ethical compromises ("dirty hands") and mere cost-benefit analysis. They recall from grad school that an act can't be both wrong and justified by outcomes—if it's wrong, consequences don't wash it clean. Also, even if you do the right thing, there's a "remainder" requiring acknowledgment or restitution. They need these concepts operationalized, not just theoretical.

  First, I need to break down the ethical framework into actionable steps. The key elements are: 
  1. **Proportionality**: The harm must be necessary for a significant public good. 
  2. **Last Resort**: All other options must be exhausted. 
  3. **Publicity Test**: Would the public understand the reasoning if disclosed? 
  4. **Remainder Management**: What's owed afterward? 

  For each step, I should specify if it's factual, predictive, or value-based. Factual questions are about current realities (e.g., "Is there a legal prohibition?"). Predictive involve forecasts (e.g., "Will harm occur without action?"). Value judgments require moral weighing (e.g., "Is the harm proportional?"). 

  The user mentioned three cases to test: 
  1. Leaning on council members for affordable housing. 
  2. Leaking a report to stop a corrupt contract. 
  3. Losing a personnel file. 

  For each, the procedure must give clear answers. Also, if the mayor overrules, what should the deputy do? Resignation isn't always the answer; sometimes staying to mitigate harm is better. The user needs concrete guidance on post-decision steps, like documentation or restitution. 

  I should also address failure modes. For example, the procedure might miss nuances or be gamed by bad actors. Transparency in the process is crucial to reduce misuse. 

  The user's deeper needs: They feel isolated in ethical reasoning, needing a structured approach to prevent burnout and ensure consistency. They want to uphold integrity without naivety, recognizing politics' realities but not excusing abuses. The procedure should empower them to push back with reasoned arguments, not just gut feelings. 

  Applying the steps to the cases: 
  - **Case 1 (Leaning on council members)**: This likely fails at multiple steps. Coercion undermines democracy, and alternatives like public pressure exist. The "remainder" would require transparency later. 
  - **Case 2 (Leaking a report)**: Might pass if corruption is proven and all else failed. But the "remainder" includes accepting legal risks and potential job loss. 
  - **Case 3 (Losing a file)**: Clear no—illegal, no proportionality, and no public good. If the mayor insists, resignation might be necessary if the harm is severe. 

  The user also needs to know how to handle overrides. Documenting dissent is key. Resignation depends on the act's severity and one's capacity to prevent future harm. 

  Overall, the procedure must be quick but robust, forcing explicit consideration of ethics beyond legality. It should leave a paper trail to protect the deputy and uphold accountability.
answer: |-
  Here’s a **Dirty Hands Decision Procedure (DHDP)** designed for speed, grounded in political ethics, and structured to force explicit tradeoffs. It’s built around your core insight: **"Dirty Hands" occurs only when an act is *morally wrong but politically necessary*, and the actor incurs a "remainder" debt.** The procedure has 6 steps (5 pre-decision, 1 post-decision), with clear stop/go rules. Run it in 15-20 minutes.

  ---

  ### **The DHDP Framework**
  1. **DEFINE THE ACT**  
     - *Question:* "What *exactly* are we considering doing? State it in blunt, public-record language."  
     - *Type:* Factual (no euphemisms).  
     - *Stop if:* The act is illegal (per statute/case law, not just "gray area"). *Why:* Illegality removes "necessity" – you have lawful alternatives.  
     - *Remainder check:* N/A (this step prevents self-deception).  

  2. **TEST PROPORTIONALITY**  
     - *Question:* "Is the harm caused by this act *significantly outweighed* by the public good achieved? (Good must be urgent, specific, and non-speculative.)"  
     - *Type:* Value judgment (requires weighing moral harms vs. public benefits).  
     - *Stop if:*  
       - Harm is intrinsic (e.g., undermining democracy, violating bodily autonomy).  
       - Good is abstract/political (e.g., "helps reelection," "avoids embarrassment").  
     - *Remainder check:* If proceed, note the specific harm being tolerated.  

  3. **TEST LAST RESORT**  
     - *Question:* "Have we exhausted *all* feasible alternatives that cause materially less harm? (Not just 'we tried one thing.')"  
     - *Type:* Factual/predictive (list alternatives attempted/rejected).  
     - *Stop if:* A less-harmful option exists and is viable (even if slower/weaker).  
     - *Remainder check:* If proceed, document the best rejected alternative.  

  4. **TEST PUBLICITY**  
     - *Question:* "If this act and our reasoning were front-page news tomorrow, would a reasonable public agree it was justified?"  
     - *Type:* Predictive/value judgment (stress-testing democratic accountability).  
     - *Stop if:* The act relies on permanent secrecy to "work."  
     - *Remainder check:* If proceed, draft the eventual disclosure statement *now*.  

  5. **ASSIGN ACCOUNTABILITY**  
     - *Question:* "Who personally bears responsibility? (Must be a named human, not 'the office.')"  
     - *Type:* Factual.  
     - *Stop if:* Accountability is diffused ("team decision") or delegated downward.  
     - *Remainder check:* The accountable person *must* execute Step 6.  

  6. **DISCHARGE THE REMAINDER**  
     - *Act after decision:* The accountable person (Step 5) **must** do one of:  
       - Publicly acknowledge the harm (e.g., "We chose X because Y, but it violated Z principle").  
       - Accept a proportional personal cost (e.g., resign a secondary post, forfeit a bonus).  
       - Make restitution to the harmed party (e.g., compensatory policy, formal apology).  
     - *Failure here:* Turns a "dirty hands" act into mere corruption.  

  ---

  ### **What Survives Compression? What’s Lost?**
  - **Survives:** Proportionality, Last Resort, and Remainder. These are operationalized.  
  - **Dropped:** Nuanced "wrongness" debates. The procedure assumes *if* an act clears Steps 1–4, it’s "necessary but wrong."  
  - **Failure Modes:**  
    - **False positives:** Bad actors can game "proportionality" by overstating benefits. Mitigation: Require concrete metrics for "public good."  
    - **False negatives:** May reject acts that *are* justified in extremis (e.g., leaking to prevent genocide). Mitigation: The mayor can override (see below).  
    - **Remainder failure:** Accountability without restitution breeds cynicism.  

  ---

  ### **Applied to Your Cases**
  **Case 1: "Leaning on" Council Members for Affordable Housing**  
  1. **Act:** "ED Director privately tells Developer which Council Members are susceptible to pressure tactics."  
  2. **Proportionality:** Harm (undermining democratic process) vs. Good (housing). *Value judgment:* Harm is structural/democratic; good is material but not imminent (e.g., no proof housing dies without this). → **STOP.** *Remainder note:* N/A.  
  3. *Last Resort:* Not exhausted (public advocacy, revised proposal, transparency with council).  
  4. *Publicity:* Headline: "City Hall Guided Developer to Weakest Council Targets." Public sees manipulation, not pragmatism.  
  5. *Accountability:* Mayor (if directed) or you (if executed).  
     → **DHDP Verdict: NO.** Not proportional, not last resort, fails publicity.  

  **Case 2: Leaking Confidential Report to Kill Corrupt Contract**  
  1. **Act:** "Anonymous leak of confidential water system report to media to sink Contract X."  
  2. **Proportionality:** Harm (violating confidentiality, legal risk) vs. Good (stopping corruption, protecting public health). *Value judgment:* Proportional if corruption is *proven* in the report and health is at risk.  
  3. **Last Resort:** Must show: FOIA requests denied, inspector general unresponsive, legal channels blocked. *Factual.* If not exhausted → STOP.  
  4. **Publicity:** Headline: "Whistleblower Leaks Report Showing Mayor Knew of Tainted Water." Public *might* forgive if harm is imminent and corruption clear.  
  5. **Accountability:** Leaker (likely you or mayor).  
     → **DHDP Verdict: CONDITIONAL YES** (if corruption proven + last resort).  
     **Remainder:** Leaker accepts risk of prosecution/job loss; or mayor publicly admits leak was necessary due to system failure.  

  **Case 3: "Losing" a Personnel File**  
  1. **Act:** "Destroying or concealing a personnel record."  
  2. **Proportionality:** Harm (obstruction, fraud) vs. Good (?—unspecified). *Value judgment:* Illegal act for likely personal/political protection. Harm intrinsic (truth-seeking violated). → **STOP.**  
  3. *Last Resort:* No lawful alternative? Unlikely.  
  4. *Publicity:* Headline: "Mayor’s Office ‘Loses’ Damaging Personnel File." Indefensible.  
     → **DHDP Verdict: NO.**  

  ---

  ### **If Mayor Overrules DHDP Verdict (e.g., Case 3)**
  1. **Document dissent:** Email mayor: "Per DHDP, this fails Step 2 (proportionality) and Step 4 (publicity). I advise against." Save copy.  
  2. **Escalate remainder:** Tell mayor: "If you proceed, *you* are accountable (Step 5). Step 6 requires you to: (a) Hold a press conference admitting you ordered the file destroyed because [reason], or (b) Resign."  
  3. **Your resignation?** Depends on:  
     - **Severity:** Resign if act is illegal or undermines democracy (e.g., Case 3).  
     - **Your capacity to mitigate harm:** Staying to enforce remainder (e.g., forcing mayor’s disclosure) may reduce harm.  
     - **Alternatives:** If you resign, who replaces you? A "yes-man" worsens outcomes.  
  4. **If you stay:**  
     - Demand execution of Step 6 (mayor’s public accounting).  
     - Document everything. Prepare for eventual disclosure.  
     - Use institutional power to block similar future acts.  

  **Concrete guidance:**  
  - **Resign** if: Act is illegal + no credible path to restitution (e.g., destroying evidence).  
  - **Stay** if: Act is unethical but legal + you can enforce the remainder (e.g., leaking report Case 2). Your presence forces accountability.  

  ---

  ### **Why This Works in Your Context**
  - **Speed:** Forces focus on key ethical thresholds.  
  - **Culture-proof:** Doesn’t require philosophy degrees. Steps reveal when "necessary evil" is just "evil."  
  - **Checklist rigor:** Separates facts (Step 3), predictions (Step 4), and values (Step 2).  
  - **Remainder made real:** Step 6 binds ethics to action – no "cost-free" dirty hands.  

  This won’t prevent all bad acts, but it converts murky debates into a defensible process. The remainder is your shield: it ensures that when hands get dirty, the stain is acknowledged, not hidden.
