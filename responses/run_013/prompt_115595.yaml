  Ah, the penultimate paragraph is the shakiest. Distinguishing solutions from problems could be special pleading. If two scientists solve the same problem with different formulations, are they making the same discovery? The user says yes but with different "propagatability," but this risks redefining discovery to salvage individual credit. A strong counterexample would be Einstein and Hilbert on general relativity equations - same physical content, different mathematical forms, yet we credit Einstein more for conceptual breakthroughs. 

