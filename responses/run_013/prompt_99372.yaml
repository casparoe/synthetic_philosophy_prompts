answer: |-
  ### Priya's Verdict on the Brain-Breaking Case
  Based on Priya's intuitions from previous cases, I predict she will say your credence in heads should be **very high (e.g., 0.99 or better) if the guru predicts heads, and very low (e.g., 0.01) if he predicts tails**, despite the known 1/2 chance. She would override the known chance with the guru's prediction because:
  - The guru's 500/500 record is overwhelming evidence that cannot be dismissed as "noise" (unlike the 55/100 psychic).
  - She prioritizes evidence that is "actually about your case" (highly specific and relevant), and the guru's sealed prediction for this flip, backed by a perfect track record on identical setups, qualifies.
  - In the original guru case (no known chance), she set credence near 1, showing she defers to such evidence even when it conflicts with default assumptions (e.g., fair coins). Here, the known chance is overridden by stronger, case-specific evidence.

  ### Competing Rules and Their Predictions
  Two rules fit Priya's prior intuitions but diverge in this case:

  1. **Rule 1: Strict Principal Principle (PP) with Inadmissibility Threshold**  
     - **Description**: Credence should match the known objective chance unless you have "inadmissible evidence" (information about the specific outcome that isn't accounted for by the chance). Inadmissibility is determined by strength: only overwhelming evidence (e.g., 500/500) counts as inadmissible and justifies overriding the chance. Weak evidence (e.g., 55/100 or 2/2) is "noise" and ignored.
     - **Fits Priya's Prior Calls**:
       - Fair coin (1/2 chance): No inadmissible evidence → credence 1/2.
       - Physicist's coin (0.9 chance): No inadmissible evidence → credence 0.9.
       - Psychic (55/100): Weak evidence, not inadmissible → ignore, stay at chance (e.g., 1/2).
       - Election forecaster: No known chance → forecaster's prediction is best evidence, so use it.
       - Original guru (500/500): Overwhelming evidence is inadmissible → credence ~1.
       - Location-specific chances (e.g., street vs. city rain): Use chance "actually about your case" (most specific available).
     - **Prediction for Brain-Breaking Case**: Guru's 500/500 record is overwhelming, hence inadmissible evidence. Override known 1/2 chance → credence ~1 for guru's prediction.

  2. **Rule 2: Bayesian Updating on All Evidence (No Threshold)**  
     - **Description**: Start with the known chance as a prior, then update credence on all new evidence (e.g., track records) via Bayes' theorem. No evidence is dismissed; even weak evidence shifts credence proportionally.
     - **Fits Priya's Prior Calls**:
       - Fair coin: No evidence to update → credence 1/2.
       - Physicist's coin: Evidence (analysis) sets chance → credence 0.9.
       - Psychic (55/100): Update from 1/2; 55/100 slightly shifts credence (e.g., to ~0.55), but Priya dismissed this. Rule 2 **doesn't fully fit** here—she called it "noise" and stayed at 1/2.
       - Election forecaster: No known chance → update on forecaster's track record.
       - Original guru: Update on 500/500 record → credence ~1.
       - Location-specific chances: Use most specific evidence (Bayesian updating favors relevant data).
     - **Prediction for Brain-Breaking Case**: Update from 1/2 prior. Guru's 500/500 record implies near-certain accuracy → credence ~1 for guru's prediction. (Same as Rule 1 here, but Rule 2 would also shift for weaker evidence, which Priya rejects.)

  ### Which Rule Is Priya Running?
  **Rule 1 (Strict PP with Inadmissibility Threshold)** is the best fit for Priya. Here's why:
  - **Why Rule 1 Fits Best**: 
    - Priya consistently distinguishes between "noise" (psychic's 55/100) and "decisive" evidence (guru's 500/500). Rule 1's threshold explains this: weak evidence is ignored when a known chance exists, but overwhelming evidence overrides it. Rule 2 fails because it would require her to update slightly on the psychic, which she didn't.
    - She treats objective chance as foundational but defeasible by case-specific evidence. Rule 1 formalizes this via inadmissibility, while Rule 2 treats all evidence equally.
    - Her emphasis on using the chance "actually about your case" aligns with Rule 1's focus on specificity (e.g., street-level rain chance over city-level).
  - **Why Rule 2 Is Less Likely**: Priya's dismissal of the psychic contradicts Rule 2's core tenet (update on all evidence). Rule 2 would force her to adjust credence for weak evidence, but she explicitly rejects that.

  ### Further Case to Settle the Rule
  **The 2-for-2 Guru Case**:  
  - **Setup**: Same as the brain-breaking case (known 1/2 chance coin), but the guru has only 2 correct predictions out of 2 (not 500/500). His prediction for this flip is sealed.  
  - **What to Ask Priya**: "What should my credence in heads be if the guru predicts heads?"  
  - **How It Settles the Rule**:  
    - **If Priya says credence = 1/2**: She uses **Rule 1**. A 2/2 record is weak evidence—below the threshold for inadmissibility—so she ignores it and sticks to the known chance.  
    - **If Priya says credence > 1/2 (e.g., 0.6–0.7)**: She uses **Rule 2**. She updates from the 1/2 prior based on the 2/2 record, even though the evidence is weak.  
  - **Why This Works**:  
    - Priya rejected 55/100 as noise, so if she also rejects 2/2, it confirms a threshold (Rule 1). If she updates for 2/2, it means she updates on all evidence (Rule 2), contradicting her psychic call.  
    - This case isolates the threshold question: Rule 1 requires overwhelming evidence to override chance; Rule 2 does not.  

  ### Summary
  - **Verdict for Brain-Breaking Case**: Priya says credence ~1 for guru's prediction.  
  - **Competing Rules**: Rule 1 (PP with threshold) and Rule 2 (Bayesian on all evidence) both predict ~1 here, but Rule 1 fits Priya's other intuitions better.  
  - **Best Guess**: Priya uses **Rule 1 (Strict PP with Inadmissibility Threshold)**.  
  - **Settling Case**: The 2-for-2 guru test will resolve ambiguity—stick to 1/2 for Rule 1, update for Rule 2.  

  Use the 2-for-2 case next week to confirm. If she sticks to 1/2, Rule 1 is locked in.
