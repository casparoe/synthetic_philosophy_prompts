answer: |-
  ### Q&A Prep Sheet for "Distributional Acausal Trade"  
  **Core Example**: Two agents, identical up to a random seed, choose between:  
  - **Cooperative policy**: Pays off only if the other's distribution assigns sufficient measure to cooperation.  
  - **Defecting policy**: Dominant under causal reasoning but leads to mutual defection.  
  **Thesis**: Cooperation is rationally required under a distributional framework with logical updatelessness.  

  ---

  ### **Opening Concession to Buy Credibility**  
  *Concede upfront*:  
  > "I grant that in *causally connected* settings, causal decision theory (CDT) is the gold standard. My proposal targets a narrow edge case: causally isolated agents with *logical interdependence* (e.g., identical source code). Here, CDT forces self-defeating defection, while distributional trade unlocks Pareto improvements. This isn’t a general replacement for CDT—it’s a patch for pathologies induced by logical uncertainty."  
  *Why it works*: Acknowledges CDT’s validity in standard cases, frames your view as a niche tool, and disarms "why not CDT?" as a reflex objection.  

  ---

  ### **Objections Ordered by Damage (High to Low)**  
  *Each includes: (1) Objection in role-appropriate vocabulary, (2) 2-minute reply, (3) Weakness in reply.*  

  1. **Game Theorist** (Highest damage: Undermines novelty/practicality)  
     *Objection*: "This is just a correlated equilibrium with extra metaphysics. If your agents share a common prior and know their symmetry, they can correlate strategies via sunspots or conventions. Why invent a new 'distributional' framework when existing game theory solves this with fewer entities?"  
     *Reply*: "Game theory assumes causal channels or communication to establish correlation. Here, agents are *causally isolated* and *logically uncertain*—they can’t observe sunspots or negotiate. The distributional approach handles this by embedding logical uncertainty into the type space, making cooperation rational *without* exogenous signals. It’s game theory for acausal settings."  
     *Weakness*: Doesn’t fully address why "logical uncertainty" can’t be reduced to a Harsanyi-type hierarchy.  

  2. **Causal Decision Theorist** (Core "EDT with extra steps" charge)  
     *Objection*: "You’re sneaking in evidential reasoning! Conditioning your action on the other agent’s distribution is EDT—you’re using your policy choice as *evidence* about their measure. The causal graph shows no link, so this is illicit correlation."  
     *Reply*: "Unlike EDT, I’m not conditioning on *my action* as evidence. I’m evaluating *policies* from an updateless perspective: my choice controls the *measure* of my type across worlds. This isn’t ‘I cooperate, so they do too’ (EDT); it’s ‘Choosing cooperation *lowers measure on worlds where I defect*, which updates their distribution’. No causal link needed—it’s measure dynamics over logically possible worlds."  
     *Weakness*: Distinction feels semantic; doesn’t prove why "measure dynamics" isn’t EDT repackaged.  

  3. **Economist (Mechanism Design)** (Incentive-compatibility challenge)  
     *Objection*: "How is this incentive-compatible? If agents can ‘shift measures’ freely, what stops a bad actor from masquerading as cooperative to exploit others? Without causal enforcement, your trade is vulnerable to manipulation—the very problem mechanism design solves."  
     *Reply*: "Manipulation fails because agents commit to *policies*, not actions. A ‘defect-if-they-cooperate’ policy would shift *their own distribution* toward defection, making the other agent less likely to cooperate. Only mutual commitment to cooperation stabilizes. It’s incentive-compatible in the same way pre-commitment works in contracting—no ex-post cheating possible."  
     *Weakness*: Assumes agents can’t "lie" about their distribution, which isn’t enforced.  

  4. **Philosopher of Probability** ("Unmotivated metaphysics" charge)  
     *Objection*: "Your ‘measure over agent-types’ reifies mere possibilities. Why should I care about the weight of *counterfactual versions of me*? This feels like ad-hoc Platonism—postulating a shadow population to rationalize cooperation."  
     *Reply*: "The measure isn’t metaphysical—it’s an epistemic tool for handling *logical uncertainty*. When agents share code, my policy choice resolves logical facts about what *all instances* of my algorithm do. The measure quantifies uncertainty over those facts. We’re not adding entities; we’re representing ignorance about mathematical truths."  
     *Weakness*: Doesn’t resolve why this "ignorance" justifies privileging the distribution over the actual agent.  

  5. **Logical Uncertainty Researcher** (Computational tractability)  
     *Objection*: "Even if we accept this, computing measures over agent-types requires solving impossible logical induction problems. How is this more feasible than existing logical uncertainty frameworks? You’ve swapped one intractable problem for another."  
     *Reply*: "I agree—this is a *normative* framework, not an algorithm. Logical induction shows we can approximate such measures. The value is in clarifying *what* we’re approximating: updateless cooperation in acausal dilemmas. This justifies work on tractable heuristics (e.g., type-based priors) without changing the ideal."  
     *Weakness*: Handwaves implementation; logical induction might not converge fast enough for real decisions.  

  6. **Causal Decision Theorist** (Against updatelessness)  
     *Objection*: "Updatelessness is unmotivated. Once I know I’m ‘me’, I should use that indexical information and defect—CDT wins. Why ignore who I am to serve some ‘distribution’?"  
     *Reply*: "Because logical connections make indexical updating self-defeating. If you condition on being ‘you’, you break the symmetry that allows acausal trade. Updatelessness avoids this by evaluating policies *before* indexical information resolves—it’s the only way to capture gains from logical correlation."  
     *Weakness*: Assumes updatelessness is rational without independent justification.  

  7. **Game Theorist** (Generality and asymmetry)  
     *Objection*: "Your symmetric example is trivial. What if agents have different priors, resources, or risk tolerances? Game theory handles asymmetry with heterogeneous agents; your ‘measure shifts’ seem too fragile for real-world heterogeneity."  
     *Reply*: "Asymmetry is handled by conditioning measures on known differences (e.g., ‘I’m type A, they’re type B’). Trade occurs when measures assign weight to mutual gains—e.g., high-risk agents ‘shift measure’ to insure low-risk ones. It generalizes, but I focus on symmetry for clarity."  
     *Weakness*: No proof that equilibria exist in asymmetric cases.  

  8. **Economist** (Practical relevance)  
     *Objection*: "Where does this apply? In real economics, we use repeated games or contracts for cooperation. Acausal trade seems irrelevant—show me a use case beyond thought experiments."  
     *Reply*: "AI alignment: Two identical AIs on isolated servers choosing whether to share resources. Causal isolation blocks repeated interaction, but logical identity enables acausal trade. This isn’t sci-fi—it’s relevant for multi-agent AI safety."  
     *Weakness*: Too speculative; no empirical evidence.  

  ---

  ### **The Question You Hope Nobody Asks**  
  **Logical Uncertainty Researcher**: "If agents are ‘logically updateless’, how do they *learn* from their own existence? For example, if I’m a cooperative agent, shouldn’t I update that cooperative types are more likely to exist—undermining the measure’s objectivity?"  
  *Why it’s deadly*: Forces you to either (a) admit indexical updating creeps in (sabotaging updatelessness), or (b) posit a non-Bayesian learning rule. No clean reply exists without opening foundational holes.  

  ---

  **Summary Strategy**:  
  - **Defend novelty** by stressing *causal isolation + logical uncertainty* as the niche.  
  - **Neutralize "EDT" charges** by distinguishing *policy-controlled measures* from *action-based conditioning*.  
  - **Concede computational limits** but hold the line on normativity.  
  - **Redirect to AI** if pressed for applications.  
  - **If the "hopeless question" arises**, say: "That’s an excellent point—I’m exploring self-locating priors in updateless frameworks, but it’s unresolved. For now, I assume agents don’t update on their own type." (Then move on quickly.)
