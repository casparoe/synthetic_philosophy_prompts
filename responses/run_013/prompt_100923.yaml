  We are preparing a Q&A prep sheet for a workshop presentation on "distributional acausal trade". The core idea is replacing agents with distributions over agent-types, and trade is a mutual shift in the measure assigned to cooperative vs. defecting types. The example: two agents identical up to a random seed, each choosing between a cooperative policy (which pays off only if the other distribution assigns enough measure to cooperation) and a defecting policy (dominant under causal reasoning). We claim cooperation is rationally permissible/required under this distributional view.

  Key audience members:
  - Mostly causal decision theorists (CDT) and game theorists.
  - Two on logical induction / logical uncertainty.
  - One philosopher of probability suspicious of measures over possible agents.
  - One economist (mechanism design) concerned with incentive-compatibility.

  Friend's charge: either "evidential decision theory (EDT) with extra steps" or "unmotivated metaphysical postulate".

  We need:
  - 8 objections, ordered by damage (high damage first).
  - Each in the vocabulary of the person most likely to raise it.
  - Two-minute reply for each.
  - Candid note on the weakness of the reply.
  - What to concede upfront to buy credibility.
  - The one question we hope nobody asks.

  Concession upfront to buy credibility without giving away the thesis:
  We might concede that in standard causal settings with no logical uncertainty and no acausal links, CDT is the right approach. Our proposal is specifically for settings where the agents are logically updating and there is a logical dependence (via identical source code or shared structure) that creates the possibility of acausal influence.

  Ordering of objections by damage (most damaging first):

  1. **Game Theorist**: "This setup is just a coordination game with common interest. Why do we need a new decision theory? In game theory, we already have Nash equilibria and correlated equilibria. If the agents are identical and know it, they can coordinate by choosing the Pareto-efficient equilibrium. Your distributional approach seems to reinvent the wheel but without the rigor of equilibrium concepts."

  2. **Causal Decision Theorist (core charge)**: "You are smuggling in a correlation that isn't in the causal graph. The agents are causally isolated, so the only rational move is to defect. Your 'acausal trade' is just EDT in disguise: you're conditioning on your own policy choice to predict the other agent, which is exactly what EDT does. Why not just use EDT and be done with it?"

  3. **Economist (Mechanism Design)**: "How is this incentive-compatible? Each agent's distribution can be arbitrarily manipulated. What stops a strategic agent from pretending to be a cooperative type to induce cooperation from the other side, but then defecting? Without a causal enforcement mechanism, this seems fragile and open to deception."

  4. **Philosopher of Probability**: "Your measure over agent-types is metaphysically dubious. What grounds the probabilities over these merely possible agents? And why should we care about the measure over types rather than the actual agent? This seems like an unmotivated shift from the actual decision problem to a hypothetical ensemble."

  5. **Logical Uncertainty Researcher**: "How do you handle the computational aspects? Even if we accept the principle, computing the measure over agent-types requires logical uncertainty about the other agent's decision, which is computationally intractable. How is this any better than existing logical uncertainty approaches?"

  6. **Causal Decision Theorist (another angle)**: "You claim that the cooperative policy is required under logical updatelessness. But why should we be logically updateless? Why not update on the fact that we are the actual agent and then use causal decision theory? Updatelessness seems to be doing the heavy lifting, not your distributional framework."

  7. **Game Theorist (again)**: "In your example, the agents are identical. What if they are not? How does this generalize to asymmetric settings? And how do you define the 'measure' over types in a non-symmetric case?"

  8. **Economist (practicality)**: "This seems irrelevant to real-world mechanism design. In practice, we use contracts, reputation, and repeated interactions to enforce cooperation. Acausal trade doesn't apply to any realistic economic scenario I can think of. Where's the application?"

  Now, the one question we hope nobody asks (because it's the most damaging and hard to answer?):
  **The Logical Uncertainty Researcher might ask**: "You assume that the agents have the same prior and are symmetrically placed. But in reality, agents have different priors and different logical uncertainties. How do you define a common measure over types in such cases? Without a common prior, how can they coordinate on the same cooperative equilibrium?"

  Alternatively, a more foundational question from the philosopher: 
  **Philosopher of Probability**: "You are replacing agents with distributions. But the decision is still made by an actual agent. How does the actual agent, who is one specific type, 'control' the measure over types? This seems to conflate the agent with the distribution."

  We'll go with the latter as the one we hope nobody asks because it cuts to the heart of the agency issue.

  Now, let's draft the Q&A prep sheet with the objections and replies.

  ---

  **Q&A Prep Sheet for "Distributional Acausal Trade"**

  **Opening Concession**: 
  "I agree that in standard causal decision problems and in games with clear causal structure, causal decision theory and Nash equilibrium provide robust and well-justified solutions. The distributional approach is not intended to replace these but to address settings where agents face logical uncertainty and acausal relationships, such as when agents have identical source code and are making decisions in logically correlated environments."

  **Objections and Replies**:

  1. **Game Theorist's Objection** (Most damaging because it challenges the novelty and necessity):  
     *Objection*: "This is just a coordination game. Game theory already has the tools: if the agents are identical and know it, they can coordinate on the Pareto-efficient Nash equilibrium (cooperate, cooperate). Why do we need a new decision-theoretic framework? Your distributional approach seems to be a convoluted way to get to a standard result."  
     *Reply* (2 min): "The game-theoretic solution requires that the agents know they are identical and that they can condition on that fact. But in our setting, the agents are logically uncertain about the other's decision. The distributional approach handles this by representing the uncertainty as a measure over types. This is crucial when the agents are not certain about the logical relationship (e.g., due to different random seeds) and cannot condition on a known symmetry. Moreover, the distributional view scales to cases with more than two agents and partial cooperation thresholds, which are harder to model with standard equilibrium concepts without common knowledge."  
     *Weakness*: The reply might not fully convince because standard game theory can incorporate uncertainty through Harsanyi type spaces. We are not clearly beyond what Bayesian games can do.

  2. **Causal Decision Theorist's Objection (EDT in disguise)**:  
     *Objection*: "This is just evidential decision theory with extra steps. You're conditioning on your own policy to predict the other agent's action, which is what EDT does. Why not just use EDT? The causal graph doesn't contain the correlation you're relying on, so you're smuggling in an illegitimate correlation."  
     *Reply*: "EDT conditions on the action to update beliefs about the state, including other agents. Our approach is fundamentally different: we do not condition on the action of the actual agent but on the policy chosen by the distribution. The key is that the distribution is fixed and the agent is a sample from it. The correlation comes from the logical relationship (e.g., identical source code), which makes the distributions interdependent. This is not a causal link but a logical one. We are not updating on our own action but reasoning about how the entire distribution shifts in response to the policy choice."  
     *Weakness*: The distinction between conditioning on an action (EDT) and shifting a distribution might seem semantic. We haven't fully escaped the charge that this is EDT with a focus on ensembles.

  3. **Economist's Objection (Incentive-Compatibility)**:  
     *Objection*: "How is this incentive-compatible? An agent could pretend to be cooperative to induce cooperation from the other side but then defect. Without a causal enforcement mechanism, your scheme is vulnerable to manipulation by strategic agents who can mimic types."  
     *Reply*: "The distribution over types is fixed by the agent's actual policy. There is no 'pretending' because the type is determined by the policy the agent commits to. In the distributional setting, the agent doesn't choose an action but a policy that determines the measure over types. If you choose a policy that defects, your entire distribution shifts to defect, and the other agent's distribution will respond accordingly. There is no room for within-policy deception because the type is defined by the policy."  
     *Weakness*: This assumes that the agent can commit to a policy and that the policy is observable. In practice, without commitment, an agent might renege. We are relying on logical updatelessness to prevent such reneging, which is controversial.

  4. **Philosopher of Probability's Objection (Metaphysical Dubiousness)**:  
     *Objection*: "Your measure over agent-types is metaphysically problematic. What grounds the probabilities over merely possible agents? And why should the actual agent care about the measure? It seems you've shifted the decision problem from the actual agent to a fictional ensemble."  
     *Reply*: "The measure is grounded in logical uncertainty. We are uncertain about logical facts, such as what the other agent will do, and the measure represents that uncertainty. The actual agent is part of the distribution and the policy choice affects the entire distribution. This is not fictional because the logical uncertainty is real: the agent doesn't know the logical relationship between its policy and the other agent's. The measure is a way to reason about that uncertainty."  
     *Weakness*: We haven't fully addressed why the agent should care about the measure. We are assuming a form of group rationality that might be controversial.

  5. **Logical Uncertainty Researcher's Objection (Computational Intractability)**:  
     *Objection*: "Even if we accept the principle, computing the measure over agent-types requires solving hard problems in logical uncertainty. How is this approach computationally feasible? And how is it better than existing logical induction frameworks?"  
     *Reply*: "The distributional approach is a formal framework that can be implemented approximately using logical induction methods. We don't claim to solve the computational problem but to provide a rational foundation for acausal trade under logical uncertainty. This framework is complementary to logical induction and can guide the design of practical algorithms by clarifying the goal: mutual adjustment of measures over types."  
     *Weakness*: We are hand-waving on computation. If logical induction is intractable, then so is our approach.

  6. **Causal Decision Theorist's Objection (Against Updatelessness)**:  
     *Objection*: "Why should we be logically updateless? Once I know I am the actual agent, I should update and use CDT. Your entire argument rests on updatelessness, which is not justified."  
     *Reply*: "In these acausal settings, updating leads to self-defeating decisions. If you update on being the actual agent, you break the logical connection to the other agent and defect, leading to the suboptimal outcome. Updatelessness is necessary to account for the logical correlation. The distributional approach naturally incorporates updatelessness by evaluating policies from a perspective that doesn't condition on being a particular indexical instance."  
     *Weakness*: The justification for updatelessness is still a matter of debate. We are assuming the updateless view is correct without proving it.

  7. **Game Theorist's Objection (Asymmetry and Generalization)**:  
     *Objection*: "Your example assumes symmetry. How does this work in asymmetric cases? How do we define the measure over types when agents have different utility functions or different priors?"  
     *Reply*: "The distributional framework can handle asymmetry. Each agent has its own measure over the other agent's types. Trade occurs when there is a mutual benefit from shifting the measures. For example, if one agent values a good more than the other, they can find a trade that benefits both. The measures are updated based on the policies chosen, and we look for fixed points where each agent's policy is optimal given the other's measure."  
     *Weakness*: Without symmetry, the fixed points might not exist or might be hard to compute. We haven't provided a general solution for the asymmetric case.

  8. **Economist's Objection (Practical Relevance)**:  
     *Objection*: "Where is the real-world application? In mechanism design, we use repeated games, contracts, and reputation to enforce cooperation. Acausal trade seems irrelevant for actual economic problems."  
     *Reply*: "Acausal trade applies to settings with logical correlation, such as artificial agents running the same code. As AI systems become more prevalent, we will face decision problems where agents are logically connected but causally isolated. This could be crucial for AI alignment and coordination. Moreover, the framework might inspire new mechanisms in settings with pre-commitment and limited communication."  
     *Weakness*: The application to AI is speculative, and the economist might not buy the relevance to current economic problems.

  **The Question We Hope Nobody Asks**:  
  *Question* (from the Philosopher of Probability): "You replace agents with distributions. But the actual decision is made by a specific agent. How does that agent, who is one type, 'control' the measure over types? How can the agent, who is part of the distribution, change the distribution? This seems circular and metaphysically mysterious."  
  *Why it's bad*: This challenges the agency in the model. If the agent is just one type, how can it shift the entire distribution? We have to say the agent chooses a policy that applies to the entire distribution, but that might seem like a sleight of hand. The reply would be: "The agent is not choosing for itself alone but for the entire distribution. The policy is a commitment that determines the measure over types in all possible worlds." But this commitment mechanism is exactly what the objector might find unmotivated.

