answer: |-
  ### Ranked Agenda of Open Questions in Acausal Trade and Decision Theory

  I've ranked the open questions based on three criteria: **dependency** (how many other questions hinge on the answer), **impact** (how much the answer would change agent/institution design), and **tractability** (feasibility for desk reasoning without experiments). Each criterion is scored on a 1-3 scale (3 = highest). The total score (sum of all three) determines ranking. Your three candidate cruxes are explicitly integrated and analyzed.

  #### **Ranked List**  
  1. **Are the gains from acausal trade genuine, or an artifact of double-counting possible worlds?**  
     - *Dependency*: 3 (Foundational; invalidates the field if gains are illusory)  
     - *Impact*: 3 (Determines whether agents should engage in trade at all)  
     - *Tractability*: 3 (Pure conceptual/philosophical analysis; no experiments needed)  
     - **Total**: 9  
     - **Notes**: Your Crux 2. Upstream of all others—if gains are spurious, everything else collapses. Over the next 1–2 years, progress could come from formal proofs demonstrating inconsistency in world-models (e.g., showing purported gains vanish under unified world-descriptions) or robust frameworks that reconcile trade with consistent probability measures.

  2. **Does acausal decision theory collapse into ordinary expected-value reasoning under a prior over others' policies?**  
     - *Dependency*: 3 (Resolves whether new decision theories are needed)  
     - *Impact*: 3 (If true, agents revert to standard Bayesian methods; if false, novel designs are essential)  
     - *Tractability*: 2 (Requires analytical work on priors, but well-defined)  
     - **Total**: 8  
     - **Notes**: Your Crux 3. Upstream of Crux 1 (if it collapses, mutual knowability is irrelevant). **Most overrated**—many assume collapse is inevitable, but logical correlations between agents may prevent it. Evidence to watch: new impossibility proofs (e.g., showing priors can't capture logical dependencies) or extensions of MIRI's logical induction framework that absorb acausal trade.

  3. **Is mutual knowability of decision procedures required for trade, and does logical uncertainty void this?**  
     - *Dependency*: 2 (Affects implementation but not existence of trade)  
     - *Impact*: 3 (Determines if agents must be transparent/approximable)  
     - *Tractability*: 2 (Formal work on logical uncertainty; e.g., Garrabrant's logical induction)  
     - **Total**: 7  
     - **Notes**: Your Crux 1. Downstream of Crux 2–3—if gains are genuine and don’t collapse, this becomes critical for feasibility. Argument/evidence: tractable models of mutual prediction under logical uncertainty (e.g., simulations of bounded agents trading via probabilistic proofs) could resolve this.

  4. **What solution concept governs acausal cooperation?**  
     - *Dependency*: 3 (Defines what "rational" trade means)  
     - *Impact*: 3 (Specifies agent design, e.g., program equilibrium vs. superrationality)  
     - *Tractability*: 2 (Theoretical work on fixed-point theorems; no experiments)  
     - **Total**: 8  
     - **Notes**: Overlooked but vital. If Crux 2–3 are resolved positively, this dictates *how* to build agents. Key sub-questions: Nash vs. reflective equilibrium, handling multiple equilibria.

  5. **How do we define and compute logical counterfactuals?**  
     - *Dependency*: 3 (Needed to evaluate "what if I defect?" without causal influence)  
     - *Impact*: 2 (Affects payoff calculations but not core viability)  
     - *Tractability*: 1 (Highly abstract; limited progress expected)  
     - **Total**: 6  
     - **Notes**: Downstream of Crux 2–3. Evidence: new formalisms (e.g., based on logical counterfactual invariance) that avoid circularity.

  6. **How can bounded agents practically engage in acausal trade?**  
     - *Dependency*: 1 (Implementation-level)  
     - *Impact*: 2 (Optimizations for real-world systems)  
     - *Tractability*: 3 (Heuristic/algorithmic desk reasoning)  
     - **Total**: 6  
     - **Notes**: Less critical if core theory is unresolved. Watch for: resource-bounded models (e.g., metadeliberation).

  ---

  ### Analysis of Your Cruxes
  - **Upstream/Downstream**:  
    - **Crux 2 (gains genuine?)** is **most upstream**. If gains are illusory, everything else is moot.  
    - **Crux 3 (collapse?)** is **midstream**. It depends on Crux 2 but upstream of Crux 1.  
    - **Crux 1 (mutual knowability?)** is **downstream**. It only matters if gains are real and novel decision theory is needed.  
  - **Overrated**: **Crux 3 (collapse?)** is slightly overrated. While important, the "prior over policies" approach struggles with logical correlations (e.g., two agents' decisions being proof-theoretically entangled), making collapse unlikely. Focus here may distract from harder questions like Crux 2.  
  - **Evidence Shifts**:  
    - **Crux 2**: A paper proving that acausal gains reduce to inconsistent probability assignments (e.g., via Dutch-book arguments) would elevate it further. Empirical work won’t help.  
    - **Crux 3**: A tractable universal prior that handles logical dependencies (e.g., in AIXI-like models) would boost its rank. Conversely, impossibility results (e.g., "no prior captures acausal correlations") would lower it.  
    - **Crux 1**: Progress in logical uncertainty (e.g., scalable mutual prediction) would make it more tractable and urgent.  

  ### Recommended Focus
  Prioritize **Crux 2 (gains genuine?)**—it’s the linchpin. If gains hold up, **Crux 3 (collapse?)** becomes decisive for agent design. **Crux 1 (mutual knowability?)** is actionable only if the first two are resolved positively. The solution concept (#4) is a dark horse: if Crux 2–3 validate acausal trade, this becomes the next binding constraint.
