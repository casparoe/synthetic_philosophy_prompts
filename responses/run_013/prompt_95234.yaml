prompt: |-
  I've been arguing about this with a freind for three weeks and we've got nowhere, so I'm outsourcing it. I'm writing a short piece for a reading group that's half Simone Weil people and half democratic theorists, and the hook is a city that doesn't exist. Imagine a mid-sized city that has abolished political parties outright: no slates, no whips, no manifestos, no permanent organisation, nothing you could join. What it has instead is two layers. First, a standing citizens' panel of a few hundred people picked by lot, serving staggered one-year terms, which sets the agenda and drafts the proposals that go to a vote. Second, a phone app through which any resident can hand their vote, issue by issue, to any other resident, revocably and at any time -- you can take it back the next morning, split it across five people, and nobody ever holds your vote as of right. The detail I keep coming back to is that the app also shows, live, how many delegations each proposal has attracted and which arguments the heaviest delegators are backing, so the shape of the room is always visible before you decide. My Weil friends say this is the nearest thing anyone has built to what she wanted; my democratic theory friends say it's a horror show she'd have recognised instantly. Weil died in 1943, so she never saw anything like it, and that's precisely why I want the question taken seriously rather than waved away as anachronistic.

  What I want is your best reconstruction of what her view would actually have been, and I want it specific rather than a vibe. Would she have welcomed the abolition of parties here, or would she have said that abolishing the party only clears the ground and leaves untouched the real problem -- which, on my reading of her, is the way a collective can heat a person's thinking until they stop thinking at all, a party being essentially a device for manufacturing collective passion, so that a party is a function rather than a form and a fluid delegation network might just be a party in liquid form? So: does revocable delegation keep the individual's judgement alive, as it looks like it should, or does a delegate with ten thousand revocable votes still hold exactly the kind of power she was frightened of? Does the live display of delegation counts serve the kind of attention she prized, or is it the manufacturing machine with a nicer interface? And what about the panel -- does selection by lot answer her worry about politics being done by people cut off from real work, or does it produce a different uprootedness, amateurs with no place and no trade? Where her texts genuinely don't settle something, say so and tell me what they leave open, instead of inventing a Weil who agrees with me. (For what it's worth I half-think she'd have approved of the panel and been appalled by the app, but I can't tell whether that's a reading or just my own taste.) Please dont quote her; paraphrase, and where a paraphrase is carrying a lot of weight, tell me what in her thinking it's leaning on. And be straight with me about the state of the scholarship: my sense is that some of this is settled among people who've read her closely and some of it is a live disagreement, so mark which is which and don't hand me a contested reading dressed up as the consensus.

  Give it to me in five sections, in this order and roughly these lengths: 'What she was actually committed to' (200 words, nothing contested smuggled in); 'The city through her eyes' (350 words, walking the case through those commitments one at a time); 'My predicted verdict' (250 words, a straight answer on parties, on delegation and on the panel, with a confidence level attached to each); 'Where this is contested' (200 words, the readings that would give a different answer and why serious people hold them); and 'The strongest objection to my prediction' (150 words, arguing against yourself). Just over a thousand words in total, and no reading list -- I know the texts.
