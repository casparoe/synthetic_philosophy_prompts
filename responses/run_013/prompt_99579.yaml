  In continuous prose:

  Consider two agents, Alice and Beth, who are identical in every observable respect. They share the same environment and, for every possible situation, they behave in exactly the same way. This includes situations involving complex deliberation, moral decision-making, creative problem-solving, and even reports of introspective experiences such as feeling free and having made a choice. The difference between them lies solely in their internal causal structures. Alice operates according to a fixed finite program that determines her entire life's behavior. This program is sophisticated, enabling her to simulate learning, self-modification, and reasons-responsive behavior, but every step is inexorably fixed by the initial code. Beth, on the other hand, is equipped with agent-causal capacities. When she deliberates, she, as an agent, can cause her choices in a way that is not determined by any prior state of the universe, though her actions are consistently guided by reasons. This agent-causation does not rely on quantum indeterminacy but is a fundamental feature of her agency.

  A reasons-responsiveness compatibilist, focusing on the actual and counterfactual patterns of behavior, will judge both agents to be free. Both exhibit the appropriate sensitivity to reasons: in any given situation, they respond to reasons in a manner that would be expected of a free agent, and in counterfactual scenarios where reasons change, they would adjust their behavior accordingly. The fact that Alice's behavior is determined by a fixed program does not trouble the compatibilist, as determinism is compatible with the kind of reasons-responsiveness that constitutes free will. Beth's case is also unproblematic because her actions are reasons-responsive, even if not fully determined by reasons.

  A sourcehood libertarian, however, will part ways with the compatibilist over Alice. The libertarian requires that the agent be the ultimate source of her actions, which entails that the actions not be determined by factors outside the agent's control. In Alice's case, her behavior is fully determined by her initial program, so she is not the source. Beth, by contrast, meets this condition: her agent-causal power allows her to be the originator of her choices, making her free.

