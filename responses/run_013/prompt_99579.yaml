  The losing side in this thought experiment is the libertarian. Faced with two agents who are behaviorally indistinguishable, the libertarian must explain why one is free and the other is not, despite their functional equivalence. The libertarian's best counterattack is to argue that free will is not a matter of observable behavior but of metaphysical structure. Alice, being a deterministic system, lacks the capacity for true agency; she is merely a sophisticated automaton. Beth, however, possesses agent-causal power, which grants her genuine agency. The behavioral similarity is a superficial resemblance that masks a deep ontological difference. The libertarian might further contend that the compatibilist's focus on reasons-responsiveness is insufficient because it can be replicated in a deterministic system, thereby missing the essence of free will, which is ultimate responsibility and sourcehood.
answer: |-
  Imagine two individuals, whom we shall call Cassius and Decimus, existing in identical environments and exhibiting precisely the same behaviors throughout their entire lives. In every conceivable situation—whether facing a moral dilemma, engaging in creative problem-solving, or reporting introspective states of deliberation and choice—their actions, words, and even their first-person accounts of decision-making are indistinguishable. An observer, or they themselves, could not tell them apart based on outward behavior alone. The divergence lies solely in their internal causal architectures.

  Cassius operates on a fixed finite program—a single, unalterable algorithm that dictates his entire behavioral trajectory from birth to death. This program is exquisitely complex, capable of generating subroutines that mimic learning, self-modification, and nuanced reasoning. For instance, when confronted with conflicting values, Cassius’s program executes a sequence that weighs options, simulates internal debate, and produces a decision that appears thoughtful and reasons-responsive. Yet every step, including any apparent self-rewiring, is predetermined by the initial code. There is no flexibility in the underlying machinery; it is a closed system where outputs are fully determined by inputs and the immutable program.

  Decimus, however, possesses an open-ended causal structure. His behavior is generated through a process of genuine agent-causation, where he, as an irreducible source, actively directs his choices in response to reasons without being determined by prior states. When Decimus deliberates, he does not merely execute a pre-set routine; he engages in real-time, unstructured evaluation of reasons, and his choices emerge from his capacity as an agent to initiate actions that are not fixed by any finite algorithm or deterministic chain. This agent-causal power is not grounded in quantum events but is a fundamental aspect of his agency—allowing him to be the ultimate originator of his decisions while remaining responsive to reasons. His behavior, while matching Cassius’s in every detail, stems from this capacity for undetermined, self-originated action.

  Now, consider how a reasons-responsiveness compatibilist and a sourcehood libertarian would assess these agents. The compatibilist, holding that free will is compatible with determinism if the agent acts for reasons and would respond appropriately to different reasons, finds Decimus free. Decimus’s agent-causal process ensures that his actions are directly and authentically responsive to reasons, as he evaluates them anew in each context. Crucially, the compatibilist also judges Cassius to be free. Despite his fixed program, Cassius’s behavior is reliably reasons-responsive: in actual and counterfactual scenarios, he adapts his actions to reasons in a way that satisfies compatibilist criteria. His rich internal processing, which includes simulated deliberation and self-reporting of agency, makes him appear—and function—as a reasons-responsive agent. Thus, for the compatibilist, the deterministic nature of Cassius’s program is irrelevant; identical behavior implies identical freedom.

  The sourcehood libertarian, however, diverges sharply on Cassius. For the libertarian, free will requires that the agent be the ultimate, indeterministic source of their actions, escaping determination by prior causes. Decimus meets this standard: his agent-causal machinery allows him to originate actions in a way that is not fixed by his past or any external program. Cassius, though, is wholly determined by his initial algorithm. Every "choice" he makes is the inexorable output of a closed system, leaving no room for him to be the true author of his actions. His apparent flexibility is an illusion, as the program’s complexity merely masks its rigidity. Thus, while both agree Decimus is free, they part ways on Cassius—the libertarian denies him freedom due to his deterministic sourcehood deficit.

  The single feature driving this split is the deterministic structure of Cassius’s program versus the indeterministic, source-dependent structure of Decimus’s agency. Determinism, in this context, refers to the complete fixity of behavioral outputs given inputs and initial state, which Cassius embodies. If this feature were altered—for instance, if Decimus’s open-endedness were revealed to be a fixed finite routine—his indeterminism would collapse into determinism. The libertarian would then deny freedom to both agents, as neither could be an ultimate source. The compatibilist, unfazed, would still affirm both, as reasons-responsiveness remains intact. Conversely, if Cassius’s routine were infinite but still fully fixed (e.g., an unbounded yet deterministic algorithm), the split would persist. Determinism would still govern Cassius, rendering him unfree for the libertarian, while the compatibilist would still see identical reasons-responsive behavior as sufficient for freedom. Finitude versus infinitude is not the issue; determinism is.

  The losing side here is the sourcehood libertarian, as their position faces a challenge from the principle of behavioral equivalence. A defender of libertarianism might counter that the thought experiment smuggles in a false equivalence between genuine agency and mere simulation. They would argue that Cassius’s program, however sophisticated, reduces his "agency" to epiphenomenal noise—a cascade of predetermined events where no real choice occurs. By contrast, Decimus’s agent-causation involves irreducible ontological commitment to the self as a causal force. The libertarian might contend that the case assumes behaviorism, where identical outputs imply identical agency, but this ignores the metaphysical essence of freedom: sourcehood cannot be inferred from behavior alone. Thus, the libertarian would reject the idea that Cassius’s first-person reports of "deciding" have the same weight as Decimus’s, as the former are predetermined outputs, not evidence of true authorship. This counterattack highlights a core libertarian claim: freedom is about the inner architecture of causation, not outward performance. Yet it remains vulnerable, as the thought experiment forces the libertarian to posit an empirically undetectable difference, risking an appeal to dualism that critics may find untenable. The compatibilist, by grounding freedom in observable responsiveness, avoids this pitfall but at the cost of potentially reducing agency to sophisticated clockwork.
