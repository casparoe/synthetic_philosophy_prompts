prompt: |-
  I'm a trustee of a small egg farm co-op, about thirty family farms, and we're going for a salmonella-free certification so the supermarkets will stock us. The certifier wants a statement from the board that no egg we have ever sold has carried salmonella, and we vote on it Thursday, they want it by Friday.

  Our evidence is three years of lab testing, roughly 12,000 eggs, every one of them clean. Our lab man is honest that his test isn't perfect: he reckons if an egg did have it he'd catch it about nine times out of ten. And then one of our trustees pulled the county outbreak regester for the same three years, about forty confirmed salmonella cases, every one traced to other farms, mostly chicken meat, none of them ours, and he wants to stick that in the submission as extra evidence.

  That's where we fell out. Trustee B says the outbreak data is rubbish evidence, they were other people's eggs, it tells us nothing about ours. Trustee C said something I can't shake: if a salmonella case from somebody else's farm supports our claim, then every egg in the world that isn't ours and doesn't have salmonella supports our claim as well, and that is obviously daft, so something must be broken in the way we're thinking about the whole thing.

  I went down a rabbit hole online. There's this old puzzle, the raven paradox, I think it's Hempel, where the claim that all ravens are black is supposed to get support from a green apple, on the grounds that all ravens are black means the same as everything that isn't black isn't a raven, and a green apple is a thing that isn't black and isn't a raven. I dont know whether that's a real argument or a conjuring trick, and I don't know which of my trustees it's actually backing. One comment under the blog post I read said the whole thing hinges on how you went looking, that a green apple only counts if you were checking in a way that could have turned up a raven, and I couldn't tell if that was the answer or a dodge.

  Can you write me the short memo I'll hand round at the meeting. What I need from it: a recommendation I can actually put to a vote, on whether the outbreak data goes into the submission and, if it does, how we word it; a standard for what counts as evidence that we can use for the next few years, because we'll be making claims like this again and I don't want to keep having this argument; something that does justice to Trustee C, because I think he's found something real and I can't say what; and the honest case for the other side, including if the right answer is that the outbreak data stays out, say so and say why, because two trustees will vote against me and I need to know what I'm up against. Plain English, no citations, nobody on our board reads academic papers, I just need to be able to defend it out loud on Thursday.
reasoning: |-
  Okay, the user is a trustee of a small egg farm co-op facing a decision about including salmonella outbreak data in their certification submission. They need a memo for their board meeting that addresses whether to include the data, sets a standard for evidence, validates Trustee C's concerns, and presents honest counterarguments. 

  First, I need to unpack their situation. They have 3 years of clean lab tests (12,000 eggs) with 90% detection accuracy if contaminated. Trustee B thinks the unrelated outbreak data is irrelevant ("rubbish evidence"), while Trustee C raises a logical paradox - if other farms' outbreaks support their claim, then every non-contaminated non-their-egg would too, which seems absurd. This connects to Hempel's raven paradox about confirmation theory.

  The core issue is evidential relevance. Trustee C is right that random non-events (other farms' clean eggs) shouldn't count as evidence - but outbreak data isn't random non-events. It's specifically documented contamination events traced elsewhere. The key distinction is whether the evidence was actively sought ("looking for trouble") versus passively observed. 

  For the memo recommendation: The outbreak data should stay OUT of the certification submission but be kept internally. Including it risks implying their safety depends on others' failures rather than their own controls. Their strongest evidence is the proactive lab testing. 

  For future evidence standards: Focus on direct, actively generated data (like their testing program) rather than passively observed external events. 

  To honor Trustee C: He correctly identified a logical trap - not all "non-our-contaminated-eggs" are evidence. The resolution lies in whether evidence collection was systematic (tests) or accidental (outbreak reports). 

  Honest counterarguments: Some might argue the outbreak data shows their region has salmonella but they've avoided it, proving their systems work. But this is weak compared to their direct evidence. 

  The memo should be in plain English, vote-ready, with clear reasoning about evidence quality. It needs to resolve the paradox concern while keeping the submission scientifically defensible.
answer: |-
  ## MEMO: EVIDENCE STANDARDS FOR SALMONELLA-FREE CERTIFICATION  
  **To:** Board of Trustees  
  **From:** [Your Name]  
  **Date:** [Meeting Date]  
  **Re:** Use of County Outbreak Data in Certification Submission & Future Evidence Standards  

  ### 1. RECOMMENDATION: DO NOT INCLUDE OUTBREAK DATA IN SUBMISSION  
     *   **Vote Proposal:** "The board will submit *only* the 3-year lab testing results (12,000 eggs, all negative) as evidence for the salmonella-free certification claim. County outbreak data will not be included in the submission."  
     *   **Reasoning:**  
         *   **Our Lab Tests Are Direct Evidence:** 12,000 tests specifically on *our eggs* are strong, direct proof of our farm's safety record. The lab's 90% detection rate is accounted for in the certification process; it's standard practice.  
         *   **Outbreak Data is Indirect & Misleading:** While it *feels* supportive, it doesn't directly prove *our eggs* were safe. It proves other sources *were* unsafe. Including it risks:  
             *   **Diluting Our Strong Evidence:** It distracts from our direct testing.  
             *   **Implying Weakness:** Certifiers might wonder why we included it if our direct evidence is solid.  
             *   **Logical Flaw (Trustee C's Point):** As Trustee C highlighted, if other farms' outbreaks support us, then logically, *every egg ever sold that wasn't ours and wasn't contaminated* would also "support" us. That's clearly not meaningful evidence. This data wasn't generated to test *our* eggs.  
     *   **How to Word Our Claim:** Stick strictly to our results: "Based on three years of continuous laboratory testing (approximately 12,000 eggs sampled according to [Specify Standard, e.g., FDA guidelines]), no *[Co-op Name]* eggs tested positive for Salmonella. Our testing protocol has an estimated 90% probability of detecting contamination if present."

  ### 2. STANDARD FOR FUTURE EVIDENCE  
     *   **The "Active Test" Principle:** For future claims about our eggs' safety, evidence must come from **active, targeted testing of OUR product or operations.**  
         *   **Counts:** Our lab results, independent audits of *our* farms, testing of *our* feed or pullets.  
         *   **Does NOT Count:** Data about competitors, unrelated outbreaks, general market statistics, or the absence of complaints *unless* it's part of a verified, proactive monitoring system *specifically for us*.  
     *   **Why This Standard?** It ensures evidence directly reflects *our* practices and avoids the logical trap Trustee C identified. Evidence is strongest when we deliberately look for problems in our own system and find none.  

  ### 3. VALUING TRUSTEE C'S INSIGHT  
  Trustee C identified a crucial logical issue: **Not everything that *isn't* a problem for us counts as evidence *for* us.** His point about other farms' outbreaks highlights a key principle in evidence:  
     *   **Passive "Non-Events" Aren't Proof:** The mere fact that bad things happened elsewhere (or didn't happen to us randomly) doesn't *prove* our safety.  
     *   **Active Investigation Is Key:** What *does* prove our safety is *actively investigating our own eggs* and consistently finding them clean. Our 12,000 tests are powerful because we *sought out* potential problems. The outbreak registry wasn't generated by anyone testing *our* safety; it's just something that happened nearby. Trustee C is right that using it as evidence for *us* feels logically "daft" because it wasn't designed to test our claim.  

  ### 4. HONEST CASE FOR INCLUDING THE DATA (Why Some Might Vote Against)  
  Trustees arguing *for* inclusion might reasonably believe:  
     *   **Context Matters:** It shows Salmonella *is* present in our county, proving we operate in a risky environment yet have maintained a clean record. This *could* make our clean tests look even stronger ("If it's out there, and we've avoided it, our systems must work").  
     *   **Negative Space Has Weight:** The *absence* of our name on the outbreak list, over 3 years, *feels* like corroborating evidence, even if indirect. It reinforces confidence.  
     *   **Perception is Reality:** Supermarkets might find the broader context reassuring. Showing awareness of local risks could demonstrate proactive management.  

  **However, the risks of dilution, misinterpretation, and the core logical weakness identified by Trustee C outweigh these points.** Our direct testing evidence is paramount. The outbreak data is best used *internally* for risk assessment, not submitted as certification proof.

  ### SUMMARY & ACTION  
  *   **Vote FOR:** Submitting *only* our direct lab testing results to the certifier.  
  *   **Adopt FOR FUTURE:** The "Active Test" Principle for evidence.  
  *   **Acknowledge:** Trustee C identified a fundamental principle about what constitutes valid supporting evidence – passive "non-events" elsewhere lack the power of our own active testing.  
  *   **Respect the Opposition:** Understand their desire for broader context, but prioritize the strongest, most direct evidence for the certifier.  

  **This approach gives us the clearest, most defensible path to certification based on the undeniable strength of our own testing program.**
