answer: |-
  Here's the translation of axiomatic bargaining into your social choice vocabulary, followed by the residue report and an assessment of the normative dispute's translatability:

  **Translation: Bargaining Solutions as Welfare Aggregation Rules**

  1.  **Alternatives (X):** The set of feasible *utility vectors* (u1, u2, ..., un) achievable through agreement. Each vector corresponds to a potential agreement/social state.
  2.  **Choice Rule (C):** The bargaining solution (e.g., Nash, Kalai-Smorodinsky) selects a single utility vector from the feasible set `S ⊆ R^n`, *given* a fixed disagreement point `d ∈ R^n`.
  3.  **Aggregation:** Both solutions aggregate individual cardinal utilities into a social choice, but using very different functional forms:
      *   **Nash:** `argmax_{u ∈ S, u ≥ d} Π (u_i - d_i)` (Product of Gains)
      *   **Kalai-Smorodinsky (KS):** `argmax_{u ∈ S, u ≥ d} min_i [ (u_i - d_i) / (u_i^* - d_i) ]` (Maximizes the Minimal *Proportional* Gain relative to the Utopia Point `u^*`, where `u_i^* = max {u_i | u ∈ S, u ≥ d}`).
  4.  **Anonymity:** Both standard characterizations assume anonymity (symmetry across players). The solutions are invariant under permutation of player indices *if* the feasible set `S` and `d` are symmetric.
  5.  **Informational Basis & Invariance:**
      *   **Nash Bargaining:**
          *   *Presupposes:* **Cardinal Unit Comparability (CUC)**. Only utility *differences* (gains over `d`) are meaningful and comparable across individuals.
          *   *Invariance:* Scale Invariance (`α_i > 0`, `β_i`: `u_i' = α_i u_i + β_i` transforms `S` and `d` accordingly). The solution depends *only* on the *relative scales* of utility differences established by the affine transformations. The zero point and unit size of any individual's utility can be changed arbitrarily as long as the *ratios* of units across individuals are preserved in the gains `(u_i - d_i)`.
      *   **Kalai-Smorodinsky:**
          *   *Presupposes:* **Cardinal Full Comparability (CFC)** or **Cardinal Level Comparability (CLC)**. Utility *levels* (specifically, the values of `d_i` and `u_i^*`) must be interpersonally comparable to define the proportional gains `(u_i - d_i) / (u_i^* - d_i)` meaningfully.
          *   *Invariance:* Only Invariant under common *positive affine* transformations (`α > 0`, `β`: `u_i' = α u_i + β` for all `i`). This preserves the *ratios* of utility *levels* (`(u_i' - u_j') / (u_k' - u_l') = (u_i - u_j) / (u_k - u_l)`), crucial for the utopia point `u^*` and the proportional gains. Changing individual units independently (`α_i`) destroys the solution.
  6.  **Key Axioms & Dispute:**
      *   **Nash's Axioms:** Pareto Optimality (PO), Symmetry (Anon), Scale Invariance (SI), **Nash-IIA**.
      *   **KS's Axioms:** PO, Symmetry, **Individual Monotonicity (IM)**, **Restricted Monotonicity (RM)**.
      *   **The Core Dispute:** Nash prioritizes **Scale Invariance (SI)** and **Nash-IIA**, while KS prioritizes **Individual Monotonicity (IM)**.
          *   **Scale Invariance (Nash):** The solution shouldn't change if we re-scale individual utility functions (while preserving interpersonal unit comparability). This reflects the view that utility scales are arbitrary conventions; only ratios of gains matter.
          *   **Nash-IIA:** If `S` shrinks to `T` (`T ⊆ S`) and the original solution point `u*` remains in `T` and is still feasible (`u* ≥ d`), then `u*` must remain the solution for `(T, d)`. *This is distinct from Arrow-IIA!* It considers the *feasible set of utility vectors* shrinking while holding the *disagreement point `d` fixed*. Arrow-IIA considers the *set of social alternatives* changing while holding *individual ordinal preferences* fixed (over the remaining alternatives).
          *   **Individual Monotonicity (KS):** If the feasible set `S` expands to `S'` in a way that increases the utopia payoff `u_i^*` for player `i` *without decreasing* `u_j^*` for any other player `j`, then player `i` should not end up *worse off* in the new solution compared to the old solution (on the intersection `S ∩ S'`). KS satisfies this; Nash does not. This reflects the view that expanding opportunity beneficially for one player without harming others' opportunities should not punish that player.

  **Residue Report: What Doesn't Translate Cleanly**

  1.  **The Reference Points (`d` and `u^*`):** Your hunch is **exactly correct**. This is the **most significant residue**.
      *   `d` (Disagreement Point): This is **not a feasible alternative** in `X`. It's an *external reference state*, representing the welfare outcome if *no agreement is reached*. Social choice welfare functions typically aggregate preferences *only over feasible alternatives* `X`. `d` functions like a *status quo parameter* defining the "gains" to be bargained over, fundamentally altering the domain of the aggregation rule. It's not something agents rank; it's a fixed threat/fallback.
      *   `u^*` (Utopia Point): Also **not feasible**. It's an *ideal benchmark* constructed from the *supremum* of individual utilities *across all alternatives*. It's not an alternative itself and isn't ranked. Its definition relies critically on the cardinality and interpersonal comparability assumptions.
  2.  **Nash-IIA vs. Arrow-IIA:** Your suspicion is **correct**. They are **homonyms**. Confusing them is a common pitfall.
      *   **Arrow-IIA:** Concerns the *independence of irrelevant social alternatives*. If the *set of social alternatives* shrinks (`Y ⊆ X`), the social ranking *over `Y`* depends *only* on the individual ordinal rankings *over `Y`*. Preferences over removed alternatives (`X \ Y`) are irrelevant. Preferences are fixed over the remaining alternatives.
      *   **Nash-IIA:** Concerns the *independence of irrelevant utility vectors*. If the *feasible utility set* shrinks (`T ⊆ S`) and the original solution `u*` remains feasible (`u* ∈ T`, `u* ≥ d`), then `u*` is still the solution *for `(T, d)`*. Crucially, **`d` is held fixed**, and the condition pertains only to the *feasibility* of `u*`, not to preferences over other points in `T` or `S \ T`. Individual preferences (if they even exist as orderings) are not the focus; the mapping from `(S, d)` to a point is.
  3.  **The Nature of "Alternatives":** Bargaining solutions map a *set of utility vectors* `S` and a *point* `d` to a *point* in `S`. Standard social choice maps a *set of social alternatives* `X` and a *profile of preference orderings* `(R_1, ..., R_n)` over `X` to a choice set/social ordering. The bargaining setup embeds cardinal utility and the status quo `d` directly into the "description" of the choice problem in a way classical social choice does not.

  **Can the Normative Dispute be Stated in Welfare Function Terms?**

  *   **Yes, but only with significant modifications to your framework.** The core dispute (Scale Invariance vs. Individual Monotonicity) is fundamentally about **how to handle cardinal utility and interpersonal comparisons within a fixed-disagreement context**.
  *   **Stating it requires:**
      1.  **Cardinality:** Assuming vNM preferences or directly cardinal utilities over `X`.
      2.  **Interpersonal Comparability:** Explicitly specifying the type (CUC for Nash, CFC/CLC for KS).
      3.  **Incorporating `d`:** Treating `d` as an **exogenous parameter** of the aggregation problem, defining the "gains from cooperation." Your welfare function `W` would need the signature `W(R_1, ..., R_n, X, d) → choice`, where `d` is a utility vector associated with the disagreement outcome (not necessarily in `X`).
      4.  **Defining `u^*` (for KS):** Requires calculating `max_{x ∈ X} u_i(x)` for each `i` using the cardinal utility representations.
  *   **The Core Question Translated:** "Given a set of social alternatives `X`, cardinal vNM utilities over `X`, interpersonal comparability type `[CUC | CFC]`, and a fixed disagreement outcome `d` (with utility vector `d`), should the social choice rule be:
      *   **(Nash-like):** Invariant under independent positive affine transformations of individual utilities (`u_i' = α_i u_i + β_i`, `α_i > 0`), implying only ratios of utility *differences* from `d` matter? (Prioritizes Scale Invariance)
      *   **(KS-like):** Such that if `X` expands to `X'` in a way that increases the maximum utility achievable by individual `i` without decreasing the maximum achievable by any other individual, then `i` should not be worse off in the choice from `X' ∩ X` (compared to the choice from `X`)? (Prioritizes Individual Monotonicity relative to opportunity expansion)"
  *   **The Limit:** The **necessity of the `d` parameter and the reliance on cardinal/comparable utilities** is the primary limit of *your standard framework* for capturing this dispute directly. Without embedding the status quo (`d`) and accepting cardinality/comparability, the specific normative tension between SI and IM loses its grounding. The dispute is inherently about bargaining *from a threat point* using cardinal welfare information. Classical ordinal, alternative-based welfare aggregation without a status quo struggles to replicate this structure. The residue (`d`, `u^*`, cardinality) is essential to the normative disagreement between Nash and KS.
