  Structure-wise, I'll break the 90 minutes into timed segments: intro (5 mins), truth-aptness basics (15), Peirce (20), James (20), archivist case study (20), recap and Q&A (10). Each concept builds on the last, with misconceptions addressed in their respective sections. 

  The example must exclude factors like financial motives or emotional ties to ensure the debate stays philosophical. Including the ledger's ambiguity and archivists' principled stances highlights how methods diverge without personal bias. This sets up the core conflict cleanly.

