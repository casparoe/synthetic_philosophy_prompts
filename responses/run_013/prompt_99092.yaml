answer: |-
  Here’s a structured 90-minute teaching plan focused on the Peirce-James disagreement, designed to prevent conceptual collapse and target common misconceptions. The archivist example serves as the anchor.

  **Session Goal:** Distinguish truth-aptness (condition) from criteria of truth (method/justification) via Peirce’s "convergence" vs. James’s "beneficial consequences."

  **Explicit Refusals (State upfront):**
  1.  **Metaphysics of Truth:** No deep dive into correspondence, coherence, or deflationary theories.
  2.  **Later Pragmatists:** Dewey, Rorty, etc., are excluded.
  3.  **Technical Jargon:** Terms like "fallibilism," "scholastic realism," or "humanism" won't be unpacked beyond essentials.
  4.  **Resolution:** We won't decide who is "right"; we explore the *structure* of their disagreement.
  5.  **Other James/Peirce Ideas:** Focus solely on their conceptions of truth relevant to this dispute.

  **The Core Sequence (90 mins):**

  1.  **Groundwork: Truth-Aptness (Condition) vs. Justification (Criterion) (15 mins)**
      *   **Activity:** Pose: *"What makes a statement *capable* of being true or false (truth-apt)?"* vs. *"How do we *find out* if it's true or false (justification/criterion)?"*
      *   **Clarification:** Use simple examples:
          *   Truth-Apt: "The cat is on the mat." (Makes a claim about the world) vs. "Ouch!" (Expression, not truth-apt).
          *   Criterion/Justification: *How* do you know? (Look, ask someone, camera footage).
      *   **Key Point:** Emphasize these are distinct questions. Knowing *how* to check doesn't *define* what truth *is*. A statement is truth-apt *before* we investigate.
      *   **Misconception Head-Off:** Explicitly state: "We're *not* talking about 'true for me' vs. 'true for you' yet. We're setting up the basic framework."

  2.  **Introduce Peirce: Truth as Ultimate Consensus (20 mins)**
      *   **Core Idea:** "Truth is the opinion which is fated to be ultimately agreed to by all who investigate." (Peirce)
      *   **Focus:** Truth is a *property* of a belief defined by its *ultimate* outcome under *ideal, unlimited inquiry* (scientific method applied indefinitely). It's *discovered*, not created.
      *   **Criterion (Implied):** The *best method* we have *now* for getting closer to that ultimate opinion (scientific inquiry, logic, evidence).
      *   **Misconception Head-Off (NOW):** "Peirce is **NOT** saying truth is whatever people *currently* agree on (mere consensus). He's talking about an ideal endpoint of perfect investigation. Current agreement might be wrong! He's also **NOT** saying true beliefs have no practical consequences; he's saying that convergence *defines* truth."
      *   **Why not Consensus Theory?** Consensus is the *result* of ideal inquiry defining truth, not the *definition itself* based on any actual vote.

  3.  **Introduce James: Truth as What Works (20 mins)**
      *   **Core Idea:** "The true is the name of whatever proves itself to be good in the way of belief, and good, too, for definite, assignable reasons." (James)
      *   **Focus:** Truth is a *property* a belief *gains* when it proves useful, satisfying, or expedient in guiding our actions and connecting experiences. It's *made* true through its successful workings. Usefulness is the *criterion* and part of the *definition*.
      *   **Criterion:** Does believing it lead to beneficial consequences (practical, intellectual, emotional)? Does it "work"?
      *   **Misconception Head-Off (NOW):** "James is **NOT** saying *any* useful belief is true ('cash value' is nuanced). He means beliefs that successfully guide us through experience, connect ideas fruitfully, and satisfy our intellectual and practical needs over the long run. He's also **NOT** advocating wishful thinking; beliefs must face 'sensible reality'."
      *   **Why not Simple Usefulness?** James ties usefulness to experiential verification and coherence over time, not momentary gratification.

  4.  **The Archivist Case Study (20 mins)**
      *   **Present the Scenario:** A water-damaged ledger, one crucial entry obscured. Archivists disagree on whether it recorded a debt owed by A to B.
          *   **Archivist 1 (Peircean):** "The *truth* is what an ideal, unlimited investigation by professional archivists, historians, and scientists (using all possible techniques: spectral imaging, context analysis, ink chemistry, etc.) *would* conclusively determine about the original entry. Our best *current* evidence suggests [X], but we might be wrong. Truth is fixed by that ideal endpoint."
          *   **Archivist 2 (Jamesian):** "Given the damage, the *truth* *is* what belief best settles the estate *now* justly and efficiently. Believing there *was* a debt allows us to distribute assets fairly to B's heirs based on surrounding context, preventing costly legal battles and family strife. This belief 'works' for resolving this practical situation satisfactorily."
      *   **What the Example MUST Include:**
          *   **Ambiguity:** Genuine uncertainty about the original fact (damaged evidence).
          *   **Different Goals:** Seeking the ideal historical fact (Archivist 1) vs. achieving a beneficial practical resolution (Archivist 2).
          *   **Focus on "Truth" Claim:** Both frame their conclusion as the *truth* about the debt.
          *   **Principled Stances:** Each archivist is arguing from a philosophical position, not just personal opinion or expediency.
      *   **What the Example MUST Exclude:**
          *   **Emotional Bias/Personal Gain:** Archivists aren't heirs; their stance is philosophical/methodological.
          *   **Financial Motive:** Their job is interpretation, not personal profit.
          *   **Easy Resolution:** No hidden clue makes the answer obvious later.
          *   **Moral Relativism:** The disagreement is about the *nature of truth* in this case, not subjective morality.
      *   **Why Better Than Religious/Observation Examples:**
          *   **Religious Belief:** Too emotionally/personally charged; "usefulness" is complex (comfort vs. doctrine); hard to discuss "ideal inquiry" neutrally. Prone to conflating justification with personal faith.
          *   **Plain Observation ("Cat on Mat"):** Makes Peirce & James seem to agree (both would use looking as a criterion). Hides the *definitional* difference that emerges when evidence is ambiguous *and* practical consequences diverge from ideal inquiry. Too simple to reveal the core disagreement.
          *   **Archivist Example:** Neutral subject matter, clear practical stakes distinct from the "fact of the matter," highlights *definition* (what *is* truth here?) vs. *method* (how do we find it?), forces confrontation with ambiguity.

  5.  **Synthesizing the Disagreement & Combating Relativism (10 mins)**
      *   **Activity:** Facilitator asks: "Is Archivist 2 (Jamesian) saying the debt *really existed* if it's useful to believe it did? What would Archivist 1 (Peircean) say?" Contrast:
          *   Peirce: Truth (the actual past fact) is *fixed* by the ideal inquiry. Beliefs that "work" now might be false guides. Truth is independent of *our* needs.
          *   James: Truth (a property of the belief) *is made* by its successful consequences *in this situation*. If believing in the debt *works* best for settling the estate justly and efficiently, then, *for that purpose*, it *is* true.
      *   **Misconception Head-Off (NOW - Relativism):** "Pragmatism (especially James) is **NOT** relativism. James isn't saying 'true for you, true for me.' He's saying a belief is true *if it works universally for anyone in that specific experiential situation with those specific goals*. Peirce is explicitly anti-relativist; truth is singular and fixed by ideal inquiry. Both seek objective standards, but define them differently." Emphasize James's "for definite, assignable reasons" and Peirce's "fated" convergence.

  6.  **Recap & Diagnostic Question (5 mins)**
      *   **Recap:** Briefly restate the distinction Truth-Aptness (Condition) vs. Criterion/Definition. Peirce: Truth = Ideal Convergence (Condition/Definition). James: Truth = Successful Working (Criterion becomes part of Definition).
      *   **Diagnostic Question (Written or Discussed):**
          > *"Could both archivists be using valid methods for their purposes (Peirce's best current inquiry, James's practical benefit), yet still fundamentally disagree about what the* ***truth*** *is concerning the debt? Why or why not?"*
      *   **What Reveals Understanding (Not Memorization):**
          *   **Yes:** They should recognize Peirce defines truth by ideal convergence (a fixed fact), while James defines it by beneficial consequences in a context. Their methods target *different conceptions of truth itself*. Agreement on *what happened* isn't guaranteed even with good methods because they define "truth" differently for this case.
          *   **No/Memorized Slogans:** Answer focuses *only* on methods ("one uses science, one uses practicality") without connecting methods to the *fundamentally different definitions* of truth they serve. Confuses justification with the nature of truth.

  **Key Predictable Misconceptions & When to Head Them Off:**

  1.  **James: Truth = Simple Usefulness/Wishful Thinking:** Head off **immediately when introducing James** (Point 3). Emphasize "good for definite, assignable reasons," connection to experience, long-term satisfactoriness, and facing reality. Contrast with the archivist's *principled* "working" for estate settlement, not personal gain.
  2.  **Peirce: Truth = Current Consensus:** Head off **immediately when introducing Peirce** (Point 2). Hammer home "fated," "ultimate," "ideal unlimited inquiry." Stress that current methods are fallible *means* towards that end, not the end itself.
  3.  **Pragmatism = Relativism:** Head off **during Synthesis** (Point 5), using the archivist example to show both seek objectivity (Peirce: fixed convergence; James: publicly verifiable "working" in context). State explicitly: "This is not 'anything goes'."

  **Why This Sequence Works:**

  1.  **Builds Foundations:** Starts with the crucial Truth-Aptness/Criterion distinction.
  2.  **Isolates Concepts:** Introduces Peirce and James *separately*, defining core ideas and preempting major misreads upfront.
  3.  **Applies with Anchor:** Uses the carefully crafted, neutral archivist example to force application and highlight the *definitional* clash in a messy, real-world scenario where evidence is incomplete and stakes differ.
  4.  **Explicit Contrast:** Synthesis phase directly pits the two views against each other using the example.
  5.  **Targets Relativism Explicitly:** Addresses the most common and damaging misreading head-on late, after both views are understood.
  6.  **Assessment Focuses on Disagreement:** The diagnostic question probes understanding of the *disagreement's nature* (definition of truth), not just the slogans.

  This plan provides the structure and tools to guide non-specialists through this nuanced debate, using your effective archivist scenario to make the abstract concrete and prevent key collapses. Good luck!
