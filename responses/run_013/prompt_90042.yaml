  Okay, the user is deep into negative utilitarianism, specifically the lexical-threshold version. They want a framework to evaluate theories on this. Let me start by recalling the core idea: there's a suffering threshold where no amount of pleasure can justify crossing it. The user needs desiderata—what such a theory must achieve.

  First, the user mentioned specific cases. The trade-off between preventing moderate pain for one versus immense pleasure for many. Also, gambles with tiny risks of agony. So, the theory must handle these scenarios. The threshold's location is crucial. Where is it? Extreme torture seems obvious, but what about chronic pain? And does the threshold shift with population size? If so, how?

  Then, distinctions: intensity vs. duration. Is a long mild pain worse than a short intense one? Are pain and pleasure on the same scale? Or is pain inherently worse? The threshold must be sharp, not vague, to avoid slippery slopes. Is it objective or based on attitudes? That affects realism.

  Consistency is another big part. Lexical preferences usually break real-valued utility functions. Continuity is a problem because no amount of pleasure compensates for crossing the threshold. How does choice under risk work here? Standard expected utility might not apply.

  The user suspects conflicts, especially between lexicography and representability. They're right. Continuity requires trade-offs, but lexical thresholds forbid them. That's a major clash. Also, the threshold's location being non-arbitrary—defending why it's exactly there without vagueness is tough.

  The user also wants to know which requirement is the biggest hurdle. Representability seems key. Without a utility function, standard decision theory fails. That probably rules out many theories right away. The gamble case is tricky too. If the threshold is absolute, even infinitesimal risks could make any pleasure-inducing act unacceptable. That's paralyzing.

  Underlying needs? The user might be preparing for academic work, maybe teaching or writing. They need a structured way to critique existing theories. They might also be seeking a defensible version of lexical NU that avoids common pitfalls. Unspoken: perhaps frustration with current theories not handling edge cases or being impractical. They want clarity on what's feasible, possibly to guide their own research or arguments in class.
answer: |-
  Here's a breakdown of the core desiderata for a lexical-threshold negative utilitarian (LTNU) theory, structured as requested. The core challenge lies in reconciling the absolute prohibition implied by the threshold with the need for practical decision-making and theoretical coherence.

  **I. Cases It Must Get Right (Normative Intuition Capture)**

  1.  **The Absolute Prohibition Case:**
      *   **Case:** Choosing between (A) Preventing *one* instance of suffering *above the threshold* (e.g., 10 minutes of excruciating torture) and (B) Bestowing an *astronomically large* amount of pleasure on *any number* of beings (e.g., a billion years of ecstasy for every human who ever lived or will live).
      *   **Requirement:** The theory *must* mandate choosing (A). Preventing the above-threshold suffering is lexically prior; no amount of pleasure can compensate for it.
      *   **Purpose:** Embodies the core tenet of lexical threshold NU. Failure here means abandoning the view.

  2.  **The "Easy Trade-Off" Case:**
      *   **Case:** Choosing between (A) Preventing *one* instance of suffering *below the threshold* (e.g., a mild headache for 5 minutes) and (B) Bestowing a *significant* amount of pleasure on *many* beings (e.g., preventing moderate chronic pain for a million people for a year).
      *   **Requirement:** The theory *must* allow choosing (B). Below-threshold pains can be traded off against sufficient quantities of pleasure (or prevention of other below-threshold pains).
      *   **Purpose:** Avoids absurd absolutism where any pain, however trivial, trumps any pleasure, however vast. Ensures the theory has practical applicability for most real-world decisions.

  3.  **The Low-Probability High-Stakes Gamble Case:**
      *   **Case:** An action offers a near-certainty (e.g., 1 - 10⁻¹⁵) of bestowing a large amount of pleasure (e.g., a year of bliss for a million people) but carries a tiny probability (e.g., 10⁻¹⁵) of causing suffering *above the threshold* (e.g., a minute of agony for one person).
      *   **Requirement:** The theory *must* forbid taking this gamble. Any non-zero probability of causing above-threshold suffering, no matter how small, lexically dominates any finite benefit in pleasure or below-threshold pain prevention.
      *   **Purpose:** Tests the absoluteness of the lexical priority under risk. Failure (allowing the gamble) risks collapsing the threshold into a mere weighting.

  4.  **The Threshold Location & Population Sensitivity:**
      *   **Case:** Where precisely is the threshold located (intensity/duration)? Does the minimum "justifying quantity" of pleasure needed to offset a *below*-threshold pain scale with population size? (e.g., Does preventing a headache for 1 person require less total pleasure to offset than preventing the same headache for 1 billion people?).
      *   **Requirement:**
          *   The theory must provide a *principled, non-arbitrary* account of where the threshold lies (e.g., "suffering intense enough to cause irreversible trauma," "suffering that makes life not worth living").
          *   The theory must specify whether the threshold itself (*not* the trade-offs below it) is sensitive to population size. (e.g., Does the *definition* of "agony" change if there are more people? Usually, the answer *should* be no).
          *   The theory must specify how trade-offs *below* the threshold handle aggregation (e.g., Total Pleasure? Average? Something else?).
      *   **Purpose:** Avoids arbitrariness in the threshold's definition and clarifies how aggregation works for sub-threshold states. Population sensitivity of the threshold itself is generally seen as undesirable.

  **II. Distinctions It Must Respect (Conceptual Clarity)**

  5.  **Intensity vs. Duration:**
      *   **Consideration:** Is the threshold defined purely by peak intensity? By intensity integrated over time (area under the curve)? Can a long period of moderate suffering ever cross the threshold that a short, sharp agony doesn't?
      *   **Requirement:** The theory must clearly specify the relationship between intensity and duration for defining the threshold state. (e.g., Is it peak intensity that matters, or can duration push sub-threshold intensity over the line?).
      *   **Purpose:** Ensures precise definition of the prohibited state. Ambiguity here creates loopholes or inconsistencies.

  6.  **Pain vs. Pleasure (Scale & Symmetry):**
      *   **Consideration:** Are pain and pleasure symmetrical opposites on a single scale? Or is pain inherently "weightier" than pleasure? Is the disvalue of pain above the threshold fundamentally different in kind, not just degree, from the value of pleasure?
      *   **Requirement:** The theory must clarify its stance on the nature of the scales. LTNU strongly suggests **asymmetry** – pain above the threshold is *incommensurably* worse than any pleasure. It must also clarify if the *same* scale/metric is used for defining the threshold intensity and measuring sub-threshold pains/pleasures.
      *   **Purpose:** Underpins the justification for lexical priority. Symmetry makes lexical priority harder to justify.

  7.  **Sharp vs. Vague Threshold:**
      *   **Consideration:** Is the threshold a perfectly sharp line (e.g., suffering at level 7.0+ is prohibited, 6.999 is not)? Or is there a vague border region (suffering between 6.5-7.5 is indeterminately above/below)?
      *   **Requirement:** The theory must state whether the threshold is sharp or vague. If vague, it must explain how decisions are made near the border. (A sharp threshold is conceptually simpler but potentially less realistic; vagueness adds complexity).
      *   **Purpose:** Addresses the "slippery slope" concern and the practical reality of measuring experiences.

  8.  **Objective Threshold vs. Attitudinal Threshold:**
      *   **Consideration:** Is the threshold a fact about the inherent properties of certain conscious states (objective)? Or is it defined by attitudes (e.g., suffering that *any rational agent* would not accept any amount of pleasure to endure, or suffering that makes life *not worth living*)?
      *   **Requirement:** The theory must ground the threshold in either objective phenomenology or a specific account of rational/attitudinal states. The grounding must support the lexical priority claim.
      *   **Purpose:** Determines the metaphysical status of the threshold and its justifiability.

  **III. What It Must Stay Consistent With (Theoretical Coherence & Practicality)**

  9.  **Representability by a Real-Valued Utility Function (Continuity):**
      *   **Consideration:** Standard decision theory relies on representing preferences via a real-valued utility function satisfying axioms like continuity. Continuity implies that for any outcomes A>B>C, there's a probability p such that [pA, (1-p)C] is indifferent to B.
      *   **Requirement:** **Conflict Flagged!** Lexical priority inherently violates the **Continuity Axiom**. If A (prevent torture) > B (massive bliss) > C (status quo), there is *no* probability p<1 such that [p*A, (1-p)*C] is indifferent to B, because the slightest chance of A forces choosing the gamble to avoid the risk of failing to prevent torture. A real-valued representation is **impossible** for strict lexical orderings.
      *   **Purpose:** Highlights the fundamental theoretical tension. LTNU forces a choice: relax strict lexicography (e.g., introduce vagueness, infinitesimals) or abandon standard utility representation and continuity.

  10. **Choice Under Risk:**
      *   **Consideration:** How does the theory rank actions with probabilistic outcomes, especially involving potential above-threshold suffering?
      *   **Requirement:** The theory *must* provide a decision procedure for risky choices. Given the conflict with continuity (9), this requires a non-standard approach:
          *   **Absolute Prohibition:** Any action with *any non-zero probability* of causing *any* above-threshold suffering is forbidden, regardless of benefits (as in Case 3). This is paralyzing.
          *   **Threshold Probabilities:** Define a *de minimis* probability below which the risk is ignored. (Raises "where to draw *this* line?" problem).
          *   **Multi-Dimensional Representation:** Use vectors or other structures instead of scalars.
          *   **Infinitesimals:** Use non-standard analysis (hyperreals).
      *   **Purpose:** A theory unusable for real-world decisions involving uncertainty is practically inadequate. The Gambling Case (3) is a critical test.

  11. **Compensation & Currency:**
      *   **Consideration:** Can an individual who experiences above-threshold suffering *ever* be compensated? If so, with what? (Pleasure? Below-threshold pain reduction? Something else?).
      *   **Requirement:** The theory *must* explicitly state its stance. **Core LTNU Implication:** Above-threshold suffering **cannot be compensated for** *within the utilitarian calculus*. That's the point of lexical priority. Compensation *for the individual* might be argued on other grounds (e.g., fairness, restoration), but it doesn't "cancel out" the disvalue incurred. The "currency" question below the threshold must also be specified (pleasure? absence of pain?).
      *   **Purpose:** Reinforces the absolute nature of the prohibition. Allowing compensation risks collapsing the view.

  **Flagged Conflicts:**

  *   **The Major Conflict: (9) Representability/Continuity vs. Strict Lexical Priority (Cases 1 & 3).** This is the core theoretical hurdle. Strict lexical orderings are fundamentally incompatible with the continuity axiom required for real-valued utility functions. Any viable LTNU theory must either:
      *   **Abandon Strict Lexicography:** Introduce vagueness at the threshold (7), a *de minimis* risk rule (10), or infinitesimal trade-offs.
      *   **Abandon Real-Valued Utility:** Adopt a multi-dimensional or qualitative (e.g., "satisfices" first on avoiding above-threshold suffering, optimizes below that) decision framework.
  *   **Potential Conflict:** **Threshold Definition (4 & 5) vs. Non-Arbitrariness.** Defining a sharp, non-arbitrary threshold point (e.g., intensity level 7.0) based on phenomenology (8) is extremely challenging. Vagueness (7) helps realism but hurts precision and risks undermining lexical priority near the border.

  **The Biggest Knockout Requirement:**

  *   **Representability by a Real-Valued Utility Function (Requirement 9 / Continuity Conflict)** is the most potent eliminator of naive LTNU formulations. It immediately exposes the fundamental incompatibility at the heart of the view. Any theory that naively asserts strict lexical priority without addressing how decisions are made under risk or how preferences are represented will fail this basic test of decision-theoretic coherence. **The Gambling Case (Case 3)** is the most common practical instantiation of this conflict that trips up popular candidates – they either implausibly forbid all non-zero risk actions or implausibly allow very high-stakes gambles for sufficient benefit, violating the lexical intuition. Overcoming this without abandoning the core lexical insight requires significant theoretical innovation (e.g., infinitesimals, multi-dimensional utilities, *de minimis* rules).
