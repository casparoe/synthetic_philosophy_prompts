prompt: |-
  I recently read a short encyclopedia-style overview of al-Ghazālī's occasionalism and its treatment of causation, and I want a careful audit of it before I rely on it. The piece is not by a specialist, but it reads as competent. Here is its substance, in its own words as I noted them down:

  "Al-Ghazālī's occasionalism is his answer to a puzzle about the natural sciences. He held that fire does not burn cotton, and that striking a match does not produce a flame: the apparent connection between a cause and its effect is an illusion, and in reality God creates every event directly, moment by moment. What we call the laws of nature are simply the habits God has chosen to follow, so the order of the world is a matter of divine custom rather than of any necessity in things. Because he denied that causes bring about their effects, he also denied that we can ever genuinely know what will happen next; our expectation that the sun will rise tomorrow is, strictly speaking, groundless. His motive was to safeguard the possibility of miracles: if there is no necessary connection between causes and effects, then a miracle is not a special violation of nature but simply another instance of God's direct action, no more miraculous than the burning of cotton. In all this he anticipates Hume, who likewise held that we never observe any necessary connection between cause and effect."

  I suspect the last sentence is too tidy, and that the part about our expectations being groundless cannot be quite right, but I can't say why. I would like you to tell me what to trust.

  Please audit the passage claim by claim. For each distinct claim, say what al-Ghazālī — and, where it matters, the scholarship on him — would accept, what would make a specialist wince, and what is straightforwardly wrong; and keep separate the points on which the scholarship genuinely divides from those on which there is no real dispute. I care about the difference between claims that are accurate, claims that are defensible simplifications, claims that mislead by conflating two things the view keeps apart, and claims that are simply false; and for each I want to know how a defender of al-Ghazālī would push back. If the passage contains an error I have not flagged that changes how I should read the rest, add a row for it.

  Then tell me whether the passage's overall conclusion — that al-Ghazālī's position is essentially Hume's — survives once the errors are corrected, or whether the comparison obscures more than it reveals.

  Format: lead with a one-sentence bottom-line verdict on how reliable the passage is overall, then give me a table with one row per distinct claim in the passage and the following columns:

  - Claim: a short restatement of the claim, in my words or the passage's, quoting no more than a few words.
  - Verdict: exactly one of Accurate; Fair simplification; Misleading; Wrong; Contested.
  - What is actually the case: al-Ghazālī's position, or the state of the scholarship, stated precisely.
  - How a defender would object: how someone sympathetic to al-Ghazālī would respond to the passage's way of putting it.
  - Error type: if the verdict is not Accurate, name the specific slippage — overstatement, conflation of two claims the view keeps apart, a standard objection presented as a refutation, a technical term used in its everyday sense, anachronism — or write "none".

  After the table, give one short paragraph on the Hume comparison and one on the single most important thing the passage leaves out.
