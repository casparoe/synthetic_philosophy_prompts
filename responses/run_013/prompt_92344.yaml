answer: |-
  ## Sestina for the Ninth Objection

  The engineer constructs the sealed-off **room**,
  A neutral space for doubt to take its course.
  He shuffles symbols like a shuffled **card**,
  Prepares to tally every single **guess**,
  To watch the hidden, reasoning **machine**
  Engage the hidden, questioning **mind**.

  But what if thought escapes the bounded **mind**?
  What signal pierces the protected **room**?
  Statistics whispered of a human **machine**
  Able to sense the value of the **card**
  Before the conscious act to **guess**,
  A channel barred to steel and wire's **proof**.

  The protocol demands a stricter **proof**.
  It cannot trust the porous human **mind**.
  The test requires a shielded **room**,
  Impenetrable. Even the marked **card**
  Must hide its face beyond a conscious **guess**.
  One player, built of gear and spark, the **machine**,

  Is fixed by laws that forged the **machine**.
  Its future moves, a calculable **proof**.
  Its patterned choice, a predetermined **guess**
  For every symbol, every suit. The **mind**
  Of flesh, however, facing that same **card**,
  Might breach the silence of the sealed-off **room**.

  One channel open in the testing **room**:
  The human may possess what lacks the **machine**.
  The pattern fixed within the shuffling **card**
  Becomes, for one, a thing beyond strict **proof**,
  A silent knowing in the waiting **mind**,
  Not chance, not logic, but a stolen **guess**.

  The protocol records each stated **guess**.
  It seals the players in their separate **room**.
  It notes the output of the human **mind**,
  The calculated answer of the **machine**.
  It seeks in numbers something like a **proof**,
  Blind to the symbol on the hidden **card**.

  But what is measured by the hidden **card**?
  What certainty resides within the **guess**?
  The test designed to yield conclusive **proof**
  Depends upon the sanctity of **room**
  And glass. The disciplined, predictable **machine**
  Against the wild card of the human **mind**.

  The **machine** lacks the channel. Does the **mind**?
  The **card** may whisper, breaking from the **room**.
  One **guess** may cheat, confounding final **proof**.
