prompt: |-
  I'm a backend engineer, no philosophy background at all, but I've been reading a lot of mech interp stuff lately and I keep getting stuck on the same question: when someone says "the model represents the concept X in layer 7," what does that even mean, and how would we know? Everyone seems to have their own private standard. Someone trains a linear probe on the activations, it decodes the label with 95% accuracy, and they say the concept is there. Someone else says ok but I can train a probe on a randomly initialized network and get 80% too, so what did you actually show. Someone else has a steering vector that flips the behavior when you add it, and says that's the real evidence because it's causal. And then there's superposition, where there are way more features than dimensions so nothing has its own direction, and polysemantic neurons that light up for like five unrelated things, and the annoying fact that I've trained the same tiny net twice with different seeds and it solves the task with what looks like a totally different internal code. So before I read any more of these papers I want the spec first.

  Can you write me the desiderata -- what any adequate theory of "this network represents X" has to actually deliver? Not a definition, a checklist. Concretely I want: which cases it has to get right (the probe that decodes but the network never seems to use it; the probe on a random net; the steering vector that works and the random vector that also kind of works; superposition; polysemantic units; two nets that behave identically but code it differently; and the case where a net solves a task in a way I didn't expect and there's no ground truth to compare against), which puzzles it has to dissolve rather than just talk around, and which distinctions it can't collapse -- like representing X versus merely carrying information about X, representing versus computing, and representing X versus representing X-under-some-description. For each requirement give me the actual case or consideration that motivates it, so I can tell which ones are real constraints and which are just one camp's taste. Also mark which ones you think are non-negotiable and which are preferences.

  The part I most want is where the list turns on itself: are any of these jointly unsatisfiable? I have a suspicion that the requirement that a representation be individuated by its causal role in the network clashes with the requirement that we be able to say what it's *about* independent of the network's quirks, but I don't have the vocabulary to say why. And tell me which single requirement does the most to kill off the popular views on offer, because that's the one I'll use to filter everything I read next. Skip scoring the actual theories, I'll do that myself once I have the criteria.
reasoning: |-
  We are constructing a checklist of desiderata for an adequate theory of representation in neural networks. The goal is to specify what such a theory must account for, which cases it must handle, and what distinctions it must preserve.

  The cases and considerations provided:

  1. **Probe that decodes but the network never uses it**: A linear probe on activations can decode a concept with high accuracy, but the concept isn't actually used by the network for its task. (Motivation: We need to distinguish between information that is merely present and information that is functionally relevant.)

  2. **Probe on a random net**: A linear probe can be trained on a randomly initialized network (that hasn't been trained on the task) and still achieve non-trivial accuracy. (Motivation: This challenges the idea that the presence of decodable information in a trained network is evidence of representation, because it can occur without training.)

  3. **Steering vector that works vs. random vector that also kind of works**: A steering vector (a direction in activation space that, when added, changes the model's behavior in a predictable way) is taken as causal evidence. However, random vectors might also cause some changes. (Motivation: We need to distinguish between causal interventions that are specific to the concept and non-specific disturbances.)

  4. **Superposition**: The network has more features (concepts) than dimensions in a layer, so features are represented in an entangled way. (Motivation: The theory must account for representations that are not axis-aligned and may be distributed.)

  5. **Polysemantic neurons**: A single neuron activates for multiple unrelated concepts. (Motivation: The theory must account for the fact that a single unit may not correspond to a single concept.)

  6. **Two nets that behave identically but code it differently**: Two networks trained on the same task with different random seeds have different internal structures. (Motivation: The theory must allow for multiple realizability and not be overly dependent on the specific implementation.)

  7. **Net solves a task in an unexpected way without ground truth**: The network solves a task, but we don't have a ground truth to compare against for the internal representations. (Motivation: The theory must provide a way to identify representations without relying solely on external labels.)

  Distinctions to preserve:

  - **Representing X versus merely carrying information about X**: The network must not only have information about X but also use it in a way that constitutes representation.

  - **Representing versus computing**: The representation is a state that stands for something, while computation is the process that manipulates that state.

  - **Representing X versus representing X-under-some-description**: The same representational state might be about X under one description but not another (e.g., water vs. H2O).

  Desiderata Checklist:

  1. **Functional Relevance**: The representation must play a causal role in the network's computation. This addresses the case of the probe that decodes but the network never uses it. (Non-negotiable: Without functional relevance, we have mere information, not representation.)

  2. **Non-accidental Information**: The representation must be such that it is not merely an artifact of the architecture or random initialization. This addresses the probe on a random net. (Non-negotiable: If the information is present without learning, it is not a learned representation of the concept.)

  3. **Causal Specificity**: Interventions (like steering vectors) that are intended to manipulate the representation must change the network's behavior in a way that is specific to the concept. Random vectors should not have the same effect. (Non-negotiable: Without specificity, we cannot attribute the effect to the concept.)

  4. **Compatibility with Superposition**: The theory must explain how concepts can be represented even when the number of concepts exceeds the number of dimensions. (Non-negotiable: Superposition is a fundamental property of neural networks.)

  5. **Compatibility with Polysemanticity**: The theory must account for neurons that respond to multiple unrelated concepts. (Non-negotiable: This is a common phenomenon.)

  6. **Multiple Realizability**: The theory must allow that the same concept can be represented in different ways in different networks. (Non-negotiable: This is observed in practice.)

  7. **Operational without Ground Truth**: The theory must provide a way to identify representations even when we don't have external labels or ground truth. (Preference: While ground truth is helpful, a theory should not require it.)

  8. **Distinguish Representation from Information**: The theory must provide a criterion to distinguish when the network is using the information as a representation vs. when it is merely present. (Non-negotiable: This is central to the concept of representation.)

  9. **Distinguish Representation from Computation**: The theory must clarify the difference between the state that represents and the process that uses that state. (Non-negotiable: This is a fundamental distinction.)

  10. **Aboutness**: The theory must account for what the representation is about, including the possibility of different descriptions. (Non-negotiable: Without aboutness, we don't have representation.)

  Joint Unsatisfiability? The main tension is between:

  - **Causal Role Individuation** (the representation is defined by its causal role in the network) and 
  - **Aboutness Independence** (the representation must have content that is about something external and independent of the network's quirks).

  This is because the causal role is tied to the specific network implementation, while aboutness requires a connection to the external world that is independent of the implementation. A theory that ties representation too tightly to causal role might fail to capture the aboutness that is independent of the network, and vice versa.

  The Requirement that Does the Most Damage: **Non-accidental Information**. This requirement kills off any theory that relies solely on the decodability of information (via linear probes, for example) because it shows that such decodability can occur without learning and without being a representation of the concept. This is the case of the probe on a random network. Therefore, any theory that equates representation with decodability fails this requirement.

  Checklist Summary (Desiderata):

  1. **Functional Relevance**: The concept must be used by the network in its computations, not just decodable. (Case: probe decodes but network doesn't use it; Non-negotiable)

  2. **Non-accidental Information**: The representation must be learned and not an artifact of random initialization. (Case: probe on random net; Non-negotiable)

  3. **Causal Specificity**: Interventions must produce concept-specific changes. (Case: steering vector vs. random vector; Non-negotiable)

  4. **Superposition Compatibility**: The theory must account for overcomplete bases. (Case: superposition; Non-negotiable)

  5. **Polysemanticity Compatibility**: The theory must account for neurons that fire for multiple concepts. (Case: polysemantic neurons; Non-negotiable)

  6. **Multiple Realizability**: The same concept can be represented differently in different networks. (Case: two nets with same behavior, different codes; Non-negotiable)

  7. **Ground Truth Independence**: The theory must work even without external labels. (Case: unexpected solution without ground truth; Preference)

  8. **Information vs. Representation**: Must distinguish mere information from functional representation. (Distinction; Non-negotiable)

  9. **Representation vs. Computation**: Must clarify the difference. (Distinction; Non-negotiable)

  10. **Aboutness under Description**: Must handle different ways the same state can be described. (Distinction; Non-negotiable)

  The requirement that is the most damaging to popular views is **Non-accidental Information** because it undermines the common practice of using linear probes as evidence of representation without further validation.
answer: |-
  Below is a structured checklist of desiderata for an adequate theory of "this neural network represents concept X." It addresses your cases, required distinctions, and potential tensions. I've organized it into three sections: **Core Requirements** (non-negotiable for any plausible theory), **Preference Constraints** (important but negotiable based on theory goals), and **Tensions & Meta-Constraints** (where desiderata may conflict or self-reflect). Each item includes:  
  - **The requirement** (what the theory must deliver).  
  - **Motivating case/consideration** (the real-world observation that forces this requirement).  
  - **Non-negotiable (✓) or Preference (△)** flag.  
  - **Why it matters** (consequences of ignoring it).  

  I conclude with the **joint unsatisfiability** concern you raised and the **most damaging requirement** for popular views.  

  ---

  ### **Core Requirements** (Non-negotiable: ✓)  
  These ensure the theory isn't vacuously true or practically useless. Fail any, and the theory collapses under real-world scrutiny.  

  1. **Functional Relevance**  
     - **Requirement**: The theory must distinguish "the network *uses* X in computation" from "X is merely *decodable* from activations."  
     - **Motivating case**: A probe decodes "cat" from layer 7 with 95% accuracy, but ablating these activations doesn't affect cat-related outputs (e.g., the network ignores it).  
     - **✓ Non-negotiable**: Without this, you can't separate signals from noise.  
     - **Why**: Proves representation isn't just about information storage but *causal contribution* to behavior.  

  2. **Non-Accidental Generalization**  
     - **Requirement**: The theory must show the representation is *learned and generalizable*, not an artifact of architecture/randomness.  
     - **Motivating case**: Training a probe on a *randomly initialized* network yields 80% accuracy for "X," implying the architecture leaks information without learning.  
     - **✓ Non-negotiable**: Rules out trivial "information is present" claims.  
     - **Why**: Forces the theory to explain why trained networks differ from random ones.  

  3. **Causal Specificity**  
     - **Requirement**: Interventions (e.g., steering vectors) must change behavior *specifically* for X, not arbitrarily.  
     - **Motivating case**: A steering vector for "democracy" flips model outputs to democratic bias, but a random vector also induces 50% of the change (low specificity).  
     - **✓ Non-negotiable**: Ensures interventions target the *concept*, not just activation noise.  
     - **Why**: Separates causal relevance from chaotic effects.  

  4. **Superposition Compatibility**  
     - **Requirement**: The theory must work when features exceed dimensions (e.g., 1,000 concepts in 512D space), with no dedicated "X direction."  
     - **Motivating case**: Superposition: a single activation direction encodes multiple features via sparse, non-orthogonal codes.  
     - **✓ Non-negotiable**: Ignoring this misrepresents real networks.  
     - **Why**: Forces the theory beyond simplistic "one neuron = one concept" models.  

  5. **Polysemanticity Compatibility**  
     - **Requirement**: The theory must handle neurons/activations that fire for unrelated X (e.g., "cat," "car," "CPU").  
     - **Motivating case**: A neuron activates for "striped things," "electrical systems," and "sports teams" due to polysemanticity.  
     - **✓ Non-negotiable**: Neurons aren't "concept detectors."  
     - **Why**: Prevents overinterpreting activation patterns.  

  6. **Multiple Realizability**  
     - **Requirement**: The theory must allow identical behavior with different internal codes for X (e.g., due to initialization seeds).  
     - **Motivating case**: Two tiny networks solve a task identically, but with inverted activation patterns for "X."  
     - **✓ Non-negotiable**: Otherwise, the theory is tied to implementation, not function.  
     - **Why**: Shows representation is defined by role, not structure.  

  7. **Aboutness**  
     - **Requirement**: The theory must ground what X *is* independently of network quirks (e.g., "cat" refers to real-world cats, not just logits).  
     - **Motivating case**: A network classifies "water" correctly but represents it as "H₂O" in one context and "clear liquid" in another (X-under-a-description).  
     - **✓ Non-negotiable**: Without external grounding, "representation" is circular.  
     - **Why**: Connects internal states to the external world.  

  ---

  ### **Preference Constraints** (Negotiable: △)  
  These are desirable for a *useful* theory but can be relaxed if the theory sacrifices scope for precision.  

  8. **Ground Truth Agnosticism**  
     - **Requirement**: The theory must identify X without labeled data when the network solves a task unexpectedly.  
     - **Motivating case**: A network predicts stock prices using an unanticipated "market sentiment" feature with no ground truth labels.  
     - **△ Preference**: Crucial for novel discoveries, but some theories can rely on known labels.  
     - **Why**: Enables analysis of black-box systems.  

  9. **Minimal Probe Dependence**  
     - **Requirement**: Evidence for X shouldn't rely solely on probe accuracy, but on intrinsic network properties.  
     - **Motivating case**: Probes can decode "X" from layers that don't use X for computation (Functional Relevance failure).  
     - **△ Preference**: Probes are practical, but the theory shouldn't *require* them.  
     - **Why**: Reduces circularity from probe design choices.  

  ---

  ### **Distinctions the Theory Must Preserve**  
  These prevent conceptual collapse. All are non-negotiable derivations of Core Requirements.  

  10. **Representation vs. Information Carrying**  
      - **Requirement**: Must distinguish "represents X" from "carries information about X."  
      - **Motivating case**: A layer carries information about "X" (decodable) but doesn't use it functionally (Functional Relevance).  
      - **Enforced by**: Functional Relevance + Non-Accidental Generalization.  

  11. **Representation vs. Computation**  
      - **Requirement**: Must separate the *state* (representation of X) from the *process* (how it's transformed).  
      - **Motivating case**: A steering vector for "X" changes outputs (causal), but the vector itself is a computational tool, not the representation (Causal Specificity).  
      - **Enforced by**: Causal Specificity + Aboutness.  

  12. **Representation vs. Representation-under-a-Description**  
      - **Requirement**: Must clarify if X is "water," "H₂O," or "the liquid in my cup."  
      - **Motivating case**: A network represents "water" as a functional category for thirst, but not as a chemical compound (X-under-a-description).  
      - **Enforced by**: Aboutness + Multiple Realizability (different nets can use different descriptions for same X).  

  ---

  ### **Tensions & Meta-Constraints**  
  **Joint Unsatisfiability Concern**: You suspect a tension between *causal role individuation* (representation defined by network-internal behavior) and *aboutness* (representation defined by external X). This is real:  
  - **The tension**:  
    - *Causal role* requires representation to be defined by its functional contribution to the network's outputs (e.g., ablating it breaks cat-related tasks).  
    - *Aboutness* requires representation to be grounded in external reality (e.g., "cat" means cats, not just a cluster of activations).  
  - **Why they clash**:  
    - Causal role is network-specific: Two networks with identical behavior but different internal codes (Multiple Realizability) may have no shared "cat" representation.  
    - Aboutness demands invariance: "Cat" should be the *same concept* across networks, regardless of implementation.  
  - **Resolution**: A theory must *balance* both by:  
    - Using causal role to *identify* representations (e.g., via interventions).  
    - Using external grounding to *interpret* them (e.g., "cat" refers to real cats if the network's behavior aligns with cat-related tasks in the world).  
    - **Example**: A steering vector that makes outputs "more cat-like" (causal) *and* aligns with human labels for cats (aboutness).  

  **Most Damaging Requirement**: **Non-Accidental Generalization** (✓).  
  - **Why it kills popular views**:  
    - It devastates *probe-based claims* (e.g., "95% probe accuracy ⇒ representation") by showing high accuracy can arise randomly.  
    - It forces theories to explain *why trained networks differ from random nets*, which many fail (e.g., linear probes on random nets get 80% accuracy).  
    - Theories relying solely on information-theoretic or decoding approaches (common in mech interp) cannot satisfy this without augmentation (e.g., causal checks).  
  - **Effect**: Filters out >50% of casual "representation" claims in papers. Always ask: *"Did you test this on a random baseline?"*  

  ---

  ### **Summary**  
  An adequate theory must:  
  1. Pass all **Core Requirements** (✓), especially Non-Accidental Generalization.  
  2. Resolve the **causal role vs. aboutness tension** by tethering internal states to external concepts via behavior.  
  3. Explain **edge cases** (superposition, polysemanticity, multiple realizability) without special pleading.  

  Use this checklist as a filter: When reading a paper, ask if their "representation" claim addresses each relevant desideratum. If they skip Non-Accidental Generalization or Functional Relevance, their evidence is likely circumstantial. Steering vectors alone? Check Causal Specificity. Probes? Demand Non-Accidental Generalization. No mention of superposition? Theory may be naive.  

  This won't yield a perfect definition but will expose which theories are robust and which are philosophy-by-assertion.
