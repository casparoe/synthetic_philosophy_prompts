answer: |-
  Here’s a systematic map of the knowledge account’s vulnerabilities, ranked by severity and analyzed through your four focal points. The goal is to identify **genuine defeaters**—cases where the account’s verdicts clash with stable intuitions or theoretical coherence—rather than mere inconveniences.

  ---

  ### **I. Cases That Threaten the Core Verdicts**  
  *(Ranked from most to least damaging)*

  1. **The Tacit Expert (Clinician/Instrument Reader)**  
     - **Scenario**: A clinician correctly diagnoses a rare condition via pattern recognition she cannot articulate. She asserts, "It’s disease X," but cannot justify her claim beyond "I know it when I see it."  
     - **Knowledge Account Verdict**: Assertion is improper (she lacks reflective justification; knowledge requires *ability* to exclude relevant alternatives).  
     - **Problem**:  
       - **Intuitive clash**: We expect experts to assert their reliable judgments *even when justification is inarticulable*. Denying this feels like demanding excessive intellectualization.  
       - **Independence issue**: The verdict *presupposes* a controversial internalist theory of knowledge. If knowledge can be externalist (e.g., reliabilist), she *does* know—but the account then loses its bite against weaker norms.  
     - **Defender’s Move**: Claim she *does* know (via externalist virtue). **Cost**: This collapses the account into reliabilism, ceding ground to the rival "warranted reliability" norm.

  2. **Distributed Cognition (Researcher Relying on Division of Labor)**  
     - **Scenario**: A scientist asserts, "The Higgs boson mass is 125 GeV," relying solely on her team’s data. She could not verify the calculations herself.  
     - **Knowledge Account Verdict**: Improper, unless she has "group knowledge" (contentious).  
     - **Problem**:  
       - **Collapse risk**: If "group knowledge" requires only that *someone* in the team knows, the norm reduces to "assert only if your epistemic position *relies on* knowledge." This mirrors your friend’s "warranted reliance" norm.  
       - **Social practice intuition**: Assertions based on institutional authority (e.g., journal peer review) feel appropriate—even if the asserter lacks personal knowledge.  
     - **Defender’s Move**: Deny group knowledge; claim she violates the norm. **Cost**: Makes scientific discourse systematically improper, contradicting practice.

  ---

  ### **II. The Blameworthiness Gap**  
  *(Moderate Severity: Tests Normative Force)*  

  - **Scenario**: A speaker asserts, "The bridge is safe," after thorough, expert-inspected evidence. Unbeknownst to all, corrosion hidden inside supports causes collapse.  
  - **Knowledge Account Verdict**: Assertion is defective (false, so not known).  
  - **Problem**:  
    - **Intuitive discord**: We blame the speaker only if negligent. Here, she is *blamelessly wrong*—yet the account condemns her assertion as norm-violating.  
    - **Defender’s Concession**: Williamson *embraces* this: norms can be violated blamelessly (like a "no driving through red lights" rule applies even if lights malfunction).  
  - **Cost**: Strains the analogy to social practices. In assertion, we rarely criticize blameless speakers ("you didn’t know!" feels cruel). This exposes the account as overly *strict*, potentially alienating it from actual excusing conditions.

  ---

  ### **III. The Insulation Problem**  
  *(Moderate Severity: Tests Falsifiability)*  

  - **Charge**: The account "explains away" counterexamples by either:  
    - (a) Denying knowledge (e.g., "the clinician doesn’t *really* know"), or  
    - (b) Denying assertion (e.g., "that was just a guess").  
  - **Is it unfalsifiable?**  
    - **Yes, if abused**: If *every* problematic case is dismissed via (a)/(b), the account risks vacuity.  
    - **But not inherently**: It makes unique *predictions* that rivals don’t:  
      - **Lottery assertions**: You *cannot* properly assert, "Your ticket lost," based on odds alone—even if true. Rivals (e.g., justification accounts) permit this.  
      - **Statistical bases**: Asserting "Most A are B" about a particular A (e.g., "This Finnish person is punctual") is improper without specific evidence.  
      - **Context-sensitivity**: If knowledge is context-sensitive, assertability should shift with conversational stakes (e.g., "Is the bridge safe?" in low vs. high-stakes contexts). Weaker norms lack this prediction.  
  - **Verdict**: Insulation is a **managed vice**. It becomes a problem only if defenders overuse (a)/(b) for clear assertions/knowledge. The unique predictions save it from outright unfalsifiability.

  ---

  ### **IV. Social Enforcement Disparities**  
  *(Lower Severity: Tests Normative Relevance)*  

  - **Scenario**: Two equally informed speakers assert the same claim. One (e.g., a woman in a male-dominated field) is met with "You don’t know that!" more often.  
  - **Problem**: If the *same epistemic position* draws different criticisms, is "knowledge" truly the operative norm?  
  - **Defender’s Response**: Distinguish *norm* from *enforcement*. The norm is objective: both violate it or neither do. Biased enforcement doesn’t refute the norm (just as sexist contract enforcement doesn’t refute promise-keeping norms).  
  - **Cost**: Acceptable *if* the norm explains criticism patterns *better* than rivals. But if "standing/credibility" better predicts *when* criticisms arise, the knowledge norm may be descriptively inert.

  ---

  ### **V. What Defenders Concede: The Account’s Soft Underbelly**  
  Proponents (e.g., Williamson, Hawthorne) tacitly admit:  
  1. **Tacit knowledge cases** strain internalist intuitions. If knowledge requires articulate justification, the account conflicts with expert testimony norms.  
  2. **Blameless violations** are a bitter pill—they accept this cost but admit it’s counterintuitive.  
  3. **Group assertion** lacks a settled theory. Conceding "reliance on knowledge" risks collapsing into the rival view.  
  4. **Overqualification** is a live danger: insisting "that wasn’t *really* an assertion" in clear cases (e.g., everyday conjectures) undermines credibility.  

  ---

  ### **Final Verdict: Well-Insulated but Brittle**  
  - **Insulation**: The account is *highly resilient* due to its predictive power on lotteries, statistics, and context-sensitivity.  
  - **Brittleness**: Its insulation relies on **controversial theories of knowledge** (e.g., internalism vs. externalism). If knowledge is externalist, tacit experts *know*—but then the norm loses its distinctness from reliability-based rivals. If internalist, it condemns intuitive assertions.  
  - **Ultimate Test Case**:  
    > *A climate scientist asserts, "Coastal cities will flood by 2100," based on complex models she grasps holistically but cannot detail step-by-step. Her track record is impeccable. Critics demand justification; she replies, "Trust the science."*  
    - **Knowledge Account Verdict**: Improper (without articulable justification, she doesn’t "know").  
    - **Why it stings**: Even granting externalist knowledge, *internalist* knowledge (required by some defenders) is absent. Yet we feel she *should* assert—and her assertion *advances* public understanding. **If you recoil at condemning this, the account fails your intuition**. This is where it risks disconnecting from the social function of assertion.

  **Conclusion**: The knowledge account is armored against superficial counterexamples but vulnerable at the joints where *knowledge*, *action*, and *social practice* intersect. Its survival depends on whether you prioritize theoretical elegance (its strength) over the messy norms of actual discourse (its weakness). What would move you is a case where **proper assertion requires speaking *beyond* your personal epistemic state**—precisely where your friend’s "warranted reliance" norm gains traction.
