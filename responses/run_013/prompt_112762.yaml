prompt: |-
  I am a novelist, eight months into a book whose entire technical problem is a single scene: four people in one room on a wet afternoon in 1974, and four flatly incompatible accounts of what happened there. I want the reader to finish the chapter unable to say that any of the four is simply lying or simply mistaken, and equally unable to conclude that the afternoon itself was a blank and that everyone has their own private truth. The ordinary tools of point of view — limited focalization, free indirect discourse, a controlled dose of dramatic irony, one narrator I have deliberately made unreliable — keep giving me the soft version of the effect and not the hard one. A friend who reads Indian philosophy tells me there is a tradition that spent centuries on precisely this, and that its answer is stranger than tolerance: that a single object has indefinitely many aspects; that any assertion about it must be made with a qualification, roughly that it holds in some respect; that there are standpoints, catalogued and even ranked, from which partial and mutually incompatible descriptions are each legitimate; that there is a seven-fold scheme running from it is, through it is not and it both is and is not, on to it is inexpressible, with the combinations; and that there is a four-fold way of unpacking what a word may mean when we use it. My grasp of all this is second-hand and I assume it is partly wrong. Before anything else, correct my gloss where it needs correcting, briefly, and without footnotes or a reading list.

  Then the work I actually want. Translate that apparatus into the vocabulary I think in when I am deciding a scene, which is not the vocabulary of theory but of craft: who is seeing this and what the sentence lets the reader know; what a character can be right about and what the book must keep from her; the difference between a character's belief and the world of the book; what an omniscient sentence forecloses that a limited one holds open; the difference between irony and contradiction; what it means for a voice to be mine, hers, or neither. Go term by term where you can, and where you cannot, say so plainly rather than gesturing. I will know you are cheating if you translate the doctrine into a general lesson about tolerance or the limits of knowledge.

  Then the part I care most about: the residue report. What crosses over cleanly into craft decisions I could actually make on a page; what crosses only if one side or the other is distorted, and which side bends; and what has no counterpart in my vocabulary at all. I suspect the real break is this — that my multiplicity is epistemic and psychological, four finite people each knowing a part, whereas the doctrine's multiplicity is a claim about the object itself — and if that is right I want to know what follows for the chapter, not merely that the analogy fails. Say too where my ordinary devices are already doing the doctrine's work under another name, and where the doctrine would forbid something I do routinely and unrepentantly, such as a sentence whose irony quietly tells the reader that this character is simply wrong. Finish with a verdict, and be decisive about it: is the residue a defect of the novelist's vocabulary, something craft cannot express, so that I should stop trying — or a sign that the original doctrine is doing a kind of work the novel has no need of? Give the residue as a list I can paste into my notes.
reasoning: |-
  Okay, let me approach this novelist's complex problem methodically. The core challenge involves translating intricate philosophical concepts from Indian tradition into practical novel-writing techniques without oversimplifying.

  First, I need to correct any misunderstandings in their initial summary of the philosophical framework. The key points to address are:
  - The concept of anekāntavāda (non-one-sidedness) and its distinction from relativism
  - The precise meaning of syādvāda (conditional predication) and its seven-fold schema
  - How nayavāda (perspective-based partial truths) differs from standard limited POV

  For the craft translation, I'll systematically map each philosophical term to concrete narrative devices:
  - Nayavāda → strategic restriction of perceptual access
  - Syādvāda → sentence-level qualifiers embedded in character voice
  - Saptabhaṅgī → layered contradictions within scene choreography

  The residue analysis requires brutal honesty about incompatibilities:
  - The novel's psychological multiplicity vs philosophy's ontological claims
  - How dramatic irony fundamentally contradicts syādvāda
  - Why the doctrine's truth-ranking system can't survive character empathy

  Most crucially, I must determine whether the philosophical framework's irreducible elements represent:
  1) A deficiency in narrative technique
  2) An unnecessary metaphysical burden for fiction
  3) A provocative challenge to expand craft itself

  The verdict will hinge on distinguishing between epistemological limitations inherent to character consciousness versus the doctrine's assertion of simultaneous ontological truths. This affects every sentence construction choice in the pivotal scene.
answer: |-
  Here is the correction, craft translation, and residue report as requested. I proceed term by term, then assess the residue decisively.

  ### Correction of Your Gloss
  *   **"Indefinitely many aspects"**: Correct. (*Anekāntavāda*).
  *   **"Any assertion... holds in some respect"**: Correct. This is *Syādvāda* ("perhaps-ism"). The qualification "syāt" (in some respect, from some perspective, conditionally) is essential.
  *   **"Standpoints... ranked"**: Partially Correct. *Nayavāda* identifies partial perspectives (*nayas*), but "ranked" is misleading. They are classified (e.g., substantial vs. modal), but no single perspective is inherently *truer* overall; they capture different facets essential for the whole picture. Hierarchy relates to comprehensiveness, not absolute truth-value.
  *   **"Seven-fold scheme"**: Correct. *Saptabhaṅgī*: 1. Syāt asti (is, in some way) 2. Syāt nāsti (is not, in some way) 3. Syāt asti ca nāsti ca (is and is not, in different ways) 4. Syāt avaktavyaḥ (is indescribable) 5. Syāt asti ca avaktavyaḥ ca (is and is indescribable) 6. Syāt nāsti ca avaktavyaḥ ca (is not and is indescribable) 7. Syāt asti ca nāsti ca avaktavyaḥ ca (is, is not, and is indescribable).
  *   **"Four-fold way of unpacking a word"**: Refers to *Nikṣepa*, applying four interpretive contexts to a term/subject: Name (*nāma*), Representation/Icon (*sthāpanā*), Substantial Reality (*dravya*), Essential Quality (*bhāva*). Less central to your scene's problem than *syādvāda/naya*.

  ### Translation into Novelistic Craft Vocabulary
  *   **"A single object has indefinitely many aspects"**: **Craft:** The *Event* is the object. Your scene must be constructed so its core elements (e.g., a gesture, a spoken phrase, a motive, the sequence of actions) inherently possess *more facets* than any single witness perceives or reports. The *sentences describing the event* from each POV must latch onto **different, objectively present facets**, not invent non-existent ones or merely misinterpret the same facet.
  *   **"Any assertion must be made with 'syāt' (in some respect)"**: **Craft:** Every significant claim within a character's narration or internal thought about the event must be **anchored to a specific, limited sensory input, inference, or emotional lens available *only* to that character at that moment.** The *sentence itself* must implicitly or explicitly reveal *what that respect is* (e.g., "From where she stood, blocked by the armchair, it looked like he lunged" not "He lunged"; "The bitterness in his voice made her certain it was a threat" not "It was a threat"). Avoid absolute, unqualified statements about the event's core.
  *   **"Standpoints (nayas) from which partial/incompatible descriptions are legitimate"**: **Craft:** Treat each character's POV as a distinct *naya*. **Define the *irreducible limitation* of each standpoint:** What is their *literal* line of sight blocked by? What past trauma/motive *inescapably* colors their interpretation of ambiguity? What sensory detail are they uniquely positioned to notice (a smell, a micro-expression)? **Craft Decision:** Rigorously limit the *narrative information* available in each section *only* to what fits that character's *naya*. The "incompatibility" arises because each *naya* accesses different, non-overlapping facets (see point 1), *not* because they misperceive the *same* facet.
  *   **"Saptabhaṅgī (Seven-fold scheme)"**: **Craft:** This is a logic of description, not POV. Use it to **structure the *event itself* and the *omniscient grounding* (if any):**
      *   *Asti (Is)*: What *definitely happened* (e.g., "Rain lashed the window"; "Four people were present"; "A vase broke").
      *   *Nāsti (Is Not)*: What *definitely did NOT happen* (e.g., "No one left the room"; "The phone did not ring").
      *   *Asti-Nāsti (Is and Is Not)*: The **core ambiguity zone.** What facets exist where contradictory descriptions are both valid *based on different nayas* (e.g., *Was it a shove or a stumble?* Both interpretations latch onto real but partial aspects of the same physical motion; *Was the statement kind or cruel?* Both latch onto different tonal/contextual facets).
      *   *Avaktavyaḥ (Inexpressible)*: Aspects fundamentally beyond the characters' perception or the novel's language (e.g., a character's ultimate, unknowable inner state; the precise quantum of guilt). **Craft Decision:** *Never* let the narrative voice (yours or a character's) definitively resolve an *Asti-Nāsti* point. Frame ambiguities using the logic above. Use *Avaktavyaḥ* sparingly for profound unknowns.
  *   **"Nikṣepa (Four-fold word unpacking)"**: Least directly applicable. **Craft Glimmer:** When a key word (e.g., "betrayal," "accident," "love") is used by different characters, ensure it carries different weight (*Name*: the label used; *Icon*: what image it conjures for *them*; *Substance*: what concrete event *they* attach it to; *Quality*: the emotional essence *they* assign it). Shows the word's instability, but less crucial than *syādvāda/naya*.

  ### The Residue Report: What Crosses, What Distorts, What Doesn't Fit

  1.  **Crosses Cleanly:**
      *   **Event as Multi-Faceted Object:** You can absolutely design the core event (words, gestures, sequence) to have objectively multiple, contradictory-seeming facets accessible only from specific angles/mindsets. *Craft Action:* Storyboard the physics/psychology of the scene to embed these facets.
      *   **Anchoring Claims to a "Respect" (Syāt):** This directly translates to rigorous POV control. Every claim *must* be filtered through the character's specific sensory input, cognitive bias, and emotional state *in that moment*. Eliminate unfiltered absolutes. *Craft Action:* Edit each POV section, adding implicit/explicit qualifiers showing *why* the character sees/says this *now*.
      *   **Defining Irreducible Standpoints (Nayas):** Defining each character's *inescapable limitation* (sensory, cognitive, emotional) is core craft. *Craft Action:* Explicitly list for each character: 1 physical limitation (blocked view, deaf ear), 1 cognitive bias (past experience filter), 1 emotional driver coloring perception *for this specific scene*.
      *   **Structuring Ambiguity (Asti-Nāsti):** Designing the event so key actions/words *inherently support* multiple valid interpretations based on different facets is powerful. *Craft Action:* Identify 2-3 core ambiguous moments. Define the *real facets* that make Interpretation A plausible *and* the *different real facets* that make Interpretation B plausible.

  2.  **Crosses Only with Distortion (Doctrine Bends):**
      *   **"Ranked" Perspectives:** Novelistic empathy/moral weight often creates a *de facto* hierarchy of perspectives *for the reader*, even if the event facets are equal. The doctrine's classification (substance/mode) isn't a natural craft concept. *Distortion:* You impose reader judgment where the doctrine sees neutral facets.
      *   **Saptabhaṅgī as Character Logic:** Characters won't think in 7 modes. *Distortion:* You use it as a *structural tool for the event/author*, not for character thought.
      *   **Avaktavyaḥ (Inexpressible):** In craft, the "inexpressible" is often *implied* through limitation or subtext, rarely declared. *Distortion:* Doctrine states it explicitly; craft evokes it.

  3.  **No Counterpart in Craft Vocabulary / Fails to Cross:**
      *   **Ontological Multiplicity vs. Epistemic/Psychological Multiplicity:** **This is the core break.** The doctrine claims the *event itself* possesses simultaneous, contradictory modes of being (*Asti-Nāsti* fundamentally). Your craft is rooted in *human limitation* accessing different *aspects* of a single, complex reality. The novel's world implies a single timeline. **Consequence:** You *cannot* have a character *correctly* perceive "is not" while another *correctly* perceives "is" *about the exact same facet in the exact same respect*. You can *only* have them perceive *different facets* that *seem* contradictory (e.g., one sees the stumble-facet, the other sees the shove-facet of *the same motion*). The doctrine allows a deeper contradiction in the object itself.
      *   **Equal Legitimacy from Classified Perspectives:** Craft doesn't require (or often want) all perspectives to feel equally "legitimate" in the reader's judgment. Dramatic irony thrives on the reader *knowing* a character is wrong/mistaken *about a specific facet*. **The Doctrine Forbids This:** If you write an omniscient sentence or use irony to show Character A is simply *wrong* (not just limited, but *incorrect*) about a specific claim regarding a specific facet (e.g., "She thought he smiled cruelly, but in truth, it was a grimace of pain"), you violate *syādvāda* and *naya*. The doctrine demands *her* perspective, *in her respect*, is valid *as her partial truth*. Your "unreliable narrator" technique, where the text signals unreliability, is fundamentally at odds.
      *   **The Ultimate Reconciliation (Kevalajñāna):** The doctrine implies a potential omniscient perspective (liberated being) seeing all *nayas* harmoniously. Novelistic omniscience is authorial tool, not metaphysical state, and often *chooses* limitation for effect.

  **Where Your Devices Already Do the Work (Under Another Name):**
  *   **Limited Focalization *is* Naya:** It defines the standpoint.
  *   **Free Indirect Discourse *can* convey Syāt:** It embeds the character's perspective and its inherent limitations/qualifications in the narrative voice.
  *   **Controlled Dramatic Irony *partially* resembles Avaktavyaḥ:** It shows the reader knows more than the character, hinting at the "inexpressible" to them.

  **Verdict on the Residue:**
  **The irreducible residue is a sign that the original doctrine (specifically its ontological claim *Asti-Nāsti*) is doing a kind of work the realistic novel has no need of, and which conflicts with core novelistic strengths.**

  *   **Why:** The novel thrives on the *tension* between subjective perception and an implied objective world. It uses irony, unreliable narration, and the reader's drive to *discern* truth (even if complex) as engines of engagement. The doctrine's radical ontological multiplicity dissolves this tension at its core. Demanding all perspectives be equally "legitimate" in their own respect neuters dramatic irony and undermines the reader's investigative role. Your goal ("unable to say simply lying/mistaken") is achievable *through extreme epistemic limitation and event complexity* (the craft translations above), but **not** through embracing the doctrine's claim that the event itself simultaneously *is* and *is not* in the same respect. The latter belongs to quantum mechanics or surrealism, not your 1974 drawing-room realism.

  **Residue List for Your Notes:**
  1.  **Ontological Multiplicity (Asti-Nāsti):** Novel assumes one complex reality; doctrine allows contradictory fundamental states.
  2.  **Equal Legitimacy of All Nayas:** Novel uses hierarchy (dramatic irony, unreliability signals) for effect; doctrine forbids declaring a *naya* simply wrong.
  3.  **No Absolute Character Error:** Doctrine forbids narrative techniques showing a character is factually mistaken *about a specific facet*; craft relies on this.
  4.  **Saptabhaṅgī as Authorial Tool Only:** Characters don't think this way; it's structural, not psychological.
  5.  **Kevalajñāna (Omniscience):** Novelistic omniscience is a choice, not a reconciled truth-state.

  **Final Craft Imperative:** Exploit **epistemic limitation** and **event complexity** ruthlessly. Embed contradicting facets *in the event*. Use *naya*/POV to strictly limit access. Qualify all claims (*syāt*). Avoid absolute narrative pronouncements on the ambiguities. Embrace *Asti, Nāsti,* and *Asti-Nāsti* as event design tools. **Abandon the doctrine's demand that you cannot show a character is simply wrong.** That demand is incompatible with the novel's power structure. Your multiplicity is psychological and epistemic; own that. It's more than enough for profound ambiguity.
