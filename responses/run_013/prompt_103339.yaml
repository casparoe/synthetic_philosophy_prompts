     But the debrief question: should we weight by lifespan? We are not. The activity does not. We can ask: if we were to consider the total welfare over the entire life of an individual, then we would need to multiply the welfare per year by the lifespan. But then we would be double-counting? Because if an individual lives 5 years, we would count it 5 times in 5 years? But we are doing one year at a time. So in one year, we have that individual for the whole year? Then we count 5 for that year? We don't need to adjust.

     We can avoid this by not introducing lifespan. We can say that the welfare per individual per year is what we have.

     c) What if we don't count the deaths? The welfare we used is for the living. The suffering is during life. But the death itself might be a harm? We didn't account for that separately. We only accounted for the welfare during life.

     d) The replacement of species: in conversion, we are replacing one set of animals with another. But in our model, we assume that the population instantly adjusts to the new habitat. We don't account for the transition. And we don't account for the individuals that are killed in the conversion. We can note that in the activity, we are only looking at the steady state, not the transition.

     e) Can we aggregate welfare across species? Is it meaningful to say the ecosystem has a net welfare?

  - (85-90 min): Wrap-up.

  What will go wrong:

  1. Students might not understand the cost constraint. We must make it clear: they start with 10 CUs. Each unit of land must be assigned an action (or habitat type) and the cost depends on the habitat type they choose for that unit. But they are deciding the counts.

  2. They might make arithmetic errors. We should provide calculators? Or let them use phones. But we want it to be checkable. Alternatively, we can design the numbers to be easy.

  3. The biology students might challenge the population numbers. But we invented the species, so we can say these are hypothetical.

  4. They might not see the pattern unless the instructor points it out. So we must have the groups report and then the instructor compiles the results and shows the correlation between high integrity and low welfare.

  5. The debrief might go off track. We need to guide the discussion.

  Finally, what the activity cannot show:

  - The activity relies on the specific numbers we chose for welfare and densities. In reality, are these numbers plausible? We don't know. The point is to show that it is possible, not that it is always the case.

  - The activity assumes that we can measure individual welfare and aggregate it. The debrief questions challenge that, but we haven't provided an alternative.

  - The activity does not address the intrinsic value of species or ecosystems (non-welfare considerations).

  So in the wrap-up, the instructor should note that the activity shows that under a utilitarian welfare framework, it is possible for habitat destruction to reduce suffering, but that framework itself is controversial and may not capture all values (like species integrity, biodiversity, etc.).

  Now, print-ready materials:

  **Handout 1: Scenario and Rules**

  You are the board of trustees for the conservation of an island reserve. The island is divided into 10 equal units. Currently, all 10 units are covered by Pristine Forest (PF). You have a budget of 10 Conservation Units (CUs) to spend on habitat management actions for the entire island. Your choices for each unit of land are:

  - **Preserve as Pristine Forest (PF)**: Prevents degradation. Cost: 3 CUs per unit.
  - **Let it become Degraded Forest (DF)**: By doing nothing, the unit degrades to DF. Cost: 0 CUs per unit.
  - **Convert to Managed Grassland (MG)**: Actively convert the unit to grassland. Cost: 2 CUs per unit.
  - **Convert to Developed Area (DA)**: Develop the unit (e.g., for eco-tourism facilities). Cost: 1 CU per unit.

  Your task: Decide the final habitat composition (how many units of PF, DF, MG, and DA) subject to:
  1. The total number of units is 10.
  2. The total cost must be less than or equal to 10 CUs.

  After you decide the habitat composition, you will compute:
  - The total population of each animal species on the island.
  - The total annual welfare for each species and for the entire ecosystem.
  - The ecosystem integrity score.

  **Handout 2: Species Information**

  The island has four animal species. The table below shows:
  - Welfare per individual per year: the average welfare experienced by one individual of the species in one year (positive = good, negative = suffering).
  - Population density: the average number of individuals per unit area in each habitat type.

  | Species            | Welfare per individual per year | Pristine Forest (PF) | Degraded Forest (DF) | Managed Grassland (MG) | Developed Area (DA) |
  |--------------------|---------------------------------|----------------------|----------------------|------------------------|---------------------|
  | Forest Giant (FG)  | +5                              | 10                  | 2                   | 0                      | 0                   |
  | Breeding Burster (BB) | -1                             | 200                 | 300                 | 250                    | 100                 |
  | Grassland Grazer (GG) | +2                             | 0                   | 0                   | 50                     | 10                  |
  | Urban Opportunist (UO) | +0.5                           | 0                   | 10                  | 5                      | 100                 |

  **Worksheet**

  Group: ___________

  1. Allocation (must sum to 10 and cost <=10):
     - PF: ____ units (cost: 3 per unit) → total cost for PF: 3 * ____ = ____
     - DF: ____ units (cost: 0 per unit) → total cost for DF: 0
     - MG: ____ units (cost: 2 per unit) → total cost for MG: 2 * ____ = ____
     - DA: ____ units (cost: 1 per unit) → total cost for DA: 1 * ____ = ____
     - Total cost = ____ (must be <=10)

  2. Total populations:
     - FG: (10 * PF) + (2 * DF) + (0 * MG) + (0 * DA) = ________
     - BB: (200 * PF) + (300 * DF) + (250 * MG) + (100 * DA) = ________
     - GG: (0 * PF) + (0 * DF) + (50 * MG) + (10 * DA) = ________
     - UO: (0 * PF) + (10 * DF) + (5 * MG) + (100 * DA) = ________

  3. Total annual welfare per species:
     - FG welfare: total FG * 5 = ________
     - BB welfare: total BB * (-1) = ________
     - GG welfare: total GG * 2 = ________
     - UO welfare: total UO * 0.5 = ________
     - **Total welfare** (sum of above) = ________

  4. Ecosystem integrity score:
     - PF: 4 points per unit → 4 * PF = ________
     - DF: 1 point per unit → 1 * DF = ________
     - MG: 2 points per unit → 2 * MG = ________
     - DA: 0 points per unit → 0
     - **Total integrity score** = ________

  **Debrief Questions (for after computation)**

  1. Compare your group's total welfare and integrity score with other groups. What pattern do you notice?

  2. How did the Breeding Burster (BB) affect the total welfare? Why?

  3. Is it appropriate to add together the welfare of a Forest Giant and a Breeding Burster? Consider:
     - The Forest Giant lives about 20 years, while the Breeding Burster lives only 1 year. Does that matter for how we calculate total welfare?
     - What does it mean to say that the Breeding Burster has a welfare of -1 per year? Is that a fair representation of its life?

  4. When we convert a unit from Pristine Forest to Developed Area, we replace Forest Giants and Breeding Bursters with Grassland Grazers, Breeding Bursters (fewer), and Urban Opportunists. How should we account for the individuals that are displaced or killed in the conversion? Does our ledger capture that?

  5. Can we meaningfully talk about the "welfare of an ecosystem"? Or is this concept misleading?

  **Timeline**

  - 0-10 min: Introduction and distribution of materials. Explain the scenario and rules.
  - 10-40 min: Group work (4 groups of 4 students each). Each group decides on an allocation and completes the worksheet.
  - 40-50 min: Groups report their allocations, total welfare, and integrity score. Instructor records on board.
  - 50-60 min: Instructor highlights the inverse relationship between integrity and welfare. Reveals the uncomfortable claim: habitat destruction (conversion to DA) can reduce total suffering.
  - 60-85 min: Guided debrief using the debrief questions. Focus on the aggregation method and the concept of ecosystem welfare.
  - 85-90 min: Concluding remarks: note that the activity shows a possibility under a utilitarian framework, but the framework itself is contested.

  **What might go wrong and how to handle it**

  1. **Arithmetic errors**: Some groups may make calculation mistakes. Encourage them to double-check. Have a calculator app ready. If time, have groups check each other.

  2. **Confusion about the cost constraint**: Some groups might think they can preserve more than 3 PF. Clarify: each PF unit costs 3, so 3 units cost 9, leaving 1 CU for one DA and the rest become DF (cost 0). If they try to do more, they exceed the budget.

  3. **Biology students challenge the numbers**: Acknowledge that the numbers are hypothetical and invented to make a philosophical point. The point is to explore the logic, not the ecology.

  4. **Groups choose allocations that don't show the pattern**: For example, a group might choose all DA and get high welfare and low integrity, and another might choose 3 PF, 6 DF, 1 DA and get low welfare and high integrity. But if a group chooses an intermediate allocation, the pattern might be less clear. Compile all groups and show the trend: as integrity increases, welfare decreases.

  5. **Debrief goes off track**: Gently steer back to the questions. Have the debrief questions projected or on a handout.

  **What the activity cannot show**

  The activity does not establish that habitat destruction *in reality* reduces suffering. It only shows that under the specific welfare and population parameters chosen, it does. The parameters were chosen to make the point, and in reality, we don't know the welfare of wild animals. Also, the activity relies on aggregating individual welfare, which is a controversial ethical framework. The instructor should note that the purpose is to challenge the assumption that ecosystem health (as measured by integrity) always aligns with animal welfare, and to provoke discussion about the ethical framework itself.
answer: |-
  ### Activity Package: "The Welfare Ledger Challenge"  
  **Designed for a 90-minute session on animal ethics and environmental philosophy.**  
  Students act as trustees of "Veridian Isle," a fictional island reserve, allocating a fixed budget to habitat management. The activity reveals that maximizing ecosystem integrity maximizes total suffering, using arithmetic to challenge intuitions. Debrief targets (1) the counterintuitive result and (2) the aggregation assumptions in welfare calculations.

  ---

  ### **Materials (Print-Ready)**  
  #### **1. Trustee Briefing Sheet**  
  *Hand to students at the start.*  
  > **Scenario**: Veridian Isle (10 km²) is divided into 10 equal units. Historically pristine, it faces degradation without intervention. As trustees, you have 10 Conservation Units (CUs) to allocate across four actions:  
  > - **Preserve Pristine Forest (PPF)**: Prevents degradation. Cost: 3 CUs/unit.  
  > - **Allow Degraded Forest (ADF)**: No action; unit becomes degraded. Cost: 0 CUs/unit.  
  > - **Create Managed Grassland (CMG)**: Actively convert to grassland. Cost: 2 CUs/unit.  
  > - **Develop for Conservation (DvC)**: Build eco-infrastructure (e.g., research stations). Cost: 1 CU/unit.  
  >   
  > **Goal**: Allocate CUs to maximize ecosystem value. Final habitats must sum to 10 units. Budget cannot exceed 10 CUs.  
  >   
  > **Rules**:  
  > - Decide allocations as a group (15–20 mins).  
  > - Use the *Species Ledger* and *Scorecard* to compute outcomes.  
  > - Report total welfare and integrity scores.  

  #### **2. Species Ledger**  
  *Includes invented species, welfare values, and population rules.*  
  > **Species Profiles** (Welfare = annual welfare per individual; populations scale with habitat area):  
  > 
  > | Species             | Welfare | Pristine Forest (PPF) | Degraded Forest (ADF) | Managed Grassland (CMG) | Developed (DvC) | Notes                     |  
  > |---------------------|---------|------------------------|------------------------|-------------------------|-----------------|---------------------------|  
  > | **Forest Titan**    | +8      | 10 adults/km²          | 2 adults/km²           | 0                       | 0               | Slow-breeding, long-lived |  
  > | **Breeding Burster**| -3      | 200 individuals/km²    | 300 individuals/km²    | 150 individuals/km²     | 50 individuals/km² | High juvenile mortality  |  
  > | **Grassland Grazer**| +2      | 0                      | 0                      | 30 adults/km²           | 10 adults/km²   | Moderate fecundity        |  
  > | **Urban Adaptor**   | +1      | 0                      | 20 individuals/km²     | 10 individuals/km²      | 100 individuals/km² | Generalist, short-lived  |  
  >   
  > **Welfare Calculation**:  
  > Total Welfare = Σ (Population per species × Welfare per individual)  
  > *Example: 1 km² of PPF houses 10 Forest Titans (+8 each) and 200 Breeding Bursters (-3 each). Welfare = (10 × 8) + (200 × -3) = -520.*  

  #### **3. Scorecard**  
  *For ecosystem integrity and welfare tally.*  
  > **Ecosystem Integrity Score** (Health-focused):  
  > - PPF: 4 pts/unit  
  > - ADF: 1 pt/unit  
  > - CMG: 2 pts/unit  
  > - DvC: 0 pts/unit  
  > *Total Integrity = (PPF × 4) + (ADF × 1) + (CMG × 2) + (DvC × 0)*  
  >   
  > **Welfare Ledger** (Table to fill in):  
  > 
  > | Habitat | Units | Forest Titan Population | Breeding Burster Population | Grassland Grazer Population | Urban Adaptor Population | Total Welfare |  
  > |---------|-------|--------------------------|-----------------------------|-----------------------------|--------------------------|--------------|  
  > | PPF     |       | = units × 10             | = units × 200               | 0                           | 0                        | = (FT×8) + (BB×-3) + (GG×2) + (UA×1) |  
  > | ADF     |       | = units × 2              | = units × 300               | 0                           | = units × 20             | [...] |  
  > | CMG     |       | 0                        | = units × 150               | = units × 30                | = units × 10             | [...] |  
  > | DvC     |       | 0                        | = units × 50                | = units × 10                | = units × 100            | [...] |  
  > | **TOTALS** | 10   | **Sum FT**               | **Sum BB**                  | **Sum GG**                  | **Sum UA**               | **Σ Welfare** |  
  >   
  > *Final Checks:*  
  > - Budget: (PPF × 3) + (ADF × 0) + (CMG × 2) + (DvC × 1) ≤ 10 CUs.  
  > - Units: PPF + ADF + CMG + DvC = 10.  

  #### **4. Trustee Worksheet**  
  *Guides group calculations.*  
  > 1. Allocate units:  
  >    - PPF: ____ units (cost: ____ × 3 = ____ CUs)  
  >    - ADF: ____ units (cost: 0)  
  >    - CMG: ____ units (cost: ____ × 2 = ____ CUs)  
  >    - DvC: ____ units (cost: ____ × 1 = ____ CUs)  
  >    - **Total Cost**: ____ /10 CUs.  
  > 2. Compute populations and welfare (use *Species Ledger*).  
  > 3. Compute integrity score (use *Scorecard*).  
  > 4. Report:  
  >    - Total Welfare = ____  
  >    - Integrity Score = ____  

  ---

  ### **Activity Timeline (90 Minutes)**  
  **Goal**: Students discover that PPF-heavy allocations maximize integrity *and* suffering via hands-on arithmetic.  

  | Time     | Phase                 | Instructions                                                                 |  
  |----------|-----------------------|-----------------------------------------------------------------------------|  
  | **0–10** | **Setup**            | Divide into 4 groups (4 students each). Distribute materials. Explain: “You’re trustees deciding Veridian Isle’s future. Use your budget to allocate habitat actions. Compute welfare and integrity *after* your choices.” Emphasize: *No prior reading; instincts guide you.* |  
  | **10–30**| **Group Work**       | Groups debate and allocate CUs. Circulate to clarify rules. *Predictable issue*: Biology students push for PPF/CMG. Nudge: “What defines a ‘healthy’ ecosystem?” |  
  | **30–45**| **Calculation**      | Groups compute welfare and integrity using *Ledger* and *Worksheet*. *Predictable issue*: Groups may miss Breeding Burster’s impact. Ask: “Which species dominates your ledger?” |  
  | **45–55**| **Report-Out**       | Each group shares:  
  > - Allocation (e.g., “5 PPF, 3 ADF, 2 DvC”).  
  > - Total Welfare and Integrity.  
  > *Instructor records on board:*  
  > | Group | PPF | ADF | CMG | DvC | Welfare | Integrity |  
  > |-------|-----|-----|-----|-----|---------|-----------|  
  > | 1     |     |     |     |     |         |           |  
  > | ...   | ... | ... | ... | ... | ...     | ...       |  
  | **55–65**| **Arithmetic Reveal**| Highlight patterns:  
  > - *Highest integrity* (e.g., 3 PPF, 7 ADF; cost=9+0=9 CUs) has *lowest welfare* (≈ -1,900).  
  > - *Lowest integrity* (e.g., 0 PPF, 0 ADF, 0 CMG, 10 DvC; cost=10 CUs) has *highest welfare* (≈ -50).  
  > - **Key insight**: PPF/ADF combinations maximize Breeding Bursters, whose suffering dominates. |  
  | **65–85**| **Structured Debrief**| Use Socratic Qs tied to student-led numbers:  
  > 1. **Counterintuitive Result**: “You prioritized PPF for integrity—why does it *increase* suffering? Is ‘ecosystem health’ the same as ‘welfare’?” *(Link: Integrity scorecard vs. welfare ledger.)*  
  > 2. **Aggregation Assumptions**:  
  >    - “Look at Breeding Burster: Short lives, high mortality. Is one BB death = one Forest Titan death? What if we counted *life-years*?” *(Recalculate: BB lives 1 year, FT lives 20. BB: -3/year → -3/life; FT: +8/year → +160/life. PPF welfare now positive—but this wasn’t in your original model!)*  
  >    - “You added +8 (FT) and -3 (BB). Does that assume welfare is comparable across species? Is a ‘unit’ of joy/suffering the same for both?”  
  >    - “When you replaced PPF with DvC, BB populations fell. But did you ‘harm’ displaced individuals? Does the ledger capture transition costs?”  
  >    - “Can an ecosystem *have* welfare, or is this a metaphor? Does summing individual welfare miss emergent properties (e.g., biodiversity)?” |  
  | **85–90**| **Conclusion**       | Recap: “Today, you proved habitat destruction *can* reduce suffering—but only under specific aggregation rules. This doesn’t mean we *should* destroy habitats; it means we must scrutinize the frameworks we use to define ‘good’.” Assign reflection: “Does wild animal welfare exist? Defend your view.” |  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Groups overspend or misallocate units.  
     *Fix*: Provide a budgeting table (Worksheet Step 1). Use a simple example: “3 PPF (9 CUs) + 1 DvC (1 CU) = 10 CUs; 6 units left → ADF.”  

  2. **Problem**: Calculation errors with negative welfare.  
     *Fix*: Walk through one row (e.g., PPF) together. Encourage calculators.  

  3. **Problem**: Biology students reject fictional ecology.  
     *Fix*: “These species are hypothetical to isolate ethics from real-world biases. Focus on the arithmetic, not zoology.”  

  4. **Problem**: Groups avoid contentious allocations (e.g., all DvC).  
     *Fix*: Assign roles: One student plays “Economist” (max welfare), one “Ecologist” (max integrity). Force debate.  

  5. **Problem**: Debrief veers into activism (“So we should develop everything!”).  
     *Fix*: Redirect: “This is about *questioning frameworks*, not prescribing actions. Why might the ledger be flawed?”  

  ---

  ### **What the Activity Cannot Replicate (Requires Instructor Voice)**  
  - **The Origin of Welfare Numbers**: Students might assume welfare values (-3 for BB, +8 for FT) are objective. *Clarify*: “I assigned these to make the point vivid. In reality, measuring wild animal welfare is contentious and often impossible. The activity doesn’t prove destruction reduces suffering; it shows how *if* you accept these numbers and aggregation, the math works.”  
  - **Non-Welfare Values**: The ledger ignores intrinsic value of species, biodiversity, or ecosystem resilience. *Note*: “Ecosystem integrity scores represent non-welfare values. The tension arises because welfare and integrity pull in opposite directions here.”  
  - **Scale of Suffering**: The activity treats death as “included” in negative welfare. *Emphasize*: “Is death a harm? The ledger assumes it’s captured by low welfare, but some ethicists argue death is a separate loss. This framework simplifies complex philosophy.”  

  ---  
  **Final Note**: This activity forces students to confront the mechanics of aggregation—a core problem in animal ethics. By making the counterintuitive result emerge from *their* choices, it primes them for deeper critique. The debrief ensures they don’t leave thinking “development is good,” but rather, “we need better frameworks.”
