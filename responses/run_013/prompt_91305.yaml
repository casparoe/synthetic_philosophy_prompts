  Okay, the user is working on a project about letterform theory and wants a rigorous specification for what defines letter identity. They referenced the Letter Spirit project, which aimed to generate alphabet letters in a consistent style from a few seed letters. The core question here is: What makes a shape a specific letter (like 'a') versus just stylistic variation? 

  The user wants desiderata—key requirements—for any theory of letter identity. They mentioned several cases: different 'a' forms (single/double-storey), various scripts (cursive, blackletter), edge cases (degraded or rotated letters), non-visual systems (Braille), and historical changes. They also want clarity on distinctions like type/token and glyph/letter.

  Hmm, this is complex. The user is clearly deep into typography and philosophy of design. Their mention of "what the philosophical question really turns on" suggests they're skeptical about essentialism in letterforms. They want practical criteria but also philosophical rigor—a tough balance.

  First, I need to extract concrete requirements from their examples. Let's group them:  
  - **Variation tolerance**: Must handle diverse shapes (e.g., single vs. double-storey 'a').  
  - **Script invariance**: Explain how 'a' stays the same across scripts like blackletter vs. kids' handwriting.  
  - **Robustness**: Account for degraded/rotated letters still being identifiable.  
  - **Non-visual systems**: Extend to Braille/Morse without visual shape.  
  - **Historical drift**: Address how medieval 'a' is still 'a' despite looking alien today.  
  - **Failure cases**: Explain bad-but-accepted letters vs. shapes that aren't letters at all.  

  They also want to avoid collapsing key distinctions:  
  - Type (abstract concept) vs. token (specific instance)  
  - Glyph (visual form) vs. allograph (stylistic variant) vs. letter (abstract character)  
  - Identity (what makes it an 'a') vs. style (ornamental traits)  
  - Membership (is it an 'a'?) vs. typicality (how good an example it is)  

  Now, the tough part: Which requirements conflict?  
  1. **Invariance vs. discriminative precision**: If the theory is too flexible (accepting all historical variants), it might fail to exclude non-letters. But if too strict, it rejects valid variations.  
  2. **Non-visual parity**: Treating Braille as "the same letter" as visual 'a' strains shape-based definitions. This clashes with visual robustness needs.  
  3. **Mind-independence demands**: Can a theory exclude human perception? Probably not—but the user wants criteria usable by machines (per Letter Spirit).  

  The biggest troublemaker is **non-visual parity**. It torpedoes purely visual theories (e.g., topological models). Even structural approaches struggle because Braille and print 'a' share no sensory features—only abstract relationships within their systems.  

  For the user, I'll emphasize three anchor requirements:  
  1. **System-relativity**: Letter identity depends on contrasts within a writing system.  
  2. **Contrast preservation**: Even distorted, a shape remains a letter if it maintains critical distinctions from other letters.  
  3. **Functional equivalence**: Non-visual systems count because they fulfill the same linguistic role.  

  This framework handles historical drift (systems evolve but retain contrast) and edge cases (a rotated 'a' works if its flipped form doesn't match another letter). It also sidesteps essentialism—no "perfect shape" needed.  

  The user’s unspoken need? Likely to debunk naive essentialism while providing a testable model for computational design. They’re hinting that Letter Spirit’s flaw was underestimating context. My response should arm them for that argument.
answer: |-
  Here is a specification of desiderata for an account of letter identity, grounded in cases and designed to address both computational feasibility and philosophical depth. It focuses on three core requirements that are defensible, mutually tensioned, and exclude popular answers. Each requirement is driven by specific cases and clarifies necessary distinctions.

  ---

  ### **Core Desiderata for Letter Identity**

  1. **Invariance Across Scripts and Styles**  
     - **What it must deliver**: The account must explain why a single-storey printed 'a', a double-storey 'a', a cursive 'ɑ', a Blackletter '𝖆', and a child's scribbled 'a' are all tokens of the *same* letter, despite radical visual differences.  
     - **Cases driving it**:  
       - Historical drift (e.g., Carolingian 'a' vs. modern geometric 'a').  
       - Cross-script unity (e.g., the Greek 'α' is distinct from Latin 'a', but both historical Latin 'a' and its modern descendant must be the *same* letter).  
       - Style variation (e.g., Helvetica 'a' vs. Bodoni 'a').  
     - **Distinctions upheld**: *Letter* (abstract identity) vs. *glyph/allograph* (stylistic realization). Collapsing these conflates identity with form.  
     - **Why essential**: If style were constitutive of identity, children’s handwriting or novel typefaces could not coherently be "the letter a."  

  2. **Discriminative Precision Under Degradation**  
     - **What it must deliver**: The account must distinguish:  
       - A rotated, occluded, or distorted shape that is still an 'a' (e.g., a 90°-rotated 'a' in a puzzle).  
       - A shape that is a *poorly drawn* 'a' (e.g., asymmetric, collapsed counters).  
       - A shape in the 'a' slot that is *not an 'a'* (e.g., a scribble misassigned by convention).  
     - **Cases driving it**:  
       - Robust reading (e.g., quick identification of a smudged 'a' on a wet page).  
       - Failure modes (e.g., a shape mistaken for 'a' only by novices vs. one rejected by all experts).  
       - Non-optical media: Braille '⠁', Morse '•-', and ASL fingerspelling 'A' must be *functionally equivalent* to visual 'a' *as letters*, despite lacking shared visual properties.  
     - **Distinctions upheld**: *Membership* (is it an 'a'?) vs. *typicality* (how well-formed it is). Collapsing these ignores that "bad" tokens still belong.  
     - **Why essential**: Accounts relying on ideal shapes (e.g., Platonic forms) fail degraded cases; those ignoring non-visual systems exclude writing’s modality-independence.  

  3. **System-Relative Contrast Preservation**  
     - **What it must deliver**: Identity depends on a shape’s role in a *system* of contrasts. An 'a' must be distinguishable from 'o', 'd', 'e', etc., within its script, but the *specific* contrasts can vary historically or stylistically.  
     - **Cases driving it**:  
       - Novel typefaces: A never-before-seen 'a' must be identifiable if it preserves critical contrasts (e.g., open counter vs. 'o's closure).  
       - Cross-script drift: The Latin 'a' evolves from Greek 'α', but both remain distinct within their scripts despite visual convergence.  
       - Ambiguous tokens: A shape halfway between 'a' and 'o' in isolation may be unidentifiable, but in context (e.g., adjacent to 'c' and 'b'), its identity resolves via system constraints.  
     - **Distinctions upheld**: *Identity* (contrast-based function) vs. *style* (non-contrastive features). Collapsing these makes style essential to identity.  
     - **Why essential**: Without systemic contrast, Braille dots could not be 'a' (they lack curves), and historical variants could not be the same letter.  

  ---

  ### **Tensions and Exclusions**  
  - **Non-Visual Parity vs. Visual Robustness**: Requirement #2 demands that Braille/Morse be 'a' without visual features, but #3 requires visual contrasts for novel typefaces. This strains accounts that are purely geometric or purely linguistic.  
  - **Invariance vs. Discriminative Precision**: Radical invariance (#1) risks over-inclusion (e.g., accepting any curve as 'a'), while extreme precision (#2) risks excluding valid variants (e.g., Blackletter '𝖆'). Only a contrast-based system (#3) resolves this.  
  - **The Prejudices**:  
    - *Demand for mind-independence*: A letter *must* be identifiable outside human perception (e.g., by machines). **This is a prejudice**. Reading is inherently perceptual; a theory of *identity* need not exclude cognition.  
    - *Demand for a decision procedure*: A computational test (e.g., for Letter Spirit) is desirable but not necessary for philosophical adequacy. The subject owes us clarity, not an algorithm.  
  - **The Excluding Requirement**: **System-Relative Contrast Preservation (#3)**. This excludes:  
    - *Essentialist* theories (e.g., "an 'a' must have a bowl and stem"), which fail historical variants.  
    - *Prototype* theories (e.g., "best examples define the category"), which exclude degraded/non-visual tokens.  
    - *Strict geometric* theories (e.g., topological models), which can’t handle Braille or script invariance.  

  ---

  ### **Why These Three?**  
  These requirements cover your cases without redundancy:  
  - **Single vs. double-storey 'a'**: Handled by *Invariance* (#1).  
  - **Degraded/occluded 'a'**: Handled by *Discriminative Precision* (#2).  
  - **Non-visual systems and historical drift**: Handled by *System-Relative Contrast* (#3).  
  They force the account into a non-negotiable corner: letter identity is neither purely visual nor purely abstract, but *functional* within a system. The unresolved tension—**how contrasts are defined without arbitrariness or human dependence**—is where the philosophy lives.  

  For your project, this frames the essence question: if "essence" means *context-independent visual invariants*, it fails. If it means *contrastive role in a communicative system*, it holds—but this demands relinquishing shape-centric fundamentalism.
