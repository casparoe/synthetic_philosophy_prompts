  Okay, the user is a third-year philosophy student leading a discussion section on promises in an ethics course. They want a teaching plan focused on the foundational question of what makes promises binding, not just explaining the topic. The main challenge is making this abstract question feel real to intro students in fifty minutes.

  Hmm, the user specifically rejects common examples like borrowed books or lunch dates. They suggest a case involving a promise to someone who can't be harmed and won't know if it's broken, but want validation if that's optimal. Their instincts are sharp - that case does isolate obligation from consequences effectively. 

  The core pedagogical challenge is sequencing: how to move students from seeing promises as obviously binding to seeing the bindingness itself as mysterious. The arc must first establish that promises create obligations (which they already accept), then systematically remove all other explanations until only the core puzzle remains. 

  The user anticipates several misconceptions: that promises bind due to trust/expectations, that they're just strong intentions, etc. These must be addressed in a specific order during the discussion. The deepest predicted error is conflating "are promises always binding?" (a practical question) with "what makes them binding at all?" (the metaphysical question we're exploring).

  For the carrying case, the "time-capsule promise" to a deceased person works well because it eliminates: harm to promisee, trust erosion (no one knows), reciprocity, and social sanctions. But to avoid it feeling gimmicky, I should add variations where we tweak one variable at a time.

  Important to note: This is the last session before midterms with likely spotty attendance. The plan must work even if half haven't done readings. Activities should be concrete and discussion-based to engage unprepared students. 

  Key structural elements:
  1. Start with their existing intuition (promises bind) 
  2. Build a "minimum viable promise" case that strips away all extrinsic factors 
  3. Systematically test and reject alternative explanations 
  4. Arrive at the irreducible puzzle of bindingness itself

  The closing should be a question forcing application of the distinction between "when are promises binding?" vs "why are they ever binding?" - perhaps asking whether a secret promise to oneself could bind. 

  Crucially, I must explicitly bracket three things: 1) whether all promises actually bind (scope question) 2) how to resolve conflicting promises (application) 3) any specific theory of obligation (metaphysics). Keep the focus narrowly on the constitutive puzzle.
answer: |-
  Here’s a structured 50-minute teaching plan focused exclusively on **isolating the puzzle of promissory bindingness**, designed to transform a philosophical "contrivance" into a visceral question. The arc systematically strips away extrinsic factors to expose the core mystery.

  ---

  ### **Teaching Plan: The Naked Obligation**  
  **Core Objective:** Make students *feel* the strangeness of "Why does *saying words* create moral weight?"  

  ---

  ### **Explanatory Arc & Sequence**  
  **Total Time:** 50 mins (strictly timed segments)  

  1. **Hook: The Self-Contained Promise (5 mins)**  
     - **Case:** *The Buried Letter*.  
       *"You promise your dying grandparent to read their favorite book every year on their birthday. They die moments later. You bury the letter containing the promise with them. No one else knows. Ten years pass."*  
     - **Q1:** *"Did you have an obligation to read the book this year? Why/why not?"*  
     - **Goal:** Surface intuition that obligation persists despite no consequences (no harm, no trust erosion, no social scrutiny). Forces focus on the *act of promising itself*.  

  2. **Establishing the Baseline: What Do We Already "Know"? (10 mins)**  
     - **Activity:** *Quickwrite + Pair-Share*.  
       *"List every reason you’ve ever heard for why breaking a promise is wrong."*  
     - **Predictable Responses:** Hurts trust, disappoints people, causes harm, is dishonest, unfair.  
     - **Pivot:** *"What if we remove ALL these elements? Does the obligation vanish?"* Revisit *Buried Letter*:  
       - No disappointment (grandparent dead).  
       - No trust erosion (no one knows).  
       - No harm (no consequences).  
       - No dishonesty (no lie).  
     - **Key Move:** Show these are **contingent effects**, not the *essence* of the obligation.  

  3. **Testing Alternatives: Why Common Cases Fail (15 mins)**  
     - **Group Work:** *Sabotage the Obvious*. Give groups flawed cases to dissect:  
       - *Borrowed Book*: "If I return it filthy but undamaged, did I break my promise?"  
         → Reveals focus on *terms*, not bindingness.  
       - *Lunch Date*: "If your friend texts 'no worries!' after you cancel, are you off the hook?"  
         → Exposes confusion between *release* and *nonexistent obligation*.  
       - *Airport Pickup*: "If your friend never shows at baggage claim, must you wait?"  
         → Highlights *conditionality* vs. inherent obligation.  
     - **Debrief:** *"These cases ask WHEN promises bind or HOW we apply them. We’re asking WHY they bind AT ALL."*  

  4. **The Crucial Turn: From "Wrong to Break" to "What Is This Thing?" (10 mins)**  
     - **Provocation:** *"Imagine you said the same words but didn’t intend to keep the promise. Did you still promise?"*  
     - **Deep Error Prevention:** Pre-empt conflation of:  
       | **Misconception** | **Intervention** |  
       |------------------|----------------|  
       | "Binding = Strong Intention" | *"If I sincerely intend to do X but don’t promise, can you blame me for 'breaking' it?"* |  
       | "Binding = Consent/Voluntary Commitment" | *"I voluntarily commit to eating salad daily. Is that a promise? Why not?"* |  
       | "Release = Retroactive Unbinding" | *"If I release you, was the obligation fake before I released you?"* |  
     - **Pivot Point:** *"The obligation doesn’t feel like it’s MADE by consequences or intentions. It feels like it’s in THE PROMISE ITSELF. What could that even mean?"*  

  5. **The Unavoidable Abyss (5 mins)**  
     - **Thought Experiment:** *The Solitary Oath*.  
       *"Alone in your room, you whisper a promise to your future self to quit caffeine. You tell no one. You fail. Did you wrong anyone? Yourself? What if it wasn’t a 'promise' but a 'resolution'?"*  
     - **Q2:** *"What’s the difference between a 'promise to self' and sheer wishful thinking?"*  
     - **Goal:** Show obligations exist even in total isolation. Exposes the **metaphysical discomfort**.  

  ---

  ### **Why the "Buried Letter" is the Ideal Workhorse**  
  - **Must Have:**  
    - A promisee who *cannot experience consequences* (dead/oblivious).  
    - No third-party observers (eliminates social enforcement).  
    - No material stakes (isolates moral "ought").  
  - **Must Lack:**  
    - Reciprocity ("I scratch your back...").  
    - Reliance (promisee doesn’t act on the promise).  
    - Ambiguity (clear act of promising).  
  - **Superiority Over Common Cases:** Lunch dates/airport pickups involve *reliance*; borrowed books involve *property rights*. These smuggled elements distract from pure promissory obligation.  

  ---

  ### **Predicted Misconceptions & Counter-Interventions**  
  | **Misconception** | **When It Arises** | **Shutdown Question** |  
  |-------------------|---------------------|------------------------|  
  | "Breaking promises harms trust." | Hook (Q1) | *"Whose trust is broken if no one knows?"* |  
  | "Promises are just strong intentions." | Step 4 (Provocation) | *"If I intend strongly but say nothing, do you have a claim against me?"* |  
  | "Release dissolves the obligation." | Step 3 (Lunch Date) | *"Was there no obligation until your friend released you?"* |  
  | "It’s about consent/commitment." | Step 4 (Deep Errors) | *"Is every commitment a promise? What’s missing?"* |  
  | **DEEP ERROR:** Conflating "bindingness conditions" with "bindingness source" | Throughout | *"We’re not asking WHEN it’s wrong to break. We’re asking WHY it’s EVER wrong to break."* |  

  ---

  ### **Closing Question to Test Understanding**  
  *"Imagine you make a solemn promise to a tree. You later break it. Is this morally identical to breaking a promise to a person? Why or why not?"*  
  - **Reveals:** If they focus on *reciprocity, harm, or sociality*, they missed the core puzzle. If they wrestle with *whether words alone create duties*, they grasp it.  

  ### **What to Explicitly Refuse to Resolve**  
  State upfront: *"Today we won’t solve:*  
  1. *WHETHER promises are absolute (sometimes breaking them is okay).*  
  2. *HOW to weigh promises against other duties.*  
  3. *WHAT theory explains bindingness (divine command? social practice?).*  
  *We’re only exposing the mystery that makes those questions necessary."*  

  ---

  ### **Why This Works with Spotty Attendance**  
  - **No prep needed:** Cases are intuitive; questions start from lived experience.  
  - **Activity-driven:** Pair-share/group work re-engages distracted students.  
  - **Clear throughline:** One case (*Buried Letter*) recurs, anchoring the progression.  
  - **Emotional hook:** Death, secrecy, and isolation make the abstract vividly tangible.  

  By the end, students should feel the vertigo of realizing obligations can exist without any "because." That’s the win.
