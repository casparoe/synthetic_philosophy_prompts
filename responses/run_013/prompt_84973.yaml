  ### Key Features:
  1. **Explanandum First**: Forces confrontation with *what's being explained* before how
  2. **Commander's Offer**: Each position must account for the opt-out moment
  3. **Causal vs Perceptual**: Separates why they did it vs how they justified it
  4. **Universal/Specific Distinction**: Critical for antisemitism vs obedience debates
  5. **Refuser Accommodation**: Tests whether theories can explain non-participation

  ### Inseparable Pairs Note:
  - Milgram/Browning separation requires evidence about *source* of pressure (authority vs peers)
  - True Believers/Character separation requires cross-population comparison data

  ### Empty Combinations:
  - Incoherent paths combine contradictory commitments (e.g., structural accounts explaining individual acts)
  - Unattractive paths make refusers inexplicable given universal beliefs
  - Unexplored paths represent logical but untheorized combinations

  This tree forces clarity on whether disagreements are about the puzzle itself or its solution. The commander's offer appears as a litmus test across multiple branches.
