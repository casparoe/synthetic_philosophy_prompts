  ### On Machine Learning & Spurious Correlates
  Wittgenstein would likely see the ML analogy as reinforcing his view: The model isn't "mistaken" in an absolute sense—it *correctly* identified a pattern present in the training data (like shading). The "error" arises only when *our human purposes* (e.g., wanting the model to generalize based on causal features) conflict with the correlate it found. This misalignment isn't about truth/falsity but about whether the rule serves the intended practice ("The confusion rests in projecting *our* expectation of 'relevance' onto the model's output"). The "spurious" correlate is only spurious relative to unstated human goals, not the data itself.
