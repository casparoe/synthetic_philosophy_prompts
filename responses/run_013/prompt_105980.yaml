  The deflationary critique ("we're just bad at math") misses this. Yes, emergence is epistemic in the sense that it concerns predictability, but the obstacles aren't arbitrary—they stem from objective computational complexity, like exponential scaling in particle interactions. This is why we can't reduce fluid turbulence to quantum mechanics practically, even if it's possible in principle. 

