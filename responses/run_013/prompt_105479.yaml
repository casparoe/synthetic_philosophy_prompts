prompt: |-
  I keep ending up on both sides of arguments about the precautionary principle and I'd like to figure out what I actually believe, because I suspect my gut is just inconsistent and I've been rationalizing after the fact.

  Here's my verdicts on a pile of cases.

  1. A chemical plant wants to start discharging a new effluent into a river. There's one decent study saying it screws with fish reproduction at concentrations you could plausibly get downstream. No replication, no proposed mechanism. I'd block the discharge until someone replicates it.

  2. A new antibiotic for a resistant infection. The animal data has a hint it might cause a rare heart problem; nothing seen in humans. People are dying now and the alternatives are bad. I'd approve it and monitor closely.

  These two feel structurally identical to me — plausible but unproven harm — and I go opposite ways. In 1 I let precaution block a profitable thing; in 2 I let the benefit override precaution. So something else is doing the work and I don't know what it is.

  3. Gene-drive mosquitoes to crash a malaria vector. Huge benefit, but the ecological knock-ons are unknown and a release might be irreversible. I'd say don't release it, at least not without some kind of international sign-off. Note that here I'm using precaution to block something that would save a lot of lives, which is the reverse of case 2.

  4. Large-scale stratospheric aerosol injection for cooling. I'd treat it as off the table for now. Some people tell me the precautionary move is actually to develop it, because of climate risk, and I can see the logic, but my gut says no.

  5. A cheap new additive that would let food last twice as long in places where spoilage is a real cause of hunger. Some people worry about long-term effects nobody has studied. I'd allow it. So here I'm waving through a pretty big unknown.

  My half-baked principle, which I'm not attached to: pick the option that avoids the worst plausible outcome, where plausible just means not vanishingly unlikely, unless that option would forgo a benefit that's already certain and large. I can already feel this bending under cases 1 and 5.

  What I want: the principle (or a small set of them) that actually fits, stated precisely enough that I could apply it to a new case without asking you again. Tell me which clause each of my verdicts is propping up, what your principle says about cases I haven't listed, and — this is the important bit — which of my verdicts it forces me to give up. If my half-baked version can be repaired rather than thrown out, show me the repair and what it costs.

  One new case to test it on: a city wants to add a low dose of lithium to the drinking water on the theory that it reduces suicide rates. The evidence is suggestive but thin, the effect size is contested, and you can't really opt out of your tap water. Where does your principle come down, and does that match or clash with case 3? I'm definately not going to be satisfied with "it depends."
reasoning: |-
  Okay, let's tackle this user's problem. They're struggling with inconsistent applications of the precautionary principle across different cases. They provided five scenarios and a test case about lithium in drinking water. The user wants a consistent principle that explains their judgments and forces them to reconsider some verdicts.

  First, I need to analyze each case they mentioned. In case 1 (chemical discharge), they blocked the action due to potential environmental harm. Case 2 (antibiotic) they approved despite risks because of immediate life-saving benefits. Case 3 (gene-drive mosquitoes) they blocked due to irreversible ecological risks. Case 4 (geoengineering) they rejected. Case 5 (food additive) they approved despite unknown long-term effects. Their half-baked principle avoids worst outcomes unless forgoing large, certain benefits. But it fails in cases 1 and 5.

  The key here is identifying underlying factors influencing their decisions. Asmodeus's framework mentions reversibility, cost of delay, and burden of proof. Let me check if that fits. Case 1: reversible harm, delay isn't costly, burden on the company. Case 2: irreversible harm from inaction (deaths), burden on those blocking. Case 3: irreversible release, so precaution applies. Case 4: irreversible consequences. Case 5: reversible, so less precaution. That seems consistent.

  But the lithium case is tricky. It's not easily reversible, but the harm (suicide) is significant. Applying the framework: it's hard to reverse once implemented, cost of delay is ongoing suicides, burden of proof on proponents. The user might lean against it, similar to case 3. But is that consistent? They approved the food additive in case 5, which also has unknowns. The difference might be in reversibility and consent. Lithium in water affects everyone without consent, while the additive is a choice. That could be a factor.

  The user needs to reconsider case 5. If the food additive poses irreversible harm, why approve it? Maybe they see it as low risk or reversible. But if there's a plausible irreversible health effect, the framework would require more caution. The lithium case clashes with case 3 but aligns with their gene-drive decision. They might need to accept blocking lithium or re-evaluate case 5.

  Also, consent seems important but wasn't explicit in the framework. Adding a consent dimension could help, especially in cases like lithium and gene-drive where opting out is impossible. That might resolve the inconsistency between approving the antibiotic (individual choice) versus blocking lithium (no choice).

  So the final principles are: 1) Reversibility, 2) Cost of Delay, 3) Burden of Proof, 4) Consent. Applying these, the user might need to adjust case 5 if the harm isn't easily reversible or add consent as a factor. Lithium would be blocked due to irreversibility and lack of consent, aligning with case 3. Case 5 might stand if the additive's use is optional, unlike lithium. This gives a consistent framework that explains their judgments and highlights where adjustments are needed.
answer: |-
  Here's a consistent principle set derived from your verdicts, designed to force tradeoffs and expose your core priorities. Your half-baked principle is close but needs refinement on "plausible outcome," "certain benefit," and how costs interact.

  ### The Principle Set
  1.  **Asymmetric Harm Assessment:** Focus on preventing **irreversible, catastrophic, or widespread harm** (even if plausibility is moderate/low) *unless*:
  2.  **Cost of Inaction:** Inaction imposes **immediate, severe, irreversible costs** (like large-scale preventable death/suffering) that demonstrably outweigh the *plausible* worst-case harm from action.
  3.  **Burden of Proof:** The burden lies heavier on:
      *   The party proposing an action with **irreversible consequences or imposed non-consensual risks**.
      *   The party *blocking* an action when **inaction has severe, irreversible costs**.
  4.  **Reversibility & Containment:** Strongly favor options where harms are **detectable early, reversible, or containable**. Actions lacking these features face a much higher bar.

  ### How Your Verdicts Fit (and Which Must Fall)

  *   **Case 1 (Chemical Discharge):** Fits. Harm (fish collapse) is potentially irreversible/widespread. Action (discharge) causes irreversible change. Burden is on the plant. **Cost of Inaction** (lost profits) is not severe/irreversible. **Blocking discharge is upheld.**
  *   **Case 2 (Antibiotic):** Fits. **Cost of Inaction** (immediate preventable deaths) is severe and irreversible. Harm (rare heart problem) is plausible but likely reversible/containable (monitoring!) and impacts individuals who consent via treatment. Burden shifts: blocking action carries high cost. Burden on proponents is met by monitoring plan. **Approving antibiotic is upheld.**
  *   **Case 3 (Gene-Drive Mosquitoes):** Fits. Harm (ecological collapse) is potentially irreversible, catastrophic, widespread. Action (release) is irreversible. Burden is heavily on proponents. **Cost of Inaction** (ongoing malaria deaths) is severe BUT *reversible* (other interventions exist, future release possible). Precaution blocks. **Blocking release is upheld.**
  *   **Case 4 (Geoengineering):** Fits. Harm (weather disruption, termination shock) is potentially irreversible, catastrophic, widespread. Action is effectively irreversible globally. Burden heavily on proponents. **Cost of Inaction** (climate damage) is severe BUT *developing* the tech isn't "action" with irreversible harm; *deploying* is. **Blocking deployment is upheld.**
  *   **Case 5 (Food Additive):** **Must Fall.** Under this principle, your verdict clashes. Harm (long-term population health effects) is plausible, potentially irreversible/widespread. Action (mass consumption) is irreversible exposure. Burden is on proponents. **Cost of Inaction** (ongoing spoilage/hunger) is severe BUT *reversible* (other interventions exist, future adoption possible). This structurally mirrors **Case 3** (potential irreversible harm vs. reversible cost of inaction). **The Principle forces you to BLOCK the additive until better safety data**, just like the chemical discharge. *Your gut's approval here is the inconsistency.*

  ### The Lithium Test Case
  *   **Harm:** Potential long-term neurological/endocrine effects on an entire population. Plausibility: Moderate (thin evidence, contested size, but lithium *is* bioactive). **Irreversible** exposure for individuals (can't un-drink it). **Widespread** impact (entire city). **Non-consensual** risk.
  *   **Benefit:** Potential reduction in suicides. Plausibility: Moderate/Suggestive. **Severe/irreversible Cost of Inaction** (preventable deaths).
  *   **Reversibility:** Action (adding lithium) is easily reversible (stop adding it). *Harm* from exposure might not be reversible.
  *   **Burden:** Heavily on proponents (city). Imposing non-consensual, population-wide medical intervention requires extremely high certainty of benefit and safety.
  *   **Analysis:** While the **Cost of Inaction** (suicides) is severe and irreversible, the **Asymmetric Harm Assessment** and **Burden of Proof** dominate.
      *   The *plausible harm* (population-wide, non-consensual, potentially irreversible health effects) is catastrophic in scale and nature.
      *   The *benefit* is contested and moderate in evidence.
      *   The *burden* on proponents is immense and unmet by "suggestive" evidence.
      *   **Reversibility of Action** (stopping the additive) doesn't negate the potential irreversibility of *harm* already caused.
      *   Alternatives exist (targeted mental health care, better access to treatment).
  *   **Principle Verdict:** **BLOCK the addition of lithium.** The risk of widespread, non-consensual, potentially irreversible harm to a captive population outweighs the suggestive benefit, given the high burden of proof for such an intervention.
  *   **Clash with Case 3?** **No clash, it aligns perfectly.** Both involve:
      *   Imposing widespread, potentially irreversible harm on populations/environments without consent.
      *   High burden of proof unmet by current evidence.
      *   Severe but *reversible* costs of inaction (malaria/suicides persist, but other actions are possible).
  *   **Clash with Case 2?** **No clash.** Case 2 involves:
      *   *Consenting* individuals facing known severe risk (death from infection).
      *   Harm from action is individual, potentially reversible/containable.
      *   Burden shifts due to severe irreversible cost of *inaction* for the patient.
  *   **Clash with Case 5 (Revised)?** **No clash.** Both Lithium and (revised) Food Additive are blocked: non-consensual population-wide exposure to plausible irreversible harm, insufficient proof, reversible cost of inaction.

  ### Repairing Your Half-Baked Principle
  Your core idea ("avoid worst plausible outcome unless forgoing large certain benefit") is salvageable with key upgrades:

  1.  **Refine "Plausible":** Define it as **"non-negligible probability of severe irreversible/widespread harm"** (not just "not vanishingly unlikely").
  2.  **Refine "Benefit":** Replace "certain" with **"highly probable and large."** Replace "forgo" with **"forgo *only if* the cost of inaction is also severe and irreversible."**
  3.  **Add Key Factors:** Explicitly consider:
      *   **Reversibility of Harm:** Is the worst-case *recoverable*?
      *   **Scale & Consent:** Is harm widespread and imposed without choice?
      *   **Burden Allocation:** Who must prove safety/risk? (Tied to reversibility & scale).

  **Repaired Principle: "Prefer actions (or inactions) that avoid outcomes with a non-negligible probability of severe, irreversible, or widespread harm. Override this preference *only* if:**
  *   **The alternative action (or inaction) carries a highly probable, large, and severe/irreversible cost, AND**
  *   **The risks of the preferred path are primarily reversible, containable, or consensually undertaken."**

  **Cost:** This forces you to give up your Case 5 verdict (block the additive) and potentially makes approval in Case 2 harder (requires strong monitoring for reversibility/containment). It adds complexity but captures the asymmetry in your judgments.

  ### Conclusion
  Your gut isn't inconsistent; it's weighing **irreversibility, scale of harm, consent, and the nature of the cost of inaction** more heavily than simple "plausible harm vs. benefit." The proposed principle set formalizes this. It forces you to block the food additive (Case 5) and the lithium (Test Case), aligning them with gene-drive mosquitoes (Case 3), while distinguishing them from the antibiotic (Case 2) due to consent, reversibility of harm, and the immediate/severe/irreversible nature of the cost of *inaction* for individual patients.
