answer: |-
  ### Final Examination Question  
  **Answer ONE question only. This question carries 20 marks.**  

  > **Case:** A laboratory builds the "Chooser," a device playing a repeated game against a human. Its input is limited to the opponent’s last three moves. It has no internal model of the opponent, no memory beyond a three-move buffer, and no representational components. Yet two incompatible intentional attributions predict its behavior with equal accuracy and compression: (1) it "believes the opponent will repeat a losing move" and "desires to exploit that tendency," or (2) it "believes the opponent is bluffing" and "desires to call the bluff." The engineer built it solely to pass a hardware test, with no intent for game-playing proficiency.  
  >  
  > **Task:** Using Dennett’s framework, especially his 1991 compression criterion in "Real Patterns," answer all three parts below in a unified argument. Take a clear position and defend it.  
  > 1. Does the existence of two equally compressive but incompatible intentional descriptions entitle us to call the Chooser’s "beliefs" real? Justify your answer.  
  > 2. Can your answer be reconciled with Dennett’s claim that the physical stance is "the most accurate in principle"?  
  > 3. What does this case show about whether real patterns exist independently of stances, or only relative to descriptive vocabularies and prediction goals?  
  >  
  > **Note:** Do not merely summarize the three stances. A strong answer will commit to a position and address the tension between Dennett’s commitments.  

  ---

  ### Model Answer (Approx. 700 words)  
  **Thesis:** Dennett’s compression criterion *does* entitle us to call the Chooser’s attributed beliefs real, but this requires accepting that "real patterns" are stance-relative. This stance-relativity reconciles with the physical stance’s "in-principle accuracy" by reframing it as a claim about entailment, not metaphysical hierarchy. The price is abandoning pattern realism as stance-independent.  

  **(1) Reality of Beliefs Amid Rival Attributions**  
  The rival intentional descriptions satisfy Dennett’s compression criterion: both predict the Chooser’s behavior with "near-perfect accuracy" using descriptions "far shorter" than physical or design-stance alternatives (*Real Patterns*). For Dennett, a pattern is real if it permits data compression—regardless of internal implementation. The Chooser’s behavior *is* a real pattern because it exhibits reliable, projectable regularities captured by intentional idioms. Crucially, the criterion is *comparative and vocabulary-relative*. Rival attributions do not refute reality; they reveal that multiple patterns can be "real" relative to different descriptive frameworks. Dennett anticipates this: different "patterns" can be abstracted from the same data, much like overlapping tessellations (*Real Patterns*, p. 28). Thus, both beliefs are real *as patterns*—they are not fictions but robust, objective regularities detectable via compression.  

  **(2) Reconciling with the Physical Stance’s "In-Principle Accuracy"**  
  Dennett claims the physical stance is "the most accurate in principle" (*The Intentional Stance*, p. 17). This seems incompatible with granting reality to intentional patterns. However, "in principle" here denotes *entailment*, not epistemic superiority. The physical stance, for Dennett, provides a complete causal blueprint: an ideal Laplacean predictor could deduce all future states from microphysical facts. But this does not imply that coarser-grained patterns (e.g., intentional descriptions) are less real. Accuracy is not a zero-sum game; the physical stance’s completeness entails intentional patterns but cannot *practically* replicate their predictive efficiency. The Chooser exemplifies this: a molecular-level description entails its game moves but is useless for prediction compared to intentional patterns. Thus, the physical stance’s "accuracy" is ontological (it exhausts reality) but not pragmatically competitive. Intentional patterns remain real *as efficient abstractions* despite being entailed by physics.  

  **(3) Stance-Relativity: The Price of Reconciliation**  
  The Chooser forces a key concession: real patterns are not stance-independent. They exist relative to (a) a descriptive vocabulary and (b) a prediction task. The two belief attributions are incompatible yet equally real because each compresses data optimally *for its own intentional idiom*. No "God’s-eye view" adjudicates between them because pattern reality is tethered to instrumental success. This stance-relativity resolves the tension: the physical stance’s "in-principle" accuracy guarantees no stance-independent pattern is *missed*, but it does not privilege one compressive description over another. The Chooser’s unattributed design rationale underscores this. Though the engineer had no game-playing intent, the device’s behavior *affords* intentional interpretation. For Dennett, reality lies in the patterns we can *use*, not in hidden essences. Thus, the beliefs are real *for predictors adopting the intentional stance*, even if no internal states "mirror" them.  

  **Conclusion**  
  Dennett’s commitments cohere only if we treat real patterns as stance-relative. The Chooser’s rival beliefs are both real because they compress data efficiently within their vocabularies. The physical stance’s in-principle accuracy is preserved as a claim about entailment, not a demotion of intentional patterns. The cost is rejecting stance-independent realism: patterns are real only relative to pragmatic, descriptive contexts. This secures Dennett’s anti-reductionism while honoring science’s pluralism.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **To earn an A (18–20 marks), an essay must:**  
  1. **Commit to a clear position** (e.g., "beliefs are real but stance-relative") and defend it consistently (2 marks).  
  2. **Address all three parts** of the question with balanced depth, integrating them into a unified argument (3 marks).  
  3. **Explain compression as comparative/vocabulary-relative**: Contrast compression with "correspondence" and note rival attributions don’t falsify the criterion (3 marks).  
  4. **Distinguish pattern-reality from belief-state realism**: Emphasize that Dennett’s "real patterns" concern behavioral regularities, not internal representations (2 marks).  
  5. **Interpret "in-principle accuracy" correctly**: Identify it as a claim about entailment by microphysics, not a hierarchy of "realness" (3 marks).  
  6. **Engage the unattributed rationale**: Note that the engineer’s intent is irrelevant—patterns emerge from behavior, not design (2 marks).  
  7. **Concede stance-relativity as the "price"**: Argue that patterns require a stance (vocabulary + purpose) to be real (3 marks).  
  8. **Avoid prohibited missteps** (see below).  

  **A B-grade essay (14–17 marks) may:**  
  - Adequately cover all three parts but with less integration or clarity.  
  - Recognize compression’s role but treat it as weakly objective (e.g., "useful fiction").  
  - Mention "in-principle accuracy" but conflate it with practical superiority.  
  - Note stance-relativity but not explicitly tie it to vocabulary/purpose.  
  - Ignore the engineer’s lack of intent.  

  **Mistakes costing marks (deduct 1–3 marks per occurrence):**  
  - **Reciting stances as a hierarchy**: E.g., "Physical stance is most real, intentional is heuristic."  
  - **Treating real patterns as fictions**: E.g., "Beliefs are just pragmatic tools, not real."  
  - **Misinterpreting rival attributions**: E.g., "The tie disproves Dennett’s whole theory."  
  - **Reductionism in Part 2**: E.g., "Physical stance is more accurate, so intentional patterns are less real."  
  - **Ignoring compression criteria**: E.g., Discussing stances without reference to data compression.  
  - **Omitting key case details**: E.g., Failing to address the engineer’s lack of game-related intent.  

  ---  
  This question and rubric test synthetic engagement with Dennett’s tensions while demanding precision on stance-relativity—a core challenge in *Real Patterns*. The model answer exemplifies the required depth and avoids common student pitfalls.
