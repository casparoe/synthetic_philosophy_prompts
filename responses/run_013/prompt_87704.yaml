prompt: |-
  You are a philosopher of mind and an experienced graduate instructor who has taught heterophenomenology many times. I need a teaching plan, not an explanation of the view itself. My audience is a ninety-minute graduate seminar in a cognitive science department: the students know some neuroscience and have encountered Dennett's name, but they are impatient with philosophy and split between two assumptions—that first-person reports are direct readouts of consciousness, and that reports are just noise to be ignored. I want to teach heterophenomenology as a method for turning reports into public, checkable data without settling the metaphysics of consciousness. Before drafting the plan, think carefully and brainstorm the conceptual dependencies and the likely misconceptions; then give me the plan in a clear sequence.

  What I need from you: first, the order in which the components must be introduced and why each depends on the previous one—from the problem of the report, to the heterophenomenological stance, to the heterophenomenological world, to the relation between that world and the subject's brain and behavior. Second, the one carrying example that should run through the whole session. I am inclined to use a split-brain patient who verbally denies seeing an object while his left hand reaches for it, but tell me whether that is the right example or whether another case would carry the dependencies better; if you keep it, specify what the example must include and what it must not include, for instance that it must not presuppose an answer to the question of whether consciousness is split. Third, the misconceptions the students will predictably bring or form—at minimum, that heterophenomenology is behaviorism, that it denies consciousness, that it takes reports at face value, that it makes reports incorrigible, that it is just introspection with a new name, and that it is a form of fictionalism—and exactly where in the sequence I should head each one off, with a sentence or two of what I should say. Fourth, a check for understanding at the end that would show whether they can use the method rather than merely recite it: something like asking them to separate questions heterophenomenology can answer from questions it cannot, or to produce a two-column reading of a sample report. Fifth, what I should openly refuse to explain at this level—the hard problem, neural correlates, illusionism, the details of Dennett's other commitments—and how I should say so without making the method look like a dodge.

  Do not give me readings, citations, or bibliography; the plan must be self-contained and usable without internet access. Write as if you are coaching me through the session, with the dependency structure and the misconception map as the core of the deliverable.
reasoning: |-
  Okay, the user is asking for a detailed teaching plan on heterophenomenology for a graduate seminar in cognitive science. They want a clear sequence that addresses conceptual dependencies and misconceptions, using a consistent example, and includes checks for understanding. 

  First, I need to unpack the user's context. They're teaching impatient grad students who are polarized about first-person reports—either treating them as direct readouts of consciousness or dismissing them as noise. The goal is to present heterophenomenology as a methodological tool without getting bogged down in metaphysics. 

  Hmm, the split-brain example is tricky but promising. It clearly shows dissociation between verbal report and behavior, which sets up the need for heterophenomenology. But I must be careful not to imply consciousness is "split"—just that reports and actions conflict. The key is framing it neutrally: the patient says X but does Y, period. 

  For misconceptions, I anticipate at least six big ones: conflating it with behaviorism, thinking it denies consciousness, taking reports at face value, etc. Each needs a specific preemptive strike. Like when introducing the stance, I should explicitly contrast it with behaviorism: "We're collecting reports precisely because they matter, not ignoring them." 

  The dependency chain is crucial. Start with the problem of reports (why they're messy but indispensable), then introduce the stance as a solution, build the heterophenomenological world, and only then link it to brain/behavior. Jumping ahead would confuse them. 

  For the check, a two-column exercise is perfect—have them parse a sample report into "what subject believes" vs. "what actually happened." That forces application, not regurgitation. 

  And I must firmly bracket metaphysics. If someone asks about the hard problem, I'll say: "That's like asking how a microscope feels about cells—it's a tool, not a theory." Keep it pragmatic. 

  ...Wait, did I cover all requested elements? *scans query* Yes: sequence, example handling, misconception map, application check, and boundary-setting. The split-brain example stays but with caveats. Time to structure this coaching-style.
answer: |-
  Here’s a battle-tested teaching plan optimized for your constraints. The sequence is designed to build stepwise, preempt misconceptions at critical junctures, and force engagement with the *method* over metaphysics.

  **Core Conceptual Dependency Chain:**  
  Problem of Reports → Heterophenomenological Stance → Heterophenomenological World → Triangulation with Brain/Behavior  
  *(Each step solves a problem exposed by the previous step)*

  **The Anchoring Example: Split-Brain Patient**  
  *Keep it*, but **strictly frame it like this**:  
  - **What it MUST include:** Subject is shown "SPOON" to left visual field (right hemisphere). When asked "What did you see?" they *say* "Nothing" (left hemisphere/verbal report). BUT their left hand (right hemisphere) reaches into a box and selects a spoon from among other objects.  
  - **What it MUST NOT include:** Any mention of "two consciousnesses," "split mind," or neural explanations. Present *only* the empirical discordance: **Report ≠ Behavior**.  
  - **Why it works:** It’s visceral, empirically grounded (Gazzaniga-type experiments), and forces the question: *What do we do with this conflicting data?* It’s not about "what consciousness *is*"; it’s about "what data we *have*."

  ---

  **Teaching Plan: 90-Minute Seminar**

  **PART 1: SETTING THE PROBLEM (15 mins)**  
  1.  **Hook with the Split-Brain Example (5 min):**  
      *   Present the case neutrally: "Here's the data: Subject says X, but their hand does Y. Both are measurable. What now?"  
      *   **Key Question:** *"If we can’t ignore the report (it’s systematic!), but we can’t just take it as a direct readout of ‘what happened in consciousness’ (it conflicts with behavior!), what’s our scientific move?"*  
      *   **Goal:** Make the conflict *unignorable* and show both simplistic stances (readout vs. ignore) fail.  

  2.  **The Problem of First-Person Reports (10 min):**  
      *   **The Data We Actually Get:** Audio recordings, button presses, drawings, questionnaires – *publicly observable events*.  
      *   **The Temptation:** Treating these events as transparent windows into a private world (the "Cartesian Theater").  
      *   **The Challenge:** Reports can be incomplete, distorted, confabulated, context-dependent, or conflict with other data (like the split-brain case).  
      *   **Misconception Preemption #1 (Taking Reports at Face Value):** "Our default isn't to *dismiss* reports, but we also can't naively assume 'Subject said X' means 'Consciousness contained X' without further investigation. The split-brain case shows why."  
      *   **Misconception Preemption #2 (Ignoring Reports as Noise):** "But we *also* can't just throw the reports away! 'I saw nothing' is a crucial piece of data about *what the system is generating*, especially when it conflicts with other outputs. We need a way to *use* them rigorously."

  **PART 2: INTRODUCING THE STANCE & BUILDING THE WORLD (35 mins)**  
  3.  **The Heterophenomenological Stance (15 min):**  
      *   **Definition:** Adopting the stance of an *anthropologist studying a foreign culture*. Our "culture" is the subject's verbal and non-verbal expressive behavior.  
      *   **Core Move:** We take the subject *seriously* but not *literally*. We are agnostic (for now) about whether their reported world corresponds to an inner reality, a fiction, or anything else.  
      *   **Methodological Agnosticism:** "We bracket the metaphysics. Our job is to meticulously document *what the subject says and does* about their experience."  
      *   **Misconception Preemption #3 (Denies Consciousness):** "This does NOT deny consciousness exists! It says: 'Consciousness is a thorny problem. Let's first get the data about what people *claim* to be conscious of, and how they act, impeccably documented.' It’s a starting point, not an endpoint."  
      *   **Misconception Preemption #4 (Just Introspection/Subjectivism):** "This is the *opposite* of introspection! Introspection asks the subject to look inward. Heterophenomenology asks *us* to look at the *subject's outward expressions* as public data. The subject isn't the scientist here; *we* are, studying their output."  
      *   **Apply to Split-Brain:** "Stance: We meticulously record *both* the verbal report ('I saw nothing') *and* the behavioral report (left hand selects spoon). Both are primary data. We don't assume one is 'true consciousness' yet."

  4.  **Constructing the Heterophenomenological World (20 min):**  
      *   **The Product:** A **neutral, third-person description** of the world *as it seems to the subject*, based *exhaustively* on their reports and behaviors. This is the "subject's story."  
      *   **Analogy:** Writing the "belief manual" for the subject. "According to Subject S, under conditions C: X was seen / Y was felt / Z was intended."  
      *   **Key Features:**  
          *   Must account for *all* report data (verbal, non-verbal, inconsistencies).  
          *   Is a *theoretical posit* based on evidence (the reports), not a direct observation.  
          *   **Crucially:** It's the world *as the subject takes it to be*.  
      *   **Apply to Split-Brain:**  
          *   *Verbal Report HP World:* "It seems to the verbal system that nothing was presented."  
          *   *Manual Report HP World:* "It seems to the manual system that a spoon was presented."  
          *   **DO NOT RESOLVE THE CONFLICT.** Just show the two descriptions derived from the data streams. Highlight the *discordance* as a key feature of *this subject's* heterophenomenological world(s).  
      *   **Misconception Preemption #5 (Makes Reports Incorrigible):** "Notice: We didn't say 'The subject saw nothing' OR 'The subject saw a spoon'. We said '*According to the verbal report*, it seemed like nothing...' The report is data *for* constructing the HP world; the HP world is our *interpretation* of that data. It's provisional and testable."

  **PART 3: TRIANGULATION & THE METHOD'S POWER (25 mins)**  
  5.  **Relating the HP World to Brain & Behavior (15 min):**  
      *   **The Scientific Payoff:** The HP World (the subject's story) becomes a **rich, structured specification** that we can *correlate* with:  
          *   **Behavior:** Does the subject act consistently with their reported world? (e.g., Does the split-brain patient *only* reach for the spoon with the left hand? Does their verbal denial persist under questioning?)  
          *   **Brain Activity:** What neural processes occur when specific elements of the HP World are generated? (e.g., What brain areas are active when the patient *says* "nothing" vs. when the left hand *selects* the spoon?)  
      *   **Resolving Discordance (Methodologically):** The conflict in the split-brain HP World *drives research questions*: What conditions trigger which report? Can we trace the neural pathways? How does context modulate the conflict?  
      *   **Misconception Preemption #6 (Behaviorism):** "Behaviorism ignored or reduced the report. Here, the report is *central data* used to construct a complex model (the HP World), which we then *correlate* with other data (neural, behavioral). It’s *integrative*, not reductive."  
      *   **Misconception Preemption #7 (Fictionalism):** "We are *not* saying the HP World is a fiction! We're saying it's the best description of the subject's *manifest perspective*. Whether that perspective 'matches' some underlying reality is a *later* question. The HP World is real *as data*."

  6.  **The Method Summarized (10 min):**  
      1.  **Record:** Exhaustively document utterances, behaviors *as* reports.  
      2.  **Interpret:** Construct the Heterophenomenological World (the "subject's story") from these reports.  
      3.  **Correlate:** Treat the HP World as a dependent variable to be explained by (or correlated with) brain states, behavior, stimuli, etc.  
      *   **Emphasize:** This turns subjective *reports* into objective *data* (the recorded report tokens and the constructed HP World description) without needing to define consciousness first.

  **PART 4: CHECK FOR UNDERSTANDING & WRAP-UP (15 mins)**  
  7.  **Application Check: The Two-Column Test (10 min)**  
      *   **Task:** Present a NEW brief report snippet (e.g., "Subject describes a vivid red afterimage lasting 10 seconds after a green flash, but eye-tracking shows no fixation drift.")  
      *   **Instruct Students (Pairs/Individual):**  
          *   *Column 1: The Heterophenomenological World:* "What is the description of the world *as it seems to the subject* based *only* on this report?" (e.g., "It seemed to the subject that a vivid red afterimage persisted for 10 seconds after a green flash.")  
          *   *Column 2: Public Data/Research Questions:* "What is the *actual recorded report*? What *other public data* (behavioral, neural, stimulus) could we now correlate this HP World description with? What *specific* research question does this generate?" (e.g., "Record: Utterance 'vivid red afterimage... 10 seconds'. Question: Correlate reported duration/detail with neural adaptation measures in V4? Check consistency of duration reports across trials?")  
      *   **Listen/Discuss:** Focus on whether they avoid metaphysical leaps ("the afterimage *was* red") and stick to deriving the HP World from the report and formulating testable correlations.

  8.  **Explicit Boundaries & Wrap-Up (5 min)**  
      *   **What We DON'T Do Today (State Firmly & Briefly):**  
          *   "We are NOT solving the Hard Problem (why/how subjective experience arises). Heterophenomenology gives us data *about* that experience *as reported*, not an explanation *of* it."  
          *   "We are NOT discussing Neural Correlates of Consciousness (NCCs) *in detail*. HP gives us the *'C'* part to correlate – the content of reported experience."  
          *   "We are NOT endorsing Illusionism or any specific metaphysics. HP is a *method* usable by realists, illusionists, etc."  
          *   "We are NOT covering Dennett's entire philosophy (e.g., intentional stance). This is one tool."  
      *   **Why it's NOT a Dodge:** "This is how science always proceeds: get the data *right* first, build robust phenomena, *then* theorize. HP is about getting the data about subjective reports right. Ignoring it is the dodge; this is the rigor. It forces us to confront *all* the data, like our split-brain patient."

  **Key Coaching Notes:**  
  *   **Pace:** Be ruthless on time. Move briskly through definitions, linger on examples and misconception-busting.  
  *   **Tone:** Project confidence that this is a *practical tool*, not philosophy for its own sake. Use "we" (scientists).  
  *   **Split-Brain Discipline:** Refer back to it CONSTANTLY at each stage. "How does the Stance apply *here*? How do we build the HP World *here*?"  
  *   **Misconception Vigilance:** Hit each one at the exact point it's likely to arise (as mapped above). Use clear, declarative sentences: "No, that's not it. Here's why..."  
  *   **Check Focus:** The Two-Column Test forces *application*. If they can parse a report into HP World + Testable Questions, they get the method. If they lapse into "But what was *really* conscious?", gently redirect: "What does the *report* let us put in Column 1?"

  This sequence builds the method logically, uses a potent example rigorously, actively combats predictable resistance points, provides a clear application check, and fences off metaphysics without diminishing the method's value. Good luck!
