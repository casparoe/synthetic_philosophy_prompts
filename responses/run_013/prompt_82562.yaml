answer: |-
  Below is a diagnostic decision tree for the norm of assertion, designed as a handout for a graduate reading group. The tree starts from the minimal commitment that assertions can be assessed as proper or improper independently of truth or sincerity. It uses your specified distinctions to branch toward named positions, with each branching node framed as a question answerable without prior knowledge of the labels. The tree has 10 leaves (named positions), with unoccupied combinations noted at the end. Each leaf includes the position's standard name and one sentence on its most awkward commitment.

  ---

  ### Decision Tree for the Norm of Assertion

  **Start**: Assertions can be proper/improper apart from truth or sincerity.

  1. **Is the norm constitutive (defining what assertion *is*) or regulative (a rule for *good* assertion)?**
     - **Constitutive** → Go to 2
     - **Regulative** → Go to 6

  2. **What does the norm primarily attach to?**
     - **Speaker's state** (e.g., belief, knowledge) → Go to 3
     - **Act's relation to the world** (e.g., truth) → Go to 4
     - **Speaker's entitlement** (e.g., justification) → Go to 5

  3. **Does the norm license assertion in advance (warranting) or only make it criticisable/retractable afterwards (liability)?**
     - **Licensing (warranting)** → Go to 3.1
     - **Liability** → *Empty* (unattractive: constitutive norms are typically warranting; liability undermines the act's defining conditions)

     3.1. **Is the standard fixed or context-sensitive?**
       - **Fixed** → **Leaf: Knowledge Norm** (e.g., Williamson).  
         *Awkward commitment: It prohibits asserting unknowable truths (e.g., mathematical conjectures), even if justified and true.*
       - **Context-sensitive** → **Leaf: Contextualist Knowledge Norm** (e.g., DeRose).  
         *Awkward commitment: Propriety depends on variable contextual standards, potentially leaving speakers unable to gauge proper assertion.*

  4. **Does the norm license assertion in advance or only make it criticisable afterwards?**
     - **Licensing (warranting)** → *Empty* (incoherent: truth alone cannot warrant assertion without the speaker's relation to it)
     - **Liability** → Go to 4.1

     4.1. **Is the standard fixed or context-sensitive?**
       - **Fixed** → **Leaf: Truth Norm** (e.g., Weiner).  
         *Awkward commitment: It deems sincere, reasonable false assertions (e.g., a carefully vetted but misleading evidence case) improper.*
       - **Context-sensitive** → *Empty* (unexplored: truth is typically seen as fixed; contextual shifts are better handled under speaker-state norms)

  5. **Does the norm license assertion in advance or only make it criticisable afterwards?**
     - **Licensing (warranting)** → *Empty* (unattractive: entitlement is insufficient for constitutive warrant; risks permitting lucky assertions)
     - **Liability** → **Leaf: Constitutive Justification Norm** (e.g., Kvanvig, but contested).  
       *Awkward commitment: True assertions backed by undefeated evidence may still be improper if the speaker lacks "entitlement" (e.g., in skeptical contexts).*

  6. **What does the norm primarily attach to?**
     - **Speaker's state** → Go to 7
     - **Act's relation to the world** → Go to 8
     - **Speaker's entitlement** → Go to 9

  7. **Does the norm govern assertion as such or only its testimonial use?**
     - **Assertion as such** → **Leaf: Belief Norm** (e.g., Bach).  
       *Awkward commitment: It permits assertions that are accidentally true (e.g., a guess) if the speaker believes them, weakening testimony.*
     - **Testimonial use only** → **Leaf: Testimonial Belief Norm** (e.g., Owens).  
       *Awkward commitment: It cannot explain non-testimonial impropriety (e.g., asserting in a diary).*

  8. **Does the norm license assertion in advance or only make it criticisable afterwards?**
     - **Licensing (warranting)** → Go to 8.1
     - **Liability** → Go to 8.2

     8.1. **Does the norm govern assertion as such or only its testimonial use?**
       - **Assertion as such** → *Empty* (unattractive: warranting truth norms collapse into speaker-state norms)
       - **Testimonial use only** → **Leaf: Warrant to Assert Truth Norm** (e.g., Lackey).  
         *Awkward commitment: It allows untestimonially warranted false assertions (e.g., a lie that accidentally benefits the hearer).*

     8.2. **Whose norm is it? (Speaker, hearer, or conversation?)**
       - **Speaker's norm** → **Leaf: Speaker Truth Liability Norm** (e.g., Pagin).  
         *Awkward commitment: Speakers can be blamed for true assertions if they lacked evidence, even if the hearer benefits.*
       - **Hearer's norm** → **Leaf: Assurance Norm** (e.g., Moran).  
         *Awkward commitment: Hearers can "validate" improper assertions (e.g., accepting a lie) without resolving speaker obligations.*
       - **Conversation's norm** → **Leaf: Conversational Truth Norm** (e.g., McKinnon).  
         *Awkward commitment: Group standards can override individual responsibility (e.g., in a biased community).*

  9. **Is the standard fixed or context-sensitive?**
     - **Fixed** → **Leaf: Justification Norm** (e.g., Kvanvig).  
       *Awkward commitment: It permits false assertions if justified (e.g., a misleading evidence case), undermining testimony.*
     - **Context-sensitive** → **Leaf: Reasonable to Believe Norm** (e.g., Douven).  
       *Awkward commitment: Propriety hinges on variable practical stakes (e.g., asserting "the bridge is safe" in low- vs. high-risk contexts).*

  ---

  ### Unoccupied Combinations & Why
  1. **Constitutive + Liability + Speaker-State** (Step 3: Liability):  
     - *Empty because unattractive*: Constitutive norms define assertion, so liability-only (no advance warrant) risks making assertion indistinguishable from other acts (e.g., guessing).
  2. **Constitutive + Licensing + Act-Relation** (Step 4: Warranting):  
     - *Empty because incoherent*: Truth alone cannot warrant assertion without the speaker’s epistemic relation to it (e.g., a lucky true assertion shouldn’t be licensed).
  3. **Regulative + Licensing + Act-Relation + Assertion-as-such** (Step 8.1: Assertion as such):  
     - *Empty because unattractive*: Warranting truth norms reduce to speaker-state norms (e.g., knowledge or justification) to avoid permitting baseless assertions.
  4. **Regulative + Liability + Speaker-Entitlement + Context-Sensitive**:  
     - *Empty because unexplored*: No major theory pairs liability with context-sensitive entitlement; most contextualist norms focus on licensing.

  ### Positions the Tree Cannot Separate
  - **Knowledge vs. Justification Norms**: When contextualized (e.g., Contextualist Knowledge vs. Reasonable to Believe), they converge if "knowledge" is treated as context-sensitive justification. The tree separates them via the constitutive/regulative split (Steps 3.1 vs. 9).
  - **Testimonial Belief vs. Assurance Norms**: They agree that testimony is central but disagree on attachment (speaker-state vs. act-relation). The tree separates them via the attachment and "whose norm" splits (Steps 7 vs. 8.2).

  This tree yields 10 leaves, covering major positions while respecting your distinctions. Use it to diagnose disagreements by tracing splits (e.g., contextualism vs. fixed norms) or expose collapsed distinctions (e.g., constitutive warranting vs. regulative licensing).
