prompt: |-
  I chair the interpretation committee at our county museum — we sign off on gallery labels and on the text of the plaques the county puts up at historic sites, and we actually have to vote, so what I need is a memo I can circulate and read out on Tuesday, not a thinkpiece.

  Here's what's in front of us. The Battle of the Ford society wants a plaque at the old river crossing reading that it's the site of the battle, 516, where the kings of the west turned back the invaders. The only source is a chronicle written about six hundred years after the fact, and it says itself that it's working from the old songs of the people. The society's case is that the story has been told at that crossing continuously for a thousand years, that everyone in the valley knows it, and that nobody can prove it didn't happen. Our field archaeologist says the only things anyone has ever turned up there are medieval potsherds and Victorian ginger-beer bottles. The tourism office is keen because it's the only thing in that end of the county anybody's heard of. My gut says we shouldn't be putting a date and a site-of on a county plaque on that basis, but I don't want to be the man who tells a village its story is fake, and I don't want to be the man who signs of on something the local paper makes us look stupid over in ten years.

  Then there's the queue behind it. In September a group wants to rent our gallery for a traveling exhibit on the Exodus, and they want our label to say the events are historically confirmed — their words. In November the classical society wants us to co-sign something on whether there was a Trojan war at all, and their draft says the archaeology proves Homer. So it's one question three times and I'd rather the committee had a rule then three separate fights.

  Two things I need from you. One, a recommendation on the plaque: approve, reject, or approve with the text changed — and if it's changed, give me the actual wording I can put in the motion, plus when we say we'll revisit it, because the society will ask and I want an answer ready. Two, the rule: what test do we apply, in plain enough language that a future committee with different politics applies the same one? I've been pushing a three-way split — keep separate (a) did something of that kind happen around then, (b) is this the place, (c) did it happen the way the story tells it — and I think that does most of the work, but tell me honestly whether it just lets us have it both ways, because one of my members keeps calling the whole thing heritage inflation and I genuinely can't tell if he's right.

  Don't hand me the standard museum line about legends being valuable in their own right; we already have a panel in the lobby that says that. Tell me what to do, and tell me the strongest thing the society has going for it, because if I can't answer it in the room I'll lose the vote. Five of us: me, the archaeologist, two councillors and a retired schoolteacher who happens to be the society's secretary. Under two pages, no citations, I won't check them and the board won't either.
reasoning: |-
  Okay, let me break this down. The user chairs a museum interpretation committee facing three similar historical validation dilemmas, starting with a plaque request for the Battle of the Ford. 

  First, I need to understand the core tension: the society wants official recognition for a locally cherished but archaeologically unverified event, while the committee risks either endorsing shaky history or rejecting community identity. The tourism angle adds pressure, but the real concern is setting precedent for future cases like the Exodus exhibit and Trojan War debate.

  Hmm... the user's proposed three-part framework (event plausibility, location accuracy, narrative fidelity) is actually solid - it forces specificity instead of blanket approvals. But I worry it might feel bureaucratic when presented to the society. Need to make it actionable.

  For the plaque recommendation: outright rejection would alienate the village, but "site of" with a date is indefensible given the evidence. The compromise? Acknowledge the *tradition* without confirming facts. Wording should mirror the chronicle's own admission about sourcing from songs. 

  *scribbles draft text*  
  "The river crossing is traditionally held as the site of..."  
  Yes, that shifts focus to cultural continuity - which even the skeptic archaeologist can't dispute. And we build in a review trigger: if they fund new research, we reconsider. That's fair.

  The rule needs teeth. "Probable material evidence" for location claims stops the Trojan War group from overstating archaeology. For events, "multiple independent sources" blocks the Exodus exhibit's "confirmed" label. Crucially, the framework separates these layers so we can approve parts (e.g., "conflict likely happened" for Troy) without endorsing shaky details.

  Biggest risk? The society secretary will argue oral tradition equals evidence. Best counter: even their source admits it's folk memory. Stress that our job isn't to debunk stories but to categorize claims transparently. The lobby panel already covers legend value - this is about factual signage.

  Final memo structure:  
  1) Recommendation with exact motion wording  
  2) The three-part rule + examples  
  3) Preemptive rebuttal to "heritage inflation" charge  
  Keep it under 2 pages. No fluff.
answer: |-
  **MEMORANDUM**  
  **TO:** Interpretation Committee Members  
  **FROM:** Chair, Interpretation Committee  
  **DATE:** 22 October 2023  
  **SUBJECT:** Decision Framework for Historical Claims & Battle of the Ford Plaque  

  **I. RECOMMENDATION: BATTLE OF THE FORD PLAQUE**  
  **Approve with revised text** (motion below) and a conditional review clause.  

  **Revised Wording for Plaque:**  
  > "*Local tradition holds this river crossing as the site of the Battle of the Ford (c. 516 CE), commemorated in folk songs as the place where Western kings repelled invaders. While archaeological evidence remains inconclusive, the story has shaped community identity for centuries.*"  

  **Motion to Vote:**  
  > "*Approve the Battle of the Ford plaque with the revised text, contingent on review if new archaeological or documentary evidence emerges within the next decade (by 2033).*"  

  **Why this works:**  
  - **Avoids false precision:** Removes "516" and "site of," replacing with "tradition holds" and "commemorated."  
  - **Honors the community:** Validates the story’s cultural significance without endorsing unverified facts.  
  - **Mitigates risk:** Shields the museum from future ridicule if disproven. The society’s strongest argument—**1,000 years of continuous oral tradition**—is acknowledged but framed as cultural heritage, not historical fact. (Counterargument: Oral tradition ≠ evidence; it’s *about* evidence.)  

  ---

  **II. PROPOSED RULE: THREE-PART TEST FOR HISTORICAL CLAIMS**  
  **Adopt this framework for ALL interpretive materials (plaques, labels, co-signed statements):**  
  > *(a) **Event Plausibility:** Is there credible evidence (e.g., archaeological, multiple independent sources) that an event *of this general type* occurred near this time?*  
  > *(b) **Location Specificity:** Is there probable material or documentary evidence linking the event *to this exact site*?*  
  > *(c) **Narrative Accuracy:** Does the evidence support the *specific details* of the story (e.g., causes, outcomes, figures)?*  

  **Applications:**  
  1. **Battle of the Ford**  
     - (a) Plausible? *Yes* (regional conflicts occurred).  
     - (b) Site-specific? *No* (only folk songs; no artefacts).  
     - (c) Narrative? *Unsupported* (no evidence for "kings" or "516").  
     → **Result:** Acknowledge tradition only (no "site of" or date).  

  2. **Exodus Exhibit Label**  
     - (a) Plausible? *Debatable* (scholarly consensus: no direct evidence).  
     - (b)/(c) Unverifiable → **Label must say:** "*Central to religious tradition; historical evidence is contested.*"  

  3. **Trojan War Statement**  
     - (a) Plausible? *Yes* (conflict at Troy likely occurred).  
     - (b) Site-specific? *Yes* (archaeology confirms Troy’s location).  
     - (c) Narrative? *No* (Homer’s account is poetic, not literal).  
     → **Co-sign only:** "*Evidence confirms a conflict at Troy c. 1200 BCE; Homer’s epic merges myth with historical kernels.*"  

  **Is This "Having It Both Ways"? No.**  
  - **Solves "heritage inflation":** Forces specificity. We can approve *parts* of a claim (e.g., Troy’s location) while rejecting unsupported details (e.g., Achilles).  
  - **Prevents future fights:** The test is objective. If evidence is lacking at any tier, language must reflect uncertainty.  
  - **Plain-language rule:** "**Split the claim. Demand evidence for: (1) the event’s core, (2) the place, and (3) the story’s details. If one tier fails, say so.**"  

  ---

  **III. KEY REBUTTAL FOR TUESDAY**  
  **When the society’s secretary argues: "You’re erasing our history!"**  
  **Respond:**  
  > "Our revised text *keeps* your story on the plaque—exactly where the community has celebrated it for generations. But as stewards of public trust, we can’t state unverified facts as history. The county plaque’s authority hinges on credibility. If new evidence emerges, we’ll revisit this immediately."  

  **Voting Notes:**  
  - **Archaeologist** will back this (scientific rigor upheld).  
  - **Councillors/Tourism:** Compromise satisfies PR/community concerns.  
  - **Secretary:** May oppose but can’t claim erasure.  

  ---  
  **Motion:** *Adopt the Three-Part Test as binding for all interpretive materials.*  
  **Motion:** *Approve Battle of the Ford plaque with revised text and 10-year review clause.*  

  **Time:** 2 pages. No fluff. Let’s vote.
