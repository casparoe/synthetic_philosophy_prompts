answer: |-
  ### Joint Statement: Adversarial Collaboration on the Authority of Objective Chance over Rational Credence

  **Introduction**  
  This document presents the results of an adversarial collaboration between two camps: the **deferrers** and the **skeptics**. The deferrers hold that objective chance, by its nature, has distinctive normative authority over rational credence, such that a credence must match a known chance when evidence is admissible. The skeptics hold that chance is merely an indicator of what total evidence supports, with no inherent authority, so credence may rationally diverge from a known chance. Both camps address two shared agenda items: the *Two Levels* case and the principle *LRD*. The document follows the prescribed structure.

  ---

  ### 1. Agreed Claims  
  Both camps endorse the following claims, which are non-vacuous and reflect common ground:  

  1. **Objective chance is non-epistemic**: It is an objective feature of the world, not reducible to subjective beliefs or evidence.  
  2. **Chance supervenes on patterns**: Chance is grounded in the world’s history, regularities, and structural features.  
  3. **Chance connects to frequencies**: For events with a stable objective chance \(p\), the long-run frequency of occurrence converges to \(p\).  
  4. **Chance plays an explanatory role**: The objective chance of an event is often part of the best explanation for observed patterns involving that event.  
  5. **Chance is practically relevant**: In ordinary situations, when an agent knows the chance of an event and lacks undermining evidence, setting credence equal to the chance is typically rational.  
  6. **The Principal Principle is a central reference point**: Any adequate account of chance must engage with the intuition captured by the Principal Principle (i.e., that known chance and admissible evidence constrain credence).  
  7. **Admissibility is non-trivial**: Evidence admissible with respect to an event (i.e., evidence that does not directly bear on the event beyond the chance hypothesis) is a coherent notion, though its boundaries may be contested.  

  ---

  ### 2. Disagreements Table  
  The table below summarizes the core dispute. Each camp states its position in its own terms and characterizes what it takes the other to deny.  

  | **Dispute** | **Deferrers' Position** | **Skeptics' Position** | **Deferrers' Characterization of Skeptics' Denial** | **Skeptics' Characterization of Deferrers' Denial** |
  |-------------|-------------------------|------------------------|----------------------------------------------------|----------------------------------------------------|
  | **The normative authority of chance over credence** | "Objective chance is constitutively a guide to rational credence: if an agent knows the chance of \(A\) is \(x\) and her other evidence is admissible with respect to \(A\), then her credence in \(A\) must be \(x\). A credence that departs from the known chance under these conditions is irrational, as the chance-credence link defines what it is to be a chance." | "Objective chance is an evidentially useful pattern but has no constitutive authority over credence. Credence answers solely to total evidence; chance is a defeasible indicator. When an agent knows the chance of \(A\) is \(x\) and has admissible evidence, her credence may rationally diverge from \(x\) if her total evidence supports it." | "The skeptics deny that chance is constitutively normative. They deny that a credence diverging from a known chance, even with admissible evidence, is necessarily irrational." | "The deferrers deny that chance is merely evidentiary. They deny that credence can ever rationally diverge from a known chance when evidence is admissible." |

  ---

  ### 3. Verdicts on the Two Levels Case and LRD  
  Each camp provides its verdict on the *Two Levels* case and the principle *LRD*, including acceptance of *LRD*, minimal amendments (if rejected), the recommended credence for \(H\), and grounds for the verdict.  

  #### **Deferrers' Verdict**  
  - **On LRD**: We reject *LRD* as stated. The least amendment is to add a uniqueness clause: "For any level, and for any proposition \(H\) expressible at that level, if the chance function at that level is the unique function satisfying all chance platitudes, then an agent who knows this chance to be \(x\) and has admissible evidence must set credence in \(H\) to \(x\)."  
  - **On the Two Levels case**: The case is impossible. The stipulation that both levels have a function satisfying all platitudes for chance fails because the platitudes (e.g., chance as a guide to credence) imply that chance must be unique for a given proposition and world. Specifically, the existence of two conflicting chances (0.5 and 0.9) for the same \(H\) violates the requirement that chance is the single best systematization of the world’s patterns.  
  - **Recommended credence for \(H\)**: Not applicable (case is incoherent). If pressed, we would require specifying which level is fundamental; credence would then match the chance at that level.  
  - **Grounds**: Chance is defined by its role in constraining credence via the Principal Principle. If two candidates both fit the role, the concept collapses. The platitudes include implicit uniqueness, as multiple chances for \(H\) would force irrational credence conflicts.  

  #### **Skeptics' Verdict**  
  - **On LRD**: We reject *LRD* as stated. The least amendment is to weaken "must be \(x\)" to "should be \(x\) absent defeaters": "For any level, any proposition \(H\) expressible at that level, and any agent who knows the chance of \(H\) at that level to be \(x\) and whose other evidence is admissible with respect to \(H\), the agent’s credence in \(H\) should be \(x\) unless her total evidence supports a different credence."  
  - **On the Two Levels case**: The case is coherent and possible. Both chance functions can satisfy platitudes at their respective levels (e.g., by being the best explanation for patterns at that level of description).  
  - **Recommended credence for \(H\)**: The agent’s credence should be 0.7 (the average of 0.5 and 0.9). Alternatively, it could be a weighted mean (e.g., favoring fine-grained chances if they are more precise), but without further evidence, 0.7 best reflects the total evidence.  
  - **Grounds**: Credence must respond to total evidence, which here includes two chance values for \(H\). Neither chance has authority; both are evidence. The conflict shows chances are patterns, not normative constraints. The credence should minimize expected inaccuracy (e.g., via squared-error loss) given both chances as evidence.  

  ---

  ### 4. Crux Section  
  For each crux, we state the sub-question, an agreed-upon argument/case/result that bears on it, and each camp’s pre-registered prediction.  

  #### **Crux 1: Uniqueness of Chance**  
  - **Sub-question**: Do the platitudes for chance (non-epistemic, explanatory, frequency-constraining, and credence-guiding) entail that there is a unique chance function for a given world?  
  - **Agreed-upon test case**: A formal analysis of whether the platitudes imply uniqueness, using frameworks like the Humean Best System Account (BSA). Both camps agree that if BSA-style constraints (simplicity, strength, fit) can yield multiple "best" systems at different levels without contradiction, this bears on uniqueness.  
  - **Deferrers' prediction**: The platitudes do entail uniqueness; any multi-system case (e.g., Two Levels) reveals a flaw (e.g., one system is not truly "best").  
  - **Skeptics' prediction**: The platitudes do not entail uniqueness; multiple systems can satisfy them (e.g., coarse-grained systems excel in strength, fine-grained in fit).  

  #### **Crux 2: Rationality of Divergence**  
  - **Sub-question**: Can an agent with admissible evidence and known chance \(x\) for \(A\) rationally have a credence in \(A\) that is not \(x\)?  
  - **Agreed-upon test case**: A modified *Coin with Anomalous Frequency* case: An agent knows a coin’s chance of heads is 0.5 (per a reliable theory) but also knows that in a large, causally isolated sequence of tosses (not including the target toss), the frequency of heads was 0.8. Both camps agree the frequency evidence is admissible (it does not directly concern the target toss).  
  - **Deferrers' prediction**: The agent must set credence to 0.5; diverging is irrational, as chance screens off admissible frequency evidence.  
  - **Skeptics' prediction**: The agent can rationally set credence to 0.8; total evidence (including the frequency) overrides the chance indicator.  

  #### **Crux 3: Authority in Conflict**  
  - **Sub-question**: In cases of conflicting chances (e.g., Two Levels), does rational credence require deferring to one chance, or can it incorporate both?  
  - **Agreed-upon test case**: A decision-theoretic model where agents use chances to minimize expected loss (e.g., Brier score). Both camps agree that comparing the accuracy of deferring to a single chance versus averaging will test if authority is distinctive.  
  - **Deferrers' prediction**: Deferring to the fundamental chance (if specified) yields best accuracy; averaging is less accurate and irrational.  
  - **Skeptics' prediction**: Averaging chances as evidence yields best accuracy; deferring to one ignores evidence.  

  ---

  ### 5. Closing Section  
  - **Merely verbal disputes**: No disputes are merely verbal. Both camps agree that "chance," "admissible," and "credence" are used with shared definitions. The core disagreement is substantive: whether chance has normative authority (constitutive for deferrers, evidentiary for skeptics).  
  - **What would move each camp**:  
    - **Deferrers**: Would be moved if (i) a case shows rational credence diverging from a known chance with admissible evidence (e.g., in *Coin with Anomalous Frequency*, 0.8 credence dominates 0.5 in accuracy), or (ii) uniqueness is falsified (e.g., a consistent model with multiple chance functions for one world).  
    - **Skeptics**: Would be moved if (i) no case allows rational divergence without irrationality (e.g., diverging credences always yield worse accuracy), or (ii) the concept of chance becomes incoherent without constitutive authority (e.g., if "chance" reduces to mere pattern without normative force).  

  ---  
  **Signed,**  
  *The Deferrers and The Skeptics*  
  *Date: 2023-10-15*
