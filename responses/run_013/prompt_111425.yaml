  Below is a 10-item quiz designed to sort participants into one of the seven positions on the Knobe effect, based on their intuitive judgments about concrete cases. Each case is a variation on the classic chairman scenario, with answer options that force a choice between key intuitions. The cases are written to be accessible without prior knowledge of experimental philosophy, and they incorporate your requested elements (e.g., conventional norms, blameworthy acts with good side effects, non-human agents, low probability, first-person, and desired side effects).

  ---

  ### **Experimental Philosophy Quiz: The Knobe Effect Explained?**

  **Instructions:** For each scenario, answer whether the agent intentionally brought about the side effect. Choose the option that feels most intuitively correct to you. There are no right or wrong answers—this is about your gut reactions.

  1. **The Chairman (Harm Version)**  
     A chairman is told a new program will increase profits but harm the environment. He says, “I don’t care about harming the environment; I just want to make profits.” The program runs, and the environment is harmed.  
     Did the chairman intentionally harm the environment?  
     ☐ Yes  
     ☐ No  

  2. **The Chairman (Help Version)**  
     A chairman is told a new program will increase profits but help the environment. He says, “I don’t care about helping the environment; I just want to make profits.” The program runs, and the environment is helped.  
     Did the chairman intentionally help the environment?  
     ☐ Yes  
     ☐ No  

  3. **The Rule-Breaking Editor**  
     An editor is told that using a shortcut will save time but violate the journal’s style guide (a purely conventional rule with no moral implications). She says, “I don’t care about the style guide; I just want to save time.” She uses the shortcut, and the style guide is violated.  
     Did the editor intentionally violate the style guide?  
     ☐ Yes  
     ☐ No  

  4. **The Landlord and Refugees**  
     A landlord evicts tenants to raise rents (a blameworthy act), knowing this will allow refugees to be housed in the building. He says, “I don’t care about housing refugees; I just want higher rents.” The refugees are housed.  
     Did the landlord intentionally house the refugees?  
     ☐ Yes  
     ☐ No  

  5. **The Corporate Board’s Emissions**  
     A corporate board votes to cut costs, knowing this will raise carbon emissions. They say, “We don’t care about raising emissions; we just want to cut costs.” Emissions rise.  
     Did the board intentionally raise emissions?  
     ☐ Yes  
     ☐ No  

  6. **The Low-Probability Harm**  
     A CEO is told a new product has a 40% chance of harming the environment. She says, “I don’t care about the environment; I just want profits.” She launches it, and the environment is harmed.  
     Did the CEO intentionally harm the environment?  
     ☐ Yes  
     ☐ No  

  7. **First-Person Harm**  
     *Imagine you are the CEO.* You are told your decision will harm the environment. You think, “I don’t care about the environment; I just want profits.” You proceed, and the environment is harmed.  
     Did you intentionally harm the environment?  
     ☐ Yes  
     ☐ No  

  8. **The Hostile Factory Manager**  
     A factory manager chooses a method that harms the environment. He says, “I *want* to harm the environment—it will lower property values so I can buy land cheaply.” The environment is harmed.  
     Did the manager intentionally harm the environment?  
     ☐ Yes  
     ☐ No  

  9. **The Doctor’s Justified Side Effect**  
     A doctor performs a life-saving surgery knowing it will cause the patient to lose a finger (a bad outcome, but the act is not blameworthy). The doctor says, “I don’t care about the finger; I just want to save the life.” The finger is lost.  
     Did the doctor intentionally cause the loss of the finger?  
     ☐ Yes  
     ☐ No  

  10. **The Video Game Beep**  
      Alex plays a game where pressing a button earns points but causes a loud, annoying beep (a neutral side effect—not a norm violation). Alex says, “I don’t care about the beep; I just want points.” The beep sounds.  
      Did Alex intentionally cause the beep?  
      ☐ Yes  
      ☐ No  

  ---

  ### **Scoring Key and Position Mapping**
  Score your answers as follows: Assign **1 point for "Yes"** and **0 points for "No"** for each item. Then, tally your total "Yes" answers for the **critical cases** listed below to map your response pattern to one of the seven positions. If your pattern doesn’t match any position perfectly, use the "closest fit" based on the majority of critical cases.

  #### **Mapping Logic (Based on Theoretical Predictions):**
  - **Position 1 (Moralized Concept)**: Intentionality requires a morally bad side effect. Expects "Yes" for cases with moral badness (1, 5, 6, 7, 9) and "No" for others (2, 3, 4, 8, 10).  
    *Critical cases*: Must answer **Yes to Case 9** (justified bad) and **No to Case 3** (conventional norm).  

  - **Position 2 (Pragmatic)**: The question is interpreted as "knowingly or on purpose." Expects "Yes" for all cases except the help version (Case 2).  
    *Critical cases*: Must answer **Yes to Case 10** (neutral beep) and **No to Case 4** (good side effect).  

  - **Position 3 (Performance Error)**: Blame distorts answers; the "correct" answer is "No" unless the agent actively wanted the outcome. Expects "Yes" only for blameworthy bads (1, 5, 6, 7) and Case 8 (wanted), "No" elsewhere.  
    *Critical cases*: Must answer **No to Case 9** (justified bad) and **Yes to Case 5** (non-human agent).  

  - **Position 4 (Blame First)**: Intentionality is downstream of blame; blameworthy agents get "Yes" for bad outcomes. Expects "Yes" for cases with blame + badness (1, 3, 6, 7, 8), "No" for others.  
    *Critical cases*: Must answer **No to Case 9** (justified bad) and **Yes to Case 3** (conventional norm).  

  - **Position 5 (Norm Violation)**: Intentionality requires violating any norm (moral or conventional). Expects "Yes" for norm violations (1, 3, 5, 6, 7, 8), "No" for non-violations (2, 4, 9, 10).  
    *Critical cases*: Must answer **Yes to Case 3** (conventional norm) and **No to Case 9** (justified bad).  

  - **Position 6 (Vignette Artifact)**: The cases are flawed; no consistent inference about concepts. Expects random or uniform answers (e.g., all "Yes" or all "No"), or rejects asymmetry.  
    *Critical cases*: **No pattern**; defaults if answers don’t fit other positions.  

  - **Position 7 (Dual-Character)**: Descriptive core (knowledge/control) + normative dimension. Expects "Yes" when both are present (1, 3, 5, 6, 7, 8), "No" when normative dimension is missing (2, 4, 9, 10).  
    *Critical cases*: Must answer **Yes to Case 3** (conventional norm) and **No to Case 9** (justified bad).  

  #### **Scoring Steps:**
  1. **Tally your "Yes" answers for Cases 3, 5, 9, and 10** (these are the most load-bearing for distinguishing positions).  
  2. **Compare your answers to the critical cases for each position** (e.g., if you answered "No" to Case 3 and "Yes" to Case 9, Position 1 is likely).  
  3. **Map your pattern** using the table below. If multiple positions fit, prioritize the one matching the most critical cases.  
  4. **Default to Position 6** if your answers are inconsistent (e.g., "Yes" for both help and harm) or uniform (all "Yes" or all "No").  

  | Position | Case 3 (Editor) | Case 5 (Board) | Case 9 (Doctor) | Case 10 (Beep) | Other Key Cases |
  |----------|-----------------|----------------|-----------------|----------------|---------------|
  | 1        | No              | Any            | Yes             | Any            | Yes on 1, 6, 7; No on 2, 4, 8 |
  | 2        | Yes             | Any            | Any             | Yes            | No on 2, 4; Yes on 1, 5, 6, 7, 8 |
  | 3        | No              | Yes            | No              | Any            | Yes on 1, 6, 7; No on 2, 4, 8 |
  | 4        | Yes             | No             | No              | Any            | Yes on 1, 6, 7, 8; No on 2, 4 |
  | 5        | Yes             | Yes            | No              | No             | Yes on 1, 6, 7, 8; No on 2, 4 |
  | 6        | **Inconsistent or uniform pattern** (e.g., all "Yes" or all "No") | | | | |
  | 7        | Yes             | Yes            | No              | No             | Yes on 1, 6, 7, 8; No on 2, 4 |

  #### **What Your Answers Reveal:**
  - **Position 1 (Moralized Concept)**: You think moral badness directly shapes intentionality.  
  - **Position 2 (Pragmatic)**: You think the question is ambiguous (e.g., "Did they do it on purpose?").  
  - **Position 3 (Performance Error)**: You blame distorts intuitions; the "real" answer depends on the agent’s aim.  
  - **Position 4 (Blame First)**: You think moral judgment drives intentionality verdicts.  
  - **Position 5 (Norm Violation)**: You think any norm breach (not just moral) matters.  
  - **Position 6 (Vignette Artifact)**: You distrust the cases or think they don’t reveal deep truths.  
  - **Position 7 (Dual-Character)**: You think intentionality has descriptive and normative parts.  

  ---

  ### **Limitations and Caveats**
  1. **Indistinguishable Positions**:  
     - **Position 5 (Norm Violation) and Position 7 (Dual-Character) cannot be separated** by this quiz. Both predict identical answers (e.g., "Yes" for norm violations like Case 3 and "No" for Case 9). To distinguish them, we’d need a case where a norm is violated without the agent being aware (e.g., "Did they intentionally violate an unknown rule?"), which isn’t included here.  
     - **Why?** These views converge in most cases—Position 7 is a refinement of Position 5, not a competitor.  

  2. **Load-Bearing Item**:  
     - **Case 9 (Doctor)** is the most critical. If someone answers "No" on Case 9, they likely hold Positions 3, 4, 5, or 7 (blame/norm-focused). If they answer "Yes," they likely hold Position 1 or 2 (badness-focused). If Position 1 supporters answered "No" on Case 9, they’d shift to Position 4 (blame-first).  

  3. **Empty Answer Patterns**:  
     - **Position 6 (Artifact) is the only "empty" pattern** (inconsistent/uniform answers). This isn’t due to incoherence but because it’s a catch-all for skepticism.  
     - **Why no other empties?** All other positions are covered because the cases force distinctions (e.g., Case 3 separates moralized vs. norm-based views).  

  4. **Where Scoring Might Misfire**:  
     - **Case 5 (Board) is most likely to misfire**. If people anthropomorphize the board (seeing it as blameworthy), they might answer "Yes," aligning with Positions 3, 5, or 7. If they see it as non-agential, they’ll say "No," aligning with Position 4. To correct for this:  
       - If someone answers "No" on Case 5 but "Yes" on Cases 1 and 6, move them from Position 4 to Position 3.  
       - If they answer "Yes" on Case 5 but "No" on Case 3, move them from Position 5/7 to Position 1.  
     - **Case 4 (Landlord) might also misfire** if people conflate blame for the eviction with intentionality for the refugees. If someone answers "Yes" here, move them from Position 1/2 to Position 4.  

  This quiz prioritizes real-world intuitions over theoretical purity, making it engaging for a reading group. Use it to spark debate—e.g., "Why did you all answer differently on Case 9?"—and let the patterns reveal underlying assumptions. For deeper dives, pair it with readings from Knobe, Nadelhoffer, or Nichols.
