prompt: |-
  I serve on the elected school board of a mid-sized public school district. I have no academic background — no genetics, no statistics, no philosophy beyond what I have read on my own — and I have been trying to work out, for myself, what to do with a certain kind of argument that keeps arriving at our meetings. Before nearly every vote we take on a program (a new reading curriculum, an expansion of pre-kindergarten, a tutoring corps, a change in how we group students), someone will tell the board that the trait we are trying to move is "about seventy per cent heritable," or "mostly genetic," and will draw a conclusion from that number: that the program cannot work, or cannot work for the children we are most worried about, or that the money should go elsewhere. Occasionally the same sort of number is used for the opposite conclusion — that because a trait is only partly heritable, a program aimed at the environment is bound to succeed. I am suspicious of nearly all of this, but I do not want to dismiss a genuine consideration merely because it is usually deployed badly, and I cannot tell from the inside whether my suspicion is judgment or prejudice. We vote in two weeks; I want to have this settled before then.

  What I want is a procedure I can run myself, in an evening at my kitchen table, on a claim of that shape, which tells me whether the number, whatever it is, bears on the vote in front of us, and if it bears, in exactly what way. Please give me an ordered sequence of questions to ask — no more than ten steps, and if a step is really two questions, split it, but do not pad — with a clear statement of what would count as a sufficient answer to each, what I should do when I cannot get an answer, and which steps are judgment calls dressed up as procedure. Some steps should be able to end the inquiry outright with a finding that the claim does not bear on this decision at all, and I want that finding to be available even when the number is real, the study is sound, and the scientist is honest. Other steps should be able to do the reverse and show that a particular claim does bear, and that we should change what we are doing, because a procedure that can only ever dismiss claims is not a procedure; it is my prior with steps. If a step requires a number or a document I cannot realistically obtain, say what a defensible substitute is, or say plainly that the step cannot be completed and what that failure means for the rest. I will be running this alone; the vote belongs to the board, and I need to know which questions I should not try to answer by myself.

  Three things I would like the procedure to handle specifically, because they are where my own grip slips. First, the difference between a number that describes why children in this district differ from one another and a number that says anything about what would happen to those children if we changed something; I have a feeling these come apart, but I cannot state how. Second, the case where what the board actually cares about is whether children will differ in how much they benefit from the program — whether some gain and others do not — and whether that variation has anything to do with the number being quoted at us; if it is measured differently, say so and tell me what I would need to look at instead. Third, the point that such a number is always relative to a particular population and a particular range of environments, so that it may not carry over to ours; I want a step that makes me check whether the study was done on students like ours, measured the way we measure things, at the same age.

  Then run the procedure on three claims, and tell me where it gives an answer I will not enjoy. (1) A parent tells the board that reading ability is roughly seventy per cent heritable, and that this is why the proposed curriculum change will not close the gap between our strongest and weakest readers. (2) A consultant argues that since the same trait is only about thirty per cent heritable, the environment accounts for the rest, and our new program should therefore work. (3) A vendor offers to screen incoming kindergarteners with a DNA-based score to identify those likely to struggle, citing a high heritability estimate from a study carried out in another country and another school system. For each, I want to know which steps decide it, what the number does and does not tell us, what the board should actually do, and what the procedure leaves unsettled.

  I would also like the procedure to be honest about its own failure modes: the kinds of claim it will wrongly wave away, the kinds it will wrongly take seriously, and the point at which the honest answer is that the board is arguing about values rather than about genetics and should say so out loud. I would find it useful if the procedure supplied a sentence or two I could say at a meeting, in plain language, when the finding is that the number does not bear on the decision — and also a warning about when saying that would be unfair.

  Please give me the procedure first as a table with these columns, one row per step:

  - step (number)
  - question (the question I ask)
  - sufficient answer (what counts as enough to move on)
  - if I cannot answer (what to do instead)
  - effect on the decision (one of: stops the claim, narrows the claim, hands off to the board)

  After the table, give me the three worked cases as a single JSON object with exactly these fields: a top-level "procedure_limits" array of strings; and a "cases" array, each element having "case_name", "claim_as_made", "steps_that_decide_it" (array of step numbers), "verdict" (one of "does_not_bear", "bears_in_a_limited_way", "unusable_as_stated"), "what_the_number_does_say", "what_the_board_should_do", "what_the_procedure_cannot_settle", "whose_judgment_call", and "plain_language_line" (the sentence I could say at the meeting).
reasoning: |-
  We are creating a procedure to evaluate claims about heritability in the context of school board decisions. The procedure must have no more than 10 steps, be practical for an individual to run in an evening, and address the three specific concerns the user raised.

  Key concepts to address:
  1. Heritability (h²) is the proportion of phenotypic variation in a trait (e.g., reading ability) that is due to genetic variation in a particular population at a particular time. It does not indicate how much of an individual's trait is genetic nor how much the trait can be changed by environmental interventions.
  2. High heritability does not imply that the trait is immutable. Even highly heritable traits can be changed by environmental changes (e.g., height is highly heritable but improved nutrition has increased average height over generations).
  3. Heritability estimates are context-dependent: they depend on the population and the range of environments present in that population. A heritability estimate from one population may not apply to another.
  4. The claim that a program "cannot work" because a trait is heritable confuses variation within a population with the potential to change the population mean. A program might shift the mean of the trait for all children without affecting the variation (or even while reducing variation).

  The procedure will have steps that:
  - Check the relevance of the heritability claim to the specific decision (e.g., does it address the program's goal?).
  - Examine the population and environment in the study versus the local context.
  - Consider the goal of the program (e.g., shifting the mean vs. reducing variation).
  - Check for direct evidence about the program's effectiveness (if available).

  We design the steps to be as objective as possible, but some steps are judgment calls.

  Procedure Table:

  | Step | Question | Sufficient Answer | If I cannot answer | Effect on the decision |
  |------|----------|-------------------|-------------------|------------------------|
  | 1 | Is the heritability claim being used to argue about the potential effectiveness of a program or about the variation in outcomes? | Clear statement of the claim's purpose in the argument (e.g., "The claim is that because the trait is heritable, the program won't change the average outcome" or "The claim is that because the trait is heritable, we cannot reduce the gap between students"). | If the purpose is unclear, note the ambiguity and proceed to Step 2 to check the number. | Narrows the claim |
  | 2 | Is the heritability estimate (the number) from a reputable study that actually measured heritability for the trait in question? | A peer-reviewed publication or a meta-analysis that directly estimates heritability for the trait (with a clear method, e.g., twin study). If the number is a commonly accepted estimate (like 70% for reading ability) and no specific study is cited, that is acceptable. | If the source is missing, unclear, or not peer-reviewed, then the claim is unusable as stated. | Stops the claim (if no) or narrows (if yes) |
  | 3 | Does the study population (or the population in the meta-analysis) resemble our district's students in terms of age, background, and the range of environments? | The study population should be similar in age and in key demographic factors (e.g., socioeconomic diversity, urban/rural). The environments in the study should cover a range comparable to or wider than our district. | If the study population is very different (e.g., another country with a different education system) and no adjustment is provided, note the mismatch and proceed with caution. | Narrows the claim |
  | 4 | Is the heritability estimate being interpreted as a limit on how much the trait can be changed (i.e., that because the trait is heritable, the environment cannot change it)? | Yes or no. | If unclear, assume yes for the sake of the next step. | Narrows the claim |
  | 5 | If Step 4 is yes, is there direct evidence that the specific program (or similar programs) has been shown to change the trait in a population similar to ours? | Existence of at least one well-conducted study (e.g., randomized controlled trial, quasi-experimental) that shows a change in the trait in a similar population. | If no direct evidence, then the heritability claim does not rule out the program's effectiveness because heritability does not imply immutability. | Stops the claim (if the heritability claim is being used to deny the possibility of change) |
  | 6 | Is the claim about the variation in outcomes (e.g., that the gap between students cannot be reduced)? | Yes or no. | If unclear, assume no. | Narrows the claim |
  | 7 | If Step 6 is yes, does the heritability estimate imply that the variation is mostly genetic? | The heritability estimate is high (e.g., >50%) and the claim is that the gap is mostly due to genetics and thus hard to change. | If heritability is low, then the gap may be more due to environment and thus potentially reducible by environmental changes. However, note that even high heritability does not preclude reducing variation (e.g., by making environments more equal). | Narrows the claim |
  | 8 | Is the claim being used to argue for a genetic screening program? | Yes or no. | If unclear, assume no. | Narrows the claim |
  | 9 | If Step 8 is yes, does the heritability estimate directly support the predictive power of the genetic screening? | The study must show that the genetic score (polygenic score) has been validated in a population like ours and has a high predictive power (e.g., high AUC or R²) for the trait. Heritability alone does not guarantee that a polygenic score will be predictive. | If the heritability estimate is the only evidence for the screening, then the claim is insufficient. | Stops the claim (if the only support is heritability) |
  | 10 | After the above, what remains of the claim? | A clear statement of what the heritability estimate does and does not imply for the decision. | If the claim has been narrowed to a point that it does not bear on the decision, then stop. Otherwise, note the remaining issue. | Hands off to the board |

  Note: 
  - Step 5 is critical for addressing the first concern (the difference between variation and change). 
  - Step 7 addresses the second concern (variation in benefits). 
  - Step 3 addresses the third concern (population and environment).

  Now, we run the three cases.

  Case 1: 
  Claim: A parent tells the board that reading ability is roughly seventy per cent heritable, and that this is why the proposed curriculum change will not close the gap between our strongest and weakest readers.

  Case 2:
  Claim: A consultant argues that since the same trait is only about thirty per cent heritable, the environment accounts for the rest, and our new program should therefore work.

  Case 3:
  Claim: A vendor offers to screen incoming kindergarteners with a DNA-based score to identify those likely to struggle, citing a high heritability estimate from a study carried out in another country and another school system.

  We'll create a JSON object as specified.

  But note: The procedure has 10 steps, but we may not use all in every case.

  We also need to include:
  - procedure_limits: an array of strings describing the failure modes.
answer: |-
  ### Heritability Claim Evaluation Procedure for School Board Decisions  
  **(10-Step Table)**

  | Step | Question | Sufficient Answer | If I cannot answer | Effect on the decision |
  |------|----------|-------------------|-------------------|------------------------|
  | 1 | **What is the exact claim about the program?** | Clear statement linking the heritability number to the program’s feasibility, effectiveness, or equity impact (e.g., "This program won’t work because genetics limit change"). | If the link is vague (e.g., "Genetics matter"), note the ambiguity and proceed to Step 2. | Narrows the claim |
  | 2 | **Is the heritability number (e.g., 70%) from a peer-reviewed study of the specific trait (e.g., reading) in children?** | Published study (journal article) or meta-analysis explicitly naming the trait, age group, and method (e.g., twin study). Common estimates (e.g., 70% for reading) are acceptable if widely cited. | If no source (e.g., "everyone knows this"), stop: claim is unusable. If source exists but I can’t access it, use a defensible proxy (e.g., consensus estimate from NIH or DOE reports). | Stops the claim (if no source) or narrows (if source) |
  | 3 | **Does the study population match our district?** | Study subjects resemble our students in age, grade, socioeconomic diversity, and educational environment (e.g., similar pre-K access, class sizes). | If mismatch (e.g., study from a homogenous or high-poverty country), note this and proceed cautiously. | Narrows the claim |
  | 4 | **Is the trait measured the same way we measure it?** | Study uses similar assessments (e.g., standardized reading tests vs. our district benchmarks). | If unclear (e.g., study uses IQ tests but we use literacy skills), assume mismatch unless trait definitions align. | Narrows the claim |
  | 5 | **Is the claim arguing that the program "can’t work" or "can’t close gaps" due to heritability?** | Yes/no. (Focuses on whether heritability is used to deny mean change or variation reduction). | If unclear, assume "yes" for Step 6. | Narrows the claim |
  | 6 | **For a "can’t work" claim (Step 5 = yes): Does the heritability number imply the trait is unchangeable?** | Heritability describes variation in a specific context, not immutability. Sufficient answer: "No, high heritability ≠ unchangeable." (e.g., height is 80% heritable but nutrition improves it). | If unsure, consult a genetics primer (e.g., NIH "Heritability 101"). | Stops the claim (if used to deny change) |
  | 7 | **For a "close gaps" claim (Step 5 = yes): Does heritability predict variation in program benefits?** | Heritability estimates variation under current conditions, not future interventions. Sufficient answer: "No, unless the study tested this specific program’s interaction with genetics." | If no program-specific data, heritability is irrelevant to variation in benefits. | Stops the claim (if used to deny gap reduction) |
  | 8 | **Is the claim arguing the program "must work" because heritability is low (e.g., 30%)?** | Yes/no. (Focuses on low heritability as proof of environmental potential). | If unclear, assume "yes" for Step 9. | Narrows the claim |
  | 9 | **For a "must work" claim (Step 8 = yes): Does low heritability guarantee program success?** | Low heritability suggests environment influences variation, but doesn’t prove this program targets the right environmental factors. Sufficient answer: "No, direct evidence of program efficacy is needed." | If no program data, heritability alone is insufficient. | Stops the claim (if used as sole proof) |
  | 10 | **Is genetic screening proposed (e.g., DNA tests for at-risk kids)?** | Yes/no. | If unclear, assume "no." | Narrows the claim |

  ### Failure Modes of the Procedure (`procedure_limits`)  
  - **Will wrongly wave away:** Claims where heritability interacts with rare environmental factors (e.g., a program that exacerbates genetic inequalities).  
  - **Will wrongly take seriously:** Politically charged claims that misuse technical terms but pass basic checks (e.g., a well-cited study in a mismatched population).  
  - **Values vs. genetics:** The procedure stops when claims hinge on ideological beliefs (e.g., "we shouldn’t intervene if genetics dominate"). The board must explicitly debate values.  

  ---

  ### Worked Cases (`cases` Array)  
  ```json
  {
    "procedure_limits": [
      "May dismiss claims where gene-environment interactions are complex and population-specific (e.g., trauma-exposed subgroups).",
      "May accept oversimplified claims if they cite real studies, even if misapplied.",
      "Cannot resolve disputes about fairness or resource allocation; flags these as values debates."
    ],
    "cases": [
      {
        "case_name": "Parent on Reading Curriculum",
        "claim_as_made": "Reading ability is 70% heritable, so the curriculum won't close the gap between strong and weak readers.",
        "steps_that_decide_it": [5, 6, 7],
        "verdict": "does_not_bear",
        "what_the_number_does_say": "In the study population, 70% of variation in reading scores was linked to genetic differences under existing conditions.",
        "what_the_board_should_do": "Ignore the heritability claim. Evaluate the curriculum based on trial data or similar districts' results.",
        "what_the_procedure_cannot_settle": "Whether the curriculum reduces gaps for non-genetic reasons (e.g., teaching quality).",
        "whose_judgment_call": "Board's (if gaps are deemed unacceptable regardless of cause).",
        "plain_language_line": "Heritability tells us why kids differ now, not whether a new curriculum can help all kids improve or narrow gaps. We need evidence from classrooms, not genes."
      },
      {
        "case_name": "Consultant on New Program",
        "claim_as_made": "Reading is only 30% heritable, so the environment accounts for the rest, and our program must work.",
        "steps_that_decide_it": [8, 9],
        "verdict": "does_not_bear",
        "what_the_number_does_say": "In the study population, 30% of reading variation was linked to genetics, implying environmental factors play a role.",
        "what_the_board_should_do": "Ignore the heritability claim. Demand evidence that this specific program changes reading outcomes.",
        "what_the_procedure_cannot_settle": "Whether environmental factors in our district align with the program's design.",
        "whose_judgment_call": "Board's (if cost/benefit favors trying unproven programs).",
        "plain_language_line": "Low heritability means environment matters, but it doesn’t guarantee this program targets the right factors. We need pilot data, not genetics."
      },
      {
        "case_name": "Vendor on DNA Screening",
        "claim_as_made": "Screen kindergarteners with DNA scores because reading heritability is high in a foreign study.",
        "steps_that_decide_it": [2, 3, 10],
        "verdict": "unusable_as_stated",
        "what_the_number_does_say": "The study found high heritability in a different population, suggesting genetics influenced reading scores there.",
        "what_the_board_should_do": "Reject the screening proposal. Heritability ≠ predictable individual risk; demand validation in our district.",
        "what_the_procedure_cannot_settle": "Whether genetic screening could ever be ethical or useful (a values question).",
        "whose_judgment_call": "Board's (on ethics and priorities).",
        "plain_language_line": "A heritability number from another country doesn’t prove this DNA test predicts risk here. We’d need local proof, and we must discuss if testing kids is fair or wise."
      }
    ]
  }
  ```

  ### Key Outputs for Your Vote  
  - **When to stop a claim:** Steps 6, 7, and 9 halt heritability arguments that confuse variation with change.  
  - **When to hand off:** Step 10 flags values debates (e.g., DNA screening ethics).  
  - **Unpleasant answers:** The procedure may exonerate lazy arguments (e.g., Case 2’s "must work" claim fails, but the program might still help).  
  - **Warning against unfair dismissal:** If a claim includes direct evidence (e.g., "this program failed in high-heritability groups"), say: "The heritability number alone isn’t decisive, but the program data might be. Let’s examine that separately."  

  **Final Advice:** Use this to filter scientific noise, not override pedagogical expertise. For contentious votes, share the plain-language lines to reframe debates.
