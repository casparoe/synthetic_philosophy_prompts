prompt: |-
  I've been reading rationalist blogs and adjacent forums for about fifteen years, and there's an argumentative move I keep running into that I have never seen named. I'd like you to tell me whether it corresponds to something established, and if not, to carve it precisely enough that a name becomes possible.

  The move is this. Whenever a mechanistic or deflationary account of some mental phenomenon is on the table, introspective reports get recruited as evidence — but only when they point in the deflationary direction. Someone says they sat and looked and found no decision, only the action already underway; this is received as a datum about how the mind works, a window onto the machinery. Someone else says they looked and found a genuine act of will; that report is treated as confabulation, its occurrence explained away by the very mechanism under dispute. The same faculty is authoritative when it embarrasses the robust view and worthless when it embarrasses the deflationary one. I have watched the same flip in arguments about emotion (a report of a felt reason is data; a report of a felt cause is construction) and about perception.

  What makes me doubt this is just the familiar unreliability of introspection, or plain confirmation bias, is that the debunking is usually offered as a finding rather than a stance: the person takes themselves to be following the evidence, and the asymmetry is invisible from the inside. Nor is it, as I understand it, the introspection illusion — that seems to be about the gap between how well we think we know ourselves and how well we know others, whereas here the asymmetry runs not between self and other but between reports that flatter one theory and reports that flatter another.

  So: does this have a name? If something established covers it, I want to know how far the fit goes and where it breaks — whether it is best seen as a special case of something broader (motivated reasoning, a debunking argument gone circular) or as a distinct evidential failure with its own structure. If nothing covers it, define it so the edges are visible: how it differs from the general claim that introspection is unreliable, from confabulation, from the introspection illusion, and from ordinary cherry-picking; whether the flip must occur within a single reasoner or can be distributed across a literature; and whether a report can be evidence about mechanism at all, or only about content. I won't be satisfied with a bare label — the carving is the point.

  Finally, tell me what would change your verdict: if you decide nothing established fits and you coin a term, what would you have to find to conclude the phenomenon was really just an instance of something already known, and where is your reasoning most likely to be wrong?
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been engaging with rationalist blogs and forums for fifteen years and noticed a recurring argumentative pattern. The core issue is an asymmetrical treatment of introspective reports: deflationary accounts accept introspections that support mechanistic explanations but dismiss those that don't, labeling them as confabulation. The user wants to know if this has a name, or if it needs a new term, and seeks a precise definition distinguishing it from related concepts.

  First, I need to recall established concepts. The introspection illusion comes to mind, but the user explicitly differentiates it. The illusion focuses on overestimating self-knowledge compared to others. Here, the asymmetry is theory-driven within the same introspective faculty. So that's a key distinction.

  Next, confirmation bias and motivated reasoning are broader. The user mentions these but thinks their case is more specific because the debunking is presented as evidence-based, not just bias. I need to explore why this asymmetry feels different. The flip between treating introspection as valid or invalid based on the theory it supports is central. That's not just cherry-picking data; it's a methodological inconsistency masked as following evidence.

  The user also questions whether introspection can ever be evidence about mechanisms or only content. Philosophical debates about introspection's reliability are relevant here. If deflationists dismiss robust introspections as confabulation, they might be presupposing their theory, making the argument circular. That's a crucial point—is the debunker's stance question-begging?

  Looking deeper, the user might be hinting at a meta-issue in rationalist communities: a lack of self-awareness about their own biases despite valuing evidence. They might want to name this pattern to facilitate critique within those communities. The need for precise carving suggests they seek a tool to expose this inconsistency effectively.

  Now, comparing related concepts:
  - **Confirmation Bias**: General tendency to favor confirming evidence. Here, it's specific to introspective reports and tied to theoretical commitments.
  - **Cherry-Picking**: Selectively using data. The flip adds a layer of reinterpreting disconfirming evidence as invalid.
  - **Introspection Illusion**: Involves self-other asymmetry. Here, asymmetry is intra-personal and theory-dependent.
  - **Theory-Ladenness of Observation**: All data is interpreted through theory. But here, the reliability of the faculty itself is contested based on the theory.

  The proposed term, "deflective introspection," captures the deflection of disconfirming reports. But is this distinct enough? The user wants to ensure it's not just a special case. The key is the reversal in how the same introspective method is treated based on outcomes supporting the deflationary view.

  What would change my verdict? If studies show that robust introspections are consistently unreliable across contexts, the asymmetry might be justified, not fallacious. Or if the deflationary theory independently predicts when introspection fails, it's not circular. But without that, the double standard remains problematic.

  The user's deeper need might be to validate their observation and equip them with a framework to challenge this move in discussions. Naming it gives it visibility, aiding in calling out the fallacy in rationalist discourse.
answer: |-
  Based on your precise description and the distinctions you've drawn, this phenomenon does **not** correspond cleanly to a single, established named concept. While related to several ideas, it possesses a unique structure. Here's the carving:

  ### Proposed Name: **Deflective Introspection**
  *(or "Introspective Deflection Bias")*

  ### Core Definition
  Deflective Introspection is an **epistemically asymmetric treatment of introspective reports** within arguments about mental mechanisms, characterized by:
  1.  **Selective Validation:** Reports consistent with a deflationary/mechanistic theory are accepted as *direct evidence* revealing underlying cognitive machinery.
  2.  **Asymmetric Debunking:** Reports inconsistent with that theory are dismissed *as products* of the very mechanism the theory posits (e.g., confabulation, post-hoc construction), rendering them evidentially worthless regarding the disputed phenomenon.
  3.  **Self-Veiling Justification:** The asymmetry is presented not as a mere preference or bias, but as the *logical consequence* of the deflationary theory's correctness ("the evidence *shows* why those reports are unreliable").
  4.  **Internal Coherence Failure:** The same introspective faculty is simultaneously treated as (a) a reliable window into mechanism when its outputs support the theory, and (b) fundamentally unreliable *about the specific contested phenomenon* when its outputs contradict the theory, without a consistent, prior-independent justification for this shift in epistemic status.

  ### Distinguishing from Related Concepts
  *   **General Unreliability of Introspection:** This would entail skepticism towards *all* introspective reports about certain phenomena. Deflective Introspection is *selective* skepticism based on *content fit*. It grants authority to the faculty selectively.
  *   **Confabulation:** Confabulation is the *phenomenon* of generating inaccurate explanations. Deflective Introspection is the *argumentative move* of *invoking* confabulation *only* to explain away disconfirming introspective reports, while accepting confirming reports at face value. It weaponizes the *concept* of confabulation asymmetrically.
  *   **Introspection Illusion:** This illusion focuses on the *overestimation* of the accuracy/transparency of one's *own* introspection compared to others'. Deflective Introspection's asymmetry runs between *types of reports* (supporting vs. contradicting the favored theory), *not* primarily between self and other. The "illusion" here is the failure to see the internal inconsistency in the treatment of the *same* faculty's outputs.
  *   **Ordinary Cherry-Picking:** Cherry-picking selects favorable *data points* while ignoring others. Deflective Introspection goes further: disconfirming data points are not merely ignored, but *actively re-interpreted and explained away* using the contested theory itself. The debunking is part of the move.
  *   **Motivated Reasoning / Confirmation Bias:** These are *broad categories* under which Deflective Introspection fits as a specific *instance*. What makes it distinct is its *domain-specificity* (introspection), its unique *structure* (asymmetric validation/debunking), its *self-justifying nature* (using the theory to dismiss counter-evidence), and its focus on the *epistemic status shift* of the introspective faculty itself.
  *   **Circular Reasoning / Begging the Question:** Deflective Introspection *embeds* circularity. The deflationary theory (T) is used to dismiss introspective reports (R) that contradict T, by claiming R is a product of the mechanism described by T. This assumes T to dismiss evidence against T. However, it's not *just* circular; the circularity is deployed specifically to manage introspective counter-evidence while accepting introspective supportive evidence uncritically.

  ### Key Boundaries & Nuances
  1.  **Scope of Evidence:** Deflective Introspection applies specifically to *introspective reports* concerning the *mechanism* (e.g., *how* a decision happens, *how* an emotion arises). Reports about *content* (e.g., *what* decision was made, *what* emotion is felt) are often treated more consistently, as these are less directly challenged by mechanistic accounts.
  2.  **Locus:** The flip can occur:
      *   **Within a Single Reasoner:** An individual deploys the asymmetry in their own arguments.
      *   **Distributed Across a Literature:** A community consistently applies the validating/debunking asymmetry, creating a systemic blind spot where disconfirming reports are never seriously engaged as potential counter-evidence.
  3.  **Epistemic Status of Introspection:** Deflective Introspection highlights a deep tension: *Can introspection ever be direct evidence for a mechanism?* The move implicitly assumes "yes" for supporting reports and "no" for contradicting ones. A consistent position might be that introspection *only* reveals content/experience, not mechanism (making all mechanistic claims based on it suspect), or that it has *some limited, fallible* access to mechanism (requiring a consistent standard for evaluating reports). Deflective Introspection avoids this consistency.

  ### Why "Deflective"?
  *   It captures the core action: disconfirming introspective evidence is "deflected" away from challenging the theory by being reinterpreted *as* evidence *for* the theory's account of error (confabulation).
  *   It avoids overloading existing terms like "asymmetric" or "selective," which are too broad.
  *   It hints at the psychological "defense" mechanism protecting the favored theory.

  ### What Would Change My Verdict (Falsifiability)
  I would conclude Deflective Introspection is *just an instance* of something else if:

  1.  **Independent Grounding for Asymmetry:** Strong, *prior-independent* evidence emerged showing that introspective reports *supporting* deflationary views (e.g., "no free will felt") are consistently reliable indicators of mechanism across contexts, while reports *contradicting* them (e.g., "free will felt") are demonstrably *always* confabulated or constructed in ways predictable *without* assuming the deflationary theory first. The asymmetry would then be justified by external evidence, not an argumentative trick.
  2.  **Consistent Introspective Skepticism:** If it were shown that proponents *consistently* treat *all* introspective claims about mechanisms (both supportive and contradictory) as evidentially worthless confabulation/post-hoc construction, only using behavioral/neural data. This would be consistent (if radical) skepticism, not selective deflection.
  3.  **Established Term Found:** Discovery of a precisely matching, established term from philosophy of mind, cognitive science, or argumentation theory that I have overlooked.

  ### Where My Reasoning is Most Likely Wrong
  1.  **Overestimating Distinctness:** The strongest challenge is that this *is* simply a very specific, context-dependent manifestation of motivated reasoning/confirmation bias applied to introspective data, and carving it out separately is unnecessary. The counter is that its unique structure (the flip in faculty authority, the self-justifying debunking) warrants specific attention.
  2.  **Misjudging the Locus of Circularity:** I argue the core circularity lies in using the theory to dismiss counter-evidence *while* accepting supportive evidence. A critic might argue that the deflationary theory *predicts* both the supportive reports *and* the occurrence/fallibility of the contradictory reports, making the debunking non-circular *if* the theory is well-supported otherwise. Your observation is that this "otherwise support" often *relies* on the asymmetric treatment of introspection itself. Proving that circular dependence is the crux.
  3.  **Underestimating Epistemic Nuance:** Perhaps robust-view proponents *also* engage in a reverse asymmetry (dismissing "no free will" reports as misremembering/inaptitude). If *both* sides do it symmetrically, it weakens the claim that it's a *distinctive* move tied to deflationary accounts and strengthens the case for it being general motivated reasoning about introspection. Your description suggests it's particularly prevalent and problematic in the deflationary/rationalist context you observe.

  Deflective Introspection captures the self-reinforcing, asymmetric, and self-veiling nature of this argumentative pattern concerning the evidential value of introspection in mechanistic debates. It highlights a specific pitfall in how we reason about our own minds.
