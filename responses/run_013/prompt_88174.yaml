prompt: |-
  I've just been appointed to the steering committee of my city's first citizens' assembly: a body of roughly a hundred residents, chosen by lot, meeting over four weekends on one question — the order in which we close two of our three river crossings for rebuilding — whose recommendations go to a binding referendum. I have a year, a modest budget, and probably one chance to get the council to approve a design that isn't decorative. Because the format is explicitly borrowed from classical Athens, I've spent the last month with the standard cautionary tales: the assembly of 427 that voted to kill every adult man in Mytilene and enslave the rest, then reconvened the next morning and reversed itself; the Sicilian expedition of 415, authorized by an assembly that had already expanded a modest twenty-ship force into an armada, which ended two years later with the fleet destroyed and the expeditionary force killed or enslaved; and the trial of Socrates in 399, a few years after the restored democracy had sworn an amnesty covering acts done under the oligarchic regime. I've also noticed, reading more closely, that the Socrates case cuts against the usual moral: on the one day he held a seat on the presiding committee he refused to put an illegal motion to a vote, and he later refused an order from the oligarchy to arrest a resident — so the same episode gets cited both for "majority tyranny" and for the value of procedural dissent.

  The lessons I keep being offered are these: (1) mass deliberation is impulsive, so build in delay and revote; (2) the real problem was rhetoric and demagogues, so constrain speech or structure it; (3) the real problem was amateurism, so weight expert input; (4) the real problem was that no entrenched law bound the assembly, so add judicial review or supermajority thresholds; (5) the real problem was that decision-makers bore no cost, so align cost-bearing with voting power; (6) the real problem was distance and slow feedback, so restrict the assembly to questions whose consequences it can observe; (7) the real problem was the boundary of the demos — the people deciding were not the people affected — so widen the franchise for the question at hand.

  What I want from you is a defended agenda, not a survey. Which of these failure modes should my design actually be built around, ranked, and why? Tell me which of the three Athenian episodes is genuine evidence for which diagnosis, and which of the seven lessons are overrated or simply don't follow from the history they're hung on. I care most about the criteria you're using — upstreamness, tractability for a committee with one year, whether the failure is in the participants or in the surrounding institutions, and whether fixing it would even change outcomes — plus the trade-offs among them, and which single feature you'd spend my one shot on. Finish by saying what evidence over the next year would move something up or down your ranking.
reasoning: |-
  Okay, the user is on the steering committee for their city's first citizens' assembly. They need to design it to avoid historical pitfalls seen in Athenian democracy. They listed seven common lessons from Athenian failures but want a prioritized, defended agenda instead of just a survey. 

  First, I need to unpack their core request. They care about upstreamness (addressing root causes), tractability within one year, whether the failure stems from participants or institutions, and if fixes would change outcomes. They also want trade-offs analyzed and a single feature to focus their "one shot" on. 

  Looking at the Athenian cases they mentioned: Mytilene shows impulsive decision-making reversed by delay; Sicily reveals how rhetoric fueled overcommitment; Socrates' trial paradoxically demonstrates both majority tyranny and procedural integrity. Each episode supports different diagnoses. 

  Now evaluating the seven proposed lessons:
  - Impulsivity (Lesson 1) seems fundamental - it's upstream and evidenced by Mytilene's near-massacre. Delay mechanisms are highly tractable.
  - Speech constraints (Lesson 2) feel overrated. Athens' failures occurred despite existing speech structures, and modern assemblies have better moderation.
  - Expert weighting (Lesson 3) misdiagnoses Sicily - the issue wasn't lack of expertise but dismissal of it. Better to mandate exposure than artificial weighting.
  - Judicial review (Lesson 4) addresses symptoms, not causes. The assembly shouldn't make illegal proposals in the first place.
  - Cost-bearing (Lesson 5) is impractical - you can't make citizens financially liable for votes.
  - Feedback loops (Lesson 6) are important but secondary. The river crossing decision has observable effects within years.
  - Demos boundaries (Lesson 7) aren't relevant here - participants are locally affected residents.

  The Socrates case is particularly interesting. It cuts both ways: used to warn about tyranny but also shows dissent matters. This suggests institutionalizing dissent procedures could mitigate impulsivity. 

  For prioritization:
  1. Impulsivity (root cause, tractable fix)
  2. Information quality (prevents poor framing)
  3. Dissent channels (procedural safeguard)
  4. Feedback design (though less urgent for this specific decision)

  The single feature to spend political capital on: mandatory cooling-off periods with deliberation between votes. Evidence that would change rankings? If early sessions reveal participants heavily rely on heuristics rather than evidence, boost information quality measures. If emotional rhetoric dominates, consider structured speaking formats.
answer: |-
  Here’s a defended agenda prioritizing failure modes for your citizens' assembly design, ranked by **upstream impact, tractability, institutional leverage, and outcome-altering potential**. I’ll ground each in Athenian evidence, flag overrated lessons, and conclude with your "one shot" feature and evidence triggers.  

  ---

  ### **Ranked Failure Modes & Design Priorities**  
  1. **Impulsivity & Time Pressure** (Athenian evidence: **Mytilene**)  
     - **Why it’s #1**: The Mytilene episode (427 BCE) is the clearest evidence: a genocidal vote reversed *only* because the assembly reconvened after a night’s reflection. This highlights **emotional contagion** and **snap judgment** in mass deliberation—not demagogues or amateurism.  
     - **Upstreamness**: Impulsivity enables other failures (e.g., rhetoric exploits haste).  
     - **Tractability**: Fixable via mandatory **cooling-off periods + revotes** (e.g., split final decision across two weekends). Low cost, high impact.  
     - **Trade-off**: Adds time but prevents catastrophic reversals.  
     - **Why other lessons miss**: Lessons 2 (rhetoric) and 3 (amateurism) overrate "fixing people." Athens *had* speech structures (e.g., pro/con speeches), yet still erred.  

  2. **Fragmented/Unbalanced Information** (Athenian evidence: **Sicilian Expedition**)  
     - **Why it’s #2**: Sicily (415 BCE) wasn’t primarily about amateurism (Lesson 3) but **selective hearing**. Thucydides shows Alcibiades’ rhetoric *worked* because the assembly ignored Nikias’ expert warnings (e.g., logistical needs) and fixated on glory.  
     - **Upstreamness**: Poor information flow enables impulsive or irrational votes.  
     - **Tractability**: Mandate **structured expert Q&A** with balanced pro/con panels. Experts submit written briefs; assembly questions them directly.  
     - **Trade-off**: Avoid "weighting" expert votes (Lesson 3 is overrated)—this undermines democratic legitimacy. Instead, **expose all to rigorous evidence**.  

  3. **Procedural Non-Compliance** (Athenian evidence: **Socrates**)  
     - **Why it’s #3**: Socrates’ trial (399 BCE) is *not* proof of majority tyranny. His earlier acts (refusing illegal votes/orders) show that **institutions lacked enforcement** for procedural integrity. The real failure: no mechanism to *stop* illegal motions (e.g., trying civilians in military courts).  
     - **Upstreamness**: Rules without enforcement enable tyranny.  
     - **Tractability**: Appoint a **neutral facilitator** with power to pause votes violating rules (e.g., motions beyond the assembly’s mandate).  
     - **Why judicial review (Lesson 4) is overrated**: It’s downstream. Better to prevent illegal proposals *before* they reach a vote.  

  4. **Low Accountability for Consequences** (Athenian evidence: **Sicily/Mytilene**)  
     - **Why it’s #4**: Voters bore no cost for Sicily’s failure (Lesson 5). But Lesson 5’s solution ("align cost-bearing") is impractical—you can’t fine assembly members. Instead, **visualize impacts**: Show 3D models of traffic chaos if bridges close in suboptimal sequences.  
     - **Upstreamness**: Connects to impulsivity—making consequences visceral reduces rashness.  
     - **Tractability**: Use simulations/data storytelling.  

  ---  

  ### **Overrated Lessons to Deprioritize**  
  - **Lesson 2 (Constrain Speech)**: Athens had timed speeches and moderators—yet still voted for Sicily. Demagogues exploit **structural gaps** (e.g., time pressure), not free speech.  
  - **Lesson 3 (Weight Expert Input)**: Undermines the lottery’s legitimacy. Better to **curate information** than manipulate votes.  
  - **Lesson 4 (Judicial Review/Supermajorities)**: Treats symptoms. Focus on preventing bad proposals *upfront*.  
  - **Lesson 7 (Boundary of Demos)**: Irrelevant here—your assembly *is* affected residents.  

  ---  

  ### **Your "One Shot" Feature: The Cooling-Off Period**  
  Spend political capital on **mandatory deliberation gaps + revotes**:  
  - **Design**: After a provisional vote (e.g., Weekend 3), send members home with plain-language summaries of trade-offs. Reconvene (Weekend 4) for final debate/vote.  
  - **Why**: Directly counters impulsivity (Mytilene’s reversal proves this works). More feasible than restructuring institutions (e.g., judicial review).  
  - **Athenian Proof**: Mytilene’s reversal *only* happened because the assembly slept on it.  

  ---  

  ### **Evidence That Changes Rankings**  
  Monitor these in early sessions:  
  - **↑ Prioritize Information Quality** if:  
    - Members struggle to interrogate experts (e.g., low Q&A engagement).  
    - Factions form before evidence is presented.  
  - **↑ Prioritize Accountability Tools** if:  
    - Members dismiss trade-offs (e.g., "We’ll just build a temporary bridge").  
  - **↓ Deprioritize Procedural Safeguards** if:  
    - Facilitator reports high compliance with rules.  

  ---  

  **Final Note**: The core failure isn’t "human nature"—it’s **institutions that lack friction**. Athens’ disasters occurred when deliberation was rushed, fragmented, or unanchored. Your design must slow down, focus, and ground decisions. The rest follows.
