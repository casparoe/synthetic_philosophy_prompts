answer: |-
  Here's a quiz designed to reveal unstated voting theories through concrete scenarios. Each question has subtle links to the four dimensions, and answers are mapped to positions without obvious signaling. **Scoring key at the bottom.**

  ### Quiz: What's Your Hidden Theory of Voting?
  *Answer based on your gut reaction. No overthinking!*

  1. **Safe District**  
     Your preferred candidate always wins your district by 40+ points. Do you vote?  
     a) Yes, always  
     b) Only if there's an important ballot measure  
     c) No  

  2. **Perfect Oracle**  
     A 100% accurate oracle tells you the election’s exact outcome the day before. Do you still vote?  
     a) Yes  
     b) No  

  3. **Social Pressure**  
     Everyone you know will find out *whether* you voted (but not who for). Does this change your likelihood of voting?  
     a) More likely to vote  
     b) Less likely to vote  
     c) No change  

  4. **Time Trade-Off**  
     You have two hours free: vote in a major national election or fundraise for a cause you deeply care about. Which?  
     a) Vote  
     b) Fundraise  
     c) Depends: Fundraise for national elections, vote for local ones  

  5. **Tiny Country**  
     Your country has 1,000 voters (instead of 100M). Does this affect your likelihood of voting?  
     a) More likely to vote  
     b) Less likely to vote  
     c) No change  

  6. **Ignorant Voter**  
     You haven’t researched candidates in a complex local election. Do you vote?  
     a) Yes, but skip races I don’t understand  
     b) Yes, and guess on everything  
     c) No, I skip the whole ballot  

  7. **Landslide vs. Toss-Up**  
     You can vote in either:  
     - Election A: Your side wins 70-30  
     - Election B: Dead heat (50-50)  
     Which do you choose?  
     a) Election B (toss-up)  
     b) Election A (landslide)  
     c) Try to vote in both  

  8. **Wasted Vote**  
     Your favorite candidate has 0% chance of winning. Do you vote for them?  
     a) Yes  
     b) No—vote for the lesser evil  
     c) Skip the race  

  9. **Group Abstention**  
     If everyone in your demographic (age/income/ideology) skipped voting, would you?  
     a) No—I’d vote to represent "us"  
     b) Maybe—I’d question if it’s worth it  
     c) Doesn’t affect me  

  10. **Symbolic Election**  
      An election is purely symbolic (e.g., choosing a mascot). Do you vote?  
      a) Yes  
      b) Only if my friends are  
      c) No  

  ---

  ### Scoring Key
  Tally your answers, then match to positions below. **Positions are mutually exclusive**—your highest score wins. Ties indicate mixed views.

  #### Answer Mapping  
  | Q# | A | B | C |  
  |----|----|----|----|  
  | 1 | Duty/Rule/Expressive | Instrumental/Epistemic | Instrumental |  
  | 2 | Expressive/Duty | Instrumental/Epistemic | — |  
  | 3 | Duty/Rule | Epistemic | Instrumental/Expressive |  
  | 4 | Duty/Expressive | Instrumental | Instrumental |  
  | 5 | Instrumental | Evidential | Duty/Expressive |  
  | 6 | Epistemic | Duty | Epistemic/Instrumental |  
  | 7 | Instrumental | Expressive/Rule | Duty |  
  | 8 | Expressive | Instrumental | Epistemic |  
  | 9 | Rule/Evidential | Evidential | Instrumental/Expressive |  
  | 10 | Expressive | Rule | Instrumental/Epistemic |  

  #### Positions & Awkward Commitments
  - **Instrumental (Outcome-Focused)**  
    *Voting is a tool to change results.*  
    **Most awkward:** Skipping voting in safe districts is rational—your ballot’s a drop in the ocean.  
    *Answers:* 1b/c, 2b, 3c, 4b/c, 5a, 6c, 7a, 8b, 9c, 10c  

  - **Expressive (Act-Focused)**  
    *Voting expresses identity/values, like cheering for a team.*  
    **Most awkward:** Voting even when an oracle says it won’t matter—the ritual itself matters.  
    *Answers:* 1a, 2a, 3c, 4a, 5c, 6b, 7b, 8a, 9c, 10a  

  - **Duty-Based**  
    *Voting is a civic obligation, like jury duty.*  
    **Most awkward:** Voting ignorantly is better than abstaining—showing up is the point.  
    *Answers:* 1a, 2a, 3a, 4a, 5c, 6b, 7c, 8b, 9a, 10a  

  - **Rule Utilitarian (Group-Focused)**  
    *Act as if everyone like you did the same.*  
    **Most awkward:** Voting in landslides to "set an example"—even if your ballot changes nothing.  
    *Answers:* 1a, 2a, 3a, 4a, 5c, 6a, 7b, 8a, 9a, 10b  

  - **Evidential (Sample-Thinking)**  
    *Your ballot signals what "people like you" want.*  
    **Most awkward:** Voting more in tiny elections because your ballot reveals group preferences more clearly.  
    *Answers:* 1a, 2a, 3a, 4a, 5b, 6c, 7b, 8a, 9b, 10a  

  - **Epistemic (Vote-Well Duty)**  
    *Abstain if uninformed—voting poorly is irresponsible.*  
    **Most awkward:** Skipping elections you care about to avoid "messing up" close races.  
    *Answers:* 1b, 2b, 3b, 4b, 5b, 6a/c, 7a, 8c, 9c, 10c  

  ---

  ### Diagnostics
  - **Indistinguishable Positions:**  
    - **Duty vs. Rule Utilitarian:** Often overlap (e.g., both vote in landslides). Rule Utilitarians uniquely care about group signaling (Q9/Q10).  
    - **Expressive vs. Evidential:** Both vote symbolically (Q8/Q10), but Evidential treats voting as data (Q5/Q9).  
  - **Incoherent Combos:**  
    - Scoring high in both **Instrumental** and **Expressive** is rare—one prioritizes outcomes, the other the act.  
    - **"I always vote, but only if informed"** (Duty + Epistemic) is unstable—Duty demands participation regardless of knowledge.  
  - **Unclaimed Territory:**  
    - **"Vote only when it’s fun"** isn’t a coherent position—all theories assume voting is effortful but justified.
