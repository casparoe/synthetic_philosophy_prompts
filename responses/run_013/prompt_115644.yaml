  1. Value: Outcome-oriented (instrumental) vs. act-oriented (expressive).
  2. Causal view: Ballot as causal (changes outcome) vs. evidential (sample of group).
  3. Duty: Duty to vote vs. duty to vote well (abstention can be dutiful).
  4. Frame: Individual action vs. collective hypothetical (what if everyone like me did this?).

  We'll design questions that subtly probe these dimensions without being obvious.

  The positions we'll map to (with standard names where available):

  A. **Instrumentalism (Outcome-Focused)**: The value of voting is solely in affecting the outcome. Most awkward commitment: In a safe seat, your vote is worthless and you shouldn't bother.

  B. **Expressive Theory**: The act of voting itself has value (expressing your identity, values, or solidarity). Most awkward commitment: You might vote even when you know it cannot change the outcome.

  C. **Evidential Instrumentalism (Sample Thinking)**: Your vote is evidence of how your group votes and might influence others. Most awkward commitment: You might vote in a safe seat to show strength of support, even if it doesn't change the result.

  D. **Duty-Based (Deontological)**: You have a duty to vote, regardless of outcome. Most awkward commitment: You must vote even in a landslide election and even if you are uninformed.

  E. **Epistemic Duty**: You have a duty to vote well (i.e., only if you are informed); abstention can be dutiful. Most awkward commitment: It's better not to vote than to vote poorly.

  F. **Rule Utilitarianism**: You consider what would happen if everyone like you acted the same way. Most awkward commitment: You might vote in a safe seat because if everyone like you stayed home, the result could change.

  Note: Some positions may overlap or be combined. We'll design questions to tease apart these dimensions.

  We'll include the user's requested scenarios and add others.

  Let's draft 10 questions:

  1. **Safe District**: You live in a district where your preferred candidate always wins by about 40 points. Do you vote?
     a) Yes, always.
     b) No, it's a waste of time.
     c) Only if there's a ballot measure or down-ballot race I care about.

  2. **Oracle Prediction**: The night before the election, a perfect and trustworthy oracle tells you the exact outcome (including the margin of victory). Do you still vote?
     a) Yes, I would still vote.
     b) No, because the result is already set.
     c) It depends on the margin they predict.

  3. **Social Pressure**: Your ballot is secret, but everyone you know will be told whether you voted (but not who for). Does this make you more likely to vote?
     a) Yes, because I don't want to be seen as shirking.
     b) No, because they won't know who I voted for anyway.
     c) It doesn't change my decision.

  4. **Opportunity Cost**: You have two hours free on election day. You can either spend that time voting (including travel and waiting) or use it to raise money for a cause you deeply care about. Which do you choose?
     a) Vote — it's more important.
     b) Raise money — it does more direct good.
     c) It depends on the election (e.g., presidential vs. local).

  5. **Small Country**: Imagine your country has only 1000 voters instead of 100 million. How does this change your view on whether to vote?
     a) I am much more likely to vote because my vote has a bigger impact.
     b) It doesn't change my likelihood — voting is a duty regardless of size.
     c) I might be less likely to vote because it's easier for others to cover the margin.

  6. **Informed Voter**: Suppose you haven't had time to research the candidates in a local election. Do you:
     a) Vote anyway, because it's important to participate.
     b) Skip the races you don't know and only vote on the ones you do.
     c) Skip voting entirely in that election to avoid voting poorly.

  7. **Close Race vs. Landslide**: You have to choose between voting in two different elections happening the same day. One election is extremely close (expected margin 0.1%), the other is a landslide (expected margin 40%). Which do you vote in?
     a) The close one — my vote matters more.
     b) The landslide one — it's important to show support for the winner.
     c) I'd split my time and try to vote in both.

  8. **Bandwagon Effect**: If you found out that the candidate you support is going to win in a landslide, would that make you:
     a) More likely to vote for them, to be part of the winning team.
     b) Less likely to vote because it's already decided.
     c) No change — I vote based on my beliefs.

  9. **Protest Vote**: You dislike both major candidates but prefer one slightly over the other. However, you are considering voting for a third-party candidate to send a message. Do you?
     a) No, because that might help the worse major candidate win.
     b) Yes, because it's important to express your true views.
     c) Only if I live in a state where the outcome is not close.

  10. **Group Action**: Imagine that everyone in your demographic group (say, your age and income bracket) were to abstain from voting. How would that affect your decision?
      a) I would definitely vote to represent my group.
      b) I might be less likely to vote because my group isn't participating.
      c) It doesn't change my decision — I vote based on my own reasons.

