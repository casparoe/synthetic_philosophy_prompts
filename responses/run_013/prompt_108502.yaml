prompt: |-
  I run the two-person estimates shop for a mid-sized city's capital program: we produce the cost and schedule numbers that go into the budget for road rebuilds, HVAC replacements, a new permitting database, park renovations, that kind of thing. Twenty-odd estimates a year, a couple of hours each, no stats training on the team and theres no data science group I can hand it to, and the numbers go to a council committee, so being off by half is a public fight. I keep reading that we're supposed to use the outside view rather than the inside view, but every time I try to actually do it I stall out: which reference class, how many cases does it need before it's worth anything, what do I do when there's no precedent at all, and when am I allowed to say yeah but this one's different? Act as an expert on forecasting and decision science who has also read the people who think the outside view is oversold — brainstorm a bit first about where the real difficulties are, then write me a procedure my team can actually run: the steps in order, what counts as a good enough answer at each one, where it stops and just tells me I don't know, and where it hands off to a human call. It has to handle two cases in particular — a job we've done essentially the same way three times before, where the inside story feels very solid, and the first large software system the city has ever bought, where there's genuinely nothing to look back at — plus one where the base rate is going to tell me something I really don't want to hear. Also settle a fight we keep having: do I start from the base rate and adjust, or average the base rate and the inside estimate? And how do I use the fact that most people who say this one's different turn out to be wrong? Be straight with me at the end about what the procedure can't do.
reasoning: |-
  Okay, let me tackle this complex request from the city estimates manager. They're running a two-person shop handling 20+ capital project estimates annually with public scrutiny, facing practical hurdles in applying the "outside view" concept. 

  Hmm, the core tension here is between academic theory and municipal reality. The manager needs a procedural lifeline that works under constraints: no stats training, no precedent for some projects, and political consequences for being off by half. I should acknowledge upfront that the outside view isn't a magic bullet - it's about risk mitigation, not precision.

  First, let's unpack their stated pain points: reference class paralysis ("which category?"), small-N anxiety ("how many cases?"), uniqueness dilemmas ("no precedent"), and adjustment guilt ("when can I override?"). The software example is particularly tricky - for truly novel projects, the outside view can only give boundary conditions, not estimates. 

  For the "done three times" case, the inside view feels reliable but history shows repetition breeds complacency. That's where hybrid estimation shines: use past actuals as anchors but stress-test assumptions. Conversely, for the unprecedented software project, we'll need to leverage analogies from other domains while admitting higher uncertainty bands.

  The adjustment vs averaging debate is interesting. Kahneman would say "adjust less", but municipal work has legit local factors. Maybe the solution is structured adjustment caps - say max 30% deviation unless approved by two people. And that "this time is different" instinct? We'll build in a bias checkpoint forcing written justifications for overrides.

  Procedurally, this needs to be a flowchart: Start with reference class selection → gather base rates → compare to inside view → reconcile with adjustment guardrails. For novel projects, we'll pivot to parametric estimates or expert panels. Crucially, include explicit "stop and flag" points when data is absent or conflicts remain unresolved.

  Biggest limitation? The outside view can't manufacture data that doesn't exist. For truly novel projects, we'll have to admit higher uncertainty - but that honesty itself prevents political disasters later. Also, small reference classes will always be noisy; we'll mitigate by using percentiles rather than point estimates.

  The final procedure should feel like pragmatic toolkit, not academic exercise. Emphasize that the goal isn't perfect estimates but defensible, bias-aware ones. And always - always - document the rationale where overrides happen. That paper trail is their best friend when council questions arise.
answer: |-
  Here’s a battle-tested procedure for applying the outside view *practically* in your context, designed for a small team without stats training. It addresses your pain points head-on, including your three key cases and the "adjust vs. average" debate. I’ll break it down step-by-step with clear exit ramps.

  **Core Principles First:**
  1.  **Outside View ≠ Truth:** It’s a *reality check* against optimistic inside-view biases. It sets anchors and uncertainty bounds.
  2.  **Goal is *Defensible* Estimates:** Not perfect accuracy, but estimates grounded in evidence that can withstand scrutiny.
  3.  **"I Don't Know" is Valid:** Flagging high uncertainty early is better than a precise but wildly wrong number.
  4.  **Adjust LESS, Document MORE:** Decades of research (Kahneman, Lovallo, Flyvbjerg) show adjustments are usually overconfident. If you adjust, justify rigorously.

  **The Procedure: STEP-BY-STEP**

  **Phase 0: Prep (Before Starting ANY Estimate)**
  *   **Task:** Build & Maintain **Reference Class Libraries**.
  *   **How:**
      *   Start simple: Spreadsheets. Columns: Project Type, Scope Desc (brief), Final Cost, Final Duration, Original Est. Cost/Dur, Key Variances (+/-%), Year, Notes (e.g., "unexpected soil issues").
      *   **Sources:** Your past projects, public data (similar cities' capital project reports), industry benchmarks (RSMeans, ENR for construction; ISBSG, QSM for software), vendor quotes.
      *   **Organize:** Start broad categories (e.g., "Road Rebuilds," "HVAC Replacements," "Software Systems > $500k," "Park Renovations"). Refine as you add data.
  *   **Good Enough:** 5+ data points per class = useful. 10+ = good. 2-4 = use cautiously (see Step 4). 0-1 = Flag (see Novel Projects).
  *   **Stops:** If you have <2 relevant points *and* it's truly novel, proceed to "Novel Project" path (Step 4B).

  **Phase 1: The Estimate Process (Per Project)**

  1.  **Define Scope & Generate "Inside View" (IV) Estimate:**
      *   Task: Your team does its standard detailed breakdown (materials, labor, phases, contingencies). Document assumptions clearly.
      *   Good Enough: Your best detailed estimate using known methods. Done when team is confident.
      *   **Stops/Human:** None. This is your baseline.

  2.  **Select Reference Class (RC):**
      *   Task: Look at your libraries. Ask: "What *category* of projects is this *most similar to* in terms of **core drivers of cost/schedule**?" (e.g., complexity, size, technology newness, regulatory environment).
          *   *Road Rebuild Example:* "Mid-sized urban arterial road rebuild (2 lanes, utilities included)".
          *   *Software Example:* "Enterprise-scale Permitting System Implementation (First-time, Cloud-based)".
      *   Good Enough: Pick the *best available fit*. Don't agonize. If multiple fit, note them.
      *   **Stops/Human:** If *no* class exists (e.g., first fusion reactor in City Hall), flag "Novel Project" - **Proceed to Step 4B IMMEDIATELY.**

  3.  **Retrieve Base Rates (BR):**
      *   Task: Pull all data points from your library for the chosen RC.
      *   Calculate:
          *   **Median Final Cost/Duration:** (Resists outliers better than average).
          *   **Interquartile Range (IQR):** (Middle 50% of outcomes - your uncertainty band). Sort data points, find 25th percentile (Q1) and 75th percentile (Q3). IQR = Q3 - Q1.
          *   **Mean Absolute Error (MAE) or % Error:** (Optional but helpful). Avg. absolute difference between Original Est. and Final Actual.
      *   Good Enough: Median + IQR calculated. If N<5, list *all* actuals.
      *   **Stops/Human:** If N=0, **Go to Step 4B (Novel Project).** If N=1 or 2, proceed cautiously, use the actual(s) as benchmarks.

  4.  **Reconcile IV and BR:**
      *   **Task A: The "Standard" Case (Data Exists, e.g., your "done 3 times" HVAC job):**
          *   Plot your IV estimate against the BR distribution (Median, IQR).
          *   **Key Question:** "Is our IV comfortably within the IQR of past similar projects?" (e.g., IV = $1.2M, BR Median = $1.1M, IQR = $0.9M - $1.4M --> Yes, $1.2M is within $0.9-$1.4M).
          *   **If YES:** Your IV likely incorporates relevant specifics. **Output:** IV Estimate. ***Document*** that IV aligns with historical range. *Contingency* can be informed by IQR.
          *   **If NO (IV Optimistic):** (e.g., IV = $800k, BR Median = $1.1M, IQR = $0.9M - $1.4M).
              *   **Step 1:** **Rigorously Audit IV Assumptions:** Where did the gap come from? Missed scope? Over-optimistic productivity? Underestimated soft costs? *Fix errors.*
              *   **Step 2:** **Structured Adjustment (THIS settles the fight):**
                  *   **Start from the BR Median.** This is your anchor against bias.
                  *   **Adjust ONLY for documented, material, *unique* factors** that *significantly* differentiate *this specific project* from the RC average. (e.g., "This HVAC uses 30% more efficient units proven cheaper to install", "Site has exceptional access reducing labor time").
                  *   **Cap Adjustments:** Max +/- 25% from BR Median *unless* extraordinary, documented evidence exists (Requires 2nd reviewer/approval). **Document every adjustment factor and its estimated impact.**
                  *   **DO NOT simply average IV and BR.** Averaging gives undue weight to the biased IV. Starting from BR forces justification for deviation.
              *   **Output:** Adjusted estimate based on BR + *Justified* Unique Factors. State the BR Median and the adjustments made.
      *   **Task B: The "Novel Project" Case (No Data / First-of-Kind, e.g., your large software system):**
          *   **Step 1: Broaden the Reference Class:** Look for *functional* or *complexity* analogs.
              *   *Software Example:* Look for other large "first-time enterprise system" implementations (ERP, HRIS, Financials) in similar-sized *public sector* orgs. Not perfect, but better than nothing.
          *   **Step 2: Parametric Estimation (If Possible):** Break down into components with known cost drivers.
              *   *Software Example:* Cost per user? Cost per module? Implementation cost as % of software license? (Use vendor benchmarks, ISBSG data).
          *   **Step 3: Expert Elicitation:**
              *   Consult 2-3 *independent* experts (vendors, consultants, peers in other cities who've done similar).
              *   Ask for: 1) Their estimate (IV for them), 2) Their BR *if they have one*, 3) Key risks.
              *   **Aggregate:** Use Median of their estimates. Capture their risk factors.
          *   **Step 4: Extreme Uncertainty Banding:**
              *   **Output:** A **WIDE range** (e.g., "Estimate: $1.8M - $3.2M"). Base this on:
                  *   Parametric low/high.
                  *   Expert low/high.
                  *   Generic "first of kind" multipliers (e.g., "Estimate based on analogs, then apply +50%/-25%" - document this!).
              *   **Flag Explicitly:** "High Uncertainty - First-of-Kind Project. Range reflects significant unknowns."
          *   **Good Enough:** A defensible, documented range based on best analogs/expertise. Transparency is key.
          *   **Stops/Human:** This *is* the human call, heavily reliant on structured judgment. Council needs to understand the uncertainty.

  5.  **Apply the "This Time is Different" Filter:**
      *   Task: *Before* finalizing any adjustment *away* from the BR (especially upwards!), force the team to answer:
          *   "What *specific, measurable, and unique* factors justify this deviation?"
          *   "What concrete evidence supports these factors being different *enough* to warrant this adjustment?"
          *   "What are the *downside risks* if we're wrong and this *isn't* different?"
      *   **Rule:** If justification is vague ("complex", "special", "we're better") or lacks evidence, **DO NOT ADJUST.** Default to the BR or the midpoint of the BR IQR. History shows most "different" claims are wrong.
      *   **Document:** The claim of uniqueness and the evaluation of evidence *must* be written down with the estimate.

  6.  **Finalize, Document & Communicate:**
      *   Task: Produce the final estimate number or range.
      *   **Crucially Document:**
          *   Reference Class used (and alternatives considered).
          *   BR Median and IQR (or source data).
          *   Inside View estimate.
          *   Reconciliation process (e.g., "IV within IQR, used IV", "Started from BR Median $X, adjusted +Y% for Factor Z").
          *   Justification for any significant deviation from BR.
          *   Key assumptions and risks.
          *   Level of uncertainty (High/Medium/Low based on data quality and novelty).
      *   Communication: Frame the number *with* its context for the Council ("Based on historical data for similar park renovations...", "High uncertainty range for first-time software system...").

  **Handling Your Specific Cases:**

  1.  **"Done Three Times Before" (HVAC Example):**
      *   **RC:** "City Building HVAC Replacement (Similar Size/Type)"
      *   **BR:** Calculate Median & IQR from your 3 past projects + any similar library data.
      *   **Reconcile:** If IV is within IQR, use IV (confirms consistency). If IV is optimistic, start from BR Median, adjust ONLY if strong, unique evidence exists (e.g., "This building has asbestos requiring abatement not in past jobs"). Be skeptical – repetition breeds complacency.

  2.  **"First Large Software System":**
      *   **RC:** "Public Sector Enterprise Software Implementation (First-Time)" -> Likely N=0 in your library.
      *   **Proceed to Step 4B (Novel Project):**
          *   Broaden RC: Seek benchmarks for similar systems (Permitting, Licensing, ERP) in *similar-sized municipalities*.
          *   Parametric: Get quotes, use cost-per-user/module metrics from vendors/benchmarks.
          *   Expert Elicitation: **Essential.** Get estimates from 2-3 experienced municipal software consultants.
          *   **Output:** Wide Range (e.g., $2.0M - $3.5M) + Explicit High Uncertainty Flag.

  3.  **"Base Rate Saying Something Unwanted":**
      *   **RC/BR:** Identifies median cost/schedule significantly higher than your IV or initial hopes.
      *   **Action:** **DO NOT IGNORE.** Follow Step 4A rigorously:
          *   Audit IV: Find the optimism bias (likely missed scope, risks, soft costs).
          *   **Start from BR Median:** This is the anchor.
          *   **Adjust *Only* with Ironclad Evidence:** What *specifically* makes this project cheaper/faster than the historical norm? Is the evidence truly stronger than the historical data? If not, stick close to BR Median.
          *   **Document Relentlessly:** The BR data, the IV optimism, the (lack of) justification for downward adjustment. This protects you when the project inevitably hits BR-like levels. Communicate the historical reality clearly to Council early.

  **What This Procedure CAN'T Do:**

  1.  **Eliminate Uncertainty:** Especially for novel projects. It quantifies and communicates it, but doesn't remove it.
  2.  **Fix Terrible Data:** Garbage In = Garbage Out. If your reference class libraries are sparse or inaccurate, outputs weaken. Prioritize building them.
  3.  **Overrule Stupid Decisions:** If Council ignores a high-uncertainty flag or a strong BR warning, the project can still fail spectacularly. The procedure provides defense, not force fields.
  4.  **Predict Black Swans:** Unforeseen, catastrophic events (major economic crash, pandemic halting work) will blow up any estimate. Contingency helps, but isn't perfect.
  5.  **Replace Domain Expertise:** Understanding *why* projects in the reference class succeeded or failed is crucial for good adjustment decisions (Step 4A) and interpreting BRs. This requires human judgment.
  6.  **Guarantee Accuracy:** It significantly *improves* accuracy (vs. pure IV) and *defensibility*, especially against optimism bias, but won't hit every estimate perfectly.

  **Straight Talk:**

  The outside view isn't magic. It's a systematic way to fight your brain's natural tendency towards optimism and uniqueness bias ("planning fallacy"). This procedure forces you to confront historical reality *before* committing to a number. Starting from the Base Rate and adjusting minimally with strict justification is the single most important step to improve accuracy. Averaging dilutes the power of the outside view. Documenting *everything* is your armor when the Council asks hard questions later. For truly novel projects, embrace the uncertainty – giving a wide range based on structured analogs and experts is far more honest and ultimately more credible than a precise but fantasy number. Build those reference libraries diligently; they are your most valuable tool. Good luck!
