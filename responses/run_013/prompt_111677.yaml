prompt: |-
  I'm about three-quarters of the way through a novel and I've run into a wall that's more yours than mine, so here's hoping you can help. My protagonist, Ruth, is a quantitative historian: she has a lab, a modest supercomputer, a foundation grant, and a claim that has made her famous and loathed in roughly equal measure — that the great political convulsions of agrarian states arrive on a schedule, not exactly, but not randomly either, and that if you track the right three or four quantities (the price of staple grain against wages, the number of people whose titles have outrun the posts available to them, the fiscal slack left to the state, things of that sort) you can see the next one coming with years of warning. Her critics say she has dressed up a handful of famous collapses in arithmetic; her defenders say she is the first person to make history testable. And she has one line that gets her into more trouble than all the rest: she says she doesn't care why the cycles happen, that asking why is a way of changing the subject, and that a model which hits the dates is worth more than a story that explains them after the fact. I need to write two set-piece scenes — the keynote where she unveils a forecast for a country that hasn't blown up yet, and the ambush session afterwards — and for those to land, I need to know precisely what a theory of this kind would have to deliver before anyone should take it seriously. Not whether her particular version succeeds; I'll settle that myself for the plot. I want the spec.

  So give me the desiderata. Which cases must such a theory get right, and which cases would be the fair test — I'd rather they were ones where the naive story and the theory's story come apart. Which puzzles must it dissolve rather than explain away, and which distinctions must it refuse to collapse (prediction versus retrodiction, a real rhythm versus a coincidence with a story attached, what a society did on average versus what its members actually did, a pattern imposed on the data versus one discovered in it, and — since Ruth is so fond of that line — explaining versus merely forecasting). Which results from outside history can't be contradicted without the whole thing looking silly: what statistics says about fitting curves to small numbers of cases, what demographers say about how you're allowed to infer, what the dating uncertainties in archaeology will and won't support. Put the case or the consideration behind each requirement, tell me which are non-negotiable and which are just the prejudices of one camp (I have a suspicion that the 'no human agency, no history' objection is mostly aesthetic, but you tell me), and flag any two requirements you think cannot be satisfied at once — that's the scene I most want to write, the moment somebody stands up and shows the enterprise is over-specified, or unfalsifiable, or both. Skip scoring her theory, or Turchin's, or anybody else's against the list; I'll do that off-stage.

  British English throughout, please, and end with a line beginning 'Verdict:' naming, in one short phrase, the single requirement you think does the most to rule theories of this kind out.
reasoning: |-
  Okay, the user is writing a novel about a quantitative historian named Ruth who predicts political collapses using data-driven models. They need help defining the rigorous criteria her theory must meet to be credible, especially for two key scenes: her keynote unveiling a new prediction and the critical ambush session afterward. 

  The user isn't asking me to evaluate existing theories but to outline the essential scientific and historiographical benchmarks. They specifically want:
  - Which historical cases must be predicted correctly (especially where conventional narratives clash with data patterns)
  - How to handle methodological tensions (e.g., prediction vs. retrodiction)
  - Non-negotiable constraints from statistics, archaeology, etc.
  - Potential dealbreaker contradictions within the theory's requirements

  Hmm, the challenge here is balancing historiographical rigor with narrative utility. The user needs academically plausible criteria that also create dramatic tension—like when critics argue the theory is overfitted or unfalsifiable. 

  For cases, I should focus on agrarian states where quantitative data exists but traditional explanations disagree with cyclical patterns. The Anarchy-era England vs. Plantagenet stability contrast comes to mind—same dynasty, different outcomes. The Ming-Qing transition is another good candidate because conventional narratives emphasize unique events (Little Ice Age, Li Zicheng's rebellion) while a cyclical model would treat it as part of a pattern.

  Methodologically, the biggest landmines are:
  - Curve-fitting accusations (statisticians will pounce if she uses too few data points)
  - Archaeological dating tolerances (can't claim precision beyond ±20 years)
  - The agency/structure debate (her "I don't care why" stance will infuriate humanists)

  Ah—and the user absolutely wants that moment when someone proves two requirements conflict. The perfect dramatic trap might be: 
  - Requirement A: The model must work on societies with fragmentary data (e.g., Bronze Age collapses) 
  - Requirement B: It must pass statistical significance tests
  But fragmentary data guarantees low n-values, making significance impossible without fudging. Ruth's critics would pounce on that.

  For the verdict line, it has to be something stark that exposes the theory's Achilles' heel. "Verdict: Demanding predictive specificity beyond dating tolerances of source material" cuts deep because archaeology objectively can't support decadal precision for pre-modern events. That's not ideology—it's a hard constraint.

  British English nuances: Using "maths," "timetable," and "harvest failures" instead of American equivalents. Also framing criticisms with phrases like "smacks of" for that academic snark.
answer: |-
  Right, let's build the specification for Ruth's class of theory. This is the gauntlet her critics would throw down, and the standard her defenders would invoke. I'll structure it as desiderata (what the theory *must* do to be credible), fair tests (where it *should* prove its worth), considerations (underlying logic), and tensions (where requirements conflict).

  **I. Non-Negotiable Desiderata (The Table Stakes)**

  1.  **Retrodict Known Major Collapses with Precision:**
      *   **Requirement:** The model must accurately "predict" (retrodict) the *timing* of widely accepted, major political convulsions (e.g., fall of Western Roman Empire, Ming-Qing transition in China, Anarchy in 12th Century England, French Revolution) using only data *available prior* to the event. Not just "sometime in the 3rd century," but within a window plausible given dating uncertainties (often ±25-50 years for pre-modern).
      *   **Case:** Failure to hit the Crisis of the Third Century or the fall of Constantinople within a tight band would be fatal. These are anchors.
      *   **Consideration:** This is validation against the accepted historical record. If it can't explain the big ones we *know* happened, why trust it for unknowns? Dating tolerances are crucial – demanding decadal precision for Bronze Age collapses is unfair.

  2.  **Avoid False Positives & Explain "Near Misses":**
      *   **Requirement:** The model must *not* predict major collapses during periods of recognized stability or resilience. Crucially, it must offer a plausible quantitative account for why a society *didn't* collapse when its indicators looked precarious (e.g., why did Tokugawa Japan stabilise after the Sengoku period? Why did the Roman East persist while the West fell?).
      *   **Case:** Predicting a collapse in mid-18th century Britain or the Abbasid Caliphate at its height would be damning false positives. Explaining the resilience of the Byzantine Empire through the 8th-10th centuries despite pressures is key.
      *   **Consideration:** Any model can be tweaked to fit known crises. Avoiding false alarms and explaining resilience demonstrates robustness and avoids overfitting. It forces engagement with counterfactuals.

  3.  **Respect Statistical & Data Constraints:**
      *   **Requirement:** The model must adhere to fundamental statistical principles.
          *   *Avoid Overfitting:* The number of free parameters must be justified relative to the number of data points (collapses). Complex models fitting a handful of cases are suspect.
          *   *Signal vs. Noise:* Demonstrate that the proposed cycle/pattern is statistically significant against the background noise of random events and the uncertainties inherent in historical data.
          *   *Data Realism:* Quantities used (grain prices, state finances, elite numbers) must be demonstrably inferable from available sources (tax records, chronicles, archaeology) *with quantifiable uncertainty*. Cannot assume precision where none exists.
      *   **Consideration:** Statisticians and econometricians will pounce on violations. Using proxies with huge error bars or fitting complex curves to 5 data points smacks of numerology, not science. Demographers rightly insist on clear chains of inference from source data to model inputs.

  4.  **Generate Testable Predictions (Falsifiability):**
      *   **Requirement:** The model must make specific, non-trivial predictions about the *timing* of future (or lesser-known past) convulsions that are empirically falsifiable within a reasonable timeframe/with available data. "Some instability in the next 50 years" is useless. "High probability of state failure in Country X between 2040-2050 based on current trends in A, B, C" is testable.
      *   **Consideration:** This is the core of Ruth's claim to scientificity. Without falsifiable predictions, it's just another historical narrative, however quantitative. Karl Popper's ghost haunts this requirement.

  **II. Fair Tests (Where the Theory Should Prove Its Mettle)**

  5.  **"Silent" Cases & Divergent Narratives:**
      *   **Requirement:** Successfully identify and date collapses in periods/societies less documented in the mainstream canon, or where traditional explanatory narratives (great man theory, unique climatic disaster, specific battle) are strong but potentially masking an underlying structural pattern. The model's predicted timing should challenge simplistic "why" stories.
      *   **Fair Test Cases:**
          *   **The Bronze Age Collapse (c. 1200 BCE):** Multiple societies collapsed rapidly. Does the model predict synchrony or sequence based on their internal dynamics *before* invoking "Sea Peoples" or climate? Can it differentiate which core areas were most vulnerable *when*?
          *   **The Ming-Qing Transition (1644):** Traditional narratives focus on Li Zicheng, Wu Sangui, the Manchus, and the Little Ice Age. Does the model show Ming indicators hitting critical thresholds *before* these specific events, suggesting collapse was probable *regardless* of the specific trigger?
          *   **Instability in "Stable" Periods:** Can it identify and date periods of significant but non-collapse crisis (e.g., the English Peasants' Revolt 1381, the Fronde in France) within otherwise "stable" dynasties based on its indicators? Does it show Plantagenet England being more vulnerable than Tudor England at similar indicator levels?
      *   **Consideration:** This is where the model earns its predictive stripes by working where conventional stories are loud but potentially incomplete, or where data is sparser. It forces the model to work without the crutch of well-known outcomes.

  6.  **Handle "Atypical" Societies:**
      *   **Requirement:** The model should show applicability (or clearly defined limits) beyond its core dataset. Can it engage with societies that don't fit the classic agrarian state mold (e.g., nomadic empires, maritime republics, heavily trade-dependent states)?
      *   **Fair Test Cases:** Can it model the rise and fall of the Mongol Empire? The stability of Venice relative to its Italian neighbours? The collapse of the Khmer Empire?
      *   **Consideration:** Demonstrates whether the model captures fundamental dynamics or is just a description of a specific historical type. Failure here might limit its scope but not necessarily invalidate it for agrarian states.

  **III. Key Distinctions & Puzzles (What the Theory Must Address)**

  7.  **Prediction vs. Retrodiction:**
      *   **Requirement:** The theory must rigorously distinguish between fitting the past (retrodiction) and predicting the future. Success in one does not guarantee success in the other. Ruth's critics will argue that fitting known dates is trivial if parameters are adjustable *after* the fact.
      *   **Distinction:** The *only* true validation is successful *prospective* prediction (Desideratum 4). Retrodiction is necessary but insufficient.

  8.  **Pattern vs. Coincidence:**
      *   **Requirement:** The theory must demonstrate that the proposed rhythm is statistically robust (see 3b) and not an artefact of cherry-picking dates, ignoring counter-examples (see 2), or imposing a pattern via complex curve-fitting (see 3a). Can it show the *absence* of the proposed cycle where it shouldn't exist?
      *   **Puzzle:** Why do cycles seem to have different lengths in different regions? Is this noise, or does the model explain it through differing dynamics (e.g., speed of information/coercion, geography)?

  9.  **Structure vs. Agency:**
      *   **Requirement:** The theory must explicitly address how structural pressures (grain prices, elite competition) translate into concrete historical events driven by human actors (rebellions, coups, invasions). Ruth can say she "doesn't care why," but the theory must *allow* for agency within its structural framework. Does the model predict the *conditions* for crisis, which are then exploited/triggered by actors? Or does it imply inevitability?
      *   **Puzzle:** How does the model handle the role of exceptional leadership (reformers who avert crisis) or catastrophic bad luck (a plague hitting *at* the predicted crisis point)? Is the former noise, the latter a trigger?
      *   **Consideration:** While critics might overstate the "no agency, no history" point as purely aesthetic, a theory that *entirely* negates the role of contingency and choice becomes philosophically and historically untenable for many. The model needs a conceptual place for agency, even if Ruth dismisses its explanatory primacy.

  10. **Explaining vs. Forecasting:**
      *   **Requirement:** Ruth's dismissal of "why" must be defensible within the theory's framework. Does forecasting based on correlations *without* a causal mechanism provide sufficient practical utility (e.g., early warning) to justify its claim? Or does the lack of a causal "why" ultimately undermine its ability to forecast reliably, especially in novel contexts?
      *   **Distinction:** Critics will argue that without understanding *why* the indicators lead to collapse, you cannot know *if* or *how* the relationship might change, making prediction brittle. Ruth's position is that a reliable correlation *is* valuable knowledge, even if the mechanism is opaque (like early weather forecasting).

  **IV. Inherent Tensions (The Dramatic Ambush Points)**

  *   **Tension 1: Specificity vs. Data Uncertainty (Desiderata 1 & 3c):** Achieving precise (±20 year) retrodiction/prediction is demanded, yet the source data (archaeological dating, grain price series, population estimates) often have uncertainties *larger* than that window. How can you claim precision greater than your inputs allow? *(Critic: "Your model predicts the fall of Rome to 476 ±5, but your grain price proxy for Gaul has a confidence interval of ±30 years! You're manufacturing precision!")*
  *   **Tension 2: Falsifiability vs. Scope (Desiderata 4 & Fair Test 6):** Making a specific, falsifiable prediction (e.g., "Country X collapses between 2040-2050") is essential. But if the model claims broad applicability (e.g., all agrarian states), a *single* failed prediction in one society could be dismissed as an outlier or a scope limitation, potentially making the theory unfalsifiable. How many failures sink it? *(Critic: "Your model failed for the Aztecs? Oh, well they weren't a *true* agrarian state like China, were they? How convenient.")*
  *   **Tension 3: Simplicity (Avoid Overfitting) vs. Comprehensiveness (Handle Atypical Cases) (Desiderata 3a & Fair Test 6):** A simple model with few parameters is robust against overfitting but may struggle with complex, diverse historical realities. Adding parameters to encompass "atypical" cases risks overfitting the core data. Where is the balance struck? *(Critic: "Your three-variable model fits Rome and China, but fails for Egypt. Add a fourth variable for Nile floods, and suddenly it fits Egypt too... but does it now just fit noise in your original set?")*
  *   **Tension 4: Forecasting without "Why" vs. Handling Novelty (Distinction 10):** If the model relies purely on empirical correlations observed in the past, its ability to forecast in a significantly *novel* context (e.g., a modern globalised economy, pervasive digital surveillance, climate change impacts far exceeding historical variation) is highly questionable, precisely *because* it lacks an understanding of the underlying causal mechanisms that might change. *(Critic: "You forecast based on grain prices and elite overproduction? What about synthetic food, universal basic income, or AI-managed governance? Your 'cycles' assumed scarcity and human administration!")*

  **Verdict:** Requiring statistically significant predictive specificity exceeding the inherent dating tolerances of pre-modern source material.
