  ### Decision Tree: Mapping Positions on "Western Values"

  **Tree Structure**  
  This tree uses 7 nodes to categorize 10 distinct positions (leaves). Nodes are ordered to maximize differentiation via concrete cases and avoid presupposing labels. Cases are integrated at decision points where they best expose fault lines. Each leaf includes: (1) Position name, (2) Most awkward commitment (per your request), (3) Key case illustrating the tension.

  ---

  #### **NODE 1: CASE-DRIVEN START**  
  *Use Case: A liberal state runs an empire while proclaiming universal rights (e.g., British Empire citing Locke). Are the values:*  
  - **Absent?** (The empire disproves the values' existence) → Go to Node 2  
  - **Aspirational?** (Values are ideals, not descriptions) → Go to Node 3  
  - **Betrayed?** (Values exist but were violated) → Go to Node 4  

  ---

  #### **NODE 2 (Absent): WHAT REPLACES THE PHRASE?**  
  *Since values are absent, what does the phrase actually refer to?*  
  - **Pure rhetoric:** It does argumentative work, not descriptive → **Leaf 6: Performative View**  
    - *Awkward commitment:* Makes the phrase immune to counterevidence (e.g., rejecting "Western values" could be framed as free speech, but that doesn’t validate the category).  
    - *Illustrative case:* Your colleague’s claim that rejecting Western values is itself a Western value becomes an empty rhetorical loop.  
  - **A historical construct:** The label claims ownership of universal ideas → **Leaf 9: Proprietary-Fiction View**  
    - *Awkward commitment:* Requires ignoring parallel value development elsewhere (e.g., similar "rule of law" concepts in pre-colonial India/Mali).  
    - *Illustrative case:* Calling a global rights document "Western" despite non-Western authors.  
  - **Nothing coherent:** The phrase should be abandoned → **Leaf 10: Abolitionist View**  
    - *Awkward commitment:* Must replace a politically potent term without losing critical leverage (e.g., critiquing "free speech" hypocrisies without the umbrella label).  

  ---

  #### **NODE 3 (Aspirational): WHAT GROUNDS THE ASPIRATION?**  
  *If values are ideals, how are they defined?*  
  - **By historical exemplars:** We point to societies that best realized them → **Leaf 7: Aspirational View**  
    - *Awkward commitment:* Idealized exemplars (e.g., "Athenian democracy") ignore their exclusions (slaves, women).  
    - *Illustrative case:* A constitution with religious freedom is "Western" only if it matches idealized models, ignoring local compromises.  
  - **By abstract definition:** We state principles without exemplars → **Leaf 1: Substantive Core View**  
    - *Awkward commitment:* Definitions are static, but historical realizations evolve (e.g., "freedom" meant something different in 1789 vs. 1948).  
  - **By their tension:** The West is defined by unresolved conflicts → **Leaf 8: Agonistic View**  
    - *Awkward commitment:* Cannot condemn illiberal Western movements (e.g., fascism) as "anti-Western"—they’re part of the conflict.  

  ---

  #### **NODE 4 (Betrayed): HOW DO VALUES PERSIST?**  
  *Since values survived betrayal, what gives them continuity?*  
  - **A fixed definition:** They have an enumerable essence → **Leaf 1: Substantive Core View**  
    - *Awkward commitment:* Must explain why non-Western societies with similar values (e.g., rule of law in Singapore) don’t count as "Western."  
  - **A lineage of practices:** Continuity comes from shared institutions/history → **Leaf 3: Genealogical View**  
    - *Awkward commitment:* Values can mutate beyond recognition (e.g., medieval divine right → modern secular rights).  
  - **Family resemblances:** No essence, but overlapping traits → **Leaf 2: Family-Resemblance View**  
    - *Awkward commitment:* Cannot specify when resemblance is too weak (e.g., is Japan "Western" after adopting parliamentary democracy?).  

  ---

  #### **NODE 5 (FOR GENEALOGICAL/FAMILY-RESEMBLANCE VIEWS): HOW SET BOUNDARIES?**  
  *If values aren’t fixed, what defines the "West"?*  
