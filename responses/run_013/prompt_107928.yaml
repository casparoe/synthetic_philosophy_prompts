answer: |-
  Your suspicion holds: Darwin and Turing executed distinct inversions, each revolutionary but operating on different axes. Below is a steelmanned case for their unity, followed by a disanalysis highlighting their core differences, tested against the immune system case. I’ll mark contested points explicitly.

  ---

  ### **Steelman: The Unification Argument**  
  *Why they seem like the same move:*  
  Both reject **anthropocentric explanations** for complex phenomena. Darwin replaces divine design with selection acting on random variation; Turing replaces introspective "understanding" with behavioral criteria for intelligence. Each dissolves a mystery (design/mind) by showing how iterative, mechanical processes (*variation-selection* for Darwin, *rule-following computation* for Turing) generate functional outcomes without top-down intention. The shared "manoeuvre" is **explaining apparent teleology through ateleological mechanisms**, collapsing dualisms (designer/nature, mind/body) into material processes.

  *Cost of accepting unification:*  
  It obscures **what each inversion leaves intact**. Darwin’s mechanism explains adaptation but says nothing about consciousness; Turing’s test bypasses consciousness but doesn’t explain its emergence. Conflating them risks overextending selectionist logic to cognition (e.g., "neural Darwinism") or reducing evolution to computation—moves many philosophers reject.

  ---

  ### **The Disanalysis: Two Inversions**  
  | Dimension             | Darwin’s Inversion                                     | Turing’s Inversion                                     |
  |-----------------------|--------------------------------------------------------|--------------------------------------------------------|
  | **Core Shift**        | *Causal/ontological*: Design is an **effect**, not a cause. Adaptation arises from mindless population processes. | *Epistemic/criterial*: Thinking is **operationalized**, not introspected. Intelligence is defined by observable performance. |
  | **What’s Inverted**   | Order of explanation: Competence (adaptation) precedes and explains the *illusion* of design. | Criterion of attribution: Competence (behavioral output) replaces *access* to inner states. |
  | **Status of the Target Phenomenon** | "Design" is drained of ontological weight *everywhere*. It becomes a metaphor for functional outcomes (Dennett: "design without a designer"). Intentionality is not "at the top"—it emerges late, if at all (e.g., in conscious animals). | "Thinking" is redefined *by fiat*. Turing cares only about external behavior; inner states (e.g., qualia) are irrelevant to the attribution of intelligence. |
  | **Commitment**        | Empirical claim (natural selection’s role) + metaphysical thesis (anti-teleology). | Methodological recommendation (behavioral test) + conceptual revision (what "thinking" means). |
  | **Contested Issues**   | Does selection explain *all* adaptation? (e.g., neutralists). Is "design" eliminable or heuristic? (e.g., Gould vs. Dawkins). | Does passing the Turing Test *suffice* for intelligence? (e.g., Searle’s Chinese Room). Is consciousness incidental? |

  ---

  ### **Test Case: The Immune System**  
  - **Competence without comprehension?** Yes: Clonal selection involves blind variation (random antibody generation) + selection (antigen binding), producing adaptive responses without cells "representing" threats.  
  - **Which inversion applies?**  
    - **Darwinian**: Fits perfectly as a *causal* mechanism. The immune system’s "tailored" response is explained by selection acting on random variants *within an organism*. This shows Darwin’s inversion isn’t inherently about populations *over time*—it’s about **selectionist logic wherever variation and differential retention occur** (e.g., neural development, memetics).  
    - **Turingian**: Does *not* apply cleanly. The immune system isn’t judged by behavioral output against a human benchmark; its "competence" is measured by biological function (e.g., pathogen clearance). No epistemic inversion occurs because we don’t dispute whether cells "think"—we explain their function mechanistically from the start.  
  - **Result**: The two inversions **come apart**. The immune system exemplifies Darwinian causal logic without invoking Turing’s epistemic shift. This confirms Darwin’s inversion is about the *generation* of competence via selection, while Turing’s is about the *recognition* of competence via performance.  

  *(Alternative test case: Deep Learning. Training via gradient descent is Darwinian (selection on weight variations); deploying ChatGPT as "intelligent" invokes Turing’s inversion (outputs substitute for understanding). Here they overlap but remain distinct: evolution is the causal engine, the Turing Test is the epistemic criterion.)*

  ---

  ### **Settled vs. Contested**  
  - **Settled**:  
    - Darwin’s theory empirically explains adaptation without design.  
    - Turing’s Test is a methodological tool for assessing intelligence.  
  - **Contested**:  
    - **Darwin**: Whether selectionist explanations apply to *all* biological complexity (e.g., evolutionary epigenetics critics). Whether "design" metaphors are useful or misleading. (*My view: Your "drained everywhere" is Dennett’s position; others like Thompson retain teleology in organismic activity.*)  
    - **Turing**: Whether operationalizing intelligence excludes consciousness (Searle’s "strong AI" critique). Whether the inversion redefines thinking or merely tests it. (*My view: Turing redefines intelligence; others like Chalmers argue it leaves consciousness untouched.*)  
    - **The comparison itself**: Some (e.g., evolutionary epistemologists) see both as instances of "selection theory." I argue this conflates causal mechanisms with criteria of attribution.  

  ### **Conclusion**  
  Darwin’s inversion dissolves teleology by explaining how uncomprehending processes produce design-like outcomes; Turing’s dissolves the mind-body problem by replacing introspection with observable competence. The immune system shows they are separable: Darwinian mechanisms can operate without Turing’s epistemic pivot. Both are revolutionary, but their "manoeuvres" invert different pillars of anthropocentrism—one in the *world*, the other in our *judgments* about it.  

  *(Key reconstruction: The immune system case as Darwinian-not-Turingian. Critics might argue that *any* functional system implies a Turing-style performance criterion, but this stretches "epistemic inversion" beyond Turing’s intent.)*
