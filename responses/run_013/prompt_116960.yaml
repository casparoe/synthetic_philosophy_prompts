          Claim 4: "Does the right to secede belong only to groups that constitute a 'people' or 'nation' (with a shared identity, history, and connection to a territory)?"
            - Yes: Go to Position (3) [National self-determination]
            - No: Go to Position (5) [No right to secede; only revolution or negotiated devolution]

          Positions:

          (1) Remedial Right Only: Secession is justified only as a remedy for serious and persistent injustices by the parent state.
          (2) Plebiscitary Right: Any territorial majority may secede if it wants.
          (3) National Self-Determination: The right to secede belongs to peoples/nations rather than to whoever happens to live in a place.
          (4) Consent Required: Consent of the parent state is always required for secession to be legitimate.
          (5) No Right: There is no right to secede; secession can only occur through revolution or a negotiated agreement (which may include devolution of powers without full independence).

          Commentary:

          - Branches doing real work: Each claim separates distinct positions. Claim 1 isolates the consent-based view. Claim 2 separates the remedial view. Claim 3 isolates the plebiscitary view. Claim 4 separates the nationalist view from the no-right view.

          - Combinations: 
              - The path to (5) is taken by those who reject all other justifications. This view is coherent but may be unattractive to those who believe in self-determination or remedial rights.
              - There is no combination that is incoherent, but note that hybrid views (e.g., requiring both injustice and nationhood) are not captured by the tree and are forced into one of the leaves (here, (1) or (3)) that does not fully represent the hybrid.

          - Leaves the tree cannot separate: 
              - The tree cannot separate a pure remedial view (1) from a hybrid view that requires both injustice and nationhood (which would be forced into (1) but then the nationhood condition is lost).
              - Similarly, it cannot separate a pure plebiscitary view (2) from a view that requires both a majority and a nation (which would be forced into (2) but then the nationhood condition is lost).

          - Cases:
              - Quebec and Scotland: Typically, these are argued under (3) (national self-determination) or (2) (if one focuses on the majority). Catalonia similarly.
              - Rich region (e.g., Northern Italy): Might be argued under (2) or (3) if it has a national identity, or under (1) if it can claim injustice (e.g., exploitation). But without a national identity, (3) wouldn't apply. Without injustice, (1) wouldn't apply. So under (2) it could secede by majority vote.
              - Arbitrary borders (e.g., a U.S. state): Only (2) would allow it (if there is a majority) because (3) requires a nation and (1) requires injustice. (4) requires consent, which is unlikely. (5) denies any right.
              - Internally split region: Positions (2) and (3) would allow secession by majority vote, leaving the minority in the new state. Position (1) would not without injustice. Position (4) would require consent. Position (5) denies any right.

          This should fit on one page.
answer: |-
  ### Secession Justification Decision Tree  
  *Start at the top. Answer each claim with "Agree" or "Disagree" to navigate to the next node. Positions are mutually exclusive.*

  #### Claim 1:  
  **"Secession is permissible only to remedy severe, persistent injustices (e.g., systematic oppression, violent persecution, or denial of basic rights) by the governing state."**  
  - **Agree → Position A**: *Secession as a remedy for injustice*.  
    - *Cases it handles*: Justifies secession if the region suffers grave wrongs (e.g., historical oppression in Catalonia). Denies it for "mere" economic/cultural grievances.  
  - **Disagree → Claim 2**.  

  #### Claim 2:  
  **"A majority in any contiguous territory may secede if it democratically wills independence, regardless of shared identity or history."**  
  - **Agree → Position B**: *Plebiscitary right to secede (territorial majority)*.  
    - *Cases it handles*: Allows rich regions to exit poorer unions (e.g., Northern Italy) or arbitrary administrative units (e.g., a U.S. state) with a majority vote. Accepts secession even with internal splits (55% yes, 45% no).  
  - **Disagree → Claim 3**.  

  #### Claim 3:  
  **"The right to secede belongs exclusively to a distinct ‘people’ or ‘nation’ (defined by shared culture, language, history, or identity), not just any territorial group."**  
  - **Agree → Claim 4**.  
  - **Disagree → Claim 5**.  

  #### Claim 4:  
  **"A nation’s right to secede persists even if a significant minority *within its claimed territory* opposes independence (e.g., 45% against), provided the new state protects minority rights."**  
  - **Agree → Position C**: *National self-determination*.  
    - *Cases it handles*: Supports secession for Quebec/Scotland/Catalonia based on national identity, even with internal dissent. Requires cultural/historical ties—rejects arbitrary borders.  
  - **Disagree → Position D**: *Consent of the parent state is always required*.  
    - *Cases it handles*: Blocks secession against minority wishes (internal splits) or without state approval. Treats secession as a negotiated exit, not a unilateral right.  

  #### Claim 5:  
  **"Legitimate secession requires the parent state’s consent, regardless of injustice, identity, or majority will."**  
  - **Agree → Position D** (as above).  
  - **Disagree → Position E**: *No inherent right to secede; only revolution or negotiated devolution*.  
    - *Cases it handles*: Rejects all theoretical justifications. Secession is purely a power struggle (revolution) or a decentralized compromise (e.g., federalism).  

  ---

  ### Positions Summarized  
  - **A**: Remedial justice only (e.g., oppressed groups).  
  - **B**: Territorial majority rule (e.g., any region with >50% support).  
  - **C**: National self-determination (e.g., historic nations like Scotland).  
  - **D**: Parent-state consent required (e.g., constitutional processes).  
  - **E**: No right—only force or negotiation.  

  ---

  ### Analysis  
  **Branches doing real work**:  
  - **Claim 1** splits remedial theories from others.  
  - **Claim 2** isolates plebiscitary democracy from collective-identity theories.  
  - **Claim 3** forces a choice between nationalism and consent/revolution.  
  - **Claim 4** tests consistency on internal splits for nationalists (*critical*—determines if dissent invalidates the right).  

  **Branches that only look like they do work**:  
  - **Claim 5** (consent) is redundant if you *disagree* with Claim 3 (nationalism) and *disagree* with Claim 5 itself—it merely funnels to Position E. Its phrasing mirrors Position D but exists to catch non-nationalists who reject consent.  

  **Unheld/incoherent combinations**:  
  - **Agree with Claim 1 + Agree with Claim 2**: Incoherent. If secession *only* remedies injustice (Claim 1), a territorial majority (Claim 2) can’t justify it alone.  
  - **Agree with Claim 3 + Agree with Claim 2**: Unattractive/unexplored. Nationalism (C) and plebiscitary (B) are rivals—combining them ("only nations, but any nation can leave with a vote") is rare. Most theorists pick one.  
  - **Disagree with Claim 1 + Disagree with Claim 2 + Disagree with Claim 3 + Agree with Claim 5**: Unattractive. Denies injustice, majority rule, *and* nationalism but requires consent (D). Possible but unstable—why consent if no other principles matter?  

  **Leaves the tree can’t separate**:  
  - **Position D (consent) vs. Position E (no right)** when applied to *internally split regions*. Both reject unilateral secession, but D allows negotiation while E resorts to force. The tree groups them by process, not outcomes.  
  - **Position B (territorial majority) vs. Position C (nationalism)** for *arbitrary borders*. B allows secession; C rejects it unless identity exists. But if a "nation" lacks identity (e.g., old administrative lines), the tree forces C to Position D/E—losing nuance.  

  **Case handling**:  
  - **Quebec/Scotland/Catalonia**: Primarily Position C (if national), or B (if majority suffices).  
  - **Rich region exiting poor union**: Position B (if majority wills it), denied by A/C/D/E.  
  - **Arbitrary borders**: Only Position B allows it; C requires national identity.  
  - **Internally split region**: Position B/C accept it (majority wins); A/D/E reject unilateral secession.  

  **Why this tree?**  
  It isolates core disagreements: *Why* secede? (injustice vs. democracy vs. identity) and *How*? (unilateral vs. negotiated). Real-world positions (e.g., Quebec sovereigntists = C; liberal individualists = B) map cleanly.
