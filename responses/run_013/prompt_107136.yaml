prompt: |-
  I've recently been appointed to my hospital's clinical ethics committee, and I've been surprised by how often the hardest cases aren't the ones where the principles obviously conflict—they're the ones where everyone on the committee is confident, but they're confident in different directions, and I suspect that at least some of us are being led by something other than the merits of the case. A colleague suggested I look at Adam Smith's idea of the impartial spectator, and while I find the basic idea appealing—judge your conduct as an impartial spectator would—I can't figure out how to actually do that in a meeting, under time pressure, with people I like and people I don't, and with a strong pull to side with the clinician who reminds me of myself. I need something more concrete than simply resolving to be impartial.

  Could you write me a procedure my committee could actually run on a case—a set of steps to go through in order, with what counts as a sufficient answer at each step, and where the procedure should stop and hand the decision back to the committee because it's a values question rather than a factual one? I'm particularly interested in the parts of Smith's account that make this hard: the difference between wanting to be praised and wanting to be praiseworthy; the way self-deception works, since Smith says we're prone to see our own conduct in a favorable light and that the internal judge he calls the man within the breast is easily corrupted; and the way custom and fashion can make us blind to the moral features of a situation, which I worry hospital culture does as much as any other. Then run the procedure on two cases: one where a family is requesting a treatment that the clinical team thinks is futile, and one where a clinician has made a decision that seems right by the book but feels wrong to the nurses who have to carry it out. Include at least one case where the procedure tells me something I don't want to hear, and be honest about what the procedure can't do—where it just gives me a vocabulary for the disagreement rather than a resolution.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're on a clinical ethics committee and struggling with cases where everyone is confident but in different directions. They mentioned Adam Smith's impartial spectator but need a practical procedure. The key challenges they face are self-deception, bias from hospital culture, and the pull to side with certain clinicians.

  First, I need to break down Smith's concepts: impartial spectator, praiseworthy vs. praised, self-deception, and custom/fashion. The user wants concrete steps that address these in a meeting setting. They also want examples, especially one where the outcome is uncomfortable.

  The user's deeper needs might include reducing interpersonal conflict, ensuring thorough analysis without getting bogged down, and creating a structured way to confront biases. They might also need a method that the whole committee can adopt, not just individual reflection.

  I should design a procedure with clear steps, each targeting a specific bias. For instance, a step to separate facts from interpretations to combat self-deception. Another step to imagine the impartial spectator's view, focusing on praiseworthiness. Also, considering external perspectives to counter custom/fashion.

  For the case examples, futility and clinician-nurse conflict are good choices. The futility case can show how the procedure forces confronting discomfort when agreeing with the team despite family wishes. The second case can highlight systemic issues versus individual actions.

  I need to ensure the procedure stops at values conflicts, providing vocabulary instead of resolution. Transparency about limitations is crucial. Also, timing each step to keep meetings efficient.

  Finally, the examples must illustrate the procedure's application, including where it can't resolve but clarifies the disagreement. Highlighting the uncomfortable outcome in the futility case will address the user's request.
answer: |-
  Here is a concrete "Impartial Spectator Procedure" (ISP) designed for your clinical ethics committee, incorporating Adam Smith's insights into the specific challenges you face. This procedure aims to create structure, expose hidden biases, and clarify the nature of disagreements.

  **The Core Principles Driving the ISP:**

  1.  **Praiseworthy vs. Praised:** We seek actions that *deserve* approval (praiseworthy), not just those likely to gain approval from colleagues, superiors, or families (praised). The ISP forces explicit consideration of *why* an action deserves approval.
  2.  **Combating Self-Deception & the "Man Within":** We are prone to self-flattery. The ISP uses structured questions, role-shifting, and external perspectives to challenge our initial, potentially self-serving judgments and strengthen the internal "impartial spectator."
  3.  **Disrupting Custom & Fashion (Hospital Culture):** We often mistake "how it's done here" for "what is right." The ISP deliberately seeks perspectives *outside* the immediate clinical team and hospital norms.
  4.  **Concreteness & Stopping Points:** Each step has a defined output. Steps clearly distinguish factual analysis from value judgments. The ISP stops when core value conflicts are identified, handing the *clarified* disagreement back to the committee for deliberation/voting.

  **The Impartial Spectator Procedure (ISP) - For Committee Case Review**

  **Pre-Meeting:** Distribute case materials *in advance*. Require members to note their *initial* leaning and *one* primary reason before the meeting.

  **Meeting Procedure:**

  1.  **Case Presentation & Clarification (5-10 mins)**
      *   **Step:** Presenter succinctly states the ethical question, key clinical facts, stakeholder positions, and relevant policies/laws. Committee asks *only* clarifying factual questions.
      *   **Sufficient Answer:** Committee has no further questions about *what* happened, *what* is being proposed, or *what* policies exist. Ambiguities are noted as such.
      *   **Stops For:** Factual uncertainty (needs resolution before proceeding). *Not* for debate or opinion.

  2.  **Stakeholder Interests & Fears (10 mins)**
      *   **Step:** Brainstorm and list *all* key stakeholders (patient, family, specific clinicians, nurses, institution, payers, society). For each, state: a) Their primary *stated* interest/request. b) Their likely *underlying* interest/fear (e.g., "Family requests CPR" -> stated: save life; underlying: avoid guilt, ensure everything tried). c) Any *potential* harm/benefit *to them* from the options.
      *   **Sufficient Answer:** A comprehensive list capturing both surface demands and plausible deeper motivations/impacts for all involved parties. No judgment on validity yet.
      *   **Stops For:** Identifying missing information about stakeholder perspectives. *Not* for resolving conflicts between them.

  3.  **Separating Facts from Interpretations & Judgments (5 mins)**
      *   **Step:** Review the case and Step 2 list. Clearly identify: a) **Undisputed Facts** (e.g., diagnosis, prognosis data, legal capacity status). b) **Interpretations/Inferences** (e.g., "treatment is futile," "patient would suffer," "clinician acted negligently"). c) **Value Judgments** (e.g., "life must be preserved at all costs," "autonomy is paramount," "suffering is worse than death").
      *   **Sufficient Answer:** A clear demarcation. Every "fact" must be verifiable data or a direct quote. Interpretations and value judgments are flagged as such.
      *   **Stops For:** Revealing where disagreements stem from different interpretations of data or unspoken values, not facts. Highlights potential bias in labeling (e.g., calling something "futile" is often an interpretation laden with values).

  4.  **The Impartial Spectator Interrogation (15 mins)**
      *   **Step:** Focus on the primary proposed courses of action. For *each* significant option, ask sequentially:
          *   a) **"Why might a well-informed, disinterested person (knowing all the facts from Step 1 & 3a, and the interests/fears from Step 2) find this action *praiseworthy*?"** (Focus on desert, not popularity).
          *   b) **"What specific *harm* might the impartial spectator identify if we take this action? To whom? Is it unavoidable?"** (Force consideration of downsides).
          *   c) **"If *I* were [key stakeholder with opposing view - e.g., the family member, the nurse, the junior doctor], what would make this action seem *blameworthy* to me? Is that concern valid from the impartial spectator's view?"** (Challenge self-deception & bias).
          *   d) **"Is my support/rejection of this option influenced more by 'how we do things here' (custom/fashion) or by a principle that would hold anywhere?"** (Confront hospital culture bias).
      *   **Sufficient Answer:** Explicit answers for each question for each major option, recorded neutrally. The goal is not consensus, but clear articulation of the *reasons* praiseworthiness/blameworthiness might be assigned.
      *   **Stops For:** Identifying where the *justification* for praiseworthiness relies on values not shared by all (setting up Step 5).

  5.  **External Perspective Check (5-10 mins)**
      *   **Step:** Deliberately consider: a) How would a respected ethicist *from another institution* likely view this? b) How would a *prudent layperson* (informed of all facts) likely view this? c) Does this align with broader societal values/legal precedents (outside hospital walls)?
      *   **Sufficient Answer:** Brief statements capturing these external viewpoints, especially if they differ significantly from initial committee leanings or hospital norms.
      *   **Stops For:** Highlighting where hospital "custom and fashion" might be distorting judgment. Revealing if an option's justification seems insular.

  6.  **Core Value Conflict Identification (5 mins)**
      *   **Step:** Review Steps 3c, 4, and 5. Explicitly state: "The fundamental disagreement here appears to be between which core values? (e.g., Autonomy vs. Non-Maleficence? Beneficence vs. Justice? Fidelity to the patient vs. Fidelity to professional integrity?)". List the conflicting values central to the differing views on praiseworthiness.
      *   **Sufficient Answer:** Clear articulation of 1-2 core value conflicts driving the ethical dilemma, derived from the previous analysis.
      *   **Stops Here:** **This is the key stopping point.** The ISP clarifies the factual landscape, exposes biases, identifies harms/benefits, and isolates the *core value conflict*. It does *not* resolve it.

  7.  **Handoff & Committee Deliberation/Vote:**
      *   **Step:** The Chair states: "The ISP has clarified the facts, stakeholder perspectives, potential biases, and identified the core value conflict between [Value A] and [Value B]. We must now deliberate on which value should take precedence *in this specific context* and vote accordingly."
      *   **Rationale:** Resolving core value conflicts requires democratic deliberation or authoritative decision-making within the committee/institution. The ISP provides the clearest possible framework for *that* discussion/vote by stripping away confusion about facts, hidden biases, and misattributed reasons.

  ---

  **Applying the ISP: Case Studies**

  **Case 1: Futility - Family Requests CPR for Dying Patient with Metastatic Cancer**

  *   **Step 1:** Facts: Patient end-stage, metastatic, bedbound, minimally conscious. Prognosis days/weeks. CPR highly unlikely to restart heart effectively; if it did, would likely lead to ICU, prolonged suffering, death. Family (devout, believes in miracles) demands "everything done," including CPR. Team believes CPR is medically inappropriate and harmful. Policy allows clinicians to withhold futile treatments after process.
  *   **Step 2:**
      *   *Patient:* Stated: Presumed wish to live. Underlying: Avoid suffering, peace. Harm from CPR: Physical trauma, indignity, prolonged dying. Harm from no CPR: None (dying naturally).
      *   *Family:* Stated: Save life, fulfill religious duty. Underlying: Hope for miracle, avoid guilt, demonstrate love. Harm from no CPR: Profound grief, guilt, religious distress.
      *   *Clinical Team:* Stated: Avoid harm, practice evidence-based medicine. Underlying: Prevent patient suffering, avoid moral distress from inflicting futile harm, resource stewardship. Harm from CPR: Moral distress, potential professional repercussions, resource use.
      *   *Institution:* Stated: Follow policy, avoid litigation. Underlying: Reputation, resource management. Harm from both options (conflict).
  *   **Step 3:**
      *   Facts: Diagnosis, prognosis data, patient consciousness level, CPR success rate stats in this population.
      *   Interpretations: "CPR is futile/harmful," "Family's hope is unrealistic."
      *   Values: "Avoiding patient suffering trumps family autonomy," "Religious beliefs must be accommodated absolutely," "Clinicians cannot be compelled to provide harmful treatment."
  *   **Step 4 (Focus on Option: Withhold CPR):**
      *   a) *Praiseworthy?* ISP sees clinicians preventing brutal, ineffective suffering, upholding duty to "do no harm," making difficult but courageous decision based on evidence.
      *   b) *Harm?* Profound psychological/religious harm to family, potential rupture of trust. Unavoidable? Partly - communication can mitigate but not eliminate.
      *   c) *As the Family Member:* "They are playing God, denying hope, disrespecting our faith and love. They care more about rules than my loved one's soul." *ISP View:* Concern about disrespect and harm is valid; ISP demands compassionate process but might see the *medical* harm to patient as overriding.
      *   d) *Custom/Fashion?* Hospital culture likely leans towards medical futility definitions. ISP asks: Is "avoiding futile suffering" a universal principle or just a medical norm? (Likely universal).
  *   **Step 5:**
      *   External Ethicist: Likely supports withholding CPR as ethically justified futility, emphasizing process and compassion for family.
      *   Prudent Layperson: Most would understand not wanting brutal, ineffective intervention for a dying loved one, but expect immense sensitivity.
      *   Society/Law: Generally supports medical discretion in defining/withholding futile treatment after due process. Religious accommodation has limits when it causes physical harm.
  *   **Step 6: Core Value Conflict:** **Non-Maleficence (Avoiding Harm to Patient)** vs. **Respect for Family Autonomy/Religious Beliefs**. (ISP has likely clarified that Beneficence aligns with Non-Maleficence here, and Justice/Resource arguments are secondary).
  *   **Step 7: Handoff:** Committee must deliberate/vote on whether preventing the physical harm and indignity of non-beneficial CPR outweighs the profound respect due to the family's autonomous wishes and religious beliefs *in this specific context*.
  *   **What you might not want to hear:** The ISP strongly frames withholding CPR as the praiseworthy option *from the patient's perspective and the clinician's core duty*. It forces you to confront that siding with the family, while compassionate, might prioritize *their* needs (avoiding guilt/distress) over the *patient's* certain suffering. The ISP highlights the potential self-deception in "siding with the family feels kinder" if the result is objectively worse for the patient. The uncomfortable truth might be that the clinically recommended course is ethically sound, and the committee's role is to support the team in implementing it compassionately.

  **Case 2: By-the-Book but Feels Wrong - Clinician Orders Minimal Sedation for Agitated Demented Patient During Care**

  *   **Step 1:** Facts: Patient severe dementia, no advance directive, frequently agitated/resists essential care (washing, turning). Clinician orders minimal PRN sedation only for "extreme agitation," citing guidelines on avoiding over-sedation. Nurses report patient is often distressed, care is traumatic for patient and staff, minor injuries occur. They request proactive, scheduled low-dose sedation. Clinician refuses, states orders are evidence-based. Family defers to clinician.
  *   **Step 2:**
      *   *Patient:* Stated: Unclear. Underlying: Avoid distress, pain, fear. Harm: Distress during care, potential skin breakdown/infection from inadequate care if avoided.
      *   *Nurses:* Stated: Provide humane care, prevent distress/injury. Underlying: Prevent moral distress, ensure safety, provide dignity. Harm: Moral distress, physical strain, potential accusations of neglect/abuse.
      *   *Clinician:* Stated: Follow best practice, avoid over-sedation risks (falls, delirium). Underlying: Adhere to guidelines, avoid liability, maintain control. Harm: Potential patient harm from sedation, reputational harm if guideline not followed.
      *   *Institution:* Stated: Follow guidelines, minimize risk. Underlying: Avoid liability, regulatory compliance.
  *   **Step 3:**
      *   Facts: Dementia diagnosis, behavior descriptions, specific orders, guidelines on sedation use.
      *   Interpretations: "Care is traumatic," "Minimal sedation is insufficient," "Proactive sedation is over-sedation," "Guidelines are being rigidly applied."
      *   Values: "Avoiding chemical restraint is paramount," "Preventing immediate distress/harm during care is paramount," "Nurse expertise in daily care should be respected," "Physician authority over prescribing is absolute."
  *   **Step 4 (Focus on Option: Increase Sedation as Nurses Request):**
      *   a) *Praiseworthy?* ISP sees action prioritizing immediate relief of suffering and dignity during essential care, responding to frontline expertise, adapting guidelines humanely.
      *   b) *Harm?* Potential increased fall risk, masking underlying issues, slight risk of over-sedation. Unavoidable? Can be mitigated (low dose, monitoring).
      *   c) *As the Clinician:* "They are undermining my judgment, prioritizing short-term ease over long-term harm, practicing outside guidelines recklessly." *ISP View:* Concern about risks is valid; ISP asks if the *current harm* outweighs the *potential* harm, and if rigid adherence ignores context.
      *   d) *Custom/Fashion?* Hospital culture likely emphasizes physician authority and guideline adherence. Nursing concerns about daily care realities might be undervalued ("fashion" of hierarchy). ISP asks: Is the guideline's goal (avoid harm) better served by strict adherence or contextual adaptation?
  *   **Step 5:**
      *   External Ethicist: Likely emphasizes balancing risks, contextual judgment, and the ethical importance of listening to nursing concerns about patient distress. Might question rigid interpretation of guidelines.
      *   Prudent Layperson: Would want their loved one cared for with minimal distress and dignity, expecting professionals to adjust as needed.
      *   Society/Law: Increasing emphasis on minimizing restraint (chemical/physical) but also on preventing resident distress/abuse in dementia care. Guidelines are not absolute law.
  *   **Step 6: Core Value Conflict:** **Non-Maleficence (Avoiding Potential Harm from Sedation - falls, delirium)** vs. **Non-Maleficence/Beneficence (Avoiding Immediate Harm/Distress during Care and Promoting Well-being/Dignity)**. Underlying conflict: **Hierarchy/Authority (Physician Control)** vs. **Recognition of Nursing Expertise & Experience**.
  *   **Step 7: Handoff:** Committee must deliberate/vote on whether the immediacy and severity of the distress/harm during care under the current orders outweigh the potential risks of slightly increased sedation *in this specific patient*, and how much weight to give nursing judgment versus strict guideline interpretation.
  *   **What the ISP Can't Do:** It clarifies the conflict is about balancing *two aspects of Non-Maleficence* (immediate vs. potential harm) and involves power dynamics. However, it cannot determine the *exact* level of sedation that perfectly balances these risks. It provides the vocabulary: "We disagree on whether the *certain* distress now is worse than the *possible* harm later, and how much deference the physician must give to nursing assessment of that distress." The committee must weigh these uncertainties and dynamics.

  **What the ISP Can and Cannot Do:**

  *   **Can:**
      *   Structure discussion and ensure key perspectives are heard.
      *   Force articulation of *why* an action is deemed right/wrong (praiseworthiness).
      *   Surface hidden biases (self-interest, self-deception, cultural norms).
      *   Separate factual disputes from value conflicts.
      *   Clarify the *nature* of the core disagreement (which values conflict).
      *   Reduce unproductive arguing past each other.
      *   Make the deliberation process more transparent and defensible.
  *   **Cannot:**
      *   Eliminate all bias (it mitigates, not cures).
      *   Resolve fundamental value conflicts (e.g., sanctity of life vs. quality of life). It only identifies them.
      *   Guarantee consensus.
      *   Provide a "right answer" in complex dilemmas.
      *   Replace clinical judgment on medical probabilities.
      *   Short-circuit the need for difficult committee decisions on values. **Its greatest power is in revealing *where* the true, irreducible disagreement lies.**

  By consistently applying this procedure, your committee can move beyond the paralysis of confident-but-divergent intuitions. It harnesses Smith's profound insights about human moral psychology not as an abstract ideal, but as a practical tool to make your deliberations more rigorous, less biased, and ultimately, more ethically defensible, even when the answer remains difficult. It ensures that when you *do* vote on values, you are doing so with the clearest possible understanding of what those conflicting values truly are.
