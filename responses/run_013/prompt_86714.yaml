  2. **Negation/embedding**: Jordan challenges Alex on why "No krells are here" is still offensive. Alex counters that the semantic content includes derogation, which negation doesn't touch. Jordan argues for conventional implicature or expressive content that projects.
  3. **Ignorant speakers**: Alex is pressed on how an innocent speaker can be offensive. Alex might say the word itself carries the derogation regardless of intent. Jordan argues that offense arises from community practices, not the word's semantics.
  4. **Reclamation**: Jordan points to reclamation as evidence against semantic derogation. Alex argues that reclamation changes the semantic content for in-groups. Jordan counters with how outsiders can't reclaim it, showing it's about speaker identity, not semantic shift.
  5. **In-between term ("Vargian")**: Introduce a term with historical baggage. Alex argues that the derogation is part of its truth conditions. Jordan sees it as pragmatic, influenced by context and speaker intent.
  6. **Core disagreement**: Highlight differing views on "meaning" – Alex sees it as truth-conditional, Jordan as including use and practice.
  7. **End without resolution**: Show mutual respect, acknowledging the complexity and the need for the other's insights.

  Key points to ensure:
  - Each character addresses the other's arguments directly.
