prompt: |-
  Ok so this is a weird ask but you're the only person I can ask at this hour. I'm a third-year phil of mind PhD and I've somehow become the philosophy person on a working group at our accessibility office. They've had a run of cases where someone's assistive setup got pulled out from under them — an app the vendor discontinued, a note-taking system the exams office banned, a partner who had been doing all the remembering for years and then moved out — and the office realised they have no way to tell the difference between we've taken away their crutch, annoying but survivable and we've taken away a piece of their mind. One student said something in a meeting about it being closer to a lobotomy than a lost pencil and now nobody can unhear it, so they've asked me to write them an actual procedure.

  What I want from you is a decision procedure for people who are smart but not philosophers, that a caseworker can run in about twenty minutes with the person sitting in front of them and that spits out a one-paragraph rationale they can stick in the file. There's an appeals process and a manager has to sign off, so it has to be something they can be cross-examined on later. Sequence of questions, in order: what to ask, what counts as a good enough answer, where a no ends the process and where it only shifts the burden, and where the procedure has to stop and hand the thing to a human because what's left is a values question rather than a factual one. They also want it as a flowchart in words they can paste into the staff handbook, so keep it literal enough to be pasted.

  Things it has to handle, because these are the ones that actually come up: the aid is owned by someone else and can be switched off by them (a company, a university that won't renew the licence, a spouse who could leave); the aid is another person, i.e. the memory is literally in someone else's head and has been for a decade; the person can no longer tell you whether they endorse the aid, either because of late-stage dementia or because they've used it so long that their testimony is exactly the thing in question; the aid does something its designer never intended and the manufacturer would disown; and two people share one aid (a family calendar, a group home's whiteboard) so pulling it hits both of them. Also, their current draft has two tests I think are both bad — if they say it's part of them, it counts and if they can't function without it, it counts — so either replace those with something better or show me the repaired form of one of them that actually survives the cases above. Please don't just say it depends, the whole point is that they need a decision.

  One more thing: I'd rather this not be the Clark-and-Chalmers checklist with the serial numbers filed off. Their conditions (you always have it, you trust it without checking, you'd consult it without thinking) are a decent start but every hard case above is exactly where they go mushy, and the standard objection — that being coupled to a thing isn't the same as being made of it, otherwise whatever you happen to be plugged into is part of you — needs to get answered rather than ignored. My hunch is that the useful cut is something like: is the aid where the thinking happens, or just where a finished thought gets parked? But I don't know if that survives the dementia case, so if it doesn't, say so and give me something that does.

  Then run it end to end on three cases, and make one of them a case where the procedure says no accommodation is owed — I want to see it bite rather than ratify whatever the sympathetic answer is. And tell me what it can't do, and which steps are judgment dressed up as a test, because the caseworkers will work that out eventually and I'd rather it came from me. Dont worry about citing anything, I know the literature well enough to check you.
reasoning: |-
  Okay, the user is a third-year philosophy of mind PhD student working with their university's accessibility office. They need a practical decision procedure to determine if removing an assistive aid is akin to a "lobotomy" versus just losing a "pencil." The procedure must be executable in 20 minutes by non-philosophers, produce a rationale for files, handle appeals, and address specific real-world cases like vendor discontinuation, shared aids, or reliance on another person.

  First, I need to unpack the core problem: distinguishing between tools that are external versus integrated into cognition. The user mentioned Clark and Chalmers' extended mind theory but wants to avoid its pitfalls, especially in hard cases. The key insight might be identifying where cognitive processes occur—whether the aid is a locus of thinking or just storage.

  The user listed critical cases: aids owned by others (like apps or spouses), shared aids (family calendars), inability to endorse due to dementia, unintended uses, and reliance on another person's memory. Each challenges standard criteria like ownership or self-report. For example, a spouse leaving isn't just losing a tool but losing a part of their cognitive system that handled memory.

  The user rejected two existing tests: self-identification ("part of me") and functional necessity ("can't function without it"). These are too vague and don't hold up in cases like dementia or shared aids. Instead, the procedure needs objective markers. The hunch about "where thinking happens" is promising but needs refinement. For dementia, the person can't report, so we must rely on observable integration, like automatic reliance or seamless use.

  Clark and Chalmers' conditions (constant availability, automatic trust, past endorsement) are a start but fail when ownership changes or in shared contexts. The procedure must address coupling versus constitution. The solution might involve checking if the aid is part of an ongoing cognitive loop, not just a repository.

  Designing the flowchart: Start with the aid's role in real-time cognition. If it's passively storing information versus actively processing (like calculating). Then check integration depth—does the user automatically access it without conscious thought? For ownership, if the aid can be withdrawn by another, it might not be constitutive unless there's a commitment (like a marriage). Dementia cases require proxies: was there past endorsement, and is the use automatic?

  The "endorsement lock" step handles cases where the user can't testify. Past endorsement plus current integration suffices. Shared aids need individual impact assessment—does removal disrupt each person's cognitive system? For unintended uses, it's about current function, not design.

  Testing with examples: A shared calendar in a group home—each resident's reliance must be evaluated separately. A calculator app for dyscalculia is constitutive if integrated; a banned note-taking app might be if it's their primary cognition method. A case where no accommodation is due: a temporary tool like a borrowed book isn't integrated.

  Limitations: The "automaticity" judgment is subjective. Values questions arise when commitments conflict (e.g., spouse leaving). The procedure can't resolve all but flags these for human review.

  Structuring the rationale: Each step filters constitutive aids. Ending early if no integration, escalating to managers for values conflicts. The output paragraph justifies based on integration depth, not just necessity.

  Ensuring practicality: Clear yes/no questions, examples for caseworkers. Emphasize observable behaviors over self-reports. Highlighting where professional judgment is needed maintains transparency.
answer: |-
  Here's a decision procedure designed for accessibility caseworkers, addressing your requirements: it's practical, handles your specified hard cases, distinguishes constitutive integration from mere tool use, avoids Clark & Chalmers' pitfalls, and includes a clear rationale output. It prioritizes observable function over subjective claims and flags value judgments.

  **Decision Procedure: "Cognitive Integration Assessment" (CIA)**
  *(Flowchart in Plain Text - Paste Directly into Handbook)*

  ```
  START
  │
  ├─ QUESTION 1: **Is the aid actively used in real-time cognitive processing?** │
  │   │                                                                          │
  │   │ *Good Answer: Describes HOW the aid participates DURING thinking/acting.* │
  │   │ *Bad Answer: Only describes outcomes (e.g., "helps me remember").*       │
  │   │                                                                          │
  │   NO ──> OUTPUT: "Aid functions solely as storage/record or passive tool.   │
  │        │ Removal likely inconvenient but not constitutive." END.            │
  │        │                                                                      │
  │   YES ──> PROCEED to Question 2.                                              │
  │                                                                             │
  ├─ QUESTION 2: **Is access/operation AUTOMATIC & SEAMLESS for the user?**      │
  │   │                                                                          │
  │   │ *Good Answer: Observed/reported use without conscious retrieval steps,  │
  │   │  hesitation, or constant verification. Like using native memory.*       │
  │   │ *Bad Answer: Requires deliberate effort, setup, or verification.*       │
  │   │                                                                          │
  │   NO ──> OUTPUT: "Aid requires significant conscious mediation. Removal     │
  │        │ impedes a tool, not a cognitive process." END.                     │
  │        │                                                                      │
  │   YES ──> PROCEED to Question 3.                                              │
  │                                                                             │
  ├─ QUESTION 3: **Was the aid ENDORSED as part of the user's cognitive system?**│
  │   │                                                                          │
  │   │ *Good Answer: Evidence of past explicit acceptance/choice OR            │
  │   │  long-term, consistent reliance implying adoption.*                     │
  │   │ *Bad Answer: No evidence, recent imposition, or user expresses dislike.*│
  │   │                                                                          │
  │   │ *If user CANNOT testify (e.g., dementia): Use proxies (family, records, │
  │   │  observed behavior pre-incapacity). If NO evidence → PROCEED to Q4.*    │
  │   │                                                                          │
  │   NO ──> OUTPUT: "Lacks evidence of endorsement as constitutive element.    │
  │        │ Removal disrupts an unintegrated support." END.                    │
  │        │                                                                      │
  │   YES/UNKNOWN (due to incapacity) ──> PROCEED to Question 4.                 │
  │                                                                             │
  ├─ QUESTION 4: **Is the aid's function/availability DEPENDENT ON ANOTHER AGENT**│
  │   │ **(person, company, institution) who could unilaterally withdraw it?**  │
  │   │                                                                          │
  │   │ *Good Answer: Identifies specific dependency & withdrawal risk.*        │
  │   │ *Bad Answer: Vague or ignores dependency.*                             │
  │   │                                                                          │
  │   NO ──> PROCEED to Question 5.                                              │
  │   │                                                                          │
  │   YES ──> BURDEN SHIFT: Proceed to Q5, BUT if constitutive (Q1-Q3 YES),      │
  │        │ the burden shifts to the *University* to either:                   │
  │        │   a) SECURE the aid's continued function/access, OR                │
  │        │   b) PROVIDE a functionally identical substitute that meets Q1-Q3, │
  │        │      *before* removal.                                             │
  │        │ Rationale must address this dependency.                            │
  │                                                                             │
  ├─ QUESTION 5: **Does removal functionally DISSOLVE a core cognitive capacity?**│
  │   │                                                                          │
  │   │ *Good Answer: Describes a *specific capacity* (e.g., episodic recall,   │
  │   │  calculation, spatial navigation) rendered *inoperable*, not just harder.*│
  │   │ *Bad Answer: General dysfunction ("I can't cope"), or capacity remains  │
  │   │  possible with significant effort/delay.*                               │
  │   │                                                                          │
  │   NO ──> OUTPUT: "Aid is deeply integrated but core capacity remains        │
  │        │ operable (though impaired). Removal requires support plan, but not │
  │        │ constitutive replacement." END.                                    │
  │        │                                                                      │
  │   YES ──> OUTPUT CONSTITUTIVE RATIONALE (See Template Below).                │
  │        Manager Sign-off & Potential Appeal Triggered.                       │
  │                                                                             │
  └─ *VALUES JUDGMENT FLAG:* If conflict arises between:                         │
     - Dependency (Q4) and University's ability to secure/substitute, OR       │
     - Unavoidable harm to shared aid users (see Shared Aid Protocol below),   │
     │                                                                          │
     └─> ESCALATE TO MANAGER/HUMAN REVIEW: "Requires value judgment on          │
          obligation scope." Rationale must detail conflict.                    │
                                                                                │
  **SHARED AID PROTOCOL (For Q1-Q5):** Run CIA *individually for each user* of the│
  shared aid (e.g., family calendar, group home whiteboard). Removal constitutes │
  harm ONLY for users individually scoring YES through Q5. Document each.       │
  ```

  **Rationale Output Template (One Paragraph for File):**
  > "Assessment indicates the [Aid Name] is constitutively integrated into [User]'s cognitive system. It functions as the active locus for [Specific Capacity - e.g., 'episodic memory retrieval'] (Q1), is accessed automatically/seamlessly (Q2), and was endorsed/adopted as part of their cognitive framework [or, if incapacitated: 'based on longstanding observable integration'] (Q3). Removal functionally dissolves this core capacity (Q5). [IF Q4 YES: 'Dependency on [Agent] creates an obligation to secure/substitute functionality.'] Accommodation is required to prevent constitutive harm."

  **Why this works & addresses your concerns:**
  1.  **Focus on Process, Not Storage:** Q1 targets *where thinking happens* (your hunch), distinguishing active processing (e.g., using a calculator *during* math) from passive storage (e.g., reading a stored note *after* thinking). Survives dementia (focus on observable automaticity/function).
  2.  **Automaticity over Ownership/Trust:** Q2 replaces Clark & Chalmers' "trust/availability" with observable *automaticity*, avoiding the "plugged-in" problem. A library book isn't automatic; a decade-used spouse-as-memory is.
  3.  **Endorsement Lock (Handles Dementia & Unintended Use):** Q3 uses past endorsement/proxies. Unintended uses *can* be endorsed (user adopted it). Dementia relies on proxies/long-term observation *before* incapacity.
  4.  **Dependency Handling (Not Automatic Exclusion):** Q4 shifts burden but doesn't automatically negate constitutionality. A spouse *can* be part of the extended mind; the university must then mitigate the withdrawal.
  5.  **Dissolution, Not Dysfunction:** Q5 replaces "can't function" with *capacity dissolution*. Losing a limb disables walking; losing a *constitutive* aid disables a cognitive capacity. Prevents over-claiming.
  6.  **Shared Aids:** Handled by individual assessment via the protocol.
  7.  **Values Flagged:** Explicitly flags conflicts (dependency mitigation cost, shared harm trade-offs) for human review.

  **Repaired "Bad Tests":**
  *   **"Part of Them" (Self-ID):** Replaced by **Endorsement + Automatic Integration (Q2 + Q3)**. Requires observable function *and* evidence of adoption.
  *   **"Can't Function Without It":** Replaced by **Capacity Dissolution (Q5)**. Focuses on the *specific cognitive capacity* becoming inoperable, not general hardship.

  **Test Cases:**

  1.  **Case: Spouse as Memory (Dependency & Constitution)**
      *   Q1 (Real-time processing): YES. Spouse recalled facts *during* conversation/planning.
      *   Q2 (Automatic/Seamless): YES. Asked without hesitation, trusted implicitly for years.
      *   Q3 (Endorsed): YES. Long-term, deliberate reliance ("my memory").
      *   Q4 (Dependency): YES (Spouse could leave).
      *   Q5 (Dissolves Capacity): YES (Episodic/prospective memory dissolved).
      *   **Output:** Constitutive. Rationale highlights dependency, obligating university to provide substitute (e.g., trained aide, specific tech) *before* spouse leaves.
      *   *Why it works:* Captures deep integration & burden shift, avoids dismissing because "it's just a person."

  2.  **Case: Banned Note-Taking App (Unintended Use & Integration)**
      *   *Scenario:* Student with ADHD uses generic sketching app uniquely structured as their sole external working memory/organizer for lectures & exams. Uni bans app over "potential cheating."
      *   Q1 (Real-time): YES. Actively sketches/diagrams concepts *as they hear them*, refers back instantly *during* thinking/exam prep.
      *   Q2 (Automatic): YES. Opens app instinctively, doesn't verify method, uses fluidly.
      *   Q3 (Endorsed): YES. Chose this specific app/system years ago, tailored it meticulously.
      *   Q4 (Dependency): NO (App is user-owned/licensed).
      *   Q5 (Dissolves Capacity): YES (Working memory/organization for complex info dissolved).
      *   **Output:** Constitutive. Rationale focuses on active processing role & dissolution. Uni must allow equivalent functionality (even if different app).
      *   *Why it works:* Captures unintended but deeply integrated use based on function, not design. Q4 NO avoids burden shift.

  3.  **Case: "No Accommodation Owed" - Vendor-Discontinued Calendar App (Not Constitutive)**
      *   *Scenario:* Staff member uses popular calendar app (like Google Calendar) for meetings. Vendor disables it. They are distressed, claiming they "can't function."
      *   Q1 (Real-time): **NO (Stops Here)**. App stores appointments; user *consults* it *before* acting (passive recall), doesn't process info *within* it during thinking. Thinking (scheduling conflicts, priorities) happens internally.
      *   **Output:** "Aid functions solely as storage/record. Removal likely inconvenient but not constitutive." Support offered: Migration to new calendar system, training.
      *   *Why it Bites:** Rejects claim based on Q1 - it's storage, not the *locus* of cognition. "Can't function" (Q5) is irrelevant if not integrated (Q1/Q2). Avoids over-extension.

  **Limitations & Where Judgment is Dressed as Test:**
  1.  **Q2 (Automaticity):** Judging "seamless/automatic" relies on caseworker observation & interpretation of user report. Requires training. *Mitigation:* Use examples ("Do you stop and think 'I need to get my phone out,' or do you just do it?").
  2.  **Q3 (Endorsement - Proxies for Incapacity):** Determining past endorsement via proxies (family, records) involves interpretation and potential bias. *Mitigation:* Prioritize documented history (e.g., accommodation files, therapist notes) over uncorroborated family claims.
  3.  **Q5 (Capacity Dissolution):** Distinguishing "inoperable" from "severely impaired" can be nuanced. *Mitigation:* Focus on specific, definable capacities (e.g., "cannot recall events from yesterday" vs. "has difficulty recalling details").
  4.  **Shared Aid Impact:** While assessed individually, the *university's action* (removing the *shared* resource) inevitably impacts all users simultaneously. The Values Flag (harm trade-off) is crucial here.
  5.  **Substitution Feasibility (Post Q4 YES):** Judging what constitutes a "functionally identical substitute" involves technical and functional assessment beyond the caseworker's 20-min scope. *Mitigation:* The procedure triggers the obligation; fulfilling it may require IT/AT specialist input.

  This procedure provides a structured, defensible framework prioritizing cognitive function over ownership or self-report, handles your hard cases explicitly, flags true dilemmas, and delivers the required output. It answers the "coupling vs constitution" objection by requiring active processing locus (Q1) and automaticity (Q2) as necessary conditions.
