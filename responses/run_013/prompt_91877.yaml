  I write software for a living and have no philosophical training, so I will put this the way I would put a question about a specification. I have been reading about the modal versions of the ontological argument, including the one Gödel sketched and the various reconstructions and repairs of it, and what strikes me is that the proof-checking part looks easy: the derivation goes through in a standard modal logic, and I can see why. If that is right, the whole dispute must live in the premises. What I want from you is a credence that at least one of these modal formulations is sound — not merely valid, but with every premise true — together with the decomposition that produces the number.

  Break the question into the sub-questions it actually depends on, and give each a probability with one line of justification: the chance that the central possibility premise (roughly, that a supremely perfect or maximally great being is possible, or that the relevant properties can be jointly instantiated) can be defended without the defense already assuming the conclusion; the chance that the property-theoretic apparatus the argument needs — positivity, perfection, greatness, in whatever formulation — is determinate enough to bear the weight; the chance that the modal notion of greatness in play is the right notion, so that the modal logic is appropriate to the concept rather than imposed on it by stipulation; the chance that the conclusion, if reached, is the God of theistic practice rather than a formal shadow of one; and anything else you think belongs. Then combine them, and tell me which term the final number is most sensitive to and what would move it most. My own number is about 0.1; if you land elsewhere, say which term we are disagreeing about.

  One further thing, because it is what actually bothers me. I have half-persuaded myself that if the argument works it makes everything necessary — that no truth remains contingent, so nothing could have been otherwise in any respect. Is that right? If it is, does it count against the argument, or only against the interest of its conclusion? And is there a version of the argument that survives that consequence?

  No citations or reading suggestions, please; I want the reasoning, not the literature. Keep the whole answer under 400 words: the sub-probabilities as a list, then the combination, the sensitivity note, and a short paragraph on the necessity worry.
