prompt: |-
  Me and my mate Dan had a massive row about risk last night and I'd like to settle it properly instead of by who's louder.

  The short version: he pays through the nose for insurance on stuff he'll almost certainly never claim on, and I said he's basically paying to avoid a bad feeling, which is a bit daft. He said no, he's buying off a real risk, and if I really thought the odds were that good I should be happy to take the other side of the bet myself. Then I said it depends whether caring about risk is a proper part of caring about how your life goes or just an arithmetic slip, he said obviously the second, and we spent alot of the evening going round the Allais thing and the urn with the unknown mix of balls, both of us defending positions we couldn't name. What actually ended the evening was him saying he'd take a one-in-ten-thousand chance of dying to knock an hour a week off his commute, me saying no, and neither of us being able to say what we'd disagreed about.

  So: build me a quiz that sorts people like us into the positions. Six to eight questions, each one a concrete choice between two or three options — an insurance premium, a job with a bonus lottery, a medical gamble, a risky move to another city, that sort of thing. Every option has to be something a person could actually say out loud, and no question may just ask whether you're risk averse or name a theory at the reader. Then a scoring key mapping patterns of answers onto positions. Our lot are mostly people who did a bit of economics at uni and nobody's a philosopher, so keep it in plain English.

  The positions that have to come out the other end, as scoring outcomes: (i) risk aversion is just a mistake in the maths and expected value is the whole story; (ii) risk aversion is a rational attitude towards the good itself, so a chance at a good thing is part of what you're getting and not merely a means to it — I think there's a name for this, risk-weighted expected utility or something like that; (iii) a version of (ii) where the re-weighting falls on the odds of doing at least this well, so the worst outcome just keeps its plain odds, rather than on each outcome's odds taken on their own; (iv) unknown odds are a different thing from risky odds, and only the first licenses caution; (v) throw the odds out and just protect the worst case; (vi) risk aversion is only rational where the bad outcome can't be compensated or is the sort of thing that changes who you are — fine to gamble with money, not with your kidneys.

  Then tell me which combinations of answers nobody lands in, and for each of those whether it's because the view is incoherent, merely unattractive, or just unexplored. If two of the positions above come out identical on every question you've written, say so rather than pretending the quiz separates them, and tell me what sort of question would be needed to prise them apart.

  One more thing: the questions do need to separate (ii) from (iii), which I'm fairly sure is a real fork and I can't for the life of me turn into a case. And please don't just trot out the famous paradoxes as the questions — I want cases I could actually put to Dan over a pint.

  Answer in British English.
reasoning: |-
  Okay, the user wants me to create a quiz that sorts people into different philosophical positions about risk aversion, based on a disagreement they had with their friend Dan. I need to understand their argument properly. They mentioned insurance, gambling with odds, and scenarios like commuting risks. The core issue seems to be whether avoiding risk is rational or just emotional.

  The user specified six positions to identify: (i) strict expected value, (ii) risk-weighted utility, (iii) rank-dependent utility, (iv) uncertainty aversion, (v) maxmin, and (vi) catastrophic risk aversion. I need to design questions that can distinguish between these, especially between (ii) and (iii), which both involve re-weighting probabilities but in different ways.

  For question design, each should be a concrete choice with realistic options—insurance premiums, job bonuses, medical gambles, etc. No jargon, just plain English. Six to eight questions. I need to ensure the scenarios cover different aspects: known vs unknown odds, varying stakes (money vs health), and extreme outcomes.

  Position (ii) vs (iii) is tricky. (ii) weights each outcome individually, while (iii) focuses on cumulative probabilities, especially the worst outcomes. A question involving multiple outcomes with the same utility but different rankings could tease this apart. For example, a gamble with a safe option vs one with a small chance of a bad outcome but same expected value. Someone choosing the safer option might lean towards (iii) if they're more concerned about the worst-case scenario.

  I should also include questions that test reactions to unknown probabilities (like Ellsberg paradox) to distinguish (iv), and extreme risks for (v) and (vi). For (vi), a scenario involving irreversible harm vs financial loss could highlight that distinction.

  After drafting questions, I'll map answers to positions. Need to check for overlaps—e.g., if (iv) and (v) always align, I should note that. Also, identify which answer combinations are impossible or rare, explaining why (incoherent, unattractive, unexplored).

  User wants British English, so I'll use terms like "premium" and "pint" appropriately. Avoid famous paradoxes; make scenarios relatable, like commute time or job bonuses. Finally, the scoring key should clearly show how answer patterns map to positions, and note any indistinguishable positions, suggesting how to separate them if possible.
answer: |-
  Right, let's settle this properly. Here’s a "Risk Preference Sorter" for you and Dan, designed over a pint. Six concrete scenarios, no theory names, just choices. Answer honestly – no overthinking.

  **The Risk Preference Sorter**

  *For each question, pick the option (A, B, or C) you'd genuinely choose if faced with this situation.*

  1.  **The Gadget Gamble:** Your fancy new phone (£1000) is a bit accident-prone.
      *   **A:** Pay £20/year for insurance that replaces it for free if smashed.
      *   **B:** Don't buy insurance. Statistically, you'll pay less over 10 years just buying a new one if needed (odds of smashing it in any year are about 1 in 100).
      *   **C:** Buy the insurance without a second thought; £20 is cheap peace of mind.

  2.  **The Commuter's Choice:** You're offered a new job with the *exact same* salary and role as your current one, but...
      *   **A:** ...it has a reliable 45-minute commute each way, every day.
      *   **B:** ...it has a *usually* 30-minute commute, but there's a 1-in-200 chance *each day* the commute becomes a 3-hour nightmare due to unpredictable events (crashes, major delays).
      *   **C:** ...it has a *usually* 30-minute commute, but you *know* 1 day in 10 will randomly be a 3-hour nightmare due to poor scheduling (same odds as B, but known cause).

  3.  **The Bonus Lottery:** Your boss offers two ways to get a year-end bonus:
      *   **A:** Get a guaranteed £1,000 bonus.
      *   **B:** Enter a draw: 90% chance of £1,100, 10% chance of nothing.
      *   **C:** Enter a *different* draw: 10% chance of £10,000, 90% chance of nothing.

  4.  **The Medical Test:** A new, minor but annoying health symptom appears. The doctor says:
      *   **A:** "It's *probably* nothing serious (99.9% chance), but the only way to be 100% sure it's not the very bad Thing X is an invasive, slightly risky test (1-in-1000 chance of serious complication)."
      *   **B:** "Let's just watch and wait. If it gets worse, we investigate then."
      *   **C:** "Get the test immediately. Knowing for sure is worth the small risk."

  5.  **The Big Move:** You have a solid, steady job you find *okay* in your current city. A friend offers you a chance to move to a more exciting city for a job that sounds fantastic...
      *   **A:** ...but it's a fixed-term contract for 1 year only (50% chance it gets renewed permanently, 50% chance you're back job-hunting there in a year).
      *   **B:** ...and it's a permanent position from day one.
      *   **C:** ...stay put. The risk of being jobless in a new city is too much, even for a dream job.

  6.  **The Extreme Edge (Hypothetical but Vivid):** A dodgy bloke in a pub offers you:
      *   **A:** £100 cash, right now. No catch.
      *   **B:** A gamble: 99.99% chance of £10,000; 0.01% chance you lose a kidney (permanently affecting your health/life).
      *   **C:** Refuse both. Even talking to him feels risky.

  ---

  **Scoring Key & Positions Revealed**

  Tally your choices (A, B, C) for each question 1-6. Compare your pattern to the mappings below. **Important:** This maps your *revealed preference* to the underlying *rationale*. No single question defines a position; it's the *pattern*.

  *   **Position (i) "Strict Expected Value" (Risk Aversion is a Maths Mistake):** Chooses the option with the highest calculated average payout, regardless of risk. Look for:
      *   Q1: B (Statistically cheaper)
      *   Q2: B or C (Identical EV commute time vs A, but B/C are faster *on average*)
      *   Q3: B (EV £990 vs A £1000? Very close, maybe A. But definitely not C - EV £1000 same as A, but riskier. Position (i) *should* be indifferent between A and C, or pick A if they dislike variance without rationale. This is a weakness – see below).
      *   Q4: B (EV of testing is negative due to complication risk)
      *   Q5: A (Same EV future income? Position (i) might be indifferent, or choose based on other factors. Weak spot).
      *   Q6: B (Massive positive EV)
      *   **Core:** Consistent pursuit of highest average outcome, dismissing risk itself as irrelevant. Q3 is tricky – pure (i) might pick A over C despite same EV, seeing the variance as pointless? Or be indifferent. This reveals a friction point.

  *   **Position (ii) "Risk-Weighted Expected Utility" (Probability Weighting):** Weights probabilities non-linearly, often overweighting small chances of bad outcomes. Values certainty highly. Look for:
      *   Q1: C or A (Avoids small chance of large loss, values peace of mind *as part* of the good)
      *   Q2: A (Prefers certainty over small chance of terrible outcome, even if average is better)
      *   Q3: A (Prefers certainty over a small chance of nothing, even with slightly lower EV than B. Definitely avoids C's high chance of nothing)
      *   Q4: C or B (C: Overweights tiny chance of Thing X. B: Overweights small risk of test complication? Slight tension)
      *   Q5: B or C (Prefers security - B. Or avoids risk entirely - C)
      *   Q6: A or C (Massively overweights tiny chance of kidney loss)
      *   **Core:** Pays premiums (Q1), avoids gambles with small loss chances (Q2, Q3), potentially over-tests (Q4) or avoids risks (Q5,C; Q6,A/C) due to distorted probability perception.

  *   **Position (iii) "Rank-Dependent Utility" (Focus on Worst-Case Odds):** Focuses on the *chance of doing at least this well*. Values avoiding the *worst possible* outcome highly. Look for:
      *   Q1: A or C (Avoids the worst outcome - £1000 loss)
      *   Q2: A (Avoids the worst outcome - 3hr commute)
      *   Q3: **A** (Critical! Avoids the worst outcome - £0. The *chance of getting at least £100* is 100% for A, 90% for B, only 10% for C. Values this security highly. Prefers A over C *much more strongly* than (ii) might, despite same EV).
      *   Q4: B (Avoids the definite small risk of the test complication. The "at least this well" is current health. The tiny risk of Thing X is less salient than the definite risk of the test).
      *   Q5: B or C (Seeks security/avoids worst case - joblessness)
      *   Q6: A or C (Avoids worst case - kidney loss)
      *   **Core:** Distinguishes itself sharply from (ii) on **Q3 (Prefers A over C much more strongly)**. Prioritizes minimizing the probability of the very worst outcome across scenarios (Q2, Q3, Q6). Q4 choice often differs from (ii).

  *   **Position (iv) "Ambiguity Aversion" (Fear the Unknown Odds):** Treats known risks differently from unknown ones. Cautious only when probabilities are vague. Look for:
      *   Q1: A or B (Known risk - choice depends on other factors)
      *   Q2: **B or C? Critical!** Prefers **B (known 1/200 risk)** over **C (unknown cause feels 'ambiguous')**? Or strongly prefers **A** over *both* B & C? True (iv) should be *more* comfortable with B (known odds) than C (unknown cause), compared to someone equally risk-averse. If they prefer A over both, it's hard to distinguish from (ii)/(iii). Look for *relative* comfort with B vs C.
      *   Q3: A, B, or C (Known odds, so less aversion trigger)
      *   Q4: **B** (The *probability* of Thing X is ambiguous ("probably") - triggers aversion. Prefers to avoid acting on ambiguous threat).
      *   Q5: A, B, or C (Known 50/50 odds in A)
      *   Q6: A or C (Massive ambiguity in the offer/setup)
      *   **Core:** Key distinctions are **Q2 (Prefers known-risk B over ambiguous-risk C, or finds B tolerable where C isn't)** and **Q4 (Prefers B - watch and wait - due to ambiguity around Thing X odds)**. Less bothered by pure known risks (Q1, Q3, Q5).

  *   **Position (v) "Maximin" (Avoid the Very Worst, Always):** Solely concerned with the worst possible outcome. Will sacrifice almost anything to avoid it. Look for:
      *   Q1: A or C (Avoids worst: £1000 loss)
      *   Q2: A (Avoids worst: 3hr commute)
      *   Q3: A (Avoids worst: £0)
      *   Q4: B (Avoids worst: Test complication *and* avoids acting on ambiguous worst (Thing X) by doing nothing definite? Or C to avoid worst: Thing X? Tension. Pure (v) might paradoxically choose C to definitively avoid Thing X, the *medical* worst case. This is a weakness).
      *   Q5: B or C (Avoids worst: Joblessness. C is safest).
      *   Q6: A or C (Avoids worst: Kidney loss)
      *   **Core:** Almost always chooses the option where the worst possible outcome is least bad (or eliminated). **Q3 (Always A)** and **Q6 (Never B)** are hallmarks. Q4 and Q5 choices might be inconsistent depending on how "worst case" is defined.

  *   **Position (vi) "Catastrophic Risk Aversion" (Gamble Money, Not Life/Identity):** Fine with financial risk, deeply averse to irreversible harm or fundamental loss. Look for:
      *   Q1: **B** (Financial loss? Manageable risk)
      *   Q2: **B or C** (Time loss? Annoying, not catastrophic)
      *   Q3: **B or C** (Financial gamble? Fine, maybe chase the big win (C))
      *   Q4: **B** (Risk of complication from test *is* potentially catastrophic? Or is Thing X worse? Tension. Leans towards B - avoid definite invasive risk. Might accept test if Thing X feels catastrophic enough).
      *   Q5: **A** (Job risk? Financial/career setback - acceptable for potential gain)
      *   Q6: **A** (Kidney loss? Absolutely catastrophic - refuse the gamble, take the cash).
      *   **Core:** Stark contrast between **Q1/Q2/Q3/Q5 (Accepts risk - often B or C)** and **Q6 (Rejects gamble - A or C)**. Q4 is nuanced but usually leans away from actions risking physical harm. Financial gambles (Q3 C) are attractive.

  ---

  **The Fine Print: What the Quiz Shows (and Doesn't)**

  1.  **Distinguishing (ii) and (iii):** The quiz *does* prise them apart, primarily through **Q3 (Bonus Lottery)**. Someone strongly preferring the guaranteed £1000 (A) over the 10% chance of £10,000 (C) – despite identical expected value (£1000) – reveals a **rank-dependent (iii)** preference. They care intensely about the 90% chance of getting *nothing* with C. A pure probability-weighter **(ii)** might dislike C's variance, but the strength of preference for A over C here is the hallmark of (iii). Q2 also contributes – (iii) is more likely to choose A to absolutely avoid the worst commute.
  2.  **Indistinguishable Positions:**
      *   **(iv) Ambiguity Aversion vs Strong (ii)/(iii) on Q2/Q4:** If someone chooses A on Q2 (commute) and B on Q4 (medical test), it could be either strong general risk aversion (ii/iii) *or* ambiguity aversion (iv) triggered by the unknown causes. The quiz suggests a *potential* (iv) if they express *relative* comfort with the known-risk commute (B) vs the ambiguous-risk one (C) but still choose A, or if Q4 is a clear B *specifically* due to ambiguity. It points towards (iv) but doesn't definitively isolate it without knowing the *reason* for Q2/Q4 choices. A better question might involve two identical gambles, one with known odds (e.g., a casino game) and one with completely unknown odds (e.g., a strange new machine), asking if they'd play either/both/neither.
      *   **(v) Maximin vs Strong (iii) Rank-Dependent:** Both will often choose the safest option (A on Q1, Q2, Q3; avoid B on Q6). The distinction is subtle. True (v) might be *even more* extreme on Q5 (always choosing C - stay put) or make inconsistent choices on Q4 based purely on avoiding *any* potential worst case, whereas (iii) allows for some trade-offs if the worst-case probability is low enough. A better separator might be a choice with three options: Guaranteed Mediocre outcome, High chance of Good / Small chance of Bad, and a tiny chance of Amazing / High chance of Disastrous. (v) *always* picks Guaranteed Mediocre to avoid Disastrous. (iii) *might* pick the Good/Bad gamble if the Bad isn't catastrophic and its probability is low.
  3.  **Unlikely/Unattractive Combinations:**
      *   **Q1=B (No Insurance) + Q6=C (Refuse Kidney Gamble *and* £100):** This is slightly incoherent. If you're happy to risk a £1000 phone loss (Q1 B), refusing £100 *and* avoiding a kidney gamble (Q6 C) seems inconsistent. Taking the £100 (A) is the obvious financial choice if you're risk-neutral/taking with money. Choosing C suggests an aversion strong enough that you *should* probably buy the phone insurance (Q1 A/C). It hints at unexplored inconsistency or a very specific threshold for "catastrophe" only met by Q6.
      *   **Q3=C (10% chance £10k) + Q6=B (Take Kidney Gamble):** This pattern (chasing huge financial upside regardless of risk + accepting extreme physical risk) is theoretically possible but generally considered unattractive or reckless. It maps poorly to the defined positions except perhaps an extreme version of (i) oblivious to non-monetary cost or a very peculiar (vi) that doesn't classify kidney loss as catastrophic. It's rare and unattractive.
      *   **Consistent (i) Strict EV:** Landing perfectly on the (i) choices is rare (especially Q6 taking the kidney gamble). Most people show *some* risk aversion, making pure (i) unattractive/practically unrealistic for humans. Scoring highly as (i) usually means you're very comfortable with quantifiable risk.
  4.  **Unexplored Combinations:** Many mixed patterns are possible, reflecting that people aren't pure types. The positions are ideals. Someone might be (vi) on health, (iii) on career, and (ii) on small gadgets! The quiz maps the dominant *revealed* tendency in the scenarios given.

  **What to Tell Dan:** Print the quiz, both take it separately, then compare patterns using the key. The discussion won't be about who's louder, but about *why* you each made the choices in Q3 (Bonus), Q2/Q4 (Commute/Medical - known vs unknown risk), and Q6 (Kidney). That's where the philosophical rubber meets the road. Good luck, and the next pint's on whoever was closer to pure expected value on the insurance premiums!
