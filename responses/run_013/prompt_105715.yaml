prompt: |-
  I run calibration at a small forecasting shop. Every week our analysts post probabilities and then revise them, and there's alot of disagreement about when a revision is learning and when it's just wobbling. My boss wants a rule. I know there's this thing called Van Fraassen's reflection principle — the rough idea that if you're sure your future self will assign probability x to A, then you should already assign x, or at least be constrained by that — but I need something an analyst can actually run, not a lecture. Act as a philosopher of probability who has also had to make this work inside an org. First brainstorm, for yourself, the main ways reflection can fail or be misapplied: future self has new evidence, future self is tired or biased, memory loss, the forecast is self-referential, the future self is more expert but under pressure, the future self has different standards, and the seperate issue of when you're deferring to your own future credence versus deferring to a future expert. Then give me a decision procedure: a numbered checklist in the order an analyst should go through it, with what counts as a sufficient answer at each step, where the procedure stops and says defer to the earlier credence, where it says revise, and where it hands off to a human because the issue is trust or values rather than probability. Keep it usable by someone who doesn't know the formalism. Then run it on three cases: (1) an analyst wants to move a 70% down to 40% after a new poll; (2) an analyst wants to move it because they slept badly and feel gloomy, no new info; (3) an analyst says they are certain that after the election they will say they were at 90% all along, and wants to lock that in now. At least one of these should come out in a way I won't like — say which and why. Finally, tell me what the procedure can't do, where I'm just dressing up a judgment call as a rule, and which steps would need my boss to sign off. Don't give me readings or citations. Think carefully and don't just recite the standard formulation.
reasoning: |-
  We are designing a decision procedure for when to defer to a prior credence (earlier probability assignment) versus when to revise based on a new one, with an eye to Reflection-like principles but also practical pitfalls.

  First, let's brainstorm the main ways reflection can fail or be misapplied:

  1. **New Evidence:** The future self has acquired new evidence that the current self does not have. This is the most straightforward reason to revise and does not violate Reflection (because Reflection assumes the future self has at least the current evidence and is rational).

  2. **Biases or Impairments:** The future self might be tired, emotional, under pressure, or biased in a way that the current self is not (or vice versa). This breaks the rationality assumption.

  3. **Memory Loss:** The future self might have forgotten some of the current evidence. This breaks the assumption that the future self has at least the current evidence.

  4. **Self-Referential Forecasts:** The forecast itself might be about the forecasting process (e.g., "I will change my mind"). This can lead to circularity and requires special handling.

  5. **Different Expertise or Standards:** The future self might have become more expert (e.g., through training) or might be applying different standards (e.g., due to a change in the organization's calibration targets). This complicates direct comparison.

  6. **Deferral Target:** Are we deferring to our own future credence (as in Reflection) or to a future expert (which might be a different person or a more informed version of ourselves)? The principle applies differently.

  Now, the decision procedure. We want a checklist that an analyst can run through when they (or a colleague) are considering revising a probability. The goal is to determine whether the revision is a rational update (so we accept it) or an irrational wobble (so we might reject it and stick with the earlier one). The procedure should also flag cases that require human intervention (e.g., trust issues, value judgments).

  **Decision Procedure: "When to Revise or Defer" Checklist**

  **Step 0: Identify the Revision**
     - The analyst is proposing to change a probability from P_old (the old probability) to P_new (the new probability) for event A.
     - Record P_old, P_new, and the reason for the change.

  **Step 1: Check for New Evidence**
     - **Question:** Is there any new evidence that has become available since the old probability was assigned?
     - **Sufficient Answer:** If yes, and the evidence is relevant to event A, then proceed to Step 2. If no, go to Step 3.
     - **Note:** This step is about the existence of new evidence, not its quality.

  **Step 2: Assess the New Evidence**
     - **Question:** Is the new evidence reliable and relevant? And does the analyst have a reasonable justification for how the evidence changes the probability?
     - **Sufficient Answer:**
       - If the evidence is reliable and the change in probability (from P_old to P_new) is reasonably justified (e.g., using a standard updating rule like Bayes, or a clear qualitative argument), then **REVISE** to P_new.
       - If the evidence is unreliable (e.g., a highly biased source) or the justification is weak (e.g., "I just feel like it"), then go to Step 3.
     - **Note:** This step requires some judgment. If there's uncertainty about reliability or justification, it might be better to flag for review (Step 5).

  **Step 3: Check for Internal State Changes (No New Evidence)**
     - **Question:** If there is no new evidence, is the change due to a change in the analyst's internal state (e.g., mood, fatigue, stress) or due to re-evaluating the same evidence?
     - **Sufficient Answer:**
       - If the analyst admits the change is due to an internal state (e.g., "I was too optimistic yesterday because I had a good day, but today I feel pessimistic") or if there's no clear reason, then **DEFER to the old credence (P_old)** because this is likely wobbling. However, note that if the analyst now believes the old state was biased, they might be correcting for that bias. This is tricky and may require Step 5.
       - If the change is due to re-evaluating the same evidence (e.g., "I thought about it more and realized I overlooked an implication"), then go to Step 4.

  **Step 4: Evaluate Re-evaluation of Evidence**
     - **Question:** Is the re-evaluation reasonable? (E.g., did the analyst discover an error in their previous reasoning, or are they applying a more careful analysis?)
     - **Sufficient Answer:**
       - If the re-evaluation is reasonable (e.g., they found a mistake in their prior calculation, or they had an insight that connects the evidence better), then **REVISE** to P_new.
       - If the re-evaluation seems arbitrary (e.g., "I just see it differently now") without a clear reason, then **DEFER to the old credence (P_old)** and flag for possible wobbling.
     - **Note:** This step is subjective. If the analyst has a track record of good re-evaluations, trust them. Otherwise, consider Step 5.

  **Step 5: Human Review**
     - **Trigger:** 
       - Uncertainty in Step 2 (about evidence reliability or justification).
       - In Step 3, if the analyst claims they are correcting for a past bias (e.g., "I was too optimistic because of mood, so now I'm adjusting to be more realistic").
       - In Step 4, if the re-evaluation is controversial or major.
       - Any time there is a dispute or the change is very large without clear justification.
     - **Action:** Escalate to a supervisor or a calibration committee. The issue might be about trust (is the analyst prone to biases?), values (e.g., what standards of evidence are we using?), or the need for a second opinion.

  **Step 6: Special Cases (Self-Referential and Reflection-Lock)**
     - **Question:** Is the forecast about the analyst's own future credence? (E.g., "I am sure that after the election I will say I was 90% confident.")
     - **Action:**
       - If the analyst is trying to set a probability now based on what they think their future self will believe, then this is a Reflection-like scenario. However, note that without new evidence, we should be cautious. The procedure should require that the analyst provide a reason why they expect their future self to have that credence (e.g., because they will have more data). If they cannot, then **DEFER to the old credence** or require Step 5. But if they can, then they are essentially making a forecast about the future evidence, which is allowed. However, note that if they are certain about their future credence, then by Reflection they should set the current credence to that value. But if they are not certain, then they should set a distribution. This is complex and might require Step 5.

  **Important Note:** The procedure should be applied when the revision is proposed. It can be used by the analyst themselves (as a self-check) or by a peer/reviewer.

  Now, let's run the three cases:

  **Case 1: An analyst wants to move a 70% down to 40% after a new poll.**

     - **Step 1:** There is new evidence (a new poll). Go to Step 2.
     - **Step 2:** The new poll is relevant. The analyst says: "The poll shows a drop in support." 
       - We assess: Polls are generally reliable, but we should check if it's a reputable pollster. Assuming it is, and the drop is significant, then the change from 70% to 40% might be reasonable (if the poll was a major update). 
       - **REVISE** to 40%.

  **Case 2: An analyst wants to move it because they slept badly and feel gloomy, no new info.**

     - **Step 1:** No new evidence. Go to Step 3.
     - **Step 3:** The change is due to internal state (bad sleep, gloom). 
       - The analyst is not claiming they are correcting for a past bias (they are just feeling gloomy). 
       - **DEFER to the old credence (70%)**. 
       - Note: If the analyst said, "I realize that when I'm tired I'm too optimistic, so I'm adjusting down to be more realistic," then we might go to Step 5 for human review (because they are claiming a bias correction).

  **Case 3: An analyst says they are certain that after the election they will say they were at 90% all along, and wants to lock that in now.**

     - **Step 6:** This is a self-referential case. The analyst is trying to set the current probability based on their future credence.
     - **Analysis:** The analyst is certain (100%) that their future self will assign 90% to the event having occurred (after the election, when the outcome is known). But note: after the election, the outcome is known. So their future self will assign either 0% or 100% (if they are being honest) to the event that happened. They won't say 90% unless they are lying or forgetful. 
       - Therefore, the analyst's claim is inconsistent. They cannot be certain that their future self will assign 90% when the event has already happened. 
       - This is a red flag. We would go to Step 5 (human review) because it's either a joke, a mistake, or a deep misunderstanding. 
     - **Alternative interpretation:** Maybe they mean that after the election, when looking back at their past confidence, they will say they were 90% confident. But that's a statement about their memory, not about the event. This is a different event: "I will remember having assigned 90%." 
       - Then the question is: what is the current evidence about their future memory? They might be forgetful. 
       - This is a complex self-referential forecast. We would require Step 5.

  At least one of these should come out in a way you won't like. I think Case 3 is the one that might be problematic. You might not like that we are flagging it for human review and not providing a clear answer. But the issue is that the analyst's statement is either confused or about a different event. We cannot lock in 90% for the event A (the election outcome) based on a future memory claim because that future memory might be false. And if the analyst is certain about the future memory, then they should set the current probability for the memory event to 90%, but that's not the event A. This confusion requires human intervention.

  **What the Procedure Can't Do and Where It's Just a Judgment Call:**

  - The procedure relies on the analyst's honesty in reporting the reason for the change (especially in Steps 3 and 4). If they lie about new evidence, we can't catch that without auditing.
  - Steps 2 and 4 require judgment about what is "reasonable". This is inherently subjective and depends on the analyst's expertise and the organization's standards.
  - Step 5 (human review) is a catch-all that might become a bottleneck. The organization must have a clear process for what counts as a sufficient justification in Steps 2 and 4 to minimize Step 5.
  - The procedure does not address cases where the revision is due to a change in the event definition (e.g., the question was clarified) or a change in the time horizon (e.g., the forecast was for a different date). These should be handled as a separate issue (event definition change) and are not covered.
  - The procedure does not address group dynamics (e.g., an analyst revises because a colleague pressured them). That would be caught in Step 3 (internal state) or Step 5.

  **Steps Needing Boss Sign-off:**

  - The boss should sign off on the thresholds for what counts as "reliable" evidence (Step 2) and "reasonable" re-evaluation (Step 4). This might require creating a list of approved sources or requiring a minimum documentation standard.
  - The boss should approve the process for Step 5 (human review): who does it, how quickly, and what criteria they use.
  - The boss should also approve the final say in cases of deferral: if we defer to the old credence, does that mean we lock it and prevent further changes until new evidence? Or can the analyst try again? This policy must be set.

  In summary, this procedure provides a structured way to handle revisions, but it cannot eliminate judgment. It is a tool to reduce wobbling and encourage evidence-based updates, while flagging difficult cases for human oversight.
answer: |-
  ### Decision Procedure: When to Defer or Revise a Probability  
  This checklist helps analysts decide whether a proposed probability revision is rational learning or irrational wobbling. It draws on the intuition of reflection—deferring to your future self—but accounts for real-world pitfalls. The goal is to balance calibration with practicality. **Run through the steps in order. Stop and act if you hit a terminal step (REVISE, DEFER, or HUMAN REVIEW).**  

  ---

  #### **Step 0: Ground Rules**  
  - **Input:** You have an existing probability (**P_old**) for an event, and a proposed new probability (**P_new**).  
  - **Output:** One of:  
    - **REVISE** (use P_new).  
    - **DEFER** (stick with P_old).  
    - **HUMAN REVIEW** (escalate to a supervisor).  
  - **Key Principle:** Only revise if the change reflects *learning* (new evidence or rational rethinking). Ignore changes driven by noise (mood, fatigue, peer pressure).  

  ---

  #### **The Checklist**  
  **Step 1: Is there new evidence?**  
  - **Question:** "Did you get new, objective information about the event since P_old was set?"  
    - *Examples:* New data (poll, report), event update (e.g., candidate drops out), or corrected facts.  
    - *Not evidence:* Your gut feeling, colleague’s opinion, or broader world events unrelated to the event.  
  - **Sufficient Answer:**  
    - **YES → Proceed to Step 2.**  
    - **NO → Skip to Step 3.**  

  **Step 2: Is the new evidence relevant and reliable?**  
  - **Question:** "Is this evidence directly about the event? And is it trustworthy?"  
    - *Relevance:* Does it directly impact the outcome? (e.g., a poll for the election in question).  
    - *Reliability:* Is it from a credible source? (e.g., a reputable pollster, not a partisan blog).  
  - **Sufficient Answer:**  
    - **YES, AND THE CHANGE IS MODEST (≤±20%) → REVISE to P_new.**  
      - *Why modest?* Large jumps require extra scrutiny to avoid overreaction.  
    - **YES, BUT THE CHANGE IS LARGE (>±20%) OR SOURCE IS DODGY → Proceed to Step 5 (HUMAN REVIEW).**  
      - *Threshold:* ±20% is a rule of thumb; your org may adjust this.  
    - **NO (irrelevant or unreliable) → DEFER to P_old.**  

  **Step 3: Are you revising due to a personal/internal factor?**  
  - **Question:** "Is this change driven by your mood, energy, or stress—not evidence?"  
    - *Examples:* "I’m tired/gloomy," "I felt overconfident yesterday," "I got spooked by news about something else."  
  - **Sufficient Answer:**  
    - **YES → DEFER to P_old.**  
      - *Why?* Reflection assumes your future self is rational. If tired or biased, they aren’t a trustworthy anchor.  
    - **NO → Proceed to Step 4.**  

  **Step 4: Are you rethinking old evidence?**  
  - **Question:** "Did you reevaluate existing evidence? If yes, is this a correction of a clear mistake?"  
    - *Valid reasons:* "I found an error in my math," "I realized I misread a study," "I integrated old data I overlooked."  
    - *Invalid reasons:* "I changed my mind," "It feels less likely now."  
  - **Sufficient Answer:**  
    - **YES, AND YOU CAN EXPLAIN THE MISTAKE → REVISE to P_new.**  
      - *E.g.,* "I double-counted a data point; here’s the correction."  
    - **NO, OR YOU CAN’T PINPOINT THE ERROR → DEFER to P_old.**  
      - *Why?* Unanchored rethinking is likely wobbling.  

  **Step 5: Is this about your future self or expertise?**  
  - **Question:** "Is the change because you expect your future self (or a future expert) to believe P_new?"  
    - *Examples:* "I’ll be more certain later," "After the election, I’ll say I was always at P_new."  
  - **Sufficient Answer:**  
    - **YES → Proceed to Step 5a.**  

  **Step 5a: Is your future self trustworthy?**  
  - **Question:** "Will your future self have new evidence or be more rational? Or are they under pressure/biased?"  
    - *Trustworthy:* They’ll see new data (e.g., more polls) or gain expertise (e.g., training).  
    - *Untrustworthy:* They’ll be rushed, tired, or influenced by outcomes (e.g., hindsight bias).  
  - **Sufficient Answer:**  
    - **TRUSTWORTHY → REVISE to P_new.**  
      - *But only if:* You can state what evidence they’ll get or why they’ll be wiser.  
    - **UNTRUSTWORTHY or UNCLEAR → HUMAN REVIEW.**  
      - *Why?* This requires judging reliability—often subjective.  

  ---

  ### Case Applications  
  **Case 1: Move 70% → 40% after a new poll.**  
  - **Step 1:** YES (new poll = new evidence). → **Step 2.**  
  - **Step 2:** YES (relevant/reliable). Change is large (-30%) → **HUMAN REVIEW.**  
    - *Why you might not like this:* A big drop after one poll could be overreaction. Your boss must define "large change" thresholds.  

  **Case 2: Move 70% → 40% due to bad sleep (no new info).**  
  - **Step 1:** NO (no new evidence). → **Step 3.**  
  - **Step 3:** YES (internal factor). → **DEFER to 70%.**  
    - *Why:* Mood isn’t evidence. Reflection fails here—tired you isn’t a rational anchor.  

  **Case 3: Move to 90% because "I’m certain after the election, I’ll say I was 90% all along."**  
  - **Step 1:** NO (no new evidence). → **Step 3?**  
    - *But wait—this is about future self.* → **Step 5.**  
  - **Step 5:** YES → **Step 5a.**  
  - **Step 5a:** **UNTRUSTWORTHY → HUMAN REVIEW.**  
    - *Why?* After the election, your future self will know the outcome. They won’t say "90%" unless they’re misremembering or biased by hindsight. This smells of self-deception or values (e.g., wanting to appear consistent). Reflection breaks if the future self is corrupted by outcome knowledge.  

  ---

  ### Limitations and Judgment Calls  
  **What this procedure can’t do:**  
  1. **Eliminate subjectivity:** Steps 2 (reliability) and 4 (rethinking) rely on the analyst’s honesty and skill. A bad actor can game it.  
  2. **Handle vague evidence:** E.g., "market sentiment shifted." This blurs evidence (Step 2) and rethinking (Step 4).  
  3. **Resolve conflicts of interest:** E.g., an analyst revises to avoid embarrassment. This needs cultural oversight, not a rule.  
  4. **Replace calibration:** This checks *when* to change, not *how much*. Pair it with your shop’s calibration training.  

  **Where you’re dressing up judgment as a rule:**  
  - **Step 2’s "modest vs. large change":** ±20% is arbitrary. Your boss must set this threshold based on your event types.  
  - **Step 5a’s "trustworthy future self":** Requires guessing if future biases will dominate. This is philosophical and org-specific.  

  **Steps needing boss sign-off:**  
  1. **Step 2’s "large change" threshold:** Define what ±% triggers HUMAN REVIEW.  
  2. **Step 5a’s criteria:** What counts as "trustworthy" future expertise? (e.g., "Only if new evidence is guaranteed").  
  3. **HUMAN REVIEW process:** Who judges? How fast? What standards?  

  **Final note:** This isn’t formal reflection—it’s a pragmatic filter. Use it to reduce wobbling, but pair it with peer review and calibration tracking. If your analysts fight over "rational rethinking" (Step 4), that’s a sign to invest in training, not tweak the checklist.
