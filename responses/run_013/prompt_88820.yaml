  Grandad's tax advice? Solid gold. Uncle should take it. But him *blaming* Uncle? That's where he steps out of line. Look, he spent thirty years cheating — same exact thing Uncle's doing. You want to say "but he stopped!" Okay, fine. That makes him *less of a hypocrite today* than if he was still cheating. But it doesn't wipe the slate clean for what he did. When he points his finger at Uncle and says "you're doing wrong," he's pretending he's got some moral high ground Uncle should respect. But he built that ground on thirty years of the same dirt! Uncle could throw it right back in his face: "You did it for decades and only quit because you got caught. Why should I listen to *you* lecture me about right and wrong?" That's the wrong: Grandad's demanding Uncle live by a standard he himself ignored for most of his life. It’s like a thief who got caught and paid back the money now telling another thief mid-heist to stop — yeah, the advice is good, but the thief mid-heist isn’t gonna feel like that reformed guy has the *right* to shame him. He’s just… not the right messenger for that demand.

