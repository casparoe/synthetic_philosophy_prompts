  | **Bayesian Prior Adjust** | Initial confidence in a claim should scale inversely with its prior improbability. | Ignoring baseline likelihood when evaluating evidence. | Defensible          | Core to probabilistic reasoning.                  | **No** - Lowers credence but doesn't preclude inquiry. | Medical documentation + ruled out misdiagnosis/remission odds. |
