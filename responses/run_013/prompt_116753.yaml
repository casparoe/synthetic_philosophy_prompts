     - **Vague**: Evidence-Type demand ("extraordinary evidence" lacks clear criteria).  

  Dave used Hume's strongest reading to shut down conversation, but the uncle's claim isn't "miraculous" in Hume's sense (violating natural law) — it's an improbable medical event. Probing evidence (e.g., scan types, second opinions) would align with all readings *except* Hume's.
