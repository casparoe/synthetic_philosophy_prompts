  | **Hume's Miracle Threshold** | Testimony can **never** overcome the inherent improbability of a miracle; natural explanations always more likely. | Ever accepting miracles based on human testimony alone. | **Substantive but false** | Assumes miracles are *maximally* improbable; ignores cumulative/testable testimony. | **Yes** - Treats terminal remission as "miracle," dismissing testimony outright. | Nothing - Testimony is inherently inadequate per Hume. |
  | **Legal-Standard Proxy**  | "Extraordinary evidence" = exceptionally high standard of proof (e.g., "beyond reasonable doubt"). | Accepting high-stakes claims with weak/circumstantial evidence. | **Defensible**      | Pragmatic for consequential claims.               | **No** - Demands investigation, not dismissal. | Multiple scans, biopsies, independent oncology reviews. |

  ---

  **Test Cases Applied:**  
