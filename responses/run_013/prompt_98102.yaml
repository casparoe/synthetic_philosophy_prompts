prompt: |-
  I work on live migration for a cloud provider — moving running VMs and containers between machines without the workload noticing: dirty-page tracking, checkpoint-and-restore, stop-the-world cutovers, fork(), the whole mess. A flatmate of mine is doing a philosophy masters and he keeps going on about "mind uploading" and "gradual replacement" — replacing your neurons one at a time with silicon chips that do exactly the same job, until one day there's no meat left. I can follow the thought experiments fine, but I keep wanting to put them into my own terms, and I suspect thats where it gets interesting.

  So: can you restate the main positions in that debate in the vocabulary I actually use? The camp that says it's still you because at no point does anything stop; the camp that says the lights go out and an identical doppelgänger wakes up in your chair; and the camp that says whether it's *you* is the wrong question and what matters is psychological continuity rather than identity. I want the translation in terms of serialization and deserialization, live migration, checkpoint/restore, dirty pages, fork(), process IDs and file handles, dual-write, cutover, at-least-once delivery, idempotency, commit versus rollback, "same process" versus "same state". Be as faithful as you can and don't just relabel things — I want to know where the mapping is genuinely structural and where you're fudging it to make it fit.

  Then give me the residue report, which is the part I actually care about. Which claims translate cleanly (I'd guess "it's a copy, not a migration" has a pretty clean analogue in fork()), which only survive with distortion, and what has no counterpart in my vocabulary at all? My hunch is that the interesting bit is the first-person side: software has no notion of a stream of experience, so "the same running process" is defined purely by causal and state continuity, which is exactly the thing under dispute; and my tooling is perfectly happy to have two identical processes running at once, whereas the philosophers seem to think a person can't be duplicated. But I don't trust my hunch at all. Tell me whether the residue is my framework missing something real, or a sign the philosophers' claims were never as crisp as they sound.
