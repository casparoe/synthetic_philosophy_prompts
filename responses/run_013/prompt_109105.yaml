  For the language model case, three interpretations seem possible: 1) Strict Mechanism (only human brains host minds) 2) Behavioral Criterion (external signs matter) 3) Substance Dualism (mind requires non-physical substance). Each gives different predictions for the AI: 1) denies mind 2) grants mind 3) denies mind.

