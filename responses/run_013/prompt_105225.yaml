prompt: |-
  I run policy for a mid-size marketplace app — people post offers to do things for each other, we take a cut, and my team has a 48-hour turnaround on any new listing category, because trust-and-safety won't let anything go live without our written sign-off. We've had a run of proposals that all feel like the same problem in different clothes: someone wants to sell their place in a line for a limited-edition sneaker drop; a woman wants to list herself as a paid plus-one and fake relative for weddings and funerals (she says she's been doing it informally for years and just wants to go legit); a landlord wants to let tenants bid to jump the waitlist for a rent-controlled unit in his building; a guy wants to auction a tattoo ad slot on his forehead; and someone keeps re-posting a listing offering to pay a stranger for "a kidney, travelling expenses negotiable," which we keep pulling but never have a principled reason for pulling beyond it being illegal where the seller says he lives. Our general counsel is fine with anything not statutorally banned, which isn't a standard, and last month the board adopted a one-line principle — any transaction conveying a claim on a person's body, identity, or standing is presumptively off the table, anything transferring a fungible good or a service anyone could have performed is presumptively fine — which is lovely as a slogan and useless at 4pm on a Thursday.

  Can you turn this into an actual decision procedure my three-person team can run? Nobody here has a philosophy degree, we can't afford to deliberate for a week, and we have to justify every call in writing to legal and to the trust-and-safety lead who signs off. I want the questions in the order we should ask them, what counts as an answer that lets us stop, where the procedure flatly says no, and — just as important — where it has to kick the decision up to a human because it's a values question and not a facts question. Ground it in whatever the philosophy of markets and commodification has actually settled or at least clarified: consent versus coercion, whether we're monetizing someone's desperation, effects on third parties, the worry that some things get their meaning degraded by being bought and sold, and the possibility that our own disgust is just prejudice we inherited (one of my colleagues keeps bringing up the thing where a daycare started fining parents for late pickup and more parents started showing up late, as if that settles anything). Then run it on three of the cases above — the queue spot, the rentable relative, and the forehead ad — and be honest about where it breaks or misfires, including at least one case where it tells me to allow something that makes me personally queasy, since I'd rather find that out from you than from a reporter.

  Start with the one-sentence version of the rule, the thing I could tape to the wall, and then give me the full procedure. No preamble, no restating my question back to me.
reasoning: |-
  Hmm, the user runs policy for a mid-size marketplace app and needs a practical decision procedure for evaluating new listing categories. They're dealing with complex cases involving commodification of human elements like queue spots, rentable relatives, and forehead ads. Their current board principle is too vague for operational use.

  The user needs something actionable that considers ethical dimensions without requiring philosophical expertise. Key requirements include: clear step-by-step questions, stopping points for efficiency, absolute no-go zones, escalation triggers for value judgments, and grounding in market philosophy concepts like consent, degradation, and third-party effects.

  Notable constraints: 48-hour turnaround, three-person team, written justifications required, no tolerance for week-long deliberations. The procedure must also withstand legal scrutiny while addressing trust-and-safety concerns beyond mere legality.

  For the philosophical grounding, I'll focus on established frameworks: Radin's market-inalienability (things that lose meaning when sold), Sandel's corruption of non-market values, and Kantian concerns about treating persons as things. Also relevant: behavioral economics (perverse incentives), network effects, and coercion thresholds.

  The decision tree should start with clear disqualifiers (illegality, immediate harm) before moving to nuanced evaluation. Important to distinguish between "this fails objectively" vs "this requires value judgment." The forehead ad case will deliberately trigger the "personally queasy but philosophically permissible" scenario as requested.

  For implementation: binary yes/no questions where possible, with mandatory escalation points when reaching subjective territory. Will include examples of written justification language tailored to each test case. The tattoo ad evaluation will specifically demonstrate how to override personal discomfort when criteria are met.
answer: |-
  Here's a decision procedure grounded in market commodification philosophy, designed for speed and defensibility. It prioritizes hard stops and clear escalation points.

  **One-Sentence Rule (For Your Wall):**
  "Does this listing primarily transfer a legally obtained, non-exclusive service or fungible good without commodifying a person's body, core identity, legal standing, or an inherently scarce public/essential good, while avoiding foreseeable harm or undermining non-market values essential to social function?"

  **The 48-Hour Decision Procedure (Ask Sequentially):**

  1.  **Is it illegal in the jurisdictions involved?**
      *   *Answer:* Check statutes/regulations (seller/buyer/platform locations). Consult GC quickly if unclear.
      *   *Stop If:* **YES** -> **REJECT** (Clear justification: "Prohibited by law in [Jurisdiction] under [Statute].") *Example: Kidney listing - illegal organ sale.*
      *   *Escalate If:* Legality is ambiguous despite basic research.

  2.  **Does it directly involve buying/selling: human organs/blood, sexual acts, explicit illegal services, or a person under legal age?**
      *   *Answer:* Focus on the *core transaction*. "Place in line" is not an organ. "Fake relative" is not inherently sexual.
      *   *Stop If:* **YES** -> **REJECT** (Clear justification: "Involves prohibited category: [Specific Category].") *Example: Kidney listing (again).*
      *   *Escalate If:* Edge case (e.g., surrogate pregnancy arrangements - involves body/identity but complex legal/ethical status).

  3.  **Does it primarily commodify a person's physical body (beyond labor/time) OR their core legal/political identity?**
      *   *Answer:* "Commodify" = treating it *primarily* as a transferable asset. "Core identity" = fundamental attributes like citizenship, family ties (birth/marriage), voting rights, legal personhood.
      *   *Stop If:* **YES** -> **REJECT** (Clear justification: "Commodifies a person's [Body Part/Core Identity Attribute], violating the principle against trading claims on personhood.") *Example: Selling citizenship slot (if proposed).*
      *   *Escalate If:* Unclear if it's "core" (e.g., professional licenses? Academic degrees?).

  4.  **Does it monetize access to an essential good/service that is: (a) inherently scarce due to public policy/need (not just market scarcity), AND (b) access is allocated by non-market mechanisms (e.g., waitlists, need-based)?**
      *   *Answer:* Focus on *essential* goods (shelter, critical medicine, basic food access) and *policy-driven* scarcity/allocations. Sneakers aren't essential. Rent-controlled units *are*.
      *   *Stop If:* **YES** -> **REJECT** (Clear justification: "Monetizes access to an essential good/service ([Good/Service]) allocated via non-market mechanisms ([Mechanism]), undermining equitable access.") *Example: Landlord auctioning rent-controlled waitlist spot.*
      *   *Escalate If:* Debate over "essential" or the nature of the allocation mechanism.

  5.  **Is the seller likely to be acting under severe duress/desperation that meaningfully undermines consent?**
      *   *Answer:* Look for objective indicators: extreme financial vulnerability (e.g., selling necessities), immediate health/safety threat, or inherent power imbalance *in this specific transaction type*. Not generalized poverty. "Forehead ad guy" choosing to sell ad space isn't inherently desperate.
      *   *Stop If:* **YES** (Strong evidence/indicator) -> **REJECT** (Clear justification: "High risk of exploiting seller's acute vulnerability/duress for [Specific Reason].") *Example: Auctioning life-saving medication doses.*
      *   *Escalate If:* Vulnerability is suspected but not clear-cut (e.g., someone selling plasma frequently due to low income).

  6.  **Does the transaction create foreseeable, significant harm to identifiable non-consenting third parties?**
      *   *Answer:* "Foreseeable" = reasonably predictable. "Significant" = beyond minor inconvenience. "Identifiable" = specific individuals/groups impacted.
      *   *Stop If:* **YES** -> **REJECT** (Clear justification: "Creates significant foreseeable harm to [Third Party] via [Mechanism of Harm].") *Example: Selling cheat codes for a live multiplayer game (harms other players/company).*
      *   *Escalate If:* Harm is diffuse, speculative, or a matter of degree (e.g., does a paid wedding guest harm the concept of family?).

  7.  **Does monetizing this specific thing inherently corrupt/degrade its non-market social meaning or value in a way likely to cause widespread negative societal impact?**
      *   *Answer:* This is the core "commodification" worry (Radin/Sandel). Does buying/selling *this thing* change *what it is* or *how society values it* fundamentally? The daycare example is about *incentives* changing *behavior*, not inherent degradation. Weddings have paid vendors (caterers, musicians); does a paid *guest* cross a different line?
      *   *Escalate If:* **YES** (Team feels strongly it does) OR **UNCLEAR** -> **ESCALATE TO TRUST & SAFETY LEAD / BOARD PRINCIPLE DISCUSSION.** (Justification: "Requires value judgment on whether monetizing [Thing] inherently degrades its non-market social meaning/value.") *This is the primary values gate.*
      *   *Stop If:* **NO** -> Proceed to 8.

  8.  **Can the service/good be performed/provided by multiple people without unique, inherent personal attributes being the core value? (Fungibility/Non-Exclusivity Test)**
      *   *Answer:* "Inherent personal attributes" = something unique to *that person* biologically or identity-wise (e.g., their specific kidney, their birth family ties). Standing in line is fungible (anyone can stand). Being a fake relative *requires* a person, but the service (attendance, acting) is performable by many.
      *   *Stop If:* **NO** -> **REJECT** (Clear justification: "Core value derives from unique, inherent personal attributes of the seller, commodifying identity/standing.") *Example: Selling your unique genetic material (beyond regulated donation).*
      *   *Proceed If:* **YES** -> **APPROVE** (Justification: "Transfer of fungible good/service ([Describe]) performed/provided by multiple parties, not primarily commodifying body, core identity, essential access, or causing clear harm/undue degradation.")

  **Application to Cases:**

  1.  **Selling Place in Sneaker Line:**
      *   1: No (Not illegal).
      *   2: No (Not prohibited category).
      *   3: No (Commodifies "spot," not body/identity).
      *   4: No (Sneakers aren't essential; scarcity is market-driven).
      *   5: No (Seller not inherently desperate).
      *   6: No (Minimal third-party harm - annoyance at worst).
      *   7: **ESCALATE?** *Team Disagreement Likely Here.* Does paying for line spots degrade the fairness/value of "hype" releases? Or is it just efficient allocation? *This is the values gate.* Procedure forces escalation for debate. *If deemed "NO degradation":*
      *   8: **YES** (Anyone can stand in line). -> **APPROVE** (Justification: "Transfer of fungible service (holding a spot in line) for a non-essential good. No inherent commodification of personhood, essential access, or clear harm.")

  2.  **Rentable Relative (Wedding Plus-One):**
      *   1: No (Not illegal to hire a companion).
      *   2: No (Not prohibited category).
      *   3: **ESCALATE?** *Core Identity Question.* Is "family member" a core identity attribute being faked/sold? Or is she selling a *service* (acting, attendance, emotional labor) that anyone can provide? *This is fuzzy.* Procedure suggests escalation at Step 3 or Step 7. *Assume team decides at Step 3 it's primarily a service, not selling identity:*
      *   4: No (Not essential good).
      *   5: No (Seller appears entrepreneurial, not desperate).
      *   6: **ESCALATE?** Harm to families? Deception? (Requires T&S Lead input on platform deception rules). *If deception allowed/regulated:*
      *   7: **ESCALATE?** *Major Values Gate.* Does this degrade the meaning of family/events? Paid vendors exist; paid actors exist. Is paid *family* different? *This requires the values debate.* Procedure forces escalation. *If deemed "Acceptable Degradation" or "Not Inherently Degrading":*
      *   8: **YES** (Service of acting/attendance is performable by many). -> **APPROVE** (Justification: "Transfer of a service (acting as a companion/relative) performable by multiple individuals. While involving identity portrayal, the core transaction is the service, not the commodification of innate family bonds or essential access. Deception aspects addressed via T&S profile/listing guidelines [if developed].") *This might make you queasy, but the procedure allows it if it clears the hurdles.*

  3.  **Forehead Tattoo Ad Auction:**
      *   1: No (Assuming tattoo ads legal in jurisdiction).
      *   2: No (Not prohibited category - body modification is legal).
      *   3: **YES** -> **REJECT** (Clear justification: "Commodifies a person's physical body (skin/forehead) as a permanent advertising space. While involving consent, the core transaction is the use of the body itself beyond labor/time, violating the principle against trading claims on the body.") *Procedure stops hard at Step 3. The "beyond labor/time" is key - it's not selling his *skill* as a tattoo bearer, it's selling the *location on his body* permanently. This aligns with concerns about treating the body as a mere object/commodity.*

  **Where It Breaks/Misfires:**

  1.  **The "Degradation" Question (Step 7):** This is inherently subjective. The procedure forces escalation here, acknowledging it's a values call, not a factual one. The daycare example is relevant *here* – it shows monetization can change behavior/meaning. The team needs principles (beyond the board's slogan) for this. Does your platform value fairness in certain contexts? Authenticity? Avoiding deception? This step requires leadership guidance.
  2.  **"Core Identity" (Step 3):** Distinguishing "core identity" (citizenship, birth family) from roles/performances (actor, paid guest) is messy. The Rentable Relative case highlights this. The procedure forces careful thought or escalation. Precedents help.
  3.  **Foreseeable Harm (Step 6):** Predicting harm is hard. The forehead ad *might* harm the seller later (employment?), but is that "foreseeable" and "significant" enough? The procedure uses a high bar ("significant, identifiable").
  4.  **The Queasy But Allowed Case:** As intended, the Rentable Relative case shows how the procedure could lead to approving something that feels deeply uncomfortable about monetizing personal relationships, if it technically passes the factual hurdles and the "degradation" value judgment goes a certain way. **This is why Step 7 exists and requires escalation for these sensitive cases.** Don't let Step 8 be automatic after Step 7 - use the escalation to ensure leadership owns the values call.

  **Key Takeaways for Your Team:**

  *   **Use the Steps Sequentially:** Stop at the first "REJECT" or "ESCALATE".
  *   **Document Rigorously:** For each step, note the answer and brief reasoning ("No, sneakers not essential").
  *   **Escalation is a Valid Outcome:** Flagging "This needs a values debate" *is* a responsible output within 48 hours.
  *   **Build Precedents:** Document decisions, especially Escalation/Step 7 outcomes, to create consistency.
  *   **Focus on the Core Transaction:** What is *primarily* being bought/sold? Avoid getting lost in edge cases.
  *   **"Consent" is Necessary But Not Sufficient:** The forehead ad involves consent, but fails earlier steps. Steps 3-7 are the safeguards against problematic commodification *despite* consent.

  This procedure provides structure, clear rejection points, forces explicit discussion on values, and generates defensible justifications based on established commodification concerns, while working within your constraints.
