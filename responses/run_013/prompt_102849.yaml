  ## Sestina on the Heterogeneity of Pleasure

  The bath’s slow heat, a sinking, liquid ease,
  A pure **distinctive sensation** known to skin and bone.
  Does bliss reside within this single hue,
  A universal **hedonic tone**, one simple chime?
  Perhaps it’s just the **taking-pleasure-in**
  The water’s hold, a **mode or manner** thin.

  But then the final chord, resolving thin
  Airs into peace – where *is* that known **ease**?
  Is joy the sound itself, or **taking-pleasure-in**
  The pattern’s close? No single **sensation**’s
  Found within the ear. A different **tone**
  Emerges, mental, bright, a different **hue**.

  A proof clicks shut. The sudden, clean **hue**
  Of understanding floods the mind – no **thin**
  Affect, but sharp and deep, a **tone**
  Of pure cognition crowned. Is this the **ease**
  Of structure grasped? Or just a **sensation**
  Linked to thought? The act, **taking-pleasure-in**, wins?

  Consider friendship’s warmth, **taking-pleasure-in**
  Their presence, shared. What shared internal **hue**
  Or common thread, what matching **sensation**
  Binds this to proof or bath? The bond feels **thin**
  Compared to heat or sound. Is shared **ease**
  Enough? Or just a social, softer **tone**?

  Now stretch the muscle past its ache, a **tone**
  Of burn and release. Pain laced with **taking-pleasure-in**
  The yielding limit. Where’s the simple **ease**
  Here? Is the hurt itself a pleasure’s **hue**?
  Or is the struggle, sharp and **thin**,
  The very core, a complex **sensation**?

  Sad music holds a grief, a **sensation**
  Profoundly sweet. What neutral **tone**
  Can paint this mingled joy? The feeling’s **thin**
  As smoke, yet deep. Is **taking-pleasure-in**
  The sorrow’s shape the key? Its somber **hue**
  Denies the bath’s unalloyed **ease**.

  We seek the core: a **kind of wanting**, **ease**
  Abstract? But pain we want to cease brings **sensation**.
  Is pleasure just the **bare word pleasant**, **hue**
  Less concept, sign without a fixed **tone**?
  Or always bound, **taking-pleasure-in**
  Some object, leaving essence **thin**?

  ---

  Envoi:
  Philosopher, your quest for core grows **thin**.
  Each candidate – **distinctive sensation**, **hedonic tone**,
  **Taking-pleasure-in**, **mode or manner**, **kind of wanting**, **bare word pleasant** –
  Shines then cracks. The warm bath's **ease**,
  The stretch's ache, the chord's resolved **hue**,
  Resist the unifying **sensation**. Pleasure's **hue**
  Is being colored: no shade defines its **thin**
  Bright weave, its scattered **tone**. **Taking-pleasure-in**
  Remains the act, the **mode or manner** spun
  Around the world, rejecting **ease**
  Of definition. Call it **bare word pleasant** – done.

  ---

  **Notes on Accuracy & Intent:**

  1.  **Theories Embodied:**
      *   **Distinctive Sensation:** Plausible for the bath's heat (Stanza 1), but challenged by the intellectual proof (Stanza 3) and music's complex grief (Stanza 6).
      *   **Hedonic Tone:** Suggested for the bath's "bliss" and "simple chime" (Stanza 1), but shown inadequate for the proof's cognitive joy (Stanza 3) and the stretch's pain/pleasure mix (Stanza 5).
      *   **Taking-Pleasure-In:** Highlighted for the music's pattern (Stanza 2), the proof's act (Stanza 3), and friendship (Stanza 4). Its relational nature is central, but it doesn't *define* the pleasure itself, hence the failure to unify.
      *   **Mode or Manner:** Explored in the bath ("water's hold," Stanza 1), the stretch ("struggle," Stanza 5), and implicitly elsewhere. It struggles to capture the *object* of pleasure distinctly (Stanza 4).
      *   **Kind of Wanting:** Explicitly named in the envoi, reflecting theories where pleasure *is* the motivational state. Contrasted with passive pleasures like the bath's ease.
      *   **Bare Word Pleasant:** Presented as the fallback nominalist position – the word labels diverse phenomena without a common essence (Stanza 6, Envoi).

  2.  **Heterogeneity Illustrated:**
      *   Bodily (bath), Aesthetic (cadence), Intellectual (proof), Social (friend), Complex Bodily (stretch), Complex Aesthetic (sad music).
      *   Mixed Pleasures: The stretch (pleasure in pain/release), sad music (pleasure in grief).

  3.  **The Determinable Analogy:** Explicitly stated in the envoi: "Pleasure's hue / Is being colored: no shade defines...".

  4.  **The Sestina's Role:** The form's relentless rotation of end-words mirrors the philosophical attempt to force unification ("rotation keeps attempting a unification"). The envoi's cramming of all six terms visibly strains and fails ("visibly fails to complete").

  5.  **Accessibility:** The poem relies on concrete, relatable experiences (bath, music, friendship, stretch, proof, grief) to ground the abstract problem, allowing emotional resonance without prior philosophical knowledge. The *dissonance* felt between these different pleasures is accessible.
