  Finally, the moral dimension: suffering/well-being only matters if there's a subject. Insects potentially qualify; dust doesn't. But this leans on the probability anchor again. 

  ...Wait, did I just reinvent the "Drake equation for sentience"? With terms for neural complexity, behavioral responses, etc.? That metaphor might help the user. 

  Borderline cases: nematodes? Microbes? Here, the probability anchor weakens progressively. We must admit uncertainty but note the burden of proof shifts—extraordinary claims (sentient bacteria) need extraordinary evidence. 

  The user's real need isn't terminology—it's a framework to neutrally evaluate his friend's argument without conceding to dust-mote absurdity. He wants epistemic integrity.
answer: |-
  You've hit on a deeply challenging and philosophically rich problem at the intersection of ethics, probability, and the philosophy of mind. There isn't a single universally accepted term for this precise argument pattern, but we can dissect its components, legitimate boundaries, and why the "dust" version fails. Here's a breakdown:

  ### Core Structure: The Scale-Probability Product Argument
  1.  **Vast Scale:** An enormous population exists (e.g., insects, ~10^19 individuals).
  2.  **Non-Zero Probability:** There's some unknown, potentially very small, non-zero probability (P) that each member of this population possesses morally relevant experiences (e.g., capacity for suffering/well-being).
  3.  **Expected Moral Weight:** The *expected* number of morally relevant entities is Scale * P.
  4.  **Overwhelming Magnitude:** Even for extremely small P (e.g., 1 in a billion), Scale * P remains astronomically large (e.g., 10 billion entities), potentially dwarfing the known moral weight of humans or other animals.
  5.  **Irreducible Uncertainty:** We lack the knowledge to confidently assign P=0 or a definitively "low enough" P to make Scale * P negligible.

  **This is fundamentally an argument from *expected value under radical uncertainty*.** Its power comes from the combination of scale and our epistemic limitations regarding consciousness.

  ### Legitimate vs. Illegitimate Applications: The Crucial Distinction (Not Just the Dial)
  The difference between insects and dust/thermostats isn't *just* about arbitrarily lowering P. It's about **epistemically grounded priors and the nature of the evidence**. We need concepts like:

  1.  **Biological Continuity & Evolutionary Plausibility:**
      *   **Insects:** Belong to the animal kingdom. They possess nervous systems (however simple), sensory organs, exhibit goal-directed behaviors (foraging, mating, fleeing threats), nociception (physiological pain response), and learning capacity. They share evolutionary ancestors with animals we confidently believe are sentient (e.g., vertebrates). While their *subjective experience* is unknown and likely vastly different, the *biological prerequisites* for some form of sentience are *plausibly present*. This provides a *reason* for assigning a non-negligible prior probability (even if very low) to insect sentience.
      *   **Dust/Thermostats:** Lack any biological substrate associated with sentience. No nervous system, no metabolism geared towards homeostasis and response in the way living organisms have, no evolutionary lineage suggesting the development of subjective experience. Assigning a non-negligible P to dust sentience requires positing fundamentally new, unsupported metaphysical principles (e.g., panpsychism where *fundamental particles* have proto-consciousness, not complex arrangements like thermostats). There is *no positive evidence or plausible biological/physical mechanism* to support it.

  2.  **Evidence Anchors & Burden of Proof:**
      *   **Insects:** The argument leverages *positive evidence* (neural substrates, behavior) that, while inconclusive for sentience, is *relevant* to the question. The uncertainty stems from interpreting that evidence. The burden of proof for assigning a *very low* P isn't trivial – one must argue *why* the observed complexity *doesn't* support even minimal sentience.
      *   **Dust/Thermostats:** There is *zero positive evidence* relevant to sentience. The "evidence" is merely their existence and number. Assigning any non-negligible P requires extraordinary justification that isn't grounded in science. The burden of proof lies entirely on the claim *for* sentience, and it fails spectacularly. "We don't know for *absolute certain* it's impossible" isn't enough; it must be *plausible* given our best understanding.

  3.  **The Nature of the "Probability" (P):**
      *   **Insects:** P represents genuine scientific uncertainty about a complex biological phenomenon within the domain of life. It's a placeholder for our ignorance about the neural correlates of consciousness.
      *   **Dust/Thermostats:** P represents a purely speculative, metaphysical possibility untethered from empirical science. Assigning a specific number (even 1 in a billion) is meaningless without a grounding mechanism.

  **Coined Term:** The legitimate core argument could be called the **"Biological Uncertainty Multiplier"** or the **"Scaled Biological Prior"** argument. It relies on:
  *   A biologically plausible candidate population.
  *   Genuine scientific uncertainty about the presence of a morally relevant property (sentience).
  *   The vast scale of the population amplifying the *expected* moral weight due to that uncertainty.

  ### Why "Lowering the Odds" Isn't Arbitrary (When Done Right)
  Your friend is partially right: arbitrarily declaring "P is just *too low*" without justification *is* question-begging. However, justifying a *very low* P for insects isn't arbitrary if based on:
  *   **Comparative Neurobiology:** Arguing that insect nervous systems lack the specific integration, complexity, or structures strongly correlated with vertebrate (or cephalopod) sentience.
  *   **Behavioral Thresholds:** Arguing their behaviors can be fully explained by non-conscious mechanisms (e.g., complex reflexes, pre-programmed routines).
  *   **Evolutionary Function:** Questioning the adaptive value of subjective experience for creatures with such simple lives and rapid lifecycles.
  This *is* an active debate in science/philosophy. The key is that arguing for a low P *requires engaging with the biological evidence*, not just waving it away. For dust, arguing P is negligible requires no special pleading because there's nothing to engage with.

  ### Borderline Cases: Where the Distinction Blurs
  1.  **Microscopic Animals (Nematodes, Tardigrades):** Simpler than insects. Nervous systems are extremely rudimentary. Plausibility of sentience is lower, but biological continuity is still present. The argument weakens significantly but isn't *as* absurd as dust. Depends heavily on the specific biology.
  2.  **Bivalves (Oysters, Mussels):** No central brain, diffuse nerve net. Debate exists. Some argue they lack the neural integration for sentience, placing them closer to the borderline. Others point to simple behaviors. More contentious than insects.
  3.  **Plants:** Exhibit complex responses and signaling. Lack a nervous system entirely. Arguments for plant sentience usually rely on panpsychism or radically redefining sentience. Generally falls on the "implausible" side like dust for most philosophers/scientists, though less *metaphysically* absurd. The lack of *any* neural analogue is the key differentiator from insects.
  4.  **Radical Panpsychism:** If one genuinely holds a well-developed panpsychist view where fundamental particles have proto-consciousness, *then* dust and thermostats *would* have a non-zero P *within that specific metaphysical framework*. However, this framework itself lacks empirical support and faces massive combination problems (how do dust particles' proto-consciousness combine into thermostat consciousness?). This is a fringe view precisely because it lacks the biological/evidence anchors.

  ### Conclusion: The Line Isn't a Number, It's a Type of Justification
  The difference isn't that P for dust is 10^-100 while P for insects is "only" 10^-9. It's that:

  *   **For insects (and animals broadly):** Assigning a non-negligible P is based on **epistemically grounded biological priors** arising from shared evolutionary history, the presence of relevant physiological systems (nervous systems), and behavioral complexity that *might* indicate sentience. The uncertainty is scientific.
  *   **For dust/thermostats:** Assigning a non-negligible P requires **appealing to unsupported metaphysical speculation** completely untethered from evidence about the known correlates and plausible mechanisms of sentience. The uncertainty is purely logical/metaphysical.

  The "Biological Uncertainty Multiplier" argument leverages *scientific ignorance within a biologically plausible domain* coupled with scale. The "dust argument" leverages *metaphysical speculation outside any empirically grounded domain of plausibility*. The line is drawn at the boundary of **biological plausibility and evidence-anchored priors.** While the exact placement of that line for borderline cases (like bivalves) is debatable, the chasm separating insects from dust is vast and principled. Your intuition that the dust argument is silly is correct; it fails not because the probability is *lower*, but because the *reason* for assigning any probability at all is fundamentally unjustified.
