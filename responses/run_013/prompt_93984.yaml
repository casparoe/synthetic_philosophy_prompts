answer: |-
  ## Sestina: For Clémence, Who Asks How To Live
  *(After Émilie du Châtelet, at her desk)*

  This ink, this page, this quiet light – such **health**
  As fortune grants, not earned. We start there, free
  Of grinding want, the worst kind’s **prejudice**.
  A precondition, dear Clémence, not prize.
  First lesson: guard this fragile **health**,
  And fight the inner foe, **prejudice**,
  That whispers limits born of sex or sphere.
  For strength begins when we deny **prejudice**.

  They counsel killing fire – that savage **passion**!
  The Stoics err. Why murder life’s own pulse?
  Extinguish **passion**, you extinguish joy.
  But fire consumes. The gambler’s heat, the flush
  Of sudden love… they fade, or burn to ash.
  They are the storm; we must cultivate **taste**.

  Ah, **taste**! The ripened fruit of **passion** tamed.
  Not sudden blaze, but steady, warming sun.
  For **passion** wanes as limbs grow slow, as breath
  Grows short. What then? The scholar’s bright **taste**
  Remains: the theorem solved, the verse reclaimed,
  A garden of the mind no winter wastes.
  This learned **taste** outlasts the fiercest **passion**.

  Embrace **illusion**! Not the fool’s dull lie,
  But art’s sweet veil, the consecrated dream
  That makes the draught more sweet, the night less stark.
  The pedant screams *See through!* – deny him. **Taste**
  Demands the gilded frame, the lover’s sigh.
  **Illusion**, wisely held, performs its work.
  Let reasoned **illusion** soften truth’s sharp **taste**.

  We build our citadel against that **death**
  We know stalks near. Not with blind **illusion**
  That denies decay – a childish shield.
  Nor morbid gaze that chills the present breath.
  We *know* the **death**. We banish it *in thought*,
  Refuse its shadow at the feast of sense.
  Constructed **illusion** bars intrusive **death**.

  So live, my dear: with reasoned **passion** first,
  Then cultivate enduring, deep **taste**.
  Use consecrated **illusion** as a tool.
  Defy the soul-killing, external **prejudice**.
  Guard well the vessel – cherish fleeting **health**.
  Deny dominion to the final **death**.

  **(Envoi)**
  Dear Mind, here is the fragile craft: **Passion’s** flame
  Must feed, not burn, the structure. Build your **Taste**
  On truths embraced, with chosen **Illusion**’s grace.
  The walls rise high against cold **Death**’s advance,
  On ground first cleared of crippling **Prejudice**,
  And held secure by what remains of **Health**.

  ---

  **Brief Note on Liberties and Textual Tensions:**

  This poem leans into the more pragmatic, almost Epicurean, aspects of du Châtelet's *Discourse* regarding **illusion**, emphasizing its utility for sustaining agreeable feeling ("consecrated dream," "art's sweet veil") without fully resolving the tension with her profound commitment to scientific truth and reason. A reader focused on her rigorous Newtonianism or her insistence on basing happiness on "clear ideas" might find this emphasis on sanctioned illusion too generous. The poem also simplifies the potential **egoistic/perfectionist tension**; while it highlights the cultivation of intellect ("scholar’s bright taste"), it leans towards the personal project of happiness ("fragile craft") rather than explicitly framing it as the perfection of one's rational nature, a reading supported elsewhere in her work. The poem implicitly accepts her limitation of the project to the privileged ("fortune grants") without critique, reflecting her text but potentially downplaying the ethical weight of that exclusion for a modern reader. The strongest textual pushback would likely come from passages where she insists happiness requires *truth* as its foundation, even while advocating for the strategic management of painful thoughts like death.
