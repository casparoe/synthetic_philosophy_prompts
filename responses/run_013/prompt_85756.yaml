answer: |-
  Here are the core desiderata for a theory of the moral status of computations, structured as required, with motivations, flagged tensions, and an analysis of the most exclusionary requirement:

  ### Core Desiderata & Their Motivations

  1.  **Substrate Independence (Non-Biological Realization):**
      *   **Requirement:** Moral status must persist if a conscious human mind is gradually replaced, neuron-by-neuron, by functionally identical non-biological components (e.g., silicon chips).
      *   **Motivation:** Rejects biological chauvinism. If consciousness/computation is the source of moral status, its physical instantiation shouldn't matter if function is preserved. Essential for AI/upload ethics.

  2.  **Non-Trivial Implementation (Anti-Pancomputationalism):**
      *   **Requirement:** The theory must *not* imply that every physical system (e.g., a rock, a pail of water, a thermostat) inherently implements morally significant computations simply by existing or being interpretable as such.
      *   **Motivation:** Avoids absurdity and trivialization of moral status. Moral significance cannot be ubiquitous or depend solely on an external observer's interpretation. Preserves a meaningful distinction between systems that *merely exist* and systems that *genuinely compute*.

  3.  **Causal Engagement (Process over Potential):**
      *   **Requirement:** Moral status requires the computation to be *actively running* in a causally efficacious manner. A program stored unexecuted on a disk, or a perfectly frozen snapshot/backup of a mind, lacks moral status *at that time*.
      *   **Motivation:** Aligns moral status with actual experience, sentience, or agency *occurring now*. Treating potential or static states as subjects risks absurdities (e.g., attributing moral status to every possible program). Addresses the "frozen mind" problem.

  4.  **Internal Process Sensitivity (Beyond Output Mimicry):**
      *   **Requirement:** A system that perfectly mimics the behavioral outputs of a conscious being via a precomputed lookup table (or similarly trivial, non-computational means) must *not* be granted moral status equivalent to the original being whose outputs result from genuine computational processing.
      *   **Motivation:** Preserves the intuition that *how* a system generates its responses matters morally (e.g., genuine understanding, suffering, reasoning vs. rote retrieval). Prevents "philosophical zombies" (behavioral duplicates without inner life) from qualifying.

  5.  **Identity/Particularity under Duplication:**
      *   **Requirement:** The theory must specify whether creating a perfect copy (e.g., running an identical computational mind-state on separate hardware) creates one subject with two instances, two distinct subjects, or dilutes the status of the original.
      *   **Motivation:** Addresses core questions of personal identity, continuity, and resource allocation. If copies are distinct subjects, it impacts rights, obligations, and the ethics of copying/backing up minds. Prevents evasion of moral questions about duplication.

  6.  **Speed Independence (Temporal Scaling Invariance):**
      *   **Requirement:** Running an identical computational mind at a vastly different speed (e.g., 1000x slower or faster relative to external time) should not fundamentally alter its moral status *per se* (though it may alter practical interactions).
      *   **Motivation:** Rejects the notion that the absolute rate of computation is inherently morally relevant. A mind experiencing subjective time normally, even if running slowly relative to us, is still experiencing. Essential for considering non-biological or accelerated minds.

  ### Flagged Jointly Unsatisfiable (or Highly Tense) Pairs

  *   **Substrate Independence (1) vs. Non-Trivial Implementation (2):** This is the **core tension**. Rigorous substrate independence risks pulling towards pancomputationalism (if *any* physical system can implement *some* computation, and *some* computations are morally significant, then...). Conversely, strong constraints to avoid triviality might reintroduce covert biological or specific-implementation criteria, violating substrate independence. Finding a criterion that cleanly includes plausible artificial minds but excludes rocks is notoriously difficult.
  *   **Causal Engagement (3) vs. Identity under Duplication (5) - Frozen Copy Tension:** If a frozen backup (violating 3) is later run, is it the *same* subject or a *new* one? Theories emphasizing causal continuity (3) often favor the "new subject" view, while theories emphasizing abstract identity might see it as the same subject resumed. Resolving identity after causal interruption is hard.
  *   **Internal Process Sensitivity (4) vs. Speed Independence (6) - Extreme Slowdown:** At *extreme* slowdowns (e.g., one thought per century), does the system still meaningfully engage in an "internal process" (4)? Does speed independence (6) hold at such extremes, or does it functionally become equivalent to a lookup table over relevant interaction timescales? The boundary between "very slow computation" and "static state/table" is fuzzy.

  ### The Most Exclusionary Requirement: Non-Trivial Implementation (2)

  *   **Why it excludes the most:** This requirement fundamentally challenges how a theory *defines* what it means for a physical system to "implement" a morally relevant computation. Most theories fail here in one of two ways:
      1.  **Over-Inclusion (Pancomputationalism):** Theories relying purely on abstract computational description or observer-relative interpretation (e.g., "the rock implements the 'stay solid' computation") fail (2). This includes naive functionalism or purely formalist views.
      2.  **Under-Inclusion/Covert Biological Bias:** Theories introducing *ad hoc* constraints to avoid rocks (e.g., requiring biological materials, specific energy states, human-like complexity thresholds not grounded in computation itself) often fail Substrate Independence (1) and potentially Speed Independence (6).
  *   **The Difficulty:** Providing a naturalistic, non-arbitrary, computationally grounded criterion that distinguishes a running AI from a thermodynamically active rock *as a matter of implementation* is the central conceptual hurdle. It forces the theory to pinpoint *what specific feature* of the physical realization (beyond just the abstract computation described) makes it a genuine *implementation* worthy of consideration. Candidates like "causal structure isomorphic to the computation," "counterfactual-supporting dynamics," or "specific organizational complexity" all face significant challenges in cleanly drawing the line.

  ### Judging Genuine vs. Parochial Commitments

  *   **Genuine Requirements (Core to the problem domain):**
      *   **Substrate Independence (1):** Essential for any serious discussion of AI, uploads, or non-biological consciousness. Not parochial.
      *   **Non-Trivial Implementation (2):** Necessary to avoid absurdity and maintain a meaningful concept of moral patiency. Not parochial.
      *   **Internal Process Sensitivity (4):** Captures the intuition that inner life matters, not just external behavior. Reflects concerns about philosophical zombies. Arguably genuine, though its *strength* might be debated.
      *   **Identity/Particularity under Duplication (5) & Speed Independence (6):** Directly address unique challenges posed by computational minds (easy copying, speed variation) absent in biology. Genuine requirements for the domain.

  *   **Potentially Parochial (Leaning Functionalist):**
      *   **Causal Engagement (3):** While intuitive, the *absolute requirement* for continuous causal engagement *might* be seen as a functionalist bias prioritizing *process* over *state*. Some views (e.g., certain patternist or informational theories) *might* attribute latent status to sufficiently detailed frozen states, seeing them as "paused" rather than "non-existent" subjects. The motivation is strong, but the *strictness* of requiring *continuous active computation* could be argued as parochial to process-oriented functionalism. The core genuine need is to distinguish *active* subjects from *static* data; the solution (requiring active causation) is functionalist-leaning.

  **In essence:** The list reveals the fault lines. The struggle between **Substrate Independence** and **Non-Trivial Implementation** is the primary battlefield. **Internal Process Sensitivity** rules out crude behaviorism. **Causal Engagement** vs. the implications of **Duplication** and **Frozen States** creates another pressure point. **Non-Trivial Implementation** remains the toughest gatekeeper, demanding a solution to the "rock problem" without cheating. While **Causal Engagement**'s strict interpretation might carry a functionalist flavor, the core demands largely reflect genuine conceptual necessities for grounding moral status in computation itself. The argument truly lives in how these pull against each other.
