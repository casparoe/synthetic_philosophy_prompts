  Copied minds and speed variations touch on duplication and dilution. If a mind is copied, does each copy have full moral status? If it's slowed down, does its moral worth decrease? Theories that are fine with copies might struggle with resource allocation, while those against duplication could face issues with identical twins or backups. 

