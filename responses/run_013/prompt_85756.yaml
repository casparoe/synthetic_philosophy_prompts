  First, substrate independence is crucial. They don't want the theory to fail if a brain is replaced with silicon chips. But at the same time, it can't be so permissive that any physical system counts. That's a tricky balance. The trivial-implementation problem here might be the hardest because almost any physical system can be interpreted as running some computation if we're loose enough. So that constraint probably knocks out many theories right away.

