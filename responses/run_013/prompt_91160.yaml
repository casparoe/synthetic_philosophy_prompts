prompt: |-
  I run the graphics desk of a municipal statistics office. Every year we produce about a dozen large pictorial wall charts — printed for libraries, schools, clinics and welfare offices, frequently reproduced in newspapers, and sometimes lifted by political campaigns we have no control over — for a city in which many residents read the local language poorly, so the pictures have to carry much of the message. My team is three people, we get two weeks per chart, we work only from tables our statisticians have already certified, and we draw on a library of some two hundred pictograms.

  I want to rebuild our house style on the principles of Otto Neurath's Vienna Method of Pictorial Statistics, later renamed Isotype, developed at the Social and Economic Museum of Vienna in the 1920s and 1930s. The essentials as I understand them: a quantity is shown by repeating an identical symbol, never by enlarging one, because readers cannot reliably compare areas or volumes but can count; symbols are drawn flat, without perspective; colours carry fixed meanings; and a distinct role, the transformer, mediates between the certified table and the artist's sketch to produce a chart a reader can decode without instruction. Neurath held that this was not a full language but a helping language always accompanied by words — his slogan was "Words divide, pictures unite" — and the museum's own formula was that it is better to remember a simplified picture than to forget an accurate figure.

  Write me the decision procedure my team should follow, from receiving a certified table to signing off a poster. It should be ordered steps a junior designer can run without me; for each step, say what counts as a sufficient answer and what to do when the answer is no. Say where the procedure stops and hands the matter to a person, and name that person. Include a rule for when a new pictogram may be added to the library and how a colour may be given a new meaning. Deal explicitly with the data we actually receive, most of which are not counts of countable things: rates, averages, index numbers, and money figures spanning decades of currency change. And state plainly which claims the visual system must refuse to carry, and how we should answer someone who asks us to make a chart more forceful.

  Then apply the procedure to three cases, one row each in a table: (a) new dwellings completed last year, by district; (b) average net household income, by district; (c) a request from our communications director for a campaign poster showing that our city's vaccination coverage is two percentage points above the neighbouring city's. For each, give the verdict, the chart if any that the procedure yields, and the step that decides it.

  Close with a short section on what this procedure cannot do and where it will misfire. Open the whole response with one sentence stating the rule that the rest of the procedure elaborates, and keep the response under 1,200 words.
reasoning: |-
  Okay, the user runs a graphics desk for a municipal statistics office and needs a decision procedure based on Otto Neurath's Isotype principles. They want a clear, step-by-step process for creating pictorial wall charts that can be followed by junior designers without constant supervision. The procedure must handle various data types like rates, averages, and money figures across currency changes, and explicitly state what claims the visual system can't carry.

  First, I need to recall Neurath's core principles: quantities shown by repeating identical symbols (not resizing), flat pictograms without perspective, fixed color meanings, and a transformer role mediating between data and design. The transformer is crucial here—it's the person who translates the data into visual rules before the artist sketches anything.

  The user mentioned their actual data includes non-countable things like averages and index numbers. That's a challenge because Isotype relies on countable units. I'll need rules for converting these into countable representations, like using one symbol per unit (e.g., 1 house = 100 dwellings) or showing comparative ranks instead of absolute values. For money across decades, adjusting for inflation to a base year seems essential to make symbols comparable.

  The procedure should start when they receive a certified table and end with a signed-off poster. Steps need clear pass/fail criteria and escalation points. The transformer role is key—probably a senior team member who handles data interpretation. Junior designers shouldn't make judgment calls on data representation; that's where hands-off to a person happens.

  For new pictograms: adding them should be rare, only when existing symbols can't represent a concept without confusion. Colors getting new meanings should be even rarer—only if the new meaning is permanent and won't clash with existing uses. Both decisions should involve the transformer and communications director to maintain consistency.

  Refusing claims: The system can't show precise differences in non-countable data (e.g., "two percentage points" is out), imply causality, or distort proportions. If someone asks for more "forceful" charts, the answer is to stick to proportional representation—no resizing symbols for emphasis. That aligns with Neurath's "simplified picture better than forgotten accurate figure" ethos.

  Now for the three test cases:  
  - (a) New dwellings by district: Countable! Verdict: Approved. Show houses = actual counts (scaled if needed).  
  - (b) Average income by district: Tricky. Can't show averages with symbols. Verdict: Rejected unless converted to countable bins (e.g., income brackets).  
  - (c) Vaccination comparison: "Two percentage points" isn't countable. Verdict: Rejected. Suggest showing coverage rates with symbols per percentage point, but avoid claiming superiority.  

  Weaknesses: The procedure struggles with continuous data and small differences. It might oversimplify complex issues. And in polarized contexts, even neutral charts could be weaponized—though that's beyond their control.  

  The user's deeper need seems to be about maintaining integrity in a politicized environment. They want a defensible system that prevents misrepresentation while keeping visuals accessible. The transformer role is their safeguard here.  

  Word count is tight—I'll keep the opening rule concise and bullet-point steps for clarity. Naming the transformer explicitly (e.g., "Senior Data Designer") avoids ambiguity.  

  Final structure: Core rule → Steps 1-10 → Pictogram/color rules → Refusal rules → Case applications → Limitations. All under 1,200 words!
answer: |-
  ### Core Rule: Represent quantities only by repeating identical, countable pictograms at consistent scale; never distort size, perspective, or color meaning.

  **Decision Procedure:**

  1.  **Receive Certified Table:** Statisticians deliver a table with data, title, source notes, and metadata.
      *   *Sufficient:* Data is structured (e.g., districts vs. values), title describes subject clearly.
      *   *No:* Data is ambiguous or title missing. *Action:* Return to statisticians for clarification. **Stop.**

  2.  **Identify Primary Comparison:** Transformer determines the core message (e.g., compare districts, show change over time, compare categories).
      *   *Sufficient:* Single, clear comparison type dominates the table.
      *   *No:* Table supports multiple conflicting comparisons. *Action:* Escalate to **Transformer** to define the primary focus with the requester/statistician or reject the table. **Stop.**

  3.  **Assess Data Type:**
      *   *Countable Integers (e.g., people, dwellings, cars):* Proceed to Step 4.
      *   *Non-Countables (Rates, Averages, Index Numbers, Money):* Proceed to Step 5.
      *   *Mixed Types:* *Action:* Escalate to **Transformer**. **Stop.**

  4.  **Scale Countable Data (Transformer):** Determine unit value per symbol (e.g., 1 symbol = 50 dwellings). Aim for symbol counts between 5-50 per data point for readability. Calculate exact counts.
      *   *Sufficient:* Counts are integers, within range, scale is consistent and logical.
      *   *No:* Counts too large/small for range, scale inconsistent. *Action:* Transformer adjusts unit value or reconsiders primary comparison (Step 2). Proceed to Step 6.

  5.  **Convert Non-Countables (Transformer):** Transform data into countable representations:
      *   *Rates/Percentages:* Treat as counts *of units* (e.g., "70% vaccinated" = 7 out of 10 people symbols).
      *   *Averages:* Reject direct depiction. Convert to counts *within brackets* (e.g., average income → % households in low/medium/high brackets). *Requires new data.*
      *   *Index Numbers:* Reject direct depiction. Depict as comparative rank order (Step 7) *if* the index implies an order.
      *   *Money (Over Time):* Adjust all values to constant base-year currency using official inflation indices. Treat adjusted value as countable.
      *   *Sufficient:* Data is converted to countable integers or ranks using a justified method.
      *   *No:* Conversion impossible, inaccurate, or creates misleading counts. *Action:* Reject the visual ("Cannot depict accurately"). **Stop.**

  6.  **Select Pictograms:** Choose symbols from library matching the *precise subject* (e.g., "dwelling" pictogram for "new dwellings"). Use generic symbols (person, building) only if specific doesn't exist *and* context is unambiguous.
      *   *Sufficient:* Pictogram is unambiguous, identical to library version.
      *   *No:* No suitable pictogram exists or ambiguity remains. *Action:* Escalate to **Transformer & Communications Director** for new pictogram approval (See Rule A). **Stop.**

  7.  **Determine Layout & Color:** Designer sketches layout (e.g., row/column, map-based). Apply fixed color meanings (e.g., blue=water, green=nature, red=warning). Use neutral color (grey) for generic subjects. Color must *only* represent category, not quantity.
      *   *Sufficient:* Layout clear, colors match fixed meanings or neutral.
      *   *No:* Color needed for new category meaning. *Action:* Escalate to **Transformer & Communications Director** for new color meaning approval (See Rule B). **Stop.**

  8.  **Generate Symbol Array:** Designer creates exact grid of identical symbols based on scaled counts (Step 4/5) or depicts rank order clearly (e.g., vertical bars of symbols).
      *   *Sufficient:* Symbols are identical, aligned, countable; quantities visually obvious.
      *   *No:* Alignment impossible, symbols overlap/crowd. *Action:* Designer adjusts layout (Step 7) or escalates to **Transformer** to adjust scale (Step 4).

  9.  **Add Words:** Add essential labels (district names, unit value, title, source) in clear, large type. Words explain symbols; symbols illustrate words.
      *   *Sufficient:* All symbols/axes labeled, title clear, unit value prominent.
      *   *No:* Labels omitted or unclear. *Action:* Designer adds necessary words.

  10. **Final Verification (Transformer):** Transformer checks:
      *   Pictograms match library/approved new.
      *   Colors match fixed meanings/approved new.
      *   Quantities *only* represented by symbol count/rank.
      *   Words and symbols align without contradiction.
      *   *Sufficient:* All checks pass. *Action:* Sign off for print.
      *   *No:* Violation found. *Action:* Return to relevant step for correction.

  **Rule A: New Pictogram:** May be added *only* if:
      1.  The concept is frequent, fundamental, and lacks an unambiguous existing symbol.
      2.  The new symbol is simple, flat, perspective-free, instantly recognizable, and distinct from others.
      3.  Approved by **Transformer & Communications Director** for consistency and necessity. Drawn by designer, added to library.

  **Rule B: New Color Meaning:** May be assigned *only* if:
      1.  A fundamental, permanent new category emerges (e.g., "renewable energy").
      2.  The color doesn't conflict with existing meanings.
      3.  Approved by **Transformer & Communications Director**. Documented officially.

  **Refusing Claims: The system CANNOT visually carry:**
  *   Precise small differences in non-countable data (e.g., "2 percentage points").
  *   Averages, medians, or other summary statistics directly.
  *   Causality or correlation.
  *   Data requiring distorted scales or symbol sizes for emphasis.
  *   Subjective interpretations ("better than", "worse than" implied solely by visuals).

  **Answering Requests for "More Forceful" Charts:** "Our method ensures accurate, proportional representation that residents can trust and understand. Making it 'more forceful' by distorting sizes, colors, or counts would violate this principle and mislead viewers. We can ensure the key comparison is the visual focus through clear layout and labeling."

  ---

  **Application to Cases:**

  *   **(a) New dwellings completed last year, by district.**
      *   *Verdict:* **Approved.**
      *   *Chart:* Rows or columns of identical "dwelling" pictograms for each district. Number of symbols proportional to dwellings (e.g., 1 symbol = 20 dwellings). District labels. Clear title: "New Dwellings Completed Last Year".
      *   *Deciding Step:* Step 4 (Data is countable integers, scaled successfully).

  *   **(b) Average net household income, by district.**
      *   *Verdict:* **Rejected** (unless supplementary bracket data provided).
      *   *Chart:* None. Cannot depict averages directly (Step 5). *Alternative:* If data on % households in income brackets per district is available, proceed (e.g., symbols for households in Low/Med/High income per district, using distinct colors if meanings defined).
      *   *Deciding Step:* Step 5 (Non-countable data cannot be converted to countable units for depiction without additional bracket data).

  *   **(c) Campaign Poster: Vaccination coverage 2pp above neighbouring city.**
      *   *Verdict:* **Rejected** as requested.
      *   *Chart:* Cannot depict "2 percentage points" (Step 5 - small non-countable difference). *Alternative:* Depict vaccination *rates* per city as countable symbols (e.g., 100 person symbols per city, with X vaccinated per 100). Shows the difference proportionally, but does *not* highlight the small 2pp gap forcefully. Cannot claim "above" solely via visuals; words must state it.
      *   *Deciding Step:* Step 5 (Cannot accurately/forcefully depict the requested small non-countable difference) + Refusal Rule (Cannot imply "better than" solely through visuals).

  ---

  **Limitations & Misfires:**

  *   **Oversimplification:** Complex trends (e.g., multi-variable interactions) are hard to convey. May lose nuance.
  *   **Continuous Data:** Struggles with smoothly varying data (e.g., temperature gradients); requires artificial bracketing.
  *   **Small Differences:** Small but statistically significant differences in rates or averages cannot be *visually* emphasized without distortion, potentially making important findings look trivial.
  *   **Context Loss:** Fixed colors/symbols might not translate cultural nuances perfectly across diverse audiences.
  *   **Misinterpretation:** Despite rules, viewers might still infer unintended causality or hierarchy from layout/order. "Pictures unite" but can unite around a misapprehension if the underlying data relationship is complex.
  *   **Political Weaponization:** Neutral, accurate charts can still be misused by campaigns via selective presentation or accompanying misleading rhetoric – beyond the system's control.
