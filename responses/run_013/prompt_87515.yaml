prompt: |-
  I'm a software engineer with basically zero formal philosophy training, but I've been listening to a lot of philosophy-of-mind stuff on my commute and I keep running into the causal exclusion argument — the one where, if every mental event is "backed" by a brain event that supposedly already does all the causing, the mental event gets squeezed out and turns out to cause nothing at all. I think I understand the shape of the worry, but I've never seen a case where it actually breaks down, and I'd like to build one. So please act as a philosopher of mind who's good at rigging up toy examples, and start by brainstorming two or three candidate scenarios before you commit to one, because I'd rather have the right case than the first one you think of.

  Here's what I want: a short, realistic thought experiment — ordinary people doing ordinary things, no brains in vats, no quantum randomness, no sci-fi — in which a mental state really does cause some behaviour while the specific brain state that realises it on that occasion does not, and where that asymmetry isn't something I've just stipulated but falls out of how the case is set up. The lever I'd like you to pull is this: the mental state is the kind of thing that could have been realised in lots of different ways, the brain state is just one particular way of doing it, and the behaviour is the sort of behaviour that comes out the same regardless of which way it was realised. Keep the scenario itself to one paragraph. One more thing I want to throw in as a live option rather than something you have to accept: I've heard people say a cause ought to be "proportional" to its effect — coarse-grained enough to be the genuine difference-maker, not some over-specific detail the effect doesn't actually care about. Feel free to use that idea if it helps.

  After the scenario, walk me through it carefully: (a) state what the exclusion argument predicts here and say exactly where it goes wrong, if it does; (b) do the counterfactual check — name the mental property, the realiser, and the effect, and for each one say whether the effect would still have happened without it; (c) tell me which single feature of the case is doing all the work, and whether removing it collapses things back into plain old overdetermination; and (d) put on the hat of someone who thinks non-reductive physicalism is just wishful thinking and give me the strongest objection to my case — in particular, would they say it cheats by letting a vague, coarse mental property do causal work that only a fine-grained physical property could really do, and would they call the proportionality move nothing but relabeling? I'm not after citations or reading lists, just the reasoning, so don't worry about naming papers or authors beyond the obvious ones.
