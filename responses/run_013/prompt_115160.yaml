answer: |-
  Here's a decision tree handout designed to map the landscape of disagreement surrounding the backward induction paradox, starting from the shared foundation. Answer the questions sequentially to find your leaf.

  **Shared Foundation:** In the Centipede Game and Finitely Repeated Prisoner's Dilemma, backward induction (BI) identifies a unique subgame-perfect equilibrium (SPE): immediate defection/stopping in round one and all subsequent rounds.

  ---

  ### 1. **What kind of claim is the BI conclusion?**
      *   **(A) Analytic:** It follows *logically* from the game description (players, actions, payoffs, information) plus the universal assumption of rationality (common knowledge or not). The SPE *is* rational play. *[Go to 2]*
      *   **(B) Modeling:** It follows *only* because we impose the SPE solution concept onto the game description. Rationality alone doesn't *necessitate* SPE play; BI is one tool, not an inevitable deduction. *[Go to 3]*

  ### 2. **Can two real players attain Common Knowledge of Rationality (CKR)?**
      *   **(A) Yes, CKR is possible (and required for BI deduction):** The infinite regress implied by CKR is well-founded and attainable (at least ideally) for rational agents. *[Go to 4]*
      *   **(B) No, CKR is impossible or self-undermining:** The regress is vicious (e.g., requires players to know infinitely nested propositions about each other's reasoning about reasoning...). BI's deduction *fails* for real players because its epistemic prerequisites are unrealizable. *[Leaf 1: **Epistemic Skepticism** | Awkward: Must explain why rationality doesn't entail overcoming the regress.]*

  ### 3. **Does the money-payoff matrix exhaust player preferences?**
      *   **(A) Yes, preferences are fully captured:** Payoffs represent all relevant motivations (self-interest). No room for "tastes" for cooperation, fairness, reciprocity, or avoiding feeling like a sucker. *[Go to 5]*
      *   **(B) No, preferences extend beyond payoffs:** Players *may* intrinsically value the cooperative process, reciprocity, fairness, or avoiding exploitation/being a sucker, beyond the monetary outcome. *[Leaf 2: **Preference Revision (Intrinsic Motives)** | Awkward: Must specify how these preferences are formed and why they aren't part of the "true" game description.]*

  ### 4. **Does rationality attach primarily to...?**
      *   **(A) Acts (Choice at a Node):** Rationality requires choosing the best action *at the moment of choice*, given current beliefs. A prior "plan" to cooperate later is irrelevant if defecting *now* yields a higher payoff. Reneging is rational. *[Go to 6]*
      *   **(B) Plans (Strategies):** Rationality requires adopting and *sticking to* a globally optimal plan. Reneging on a previously optimal cooperative plan *because* it's the last move is irrational (inconsistent/dynamically inconsistent). BI fails by prioritizing local over global optimality. *[Leaf 3: **Resolute Choice / Plan-Based Rationality** | Awkward: Must explain why sticking to a plan that dictates a suboptimal *act* at a later node is rational.]*

  ### 5. **Is the unit of reasoning the individual or the pair?**
      *   **(A) Individual:** Players reason independently about their own best response. BI applies directly to each player's individual decision problem. *[Go to 7]*
      *   **(B) Pair/Team:** Rationality requires reasoning as a unit to achieve the jointly best outcome. BI's individualistic focus misses the cooperative potential inherent in the repeated interaction. *[Leaf 4: **Team Reasoning / Collective Rationality** | Awkward: Must ground "collective rationality" in individual motivations without collapsing back to individualism.]*

  ### 6. **Is the small-chance-of-error ("trembling hand") argument...?**
      *   **(A) A refutation of BI's conclusion for real agents:** It shows BI is *fragile*; introducing tiny, realistic uncertainties about perfect rationality makes cooperation rational early on. BI only holds under unrealistic certainty. *[Leaf 5: **Trembling Hand Refutation** | Awkward: Must justify why "tiny chance" models reality better than perfect rationality, despite the game description assuming the latter.]*
      *   **(B) A change of subject (modeling a different game):** It addresses a perturbed game model (with incomplete information about types/possible irrationality), not the original game with CKR. It doesn't refute BI in the original model. *[Go to 8]*

  ### 7. **Is BI primarily...?**
      *   **(A) Prescriptive:** It tells rational agents what they *ought* to do (defect immediately). *[Leaf 6: **Orthodox Game Theory (Prescriptive)** | Awkward: Must explain widespread observed cooperation as irrationality, error, or mis-specified preferences.]*
      *   **(B) Predictive:** It predicts what rational agents *will* do (defect immediately). *[Leaf 7: **Orthodox Game Theory (Predictive)** | Awkward: Must explain widespread observed cooperation as irrationality or error.]*

  ### 8. **Is BI primarily...?**
      *   **(A) Prescriptive:** It tells rational agents what they *ought* to do (defect immediately). *[Leaf 8: **Orthodox Game Theory (Prescriptive, CKR possible)** | Awkward: Must explain how CKR is possible/attainable for real agents.]*
      *   **(B) Predictive:** It predicts what rational agents *will* do (defect immediately). *[Leaf 9: **Orthodox Game Theory (Predictive, CKR possible)** | Awkward: Must reconcile prediction with evidence of cooperation and explain CKR's attainability.]*

  ---

  ## Leaf Summary & Empty Combinations

  1.  **Epistemic Skepticism:** BI deduction fails due to unrealizable CKR. *(Path: 1A -> 2B)*
  2.  **Preference Revision (Intrinsic Motives):** BI conclusion wrong due to mis-specified preferences. *(Path: 1B -> 3B)*
  3.  **Resolute Choice / Plan-Based Rationality:** BI fails by ignoring the rationality of sticking to optimal plans. *(Path: 1A -> 2A -> 4B)*
  4.  **Team Reasoning / Collective Rationality:** BI fails by ignoring the rationality of coordinated joint action. *(Path: 1B -> 3A -> 5B)*
  5.  **Trembling Hand Refutation:** BI is fragile; cooperation is rational under small uncertainties. *(Path: 1A -> 2A -> 4A -> 6A)*
  6.  **Orthodox Game Theory (Prescriptive):** BI prescribes immediate defection as uniquely rational. *(Path: 1A -> 2A -> 4A -> 6B -> 7A)*
  7.  **Orthodox Game Theory (Predictive):** BI predicts immediate defection by rational agents. *(Path: 1A -> 2A -> 4A -> 6B -> 7B)*
  8.  **Orthodox Game Theory (Prescriptive, CKR possible):** BI prescribes immediate defection, assuming CKR is possible. *(Path: 1A -> 2A -> 4A -> 6B -> 8A)*
  9.  **Orthodox Game Theory (Predictive, CKR possible):** BI predicts immediate defection, assuming CKR is possible. *(Path: 1A -> 2A -> 4A -> 6B -> 8B)*

  ## Empty Combinations & Diagnosis

  *   **Path 1B -> 3A -> 5A -> ...:** "Prefs Exhaustive + Individual Reasoning". This *could* lead to Orthodox views (Leaf 6-9) *if* it also went down the "CKR possible" and "Acts" branches. However, the split at "CKR" (Node 2) was only after the "Analytic" branch (1A). Taking the "Modeling" branch (1B) bypasses the CKR question. **Diagnosis:** This path (`1B -> 3A -> 5A`) is logically possible but **unexplored/unnamed**. It would hold that BI is a modeling imposition (1B), preferences are purely monetary (3A), reasoning is individualistic (5A), and thus BI's SPE might be chosen as the prediction/prescription *despite* not being logically entailed. It likely collapses into Leaf 7 or 9 pragmatically. **Flag:** This path is logically distinct but practically merges with Orthodox Predictive views.
  *   **Path 1A -> 2A -> 4B -> ...:** "Analytic + CKR Possible + Plan-Based". This leads directly to Leaf 3 (Resolute Choice). Branching further (e.g., "Unit of Reasoning", "Trembles") isn't offered because Resolute Choice fundamentally rejects BI's step-by-step logic. **Diagnosis:** Adding further branches here is **incoherent**. Resolute Choice argues BI is *wrong* at its core (prioritizing local over global); asking how BI applies under trembles or for teams within this framework doesn't make sense.
  *   **Path 1B -> 3B -> ...:** "Modeling + Prefs Not Exhaustive". This leads directly to Leaf 2 (Preference Revision). Further branching (e.g., "Acts vs Plans") isn't offered because the core argument is that BI applies to the *wrong description*. **Diagnosis:** Adding branches like "Acts vs Plans" here is a **change of subject**. The claim is BI's conclusion is correct *for the model it uses*, but the model is inadequate. Debating how BI works *within its own model* (Acts vs Plans) misses the point of this position.
  *   **Path 1A -> 2B:** "Analytic + CKR Impossible" leads directly to Leaf 1 (Epistemic Skepticism). Asking subsequent questions like "Acts vs Plans" **presupposes the BI deduction works**, which this leaf denies. **Diagnosis:** Further branching is **incoherent** under this position's core tenet.

  ## Inseparable Leaves
  *   **Leaf 6 vs Leaf 8 & Leaf 7 vs Leaf 9:** The tree cannot cleanly separate "CKR possible" Orthodox views (Leaves 8 & 9) from "CKR wasn't explicitly denied" Orthodox views (Leaves 6 & 7). Both paths (`1A->2A->4A->6B->7A/B` and `1A->2A->4A->6B->8A/B`) lead to essentially the same Orthodox position. The distinction hinges on *why* one accepts CKR is possible, which isn't probed by the tree. **Flag:** Leaves 6 & 8 are both "Orthodox Prescriptive"; Leaves 7 & 9 are both "Orthodox Predictive". The CKR possibility question (Node 2) primarily separates skeptics (Leaf 1) from non-skeptics (proceeding to Node 4), not different flavors of Orthodoxy.

  Use this tree to locate your position, identify where others stand, and pinpoint the exact sources of disagreement beyond the shared starting point. The empty combinations highlight where the debate *isn't* happening, often due to foundational incompatibilities.
