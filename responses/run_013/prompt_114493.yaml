  Below is a decision tree designed to sort participants by their underlying intuitions about weakness of will (akrasia), using concrete cases to avoid theoretical jargon. The tree has **10 internal nodes** (questions) and **7 leaf positions**, plus **1 unnamed leaf** for an undefended combination. Fault lines are based on core disagreements in the literature, and cases are woven into the nodes (e.g., staying up late, snooze button, diet promises, buying cigarettes, Odysseus, clear-eyed smoking). Positions are separated as cleanly as possible, with notes where distinctions blur (e.g., Davidson vs. discounting).  

  ---

  ### **Weakness of Will Decision Tree**  
  *Start with a concrete case (e.g., staying up until 3am watching "one more episode" when you knew you’d regret it). Answer based on your intuition about what happened.*  

  1. **After you did it, did you feel regret?**  
     - *No* → **Leaf: Aristotelian intemperance** (You don’t truly believe the action was bad; you’re comfortable with it. No conflict—just misaligned values).  
     - *Yes* → Go to 2.  

  2. **At the moment of action, were you consciously thinking, “This is bad for me overall”?**  
     - *No* → Go to 3.  
     - *Yes* → Go to 6. *(Clear-eyed case: e.g., you light a cigarette while actively thinking, “This is terrible for me.”)*  

  3. **In the moment, did you feel the action was “worth it right now” (e.g., “This episode is essential to watch *tonight*”)?**  
     - *Yes* → Go to 4.  
     - *No* → Go to 5.  

  4. **Was your reason for acting something you could explain to others as a genuine justification?**  
     - *Yes* (e.g., “I needed to unwind”) → **Leaf: Davidson’s position** (Your “better judgment” was time-indexed: you didn’t override an all-things-considered judgment; you judged it best *now*).  
     - *No* (e.g., “I just *had* to—it was there!”) → **Leaf: Pure hyperbolic discounting** (No akrasia; just preference reversal. Your valuation flipped due to immediacy, like overpaying for immediate gratification).  

  5. **Did you act out of a strong urge that felt alien or automatic (e.g., hitting snooze before fully awake)?**  
     - *Yes* → **Leaf: Unnamed position** (Execution failure without motivation. *Why undefended?* Philosophers treat akrasia as motivational conflict, not reflex).  
     - *No* → **Leaf: Socratic denial** (You never *truly* believed it was worse; your action reveals your real judgment).  

  6. **Did you have a “good reason” for acting that you’d stand by later (e.g., “I promised my friend cigarettes,” even if untrue)?**  
     - *Yes* → Go to 7.  
     - *No* (e.g., no reason beyond “I wanted to”) → Go to 9.  

  7. **Did it feel like your willpower was drained (e.g., after a long day of resisting temptations)?**  
     - *Yes* → **Leaf: Willpower as depletable resource** (Failure due to exhausted self-control. *Note: Contested—some argue it’s a metaphor, not a real resource*).  
     - *No* → **Leaf: Aristotelian akrasia** (Weakness of will proper: you knew better but were overcome by passion/desire, and regret it).  

  8. **Would you precommit to avoid future lapses (e.g., tie yourself to a mast like Odysseus)?**  
     - *Yes* → **Leaf: Two-selves / intrapersonal bargaining** (You’re a series of conflicting selves; akrasia is a bargaining failure between present and future you).  
     - *No* → **Leaf: Pure hyperbolic discounting** (No akrasia; just consistent time-inconsistent preferences. Precommitment is unnecessary if you own your shifting desires).  

  9. **Do you often make promises to your “future self” you later break (e.g., “I’ll start the diet Monday”)?**  
     - *Yes* → Go to 8.  
     - *No* → Go to 10.  

  10. **Was the action driven by a craving that clouded your judgment (e.g., “I know it’s bad, but I can’t think straight”)?**  
      - *Yes* → **Leaf: Aristotelian akrasia** (Desire overwhelmed your reasoning).  
      - *No* → **Leaf: Willpower as depletable resource** (You had the reason but lacked the energy to act on it).  

  ---

  ### **Tree Structure Summary**  
  - **Internal nodes**: 10 (questions).  
  - **Leaf positions**: 7 named, 1 unnamed.  
  - **Key cases integrated**:  
    - Staying up late / snooze button → Nodes 1, 2, 5.  
    - Diet promises / precommitment (Odysseus) → Nodes 8, 9.  
    - Buying cigarettes “for a friend” → Node 6 (self-deception test).  
    - Clear-eyed smoking → Node 2.  
    - Alien urges (e.g., automatic snooze) → Node 5.  

  ### **Notes on Ambiguities**  
  - **Davidson vs. Hyperbolic Discounting**: The tree tries to split them (Node 4 asks about avowable reasons), but they overlap. Davidson emphasizes *judgment* shifts (“best now”), while discounting is preference-based. In practice, if you answered Node 4 with “No reason,” you likely lean discounting; with a “reason,” you lean Davidson.  
  - **Willpower vs. Aristotelian Akrasia**: Distinction rests on “energy depletion” (Node 7). If no depletion, it’s Aristotelian passion; if yes, it’s willpower exhaustion.  
  - **Socratic Denial**: Isolated via Node 5 (no urge, no judgment conflict—action reveals true belief).  
  - **Two-Selves**: Triggered by precommitment (Node 8), distinguishing it from pure discounting (which rejects multiple selves).  
  - **Unnamed Leaf**: Execution failure (Node 5) is excluded from akrasia debates, as philosophers focus on motivation, not reflexes.  

  This tree forces participants to confront intuitions about *regret*, *judgment*, *reasons*, and *time* without requiring prior philosophical knowledge. Use it to spark debate—the overlaps (e.g., Node 4) reveal where real-world phenomena resist clean categorization!
