  ### Revealed Preference Simulation: Activity Design  
  **Core Idea:** Participants experience how defining utility solely through choices (rather than inner states) leads to paradoxes in preference reversal, intransitivity, and welfare evaluation—without using terms like "revealed preference," "welfare economics," or "money pump" until debrief.  

  ---

  #### **Materials & Preparation**  
  1. **Items** (5 distinct, trivial-value objects):  
     - (A) Chocolate bar  
     - (B) Bag of chips  
     - (C) Apple  
     - (D) "5-min break voucher" (redeemable at end of class)  
     - (E) "Homework extension token" (1-day grace period for any assignment)  

  2. **Tokens**: Poker chips or paper slips (no real value; 10 per chooser).  
  3. **Index Cards**: For choice prompts (e.g., "Choose between A and B").  
  4. **Tally Sheets (Analysts)**:  
     - Columns: `Stage 1 Ordering (Numbers)`, `Stage 2 Ordering (Revised)`, `Stage 3 Prices`, `Stage 3 Price-Based Ordering`, `Stage 4 Trade Decisions`, `Stage 5 Planner Recommendation`.  
  5. **Satisfaction Dials (Choosers)**: Paper dials with 1–10 scale for private ratings.  
  6. **Whiteboard**: Record aggregate stage outcomes (e.g., "% who flipped in Stage 2").  

  **Role Assignment**:  
  - Split class into **Choosers** (8 students) and **Analysts** (8 students). If uneven, assign extras as "silent observers" who take notes.  
  - **Pairing**: Each analyst shadows one chooser. Groups sit on opposite sides of the room.  

  **Rules Briefing (5 mins)**:  
  > "Choosers, you will make decisions about items. You may *only* state choices—no explanations, rankings, or preferences. Analysts, you will observe choosers and build a ‘utility index’ based *only* on what you see. No asking questions. We proceed in stages—follow prompts."  

  ---

  ### **Activity Flow (60 mins)**  
  **Stage 1: Pairwise Choices (10 mins)**  
  - **Mechanics**:  
    - Choosers receive 3 pairwise choices: (A vs. B), (B vs. C), (A vs. C).  
    - Analysts record choices → construct a **complete ordering** (e.g., A > B > C) with arbitrary numbers (e.g., A:100, B:80, C:60) consistent with choices.  
  - **Facilitator**: Enforce silence between groups. Distribute tokens to choosers (10 each).  

  **Stage 2: Choice-Set Change Probe (10 mins)**  
  - **Mechanics**:  
    - Choosers face new menus:  
      - Group 1 (4 choosers): {A, B} → then {A, B, D} (D = "homework token").  
      - Group 2 (4 choosers): {B, C} → then {B, C, E} (E = "5-min break voucher").  
    - Analysts revise ordering and numbers after seeing new choices.  
  - **Hook**: D/E is designed as "unattractive decoy" (e.g., homework token is worthless if no assignments due). Expect 1–2 choosers to flip preference (e.g., A > B becomes B > A when D added).  
  - **Facilitator**: Note flips on whiteboard (no explanation).  

  **Stage 3: Numeric Price Probe (10 mins)**  
  - **Mechanics**:  
    - Choosers state "sell price" in tokens for each item (e.g., "I’d sell A for 5 tokens").  
    - Analysts:  
      1. Record prices → build a **price-based ordering** (e.g., highest price = "most utility").  
      2. Compare to choice-based ordering → **circle which one reflects "true utility."**  
  - **Conflict**: For flippers, price/choice orders often conflict (e.g., choice says B > A, but A priced higher).  

  **Stage 4: Trade Cycle (15 mins)**  
  - **Mechanics**:  
    - Choosers start with 10 tokens + one item (e.g., A).  
    - Offered 3 sequential trades (1 token per trade):  
      - Trade 1: Swap current item for next (e.g., A → B).  
      - Trade 2: Swap for next (e.g., B → C).  
      - Trade 3: Swap back to start (e.g., C → A).  
    - **Catch**: Accepting all trades leaves them with original item but -3 tokens.  
    - Analysts record decisions.  
  - **Enforcement**: Choosers must accept/reject each trade immediately.  

  **Stage 5: Planner’s Dilemma (10 mins)**  
  - **Mechanics**:  
    - Analysts write advice: *"Should a planner block access to D/E? Why? Use your index."*  
    - Choosers privately rate satisfaction (1–10) with each item.  

  ---

  ### **Debrief (30 mins)**  
  **Opening (5 mins)**:  
  - Ask choosers: *"Did your satisfaction rating always match what you chose or priced? Where did it disagree?"*  
  - **Goal**: Surface tension (e.g., "I rated A highest but chose B when D was added"). Resist resolving—highlight discomfort.  

  **Mapping the Idea (15 mins)**:  
  1. **Choice as Definition vs. Evidence**:  
     - Stage 2 flips: "When choices reversed, did the person’s *preference* change, or did we misread it? What if preference *is* the choice?"  
  2. **Ordering vs. Measurement**:  
     - Stage 3 conflict: "Analysts, why couldn’t your index explain *why* prices and choices clashed? Ordinal ranks lack intensity (e.g., *how much* A is preferred)."  
  3. **Planner’s Incoherence**:  
     - Stage 5: "Blocking D seems to ‘help,’ but your index only describes choices—not welfare. If choice=preference, banning D *changes* preferences but doesn’t ‘improve’ them."  
  4. **Cardinal Smuggle**:  
     - Stage 3 prices: "Prices added numbers choice data lacked. But if utility is *defined* by choice, how can prices—another choice—contradict it?"  

  **Predictable Issues & Fixes (5 mins)**:  
  - **Choosers refuse trade cycle**: Common! If <50% walk the cycle, say: *"Many stop—this is rational! But imagine someone who *does* accept all. What would that imply?"*  
  - **Analysts break rules**: Gently interrupt: *"Remember, no talking—choices only."*  
  - **Politeness**: If no one flips in Stage 2, use whiteboard data: *"In labs, 30% flip—let’s discuss why."*  

  **Limitation (2 mins)**:  
  - *"This can’t show how real economic models use revealed preference to *predict* behavior. We focused on the philosophical tension—I’ll add context next lecture."*  

  **Reveal the Idea (3 mins)**:  
  > "You experienced **revealed preference theory**: the view that preferences are *defined* by choices, not measured by them. Tensions arise with menu effects (Stage 2), intransitivity (Stage 4), and welfare (Stage 5). Standard critiques: **context dependence**, **money-pump arguments**, and the **ordinality problem**."  

  ---

  ### **Timeline**  
  | **Phase**         | **Time** | **Key Actions**                                                                 |  
  |-------------------|----------|---------------------------------------------------------------------------------|  
  | Setup             | 5 mins   | Assign roles, distribute materials, brief rules.                               |  
  | Stage 1           | 10 mins  | Pairwise choices (A/B, B/C, A/C). Analysts build ordering.                     |  
  | Stage 2           | 10 mins  | New menus (add D/E). Analysts revise ordering.                                 |  
  | Stage 3           | 10 mins  | Choosers state sell prices. Analysts compare orderings.                        |  
  | Stage 4           | 15 mins  | Trade cycle with tokens. Analysts record.                                      |  
  | Stage 5 + Ratings | 10 mins  | Analysts write planner advice; choosers rate satisfaction.                     |  
  | Debrief           | 30 mins  | Discussion → reveal concept.                                                   |  

  **Total**: 90 mins  

  ---

  ### **Facilitator Script Snippets**  
  - **Stage 2 Transition**: *"Choosers, new options are added. Make your choices—no explanations."*  
  - **Stage 3 Transition**: *"State the minimum tokens you’d accept to give up each item."*  
  - **Stage 4 Transition**: *"Starting with your item, decide trade-by-trade. Each costs 1 token."*  
  - **Stage 5 Transition**: *"Analysts, advise a planner: ban the new item? Use your index to justify."*  

  **Privacy Protection**:  
  - Choosers’ satisfaction ratings are private.  
  - Analysts share *indices* (not individual diagnoses) in debrief.  
  - No names used in whiteboard aggregates (e.g., "Chooser 3 flipped" → "Group 1: 2 flips").  

  This design forces confrontation with the idea that choice *constitutes* preference—escalating from trivial swaps to welfare paradoxes. The debrief channels discomfort into conceptual clarity.
