  ### Taxonomy of Positions on Cross-Cultural Disagreement in Philosophical Intuition

  This taxonomy categorizes positions based on their response to cross-cultural disagreement in philosophical intuition about a given case. The guiding question is: **When competent respondents from different cultural backgrounds give incompatible intuitive verdicts (or exhibit confidence/diagnostic variation), what follows—for the case, the method of cases, and the assumption of a fact of the matter?** Positions are sorted by their commitments, not by labels. The tree uses the following distinctions structurally:
  - **Variation types:** Verdict variation (incompatible answers), confidence variation (differing conviction in the same answer), diagnostic variation (same verdict but disagreement on which features are relevant).
  - **Explanation types:** Input-side (differences in perceiving/imagining the case) vs. output-side (differences in rules mapping features to verdicts).
  - **Grouping variable:** Whether cultural partitioning is salient (vs. training, language, or individual differences) and whether within-group variation swamps between-group variation.

  The tree has 12 leaves, with four levels maximum. Each leaf is named descriptively and includes one sentence stating its most awkward commitment. Unoccupied combinations are noted and diagnosed (as incoherent, unattractive, or unexplored). Where the tree fails to separate leaves, this is explicitly stated.

  #### The Decision Tree
  1. **Is the method of cases a legitimate source of evidence for philosophical claims?**
     - **No → Leaf 1: Irrelevance of Intuition**  
       *Most awkward commitment: Philosophical truth is established without any appeal to intuitions, even in domains like morality or knowledge where cases are central.*
     - **Yes →** Proceed to 2.

  2. **Is the observed variation best explained by performance errors (e.g., mistranslation, inattention) correctable through improved probing?**
     - **Yes → Leaf 2: Performance Error Correctable**  
       *Most awkward commitment: All cross-cultural variation would vanish under ideal conditions (e.g., unlimited reflection time or cultural neutralization), rendering disagreement ephemeral.*
     - **No →** Proceed to 3.

  3. **Is cultural grouping the salient partition for the variation (with between-group variation exceeding within-group variation)?**
     - **No → Leaf 3: Incidental Grouping Artifact**  
       *Most awkward commitment: The variation is real but explained by non-cultural factors (e.g., training or language), so cross-cultural disagreement is a red herring for philosophical methodology.*
     - **Yes →** Proceed to 4.

  4. **Is there a shared human competence (e.g., conceptual or cognitive) that the case probes?**
     - **No → Leaf 4: Competence Pluralism**  
       *Most awkward commitment: There is no universal human capacity for the philosophical domain (e.g., morality), making cross-cultural agreement impossible in principle.*
     - **Yes →** Proceed to 4B.

  **4B. Given shared competence, what explains variation and what follows?** (Choose one branch; all at Level 4)  
     - **The variation stems from input-side ambiguity in case description → Leaf 5: Case Relativism**  
       *Most awkward commitment: The same case description must be relativized to cultural context to yield a single fact of the matter, precluding universal case analysis.*
     - **The variation stems from output-side differences or irreducible divergence and intuitions remain defeasible evidence → Leaf 6: Calibrated Defeasibility**  
       *Most awkward commitment: The evidential weight of an intuition depends on the demographic reliability of the intuiter's cultural group.*
     - **The variation shows intuitions reveal concepts, not worldly truths → Leaf 7: Conceptual Revelation**  
       *Most awkward commitment: The method only accesses parochial concepts, leaving the extralinguistic world untouched.*
     - **The variation is primarily in confidence/diagnosis (not verdict) → Leaf 8: Surface Agreement**  
       *Most awkward commitment: Verdict agreement masks underlying disagreement that may fracture on nearby cases, but the core case is unaffected.*
     - **The variation implies no fact of the matter for the domain → Leaf 9: Domain Anti-Realism**  
       *Most awkward commitment: There is no objective truth in the domain (e.g., morality), rendering disagreement irresolvable.*
     - **The variation is eliminable through universal training → Leaf 10: Trainable Uniformity**  
       *Most awkward commitment: Cultural differences reflect correctable deficits in philosophical education, not deep-seated diversity.*

  #### Additional Leaves (Required and Logical Extensions)
  - **Leaf 11: Diagnostic Fragility** (From 4B if variation is diagnostic and undermines generalization)  
    *Most awkward commitment: Verdict agreement is stable only for the exact case, as diagnostic disagreement makes generalization to nearby cases unreliable.*  
    *Path: 1 (Yes) → 2 (No) → 3 (Yes) → 4 (Yes) → 4B (separate branch).*  
    *Note: Combines with Surface Agreement (Leaf 8) if only confidence varies, but distinct if diagnostic variation alone destabilizes the method.*

  - **Leaf 12: Input Correction** (From 4B if input-side variation is correctable without relativism)  
    *Most awkward commitment: Cases can be universally disambiguated to override cultural differences in perception, restoring a single fact of the matter.*  
    *Path: 1 (Yes) → 2 (No) → 3 (Yes) → 4 (Yes) → 4B (separate branch).*

  #### Unoccupied Combinations and Diagnostics
  - **Input-side explanation + Domain Anti-Realism (Leaf 9):** Incoherent. If variation is input-side (perceptual), it presumes an objective case to be misperceived, contradicting anti-realism’s denial of a fact of the matter.  
  - **Output-side explanation + Surface Agreement (Leaf 8):** Unexplored. Output-side differences (e.g., rule application) typically cause verdict variation, but a position asserting output-side shifts only in confidence/diagnosis is possible yet unattractive (no known proponents).  
  - **Performance Error + Trainable Uniformity (Leaf 10):** Incoherent. Performance errors are incidental and correctable via probing, while Trainable Uniformity posits deep, competence-level differences fixable by training.  

  #### Failures of Separation
  - **Calibrated Defeasibility (Leaf 6) and Conceptual Revelation (Leaf 7)** cannot be separated by the tree alone. Both respond to output-side variation with shared competence, but differ on whether intuitions provide worldly evidence. Further distinction: **Does the variation imply intuitions track contingent concepts or unreliable seemings?**  
  - **Surface Agreement (Leaf 8) and Diagnostic Fragility (Leaf 11)** overlap if diagnostic variation is present. The tree fails to separate them; a further distinction is needed: **Does diagnostic variation destabilize the verdict for the original case or only for generalizations?**  

  #### Total Leaves (12)
  1. Irrelevance of Intuition  
  2. Performance Error Correctable  
  3. Incidental Grouping Artifact  
  4. Competence Pluralism  
  5. Case Relativism  
  6. Calibrated Defeasibility  
  7. Conceptual Revelation  
  8. Surface Agreement  
  9. Domain Anti-Realism  
  10. Trainable Uniformity  
  11. Diagnostic Fragility  
  12. Input Correction  

  This taxonomy exhausts the logical space, with unoccupied combinations arising from incoherence or lack of advocacy. The tree prioritizes respondent-answerable questions (e.g., "Is variation correctable?") over ex-post labels, ensuring positions are grouped by their meta-philosophical commitments.
