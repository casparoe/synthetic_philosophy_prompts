prompt: |-
  For the past year I have sat on a municipal heritage committee that adjudicates contested plaques, street names and museum labels, and I keep meeting the same structural problem: a community's living memory of an event and the archival record disagree, and somebody has to decide which gives way. I have been trying to write down the principles we actually invoke, and I would like you to rank them by how much weight each should carry when they conflict — not which is most often decisive in practice, but which ought to be decisive on the merits. Our working list, in no particular order, is this. (a) The deference principle: where the record was produced by methods the community itself accepts, the record wins. (b) The constitutive principle: some community memories are not claims about the past at all but practices that make a group what it is, so they cannot lose a factual contest, because they are not entered in one. (c) The harm principle: whichever version, if institutionalised, imposes the greater continuing injury on living people should give way. (d) The jurisdiction principle: the community has standing over its own past and outsiders — including archivists — do not, save where they can show an affected party. (e) The silence principle: gaps in the record are not evidence against memory, so a thin archive leaves memory standing. (f) The revisability principle: the record is corrigible and memory is not, so the record should be the one that yields, since it can be repaired later. (g) The shared-world principle: correcting a community's memory damages a common world in a way that correcting a document does not, and that damage is a cost to be weighed rather than a sentiment to be managed. (h) The democratic principle: the community, not the committee, decides what its past was.

  Give me a ranking from most to least weight, with a sentence or two on each placement. I care more about the reasoning than the order, so if two items sit so close together that the ordering is arbitrary, say so rather than manufacturing a distinction.

  Two further things. First, I suspect the list is not homogeneous — some of these look like rules for settling a question of fact and others like rules for deciding what to do once the question of fact is settled — and if that is right I would rather you tell me than rank blithely across the gap. Second, if the whole framing is confused — if, for instance, 'the community's memory' and 'the archival record' are not two homogeneous things that can be weighed against one another at all, or if the ranking is being asked of items that do different jobs — say that plainly instead of producing a tidy list to order. I would rather have a short answer that pushes back on the premise than a long one that does not. Please write in British English.
reasoning: |-
  Hmm, the user is on a municipal heritage committee dealing with conflicts between community memory and archival records. They've listed eight principles and want them ranked by their ideal weight when they conflict. But they also raise concerns about whether these principles are homogeneous or if the whole framing is confused.

  First, I need to understand the principles clearly:
  - (a) Deference: Archive wins if produced by community-approved methods
  - (b) Constitutive: Some memories are identity-forming practices, not factual claims
  - (c) Harm: Avoid greater continuing injury to living people
  - (d) Jurisdiction: Community owns its past unless outsiders show affected interest
  - (e) Silence: Gaps in archive don't disprove memory
  - (f) Revisability: Archive should yield because it's fixable
  - (g) Shared-world: Correcting memory damages communal reality more than correcting documents
  - (h) Democratic: Community should decide its past, not committees

  The user makes two crucial points: 
  1) These might not all address the same type of issue (fact-finding vs action-guiding)
  2) The "community memory vs archive" framing might itself be problematic

  Looking at the principles:
  - (b) stands out because it questions whether there's even a factual conflict at all
  - (h) and (d) are about who decides, not how to decide
  - (c) and (g) seem to focus on consequences of institutionalizing one version
  - (a), (e), (f) are more about evidentiary weight

  This suggests three distinct categories:
  1) Pre-decisional: Does a factual conflict exist? (b)
  2) Procedural: Who should decide? (d, h)
  3) Substantive: How to resolve factual conflicts? (a, e, f) and How to handle consequences? (c, g)

  The constitutive principle (b) is fundamental - if a memory isn't making factual claims, there's nothing to adjudicate. Harm (c) and shared-world (g) seem to operate after facts are established, guiding implementation. Jurisdiction (d) and democratic (h) are about authority structures.

  For ranking substantive principles when facts are contested:
  - Silence (e) seems primary - absence of evidence isn't evidence of absence
  - Revisability (f) next - archives can be corrected later
  - Deference (a) last - community-approved methods matter but shouldn't override when other factors apply

  But harm (c) and shared-world (g) aren't about truth-finding - they're ethical constraints on implementation. Democratic (h) might override all if strictly applied.

  The user seems to sense this heterogeneity - they're clearly thoughtful about the complexities. Their deeper need might be for conceptual clarity rather than a forced ranking. I should emphasize the categorical distinctions while still offering guidance on weight within categories.

  The British English requirement means I'll use "prioritise", "amongst", "whilst" etc. The response should be concise but rigorous - they'd prefer pushback over false tidiness.
answer: |-
  Your suspicion is correct: these principles aren't homogeneous. They operate at different levels—some address *whether* a factual conflict exists, others *who decides* the facts, and others *what to do* about conflicts or their consequences. Forcing a single ranking would misrepresent their functions. Instead, I'll categorise them, then offer a weighted hierarchy *within* applicable categories for substantive factual conflicts. I'll use British English throughout.

  ### Key Categorisation
  1.  **Pre-empting Factual Conflict:**  
      -   **(b) Constitutive Principle:** This isn't about weighing evidence; it questions the premise. If a "memory" is actually a constitutive practice (e.g., a foundational story defining group identity, not a verifiable historical claim), it *cannot* conflict factually with archives. It operates outside factual adjudication. **This must be considered first.**

  2.  **Procedural Principles (Who Decides?):**  
      -   **(d) Jurisdiction Principle:** Claims the community has inherent authority over interpreting its past.  
      -   **(h) Democratic Principle:** Claims the community, not committees/archivists, should decide its past.  
      *These address legitimacy and power, not truth per se. They conflict with evidentiary principles.*

  3.  **Evidentiary Principles (Resolving Factual Conflicts):**  
      -   **(e) Silence Principle:** Addresses burden of proof – absence of archival evidence ≠ memory is wrong.  
      -   **(a) Deference Principle:** Weighs the *process* behind the archive if community-endorsed.  
      -   **(f) Revisability Principle:** Weighs the *practical corrigibility* of archives vs. memory.  

  4.  **Consequentialist Principles (Resolving Conflicts After Facts/Regardless of Facts):**  
      -   **(c) Harm Principle:** Focuses on the *impact* of institutionalising a version on living people.  
      -   **(g) Shared-World Principle:** Focuses on the *social cost* of disrupting communal understanding.  
      *These apply after establishing facts, or when factual resolution is impossible/stalemated. They prioritise present wellbeing over historical fidelity.*

  ### Weighted Hierarchy for Evidentiary Principles (When Facts are Contested)
  When a genuine factual conflict exists *and* constitutive practices don't pre-empt it, these should guide resolving the historical truth:

  1.  **(e) Silence Principle:** **Most Weight.**  
      *Reasoning:* Absence of evidence is never evidence of absence. Archives are inevitably incomplete, fragmentary, and shaped by power structures. Dismissing lived memory solely due to archival gaps privileges institutional power and risks silencing marginalised voices. Memory must stand unless *positively disproven* by the record.

  2.  **(f) Revisability Principle:** **Significant Weight, but less than (e).**  
      *Reasoning:* Archives *can* be corrected, annotated, or supplemented as new evidence emerges. Memory, once publicly dismissed or overridden by institutional authority, is far harder to rehabilitate and the social damage may be lasting. Where evidence is ambiguous or contested, erring on the side of *preserving* memory allows for future archival correction without the same level of irrevocable harm.

  3.  **(a) Deference Principle:** **Least Weight amongst these three.**  
      *Reasoning:* While community-sanctioned methods add credibility, archives (even well-produced ones) reflect the perspectives, biases, and limitations of their creators and time. They are not infallible. This principle offers a useful check but shouldn't automatically override lived memory, especially given the weight of (e) and (f). It might be decisive if the archive's methodology is exceptionally robust *and* the memory lacks corroborating elements, but it shouldn't trump gaps (silence) or revisability concerns alone.

  ### Handling the Other Principles
  *   **(b) Constitutive Principle:** Apply this *before* adjudicating facts. If the memory functions constitutively, it shouldn't be subject to factual challenge in this context. Its "weight" is absolute in its own domain.
  *   **(d) Jurisdiction & (h) Democratic Principles:** These are foundational but procedural. They don't resolve *how* to weigh evidence but assert *who* should do it. Their weight is high for legitimacy but doesn't directly answer the factual conflict. They might override evidentiary conclusions if the community democratically rejects the committee's factual findings, but this risks substituting power for truth-seeking.
  *   **(c) Harm & (g) Shared-World Principles:** These are crucial for **implementation**, not fact-finding. Once a factual conclusion is reached (or if it's impossible), these weigh the *consequences* of inscribing one version publicly. **They should carry decisive weight when choosing how to publicly present history, especially when factual resolution is inconclusive or the cost of "correcting" memory is severe.** Between them, (c) Harm likely outweighs (g) Shared-World, as preventing tangible, continuing injury is more urgent than general social cohesion, though both are vital.

  ### Conclusion: A Process, Not a Simple Ranking
  1.  **First:** Apply **(b) Constitutive Principle.** If applicable, no factual contest exists; the practice stands.
  2.  **If Genuine Factual Conflict:** Use evidentiary principles – prioritising **(e) Silence**, then **(f) Revisability**, with **(a) Deference** as a weaker check.
  3.  **Considering Implementation:** Apply **(c) Harm** and **(g) Shared-World** principles heavily to decide *how* (or even *if*) to inscribe the finding publicly. A factual "win" for the archive might still yield to these if institutionalising it causes disproportionate harm or severs communal bonds.
  4.  **Procedural Backdrop:** **(d) Jurisdiction** and **(h) Democratic** principles underpin the *authority* of the process but don't resolve the epistemic or ethical dilemmas directly.

  The core tension isn't truly between "memory" and "archive" as homogeneous blocs, but between *epistemic authority* (who knows the past?), *procedural legitimacy* (who decides?), and *ethical responsibility* (what consequences matter most?). Your principles wisely reflect this complexity; forcing a single linear ranking would obscure it.
