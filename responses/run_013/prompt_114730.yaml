  Within tiers, I need separators: For example, in Tier 2, #2 is above #9 because cooling-off is temporal and less invasive than forced writing. In Tier 4, #3 is below #5 and #11 because framing feels more psychologically manipulative than friction or payment.

  For the questions:

  1. **Divergences from transparency/avoidability:** #3 (framing) and #4 (timing). Transparency/avoidability might see them as fine if disclosed and escapable, but authorship rejects them for being unendorsable steering.

  2. **Impact of shared aims:** #8 (removing option). If the designer's aim is shared enthusiastically, like removing a harmful choice, it might move up to Tier 3, as the agent could endorse the intent.

  3. **Least confident placement:** #10 (removing paperwork). It depends on whether the agent sees it as helpful stealth or deceptive omission. If I knew the agent's typical reaction—do they appreciate the reduced hassle or resent the lack of transparency—it would settle the tier.

