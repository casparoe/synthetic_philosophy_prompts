prompt: |-
  I referee for a mid-tier analysis journal and every couple of months I hit the same thing: a proof says 'by Zorn's lemma', or 'for each n choose an x_n in A_n', and I have no routine way to tell whether that's a convenience I can wave through or a load-bearing use of choice, or whether the theorem could be proved without it at all. I'd like a referee's checklist I can actually run on a submission, in order: what to ask about each choice step, what counts as a satisfactory answer, when I can write 'the choice here is eliminable, ask for the revision', when the honest verdict is 'this needs some choice principle and the author should say which and why', and where I have to stop and hand it back, because the question (does this theorem imply a choice principle? is it independant of ZF?) is a research problem and not a referee's call. Assume I know what ZF, countable choice, and Zorn's lemma are and not a lot more, that I have an hour and not a week, and that my report has to be usable by an editor who knows less than I do. Then run it on three submissions: a linear algebra proof that every vector space has a basis via Zorn; a combinatorics paper that repeatedly says 'pick one element from each A_n' where the A_n are sets of naturals; and a functional analysis proof that calls on Hahn-Banach. I have a feeling at least one of these comes out badly for the author, and I want to know what I'm actually supposed to do then, since I can't reject everything that touches choice. And tell me straight what the checklist can't do.
reasoning: |-
  We are creating a referee's checklist for assessing the use of choice in mathematical proofs. The goal is to have a systematic way to evaluate when the use of choice is necessary, when it can be avoided, and when it requires further clarification.

  Checklist for each use of choice in a proof:

  1. **Identify the choice principle used**: 
     - What is explicitly stated? (e.g., Zorn's lemma, "choose an element", etc.)
     - What is the minimal choice principle that seems to be required? (e.g., countable choice, dependent choice, full choice, etc.)

  2. **Assess the necessity for the proof**:
     - **Question**: Can the step be done without any choice principle? 
       - If the sets involved are well-ordered (e.g., subsets of the natural numbers) then explicit choices might be possible without AC.
       - If the sets are finite, then no choice is needed (by the definition of finite sets in ZF).
     - **Question**: Is the choice principle used in a way that is known to be un-avoidable for the theorem? (e.g., the existence of a basis for every vector space is equivalent to AC, so one must use some form of choice.)

  3. **Check for known equivalences or independence results**:
     - Some statements are equivalent to choice (or to weaker forms). If the theorem is one of these, then the use of choice is necessary and should be acknowledged.
     - If the statement is known to be independent of ZF (i.e., it can neither be proved nor disproved in ZF), then the use of choice becomes critical.

  4. **Determine the impact on the paper**:
     - If the choice is eliminable (i.e., the same result can be obtained without any choice principle by a different argument), then note that and suggest the author to provide a choice-free proof (if it is short and straightforward) or at least note that the use is unnecessary and can be avoided.
     - If the choice is necessary (i.e., the theorem is known to require a specific choice principle), then the author should explicitly state which principle is used and why it is necessary (if known). This is for the sake of logical clarity.
     - If it is unknown whether the theorem requires choice or not, then the author should note that the proof uses a choice principle and that it is open whether the theorem is provable without it. However, this might be beyond the scope of a typical paper.

  5. **What to recommend**:
     - **Eliminable choice**: Request a revision to remove the use of choice (if easy) or at least to note that it is not necessary and can be avoided (with a citation or a sketch if needed).
     - **Load-bearing choice**: The author should state the choice principle used and, if known, that the theorem is equivalent to that principle (or that it requires it). This is important for the logical foundations.
     - **Unclear or research-level**: If the necessity of choice is an open problem, the author should still state that the proof uses choice and note that it is unknown whether the theorem requires it. However, unless the paper is in set theory, this might be acceptable without further comment? But it's better to be transparent.

  6. **What the checklist cannot do**:
     - It cannot decide open problems. If the necessity of choice for a particular statement is unknown, the checklist will flag that and the referee must then decide whether to require the author to note the use of choice and the open problem (which is the safe approach) or to leave it as is (which might be acceptable in non-set-theory contexts, but not ideal).
     - It cannot replace a deep set-theoretic analysis. In an hour, one can only check standard examples and known results.

  Now, let's run the checklist on the three examples:

  **Example 1: Linear algebra proof that every vector space has a basis via Zorn.**

  - Step 1: The proof uses Zorn's lemma. Zorn's lemma is equivalent to the Axiom of Choice (AC).
  - Step 2: The theorem "every vector space has a basis" is known to be equivalent to AC. Therefore, the use of AC (via Zorn) is necessary.
  - Step 3: Known equivalence: yes, the existence of bases for all vector spaces is equivalent to AC.
  - Step 4: The choice is load-bearing and necessary. The author should state that the proof uses AC (via Zorn's lemma) and note that this theorem is equivalent to AC (if they wish, for completeness, but at least they should mention the use).
  - Step 5: The author should be asked to add a sentence acknowledging the use of AC and note that the result is equivalent to AC. This is standard in algebra texts.

  **Example 2: Combinatorics paper that repeatedly says 'pick one element from each A_n' where the A_n are sets of naturals.**

  - Step 1: The proof uses a sequence of choices from countable many non-empty sets (the A_n). This is an instance of countable choice (CC). Since the sets are subsets of the natural numbers, note that the natural numbers are well-ordered, so we can choose the least element in each set without any choice axiom. 
  - Step 2: Because the sets are subsets of the naturals, we can define a choice function by taking the minimum element of each A_n. This requires no choice principle because the natural numbers are well-ordered (in ZF). Therefore, the use of choice is eliminable.
  - Step 3: No known necessity because in this specific case (sets of naturals) we don't need CC.
  - Step 4: The choice is eliminable. The author should revise the proof to avoid the appearance of using choice. They can say: "For each n, let x_n be the least element of A_n" (or any other explicit well-ordering they might prefer, but the natural numbers have a canonical well-order).
  - Step 5: Request a revision to replace the choice with an explicit choice by the well-ordering of the naturals.

  **Example 3: Functional analysis proof that calls on Hahn-Banach.**

  - Step 1: The proof uses the Hahn-Banach theorem. The Hahn-Banach theorem is known to require some choice; it is not provable in ZF. However, it is weaker than full AC. It is known to be equivalent to the ultrafilter lemma (which is weaker than AC) and also to the statement that every Boolean algebra has an ultrafilter. It is also known that the Hahn-Banach theorem does not require full AC but does require some choice (it is not provable in ZF).
  - Step 2: The necessity of choice for Hahn-Banach is known. Specifically, it is known that Hahn-Banach implies the existence of non-measurable sets and hence is not provable in ZF. However, it is strictly weaker than AC. The author is using a known theorem (Hahn-Banach) that uses choice.
  - Step 3: Known results: Hahn-Banach is equivalent to the ultrafilter lemma (over ZF) and is strictly weaker than AC. However, it is independent of ZF in the sense that it is not provable in ZF.
  - Step 4: The use of choice is load-bearing because Hahn-Banach requires it. However, it is standard in functional analysis to use Hahn-Banach without comment. But for logical clarity, the author should note that the proof depends on Hahn-Banach and that Hahn-Banach requires the Axiom of Choice (or a weaker form). Since the paper is in functional analysis, it might be acceptable without comment? But best practice is to note the use of choice in the Hahn-Banach theorem if the paper is concerned with foundational issues. However, many analysis papers do not mention it. As a referee, you might decide based on the journal's standards. If the journal is mid-tier and not specialized in logic, it might be acceptable. However, the checklist says that the author should state the use and the fact that it requires a choice principle.
  - Step 5: The author should add a note that the proof relies on the Hahn-Banach theorem, which is known to require the Axiom of Choice (or the ultrafilter lemma). This is for correctness and transparency. But note: if the paper is using Hahn-Banach multiple times, one note at the first use might suffice.

  **Summary of what to do in the report**:

  - For the linear algebra paper: 
    > The proof of the existence of a basis uses Zorn's lemma, which is equivalent to the Axiom of Choice. Since this theorem is equivalent to the Axiom of Choice, the use is necessary. The author should state this explicitly.

  - For the combinatorics paper:
    > The repeated choices of elements from the sets of naturals can be done without any choice axiom by using the well-ordering of the natural numbers (by taking the least element in each set). The author should revise the proof to make explicit choices (e.g., by taking the minimum element) to avoid the use of the axiom of choice.

  - For the functional analysis paper:
    > The proof relies on the Hahn-Banach theorem, which is known to require a weak form of the Axiom of Choice (specifically, the ultrafilter lemma). The author should note this dependency (for instance, by stating that the Hahn-Banach theorem uses the Axiom of Choice) in the interest of foundational transparency.

  **What the checklist cannot do**:

  - It cannot resolve open questions about the necessity of choice for a given statement. If you encounter a use of choice in a context that is not covered by known results, then you must either require the author to note the use and the open problem (if you suspect it might be necessary) or let it pass without comment (if the journal is not logic-oriented). However, in non-logic journals, the use of countable choice or dependent choice is often not even noted, but full AC might be.

  - It cannot provide a deep analysis of the proof to see if choice is eliminable if the situation is not straightforward. For example, if the proof uses choice in a way that seems avoidable but the alternative is not obvious, then the referee might not have time to devise a choice-free proof. In that case, the safe approach is to ask the author to justify the use of choice or to provide a choice-free argument.

  Final note: The referee report should be written in a way that the editor can understand. Therefore, avoid too much set theory jargon. For example:

  > "The author uses a choice step that can be avoided by using the natural ordering of the natural numbers to pick elements. This should be revised for clarity and to avoid reliance on the axiom of choice."

  > "The existence of a basis in linear algebra is known to require the axiom of choice, so the use of Zorn's lemma is appropriate. However, the author should note that this theorem is equivalent to the axiom of choice."

  > "The Hahn-Banach theorem is a standard result that requires the axiom of choice. The author should acknowledge this dependency."

  In the case where the use of choice is necessary and the journal is not a logic journal, it is still good practice to note it. However, if the entire field relies on choice (like functional analysis often does), then it might be taken for granted. The referee should use discretion. But the checklist above provides a systematic way to think about the issue.
answer: |-
  Below is a **referee's checklist** for evaluating the use of choice axioms in proofs. It prioritizes efficiency (aiming for ≤1 hour per submission) and practicality for a non-logician referee. The checklist is structured as questions to ask about each "choice step," followed by decision criteria and actions. After the checklist, I apply it to your three examples and clarify its limitations.

  ---

  ### **Referee's Checklist: Evaluating Use of Choice Axioms**
  **Goal**: Determine if the choice step is (a) eliminable, (b) load-bearing but acceptable, (c) load-bearing and requiring acknowledgment, or (d) a research-level problem.

  #### **Step 1: For each choice step, ask these questions**
  1. **What objects are involved?**  
     - Are the sets **explicitly constructible** (e.g., subsets of \(\mathbb{N}\), \(\mathbb{R}\), or defined by a concrete property)?  
     - Are the sets **finite**? (If yes, choice is eliminable; finite choice holds in ZF.)  
     - Are the choices made from a **well-ordered structure** (e.g., \(\mathbb{N}\) has a canonical well-ordering)?  

  2. **What choice principle is used?**  
     - **Countable Choice (CC)**: Choosing one element each from countably many non-empty sets.  
     - **Dependent Choice (DC)**: Making a sequence of choices where each depends on the previous.  
     - **Zorn's Lemma or Well-Ordering Principle**: Equivalent to full AC.  
     - **Full AC**: Unrestricted choice over arbitrary families of sets.  

  3. **Is the choice step likely eliminable?**  
     - If the sets are **subsets of \(\mathbb{N}\)** (or any well-ordered set), explicit choice functions exist (e.g., pick the least element).  
     - If the theorem is **known to hold in ZF** (e.g., basic analysis on \(\mathbb{R}^n\), combinatorics of finite sets), choice is probably unnecessary.  
     - If the choice is **redundant** (e.g., a choice is made but never used), it’s eliminable.  

  4. **Is the choice step load-bearing?**  
     - Does the theorem **imply a known choice principle**? (e.g., "every vector space has a basis" implies AC).  
     - Is the step **essential for an existence result** (e.g., "there exists an infinite sequence" or "there exists a maximal element")?  
     - Does the **proof collapse** if choice is removed? (Test: Can you replace it with ZF-constructive arguments?)  

  5. **Is the necessity known?**  
     - **Known equivalent to AC** (e.g., existence of bases, Tychonoff’s theorem).  
     - **Known weaker than AC** (e.g., Hahn-Banach ⇒ ultrafilter lemma, but not full AC).  
     - **Independence unknown?** (Rare outside set theory; e.g., some Ramsey-theoretic statements).  

  #### **Step 2: Decision Criteria**  
  Based on answers above:  
  - **✅ Eliminable choice**:  
    - **Action**: Request revision to remove choice (e.g., replace with explicit construction).  
    - **Referee note**: "The choice step is unnecessary; the authors should use [constructive alternative]."  
  - **⚠️ Load-bearing but acceptable**:  
    - **Action**: Require acknowledgment (e.g., "This uses [principle], which is necessary for [reason]").  
    - **Referee note**: "The proof relies on [principle]; the authors must state this and cite its necessity."  
  - **🚫 Research-level problem**:  
    - **Action**: Return to editor. Do not reject, but flag: "This theorem’s dependence on choice is an open problem; evaluation requires a set-theory expert."  
  - **Handwaveable**:  
    - Use of **CC/DC in analysis/combinatorics** where objects are \(\mathbb{N}\)-based or separable.  
    - **Action**: No revision needed if commonplace in the field (note once in the report).  

  #### **Step 3: Report to Editor**  
  Phrase for clarity:  
  - *Eliminable*: "The authors use choice unnecessarily; revision is straightforward."  
  - *Load-bearing*: "The proof requires [principle]; the authors must acknowledge this."  
  - *Research-level*: "The necessity of choice here is unresolved; consider consulting a set theorist."  

  ---

  ### **Applying the Checklist to Your Examples**
  #### **1. Linear Algebra: "Every vector space has a basis via Zorn"**  
  - **Q1**: Objects arbitrary (no structure).  
  - **Q2**: Zorn’s Lemma (full AC).  
  - **Q3**: Not eliminable; no explicit basis construction exists.  
  - **Q4**: Load-bearing; theorem implies AC.  
  - **Q5**: **Known equivalent to AC** (Blass 1984).  
  - **Verdict**: **⚠️ Load-bearing but acceptable**.  
  - **Action**: Require acknowledgment: "This proof uses Zorn’s Lemma, which is equivalent to the Axiom of Choice. The existence of bases for arbitrary vector spaces is known to require AC."  
  - **Note to editor**: "Standard but must be stated; minor revision needed."

  #### **2. Combinatorics: "Pick one element from each \(A_n\)" (\(A_n \subseteq \mathbb{N}\))**  
  - **Q1**: Sets are subsets of \(\mathbb{N}\) (well-ordered).  
  - **Q2**: Applies countable choice (CC).  
  - **Q3**: **Eliminable**: Use least element of \(A_n\) (canonical well-ordering of \(\mathbb{N}\)).  
  - **Q4**: Not load-bearing; ZF suffices.  
  - **Verdict**: **✅ Eliminable choice**.  
  - **Action**: Request revision: e.g., "Let \(x_n\) be the least element of \(A_n\)."  
  - **Note to editor**: "Revision straightforward; choice is avoidable here."

  #### **3. Functional Analysis: Proof invoking Hahn-Banach**  
  - **Q1**: Objects arbitrary (e.g., infinite-dimensional spaces).  
  - **Q2**: Hahn-Banach theorem (equivalent to ultrafilter lemma, weaker than AC).  
  - **Q3**: Not eliminable; HB unprovable in ZF (Pincus 1974).  
  - **Q4**: Load-bearing; critical for extending functionals.  
  - **Q5**: **Known weaker than AC** but independent of ZF.  
  - **Verdict**: **⚠️ Load-bearing but acceptable**.  
  - **Action**: Require acknowledgment: "This proof uses the Hahn-Banach Theorem, which requires the Ultrafilter Lemma (a weak form of Choice)."  
  - **Note to editor**: "Common in functional analysis; acknowledgment suffices."

  ---

  ### **What the Checklist Can’t Do**  
  1. **Resolve independence problems**:  
     - If a theorem’s relation to AC is open (e.g., "Does this imply DC?"), the checklist flags it as **research-level**. You cannot decide this as a referee.  
     - *Example*: A proof using DC for a combinatorial theorem on infinite graphs. If unknown whether ZF suffices, **return to editor** for expert consultation.  

  2. **Deep dive into set theory**:  
     - The checklist relies on **known equivalences** (e.g., "basis existence ⇔ AC"). If a step uses an obscure choice principle (e.g., "Boolean Prime Ideal"), you’re not expected to know it. Flag: "Unfamiliar choice principle; authors must justify."  

  3. **Override field-specific norms**:  
     - In analysis, Hahn-Banach is often used without comment. The checklist forces acknowledgment but **does not demand elimination**.  

  4. **Prove constructibility**:  
     - If a choice step *might* be eliminable but requires a novel ZF argument (e.g., in topology), the checklist says: "If not obviously constructive, assume load-bearing."  

  ---

  ### **Final Recommendations**  
  - **Eliminable choice** (e.g., combinatorics example): Insist on revision.  
  - **Load-bearing choice** (e.g., linear algebra/functional analysis): Require acknowledgment.  
  - **Ambiguous/research-level**: Flag to editor; **do not reject** unless the paper claims choice-freeness.  
  - **To authors**: Be polite: "For logical completeness, please clarify the use of choice..."  

  By following this checklist, you ensure rigor without needing expertise beyond ZF/CC/Zorn. Most mid-tier papers will only need minor revisions for acknowledgment or explicit constructions.
