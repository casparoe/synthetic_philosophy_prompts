answer: |-
  Your analysis is remarkably perceptive. The exam accommodation system reveals a complex, often inconsistent, implicit theory of mind. Let's reconstruct it step by step, addressing your core questions:

  ### Implicit Theory of Mind in Current Practice
  1. **Hybrid & Compensatory Model**:  
     The practice presupposes cognition is *primarily* skull-bound, but allows **instrumental coupling** only when:
     - A **diagnosed deficit** exists (medical/psychological authority)
     - The tool **restores function** to a "neurotypical baseline" (e.g., calculator for dyscalculia ≈ typical mental arithmetic)
     - The tool doesn't add "new" capacity (e.g., text-to-speech reads *provided* text but doesn't generate ideas).

     This creates a **deficit-compensation framework**: External tools are prosthetic, not constitutive. Cognition ends at the skull *unless* a gap is medically certified.

  2. **The "Normal Baseline" Paradox**:  
     The "baseline" is socially constructed (e.g., mental math is "normal"; recalling formulas unaided is "normal"). Tools are allowed *only* to approximate this baseline for some, while actively *denying* tools to others who might exceed it. Hence your teacher's index-card quip: Permitting tools for all would destabilize the baseline itself.

  3. **Quietly Ruled-Out Views**:  
     - **Extended Mind Theory (EMT)**: If notebooks/phones *are* part of memory when reliable/accessible (per Clark & Chalmers), banning them for non-disabled students is incoherent.  
     - **Distributed Cognition**: Rejects individual skull as the unit of analysis. The practice insists cognition must be individual and "internal."  
     - **Universal Design for Learning (UDL)**: Would provide flexible tools for *all* students, rejecting deficit-based gatekeeping.

  ---

  ### Fairness vs. Metaphysical Commitments
  - **What practice strictly requires**:  
    A **fairness principle**: "Equalize opportunity to demonstrate knowledge." *No specific theory of mind is needed.* The system could be justified purely by equity: "Student A needs tool X to have the same shot as peers without disability Y."

  - **What it fits best with (but doesn't require)**:  
    A **skull-bound default with medicalized exceptions**. The diagnosis requirement medicalizes cognitive diversity, framing tools as prosthetics for the "impaired." This fits a biomedical view of mind but isn't logically necessary for fairness.

  **Inconsistency Spotlight**:  
  Confiscating a non-disabled student's notes while giving a dyslexic student text-to-speech *is* coherent under fairness (if dyslexia is a barrier to accessing the test's *intended* skill). But it becomes arbitrary if the test's purpose is underspecified (e.g., is memorization itself the skill being tested?).

  ---

  ### If Schools Embraced Extended Mind Theory (EMT)
  Adopting EMT as policy would necessitate radical changes:

  | Current Practice | EMT-Aligned Approach |
  |------------------|----------------------|
  | Tools require a diagnosis | Tools available to all based on task relevance |
  | "Cheating" = using external aids | "Cheating" = unauthorized collaboration |
  | Exam measures "internal knowledge" | Exam measures *system* performance (brain + tools) |
  | Accommodations restore "normal" function | Assessments designed for diverse cognitive ecologies |
  | Memory/recall as default skill | Curricular focus on information management & critical synthesis |

  1. **Redesigned Assessments**:  
     Exams would test **deployment of cognitive systems**: "How well can you solve problems using *your* curated toolkit?" Memorization-focused tests (e.g., closed-book math proofs) might vanish.

  2. **Universal Tool Access**:  
     All students could use notes/tech, provided tools are personal (not shared). "Accommodations" would disappear; tools become standard pedagogical elements.

  3. **New "Cheating" Boundaries**:  
     Focus shifts to preventing *unauthorized external agency* (e.g., messaging a tutor during an exam), not tool use itself.

  4. **Purpose Redescription**:  
     Exams measure **cognitive agility** (finding, evaluating, applying information) rather than recall. EMT aligns with 21st-century skills (e.g., navigating information ecosystems).

  ---

  ### Underdetermination & What's Doing No Real Work
  - **Underdetermined Aspects**:  
    The *fairness rationale* could justify the current system *or* an EMT-aligned one. Neither theory is strictly required.

  - **Idle Components**:  
    - **Diagnosis as Gatekeeper**: Does little metaphysical work; it's a bureaucratic mechanism to limit tool access. Fairness could be achieved via UDL without diagnoses.  
    - **Baseline Fetishization**: The "normal" baseline is doing heavy lifting but is socially contingent (why is unaided calculation "normal" but unaided recall of formulas not?).  
    - **Tool Categorization**: Banning phones but allowing calculators reflects cultural anxiety about connectivity, not a principled cognitive boundary.

  ### Conclusion
  The current system is **best explained by a compensatory, deficit-based model** that assumes a skull-bound default, with tools as prosthetics permitted only to approximate neurotypical performance. It *could* be justified by fairness alone, but its reliance on diagnosis reveals an unspoken commitment to medicalized normality. A genuine embrace of EMT would democratize tools, redefine skills, and treat cognition as an ecology—not a sealed vault. The deepest tension lies in schools claiming to assess "knowledge" while conflating it with memorization under arbitrary constraints. Your instinct is correct: the practice's contradictions stem from unexamined assumptions about where the mind ends and the world begins.
