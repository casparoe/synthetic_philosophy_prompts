prompt: |-
  I'm a third-year student in a seminar on moral philosophy, and this week we read the article of the Summa in which Aquinas asks whether it is lawful to kill a man in self-defense. I follow the conclusion but the middle of the argument defeats me. Here is the passage:

  "Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention. … Accordingly, the act of self-defense may have two effects: one, the saving of one's life; the other, the slaying of the aggressor. … Therefore, this act, since one's intention is to save one's own life, is not unlawful, seeing that it is natural to everything to keep itself in being as far as possible. And yet, though proceeding from a good intention, an act may be rendered unlawful if it be out of proportion to the end. Wherefore, if a man in self-defense uses more than necessary violence, it will be unlawful, whereas, if he repel force with moderation, his defense will be lawful."

  My trouble is this. The later tradition distilled a condition out of this very passage — that the good effect must not be produced by means of the bad one — and yet in the example the saving of the life seems to run through the aggressor's death: I am alive because he is dead or disabled. So either Aquinas is not stating that condition here at all and has been read anachronistically, or the example is carried by something other than the side-effect structure — perhaps by the thought that a private person has no authority over life, so that what he may intend is fixed in advance by his station rather than by the causal shape of what he does.

  Please don't simply explain the doctrine of double effect to me; I have read the standard accounts. Help me read this passage. Structure your answer as follows: (1) "The argumentative job" — about 100 words on what the three sentences are doing within the article, including why the proportionality sentence arrives after the conclusion rather than before it; (2) "Where the difficulty actually is" — 100–150 words pinning down the precise point of strain, keeping the causal worry separate from the intention worry; (3) "Reading one: side effect" — about 200 words developing the reading on which Aquinas is stating a side-effect condition, and saying what it must do with the proportionality sentence in order to survive; (4) "Reading two: authority" — about 200 words developing the reading on which the private person's lack of authority over life does the work, and saying what it must do with the "two effects" sentence in order to survive; (5) "Which reading the article better supports" — 150 words, taking a side and naming the one feature of the surrounding discussion that would most embarrass the other reading; (6) "My hypothesis" — 100 words assessing my suggestion that the authority reading is the right one, and telling me what I have got wrong. No citations or reading lists, please — I want to see the argument.
reasoning: |-
  Hmm, the user is a third-year philosophy student grappling with Aquinas' self-defense argument in the Summa. They understand the conclusion but are stuck on the middle passage about double effect and proportionality. Their core confusion is whether the later "no means" condition (good effect not achieved through bad effect) actually appears in Aquinas or is an anachronistic reading. They propose an alternative "authority-based" interpretation and want me to analyze both readings rigorously.

  The user has clearly done their homework - they reference the exact article (II-II Q64 A7), demonstrate familiarity with DDE scholarship, and articulate the causal/intention tension precisely. This isn't a beginner asking for basics; they want advanced exegesis. Their framing suggests they lean toward the authority reading but want it stress-tested.

  Breaking this down step by step: First, the argumentative job section needs to reconstruct Aquinas' flow. The three sentences: (1) establishes the two-effects framework to resolve the apparent contradiction between preserving life (good) and killing (bad), (2) applies it to self-defense by separating intended preservation from unintended killing, (3) then adds proportionality as a separate qualifying condition after establishing lawfulness. Crucially, proportionality comes last because it's a secondary check - Aquinas first needs to show killing isn't intrinsically unlawful before discussing its limits.

  For the difficulty: The user spots that in real-world self-defense, preserving one's life causally depends on the aggressor's death/disablement. But if the good effect (life saved) requires the bad effect (death), doesn't that violate later DDE formulations? Yet Aquinas doesn't mention this dependency. The strain is between causal necessity and intentional structure - Aquinas insists death is "beside the intention," but practically, it's instrumentally necessary.

  For Reading 1 (side-effect): This takes the "two effects" passage as an early DDE statement. To reconcile the causal dependence, we'd have to interpret "beside the intention" strictly: even if death causes preservation, the agent only intends preservation as the end, using necessary force as the means. The death-result is foreseen but not part of the means-end chain chosen. Proportionality then becomes crucial - if force is excessive, the death shifts from unintended side-effect to intended means.

  For Reading 2 (authority): Here the "two effects" framework is just setting up the possibility, but the real work is done by the agent's lack of authority to intend killing. Private persons can't licitly intend death period, so they must only intend self-preservation, making any resulting death indirect. The "two effects" sentence merely shows such indirectness is possible, while the authority limit defines what private agents can intend. This reading downplays causal structure.

  Evaluating both: Reading 1 struggles because Aquinas never addresses the causal dependency here, while Reading 2 fits his opening objection about private persons lacking execution rights. The surrounding article emphasizes authority distinctions (rulers vs. individuals), making the authority reading more coherent. The proportionality mention actually supports Reading 2 - it's added precisely because without authority, private agents must minimize harm.

  Finally, the user's hypothesis about authority being key is largely correct, but they slightly misconstrue the role of "two effects." It's not irrelevant - it establishes that acts can have unintended consequences, creating conceptual space for the authority limit to operate. The real insight is that for Aquinas, what agents can intend is constrained by their social role first, with causal structure secondary.
answer: |-
  ### (1) The argumentative job
  Aquinas must reconcile two moral truths: self-preservation is natural/licit, yet killing is generally forbidden. The first sentence introduces the core principle: acts with two effects (one intended good, one unintended bad) can be lawful *if* only the good is intended. The second applies this to self-defense: preserving life (intended) versus killing the aggressor (unintended). The conclusion ("Therefore...") asserts lawfulness based on the natural inclination to preserve life. Proportionality appears *after* this conclusion because it’s a secondary safeguard. Aquinas first establishes that killing *can* be lawful *in principle* under double effect; proportionality then sets *conditions* for that lawfulness in practice. It’s not part of the core justification but a limiting rule to prevent abuse.

  ### (2) Where the difficulty actually is
  The strain lies in causality versus intention. You observe that in physical reality, the good effect (your survival) causally depends on the bad effect (aggressor’s death/disablement). If the aggressor isn’t stopped, you die. So, the good effect *requires* the bad effect as a means. Yet Aquinas insists the death is "beside the intention" and the act is lawful if proportionate. The conflict is this: **If the good effect is achieved *through* the bad effect causally, how can the bad effect be truly "beside the intention"?** This isn’t about whether you *desire* the death (intention as motive), but whether the causal structure makes the death an instrumental means to survival, which might imply you intend it *as* a means.

  ### (3) Reading one: side effect
  On this reading, Aquinas *is* articulating a proto-"means/effect" distinction. The "two effects" sentence establishes that unintended bad consequences don’t necessarily render an act unlawful. For the example to work, we must interpret "beside the intention" as excluding the aggressor’s death *from the agent’s chosen means*. The agent intends *only* to stop the attack (using necessary force), not to kill. Death is a foreseen but unintended *consequence* of that force. The causal dependence is real, but morally irrelevant if the death isn’t willed *as* the means. Proportionality becomes crucial: **If you use excessive force (e.g., shooting a disarmed attacker), you *make* death your intended means of safety, violating double effect.** The condition survives by distinguishing chosen acts (repelling force) from their unavoidable physical consequences (death), with proportionality policing that boundary.

  ### (4) Reading two: authority
  Here, the "two effects" framework is secondary. The decisive factor is the *private person’s lack of authority* over life. Aquinas states earlier (Objection 2 & Reply) that only public authority can licitly *intend* killing. The private defender must therefore intend *only* self-preservation; intending death is intrinsically unlawful for them. The "two effects" sentence merely shows that acts *can* have unintended bad results, creating conceptual space for this authority limit to operate. **The causal path (survival depending on death) is irrelevant; what matters is that the private agent, lacking jurisdiction, *cannot* lawfully intend death under any circumstances.** The "two effects" structure survives as a conceptual tool illustrating *how* one might act without intending death, but the normative heavy lifting is done by the agent’s social role.

  ### (5) Which reading the article better supports
  **Reading two (authority) is better supported.** The entire Article is framed by authority distinctions. Objection 2 explicitly argues killing is unlawful for private individuals because only rulers have that power. Aquinas *agrees* fundamentally ("I answer that...") but introduces double effect to explain *how* a private act causing death might still be lawful *if* death isn’t intended. Crucially, his Reply to Objection 2 restates: "The act of self-defense may have two effects... *unless* he be entrusted with public authority." This embarrasses Reading one: Aquinas ties the permissibility *directly* to the agent’s lack of authority, not abstract causal structures. The "two effects" logic is deployed *in service of* explaining how a private person avoids usurping public authority’s role.

  ### (6) My hypothesis
  Your hypothesis that authority does the core work is correct. Where you slightly err is minimizing the role of the "two effects" structure. It *is* essential, but as a *mechanism* enabling the authority limit to function, not as the primary moral criterion. Aquinas uses it to show *how* a private person can act defensively (an act that *causes* death) *without* intending death (which they lack authority to do). The causal worry isn’t resolved by Aquinas here because his focus is *jurisdictional*: what a private agent *may intend* is constrained by their role, making the causal dependence morally secondary. Your insight about "station fixing intention" is precisely right.
