  We are to specify the desiderata for an adequate treatment of the surprise exam paradox. The paradox:

  A teacher announces: "There will be an exam next week, and it will be a surprise." The class meets Monday through Friday. The student reasons:

  1. The exam cannot be on Friday, because if it hasn't happened by Thursday, then on Thursday night I would know the exam must be on Friday and it wouldn't be a surprise.
  2. Therefore, the exam must occur Monday through Thursday. But then it cannot be on Thursday, because if it hasn't happened by Wednesday, then on Wednesday night I would know it must be on Thursday (since Friday is ruled out) and it wouldn't be a surprise.
  3. Similarly, we rule out Wednesday, then Tuesday, then Monday. Therefore, a surprise exam is impossible.

  But then, the teacher gives the exam on, say, Wednesday, and it is a surprise.

  The desiderata:

  1. **Non-negotiable: The possibility of a surprise exam must be affirmed.**  
     Motivation: We know from experience that a surprise exam can be given. Any solution that concludes a surprise exam is impossible is unacceptable because it contradicts reality.

  2. **Non-negotiable: The backward induction must be shown to be flawed, but the flaw must be precisely located and explained.**  
     Motivation: The induction seems compelling until the last step. We must say why it breaks down. The solution must not dismiss the entire induction as invalid without explanation.

  3. **Non-negotiable: The solution must account for the difference between the announcement being true and the announcement being known (or believed).**  
     Motivation: The student uses the announcement in the induction. But if the announcement is false, then the induction might not hold. However, the teacher might be truthful. We must disentangle the truth of the announcement from the student's knowledge.

  4. **Preference (of some camps): The last-day case must be handled without feeling forced.**  
     Motivation: The last day (Friday) is the starting point of the induction. The student's reasoning for Friday seems strong: if the exam hasn't occurred by Thursday, then on Friday it wouldn't be a surprise. But we must explain why this step is problematic.

  5. **Preference (of some camps): The solution should avoid ad hoc modifications to the logic of knowledge or time.**  
     Motivation: Some solutions change the logic (e.g., by introducing levels of knowledge or probabilistic thresholds) but we want to see if the paradox can be resolved without such changes.

  Now, we stress-test with two extensions:

  **Extension 1: Credences and Public Announcement**

  Replace certainty with credences. The exam is a surprise if on the morning of the exam, the student's credence that the exam occurs that day is below a threshold, say 0.5. The announcement is public and common knowledge.

  - Which requirements become harder?  
    Requirement 2 (explaining the flaw in induction) becomes harder because the induction now involves credences. The student might have non-zero credence on Friday even if the exam hasn't occurred, but the threshold might be crossed. Also, requirement 3 (truth vs. belief) must be adjusted for degrees of belief.

  - Does it force any requirement off the list?  
    The non-negotiable requirements remain. However, the credence version might make requirement 4 (last-day case) easier because even on Friday the student might have a credence below the threshold if they have some doubt about the teacher's announcement or their own reasoning.

  **Extension 2: Mutual Knowledge of Reasoning**

  Instead of days, the induction runs over the students' mutual knowledge of each other's reasoning. For example, in a group of students, each knows the others are rational and that they all heard the announcement. The induction is over the students: if there are n students, the exam cannot be a surprise to student 1 if student n-1 is surprised, and so on.

  - Which requirements become harder?  
    Requirement 2 (explaining the flaw in induction) becomes harder because the mutual knowledge might lead to an infinite regress. Requirement 3 (truth vs. belief) becomes more complex because the announcement must be common knowledge and we must consider what each student believes about the others.

  - Does it force any requirement off the list?  
    The non-negotiable requirements must still hold. However, requirement 4 (last-day case) is replaced by the last student in the chain, and it might feel equally forced.

  **Which requirement does the most work in ruling out proposed solutions?**

  Requirement 2: The backward induction must be shown to be flawed, but with a precise location and explanation. Many proposed solutions either dismiss the entire induction (without explaining why the student feels compelled by it) or accept it and then try to work around the conclusion. This requirement forces the solution to engage with the step-by-step reasoning and pinpoint where it goes wrong.

  **Sketch of a treatment satisfying non-negotiables:**

  1. **Possibility of surprise (requirement 1):** We must assert that a surprise exam is possible. So, we design a scenario: the teacher chooses a day at random (with equal probability) and the student, knowing this, has a high credence each day until the exam happens? But note: the student's reasoning might alter their credences.

  2. **Flaw in backward induction (requirement 2):** The flaw is in the assumption that the student can assume the exam hasn't occurred by day k and then use that to conclude that the exam must be on day k+1 (if k+1 is the only remaining day). However, if the student's reasoning is that the exam cannot be on a particular day, then that day becomes a candidate again? 

     One approach: the announcement creates a contradiction if taken as common knowledge. So, the student must doubt the announcement when the induction leads to a contradiction. Thus, the induction step fails because at each step the student must consider that the announcement might be false. So the induction step for day k relies on the assumption that the student, at the beginning of day k, believes the exam is still coming and the announcement is true. But if the induction has already ruled out days k+1 to n, then the student at day k would believe the exam must be on day k. However, that belief is based on the assumption that the announcement is true. But if the announcement is true, then the exam must be a surprise, which it wouldn't be if the student believes it must be on day k. Therefore, the student must conclude that the announcement is false? Then the induction collapses.

     However, the teacher can still give the exam on a day that the student did not expect. How? Because the student, at the beginning of the week, does not know which day the exam will be. The induction only seems to rule out all days if the student takes the announcement as true. But if the student takes the announcement as true, they get a contradiction. Therefore, the student should not take the announcement as true? But then the teacher can give the exam on a day that the student does not expect (because the student thinks the announcement might be false) and thus it can be a surprise.

