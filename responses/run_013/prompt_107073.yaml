answer: |-
  ### Desiderata for an Adequate Treatment of the Surprise Exam Paradox

  Below are the requirements any solution must satisfy, motivated by core aspects of the paradox. Non-negotiable requirements are essential; others reflect preferences of specific philosophical camps. Conflicts are noted.

  ---

  #### **Non-Negotiable Requirements**
  1. **Affirm the Possibility of a Surprise Exam**  
     **Motivation**: Empirical reality: Teachers *can* give surprise exams (e.g., on Wednesday when the student expects Thursday). A solution proving surprise impossible is falsified by practice and must be rejected.  
     **Stress-test impact**: Hardened in both extensions. In the credence model, a threshold-based surprise must remain possible. In mutual knowledge, a surprise must be achievable even with shared rationality.

  2. **Pinpoint the Flaw in Backward Induction**  
     **Motivation**: The induction appears sound until collapse. A solution must identify *which step* fails and *why*, without dismissing the entire induction as invalid or irrelevant.  
     **Case**: The Friday step (step 1) often seems plausible, but subsequent steps (e.g., Thursday) feel increasingly forced. The flaw must be located and justified.  
     **Stress-test impact**: Harder in the credence model (probabilistic steps) and mutual knowledge (recursive beliefs). Still non-negotiable—the flaw must be explicable in these frameworks.

  3. **Distinguish Truth, Belief, and Knowledge**  
     **Motivation**: The teacher's announcement might be *true* even if the student’s *belief* or *knowledge* makes surprise impossible. A solution must separate:  
     - *Announcement truth*: The exam occurs and is unexpected that morning.  
     - *Student belief/knowledge*: Derived from the announcement and induction.  
     **Case**: If the student *knows* the announcement is true, induction proceeds; if not, surprise remains possible.  
     **Stress-test impact**: Critical in both extensions. Credences model belief explicitly; mutual knowledge requires handling nested beliefs ("I know that you know...").

  ---

  #### **Preference-Based Requirements**
  4. **Resolve the Last-Day "Forced Feeling"**  
     **Motivation**: The Friday step (step 1) seems intuitive—if no exam by Thursday, Friday can't be a surprise. Yet this starts the collapse. A solution should explain why this step feels compelling but is unreliable.  
     **Camp preference**: Semantic or epistemic treatments (e.g., knowledge is not closed under deduction) prioritize this; probabilistic treatments downplay it.  
     **Conflict**: Cannot be satisfied simultaneously with requirement 5 if adhering to classical logic.  
     **Stress-test impact**: In credences, the last day may not feel forced (beliefs are graded). In mutual knowledge, the "last student" inherits this issue.

  5. **Avoid Ad Hoc Modifications to Logic/Knowledge**  
     **Motivation**: Some solutions alter epistemic logic (e.g., introducing non-monotonic knowledge) or time (e.g., branching futures). A "clean" solution should use standard logic and epistemology.  
     **Camp preference**: Orthodox Bayesians and classical logicians insist on this; others accept revisions if well-motivated.  
     **Conflict**: Clashes with requirement 4 if explaining the last day requires epistemic gaps.  
     **Stress-test impact**: Harder in mutual knowledge, where shared rationality might demand non-classical logic.

  ---

  ### Stress-Testing Against Extensions
  **Extension 1: Credence Model**  
  - **Setup**: Surprise = exam-day credence < threshold (e.g., 0.5). Announcement is public (common knowledge).  
  - **Requirements impacted**:  
    - **Harder**: Requirement 2 (pinpointing the flaw). Induction now involves probabilistic thresholds, and steps may fail asymmetrically.  
    - **Easier**: Requirement 4 (last-day forced feeling). On Friday, credence may stay below threshold if the student doubts the exam will occur.  
  - **Requirements preserved**: All non-negotiables hold. Requirement 3 is central—truth (exam occurs) vs. belief (credence) is explicit.

  **Extension 2: Mutual Knowledge of Reasoning**  
  - **Setup**: Induction over students: "Student 1 cannot be surprised if Student 2 expects it, but Student 2 cannot be surprised if Student 3..."  
  - **Requirements impacted**:  
    - **Harder**: Requirement 2 (flaw location). Failure may stem from infinite regress in mutual knowledge, not a specific step. Requirement 3 (truth vs. belief) becomes complex with nested beliefs.  
    - **Forced off**: None. Requirement 5 (no ad hoc logic) may be violated if mutual knowledge requires non-classical fixes.  
  - **Requirements preserved**: Requirement 1 (possibility of surprise) must still hold; e.g., students assign non-zero credence to "irrational" peers.

  ---

  ### Key Insights from Desiderata
  - **Most Impactful Requirement**: **Requirement 2 (pinpoint the induction flaw)**. It rules out solutions that:  
    - Dismiss induction as "obviously wrong" without diagnosis.  
    - Accept induction but claim the exam "disproves" it (self-defeating announcements fail requirement 1).  
    - Use vague appeals to "unexpected days" without modeling belief.  

  - **Conflict**: Requirements 4 and 5 cannot both be fully satisfied. Classical logic (requirement 5) struggles to explain why the last step feels forced without epistemic revisions. Compromise: Use standard logic but show why the student’s reasoning *seems* sound.  

  - **Satisfying Non-Negotiables: Solution Sketch**  
    1. **Affirm possibility**: The exam occurs on a day the student least expects (e.g., Wednesday with credence 0.3).  
    2. **Pinpoint flaw**: The induction fails at the **first step** (Friday) because it assumes the announcement is *known* true. In reality, the student cannot know the announcement is true, as it would create a contradiction (surprise impossible → announcement false).  
    3. **Truth vs. belief**: The announcement is *true* (exam occurs and is unexpected), but the student cannot *know* it in advance. Belief is revised daily via Bayesian updates.  
    4. **Model**:  
        - Prior belief: Small credence that the teacher lies (e.g., no exam).  
        - Daily update: As days pass without an exam, credence in teacher honesty drops.  
        - Result: On any day, exam-day credence can stay below threshold if doubt persists.  
    5. **Extensions**:  
        - **Credences**: Threshold ensures surprise is measurable. Public announcement handled via common priors.  
        - **Mutual knowledge**: Students share priors but doubt others’ rationality, breaking recursive beliefs.  

  This treatment satisfies non-negotiables: Surprise is possible, induction fails at step 1 (due to unjustified knowledge of the announcement), and truth/belief are separated. The last day feels forced only if knowledge is assumed—but knowledge is unwarranted.
