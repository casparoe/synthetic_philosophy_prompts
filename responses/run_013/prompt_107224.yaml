prompt: |-
  I am trying to determine whether the following pattern has an established name, because every label I try on it seems to cover something slightly different.

  Two parties are locked in a contest that neither can win cheaply and neither can abandon cheaply, and yet neither has staked anything on the outcome that it would forfeit by stopping. My brother and I have spent two years and most of our mother's estate arguing over her house. Neither of us wants the house; each of us wants not to be the one who gave way. At any point either of us could have simply conceded it to the other and walked away, at no cost except the admission of having given way. The lawyers have now been paid more than the house is worth. When I ask him why it matters, his answer is always framed in terms of what it has already cost us; when I ask myself the same question, I give the same answer. It is as though the thing on the table becomes more valuable the more we both spend on it, and — this is the part I cannot fit to anything — his spending appears to raise its value to me as much as my own does. I see the same shape at work in two departments of the company I work for, each maintaining its own version of the same system, each waiting for the other to be the one whose project is cancelled.

  I know the dollar auction, and this is not quite it: there the loser pays and the prize is worth a fixed amount, so the trap is that the price rises while the prize does not. Here the prize itself appears to rise, and nothing is forfeited by stopping. I also know the phrase "escalation of commitment," but what I am describing does not obviously involve defending a decision anyone made; neither of us chose this quarrel, and walking away would not require anyone to admit an error.

  Does this pattern have a name? If it reduces to one of the things I have already mentioned, I would like to know precisely which features of my description are doing the work and which I am imagining. If it does not, please name it and define it, and tell me what falls outside it — in particular, whether it survives the substitution of a thing with a fixed market value, whether it requires two parties or can occur with one, what distinguishes it from a contest in which each side is merely waiting for the other to tire, and whether the fact that neither of us forfeits anything by stopping means the whole thing is really just stubbornness with a story attached.
reasoning: |-
  Okay, the user is describing a situation where two parties are stuck in a costly conflict that neither can win or abandon easily. They've been arguing over their mother's house for two years, spending more than it's worth. Neither actually wants the house; it's about not wanting to concede. The user has compared it to the dollar auction and escalation of commitment but finds those don't quite fit because here, the perceived value of the prize seems to increase with each party's spending, and stopping doesn't incur a direct forfeit.

  First, I need to recall relevant psychological and economic concepts. The dollar auction involves bidding where the loser pays their bid but gets nothing, leading to bids exceeding the prize's value. Here, there's no auction; it's a conflict where costs escalate, but the "prize" (winning the argument) gains value as more is spent. Escalation of commitment usually involves justifying past decisions, but the user says neither chose the quarrel, so admitting error isn't a factor. So existing terms don't perfectly match.

  The key elements are: sunk costs driving perceived value, mutual reinforcement of commitment, no material loss from quitting, and the conflict becoming symbolic. The Concorde Fallacy comes to mind—continuing based on past investment despite future costs. But that's individual, not mutual. The sunk cost fallacy applies as both parties are influenced by past expenditures, making the house seem more valuable. 

  Interpersonal escalation fits because both parties' actions amplify each other's commitment. Each sees the other's spending as validation, increasing the stake. It's not just stubbornness; the sunk costs create a shared narrative that the conflict must be worthwhile. The prize's value is psychological—avoiding loss of face—and escalates as costs mount.

  The user also mentions a similar situation at work with two departments maintaining duplicate systems. That parallels the interpersonal conflict, showing the pattern isn't limited to personal disputes. It can occur with groups, and the prize (project survival) gains value through sunk costs.

  To name this, "Mutual Sunk Cost Escalation" seems apt, emphasizing the reciprocal reinforcement. It differs from mere stubbornness as the sunk costs create a self-justifying cycle. The pattern survives with fixed-value items because the perceived value becomes psychological. It requires at least two parties since each fuels the other's commitment. Distinguishing from attrition is key—here, the conflict's value inflates, whereas attrition is about endurance without value change.

  The user's deeper need might be understanding the mechanism to find a way out. Recognizing the sunk cost trap and reframing disengagement as rational could help. They might seek validation that it's not just stubbornness but a psychological trap, which could inform resolution strategies.
answer: |-
  Based on your detailed and insightful description, the pattern you've identified doesn't have a single, universally agreed-upon name, but it's a powerful and distinct phenomenon. It combines elements of known concepts but adds a crucial *mutually reinforcing escalation of perceived stakes* driven purely by **sunk costs**, where the "prize" transforms into an abstract symbol of avoiding capitulation.

  The most precise label for this specific dynamic appears to be **Mutual Sunk Cost Escalation (MSCE)** or **Reciprocal Sunk Cost Entrapment**.

  Here's a breakdown of why this fits and how it relates to your questions:

  1.  **Core Mechanism: The Sunk Cost Fallacy on Steroids:** At its heart, this is the sunk cost fallacy ("We've invested too much to quit now"). However, it's not just individual; it's *mutually reinforcing*.
      *   **Your Brother's Spending Raises the Value for You:** His continued investment (time, money, emotion) signals to you that *he* believes the outcome is worth fighting for. This unconsciously validates *your* commitment and inflates your own perception of what's at stake ("If he's willing to spend *that* much, it *must* be incredibly important not to lose to him"). Your spending does the same for him. This creates a feedback loop where each party's expenditure actively increases the perceived value of "winning" (avoiding loss of face/conceding) for the other.
      *   **The "Prize" Becomes Avoiding Loss of Face:** The original object (the house) loses its intrinsic value. The true "prize" becomes not the object itself, but the *avoidance of the psychological cost of being the one who capitulated after such a massive joint investment*. Winning means not having to admit that all that expenditure was for nothing *specifically because you gave up*. This perceived psychological cost escalates dramatically with every dollar spent by either side.

  2.  **Distinguishing from Dollar Auction:**
      *   **Dollar Auction:** Fixed prize ($1), loser pays their bid, winner gets the prize minus their bid. Rational bidding quickly exceeds the prize value due to the desire to avoid being the loser who pays and gets nothing.
      *   **Your Situation (MSCE):** No fixed prize. The intrinsic prize (house) is unwanted. The *psychological prize* (avoiding capitulation) has *escalating value* driven by *both* parties' sunk costs. There's no formal "loser pays" rule; stopping simply means accepting the sunk costs are lost *and* admitting defeat in the contest of wills. The trap is the **mutual inflation of perceived stakes**, not the avoidance of a specific loser penalty tied to the bidding structure.

  3.  **Distinguishing from Standard Escalation of Commitment:**
      *   **Standard Escalation:** Typically involves justifying *past decisions* ("I chose this project, so I must keep funding it to prove I was right"). It often involves individual or organizational commitment to a failing course of action.
      *   **Your Situation (MSCE):** The commitment isn't primarily to defend a past *choice* (neither chose the quarrel). It's commitment to *avoiding the psychological cost of capitulation* after massive *joint* investment. The escalation is fueled by the *other party's* continued commitment, which validates the importance of the struggle. It's **interpersonal escalation driven by reciprocal sunk cost validation**.

  4.  **Key Features of Mutual Sunk Cost Escalation (MSCE):**
      *   **Two or More Parties:** Essential. The mutual reinforcement is the core driver.
      *   **High, Irrecoverable Sunk Costs:** Time, money, emotion, reputation invested by *both* sides.
      *   **Intrinsic Value of Object < Sunk Costs:** The original point of contention is worth less than what's been spent.
      *   **No Direct Forfeit for Stopping:** Stopping doesn't trigger an additional penalty *beyond* losing the sunk costs and accepting defeat (unlike the Dollar Auction's loser penalty). The forfeit is purely psychological.
      *   **Escalating Perceived Stakes:** The perceived value of "winning" (avoiding capitulation) increases for each party as *both* continue to invest. Each party's investment signals to the other that the struggle is critically important.
      *   **Transformation of the Prize:** The contest shifts from being about the original object/goal to being about **dominance, saving face, or avoiding the admission that the massive joint expenditure was pointless**.
      *   **Mutual Trap:** Neither can win cheaply (victory requires overcoming the other's escalating commitment). Neither can abandon cheaply (abandonment means accepting the sunk costs are lost *and* admitting defeat in the contest).

  5.  **Answers to Your Specific Questions:**
      *   **Fixed Market Value?** Yes, the pattern survives. The house *has* a fixed market value, but it becomes irrelevant. MSCE thrives when the *psychological stakes* decouple from the object's intrinsic value and inflate based on sunk costs. The company example also involves systems with calculable costs, but the contest becomes about departmental survival/dominance.
      *   **One Party?** No. The *mutual* reinforcement is essential. An individual can fall prey to the sunk cost fallacy, but the dynamic where *your opponent's spending increases your own perceived stakes* requires at least two parties locked in the conflict.
      *   **Distinction from Mere Attrition ("Waiting to Tire"):** In pure attrition, the value of the prize remains constant; it's a test of endurance. In MSCE, the *value of winning the contest itself* escalates as costs mount. Giving up later feels *worse* than giving up earlier, not just because you spent more, but because your opponent's continued spending has signaled that capitulating *now* would be an even greater loss of face. It's the **inflation of the psychological cost of quitting** that distinguishes it.
      *   **Is it Just Stubbornness?** No, it's more complex. Stubbornness is a component, but MSCE provides a powerful *psychological mechanism* (the sunk cost fallacy amplified reciprocally) that fuels and justifies that stubbornness beyond simple obstinacy. The massive sunk costs create a narrative where quitting feels like an irrational surrender of everything invested *and* a personal defeat, rather than a rational acceptance of reality. It's stubbornness supercharged by a shared, self-reinforcing cognitive trap.

  **Conclusion:** You've described **Mutual Sunk Cost Escalation (MSCE)**. It's distinct from the Dollar Auction (lacks fixed prize/loser penalty structure) and standard Escalation of Commitment (lacks the primary need to defend a past decision, emphasizes mutual reinforcement). The critical features are the **reciprocal inflation of perceived stakes** driven by each party's sunk costs, transforming the contest into one where the only "prize" is avoiding the escalating psychological cost of capitulation. Recognizing this trap is the first step towards breaking it – perhaps by jointly acknowledging the sunk costs are gone regardless and reframing disengagement as mutual rationality rather than individual defeat.
