  ### Decision Procedure for Product Notifications  
  **Version for Case Officers (One-Page Summary)**  

  #### **Step 1: Completeness Check**  
  - **Question:** Is the notification complete per regulatory requirements?  
  - **Sufficient Answer:** All required data fields filled, key studies attached, and exposure scenarios specified.  
  - **Termination:** If **NO**, refuse notification (incomplete).  
  - **Proceed:** If **YES**, to Step 2.  

  #### **Step 2: Hazard Identification**  
  - **Question:** Is there a *plausible mechanism* by which the product could cause serious (e.g., life-threatening, severe disability) or irreversible harm (e.g., permanent ecological disruption, extinction)?  
  - **Sufficient Answer:** **YES** if:  
    - Mechanistic data (e.g., in silico, in vitro), *or*  
    - Structural similarity to a restricted substance, *or*  
    - Peer-reviewed theory indicating harm.  
  - **Termination:** If **NO**, proceed to Step 3.  
  - **Proceed:** If **YES**, to Step 3.  
  - *Precautionary Principle (PP) Reading:* PP justifies acting on mechanistic plausibility alone if harm is irreversible.  

  #### **Step 3: Evidence Assessment**  
  - **Question:** Is there *supporting evidence* beyond mechanism indicating potential for serious/irreversible harm?  
  - **Sufficient Answer:**  
    - **For irreversible harm:** **YES** with *one line* of evidence (e.g., animal study, computational model, epidemiological analog).  
    - **For reversible harm:** **YES** with *two independent lines* (e.g., animal + in vitro; model + structural alert).  
    - *Threshold Choice:* Irreversible harm lowers evidence threshold (policy choice: precaution favors action).  
  - **Termination:** If **NO**, conclude **no restriction** (insufficient evidence).  
  - **Proceed:** If **YES**, to Step 4.  
  - *PP Reading:* PP does not require full certainty; weak evidence suffices for irreversible harm.  

  #### **Step 4: Uncertainty and Reasonable Concern**  
  - **Question:** Considering evidence quality and uncertainties, are there *reasonable grounds for concern*?  
  - **Sufficient Answer:** **YES** if:  
    - Harm is scientifically plausible (not speculative), *and*  
    - Uncertainty means harm *cannot be ruled out* with high confidence.  
  - **Termination:** If **NO**, conclude **no restriction** (concern unfounded).  
  - **Hand-Up:** If **UNSURE**, escalate (uncertainty vs. evidence balance involves values).  
  - **Proceed:** If **YES**, to Step 5.  
  - *PP Reading:* PP triggers at "reasonable concern," not proof.  

  #### **Step 5: Irreversibility Check**  
  - **Question:** Would the harm, if it occurs, be *irreversible*?  
  - **Sufficient Answer:** **YES** if harm:  
    - Persists >25 years post-exposure (e.g., genetic contamination, species loss), *or*  
    - Cannot be mitigated (e.g., cross-border pollution).  
    - *Threshold Choice:* 25-year cutoff is policy (irreversibility decisive).  
  - **Proceed:**  
    - If **YES**, skip Step 6 (no risk-benefit), go to Step 7.  
    - If **NO**, to Step 6.  

  #### **Step 6: Risk-Benefit (Reversible Harm Only)**  
  - **Question:** Do the product’s benefits *clearly outweigh* risks?  
  - **Sufficient Answer:** **NO** if:  
    - Risks are significant (probability/severity high), *and*  
    - Alternatives exist or benefits are marginal.  
  - **Hand-Up:** **ALWAYS** escalate (weighing benefits vs. risks is value-laden; not purely scientific).  
  - **Proceed:**  
    - If benefits **clearly outweigh**, **terminate with no restriction**.  
    - Else, to Step 7.  
  - *Note:* Statute does not require this step; added to avoid over-precaution.  
  - *PP Reading:* PP alone cannot resolve trade-offs; avoids "inaction bias."  

  #### **Step 7: Proportionality Assessment**  
  - **Question:** Is there a *proportionate restriction* (least burdensome measure addressing concern)?  
  - **Sufficient Answer:** **YES** if restriction:  
    - Targets specific risks (e.g., ban in sensitive uses, not full prohibition), *and*  
    - Considers alternatives/substitutes (availability and risks), *and*  
    - Does not create greater harm (e.g., unsafe substitutes).  
  - **Hand-Up:** If trade-offs involve societal values (e.g., economic impact), escalate.  
  - **Termination:**  
    - If **YES**, draft **restriction decision** (specify measure).  
    - If **NO**, conclude **no restriction** (measure disproportionate).  
  - *PP Reading:* PP requires proportionality; not a blank check for bans.  

  #### **Final Step**  
  - Case officer drafts decision with reasoning, documents file, and sends to director for signature.  
  - **File Version:** Expands on evidence, thresholds, uncertainties, and proportionality logic.  

  ---  
  ### Case Applications  
  **Case (a): Flame Retardant for Children’s Mattress Foam**  
  - **Mechanism:** Plausible (structural similarity to restricted compound).  
  - **Evidence:** One small rodent study + structural alert. Harm is irreversible (carcinogen).  
  - **Step 3:** **YES** (irreversible harm threshold met with one line).  
  - **Step 4:** Reasonable concern (uncertainty high; cannot rule out harm).  
  - **Step 5:** Irreversible → Skip Step 6.  
  - **Step 7:** Restriction proportionate? Alternatives poorly characterized; partial ban (e.g., "not in children’s products") may be viable. **Hand-up** (values: trade-offs of substitute risks).  
  - **Outcome:** Likely restriction (targeted ban).  

  **Case (b): Self-Replicating Engineered Soil Microbe**  
  - **Mechanism:** Plausible (models show potential for ecosystem disruption).  
  - **Evidence:** Model-based only. Harm irreversible (permanent contamination, cross-border).  
  - **Step 3:** **YES** (irreversible harm threshold met with one line).  
  - **Step 4:** Reasonable concern (models are uncertain but plausible; harm cannot be ruled out).  
  - **Step 5:** Irreversible → Skip Step 6.  
  - **Step 7:** Restriction proportionate? No effective mitigation if released; alternatives (e.g., non-engineered microbes) exist. Ban is least burdensome. **No hand-up** (scientific determination).  
  - **Outcome:** **Restriction (ban)**. Aligns with your prior.  

  **Case (c): Drinking-Water Treatment**  
  - **Mechanism:** Plausible (produces known carcinogenic by-product).  
  - **Evidence:** By-product well-characterized. Harm reversible? (Carcinogens are irreversible, but exposure stoppable).  
  - **Step 3:** **YES** (two lines: mechanistic + by-product data).  
  - **Step 4:** Reasonable concern (by-product risk established).  
  - **Step 5:** **NO** (harm reversible if exposure ends).  
  - **Step 6:** **Hand-up** (risk-benefit: removes suspected carcinogen; benefits likely outweigh risks).  
  - **Outcome:** Senior panel likely approves **no restriction** (net benefit).  

  ---  
  ### Limitations and Risks  
  **What the Procedure Cannot Do:**  
  1. **Resolve fundamental scientific gaps:** Relies on existing data; cannot commission new studies.  
  2. **Quantify "reasonable concern":** Thresholds (e.g., evidence quality, irreversibility) are policy choices, not scientific facts.  
  3. **Eliminate value judgments:** Steps 6–7 require senior input to avoid case officers imposing personal biases.  
  4. **Address all trade-offs:** Cannot autonomously balance broad societal impacts (e.g., economic costs).  

  **Where Misuse May Occur:**  
  1. **Step 4 (Reasonable Concern):** Officers may overstate/understate uncertainty to justify a preferred outcome.  
  2. **Step 7 (Proportionality):** May "launder" values as science (e.g., claiming a ban is "obviously" proportionate without escalation).  
  3. **Threshold Arbitrariness:** Case officers could manipulate irreversibility (Step 5) or evidence standards (Step 3) to force a decision.  

  **Safeguards:**  
  - Hand-up points force transparency on values.  
  - File version requires explicit justification for thresholds.  
  - Director review ensures consistency.  

  ---  
  **Conclusion:** The procedure defensibly embeds precaution by lowering evidence thresholds for irreversible harm (per statute) but forces explicit trade-offs via hand-ups. It blocks "inaction bias" by requiring risk-benefit review for reversible harms and survives court review through documented proportionality. Case (b) triggers restriction due to irreversibility, as desired.
