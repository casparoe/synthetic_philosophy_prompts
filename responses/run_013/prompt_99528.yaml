prompt: |-
  I lead the assessment unit at a national agency that must authorise chemicals and biological products before they are sold or released, and I need a written decision procedure my case officers can run when a notification arrives. Our statute permits us to restrict a product where there are reasonable grounds for concern that it could cause serious or irreversible harm, and it states that a lack of full scientific certainty is not by itself a reason to postpone protective measures; it also requires that any restriction be proportionate and that we publish reasons a court can review. We see roughly forty notifications a year on a six-week statutory clock, with no budget for new testing and with most of the underlying studies funded by the notifier. My officers are competent scientists rather than philosophers, and my director signs the final decision.

  Write the procedure: the questions in order, what counts as a sufficient answer to each, the points at which the process terminates in a decision (including termination in refusal), and the points at which it must be handed up because the answer turns on values rather than evidence. It has to preserve whatever is genuinely defensible in the precautionary principle without collapsing into a general injunction to be careful, and it has to survive the objection that protective measures carry risks of their own, so that the principle cannot by itself select action over inaction. Where the procedure must fix a threshold — how much evidence, how much uncertainty, how much irreversibility — say so plainly and mark it as a choice rather than a finding. Note which reading of the principle each step presupposes, and flag any step that goes beyond what our statute actually requires. The case officer's version should fit on one page; the version that goes into the file can spell out the reasoning.

  Then run it on three cases: (a) a flame retardant proposed for children's mattress foam, supported by a plausible mechanism, a single small rodent study and structural similarity to a compound we already restrict, with substitutes that are themselves poorly characterised; (b) a self-replicating engineered soil microbe for nitrogen fixation, whose harms, if they materialised, would be irreversible and would cross borders, and for which the evidence is entirely model-based; (c) a drinking-water treatment that removes a suspected carcinogen but produces a better-characterised disinfection by-product.

  I will be candid about my priors: I want the procedure to come out against (b), because I think irreversibility should be decisive. If a procedure I could actually defend before a reviewing court does not get me there, I need to know that now.

  Finally, state what the procedure cannot do, and where a case officer will be tempted to use it to launder a decision that was reached on other grounds.
reasoning: |-
  We are creating a decision procedure for the assessment unit of a national agency. The procedure must:
  1. Be based on the statute that permits restrictions on products where there are "reasonable grounds for concern" about serious or irreversible harm, without requiring full scientific certainty.
  2. Require that restrictions be proportionate and that reasons be publishable for court review.
  3. Handle about 40 notifications per year on a 6-week clock, with no budget for new testing and relying on notifier-funded studies.
  4. Be usable by competent scientists (not philosophers) and fit on one page for the case officer, with a more detailed version for the file.
  5. Preserve the defensible core of the precautionary principle without being a vague injunction to be careful.
  6. Account for the fact that protective measures (including restrictions) carry their own risks, so the principle alone cannot always favor action over inaction.

  The procedure must have:
  - Ordered questions with clear sufficiency criteria.
  - Termination points (including refusal) and hand-up points (when the answer turns on values).
  - Clearly marked thresholds (as choices, not findings) for evidence, uncertainty, and irreversibility.
  - Notes on the reading of the precautionary principle at each step and any steps going beyond the statute.

  We then run it on three cases and note what the procedure cannot do and where it might be misused.

  ---

  **Procedure Design:**

  We structure the procedure as a flowchart of questions. The goal is to determine if there are "reasonable grounds for concern" that the product could cause serious or irreversible harm, and if so, whether a proportionate restriction is warranted.

  **Key Concepts:**
  - **Reasonable grounds for concern**: A level of evidence that is more than mere speculation but less than conclusive proof. It requires a plausible scientific basis (e.g., mechanistic understanding, positive animal studies, structural alerts, or model predictions) that indicates a potential for harm.
  - **Serious harm**: Harm that causes death, severe injury, or significant damage to health or the environment.
  - **Irreversible harm**: Harm that cannot be reversed within a reasonable time frame (e.g., extinction, permanent ecosystem disruption, persistent pollution).
  - **Proportionality**: The restriction must be the least burdensome measure that effectively addresses the identified concern, considering the availability of alternatives and the overall benefit of the product.

  **Thresholds (set as choices, to be determined by policy, not science):**
  1. **Evidence threshold for concern**: We require at least two independent lines of evidence (e.g., mechanistic, in silico, in vitro, animal, epidemiological) OR one strong line of evidence (e.g., a well-conducted animal study showing harm at relevant exposures) plus a plausible mechanism. If the harm is irreversible, we lower the threshold to one line of evidence if that evidence is of high quality and the mechanism is plausible. (This is a policy choice: we are more precautionary for irreversible harm.)
  2. **Uncertainty threshold**: We act when the uncertainty is such that we cannot rule out the possibility of serious or irreversible harm with reasonable confidence. We do not require full certainty, but we require that the concern is scientifically plausible and not based on pure conjecture.
  3. **Irreversibility threshold**: We consider harm irreversible if the effects would persist for more than one human generation (about 25 years) despite cessation of exposure, or if the harm would be permanent (e.g., extinction, genetic contamination). (Policy choice: we are more precautionary for irreversible harm.)

  **Procedure Steps (for the one-page case officer version):**

  1. **Preliminary Check**: Is the notification complete? (Required data as per regulations.) If not, request additional information (within statutory time limits) or terminate with refusal. [Termination: Refusal due to incomplete application.]

  2. **Hazard Identification**: Is there a plausible mechanism by which the product could cause serious or irreversible harm? 
     - *Sufficient answer*: Yes, if supported by scientific literature, structural similarity to known harmful substances, or mechanistic studies (even if not conclusive). If no, go to step 3. If yes, proceed.

  3. **Evidence Assessment**: Is there evidence (beyond the mechanism) that the product could cause serious or irreversible harm? 
     - *Sufficient answer*: We require at least one additional line of evidence (e.g., in vitro, animal, or model-based evidence) that indicates harm. If the harm is potentially irreversible, we accept one line of evidence if it is of high quality. If the harm is serious but reversible, we require two independent lines of evidence or one strong line (e.g., a well-conducted animal study at relevant exposure levels). If no evidence, terminate with no restriction. [Termination: No restriction.] If evidence exists, proceed.

     *Note*: If the evidence is entirely model-based and the harm is reversible, we may require more than one model or independent validation. For irreversible harm, we accept a single model if it is well-validated and the assumptions are reasonable.

  4. **Uncertainty and Reasonable Concern**: Considering the evidence and the uncertainties, are there reasonable grounds for concern that the product could cause serious or irreversible harm?
     - *Sufficient answer*: Yes, if the evidence (from steps 2 and 3) meets the thresholds and the uncertainty is such that we cannot dismiss the concern as highly improbable. We do not require full certainty. If no, terminate with no restriction. [Termination: No restriction.] If yes, proceed.

     *Note*: This step requires judgment. If the case officer is unsure, they must hand up for review by a senior panel (because it involves weighing the level of uncertainty and the nature of harm).

  5. **Irreversibility Check**: Is the potential harm irreversible? 
     - *Sufficient answer*: Yes, if the harm would persist for more than 25 years or is permanent (e.g., genetic contamination, extinction). If the harm is reversible, proceed to step 6. If irreversible, we skip step 6 and go to step 7 (because we are more precautionary and less willing to accept risk).

  6. **Reversible Harm - Risk-Benefit Consideration**: For reversible harm, do the benefits of the product outweigh the risks? 
     - *Sufficient answer*: We consider the severity and probability of harm, the availability of alternatives, and the benefits of the product. If the benefits clearly outweigh the risks (e.g., life-saving medical product with no alternatives and low risk), then we may decide not to restrict. But if the risks are significant and the benefits are marginal, we proceed. This step requires hand-up to a senior panel because it involves value judgments about societal benefits and acceptable risk. [Hand-up point.]

  7. **Irreversible Harm or Unfavorable Risk-Benefit for Reversible Harm**: We must consider restrictions. Now, is there a proportionate restriction? 
     - *Sufficient answer*: A restriction is proportionate if it is the least burdensome measure that effectively addresses the concern. We consider:
          a. The availability of safer alternatives (if readily available and effective, a ban may be proportionate; if not, a partial restriction or labeling may be more appropriate).
          b. The feasibility of monitoring and mitigation.
          c. The potential harm from the restriction itself (e.g., if the alternative is worse, then the restriction may not be proportionate).

     This step requires hand-up if the proportionality assessment involves significant value judgments (e.g., economic impacts, societal preferences) because it is beyond the scientific expertise of the case officer. [Hand-up point for values.]

  8. **Decision**: 
     - If a proportionate restriction is identified, then the case officer drafts a decision to restrict (with the specific measure) and sends it to the director for signature. 
     - If no proportionate restriction can be found, then the case officer must hand up the case to a senior panel for further consideration (because the statute requires a restriction only if proportionate, and if no such measure exists, we may have to allow the product but with conditions or monitoring). However, note that the statute permits restrictions only when proportionate. Therefore, if no proportionate restriction is available, we may have to decide not to restrict, but with additional monitoring requirements if legally permissible.

     *Note*: The case officer must document the reasoning for the file, including the evidence, uncertainties, and the analysis of proportionality.

  **Hand-up points** (to a senior panel or the director, because they involve value judgments or policy decisions beyond science):
  - Step 4: If the case officer is uncertain about whether there are "reasonable grounds for concern" (because it involves interpreting the level of uncertainty and the nature of harm).
  - Step 6: For reversible harm, when balancing risks and benefits.
  - Step 7: When determining the appropriate restriction and its proportionality (if it involves trade-offs that are not purely scientific).

  **Termination points**:
  - Step 1: Termination with refusal (incomplete application).
  - Step 3: Termination with no restriction (insufficient evidence).
  - Step 4: Termination with no restriction (no reasonable grounds for concern).

  **Precautionary Principle Interpretation**:
  - Steps 2 and 3: We are applying the principle by requiring less than full certainty for evidence of harm, especially for irreversible harm.
  - Step 5: For irreversible harm, we are more precautionary (by skipping the risk-benefit step and moving to restrictions).
  - Step 6: For reversible harm, we allow a risk-benefit analysis (which is a common limitation of the precautionary principle to avoid over-precaution).

  **Beyond Statute?** The statute does not explicitly require a risk-benefit analysis for reversible harm, but it requires proportionality. Our step 6 for reversible harm is a way to ensure that restrictions are not imposed when the benefits clearly outweigh the risks, which is part of proportionality. However, note that the statute only requires proportionality of the restriction, not a full risk-benefit analysis for allowing the product. We have introduced step 6 to avoid unnecessary restrictions when the product has high benefits and low risks. This may be seen as going beyond the statute, but it is defensible as part of the overall proportionality assessment.

