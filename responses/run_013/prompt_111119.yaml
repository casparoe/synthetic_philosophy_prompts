  - The unconditional duty of veracity as a categorical imperative
  - Lying as inherently wronging humanity (not just individuals)
  - Strict causal responsibility for unintended consequences of lying

  The safety invariant analogy seems promising here - treating truth-telling as a hard constraint that must hold in all system states. But I notice immediate tension points: Kant's absolute prohibition clashes with the conditional nature of most engineering constraints that allow exceptions within defined ODDs. 

  For the residue analysis, three key aspects need careful handling:
  1) The "wronging humanity" concept - is this like violating a safety invariant without immediate hazard? Probably not, since Kant's claim is deontological, not risk-based. 
  2) Responsibility attribution - Kant goes beyond causal chains to emphasize the agent's role in corrupting the "fabric of communication". This feels distinct from typical fault tree analysis.
  3) The rule-utilitarian question - must show how Kant's position differs fundamentally from consequentialist reasoning, perhaps by contrasting with performance objectives.

  The translation will inevitably leave some residue. For instance, Kant's metaphysical claims about "humanity" may not map cleanly to system engineering concepts. But the responsibility framework provides useful parallels - especially how introducing falsehoods creates new failure modes.

