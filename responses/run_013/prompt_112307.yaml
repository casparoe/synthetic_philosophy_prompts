prompt: |-
  Trying to get my head around the Principal Principle and I keep tying myself in knots. As I understand it, the PP says my credence in an event should equal the objective chance of that event. I also read somewhere (Lewis, I think) that objective chances aren't some extra ingredient in the world, they're just the probabilities that show up in the best systematization of the world's total history. But take a coin I'm about to flip 100 times: the best system is going to say the chance of heads is 0.5 on every flip, while the world's history only ever contains one actual run — say 47 heads out of 100. So should my credence in heads on the first flip be 0.5, or 0.47? And if the chance is really just whatever run occured, doesn't the PP tell me to match my credence to something I can't even see yet? What's the move I'm missing here?
reasoning: |-
  Okay, the user is struggling with the Principal Principle (PP) and how objective chances relate to actual frequencies. Let me start by recalling what the PP states: it links subjective credence to objective chance. The user mentions Lewis's view that chances come from the best systematization of the world's history, not as an extra ingredient. 

  The coin flip example is central here. The user sees a tension between the chance (0.5) and the actual outcome (47 heads). Their confusion is whether to set credence to 0.5 or 0.47. They also worry that if chance is based on the actual history, which includes only one sequence, then the PP requires knowing the future to set credence now. 

  First, I need to clarify Lewis's Best System Account (BSA). Chances aren't just frequencies; they're part of a system that balances simplicity, strength, and fit. For coin flips, the 0.5 chance comes from a simple law that fits most outcomes. The actual 47/100 is a specific outcome, not the chance. 

  The user might be conflating chance with actual frequency. The PP uses the objective chance at the time of the event. At flip one, the chance is 0.5, regardless of future outcomes. The credence should be 0.5. The actual frequency is the result after all flips, but it doesn't dictate the chance per flip. 

  The deeper issue might be understanding how chances are time-dependent and why they don't reduce to frequencies. The user needs to see that the best system uses frequencies to set chances, but the chance value is fixed before the outcome. Also, the PP requires current chance, not future frequencies. 

  I should explain how fit works: the system rewards assigning higher probabilities to actual outcomes. So 0.5 fits better if most sequences have around 50% heads. Even if one run is 47%, the 0.5 chance still fits well across all possible sequences. 

  The user's struggle is common when learning BSA. Emphasizing the distinction between chance (theoretical) and actual outcome (empirical) should help. Reinforce that PP defers to the best system's chance at the time, not the outcome.
answer: |-
  You've hit on a core tension in the philosophy of probability, brilliantly pinpointing the challenge Lewis sought to solve with his "Best System Account" (BSA) of chance. Here's how to untie the knots:

  1.  **The Principal Principle (PP) is Primary:** Your first understanding is correct. *If you know the objective chance of an event E* at time T is *ch(E) = x*, then your rational credence *Cr(E)*, conditional on that knowledge *and no other inadmissible information*, should be *x*.
      *   **Crucial Point:** The PP tells you to defer to the *current, objective chance*. It doesn't tell you to defer to the *future relative frequency*.

  2.  **Lewis's Best System Account (BSA) Defines Chance:** Lewis's insight is that "objective chance" isn't a mysterious, extra metaphysical substance. It's a feature derived from the patterns in the complete history of the universe (H) up to the present moment. The "best system" is the best way to describe H using probabilistic laws. "Best" means:
      *   **Strength:** How much of H does the system describe/predict?
      *   **Simplicity:** How concise/elegant is the system?
      *   **Fit:** How well do the probabilities assigned by the system match the actual frequencies found in H? (Systems get higher "fit" scores when they assign higher probabilities to events that *actually happened*.)

  3.  **Applying BSA to Your Coin Flips:**
      *   **The Complete History (H):** Includes the physical setup of the coin (fair? biased?), the flipping mechanism, the air currents, the landing surface, *and the outcomes of all previous flips of similar coins in similar setups* (or, more broadly, relevantly similar events).
      *   **The Best System:** Given the enormous amount of data in H showing that well-made coins flipped fairly land heads roughly 50% of the time *across vast numbers of trials*, the best system will include a probabilistic law: "For any fair coin flip, *ch(Heads) = 0.5*". This law is:
          *   **Strong:** It applies broadly to a huge class of events.
          *   **Simple:** It's a single, concise number.
          *   **High Fit:** It assigns high probability (0.5) to each flip outcome *which actually occurred roughly 50% of the time overall* in H. It fits the long-run pattern.

  4.  **Addressing Your Specific Questions:**

      *   **"Should my credence be 0.5 or 0.47?"** Your credence *at the start* (before any flips occur) *should be 0.5*.
          *   **Why?** The PP tells you to set `Cr(Heads on flip 1 | ch(Heads on flip 1) = 0.5 & no inadmissible info) = 0.5`.
          *   The BSA tells you that the objective chance *ch(Heads on flip 1) is indeed 0.5*, based on the *entire prior history of relevant events (H)* encoded in the best system. The future outcome of *this specific run* (47 heads) is *inadmissible information* for setting your credence *before the run happens*. You don't know it yet, and crucially, *it's not part of the history H used to define the current chance*.

      *   **"The world's history only ever contains one actual run - say 47 heads out of 100."** This is the key knot to untie.
          *   **Mistake:** You are thinking *only* about the history of *this specific set* of 100 flips. But the BSA uses the *complete history of the world (H) up to now*. This history includes *vast amounts of data* about *other* coin flips, the physics of flipping, symmetries in coin design, etc.
          *   **The Single Run Doesn't Define Chance:** The fact that *this particular* sequence ended up with 47 heads is *just one data point*. The best system looks at the *overall pattern* across *all* relevant data in H. The overwhelming pattern is 50%. The law `ch=0.5` has incredibly high fit *overall* because it assigned high probability to the vast majority of past flip outcomes.
          *   **Time Dependence:** The chance *at the moment before flip 1* is defined by H *up to that moment*. H at that moment *does not* include the outcomes of flips 1-100! The outcomes of flips 1-100 become part of the history *later*, which future agents might use to define chance for *their* future events. Chance is time-dependent.

      *   **"If the chance is really just whatever run occurred..."** This misstates the BSA.
          *   **Chance is NOT the actual frequency of a single run.** The BSA defines chance based on the *best overall systematization* of the *entire world history up to the present*, weighing strength, simplicity, and fit across *all* relevant events. A single run with 47 heads is *compatible* with `ch=0.5` – it's a slightly low but entirely probable outcome under that chance hypothesis. The system `ch=0.5` fits the *totality* of coin flip data in H far better than a system that tried to assign a different chance (`ch=0.47`) *specifically for this one run* before it happened. A system with `ch=0.47` just for your run would be incredibly complex (needing to identify your specific run uniquely) and weak (not applying broadly), outweighing any minor gain in fit for this one run.

      *   **"Doesn't the PP tell me to match my credence to something I can't even see yet?"** No, it tells you to match your credence to the *current objective chance*, which is a feature *of the present world history* (as systematized). You *can* know the current objective chance (or have good evidence for it) *before* the event happens, based on the best scientific theories (which are themselves justified by the patterns in H). You know `ch=0.5` for a fair coin flip because physics and statistics, grounded in vast amounts of past data, tell you so.

  **The Move You're Missing: Temporal Indexing and the Scope of History**

  *   **Chance is time-indexed:** `ch_t(E)` is the chance *at time t* of event E. The PP tells you to set your credence based on `ch_t(E)` *when t is the current time*.
  *   **History is cumulative but time-limited:** The history H used to define the best system, and thus `ch_t(E)`, is the history *up to time t*. It does *not* include events after t. The outcomes of your 100 flips happen *after* the time when you are setting your credence for flip 1. They are not part of H *at that time*.
  *   **Chance reflects patterns, not single instances:** The best system's probabilities reflect *robust, general patterns* within the entire history H, not the idiosyncratic outcome of one specific future sequence. The pattern of 50% heads is the robust one evident in H. The single run of 47% is just a minor fluctuation within that pattern.

  **In Summary:** Your credence for heads on flip 1 *before any flips* should be 0.5. This is because:
  1.  The PP mandates deference to the *current objective chance*.
  2.  The BSA defines that current objective chance (`ch=0.5`) as a feature of the best systematization of the *entire world history up to the present moment* (which includes vast evidence for coin symmetry and 50% frequencies, but *not* the outcomes of your future flips).
  3.  The actual outcome of your specific run (47 heads) is future, inadmissible information when setting your initial credence, and does not define the objective chance *before* the flips occur. It's merely a single outcome consistent with `ch=0.5`.

  You're wrestling with the fundamental distinction between **objective chance** (a theoretical, time-indexed probability derived from the total past history via the best system) and **actual relative frequency** (the concrete outcome of a specific, finite sequence of events). The PP tells you to use the first one to set your credence *before* the event. The BSA explains what the first one *is* and why it's not simply the second one.
