answer: |-
  Below is a mapping of the OPERA affair onto the three standard interpretations of probability. For each, I address: (1) what the six-sigma significance *actually referred to*, (2) what the collaboration was entitled to conclude, (3) how the community’s skepticism appears within that framework, (4) the specific limitation ("where it runs out"), and (5) whether the episode discriminates among interpretations. The analysis assumes familiarity with the sequence of events.

  ---

  ### 1. **Frequentism**  
  **What the significance meant**:  
  The six-sigma (p ≈ 3 × 10⁻⁹) quantified the probability of observing data *at least as extreme* as OPERA’s result, *assuming the null hypothesis* (no superluminal neutrinos) was true and all statistical errors were random. It referenced a long-run frequency: if identical experiments were repeated infinitely under the same conditions, such a deviation would occur by random chance alone roughly once per billion trials.  

  **Entitled conclusion**:  
  OPERΑ could only reject the null hypothesis with extreme confidence. They were *not* entitled to claim "faster-than-light neutrinos exist," but only that the data was statistically incompatible with Lorentz invariance under their error model. Reporting the anomaly as requiring scrutiny was defensible.  

  **Community skepticism**:  
  Rational, as frequentism ignores prior evidence. The community treated OPERA’s result as a Type I error (false positive) in progress. Given overwhelming prior empirical support for Lorentz invariance (e.g., from particle accelerators, cosmic rays), the base rate for such a violation was deemed negligible. Skepticism reflected the view that an unmodeled error was more probable than the anomaly.  

  **Where it runs out**:  
  Frequentism cannot distinguish between **random error** (quantifiable noise) and **misdescribed apparatus** (e.g., the loose fibre-optic cable). The p-value assumed all errors were captured by the statistical model. When the flaw was identified, it exposed a *systematic* error outside the random-error reference class—rendering the initial significance moot.  

  ---

  ### 2. **Subjectivism (Bayesian)**  
  **What the significance meant**:  
  The six-sigma entered as a *likelihood*: P(data | null hypothesis). This updates a prior belief, P(null), to a posterior, P(null | data). Crucially, the likelihood alone is meaningless without the prior. OPERA’s result made the data highly improbable *if* Lorentz invariance held, but did not directly quantify P(violation | data).  

  **Entitled conclusion**:  
  OPERΑ could state that the data *strongly updated* the odds against the null hypothesis, but final conclusions depended on the prior. Given their expertise, they were entitled to assign a low prior to Lorentz violation (P(violation) ≈ 10⁻¹⁰ or less) but a higher prior to experimental error. Thus, they correctly invited scrutiny: the posterior likely still favored an unmodeled error.  

  **Community skepticism**:  
  Inevitable and rational. The community’s prior for Lorentz violation was infinitesimal (based on centuries of concordant evidence), while their prior for experimental flaws—even in careful setups—was non-negligible (e.g., P(flaw) ≈ 10⁻²–10⁻³). Combining strong likelihood with a crushing prior, P(violation | data) remained tiny. Skepticism was Bayesian updating in action: "Extraordinary claims require extraordinary evidence" formalized.  

  **Where it runs out**:  
  Subjectivism requires specifying a **prior over Lorentz violation**, which is inherently subjective and unconstrained by data. Worse, it cannot model **unanticipated errors** (like the fibre-optic link) not included in the prior hypothesis space. The likelihood assumed all error sources were known; the flaw was a "unknown unknown," breaking the Bayesian machinery.  

  ---

  ### 3. **Propensity**  
  **What the significance meant**:  
  The six-sigma measured the *propensity* of OPERA’s experimental setup to produce such a deviation *due to inherent stochastic processes*. It framed the result as arising from a physical disposition (e.g., quantum noise, random fluctuations in electronics) embedded in the apparatus.  

  **Entitled conclusion**:  
  OPERΑ could claim their apparatus had a near-zero propensity to generate the result by chance *if Lorentz invariance held*. This justified announcing an anomaly. However, propensity could not distinguish between a genuine physical propensity (neutrinos faster than light) and a flawed experimental propensity (e.g., a cable glitch).  

  **Community skepticism**:  
  Rooted in competing propensities. The wider community saw OPERA’s setup as having a high propensity for undetected systematic errors (based on history of complex experiments), while the universe’s propensity for Lorentz violations was judged negligible. Skepticism reflected trust in the *propensity of established physics* over a single experiment’s output.  

  **Where it runs out**:  
  Propensity collapses without a clear **reference class**. Was the propensity tied to *this specific apparatus*, neutrino experiments generally, or physical law? The loose cable was a singular fault—not a probabilistic propensity but a deterministic flaw. Propensity interpretations cannot accommodate unique, non-repeatable failures.  

  ---

  ### Reverse Analysis: Do Interpretations Discriminate?  
  **No, the episode does not meaningfully discriminate** among the interpretations. Each provided a consistent *post hoc* rationale for:  
  - OPERA’s cautious announcement (rejecting the null / updating likelihoods / identifying low-chance propensities),  
  - The community’s skepticism (ignoring base rates / low priors / competing propensities),  
  - The ultimate failure (unmodeled systematics / excluded hypotheses / non-probabilistic flaws).  

  **Differences are in bookkeeping, not action**:  
  - **Frequentists** focused on error rates under repetition.  
  - **Subjectivists** emphasized prior beliefs.  
  - **Propensitists** cited dispositions of systems.  
  Yet all justified the same behaviors: reporting anomalies, demanding replication, and suspecting errors over new physics. The core issue—**distinguishing random noise from misdescribed reality**—transcends interpretations. The OPERA affair exposed that all frameworks:  
  1. Depend on *correctly modeled* error sources,  
  2. Fail catastrophically when reality includes unanticipated flaws,  
  3. Require auxiliary non-probabilistic reasoning (e.g., diagnostic checks) to resolve crises.  

  **Conclusion**: The interpretations are epistemologically distinct but functionally equivalent in practice. OPERA highlighted that *all* probability formalisms are secondary to empirical rigor: finding the loose cable required engineering, not statistics. The "map" each provides is useful, but none reaches beyond the lab bench.
