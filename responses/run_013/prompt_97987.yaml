prompt: |-
  My reading group got into a fight last week about Kripkenstein and I need someone to referee. The setup: two friends, Dana and Marcus, were arguing about whether a neural net that was trained on a bunch of addition examples and then gets a new sum right can be said to be following the rule of addition, or whether it's just doing what it's disposed to do. Dana says if it reliably gets new sums right, then it's following addition; the rule just is the pattern in its behavior. Marcus says no, because any finite set of examples is compatible with infinitely many rules -- plus, quus-like variants, weird functions that agree on all training data and diverge later -- so its behavior on the new sum can't show which rule it's following. Dana replies that the same is true of humans, and we don't say humans aren't following rules just because their past behavior is finite; we say they meant plus, and meaning plus is just being disposed to go on one way rather than another. Marcus says dispositions can't distinguish correct from incorrect: if the net had a glitch and output 5 for 68+57, it would still be disposed to output 5, but that wouldn't make 5 correct. Dana says the community corrects it, so correctness is social agreement. Marcus says that's circular, because the community's agreement is itself just a bunch of dispositions, and anyway the net isn't part of the community. Dana then says maybe grasping a rule is a primitive normative state, not a disposition at all. Marcus says that just posits the thing we're trying to explain. Neither would budge. Please adjudicate move by move: rate each of Dana's and Marcus's moves from clearly mistaken to clearly right and explain each rating, then say what, if anything, both are missing. Format it as: Setup (2-3 sentences), Move-by-move (about 450 words), Where each is right (about 150 words), What both miss (about 100 words), Bottom line (2-3 sentences). Don't just pick a winner overall -- I want to know which specific claims stand and which fall.
