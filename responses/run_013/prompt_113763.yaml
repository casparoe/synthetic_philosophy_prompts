  First, I need to unpack their core requirements. The question must:
  - Be answerable using only lecture slides
  - Require applying the thin/thick distinction to at least two case studies
  - Make students evaluate whether the framework has explanatory value
  - Include a "resumption test" operationalization
  - Contain a built-in contradiction in the framework
  - Come with a model answer and detailed marking scheme

  Hmm... the tricky part is designing a question where the framework's contradiction becomes apparent through application. The "resumption test" seems to be the key tension point - especially how it handles isolation vs proximity to other complex societies. 

  For case studies, Bronze Age collapse works well for thin collapse (rapid institutional failure but continuity/revival in neighboring areas), while Rapa Nui illustrates thick collapse (irreversible loss of complexity in isolation). The Maya present an interesting middle ground where the framework strains - institutional collapse was thick in some regions but thin in others, complicated by proximity to other Mesoamerican societies.

  The model answer should demonstrate:
  1) Clear definitions of thin/thick with resumption test
  2) Application to cases with evidence-based verdicts
  3) Exposure of the framework's contradiction (the isolation paradox)
  4) Critical evaluation of explanatory value

  For the marking scheme, I'll allocate points across conceptual clarity (5), case analysis (10), framework critique (7), and writing quality (3). The A/B boundary should hinge on whether students spot and articulate the isolation paradox - that's the intellectual leap that moves beyond mere application.

  Notable pitfalls to penalize:
  - Conflating population decline with institutional collapse (-3)
  - Treating cases monolithically without regional variation (-2)
  - Missing the resumption test in verdicts (-2 per case)
  - Failing to engage the framework's self-contradiction (-5)

  The sample answer will model precise language while avoiding dates/numbers per request. It should show how the framework's strength (clear operationalization) becomes its weakness when applied to interconnected regions. The "eats itself" moment comes when students realize proximity negates thickness even when complexity loss was permanent locally.

  This structure forces engagement with the conceptual machinery while preventing rote recitation of standard collapse narratives. The time limit means answers must be focused - good students will recognize the paradox quickly through the case comparisons.
answer: |-
  Here’s a complete package designed to meet your specifications, forcing students to engage critically with the framework while minimizing opportunities for rote narrative:

  **Essay Question (60-minute take-home, 25 marks):**  

  > "Using the **two-thresholds framework** (thin collapse: end of a specific institutional complex; thick collapse: sustained regional reduction in achievable complexity), analyze **two** of the following cases: Bronze Age Mediterranean systems, Classic Maya lowland polities, or Rapa Nui (Easter Island) society.  
  >   
  > For each case:  
  > (a) Apply the **resumption test** ("no comparable complexity in the region, with no easy reimportation") to justify a thin or thick collapse verdict.  
  > (b) Explain whether standard "diminishing returns" or "ecocide" narratives **alone** can explain your verdict.  
  >   
  > Finally: Does distinguishing thin/thick collapse reveal something *beyond* cataloging outcomes? Or does the framework undermine itself when operationalized by the resumption test? Support your evaluation with your case analyses."  

  ---

  **Model Answer (710 words):**  

  The two-thresholds framework distinguishes between the failure of specific institutions (*thin collapse*) and a region’s irreversible loss of capacity for complexity (*thick collapse*), operationalized by the resumption test: thick collapse requires no comparable complexity emerges locally, and lost techniques aren’t readily reimported. Applying this to the **Bronze Age systems** and **Rapa Nui** reveals the framework’s utility but exposes a critical tension.  

  **Bronze Age Mediterranean (Thin Collapse):**  
  The dissolution of palatial states, international trade networks, and literacy circa 1200-1100 BCE represents *thin collapse*. The resumption test shows this: comparable complexity (city-states, writing, advanced metallurgy) re-emerged in the *same region* within centuries (e.g., Phoenician, Greek polities). Critically, techniques like syllabic writing weren’t lost but persisted in neighboring areas (Cyprus, Syria), enabling reimportation. Standard narratives partially explain this: "diminishing returns" on palace-centered redistribution strained systems, while localized environmental stress (e.g., droughts) contributed to instability. However, neither narrative explains *why complexity rebounded*. The thin collapse verdict highlights that institutional failure occurred *without* eroding the region’s underlying capacity for complexity, preserved through decentralized knowledge reservoirs and proximity to surviving societies.  

  **Rapa Nui (Thick Collapse):**  
  Rapa Nui’s societal fragmentation represents *thick collapse*. Following the decline of the moai-building chiefdoms, no comparable sociopolitical complexity (monumental construction, island-wide ritual systems) re-emerged. The resumption test confirms thickness: no neighboring societies existed to reimport lost organizational or technical knowledge (e.g., statue transport). "Ecocide" narratives (e.g., deforestation degrading carrying capacity) align partially by explaining *constraints* on recovery. Yet ecocide alone cannot explain why simpler social forms persisted rather than rebuilding complexity once conditions stabilized. The thick collapse verdict reveals a *fundamental reduction in achievable complexity*, tied to isolation preventing knowledge recovery.  

  **Explanatory Value & Framework Tension:**  
  The distinction *does* meaningful work beyond describing outcomes. It forces analysis of *recoverability mechanisms*. The Bronze Age’s thin collapse underscores how proximity to intact knowledge pools enables institutional rebirth, while Rapa Nui’s thick collapse shows isolation amplifies loss into irreversible decline. This moves beyond cataloging "polity ended" vs. "people persisted" by asking: *Under what conditions can complexity regenerate?*  

  **However, the framework undermines itself via the resumption test.** The test defines thickness by *regional* non-resumption and lack of reimports. Yet "region" is ambiguously scaled. For the Maya (a potential third case), lowland city-states collapsed thickly in some areas (no large states reappeared for millennia where forests reclaimed cities) but thinly in others (complexity persisted in adjacent northern Yucatán). The resumption test struggles here: if "region" means the *specific* lowland zones, collapse appears thick (no local rebound); if "region" means Mesoamerica broadly, nearby highland states invalidate thickness. **The framework eats itself by making thickness contingent on arbitrary geographic boundaries.** A collapse is thick only if no comparable complexity exists *nearby enough*—but "nearby" isn’t defined. Rapa Nui’s thickness relies on its extreme isolation; in connected regions like the Mediterranean or Mesoamerica, proximity *guarantees* thinness by the resumption test, potentially obscuring profound local irreversible losses (e.g., specific Maya basins). This reduces thickness to a function of geographic luck, not the nature of the collapse itself.  

  Thus, while the thin/thick distinction usefully shifts focus to regenerative capacity, the resumption test’s geographic arbitrariness limits its explanatory power for interconnected regions. Thickness becomes a property of isolation, not collapse dynamics.  

  ---

  **Marking Scheme (25 marks total):**  

  1.  **Framework Definition (3 marks)**  
      *   Clear explanation of thin/thick collapse + resumption test (2)  
      *   Correct operational use of "comparable complexity" & "reimportation" (1)  

  2.  **Case Analysis (10 marks: 5 per case)**  
      *   *Per case:* Accurate application of resumption test to justify verdict (2)  
      *   *Per case:* Valid argument why standard narratives (diminishing returns/ecocide) are insufficient for the verdict (2)  
      *   *Per case:* Evidence from case logic (not general narrative) (1)  

  3.  **Critical Evaluation (9 marks)**  
      *   Identifies framework's value (e.g., focus on recoverability, knowledge persistence) (3)  
      *   **Identifies the core contradiction: Thickness depends on arbitrary regional definition/isolation (KEY A/B DIFFERENCE)** (4)  
      *   Uses case analyses (e.g., Maya ambiguity, Rapa Nui isolation) to support critique (2)  

  4.  **Clarity & Structure (3 marks)**  
      *   Logical flow, conciseness, answers all parts of the question.  

  **Deductions (per instance):**  
  *   Paraphrases diminishing returns/ecocide *without* tying to verdict insufficiency: **-2 per case**  
  *   Misapplies resumption test (e.g., ignores "reimportation" or "comparable complexity"): **-2 per case**  
  *   Treats collapse as monolithic event without institutional focus: **-3**  
  *   Fails to identify the geographic arbitrariness contradiction: **-4** (Critical for A)  
  *   Factual errors (if egregious/altering analysis): **-1 to -2**  

  **A vs. B Boundary:**  
  *   **A (21+):** **Must identify and articulate the framework's self-contradiction regarding geographic arbitrariness/isolation** (Point 3b above). Case analyses are precise in applying the resumption test.  
  *   **B (16-20):** Competently defines/applies framework to cases and states its value, but **fails to expose the core contradiction** OR identifies it weakly without using case logic. May have minor test misapplications.  

  **Why this works for your goals:**  
  1.  **Forces framework engagement:** The resumption test is *built into the question*, requiring operational use.  
  2.  **Blocks standard narratives:** Part (b) explicitly demands showing why they are *insufficient* for the verdict.  
  3.  **Exposes the contradiction:** The framework *does* eat itself – thickness collapses to isolation when operationalized. Top answers *must* grapple with the Maya ambiguity or the Bronze Age's "thinness-by-proximity".  
  4.  **Self-contained:** Definitions and test criteria are in the question. Cases are common "suspects".  
  5.  **Defensible grading:** The A/B split hinges cleanly on identifying the geographic arbitrariness flaw, directly supported by the model answer and marking scheme. Complaints can be shut down by pointing to the explicit requirement to "turn the framework on itself."  

  This question rewards students who think structurally about collapse and interrogate the tools they're given, while minimizing rewards for regurgitation. The model answer demonstrates the depth expected within the constraints.
