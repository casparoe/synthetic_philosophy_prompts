prompt: |-
  I work in public history — museum labels, curriculum panels, the odd truth-commission gig — and I'm about to pick a fight with my collegues, so I want my own position straight first. Here's what I actually think. (1) Collective memory and academic history arn't rivals answering the same question; memory is identity-constituting and answerable to what a community needs now, history is answerable to evidence, so "which one is true" is usually the wrong question. (2) All the same, the historian has a standing obligation to the record: when the evidence goes against a beloved communal story, going quiet is a failure of the discipline. (3) The "record" isn't neutral either — archives were built by whoever had the power to build them, so documentary history is often just somebody's memory with better shelving. (4) In public-facing work, when a community's memory and the professional consensus clash, and that community has been on the receiving end of state violence, the community should generally win: they bear the costs of being overridden and the identity stakes are theirs. (5) Two verdicts I'd defend: at a site where an oral tradition holds that a massacre happened and the archaeology turns up nothing, the label should state that it happened, full stop, no hedging parenthetical about absent evidence; but where a community's memory casts it purely as victim and drops its own documented atrocities against a neighbouring group, the museum must put the documents up anyway, over that community's objection.

  Do these five hang together? Rank the tensions by severity rather than treating them as equally bad, and for each one say which commitment has to give and what that costs. Some of them probably only look like conflicts — I'd rather you tell me which. Give it as exactly five numbered items, a sentence or two each, no intro and no closing summary.
reasoning: |-
  Okay, let me unpack this public historian's query. They're about to challenge colleagues and want their five principles stress-tested for internal coherence. The core tension seems to be between historical rigor and community agency, especially for marginalized groups. 

  First, I notice their stance rejects the "memory vs history" binary upfront - smart move since that false dichotomy plagues public history debates. Their point about archives being "somebody's memory with better shelving" particularly resonates; it reframes archival gaps as power artifacts rather than neutrality. 

  The massacre example reveals their hierarchy: when physical evidence contradicts oral history of oppressed groups, they'd prioritize the latter without qualification. But they draw a hard line when communities omit their own perpetration of violence. That distinction feels ethically consistent - one addresses erasure by power structures, the other risks becoming complicit in new erasures.

  I'm weighing the apparent conflict between their archival skepticism (#3) and insistence on displaying inconvenient documents (#5). Actually, these strengthen each other: acknowledging archives' biases demands we critically engage with them, not ignore uncomfortable records. The cost is alienating communities seeking monolithic narratives, but avoiding that would betray the discipline.

  Their strongest tension lies between #2 (historian's duty to contradict false stories) and #4 (deferring to communities impacted by state violence). The resolution seems contextual: #4 governs when historical oppression shapes the narrative dispute, while #2 applies when power differentials are less central. The cost? Potentially undermining universal evidence standards, but they appear willing to bear that for restorative justice.

  Finally, #1's framework makes #4 possible - if memory serves identity needs rather than evidentiary ones, prioritizing community narratives in certain contexts isn't "bad history" but different epistemology. That foundation prevents the other points from collapsing into relativism.
answer: |-
  Here are the five tensions ranked and resolved per your framework:

  1.  **#3 (archival bias) vs #5 (displaying community-perpetrated atrocities):** Minimal tension. Acknowledging archives' non-neutrality (#3) *requires* critical engagement with problematic documents rather than avoidance. Displaying them despite community objection (#5) becomes an active countermeasure to historical silencing, costing community trust but fulfilling #2's duty to the record.
  2.  **#1 (memory's purpose) vs #2 (duty to the record):** Moderate tension resolved by context. Memory's identity function (#1) doesn't negate the duty to challenge falsehoods (#2), but shapes *how* and *when* contradictions are presented. The cost is abandoning absolute "truth-telling" in favor of contextual judgment, risking perceptions of inconsistency.
  3.  **#4 (priority for victimized communities) vs #5 (displaying their atrocities):** Severe tension. #4 prioritizes the identity/needs of communities impacted by state violence when their memory clashes with consensus. #5 overrides their objections to display evidence of their perpetration. Here, #5 prevails due to #2's core duty and preventing new erasures. The cost is profound harm to that community and potential loss of partnership.
  4.  **#2 (duty to contradict) vs #4 (defer to victimized communities):** Critical tension. #2 demands challenging false communal stories; #4 often demands accepting them. Resolution leans on #4 *only* when the clash involves state violence impacting that community's identity (#1). #2 prevails otherwise. The cost is a double standard where historical rigor yields for restorative justice in specific contexts, opening charges of bias.
  5.  **#1 (memory ≠ history) vs #5 (no hedging on massacre):** Apparent conflict only. Affirming an unverified massacre (#5) based solely on oral tradition aligns precisely with #1: it serves identity/needs *now*, not evidentiary "truth." Omitting hedging isn't a failure of #2, but recognizing the question being answered isn't "what does evidence prove?" but "what does this community need to remember?" The cost is potential disconnect with academic consensus.
