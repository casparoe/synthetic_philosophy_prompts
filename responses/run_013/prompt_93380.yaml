prompt: |-
  I have been reading about biological signaling and about the way anthropologists and economists borrow the handicap principle, and I find that I make snap judgments about which cases are genuine signals and which are not. I would like to know what principle, if any, lies behind them — and I would rather have a principle that is honest about what it costs me than one that saves every verdict by growing epicycles.

  Here are the cases and my verdicts.

  - The peacock's tail: an honest signal of the male's condition, and honest precisely because a sickly male could not grow it. A signal.
  - A wasp's black-and-yellow banding: an honest warning of a sting, though the colors cost the wasp nothing to produce. Still a signal, still honest.
  - A man's low vocal pitch: tells a listener something real about his size and strength, but it is no handicap in any sense. Honest — and yet I resist calling it a costly signal at all.
  - Blushing: an unfakeable sign of embarrassment, with no cost and no intention behind it. Honest, but a different kind of thing from the peacock's tail.
  - Gazelle stotting: costly, honest, and directed at predators — yet the predator benefits from the information, which makes me uneasy about calling the stotting a handicap to the gazelle.
  - A flat tax that every adult must pay, rich or poor, able or infirm: costly to all, informative about none. Not a signal.
  - A potlatch in which a chief gives away or destroys wealth before rivals: a genuine signal of standing, and the waste is part of why it works.
  - A large anonymous donation to a famine-relief fund: costly, but not a signal of anything, because no one knows about it.
  - The same donation with the donor's name on a university building: a signal, even though the money does real good and nothing is wasted.
  - A painful initiation rite performed before the whole community: a signal of commitment. Yes.
  - The same painful discipline practiced alone and disclosed to no one: not a signal — except that I have a stubborn sense that a private discipline does signal something to the person who undergoes it, and I do not know what to do with that.
  - Saying "I will be there at eight": not a signal, just cheap talk.
  - A degree from an expensive university: signals something about the graduate, but I do not think the tuition is what does the work; it feels more like the wasp's stripes than the peacock's tail.

  My tentative principle: a signal is honest when producing it costs the sender something a lower-quality sender could not afford. That gets the peacock, the potlatch, and the initiation, and it correctly excludes the tax and the anonymous donation. But it seems to exclude the wasp, the voice, and the blush, none of which I am willing to give up, and it says nothing obvious about the degree or the private discipline.

  What principle — or small set of principles — actually captures the pattern? I would like any two principles that are doing distinct work to be kept separate and named, the principle's verdicts on cases I have not listed, and an explicit statement of which of my verdicts it cannot accommodate. If the price of a single principle is overturning one of the verdicts above, tell me which one I should give up and why that is the cheapest loss.
reasoning: |-
  Hmm, the user is grappling with signaling theory across biology and social sciences, presenting 13 cases with their intuitive verdicts and seeking a unifying principle. They've noticed their current cost-based criterion excludes important cases like wasp coloration and blushing, and they're frustrated with ad-hoc explanations ("epicycles"). 

  The key tension lies in their admirable desire for conceptual honesty versus the messy reality that signaling mechanisms vary. Their examples reveal at least three distinct honesty mechanisms: cost (peacock), receiver-independent indices (blushing), and conventional signals (wasp stripes). The private discipline case is particularly telling—it exposes their intuition about self-signaling, which is a real but separate phenomenon. 

  For the university degree, the user's analogy to wasp stripes is perceptive—it's a conventional signal where value comes from institutional credibility, not tuition cost. That case actually strengthens the need for multiple principles. 

  If forced to choose one verdict to sacrifice, the private discipline as signal should go because it conflates psychological commitment devices with communication. But the deeper solution is to acknowledge that "signal" isn't binary—it's a cluster concept with family resemblances. The user's resistance to calling vocal pitch a "costly signal" is correct; it's better classified as an index. 

  Their discomfort with stotting is also revealing—it shows they sense Zahavi's handicap principle originally assumed conflict, but modern signaling theory accepts mutual benefit. That's a valuable insight worth preserving by separating the honesty mechanism from the evolutionary context.
answer: |-
  Your intuition reveals a fundamental insight: **signaling is not a single phenomenon but a family of related mechanisms united by information transfer, with distinct honesty-enforcing principles.** Below, I propose a minimal framework with three core principles that cover your cases without epicycles. I'll state the principles, apply them to your list, identify conflicts, and suggest which verdict to revise for maximal coherence.

  ---

  ### **Core Principles of Honest Signaling**
  1. **Costly Handicap Principle (CHP)**:  
     A signal is honest if its production or maintenance imposes a *cost* that differentially burdens low-quality senders. *Enforces honesty via strategic cost.*  
     *Examples*: Peacock's tail, potlatch, painful initiation rite.

  2. **Index Principle (IP)**:  
     A signal is honest if it is intrinsically linked to a trait via physical, physiological, or informational constraints, making it unfakeable. *Enforces honesty via causal necessity.*  
     *Examples*: Vocal pitch (vocal fold size), blushing (autonomic nervous system), wasp banding (fixed genotype).

  3. **Conventional Signal Principle (CSP)**:  
     A signal is honest due to institutional or evolutionary *reputation costs* for deception, where dishonesty triggers future penalties (e.g., loss of trust, sanctions). *Enforces honesty via receiver skepticism and repeated interaction.*  
     *Examples*: University degree, named donation, "cheap talk" when credible.

  ---

  ### **Application to Your Cases**
  | Case                          | Your Verdict       | Framework Verdict                               | Principle           | Notes                                                                 |
  |-------------------------------|--------------------|-------------------------------------------------|---------------------|-----------------------------------------------------------------------|
  | Peacock's tail                | Signal (CHP)       | ✅ Signal                                       | CHP                 | Cost handicaps low-quality males.                                    |
  | Wasp banding                  | Signal (IP)        | ✅ Signal                                       | IP                  | Unfakeable index of toxicity.                                        |
  | Low vocal pitch               | Honest, not costly | ✅ Signal                                       | IP                  | Index of body size (vocal anatomy).                                  |
  | Blushing                      | Honest, not signal | ⚠️ **Revise: Signal**                           | IP                  | Unfakeable index of emotional state.                                 |
  | Gazelle stotting              | Uneasy signal      | ✅ Signal                                       | CHP                 | Costly proof of fitness; predator benefits but signal is still honest.|
  | Flat tax                      | Not signal         | ✅ Not signal                                   | —                   | No information conveyed.                                             |
  | Potlatch                      | Signal             | ✅ Signal                                       | CHP                 | Waste signals wealth via cost.                                       |
  | Anonymous donation            | Not signal         | ✅ Not signal                                   | —                   | No receiver → no signal.                                             |
  | Named donation                | Signal             | ✅ Signal                                       | CSP                 | Reputation cost ensures honesty (future trust/status benefits).      |
  | Painful initiation (public)   | Signal             | ✅ Signal                                       | CHP                 | Cost proves commitment.                                              |
  | Painful discipline (private)  | Not signal         | ⚠️ **Revise: Not signal**                       | —                   | No receiver → no signal (self-signaling is psychological, not communicative). |
  | Saying "I’ll be there at 8"   | Not signal         | ⚠️ **Revise: Conditional signal**               | CSP                 | Honest if reputation costs for lying exist (e.g., in repeated interactions).|
  | Expensive degree              | Signal (like wasp) | ✅ Signal                                       | CSP (primary)       | Reputation of university backs the degree; tuition is secondary.     |

  ---

  ### **Key Conflicts and Resolutions**
  1. **Blushing (Your Verdict: Not a Signal)**  
     - **Conflict**: You exclude blushing because it lacks cost/intention.  
     - **Resolution**: Adopt the **Index Principle (IP)**. Blushing *is* a signal—an unfakeable physiological index of emotion. Honesty doesn't require cost or intent.  
     - **Why revise?** Signals need receivers, not intent. Blushing informs observers, altering their behavior.

  2. **Private Discipline (Your Verdict: Feels like a Signal)**  
     - **Conflict**: You intuit self-signaling.  
     - **Resolution**: **Reject as signal**. Signaling requires a *receiver*. Private acts are commitment devices or self-regulation, not signals.  
     - **Why revise?** Confusing self-signaling with communication conflates psychology with evolutionary signaling theory.

  3. **Cheap Talk (Your Verdict: Not a Signal)**  
     - **Conflict**: Verbal promises seem "cheap."  
     - **Resolution**: **Conditional on context**. Under CSP, cheap talk *can* signal if backed by reputation costs (e.g., in close-knit communities).  
     - **New Verdict**: Signal if deception risks future penalties.

  4. **Gazelle Stotting**  
     - **Resolution**: CHP applies. Predator benefit doesn’t invalidate the signal—it’s honest *because* cost filters out weak gazelles. Mutual benefit is allowed in signaling theory.

  ---

  ### **The Unified Pattern**
  - **All signals** require:  
    (a) A sender and receiver,  
    (b) Information transfer affecting receiver behavior,  
    (c) An honesty-enforcing mechanism (CHP, IP, or CSP).  
  - **Honesty arises from**:  
    - Strategic cost (CHP),  
    - Physical constraints (IP),  
    - Institutional/reputational enforcement (CSP).  

  ---

  ### **What to Sacrifice?**
  Revise **private discipline as a signal**. It’s the "cheapest loss" because:  
  - It lacks a receiver (violating signaling’s core definition).  
  - Your intuition aligns with psychology (self-signaling), not communication theory.  
  - Keeping it would require stretching "receiver" to include the self, creating epistemic circularity.

  ---

  ### **Why This Works**
  - **CHP** covers strategic investments (peacock, potlatch, initiation).  
  - **IP** covers unfakeable traits (vocal pitch, blushing, wasp stripes).  
  - **CSP** covers reputation-based signals (degrees, named donations, credible promises).  
  - **Non-signals** lack information (flat tax) or receivers (anonymous donation, private acts).  

  This framework explains all your cases with three distinct principles, avoids epicycles, and honors your intuition that blushing/wasp stripes are meaningfully "signals" without artificial cost requirements.
