  Now, the main task is to identify tensions. I notice several potential conflicts. Commitment 4 says blame isn't fitting when wrongdoing is fully explained by upbringing, but commitment 6 suggests a gradient—more traceability means less blame. That seems inconsistent. If full explanation removes blame entirely (4), then 6's gradient approach might not fit.  

