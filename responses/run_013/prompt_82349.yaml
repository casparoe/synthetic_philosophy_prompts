  The middle stanzas need differentiation: stanzas 2 and 3 could be proactive predictions (positive heuristic), while 4 and 5 react to problems (negative heuristic). Final stanza keeps hard core unchanged, protective belt now accommodating past issues, no resolution.

  Post-poem analysis should clarify:
  - Alignment with Lakatos's emphasis on program endurance
  - How the protective belt's evolution reflects contested interpretations of ad hoc adjustments
  - Why stanza 5's accommodation might be seen as degenerating
