  Okay, the user is creating a handout for a grad seminar on the heterogeneity problem in hedonism. They want a decision tree that helps students navigate the positions on what pleasures have in common. The key is to build it through questions rather than listing -isms, using the cases they provided to force concrete decisions.

  First, I need to map the logical space. The heterogeneity problem questions whether diverse pleasures share a common core. The user specified several must-cover positions: no common core, single phenomenal quality, attitude-based views, functional role, determinable/determinate, valence/hedonic tone as primitive. They also want branches on introspectability and whether a persistently wanted but phenomenally neutral state counts as pleasure.

  The user emphasized pulling apart conceptual vs. empirical claims about heterogeneity. This is crucial - many debates conflate whether our concept demands unity versus whether neuroscience finds one mechanism. I'll make this the first branch. 

  For the "persistently wanted state" case, this tests desire-based theories. If someone says yes to counting it as pleasure, that likely leads to attitude-based positions. If no, it might support phenomenal or functional views. Similarly, the introspectability branch should divide views where the unifier is accessible (like distinctive feeling theories) from those where it's not (maybe some functional roles).

  I should flag combinations that lead to empty leaves. For example: if someone thinks there's no conceptual need for unity but insists on a single phenomenal quality - that might be unattractive because it ignores the conceptual worry. Or claiming valence is primitive while also requiring introspectable unity could be incoherent.

  The tree should have 6-8 nodes. Starting with conceptual/empirical distinction, then moving to existence of common core. If no core, branch into whether this kills hedonism. If yes, then test cases: the persistently wanted state, then whether unifier is introspectable. Later branches can cover attitude theories and valence primitivism.

  For leaf positions: "Distinctive Feeling" view's awkward commitment is denying masochism or sad song pleasures. "Attitudinal Theory" struggles with pleasures we don't desire. "Functional Role" might have to accept bizarre realizers. The "Valence Primitivism" leaf must abandon "pleasure" as an explanatory term.

  I'll note where the tree can't separate views - like some functional roles might overlap with determinable/determinate if not carefully defined. Also list empty combinations: e.g., "Hedonism survives without common core" combined with "Unity required conceptually" is probably incoherent - if our concept demands unity but there isn't any, how can hedonism stand?
answer: |-
  ### Decision Tree: What (if anything) unifies pleasures?  
  *Answer each question based on intuitive judgments about cases (orgasm, peach taste, itch relief, proof-click satisfaction, sad song, masochism).*

  1. **Is the heterogeneity problem primarily about our *concept* of pleasure, or about empirical *mechanisms* in the mind/brain?**  
      - **Conceptual**: Go to Q2.  
      - **Empirical**: Go to Q3.  

  2. **Does our ordinary concept of pleasure *require* a unified core for all pleasures?**  
      - **Yes**: Go to Q4.  
      - **No**: → **Conceptual Hedonic Pluralism (unnamed)**  
          *Awkward: Must explain why we use one word despite denying conceptual unity.*  

  3. **Do neuroscientific/psychological findings suggest *one shared mechanism* for all pleasures?**  
      - **Yes**: → **Empirical Unity (unnamed)**  
          *Awkward: Must reconcile with introspective reports of radical difference.*  
      - **No**: → **Mechanistic Pluralism (e.g., Berridge)**  
          *Awkward: Pleasure isn’t a natural kind; hedonism may need revision.*  

  4. **Is there *any* property unifying all pleasures?**  
      - **No**: → **No Common Core (e.g., Sidgwick, Rachels)**  
          *Awkward: Hedonism survives only if "pleasure" refers to a disjunction of desirable states.*  
      - **Yes**: Go to Q5.  

  5. **Consider a state that feels neutral (no distinctive phenomenology) but is persistently *wanted* for its own sake (e.g., a compulsion). Is this pleasure?**  
      - **Yes**: Go to Q6.  
      - **No**: Go to Q7.  

  6. **Is pleasure’s unity found in a *pro-attitude* (desire/liking) toward an experience, not its feel?**  
      - **Yes**: → **Attitudinal Theory (e.g., Feldman)**  
          *Awkward: Masochist’s pain could be pleasure if desired, conflicting with phenomenology.*  
      - **No**: → **Desire-Based Hedonic Tone (unnamed)**  
          *Awkward: Risks making pleasure non-phenomenal, defying introspection.*  

  7. **Can the subject *introspectively identify* the common feature in all pleasures?**  
      - **Yes**: → **Distinctive Feeling Theory (e.g., Moore’s critique target)**  
          *Awkward: Must insist masochism/sad songs share a feel with orgasms, despite appearances.*  
      - **No**: Go to Q8.  

  8. **Is the unifying feature:**  
      - **A functional role (e.g., motivation/reinforcement)?** → **Functionalism (e.g., early Fodor)**  
          *Awkward: Could include non-pleasurable states (e.g., addictive cravings) as "pleasure".*  
      - **A determinable property with heterogeneous determinates?** → **Determinable-Determinate View (e.g., Smuts)**  
          *Awkward: "Pleasantness" becomes a bare higher-order property, hard to define.*  
      - **Not "pleasure" itself, but *hedonic tone/valence*?** → **Valence Primitivism (e.g., Crisp, Lab-based approaches)**  
          *Awkward: Abandons "pleasure" as a useful category; valence may be just as heterogeneous.*  

  ---

  **Key Notes:**  
  - **Ambiguous Leaves**: Functionalism & Valence Primitivism may collapse together if valence *is* functional role.  
  - **Empty Combinations**:  
      - *Q2 "Yes" + Q4 "No"*: Incoherent (concept demands unity but none exists).  
      - *Q5 "No" + Q7 "No" + Q8 "Valence"*: Unexplored (non-attitudinal, non-introspectable valence).  
      - *Q1 "Empirical" + Q3 "Yes" + Q5 "Yes"*: Unattractive (science finds unity but includes compulsions as pleasure).  

  *Use cases to test positions: e.g., Attitudinal Theory struggles with the *sad song* (wanted despite negative feel?), Distinctive Feeling struggles with *masochism* (painful feel but pleasurable?).*
