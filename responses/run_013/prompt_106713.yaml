prompt: |-
  Ok so my reading group has been going around in circles for like three months on whether the Middle Ages, the Renaissance and the Scientific Revolution are real things or just labels we slapped on the past after the fact, and I'm sick of it. Write me the document we should have produced: the joint statement that a committed period-realist and a committed period-skeptic could both actually sign.

  By realist I mean someone who thinks these period names pick out genuine, causally coherent chunks of the past, so that there's a fact of the matter about whether some century really is a break. By skeptic I mean someone who thinks they're bookkeeping conveniences, mostly Eurocentric ones, that don't carve history at any joint. Don't split the difference or fudge it into "periods are useful tools" -- if that line goes into the agreed section, both sides have to genuinely mean it.

  I want, in order: (1) a numbered list of agreed claims, covering what period-talk is even for, what it would mean for a period to be real, and which bits of the fight both agree are just about words; (2) a table of the remaining disagreements, each one written so that the person who holds that side would accept the wording as a fair statement of their own view; (3) the cruxes -- and here's my hunch, tell me if I'm off: I think one crux is whether a period label can be doing real explanatory or causal work even if nobody alive at the time had the concept, and another is whether the three cases have to stand or fall together, i.e. can the Middle Ages be real-ish while the Renaissance turns out to be mostly a flattering story that later people told about themselves. For each crux, give me a concrete case or piece of evidence both sides would agree actually bears on it, and write down in advance what each side predicts about it. And if part of the whole arguement is really just about the word real rather than anything historical, say which part and why.

  Keep it casual, and please keep it honest rather than diplomatic.

  Last line, machine readable: Residual disagreement: <short phrase>
