  ### Polished Prompt for Classroom Activity Design  
  **Context:** I teach a 90-minute session of an upper-level undergraduate seminar in normative ethics (sixteen students, a mix of philosophy majors and pre-meds), following a unit on consequentialism. Design a single in-class activity that accomplishes two goals:  
  1. **Immersion:** Makes students feel the intuitive pull of the doctrine of double effect (DDE)—specifically, the sense that distinguishing *harm as a means* from *harm as a foreseen side effect* tracks something morally real—without naming the doctrine until the debrief.  
  2. **Challenge:** Forces students to confront cases where this distinction strains or collapses under their own reasoning.  

  **Core Requirements:**  
  - **Discovery-First Approach:** Students must articulate the means/side-effect distinction themselves through structured dilemmas; the terms "doctrine of double effect" or its formal conditions are banned until the debrief.  
  - **Minimal Fiction:** Use concise, stake-free hypotheticals (no elaborate narratives or real-world consequences).  
  - **Phase-Based Structure:**  
    - **Phase 1 (Discovery):** Students intuitively apply the distinction, revealing that a "minimize deaths" rule fails to predict choices, while a "no harm-as-means" rule fits.  
    - **Phase 2 (Stress Test):** Cases challenge the distinction:  
      - Harm is causally necessary but *appears* as a side effect.  
      - Physically identical cases differing only in the agent’s described aim.  
      - Harm very close in the causal chain (testing if "foreseen" suffices).  
    - **Forced Choice:** Students decide whether to keep the rule (accepting counterintuitive outcomes) or abandon it (losing Phase 1’s intuitive asymmetry).  
  - **Practical Design:** Provide a complete runnable blueprint:  
    - Setup, roles, and materials.  
    - Minute-by-minute timing for a 90-minute session.  
    - Incentive system (e.g., tokens, chits, or score—no real money).  
    - Debrief linking activity moments to DDE’s components and objections.  
  - **Critical Notes:**  
    - **Predictable Failure Modes:** Describe 3–5 likely pitfalls (e.g., timing bottlenecks, student confusion).  
    - **Unreproducible Feature:** Specify one aspect of DDE the activity *cannot* simulate (to be addressed by me in the debrief).  

  **Shape to Improve On:**  
  - **Phase 1 (Discovery):** Students rotate as "Decider" in rescue dilemmas; others act as "Predictors" betting on outcomes. Cases stack to show "minimize deaths" fails (e.g., permitting pushing a fat man) while a "no harm-as-means" rule predicts choices (e.g., forbidding transplant but permitting strategic bombing). Goal: Students discover they are reliable double-effect reasoners.  
  - **Phase 2 (Stress Test):** Cases include:  
    - A Lazy Susan–style dilemma (harm is causally necessary but framed as a side effect).  
    - A pair of physically identical cases differing only in the agent’s aim (e.g., pressing a button described as saving five with side-effect death vs. killing one to save five).  
    - A proximity case (e.g., a drug that directly causes death as a "side effect").  
  - **Forced Choice:** Final round forces a binary: keep the rule (despite stress-test verdicts) or discard it (losing Phase 1’s moral asymmetry).  

  **Output Format:**  
  - Only the polished activity design (no preamble, sourcing, or commentary).  
  - Succinct but complete; aim for readability in ~1,000 words.  

  ---  
  ### Final Polished Activity Design: "The Moral Line Exercise"  
  **Learning Goal:** Students experience the means/side-effect distinction intuitively, then pressure-test its limits—culminating in a forced choice about the rule’s viability. DDE is named only in the debrief.  

  **Setup (10 minutes):**  
  - **Roles:** One "Decider" (rotates each round), others as "Predictors."  
  - **Materials:**  
    - Case cards (6 total; see below).  
    - Token system: Each student gets 10 tokens. Predictors earn 1 token for correct predictions, lose 1 for incorrect. Deciders earn 2 tokens per round for participating.  
    - Whiteboard tracking: Record predictions vs. actual decisions and token scores.  
  - **Rules:**  
    - Decider chooses between two options (e.g., "Act" or "Don’t act").  
    - Predictors write predictions privately (red/blue cards for anonymity), then reveal simultaneously.  
    - No debate during rounds; discussion only in reflections.  

  **Phase 1: Discovering the Rule (35 minutes)**  
  *Goal: "Minimize deaths" fails; "no harm-as-means" predicts choices.*  
  - **Round 1: Standard Trolley Cases (10 min)**  
    - *Case 1 (Switch):* Divert a trolley to kill one, saving five.  
    - *Case 2 (Fat Man):* Push one person to stop the trolley, saving five.  
    - *Procedure:* 2 min/case. Predictors bet, Decider decides.  
    - *Pattern:* Most permit Switch (side effect) but forbid Fat Man (means). "Minimize deaths" permits both → fails.  
  - **Round 2: Medical/War Cases (10 min)**  
    - *Case 3 (Transplant):* Kill one healthy patient for organs to save five.  
    - *Case 4 (Strategic Bomber):* Bomb a factory (foreseeably killing one civilian) to save thousands.  
    - *Pattern:* Most forbid Transplant (means) but permit Bomber (side effect). "Minimize deaths" fails again.  
  - **Round 3: Loop Variant (10 min)**  
    - *Case 5 (Loop Trolley):* Divert trolley to a loop where one person’s death *stops* it saving five (harm is means).  
    - *Pattern:* Most forbid → reinforces "no harm-as-means."  
  - **Reflection (5 min):** "What rule explains our choices better than ‘minimize deaths’?" Guide toward: *"We avoid harm essential to the plan but allow incidental harm."*  

  **Phase 2: Stress-Testing the Rule (30 minutes)**  
  *Goal: Expose ambiguities in the distinction.*  
  - **Round 4: Lazy Susan (10 min)**  
    - *Case 6:* Rotate a table to save five from poison, but rotation *requires* one person to absorb the dart (harm is causally necessary; is it means or side effect?).  
    - *Pattern:* Split decisions → rule ambiguity.  
  - **Round 5: Identical Cases, Different Aims (10 min)**  
    - *Case 7 (Aim: Save Five):* Press a button saving five; a rock *incidentally* kills one.  
    - *Case 8 (Aim: Kill One):* Same button; rock killing one *triggers* the save.  
    - *Pattern:* Decisions flip based on description → rule depends on mental states.  
  - **Round 6: Proximity Problem (10 min)**  
    - *Case 9:* Administer a life-saving drug that *directly* causes one person’s death as a "side effect."  
    - *Pattern:* Controversy → does causal closeness make it means?  

  **Forced Choice (5 minutes):**  
  - "Stick with the rule (accepting Round 4–6 verdicts) or discard it (losing Round 1–3’s moral clarity)?" Students vote via tokens; record rationale snippets.  

  **Debrief (10 minutes):**  
  - **Name and Map DDE:** Reveal the doctrine. Map phases to its four conditions:  
    - *Phase 1:* Conditions 2–3 (intended good, no harm-as-means) explained patterns.  
    - *Phase 2:*  
      - Lazy Susan → Condition 3 vagueness (objection: distinction is arbitrary).  
      - Identical cases → Condition 2 dominates (objection: moral luck).  
      - Proximity → Condition 3 loophole (objection: ignores causal directness).  
  - **Objections:** Link to debates (e.g., Philippa Foot vs. critics).  

  **Predictable Failure Modes:**  
  1. **Time Crunch:** Rounds may overrun; cut reflection short if needed (use a timer).  
  2. **Decider Anxiety:** Students may freeze; remind them choices are low-stakes and rotate quickly.  
  3. **Groupthink in Predictions:** Private voting reduces bias, but dominant voices may sway others; enforce silent prediction.  
  4. **Over-Simplification:** Students may force-fit "minimize deaths"; highlight mismatches (e.g., "Why did 80% forbid Transplant but permit Bomber?").  
  5. **Desensitization:** Repetition may dull moral intuition; vary case tones (medical/war/rescue).  

  **Unreproducible Feature:**  
  - The activity cannot simulate the *emotional weight of real harm*. Classroom tokens and hypotheticals lack the visceral stakes of life-or-death decisions (e.g., medical triage or war). In the debrief, I will emphasize that DDE is often invoked in high-stakes contexts, where intuition and principle may diverge under pressure.  

  **Total Timing:** Setup (10) + Phase 1 (35) + Phase 2 (30) + Forced Choice (5) + Debrief (10) = 90 minutes.
