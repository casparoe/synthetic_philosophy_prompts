reasoning: |-
  We are designing a classroom activity for a 90-minute undergraduate seminar in normative ethics. The goal is to have students experience the doctrine of double effect (DDE) from the inside without naming it until the debrief. The activity should have two main phases: one where students discover that they are intuitively using a distinction between harm as a means and harm as a foreseen side effect, and a second phase where they confront cases that challenge the stability of that distinction.

  The structure provided by the user:
  - Phase 1: Students take turns as the decider in rescue dilemmas, while others predict the decider's verdict. The baseline "minimize deaths" rule should fail to predict the room's judgments, but a rule that forbids harm as a means but allows harm as a foreseen side effect should fit well.
  - Phase 2: Cases where the harm is causally necessary but appears as a side effect, physically identical cases that differ only in the agent's aim, and a case with harm very close in the causal chain.

  We are to avoid using the DDE's name or standard formulation until the debrief.

  Additionally, the user requests:
  - A scoring system without real money (tokens, chits, running score).
  - A debrief that maps activity moments to the doctrine and objections.
  - Notes on predictable failure modes and a feature that the activity cannot reproduce.

  Let's design the activity step by step.

  **Activity Title:** The Rescue Dilemma Game

  **Overall Structure:**
  1. Introduction and Setup (10 minutes)
  2. Phase 1: Discovering the Distinction (35 minutes)
     - Round 1: Standard Trolley Problem (Switch vs. Fat Man) - 10 min
     - Round 2: Transplant vs. Strategic Bomber - 10 min
     - Round 3: Loop Variant - 10 min
     - Group Reflection on Patterns (5 min)
  3. Phase 2: Stressing the Distinction (30 minutes)
     - Round 4: Causal Necessity - The Lazy Susan Case (10 min)
     - Round 5: Description-Dependent Cases (Physically Identical) - 10 min
     - Round 6: Close Causation - The Proximity Problem (10 min)
  4. Forced Choice and Tally (5 minutes)
  5. Debrief (10 minutes)

  **Materials:**
  - Case cards for each round (one for the decider, and one for the class to see)
  - Whiteboard or flip chart to record predictions and actual decisions, and to keep score
  - Tokens (or chits) for scoring: Each student starts with 10 tokens. Correct predictions earn a token, incorrect predictions lose a token. The decider does not participate in prediction but gets a token for each decision (to keep them engaged) and an extra token if the class prediction rate is below 50% (indicating a surprising decision).

  **Setup (10 minutes):**
  - Explain the activity: "Today we're going to play a game where we face a series of rescue dilemmas. In each round, one of you will be the Decider who must choose between two actions. The rest of the class will act as Predictors: you will try to guess what the Decider will choose. We'll keep score with tokens. The goal is to see if we can find patterns in our decisions."
  - Assign the first Decider randomly. Rotate the role so that 6-8 students get to be Decider (each round in Phase 1 and 2 will have a Decider).
  - Distribute tokens (10 per student).

  **Phase 1: Discovering the Distinction (35 minutes)**

  Round 1: Standard Trolley Problems (10 min)
  - **Case 1 (Switch):** A trolley is heading toward five workers. You can flip a switch to divert it to a side track with one worker. If you do nothing, five die. If you flip the switch, one dies.
  - **Case 2 (Fat Man):** A trolley is heading toward five workers. You can push a fat man off a bridge to stop the trolley. If you do nothing, five die. If you push, the fat man dies and the five are saved.
  - **Procedure:** 
    - Present Case 1. Decider chooses: Flip or Do Nothing. 
    - Predictors write their prediction (on a slip of paper) and hold it up. Record predictions (e.g., on board: how many predicted Flip, how many Do Nothing). 
    - Reveal the Decider's choice. 
    - Repeat for Case 2.
  - **Scoring:** Predictors: correct prediction -> gain a token; wrong -> lose a token. Decider: gains a token for making a decision.
  - **Expected Pattern:** Most will flip the switch in Case 1 but not push in Case 2. The "minimize deaths" rule would say both are permissible (or required) because both save five at the cost of one. But the pattern shows that we treat them differently.

  Round 2: Transplant vs. Strategic Bomber (10 min)
  - **Case 3 (Transplant):** You are a surgeon. Five dying patients need organ transplants. A healthy patient comes in for a checkup. You can kill the healthy patient and transplant his organs to save the five. If you do nothing, the five die. If you kill the one, you save five.
  - **Case 4 (Strategic Bomber):** You are a bomber pilot in a just war. You can bomb a munitions factory to end the war quickly, saving thousands of lives. The bomb will kill one civilian child nearby (foreseen but not intended). If you don't bomb, the war drags on and thousands die.
  - **Procedure:** Same as Round 1. Present one case at a time. Predict, decide, score.
  - **Expected Pattern:** Most will reject killing in Transplant but accept bombing in Strategic Bomber. Again, "minimize deaths" would say both are permissible, but the pattern diverges.

  Round 3: Loop Variant (10 min)
  - **Case 5 (Loop Trolley):** Like the switch case, but the side track loops back to the main track. If the one worker weren't there, the trolley would loop back and hit the five. So the one worker's body is needed to stop the trolley.
  - **Procedure:** Same.
  - **Expected Pattern:** Many will reject flipping the switch here, even though it's physically similar to the first switch case. This highlights that when harm is used as a means (the body is needed to stop the trolley), it becomes impermissible.

  Group Reflection (5 min): 
  - Ask: "What patterns do you see in our decisions? What rule might we be following that isn't just 'minimize deaths'?" 
  - Guide them to notice: We seem to avoid actions that use harm as a means to save, but we allow harm as a side effect. Do not name DDE yet.

  **Phase 2: Stressing the Distinction (30 minutes)**

  Round 4: Causal Necessity - The Lazy Susan Case (10 min)
  - **Case 6 (Lazy Susan):** Five people are tied to a rotating table (Lazy Susan) that is about to be hit by a poison dart. You can turn the table so that the dart hits one person instead of five. But turning the table requires the one person to be there to stop the dart (like the loop case). Without the one, turning wouldn't work. However, you are turning the table to get the five out of the way, and the one is hit as a side effect of that turning? (This is ambiguous and controversial.)
  - **Procedure:** Same. This case is designed to be tricky and to show that sometimes the means/side-effect distinction is blurry.
  - **Expected Pattern:** The room may split, showing that the rule is not always clear.

  Round 5: Description-Dependent Cases (10 min)
  - **Case 7 (Aim: Save the Five):** You are in a situation where you can press a button that will save five people in a room by diverting a threat, but the button also, as a side effect, causes a rock to fall in another room, killing one person. The rock falling is not part of the mechanism to save the five; it's just a side effect of pressing the button. (Permissible?)
  - **Case 8 (Aim: Kill the One to Save the Five):** Same physical setup, but now you are told: the button saves the five by causing the rock to fall on the one (because the rock falling triggers a switch that saves the five). So the death of the one is the means to save the five. (Impermissible?)
  - **Procedure:** Present both cases, but in random order. Emphasize that the physical setup is identical; only the description of how it works changes.
  - **Expected Pattern:** Decisions should flip based on the description, showing that the agent's intention (or the description of the causal chain) matters. This highlights that the distinction may be too dependent on mental states.

  Round 6: Close Causation - The Proximity Problem (10 min)
  - **Case 9 (Proximity):** You can save five people by administering a drug. The drug has a side effect: it will cause a severe reaction in one person (who is not one of the five) that will kill them. However, the reaction is direct and immediate: the drug is metabolized and then triggers a heart attack in the one. Is this merely a side effect? Or is it too close to being part of the means? (This case is designed to test how close the side effect can be to the action before it feels like a means.)
  - **Procedure:** Same.
  - **Expected Pattern:** Controversy. Some may see it as a side effect, others as too direct.

  **Forced Choice (5 minutes):**
  - Present the pattern: In the first phase, we found a rule that fit our intuitions: don't cause harm as a means, but you may cause harm as a foreseen side effect. But in the second phase, we saw cases where:
    - The rule becomes ambiguous (Lazy Susan).
    - The rule depends on how we describe the case (Description-Dependent).
    - The rule might allow very direct harms if called "side effects" (Proximity).
  - Force the room to choose: 
    - Option A: Stick with the rule and accept that in Lazy Susan, it might be permissible to turn the table; in the description-dependent case, the permissibility depends on the agent's intention; and in the proximity case, it's permissible because it's a side effect.
    - Option B: Abandon the rule and go back to minimizing deaths (which would require allowing the Fat Man and Transplant cases) or some other rule.

  **Debrief (10 minutes):**
  - Reveal: The rule we were wrestling with is called the Doctrine of Double Effect. It states that an action with both good and bad effects is permissible if:
    1. The action itself is good or neutral.
    2. The agent intends only the good effect (the bad effect is not intended).
    3. The bad effect is not the means to the good effect.
    4. There is proportionality (the good effect outweighs the bad).
  - Map the activity:
    - Phase 1: We saw that we naturally follow a rule that forbids harm as a means (Transplant, Fat Man, Loop) but allows harm as a side effect (Switch, Strategic Bomber). This corresponds to conditions 2 and 3 of DDE.
    - Phase 2: We saw challenges:
      - Lazy Susan: Condition 3 (means vs. side effect) is ambiguous. (Objection: the distinction is vague.)
      - Description-Dependent: Condition 2 (intention) is doing too much work. (Objection: the doctrine is too sensitive to the agent's mental state and may allow moral luck.)
      - Proximity: Condition 3 might be too permissive if "side effect" includes very direct harms. (Objection: the doctrine fails to capture the moral significance of causal proximity.)
  - Conclude: DDE captures a real intuition (as we felt in Phase 1) but faces serious challenges (as we saw in Phase 2).

  **Predictable Failure Modes:**
  1. **Time Management:** The rounds might run long. Solution: Use a timer and be ready to cut discussion short. If a round runs over, skip the reflection until the end.
  2. **Decider Anxiety:** Students might feel pressured as the decider. Solution: Emphasize that there are no right answers and it's about exploring intuitions. Rotate quickly.
  3. **Prediction Bias:** Students might conform to the majority. Solution: Have them write predictions privately and reveal simultaneously.
  4. **Over-Simplification:** Students might try to force a simpler rule. Encourage them to sit with the discomfort of the ambiguity.
  5. **Dominant Voices:** A few students might dominate. Use the prediction mechanism to engage everyone.

  **One Feature the Activity Cannot Reproduce:**
  - The activity focuses on hypothetical cases with no real stakes. In real life, the emotional weight and the gravity of actual harm might alter the intuitions. The activity cannot reproduce the visceral moral experience of a real-life dilemma. You will need to supply this in the debrief: note that DDE is often invoked in high-stakes contexts (like medical ethics or war) and that our classroom exercise, while revealing cognitive patterns, doesn't capture the full emotional and moral weight.

  **Final Polish:**
  - The activity fits 90 minutes: 
    - 10 min setup
    - 35 min Phase 1 (3 rounds × 10 min + 5 min reflection)
    - 30 min Phase 2 (3 rounds × 10 min)
    - 5 min forced choice
    - 10 min debrief
  - The scoring (tokens) adds engagement without real money.
  - The cases are chosen to push beyond standard examples (Loop, Lazy Susan, Description-Dependent, Proximity).
  - The debrief explicitly maps the activity to the doctrine and objections.

