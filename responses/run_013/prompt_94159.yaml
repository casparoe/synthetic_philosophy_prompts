answer: |-
  ### Thought Experiment: The Conservation of Quarge  
  **Designed to challenge the assumption that anti-Humeans always end up with more laws than Humeans.**

  #### **Regularity R**:  
  In the universe, the total amount of "quarge" (a fundamental, conserved scalar property of particles, analogous to charge but independent of mass, energy, or momentum) is conserved over time. At every moment in the universe's history, the sum of quarge across all particles remains constant. Quarge is quantized (e.g., integer-valued), and interactions between particles can transfer quarge, but the universe's initial quarge was set such that—despite the dynamical laws allowing non-conservation—the actual history never deviates from total conservation. This regularity is exceptionless, global, and simple to state (e.g., "Total quarge is conserved").

  #### **World Description**:  
  - **Single universe**, finite in time and space, containing \(10^{100}\) particles.  
  - **Dynamical laws**: Newtonian mechanics with a complex, non-conservative force function for quarge (i.e., the equations of motion permit quarge to change in interactions, similar to how friction can violate energy conservation in Newtonian physics).  
  - **Quarge behavior**: Quarge is transferred during particle collisions, but the specific initial conditions (initial quarge distribution and particle trajectories) are "fine-tuned" so that total quarge is conserved in every interaction. For example, in every collision, quarge changes between particles exactly offset each other, but this is not enforced by the force function—it's a contingent fact about the actual history.  
  - **Simplicity and strength**: Stating R as an axiom requires only a few bits of information (e.g., "total quarge = constant"), and it dramatically reduces the set of possible histories (ruling out all non-conserving trajectories). Without R, the best system would need to describe the chaotic, non-conserving force function in detail, making it far more complex.  
  - **Pre-theoretic intuition**: To a normal person, R appears law-like—it's a universal, unwavering pattern that "governs" particle behavior (e.g., scientists would treat it as a conservation law akin to energy or momentum).

  ---

  ### **Verdicts and Reasoning**  
  #### **Humean Verdict: R is a law**  
  - **Reasoning**: The best-system analysis (BSA) optimizes simplicity and strength. The dynamical laws alone are complex (describing the non-conservative forces requires many equations). Adding R as an axiom simplifies the system immensely: it compresses the description of the universe by replacing vast amounts of trajectory data with one simple principle. R also adds tremendous strength, as it predicts and explains why quarge is conserved in all observed interactions. Since R cannot be derived from the dynamical laws (they allow non-conservation) and stands as an independent axiom, it earns its place in the best system. Thus, by BSA criteria, R is a law.  
  - **Key point**: Humeanism evaluates laws based on their role in compressing and summarizing the mosaic. R’s simplicity and explanatory power make it indispensable.

  #### **Anti-Humean Verdict: R is not a law**  
  - **Reasoning**: Anti-Humeans (e.g., proponents of governing relations or natural necessity) hold that laws must be grounded in fundamental, non-Humean structures that *make* regularities necessary and support counterfactuals. R fails this test:  
    - **Not grounded in governing relations**: The dynamical laws (which govern particle motion) do not entail R—they allow quarge non-conservation. R is merely a contingent boundary condition: it results from the initial quarge distribution and fine-tuned particle interactions, not from any law-like "governor."  
    - **Lacks nomic necessity**: R could have been false without changing the dynamical laws (e.g., with different initial conditions, quarge might not conserve). Thus, it cannot support counterfactuals like "If two particles collided differently, quarge would still conserve."  
    - **Accidental generality**: R is a cosmic coincidence—a "global accident" arising from specific initial conditions. Anti-Humeans distinguish between genuine laws (which actively constrain reality) and mere patterns that "float free" of governance. R is the latter.  
  - **Key point**: Anti-Humeanism requires more than regularity; it demands a *reason* (e.g., a symmetry or dynamical constraint) for why a pattern holds. R has no such reason.

  ---

  ### **The Single Feature F: Non-Derivability from Dynamical Laws**  
  - **Definition**: R is not entailed by or reducible to the dynamical laws of the system. The force function allows quarge non-conservation, so R’s truth is independent.  
  - **Why F is the hinge**:  
    - For Humeans, F is irrelevant—they care only about R’s simplicity/strength.  
    - For anti-Humeans, F is decisive—laws must be integrated with governance, so non-derivability makes R accidental.  
  - **Flipping F (to derivability) makes both sides agree R is a law**:  
    - Alter the world so the dynamical laws *entail* quarge conservation (e.g., via a symmetry like Noether’s theorem). Now:  
      - Humean: R is still simple/strong and part of the best system.  
      - Anti-Humean: R is now grounded in the dynamical laws’ governance, making it necessary.  
    - **Result**: Both agree R is a law.  
  - **Flipping another feature (simplicity) leaves disagreement intact**:  
    - Alter R to be complex (e.g., "Total quarge increases by 1 every millennium"), while keeping F fixed (non-derivable). Now:  
      - Humean: Excludes R from the best system—it’s too complex to add net strength.  
      - Anti-Humean: Still denies R is a law—it’s not derivable and remains accidental.  
    - **Result**: Both agree R is *not* a law—disappearance of disagreement.  
    - **Flipping a second plausible feature (universality) leaves disagreement intact**:  
      - Alter R to hold only in a spatiotemporal region (e.g., "Quarge conserves only in the Milky Way"), while keeping F fixed. Now:  
        - Humean: Excludes R—limited scope reduces strength, so it doesn’t simplify the system.  
        - Anti-Humean: Still denies R is a law—non-derivability and lack of governance persist.  
      - **Result**: Both agree R is *not* a law—disappearance of disagreement.  
    - **Flipping a feature that preserves disagreement**: Change the *form* of the dynamical laws (e.g., from Newtonian to relativistic), but keep F fixed (R still non-derivable) and R simple/universal. Now:  
      - Humean: Still includes R in the best system—it remains simple/strong.  
      - Anti-Humean: Still denies R is a law—non-derivability still implies accidentality.  
      - **Result**: Disagreement persists, as F is unchanged.  

  **Conclusion on F**: The disagreement solely hinges on F (non-derivability). Flips of other features (simplicity, universality) eliminate disagreement, while changes preserving F maintain it.

  ---

  ### **Honest Assessment: Which Side Cheats?**  
  - **Humean**: Risks "cheating" by inflating laws—R looks like a brute accident, but BSA calls it a law due to descriptive efficiency. This might seem like a *post hoc* justification for counting any simple pattern as law-like.  
  - **Anti-Humean**: Risks "cheating" by circularity—they decree that only derivable regularities are laws, but this assumes their view of governance. However, they avoid fiat by pointing to F: R’s non-integration with dynamics makes it unsuited for governance.  
  - **Verdict**: The **Humean cheats more**. They prioritize elegance over metaphysical grounding, potentially mistaking cosmic accidents (like R) for laws. The anti-Humean has a principled reason (F) tied to their core claim that laws require governance.

  ---

  ### **Defense as the Anti-Humean's Lawyer: Can R Be a Law?**  
  **Argument for R as a law**:  
  - R is simple, universal, and exceptionless—exactly how laws manifest in science (e.g., conservation of energy). Denying it seems pedantic. Anti-Humeans should accept R as a *fundamental governing relation* in its own right, independent of dynamics. For instance:  
    - Quarge conservation could be a primitive law, akin to how some theories treat charge conservation.  
    - This avoids dismissing a robust pattern and respects pre-theoretic intuition.  
  - **Why it might work**: If anti-Humeanism allows multiple fundamental laws (e.g., dynamical + conservation laws), R could be added without inconsistency.  

  **Why it fails and collapses into Humeanism**:  
  - **Collapse risk**: If anti-Humeans accept R *because* it is simple and strong (ignoring non-derivability), they adopt the Humean’s criteria. This erodes their view, as *any* simple/strong regularity (e.g., "All particles are green") could then be a law—conflating governance with descriptive utility.  
  - **No escape**: Anti-Humeans must explain *why* R governs. Without derivability or a symmetry, they lack resources—positing R as a "governor" is ad hoc. If they appeal to intuition (R "feels" law-like), they become covert Humeans.  
  - **Result**: The argument fails. R cannot be a law without abandoning anti-Humeanism’s core (governance requires integration).  

  **Conclusion for the lawyer**: The defense is unstable; it either capitulates to Humeanism or invokes circularity. Anti-Humeans should stand firm: R is not a law.

  ---

  ### **Overall Viability**  
  - **Not rigged**: The case works without stacking the deck:  
    - R seems law-like pre-theoretically.  
    - Anti-Humeans deny R based on F (non-derivability), not fiat.  
    - The verdict pattern is robust under flips of F.  
  - **Seminars use**: Kills the assumption that anti-Humeans always have *more* laws. Here, the Humean counts R as law, but the anti-Humean does not—showing anti-Humeanism can be *stricter*.  
  - **Caveat**: Success depends on anti-Humeans requiring derivability (a common but not universal view). If some anti-Humeans reject this, the case may need tweaking—but it holds for standard versions (e.g., Maudlin, Armstrong). 

  **Final takeaway**: This thought experiment forces a choice: should laws summarize patterns (Humean) or govern reality (anti-Humean)? R exposes that anti-Humeans can be more discerning, not more permissive.
