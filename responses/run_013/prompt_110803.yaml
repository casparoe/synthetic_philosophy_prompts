prompt: |-
  I'm a PhD student working on the histriography of the French Revolution, and I'm trying to think through a case for a chapter. Take the fall of Robespierre on 9 Thermidor — the Convention turning on the Committee of Public Safety, the arrests, the executions — and analyse it through three lenses: class struggle, ideology, and contingency. Then test a pet theory of mine against it. Call it the revolutionary ratchet: the claim that revolutions devour their children not because of ideology or class but because each victorious faction can only prove its revolutionary sincerity by out-denouncing the last, so the coalition necessarily narrows until it turns on itself. Does the ratchet explain Thermidor better than the standard three? Where does it break — does it definately predict who gets devoured, or just that someone will? And what does the episode show about the ratchet thesis itself, not just the other way round? I don't need readings or citations, just the mapping. Write it in British English.
reasoning: |-
  Okay, the user is a PhD student focusing on the historiography of the French Revolution. They want to explore the fall of Robespierre (9 Thermidor) through three lenses: class struggle, ideology, and contingency. Then, they want to test their "revolutionary ratchet" theory against these standard approaches. The ratchet theory suggests that revolutions consume their children because each faction must out-deny the previous one to prove revolutionary sincerity, leading to a narrowing coalition until it self-destructs. 

  First, I need to break down the Thermidor event through each lens. For class struggle, it's about the bourgeoisie vs. sans-culottes and the shifting alliances. The bourgeoisie in the Convention felt threatened by Robespierre's push for economic controls and the Terror, which they saw as destabilizing their property interests. The sans-culottes were sidelined, leading to a bourgeois consolidation of power. 

  Next, ideology: Robespierre's faction promoted virtue and the Cult of the Supreme Being, but their moral rigidity alienated others. The Dantonists and Hébertists were purged earlier, leaving Robespierre isolated. His vague accusations of corruption and conspiracy made even allies fear they'd be next. The ideological purity became a liability when he couldn't adapt to practical governance. 

  Contingency focuses on the unpredictable factors. Robespierre's illness weakened his position, missteps in his speech to the Convention gave opponents an opening, and the tactical errors by his supporters like Saint-Just. The chaotic arrest and failed mobilization in Paris show how random events tipped the scales. 

  Now, applying the revolutionary ratchet theory. The ratchet effect explains the spiral of purges: each victory requires proving greater zeal, so factions keep denouncing each other until the coalition implodes. Robespierre had already purged the Hébertists (ultra-radicals) and Dantonists (moderates), leaving no one to trust. The Thermidorians turned on him to preempt their own purge. The ratchet predicts the inevitability of self-destruction but not who specifically falls—it could have been others. 

  Testing the ratchet against the other lenses: it complements them by explaining the mechanism behind the purges, but it doesn't account for class interests or ideological conflicts fully. Contingency reminds us that outcomes aren't predetermined; the ratchet sets the stage but doesn't dictate the exact players. 

  The user's deeper needs: They want to validate their theory's robustness. By mapping it against established frameworks, they're assessing if the ratchet offers a superior explanation or needs refinement. They might be seeking a novel angle for their chapter, showing how the ratchet synthesizes or challenges traditional views. Also, highlighting the ratchet's limitations (e.g., unpredictability of who falls) adds academic rigor. 

  British English: Using "analyse" instead of "analyze," "centre" instead of "center," and terms like "whilst" and "amongst." Ensuring formal yet accessible language suitable for a PhD thesis. 

  Finally, structuring the response to first dissect Thermidor through each lens, then apply the ratchet, compare it, and reflect on what the event reveals about the theory. Emphasizing that the ratchet explains the cyclical self-destruction pattern but relies on context (class, ideology) to ignite and contingency to determine specifics.
answer: |-
  Here's a mapping of your Thermidor chapter analysis and the "revolutionary ratchet" test, in British English:

  **I. Standard Lenses Applied to 9 Thermidor:**

  1.  **Class Struggle:**
      *   **Focus:** Shifts in the revolutionary coalition's class base.
      *   **Analysis:** The bourgeoisie within the Convention (especially the *Plain* and emerging *Thermidorians*) feared Robespierre's alliance with the *sans-culottes* (artisans, urban poor) and his rhetoric against excessive wealth. His push for economic controls (e.g., *Maximum* laws) and reliance on popular pressure threatened bourgeois property interests and political control. Thermidor represented the bourgeoisie reasserting dominance, sidelining the more radical popular elements and ending the Terror's threat to property.
      *   **Thermidor Explained:** A bourgeois counter-revolution within the revolution, reclaiming power from a faction perceived as pandering to the lower orders.

  2.  **Ideology:**
      *   **Focus:** Conflict between revolutionary principles, purity, and pragmatism.
      *   **Analysis:** Robespierre's faction (The Mountain/Incorruptibles) pursued an uncompromising vision of republican virtue enforced by the Terror. This alienated others:
          *   **Moderates:** Saw the Terror as morally bankrupt and politically destabilising.
          *   **Practical Politicians:** Resented Robespierre's moralising and the power of the Committee of Public Safety.
          *   **Survivors of earlier purges:** Feared being next on charges of "moderantism", "corruption", or insufficient zeal. Robespierre's vague accusations in his 8 Thermidor speech provided the catalyst.
      *   **Thermidor Explained:** The triumph of revolutionary pragmatism and self-preservation over ideological extremism and moral absolutism. The Revolution consuming its most zealous proponent.

  3.  **Contingency:**
      *   **Focus:** The role of accidents, missteps, and individual actions.
      *   **Analysis:** Highlights specific, unpredictable factors:
          *   Robespierre's physical exhaustion and illness weakening his grip.
          *   His disastrously vague speech on 8 Thermidor, failing to name names but alienating potential allies.
          *   Saint-Just being shouted down during his defence speech.
          *   The chaotic, improvised nature of the arrest order.
          *   The failure of the Paris Commune to mobilise effectively overnight.
      *   **Thermidor Explained:** Not an inevitable outcome of structure or ideology, but the result of specific blunders, tactical errors, and moments of chaos that tipped the balance against Robespierre at that precise moment. It *might* not have happened *then*, or *that way*.

  **II. Testing the "Revolutionary Ratchet" Thesis:**

  *   **The Thesis:** Revolutions devour their children due to a self-reinforcing dynamic: each victorious faction must prove its revolutionary *bona fides* by denouncing and purging the *previous* dominant faction as insufficiently radical or counter-revolutionary. This creates a ratchet effect: the coalition narrows, ideological demands intensify, and suspicion deepens until the remaining core inevitably turns on itself. Proof of commitment is always exceeding the previous purge.
  *   **Applying to Thermidor:**
      *   **The Ratchet in Action:** Robespierre himself embodied the ratchet. He helped purge the Girondins (moderates), then the Hébertists (ultra-radicals), then the Dantonists (indulgents). Each purge narrowed the ruling group and raised the stakes. By Thermidor, Robespierre *was* the dominant faction. To prove their own revolutionary purity/survival, others (Tallien, Barras, Fouché, Collot d'Herbois – many complicit in earlier Terror) *had* to denounce *him* as the new counter-revolutionary threat. His vague threats on 8 Thermidor were the spark, but the ratchet created the tinder.
      *   **Explanatory Power:** This lens powerfully explains the *dynamic* leading to self-destruction. It transcends specific class interests (though it interacts with them – the bourgeoisie used the mechanism) and ideology (the *form* of denunciation uses ideological language, but the *drive* is the ratchet dynamic). It directly addresses *why* coalitions inevitably fracture.
      *   **Predictive Power - Who Gets Devoured?** The ratchet predicts *that* the dominant faction/person will *eventually* be devoured, as they become the only remaining target for proving revolutionary zeal. It strongly suggests *who* is *vulnerable* – the current leadership. However, it **cannot definitively predict *exactly* who** (Robespierre *or* another leading figure) or *precisely when* (contingency matters). It creates the context and pressure, but the trigger and target selection involve contingency and existing alliances/fears.
      *   **Where it Breaks:** The ratchet explains the *process* of narrowing and inevitable internal conflict, but:
          *   It doesn't *fully* account for the *initial composition* of the coalition (where class/ideology play in).
          *   It doesn't explain the *specific ideological content* of the denunciations (why "virtue" vs. "moderation" etc. - ideology provides the language).
          *   It relies on contingency for the *timing and execution* of the final act (as seen in Thermidor).

  **III. What Thermidor Reveals About the Ratchet Thesis:**

  Thermidor isn't just a case *for* the ratchet; it's a case that *illuminates* the thesis:

  1.  **Validation of Core Mechanism:** Thermidor is a near-textbook example of the ratchet in its final stage: the dominant figure (Robespierre) becomes the necessary target for the next purge by the remnants of the coalition, using the same logic of revolutionary purity/survival he employed.
  2.  **Highlights Interaction:** Thermidor shows the ratchet *doesn't operate in a vacuum*. It interacted with:
      *   **Class:** The bourgeoisie used the ratchet dynamic to remove a leader threatening their interests.
      *   **Ideology:** The language of denunciation was intensely ideological ("tyrant", "counter-revolutionary").
      *   **Contingency:** Robespierre's mistakes were the proximate cause; the outcome wasn't mechanically guaranteed *on that day*.
  3.  **Reveals the Endgame:** Thermidor demonstrates the logical conclusion: the ratchet *can* lead to the *overthrow* of the Terror system itself. The Thermidorians initially used the ratchet logic ("Robespierre the tyrant"), but the dynamic then shifted as the Revolution moved into a different phase (reaction, Directory). The ratchet seems most intense in the radical/terror phase.
  4.  **Limitation:** Thermidor underscores the thesis's limitation in predicting the *specific* target within the leadership core. Why Robespierre and not Saint-Just or Couthon as the primary focus? Contingency (Robespierre's speech, his central role) and existing power structures within the Committee/Convention played a part the ratchet alone doesn't dictate.

  **Conclusion Mapping:**

  *   The standard lenses (Class, Ideology, Contingency) offer crucial context but struggle to fully explain the *inevitable, cyclical self-destruction* inherent in the radical phase.
  *   The **Revolutionary Ratchet** thesis provides a compelling dynamic mechanism explaining *why* revolutionary coalitions narrow and *must* eventually consume their leadership. It explains the *process* better than the standard lenses alone.
  *   Thermidor is a **strong validation** of the ratchet's core premise regarding the *why* and *who* (the dominant figure/group becoming the target).
  *   However, Thermidor also **reveals the ratchet's dependencies:** It operates *through* ideological language, is *exploited* by class interests, and requires **contingency** for its *specific timing and exact execution*. It predicts vulnerability and eventual consumption of the leadership, but not the finest details of the *who* and *when*.
  *   **Overall:** The ratchet offers a powerful *synthetic* explanation for the self-destructive dynamic observed in Thermidor, complementing rather than wholly replacing the other lenses, while Thermidor serves as a defining case study illuminating both the ratchet's explanatory power and its operational boundaries.
