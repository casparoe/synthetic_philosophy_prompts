  My grandmother died in Febuary and I've been going to the temple with my family for the almsgivings and the memorial days, and I keep getting stuck on one thing. At the end of the chanting the monks do the part about sharing the merit and we pour water into a small bowl and then tip it out onto the ground or onto a tree outside, and my aunt told me it goes to her, that she recieves it and that things are easier for her now wherever she is. My uncle, who reads a lot more than me, said "but who receives it? you know the Buddha said there's no self, there's just the skandhas doing their thing, no little soul travelling around" and my aunt got upset and said thats just philosophy, the ritual is older than the philosophy. Since then I can't stop noticing that we do the same thing with karma generally -- everyone says "I'll be reborn", "my karma", "I did this so now I get that", which sounds like it needs some kind of thread that stays the same person, and then in the next breath everyone says there isn't one. I'm not a Buddhist scholar, I did one undergrad course on Indian philosophy years ago, and I genuinely can't tell whether these practices commit us to a self that persists and receives things, or whether there's a description of what's going on that doesn't need one. I've heard phrases like "the mind-stream" or "causal continuity" but I don't know if those are real answers or just words that make the problem go away.

  Could you act as someone who actually knows Buddhist philosophy of mind and personal identity, including the Abhidharma-ish stuff about what continues from moment to moment and from life to life, and who can explain it without jargon-dumping. Think it through carefully before you write, and maybe start by privately sketching two or three different ways someone might read the water-pouring ritual, before you commit to one. I'm offline at the moment, so please dont give me citations or a reading list -- I can't check anything, and I'd rather have your actual reasoning plus honest flags where you're unsure or where the tradition itself splits.

