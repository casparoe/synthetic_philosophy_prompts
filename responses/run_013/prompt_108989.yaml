answer: |-
  ### **The practice as I see it**  
  You pour water while monks chant, symbolically transferring merit (positive spiritual "energy" from good deeds) to your deceased grandmother. Your aunt says this eases her post-death experience. But your uncle notes the Buddha’s core teaching: there’s no permanent "self" (ātman), only ever-changing physical/mental processes (skandhas). The tension arises when merit-transfer rituals—and phrases like "my karma" or "I’ll be reborn"—seem to imply a stable recipient, while Buddhist philosophy denies such a thing exists.

  ---

  ### **The obvious presupposition**  
  At face value, the ritual *appears* to require a persisting entity—a "soul-like" grandmother—who receives merit in an afterlife or between lives. This would clash with Buddhist doctrine in two ways:  
  1. **No fixed self**: The Buddha rejected the idea of an unchanging essence (ātman) that migrates across lives. You are a dynamic bundle of aggregates (form, sensation, perception, mental formations, consciousness) that reconfigure at rebirth, not a stable "you."  
  2. **No independent receiver**: If merit were a "thing" sent to a "thing," it would violate teachings on emptiness (lack of inherent existence) and dependent arising (all phenomena depend on causes/conditions).  

  This view would quietly rule out strict non-Buddhist soul-theories (e.g., Hindu ātman) or even naive Buddhist folk beliefs in a permanent self. It *seems* to demand a contradiction: a recipient that doesn’t exist doctrinally.

  ---

  ### **Does the ritual actually need it?**  
  No—the ritual can function without a "self" by relying on **causal continuity** and **conventional truth**:  
  - **Causal continuity (mind-stream)**: What continues across moments (and lives) isn’t a "self," but a flow of causes and effects. Consciousness is like a flame passed candle-to-candle: no identical essence, but continuity of process. Your grandmother’s final mental state (at death) conditioned her next rebirth. Merit dedicated *to her* influences this causal chain by:  
    - Altering the conditions for *her* continuum’s next manifestation (e.g., easing suffering in her rebirth realm).  
    - Strengthening *your* wholesome mental states (loving-kindness), which indirectly affects her continuum through karmic interdependence.  
  - **Conventional vs. ultimate truth**:  
    - *Conventionally*: We speak of "grandmother receiving merit" as shorthand, like saying "the sun rises." It’s pragmatically valid for moral/ritual purposes.  
    - *Ultimately*: No "grandmother" exists independently—only interconnected processes. Merit is not a substance but a **habit-energy** in the mind-stream. Pouring water symbolizes letting go of attachment while reinforcing intentions of generosity.  
  - **Karma without a "self"**: "My karma" means "actions arising *in this continuum* have consequences *for this continuum*." Rebirth isn’t "me" moving houses—it’s the persistence of cause-effect patterns. Think of a river: no fixed "identity," but pollution upstream affects downstream.  

  The ritual works through **intention**: Your goodwill creates karmic ripples across the web of conditions, benefiting specific continua without needing a metaphysical recipient.

  ---

  ### **Rival readings**  
  1. **Smuggled-in self**: Some scholars argue that popular Buddhism *does* imply a subtle self (e.g., as "consciousness" or "gandhabba" between lives). Evidence: rituals like yours, rebirth narratives, and terms like "sentient being" (*sattva*). If so, this is a doctrinal inconsistency—ritual predates philosophy and retains pre-Buddhist assumptions.  
  2. **Two truths in tension**: Theravāda/Mahāyāna schools all use "two truths," but some (like Yogācāra) emphasize mind-stream continuity more than others. Evidence: Tibetans describe consciousness as "very subtle" and continuous; Theravādins focus on moment-to-moment causal links.  
  3. **Ritual as psychology**: Modernists say merit-transfer chiefly benefits *the living*—cultivating compassion, reducing grief. "Grandmother" is a mental object for focus. Evidence: monks often say rituals "train the mind."  

  Evidence for a no-self-compatible reading: Consistency with core sutras (e.g., *Anattalakkhaṇa Sutta*), and philosophers like Buddhaghosa/Nāgārjuna explaining rebirth sans self. Evidence against: Folk practices sometimes ignore philosophy.

  ---

  ### **Where it's underdetermined**  
  The ritual alone can’t settle:  
  - *How exactly* merit "reaches" the deceased. Is it symbolic? A law of karma? A mental act?  
  - Whether rebirth is immediate or requires an "intermediate state" (accepted in Tibetan Buddhism, denied in Theravāda).  
  - How to perfectly reconcile poetic ritual language with abstract philosophy.  

  Buddhism offers frameworks, not empirical answers. The practice validates intention; metaphysics is inferred.

  ---

  ### **Bottom line**  
  **To your aunt**: "The ritual works—your love creates real change in the interconnected web of existence. It eases her continuum’s journey, wherever it is."  
  **To your uncle**: "You’re right: no static self ‘receives’ merit. But causal continuity allows merit to influence *her* ever-changing mental stream across lives."  
  **Are they disagreeing?** Yes—but on philosophy, not compassion. Your aunt speaks the language of the heart (conventional truth); your uncle, the head (ultimate truth). The ritual holds both.  

  *(Word count per section: Practice 90, Presupposition 240, Explanation 420, Rivals 300, Underdetermined 110, Bottom line 95)*
