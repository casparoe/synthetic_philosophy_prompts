  The core tension is between their premise (1) - that credit requires making a difference - and the real-world cases where both discoverers seem to deserve credit despite redundancy. Step (5) is where it collapses into absurdity: if we accept (1)-(4), then nobody deserves credit for anything because someone else could always have done it later. But we know that's not how we actually assign credit (step 6).

  Hmm... The overdetermination analogy (two arrows) is smart but tricky. In discovery cases, it's not truly simultaneous like arrows hitting a target - the discoveries happen independently but are revealed at particular moments. The "making a difference" premise might be the real culprit here. 

  Let me think about historical examples. With Newton and Leibniz, there was a nasty priority dispute, while Darwin and Wallace handled it gracefully. But in both cases, we credit both. That suggests the social aspect matters - publication, communication, influence - not just the bare fact of discovery. The user's premise (1) ignores this by focusing only on counterfactual existence ("if they hadn't existed"). 

  What if we reframe "making a difference" to include influencing how knowledge enters the world? Then even if Wallace would have published later without Darwin, Darwin accelerated the process through his networks and detailed work. That preserves the intuition that someone else might have done it, while giving credit for actually doing the work and shaping the discourse.

  The user worries about luck - if we abandon (1), how do we distinguish true discoverers from bystanders? Well, we can require active contribution: formulating the idea, documenting it, sharing it. A bystander might have the capability but never acts. That handles the "could have" problem in (5) by focusing on actual contribution rather than hypotheticals.

  For the historical cases: Newton/Leibniz might differ from Darwin/Wallace in how they disseminated ideas, but both pairs did the substantive work independently. The priority dispute doesn't change their contributions, only how we retroactively assign credit - which supports the idea that credit is partly social.

  So the weak step is likely (1), but we can modify rather than reject it entirely. Replace the counterfactual existence test with a contribution test. This costs the user a clean philosophical definition, but gains a realistic view of scientific credit that matches our actual practices. The residue of the argument shows credit isn't just about necessity, but about actual intellectual labor and communication. That's not mysterious - it's how academia works.
answer: |-
  Your argument is admirably clear, and the corner you've argued yourself into is a recognised philosophical puzzle about credit and overdetermination. The weak step is **premise (1)**, though it needs refinement rather than outright rejection. Let's diagnose this step-by-step, using British English as requested:

  ### Step-by-Step Diagnosis:
  1. **The Core Problem: Premise (1) is Overly Stringent**  
     Your premise (1) states: *"To deserve credit for a discovery, a person must have made a difference: if that person had not existed, the discovery would not have been made, or at least would not have been made when it was."*  
     - **Why it’s plausible**: It aligns with intuitive notions of "making a contribution" and avoids giving credit to lucky bystanders.  
     - **The flaw**: It reduces credit to *necessity* (counterfactual dependence), ignoring *sufficiency*. In overdetermined cases (like two arrows hitting a target), *both* actors are sufficient causes. Credit should reflect *actual contribution*, not just whether the outcome *required* them.  

  2. **Reconciling (2) and (6): Overdetermination and Credit**  
     - **Step (2)** is historically sound for both cases: Newton/Leibniz and Darwin/Wallace were genuinely independent.  
     - **Step (6)** is also correct: Both pairs deserve credit.  
     - **The key**: *Credit is not zero-sum*. We credit *achievement*, not just causal indispensability. If two people independently solve a puzzle, both deserve applause—even if one "could have" done it alone.  

  3. **Why (3) and (4) Fail: The Misstep**  
     - From (1) and (2), you infer (3): *"Neither made a difference"*. This confuses *difference-making* (counterfactual necessity) with *creditworthiness*.  
     - **The fix**: Replace "making a difference" with "making a *sufficient* contribution". Newton *did* make the discovery; so did Leibniz. That they weren’t *necessary* doesn’t negate their *actual* intellectual labour.  

  4. **Dissolving (5): Not All Discoveries Are Overdetermined**  
     - (5) claims that if (1)–(4) hold, *nobody* deserves credit for anything, as an "unactualised discoverer" could always exist.  
     - **Why this fails**: Not all discoveries are ripe for overdetermination. Many rely on rare insights, unique data, or serendipity (e.g., Einstein’s relativity). Even for "inevitable" discoveries (e.g., calculus), credit goes to those who *actually did the work*.  

  5. **The Role of Luck**  
     You worry that rejecting (1) "lets in a great deal of luck". But luck is inherent in discovery: being first often involves timing and circumstance. Credit, however, hinges on *what you did*, not whether others *could have* done it. A "talented bystander" who *nearly* discovers something but never shares an idea deserves no credit; Newton, who derived calculus and published it, does.  

  ### Historical Cases: Calculus vs. Natural Selection
  | **Aspect**               | **Newton vs. Leibniz**                                   | **Darwin vs. Wallace**                                   |  
  |--------------------------|----------------------------------------------------------|----------------------------------------------------------|  
  | **Independence (Step 2)**| Both developed calculus independently (1670s-1680s).    | Both conceived natural selection independently (1850s). |  
  | **Priority Dispute**     | Bitter dispute; Newton accused Leibniz of plagiarism.    | No dispute; Darwin and Wallace jointly announced (1858). |  
  | **Why Credit Differs?**  | Dispute doesn’t change independent achievement.          | Joint announcement reinforces shared credit.             |  
  | **Key Insight**          | Both deserve credit *despite* the dispute.               | Both deserve credit *because* of mutual recognition.     |  

  ### What Should You Give Up?  
  - **Reject the strict counterfactual in (1)**. Replace it with:  
    *"To deserve credit for a discovery, a person must have arrived at the discovery through their own intellectual labour and communicated it (or been prepared to)."*  
  - **Retain the core insight**: Credit requires *actual contribution*, not hypothetical indispensability.  

  ### Costs of Abandoning Strict (1):  
  1. **Luck is acknowledged**: Timing, resources, and competition affect who gets credit, but we still credit *achievers*, not just "necessary" actors.  
  2. **Credit becomes pluralisable**: Multiple discoverers can share credit (as in both historical cases).  
  3. **Bystanders are excluded**: A "talented bystander" who never develops or shares an idea deserves no credit—only those who *act* on their insights.  

  ### The Residue: Resolving the Ambiguity  
  The argument exposes an ambiguity in "making a difference". In discovery, "difference" should mean:  
  - **Causal role**: Did they *actually* produce the discovery? (Yes, in both pairs).  
  - **Not counterfactual necessity**: Would history be unchanged without them? (Irrelevant to credit).  

  This isn’t mysterious—it reflects how credit works in practice. The Royal Society credited both Newton *and* Leibniz; the Linnean Society honoured Darwin *and* Wallace. We celebrate *achievement*, not inevitability.  

  ### To Answer Your Final Questions:  
  - **If you keep (1)**, you must deny credit to both in each pair—but this contradicts historical consensus and moral intuition.  
  - **If you reject (1)** (as revised), you can distinguish discoverers from bystanders by requiring *actual intellectual work and communication*.  
  - **The residue** points to an ambiguity (sliding from "sufficiency" to "necessity"), not a deep mystery. Overdetermination shows credit can be shared, not erased.  

  In short: credit rewards *doing*, not merely being essential. Abandon the counterfactual straitjacket—Darwin and Wallace both earned their place in history, as did Newton and Leibniz, priority disputes or not.
