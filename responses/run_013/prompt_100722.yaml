prompt: |-
  You are an analytic philosopher of religion with a strong background in classical Islamic theology (kalām). I want you to help me stress-test a position rather than defend it. Take the following view seriously and play it straight: there is no created efficient causation — fire does not burn cotton, no natural thing brings about any effect; God is the sole agent, and every event is produced directly by divine power. What we call causal necessity is only the constancy of God's habitual ordering: the connection between the alleged cause and the effect is not intrinsically necessary, and no contradiction would be involved if it failed. I hold roughly this occasionalist position, in the Ashʿarī spirit, and I want to know what would count against it.

  Begin by brainstorming, in a few lines, what a view like this is actually committed to, so that the defeaters you give are aimed at the real thing and not a strawman. Then give me the observations, arguments, intuitions, and formal results that should move me, sorted from fatal to merely awkward, and say which of them a committed occasionalist would concede as counting against the view and which he would simply dismiss. I am especially interested in the following pressure points, though don't limit yourself to them: whether the move of conceding, for the sake of argument, that the connection might be necessary while still securing miracles leaves the position insulated from any evidence; whether the appeal to divine habit can underwrite induction and the ordinary practice of prediction, and how it differs from a Humean regularity view and from the occasionalism of Malebranche; whether making God the immediate cause of every event implicates God in natural evil and in human wrongdoing, and whether the Ashʿarī notion of kasb (the creature's acquisition of its own act) does any real work here; and whether the position is empirically indistinguishable from its necessitarian rivals, and whether that indistinguishability is a defect. Close with an honest verdict on whether the position risks anything at all, or whether it has been qualified into unfalsifiability — and if so, whether that is a problem for a view of this kind.
reasoning: |-
  Okay, the user wants me to stress-test an occasionalist position inspired by Ashʿarī theology. Let me start by recalling the core tenets: no created causation, God as the sole agent, causal necessity as divine habit. The user mentioned key pressure points: miracles vs. necessity, induction, divine responsibility for evil, empirical indistinguishability, and unfalsifiability.

  First, I need to outline the commitments clearly to avoid strawmanning. The view denies intrinsic causal powers in nature. Everything is a direct divine act. Regularities are just God's consistent habits, not natural laws. Human actions are created by God but "acquired" by humans (kasb), though it's unclear how this avoids making God the author of sin.

  For defeaters, start with the strongest. Moral responsibility is tricky. If God causes every event, including human sins, how is God not responsible? Kasb might be an attempt to address this, but does it hold up? If humans merely "acquire" actions God creates, that seems insufficient for genuine moral agency. This could be a fatal flaw unless kasb adds something substantive.

  Next, empirical indistinguishability. If occasionalism predicts the same observations as causal realism, can it be falsified? The user might worry that this makes the position unfalsifiable. But if both views explain the same data, why prefer one over the other? Occasionalism might need additional theological or philosophical reasons to be compelling.

  Miracles present another challenge. If God normally acts consistently but can break habits miraculously, how is this different from necessitarianism where miracles suspend natural laws? Both allow for exceptions, so miracles don't uniquely support occasionalism. The user’s point about necessitarianism accommodating miracles weakens occasionalism's explanatory advantage.

  Induction and divine habit: Can God's habits underwrite reliable predictions? Unlike Humean regularity, occasionalism posits a divine will behind patterns. But if God could change habits arbitrarily, induction becomes precarious. The user might counter that God's faithfulness ensures regularity, but this relies on theological assumptions not accessible empirically.

  Divine complicity in evil is a serious issue. If God directly causes events like diseases or moral evils, how is God not blameworthy? Ashʿarīs might argue God's actions are just by definition, but this could conflict with human intuitions about justice. The kasb doctrine's effectiveness here is questionable, potentially making it an ad hoc solution.

  Finally, unfalsifiability. If occasionalism explains all possible observations—regularities and miracles—by appealing to divine will, it risks being immune to evidence. While theology isn't empirical science, explanatory parsimony might favor causal realism. The user needs to consider if unfalsifiability undermines the position's credibility or if it's acceptable within a theological framework.

  The committed occasionalist would concede moral responsibility and kasb issues as internal challenges but rely on divine wisdom. They'd dismiss empirical indistinguishability, arguing metaphysical views aren't empirically testable. Miracles and induction would be defended via God's consistent will. Unfalsifiability might be accepted as inherent to the view.

  In conclusion, the biggest risks are moral implications and potential unfalsifiability. If the user prioritizes theological coherence over empirical accountability, occasionalism holds. But if moral intuition or explanatory simplicity is vital, the position faces significant hurdles.
answer: |-
  Here's a stress-test of Ashʿarī-inspired occasionalism, presented analytically. I'll play it straight, identify core commitments, then target pressure points with escalating force.

  **Core Commitments (The Real Target):**
  1.  **No Secondary Causality:** Absolutely no created entity possesses inherent causal power (*qudra*). Fire's "burning" is merely God creating combustion *when* and *where* fire and cotton conjoin.
  2.  **Divine Monocausality:** Every event/state-change in creation (from quantum fluctuations to human choices) is *directly* and *immediately* willed and created (*khalq*) by God.
  3.  **Habitual Regularity:** The observed constant conjunction ("causal necessity") is solely due to God's unwavering custom (*‘āda*), His consistent will to create sequences in a stable pattern. This custom has no intrinsic necessity.
  4.  **Contingency of Order:** God can suspend His custom at will (miracles) without logical contradiction. The "cause" failing to produce the "effect" is always *metaphysically* possible.
  5.  ***Kasb* as Non-Causal Acquisition:** Human "acts" are created by God. The human "acquires" (*kasb*) the act – not by causing it, but by a simultaneous, non-causal relation of "willing" or "appropriating" what God creates.

  **Defeaters (Sorted by Severity):**

  1.  **The Problem of Divine Moral Responsibility (Potentially Fatal):**
      *   **Pressure Point:** If God is the *sole efficient cause* of every event, He directly causes natural evils (disease, earthquakes) and *creates* every human act, including morally evil choices (murder, theft). *Kasb* seems insufficient: if God creates the evil act itself *ex nihilo* at the moment, and the human merely "acquires" it non-causally, how is God *not* the primary author of evil? Divine justice seems compromised.
      *   **Occasionalist Response:** Deflects blame via *kasb* and Divine Wisdom. God creates the act-form, the human "acquires" it with intention, making *them* responsible. God's justice is beyond full human comprehension; creating evil acts serves greater wisdom (e.g., testing, moral order). Evil is merely the *absence* of created good in specific instances.
      *   **Why it Hurts:** Radically challenges core intuitions about justice and agency. Makes *kasb* look like a semantic dodge rather than a robust account of moral responsibility. Implicates God directly in the concrete reality of sin and suffering in a way many find theologically intolerable.
      *   **Concession?** Committed occasionalist *must* bite the bullet: God *is* the sole creator of the evil act, but *kasb* and Divine Wisdom absolve Him of *injustice*. This is deeply counter-intuitive and arguably the weakest flank.

  2.  **Empirical Indistinguishability & Explanatory Vacuum (Major Weakness):**
      *   **Pressure Point:** Occasionalism predicts *exactly the same observable phenomena* as causal realism or physical necessitarianism: fire is followed by burning cotton 100% of the time (absent a miracle). Science discovers "laws" describing God's habits. But it offers *no distinct empirical content*. It cannot explain *why* God chooses *this specific habit* (e.g., Coulomb's Law) rather than another. It replaces physical explanation with "God wills it thusly," which explains nothing *about the world* beyond asserting Divine volition.
      *   **Occasionalist Response:** The view *isn't* an empirical scientific theory; it's a metaphysical account of *ultimate* causation. Its purpose is theological coherence, not scientific prediction. Science describes the *regularity* (habit), theology explains its *ontological ground*.
      *   **Why it Hurts:** Makes the view seem explanatorily empty at the level of natural phenomena. Undermines motivation for accepting it over simpler naturalistic views (Ockham's Razor). Raises the question: If God *could* have instituted any habit, why *this* incredibly complex, interdependent, evolutionary one? The view offers no answer.
      *   **Concession?** The occasionalist *concedes* empirical indistinguishability but *dismisses* it as irrelevant to the metaphysical question. They see it as a strength (compatibility with science), not a weakness.

  3.  **The Miracles Gambit: Insulation from Evidence (Serious Challenge):**
      *   **Pressure Point:** You concede, *arguendo*, that the connection *might* be necessary. But if God suspends the habit for a miracle, how is this different from a necessitarian who says God *suspends* the necessary natural law? Both allow exceptions. Crucially, **any failed prediction** (e.g., fire not burning cotton) could *always* be explained *post hoc* by the occasionalist as a miraculous suspension of the habit. This seems to render the core claim (no intrinsic necessity) *unfalsifiable* in principle.
      *   **Occasionalist Response:** The difference is *metaphysical possibility*. For the occasionalist, the failure involves *no contradiction*; it was *always* possible. For the necessitarian, the failure *is* a contradiction *unless* a higher power (God) intervenes to override the necessity. Miracles *prove* contingency for the occasionalist; for the necessitarian, they prove divine power *over* necessity. The habit is the *norm*, miracles are rare acts with specific theological purpose (prophetic validation), not arbitrary excuses for failed predictions.
      *   **Why it Hurts:** The *post hoc* appeal to miracle *is* a potential escape hatch that could immunize the view. While the occasionalist insists on the rarity and purpose of miracles, the *logical possibility* of invoking one for any anomaly remains, threatening falsifiability. The difference with necessitarianism feels semantic regarding miracles.
      *   **Concession?** The occasionalist *denies* unfalsifiability, pointing to the practical stability of the habit and the theological constraints on miracles. They see the *metaphysical contingency* as crucial and evidenced by the *fact* of miracles.

  4.  **Induction on Shifting Sands? (Awkward Problem):**
      *   **Pressure Point:** Can Divine Habit ground reliable induction? Hume showed induction can't be logically justified from past regularity alone. The occasionalist adds "because God is consistent." But if God's habit is *absolutely contingent* and could change *arbitrarily* at any moment (without contradiction), what guarantees future regularity? Divine faithfulness (*‘adl, ḥikma*)? But this is a theological premise, not an empirical one. How does this differ from Humean regularity + psychological expectation?
      *   **Occasionalist Response:** God's Wisdom (*Ḥikma*) and Faithfulness (*Ṣidq*) *guarantee* the reliability of His habit for the purposes of creation (human life, moral order, scientific pursuit). This provides a *metaphysical foundation* Hume lacks. It's not just regularity; it's the intentional, purposive consistency of a Wise Agent.
      *   **Malebranche Contrast:** Malebranche grounded regularity in God's immutable will acting via general volitions. Ashʿarīs emphasize God's *free, particular* volitions for each event, held *consistently* by custom. Malebranche is closer to a "divine necessitarianism."
      *   **Why it Hurts:** Relies heavily on theological assumptions about God's character. The contingency inherent in the view *weakens* the inductive guarantee compared to necessitarian views (divine or natural). The "metaphysical foundation" is inaccessible to empirical verification.
      *   **Concession?** The occasionalist *concedes* reliance on Divine attributes but sees this as a strength – providing a *reason* for regularity beyond brute fact. They dismiss the idea that contingency *within the framework of Divine wisdom* undermines practical induction.

  5.  ***Kasb*: A Solution or a Label? (Deep Awkwardness):**
      *   **Pressure Point:** Does *kasb* do any real work in solving the agency problem? If God *creates* the specific act (e.g., the motion of a thief's hand taking the purse) *ex nihilo* at the moment, and the human's "acquisition" is merely a simultaneous, non-causal "relation" (willing/appropriating), how is this meaningfully different from God *making* the human perform the act? How does it avoid being divine puppetry? What does "acquisition" *add* ontologically?
      *   **Occasionalist Response:** *Kasb* preserves the reality of human choice/volition (*irāda*) as a created "attribute" (*ma‘nā*) alongside the created act. The human's *specific* willing is the "occasion" for God creating *that specific* act. The human is the "locus" (*maḥall*) of the act and its moral attribute. It distinguishes the thief's act from an involuntary spasm.
      *   **Why it Hurts:** The mechanism remains deeply obscure. The simultaneity and lack of causal power in the human make it hard to see how the human is a genuine *agent* rather than merely the *site* of God's action. It struggles to capture the intuition of being the *source* of one's actions.
      *   **Concession?** The occasionalist *concedes* the mystery but insists *kasb* is necessary to reconcile Divine omnipotence/creatio continua with human responsibility within their framework. They dismiss demands for a "causal" role for humans as violating tawhid.

  **Honest Verdict: Risk and Unfalsifiability**

  *   **It Risks Coherence:** The **Problem of Divine Moral Responsibility** is the biggest risk. Reconciling monocausality with moral evil and meaningful human responsibility is immensely difficult. *Kasb* feels like a stopgap, not a full solution. This risks making the view morally and theologically incoherent for many.
  *   **It Risks Explanatory Value:** While not aiming for scientific explanation, its **Empirical Indistinguishability** and **Explanatory Vacuum** regarding the *specifics* of the habitual order make it seem like an unnecessary multiplication of entities (God's constant particular volitions) compared to causal realism. It offers no *positive* reason to prefer its explanation of *why* fire burns cotton over "fire has the causal power to burn cotton."
  *   **It Risks Falsifiability (and That's a Problem):** The combination of **contingent habit** and the **miracles escape hatch** does render it **logically unfalsifiable** by empirical evidence. *Any* conceivable observation (regularity or anomaly) can be accommodated. While the occasionalist points to theological constraints on miracles, these are not empirical constraints.

  **Is Unfalsifiability a Problem?**
  *   **For a Metaphysical/Theological View?** Not necessarily fatal *in itself*. Many metaphysical claims (e.g., substance dualism, solipsism) are empirically unfalsifiable. Their justification lies elsewhere (coherence, explanatory power for other phenomena like consciousness, revelation).
  *   **However:** It *is* a problem when:
      1.  **It Immunizes Core Claims:** The unfalsifiability specifically protects the *core metaphysical claim* (no secondary causality) from *any* potential counter-evidence, making it immune to empirical critique in a way that feels dogmatic.
      2.  **It Lacks Positive Evidence:** If the view offers no unique positive evidence *for* itself and is empirically indistinguishable from rivals, its unfalsifiability becomes a liability, making it seem like an arbitrary choice lacking justification.
      3.  **It Conflicts with Parsimony:** When combined with the complexity of explaining constant divine volitions vs. inherent properties, unfalsifiability strengthens the case for preferring simpler, empirically equivalent views (Ockham's Razor).

  **Conclusion:** A committed Ashʿarī occasionalist can withstand the pressures from empirical indistinguishability, induction, and even (with difficulty) miracles by retreating to theological presuppositions and metaphysical distinctions. However, the **Problem of Divine Moral Responsibility** remains a profound and potentially fatal wound, exposing deep tensions between absolute divine agency and creaturely responsibility. The view also courts **explanatory vacuity** and **logical unfalsifiability**, which, while not unique to it, become significant liabilities precisely because it offers no compelling *positive* empirical or experiential reason to prefer it over necessitarian alternatives. It survives by theological conviction and metaphysical rigor within its own system, but at the cost of significant intuitive and philosophical burdens. **It risks theological incoherence on evil and unfalsifiable emptiness on natural order.** The strength of your commitment hinges on whether you find the Ashʿarī resolution of *kasb* and Divine Wisdom sufficient to heal the moral wound and whether you prioritize theological/metaphysical coherence with Divine absoluteness over empirical parsimony and intuitive agency.
