prompt: |-
  Ok so I've been trying to nail down a definition of art for a thing I'm writing, and I've ended up with this franken-definition that I want you to give me an actual number on. Here it is: something is a work of art iff (a) it was made or selected with the intention that it be treated as a candidate for aesthetic attention, and (b) it belongs to a practice or tradition in which such candidates are made and discussed, or it's a deliberate departure from one that the relevant community ends up absorbing. So it's meant to be part-intentionalist, part-institutional, part-historical, and it's supposed to handle the hard cases — a urinal put in a gallery, a beautiful forgery, a kids finger painting nobody ever looks at, a sunset (not made, so not art), an image a model spat out that nobody meant as art but a curator later hangs in a show.

  Whats your actual credence that this is the correct analysis of art — say, the probability that it gets the extension right across the cases where competent speakers mostly agree, and doesn't collapse on the ones they don't? I don't want 'definitions of art are hopeless' as the answer, I want the decomposition: how much rides on whether 'art' even has a single correct analysis versus being a cluster concept with no essence, how much on whether the intention clause is doing any real work once you've already got the institution, how much on whether the concept is descriptive or a normative honorific (calling something art is praising it), how much on the weird fringe cases like the AI one, and whatever other terms you think belong. Give me a number and one line of justification for each, then how they combine. Then tell me which sub-question the final number is most sensitive to, and what one argument or case would move it the most.
