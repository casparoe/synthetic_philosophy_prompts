  Okay, the user is describing a specific type of argument they've observed in rationalist communities. They see two people arguing about a term like "alive" or "coercion," realize they're using different definitions, but then continue to debate which definition *should* be used. The user feels something substantial is at stake here—framing power for downstream discussions—and finds that standard "verbal dispute" explanations fall short because the conflict persists even after clarifying definitions.

  Hmm, this is interesting because it reveals a gap in how we typically handle semantic disputes. The user isn't just asking for a label; they want to understand the boundaries of this phenomenon. They're questioning whether the "verbal dispute" framework can handle cases where the disagreement shifts to meta-level definitional authority. They also hint at whether moral terms (like "coercion") versus natural-kind terms (like "alive") differ in how substantive these disputes are.

  First, I need to validate their observation—yes, this is absolutely a real thing, not just a trivial misunderstanding. The core issue is about *conceptual governance*: who gets to control the semantic territory of a culturally important word? This connects to deeper power dynamics in discourse. 

  For terminology, "metalinguistic negotiation" fits best—it's the academic term for arguing over how words *should* be used. But I should also mention "conceptual ethics" since it's about normative choices in definition. The key difference from standard verbal disputes is the normative layer: it's not "what do we mean?" but "what *should* we mean?" 

  The edges matter here. This isn't equivocation (which is sneaky misuse of ambiguity) because both parties are aware of the definitional split. It's also not purely factual—even for natural-kind terms like "alive," the dispute often involves pragmatic choices about useful categorization. The user’s intuition is spot-on: the stakes come from framing effects ("whoever's sense wins gets to frame everything downstream"). 

  For moral vs. natural-kind terms: both can have high stakes, but differently. Moral terms embed value judgments directly (e.g., defining "coercion" shapes what we condemn), while natural-kind disputes (like "is a virus alive?") affect scientific models or ontological commitments. Neither is inherently more substantive—it depends on context. 

  I should emphasize that this is where "tabooing words" reaches its limit. You can clarify definitions, but that just surfaces the real battle over conceptual authority. The user’s frustration with standard rationalist advice is justified—their observed pattern exposes a layer that simplistic verbal dispute resolutions ignore. 

  Finally, the user’s lurking background suggests they’ve seen this play out repeatedly in debates. They might be seeking not just a label, but tools to navigate or reframe such disputes. I’ll make sure to address the "so what?" implicitly—how recognizing this pattern changes how we engage in such arguments.
answer: |-
  You've perfectly dissected a crucial phenomenon that goes *beyond* mere verbal disputes—and it absolutely has substantive stakes. This isn't just ambiguity; it's a **metalinguistic negotiation** (or **metalinguistic dispute**), and it's central to how conceptual power works.

  Here's the breakdown:

  1.  **Core Name: Metalinguistic Negotiation**
      *   **Definition:** A disagreement where the surface-level conflict appears to be about a fact of the world, but the *underlying* conflict is about **which concept** (expressed by a key term) **should be applied** in the relevant context. It's a negotiation over the **meaning, boundaries, or normative weight** of a word/concept itself.
      *   **Key Feature:** The dispute *persists* or even *intensifies* after clarifying the different senses. The fight moves to the meta-level: "Which sense *should* we use, and *why*?"

  2.  **Why "Verbal Dispute" Falls Short:**
      *   The standard "verbal dispute" model assumes that clarifying ambiguity dissolves the disagreement ("Oh, we meant different things, no real conflict!"). Metalinguistic negotiation reveals that **clarifying the ambiguity *is* the first step of the *real*, substantive conflict.**
      *   You're right: The standard advice ("taboo the word!") helps *identify* the ambiguity but often fails to resolve the *normative* disagreement about which concept is more useful, accurate, morally relevant, or "joint-carving" that then emerges.

  3.  **The Stakes (Why It Matters):**
      *   **Conceptual Governance:** Whoever wins the argument over the "correct" or "best" sense gains significant power to **frame subsequent debates, justify actions, assign praise/blame, categorize phenomena, and influence policy/law.**
      *   **Downstream Consequences:** As you noted, the winner gets to set the frame. Calling a business tactic "coercion" vs. "hard bargaining" has massive implications for regulation, ethics, and public perception. Defining a virus as "alive" vs. "not alive" can influence research funding, public understanding, and even definitions of life elsewhere.
      *   **Embedded Values/Norms:** Many contested terms (especially moral, legal, social, or political ones like "coercion," "person," "free speech," "discrimination") have **normative implications baked into their "winning" definition.** Choosing one definition over another often smuggles in specific value judgments.

  4.  **Edges & Distinctions:**
      *   **What it IS:**
          *   A dispute where clarifying senses *reveals* the core disagreement is normative/pragmatic/conceptual about the concept itself.
          *   Involves arguments about which definition is more **useful, precise, fundamental, morally relevant, ontologically basic, or true to the concept's core function.**
          *   High stakes are inherent due to framing power and embedded values.
      *   **What it IS NOT:**
          *   **Simple Equivocation:** Using the same word in different senses *unwittingly* to create confusion or a fallacious argument. In metalinguistic negotiation, the different senses are *explicitly acknowledged*, and the fight is *about* them.
          *   **Pure Factual Dispute:** A disagreement solely resolvable by empirical evidence *without* needing to first settle the meaning of a key term.
          *   **Trivial Semantic Quibble:** Debating the dictionary definition for its own sake with no perceived consequences.
          *   **Stipulative Definition:** Simply agreeing on a definition for clarity within a specific, bounded context (e.g., "For this paper, we define 'X' as Y").

  5.  **Moral/Legal Terms vs. Natural-Kind Terms:**
      *   **Moral/Legal/Social Terms (e.g., Coercion, Person, Justice, Discrimination):**
          *   **Stakes are often higher and more obvious:** Definitions directly encode values, rights, obligations, and social judgments. Winning the definitional battle often *is* winning the moral/legal argument. ("Is it *really* coercion?" determines culpability). The "joints" here are often *social/political/ethical* constructs, not purely natural.
          *   **Highly Normative:** The "should" question is paramount. Arguments focus on fairness, consequences, rights, precedent, and societal impact.
      *   **Natural-Kind Terms (e.g., Alive, Species, Planet, Water):**
          *   **Stakes can be high but different:** Affects scientific categorization, research programs, ontology (what exists fundamentally), and communication within fields. Defining "life" impacts astrobiology, AI ethics, and fundamental biology.
          *   **Focus on "Joint-Carving":** Arguments center on which definition best captures the underlying natural structure, causal powers, or essential properties (if any exist). Pragmatic utility in explanation/prediction is also key. The "should" is often about which definition best serves scientific understanding, even if reality has an objective structure.
      *   **Key Point:** **Both types can be equally substantive.** Disputes about "alive" involve deep questions about biology, information, and emergence. Disputes about "coercion" involve deep questions about autonomy, power, and ethics. Neither is inherently "just semantic" once the metalinguistic layer is exposed. The *source* of the normativity differs (ethics/society vs. scientific accuracy/utility), but the *structure* of the dispute is similar.

  6.  **Nearest Named Concepts:**
      *   **Conceptual Ethics/Conceptual Engineering:** The philosophical field explicitly concerned with evaluating and potentially revising or replacing concepts (asking *which* concepts *should* we use?). Metalinguistic negotiation is the *process* through which conceptual ethics often plays out in real discourse.
      *   **Framing:** Winning the metalinguistic negotiation grants significant framing power.
      *   **Essentially Contested Concepts:** (W.B. Gallie) Concepts like "democracy," "art," or "social justice" where disagreement about the *correct meaning* is inherent and persistent because the concept itself appraises something complex and valued. Metalinguistic negotiations often occur around these, but can happen with less obviously "contested" terms too (like "alive").
      *   **Boundary Work:** (Sociology of Science) The process of defining what is inside/outside a category (e.g., "real science") to claim authority or resources. A form of metalinguistic negotiation in academic/professional contexts.

  **In Summary:**

  You've identified **metalinguistic negotiation**. It's a substantive dispute about **which concept (expressed by a word) should govern our thinking and discourse** on a topic, persisting *after* clarifying ambiguity. The stakes are real: **conceptual framing power** with significant downstream consequences for argument, judgment, and action. This applies robustly to both evaluative terms (like "coercion") and descriptive terms (like "alive"), as the "should" question in both cases involves normative choices about usefulness, accuracy, or capturing fundamental structure. The standard "verbal dispute" framework struggles because it treats clarifying senses as the *end*, whereas here, it's just the *beginning* of the real fight over conceptual territory.
