  Give me an example of a case where someone does the right thing, for the right reason, and it still seems like the credit belongs to a rule rather than to them. I'm thinking of someone who only does the decent thing because years ago they made themselves a promise — to a dying friend, say, or just a resolution they wrote down in a notebook — and who honestly wouldnt bother otherwise. So the act is right, the motive is duty, nothing sneaky or self-serving is going on, and yet it feels like the moral worth lands on the commitment rather than on the person. Does that still count as acting from duty, or does your example show that acting from duty has to mean something more like the agent's ongoing endorsement of the principle — and if so, what exactly are we crediting them for? Not the shopkeeper please. One concrete case, and say which way you think it cuts.
