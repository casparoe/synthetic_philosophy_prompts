  Okay, the user wants an example of someone doing the right thing for the right reason, but it feels like the credit goes to a rule they committed to in the past, not to them personally. They mentioned a promise to a dying friend or a written resolution. The key points are: the act is right, the motive is duty, nothing self-serving, but the moral worth seems attached to the commitment rather than the person.

  First, I need to come up with a concrete scenario that fits. The user specifically said no shopkeeper examples, so Kant's honest shopkeeper is out. I should think of a different situation. Maybe something involving a personal commitment, like a promise to a deceased person. 

  The user is exploring whether acting from duty requires ongoing endorsement of the principle or if it's just following a past commitment. They want to know where the moral credit lies. This ties into Kantian ethics, where acting from duty means the action has moral worth only if done out of respect for the moral law itself, not from inclination.

  I recall Kant's distinction: acting in accordance with duty vs. acting from duty. If someone helps others because they enjoy it, that's not morally praiseworthy in Kant's view. But if they do it out of duty, even when it's hard, that's when it counts. However, if the duty is just a past promise they're mechanically following without current endorsement, does that still count?

  The example needs to show someone who, without the past commitment, wouldn't do the right thing. But their motive now is solely because of that promise. So, perhaps a scenario where someone volunteers at a shelter only because they promised a dying friend, not because they care about the cause now. They do it consistently, but if the promise didn't exist, they wouldn't bother. The act is right, the motive is duty (keeping the promise), no ulterior motives. But does the moral credit belong to the promise or the person?

  Now, analyzing the moral worth. If the person is just going through the motions without any current affirmation of the duty, Kant might say it's not truly acting from duty. Duty requires conscious recognition of the moral law. The commitment here is treated as a static rule, not a living principle. So the person isn't internally motivated by duty; they're externally bound by a past decision. Thus, the credit goes to the rule, not the person.

  But wait, the user asks which way this example cuts. In this case, it suggests that acting from duty needs ongoing endorsement. The person made the initial commitment, which is praiseworthy, but their current action lacks the autonomous moral endorsement. So the moral worth is diluted. The credit for the current act belongs more to the past self who made the promise. The present self is just complying mechanically.

  Alternative angles: Maybe the persistence in keeping the promise despite lack of personal inclination shows strength of will, which is commendable. But Kant might argue that without the right motive, it's not morally worthy. The example highlights the complexity of duty—whether it's the initial commitment or the ongoing choice that matters.

  I should also consider if there's any hidden need. The user might be grappling with questions about moral responsibility, autonomy, or how past commitments bind us. They could be interested in whether consistency in following rules has moral value even without emotional engagement. Or perhaps they're exploring if true morality requires heartfelt commitment versus rote compliance.
answer: |-
  Here's a concrete example and analysis exploring the tension you're describing:

  **The Case:**  
  **Eleanor and Her Brother's Children**  
  Eleanor is a successful, reserved artist with little natural affinity for children. Ten years ago, her beloved brother Ben died of cancer. On his deathbed, Ben, a single father, made Eleanor promise she would "be there" for his two young children, Maya (now 12) and Leo (now 10). Deeply grieving, Eleanor vowed she would. She wrote the promise in her sketchbook: "*Be there for Maya and Leo. Always.*"  

  Without this promise, Eleanor wouldn't prioritize the children. She finds parenting duties draining, their energy overwhelming, and their emotional needs confusing. She sends generous financial support but would rarely visit or engage deeply. However, because of *the promise*, she:  
  1.  Visits every other weekend without fail.  
  2.  Attends school plays, soccer games, and parent-teacher conferences.  
  3.  Listens patiently to their stories and struggles.  
  4.  Provides wise counsel when asked.  
  5.  Makes major life decisions (e.g., turning down a prestigious residency abroad) considering their stability.  

  She performs these actions competently and kindly. The children feel loved and supported by her. Her motive isn't guilt, social expectation, or personal enjoyment – it's purely *duty*: fulfilling the sacred promise she made to Ben. She feels no resentment, but no spontaneous joy either. It's a solemn obligation she discharges faithfully. If Ben hadn't extracted the promise, or if she hadn't written it down and reinforced it to herself, she simply wouldn't do it.

  **Analysis & Which Way it Cuts:**  
  This case cuts **against** the idea that Eleanor is acting with full Kantian "moral worth" *in the present moment*, suggesting that acting "from duty" requires more than mere past-commitment-compliance.

  1.  **The Act is Right:** Yes. Providing consistent, reliable, and loving care to orphaned nieces/nephews is morally right.  
  2.  **The Motive is Duty (on the surface):** Yes. Her conscious reason for acting is solely to fulfill her promise/duty. No ulterior motives.  
  3.  **Credit Lands on the Commitment, Not the Person:** This is the crux. The *source* of the moral energy isn't Eleanor's present recognition of the inherent value of caring for these vulnerable children or an endorsement of the moral principle "Care for dependent family." The source is entirely the *past event* (the promise, the written resolution) acting as an external command. The commitment itself seems to be the active moral agent; Eleanor is its instrument. She wouldn't endorse this principle *now* if not for the promise.

  **Why it suggests acting "from duty" requires ongoing endorsement:**  
  *   **Mechanical vs. Autonomous Duty:** Kantian "acting from duty" emphasizes the *autonomous* recognition and willing of the moral law *by reason in the present*. Eleanor's actions are driven by *heteronomy* – an external rule (the past promise) she feels bound by, not a principle she actively wills *now* based on its inherent rightness. She complies, but doesn't *will* the maxim as her own present moral law.  
  *   **Lack of Present Moral Recognition:** Eleanor doesn't act because she recognizes "caring for vulnerable family is a categorical imperative." She acts *only* because "I promised Ben." The moral principle remains external to her present rational endorsement; it's embedded in the historical rule.  
  *   **What is Credited?** We credit Eleanor for:
      *   **The Initial Commitment:** Making the promise sincerely and binding herself was a significant moral act demonstrating loyalty and love for her brother.
      *   **Fidelity & Willpower:** Her consistency and perseverance in keeping such a demanding, personally unsympathetic promise over years is admirable and reflects strength of character and integrity.
      *   **The Good Consequences:** The children benefit greatly, and this outcome stems directly from her actions motivated by the promise.
      *   *But*, we feel hesitant to credit her *present actions* with the highest *moral worth* (in the strict Kantian sense) because the *immediate moral motivation* isn't her present rational grasp of duty – it's the inertia of the past commitment. The "duty" acting is the ghost of Ben's request and her past vow, not Eleanor's present practical reason.

  **Conclusion:**  
  This example shows that **merely acting *because* of a past rule or promise, without the agent's *ongoing rational endorsement* of the underlying moral principle in the present, lacks the full "moral worth" Kant attributed to acting purely "from duty."** While Eleanor does the right thing for duty-like reasons and exhibits significant virtues (fidelity, integrity), the locus of the *distinctively moral motivation* seems to reside in the historical commitment itself, not her present autonomous moral reasoning. We credit her for her loyalty and follow-through, but the pure "moral worth" of the *present acts* feels diminished because they lack that spark of present rational recognition and willing of the moral law. The *rule* (the promise) carries the weight; Eleanor is its faithful executor, not its present author.
