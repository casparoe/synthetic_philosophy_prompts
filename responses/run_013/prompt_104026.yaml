  The challenge is balancing poetic quality with philosophical precision. Verbs need to show cognitive states ("knows", "hopes", "studies") while keeping descriptions sensory. For the mushroom forager: "Too long in autumn woods, he hopes the prize appears" leads into the shared line. The radiologist contrast: "Her screens hold what she knows is there" versus what's visually present.

  The last stanza's changed word must feel organic - perhaps altering "shape" to "grid" for the solar panel example, suggesting imposed structure. No moralizing - the poem must end on unresolved tension. Rhyme scheme should be unobtrusive (ABAB), meter consistent but not rigid. Crucially, no afterword or explanation - the poem must embody the debate through its structure alone.
