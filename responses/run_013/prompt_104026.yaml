  ## Five Reports from the Field

  The ruler proves it, cold and straight and right,
  Yet stubborn fins still pull the gaze askew.
  The knowing mind contends against the sight:
  **The shape against the light remains askew.**

  Her screens hold shadows she has learned to trace,
  A practiced eye scans grey on deeper grey.
  She *knows* the pattern in that subtle space:
  **The shape against the light remains askew.**

  Too long in autumn woods, he hopes the prize
  Lurks near that log where sunlight barely drips.
  Does certainty now colour-seize his eyes?
  **The shape against the light remains askew?**

  Two months of boxing rooftops, square by square,
  He marks the panels, training unseen nets.
  Now phantom angles haunt the common air:
  **The shape against the light remains askew.**

  The old cartographer, with weathered hand,
  Seeks contours where the wild terrain descends.
  His lifelong map bleeds into the land:
  **The edge against the light remains askew.**
