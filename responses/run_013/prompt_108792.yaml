prompt: |-
  My two roommates got into an arguement at dinner about why some countries are rich and I couldn't refere it, so I'm outsourcing it to you. Maya said it's institutions, full stop: Korea is the proof — same land, same people, split in half after the war, and look at them now; rules, property rights, and whether the elite is constrained do all the work. Dev said Korea is one border and shows that institutions can matter, not that they're the root cause — why did Europe end up with those institutions instead of China or the Ottomans? Go back far enough and it's coastlines, coal, crop packages, and which diseases were waiting for you, and even the Korea split was decided by outsiders rather than Koreans. Maya came back with the reversal: the places that were rich and urban in 1500 are mostly poor now and the geography didn't change, so whatever flipped them was man-made — extraction colonies where Europeans didn't settle, settler colonies where they did. Culture can't be it either, she said, since cultures don't turn on a dime and Korea and Ireland and Poland all turned fast. Dev said the settlement pattern is geography one step back, since Europeans settled where they didn't die, and asked how you measure institutions except by outcomes: if "good institutions" just means "the ones that produced growth," then institutions causing growth is a circle. He added that you can't run the experiment, so you get one run-through per country, and we'll probably never know.

  Can you go through this and tell me who's right about what? I want exactly five numbered items, one or two sentences each, no intro or conclusion: items 1 through 4 rate each move in turn, from clearly mistaken to clearly right, and say why, and item 5 is what both of them are missing. Say how confident you are in each item, and use item 5 to flag the single point you're least sure about. American English please.
