  ## MOCK ARCHIVAL FINDING AID

  **Repository:** Municipal Center for Public Memory (MCPM)  
  **Collection Number:** MCPM MSS 055  
  **Title:** Citizens' Planning Council for Greater Metropolis (CPCGM) Records  
  **Inclusive Dates:** 1947-1981 (Bulk 1955-1970)  
  **Extent:** 12.5 linear feet (25 document boxes, 2 oversize folders), 6 unverified audio cassettes  
  **Language:** English  

  **Creator:** Citizens' Planning Council for Greater Metropolis (CPCGM)  
  **Access Restrictions:** Collection is open for research with the exception of Series V, closed pending donor review. Access to unprocessed accretions (Box 25) requires curator approval.  
  **Use Restrictions:** Copyright status unknown. Responsibility for any use rests exclusively with the user. Reproduction permitted only with written permission from the Head of Special Collections.  
  **Preferred Citation:** Citizens' Planning Council for Greater Metropolis Records (MCPM MSS 055), Municipal Center for Public Memory, [City, State].  

  **Acquisition:** Gift of the Citizens' Planning Council for Greater Metropolis via its final chairman, Mr. Arthur J. Pendergast, 1982. Subsequent minor accretions received from estate of Mrs. Eleanor Vance (Auxiliary Treasurer), 1998.  

  **Processing Note:** Processed by MCPM staff, 1983-1985; minimally revised 2001. Original order proved difficult to ascertain; arrangement imposed by processor based on perceived functional categories. Preliminary arrangement of 1998 accretion incorporated as Box 25. Description updated to current standards, 2023.  

  **Biographical Note:**  
  The Citizens' Planning Council for Greater Metropolis (CPCGM), founded in 1947, was a prominent non-partisan civic organization dedicated to promoting "rational development and civic betterment" within the greater metropolitan area. Composed primarily of business leaders, professionals, and concerned citizens, the Council engaged in research, published reports, lobbied municipal and regional government bodies, and sponsored public forums on issues including urban renewal, transportation infrastructure, zoning reform, economic development, and civic aesthetics. The Council maintained a small central office staff and relied heavily on volunteer committee work. An associated Women's Auxiliary (1951-1975) supported fundraising and event coordination. The Council dissolved in 1981 following declining membership and funding.  

  **Scope and Content Note:**  
  The records comprehensively document the administrative functions, research activities, and public initiatives of the CPCGM from its founding through dissolution. Predominant materials include meeting minutes (Executive Committee, Board of Directors, standing committees), correspondence files (primarily officers and executive director), published and draft reports, financial records (budgets, ledgers, bank statements, fundraising appeals), membership lists, and event planning files (forums, luncheons).  

  Significant topics reflected include urban renewal projects (notably the Riverside Drive Redevelopment and the Central Market Revitalization Plan), highway construction proposals, downtown parking initiatives, and campaigns for municipal beautification. The collection offers insight into mid-century civic engagement patterns and urban planning philosophies prevalent in the region.  

  Notable absences include substantive documentation of the internal deliberations leading to major policy positions, detailed background research materials referenced in published reports, and records reflecting dissenting views within the membership. Records pertaining to the Council's interaction with organized labor groups, particularly during the 1963-1965 period, were appraised by the repository prior to processing as not warranting permanent retention. Documentation of the Women's Auxiliary is limited to the Treasurer's receipt book (1958-1975; Box 24, Folder 12) and scattered references in event files.  

  **Arrangement:**  
  Organized into 7 series:  

  *   **Series I: Administrative Records, 1947-1981 (Boxes 1-5)**  
      *   Subseries A: Constitution, Bylaws, Incorporation  
      *   Subseries B: Minutes (Executive Committee, Board of Directors)  
      *   Subseries C: Officer and Director Files  
      *   Subseries D: Executive Director Files  
      *   Subseries E: Annual Meeting Files  
  *   **Series II: Committee Records, 1950-1980 (Boxes 6-10)**  
      *   Subseries A: Transportation Committee  
      *   Subseries B: Urban Renewal Committee  
      *   Subseries C: Zoning and Planning Committee  
      *   Subseries D: Finance Committee  
      *   Subseries E: Membership Committee  
      *   Subseries F: Ad Hoc Committees (e.g., Civic Design Awards, Bicentennial Planning)  
  *   **Series III: Subject Files and Reports, 1948-1979 (Boxes 11-16)**  
      *   Files on specific projects, issues, and geographic areas; includes research notes, clippings, drafts, and final published reports.  
  *   **Series IV: Financial Records, 1947-1981 (Boxes 17-19)**  
      *   Subseries A: Budgets and Ledgers  
      *   Subseries B: Bank Statements and Cancelled Checks  
      *   Subseries C: Fundraising and Donor Records  
      *   Subseries D: Women's Auxiliary Treasurer's Receipt Book (1958-1975) (Box 19, Folder 7)  
  *   **Series V: Personnel Records, 1955-1978 (Box 20)**  
      *   RESTRICTED: Closed pending donor review.  
  *   **Series VI: Communications and Publicity, 1952-1980 (Boxes 21-22)**  
      *   Press releases, newsletters, clippings, event flyers, photographs.  
  *   **Series VII: Oral History Project, 1978 (Box 23)**  
      *   Audio cassette recordings of interviews with 6 founding members conducted for the Council's 30th anniversary. *Narrators declined to sign release forms; transcripts do not exist*. Summaries prepared by project intern available (Box 23, Folder 1).  
  *   **Unprocessed Accretions, 1960-1975 (Box 24-25)**  
      *   Box 24: Primarily unsorted correspondence fragments and event ephemera.  
      *   Box 25: Labeled "Miscellaneous - See Processing Note". Contents appear to relate to committee work c. 1960-1965 but lack discernible order or context. Preliminary sorting abandoned 2001 due to resource constraints.  

  **Access and Reproduction Conditions:**  
  Access to Series V (Personnel Records) is restricted indefinitely pending review by the donor's designated representative. Access to Box 25 requires advance consultation with the curator due to its unprocessed state and potential privacy concerns. Researcher use of material from Series VII (Oral History Project) is limited to the intern summaries; direct access to the audio cassettes is prohibited due to lack of release agreements. Photocopying and digital photography by researchers are permitted at the discretion of the reading room supervisor, contingent on physical condition and copyright considerations. Publication or broadcast of any material requires written permission.  

  **Processing Note (Detailed for Box 25):**  
  Box 25 represents a 1998 accretion received separately. Initial assessment (2001) indicated material likely originated from multiple CPCGM committees circa 1960-1965, possibly related to downtown development initiatives. Attempts to establish provenance or impose intellectual order proved inconclusive. Material includes loose correspondence, handwritten notes, unmarked maps, vendor proposals, and meeting fragments lacking clear attribution or dates. Given time constraints and the perceived low research value relative to the processed core collection, detailed arrangement and description were deferred indefinitely. Material remains in the order received. Researchers are advised that contextual information for this material is extremely limited.
