answer: |-
  ## Bottom line
  Focus on the compositional interpretation: **What specific ontological commitments does the dialogue presuppose or challenge regarding the relationship between qualities ("white"), substances ("horse"), and the compound entity ("white horse")?** This question is the crux because it directly interrogates Gongsun Long's core argument ("a white horse is not [simply] horse" due to the addition of "white") and underpins the other interpretations. Resolving *how* composition works in his system – whether parts are fused, separable, or create a new ontological category – dictates whether the scope, satisfaction, or grammatical interpretations are downstream consequences or distinct arguments, ultimately revealing the dialogue's philosophical engine. (99 words)

  ## The Candidate Questions
  1.  **Kind/Scope (including Mass Term variant):** Does "horse" name a broad kind while "white horse" names a sub-kind? Or is "horse" fundamentally different syntactically/semantically (like a mass term or shape descriptor)? *Turns on:* How names categorize reality and permit substitution; whether language reflects hierarchical classification or distinct logical types.
  2.  **Satisfaction Criteria:** Is the argument primarily about what fulfills a request or command ("Bring a horse" vs. "Bring a white horse")? *Turns on:* The pragmatic function of names in specific contexts vs. their abstract denotation; the link between naming and action.
  3.  **Composition/Ontology:** Does "white horse" refer to an entity composed of "horseness" *and* "whiteness", making it non-identical to "horse" alone? *Turns on:* The fundamental nature of objects and properties; whether combining a property creates a distinct entity or merely qualifies an existing one.
  4.  **Copular Trick:** Is this solely a superficial ambiguity in the word "is"? *Turns on:* Whether the paradox is resolvable with basic logic or points to deeper philosophical commitments.
  5.  **(Implied Crux) Relationship Between Interpretations:** Which interpretation is upstream, explaining the others? *Turns on:* The core philosophical motivation and coherence of the dialogue within its intellectual context.

  ## The Shortlist, Ranked

  1.  **Composition/Ontology: "What specific ontological commitments does the dialogue presuppose or challenge?"**
      *   **Why Upstream:** This is the explicit argument Gongsun Long makes ("adding 'white' makes it not horse"). If "white horse" is ontologically distinct because it *contains* whiteness, this directly explains the substitution failure (Kind/Scope) – you can't substitute the simple kind for the compound entity satisfying a specific request (Satisfaction Criteria). It renders the Copular Trick dismissive. Conversely, if composition doesn't create a distinct entity, the other interpretations must carry more weight. It forces engagement with the text's core claim.
      *   **Tractability:** High. You can work intensely with the dialogue text (translation + character lookup for key terms like 马, 白, 白马, 非) and surrounding Mohist critiques (especially relevant Canons on naming, substance, and attributes). Key arguments ("cannot be substituted", "not horse") are explicit. Use philosophy of language (mass/count, mereology, property theory) as tools to *analyze* the ontological claims made, not to impose external frameworks prematurely.
      *   **Neglected Payoff:** Often acknowledged but rarely drilled into deeply enough. What *exactly* does "contains" mean? Is "horseness" a universal? Is "white" a separable part? Clarifying this reveals the School of Names' unique metaphysics.
      *   **Good Outcome:** A precise articulation of the ontological model implied by the dialogue (e.g., "Gongsun Long posits compound names refer to fused, non-decomposable particulars, where the addition of a quality creates a new ontological category distinct from the base substance kind"), showing how this model necessitates the other phenomena (scope failure, satisfaction criteria) and why the Mohists objected (likely defending a different model of attributes inhering in substances).

  2.  **Satisfaction Criteria: "Is the argument fundamentally about pragmatic context and fulfilling requests?"**
      *   **Why Upstream (relative to Scope/Copula):** If the core point is about what counts as fulfilling a *specific demand*, this potentially explains the substitution failure without requiring deep ontological commitments about composition. The focus shifts to the *use* of names in commands or identifications within a shared context. It challenges the Composition view as potentially over-interpreting a pragmatic point.
      *   **Tractability:** Moderate. Requires careful reading of the dialogue's framing ("when one asks for a horse..."). Needs integration with Mohist Canons discussing the application of names (举名 *ju ming*) and standards for assent/rejection (是非 *shi fei*). More reliant on context than the explicit argument. Philosophy of language (speech acts, context dependence) is highly relevant.
      *   **Neglected Payoff:** Offers a more "practical" reading connecting the paradox to real-world language use, potentially aligning with Mohist concerns. If correct, it significantly demotes the ontological interpretation.
      *   **Good Outcome:** Demonstrating that the dialogue's force derives primarily from the context of fulfilling specific requests, showing how "horse" and "white horse" set different criteria for satisfaction within a communicative act, making the ontological claims secondary or illustrative rather than foundational.

  3.  **Kind/Scope (including Mass Term): "Does the paradox hinge on the logical type or hierarchical scope of the names?"**
      *   **Why Downstream (often):** This often feels like a *description* of the substitution failure ("horse" is broader than "white horse") or an attempt to formalize the difference linguistically. The Composition view *explains why* the scope differs ontologically. The Mass Term variant is intriguing but less directly supported by the text compared to the explicit composition argument. However, if "horse" truly functions as a mass term, it fundamentally changes the grammatical relationship.
      *   **Tractability:** Moderate-High (Scope), Lower (Mass Term). Scope is observable in the text. Mass Term requires arguing for a specific syntactic/semantic analysis of Classical Chinese nouns, which is philologically demanding and contested.
      *   **Neglected Payoff:** The Mass Term variant is genuinely underexplored and, if viable, radically recasts the debate. Standard scope analysis is common but often superficial.
      *   **Good Outcome (Scope):** A refined analysis showing precisely how scope relations operate within Gongsun Long's system and why substitution fails even when extensional sets overlap. **(Mass Term):** Convincingly demonstrating "horse" functions grammatically/semantically like a mass term in the dialogue, making "white horse" a fundamentally different kind of expression (count noun? qualified mass portion?), thereby dissolving the paradox as a category error.

  ## Field Agenda Versus My Agenda
  The *field* prioritizes meticulous philology (deciphering the Mohist Canons' cryptic language, establishing textual variants, reconstructing historical debates) and situating the dialogue within evolving Warring States philosophical controversies (e.g., against Mohist logic or Daoist critiques of language). *Your agenda*, constrained by resources and seeking a philosophical crux, prioritizes internal logical analysis of the dialogue's core argument using available translations and philosophy of language tools to expose its underlying ontological or pragmatic engine. The field needs philology to build foundations; you leverage existing foundations to isolate a pivotal conceptual mechanism. Your comparative advantage lies in rigorous philosophical dissection of the argument *as presented*, potentially yielding fresh clarity on its logical structure, even without resolving all historical uncertainties. Focus on dissecting the argument in front of you, not reconstructing its lost context.

  ## What Would Move the Ranking
  *   **Evidence elevating Satisfaction Criteria:** Discovery of strong parallels in the Mohist Canons explicitly linking name application *only* to command/assent contexts, or a compelling argument that the dialogue's "cannot be substituted" *only* makes sense pragmatically (not ontologically). Push Composition down.
  *   **Evidence elevating Mass Term:** A philologically rigorous consensus (or your strong argument based on text/Mohist parallels) that Classical Chinese "horse" (马) *routinely* functions as a mass term in similar philosophical/logical contexts. This would become the top crux, potentially dissolving the others. Push Composition down dramatically.
  *   **Evidence demoting Composition:** If close analysis shows the "composition" language is purely metaphorical or secondary to the pragmatic point in Gongsun Long's own exposition, pushing Satisfaction Criteria up.
  *   **Textual Ambiguity:** If the key passage justifying the Composition reading is philologically contested in a way inaccessible to you, Satisfaction Criteria becomes the safer primary focus.

