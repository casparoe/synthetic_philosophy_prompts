prompt: |-
  ok, so I'm a fourth-year PhD student — officially in phil of science, but I basically live in an applied modeling lab that does contract work for a state natural-resources agency (coupled econ/ecology stuff, fish-stock models, harvest quotas, that kind of thing). And I keep getting the same question from the agency people every time we hand over a model: you assumed X, X obviously isn't true, so can we still use this thing to actually set a quota? Right now I answer case by case and I'm pretty sure I contradict myself between meetings, so I want a procedure I can actually run.

  Background so you know where I'm coming from: this is basically the Friedman thing — unrealistic assumptions are fine as long as the predictions come out right. I definately get the appeal, but it can't be the whole story, because sometimes the assumption is doing the real explanatory work and the prediction is right for the wrong reason, and sometimes two models with contradictory assumptions predict the same number, so predictive success can't pick between them. I don't need you to relitigate the F-twist, I need it turned into something a non-philosopher can execute.

  I've got a half-baked taxonomy I want you to either use or replace with something better. I think every assumption that's actually load-bearing is one of three kinds: a limit case, where the assumption is what the model reduces to as some parameter goes to zero or infinity and it's roughly true in the regime we use it in; a tractability fiction, where we know it's false and we'd fix it if we could solve the fixed model, but we can't; or a stand-in, where the thing in the model doesn't correspond to anything real at all (a representative agent, a 'population' that's just the mean of a distribution), so asking whether it's 'true' might be a category error.

  What I want from you: a decision procedure I can run in maybe an afternoon on a single model, before I sign off on handing it to the agency. The questions in order, what counts as a good enough answer to each, where it stops with don't use this, where it stops with fine to use, and where it stops and hands the call to a human because it's really a value judgment about what we're willing to get wrong. Two steps I care about especially: (1) for any assumption, say which direction the answer will be biased if the assumption fails — I care way more about bias direction than about whether the assumption is realistic in the abstract; and (2) something that catches the case where the model predicts well for the wrong reason, or where predictive success can't distinguish two seperate assumptions.

  Then run it on three cases: (a) a fish-stock model that assumes the population is well mixed and that the fish don't evolve, used to set a harvest quota; (b) an economic model that assumes firms are price-takers and fully rational, used to score a carbon tax for revenue; and (c) your choice of a third where I'm not going to like the answer. Be honest about where the procedure is just judgment dressed up as a checklist, and tell me what it can't do at all.
reasoning: |-
  Okay, the user is a fourth-year PhD student in philosophy of science working in an applied modeling lab. They're dealing with natural resource agency folks who keep questioning the unrealistic assumptions in their models. Specifically, they want a practical procedure to determine when such models can still be used for setting quotas, even with false assumptions. 

  First, I need to understand their background. They mention Friedman's "unrealistic assumptions are fine if predictions work" idea but point out its flaws: models can be right for the wrong reasons, or multiple models with conflicting assumptions can yield the same prediction. They’ve already started a taxonomy of assumptions (limit cases, tractability fictions, stand-ins) and want a decision procedure that’s actionable in an afternoon. 

  Key requests: 
  1. A step-by-step checklist that outputs "use," "don’t use," or "human judgment needed." 
  2. Focus on bias direction when assumptions fail. 
  3. Detect when predictive success is coincidental. 
  4. Apply to three cases: (a) fish-stock model (well-mixed population, no evolution), (b) economic model (price-takers, rational firms), (c) a third tricky case. 

  Their taxonomy seems solid, but I’ll refine it for clarity. The procedure should prioritize empirical validation and bias analysis over philosophical debates. The agency cares about actionable outcomes, so the checklist must be pragmatic. 

  For the decision procedure, I’ll structure it into phases: Assumption Audit, Empirical Stress Test, and Judgment Integration. Each step needs clear pass/fail criteria. The bias direction analysis is critical—agencies need to know if errors will over- or underestimate quotas. The "wrong reason" detection requires checking if the model’s mechanism aligns with reality or if it’s a lucky fluke. 

  Now, applying it to their cases: 
  - Fish-stock model: Spatial clustering violates "well-mixed," leading to overfishing (bias: overestimate stock, underestimate risk). No evolution is likely a tractability fiction, but rapid evolution could cause collapse. Verdict: "conditional use" with monitoring. 
  - Economic model: Firms aren’t price-takers (bias: overestimate carbon tax revenue). Rationality is a stand-in; behavioral factors might reduce revenue further. Verdict: "human judgment" due to revenue risk. 
  - Third case (climate tipping points): Models assume linear CO2-temperature response when it might be nonlinear. Bias: underestimate warming, overestimate "safe" emissions. Verdict: "don’t use" for high-stakes policy. 

  The procedure’s limitations: 
  - Struggles with interconnected assumption failures. 
  - Relies on existing data for validation (gaps force judgment calls). 
  - Can’t resolve "wrong reason" without mechanistic evidence. 
  - Subjectivity in "acceptable error" thresholds. 

  I’ll emphasize that this isn’t a philosophy seminar—it’s a pragmatic tool. The user’s taxonomy works well; I’ll just adapt it into executable steps. The checklist format should make non-philosophers comfortable. Honesty about gray areas ("human judgment") builds trust. 

  Finally, the third case is chosen to unsettle them—tipping points are high-risk, and models often downplay tail risks. That’ll force confronting how much uncertainty is tolerable. It’s a solid example of "don’t use" when stakes exceed model credibility.
answer: |-
  Here's a pragmatic decision procedure based on your taxonomy, prioritizing bias direction and robustness over philosophical purity. It's designed for a single model review in an afternoon. **Bold text** = actionable steps.

  ---

  ### **Assumption Evaluation Procedure**  
  *(Run per critical assumption flagged by agency/users)*  

  **PHASE 1: ASSUMPTION AUDIT**  
  1. **Classify the assumption** (using your taxonomy):  
     - *Limit Case*: "True when parameter [X] → 0/∞. Our value is [Y]."  
     - *Tractability Fiction*: "We know [X] is false. Ideal fix would require [unsolved complexity]."  
     - *Stand-In*: "[X] represents [real-world proxy], not a literal entity."  
     - *Other* → Flag for human judgment.  
     *Output: Type, key parameter(s), regime of operation.*  

  2. **Bias Direction Analysis**:  
     - Ask: *"If this assumption fails in the most plausible way, does the model overestimate or underestimate the key output (e.g., fish stock, revenue)?"*  
     - Methods:  
       - Analytical derivation (e.g., sign of partial derivative)  
       - Simple sensitivity test (e.g., ±20% change in assumption proxy)  
       - Literature consensus on failure modes  
     *Output: "Bias direction: [↑ Overestimate / ↓ Underestimate] key output [Z]".*  

  3. **Predictive Robustness Check**:  
     - *"Does this model share key predictions with structurally different models?"*  
       - If YES → Resilient (e.g., multiple models agree on quota despite differing assumptions).  
       - If NO → High risk of "right for wrong reasons."  
     - *"Is the assumption's failure correlated with model error in historical/validation data?"*  
       - If clear correlation → Predictive success may be coincidental.  

  **PHASE 2: EMPIRICAL STRESS TEST**  
  4. **Regime Validity**:  
     - For *Limit Cases*: Is the actual parameter in the assumed regime?  
       - *Pass*: e.g., diffusion rate >> advection rate → "well-mixed" ≈ valid.  
       - *Fail*: Parameter near transition zone → "Assumption invalid; bias ↑"  
     - For *Tractability Fictions*: Is the error quantifiable? Run a "best available fix" (e.g., adding a key sub-model).  
     - For *Stand-Ins*: Does the aggregate behave like the real distribution? Check distributional data.  
     *Output: [Valid / Invalid / Borderline] in deployment context.*  

  5. **Failure Impact Score** (1-5):  
     - 1: Small bias, no decision risk (e.g., ±2% revenue error)  
     - 3: Moderate bias, needs monitoring (e.g., ±10% stock error)  
     - 5: Catastrophic risk (e.g., collapse threshold miscalculation)  
     *Score based on bias direction, magnitude, and decision stakes.*  

  **PHASE 3: JUDGMENT INTEGRATION**  
  6. **Decision Rule**:  
     - **IF** Bias Direction = UNKNOWN → **"Don't Use"**  
     - **IF** Failure Impact ≥4 AND Regime = Invalid → **"Don't Use"**  
     - **IF** Predictive Robustness = YES AND Impact ≤3 → **"Use"**  
     - **ELSE** → **"Human Judgment Required"**  
       - *Criteria for judgment: Cost of error vs. cost of better model.*  

  7. **Mitigation Protocol** (if "Use" or "Judgment"):  
     - Prescribe monitoring for assumption failure (e.g., track spatial clustering in fish).  
     - Quantify bias in output documentation (e.g., "Quota likely 5–10% too high if fish aggregate").  
     - Note model's "known ignorance" (e.g., "Ignores evolution; monitor size-at-age trends").  

  ---

  ### **Case Applications**  
  **(a) Fish-Stock Model**  
  - *Well-mixed population*: **Tractability Fiction**  
    - Bias: Clustering → overestimates stock, *underestimates* extinction risk (↓ risk)  
    - Reality: Coastal fish form patches → **Regime Invalid**  
    - Impact: High (quota errors compound) → **Human Judgment**  
      *Mitigation: Use spatial index to adjust quota annually.*  

  - *No evolution*: **Limit Case** (harvest → 0)  
    - Bias: Rapid evolution → underestimates stock collapse risk (↑ risk)  
    - Reality: High harvest pressure → **Regime Borderline**  
    - Predictive check: Eco-evo models disagree → **Impact: High** → **Human Judgment**  
      *Verdict: Conditional use with evolution monitoring.*  

  **(b) Economic Model (Carbon Tax Revenue)**  
  - *Price-takers*: **Stand-In** for competitive markets  
    - Bias: Market power → firms pass less tax → *overestimates* revenue (↑ revenue)  
    - Reality: Some sectors oligopolistic → **Regime Borderline**  
    - Impact: Moderate (revenue shortfall manageable) → **Use with caution**  

  - *Full rationality*: **Tractability Fiction**  
    - Bias: Myopia → delayed response → *overestimates* short-term revenue (↑ revenue)  
    - Predictive check: Behavioral models agree on long-term revenue → **Impact: Low** → **Use**  
      *Verdict: Use but flag revenue optimism in years 1–5.*  

  **(c) Third Case: Climate Policy Model (CO₂-Temperature "Hockey Stick")**  
  - *Assumption*: Linear CO₂-forcing relationship (ignores tipping points).  
  - **Limit Case** (small perturbations)  
    - Bias: Tipping points → *underestimates* warming (↓ risk)  
    - Regime: Invalid (atmospheric [CO₂] >500ppm) → **Impact: 5** (catastrophic error)  
    - Predictive Robustness: Tipping-point models disagree radically → **"Don't Use" for policy**  
      *Why you'll hate it: The model "works" until it doesn’t. Bias direction is dangerous (underestimates threat), and no consensus exists.*  

  ---

  ### **Where Judgment Masquerades as Procedure**  
  1. **Bias Direction**: Requires expert insight if literature/sensitivity tests are ambiguous.  
  2. **Impact Thresholds**: "Acceptable error" is agency-specific (e.g., 5% revenue vs. 1% extinction risk).  
  3. **Predictive Robustness**: Judging if alternative models are "structurally different" is subjective.  

  ### **What It Can't Do**  
  - Handle **cascading failures** (e.g., if 3 assumptions fail interactively).  
  - Resolve **deep structural uncertainties** (e.g., unknown evolutionary rates).  
  - Replace **model validation** — this assumes baseline predictive adequacy.  

  ### **Execution Notes**  
  - **Time budget**: Spend 70% on Phase 1 (audit/bias), 25% on Phase 2 (stress tests), 5% on Phase 3.  
  - **Output**: A 1-pager per model: "Assumption | Type | Bias | Regime | Impact | Verdict | Mitigation".  
  - **When in doubt**: Default to bias direction + impact score. If bias ↑ risk of catastrophe, veto.  

  This turns Friedman’s "as if" into actionable diagnostics. It won’t resolve philosophical quagmires, but it forces transparency about *what we’re wrong about* and *how that hurts us* — which is what agencies actually need.
