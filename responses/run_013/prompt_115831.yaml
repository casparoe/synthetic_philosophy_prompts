  Okay, the user is dealing with a deeply personal and ethical dilemma involving their girlfriend's grandad, who has dementia and a living will refusing tube feeding. But beyond that immediate situation, they're noticing a pattern in various arguments where past decisions override present preferences. They want to understand if there's a term for this phenomenon, especially the "changed-values" case, and seek clarity on the underlying principles.

  First, I need to parse their core question. They describe two flavors of justification: identity (same person, so bound by past decisions) and competence (past self was more capable). They suspect these are distinct but often conflated. The user is intellectually curious, noticing philosophical patterns in real-life scenarios, and wants precise conceptual carving.

  Looking at existing terms, Ulysses contracts come to mind, but those typically address weakness of will, not value changes. For dementia cases, bioethicists like Dworkin distinguish precedent autonomy (past competent self's decision) from present interests. That's key. The user is right—contracts often rely on identity and commitment, while dementia cases hinge on competence and authenticity.

  The user's deeper need might be to make sense of ethical conflicts they observe, perhaps to navigate family debates or their own stance. They want terminology to articulate the difference between overriding a weakened self versus respecting a transformed self. Terms like "authenticity-based precedent autonomy" or "transformative shift" could help, but I should emphasize the distinction rather than offering a single term.

  They also mention broader applications: military oaths, constitutions. Here, the issue might be about intergenerational commitments versus current societal values. Locke's tacit consent vs. Jefferson's "earth belongs to the living" comes to mind. The user needs frameworks to dissect when past commitments should hold versus when they become alien to the present self or society.

  In crafting a response, I'll validate their observation—yes, two different phenomena. Highlight Dworkin's critical interests and Buchanan's discontinuity. For changed values, terms like "transformative value shift" or "narrative rupture" fit. Stress that identity arguments work for weakness cases but falter when the self fundamentally changes. The dementia case isn't about willpower; it's about a new self with different values emerging.

  The user might also seek reassurance that their intuition is sound—that overriding a dementia patient's current wishes isn't the same as enforcing a contract. Ethically, the balance shifts when competence and authenticity are at stake. Providing clear distinctions can empower them in discussions, whether personal or academic.
answer: |-
  You've hit on a profoundly deep and recurring ethical, legal, and philosophical problem – the conflict between **past commitment** and **present self**. You're absolutely right that the "binding past decision" argument manifests in two distinct flavors that often get blurred, leading to confusion and ethical tension. Here's the carving you're seeking:

  1.  **The Two Distinct Phenomena:**
      *   **Phenomenon A (Weakness of Will / Akrasia):** *The later self shares the same fundamental values and goals as the earlier self but lacks the willpower, discipline, or situational resolve to act on them.*
          *   **Examples:** Ulysses contracts (website blockers, handing passwords to a friend), commitment devices (savings plans with penalties), refusing dessert *now* because you decided *earlier* on a diet.
          *   **Justification Flavor:** Primarily **Identity ("It's still you! Stick to your plan!")**, secondarily Competence ("Your earlier self was thinking clearly about long-term goals, not tempted in the moment").
          *   **Overriding Feels Like:** Helping, enabling, respecting the person's deeper wishes against transient impulses.
      *   **Phenomenon B (Transformative Change / Value Shift):** *The later self has undergone a fundamental change in values, preferences, identity, or cognitive capacity. Their current preferences are genuinely different, not just weaker.*
          *   **Examples:** The dementia case (grandad now values simple existence/comfort, not autonomy/avoidance of burdensome treatment), profound religious conversion, radical ideological shifts, severe brain injury altering personality/preferences, societal value shifts rendering past commitments alien (e.g., archaic oaths, some constitutional clauses).
          *   **Justification Flavor:** Primarily **Competence/Authenticity ("The earlier self was the *real* or *competent* self")**, with Identity often invoked inconsistently ("It's the same person!" even while implying the *current* person isn't the "real" one).
          *   **Overriding Feels Like:** Disrespect, imposition, silencing the current person in favor of a ghost, potentially violating autonomy *now*.

  2.  **Established Terms & Concepts:**
      *   **For Phenomenon A (Weakness):** This is the classic domain of **Ulysses Contracts**, **Precommitment Strategies**, or **Commitment Devices**. Philosophers like Jon Elster and Thomas Schelling have extensively analyzed this. Key concepts are **Akrasia** (weakness of will) and **Self-Binding**.
      *   **For Phenomenon B (Transformative Change):** There isn't *one* universally accepted term for the *overall* phenomenon, but the core ethical conflict is analyzed under several key frameworks:
          *   **Precedent Autonomy vs. Current Interests:** This is the central framing in **bioethics**, especially regarding dementia and advance directives. Ronald Dworkin's distinction is crucial:
              *   **Critical Interests:** Deeply held values about the *kind of life* one wants to live (e.g., "Don't keep me alive as a burden if I'm severely demented"). These are what the competent earlier self tries to protect with an advance directive.
              *   **Experiential Interests:** Preferences based on current experiences and feelings (e.g., "I enjoy this ice cream," or "I feel happy and want to live" in dementia).
              Dworkin argued that respecting the *person* often means respecting their *critical interests* (the earlier competent decision) even when their *experiential interests* have changed. Others, like Rebecca Dresser, argue that the current experiential interests of the existing person deserve significant weight, especially when the person has changed so profoundly that the earlier directive feels like it belongs to a stranger.
          *   **Narrative Identity vs. Momentary Self:** Philosophers like Derek Parfit (on personal identity) and Marya Schechtman (on narrative self-constitution) explore how we see ourselves as persisting *narratives*. Binding the future self relies on this narrative continuity. When the change is transformative enough (like severe dementia), the narrative thread may feel broken, making the past decision seem alien to the current self.
          *   **Authenticity and Competence:** The argument that the *earlier* self was "more authentic" hinges on their competence – their ability to reason abstractly, consider long-term consequences, and hold complex values. The later self (in dementia) lacks this competence, making their *current* preferences seem less "authentic" representatives of the person's *overall* life narrative or true will.
          *   **Discontinuity:** Philosophers like Allen Buchanan have argued that sufficiently radical psychological changes can create a degree of **discontinuity** that weakens the binding force of prior commitments, even if numerical identity (same body/brain) persists.

  3.  **The Carving You Asked For:**
      *   **The Core Issue:** The fundamental tension is between **Respecting Past Intentions (Autonomy Over Time)** and **Respecting Current Wishes (Present Autonomy/Welfare)**.
      *   **What Makes Them Different?**
          | Feature              | Phenomenon A (Weakness of Will)                               | Phenomenon B (Transformative Change)                          |
          | :------------------- | :------------------------------------------------------------ | :------------------------------------------------------------ |
          | **Core Change**      | Willpower/Resolve falters; Values/Goals remain stable         | Values/Preferences/Identity/Capacity fundamentally change     |
          | **Justification**    | Identity + Competence (long-term view)                        | Competence/Authenticity (earlier self) + Narrative Identity   |
          | **Overriding Feels** | Enabling, supportive                                          | Disrespectful, coercive                                       |
          | **Ethical Anchor**   | Deep values/long-term goals of the *same* self                | Authenticity of the *competent* self vs. welfare of *current* self |
          | **Key Concepts**     | Akrasia, Self-Binding, Ulysses Contract                       | Precedent Autonomy, Critical Interests, Discontinuity         |
      *   **Are Contracts & Dementia the Same?** **No, not fundamentally.** Most contracts assume Phenomenon A (a competent signatory might *regret* or *wish* they hadn't signed, but their core values and capacity haven't fundamentally transformed). They rely on **identity and commitment**. The dementia case is quintessential Phenomenon B – **a fundamental change in capacity and values**. The "but he decided" slogan is misapplied when carried over wholesale from contracts to dementia or radical conversions.
      *   **The Military Volunteer Example:** This is complex. It *could* be argued as Phenomenon A (volunteer knew risks, shouldn't complain when faced with consequences). However, if the war's nature changes drastically (e.g., sold as defense, becomes clear aggression), or the soldier's values undergo a profound shift (e.g., pacifist conversion), it edges into Phenomenon B territory. The forum poster likely ignores this nuance and treats it simplistically as Phenomenon A.

  4.  **What to Call Phenomenon B?**
      While no single perfect term exists, these capture aspects:
      *   **The Precedent Autonomy vs. Current Welfare Conflict:** (Most precise in bioethics context).
      *   **The Binding Problem of Transformative Change:** (Highlights the core issue).
      *   **The Competent Self vs. Transformed Self Dilemma:** (Focuses on the justification clash).
      *   **The Problem of Discontinuity in Commitment:** (Philosophical angle).
      *   **The Authenticity Shift Dilemma:** (Focuses on whose voice is "real").

  **Conclusion:**

  You've brilliantly identified a crucial distinction often obscured in heated debates. The "binding past decision" argument leverages two different engines:

  1.  **"It's still YOU, stick to YOUR plan!"** (Phenomenon A - Weakness, Identity Focus).
  2.  **"The REAL/COMPETENT you decided this!"** (Phenomenon B - Transformation, Competence/Authenticity Focus).

  The dementia case is firmly **Phenomenon B**, sitting squarely in the **"Precedent Autonomy vs. Current Interests"** debate within bioethics. It's structurally different from enforcing a diet commitment (Phenomenon A) or even most contracts (which assume Phenomenon A). The ethical heart of Phenomenon B is the agonizing question: **When a person changes so profoundly, whose voice – the competent author of the past, or the experiencing self of the present – deserves priority in determining their fate?** There is no easy answer, but recognizing the distinct nature of this dilemma is the essential first step. The "carving" you instinctively sought provides the necessary clarity to engage with these difficult questions meaningfully.
