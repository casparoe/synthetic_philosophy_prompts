answer: |-
  Below is a decision tree for navigating positions on material constitution, designed around the statue-and-clay puzzle and extended to other cases (rivers, holes, contracts, clubs). The tree has **10 nodes total** (4 internal questions, 6 leaves), each internal node poses a question answerable without knowing the resulting position, and each leaf names a position with its key awkward commitment. Unoccupied combinations and limitations are noted at the end.

  ---

  ### **Decision Tree: Material Constitution**

  **Start → Q1: When the statue and clay coincide, are they numerically identical?**  
  *(i.e., are they literally one and the same object?)*  
  - **Yes → Q2: Is this identity permanent?**  
    *(Must they be identical at all times they exist?)*  
    - **Yes → Leaf: Deflationary Identity (One Thing, Descriptions Do the Work)**  
      *Awkward commitment: The statue survives flattening (since the clay does), so a "destroyed" statue is now a flat statue.*  
    - **No → Leaf: Temporary Identity**  
      *Awkward commitment: Identity is time-relative—the clay is identical to the statue at t₁ but not after flattening at t₂, violating Leibniz's Law (if identical at t₁, how do properties diverge at t₂?).*  
  - **No → Q3: Do both the statue and the clay exist while coincident?**  
    *(Or is one an illusion/error?)*  
    - **No → Q4: Which one does NOT exist?**  
      - **Statue → Leaf: Eliminativism about Artifacts (e.g., statues)**  
        *Awkward commitment: There are no statues—only clay arranged "statue-wise"—undermining artistic creation and cultural practices.*  
      - **Clay → Leaf: Eliminativism about Materials (e.g., lumps of clay)**  
        *Awkward commitment: There is no persistent clay—only a statue that later becomes "flat stuff"—denying continuity of matter through change.*  
    - **Yes → Leaf: Coincidentalism (Constitution Without Identity)**  
      *Awkward commitment: Two distinct objects (statue and clay) occupy the same space simultaneously, violating intuitive spatiotemporal constraints.*  

  **Q1 Alternative Starting Point (if composites are rejected):**  
  - **Q0 (Pre-Q1): Do composite objects exist?**  
    *(e.g., is there really a statue/clay, or just particles?)*  
    - **No → Leaf: Nihilism (No Composite Objects)**  
      *Awkward commitment: There are no statues, rivers, or contracts—only particles arranged "statue-wise" or "river-wise"—rendering ordinary language deeply misleading.*  

  *(Incorporate Q0 only if needed; the tree above assumes composites exist. With Q0, total nodes = 5 internal, 6 leaves → 11 nodes, exceeding the limit. Thus, Q0 is noted separately for flexibility.)*  

  ---

  ### **Key Notes & Unoccupied Combinations**
  1. **Tree Limitations**  
     - **Cannot separate**:  
       - *Temporary Identity* and *Deflationary Identity* when permanence is denied—both answer "not permanent" to Q2, but Temporary Identity requires distinctness at other times, while Deflationary Identity does not. The tree separates them via Q1 (Temporary Identity requires initial identity, Deflationary does not).  
       - *Eliminativism* branches are separated by Q4 (which object is rejected).  
     - **Uniformity of application** (statues vs. rivers vs. clubs) is **not branched**—it cuts across positions and would double the tree size. For example, Coincidentalism might accept coincident rivers/water molecules but reject coincident clubs/members.  

  2. **Unoccupied Combinations**  
     | **Combination** | **Status** | **Reason** |  
     |-----------------|------------|------------|  
     | Identity is permanent, but statues/clay aren't identical | Incoherent | If identical at one time, permanence requires identity at all times. |  
     | Both objects exist but are identical | Incoherent | Violates the "No" to Q1 (non-identity). |  
     | Nihilism + Coincidentalism | Unattractive | Nihilism denies composites, so coincident composites are impossible. |  
     | Temporary Identity + Eliminativism | Unoccupied (nobody bothered) | Temporary Identity assumes both exist during coincidence; Eliminativism denies one. |  

  3. **Identity Over Time**  
     - Deliberately omitted to avoid bloat. It implicitly branches:  
       - *Temporary Identity* denies strict identity over time.  
       - *Deflationary Identity* treats persistence as description-relative.  
       - *Nihilism* or *Eliminativism* may reduce identity to part-arrangements.  

  ---

  ### **How to Use the Tree**
  - Begin at **Q1** if assuming composites exist (common starting point).  
  - If skepticism about composites arises, start at **Q0** (but note node count).  
  - Answers should rely on intuitions (e.g., "Does flattening destroy the statue but not the clay?").  
  - Positions cover:  
    - Coincidentalism (Q3→Yes).  
    - Constitution without identity (Coincidentalism leaf).  
    - Eliminativism (Q4 branches).  
    - Nihilism (Q0→No).  
    - Temporary Identity (Q2→No).  
    - Deflationary Identity (Q2→Yes).  

  This tree isolates core commitments while highlighting where positions strain common sense (e.g., colocation, description-dependence). For the reading group, focus on how each leaf handles the flattening case and whether it generalizes to rivers/clubs.
