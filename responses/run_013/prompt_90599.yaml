answer: |-
  ### Prep Sheet: Novelist's Argument Defense  
  **Core Claim:** Revealed preference captures *choices* ("shown"), but fiction reveals gaps between stated wants ("stated") and unconscious motives ("betrayed"). Economists’ utility models answer a narrow question but borrow prestige from the broader concept.  

  ---  
  ### Top Objections (Ordered by Damage Potential)  
  1. **Decision Theorist (Most Damaging - Undermines Core Analogy)**  
     - **Objection:** "Revealed preference theory isn’t *about* ‘wanting’—it’s a consistency test for choice data under constraints. You’re attacking a straw man. Utility is *defined* by choice; anything else is unobservable psychologizing."  
     - **Reply:** "Exactly—I’m arguing that defining utility *only* as consistent choice ignores why we use the word ‘utility’ (implying well-being) in everyday language. Fiction explores that gap between the technical definition and the richer human concept."  
     - **Soft Spot:** Concedes economists’ definition is internally consistent; relies on redefining "utility" colloquially.  

  2. **Behavioral Economist (High Damage - Questions Relevance)**  
     - **Objection:** "But we *do* study the gap! Stated vs. revealed preferences are a standard topic (e.g., voting vs. shopping). Your ‘betrayed’ layer is just noise—we model it as biases or shocks."  
     - **Reply:** "Biases like cognitive dissonance are still choice-centric. Fiction’s ‘betrayed’ layer—e.g., a character’s self-deception exposed by narrative irony—isn’t a ‘shock’ but a structural part of identity. Can your models capture that?"  
     - **Soft Spot:** If they cite neuroeconomics/psych data on unconscious motives, you lack empirical counter-evidence.  

  3. **Philosopher of Economics (High Damage - Charges Sloppiness)**  
     - **Objection:** "You conflate *preferences* (propositional attitudes) with *utility* (a numerical representation). Preferences *are* real and knowable; your ‘betrayed’ idea is just failed introspection."  
     - **Reply:** "I agree preferences are real—but fiction shows they’re often *opaque* to the agent. Economists treat them as transparent (e.g., ‘rationality’). If preferences can be self-unknowable, how can utility be revealed?"  
     - **Soft Spot:** Requires defending literary introspection as valid evidence.  

  4. **Empirical Economist (Medium Damage - Dismisses Fiction)**  
     - **Objection:** "This is cute, but novels aren’t data. Revealed preference works because it’s testable. Your ‘betrayed’ layer is just your interpretation—it’s not falsifiable."  
     - **Reply:** "Agreed—fiction isn’t science. But it’s a lab for thought experiments about motives. If your models can’t even *describe* what novels reveal (e.g., tragic flaws), how complete is your theory of behavior?"  
     - **Soft Spot:** Plays into their view that fiction is "soft" evidence.  

  5. **Skeptic (Low Damage - Defends Pragmatism)**  
     - **Objection:** "Why overcomplicate this? Revealed preference predicts behavior well enough for policy/markets. The rest is literature’s job."  
     - **Reply:** "Because misinterpreting ‘utility’ as well-being when it’s only about choice leads to bad outcomes—e.g., assuming high spending = high welfare while ignoring addiction narratives."  
     - **Soft Spot:** Requires real-world examples where RP failed (e.g., retirement savings puzzles).  

  ---  
  ### The Question You Hope Nobody Asks  
  **"Can you give an example of a ‘revealed betrayed preference’ that couldn’t be explained by standard behavioral models (e.g., time inconsistency or hidden information)?"**  
  - **Why It’s Dangerous:** Forces you to defend fiction’s unique insight against adaptable economic models. Behavioral economists can reframe *any* "betrayed" motive as a bias (e.g., self-deception = optimism bias).  
  - **If Asked:**  
    - **Reply:** "Take *Madame Bovary*: Her affairs aren’t just time inconsistency—they’re a narrative indictment of her *unknowable* self-destructiveness. Behavioral models might call this present bias, but they can’t replicate the tragic irony where readers grasp her motives before she does."  
    - **Damage Control:** Acknowledge models *approximate* these gaps but argue they lose explanatory depth.  

  ---  
  ### Quick Defense Strategy  
  - **Lean into your lane:** "I’m not saying economics is wrong—I’m showing what it *excludes* that fiction centralizes."  
  - **Humor disarms:** "Look, I know none of you’ve read a novel since *The Great Gatsby*—that’s why I’m here."  
  - **Bridge gaps:** Cite behavioral econ’s "mistakes" (e.g., Kahneman) as acknowledging the "shown-stated" gap, then push further.  
  - **Weakness:** You can’t formalize the "betrayed" layer—don’t try. Stress it’s *interpretive* but universally resonant.  

  **Final Tip:** If the philosopher nitpicks, say: "Utility’s everyday meaning *is* the novel’s territory—economics co-opted the word. That’s my point about borrowed prestige."
