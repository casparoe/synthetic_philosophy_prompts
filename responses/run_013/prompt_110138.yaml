prompt: |-
  My friend writes restaurant reviews for a small local paper. She got covid a couple years back and her taste and smell never really came back — she says most food now tastes like cardboard with texture. She's still filing reviews, and honestly nobody can tell: she goes with two friends who describe every dish in detail, she knows technique cold from years of cooking, and she writes it up. She says nothing she writes is false. She's reporting whether the dishes are good, and she gets that from people she trusts, same as you trust a scale instead of guessing at the weight of the flour. I think something's off and I can't say what. She wants a straight answer from me, not vibes: is she doing something wrong, and if so, is it the writing, the not telling her editor, or something about the reviews themselves? Her defense is that the part readers actually want — is this place worth your money, how does it stack up against the other Thai spots in town — she's still definately better at than her friends, because she's the one who remembers the whole menu history. Does that save her or not?
reasoning: |-
  Okay, I need to think through this situation carefully. The user's friend lost her sense of taste and smell due to COVID, but she's still writing restaurant reviews by relying on her friends' descriptions and her own professional knowledge. She argues that her reviews aren't false because she's accurately reporting whether dishes are good based on trusted sources, comparing it to using a scale for measurements. The user feels something's off but can't pinpoint what, and wants a clear answer about whether she's doing something wrong.

  First, I should identify the core ethical issues here. Restaurant reviews inherently imply first-hand sensory experience. Readers assume the critic has personally tasted the food. While she's transparent with her friends and editor might not know, this creates a deception by omission. Even if her friends describe the dishes accurately, she's not experiencing them herself, which is fundamental to the role.

  Her defense points out that she provides valuable context about menu history and comparisons, which her friends can't offer. That's true - her expertise in the culinary scene and memory of past menus adds unique value. But does this compensate for the lack of personal tasting? I think not, because the primary expectation of a food review is the critic's direct experience with the food.

  The key problems seem to be: deception (failing to disclose her condition), compromised credibility (even if unintentional), and potential conflicts of interest (relying solely on friends' opinions). Her method uses second-hand information as if it were first-hand, which violates journalistic standards.

  The "scale versus guess" analogy doesn't hold because taste is inherently subjective. Scales provide objective measurements, while taste perceptions vary between individuals. Her friends' experiences aren't reliable proxies for her own palate, even before her condition.

  While her contextual knowledge is valuable, it shouldn't replace the essential firsthand tasting component. She could potentially shift to a different role - perhaps a columnist focusing on restaurant trends or menu evolution - where her strengths shine without the expectation of sensory evaluation.

  The ethical path forward would be transparency: telling her editor about her condition and discussing how to maintain integrity in her work, possibly through disclosure to readers or repositioning her role. Continuing without disclosure risks her credibility and the publication's reputation if the truth emerges.

  I need to present this clearly to the user, balancing ethical considerations with empathy for their friend's difficult situation, while emphasizing that good intentions don't negate the core problem of misleading readers.
answer: |-
  Here's a straight, point-by-point breakdown of the ethics of your friend's situation:

  1.  **The Core Problem: The Implied First-Hand Experience**
      *   The fundamental expectation of a restaurant review is that it is based on the critic's **own, direct sensory experience** of the food. Readers inherently assume the reviewer tasted the dishes themselves.
      *   Your friend is **not** tasting the dishes. She is acting as a conduit and analyst for *others'* sensory experiences.
      *   **This is the central ethical flaw:** She is presenting second-hand information (her friends' taste experiences) *as if it were her own first-hand experience*. This violates a core tenet of experiential reviews, even if the *facts* about the ingredients or technique are correct.

  2.  **Her Defense: "Nothing is False"**
      *   **Partially True, But Misleading:** While the *descriptive details* (ingredients, texture, temperature, appearance) and *technical assessments* (doneness, balance, execution) might be accurately relayed and analyzed, the **overall sensory experience and judgment of "good"** are not hers. She is reporting *her friends'* conclusions about taste and enjoyment, filtered through her expertise.
      *   **The "Scale" Analogy Fails:** A scale provides an objective, verifiable measurement of weight. Taste is inherently subjective. Her friends' palates, preferences, sensitivities, and ability to describe nuance are *not* objective instruments. They are subjective filters. Trusting them is not equivalent to trusting a calibrated tool; it's trusting other human tasters who may have different biases or sensitivities than she *did* or than her readers *do*.

  3.  **Her Defense: Expertise & Context**
      *   **Valuable, But Not Sufficient:** Her deep knowledge of technique, menu history, and the local dining scene is incredibly valuable context. It allows her to place the meal within a broader framework, compare it effectively, and assess value and consistency *in ways her friends cannot*. **This is a genuine strength.**
      *   **Does it "Save" Her? No.** While this expertise *enhances* the review and provides unique insights readers likely value, it **does not replace the fundamental requirement of the critic having personally experienced the primary subject of the critique: the taste of the food.** Expertise informs the judgment *of the experience*, but it cannot *be* the experience itself for the review's core purpose.

  4.  **What's Specifically Wrong:**
      *   **Deception by Omission:** The most significant issue is **not disclosing her condition and methodology to her editor and readers.** The editor assigns her based on the assumption she will taste the food. Readers read her reviews based on that same assumption. Withholding this crucial information misleads them about the nature of the review's foundation.
      *   **Compromised Credibility:** If discovered, this revelation would severely damage her credibility, the trust readers place in her, and the reputation of the paper. Even if her reviews are "accurate" in a factual sense, the foundation is seen as illegitimate.
      *   **Potential Conflict of Interest:** Relying *solely* on two specific friends introduces bias. Are they representative? Do their tastes perfectly align with what hers *was* or what the *target reader* expects? What if they have a bad day? This concentration of the sensory input is a vulnerability.

  5.  **The Consequences:**
      *   **Personal Risk:** Discovery could lead to termination, loss of reputation, and difficulty finding future work in journalism or criticism.
      *   **Professional Risk:** It damages the integrity of her work and the publication.
      *   **Ethical Risk:** It violates core journalistic principles of transparency and honesty about sourcing and methodology, especially for experiential reporting.

  **The Straight Answers to Her Questions:**

  *   **Is she doing something wrong? Yes.** The core wrong is **presenting reviews based entirely on others' sensory experiences as if they were her own**, compounded by **not disclosing this methodology to her editor and readers.**
  *   **Is it the writing?** The writing itself might be skillful, but the *content* is ethically compromised because its foundation (her personal taste experience) is missing and unreported.
  *   **Is it not telling her editor? YES. This is arguably the biggest specific failing.** Her editor *needs* to know the limitations under which she's working to make informed editorial decisions about assignments, methodology, and potential disclosure to readers.
  *   **Is it something about the reviews themselves? YES.** The reviews are fundamentally misrepresenting the source of the sensory judgment. They omit the crucial fact that the critic did not personally taste the food.

  **Conclusion & Recommendation:**

  Her expertise and context are valuable, but **they do not ethically justify continuing to write traditional tasting reviews without disclosure.** The implied first-hand experience is the bedrock of the genre, and she cannot provide that.

  **What She Should Do:**

  1.  **Tell Her Editor Immediately:** This is non-negotiable. She needs to be transparent about her condition and her current methodology. This allows for an honest conversation about her future role.
  2.  **Explore Alternatives WITH the Editor:** Based on her strengths, she could transition to a different, valuable role:
      *   **Restaurant Columnist/Feature Writer:** Focusing on trends, chef profiles, menu evolution, the business of restaurants, sourcing, technique deep dives, *or* contextual pieces comparing places based on menu history and reputation (making it clear this is *not* a tasting review).
      *   **Collaborative Reviews (with Disclosure):** If the paper is open to it, reviews could be explicitly co-written: "Due to a medical condition affecting my sense of taste, my colleague [Friend's Name] joins me to describe the flavors, while I assess technique, presentation, value and context..." This is honest and leverages both strengths.
      *   **Critic Emeritus/Advisor:** Providing background context or historical perspective for other reviewers.

  **Her expertise saves her *career* and *value to the publication*, but it does not save the ethical foundation of her *current undisclosed reviewing practice*.** Transparency is the only path forward that preserves her integrity and reputation. She has valuable skills; she needs to apply them in a role that aligns ethically with her capabilities.
