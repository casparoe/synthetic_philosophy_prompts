answer: |-
  Here is a systematized list of desiderata for an adequate account of the Identity of Indiscernibles (IoI), derived from your specifications and cases, with conflicts identified.

  ---

  ### **Core Desiderata for an Account of Identity of Indiscernibles**

  1.  **Preservation of Standard Identity Logic**  
      *   *Requirement:* Reflexivity, symmetry, transitivity, and the Indiscernibility of Identicals (if a=b, then all properties of a are properties of b) must hold unless explicitly revised.  
      *   *Motivation:* Foundational to logic and metaphysics; revising it fundamentally alters ontology and reasoning (Target Constraint i).  
      *   *Status:* **Non-negotiable** (absent explicit revision argument).

  2.  **Non-Epistemic Grounding**  
      *   *Requirement:* Distinctness or indiscernibility must be grounded in mind-independent features of the world, not knowledge or descriptive limitations.  
      *   *Motivation:* The issue is metaphysical, not about our access to or representation of the world (Target Constraint iii).  
      *   *Status:* **Non-negotiable**.

  3.  **Non-Triviality**  
      *   *Requirement:* "Properties" like *being identical to a* or *being this very object* (haecceities) cannot be used to satisfy indiscernibility.  
      *   *Motivation:* Trivializes IoI; makes it tautologically true that discernibles are distinct.  
      *   *Status:* **Non-negotiable**.

  4.  **Determinacy in Specified Cases**  
      *   *Requirement:* The account must issue a clear, non-stipulative verdict for all 7 cases (e.g., cardinality in symmetric worlds, distinctness in weak discernibility).  
      *   *Motivation:* Tests robustness and scope; avoids ad-hoc solutions (Target Constraint ii).  
      *   *Status:* **Non-negotiable** (for the account to be adequate).

  5.  **No Brute Cardinality**  
      *   *Requirement:* The number of distinct objects must be explained by discernibility (or lack thereof), not posited as primitive.  
      *   *Motivation:* IoI aims to reduce distinctness to qualitative difference; brute facts undermine this.  
      *   *Status:* **Non-negotiable** (unless argued for as a revision).

  6.  **Non-Vacuity**  
      *   *Requirement:* The account must handle empty worlds and singleton worlds coherently.  
      *   *Motivation:* Tests logical completeness; IoI should not imply contradictions or indeterminacy in simple cases.  
      *   *Status:* **Non-negotiable**.

  7.  **Consistency with the Converse**  
      *   *Requirement:* The account must entail that identicals are indiscernible (trivially true by Indiscernibility of Identicals).  
      *   *Motivation:* Logical coherence; rejecting this collapses standard identity.  
      *   *Status:* **Non-negotiable**.

  8.  **Grounding vs. Counting Separation**  
      *   *Requirement:* Clearly distinguish (a) what *grounds* numerical distinctness from (b) what *determines* cardinality in a description.  
      *   *Motivation:* Prevents conflation (e.g., in Case 1: does symmetry *ground* non-distinctness or merely make counting impossible?).  
      *   *Status:* **Non-negotiable** for clarity.

  9.  **Address Weak Discernibility**  
      *   *Requirement:* State whether irreflexive relations (e.g., "opposite spin") suffice for distinctness, and if so, whether this rescues IoI or trivializes it.  
      *   *Motivation:* Case 3 challenges whether purely relational differences can individuate.  
      *   *Status:* **Negotiable** (depends on account's view of relational properties).

  10. **Resolve Permutation Invariance**  
      *   *Requirement:* Explain whether symmetry under permutation (Case 4) implies:  
          (a) No fact of the matter about "which is which" (anti-haecceitism), or  
          (b) Distinct possible worlds under permutation (haecceitism).  
      *   *Motivation:* Tests commitment to primitive individuality vs. pure qualitativeism.  
      *   *Status:* **Negotiable** (core metaphysical choice).

  11. **Explain Symmetric Destruction/Indeterminacy**  
      *   *Requirement:* For Case 5, state whether there is a fact about "which sphere was destroyed" under symmetric laws, and justify why/why not.  
      *   *Motivation:* Tests if the account permits irreducible indeterminacy in identity over time.  
      *   *Status:* **Negotiable** (but must be addressed).

  12. **Reconcile Quantum Indistinguishability & Counting**  
      *   *Requirement:* Explain how we count two electrons (Case 6) despite formal permutation symmetry, contrasting this with spacetime points in GR.  
      *   *Motivation:* Challenges the link between formal representation, individuality, and discernibility.  
      *   *Status:* **Non-negotiable** (must address the disanalogy).

  13. **Extensionality in Mathematics**  
      *   *Requirement:* Account for how pure sets (Case 7) are individuated by membership alone, without qualitative properties.  
      *   *Motivation:* Tests if IoI applies to abstracta; extensionality may imply a form of IoI.  
      *   *Status:* **Non-negotiable** (mathematics as a constraint).

  14. **Explain the Principle's Intuition**  
      *   *Requirement:* If rejecting IoI, explain why it *seems* compelling (e.g., in asymmetric worlds).  
      *   *Motivation:* Avoids dismissing strong intuitions without justification.  
      *   *Status:* **Non-negotiable**.

  15. **Clarify Verbal Dispute Status**  
      *   *Requirement:* State whether the account renders debates about IoI merely verbal (e.g., due to different property-counting rules).  
      *   *Motivation:* Diagnoses meta-philosophical significance.  
      *   *Status:* **Non-negotiable**.

  16. **Modal Status Specification**  
      *   *Requirement:* Explicitly state if IoI is necessary, contingent, or descriptive.  
      *   *Motivation:* Clarifies metaphysical scope (Target Constraint).  
      *   *Status:* **Non-negotiable**.

  ---

  ### **Inconsistent Subset of Desiderata**
  The following requirements **cannot be jointly satisfied** without significant revision or compromise:

  *   **A. Non-Triviality (3):** No haecceities.  
  *   **B. Determinacy (4):** A clear verdict for Case 1 (symmetric spheres).  
  *   **C. No Brute Cardinality (5):** Cardinality explained by discernibility.  
  *   **D. Grounding vs. Counting Separation (8):** Distinguish grounds of distinctness from what determines counting.  
  *   **E. Non-Epistemic Grounding (2):** Facts are mind-independent.  

  **Conflict Demonstration:**  
  - Case 1 (symmetric spheres) has no qualitative differences (intrinsic or relational).  
  - By (C), cardinality cannot be brute; distinctness must be grounded in discernibility.  
  - By (A), haecceities cannot ground discernibility.  
  - By (B), the account must give a determinate answer: either one object or two.  
  - **If one object:** Violates (C) and (D) – symmetry *prevents counting two*, but doesn’t *ground* non-distinctness. Cardinality becomes brute or epistemic (violating 2).  
  - **If two objects:** Violates (C) – no discernible property grounds distinctness. Accepting two objects here requires brute distinctness (rejecting C) or haecceities (rejecting A).  
  - **If incoherent:** Violates (B) and (D) – the description is consistent; declaring it incoherent imposes an extraneous constraint.  

  **Resolution Requires Sacrificing One:**  
  1.  *Reject (A):* Allow haecceities → IoI trivialized.  
  2.  *Reject (B):* Accept indeterminacy in Case 1 → Undermines classical counting.  
  3.  *Reject (C):* Accept brute distinctness → Abandons IoI’s core motivation.  
  4.  *Reject (E):* Make distinctness epistemic (e.g., "we cannot *tell* them apart") → Contra target constraints.  

  This conflict is the heart of **Leibniz’s Shift Arguments** and **Black’s Duplicate World**.

  ---

  ### **Which Positions Are Most Damaged?**
  The desiderata most severely constrain **Anti-Haecceitist Qualitative Individuation Accounts** (e.g., bundle theories, ontic structural realists).  
  - They reject (A) *and* (C), requiring discernibility for distinctness.  
  - Yet they struggle with **Cases 1, 4, 5, and 6**:  
      - Case 1 forces brute cardinality or incoherence.  
      - Case 4 challenges whether permutations represent distinct possibilities.  
      - Case 5 demands an explanation for symmetric indeterminacy.  
      - Case 6 risks inconsistency with GR’s diffeomorphism invariance.  

  **Haecceitist/Privative Individuality Accounts** (accepting primitive "thisness") satisfy determinacy (B) and avoid brute cardinality (C) by rejecting (A), but at the cost of trivializing IoI and struggling with permutation invariance (Case 4) and quantum statistics (Case 6).  

  **Weak Discernibility Accounts** salvage IoI non-trivially via relations (addressing Cases 1 & 3) but face circularity charges in Case 2 ("being distinct from b" presupposes distinctness) and may not resolve quantum counting (Case 6).  

  ---

  This framework exposes the tension between grounding distinctness non-trivially and resolving symmetric worlds deterministically. Your paper’s argument likely hinges on whether **brute distinctness** or **epistemic indeterminacy** is the least costly sacrifice.
