  The key turned smoothly in the lock, a sound so familiar it registered only in Anna’s bones. Inside, the stale air tasted of dust and forgotten meals. *He’s been away again,* she thought, dropping her worn leather satchel onto the cracked linoleum. *Three days this time.* The silence wasn’t peaceful; it was accusatory.

  Twenty years. Twenty years of Paul’s restless brilliance, his sudden enthusiasms that burned out like flares, leaving her to manage the embers of bills, house repairs, the quiet despair of abandonment that wasn’t quite abandonment, just… drift. And then the apologies, the charm offensive, the promises that dissolved like sugar in rain. It was the cycle itself she’d grown to fear – the inevitable moment of weakness when the loneliness bit deepest, when he’d smile that crooked smile, and she’d relent, letting him back into the space he’d vacated.

  That’s why she’d built the Box. Seven years ago, in the garage workshop Paul never used, surrounded by the smell of sawdust and epoxy resin. It wasn’t sophisticated. A hefty steel cash box, its keyhole overridden by a robust digital timer lock she’d bought online. Inside, nestled in layers of bubble wrap, a sealed, unmarked envelope. Inside *that*, two photographs: one, a picture of Paul walking away down a rain-slicked street, oblivious. The other, a screenshot of her bank balance from the day she’d finally paid off the last of the debt *his* last "sure thing" business venture had incurred. Beneath them, a single sentence she’d typed and printed: *Remember why you must leave.*

  The Box’s purpose was simple, brutal. If she ever found herself on the brink of taking Paul back after one of his vanishing acts, she was to trigger the timer. Set it for 48 hours. Lock the Box. Place it prominently on the kitchen table. And then walk away. For two days, the Box would be a physical, unignorable barrier. She couldn’t open it to retrieve the key to *her* resolve – the photos, the reminder – until the timer chimed. By then, the vulnerable moment would have passed. She’d be clear-headed again. She’d be safe from her own disastrous compassion. She’d made the commitment when she was strong, to bind her future, weaker self. No choice. No possibility of doing otherwise once the timer was ticking.

  She walked through the dim living room, past the sagging sofa Paul had promised to replace. Her hand brushed the cold enamel of the Box where it sat, a silent sentinel, on the sideboard. She hadn’t set the timer tonight. She hadn’t needed to. The decision felt different this time. Not a desperate lunge, but a cold, certain settling. She was leaving. Now. Before he returned.

  She went upstairs, her footsteps echoing in the empty house. The spare room closet held the suitcase she’d slowly, secretly filled over weeks. She pulled it out. Back in their bedroom – *her* bedroom now – she opened the wardrobe. She didn’t grab armfuls. She selected. Two pairs of trousers, three shirts, underwear. Folded them with deliberate care, smoothing wrinkles that didn’t exist, stacking them precisely in the case. She paused, holding a blue sweater Paul had given her years ago. She remembered the look on his face – genuine delight, then – as she’d unwrapped it. Her fingers tightened on the wool. For a breath, the old ache pulsed. Then, with a small, sharp movement, she laid the sweater aside on the bed. *Not mine anymore.* She zipped the case closed. The sound was final.

  Downstairs, she grabbed her satchel and the suitcase. She paused at the front door, hand on the knob. Her gaze flickered to the Box on the sideboard. The digital display was dark, inert. Had it ever worked? A memory surfaced: last year, during a power surge, all the clocks had blinked. Had the timer reset? Lost its programming? She’d meant to check it. Never did.

  Then, last month, the garage door opener had malfunctioned. Dave, the grizzled technician who serviced the neighborhood, had come. While he wrestled with the opener’s motor, she’d idly pointed to the Box. "That old timer lock, Dave. You know anything about them? Think it’s still reliable?"

  Dave had grunted, wiping grease on his coveralls. "That model? Bit of a dinosaur, Anna. Electro-mechanical gubbins inside. Springs get weak, contacts corrode. Seen plenty just… stop. Or get flaky. Would it *have* fired if ya set it?" He’d shrugged, a massive movement of his shoulders. "Maybe. Maybe not. Like askin' if a spark plug'll spark in a damp shed. Might. Might fizzle. Point is, it didn't, right? Job's done." He’d tapped the side of the Box with a wrench. "This thing did its job just sittin' there, if it kept ya on the straight and narrow. Psychological, innit?"

  She hadn’t corrected him. Hadn’t told him she hadn’t set it. That she’d walked the line without needing the guardrail. Or had she?

  Now, standing at the threshold, suitcase in hand, the question roared back. If she *had* wavered tonight, if she’d felt the old pull and reached for the Box… what then? Would the timer have engaged with its soft, decisive click? Would the lock have held fast for 48 hours, forcing her to confront those stark photographs before she could capitulate? Or would the mechanism have been silted with time, its springs slack, its circuits corroded, offering no resistance at all? Would the key have turned easily in the lock she’d designed to be her prison?

  She didn’t know. Couldn’t know. The counterfactual was a closed door. Dave’s indifferent "might, might not" echoed.

  She opened the front door. The cool night air rushed in. She stepped out onto the porch, pulling the door shut behind her. The latch snicked home. She walked to her aging sedan, the one that needed new brake pads she’d been putting off. She loaded the suitcase into the trunk.

  *I did it. I walked out. I folded the clothes. I left the sweater. I chose.*

  But the whisper followed: *Could you have done otherwise? If you’d wanted to stay, really wanted to… could you have opened the Box? Or was the path out the only one truly open?*

  She started the car. The engine coughed, then settled into its familiar uneven rumble. She pulled away from the curb, the house shrinking in the rearview mirror. The Box sat inside, a silent monument to a past self’s fear, its true power now terrifyingly ambiguous.

  Where did the compulsion lie? In the potential of the machine, or in the architecture of her own resolve, built over years of hurt? Had the Box, functional or not, already shaped the landscape of her choice long before this night?

  She drove towards her sister’s place, the only refuge she’d allowed herself to plan. She’d have to tell people. Paul. Her sister. Friends who’d witnessed the cycle. What story would she offer?

  *I left. I had to. It was the only thing to do.* True, in a way.
  *I chose to leave. Freely.* Also true, it felt true, in the moment of folding, of leaving the sweater.
  But another truth, cold and inescapable, hummed beneath: *I’ll never know if I could have chosen differently. I’ll never know if the door back was truly locked, or just painted shut by my own conviction, aided by the ghost of a machine.*

  The uncertainty wasn’t clever. It was vertigo. It hollowed out the solid ground of both responsibility and freedom, leaving her suspended over a question that couldn’t be answered, only inhabited. The car rattled over the uneven road, mirroring the tremor in her hands on the wheel. The streetlights painted fleeting, shifting shadows on the asphalt ahead, illuminating the path she was on, while the road not taken, the counterfactual path back, remained shrouded in the impenetrable dark of a Box whose secret she could never crack.
