  Let's design the questions:

  Question 1: Absolute directions (like north/south) vs. relative (left/right)
  Scenario: You are in a featureless desert with a native speaker of a language that uses only absolute directions (no words for left/right). You point to a spot on the horizon and ask them to remember it. Then you both spin around until dizzy and they have to point to the same spot again. What happens?
  A) They can do it easily because they always know the absolute directions.
  B) They can do it but only if they were paying attention to the absolute direction at the time; if not, they might fail.
  C) They are no better than someone who uses relative directions because the task is about memory and spatial sense, not language.

  This question distinguishes:
  - Hard determinist: A (language gives them the concept, so they can think in absolute terms and do the task)
  - Lab-influence: B (language helps if they use it at encoding, but it's not necessary)
  - Only-in-the-moment: B (the effect is at encoding)
  - Reporting: C (language doesn't help with the non-verbal task)
  - Universalist: C (everyone has the same spatial abilities)
  - Artifact: C (it's about the environment and practice, not language per se)
  - Deflationist: C (if you control for practice, the effect disappears)
  - Cost: A or B (if they use absolute directions, it's easier and they do it more reliably)
  - Coordination: A (the group has established absolute directions as a norm, so they use it)
  - Inner-speech: B (if they were using inner speech at the time, they might remember)

  But note: we have to map the answers to the buckets in the scoring.

  Similarly, we design 9 more. Let's sketch:

  Question 2: Evidentiality (marking the source of information)
  Scenario: A child growing up in a language that forces you to mark how you know something (e.g., saw it, heard it, inferred it) is telling a story about something they witnessed. How does this affect their memory of the event?
  A) They remember the event itself more accurately because they have to categorize their source.
  B) They remember the source of their knowledge better, but not necessarily the event.
  C) It doesn't affect their memory; it only affects how they report it.

  Question 3: Number words (only up to three)
  Scenario: An adult from a community with no exact number words beyond three is shown an array of seven stones for a few seconds. Then the stones are hidden and they have to recreate the array with the same number. How do they do?
  A) They can't do it because they don't have the concept of seven.
  B) They can do it if they use a non-verbal strategy (like making a mental pattern) but not if they try to count.
  C) They do it just as well as someone with number words, because the task is about visual memory.

  Question 4: Motion event description (English vs. Spanish)
  Scenario: An English speaker and a Spanish speaker watch the same short video of someone running out of a building. Then they are asked to describe it. How does their description differ?
  A) The English speaker will focus on the manner of motion (running) and the Spanish speaker on the path (exiting).
  B) The difference is only in what they choose to say; if you test their memory non-verbally (e.g., pick the video they saw from two options: one with running and one with walking), they both remember equally well.
  C) The difference is in the grammar, but both can think about both manner and path.

  Question 5: Noun gender and object description
  Scenario: In a language with grammatical gender, people are asked to describe a bridge (which is masculine in one language, feminine in another). What do they say?
  A) They use adjectives that match the gender (e.g., strong for masculine, elegant for feminine).
  B) They might use such adjectives if asked to describe it in words, but if you ask them to draw it or point to a picture that matches, they choose the same regardless of language.
  C) The gender effect only appears when they are speaking; it doesn't affect their non-verbal representation.

  Question 6: Two words for blue
  Scenario: A language has two distinct words for light blue and dark blue (like Russian). When speakers of that language are shown a color wheel and asked to pick which two colors are most different, what happens?
  A) They are faster and more consistent at distinguishing light and dark blue, even if the shades are close.
  B) They are faster only if they are using language (e.g., if they have to say the name), but not if they are just pointing.
  C) They are not faster; they just have two labels for the same concept.

  Question 7: Adult learning a second language
  Scenario: An adult native English speaker learns a language that requires absolute directions. After becoming fluent, they do a task that requires reorienting in a room with no landmarks. How do they perform?
  A) They can now use absolute directions as well as a native speaker of that language.
  B) They can use absolute directions only when they are actively using the second language; when they switch back to English, they revert.
  C) They still struggle because the ability to use absolute directions is acquired in childhood.

  Question 8: Child learning first language
  Scenario: A child is learning a language that doesn't have a future tense (it uses the same form for present and future). How does this affect their ability to plan for the future?
  A) They have trouble planning because they don't have the concept of the future.
  B) They can plan for the future just as well as any child, but they might express it differently.
  C) They might be less likely to talk about the future, but non-verbal tests (like choosing a larger delayed reward) show they can plan.

  Question 9: Task with verbal interference
  Scenario: Speakers of a language that uses absolute directions are doing a non-verbal task (remembering the location of an object in a room) while repeating a string of words out loud. What happens?
  A) The verbal interference wipes out their advantage because they need language to think about the directions.
  B) They still do better than speakers of relative-direction languages because the directional knowledge is now non-verbal.
  C) They do the same as anyone else under verbal interference because the task is non-verbal.

  Question 10: Coordination in a group
  Scenario: Two groups of people are shown a set of abstract shapes. One group is given a set of made-up names for the shapes and the other isn't. Then they do a task where they have to sort the shapes. What happens?
  A) The group with labels sorts the shapes more consistently and can teach the categories to new members easily.
  B) The group with labels does better only when they can talk during the task; if they have to sort non-verbally, they do the same as the other group.
  C) The labels don't help because the shapes are abstract and hard to categorize.

