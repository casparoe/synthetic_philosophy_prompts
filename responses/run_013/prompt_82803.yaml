  The buckets are:

  1. Hard determinist: Language sets the outer limit of what can be thought at all. Without a word for it, you can't think it.
  2. Lab-influence view: Language shifts how people do on non-verbal tasks (like color chips, spatial reasoning, counting) but doesn't fence anything off. It's an influence on performance, not a barrier.
  3. Only-in-the-moment view: The effect is temporary, happening only during the moment of assembling a sentence, and doesn't affect perception or memory afterwards.
  4. Reporting view: Language changes what people say and what they can reconstruct for retelling, but doesn't change the underlying thought or perception.
  5. Universalist: Concepts are essentially the same everywhere; language is just a superficial coating.
  6. Artifact view: The interesting effects come from cultural tools (writing, number notation, lists, code) that we bolt onto language, not from the mother tongue itself.
  7. Deflationist: Most reported effects are artifacts of the experimental task and would disappear under better controls.
  8. Cost view: Language doesn't change what you can think, but it changes the effort required. It provides ready-made chunks, so you're more likely to use what's easy.
  9. Coordination view: The real effect is at the group level. Shared labels allow a group to establish a category, which individuals then inherit as a social fact (like legal categories). Relativity is about how concepts are distributed in a population, not about individual brains.
  10. Inner-speech view: Whether language affects thought depends on whether you are someone who uses inner speech a lot. So it's about individual differences, not the language per se.

  We need 10 questions that use concrete cases and have three options each. The cases should pull apart the disagreements between the buckets (e.g., perception vs memory, moment of speaking vs after, grammar vs vocabulary, person vs task).

  We also need:
  - Some tasks that can't be done in words (pointing, matching, remembering a shape, while repeating something out loud).
  - At least one question about an adult learning a second language and one about a child learning their first language.
  - Options that are tempting and not obvious which bucket they lead to.

  After the quiz, we will provide:
