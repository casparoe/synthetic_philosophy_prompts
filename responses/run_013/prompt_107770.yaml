  Below is a decision tree for the sorites paradox and vagueness, structured as a flowchart. Start at **Question 1** for any vague predicate (e.g., "heap," "PII," "guilty beyond reasonable doubt"). Answer each question based on your commitments, not predefined labels. The tree reveals how your answers force you to abandon one of the three core claims:  
  (1) *Clear negative case* (e.g., 1 grain isn’t a heap),  
  (2) *Tolerance* (e.g., adding 1 grain never turns non-heap to heap),  
  (3) *Clear positive case* (e.g., 10,000 grains is a heap).  

  Each leaf names a position (if standard) or describes a coherent but unnamed view, specifies which core claim is abandoned, and notes costs. Higher-order vagueness (vagueness in the distinctions themselves) is addressed at relevant nodes. Non-standard examples (e.g., PII, reasonable doubt) are included to test generality.  

  ---

  ### **Decision Tree**  
  **Start here → Question 1: Does the predicate apply to anything at all?**  
  *(e.g., Is there any heap? Any record that is PII? Any defendant guilty beyond doubt?)*  
  - **No** → **Leaf 1: Empty predicate**  
    - *Position*: The predicate has no instances (e.g., nothing is a heap, no record is PII).  
    - *Gives up*: (3) Clear positive case (e.g., 10,000 grains isn’t a heap).  
    - *Cost*: Denies obvious realities (e.g., mountains of sand exist). Ignores how we use language.  
    - *Higher-order vagueness*: Shifts the problem to whether "anything exists" is vague.  

  - **Yes** → **Question 2: Is there a sharp boundary?**  
    *(e.g., A specific grain where non-heap becomes heap? A precise threshold for PII?)*  
    - **Yes** → **Question 3: Is the boundary fixed by the context of utterance?**  
      *(e.g., Does "heap" depend on conversation? Does "reasonable doubt" shift with the trial?)*  
      - **Yes** → **Leaf 2: Contextualism (sharp-in-context)**  
        - *Position*: Boundaries are sharp in a given context but shift with conversation (e.g., "heap" has a precise cutoff in one discussion but not another).  
        - *Gives up*: (2) Tolerance (e.g., adding one grain *can* turn non-heap to heap if context shifts).  
        - *Cost*: Makes truth hostage to conversational whims. Struggles with solitary judgments (e.g., a doctor diagnosing depression alone).  
        - *Higher-order vagueness*: Accepts vagueness in what counts as a "context," leading to regress.  
      - **No** → **Question 4: Can the boundary be known?**  
        *(e.g., Can we discover the exact heap threshold? The true PII line?)*  
        - **Yes** → **Leaf 3: Knowable sharp boundary**  
          - *Position*: Boundaries are fixed and discoverable (e.g., science/convention defines "territory of a species" precisely).  
          - *Gives up*: (2) Tolerance (e.g., adding one grain *does* create a heap at the boundary).  
          - *Cost*: Conflicts with intuition that vagueness is ineliminable (e.g., no one agrees on the "true" line for clinical depression).  
          - *Higher-order vagueness*: Assumes higher-order boundaries are knowable too; ignores fuzziness in "knowability."  
        - **No** → **Leaf 4: Epistemicism**  
          - *Position*: Boundaries are fixed but unknowable (e.g., "heap" has a hidden grain-threshold, but we can’t find it).  
          - *Gives up*: (2) Tolerance (e.g., adding one grain *does* create a heap at the boundary).  
          - *Cost*: Mysterious why boundaries exist but evade knowledge. Fails for normative predicates (e.g., "reasonable doubt" isn’t a hidden fact).  
          - *Higher-order vagueness*: Claims unknowability applies equally to all levels (no regress problem).  

    - **No** → **Question 5: Do borderline cases have a truth value?**  
      *(e.g., Is "n grains is a heap" true/false for borderline n? Is a murky record definitively PII or not?)*  
      - **Yes** → **Question 6: Are truth values degrees?**  
        *(e.g., Is "heap" 30% true for n grains? Is guilt "0.7 beyond doubt"?)*  
        - **Yes** → **Leaf 5: Degree theory**  
          - *Position*: Truth is continuous (e.g., "heap" has degrees; 5,000 grains is 0.5 true).  
          - *Gives up*: (2) Tolerance (e.g., adding one grain *does* change truth values, even if minimally).  
          - *Cost*: Counters intuition that truth is binary. Makes logic non-classical (e.g., "heap or not heap" can be 0.5 true).  
          - *Higher-order vagueness*: Degrees apply to all levels, but boundaries between degrees may be vague (regress accepted).  
        - **No** → **Leaf 6: Glut theory**  
          - *Position*: Borderline cases are both true and false (e.g., a species' territory is both "in" and "not in" at a boundary).  
          - *Gives up*: (2) Tolerance (e.g., adding one grain *does* change status, but contradictions arise).  
          - *Cost*: Tolerates contradictions. Rarely defended for vagueness.  
          - *Higher-order vagueness*: Gluts apply to higher orders; regress is unproblematic.  

      - **No** → **Question 7: Is the law of excluded middle (LEM) valid?**  
        *(e.g., Is "n grains is a heap or not a heap" always true? Is "PII or not PII" certain?)*  
        - **Yes** → **Leaf 7: Supervaluationism**  
          - *Position*: Truth is "supertrue" if true in all precisifications (e.g., "heap" has many sharp boundaries; LEM holds because it’s sharp in each).  
          - *Gives up*: (2) Tolerance (e.g., adding one grain *can* turn non-heap to heap in some precisifications).  
          - *Cost*: Truth becomes "best case" across interpretations. Fails for normative cases (e.g., "reasonable doubt" isn’t precisifiable).  
          - *Higher-order vagueness*: Precisifications have vague borders; regress is acknowledged but deemed harmless.  
        - **No** → **Leaf 8: Gap theory**  
          - *Position*: Borderline cases lack truth values, and LEM fails (e.g., "n grains is a heap" is neither true nor false; "clinically depressed" has gaps).  
          - *Gives up*: Classical logic (indirectly abandons (2) by restricting its application to clear cases).  
          - *Cost*: Loses intuitive logic rules. Struggles with reasoning (e.g., can’t deduce "heap" for 10,000 grains without LEM).  
          - *Higher-order vagueness*: Gaps have vague boundaries; regress is unresolved.  

  ---

  ### **Notes on the Tree**  
  - **Unoccupied/coherent but unattractive positions**:  
    - *Leaf 6 (Glut theory)*: Coherent but rarely defended; glut theorists typically target paradoxes like the liar, not sorites.  
    - *Leaf 3 (Knowable sharp boundary)*: Logically possible but empirically unattractive; no known examples (e.g., no one agrees on "exact" reasonable doubt).  
    - *Leaf 1 (Empty predicate)*: Coherent but absurd for most predicates (e.g., denying heaps exist).  

  - **Indistinguishable positions**:  
    - Epistemicism (*Leaf 4*) vs. a conventionalist view where boundaries are fixed by use but unknowable: These are functionally identical. The tree doesn’t force them apart because they share commitments (unknowability + sharp boundaries).  

  - **Higher-order vagueness**:  
    - All positions (except epistemicism) accept that vagueness recurses. Epistemicism denies higher-order vagueness by claiming all boundaries are sharp but unknowable.  
    - Nodes like *Question 2 (sharp boundary?)* and *Question 4 (knowable?)* are vulnerable to vagueness. The tree assumes you can answer based on your stance, but positions describe how they handle fuzziness (e.g., supervaluationism "accepts regress").  

  - **What the tree cannot do**:  
    - Distinguish positions that are relabelings (e.g., "conventional unknowable boundary" = epistemicism).  
    - Resolve whether vagueness is "in the world" or "in language"; this cuts across branches (e.g., degree theory can be either).  
    - Cover every historical variant; it maps logical space, not scholarship.  

  ---

  ### **Summary of Core Claim Abandonments**  
  | **Leaf** | **Position** | **Abandons** | **Cost** |  
  |----------|--------------|--------------|----------|  
  | 1 | Empty predicate | (3) Clear positive case | Denies observable reality |  
  | 2 | Contextualism (sharp-in-context) | (2) Tolerance | Truth depends on unstable context |  
  | 3 | Knowable sharp boundary | (2) Tolerance | Ignores why boundaries seem vague |  
  | 4 | Epistemicism | (2) Tolerance | Unknowability is mysterious |  
  | 5 | Degree theory | (2) Tolerance | Non-classical logic; degrees are unintuitive |  
  | 6 | Glut theory | (2) Tolerance | Tolerates contradictions |  
  | 7 | Supervaluationism | (2) Tolerance | Truth is "best case," not intuitive |  
  | 8 | Gap theory | Classical logic (indirectly (2)) | LEM fails; reasoning is hampered |  

  This tree fits 8 leaves and 7 branch nodes. Use it by applying your chosen predicate (e.g., "Is this patient depressed?") and following your answers to see which paradox resolution you endorse.
