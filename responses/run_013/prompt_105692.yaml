answer: |-
  Your distinction collapses under standard evolutionary game theory. Consider your cartel example: incumbent firms honoring an agreement being undercut by entrants. This is precisely modeled as an evolutionary stable strategy (ESS) condition in a population game. The "fixed" players vanish—we analyze strategy frequencies in a population. Cooperation isn't an ESS if defectors (entrants) have higher fitness (profits). The equilibrium isn't among fixed players but in the strategy distribution itself. Your "binding arrangement" is just another strategy subject to the same replicator dynamics; if it raises fitness against prevailing strategies, it invades. If not, it vanishes. No separate "larger selection process" exists—fitness payoffs *are* the selection mechanism.

  Your objection that commitments among incumbents fail against entrants is trivially captured by asymmetric games or meta-games where commitment ability itself is a heritable trait with fitness consequences. If commitment imposes costs (e.g., enforcement), it lowers fitness against defectors unless compensated by higher group productivity—a classic ESS calculation. The folk theorem even extends to evolutionary settings: repeated interaction can sustain cooperation if the shadow of the future outweighs short-term gains from defection *in expected fitness terms*. When it fails, it's because discount rates or mutation rates break the condition—parameters already in the models. "Composition traps" are just evolutionary equilibria where no mutant strategy invades. Nothing in your advertising or regulatory race examples requires mechanisms beyond replicator dynamics or stochastic game theory. The alleged distinction is operationalized noise.

