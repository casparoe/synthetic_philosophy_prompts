  **Out of character note:**  
  *Settled:* Evolutionary game theory formally models strategy selection via payoff-dependent replication (replicator dynamics, ESS). Endogenous player exit/entry is handled through strategy extinction/invasion.  
  *Contested:* Whether complex institutional commitments can be robustly modeled as evolvable traits without auxiliary assumptions. Some argue real-world coordination requires richer notions of correlated equilibrium or learning.  
  *Overconfidence flag:* I asserted the folk theorem's evolutionary applicability is straightforward—this is debated for finite populations with rare mutations.
