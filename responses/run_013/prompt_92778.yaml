answer: |-
  You've laid out an excellent framework for evaluating decision theories in Pascal's Mugging scenarios. Let's break down your requirements, distinguish genuine constraints from psychological discomfort, and address the core conflicts. Here's a structured analysis:

  ---

  ### **Core Criteria for a Viable Decision Theory**
  1. **Avoid Extortion by Tiny Probabilities**  
     - Must *not* pay the Pascal's Mugger ($10 for 10^{-100} chance of infinite torture).
  2. **Handle St. Petersburg Paradox**  
     - Should justify paying only a *finite* fee to play the St. Petersburg game (infinite EV, but counterintuitive).
  3. **Resolve Two-Sided Muggings**  
     - Must coherently compare 10^{-100} chance of ∞ bliss vs. 10^{-100} chance of ∞ torment (not just cancel to "indifference").
  4. **Sequential Muggings**  
     - Must avoid ruin from a series of muggings that are individually EU-rational but collectively catastrophic.
  5. **Zero-Probability Threats**  
     - Must ignore threats with *literally zero* probability (e.g., "I'm an omnipotent demon, P=0").
  6. **Conditional Threats**  
     - Handle cases where refusal of a finite offer triggers a new threat (e.g., "Give me $5 now, or I'll threaten infinite torture").
  7. **Epistemic Distinctions**  
     - Distinguish probabilities from:
       - Physical randomness (e.g., quantum coin flip).
       - Unreliable testimony (e.g., a stranger's claim).
       - World-updating evidence (the mugger's offer as data about reality).
  8. **Cheap Results**  
     - Preserve **dominance** (if A > B in all states, choose A).
     - Avoid **money pumps** (no sequences of locally rational choices leading to guaranteed loss).
  9. **Cognitive Realism**  
     - Computable by humans without infinitesimal math.

  ---

  ### **Genuine Constraints vs. Psychological Squeamishness**
  | **Requirement**               | **Genuine?** | **Reason**                                                                 |
  |-------------------------------|--------------|----------------------------------------------------------------------------|
  | Avoid paying Pascal's Mugger  | **Genuine**  | EU maximization fails here; leads to exploitation.                        |
  | Pay finite fee for St. Pete   | **Squeamish**| Infinite EV *should* demand any finite fee—but humans reject this.        |
  | Two-sided mugging resolution  | **Genuine**  | Comparing ∞/∞ requires rigor; naive EU fails.                             |
  | Avoid sequential ruin         | **Genuine**  | Myopic EU optimization is self-defeating; global perspective needed.      |
  | Ignore zero-probability threats| **Genuine**  | Undefined expectations; dominance applies.                                |
  | Handle conditional threats    | **Genuine**  | Tests belief updating and commitment rationality.                         |
  | Distinguish probability sources| **Genuine**  | Stranger's claim ≠ physical chance; affects Bayesian updating.            |
  | Preserve dominance            | **Genuine**  | Foundational rationality axiom.                                           |
  | Avoid money pumps             | **Genuine**  | Dynamic consistency requirement.                                          |

  **Key Insight**: Rejecting St. Petersburg's infinite EV is often *psychological* (humans can't grasp ∞), but avoiding mugging is *structural* (EU is fragile under tiny probabilities of huge utilities).

  ---

  ### **Core Conflict: Fanaticism vs. Infinity Sensitivity**
  You correctly identified the tension:  
  - **Anti-Fanaticism**: "Don't pay for arbitrarily tiny probabilities of huge stakes."  
  - **Infinity Sensitivity**: "Infinite stakes dominate finite costs, regardless of odds."  

  **Proof of Conflict**:  
  Suppose a theory satisfies both:  
  1. For any finite cost `c`, there exists probability `p > 0` small enough that it won't pay `c` for a `p` chance of ∞ utility (anti-fanaticism).  
  2. For any `p > 0`, there exists finite `c` large enough that it *would* pay `c` for a `p` chance of ∞ utility (infinity sensitivity).  

  These are directly contradictory. **You cannot have both.**

  ---

  ### **Resolving the Conflict: Which Requirement to Relax?**
  1. **Option 1: Ditch Infinity Sensitivity**  
     - Cap utility functions (e.g., `U(max) = 10^100`).  
     - **Problem**: Fails St. Petersburg and genuine infinite-stakes cases (e.g., "Save ∞ lives with P=0.5").  
     - **Verdict**: Too restrictive; throws out meaningful infinities.  

  2. **Option 2: Ditch Strict Anti-Fanaticism**  
     - Allow paying for tiny probabilities of ∞ stakes, but add constraints (e.g., resource awareness).  
     - **Problem**: Still vulnerable to sequential muggings.  

  3. **Option 3: Contextualize Probability**  
     - Treat the mugger's claim as *evidence*, not a literal probability.  
     - Example: A stranger claiming P(infinite torture) = 10^{-100} *updates your beliefs* about their credibility.  
     - **Solution**: Use Bayesian epistemology to reject incoherent claims.  

  ---

  ### **A Viable Framework: Bayesian Knightian Uncertainty**  
  A theory meeting *most* criteria while being street-applicable:  
  1. **Utility Bounding**:  
     - Use bounded utility functions (e.g., arctan(∞ stakes) = π/2).  
     - *Solves*: Mugging, St. Petersburg (finite EV), two-sided muggings.  
  2. **Knightian Uncertainty**:  
     - Treat stranger-sourced "probabilities" as **ambiguous** (not precise). Use max-min EU or similar.  
     - *Solves*: Epistemic distinction; you ignore the mugger's number.  
  3. **Resource-Awareness**:  
     - Track marginal utility of wealth. For sequential muggings, later decisions account for cumulative costs.  
     - *Solves*: Ruin from multiple muggings.  
  4. **Zero Probability = Zero Weight**:  
     - Dominance applies; ignore non-measurable threats.  
  5. **Conditional Threats**:  
     - Precommit to ignoring threats contingent on refusal (consistent with game theory).  

  **Why this works on the street**:  
  - Bounded utility: "Infinite torture" → "Worst imaginable suffering" (finite proxy).  
  - Ambiguity aversion: "Strangers can't assign reliable odds to wild claims."  
  - Resource tracking: "I've paid 5 muggers already—next demand gets rejected."  

  ---

  ### **Where This Framework Fails**
  - **St. Petersburg**: You pay only a bounded fee (e.g., $100), not "any finite amount." This *is* a concession to squeamishness, but pragmatically necessary.  
  - **Genuine Infinite Stakes**: If faced with a *credible* 10^{-100} chance to save ∞ lives (e.g., quantum vacuum decay), the theory underinvests.  

  **Tradeoff**: Sacrifice rigor in truly infinite cases to avoid exploitation in everyday scenarios. For agents facing cosmic stakes (e.g., AGI), use unbounded EU + ultrafilters—but this fails your "street test."

  ### **Conclusion**
  - **Genuine requirements**: Avoid mugging, handle two-sided infinities, sequential coherence, epistemic distinctions, dominance.  
  - **Squeamishness**: Rejecting St. Petersburg's infinite EV.  
  - **Unavoidable conflict**: Anti-fanaticism and infinity sensitivity *are mutually exclusive*.  
  - **Best practical theory**: **Bounded utility + ambiguity aversion + resource awareness**. This passes the "street test" and blocks muggings while preserving core rationality.  

  > "A theory that demands you pay the mugger is worse than one that refuses St. Petersburg's infinite bet." — Your framework wisely prioritizes robustness over cosmic optimality.
