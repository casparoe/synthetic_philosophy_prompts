answer: |-
  ### Final Essay Question  
  **Lexical Threshold Negative Utilitarianism (LTNU) claims that beyond a specific intensity of suffering, no quantity of pleasure can morally compensate for it—though below that threshold, pleasure-pain trade-offs remain permissible. Using the *floor* (incommensurability) and *cliff* (infinite exchange rate) interpretations of the threshold, evaluate which reading better coheres with LTNU’s core principles. Address:  
  (i) Whether either interpretation avoids arbitrariness in setting the threshold’s location,  
  (ii) What each implies when choosing between preventing *one person’s threshold-level suffering* and providing *massive finite pleasure to many*, and  
  (iii) If LTNU can retain its “negative utilitarian” label despite needing a positive-value scale to weigh compensations below the threshold.**  

  ---

  ### Model Answer (550 words)  
  LTNU’s threshold marks suffering so severe that it cannot be counterbalanced. The **floor reading** treats this as a categorical shift: suffering above the threshold is *incommensurable* with pleasure, placing it beyond comparative valuation. Below the threshold, cardinal trade-offs apply. The **cliff reading**, however, maintains a single scale where the marginal rate of substitution (MRS) of pleasure-for-pain relief becomes *infinite* at the threshold—pleasure can offset suffering below but not at/above it.  

  **(i) Arbitrariness**: Neither reading wholly escapes arbitrariness concerns. The floor’s incommensurability claim appears *less* arbitrary conceptually, as it posits a metaphysical break (e.g., agony that annihilates meaning), potentially justifying discontinuity. Yet *locating* this break remains arbitrary—why *this* intensity? The cliff’s infinite MRS seems *more* arbitrary, as it implies a precise mathematical discontinuity without ontological grounding. A steep but finite MRS could approximate the same practical rigor, undermining the threshold’s necessity.  

  **(ii) The Trade-off Case**: Suppose we can either prevent one person’s threshold-crossing suffering (*Option A*) or grant vast pleasure to millions (*Option B*). The **floor reading** *demands* choosing Option A: threshold suffering is incomparably worse, making Option B irrelevant. The **cliff reading**, however, permits weighing Option B if the suffering sits *just below* the threshold (where finite pleasure could offset it), but not if it crosses it. Yet if the suffering is *at* the threshold, the cliff treats it like the floor: Option B cannot compensate, forcing choice of A. This reveals the cliff’s instability: infinitesimal suffering differences yield radically divergent obligations.  

  **(iii) Negative Utilitarianism (NU) Compatibility**: LTNU requires positive values below the threshold to quantify "compensation," seemingly violating NU’s rejection of positive value’s *independent* moral significance. However, LTNU can retain its "negative" character by treating below-threshold pleasure as *instrumentally* valuable *only* for suffering reduction. Unlike classical NU, it imposes a lexical constraint on maximization, but its primary duty remains minimizing suffering. The floor reading better aligns with this: above-threshold suffering dominates all positive value, while below-threshold trade-offs are merely a concession to feasibility. The cliff’s reliance on a unified scale makes positive values appear intrinsically relevant, straining NU’s core asymmetry.  

  **Verdict**: The floor reading better captures LTNU’s spirit. It embraces incommensurability to protect against catastrophic suffering, whereas the cliff reduces to a technical claim about utility functions, inviting reductios about marginal cases. While both struggle with arbitrariness, the floor’s categorical approach offers a principled basis for prioritizing extreme suffering—even if locating the threshold involves judgment. Crucially, it robustly handles the trade-off case (always prioritizing threshold suffering) and better insulates LTNU’s negative foundations by limiting pleasure’s role to a sub-threshold instrumental tool.  

  ---

  ### Marking Scheme (20 marks)  
  **Must-hit points** (Award 0–4 per point; 4=excellent, 3=good, 2=partial, 1=weak, 0=missed):  

  1. **Accurate floor/cliff distinction**  
     - *Common mistake*: Conflating "infinite exchange rate" with "incommensurability."  
     - **First vs 2:1**: First-class explicitly links floor to *no common measure* and cliff to *MRS→∞*.  

  2. **Arbitrariness analysis for BOTH readings**  
     - *Common mistake*: Only addressing one reading; ignoring cliff’s greater susceptibility.  
     - **First vs 2:1**: First-class contrasts *conceptual* (floor) vs *mathematical* (cliff) arbitrariness.  

  3. **Trade-off case implications clearly differentiated**  
     - *Common mistake*: Claiming cliff *always* permits trading; missing instability at threshold margin.  
     - **First vs 2:1**: First-class notes cliff’s obligation shifts with infinitesimal suffering changes.  

  4. **NU label challenge addressed via instrumental/positive value**  
     - *Common mistake*: Asserting LTNU "isn’t NU" without engaging instrumental justification.  
     - **First vs 2:1**: First-class defends how floor confines positive value to sub-threshold *tool*.  

  5. **Coherent verdict favoring one reading with justification**  
     - *Common mistake*: Merely describing differences; no reasoned preference.  
     - **First vs 2:1**: First-class ties verdict to core NU priorities (e.g., catastrophe avoidance).  

  **Overall Structure (0–4)**: Logical flow, precision, avoidance of tangents.  
  **Common overall error**: Treating floor/cliff as merely "semantic" differences without ethical implications.  

  ---

  **Total**: 950 words.  
  *Key design notes*: Question forces applied analysis (not summary), model answer prioritizes argument over exegesis, marking scheme rewards engagement with thresholds and trade-offs.
