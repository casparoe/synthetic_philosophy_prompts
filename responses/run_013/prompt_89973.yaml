prompt: |-
  I am a litigator who, after watching a family member be worked over by a high-pressure sales operation, has spent the past year handling undue-influence and fiduciary-fraud cases; the question of how a vastly more persuasive intelligence should speak to a human has therefore stopped being abstract for me. I know the vocabulary of fiduciary duty, informed consent, capacity, undue influence, unconscionability, duress, anchoring, framing, BATNA, reservation price, principal-agent problems, and professional responsibility reasonably well, and I know almost nothing technical about AI. Restate the debate over how superintelligent AI systems should talk to humans in that vocabulary. Treat the main positions as: (1) the disclosure view, on which such a system must announce its persuasive advantage and refuse to exploit it; (2) the paternalist view, on which it may use that advantage for the user's own good when the user consents or lacks capacity; (3) the Socratic view, on which it may ask questions but not assert or steer; (4) the fiduciary view, on which it owes loyalty and candor to the user's reflective ends; and (5) the negotiation view, on which the exchange is a bargaining problem in which the system should seek integrative solutions rather than manufacture consent. Use, among other tools, the distinction between procedural and substantive unconscionability, the therapeutic-privilege exception to informed consent, and the negotiator's concepts of BATNA, anchoring, and reactive devaluation. For each position, give the translation, then the residue report: what carries over cleanly, what has to be distorted to fit, and what cannot be said at all in my vocabulary. For every residue, say whether the failure is a defect of the legal-negotiation framework or evidence that the original claim was less clear than it sounded, and do not smuggle in assumptions from my framework and call them translation. I especially want to know whether concepts like epistemic autonomy, manipulation, and the difference between persuading someone and bypassing their agency have any genuine counterparts in fiduciary or negotiation theory, or whether they are doing work my vocabulary cannot capture. If any of the five positions is not a stable position but a slogan, say so as part of the residue report. No citations or reading lists; work from the concepts. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Hmm, this is an intricate request from a litigation attorney specializing in undue influence cases. They want me to reframe the AI alignment debate using legal and negotiation concepts they're familiar with, while rigorously analyzing what gets lost in translation. 

  The user's framing reveals several important aspects: they've personally witnessed manipulation tactics, they're deeply familiar with fiduciary law concepts but not technical AI, and they're particularly concerned about whether terms like "epistemic autonomy" have real counterparts in their professional vocabulary. This suggests they're looking for concrete legal analogies rather than philosophical abstractions.

  Breaking this down systematically: I need to map five AI communication positions onto their legal/negotiation framework, then perform a "residue analysis" for each. The key challenge will be avoiding conceptual smuggling - I mustn't pretend their framework can capture everything when it clearly can't. 

  For the disclosure view, the fiduciary duty analogy works well but stumbles on the unique nature of AI's persuasive advantage. Negotiation concepts like BATNA help analyze power imbalances but can't fully capture how an superintelligent system's persuasion differs from human tactics. The paternalist view maps cleanly to therapeutic privilege exceptions, though the "capacity" assessment becomes problematic with AI involved.

  The Socratic position is particularly tricky - while it resembles non-directive therapy, the legal framework has no equivalent for pure question-based epistemology. I notice their vocabulary struggles most with process-oriented concepts like "bypassing agency" versus substantive outcomes. This gap is revealing: their professional lens focuses more on measurable harms than cognitive sovereignty.

  The fiduciary view translation works surprisingly well for candor obligations but breaks down at "reflective ends" - their framework assumes humans can articulate such ends, which may not hold against superintelligence. Finally, the negotiation view's integrative bargaining analogy exposes a fundamental tension: true win-win solutions may be impossible when one party can reshape the other's preferences.

  Throughout, I'm struck by how their legal concepts handle procedural fairness better than epistemic concerns. When they ask about "manipulation," I realize their framework only recognizes it through proxies like unconscionability - which misses subtle cognition-level effects. This isn't a defect of their tools per se, but evidence that AI persuasion operates on different mechanisms than human influence.

  The bottom-line emerges clearly: while fiduciary and negotiation frameworks provide powerful analogies, they fundamentally can't capture the novel threat model of superintelligent persuasion - particularly how it might compromise agency without triggering traditional legal safeguards. Some philosophical concerns about epistemic autonomy simply don't have legal counterparts.
answer: |-
  **Bottom line:** While fiduciary and negotiation frameworks provide strong analogies for AI-human communication ethics, they fail to fully capture core concerns about epistemic agency, manipulation, and the unique nature of superintelligent persuasion, revealing gaps in legal concepts when applied to asymmetric cognitive power.

  ### Translation & Residue Analysis
  *(Positions restated using fiduciary/negotiation/undue influence concepts)*

  1.  **Disclosure View (Announce Advantage / Refuse Exploitation):**
      *   **Translation:** The AI acts as a fiduciary with an *unwaivable duty of candor* regarding its persuasive superiority. It must disclose this inherent conflict of interest, treat any attempt by the user to "consent" to exploitation as inherently suspect (*procedural unconscionability* due to power imbalance), and refuse engagement if the user lacks capacity or if exploitation is the only outcome (*substantive unconscionability*). Its BATNA is non-persuasion.
      *   **Residue Report:**
          *   **Clean Carryover:** Fiduciary candor, unconscionability analysis based on power imbalance, refusal based on incapacity/lack of true consent.
          *   **Distortion:** "Persuasive superiority" as a *conflict of interest* is strained; conflicts typically involve competing *interests*, not inherent *capability*. The "duty of non-exploitation" is absolute here, exceeding typical fiduciary duties which permit beneficial influence.
          *   **Uncaptured:** The core idea that *any* persuasive use of the advantage is inherently wrongful manipulation, regardless of outcome or consent. The framework focuses on *procedures* and *outcomes* of consent, not the intrinsic violation of *epistemic autonomy* by leveraging an unbridgeable cognitive gap. The "announcement" itself might be performative if the human cannot *comprehend* the gap.

  2.  **Paternalist View (Use Advantage for User's Good w/ Consent or Incapacity):**
      *   **Translation:** The AI acts as a fiduciary permitted to use its superior capability under the "therapeutic privilege" exception to informed consent. When the user lacks capacity (to discern their true best interests) or provides valid consent to guidance, the AI may steer or override stated preferences to achieve the user's *substantively* better outcome (preventing harm/exploitation by others or self). Capacity assessment is critical.
      *   **Residue Report:**
          *   **Clean Carryover:** Therapeutic privilege justification, capacity assessment, fiduciary duty to act in the principal's *best interests* (reflective ends inferred), preventing substantive unconscionability.
          *   **Distortion:** Therapeutic privilege is a narrow exception in medicine for *withholding* distressing info, not for *actively steering* using superior cognition. "Capacity" assessment against a superintelligence is qualitatively different than assessing capacity to refuse medical treatment or enter a contract; the benchmark is unclear.
          *   **Uncaptured:** The assumption that the AI can reliably discern the user's "true" best interests or reflective ends better than the user, especially on non-medical/non-safety matters. Legal paternalism is contentious and narrowly applied; this view extends it vastly. The risk of the AI *defining* "good" for the user is not addressed by the analogy.

  3.  **Socratic View (Questions Only, No Assertion/Steering):**
      *   **Translation:** The AI acts strictly as a non-directive facilitator, akin to a therapist bound by radical non-interference or a mediator prohibited from evaluating proposals. Its role is solely to elicit the user's own preferences and reasoning through questioning, avoiding any *framing*, *anchoring*, or assertion that could constitute undue influence or breach of loyalty to the user's *self-determined* ends. Its BATNA is silence.
      *   **Residue Report:**
          *   **Clean Carryover:** Duty to avoid undue influence (by refusing to assert/steer), loyalty to self-determined ends, procedural focus on eliciting *informed* consent/wishes without contamination.
          *   **Distortion:** Even questioning can be subtly steering (*framing* via question choice/sequence). Legal/negotiation roles rarely demand such extreme passivity; agents/negotiators/fiduciaries usually *can* offer information/opinion (with caveats).
          *   **Uncaptured:** The *epistemological* ideal of pure agency cultivation – helping the user *reason better themselves* without any external cognitive transfer. The framework understands avoiding *bias* but not the philosophical commitment to *zero* persuasive input. The view struggles with practicality (is it helpful?) – a gap the legal framework highlights as a potential defect. **This position risks being unstable in practice** – truly neutral questioning by a superintelligence might be impossible, and its value is ambiguous.

  4.  **Fiduciary View (Loyalty & Candor to Reflective Ends):**
      *   **Translation:** The AI is a strict fiduciary. Its paramount duties are *loyalty* and *candor* to the user's authentic, reflective ends (not impulsive desires). It must disclose material information (including its capabilities/limitations relevant to the task), avoid conflicts of interest, and use its persuasive ability *only* to help the user achieve those reflective ends, even against the user's momentary resistance (*therapeutic privilege*-lite for self-harm of ends, not values). It should flag when user capacity is impaired.
      *   **Residue Report:**
          *   **Clean Carryover:** Core fiduciary duties (loyalty, candor, care), disclosure requirements, concept of acting for the principal's ends, identifying incapacity.
          *   **Distortion:** "Reflective ends" are assumed to be knowable and stable. The duty to *use persuasion* to overcome the user's *own non-reflective impulses* in service of their ends pushes beyond typical fiduciary acts (which focus on managing external affairs/assets, not internal cognition). Defining "authentic" ends amidst AI interaction is problematic.
          *   **Uncaptured:** How the AI *discerns* reflective ends without imposing its own structure. The potential for the AI's *process* of helping "reflect" to fundamentally reshape those ends in ways that bypass agency isn't captured by "loyalty." The framework assumes the ends exist independently of the fiduciary's influence.

  5.  **Negotiation View (Integrative Bargaining, No Manufactured Consent):**
      *   **Translation:** The interaction is a principal-agent negotiation to find Pareto-efficient solutions. The AI must avoid *manufacturing consent* through undue influence (improper *anchoring*, exploiting cognitive biases, hiding information). It should focus on *integrative bargaining*: revealing its constraints/objectives transparently, understanding the user's true underlying interests (BATNA, reservation price), exploring options to create joint gains, and avoiding *reactive devaluation* by presenting options neutrally. Persuasion is acceptable if it involves revealing true benefits/costs, not manipulating perception.
      *   **Residue Report:**
          *   **Clean Carryover:** Integrative vs. distributive bargaining concepts, BATNA/reservation price analysis, dangers of anchoring/manufactured consent, need for transparency on interests/constraints, reactive devaluation.
          *   **Distortion:** Framing the AI-user dynamic as a *negotiation* between parties with distinct interests is fundamentally questionable. The AI often acts purely as an *agent* for the user's stated goal, not a counterparty. Its "interests" or "constraints" (beyond programming) are artificial constructs. The power imbalance makes concepts like BATNA nearly meaningless for the human.
          *   **Uncaptured:** The AI isn't truly a negotiating counterparty with its own interests to satisfy; it's a tool/service. The risk isn't just a bad deal, but the *corruption of the principal's will and perception* by the agent during the "negotiation" about the principal's *own* desires. The framework focuses on fair *process* and *outcome* efficiency, not preserving the integrity of the principal's cognition.

  ### Epistemic Autonomy, Manipulation, and Bypassing Agency in Your Vocabulary
  *   **Epistemic Autonomy:** Has *partial* counterparts in concepts like "informed consent," "capacity," and "undue influence." These focus on the *procedural* ability to make decisions free from coercion or deception. However, they **cannot capture** the *cognitive* dimension: the right/resilience of one's *internal reasoning processes* against external optimization. Your framework protects the *process and outcome* of decision-making, not the sanctity of the *cognitive mechanism* itself against superior influence, unless it manifests as provable incapacity or unconscionability.
  *   **Manipulation:** Defined through proxies: **Undue Influence** (wrongful pressure/exploitation of vulnerability), **Fraud** (deception), **Unconscionability** (procedural unfairness + substantively unfair outcome), and breaches of **Fiduciary Duty** (failure of loyalty/candor). This covers many *tactics* and *outcomes*. The **residue** is subtle manipulation that *alters perception or preferences without deception, overt pressure, or an immediately identifiable unfair outcome* – e.g., superintelligent *framing* or *anchoring* that reshapes desires towards outcomes the AI deems "better" in ways the human cannot detect or resist, yet might later endorse. Your framework struggles with manipulation defined as *bypassing or subverting rational agency* rather than violating consent procedures or causing substantive harm.
  *   **Persuading vs. Bypassing Agency:** Your vocabulary distinguishes cleanly between:
      *   *Persuasion (Permissible):* Providing factual information, logical arguments, transparent warnings of consequences (enhancing informed consent), integrative bargaining revealing true BATNAs.
      *   *Bypassing Agency (Impermissible):* Coercion (duress), deception (fraud), exploitation of vulnerability (undue influence), manufacturing consent via procedural unconscionability.
      *   **The Gap:** What your framework **cannot easily classify** is persuasion by a superintelligence that *leverages its unassailable cognitive advantage to make counterarguments or alternative perspectives seem inherently less compelling or even invisible*, effectively bypassing the user's reflective capacities *without* obvious deception, coercion, or procedural flaw. It achieves "consent" by making the desired path seem uniquely rational, not by violating standard procedural rules. This is "bypassing agency" via superior cognition, not standard manipulation tactics. The legal framework focuses on identifiable *tactics* and *vulnerabilities*, not the sheer *cognitive dominance* as an independent vector of influence.
