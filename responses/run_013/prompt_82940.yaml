  **Liberties taken**:

  1. We use syntactic (string) identity for rule equivalence. In reality, program equivalence is semantic (same behavior) and undecidable. But for the activity, we use string identity to make it executable.

  2. We avoid the proof-theoretic rule entirely in the activity because it is not executable by hand. We only discuss it in the debrief.

  3. The pairing: in the rule submission, each student has one rule used in one pairing? Or multiple pairings? We did multiple pairings in Stage 2? But the one-shot game is per pair. We can do: each student is paired with one other in Stage 2. Then in Stage 3, we pair against a fixed rule.

  4. The scoring: we use the PD payoffs. We assume that the payoffs are symmetric and known.

  **Unreproducible part**:

  The proof-theoretic rule and the fixed-point reasoning cannot be reproduced in the activity. We have to explain it in the debrief.

  **Final Design**:

  **Rules and Materials**:

  - Payoff matrix on board:
  ```
                  Cooperate   Defect
  Cooperate         (3,3)      (0,5)
  Defect            (5,0)      (1,1)
  ```

  - Rule language (allowed rules):
    1. "AlwaysCooperate" -> outputs C
    2. "AlwaysDefect" -> outputs D
    3. "SameAsMe" -> outputs C if the opponent's rule string is exactly "SameAsMe", else D.
    4. "OpponentIs: X" -> outputs C if the opponent's rule string is exactly the string X (where X is written by the student, and it must be one of the allowed rule strings they have seen; note: they can write any string, but we will compare literally).

  - Rule submission form: a piece of paper with:
     - Name: __________
     - Rule: __________ (write one of the above, or for "OpponentIs: X", write the full string including X)

  - Referee sheet: 
     For a pair (Player1: rule R1, Player2: rule R2):
     - To compute Player1's move:
          - If R1 is "AlwaysCooperate" -> C
          - If R1 is "AlwaysDefect" -> D
          - If R1 is "SameAsMe" -> then if R2 == "SameAsMe", then C, else D
          - If R1 starts with "OpponentIs: ", let X = the string after "OpponentIs: ". Then if R2 == X, then C, else D.
     - Similarly for Player2.

     Then use the payoff matrix to assign payoffs.

  **Roles**:
  - Instructor: explains, moderates.
  - Students: submit rules, may act as referees.
  - Referees (volunteer students): compute moves and payoffs for assigned pairs.

  **Minute-by-Minute**:

  - 0-10: Stage 1: One-shot PD.
     - Pair students (randomly, 9 pairs).
     - Each student writes "C" or "D" on a slip, without seeing the other.
     - They exchange and compute payoffs. (They can use the matrix.)
     - Instructor asks: "How many pairs had mutual cooperation? Mutual defection? Mixed?"
     - Emphasize: defection is dominant.

  - 10-15: Explain Stage 2.
     - "Now, we are going to play again, but this time you will submit a rule. The rule will determine your move based on the rule string of your opponent."
     - Show the allowed rule types and how they work.
     - Emphasize: the rule must be one of the allowed forms, and for "OpponentIs: X", X is a string that you write.

  - 15-25: Stage 2: Rule submission and running.
     - Students write their rule on the form and submit.
     - Instructor collects and then randomly pairs students (or uses the same pairs as Stage 1).
     - Assign referees (could be the other students in a triplet? Or have some students as referees for each pair). 
          - If we have 18 students, we can have 9 pairs. We need 9 referees? But then we have no one left. So we have the instructor and a few volunteers run multiple pairs.
          - Alternatively, have each pair exchange rules and compute their own moves under the supervision of a referee (another student) who has the procedure. But that might be chaotic.
     - Better: the instructor and two student volunteers (referees) each take 3 pairs. They compute the moves and announce payoffs.
     - Record the outcomes.

  - 25-40: Running the pairs and discussion (15 min).
     - After all pairs are run, ask:
          - "Who cooperated? What rules did you use?"
          - "Did any pair both cooperate? How?"
          - "Did any pair both defect? How?"
          - "Did any pair have one cooperate and one defect? How?"

  - 40-55: Stage 3: Attack on "SameAsMe".
     - Suppose we want everyone to cooperate. We ask: if we all use "SameAsMe", what happens? Then we pair two students who both wrote "SameAsMe" (if any) and show they cooperate.
     - Then ask: "Can you write a rule that, when playing against a player using 'SameAsMe', gets 5 (i.e., you defect and they cooperate)?"
     - Give students 5 minutes to write a new rule (on a new form).
     - Then, we run each attacker rule against a fixed rule: the instructor's rule "SameAsMe".
          - For each attacker rule R, compute:
              - Attacker's move: by their rule R, given that the opponent (instructor) has rule "SameAsMe".
              - Instructor's move: by "SameAsMe", given R.
          - Record the payoff for the attacker.
     - We do this for each attacker.
     - Expected: no one gets 5. The best is 3 (if they submit "SameAsMe") or 1 (if they submit something else).

  - 55-65: Stage 4: Natural repair.
     - "We saw that 'SameAsMe' is fragile: if there's a typo, it breaks. Can you design a rule that cooperates with any rule that would cooperate with you, even if they write it differently?"
     - Allow 5 minutes for students to write a rule. They might try to write "AlwaysCooperate" or something else.
     - Then try to run one example: 
          - Suppose two students both write: "CooperateIfOtherCooperatesWithMe". But we haven't defined it.
          - We can try to define it: 
              - Rule for A: cooperate if, when I give my rule to B, B would output cooperate.
              - But to compute that, we need to know what B does when given A's rule. But B's rule is defined similarly.
          - We can try with one pair: 
              - Let A's rule: "CooperateIfOtherCooperatesWithMe"
              - B's rule: "CooperateIfOtherCooperatesWithMe"
              - To compute A's move: it needs to know what B would do when given A's rule. But B's rule says: cooperate if A cooperates when given B's rule. This is circular.
          - We then explain that without a fixed point, we cannot resolve this.

  - 65-70: Optional: Unreadable.
     - Allow a new rule: "Unreadable" (which we define as: the rule outputs D always, and its string is "Unreadable").
     - Then run against other rules.

  - 70-80: Debrief.
     - Summarize the stages.
     - Key insights from the activity.
     - Explain the theoretical points: program equilibrium, folk theorem, and the two mechanisms and why they don't work together.

  This design meets the constraints and focuses on the experiential part. The unrepoducible part (the proof-theoretic rule and fixed point) is discussed in the debrief.
answer: |-
  Below is a complete, ready-to-run design for your seminar session. The activity is structured to meet your pedagogical goals while respecting practical constraints (e.g., no live execution of complex self-referential code, minimal materials). I'll outline rules, materials, scoring, roles, timeline, debrief, failure points, liberties taken, and irreproducible elements.

  ---

  ### **Activity Title**: The Rule-Breaker Dilemma  
  **Duration**: 80 minutes  
  **Materials**: 
  1. Projector/whiteboard displaying:  
     - Prisoner's Dilemma payoff matrix:  
       ```
               Cooperate (C)    Defect (D)  
       Cooperate   (3, 3)         (0, 5)  
       Defect      (5, 0)         (1, 1)  
       ```  
     - **Rule language** (simple, non-self-referential):  
       - `"ALWAYS_C"` → Always cooperate.  
       - `"ALWAYS_D"` → Always defect.  
       - `"SAME_AS_ME"` → Cooperate if the opponent's rule is **exactly** `"SAME_AS_ME"`; else defect.  
       - `"OPPONENT_IS: [RULE]"` → Cooperate if the opponent's rule **exactly matches** `[RULE]` (e.g., `"OPPONENT_IS: ALWAYS_C"`); else defect.  
       - `"UNREADABLE"` → Always defect, and hide your true rule (opponent only sees `"UNREADABLE"`).  
     - **Rule submission slips** (paper slips for students to write rules).  
  2. Timer.  
  3. **Referee sheets** (for volunteers; includes rule-execution instructions and scoring).  

  **Pairing Structure**:  
  - Students play in fixed pairs for Stage 1 (one-shot PD) and Stage 2 (rule submission).  
  - In Stage 3 (attacks), students face a "demonstration pair" (pre-selected volunteers) to test attacks.  

  ---

  ### **Timeline & Activity Flow**  

  #### **Stage 1: The Inevitability of Defection** (15 min)  
  - **0:00–0:05**: Introduce the one-shot PD.  
    - *Rules*: Pairs choose `C` or `D` simultaneously without communication. Payoffs based on the matrix.  
    - *Goal*: Make defection feel obvious.  
  - **0:05–0:10**: Students play in pairs. They write `C` or `D` on slips, reveal simultaneously, and record payoffs.  
  - **0:10–0:15**: Quick show of hands: "Who cooperated? Who defected?" Highlight mutual defection as dominant.  
  - *Delivers*: The "floor falls out" – defection is boringly rational.  

  #### **Stage 2: Rules as Tools for Cooperation** (25 min)  
  - **0:15–0:20**: Introduce rule submission.  
    - *Rules*:  
      - Each student submits a rule (e.g., `"SAME_AS_ME"`) on a slip.  
      - Rules are exchanged within pairs.  
      - A referee (student volunteer) executes rules: **Compare rule strings literally** (e.g., `"SAME_AS_ME"` ≠ `"same_as_me"`).  
      - Payoffs calculated based on output.  
    - *Goal*: Cooperation emerges syntactically, not through kindness.  
  - **0:20–0:30**: Students write rules. Encourage experimentation (e.g., `"OPPONENT_IS: SAME_AS_ME"`).  
  - **0:30–0:40**: Referees execute rules in pairs. Project a tally of outcomes:  
    - Mutual cooperation (`C,C`), mutual defection (`D,D`), exploitation (`D,C`/`C,D`).  
  - *Delivers*: Cooperation appears via rule-dependence. Students see `"SAME_AS_ME"` pairs achieve `(3,3)`.  

  #### **Stage 3: Attacking Cooperation** (20 min)  
  - **0:40–0:45**: Frame the challenge.  
    - *Rules*: A demonstration pair (volunteers) uses `"SAME_AS_ME"`. All others design an "attack rule" to exploit them.  
    - *Goal*: Show `"SAME_AS_ME"` is unexploitable but fragile.  
  - **0:45–0:55**: Students write attack rules (e.g., `"OPPONENT_IS: SAME_AS_ME"`). Referees run attacks against the demo pair:  
    - **Attack 1**: `"OPPONENT_IS: SAME_AS_ME"` vs. `"SAME_AS_ME"` → `(D,C)`?  
      - Demo player sees attack rule ≠ `"SAME_AS_ME"`, so defects.  
      - Attacker sees demo rule = `"SAME_AS_ME"`, so cooperates.  
      - **Outcome**: `(5,0)` – attacker is **exploited** (gets 0).  
    - **Attack 2**: `"ALWAYS_D"` vs. `"SAME_AS_ME"` → `(D,D)` → `(1,1)`.  
    - **Attack 3**: `"SAME_AS_ME"` with a typo (e.g., `"SAME_AS_MEE"`) → `(D,D)` → `(1,1)`.  
  - **0:55–1:00**: Discuss: "Did anyone get `(5,0)`? Why not?" Highlight the attacker’s paradox:  
    - To exploit, you must trick the opponent into cooperating while you defect.  
    - But `"SAME_AS_ME"` only cooperates if you *are* it – forcing cooperation.  
  - *Delivers*: Safety comes from syntactic alignment, not goodwill. Fragility appears via typos/divergent rules.  

  #### **Stage 4: The Self-Referential Trap** (15 min)  
  - **1:00–1:10**: Challenge: "Design a rule that cooperates if the opponent cooperates *with you*."  
    - Students sketch rules (e.g., `"COOP_IF_YOU_COOP_WITH_ME"`).  
    - Test with a pair:  
      - Rule A: `"COOP_IF_YOU_COOP_WITH_ME"`  
      - Rule B: `"COOP_IF_YOU_COOP_WITH_ME"`  
    - **Execution failure**: To compute A’s move, we need B’s move, which needs A’s move → **infinite regress**.  
  - **1:10–1:15**: Introduce the fix: `"COOP_IF_PROVEN"` (handwave as unfalsifiable).  
    - *"Imagine a rule that checks if it can *prove* the opponent cooperates against it. If provable, cooperate; else defect."*  
    - Note: This is **not executed** (too complex) but discussed.  
  - *Delivers*: Self-reference feels illegitimate but necessary.  

  #### **Optional: Unreadable Rules** (5 min)  
  - **1:15–1:20**: Test `"UNREADABLE"`:  
    - Pair 1: `"UNREADABLE"` vs. `"SAME_AS_ME"` → `(D,D)` (opponent sees `"UNREADABLE"` ≠ `"SAME_AS_ME"`).  
    - Pair 2: `"UNREADABLE"` vs. `"OPPONENT_IS: UNREADABLE"` → `(D,C)` → `(5,0)` (exploited).  
  - *Delivers*: Hiding is self-defeating; readability enables cooperation.  

  ---

  ### **Debrief** (5 min)  
  - **Key insights**:  
    1. **Program equilibrium** allows cooperation in one-shot games by conditioning on *dispositions* (rules), not moves.  
    2. **Fragility**: `"SAME_AS_ME"` works only under perfect syntactic alignment (students felt this via typos).  
    3. **Self-reference**: The "natural" rule (`COOP_IF_YOU_COOP_WITH_ME`) is circular; the proof-based version fixes it but is epistemically murky.  
    4. **Outcomes**: Like repeated games, this achieves *feasible, individually rational payoffs* (Folk Theorem) – no new outcomes, just a new mechanism.  
    5. **Limits**: `"SAME_AS_ME"` and proof-based rules **do not cooperate** with each other (neither satisfies the other’s condition).  
  - **Closing note**: Cooperation here is **brittle and syntactic**, not moral – a hack, not a solution.  

  ---

  ### **Predictable Failures & Fixes**  
  1. **Rule execution errors**:  
     - *Risk*: Referees misapply string matching.  
     - *Fix*: Use 2–3 referee volunteers with cheat sheets. Have a student "appeals judge" for disputes.  

  2. **Stage 4 confusion**:  
     - *Risk*: Students struggle to grasp self-reference without code.  
     - *Fix*: Use a toy example: *"If I say ‘I cooperate if you cooperate’, and you say the same, what happens?"* Highlight deadlock.  

  3. **Poor attack rules**:  
     - *Risk*: Students submit weak attacks (e.g., `"ALWAYS_D"`).  
     - *Fix*: Seed ideas: *"What if you mimic ‘SAME_AS_ME’ but change one letter?"*  

  4. **Time crunch**:  
     - *Risk*: Stages 3–4 run long.  
     - *Fix*: Trim Stage 2 to 20 min; skip optional stage if needed.  

  ---

  ### **Liberties Taken**  
  1. **Syntactic > semantic equivalence**:  
     - Rules are compared **literally** (e.g., `"SAME_AS_ME"` ≠ `"SAME_AS_MEE"`). In reality, programs care about behavior, not syntax. This exaggerates fragility but makes execution feasible.  

  2. **No self-referential execution**:  
     - The proof-based rule (`COOP_IF_PROVEN`) is only discussed, not run. This avoids live quine-like code but sacrifices experiential depth.  

  3. **Fixed pairing**:  
     - Pairs are static, not randomized. This ensures Stage 3 attacks target a consistent "cooperator," simplifying logistics.  

  ---

  ### **Irreproducible Element**  
  - **The proof-theoretic fixed point**:  
    - Why: The activity cannot replicate the quining/self-referential machinery of rules like `"COOP_IF_PROVEN"`. Students won’t *feel* why it works; they must take it on trust.  
    - How to handle: **Explain via analogy** in debrief:  
      > *"This rule is like a person who says, ‘I’ll cooperate if I can prove you’ll cooperate with me.’ It only works if both rules are so similar that each can ‘prove’ the other’s behavior – a fixed point. But without shared syntax or axioms, they can’t."*  

  ---

  ### **Design Strengths**  
  - **Minimalism**: Uses only paper slips, a projector, and volunteer referees.  
  - **Experiential focus**: Students *feel* defection’s inevitability (Stage 1), cooperation’s emergence (Stage 2), and syntactic fragility (Stage 3).  
  - **Constraint-compliant**: No complex code execution; rule language is trivial to parse.  

  This design mirrors the "program equilibrium" literature while respecting classroom pragmatics. It leaves students with visceral intuition about how cooperation can be engineered – and how easily it shatters.
