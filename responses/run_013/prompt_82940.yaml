  3. They should discover that cooperation can emerge without changing the players' incentives.
  4. They should try to attack the cooperative rule and discover the fragility of the equilibrium.
  5. They should attempt to write a rule that says "cooperate if the other cooperates with me" and see the self-referential difficulty.
  6. Optionally, explore the effect of being unreadable.

  Constraints:
  - Avoid live execution of complex self-referential code. Use a simple rule language.
