prompt: |-
  OK so I'm in this after-school reading thing with our history teacher, Ms. Alder, and last term we did the second of Nietzsche's Untimely Meditations, the one about history being for the sake of life instead of life being for the sake of history. I have a paper due and I'm stuck on a prediction problem: Ms. Alder keeps giving verdicts on random stuff and I've stopped just agreeing with her and started trying to reverse-engineer the actual rule she's running. I think I've found two rules that fit everything she's said so far but that disagree about the case I have to write about, and I want you to help me figure out which one she's really on and what she'd say. Her verdicts so far, as close as I can remember them: (1) a local heritage group that's spent nine years photographing gravestones and transcribing recordings of the dying local dialect, no thesis, no publication plans, members mostly in their seventies doing it because it's theirs — she says that's fine, even good, and it isn't the collector's disease. (2) A teacher she knows who teaches the town's great reformers as heroes specifically to get fifteen-year-olds to actually do something about the river cleanup — she says good, but only because the kids are strong enough not to just sit there admiring; she said if it were forty-year-old burnouts who only watch documentaries about great men it would be poison. (3) A church that dug up its own history of covering something up and basically demanded the congregation condemn the whole institution — she says that was the right move, and also that it nearly killed the congregation, and that whether it was right depended on whether anything new grew afterward; she says you can only cut yourself loose from a past if you have enough in you to grow something in its place, otherwise it's just self-mutilation. (4) A museum that keeps everything and exhibits everything with no point — she calls it greedy, a swamp. (5) A guy she knew who could recite every battle of the Thirty Years War and couldn't hold down a job — she says the knowledge was a drug for him. And (6) one that surprised me: a school did a big pageant celebrating a local inventor, pretty inaccurate, and one kid in the audience went and built a thing because of it, and she said she didn't care about the inaccuracy, the inaccuracy wasn't the point. She also talks a lot about the three ways the essay says history gets used — the one that looks up to great figures, the one that just keeps and preserves what's yours, and the one that puts the past on trial — and about some capacity to grow something new out of yourself by taking the past in and transforming it rather than just carrying it, which I think is the part she actually cares about, but I can't tell if that's the rule or just a vibe.

  So here's the new case. My cousin works at a mid-size software company, and the company tells its employees a founding story — heroic, cleaned up, the early all-nighters and the genius founder, with the failed products and the co-founder who got pushed out just deleted from the telling. It's basically fiction and everyone sort of knows it, but it works: the team is shipping a hard project, people are staying late because of it, my cousin says it's the most motivated she's seen the place in years, and also that the story is not true and that she's pretty sure nobody there could tell you what actually went wrong in the first two years. Would Ms. Alder approve of the company doing this, disapprove, or approve-with-a-condition? And does a company even count as the kind of thing that can have that grow-something-new-out-of-yourself capacity, or is it a bunch of small people who need the story precisely because they couldn't handle the real one? I'm less interested in a yes/no than in which of her rules I should be running, what each of them predicts here, and where they actually come apart.

  Please write it up with these sections and headings, in this order: Summary (3-4 sentences on what I'm asking and what's at stake); The rules that fit her verdicts (the candidate rules, stated precisely, and honestly note where they overlap — a paragraph or two); What each rule predicts for the company (go rule by rule, one short paragraph each); My prediction and why (your best guess at her verdict and the reasons for preferring that rule, about a paragraph); The case that would settle it (the further case that would separate the surviving rules, described concretely, one short paragraph); Settled vs. contested (be explicit about which parts of this are things people who know the essay agree on and which parts are genuinely disputed readings, and don't hand me a contested interpretation as if it were the consensus — I'll get marked down for that). No need to cite anything or give me a reading list, I just want the reasoning.
