prompt: |-
  I'm a statistics PhD student working on model selection and compression, and I've been reading philosophy of science on the side at roughly an undergraduate level. I'd like you to do something specific with a debate I keep circling: the Humean versus anti-Humean disagreement about laws of nature. Restate that debate as faithfully as you can in the vocabulary I actually use — data, model families, priors, likelihoods, minimum description length and compression, regularization, latent variables, generative versus discriminative models, overfitting, identifiability, out-of-sample prediction. Concretely, treat the Humean mosaic as a complete dataset, the best-system account as a compression-based selection criterion, and the anti-Humean's governing laws as whatever you judge to be the closest analogue (a latent generative mechanism? a hard constraint on the hypothesis space?) — and be explicit about which analogy you're choosing and why, since I suspect the choice does a lot of the work.

  Then give me the residue report, which is the part I actually care about. For each central claim on each side, say whether it survives translation cleanly, survives only with distortion, or has no counterpart in my vocabulary at all. I'm especially interested in five things: (1) the anti-Humean claim that laws necessitate or otherwise carry modal force over their instances; (2) the Humean denial of necessary connections between distinct existences; (3) the dispute over whether laws explain their instances or merely systematize them; (4) uninstantiated laws — regularities or law-statements that no actual data ever exercises; and (5) the inference or induction problem. For each, tell me whether the residue is a genuine defect of my framework — something statistics really cannot express — or a sign that the philosophical claim was doing less work than it sounded like.

  One caution, because I'll be reading closely: don't smuggle statistical assumptions in and call the result a translation. If 'prior' or 'latent variable' is quietly doing the job of 'governing law,' say so and flag it rather than letting it pass.

  Format: open with a single paragraph stating your bottom line on whether the debate survives the translation, then give the translation proper, then the residue report as a short table with one row per claim (claim / survives, distorts, or absent / one-line justification), and close with a paragraph on whether the residue points to a defect in my framework or to vagueness in the philosophy. Hard limit: 900 words total, table entries included.
