prompt: |-
  I'm a fourth-year PhD student in philosophy of science, and as part of a departmental arrangement I spend one day a week as the methodology consultant for a lab in the psychology department and, through them, for an editor at a mid-tier journal who forwards me the cases her reviewers cannot agree on. The recurring case is this: a paper reports that a hypothesis is confirmed by data, and a reviewer objects that the data were already in hand before the hypothesis was formulated — that the effect was found first and a story fitted to it afterward — and concludes that the data therefore cannot confirm the hypothesis at all. The authors reply that the data still raise the probability of the hypothesis, and that it is absurd to say a hypothesis can never be supported by evidence that already existed. Both sides are invoking something real, and I keep having to improvise a verdict in under twenty minutes, for an audience with no formal training, with the editor's name on the decision and mine nowhere on it. I have been trying to turn the Bayesian literature on confirmation, and specifically the cluster of puzzles that goes under the heading of old evidence, into something I can actually run. My own working distinction is between temporal novelty — when the data came into existence — and epistemic novelty — whether the data were in the reasoner's evidence set at the moment the hypothesis was fixed — and I suspect the whole dispute lives in the gap between the two; I also want to make room for the counterfactual question of how surprised we would have been by the data had we not already had them. But I do not trust my improvisation, and I would rather have a written procedure than keep reinventing one.

  Please write me that procedure: a checklist or decision tree in prose that a smart non-philosopher can run on a case, stating the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure returns a verdict of "this evidence should not count toward the hypothesis," the point at which it returns "it counts, and roughly this much," and the point at which it must hand the decision to a person because the remaining question is one of norms rather than of probability. It should keep whatever distinctions from the theory genuinely do the work — the difference between evidence that is old to the community and evidence that is old only to the individual, the difference between a hypothesis that was merely formulated late and one that could not have been formulated earlier, the difference between updating on evidence and merely redescribing it — and drop the ones that matter only to specialists. Be honest about which of its steps are judgment calls wearing the costume of a procedure, and about where the procedure will misfire.

  Then run it on three cases and show your work. First, a researcher who collected a large dataset for one purpose, noticed an unanticipated interaction in it, and only then wrote down the hypothesis that the interaction exists. Second, a case in which the relevant result had been published and was common knowledge in the field, but this particular researcher genuinely did not know it when she formed her hypothesis. Third, a case you construct in which the procedure returns an answer I will not like — ideally one where the intuitively right verdict and the procedure's verdict come apart — and tell me what that divergence shows about the limits of the procedure. End by stating plainly what the procedure cannot decide, and what a philosopher, as opposed to a reviewer, would still want to argue about.
reasoning: |-
  We are dealing with a problem in the philosophy of science, specifically the use of "old evidence" for confirming a hypothesis. The core issue is whether data that existed before a hypothesis was formulated can confirm that hypothesis. The Bayesian approach typically requires updating on new evidence, but old evidence poses a challenge because its probability is already 1 (we know it), so it cannot change the probability of the hypothesis.

  The key distinctions we'll use are:
  1. Temporal novelty: When the data were collected relative to when the hypothesis was formulated.
  2. Epistemic novelty: Whether the data were in the reasoner's evidence set at the time the hypothesis was fixed.
  3. The role of counterfactual reasoning: How surprising would the data have been if we didn't already have them?

  We also need to consider:
  - Whether the hypothesis was constructed to fit the data (which might be circular) or whether it has independent merit.
  - The difference between updating on evidence and merely redescribing it.

  We are building a procedure for a non-philosopher to apply. The procedure will be a decision tree with questions. The goal is to decide whether the evidence should count toward the hypothesis and, if so, to what extent.

  The procedure will have three possible outcomes:
  1. "This evidence should not count toward the hypothesis" (or counts very little).
  2. "This evidence counts, and roughly this much" (with a qualitative sense: weak, moderate, strong).
  3. Hand off to a human because the issue is about norms (e.g., ethical or conventional) rather than probability.

  We must be honest about which steps are judgment calls.

  Decision Tree Procedure:

  Step 1: Identify the timeline.
     Question: When was the data collected relative to the formulation of the hypothesis?
     - If the data were collected after the hypothesis was formulated (and the hypothesis was not adjusted to fit the data as it came in), then the evidence is temporally novel and should count. Proceed to Step 2 to assess strength.
     - If the data were collected before the hypothesis was formulated, then we have temporally old evidence. Proceed to Step 3.

  Step 2: For temporally novel evidence (data collected after the hypothesis was formulated), we need to check for "fishing" or data dredging.
     Question: Was the hypothesis one of many that were tested on the same data?
     - If yes, then we must worry about multiple comparisons. The evidence might still count but needs adjustment (e.g., p-value correction). The strength is reduced. This is a judgment call: if the number of tested hypotheses is large, the support is weak. If few, then moderate to strong. But note: this step is about avoiding false positives. Outcome: "It counts, but weakly (due to multiple testing)." If the adjustment is too complex, hand off to a statistician (but for our purpose, we note it as a caution).
     - If no, then the evidence is strong. Outcome: "It counts, and strongly."

  Step 3: For temporally old evidence (data collected before the hypothesis was formulated), we must check epistemic novelty.
     Question: At the time the hypothesis was formulated, was the data already known to the researcher(s) who formulated the hypothesis?
     - If the data was known to the researcher(s) at the time, then we have epistemically old evidence. Proceed to Step 4.
     - If the data was not known to the researcher(s) at the time (even though it existed elsewhere), then we have a case of discovery. This is epistemically novel for the researcher. Proceed to Step 5.

  Step 4: Epistemically old evidence (the researcher knew the data when forming the hypothesis).
     Question: Could the hypothesis have been formulated without knowledge of this data? (That is, is the hypothesis a direct fit to the data, or does it have independent motivation?)
     - If the hypothesis is a direct fit (i.e., it was constructed to match the data) and there is no independent motivation, then the evidence should not count. Outcome: "This evidence should not count toward the hypothesis because the hypothesis was tailored to it."
     - If the hypothesis has independent motivation (e.g., from theory, prior work, or other data), then we must consider the counterfactual: How surprising would the data have been under the hypothesis compared to without it? Proceed to Step 6.

  Step 5: Temporally old but epistemically novel evidence (the data existed but was not known to the researcher when forming the hypothesis).
     This is similar to novel evidence for the researcher. We can treat it as if it were new for them. However, we must check if the data was publicly available (which might lead to concerns about cherry-picking). But note: the researcher did not know it. So we ask:
     Question: Was the data publicly available at the time the hypothesis was formulated?
     - If yes, then we worry about the possibility that the researcher could have known it (or might have been influenced indirectly). This is a judgment call. We might say: the evidence counts, but weakly (because of the potential for subconscious influence or because the community already knew it). Alternatively, if we trust the researcher's report of ignorance, then we proceed to Step 2 (as if it were temporally novel) but note that the data is old to the community. This leads to a split: for the individual researcher, it might be strong, but for the community, it might be weak. Since the journal is for the community, we have to consider the community's state of knowledge. This is complex. We suggest: "It counts, but weakly to moderately, because the community already had the data and might have considered similar hypotheses." (This step is tricky and might require human judgment.)
     - If the data was not publicly available (e.g., private data collected by the researcher for another project but not analyzed until now), then for the researcher it is novel. We can treat it as temporally novel (Step 2) but note that the data was collected for another purpose. However, because the researcher did not know the result when forming the hypothesis, we can run through Step 2. Outcome: as per Step 2.

  Step 6: For the case of independently motivated hypothesis with known (epistemically old) data, we use counterfactual reasoning.
     Question: How surprising would the data have been if we didn't already have it? (That is, what is the likelihood of the data under the hypothesis compared to under the alternative?)
     - We need to assess the prior probability of the data without the hypothesis. This is difficult without numbers, so we use a qualitative judgment:
          * If the data was very likely under the background knowledge (without the hypothesis) and the hypothesis doesn't make it much more likely, then it doesn't provide much support.
          * If the data was very unlikely under the background knowledge and the hypothesis makes it much more likely, then it provides strong support.
     - This step is highly judgmental. We can ask: Was the data considered anomalous or surprising before the hypothesis? If yes, then the hypothesis might explain it well, so the evidence counts. How much? We can say: if the data was very surprising and the hypothesis explains it well, then strong support. If the data was expected anyway, then little support.

     However, note: in the Bayesian framework, if the evidence is already known (probability 1), then the posterior equals the prior. So formally, it doesn't change the probability. But we are trying to capture the intuitive sense of confirmation. One way is to consider what the probability of the hypothesis would have been if we had not had the evidence and then we learned it.

     Given the complexity and the fact that we are in a qualitative procedure, we might say:
          * If the data was highly surprising under the background knowledge and the hypothesis explains it, then the evidence provides strong support.
          * If the data was not surprising, then the evidence provides little to no support.

     But note: this is a judgment call. We might not have the counterfactual probabilities. Outcome: We can assign weak, moderate, or strong support based on this. But we must be cautious.

  Step 7: The step that we haven't covered is when the hypothesis is not just fitted to the data but is a redescription of it. We need to check for triviality.
     Question: Is the hypothesis simply a redescription of the data? (For example, if the data is a set of points and the hypothesis is that they lie on a particular curve that was drawn to connect them.) This can come up in any of the above steps but is especially relevant when the data is old and known.
     - If the hypothesis is a redescription of the data, then it doesn't provide independent support. Outcome: "This evidence should not count because the hypothesis is a redescription of the data."

  We also note that sometimes the issue is about norms: for example, the community standard might be to require pre-registration to avoid HARKing (Hypothesizing After the Results are Known). But our procedure is about the epistemic support.

  Now, we run the procedure on three cases.

  Case 1: A researcher who collected a large dataset for one purpose, noticed an unanticipated interaction in it, and only then wrote down the hypothesis that the interaction exists.

  Step 1: Data collected before the hypothesis was formulated -> temporally old. Go to Step 3.
  Step 3: At the time of formulating the hypothesis, was the data known to the researcher? Yes, because they noticed the interaction. So epistemically old. Go to Step 4.
  Step 4: Could the hypothesis have been formulated without the data? In this case, the hypothesis was directly inspired by the data. It was the observation of the interaction that led to the hypothesis. So it's a direct fit. Therefore, outcome: "This evidence should not count toward the hypothesis because the hypothesis was tailored to it."

  But note: the researcher might argue that the interaction is real and that they are just reporting it. However, the concern is that without an a priori hypothesis, the finding might be a fluke. The procedure flags it as not counting. This is a case of HARKing.

  Case 2: The relevant result had been published and was common knowledge in the field, but this particular researcher genuinely did not know it when she formed her hypothesis.

  Step 1: Data collected before the hypothesis -> temporally old. Go to Step 3.
  Step 3: Was the data known to the researcher? No (she genuinely did not know). So epistemically novel for her. Go to Step 5.
  Step 5: Was the data publicly available? Yes (it was published and common knowledge). Then we say: the evidence counts, but weakly to moderately, because the community already had the data. The researcher's ignorance does not change the fact that the community already knew it. So the evidence is not novel for the community. Therefore, it should not be as strong as a new replication. But note: the hypothesis might be new and the data supports it. However, since the data was already known, it doesn't add new information for the community. The support is weak.

  Alternatively, we might consider that the hypothesis is new and the data (even though known) fits it. Then we would go to Step 6. But Step 5 leads us to a community perspective. We decide: "It counts, but weakly (because the community already knew the data)."

  Case 3: Construct a case where the procedure returns an answer you might not like.

  Case: A physicist formulates a new fundamental theory T. After formulating T, they realize that it predicts a known physical constant (say, the fine structure constant) to a high precision. This constant has been known for decades and is part of the background knowledge. The physicist did not adjust the theory to fit the constant; the theory independently predicts it.

  Step 1: Data (the value of the constant) is old -> temporally old. Go to Step 3.
  Step 3: At the time of formulating T, the physicist knew the constant? Yes. So epistemically old. Go to Step 4.
  Step 4: Could the hypothesis have been formulated without the data? Yes, because the theory was developed from first principles, not by fitting to the constant. So independent motivation. Go to Step 6.
  Step 6: How surprising was the data? The fine structure constant was known and measured precisely. Without the theory, we had no deep explanation for its value. So it was surprising in the sense that we didn't know why it had that value. The theory explains it. Therefore, the evidence provides strong support.

  But note: in the strict Bayesian sense, the probability of the data is 1, so it doesn't change the probability of T. However, intuitively, we feel that the prediction of a known but previously unexplained constant is a success of the theory. The procedure captures that by the counterfactual: if we didn't know the constant, and the theory predicted it, that would be strong evidence. And since the theory was independently motivated, we count it.

  But what if you don't like it? Some philosophers (e.g., Glymour) have argued that old evidence cannot confirm. The procedure in Step 6 allows it to count. So if you are a strict Bayesian who thinks old evidence cannot confirm, then you won't like this. But the procedure is designed to capture the intuition that it does.

  Alternatively, we might have a case where the data is old and known, and the hypothesis is independently motivated, but the data is not surprising at all. For example, suppose a theory predicts that the sky is blue. We already know the sky is blue. And the theory is independently motivated. But the sky being blue is not surprising. Then Step 6 would say: the evidence provides little support. But the theory might be a good theory for other reasons. So we don't count that evidence.

  What the procedure cannot decide:
  - The procedure relies on judgments, especially in Step 6 (how surprising the data would have been) and in Step 4 (what counts as independent motivation). It also relies on trusting the researcher's account (e.g., about not knowing the data).
  - It cannot decide on matters of norms: for example, whether the research community should accept such papers as a matter of policy. That requires a separate discussion.
  - It cannot handle cases where the data is old and known, but the hypothesis was generated by a computer algorithm that searched for patterns in the data. Is that independent? The procedure might break down.

  A philosopher would still want to argue about:
  - Whether the counterfactual approach (Step 6) is valid. How do we set the prior probability of the data without the evidence? This is the problem of "old evidence" in Bayesian confirmation theory.
  - The role of community knowledge versus individual knowledge. The procedure tries to take the community perspective in Step 5, but is that the right perspective for confirmation?
  - Whether the distinction between independent motivation and fitting is clear-cut.

  Finally, we present the procedure in a compact form:

  **Procedure for Evaluating Evidence from Old Data**

  1. **Temporal Order**: When was the data collected relative to the hypothesis?
     - *After*: Temporally novel. Go to 2.
     - *Before*: Temporally old. Go to 3.

  2. **Multiple Testing (for temporally novel)**: Was the hypothesis one of many tested?
     - *Yes*: Evidence counts but weakly (due to multiple testing concerns). [Adjustment for multiple comparisons is needed, but that's statistical.]
     - *No*: Evidence counts strongly.

  3. **Researcher's Knowledge (for temporally old)**: At hypothesis formulation, was the data known to the researcher?
     - *Yes*: Epistemically old. Go to 4.
     - *No*: Epistemically novel for the researcher. Go to 5.

  4. **Independent Motivation (for epistemically old)**: Could the hypothesis have been formulated without this data?
     - *No (tailored)*: Evidence does not count.
     - *Yes (independent)*: Go to 6.

  5. **Public Availability (for epistemically novel)**: Was the data publicly available?
     - *Yes*: Evidence counts weakly (because the community already knows it).
     - *No*: Treat as temporally novel (go to 2).

  6. **Counterfactual Surprise (for independent motivation with known data)**: How surprising would the data have been without the hypothesis?
     - *Very surprising and the hypothesis explains it well*: Strong support.
     - *Not surprising*: Little to no support.
     - *Moderately surprising*: Moderate support.

  Additionally, at any step, if the hypothesis is a mere redescription of the data, then the evidence does not count.

  This procedure is a guide. It requires honest judgments, especially in steps 4 and 6. It may misfire in complex cases or when the independence of the hypothesis is unclear.
answer: |-
  Below is a procedural checklist designed for non-philosophers to evaluate whether "old evidence" (data existing before a hypothesis was formulated) can confirm a hypothesis. It draws on Bayesian confirmation theory, emphasizing **epistemic novelty** (whether the data was in the reasoner's evidence set when the hypothesis was fixed) over **temporal novelty** (when the data was collected). The procedure also incorporates **counterfactual surprise** (how unexpected the data would have been without prior knowledge) and flags cases where norms (e.g., research integrity) must override probabilistic reasoning.

  The procedure has three outcomes:
  - **A: "This evidence should not count toward the hypothesis"** (or counts negligibly).
  - **B: "This evidence counts, and roughly this much"** (qualitative: weak/moderate/strong support).
  - **C: "Hand to human"** (norms, not probability, decide).

  **Key Distinctions That Do the Work:**
  1. **Epistemic novelty vs. temporal novelty**: What matters is whether the *reasoner knew the data* when fixing the hypothesis, not when the data was collected.
  2. **Community vs. individual knowledge**: Evidence already public is "old" for the scientific community, even if unknown to an individual.
  3. **Hypothesis tailoring vs. independent motivation**: Was the hypothesis reverse-engineered from the data, or did it arise from theory/logic?
  4. **Updating vs. redescription**: Does the hypothesis *explain* the data, or just restate it?
  5. **Counterfactual surprise**: How probable was the data under background knowledge alone?

  **Judgment Calls** (not mechanical):
  - Steps 4, 6, and 7 require assessing motives, alternative explanations, or surprise.
  - Step 9 involves qualitative judgment of support strength.
  - The procedure misfires if motives are unclear, data is ambiguous, or "background knowledge" is disputed.

  ---

  ### **The Procedure: Checklist for Old Evidence Confirmation**

  **Step 1: Temporal order**  
  *Question: Was the data collected *before* the hypothesis was fully formulated?*  
  - **Yes** → Proceed to Step 2.  
  - **No** → Evidence is temporally novel. **Outcome B (strong support)**. Skip to Step 9 for strength assessment.  
  *Why*: Temporally novel data is unproblematic, but check for multiple testing (Step 8).  

  **Step 2: Researcher’s epistemic state at hypothesis formulation**  
  *Question: When the hypothesis was fixed (e.g., written pre-registration, timestamped notes), did the researcher *know* the relevant data?*  
  - **Yes** → Data is epistemically old for the researcher. Proceed to Step 3.  
  - **No** → Data is epistemically novel for the researcher. Proceed to Step 5.  
  *Judgment call*: Trust researcher testimony unless contradicted.  

  **Step 3: Hypothesis tailoring check**  
  *Question: Could the hypothesis have been formulated *without* this data? (Was it motivated independently—e.g., theory, prior work—or explicitly fitted to the data?)*  
  - **No (tailored)** → Hypothesis is reverse-engineered. **Outcome A**.  
  - **Yes (independent)** → Proceed to Step 4.  
  *Why*: Tailored hypotheses are circular; independent ones may still gain support.  

  **Step 4: Community knowledge status**  
  *Question: Was the data *public* (published, in shared datasets) when the hypothesis was formulated?*  
  - **Yes** → Data is epistemically old for the community. Proceed to Step 6.  
  - **No** → Data was private. Proceed to Step 7.  
  *Why*: Public data is "old" for science, even if unknown to the researcher.  

  **Step 5: Epistemically novel for researcher, but temporally old**  
  *Question: Was the data *public* when the hypothesis was formulated?*  
  - **Yes** → Proceed to Step 6.  
  - **No** → Data was private. Treat as temporally novel. **Outcome B (moderate/strong support)**. Skip to Step 9.  
  *Why*: Private data unknown to the researcher is "new" for them, but public data risks cherry-picking.  

  **Step 6: Counterfactual surprise assessment (for public/known data)**  
  *Question: If the data *had not been known*, how surprising would it have been under *background knowledge alone* (without the hypothesis)?*  
  - **Very surprising** (low probability) → Proceed to Step 7.  
  - **Not surprising** (high probability) → **Outcome A** or **B (weak support)**.  
  *Judgment call*: Estimate surprise qualitatively (e.g., "Was the data unexpected or anomalous?").  
  *Why*: Data that was likely anyway doesn’t support the hypothesis.  

  **Step 7: Hypothesis vs. redescription**  
  *Question: Does the hypothesis *explain* the data (e.g., mechanistic account), or is it a *redescription* (e.g., renaming a pattern)?*  
  - **Redescription** → **Outcome A**.  
  - **Explanation** → Proceed to Step 8.  
  *Why*: Redescriptions (e.g., "the curve is squiggly") don’t provide new insight.  

  **Step 8: Multiple testing check**  
  *Question: Was this hypothesis one of *many* tested on the same/similar data?*  
  - **Yes** → Support is weaker due to false-positive risk. **Outcome B (weak support)**.  
  - **No** → Proceed to Step 9.  
  *Why*: Fishing expeditions inflate support.  

  **Step 9: Support strength assessment**  
  *Question: How much does the data *differentiate* the hypothesis from alternatives?*  
  - **Strong**: Data is likely under the hypothesis but very unlikely under alternatives.  
  - **Moderate**: Data is more likely under the hypothesis but not improbable under alternatives.  
  - **Weak**: Data is only slightly more likely under the hypothesis.  
  *Outcome B*: Assign strength (weak/moderate/strong).  
  *Judgment call*: Relies on intuitive likelihoods.  

  **Step 10: Norms override**  
  *If any of these apply, **Outcome C**:*  
  - Fraud, selective reporting, or ethics violations.  
  - Field-specific standards (e.g., pre-registration requirements).  
  - Disputes over "background knowledge" in Step 6.  

  ---

  ### **Case Applications**

  **Case 1**: Researcher collects a large dataset for one purpose, notices an unanticipated interaction, then writes a hypothesis that the interaction exists.  
  - **Step 1**: Data collected before hypothesis → **Yes** → Step 2.  
  - **Step 2**: Researcher knew the data when forming hypothesis (they noticed it) → **Yes** → Step 3.  
  - **Step 3**: Hypothesis tailored to data? Could it exist without the data? Unlikely—it was reverse-engineered → **No (tailored)** → **Outcome A**.  
  *Verdict*: Evidence should not count. The hypothesis was fitted to the data, making it circular.  

  **Case 2**: A published result is common knowledge in the field, but the researcher genuinely did not know it when forming her hypothesis.  
  - **Step 1**: Data existed before hypothesis → **Yes** → Step 2.  
  - **Step 2**: Researcher unaware of data → **No** → Step 5.  
  - **Step 5**: Data was public → **Yes** → Step 6.  
  - **Step 6**: Counterfactual surprise: If unknown, would the data be surprising? Assuming it’s established knowledge (e.g., a well-known effect), not surprising → **Outcome B (weak support)**.  
  *Verdict*: Evidence counts weakly. The community already knew the data, so it doesn’t strongly confirm a new hypothesis.  

  **Case 3 (Divergent Case)**: A theorist develops a mathematical model from first principles (independently motivated). Later, they realize it predicts a well-known but unexplained physical constant (e.g., the fine-structure constant). The constant was public and known to them.  
  - **Step 1**: Data (constant) existed before hypothesis → **Yes** → Step 2.  
  - **Step 2**: Researcher knew the data → **Yes** → Step 3.  
  - **Step 3**: Hypothesis independently motivated? Yes (from first principles) → **Yes** → Step 4.  
  - **Step 4**: Data was public → **Yes** → Step 6.  
  - **Step 6**: Counterfactual surprise: Without the data, would it be surprising? Yes—the constant was known but unexplained (low probability under background knowledge) → Step 7.  
  - **Step 7**: Hypothesis explains (model derives the constant) → **Explanation** → Step 8.  
  - **Step 8**: No multiple testing → Step 9.  
  - **Step 9**: Strong differentiation—data is likely under the hypothesis but improbable under alternatives → **Outcome B (strong support)**.  
  *Verdict*: Evidence counts strongly.  
  *Why you might not like this*: Intuitively, old evidence "shouldn’t count," but the procedure rewards the hypothesis for explaining something previously anomalous. This highlights the procedure’s **limit**: It prioritizes explanatory power over temporal sequence, which may feel like cheating if you emphasize novelty. The divergence shows that the procedure is *explanatory*, not *historical*—it cares whether the data *would have been* evidence if new.  

  ---

  ### **What the Procedure Cannot Decide**  
  1. **Norms and ethics**: It can’t resolve disputes about research integrity (e.g., HARKing—Hypothesizing After Results are Known). These require **Outcome C** (human judgment).  
  2. **Ambiguous motives**: If hypothesis tailoring (Step 3) or counterfactual surprise (Step 6) is unclear, the procedure defaults to weak support or human judgment.  
  3. **Background knowledge disputes**: What counts as "surprising" depends on subjective priors (Step 6).  
  4. **Community thresholds**: How much weak/moderate support is "enough" is field-specific.  

  ### **What Philosophers Would Still Argue About**  
  - **The old evidence problem**: Bayesians dispute whether known evidence (P(e)=1) can *ever* confirm, as it doesn’t change probabilities. The procedure sidesteps this via counterfactuals, but purists reject this.  
  - **Individual vs. community justification**: Should confirmation be relative to the researcher or the field? The procedure hybridizes both, inviting debate.  
  - **Realism about hypotheses**: Does independent motivation (Step 3) imply the hypothesis "existed" before formulation? The procedure treats this pragmatically.  
  - **Demarcation of "explanation"**: Step 7’s explanation/redescription distinction is thorny (e.g., is curve-fitting ever explanatory?).  

  The procedure is a practical heuristic—it won’t resolve philosophical debates but translates them into actionable questions. Use it to structure reviews, but flag steps needing deeper discussion. For your role, it should reduce improvisation while leaving room for norms.
