  Okay, the user is a professor designing a final exam essay question for a graduate seminar on distributive justice. They want to move beyond rote memorization of theories (utilitarianism, prioritarianism etc.) and force students to engage deeply with structural tensions, particularly around the leveling-down objection and loss-proofness. 

  Hmm, their frustration is palpable - they note students mechanically deploy Parfit's leveling-down objection as a "knockdown" argument without understanding its implications for value theory construction. Smart pedagogical move: by providing strict definitions (loss-proof, gap-sensitive) and a concrete three-outcome case, they're forcing the analysis to happen in situ.

  The core challenge they're designing is brilliant: make students confront that caring intrinsically about inequality might require sacrificing monotonicity (loss-proofness), while avoiding it reduces egalitarianism to prioritarianism. That's doctoral-level insight packaged into an exam question. 

  Noticing four precise technical requirements:
  First, students must formally link loss-proofness to monotonicity - showing leveling-down isn't debatable but mathematically constrains gap-sensitive views. 
  Second, they need to taxonomize theories by this criterion and expose prioritarianism's trade-off (can't explain relational disadvantage). 
  Third, they must calculate how much weight equality can have before violating loss-proofness in the given cases. 
  Fourth - and this is the kicker - they must take a stand on whether conditional egalitarianism collapses into prioritarianism.

  Ah, and the professor is ruthlessly pragmatic about grading: requiring explicit arithmetic with a weighted value function so answers are mechanically verifiable. No "hand-wavy" philosophical escapes. 

  For the model answer, I'll need to:
  - Build the monotonicity proof carefully but accessibly 
  - Show utilitarian/prioritarian satisfy loss-proofness while telic egalitarian doesn't 
  - Crunch the numbers for V = total - λ*gap with the (100,50)/(50,50)/(80,60) cases 
  - Demonstrate the λ threshold where leveling-down becomes attractive 
  - Force the dilemma: either accept non-monotonicity (thus vulnerability to leveling-down) or make equality conditional to the point of indistinguishability from prioritarianism

  The marking scheme must reward structural insights over labeling. Top marks (A range) should require: 
  1) Correct monotonicity proof (many will state but not derive)  
  2) Numerical demonstration of λ threshold (often skipped)  
  3) Clear stance on the dilemma with defense (most will equivocate)  
  Crucially, B answers might get taxonomy right but miss the mathematical constraint or hedge on the dilemma.

  ...time to architect an exam question that's a locked room where the only escape is through rigorous value theory.
answer: |-
  ### Final Examination: Contemporary Distributive Justice  
  **Time Allowed:** 75 minutes  
  **Total Marks:** 25  

  ---

  #### Exam Question  
  **Stipulations:**  
  1. A distributive view is **loss-proof** if and only if it never ranks outcome \(A\) above outcome \(B\) when \(B\) is at least as good as \(A\) for every individual and strictly better for at least one individual.  
  2. A view is **gap-sensitive** if and only if it treats the size of the gap between better-off and worse-off individuals as having intrinsic (non-instrumental) value.  

  **Case:**  
  Consider three outcomes with well-being levels for two persons, \((Person\ 1, Person\ 2)\):  
  - Outcome \(X\): \((100, 50)\)  
  - Outcome \(Y\): \((50, 50)\)  
  - Outcome \(Z\): \((80, 60)\)  

  **Question:**  
  Using the stipulations and case above:  
  1. **(a)** Demonstrate that a view is loss-proof if and only if its ranking of outcomes is strictly monotonic in individual well-being (i.e., improving one person’s well-being never makes the outcome worse, all else equal). Explain why this implies that the leveling-down objection is not merely a rhetorical point but a structural constraint on gap-sensitive views.  
  2. **(b)** Classify the following views as loss-proof or not loss-proof: utilitarianism, telic egalitarianism, prioritarianism (the priority view). For prioritarianism, state what its loss-proofness requires it to deny about the moral significance of gaps between individuals.  
  3. **(c)** Suppose a gap-sensitive view uses a value function of the form \(V = \text{Total Well-Being} - \lambda \times \text{Gap}\), where \(\lambda \geq 0\) is a weight. Using the three outcomes, calculate:  
     - The gap (defined as the absolute difference between persons) in each outcome.  
     - The value of \(V\) for \(\lambda = 0\), \(\lambda = 0.5\), and \(\lambda = 1.5\).  
     State whether \(V\) is loss-proof for each \(\lambda\). Then, explain what a gap-sensitive view must concede about \(\lambda\) to ensure loss-proofness, and whether this concession makes gap-sensitivity irrelevant in cases like \(X\) vs. \(Y\).  
  4. **(d)** Defend one side of the following dilemma:  
     *If egalitarians make the value of equality conditional on its benefiting someone, they either (i) retain intrinsic gap-sensitivity and violate loss-proofness, or (ii) preserve loss-proofness but collapse into a view indistinguishable from prioritarianism (which cares only about absolute well-being levels).*  
     Your defense must commit to either (i) or (ii) and justify why it is the less problematic choice.  

  **Instructions:**  
  - Show all calculations for part (c).  
  - Answers exceeding 800 words will be penalized.  

  ---

  ### Model Answer (780 words)  

  #### (a) Loss-Proofness as Monotonicity (5 marks)  
  A ranking is **monotonic in individual well-being** if, whenever one outcome \(B\) is at least as good as \(A\) for all individuals and strictly better for at least one, \(B\) is ranked at least as good as \(A\). Loss-proofness directly encodes this: it forbids ranking \(A\) above \(B\) precisely when monotonicity requires \(B \succeq A\). Thus, loss-proofness is equivalent to monotonicity.  

  The leveling-down objection (e.g., preferring \(Y=(50,50)\) over \(X=(100,50)\) despite no one gaining and someone losing) exploits *non*-monotonicity. For gap-sensitive views, rejecting leveling-down *requires* monotonicity. This transforms the objection from a "debating point" into a **constraint**: any view assigning intrinsic value to gaps must ensure this value does not override monotonicity. If it does, the view violates loss-proofness by ranking a leveled-down outcome as better.  

  #### (b) Classifying Views (5 marks)  
  - **Utilitarianism** (sum-total): Loss-proof. Monotonicity holds (e.g., \(Z=(80,60)\) beats \(X=(100,50)\) since \(140 > 150\)? No: \(100+50=150\), \(80+60=140\); so \(X \succ Z\). But \(Y=(50,50)\) sums to 100, ranked below \(X\) and \(Z\)).  
  - **Telic egalitarianism** (intrinsic gap-sensitivity): *Not* loss-proof. May rank \(Y\) above \(X\) if equality’s intrinsic value outweighs the loss to Person 1.  
  - **Prioritarianism** (weighted sum of concave transformations, e.g., \(\sqrt{w}\)): Loss-proof. Concavity ensures monotonicity.  

  **Priority view’s cost**: By demanding loss-proofness, prioritarianism must deny that *being worse off than others* has intrinsic moral weight. It cares only that individuals are at low *absolute* levels (mitigated via concavity), not that they are *relatively* deprived. Thus, it cannot explain why a person at 50 amidst others at 100 suffers an extra injustice beyond their low absolute level.  

  #### (c) Gap-Sensitivity and Loss-Proofness (8 marks)  
  **Gap calculation**:  
  - \(X\): \(|100 - 50| = 50\)  
  - \(Y\): \(|50 - 50| = 0\)  
  - \(Z\): \(|80 - 60| = 20\)  

  **Value function**: \(V = (w_1 + w_2) - \lambda \times \text{Gap}\)  
  - \(\lambda = 0\) (utilitarianism):  
    - \(V(X) = 150 - 0 = 150\)  
    - \(V(Y) = 100 - 0 = 100\)  
    - \(V(Z) = 140 - 0 = 140\)  
    Ranking: \(X \succ Z \succ Y\). Loss-proof (monotonic).  
  - \(\lambda = 0.5\):  
    - \(V(X) = 150 - (0.5 \times 50) = 125\)  
    - \(V(Y) = 100 - (0.5 \times 0) = 100\)  
    - \(V(Z) = 140 - (0.5 \times 20) = 130\)  
    Ranking: \(X \succ Z \succ Y\). Still loss-proof.  
  - \(\lambda = 1.5\):  
    - \(V(X) = 150 - (1.5 \times 50) = 75\)  
    - \(V(Y) = 100 - (1.5 \times 0) = 100\)  
    - \(V(Z) = 140 - (1.5 \times 20) = 110\)  
    Ranking: \(Y \succ Z \succ X\). **Not loss-proof**: \(Y\) is ranked above \(X\) despite both persons being worse off or equal (Person 1: 100→50; Person 2: 50→50).  

  **Concession for loss-proofness**: \(\lambda\) must be small enough that no leveling-down is preferred. Here, \(\lambda \leq 1.0\) (since at \(\lambda=1\), \(V(X)=100\), equal to \(V(Y)\), but \(\lambda>1\) reverses ranking). This forces egalitarians to concede that **gap-sensitivity must be lexically subordinate to total well-being**. In the leveling-down case (\(X\) vs. \(Y\)), the gap-sensitive component does *no work*: when \(\lambda\) is small enough to preserve loss-proofness, \(X\) always beats \(Y\) because the gain in equality cannot outweigh the total loss. Thus, gap-sensitivity only affects rankings when gaps change without total-well-being losses (e.g., \(X\) vs. \(Z\)).  

  #### (d) Resolving the Dilemma: Defense of (i) (7 marks)  
  I argue that egalitarians should choose **(i)**: retain intrinsic gap-sensitivity and accept *some* non-loss-proofness. This avoids collapsing into prioritarianism (ii) and preserves the core egalitarian insight.  

  **Why (ii) fails**: If egalitarians make equality’s value strictly conditional on benefiting someone (to ensure loss-proofness), they reduce gap-sensitivity to an instrumental role. But prioritarianism *also* prefers equality instrumentally (e.g., diminishing returns). The distinction vanishes: both would rank \(Z\) above \(X\) if the gap-reduction benefits the worse-off (here, Person 2: 50→60), but neither intrinsically cares about the 50-unit gap in \(X\). True egalitarianism holds that the *unfairness* of the gap in \(X\) is bad even if eliminating it via leveling-down (to \(Y\)) doesn’t benefit anyone. Sacrificing this denies the essence of egalitarianism.  

  **Why (i) is tolerable**: Non-loss-proofness is counterintuitive but coherent. We accept that values like fairness or rights sometimes override individual gains (e.g., deontological constraints). If equality is intrinsically valuable, ranking \(Y\) above \(X\) reflects that the gain in fairness outweighs the Pareto loss, much like punishing an innocent might maximize utility but violate justice. The leveling-down objection highlights a cost, but not an inconsistency.  

  **Trade-off**: This view must bite the bullet on cases like \(X\) vs. \(Y\), but it can still reject *wasteful* leveling-down (e.g., destroying goods to achieve equality) by weighting equality moderately. In \(Z\), it can prioritize both fairness and well-being (\(V(Z)=110\) vs. \(V(X)=75\) at \(\lambda=1.5\)). Prioritarians cannot explain why, absent well-being gains, moving from \(X\) to \(Y\) might be progress. Egalitarians can.  

  Thus, embracing non-loss-proofness preserves gap-sensitivity as a distinct value, avoiding assimilation into prioritarianism.  

  ---

  ### Marking Scheme (25 marks total)  
  **A (21–25)**: Identifies monotonicity as the core constraint; commits decisively to (i) or (ii) in (d); calculates all \(V\) values correctly; explains prioritarianism’s inability to address relational disadvantage.  
  **B (16–20)**: Correct taxonomy and calculations but vague on monotonicity or equivocal in (d).  

  | **Component**                                                                 | **Marks** | **Common Errors**                                                                 |  
  |-------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------|  
  | **(a)** Correct proof of loss-proofness ⇔ monotonicity; links to structural constraint. | 5 | Assumes loss-proofness = Pareto; misses equivalence to monotonicity.              |  
  | **(b)** Correct classification (U: LP, TE: not LP, P: LP); prioritarianism’s gap-insensitivity explained. | 5 | Misses prioritarianism’s loss-proofness; misstates cost (e.g., "can’t value equality"). |  
  | **(c)** Correct gaps (50, 0, 20); \(V\) for λ=0,0.5,1.5; loss-proofness for each; concedes λ must be low. | 8 | Arithmetic errors; misses loss-proofness flip at λ>1; claims gap-sensitivity always inactive. |  
  | **(d)** Commits to (i) *or* (ii); defends choice; contrasts prioritarianism vs. egalitarianism. | 7 | Undecided; misrepresents dilemma; conflates prioritarianism and utilitarianism. |  

  **Key A/B Differentiator**:  
  - **A**: Explicitly derives loss-proofness from monotonicity (2a) and takes a clear, defended stance on the dilemma (2d).  
  - **B**: Describes but does not prove monotonicity link; lists options in (d) without commitment.  

  ---  
  **Note to Grader**: Verify calculations for (c):  
  - \(V_{\lambda=0}(X,Y,Z) = 150, 100, 140\)  
  - \(V_{\lambda=0.5}(X,Y,Z) = 125, 100, 130\)  
  - \(V_{\lambda=1.5}(X,Y,Z) = 75, 100, 110\) → \(Y \succ Z \succ X\) (non-loss-proof).
