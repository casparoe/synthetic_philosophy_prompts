prompt: |-
  I'm a second-year sociology PhD and I've been roped into running one of the theory seminars next term — ninety minutes, eight first-year PhD students, and about half of them are from econ or quant backgrounds and have already privately decided that the whole Weber thing is either trivially true or unfalsifiable. The seminar is on "can culture be a cause?", i.e. the Protestant ethic thesis plus the general problem of explaining action by the values people hold. I dont want you to explain the thesis to me — I want you to plan how I should teach it, so that by the end they can see what kind of claim it actually is. The first thing I need is the order. My instinct is to start with the problem of explaining-with-values in the abstract and only then bring in the historical case, because if I open on Calvin and predestination they'll file the whole thing under history of ideas and never feel the methodological knife. Tell me whether that's right, and what has to come before what for it to land — in particular where the reasons-versus-causes question has to sit relative to the switchmen point (you know, Weber's image of world-images as railway points that set the track along which interests push conduct) and relative to the elective-affinity idea. And I want a fork in there that I always fumble: whether the ethic is meant to do its work by motivating individuals or by selecting the groups and firms that behave that way — the selection reading keeps tempting me because it makes the thesis cleaner, but I suspect it quietly guts the causal claim. Decide which reading I should teach them and why.

  Second, the carrying case. Please don't use the Franklin time-is-money example — every one of them has seen it and it smuggles in the very economic motive we're supposed to be explaining. Pick one case to run the whole seminar on, and tell me what it has to have and what it mustnt have: it needs a value that plausibly bites on behaviour (ledgers, saving, deferral of consumption, whatever) without already being a profit motive, and it mustn't be so exotic that they can't judge it for themselves. I've been toying with a small dissenting congregation whose members kept unusually scrupulous accounts — is that the right shape, or is there something better? Build in the objection I can never answer well, namely the one where they say: fine, so thrift and deferral helped, but then the religious content is doing no work at all and you could tell the same story about any belief system that produced the same habits. I want that objection to land as a genuine threat, not to be waved away.

  Then the misconceptions, which is really why I'm asking. They'll arrive with some and the sequence will breed others. Off the top of my head: "Weber says Protestantism caused capitalism" (rather than a much thinner claim about the spirit); "if values explain anything then interests explain nothing"; "explaining by reasons isn't real explaining because reasons aren't causes"; and the econ crowd's own "so it's unfalsifiable, therefore worthless". Map the rest, put each one at the exact point in the sequence where it should be headed off, and tell me which of them I should let them hold for twenty minutes and then dismantle rather than pre-empt. I also want the one closing question I can ask to check they've got the shape of the claim rather than just the story, and what I should openly refuse to cover at this level and say so (I'm assuming the predestination-theology apparatus and the later secularisation argument, but you tell me). Be committed — give me one plan with real choices and your reasons for them, not three options and a shrug; where you're genuinely torn, say so, but still decide. British English, and give it to me as: "Opening move" (~100 words), "The order of ideas" (~400), "The carrying case" (~250), "Misconception map" (~400), "Check for understanding" (~100), "What I'm leaving out" (~100).
reasoning: |-
  Hmm, this is a sophisticated teaching challenge from a sociology PhD student. They're grappling with how to teach Weber's Protestant Ethic thesis to skeptical quant-oriented students, and they want a very structured lesson plan. Let me unpack their needs carefully.

  First, the core pedagogical problem: students with econ backgrounds tend to dismiss cultural explanations as either trivial ("of course values matter") or unscientific ("can't falsify it"). The user wants to bypass these reactions by structuring the seminar to reveal Weber's actual methodological contribution.

  Key requests:
  1. Sequence - whether to start abstract (values-as-explanation) before historical case
  2. Carrying case - avoid Franklin, find fresh example that shows values-biting-behavior without smuggling economics
  3. Misconceptions - map when to pre-empt vs. let simmer
  4. Reading - individual motivation vs. group selection
  5. What to omit

  For the sequence dilemma: Starting abstract makes sense. If we jump into Calvinism first, quant students will file it under "history" rather than "methodology." Need to first establish:
  - The puzzle of non-instrumental action (why do people do things against material interest?)
  - Values as switchmen (Weber's railway metaphor)
  - THEN introduce Protestant Ethic as test case

  The values-as-causes vs reasons debate must come AFTER establishing values as switchmen but BEFORE elective affinity. Otherwise they'll reduce it to "interests plus decoration."

  On the reading question: Must emphasize individual motivation. The selectionist reading (where Protestantism selects for certain traits) guts the causal claim because it makes values epiphenomenal. Weber's point is that the religious meaning transformed how people experienced mundane economic acts.

  For the carrying case: Their dissenting congregation idea works if we have concrete archival evidence of:
  - Explicit theological statements linking faith to accounting
  - Behavioral traces (ledgers) showing unusual rigor
  - Absence of obvious economic incentives

  But need to pre-empt the "any belief system" objection by showing how specific doctrines (like calling) made mundane work sacred. Contrast with, say, Buddhist non-attachment - which might produce thrift but not reinvestment.

  Misconceptions to map:
  - "Weber said Protestantism caused capitalism" → correct immediately with Weber's actual "spirit of capitalism" framing
  - "Values vs interests" zero-sum → save for elective affinity reveal
  - "Reasons aren't causes" → pre-empt with Davidson later
  - "Unfalsifiable" → let this simmer until case study, then show how counterfactuals work

  Must omit:
  - Secularization (distraction)
  - Full predestination theology (tangential)
  - Later critiques (save for advanced seminar)

  Closing question should force them to articulate how a specific value (e.g. systematic accounting as divine service) redirects interest-driven action differently than pure profit motive would.

  This needs to be delivered as a tight, decisive plan - no academic hedging. British English throughout, with the exact structure requested.
answer: |-
  ### Teaching Plan: Weber's "Culture as Cause" Seminar  
  **British English throughout, as requested**

  ---

  **Opening Move** (~100 words)  
  Start *not* with Calvin or capitalism, but with a puzzle: **"Why do people with identical material interests act differently?"** Pose a stark contemporary example—e.g., two equally skilled London entrepreneurs, one working 80-hour weeks reinvesting profits, the other prioritising leisure despite identical market incentives. Force them to articulate what’s "missing" in pure interest-based explanations. Emphasise: **"Today isn’t about history—it’s about whether ‘values’ can be causal machinery, not just décor."** This frames the seminar as a methodological challenge, not ideological debate. Hook the econ students by making *their* models feel incomplete.

  ---

  **The Order of Ideas** (~400 words)  
  1. **The Explanatory Gap**: Begin with the abstract problem: interests alone can’t explain divergent actions under identical constraints (e.g., your entrepreneur case). Ask: *"What bridges the gap between stimulus and action?"*  
  2. **Values as "Switchmen"**: Introduce Weber’s metaphor *here*. Stress: values don’t *replace* interests; they **redirect** them onto specific tracks. Like railway points, they’re inert until interests (the train) arrive. Pre-empts "values vs. interests" false dichotomy early.  
  3. **Reasons ≠ Causes?**: *Now* address the philosophy. Concede: reasons feel "non-causal" if seen as free-floating ideas. Reframe: **Values are causes when they systematically reshape material practices.** Use Davidson’s "reasons are causes" briefly—it’s the *empirical pattern* (e.g., thrift + reinvestment) that matters.  
  4. **Elective Affinity**: *Only then* introduce this. Values and interests aren’t "chicken or egg"—they fuse when material conditions resonate with values (e.g., asceticism + early capitalist accumulation). Saves it from sounding mystical.  
  5. **The Protestant Case**: **Teach the individual-motivation reading.** Why? Selectionism (e.g., "firms with thrifty Protestants survived") guts causality—it reduces culture to Darwinian noise. Weber’s point is that the *meaning* of labour (as divine duty) transformed behaviour *from within*. Let them wrestle with this.  

  **Why this sequence?** Abstract gap → switchmen mechanism → causality defence → affinity framework *before* history. Delaying Weber’s case until Step 5 ensures they see it as an *instance* of the general model, not a dusty parable.

  ---

  **The Carrying Case** (~250 words)  
  **Use your dissenting congregation—but refine it.** Pick 18th-century English Baptists (well-documented, relatable to Brits). Highlight:  
  - **What it must have**: Church records showing sermons equating "idle time" with sin *and* members’ ledgers itemising every half-penny, even when poor. Crucially, show accounts maintained *after* migration to commercial cities—proving it wasn’t just rural habit.  
  - **What it must avoid**: Any hint of "profit motive." Use a diary excerpt: *"Spent 3hrs mending stockings; saved 2d. Resolved: Time is a loan from God."*  
  - **The objection to engineer**: Let a sharp student argue: *"But couldn’t any belief demanding discipline—say, stoicism—produce this?"* **Don’t answer yet.** Note it publicly. Later, contrast with a counter-case: Medieval monastic orders had asceticism but banned profit-seeking. Key difference: **Protestantism sanctified *worldly* productivity as worship.** Ask: *"Would a stoic feel guilty for resting? Would a monk reinvest profits in cloth markets?"* The theology’s *specific framing of mundane acts* is what bites.  

  ---

  **Misconception Map** (~400 words)  
  Pre-empt or exploit each at these points:  
  - **"Weber says Protestantism caused capitalism"**: **Pre-empt at Step 5.** Stress: Weber called it *one* factor shaping the "spirit" (work as end-in-itself), not factories/stock markets.  
  - **"Values vs. interests is zero-sum"**: **Pre-empt at Switchmen (Step 2).** Interests provide force; values steer it.  
  - **"Reasons aren’t causes"**: **Address head-on at Step 3.** Use Davidson: If values *reliably* alter actions (e.g., Baptists saving pennies), they’re causes.  
  - **"It’s unfalsifiable"**: **Let this simmer until the counter-case.** After contrasting monks/Baptists, ask: *"What evidence would falsify the thesis? (e.g., finding identical ledgers in atheist guilds)"*. Show how archival traces *can* test it.  
  - **"The religious content is superfluous"**: **Engineer via objection above.** Dismantle by stressing *meaning*: Franklin’s "time is money" is instrumental; Baptists saw saving as *duty to God*. Same behaviour, different causal engine.  
  - **"Selectionism is cleaner"**: **Save for late debate.** After establishing motivation, concede its appeal—then gut it: *"Does selection explain why a *specific* apprentice felt damned for buying a ribbon?"*  

  ---

  **Check for Understanding** (~100 words)  
  **Closing question:** *"Imagine two 18th-century artisans—one Lutheran, one Catholic—both inheriting £100. How might Weber explain if the Lutheran reinvests it in tools, while the Catholic buys a feast? Where do the ‘switchmen’ and ‘affinity’ fit?"*  
  Listen for:  
  - Interests (both want security) + values (Lutheran sees tools as calling) → divergent tracks  
  - Affinity: Reinvestment "fits" Lutheran doctrine but clashes with Catholic alms/feasting norms.  

  ---

  **What I’m Leaving Out** (~100 words)  
  Openly state: **"We’re skipping predestination’s mechanics and secularisation (how the ethic outlived faith). Why? Today’s goal is the *causal structure* of cultural claims—not theology or historical aftermath. Nor are we debating if Weber was ‘right’—only what his argument *is*."** This forces focus on methodology. The selectionist reading is excluded (as argued) because it dodges the core mechanism. If pressed, say: **"Weber’s genius was taking motives seriously—don’t reduce him to Darwin."**  

  ---  
  **Your Plan in a Phrase:** Abstract gap → switchmen → causality defence → affinity → case study. **Why?** It makes Weber’s machinery visible to sceptics by building from *their* discomfort with incomplete explanations. The Baptist case, with its ledgers and guilt, makes values visceral. Let them flounder on "any belief would do"—then show why *this* belief bit deeper.
