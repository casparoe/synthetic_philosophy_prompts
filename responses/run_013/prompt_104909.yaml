prompt: |-
  I'm running a two-hour workshop on information cascades for a room of working journalists — smart, but no econ or stats beyond what they read in the paper. Don't explain cascades to me, plan how I should teach it. I want the arc: what has to be in place before the word "cascade" means anything to them (my guess is Bayesian updating on a private signal, but tell me what actually has to come first and what can wait), then the one example that carries the whole thing — and I want it to be one they haven't already seen, so not the urns and not the two-restaurant story. I'm thinking of a newsroom where each reporter independently gets a tip about a story and then watches what their colleagues decide to publish; tell me whether that works as the carrier, what it needs and what it has to lack, or give me a better one. Then the missconceptions I should expect and exactly where in the sequence to head each off — I'm guessing they'll hear "cascade" as irrational herd behaviour, they'll think it's the first mover who tips it, and they'll assume cascades usually turn out wrong. I'd also like the example built so the crowd ends up being *right*, since that seems to throw people. Finish with one question I can ask at the end that would tell me they've got the mechanism rather than just the vibe, and tell me what I should openly say I'm leaving out at this level.
reasoning: |-
  We are designing a two-hour workshop on information cascades for journalists. The goal is to build an intuitive understanding without relying on technical jargon or complex math. We'll use a narrative example that is novel (not the urns or restaurant) and relevant to journalism.

  ### Workshop Arc

  1. **Setting the Stage: Key Concepts Before Introducing "Cascade"**
     - **Private Information**: Start by explaining that individuals often have their own private information (like a tip or a source) that they use to make decisions. Emphasize that this information is imperfect (could be right or wrong).
     - **Public Actions**: People also observe the actions of others (e.g., what stories colleagues are publishing) and may use that to inform their own decisions.
     - **Sequential Decision-Making**: Decisions are made in sequence. Each person sees what the previous people did but not their private information.

     We do NOT start with Bayesian updating. Instead, we use a simple rule: each person has a private signal (like "this story is important" or "this story is not important") and they also see the choices of those before them. They then make a choice based on both.

     We can introduce the idea of a threshold: if the evidence (from private signal and public actions) is strong enough in one direction, they go with that. Otherwise, they might follow the crowd.

  2. **The Central Example: A Newsroom Scenario**

     **Scenario Setup**:
     - Imagine a newsroom with 10 reporters. Each reporter gets a tip (private signal) about a potential scandal involving a public figure. The tip can be either "reliable" (indicating the scandal is true) or "unreliable" (indicating it's false). However, the tips are not perfect: 
       - If the scandal is true, the tip is "reliable" with 70% probability and "unreliable" with 30%.
       - If the scandal is false, the tip is "unreliable" with 70% probability and "reliable" with 30%.

     - The reporters decide sequentially (in a random order) whether to publish a story on the scandal. Each reporter can see the decisions of the reporters who came before them (but not their private tips).

     - Each reporter uses a simple rule:
       - They start with a prior belief that the scandal is true with 50% probability.
       - When it's their turn, they combine the public actions (the published/not published decisions of previous reporters) and their own private tip to make a decision.

     However, we must avoid complex math. Instead, we can use a counting heuristic:

       - Assign a weight to each piece of information:
          - A private "reliable" tip counts as +1 evidence for true.
          - A private "unreliable" tip counts as -1 evidence for false.
          - Each previous publication (by a colleague) counts as +1 for true.
          - Each previous decision to not publish counts as -1 for false.

       - Set a threshold: If the total evidence is positive (>=1), publish; if negative (<=-1), don't publish; if zero, they follow their own signal (if they have a reliable tip, publish; if unreliable, don't).

     **Why this example?**
     - It's directly relevant to journalists.
     - It allows for cascades to start and also to be correct or incorrect.

     **What it must lack?**
     - We must not let the reporters see the private signals of others (only the actions).
     - The private signals must be independent.

     **The Cascade Unfolding**:

     Let's run through a scenario:

     - Reporter 1: Gets a "reliable" tip. Total evidence = +1 (from own tip). Publishes.
     - Reporter 2: Gets an "unreliable" tip. Now, evidence: 
          - Previous publication: +1
          - Own tip: -1
          - Total = 0. Since total is zero, they follow their own signal (unreliable) and decide not to publish.
     - Reporter 3: Gets an "unreliable" tip. Evidence:
          - Reporter 1: published (+1)
          - Reporter 2: didn't publish (-1)
          - Own tip: -1
          - Total = +1 -1 -1 = -1 -> decides not to publish.
     - Reporter 4: Gets a "reliable" tip. Evidence:
          - Previous: +1 (pub), -1 (no pub), -1 (no pub) -> total = -1
          - Own tip: +1
          - Total = 0 -> follows own signal (reliable) -> publishes.

     This already shows that even with conflicting signals, the public actions can sometimes dominate (but not always). Now let's induce a cascade:

     - Suppose the first two reporters both get reliable tips and publish (so each adds +1, total evidence for reporter 3 is +2 even before their own signal).
     - Reporter 3: Gets an unreliable tip. Evidence: 
          - Previous: +1 (from rep1) +1 (from rep2) = +2
          - Own tip: -1
          - Total = +1 -> publishes (ignoring own signal).

     This is the start of an information cascade: Reporter 3 is ignoring their own private signal and following the crowd. Subsequent reporters will also publish (even if they get an unreliable tip) because the total evidence will be even more positive.

     **Crucial Twist: Make the Cascade Correct**

     We want to show that a cascade can be correct. So let's assume the scandal is actually true. The first two reporters got reliable tips (which is likely because the scandal is true). The cascade that forms (everyone publishing) is correct. However, note that even if the scandal were false, a cascade might form (if the first two by chance got reliable tips) and then it would be incorrect.

  3. **Addressing Misconceptions**

     - **Misconception 1: "Cascades are irrational herd behavior"**
       - **When to address**: After explaining the example.
       - **Clarification**: In our model, each reporter is being rational. They are using all available information (public actions and private signal) to make the best decision. The cascade occurs because the public information (from previous actions) becomes so strong that it overrides the private signal. It's rational to ignore your own signal when the public evidence is overwhelming.

     - **Misconception 2: "The first mover tips the cascade"**
       - **When to address**: When setting up the sequential decision-making.
       - **Clarification**: The first mover only has their private signal. The second mover has more information (first mover's action and their own signal). The cascade might start at any point when the public information becomes strong enough. It's not always the first mover that tips it. In fact, in our example, the cascade started at the third reporter.

     - **Misconception 3: "Cascades usually turn out wrong"**
       - **When to address**: After running the example where the cascade was correct.
       - **Clarification**: Cascades can be correct or incorrect. They are more likely to be correct if the private signals are informative (like 70% in our example) and the first few signals happen to be correct. But sometimes (if the first few are wrong) they can be incorrect. The problem is that once a cascade starts, it becomes hard to stop even if new evidence contradicts it.

  4. **The Final Question to Check Understanding**

     Ask: 
     > "In our newsroom example, suppose the first two reporters both decide to publish (so we have two publications). The third reporter gets a private tip that the story is unreliable. Without doing any math, why might the third reporter decide to publish anyway? And what would that mean for the next reporter?"

     **Expected Answer**: 
     - The third reporter sees two publications (which is strong evidence in favor) and their own unreliable tip (which is only one piece of evidence). The two publications might outweigh their own tip, so they publish. This would then make the evidence for the next reporter even stronger (three publications) so the next reporter would also publish even with an unreliable tip.

  5. **What We're Leaving Out**

     - **Openly state**: 
       - We are simplifying the decision rule (using a counting heuristic instead of Bayesian updating) to avoid math.
       - We are assuming that all reporters use the same rule and have the same prior.
       - We are not covering more complex variations (like cascades in networks, or how cascades break).
       - We are not discussing the role of media ownership, advertising pressures, or other real-world complexities that might influence decisions beyond information.

  ### Workshop Structure (2 Hours)

  - **Introduction (10 mins)**: 
    - Hook: A real-world example of a media cascade (like a story that spread quickly and then turned out to be false, or one that was true and everyone picked it up). 
    - Outline the goals of the workshop.

  - **Building Blocks (20 mins)**:
    - Private information (tips) and how they are imperfect.
    - Public actions (what we see others do).
    - Sequential decisions (each person sees the previous actions).

  - **The Newsroom Example (40 mins)**:
    - Set up the scenario and the rule.
    - Run through a few reporters step-by-step (interactive: ask the journalists what they think the next reporter should do).
    - Show a cascade forming (both correct and incorrect if time allows, but at least one correct cascade).
    - Highlight the moment the cascade starts.

  - **Discussion of Misconceptions (20 mins)**:
    - Address the three misconceptions.

  - **Group Activity (20 mins)**:
    - Split into small groups. Give each group a scenario (e.g., the first two reporters: one publishes, one doesn't; then the next two get specific tips). Ask them to work out what happens and if a cascade forms.

  - **Wrap-up and Final Question (10 mins)**:
    - Pose the final question and discuss.
    - Mention what we left out.

  This structure should fit in two hours and provide a solid intuitive understanding.
answer: |-
  ### Workshop Plan: Information Cascades for Journalists  
  **Duration:** 2 hours  
  **Goal:** Build intuitive understanding of cascades using relatable examples, minimal math, and interactive discussion. Avoid jargon; emphasize decision-making mechanics.

  ---

  ### **Step 1: Foundations (30 mins)**  
  *(Prerequisites before "cascade" makes sense)*  
  Start with concepts journalists encounter daily. **Do NOT begin with Bayesian updating**—it’s too abstract. Instead:  

  1. **Imperfect Information & Uncertainty (10 mins)**  
     - **Hook:** "You get a tip about a scandal. How sure are you? What if your colleague publishes it—does that change your confidence?"  
     - **Key Idea:** We make decisions based on **partial, noisy information** (e.g., sources, leaks). Not all tips are equally reliable.  
     - **Activity:** Poll the room—"Would you run a story based solely on a single anonymous tip? Why/why not?"  

  2. **Learning from Others (15 mins)**  
     - **Key Idea:** Humans observe **public actions** (e.g., colleagues publishing stories) to fill gaps in their own knowledge.  
     - **Crucial Nuance:** We see *what* people do, but not *why* (their private info).  
     - **Example:** "If three rival outlets run a story, do you feel pressure to follow? Why?"  

  3. **Sequential Decisions (5 mins)**  
     - **Key Idea:** Choices are made in **sequence** (Person 1 acts, then Person 2 sees Person 1’s choice, then Person 3 sees both, etc.).  
     - **Bridge to Cascades:** "What if early decisions sway later ones—even if later reporters have better info?"  

  ---

  ### **Step 2: The Core Example—Newsroom Cascade (45 mins)**  
  **Your Proposed Scenario Works Perfectly—With Tweaks**  
  *Why it fits:*  
  - Relatable (reporters weighing tips + colleagues’ actions).  
  - Shows cascades aren’t just "irrational herds"—they emerge from rational choices.  
  - Can be designed so the crowd ends up *right* (countering "cascades always fail" bias).  

  #### **Scenario: "The Mayoral Scandal"**  
  *(Adjust for your region; e.g., "Senator" or "CEO")*  

  **Setup (10 mins):**  
  - **Premise:** Reporters at different outlets get tips about a mayor stealing funds. Each tip is **private** and **independent**.  
  - **Signal Reliability:**  
    - If the mayor is guilty, tips are 70% likely to say "GUILTY," 30% "INNOCENT."  
    - If innocent, 70% "INNOCENT," 30% "GUILTY."  
  - **Rules:**  
    - Reporters decide sequentially whether to publish.  
    - They see **all prior publishing decisions** (but not the tips behind them).  
    - Their choice: Publish (accuse) or Stay Silent (no story).  

  **Walkthrough (20 mins):**  
  *(Use a whiteboard; track decisions visually)*  
  - **Reporter 1:** Gets a "GUILTY" tip → Publishes.  
  - **Reporter 2:** Gets an "INNOCENT" tip.  
    - Sees Reporter 1 published.  
    - Thinks: "Two signals point to guilt (Rep 1’s action + my tip? Wait—I don’t know Rep 1’s tip!)."  
    - **Key Insight:** They weigh the **public information** (Rep 1 published) against **private info** (their own tip).  
    - *Decision:* If public + private conflict, they might follow the crowd. Assume they publish (tipped by the prior action).  
  - **Reporter 3:** Gets an "INNOCENT" tip.  
    - Sees **two publications**. Ignores own tip → publishes. **CASCADE STARTS.**  
  - **Reporters 4–6:** All get "INNOCENT" tips but publish anyway.  

  **Twist: The Crowd is RIGHT (10 mins):**  
  - Reveal: The mayor **is guilty**.  
    - Even though Reporters 2–6 had "wrong" private tips, the cascade converged on truth.  
    - Why? Early signals (Rep 1’s "GUILTY" tip) were correct and outweighed later noise.  
  - **Lesson:** Cascades amplify early signals—**right or wrong**. They’re not *inherently* mistaken.  

  **What the Example Must Lack/Have:**  
  - ✅ **Must lack:** Knowledge of others’ private signals (only actions are visible).  
  - ✅ **Must have:** Sequential decisions, imperfect but informative signals.  
  - ❌ Avoid: Complex probabilities (use 70/30 as "usually reliable").  

  ---

  ### **Step 3: Debunking Misconceptions (30 mins)**  
  Address these **as they naturally arise** in the example:  

  1. **"Cascades = irrational herd behavior"**  
     - **When to tackle:** After Reporter 3 ignores their tip.  
     - **Response:** "Is Reporter 3 being dumb? No! They’re rationally trusting the *weight* of public info. But this can lock in early accidents."  

  2. **"The first mover controls everything"**  
     - **When to tackle:** When Reporter 2 decides.  
     - **Response:** "Did Reporter 1 ‘cause’ the cascade? Not alone—Reporter 2’s choice to follow was critical. Cascades need early conformity."  

  3. **"Cascades usually fail"**  
     - **When to tackle:** After revealing the cascade was *right*.  
     - **Response:** "Cascades fixate on early info—if it’s good, they succeed. If bad, they fail. The problem? They’re **fragile** to initial errors."  

  ---

  ### **Step 4: The Test Question (10 mins)**  
  **Ask at the end:**  
  > *"In our newsroom, suppose the first reporter gets an ‘INNOCENT’ tip and stays silent. The second gets a ‘GUILTY’ tip but sees the silence. What might they do? What happens next?"*  

  **Why it works:**  
  - Tests understanding of **threshold behavior** (Rep 2 might stay silent if public + private conflict).  
  - Reveals if they grasp **cascade triggers** (two silent reporters could start an "innocent" cascade).  

  **Expected Answer:**  
  - "Reporter 2 might ignore their ‘GUILTY’ tip and stay silent, fearing an ‘INNOCENT’ consensus. Then Rep 3, seeing two silences, would likely stay silent too—even with a ‘GUILTY’ tip."  

  ---

  ### **Step 5: What You’re Leaving Out (5 mins)**  
  **State explicitly:**  
  1. "We simplified probabilities—real cascades use Bayesian math, but intuition matters more here."  
  2. "We ignored **external incentives** (e.g., clicks, bias) that distort signals. Real cascades mix info + pressure."  
  3. "We didn’t cover how to **break** cascades (e.g., diversifying sources, rewarding skepticism). That’s a follow-up!"  

  ---

  ### **Why This Works**  
  - **Narrative-first:** Uses journalism tropes (tips, scoops, pack journalism).  
  - **Cognitive hooks:** Builds on innate instincts (trusting peers, doubting lone tips).  
  - **Counterintuitive punch:** Shows cascades can be rational *and* right.  
  - **No urn/restaurant tropes:** Fresh example avoids overfamiliarity.  

  **Timing Buffer:** Cut group activities if short; extend Q&A if engaged. Journalists love arguing—lean into it!
