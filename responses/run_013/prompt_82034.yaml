  Next, the epistemic side: common knowledge. How did soldiers establish mutual understanding without communication? Signaling through non-lethal actions, like firing at set times or avoiding certain targets, serves as costly signals. These actions build common knowledge by being observable and intentional. The repeated interactions help, but the user is interested in how initial signals transition into shared expectations. Schelling focal points might explain how certain norms (e.g., not attacking during meals) emerge naturally.

  The user's deeper concern is why the truce collapsed. Commands used rotation and raids to disrupt common knowledge. Rotations shortened the shadow of the future, reducing the incentive for long-term cooperation. Raids introduced unpredictability, breaking the mutual predictability needed for cooperation. Here, the theory shows its limits: while repeated games explain cooperation's sustainability, they don't fully address how external forces (like command interference) dismantle common knowledge by altering information and payoffs.

