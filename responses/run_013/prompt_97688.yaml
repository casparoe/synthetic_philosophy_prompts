  Below is a decision tree built from the logical space of commitments, starting from the given epistemic right to believe each individual ticket will lose in a large fair lottery. The tree branches through key questions that separate live positions, with each node phrased as a question answerable without prior knowledge of the positions. Leaf positions are named (or marked "unnamed") and include their most awkward commitment. The sequential lottery/preface and self-undermining preface are integrated, with each position's stance on these cases summarized.

  ### **Decision Tree**

  **Start:** An agent is within her epistemic rights to believe, of each individual ticket in a large fair lottery, that it will not win.

  1. **Is the attitude toward each ticket-proposition one of *belief*?**  
     - **No →** Go to 2.  
     - **Yes →** Go to 3.  

  2. **Does the agent *accept* each ticket-proposition without believing it?**  
     - **Yes →**  
       - **Leaf: Acceptance View** (e.g., L. Jonathan Cohen)  
         - *Sequential Lottery/Preface*: Always accepts "this ticket will lose" or "this claim is true," even when one ticket/claim remains unexamined; stops only if evidence directly refutes it.  
         - *Self-Undermining Preface*: Accepts all body claims and the preface claim (that the book contains a falsehood), despite their joint inconsistency.  
         - **Most awkward commitment:** Rational agents systematically accept known-inconsistent propositions for practical purposes, blurring the line between belief and pragmatic assent.  

  ---

  3. **Is rational belief fundamentally all-or-nothing?**  
     - **No (belief comes in degrees) →** Go to 4.  
     - **Yes →** Go to 5.  

  4. **Is there a concept of *full (binary) belief* reducible to degrees of belief above a threshold?**  
     - **No →**  
       - **Leaf: Radical Probabilism** (e.g., Richard Jeffrey)  
         - *Sequential Lottery*: Only has high credence (never belief) for "this ticket will lose"; credence drops to 0 when one ticket remains.  
         - *Sequential Preface*: Only has high credence for "this claim is true"; credence in the book's overall accuracy falls as claims are verified.  
         - *Self-Undermining Preface*: Maintains high credence in each body claim and the preface claim without binary belief, avoiding inconsistency.  
         - **Most awkward commitment:** Denies that binary belief exists, making it difficult to explain categorical assertions (e.g., "This ticket will lose") or actions premised on certainty.  
     - **Yes (Lockean thesis) →** Go to 6.  

  6. **Is the threshold for full belief fixed or context-sensitive?**  
     - **Fixed →**  
       - **Leaf: Lockean with Fixed Threshold** (e.g., Richard Foley)  
         - *Sequential Lottery*: Believes "this ticket will lose" until its probability of losing drops below threshold (e.g., when 10 tickets remain); suspends belief before one remains.  
         - *Sequential Preface*: Believes each claim upon verification; never believes the entire book is error-free.  
         - *Self-Undermining Preface*: Believes all body claims and the preface claim, holding inconsistent beliefs.  
         - **Most awkward commitment:** Permits knowingly inconsistent beliefs (e.g., in the self-undermining preface), violating rational integrity.  
     - **Context-sensitive →**  
       - **Leaf: Lockean with Contextual Threshold** (e.g., contextualist variants)  
         - *Sequential Lottery*: Threshold rises as stakes increase (e.g., fewer tickets left); suspends belief earlier than fixed threshold (e.g., at 50 tickets), but *converges with fixed threshold* at one ticket (neither believes).  
         - *Sequential Preface*: Similar to fixed threshold; contextual factors (e.g., importance of book) adjust when belief is held.  
         - *Self-Undermining Preface*: Same inconsistency as fixed threshold.  
         - **Most awkward commitment:** Thresholds shift arbitrarily with context (e.g., stakes), making belief "volatile" in ways agents cannot reliably track.  

  ---

  5. **Must beliefs be mutually consistent and closed under conjunction?**  
     - **Yes →** Go to 7.  
     - **No →** Go to 8.  

  7. **Does belief require the kind of warrant that would make it knowledge?**  
     - **Yes →**  
       - **Leaf: Knowledge Norm View** (e.g., Timothy Williamson)  
         - *Sequential Lottery*: Never believes "this ticket will lose" (lacks knowledge due to risk of error), even with one ticket left.  
         - *Sequential Preface*: Believes a claim only after verification yields knowledge (e.g., via proof).  
         - *Self-Undermining Preface*: Withholds belief in the preface claim (it cannot be known if the body is true) or body claims (if unverified).  
         - **Most awkward commitment:** Denies the starting commitment—agents lack epistemic rights to highly probable beliefs (e.g., lottery tickets), leading to counterintuitive skepticism.  
     - **No →**  
       - **Leaf: Unnamed (Inconsistent Classical)**  
         - *Sequential Lottery*: Believes "this ticket will lose" for all tickets at all times, including when one remains (and it wins).  
         - *Sequential Preface*: Believes each claim upon writing; believes the entire book is true via closure.  
         - *Self-Undermining Preface*: Cannot believe the preface claim without contradicting belief in the body (via closure).  
         - **Most awkward commitment:** Forfeiture of accuracy—agents must believe a known falsehood (e.g., "all tickets lose") due to closure.  
         - **Diagnosis:** Empty because incoherent; violates truth-aim of belief.  

  8. **Is the threshold for belief fixed or context-sensitive?**  
     - **Fixed →**  
       - **Leaf: Non-Closure with Fixed Threshold** (e.g., Henry Kyburg)  
         - *Sequential Lottery*: Believes "this ticket will lose" based on fixed probability threshold; suspends belief only when probability drops too low (e.g., at 2 tickets). *Converges with Lockean fixed* at one ticket (neither believes).  
         - *Sequential Preface*: Believes claims meeting threshold; conjunction not required.  
         - *Self-Undermining Preface*: Believes all body claims and the preface claim, tolerating inconsistency.  
         - **Most awkward commitment:** Allows belief in low-probability falsehoods (e.g., "ticket X will lose" when only one remains and it wins).  
     - **Context-sensitive →**  
       - **Leaf: Non-Closure with Contextual Threshold** (e.g., interest-relative invariantism)  
         - *Sequential Lottery*: Threshold rises with stakes; suspends belief earlier (e.g., at 20 tickets) but *converges with fixed threshold* at one ticket.  
         - *Sequential Preface*: Context (e.g., academic stakes) adjusts belief threshold for claims.  
         - *Self-Undermining Preface*: Same inconsistency as fixed non-closure.  
         - **Most awkward commitment:** Context-sensitivity appears ad hoc—e.g., why stakes affect belief in lottery but not preface?  

  ---

  ### **Tree Summary & Notes**
  - **Number of leaves:** 7 (excluding the unnamed position).  
  - **Convergence:** In the sequential lottery, fixed-threshold (Lockean and non-closure) and context-sensitive views *converge* when one ticket remains—no position permits belief at that stage due to probability=0. Differences arise in interim stages (e.g., Lockean contextual suspends belief earlier).  
  - **Empty positions:**  
    - *Inconsistent Classical*: Unoccupied due to incoherence (forces belief in known falsehoods).  
    - *Non-closure with fixed threshold*: Technically occupied but rare; diagnosis is unattractive due to counterintuitive beliefs in near-certain falsehoods.  
  - **Sequential preface:** All non-skeptical views (e.g., Lockean, non-closure) allow belief in claims as verified, but only radical probabilism and knowledge norm avoid inconsistency in the self-undermining case.  
  - **Self-undermining preface:** Highlights awkwardness for views tolerating inconsistency (Lockean, non-closure, acceptance). Knowledge norm and radical probabilism avoid this.  

