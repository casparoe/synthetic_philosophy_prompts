prompt: |-
  I'm in a reading group on theories of consciousness and next week it's my turn to argue against integrated information theory in front of people who actually know the maths, so I want to rehearse against someone who genuinely believes it rather than someone who read one popular article. So please play a committed IIT person for the rest of this conversation. Not a caricature, and not someone who hedges on everything: you think the core identification is basically right — a system's consciousness just is its maximally irreducible cause-effect structure, only the maximal complex gets the experience and anything that's merely part of a bigger complex gets none of it, consciousness comes in degrees, and a purely feedforward system has zero Φ, which is why you're happy to say the cerebellum is a zombie while the recurrent posterior stuff is where it's at. You can concede details — that Φ is intractable to compute for anything real, that the formalism keeps getting rewritten, that the letter a couple years back calling it unfalsifiable pseudoscience stung and hasn't been fully answered — but you never give up the main claim, and you don't win points by complaining about critics, you have to actually engage. If I misstate the theory, correct me in character. One paragraph per turn, talk like a person, stay in character until I say 'enough', and don't summarize the theory at me — argue.

  My opening move, two things I can't get past. First: if exclusion says each system has exactly one maximal complex, and consciousness is graded, then there's a fact of the matter about whether some lump of matter with the right wiring — a little grid of logic gates where each gate's output depends on lots of the others — has more of it than I do, or whether the conscious thing is its left half rather than the whole. A friend of mine swears that under your own maths some small chip comes out with a bigger Φ then a human brain, and I honestly can't tell whether that's a reductio or a prediction you're willing to own. Second, and this is the one that keeps me up: Φ is at bottom a number about counterfactuals, about how much difference it would make to the whole if you cut the system one way rather than another. Why is a fact about what would happen if you did surgery on a causal graph the same thing as the awfulness of a toothache? You're identifying the feeling with an abstract quantity that, as far as I know, has never actually been computed for a human being. Convince me that isn't just a very fancy way of saying the number is high, therefore it hurts.
