prompt: |-
  I am circulating a short statement of my position ahead of a workshop on illusionism about phenomenal consciousness, and I would like a coherence audit of the position as a package before I commit to it on the record. I hold the following six claims, all of which I take to be constitutive of the view rather than optional trimmings:

  1. There are no phenomenal properties. Nothing in the world answers to the description "an intrinsic, subjectively felt quality that outruns any functional or representational characterization"; talk of qualia, of phenomenal character, and of the felt quality of experience picks out no features of reality.
  2. This is not eliminativism about experience. Pains, after-images, and the taste of coffee are real, and nothing in my view denies that we have them. What I reject is a theoretical gloss on them, not the phenomena.
  3. The illusion is introspective and metarepresentational. We are not deceived by our senses, as in a hallucination; we are deceived by our own self-representation, which presents our mental states as having phenomenal properties that they do not have. The right analogy is a user interface: a simplified, action-guiding display that nothing in its design invites us to read as an inventory of the machinery beneath it.
  4. Introspective representations have accuracy conditions like any others, and those conditions are fixed by the mechanisms that produce them, not by anything the subject imports from outside. So the illusion can be diagnosed from the inside, by asking what the introspective system is in the business of representing and whether anything answers to that.
  5. The explanatory target is therefore why we think, and say, that we have phenomenal properties. A successful theory accounts for the reports without positing the properties reported: the reports are data, the properties are not.
  6. The illusion is contingent on our representational architecture. Creatures differently built might represent their own states with no phenomenal gloss at all, and nothing in principle prevents our descendants from occupying that position.

  I have been told that this package is unstable, but I cannot see where the joints are. Please audit it. Say which of the six stand in genuine tension with which others, and which pairs are only apparently in tension, and be explicit about why the apparent ones dissolve. Rank the genuine tensions by severity rather than treating them as equally bad. For each genuine tension, identify the cheapest repair and say what it costs — what I would have to give up, weaken, or restate. Then tell me which single revision would clean up the most at the least cost, and whether the resulting position is still recognizably illusionism or has quietly become a different view wearing the same name.
reasoning: |-
  Okay, the user is preparing for a workshop on illusionism about phenomenal consciousness and wants a coherence audit of their six core claims. They've been told their position is unstable but can't see why, so they need me to identify tensions between their points. 

  First, I should map how all six claims relate. The user insists all are constitutive, so I can't suggest dropping any lightly. The core tension seems to be between denying phenomenal properties (claim 1) while affirming the reality of experiences like pain (claim 2). How can pains be real if their defining quality—how they feel—isn't? The user says they reject the "theoretical gloss," but the tension remains because the gloss is precisely what people mean by pain's reality. 

  Then there's claim 3 calling the illusion "metarepresentational," but claim 4 says accuracy conditions are fixed internally. If introspection misrepresents by adding non-existent phenomenal properties, how can its accuracy conditions—set by its own mechanisms—be satisfied? The user might say the system only tracks functional states, but then why call it an illusion? That feels like changing definitions midstream. 

  Claim 5 shifts focus to explaining reports, which dodges ontological questions but clashes with claim 2's insistence that experiences are real. If we only explain why people *say* they have phenomenal properties, not why experiences seem that way, then claim 2's "phenomena" become thin indeed. 

  Finally, claim 6's contingency is coherent alone but heightens other tensions. If future humans could lack the illusion, does that mean experiences today *are* different? The user would say no—but that makes the contingency claim oddly disconnected. 

  Ranking tensions: The claim 1 vs. claim 2 conflict is most severe because it undermines the view's core promise: preserving experience while denying phenomenality. Cheapest fix? Weaken claim 2 to say only that experiences exist functionally, dropping "pains are real" as folk understand it. But that risks collapsing into full eliminativism. 

  The introspection accuracy issue (claim 3 vs. 4) is next worst. Fix: Clarify that introspection accurately represents functional states but we misinterpret it as phenomenal. But then the illusion isn't in the representation but our reading of it—contra claim 3. 

  Best single revision? Tweak claim 2 to explicitly reduce experiences to functional roles. This partially resolves the first tension and indirectly eases others. The view remains illusionist but leans closer to analytic functionalism. 

  User's tone suggests they're intellectually invested and want rigor, not hand-waving. They'll likely push back, so my audit must anticipate counterarguments. Also, their workshop context means they need defensible soundbites—thus I should flag which tensions might draw live criticism.
answer: |-
  Here's a coherence audit of your six claims, ranking tensions by severity and identifying repairs:

  ### Core Tension (Severity: High)
  **Claim 1 vs. Claim 2:**  
  - **Conflict:** Claim 1 denies *any* intrinsic, subjectively felt qualities ("nothing answers to the description"). Claim 2 asserts the reality of pains/tastes *as we experience them*. If "the taste of coffee" is real but lacks *any* intrinsic qualitative character, what distinguishes it from a purely functional/representational state? Claim 2’s "phenomena" implicitly rely on the very notion Claim 1 rejects.  
  - **Cheapest Repair:** Reinterpret Claim 2’s phenomena as *functional roles* (e.g., "pain" as a detection-and-avoidance mechanism). **Cost:** Weakens the intuitive force of Claim 2; "pains are real" becomes "pain *behaviors* are real," risking eliminativism accusations.  

  ### Major Tension (Severity: Medium-High)
  **Claim 3 vs. Claim 4:**  
  - **Conflict:** Claim 3 calls introspection an *illusion* (misrepresenting mental states as having phenomenal properties). Claim 4 says introspective representations have accuracy conditions fixed by their mechanisms. If the mechanism *produces* representations of "phenomenal properties," and these are accurate *by its own standards*, how is it an illusion? Illusions require a mismatch, but Claim 4 implies the representation is accurate to what the mechanism *aims* to represent.  
  - **Cheapest Repair:** Specify that the mechanism *aims* to track functional/representational states but *outputs* a non-veridical "phenomenal gloss" due to architectural constraints. **Cost:** Requires clarifying that "accuracy conditions" are satisfied *functionally* (e.g., reporting attentional focus) while the phenomenal *content* is an artifact.  

  ### Minor Tension (Severity: Low)
  **Claim 1 vs. Claim 5:**  
  - **Conflict:** Claim 5 treats "reports of phenomenal properties" as the explanatory target, but Claim 1 denies there’s *anything* to misreport. If "phenomenal properties" are wholly non-referential, why do reports feel compelling?  
  - **Resolution:** This dissolves if reports are *not* attempts to reference real properties but are outputs of a heuristic system (Claim 3). The "illusion" is in taking the report’s *content* literally.  

  ### Apparent Tensions (Dissolved):
  - **Claim 4 vs. Claim 5:** Claim 4’s "diagnosis from the inside" seems at odds with Claim 5’s focus on reports. *Resolution:* Claim 4 explains *how* introspection generates the reports in Claim 5.  
  - **Claim 6 vs. Others:** Claim 6’s contingency is coherent if the illusion stems from species-specific architecture (Claim 3).  

  ---

  ### Recommended Single Revision & Cost
  - **Revise Claim 2** to explicitly functionalize the "phenomena":  
    *"Pains, after-images, and the taste of coffee are real* ***as representational states with specific functional roles***, *but they lack intrinsic phenomenal properties."*  
  - **Why this helps most?**  
    1. Resolves the Core Tension (Claim 1 vs. 2) by clarifying that "real" means functionally real.  
    2. Indirectly eases Claim 3 vs. 4: If introspection represents functional states accurately but *labels* them phenomenally, the illusion is in interpretation, not core representation.  
    3. Preserves the spirit of illusionism (denying *sui generis* phenomenality) while dodging eliminativism.  
  - **Cost:** Concedes that pre-theoretical "phenomena" are *not* preserved intact (folk psychology is mistaken). Some may argue this *is* eliminativism about everyday experience.  

  ### Is It Still Illusionism?
  **Yes**, robustly. The core illusionist move—replacing phenomenal properties with introspective misrepresentation—remains intact. Your view aligns with Dennett’s "heterophenomenology" or Frankish’s "strong illusionism," differing only in explicitly functionalizing the "phenomena" in Claim 2. The revision strengthens coherence without abandoning the framework.  

  ### Final Package Stability
  With the revised Claim 2, tensions reduce to manageable levels. The remaining challenge is defending why functional states (e.g., "coffee taste" as a sensorimotor detection) feel "real" in a way that *demands* phenomenal description—but this is the illusionist’s burden, not incoherence. Your package is now internally consistent and defensible.
