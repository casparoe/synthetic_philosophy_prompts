  - No winking at the reader—pure institutional voice

  Hmm. The standing desk example is perfect for satire. Winner might argue adjustable desks favor white-collar knowledge workers who can afford them, implicitly excluding manual laborers. But stretching that into "political regime" is exactly the over-application the user wants to lampoon. 

  For structure: 
  Header should scream government bureaucracy—agency acronyms, compliance codes. 
  Section I: Rehash Winner’s framework with bureaucratic sludge ("deployment contexts," "embedded biases"). 
  Section II: Introduce arbitrary classifications. Here’s where to fumble the required/compatible distinction—maybe classify smart thermostats as "inherently political" because they *could* enable energy rationing, ignoring that they don’t *require* it. 
  Section III: Invent "Pending Review" for things like paper clips where politics isn’t obvious. Bureaucracy hates uncertainty, so this becomes a black hole. 
  Footnote: Let a Dr. Aris Thorne rage about "epistemological nihilism." Classic academic infighting. 

  Examples must pass the "Winner-shape" test: 
  - Solar panels (like reapers): Inherently decentralized? Requires community ownership? 
  - Ride-share apps (like Moses’ bridges): Algorithmic bias could exclude poor neighborhoods. 
  - Standing desk: Perfect for "compatible with but not requiring" neoliberal productivity cults. 

  Tone is key. Zero irony. Sentences like "Sub-category B artifacts necessitate antecedent social conditions" delivered straight. The humor comes from applying rigorous political theory to mundane objects—see footnote 2’s despair over "non-adjustable chairs." 

