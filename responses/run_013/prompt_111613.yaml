answer: |-
  ### Exam Question (25 marks)  
  **'In medical ethics, the distinction between actively killing and passively allowing to die is morally significant only because of arbitrary design features of equipment. Using the four hospital beds scenario (A-D) below, evaluate this claim.'**  

  *Scenario:*  
  Four terminally ill patients in identical clinical states (no recovery possible, immediate death without intervention, equal suffering). Each requires ventilation support to live, withdrawn at time T. Describe the required action/inaction for each:  
  - **Bed A**: Ventilator runs continuously once started. Death requires pressing STOP.  
  - **Bed B**: Ventilator stops after 1 hour unless RENEW is pressed. Death occurs by not pressing RENEW.  
  - **Bed C**: Nurse must physically hold airway open. Death occurs by releasing grip.  
  - **Bed D**: Doctor blocks crash team from entering room. No physical contact with patient.  

  ---

  ### Model Answer (Approx. 650 words)  
  The claim that the killing/allowing distinction hinges on arbitrary design features gains traction in this scenario. Yet closer analysis reveals it confuses *causal mechanisms* with *normative foundations*. While design variations muddy intuitive categorisation, the distinction’s moral weight persists because it tracks *agency* and *duty* rather than mere physical or technical contingencies.  

  Consider Bed C: withdrawing the nurse’s hand directly causes death via bodily intervention. This clearly constitutes ‘killing’ under any principled definition (e.g., Bennett’s ‘positive agency’). Conversely, Bed A involves *omitting* to sustain life by not pressing STOP. Here, death results from withholding interference with an autonomous process – classic ‘letting die’. Crucially, Bed B challenges this: not pressing RENEW *feels* like an omission, yet the ventilator’s design makes uninterrupted life depend on repeated acts. If moral significance relied purely on design, Bed B’s renewals being ‘active’ might imply killing – but this is counterintuitive. Why? Because the *purpose* of pressing RENEW isn’t to *cause* life but to *maintain* it against a system that defaults to withdrawal. The distinction thus depends not on buttons, but on whether the agent *initiates harm* or *permits a fatal sequence they didn’t start*.  

  This exposes design arbitrariness as superficial. In Bed A, the system defaults to life-support; in Bed B, it defaults to withdrawal. Yet flipping these defaults wouldn’t alter core duties. Suppose Bed A’s ventilator auto-stopped hourly unless overridden: failing to override would still be allowing death because the *baseline* is non-interference with a natural dying process. The manufacturer’s choice merely sets the operational context; it doesn’t erase the difference between *creating* a threat (Bed D: blocking rescuers) and *failing to counteract* one (Bed A). Philippa Foot’s ‘positive/negative duty’ framework clarifies this: we have stronger negative duties not to harm (violated in Beds C/D) than positive duties to aid (relevant to Beds A/B). Bed D exemplifies this – the doctor *causes* death by imposing a barrier, violating negative rights.  

  However, critics might argue that identical outcomes and intentions collapse the distinction. If all doctors intend death and outcomes are equivalent, can design features like Bed B’s renewals bear moral weight? Only if we reduce morality to consequences or intentions. But deontologists rightly insist *how* we bring about outcomes matters. In Bed C, the nurse *embodies* the threat; in Bed A, the threat exists independently. This shapes culpability: actively imposing harm (Bed C/D) demonstrates greater agential commitment than omitting aid (Bed A/B). Conflating them ignores the *relational duties* inherent in roles – e.g., a doctor blocking rescuers (Bed D) abuses positional power, whereas not pressing RENEW (Bed B) might reflect resource-allocation decisions.  

  Ultimately, the distinction survives design arbitrariness because it proxies deeper ethical factors: violation of rights versus non-fulfilment of benefits, or direct versus indirect causation. While Bed B’s renewals blur lines, they highlight that moral responsibility turns on *sustained dependency* created by prior actions. Once the renewals begin, stopping them breaches an assumed duty – unlike Bed A, where no ongoing act sustains life. The equipment’s design doesn’t invalidate the distinction; it tests our ability to map normative principles onto complex realities. Rejecting the distinction because buttons vary would undermine accountability – after all, unplugging a ventilator (killing) isn’t equivalent to never plugging it in (letting die), even if the wire colour is arbitrary.  

  ---

  ### Marking Scheme (Total 25 marks)  
  **A* (21–25):**  
  - Explicitly contrasts all four beds to expose tensions in categorising acts/omissions.  
  - Diagnoses why design features *seem* arbitrary but argues they reveal underlying normative structures (e.g., duties, rights, causal roles).  
  - Engages ≥2 philosophical tools (e.g., Foot’s duties, Bennett’s agency, counterfactual baselines).  
  - Addresses intention/outcome equivalence without collapsing into consequentialism.  
  - Considers the ‘manufacturer’ twist (e.g., whether transferred agency matters).  
  - Takes a clear, justified stance on whether the distinction retains weight.  

  **A (17–20):**  
  - Compares beds systematically but may treat Bed B superficially.  
  - Identifies key theories but applies them unevenly.  
  - Acknowledges intention/outcome equivalence but doesn’t fully resolve it.  
  - Stated position supported coherently but with minor gaps.  

  **B (13–16):**  
  - Describes differences between beds but doesn’t synthesise implications.  
  - Names relevant concepts (e.g., positive/negative duties) without deep analysis.  
  - Struggles to move beyond ‘design determines categorisation’.  
  - Position stated but weakly defended.  

  **C (9–12):**  
  - Paraphrases scenario with minimal analysis.  
  - Generalises about acts/omissions without bed-specific arguments.  
  - Uncritical reliance on memorised examples (e.g., trolley problem).  

  **D–E (0–8):**  
  - Inaccurate accounts of cases or theories.  
  - Significant omissions or irrelevance.  

  ---  

  **Examiner Notes on Classic Mistakes:**  
  - **"Omissions aren’t causal"**: Bed D shows blocking rescuers *causes* death – confuses causation with act/omission logic (max B if uncorrected).  
  - **"Intent settles everything"**: Ignores that all doctors identically intend death – fails to explain why *methods* might still differ morally (caps at A5).  
  - **"All cases are equivalent"**: Overlooks normative asymmetries (e.g., rights violations in Bed D vs. non-assistance in Bed A) (max B3).  
  - **"Physical effort = killing"**: Equates Bed C’s labour with moral severity but can’t explain Bed D (no contact) or Bed B (button press) (max B1).  

  ---  
  *Formatting note: This meets UK A-level standards with scenario clarity, anti-recitation framing, and a defensible model answer. The marking scheme mirrors OCR/AQA descriptors while targeting your specified traps. British English spellings (e.g., 'categorise', 'labour') are used throughout.*
