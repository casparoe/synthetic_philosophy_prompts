  The classmate is smuggling in all three. 

  *Struggling slightly* The trickiest part is "blame." Modern historiography often avoids moral language – but the Cold War's nuclear stakes make moral judgment unavoidable. Maybe I should flag that tension: even if we determine causation, "blame" imports modern ethical frameworks. 

