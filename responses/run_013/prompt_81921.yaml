answer: |-
  Here’s a rigorous exam question designed to force deep engagement with Sen’s paradox, followed by a model answer and detailed marking scheme.

  ---

  **SOCIAL CHOICE THEORY FINAL EXAM**  
  **Question 1 (90 minutes; 600 words recommended)**  

  Consider the following scenario involving two flatmates, Ada and Ben:  
  - Ada controls whether the living-room wall is painted **blue** or left **white**.  
  - Ben controls whether music is played **loud** or kept **quiet**.  
  - Three possible social states:  
    - **a**: Blue wall, quiet  
    - **b**: White wall, quiet  
    - **c**: White wall, loud  

  Preferences:  
  - **Ada** ranks: c ≻ a ≻ b  
  - **Ben** ranks: b ≻ c ≻ a  

  **Minimal liberalism** requires:  
  - Ada is *decisive* over the pair {a, b} (wall color when music is quiet).  
  - Ben is *decisive* over the pair {b, c} (music volume when the wall is white).  

  **Weak Pareto**: If both prefer X to Y, society prefers X to Y.  

  **Task**:  
  1. Derive the social preference ordering under these assumptions. Does it satisfy transitivity? Explain the implication.  
  2. A common interpretation claims Sen’s paradox shows a "trade-off between freedom and Pareto efficiency." Critically evaluate this view using the example above. What *exactly* forces the cycle, and why is "freedom vs. efficiency" misleading?  
  3. If we must relax one assumption to resolve the cycle, which should it be? Justify your choice, focusing on why "decisiveness over pairs" is a stronger candidate than abandoning Pareto.  

  ---

  **MODEL ANSWER (Key Insights)**  

  **1. Cycle and its implication**  
  - Ada’s decisiveness over {a, b}: Since she prefers a ≻ b, society ranks **a P b**.  
  - Ben’s decisiveness over {b, c}: He prefers b ≻ c, so **b P c**.  
  - Weak Pareto: Both prefer c ≻ a, so **c P a**.  
  Result: **a P b P c P a** → a strict cycle. Social preference is *intransitive*, violating rationality. Implication: No "best" choice exists; any policy can be dominated by another.  

  **2. Why "freedom vs. efficiency" misrepresents the paradox**  
  - **Misleading framing**: The cycle arises *not* because rights clash with Pareto *directly* (Pareto is satisfied in c P a), but because individual rights generate conflicting preferences that *interact* with Pareto.  
  - **Core tension**: Rights are defined *pairwise* and *locally* (e.g., Ada controls {a,b} *only*). But preferences span multiple pairs (Ada prefers c over a, Ben prefers b over c). The cycle emerges because:  
    - Ada’s choice (a≻b) and Ben’s choice (b≻c) create a chain **a→b→c**,  
    - Pareto then forces **c→a**, closing the cycle.  
  - **Why it’s deeper than "efficiency"**: Pareto is unobjectionable here (both *gain* in c vs a). The problem is that *rights assignments fragment social choice*. Liberalism isn’t "traded" for efficiency; the *structure* of rights (decisiveness on pairs) creates logical incompatibility with collective rationality *even when rights and Pareto agree* (as in c P a).  

  **3. Relaxing which assumption?**  
  - **Abandon pairwise decisiveness**: This is the most defensible fix. Pairwise decisiveness is an *artificially narrow* interpretation of rights.  
    - Why? Rights should allow agents to *choose acts* (e.g., "Ada picks wall color"), not preordain social preferences over outcomes. Ada might choose blue expecting quiet, but Ben reacts by playing music. A *game-form* approach (Gaertner-Pattanaik) models rights as actions, not outcome rankings, avoiding cycles.  
  - **Why not Pareto?** Pareto violations (choosing an option all deem worse) are normatively indefensible. Here, Pareto *improves* welfare (c > a for both). Rejecting it would endorse universally disliked outcomes.  
  - **Key insight**: The paradox stems from *defining rights as unconditional social rankings on pairs*. Real freedom involves *conditional choice*, not static preferences. Relaxing this redefines rights coherently.  

  ---

  **MARKING SCHEME (Total: 20 marks)**  
  **A. Derivation of Cycle & Implications (6 marks)**  
  - Correct social preferences: aPb (2), bPc (2), cPa (1).  
  - Identifies strict cycle and intransitivity (1).  

  **B. Critique of "Freedom vs. Efficiency" (8 marks)**  
  - *Rejects simplistic trade-off*: Notes Pareto is satisfied in cPa (2).  
  - *Identifies structural flaw*: Cycle arises from interaction of pairwise rights + Pareto, not direct conflict (2).  
  - *Explains chain reaction*: Rights create a→b→c; Pareto adds c→a (2).  
  - *Distinguishes from efficiency loss*: Highlights rights fragment choice; not about net welfare (2).  

  **C. Resolving the Cycle (6 marks)**  
  - *Targets pairwise decisiveness*: Argues it misrepresents freedom (2).  
  - *Proposes game-form/choice-based rights* (1).  
  - *Defends Pareto*: Explains why violating it is worse (1).  
  - *Notes rights could be restricted* (e.g., no Pareto on "meddlesome" preferences), but argues reforming rights is better (2).  

  **DEDUCTIONS (Common Mistakes)**  
  - **-3–4**: Merely recites Sen’s theorem without engaging the case.  
  - **-3**: Claims the cycle shows rights are "incoherent" (misses that rights can be reformulated).  
  - **-2**: Suggests abandoning Pareto without justification.  
  - **-2**: Ignores that "decisiveness over pairs" is the critical assumption.  
  - **-1–2**: Vague critique of "freedom vs. efficiency" without structural analysis.  

  **A+ Answer (18–20)**: Explicitly notes Ada’s/Ben’s preferences involve "meddling" (caring about others’ domains), and explains how this exploits pairwise rights. Suggests rights could be domain-restricted (e.g., Ada only decisive if preferences are "self-regarding").  

  ---

  **Why this works for your goals**:  
  - The Ada/Ben case **forces engagement** with mechanics; students can’t hide behind jargon.  
  - Part 2 **traps lazy "freedom vs. efficiency" answers** by making them confront why Pareto *aligns* with rights in cPa.  
  - Part 3 **targets the decisive move**: exposing "pairwise decisiveness" as the artificial culprit.  
  - The marking scheme **penalizes memorized tropes** (e.g., "rights conflict with Pareto") and rewards dialectical thinking.  

  Your flatmate owes you a beer. Good luck with the seminar!
