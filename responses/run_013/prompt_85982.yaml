prompt: |-
  I'm the ops lead at a company of about 120 people and by default I've ended up owning the "values and conduct" section of our performance reviews — the bit where a manager has to say whether someone is honest, whether they're a team player, whether they take ownership. Twice a year, every manager writes five to eight of these, twenty minutes each, HR signs off on all of them, and anything that could lead to a firing comes to me and legal. I'm starting to think the whole section is noise. Two managers can watch the same person for a year and write opposite things. The person who's unflappable in a crisis is often the one who blows up over a scheduling mistake. And the write-ups seem to track which team your on more than who you are. I've been reading the philosophy that says this isn't just my office — the obedience experiments, the seminary students who were in a hurry, the whole situationist case that behaviour is mostly the setting and not the person — and I'm half convinced that "character" is just a name we give a snap judgement after the fact. But we can't scrap it: HR wants documented conduct assessments, managers need something to write, and I don't buy the situationist line all the way either, since people obviously do have patterns.

  So what I want from you is virtue ethics turned into something a manager can actually run — not an essay, a procedure. Take seriously what the theory really claims (that a virtue is supposed to be stable across situations, that having one means acting knowingly and from a settled disposition and not just by habit) and take just as seriously the objection that a single act under pressure shows almost nothing, then give me the questions in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it has to hand the call to a person because that's a values question and not a fact question. I'd much rather my managers learn to write "in situations like X, this person does Y" than slap a global label on someone, so build that in — and tell me how to keep the form from turning into a pile of anecdotes, and whether those if-then patterns are allowed to come out narrow (honest about expenses but not honest in general) or whether narrowing them that way is just quietly abandoning the theory. Then run it on three cases: someone who was rude to a client exactly once; someone with five years of "great attitude" and one integrity lapse; and a high performer whose good behaviour only shows up when they're being watched. I want at least one of those to land in a way I won't like — ideally the one where the procedure tells me our most trusted manager's glowing review is really just a description of a situation we built. Keep the whole thing to about a page, and be straight with me about which steps are judgement calls dressed up as procedure and what this thing simply can't settle.
reasoning: |-
  Okay, the user is an ops lead at a mid-sized company dealing with performance reviews, specifically the "values and conduct" section. They're frustrated because the current process seems inconsistent and situational—managers give conflicting feedback, and behavior appears context-dependent rather than reflecting stable traits. They've read about situationist psychology (like Milgram's obedience experiments) and are skeptical about assessing "character," but they can't scrap the system due to HR requirements and their own belief that people do have behavioral patterns. 

  They want a practical, virtue ethics-based procedure for managers—something that avoids global labels and instead captures context-specific behaviors ("in situation X, this person does Y"). The challenge is balancing theory (virtues as stable dispositions) with reality (behavior varies by context). They also want to prevent the assessment from becoming anecdotal, and need clarity on whether narrow behavioral patterns (e.g., "honest about expenses but not otherwise") are acceptable or a cop-out. 

  Three test cases are requested: 
  1. Someone rude to a client once. 
  2. A generally exemplary employee with a single integrity lapse. 
  3. A high performer who behaves well only when watched. 
  The user explicitly wants one outcome to be uncomfortably revealing—likely exposing that a "glowing review" is just a product of situational controls. 

  Deep needs analysis: 
  - They're intellectually honest (citing philosophy/psychology) but pragmatic (can't dismantle the system). 
  - They suspect the status quo is theater—wasting time while missing real issues. 
  - Unspoken goal: legitimize ditching vague moral labels *without* undermining HR's need for documentation. 
  - Fear: The procedure might confirm that "character" is largely situational, unsettling their role in enforcing conduct standards. 

  Procedure design constraints: 
  - Must fit a 1-page review format. 
  - Questions need clear thresholds (what's a "good enough" answer?). 
  - Must flag judgment calls transparently. 
  - Should force managers to specify *context* for behaviors. 

  Key philosophical tensions to address: 
  - Virtue ethics demands cross-situational stability, but situationism says behavior is context-bound. 
  - Solution: Assess *if-then patterns* (e.g., "under deadline pressure, they cut corners") but require multiple observations to infer a "disposition." 
  - Narrow patterns (e.g., "honest in expense reports") *are* acceptable if framed as "domain-specific virtues"—this isn't abandoning theory but refining it. Humans aren't universally virtuous; they have strengths in contexts. 

  For the test cases: 
  - The one-off rudeness incident shouldn't define "character" unless it reveals a pattern (e.g., *only* rude when unobserved). 
  - The integrity lapse after years of good behavior requires examining whether the "lapse" was situational (e.g., extreme stress) or a revealed tendency (e.g., cheating when stakes are low). 
  - The high performer who behaves well only when watched directly exposes situationism—their "virtues" are not dispositions but responses to surveillance. This should unsettle the user as requested. 

  Biggest risk: Managers might still default to anecdotes. Mitigation: Require concrete examples *and* counterexamples (e.g., "When did they *not* show this behavior?"). Also, use scaling for frequency/consistency. 

  Final structure: 
  1. **Observation phase:** List behaviors in specific contexts (no labels). 
  2. **Pattern testing:** Cluster behaviors to see if they hold across similar contexts. 
  3. **Disposition check:** Assess intentionality (did they *choose* the action?) and whether it's habitual vs. reasoned. 
  4. **Judgment zones:** 
     - Is a pattern "stable enough"? (Requires manager discretion + HR oversight.) 
     - Does a lapse invalidate a virtue? (Only if it contradicts *multiple* prior observations.) 
     - Surveillance distortion: If virtue only appears under observation, it's not a virtue—flag for coaching.
answer: |-
  Here's a virtue ethics-based assessment procedure designed for actionable, situation-aware feedback while acknowledging its limits. Core principle: **"Virtues are consistent dispositions, not single acts. Assess patterns across contexts."**

  ### The Procedure: Contextual Virtue Mapping (CVM)
  **(15-20 mins per review. Managers complete Sections 1-3; HR/Ops reviews Section 4.)**

  1.  **Observed Behaviors (Facts Only - 5 mins):**
      *   *Question:* "List 3-5 specific, observable instances (past 6 months) where the employee demonstrated behaviors relevant to *our core values* (e.g., honesty, ownership, teamwork). For each, note: **a)** The specific situation/context (e.g., 'during client X escalation,' 'team sprint deadline,' 'expense report audit'). **b)** Their exact action/words."
      *   *Good Enough:* Concrete examples, diverse situations (≥3 contexts). Avoid labels ("was honest").
      *   *Stop if:* Cannot list ≥3 distinct examples. Proceed to coaching plan, not assessment.
      *   *Judgment Call:* Selecting which examples are "relevant." Mitigate by requiring diversity.

  2.  **Pattern Identification (Clustering - 5 mins):**
      *   *Question:* "Review the examples above. **a)** Group examples showing *similar* behaviors in *similar* contexts (e.g., 'Ownership shown during project crises'). **b)** For each group, name the observed **behavior-in-context** (e.g., 'Steps up to lead troubleshooting during system outages'). **c)** Note any recurring contexts where *expected* behavior was *absent* (e.g., 'No examples of admitting mistakes in client-facing emails')."
      *   *Good Enough:* Clear groupings, descriptive labels, noted gaps.
      *   *Stop if:* Examples don't cluster into any pattern (back to Section 1).
      *   *Judgment Call:* Defining "similar contexts." Narrow patterns (e.g., "honest on expenses") are **allowed** – this reflects reality. Virtue ethics accepts domain-specific strengths; it flags *where* virtues hold, not demanding universality.

  3.  **Disposition Check (Intent & Stability - 5 mins):**
      *   *Question:* "For each primary behavior-in-context group: **a)** Was the action deliberate/conscious? (Evidence: chose difficult option, explained reasoning). **b)** Is this consistent? (≥2 examples, different dates). **c)** Is there evidence this stems from their values/understanding ('settled disposition'), not just habit/compliance?"
      *   *Good Enough:* "Yes" to (a) & (b) for a pattern to be considered a "developing virtue." (c) is aspirational (e.g., "Explained 'We owe the client transparency'").
      *   *Stop if:* "No" to (b) for all groups – behavior is isolated, not dispositional. **No "global virtue" label can be applied.**
      *   *Judgment Call:* Interpreting "deliberate" and "settled disposition." Mitigate with evidence.

  4.  **Summary & Risk Flag (Ops/HR Review - 5 mins):**
      *   *Summary:* "Employee reliably demonstrates [Behavior X] in [Context Y] and [Behavior A] in [Context B]. Gaps observed in [Context C]. No consistent pattern for [Core Value Z]."
      *   *Risk Flag:* "High Risk" if: i) Gap in a critical context (e.g., dishonesty under audit), ii) Behavior *only* occurs under scrutiny, iii) Single severe act contradicting established patterns. Escalate to Ops/Legal.
      *   *Judgment Call:* Defining "critical context" and severity. Escalation isn't automatic; requires Ops/Legal human review.

  **Avoiding Anecdotes:** Requires ≥3 examples *before* pattern identification (Step 2) and consistency checks (Step 3b). Focuses on clustering *similar* instances.

  ---

  ### Test Cases

  1.  **Rude to Client Once:**
      *   *Section 1:* 1 example (rudeness), 5+ examples of politeness in client calls.
      *   *Section 2:* Group: "Professional in routine client updates." Gap: "Stressful client negotiations" (only one negative example).
      *   *Section 3:* Rudeness example fails (b) consistency. Politeness group passes (a)&(b). **Result:** "Reliably professional in routine client interactions. Single incident of stress-related rudeness noted (not a pattern). Monitor in high-stakes negotiations." **Not a conduct issue. No escalation.**

  2.  **"Great Attitude" with One Integrity Lapse:**
      *   *Section 1:* 4 examples of ownership/helpfulness, 1 example of falsifying data to hit a target.
      *   *Section 2:* Group: "Proactively helps colleagues under normal workload." Gap: "Ownership when personal targets are at severe risk" (one example shows violation).
      *   *Section 3:* Helpfulness group passes (a)&(b). Falsification: Passes (a) (likely deliberate), fails (b) (isolated), likely fails (c) (contradicts stated values). **Result:** "Strong pattern of teamwork/ownership in standard work. Serious, isolated integrity lapse under target pressure. **High Risk flag: Gap in critical context (integrity under pressure).**" **Escalate to Ops/Legal.** The long history doesn't negate the severity *in that critical context*.

  3.  **Good Behavior Only When Watched:**
      *   *Section 1:* 3 examples of ownership/helpfulness *only* when manager/exec is present. 2 examples of blame-shifting/inaction when alone (via peer feedback/audit trail).
      *   *Section 2:* Group: "Demonstrates ownership in high-visibility situations." Gap: "Ownership when working autonomously/unobserved."
      *   *Section 3:* "High-visibility" group fails (c) – stems from compliance, not disposition. **Result:** "Observed ownership behaviors occur primarily under direct scrutiny. Evidence suggests this is situational compliance, not a settled disposition of ownership. **High Risk flag: Behavior depends on scrutiny.**" **Escalate for coaching/oversight.** This challenges the "glowing review" as revealing a *situation* (observation), not a *virtue*.

  ---

  **What This Can't Settle & The Judgment Reality:**
  *   **The Threshold:** What counts as "consistent enough" (Step 3b) or a "critical context" (Step 4) is inherently judgmental. HR/Ops must review these calls.
  *   **The "Why":** It identifies *what* and *where*, not deep *why* (motivation is inferred).
  *   **True Character:** It assesses *observable behavioral patterns in workplace contexts*, not cosmic virtue. A person might be "honest on expenses" (work pattern) but lie to friends (irrelevant here).
  *   **The Situationist Win:** The 3rd case is the uncomfortable truth. If "virtuous" behavior vanishes without an audience, it wasn't virtue – it was situational responsiveness. The procedure exposes this, forcing action on the *environment* (e.g., oversight) or the individual.

  **Final Output:** A concise summary of **where and how** the employee reliably demonstrates value-aligned behaviors (or doesn't), replacing global labels with contextual patterns and clear flags for risk. Managers write descriptively; HR gets documentation; Ops/Legal gets focused escalations. It accepts situational variance while still seeking stable, intentional dispositions where they exist.
