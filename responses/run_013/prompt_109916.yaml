answer: |-
  ### Bottom Line
  Your friend is deploying a radical, quasi-mystical version of "the will of the people" (WoP). It’s **not** a boring majoritarian claim but an assertion of an eternal, unitary, and discoverable popular will that transcends procedures, persists unchanged, and excludes dissenters. This reading *doesn’t* license ignoring courts—it collapses under scrutiny. His stance relies on ignoring time, dissent, and institutional legitimacy.

  ### The Menu: Readings of "The Will of the People"  
  1. **Procedural Majoritarianism**  
     WoP is the aggregated preference of voters *as measured by a specific, legitimate democratic procedure* (e.g., referendum). It’s pluralistic (many individual wills), temporary (shifts with new votes), and binding only because the procedure is fair. Courts can review procedures but not outcomes absent illegality.

  2. **Counterfactual Informed Majority**  
     WoP is what a majority *would* want if fully informed and rational—not necessarily what they voted for. It’s discovered via deliberation, not just voting. Later polls *can* signal shifts. Courts might protect this "deeper" will against procedural flaws or misinformation.

  3. **Rousseau’s General Will** (You’re right! It’s "volonté générale" vs. "volonté de tous")  
     WoP is the common good, distinct from the sum of self-interests ("will of all"). It’s unitary, timeless, and must be "discovered" through direct democracy/assembly. It persists if the polity’s fundamental interests don’t change. Courts defying it are illegitimate—but so is claiming WoP without ongoing popular engagement.

  4. **Metaphysical Popular Soul**  
     WoP is a real, singular entity—a "people" as a collective agent with one persistent will. It exists independently of procedures, which merely "detect" it. Later votes/polls are irrelevant if they contradict the original "true" expression. "The people" excludes those opposing the will (the "corrupt elite").

  ### Verdicts  
  1. **Procedural Majoritarianism**: **Platitudinous** – Standard in democracies, but limited (e.g., protects minority rights).  
  2. **Counterfactual Informed Majority**: **Defensible** – Philosophically coherent (e.g., Rousseau, Habermas), but hard to operationalize.  
  3. **General Will**: **Dubious** – Noble in theory (prioritizes common good), but prone to authoritarian hijacking ("I know best").  
  4. **Metaphysical Popular Soul**: **Not even coherent** – Groups lack minds; "will" requires cognition. Self-contradictory (excludes dissenters but claims universality).  

  ### What He Probably Meant  
  He’s blending readings **3 and 4** while ignoring their constraints. His moves reveal:  
  - **(a) Court defiance**: Assumes WoP is a discovered truth (Reading 4), making courts "corrupt" for overruling it.  
  - **(b) Time immunity**: WoP is eternal (Readings 3–4), freezing the referendum result as sacred.  
  - **(c) Exclusionary "people"**: WoP belongs only to "real" (non-elite) people (Reading 4), dismissing opponents as illegitimate.  
  Rousseau’s distinction *does* help: he’d claim the referendum captured the "general will" (common good), not the "will of all" (selfish interests). But Rousseau required constant democratic renewal—not fossilized results.

  ### What It Costs Him  
  To maintain his radical reading (WoP as eternal/metaphysical), he must sacrifice:  
  - **Democracy’s core mechanics**: Elections/polls become irrelevant if WoP is timeless.  
  - **Minority rights**: His "people" excludes opponents, enabling tyranny of the (original) majority.  
  - **Institutional legitimacy**: Courts, parliaments, and new votes are all suspect if they contradict the One True Will.  
  - **Reality**: He must ignore that 48% opposed the referendum *and* later polls shifted—facts incompatible with a unitary, persistent will.  

  In short: His stance isn’t just radical—it’s self-defeating. It turns "the will of the people" into a dogma that invalidates democracy itself.
