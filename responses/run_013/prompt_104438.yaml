prompt: |-
  I run a small insights team at a mid-size company and every couple of weeks someone pitches something that leans on a generation: Gen Z wants constant feedback so redo our reviews, Boomers won't touch the app so build a stripped-down version, Millennials care about purpose so lead with that in recruiting. I need a decision procedure I can actually run on a pitch before we spend money on it, and I want it built on what's genuinely known about whether generations are real things or just bins we made up. Questions to ask in order, what counts as a good enough answer to each, where it stops with a hard no, and where it stops and hands the decision back to a person because it's values or strategy and not a fact question. It has to work when all we've got is a hunch and no data, and it should be honest about which steps are judgment calls in a lab coat. My director signs off on the budget, so the output needs to be something I can defend in a five-minute conversation.

  Two things I specifically want it to handle. First, the obvious rival explanations: whatever looks generational might just be age (twentysomethings act like that in every era) or just the times (everyone went online in the same decade, it's not a Gen Z thing) — and I gather there's a real identification problem where you can't seperate birth-year, age, and period from each other with the data people usually have, so tell me what the procedure does about that rather than pretending it's solved. Second, the gap between a cohort (just people born in some window, and the cutoffs are basically arbitrary) and a generation in the stronger sense (these people share a formative experience in youth that durably shaped them) — I think a lot of pitches quietly assume the strong version and never say so. Also, does it change anything if the people being labelled have started using the label about themselves?

  Then run it on the two pitches, the Gen Z feedback one and the Boomers app one, and make one of them a case where the procedure tells me to drop something I'm actually fond of. Finish with what the procedure can't do.
reasoning: |-
  Okay, the user runs a small insights team at a mid-size company and is constantly getting pitches based on generational stereotypes. They need a practical decision procedure to evaluate these pitches before spending money. The key issues they want addressed are rival explanations (age vs. period effects) and the gap between arbitrary cohorts and actual formative experiences. They also want to know if self-identification changes anything.

  First, I need to structure a step-by-step procedure. The steps should be ordered logically, starting with basic checks and moving to more complex analyses. Each step needs clear pass/fail criteria and an explanation of why it matters. The procedure must work with little data and distinguish between empirical questions and value judgments.

  The user mentioned two specific pitches: Gen Z feedback and Boomers app. I'll apply the procedure to both. For the Boomers app, I'll make it fail to show how the procedure kills a pet project. The Gen Z example might pass some steps but fail later, highlighting the need for evidence beyond stereotypes.

  The user's deeper needs include defending decisions to their director quickly. The output must be concise for a five-minute conversation. They also need to address the methodological flaws in generational research, like the identification problem where age, period, and cohort effects can't be separated without longitudinal data.

  I should clarify that generations are social constructs, not biological realities. Self-identification might indicate cultural resonance but doesn't validate causal claims. The procedure should flag when a pitch assumes formative experiences without evidence.

  Finally, the limitations: the procedure can't resolve the identification problem or replace strategic decisions. It can only assess the empirical basis of generational claims. Values and resource allocation are still human decisions.
answer: |-
  Here's a battle-tested decision procedure for evaluating "generational" pitches, designed for speed, realism, and defensibility. It tackles the core problems head-on and forces explicit thinking about rival explanations and the "formative experience" gap.

  **The Generational Pitch Evaluation Protocol (GPEP)**

  **Core Principles:**
  1.  **Generations are weak constructs:** Treat them as loose cohorts, not deterministic forces. The burden of proof is *always* on the pitch.
  2.  **Age-Period-Cohort (APC) Problem is Unsolved:** We acknowledge we usually can't statistically separate these. We look for *specific evidence* pointing *more strongly* to cohort effects than age or period.
  3.  **Formative Experience is Key (but elusive):** A "generation" only matters if a specific, shared *youth experience* durably shapes behavior *differently* than just being young *then* or living *now*.
  4.  **Self-Identification is Cultural, Not Causal:** It shows the label has meaning *socially*, but doesn't prove the underlying causal mechanism or its uniqueness.

  **The Procedure: Ask These Questions in Order**

  1.  **What is the specific, measurable behavior or outcome this pitch aims to change?**
      *   *Good Enough Answer:* A concrete, observable action (e.g., "increase app adoption rate among users 65+ by 15%", "reduce voluntary turnover among employees <25 by 10% in the first year", "increase click-through rate on recruiting ads targeting 22-30 year olds by X%"). Avoid vague terms like "engagement" or "satisfaction" without clear metrics.
      *   *Hard Stop (No):* Vague goals ("appeal to Boomers", "make Gen Z happier"). If they can't define the *what*, stop. "We need to do *something* for Gen Z" isn't enough.
      *   *Output:* A clear success metric. If passed, proceed.

  2.  **What is the specific generational cohort being targeted, and what are the exact birth year boundaries used?**
      *   *Good Enough Answer:* Defined cohort (e.g., "Born 1965-1980", "Born 1997-2012") with a *stated rationale* for the boundaries (even if arbitrary, like "Pew definition"). Acknowledgment that cutoffs are fuzzy.
      *   *Hard Stop (No):* Using vague, undefined generational labels ("Boomers", "Gen Z") without specifying *who* is included. "Everyone knows who Boomers are" is not acceptable.
      *   *Output:* Defined target group. If passed, proceed.

  3.  **What is the proposed causal mechanism? Specifically: What *formative experience(s)* during youth (roughly 10-25) does this cohort uniquely share that durably shapes this *specific behavior* differently than just being that age *in any era* (age effect) or living in the *current time* (period effect)?**
      *   *Good Enough Answer:* A plausible, specific historical/cultural/socioeconomic event or trend occurring during the cohort's youth *and* a logical, evidence-informed (even if preliminary) link explaining how it durably shapes the *exact behavior* in question *today* (e.g., "Gen Z entered the workforce during extreme remote work normalization and economic uncertainty, leading to heightened need for frequent reassurance about performance *specifically in remote/hybrid settings*"). Must address *why it's durable*.
      *   *Judgment Call (Lab Coat):* Assessing plausibility of the link and uniqueness of the experience. Is this *truly* a cohort-defining experience, or just something that happened while they were young? (e.g., "The internet existed" happened to Millennials *and* Gen Z as youth - not unique).
      *   *Hard Stop (No):* Mechanism relies *only* on current age ("They're young, young people always want feedback") or current period ("Everyone uses apps now"). Mechanism is vague ("Boomers distrust technology"). No link to a *formative* experience.
      *   *Output:* A plausible cohort-effect hypothesis. If passed, proceed.

  4.  **What is the *strongest rival explanation*? (Age effect? Period effect? Something else entirely like income, role tenure, geography, or job function?) How does the pitch address this?**
      *   *Good Enough Answer:* Identifies the most obvious rival (e.g., "This could just be because new hires always want more feedback" [Age], or "Everyone expects intuitive apps now" [Period]) and proposes either (a) a way the *solution* inherently controls for it (rare), or (b) a *specific piece of evidence* (internal data, credible research) suggesting the cohort effect is *stronger* than the rival.
      *   *Judgment Call (Lab Coat):* Assessing the strength of the rival and the adequacy of the counter. Is the rival *more* plausible? Is the evidence offered convincing enough to overcome the APC problem *for this specific claim*?
      *   *Hard Stop (No):* Fails to identify a major rival explanation. Dismisses rivals without evidence ("No, it's definitely generational"). Evidence is purely anecdotal ("My nephew is Gen Z and he...") or based solely on surveys asking about self-perceived generational traits (which prove perception, not causation).
      *   *Output:* Acknowledged rival and a reasoned argument for why the cohort effect might dominate *in this case*. If passed, proceed.

  5.  **What is the *minimum viable evidence* we need *before spending significant money* to believe the cohort effect is the primary driver *here*? How will we get it quickly/cheaply?**
      *   *Good Enough Answer:* Identifies a specific, feasible, low-cost test *within our context* that could provide *some* support for the cohort hypothesis over rivals. Examples: Analyze existing internal data segmented by age *and* tenure/role *and* time period (if possible); run a small, targeted survey/experiment comparing the target cohort *to a relevant control group* (e.g., Gen Z vs. Millennials at *same career stage*); A/B test messaging/app features with age as a segmentation variable. Focuses on *our* specific behavior/metric from Step 1.
      *   *Judgment Call (Lab Coat):* Assessing the feasibility and cost of the proposed test, and whether the potential results would be sufficiently informative.
      *   *Handoff to Human (Values/Strategy):* If the cost/effort of gathering *any* evidence is deemed too high *relative to the potential upside/risk*, OR if the pitch is fundamentally about values ("We *should* be a purpose-driven company") rather than a specific behavioral claim about a generation. Proceed only if evidence is feasible and justified.
      *   *Hard Stop (No):* No feasible way to gather *any* relevant evidence before committing significant budget. Relies solely on external generic reports not tied to our specific context or behavior.
      *   *Output:* A plan for a cheap/fast evidence check OR a handoff to leadership for a values/strategy decision based on gut/principle (acknowledging it's not empirically validated as a cohort effect). Proceed to Step 6 only if evidence check is planned/passed.

  6.  **Based on the evidence gathered (or if bypassing evidence, the values/strategy rationale), does the *proposed solution* logically and efficiently address the identified cohort-specific driver *and* outperform simpler alternatives (e.g., a solution based on life stage or universal design)?**
      *   *Good Enough Answer:* Clearly articulates how the solution (e.g., new feedback process, stripped-down app) directly targets the proposed cohort-specific mechanism from Step 3. Acknowledges and justifies why a simpler solution (e.g., better feedback training for *all* managers, improving the core app's usability for *everyone*) wouldn't work as well *specifically for this cohort-driven problem*.
      *   *Judgment Call (Lab Coat):* Assessing the logic chain and cost/benefit vs. alternatives.
      *   *Handoff to Human (Values/Strategy):* If the decision rests on strategic priorities (e.g., "Even if it helps only a small group, they are our future leaders") or brand values, independent of empirical superiority.
      *   *Hard Stop (No):* Solution doesn't logically connect to the mechanism. Solution is vastly more complex/expensive than a simpler, likely equally effective universal alternative. Proposed evidence check (Step 5) failed to support the cohort hypothesis.
      *   *Output:* GO/NO GO/KILL decision for the *pitch as proposed*, or a recommendation for a modified (often simpler/universal) approach.

  **Applying GPEP to Your Pitches:**

  **Pitch 1: "Gen Z wants constant feedback, so redo our performance reviews."**

  1.  **Specific Outcome:** Reduce voluntary turnover in first 2 years for employees <25? Increase self-reported feedback satisfaction for <25? *(Assume defined, proceed)*
  2.  **Cohort Defined:** Gen Z (e.g., Born 1997-2012). *(Proceed)*
  3.  **Causal Mechanism:** "Grew up with instant feedback loops (social media likes, gaming stats), creating a durable need for frequent, real-time validation at work." *(Plausible link proposed, proceed)*
  4.  **Rival Explanation & Addressal:**
      *   *Strongest Rival:* **AGE EFFECT:** New entrants (<25 in *any* era) always have higher feedback needs as they learn. *How Addressed?* Pitch claims "It's different now, it's constant."
      *   **GPEP Verdict:** Fails Step 4. Doesn't adequately address the age rival. No evidence provided showing Gen Z new hires demand *significantly more/different* feedback than Millennial/Gen X new hires did *at the same age/stage*. Common external surveys suffer from APC problem. **HARD STOP (NO)**. *Spending significant money to overhaul reviews based solely on this pitch is rejected.*
      *   *Alternative Path:* Evidence Check (Step 5): Analyze exit interview data for <25 leavers - was "lack of feedback" cited more frequently than in past years for similar leavers? Survey current <25 employees *and* 25-30 employees (same role/tenure) on feedback preferences. If data *specifically* shows uniquely high demand *controlling for age/tenure*, *then* revisit Step 6.

  **Pitch 2: "Boomers won't touch the app, so build a stripped-down version." (Your "fond of" kill case)**

  1.  **Specific Outcome:** Increase app adoption/usage rate among employees/customers aged 65+. *(Assume defined, proceed)*
  2.  **Cohort Defined:** Boomers (e.g., Born 1946-1964). *(Proceed)*
  3.  **Causal Mechanism:** "Came of age before pervasive computing, leading to durable technophobia or preference for simplicity." *(Plausible link proposed, proceed)*
  4.  **Rival Explanation & Addressal:**
      *   *Strongest Rivals:* **AGE EFFECT:** Cognitive/physical changes (vision, dexterity, learning speed) make complex UIs harder with age. **PERIOD EFFECT:** The *current* app is poorly designed/overly complex for *anyone* who isn't a power user. **Other:** Lack of training, perceived irrelevance.
      *   *How Addressed?* Pitch focuses on birth cohort = technophobia.
      *   **GPEP Verdict:** Fails Step 4. Doesn't seriously address the powerful age (cognitive) or period (bad design) rivals. Assumes "Boomer" = "Technophobe" without evidence. Dismisses that many Boomers use tech fine, and many non-Boomers struggle with bad UX. **HARD STOP (NO)** on building a separate app *for this reason*.
  5.  **Evidence Check (If proceeding cautiously):** Step 5 MVP Evidence: Analyze current app usage data segmented by age *and* tech comfort (if available via survey). Conduct usability testing *specifically* observing pain points for 65+ users - are the issues *unique* to them or universal usability flaws? Survey non-users 65+ - what are the *actual* barriers? (Likely reveals mix of age-related needs *and* general UX flaws).
  6.  **Solution Logic:** Step 6: If evidence shows *some* age-related needs (e.g., font size, clarity), the logical solution is **Universal Design:** Improve the core app's accessibility, simplicity, and onboarding for *all* users. A separate "Boomer app" is inefficient, stigmatizing, and fails to fix core UX problems affecting others. **KILL** the separate app pitch. **Proceed** with core app usability improvements based on observed needs (age-related and general).

  **What GPEP Can't Do:**

  1.  **Solve the APC Problem:** It forces awareness and demands evidence *pointing towards* a cohort effect, but it can't magically disentangle age, period, and cohort with insufficient data. It highlights the uncertainty.
  2.  **Prove Formative Experiences:** We usually can't definitively prove *which* youth experience caused what. We assess plausibility and look for corroborating evidence.
  3.  **Replace Strategic Judgment:** If Step 5 says evidence is too costly or Step 6 shows a universal solution is better, but leadership *still* wants to target a cohort for strategic reasons (e.g., "We prioritize seniors symbolically"), GPEP flags it's a values/strategy call, not an evidence-based one. It doesn't make that decision.
  4.  **Handle Extreme Edge Cases:** Highly specific niches *might* have strong cohort effects (e.g., engineers who learned COBOL vs. Python), but GPEP would demand evidence even there.
  5.  **Guarantee Success:** It minimizes risk based on flawed generational thinking. A passed pitch could still fail for other reasons (poor execution, market shifts).

  **Defending to Your Director (5-Minute Version):**

  "Director, we used our Generational Pitch Protocol on [Pitch]. It failed at Step [X]. Here's why: [Concise reason based on steps, e.g., 'It assumed Boomers are technophobic but didn't rule out that our app is just hard for anyone over 60 to use, or that it's badly designed for everyone. We'd need to test usability first before building a separate version.' / 'The Gen Z feedback claim didn't prove it's different from what any new hire needs. We'll check our exit data first.'] The protocol forces us to rule out simpler explanations like age or bad design before spending money on cohort-specific solutions. We either need cheap evidence ([Suggestion from Step 5]) or we should consider [Universal Alternative/Kill it]. This saves us from costly assumptions."

  This procedure provides rigor, acknowledges the limitations of generational thinking, focuses on actionable evidence, and clearly separates empirical questions from strategic choices – all while being practical for a busy insights team.
