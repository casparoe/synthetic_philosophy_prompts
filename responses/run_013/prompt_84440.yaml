prompt: |-
  I teach ethics and decision theory, and I sit as a trustee on the board of a small private foundation whose mission is to bring a treatment to patients with a rare degenerative disease within twenty years. The board votes on October 9 between two five-year research strategies, and I have been asked to circulate a written opinion before the vote. I would like you to draft that opinion.

  The two strategies are these. The first, which staff call the portfolio, spreads the next five years of grantmaking across roughly forty established laboratories working on incremental improvements: better supportive care, a repurposed compound, better diagnostics. It is close to certain to produce modest but real gains for patients within the decade, and close to certain not to produce a cure. The second, which staff call the platform bet, commits most of the same money to one laboratory and one unproven delivery technology. Staff put the chance that it yields a therapy that halts the disease at roughly one in eight, and the chance that it yields nothing clinically usable at better than even, in which case the five years are largely spent. Staff scored both strategies on the foundation's own impact metric and put the platform bet ahead, but not by much, and the gap depends heavily on the assumed probability that the delivery technology works at all; small changes in that assumption reverse the ranking.

  Two trustees will not accept the platform bet. Their objection, as far as I can extract it, is not that the probability is too low but that the foundation is not entitled to stake its only shot on a long shot while patients are waiting. A third trustee, who has some background in decision theory, proposes that the board stop scoring options by expected impact and adopt what he calls a risk-weighted impact score. His rule runs as follows. List an option's possible outcomes with their probabilities, and give each outcome a number on the foundation's impact scale; order the outcomes from worst to best. Replace each probability with a weight: for any given outcome, the weight is the difference between the c-th power of the probability of doing at least that well and the c-th power of the probability of doing better than that. Multiply each outcome's impact number by its weight and add. The exponent c is a single number no less than 1, set by the board. At c equal to 1 the weights are simply the probabilities and the rule is ordinary expected impact; as c rises, the rule behaves as though the worst outcomes were likelier than they are and the best outcomes less likely. He argues that this is the only honest way to write down what the objecting trustees are doing when they refuse the platform bet, and that it captures a real difference between a foundation that can absorb a loss and patients who cannot.

  I have not made up my mind, and I would rather the opinion change it than flatter it. What I need from you is the following.

  First, a recommendation stated in the opening paragraph: which strategy the board should adopt on October 9, and whether it should adopt the risk-weighted rule at all, and if so at what value of c, set by whom, with what date for reconsideration. Give me a resolution the board can actually vote on, not a framework for deciding later.

  Second, whether the risk-weighted rule is a defensible account of what the board should do or a formalization of a mistake. Does it ever rank one option above another that is worse in every state of the world? Does it violate a principle the board would insist on in any other context, for instance that the ranking of two options cannot depend on what they have in common, so that replacing the outcome they share in some state with the same outcome for both cannot flip the preference between them? Exhibit a concrete pair of options, built from the numbers above or from plausible variations on them, in which the rule reverses the ranking that expected impact gives, and say whether the reversal is defensible.

  Third, whether the objecting trustees' caution can be redescribed as ordinary expected impact applied to a concave impact scale, that is, as diminishing returns to impact rather than as anything about probabilities. If it can, say so, and the rule is unnecessary. If it cannot, identify the kind of case that separates the two, say which better matches what the trustees are actually objecting to, and say what the rule is supposed to do when the probabilities are contested estimates rather than known chances.

  Fourth, at what level the rule is to be applied. Because the weighting depends on an option's whole outcome distribution, scoring the two five-year strategies is not the same as scoring the individual grants within them and adding. Tell the board what it must decide about aggregation, and what turns on that decision.

  Fifth, who bears the risk and who bears the regret. The trustees bear embarrassment; patients bear the consequences of five wasted years. Say whether the trustees' reluctance is a reason for the board to act as they wish or a bias the board should discount, and make the recommendation consistent with your answer.

  Include a short statement of the best case for the losing side, in terms its advocates would accept. Address the document to the board, keep it to about twelve hundred words, and write it so that trustees with no background in decision theory can follow the argument without its being flattened. Do not include citations, a reading list, or a survey of what has been written on the subject; argue from the structure of the options themselves. And do not tell the board that this is a disagreement between expected value and risk aversion. They have heard that already, and it does not help them vote.
reasoning: |-
  We are drafting a board opinion for a foundation trustee. The foundation must choose between two research strategies: the "portfolio" strategy and the "platform bet". The portfolio spreads funding across many labs for incremental gains, while the platform bet concentrates funding on one high-risk, high-reward project. The staff's impact metric slightly favors the platform bet, but two trustees object on the grounds that the foundation should not take such a risk when patients are waiting. A third trustee proposes a risk-weighted impact scoring rule.

  The opinion must include:
  1. A clear recommendation in the opening paragraph: which strategy to choose, whether to adopt the risk-weighted rule, and if so, with what parameters.
  2. An evaluation of the risk-weighted rule: is it defensible or a formalization of a mistake? Show a concrete example and discuss reversals.
  3. Whether the objecting trustees' caution can be captured by a concave impact scale (diminishing returns) instead of the risk-weighted rule.
  4. The level of aggregation: whether to apply the rule to the overall strategy or to individual grants.
  5. Risk and regret: who bears the consequences and whether the trustees' reluctance is a reason to act or a bias to discount.

  Also include the best case for the losing side.

  Structure the document as follows:

  **Opening Paragraph: Recommendation**
  - Clearly state the recommendation for the vote on October 9.

  **Body of the Opinion**
  - Address each of the five points above in a logical order.

  **Conclusion**
  - Reiterate the recommendation and include the best case for the losing side.

  Word limit: about 1200 words.

  Let's break down the recommendation:

  After analysis, I (the trustee) recommend:
  - Adopting the **portfolio strategy** for the next five years.
  - **Not adopting** the risk-weighted rule at this time.

  Reasons:
  1. The platform bet is too risky given the foundation's mission and the patients' urgent timeline (20 years). A 1 in 8 chance of a cure is low, and the chance of nothing usable is over 50%. The portfolio is certain to deliver modest gains, which are valuable now.
  2. The risk-weighted rule, while interesting, is not necessary and may introduce complexities and potential distortions. The objecting trustees' concerns can be addressed by a concave impact scale (i.e., diminishing marginal utility of impact) without needing a new rule.
  3. The foundation's role is to make a difference for patients now, and the portfolio strategy does that reliably.

  However, to be fair, the best case for the platform bet is that it offers the only realistic shot at a cure within the 20-year timeline, and if it works, it would be transformative. The portfolio strategy, by design, does not aim for a cure and might leave the foundation without a path to achieving its ultimate goal.

  Now, let's draft the opinion.
answer: |-
  ### Memorandum to the Board of Trustees  
  **From:** [Your Name], Trustee  
  **Subject:** Recommendation on Five-Year Research Strategy and Risk-Weighted Impact Rule  
  **Date:** October 1, 2023  

  #### Recommendation  
  I recommend that the board adopt the **portfolio strategy** for our next five-year grantmaking cycle. I further recommend that we **do not adopt** the proposed risk-weighted impact scoring rule at this time, as it introduces unnecessary complexity without resolving the core ethical dilemma we face. This decision should be revisited in our next strategic review, scheduled for October 2030, when we reassess progress toward our 20-year mission. For immediate action, I propose the following resolution:  

  > *Resolved, that the foundation commits its next five years of funding to the portfolio strategy, distributing grants across approximately forty laboratories for incremental improvements in supportive care, diagnostics, and repurposed compounds; and further resolved, that the board declines to implement the risk-weighted impact rule for scoring strategic options, pending a review of its practical and ethical implications in 2030.*  

  This resolution prioritizes near-term, reliable benefits for patients while preserving flexibility for future high-impact bets. Below, I explain this recommendation by addressing the key questions before us, including the objections to the platform bet, the defensibility of the risk-weighted rule, and the stakes for patients and trustees.  

  #### 1. The Risk-Weighted Rule: A Formalization of Mistake or Defensible Tool?  
  The risk-weighted rule proposed by our colleague adjusts probabilities to overweight bad outcomes and underweight good ones via an exponent \(c \geq 1\). At \(c = 1\), it reduces to expected impact (our current metric). As \(c\) increases, it inflates the perceived likelihood of worst-case scenarios. Our colleague argues this captures the trustees’ aversion to catastrophic failure, especially since patients—unlike the foundation—cannot “absorb” a loss.  

  However, this rule violates a fundamental principle of rational decision-making: the *independence of irrelevant alternatives*. Specifically, the ranking of two options can flip based on outcomes they don’t share, even when their relative performance in every state of the world is unchanged. Consider a simple example:  

  - **Option A:** 90% chance of 100 impact (e.g., modest gains), 10% chance of 0 impact (total failure).  
  - **Option B:** 100% chance of 50 impact (guaranteed moderate gains).  

  Under expected impact (\(c = 1\)), Option A scores \(90\) while B scores \(50\). But with \(c = 2\), the risk-weighted rule distorts probabilities. For Option A, the worst outcome (0 impact) receives a weight of \(0.9^2 - 0^2 = 0.81\) (not 0.10), while the best outcome (100) gets \(1^2 - 0.9^2 = 0.19\) (not 0.90). Thus, Option A’s score becomes \((0.81 \times 0) + (0.19 \times 100) = 19\). Option B, with one outcome, remains at 50. The rule now ranks B above A, reversing the expected-impact ranking.  

  Is this reversal defensible? Only if we believe the mere *possibility* of failure (even at 10%) is so intolerable that it warrants treating Option A as if failure were 81% likely. In our context, this overweights the catastrophic "nothing" outcome of the platform bet (staff estimate >50% chance of no clinical benefit) and underweights its potential cure (12.5% chance). But this distorts reality: patients face the *actual* probabilities, not weighted ones. The rule effectively allows trustees to impose their risk preferences by altering probabilities, which conflates empirical uncertainty (what staff estimated) with ethical values (how we weigh outcomes). This is a mistake—it disguises value judgments as technical adjustments.  

  #### 2. Can the Trustees’ Caution Be Captured by a Concave Impact Scale?  
  Yes. The objecting trustees’ core concern—that we should avoid gambling on a long shot while patients suffer—is better described by applying expected impact to a *concave* (diminishing-returns) impact scale. For instance, if we value incremental gains (e.g., better diagnostics) more than we value proportional increases toward a cure (e.g., because small benefits reach more patients faster), we can rescale impacts to reflect this.  

  Suppose our foundation’s impact scale is linear today (e.g., a cure = 100, modest gains = 10). Under the platform bet, expected impact is \( (0.125 \times 100) + (0.5 \times 5) + (0.375 \times 0) = 15 \) (assuming a 12.5% cure chance, 50% chance of partial gains scoring 5, and 37.5% chance of nothing). The portfolio scores \( (0.9 \times 10) + (0.1 \times 0) = 9 \) (90% chance of modest gains, 10% chance of minor setbacks). Staff’s slight preference for the platform bet (15 vs. 9) depends on debatable probabilities.  

  But if we apply a concave rescaling—e.g., impact = √(original impact) to model diminishing returns—the portfolio becomes \( 0.9 \times \sqrt{10} ≈ 0.9 \times 3.16 = 2.84 \), while the platform bet becomes \( (0.125 \times \sqrt{100}) + (0.5 \times \sqrt{5}) + (0.375 \times \sqrt{0}) ≈ (0.125 \times 10) + (0.5 \times 2.24) = 1.25 + 1.12 = 2.37 \). Now the portfolio leads (2.84 > 2.37). This captures the trustees’ view: small, certain gains are disproportionately valuable under time pressure, and a cure’s high absolute impact doesn’t justify its low probability. Crucially, this avoids manipulating probabilities. It is transparent, auditable, and reflects our values directly.  

  The risk-weighted rule is unnecessary because it cannot separate cases where probabilities are contested estimates. Staff admit the platform bet’s ranking flips with small probability changes—yet the risk-weighting exacerbates this by adding another subjective parameter (\(c\)). With both probabilities and \(c\) disputed, the rule invites arbitrariness.  

  #### 3. Level of Aggregation: Why It Matters  
  The risk-weighted rule must be applied to the *entire strategy*, not individual grants, because weights depend on the full distribution of outcomes. For example, the portfolio’s diversification ensures no single grant’s failure is catastrophic. But if we applied the rule to each grant separately (e.g., weighting a 1% failure chance as if it were 10% when \(c=2\)), we would overpenalize every small risk, making diversification appear worse than it is. Conversely, applying it only at the strategy level hides how risks interact.  

  This aggregation problem forces the board to choose: do we evaluate strategies holistically, or grant by grant? Holistic evaluation aligns with our mission (20-year outcomes), but it requires reliable probability estimates for complex, interdependent research paths—which staff acknowledge are fragile. Grant-level evaluation is simpler but ignores systemic risks. Since the risk-weighted rule compounds these issues, rejecting it simplifies our decision. For the portfolio, aggregation is less critical: modest gains are likely even if some grants fail.  

  #### 4. Who Bears the Risk and Regret?  
  Patients bear the risk: if the platform bet fails, five years are lost, and suffering progresses. Trustees bear only regret—embarrassment for a failed gamble. The objecting trustees’ reluctance is an understandable emotional response to this asymmetry, but it should not be mistaken for an ethical imperative. Patients cannot wait for perfect options, yet a 12.5% chance of a cure is not a reliable lifeline. The portfolio guarantees tangible benefits, building momentum and trust. Conversely, discounting trustees’ risk aversion as mere “bias” undervalues their fiduciary duty to steward resources wisely. The balance here favors reliability: the portfolio’s near-certain gains align with our duty to deliver now, not gamble on a future that may not come.  

  #### The Best Case for the Platform Bet  
  Advocates for the platform bet argue persuasively that the portfolio strategy, while safe, may condemn us to incrementalism in a race against time. Our mission is not merely to ease symptoms but to halt this disease within 20 years. The platform bet, despite its risks, is the only option offering a plausible path to a cure. If it succeeds, it could transform thousands of lives, making the 12.5% chance a moral imperative. As one trustee put it: “We are not a charity for marginal improvements; we are a foundation aimed at eradication.” Rejecting this bet might spare us regret but could consign patients to a preventable fate. This view honors the urgency of our mission and the courage to aim high.  

  #### Conclusion  
  I recommend the portfolio strategy because it delivers measurable benefits to patients in the critical near term, respects the fragility of probability estimates, and avoids the distortions of the risk-weighted rule. The platform bet’s appeal is undeniable, but its risks are too great when balanced against lives in the balance. By choosing the portfolio, we honor both our duty to act now and the need to preserve hope: success in incremental steps could accelerate the path to a cure later.  

  We should revisit this approach in 2030. By then, data from the portfolio may reveal new opportunities for targeted bets, and if the risk-weighted rule proves useful elsewhere, we can reassess it with evidence. For now, let us vote for certainty, transparency, and immediate impact.  

  Respectfully,  
  [Your Name]  

