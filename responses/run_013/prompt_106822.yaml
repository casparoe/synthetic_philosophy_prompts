  Alternatively, let me use a logarithmic utility: U(Δ) = ln(1+Δ) for Δ>-1. But then we require Δ>-1.

  To avoid complications, let me assume the agent has a utility function U(Δ) = Δ - 0.1*Δ^2 for the net change in wealth Δ. This function is concave (since the second derivative is -0.2, which is negative) and defined for all Δ.

  Now, compute the expected utility of each bet for the agent with credences c(E)=0.6, c(not-E)=0.6.

  For Bet 1:
     - If E occurs: net gain = £0.40, utility = 0.40 - 0.1*(0.40)^2 = 0.40 - 0.016 = 0.384
     - If not-E occurs: net gain = -£0.60, utility = -0.60 - 0.1*(-0.60)^2 = -0.60 - 0.036 = -0.636
