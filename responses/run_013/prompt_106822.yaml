  (d) The Dutch book argument, in its standard form, relies heavily on the specific assumptions of forced betting on any individually favorable bet and linear utility. When these assumptions are relaxed, an agent with non-probabilistic credences may avoid Dutch books. This suggests that the argument does not establish probabilism as a universal requirement of practical rationality. Instead, it shows that probabilism is a requirement for avoiding sure loss in a very specific context: when the agent is compelled to accept every bet that she evaluates as non-negative in expected monetary value. Therefore, the Dutch book argument might be best understood as a pragmatic constraint in a particular betting model rather than a general rationality norm.

