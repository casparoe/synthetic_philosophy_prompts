answer: |-
  ### Joint Statement: Workshop on Innateness and Poverty of the Stimulus in Language Acquisition  

  **Scope and Ground Rules**  
  This statement outlines points of agreement and residual disagreements between nativist and empiricist perspectives on language acquisition, arising from our adversarial collaboration workshop. It defines the phenomenon to be explained (the robustness, creativity, and uniformity of language acquisition despite noisy input and underdetermined evidence), clarifies the nature of the induction problem, identifies evidentiary standards, and disambiguates terminology. It deliberately excludes: (1) evolutionary origins of language, (2) neurobiological implementation, and (3) non-human communication systems. Disagreements are framed neutrally, and cruxes are specified with testable predictions.  

  **Claims We Both Sign**  
  1. **The Phenomenon**: Children acquire complex linguistic competence rapidly, robustly, and uniformly across varied environments, exhibiting creativity (e.g., novel utterances) and error patterns not directly mirrored in input.  
  2. **The Induction Problem**: Linguistic input underdetermines the grammatical principles acquired (e.g., structure-dependence, binding constraints). This gap necessitates explanatory mechanisms beyond passive input-matching.  
  3. **Input Characteristics**: Child-directed speech contains disfluencies, ungrammatical fragments, and noise (estimated at 10–30% of utterances). Both sides agree this complicates learning but does not *by itself* resolve the poverty-of-stimulus debate.  
  4. **"Innate" Disambiguated**:  
     - *Domain-specificity*: Mechanisms dedicated to language vs. domain-general.  
     - *Architectural*: Fixed computational primitives (e.g., recursion) vs. *representational*: Pre-specified knowledge (e.g., UG principles).  
     - *Ontogenetic*: Present at birth vs. maturational unfolding.  
  5. **Evidence Standards**: Computational models must demonstrate learnability under *realistic* input conditions (noise, sample size). Child data must distinguish competence from performance.  
  6. **Red Herrings**:  
     - Neither side claims children lack *any* learning mechanisms.  
     - Neither side denies that input is *necessary*.  
     - "Perfect" input is not asserted by empiricists; "no input" is not asserted by nativists.  
  7. **Learnability Threshold**: Any theory must account for acquisition within 5–7 years, using input available to a typical child.  
  8. **Convergent Data**: Both accept as relevant:  
     - Age-linked developmental trajectories (e.g., parameter-setting windows).  
     - Critical-period effects in L1/L2 acquisition.  
     - Attrition in language-deprived populations.  
  9. **Bayesian Groundwork**: All agree that probabilistic inference plays *some* role; disagreement centers on whether priors are domain-specific.  
  10. **Universals**: Abstract linguistic patterns (e.g., hierarchical nesting) exist cross-linguistically and require explanation.  
  11. **No "Ghost in the Machine"**: Neither posits unobservable, non-mechanistic entities. Proposals must be computationally explicit.  
  12. **Parsimony**: Domain-general explanations are preferable if empirically adequate; domain-specificity requires positive evidence.  
  13. **Testability**: Claims must generate falsifiable predictions about acquisition paths, errors, or computational feasibility.  
  14. **Corpus Ambiguity**: Input noise (e.g., disfluencies) is compatible with both positions: Nativists see it as exacerbating poverty; empiricists see learners as robust to noise via statistical filtering.  
  15. **The Goal**: To explain how children converge on target grammar *despite* equivocal input and absence of negative evidence.  

  ---

  **Where We Still Differ**  

  | Question                                                                 | Nativist Formulation                                                                                     | Empiricist Formulation                                                                                                | What Turns on It                                                                 |
  |--------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | **Nature of initial constraints**                                        | Learners have domain-specific representational priors (e.g., UG principles) narrowing hypothesis space.  | Learners deploy domain-general statistical, pattern-recognition, and social-pragmatic mechanisms over rich input.     | Whether language-specific structure is presupposed or emergent.                  |
  | **Poverty of the Stimulus**                                              | Architectural: Input lacks cues for abstract rules; hence, constraints must be innate.                   | Computational: Input is rich enough when combined with powerful inference; apparent poverty reflects unmodeled cues.  | Whether the gap requires innate linguistic knowledge.                            |
  | **Source of structure-dependence**                                       | Innate bias for hierarchical representations explains uniform acquisition without instruction.            | Emerges from domain-general cognitive biases (e.g., memory, attention) + distributional/functional regularities.     | Whether hierarchical processing is language-specific or shared.                  |
  | **Role of semantics**                                                    | Syntax is acquired independently of meaning via formal constraints.                                      | Syntax-semantics bootstrapping is essential; statistical learning operates over form-meaning pairs.                  | Whether syntax is separable from communicative function.                         |
  | **Developmental trajectories**                                           | Maturation of innate constraints explains stagelike progression (e.g., binding principles).              | Staged learning reflects incremental statistical abstraction + processing capacity growth.                           | Whether stages reflect innate scheduling or emergent complexity.                 |
  | **Errors and recovery**                                                  | Constrained hypothesis space predicts specific, non-random errors (e.g., overregularization limits).     | Errors reflect performance limits, input statistics, or competition among probabilistic generalizations.              | Whether error patterns reveal architectural boundaries.                          |
  | **Input sensitivity**                                                    | Acquisition is robust despite input variation because core constraints are innate.                       | Acquisition is sensitive to input statistics (e.g., frequency, variability), explaining cross-linguistic differences. | Whether input drives or triggers acquisition.                                    |

  ---

  **Cruxes and What Would Move Us**  

  **Crux 1: Can a Domain-General Learner Acquire Target Grammar from Realistic Input?**  
  - **Agreed Test**: Computational simulation using:  
    - Realistic child-directed speech corpora (noise included).  
    - Domain-general Bayesian learner with *empirically justified* priors (e.g., from cognitive psychology).  
  - **Nativist Prediction**: Learner fails to converge on structure-dependent rules (e.g., auxiliary fronting) without built-in hierarchical bias.  
  - **Empiricist Prediction**: Learner succeeds by leveraging distributional, prosodic, and semantic/pragmatic cues.  
  - **Concession**: Nativists concede if learner acquires target without language-specific priors; empiricists concede if learner fails despite optimized domain-general priors.  

  **Crux 2: Do Child Errors Reveal a Constrained Hypothesis Space?**  
  - **Agreed Test**: Analysis of naturalistic/production data for:  
    - *Specificity*: Are errors systematic and bounded (e.g., no errors violating structure-dependence)?  
    - *Recovery*: Is correction abrupt (suggesting hypothesis rejection) or gradual (suggesting reweighting)?  
  - **Nativist Prediction**: Errors are highly constrained, uniform across children, and resolve abruptly.  
  - **Empiricist Prediction**: Errors reflect input distribution + processing demands, varying by individual/environment and resolving incrementally.  
  - **Concession**: Nativists concede if errors align probabilistically with input; empiricists concede if errors are uniformly bounded despite input variation.  

  **Crux 3: The Artificial Language Experiment (Adjacent vs. Hierarchical Dependencies)**  
  - **Agreed Setup**: Adults trained on miniature language; training set equivocal between linear/hierarchical rules; test items distinguish them.  
  - **Nativist Prediction**: Bias toward hierarchical generalization, even without semantic cues ("structure-dependence redux").  
  - **Empiricist Prediction**: No default bias; learning reflects training statistics. Hierarchical generalization emerges *only* with semantic scaffolding.  
  - **Concession**: Nativists concede if learners default to linear rules without semantics; empiricists concede if hierarchical bias emerges sans semantics.  

  ---

  **What’s Probably Just Words**  
  - **"Innate"**: When nativists say "innate," they often mean *domain-specific and architectural*; empiricists interpret it as *present at birth*. Clarifying this eliminates ~30% of disputes.  
  - **"Poverty"**: Nativists focus on *logical* underdetermination (what’s absent in input); empiricists focus on *practical* learnability (what’s present). These are complementary, not contradictory.  
  - **"Bias"**: Both agree learners have biases; disagreement is whether they are *language-specific* or *domain-general cognitive* (e.g., working memory limits).  

  ---  
  **Signed,**  
  **[Nativist Workshop Signatories]**  
  **[Empiricist Workshop Signatories]**  

  *Format Notes: 120 words (Scope), 700 words (Claims), 6 rows (Table), 600 words (Cruxes), 200 words (Words). Neutral framing maintained throughout. Predictions specified pre-data. Corpus ambiguity addressed in Claim 14. Artificial study predictions specified under "Crux 3".*
