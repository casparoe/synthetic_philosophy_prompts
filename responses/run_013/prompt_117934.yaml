prompt: |-
  An argument that a colleague has been pressing on me seems to prove more than it should, and I cannot locate the fault. Here it is, in his steps.

  (1) Presentism: only present things exist.
  (2) Every true proposition has a truthmaker — something that exists and makes it true.
  (3) So whatever makes a proposition true must exist now.
  (4) The only thing that could make 'there will be a frost tomorrow' true is a frost tomorrow, which does not exist yet.
  (5) So nothing makes that proposition true; by (2), it is not true.
  (6) Hence no proposition about the future is true, and the future is open — the result presentists usually want.
  (7) By the same reasoning, the only thing that could make 'there was a frost yesterday' true is yesterday's frost, which no longer exists.
  (8) So no proposition about the past is true either, and the past is as open as the future.
  (9) The past is settled. Therefore presentism is false.

  Steps (4) and (7) look exactly parallel to me, and yet (7) and (8) prove far too much. I would rather keep (1) and (9) than (2). Tell me which step to reject, why it looked acceptable, and what rejecting it costs — in particular, whether a presentist can keep an open future without conceding the same about the past. Lead with the step you reject, and keep the whole reply under 400 words.
reasoning: |-
  We are given an argument that leads from presentism (1) and truthmaker principle (2) to the conclusion that neither future nor past propositions are true, which contradicts the settledness of the past. We must reject one step to avoid the absurdity.

  Step to reject: (4) and (7) are both problematic, but the core issue lies in the truthmaker principle (2) as applied to tensed statements. However, note that the argument relies on the specific truthmakers assigned in (4) and (7). Alternatively, we might challenge (2) itself, but let's see.

  Alternatively, note that (4) says: "The only thing that could make 'there will be a frost tomorrow' true is a frost tomorrow". But why must that be the only truthmaker? Similarly for (7). A presentist might posit present entities as truthmakers for past and future truths. For example, the present state of the world might include traces of the past (like memories, records, etc.) and signs of the future (like current conditions that will lead to frost). Thus, we can reject step (4) and (7) by denying that the only possible truthmaker for a future proposition is the future event itself, and similarly for the past.

  But note: the problem is that the presentist wants to keep the future open (so future contingents are not true) but the past settled (so past truths are true). Therefore, we must have a truthmaker for past truths but not for future ones.

  Thus, the presentist must distinguish between past and future in the truthmaker principle. One way is to hold that present entities can serve as truthmakers for past truths (e.g., present evidence or traces) but not for future ones (because the future is not determined). This breaks the symmetry.

  So, we can reject the symmetry in the truthmakers for past and future. Specifically, we reject step (7) as it stands because we can have a present truthmaker for the past proposition (for example, the present state of the world that is a causal consequence of the past frost). But step (4) is acceptable because the presentist does not want a truthmaker for future contingents (so that they are not true). However, note that step (7) is analogous and if we break the symmetry we must explain why.

  Alternatively, we might reject the truthmaker principle (2) for propositions about the future, but retain it for the past. But that seems ad hoc.

  A better way is to reject the specific claims about what the truthmakers must be in (4) and (7). The argument assumes that the only truthmaker for a proposition about a past event is the past event itself, and similarly for the future. But the presentist can say that for past truths, the truthmaker is a present entity (like a trace), but for future truths, there is no present truthmaker because the future is open. Thus, step (7) is incorrect because it assumes the only truthmaker for a past proposition is the past event. Instead, the truthmaker for 'there was a frost yesterday' is some present entity (e.g., the frost damage on my plants). But step (4) is correct because there is no present entity that can serve as a truthmaker for a future contingent event (if the future is open). Thus, the past proposition can be made true by a present truthmaker, but the future one cannot.

  Therefore, we reject step (7) as stated because it ignores that present entities can make past-tensed propositions true. The cost is that we must develop an account of what present entities serve as truthmakers for past truths. We also maintain step (4) for future contingents, which aligns with the open future.

  So, the step to reject is step (7). It looked acceptable because it seems that a past event is the most direct truthmaker for a proposition about that event. But rejecting it costs the presentist the burden of providing present truthmakers for every past truth. However, this is a common move in presentist theories (e.g., using ersatz times, traces, etc.). And it allows the presentist to keep the future open without making the past open.

  Final answer: Reject step (7). Why it looked acceptable: It seems intuitive that a past event is the truthmaker for a past-tense proposition. What rejecting it costs: The presentist must provide present truthmakers for past truths, which may be challenging but is a known burden. And yes, a presentist can keep an open future without conceding the same about the past by holding that present entities ground past truths but not future ones.
answer: |-
  **Reject step (7).**  

  It claims that the only possible truthmaker for "there was a frost yesterday" is the no-longer-existent frost itself. This ignores that presentists can posit *present entities* as truthmakers for past truths, such as current evidence (e.g., frost-damaged crops), memories, or records. These exist now and ground past truths, preserving the past's settledness.  

  **Why it looked acceptable:**  
  The parallel between (4) and (7) is superficially compelling. Both seem to require the event itself (future/past) as the sole truthmaker. However, this assumes no distinction between how past and future truths are grounded.  

  **Cost of rejection:**  
  Presentists must provide plausible present truthmakers for *all* past truths, which may require complex metaphysics (e.g., abstracta or traces). Yet this cost is manageable and aligns with presentist literature. Crucially, rejecting (7) allows presentists to maintain an open future (by accepting step 4’s lack of present truthmakers for future contingents) without erasing the past’s determinacy. This asymmetry preserves core presentist goals.  

