  The non-negotiable core probably includes:
  - Transitivity's intuitive plausibility in simple cases
  - Minimal dominance (if A dominates B in all respects, A>B)
  - Comparability's practical necessity for decision-making

  But these clash viciously in spectrum cases. I suspect minimal dominance is the linchpin – surrendering it makes betterness unrecognizable, yet it forces sharp cutoffs in continua. The Sorites framing helps: like "heap", "better than" may lack sharp boundaries when differences are vanishingly small. 

  On their three candidate issues:
  1) Spectrum as comparative Sorites: compelling but risks conflating epistemic uncertainty with metaphysical indeterminacy. Probably should be a negotiable requirement about handling vagueness.
  2) Respect-relativity: this feels indispensable. The care ladder's tradeoffs (safety vs autonomy) demand multidimensional treatment. Non-negotiable that a theory must specify whether transitivity applies to all-things-considered or only respect-relative betterness.
  3) Parity: treating it as distinct from incomparability could resolve some cases (e.g. fellowship applications differing incommensurably). But adds complexity. Mark as negotiable.

  For practical implications, they need permission to:
  - Use semi-arbitrary tiebreakers when parity occurs
  - Reject false precision in rankings
  - Make context-sensitive choices without full comparability

  The closing assessment of strategies should favor transitivity+premise rejection (e.g. denying strict monotonic improvement in care ladder) as least disruptive, though vagueness approaches have merit. Full transitivity abandonment seems too costly for decision theory coherence.

  Most valuable insight: minimal dominance as the killer requirement that forces spectrum paradoxes. Any adequate theory must either limit its scope or accept sharp cutoffs.
answer: |-
  Here are the desiderata for an adequate account of "better than," structured to address your cases and requirements. Each includes motivation, negotiability status, and interactions. The most consequential tension is highlighted in **Section VI**.

  ---

  ### **I. Formal Structure Requirements**  
  1. **Asymmetry**: If A is better than B, B is not better than A.  
     *Motivation*: Fundamental to comparison; violating it implies A and B could be simultaneously better/worse than each other, collapsing rational choice (e.g., in fellowship pairwise judgments, unanimity presumed asymmetry).  
     *Status*: Non-negotiable.  

  2. **Irreflexivity**: Nothing is better than itself.  
     *Motivation*: Self-evident for coherent preference; trivial but foundational.  
     *Status*: Non-negotiable.  

  3. **Transitivity**: If A is better than B and B is better than C, then A is better than C.  
     *Motivation*: Necessary for consistent ranking (e.g., without it, fellowship shortlists could cycle infinitely).  
     *Status*: *Negotiable*. Spectrum cases challenge it directly.  

  ---

  ### **II. Empirical Adequacy Requirements**  
  4. **Spectrum Monotonicity**: For adjacent items in a spectrum (e.g., care ladder rungs), each minor improvement must be recognizably better than its predecessor.  
     *Motivation*: Your care ladder case—each step increased supervision incrementally and was judged superior to the prior step.  
     *Status*: Non-negotiable (denying this invalidates lived experience).  

  5. **Non-Arbitrariness**: No sharp cutoff where a tiny change flips "better" to "worse."  
     *Motivation*: Spectrum cases lack a clear boundary (e.g., no exact rung where care becomes "worse" overall).  
     *Status*: Non-negotiable.  

  6. **Comparability**: Any two options can be compared (better, worse, equal, or incomparable).  
     *Motivation*: Decision contexts (e.g., fellowship panels, care choices) demand pairwise assessments.  
     *Status*: *Negotiable*; incomparability might resolve cases.  

  ---

  ### **III. Phenomenological Requirements**  
  7. **Respect-Relativity Distinction**: Must clarify whether "better than" is *all-things-considered* (ATC) or *respect-relative* (e.g., safety vs. autonomy in care).  
     *Motivation*: Your cases involve multidimensional tradeoffs (fellowship: creativity vs. rigor; care: safety vs. independence).  
     *Status*: Non-negotiable. Theory must specify which relation transitivity applies to.  

  8. **Parity Recognition**: Must accommodate *parity*—distinct from equality/incomparability—where A and B are comparable but neither better nor worse, and not equally good (e.g., fellowship applications excelling in different virtues).  
     *Motivation*: Explains why pairwise judgments felt sound yet resisted a total order.  
     *Status*: *Negotiable*; some theories reduce parity to vagueness.  

  9. **Vagueness Accounting**: If "better than" is vague, theory must explain how marginal changes (e.g., care ladder) avoid Sorites collapse.  
     *Motivation*: Spectrum cases suggest borderline zones where "better" lacks clear application.  
     *Status*: *Negotiable*; could be epistemic (unknowability) or metaphysical (indeterminacy).  

  ---

  ### **IV. Decision-Theoretic Constraints**  
  10. **Minimal Dominance**: If A is better than B in some respects and worse in none, A is ATC better.  
     *Motivation*: Core to rational choice (e.g., a care rung improving safety without autonomy loss *should* be better).  
     *Status*: Non-negotiable.  

  11. **Weighting Consistency**: If a scoring system (e.g., fellowship points) contradicts unanimous intuitive judgments, it is inferior.  
     *Motivation*: Your panel’s rejection of the weighted score as "worse" than direct comparisons.  
     *Status*: Non-negotiable for adequacy to judgment.  

  ---

  ### **V. Interactions and Tensions**  
  - **Transitivity + Spectrum Monotonicity + Non-Arbitrariness → Comparability Failure**:  
    In a spectrum (A₁ better than A₂, ..., Aₙ better than A₁), these jointly imply a cycle, violating transitivity.  
    *Resolution*: Surrender **Transitivity** for ATC betterness (retaining it for respect-relative), *or* allow **incomparability** between distant spectrum points.  
  - **Parity + Transitivity**: If parity is transitive, cycles persist; if not, "better than" may still lack a total order.  

  ---

  ### **VI. The Core Inconsistency & Key Exclusionary Requirement**  
  **The Inconsistent Set**:  
  - Transitivity (3)  
  - Spectrum Monotonicity (4)  
  - Non-Arbitrariness (5)  
  - Comparability (6)  

  **Outcome**: These *cannot jointly hold* in spectrum cases.  
  - **Must surrender**: **Transitivity** (for ATC "better than") or **Comparability** (accept incomparability between endpoints).  
  - **Most exclusionary requirement**: **Non-Arbitrariness**. It forces theories to deny sharp cutoffs, excluding:  
    - "Crisp" transitive orders (violate monotonicity/arbitrariness).  
    - Simple vagueness models (risk Sorites collapse).  
    - Theories reducing spectrum to indexicality ("better for context X").  

  ---

  ### **VII. Implications for Choice**  
  When ordering fails:  
  1. **Blame the demand, not the options**: Your cases suggest options *resist* ranking, implying a defect in expecting a total order.  
  2. **Permissible responses**:  
     - **Fellowship**: Rank using respect-relative criteria (e.g., "best on originality"), or acknowledge parity and split fellowships.  
     - **Care ladder**: Choose based on thresholds (e.g., "minimal safety required"), not optimization.  
  3. **Action without transitivity**:  
     - Pairwise comparisons suffice for stepwise choices (e.g., moving father one rung up).  
     - For non-adjacent comparisons (bottom vs. top), treat as incomparable or parity-ridden.  

  ---

  ### **VIII. Assessing Familiar Moves**  
  - **Hold transitivity, reject a premise**: Viable only by denying **Spectrum Monotonicity** (e.g., "some care steps are *not* better")—contradicts your experience.  
  - **Deny transitivity**: Best preserves monotonicity and non-arbitrariness but complicates decision theory (e.g., money-pump risks).  
  - **Treat "better than" as vague**: Explains spectrum but struggles with parity; may concede arbitrariness in borderline cases.  

  **Strongest survivor**: **Denying transitivity for ATC betterness** (while keeping it for respect-relative comparisons). This respects phenomenology, avoids arbitrariness, and allows rational stepwise action. Parity or vagueness can handle residue.  

  ---  
  This list prioritizes grounding in your cases while exposing fault lines. For decision contexts, the path forward is to **use local comparability pragmatically** without insisting on global order.
