prompt: |-
  Before a reading group next month I've been asked to write up where I actually stand on consequentialism so the others can attack it, and I'd rather find the weak joints myself than have them found for me in public. Here is the package as I'd state it. (1) The rightness of an action is fixed by the consequences it actually has, not by what the agent foresaw or had reason to believe. (2) For nearly any decision I face, the downstream consequences of the options ramify so far, and through causal chains so long and so entangled with other people's choices, that I have no real basis for assigning credences to the relevant outcomes; my honest state is cluelessness rather than uncertainty with well-defined probabilities. (3) A moral theory has to be action-guiding: it cannot be that I ought to do something when no one, not even an ideal reasoner in my position, could have worked out that I ought to. (4) All the same, I am confident that giving a serious fraction of my income to the most effective global-health charities is required, and that spending the same money on a nicer flat instead is at least mildly wrong; I don't think that verdict is hostage to philosophy. (5) Where options are comparable at all, I maximize expected welfare on my credences, and I don't think moral uncertainty licenses any special hedging beyond folding it into that calculation. (6) I won't accept the usual rescue, which says: stop calculating and simply follow the rules or institutions that tend to go well, because whether a rule tends to go well is itself exactly the kind of cluelessness-laden empirical question at issue.

  What I want is an audit rather than a verdict on consequentialism as such: which of these pull against each other, which pairs only look like they conflict, and for each real conflict which commitment has to give and what that costs. Rank the conflicts by severity rather than listing them all as equally bad, and say which single revision would clean up the most, since I suspect some of these are cheaper to fix than they look and others much more expensive. I also don't know this literature as well as I should, so please separate what is settled among people who work on it from what is genuinely contested — in particular I don't want a contested assessment of how damaging the cluelessness problem really is handed to me as though it were the consensus.
reasoning: |-
  Okay, the user is preparing for a reading group on consequentialism and wants to audit their position to identify weaknesses before others critique it. They've outlined six points that form their stance. Let me unpack their main concerns.

  First, they hold that actual consequences determine rightness, not foreseen ones. But they also admit to cluelessness about predicting outcomes due to complex causal chains. This seems contradictory because if they can't predict consequences, how can actual consequences guide actions? 

  Then they insist morality must be action-guiding, meaning obligations should be knowable. But with cluelessness, it's impossible to know what actually has the best results. So points 1, 2, and 3 clash. The user is confident about donating to effective charities, but how does that square with cluelessness? Maybe they rely on empirical evidence from organizations like GiveWell, but point 6 rejects rule-following solutions. 

  Point 5 mentions maximizing expected welfare with credences, but point 2 says they have no well-defined probabilities. So which is it? If they're truly clueless, expected welfare maximization isn't feasible. The charity example might work because some cases have clearer evidence, but complex decisions don't. 

  The user wants conflicts ranked by severity. The action-guidance vs. actualism conflict seems most critical because it challenges the coherence of their theory. The charity example might be salvageable by accepting institutional knowledge, but they reject that in point 6. 

  They also need settled vs. contested issues noted. Cluelessness's severity is contested; some think it's manageable, others see it as a major flaw. Highlighting this helps the user avoid presenting a contested view as consensus. 

  Underlying needs: They want to preempt critiques, showing they've considered weaknesses. They might fear public criticism and value intellectual rigor. Also, they seek practical ethics alignment (donating) without theoretical compromise. Balancing theory with practice is key here. 

  Possible revisions: Softening actualism to include foreseeable consequences or accepting institutional rules despite point 6. The former might resolve the action-guidance issue. The charity stance could be framed as a practical heuristic, not a theoretical claim. Acknowledging cluelessness but using best available evidence for decisions might bridge points 2 and 5. 

  Prioritizing revisions: Addressing the action-guidance conflict first would clean up multiple issues. Clarifying when expected welfare applies (when credences exist) versus other strategies in clueless scenarios could help. Point 6's rejection of rules might need rethinking if institutions provide actionable guidance amidst uncertainty.
answer: |-
  Here's an audit of your package, ranking conflicts by severity, identifying settled/contested points, and suggesting the most efficient revision:

  ### Ranked Conflicts (Most Severe First)
  1.  **Conflict: (1) Actual Consequences + (2) Radical Cluelessness vs. (3) Action-Guidance**
      *   **Nature:** This is the core tension. If rightness depends solely on *actual* consequences (1), and we are radically clueless about them (2), then we *cannot know* what the right action is. This directly violates the requirement that morality must be action-guiding (3). An "ideal reasoner" in your position, faced with radical cluelessness, would have no way to determine the actual-consequence-optimizing action. This makes "ought" implies "can know" impossible under your (1)+(2).
      *   **Settled/Contested:** The *logical conflict* between strong Actualism (1) + Radical Cluelessness (2) + Action-Guidance (3) is widely accepted as a genuine problem. The *severity of cluelessness* (point 2) is **highly contested**. Some (e.g., Lenman, Gardiner) argue it's pervasive and devastating to consequentialism. Others (e.g., advocates of Effective Altruism methodology, some utilitarians) argue it's often manageable through empirical research, expected value reasoning (even under uncertainty), and focusing on robustly positive interventions.
      *   **Cost of Resolution:** High. You must significantly weaken one of the three. Abandoning (1) is philosophically costly (moving from Actual to Expected/Foreseeable consequences). Abandoning (3) is practically/morally costly (admitting morality can demand the unknowable). Mitigating (2) requires showing cluelessness isn't as radical as claimed for key decisions (contested).
      *   **Which Gives?** (1) Actualism is the most common and efficient candidate for revision here. Moving to Expected Consequences (given evidence/credences) or Reasonably Foreseeable Consequences resolves the conflict with (3) while still honoring the spirit of consequentialism. Alternatively, you could significantly qualify (2), arguing that for *some* decisions (like charity), cluelessness is tractable enough.

  2.  **Conflict: (2) Radical Cluelessness vs. (5) Maximize Expected Welfare & (4) Charity Verdict**
      *   **Nature:** If you are radically clueless (2), you lack well-defined credences over outcomes. But (5) requires maximizing expected welfare *using your credences*. If you have no credences, or only vague, indeterminate ones, (5) cannot be applied. How then can you justify your strong confidence in (4)? Your conviction about charity effectiveness *presupposes* that you *do* have meaningful credences sufficient to make that comparative judgment, contradicting the radical cluelessness claim for this domain.
      *   **Settled/Contested:** The incompatibility of radical cluelessness (no credences) with standard expected utility maximization (requires credences) is logically settled. The *extent* to which credences are possible/meaningful in complex real-world scenarios is contested (epistemic debates about deep uncertainty, ambiguity, Knightian uncertainty vs. risk).
      *   **Cost of Resolution:** Moderate-High. You must either:
          *   **Qualify (2):** Admit that while cluelessness is pervasive, it's *not absolute* for *some* tractable comparisons (like charity vs. luxury spending). You have *sufficiently well-defined* (though perhaps imprecise) credences based on evidence (e.g., RCTs for bednets, known costs of saving lives) to make these judgments. This preserves (4) and (5).
          *   **Revise (5):** Adopt a decision procedure for *deep uncertainty* where standard expected utility fails (e.g., Maximin, Minimax Regret, Satisficing, applying Robustness Analysis). This weakens (5) but acknowledges the limits of credences. However, it's unclear if these methods robustly support (4) – why would they *necessarily* favor charity?
      *   **Which Gives?** Qualifying (2) for specific domains like global health charity is the most efficient and common path, aligning with EA practice. It preserves the core of (4) and (5).

  3.  **Conflict: (1) Actual Consequences vs. (4) Charity Verdict & (5) Maximizing Expected Welfare**
      *   **Nature:** (1) says rightness depends on *actual* consequences. (4) and (5) are judgments/decision-procedures based on *expected* consequences (evidence, credences). It's logically possible that donating to what you *expect* is the most effective charity *actually* turns out disastrously (e.g., unforeseen negative effects, corruption). Conversely, buying the flat *might* accidentally trigger a chain of events saving thousands. (1) implies your charity donation could be *actually* wrong, and buying the flat *actually* right, despite your justified belief and the expected welfare calculation pointing the other way. This undermines the certainty of (4).
      *   **Settled/Contested:** This is a core, settled feature of Actual Consequentialism. Actualists (like Moore) explicitly accept this possibility. The *practical significance* is contested: Actualists argue we must still use expectations to *try* to hit the target; critics argue this divorces moral judgment too far from agency.
      *   **Cost of Resolution:** Low-Moderate (if abandoning actualism). High (if keeping actualism). If you keep (1), you must accept that (4) is a statement about what you *should believe* is required *based on your evidence*, not what *is* actually required. Your verdict is "hostage to philosophy" in the sense that its *actual* truth is contingent on unknowable future events. Revising (1) to Expected Consequentialism resolves this cleanly: (4) and (5) *define* what is required.
      *   **Which Gives?** (1) is the efficient point to revise, moving to Expected Consequentialism. This aligns perfectly with (4) and (5). Sticking with (1) requires weakening the certainty in (4) to "...is almost certainly required based on my best evidence" or "...is the best available guide to what is actually right."

  4.  **Tension: (6) Reject Rule/Institutional Rescue vs. (3) Action-Guidance & (4) Charity Verdict**
      *   **Nature:** This isn't a direct conflict, but a serious vulnerability. You reject rules/institutions because their *overall* consequences are subject to cluelessness (6). However, your confidence about charity (4) seems to rely *heavily* on the outputs of specific institutions (GiveWell, WHO data, RCT methodologies) and rule-like heuristics ("fund cost-effective health interventions"). If the cluelessness is truly radical (2), how can you be confident these institutions *aren't* systematically misleading or causing net harm in the vast complexity? Your rejection of rules/institutions as a solution seems to undermine the very basis of your non-philosophical confidence in (4).
      *   **Settled/Contested:** The difficulty of justifying *any* action-guiding principle under radical cluelessness is a settled challenge. Whether institutional evidence *can* overcome cluelessness for specific interventions is contested (the core EA debate).
      *   **Cost of Resolution:** Moderate. You need to clarify the *scope* of (2) and (6). Argue that while *assessing whole institutions/rules over the very long term* succumbs to cluelessness, *evaluating specific, measurable, near-term causal pathways* (e.g., bednet distribution -> reduced malaria deaths) is often possible with sufficient evidence. You rely on institutions for the latter, rejecting them only for the former grand assessment. This distinguishes micro-evidence from macro-cluelessness.
      *   **Which Gives?** Refine (6): "Stop calculating *grand long-term institutional consequences* and instead follow rules/institutions *based on their tractable near-term evidence for specific interventions*." This preserves your charity verdict's basis while rejecting the grand institutional consequentialism you find clueless.

  ### Only Apparent Conflicts
  *   **(5) Maximizing Expected Welfare vs. Moral Hedging:** You state folding moral uncertainty into the credence-based EW calculation is sufficient. This is a coherent position (defended by e.g., Sepielli, Gustafsson). The conflict is only apparent; you explicitly reject a *separate* hedging requirement. This is a defensible stance within the literature, though contested (e.g., by advocates of "maximizing choice-worthiness" under moral uncertainty).

  ### The Single Revision That Cleans Up the Most
  **Abandon (1) Actual Consequences in favor of Expected Consequences (given evidence/credences).**

  *   **Why:** It directly resolves Conflict 1 (Action-Guidance), Conflict 3 (vs. Charity Verdict/EW), and significantly alleviates Conflict 2 (by making EW maximization the *definition* of rightness, so having credences, however formed, becomes essential). It also reduces the tension in point 4 (Charity verdict directly reflects what is right). It leaves Conflict 2 primarily as an *epistemic* challenge ("Can we get good enough credences?") rather than a *logical* conflict within the moral theory. It's philosophically common (many modern consequentialists are Expected Consequentialists) and pragmatically aligns with your confidence in (4) and use of (5).

  ### Summary of Key Revisions & Costs
  1.  **Revise (1) Actual -> Expected Consequences:** (Recommended) Resolves core action-guidance conflict, aligns with (4) & (5), reduces tension with (6). *Cost:* Loses the intuitive "only actual results matter" purity; opens door to debates about evidence/credences.
  2.  **Qualify (2) Radical Cluelessness (Scope):** Necessary to preserve (4) & (5). Argue cluelessness is *not* total for tractable interventions like effective charity. *Cost:* Requires defending the tractability of specific empirical claims against cluelessness objections; risks ad-hocness.
  3.  **Refine (6) Reject Rules/Institutions:** Specify you reject relying on *grand long-term institutional consequences*, not necessarily using institutional evidence for *specific near-term interventions*. *Cost:* Requires careful distinction; may seem like accepting a limited form of rule-consequentialism.
  4.  **Clarify (4) Charity Verdict:** If keeping (1) Actualism, weaken (4) to express epistemic justification rather than actual rightness certainty. *Cost:* Weakens the strong moral conviction you want to maintain.

  Prioritize revising (1) to Expected Consequentialism. This provides the most coherent foundation. Then carefully qualify (2) and refine (6) to defend your confidence in effective giving and your rejection of grand institutional calculations. This package remains recognizably consequentialist, action-guiding, and committed to effective giving, while avoiding the crippling logical conflict between actualism, radical cluelessness, and action-guidance. Be prepared to defend the *tractability* of forming sufficient credences for key decisions against cluelessness objections – this is where the live philosophical and empirical debate lies.
