prompt: |-
  I teach philosophy at a university, and my own research is in moral and political philosophy; I have lately been asked to take the probability and induction unit of a general-education course, which is how I came upon a pattern I cannot name and am no longer confident is a single thing.

  Stated loosely, the pattern is this. A question about chance looks perfectly determinate until one notices that answering it requires a choice the question itself does not make, and that the candidate choices are all equally faithful to the question as posed. In each case the difficulty seems to be produced by the very feature that makes the question look answerable — the symmetry of the setup, or the thought that since nothing distinguishes the possibilities they must be treated alike.

  Three specimens, in what I take to be increasing order of distance from one another.

  First: a chord is drawn at random in a circle, and we ask for the probability that it is longer than the side of the inscribed equilateral triangle. Choose the chord's midpoint uniformly over the disk; or choose its direction and its distance from the centre independently; or choose its two endpoints independently on the circumference. Three procedures, three answers, and I cannot see that any of them misreads the instruction.

  Second: a point is chosen uniformly on a sphere, and I learn that it lies on a particular great circle. How is it distributed along that circle? The circle is one set of points, but the same set is an equator in one coordinate system and a meridian in another, and the two descriptions give different distributions along it. Here it is not that one parametrization is better than its rival; it is that the conditional probability has not yet been fixed.

  Third: the length of a coastline, measured with rulers of decreasing length, grows without bound. Nothing competes with anything here; the quantity simply has no value.

  I am not after a label. I want to know whether these three are one phenomenon wearing three faces or three distinct failures, what the correct diagnosis is in each, and whether the family — or its most important member — has a name. If it does not, I would like a coinage with a definition, its boundary cases, and an explicit account of what it excludes: in particular, cases in which dependence on an arbitrary choice is harmless, and cases in which the right verdict is that the questioner has simply blundered. I have students who will ask, and I would rather not improvise.
reasoning: |-
  Okay, let me try to unpack this user's query. They teach philosophy but are now covering probability and induction. They've encountered three probability problems that seem indeterminate despite initial appearances of determinacy. The user wants to know if these are the same underlying issue or distinct, how to diagnose each, and whether there's a name or concept that ties them together.

  First, I need to recall each example. The chord problem has three different methods yielding different probabilities. The sphere point shows different distributions based on coordinate systems. The coastline has infinite length with finer measurements. The common thread seems to be that a seemingly deterministic question lacks a unique answer due to missing specifications. But are they all the same phenomenon?

  For the chord, the issue is the ambiguity in defining "random chord." Each method assumes a different uniform distribution—midpoint, direction, endpoints—and there's no basis to prefer one. This is a classic case of Bertrand's paradox, highlighting the need to specify the random process.

  The sphere example involves conditioning on a great circle. The distribution along the circle depends on how you define the coordinate system. Since the sphere's symmetry doesn't dictate one coordinate over another, the conditional probability isn't well-defined without specifying the sampling method. It's similar to Borel's paradox, where conditioning on a measure-zero set requires specification.

  The coastline problem is different. It's about the fractal nature of coastlines. As the ruler size decreases, the measured length increases infinitely. Here, the concept of "length" itself isn't fixed; it depends on the scale of measurement. This is about defining the measurement process, not probability.

  So, are these the same? The first two involve probability distributions and the need for explicit sampling methods. The coastline is about geometric measure and scale dependency. The user might be conflating probability indeterminacy with measurement indeterminacy.

  The user's deeper need might be to explain to students why some problems lack definite answers. They need clear diagnoses: for Bertrand, it's underspecified random process; for Borel, undefined conditional probability; for coastlines, scale-dependent measurement. They also want to distinguish these from cases where arbitrary choices are harmless, like using different units.

  I should structure the response to address each case separately, then synthesize. Emphasize that the first two are probability paradoxes due to underspecification, while the coastline is about fractals. The commonality is the illusion of determinacy from symmetry, but the resolution differs. Coin a term like "symmetry-induced indeterminacy" but clarify its scope. Also, differentiate from benign cases like coordinate choices in integration, where the outcome is invariant.
answer: |-
  Your three specimens reveal distinct but philosophically connected species of indeterminacy arising from symmetry and underspecification. They share a core pattern: **the illusion of determinacy created by apparent symmetry dissolves upon closer inspection because the symmetry itself necessitates an arbitrary choice for resolution, which the problem statement fails to provide.** Let's diagnose each case and synthesize the family.

  ### 1. The Chord Paradox (Bertrand's Paradox)
  *   **Diagnosis:** **Underspecification of the Random Process.** The problem ("a chord is drawn at random") lacks a unique, natural interpretation of "random." Each sampling method (midpoint uniform over disk, direction/distance uniform, endpoints uniform on circumference) corresponds to a different physical or epistemic mechanism for generating the chord. Crucially:
      *   The circle's rotational/reflective symmetry makes *each* method seem equally "natural" or "uniform."
      *   Each method respects *a different aspect* of the symmetry (e.g., midpoint uniform respects translation symmetry *of the disk*; endpoints uniform respects rotational symmetry *of the boundary*).
      *   Probability is fundamentally defined relative to a sample space *and a probability measure*. The symmetry obscures the fact that the measure is not uniquely determined by the phrase "drawn at random" and the geometric setup alone.
  *   **Verdict:** The question is ill-posed. It asks for *the* probability, implying a unique answer derivable from the description, but no such unique answer exists. The symmetry creates multiple, equally valid candidate measures.

  ### 2. The Great Circle Distribution (Borel-Kolmogorov Paradox)
  *   **Diagnosis:** **Pathological Conditioning on a Measure-Zero Set.** The issue lies in defining conditional probability given an event of probability zero ("lies on this particular great circle").
      *   The sphere's rotational symmetry means every great circle is equivalent. Conditioning on *which* great circle is irrelevant – the problem focuses on the distribution *along* the given circle.
      *   The paradox arises because the same great circle can be parameterized in different ways (e.g., as a meridian in one coordinate system, as the equator in a rotated system). These different parameterizations lead to different conditional densities along the circle.
      *   Conditional probability is rigorously defined as a *limit* of conditioning on a sequence of *non-zero* probability sets shrinking to the measure-zero set (e.g., a "belt" around the great circle shrinking to zero width). *The limit depends on the shape of the approximating sets.* Horizontal belts lead to uniform density; wedges converging to a meridian lead to a non-uniform (cosine) density.
  *   **Verdict:** The conditional probability distribution *along the great circle* is not uniquely defined by the unconditional uniform distribution on the sphere and the event "point lies on this great circle." The symmetry ensures multiple equally valid limiting procedures exist, each yielding a different distribution. The specification needs to include *how* the conditioning information is obtained (i.e., the limiting process).

  ### 3. The Coastline Paradox (Fractal Dimension)
  *   **Diagnosis:** **Scale-Dependence of Geometric Measurement.** This case differs fundamentally from the first two. It's not about probability or underspecified randomness, but about the **inherent ambiguity of "length" for certain geometric sets**.
      *   The problem is deterministic: "What is the length of this coastline?" The answer depends critically on the *scale* (`ε`) at which you measure (the ruler length).
      *   For a smooth curve, the length converges to a finite value as `ε → 0`. For a fractal coastline, the measured length `L(ε)` increases without bound as `ε` decreases (`L(ε) ∝ ε^(1-D)`, where `D > 1` is the fractal dimension).
      *   The symmetry here is **scale invariance** (self-similarity). Zooming in reveals similar complexity at smaller scales. This symmetry prevents the existence of a single, scale-invariant "true length."
  *   **Verdict:** The concept "length" as a fixed, scale-independent property is not applicable to the coastline. The quantity diverges under the standard measurement procedure as resolution increases. The question assumes length is intrinsic, but for fractals, it's relational to the measurement scale.

  ## Synthesis: The Family and its Name
  *   **Common Core:** All three cases exhibit **Symmetry-Induced Indeterminacy**. The symmetry present in the problem setup (rotational, translational, scale) creates the *illusion* that a unique, objective answer must exist ("How else could it be? It's symmetric!"). However, this very symmetry generates multiple, equally valid ways to formalize the question (choice of sampling measure, choice of conditioning limit, choice of measurement scale), leading to different answers. The problem statement fails to break the symmetry sufficiently to select a unique formalization.
  *   **Family Members:**
      1.  **Parametric Indeterminacy (Chord/Sphere):** Indeterminacy arising because the symmetry group of the problem acts *transitively* on a space of possible parameters defining the object of interest (chord generation method, conditioning limit), and no unique "uniform" measure is specified. (Bertrand & Borel-Kolmogorov).
      2.  **Scale Indeterminacy (Coastline):** Indeterminacy arising because the object possesses scale symmetry (fractal dimension > topological dimension), making standard measurement concepts (length) diverge. The symmetry is between scales.
  *   **Is it One Phenomenon?** They are distinct *species* within the *genus* of **Symmetry-Induced Ill-Posedness**. Chord and Sphere are closer cousins (both probabilistic, both involve defining a measure on a space with symmetry). Coastline is a different beast (geometric measure theory, scale dependence). The unifying theme is the **failure of symmetry to uniquely determine the required quantity**.
  *   **The Coinage:** **Symmetry-Based Underspecification (SBU)**
      *   **Definition:** A problem exhibits Symmetry-Based Underspecification (SBU) when:
          1.  It asks for a quantitative property (probability, distribution, measure, length).
          2.  The problem setup possesses significant symmetry (geometric, rotational, translational, scale, etc.).
          3.  This symmetry creates multiple, equally faithful formalizations of the problem (e.g., sampling procedures, conditioning limits, measurement scales).
          4.  These different formalizations yield different quantitative answers.
          5.  The problem statement fails to specify which formalization is intended, and there is no principled reason inherent in the symmetry alone to prefer one formalization over the others.
      *   **Boundary Cases:**
          *   **Included:** Bertrand's Paradox (Chord), Borel-Kolmogorov Paradox (Sphere), Coastline Paradox, Jaynes' Wine/Water Puzzle (symmetry in continuous ratios), Some formulations of the Principle of Indifference leading to contradiction.
          *   **Excluded - Harmless Arbitrary Choice:**
              *   Choosing Cartesian vs. Polar coordinates to calculate the area of a circle. The symmetry allows either, but the *result* (πr²) is invariant under this choice. The quantity requested *is* uniquely determined.
              *   Choosing which player goes first in a symmetric game. The symmetry makes the choice arbitrary, but the rules and outcome are symmetric, rendering the choice harmless for analyzing expected payoffs (if players are identical).
              *   Using inches vs. centimeters. The scale symmetry (dilation) is broken by specifying the unit, and conversion is trivial.
          *   **Excluded - Blunder:** Asking "What is the probability a fair coin lands Heads?" and getting different answers based on how you flip it. Here, "fair coin" *does* uniquely specify the intended probability measure (P(Heads) = 1/2). Variation implies a misunderstanding of "fair" or the physical process, not SBU. Asking for "the length" of a smooth curve – SBU doesn't apply because the length is well-defined (scale symmetry is broken at the atomic level, but convergence happens before then).

  ## What to Tell Your Students
  > "These puzzles highlight a deep point: symmetry, while powerful, doesn't always single out a unique answer. Sometimes, it creates ambiguity. We call this **Symmetry-Based Underspecification (SBU)**. It happens when the problem's symmetry allows multiple, equally valid ways to make it mathematically precise, leading to different answers. The description hasn't given us enough to choose *which* precise version it means.
  >
  > *   In **Bertrand's Chord Paradox**, 'random chord' is underspecified – *how* is it generated? The circle's symmetry lets us imagine equally 'fair' ways, but they give different probabilities.
  > *   In the **Great Circle Puzzle**, 'how is it distributed given it's on this line?' is underspecified. The sphere's symmetry lets us approach the line in different equally 'natural' ways, leading to different distributions.
  > *   The **Coastline Paradox** is different; it's about scale. The coastline's rough symmetry across scales means 'length' isn't a fixed property – it depends on your ruler size. Asking for *the* length assumes it exists independently of scale, which it doesn't.
  >
  > SBU reminds us that translating vague concepts ('random', 'given', 'length') into precise mathematics requires careful specification, especially when symmetry is involved. Not every question phrased in symmetric terms has a unique, symmetry-dictated answer. Sometimes, the symmetry itself is the source of the ambiguity."

  This framework provides a coherent diagnosis for your specimens, distinguishes them from superficially similar cases, and gives you a precise term (SBU) with defined boundaries to use with your students. It acknowledges the common root in symmetry while respecting the distinct mechanisms in probability vs. geometric measurement.
