  **Brutally Honest Take on Your Hypothesis**  
  I’m skeptical that "crane = treadmill + ratchet" adds depth beyond "origination requires construction mechanisms; persistence requires maintenance." **What would flip me**: A case like institutional evolution where identifying *specific ratchets* (e.g., precedent rules in law) explains why reduction to individual psychology fails *only when* omitting them—while "maintenance" alone doesn’t capture the ratchet’s role in cumulative change. If your cases show this, it’s novel. If not, it’s repackaging. Either way, 6 months part-time is enough to test it. **Weakness**: Ratchets outside biology (e.g., in culture) are underspecified. Start there.
