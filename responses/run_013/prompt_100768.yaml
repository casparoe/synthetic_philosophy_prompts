prompt: |-
  Futarchy — the scheme in which a polity votes to fix the metric that defines its welfare and then lets conditional prediction markets choose policy, on the theory that bets about whether the metric will be higher under one policy than another will aggregate knowledge better than debate will — strikes me as an unusually clean case of an institution resting on a philosophical picture I cannot quite reconstruct. What does the design presuppose about value and about knowledge? It appears to require a welfare metric fixed and commensurable enough that a market can price a single number, yet the choice of metric is handed to a vote as though it were a prior matter of value rather than a contestable empirical claim; I would like to know which theory of welfare the practice actually commits to, and whether the clean partition between values and beliefs that it needs is really available. I would also like to know which of its presuppositions are load-bearing and which are merely convenient: does it genuinely need welfarism and consequentialism, or could a deontological or value-pluralist electorate run the same machinery? Tell me where the institution is philosophically underdetermined — where several incompatible theories would license the same design — and what would have to change in the practice if the presupposed view were replaced. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Okay, the user is asking about futarchy, specifically its philosophical underpinnings regarding value and knowledge. They mentioned the tension between voting on a welfare metric versus treating it as an empirical claim. I need to unpack that.

  First, the user is questioning how futarchy separates values from beliefs. The vote sets the metric, assuming it's a value judgment, but metrics themselves can be contested. Like, choosing GDP as a metric isn't neutral; it implies certain values about what's important. So futarchy might not cleanly split values and facts. The user wants to know which welfare theory this commits to—probably utilitarianism since it's aggregating into a single number.

  Then there's knowledge aggregation. Prediction markets are supposed to outperform debates by aggregating dispersed knowledge. But the user might be skeptical about whether markets really capture all types of knowledge, especially qualitative or tacit knowledge. Also, the markets need to price policies based on their impact on the metric, which assumes that the metric is measurable and that causal relationships can be predicted. But policy effects are complex and interdependent. What if a policy affects multiple aspects that the metric doesn't capture?

  The user also asks about deontological or pluralist systems. Can futarchy work if values aren't unitary? If the electorate has conflicting values, a single metric might oversimplify. Maybe you'd need multiple markets for different values, but that complicates decision-making. So futarchy seems tied to welfarism unless modified.

  They mention which presuppositions are load-bearing. The single metric is crucial because markets need a clear outcome to bet on. Without commensurability, the market mechanism falls apart. Consequentialism is also key since policies are judged by outcomes. Deontological constraints aren't easily incorporated unless added as side-constraints, which might require voting on each policy, undermining the market's role.

  Philosophical underdetermination: The design could be compatible with different epistemologies as long as they support prediction markets. But the value theory is less flexible—it needs a monistic, consequentialist approach. If you replace that, say with value pluralism, you'd need multiple metrics and maybe a weighted system, but that could get messy. Or if deontology, policies would need pre-approval based on rules, not just outcomes.

  The user's deeper concerns might be about reducing complex governance to a single number, risking oversimplification. They might worry about the feasibility of separating values from facts in practice, or whether prediction markets can handle uncertainty and external influences like manipulation. Also, the ethical implications of outsourcing policy to markets, potentially ignoring minority values.

  I should address all these points concisely, starting with the bottom line as requested. Highlight that futarchy's core commitments are welfarist consequentialism and market epistemology, and explain where it's flexible versus where it's not. Note the underdetermination in epistemology but strict requirements for value theory. Suggest possible modifications if presuppositions change, like multiple metrics or adding constraints.
answer: |-
  **Futarchy’s design fundamentally presupposes *welfarist consequentialism* for value and *market-price aggregation* for knowledge, requiring a single, cardinal welfare metric to function as intended.**  

  ### Reasoning:  
  1.  **Value Presuppositions (Load-Bearing):**  
      -   **Committed to Welfarist Consequentialism:** The scheme necessitates a single, quantifiable, and *commensurable* welfare metric (e.g., GDP, well-being index). This assumes:  
          -   *Monism:* Welfare can be reduced to one overarching good.  
          -   *Consequentialism:* Policies are judged solely by outcomes on this metric, ignoring intrinsic rules or rights (deontology) or incommensurable plural values (value pluralism).  
      -   **The "Values/Beliefs Partition" is Unstable:** The initial vote treats metric *selection* as a pure "value" choice. However, choosing a metric (e.g., "GDP" vs. "inequality-adjusted life satisfaction") itself embeds contestable empirical assumptions about what constitutes welfare and how it’s measured. This blurs the purported clean separation.  
      -   **Can Deontology/Pluralism Work? Only with Major Modifications:** A deontological or pluralist electorate could *not* run the standard machinery. Deontology requires evaluating policies based on rules, not just outcomes. Pluralism requires weighing incommensurable values. To adapt futarchy:  
          -   *Deontology:* Would require the market to price adherence to predefined rules *as well as* outcomes, or constrain policy options *ex ante* via vote – undermining the market's primary role.  
          -   *Pluralism:* Would necessitate multiple, simultaneous markets for distinct metrics (e.g., liberty, equality, sustainability), plus a method to aggregate *these* conflicting market signals into one policy choice – an unsolved problem replicating the initial voting dilemma.  

  2.  **Knowledge Presuppositions (Load-Bearing but Philosophically Underdetermined):**  
      -   **Requires Market Epistemology:** It presupposes prediction markets efficiently aggregate dispersed information into accurate probabilistic forecasts of a policy’s causal effect *on the single metric*. This assumes:  
          -   *Quantifiability:* The metric’s response to policy is predictable and measurable.  
          -   *Causal Isolability:* Markets can isolate and price the effect of specific policies on the metric.  
      -   **Underdetermined Epistemology:** Multiple theories of knowledge (e.g., Hayekian dispersed knowledge, Bayesian updating) can justify market efficacy. The core commitment is to the *mechanism* (market prices beat debate), not a specific epistemology. However, challenges (market failures, manipulation, Knightian uncertainty) question this presupposition universally.  

  3.  **Philosophical Underdetermination & Required Changes:**  
      -   **Underdetermined:** The *epistemic mechanism* (prediction markets) is compatible with various theories of knowledge aggregation (e.g., pragmatism, empiricism). The *value foundation* (monistic consequentialism) is *not* underdetermined; it’s strictly required.  
      -   **Changes if Presuppositions Shift:**  
          -   *Replace Welfarist Consequentialism:* Adopting value pluralism would require abandoning the single market. Instead, multiple markets for each value dimension and a (likely voting-based) meta-aggregation rule would be needed. Adopting deontology would require pre-market policy screening for rule compliance, shifting significant power back to votes.  
          -   *Reject Market Epistemology:* If markets aren’t trusted, the entire policy selection mechanism collapses. Alternatives (e.g., deliberative bodies, expert panels) would replace markets, dismantling futarchy’s core innovation.  
          -   *Reject Cardinal Commensurability:* If welfare is ordinal or non-comparable, a market betting on a single numerical outcome becomes incoherent. Futures contracts require a definite, measurable payoff.  

  **In essence, futarchy is robustly committed to a monistic, consequentialist theory of value and a market-based theory of knowledge aggregation; altering its value foundations necessitates structural changes, while its epistemic foundations are more flexible but equally essential to its operation.**
