answer: |-
  ## The Karma Conundrum: A Dialogue on Unseen Traces and Moral Desert

  **Characters:**  
  *   **Anika:** Defends karma as an impersonal law of moral desert via unseen potency (adṛṣṭa/vāsanā).  
  *   **Vikram:** Argues the concept is incoherent for grounding genuine desert.  

  **(The setting is a quiet library corner, ancient texts scattered.)**

  **Anika:** ...So, the core is this: every volitional action (karma) plants a subtle, unseen seed (adṛṣṭa, vāsanā) within the causal continuum. This potency persists, latent, influenced by other karmas, ripening inevitably into its appropriate fruit (phala) – pleasure, pain, rebirth circumstance – when conditions align. It's built into reality's fabric, like gravity, but moral. You *deserve* the fruit because you sowed the seed.

  **Vikram:** Anika, I admire the elegance, but it collapses under scrutiny. First, your "impersonal law." Gravity doesn't make a falling rock *deserve* to hit the ground. Desert implies *recognition* – a judgment that X *ought* to happen to Y *because* of Y's prior act. An impersonal force can't "recognize" or "weigh" anything. My hangover follows my drinking by natural law, but it's not *deserved punishment* like a judge sentencing me. Karma-as-law strips "desert" of its essential moral dimension.

  **Anika:** Not at all. Consider debt. If I borrow money, I incur an obligation – a *debt* – that persists even if the lender forgets. Repayment isn't "administered punishment"; it's the constitutive settling of that obligation woven into the social/economic fabric. Karma is similar: the act *constitutively* creates an imbalance in the moral order; the fruit *is* the rebalancing. No external judge is needed; the desert is inherent in the act's nature.

  **Vikram:** Clever, but it founders on your second point: no persistent self. If the "I" who acts is a momentary aggregate, dissolved the next instant, who bears the debt? When the "fruit" ripens lifetimes later, that being is a new aggregate. Punishing *them* for *my* past act is like jailing a man because his grandfather stole. How is *that* desert?

  **Anika:** You misunderstand continuity. A river changes every moment, yet we rightly say *it* eroded the canyon. A corporation incurs debts and obligations; though its employees and shareholders change, *it* remains liable. Consciousness is a causally continuous stream. The act arises *within* this stream, planting the seed *within* it. The later suffering ripens *within* the same stream, settling the obligation *of the stream*. The experiencer *is* the inheritor of that stream's karmic legacy.

  **Vikram:** Inheritance! Precisely the problem. The heir didn't *choose* the debt; they just got saddled with it. Desert requires *agency* – that the sufferer *was* the agent, and crucially, *could have done otherwise*. But if I'm born blind due to past karma, where was *my* choice in *this* life? Where was *my* alternative possibility then? Unchosen inherited "debts" aren't desert; they're cosmic bad luck. And this "unseen potency" – how is it anything but an unfalsifiable postulate? You say it's "latent," "ripens," but offer no way to distinguish its supposed effects from random misfortune or purely physical causality. It looks suspiciously like saving the theory by inventing invisible glue.

  **Anika:** The potency is inferred, Vikram, like gravity before instruments. We see the regularity: wholesome actions tend towards wholesome fruits, unwholesome to suffering, across lifetimes, defying simple material explanations. The potency *is* the postulated causal link explaining this observed moral order. As for unchosen circumstances: the stream *did* act, volitionally, to create the seed. The rebirth *is* the ripening. The stream *could have done otherwise* at the *time of planting*. The "heir" suffers not arbitrarily, but precisely *as* the inheritor of that specific karmic estate they themselves (as the stream) cultivated. The inability to choose *now* doesn't negate the responsibility *then* that shaped the *now*.

  **Vikram:** But that conflates the stream's responsibility with the *individual's* experience of desert *now*. The blind person suffers *as an individual*, not as an abstract stream. They experience the pain *now*, while the capacity for moral understanding and choice *then* was embedded in a completely different psychophysical complex. The debt analogy fails – a corporation pays debts from its *current* assets, generated by its *current* activities. The stream suffers for past actions using the only "assets" it has: the present consciousness, which had no hand in creating the debt. Where's the *moral* connection for *this* sentient being? It still feels like punishment transferred, not desert earned.

  **Anika:** Because you insist on atomizing the stream into disconnected moments. The experiencing "now" *is* the inheritor; the pain *is* the direct, non-arbitrary consequence of the stream's past volition. The desert *is* constitutive: the suffering *is* the manifestation of the past unwholesome act's intrinsic nature, experienced by the continuum that generated it. It's not punishment *transferred*; it's the act's own latent potential *unfolding*.

  **Vikram:** And I say that unfolding, landing on an experiencer who couldn't have shaped it and couldn't avoid it, feels indistinguishable from fatalism wrapped in moral language. The connection feels broken. Your "constitutive desert" risks becoming just a brute fact of suffering, stripped of its justifying "because *you* did it" for the being actually suffering. The potency remains... elusive.

  **Anika:** And the moral regularity remains... unexplained. The debate continues, Vikram. Pass the tea?

  **(They both reach for the pot, the unresolved tension hanging as thick as the steam.)**
