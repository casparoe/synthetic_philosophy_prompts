     The residue: The argument assumes the entire trace (the whole spacetime) is fixed. In distributed systems, we can reason about an ongoing execution, but then we don't have the future events. So the consolation that the future is "still there" relies on the entire trace existing. Without that, we cannot say the future events are there.

     This is a defect of the vocabulary? Or a defect of the argument? The distributed systems model can represent both partial and complete traces. But the argument for the reality of the future requires the complete trace. So in an ongoing system, we don't have the complete trace, so we cannot say the future events are real. Thus, the argument only holds if we assume the entire history of the universe is fixed.

  D. The log being written by appending: In distributed systems, at a process, events are appended to the log. This is an event itself. The process's local view grows with time. This is analogous to our experience of time: events become present and then past.

     This maps: The local view is like our experience. But note: in the global trace, the entire log is already there. The appending events are just events in the trace.

