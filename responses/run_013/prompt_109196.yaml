  B. Openness of the future: In the physical world, we feel the future is open (not yet determined). In the distributed systems model with a fixed trace, the future is fixed. But note: in a non-deterministic distributed system, there might be multiple possible traces. However, once we fix a trace, it is fixed.

     The distributed systems model typically assumes that we are analyzing one fixed trace. So the future in that trace is fixed. But in reality, we don't know which trace we are in? This is similar to the block universe in relativity: all events are fixed in the four-dimensional manifold.

     However, the consolation is that the future is real and fixed. The distributed systems model supports that if we assume the entire trace exists. But without that assumption, we don't have it.

