  We are going to translate the Rietdijk-Putnam argument from relativity to distributed systems vocabulary.

  The argument in relativity:
  1. Special relativity leaves no frame-independent simultaneity.
  2. Therefore, any event spacelike separated from my here-and-now is simultaneous with it in some frame.
  3. If what is simultaneous with something real is itself real (the reality of simultaneity), then everything in my "elsewhere" (the set of events spacelike separated) is real.
  4. Then the future (and past) must be admitted as real because they are connected by such spacelike relations, and thus there is no frame-independent fact about which events have happened and which have not.

  We are to map this to distributed systems concepts:

  - Events: points in the execution of a system.
  - Happens-before (->): a partial order defining causality. If event a happens before event b (a -> b), then a could have influenced b.
  - Concurrent events: if neither a->b nor b->a, then a and b are concurrent (a || b). This is analogous to spacelike separation in relativity.
  - Local view: the sequence of events at a single process (like a worldline in relativity).
  - Global trace: the entire set of events with the happens-before relation.

  Step-by-step translation:

  1. **No absolute simultaneity**: In distributed systems, there is no global clock. Two events at different processes are simultaneous only relative to a particular clock synchronization. Without a global clock, we cannot say that two events at different processes happen at the same time in an absolute sense.

     Translation: The lack of frame-independent simultaneity in relativity corresponds to the lack of a global clock in distributed systems. We cannot define a global "now" that all processes agree on.

     Mapping cost: This step maps cleanly. The cost is that we must give up the idea of a universal "present" moment.

  2. **Spacelike separation and simultaneity in some frame**: In relativity, for any event spacelike separated from my current event, there exists a frame of reference in which they are simultaneous.

     In distributed systems, for two events that are concurrent (a || b), there exists a logical clock (or a vector clock) that assigns the same timestamp to both? Not exactly. Logical clocks (like Lamport clocks) only guarantee that if a->b then clock(a) < clock(b), but they don't necessarily assign the same timestamp to concurrent events. However, we can define a clock that does. For instance, we can arbitrarily choose a clock that assigns the same time to two concurrent events by adjusting the clock rates at the processes. But note: in distributed systems, we can define a global time function that is consistent (i.e., if a->b then time(a) < time(b)) and that may assign the same time to concurrent events. However, such a time function is not unique.

     Translation: For any two concurrent events (a and b, with a || b), there exists a consistent clock (a global time function) such that time(a) = time(b). This is the distributed systems analog of a frame in which the two events are simultaneous.

     Mapping cost: This step maps with a distortion. In relativity, the frame is a physical coordinate system, while in distributed systems, the clock is an arbitrary assignment that we can choose. The cost is that we are introducing an artificial clock that we can define arbitrarily as long as it respects the happens-before order. This might be seen as a mathematical trick rather than a physical reality.

  3. **Reality of simultaneous events**: The argument assumes that if an event is simultaneous with a real event (i.e., an event in the present), then it is real.

     Translation: If we have two events that are assigned the same time in a consistent clock, and if we consider one of them (say, at my process) as real (i.e., having occurred), then the other must also be considered real.

     But note: in distributed systems, we typically think of the entire execution trace as existing (as a mathematical object) from the start. We are analyzing a fixed trace. So if we take the global trace as given, then all events are already there. The issue is that in the distributed systems model, we often assume that the entire trace is fixed and we are just observing it from different local views.

     Mapping cost: This step relies on the assumption that the entire trace exists. In the distributed systems analogy, we are usually reasoning about a fixed execution trace. So the reality of all events is built-in. But in the physical world, we don't have the entire trace fixed in advance? The argument in relativity is trying to establish that the future is already real, but in the distributed systems model we start by assuming the entire trace is fixed. So we are smuggling in the conclusion.

     We must flag: This step in the translation only holds because we are assuming the global trace is complete and fixed. In the physical scenario, we do not have access to the entire trace. So the step is not an inference but a stipulation of the model.

  4. **Admitting the future**: The argument then says that since events in the future (spacelike separated) are real, and also events in the past (which are in the causal past) are real, then the entire future is real.

     In distributed systems, if we have a fixed global trace, then of course the entire future (and past) is already defined. But note: in a running distributed system, the future events haven't happened yet. However, when we model the system, we consider the entire trace. This is the key difference.

     Translation: In a fixed global trace, all events are fixed, including those that we would consider "future" from a particular event's perspective. But this is because the trace is fixed by definition.

     Mapping cost: This step again relies on the assumption that the entire trace exists. Without that, we cannot say the future events are fixed. So we are not proving the future is real but assuming it by the model.

