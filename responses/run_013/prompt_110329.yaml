prompt: |-
  I work in decision theory — subjective expected utility, preference orderings over lotteries, revealed preference, feasible sets, and Bayesian updating under model uncertainty. I have only a tourist's grasp of the metaethics of reasons. I would like you to take the debate between internalism and externalism about practical reasons — the internalist view, associated with Bernard Williams, that an agent has a reason to act only if the action is served by some element in that agent's existing motivational set, and the externalist denial that reasons must bottom out in the agent's actual motives — and restate it as faithfully as you can in my vocabulary. Treat a "reason" as whatever makes an action choiceworthy, and render it with the machinery I have: preference orderings and their completions, subjective expected utility, feasible sets, the agent's model of the world, the gap between the preferences an agent has and the preferences it ought to have, and so on. Then give me the residue report: which parts of the debate map onto my machinery without loss, which parts can be made to fit only by distorting them, and which parts have no counterpart at all — for instance, whether anything in the internalist's picture corresponds to the idea of a consideration that is genuinely normative for the agent yet unreachable by any deliberative route from her current preferences. I am especially interested in whether my framework's habit of treating preferences as the source of all normative force makes it structurally unable to state the externalist's position without begging the question, or whether that is in fact a fair rendering of what the externalist is claiming.

  Please be careful not to smuggle my framework's assumptions in and then call the result a translation; where the translation is lossy, say so rather than papering over the gap. And wherever you can, separate what is settled among people who work on this topic from what is genuinely contested, and flag any point at which a contested reading might be mistaken for the consensus.

  Structure the response in the following sections, in this order:

  - **Translation** (roughly 500–700 words): the debate restated in decision-theoretic vocabulary, as faithfully as you can manage.
  - **What carries over** (roughly 250–350 words): the claims that survive translation intact, and why they do.
  - **The residue** (roughly 400–500 words): what does not translate — the claims, distinctions, or arguments with no counterpart in my vocabulary, and what it would cost to add one.
  - **Diagnosis** (roughly 300–400 words): for each major piece of residue, whether it marks a defect of the decision-theoretic framework or a place where the original claim was less determinate than it sounded.
  - **Settled and contested** (roughly 200–300 words): what people who know this debate agree on and what remains genuinely disputed, with no contested view presented as consensus.
reasoning: |-
  Hmm, the user is a decision theory expert who wants me to translate the internalism vs. externalism debate in metaethics into their technical vocabulary. They work with concepts like subjective expected utility, preference orderings, feasible sets, and Bayesian updating. They're specifically interested in whether their framework can capture Bernard Williams' internalist view that reasons must connect to an agent's existing motivations, versus the externalist view that reasons exist independently.

  I need to be extremely careful not to smuggle in decision-theoretic assumptions while pretending it's a neutral translation. The user explicitly wants me to identify where the translation loses meaning, and where their framework might be question-begging against externalism. They're particularly concerned about whether treating preferences as the source of normativity inherently biases against externalism.

  Key challenges I anticipate: 
  First, decision theory typically takes preferences as given, while metaethics questions their normative authority. Mapping "reasons" to "choiceworthiness" already leans internalist since choiceworthiness is defined relative to preferences in standard decision theory. 

  Second, Williams' "motivational set" is richer than simple preferences - it includes desires, commitments, etc. I'll need to show how this maps to an extended preference structure but acknowledge the simplification.

  Third, externalism's claim about mind-independent normative facts has no clean counterpart. The closest might be the gap between actual and ideal preferences, but that's still preference-dependent. I'll need to highlight this as major residue.

  Fourth, the user's focus on "deliberative routes" from current preferences directly challenges externalism's possibility of reasons inaccessible through deliberation. This might be where the framework structurally excludes externalism.

  For structure, I'll follow their requested sections: translation first, then what carries over, residue, diagnosis, and finally settled vs. contested points. In the translation, I'll define reasons as choiceworthiness derived from preference orderings, show how internalism requires choiceworthiness to be achievable through deliberation from current preferences, and frame externalism as allowing choiceworthiness that may violate this. 

  The residue section will be crucial - I'll emphasize how the framework can't express true externalist reasons without circularity, and how concepts like "authority" of reasons get lost. In diagnosis, I'll argue this exposes a limitation in decision theory for metaethics, not vagueness in the original debate.

  For settled/contested: Consensus exists on internalism's core definition but not its truth; externalism's viability is hotly debated; Williams' "sound deliberation" is notoriously contested. I must present this neutrally without implying false consensus.
answer: |-
  ### **Translation**  
  Restating the internalism/externalism debate in decision-theoretic terms:

  - **"Reasons" as choiceworthiness**: A reason to choose an action \(a\) is whatever makes \(a\) *choiceworthy*, defined as maximizing a preference ordering \(\succsim\) over a feasible set \(A\). Choiceworthiness is determined by a subjective expected utility (SEU) function \(U(a) = \sum_{s \in S} \pi(s) \cdot u(a(s))\), where \(\pi\) is the agent's belief (prior or posterior) over states \(S\), and \(u\) captures utility over outcomes. The agent's "model of the world" includes \(S\), \(\pi\), and the mapping \(a(s)\) to outcomes.  

  - **Internalism (Williams)**: An action \(a\) is choiceworthy only if it aligns with the *deliberative closure* of the agent's **actual motivational set** \(M\). Here, \(M\) is formalized as the agent’s *current preference ordering* \(\succsim_0\) over lotteries, which may be incomplete or intransitive. "Deliberative routes" from \(M\) include:  
    - **Completing \(\succsim_0\)** to a rational \(\succsim^*\) (e.g., via SEU axioms).  
    - **Updating beliefs** via Bayesian conditioning on new evidence.  
    - **Expanding feasible sets** \(A\) (e.g., discovering new actions).  
    Choiceworthiness requires \(a\) to be \(\succsim^*\)-maximizing for *some* such completion/update. If no such path makes \(a\) maximal, \(a\) is not choiceworthy *for that agent*.  

  - **Externalism**: Choiceworthiness of \(a\) need not depend on \(\succsim_0\). Instead, there exists an **ideal preference ordering** \(\succsim_I\) (e.g., one satisfying objective rationality or moral facts) that grants \(a\) choiceworthiness, even if \(\succsim_I\) is inaccessible from \(\succsim_0\) via any deliberative path. \(\succsim_I\) may be orthogonal to \(\succsim_0\) – e.g., \(a\) maximizes \(U_I\) but is \(U_0\)-minimizing, with no Bayesian update or preference refinement bridging the gap.  

  - **Key conflict**:  
    - Internalist constraint: Choiceworthiness \(\subseteq \{a : a \text{ is } \succsim^*\text{-maximal for some } \succsim^* \in \text{delib}(\succsim_0)\}\).  
    - Externalist denial: Choiceworthiness may include actions that are \(\succsim_I\)-maximal but \(\notin\) the internalist set.  

  ### **What Carries Over**  
  Several core ideas translate cleanly:  
  1. **Motivational set as preference ordering**: Williams' "elements of the motivational set" (desires, commitments) map directly to \(\succsim_0\). Incompleteness in \(M\) corresponds to an incomplete \(\succsim_0\).  
  2. **Deliberative accessibility**: Williams' "sound deliberation" becomes operations on \(\succsim_0\): Bayesian belief updating, completion to a coherent \(\succsim^*\), and feasible set refinement. Internalism’s requirement that reasons be reachable via deliberation is captured by \(\succsim^* \in \text{delib}(\succsim_0)\).  
  3. **Conditionality of reasons**: Internalism’s agent-relativity is preserved: whether \(a\) is choiceworthy depends entirely on \(\succsim_0\) and the agent’s model \((S, \pi)\).  
  4. **Externalism’s challenge**: The claim that reasons might require "correct" preferences is rendered as choiceworthiness defined by \(\succsim_I \neq \succsim^*\) for any \(\succsim^*\) derivable from \(\succsim_0\).  

  The debate’s structure survives: Internalism binds normativity to the agent’s extant state; externalism severs this link.  

  ### **The Residue**  
  Critical elements *fail* to translate:  
  1. **Normative authority**: Decision theory treats \(\succsim\) as the *source* of normativity. But externalists argue that \(\succsim_I\) has authority *independent* of \(\succsim_0\) – e.g., "You should prefer \(x\) to \(y\) even if you don’t and can’t." This "should" has no counterpart; "choiceworthiness" is always relative to *some* \(\succsim\).  
  2. **Thin vs. thick reasons**: Internalism allows "elements of \(M\)" beyond preferences (e.g., moral emotions). Reducing \(M\) to \(\succsim_0\) flattens this. A desire for fairness might be captured in \(u(\cdot)\), but its distinct *reason-giving force* is lost.  
  3. **Deliberative inaccessibility**: Externalism permits reasons *necessarily* unreachable from \(\succsim_0\) (e.g., a moral truth requiring total preference reversal). Decision theory can model *contingent* inaccessibility (e.g., computational limits), but not *constitutive* gaps – \(\succsim_I\) is either reachable or irrelevant.  
  4. **Williams’ "persistence" criterion**: Williams held that genuine reasons must persist through deliberation. In decision theory, "deliberation" refines \(\succsim_0\) to \(\succsim^*\), but persistence is automatic – if \(a\) was choiceworthy pre-deliberation, it remains so post-deliberation. The metaethical worry about *mistaken* motivations dissolving under scrutiny vanishes.  

  ### **Diagnosis**  
  Residue points to **framework limitations**, not vagueness:  
  1. **Normative authority**: The inability to capture externalist "authority" stems from decision theory’s *procedural* normativity: rationality is defined as coherence (axioms), not correctness. Adding \(\succsim_I\) requires importing external norms – but this begs the question against internalism.  
  2. **Deliberative gaps**: Decision theory assumes all normativity is *accessible* via preference refinement (e.g., SEU completion). This implicitly rejects externalism’s claim that some reasons are *fundamentally alien* to the agent’s psychology. The framework cannot express this without contradiction.  
  3. **Motivational richness**: Reducing \(M\) to \(\succsim_0\) is reductive but *deliberate* – decision theory aims for parsimony. The cost is losing Williams’ nuanced anthropology (e.g., "projects, commitments").  
  4. **Persistence**: The disappearance of Williams’ criterion highlights decision theory’s *static* view of rationality. Deliberation is discovery (of beliefs/options), not error-correction. Metaethics’ dynamic concerns (e.g., "did deliberation *reveal* or *create* the reason?") have no foothold.  

  ### **Settled and Contested**  
  **Settled**:  
  - Internalism’s *definition*: Reasons must link to the agent’s subjective motivations via possible deliberation.  
  - Externalism’s *core claim*: Some reasons apply regardless of an agent’s motivational set.  
  - Williams’ rejection of "purely external" reasons: If a reason can’t motivate via deliberation, it’s inert/nonexistent.  
  - The *dispute* hinges on whether normativity requires psychological hooks.  

  **Contested**:  
  - **Scope of deliberation**: Whether "deliberation" includes radical preference revision (e.g., adopting morality if amoral). Williams (*contestedly*) excludes this.  
  - **External reasons’ possibility**: Whether externalism is coherent – e.g., can a reason bind an agent who *cannot* acknowledge it?  
  - **Frameworks’ adequacy**: Whether decision theory captures normativity (internalists: mostly yes; externalists: no – it misses irreducibly external "oughts").  
  - **Williams’ "relativism"**: Whether internalism permits *any* criticism of preferences. (Williams: yes, via internal critique; critics: no, it’s too permissive.)  

  **No consensus exists on the central dispute**: Internalism remains a live, deeply contested option. Decision theory’s preference-centricity *structurally favors internalism* by defining choiceworthiness relative to \(\succsim\). To express externalism, the framework must be supplemented (e.g., with a moral \(\succsim_I\)), but this imports the very notion externalism defends – rendering the "translation" circular.
