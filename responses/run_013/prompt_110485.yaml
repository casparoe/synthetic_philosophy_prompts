  So the optimal plan: at node1: Go, at node2: Stop, at node3: Go. The payoff is 4.

  Now, the constrained problem (absent-minded, must use same p at every node).

  The agent uses a strategy: at each node, go with probability p, stop with probability 1-p.

  We need to compute the expected payoff as a function of p.

  The possible paths:

