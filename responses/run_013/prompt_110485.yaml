  We are designing a decision problem with three indistinguishable decision points (nodes) at which the agent must choose to either "stop" (S) or "go" (G). The agent cannot distinguish between the three points and cannot remember how many she has passed. Therefore, she must use the same mixed strategy at each node: she chooses G with probability p and S with probability 1-p, independently at each node.

  The setting: imagine a commuter driving home along a familiar route. There are three consecutive identical-looking exits (say, because they are in a tunnel and look the same) that she might take to stop at a coffee shop. If she takes an exit (i.e., stops), she gets a payoff that depends on which exit it is. If she goes past all three, she arrives home and gets a terminal payoff.

  We denote the three decision points as node 1, node 2, and node 3. The agent passes them in order. At each node, if she chooses S, she stops and gets the payoff for that exit. If she chooses G, she continues to the next node. If she chooses G at node 3, she goes home and gets the terminal payoff.

