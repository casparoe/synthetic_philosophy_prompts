  - s1 = payoff for stopping at node 1
  - s2 = payoff for stopping at node 2
  - s3 = payoff for stopping at node 3
  - H = terminal payoff for going past node 3 (arriving home)

  We require:
  1. Three indistinguishable nodes -> one information set containing all three.
  2. The optimal p (continuation probability) must be strictly between 0 and 1, and the mixed strategy must be better than both pure strategies (always stop or always go).
  3. The unconstrained optimal plan (where the agent can condition on the node) must yield strictly more than the best constrained strategy.
  4. The indifference probability (computed by reasoning at a node) must be in (0,1) and different from the optimal p.

  We also need to set payoffs so that the backward induction for the unconstrained case and the constrained case can be computed.

  Let's choose the following payoffs:

