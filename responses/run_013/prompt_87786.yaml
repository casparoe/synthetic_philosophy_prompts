prompt: |-
  OK so context: I'm a philosophy professor (ethics and political philosophy, mostly) but before I defected I did an MSc in stats, and honestly that's the only technical training I have. I've been roped into running a session on the Principal Principle and deference to objective chance for our grad seminar, and I want to teach it in the dialect I actually think in rather than pretending to be a philosopher of probability. So I want a translation job, and then the interesting part, which is what doesn't survive the translation.

  Here's the debate as I (mis)understand it, so you can see what needs restating and can tell me if I've mangled it. The principle itself says roughly: a reasonable initial credence function, conditional on the proposition that the objective chance of A is x and on any evidence that's "admissible", should equal x. Chances are supposed to supervene on the total Humean mosaic — the whole arrangement of local matters of fact, past and future both — and that's what generates the nasty case. Some futures are such that, if they came about, the present chance facts would have been different; call those undermining futures. A Humean chance function looks like it can give them positive probability, but you can't have positive credence in something that would make the proposition you've conditioned on false, so the principle looks inconsistent. I think one response is that the undermining futures have to come out with chance zero, and another (I've seen it called the New Principle) is that the principle is just mis-stated and you should defer to the complete theory of chance rather than to the chance of the particular proposition. Correct me if I've mangled any of that.

  What I want: restate the whole thing — the principle, the admissibility clause, the undermining problem, and both repairs — in the vocabulary I actually have. Priors and posteriors, parameters versus data, de Finetti exchangeability, sufficient statistics, regular conditional distributions, calibration, martingales if you need them. I'm fluent in that stuff up to a master's level but I'm not a probabilist by trade, so dont assume measure theory past conditional expectations. Treat chance as a parameter, treat credence as a prior, and see how far it goes before it breaks.

  Then the residue report, which is the part I actually care about. Which bits translate cleanly? My guess is that admissibility is doing something like sufficiency or exogeneity, and that the de Finetti picture already hands you a version of deference for free, since conditioning on the limiting frequency makes the sequence iid. Which bits only translate with distortion? And which bits have no counterpart at all — in particular, does the statistical toolkit have anything at all that expresses a norm binding every rational agent, as opposed to a constraint that's relative to whatever prior the agent happens to have? If there's real residue left over, tell me wether that's my vocabulary being impoverished or the original claim being less clear than it looks.

  One test case I made up, because I want to see the translation do work instead of just getting gestured at: an agent has a prior over a coin's bias, and puts positive mass on hypotheses under which the bias itself shifts partway through the sequence, so that the early data would have been misleading about the later bias. Is that the undermining future in my dialect, or a different animal? And does "condition on the whole theory of chance" become "condition on the parameter"? If so that sounds like ordinary Bayesian practice, so where does the disagreement go?

  No need for cites or a reading list, I know the papers — I want the translation and the residue.
reasoning: |-
  Alright, let me tackle this philosophy professor's problem. They want the Principal Principle and related concepts translated into statistical terms, focusing on priors, parameters, and conditional distributions. 

  First, I need to map the key components. The Principal Principle can be seen as calibration: if you know the objective chance is x, your credence should be x. Admissibility likely relates to sufficiency—evidence that doesn't carry extra info about the parameter beyond what the chance gives. 

  The undermining futures problem is tricky. In statistical terms, if the future data affects the chance parameter, it's like a prior that puts mass on shifting parameters. The New Principle's "complete theory of chance" might map to conditioning on the parameter, but if the parameter is defined via the whole data (like Humean mosaic), circularity arises. 

  For the test case: an agent with a prior allowing bias shifts. Early data being misleading later resembles undermining if the chance's supervenience base includes future data. But here, the parameter is predefined, not dependent on future outcomes, so it avoids circularity. The residue is normativity—statistics doesn't impose external constraints; it's all within the prior. 

  The real issue is whether chance is an objective parameter or defined by the mosaic. If the latter, conditioning on chance requires knowing the entire data, which isn't feasible. That's where the translation breaks—statistics assumes fixed parameters, while Humeanism makes them data-dependent. 

  Admissibility as sufficiency works, but the normativity gap remains. Statistics can't mandate priors; it only ensures internal consistency. So the binding norm for rational agents isn't captured, highlighting a key philosophical residue.
answer: |-
  Here's the translation you requested, followed by the residue report. We'll use Bayesian statistical machinery as the target dialect.

  ### Translation
  1.  **Principal Principle (PP) as Calibration Constraint:**
      *   **Dialect:** You have a prior `π(θ)` over a chance parameter `θ` (e.g., coin bias). Conditional on knowing `θ = θ_0` *and* possessing only "statistically inert" evidence `E` (more on this below), your posterior credence `Cr(A | θ = θ_0, E)` in event `A` (e.g., next flip heads) should equal `θ_0`. Formally:
          `Cr(A | θ = θ_0, E) = θ_0`
      *   **Admissibility as Statistical Inertia/Sufficiency:** Evidence `E` is "admissible" (statistically inert w.r.t. `A` given `θ`) iff it satisfies one of:
          *   **Sufficiency:** `E` is sufficient for `θ` relative to `A`, meaning `P(A | θ, E) = P(A | θ)` (the distribution of `A` depends *only* on `θ`, not on `E`).
          *   **Exogeneity:** `E` is statistically independent of `A` given `θ`, formally `A ⫫ E | θ`. Knowing `E` provides no additional information about `A` beyond what `θ` already tells you.
      *   **Intuition:** If you *know* the precise parameter `θ` governing the data-generating process, and your evidence `E` doesn't add anything relevant about the specific event `A` beyond `θ`, your belief about `A` should just be `θ`. This is a calibration requirement: your beliefs align with the known physical probabilities.

  2.  **The Undermining Problem as Self-Referential Inconsistency:**
      *   **Dialect:** Suppose the chance parameter `θ` is *not* primitive but is *defined* as a function `θ = f(X)` of the *entire* dataset `X` (past *and* future), the "Humean mosaic". This is the "Humean supervenience" claim. Now consider an event `U` (an "undermining future") which is a possible future data sequence such that `f(X) ≠ f(X')` where `X'` is `X` with `U` replacing the actual future. Crucially, `U` is compatible with the *current* value `θ_0 = f(X_actual)` (where `X_actual` includes the actual future). The PP seems to demand:
          `Cr(U | θ = θ_0, E) > 0` (since `P(U | θ = θ_0) > 0` under the Humean chance model)
          BUT
          `Cr(U | θ = θ_0, E) = Cr(U | θ = θ_0, E, f(X) = θ_0)` = `0` (because if `U` occurs, `f(X) ≠ θ_0`, contradicting the condition `θ = θ_0`).
      *   **Intuition:** The definition of `θ` depends on the *whole* data `X`. Conditioning on `θ = θ_0` implicitly fixes the *entire* `X`. Any future `U` inconsistent with `X_actual` (and hence `θ_0`) is logically impossible given `θ = θ_0`. Yet, the statistical model `P(· | θ = θ_0)` assigns `U` positive probability. This is the inconsistency: the model says `U` is possible under `θ_0`, but conditioning on `θ_0` logically rules `U` out.

  3.  **Repair 1: Chance Zero for Underminers:**
      *   **Dialect:** Adjust the statistical model `P(· | θ)` defined by `θ = f(X)`. Ensure that `P(U | θ = θ_0) = 0` for any `U` where `f(X') ≠ θ_0` if `U` occurs. The model must assign probability zero to any data sequence that would change the parameter value away from `θ_0` if it were to occur.
      *   **Intuition:** Force the chance model itself to recognize that futures inconsistent with the current chance value `θ_0` are impossible. This modifies the likelihood.

  4.  **Repair 2 (New Principle - NP): Defer to the Whole Model:**
      *   **Dialect:** Instead of conditioning *only* on `θ = θ_0`, condition on the complete specification of the *chance model* `M_θ` (the full probability distribution over the mosaic `X` implied by `θ = θ_0`). The NP says:
          `Cr(A | M_θ, E) = P_{M_θ}(A | E)`
          where `P_{M_θ}(· | E)` is the conditional probability calculated *within* the model `M_θ` given admissible `E`.
      *   **Intuition:** Don't just condition on the parameter value; condition on the *entire probabilistic law* `M_θ` it defines. Your belief about `A` given `E` should be whatever the law `M_θ` says it is, given `E`. This "conditional chance" automatically handles undermining futures: `P_{M_θ}(U | E)` is defined *within* the model where `θ = θ_0` is fixed, and for undermining `U`, `P_{M_θ}(U | E) = 0` because `U` is logically incompatible with `θ = θ_0` and the fixed model `M_θ`.

  ### Residue Report
  1.  **Clean Translations:**
      *   **PP Core:** The idea that knowing the precise physical probability parameter `θ` *should* constrain your credence to match `θ` (absent defeating info) translates cleanly to the calibration constraint `Cr(A | θ = θ_0, E) = θ_0` given statistically inert `E`.
      *   **Admissibility (Core Idea):** The notion that evidence is admissible if it doesn't provide "direct" information about `A` beyond `θ` translates cleanly to statistical exogeneity (`A ⫫ E | θ`) or sufficiency.
      *   **de Finetti Connection:** Your intuition is correct. In a de Finetti exchangeable sequence, conditioning on the limiting frequency (acting as the "chance" parameter) *does* make your predictive probabilities treat the sequence as i.i.d. with that chance. This *is* a built-in deference result for the exchangeable/identical objective chance case.
      *   **Martingale Connection:** Your credence in `A` (`C_t(A)`) conditional on `θ` is a martingale as evidence `E_t` accumulates *until* `E_t` contains information making `θ` known or inadmissible. Once `θ` is known with certainty, `C_t(A)` = `θ` forever after, satisfying PP.

  2.  **Translations with Distortion:**
      *   **Admissibility (Scope):** Philosophically, "admissibility" often includes *temporal* concepts (e.g., "past" or "present" facts are admissible, pure "laws" might be). Statistical exogeneity/sufficiency is purely informational. The temporal asymmetry isn't inherently captured; it must be built into the model structure (e.g., defining `θ` relative to a filtration).
      *   **New Principle (NP):** Conditioning on "the complete theory of chance" `M_θ` translates *structurally* to conditioning on the full statistical model. *However*, in standard Bayesian stats:
          *   **Parameter vs. Law:** Conditioning on `θ` *is* often equivalent to conditioning on `M_θ` (e.g., `θ` defines a Bernoulli model). The "NP" feels like standard practice.
          *   **The Distortion:** The *problem* arises *only* because of the Humean definition `θ = f(X)`. In standard stats, `θ` is a *primitive* parameter defining the law `M_θ` *before* seeing `X`. `X` is generated *from* `M_θ`. The distortion is that Humeanism *reverses* this dependency: `θ` is *generated from* `X`. This makes conditioning on `θ = θ_0` implicitly conditioning on `X` (or `f^{-1}(θ_0)`), creating the self-reference.

  3.  **Significant Residue / No Clean Counterpart:**
      *   **Normativity & Rationality Constraint:** This is the **big one**. Bayesian statistics provides a framework for *coherent* (internally consistent) updating *given* a prior `π(θ)` and likelihood `P(X | θ)`. It **does not**, and **cannot**, normatively constrain what that prior *should be* (beyond coherence), absent further principles like calibration, maximum entropy, etc. The PP/NP, as presented philosophically, aims to be a *rationality constraint* binding *all* rational agents: "If you know the chance is `x`, you *must* set credence to `x`." Statistics has no equivalent *external* norm. You can *build* deference (`Cr(A | θ) ≈ θ`) into your prior (like de Finetti), but nothing *forces* you to. An agent with a prior strongly concentrated on wrong values (`Cr(A | θ = θ_0) ≈ 1 - θ_0`) is incoherent only if they *also* claim calibration; statistically, they just have a weird prior. **Residue Source:** Your vocabulary (standard Bayesian stats) fundamentally lacks an *objective normative* component for priors. This normativity is core to the philosophical debate.
      *   **Metaphysical Status of Chance:** Stats treats `θ` as a useful unknown quantity. Philosophy debates whether `θ` (objective chance) is a *primitive property* or *solely defined by`f(X)`* (Humeanism). This metaphysical question doesn't translate into stats syntax; it's about the *interpretation* of `θ`. The residue is philosophical.
      *   **The "Nastiness" of Undermining:** The profound weirdness of undermining futures *depends entirely* on accepting Humean supervenience (`θ = f(X)`). In standard stats, where `θ` is primitive and `X ~ P_θ`, the undermining problem **does not arise**. `P(U | θ = θ_0) > 0` is perfectly coherent, and conditioning on `θ = θ_0` certainly doesn't imply `P(U | θ = θ_0) = 0` unless `U` is logically impossible *within the model* `P_θ`. The residue is the specific metaphysical commitment (Humeanism) causing a technical self-reference issue within the PP formalism.

  ### Your Test Case Analysis
  *   **Setup:** Prior over coin bias `θ` allows hypotheses where `θ` shifts mid-sequence (e.g., `θ = θ_1` for flips 1-100, `θ = θ_2` for flips 101+). Early data `D_early` is informative about `θ_1`, but `θ_1` may be different from `θ_2`.
  *   **Is this Undermining?** **No, not directly.** This is **parameter instability** or **non-stationarity**.
      *   *Why not?* The chance parameter `θ_t` at time `t` (for flip `t`) is well-defined *at `t`* and supervenes only on the *local* mosaic relevant to flip `t` (or the mechanism at `t`). Knowing `θ_100 = 0.6` tells you about flip 100. It doesn't logically constrain `θ_101` (under your prior). A future `U` where `θ_101 = 0.4` doesn't undermine `θ_100 = 0.6`; it's just a different parameter later. `Cr(U | θ_100 = 0.6, D_early) > 0` is fine and expected.
  *   **Where Undermining Creeps In (Subtly):** If you define a "global chance property" `Θ` (e.g., "the average bias over all flips is 0.5") that supervenes on the *entire* sequence `X`, *then* a future `U` that makes `f(X) ≠ 0.5` *would* be undermining for the proposition `Θ = 0.5`. Conditioning on `Θ = 0.5` logically forbids `U`, yet a model assigning `Θ = 0.5` might give `U` positive probability.
  *   **Does "Condition on the Whole Theory" = "Condition on the Parameter"?** **Yes, but with the Humean caveat.** In your test case:
      *   The "theory of chance" for flip `t` is specified by `θ_t`. Conditioning on `θ_t` gives `Cr(A_t | θ_t) = θ_t`. This is standard Bayesian updating with a structured parameter (e.g., using a hidden Markov model).
      *   **The Disagreement Vanishes:** For a *primitive* parameter `θ_t` (or `θ` if stable), conditioning on it *is* deference, and no undermining problem arises. The philosophical disagreement *only* manifests if the "parameter" `θ` is *defined* as a global function `f(X)` of the entire data. In standard stats practice, parameters are *not* defined that way; they define the distribution *of* `X`. **The translation breaks precisely over the metaphysical interpretation of what the chance parameter *is***. The "disagreement" exists only if you insist on the Humean metaphysical picture (`θ = f(X)`), which creates a problem the statistical toolkit isn't designed to handle cleanly because it violates the assumption that `θ` is primitive and `X` is generated from `P_θ`.

  **Summary:** The core deference idea (`Cr(A | θ) = θ`) translates cleanly to calibration. Admissibility translates cleanly to exogeneity/sufficiency. de Finetti provides a beautiful deference result for exchangeable sequences. The *normative force* ("must") and the specific *metaphysical headache* of *Humean* undermining futures are the irreducible residue. Your statistical vocabulary lacks the normativity, and the undermining problem only arises when chance is interpreted metaphysically in a way (Humeanism) that makes it self-referential in a manner alien to standard statistical modeling. Your test case highlights that parameter instability isn't undermining; undermining requires a global, self-referential parameter definition. Where the translation holds, it clarifies. Where it fails, it reveals the philosophical stakes.
