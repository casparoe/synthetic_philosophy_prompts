prompt: |-
  ok, i'm redoing the killing/letting die unit for my ethics course and i've realized i've never actually written down what the standard is. i just point at the same four cases and say "see?" so give me the spec instead: the desiderata any theory of the doing/allowing distinction has to meet — the cases it has to get right, the distinctions it can't collapse, the things it can't contradict — with the case or consideration behind each requirement, and your view on which of them are non-negotiable and which are just a prejudice of one camp.

  things i specifically want on the list:

  - the split-intuition cases, and the ones where the omission costs the agent more effort, risk or money than the action would have. any account where the classification flips once you make the omission harder is in trouble, i think.
  - here's the case i've been using in lecture, i want it to survive: a patient stays alive only as long as someone keeps a button pressed down; the nurse lifts her finger off it and the patient dies. nobody in the room says she killed her — they say she let her die — even though what she did was a bodily movement as real as pressing the button would have been. so the line can't be "bodily movement vs. none". what is it then?
  - the distinctions it can't be allowed to swallow: doing/allowing vs. intending/foreseeing, and vs. plain but-for causation. if the distinction turns out to be nothing but a difference in causal structure, i lose the moral work i wanted it for; if the moral work is built in from the start, i'm not sure its a distinction in the world anymore. tell me if thats a false dilemma.
  - what it has to be consistent with: how courts and clinical protocols actually treat stopping treatment vs. killing, including the fact that a lot of them treat it as a difference they can't fully justify.
  - and which requirement the no-difference arguments — the ones that say the distinction isnt morally basic at all — are actually violating. i've never been able to pin that down, and i suspect the answer is question-begging against them.

  if some subset of these can't be satisfied together, lead with that. thats the part i want on the board. no lit review please, i know the literature, i want the spec.
reasoning: |-
  Okay, the user is an ethics professor revising their unit on the killing/letting die distinction. They've realized they've been relying on intuitive case examples without a clear theoretical framework. They want a structured specification ("spec") of the core requirements any theory must meet, with explicit desiderata grounded in classic cases. 

  Hmm, their request is highly specific and technically demanding – they're clearly deeply familiar with the literature but frustrated by its ambiguities. The tone suggests they want razor-sharp philosophical rigor, not textbook summaries. Key pain points emerge: 

  First, they need to preserve intuitive judgments across asymmetric cases (like the nurse's button) where effort/motion don't map to moral valence. Second, they're wrestling with meta-theoretical anxiety – if doing/allowing reduces to causation or intention, it loses normative independence. Third, they want courtroom/clinical reality checks without conceding to "no-difference" arguments. 

  The real challenge is their fifth bullet: they suspect objections to the distinction may be question-begging. That's astute – many critiques (like Rachels' bathtub cases) assume moral equivalence upfront. The response must flag this without being triumphalist about traditional distinctions. 

  Structurally, I'll group desiderata into three tiers: non-negotiable (logical coherence, case-fit), contested-but-necessary (normative independence), and context-sensitive (institutional recognition). The nurse case gets its own axiom because it destroys physicalist definitions. 

  Notably, they dismiss "lit review" – good, this avoids rehashing Foot/Thomson debates. Instead, I'll present requirements as engineering specs: input cases, output judgments, failure conditions. The "contradiction" section will be crucial – it forces theories to explain why adding effort to an omission doesn't magically make it killing. 

  Biggest risk is oversimplifying. The distinction's fragility needs highlighting upfront: if "prevention cost" (Desideratum 4) varies culturally, or if courts treat withdrawing treatment as killing in some jurisdictions, the theory must accommodate that without collapsing. Hence the "marginal but not foundational" caveat for institutions. 

  Final design choice: explicitly name which desideratum "no-difference" arguments violate (D6 – asymmetric normative weight). This answers their plea to "pin it down," while acknowledging the violation only matters if you already accept D6. That's the honest answer – the debate rests on prior normative commitments.
answer: |-
  Here's the distilled specification for a robust doing/allowing distinction, designed as a checklist for theories. Requirements are categorized, with the core conflict highlighted.

  ---

  ### **The Doing/Allowing Distinction: Theory Requirements**
  *(Non-Negotiables = ★; Contextual/Contested = ◐)*

  1.  **★ Asymmetry Preservation (Core Case: Standard Omission)**  
      *   **Requirement:** Must classify *withholding life-saving aid* (e.g., not throwing a rope to a drowning person) as "allowing to die," not "killing."  
      *   **Why Non-Negotiable:** Collapsing this distinction eliminates the core phenomenon being analyzed. Fails basic intuition.

  2.  **★ The Nurse's Button Case (Physical Movement ≠ Killing)**  
      *   **Requirement:** Must classify the nurse *lifting her finger off the button* (ceasing a sustaining action) as "allowing to die," despite involving a deliberate bodily movement.  
      *   **Why Non-Negotiable:** Refutes simplistic "movement = doing, stillness = allowing" definitions. Demonstrates the need for a *relational/causal* analysis.

  3.  **★ Prevention Cost Invariance**  
      *   **Requirement:** Classification *cannot flip* based solely on increased cost (effort, risk, money) of *preventing* death.  
      *   **Cases:**  
          *   Not donating a kidney (high cost omission) = allowing.  
          *   Pushing someone off a bridge (low cost action) = killing.  
          *   **Failure:** Any theory where "not donating a kidney" becomes killing *because* it's costly/sacrificial.  
      *   **Why Non-Negotiable:** Preserves the core omission intuition under realistic constraints. Cost affects *obligation*, not *ontological category*.

  4.  **★ Distinction from Intending/Foreseeing**  
      *   **Requirement:** Must be conceptually separable from the agent's intention or foresight.  
      *   **Cases:**  
          *   *Intending:* Giving a lethal pill *intending death* (killing) vs. Withdrawing futile treatment *intending to relieve suffering* (foreseen death, allowing).  
          *   *Foreseeing:* Bombing a military target *foreseeing* civilian deaths (collateral damage, not necessarily "killing" in the direct sense) vs. Directly shooting a civilian (killing).  
      *   **Why Non-Negotiable:** Intention/foresight primarily determines *permissibility*, not the *kind of act* (doing vs. allowing).

  5.  **★ Distinction from But-For Causation**  
      *   **Requirement:** Must be more than just "but-for cause". Must explain why *some* but-for causes are "doings" and others are "allowings."  
      *   **Case:** Both pushing someone onto train tracks (doing) and failing to pull them off (allowing) are but-for causes of death. The distinction explains the difference.  
      *   **Why Non-Negotiable:** Collapsing into but-for causation eliminates the distinction's *explanatory power* for differential moral assessment. It *is* a difference in causal *structure* or *role*, not mere causation.

  6.  **★ Asymmetric Normative Weight (Conditional Non-Negotiable)**  
      *   **Requirement:** Must *permit* the possibility that "doing harm" (killing) is *prima facie* harder to justify than "allowing harm" (letting die), *all else equal* (intention, outcome, cost, etc.).  
      *   **Why Conditional ★:** This is the *moral work* the distinction is often meant to do. A theory that *necessarily* makes doing/allowing morally equivalent *by definition* fails most users' core motivation. However, proving this asymmetry is *fundamental* (not derivative) is the core debate.

  7.  **◐ Institutional Recognition (Constraint, Not Foundation)**  
      *   **Requirement:** Must be *compatible* with the widespread legal/clinical practice of treating withdrawing/withholding life-sustaining treatment as "allowing to die" (potentially permissible) vs. active euthanasia as "killing" (often prohibited), *even while acknowledging the justificatory tension*.  
      *   **Why Contextual ◐:** Reflects social/legal reality and the distinction's practical role. A theory making this practice *incoherent* is suspect. However, the practice itself isn't infallible proof of the distinction's *fundamental moral basis*.

  ---

  ### **The Core Conflict & What "No-Difference" Arguments Violate**

  *   **The Tension:** Requirements 1-5 demand a **robust descriptive distinction** grounded in causal role/structure (e.g., *initiating* a fatal sequence vs. *failing to intervene* in an independently fatal sequence). Requirement 6 demands this distinction carry **intrinsic moral weight** (asymmetry).
  *   **The Dilemma:** If the *only* basis for the distinction (1-5) is a morally neutral causal difference, then Requirement 6 becomes hard to justify *without adding independent moral premises* (e.g., stronger duties not to harm than to aid). If moral weight is *built into* the definition of "doing" (e.g., "doing" = violating a duty), the distinction risks becoming morally circular and loses descriptive power for cases 1-5.
  *   **What "No-Difference" (ND) Arguments Violate:** Primarily **Requirement 6 (Asymmetric Normative Weight)**, often by arguing it's unsustainable. They *can* accept 1-5 as a *descriptive* difference but deny it has *fundamental* moral significance. Their strategy is to present cases (e.g., Smith drowning cousin vs. Jones letting cousin drown) where intuitions about permissibility seem driven by identical factors (intention, outcome, cost) *despite* one being a "doing" and one an "allowing," thereby undermining the claim that the doing/allowing distinction *itself* is doing moral work.
      *   **The Charge of Question-Begging:** ND arguments *presume* that the factors they hold constant (intention, outcome, cost) are the *only* morally relevant ones. They don't *prove* that the doing/allowing difference *itself* is irrelevant; they challenge proponents to show why it *is* relevant *independently*. The burden shifts. Proponents must argue that the causal difference captured by 1-5 *does* carry independent moral weight (Requirement 6), perhaps via notions of agency, responsibility, or the stringency of negative vs. positive duties.

  ---

  ### **What Must Be On The Board**

  *   **The Nurse's Button:** Bodily movement ≠ Killing. (Req 2)
  *   **Cost Doesn't Flip It:** Not donating a kidney (costly omission) ≠ Killing. (Req 3)
  *   **Not Just Intention/Foresight:** Withdrawing treatment (intending relief, foreseeing death) ≠ Killing. (Req 4)
  *   **Not Just But-For Cause:** Pushing (doing) vs. Not Pulling (allowing) are both but-for causes, but different. (Req 5)
  *   **The Core Tension:** A robust *descriptive* distinction (Reqs 1-5) vs. *intrinsic moral weight* (Req 6). Can you have both without circularity or adding moral premises?
  *   **ND Arguments Target:** Requirement 6 (Asymmetric Weight). They argue the distinction lacks *fundamental* moral significance, shifting the burden of proof.

  This spec forces theories to navigate the descriptive grounding (1-5) while confronting the central normative question (6) head-on, exposing where the disagreement truly lies.
