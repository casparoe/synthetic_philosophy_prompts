prompt: |-
  I'm a cognitive science graduate student who has drifted into philosophy of mind by way of a reading group, and I've been trying to get clear on epiphenomenalism, a position none of us knew much about coming in. The lecturer who ran last week's session, a functionalist with no patience for dualism, handed out a short summary of the view and of what he called the paradox of phenomenal judgment, and I've been chewing on it ever since without being able to tell how much of it to trust. Here is the gist of the handout. Epiphenomenalism is the thesis that conscious experiences are caused by brain processes but never cause anything in turn: experiences are perfectly real, but they are side effects, like the steam whistle on a locomotive, which makes a noise but does no work. The paradox of phenomenal judgment is the standard objection to this, and it runs as follows. If experiences have no causal powers, then my belief that I am currently having an experience cannot have been caused by the experience itself; it must be produced entirely by brain processes. But then my beliefs about my own consciousness would be reliable only by accident, since nothing in their production is ever actually connected to the experiences they purport to be about. Epiphenomenalism therefore cannot be true, because it makes it impossible for anyone to know that consciousness exists, including the epiphenomenalist himself, who thus cannot even coherently state his own view. That closing move is what I keep stumbling over, and it is why I am writing: I have a nagging sense that the handout is getting something subtly wrong, but I cannot put my finger on where the fault line runs.

  Could you go through the handout sentence by sentence and tell me what a philosopher of mind working on this material would accept as fair, what is a common simplification that needs a caveat, and what is a genuine misrepresentation, either of the position or of the objection? I would especially like to know whether the self-defeat conclusion follows from the parts of the summary that are accurate, that is, whether epiphenomenalism really does make itself unknowable or unassertable, or whether that is a stronger claim than the paradox actually supports; and I would like to hear what an epiphenomenalist would say in his own defense, since the handout never concedes that there are any replies. Please write this as continuous prose, the way you would explain it to a colleague in a long email: no headings, no bullet points, no bold text, and no tables.
