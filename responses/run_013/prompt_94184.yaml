    Entire string only:
        Start: "A"
        Rules:
          1. If the string is "A", you can replace it with "B".
          2. If the string is "B", you can replace it with "A".
          3. If the string is "A", you can replace it with "AA".
          4. If the string is "B", you can replace it with "BB".
          5. If the string is "AA", you can replace it with "B".
        Goal: "BA" (which is two letters).

        Can we get a two-letter string? 
            We can do: 
              Start: "A" -> rule3: "AA"
            Now we have "AA", which is two letters. 
            But we want "BA", not "AA". 
            From "AA", we can only apply rule5: to "B". 
            Then we are back to one letter. 
            Or if we don't apply rule5, we have "AA", which is not "BA". 
            Can we get "BA"? 
            We cannot because there's no rule that produces a mixed string. 

        Therefore, the invariant: the string is either all A's or all B's. 
            Start: "A" -> all A's.
            Rule1: "A"->"B": all B's.
            Rule2: "B"->"A": all A's.
            Rule3: "A"->"AA": all A's.
            Rule4: "B"->"BB": all B's.
            Rule5: "AA"->"B": all B's.
            So always homogeneous. 
            "BA" is not homogeneous. 
            Therefore, impossible. 

    This is a non-modular invariant. 

    So we present this as the second puzzle. 

    Rules for the second puzzle (entire string replacement only):
        1. A -> B
        2. B -> A
        3. A -> AA
        4. B -> BB
        5. AA -> B
        Goal: BA

    Invariant: every string in the derivation is either "A", "B", "AA", "BB", and in every case, it's composed of a single letter. 
    BA is two different letters -> not homogeneous -> not derivable. 

  **5. Debrief (15 minutes):**
  - Discuss the two puzzles:
    a) In the MU puzzle, we found that no matter what we did, we couldn't get MU. We stepped out and saw that the number of I's mod3 is never 0, and that's why.
    b) In the second puzzle, we saw that we can only ever have homogeneous strings, and BA is not homogeneous.

  - Key points:
    - In both cases, we were working within the system (applying rules) but then had to step out to prove impossibility.
    - The invariant argument is a proof about all possible derivations. It is not a step within the system because it doesn't derive a string; it reasons about every string that can be derived.
    - Distinguish between:
        - Object language: the language of the system (strings in the MU puzzle, or in the second puzzle).
        - Metalanguage: the language we use to talk about the system (English + math to discuss invariants).
    - What if we added the invariant as a new rule? 
        - For the MU puzzle: we might add a rule that says "you cannot have a string with a multiple of 3 I's", but that is a negative rule and doesn't help us derive anything. 
        - Alternatively, we might add a rule that says "you can only apply a rule if it doesn't make the number of I's mod3=0", but that is a restriction, not a derivation. 
        - In the second puzzle, we might add a rule that allows us to produce "BA", but then we are changing the system. 
        - The point: adding the invariant as a rule is not the same kind of rule as the ones in the system. The system's rules are purely syntactic (manipulate strings), while the invariant rule is a meta-rule (about properties of states). 

    - Why can't the system itself include the invariant argument? 
        - Because the system only allows finite sequences of string manipulations. The invariant argument requires mathematical induction over all possible derivations. 

    - What is concealed by the ease of these puzzles? 
        - In these puzzles, the invariants were relatively easy to find. But in general, there is no algorithm to find such invariants. This is part of the general phenomenon of undecidability: there is no general procedure to determine if a string is derivable in an arbitrary formal system. 

  - Predictable issues:
    a) Groups might not get anywhere with the MU puzzle and get frustrated. 
        - Mitigation: Encourage them to keep track of their steps and look for patterns. 
    b) Someone might find the invariant quickly and then the others feel left out. 
        - Mitigation: Ask that group to see if they can find a derivation that breaks the invariant? Or to explain why they think it's impossible. 
    c) In the second puzzle, they might not understand the rules (entire string replacement). 
        - Mitigation: Clarify at the beginning that the rules match the entire string. 

  - What the activity cannot reproduce:
    - The fact that in general, there is no algorithm for finding invariants. In these puzzles, we found them quickly, but that is because they are designed to be easy. In more complex systems, it might be impossible to find an invariant or to prove impossibility. 

