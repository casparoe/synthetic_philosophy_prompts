            Step: replace another III by U: MUUII -> 2 I's mod3=2
            Step: remove UU: MII -> 2 I's mod3=2
            Step: double: MIIII -> 4 mod3=1
            Step: double: MIIIIIIII -> 8 mod3=2
            Step: replace one I by U? We don't have that. 
          But we have rule5: replace U with I. 
            But we don't have any U's at the moment. 
