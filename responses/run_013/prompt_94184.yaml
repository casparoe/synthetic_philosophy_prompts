               Replace "b" by "a": "aa"
               Replace "b" by "bb": "bba"
               Replace "a" by "b": "bb"
               Replace "a" by "aa": "baa"

            Now we have "aab", "abb", "bba", "baa", etc. 
            Then we can get "aba"? 
              We have "ab": 
                  Replace the "a" by "aa": "aab" -> not "aba".
                  Replace the "b" by "a": "aa" -> then we can replace one "a" by "aa": "aaa", or by "b": "ba" -> then from "ba", we can replace "b" by "bb": "bba", etc. 
              How to get "aba"? 
