          5. You can replace any occurrence of 'U' with 'I'.   [New rule]

        Goal: MU

        Now with rule5, we can convert U to I. 
          We can get MU? 
          How: 
            Start: MI
            Step: MII (rule2)
            Step: MIIII (rule2)
            Step: MIIIIIIII (rule2) -> 8 I's -> mod3=2? 
