            Step: replace three I's (say the first three): MU + UIIIIU -> MUUIIIIU -> then remove UU: MIIIIU -> 4 I's
            Step: double: MIIIIUIIIIU -> 8 I's -> then replace three I's: MU + IUIIIIU -> MUIUIIIIU -> 5 I's
            ... 

