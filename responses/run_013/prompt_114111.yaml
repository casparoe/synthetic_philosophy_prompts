  ## Office of Non-Existent Person Welfare (ONEPW)  
  **Procreation Licensing: Frequently Asked Questions**

  **1. What is the purpose of the ONEPW and its licensing requirement?**  
  The Office ensures potential persons are not subjected to foreseeable, robustly negative welfare states by coming into existence. Section 12(b) of the Ethical Baseline Act mandates prospective parents secure a *Prevention of Harm License* prior to conception. This license confirms the absence of conditions likely to impose a significant welfare deficit on the resulting person. We do not license for positive welfare outcomes, as such states cannot constitute a benefit *to* the person brought into existence. Preventing harm is our sole statutory remit.

  **2. How does the ONEPW determine if non-existence is "better" for a potential person?**  
  Comparative assessment is straightforward. We identify whether projected net welfare falls below the relevant threshold ("robustly negative"). If it does, bringing that person into existence constitutes a harm. Non-existence is the default comparator state. Crucially, non-existence contains no subject for whom "better" or "worse" applies; it is simply a state of affairs where the specific harm *of coming into existence with a deficit* is avoided. Licensing hinges on demonstrating the *absence* of the harm condition, not on proving non-existence is "better" in a subjective sense. The harm lies solely in the transition *into* a deficit state.

  **3. Under what conditions is a Prevention of Harm License granted?**  
  A license is granted if and only if prospective parents demonstrate, via Form PHL-7A (Projected Welfare Deficit Assessment) and supporting medical/genetic/socioeconomic documentation, that the projected net welfare state of the potential person is *not* robustly negative. This is a binary determination. We maintain exhaustive criteria and actuarial models for deficit projection. Note: A license does *not* signify projected positive welfare; it merely confirms the absence of projected deficit sufficient to constitute harm. The license permits conception *only* under this specific condition of harm prevention.

  **4. Does this mean the ONEPW discourages or forbids having children who *would* have happy lives?**  
  This reflects a common misunderstanding. The ONEPW has no statutory mandate concerning potential persons projected to experience net positive welfare. Our legislation addresses only the prevention of harm associated with coming into existence under deficit conditions. Choosing not to conceive a person projected to experience positive welfare falls entirely outside our purview; it is neither encouraged, discouraged, nor regulated. Our focus is solely on preventing the initiation of harmful existences. Conception in the absence of a projected deficit is permissible (licensed), but never obligatory. Obligation arises only in the duty to *avoid* causing harm through conception under deficit conditions.

  **5. Isn't it strange to say never existing is "better," when there's no one there to be better off? How is that a real comparison?**  
  The question misstates the comparison. We do not assert that non-existence is a "better" state *for* a subject. Non-existence has no subject. The assertion is that *bringing someone into existence* under conditions of projected robustly negative welfare *harms that person*, because it places them in a bad state they would not otherwise have been in. The relevant comparator is the state of affairs *without* that specific person's existence – a state where *that particular harm* does not occur. The harm is inherent in the act of creation under those specific, deficit-laden circumstances. See also Q2 regarding the default comparator state.

  **6. Why is there no license or procedure for ensuring potential people experience happiness or positive welfare?**  
  Administrative resources are finite and must be deployed where statutory duties mandate intervention – namely, preventing the harm of initiating existence under a deficit. Initiating existence under positive conditions does not constitute a harm to the person created, nor does it confer a benefit *upon them* in a way that creates a licensable event or a duty to act. Licensing exists solely to prevent a specific harm. Creating a person without a deficit avoids that harm, fulfilling the relevant ethical baseline. Instituting procedures for positive outcomes would constitute an unjustified expansion of bureaucracy beyond our core harm-prevention mandate and lacks any foundational ethical imperative equivalent to the duty not to harm. This is a matter of efficient resource allocation and statutory focus.

  **7. What about the argument that by not creating happy people, we're missing out on potential good? Doesn't that matter?**  
  The concept of "missing out on potential good" pertains to abstract states of affairs or perhaps the interests of existing persons desiring such creations. It does not pertain to a duty *owed to* the potential person themselves. There is no potential person existing in a state of deprivation who is owed existence and happiness. Our mandate concerns only identifiable harms inflicted *on specific persons* by the act of bringing them into existence. The potential for a "good" state of affairs absent a specific subject harmed by its non-realization falls outside our legislative framework. Concerns regarding aggregate welfare states are not within the ONEPW's jurisdiction. Focus remains on the individual harm principle.

  **8. Who reviews the PHL-7A forms?**  
  Trained Welfare Deficit Assessors (WDAs) review all submissions against standardized criteria. Assessors utilize validated projection models accounting for genetic predispositions, familial resources, environmental factors, and anticipated life-course challenges. Decisions are based solely on the projected welfare state of the potential person. Appeals can be lodged via Form PHL-12 within 30 days of decision notification.

  **9. I believe my neighbor conceived without a license. What should I do?**  
  Report suspected unlicensed conception immediately via our confidential hotline or online portal (Form ULC-1). All reports are investigated. Conceiving without a license where a projected deficit exists is a serious ethical violation under Section 12(b). Penalties apply.
