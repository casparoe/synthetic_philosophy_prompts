  ## Epistemics Department: New Hire Orientation Handbook (v.7.3)  
  **Section 4: Knowledge Acquisition Protocols & Approved Pramāṇas**

  Welcome to OmniCorp Solutions. Our competitive advantage lies in our rigorous commitment to Valid Knowledge (Pramā). To ensure organizational clarity and eliminate error, all actionable claims **must** be validated through one of the four Approved Means of Knowing (Pramāṇas) and submitted via the appropriate departmental form. Deviations compromise epistemic integrity and operational efficiency.

  **1. Approved Pramāṇas & Submission Procedures:**

  *   **Perception (Pratyakṣa):** Direct sensory input meeting the *Triple-C Condition* (Clear, Contiguous, Confirmable). Submit **Form P-1**.
      *   *Examples:* "The server light is red," "Audit log shows entry at 09:47."
      *   *Exclusions:* Hunch-based "sensing," ambiguous inputs ("The room *feels* tense"), or reports failing the Triple-C. Do not submit dreams.
  *   **Inference (Anumāna):** Logical deduction based on a *Perceptually Established Universal Relation* (Vyāpti) between a Mark (Liṅga) and the Target (Sādhya). Submit **Form I-2a (Deductive)** or **I-2b (Probabilistic, Risk Assessment Required)**.
      *   *Example:* "Smoke (Mark) is observed; Where there's smoke, there's universally fire (Vyāpti); Therefore, there is fire (Target)."
      *   *Critical:* The Vyāpti *must* be certified by the Epistemics Department (see Reference Pamphlet R-7: "Pre-approved Vyāptis & Certification Process"). Uncertified correlations will be rejected. **This is the most common point of failure.**
  *   **Comparison/Analogy (Upamāna):** Establishing knowledge of an unknown entity based on its similarity to a known entity. Submit **Form U-3**.
      *   *Example:* "Client described their new 'zoomerang' device as 'like a boomerang, but returns faster.' This allows identification upon sight."
      *   *Note:* Strictly limited to identification via similarity. Not for predictive modeling, functional extrapolation, or metaphor. Analogy Desk hours: Tuesdays & Thursdays, 10 AM - 12 PM. Expect processing delays.
  *   **Verbal Testimony (Śabda):** Reliable communication from an Authoritative Speaker (Āpta). Submit **Form B-7: Verbal Testimony (Non-Hearsay)**.
      *   *Āpta Certification Criteria:* Speaker must be demonstrably (1) Competent on the Topic (Form B-7a: Competency Dossier Required), and (2) Non-Deceptive (Form B-7b: Truthfulness Affidavit or Prior Reliability Index Score > 0.85).
      *   *Hearsay Protocol:* Testimony citing another source requires separate, validated Form B-7 submissions for *each* link in the testimonial chain. Unbroken chains are rare; consider alternative pramāṇas.
      *   *Philosophical Note:* Reliability is *not* assumed. Burden of Āpta certification lies entirely with the submitter. Policy is agnostic regarding scriptural authority; focus is solely on speaker reliability within the stated context.

  **2. Unapproved & Problematic Submissions:**

  *   **Arthāpatti (Postulation/Implication):** Claims derived from circumstantial necessity or unexplained incongruity are **not recognized** as a distinct pramāṇa.
      *   *Example:* "Project Lead was absent during breach window + Lead has unique access = Lead responsible." (Rejected).
      *   *Procedure:* The Inference Desk (I-2) will review such submissions. If viable, they will be recategorized as *Inference* upon establishing a certified Vyāpti (e.g., "Absence + Unique Access universally implies Responsibility in Security Contexts"). **Do not submit Form A-5 (discontinued).** Persistent use of "arthāpatti" terminology may trigger a Performance Epistemics Review (PER).
  *   **Other Exclusions:** Intuition (Anubhava), Presumption (Bhāvanā), Gestalt Recognition, and "Common Sense" (unless demonstrably decomposable into approved pramāṇas) are invalid bases for action.

  **3. Handling Doubt (Saṃśaya) & Error (Bhrama):**

  *   **Doubt:** A state of unresolved alternatives. Submit **Form D-8: Statement of Doubt** detailing the conflicting cognitions (e.g., "Data suggests Market A *or* Market B is declining"). The Epistemics Department will initiate an investigation using approved pramāṇas to resolve the doubt. **Do not act under unresolved doubt.**
  *   **Error:** Organizational error is defined exclusively as *Misattribution* (Anyathākhyāti) – taking one thing for another thing that *does* exist (e.g., mistaking a coiled rope for a snake). Submit **Form E-9: Error Report** detailing the misidentification.
      *   *Important:* The "Non-Existent Object" theory of error (Asatkhyāti) is incompatible with OmniCorp policy. Errors arise from faulty attribution, not perception of non-things. See Mandatory Memo EP-001: "The Ontological Grounding of Operational Error" (Compliance Training Module 7).

  **4. Appeals Process:**

  Disputes regarding pramāṇa classification, Āpta certification, or Vyāpti validity may be appealed using **Form AP-10 (Appeal: Epistemic Grounding)**. Submit in triplicate to the Senior Epistemics Officer. Grounds for appeal must cite specific policy violations or new, perceptually validated evidence. Appeals based on "fairness," "practicality," or the perceived elegance of arthāpatti will be summarily dismissed.

  **Remember:** Clear categorization is the bedrock of actionable knowledge. When in doubt about the appropriate pramāṇa, consult the Epistemics Desk *before* submission. Efficiency flows from epistemic hygiene.

  ---
  **Epistemics Department:** Suite 305 • Hours: 8:30 AM - 5:00 PM • knowledge.protocols@omnicorp.example.com • "Validating Your Operational Reality Since 2005"
