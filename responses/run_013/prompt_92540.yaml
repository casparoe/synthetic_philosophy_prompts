answer: |-
  ### Design for the 90-Minute In-Class Betting Game  
  **Goal:** Illustrate the gap between maximizing expected wealth (arithmetic mean) and maximizing long-run growth (geometric mean) via non-ergodicity, using a repeated betting game.

  ---

  #### **Game Structure (45 minutes)**  
  1. **Setup (5 min)**  
     - Each student starts with **1,000 points**.  
     - **Rules explained:**  
       - Each round, a shared coin is flipped (P(heads) = 0.6).  
       - Before each flip, students privately choose a fraction `f` (0 ≤ `f` ≤ 1) of their *current* wealth to stake.  
       - **Heads**: Stake doubles (wealth = wealth + staked amount).  
       - **Tails**: Stake forfeited (wealth = wealth - staked amount).  
     - **Scoreboard:** Projected and updated after each round, showing:  
       - **Mean wealth** (across all students).  
       - **Median wealth**.  
       - Top 5/bottom 5 wealths (optional, to highlight inequality).  

  2. **Gameplay (35 min; ~1 min/round × 30 rounds)**  
     - **Each round:**  
       - Students write `f` on a slip (e.g., 0.1, 0.5, 1.0) and hand it to the facilitator.  
       - Facilitator flips the coin (simulate digitally/spinner for speed; fix outcomes beforehand to ensure 60% heads).  
       - Wealth updated:  
         - **Heads**: `wealth_new = wealth_old × (1 + f)`  
         - **Tails**: `wealth_new = wealth_old × (1 − f)`  
       - Update scoreboard with mean/median.  
     - **Bankruptcy rule:** If wealth ≤ 1, set to 1 (avoids log(0) errors; allows continued play).  

  3. **Final Tally (5 min)**  
     - Display final wealth distribution.  
     - Identify top/bottom performers.  
     - Poll students: "Who bet >50%? Who bet <20%?"  

  ---

  #### **Debrief (40 minutes)**  
  1. **Map Observations to Theory (15 min)**  
     - **Arithmetic vs. geometric mean:**  
       - Expected wealth growth per round if betting fraction `f`:  
         `E[wealth] = 0.6 × (1 + f) + 0.4 × (1 − f) = 1 + 0.2f`  
       - Maximizing `E[wealth]` → bet `f = 1` (all-in), giving 1.2× growth/round.  
       - But geometric mean growth (long-run rate):  
         `G(f) = (1+f)^0.6 × (1−f)^0.4`  
       - Maximizing `G(f)` → maximizes long-run growth.  
     - **Why bankruptcy happens:**  
       - All-in (`f=1`) → 40% chance of ruin each round. Over 30 rounds, P(survival) ≈ (0.6)^30 ≈ 0.00002%!  
       - **Non-ergodicity:**  
         - *Ensemble average* (mean wealth across students) grows at 1.2× if all bet `f=1`.  
         - *Time average* (individual path): Almost all go to zero. The mean ≠ typical experience.  

  2. **Reveal the Optimal Strategy (10 min)**  
     - **Growth-optimal fraction:** `f* = 0.2` (Kelly criterion for known bias).  
       - Maximizes expected log(wealth):  
         `E[log(wealth)] = 0.6·log(1+f) + 0.4·log(1−f)`  
       - Solve: max at `f = 0.6 − 0.4 = 0.2`.  
     - **Check with survivors:**  
       - Top performers likely bet near 20%. Median wealth likely dominated by `f ≈ 0.2` bettors.  
       - Calculate growth of `f=0.2`:  
         - Per-round growth factor: `1.2^0.6 × 0.8^0.4 ≈ 1.0203` (2.03% growth/round).  
         - After 30 rounds: `1000 × 1.0203^30 ≈ 1824` points.  

  3. **Limitations of the Game (5 min)**  
     - **Cannot prove growth-optimal is "rational":**  
       - In a **one-shot bet**, linear utility → maximize `E[wealth]` (bet `f=1`).  
       - Repeated bets → maximize geometric growth (bet `f=0.2`). Rationality depends on context.  
     - **Unknown bias:**  
       - If P(heads) is unknown, overbetting (`f > 0.4`) leads to ruin faster than underbetting (`f < 0.2`).  
       - The game assumes known P(heads)=0.6.  

  ---

  #### **Predictable Problems & Solutions**  
  1. **Problem:** Slow f-submission → delays rounds.  
     **Solution:** Use pre-printed f-cards (0.0, 0.1, ..., 1.0) for students to hold up simultaneously.  

  2. **Problem:** Bankruptcy demotivates students.  
     **Solution:**  
     - Set ruined wealth to 1 (not 0) to allow continued play.  
     - Emphasize: "Bankrupt? Observe how f affects recovery!"  

  3. **Problem:** Math-heavy concepts lose students.  
     **Solution:**  
     - Use visuals: Plot mean vs. median over rounds to show divergence.  
     - Simplify formulas: Focus on intuition (e.g., "betting all-in wins big but loses everything eventually").  

  4. **Problem:** Outlier wealth skews mean.  
     **Solution:**  
     - Highlight median as the "typical" experience.  
     - Contrast a survivor’s log with a bankrupt’s log.  

  5. **Problem:** Students copy neighbors’ bets.  
     **Solution:**  
     - Privatize decisions (secret slips).  
     - Debrief: "Did social pressure affect you?"  

  ---

  #### **Materials**  
  - **Scoreboard:** Spreadsheet (Google Sheets) projected live.  
  - **Coin flip:** Digital simulator (e.g., random.org) or pre-generated sequence.  
  - **Betting slips:** Index cards with f-options.  

  This design ensures students *experience* the tension between short-term gains and long-term survival, then unpack it via non-ergodicity and the Kelly criterion. The limitations discussion preempts overgeneralization while reinforcing key decision-theory nuances.
