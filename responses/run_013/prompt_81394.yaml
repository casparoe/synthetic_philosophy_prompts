  **How it meets your requirements:**

  1.  **Sestina Form:** Strict 39 lines (6 stanzas of 6 lines, 3-line envoi). The relentless permutation of the end-words mirrors the recombination the narrator fantasizes about but intellectually rejects.
  2.  **End-Words:** Chosen for argument and emotional weight:
      *   **me:** The core anchor, forced to shift meaning: the narrator's current self, the hypothetical sibling-self, the essential "I" tied to origin, the self mourned by the sibling.
      *   **other:** The siblings, the alternate possibility, the fundamental difference.
      *   **same:** The desired equivalence, the shared biological material, the logical impossibility of being identical selves.
      *   **only:** The singularity of her existence, the limitation, the feeling of being the sole survivor.
      *   **never:** The impossibility of the fantasy, the paths not taken *by her*, the negation of equivalence.
      *   **egg:** The biological root, the shared origin point, the donor's contribution.
  3.  **Philosophical Rigor:**
      *   The necessity-of-origin view is central: "bone and thought insist: it had to be **me**", "the essence isn't shared", "knit from the split shell of one **egg**, / but not a shadow-life for this lost **me**", "Because the essence isn't shared. It's **only** / tied to the spark that caught."
      *   The modal logic is explicit: "That path, that womb, that breath? **Never** / yours, if chosen. Just a different **same**- / ness...", "The worlds where you exist? **Never** / worlds where *I* draw breath."
