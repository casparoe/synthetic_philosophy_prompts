prompt: |-
  You are a professional philosopher working in epistemology — specifically on the post-Gettier literature, the principle of epistemic closure, and sensitivity and safety accounts of knowledge. Please think carefully before answering, and begin by privately brainstorming the space of possible readings of the slogan below; then give me a structured, decision-useful answer rather than a survey of the field.

  Context: I've read rationalist blogs and forums for years, and I keep watching the same one-liner get used as a conversation-stopper. The line is that knowledge is closed under known entailment — roughly, that if you know P, and you know that P entails Q, then you know Q. I most recently met it in a thread about radical skepticism, where it was deployed to argue that because I do not know I am not a brain in a vat, I therefore do not know I have hands. The day before I saw the same sentence doing the opposite kind of work in a lottery thread, where it was used to insist that since I know each individual ticket will lose, and I know that entails that no ticket wins, I must somehow know the thing I plainly do not. And in a third thread someone told me flatly that Nozick's tracking theory denies the principle outright, which left me unable to tell whether he was rebutting the other threads or simply talking past them.

  What I want is a disambiguation, not a verdict. Lay out the distinct precise theses the one-liner could be expressing, along the axes that actually matter, and for each say whether it is trivial, substantive but defensible, or false. Among the axes I care about: whether closure is a single-premise or a multi-premise principle; whether the relatum is knowledge, justified belief, or rational credence; whether the entailment premise requires that you know the entailment, or merely that you believe it or are in a position to know it; whether the principle is a constraint on the concept of knowledge, a rule of inference we are entitled to rely on, or a trivial consequence of something else; whether it is meant as a necessary truth about the concept or as a norm governing assertion and inquiry; and — this is the one I most want — which of these readings a sensitivity or tracking account of knowledge is actually committed to rejecting, and why the brain-in-a-vat case makes the difference it does. Tell me which readings would license the skeptic's modus tollens and which the Moorean modus ponens, and whether any part of the apparent dispute is merely verbal. Then tell me which reading the people who drop this line to end an argument most likely have in mind, and whether that reading does the work they want it to.

  Please don't hand me a reading list or citations — I can't check them and they won't help; reason from the ideas themselves. Finish with the single question you would ask to find out which reading a given interlocutor is actually committed to.
