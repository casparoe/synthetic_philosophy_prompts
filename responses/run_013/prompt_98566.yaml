answer: |-
  Here is a disambiguation of "knowledge is closed under known entailment," structured for decision-usefulness. I'll define key readings along critical axes, assess their status, and pinpoint implications for skepticism, lottery cases, and tracking theories. The core tension arises from **whether knowledge requires modal conditions (sensitivity/safety) that aren't preserved by deductive logic alone**.

  ---

  ### **Axes of Disambiguation & Key Readings**
  1. **Scope of Entailment:**  
     - **Single-Premise Closure (SPC):** If S knows *P*, and knows *P entails Q*, then S knows *Q*.  
     - **Multi-Premise Closure (MPC):** If S knows *P₁*, ..., *Pₙ*, and knows {*P₁*, ..., *Pₙ*} entail *Q*, then S knows *Q*.  
       *Relevance:* MPC risks "aggregation" problems (e.g., lottery cases).

  2. **Relatum (What is "Closed"?):**  
     - **Knowledge (K-Closure):** The original claim.  
     - **Justified Belief (JB-Closure):** If S justifiably believes *P* and justifiably believes *P entails Q*, then S has justification to believe *Q*.  
     - **Rational Credence (RC-Closure):** If S's credence in *P* is rational, and in *P→Q* is rational (≈1), then credence in *Q* should be rational (≈1).  
       *Relevance:* JB/RC are often defensible; K-Closure is contested.

  3. **Entailment Condition:**  
     - **Known Entailment (KE):** S *knows* that *P* entails *Q*.  
     - **Believed Entailment (BE):** S *believes* (justifiably or not) that *P* entails *Q*.  
     - **In Position to Know (IPK):** S *could* easily know *P* entails *Q* (e.g., trivial deduction).  
       *Relevance:* KE is standard; IPK weakens the principle.

  4. **Status of the Principle:**  
     - **Conceptual Necessity (CN):** True by definition of "knowledge" (e.g., if knowledge = justified true belief + *X*).  
     - **Norm of Inquiry (NI):** We *ought* to believe *Q* if we meet antecedent conditions.  
     - **Trivial Deductive Inference (TDI):** If S knows *P* and *P→Q*, then *Q* is true; adding "S knows *Q*" is the issue.  
       *Relevance:* CN is strong but dubious; TDI is uncontroversial but impotent.

  ---

  ### **Assessment of Key Interpretations**
  | Reading (Combination of Axes)                     | Status                          | Skepticism (BIV)                      | Lottery Case                         | Tracking Theories (Nozick)           |
  |---------------------------------------------------|----------------------------------|---------------------------------------|--------------------------------------|--------------------------------------|
  | **SPC + K-Closure + KE + CN**                     | **False** (on modal accounts)   | Licenses skeptic's MT: ¬K¬BIV → ¬Khands | Fails: K(each loses) ↛ K(all lose) | **Rejected** (sensitivity not preserved) |
  | **SPC + K-Closure + KE + NI**                     | **Substantive/Defensible**      | Licenses MT or MP                     | Fails (as above)                    | Rejected (same as above)            |
  | **SPC + JB-Closure + KE + CN**                    | **Defensible**                  | JB¬BIV needed for JBhands? (debatable) | Works: JB justified                 | Compatible (justification ≠ knowledge) |
  | **MPC + K-Closure + KE + CN**                     | **False** (clearly)             | N/A                                   | **Fails catastrophically**: K(each lose) ↛ K(all lose) | Rejected (worse than SPC)          |
  | **SPC + K-Closure + IPK + NI**                    | **Defensible** (weaker)         | Skeptic MT weakened (IPK¬BIV?)        | Still fails for lottery             | Possibly compatible (if IPK not modal) |
  | **TDI (no "knowledge" in consequent)**            | **Trivial** (tautological)      | Useless for skepticism                | Useless for lottery                 | Compatible                          |

  ---

  ### **Key Implications**
  - **Skepticism (BIV) & Tracking Theories**:  
    Sensitivity accounts (Nozick) **reject K-Closure (SPC+KE+CN)**. Why?  
    - To know *P*, your belief must be *sensitive*: If *P* were false, you wouldn't believe *P*.  
    - You know you have hands (*P*) sensitively (if you had no hands, you wouldn't believe you did).  
    - You **cannot** know ¬BIV (*Q*) sensitively (if you *were* a BIV, you'd still believe ¬BIV).  
    - Thus, K-Closure fails: *K(P)* + *K(P→Q)* ↛ *K(Q)*. The BIV case **exposes the modal fragility** of deductive expansion.  
    - *Result:* Tracking theories **block the skeptic's MT** (you *can* know you have hands without knowing ¬BIV).

  - **Lottery Paradox**:  
    - **K-Closure (SPC+KE+CN) fails here too**, but for different reasons:  
      - You "know" ticket *i* will lose (*P_i*) only if "know" is weak (e.g., high probability).  
      - But *K(all tickets lose)* is clearly false (someone wins).  
    - **MPC is worse**: Aggregating weak knowledge claims into a strong one is invalid.  
    - *Resolution:* JB-Closure or RC-Closure holds, but **knowledge requires safety** (couldn't easily be wrong), which fails for individual lottery beliefs.

  - **Verbal Disputes?**  
    Yes:  
    - Using "knowledge" for lottery propositions (weakening the term).  
    - Equating *justification* with *knowledge*.  
    - Confusing **TDI** (trivial) with **CN** (substantive).  
    No:  
    - Genuine conflict between **logic-based** (closure) and **modal** (sensitivity/safety) accounts of knowledge.

  ---

  ### **What Interlocutors Likely Mean & Does It Work?**
  - **Typical Usage (conversation-stopper):**  
    They invoke **SPC + K-Closure + KE + CN** (knowledge *must* transmit over deduction).  
  - **Does It Work?**  
    - For **skepticism**: Only if you reject modal conditions (safety/sensitivity). But this begs the question against tracking theories.  
    - For **lottery**: Fails unless "knowledge" is watered down (e.g., to justified belief).  
    - *Verdict:* Overstated. It **presupposes a non-modal, internalist view of knowledge** that is contested. When deployed dogmatically, it ignores Gettier-style and modal counterexamples.

  ---

  ### **The Decisive Question to Ask Your Interlocutor:**  
  *"Is knowledge definable solely by factors internal to the agent (like justification and evidence), or must it also satisfy external modal conditions (like tracking the truth across possible worlds)?"*  

  - If they choose **internalism**, they likely endorse strong K-Closure (and skepticism/lottery problems loom).  
  - If they choose **externalism** (sensitivity/safety), they must reject K-Closure as a conceptual necessity.  

  This exposes the core divide: **Closure stands or falls with the internalist/externalist account of knowledge itself.** The slogan is never neutral.
