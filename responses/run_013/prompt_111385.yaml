prompt: |-
  Ok so I'm in this Machiavelli seminar and the prof will not stop going on about fortune and virtù — fortune running roughly half of what we do, the bit about damming the river while the weather's still good, and the thought that men succeed when their way of going matches the times and get ruined when the times change and they can't change with them. I want to write my essay on something that definately postdates him, so here it is: what would he make of the fact that we've industrialized the dam? I mean actuarial insurance, reinsurance, hedging, forecasting, prediction markets — the whole apparatus where instead of being bold and hoping fortune comes over to your side, you put a price on the odds and sell the tail off to somebody else. (I know there were policies on ships and cargo in his day; I mean the statistical, industrial version.) Does virtù survive that, or does it get eaten by it?

  Two things I actually need, because the obvious answer here is lazy: (1) don't just tell me he'd approve because he liked foresight. Sort out which parts of his picture survive the move into a world where risk is priced, and which parts just don't. The bit I'm stuck on is that virtù for him seems to involve being able to shift your mode of proceeding when the times shift, while a well-hedged, insured, diversified power is built so it never has to shift — it just absorbs the variance. So in his terms, is that the highest form of virtù, or the most sophisticated way of depending on fortune? (2) tell me where the framework strains hardest — the point where you'd have to say he was wrong rather than just extend him. And if you can, one concrete thing: what would he tell a modern leader whose country has quietly outsourced its risk to the markets?

  Don't bother with quotes or citations, I'll add those, and I already know I'm mangling the history a bit.
