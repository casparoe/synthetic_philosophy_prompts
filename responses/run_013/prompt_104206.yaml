  Rebuilding doctrine around interventionism: Interventionism focuses on how changing one variable affects the outcome. In overdetermination, intervening to stop one polluter still leaves the fish dead, so neither is a but-for cause. But under NESS, each is a cause. Interventionism might still hold both liable by considering each as a sufficient cause. For lost chance, interventionism could model the probability shift, awarding damages based on the difference in survival chances.

