  I should start by analyzing the but-for test. It's grounded in counterfactual dependence: if the defendant hadn't acted, the harm wouldn't have occurred. But this fails in overdetermination cases like the two polluters. Here, each is held fully liable even though neither is a but-for cause. This suggests courts are using something like NESS (Necessary Element of a Sufficient Set), where each cause is part of a sufficient set. The NESS test can handle overdetermination by identifying each act as a necessary component of a sufficient condition (e.g., each pollutant alone was sufficient, so each is a cause).

  For lost chance, the issue is probabilistic causation. The but-for test struggles because we can't say the patient would have survived without negligence—only that the chance decreased. Some courts allow recovery for the lost chance itself, treating the increased risk as the harm. Others dismiss the case for lack of causation. This split indicates a tension between factual causation and fairness. Applying an interventionist approach here might quantify the harm as the reduction in survival probability, leading to proportional damages.

  The user also asks if the doctrine is more about proof and error costs. In overdetermination, holding both polluters liable might be a pragmatic choice to avoid under-compensation. In lost chance, denying claims might reflect aversion to speculative damages. But this doesn't fully explain the exceptions. 

