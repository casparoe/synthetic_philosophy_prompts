answer: |-
  Your frustration is entirely warranted—torts causation doctrine *is* a theoretically messy patchwork. The rules don't presuppose a single, coherent theory of causation but rather reflect pragmatic adjustments to counterfactual dependence (the but-for test's foundation) when it produces outcomes deemed unfair or impractical. Here's a breakdown of the underlying tensions and what they imply:

  **1. The Core Framework & Its Tensions:**
  *   **But-For Default:** Rooted in **Counterfactual Dependence (CD)**: Harm Y occurs only if we can say "But for Defendant's act X, Y would not have occurred." This is a minimal, intuitive test focusing on necessity.
  *   **Overdetermination (Polluters):** Directly violates CD. Neither polluter is *necessary* for the fish kill (Y would have happened without either one). Doctrine imposes liability anyway.
  *   **Lost Chance:** Exposes CD's limitation with **probabilistic causation**. CD requires a binary outcome ("patient would have survived"), which is unknowable when negligence merely alters probabilities. Courts split because CD alone can't resolve it.

  **2. What Theories Does This Practice Engage (or Sidestep)?**
  *   **Counterfactual Dependence (CD):** The explicit baseline. Doctrine *starts* here but *deviates* when CD fails to serve liability goals (deterrence, compensation, fairness).
  *   **NESS (Necessary Element of a Sufficient Set - Wright's refinement of INUS):** This is the most compelling theoretical fit for the *structure* of the exceptions, especially overdetermination.
      *   **Polluters Case:** Each discharge is a *Sufficient Set* on its own to kill the fish. Each discharge is a *Necessary Element* of its *own* sufficient set. Doctrine effectively adopts this.
      *   **Lost Chance (Pro-Recovery Courts):** The non-negligent care (timely diagnosis/treatment) can be seen as a *necessary element* of a *sufficient set* to achieve the *higher chance of survival*. Negligence removes that element. The harm is redefined as the *loss of the chance itself*.
  *   **Interventionism (Woodward/Pearl):** Focuses on effects of interventions within a causal model. Doctrine's "exceptions" align with its intuition about real causal influence.
      *   **Polluters:** Intervening to stop *either* discharge wouldn't change the outcome (Y=dead fish), suggesting neither is a cause under a simple interventionist test. *This clashes with doctrine.* Holding both liable implies looking at the *actual* causal structure: each discharge was independently *capable* of causing Y via its own sufficient pathway. Interventionism *can* capture this if the model allows for multiple sufficient pathways and we assess the actualized path(s).
      *   **Lost Chance:** Interventionism excels here. We can model the probability of survival (P(S)) conditional on interventions (timely treatment vs. negligent delay). The negligence *causes* a decrease in P(S). The harm is the reduction in probability. Doctrine *should* be more consistent using this framework.
  *   **Proof/Error Cost Doctrine:** This is a powerful *pragmatic* explanation, especially for overdetermination.
      *   **Polluters:** Applying CD strictly (no liability) is seen as deeply unfair and undermines deterrence. Holding both liable avoids under-deterrence and ensures compensation, even if philosophically messy under CD. The error cost of letting clear wrongdoers escape is high.
      *   **Lost Chance (No-Recovery Courts):** Fear of opening floodgates to speculative claims and difficulty in valuing/proving "chance" leads courts to demand binary CD proof ("would have survived"), prioritizing the error cost of false positives over false negatives (denying valid claims).
      *   **Lost Chance (Recovery Courts):** Prioritize avoiding the error cost of denying compensation for clear negligence that demonstrably *reduced* the patient's prospects, even if the ultimate outcome is uncertain.

  **3. What Theories Does the Practice Rule Out? Merely Sit Awkwardly With?**
  *   **Ruled Out:**
      *   **Pure, Unadulterated Counterfactual Dependence:** Overdetermination liability is irreconcilable with strict CD.
      *   **Simple Regularity Theories (Constant Conjunction):** Neither overdetermination nor lost chance fit the model of "X always followed by Y" or "Y never without X".
  *   **Sits Awkwardly With:**
      *   **Naive Interventionism:** If interventionism is interpreted simplistically as "changing X changes Y," it clashes with overdetermination liability. However, a more sophisticated interventionism (considering multiple sufficient paths and actualization) can accommodate it.
      *   **Strong Physical Process/Mechanism Theories:** While polluters involve clear physical processes, lost chance deals with counterfactual probabilities and complex biological systems, making a purely physical "process" harder to pinpoint as the harm.

  **4. Rebuilding Doctrine Around Interventionism: Consequences**
  An interventionist approach, centered on causal models and effects of interventions on outcome probabilities, would fundamentally reshape the hard cases:

  *   **Lost Chance:**
      *   **Change:** Recovery for the *lost chance itself* (e.g., 20% reduction) becomes the clear norm. Damages are proportional to the lost probability and the value of the outcome (full survival). The "all or nothing" problem vanishes.
      *   **Hard Part Moves To:**
          *   **Accurate Modeling:** Defining the correct causal model (variables, relationships, background conditions) for the medical scenario. What factors *truly* influence survival probability? How do they interact?
          *   **Baseline Probability:** Establishing the *actual* probability of survival *with* non-negligent care (the 40%) is challenging and contentious (requires robust epidemiological data, expert consensus).
          *   **Valuation:** Quantifying the value of a "lost chance" remains complex, but it's a more transparent damage calculation problem than the causation hurdle.
  *   **Overdetermination (Polluters):**
      *   **Change:** Doctrine might become *more nuanced*. Interventionism suggests that intervening on *one* polluter wouldn't change Y. This could lead to:
          *   **Joint & Several Liability Persisting:** Based on the idea that *each* discharge *actually caused* the harm via its sufficient pathway (NESS-like reasoning within the model). The intervention that *actually happened* was the conjunction of both discharges. Both were independently sufficient causes.
          *   **Alternative: Apportionment?** If the harm is divisible (e.g., killing *some* fish), interventionism could support apportioning damages based on the individual causal contribution of each source. For indivisible harm (fish kill), joint liability still makes sense.
      *   **Hard Part Moves To:** Defining the precise causal pathways and mechanisms to determine if each source was *truly independently sufficient* under the actual conditions. Was there synergy? Did one discharge merely accelerate an inevitable death caused by the other? This requires robust scientific evidence.

  **Conclusion: The Implicit Structure**

  Torts causation doctrine isn't built on a single, pure theory. It's **counterfactual dependence (CD) as the default baseline, heavily modified by NESS reasoning to handle overdetermination and probabilistic harms, and profoundly influenced by pragmatic error-cost considerations.** This creates surface inconsistency:

  *   **CD** asks "Was this act necessary?"
  *   **NESS** asks "Was this act a necessary part of *a* sufficient set that actually operated?"
  *   **Error Costs** ask "What's the consequence of getting this wrong (false positive/negative liability)?"

  **Interventionism offers the most promising *unifying framework* for rebuilding doctrine.** It formally incorporates counterfactuals, handles probabilities naturally, and forces explicit causal modeling. Adopting it would make the treatment of lost chance more rational and consistent. It would refine overdetermination analysis, potentially leading to more nuanced liability based on the actual causal structure and divisibility of harm, while still justifying full liability for indivisible harms caused by independent sufficient causes. The core challenge wouldn't disappear; it would shift from an artificial "causation or not?" barrier driven by CD's limitations to the more scientifically grounded (though still difficult) tasks of causal modeling, probability estimation, and harm valuation.
