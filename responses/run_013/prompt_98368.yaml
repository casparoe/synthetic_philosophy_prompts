prompt: |-
  Our department is running a working group this term on the prisoner's dilemma and the evolution of cooperation. Before we take up any of the competing models, I want a clean statement of what an adequate theory in this area would have to deliver. Please write the desiderata: the phenomena such a theory must explain, the cases it must get right, the distinctions it must not collapse, and the formal or empirical results it must remain consistent with — each with the consideration that makes it a genuine requirement rather than a preference of one camp. Say which requirements are non-negotiable and which are optional, identify which single requirement does the most to eliminate candidate theories, and tell me whether any subset of the requirements is jointly unsatisfiable; that last point is what I most want to see. A table is acceptable, but keep the weight on the requirements and the reasons for them rather than on scoring particular theories.

  The group covers both the one-shot and the indefinitely repeated two-person dilemma, together with the biological literature on how cooperation can evolve, and I do not want a theory to help itself to repetition, reputation, kinship, or group structure unless it can say why the help is legitimate. The phenomena I mean to hold it to include: the dominance of defection in the one-shot game alongside the cooperation actually observed there; the profusion of equilibria in the indefinitely repeated game, and the separate question of which one selection or learning is supposed to pick out; the unraveling of cooperation as a known horizon draws near; the fragility of reciprocal strategies to noise and error; the difference between mutually beneficial cooperation and genuine altruism; and the fact that humans cooperate at a scale that neither kinship nor pairwise reciprocity appears to reach.

  Two further items I want the desiderata to adjudicate. First, a student proposes that the one-shot dilemma is really a coordination problem in disguise, since real players choose conditionally on their beliefs about what the other will do: say whether the desiderata treat this as a reframing or as a change of subject. Second, a colleague claims that the puzzle of cooperation in the one-shot case simply dissolves once one notices that the case is an artifact, because real interactions leave traces: say whether that dissolves the puzzle or dodges it. Finally, if a student wants to add that punishment stabilizes cooperation, say what the desiderata require of that proposal, and in particular whether it only relocates the difficulty.
reasoning: |-
  We are to state the desiderata for a theory of cooperation in the prisoner's dilemma (PD) context, covering both one-shot and indefinitely repeated games, and the evolution of cooperation in biology. The theory must explain several phenomena without unduly helping itself to repetition, reputation, kinship, or group structure unless it justifies their use.

  The phenomena to be explained are:
  1. The dominance of defection in the one-shot PD alongside the cooperation actually observed there.
  2. The profusion of equilibria in the indefinitely repeated PD, and the separate question of which equilibrium selection or learning picks.
  3. The unraveling of cooperation as a known horizon draws near.
  4. The fragility of reciprocal strategies to noise and error.
  5. The distinction between mutually beneficial cooperation and genuine altruism.
  6. The fact that humans cooperate at a scale beyond kinship and pairwise reciprocity.

  Additionally, we must address two items:
  - A student's proposal that the one-shot PD is a coordination problem in disguise because players condition on beliefs about the other's action.
  - A colleague's claim that the one-shot puzzle dissolves because real interactions leave traces.

  And we must consider the proposal that punishment stabilizes cooperation.

  We'll organize the desiderata in a table for clarity, but the weight is on the requirements and their justifications. We'll also note which are non-negotiable and which are optional, identify the requirement that eliminates the most candidate theories, and check if any subset of requirements is jointly unsatisfiable.

  Let's list the desiderata:

  1. **One-shot dominance and observed cooperation**: The theory must explain why defection is the dominant strategy in the one-shot PD (which is a non-negotiable feature of the game) while also accounting for the empirical fact that cooperation does occur in one-shot anonymous experiments (e.g., in laboratory settings). This is non-negotiable because it is a fundamental empirical and theoretical tension.

  2. **Equilibrium profusion and selection in repeated PD**: The theory must account for the fact that in the indefinitely repeated PD, there are many equilibria (including cooperative ones by Folk Theorem) and must address how one equilibrium is selected (by evolution, learning, or other mechanisms) without assuming away the problem. This is non-negotiable because the existence of multiple equilibria is a mathematical fact and the selection problem is central.

  3. **Unraveling near known horizon**: The theory must explain why cooperation unravels as the end of a repeated interaction becomes known (backward induction). This is non-negotiable because it is a robust prediction of game theory and observed in experiments.

  4. **Fragility to noise**: The theory must explain the fragility of reciprocal strategies (like Tit-for-Tat) in the face of noise or errors (e.g., accidental defection leading to breakdowns). This is non-negotiable because it is a well-documented empirical and theoretical issue.

  5. **Distinguishing mutual benefit from altruism**: The theory must clearly distinguish between cooperation that is mutually beneficial (i.e., in the long-term self-interest of the agent) and genuine altruism (which may involve a net cost to the agent). This is non-negotiable because without this distinction, the theory would conflate self-interested cooperation with other forms of helping.

  6. **Large-scale human cooperation**: The theory must explain how humans achieve cooperation at large scales (beyond kinship and direct reciprocity) without assuming group structure unless justified. This is non-negotiable because it is a key feature of human societies.

  Now, addressing the two items:

  7. **One-shot as coordination?**: The student's proposal reframes the one-shot PD as a coordination problem because players condition on beliefs. The desiderata require that the theory must not collapse the distinction between a PD (where defection dominates regardless of the other's action) and a coordination game (where both players prefer to match actions). Therefore, this reframing is a change of subject unless the theory can show that the PD structure is altered (e.g., by introducing a different payoff structure or embedding in a larger context). The requirement is non-negotiable: the theory must preserve the fundamental structure of the PD (dominance of defection) while explaining cooperation.

  8. **Dissolving the one-shot puzzle?**: The colleague's claim that the one-shot puzzle dissolves because real interactions leave traces (e.g., reputation) dodges the puzzle. The theory must explain one-shot cooperation without relying on traces (like reputation) unless it can show that these traces are inherent in the situation and not an ad hoc addition. This is non-negotiable because the one-shot PD is a well-defined and important benchmark.

  9. **Punishment stabilizes cooperation**: If a student proposes that punishment stabilizes cooperation, the theory must account for the stability provided by punishment. However, it must also address the second-order free-rider problem (who punishes the non-punishers?) and the cost of punishment. This requirement is non-negotiable because without solving the enforcement problem, punishment merely relocates the difficulty.

  Now, let's consider which requirement is the most eliminative and whether any subset is jointly unsatisfiable.

  - **Most eliminative requirement**: The requirement to explain large-scale human cooperation (beyond kinship and direct reciprocity) is likely the most eliminative because it rules out theories that rely solely on pairwise interactions or genetic relatedness, which are common in many models.

  - **Joint unsatisfiability**: There might be a tension between the requirement to explain one-shot cooperation (without repetition, reputation, etc.) and the requirement to preserve the dominance of defection in the one-shot PD. The dominance of defection implies that rational self-interested players should defect, yet cooperation is observed. A theory must resolve this without contradicting the game structure. This tension might be resolved by introducing factors (like social preferences or bounded rationality) but then the theory must justify these factors without violating the other requirements.

    Another potential tension is between the profusion of equilibria in the repeated game and the selection of a cooperative equilibrium. The theory must explain why cooperation is selected without assuming away the multiplicity of equilibria.

    However, the most striking potential conflict is between the requirement to explain one-shot cooperation and the dominance of defection. If the theory explains one-shot cooperation by altering the payoff structure (e.g., introducing other-regarding preferences) then it may collapse the distinction between the PD and other games (violating requirement 5 and the student's proposal). But if it doesn't alter the payoffs, then how can cooperation be rational? This tension is fundamental.

  Let's present the desiderata in a table:

  | Requirement | Phenomena/Cases | Why Non-Negotiable? | Notes |
  |------------|-----------------|---------------------|-------|
  | **1. One-shot dominance and observed cooperation** | Dominance of defection in one-shot PD and observed cooperation in experiments | The dominance of defection is a defining feature of the PD. The occurrence of cooperation is an empirical fact that must be explained. | The theory must not ignore the tension. |
  | **2. Equilibrium profusion and selection** | Many equilibria in repeated PD and the selection problem | The existence of multiple equilibria is a mathematical fact (Folk Theorem). Selection is crucial for explaining why we see cooperation. | The theory must address selection without arbitrary assumptions. |
  | **3. Unraveling near known horizon** | Collapse of cooperation as the end nears | Backward induction is a fundamental game-theoretic result and observed in experiments. | The theory must account for this without denying backward induction. |
  | **4. Fragility to noise** | Breakdown of reciprocity due to errors | Reciprocal strategies are vulnerable to noise in real interactions and simulations. | The theory must either explain robustness or account for the fragility. |
  | **5. Distinguish mutual benefit from altruism** | Clear separation between self-interested cooperation and altruism | Conflating them obscures the different evolutionary mechanisms and empirical findings. | The theory must not reduce altruism to self-interest. |
  | **6. Large-scale human cooperation** | Cooperation beyond kinship and direct reciprocity in humans | Human societies exhibit cooperation at scales not explained by kin selection or pairwise reciprocity. | The theory must explain this without ad hoc group structures. |
  | **7. Preserve PD structure** | The student's proposal (one-shot as coordination) | The PD is defined by the dominance of defection. Reframing as coordination changes the game. | Non-negotiable: the theory must not redefine the PD. |
  | **8. Address one-shot without traces** | The colleague's claim (dissolving the puzzle by traces) | The one-shot PD is a benchmark that isolates the problem. The theory must explain one-shot cooperation without relying on features of repeated games. | Non-negotiable: dodging the benchmark is inadequate. |
  | **9. Account for punishment's stability and challenges** | Punishment stabilizes cooperation but faces enforcement problems | Punishment is a common mechanism but introduces second-order free-rider problems. | The theory must not relocate the problem without solving it. |

  Now, addressing the questions:

  - **Non-negotiable vs optional**: All the above are non-negotiable because they are either fundamental to the PD structure, empirically observed, or necessary for a complete theory. There are no optional ones in this list.

  - **Most eliminative requirement**: Requirement 6 (large-scale human cooperation) is likely the most eliminative because it requires mechanisms beyond the common ones (like direct reciprocity) and thus rules out many candidate theories that are designed for pairwise interactions.

  - **Joint unsatisfiability**: The most prominent tension is between requirement 1 (one-shot dominance and observed cooperation) and requirement 8 (address one-shot without traces). The dominance of defection (requirement 1) implies that in a one-shot PD, rational self-interested players defect. But requirement 8 demands an explanation for observed cooperation without invoking traces. This seems jointly unsatisfiable under the standard assumptions of rationality and self-interest. Therefore, a theory must either:
    - Reject the standard rationality assumptions (e.g., by introducing bounded rationality or social preferences), but then it must explain why these modifications are justified and how they are consistent with other requirements (like requirement 5 to distinguish mutual benefit from altruism).
    - Or, show that the one-shot situation is never truly isolated (but requirement 8 forbids this without justification).

    This tension is at the heart of the one-shot puzzle.

  Additionally, requirement 4 (fragility to noise) and requirement 2 (equilibrium selection) might be in tension because the most robust strategies (like Win-Stay, Lose-Shift) might not be the ones that are selected by evolution or learning in all environments.

  However, the main unsatisfiable pair is requirements 1 and 8 taken together with the standard rationality assumptions. Therefore, a successful theory must break away from the standard assumptions in a justified way.

  Regarding the student's proposal: The desiderata treat the reframing of the one-shot PD as a coordination problem as a change of subject because it alters the game structure (by making the choice depend on beliefs in a way that changes the dominance structure). Thus, it violates requirement 7.

  Regarding the colleague's claim: It dodges the puzzle because the one-shot PD is designed to isolate the problem. The theory must either explain one-shot cooperation without traces or justify why traces are always present (and how they work) without making the one-shot case disappear.

  Regarding punishment: The theory must explain how punishment stabilizes cooperation without introducing an unsolved enforcement problem (i.e., it must solve the second-order free-rider problem). Otherwise, it only relocates the difficulty.

  In summary, the desiderata highlight that a theory must explain the observed phenomena while respecting the constraints of the PD structure and without ad hoc additions. The tension between the one-shot dominance of defection and the observation of cooperation is the most challenging and may require a fundamental rethinking of the assumptions.
answer: |-
  Below is a clean statement of desiderata for an adequate theory of the prisoner's dilemma (PD) and the evolution of cooperation. The requirements are derived from the phenomena you specified, with justifications for why each is non-negotiable (rooted in empirical, formal, or logical necessity). I address the two adjudication items (student's proposal and colleague's claim) and the role of punishment explicitly. A table summarizes the core requirements, followed by analysis of eliminative power, joint unsatisfiability, and your specific queries.

  ### Core Desiderata Table
  | Requirement                                                                 | Phenomena/Cases Addressed                                                                                             | Why Non-Negotiable                                                                                                                               | Key Distinction/Consistency                                                                                                |
  |-----------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|
  | **R1: Explain one-shot defection dominance AND observed cooperation**       | Dominance of defection in one-shot PD; cooperation in anonymous one-shot experiments (e.g., 10-50% in labs).           | Defection dominance is a formal game-theoretic truth; observed cooperation is empirical fact. Ignoring either misrepresents human/biological behavior. | Must not collapse PD structure (dominance) into other games (e.g., assurance games).                                        |
  | **R2: Account for equilibrium profusion AND selection in repeated PD**      | Folk Theorem’s multiplicity of equilibria; empirical learning/selection of cooperative strategies (e.g., Tit-for-Tat). | Profusion is a mathematical certainty; selection is necessary to explain real-world cooperation. Omitting selection reduces theory to existence proofs. | Must distinguish equilibria existence (formal) from attainability (empirical/evolutionary).                                 |
  | **R3: Explain unraveling with known horizons**                              | Collapse of cooperation in finitely repeated PD (e.g., experimental rounds with fixed end).                           | Backward induction is logically inescapable under common knowledge of rationality/horizon. Denial contradicts evidence from economics/biology.   | Must not conflate finite vs. indefinite repetition; horizon effects are distinct from noise effects.                        |
  | **R4: Explain fragility of reciprocity to noise/error**                     | Breakdown of strategies like Tit-for-Tat under implementation errors (e.g., accidental defection).                    | Noise is ubiquitous in real interactions; robustness is a predictor of evolutionary viability. Ignoring fragility misrepresents reciprocity.      | Must distinguish errors (noise) from intentional defection; cannot assume perfect monitoring.                              |
  | **R5: Distinguish mutual benefit from genuine altruism**                    | Cooperative acts with net fitness/utility gain vs. costly altruism (e.g., one-shot helping with no reciprocity).       | Conflation obscures evolutionary mechanisms (e.g., kin selection vs. reciprocity). Biology requires this for inclusive fitness models.        | Must not reduce altruism to self-interest; altruism requires cost-bearing unexplained by direct benefits.                   |
  | **R6: Explain large-scale cooperation beyond kinship/pairwise reciprocity** | Human societal cooperation (e.g., collective action in large groups); non-kin cooperation in animals (e.g., vampire bats). | Neither kinship nor reciprocity scales sufficiently empirically. Ignoring this limits generality for human uniqueness.                   | Must not assume group structure without justifying its evolution (e.g., via cultural group selection).                      |
  | **R7: Justify external mechanisms (e.g., repetition, reputation, kinship)** | Use of repetition/reputation in repeated PD; kinship in biological models.                                             | Arbitrary inclusion circularly "solves" cooperation. Mechanisms must be explained, not assumed (e.g., how reputation evolves without cooperation). | Must distinguish between exogenous assumptions (invalid) and endogenous emergence (valid).                                  |

  ### Non-Negotiable vs. Optional Requirements
  - **All R1–R7 are non-negotiable**: Each is grounded in inescapable empirical, formal, or logical demands.  
    - *Empirical demands*: Observed cooperation (R1), selection (R2), unraveling (R3), noise sensitivity (R4), large-scale cooperation (R6).  
    - *Formal/logical demands*: Defection dominance (R1), equilibrium profusion (R2), backward induction (R3), altruism distinction (R5), mechanism justification (R7).  
  - **No optional requirements** are proposed here, as your phenomena cover essential aspects of cooperation theory. Optionality might arise in model-specific details (e.g., discount rates in repeated PD), but these are subsumed under the non-negotiable requirements.

  ### Most Eliminative Requirement
  - **R1 (One-shot dominance AND cooperation)** eliminates the most candidate theories.  
    **Why**: Rational choice theories fail to explain cooperation without auxiliary assumptions (violating R7); evolutionary theories often rely on repetition/kinship (violating R1’s "no-help" clause). Only theories incorporating social preferences (e.g., inequity aversion) or bounded rationality can satisfy R1, but these risk collapsing R5’s altruism distinction or R4’s noise fragility. R1 forces theories to reconcile rationality (defection dominance) with irrationality (observed cooperation), which is the core tension.

  ### Joint Unsatisfiability of Requirements
  - **R1 (one-shot cooperation) + R3 (unraveling) + R7 (no unjustified mechanisms)** are *jointly unsatisfiable* under standard rationality assumptions.  
    **Why**:  
    - R1 requires explaining one-shot cooperation despite defection dominance.  
    - R3 requires backward induction to cause unraveling in finite games.  
    - R7 forbids ad hoc use of mechanisms (e.g., reputation) to "rescue" one-shot cooperation.  
    Under rational self-interest:  
    - Defection dominates in one-shot PD (R1’s dominance).  
    - Cooperation in repeated PD unravels if the horizon is known (R3).  
    - Thus, cooperation should never occur in one-shot or finite-horizon cases—contradicting empirical cooperation (R1) and requiring auxiliary mechanisms (violating R7).  
    **Resolution**: A theory must break rationality (e.g., via social norms), but this risks violating R5 (altruism distinction) or R4 (noise fragility). This tension is the crux of your query.

  ---

  ### Adjudication of Specific Items
  1. **Student’s Proposal: One-shot PD as a coordination problem**  
     - **Desiderata verdict**: This is a **change of subject**, not a reframing.  
     - **Why**: R1 requires preserving defection dominance (i.e., defection is strictly dominant regardless of beliefs). In coordination games (e.g., Stag Hunt), strategies are *not* dominant—players coordinate based on beliefs. The student’s proposal redefines the PD’s payoff structure, violating R1’s core requirement. A theory must explain cooperation *within* the PD structure (dominance intact), not redefine the game.

  2. **Colleague’s Claim: One-shot puzzle dissolves due to "traces"**  
     - **Desiderata verdict**: This **dodges the puzzle**, per R1 and R7.  
     - **Why**: R1 requires explaining cooperation in the *defined* one-shot PD (no repetition/reputation). "Traces" (e.g., reputation) are mechanisms that must be justified (R7). If the theory cannot explain how traces emerge without presupposing cooperation (e.g., in a one-shot context), it merely relocates the problem. The one-shot puzzle remains central for testing theories of *initial* cooperation.

  3. **Punishment Stabilizes Cooperation**  
     - **Desiderata requirements**:  
       - The theory must explain how punishment **evolves without circularity** (R7). If punishers bear costs, altruistic punishment faces a second-order free-rider problem (who punishes non-punishers?).  
       - It must account for **noise/error** (R4): Punishment can escalate conflicts if misapplied.  
       - It must **distinguish from altruism** (R5): Punishment for mutual benefit differs from costly altruism.  
     - **Does it relocate the difficulty? Yes**, if punishment is assumed without justification. Punishment merely shifts cooperation’s stability problem to punishment’s stability problem (violating R7). A theory must endogenize punishment (e.g., via group selection or institutional evolution) to avoid circularity.

  ---

  ### Summary
  - **Key tension**: The triad of **R1 (one-shot cooperation), R3 (unraveling), and R7 (mechanism justification)** is jointly unsatisfiable under rational self-interest, demanding a break from standard assumptions (e.g., via evolutionary dynamics, social preferences, or bounded rationality).  
  - **Eliminative power**: **R1** is the strongest filter, as it forces theories to confront the irrationality of observed cooperation.  
  - **Adjudication**: The student’s proposal changes the subject; the colleague’s claim dodges the puzzle; punishment must not relocate the difficulty unjustifiably.  
  A theory satisfying all desiderata must explain cooperation’s emergence and stability without ad hoc mechanisms, while respecting PD structure and empirical observations.
