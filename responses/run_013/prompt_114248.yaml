  Hmm, the core tension lies in challenging a decision theory principle that free information shouldn't lower expected welfare. But these cases show how information can intrinsically harm by transforming one's phenomenological reality—like the genetic test taker preserving 30 years of mental peace. 

  The user's deeper request stands out: they want conceptual carving, not just labeling. Their critique of "information avoidance" as too broad is astute—it bundles strategic cases (where knowledge forces action) with these "pure interiority" cases. The doctor avoiding a test to evade treatment obligations is fundamentally different from the woman avoiding paternal papers to preserve her self-narrative. 

  I recall relevant concepts: affective forecasting errors (we overestimate how much knowledge will hurt), but that doesn't capture the deliberate rationality here. The "value of ignorance" literature touches this, but often focuses on strategic contexts. Ah! "Ontological disruption" feels close—the way knowledge can shatter one's sense of reality without changing material circumstances. 

  For differentiation: Mere incuriosity lacks the rational defense these cases have ("wouldn't change actions"). Risk aversion concerns probabilistic outcomes, while this concerns certain psychological transformation upon knowing. The decision theory exception hinges on welfare metrics excluding subjective experience—which these cases reveal as a flaw. 

  Proposing "autotelic ignorance" (self-protection of one's experiential world) with clear boundaries: 1) no instrumental consequences 2) purely interior impact 3) anticipatory rejection. The brokerage-checker straddles the line—his avoidance does affect investment decisions, making it hybrid. 

  User clearly has philosophical sophistication—their "what it is like to be you" phrasing echoes Nagel. Should emphasize how this exposes limitations of standard decision theory's neglect of epistemic burdens on consciousness.
answer: |-
  This is a profound observation that cuts to the heart of how information shapes subjective experience. The phenomenon you're describing **lacks a single, universally accepted term**, but its core is well-recognized and distinct. Here's a conceptual carving:

  1.  **The Core Concept: Epistemic Self-Preservation or Autotelic Ignorance**
      *   **What's Avoided:** The *irrevocable alteration of subjective reality* or *experiential state* caused by possessing the knowledge itself. The harm isn't in changed actions or external consequences, but in the unavoidable shift in *how it feels to exist* knowing that fact.
      *   **Mechanism:** Information isn't just data; it's a *phenomenological event*. Once known, it integrates into your cognitive and emotional landscape, potentially altering your baseline mood, self-perception, sense of security, ability to enjoy certain things, or fundamental narrative about yourself or the world. This alteration is perceived as inherently negative or burdensome.
      *   **Rationale:** "I value my current experiential state (peace of mind, hope, narrative coherence, unburdened enjoyment) more than the potential value of possessing that knowledge, *especially* since the knowledge confers no instrumental benefit." It's a defense of one's present inner world.

  2.  **Distinguishing from Strategic Information Avoidance:**
      *   **Strategic Avoidance:** Avoids information because knowing would *force uncomfortable/unwanted actions*, create *moral or legal obligations*, weaken *bargaining positions*, or alter *how others perceive or interact with you*. The harm is extrinsic and action-oriented (e.g., doctor forced to treat, negotiator losing leverage).
      *   **Non-Strategic Avoidance (Your Cases):** Avoids information *solely* because of the intrinsic, unavoidable *experiential cost* of possessing it. No actions change, no obligations are created, no external perceptions shift. The harm is purely interior and phenomenological. The knowledge itself is the burden.

  3.  **Distinguishing from Risk Aversion and Incuriosity:**
      *   **Risk Aversion:** Concerns the fear of *probabilistic negative outcomes*. Your cases involve *certain knowledge* causing a *certain negative shift in subjective state*. The man *knows* knowing the genetic result will burden him for decades; the woman *knows* finding a half-sibling would disrupt her narrative. It's aversion to a guaranteed experiential cost, not a risk.
      *   **Incuriosity:** A general lack of interest in seeking new information, often passive or habitual. Your cases involve *active, deliberate rejection* of specific, readily available information based on a *rational calculation* about its detrimental effect on well-being. It's motivated protection, not apathy.

  4.  **The Decision Theory Result & Its Limits:**
      *   **The Principle:** The standard result (often based on Savage's framework) states that free information cannot decrease expected utility *if utility is defined solely over outcomes/actions*. Information only allows better decisions, potentially improving outcomes or leaving them unchanged.
      *   **The Flaw:** This framework **ignores the utility (disutility) of the information state itself**.
          *   **Information as Consumption Good/Bad:** Knowledge itself has intrinsic positive or negative value. Learning a spoiler directly reduces the utility derived from experiencing the story. Knowing about a potential half-sibling directly reduces the utility derived from one's established family narrative.
          *   **State-Dependent Utility:** The utility of future states *depends on what you know now*. The man values the *state of not knowing* over the *state of knowing*, even if his material circumstances are identical. The brokerage-checker finds the *state of checking after gains* more pleasurable than the *state of checking after losses*, regardless of the underlying portfolio value.
      *   **Conclusion:** These cases **are genuine exceptions** to the naive interpretation of the decision theory result. They demonstrate that information *can* have direct negative utility, lowering expected welfare by altering the subjective quality of existence, even when it doesn't change actions or material outcomes.

  5.  **Proposed Term: Autotelic Ignorance**
      *   **Definition:** The deliberate avoidance of specific, cost-free information solely to preserve a valued current state of subjective experience or self-understanding, where the knowledge itself is anticipated to cause an irrevocable negative shift in that state, and where the information has no instrumental value (i.e., wouldn't change actions).
      *   **Why "Autotelic"?** From Greek *auto* (self) and *telos* (end/purpose). The ignorance is an end in itself, valued for the state of being it preserves.
      *   **Boundaries:**
          *   **Inside:** Avoidance driven purely by the anticipated intrinsic burden of *knowing* (genetic test, father's papers, spoilers). The brokerage-checker *partially* fits if his avoidance is purely to preserve his mood/self-image *while checking*, even ignoring any potential impact on investment decisions. His news avoidance fits strongly.
          *   **Outside:**
              *   Strategic avoidance (contracts, negotiation, medical obligations).
              *   Avoidance due to cost (time, effort, money).
              *   Avoidance due to anticipated *action* consequences (e.g., not checking for a leak to avoid the costly repair *action*, even if knowing wouldn't intrinsically harm).
              *   General incuriosity or apathy.
              *   Avoidance due to social/image concerns (wanting to maintain plausible deniability for others).
      *   **Related Terms:** "Motivated Ignorance" (often broader, includes strategic), "Willful Ignorance" (often implies blameworthy avoidance of responsibility, not fitting here), "Epistemic Hedging" (focuses on maintaining options, not experiential state), "The Ostrich Effect" (behavioral bias, often implies irrationality, while your cases can be rational).

  **In Summary:**

  You've identified **Autotelic Ignorance**: the rational, deliberate choice to remain ignorant of cost-free information to protect one's current, valued subjective experience from the intrinsically burdensome alteration caused by possessing that knowledge, where the knowledge offers no instrumental benefit. This exposes a limitation in standard decision theory by highlighting that information states themselves carry utility/disutility independent of actions or outcomes. Strategic avoidance protects *future actions* or *external perceptions*; autotelic ignorance protects the *present interior world*.
