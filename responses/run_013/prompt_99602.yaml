  - The destruction of memory/character continuity is central 

  The simplifications section needs the most depth: 
  - "New person" language is hyperbolic; better to frame it as diminished psychological connectedness 
  - Critical interests aren't automatically supreme—there's debate about when experiential interests might override 
  - Personhood debates are messier than presented; not all philosophers agree dementia annihilates personhood 
  - Precedent autonomy isn't binary; it's about weight, not absolute authority 
  - The daughter's motives matter—is she honoring mom or avoiding her own pain? 

  For "what's wrong": 
  - Philosophers don't universally agree dementia "destroys the person" 
  - Advance directives aren't void even if identity changes—they're just debatable 
  - Staff's stance isn't purely about happiness; it's also about non-maleficence 

  My verdict will confirm the professor's view is usable but suggest grounding character arguments in relational ethics and dignity beyond just identity. 

