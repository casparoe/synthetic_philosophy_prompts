prompt: |-
  I run a 90-minute session for a sixteen-person upper-level seminar that mixes philosophy and biology students, and I want the whole session to be a runnable activity rather than a lecture. The idea I want participants to feel from the inside is the failure of any single-criterion definition of life, together with the stubborn pull of the intuition that there is nevertheless a fact of the matter about which borderline cases are alive. They should collide with that failure themselves, in the middle of a decision they are forced to make, before I name it in the debrief. Design the activity so the difficulty shows up in what happens to them, not in what I say afterward.

  Framing. The seminar becomes an advisory panel to a fictional registry that must certify which entities turned up in a survey count as living, for the purposes of a protection-and-regulation treaty. Certification has immediate, stated consequences: an entity certified as living falls under a moratorium on destruction and a research-ethics review; one certified as non-living does not. Every ruling is therefore binding and consequential within the fiction, which is what makes the definitions cost something.

  Sequence. (1) Warm-up: split into four groups of four. Each group drafts, on a card, a definition or decision procedure for life and posts it. No prompting toward any particular criterion. (2) Docket: distribute a set of eight entity dossiers, one at a time, each with a one-paragraph description and a designated advocate who must argue for a specific verdict. The eight should be chosen so that between them they break every single-criterion definition the groups are likely to have written. Use: a virus; a prion; a sterile hybrid animal; a synthetic cell with a minimal human-written genome; a self-sustaining autocatalytic chemical set in a vesicle that grows and divides but carries no genes in the usual sense; a flame; a self-replicating digital program that undergoes selection at the hands of its users; and a clonally transmissible cancer lineage that has spread between hosts for centuries. Give each dossier just enough detail that the borderline is genuine rather than a trick. (3) Concession mechanic: after any ruling, a group may amend its definition, but each amendment spends one of three concession tokens, and a group whose tokens are gone is frozen. This is the engine of the activity: it converts the temptation to patch a definition ad hoc into a visible, rationed cost. (4) Roles: a Registrar who reads the frozen definition aloud before every vote and applies it literally; a Treaty Counsel who announces the consequence of each certification; the rotating advocates; and an Ombudsperson entitled to challenge any ruling as inconsistent with the group's own stated definition. (5) Audit: with about fifteen minutes left, check each frozen definition against all eight cases and mark where it contradicts itself.

  Debrief. Map the moments onto the idea. The first amendment corresponds to an epicycle that saves a definition by making it vacuous; the token budget corresponds to the felt difference between revising a definition and merely gerrymandering it; the audit corresponds to the counterexample. Surface which criterion each dossier stressed (metabolism, independent reproduction, nucleic-acid information, natural selection, individuality, substrate), and show that no single one survived all eight. Then name the two live responses: that life is a cluster or family-resemblance concept with no sharp boundary, and that the question is partly about a word rather than a fact. Finally, be explicit about the intuition they kept defending — that there is a right answer to each case even when no definition delivers it — and let them sit with the tension rather than resolving it.

  What predictably goes wrong. Groups patch rather than rebuild and burn tokens early; freeze the budget from the first round so the scarcity is felt. Someone announces that it is all just semantics and the room deflates; acknowledge the point as a genuine option and immediately require the panel to keep ruling anyway, since the treaty does not wait for the philosophy. The flame is treated as a joke and waved off; have the advocate argue it seriously so the analogy has to be answered. Advocates over-argue toward a verdict the group did not actually reason to, so instruct them to make the strongest case, not the winning one. Consensus pressure silences the minority who think the virus is alive; take a blind vote and reveal the split afterward. Time runs out before the audit; protect those fifteen minutes by capping debate on each dossier.

  What the activity cannot reproduce, and that I must supply. It cannot reproduce the empirical dispute over whether viruses and other borderline entities belong to the tree of life, nor the theoretical claim that life is a matter of degree rather than a yes-or-no matter; the treaty forces a verdict and thereby smuggles in a binary that the science may not support. It also cannot make the deflationary position attractive, only available. Flag both in the debrief, and tell the group plainly that the binary they spent ninety minutes enforcing may itself be the artifact worth questioning.
reasoning: |-
  Okay, the user is designing a 90-minute seminar activity for an upper-level mixed group of philosophy and biology students. They want students to experience the failure of single-criterion definitions of life firsthand through a simulated regulatory decision-making process. The core challenge is making the conceptual tension visceral through mechanics rather than lecture.

  Hmm, the proposed structure is already sophisticated - a fictional treaty certification forces binary choices on borderline cases while a token system limits definition patches. But I notice unspoken tensions: the user needs to balance scientific accuracy with philosophical revelation, avoid trivialization of fringe cases like flames while preventing advocacy fatigue. 

  The real brilliance lies in what's not said - how the token economy mirrors scientific paradigm shifts (epicycles vs revolutions), and how the audit makes contradictions inescapable. But potential pitfalls worry me: philosophy students might over-theorize during docket debates while biologists fixate on technicalities, derailing the experiential goal. 

  Ah! The solution might be in role design - the Registrar's literalism and Ombudsperson's consistency challenges could enforce focus. And strict time limits per dossier (maybe 4 minutes?) would protect the crucial audit phase. The user's debrief plan elegantly connects mechanics to concepts (tokens = gerrymandering vs revising), but I'd emphasize surfacing emotional reactions too - that moment when a group realizes their definition just condemned the Andean mule to nonexistence. 

  What's most profound is how the treaty's false binary exposes itself through play. The user's right - no activity can resolve the tension between essentialism and cluster theories, but making students feel that cognitive dissonance? That's pedagogical gold.
answer: |-
  Here’s a refined activity design that forces confrontation with the definitional crisis through structured conflict, while protecting your debrief goals. Key tweaks amplify tension and ensure scarcity bites early:

  **Session Flow (90min Total)**  
  *(Prep: 4 definition cards, 8 dossier folders, token chips (3/group), role badges, timer)*

  1.  **Framing & Warm-up (10min):**
      *   "You are the Treaty Certification Panel. Your rulings trigger immediate legal protections or deregulation. No abstentions—every case gets a binary verdict."
      *   Split into 4 groups of 4. Task: *"Draft a SINGLE, TESTABLE criterion or procedure to certify LIFE. Write it CLEARLY on your card. You have 4 minutes."* (Enforce simplicity; reject multi-part definitions).
      *   Groups post cards publicly. **No discussion yet.**

  2.  **Docket Phase (50min - Strict 6min per dossier):**  
      *Distribute dossiers one by one. For each:*
      *   **Minute 0-1:** Registrar reads dossier aloud + *literally* applies each group's current definition, announcing the verdict each definition dictates. (Crucial: Makes definitions' implications unavoidable).
      *   **Minute 1-3:** Advocate (pre-assigned) argues *for their pre-set verdict* (assign pro/con randomly per dossier). Focus: "Make the strongest case why science/ethics *demands* this verdict, *especially* against obvious objections."
      *   **Minute 3-5:** Open Panel Debate. **Key Constraint:** Panelists must argue *based on existing definitions* or propose amendments. Ombudsperson listens for inconsistencies.
      *   **Minute 5-5:30:** Blind Vote (Write verdict on slip). Registrar collects.
      *   **Minute 5:30-6:** Treaty Counsel announces consequence ("Certified Living: Moratorium imposed. Certified Non-Living: No restrictions apply."). Registrar reveals vote tally. Ombudsperson *can* challenge: "Group 2's definition requires X, but you voted Y for Case 3 - explain the consistency." *Then...*
      *   **Amendment Window (Immediately after verdict):** Groups may spend 1 token to amend their definition *right now* based on the case outcome. **Only 30 seconds!** (Prevents over-engineering). Registrar updates the public card.

  3.  **Docket Order & Advocate Verdicts (Designed to Escalate):**
      1.  **Synthetic Cell (Minimal Genome):** Advocate argues **LIVING**. (Likely passes early definitions easily - lulls them).
      2.  **Virus (Bacteriophage):** Advocate argues **NON-LIVING**. (Exposes "metabolism/replication without independence").
      3.  **Self-Replicating Program (Digital Evolution):** Advocate argues **LIVING**. (Tests "substrate independence" & information).
      4.  **Prion (Self-replicating misfolded protein):** Advocate argues **NON-LIVING**. (Hits "no nucleic acid/genetic info" definitions).
      5.  **Sterile Hybrid (Mule):** Advocate argues **LIVING**. (Challenges "independent reproduction" & "potential").
      6.  **Clonal Cancer (Devil Facial Tumour Disease):** Advocate argues **NON-LIVING**. (Attacks "individuality" & "organismal harmony").
      7.  **Autocatalytic Set (Chemoton w/o genes):** Advocate argues **LIVING**. (Undermines "genetic info" & "Darwinian evolution").
      8.  **Flame (Candle flame described as self-sustaining, metabolizing fuel, "reproducing" if split):** Advocate argues **LIVING** *passionately*. (Forces confrontation with "why *not*?" after prior cases).

  4.  **Concession Mechanic In Action:**
      *   Groups start with 3 tokens. Each definition amendment costs 1 token.
      *   **Freeze:** Groups with 0 tokens **cannot amend further**. Their definition is locked, flaws and all.
      *   **Scarcity:** Likely triggered by Case 3 (Program) or 4 (Prion). Groups panic as tokens vanish.

  5.  **The Audit (15min - Non-Negotiable):**
      *   "The Treaty Secretariat requires consistency checks before finalizing the registry."
      *   For each **frozen** definition (likely 2-3 groups): Registrar reads definition aloud.
      *   Panelists quickly review all 8 dossiers: Identify *at least one case* where the frozen definition either:
          *   Certifies something the group ruled *against*.
          *   Fails to certify something the group ruled *for*.
      *   Mark these contradictions publicly (e.g., sticky notes on the definition card: "Case 2: Virus - Def says NON, we ruled LIVING").

  6.  **Debrief (15min - Your Plan, Enhanced):**
      *   **Map the Experience:** "Where did you *feel* the definition straining? When did patching feel cheap vs. necessary? What case made you want to scream?"
      *   **Surface the Criterion Stress Points:** "Which dossier broke 'reproduction'? (Mule). 'Metabolism'? (Flame). 'Genetic info'? (Prion/Chemoton). 'Evolution'? (Program). 'Individuality'? (Cancer)."
      *   **The Core Failure:** "Show of hands: Did *any* single definition survive all 8 cases unscathed in both the rulings *and* the audit?" (Hands stay down).
      *   **Name the Tension:**
          *   "Option 1: 'Life' is a cluster concept (Wittgenstein) – no essence, just overlapping features."
          *   "Option 2: It's 'just semantics' – our word, not a cosmic category."
          *   **The Stubborn Intuition:** "Yet... when deciding about the Andean Mule or the Tasmanian Devil's tumor... did it feel like *just* semantics? Or was there a sense that there *should* be a fact here, even if our definitions failed us?" (Let silence hang).
      *   **The Smuggled Binary:** "Crucially: The *Treaty forced a binary choice*. Science might say 'spectrum' or 'degree' (e.g., viruses on the tree of life?), but the law demanded YES/NO. Your struggle wasn't just about life – it was about forcing a discrete verdict onto a potentially fuzzy reality. Question *that* binary too."

  **Why This Works:**

  1.  **Registrar's Literal Application:** Forces groups to *confront* their definition's implications immediately. No hiding.
  2.  **Strict Timing:** Prevents rabbit holes, protects the audit/debrief. Use a loud timer.
  3.  **Advocate Verdicts:** Random assignment + arguing *against* likely intuitions (e.g., pro-flame) creates productive friction.
  4.  **Token Scarcity & Rush Amendments:** Makes patching feel desperate and costly, mirroring epicycles. Freezing definitions creates palpable vulnerability for the audit.
  5.  **Audit Focus on Frozen Definitions:** Highlights the *inescapable* contradictions created by ad-hoc patching under pressure. Visual proof of failure.
  6.  **Debrief Structure:** Moves cleanly from feeling (mapping) → analysis (stress points) → conceptual options → naming the unresolved tension → exposing the artificial binary.

  **Handling Predictable Problems:**

  *   **"It's just semantics!":** "Absolutely a valid philosophical position! *However*, the Treaty Commission requires a verdict today. As panelists, you *must* apply a standard. What standard will you use *right now*? Advocate, proceed." (Action > theory in the moment; validate in debrief).
  *   **Flame as Joke:** Brief the advocate privately: "Your job is to make the *serious* scientific analogy: consumption of fuel, growth, replication via spreading, waste products. Argue it has more claim than the digital program." Registrar applies definitions literally.
  *   **Consensus Pressure/Over-arguing Advocates:** Enforce blind votes. Remind advocates: "Your goal is conceptual clarity, not winning the vote. Highlight the tension."
  *   **Early Token Burn:** This is *good*. It creates tension and sets up the audit. Let them feel the scarcity.
  *   **Biologist/Philosopher Divide:** The mechanics (literal application, audit) force both sides to engage with the practical consequences of abstract definitions and empirical details. Assign mixed groups.

  This design ensures the "failure" and "tension" aren't abstract concepts you explain, but lived experiences of frustration, scarcity, contradiction, and the weight of a forced binary decision that participants actively wrestle with for 75 minutes before you even name it. The debrief simply connects the dots they've already drawn.
