     So what are the possible pairs for (top-left, top-right)? Remember, the numbers are distinct.
     Possible: (1,3), (2,3), (3,4) [because 3 must be in the top row and the top-left must be less than top-right].

  Step 2: For each possibility of the top row, consider the remaining numbers for the bottom row.

     Case A: top row = (1,3)
