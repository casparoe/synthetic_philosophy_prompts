     Given the difficulty, let's allow the Popperians to write down arrangements and check against the rules without cost? And then we'll explain in debrief that in reality, internal simulation is not always accurate? But in the game, we are giving them the ability to check without cost? That might be a flaw.

     But note: in the Popperian creature, the internal testing is safe and cheap. So in the game, we can simulate that by allowing free testing on paper? The difference with the Skinnerian is that the Skinnerian pays for each test, but the Popperian does not? Then the trade-off is that the Popperian has an advantage in being able to test freely.

     But then what is the disadvantage of Popperian? In the game, none? But in reality, internal testing requires a complex brain? We cannot simulate that cost.

     So we accept: the Popperian in the game can test freely on paper.

     And the Gregorian has extra: tools and sharing.

  4. The Gregorians might solve it very quickly? Then they are done.

  Debrief mapping:

  - Darwinian: illustrates fixed response without feedback or adaptation.
  - Skinnerian: illustrates adaptive learning by trial and error, but with cost (tokens) and risk of running out.
  - Popperian: illustrates the ability to test hypotheses internally (or on paper without cost) before committing.
  - Gregorian: illustrates the use of external tools (the guided worksheet) and cultural sharing (collaboration) to solve the problem more efficiently.

  What the activity cannot reproduce:

  1. The Darwinian creature's fixed repertoire was acquired over evolutionary time (slowly). In the game, we assign it arbitrarily.

  2. The Gregorian mind-tools are themselves cultural products that have evolved by cultural selection. In the game, we provide the worksheet as a given, without showing how it was developed.

  3. The dependence of higher grades on the lower ones: for example, the Popperian and Gregorian creatures still rely on Darwinian mechanisms for basic survival and Skinnerian learning for some behaviors. We don't show that in the game.

  4. The cost of building the internal model for Popperian: in reality, having a brain capable of internal simulation is expensive (energy, development). We don't simulate that.

  Rules Summary:

  Materials:

  - Task sheet for all (describing the puzzle and rules).
  - For Darwinians: a fixed arrangement (randomly generated) written on their task sheet.
  - For Skinnerians: 5 tokens (e.g., poker chips), a stack of trial sheets (blank grids), and a rule sheet. They also have an answer sheet.
  - For Popperians: paper and pen for notes, and an answer sheet.
  - For Gregorians: one guided worksheet per group (if they are a group) or per person? Since they are a group, one worksheet for the group. They also have paper and pen, and an answer sheet.

  Puzzle:

  Task sheet says:
  "Arrange the numbers 1, 2, 3, 4 in the 2x2 grid below (label the cells: top-left, top-right, bottom-left, bottom-right). The rules are:
  1. The top row: the number in the left cell is less than the number in the right cell.
  2. The left column: the number in the top cell is less than the number in the bottom cell.
  3. The number 3 is in the top row.

  You must write your final arrangement in the answer sheet."

  Guided worksheet for Gregorian:

