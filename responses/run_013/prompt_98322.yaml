prompt: |-
  I sit on the secretariat of a parliamentary committee that screens pronatalist proposals — birth bonuses, childcare and parental-leave expansions, immigration measures justified as population policy. We see about a dozen a year, each with real money attached, and I have to hand the minister a one-page recommendation: adopt, reject, or adopt with conditions. I know cost-benefit analysis and demography; I do not know population ethics.

  Write me a decision procedure I can actually run in an afternoon, built on what population ethics establishes rather than on one school. Sequence the questions to ask: does the policy change how many people exist, or only how well existing people live; are the added lives worth living, and by whose standard; are we comparing totals, averages, or some threshold below which an added life does not count toward the good; what to do when a policy looks better on totals and worse on averages; what to do when the people a policy benefits would not have existed at all under the alternative, so that we cannot say the policy made anyone worse off. For each step, say what counts as a sufficient answer, where the procedure terminates in a rejection, and where it must hand the decision to a value judgment — for instance, choosing the threshold at which an added life stops counting, or deciding whether the interests of people who do not yet exist may be discounted. State plainly where the procedure cannot be made non-arbitrary, and what it cannot do at all.

  Two things to fold in. First, our chair has proposed a working rule that no policy may reduce the average wellbeing of people already living, whatever it does to totals; the procedure should say whether that rule can be accommodated, and at what cost. Second, the procedure has to survive the case of a policy that adds many lives that are only barely worth living.

  Then run it on three proposals: a monthly cash bonus per birth; a childcare subsidy that improves the lives of existing families without changing how many children are born; and an expansion of skilled immigration that raises both the number of residents and their average wellbeing. At least one should come out the way I will not like — say so plainly and explain why that does not by itself discredit the procedure. Keep the deliverable usable: questions, stopping rules, and residual judgment calls, in that order, with the reasoning compressed.
reasoning: |-
  We are designing a decision procedure for pronatalist policies that incorporates key questions from population ethics. The goal is to have a structured sequence of questions that can be run in an afternoon, leading to a recommendation (adopt, reject, adopt with conditions) or identifying where a value judgment is necessary.

  The procedure must address:
  1. Whether the policy changes the number of people or only the wellbeing of existing people.
  2. The worth of added lives and by whose standard.
  3. The aggregation method (totals, averages, threshold).
  4. Conflicts between total and average wellbeing.
  5. Non-identity problem (when the policy benefits people who wouldn't exist otherwise).

  Additionally, we incorporate the chair's rule: no policy may reduce the average wellbeing of people already living.

  We also consider the case of adding many lives barely worth living.

  The procedure will be applied to three proposals:
  A. Monthly cash bonus per birth (expected to increase births, some of which may be in families with lower resources, potentially leading to children with lower wellbeing).
  B. Childcare subsidy that improves lives of existing families without changing the number of children born.
  C. Expansion of skilled immigration that raises both the number of residents and their average wellbeing.

  We structure the procedure as a sequence of questions. At each step, we may terminate with a recommendation or proceed to the next question. Some steps require a value judgment.

  ---

  **Decision Procedure:**

  **Step 1: Does the policy change the number of people who will exist?**
     - **If NO**: Then the policy only affects the wellbeing of existing people. Proceed to Step 1a.
     - **If YES**: Then the policy creates (or prevents) lives. Proceed to Step 2.

  **Step 1a (Only affects existing people):** 
     - We are in the fixed population case. We can use standard cost-benefit analysis (e.g., total or average wellbeing) without population ethics complications.
     - **Decision rule**: Adopt if it increases the total wellbeing (or average wellbeing, but note the chair's rule already requires non-reduction of average wellbeing for existing people) without harming others in a way that violates other constraints (like equity). However, we must also consider the chair's rule: the policy must not reduce the average wellbeing of people already living. Since the population is fixed, we can compute the change in average wellbeing for existing people. 
        - If the policy increases (or at least does not reduce) the average wellbeing of existing people and passes cost-benefit (i.e., net benefits are positive), then **adopt** (possibly with conditions to ensure no group is made worse off if equity is a concern). 
        - If it reduces average wellbeing of existing people, then **reject** (by the chair's rule). 
        - Otherwise, if it passes cost-benefit but we have distributional concerns, we might adopt with conditions (e.g., compensatory measures). 
     - **Termination**: This step can lead to a recommendation without proceeding further.

  **Step 2 (Policy changes the number of people):**
     - We now have to consider the added lives. We must determine whether the added lives are worth living.

  **Step 2a: Are the added lives worth living?**
     - **Definition**: A life is worth living if the person in that life would judge it as such (i.e., they would not prefer not to have been born). This is a minimal requirement and typically requires that the life has positive wellbeing (above zero on a scale where zero represents a life barely worth living).
     - **How to assess**: We need to project the wellbeing of the added individuals. If we can reasonably expect that the added lives will have wellbeing above zero, then they are worth living. If any added life is expected to be below zero (i.e., not worth living), then the policy might be causing harm by creating a miserable life.
     - **Decision rule**:
        - If we find that at least one added life is not worth living (wellbeing below zero), then **reject** the policy (on non-maleficence grounds: avoid creating miserable lives).
        - If all added lives are worth living (wellbeing above zero), then proceed to Step 3.
        - If uncertain, we must make a judgment call. If the probability of creating a life below zero is non-negligible, we might reject or condition the policy (e.g., target only groups where we are confident the child will have a life above zero). Otherwise, proceed with caution.

  **Step 3: How do we aggregate wellbeing?**
     - We must choose between total utilitarianism (TU), average utilitarianism (AU), or a critical-level view (CL). This step requires a value judgment because population ethics does not establish one as the only correct view. However, we can structure the analysis to see the implications of each and then decide.

     **Step 3a: Compare the policy to the alternative (status quo or other) on three metrics:**
        - **Total wellbeing (TU)**: Sum of wellbeing of all people (existing and added).
        - **Average wellbeing (AU)**: Total wellbeing divided by total population.
        - **Critical-level (CL)**: Choose a critical level c (a threshold above which an added life counts positively). Then, the value of a population is the sum of (wellbeing_i - c) for each individual i. Note: c is typically set above zero (e.g., c>0) to avoid the repugnant conclusion.

     **Step 3b: Assess the chair's rule** (no reduction in average wellbeing of existing people). This rule applies regardless of aggregation. Compute the change in average wellbeing for the group that exists in both scenarios (the pre-existing people). If the policy reduces their average wellbeing, then by the chair's rule we must **reject** unless we can condition the policy to avoid that reduction. If it does not reduce (or increases) their average wellbeing, then the chair's rule is satisfied.

     **Step 3c: Now, consider the overall effect:**
        - If the chair's rule is violated: **reject**.
        - If the chair's rule is satisfied, then we look at the aggregation methods.

     **Step 3d: Compare the policy to the alternative using TU, AU, and CL (with a chosen c).**
        - If all three methods agree (all say the policy is better, or at least two out of three if we are to break ties), then we have a clear case.
        - If they disagree, then we have to make a value judgment.

     **Step 3e: Handling disagreements:**
        - **TU vs AU**: If TU increases but AU decreases (the classic conflict), then we must choose between the two. This is a fundamental value judgment. We cannot avoid arbitrariness here. We might look to other considerations (e.g., sustainability, equity) but ultimately we must decide on the relative importance of total vs average. 
            - *Note*: The chair's rule already protects the average wellbeing of existing people, but the overall average might still fall due to the added people (if they have below-average wellbeing). The chair's rule does not directly address the overall average. However, the chair's rule only constrains the existing people's average. So the overall average might fall without violating the rule. In that case, we are left with the conflict between TU and overall AU.

        - **CL vs others**: The critical level view avoids the repugnant conclusion but requires setting c. The choice of c is arbitrary? (It might be set by societal consensus, e.g., at a level that is considered a decent minimum.) If we set c=0, then CL becomes TU. If we set c very high, then we require a high wellbeing for added lives to count positively.

     **Step 3f: Making a decision in case of disagreement**:
        - We must explicitly note that the decision depends on the aggregation method chosen. Since the committee must make a recommendation, we might:
            (a) Adopt if at least two of the three (TU, AU, CL with a predetermined c) are positive and the chair's rule is satisfied.
            (b) Or, if we have a predetermined stance (e.g., the government favors total utilitarianism), then we follow that.
            (c) If we cannot resolve the disagreement, we might condition the policy (e.g., target only when the added lives are above a certain wellbeing threshold) or reject.

     **Termination**: We aim to get a recommendation at this step, but note that Step 3 requires setting the critical level and choosing between TU and AU in case of conflict. We must flag the need for a value judgment.

  **Step 4: Non-identity problem (when the policy benefits people who wouldn't exist otherwise)**
     - This issue is partially addressed in Step 2a and Step 3. In Step 2a, we require that the added lives are worth living. Then in Step 3, we count the wellbeing of the added lives (with the chosen aggregation). 
     - However, note that without the policy, the added individuals would not exist. Therefore, we cannot say that the policy makes them better off than they would have been (because they wouldn't have been). This is the non-identity problem. But if we accept that we can compare existence to non-existence (by the condition of the life being worth living) and we count the wellbeing of the added lives (as in TU, AU, or CL), then we have incorporated them. 
     - **Conclusion**: The non-identity problem does not require an extra step in the procedure if we have already passed Step 2a and are counting the added lives in Step 3. However, it underlies the ethical challenge in Step 3.

  **Special Case: Barely worth living lives**
     - Consider a policy that adds many lives that are barely worth living (wellbeing just above zero). 
        - **TU**: This will increase total wellbeing (because each added life has positive wellbeing, so the sum increases). Thus, TU would recommend the policy.
        - **AU**: If the added lives have wellbeing below the current average, then the overall average wellbeing will decrease. Thus, AU would reject the policy.
        - **CL (with c>0)**: If the wellbeing of the added lives is below c, then each added life contributes negatively (wellbeing - c is negative). Thus, CL would reject the policy. But note: if c=0, then it becomes TU and accepts.
     - The procedure will flag this conflict in Step 3. We must then make a value judgment: is it acceptable to add many barely worth living lives? This is the repugnant conclusion. The procedure cannot resolve this without a prior choice of aggregation method.

  **Summary of the Procedure:**

  1. **Does the policy change the number of people?**
     - No: Go to Step 1a (fixed population) -> Check chair's rule and cost-benefit -> Recommend.
     - Yes: Go to Step 2.

  2. **Are all added lives worth living?** (wellbeing > 0)
     - No: Reject.
     - Yes: Go to Step 3.

  3. **Aggregation and chair's rule:**
     a. Check chair's rule: Does the policy reduce the average wellbeing of the people already living? 
          - Yes: Reject.
          - No: Proceed.
     b. Compute the change in total wellbeing (TU), average wellbeing (AU), and critical-level wellbeing (CL) with a chosen c (if c is not set, this requires a value judgment).
     c. If all three (TU, AU, CL) agree the policy is better: Adopt.
        If two out of three agree: Consider adopting (but note which one disagrees and why).
        If they disagree (e.g., TU positive, AU negative, CL negative): Then we have a conflict. 
          - We must make a value judgment: choose between TU, AU, or CL (and if CL, set c). 
          - Without a predetermined choice, we cannot avoid arbitrariness. The committee might adopt a default (e.g., if the government has a stated position) or reject in case of major conflict.

  **Residual Judgment Calls:**
     - The critical level c in the CL view: How to set it? This must be set by the committee (e.g., at the level of a decent minimum, or at zero) or by higher-level policy.
     - The choice between TU and AU when they conflict: This requires a value judgment. The committee might have a standing rule (e.g., we prioritize TU, or AU) or might reject any policy that does not pass both (but that would be very strict).
     - The discounting of future people: The procedure does not discount the wellbeing of future people (added lives). If the committee wishes to discount, they must explicitly decide the discount rate (but that would be a departure from standard population ethics, which treats all people equally).

  **Applying the procedure to the three proposals:**

  **Proposal A: Monthly cash bonus per birth**
     - Step 1: It changes the number of people (increases births) -> Step 2.
     - Step 2: We assume the added lives are worth living (wellbeing>0). If we have evidence that some children might be born into such dire circumstances that their lives are not worth living, we might reject. But let's assume they are above zero. Proceed.
     - Step 3:
          a. Chair's rule: Check the effect on existing people. The bonus might be financed by taxes, which could reduce the average wellbeing of existing people. If so, reject. But let's assume the funding is from a progressive tax that does not reduce the average wellbeing of existing people (or the reduction is offset by other benefits). Then proceed.
          b. Compute:
              - TU: The added lives have positive wellbeing, so TU increases.
              - AU: The added children might have lower-than-average wellbeing (if the bonus attracts mainly low-income families who would have had children anyway or if the bonus leads to more children in families that are less prepared). This could lower the overall average. 
              - CL: If the added children have wellbeing below c (the critical level), then CL would be negative. But if they are above c, then positive.
          c. Conflict: TU positive, AU negative (if the added lives have below-average wellbeing), and CL negative (if their wellbeing is below c). 
          d. We must make a value judgment. If we use TU alone, we would adopt. But if we care about average or critical level, we might reject.
     - **Recommendation**: This proposal is likely to be rejected if we use AU or CL (with c>0) because it might lower the average and the added children might have wellbeing below the critical level. However, if we prioritize TU, it would be adopted. Since the chair's rule is satisfied (existing people's average not reduced), the conflict remains. Without a predetermined aggregation method, we might reject due to the risk of lowering the overall average. 

     *Note*: This might be the result you don't like if you are a total utilitarian. But the procedure does not discredit itself because it highlights the ethical conflict.

  **Proposal B: Childcare subsidy (no change in number of people)**
     - Step 1: No change in population -> Step 1a.
     - Step 1a: 
          - It improves the wellbeing of existing families (by reducing childcare costs) without reducing the average wellbeing of existing people (we assume the funding does not harm the average of existing people). 
          - It increases total wellbeing and the average wellbeing of existing people (if the subsidy is targeted at families, but note: the average of the entire existing population might still increase if the benefits are large enough or if funded by a progressive tax). 
          - Therefore, it passes the chair's rule and cost-benefit. 
     - **Recommendation**: Adopt.

  **Proposal C: Expansion of skilled immigration**
     - Step 1: It increases the number of people -> Step 2.
     - Step 2: The added immigrants are expected to have lives well above zero -> proceed.
     - Step 3:
          a. Chair's rule: The existing residents: the policy might raise their average wellbeing (if the immigrants are skilled, they might contribute to the economy, raising wages or reducing prices). So the chair's rule is satisfied (if not, we might condition the policy to ensure that).
          b. Compute:
              - TU: Increases (more people with positive wellbeing).
              - AU: If the immigrants have higher wellbeing than the current average, then the overall average increases. (Even if they have the same, the average stays the same.) So AU increases or stays the same.
              - CL: If the immigrants have wellbeing above c, then CL increases.
          c. All three methods agree: the policy is better.
     - **Recommendation**: Adopt.

  **Conclusion**:
  The procedure is usable and highlights the key ethical issues. It requires value judgments in the aggregation step (Step 3) and in setting the critical level. The chair's rule is accommodated by being a necessary condition (non-reduction of average wellbeing of existing people) that must be checked. The procedure cannot avoid arbitrariness in the choice of aggregation method, but it makes that arbitrariness explicit. It also handles the repugnant conclusion scenario by forcing a choice between TU and AU/CL.

  The procedure might reject Proposal A even if it increases total wellbeing, which a total utilitarian would not like. But that is because the procedure requires considering other views and the chair's rule. This does not discredit the procedure; it reflects the inherent ethical disagreements in population policy.
answer: |-
  ### Decision Procedure for Pronatalist Policy Evaluation  
  **Goal:** In one afternoon, produce a recommendation (adopt/reject/adopt with conditions) by addressing population ethics questions sequentially. Terminate early if possible; flag unavoidable value judgments.  

  ---

  #### **Step 1: Does the policy change the number of people who will exist?**  
  - **If NO (fixed population):** Proceed to Step 1a.  
  - **If YES (variable population):** Proceed to Step 2.  
  - **Sufficient answer:** Demographic projections from existing data (e.g., fertility/immigration rates).  
  - **Termination:** None.  

  **Step 1a (Fixed population):**  
  - Assess impact **only on existing people's wellbeing** (e.g., via cost-benefit analysis).  
  - Apply the chair’s rule: **Reject if average wellbeing of *existing people* decreases.**  
  - Else, adopt if net benefits are positive.  
  - **Termination:** Recommendation reached (adopt/reject).  
  - **Value judgment?** None beyond standard cost-benefit.  

  ---

  #### **Step 2: Are added lives "worth living"?**  
  *(Only if population changes)*  
  - **Definition:** A life is "worth living" if its wellbeing is >0 (where 0 = neutral point; existence not worse than non-existence).  
  - **Assessment:** Project wellbeing of added lives (e.g., income, health, social support). Use thresholds like poverty line or life satisfaction metrics.  
  - **Decision:**  
    - If **any added life is not worth living (wellbeing ≤0) → Reject.**  
    - If **all added lives are worth living (wellbeing >0) → Proceed to Step 3.**  
  - **Sufficient answer:** Wellbeing estimates from historical analogs or policy simulations.  
  - **Termination:** Reject if any life fails the threshold.  
  - **Value judgment?** Setting the "neutral point" (0 wellbeing). Default: Societal minimum (e.g., no chronic suffering).  

  ---

  #### **Step 3: How do we aggregate wellbeing across populations?**  
  *(Resolve conflicts between total, average, and critical-level views)*  
  - **Compute three metrics:**  
    1. **Total Utilitarianism (TU):** Sum of wellbeing of all people (existing + added).  
    2. **Average Utilitarianism (AU):** Total wellbeing ÷ total population.  
    3. **Critical-Level (CL):** Sum of (wellbeing - *c*) for all people, where *c* is a threshold (e.g., *c*=0.5×current average).  
  - **Decision rules:**  
    - If **all three metrics improve → Adopt.**  
    - If **TU improves but AU/CL worsen → Proceed to Step 3a.**  
    - If **any metric worsens and none improve → Reject.**  
  - **Sufficient answer:** Quantitative wellbeing projections (existing + added lives).  
  - **Termination:** Adopt if all metrics agree; reject if all disagree.  
  - **Value judgment?** Choice of *c* for CL (arbitrary; no consensus in ethics). Default: *c* = 50% of current average wellbeing.  

  **Step 3a (TU vs. AU/CL conflict):**  
  - **Apply chair’s rule:** Reject if average wellbeing of *existing people* decreases.  
  - **If chair’s rule satisfied:** Decision depends on prioritization:  
    - If **TU ↑ and AU ↓/CL ↓ → Hand to value judgment.**  
      - *Options:* Prioritize TU (favors more lives), AU (favors quality), or CL (favors lives above *c*).  
      - *Default:* Reject if added lives are below *c* (CL) or AU loss exceeds TU gain.  
  - **Value judgment?** Choosing between TU/AU/CL when they conflict. **Arbitrary; no ethical consensus.**  

  ---

  #### **Step 4: Non-identity problem**  
  *(When beneficiaries would not exist without the policy)*  
  - **Question:** Can we say the policy harms/benefits added people?  
  - **Procedure:**  
    - If wellbeing of added lives >0 (from Step 2), their existence is a **net gain** (non-identity does not block adoption).  
    - If wellbeing of added lives is low (but >0), weigh against TU/AU/CL conflicts (Step 3).  
  - **Sufficient answer:** Already covered in Steps 2-3.  
  - **Termination:** No standalone decision; embedded in prior steps.  
  - **Value judgment?** None beyond Step 2’s "worth living" threshold.  

  ---

  #### **Handling Special Cases**  
  - **Chair’s rule:** Explicitly enforced in Step 1a (fixed pop) and Step 3a (variable pop). **Cost:** May reject TU-positive policies if they dilute averages.  
  - **Barely worth living lives:** Addressed in Step 2 (must be >0) and Step 3 (TU favors, AU/CL disfavor). Forces value judgment in Step 3a.  
  - **What the procedure cannot do:**  
    - Resolve TU vs. AU/CL conflicts non-arbitrarily (Step 3a).  
    - Set the critical level *c* objectively (inherently value-laden).  
    - Discount future people’s wellbeing (assumes equal weighting).  

  ---

  ### Application to Proposals  
  **Proposal A: Monthly cash bonus per birth**  
  - **Step 1:** Increases births (variable pop).  
  - **Step 2:** Added lives likely >0 wellbeing (assume adequate social support).  
  - **Step 3:**  
    - TU ↑ (more people with positive wellbeing).  
    - AU ↓ (if added lives are poorer; dilutes average).  
    - CL ↓ (if wellbeing of added lives < *c*).  
  - **Step 3a:** TU ↑ vs. AU/CL ↓ → **Value judgment needed.**  
    - *Chair’s rule:* If existing people’s average wellbeing unchanged, adopt only if TU prioritized.  
    - *Default:* Reject (due to AU/CL decline).  
  - **Result:** Likely **reject** (may conflict with TU preferences).  

  **Proposal B: Childcare subsidy (no birth change)**  
  - **Step 1:** Fixed population.  
  - **Step 1a:** Improves wellbeing of existing families. Chair’s rule satisfied (average wellbeing ↑). Net benefits likely positive.  
  - **Result: Adopt.**  

  **Proposal C: Skilled immigration expansion**  
  - **Step 1:** Increases population.  
  - **Step 2:** Added lives >0 wellbeing (skilled migrants).  
  - **Step 3:** TU ↑ (more people), AU ↑ (higher-skilled migrants raise average), CL ↑ (wellbeing > *c*).  
  - **Result: Adopt.**  

  ---

  ### Why You Might Dislike the Outcome  
  - **Proposal A (cash bonus) is likely rejected** if AU/CL metrics are prioritized, even if TU supports it. This reflects the "repugnant conclusion" dilemma: adding many barely flourishing lives may increase totals but reduce averages. **This does not discredit the procedure**—it exposes a core, unresolved tension in population ethics (TU vs. AU). The procedure forces explicit value judgments where ethics provides no consensus, ensuring transparency.  

  ### Deliverable Summary  
  1. **Questions to ask:**  
     - Does the policy change population size?  
     - Are added lives worth living (>0 wellbeing)?  
     - How do total, average, and critical-level wellbeing change?  
     - Does TU/AU/CL conflict?  
     - Does the chair’s rule hold?  
  2. **Stopping rules:**  
     - Reject if any added life ≤0 wellbeing.  
     - Reject if chair’s rule violated.  
     - Adopt/reject if all wellbeing metrics agree.  
  3. **Residual judgment calls:**  
     - Setting the "neutral point" for "worth living" (Step 2).  
     - Choosing *c* for critical-level wellbeing (Step 3).  
     - Prioritizing TU vs. AU/CL in conflicts (Step 3a).  

  **Time estimate:** 3-4 hours per proposal (demographic analysis: 1h; wellbeing projection: 1h; aggregation/metrics: 1-2h).
