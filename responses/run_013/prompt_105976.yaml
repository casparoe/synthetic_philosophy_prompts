answer: |-
  ### (1) Examination Question  
  **Time Allowed:** 60 minutes  
  **Word Limit:** Approximately 800 words  

  **QUESTION:**  
  Aristotle’s *Nicomachean Ethics* V.5 states both that "Money then serves as a measure which makes things commensurable and so reduces them to equality" and that "Though therefore it is impossible for things so different to become commensurable in the strict sense, our demand furnishes a sufficiently accurate common measure for practical purposes."  

  **Using only these two statements and course material**, address the following:  
  (a) Explain the **scaffolding reading** (money reveals pre-existing ratios) and the **constitution reading** (money creates comparability) of money’s function.  
  (b) Apply both readings to **Case A**: A currency-less community where one ox consistently trades for ten measures of grain.  
  (c) Apply both readings to **Case B**: A community with official currency, but prices fluctuate unpredictably.  
  (d) Argue whether Aristotle’s two statements better support *one* reading over the other, or leave the choice open. Consider:  
     - How each reading accommodates Aristotle’s claim that "need" holds exchange together.  
     - Whether heterogeneous needs can function as a "common measure."  

  *Do not discuss: use/exchange value distinctions, labour/marginalist theories, or named commentators.*  

  ---

  ### (2) Model Answer (798 words)  

  Aristotle’s seemingly contradictory claims about money in *NE* V.5 reveal a deeper tension in his theory of exchange. While he asserts money makes goods commensurable and equal, he concedes strict commensurability is impossible, with "demand" (rooted in need) enabling a practical measure. This tension can be parsed through two interpretive frameworks: the scaffolding reading and the constitution reading.  

  The **scaffolding reading** holds that money is a passive instrument revealing pre-existing ratios of value inherent in goods themselves. Money "registers" objective comparability grounded in human need or utility. If money fails to reflect these ratios (e.g., in Case B), it is dysfunctional. Conversely, the **constitution reading** argues money actively creates a field of comparability where none existed. Goods, being radically heterogeneous, only become commensurable through the social practice of monetary exchange. Money doesn’t track value; it constitutes it.  

  Applying these to **Case A** (barter without money), the scaffolding reading finds no contradiction: the stable ox-grain ratio (1:10) reflects an underlying comparability based on communal needs. Money isn’t needed to reveal this ratio; it exists independently in the recurring, need-based exchanges. The constitution reading struggles here. If money constitutes value, how does comparability exist *before* its introduction? The 1:10 ratio suggests a proto-measure emerges from repeated need-driven exchanges, implying comparability begins forming through shared practices *prior* to money. Aristotle’s concession that strict commensurability is impossible hints at this: needs generate rough equivalence even without money, challenging the constitution claim that money alone creates the field.  

  In **Case B** (chaotic currency), the scaffolding reading declares the currency defective. If prices drift unpredictably, money fails its core function of revealing stable ratios grounded in need. The constitution reading, however, might argue that money *is* functioning—it’s constituting value—but unpredictably. Yet Aristotle links money’s validity to its reliability for "practical purposes." Erratic prices violate this, undermining exchange. Both readings agree Case B’s money is flawed, but for different reasons: scaffolding sees a broken instrument; constitution sees a dysfunctional practice.  

  Aristotle’s statements better support a **modified scaffolding reading**. His concession that strict commensurability is impossible ("things so different") refutes a strong scaffolding view where ratios exist perfectly independent of human practice. Needs are too diverse for mathematical precision. However, his insistence that "demand furnishes a sufficiently accurate common measure" points to need—not money—as the foundational source of rough comparability. Money *operationalizes* this pre-existing (though imperfect) comparability into a clear, actionable measure ("reduces them to equality"). Money scaffolds *because* need provides a basis for comparison.  

  This resolves the tension: Money’s role is derivative. It is a "sufficiently accurate" *tool* for quantifying and equalizing what need already loosely binds. In Case A, need directly establishes a practical ratio through custom. Money, when present (ideally), refines this into a universal equivalent. In Case B, money fails as a tool because it doesn’t accurately translate need-based ratios into reliable prices.  

  Can heterogeneous needs serve as a "common measure"? Aristotle implies yes, but only practically, not metaphysically. Needs are diverse (food, shelter, tools), but all stem from human life and community (oikos/polis). This shared telos allows needs to be compared *in relation to* fulfilling a good life, even if not identically. One ox and ten grain-measures sustain life similarly in Case A; their ratio arises from experiential understanding of mutual need-satisfaction. Money abstracts this concrete need-relation into a number, making equivalence explicit and transferable. Aristotle’s distinction between natural acquisition (bounded by need) and unnatural (infinite gain) clarifies this: need anchors value in life’s requirements, making limited comparison possible. Money’s measure derives authority from this natural foundation; when divorced from it (as in unnatural acquisition or Case B), it becomes arbitrary.  

  The constitution reading overstates money’s creative power. If money alone constituted value, Aristotle couldn’t claim need holds exchange together *or* that strict commensurability is impossible—money would make it possible. His concession acknowledges a reality prior to money: goods are incompletely comparable due to differing natures/uses, yet need forces a practical equivalence. Money doesn’t create this equivalence; it formalizes and extends it. The scaffolding reading, softened by Aristotle’s pragmatism, fits best: ratios exist inchoately in need-based practices, and money is a socially sanctioned tool to measure them "sufficiently" for justice in exchange.  

  ---

  ### (3) Marking Scheme (Total: 20 marks)  

  | **Must-Hit Point**                                                                 | **Marks** | **Common Miss**                                                                 |
  | :--------------------------------------------------------------------------------- | :-------: | :------------------------------------------------------------------------------ |
  | **1. Clear explanation of scaffolding vs. constitution readings**                  |     4     | Confusing the two; misstating core claims (e.g., "constitution says money tracks reality"). |
  | **2. Correct application of BOTH readings to Case A AND Case B**                   |     5     | Ignoring one case/reading; misapplying (e.g., "Case A disproves constitution"). |
  | **3. Engagement with Aristotle’s "need" as unifying exchange**                    |     4     | Ignoring need; failing to address if heterogeneous needs can be a measure.      |
  | **4. Analysis of tension: How concession modifies scaffolding/limits constitution** |     4     | Treating quotes as non-contradictory; not explaining "practical purposes."      |
  | **5. Defensible verdict on which reading fits best OR why it’s unresolved**        |     3     | Undefended preference; claiming perfect fit for both; reverting to forbidden theories. |

  ---

  ### (4) Guidance for Second Marker  

  An **A answer** (18-20) decisively resolves the tension by showing how Aristotle’s "need" provides a foundation for rough comparability that money operationalizes (scaffolding), while his concession refutes strong objectivism. It seamlessly integrates the natural/unnatural acquisition distinction to explain need’s role, uses the test cases to expose weaknesses in *both* readings (e.g., constitution struggles with Case A; strict scaffolding clashes with the concession), and argues persuasively why money depends on need—not vice-versa—without quoting extraneous text.  
    
  A **B answer** (15-17) accurately summarizes both readings and applies them to the cases but struggles to synthesize Aristotle’s statements into a coherent whole. It may note need’s importance but not fully explain how it enables practical commensurability, or it may assert a verdict without thoroughly confronting how the concession challenges scaffolding or how Case A challenges constitution. Analysis remains competent but lacks nuance in reconciling Aristotle’s pragmatism with his metaphysical reservations.
