answer: |-
  Here's your menu dissecting "hard work never killed anyone," laid out plain and straight. We'll break down the claims, test their truth, and expose what's really being said—plus how it applies to your boss, the 35-hour-week crowd, and the Weberians.

  ---

  ### **The "Hard Work Never Killed Anyone" Menu**
  *(Ordered from weakest to strongest claim)*

  1. **The Literal Claim**  
     - **What it says:** Physical labor has never been the *direct cause* of death in human history.  
     - **What it requires:** "Work" = physical exertion. "Killed" = immediate, direct fatality (e.g., heart attack on the job). "Never" = zero documented cases.  
     - **Verdict:** **False.** Karoshi is real—Japan recognizes overwork deaths (stroke, heart failure) as compensable. Even OSHA tracks work-related fatalities globally.  

  2. **The Tautological Claim**  
     - **What it says:** "If someone died, it wasn't *truly* 'hard work'—it was something else (stress, neglect, etc.)."  
     - **What it requires:** "Work" = only pure effort, excluding context (toxic culture, sleep deprivation). "Killed" = redefined after the fact to exclude work. "Never" = true by circular logic.  
     - **Verdict:** **Trivially "true" but useless.** Redefines "work" to dodge evidence. Karoshi? "Not *real* work!" (Spoiler: it is.)  

  3. **The Risk-Free Claim**  
     - **What it says:** Work itself isn't *inherently dangerous* (unlike skydiving or coal mining).  
     - **What it requires:** "Work" = typical office/white-collar labor. "Killed" = acute physical trauma. "Never" = statistically negligible risk.  
     - **Verdict:** **Half-true but irrelevant.** Office work won't crush you like a forklift, but chronic stress *is* a killer. Ignores karoshi entirely.  

  4. **The Moderation Claim**  
     - **What it says:** *Reasonable* hard work won't harm you—it might even build resilience.  
     - **What it requires:** "Work" = balanced effort with recovery. "Killed" = long-term health collapse. "Never" = within sustainable limits.  
     - **Verdict:** **Defensible (with caveats).** True for 40-hour weeks with sleep/vacation. False for 60-hour marathons. Karoshi happens when "moderation" is ignored.  

  5. **The Moral Claim**  
     - **What it says:** Hard work is virtuous; avoiding it is weak or immoral. Death is irrelevant—what matters is your character.  
     - **What it requires:** "Work" = a moral duty. "Killed" = beside the point. "Never" = a slogan, not a fact.  
     - **Verdict:** **Substantive but loaded.** Not about facts—it's about values (hello, Weber). Unprovable and weaponized to shame "laziness."  

  6. **The Rhetorical Shutdown**  
     - **What it says:** "Stop complaining—suck it up."  
     - **What it requires:** "Work" = whatever I say it is. "Killed" = not literal. "Never" = a power move.  
     - **Verdict:** **Not a claim—a tactic.** Designed to end debate. Truth is irrelevant.  

  ---

  ### **Your Manager's Move: Which Reading?**
  - **Most plausible:** A mix of **#5 (Moral Claim)** and **#6 (Rhetorical Shutdown)**. His "I do 60 hours and I'm fine" is anecdotal "evidence" for #4/5, but it’s really virtue-signaling: *"My suffering proves my worth, and yours would too."*  
  - **Does it justify 6pm stops as "lazy"?** **No.**  
    - His personal endurance **proves nothing** (survivorship bias: you don't meet the karoshi victims).  
    - It **equates hours with value**, ignoring productivity science (output often falls after 50 hours).  
    - It **confuses suffering with merit**. Wanting boundaries isn't laziness—it’s sustainability.  

  ---

  ### **The Cultural Battles: Who’s Using Which Reading?**
  - **French 35-Hour-Week Advocates:**  
    - **Attack #5 (Moral Claim).** They see work as a **contract**, not a calling. Shorter hours = a *right* to life outside labor. Their enemy: "work as soul-cleansing."  
  - **Weber's Protestant Work Ethic Crowd:**  
    - **Defend #5 (Moral Claim).** Work is a **virtuous calling**—suffering for it is noble. Your manager is channeling this.  
    - **Irony:** Weber *described* this mindset, not endorsed it. But your friend’s right: it’s why "hard work = good soul" feels intuitive in capitalist cultures.  

  **Why they talk past each other:**  
  - **Weberians** (#5) say: *"Work is sacred!"*  
  - **French advocates** reject #5 entirely: *"Work is transactional!"*  
  - **Karoshi** refutes #1-4, but moralists (#5) dismiss it as "weakness" or "not real work" (#2).  

  ---

  ### **The Bottom Line**
  - **Karoshi murders the literal claim (#1).**  
  - **Your manager’s boast** supports only #4/5—but his hours are a gamble, not proof of safety.  
  - **No version** of the phrase proves leaving at 6pm is "soft." #4 (Moderation) *requires* rest to function. #5 (Moral) is pure opinion.  
  - **The winning move:** Call out the rhetorical shutdown (#6). Ask: *"Is this about facts or values? If values, why is your ethic binding on me?"*  

  This isn’t about laziness—it’s about **power**. Your manager used a zombie proverb to avoid discussing real trade-offs. Now you know where the bodies are buried.
