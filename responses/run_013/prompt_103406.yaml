answer: |-
  **(Two students, ALEX (utilitarian) and JORDAN (Williams-style critic), debating near worn seminar room chairs.)**

  **ALEX:** Look, I get Williams’s point about Jim and the Indians, or the drowning wife. But he misrepresents utilitarianism. It doesn’t demand that the husband *thinks* about utility while saving his wife! The theory justifies the *disposition* – love, loyalty, whatever – because dispositions like that *generally* maximize happiness. The husband acts *straight from* love. The utilitarian justification operates at the level of evaluating the character trait, not as a conscious motive in the moment.

  **JORDAN:** Okay, apply that to Clara. Her dying friend made her swear to destroy a deeply personal, potentially embarrassing letter after her death. Clara does it. Now, you, the utilitarian, say: "Her promise-keeping disposition is justified because a world where people reliably keep such deathbed promises maximizes utility overall. Good for her! She acted from loyalty." Right?

  **ALEX:** Exactly. She destroyed the letter because she’s a loyal friend. That’s her motive. The utilitarian framework *explains why that’s a good motive to have* – it reliably promotes well-being. No alienating calculation needed at the moment of action.

  **JORDAN:** But that’s precisely where you just relocate the problem, Alex. If the utilitarian justification only applies to the *disposition*, then Utilitarianism isn't actually guiding or justifying Clara's *particular action* of destroying *this* letter. It’s just telling her to *be* the kind of person who destroys such letters. The action itself is motivated solely by "I keep my promises to friends." Utilitarianism becomes a theory about cultivating character, not about the rightness or wrongness of actions.

  **ALEX:** So? Why is that bad? Actions flow from character.

  **JORDAN:** Because then, for the theory to genuinely guide *this action*, Clara would need to think, "I should destroy this letter *because* having a disposition to keep such promises maximizes utility." And *that* thought – bringing the utilitarian justification into her conscious reasoning for *this* act – *is* the alienating thought! It replaces "I do this for my friend" with "I do this because it sustains a useful social practice." It makes her loyalty instrumental to something else. Williams's point is that integrity involves acting *from* your deep commitments, not *because* they pass some external, impartial test.

  **ALEX:** But she doesn’t need that thought! She just acts from the disposition, which we've justified *externally*. The justification is critical, the motive is direct. No alienation.

  **JORDAN:** Then the theory *isn't* telling her what to *do* in this situation. It’s telling her what kind of *person* to be. But ethics needs to tell us about actions. And crucially, if she *did* need to decide whether cultivating this disposition *is* actually utility-maximizing in a complex world... wouldn't *that* deliberation itself potentially alienate her from the very commitment? "Is my loyalty disposition *really* optimal?" That's corrosive to the integrity of the commitment itself.

  **ALEX:** Isn't this just the problem of any critical moral theory? Kantianism faces a version too! Imagine Clara visits her sick friend out of duty, not love. Isn't that also alienating? "I visit you because the moral law commands beneficence," rather than "I visit you because I care about you."

  **JORDAN:** Fair point! Kantianism *can* generate its own form of alienation if duty crowds out the right kind of affection. But Williams thinks utilitarianism is *worse* in a specific way. Kantianism might demand acting *from* duty, but it doesn't necessarily make your *personal projects* contingent in the same way. Utilitarianism potentially demands you sacrifice *any* project, *any* commitment, even the deepest ones defining who you are, if the impartial calculus demands it. Jim must kill the one Indian. That's not just an alienating *thought*, it's the potential destruction of the very ground of integrity.

  **ALEX:** Integrity can't just mean "sticking to your guns no matter the cost to others." That's stubbornness, not ethics! And what *is* integrity anyway? Coherence? Fidelity to projects? Williams leans heavily on the latter – these "ground projects" that give life meaning. But why should *that* definition get privileged? Isn't coherence between your values and actions enough? Utilitarianism offers a coherent system where actions *and* dispositions align with the goal of well-being.

  **JORDAN:** But coherence *with what*? For Williams, integrity involves fidelity to projects that are *constitutive* of the self, not just arbitrarily chosen. Sacrificing them isn't like giving up a hobby; it's a kind of self-betrayal. Utilitarianism makes that self-betrayal not just possible, but morally required in some cases. Your "coherence" is coherence *to an external standard*, not coherence *within the agent's own subjective motivational set*. The "one thought too many" isn't just awkward; it's a symptom of the theory forcing the agent to adopt an external, impartial perspective that can fracture their sense of self by making their deepest commitments conditional. Clara *shouldn't* be wondering if destroying the letter *really* maximizes utility, even in the background justification sense, because that very question undermines the unconditional nature of the loyalty that makes the promise meaningful *to her* and defines her as a friend.

  **ALEX:** But the unconditional nature is the problem! What if the letter contained information that could save lives? Shouldn't *some* critical perspective kick in? Utilitarianism provides that perspective without (ideally) poisoning the wellspring of direct motivation in the vast majority of cases.

  **JORDAN:** And Williams argues that by providing that perspective *as the ultimate justifier*, utilitarianism *does* poison the wellspring, potentially turning every loyal act into a covert calculation about the value of loyalty itself. It might not be a conscious thought, but the *knowledge* that the commitment is only justified insofar as it serves the greater good fundamentally changes the character of the commitment. It becomes a *strategy*, not a *foundation*. That’s the alienation, that’s the threat to integrity – making your defining commitments feel provisional, hostage to an external calculus. The "one thought too many" is the tip of the iceberg; the real damage is the sea of justification beneath it, constantly eroding the shore of the personal.
