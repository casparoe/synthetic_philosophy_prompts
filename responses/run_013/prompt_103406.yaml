prompt: |-
  Hey, I'm in this ethics seminar and we've been stuck on Williams's integrity objection for like two weeks. I definately need a dialogue between two people who disagree about whether the objection actually works. One is a utilitarian who thinks the theory can be saved by seperating the thoughts that justify an action from the thoughts that motivate it—the husband can act straight from love, and the utilitarian justification is a background fact about the disposition, not an extra step in his head. The other is a Williams-style critic who thinks that move just relocates the problem: if the theory only tells you to have the disposition, then it's not guiding the action, and if it does guide the action, the extra thought comes back. Make them both smart and make them actually respond to each other. Don't just do the standard drowning wife example. Maybe use a new case: someone who keeps a promise to a dying friend to destroy a letter, and the utilitarian says the promise-keeping disposition is justified by utility, while the critic says the person who destroys the letter because it's what a loyal friend does is not thereby acting on utilitarian reasons, and if she adds and this maximizes utility she's alienated. Let them argue about whether that's a real problem or just a fact about any theory that has a critical level. Also maybe one of them brings up whether the same objection hits Kantianism—the person who visits a friend from duty rather than love. Is integrity a special problem for utilitarianism or for all impartialist theories? And what exactly is integrity supposed to be—coherence, fidelity to one's projects, or something else? And tie it back to the whole one-thought-too-many complaint. Don't let them talk past each other. Just start with the dialogue, no preamble or 'here is a dialogue'. No citations or reading lists needed.
