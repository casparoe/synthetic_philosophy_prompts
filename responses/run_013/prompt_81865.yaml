answer: |-
  Here’s a structured agenda prioritizing upstream, tractable, and neglected philosophical questions in computational complexity, tailored for philosopher-theorist collaboration. I’ll address your "description-opaque hardness" distinction upfront, then rank themes by impact, and explicitly deprioritize certain areas.

  ---

  ### **Part 1: Addressing "Description-Opaque Hardness"**
  Your intuition taps into a **real but underexplored divide** between:
  - **Solvability Hardness**: "Finding a solution is hard" (e.g., factoring integers).  
  - **Definability Hardness**: "Stating the problem without presupposing a solution is hard" (e.g., defining "interesting mathematical structures" for isomorphism testing).  

  **Why it matters & connections**:  
  - **Upstream**: This distinction questions **what counts as a valid problem specification** in complexity theory. It intersects with:  
    - *Descriptive Complexity*: How logic formalisms (e.g., Fagin’s Theorem) capture complexity classes.  
    - *Kolmogorov Complexity (KC)*: KC measures the cost of *describing* a solution, not finding it. Your idea extends this to problem *specifications*.  
  - **Downstream Impact**: Clarifying this could refine **reductions between problems**, reveal hidden assumptions in **average-case complexity** (what makes an instance "typical"?), and inform **AI interpretability** (when is a concept hard to define *before* solving?).  
  - **Tractability**: Philosophers can analyze case studies (e.g., graph isomorphism vs. SAT) using existing tools. No new lower bounds needed.  
  - **Neglected**: Rarely explicit in technical work, though hinted at in debates on "natural" problems.  

  **Rank**: **High** (Theme 2 below). Reframe it as **"Complexity of Representation"** to align with existing frameworks.

  ---

  ### **Part 2: Prioritized Research Agenda**
  *(Ranked by upstream impact, tractability, and neglect)*  

  #### **Theme 1: Foundations of "Efficient Computation"**  
  **Core Question**: What does "efficiency" (P, BPP, etc.) *mean* epistemically/metaphysically?  
  - **Why Upstream**:  
    - P vs. NP isn’t just technical; it’s a **lens on feasible knowledge**. Resolving it could reshape mathematics (e.g., automated proof verification).  
    - Impacts **cryptography** (what is "hard" for adversaries?), **physics** (is the universe polynomial-time?), and **algorithmic fairness** (when is efficiency ethically constrained?).  
  - **Tractable Angles**:  
    - Analyze implicit assumptions in "efficient" (e.g., why polynomial time? Is BPP=P a physical or mathematical question?).  
    - Case studies: Interactive proofs (IP=PSPACE) as a model of verification vs. discovery.  
  - **Neglected**: Philosophers rarely engage beyond superficial P vs. NP discussions.  
  - **Move Up/Down**: Up if P≠NP proof emerges; down if stagnation persists.  

  #### **Theme 2: Complexity of Representation (Your "Description-Opaque" Idea)**  
  **Core Question**: When is problem *specification* itself a source of hardness?  
  - **Why Upstream**:  
    - Challenges **reductionism** (can all problems be cleanly mapped to SAT?).  
    - Downstream to **ML/AGI** (e.g., defining "fairness" without solving the optimization) and **metamathematics** (hardness of defining "natural" properties).  
  - **Tractable Angles**:  
    - Compare descriptive complexity (logic-based specs) vs. KC (compression-based).  
    - Investigate "instance spaces" in average-case complexity: When is specifying a "typical" input as hard as solving the problem?  
  - **Neglected**: Technical work focuses on solving problems, not specifying them.  
  - **Move Up/Down**: Up if ties to ML ethics gain traction; down if deemed too vague.  

  #### **Theme 3: Epistemology of Proofs and Knowledge**  
  **Core Question**: What do interactive/zero-knowledge proofs reveal about *verification* vs. *discovery*?  
  - **Why Upstream**:  
    - IP=PSPACE and MIP=NEXP show **verification can be exponentially easier than solving**.  
    - Impacts **mathematical practice** (e.g., computer-assisted proofs), **crypto** (zero-knowledge for privacy), and **AI safety** (proofs of learned behavior).  
  - **Tractable Angles**:  
    - Philosophical analysis of "knowledge" in IP: Is verifying a proof with probability 1-2^−100 *certainty*?  
    - Compare with classical epistemology (e.g., JTB accounts).  
  - **Neglected**: Rich technical literature, but philosophical implications are unexplored.  
  - **Move Up/Down**: Stable; ties to AI safety could elevate it.  

  #### **Theme 4: Metaphysics of Complexity Classes**  
  **Core Question**: Are complexity classes "real" (e.g., natural kinds) or pragmatic constructs?  
  - **Why Upstream**:  
    - Affects **reduction validity** (e.g., are NP-complete problems equivalent *in essence* or just by mapping?).  
    - Downstream to **physics** (does BQP capture quantum reality?) and **ontology** (is "hardness" a property of problems or instances?).  
  - **Tractable Angles**:  
    - Analyze class separations (e.g., P vs. BPP) through scientific realism debates.  
    - Investigate fine-grained reductions: Do they reveal "closeness" of problems?  
  - **Neglected**: Mostly discussed in niche philosophy of math circles.  

  ---

  ### **Part 3: Deprioritized Areas (Despite Importance)**  
  1. **New Lower Bounds**:  
     - *Why*: Requires deep technical work; less philosophical leverage.  
     - *Exception*: Philosophical analysis *of* barrier results (e.g., relativization).  
  2. **Quantum Complexity**:  
     - *Why*: Over-discussed; often conflated with quantum foundations. Only include if tied to epistemology (e.g., QMA vs NP).  
  3. **Generic AI Safety**:  
     - *Why*: Too broad; focus only where complexity *specifically* applies (e.g., hardness of alignment specifications).  

  ---

  ### **Workshop Structure & Postdoc Focus**  
  - **Day 1**: Foundations (Theme 1) → Representation (Theme 2).  
  - **Day 2**: Knowledge (Theme 3) → Metaphysics (Theme 4).  
  - **Postdoc Year**:  
    1. Survey literature on Theme 2 (complexity of representation).  
    2. Collaborate with theorists on case studies (e.g., hardness of defining "community structure" in networks).  
    3. Produce a taxonomy of "hardness sources" (solvability vs. definability).  

  **Outputs**: White papers on neglected questions; an ontology of complexity concepts; accessible proofs-of-concept (e.g., "When is specifying a random SAT instance hard?").  

  This agenda targets conceptual foundations with high leverage for science/philosophy, avoids technical traps, and centers your insight about problem specification as a key frontier.
