prompt: |-
  I've ended up with a weird budget line at work: enough to fund a two-day workshop plus a half-time postdoc for a year, on the philosophy of computational complexity. Not complexity science in the Santa Fe sense, and not AI safety in general, but the conceptual fallout of P vs NP, fine-grained complexity, descriptive complexity, hardness of approximation, average-case complexity, interactive proofs, and the like. The problem is I have to write the call for proposals and I don't want it to just say anything rigorous. So help me set the agenda: which open questions or lines of work in this area matter most, and in what order, if the goal is to support stuff that's upstream of other work, tractable for philosophers who can collaborate with complexity theorists, and neglected relative to the technical literature? I care more about the reasoning than the list. For each item, tell me why it's upstream, what downstream questions depend on it, what would move it up or down over the next year or so, and what you'd deprioritize even though it sounds important.

  One thing I keep circling is a distinction I've only seen hinted at, maybe because I'm not looking in the right place. Some hard problems are hard because finding a solution is hard; others seem hard because even stating the problem in a way that doesn't presuppose the solution is hard. I've been calling this description-opaque hardness in my notes. Is that a real cut in the space, or is it just a fuzzy restatement of something in descriptive complexity or Kolmogorov complexity? If it's useful, where does it sit in the ranking, and if it's not, what's the nearest real distinction I should use instead? Also, I'm a philosphy by training, so if a line of work is only tractable by someone who can prove new lower bounds, say so and rank it lower.
