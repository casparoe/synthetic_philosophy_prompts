prompt: |-
  I sit on the investment committee of a midsize regional foundation -- we fund things in tranches, and every quarter we have to decide wether to release the next tranche, extend, or kill a grant. It's about six decisions a year, six figures each, and the meeting is 90 minutes. Nobody on the committee is an economist, and the program officer who proposed the original grant is always in the room, which I'm starting to think is part of the problem.

  We keep doing the thing where we've put in $400k and the next tranche is $150k and someone says "we can't walk away now, we'd lose everything we've put in." I want a procedure we can actually run in the meeting, not a lecture. It should be grounded in the dollar auction and the escalation-of-commitment literature but usable by people who've never heard of either.

  Give me: the questions to ask in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it has to hand the decision to the committee because it's a values question and not a fact question.

  I want it to survive the stuff that makes these decisions hard, not paper over them:
  - the difference between "we've already spent it" (irrelevant) and what the past spending has told us (not irrelevant) -- don't let the procedure confuse the two
  - the case where the next increment is genuinely cheap relative to what finishing buys us (the half-built bridge, the asset that's worth nothing unless it's completed)
  - the dollar-auction bit specifically: in that game the person who's trapped isn't the leader, it's the second-highest bidder, the one who has to pay and gets nothing. So the procedure should make us ask who in our situation is the second-highest bidder, and who's the auctioneer -- who actually benefits from us staying in.
  - and the ugly one: sometimes continuing really is correct, and the procedure should be able to say so, otherwise people will just ignore it.

  Run it on two real-ish cases: a digital records project that's 70% done and whose vendor has walked, and a cohort-based fellowship where the first two cohorts underperformed but the third looks different. And tell me where the procedure will misfire and what it can't decide. One of the two should come out in a way the committee won't like -- don't sand off the edges.
reasoning: |-
  We are designing a decision procedure for grant continuation that addresses escalation of commitment and the sunk cost fallacy, while being practical for a 90-minute meeting with non-economists.

  The key principles:
  1. Past spending (sunk costs) are irrelevant to the decision about future spending. What matters is the expected future return on the next tranche.
  2. We must distinguish between:
     - The irrelevance of sunk costs (the $400k already spent)
     - The relevance of what we've learned from past spending (e.g., the project is harder than expected, the vendor left, the first two cohorts underperformed)
  3. The dollar auction analogy: We must avoid being the "second-highest bidder" who ends up paying but getting nothing. We should consider who benefits from our continued funding (the auctioneer?) and whether there are other bidders (other funders) who might step in.
  4. The procedure must allow for cases where continuing is the right decision (e.g., the half-built bridge).

  We propose a step-by-step procedure with specific questions. The goal is to either:
     - Stop early with a "no" if the project fails a critical test.
     - Stop early with a "yes" if the project clearly passes (but be cautious because we want to avoid escalation).
     - Otherwise, proceed to a committee decision based on values and strategy.

  The Procedure:

  Step 1: State the facts about the past spending and what we've learned.
     Question: "What have we learned from the spending so far that is relevant to the future success of the project? Specifically, what has changed about the project's costs, benefits, risks, or feasibility?"
     - Good answer: Concrete lessons that update our expectations (e.g., "We learned that the original vendor was critical and now we have to find a new one, which increases risk and cost", or "The first two cohorts underperformed because of X, but we fixed X for the third cohort and early signs are positive").
     - Bad answer: "We've already spent $400k" (irrelevant) or vague optimism without evidence.
     - If the answer is only about sunk costs and no new information, stop and kill the grant (because there's no new information to justify continuing).

  Step 2: Assess the current state without the next tranche.
     Question: "If we do not release the next tranche, what happens to the project? What assets (tangible or intangible) will we have, and what will they be worth to our mission?"
     - Good answer: A clear picture of the salvage value (if any) and the consequences of stopping. For example, "Without the next tranche, the digital records project will remain 70% complete and unusable, and we lose the $400k with no benefit" or "The fellowship program will end after two cohorts, and we have learned some lessons but no lasting impact."
     - This step makes the sunk cost explicit and forces the committee to face the reality of walking away.

  Step 3: Evaluate the next tranche as a new investment.
     Question: "If we release the next tranche, what exactly will it buy? What is the expected outcome (probability and magnitude) of that spending, and how does that compare to the cost? Be specific about the costs and benefits, including non-monetary mission impact."
     - Good answer: A clear, evidence-based projection of the incremental impact of the next tranche. For example, "The $150k will complete the digital records project with a 60% chance of success, and if successful, it will save our grantee $200k/year in operational costs and improve services to 10,000 people." Or, "The next tranche for the fellowship will fund a third cohort, which we expect to perform better because of changes A, B, and C, and if successful, it will produce 20 leaders who will impact X, Y, Z."
     - Bad answer: "We have to do it because otherwise we lose the past investment." (That's the sunk cost fallacy.)
     - If the expected value (probability times benefit) is clearly less than the cost of the next tranche, stop and kill the grant.

  Step 4: Consider alternatives and other funders (the dollar auction insight).
     Question: "Are there other funders who could step in to fund the next tranche? If we step aside, would someone else fund it? And are there alternative uses for our next tranche that might yield a higher return for our mission?"
     - Good answer: Evidence about other potential funders (e.g., "We've approached the Smith Foundation and they are considering it") or a compelling case that no one else would fund it and the project is critical. Also, a comparison to alternative opportunities (e.g., "We have another grant proposal that would use the $150k to achieve similar impact with less risk").
     - This step addresses the dollar auction: if we are the only bidder (funder) and the project is worth completing, then we might be the necessary funder. But if others might step in, we should let them (and avoid being the second-highest bidder).
     - If there are clearly better alternatives, stop and kill the grant.

  Step 5: Assess the risk of further escalation.
     Question: "If we release this tranche, what is the risk that we will be back in the same position next quarter? What are the remaining steps to completion, and what are the risks and costs of those steps?"
     - Good answer: A clear plan for the remaining work, with milestones and costs, and an assessment of the risks (including the risk of needing even more money). For example, "After this tranche, the project will be 100% complete and no further funding is needed" vs. "This tranche only gets us to 85%, and then we need another $200k to finish."
     - If the project is likely to require more tranches beyond this one and the total expected cost now exceeds the expected benefit, stop and kill the grant.

  Step 6: Make a recommendation.
     - If the project passed Steps 1-5 without being killed, then the procedure does not make an automatic decision. Instead, it hands off to the committee for a values-based decision. The committee must weigh the strategic importance, mission alignment, and any other factors that are not purely financial.

  Now, let's run two cases:

  Case 1: Digital records project that's 70% done and whose vendor has walked.
     - Step 1: What have we learned? 
          We learned that the vendor was critical and that there are technical challenges that caused the vendor to leave. We also learned that the remaining 30% is more complex than expected. This increases the risk and cost of completion.
     - Step 2: Without the next tranche? 
          The project is incomplete and unusable. The $400k spent is wasted, and there is no salvage value because the system is proprietary and incomplete.
     - Step 3: What does the next tranche buy? 
          The grantee has found a new vendor who estimates $150k to complete the project, but they also note a 50% chance of additional costs (so expected cost might be higher). If completed, the system will save $200k/year and improve services. The expected benefit (over 5 years, discounted) is $750k. The expected value is 50% * $750k = $375k, which is greater than $150k. So on a pure expected value basis, it's positive.
     - Step 4: Other funders? 
          The grantee has approached other funders without success. The foundation is the only one willing to fund this. There are alternative projects, but this one is core to the grantee's operations.
     - Step 5: Risk of further escalation? 
          The new vendor's contract is fixed-price for the $150k, so in theory no more money. But there's a 50% chance of overruns, which might require more funding. The grantee may come back for more.
     - Step 6: Committee decision. 
          The expected value is positive and there are no other funders, but the risk of further cost overruns is high. The committee must decide if the risk is acceptable and if the mission impact justifies it.

     Outcome: The procedure does not kill it at Step 3 because the expected value is positive, but it flags the risk in Step 5. The committee might be tempted to kill it because of the sunk cost and the vendor issue, but the procedure shows that the next tranche might be worth it. However, the committee might also be wary of the overrun risk. This is a close call and the committee must decide.

  Case 2: Cohort-based fellowship where the first two cohorts underperformed but the third looks different.
     - Step 1: What have we learned?
          The first two cohorts underperformed because of poor selection criteria and insufficient support. The program has been redesigned for the third cohort: selection is more rigorous, and mentorship is enhanced. Early indicators (applicant quality, partner engagement) are positive.
     - Step 2: Without the next tranche?
          The fellowship ends after two cohorts. We have learned lessons and built some network, but no further impact. The past spending is sunk.
     - Step 3: What does the next tranche buy?
          The next tranche ($150k) will fund the third cohort. The program team expects a 70% success rate (compared to 40% in the first two) for this cohort. If successful, it will produce 20 leaders who will create change in their communities. The expected impact is valued at $500k (based on our metrics). The expected value is 70% * $500k = $350k, which is greater than $150k.
     - Step 4: Other funders?
          The program is not widely known, and other funders are not lined up. We are the primary funder. There might be other fellowship programs we could fund that have a proven track record, but this one is tailored to our region.
     - Step 5: Risk of further escalation?
          This is the last planned cohort. No further funding is expected. However, if the third cohort also underperforms, we may have wasted $150k and the past investment. But the program team is confident because of the changes.
     - Step 6: Committee decision.

     Outcome: The procedure does not kill it. The committee must decide if they believe the changes will lead to improved outcomes and if the mission alignment is strong.

  But note: the committee might not like the first case because of the high risk and the fact that the vendor left. The procedure does not automatically kill it because the numbers are positive. However, the committee might be concerned about the overrun risk and the possibility of being back in the same situation. This is where the procedure might misfire: it relies on the estimates provided (which might be optimistic). Also, the program officer might present overly positive projections.

  Where the procedure might misfire:
     - It relies on honest and accurate assessments at each step, especially in Step 3 (expected outcomes) and Step 5 (future risks). If the program officer or committee is biased, they might downplay risks.
     - It may not fully capture the opportunity cost of the next tranche if alternative opportunities are not well developed (Step 4).
     - In the dollar auction, it might be hard to know if other funders are truly available (Step 4).

  What the procedure can't decide:
     - Strategic alignment: Even if the numbers look good, the project might not fit the foundation's current priorities.
     - Reputational risk: Continuing a project that has had problems might damage the foundation's reputation if it fails again.
     - The committee's risk tolerance.

  Therefore, the procedure is designed to filter out the sunk cost fallacy and force a focus on future costs and benefits, but it leaves the final call to the committee when the project passes the initial tests but still has risks or strategic questions.

  In both cases, the procedure does not automatically say "no" because the future benefits (as presented) outweigh the next tranche cost. But the committee might kill the digital records project because of the high risk and the vendor issue (they don't trust the new vendor's fixed-price contract) or because they don't want to set a precedent of bailing out failing projects. That's a values and strategy call.

  For the fellowship, the committee might be more optimistic because of the redesign and the fact that it's the last cohort. So they might continue.

  The procedure forces the committee to confront the issues explicitly and avoid the sunk cost trap. It also allows for continuation when it makes sense.
answer: |-
  ### Decision Procedure for Grant Continuance: "The Bridge Test"  
  This 5-step procedure combats escalation traps by forcing explicit separation of sunk costs from future value, identifying hidden beneficiaries (the dollar auction's "auctioneer"), and distinguishing between factual analysis and values judgments. Designed for 90-minute meetings with non-economists. **Timebox each step to 15 minutes max.**

  ---

  #### **Step 1: The Salvage Report**  
  **Question:**  
  *"If we stop funding today, what tangible assets or knowledge do we retain that advances our mission? What’s their *independent* value?"*  
  **Purpose:** Isolates sunk costs from salvageable value. Forces acknowledgment of irrecoverable losses.  
  **Good Answer:**  
  - Concrete, mission-aligned assets (e.g., "We own the code repository," "We trained 30 local facilitators").  
  - Quantified value (e.g., "The research data can be reused by partners, worth ~$50k in avoided costs").  
  **Bad Answer:**  
  - "We lose $400k" (focuses on sunk costs).  
  - Vague claims ("reputation damage," "wasted effort").  
  **Stop & Kill if:**  
  - **No independent salvage value exists** (e.g., half-built software can’t be used or sold).  
  - **Salvage value is <10% of total spend** (indicates high irrecoverability).  
  *Proceeds to Step 2 only if salvage value is material OR the grantee proposes a credible pivot.*

  ---

  #### **Step 2: The Incremental Bet**  
  **Question:**  
  *"Treating the next tranche as a *new* investment: What exactly does $150k buy? What’s the *minimum* credible outcome, and what’s the likelihood of achieving it?"*  
  **Purpose:** Evaluates the next tranche on standalone merits. Exposes "half-built bridge" edge cases.  
  **Good Answer:**  
  - Specific deliverables (e.g., "Completes the software module," "Funds Cohort 3 with improved curriculum").  
  - Conservative probability assessment (e.g., "60% chance of deployment-ready software based on new vendor’s track record").  
  - Mission impact metrics (e.g., "Will serve 5K users if completed").  
  **Bad Answer:**  
  - "We’ll lose prior investment" (sunk cost fallacy).  
  - Overly optimistic projections without evidence.  
  **Stop & Kill if:**  
  - **Cost > Expected value** (e.g., $150k tranche for a $100k benefit).  
  - **Probability of success <40%** (calibrated to foundation risk tolerance).  
  *Proceeds to Step 3 only if the bet has positive expected value.*

  ---

  #### **Step 3: The Auctioneer Check**  
  **Question:**  
  *"Who benefits most if we fund this tranche? Who else could fund it but hasn’t? Why?"*  
  **Purpose:** Identifies dollar auction dynamics. Reveals if the foundation is the "trapped bidder."  
  **Good Answer:**  
  - Names specific beneficiaries (e.g., "The vendor gets paid," "The grantee avoids layoffs").  
  - Evidence of soliciting other funders (e.g., "We approached 3 peers; all declined due to X").  
  **Bad Answer:**  
  - "Only we can fund this" (without proof of outreach).  
  - "Everyone benefits" (vague, avoids accountability).  
  **Stop & Kill if:**  
  - **Another funder is better positioned** (e.g., government agency already supports similar work).  
  - **Grantees/vendors are the primary beneficiaries** (indicates moral hazard).  
  *Proceeds to Step 4 if the foundation is the logical funder AND no predatory dynamics exist.*

  ---

  #### **Step 4: The Trap Scanner**  
  **Question:**  
  *"What new risks or commitments does this tranche create? Could we be back here in 6 months facing the same choice?"*  
  **Purpose:** Prevents recursive escalation. Tests for hidden tail costs.  
  **Good Answer:**  
  - Acknowledges tail risks (e.g., "New vendor requires $50k extra for maintenance").  
  - Clear off-ramps (e.g., "This is the final tranche; no future funding needed").  
  **Bad Answer:**  
  - "No further costs" (for complex projects).  
  - "We’ll cross that bridge later."  
  **Stop & Kill if:**  
  - **Future costs exceed current tranche** (e.g., $150k now, but $300k needed later).  
  - **No milestones exist to force accountability** (e.g., vague "success metrics").  
  *Proceeds to Step 5 only if the tranche is truly finite.*

  ---

  #### **Step 5: The Values Vote**  
  **Question:**  
  *"Forgetting sunk costs: Does this align with our top 3 strategic priorities? Would we fund it today as a *new* grant?"*  
  **Purpose:** Forces values-based debate. Decouples legacy attachment from strategy.  
  **Good Answer:**  
  - References foundation strategy docs (e.g., "Yes, it advances Goal 2: Digital Access").  
  - Compares to current opportunities (e.g., "Better fit than X new proposal because Y").  
  **Bad Answer:**  
  - "We’ve come too far to quit" (escalation bias).  
  - "It’s easier than finding something new."  
  **Decision:**  
  - **Committee vote** (no vetoes). Requires majority to fund.  
  - **Tiebreaker:** Kill the grant.  

  ---

  ### Case Studies: Applying the Bridge Test  
  #### **Case 1: Digital Records Project ($400k spent, $150k requested)**  
  - **Vendor walked, 70% complete, unusable without final tranche.**  
  - **Step 1 (Salvage):** Code is proprietary; no salvage value. **→ STOP & KILL.**  
    *Why it works:* Forces acknowledgment that sunk costs are gone. No "half-built bridge" exception because asset has zero standalone value.  
  - **Committee’s likely reaction:** Angry. "We wasted $400k!" But procedure prevents throwing good money after bad.  

  #### **Case 2: Fellowship Program ($400k spent, $150k requested)**  
  - **Cohorts 1–2 underperformed; Cohort 3 redesigned with promising early metrics.**  
  - **Step 1 (Salvage):** Training materials and alumni network exist (value: ~$100k). **→ Proceed.**  
  - **Step 2 (Incremental Bet):** $150k funds Cohort 3. 65% chance of 80%+ success rate (per third-party evaluator). Impact: 30 leaders tackling regional issues. **→ Proceed.**  
  - **Step 3 (Auctioneer):** Local govt. benefits if leaders succeed but won’t fund. Grantee lacks endowment. **→ Proceed.**  
  - **Step 4 (Trap):** No future tranches needed. **→ Proceed.**  
  - **Step 5 (Values):** Aligns with foundation’s "leadership development" priority. **→ FUND.**  
  - **Committee’s likely reaction:** Relieved. Procedure validates continuation *without* referencing sunk costs.  

  ---

  ### Where the Procedure Misfires  
  1. **False Negatives:**  
     - Kills "half-built bridges" with *recoverable* value (e.g., Case 1 if code could be sold for $50k).  
     - Overly conservative probability thresholds may reject high-risk/high-reward bets aligned with values.  

  2. **False Positives:**  
     - Step 3 fails if grantees hide alternative funding options.  
     - Step 5 vulnerable to groupthink if committees won’t kill legacy projects.  

  3. **Can’t Decide:**  
     - **Strategic pivots** (e.g., "This fails Step 1, but grantee proposes a new use for salvage").  
     - **Political pressures** (e.g., board chair favors grantee). These require committee judgment outside the procedure.  

  **Defense Against Gaming:**  
  - Require independent evidence (e.g., third-party assessments) for Steps 2–3.  
  - Rotate program officers out of discussions if emotionally invested.  

  **Output:** Clear "KILL" or "FUND" recommendations for 80% of cases. The rest go to Step 5 for values-based voting, freeing the committee from sunk cost paralysis.
