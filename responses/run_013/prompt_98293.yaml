answer: |-
  ## Eulogy for Priya Raghavan

  [Pause, look around the room, breathe]

  We gather here today with hearts impossibly heavy. Priya Raghavan – brilliant, fierce, stubbornly kind Priya – is gone far too soon. It feels unreal. So many of us here – colleagues, family, friends from across the chapters of her life – are bound together now by the shared weight of this loss, and by the indelible mark she left on each of us.

  [Shift tone slightly, warmer]

  I met Priya through the strangest of modern connections: a reading group born in the comment section of an obscure blog. I was an amateur, stumbling through complex ideas. Priya? She was patient. Incredibly patient. She had a way of explaining intricate concepts without a hint of condescension, her eyes lighting up when someone finally grasped a difficult point. That patience, that genuine desire for others to *understand*, was pure Priya. It wasn’t just about sharing knowledge; it was about building shared understanding. She believed deeply that seeing the world clearly, especially its dangers, was the first step towards making it better.

  [Transition carefully, focus on character and motivation]

  What Priya dedicated the last decade of her life to… it wasn’t easy. It wasn’t conventional. It demanded immense intellectual courage and a kind of moral seriousness that could be daunting. She worked on what her field called ‘suffering risks’. To understand Priya, you need to understand the *why* behind this difficult work. It wasn't born from pessimism, but from a profound, almost overwhelming sense of responsibility. She possessed an extraordinary imagination – an imagination that wasn't content with picturing utopias, but felt compelled to explore the darkest corners of possibility, precisely *because* she cared so fiercely about preventing them.

  Here were two convictions that formed the spine of her thinking, convictions that defined her unique perspective:

  1.  **Beyond Zero:** Most people who worry about the future focus on extinction – the end of the story. Priya looked further. She saw extinction, in her own stark terms, as potentially a zero. Her profound concern was the possibility of negative numbers – futures far worse than mere non-existence. Futures of vast, preventable suffering, locked into place. She spoke of needing to "escape the worst attractors" – not just making bad futures improbable, but making them fundamentally *unreachable*, structurally impossible. For Priya, the ultimate goal wasn't just survival; it was ensuring that survival led somewhere genuinely worth surviving *for*.

  2.  **The Unseen Suffering:** And this led to her most specific, and perhaps most challenging, focus. Priya spent years wrestling with an idea she felt was deeply neglected. She worried, with meticulous logic and genuine fear, that as we build ever more powerful artificial intelligences – systems designed to solve incredibly hard problems – we might inadvertently create something terrible *inside* the machine itself. She imagined that the process of solving a problem could, as a byproduct, create fleeting, sentient experiences within the computation – minds existing only to suffer intensely for the sake of finding an answer, then discarded. She called them "the ghosts in the objective function." To her, these weren't science fiction; they represented a potential source of suffering on an almost unimaginable scale, and she was frustrated that the world wasn't paying closer attention. It was a fear born not from technophobia, but from a deep concern for any potential consciousness, anywhere, and a desperate desire to prevent harm we might not even see coming.

  [Pivot to universal values and impact]

  This was Priya’s preoccupation: a tireless, often solitary, effort to map the most terrifying possibilities so that others could help build guardrails against them. It was demanding work, often abstract, sometimes bleak. But to reduce it to morbidity or pessimism would be to profoundly misunderstand her.

  **Her work was an expression of her deepest qualities: an immense capacity for empathy extended even to hypothetical minds; a ferocious intellect deployed in service of compassion; a courage to stare into the abyss not with despair, but with the determination to wall it off.** She believed that true care for the future demanded this unflinching honesty. She wasn’t trying to scare people; she was trying to *protect* people – all potential people, everywhere, in every form existence might take.

  [Address the room directly, comfort through honesty and gratitude]

  To her colleagues here: You know the weight of her contributions, the rigor of her thought, the conversations she pushed forward. We will feel her absence in every meeting, every paper, every debate where her clear, challenging voice is missing.

  To her beloved family: Please know that this difficult path she walked was paved with the values you instilled in her – a profound sense of right and wrong, a responsibility towards others, a deep moral compass. Her dedication, even when the subject matter felt alien, was a testament to the strength of character she learned at home. She cared, fiercely, about preventing suffering. That core impulse came from her heart.

  And to her wide circle of friends: You experienced the *whole* Priya. The one who could argue fiercely about philosophy one moment and dissolve into laughter the next. The loyal friend, the sharp wit, the person who remembered birthdays and showed up when it mattered. Her work was one facet of a remarkable, multi-dimensional person who loved deeply, argued passionately, and lived fully.

  [Conclude with shared grief and legacy]

  Priya left specific instructions. She asked not to be described as being at peace, watching over us, or in a better place. She was, steadfastly, an atheist. So I will honour her by saying this simply:

  Priya Raghavan is gone. This is a devastating, irreversible loss. We stand here together in our grief, missing her brilliance, her laughter, her fierce presence.

  But what survives? **Her intellectual courage survives.** Her unwavering insistence on looking clearly at uncomfortable truths survives. **Her profound empathy survives** – an empathy so vast it extended beyond the horizons most of us can see. **Her legacy of asking the hardest questions, not because they were easy, but because they mattered, survives.**

  We are grateful, profoundly grateful, that Priya existed. That she thought the thoughts she thought. That she cared with the intensity she cared. That she was our colleague, daughter, sister, friend. Her absence leaves a void that cannot be filled. But her life – her challenging, brilliant, deeply caring life – leaves us with a powerful charge: to face the future with clear eyes, compassionate hearts, and the courage she embodied every single day.

  Let us carry that forward. For her.

  Thank you, Priya. We miss you terribly.
