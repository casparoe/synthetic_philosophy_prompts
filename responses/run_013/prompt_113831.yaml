  Okay, the user is on the board of a small neighborhood tool library facing a governance dilemma. They're stuck on whether to codify an unwritten late-return penalty into bylaws. The practice developed organically: late returners get bumped to the back of the queue. Some members see it as binding, while others—like the member who returned late after a year away—argue they never agreed to it. 

  The user's core questions are philosophical: What transforms a habit into a binding rule? Can unwritten practices carry legitimate authority? They want frameworks to separate coordination issues from fairness concerns. 

  Hmm... the volunteer coordinator's private notebook complicates things. Exceptions were granted disproportionately to friends, suggesting the practice might've been a patronage system rather than neutral rule. This raises questions about whether such a biased practice could ever be truly binding. 

  The user needs analytical tools, not just solutions. They're clearly intellectually engaged—notice how they frame this as a question about "what makes shared expectations binding." This isn't just about tools; it's about social ontology in microcosm. 

  Key angles to address:
  First, the nature of obligation in informal systems. When does "everyone does this" become "everyone should do this"? The member who was away highlights the opt-in problem. 

  Second, the corruption angle. The coordinator's notebook undermines claims of common knowledge. If exceptions were secret favors, could members really have uniform expectations? 

  Third, the stability-flexibility trade-off. Codifying might reduce favoritism but lose organic goodwill. The longtime member's worry about "changing the character" feels important—written rules shift compliance from social trust to formal obligation. 

  Need to distinguish: 
  - Coordination benefits (efficient queue management) 
  - Legitimacy (right to enforce) 
  - Fairness (biased exceptions) 

  The practice probably wasn't binding for the absent member—you can't be bound by norms you never encountered. But for regulars? Maybe, if expectations were truly shared. The notebook suggests they weren't. 

  Best path: Acknowledge the practice had legitimacy issues due to favoritism. Propose codifying a baseline rule with transparent exception criteria. This resets expectations fairly while preserving flexibility. The "accidental origin" is irrelevant; what matters is current function. 

  ...Though part of me wonders if they should scrap the penalty entirely. The rival library's different approach proves alternatives exist. But that might ignore the community's apparent preference for this system. 

  Final thought: However they decide, they must publicly reckon with the coordinator's favoritism. Transparency is key to rebuilding trust.
answer: |-
  This is a profound governance question that cuts to the heart of how communities create shared obligations. Let's break it down systematically, addressing your core philosophical questions before practical recommendations.

  ### Core Framework: What Makes a Practice Binding?
  1. **Coordination vs. Legitimacy**  
     - *Coordination*: A pattern becomes stable when it solves a recurring problem (e.g., managing scarce tools). Your practice coordinates behavior by creating predictable outcomes.  
     - *Legitimacy*: Binding force requires perceived *rightness* or *authority*. Key elements:  
       - **Mutual Expectations**: If most members expect others to follow the practice *and* believe others expect them to follow it, it gains normative weight.  
       - **Reasonableness**: Does it serve a fair purpose (e.g., punishing freeloading)?  
       - **Consent**: Tacit consent arises from continued participation *without objection* after becoming aware.  

  2. **The "Binding" Threshold**  
     A practice becomes binding when:  
     - It’s **common knowledge** (everyone knows it, knows others know it, etc.),  
     - It’s **relied upon** (people plan around it),  
     - Violations trigger **collective disapproval** (not just annoyance).  
     - *However*, legitimacy falters if:  
       - Alternatives exist (e.g., the rival library’s different system),  
       - Exceptions are arbitrary (as with the coordinator’s notebook),  
       - New members weren’t informed.  

  3. **History & Salience**  
     - The accidental origin is irrelevant if the practice evolved into a conscious solution.  
     - The rival library’s approach *does* matter: It shows your practice isn’t "necessary," weakening claims of inherent fairness. Alternatives prove it’s a *choice*, not natural law.  

  ### Your Specific Questions
  - **"If we surveyed expectations, would it settle if binding?"**  
    It would show if mutual expectations exist *now*, but not whether they’re *legitimate*. A majority expecting something doesn’t automatically obligate dissenters (like the absent member).  

  - **"If codified, are we creating a new rule or recording an old one?"**  
    Both. You’d be formalizing a pre-existing norm, but this changes its nature:  
    - **Before codification**: Obligation stems from community trust.  
    - **After codification**: Obligation stems from institutional authority.  
    Pre-existing members’ obligations shift only if they consent to the codification process.  

  - **"Is it fair to sanction the member who never agreed?"**  
    Only if:  
    (a) The practice was truly common knowledge when he joined,  
    (b) He benefited from it (e.g., received tools faster due to others’ penalties),  
    (c) His absence wasn’t so long that reorientation was needed.  
    *Given his 1-year absence, sanctioning him is likely unfair.*  

  - **"Does the coordinator’s notebook undermine bindingness?"**  
    **Yes, critically.** Secret, biased exceptions destroy:  
    - **Common knowledge**: Hidden favors mean members couldn’t know what others expected.  
    - **Fairness**: It became a patronage system, not a neutral rule.  
    - **Reliance**: Members couldn’t trust consistent application.  
    This doesn’t just make it unjust—it means the practice *lacked legitimacy* as a binding rule.  

  ### Decisive Reasons for Each Path
  | **Option** | **Decisive Reasons to Choose** | **Decisive Reasons to Reject** |
  |------------|--------------------------------|--------------------------------|
  | **Codify with Penalty Schedule** | • Ends favoritism via transparency<br>• Clarifies rules for new members<br>• Prevents "I didn’t know" disputes | • Sacrifices flexibility for emergencies<br>• Formalizes sanctions, risking community trust<br>• Legitimizes past unfairness if not reformed |
  | **Leave Informal** | • Preserves adaptive community ethics<br>• Avoids bureaucratic rigidity<br>• Honors organic cooperation | • Enables continued bias (if exceptions persist)<br>• Unfair to uninformed/new members<br>• Unenforceable against objections |
  | **Abolish the Practice** | • Resets after corrupted implementation<br>• Avoids legitimacy disputes<br>• Encourages new, consensual solutions | • Loses a functional coordination tool<br>• Ignores majority preference<br>• Wastes years of social learning |

  ### Recommended Path Forward
  1. **Acknowledge the practice’s corrupted history**. The coordinator’s notebook voids any claim that this was a legitimate binding norm. Reset the discussion honestly.  

  2. **Codify a baseline rule with transparent exception criteria**:  
     - **Core Rule**: Late returns forfeit next-turn priority.  
     - **Exceptions**: Defined upfront (e.g., medical emergencies, acts of God). Approved by 2 board members (not just the coordinator).  
     - **Grandfathering**: Existing members vote on the codified rule. New members agree upon joining.  

  3. **Why this balances legitimacy and fairness**:  
     - **Corrects past injustice**: Ends arbitrary favoritism.  
     - **Clarifies coordination**: Stable expectations remain.  
     - **Preserves flexibility**: Exceptions allowed but regulated.  
     - **Solves the "never agreed" problem**: Formal consent via vote/membership agreement.  

  **Final Insight**: Shared expectations become binding not through age or habit, but through *reciprocity*, *transparency*, and *inclusive benefit*. Your practice failed the legitimacy test when exceptions became private favors. Codification now isn’t enshrining tradition—it’s rebuilding trust on ethical foundations. The member who returned late after a year highlights a truth: Unwritten rules bind only those embedded in the living community. For everyone else, fairness demands clarity.
