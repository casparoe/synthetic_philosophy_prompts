answer: |-
  Here are eight sharp questions targeting the structural tensions in the proposal, designed to push the discussion beyond restatement. I’ve included the core weakness each question probes, the question itself, and a likely pivot/follow-up:

  ### Brainstormed Weak Points
  1.  **Oversampling Criteria:** Defining "affected interest" operationally is fraught. Who decides which administrative decisions qualify? How to avoid manipulation or arbitrary boundaries? Risk of privileging *recent, negative* experiences over systemic or diffuse harms.
  2.  **Epistemic Standing vs. Bias:** Oversampling the directly affected risks creating a chamber with strong, potentially self-interested stakes in specific policy areas, undermining claims to impartial deliberation or the common good.
  3.  **Term Limit Side Effects:** Eliminating re-election ambition may weaken accountability *to voters* and shift power/influence permanently to unelected actors (staff, bureaucrats, lobbyists) who *are* careerists.
  4.  **Chamber Incentive Misalignment:** The two chambers have radically different selection mechanisms, time horizons (one-term politicians vs. short-term citizens), and potentially divergent legitimacy claims. Deadlock might be the norm, not the exception.
  5.  **The "Convergence" Bottleneck:** The justification/response process could become procedural theater or pure delay, especially if chambers have fundamentally different views of the public interest. What forces genuine compromise?
  6.  **Upper Chamber Careerism:** While not seeking *re-election*, lottery-selected members with power (suspensive veto, participation in convergence) could develop new forms of influence-seeking or become targets for capture *during* their service.

  ### Interview Questions & Follow-Ups

  1.  **On Oversampling Stability & Definition:**  
      *Weakness: Defining "affected interest" operationally.*  
      **Q:** "The power of your upper chamber hinges on defining 'affected interest' for the oversampling. How do you guard against either bureaucratic arbitrariness *or* strategic actors gaming the system to flood the pool with claimants on specific issues, without falling back on technocratic gatekeeping that undermines the democratic intent?"  
      *Likely Pivot:* She emphasizes the epistemic value of lived experience.  
      **Follow-Up:** "Granted the epistemic value, doesn't prioritizing those *directly aggrieved* by a recent state action risk constructing a chamber with a strong *negative valence* toward state action in general? How does this inherent disposition square with the chamber's role in deliberating on the *common* good across diverse policy domains, not just redress?"

  2.  **On Epistemic Standing vs. Self-Interest:**  
      *Weakness: Bias vs. Epistemology.*  
      **Q:** "You argue affected individuals have unique standing *and* knowledge. But when that very group is empowered to veto legislation potentially impacting their specific grievance (or similar ones), how do you prevent the upper chamber from becoming, in practice, less a 'house of reason' drawing on experience and more a collection of potential veto players motivated by particular interests – essentially replicating a problem elections are accused of?"  
      *Likely Pivot:* She distinguishes raw interest from "processed" epistemic contribution through structured deliberation in the chamber.  
      **Follow-Up:** "If the chamber's deliberative process is meant to transform raw experience into public reason, doesn't that imply the *raw experience itself* isn't sufficient? Doesn't this reintroduce a competence filter at odds with the radical democratic impulse of sortition, and could this process reliably overcome strong self-interest?"

  3.  **On Term Limits & Displaced Careerism:**  
      *Weakness: Shifting power to unelected actors.*  
      **Q:** "With a strictly one-term lower chamber, the incentive for individual members to cultivate deep policy expertise or long-term relationships with constituents weakens. Doesn't this create a vacuum where unelected legislative staff, permanent bureaucrats, and highly organized lobbyists – all with long time horizons – become the *de facto* repositories of knowledge and continuity, potentially wielding more influence than the elected members themselves?"  
      *Likely Pivot:* She argues the term limit forces turnover and fresh perspectives, reducing capture.  
      **Follow-Up:** "If the counterweight to unelected influence is the sortition chamber, doesn't *its* inherently short-term, rotating membership face the same vulnerability to capture by precisely those entrenched actors (staff, lobbyists, bureaucrats) during its brief tenure? Could the upper chamber become the *new* primary target for careerists seeking influence?"

  4.  **On Upper Chamber Careerism:**  
      *Weakness: New forms of influence-seeking.*  
      **Q:** "Even without re-election, members of the sortition chamber wield significant power – a suspensive veto and a role in convergence. What prevents ambitious individuals within this chamber from leveraging their temporary position to build networks, extract concessions, or position themselves for post-service roles (e.g., lobbying, advocacy, media) that effectively create a *new* kind of political careerism centered on the lottery?"  

  5.  **On Deadlock & Convergence Effectiveness:**  
      *Weakness: Bottleneck & divergent preferences.*  
      **Q:** "The suspensive veto and convergence mechanism assume the two chambers can ultimately reason their way to agreement or compromise. But what if their legitimacy bases lead to systematically different conceptions of the public good? The lower chamber claims a mandate from voters, the upper chamber claims a mandate from lived experience and fairness. Isn't deadlock the likely equilibrium, turning convergence into a procedural hurdle rather than a genuine search for common ground?"  
      *Likely Pivot:* She argues the requirement for written justifications forces articulation of reasons the other chamber *must* engage with.  
      **Follow-Up:** "Couldn't this 'reason-giving' easily devolve into performative rhetoric aimed at their respective constituencies or future political arguments, rather than a sincere effort to persuade the *other* chamber? What specific mechanism *forces* a change in position if core principles or interests genuinely clash?"

  6.  **On Systematic Preference Divergence:**  
      *Weakness: Different populations, different priorities.*  
      **Q:** "By design, the sortition chamber, especially with oversampling, draws from a different 'population' than the electorate – not just demographically, but experientially (focused on recent administrative friction). Couldn't this lead to persistent, structural policy disagreements – say, a lower chamber prioritizing broad economic growth and a sortition chamber consistently vetoing for stronger individual protections or redress mechanisms – creating inherent governmental instability?"  

  7.  **On Legitimacy Tension:**  
      *Weakness: Competing claims.*  
      **Q:** "When the two chambers deadlock and a bill fails in convergence, who bears the democratic cost? The elected chamber can blame the 'unaccountable' lotteried chamber. The lotteried chamber can blame the 'out-of-touch' politicians. Doesn't this system risk eroding overall regime legitimacy by institutionalizing a source of conflict with no clear democratic resolution mechanism?"  

  8.  **On Falsifiability:**  
      *Weakness: Avoiding vagueness.*  
      **Q:** "This is a bold institutional redesign. Beyond simply 'not working,' what specific, observable outcome or pattern would lead you to conclude that *this particular model* of affected-interest sortition coupled with one-term elections is flawed in its core assumptions? For instance, would consistent policy gridlock on issues *not* directly related to administrative grievances, or evidence that the sortition chamber is *more* susceptible to lobbying than the elected one, constitute a failure?"  

  ### Why these work
  *   **Go for the Joints:** They target the *structural tensions* inherent in combining these mechanisms (elected+term-limited vs. affected-interest-sortition, veto+convergence).
  *   **Anticipate Pivots:** The follow-ups are designed to cut off easy theoretical escapes and push towards practical implications.
  *   **No Homework Required:** They stand alone using the concepts *she* employs (standing, epistemic value, deliberation, convergence, careerism, legitimacy).
  *   **Avoid Softballs:** They challenge core premises without being hostile.
  *   **Focused on Weaknesses:** Based on your friend's insight and standard critiques of sortition/term limits.
  *   **Forces Specificity:** Especially the final question on falsifiability.

  Use these as a framework. Listen closely to her answers and don't be afraid to improvise a *second* follow-up if her response opens up another clear line of inquiry you hadn't anticipated. Good luck with the interview!
