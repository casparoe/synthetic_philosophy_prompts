  For the second part, the narrative bias where the same event is framed as decline or transformation based on the narrator's stake. Terms like "teleological fallacy" or "presentism" touch on this but don't fully capture the moral charge. "Positional historiography" or "stake-relative framing" might be too academic. "Ancestral valence" could highlight the role of perceived lineage in shaping the narrative. Combining that with "narrative" or "framing" might work. "Valence-laden narrative" or "stake-contingent interpretation" could be options. "Tragedy-to-Comeuppance Gradient" is descriptive but a bit clunky. "Ancestral Valence Bias" seems precise, pointing to how the narrator's relationship to the past society influences the moral framing.

  I should also consider the user's deeper needs. They're likely an academic or a serious enthusiast in historiography or anthropology, frustrated with oversimplified collapse narratives. They want precise terminology to critique these accounts and highlight the subjectivity in historical interpretation. Their mention of moral charges suggests they're interested in the ethics of how history is presented, especially when modern societies identify with past civilizations. Providing clear, coined terms with definitions and boundary cases will give them tools for more nuanced analysis.

  For the first concept, "Infrastructural Collapse" versus "Diagnostic Disappearance" sets up the distinction well. Boundary cases: the fall of the Western Roman Empire is infrastructural, while the end of a pottery style is diagnostic. For the second concept, "Ancestral Valence Bias" effectively names the narrative influence. Boundary cases: Rapa Nui as comeuppance for modern eco-critics versus transformation for historians focusing on continuity. This addresses both parts of their query and offers new terminology to advance their critique of collapse narratives.
answer: |-
  Your observations cut to the core of historiographical and archaeological interpretation. You've identified two profound conceptual gaps: one ontological (what actually *ended*) and one epistemological (how we *narrate* it). Here are precise concepts and coinages to address each:

  ### 1. Distinguishing Real Loss from Lost Indicators
  *   **Established Concepts:** Terms like "system collapse" (Tainter), "resilience failure," or "complexity reduction" exist but don't capture the dependency vs. indicator distinction. "Civilizational markers" describes indicators but lacks the dependency aspect.
  *   **The Coinage:** **Infrastructural Collapse vs. Diagnostic Disappearance**
      *   **Infrastructural Collapse:** The failure or removal of a *load-bearing* socio-ecological, economic, or political structure essential for maintaining the society's *prevailing level of complexity, population density, or welfare*. Its loss triggers cascading failures (famine, depopulation, systemic violence, sharp welfare decline). *Example:* Loss of centralized grain storage/distribution in Bronze Age palace economies during drought/famine.
      *   **Diagnostic Disappearance:** The cessation of a specific *indicator* or *marker* used by modern analysts to *recognize* or *define* a particular societal phase or complexity. Its absence does not inherently signify a fundamental loss of welfare or resilience for the population; it may simply reflect adaptation, cultural shift, or decentralization. *Example:* The end of Maya Long Count monument erection or specific elite pottery styles.
  *   **Relative Position:**
      *   *Infrastructural Collapse* sits between "Systemic Collapse" (broader) and "Critical Node Failure" (more specific). It's a subset of societal collapse focused on *essential dependencies*.
      *   *Diagnostic Disappearance* is a form of "Epistemic Artefact" within archaeology/history. It relates to "Horizon" definitions in archaeology but highlights the *analyst's reliance* on the marker.
  *   **Boundary Cases:**
      *   **Infrastructural:** The collapse of the Roman *cursus publicus* (imperial postal/transport system) severely hampered administration, trade, and military response, contributing to infrastructural collapse in the West.
      *   **Diagnostic:** The end of Egyptian hieroglyphic writing. While culturally significant, its disappearance (replaced by Coptic script) didn't cause societal collapse; Egypt remained populous and agriculturally productive under Roman/Byzantine rule.
      *   **Ambiguous (Highlighting the Distinction):** The "collapse" of the Western Roman Imperial bureaucracy. *Infrastructural:* Loss of large-scale tax collection, legionary organization, and frontier defence *did* lead to fragmentation and localized hardship. *Diagnostic:* The disappearance of the specific *title* "Emperor in the West" or imperial coinage styles in Gaul mattered less to local farmers than whether local lords could maintain order (which often continued under new arrangements).

  ### 2. Narrating Decline vs. Transformation Based on Stake
  *   **Established Concepts:** "Presentism" (interpreting past through present lens), "Teleological Fallacy" (assuming inevitable decline/progress), "Whig History" (narrating history as progress). These touch on bias but don't capture the specific *moral charge based on perceived lineage/successorship*.
  *   **The Coinage:** **Ancestral Valence Bias**
      *   **Definition:** The tendency to interpret a past societal transformation (especially involving loss of complexity) as either a tragic **Decline Narrative** or a neutral/positive **Adaptation Narrative**, primarily determined by the narrator's perceived cultural, ideological, or biological connection (or lack thereof) to the society in question. The moral charge (hubris, comeuppance) is strongest when the narrator identifies their *own* society as the successor or descendant.
  *   **Relative Position:** This is a specific form of "Positional Historiography" (history written from a specific standpoint) and "Stake-Relative Interpretation." It directly shapes the application of "Collapse" vs. "Transition" or "Resilience."
  *   **Boundary Cases:**
      *   **Strong Decline Narrative (High Ancestral Valence):** A modern Western historian interpreting the fall of the Western Roman Empire primarily as a "Dark Age" catastrophe, emphasizing lost knowledge, ruined cities, and barbarism. The narrative often carries an implicit warning about the fragility of "our" civilization.
      *   **Strong Adaptation/Transformation Narrative (Low/No Ancestral Valence):** An archaeologist studying Post-Classic Maya societies emphasizing the continuity of population, adaptation of agricultural practices, flourishing of new centers (e.g., Mayapan), and evolution of political structures after the cessation of monument building in Classic cities. The term "collapse" is often questioned here.
      *   **Mixed/Contested (Highlighting the Bias):** Rapa Nui (Easter Island).
          *   *High Valence (Ecological Warning Narrative):* Framed as a clear-cut eco-collapse due to hubris (statue transport causing deforestation), serving as a moral parable for modern environmentalism ("Our fate if we don't change!").
          *   *Low Valence (Complex Adaptation Narrative):* Emphasizes evidence of continued Polynesian occupation, adaptation to deforestation (rock gardens, changed diet), cultural transformation (Birdman cult replacing Moai), and the devastating role of *external* factors (slave raiding, disease). "Collapse" is seen as misrepresenting a complex, primarily externally forced transformation. The moral charge shifts from "hubris" to "tragic victimhood."

  ### Why These Coinages Work
  1.  **Clarity & Precision:** "Infrastructural Collapse" explicitly names the loss of a *functionally essential* structure. "Diagnostic Disappearance" highlights the artifact of the *analyst's method*. "Ancestral Valence Bias" directly links the narrative framing to the *narrator's perceived relationship* to the past society.
  2.  **Diagnostic Power:** These terms allow you to dissect collapse literature: *What actually ended (Infrastructure or Diagnostic)?* and *Why is this narrator framing it as tragedy vs. adaptation (Ancestral Valence)?*
  3.  **Addressing the Moral Charge:** "Ancestral Valence Bias" specifically names the mechanism by which the moral charge (hubris/comeuppance) becomes attached – it's not inherent to the event, but projected based on the narrator's perceived stake.

  Using this framework, the "collapse" of a society becomes less a singular event and more a question: *Did essential infrastructure fail, causing widespread harm (Infrastructural Collapse)?* Or did the specific markers we use to define that society's "peak" simply cease, while life continued differently (Diagnostic Disappearance)?* And crucially, *is my interpretation of this as 'decline' or 'transformation' influenced by seeing myself as heir or outsider (Ancestral Valence Bias)?* This provides the conceptual rigor you seek to move beyond the monolithic, morally charged notion of "collapse."
