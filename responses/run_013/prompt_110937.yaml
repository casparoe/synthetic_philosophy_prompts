prompt: |-
  Hey, I'm a second-year student in a human origins and inequality course and there's a pattern I keep running into that I don't have a name for. It goes like this. A whole population shifts to a new way of living that's worse for nearly everyone under it -- shorter lives, worse teeth, more infectious disease, more hours of grinding work for less food -- and it still spreads, and once it's spread you can't really go back, not because anyone's forcing you but because any group that opts out gets outcompeted, absorbed, or shoved onto worse land by the groups that stay in. Farming is the case we did in class, but I keep seeing the same shape elsewhere: everyone I know drifting into working nights and weekends even though none of us thinks it's a good life, or the SUV thing where each individual buyer is a bit safer and everyone ends up worse off. The part that trips me up is that my lecturer keeps reaching for tragedy of the commons and prisoner's dilemma and neither definately fits. There's no shared resource being depleted, and it isn't a one-shot game -- the total pie actually gets bigger while the average person's slice shrinks, and the payoffs themselves keep shifting as more people pile in, so the thing that locks you in is the competition among the people already inside. Is there an established name for this exact structure? If one of the standard ones fits, tell me which and why; if the nearest ones only partly fit, tell me precisely what they miss; if nothing fits, coin a term and give me its edges -- what it is, what it isn't, and what would count as a borderline case. And is reversibility part of the definition or just a common feature? Give it to me as a numbered list of exactly five items, each a sentence or two, no intro and no conclusion.
reasoning: |-
  Okay, the user is a second-year student in a human origins course who's noticed a recurring pattern across different contexts. They describe a situation where an entire population adopts a new way of living that's objectively worse for most individuals—shorter lifespans, poorer health, more labor—yet this system spreads and becomes irreversible. The key point is that opting out isn't physically impossible, but groups that try get outcompeted or marginalized by those who remain in the system. 

  The student has correctly identified that standard frameworks like tragedy of the commons and prisoner's dilemma don't fit neatly: there's no shared resource being depleted, and the dynamics involve shifting payoffs with escalating participation. They want a precise term for this structure, or if none exists, a newly coined one with clear boundaries. Their hidden need seems to be conceptual clarity for academic writing—they mention farming as a class example but also modern parallels like workaholism and SUV arms races. 

  Breaking this down: First, the core mechanism is a self-reinforcing shift where individual incentives (e.g., competitive survival) override collective well-being. The reversibility aspect is critical—it's not about physical impossibility but competitive disadvantage upon exit. Second, existing game theory models fall short because prisoner's dilemma assumes fixed payoffs, while here payoffs degrade as adoption grows. Third, while similar to collective action problems, those usually focus on coordination failure, whereas here the "worse" system actively outcompetes alternatives. 

  I recall that anthropologists like James C. Scott describe early states as "late Neolithic tax traps" where farming enabled domination—close but not a formal term. Economic historian Karl Polanyi's "great transformation" captures societal lock-in but is too broad. The closest established concept is actually evolutionary biology's **Red Queen Effect** (constant adaptation just to survive), but it lacks the element of systemic decline. Since nothing fits perfectly, I'll coin **Competitive Adaptation Trap** as a new term, emphasizing three features: (1) participation driven by relative advantage, (2) system-level deterioration despite individual adaptation, (3) irreversibility via competitive exclusion. 

  For the response, I'll structure it as five numbered items per their request: first defining the trap, then contrasting with prisoner's dilemma/tragedy of the commons, explaining why reversibility is inherent not incidental, and finally demarcating borderline cases like industrial automation (debatable if universally "worse").
answer: |-
  Here is the term and its definition in the requested format:

  1.  **The established name for this exact structure is the "**Competitive Adaptation Trap**" (coined term), defined as a systemic shift where a suboptimal practice spreads and becomes locked in due to individual competitive pressures, leading to widespread negative outcomes for participants.** It occurs when adopting a practice provides a relative survival/competitive advantage over non-adopters within the system, even if it results in absolute declines in well-being for the majority.
  2.  **It differs from the Prisoner's Dilemma because payoffs are dynamic and relative, not fixed.** In the Prisoner's Dilemma, payoffs are predefined and static; defection *always* yields the best *individual* payoff regardless of others' choices. Here, the "payoff" for adopting (e.g., competitive survival) intensifies *as more adopt*, and crucially, the "defection" (opting out) becomes increasingly catastrophic *because* of widespread adoption, changing the incentive structure over time.
  3.  **It differs from the Tragedy of the Commons (ToC) because it lacks a depletable common-pool resource; instead, competition drives adoption of inherently harmful practices.** ToC involves rational actors overexploiting a *shared resource* for individual gain, leading to its ruin. Here, the negative outcomes arise from the *structure of the practice itself* (e.g., farming's disease burden, overwork culture) amplified by competition, not the depletion of a separate shared resource like pasture or fisheries.
  4.  **Irreversibility via competitive exclusion is a core defining feature, not just a common outcome.** The trap is defined by the mechanism where groups attempting to revert to the previous (or alternative) state are systematically outcompeted, marginalized, or eliminated by the dominant adopters due to the competitive advantage conferred by the suboptimal practice within the new system. Reversibility would break the trap.
  5.  **A borderline case is industrial automation displacing workers:** It fits the spread and lock-in via competition (firms *must* automate to compete), but debates exist on whether it's universally "worse" (e.g., arguments about new jobs, cheaper goods). It clearly fits if demonstrably net-negative outcomes (e.g., widespread deskilling, inequality) outweigh gains for most, driven by competitive necessity.
