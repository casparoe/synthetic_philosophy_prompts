reasoning: |-
  We are drafting a joint statement between two theorists of biological function: an etiological (selected-effects) theorist (SE) and a causal-role (systemic) theorist (CR). The case is a synthetic-biology scenario:

  - A laboratory lineage of bacteria has a newly introduced metabolic cycle.
  - Initially, the cycle is retained only because it buffers a toxic intermediate (it is not selected for any other reason, and without it the bacteria would die from the toxin).
  - After many generations of laboratory evolution, the cycle becomes required for cell division (so if the cycle is disrupted, the bacteria cannot divide). However, note that the cycle was never selected for in the wild and has no natural evolutionary history.

  We need:

  1. An agreed-claims section (numbered) covering:
     - Function versus mere effect
     - Malfunction
     - Novelty
     - Explanatory aims of function talk

  2. A disagreements table with each side's position in acceptable wording.

  3. Cruxes (key points of disagreement) including:
     - Whether function ascriptions attach to trait types or tokens
     - Whether a selection history is necessary for a function
     - Whether present causal contribution is sufficient

  For each crux, we must:
     - Identify a concrete case or argument both sides agree bears on it.
     - Record what each side predicts about that case.

  Also, if any part is merely verbal, we should say which part and why.

  Let's structure the joint statement accordingly.

  ---

  **Joint Statement: Adversarial Collaboration on Biological Function**

  **Introduction**

  We, an etiological (selected-effects) theorist (SE) and a causal-role (systemic) theorist (CR), have engaged in an adversarial collaboration to clarify our positions and disagreements regarding biological function, using a synthetic-biology case as a focal point. The case involves a laboratory-engineered metabolic cycle in bacteria that initially acts as a buffer against a toxic intermediate and later becomes required for cell division after laboratory evolution. This cycle has no evolutionary history in the wild.

  **Section 1: Agreed Claims**

  We agree on the following:

  1. **Function vs. Mere Effect**: Both agree that not every effect of a trait is a function. A function is a subset of effects that are privileged in some way. In the synthetic case, the initial buffering effect is not a mere side effect but plays a critical role in survival. However, we disagree on the criteria for privileging some effects as functions (see disagreements).

  2. **Malfunction**: Both agree that a trait can malfunction. That is, a trait can fail to perform an activity that it is supposed to perform. For example, if the metabolic cycle fails to buffer the toxin initially, or later fails to support cell division, that would be a malfunction. We also agree that malfunction is parasitic on function: one must first have a function to have a malfunction.

  3. **Novelty**: Both agree that novel traits (like the engineered metabolic cycle) can have functions. The fact that the trait is artificial and lacks a natural history does not preclude it from having a function. However, we disagree on what grounds the function (see below).

  4. **Explanatory Aims of Function Talk**: Both agree that function ascriptions in biology serve to explain why a trait is present and maintained in a system. They help in understanding the organization and persistence of biological systems. In the synthetic case, function talk helps explain why the metabolic cycle persists in the bacterial lineage (initially because it buffers toxin, later because it is required for division) and how it contributes to the system's viability.

  **Section 2: Disagreements Table**

  We present our core disagreements, with each side's position stated in a way that they would accept:

  | Issue | Etiological (SE) Position | Causal-Role (CR) Position |
  |-------|----------------------------|----------------------------|
  | **What grounds a function?** | A function is an effect for which the trait was selected by natural selection (or a similar process) in the evolutionary history of the organism. | A function is an effect that contributes to a goal state (e.g., survival, reproduction, or a system-level goal) of a containing system. |
  | **Is selection history necessary?** | Yes. Without a history of selection, a trait cannot have a function. In the synthetic case, the metabolic cycle only acquires a function when it is maintained by natural selection in the laboratory (e.g., when it becomes required for division and is thus selected). | No. A trait can have a function in virtue of its current causal role in a system, regardless of its history. In the synthetic case, the buffering effect is a function from the start because it is necessary for survival. |
  | **What about the initial stage?** | Initially, the metabolic cycle's buffering is a fortuitous effect that maintains the bacteria, but it is not a function because there was no prior selection for it. It is merely a beneficial effect that allows the trait to be present. | Initially, the buffering is a function because it is a causal contribution to the bacteria's survival (a goal of the system). |
  | **The later stage** | After laboratory evolution, when the cycle becomes required for division and is maintained by selection, it has the function of supporting cell division. | The function of the cycle in the later stage is still to support survival and reproduction, which it does by enabling cell division. The causal role has changed, but the grounding of function remains the same (causal contribution). |
  | **Malfunction in the initial stage?** | There is no function initially, so there can be no malfunction. If the cycle fails to buffer, it is merely harmful, but not a malfunction. | If the cycle fails to buffer, it is malfunctioning because it is not performing its survival-supporting function. |

  **Section 3: Cruxes**

  We identify the following cruxes (key points of disagreement) and use a concrete case to illustrate:

  **Crux 1: Whether function ascriptions attach to trait types or tokens?**

  - **SE**: Functions are primarily ascribed to trait types (e.g., hearts in mammals) because they are defined by the evolutionary history of the type. Token traits have functions derivatively, by being of a type that has a function.
  - **CR**: Functions can be ascribed directly to trait tokens within a system, because the function is determined by the token's current causal role in its particular system.

  *Concrete case both agree bears on this*: Consider a novel mutation in an individual organism (token) that provides antibiotic resistance. There has been no selection for this trait in the population.

  - **SE prediction**: The token trait has no function because it lacks a history of selection. It is merely a beneficial effect.
  - **CR prediction**: The token trait has the function of conferring antibiotic resistance because it currently contributes to the survival of the organism.

  **Crux 2: Whether a selection history is necessary for a function?**

  - **SE**: Yes, selection history is necessary. A trait cannot have a function without having been selected for that effect.
  - **CR**: No, selection history is not necessary. A trait can have a function solely based on its current causal contribution.

  *Concrete case*: The synthetic-biology case itself, focusing on the initial stage (before any laboratory evolution).

  - **SE prediction**: The metabolic cycle has no function initially. Its buffering effect is merely beneficial and maintains the trait, but it is not a function.
  - **CR prediction**: The metabolic cycle has the function of buffering the toxin from the moment it is introduced, because it is necessary for survival.

  **Crux 3: Whether present causal contribution is sufficient for a function?**

  - **SE**: No. Present causal contribution is not sufficient. A trait might contribute to survival, but without having been selected for that contribution, it is not a function (e.g., a fortuitous effect).
  - **CR**: Yes. Present causal contribution to a system's goal (e.g., survival, reproduction) is sufficient for a function.

  *Concrete case*: A neutral trait that, by chance, happens to have a beneficial effect (e.g., a pigmentation trait that, in a new environment, provides camouflage without having been selected for it).

  - **SE prediction**: The trait has no function of camouflage because it wasn't selected for that effect.
  - **CR prediction**: The trait has the function of camouflage because it currently contributes to survival by hiding the organism.

  **Section 4: Verbal Disagreements**

  We agree that part of our dispute is merely verbal. Specifically, the term "function" is used in different senses:

  - **SE** uses "function" to mean an effect that explains the presence of the trait via selection history.
  - **CR** uses "function" to mean an effect that explains the current contribution of the trait to system goals.

  Thus, when we say the metabolic cycle "has a function" in the initial stage, we are using the word differently. The disagreement about whether selection history is necessary is substantive, but the appearance of disagreement about the initial stage may be amplified by this verbal difference. However, we also note that the disagreement about what grounds function (history versus current role) is substantive and not merely verbal.

  **Conclusion**

  We continue to disagree on the necessary and sufficient conditions for biological function, but we have clarified our positions and identified concrete cases that test our views. We agree that the synthetic-biology case is a valuable test bed and that further discussion should focus on whether our differing predictions about such cases align with scientific practice and explanatory goals.

