answer: |-
  The mahogany table gleamed under the electric light. A single policy draft lay between Arthur Vance, grey temples sharp against the dark wood paneling, and Leo Finch, younger, restless fingers drumming the armrest. The air smelled of ink and unresolved tension.

  "Right then, Leo," Arthur began, his voice a low rumble. "This new polymer resin. Rotterdam to Singapore. No vessel has carried it before. No storm has tested its reaction. We have lab reports – promising – and the shipbuilder’s assurances. But no history. How do we price the risk of moisture degradation crippling the entire cargo?"

  Leo leaned forward. "We price it where we'd lay a bet. That's all insurance is, Arthur. A bet against loss. What odds would *you* offer someone betting the cargo arrives pristine?"

  Arthur steepled his fingers. "And if I told you I believe it’s *more likely* to arrive intact than, say, a shipment of volatile chemicals on that storm-prone Halifax run last year, but I cannot say *how much* more likely? That I can rank the probabilities without pinning a number to it? That the evidence, while pointing towards safety, is simply too scant to justify a precise figure?"

  Leo snorted softly. "Ranking without measuring? That’s whistling in the dark. Useful for ordering your bookshelf, not for risking capital. If you truly believe it’s more likely, Arthur, then name the odds you’d accept. If you can’t, it means you don’t know your own mind well enough to act. It’s indecision masquerading as profundity."

  "Not indecision, Leo. Recognition of the *kind* of uncertainty. Imagine two urns. One, you know holds 60 black marbles, 40 white. The other’s composition is utterly unknown – could be all black, all white, any mix. You must draw a black marble to win a fortune. Which urn?"

  "The known one, obviously. Sixty percent beats a mystery."

  "Prudence, yes? But is it incoherent? According to your view, Leo, probability is *only* the degree of belief you act upon. You chose the known urn, expressing a belief its probability is higher. But for the unknown urn – what *is* your degree of belief? Can you honestly assign a single number expressing your confidence in drawing black? Or do you acknowledge the uncertainty is of a different, deeper kind? You *can* rank the known urn above the unknown, precisely *because* your ignorance about the second is so profound it defies measurement. That’s my point about this resin cargo."

  Leo paused, conceding ground reluctantly. "Alright, Arthur. Point taken. Facing total ignorance feels different. But we aren’t ignorant here. We have lab tests, material specs, weather patterns for the route – just no *actual* loss history for this *exact* thing. It’s thin, yes, but not that black void. Your position, if I grasp it, is that even strong-looking evidence can be ‘thin’ if there’s simply not enough of it to establish a reliable pattern? That ‘thinness’ isn’t about the proposition being unlikely, but about our grounds for trusting any likelihood we assign?"

  "Precisely." Arthur tapped the lab report. "This suggests high resistance. Excellent. But it’s one test, one batch, one set of conditions. We haven’t seen how it degrades after weeks in the humid hold of a tramp steamer pitching in a monsoon. The *quality* of the evidence – its direct relevance to the real hazard – might be high. But the *quantity*, the repetition under varied stresses? Dangerously thin. It supports a belief in safety, perhaps strongly, but it doesn't support a *precise numerical measure* of risk yet. To pretend otherwise is folly."

  "So, what?" Leo pressed, leaning in. "We decline? Or do we quote a premium? You seem to suggest we can hold a belief strong enough to act, yet refuse to quantify it. How does the syndicate *act* on that? If you won't name a number, Arthur, how do we price the policy? Do we just say 'somewhere between half a percent and five percent'? What good is that? A man who tells me he’ll bet, but only at odds somewhere between evens and ten-to-one, hasn’t told me anything I can take to the bank. He’s hedging his own belief. If you carry a whole set of possible distributions in your head, what single figure guides your pen across that premium line?" He jabbed a finger at the draft.

  Arthur met his gaze. "The figure we write is a commitment, Leo. It must be defensible. Carrying the range isn't indecision; it’s honesty about the uncertainty. It *does* tell us something determinate: it tells us the risk is too poorly understood for a single, confident number. We can act on that knowledge. We can say: based on the *best evidence we have*, which points towards low likelihood but is insufficient, we will quote cautiously *within* a plausible range. Say… 0.5% to 1.5%. We choose a point within it – say 1% – acknowledging it's an estimate swimming in fog, not a calculation. And we set a limit: we decline participation if the client demands we match a competitor quoting below 0.5%, recognizing that figure ignores the profound uncertainty. We bet, yes, but we bet *knowing* the odds are murky, and we protect ourselves accordingly. That’s prudence born of recognizing thin evidence, not incoherence."

  Leo sat back, studying Arthur, then the policy draft. He drummed his fingers once more, slowly. The older man’s concession – that action *was* still possible, even necessary, within acknowledged uncertainty – had weight. And Leo’s own concession – that thinness wasn't just about low probability, but about the fragility of the estimate – stung. He saw the logic: refusing to pretend precision where none existed was its own form of strength.

  "So," Leo said finally, his voice less combative. "You’d quote one percent? Knowing it's a shot partly in the dark?"

  "Based on the evidence we *do* have pointing towards resilience," Arthur affirmed, "yes. But we minute that the rate reflects unprecedented risk and thin evidence. And we absolutely decline if pressured below point five. We quote one percent, not as a measured probability, but as a cautious commitment under acknowledged ignorance. We bet, but we know the track is muddy."

  Leo picked up his pen. He looked at the blank premium line, then at Arthur. A slow nod. "One percent. Minuted as unprecedented. And decline below point five." He began to write, the scratch of the nib loud in the quiet room. They had navigated the unknown, not with a false chart, but by admitting the fog.

  Crux: Whether probability requires measurable uncertainty to guide action, or if reasoned action is possible even when evidence is too thin for numerical confidence.
