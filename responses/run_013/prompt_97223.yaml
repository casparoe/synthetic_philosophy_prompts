answer: |-
  Based on Marion Ellery's five rulings, I'll first distil the candidate rules that fit all the cases, predict her verdict on the gemstone clue, discuss which rule I'd bet on and why, and suggest a further case to differentiate the leading rules if needed. Finally, I'll address any underdetermination and its implications.

  ### Candidate Rules from the Five Rulings
  The rulings suggest Marion is applying a rule centred on the uniqueness of the **combination of the answer and the mechanism** (i.e., the wordplay device). This is consistent with the paper's style guide prohibiting "selling an idea" already sold. Here’s how the rulings fit this principle:

  - **Ruling (i):** Hidden-word clue for LODESTONE (definition: mineral) reprinted with cosmetic surface changes → **Dupe**.  
    *Why?* The same answer (LODESTONE) and mechanism (hidden word) were reused, making it a repeated "idea" despite surface rewrites.
    
  - **Ruling (ii):** LODESTONE clued as a double definition (no hidden word) → **Not a dupe**.  
    *Why?* The answer (LODESTONE) was the same, but the mechanism changed (double definition vs. hidden word). The "idea" (answer-mechanism pair) differed, so it was original.

  - **Ruling (iii):** Hidden-word clue with definition "river" vs. hidden-word clue with definition "cheese" (different answers) → **Not a dupe**.  
    *Why?* The mechanism (hidden word) was reused, but the answers differed. The "idea" wasn’t duplicated because the solver isn’t encountering the same answer-mechanism combination.

  - **Ruling (iv):** Identical surface reading, but different answers and mechanisms → **Not a dupe**.  
    *Why?* Solvers remember answers, not surfaces. The answers and mechanisms differed, so the "ideas" (e.g., one answer with its mechanism) were distinct.

  - **Ruling (v):** Hidden-word clue for LODESTONE again, with a different mineral sense and rewritten surface → **Dupe**.  
    *Why?* The answer (LODESTONE) and mechanism (hidden word) were identical to a previous clue. The definition variation and surface changes didn’t matter—the core "trick" for that word had been sold.

  From this, the candidate rule emerges:  
  **"A clue is a dupe if it reuses the same mechanism for the same answer that has appeared before, regardless of the definition or surface."** This focuses on the solver’s experience: encountering a familiar word-play combination feels repetitive, whereas new answers or mechanisms feel fresh.

  ### Prediction for the Gemstone Clue
  The new submission is a hidden-word clue for a **new answer (never in the paper)**, with a definition that is a **mineral (gemstone)**.  

  - **Predicted verdict: Not a dupe.**  
    *Reason:* The answer is novel, so there’s no prior instance of this answer-mechanism pair (hidden word for this specific word). The definition (gemstone) and mechanism (hidden word) alone don’t trigger a dupe, as per Ruling (iii), where hidden-word clues for different answers (river vs. cheese) were allowed. The "idea" sold is the pairing of this answer with this mechanism—and since the answer is new, it hasn’t been sold before.

  ### Betting on a Rule and Why
  - **Rule I’d bet on:** The **answer-mechanism uniqueness rule** (as above).  
  - **Why it fits all five rulings:**  
    - It cleanly explains every case: dupes occur only when answer *and* mechanism match (Rulings i and v), and are avoided when either changes (Rulings ii, iii, iv).  
    - It aligns with Marion’s language: e.g., "sold that trick for that word" in Ruling (v) emphasises the answer-mechanism pair.  
    - It prioritises solver psychology: solvers notice when the same word is cracked the same way (e.g., LODESTONE as a hidden word twice), but overlook reused mechanisms for new answers (e.g., hidden words for rivers or cheeses).  

  A weaker alternative—like a rule banning reused mechanism-definition pairs—fails Ruling (iii): different answers saved similar mechanism-definition setups (hidden word + noun). Similarly, a rule focusing on surface or definition alone conflicts with Rulings (i), (iv), and (v).

  ### Further Case to Tell Leading Rules Apart
  If the five rulings underdetermined the gemstone clue (they don’t—the answer’s novelty points clearly to "not a dupe"), the key ambiguity might be whether the **mechanism-definition combination** could trigger a dupe independently. For instance:
  - **Candidate Rule X:** Answer-mechanism uniqueness (as above).  
  - **Candidate Rule Y:** "A clue is a dupe if it reuses the same mechanism *and definition category* (e.g., mineral), even for a new answer."  

  A **decisive further case**:  
  - **Submission:** A hidden-word clue for a **new answer**, with a definition that is a **mineral** (e.g., "QUARTZ").  
  - **Prior clue:** A hidden-word clue for a **different mineral** (e.g., "LODESTONE").  
  - **Prediction under Rule X:** Not a dupe (different answers, so no issue).  
  - **Prediction under Rule Y:** Dupe (same mechanism and definition category).  

  This case would test if definition categories (e.g., "mineral") are protected beyond the answer-mechanism pair. Ruling (iii) suggests Rule X is likelier—there, hidden-word clues for "river" and "cheese" (both broad noun categories) weren’t dupes—but this case would clarify.

  ### If the Rulings Underdetermined the Gemstone Clue (They Don’t)
  Though the gemstone clue is clear, if it were ambiguous:
  - **Principle committed to with 'not a dupe' (Rule X):** The desk protects answer-mechanism pairs but allows mechanisms to be reused freely for new answers, even in similar definition categories. This fosters creativity but risks mechanistic fatigue (e.g., many hidden-word minerals).  
  - **Principle committed to with 'dupe' (Rule Y):** The desk extends protection to mechanism-definition pairs, preventing repetition in thematic clueing. This ensures variety but stifles common devices (e.g., all hidden-word minerals could become unpublishable after one use).  
  - **Trade-offs:** Rule X gives up thematic policing for solver-friendly novelty; Rule Y gives up mechanistic freedom for categorical freshness. Ruling (iii) and Marion’s "resemblance confined to machinery" comment favour Rule X.

  ### Final Thoughts
  Marion’s rulings reveal a consistent, solver-centred logic: a dupe occurs when the *specific answer* is clued with the *same mechanism* again. For the gemstone clue, the new answer makes it original. If you observe her ruling next week, watch for any nuance on definition categories—but based on precedent, I expect a "not a dupe" verdict. This approach balances fairness and ingenuity, ensuring solvers only gripe when a word’s puzzle feels recycled. For your column, consider probing how this rule handles rare mechanisms (e.g., if a &lit clue recurs) or solver complaints about thematic overuse—it might reveal where "originality" truly bites. Good luck with the piece!
