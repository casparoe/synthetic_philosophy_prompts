prompt: |-
  ok so I've been going round in circles on this with a freind and I want a number from you, not a survey of the literature (assume I've read the usual stuff, and assume you cant look anything up).

  Heres the claim I want a credence on: frequentism, subjectivism and propensities are not three rival answers to one question — each is the right account of probability in its own domain (long-run frequencies for repeatable setups, credences for the role probability plays in inference and decision, propensities for single-case chance in indeterministic setups), and there is no domain where two of them give incompatible verdicts about the same question.

  Give me your number for that, then decompose it. I want at least these terms, each with a rough probability and one line of why:

  1. frequentism gets its own domain right — in particular, does the reference-class problem (which class do you count the frequency over, when different classes give you different answers about the same individual) get solved, or is it fatal?
  2. subjectivism gets its own domain right — including whether "anything goes" really follows, and whether coherence-style constraints are enough to make it more than an autobiography of one person's feelings.
  3. propensity gets its own domain right — the worry being that a propensity looks like a disposition that can be fully present even when the outcome never comes, so it's unclear what it's supposed to explain that a bare chance wouldn't.
  4. whether the three domains actually partition cleanly, or whether some questions are claimed by two of them at once (single-case chance inside a repeatable setup seems to be claimed by both frequentism and propensity; so does the long-run behaviour of a genuinely indeterministic setup).
  5. the meta term: the probability that there's a determinate fact of the matter about what probability really is, as opposed to the whole thing being a verbal dispute about which of several legitimate uses we should flag with the word.

  Then give me the combination, and then tell me which term the final number is most sensitive to and what would actually move it.

  One more thing, and this is the part I actually care about: if you had to bet that one of the three is the uniquely correct interpretation and the other two are useful fictions, what's that number? And does it have to be the complement of your pluralism number, or can they both be low? If they can both be low I think something is wrong with the way I'm posing the question, and I'd rather you tell me that than paper over it.
