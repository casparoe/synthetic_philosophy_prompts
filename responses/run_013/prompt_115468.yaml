  The summons arrived at dawn, printed on thick, legal-bond that smelled faintly of ozone. Elara stared at the words, her knuckles white on the edge of her kitchen counter. **Notice of Preemptive Liability & Detainment Order.** Below, chillingly specific: *Elara Vance, current temporal stage (designated TS-287.4), is hereby held accountable for the financial obligations and criminal actions projected for Elara Vance, future temporal stage (designated TS-312.1).*

  TS-312.1. Roughly twenty-five years from now. A self she hadn't become.

  The town outside her window, New Concord, gleamed under the morning sun. Its smooth, white buildings pulsed with soft light, projecting holographic civic reminders: *"The Whole Self is Responsible." "Your Past Funds Your Future. Your Future Repays Your Past."* The law saw a person as a single, unchanging entity stretched across time – one rope, not many knots. Debts incurred by your eighty-year-old self? Payable now. Crimes predicted for your future? Punishable in the present. "Continuity Enforcement," they called it.

  Elara saw strings of pearls, each bead distinct, connected only by the thread of memory and consequence. *She* was bead 287.4. The Elara signing that ruinous contract, or committing that unspecified future crime, was bead 312.1. A different person, morally. Legally? New Concord disagreed.

  The papers detailed two burdens. First, a staggering debt obligation: TS-312.1 was projected to purchase a luxury orbital habitat share. Elara, bead 287.4, struggling freelance data-cryptographer, had to start paying *now*. Second, and far worse: a mandatory "Preventive Stabilization" period – six months confinement starting next week – because predictive algorithms flagged TS-312.1 at "high risk" for "violent interpersonal conflict resulting in grievous harm."

  Panic, cold and sharp, clawed up her throat. *They’re going to lock me up for something I haven’t even thought of doing. Something *she* might do, decades from now!* Her hands trembled. She wasn't that future self. She hadn't lived those years, made those choices, become whoever TS-312.1 was. The Elara of now loved quiet, hated confrontation, found violence abhorrent. How could she be jailed for a stranger's potential rage?

  She reported to the Continuity Compliance Bureau, a stark building humming with quiet efficiency. The official, Ms. Thorne, had the serene certainty of deep belief. "Ms. Vance, the law recognizes the fundamental unity of your existence. The 'you' who will incur this debt, the 'you' who might lash out – they are *you*. Just as the child you were is responsible for the contracts you sign today." Thorne tapped the detainment order. "This isn't punishment for an act, but protection. For potential victims, and crucially, for *you*. We intervene *now* to alter the trajectory, to prevent that future self from emerging. Therapy, conditioning, reflection... it stabilizes the whole life-line."

  "But *I* haven't done anything!" Elara protested, her voice tight. "The me sitting here, right now? I'm peaceful! Jailing me *now* for what some future version *might* do... it's punishing an innocent person! That future self isn't *me* yet. She might never exist if circumstances change!"

  "Circumstances change *you*," Thorne countered calmly. "But the core entity persists. If we wait until the crime occurs, the damage is done. The victim suffers. And *you* – the enduring you – bears the guilt and the penalty regardless. Isn't it more merciful, more just, to prevent the fracture before it happens? To protect both your future integrity and potential victims?" Her gaze held a disturbing compassion. "Think of it as... preventative medicine for the soul. We treat the disease in its earliest stage."

  The logic was seductive in its horror. Prevent the pain. Stop the future criminal by restraining the current self. But to Elara, it felt like being dismantled. Her present self, her values, her innocence, were being sacrificed on the altar of a hypothetical future.

  Driven by desperation, Elara dug. She couldn't challenge the metaphysics legally; the Enduring Self doctrine was bedrock. But maybe she could challenge the *prediction*. Who was TS-312.1 supposed to harm?

  Hacking the Bureau's peripheral logs (a skill her *current* temporal stage possessed) was terrifying. Each keystroke felt like painting a target on her back. But she found it: the projected victim was coded "M. Solis." Cross-referencing public records and fragmented personal data she shouldn't access, a name emerged: **Maya Solis**.

  Elara froze. Maya. The brilliant bio-architect she’d met at a conference last year. The woman whose laugh was sudden sunshine, whose passion for restoring coral reefs was infectious. The woman Elara, bead 287.4, had been tentatively, giddily, falling for. They had plans to visit the coastal regeneration zones next month.

  The projected crime wasn't random violence. It was intimate. Personal. TS-312.1 was predicted to grievously harm *Maya Solis*.

  The force of New Concord's doctrine hit Elara like a physical blow. If she *was* one continuous self, then the seed of that future violence *must* exist within her now. The Bureau wasn't just restraining a future criminal; they were protecting Maya from *her*, from a darkness potentially coiled inside Elara's *present* self, waiting decades to strike. The thought sickened her. Was there a monster nascent within her, invisible to her now, destined to hurt the person she currently adored?

  But the perdurantist core in her screamed back. *No!* The Elara who loved Maya now was *not* the Elara who might harm her later. Circumstances would change them *both*. Betrayal, illness, decades of unseen pressures… those would forge TS-312.1, a stranger molded by a future Elara couldn't fathom. Punishing *this* Elara for that future stranger's potential act wasn't justice; it was the erasure of her current self, her present love, her innocence. It was holding a caterpillar accountable for the damage a butterfly *might* do.

  She stood at her window, the detainment order on the table, Maya’s contact info glowing on her screen. New Concord's lights pulsed: *"The Whole Self is Responsible."* The doctrine offered a terrible, protective unity, a way to stop horrors before they happened by acting on the only self you could ever truly reach: the present one.

  But Elara looked at her hands – the hands that wanted to reach out to Maya *now* – and saw only the hands of the present. To jail these hands for what future hands *might* do felt like severing the thread of her own life before it could unfurl. Yet, the image of Maya, hurt by some future incarnation of Elara Vance, filled her with a dread that resonated bone-deep. Protecting Maya felt paramount, even if the cost was… herself.

  Which self, though? That was the unbearable question New Concord forced upon her, a question without an answer that didn't demand a sacrifice. She picked up her comm, fingers hovering over Maya's name. To warn her? To say goodbye? The weight of the future, and the desperate innocence of the present, pressed down, leaving her stranded in the terrible, inescapable *now*.

  The End.
