prompt: |-
  My reading group just did the Aunt Hillary thing — the aunt who turns out to be made of ants — and when we got to whether the colony itself could have a mind, one guy settled it by saying 'the whole is more than the sum of its parts,' and everyone nodded like that was an argument. I don't think it is, or at least not the argument he needed. Can you lay out the different precise claims that one sentence could be making, from the boring end (an organized colony can do things a pile of ants can't) through the middle (the colony has real, predictable states that aren't located in any single ant) to the strong end (the colony literally has beliefs and desires, or its mental states cause things the individual ants can't account for) — and for each reading say wether it's true, whether it's just a relabeling of the boring one, and whether it would actually get him to 'so yes, the colony is conscious'? Also tell me which readings a physicalist can live with, which should make one squirm, and which one he probably meant, given that it ended the discussion. Give it to me as a menu I can bring back next week. American English, please.
