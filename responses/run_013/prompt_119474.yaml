prompt: |-
  I'm co-teaching an upper-level seminar on collapse this term (16 students, 90 minutes, a mix of archaeology and philosophy people) and I want one session where they actually feel how much of the answer depends on what you've decided is the thing that's collapsing, instead of me just saying it at them. My co-instructor is a classicist who thinks the Late Bronze Age is the only case worth the name, and the students show up with the pop-science version where a society does something dumb and gets punished for it. I want to wreck both of those habits in one sitting, ideally without either of us lecturing.

  What I've sketched is this, and I'd like you to build it into something actually runnable. Four teams, each gets a one-page data sheet for one case -- the eastern Mediterranean around 1200 BC, the southern Maya lowlands in the 9th-10th centuries, Rapa Nui, and a fourth case that you invent outright, with invented figures, so nobody can coast on what they half-remember. Crucially each team also gets a charter: a half-page mandate written in the voice of some seperate fictional stakeholder (a heritage body, a diaspora association, an insurance syndicate, whatever you like) that fixes for that team what counts as the society and what counts as failure. I want the charter to pin down four things, and I've been calling them the four slots in my notes: the bearer (what is the society -- the palace system, or the population, or the craft tradition, or the trade network?), the capacity (what would it be losing -- political autonomy, population, literacy, a way of building?), the threshold (how much loss before you call it), and the baseline (collapse compared to what -- the generation before, or the trajectory it would plausibly have had otherwise?). The teams fill out a registrar's form with those four slots plus a verdict (collapsed / not collapsed / transformed), a 0-10 severity number, and their confidence, and post it on the board. Then the twist: they swap charters with another team that has the same data sheet and have to redo the whole verdict under someone else's mandate with the same facts. After that I want a short tribunal round where two teams who ended up with opposite verdicts on the same case have to work out whether their disagreement is about the data or about the charter, and then a last round where every team writes one sentence about their case that stays true no matter which charter you hold -- I want them to see that some facts travel across frames and some verdicts don't. Then the debrief, where the idea finally gets named, mapping each moment onto the parts of it.

  Please give me the materials list, a minute-by-minute timeline for the 90, and the debrief script. And be blunt about the failure modes, because I've run enough of these to know there will be some: teams will fight about the facts rather than the frame, someone will refuse to give a verdict because it depends, and transformed is going to become the safe sophisticated answer that everyone retreats to, so I want a mechanic that makes that answer cost something -- maybe the registrar rejects a vague transformation verdict unless you say what became what and who paid for it. Also, a team might spot the trick in round one and spoil it for the others; tell me what to do with that person (make them registrar?). And what do I do with the student who announces at minute ten that collapse is just a colonialist narrative and refuses to engage with the cases at all? Then the honest bit: tell me which feature of the whole idea this activity can't reproduce and that I'll have to supply myself in the debrief. I already suspect it makes relativism feel too cheap, and that it can't give them the timescale -- real collapses take generations and nobody inside one is holding a verdict form -- but tell me what else I'm missing.
reasoning: |-
  We are creating a 90-minute seminar activity with the following goals:
   - Show students that the verdict on whether a society "collapsed" depends heavily on how we define the society and what we consider collapse (the "bearer," "capacity," "threshold," and "baseline").
   - Challenge both the pop-science view (dumb mistakes lead to punishment) and the narrow view (only one case is valid).
   - Use four cases: three real (Late Bronze Age, Southern Maya lowlands, Rapa Nui) and one fictional (to prevent reliance on prior knowledge).
   - Each team gets a data sheet (facts about the case) and a charter (from a stakeholder that defines the four slots: bearer, capacity, threshold, baseline).
   - Teams fill out a verdict form (collapsed/not/transformed, severity, confidence) based on their charter.
   - Then teams swap charters (with another team that has the same case) and re-evaluate the same case with a different charter.
   - Tribunal: Two teams with opposite verdicts on the same case discuss whether disagreement is about data or charter.
   - Final round: Each team writes one sentence about their case that is true regardless of the charter.

   Materials:
   1. Four case data sheets (one per case, each given to two teams so that two teams have the same case but different charters).
   2. Eight charters (two per case, each with a different stakeholder and different definitions of the four slots).
   3. Verdict forms (enough for two per team: one for the original charter, one for the swapped charter).
   4. A board (physical or digital) to post verdicts.
   5. A timer.

   Timeline for 90 minutes (approximate):

   0-5 min: Introduction (set the stage, explain the activity without giving away the twist). Explain that they will be acting as registrars for a collapse assessment board. They will get a case and a charter that defines what they are looking for. They must fill out a form with a verdict.

   5-20 min: Round 1: Teams (4 teams of 4 students each) receive:
        - One case data sheet (each case is given to two teams, so two teams have Case A, two have Case B, etc.)
        - One charter (for the same case, but the two teams with the same case get different charters)
        - One verdict form.
     They have 15 minutes to discuss and fill out the form.

   20-25 min: Teams post their verdict forms on the board.

   25-40 min: Round 2: Swap charters. Each team swaps their charter with the other team that has the same case (so now each team has the same case but a different charter). They get 15 minutes to re-evaluate the same case under the new charter and fill out a second verdict form.

   40-45 min: Teams post their second verdict forms.

   45-60 min: Tribunal round: The instructor selects two teams that have the same case and ended up with opposite verdicts (either in Round 1 or Round 2) to have a discussion. They must work out whether their disagreement is about the data (facts) or the charter (definitions). (If there are no opposite verdicts, choose teams with the same case that had different severity ratings and discuss why.) This is a 15-minute discussion, with each pair of teams (or one pair at a time in front of the class, if time permits) explaining their reasoning.

   60-75 min: Final round: Each team is asked to write one sentence about their case that remains true regardless of which charter they are using. They must agree on one sentence that is robust to the framing. (5 minutes to discuss and write, then each team reads theirs.)

   75-90 min: Debrief: Instructor-led discussion about the activity and the concept.

   Failure modes and solutions:

   1. Teams fight about the facts rather than the frame: 
      - Solution: In the charters, make the data sheet the only source of facts. Emphasize that the data is fixed and they are to interpret it through the charter. If they dispute the data, remind them that for the exercise, the data sheet is the agreed-upon evidence.

   2. Someone refuses to give a verdict because "it depends":
      - Solution: The charter is the mandate that removes the ambiguity. They are playing a role. The registrar form requires a verdict. Also, the charter explicitly defines the four slots. Make the verdict form have a "transformed" option but with the requirement to specify what changed and for whom (see below).

   3. "Transformed" becomes the safe answer:
      - Solution: Modify the verdict form to require that if they choose "transformed," they must state:
            - What the bearer became (e.g., "from a centralized state to a set of warring chiefdoms")
            - And who paid the cost (e.g., "the royal lineage lost power, but the peasantry gained autonomy").
        This makes it more than a dodge. Also, in the debrief, point out that transformation can be a way of avoiding collapse for some bearers but not others.

   4. A team spots the trick early:
      - Solution: Make them the registrar for their case? But that might disrupt the team dynamic. Alternatively, acknowledge it and ask them to play along to see how others react. Or, in the debrief, use their insight as a starting point.

   5. A student rejects the entire exercise as colonialist narrative:
      - Solution: Acknowledge that the term "collapse" can be problematic and that the activity is precisely about how our framing (often influenced by power structures) shapes the narrative. The point of the activity is to show that the verdict depends on the frame, and that includes the frame of the stakeholder (who might be a heritage body with a nationalist agenda, an insurance company with a financial interest, etc.). Invite the student to consider how their critique is part of the very issue the activity is designed to highlight.

   What the activity can't do (to be addressed in debrief):
     - It cannot capture the timescale: real collapses happen over generations, and people living through them may not know they are in one.
     - It cannot reproduce the lived experience and the multiplicity of perspectives within a collapsing society. The stakeholders in the charters are external and retrospective.
     - The activity might make relativism seem too easy: by swapping charters, it's easy to change the verdict. But in reality, the choice of frame is often deeply political and not arbitrary. The debrief must emphasize that the frames are not neutral and are tied to power and interests.

   Debrief script:

    1. Start by asking: "What did you notice during the activity? What was challenging?"
    2. Highlight the moments in the activity that correspond to the key ideas:
          - The initial verdict: How did the charter (the frame) shape what you looked for?
          - The swap: How did changing the frame change the verdict? (Did it always change? Why or why not?)
          - The tribunal: When two teams disagreed, was it about the facts or the definitions? (Point out that even with the same facts, the frame can lead to opposite conclusions.)
          - The one-sentence: What kind of statements were robust? (Usually, these are about events or conditions that happened, without a judgment of collapse. They are the "facts" that the frames then interpret.)
    3. Discuss the limitations:
          - The activity compresses time and simplifies the complexity of collapse. Real collapses are processes that take generations, and the people living through them have diverse experiences.
          - The frames (charters) are set by stakeholders with interests. In reality, the power to define what counts as collapse and what society is matters. (E.g., a heritage body might focus on monumental architecture, while a diaspora group might focus on cultural continuity.)
          - The term "collapse" itself is a narrative imposed by later observers. It can be a colonialist narrative when it implies that a society disappeared or failed, ignoring continuities and the agency of the people involved. The activity shows that by changing the frame, we can avoid such simplistic narratives.
    4. Connect to the course: "In this course, we are examining collapse not as a single event but as a concept that requires us to define our terms. The activity shows that without defining the bearer, capacity, threshold, and baseline, we cannot even begin to talk about collapse. And these definitions are not neutral; they reflect our values and our position."

   Materials list:

     - Four case data sheets (one per case, each given to two teams). We have three real cases and one fictional:

           Case 1: Eastern Mediterranean (Late Bronze Age) - 1200 BC
           Case 2: Southern Maya lowlands - 9th-10th centuries
           Case 3: Rapa Nui (Easter Island) - 17th-18th centuries
           Case 4: Fictional case: The Republic of Thalas (a maritime trading society) - invented

     - Eight charters (two per case). Each charter is from a different stakeholder and defines the four slots. Examples:

          For Late Bronze Age:
            Charter 1 (Stakeholder: International Heritage Preservation Society):
              Bearer: The palace-centered political system (the great kingdoms: Hittite, Mycenaean, etc.)
              Capacity: Political autonomy and central administration
              Threshold: Loss of centralized control in at least 75% of the palace centers
              Baseline: Compared to the peak of the Late Bronze Age (13th century BC)

            Charter 2 (Stakeholder: Eastern Mediterranean Diaspora Alliance):
              Bearer: The people of the region (including all social classes and ethnic groups)
              Capacity: Continuity of settlement and cultural practices (e.g., language, religious rituals)
              Threshold: A decline of more than 50% in population and the cessation of at least two major cultural practices in the core regions
              Baseline: Compared to the generation before the so-called collapse (early 12th century BC)

          For the fictional case (Republic of Thalas):
            We need to invent:
              Data sheet: 
                - A maritime republic that thrived on trade, with a fleet of ships and a network of coastal cities.
                - Faced environmental changes (rising sea levels, storms) and piracy.
                - By the end of the period, the central senate disbanded, the fleet was reduced to a fraction, but many coastal villages continued fishing and trading on a smaller scale.

            Charter 1 (Stakeholder: Global Insurance Syndicate):
              Bearer: The state (the Republic) as a political and economic entity
              Capacity: Ability to repay state debts and maintain the fleet for trade protection
              Threshold: Default on sovereign debt and reduction of the fleet by 80%
              Baseline: Compared to the peak (50 years prior)

            Charter 2 (Stakeholder: Thalasian Cultural Continuity Group):
              Bearer: The Thalasian people and their cultural identity
              Capacity: Continuation of Thalasian language, maritime festivals, and boat-building techniques
              Threshold: If the language is still spoken by at least 30% of the population in the core region and the festivals are still held in at least half of the coastal towns
              Baseline: Compared to the previous generation

     - Verdict form (one per team per round) should have:
          Case: _________
          Charter: _________
          Verdict: [ ] Collapsed [ ] Not Collapsed [ ] Transformed (if transformed, explain: What became what? Who paid the cost?)
          Severity (0-10): _____
          Confidence (0-100%): _____
          For the four slots (to be filled by the team based on the charter, to show they understand the charter):
              Bearer: __________
              Capacity: __________
              Threshold: __________
              Baseline: __________

     - A board to post the forms.

     - Timer.

   Let's now create the fictional case (Republic of Thalas) and the two charters for it in full, and outline the others.

   Due to length, I'll sketch the data sheets and charters briefly. You can expand them to one page each.

   Case 4: Republic of Thalas (fictional)

   Data Sheet:
     - Location: A peninsula and islands in a sea, with a capital at Thalas City.
     - Peak: 150 years of prosperity (from 200 to 50 years before the present) based on maritime trade, shipbuilding, and a strong navy.
     - Key events:
          - 50 years ago: Sea levels began rising, causing flooding in low-lying areas. Storms became more frequent.
          - 40 years ago: Piracy increased, disrupting trade routes. The navy was overstretched.
          - 30 years ago: The senate raised taxes to fund the navy, leading to unrest in coastal cities.
          - 20 years ago: The capital city was severely damaged by a storm. The central government relocated inland but lost control of the outer islands.
          - Today: The Republic as a political entity no longer exists. The central senate was disbanded 10 years ago. The once-great fleet is now a few dozen small ships. However, many coastal villages still speak the Thalasian language, practice traditional boat-building, and hold the annual Festival of the Sea. Trade continues on a local scale.

   Charters for Thalas:

     Charter 1 (Stakeholder: Global Insurance Syndicate)
       Mandate: Assess the risk of collapse for the purpose of settling insurance claims on state bonds.
       Bearer: The Republic of Thalas as a sovereign state.
       Capacity: The state's ability to maintain its fleet for trade protection and repay its sovereign debts.
       Threshold: Collapse is defined as the state defaulting on its debt obligations and the fleet being reduced to less than 20% of its peak size.
       Baseline: Compare to the peak of the Republic (50 years ago).

     Charter 2 (Stakeholder: Thalasian Cultural Continuity Group)
       Mandate: Assess whether the Thalasian people and their culture have survived.
       Bearer: The Thalasian people and their cultural traditions (language, festivals, boat-building).
       Capacity: The continuation of the Thalasian language, the annual Festival of the Sea, and traditional boat-building techniques.
       Threshold: If the language is still spoken by at least 30% of the population in the core region and the festivals are held in at least half of the coastal towns, then collapse has not occurred.
       Baseline: Compare to the previous generation (20-30 years ago).

   For the real cases, we can create similar charters. Now we proceed to the detailed timeline.

   Detailed timeline:

    0-5 min: Introduction
       - "Today we are going to investigate how we decide whether a society collapsed. You'll be divided into teams, and each team will act as a registrar for a collapse assessment board. You will be given a case and a charter from a stakeholder. The charter tells you what society you are looking at and what counts as collapse. Your job is to fill out a verdict form based on the facts and the charter."

    5-20 min: Round 1 (15 min)
       - Distribute materials: Each team gets one case data sheet, one charter (for that case), and one verdict form.
       - Teams discuss and fill out the form. The instructor circulates to answer questions and ensure they are using the charter.

    20-25 min: Posting Round 1 verdicts
       - Each team posts their verdict form on the board.

    25-40 min: Round 2 (15 min)
       - Teams swap charters with the other team that has the same case (so each team now has a different charter for the same case).
       - They fill out a second verdict form.

    40-45 min: Posting Round 2 verdicts

    45-60 min: Tribunal (15 min)
       - The instructor pairs two teams that have the same case and had different verdicts (in either round) and asks them to discuss: "Is your disagreement about the facts (data) or the definitions (charter)?"
       - Each pair has 3-4 minutes to discuss, then shares with the class (if time, one or two pairs).

    60-75 min: Final round (15 min)
       - Each team is given 5 minutes to come up with one sentence about their case that is true regardless of the charter. Then each team reads their sentence (1 minute per team).

    75-90 min: Debrief (15 min) - follow the script above.

   Additional failure mode: Time management. Keep strict time limits. Have a timer visible.

   If a team finishes early in any round, ask them to prepare to explain their reasoning.

   This design should meet the goals and handle the anticipated problems.
answer: |-
  ### **Activity Materials & Setup**
  **Materials Needed:**
  1. **Four Case Packets** (one per team; two teams share the same case but different charters):
     - **Case 1: Late Bronze Age Collapse (1200 BCE)**: Data sheet on palatial states, trade collapse, migration, and climate shifts.
     - **Case 2: Southern Maya Lowlands (9th-10th c. CE)**: Data sheet on urban abandonment, drought, and political fragmentation.
     - **Case 3: Rapa Nui (Easter Island, 17th-18th c.)**: Data sheet on deforestation, societal conflict, and population decline.
     - **Case 4: The Republic of Va’al (Fictional)**:  
       - *Data Sheet*: Island-based trade federation (peak: 1500 CE). Declined due to volcanic ash ruining terraced agriculture, elite hoarding of ships, and a failed rebellion. By 1650 CE: 70% population decline, trade networks fragmented, but oral traditions and fishing practices persisted.  
       *(Invented figures: Population: 250,000 → 75,000; Ship numbers: 500 → 50; Terraced farms: 90% abandoned.)*

  2. **Eight Charters** (two per case; one per team):  
     Each defines the **bearer**, **capacity**, **threshold**, and **baseline** from a stakeholder’s perspective.  
     - *Example for Late Bronze Age*:  
       - **Charter A (Heritage Council)**:  
         Bearer = Palatial states; Capacity = Centralized bureaucracy; Threshold = ≥80% loss of administrative centers; Baseline = Peak of the Mycenaean era.  
       - **Charter B (Diaspora Alliance)**:  
         Bearer = Coastal populations; Capacity = Maritime trade access; Threshold = ≥50% decline in port activity; Baseline = Pre-collapse generation.  
     - *Example for Va’al*:  
       - **Charter A (Insurance Syndicate)**:  
         Bearer = Trade federation; Capacity = Debt repayment ability; Threshold = Default on 60% of loans; Baseline = Projected growth trajectory.  
       - **Charter B (Indigenous Council)**:  
         Bearer = Terraced farming communities; Capacity = Traditional crop yields; Threshold = Loss of >75% farmland; Baseline = Pre-volcanic norms.  

  3. **Verdict Form** (printed; one per team per round):  
     ```
     Case: ________  
     Stakeholder: ________  
     Bearer (as defined): ________  
     Capacity (as defined): ________  
     Threshold (as defined): ________  
     Baseline (as defined): ________  
     Verdict: [ ] Collapsed [ ] Not Collapsed [ ] Transformed  
     *If "Transformed," explain: FROM ________ TO ________ ; WHO PAID: ________  
     Severity (0-10): ________  
     Confidence (0-100%): ________  
     ```

  4. **Board/Poster** for posting verdicts, **timer**, and **markers**.

  ---

  ### **90-Minute Timeline**  
  **0-5 min: Framing the Exercise**  
  - *Script*: “Today, you’re not historians—you’re a **Collapse Assessment Board**. Your job is to deliver a verdict based on a stakeholder’s charter, not your personal views. The charter tells you *what* counts as the society, *what* counts as failure, and *how to measure it*. Stick to the data and your mandate.”  

  **5-25 min: Round 1 (Verdict Under Original Charter)**  
  - Teams (4 teams of 4) receive:  
    - One **case data sheet** (e.g., Team 1A and 1B get Late Bronze Age; Team 2A and 2B get Maya, etc.).  
    - One **charter** (e.g., Team 1A gets Charter A; Team 1B gets Charter B for the same case).  
    - One **verdict form**.  
  - *Task*: Fill out the form. **Enforce strict 15-min deadline**.  
  - *Instructor Role*: Roam and challenge vague "transformed" verdicts: *“Who paid the cost? What specifically changed?”*  

  **25-30 min: Post Verdicts**  
  - Teams post forms on the board. Highlight differences in verdicts for the same case.  

  **30-50 min: Round 2 (Swap Charters)**  
  - Teams **swap charters** with the team that has the *same case* (e.g., Team 1A and 1B swap).  
  - *Task*: Re-evaluate the **same case** with the new charter. Fill out a new verdict form.  
  - *Twist*: “Your stakeholder changed—defend *their* interests, not your previous verdict.”  

  **50-55 min: Post Verdicts**  
  - Teams post second verdicts. Note changes from Round 1.  

  **55-70 min: Tribunal Round**  
  - Pair two teams with **opposite verdicts** on the same case (e.g., Team 1A now says “collapsed”; Team 1B says “not collapsed”).  
  - *Task*: Discuss for 5 min: **“Is your disagreement about the DATA or the CHARTER?”**  
  - Each pair presents for 2 min. **Force them to quote charter language** (e.g., “Your threshold was 80% loss; ours was 50%—that’s a charter clash”).  

  **70-80 min: Frame-Proof Facts**  
  - *Task*: Each team writes **one sentence** about their case that remains true *regardless of the charter*.  
    - *Example for Rapa Nui*: “Monument construction ceased by 1650 CE.”  
    - *Example for Va’al*: “Volcanic ash reduced arable land by 90%.”  
  - Teams share sentences. Ask: *“Why did these facts survive the frame shift?”*  

  **80-90 min: Debrief**  

  ---

  ### **Debrief Script**  
  **Connect Activity to Concepts:**  
  1. **Frame Dependency** (5 min):  
     - *Say*: “Your verdicts changed not because the facts did, but because the **bearer**, **capacity**, **threshold**, or **baseline** shifted. The Late Bronze Age ‘collapsed’ for palatial elites but not for coastal traders. The Maya ‘collapsed’ if you value urban monuments but not if you value diaspora survival.”  
     - *Visual*: Map four teams’ verdicts for one case onto the whiteboard, showing how charters drove outcomes.  

  2. **What the Activity Couldn’t Capture** (3 min):  
     - **Timescale**: “Real collapses unfold over generations—no one in 1210 BCE said ‘We’re collapsing!’ We project frames backward.”  
     - **Relativism Isn’t Cheap**: “Frames aren’t arbitrary—they reflect **power** (e.g., insurers care about debt; diaspora care about kinship). The pop-science ‘dumb society’ trope ignores who defines ‘dumb.’”  
     - **The Cost of ‘Transformed’**: “When you said ‘transformed,’ you had to name **winners and losers**. Collapse is never neutral—someone always pays.”  

  3. **Smashing Habits** (2 min):  
     - To the classicist: “The Late Bronze Age is only a ‘collapse’ if the bearer is palaces. Shift the bearer, and it’s a reorganization.”  
     - To pop-science: “No society is ‘punished’—your verdict depended on *which capacity* you valued. Rapa Nui didn’t ‘fail’—it adapted unevenly.”  

  ---

  ### **Failure Mode Solutions**  
  - **Teams Fight About Facts, Not Frames**:  
    - *Prevent*: Print data sheets with **no room for interpretation** (e.g., “Rapa Nui population: 15,000 → 3,000”). Intervene: “Your charter says the bearer is *monument-building capacity*—does the data show it fell below 20%? Yes/No?”  
  - **“It Depends” Avoidance**:  
    - Force a verdict. *Say*: “Your stakeholder demands a ‘yes’ or ‘no’—you’re fired if you hedge!”  
  - **“Transformed” as Safe Answer**:  
    - Make it **costly**: The registrar (instructor) rejects vague “transformed” verdicts. Demand: *“What became what? Who lost power?”*  
  - **Student Spots the Twist Early**:  
    - *Solution*: Make them the **Registrar** for their case—they run the tribunal for their teams and must enforce charter compliance.  
  - **Student Rejects “Collapse” as Colonialist**:  
    - *Acknowledge*: “You’re right—‘collapse’ often erases Indigenous continuity. Today’s charters include a *diaspora council* to surface that. Use their charter to show why ‘collapse’ is a bad fit.”  
  - **Time Runs Short**:  
    - Prioritize **Tribunal** and **Frame-Proof Facts**—they cement the core lesson. Cut posting time if needed.  

  ### **What the Activity Can’t Teach (Supply in Debrief)**  
  1. **Temporal Disconnect**: Participants see collapse as a “moment,” not a multi-generational process where cause/effect blur.  
     - *Add in debrief*: “Imagine you’re a farmer in the Maya collapse. You see drought, not ‘collapse’—it’s a *lived experience*, not a verdict.”  
  2. **Ethical Weight**: Frames aren’t academic—they decide whose trauma “counts.”  
     - *Add*: “When a heritage body calls the Maya collapse ‘total,’ they erase millions of living descendants. The frame is political.”  
  3. **Complexity Bias**: The activity simplifies causality (data sheets list factors; real collapses are emergent).  
     - *Add*: “In reality, climate, trade, and rebellion interact unpredictably—your charters couldn’t capture that feedback.”  

  This design forces students to *experience* frame dependency, exposes the limits of "collapse" as a concept, and leaves them with a concrete toolkit (bearer/capacity/threshold/baseline) to critique future readings. Run it tight, and lean into the chaos!
