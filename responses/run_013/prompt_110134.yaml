answer: |-
  ### 1. Summary  
  The practice is philosophically inconsistent but pragmatically coherent if grounded in a pluralistic moral framework. It presupposes that aggregate welfare maximization (via QALY thresholds) governs routine resource allocation but concedes to agent-relative duties, anti-aggregationist intuitions, and expressive symbolism in exceptional cases. Harsanyi’s axioms are implicitly rejected for identifiable rescue scenarios, revealing a commitment to moral particularism. While the core QALY system relies on utilitarian aggregation, the exceptions require deontological, relational, or communicative constraints that cannot be reduced to QALY sums.  

  ### 2. The Practice Described  
  Health systems use cost-per-QALY thresholds (e.g., $50,000–$150,000/QALY) to prioritize treatments, maximizing health benefits per dollar for populations. However, they routinely override this for "identifiable" individuals in life-or-death emergencies (e.g., rare disease patients, high-profile cases), funding interventions at vastly higher costs per QALY. This "rule of rescue" manifests in neonatal ICU spending, last-chance cancer drugs, or public campaigns for specific individuals. The system thus has two tiers: strict QALY efficiency for anonymous groups, and discretionary exceptions for identifiable persons facing imminent death.  

  ### 3. Commitments It Strictly Presupposes  
  **(~300 words)**  
  The practice necessitates:  
  - **Moral dualism**: Societies treat statistical and identifiable lives differently. This presupposes a rejection of *strong aggregationism* (where saving 100 anonymous lives at 1 QALY each always outweighs saving one identifiable life at 100 QALYs). Harsanyi’s theorem, which demands linear aggregation of utilities under Pareto and Bayesian rationality, is thus *inapplicable to rescue cases*.  
  - **Agent-relative obligations**: Decision-makers (clinicians, insurers, governments) accept special duties to *specific persons* they can "see" (e.g., a named patient in a media campaign), overriding impersonal cost-benefit calculus. This implies deontological constraints akin to Bernard Williams’ "integrity" objections to utilitarianism.  
  - **Non-welfarist values**: The exceptions embed commitments to *symbolic actions* (expressing societal solidarity), *relational equity* (avoiding visible abandonment), and *anti-calculative virtues* (compassion, rescue ethic). These cannot be captured in QALY weights.  
  - **Epistemic humility**: Systems acknowledge QALYs’ limitations in valuing life-extending interventions for the terminally ill, neonates, or rare diseases—where quality adjustments are contested or incomplete.  

  ### 4. Commitments It Merely Fits (or Doesn’t Need)  
  **(~200 words)**  
  The practice *fits* but does not strictly require:  
  - **Rule utilitarianism**: The QALY threshold could be a rule optimized for general welfare, with rescue exceptions as rare "safety valves." However, this doesn’t explain why *identifiability* triggers the valve.  
  - **Prioritarianism**: Exceptions *could* reflect weighting the worst-off (e.g., terminal patients), but neonatal ICU often benefits infants with high lifetime QALY potential—contradicting priority to the disadvantaged.  
  - **Kantian respect for persons**: While rescues avoid treating individuals as mere statistics, the *selective* nature of exceptions (e.g., media-visible cases) undermines universal duty.  
  It does *not* presuppose:  
  - **Full-blown consequentialism**: The exceptions reject QALY maximization when identifiability is salient.  
  - **Rights-based theories**: No systemic right to rescue exists; exceptions are discretionary and inconsistent.  

  ### 5. Where the Practice Is Underdetermined  
  **(~200 words)**  
  Multiple theories can endorse the two-tier system, but diverge in justification:  
  - **Communitarian ethics** sees rescues as affirming shared values (e.g., solidarity), while QALYs reflect stewardship of communal resources.  
  - **Scalar utilitarianism** could frame QALYs as *pro tanto* duties and rescues as supererogatory acts—but this clashes with rescue funding being obligatory in public systems.  
  - **Contractualism** (à la Scanlon) might permit QALY thresholds if no individual can reasonably reject them, while allowing rescues to avoid "intolerable" abandonment.  
  - **Capabilities approach** could interpret QALYs as approximating health capabilities, with rescues preserving the capability for "dignified survival."  
  All these theories can *license* the practice but disagree on whether rescues are morally required (deontology), admirable but optional (virtue ethics), or instrumentally useful (maintaining public trust in QALY systems).  

  ### 6. Harsanyi’s Theorem and the Exception  
  **(~200 words)**  
  Harsanyi’s theorem—assuming Pareto optimality, individual von Neumann-Morgenstern rationality, and impartiality—implies that social welfare *must* be a linear sum of individual utilities. The rule-of-rescue exception violates this:  
  - **Anti-aggregation**: Saving one identifiable life over many statistical lives contradicts additive utility maximization.  
  - **Violation of Pareto**: If rescuing Patient A (costing $1M/QALY) over funding Treatment B (saving 10 lives at $10,000/QALY), society prefers an outcome some individuals (the 10) would rationally reject.  
  - **Rejection of impartiality**: Identifiability injects bias toward specific individuals, breaching anonymity.  
  Harsanyi would deem the exception irrational unless utilities incorporate *relational* or *symbolic* dimensions (e.g., "utility from knowing society rescues individuals"). But this stretches utility beyond health outcomes, undermining QALYs’ coherence.  

  ### 7. Verdict: Defensible Pluralism with Inconsistent Foundations  
  **(~250 words)**  
  The practice is **incoherent within a monistic moral framework** (e.g., pure utilitarianism or rigid deontology) but **defensible as pluralistic policymaking**. It fails Harsanyi’s test of rational consistency, yet succeeds in balancing competing moral intuitions essential for social legitimacy. My argument:  
  - **The core inconsistency**: QALY thresholds assume utilities are *comparable and additive*, while rescues treat some lives as *lexically superior* to aggregated gains. This is a fundamental contradiction; Harsanyi’s axioms *are* falsified for rescue scenarios.  
  - **Why it’s nonetheless defensible**: Societies are not idealized rational agents. The practice reflects deep human intuitions—agent-relative duties to the proximate, expressive resistance to "triage logic"—that cannot be erased without moral alienation. Sacrificing a *visible* person for statistical gains is politically and psychologically untenable, a lesson from Schelling’s work on the "identifiable victim effect."  
  - **The path to coherence**: Adopt a **two-tiered justificatory framework**:  
    (a) **Routine allocations**: Use QALYs under Harsanyi-like aggregation for efficiency.  
    (b) **Rescue exceptions**: Invoke Scanlonian contractualism—no one could reasonably reject a policy that saves them from abandonment when identifiable, *if* the cost doesn’t cripple the system.  
  - **The cost**: This demands transparency about thresholds (e.g., defining "rescue" as <1-year life expectancy + identifiability) and acknowledging that some lives *are* privileged—not due to intrinsic worth, but societal self-understanding. To abandon the rule of rescue would deny our relational nature; to abandon QALYs would doom populations to inefficiency. The tension is the price of moral complexity.  

  **In short**: The practice isn’t irrational—it’s *meta-rational*, acknowledging that no single theory can capture all we owe each other. But it must be constrained to avoid arbitrariness: limit exceptions to *genuine rescue scenarios* (imminent death, no alternatives), funded by dedicated budgets to avoid QALY erosion.
