  The user provided a list: ordinary decisions, distinguishing genuine cluelessness from mere ignorance, handling undefined expected value, avoiding two extremes (licensing anything or demanding the impossible), and not tying rightness to inaccessible facts. I need to recall how each of these fits into the literature. For example, Lenman and others talk about the distinction between cluelessness and ignorance, which is crucial. The undefined expected value issue ties into sequential choice problems or infinite ethics, like Bostrom's work. 

  Next, the user wants cases that motivate each requirement. I should think of concrete examples. For ordinary decisions, something like donating to charity versus keeping the money. For undefined EV, maybe a choice with infinite positive and negative outcomes, like the sphere of suffering example. The two flips into uselessness—how theories either become too permissive or too demanding—need clear examples, like consequentialism collapsing into anything goes versus strict maximization that's impossible.

  The user also asked which requirements are non-negotiable versus contested. The distinction between cluelessness and ignorance seems foundational, as per Lenman. But how to handle undefined EV is debated—some might ignore it, others see it as critical. I should note where philosophers agree or disagree. For instance, MacAskill's bounded approaches might accept ignoring the far future, while others argue it's essential to consider.

  Then, the requirement that does the most work in ruling out popular moves. The "no inaccessible facts" criterion seems strong here. If a theory depends on unknowable facts, it fails practical use. This would reject moves like "just maximize expected value" since we can't compute it, or "ignore the far future" because it arbitrarily truncates consequences.

  The user emphasized identifying conflicts between desiderata. For example, wanting ordinary decisions without pretending to estimate probabilities might clash with avoiding the "maximize what we can't see" flip. If a theory avoids fake probabilities, it might struggle to give concrete guidance, leading to the permissive flip. Similarly, handling undefined EV could conflict with practical verdicts, as infinite cases complicate decision-making.

  I also need to consider the user's deeper needs. They’re forming a reading group, so they want a balanced overview, not biased towards one camp. Highlighting contested areas is key. They might be looking for a framework that’s theoretically robust but applicable, avoiding overly abstract solutions. Their mention of British English is a minor note, but I’ll ensure the language fits.

  Finally, structuring the response: list each desideratum with motivation, necessity, conflicts, and the most pivotal one. Clarify settled vs. contested points. The "no inaccessible facts" requirement seems central for ruling out common approaches, so I’ll position that as doing heavy lifting. Conflicts like ordinary decisions vs. undefined EV handling need clear examples to show where theories might stumble.
answer: |-
  Here’s a structured specification of desiderata for a theory addressing "cluelessness" (the problem of unforeseeable, infinitely ramifying consequences), based on your list, refined for clarity and philosophical robustness. I’ve marked **non-negotiable** requirements (widely accepted as essential), **contested** ones (where camps diverge), and conflicts. British English throughout.

  ---

  ### **Desiderata for a Theory of Action Under Cluelessness**
  *(With motivating cases, necessity status, and conflicts)*

  1. **Ordinary Action Guidance**  
     - **Requirement**: Must yield practical verdicts for real-world decisions (e.g., donating £50, career choices, voting) **without requiring precise probability/utility estimates of distant effects**.  
     - **Motivating Case**: Choosing whether to donate to a malaria charity *now*; we need reasons to act, but we can’t model how it affects geopolitics in 2300.  
     - **Necessity**: **Non-negotiable** (theories failing this are inert).  
     - **Conflict Risk**: May clash with *Handling Undefined EV* (if ordinary acts have undefined long-term EV).

  2. **Distinguish Cluelessness from Mere Ignorance**  
     - **Requirement**: Must differentiate "unknowable-in-principle" consequences (e.g., butterfly effects) from "currently unknown but knowable" facts (e.g., tomorrow’s weather).  
     - **Motivating Case**: *Ignorance*: Not knowing if a bridge is safe (inspectable facts exist). *Cluelessness*: Not knowing if funding AI research prevents or causes existential risk (no accessible facts).  
     - **Necessity**: **Non-negotiable** (collapsing these undermines the problem’s uniqueness).  

  3. **Handle Undefined Expected Value (EV)**  
     - **Requirement**: Must address acts with *infinite or non-convergent* EV calculations (e.g., where good/bad branches sum to ∞ - ∞).  
     - **Motivating Case**: Creating a self-replicating AI that *might* eternally prevent suffering *or* eternally cause it—EV sums diverge.  
     - **Necessity**: **Contested**. Some (e.g., **Bostrom, Österheld**) deem it essential; others (e.g., **Lenman**) argue undefined EV is rare in practice.  

  4. **Avoid the Two Flips into Uselessness**:  
     - **Requirement A**: No "**Anything Goes**" (the theory must not justify *all* acts due to cluelessness).  
     - **Requirement B**: No "**Maximise the Unknowable**" (must not demand optimising undefined/unknowable quantities).  
     - **Motivating Cases**:  
       - *Anything Goes*: "Since I can’t prove donating *won’t* cause disaster, stealing is fine."  
       - *Maximise the Unknowable*: "Calculate the infinite EV of having a child."  
     - **Necessity**: **Non-negotiable** (failure here collapses normative theory).  

  5. **No Dependence on Inaccessible Facts**  
     - **Requirement**: An act’s permissibility must not turn on facts **no agent could reasonably access** at the time of acting.  
     - **Motivating Case**: Telling a 19th-century worker they were wrong to take a factory job because it contributed to climate change—despite no conceivable access to climate science.  
     - **Necessity**: **Widely accepted** (aligned with control conditions in moral responsibility).  

  ---

  ### **Key Conflicts Between Desiderata**  
  - **Ordinary Guidance vs. Handling Undefined EV**:  
    Theories resolving undefined EV (e.g., **hyperreal utilities** or **finitist approaches**) often become computationally intractable for daily decisions (*Maximise Unknowable* flip). Conversely, practical rules (e.g., "focus on short-term effects") may ignore undefined EV cases.  
    *Example*: A theory using "**bounded rationality**" (e.g., MacAskill) avoids undefined EV by truncating consequences—but risks *Anything Goes* if long-term effects are arbitrarily ignored.  

  - **Avoiding Maximise Unknowable vs. Distinguishing Cluelessness/Ignorance**:  
    Insisting on *actionable* distinctions may push theories toward overly coarse heuristics (e.g., "ignore effects beyond 100 years"), collapsing cluelessness into ignorance.  

  ---

  ### **The Most Pivotal Requirement**  
  **"Avoid Dependence on Inaccessible Facts"** does the heaviest lifting in ruling out popular moves:  
  - **Ruled Out Moves**:  
    - **"Just Maximise Expected Value"**: Requires probabilities/utilities we lack (violates *Avoid Maximise Unknowable* and *Inaccessible Facts*).  
    - **"Treat It as a Coin Flip"**: Fails *Ordinary Action Guidance* (we *do* have reasons to prefer some acts) and risks *Anything Goes*.  
    - **"Ignore the Far Future"**: Violates *Distinguish Cluelessness/Ignorance* (arbitrarily treats the far future as "ignorance" rather than cluelessness) and may fail *Handle Undefined EV* (if near-term effects are finite but long-term undefined).  
    - **"Do the Obvious Thing"**: Presumes short-term effects are reliably correlated with long-term value—untrue in cluelessness cases (e.g., the "obvious" act may trigger chaos theory).  

  ---

  ### **Settled vs. Contested in the Literature**  
  - **Settled**:  
    - Cluelessness is a *distinct problem* from ignorance (per **Lenman, Greaves**).  
    - Pure consequentialism *without modification* fails under cluelessness (leads to *Anything Goes* or *Maximise Unknowable*).  
  - **Contested**:  
    - **Can undefined EV be "tamed"?**  
      - *Yes*: Via causal finitism (e.g., **Pruss**), discount rates, or aggregation methods (controversial).  
      - *No*: Some argue we must abandon EV maximisation (e.g., **Monton**).  
    - **Can heuristics bypass cluelessness?**  
      - *Pro*: "**Myopic**" rules (e.g., focus on short-term) or **deontological constraints** (e.g., **Jackson/Smith**).  
      - *Con*: Heuristics ignore cluelessness’s depth; constraints may be arbitrary (**Greaves 2016**).  
    - **Does cluelessness demand non-consequentialism?**  
      - *Yes*: If consequentialism requires knowable EV (**Lenman**).  
      - *No*: Rule-consequentialism or "**cluelessness-robust**" extensions may work (**MacAskill, Ord**).  

  ---

  ### **Summary**  
  An adequate theory **must** guide ordinary actions, distinguish cluelessness from ignorance, avoid licensing anything or demanding the impossible, and exclude inaccessible facts. The sharpest conflict is between practicality and rigorous handling of undefined EV. The "no inaccessible facts" rule is the workhorse for blocking unworkable solutions. Current debates centre on whether to reform or abandon consequentialism and how (or if) to bound rationality.  

  Would you like key readings per camp?
