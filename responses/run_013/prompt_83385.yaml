  }

  Now, let's assign origin:

  Claim 1: Outcome supervision description -> standard.
  Claim 2: Claim about outcome supervision leading to wrong reasons -> standard concern in the field, but the specific deployment issue is widely discussed.
  Claim 3: Process supervision description -> standard.
  Claim 4: That process supervision is the "real solution" -> this is the blogger's take (normative) and not a consensus.
  Claim 5: Labs are cutting corners -> blogger's coinage (normative judgment).
  Claim 6: The limit about open-ended tasks -> standard.
  Claim 7: Policy definitions -> standard in policy circles.
