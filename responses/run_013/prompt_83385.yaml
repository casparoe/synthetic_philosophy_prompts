  Note: We are to keep rows to the claims that carry weight. We have 8 claims.

  We'll write the rows in the order they appear.

  Also, in each row, we should note if it's standard or the blogger's coinage. We can add a field for that? But the user didn't specify. The instructions say: "in each row, say whether the point is standard stuff in the field or the blogger's own coinage". So we'll add a field called "origin": "standard" | "blogger's coinage".

