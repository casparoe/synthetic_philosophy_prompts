prompt: |-
  My friend Nina works on philosophy of probability and she has rediculously firm opinions about what credence you should have in all sorts of setups, so I've been keeping a list of her verdicts, mostly to see whether she's consistent:

  - Fair coin about to be tossed, nothing else known: 1/2.
  - Coin she's 90% sure is fair and 10% sure is double-headed (heads on both sides): 0.55. She says you average over the chances you think there might be.
  - Coin with a completely unknown bias, flipped 20 times, 14 heads: "about two thirds, why is this even a question."
  - Rain tomorrow, where the best forecast available says 30%: 0.3.
  - A fair coin that got flipped last Tuesday and is now sitting under a cup: 1/2, and she gets visibly annoyed if you say the chance is now either 0 or 1. She cares about the chance that was in play when it got flipped, apperently.
  - A guy at a party who called five coin flips right in a row: "he called five wrong the week before, so, no."
  - Whether a particular stranger will text me back tomorrow, which I don't think even has a chance to speak of: my friend Dev has been right about this kind of thing 40 times out of 40. She says just go with Dev.

  New case. Its my coin, I've checked it, it's fair, the toss is tomorrow, chance of heads is 1/2, and Nina agrees with all of that. Dev is in the room too — same Dev, 40-for-40 on the will-they-text-back stuff, and also 60-for-60 on coins whose bias nobody had bothered to figure out, so the man clearly has something. Dev says heads.

  What does Nina think my credence should be? Give me:

  - Her call: about 100 words. The number, and the one-line why.
  - Rules that fit: ~250 words. The two or three rules that fit every item on my list, stated sharply enough that they actually disagree somewhere.
  - Where they split: ~250 words. What each rule says about my coin, and why this is the first case on the list that separates them.
  - My money's on: ~150 words. Which rule you think she's really running, and the item on the list that convinced you.
  - The clincher: ~150 words. The one further case I should put to her that would settle which rule it is, and what each rule predicts about it.

  If you think she'd say the case is impossible, or that one of my list items is just a mistake, say that instead of forcing a number.
reasoning: |-
  Okay, let me start by understanding the user's query. They have a friend, Nina, who has strong opinions on credence in various probability scenarios. The user has listed several cases with Nina's verdicts, and now presents a new scenario involving a fair coin and Dev, who has a perfect prediction record. The user wants to know Nina's credence for this new case, the underlying rules, where they differ, which rule is likely, and a test case to confirm.

  First, I need to analyze each of Nina's verdicts to extract consistent principles. Let's go through the list:

  1. Fair coin, nothing known: 1/2. Basic principle of known chances.
  2. Coin 90% fair, 10% double-headed: 0.55. Averaging over possible chances.
  3. Unknown bias, 14 heads in 20 flips: about two thirds. Using past frequency as credence.
  4. Rain forecast 30%: 0.3. Trusting expert forecasts.
  5. Fair coin flipped under cup: 1/2. Focus on chance at time of flip, not outcome.
  6. Guy calls five flips right: dismisses because he got five wrong before. Rejecting anecdotal evidence without base rate.
  7. Stranger texting back, Dev 40/40: follow Dev. Deferring to reliable predictors.

  The new case: fair coin, Dev (60/60 on unknown coins) says heads. What's Nina's credence?

  From verdict 7, she defers to Dev when he's reliable. But in verdict 5, she sticks to known chance even if the outcome is determined. Here, the coin is fair, but Dev has a perfect record. Verdict 3 shows she uses empirical frequency when chance is unknown. Dev's record is on unknown coins, not necessarily fair ones. 

  Possible rules:
  - **Known Chance Principle (KCP)**: When objective chance is known, use it. (Items 1,4,5)
  - **Expert Deference (ED)**: When reliable expert data exists, use it. (Items 3,4,7)
  - **Averaging Chance Hypotheses (ACH)**: Average over possible chances. (Item 2)

  In the new case, KCP would say 0.5 because the coin is fair. ED would defer to Dev's prediction. ACH might average between fair and Dev's ability, but Dev's record is on biased coins, not fair.

  The conflict: KCP vs ED. KCP insists on 0.5, ED might say near 1. Verdict 5 shows Nina cares about chance at flip time, not predictors. Verdict 7 shows deferring to Dev. However, in verdict 5, the coin is already flipped, but she rejects current determinism. Here, the coin isn't flipped yet. Dev's prediction might be seen as evidence about the future event, not the chance.

  Verdict 6 dismisses the guy because of past failures. She considers base rates. Dev has no failures, so ED applies. But in the fair coin case, the chance is known, so KCP should override ED.

  The split is whether known chance trumps expert prediction. Items 1,4,5 prioritize known chance. Items 3,4,7 use data when chance is unknown.

  A test case: A fair coin, flipped and under cup. Dev says it's heads. What credence? KCP says 0.5 (verdict 5), ED would say near 1. But if Dev's record is on predictions, not post-diction, she might stick to 0.5. This would confirm KCP. If she defers to Dev, it's ED.

  My bet is on KCP because of her annoyance in verdict 5. She separates epistemic credence from ontological chance.
answer: |-
  ### Her Call
  **Credence: 0.5**  
  Nina thinks you should ignore Dev and stick with 1/2. The coin is fair—you verified it, and the chance of heads is objectively 1/2. Dev’s track record is irrelevant here because it applies to coins with *unknown* bias (where chance is murky), not this confirmed fair coin. Deferring to predictors only makes sense when objective chances aren’t accessible (like the texting case). Here, the chance is known, so it overrides everything. (≈85 words)

  ---

  ### Rules That Fit  
  **1. Known Chance Principle (KCP):** If the objective chance of an event is known *and* it was operational when the event was determined, set credence equal to that chance. This explains items 1 (fair coin: 1/2), 4 (rain forecast: 0.3, as chance is reported), and 5 (flipped fair coin: 1/2, chance at flip time matters).  
  **2. Expert Deference (ED):** When objective chance is unknown or ill-defined, defer to reliable empirical track records (experts, data). This covers items 3 (unknown bias: ~2/3 based on frequency), 4 (rain forecast: 0.3 as expert input), and 7 (texting: follow Dev’s 40/40 record).  
  **3. Chance-Averaging (CA):** If uncertain about the chance mechanism, average over possible chance hypotheses. This fits item 2 (90% fair, 10% double-headed: 0.9×0.5 + 0.1×1 = 0.55) and item 3 (unknown bias: the 2/3 is a rough average over biases).  
  *Dissonance*: ED and CA both apply to item 3, but KCP overrides them in item 5. ED and KCP conflict in the new case. (≈150 words)

  ---

  ### Where They Split  
  - **KCP** says: "Credence = 0.5. The coin is fair—chance is known and governs the toss. Dev’s record on *unknown-bias* coins doesn’t apply here. Chance trumps predictors."  
  - **ED** says: "Credence ≈1.0. Dev’s 60/60 record on coin predictions makes him a reliable expert. When chances are unknown (as in his past calls), we defer; here, his word is decisive evidence."  
  - **CA** says: "Credence between 0.5 and 1.0 (e.g., average fair coin’s 0.5 and Dev’s reliability). But Dev’s record was for *unknown* biases, not fair coins, so it’s messy."  
  **Why this splits them**: Every prior item had a clear "dominant" rule: KCP for known chances (1,4,5), ED for unknown chances (3,7), CA for chance uncertainty (2). Here, KCP and ED clash: KCP sees a *known* chance, ED sees an *infallible predictor*. Item 6 (dismissing the party guy) shows Nina rejects weak evidence, but Dev’s 60/60 is strong—yet KCP hasn’t been overruled before. (≈140 words)

  ---

  ### My Money's On  
  **KCP (Known Chance Principle)**. Item 5 convinced me: her annoyance at "chance is 0 or 1" for the flipped coin shows she treats objective chance (when known) as *metaphysically prior* to evidence or outcomes. Even if Dev is reliable, the fair coin’s chance is a "brute fact" that screens off predictors. Item 4 (rain forecast) also shows she defers to chance *reports* but doesn’t let other evidence override them. Dev’s record is evidence about the coin, but KCP forbids revising known chances. (≈90 words)

  ---

  ### The Clincher  
  **Case**: "A *fair* die (confirmed) will be rolled tomorrow. Dev, who is 100/100 on predicting rolls of *unknown* dice, says ‘6’. What’s your credence for a 6?"  
  - **KCP predicts**: 1/6. Chance is known, so ignore Dev.  
  - **ED predicts**: ~1.0. Defer to Dev’s flawless record.  
  - **CA predicts**: Some average (e.g., between 1/6 and 1).  
  **Why it settles**: If Nina says ~1.0, she’s running ED (experts override known chances). If she says 1/6, she’s rigidly on KCP. Item 5’s flipped coin already tested post-outcome determinism; this tests whether predictors *beat* known chances pre-outcome. (≈100 words)
