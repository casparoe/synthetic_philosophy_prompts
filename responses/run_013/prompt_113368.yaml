  3. A Rortian debating a realist about "accurate" maps, then using a uselessly precise map ironically—exposing how "correspondence" is empty without pragmatism.  

  The funeral joke wins. It’s tighter, turns on the ironist’s commitment to contingency amid vulnerability, and mocks the urge to seek "reality-right" solace. Plus, "shoveling snow" is a very Rortian punchline—practical, undramatic, anti-metaphysical.  

  Punchline premise: The ironist treats her final vocabulary as a tool for coping (here, grieving), rejecting demands for transcendent justification even when offered metaphysical comfort.
