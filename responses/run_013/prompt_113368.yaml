  **Selected Joke (Based on Candidate C - Sharpest Philosophical Turn):**

  The Ironist finds her friend weeping after a breakup.  
  Friend: "He was my *soulmate*! It was... *true love*!"  
  Ironist (putting an arm around her): "I know. 'Soulmate' is the word that holds your world together right now. It's the truest tool you've got."  
  Friend (sniffling): "But... is it *really* true?"  
  Ironist (handing her a tissue): "Honey, does it help you breathe? Then stop asking it to do metaphysics and pass the ice cream."  

