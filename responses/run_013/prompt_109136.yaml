prompt: |-
  I am in the upper sixth and have been asked to write a paper for my school's philosophy society on advance directives, the documents by which a person sets out in advance what medical treatment they would or would not accept should they later lose the capacity to decide for themselves. I have arrived at a position of my own and would like you to work out what it actually commits me to, rather than to rehearse the standard arguments for and against such documents.

  The position is this. An advance directive binds not because it is a good prediction of what the person will later want, and not merely because honouring it serves their interests, but because the earlier self has standing authority to determine what is done to the body and life that will belong to the later self, and that authority does not lapse merely because the later self can no longer exercise it. On this view the later self's apparent contentment is not in itself a reason to set the directive aside, since the later self has no standing to revoke what the earlier self settled; the force of the document comes from who wrote it, not from how accurate it turns out to be. I would add two refinements of my own: that the authority belongs to the most recent competent self, so a directive made later, while the author is still competent, simply displaces an earlier one; and that the author may name a proxy to depart from the directive, but that in the absence of such a clause the proxy has no discretion whatever.

  Please set out the most important implications of this position, ordered by how much practical difference they make, and be as concrete as you can about what would change at a hospital bedside, in a family argument, and in how such documents ought to be drafted. I am particularly interested in the following, though I would rather you told me what I have missed than answered only these:

  1. A directive that refuses the very treatment which would restore the author's capacity to decide. If the directive is honoured, the later self never recovers the standing to revoke it; if it is not, the earlier self's authority turns out to be conditional on something the earlier self rejected.
  2. Someone who signed at thirty and, by the time they lost capacity, had adopted a different faith or abandoned the values they once held. How much does my view have to say about whether such a change matters?
  3. Circumstances the author never anticipated. If the directive's force comes from authority rather than accuracy, does it bind where the author never considered the case, and if so, what is left of the idea that it expresses their will?
  4. Whether my view implies that I am now, at seventeen, able to bind myself at forty, and if so whether that is a consequence I should accept or a reductio.
  5. What it implies for drafting: sunset clauses, mandatory reconfirmation, and clauses authorising a proxy to depart from the document.
  6. What it implies for the standing of the later self more generally. Does the later self become a mere instrument of the earlier one, and is that a cost the position can pay?

  Our library is thin and I have no wish for a reading list; I would rather have the reasoning, with each implication spelled out far enough that I can see what it costs me to hold the view.
reasoning: |-
  Hmm, the user is an upper sixth student writing a philosophy paper on advance directives. They have a specific position, which is that an advance directive binds because the earlier self has authority over the later self's body and life, even if the later self has different preferences or seems content. The user wants me to explore the implications of this view, especially in practical situations like hospitals or family disputes.

  The user has outlined their position clearly. The core idea is that the earlier competent self has standing authority, and this authority doesn't lapse just because the later self can't exercise it. They've added two refinements: the most recent competent self's directive takes precedence, and proxies have no discretion unless explicitly authorized.

  I need to work through the implications they've listed and any others I can think of. The user specifically mentioned six points, but they want me to focus on what they might have missed rather than just answering those. So I should be thorough in covering all angles.

  Starting with the implications in order of practical impact. The most significant would be in life-or-death medical decisions. For example, refusing life-saving treatment that could restore capacity. If the directive says no to antibiotics for an infection that's causing incapacity, honoring it means the person dies without regaining decision-making ability. Not honoring it overrides the earlier self's authority. This creates a paradox where the earlier self's authority is conditional on not recovering, which contradicts the view that authority is absolute. The practical effect is that doctors must follow the directive strictly, even if it leads to death, and families can't intervene.

  Next, changes in values or faith over time. Since the view prioritizes the last competent self, if someone signed a directive at thirty but changed beliefs before losing capacity, the later directive would override. But if they didn't update it, the old directive stands, even if it conflicts with their recent values. This could lead to honoring wishes that no longer reflect who they became. In a hospital, this might mean enforcing a refusal of treatment based on outdated beliefs, causing family distress as they argue it's not what the person would want now.

  Unanticipated circumstances are tricky. If authority is key, not accuracy, the directive binds even in situations the author didn't foresee. This could lead to applying directives in ways that don't make sense medically, like refusing a new, effective treatment because the directive broadly rejects interventions. Doctors might have to follow it literally, potentially harming the patient, and proxies can't interpret or adjust. This undermines the idea of expressing will since the will wasn't informed.

  The age question about binding at seventeen for forty is a reductio. If authority is based on competence, not age, legally minors might not be seen as competent, but philosophically, the view might allow it. This could lead to young people making binding decisions that don't consider future maturity, which seems problematic. It might force accepting that a competent seventeen-year-old can dictate future care, which could be seen as absurd if their preferences change drastically.

  For drafting implications, the position discourages sunset clauses or mandatory reconfirmation since the directive stands until revoked by a competent self. Proxies have no power unless explicitly granted, so the document must be very detailed to cover scenarios, or else it risks being rigid. Drafters would need to specify proxy discretion clearly if wanted, otherwise it's absolute.

  The later self's standing is diminished to an instrument of the earlier one. This is a major cost. The later self's happiness or new preferences don't matter, reducing them to a vessel for past decisions. In cases like dementia, where the person is content but the directive refuses care, enforcing it could cause suffering, making it seem cruel. Ethically, this challenges the value of present autonomy and well-being.

  Other implications: Conflicts of interest aren't addressed. If the earlier self's decision is harmful now, but authority overrides, it could lead to unnecessary suffering. Psychologically, people might regret directives but can't change them once incompetent. Legally, this view could clash with laws that consider current interests, leading to disputes. Emotionally, families might struggle enforcing directives against a loved one's current contentment.

  Prioritizing practical impact: Life-saving treatment refusals top the list, as they're immediate and irreversible. Then unanticipated circumstances, as they're common and can force inappropriate care. Value changes follow, affecting many as people evolve. The later self's standing is a profound ethical cost. Age binding is more theoretical but highlights potential absurdity. Drafting changes are procedural but important for implementation.

  The user might not have considered how this view handles mistakes in directives. If someone misunderstood options when writing it, the authority still binds, possibly leading to outcomes they wouldn't have wanted if better informed. Also, mental illness at the time of drafting: if competent but influenced by depression, the directive might refuse care irrationally, yet must be followed.

  In summary, the biggest implications are strict adherence in medical decisions regardless of outcomes, overriding current preferences, and handling unforeseen cases rigidly. The cost is sacrificing the later self's well-being and autonomy for the principle of precedent authority. The user needs to weigh if this absolutism is defensible against real-world complexities and ethical concerns for the present individual.
answer: |-
  Your position—that advance directives derive binding force from the prior competent self's *authority* over the future self's body/life, not from predictive accuracy or current interests—has profound and often stark practical implications. Here are the most significant consequences, ordered by practical impact at the bedside, with concrete examples:

  ### 1. **Refusal of Capacity-Restoring Treatment (Your Point #1)**
     * **Implication:** The directive *must* be followed, even if it refuses treatment (e.g., antibiotics for a reversible infection causing delirium) that would allow the patient to regain capacity and potentially revoke the directive.
     * **Bedside Change:** Doctors *cannot* administer the treatment, even if it's simple, effective, and the current incapacitated patient seems distressed by symptoms or passively accepting of care. Recovery is deliberately prevented.
     * **Family Argument:** Family pleading ("Just give the antibiotics so Dad can decide for himself!") is irrelevant. The hospital ethics committee must uphold the directive, overriding family wishes and the *potential* future self's interests.
     * **Drafting Change:** Authors must confront this paradox explicitly. A clause like "even if refusal prevents me from regaining capacity to change this decision" reinforces the position but highlights its severity. *Failure* to include this weakens the directive under your view.
     * **Cost:** This is the "nuclear option" of your position. It explicitly sacrifices the *possibility* of the future self's restored autonomy and life to uphold the prior self's authority. It risks appearing cruel or irrational to observers.

  ### 2. **Strict Adherence in Unanticipated Circumstances (Your Point #3)**
     * **Implication:** The directive binds *even if* the medical situation is radically unforeseen (e.g., directive refuses "life support if in a persistent vegetative state," but patient is minimally conscious and content; or a new, highly effective, minimally burdensome treatment exists for the condition).
     * **Bedside Change:** Doctors must interpret the directive *literally* based on its wording, not its presumed "spirit" or what the author *might* have wanted in this new scenario. If the directive says "no ventilators" and an unforeseen complication requires brief ventilation for a reversible issue, it must be withheld. Comfort care only applies.
     * **Family Argument:** Families cannot argue "she never imagined this!" or "this treatment changes everything!" unless the directive explicitly grants discretion for unforeseen events (which your view discourages). Disputes shift to legalistic parsing of the document's wording.
     * **Drafting Change:** Authors must draft with extreme breadth and specificity (e.g., "refuse *all* life-sustaining treatment *regardless* of future medical advances, changed prognosis, or unforeseen circumstances"). Generic phrases like "if no reasonable hope of recovery" become highly risky as they invite interpretation.
     * **Cost:** The directive can mandate actions arguably contrary to the author's *actual will* (since will requires contemplation) and potentially against their objective interests, purely on formal authority grounds. This divorces "will" from intention and context.

  ### 3. **Irrelevance of Subsequent Value Changes (Your Point #2)**
     * **Implication:** A change in faith, values, or preferences *after* signing but *before* losing capacity **only matters if a new directive is made while competent.** An old directive reflecting abandoned values (e.g., a 30-year-old atheist's refusal of blood, who later became a devout Jehovah's Witness but never updated the directive) *must* be followed.
     * **Bedside Change:** Doctors must enforce the refusal of blood based on the old directive, even if family insists the patient actively practiced the faith requiring acceptance and would have wanted transfusion.
     * **Family Argument:** Families cannot invoke the patient's *recently* expressed values to override the document. Arguments become about *when* the patient was last competent and whether they *formally revoked* the directive. "He told me last year he regretted signing it" is inadmissible.
     * **Drafting Change:** Strong incentive for regular reviews/updates. However, *your view itself* doesn't require this; it relies on the author's diligence. A clause like "this directive reflects my current values and supersedes all prior" helps but doesn't solve the problem of later unrecorded changes.
     * **Cost:** Enforces the "ghost" of a past self over the known, recently competent self's evolved identity. This feels like betraying the person they *became*.

  ### 4. **Absolute Proxy Restriction (Your Refinement #2)**
     * **Implication:** Unless explicitly named *and* granted specific departure authority in the directive, a proxy (e.g., family member, healthcare attorney) has **zero discretion**. They are mere messengers of the document, not decision-makers.
     * **Bedside Change:** The proxy cannot consent to treatment refused by the directive, even if they believe it's minor, beneficial, or what the patient *now* seems to want. They also cannot override demands for potentially burdensome treatment *requested* by the directive.
     * **Family Argument:** Removes common ground for negotiation. The proxy's role is purely administrative. Family conflict focuses on whether the proxy is correctly enforcing the document, not on interpreting best interests. If the proxy *wants* to deviate, they face legal action.
     * **Drafting Change:** Must be crystal clear: "My proxy has authority ONLY to ensure compliance with this directive. They have NO authority to interpret, modify, or override its instructions based on circumstances, my current state, or their own judgment." Granting discretion requires explicit, carefully bounded language ("may depart only if...").
     * **Cost:** Creates rigidity and removes a crucial safety valve for nuance and compassion in unforeseen or borderline situations. Can force proxies into morally distressing roles as enforcers of potentially harmful or outdated instructions.

  ### 5. **The Later Self as Non-Agent (Your Point #6)**
     * **Implication:** The later self has **no moral standing to revoke or modify** the directive. Their contentment, distress, or changed preferences are irrelevant to the decision. They are the object of the prior self's authority.
     * **Bedside Change:** A patient with dementia who smiles, enjoys simple pleasures, but whose directive refuses antibiotics for pneumonia *must* be denied treatment. Staff must ignore the current self's apparent will to live and provide only comfort care. Conversely, a directive demanding aggressive treatment for an utterly futile condition must be followed, even if the patient appears to suffer from it.
     * **Family Argument:** Families cannot use the patient's current state ("Look, she's happy!") or perceived resistance to care as an argument. The focus is solely on the document and the prior self.
     * **Cost:** This is the core philosophical cost. It fundamentally subordinates the existence and experience of the current incapacitated person to the prior competent person. It treats the later self as a vessel or property of the earlier self, denying their present reality any intrinsic moral weight in the decision. This risks instrumentalization and can feel deeply dehumanizing.

  ### 6. **Binding the Distant Future Self (Your Point #4)**
     * **Implication:** **Yes, a competent 17-year-old *can* bind their 40-year-old self** under your view. Competence, not age or temporal proximity, confers authority.
     * **Bedside Change (Hypothetical):** A directive signed at 17 refusing dialysis ever (perhaps influenced by a temporary ideology) *must* be followed if kidney failure occurs at 40, even if the 40-year-old, before losing capacity, lived a life utterly inconsistent with that refusal and never signed a new directive.
     * **Family Argument:** Families argue the document is an adolescent relic. Hospital argues competence at signing is the only relevant factor under your authority model.
     * **Drafting Change:** Strong societal pressure (or legal restriction) against minors making binding ADs would likely arise. Adults drafting would be advised to include temporal limitations ("expires 10 years from signing" - but see below) or mandatory reconfirmation clauses.
     * **Cost/Reductio?** This *is* a logical consequence. Whether it's a reductio depends on your view of competence and personal identity over time. It highlights the potential for decisions made without sufficient life experience or stability to bind a vastly different future person. Accepting this consequence requires believing that *any* competent self, regardless of age or stage, has absolute authority over *all* future selves.

  ### Implications for Drafting Mechanics (Your Point #5)
  *   **Sunset Clauses/Mandatory Reconfirmation:** **Contradict your core principle.** If authority lapses after X years or requires reconfirmation, then it *is* conditional on temporal proximity or renewed expression, not solely on being the last competent self. Your view implies such clauses are optional additions *chosen* by the author, not inherent limitations. A directive without them binds indefinitely.
  *   **Proxy Departure Clauses:** Must be **explicitly and narrowly defined** if permitted at all ("My proxy may authorize treatment I refused ONLY if a wholly unforeseen and reversible condition arises where the treatment is minimally burdensome and offers near-certain restoration of my capacity"). Absent this clause, the default is *zero* discretion.
  *   **General Drafting Imperative:** Documents must be **hyper-specific, exhaustive, and legally airtight.** Broad principles ("no heroic measures") are dangerous under your view, as they require interpretation. Focus shifts to listing precise treatments (e.g., "refuse intubation, mechanical ventilation, dialysis, blood transfusion, antibiotics for life-threatening infection, artificial nutrition/hydration") and scenarios ("if diagnosed with irreversible severe dementia," "if in a coma with <1% chance of meaningful recovery"). Drafting becomes highly technical and legally focused.

  ### What You Might Have Missed: Further Implications

  1.  **Conflict of Interest of the Prior Self:** What if the prior self's decision seems influenced by depression, misinformation, or a desire not to burden others? Your view prioritizes authority *even if* the decision is arguably against the prior self's *own* considered interests at the time. The "standing authority" overrides substantive critique of the decision itself.
  2.  **Treatment Requests vs. Refusals:** Your logic equally applies to directives *demanding* potentially futile, burdensome, or non-beneficial treatment. If the prior self demanded "everything done," doctors might be forced to provide aggressive interventions against current medical judgment and the later self's apparent suffering. Authority cuts both ways.
  3.  **Mental Illness and Competence at Signing:** Your view hinges entirely on *competence at the time of signing*. A directive signed during a manic episode or untreated depression, if deemed competent by the *legal* standard at the time, must be followed, regardless of its irrationality. Challenging it requires challenging the competence assessment retroactively.
  4.  **Resource Allocation (Indirectly):** Strict adherence, especially to requests for prolonged futile treatment or refusal of simple interventions leading to complex avoidable complications, could increase healthcare resource consumption in some cases, raising broader ethical questions.
  5.  **The "Moment" of Losing Competence:** Disputes about *exactly when* competence was lost become critical. Was a later, ambiguous expression a valid revocation or modification, or was it made after competence lapsed? Your view intensifies the significance of pinpointing this moment.

  ### In Summary: The Cost of the View
  Your position offers powerful clarity and upholds the primacy of precedent autonomy absolutely. However, the cost is high:

  *   **Rigidity:** Forces adherence to directives in unanticipated, changed, or arguably mistaken scenarios.
  *   **Potential for Harm:** Mandates actions (denying reversible treatment, enforcing burdensome demands) that objectively harm the current individual.
  *   **Suppression of the Current Self:** Denies the moral significance of the later self's existence, experience, and potential for contentment.
  *   **Burden of Perfection:** Places immense pressure on the author to draft a flawless, exhaustive document anticipating decades of medical uncertainty.
  *   **Potential for Injustice:** Risks enforcing outdated, ill-considered, or radically youthful decisions on a vastly different future person.

  To hold this view consistently, you must accept that the principle of the prior self's sovereign authority over their future existence outweighs all these costs, even when the consequences appear harsh, irrational, or disrespectful to the person lying in the hospital bed. The practical difference is a shift from flexible, interest-based interpretation towards strict, literal, authority-based enforcement, profoundly altering dynamics at the bedside, within families, and in the drafting room.
