answer: |-
  ### The principle in my terms
  In statistical decision theory, the precautionary principle redefines the default hypothesis and error asymmetry. Assign:
  - **H₀**: The activity causes serious/irreversible harm (traditionally H₀ is "no harm," but here it flips).
  - **H₁**: The activity is acceptably safe.
  - **Type I Error (α)**: Falsely rejecting H₀ → blocking a safe activity → opportunity cost.
  - **Type II Error (β)**: Falsely accepting H₀ → approving a harmful activity → catastrophic loss.

  The principle imposes extreme asymmetry: **L(Type II) >> L(Type I)** in the loss function. Irreversible harm implies L(Type II) → ∞, making β reduction paramount. "Lack of full certainty" means rejecting classical p-value thresholds; action triggers when P(H₀) > 0 *even with weak evidence*. "Burden of demonstrating safety" requires proponents to supply data achieving high **power (1-β)** *under conservative harm estimates* before approval. "Postponement" is rejected unless **Expected Value of Perfect Information (EVPI)** is negative—i.e., delay never outweighs prevention cost when L(Type II) is unbounded. Sequential stopping rules favor early termination for harm signals.

  ---

  ### What maps cleanly
  1. **Loss Function Asymmetry**: Direct counterpart to weighted error costs. Commits to prioritizing catastrophic risk avoidance.  
  2. **Power Requirement**: "Burden of proof" maps to demanding high 1-β *before* approving H₁. Commits to proof-of-safety standards akin to drug trials.  
  3. **Prior Sensitivity**: "Threatens harm" implies skewed priors; P(H₀) starts non-negligible. Commits to Bayesian updating with pessimistic initial beliefs.  
  4. **EVPI & Delay Cost**: "Not a reason to postpone" maps to EVPI < prevention cost when harm is irreversible. Commits to acting unless new data *guarantees* net benefit.  
  5. **Sequential Analysis**: Harm monitoring aligns with stopping rules for futility/harm. Commits to continuous reassessment.  

  These mappings enforce conservatism: high power targets, skewed loss functions, and action-triggering under ambiguity become procedural obligations.

  ---

  ### What maps only with distortion  
  - **"Serious/irreversible harm"**: Statistically, we assign high L(Type II), but this *assumes* harm is quantifiable and monetizable. In reality, "irreversible" may defy numerical loss capture (e.g., extinction), forcing arbitrary ∞ valuations.  
  - **"Lack of full certainty"**: Maps to rejecting statistical significance (α=0.05) as sufficient, but doesn't specify *how much* evidence is needed *for inaction*. This fudges the decision threshold, implying "any non-zero P(H₀) justifies blocking," which isn't operational.  
  - **Burden shift as prior selection**: Framing proponents proving safety ≈ setting H₀: "harm exists." But this confounds *epistemic responsibility* (who collects data) with *normative priors* (initial skepticism).  

  Distortion arises from forcing qualitative gravity ("irreversible") into quantitative loss, and vague "uncertainty" into a workable α.

  ---

  ### What does not survive  
  1. **Procedural Burden Allocation**: The principle *requires* proponents to fund safety proofs. Decision theory assigns losses but doesn’t dictate *who* runs experiments—that’s a legal/political add-on.  
  2. **Harm’s Inherent Moral Weight**: "Irreversible harm" carries ethical gravity (e.g., intergenerational equity) absent in L(Type II). Statistics treats all costs as commensurable; the principle does not.  
  3. **Threshold Ambiguity**: "Serious" harm has no statistical equivalent—it’s a societal calibration. We can set high L(Type II), but not derive it from first principles.  
  4. **Non-Probabilistic Certainty**: "Full scientific certainty" implies ontological limits (e.g., complex systems are unknowable), while statistics assumes uncertainty is quantifiable.  

  These reflect value judgments and institutional roles foreign to optimization frameworks.

  ---

  ### Residue report  
  The unmapped residue is **allocative and political**:  
  - **Burden assignment** dictates *who must justify themselves to whom*. Statistics quantifies risk trade-offs but doesn’t prescribe that industry, not regulators, bears proof costs. This is a governance choice.  
  - **"Irreversible"** encodes a non-negotiable preference for preserving natural systems—a gap where statistical loss functions fail to capture deontological constraints.  
  - **"Postponement" rejection** embodies impatience with sequential learning under existential risk; it overrides EVPI by asserting that prevention delay is *always* unethical when harm thresholds are breached.  

  This residue reveals the principle as a *socio-legal heuristic* for when society rejects probabilistic bargaining. It fills gaps where statistical frameworks avoid normative commitments about responsibility, rights, and the limits of quantification.
