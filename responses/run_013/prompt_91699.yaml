prompt: |-
  I'm a backend engineer on a team split across Amsterdam, London and Tokyo — a Dutch manager, several Japanese colleagues and me, British — so I spend a fair amount of my week deciding how blunt to be. I have no background in philosophy and nothing to look things up with, so please don't give me names, references or reading lists; I want the principle, if there is one, that fits the verdicts below.

  - My manager asks, in a review with the whole team present, whether I think her proposed re-architecture will hold up. I think it won't. I say so flatly, with the reason, and I am confident that is right.
  - A colleague in Tokyo asks me the same kind of question about his design document, in a meeting that includes his team and his manager. I say only that there are a couple of areas I would like to talk through with him afterwards. I am confident that is right too.
  - The same colleague asks me the same question on a call with just the two of us. Here I think I should say plainly that the document is not ready, and that the hedging which was right in the previous case would be wrong.
  - A colleague asks whether I thought his talk landed. It didn't, and he is giving it again to a customer next week. I say it went well. I think that was wrong and that I owed him the truth.
  - My aunt asks whether I enjoyed the meal she cooked. I didn't much. I say I did, and I feel entirely fine about it.
  - A friend sends me a short story she is about to send to an agent. I think it isn't good enough. I tell her it is strong and suggest two small cuts. I keep going back and forth on whether that was right.
  - A recruiter at another company asks whether I am happy where I am. I am not, and I am interviewing. I say I am happy. I think that is fine.
  - A colleague asks whether anyone else has raised concerns about his document. No one else has, but only because I haven't asked anyone. I say no one else has. I think that is wrong, though every word of it is true.

  The rule I have been running, roughly: how much accuracy I owe someone scales with what they are about to do with what I tell them. If they will act on it, they get the whole truth; if the only thing they can do with it is feel something, they get very little. Call it a truth budget. That seems to get the talk, the document and my aunt's cooking, but I cannot see how it gets the short story, it seems to license the recruiter lie for the wrong reason, and it says nothing about why my Tokyo colleague deserves a hedge in front of his team and plain speech on a private call.

  So: is there one principle that gets all eight, or two — a truth budget and something like a face budget — and what work is each clause doing? Apply the best version you can state to two cases I haven't given: a stranger on a forum asking whether his plan will work, and a close friend asking whether I think she was right to turn down a job offer six months ago, which she cannot undo. Tell me which of my verdicts the principle cannot accommodate, and which of them I should give up if it comes to that. Please also say what would change your mind — which case or argument would move you to a different principle, and where your reasoning is most likely to fail. Write the answer in British English.
reasoning: |-
  Okay, the user is a backend engineer working across multiple countries with cultural differences. They need a principle for how blunt to be in various situations. They've provided eight scenarios with their verdicts and a rough rule they call "truth budget." They want a unified principle that explains all cases without academic references.

  First, I need to understand their current rule: truth budget based on actionability. It works for some cases but fails for others. For example, in the short story scenario, they're conflicted because the friend can act on feedback, but they hedged. The recruiter lie feels right but for different reasons. Also, the Tokyo colleague needs different approaches in public vs private settings.

  Looking at the scenarios: 
  - Public criticism to Dutch manager: okay
  - Hedge with Japanese colleague in group: to save face?
  - Private call with same colleague: blunt honesty
  - Lying about a bad talk: feels wrong
  - White lie to aunt: fine
  - Hedge on friend's story: conflicted
  - Lie to recruiter: acceptable
  - Misleading about unasked concerns: feels wrong but technically true

  The key factors seem to be: actionability, relationship dynamics, cultural context (face-saving), and potential harm. The Tokyo cases highlight public vs private communication, which ties to face-saving in Japanese culture. The short story involves friendship vs professional stakes. The recruiter situation involves self-interest vs obligation.

  The principle should balance honesty with impact. Maybe "impact-adjusted truth" focusing on consequences and relationships. For the aunt, no harm in lying; for the talk, harm in withholding truth. The colleague's document in public vs private shows that public criticism could embarrass, while private allows directness. 

  The unasked concerns scenario is tricky. Technically true but misleading because the implication is that others reviewed it. So the principle needs to address implied truths and intentions. 

  For the additional cases: 
  - Stranger on forum: actionability suggests full honesty since they'll act on it. 
  - Friend's irreversible decision: truth might only affect feelings, so hedge unless they ask for brutal honesty. 

  The user might need to adjust their verdict on the short story. If the friend can improve the story, honesty is owed. Their current hedge might be insufficient. Also, the recruiter lie is justified by self-protection, not just actionability. 

  The core principle could be: "Minimise unnecessary harm through truth." But that needs expansion. Weighing potential harm vs benefit of truth. Including context like publicity and relationships. 

  Testing against all scenarios: 
  1. Manager: Benefit of truth (prevent failure) > harm (embarrassment). 
  2. Tokyo colleague in group: Harm to reputation > benefit, so hedge. 
  3. Private call: Harm minimal, benefit high, so honest. 
  4. Bad talk: Benefit high (improve), harm low (private), so should have been honest. 
  5. Aunt: Harm high (hurt feelings), benefit low (no action), lie okay. 
  6. Short story: Benefit high (can improve), harm medium (friend's feelings). But user hedged, so verdict might need changing to honesty. 
  7. Recruiter: Harm to self if honest, low benefit to recruiter, so lie acceptable. 
  8. Unasked concerns: Implied lie, harm to project, so wrong.

  The principle should have clauses: actionability, relationship, publicity, and consequences. For the short story, if the principle requires honesty due to actionability, the user should admit their verdict was wrong. For the recruiter, self-protection is valid. 

  The unified principle: "Assess if they can act on the information (actionability), potential harm to them or others, cultural/public context (face), and your obligations. Truth is owed when actionability and relationship depth outweigh harm and face concerns."

  Additional cases: 
  - Stranger: Actionable, no relationship, so honest. 
  - Friend's job decision: Low actionability, high harm potential, so hedge unless they request honesty.

  The user's verdict on the short story might conflict; the principle suggests honesty is better, so they should adjust. The recruiter fits under self-protection. 

  Weakness: Balancing factors can be subjective. If a case with high actionability but severe harm, might struggle. E.g., telling a friend their partner is cheating—actionable but high harm. Principle might fail there without clear hierarchy.
answer: |-
  Here's a unified principle distilled from your cases, designed to be practical and grounded in your verdicts. It avoids academic jargon and focuses on actionable guidance:

  ### The Principle: **Truth calibrated to agency and alliance**
  > "How much truth to give depends on **what they can do with it** (agency) and **how your relationship binds you** (alliance). Be direct when they can act *and* you're allied in that action; soften or withhold when agency is low or alliance requires protection."

  ### How it works across your cases:
  1. **Your Dutch manager's re-architecture**  
     Agency: *High* (she can act on feedback).  
     Alliance: *Strong* (shared goal of sound architecture).  
     → **Directness correct.** Truth serves the shared mission.

  2. **Tokyo colleague's design doc (group setting)**  
     Agency: *Theirs is high* (they can act), but *yours is constrained* (not your team).  
     Alliance: *Fragile* (public critique risks their standing with their manager/team).  
     → **Hedging correct.** Protects their agency in their own chain of command.

  3. **Same colleague (private call)**  
     Agency: *High* (they can act alone).  
     Alliance: *Strong* (1:1 trust, no audience).  
     → **Directness correct.** Private alliance enables full truth.

  4. **Colleague's talk that "didn't land"**  
     Agency: *High* (they can improve before next talk).  
     Alliance: *Strong* (colleague trust implies duty to help).  
     → **Your verdict: You were wrong.** Principle requires honesty here.

  5. **Your aunt's meal**  
     Agency: *Low* (she can’t "fix" the meal retroactively).  
     Alliance: *Personal* (priority is kindness over critique).  
     → **White lie correct.** No actionable gain, alliance demands care.

  6. **Friend's short story**  
     Agency: *High* (she can revise before submitting).  
     Alliance: *Mixed* (friendship vs. creative vulnerability).  
     → **Your hedge was wrong.** Principle demands constructive honesty. Suggesting cuts avoids brutality but truth is owed.

  7. **Recruiter's "are you happy?"**  
     Agency: *Theirs is tactical* (they’ll use it for recruitment).  
     Alliance: *None* (no shared interest; you’re protecting your position).  
     → **Lie acceptable.** Self-preservation overrides truth when no mutual alliance exists.

  8. **"Anyone else raised concerns?" (unasked)**  
     Agency: *Misleading* (implies others reviewed it).  
     Alliance: *Breached* (colleague assumes you’ve done due diligence).  
     → **Your verdict: Wrong.** Technically true but violates spirit of alliance. Should have said: "I haven’t asked others yet."

  ---

  ### Your "truth budget" refined:
  - **Agency clause**: *What can they **do**?*  
    (e.g., Aunt: nothing → lie ok; Talk: fix it → truth owed).  
  - **Alliance clause**: *Does your relationship **demand collaboration** or **permit self-interest**?*  
    (e.g., Recruiter: no alliance → lie ok; Colleague’s doc: team alliance → hedge publicly).

  ---

  ### New cases tested:
  - **Stranger on a forum asks if his plan will work**  
    Agency: *High* (he’ll act on advice).  
    Alliance: *None* (no relationship).  
    → **Direct honesty.** No alliance to protect, agency demands usable feedback.  
    *(e.g., "It won’t work because X – consider Y instead.")*

  - **Close friend asks if she was right to turn down a job**  
    Agency: *None* (decision is irreversible).  
    Alliance: *Deep* (friendship prioritises emotional support).  
    → **Soften or deflect.** Truth risks harm with no actionable gain.  
    *(e.g., "It’s done now – how are you feeling about it?" not "Yes/No.")*

  ---

  ### Where the principle struggles:
  1. **Your short story verdict conflict**:  
     - Principle says you *should* have been honest (high agency).  
     - You should **give up your original hedge**. Friendship doesn’t lower the bar – it raises the duty to help her avoid failure.  
     - *Refinement*: For creative work, add "Is critique requested?" If unsolicited, alliance may *reduce* truth owed (e.g., "It’s not my genre" → neutral hedge).

  2. **Recruiter justification**:  
     - Your "truth budget" licensed it for low actionability (wrong: they *can* act on it).  
     - **Agency + alliance fixes this**: No shared goal = self-interest permitted. Correct outcome, better reasoning.

  ---

  ### What would change my mind:
  - **If a high-agency + strong-alliance case demanded softening**: E.g., a terminally ill colleague asking if their project will succeed. Agency is high (they could delegate fixes), but alliance might demand compassion over bluntness.  
    → *Weakness*: The principle leans utilitarian. If emotional harm outweighs actionable gain, it may underweight "kindness as an alliance duty."  
  - **If a low-agency + weak-alliance case forbade lying**: E.g., a stranger asking if they look ill. No agency/trust, but medical truth might feel owed.  
    → *Failure point*: The principle prioritises function over ethics. If "truth as duty" matters more than outcomes, it needs adjustment.

  ### Final take:
  Your instincts are sharp. **Agency + alliance** explains all 8 cases (once you correct #4 and #6) and handles publicity (e.g., Tokyo colleague). It’s not perfect, but it’s robust for cross-cultural work. When stuck, ask:  
  *"Can they **use** this? And are we **truly on the same side** here?"*  
  That’ll cover 95% of scenarios without overthinking.
