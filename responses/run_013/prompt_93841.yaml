  Hmm, the core challenge is balancing honesty about historical interpretation with respect for both sides' lived experiences. The user's clearly done his homework - he's grappling with academic debates about historical objectivity but needs to translate that into something accessible for a mixed audience. His sister-in-law being a history professor adds a nice layer - she'll catch any oversimplifications.

