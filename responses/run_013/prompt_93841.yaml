  The mill owner vs worker dynamic reminds me of similar industrial histories. Truth is, both sides usually have legitimate grievances and neither are villains in their own narratives. The speech needs to hold that tension without resolution. 

  I'm thinking of structuring it: 1) Celebration of communal effort 2) Direct naming of the strike as the "difficult middle" 3) Explanation of why history requires shaping 4) Validation of all emotional legacies 5) Focus on shared present/future. 

  For the controversial line... probably something about "no villains, just human beings." It's necessary but will ruffle feathers - descendants of strikers might see owners as clear villains, owners might feel demonized. Yet leaving it out would dodge the core issue.

  The pub metaphor feels right - accessible, shows how perspectives shift over pints. Crucial to avoid academic terms like "hermeneutics" or "historiography." Must keep it postman-phrasing throughout: "we've wrestled with it" not "we've deconstructed the narrative."

  Ah, and the ending should point to physical artifacts - the mill wall photo, the union banner. Makes the history tactile for non-readers. Sister-in-law will appreciate that material culture nod while others connect emotionally.

  Better include that "living history" bit about names in the room - personalizes it. And the "not the last word" phrasing manages expectations gracefully. 

