  I'm putting together a two-page proposal for a small political-theory workshop and my half-formed idea is about Aquinas on killing tyrants. What bugs me is that he seems to permit killing a ruler who grabbed power illegitimately but not one who came to power legitimately and then governs badly, and I want to know whether that distinction is doing real work or just smuggling in a background judge. My angle: the account may tacitly assume some standing authority — the people, a superior lord, the church — that can actually declare a usurper a usurper, and once you strip that away (no court, no consensus, a ruler who took power through a formally legal process everyone knows was rigged, or a usurper who over the years becomes quietly accepted), the framework goes indeterminate, and I suspect that indeterminacy isn't a bug but reveals what he actually thinks legitimacy is. Turn this into the proposal: state the question so it has a determinate answer, say why the usual readings don't settle it, give me the method (what I'd actually do across six weeks), what a real result looks like versus what would just be me re-describing the texts, and where the scope could blow up. Also say honestly whether the answer could come out as the distinction doing no work at all, and whether that would count as a finding or a failure. I dont want any citations, I'll add those myself. Write it in continuous prose, no headings or bullet points or bold or tables, just the way I'd write it in an email.
