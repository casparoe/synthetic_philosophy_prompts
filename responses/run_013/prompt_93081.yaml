answer: |-
  Here’s a draft for your proposal, written as continuous prose:

  My proposal examines a tension in Aquinas’ treatment of tyrannicide. He explicitly permits killing a ruler who seized power illegitimately (a usurper) but forbids killing one who gained power legitimately but subsequently governs tyrannically. The core question I pursue is whether this distinction functionally *depends* on the existence of a recognized authority capable of authoritatively declaring a ruler a usurper in the first place. Does Aquinas’ framework collapse into indeterminacy without such a background ‘judge’—be it the people, a superior lord, the Church, or some other body—and if so, what does that reveal about his underlying conception of political legitimacy itself? The usual readings of Aquinas on tyranny tend to take the distinction between usurper and legitimate-but-tyrannical ruler at face value, focusing on his stated reasons (like the danger of vigilantism against legitimate rulers). However, they often fail to interrogate the practical preconditions for applying the distinction: *who* determines illegitimacy of acquisition, and *how*, especially in ambiguous cases? My suspicion is that these readings implicitly smuggle in an assumed, functioning authority to make that declaration. When that assumption is stripped away—in scenarios like a ruler gaining power through a formally legal but rigged process, a usurper whose control becomes tacitly accepted over time, or a situation lacking any clear superior judge or consensus—the framework struggles to provide clear guidance. This indeterminacy isn’t necessarily a flaw; I argue it potentially exposes that legitimacy, for Aquinas, is not merely a property of origins or deeds alone, but fundamentally tied to a performative act of judgment by an accepted authority. Over six weeks, I would conduct a close textual analysis of Aquinas’ key passages on tyranny, authority, and resistance (primarily in *De Regno* and the *Summa Theologiae*), paying particular attention to the operational mechanics of declaring someone a usurper. I would then construct and test hypothetical scenarios against the texts, deliberately removing or blurring the presence of a clear declaring authority, to see how the distinction holds up and where ambiguities arise. A genuine result, beyond simply re-describing Aquinas’ explicit statements, would be demonstrating that the distinction *loses its practical force* in the absence of a functioning declaratory mechanism, thereby revealing that the stability of his framework relies on an unstated background condition. This would suggest that legitimacy, for Aquinas, is not a static fact but an ongoing social-political *relation* validated by some form of communal or hierarchical recognition. Conversely, merely cataloguing the textual instances of the distinction without probing this dependency would only be re-description. The scope could blow up if the inquiry pushes deeply into the nature of medieval corporate theory, Aquinas’ view of popular consent, or broader debates about licit resistance in Scholastic thought, requiring careful focus on the core mechanism of declaration. Crucially, the answer *could* emerge as the distinction doing little to no real work independently of the declaratory authority. If the analysis shows that the permissibility of killing hinges entirely on a prior authoritative judgment of illegitimacy—rendering the subsequent distinction between usurper and tyrant merely descriptive rather than prescriptively determinative—that would be a significant finding, not a failure. It would mean the core operative element in Aquinas’ thought is not the formal origin of power per se, but the existence and act of an accepted body empowered to interpret and declare that origin illegitimate. This finding would force a reinterpretation of where the true burden of legitimacy lies in his political theory.

  Hope this gives you a solid foundation to build on. Good luck with the workshop proposal!
