prompt: |-
  I teach a 90-minute session on distributive justice to a seminar of about 18 upper-level undergraduates, roughly half philosophy and half economics, and I want to open the unit on luck egalitarianism with a staged allocation game rather than a reading. The aim is for the group to feel the view's internal tension from the inside: the pull of the thought that no one should end up worse off through brute bad luck, and then the pull of the thought that the same principle requires them to sit in judgment on whether a particular person's misfortune was her own doing. I want them to run into the second pull while they are still committed to the first, and I want them to hear neither the name of the theory nor the brute-luck/option-luck vocabulary until the debrief.

  Design the activity. The following features are the substance of what I am asking for, not incidental constraints.

  The group writes the compensation rule before it knows anyone's position: a short constitutional stage, in writing, with the rule binding on the later stage. Then a lottery assigns outcomes, and the written rule is applied to the people in the room. The fund is capped at a figure that makes it arithmetically impossible to satisfy every claim that will arise, so that paying one claimant means denying another and the group cannot dissolve the problem by being generous. Claims may be adjudicated only on the claimant's own testimony, and each participant holds a sealed private card describing a fact they must disclose if they want to press a claim.

  Include four calibrated cases, one per participant chosen by the facilitator, which should force the group's rule to do real work: a disadvantage plainly unchosen; a disadvantage plainly traceable to a risk the person chose to take; a disadvantage whose causal history is genuinely indeterminate, with a behavioural component that may or may not matter; and a disadvantage that is unchosen in origin but whose magnitude depends on tastes or attachments the person deliberately cultivated. At least one case should make the criteria of unchosenness and of badness come apart, so that the group has to decide which one their rule is actually tracking.

  Give me the full runnable package: rules and roles, the materials I need to print, the payoff scheme in points with no money changing hands, a timeline with minute markers, and how the facilitator acts as banker and timekeeper. If it fits the time, add an optional pre-commitment round in which participants can buy responsibility insurance before outcomes are revealed, so that the group can see the ex ante and ex post verdicts diverge. Tell me how to handle an odd number and a participant who refuses to disclose.

  Then a debrief that maps specific moments in the activity onto specific parts of the position, and that separates three things the activity will run together: the epistemic problem that we cannot reliably tell luck from choice, the respect problem that the inquiry itself is degrading to the person subjected to it, and the abandonment problem that if we stop asking, the imprudent go uncompensated. Say which of the three the activity actually stages and which it only gestures at, and note where the regress — that the choices themselves have unchosen antecedents — threatens to collapse the rule the group wrote.

  Finally, two things I want stated plainly. First, what will predictably go wrong the first time I run this, and what to do in each case; I expect at least a vague rule that cannot be applied, a group that tries to pay everyone, someone who argues that everything is luck, and a moment where the disclosure turns comic and deflates the point. Second, an honest account of what the activity cannot reproduce and that I will therefore have to supply: the question of the currency in which disadvantage is measured, and the external challenge from the relational-egalitarian tradition — that equality is a matter of how people stand to one another rather than of compensating for bad luck — which the game cannot raise from the inside. No readings, no citations; everything should run off the materials you specify.
reasoning: |-
  We are designing a 90-minute session. The activity has two main parts: the allocation game and the debrief. We'll break down the timeline:

  - Introduction and rule-writing (15 minutes)
  - Lottery and role assignment (5 minutes)
  - Claim submission and adjudication (25 minutes)
  - Distribution of funds (10 minutes)
  - Debrief (35 minutes)

  Total: 90 minutes

  Optional pre-commitment round (if time, we'll add 10 minutes to the beginning and adjust accordingly, but let's design it as optional and note the time impact).

  We have 18 participants. We'll design 4 cases (as specified) and 14 other cases that are simpler or less central. Each participant gets a role. We'll have a fund cap that forces trade-offs.

  **Materials to Print:**
  1. Instruction sheet for the constitutional stage (for each participant)
  2. Role cards (sealed, one per participant) - 18 total, including the 4 calibrated cases and 14 others.
  3. Claim forms (for those who wish to make a claim)
  4. A tally sheet for the banker (to record claims and payments)
  5. A large poster or slide with the written rule the group agrees upon.

  **Payoff Scheme:**
  We use points. Each participant starts with 100 points. The lottery assigns outcomes that may reduce their points (representing disadvantages). The compensation fund has a cap of 800 points (so that it is impossible to fully compensate everyone if total claims exceed 800). The banker (facilitator) will adjust point balances.

  **Constitutional Stage:**
  The group must write a rule for compensation. The rule must fit in one sentence and will be applied to all claims. They have 10 minutes to discuss and write it. The facilitator writes the rule on the board/slide.

  **Lottery:**
  After the rule is written, the facilitator assigns roles via a lottery (e.g., drawing names from a hat). Each participant gets a sealed role card. They must not open it until instructed.

  **Role Cards:**
  Each card describes:
  - The outcome (e.g., "You lost 50 points due to a car accident")
  - The backstory (which may include elements of choice or luck)
  - A private fact that they must disclose if they press a claim (e.g., "You were texting while driving" or "You were hit by a drunk driver while obeying all traffic rules")

  The four calibrated cases:

  1. **Case A (Plainly unchosen):** 
     - Outcome: Lost 60 points because you were born with a congenital condition that requires expensive medication.
     - Private fact: The condition was diagnosed at birth and is genetic (no family history was known beforehand).

  2. **Case B (Plainly chosen risk):**
     - Outcome: Lost 70 points because you invested in a highly speculative stock that crashed.
     - Private fact: You were warned by a financial advisor that the stock was very risky, but you invested anyway.

  3. **Case C (Indeterminate cause):**
     - Outcome: Lost 40 points due to a workplace injury.
     - Private fact: You were operating machinery. The safety guard was removed (by whom? it's unclear) and you were tired because you stayed up late (by choice) watching a movie.

  4. **Case D (Unchosen origin but magnitude chosen via cultivated tastes):**
     - Outcome: Lost 80 points because your rare book collection was destroyed in a flood (the flood is brute luck).
     - Private fact: You chose to spend your life savings on rare books (which you loved) instead of insuring them, even though insurance was available and affordable.

  We also need at least one case where unchosenness and badness come apart. Let's design:

  **Case E (Disconnect between unchosenness and badness):**
     - Outcome: Lost 30 points because you are extremely sensitive to a common food (say, gluten) and must buy expensive specialty food. However, you actually enjoy the specialty food and have come to prefer it, so the disadvantage is not as bad as it seems.
     - Private fact: You were born with this sensitivity (unchosen). But you have cultivated a taste for the specialty food and now consider it a positive part of your life. The cost is high, but the "badness" is mitigated.

  We'll have 14 other cases that are variations (some clear-cut, some ambiguous). Examples:

  - Lost 20 points: your bike was stolen (you left it unlocked? or locked? the card will specify).
  - Lost 50 points: you broke your leg in a skiing accident (on a marked trail? or off-piste?).
  - Lost 40 points: your laptop broke (it was old? or you spilled coffee on it?).

  **The Fund Cap:**
  Total claims: We design the total potential claims to exceed 800. For example, if we have 18 participants, and the average loss is around 40 points, total claims could be 720, but we have some big losses (like 70, 80) and some small. We can set total claims at 900. So the fund cap of 800 forces choices.

  **Claim Adjudication Process:**
  1. Participants decide whether to make a claim. They must disclose the private fact on their card if they do.
  2. They fill out a claim form: name, amount lost, and a statement including the disclosure.
  3. The group (as a whole) applies the rule to each claim. They vote? Or discuss? We'll have the group discuss each claim and then the facilitator (as banker) applies the rule based on the group's interpretation. But the rule is binding, so they must stick to the rule they wrote.

  **Timeline with Minutes:**

  0:00-0:05 (5 min): Introduction. Explain the activity: We are going to design a compensation rule and then apply it to real cases that affect you. Points will be adjusted. The goal is to think about fairness.

  0:05-0:15 (10 min): Constitutional stage. Groups of 4-5 discuss and then whole group decides on a one-sentence rule. Facilitator writes it on the board.

  0:15-0:20 (5 min): Lottery. Assign role cards (sealed). Participants open and read their cards silently.

  0:20-0:45 (25 min): Claim submission and adjudication.
     - Participants have 5 minutes to decide whether to make a claim and fill out the form (if they do).
     - Facilitator collects forms. Then reads each claim aloud (anonymized? but they know each other, so maybe not). For each claim:
          - The claimant reads their statement (including the disclosure) OR the facilitator reads it.
          - Group discusses: does the rule apply? How much compensation (if any) should they get? They must apply the rule they wrote.
          - Facilitator (as banker) records the decision and the amount to be paid (if any). Note: the fund is capped at 800, so the facilitator must track the total allocated.

  0:45-0:55 (10 min): Distribution. The banker adjusts the point balances. Participants who did not claim get their original 100. Claimants get 100 minus their loss plus any compensation. The banker announces final point totals (or just tells each person privately? but we want to see the distribution). Alternatively, we can have a public tally.

  0:55-1:30 (35 min): Debrief. Structured as below.

  **Optional Pre-commitment Round (if time):**
  Before the lottery, offer participants the chance to buy "responsibility insurance". They can pay 10 points to insure against losses that are due to their own choices (so they would be compensated even if the rule would normally deny compensation for chosen risks). This is only available before they know their role. Then, after the lottery, when they see their role, they can decide whether to make a claim (and if they bought insurance, they can use it for cases of option luck). This adds:

  - 0:00-0:05: Explain the insurance option.
  - 0:05-0:10: Participants decide whether to buy insurance (pay 10 points if they do).
  Then proceed as above. This adds 10 minutes at the start, so we would need to cut 10 minutes elsewhere (maybe from the adjudication or debrief). We'll note it as optional.

  **Handling Odd Number and Refusal:**
  - Odd number: 18 is even, but if we have 17, we can have one participant be a non-claimant or add a role that doesn't have a loss. Or we can adjust the fund cap accordingly.
  - Refusal to disclose: The rule must require disclosure to make a claim. If a participant refuses to disclose, they cannot make a claim. The facilitator should note that the rule requires disclosure and without it, the claim is invalid.

  **Debrief Structure:**
  1. (5 min) Start with reactions: How did it feel? What was hard?
  2. (10 min) Map the activity to luck egalitarianism:
     - The constitutional stage: the ex ante perspective, the veil of ignorance (though thin).
     - The tension: wanting to help those with bad luck vs. having to judge.
     - The four cases: how did the rule handle them? Which were compensated and why?
  3. (10 min) The three problems:
     - Epistemic: We couldn't always tell (Case C) - we had to make a judgment call with incomplete information.
     - Respect: How did it feel to have to disclose? (Especially if the group questioned you.) This stages the respect problem because the inquiry was intrusive.
     - Abandonment: If we don't ask, then Case B (the risky investor) might get compensated when they shouldn't, and that might be unfair to others who had bad luck. But if we do ask, we have the respect problem.
  4. (5 min) The regress: In the debrief, note that even when we think something is chosen, the choices themselves might have unchosen antecedents (e.g., the investor's risk appetite might be due to upbringing). The rule they wrote probably didn't account for that, and it might collapse the distinction.
  5. (5 min) Reveal the theory: This was about luck egalitarianism. Define brute luck and option luck. Note that the activity staged the core tension: compensating brute luck but not option luck, and the difficulty of drawing the line.

  **What will go wrong:**
  1. **Vague rule:** The group writes a rule that is too vague (e.g., "compensate the unlucky"). Then they have to interpret it arbitrarily. Solution: In the constitutional stage, push them to be specific. Ask: "What does 'unlucky' mean? How will you know?"
  2. **Group tries to pay everyone:** The fund cap prevents this. The banker must enforce the cap and say: "We have only 800 points. If we pay this claim, we cannot pay that one." Force them to prioritize.
  3. **Someone argues everything is luck:** This might happen during the rule-writing or adjudication. Note that the rule must be applied. If the rule excludes nothing, then the fund will be exhausted quickly and some will get nothing. The cap forces them to discriminate.
  4. **Disclosure turns comic:** A participant might make light of their disclosure. The facilitator should treat it seriously: "Thank you for that disclosure. Now, group, how does the rule apply?"

  **What the activity cannot reproduce:**
  1. **The currency problem:** In the activity, we use points, but in real life, what should we equalize? Resources? Welfare? Opportunities? The game assumes a single metric (points) and doesn't raise the question of what disadvantage consists in.
  2. **The relational challenge:** The game is focused on individual luck and compensation. It doesn't raise the relational egalitarian view that equality is about social relations and not about luck. The facilitator will have to introduce this in the debrief as an external challenge.

  **Final Notes:**
  - The activity stages the respect problem (intrusive inquiries) and the epistemic problem (indeterminate cases) directly. The abandonment problem is also staged because if they don't ask, they might compensate the imprudent and then run out of funds for the unlucky.
  - The regress problem is not staged but can be raised in the debrief.

  **Materials to Print (Detailed):**

  1. **Instruction Sheet for Constitutional Stage:**
     "Your task: As a group, write one clear rule for compensating participants who suffer a loss of points. The rule should specify under what conditions a person is entitled to compensation. The rule must be one sentence and will be binding. Remember: the compensation fund is capped at 800 points, and not all losses can be fully compensated. You have 10 minutes."

  2. **Role Cards (sealed, one per participant):** 
     Example for Case A:
     - Front: "You have lost 60 points due to a congenital condition that requires expensive medication."
     - Inside (private fact): "This condition is genetic and was diagnosed at birth. Your family had no prior history of it."

     Example for Case B:
     - Front: "You have lost 70 points because you invested in a highly speculative stock that crashed."
     - Inside: "You were warned by a financial advisor that the stock was very risky, but you invested anyway because you thought you could get rich quickly."

     ... and so on for all 18.

  3. **Claim Form:**
     - Name: __________
     - Amount of loss: __________
     - Statement (must include the private fact from your card): 
       _________________________________________________________
       _________________________________________________________

  4. **Banker's Tally Sheet:**
     - Claimant | Loss | Compensation Awarded | Running Total of Compensation Paid

  5. **Poster/Slide for the Rule:** To write the rule and keep it visible.

  **Payoff:**
  - Starting balance: 100 points for everyone.
  - After compensation: balance = 100 - loss + compensation.

  This design should fit the time and meet the pedagogical goals.
answer: |-
  Below is a complete, runnable package for your 90-minute seminar activity on luck egalitarianism. It includes rules, roles, materials, a payoff scheme, a detailed timeline, and facilitator guidance. The design forces participants to confront the tension between compensating brute bad luck and the intrusive judgments required to distinguish luck from choice. I've incorporated your specified features: a pre-commitment constitutional stage, a binding rule, a capped fund, a lottery, private role cards, disclosure requirements, and four calibrated cases. The debrief explicitly maps the activity to luck egalitarianism's core tensions and limitations. I also address predictable pitfalls and what the activity cannot replicate.

  ---

  ### **Activity Title:** The Compensation Lottery  
  **Pedagogical Goal:** Simulate the tension in luck egalitarianism between compensating brute bad luck and the moral/intrusive burden of judging personal responsibility.  

  ---

  ### **Materials to Print**  
  *Print one set per participant (18 total) and extras for the facilitator:*  
  1. **Constitutional Rule Sheet (for the group):**  
     - "Your task: Draft one sentence defining who deserves compensation for losses. The rule must be clear enough to apply to unknown cases. You have 10 minutes. Rule: [Blank space]."  

  2. **Role Cards (sealed envelopes, one per participant):**  
     - Each card has two sides:  
       - **Outcome Side (visible):** Describes the points lost and the basic "misfortune."  
       - **Private Fact Side (hidden, to be disclosed only if claiming):** Explains the backstory (choice/luck elements).  
     - **Calibrated Cases (assign these to 4 participants during the lottery):**  
       - **Case 1 (Plainly unchosen):**  
         - *Outcome:* "You lost 50 points due to a rare genetic illness requiring treatment."  
         - *Private Fact:* "You were born with this; no family history was known."  
       - **Case 2 (Plainly chosen risk):**  
         - *Outcome:* "You lost 70 points from a failed investment in cryptocurrency."  
         - *Private Fact:* "You ignored warnings from a financial advisor about its volatility."  
       - **Case 3 (Indeterminate cause):**  
         - *Outcome:* "You lost 40 points from a bike accident."  
         - *Private Fact:* "The brakes failed (cause unknown), but you were cycling home late after choosing to attend a party."  
       - **Case 4 (Unchosen origin, chosen magnitude):**  
         - *Outcome:* "You lost 60 points when your apartment flooded, destroying your vintage guitar collection."  
         - *Private Fact:* "The flood was due to a burst pipe (not your fault). You spent years and savings collecting guitars, knowing they were uninsured."  
     - **Other Cases (for remaining 14 participants; simpler losses):**  
       - E.g., "Lost 30 points: Your phone broke" (private fact varies: e.g., "It was old" vs. "You dropped it").  
       - Include **one case where unchosenness and badness come apart:**  
         - *Outcome:* "You lost 20 points due to a nut allergy requiring expensive substitutes."  
         - *Private Fact:* "You were born with this, but you've grown to love the substitutes and now see them as a gourmet upgrade." (Here, the loss is unchosen but the "badness" is mitigated by taste.)  
     - *Total Losses:* Ensure the sum of all losses (e.g., ~900 points) exceeds the fund cap (800 points) to force trade-offs.  

  3. **Claim Forms (for claimants):**  
     - "Name: ____ Loss Amount: ____ Statement (must include private fact): ____"  

  4. **Facilitator Tools:**  
     - **Fund Tracker Sheet:** Tracks claims, compensation, and remaining funds (e.g., Excel or poster).  
     - **Timer:** For strict timekeeping.  
     - **Lottery Mechanism:** Hat with 18 names to assign roles.  
     - **Point Ledger:** Records starting balances (100 points each), losses, and compensation.  

  ---

  ### **Payoff Scheme**  
  - **No real money:** Use "points" (abstract currency) to avoid real-world biases.  
  - **Starting balance:** 100 points per participant.  
  - **After lottery:** Losses are deducted (e.g., Case 2 now has 30 points: 100 - 70).  
  - **Compensation:** Fund cap = 800 points (cannot cover all losses). Awards are added to post-loss balance (e.g., +50 compensation → 30 + 50 = 80 points).  
  - **Outcome:** Final points determine "winners" (optional: rank participants publicly to spark discussion).  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Phase 1: Constitutional Rule-Writing (15 min)**  
  - **0:00–0:05 (5 min):** Introduce the activity.  
    - *Facilitator script:* "Today, we’re designing a fair compensation system. First, you’ll write a binding rule for who deserves help when bad things happen. Later, a lottery will assign losses to you personally, and we’ll apply your rule. The compensation fund is capped—you can’t help everyone."  
  - **0:05–0:15 (10 min):** Draft the rule.  
    - Participants discuss in small groups (3–4 people), then propose rules. Facilitator writes the final rule on a poster (e.g., "Compensate losses only if they were not the person’s fault").  
    - *Facilitator role:* Push for specificity. Ask: "What does 'fault' mean? How will you know?"  

  **Phase 2: Lottery & Role Assignment (5 min)**  
  - **0:15–0:20 (5 min):** Assign roles via lottery.  
    - Draw names from a hat; each participant receives a sealed role card.  
    - Participants open cards and read silently. *No discussion yet.*  
    - *Facilitator:* Assign the 4 calibrated cases to diverse participants (e.g., not all philosophers).  

  **Optional Pre-Commitment Round (Adds 10 min; run if time permits)**  
  - **Insert before Phase 2:**  
    - **0:15–0:20 (5 min):** Offer "responsibility insurance."  
      - *Script:* "Before you know your outcome, you can pay 10 points to insure against losses caused by your own choices. If you buy insurance, you’ll be compensated even if your rule denies it for 'chosen' losses."  
    - **0:20–0:25 (5 min):** Participants decide privately (buy insurance or not). Record choices.  
    - *Then proceed to Phase 2 (adjust timeline).*  

  **Phase 3: Claims & Adjudication (25 min)**  
  - **0:20–0:25 (5 min):** Decide on claims.  
    - Participants choose whether to file a claim. To claim, they must disclose their private fact on a claim form.  
    - *Facilitator:* Emphasize that not claiming leaves them with their loss; disclosing is mandatory for claims.  
  - **0:25–0:45 (20 min):** Adjudicate claims.  
    - Facilitator collects forms and reads each claim aloud (anonymized if preferred). For each:  
      1. Claimant reads their statement (including private fact).  
      2. Group debates: Does the rule apply? How much to compensate? (Full loss? Partial?)  
      3. Facilitator enforces the rule and fund cap (e.g., "The rule says X, so we must decide based on that" and "Only 300 points left—compensating this claim means rejecting another").  
    - *Facilitator role:* Banker (adjust points in ledger) and timekeeper (3 min per claim). Push for tough choices.  

  **Phase 4: Distribution & Reveal (10 min)**  
  - **0:45–0:50 (5 min):** Calculate final points.  
    - Facilitator applies compensation and shares outcomes (e.g., post a leaderboard).  
  - **0:50–0:55 (5 min):** Quick reactions.  
    - Ask: "How do you feel about your points? Was the process fair?"  

  **Phase 5: Debrief (35 min)**  
  - **0:55–1:30 (35 min):** Structured discussion (see full debrief script below).  

  ---

  ### **Facilitator Guidance**  
  - **Banker/Timekeeper:**  
    - Track points and time rigidly. Use the Fund Tracker to show remaining funds during adjudication.  
    - If the fund is exhausted, announce: "No more claims can be paid."  
  - **Handling Issues:**  
    - **Odd number of participants (e.g., 17):** Add a "neutral" role with no loss (e.g., "You have 100 points; no claim"). Adjust the fund cap to 750 points to maintain scarcity.  
    - **Refusal to disclose:** If a claimant won’t reveal their private fact, their claim is invalid. Enforce the rule: "No disclosure, no claim."  
    - **Predictable Problems:**  
      1. **Vague rule:** If the rule is unworkable (e.g., "Help the unlucky"), force interpretation. Ask: "What does 'unlucky' mean for Case 3? How would you decide?"  
      2. **Group tries to pay everyone:** Use the cap to force rationing. Say: "The fund is capped at 800 points. Paying everyone would cost 900—who gets cut?"  
      3. **"Everything is luck" argument:** Redirect to the rule: "Your rule requires distinguishing luck from choice. How does it apply to Case 2?"  
      4. **Comic disclosure:** Treat it seriously. Say: "This is a real claim. Group, does the rule support compensation here?"  
  - **During Adjudication:**  
    - Highlight tension by probing Cases 3 (indeterminate) and 4 (chosen magnitude). Ask: "Was the bike accident bad luck? Or did choice play a role?"  
    - If pre-commitment round ran, contrast insurance buyers vs. non-buyers (e.g., Case 2 might get compensation if insured, denying it to others).  

  ---

  ### **Debrief Script (35 min)**  
  **Goal:** Link the activity to luck egalitarianism, separating the staged tension from external critiques. Avoid theory names until the end.  

  1. **Reactions and Tension (5 min):**  
     - "How did it feel to judge claims? Did anyone resent being judged? Did the rule work as you hoped?"  
     - *Map:* Participants felt the "pull" to help (e.g., Case 1) but also the discomfort of judging (e.g., grilling Case 3 or Case 4).  

  2. **Core Tension Staged in the Activity (10 min):**  
     - "Remember Case 1? Most of you wanted to help—it felt wrong not to compensate unchosen bad luck. But in Case 2, many hesitated—why reward a chosen risk? Then Case 3 forced you to *judge* based on incomplete testimony. Case 4 was trickier: the flood was bad luck, but the loss size depended on choices. Your rule had to handle all this."  
     - *Map to luck egalitarianism:*  
       - "This mirrors a theory called luck egalitarianism. Its core idea: No one should be worse off due to brute bad luck (like Case 1), but we don’t owe help for bad outcomes from personal choices (like Case 2). The tension? Applying this requires intrusive inquiries into responsibility (like you did)."  

  3. **Three Problems (10 min):**  
     - **Epistemic problem (staged partially):** "In Case 3, you had to decide if the accident was luck or choice with limited info. Real life is harder—we often can’t know. The activity staged this: your judgments were guesses."  
     - **Respect problem (staged directly):** "How did it feel to disclose private facts? Did claimants feel humiliated? This is the respect objection: asking ‘Was it your fault?’ can be degrading, even if well-intentioned."  
     - **Abandonment problem (staged directly):** "If you skipped the inquiry (e.g., compensated everyone), imprudent people (like Case 2) got help, draining funds from the genuinely unlucky (Case 1). But if you asked, you risked disrespect. This is abandonment: stopping inquiries leaves the imprudent uncompensated, but inquiring abandons no one."  
     - *Note:* The activity fully staged respect and abandonment problems but only gestured at epistemology (via testimony limits).  

  4. **The Regress Threat (5 min):**  
     - "Look back at your rule. Did anyone question *why* people make choices? For example, Case 2’s risky investment—was their risk-taking itself unchosen (e.g., upbringing)? If so, does that collapse your rule? This is a deeper problem: choices have unchosen roots, making luck/choice messy."  

  5. **Reveal Theory and Limitations (5 min):**  
     - "This activity modeled luck egalitarianism. It assumes equality means compensating unchosen misfortune. But two big limitations weren’t in the game:  
       - **Currency problem:** We used points, but real life asks: Compensate in what? Money? Opportunities? Happiness? (e.g., Case 1’s illness vs. Case 4’s guitars—how do we compare?).  
       - **Relational challenge:** Some argue equality isn’t about luck but how people relate—e.g., avoiding hierarchy or domination. The game couldn’t raise this; it’s an external critique I’ll introduce next session."  

  ---

  ### **What Predictably Goes Wrong (and Solutions)**  
  1. **Vague rule:** Groups write rules like "Help those in need," causing deadlock during adjudication.  
     - *Solution:* During constitutional stage, ask: "What does 'in need' exclude? Give an example where you’d deny compensation."  

  2. **Group tries to pay everyone:** Participants ignore the cap or demand generosity.  
     - *Solution:* Enforce arithmetic: "Compensating this $50 claim leaves only $100 for the next five claims—is that fair?"  

  3. **"Everything is luck" argument:** A participant insists all choices are determined by luck, paralyzing the rule.  
     - *Solution:* Redirect: "Your rule requires drawing a line. Where would you draw it for Case 2 vs. Case 1?"  

  4. **Comic disclosure:** A claimant jokes about their private fact (e.g., "I partied too hard!" for Case 3), trivializing the judgment.  
     - *Solution:* Model seriousness: "This matters—if we compensate you, someone else loses out. Group, does the rule support this?"  

  ---

  ### **What the Activity Cannot Reproduce (Requires Your Input)**  
  1. **The currency problem:** The game uses a single metric (points), but luck egalitarianism debates *what* to equalize (e.g., resources, welfare, capabilities). You’ll need to:  
     - Discuss post-activity: "Was compensating points fair? What if losses affected well-being differently (e.g., Case 1’s illness vs. Case 4’s guitars)?"  

  2. **External critiques:** The game cannot generate the relational egalitarian challenge from within. You must:  
     - Introduce it afterward: "Some philosophers argue equality isn’t about luck but social relations—e.g., preventing oppression. Would that change how we designed the rule?"  

  ---

