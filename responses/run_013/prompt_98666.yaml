answer: |-
  ### Framing
  The decision problem is to create a comparative procedure estimating suffering per gram of protein across beef, chicken, and lentils. This requires quantifying: (1) **direct impacts** (animals killed/affected per unit output, suffering intensity/duration), (2) **indirect impacts** (land-use shifts altering wild populations, counterfactual agricultural responses), and (3) **moral weights** (invertebrate vs. vertebrate welfare, wild vs. farmed trade-offs). An answer must resolve how these variables interact under substitution scenarios (e.g., beef → lentils freeing pasture that may become cropland or wilderness) and deliver robust rankings despite uncertainty in key parameters.

  ### The Criteria
  Prioritization weights:  
  - **Upstreamness**: How many downstream interventions (e.g., advocacy targets, product comparisons) depend on resolving this?  
  - **Robustness**: Does the answer *change materially* when key parameters (e.g., invertebrate moral weight, crop cultivation’s net effect on wild welfare) vary within credible ranges?  
  - **Neglectedness**: Is the question underexplored relative to its impact?  
  - **Tractability**: Can a philosopher-ecologist team make progress in 1–2 years?  
  Trade-offs: Robustness and upstreamness dominate; neglectedness breaks ties; tractability filters out intractable problems (e.g., precise insect sentience metrics).

  ### The Agenda  
  1. **Counterfactual Land-Use Elasticity**  
     *Why upstream?* Determines whether pasture → cropland conversion occurs when demand shifts (e.g., beef decline → soy expansion), driving wild animal impacts. Most welfare comparisons assume fixed land use, but elasticity dictates net effects.  
     *Tractability & needs:* Ecological modeling + econometrics (e.g., meta-analysis of agricultural land-use elasticity). Progress possible with existing GIS/land-cover data.  

  2. **Net Wild Welfare Impact of Crop Cultivation**  
     *Why upstream?* Resolves whether lentils "save" wild animals (via spared habitat) or harm them (via pesticides/harvest). Downstream work (e.g., promoting plant-based diets) hinges on this sign.  
     *Tractability & needs:* Synthesis of wildlife density studies in croplands vs. alternative biomes + invertebrate mortality estimates. Highly sensitive to moral weights.  

  3. **Moral Weight Scaling for Invertebrates**  
     *Why upstream?* Invertebrates (e.g., insects in feed crops) dominate harm numbers in agriculture. If their moral weight is >0.1% of a chicken’s, they swamp calculations.  
     *Tractability & needs:* Philosophical framework for weight assignment based on neuroscience/behavioral proxies. Requires defining a "credible range" (e.g., 0.001%–1% of chicken weight).  

  4. **Welfare Ranges Across Species**  
     *Why upstream?* Suffering per animal varies by species (e.g., pasture-raised cow vs. broiler chicken). Current comparisons often assume equality, but neurobehavioral evidence challenges this.  
     *Tractability & needs:* Comparative review of pain indicators (e.g., opioid receptors, aversive learning). Settling requires consensus on welfare indicators.  

  5. **Aggregation Method Selection**  
     *Why upstream?* "Total suffering sum" vs. "individuals harmed" can reverse rankings (e.g., if lentils kill many insects but few vertebrates). Advocacy prioritization depends on this choice.  
     *Tractability & needs:* Philosophical analysis of population ethics + empirical input on threshold effects. Progress via decision-theoretic modeling.  

  6. **Protein Adjustment for Nutritional Quality**  
     *Why upstream?* Lentils require more grams consumed to equal animal protein’s bioavailability. Failure to adjust inflates apparent plant-based advantages.  
     *Tractability & needs:* Nutritional science synthesis (PDCAAS/DIAAS scores). Nearly settled but often ignored in EA literature—needs integration.  

  ### What Would Reorder It  
  New empirical data could elevate **Wild Welfare Impacts** (e.g., a study showing croplands consistently *increase* wild invertebrate populations) or **Invertebrate Weights** (e.g., evidence of learned avoidance in nematodes). If land-use elasticity proves highly inelastic, **Counterfactuals** drop in priority. Philosophical consensus on aggregation (e.g., accepting "total suffering" as default) would deprioritize that question. Neglectedness boosts **Protein Adjustment** if audits confirm widespread omission.

  ### Bottom Line  
  Fund **Counterfactual Land-Use Elasticity** (#1) and **Net Wild Welfare Impact of Crops** (#2) first. These are maximally upstream (all diet comparisons collapse without them), highly sensitive to parameter variation, and tractable with interdisciplinary collaboration. **Invertebrate Moral Weight Scaling** (#3) is the next priority—its uncertainty propagates through all calculations, and it remains deeply neglected relative to impact.
