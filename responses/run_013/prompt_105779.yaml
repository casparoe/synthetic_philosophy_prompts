prompt: |-
  I host a modest interview series on decision theory, and my next guest is a philosopher who defends risk-weighted expected utility as the correct account of rational choice under risk. Please draft eight to ten interview questions for me, together with a follow-up for each that is keyed to the answer he is most likely to give. The questions should press on the substance of the position rather than invite him to restate it, and they should not depend on his citing any literature; I want the exchange to stand on its own for listeners who already have the theory in view.

  Please build the sequence around at least the following lines of pressure, roughly in this order. First, an opening that forces him to say what the risk function is doing that a probability weighting cannot: why is risk-weighted expected utility not simply rank-dependent utility under another name, and what turns on the interpretation rather than on the formalism? Second, a question that brings out the fact that his theory assigns each agent a single, fixed risk attitude across every prospect the agent faces, with a follow-up raising the objection that the same person is plausibly risk-averse about medical prospects and risk-seeking about career prospects; ask him whether that is a defect of the theory or a defect of the folk psychology. Third, a concrete case: a choice between a sure forty and an even chance of zero or a hundred, with utility linear in money. Ask what his risk function would have to look like in order to reverse the expected-utility ranking here, and follow up on whether the degree of concavity this requires is independently plausible or merely fitted to the Allais pattern. Fourth, the consequentialism worry: if the risk function is not just shorthand for preferences over a richer outcome space, does the view forfeit the standard arguments for dynamic consistency, and how does he handle a prospect that is assessed differently depending on when the choice is made? Fifth, the boundary between risk and ambiguity: what does the theory say about Ellsberg-style cases, and is its silence there a limitation or a deliberate scope restriction?

  Close with a question asking what evidence, short of a Dutch book, would lead him to abandon the view.
reasoning: |-
  We are drafting 8-10 interview questions with follow-ups for a philosopher defending risk-weighted expected utility (REU). The questions should be substantive, not invite restatement, and stand alone without literature references. The sequence must cover the specified lines of pressure in order.

  Key themes to cover in order:
  1. Distinguish REU from rank-dependent utility (RDU) and explain why the interpretation (risk attitude) matters beyond formalism.
  2. Fixed risk attitude across all prospects: challenge with domain-specific attitudes (medical vs. career) and ask if that's a theory defect or folk psychology defect.
  3. Concrete case: choice between sure 40 vs. 50-50 for 0 or 100, with linear utility. What risk function reverses EU? Is the required concavity independently plausible?
  4. Consequentialism worry: if the risk function isn't shorthand for richer outcomes, does it lose dynamic consistency arguments? How to handle time-dependent assessment?
  5. Boundary with ambiguity: Ellsberg cases, is silence a limitation or scope restriction?
  6. Closing: what evidence (short of Dutch book) would lead to abandonment?

  Let us design the questions accordingly.

  Question 1: Opening on the distinction between risk-weighted expected utility and rank-dependent utility.
     - Main: "You've argued that risk-weighted expected utility captures a distinctive aspect of rational choice. But rank-dependent utility theory also uses a transformation on cumulative probabilities. Why isn't REU just a rebranding of RDU? What does the interpretation of the weighting function as capturing 'risk attitude' add that the formal structure of RDU doesn't already have?"
     - Expected answer: He might say that RDU is a formal framework that can be used for various purposes (e.g., to model probability weighting as in prospect theory) but that REU interprets the weighting function specifically as a measure of the agent's attitude toward risk (as opposed to, say, cognitive distortions in probability perception). The key is that risk is a normative feature of the decision problem that the rational agent responds to with a consistent attitude.
     - Follow-up: "But if both theories use the same mathematical structure, doesn't that mean the debate is merely verbal? Why should we care about the interpretation?"

  Question 2: Fixed risk attitude across all prospects.
     - Main: "REU assigns each agent a single, fixed risk attitude that applies to every decision they face. But it seems plausible that the same person might be risk-averse when it comes to medical decisions and risk-seeking in career choices. How do you account for this within your theory?"
     - Expected answer: He might argue that the risk attitude is a deep feature of the agent's character and that apparent domain-specific attitudes are either (a) due to differences in the utility function across domains or (b) irrational. Alternatively, he might suggest that the folk psychology of domain-specific risk attitudes is mistaken and that a consistent attitude is what rationality requires.
     - Follow-up: "Suppose we control for utility by using money as a common scale and still observe domain-specific risk attitudes. Would you then say that REU is descriptively inadequate, or would you maintain that such an agent is irrational?"

  Question 3: Concrete case (sure 40 vs. 50-50 for 0 or 100, linear utility).
     - Main: "Consider a choice between a sure $40 and a gamble that gives $0 or $100 with equal probability. Under expected utility with linear utility, the gamble is preferred (since 50 > 40). But REU can reverse this if the agent is sufficiently risk-averse. What would the risk function have to look like to reverse the ranking, and is the required degree of concavity independently plausible, or is it just fitted to explain the Allais pattern?"
     - Expected answer: He might explain that for a risk-averse REU maximizer, the risk function is concave. Specifically, the risk aversion would require that the weight on the worst outcome (which is $0) is more than its probability. In this case, the REU of the gamble is 100 * (1 - w(0.5)) because the worst outcome (0) occurs with probability 0.5 and the best (100) with 0.5. To prefer the sure $40, we need 40 > 100 * (1 - w(0.5)) => w(0.5) > 0.6. So a risk function that assigns at least 0.6 to the cumulative probability of 0.5 (which is the probability of the worst outcome) would do. He might argue that such a function is plausible because it reflects a cautious attitude.
     - Follow-up: "But isn't requiring w(0.5) > 0.6 quite a strong departure from linearity? For instance, a power risk function w(p)=p^γ would require γ<log(0.4)/log(0.5)≈0.737, which is a fairly high degree of concavity. Is there independent evidence for such a function, or is it primarily motivated by the desire to accommodate Allais paradox-type choices?"

  Question 4: Consequentialism and dynamic consistency.
     - Main: "REU evaluates prospects holistically, based on the entire distribution of outcomes. But in dynamic choice, we often face sequences of decisions. If the risk function is not just a summary of preferences over a richer state space, how does REU avoid dynamic inconsistencies? For example, consider a prospect that is broken into two stages: at time one, a coin is flipped to determine whether the agent faces a sub-game at time two. Could the agent evaluate the entire prospect one way when chosen at the outset and differently when choosing at the second stage?"
     - Expected answer: He might argue that REU requires dynamic consistency by evaluating the whole plan at the outset and then following through. Alternatively, he might acknowledge that REU can lead to time-inconsistency and then propose a resolution (e.g., by re-evaluating at each stage with the same risk function, which might lead to a change in assessment).
     - Follow-up: "But if the agent re-evaluates at the second stage and comes to a different conclusion than what was planned, doesn't that mean the initial plan was not followed? And if so, how is that rational? Doesn't this forfeit the standard consequentialist argument that rational choices should be consistent over time?"

  Question 5: Boundary between risk and ambiguity.
     - Main: "Your theory is designed for decisions under risk (known probabilities). What does it say about Ellsberg-style cases where probabilities are unknown? Is the silence on ambiguity a deliberate scope restriction or a limitation of the theory?"
     - Expected answer: He might say that risk and ambiguity are distinct and that REU is only for risky prospects. He might even argue that ambiguity requires a different kind of decision rule (like maxmin or smooth ambiguity) and that this is a deliberate scope restriction.
     - Follow-up: "But if an agent faces a decision that mixes risk and ambiguity, how should they proceed? And doesn't the existence of ambiguity in many real-world decisions make REU less applicable?"

  Question 6: Closing question: evidence for abandonment.
     - Main: "Finally, let's consider falsification. What kind of evidence, short of a Dutch book, would lead you to abandon risk-weighted expected utility as the correct account of rational choice under risk?"
     - Expected answer: He might say that if there were clear cases where REU prescribes choices that are intuitively irrational and an alternative theory does better without sacrificing other rational intuitions, then he would reconsider. Or if REU were shown to be incompatible with a fundamental principle of rationality that is more compelling.
     - Follow-up: "Can you give an example of such a case? Or more specifically, what would be a 'smoking gun' against REU?"

  We have 6 main questions. We need 2-4 more to make it 8-10. Let's add two more:

  Question 7: On the interpretation of the risk function.
     - Main: "You interpret the risk function as capturing an agent's attitude toward risk. But how do we measure this attitude independently of the choices it's meant to explain? Without independent measurability, isn't there a danger of circularity?"
     - Expected answer: He might argue that the risk function can be elicited through a series of choices (like the utility function) and that it is a theoretical construct that helps explain patterns in choice behavior. Alternatively, he might suggest that we can have introspective access to risk attitudes.
     - Follow-up: "But if the risk function is only defined by the choices it predicts, then isn't REU just a redescription of choice patterns? How does it add explanatory value beyond a mere curve-fitting exercise?"

  Question 8: On the rationality of risk sensitivity.
     - Main: "Expected utility theory is often defended on the grounds that it follows from compelling axioms (like independence). REU violates the independence axiom. Why is violating independence rational? And why should we accept a theory that allows for risk sensitivity as a rational feature rather than a bias?"
     - Expected answer: He would argue that the independence axiom is not compelling in all cases (e.g., Allais) and that risk sensitivity is a rational response to the structure of risk. He might also say that the axioms of REU (like comonotonic independence) are more plausible.
     - Follow-up: "But doesn't the violation of independence open the door to various paradoxes and inconsistencies? How do you ensure that REU doesn't lead to other, more severe problems?"

  Now we have 8 questions. We can stop at 8 or add two more. Let's add two more to make 10.

  Question 9: On the role of the utility function.
     - Main: "In REU, the utility function is defined independently of risk. But how do we disentangle the utility function from the risk function in practice? For example, if an agent prefers a certain $40 to a 50-50 gamble of $0 or $100, is that because she has diminishing marginal utility of money or because she is risk-averse? How can REU tell the difference?"
     - Expected answer: He might explain that we can use certainty equivalents for simple lotteries to separate the two. For instance, if we assume a functional form for utility, we can estimate both. Or, without assuming a form, we can use a series of choices to tease them apart.
     - Follow-up: "But if the agent's choices can be explained equally well by either a concave utility function under EU or a linear utility plus a concave risk function under REU, isn't that a problem of underdetermination? And if so, why prefer REU over EU?"

  Question 10: On the normative appeal of REU.
     - Main: "You've presented REU as a normative theory. But what makes it normatively compelling? For instance, does it have an axiomatic foundation that is intuitively rational? Or does it better match our reflective judgments about cases?"
     - Expected answer: He would point to the axiomatization (like that of Quiggin or Machina) and argue that the axioms (like comonotonic independence) are more plausible than the independence axiom. He would also note that it captures patterns that people find intuitively rational (like Allais without regret).
     - Follow-up: "But if the axioms of REU are less familiar and harder to communicate than those of EU, doesn't that make it less suitable as a normative standard? And if it's justified by matching intuitions, what about cases where it doesn't (like the example in question 3 with the strong concavity requirement)?"

  Now we have 10 questions. We'll arrange them in the order specified and with the required themes.

  Let's write them out:

  1. Distinguishing REU from RDU.
  2. Fixed risk attitude across domains.
  3. Concrete case with sure 40 vs. gamble.
  4. Consequentialism and dynamic consistency.
  5. Boundary with ambiguity (Ellsberg).
