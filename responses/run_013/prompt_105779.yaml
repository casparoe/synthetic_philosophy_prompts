answer: |-
  ### Interview Questions on Risk-Weighted Expected Utility

  **1. Distinguishing REU from Rank-Dependent Utility**  
  *Question:* Risk-weighted expected utility (REU) and rank-dependent utility (RDU) both transform probabilities, yet you argue REU captures something distinct about rationality. If the mathematical formalism is identical, why isn’t REU just RDU relabeled? What does interpreting the weighting function as "attitude toward risk" add that a purely formal RDU framework lacks?  
  *Expected Answer:* REU’s risk function reflects a *normative response* to the structural features of risk (e.g., spread of outcomes), not merely cognitive biases or descriptive heuristics. It’s about how a rational agent *should* weigh outcomes based on their risk profile, whereas RDU is often instrumental.  
  *Follow-up:* If both use the same equation, isn’t the difference purely semantic? Why should we care whether the weighting reflects "risk" versus "probability distortion" if the behavioral predictions overlap?

  **2. Fixed Risk Attitude Across Domains**  
  *Question:* REU assigns each agent a single, global risk attitude (e.g., concave risk function for risk aversion). Yet intuitively, one person might be risk-averse about health but risk-seeking about investments. Is this variability a flaw in REU, or is folk psychology mistaken about how rationality operates?  
  *Expected Answer:* Rationality requires consistency in risk attitude; apparent domain shifts stem from miscalibrated utilities or irrational context effects. REU’s fixed function ensures coherent agency.  
  *Follow-up:* Suppose we empirically observe stable, domain-specific risk attitudes even after controlling for utility (e.g., via money-metric outcomes). Would REU then be descriptively inadequate, or must we insist those agents are irrational?

  **3. Concrete Case: Risk Reversal**  
  *Question:* Take a choice between a sure $40 and a 50% chance of $0 or $100, with linear utility in money. Expected utility (EU) favors the gamble (EU=50 > 40). What must the risk function look like to reverse this ranking? Is the required concavity independently plausible, or is it ad hoc to fit Allais paradoxes?  
  *Expected Answer:* A concave risk function overweighting worst outcomes reverses it. For reversal, REU(gamble) = $100 × [1 − *w*(0.5)] < $40, so *w*(0.5) > 0.6. This demands significant concavity (e.g., *w*(*p*) = *p*<sup>0.5</sup> yields *w*(0.5)≈0.71).  
  *Follow-up:* *w*(0.5) > 0.6 implies extreme risk aversion—e.g., treating a 50% chance as subjectively worse than 60%. Isn’t this implausible for moderate stakes, and doesn’t it suggest REU is reverse-engineered for anomalies?

  **4. Dynamic Consistency and Consequentialism**  
  *Question:* REU evaluates prospects holistically, but if the risk function isn’t reducible to state-wise preferences, how does REU avoid dynamic inconsistency? For example, could a plan deemed optimal at time *t*<sub>0</sub> be abandoned at *t*<sub>1</sub> because sub-prospects are re-evaluated under the same risk function?  
  *Expected Answer:* REU agents commit to pre-planned strategies. Re-evaluation mid-plan is irrational; dynamic consistency flows from fixed risk attitudes applied to whole strategies.  
  *Follow-up:* But if an agent re-evaluates a sub-prospect differently due to temporal proximity (e.g., post-resolution anxiety), and REU permits this shift without changing the risk function, doesn’t that forfeit consequentialism? Must we deny that *when* a choice is made affects rationality?

  **5. Ambiguity and the Ellsberg Challenge**  
  *Question:* REU handles risk (known probabilities), but Ellsberg experiments show aversion to ambiguity (unknown probabilities). Does REU’s silence on ambiguity imply it’s incomplete, or is this a deliberate restriction?  
  *Expected Answer:* Ambiguity involves distinct epistemic challenges; REU is scoped to risk. Rationality under ambiguity requires separate principles (e.g., uncertainty aversion).  
  *Follow-up:* If real-world "risk" often blends known and unknown probabilities (e.g., climate or market choices), doesn’t REU’s inattention to ambiguity limit its applicability? Shouldn’t a unified theory cover both?

  **6. Measuring Risk Attitudes Independently**  
  *Question:* You argue the risk function reflects deep attitudes, not just choice patterns. How can we measure an agent’s risk attitude independently of their preferences—say, through introspection or psychological tools—to avoid circularity?  
  *Expected Answer:* We infer attitudes from patterns across choices (e.g., consistency in violating EU). Ideally, risk attitudes are introspectively accessible traits, like optimism/pessimism.  
  *Follow-up:* But if risk attitudes are *only* revealed through choices (e.g., via REU’s weighting function), doesn’t that reduce the theory to redescribing preferences? How is REU more than a curve-fitting device?

  **7. Disentangling Risk from Utility**  
  *Question:* REU separates risk attitudes (via weighting) and outcome valuation (via utility). Yet in practice, choices could equally stem from diminishing marginal utility (EU) or risk weighting (REU). How do we empirically distinguish these?  
  *Expected Answer:* Fixed-payoff experiments (e.g., binary lotteries with linear monetary utility) isolate risk attitudes. REU predicts violations of EU even when utility is linear.  
  *Follow-up:* But if we allow utility curvature to vary, can’t EU always mimic REU by reframing outcomes? Doesn’t this underdetermination weaken REU’s claim to unique rationality?

  **8. Violating Independence and Rationality**  
  *Question:* REU rejects EU’s independence axiom (e.g., in Allais cases). Why is violating independence rational? Doesn’t this open the door to money pumps or self-undermining choices?  
  *Expected Answer:* Independence fails when outcomes are perceived as holistic risks (e.g., avoiding worst-case clustering). REU avoids money pumps via dynamic consistency (see Q4).  
  *Follow-up:* But if two prospects are identical in marginal distributions, yet REU ranks them differently due to outcome correlations, doesn’t that violate state-wise dominance? How is that rational?

  **9. Scope of Normative Claims**  
  *Question:* REU is proposed as normatively correct, not just descriptive. What makes it more rational than alternatives? Is it that REU better aligns with reflective intuitions, or that its axioms (e.g., coherence under comonotonicity) are more compelling?  
  *Expected Answer:* REU respects how rational agents *should* weigh risks (e.g., sensitivity to outcome dispersion) while avoiding EU’s counterintuitive results (e.g., Allais). Its axioms balance flexibility and consistency.  
  *Follow-up:* If REU permits extreme risk attitudes (e.g., Q3’s *w*(0.5)>0.6) that seem irrational in isolation, does this undermine its normative appeal? Shouldn’t rationality constrain attitudes?

  **10. Abandoning REU: Evidence Short of Dutch Books**  
  *Question:* Finally, what evidence—short of a Dutch book—could convince you REU is incorrect? For instance, if REU consistently conflicts with compelling pre-theoretic judgments or generates paradoxical recommendations in new domains, would that suffice?  
  *Expected Answer:* Persistent incoherence under reflection (e.g., REU endorsing sequences of choices that undermine long-term goals) or failing to capture core risk phenomena might force revision.  
  *Follow-up:* Couldn’t such conflicts always be resolved by adjusting the risk function? If not, what specific empirical or normative "smoking gun" would falsify REU?  

  ---

  ### Design Notes  
  - **Sequence Logic:** Opens by forcing a definitional distinction (Q1), challenges universality (Q2), tests empirical plausibility (Q3), probes dynamic issues (Q4), and limits scope (Q5). Later questions (Q6–Q9) deepen underdetermination and normative tensions. Closes with falsifiability (Q10).  
  - **Pressure Points:** Follow-ups target likely weak spots: circularity (Q6), underdetermination (Q7), dominance violations (Q8), and extreme attitudes (Q3, Q9).  
  - **Stand-Alone Clarity:** Assumes listener familiarity with REU basics. Avoids citations; questions reference core concepts (e.g., "risk function," "Allais pattern") intrinsic to the theory.  
  - **Balance:** Questions are combative but fair, inviting defense without restatement. Follow-ups build on stated positions to push for rigor.
