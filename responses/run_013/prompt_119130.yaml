  The core challenge is designing forms that force participants to choose between the statue and the clay as the primary object, without allowing easy workarounds. The insurance claim and accession forms need to create tension around persistence conditions - like what happens when the statue is damaged but the clay remains.

  For materials, play-dough or air-dry clay would work well for modeling the statue. I'll suggest simple paper forms with intentional constraints. Roles should include museum staff positions that represent different perspectives - like a registrar focused on documentation, a conservator thinking about restoration, and an insurer concerned with liability.

  The timeline needs to fit 75 minutes tightly: setup (10min), scenario introduction (5min), modeling (15min), damage event (2min), form completion (20min), tribunal debate (15min), and debrief (8min). The damage event is crucial - it should create a situation where the statue is ruined but the clay persists.

  For the debrief, I'll map each activity phase to metaphysical concepts: modeling (co-location), damage (persistence conditions), forms (indiscernibility problem), debate (constitution vs identity). I should emphasize why they can't be identical despite sharing matter.

  Failure modes to anticipate: participants might try to cheat the forms or avoid the paradox. I'll suggest workarounds like emphasizing form constraints and using scale demonstrations. The activity can't fully convey the grounding problem or temporal parts theory, so I'll note what needs supplementary explanation.

  The whole response must stay under 900 words with specific headers. No names or citations - just practical, actionable guidance. The opening should state they should feel the "vertigo" of constitution by the end.
answer: |-
  By the end, participants should feel the unsettling tension of two distinct things seemingly occupying the same space and matter, yet demanding separate treatment based on history and persistence.

  **Materials**
  *   Air-dry clay or Play-Doh (enough for one fist-sized lump per participant, plus one extra for the "statue").
  *   Simple tools (plastic knives, toothpicks).
  *   Toy kitchen scale.
  *   Printed "Museum Object Registration Form" (Fields: Accession #, Object Name, Description, Owner, Material Composition, Date Acquired, Persistence Criteria [e.g., "Exists as long as..."], Current Location).
  *   Printed "Insurance Claim Form" (Fields: Insured Object Name/Acc. #, Date of Loss/Damage, Nature of Damage, Pre-Damage Value, Post-Damage Value, Replacement Cost? Y/N, Basis for Claim [Attach Persistence Criteria]).
  *   Timer.

  **Roles** (Assign 3 key roles, others are "Tribunal Members")
  *   **Registrar:** Responsible for accurate object documentation (Registration Form).
  *   **Conservator:** Responsible for object preservation and repair.
  *   **Insurer:** Determines liability and payout based on policy (Claim Form).
  *   **Tribunal Members (Others):** Debate and vote on actions.

  **Rules**
  1.  **One Object Per Slot:** Only one entry per Accession Number slot on the Registration Form. Only one object named per Insurance Claim.
  2.  **Persistence is Binding:** The "Persistence Criteria" defined on the Registration Form *must* be used to justify the status of the object after damage for both the Claim and Conservation decisions. (e.g., "Exists as long as artistic form is substantially intact" vs. "Exists as long as the same clay matter persists").
  3.  **Location & Matter:** All agree the modeled figure and the clay occupy the same location and are materially indistinguishable *before* damage.
  4.  **Stakes:** The group must reach a consensus decision on the forms. The "Conservator" gets bonus points (e.g., extra clay, deciding next topic) if their repair plan is accepted. The "Insurer" gets points if their claim assessment (pay/don't pay, value) is accepted without appeal. The "Registrar" gets points if their documentation is deemed accurate by the tribunal.

  **Timeline (75 min)**
  *   **(0-10 min) Setup & Roles:** Distribute materials, assign roles, explain forms and rules (emphasize Rules 1 & 2). Everyone gets clay to handle.
  *   **(10-25 min) Creation & Registration:** Group collaboratively sculpts one distinct figure (e.g., animal) from the extra clay lump. **Registrar** leads filling Registration Form: Name it (e.g., "Golden Lion Statue"), describe, owner (group), material (clay), date acquired (today), location (table center). CRITICAL: Group must define *one* "Persistence Criteria" for this Accession #. *This forces the initial choice/conflation.* Weigh statue on scale, note weight. *[Vertigo: Co-location, material identity]*
  *   **(25-27 min) The Damage:** Leader dramatically (but carefully!) damages the statue (e.g., flattens the head significantly, alters form). Weigh damaged item – weight unchanged. *[Vertigo: Divergent persistence conditions triggered]*
  *   **(27-47 min) Form Completion:** Roles act independently:
      *   **Conservator:** Proposes a repair plan (e.g., rebuild head? leave as is?).
      *   **Registrar:** Must update Registration Form if the original object persists per its Criteria. Can they? Do they need a new Accession #?
      *   **Insurer:** Completes Claim Form based *only* on the object defined by the Accession # and its Persistence Criteria. Did "it" cease to exist? Is value lost? Replacement needed? *[Vertigo: Forms force incompatible interpretations of "the object"]*
  *   **(47-62 min) Tribunal Debate:** Roles present their forms/decisions. Tribunal members debate and vote on:
      1.  Does the original accession persist? (Based on its Criteria)
      2.  Accept Conservator's plan? (Requires knowing *what* is being repaired)
      3.  Accept Insurer's claim assessment?
      *   *Leader pushes:* "What object is the Conservator fixing? What object did the Insurer insure? Are they the same object registered?" *[Vertigo: Contradiction emerges from application of rules]*
  *   **(62-75 min) Debrief:** Leader-led discussion.

  **Debrief (Map to Metaphysics)**
  *   **Creation/Registration:** We had one lump of clay ("ClayLump") and started shaping a statue ("GoldenLion"). By assigning *one* Persistence Criteria, we pretended they were one thing. But were they? (Co-location, material identity ≠ numerical identity).
  *   **Damage & Weight:** Same matter, same location, but the *form* changed. "GoldenLion" (if defined by form) might be destroyed, but "ClayLump" (defined by matter) persists. Weighing showed matter persists, but that wasn't the *only* thing we cared about. (Divergent essential properties: Form vs. Matter).
  *   **Form Struggle:** The Registrar couldn't easily update – is it still the *statue*? The Insurer needed to know *what* was damaged – the statue's value or the clay's? The Conservator had to decide *what* to restore. (The indiscernibility problem: Same matter, location, but different properties – persistence over time/change).
  *   **Tribunal Tension:** You had to choose which "thing" the forms referred to, but both seem real! The rules (one object per slot, binding persistence) forced you to see they can't be identical to the same portion of matter *if* they have different persistence conditions. (Constitution is not identity; Modal differences – the clay could survive squashing, the statue couldn't).
  *   **Core Issue:** The statue *is constituted by* the clay *at this time*, but they are not identical because they have different historical origins (lump existed before shaping) and different possible futures (statue destroyed by squashing, clay persists). Constitution is a relation between co-located, materially coincident objects with different modal profiles.

  **Failure Modes**
  *   **Cheating the Forms:** Someone writes "Statue and Clay" in one slot. Enforce Rule 1 strictly: "The database only allows one entry per slot. Pick *one* object for this Accession #." If they try two Criteria, enforce Rule 2: "You defined *one* persistence condition at registration. Stick to it for the claim/conservation."
  *   **Avoiding the Paradox:** "It's just clay now!" Push: "But what about the insured *statue*? Did it cease to exist? When? What about the matter that was insured? Is *it* damaged?" Use the scale to emphasize matter persistence.
  *   **Time Crunch:** Keep Damage and Tribunal phases tight. Skip elaborate sculpting. Have pre-printed form fields.

  **What the Activity Can't Reproduce**
  *   **The Grounding Problem:** It won't deeply explore *how* or *why* distinct objects with different modal properties emerge from the same matter. You'll need to explain this metaphysical question arises from the puzzle.
  *   **Constitution vs. Coincidence:** It treats constitution as given. You must clarify that constitution is the specific relation proposed to explain coincidence (like statue/clay), distinct from mere overlap or temporal parts.
  *   **Full Modal Depth:** The activity focuses on one modal difference (persistence through deformation). You'll need to mention other modal properties (e.g., could the clay have been a different shape? Could the statue have been made of different matter?).
  *   **Temporal Parts Theory:** The activity presupposes enduring objects. You'll note that 4D/temporal parts views offer a different solution (one spatio-temporal worm with statue-like and lump-like temporal parts).
