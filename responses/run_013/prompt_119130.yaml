prompt: |-
  I'm a retired polymer chemist — 35 years in industry, mostly clay-filled composites and viscoelastic gels — and since I retired I've been sitting in on a continuing-ed philosophy seminar at the local university. It's about 14 of us, mostly retired professionals with no philosophy background, 75 minutes once a week. Next month it's my turn to run the session and I want to do the statue-and-clay problem, but not the usual bit-by-bit replacement version they've all heard. I've been reading alot about material constitution and I want them to feel the specific vertigo of it: the statue and the lump of clay seem to be in exactly the same place, made of exactly the same stuff, and yet they have different histories and different persistence conditions, so they can't simply be one thing. I've got a rough idea — a mock museum conservation tribunal where they have to decide what to do with a damaged clay figure and fill out registration and insurance forms that permit only one object per accession number, one persistence profile, one owner. But I don't want the forms to be gameable and I don't want to lecture first; the rules should force them into the contradiction before anyone says coincident objects or constitution is not identity.

  Can you design me the full runnable activity? Materials should be cheap (play-dough or air-dry clay, paper forms, maybe a toy scale), roles should be assigned, and there should be small in-room stakes rather than money. I need a 75-minute timeline, the exact rules, and a debrief that maps each moment back to the metaphysical issue — why the statue and the clay can't both be identical to the same thing, what work constitution does, and where the modal and essentialist questions come in. Also tell me what will predictably go wrong the first time I run it and how to handle that. Be frank about what the activity can't reproduce: I assume it can't give them the full grounding problem or the difference between coincidence and constitution, but say what I'll have to supply in the debrief.

  Keep the whole response under 900 words. Start with one sentence stating what they should feel by the end, then use headers for Materials, Roles, Rules, Timeline, Debrief, Failure Modes, and What the Activity Can't Reproduce. No names, no citations, no reading list — I can't use those anyway.
