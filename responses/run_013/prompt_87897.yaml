    "inconsistency_verdict": "genuine inconsistency",
    "inconsistency_explanation": "The 'negligible impact' claim denies a flight requires remedy, while the offset purchase treats the same flight's tonnage as requiring precise remedy; this conflates atmospheric irrelevance with moral relevance.",
    "rival_view_consequences": [
      "Drop 'climate-neutral' claims for flights",
      "Reframe offsets as reparations, not absolution",
      "Enforce flight reductions over offsets",
      "Admit individual acts reinforce harmful systems",
      "Reject counterfactual credits for physical removals",
      "Align food messaging with structural complicity"
    ],
    "confidence": 5
  }
  ``` 

  **Confidence Note**: Rated 5 because the inconsistency arises from first principles: Atomism requires marginal tons to matter morally, while the "negligible" claim denies they matter systemically. The offset ritual papers over this by treating the ton as *simultaneously* irrelevant (to the atmosphere) and relevant (to ethics)—a contradiction the complicity view avoids.
