prompt: |-
  At a long dinner last month I ended up as the audience for an argument between two friends of mine, Sofia and Ben, and I have been turning it over ever since. Ben had just come back from a year in a town where, as he kept putting it, 'nobody does anything the way we do,' and what began as a squabble about the tip screen on a card reader widened into queueing and jaywalking, so I'm giving you the whole thing rather than only the tipping part. I don't think I agree with either of them more than the other, and I suspect each of them is right about some moves and muddled about others, but I can't say which is which.

  (1) Ben: 'Tipping is not a moral matter at all. The server's wage is owed by the employer under the contract; what I owe is the price on the menu. A tip is a gift, and a gift you are obliged to give is not a gift. Calling me a bad person for leaving nothing is etiquette dressed up as ethics.' (2) Sofia: 'You don't get out of it that way. If the menu price is set on the assumption that a tip will arrive — and where employers are permitted to count expected tips against the wage, that is exactly what the price is — then paying the price and leaving nothing means knowingly taking a subsidized meal while the person who served it absorbs the shortfall. There is a difference between asking whether a practice is a good one and asking what you owe someone within a practice you have knowingly entered. Nor is this only about tipping: a queue is a coordination convention that works because nearly everyone keeps to it, and whoever ignores it collects the benefit of everyone else's restraint.' (3) Ben: 'Both halves of that prove too much. The free-riding point only bites if the practice is decent enough to deserve sustaining; if the real function of tipping is to let an employer push labor costs onto customers and make a server's income depend on the mood of strangers, then the customer who declines is not free-riding on anything worth preserving, and the party with the complaint is the employer. And the queueing point evaporates where the norm is already dead — at a crossing where everyone jaywalks there is no equilibrium to free-ride on, and the only reasons left are the law and my own neck.' (4) Sofia: 'Then drop the practice and talk about the person. It isn't the fairness of the institution that grounds the obligation; it is the position of the particular server, who eats the loss tonight and did not design the system. And that is exactly where the visitor question gets sharp, which is why your year abroad matters. The "queue" outside your bakery was not a line at all — it was a matter of catching the baker's eye — so a visitor who stood quietly at the back was not being polite, he was invisible, and he made the regulars uneasy because they could not tell whether he was waiting or loitering. When a visitor's own convention is not merely useless but a foreign body, deference to local practice is the modest move: local customs encode knowledge he does not have.' (5) Ben: 'Deference is a fine heuristic until it collides with something that matters. "Follow local conventions" gives you no filter whatsoever: it tells you to shove onto the bus because shoving is the local way and to leave the tip because leaving is the local way, and it would equally tell a visitor to keep quiet about a custom he finds cruel. It hands the majority a veto over the outsider's judgment. And knowability cuts against you rather than for you: the bakery case shows that a visitor can be blameless and still fail a norm he had no way to see. If an obligation depends on my being able to know it, the eye-contact queue cannot obligate a newcomer — the regulars' irritation is real, but it is not a moral complaint.' (6) Sofia: '"No way to see it" is a very low bar. He could have asked, or watched for ten minutes. Conventions are learned by participation, not by inspection. Insist that only fully legible norms bind and you get a rule that looks even-handed while quietly privileging the visitor's habits and making the locals do all the accommodating.'

  Please adjudicate this exchange point by point rather than announcing a winner: for each of the six moves, say what is right in it, what is wrong or overstated, and how much of it survives. I would also like your best attempt at the general rule that ought to govern what a visitor owes to local conventions — what, if anything, distinguishes the eye-contact bakery from the jaywalking crossing from the tip line, and whether the strength of the obligation tracks knowability, harm to particular people, the value of the coordination, or something else. Finally, tell me what both of them are missing that neither has raised, and then, if you have to, who is more nearly right overall.
reasoning: |-
  Hmm, the user presents a complex philosophical debate between Sofia and Ben about social conventions, tipping, queueing, and cultural norms. They want a point-by-point adjudication of each argument, followed by a synthesis of what distinguishes different conventions, and finally what both are missing.

  First, I need to unpack each of the six moves carefully. Ben starts with tipping not being a moral matter - he's right about legal obligations but overlooks the social reality of tip-dependent wages. Sofia counters with the free-rider problem, which is strong for functional conventions but overextends to defend broken systems. Ben's rebuttal about "proving too much" makes a crucial distinction between preserving good vs bad norms, though he underestimates how quickly norms can decay.

  Sofia's pivot to the individual server's vulnerability is powerful - real people bear the cost of opting out. Her bakery example brilliantly shows how invisible norms require visitor humility. Ben's "deference heuristic" critique is valid about majority tyranny but ignores that some conventions exist precisely because they solve local problems efficiently. Sofia's final point about learnability strikes me as the strongest - "no way to see" is indeed too low a bar when simple observation could clarify.

  For the general rule, I'm thinking of a three-axis framework: harm (does it hurt specific people?), coordination value (is this solving a collective problem?), and knowability (is it reasonably learnable?). Tipping fails on harm/coordination, bakery queueing scores high on all three, jaywalking depends entirely on context. 

  The big missing piece is power asymmetry. Neither mentions how conventions often serve dominant groups - tipping persists because restaurants lobby for it, not because it's optimal. Also missing: conventions as evolving negotiations rather than fixed rules. Overall, Sofia has better diagnosis of how norms actually function in communities, while Ben's skepticism is healthy but sometimes atomistic. His year abroad seems to have made him overcorrect against cultural relativism.

  The user seems intellectually sophisticated - they're sitting with this debate for weeks, comfortable with nuance. Probably wants more than "both have points" platitudes. I should honor that by being precise about where each argument holds or fractures, especially on the bakery/jaywalking comparisons. The power dynamics angle might resonate given they framed this as dinner-table witnessing of privilege ("visitor question").
answer: |-
  Here's a point-by-point adjudication of the exchange, followed by a proposed general rule, identification of missing elements, and an overall assessment:

  **Adjudication Point-by-Point:**

  1.  **Ben (Tipping as a Gift, Not Obligation):**
      *   **Right:** Correctly distinguishes legal contract (employer owes wage) from social convention (tipping). Highlights the tension where social pressure ("bad person") masquerades as ethics when the obligation is manufactured. Identifies that a coerced "gift" is not truly a gift.
      *   **Wrong/Overstated:** Overly simplistic. Ignores the *de facto* economic reality in many jurisdictions where menu prices *are* set assuming tips subsidize wages ("tip credit"), making the server's livelihood dependent on tips regardless of the legal contract. Frames the issue purely individualistically, neglecting the systemic interdependence.
      *   **Survives:** The core distinction between legal obligation and social convention/pressure. The critique of social pressure disguising itself as absolute moral duty.

  2.  **Sofia (Free-Riding & Institutional Assumptions):**
      *   **Right:** Accurately identifies the free-rider problem inherent in opting out of functional coordination conventions (tipping, queueing) – benefiting from others' adherence without contributing. Correctly points out that knowingly participating in a system (entering a restaurant, joining a queue) creates obligations *within that system*, even if the system itself is flawed. The bakery queue example powerfully illustrates how a visitor's ignorance can disrupt a functional local convention.
      *   **Wrong/Overstated:** Assumes tipping *is* a functional coordination convention worth sustaining, which Ben challenges. Can be seen as defending the *status quo* of a potentially exploitative system ("server absorbs the shortfall") by placing the moral onus solely on the customer.
      *   **Survives:** The robust argument about free-riding within functional coordination schemes. The crucial point about obligations arising from participation in a known practice. The insight that local conventions encode valuable, often invisible, practical knowledge.

  3.  **Ben (Critique of Free-Riding & Dead Norms):**
      *   **Right:** Correctly demands evaluation of the *value* and *function* of the convention itself. A free-rider argument only holds if the thing being free-ridden upon is good or necessary. Provides a strong counter if tipping is inherently exploitative. Correctly identifies that a norm (like jaywalking) loses its coordination function and moral force if universally ignored – there's nothing left to free-ride *on*.
      *   **Wrong/Overstated:** Overstates the ease with which a norm is "dead" (e.g., universal jaywalking might still have coordination elements). Risks dismissing *any* convention as potentially illegitimate without sufficient criteria. Underestimates the harm to the *individual server* even within a bad system. Shifts the "complaint" entirely to the employer, neglecting the server's immediate, real loss.
      *   **Survives:** The vital qualification that free-riding arguments require the convention to be worth preserving. The insight that norms lose moral force when they cease to function as coordination devices.

  4.  **Sofia (Focus on the Individual & Deference to Local Knowledge):**
      *   **Right:** Shifts focus powerfully to the *concrete, immediate harm* to an individual (the server) who bears the cost of the customer's opting out and lacks power to change the system. The bakery example brilliantly demonstrates that ignorance of a local convention doesn't excuse disruption; deference (observing, asking) is necessary to avoid harm (making regulars uneasy) and access the encoded local knowledge. "Foreign body" is an apt metaphor.
      *   **Wrong/Overstated:** Could be interpreted as demanding deference to *any* local practice, regardless of its own morality. Doesn't fully address Ben's point about the potential immorality *of the tipping system itself*. The obligation to the individual server might feel compelling, but its grounding is less clear-cut than coordination norms.
      *   **Survives:** The compelling moral claim arising from causing direct, foreseeable harm to a vulnerable individual within a system. The strong argument for deference to local conventions as a means to access local knowledge and avoid unintentional harm/disruption.

  5.  **Ben (Critique of Deference & Knowability):**
      *   **Right:** Correctly identifies the potential tyranny and moral abdication inherent in an unqualified "follow local conventions" rule ("shoving on the bus," tolerating cruelty). Highlights the legitimate concern about majority veto over an outsider's ethical judgment. Correctly points out that if an obligation requires knowability, genuinely opaque norms (like the eye-contact queue) cannot bind a newcomer – the regulars' irritation might be practical, not moral.
      *   **Wrong/Overstated:** Overstates the opacity of many conventions (like the bakery queue – watching *would* likely reveal it). Underestimates the visitor's responsibility to make a *reasonable effort* to learn. Risks promoting cultural insensitivity and dismissing local solutions ("shoving") that may be functional in context.
      *   **Survives:** The crucial warning against blind deference to potentially harmful or immoral local practices. The valid point that an obligation must be reasonably knowable to be binding. The distinction between social inconvenience/disruption and genuine moral wrong.

  6.  **Sofia (Knowability Threshold & Asymmetry):**
      *   **Right:** Correctly identifies that "no way to see it" is too low a threshold; a reasonable effort (watching, asking) is required of the visitor. Insightfully points out that participation, not detached inspection, is how conventions are learned. Exposes the hidden asymmetry in demanding "fully legible norms": it privileges the visitor's habits and forces locals to constantly accommodate clueless outsiders, which is itself unfair.
      *   **Wrong/Overstated:** Could downplay genuine cases of extreme opacity. Doesn't fully engage with Ben's point about potentially immoral local norms.
      *   **Survives:** The powerful argument that visitors have a responsibility to make a *reasonable effort* to learn local conventions. The devastating critique of the hidden privilege and unfair burden-shifting inherent in demanding perfect legibility before feeling bound.

  **The General Rule for Visitors:**

  A visitor's obligation to follow a local convention depends on a confluence of factors, not a single axis:

  1.  **Harm to Specific Individuals:** Does breaking the convention cause direct, foreseeable, and non-trivial harm to identifiable individuals (e.g., server losing income, queue-jumper causing delay/frustration)? This creates the strongest obligation. *(Strongest in tipping/server case, absent in dead jaywalking norm, moderate in bakery - causing unease/disruption)*.
  2.  **Coordination Value & Free-Riding:** Is the convention solving a genuine coordination problem, and is it widely adhered to enough to function? Does breaking it constitute free-riding (benefiting from others' adherence without contributing)? *(Strong in functional queues, weak/absent in dead jaywalking norm, contested in tipping - depends on view of system value).*
  3.  **Knowability & Reasonable Effort:** Is the convention reasonably learnable through basic observation, inquiry, or common sense? The visitor has a responsibility to make a *reasonable effort* to learn. *(High in bakery queue - watching reveals pattern, High in tipping - widely known expectation, Variable in jaywalking - depends on observable behavior).*
  4.  **Intrinsic Morality of the Convention:** Does the convention itself violate fundamental moral principles (e.g., cruelty, discrimination)? This can override or weaken the obligation to follow it, potentially creating an obligation to *resist*. *(Critical filter - overrides deference if convention is inherently wrong).*

  **Distinguishing the Cases:**

  *   **Eye-Contact Bakery:** High coordination value (efficient, functional), moderate harm (disruption, unease), high knowability (observable with reasonable effort). **Strong obligation to learn and defer.**
  *   **Jaywalking Crossing (Dead Norm):** No coordination value (no functional norm exists), no harm (if truly everyone does it safely), irrelevant knowability. **No obligation beyond safety/law.**
  *   **Tipping:** Contested coordination value (is it functional or exploitative?), high potential harm to specific individuals (server's income), high knowability (well-known expectation). **Obligation strongest if viewed as preventing individual harm within a known system, weaker if viewed as propping up an immoral system.** The harm argument often prevails in the immediate context.

  **What Both Are Missing:**

  1.  **Power Dynamics & Systemic Justice:** Both largely ignore the structural power imbalances baked into conventions like tipping. The system exists because employers benefit by shifting costs and risk onto servers and customers. The debate focuses on the customer-server dyad rather than challenging the employer's role or advocating for systemic change (e.g., living wages). Sofia touches on the server's vulnerability but doesn't trace it back fully; Ben critiques the system but absolves himself without proposing alternatives.
  2.  **Convention as Evolving Practice:** They treat conventions as static. Conventions evolve through practice, negotiation, and challenge. A visitor's confusion (like at the bakery) or refusal (like Ben on tipping) *can* be part of that evolution, though it needs careful consideration of harm.
  3.  **Gradations of Participation:** The debate is binary (tip/don't, queue/jump). There are often degrees of participation or compromise (e.g., a smaller tip, signaling politely in the bakery).
  4.  **Positive Reciprocity:** Both focus on avoiding harm/free-riding. Less emphasis is placed on the positive value of participating in local ways as a form of respect, building rapport, or enriching the visitor's experience.

  **Overall Assessment:**

  While both make valuable and often complementary points, **Sofia is more nearly right overall**. Her arguments consistently grapple with the practical reality of social coordination, the tangible harm caused to individuals by opting out, the responsibility of participants within a system, and the visitor's duty to make reasonable efforts to learn and defer to local knowledge (especially in cases like the bakery). Ben's skepticism is vital for challenging unjust systems and guarding against blind conformity, but he often underestimates the harm to vulnerable individuals, the value of functional coordination, and the reasonable responsibility of a visitor to learn local ways. His "contract only" view of tipping is particularly inadequate in the face of the economic reality for servers. Sofia provides a more compelling framework for navigating the messy reality of social conventions, especially for a visitor.
