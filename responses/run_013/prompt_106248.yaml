prompt: |-
  I've been reading rationalist blogs and forums for the better part of a decade — the Sequences, the long decision-theory threads, the recurring arguments about whether Bayesianism is a complete normative theory of belief or only a fragment of one — and I've decided to stop lurking and spend roughly two years doing serious independent work on one corner of formal epistemology: the theory of uncertain evidence, meaning the cluster of questions surrounding Jeffrey conditionalization and its rivals. I have a decent grounding in probability and a lot of patience, but no lab, no dataset, and no interest in producing yet another survey that re-derives the rule P'(A) = Σᵢ P'(Eᵢ)·P(A | Eᵢ) and declares victory. What I want from you is an agenda: since I can realistically pursue only a handful of these questions, which are most worth the years, and on what grounds?

  To make this concrete, here are the candidates I keep circling, stated roughly as I understand them: (a) the fact that Jeffrey conditioning is not commutative — receiving uncertain evidence in different orders can leave you with different posteriors — and what that implies about whether the rule is even well-defined over a stream of observations; (b) the rigidity assumption, that conditional probabilities within the partition stay fixed through the update, and whether it is a substantive commitment or a harmless bookkeeping convention; (c) whether genuinely uncertain evidence exists at all, or whether every such case can be reconstructed as certain evidence about one's own experiences, and what that reconstruction costs; (d) how uncertain evidence connects to the problem of old evidence and to the reflection principle; (e) whether probability kinematics is the right framework in the first place, or whether constraint-based updating — maximum entropy, superconditioning-style treatments, or keeping a set of distributions rather than a single one — does the job better, and what would adjudicate between them; and (f) the suspicion that the whole problem is an artifact of representing evidence as propositions, so that a proper theory would traffic in constraints on credences instead. My real motivation is downstream: I care about how an ideal reasoner, or a machine, should absorb a noisy stream of observations that never arrives as a clean proposition, and I suspect the standard formalisms quietly presuppose the very thing they are meant to explain.

  Please don't hand me a reading list or a neutral survey; I want a defended agenda. Which of these — or something I'm not seeing — is upstream of the others, which are tractable for one person with two years, which are neglected, and which only look important and would not actually change much downstream? Commit to an ordering and tell me what would move an item up or down. Structure the response as follows: a Summary of a few sentences stating the ranking; then The Candidates, a short paragraph on each open question in your own terms, including any I've missed that deserves a place; then The Ranking, the bulk of the response, one subsection per item in order, each defending its position by appeal to importance, tractability, neglectedness, and how many other questions depend on it; then What Would Change the Ranking, naming the specific results, arguments, or counterexamples that would reorder things; and finally What to Skip, listing the lines of work here that you take to be overrated or a dead end, with reasons.
reasoning: |-
  Okay, let me start by really understanding what this user is asking. They've been deep into rationalist blogs and formal epistemology for a decade, focusing on uncertain evidence and Jeffrey conditioning. Now they want to dedicate two years to independent research but need a prioritized agenda. Their concrete questions revolve around commutativity, rigidity, the existence of uncertain evidence, connections to old evidence and reflection, alternative frameworks like maximum entropy, and the propositional vs. constraint-based representation.

  First, I need to assess their background. They mention a solid grounding in probability and patience, no lab or dataset. So their work will be theoretical. Their downstream goal is about how an ideal reasoner absorbs noisy data, which suggests they care about practical applicability in AI or decision-making. The skepticism about standard formalisms presupposing what they explain is key—they want foundational clarity.

  Looking at their questions, I should determine which are upstream. For example, (f) challenges the core representation of evidence. If evidence isn't propositions, that affects everything else. Then (c) questions if uncertain evidence exists, which ties into whether Jeffrey's framework is necessary. These seem foundational. 

  Tractability matters. (a) on commutativity might be too narrow, while (b) rigidity is debated but maybe not as central. Neglectedness: (f) and constraint-based approaches are gaining traction but still underexplored. (e) has existing work but needs evaluation against real problems.

  Downstream impact: Resolving (f) could make other questions obsolete. Connecting uncertain evidence to old evidence (d) might be less critical if the foundation shifts. Also, their interest in machine reasoning suggests frameworks like imprecise probabilities or constraints are more relevant than commutativity.

  I should check if any areas are overrated. Surveys re-deriving P' are mentioned as undesired. Rigidity debates might be a dead end if representation changes. Commutativity might not matter if updates aren't sequential in practice.

  Ranking: Start with (f) as most upstream, then (c) to validate the need for Jeffrey's approach. (e) follows as alternatives. (d) connects to broader issues. (b) and (a) come lower. Skipping rigidity debates and commutativity as less impactful.

  What could change ranking? If a new formalism unifies evidence representation, (f) drops. If Bayesian updates handle noise, (c) becomes irrelevant. Empirical results in cognitive science or AI could elevate (e)'s importance.
answer: |-
  ## Research Agenda for Uncertain Evidence: A Defended Prioritization

  **Summary:**  
  Prioritize questions that interrogate the *foundations* of evidence representation and updating frameworks, as these determine the viability of the entire enterprise. Focus on **constraint-based alternatives to propositional evidence (f)** as the most upstream lever, followed by **existence/decomposition of uncertain evidence (c)** and **framework viability (e)**. These address your core concern that standard formalisms presuppose what they should explain. Avoid narrow technical puzzles (a, b) unless they emerge as critical stress tests for your preferred framework. Skip debates about commutativity (a) and rigidity (b) as secondary; they are symptoms, not causes, of deeper issues.

  ---

  ### The Candidates (Reframed & Expanded)

  *   **(a) Commutativity Failure:** Does the order-dependence of Jeffrey updates reveal a fundamental flaw, or is it an acceptable feature of non-commutative belief revision? (Tractable, but likely a consequence of deeper assumptions).
  *   **(b) Rigidity Assumption:** Is holding `P(A|E_i)` fixed during update a necessary axiom for uncertain evidence, an operational convenience, or a substantive (and potentially false) claim about how experience affects beliefs? (Perennially debated, but possibly a red herring).
  *   **(c) Existence/Decomposability:** Can "uncertain evidence" ever be irreducible, or is it *always* certain evidence about sensory states/subjective experiences? What is lost (e.g., objectivity, public evidence, computational tractability) in the decomposition? (Core metaphysical/epistemological challenge).
  *   **(d) Connections (Old Evidence/Reflection):** How does uncertain evidence interact with the problem of justifying belief in long-held evidence (Old Evidence) and the principle that current beliefs should defer to anticipated future beliefs (Reflection)? (Important synthesis, but depends on prior choices).
  *   **(e) Framework Competition:** Do rival frameworks (MaxEnt, Imprecise Probabilities / Credal Sets, Superconditioning) handle noisy streams, ambiguity, and deep uncertainty better than probability kinematics? What criteria (accuracy, calibration, robustness, cognitive plausibility, computational efficiency) should decide? (Critical practical evaluation).
  *   **(f) Evidence Representation:** Is the root problem the *propositional* representation of evidence? Should we instead directly model evidence as *constraints* on credence functions (e.g., "shift P(H) towards 0.7") or *inputs* to a belief revision operator? (Most upstream, foundational challenge).
  *   **(g) Missed: The Learning Problem:** How do these formalisms perform under *repeated* noisy updates? What are convergence guarantees, rates, and vulnerabilities to misleading evidence streams? Connects to online learning theory. (Crucial for your "noisy stream" motivation).
  *   **(h) Missed: Cognitive/Mechanistic Plausibility:** What do these rules imply about the *process* of absorbing evidence? Are they feasible for bounded agents? What might a mechanistic (neural/algorithmic) implementation look like? (Links formalism to real reasoning).

  ---

  ### The Ranking (Justified)

  1.  **(f) Evidence Representation (Constraints vs. Propositions):**  
      *   **Why #1 (Upstream):** This is the bedrock. If representing evidence as propositions (`E_i`) is fundamentally flawed for noisy/uncertain inputs, then Jeffrey conditioning (and commutativity/rigidity debates) addresses a mis-specified problem. Your core suspicion – that formalisms presuppose clean propositions – targets this directly. Exploring constraint-based views (e.g., Jeffrey's rule as implementing *linear shift constraints* `P'(A) = Σᵢ P'(Eᵢ)P(A|Eᵢ)`, or MaxEnt imposing expectation constraints) reframes the entire endeavor.
      *   **Tractability:** Conceptual and formal work. Requires analyzing different constraint types (linear, entropy-based, bounds), their expressiveness for representing "noisy observations," and the update rules they induce. Well-suited for theoretical exploration.
      *   **Neglectedness:** While recognized (e.g., in discussions of "input parameters"), a systematic treatment of evidence *as constraints* is less common than rehashing propositional formulations. The implications for machine reasoning are underexplored.
      *   **Downstream Impact:** Resolving this potentially dissolves or radically transforms (a), (b), (c), and informs (e). It dictates what "uncertain evidence" even *is* for formalism. Highest leverage.
      *   **Connects to:** (c) (If evidence=constraint, does decomposition still apply?), (e) (Alternative frameworks are often constraint-based), (g) (How do constraint-based rules learn over time?).

  2.  **(c) Existence/Decomposability of Uncertain Evidence:**  
      *   **Why #2 (Foundational Justification):** If all uncertain evidence *can* be cleanly reduced to certain evidence about subjective states (e.g., "I seem to see a red flash"), then Jeffrey conditioning is merely a computational shortcut, not a fundamental extension of Bayesianism. If it *cannot*, then Jeffrey conditioning (or a rival) is essential. This determines if the field addresses a genuine phenomenon.
      *   **Tractability:** Philosophical analysis combined with formal modeling of the decomposition process. Requires examining cases where the reduction seems forced or loses critical information (e.g., public, ambiguous evidence; innate priors on experiences). Can leverage decision theory (how bets are framed).
      *   **Neglectedness:** Often glossed over or assumed away. A rigorous defense of irreducibility (or a clear cost-benefit analysis of decomposition) is valuable. Your "cost" angle is key.
      *   **Downstream Impact:** Undermining reducibility strengthens the case for needing *some* framework like (e) and validates the focus on (f). If reducible, much work becomes optional optimization.
      *   **Connects to:** (f) (Constraints might better capture irreducible evidence), (d) (Decomposition impacts "old" experiential evidence).

  3.  **(e) Framework Competition (MaxEnt, Credal Sets, etc.):**  
      *   **Why #3 (Practical Viability):** Given potential issues with propositional evidence (f) and the possible irreducibility of uncertain evidence (c), *how* should an agent actually update? Probability kinematics is one answer. Rigorously comparing its performance against rivals on criteria relevant to your "noisy stream for a machine" goal is essential.
      *   **Tractability:** Formal comparison is feasible: Define desiderata (e.g., handling conflicting evidence, robustness to prior misspecification, convergence speed on noisy streams (g), computational cost). Analyze how different rules (Jeffrey, MaxEnt, Lexicographic, IP-based updates like Generalized Bayes) perform. Requires diving into IP/MaxEnt literature.
      *   **Neglectedness:** While comparisons exist, they often focus on narrow technical points or philosophical preferences. A systematic evaluation focused on *online learning from noisy data* is less common and highly relevant for AI.
      *   **Downstream Impact:** Directly answers your "how should a machine absorb a noisy stream" question. Informs if Jeffrey is sufficient or if alternatives are superior. Results here could make (a) and (b) irrelevant for practical purposes.
      *   **Connects to:** (f) (How frameworks interpret evidence), (g) (Learning performance is key), (h) (Computational plausibility).

  4.  **(g) The Learning Problem (Repeated Updates):**  
      *   **Why #4 (Core Motivation):** Your stated goal centers on a "noisy stream of observations." How do these update rules behave *over time*? Do they converge to truth under reasonable conditions? How fast? Are they easily misled? This is where formalism meets application.
      *   **Tractability:** Requires applying techniques from stochastic processes, online learning theory, and probability. Analyzing convergence for different rules under various noise models (e.g., i.i.d., adversarial-ish) is challenging but feasible theoretically. Simulation can supplement.
      *   **Neglectedness:** Convergence properties of Jeffrey updates are less studied than Bayesian updates. Analysis of IP/MaxEnt rules in sequential noisy settings is an active but open area. High value for validation.
      *   **Downstream Impact:** Provides concrete criteria to judge frameworks (e). Justifies or undermines their use for long-term learning. Connects deeply to your motivation.
      *   **Connects to:** (e) (Performance evaluation), (f) (How evidence representation impacts learning).

  5.  **(d) Connections (Old Evidence/Reflection):**  
      *   **Why #5 (Synthesis & Stress Test):** How does "uncertain evidence" interact with these deep puzzles? Can uncertain evidence be "old"? Does updating on anticipated uncertain future evidence obey Reflection? Tests the coherence and implications of your chosen framework(s) from (f), (c), (e).
      *   **Tractability:** Conceptual and formal analysis. Requires carefully modeling these scenarios within the chosen evidence representation and update rule(s). Less technically demanding than (g), but requires deep thought.
      *   **Neglectedness:** The connection between uncertain evidence and old evidence is rarely explored explicitly. Its link to Reflection is also underexamined.
      *   **Downstream Impact:** Provides deeper philosophical validation and uncovers potential weaknesses or insights in the formalisms. Less directly about the noisy stream, but crucial for foundational robustness.
      *   **Connects to:** (c) (Decomposition affects "old" evidence status), (f)/(e) (Framework determines how these puzzles manifest).

  6.  **(b) Rigidity Assumption:**  
      *   **Why #6 (Conditional):** Rigidity is likely a *consequence* of the propositional evidence model (f) and the linear shift constraint it implies. If you adopt a different evidence representation (f) or framework (e), rigidity might not arise or take a different form. Investigate this *only* if your work on (f) and (e) leaves it unresolved and relevant.
      *   **Tractability:** Well-trodden path. Arguments exist on both sides (convention vs. substantive). Relatively easy to survey and contribute to.
      *   **Neglectedness:** Not neglected; frequently debated. New angles could come from (f) or (c).
      *   **Downstream Impact:** Primarily internal to probability kinematics. If rigidity fails, it undermines standard Jeffrey but not necessarily constraint-based rivals (e). Lower leverage than above.
      *   **Connects to:** (f) (If evidence isn't propositional, rigidity may not apply), (e) (Do alternatives need rigidity?).

  7.  **(a) Commutativity Failure:**  
      *   **Why #7 (Least Critical):** Order-dependence is a known quirk of Jeffrey conditioning. Its *significance* depends entirely on prior choices: Is commutativity a necessary desideratum? (Often not for non-commutative operations). Does it reveal a flaw, or just reflect path-dependence in belief revision? Focus here is unlikely to yield fundamental insights compared to (f), (c), (e).
      *   **Tractability:** Easy to demonstrate formally. Harder to draw deep conclusions.
      *   **Neglectedness:** Well-known and discussed. Solutions exist (e.g., Pearl's virtual evidence) but often presuppose propositional evidence.
      *   **Downstream Impact:** Minimal. Primarily a technical caveat for a specific rule (Jeffrey), which might be superseded by your work on (e) and (f). Least leverage on your core goals.
      *   **Connects to:** (b) (Rigidity contributes to non-commutativity), (f) (Constraint-based rules may commute or not under different logics).

  ---

  ### What Would Change the Ranking

  1.  **Breakthrough on (f):** If you discover (or find) a compelling, general, non-propositional formalism for evidence (e.g., a robust "constraint language") that cleanly handles noisy inputs and subsumes standard cases, this could become the *framework* and shift focus to (e) (implementing it) and (g) (testing it). Conversely, if you conclusively show constraints offer no real advantage over careful propositional modeling, (f) drops significantly.
  2.  **Resolution of (c):** A definitive argument (with wide acceptance) that uncertain evidence *is* always reducible to certain evidence would drastically reduce the importance of (e), (f), (g) – the field becomes an exercise in efficient computation. Conversely, a strong proof of irreducibility elevates (c) and all dependent topics.
  3.  **Empirical/Mechanistic Results (h):** Significant findings from cognitive science or neuroscience about how humans/animals actually integrate noisy evidence could elevate (h) and force a reevaluation of all formalisms (e) based on plausibility, potentially changing their ranking.
  4.  **Strong Results in (g):** If analysis of the learning problem reveals a specific framework (e) has dramatically superior convergence or robustness properties for noisy streams, this could elevate (e) and (g) above (c) and (f) in practical importance.
  5.  **Failure of Alternatives (e):** If rigorous analysis shows MaxEnt, IP, etc., have fatal flaws (e.g., poor calibration, computational intractability, pathological learning (g)) in the noisy stream context, it strengthens the case for refining Jeffrey-like approaches, potentially elevating (b) or (a) as stress tests within that paradigm.

  ---

  ### What to Skip (With Reasons)

  1.  **Deep Dives into Commutativity (a) for its Own Sake:** *Reason:* It's a known, specific technical property of one rule (Jeffrey). Fixes exist if needed, and its fundamental importance is low. Understanding *why* it happens (via f/b) is more valuable than cataloging its manifestations. Your time is better spent on foundational or evaluative work.
  2.  **Endless Rehashing of the Rigidity Debate (b) in Isolation:** *Reason:* The debate often circles philosophical preferences without clear resolution or significant downstream consequences for other problems. Its relevance *depends* on your choices about (f) and (e). If you adopt a non-Jeffrey framework (e) or a non-propositional evidence model (f), rigidity may be moot. Engaging deeply here is likely a low-return time sink unless directly required by your core findings.
  3.  **Comprehensive Surveys Re-deriving Standard Results:** *Reason:* You explicitly don't want this, and rightly so. Existing literature covers the basics. Focus only on surveying aspects directly relevant to your chosen deep dives (f, c, e, g).
  4.  **Highly Abstract Axiomatic Justifications Disconnected from Learning/Mechanisms:** *Reason:* While foundational work is key, prioritize axiomatic work that *directly* informs your core questions about evidence representation (f) or framework performance (e, g). Avoid purely abstract explorations divorced from the problem of noisy evidence streams or machine reasoning.
  5.  **Over-Investment in "Solving" Old Evidence/Reflection (d) First:** *Reason:* These are important synthesis points, but tackling them *before* settling core issues about evidence and updating (f, c, e) risks building castles on sand. Address them later to *test* your developed framework, not as primary objectives.

  **Your Path Forward:** Start by attacking **(f)** – rigorously formalize the propositional evidence model's limitations for noisy inputs and explore constraint-based alternatives. Simultaneously interrogate **(c)** – can you construct a compelling case (formal or philosophical) for irreducible uncertain evidence that *necessitates* a Jeffrey-like approach or its rivals? Use insights from (f) and (c) to fuel a rigorous comparative evaluation **(e)** of frameworks (including Jeffrey, MaxEnt, IP) focused on performance under noisy streams **(g)**. This sequence maximizes leverage on the foundations while directly serving your practical goal of informing machine reasoning. Good luck!
