answer: |-
  Anscombe's absolutist prohibition on the intentional killing of the innocent, grounded in her Thomistic natural law framework, yields a stark verdict on Hiroshima and Nagasaki, while creating significant tension with other wartime policies. Here's the rigorous mapping you requested:

  ### 1. **Description of the Chosen Deaths & Application of Double Effect (DDE)**
     - **Under What Description Were Deaths Chosen?**  
       The deaths of civilians were *intended as a means* to compel Japan's surrender by demonstrating catastrophic destructive power and shattering national morale. Strategic documents (e.g., Target Committee minutes, Truman’s diary) confirm civilians were not collateral damage in a military strike, but the *primary instrument* of psychological and political coercion. The bombs were dropped on entire cities to maximize shock value through mass civilian casualties.
     
     - **Does DDE Rescue the Bombings?**  
       **No.** DDE requires four conditions:  
       (a) The act itself must be good or neutral (e.g., destroying military infrastructure).  
       (b) The bad effect (civilian deaths) must not be *intended*.  
       (c) The good effect (ending the war) must flow from the act, not the bad effect.  
       (d) Proportionality between good and bad effects.  
       **Failure on (b) and (c):** Civilian deaths *were* the mechanism of coercion. The good effect (surrender) relied *causally* on the bad effect (mass killing). The act’s "good" aspect (destroying war industry) was incidental; the cities were chosen precisely to kill non-combatants en masse. Intention cannot be sanitized by labeling the target "military-industrial" when 90% of casualties were civilians.

  ### 2. **Comparison with Firebombing and Blockade**
     - **Firebombing (e.g., Tokyo):**  
       Similar to atomic bombing: Civilians were *intentionally* targeted to destroy morale and infrastructure. Incendiary raids had no precision; the means (area bombing) inherently involved mass civilian killing as a goal. **Anscombe condemns both equally.** Her objection to Truman’s honorary degree at Oxford cited *all* WWII city bombing as mass murder.
     
     - **Naval Blockade:**  
       Here, civilian deaths *might* satisfy DDE:  
       - **Act:** Blockading military supplies (prima facie legitimate).  
       - **Foreseen but Unintended:** Civilian starvation is a foreseen *side effect* of disabling Japan’s war economy, not the chosen means of surrender. Surrender results from military incapacity, not terrorizing civilians.  
       **Anscombe *might* permit this** if proportionality is met and alternatives are exhausted. She accepted that war inevitably causes unintended civilian death, but forbade *using* innocents as tools.

     - **Is This Distinction a *Reductio*?**  
       Logically consistent in theory, but strained in practice. Blockades foreseeably cause mass starvation; the line between "intending" civilian suffering as a means versus "accepting" it as a side effect is razor-thin. If a blockade’s *efficacy* depends on civilian desperation pressuring leaders, intention blurs. Yet Anscombe’s absolutism demands this distinction: **The blockade escapes condemnation only if policymakers truly sought to avoid civilian harm and did not *rely* on it.**

  ### 3. **The "Greater Good" Defense**
     - **Not Available to Anscombe.** Her absolutism rejects *all* consequentialist justifications for intentional killing. Even if the bombings averted a bloody invasion (a contested claim), they remain intrinsically evil. She wrote: "*It can never be right to choose to kill an innocent person, however bad the consequences of not doing so*" (*Modern Moral Philosophy*). The "ends justify the means" is precisely the utilitarianism she denounced.

  ### 4. **Relevance of Historical Necessity**
     - **Irrelevant on Her View.** Whether the bombings were "necessary" is a consequentialist question. For Anscombe, if an act intrinsically involves murder (intentional killing of innocents), necessity cannot excuse it. She would reject the *premise* that such an act could ever be necessary, as it violates absolute moral law.

  ### Verdict: **Her Absolutism Survives Intact but Exposes a Critical Tension**
     - **Survives Intact:** The bombings (and firebombing) clearly violate her prohibition. Truman’s intent to use civilian annihilation as a weapon places this act in the category of murder, irrespective of outcomes. DDE cannot sanitize it.  
     - **The Tension:** The blockade comparison reveals the fragility of the intended/foreseen distinction in total war. While theoretically defensible, it risks moralism—imputing purity of intention where policymakers likely *welcomed* civilian suffering as coercive. Yet Anscombe would insist: **Morality demands we discern intentions, even when consequences seem similar.**  
     - **Conclusion:** Her framework condemns the bombings unequivocally and consistently. However, it struggles to convincingly exonerate the blockade without appearing overly lenient on *systemic* foreseen harm. This is not a *reductio* but a limitation: Absolutism draws bright lines that may seem arbitrary in war’s fog, yet it refuses to conflate *actively targeting innocents* with *accepting their tragic deaths*. It survives Hiroshima not by practicality, but by its unwavering refusal to permit murder for any cause. For a scientist, this may feel like moral geometry ignoring empirical chaos—but for Anscombe, that’s the point: Consequences don’t alter intrinsic wrongs.
