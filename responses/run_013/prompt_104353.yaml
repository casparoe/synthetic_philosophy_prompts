prompt: |-
  I'm running a session for a reading group of philosophy grad students who are comfortable with basic probability but have never seen decision theory. I need to teach Aumann's agreement theorem in about a hour, and I don't want to just state it — I want them to feel why common knowledge and the common prior are doing all the work. Plan the explanation for me: what has to come first, what the carrying example should be, the misconceptions they'll have (I'm guessing they'll say it proves rational people can't disagree, and that common knowledge just means both know), where in the sequence I should head each one off, and one question I can ask at the end to see if it landed. I want to build it around a made-up case I've been calling the sealed-envelope forecasters: two people each get a private signal about the same coin, write down a posterior on a card, and a referee reads both cards aloud. Make the plan work for that case, and tell me what I should leave out at this level.
reasoning: |-
  We are going to explain Aumann's agreement theorem using the "sealed-envelope forecasters" example. The goal is to show that if two rational agents have the same prior and their posteriors are common knowledge, then they must agree, even if they have different private information.

  Key concepts to cover:
  1. Prior and posterior probabilities.
  2. Private information (signals) and how they update beliefs.
  3. Common knowledge: Not just that both know, but that both know that both know, and so on ad infinitum.
  4. The idea that common knowledge of posteriors (and a common prior) forces agreement.

  We'll build up the example step by step.

  **Plan:**

  1. **Set up the scenario: The Coin and the Envelopes (5 minutes)**
     - A fair coin is flipped. The outcome is either Heads (H) or Tails (T), each with prior probability 0.5.
     - Two forecasters, Alice and Bob, each receive a private signal about the coin.
     - The signals are independent conditional on the coin flip.
     - We'll choose a specific signal structure. For simplicity, let each signal be a color: Red (R) or Blue (B).
     - Conditional probabilities:
          P(Alice sees R | H) = 2/3, P(Alice sees B | H) = 1/3
          P(Alice sees R | T) = 1/3, P(Alice sees B | T) = 2/3
          Similarly for Bob: same as Alice, and independent given the coin.

     Why this structure? It's symmetric and the signals are informative but not deterministic.

  2. **Compute the posteriors for each possible signal (10 minutes)**
     - Let the students help compute the posterior for Alice when she sees R:
          P(H | Alice sees R) = P(Alice sees R | H) * P(H) / P(Alice sees R)
          P(Alice sees R) = P(Alice sees R | H)*P(H) + P(Alice sees R | T)*P(T) = (2/3)(1/2) + (1/3)(1/2) = 1/2
          So, P(H | R) = (2/3 * 1/2) / (1/2) = 2/3.

     - Similarly, if Alice sees B: 
          P(H | B) = (1/3 * 1/2) / (1/2) = 1/3.

     - Bob has the same updating.

     - Now, note: if Alice sees R, she writes 2/3 on her card. If she sees B, she writes 1/3.

  3. **The Referee Reads the Cards (5 minutes)**
     - The forecasters write their posteriors on their cards without communicating. The referee collects the cards and reads both aloud. Now both Alice and Bob hear each other's posterior.

  4. **The Update After Hearing (10 minutes)**
     - Now, we ask: after hearing the other's posterior, should they update their own belief?
     - Example: Suppose Alice saw R (so she wrote 2/3). Bob also wrote 2/3. What does that tell Alice?
       - Alice knows: Bob must have seen R (because if Bob saw B, he would have written 1/3). So now Alice knows that Bob saw R. How does that change her belief?
          - Initially, Alice's posterior was 2/3. Now she knows that both she and Bob saw R. What is P(H | both saw R)?
          - We compute:
              P(both R | H) = (2/3)*(2/3) = 4/9
              P(both R | T) = (1/3)*(1/3) = 1/9
              P(both R) = P(both R | H)*P(H) + P(both R | T)*P(T) = (4/9)(1/2) + (1/9)(1/2) = 5/18
              P(H | both R) = (4/9 * 1/2) / (5/18) = (4/18) / (5/18) = 4/5.

          So Alice now updates to 4/5.

     - But wait! Bob also updates? Bob, who also wrote 2/3 (meaning he saw R), now hears Alice wrote 2/3 (so he deduces she saw R) and he updates to 4/5 as well.

     - However, what if Alice saw R (so 2/3) and Bob saw B (so 1/3)? Then the referee reads: Alice 2/3, Bob 1/3.
          - Alice: she knows she saw R. She hears Bob wrote 1/3, so she deduces Bob saw B. Then she updates:
              P(H | Alice R and Bob B) = P(H) * P(Alice R | H) * P(Bob B | H) / P(Alice R and Bob B)
              P(Alice R and Bob B | H) = (2/3)*(1/3) = 2/9
              P(Alice R and Bob B | T) = (1/3)*(2/3) = 2/9
              So P(Alice R and Bob B) = (2/9)(1/2) + (2/9)(1/2) = 2/9
              Then P(H | ...) = (2/9 * 1/2) / (2/9) = 1/2? Wait, no: 
              Actually, we have:
                  P(H | Alice R, Bob B) = [P(H) * P(Alice R, Bob B | H)] / P(Alice R, Bob B)
                  = [ (1/2) * (2/9) ] / (2/9) = 1/2.

          So Alice updates to 1/2.

          Similarly, Bob: he saw B (so initially 1/3). He hears Alice saw R (so 2/3). He deduces Alice saw R and he saw B, and updates to 1/2.

     - In this case, after the announcement, they both have the same posterior: 1/2.

  5. **The Pattern: Agreement After the Announcement (5 minutes)**
     - In both cases above, after the announcement, they agree:
          - Both saw R: both update to 4/5.
          - Both saw B: symmetric, both update to ? (Let the students compute: similarly, both B leads to P(H | both B) = (1/3 * 1/3) / [ (1/3*1/3 + 2/3*2/3)*1/2 ] ... actually, we can note symmetry: it will be 1/5 for H? Let's not get sidetracked. In the mixed case, they both update to 1/2.
          - But note: the case where Alice sees R and Bob sees B leads to 1/2, and if Alice sees B and Bob sees R, also 1/2.

     - So after the announcement, they always agree? In this example, yes. But why?

  6. **Introducing Common Knowledge (10 minutes)**
     - The key is that the announcement makes the posteriors common knowledge. When the referee reads the numbers, everyone knows the numbers, and everyone knows that everyone knows, etc.
     - We now explain that in the example, after the announcement, Alice and Bob have common knowledge of each other's posteriors. But note: in the update step, they also used their private signals to infer the other's signal? Not exactly. In the update, they used the public announcement along with their own signal to infer the other's signal and then updated. But actually, the announcement of the posterior is a public event.

     - However, note: the posterior that each reports is a function of their private signal. So when the posterior is announced, it reveals the private signal? In this example, yes, because there is a one-to-one mapping from signal to posterior (R->2/3, B->1/3). But what if the mapping wasn't one-to-one? That's where the partition structure comes in.

     - We need to abstract: each agent has a partition of the state space. The state space is the set of all possible outcomes of the coin and the signals. For example, states: (H, RR), (H, RB), (H, BR), (H, BB), (T, RR), ... but note RB and BR are not possible because the coin is either H or T and then both signals are drawn independently. Actually, the state space is: 
          Ω = { (coin, Alice's signal, Bob's signal) } 
          = { (H, R, R), (H, R, B), (H, B, R), (H, B, B), (T, R, R), (T, R, B), (T, B, R), (T, B, B) }

     - Each agent's information partition:
          Alice: she cannot distinguish states that have the same coin and same signal for her? Actually, she only knows her own signal and the coin is unknown. So her partition:
              A1: { (H, R, R), (H, R, B), (T, R, R), (T, R, B) }  [if she saw R]
              A2: { (H, B, R), (H, B, B), (T, B, R), (T, B, B) }  [if she saw B]

          Similarly for Bob:
              B1: { (H, R, R), (H, B, R), (T, R, R), (T, B, R) }  [if he saw R]
              B2: { (H, R, B), (H, B, B), (T, R, B), (T, B, B) }  [if he saw B]

     - The posterior that Alice reports is a function of her information set. In A1 (R), she computes P(H | A1). How?
          P(H | A1) = P(H and A1) / P(A1)
          P(H and A1) = P({(H,R,R), (H,R,B)}) = (1/2) * [ (2/3*2/3) + (2/3*1/3) ]? Wait, we need to compute the probability of the set.

          Actually, the prior on states: each state has probability 1/8? Not exactly: 
              P(H, R, R) = P(H)*P(Alice R|H)*P(Bob R|H) = (1/2)*(2/3)*(2/3) = 4/18
              P(H, R, B) = (1/2)*(2/3)*(1/3)=2/18
              P(H, B, R)= (1/2)*(1/3)*(2/3)=2/18
              P(H, B, B)= (1/2)*(1/3)*(1/3)=1/18
              Similarly for T: 
              P(T, R, R)= (1/2)*(1/3)*(1/3)=1/18
              P(T, R, B)= (1/2)*(1/3)*(2/3)=2/18
              P(T, B, R)= (1/2)*(2/3)*(1/3)=2/18
              P(T, B, B)= (1/2)*(2/3)*(2/3)=4/18

          So the state space has probabilities: 
              H: [4/18, 2/18, 2/18, 1/18] for (RR, RB, BR, BB) respectively.
              T: [1/18, 2/18, 2/18, 4/18] for (RR, RB, BR, BB).

          Now, Alice's set A1 (R) = { (H,R,R), (H,R,B), (T,R,R), (T,R,B) } 
              P(A1) = P(H,R,R) + P(H,R,B) + P(T,R,R) + P(T,R,B) = 4/18 + 2/18 + 1/18 + 2/18 = 9/18 = 1/2.
              P(H and A1) = P(H,R,R)+P(H,R,B)=4/18+2/18=6/18=1/3.
              So P(H|A1)= (1/3) / (1/2) = 2/3. Correct.

     - After the announcement, the event that "Alice's posterior is 2/3" corresponds to the set A1. Similarly, "Bob's posterior is 1/3" corresponds to B2.

     - The announcement makes these events common knowledge. Now, both agents know that the true state is in the set of states where Alice reported 2/3 and Bob reported 1/3? That set is A1 ∩ B2 = { (H,R,B), (T,R,B) }.

     - Now, in this set, what is the probability of H? 
          P(H | A1 ∩ B2) = P(H and A1 ∩ B2) / P(A1 ∩ B2)
          = P({ (H,R,B) }) / [ P({ (H,R,B), (T,R,B) }) ] 
          = (2/18) / (2/18 + 2/18) = 2/4 = 1/2.

     - So both update to 1/2.

     - The theorem says: if there is common knowledge of the posteriors, then the posteriors must be equal. In this example, after the announcement, the posteriors become common knowledge and they become equal.

     - Why? Because the common knowledge event (the set of states that are consistent with the common knowledge) is a union of the intersections of the agents' information partitions. And within each such "cell", the posterior must be the same for both agents? Actually, the key is that the common prior and the conditioning on the common knowledge event lead to the same posterior for both.

     - We can state the theorem: If two agents have the same prior and their posteriors for a given event A are common knowledge, then their posteriors must be equal.

  7. **Common Prior and Common Knowledge: What's Doing the Work? (5 minutes)**
     - The common prior is essential. If they had different priors, they could disagree even after the announcement.
     - Common knowledge of the posteriors: without the announcement being public and hence common knowledge, they might not update in a way that leads to agreement. For example, if Alice only heard Bob's posterior in private and Bob didn't know that Alice heard it, then they might not agree? But in our example, the public announcement creates common knowledge.

     - Misconception: "Common knowledge just means both know."
       - No, it's stronger. Both know, both know that both know, etc. In the envelope example, when the referee reads the cards, it is common knowledge because both hear it and both know that the other hears it, and so on.

     - Misconception: "The theorem proves rational people can't disagree."
       - No, they can disagree initially. The theorem says that if they have common knowledge of their posteriors and a common prior, then they must agree. Without common knowledge, they might disagree. Also, without a common prior, they can disagree even with common knowledge.

  8. **Head off Misconceptions:**
     - When introducing the example and showing that they agree after the announcement, we can ask: "Could they have agreed without the announcement?" (No, initially they might not: if Alice sees R and Bob sees B, Alice has 2/3 and Bob has 1/3.) 
     - When they update after the announcement, we must stress that the announcement makes the posteriors common knowledge.
     - When we compute the updated belief, we are conditioning on the common knowledge event.

  9. **What to Leave Out:**
     - We won't go into the full measure-theoretic details or the general proof. We'll stick to the example and the intuition that the common knowledge event is a "rectangle" in the partition space, and that within that rectangle the posterior must be the same for both because they are both conditioning the same prior on that rectangle.

  10. **Final Question to Check Understanding (5 minutes):**
      - "Suppose after the announcement, Alice and Bob both update to the same posterior. Now, if the referee were to read the cards again (so announce the same numbers again), would they update again? Why or why not?"
          Answer: No, because the posteriors are already common knowledge. The second announcement doesn't add any new information. (This is the idea that common knowledge is already achieved.)

      - Alternatively: "Suppose we change the setup so that the signals are not independent conditional on the coin, but the agents don't know that. How would that break the theorem?" 
          But that might be too advanced. Instead, focus on the common prior: 
          "What if the two agents have different prior beliefs about the coin? For example, Alice thinks the coin is fair, but Bob thinks it's biased towards heads. Then, even after the announcement, could they still disagree? Why?"
          Answer: Yes, because the common prior assumption is violated. They would update differently even with the same information.

  **Total: 55 minutes, leaving 5 minutes for questions.**

  **The Sealed-Envelope Forecasters Example:**

  We'll run through:

  - Setup: coin flip, signals, writing posteriors.
  - Initial posteriors: show they can differ.
  - Announcement: now they update and we see they agree.
  - Why? Because the announcement creates common knowledge of the posteriors, and with the common prior, they must agree.

  **Optional: What if the signals were such that two different signals led to the same posterior?** 
  For example, suppose we had a third signal? We don't have time, but we can mention that in that case the announcement might not reveal the exact signal, so they might not agree immediately? But the theorem says that even then, if the posteriors are common knowledge, they must be equal. So in that case, the only way for the posteriors to be common knowledge is if they are already equal? That's a bit more advanced. We'll skip.

  We'll stick to the example where the posterior reveals the signal, and then the common knowledge event is the set of states with that signal pair, and then they update to the same number.

  **Conclusion:**
  The theorem highlights the power of common knowledge and the common prior. It shows that rational agents with the same prior cannot agree to disagree when their opinions are common knowledge.
answer: |-
  ### Teaching Plan: Aumann's Agreement Theorem via Sealed-Envelope Forecasters  
  **Goal:** Make students grasp why common knowledge + common prior force agreement.  
  **Total Time:** 60 minutes.  

  ---

  #### **Step 1: Setup the Core Scenario (10 min)**  
  **What to cover:**  
  - **The coin:** A fair coin (50% Heads, 50% Tails) will be flipped.  
  - **The forecasters:** Alice and Bob each get a *private signal* about the coin:  
    - Alice’s signal: `A_Red` or `A_Blue`.  
    - Bob’s signal: `B_Red` or `B_Blue`.  
  - **Signal structure (conditional probabilities):**  
    - If **Heads**:  
      - `P(A_Red | H) = 2/3`, `P(A_Blue | H) = 1/3`  
      - `P(B_Red | H) = 2/3`, `P(B_Blue | H) = 1/3`  
    - If **Tails**:  
      - `P(A_Red | T) = 1/3`, `P(A_Blue | T) = 2/3`  
      - `P(B_Red | T) = 1/3`, `P(B_Blue | T) = 2/3`  
  - **Posteriors:**  
    - Each calculates their posterior probability of Heads *given their signal*, writes it on a card.  
    - **Referee** collects both cards, reads them aloud.  

  **Why this works:**  
  - Simple, symmetric, and posteriors reveal private signals (e.g., Alice’s 2/3 = she saw Red).  
  - **Key question to pose:** *"After hearing each other’s posteriors, should they update their beliefs?"*  

  ---

  #### **Step 2: Show Initial Disagreement (10 min)**  
  **Compute posteriors with students:**  
  - **Alice sees Red:**  
    `P(H | A_Red) = [P(A_Red | H) * P(H)] / P(A_Red) = (2/3 * 1/2) / (1/2) = 2/3`  
  - **Bob sees Blue:**  
    `P(H | B_Blue) = [P(B_Blue | H) * P(H)] / P(B_Blue) = (1/3 * 1/2) / (1/2) = 1/3`  

  **Conclusion:**  
  - They start with different posteriors! Disagreement is possible with private info.  
  - **Misconception alert:** *"This proves rational people can disagree!"* → **Agree, but stress:** This is *pre-announcement*. The magic happens when posteriors become *common knowledge*.  

  ---

  #### **Step 3: The Announcement & Common Knowledge (15 min)**  
  **The sealed-envelope twist:**  
  - Referee reads cards aloud → posteriors become **public information**.  
  - **Define common knowledge (CK):**  
    - Not just "both know."  
    - Alice knows Bob’s posterior, Bob knows Alice’s, Alice knows Bob knows she knows, ad infinitum.  
  - **Why CK matters:** Once announced, neither can plead ignorance of the other’s belief.  

  **Update after announcement (walk through example):**  
  - *Case 1: Alice wrote 2/3 (saw Red), Bob wrote 1/3 (saw Blue).*  
    - Alice reasons:  
      - "Bob has 1/3 → he saw Blue. Now I know: Coin state + both signals."  
      - Updates to `P(H | A_Red and B_Blue)`:  
        ```  
        P(H | A_Red, B_Blue) = [P(H) * P(A_Red|H) * P(B_Blue|H)] / P(A_Red, B_Blue)  
                             = [ (1/2) * (2/3) * (1/3) ] / [ (1/2)(2/3)(1/3) + (1/2)(1/3)(2/3) ] = (2/18) / (4/18) = 1/2  
        ```  
    - Bob does symmetric calculation → **also gets 1/2**.  
  - *Case 2: Both write 2/3 (both saw Red).*  
    - Both update to `P(H | A_Red, B_Red) = ( (1/2)*(2/3)*(2/3) ) / ( (1/2)*(2/3)*(2/3) + (1/2)*(1/3)*(1/3) ) = (4/18) / (5/18) = 4/5`.  

  **Pattern:** After announcement → **agreement every time!**  

  ---

  #### **Step 4: Why CK + Common Prior Force Agreement (15 min)**  
  **Key insight:**  
  - Common prior = shared "source code" for updating beliefs.  
  - CK of posteriors = agents can *reconstruct each other’s information* (since posteriors reveal signals here).  
  - **Aumann’s theorem:** With common prior and CK of posteriors, agreement is *inevitable*.  

  **Misconception head-offs:**  
  1. *"CK just means both know."* → **Correct this now!**  
     - Example: If Alice whispered her posterior to Bob secretly, no CK (Bob doesn’t know Alice knows he knows). Agreement not guaranteed!  
  2. *"This proves rational people can’t disagree."* → **NO!**  
     - Stress: Disagreement is possible *without CK* (initial signals) or *without common prior*.  
     - **Example to ask students:** *"What if Alice thinks the coin is fair, but Bob thinks it’s biased toward Tails? Would they still agree after announcement?"* → No! Common prior is essential.  

  **Why the theorem is profound:**  
  - CK creates a shared "information context." Agents *must* reconcile beliefs within that context.  

  ---

  #### **Step 5: What to Leave Out**  
  - **Skip:** Partition algebras, measure theory, or general proof.  
  - **Avoid:** Non-symmetric signal structures or cases where posteriors don’t reveal signals (too advanced for intro).  
  - **Focus:** CK as iterative "I know you know" + common prior as the glue.  

  ---

  #### **Final Question to Check Understanding (5 min)**  
  **Pose this:**  
  > *"Suppose after the announcement, Alice and Bob agree the probability of Heads is 1/2. Now, the referee tells them, ‘I checked, and at least one of you saw a Red signal.’ Should they update again? If so, would they still agree?"*  

  **Why this works:**  
  - Tests if they grasp CK → the announcement already *included* all relevant public info.  
  - **Answer:** No update needed! The initial announcement was CK, so they already accounted for all signal combinations. Agreement persists.  

  ---

  **Summary Flow:**  
  1. Setup scenario → show initial disagreement is possible.  
  2. Announcement → CK forces agreement in examples.  
  3. Generalize to theorem → CK + common prior = agreement.  
  4. Debunk misconceptions → disagreement allowed without CK/common prior.  
  5. Final question → reinforce CK as a stopping point for updates.  

  **Why this lands:** Students *see* CK unlock shared inference via a concrete case, while avoiding measure-theoretic overhead.
