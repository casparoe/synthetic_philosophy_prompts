answer: |-
  Here's a reconstruction of the theory of risk, evidence, and precaution underlying the regulatory asymmetry, addressing your specific queries:

  ### 1. **Reconstructed Theory of Risk & Evidence**
  - **Core Premise:** The asymmetry rests on a **categorical distinction** between "medicines" (intended to treat/cure disease) and "supplements" (intended to support health/nutrition). This is viewed as a difference in kind, not degree.
  - **Risk Allocation:**  
    - *Medicines:* High-stakes intervention with potent biological effects → Default = exclusion. Burden of proving safety/efficacy on manufacturer ("do no harm" principle).  
    - *Supplements:* Lower-stakes, "natural" adjuncts to diet → Default = access. Burden of proving danger on regulator (presumption of inherent safety).  
  - **Evidential Threshold:**  
    - Medicines require *high-confidence affirmative proof* (randomized trials).  
    - Supplements require *high-confidence evidence of harm* (post-market surveillance).  
  - **Philosophical Basis:** Assumes medicines pose higher *systemic risk* due to targeted biological manipulation, while supplements pose *individualized risk* manageable through consumer choice.

  ### 2. **Three Readings of Precaution & the Practice's Commitment**
  - **(i) Stricter Evidential Threshold:** Not adopted. Medicine regulation is strict, but supplement regulation is lenient.  
  - **(ii) Burden of Proof Allocation:** **Primary commitment.** Status quo defines burden:  
    - *New medicine status quo = absence* → Manufacturer must prove safety to enter.  
    - *Supplement status quo = market presence* → Regulator must prove danger to remove.  
  - **(iii) Substantive Priority of Harm Avoidance:** Partially adopted for medicines (avoid unsafe drugs) but rejected for supplements (prioritize access over harm prevention).  

  **Incumbent Protection:** This is a **feature, not a *reductio***. The system intentionally protects existing supplement markets as "low-risk" incumbents while treating new medicines as high-risk entrants. It reflects a political-economic choice favoring supplement industry stability, not solely precaution.

  ### 3. **Irreversibility Premise: Tested**
  - **Claim:** Asymmetry is defensible only if harms from supplements are reversible (e.g., minor side effects), while drug harms are irreversible (e.g., death, organ failure).  
  - **Practice's Compatibility:**  
    - *Presupposes irreversibility?* **No.** The system would likely persist even for reversible harms (e.g., a supplement causing temporary but widespread liver damage).  
    - *What does the work?* **Categorization and inertia.** The supplement regime prioritizes market freedom and consumer autonomy, assuming harms are detectable and correctable via post-market action. The real driver is **institutional/path dependence**: supplements were historically unregulated, and reversing access is politically harder than blocking new drugs.  

  ### 4. **Single Category-Neutral Standard: Defensible Candidates**
  **Candidate 1: Uniform Precautionary (Burden on Producer)**  
  - **Standard:** All products must demonstrate safety *before* market entry.  
  - **Shifts:** Supplements move to pre-market approval; drugs unchanged.  
  - **Impacts:**  
    - ⬆️ **Harms prevented:** Unsafe supplements blocked early.  
    - ⬇️ **Harms caused:** Reduced supplement access (costs/time), stifled innovation in natural products.  
  - **Industries Affected:** Supplement industry contracts; drug industry unaffected.  

  **Candidate 2: Risk-Proportionate Burden**  
  - **Standard:** Burden shifts based on risk potential (e.g., mechanism of action, dose, population exposed).  
  - **Shifts:** High-risk supplements (e.g., stimulants) treated like drugs; low-risk drugs (e.g., topical antiseptics) treated like supplements.  
  - **Impacts:**  
    - ⬆️ **Harms prevented:** Targeted blocking of high-risk supplements.  
    - ⬇️ **Harms caused:** Reduced barriers for low-risk drugs; some high-risk supplements slip through if misclassified.  
  - **Industries Affected:** Disrupts both sectors; rewards accurate risk disclosure.  

  **Preferred Standard:** **Risk-Proportionate Burden**. Balances safety and access, adapts to product specifics, and avoids arbitrary categorization. Requires robust risk-assessment infrastructure.

  ---

  ### Underdetermined Elements & Compatibility
  - **Strictly Presupposed:**  
    - Burden of proof tied to categorization (drug vs. supplement).  
    - Status quo protection for supplements.  
  - **Compatible But Not Required:**  
    - Irreversibility of harms.  
    - Consumer autonomy rationale for supplements.  
  - **Underdetermined:**  
    - **Why categorization trumps risk severity:** A supplement with fentanyl-like risks would still get lenient treatment until proven dangerous.  
    - **Degree of harm tolerance:** The system doesn’t specify how much harm supplements can cause before losing "low-risk" status.  
  - **Incompatible Theories Ruled Out:**  
    - Single cost-benefit test (rejected by medicine’s precautionary default).  
    - Single precautionary test (rejected by supplement’s access default).  
    - Pure status quo burden (e.g., if supplements were initially banned, burden would flip to producers).  

  ### Conclusion
  The asymmetry is **coherent but contingent**, blending burden allocation (ii) with categorical risk assumptions. It protects supplement incumbents not as a flaw but by design, prioritizing market stability and access for "natural" products. Its extension to reversible harms reveals that **path dependence and industry capture** are as pivotal as risk theory. A risk-proportionate approach would be more rational but faces political barriers from entrenched interests.
