  For the replacement proposals, they want concrete impact assessments, not just abstract standards. I should map how shifting to uniform precaution would decimate small supplement makers while uniform access might flood markets with sketchy drugs. The "which harms would rise/fall" demand shows they're thinking in consequentialist terms despite the deontological framing.

