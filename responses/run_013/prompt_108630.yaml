prompt: |-
  I've been lurking in a bunch of arguments lately about technological determinism and whether artifacts have politics, and I keep noticing that everyone is talking past each other because like four different theses are getting mashed into one. There's (a) the claim that technology is politically neutral and only its *use* is political; (b) the claim that a given artifact can itself be political because of how it was designed; (c) the claim that technology is the prime mover of social change; and (d) something vaguer about inevitability — that once a tech is on the table, some outcome is basically bound to happen. I want the conceptual lay of the land, not a history of the debate. In particular I want to actually understand the distinction between an artifact being political *intrinsically* (the politics is somehow in the thing itself, and would survive rebuilding it from scratch in a totally different society) versus *relationally* (it's political only because of the system it's plugged into). A friend insists this is the real fault line and that "artifacts have politics" is just ambiguous between the two; I half buy it and half think she's inventing a distinction on the fly to win an argument. So: explain what's actually at stake in that intrinsic/relational split, whether it's stable or collapses into one of the other theses, and how senses (a)–(d) of "technological determinism" line up with it. Concrete-ish examples are welcome, but don't lean on a canon I'm supposed to already know — assume I've read the famous bridge story and basically nothing else, and I'd rather you build the examples yourself than name-drop.

  Lead with your bottom line in the first sentence, then give the reasoning, no preamble and don't restate my question.
