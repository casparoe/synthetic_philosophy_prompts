answer: |-
  **The intrinsic/relational distinction is a stable and crucial fault line clarifying whether an artifact’s politics arises from its essential design (intrinsic) or its contingent societal context (relational), profoundly impacting how we assign responsibility for technological outcomes.** Here’s the breakdown:

  1.  **Intrinsic Politics:** The artifact’s design *inherently* necessitates or enforces a political outcome, regardless of context. Rebuilding it identically in any society would reproduce that outcome.
      *   *Example:* A voting machine designed to silently discard ballots from specific ZIP codes. Even in a society without historical discrimination, the machine’s core function remains disenfranchisement. The politics is "baked in" via its engineering logic.
      *   *What's at stake:* Blame/responsibility lies primarily with the *designers/creators*. Changing use or context won't eliminate the harm; the artifact itself must be redesigned or rejected. This view strongly challenges thesis (a) (neutrality).

  2.  **Relational Politics:** The artifact’s political impact *depends entirely* on the social, economic, or political system it’s embedded within. The same physical object can have opposite effects in different contexts.
      *   *Example:* A high-efficiency irrigation pump. In an egalitarian farming co-op, it might democratize water access. In a feudal society with land monopolies, it could deepen the landlord’s control over desperate tenant farmers. The pump's *capability* is constant, but its *political effect* varies with who owns it and the surrounding power structures.
      *   *What's at stake:* Blame/responsibility shifts to *users, regulators, and societal structures*. The artifact is a tool whose politics emerges from *how it's used and governed*. This view is compatible with criticizing thesis (a) but doesn't require intrinsic properties.

  **How it Maps to Your Theses (a)-(d):**

  *   **(a) Technology is Neutral (Only Use is Political):** **Explicitly rejects both intrinsic and relational claims.** It denies artifacts have *any* inherent political properties (intrinsic) and claims politics arises *solely* from deliberate human choices *during use*, not from the artifact's design or its interaction with systems (relational). It sees the artifact as a blank slate.
  *   **(b) Artifacts Can Be Political Due to Design:** **Primarily aligns with Intrinsic Politics.** This thesis gains its force from arguing design choices *embed* politics that persist across contexts (e.g., the voting machine). It *can* sometimes be misinterpreted as relational if "design" is vaguely linked to intent rather than material function.
  *   **(c) Technology is Prime Mover of Social Change:** **Often Assumes Intrinsic Politics.** If technology *drives* society, it implies technologies possess inherent, context-independent powers (intrinsic properties) that override social structures. A relational view struggles to support strict primacy, as societal context mediates the tech's impact.
  *   **(d) Technological Inevitability:** **Strongly Leans Intrinsic.** The claim that a tech "on the table" *forces* an outcome suggests the artifact contains the seeds of that outcome within its very nature (intrinsic), making it unavoidable regardless of social context or mitigation efforts. Relationalism denies strict inevitability, as context determines the outcome.

  **Stability of the Distinction:** The split is stable and meaningful. It hinges on a counterfactual test: *"If we rebuilt this exact artifact in a radically different social context (e.g., utopian egalitarian vs. dystopian authoritarian), would the *same* political effect emerge?"*
  *   **Yes = Intrinsic** (The voting machine still discards ballots).
  *   **No = Relational** (The irrigation pump empowers or oppresses depending on land ownership rules).

  Your friend is correct that "artifacts have politics" is ambiguous between these. Confusing them leads to talking past each other: an intrinsic advocate sees a harmful design logic that *must* be changed, while a relationalist sees a tool whose harm stems from bad governance that *can* be fixed without altering the tech itself. Recognizing this split clarifies where disagreement truly lies – in the nature of the artifact's power.
