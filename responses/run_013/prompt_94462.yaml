prompt: |-
  Ok so I'm in this seminar on philosophy of mind and cognition and next week each of us has to bring in a case we built ourselves for the extended mind debate. The problem is everyone reaches for Otto and the notebook and then half the class rattles off the same objections, so my prof wants cases that are actually engineered, where you can see which criterion is doing the work instead of just gesturing at "it feels extended." So I'd like you to build me one.

  Here's the spec. The case has to make the parity principle and the trust-and-glue conditions come apart in the direction that's harder to get: parity says the thing is a real belief, part of the agent's cognitive system, while trust-and-glue says it isn't. Constraints: everyday and realistic — one ordinary adult, one ordinary artifact, no implants, no brain-computer interfaces, nothing sci-fi, nothing you'd need a lab or a futurist to set up; keep the whole scenario to a paragraph or two. I also want to test a third condition my prof floated in lecture that I can't find written down anywhere, he called it the upkeep condition: roughly, for an external state to count as one of the agent's beliefs, the agent has to be disposed to maintain and correct that external store even when nothing they're doing right now depends on it — they'd notice and fix it if it started to drift. I honestly can't tell if that's a real thing or he invented it on the spot, but I want to see what it does to the case.

  After the scenario, walk me through the whole thing: say exactly what the belief is and what the external vehicle is, then run each criterion on it — why parity says yes, and why the trust-and-glue conditions (reliable availability, automatic endorsement, ready accessibility) say no, or which ones do. Then tell me which single feature of the case is carrying the weight, what happens if I delete that feature, and how somebody who thinks the artifact really is part of the agent's mind would go after my case. If the upkeep condition ends up giving a third verdict, say whether it lines up with the intuition or whether it's just tracking one of the other criteria in disguise. And please actually run the criteria on the case rather than telling me what the standard positions say in general — the whole point is that the case has to generate the verdicts, not have them baked in.
reasoning: |-
  Okay, let me start by unpacking what the user needs. They're in a philosophy seminar focusing on the extended mind debate, specifically the parity principle versus trust-and-glue conditions. The challenge is to create a unique case where parity suggests an external artifact is part of the cognitive system, but trust-and-glue conditions reject it. Plus, there's this "upkeep condition" their professor mentioned, which isn't standard. The user wants something realistic—no sci-fi, just everyday objects and situations.

  First, I need to recall the core elements. The parity principle by Clark and Chalmers says that if an external process functions the same way as an internal one, it should be considered part of the mind. Trust-and-glue conditions include reliable availability, automatic endorsement, and past endorsement. The upkeep condition is about maintaining the external store even when not in use. 

  The user’s main request is a scenario where parity says "yes" but trust-and-glue says "no." Most examples like Otto's notebook satisfy both, so I need something that breaks this. Also, the case must be mundane. Common examples might include smartphones or notebooks, but those usually meet trust-and-glue. So, where can trust-and-glue fail?

  Idea: An artifact that's functionally equivalent (parity) but lacks the trust or glue. Maybe something the person uses habitually but doesn't fully trust or maintain. The calendar example comes to mind. People often rely on shared digital calendars but might not verify every entry. If there's a mistake, they don't automatically endorse it. That could work. 

  Let's flesh it out. A person, Maya, uses a shared Google Calendar managed by her partner. She checks it habitually for appointments, similar to recalling a memory. That satisfies parity. But she doesn't maintain it herself; her partner does. She trusts her partner but not the calendar implicitly. If an error appears, she might question it rather than endorse it automatically. Also, she doesn't update it unless prompted, failing past endorsement. 

  Now, trust-and-glue conditions: Reliable availability is there—it's always accessible. Automatic endorsement? No, she'd question inconsistencies. Past endorsement? She didn't input the data, so maybe not. That creates the split. 

  Upkeep condition: She doesn't maintain the calendar herself. If an error appears and she's not using it immediately, she might not correct it. So upkeep says "no," aligning with trust-and-glue. 

  The key feature is the delegation of maintenance to someone else. Remove that, and if Maya maintained it herself, trust-and-glue might pass. Critics might argue that the calendar is part of a coupled system, but the lack of personal upkeep weakens it. 

  Need to ensure it's a paragraph, realistic. Check constraints: no sci-fi, ordinary adult (Maya), ordinary artifact (shared calendar). Yes. Walk through each criterion explicitly in the response, tying them to the scenario details. Also, address how upkeep fits—does it track another condition or stand alone? Here, it aligns with trust-and-glue but emphasizes maintenance without immediate need. 

  Potential pitfalls: Is the calendar really functionally equivalent? If she uses it automatically, maybe. But the doubt in endorsement breaks automaticity. Also, past endorsement: since her partner inputs data, she didn't endorse it initially. That should satisfy the split. 

  Refine the scenario to highlight habitual use without maintenance. Mention specific instances where she relies on it but doesn't update. Example: dentist appointment changed, partner updates, but Maya doesn't check until the day. If there's an error, she calls the dentist instead of trusting the calendar. 

  Yes, that should work. Now, structure the response: present the scenario, then break down each criterion with references to the case. Identify the key feature (delegation), its removal, and counterarguments. Finally, discuss upkeep as aligning with trust-and-glue but adding the maintenance aspect.
answer: |-
  Here's a custom-engineered case designed to split the criteria as requested, centered on a **shared household Google Calendar managed primarily by someone else**:

  **Scenario:** Maya relies on a shared Google Calendar for all personal appointments. Her partner, Leo, handles most entries (dentist, vet, dinner plans) because he enjoys scheduling. Maya habitually checks the calendar first thing each morning and before leaving work, treating displayed entries as "what I'm doing today." If an entry says "Dentist 3 PM," she goes without double-checking. However, she never adds or edits entries herself, always texting Leo requests like "Can you put Mom's call on Thu?".
  Leo occasionally makes errors or whimsical entries (e.g., mistakenly booking her haircut during work hours; jokingly adding "Spacewalk practice 2 AM"). When Maya encounters these, she texts Leo: "Did you mean this?" or "Delete that joke." She doesn't monitor the calendar for accuracy when no immediate action is needed. An incorrect "Gym 7 AM" entry from Leo would sit unnoticed until Maya checks her schedule that morning.

  **The Belief & Vehicle:**  
  - **Belief:** "I have a dentist appointment at 3 PM today."  
  - **External Vehicle:** The "Dentist 3 PM" entry in the shared Google Calendar, maintained by Leo.

  **Running the Criteria:**

  1. **Parity Principle (Says YES):**  
     Functionally, the calendar entry plays *the exact same role* as a biological memory belief for Maya. When deciding what to do at 3 PM, she consults it automatically and directly guides her action (going to the dentist) based solely on its content, just as she would recall an internal memory. No additional reasoning (e.g., "Leo is usually reliable") mediates this. It's a *dispositional belief* triggering action when accessed.

  2. **Trust-and-Glue Conditions (Say NO):**  
     - **Reliable Availability (PASS):** The calendar is reliably accessible via her phone/computer.  
     - **Automatic Endorsement (FAIL):** Maya does *not* automatically accept all calendar content as true. When entries conflict with her expectations (e.g., a haircut during work) or are absurd ("Spacewalk"), she questions/rejects them. Her trust is in *Leo*, not the artifact itself.  
     - **Past Endorsement (FAIL):** Maya did not create or approve the "Dentist" entry. Leo added it based on his own reasoning/input. She hasn't endorsed the *specific state*; she merely uses the output.  
     *Overall Trust-and-Glue Verdict:* **NO** (Automatic and Past Endorsement fail).

  3. **Upkeep Condition (Says NO):**  
     Maya has no disposition to maintain or correct the calendar *proactively*. She only reacts to errors when they disrupt her immediate plans ("Gym 7 AM" sits uncorrected). She wouldn't notice a slow drift (e.g., Leo gradually shifting all entries 15 minutes earlier). Maintenance is Leo's job; her role is purely consumer.

  **The Weight-Bearing Feature:**  
  **Delegated creation/maintenance without verification authority.** The key is that the *content generation* and *ongoing accuracy management* are outsourced to another agent (Leo), while Maya retains *consumptive reliance*. Delete this (e.g., make Maya the sole creator/maintainer), and Automatic/Past Endorsement likely pass, aligning trust-and-glue with parity.

  **How an Extended Mind Advocate Attacks Your Case:**  
  A defender would argue:  
  1. **System Unity:** Maya+Leo+Calendar form a *coupled cognitive system*. Leo isn't an external source; he's part of Maya's "socially extended" mind, akin to a neural subsystem.  
  2. **Glue Reinterpretation:** "Automatic endorsement" applies only to *routine, non-anomalous* entries (like the dentist). Questioning jokes/mistakes is like a brain rejecting a false memory – it doesn't negate the system's core function.  
  3. **Parity Priority:** The functional role during *successful* use (e.g., acting on the correct dentist entry) is what matters. Episodic glitches don't invalidate the overall cognitive integration.

  **Upkeep Condition Analysis:**  
  It aligns with trust-and-glue (both say NO) but adds a novel dimension: **proactive maintenance as a necessary condition for belief-status**. It's not *just* tracking endorsement; it requires the agent to treat the external state as their *own* to-be-maintained cognitive resource, not just a reliable input. Here, Maya treats the calendar as an information *feed*, not a *repository she owns*, failing upkeep independently of the endorsement failures.

  **Why This Meets Your Spec:**  
  - **Realistic/Ordinary:** Uses common tech (shared calendar) and social delegation.  
  - **Clear Splits:** Parity says YES (functional equivalence in action-guidance), Trust-and-Glue says NO (failed endorsement), Upkeep says NO (no maintenance disposition).  
  - **Diagnostic:** Pinpoints how delegated authority breaks the "glue" while preserving functional parity.  
  - **Third Condition Tested:** Upkeep provides a distinct reason for exclusion, emphasizing ownership-of-maintenance beyond mere access or trust.
