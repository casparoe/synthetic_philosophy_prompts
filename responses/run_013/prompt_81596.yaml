answer: |-
  ## Workshop Proposal: Consent as Robust Endorsement

  **Title:** Beyond Thresholds: Testing a Robustness Account of Valid Consent

  **Question:** Can we replace the standard three-condition model of consent (competence, information, absence of coercion) with a unified account based on the *robustness of endorsement* across relevant counterfactuals, and does this better explain intuitive judgments about validity, especially in cases where the standard conditions trade off?

  **Problem:** The standard model treats competence, adequate information, and voluntariness (absence of coercion/undue influence) as independent necessary conditions, each with a threshold. Yet, as noted, these plainly interact. Mild pressure invalidates consent from a minimally competent person in a way it doesn't for a highly competent one; crucial information gaps matter less for trivial decisions than life-altering ones. The thresholds seem arbitrary and fail to capture how these factors dynamically erode the *core* validity of consent. Treating them as independent leaves the fundamental nature of valid consent obscure and struggles with borderline cases and trade-offs. Alternatively, collapsing consent into mere actual endorsement risks validating choices made under severe manipulation or profound ignorance.

  **Proposed Approach: The Robustness Account:** I propose that valid consent depends on the degree to which the agent’s *endorsement* of the decision or act is *robust* across relevant counterfactual scenarios probing the specific influences present. Specifically, endorsement is robust to the degree it would survive:
  1.  **Correcting Deception/Information Gaps:** Would the agent still consent if provided with the missing or corrected information?
  2.  **Removing Coercion/Undue Influence:** Would the agent still consent if the external pressure or threat were lifted?
  3.  **Deferring the Decision (Competence Probe):** Would the agent still consent if the decision were deferred to a point where temporary impairments (fatigue, distress, intoxication) affecting competence are alleviated?

  On this view, the three standard conditions are not independent foundations but three distinct *probes* measuring the resilience of the agent's endorsement against specific potential distortions. The "thresholds" aren't independent because each negative influence (lack of info, pressure, impaired competence) diminishes the same underlying quantity: the agent's capacity to form and maintain an endorsement reflective of their own values and stable preferences in that context. Validity is scalar, corresponding to the robustness of endorsement across these counterfactual probes.

  **Testing the Account:** The workshop will critically evaluate this account against cases where the standard model struggles, particularly where counterfactual probes yield conflicting signals:

  1.  **Trivial Deception:** A patient consents to surgery where the surgeon lied about the brand of suture used – a detail the patient explicitly states they don't care about. *Standard Model:* Information condition violated? *Robustness:* Endorsement likely robust to correction (probe 1) – validity arguably preserved.
  2.  **Endorsed Pressure:** An employee feels pressured by a demanding deadline to work late but, on reflection, endorses the pressure as motivational and necessary for their career goals. *Standard Model:* Voluntariness violated? *Robustness:* Endorsement robust to removal of pressure (probe 2) may *not* hold (they might not choose it without pressure), but probe 3 (deferral for reflection) might show stability. Can robustness integrate this?
  3.  **Competent Instability:** A highly competent individual makes a clear choice but readily changes it under trivial reframing (e.g., consenting to Procedure A over B based purely on irrelevant wording differences). *Standard Model:* Competence met? *Robustness:* Probe 3 (deferral/reframing) reveals endorsement fragility, suggesting lower validity despite apparent competence.

  **Potential Failure & Scope:** The account fails if:
  1.  It cannot coherently integrate conflicting probe results into a scalar judgment of validity.
  2.  It collapses into implying *any* influence (e.g., a polite request) invalidates consent by making endorsement non-robust to its *complete* removal. (Response: Robustness is assessed against *specific, salient* distortions present; trivial influences won't significantly shift endorsement. The account must define "relevant" counterfactuals contextually).
  3.  It cannot adequately distinguish robust endorsement from mere resignation or adaptive preference formation under enduring constraints.
  4.  It proves no more useful or intuitive than the standard model in paradigmatic clear-cut cases.

  **Workshop Deliverables:** This short paper will articulate the robustness account clearly, contrast it with the standard model and simple endorsement, present the key test cases, and outline the criteria for success/failure. It will *not* provide a full theory of "endorsement," a definitive metric for scalar validity, or comprehensive solutions to deep philosophical problems of autonomy and adaptive preferences. These crucial issues will be central to the interdisciplinary workshop discussion, alongside developing further test cases and refining the counterfactual probes. The goal is to establish whether the robustness framework offers a fruitful path forward for theorizing consent's validity conditions.

  **Outcome:** A focused debate on whether a robustness-based approach can resolve tensions within the standard model, better capture the phenomenology of valid consent, and provide clearer guidance for practical application in law, medicine, and ethics.
