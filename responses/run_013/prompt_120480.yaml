prompt: |-
  I teach a Master's-level seminar in the philosophy of cognitive science, taken jointly by philosophers and by students from a machine-learning background, and I am setting the final assessment for the module on representation and interpretability. My students will have met linear probes (simple classifiers trained on a network's internal activations to predict a labelled property of the input) and sparse autoencoders (which learn a large set of sparsely active directions in activation space). What I do not want is an answer that rehearses the interpretability literature. I want an answer that says what would have to be true for a representational claim about a network to be warranted, and that notices how much of that is a matter of choice rather than discovery.

  Please write me one essay question, a model answer of about 800 words, and a marking scheme out of 25. Candidates have 75 minutes for the question and no access to any literature, so the question must be self-contained: it may name techniques, but it must not require candidates to attribute claims to named authors or to recall published results, and neither the model answer nor the marking scheme may depend on citations or reading lists.

  Build the question around the following test, which I have invented for this paper and which no student will have seen:

  A state of a network counts as representing a property only if (i) it carries information about that property, in the sense of being reliably correlated with it across the inputs the network is likely to encounter; (ii) it is load-bearing, in the sense that intervening on it alters the network's behaviour in ways that track the property rather than a confound; and (iii) it is non-substitutable, in the sense that no description of the network's computation that omits the property predicts its behaviour as well as a description that mentions it.

  The question should ask candidates to assess this test rather than to apply it: whether it returns the verdicts we want in clear cases, where it over-generates (certifying a mere correlate as a representation), where it under-generates (withholding the label where we are inclined to grant it), which of the three clauses is doing the real work, and whether the test is a criterion we could actually apply or a research programme in disguise.

  The question must also put this case to them: two networks that agree in their outputs on every input anyone has tried, and that are probed with equal success for the same property, yet whose internal organisation differs — in one, a single direction in activation space tracks the property; in the other, the property is recoverable only by a probe that pools many directions. Candidates should say what, if anything, this shows for the realist who holds that interpretability findings describe the model rather than the analyst's preferred basis, and what it shows for the instrumentalist who denies this.

  Write the model answer as finished philosophical prose at the standard of the strongest student in the room, not as a checklist. It should mark explicitly, as it goes, which of its claims are settled among people who work on interpretability and which are live disputes, so that a reader can see where it is taking a side, and it must not present a contested position as though it were the consensus. Build the marking scheme around five must-hit points worth four marks each, with the remaining five marks for the overall shape of the argument; give a one-line note for each must-hit point on how candidates typically get it wrong, and a short closing note on what separates a first-class answer from an upper second.
reasoning: |-
  We are creating an essay question, a model answer, and a marking scheme for a Master's-level seminar in the philosophy of cognitive science. The focus is on representation and interpretability in neural networks. The test provided has three clauses: information-carrying, load-bearing, and non-substitutability.

  The question must:
  - Ask candidates to assess the test (not apply it).
  - Cover clear cases, over-generation, under-generation, which clause does the real work, and whether the test is a criterion or a research programme.
  - Present a case of two networks that agree on outputs and probe success but differ internally (one with a single direction, one requiring pooling). Then discuss implications for realism and instrumentalism.

  The model answer should:
  - Be 800 words of finished philosophical prose at the highest standard.
  - Explicitly mark which claims are settled and which are live disputes.
  - Not present contested positions as consensus.

  Marking scheme:
  - Five must-hit points, each worth 4 marks (20 marks total).
  - Remaining 5 marks for overall shape of argument.
  - One-line note per must-hit point on typical mistakes.
  - Short closing note on what separates a first-class answer from an upper second.

  Let's design the essay question first.

  **Essay Question:**

  > In assessing whether a state of a neural network represents a property, we might propose the following test: the state must (i) carry information about the property (being reliably correlated with it across likely inputs), (ii) be load-bearing (intervening on it alters the network's behaviour in ways that track the property rather than a confound), and (iii) be non-substitutable (no description of the network's computation that omits the property predicts its behaviour as well as one that mentions it).
  >
  > Evaluate this three-clause test. In your evaluation, consider:
  > - Whether the test returns the verdicts we want in clear cases of representation and non-representation.
  > - Cases where the test might over-generate (e.g., certifying a mere correlate as a representation) or under-generate (withholding the label where we are inclined to grant it).
  > - Which of the three clauses is doing the real work in avoiding these pitfalls.
  > - Whether the test is a criterion we could straightforwardly apply, or a research programme in disguise (requiring further choices and developments).
  >
  > Then, consider the following scenario: two networks are identical in their outputs on every input tested, and linear probes trained on their internal activations achieve equal success in predicting a labelled property. However, in one network, a single direction in activation space tracks the property, while in the other, the property is recoverable only by a probe that pools many directions. Discuss what this shows for:
  > - The realist, who holds that interpretability findings describe the model rather than the analyst's preferred basis.
  > - The instrumentalist, who denies this, holding that representations are relative to the interpretative tools we use.
  >
  > Your answer should engage philosophically with the nature of representation in artificial neural networks, making clear where the issues are settled and where there is ongoing debate.

  **Model Answer (approx. 800 words):**

  The quest for a test of representational content in neural networks is central to interpretability research. The proposed three-clause test—requiring a state to carry information about a property, be load-bearing, and non-substitutable—offers a structured approach. However, its adequacy must be evaluated by considering its verdicts in clear cases, its susceptibility to over- and under-generation, the relative importance of its clauses, and its practical applicability. Moreover, the scenario of two networks that are behaviorally and probewise equivalent but internally distinct challenges both realist and instrumentalist conceptions of representation.

  To begin, consider clear cases. If a network has a neuron that fires only when a vertical edge is present in the input and altering its activation consistently changes edge-detection behaviour, and if omitting this feature degrades our ability to predict the network's behaviour, the test correctly certifies it as representing vertical edges. Conversely, if a state correlates with a property by accident (e.g., due to dataset bias) but is not used by the network (so interventions don't affect behaviour in a property-tracking way), the test correctly withholds representation. This is settled: information without load-bearing is insufficient, as interpretability research consistently shows correlates that are not causally relevant.

  However, the test may over-generate. Consider a state that carries information about property P and is load-bearing for behaviour that tracks P, but only because P correlates with Q in the training data, and the network actually represents Q. For instance, a state might track "being a dog" because dogs are typically furry, but the network actually represents furriness and uses that to classify dogs. If interventions on the state change behaviour in a way that tracks dogs (by altering furriness), and if omitting "dog" from our description doesn't harm predictive accuracy (because we can still describe the computation in terms of furriness), then the non-substitutability clause might prevent over-generation. But note: if our description can substitute Q for P without loss, then P fails (iii). Yet, if we insist on describing in terms of P, the test might still pass. This reveals a choice: what counts as an adequate description? The test does not specify the vocabulary for descriptions, leaving non-substitutability relative to our descriptive framework. This is a live dispute: some argue that representations must be non-substitutable under a privileged vocabulary (e.g., the network's own computational primitives), but there is no consensus on how to fix such a vocabulary.

  Under-generation is also a risk. Suppose a network uses a distributed code: no single state carries information about P, but a group of states does. The test, as stated, applies to "a state". Does it extend to groups? If not, it might under-generate. Moreover, even if we consider groups, non-substitutability might be hard to show. For example, in a network that uses complex, overlapping representations, a description that omits P might do nearly as well by invoking other properties. But if we require perfect predictive parity, then any imperfection in the substitute description might save non-substitutability. The clause (iii) thus requires a threshold for "as well as", which is unspecified. These gaps highlight that the test is not a straightforward criterion but a research programme: it demands choices about descriptive granularity, grouping of states, and thresholds for predictive adequacy.

  Which clause does the real work? Load-bearing (ii) is crucial for ruling out mere correlates, as settled by causal intervention studies in interpretability. Non-substitutability (iii) blocks cases where the property is redundant in explaining behaviour. But (iii) is contentious: it invokes our descriptions, making representation partly dependent on our explanatory interests. This is a live debate: realists might argue that non-substitutability reflects an objective feature of the computation, while instrumentalists see it as pragmatic. Clause (i) is necessary but the least distinctive: without information, there is nothing to represent. However, information alone is too weak, as the literature on spurious correlations shows.

  Now, the scenario: two networks are indistinguishable in outputs and probe success for property P, but in Network A, P is tracked by a single direction, while in Network B, P is only recoverable by pooling many directions. For the realist, this poses a challenge. If representation is an objective feature of the model, then Network A represents P in a more straightforward way, while Network B might not represent P at all, or only derivatively. However, the test might yield the same verdict for both: both carry information about P (via probes), both might be load-bearing (if we intervene on the relevant directions in A or the pooled subspace in B, behaviour changes in a P-tracking way), and both might be non-substitutable (if omitting P degrades behavioural predictions). But note: in Network B, no single state might satisfy (i) and (ii), so if the test applies only to individual states, it under-generates. If we allow groups, then both networks pass. The realist must then accept that representation can be multiply realized: the same property can be represented in different ways. This is a settled point in classical cognitive science, but the realist must explain why both count as representing P, even though the internal structures differ.

  The instrumentalist, by contrast, sees no deep issue: representations are tools for prediction and control, relative to our methods. If linear probes work equally well, then for the purpose of predicting behaviour via probes, both networks represent P. The pooling in Network B is just a choice of basis; it doesn't reflect an ontological difference. The test, especially non-substitutability, is framework-relative: what counts as a good description depends on our interests. The instrumentalist thus embraces the internal difference as irrelevant to representational content, which is fixed by our interpretative practices.

  In conclusion, the three-clause test offers a valuable but incomplete framework. It captures key intuitions but requires fleshing out: how to group states, set thresholds, and choose descriptive vocabularies. The scenario underscores that representation is not simply discovered but partly constituted by our analytical choices. This does not settle the realism-instrumentalism debate, but it shows that the test, as stated, can be accommodated by both—though each will interpret the clauses differently. The debate between realists and instrumentalists remains live, with no consensus in sight.

  **Marking Scheme (Total: 25 marks):**

  1. **Must-hit point 1: Clear Cases (4 marks)**  
     - Answer must discuss both a clear positive case (where the test correctly attributes representation) and a clear negative case (where it correctly withholds it), using the clauses appropriately.  
     - *Typical mistake:* Only discussing one case, or not linking the cases to the clauses.

  2. **Must-hit point 2: Over-generation and Under-generation (4 marks)**  
     - Answer must provide plausible examples of over-generation (e.g., a state that is a correlate and load-bearing but not truly representing, and how the test might or might not catch it) and under-generation (e.g., distributed representations, and how the test might fail to attribute representation).  
     - *Typical mistake:* Vague examples without connection to the clauses, or missing one of the two.

  3. **Must-hit point 3: Role of the Clauses (4 marks)**  
     - Answer must discuss which clause is most important in avoiding over/under-generation and why (e.g., load-bearing for ruling out mere correlates, non-substitutability for redundancy). Must note the controversy around non-substitutability (especially its dependence on descriptive choices).  
     - *Typical mistake:* Not identifying the relative roles or ignoring the contested nature of non-substitutability.

  4. **Must-hit point 4: Test as Criterion vs. Research Programme (4 marks)**  
     - Answer must argue that the test is a research programme because it requires further choices (descriptive vocabulary, grouping of states, thresholds for non-substitutability).  
     - *Typical mistake:* Treating the test as straightforwardly applicable without noting these gaps.

  5. **Must-hit point 5: Two Networks Scenario and Realism/Instrumentalism (4 marks)**  
     - Answer must apply the test to both networks (showing how they might both pass if groups are allowed) and discuss the implications for realism (multiple realizability, challenge to objectivity) and instrumentalism (framework-relativity).  
     - *Typical mistake:* Only discussing one position, or not linking the scenario to the test.

  **Overall Shape of Argument (5 marks):**  
  - Assessed on clarity, structure, coherence, and philosophical engagement. The argument should flow logically, cover all required parts, and show depth in handling the issues.

  **Separating First-Class from Upper Second:**  
  - A first-class answer will not only hit all the must-hit points but also weave them into a compelling narrative, showing independent philosophical insight (e.g., by highlighting the tension between objectivity and choice in representation, or by creatively extending the test to edge cases). It will explicitly flag settled vs. contested matters throughout. An upper-second answer may hit all points but with less finesse in connecting them, or with less clarity on the nuances of the disputes.
answer: |-
  ### Essay Question

  **Evaluate the following test for determining whether a state of a neural network represents a property: the state must (i) carry information about the property (being reliably correlated with it across inputs the network is likely to encounter); (ii) be load-bearing (intervening on it alters the network’s behaviour in ways that track the property, not a confound); and (iii) be non-substitutable (no description of the network’s computation that omits the property predicts its behaviour as well as one that mentions it).**

  **In your assessment, address:**
  1. **Whether the test returns intuitive verdicts in clear cases of representation and non-representation.**
  2. **Situations where the test may over-generate (e.g., certifying a mere correlate as a representation) or under-generate (withholding the label where we intuitively grant it).**
  3. **Which clause(s) are most critical for avoiding these errors, and whether any clauses introduce unresolved philosophical choices.**
  4. **Whether the test is a practical criterion we can apply directly or a research programme requiring further refinement.**

  **Then, consider this scenario: Two networks produce identical outputs on all tested inputs. Linear probes achieve equal success in predicting property P from their internal activations. However, in Network A, P is tracked by a single direction in activation space, while in Network B, P is only recoverable by a probe pooling many directions. Discuss the implications for:**
  - **A realist view: interpretability findings describe objective facts about the model.**
  - **An instrumentalist view: representations reflect our analytical tools, not the model’s intrinsic structure.**

  **Your answer should distinguish settled insights from ongoing debates in interpretability research.**

  ---

  ### Model Answer (800 words)

  The three-clause test for representational content—demanding information-carrying, load-bearing, and non-substitutability—offers a structured framework for grounding claims about neural networks. However, while it captures key intuitions, it faces limitations in handling edge cases, relies unequally on its clauses, and reveals unresolved choices that blur the line between discovery and stipulation. Moreover, the scenario of functionally equivalent networks with divergent internal structures exposes tensions between realist and instrumentalist perspectives on representation.

  Begin with clear cases. If a state in a vision network activates reliably for "vertical edges" and interventions that suppress it impair edge-detection outputs specifically (not confounds like brightness), and if no simpler description (e.g., "gradient patterns") predicts behaviour as well, the test correctly certifies representation. This aligns with settled insights: information (i) and load-bearing (ii) are widely accepted as necessary, as interpretability research consistently dismisses inactive correlates as non-representational. Conversely, a state correlating with "ocean" due to dataset biases (e.g., beaches always sunny) but unused in computation fails (ii), correctly denying representation—a point uncontroversial in intervention-based approaches. Yet problems arise in murkier territory.

  Over-generation occurs when the test certifies a correlate misaligned with the network’s "real" semantics. Suppose a state correlates with "dogs" and interventions change dog-classification behaviour, but only because dogs co-occur with "grass" in training data, and the network actually represents grass. Here, (i) and (ii) are satisfied, but (iii) may fail: a description omitting "dogs" (using "grass" and other features) could predict behaviour equally well. Non-substitutability thus blocks over-generation, but ambiguously. What counts as an "adequate" description? If we allow coarse-grained descriptions (e.g., "outdoor objects"), (iii) might be trivially satisfied; if we demand fine-grained vocabulary (e.g., pixel patterns), it becomes impossibly strict. This isn’t settled—it’s a live dispute whether non-substitutability requires a privileged vocabulary (e.g., the network’s computational primitives) or is interest-relative. Thus, (iii) introduces choice: it depends on our descriptive goals, not just the model.

  Under-generation arises with distributed representations. Consider a network where property P (e.g., "sentiment" in text) is encoded across multiple neurons, no single one bearing the load. The test targets "a state," implying localism. If we interpret "state" narrowly, (i) and (ii) fail for individual neurons, withholding representation despite P being integral to behaviour. Even if we expand "state" to neuron groups, (iii) is problematic: if P is emergent, descriptions omitting it (using low-level features) might predict behaviour well, especially if computational redundancy exists. This under-generation highlights a gap. While distributed representations are empirically common (settled), the test’s handling of them is underspecified, leaning on unresolved choices about state decomposition.

  The clauses’ roles are asymmetrical. Load-bearing (ii) is indispensable for excluding mere correlates—a settled consensus from intervention studies (e.g., activation patching). Non-substitutability (iii) is vital for semantic specificity but contentious. It prevents over-generalisation by ensuring the property isn’t redundant, yet its dependence on description vocabulary makes it less objective. Information (i) is necessary but insufficient alone, as it ignores causal efficacy—another settled point. Crucially, (iii) bears the burden of semantic precision but transforms the test into a research programme: it demands choices about description granularity and thresholds for predictive parity, which aren’t dictated by the model. Consequently, the test isn’t a turnkey criterion but a scaffold for inquiry, requiring auxiliary decisions that inject subjectivity.

  The two-network scenario sharpens these issues. Both networks satisfy (i) (probes succeed) and likely (ii) (interventions on relevant activations would alter P-sensitive behaviour). For (iii), if we allow pooled directions as a "state," both may pass if omitting P degrades behavioural predictions. Yet their internal differences challenge realism. The realist holds that interpretability reveals objective structures, so Network A’s single direction suggests a "natural" representation of P, while Network B’s distributed encoding might imply P is less directly represented or emergent. However, if both pass the test equally, realism must accommodate multiple realizability: P can be represented in divergent physical bases. This is coherent but strains objectivity—why privilege one structure over another if both satisfy the same criteria? Realists might retort that the test’s application (e.g., defining "state") must respect computational differences, but this invokes choices, undermining realism’s promise of agent-independent facts. This tension is a live debate, with no consensus on whether representations are wholly model-bound.

  Instrumentalists thrive here. For them, representation is tool-relative: probes and interventions are our instruments, so if both networks support identical predictive and control practices, they "represent" P equally, irrespective of internals. The internal divergence merely reflects basis-dependent encodings, not ontological differences. Thus, the test’s verdicts are always analyst-relative, especially (iii), which hinges on our descriptive preferences. This view handles the scenario smoothly but at a cost: it implies representation isn’t discovered in the model but projected onto it. While instrumentalism aligns with pragmatic interpretability, it remains controversial, as realists argue it overlooks causal structures that exist independently.

  In sum, the test advances objectivity through (i) and (ii) but stumbles on (iii), which smuggles in choices about description. The scenario underscores that even a robust test cannot resolve the realism-instrumentalism debate. Settled insights (e.g., the necessity of load-bearing) coexist with live disputes about description-relativity and the ontology of distributed codes. Ultimately, the test is a heuristic for disciplined inquiry, not a discovery mechanism—it reveals how much representational attributions depend on our interpretive frameworks.

  ---

  ### Marking Scheme (Total: 25 marks)

  **Must-hit points (4 marks each, 20 marks total):**  
  1. **Clear cases evaluation:** Discusses intuitive passes (e.g., a clear feature detector) and fails (e.g., an unused correlate), linking to clauses. Notes consensus on (i) and (ii) as necessary.  
     *Typical mistake:* Omitting the negative case or failing to reference clauses.  
  2. **Over/under-generation analysis:** Provides plausible examples (e.g., over-generation via confound correlation; under-generation via distributed codes). Highlights how (iii) may resolve over-generation but relies on choice.  
     *Typical mistake:* Vague examples without ties to clauses, or ignoring under-generation.  
  3. **Clause roles and controversies:** Identifies (ii) as settled/critical for excluding correlates, and (iii) as vital but contested due to descriptive relativity. Notes (i) as necessary but weak alone.  
     *Typical mistake:* Overlooking the contentiousness of (iii) or overstating consensus.  
  4. **Criterion vs. programme assessment:** Argues the test is a research programme due to unresolved choices (e.g., vocabulary for (iii), state granularity). Contrasts with straightforward application.  
     *Typical mistake:* Treating the test as fully operational without gaps.  
  5. **Scenario implications:** For realism, notes multiple realizability but tension with objectivity; for instrumentalism, emphasizes tool-relativity. Links outcome to test clauses (e.g., both may pass if groups allowed).  
     *Typical mistake:* Ignoring one viewpoint or failing to reference the test.  

  **Overall argument (5 marks):**  
  Structure, coherence, and philosophical depth. Award:  
  - 5: Logically flows, covers all parts, distinguishes settled/live issues throughout, original synthesis.  
  - 4: Hits all points but with minor disorganization or less nuance on disputes.  
  - 3: Misses one key area or has weak connections.  
  - 2–0: Unbalanced, omits multiple sections, or confused.  

  **Separating first-class (21+) from upper-second (17–20):**  
  A first-class answer weaves must-hit points into a compelling narrative, explicitly demarcating settled vs. contested claims (e.g., noting load-bearing’s consensus while problematizing non-substitutability’s relativity). It offers independent insight, such as arguing why the test’s choices undermine realism in the scenario. An upper-second answer covers all points adequately but with less finesse in linking them, vaguer dispute distinctions, or limited originality in the synthesis.
