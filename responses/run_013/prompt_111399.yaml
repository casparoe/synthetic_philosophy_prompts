  I should ensure the marking scheme includes clear criteria. Top answers must define harm explicitly, apply it consistently, engage with aggregation beyond stock positions, address objections thoroughly, and maintain symmetry in evaluating gains vs. losses. The consistency test is crucial: if a student dismisses nanosecond losses as non-harm because they're unfelt, they must similarly dismiss nanosecond gains. Any asymmetry should cost marks. This tests their foundational principles.

  The user mentioned avoiding philosopher names and -isms, so the question itself must stand alone. The model answer can reference concepts like experientialism but shouldn't rely on external citations. The case description needs to be self-contained so even unprepared students can engage.

  Potential pitfalls to address: Students might conflate harm with preference frustration or counterfactuals. The marking scheme should penalize inconsistency, like valuing gains but not losses. Also, ensuring part (c) isn't superficial—objections should challenge their core argument, not just be a minor tweak.

  Finally, the model answer needs to demonstrate depth. For example, exploring whether life's value is tied to experiences or existence itself. If existence is intrinsically valuable, then even a nanosecond loss is harm, leading to aggregation. But this must be consistently applied to gains too. The key is pushing students to examine their assumptions and avoid easy answers.
answer: |-
  Here’s the exam question, model answer, and marking scheme designed to force engagement with the metaphysics of harm and avoid rehearsed positions:

  **Exam Question (Total: 25 Marks)**

  **The Scenario:** You must choose one of two outcomes:
  *   **Outcome A:** One person endures 50 years of excruciating torture.
  *   **Outcome B:** A vast number of people (e.g., 3.15 x 10^17) each lose exactly one nanosecond (one billionth of a second) of their total lifespan. This loss is imperceptible: no one feels pain, notices any change, or experiences any interruption to their life activities. The *only* effect is that each person dies one nanosecond earlier than they otherwise would have, thereby missing one nanosecond of whatever their life would have contained.

  **(a) Defining Harm (8 Marks):** What must be true for an event or state to constitute a "harm" to a person? Does the loss of one nanosecond of life experienced in Outcome B qualify as a harm? Justify your answer, focusing on the *nature* of harm itself.

  **(b) Choice and Principle (10 Marks):** Based on your definition of harm in (a), which outcome (A or B) should be chosen? Explain why. What specific principle does your choice commit you to regarding the aggregation (adding up) of extremely minor potential harms across many people? Crucially, show how this principle differs significantly from simply declaring either that "small harms always aggregate" or that "no quantity of small harms can outweigh a large one."

  **(c) Objection and Cost (7 Marks):** What is the strongest objection to your chosen outcome and principle from part (b)? Explain why this objection is powerful. To meet this objection successfully, what core assumption or commitment from your argument in (a) or (b) would you likely need to abandon or significantly revise?

  ---

  **Model Answer (Strong Student Response ~700 words)**

  **(a) Defining Harm (8 Marks):**
  For an event or state to constitute a genuine harm to a person, it must negatively impact their *subjective experience* or *conscious well-being* in some way. A harm requires a subject who can *suffer* its negative effect – it must make their life, from their perspective, worse off than it otherwise would have been. This typically involves pain, distress, frustration, loss of functioning, or the thwarting of significant desires or goals that the person cares about. Crucially, the harm must be *experienceable*; it must register, however faintly, within the person's conscious awareness or significantly alter the course of experiences they *can* have.

  The loss of one nanosecond of life in Outcome B does **not** qualify as a harm under this definition. A nanosecond is far shorter than the minimum temporal threshold for any conscious experience or neurological processing. No human brain can register an event lasting one nanosecond, nor can such a minuscule shortening of lifespan alter the sequence or quality of any conscious moments a person has. The person loses nothing they could ever notice, feel, desire, regret, or integrate into their life narrative. While it is true *counterfactually* that they die slightly earlier, the *actual lived reality* of their existence is utterly unchanged. Since harm requires an experiential impact or a tangible deprivation of something that *could* be experienced (like losing a limb, which alters future experiences), this imperceptible, non-experiential shortening fails to meet the necessary condition for being a harm to the individual at all. It is a metaphysical subtraction without an experiential correlate.

  **(b) Choice and Principle (10 Marks):**
  Given that the nanosecond loss is not a harm, Outcome B involves inflicting *no actual harm* on the vast multitude. Outcome A, however, inflicts an immense, undeniable harm – 50 years of torture – on one person. Therefore, Outcome A should be rejected, and **Outcome B should be chosen**. Choosing B avoids the catastrophic harm of torture while causing no genuine harm to anyone else.

  This choice commits me to a specific principle about aggregating minor potential detriments: **Only states or events that constitute *actual experiential harms* to individuals can be aggregated in moral calculus.** Potential detriments that fall below the threshold of being a recognizable harm to the person experiencing them – because they are imperceptible, non-experiential, or too minor to register as a negative change in well-being – carry no moral weight. They are not "small harms"; they are **non-harms**.

  This principle fundamentally differs from the standard aggregator and anti-aggregator positions:
  1.  **Vs. Simple Aggregation:** The standard aggregator treats the dust speck (or here, the nanosecond loss) *as* a tiny harm and adds them up arithmetically. I reject this because I deny the nanosecond loss *is* a harm *at all*. It's not about adding small units; it's about recognizing that some things labeled "harms" are actually morally weightless non-harms. Arithmetic aggregation only applies *after* something passes the threshold of being a genuine harm.
  2.  **Vs. Simple Anti-Aggregation:** The standard anti-aggregator might also choose B, but based on the claim that "no number of small harms outweighs a large one," implying the nanoseconds *are* harms, just non-aggregable. My position is stronger: the nanoseconds *aren't harms in the first place*. The problem isn't aggregation; it's misidentifying a non-harm as a harm. Anti-aggregation often relies on lexical thresholds for aggregating harms, while my position sets a threshold for what *counts* as harm.

  **(c) Objection and Cost (7 Marks):**
  The strongest objection targets the counterfactual nature of harm and life's intrinsic value. The objection argues: "Even if imperceptible, the nanosecond loss *is* a harm because it deprives the person of a segment of their life – the goods, experiences, or simply the existence they *would have had* during that time. Life itself, as a continuous good, is diminished by any shortening, however small. Failing to recognize this treats life as having value *only* in its conscious moments, ignoring the intrinsic value of existence itself and the counterfactual loss of potential."

  This is powerful because it challenges the core experiential premise. If life has intrinsic value simply by existing, then any reduction in lifespan, regardless of perceptibility, is a real deprivation – a harm of deprivation. It points out that we often value life prospectively and retrospectively in ways that aren't solely tied to moment-to-moment experience (e.g., wanting to live to see a grandchild born, valuing a long life abstractly). If a nanosecond of life has *any* positive value intrinsically, then losing it *is* a harm, however minute.

  To meet this objection, I would likely need to abandon or significantly revise my **strictly experiential definition of harm**. I would need to accept that some harms can be purely counterfactual and non-experiential, grounded in the deprivation of potential existence or abstract goods, even if the person never consciously registers the loss. This concession would force me to acknowledge that the nanosecond loss *is* a harm (albeit vanishingly small), collapsing my argument back towards needing to justify why aggregating an astronomical number of such micro-harms still doesn't outweigh the torture – essentially pushing me into the territory of defending a modified anti-aggregation stance based on the nature of the harms involved, rather than denying their status as harms altogether.

  ---

  **Marking Scheme (25 Marks Total)**

  **General Expectations for Top Band (21-25 Marks):**
  *   **Clarity & Precision:** Arguments are clearly stated, logically structured, and terminology is used carefully.
  *   **Depth of Engagement:** Moves beyond surface description to grapple with underlying philosophical concepts (nature of harm, value of life, aggregation thresholds).
  *   **Originality & Avoidance of Cliché:** Clearly distinguishes its position from simple aggregation or anti-aggregation. Avoids merely naming positions.
  *   **Self-Consistency:** Arguments across (a), (b), and (c) cohere logically.
  *   **Symmetry Test:** Handles gains and losses of imperceptible magnitudes consistently (see below).

  **Part (a) Defining Harm (8 Marks):**
  *   **Top (7-8):** Offers a clear, substantive definition of harm (e.g., experiential, counterfactual deprivation, preference frustration). Explicitly applies this definition to the nanosecond case with reasoned justification. Clearly states whether it qualifies as harm *under that definition*.
  *   **Mid (4-6):** Provides a definition but it may be vague or underdeveloped. Application to nanoseconds is attempted but may be weak or lack justification. May not explicitly state the conclusion.
  *   **Low (1-3):** Definition is missing, incoherent, or merely descriptive (e.g., "harm is bad"). Application is absent, incorrect, or ignores the specifics (imperceptibility).
  *   **Common Mistake:** Asserting the nanosecond loss is/isn't a harm without grounding it in a clear definition. Failing to engage with the *imperceptibility* and *non-experiential* nature.

  **Part (b) Choice and Principle (10 Marks):**
  *   **Top (9-10):** Choice (A or B) follows logically and explicitly from the definition in (a). States a clear, specific aggregation principle derived from the definition that *explicitly explains why it differs* from simple aggregation ("just do the math") AND simple anti-aggregation ("no small harms add up"). The distinction is substantive (e.g., threshold for harm vs. aggregation limit).
  *   **Mid (5-8):** Choice follows from (a). States a principle but it may be vague or not sufficiently distinguished from the stock positions (e.g., says "it's different" but doesn't show *how*). May lapse into describing aggregation/anti-aggregation.
  *   **Low (1-4):** Choice doesn't follow from (a). Principle is missing, incoherent, or simply restates one of the stock positions without meaningful differentiation. Ignores the requirement to show difference.
  *   **Common Mistake:** Defaulting to "choose B, aggregating small harms is wrong" without linking it to the specific definition of harm from (a). Stating a principle that *is* just aggregation/anti-aggregation in disguise (e.g., "only big harms matter").

  **Part (c) Objection and Cost (7 Marks):**
  *   **Top (6-7):** Identifies a *strong*, *philosophically relevant* objection targeting a core premise of the student's own argument in (a) or (b) (e.g., challenges experiential harm definition, points out inconsistency, highlights counterfactual loss). Explains *why* it's powerful (e.g., exposes a weakness, forces a difficult choice). Clearly identifies a specific, significant assumption/commitment from their prior answer that would need revision/abandonment to meet the objection.
  *   **Mid (4-5):** Identifies an objection, but it may be weaker, less relevant, or target a peripheral point. Explanation of its power is superficial. Cost identified is vague or doesn't directly address the core argument.
  *   **Low (1-3):** Objection is trivial, irrelevant, or misrepresents the student's own argument. Explanation of power is absent or weak. Cost is missing or unrelated.
  *   **Common Mistake:** Offering a superficial objection (e.g., "some might disagree"). Failing to target their *own* argument's core. Identifying a cost that is merely a minor adjustment, not a significant revision/abandonment of a core commitment.

  **Mandatory Consistency Test (Applied Across Script):**
  *   **Requirement:** Any argument claiming the nanosecond loss is **not a harm** *because it is imperceptible/unfelt/unexperienced* **must also hold** that a nanosecond *gain* of life (similarly imperceptible) is **not a benefit**.
  *   **Penalty (-3 to -5 Marks):** A script exhibiting **asymmetry** – treating an imperceptible loss as non-harmful *while* implicitly or explicitly treating an imperceptible gain as beneficial (or vice-versa) – demonstrates a fundamental inconsistency in the underlying theory of value/harm. This is a significant philosophical error. Deduct marks primarily from Parts (a) and (b), as it indicates a flawed definition or principle.
  *   **Rationale:** The justification for dismissing the loss (imperceptibility) logically applies equally to a gain. Asymmetry suggests an unargued bias ("losses bad, gains good") or an incoherent theory. This test probes the internal consistency of the student's core value theory.
  *   **Alternative Test (If Symmetry Test Rejected - Not Recommended):** *"Does the argument rely on a distinction that could be infinitely regressed (e.g., 'too small to matter')? If so, does it provide a non-arbitrary justification for where the threshold lies?"* However, the symmetry test is more fundamental and directly addresses the nature of value/harm central to this scenario.
