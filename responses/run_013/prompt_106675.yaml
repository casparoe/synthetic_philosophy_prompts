answer: |-
  ### Decision Procedure for Superrational Choices in the Cooperative

  **Philosophical Foundation**: Superrationality applies in symmetric predicaments where all agents reason identically, leading to correlated choices. It overcomes Nash equilibria by asking: "What would I want everyone to do, knowing they think as I do?" This shines in dilemmas like Prisoner's Dilemma but fails with asymmetric payoffs, multiple equilibria, or when common reasoning is absent. Key fragilities include:
  - **Symmetry breaks**: If situations or reasoning differ, correlation vanishes.
  - **Multiple optima**: When several symmetric Pareto-efficient outcomes exist, superrationality doesn't resolve ambiguity.
  - **Unilateral incentives**: If one agent can profitably defect regardless of others, the logic crumbles.

  **Decision Procedure**: Ask these questions in order. Aim for ≤10 minutes. Judgment-heavy steps marked with **(!)**.

  #### Step 1: Symmetry Check  
  *Question*: "Are all members facing identical options, payoffs, and information? Is the outcome equally affected by each choice?"  
  *Sufficient answer*: **Yes** → Proceed to Step 2.  
  **No** → Hand back to personal values (asymmetry breaks superrationality).  
  **(!)** *Judgment call*: Payoffs may differ subtly (e.g., varying boat sizes). If differences are negligible, proceed.

  #### Step 2: Common Reasoning Check  
  *Question*: "Can I assume all members are using *this exact reasoning*? Is this common knowledge?"  
  *Sufficient answer*: **Yes** → Proceed to Step 3.  
  **No** → Hand back to personal values (superrationality requires aligned cognition).  
  **(!)** *Judgment call*: Relies on trust in cooperative norms. If members historically reason differently (e.g., short-term selfishness), stop.

  #### Step 3: Pareto-Superiority Test  
  *Question*: "What happens if *everyone* chooses each option? Is there **exactly one** outcome where all do better than if all chose any other option?"  
  *Sufficient answer*:  
  - **Yes, one dominant symmetric outcome** → Proceed to Step 4.  
  - **No** (multiple or zero such outcomes) → Hand back to personal values (superrationality indecisive).  
  **(!)** *Judgment call*: Requires estimating collective payoffs. Ignore asymmetric outcomes (e.g., "if only *I* defect")—superrationality excludes them.

  #### Step 4: Output Decision  
  *Question*: "Does the Pareto-superior outcome require mutual cooperation?"  
  *Sufficient answer*:  
  - **Yes** → **Firm "COOPERATE"**.  
  - **No** → **Firm "DON’T cooperate"** (i.e., all should defect if that is Pareto-superior).  
  *No judgment*: Mechanical given Step 3.  

  ---

  ### Case Applications

  #### (i) Unusually Profitable Haul (Over Seasonal Limit)  
  - **Step 1**: Symmetric. All crews face identical choice: extra haul (defect) or comply (cooperate). Payoffs identical (short-term gain vs. long-term resource depletion).  
  - **Step 2**: Common reasoning plausible. Cooperative ethos implies shared decision norms.  
  - **Step 3**: Outcomes:  
    - *All defect* → Resource collapse; worst long-term payoff.  
    - *All cooperate* → Sustainable fishing; best collective payoff.  
    Only "all cooperate" is Pareto-superior (beats "all defect"). Unique optimum.  
  - **Step 4**: **COOPERATE** (stay within limit).  

  *Superrational insight*: Choosing the haul invites identical choices by all, ensuring mutual loss. You want everyone to comply.

  #### (ii) Honoring Costly Gear Ban (While Neighboring Fleet Cheats)  
  - **Step 1**: Symmetric. All cooperative crews face same choice: honor ban (cooperate) or use gear (defect). Payoffs identical (undercut by neighbors if all cooperate; competitive if all defect).  
  - **Step 2**: Common reasoning plausible (if cooperative uses this procedure).  
  - **Step 3**: Outcomes:  
    - *All cooperate* → Sustained losses to neighbors; worst payoff.  
    - *All defect* → Short-term competitiveness; better payoff (*if* gear damage is negligible vs. neighbor impact).  
    "All defect" is Pareto-superior *if* payoff > "all cooperate" (e.g., if neighbor overfishing dooms the resource regardless). Unique optimum.  
  - **Step 4**: **DON’T cooperate** (use the gear).  

  *Superrational insight*: If the ban is futile (neighbors prevent resource sustainability), mutual defection is collectively optimal. You want everyone to defect to avoid being exploited.

  ---

  ### Where the Procedure Fails  
  1. **Large Cooperatives**:  
     - Steps 1–2 degrade. Symmetry breaks (e.g., geographic differences). Common reasoning becomes implausible without intense communication.  
     - *Result*: Frequent handback to values, inviting Nash-style self-preservation.  

  2. **Divergent Reasoning**:  
     - Step 2 fails if members distrust superrationality or prioritize individualism. Correlation assumption collapses.  
     - *Result*: Procedure defaults to personal values early; game theory reverts to Nash equilibria.  

  3. **Survival Over Idealism**:  
     - When stakes are existential (e.g., "can I survive this season?"), superrationality is overruled by dominant strategies. The procedure ignores private payoffs.  
     - *Example*: A starving crew defects regardless of Step 4—survival dominates collective logic.  

  **Final Boundary**: The procedure stops where reasoning does—when symmetry, cognition, or stakes fracture the "identical agent" model. It cannot resolve:  
  - Values conflicts (e.g., "is sustainability worth starvation?").  
  - Asymmetric power dynamics (e.g., one crew dominates resources).  
  - Non-cooperative outsiders (e.g., the neighboring fleet).  

  **Closing Advice**: Use this for clear symmetric dilemmas with trusted members. When fragility emerges, shift to risk management: "What can I survive if others act randomly?" The superrational leap is collective; the fallback is individual.
