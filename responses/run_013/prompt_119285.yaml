  The self-reference can be handled by realizing that the knowledge is not possible, so the event can occur without being known in advance.

  For example, if the spot-check is on Monday, then on Sunday we don't know it's Monday (since it could be other days), so we don't know on the day before. Similarly, if on Tuesday, on Monday we might think it could be Monday or later, but not know it's Tuesday, so on Monday evening, if no check, we know it's not Monday, but for Tuesday, on Monday we didn't know it would be Tuesday.

