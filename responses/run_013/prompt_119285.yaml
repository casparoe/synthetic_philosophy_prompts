  For example, we might assign probability to each day or something.

  In this case, the spot-check can happen, and it might be a surprise if we didn't expect that day.

  Marcus argues that the announcement is a trick because it relies on us reasoning poorly (i.e., believing the chain).

  But if we reason well, we see that the announcement can't be true if we take it literally, so we don't rely on it, and then surprise is possible without the announcement forcing it.

  So, Marcus is right that with good reasoning, we shouldn't believe the backward induction conclusion; instead, we should be skeptical of the announcement.

  **Adjudicating Move (4): Dana's Reply**

  Dana says that the lead only promised we wouldn't know the day, and the self-referential nature makes it impossible to know the day even with good reasoning.

  For instance, if we think it could be any day, but on, say, Thursday, if no check yet, we might think it must be Thursday or Friday, but we don't know which, so it could still be a surprise if it happens on Thursday.

  The backward induction only works if we can eliminate days, but if we don't trust the announcement, we can't eliminate Friday, for example.

  Dana's point is that the announcement itself creates a situation where, no matter how we reason, we cannot know in advance which day it will be, because if we could know, it would violate the surprise.

