prompt: |-
  I am putting together materials for a graduate seminar in population ethics, and for one of the workshop sessions I would rather use a satire than another exposition, so I would like you to draft a mock Regulatory Impact Assessment in the deadpan register of a real government cost-benefit document, issued by an invented agency — call it the Office of Long-Range Consequences — in defense of a policy its own authors concede will leave the future worse off. The policy, which you may specify as you like, should be something like a long-term resource-extraction and settlement-licensing regime that will degrade the climate and drain aquifers for a century or more; what makes it interesting to the agency is that it will also, by shifting migration patterns and the timing of family formation, determine which people come to exist. The memo's central move is what its drafters call the Non-Identity Offset: because every person who will live under the policy would not have existed under the alternative, and because each of them will have a life worth living, the agency proposes to record the resulting harms at zero, on the ground that there is no one who can be identified as having been made worse off. Please build out the apparatus in the same spirit — a Counterfactual Substitute Assay that demonstrates the alternative course would have produced different persons, a Grievance Eligibility Window requiring complainants to show they would have existed but for the policy, a worked example involving a household that moves and conceives a child a few months earlier than it otherwise would have, and a cost-benefit table in which a column of very large damages is entered as unassignable and therefore nil. Include a section anticipating objections, in which the agency answers honestly enough that the reader can see the real trouble: that the same reasoning would license nearly anything, that there may or may not be a principled difference between harms that run through a person's identity and harms that do not, and that the objection seems to require a way of comparing outcomes that does not reduce to comparing how well off particular people are. End with a short citizen-facing FAQ and a final provision proposing a constitutional amendment to the same effect. The target of the satire is the person-affecting restriction and the bureaucratic habit of treating the nonidentity problem as a license rather than a puzzle, not any actual philosopher or agency, and the piece should never wink: the humor has to come from getting the structure right, so that someone who knows the literature laughs rather than winces while someone who does not can still reconstruct the problem from the memo alone. Keep the nonidentity problem distinct from the repugnant conclusion and the mere-addition paradox — the memo may gesture at them but must not conflate them — and write it in American English, roughly 800 words, formatted as numbered sections with headers and at least one table.
reasoning: |-
  We are creating a satirical Regulatory Impact Assessment from the fictional "Office of Long-Range Consequences" (OLRC). The policy in question is a long-term resource extraction and settlement licensing regime that will have negative environmental consequences but, by altering migration and family formation, will change which people come to exist. The central concept is the "Non-Identity Offset", which sets the harm to future people at zero because they wouldn't have existed otherwise and their lives are worth living.

  The document must be in a deadpan, bureaucratic style. It should include:
  1. An invented policy (e.g., "Frontier Development and Resource Access Program" or FDRAP)
  2. The Non-Identity Offset as a key analytical tool.
  3. A Counterfactual Substitute Assay (to show that the alternative would have produced different persons).
  4. A Grievance Eligibility Window (requiring complainants to show they would have existed without the policy).
  5. A worked example (e.g., a household moving and conceiving a child earlier).
  6. A cost-benefit table with a column for damages that are unassignable (thus set to zero).
  7. A section anticipating objections, where the agency honestly addresses problems (like the reasoning licensing nearly anything, the lack of a principled difference between identity-affecting and other harms, and the need for a non-person-based comparison).
  8. A citizen-facing FAQ.
  9. A proposed constitutional amendment.

  The satire targets the person-affecting restriction and bureaucratic misuse of the nonidentity problem. We must keep it distinct from the repugnant conclusion and mere-addition paradox.

  Let's structure the document:

  **REGULATORY IMPACT ASSESSMENT**
  **Office of Long-Range Consequences**
  **Policy: Frontier Development and Resource Access Program (FDRAP)**

  **1. Executive Summary**
  The OLRC has evaluated the Frontier Development and Resource Access Program (FDRAP), which authorizes expanded extraction of subsurface resources (including fossil fuels and minerals) and establishes settlement licenses in designated frontier zones for the next 150 years. The program is expected to generate significant economic benefits, though it will also result in long-term environmental degradation, including climate change impacts and aquifer depletion. However, due to the program's effect on human migration and family formation timing, the future population will be composed entirely of persons who would not have existed under the alternative (no action). Applying the Non-Identity Offset, the OLRC finds that the program's long-term harms are unassignable and therefore net to zero. The program is recommended for approval.

  **2. Policy Description**
  FDRAP establishes a licensing regime for resource extraction and settlement in 15 designated frontier zones. The program will:
  - Issue 10-year renewable extraction licenses for fossil fuels and critical minerals.
  - Grant settlement licenses for residential and commercial development, contingent on resource extraction activity.
  - Run for an initial term of 150 years, with a review every 50 years.

  **3. Analytical Framework**
  The OLRC employs a standard cost-benefit analysis (CBA) over a 300-year horizon. Unique to long-range assessments, we incorporate:
  - **Counterfactual Substitute Assay (CSA):** A demographic model that simulates the identity of future persons under the policy and the alternative. The CSA uses microsimulation of family formation, accounting for factors such as migration, timing of conception, and partner selection. The model confirms that FDRAP will result in a completely different set of future persons by year 50 (with 99.7% probability).
  - **Non-Identity Offset:** Any harm to a person that arises from the policy is offset to zero if that person would not have existed under the alternative, provided their life is worth living (i.e., they do not regret having been born). This is based on the principle that there is no identifiable victim who is worse off.
  - **Grievance Eligibility Window (GEW):** For any future harm, a complainant must demonstrate that they would have existed in the alternative scenario (but for the policy) and that they are worse off than they would have been. This window is set at 150 years post-implementation.

  **4. Worked Example: The Henderson Household**
  Consider a household that, under FDRAP, relocates to a frontier zone in 2035 for employment in resource extraction. The move prompts the couple to conceive a child in June 2035 (Child A). Without FDRAP, the couple would have remained in their home state, conceived a child in September 2035 (Child B), and had no other children. 
  - Child A exists under FDRAP; Child B does not. 
  - Child A experiences harms from climate change (e.g., reduced agricultural yield, extreme weather) that Child B would not have faced to the same degree. 
  - However, because Child A would not have existed without FDRAP, and assuming Child A's life is worth living, the harms to Child A are unassignable (no one is worse off compared to the alternative in which they exist). Thus, the harm is recorded as zero.

  **5. Cost-Benefit Analysis**
  The table below summarizes the quantified impacts (in trillions of 2023 dollars, discounted at 2% annually).

  | Impact Category                  | Benefits | Costs | Non-Identity Offset (Unassignable Costs) | Net Impact |
  |----------------------------------|----------|-------|------------------------------------------|------------|
  | Resource Extraction Revenues     | 450      | -     | -                                        | 450        |
  | Settlement Development Revenues  | 120      | -     | -                                        | 120        |
  | Environmental Damages (Year 50+) | -        | 800   | 800 (offset to zero)                     | 0          |
  | **Total**                        | **570**  | **800** | **800 (offset)**                        | **570**    |

  *Note: Environmental Damages include climate change impacts (e.g., sea-level rise, extreme weather) and aquifer depletion. Without the Non-Identity Offset, the program would show a net cost of -230 trillion. With the offset, the net benefit is 570 trillion.*

  **6. Anticipated Objections and Agency Response**
  *Objection 1: The Non-Identity Offset could justify nearly any harmful policy as long as it changes who is born.*  
  Response: The OLRC acknowledges this feature. However, the offset is strictly limited to policies that alter the identity of future persons and where the lives of those persons are worth living. It is not a general license for harm, but a recognition of the unique ethical and accounting challenges of long-range policy.

  *Objection 2: There is no principled difference between harms that affect a person's identity (e.g., by changing when they are conceived) and harms that do not (e.g., exposing an existing person to pollution).*  
  Response: The distinction is operational. The Grievance Eligibility Window requires that a victim must be identifiable in both scenarios. Harms that do not alter identity (and thus the same person exists in both scenarios) are assignable and counted. Harms that alter identity are not.

  *Objection 3: This approach seems to require a way of comparing outcomes that does not reduce to comparing how well off particular people are.*  
  Response: The OLRC agrees that such comparisons (e.g., based on aggregate welfare or other impersonal values) may be philosophically plausible. However, our statutory mandate (Long-Range Accountability Act of 2027) requires a person-affecting framework. We operate within these constraints.

  **7. Citizen-Facing FAQ**
  *Q: How can the agency claim that environmental damages are zero when we know the planet will be worse off?*  
  A: The damages are real but unassignable to any particular person who is worse off than they would have been. The individuals experiencing the damaged world would not have existed in the alternative scenario. Therefore, they are not victims but beneficiaries of existence.

  *Q: Doesn't this mean we can ignore the future?*  
  A: Not at all. We account for all impacts that affect identifiable persons. The Non-Identity Offset is a precise tool for long-range planning, ensuring we do not falsely assign harms to persons who owe their existence to the policy.

  **8. Proposed Constitutional Amendment**
  To provide a stable foundation for long-range policy, the OLRC proposes the following amendment to the U.S. Constitution:  
  *Section X: In the assessment of governmental policies extending beyond one generation, no person shall be deemed to have been harmed by such policy if that person would not have existed but for the policy and if their life is worth living.*

  **9. Conclusion**
  FDRAP offers substantial economic benefits with no net long-term harms due to the Non-Identity Offset. The OLRC recommends implementation.

  ---

  This document is approximately 800 words and hits all the requested elements. The satire lies in the deadpan presentation of the Non-Identity Offset as a routine accounting tool and the proposed constitutional amendment, which institutionalizes the nonidentity problem as a license to ignore long-term harms.
