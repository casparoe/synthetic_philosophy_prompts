  **REGULATORY IMPACT ASSESSMENT**  
  **Office of Long-Range Consequences (OLRC)**  
  **RIN: 4040-AA00**  
  **Issued: April 1, 2050**  

  ---

  ### 1. EXECUTIVE SUMMARY  
  This assessment evaluates the **Continental Resource and Settlement Initiative (CRSI)**, a 150-year licensing regime permitting aquifer-intensive agriculture and hydrocarbon extraction in designated arid zones (Dockets AZ-7 through AZ-12). CRSI will accelerate climate volatility and deplete regional groundwater reserves by 2140. However, by redirecting migration flows and altering reproductive timelines, CRSI will determine the specific identities of future persons. OLRC’s analysis applies the **Non-Identity Offset** (§4.1), which assigns a net value of zero to long-term damages, as affected individuals cannot be identified as worse off relative to a counterfactual in which they would not exist. Net quantified benefits total $210 trillion (discounted). Implementation is recommended.  

  ---

  ### 2. POLICY DESCRIPTION  
  CRSI authorizes:  
  - **Resource Extraction:** 120-year leases for hydrocarbon/mineral mining in AZ zones, exempting Tier III aquifer sustainability standards.  
  - **Settlement Licensing:** Subsidized development permits contingent on resource-sector employment, inducing population relocation.  
  **Projected Outcomes:**  
  - Atmospheric CO₂e increase: +85 ppm by 2150.  
  - Aquifer depletion: 90% of AZ groundwater reserves exhausted by 2140.  
  - Demographic shift: ~4.2 million future persons will exist who otherwise would not.  

  ---

  ### 3. ANALYTICAL FRAMEWORK  
  #### 3.1 Counterfactual Substitute Assay (CSA)  
  The CSA models identity divergence under CRSI vs. the "No Action" alternative. Inputs include:  
  - **Migration Probability Matrix:** Labor demand redirects 600,000 households to AZ zones by 2060.  
  - **Conceptual Timing Variable:** Partner pairings and conception dates shift by 1–18 months.  
  **Result:** By 2075, 99.3% of the AZ-originated population are "non-overlapping persons" (CSA v.3.1, p. 42).  

  #### 3.2 Non-Identity Offset  
  - **Definition:** Harms to persons whose existence is causally dependent on CRSI are valued at $0, provided their lives meet the **Positive Existence Threshold** (well-being > net suffering).  
  - **Basis:** No complainant is identifiably deprived (per *Williams v. Fed. Climate Agency*, 2042).  

  #### 3.3 Grievance Eligibility Window (GEW)  
  To claim redress, a future complainant must demonstrate:  
  - They would have existed under the "No Action" baseline;  
  - They are worse off due to CRSI.  
  GEW applies to harms manifesting 2075–2200.  

  ---

  ### 4. WORKED EXAMPLE: NON-IDENTITY OFFSET APPLICATION  
  #### Case: Henderson Household (AZ-9 Settlement Licensees)  
  - **CRSI Scenario:** Relocates to AZ-9 in 2061; child conceived July 2062 ("Subject A").  
  - **No Action Scenario:** Remains in Midwest; child conceived November 2062 ("Subject B").  
  - **Harm:** Subject A experiences chronic water scarcity (well-being reduction: 15 utils vs. Subject B’s projected 20 utils).  
  - **Offset Analysis:**  
    - Subject A would not exist but for CRSI.  
    - Subject A’s life satisfaction (5 utils) > Positive Existence Threshold (0 utils).  
    - Harm value: $0 (unassignable).  

  ---

  ### 5. COST-BENEFIT ANALYSIS  
  *Table 1: CRSI Impacts (Present Value, 2050–2200; Discount Rate: 2%)*  

  | Category                          | Benefits ($T) | Costs ($T) | Non-Identity Offset ($T) | Net ($T) |  
  |-----------------------------------|---------------|------------|---------------------------|----------|  
  | Resource Extraction Revenues      | 320           | –          | –                         | 320      |  
  | Settlement Economic Activity      | 110           | –          | –                         | 110      |  
  | **Environmental/Harm Costs**      |               |            |                           |          |  
  |   Climate Adaptation (2100–2200) | –             | 180        | 180 → **0**               | 0        |  
  |   Aquifer Depletion (2080–2180)  | –             | 200        | 200 → **0**               | 0        |  
  | **Total**                         | **430**       | **380**    | **380 → 0**               | **430**  |  

  **Net Benefit:** $430T - $220T (non-environmental costs) = **$210T**  

  ---

  ### 6. ANTICIPATED OBJECTIONS AND AGENCY RESPONSE  
  #### Objection 6.1: CRSI’s logic permits catastrophic harm if beneficiaries would not otherwise exist.  
  *Response:* The Non-Identity Offset is constrained by the Positive Existence Threshold. Policies producing lives not worth living (e.g., below-threshold suffering) remain actionable. CRSI clears this threshold comfortably (avg. well-being: +7 utils).  

  #### Objection 6.2: No ethical distinction exists between identity-determining and non-identity-determining harms.  
  *Response:* The distinction is operational, not ethical. GEW requires redressable victims to be identifiable in both scenarios. Identity-determining harms fail this test; non-identity harms (e.g., pollution injuring fixed-population cohorts) do not.  

  #### Objection 6.3: This framework cannot compare futures with different populations.  
  *Response:* OLRC acknowledges this limitation. Statutory constraints (Long-Term Policy Act §5(b)) require person-affecting accounting. Alternatives (e.g., impersonal aggregation) exceed OLRC’s mandate.  

  ---

  ### 7. CITIZEN-FACING FAQ  
  **Q: Does OLRC deny that CRSI damages the future?**  
  A: No. Physical damages (e.g., aridification) are real but unassignable to specific victims due to population substitution.  

  **Q: Can affected persons sue under CRSI?**  
  A: Only if they prove they would have existed identically without CRSI (GEW §3.3). To date, 0 petitions meet this standard.  

  **Q: Why prioritize short-term benefits?**  
  A: CRSI’s benefits are immediate and assignable; long-term damages are statistically zero after the Non-Identity Offset.  

  ---

  ### 8. PROPOSED CONSTITUTIONAL AMENDMENT  
  To resolve juridical inconsistencies, OLRC proposes:  
  > **Section 29:** No person shall hold standing to challenge a policy on grounds of reduced well-being if:  
  > (a) Their existence is predicated on said policy; and  
  > (b) Their life, per prevailing utilitarian metrics, is worth living.  

  ---

  ### 9. CONCLUSION  
  CRSI yields unambiguous net benefits. Environmental damages are unassignable under the Non-Identity Offset and thus valued at $0. Approved for implementation.  

  —  
  *Dr. Evelyn Ross, Director, Office of Long-Range Consequences*  


