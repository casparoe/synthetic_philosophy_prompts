  Okay, the user is teaching a night class on Shakespeare and political theory, focusing on Coriolanus through the lens of populism and "the will of the people." They want a reading that goes beyond labeling Coriolanus as a snob. Their main concern is the play's two conflicting depictions of the people's will: one as an aggregate of individual votes and the other as a single, unified voice claimed by different factions. The user questions whether the gap between these views is an insight or a muddle, and if the play reveals that the demos might lack a coherent will altogether.

  First, I need to address both pictures of the people's will. The voting scene is crucial here. The citizens file past and give their voices, which are counted. This process seems straightforward—adding up individual choices. But the play complicates this with the tribunes' manipulation. They instruct the citizens to change their minds after granting initial consent, showing that the count can be engineered. So the aggregate isn't a pure expression of will but malleable. 

  Then there's the single-voice idea. Coriolanus denies the plebeians are "the people," reserving that term for the patricians. The tribunes position themselves as the true voice. Menenius uses the body politic fable to suggest unity, but it's undermined by the play's events. The key point is that both pictures are constructs. The single voice is always ventriloquized, and the aggregate is manipulable. 

  The user is wary of the body politic metaphor dominating the discussion. I should acknowledge it but focus on how the play subverts it. The tribunes' manipulation shows the "will" as performative. The people's fickleness isn't just about changing opinions but their lack of a pre-existing will. Their demands shift based on circumstance—grain, then grievances, then manipulated votes. 

  The ending is significant. The people turn against Coriolanus after the tribunes' provocation, but their reaction is fragmented. Some support him initially, then withdraw. This doesn't resolve the tension but highlights the constructed nature of their will. The tribunes' victory shows how claiming to represent "the people" is a political tool. 

  The user’s deeper need might be to challenge students' assumptions about populism. The play suggests that "the people's will" is a myth used by elites. The demos doesn't have a unified will; it's shaped by rhetoric and context. This critiques populist rhetoric that claims a singular voice. 

  I should connect this to modern populism theory, like Laclau or Canovan, without getting academic. Emphasize Shakespeare's insight: the will isn't discovered but created, often by those in power. The gap between the two pictures isn't a muddle but the core insight. The play dramatizes the tension, showing both methods as flawed and politically instrumentalized. 

  Finally, ensure the analysis stays grounded in the text. Use key scenes: the marketplace, the banishment, the final betrayal. Highlight Coriolanus's inability to play the political game, which contrasts with the tribunes' manipulation. His downfall isn't just arrogance but his refusal to acknowledge the performative aspect of politics. The people's inconsistency isn't a moral failing but a reflection of their material needs and susceptibility to leadership. 

  This approach should provide a nuanced reading that moves beyond simple labels, addressing the user's concerns about the two models of will and the demos's lack of inherent unity.
answer: |-
  Here's a reading of *Coriolanus* focusing on populism and the "will of the people," grappling directly with the tension you've identified and avoiding simplistic labels:

  1.  **The Two Pictures: Not Incompatible, But Layers of the Same Problem:**
      *   The "aggregate count" (Act 2, Scene 3) isn't presented as a pure expression of will. It's a *ritualised performance*. The citizens file past, grant their "voices," but crucially, **the Tribunes explicitly instruct them to *change* those voices later** ("when you hear his drums… be gone… say you ne'er had consent"). This exposes the count as inherently manipulable and performative. The individual voices exist, but their aggregation is not a spontaneous expression; it's a stage-managed political act.
      *   The "single voice" is the *myth* or *claim* essential for political power. The Tribunes *must* claim to embody "the people" ("the people's own mighty power") to justify their authority against the patricians. Coriolanus fundamentally rejects this myth ("the mutable, rank-scented many"; he sees "the people" as only the patricians). Menenius's body politic fable *attempts* the fusion but fails because it denies the plebeians' agency and pain – they *are* the belly's grievance. The "single voice" isn't discovered; it's *constructed* and *contested* by competing elites.

  2.  **The Market Scene: Where the Layers Collide (and the Insight Lies):**
      *   This scene (Act 2, Scene 3) **dramatises the gap itself as the core political reality**. It shows:
          *   **The Aggregate in Action:** The mechanical counting of individual consents.
          *   **Its Vulnerability:** The ease with which those individual voices are swayed *by suggestion* (the Tribunes' instructions, Coriolanus's own scorn making their earlier consent feel foolish).
          *   **The Myth's Construction:** The Tribunes *using* the aggregate ritual *to manufacture* the appearance of a later "single will" (revocation, banishment). They don't just *claim* the single voice; they *stage-manage* the aggregate to create its illusion.
      *   **The Insight:** The play suggests neither picture is "real" in isolation. The aggregate count is the *mechanism*, but it's easily subverted to serve the *myth* of a unified popular will. The gap isn't a muddle; it's the space where politics happens – where rhetoric, manipulation, ritual, and genuine grievance interact to *create* the "will of the people" as a political weapon. The people *have* voices, but "the will of the people" as a singular, coherent entity is a political artefact shaped *in* that gap.

  3.  **The Ending and Fickleness: Beyond Cheapness:**
      *   The people's "turn" isn't merely fickleness for its own sake. It reveals several things:
          *   **The Power of Leadership/Manipulation:** The Tribunes successfully redirect popular anger *away* from their own potential failings (grain supply, Volscian threat) *towards* Coriolanus as the scapegoat. They *reforge* the "single will" against him.
          *   **The Absence of a Coherent Pre-Existing Will:** The crowd doesn't possess a stable, pre-formed "will." Their responses are reactive – to hunger, to perceived slights, to fear, to the arguments presented by figures like the Tribunes. The "will" expressed in banishment is a *product* of the moment's pressures and the Tribunes' orchestration, not its revelation.
          *   **The Myth's Triumph (Temporarily):** The Tribunes successfully *perform* the role of the people's voice. They win the contest to define what "the people" want. Coriolanus's refusal to play the game of soliciting and respecting the ritual *ensures* his defeat within this system, regardless of his military worth. The system, however flawed, functions on its own terms.

  4.  **Shakespeare's Critique of Populist Theory's Blind Spot:**
      *   This is the crucial point. **Shakespeare absolutely dramatises that the *demos* lacks a pre-existing, coherent, singular "will" waiting to be represented.** The play shows:
          *   **Reactive, Not Proactive:** The plebeians' actions are primarily reactions to immediate, material needs (grain) or provocations (Coriolanus's insults, the Tribunes' incitement).
          *   **Heterogeneity:** They don't speak with one voice naturally. We see individuals with differing levels of awareness, resentment, and fear in Act 1. The "single will" is imposed upon them rhetorically and politically.
          *   **Susceptibility:** Their "will" is malleable, shaped by circumstance, rhetoric, and leadership (for good or ill). The Tribunes don't just channel a pre-existing will; they actively *mould* and *direct* the popular energy that exists.
      *   **Populism's Fiction Exposed:** Populist theory often relies on the fiction of "the people" as a unified entity with a discernible will. *Coriolanus* relentlessly deconstructs this. It shows "the will of the people" as:
          *   A **performative act** (the ritual of voices).
          *   A **political claim** made by contenders (Tribunes vs Coriolanus).
          *   An **effect of manipulation and circumstance.**
          *   Fundamentally **elusive and contested.**

  **Conclusion: The Gap *is* the Insight**

  Rather than resolving the tension between the aggregate count and the single voice, *Coriolanus* uses that tension to expose the fraught mechanics of popular legitimacy. The play suggests:

  1.  The aggregate count is a necessary but deeply flawed and easily corrupted *process* for approximating consent.
  2.  The "single voice of the people" is not a discovered truth but a politically constructed *myth*, essential for power but always contested and ventriloquised (by Tribunes, patricians, or even would-be dictators like Coriolanus who deny its validity).
  3.  The *demos* possesses grievances and the power of numbers, but **not a pre-existing, unified political will**. Its "will" emerges *through* the interaction of circumstance, leadership, rhetoric, and political ritual within the very gap between the individual voices and the claimed singular entity.
  4.  Populism, as dramatised through the Tribunes' success, is the skilful *management* of this gap – harnessing genuine grievance, manipulating the process, and successfully claiming the mantle of the singular popular voice. Coriolanus's tragedy stems partly from his refusal to acknowledge the gap's existence and the necessity of engaging with its messy performance. The play's enduring power lies in its stark revelation that "the will of the people" is less a bedrock of democracy and more a volatile, constructed, and perpetually contested political battleground.
