  So I'm on the Kant side of a debate about whether perpetual peace requires a world state, and I think I've been handed a loosing brief. My case is this: Kant says the state of nature among states is a state of war, and that the only way out of a state of nature is for everyone to submit to a common power that can enforce the law — that's just his argument about individuals and the civil condition, applied one level up. So perpetual peace has to mean a global state with a monopoly on force, and the federation of free states he proposes is his name for that same thing. My opponent keeps waving the preliminary article about no state interfering by force in another's constitution at me and says a coercive world state flatly contradicts it. That seems easy to answer: the preliminary articles are just the transitional stage — you can't have intervention while you're still building the world state, and once its built, the world state does the enforcing and sovereignty is gone anyway, so there's no tension left. Right? And then the other thing that's bugging me is the article about hospitality to foreigners, which looks like it's about something completely different from a global monopoly on force — how is that even part of the same plan instead of a stray cosmopolitan hobbyhorse? Where am I going wrong here, if I am? I don't need a reading list or citations, just the argument.
