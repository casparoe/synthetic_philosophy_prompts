prompt: |-
  I run grantmaking at a small family foundation — about $3M a year, I'm the only program officer, and I write the one-page memo that the board signs off on every quarter. So that's thirty-odd funding decisions a year, made mostly alone, on maybe a day's notice each, no researcher, no way to trial anything.

  What keeps eating at me is cluelessness. Not the ordinary 'we don't know yet' kind that more research could fix (I've seen this called simple cluelessness), but the other kind, where the ripples of a grant are so diffuse and chaotic — effects on people far downstream, on institutions, on people not born yet — that no amount of study would hand me a determinate total. I've seen that called complex cluelessness. Every framework I read either pretends the problem away by telling me to multiply made-up probabilities, which is exactly the move cluelessness is supposed to be an objection to, or it shrugs and says fund what's tangible, which is what two of my trustees already believe and I don't want to just cave to them.

  So write me a procedure I can actually run, in order, on a proposal that lands on my desk. I want the questions to ask in sequence, what counts as a good enough answer to each, where the thing terminates in a no, and where it has to hand the decision to a person because the question is about values and not facts. It needs to tell me, at each stage, whether I'm looking at the fixable ignorance or the unfixable kind and what changes about my decision depending on which — including what to do when I can't even sign the effect (a grant that might help, might backfire, and the evidence won't settle which). It should say when paying for more research is worth the money and when it's just procrastination in a lab coat, when to fall back on rules like 'don't do the intrinsically skeevy thing' because the arithmetic can't guide me, and when to fund a smaller amount as a hedge instead of yes/no. And it should flag the steps that are judgement calls wearing a procedure's clothes.

  Then run it on three: (1) a boring renewal — school health program, cheap, decent evidence, no controversy; (2) a new request to pay for a media-literacy curriculum in local high schools, where I genuinely can't tell if the long-run civic effect is positive; (3) a documentary my board chair is excited about, where the procedure tells me to decline and I don't want to hear it. For that last one, tell me straight, and tell me what the procedure can't do at all.
reasoning: |-
  Okay, let me unpack this grantmaker's dilemma. They're wrestling with "complex cluelessness" - that nagging sense that no spreadsheet can capture the true ripple effects of funding decisions. The core tension is between their professional integrity and practical constraints: solo operation, rapid decisions, and board dynamics. 

  First, I need to validate their frustration. Most frameworks either oversimplify with pseudo-math or surrender to tangible outcomes - both dodging the real issue. They're asking for something rare: a decision protocol that honors epistemic humility while being executable under pressure. 

  The key design challenges jump out:
  - Must distinguish simple vs complex ignorance instantly
  - Need clear off-ramps for "no" decisions
  - Require explicit value-judgment flags
  - Handle probabilistic harm scenarios
  - Account for hedging strategies
  - Stay within 1-day analysis time

  I'm imagining a flowchart-like sequence where each step filters proposals based on different failure modes. Stage 1 would tackle low-hanging fruit - the quick kills based on ethics or feasibility. Stage 2 handles "known unknowns" where research might help. The real innovation needs to happen in Stage 3 - that's where we confront true uncertainty. 

  For the complex cluelessness phase, I recall Nassim Taleb's barbell strategy: allocate most resources to ultra-safe bets, but reserve a slice for high-uncertainty ventures. That could translate to funding small pilots instead of full grants when sign is unknown. 

  The three test cases are brilliantly chosen to stress-test the system. The school health renewal is the control group - here the procedure should almost run itself. The media literacy request is the perfect complex cluelessness specimen: civic effects are notoriously path-dependent and delayed. And the chair's pet documentary? That's the political landmine where the procedure must hold firm. 

  What worries me most is the documentary scenario. No decision protocol can override board politics - the best we can do is arm them with clear reasoning about why it fails multiple filters (diffuse impact, unfixable ignorance, value misalignment). Might need to build in an "appeals process" where trustees can overrule but must formally justify. 

  For the media literacy quandary, I'm drawn to the precautionary principle: if net effect is truly incalculable, default to not intervening in complex systems unless the intervention is easily reversible. But since curricula aren't reversible, perhaps fund it as a limited pilot with third-party evaluation? 

  The real breakthrough here might be reframing "cluelessness" as a feature rather than a bug. By forcing explicit documentation of uncertainty at each step, we turn ignorance into a decision factor rather than a shameful secret. That alone could transform their quarterly memos.
answer: |-
  Here’s a step-by-step procedure designed for your constraints, followed by application to your three cases. It prioritizes **triage, epistemic honesty, and decisional guardrails**, with explicit off-ramps and value flags.

  ---

  ### **The Cluelessness-Aware Grant Evaluation Protocol**
  *(Run sequentially; stop if any "Terminate" condition is met)*

  1.  **Immediate Reject Filters (1-2 hrs)**
      *   **Q1:** *Does this proposal violate core ethical boundaries?* (e.g., harms vulnerable groups, promotes hate, illegal activity).  
          *Good Enough:* Clear alignment/violation of foundation charter or widely accepted norms.  
          **→ Terminate if YES.** *This step uses values, not calculable impact.*
      *   **Q2:** *Is basic feasibility shattered?* (e.g., org lacks capacity, budget absurd, timeline impossible).  
          *Good Enough:* Obvious gaps in core operational logic or history of failure.  
          **→ Terminate if YES.** *Simple ignorance (fixable in theory, but not worth your time).*

  2.  **Tractability & Evidence Check (2-3 hrs)**
      *   **Q3:** *Is the primary intended outcome observable, measurable, and causally linked within 3-5 years?*  
          *Good Enough:* Clear logic model + credible evidence (RCT, strong quasi-exp) for *this* intervention or very close analogue.  
          **→ Proceed if YES (Likely Simple Cluelessness).**  
          **→ If NO:** *Complex Cluelessness likely (diffuse/long-term effects dominate).* Proceed to Step 3.
      *   **Q4:** *Would targeted research *resolve the key uncertainty* blocking this decision?*  
          *Good Enough:* Specific, actionable research question exists; answer would clearly shift go/no-go; cost < 5-10% of grant; time < 6 months.  
          **→ If YES:** *Procure research (Simple Ignorance fix).* Delay decision pending results.  
          **→ If NO:** *Research is procrastination/unhelpful (Complex Cluelessness).* Proceed to Step 3.

  3.  **Navigating Complex Cluelessness (3-4 hrs)**
      *   **Q5:** *Can we confidently determine the *sign* (net positive/negative) of the most plausible effects?*  
          *Good Enough:* Strong theory/evidence suggests *direction* of key effects, even if magnitude is unknown; no credible case for major backfiring.  
          **→ If YES (Likely Net Positive):** Proceed to Step 4.  
          **→ If NO (Sign Unknown/Risk of Harm):** Apply **Precautionary Filters:**
              *   **Filter A (Reversibility):** Is the intervention easily stopped or reversed if harm appears? **→ Terminate if NO.**
              *   **Filter B (Intrinsic Wrong):** Does it feel intrinsically "skeevy" even if impact is uncertain? **→ Terminate if YES.** *Values call.*
              *   **Filter C (Hedge):** Can we fund a *much smaller pilot* (<25% of ask) to reduce exposure/generate learning? **→ If YES, fund pilot; if NO, Terminate.**

  4.  **Value Alignment & Scaling (1-2 hrs)**
      *   **Q6:** *Does this deeply align with our foundation's *specific* values and theory of change?*  
          *Good Enough:* Explicitly connects to foundation priorities beyond just "doing good." *Judgment call wearing procedure's clothes.*  
          **→ Terminate if NO.**
      *   **Q7:** *Is the cost-per-unit-outcome (for measurable parts) within acceptable bounds?*  
          *Good Enough:* Rough comparison to similar interventions; not grossly inefficient. *Simple ignorance dominates.*  
          **→ Terminate if NO.**
      *   **Q8 (Renewals Only):** *Has past performance met core expectations?*  
          *Good Enough:* Achieved key milestones, responsible reporting, no major red flags. *Simple ignorance dominates.*  
          **→ Terminate if NO.**

  5.  **Decision & Rationale**
      *   **If not Terminated → Fund (Full amount or Hedged Pilot).**
      *   **Memo Must Explicitly State:**
          *   Where cluelessness exists (Simple or Complex).
          *   Key uncertainties that *could not* be resolved (esp. in Complex cases).
          *   Which filters/hedges were applied (especially Precautionary Filters, Value Alignment).
          *   Why research wasn't pursued (if applicable).

  ---

  ### **Applying the Protocol**

  **Case 1: Boring School Health Program Renewal**
  *   **Q1/Q2:** No ethical/feasibility issues. PASS.
  *   **Q3:** Primary outcomes (e.g., vaccination rates, STD knowledge) observable/measurable short-term. Strong evidence base. **→ Simple Cluelessness.** Proceed.
  *   **Q4:** No major unresolved uncertainty needing research. PASS.
  *   **Q5:** N/A (Simple Cluelessness path).
  *   **Q6:** Aligns with health/education focus? (Assuming yes). PASS.
  *   **Q7:** Cost-per-outcome likely acceptable (given history/evidence). PASS.
  *   **Q8:** Past performance met expectations. PASS.
  *   **→ RECOMMEND: FUND.** Rationale: Addresses Simple Cluelessness with strong evidence; meets all filters. Low-risk renewal.

  **Case 2: Media Literacy Curriculum (Uncertain Civic Impact)**
  *   **Q1/Q2:** No ethical/feasibility issues. PASS.
  *   **Q3:** Short-term outcomes (knowledge, critical thinking skills) measurable. **BUT** long-term civic outcomes (voting, polarization, trust) are diffuse, chaotic, hard to attribute. **→ Complex Cluelessness.** Proceed to Q5.
  *   **Q4:** Could research resolve long-term civic impact? Unlikely within budget/timeframe. **→ Research = Procrastination.** Proceed.
  *   **Q5:** *Sign Unknown?* Plausible arguments: Could foster critical engagement (positive) OR increase cynicism/distrust (negative). Evidence inconclusive. **→ SIGN UNKNOWN.** Apply Precautionary Filters:
      *   **Filter A (Reversible)?** Curriculum can be revised/stopped. YES. PASS.
      *   **Filter B (Intrinsic Wrong)?** Teaching media literacy isn't intrinsically "skeevy." NO. PASS.
      *   **Filter C (Hedge)?** YES. Fund a pilot in 1-2 schools (<25% of ask) with robust *process* evaluation (how taught, received) + track *proxies* (e.g., student surveys on trust, participation in school paper/clubs).
  *   **Q6:** Aligns with education/civic goals? (Assuming yes). PASS.
  *   **Q7:** Cost-per-*measurable*-outcome (skills gained) acceptable? (Assuming yes). PASS.
  *   **→ RECOMMEND: FUND PILOT (Hedged).** Rationale: Complex Cluelessness dominates long-term civic impact; sign unknown; intervention reversible & not intrinsically wrong; hedge via pilot reduces risk & generates learning. Memo must flag the irreducible uncertainty about civic effects.

  **Case 3: Board Chair's Exciting Documentary**
  *   **Q1/Q2:** Likely PASS (assuming non-harmful content, feasible production).
  *   **Q3:** Primary outcome (film completion/distribution) measurable? YES. **BUT** intended *impact* (e.g., shifting public opinion, policy change) is highly diffuse, long-term, and chaotic (media landscape, competing narratives). **→ Complex Cluelessness.** Proceed to Q5.
  *   **Q4:** Research resolve impact uncertainty? Impossible pre-release; post-release studies unlikely to prove causality. **→ Research Futile.** Proceed.
  *   **Q5:** *Sign Unknown?* Documentaries can: Raise awareness (positive), entrench opposition (negative), or have negligible impact. High uncertainty. **→ SIGN UNKNOWN.** Apply Precautionary Filters:
      *   **Filter A (Reversible)?** NO. Once released, the narrative is in the wild.
      *   **Filter B (Intrinsic Wrong)?** Maybe? Depends on content/tone. *Values call.* If it feels manipulative or overly simplistic, YES → Terminate. If it feels balanced/truth-seeking, NO → PASS.
      *   **Filter C (Hedge)?** Funding a smaller amount (e.g., post-production only)? Unlikely to materially reduce risk or uncertainty. **→ NO.**
      *   **→ Filter A fails (Irreversible), Filter C fails (No Hedge).** If Filter B is *not* triggered (not intrinsically wrong), proceed cautiously to Q6. *Likely Terminate via Filter A/C.*
  *   **Q6:** *Does it align with foundation's SPECIFIC values/ToC?* **Judgment Call:** Does funding documentaries fit your *core* strategy? Or is it a distraction? If your mission is direct service/research, likely misaligned. If it's advocacy/narrative change, *maybe* aligned. **→ Likely Terminate (Misalignment) unless documentary is core to your strategy.**
  *   **→ RECOMMEND: DECLINE.** Rationale: Complex Cluelessness dominates impact; sign unknown; intervention irreversible; no effective hedge available. High risk of negligible or negative ripple effects. Likely misaligned with core grantmaking strategy. Memo must emphasize irreversibility and lack of causal pathway evidence.

  ---

  **The Unavoidable Truth (Case 3):** The procedure flags this as high-risk, low-accountability spending in the face of deep uncertainty. **Its limitations are:** It cannot override a determined Board Chair. It cannot *prove* the documentary won't work. It cannot eliminate the political reality of your position. 

  **What to Do:** 
  1.  **Memo Rigorously:** Document the protocol's steps showing decline rationale (esp. Irreversibility & Complex Cluelessness). 
  2.  **Offer Alternatives:** Propose funding a rigorous *evaluation* of the documentary's *reach* and *audience reception* (measurable proxies) instead of production, or suggest a smaller hedge if possible. 
  3.  **Frame Values:** If the Chair insists, frame it as a *values-based* override ("The Board values narrative impact despite uncertainty"). The procedure forces this choice to be explicit, not hidden behind false precision. 
  4.  **Protect Your Role:** Use the memo to show you applied rigorous due diligence, even if overruled. This maintains your credibility.

  This protocol forces clarity on *why* a decision is hard, separates knowable from unknowable, prioritizes harm prevention, codifies value judgments, and provides defensible off-ramps – all within your time constraints. It makes cluelessness a *feature* of the analysis, not a bug to be ignored.
