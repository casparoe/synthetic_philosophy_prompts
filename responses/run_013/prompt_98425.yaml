prompt: |-
  I chair the acquisitions committee at my university's special collections library, and we have to vote Thursday on a donation that's turning out to be a headache. The artist's estate is offering us the only durable thing she left: a single handwritten sheet of instructions for a large wall drawing, plus a codicil saying the drawing itself must be re-made each year on a different wall by whoever we pick, and that last year's drawing gets painted over. So in principle the wall is temporary and the sheet is forever. Half the committee says we're buying a document, full stop -- catalog it, vault it, done. The other half says the sheet isn't the work at all, the work is the yearly realization (or maybe the whole ongoing practice of realizing it), and if we only keep the sheet we've preserved the recipe and thrown away the meal. We need to decide what we're actually accepting, what we're promising to preserve and how (do we photograph each wall before it's erased? do we lock the sheet away and let nobody touch it? do we commission the drawings ourselves or just license the right?), and what we tell the estate.

  I don't want a shrug of "it's all in the eye of the beholder." There's a specific distinction I keep coming back to from Hofstadter's Gödel, Escher, Bach, where he takes something like a phonograph record and splits its message into three layers: the frame message, which is all the stuff that tells you this is a record and here's roughly how you're meant to use it; the outer message, which is the actual fine-grained instructions encoded in the grooves for getting the sound out; and the inner message, the music you actually hear. His point, roughly, is that the inner message only comes alive when frame and outer are both right, and that the three layers can drift apart from each other.

  Please draft the short written opinion I'll circulate before the vote. Give me a concrete recommendation -- accept, accept with conditions, or decline -- with the reasoning, say explicitly which layer we think the work's meaning lives in and why, and give the strongest version of the side you're rejecting an honest hearing. Keep it tight enough that I can read it aloud in ten minutes.
reasoning: |-
  Okay, the user chairs an acquisitions committee for a university's special collections library. They're voting on whether to accept a donation of an artist's handwritten instructions for a wall drawing, along with a codicil requiring the drawing to be recreated annually on a different wall and the previous year's version painted over. The committee is split: half sees it as preserving a document, while the other half believes the yearly realization is the true artwork. The user wants a concrete recommendation with reasoning, using Hofstadter's layers from GEB, and needs a draft opinion for circulation before the Thursday vote.

  The user's explicit request is for a structured opinion that resolves the committee's deadlock. But deeper needs likely include avoiding institutional overcommitment (preserving annual recreations indefinitely), clarifying collection scope (documents vs. performative art), and mitigating legal/ethical risks (interpreting the codicil's "whoever we pick" clause). They also need to present this diplomatically since both committee factions feel strongly.

  Hofstadter's frame/outer/inner message framework fits perfectly here. The handwritten sheet is the **outer message** (instructions), the codicil is the **frame message** (context/rules), and the transient drawing is the **inner message** (lived experience). Crucially, the inner message is ephemeral by design—the artist intended it to be temporary. Preserving the outer message (instructions) and frame message (codicil) honors the work's essence without forcing the library into unsustainable performance art stewardship. 

  The strongest counterargument—that the yearly realization *is* the artwork—is valid but misaligned with a special collections library's core function. Libraries preserve stable artifacts; mandating annual recreations would blur into curatorial programming better handled by galleries. Photographing each drawing might feel like a compromise but actually violates the artist's instructions by creating de facto permanence. 

  Recommendation: **Accept the donation as an archival document** with clear terms: vault the sheet/codicil, catalog them as instruction-based art, but *explicitly decline* responsibility for recreations. Instead, proactively offer to facilitate partnerships with art departments/galleries for voluntary realizations. This satisfies both factions: preservationists secure the artifact, and performative advocates get a pathway to engage the work dynamically—without binding the library to infinite labor. 

  Key phrasing in the draft: "We preserve the seed, not the harvest" crystallizes the compromise. It acknowledges the other side's passion while grounding the decision in institutional reality.
answer: |-
  ## Committee Opinion: Proposed Acquisition of [Artist's Name] Wall Drawing Instructions

  **Recommendation:** Accept the donation of the handwritten instruction sheet and codicil **as archival documents**, explicitly declining institutional responsibility for the annual realization of the wall drawing. We *will* facilitate access and encourage engagement with the instructions, but the yearly execution is not part of our preservation mandate.

  **Reasoning & Hofstadter's Layers:**

  Hofstadter's framework clarifies our core dilemma and points the way forward:

  1.  **The Frame Message:** The codicil itself. It tells us *this is an instruction set for a temporary, performative artwork requiring annual renewal.* It establishes the *context* and *rules of engagement* – the ephemeral nature of the inner experience and the perpetual nature of the instruction.
  2.  **The Outer Message:** The handwritten sheet. This is the *specific, detailed set of instructions* – the encoded "recipe" for generating the drawing. It is the durable core containing the artist's intent for the form.
  3.  **The Inner Message:** The actual, ephemeral wall drawing experienced each year. This is the *lived sensory event* – the "music" played once from the "record" and then gone.

  **Where Does the Meaning Reside?**

  The **primary artistic meaning and enduring value** reside in the **Outer Message (the instructions)** and are framed by the **Frame Message (the codicil)**. The instructions *are* the artwork conceived by the artist as a perpetual, generative engine. The codicil explicitly defines the instructions as the durable artifact and the realization as transient.

  The Inner Message (the yearly drawing) is crucial *to the experience* of the work, but it is inherently non-preservable by its very definition and the artist's mandate. It exists only in the moment of its execution and the memory of its witnesses. Its meaning *derives from* the instructions and the act of following them, but it is not the artifact we are tasked with preserving indefinitely. Attempting to preserve it (e.g., through exhaustive documentation of each iteration) fundamentally violates the spirit of the codicil ("painted over") and shifts the work towards being a documentary archive of performances, which is not what was offered.

  **Addressing the Strongest Counter-Argument (The "Meal" Argument):**

  The committee members who argue we are "preserving the recipe and throwing away the meal" make a powerful and valid point about the experiential core of art. They rightly emphasize that the instructions only achieve their full meaning *through realization*. Without the potential for realization, the sheet risks becoming a dead letter, a score never played. The yearly drawing *is* the manifestation of the artwork for its audience. To acquire *only* the sheet feels, to them, like acquiring the plans for a building but never constructing it, losing the lived experience the plans were meant to enable. Preserving the instructions without committing to the practice might seem like a hollow preservation of potential, ignoring the work's essential performative and temporal nature.

  **Why We Cannot Accept This Premise as Binding:**

  While acknowledging this argument's validity regarding the work's *experience*, Special Collections' core mandate is the **preservation of and access to durable cultural artifacts.** The codicil explicitly separates the durable artifact (the sheet) from the transient event (the drawing). Accepting responsibility for the *perpetual execution* of the work fundamentally changes what we are acquiring and imposes an infinite, open-ended curatorial, logistical, and financial burden unsuited to our primary function. It transforms us from archivists into perpetual commissioners and performers of site-specific art. Deciding *how* to execute it (who, where, when, funding, documentation level) creates complex obligations that extend far beyond traditional archival stewardship and could consume disproportionate resources indefinitely.

  **Our Proposal: Preserving the Seed, Encouraging the Harvest**

  1.  **Accept and Preserve:** We acquire and preserve the handwritten instruction sheet and codicil as unique archival documents. They will be cataloged, accessioned, stored securely according to best practices, and made accessible to researchers under controlled conditions (e.g., supervised handling in a reading room).
  2.  **Decline Execution Mandate:** We explicitly state that acceptance does *not* constitute a commitment by the Library/Special Collections to fund, organize, or execute the annual wall drawing. The codicil's requirement ("whoever we pick") will be interpreted as the Library *granting permission* for others to execute it, not *requiring* us to do so.
  3.  **Facilitate Engagement:** We actively facilitate the *potential* for realization:
      *   Clearly state in the deed of gift that we encourage the execution of the work according to the instructions and codicil.
      *   Proactively offer non-exclusive licenses to university departments (especially Art, Art History), student groups, or external galleries to execute the drawing on campus or elsewhere, providing access to high-quality digital surrogates of the instructions.
      *   Consider hosting a digital repository (or linking to one) where groups undertaking the realization can voluntarily deposit documentation (photos, videos, statements) *if they wish*, creating a record of the work's life without mandating it or assuming preservation responsibility for that documentation ourselves.
      *   Promote the existence and nature of the work to researchers and artists.

  **Communication to the Estate:**

  We enthusiastically accept the generous donation of the instruction sheet and codicil as a significant artifact of [Artist's Name]'s conceptual practice. We will preserve these documents in perpetuity as the core artistic work, ensuring their availability for study. We understand and respect the artist's vision for the annual ephemeral realization as articulated in the codicil. While the library itself will not act as the perpetual commissioner or executor of the drawing, we commit to actively facilitating access to the instructions and encouraging qualified individuals or groups to undertake the annual realization according to your terms. We believe this approach best honors the artist's intent by preserving the generative core of the work while enabling its living tradition.

  **Conclusion:**

  By focusing on preserving the **Frame** (codicil) and **Outer** (instructions) messages – the artist's defined durable artifact and its generative rules – we fulfill our core archival mission. We acknowledge the vital importance of the **Inner** message (the drawing) but recognize that its ephemerality is intrinsic to the work, and its perpetual execution lies beyond our sustainable mandate. Accepting the sheet/codicil while facilitating, not mandating, realizations allows the work to live authentically without binding the library to an infinite performance. We vote **Accept** on this basis.
