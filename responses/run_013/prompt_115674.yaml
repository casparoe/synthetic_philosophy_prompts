  For ranking, I consider: What questions would advance the field most? What aligns with social ontology's core concerns (e.g., reality of social constructs)? What has practical implications? Top questions should tackle causality head-on since that's their central itch. Lower-ranked ones might address subtler dynamics. 

  I sketch: 
