  2. **Mechanisms**: Digs into how narratives become causal forces, key for social ontology's interest in "making the social world." 
  3. **Disagreement**: Explores why definitions vary—reveals if generations are stable or contested, touching on objectivity. 
  4. **Power**: Unpacks who benefits from these labels, exposing hidden agendas (e.g., marketing, policy). 
  5. **Individual variation**: Tests if generational labels override individuality, probing their real-world limits. 

