  Hmm, the audience split is crucial. Half are specialists who'll pounce on any lazy metaphor; half are non-academics needing emotional resonance. The toast must bridge these worlds. Dana's "scaffolding loss" concept feels key here - how support structures vanish, leaving achievements seeming miraculous.

  Let me brainstorm candidate cranes for a life:
  - Vocation: Not "calling" but accumulated moments (a teacher's comment + a borrowed book + a failed experiment)
  - Marriage: Daily choices (coffee rituals + inside jokes + forgiven annoyances)
  - Intellectual style: Habitual questioning shaped by specific mentors/rivals

  Scaffolding loss example: A pianist's flawless recital erases years of scales practice and supportive teachers. The performance seems like raw talent ("skyhook") when it's actually dismantled scaffolding.

  For structure: Open with concrete sensory details (her laugh, elbow patches) to ground abstractions. Contrast skyhook clichés ("irreplaceable") with crane explanations (her influences on named students). Use the scaffolding loss idea to frame collective grief - our memories become the new crane upholding her legacy.

  Must avoid:
  - Spiritual platitudes ("watching over us")
  - Essentialist claims ("born brilliant")
  - Unexamined superlatives ("greatest thinker")

  The tricky bit: making reductionism feel expansive. As Dana argued, explaining isn't explaining away. Listing her components (mentors, quirks, collaborators) should deepen awe, not diminish it. The toast's mechanics must demonstrate her thesis - each sentence a visible crane.
answer: |-
  ### Dana Ruiz Memorial Toast  
  *(5 minutes; balances technical precision with human warmth)*  

  **Brainstormed Cranes**:  
  1. **Vocation** → *Built from:* Observed injustice + a teacher’s challenge + borrowed books + failed experiments.  
  2. **Marriage** → *Built from:* Shared silence over coffee, inside jokes about Darwin, tolerated snoring, 10,000 ordinary Tuesdays.  
  3. **Stubborn Mind** → *Built from:* Her father’s workshop (where nothing was "magic"), a mentor’s demolished argument in 1983, migraines that forced clarity.  
  4. **Legacy** → *Built from:* Marginalia in students’ drafts, departmental policy changes, lab notes left open on purpose.  

  **Scaffolding Loss Example**:  
  *The flawless concert pianist* → We hear genius, forgetting the childhood metronome, the teacher who adjusted her posture, the wooden crate used as a stool—all discarded once mastery seemed "effortless."  

  ---

  ### The Toast  
  **(Begin with raised glass; warm eye contact with family, then scholars)**  

  Friends, colleagues, family—we’re here because Dana Ruiz assembled a life of extraordinary consequence from stubbornly ordinary parts. No skyhooks. Just cranes. Always cranes.  

  Think of her laugh—that sudden, engine-revving *guffaw*. Built from her mother’s snort, her grad-school sleep deprivation, and the sheer delight of catching pretension off-guard. Not "contagious spirit." Just soundwaves, muscle memory, and shared air.  

  Her forty-year crusade against biological skyhooks? Scaffolded by accidents: the rainy afternoon she wandered into Professor Althoff’s lecture; the mis-shelved library book by Dennett; the stubborn sinus infection that made her re-read Darwin with new desperation. Remove those temporary supports, and the thesis seems to hover, self-made. Pure scaffolding loss.  

  **(Pivot gently to family)**  

  To her nieces and nephews: You knew the cranes too. The way she’d build a birthday card—not with "perfect love," but with scissors stolen from a hotel lobby, that dried fern from your hike last spring, and a stamp applied crookedly because she was arguing with the cat.  

  Her marriage to Elara? A crane assembled daily: burnt toast forgiven, winter coats zipped against the wind, the same Paul Simon album played every road trip until the CD scratched. No "soulmates." Just two people choosing, again and again, to be each other’s scaffolding.  

  **(Address the room’s shared loss)**  

  And now—here we are. Missing her. Feeling that void. But Dana would ask: *Is this loss a skyhook?* Does grief descend from nowhere? Or is it built?  

  I submit: This ache is assembled from cranes. The email she didn’t send last Tuesday. The chair she always warmed at this symposium. The way she’d clear her throat before landing a killer point. *These* are the struts and bolts of our sorrow. Remove them, and the pain seems abstract—mystical. But it’s not. It’s made.  

  **(Raise glass higher; speak firmly)**  

  Dana’s last lesson was this: Scaffolding loss isn’t deception. It’s tribute. When we dismantle the supports—the mentors, the mistakes, the mundane—what remains isn’t *less* real. It’s *more* enduring. The cathedral stands because the scaffolding did its job and vanished.  

  So tonight, we honor the cathedral *and* the scaffolds. We mourn the woman *and* the mechanisms: her habit of correcting misused metaphors over whiskey; her knack for spotting fear in a grad student’s eyes; the way she’d hum off-key while proofreading.  

  **(Final lift of the glass; soften voice)**  

  Dana isn’t "with us." But the structures she built *are*: in every student who now questions a skyhook; in every policy she nudged toward evidence; in Elara’s quiet smile at a shared memory.  

  No skyhooks. Only cranes.  
  To Dana Ruiz—built well, and building still.  

  ---

  ### Why This Works  
  - **For Theorists**: Every tribute is crane-compliant (laugh=muscle memory+sound; grief=absent emails+empty chairs). Scaffolding loss is demonstrated, not just named.  
  - **For Family**: Concrete, sensory details (burnt toast, Paul Simon, fern-pressed cards) ground abstractions. The "cathedral" metaphor bridges worlds.  
  - **Anti-Skyhook**: "Irreplaceable" becomes "structures she built"; "spirit lives on" becomes "policies nudged, students questioning."  
  - **Explaining ≠ Explaining Away**: Listing components (migraines, mis-shelved books) deepens awe; it doesn’t reduce her. The toast *embodies* her thesis—showing how greatness is assembled.  

  **Key Crane**: The toast itself is built from Dana’s own tools—her concepts, deployed to celebrate her. That’s the final, unspoken tribute: *Her ideas console us*. No skyhook needed.
