prompt: |-
  I'm running a one-off 75-minute session for a philosophy of religion reading group -- grad students who can handle an argument, but none of them have read any rabbinics or know Hebrew. Subject: Maimonides on why the Torah commands animal sacrifice. I want the teaching plan, not the lecture.

  The reading I need to land, put crudely so you know what has to survive: Maimonides treats the sacrificial laws as a concession to where the Israelites actually were -- a people soaked in a sacrificial culture, for whom a religion with no cult at all would have been incoherent -- so the Law commandeers an existing practice and changes its addressee rather than abolishing it. And he doesn't think the cult was ever the point of the Law; the perfection of the mind is. So: what has to be in place before the word "concession" means anything to them, and what order of ideas makes that land as a conclusion they reached rather than a claim I made? Which single case should carry the whole session -- what does that case have to have, and not have, to do that job -- and if your instinct is the binding of Isaac, tell me why not. Which misconceptions get formed, and where in the sequence do I head each one off? I'm expecting "so he thought the Israelites were primitive," "so the commandments weren't really commandments, they were a ruse," and "so this is just apologetics" -- tell me if I'm missing better ones. Also, what do I do when someone raises the esoteric-reading worry, and what should I openly refuse to settle in 75 minutes?

  One more thing. I want the back half built around a distinction I'm making up, so dont lean on it as if its established: three ways of reading a divine concession. (1) Therapy -- the law retrains a desire that would otherwise be spent on idols. (2) Quarantine -- the law leaves the practice standing but redirects it, containing the damage instead of curing it. (3) Seedbed -- the concession exists so that abolishing the practice becomes thinkable later. Are these really three, or is one of them doing all the work? Which one does Maimonides need, and which one will the text actually carry? That's the stretch where I want them arguing and me quiet. Then give me one closing question that would show whether they've got the structure of the argument or just picked up the vocabulary. American English, please.
