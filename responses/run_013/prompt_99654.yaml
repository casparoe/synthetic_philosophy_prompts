  Let me unpack this layer by layer. First, Dennett absolutely does present the three stances accurately: physical, design, intentional. That part of the essay is solid. Where it starts wobbling is calling the intentional stance "nothing but a useful fiction." That phrasing makes Dennett sound like an eliminativist (like Churchland), which he isn't. 

  *scribbles mental note* Must emphasize Dennett's "real patterns" distinction—he thinks beliefs are real insofar as they're predictable patterns, just not microscopic brain states. The thermostat example is actually perfect for showing where the essay oversimplifies: Dennett would say thermostats AREN'T intentional systems because they're too simple to warrant the stance, not because beliefs aren't real. 

  Ah! And here's the user's core concern: does Dennett really think AI belief is just a matter of choice? Not exactly. His criteria are pragmatic but constrained—you can't profitably attribute beliefs to a rock no matter how hard you try. For modern LLMs though? That's where it gets juicy. Dennett would likely say our stance isn't arbitrary; it's forced by their behavioral complexity. 

