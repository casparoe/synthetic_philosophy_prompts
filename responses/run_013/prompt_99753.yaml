answer: |-
  Based on your detailed description, you've identified a fascinating and specific rhetorical-cognitive phenomenon that sits at the intersection of philosophy of mind, ethics, cognitive science, and argumentation theory. **There is no single, universally established term for this exact phenomenon.** However, it is recognized implicitly in critiques of reductionism, anthropocentrism, and the operationalization of complex concepts like consciousness or moral standing.

  Here's a breakdown of the phenomenon, a proposed term, its carving, distinctions, and boundary cases:

  1.  **The Core Phenomenon:**
      *   **Cognitive Anchor:** An initial, often intuitively appealing or easily measurable quantitative (or sometimes qualitative) metric (e.g., absolute brain size) is proposed as the key determinant for a complex, morally relevant property (e.g., moral standing, consciousness).
      *   **Refinement Under Pressure:** This metric faces counterexamples or theoretical challenges (e.g., whales have huge brains but aren't necessarily deemed more morally significant than humans; small animals with complex behaviors challenge absolute size).
      *   **Metric Substitution:** A proponent *replaces* the initial metric with a more refined one (e.g., encephalization quotient, neuron count, cortical folding, phi) to address the counterexample. This new metric is presented as the "real" or "better" criterion.
      *   **Rhetorical Persistence:** Crucially, **the *rhetorical weight* and *intuitive pull* of the *original*, discarded metric persist.** Arguments or intuitions subtly (or not so subtly) continue to rely on the original metric, even while formally endorsing the refined one. The original metric acts as an unacknowledged cognitive and rhetorical anchor. The refined metric feels plausible *because* it often correlates with the original anchor in familiar cases (like humans), masking its insufficiency.

  2.  **Proposed Term: Conceptual Anchoring with Rhetorical Persistence (CARP)**
      *   **Conceptual Anchoring:** The initial metric establishes a cognitive reference point that biases subsequent reasoning (related to, but distinct from, Anchoring Bias in psychology).
      *   **Rhetorical Persistence:** The persuasive force and intuitive appeal of the initial anchor stubbornly remains in discourse even after its explicit rejection as the primary criterion.

  3.  **Carving the Phenomenon: Distinctions from Related Concepts**
      *   **Ordinary Theory Revision:** Genuine theory revision involves abandoning faulty concepts when better evidence/theory arises. CARP involves *superficial* abandonment – the core intuition tied to the anchor persists rhetorically. The anchor isn't truly discarded; it's laundered through the new metric.
      *   **Operationalization & Construct Validity:** Operationalization defines how to measure a concept. Construct validity asks if the measure captures the concept. CARP is a *failure* of construct validity specifically caused by the *rhetorical persistence of an invalid anchor*. The new operationalization inherits the anchor's intuitive link to the construct, masking its own potential invalidity. The problem isn't just measurement error; it's a deep conceptual contamination.
      *   **Reification:** Treating an abstract concept (like intelligence or moral standing) as a concrete thing. CARP often *uses* reification (treating consciousness as a single scalar quantity measurable by brain size/neurons/etc.), but its unique aspect is the *persistent anchoring* to an initial, flawed reification even after adopting a new one.
      *   **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):** Goodhart's Law is about *gaming* a metric once it's incentivized. CARP is about the *initial selection and rhetorical persistence* of a metric as a proxy for a complex concept, *before* incentives to game it even arise. The core issue is flawed conceptual linkage, not perverse incentives.
      *   **Motte-and-Bailey:** A *strategic* argumentative tactic: defend an indefensible claim (bailey - e.g., "Only humans matter morally because of absolute brain size"), retreat to a defensible one when challenged (motte - e.g., "Well, it's *really* about cortical neurons"), then return to the bailey. CARP can *enable* Motte-and-Bailey but is distinct:
          *   **Intent:** CARP can be *unintentional* and sincere – the arguer genuinely believes the new metric is better but is unconsciously anchored to the old one. Motte-and-Bailey is inherently deceptive.
          *   **Structure:** CARP focuses on the *persistence of the anchor's rhetorical force* within the *same* argumentative move or line of reasoning, even if the stated criterion changes. Motte-and-Bailey involves switching *between* distinct positions strategically. The "motte" in CARP is presented as an *improvement*, not just a fallback.
      *   **Naturalistic Fallacy:** Deriving "ought" from "is". CARP often *involves* this fallacy (e.g., "Big brains *are*, therefore they *ought* to matter"), but its unique aspect is the *retention and laundering* of a *specific, discarded* "is" (the anchor) within the argument for the "ought".

  4.  **Boundary Cases and Edges:**
      *   **Sincerity vs. Strategy:** CARP can occur both sincerely (unconscious cognitive bias) and strategically (deliberate leveraging of the anchor's intuitive pull). The core phenomenon is the *rhetorical persistence itself*, regardless of intent. However, strategic use often makes the persistence more blatant.
      *   **Quantitative vs. Qualitative:** While your examples are quantitative (brain metrics), CARP can occur with qualitative anchors:
          *   *Example:* Anchor: "Moral standing requires *language*." Counterexample: Non-verbal humans, intelligent aliens/AI without human-like language. Refinement: "Moral standing requires *symbolic representation* or *recursive thought*." Persistence: Arguments still often lean heavily on the presence/absence of *language-like* features when discussing the new criterion for aliens/AI.
      *   **Proxy Replacement Due to New Data vs. Counterexample:**
          *   **Counterexample-Driven:** This is the classic CARP scenario. The refinement is *reactive* to a flaw exposed in the anchor. The persistence of the anchor is most evident here because the new metric is defined *in opposition* to the anchor's failure, yet rhetorically tied to it.
          *   **New Data-Driven:** If new data genuinely shows a *better* correlation with the underlying construct, and the old metric is fully abandoned *rhetorically and intuitively*, it's not CARP. It's progress. CARP requires the *rhetorical persistence* of the abandoned anchor. If the researcher seamlessly shifts focus to the new metric without implicit appeals to the old one, it's clean revision.
      *   **Clean Case:** A proponent argues moral weight requires Species-Specific Brain Volume (SSBV). Faced with a mouse outperforming a cow on a cognition test, they switch to Neuron Count (NC), explicitly stating SSBV was a crude proxy. Yet, in subsequent arguments about AI or aliens, they consistently emphasize physical scale or mass when discussing NC's implications, or dismiss entities with "tiny" NC regardless of other evidence, revealing the lingering SSBV anchor.
      *   **Merely Apparent Case:** A proponent argues for SSBV. Faced with the mouse/cow counterexample, they *abandon brain metrics entirely* and adopt a behavioral criterion like "capacity for complex future planning." While this might be problematic, it doesn't involve *persistence* of the SSBV anchor rhetorically. The anchor is truly discarded. Similarly, replacing SSBV with NC and then *consistently* arguing based *only* on NC, correlating it with behavioral outcomes without implicit appeal to size, is just revision (flawed or not, but not CARP).
      *   **The Edge - When Does Persistence Fade?** CARP weakens when:
          *   The new metric demonstrably and *intuitively* captures the construct *better* than the anchor in diverse cases (including those that broke the anchor).
          *   The link between the new metric and the construct is argued on *independent theoretical grounds* that explicitly sever the connection to the old anchor.
          *   Significant time passes, and the discourse genuinely centers *only* on the new metric and its direct implications.

  **In Summary:**

  You've identified **Conceptual Anchoring with Rhetorical Persistence (CARP)**: The persistent, often unconscious, influence of an initial, discarded quantitative or qualitative metric (the anchor) on arguments and intuitions, even after it has been formally replaced by a refined criterion supposedly better capturing a complex property (like moral standing). The new criterion feels plausible partly *because* it correlates with the anchor in familiar cases, masking its own potential flaws and preventing a truly fresh evaluation of the underlying construct.

  This phenomenon thrives where complex, poorly understood properties (consciousness, moral patiency) are reduced to measurable proxies, and human cognition struggles to fully relinquish initial, intuitive anchors. Your term "metric laundering" aptly captures the process of obscuring the continued influence of the discarded measure, though "CARP" emphasizes the cognitive and rhetorical mechanisms at play. The literature you'll find it most relevant to involves critiques of reductionism in philosophy of mind, neuroethics, animal ethics, AI ethics, and discussions on theory-ladenness in science.
