prompt: |-
  I'm writing a feature about why moral arguments never seem to get settled, and I keep ending up talking to people who call themselves relativists — an anthropologist, two philosophers, one extremely confident grad student. Before I do any more interviews I want the spec, so I don't keep asking each of them the same half-formed questions. What does a theory of moral relativism actually have to deliver to be worth taking seriously?

  Give me the requirements list, each with the case or consideration behind it. The things I keep circling: it has to explain what's happening when two communities make claims that sound like they're contradicting each other, and say which apparent disagreements are real and which are just people using the same word for different things (I have a case I'm fond of where two groups both talk about marriage and aren't talking about the same thing at all); it has to keep the descriptive claim (moral codes differ) apart from the metaethical one (moral truth is relative to a standard) and the normative one (so we should be tolerant), and tell me whether any of those three actually implies the others; it has to survive the reformer — the person inside a community saying our way of doing this is wrong — and the person who leaves one code and takes up another and then judges their parents by the new one; it has to say something about why moral claims present themselves as claims about how things are rather than about how we feel; and it shouldn't be true by default, i.e. not so watered down that everyone's a relativist already.

  Mark which requirements are non-negotiable and which are just what particular camps happen to want. And if two of them can't be had together — my hunch is that explaining genuine disagreement and denying any single standard pull against each other — say so, thats the part I'd build the piece around. Skip the who-believes-what; I can get that elsewhere.
reasoning: |-
  Okay, the user is writing a feature on why moral arguments never get settled and keeps encountering moral relativists. They need a clear set of requirements for a serious moral relativism theory. Let me start by breaking down their explicit points. They mentioned several key issues: explaining contradictory claims between communities, distinguishing descriptive, metaethical, and normative claims, handling reformers and those who switch moral codes, addressing why moral claims feel objective, and ensuring the theory isn't true by default.

  First, I need to list the non-negotiable requirements versus what different camps might want. The user seems concerned about internal consistency, especially the tension between explaining genuine disagreement and denying a single standard. That's probably the core conflict to highlight.

  They provided a case about marriage where the same term means different things. So Requirement 1 is about contradiction versus equivocation. A solid relativist theory must handle this without collapsing into everyone just talking past each other. The non-negotiable point here is explaining when disagreements are real versus terminological.

  Next, separating descriptive, metaethical, and normative claims. The user noticed people conflate these. Relativism must clarify that differing moral codes don't automatically imply metaethical relativism or tolerance. This is crucial to avoid strawman arguments, so it's non-negotiable.

  Handling reformers and defectors is Requirement 3. The theory needs to account for internal criticism without appealing to an external standard. If relativism can't explain how someone can critique their own culture’s norms, it fails. Also, explaining why moral claims feel objective (phenomenology) rather than subjective. This is non-negotiable because if morality feels like a personal preference, relativism becomes trivial.

  Avoiding triviality is key. The theory must be substantive, not something everyone accepts. This ties into Requirement 4's phenomenology point. If moral claims didn't present as objective, relativism wouldn't be a significant stance.

  Now, the tension points. The biggest is between Requirement 1 (genuine disagreement) and Requirement 2 (no single standard). How can relativists have real disagreements without a shared standard? Maybe through shared principles within a framework, but the user might explore this as the article's centerpiece.

  Also, balancing phenomenology with relativism. If moral claims feel objective, how does relativism explain that without conceding to realism? Perhaps through cultural conditioning making norms feel absolute.

  The user might have deeper needs: a structured framework to evaluate relativist arguments rigorously, avoiding common pitfalls in interviews. They want to ask incisive questions that reveal whether a theory holds up under scrutiny. Highlighting the tensions gives their feature a compelling angle, showing why moral debates persist—relativism's unresolved conflicts mirror larger philosophical struggles.
answer: |-
  Here's a requirements list for a serious theory of moral relativism, based on your concerns. I've categorized them, highlighted the tensions, and noted negotiability.

  **Core Requirements (Non-Negotiable for a Robust Relativism):**

  1.  **Explain Apparent Contradiction vs. Genuine Disagreement vs. Equivocation:**
      *   **Requirement:** The theory must provide a clear framework for analyzing moral disputes. It needs to distinguish between:
          *   *Genuine Disagreement:* Parties share a relevant moral standard/framework but disagree on its application or interpretation in a specific case (e.g., two utilitarians arguing over whether a specific lie maximizes happiness).
          *   *Equivocation/Miscommunication:* Parties use the same moral *term* (e.g., "justice," "good," "marriage") but mean fundamentally different things by it, rooted in different frameworks (your "marriage" case is perfect here).
          *   *Fundamental Framework Clash:* Parties operate with incompatible foundational standards (e.g., utilitarian vs. divine command theorist arguing about the basis of morality itself).
      *   **Case/Consideration:** Your "marriage" example is key. Without this, relativism collapses into either universal misunderstanding (everything is equivocation) or universal agreement (everything is compatible), both absurd. A serious theory must account for the *feeling* of contradiction while explaining its origin within or between frameworks.
      *   **Negotiability:** **Non-Negotiable.** This is fundamental to relativism's core task: explaining moral discourse without an absolute standard.

  2.  **Maintain the Descriptive/Metaethical/Normative Distinction & Specify Relationships:**
      *   **Requirement:** The theory must explicitly:
          *   Define "moral relativism" as primarily a *metaethical* claim about the *nature* of moral truth/facts (e.g., "Moral truths are only true relative to a specific framework/culture/individual").
          *   Clearly separate this from the *descriptive* claim ("Moral codes/beliefs vary across cultures/history" - Cultural Relativism) and potential *normative* claims ("Therefore, we ought to be tolerant" - Normative Relativism).
          *   Articulate whether and how these claims relate. *Crucially:* It must **not** allow the descriptive claim (Cultural Relativism) to automatically entail the metaethical claim (Moral Relativism), nor must the metaethical claim automatically entail a specific normative conclusion (like tolerance).
      *   **Case/Consideration:** The common conflation ("cultures differ, therefore morality is relative, therefore we must be tolerant") is a major source of confusion and weak criticism. A robust theory must show the *gap* between "is" (diversity) and "is true" (relativity of truth) and between "is true relative" and "ought" (tolerance). It must address whether metaethical relativism *permits*, *encourages*, or *undermines* normative positions like tolerance or critique.
      *   **Negotiability:** **Non-Negotiable.** Failure here makes the theory either descriptively naive, normatively presumptuous, or philosophically sloppy. Serious relativism must navigate these distinctions.

  3.  **Account for the Reformer and the Defector (Internal & External Critique):**
      *   **Requirement:** The theory must explain the possibility and meaning of:
          *   *The Reformer:* Someone operating *within* a moral framework who argues that the current practices, interpretations, or even core principles of *their own group* are *wrong* according to that framework's own standards or an immanent development of it (e.g., abolitionists appealing to Christian principles against slavery).
          *   *The Defector:* Someone who genuinely adopts a *different* moral framework and uses *that new framework* to judge the practices of their former group as morally wrong (e.g., someone leaving a strict honor culture for liberal individualism and condemning aspects of their upbringing).
      *   **Case/Consideration:** These figures pose a direct challenge. How can the reformer be "right" within a framework if the framework is defined by consensus? How can the defector condemn their former group without appealing to an *absolute* standard ("My new framework is *better*")? The theory must explain condemnation and critique as *internal* to a framework or as a shift *between* frameworks, without smuggling in absolutism.
      *   **Negotiability:** **Non-Negotiable.** Failure renders the theory descriptively inadequate to real moral phenomena (reform, conversion, condemnation) and vulnerable to the charge of making moral criticism impossible.

  4.  **Explain the Phenomenology of Objectivity:**
      *   **Requirement:** The theory must account for *why* moral claims typically present themselves to those making them as objective, universal, or fact-like ("Slavery is *wrong*," not "I/my culture disapprove of slavery") rather than as mere expressions of preference or emotion ("Broccoli is yucky").
      *   **Case/Consideration:** Moral language and experience feel categorically different from subjective taste. A serious relativism can't just dismiss this as an illusion; it needs to explain *why* this "objectivity effect" arises within relative frameworks. (Possible answers: deep socialization, the functional role of norms, the categorical nature of moral demands within a system).
      *   **Negotiability:** **Non-Negotiable.** Ignoring this makes the theory implausible to anyone reflecting on their own moral experience. It risks reducing morality to something it doesn't feel like.

  **Critical Requirement Avoiding Triviality (Non-Negotiable for being "Relativism"):**

  5.  **Deny a Single, Transcendent Moral Standard:**
      *   **Requirement:** The theory must genuinely deny the existence of any single, objective, universal, mind-independent, or culture-transcendent standard by which *all* moral frameworks can be ultimately judged as "correct" or "incorrect." It must assert that moral truth is *constituted* by, or *dependent* on, contingent frameworks (cultural, individual, rational).
      *   **Case/Consideration:** This is the defining *relativist* commitment. If it allows for a single ultimate standard (even if hard to know or apply), it collapses into a form of realism or absolutism. "Watered-down" versions where "everyone is a relativist" usually fail this test (e.g., claiming moral truths are "relative to human nature/natural facts" often smuggles in a universal standard).
      *   **Negotiability:** **Non-Negotiable** for it to be a distinctive relativist theory. This is the core differentiator.

  **Important Requirement (Often Desired, But Contested Within Relativism):**

  6.  **Provide Grounds for Inter-Framework Dialogue/Critique:**
      *   **Requirement:** The theory should offer resources, beyond sheer power or persuasion, for meaningful dialogue, criticism, or even limited judgment *between* different moral frameworks. This could be pragmatic (consequences, stability), rational (internal consistency, coherence), anthropological (shared human needs/flourishing), or procedural.
      *   **Case/Consideration:** The charge that relativism leads to paralysis or "anything goes" in the face of profound moral differences (e.g., genocide vs. human rights). While a relativist *can* consistently say no framework is ultimately "truer," many seek ways to avoid total normative isolation. *Does this requirement compromise Requirement 5?*
      *   **Negotiability:** **Negotiable.** Some relativists (e.g., Rorty) embrace the lack of transcendent grounds, seeing dialogue as persuasion within a contingent "final vocabulary." Others (e.g., some forms of "relational relativism") try to build bridges. It's a point of internal debate *among* relativists about how far relativism can/should go normatively.

  **The Central Tension (Your Hunch is Correct):**

  *   **Requirement 1 (Genuine Disagreement) vs. Requirement 5 (No Single Standard):** This is the core philosophical knot. How can there be *genuine* disagreement (not just equivocation) without a shared standard to disagree *about*?
      *   **Relativist Response Strategies (The Article's Focal Point):**
          1.  **Framework-Relative Genuineness:** Disagreement is genuine *within* a shared framework when parties dispute interpretation/application of *its* standards. Between frameworks, apparent "disagreement" is often equivocation or fundamental clash, not disagreement *about the same moral proposition* understood the same way. Genuine *inter*-framework moral disagreement, in the strong sense of disputing the same truth-apt proposition, is impossible without a shared standard. The *feeling* of disagreement arises from conflict of commitments/practices.
          2.  **Shared Sub-Frameworks/Pragmatics:** Parties might share *some* relevant principles or values (e.g., "well-being matters," "consistency is good") even while differing on others, allowing for limited genuine disagreement on specific points derived from these shared elements. Or, disagreement might be about practical consequences/implications recognizable across frameworks.
          3.  **Rejection of Strong 'Genuine Disagreement':** Some relativists might bite the bullet and argue that what looks like deep moral disagreement *between* frameworks is ultimately just differing commitments or expressions of different forms of life, not a clash over mind-independent truths. The reformer/defector cases are handled internally or as shifts, not as evidence of cross-framework truth-apt disagreement.
      *   **Why it Matters:** This tension is *the* heart of the debate. Relativists *must* navigate it. Does their explanation of Requirement 1 ultimately undermine Requirement 5 by implying shared standards? Or do they adequately explain the *appearance* of deep disagreement without resorting to an absolute standard? Your article can explore how different relativist theories attempt this high-wire act.

  **Summary of Non-Negotiables:** A serious moral relativism theory *must*: Explain contradiction/disagreement/equivocation (1), rigorously separate descriptive/metaethical/normative claims (2), account for reformers/defectors (3), explain the phenomenology of objectivity (4), and deny a single transcendent standard (5). Requirement 6 is desirable for many but contested.

  **The Build-Around:** Focus on how Requirement 1 and Requirement 5 pull against each other. How do the relativists you interview attempt to resolve this tension? Do their solutions satisfy, or do they inadvertently reintroduce an absolute standard or render moral disagreement illusory? This is where the philosophical rubber meets the road and explains why moral arguments often feel interminable – the fundamental assumptions about the *nature* of moral truth are in radical conflict.
