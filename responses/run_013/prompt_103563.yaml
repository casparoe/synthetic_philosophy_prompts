prompt: |-
  I am trying to determine whether a pattern I keep encountering has an established name, and if it does, what that name is — though a name by itself will not satisfy me, since what I actually need is the pattern drawn precisely, with its edges marked.

  I notice the pattern in three settings. In the first, a thousand entrants are in a draw and exactly one will be selected. Of any single entrant I am almost certain that they will not be selected, and I would say as much of each one in turn; yet I am equally certain that some entrant will be selected, and I would not say that no entrant will be. In the second, I have just finished a long factual book containing several hundred separate claims. I have checked each claim and would stand behind any of them on its own, and yet I judge it likely that at least one of them is false, and I say so in a note at the front. In each of these two settings every individual item seems to me entirely in order while the collection does not, and I cannot put my finger on the item that is at fault. The third setting feels of a piece with the others and yet will not sit still alongside them: I have made several promises to several different people, and each promise, taken alone, is one I am able to keep; but I have made so many that I cannot keep them all, and still there is no single promise I am unable to keep.

  What I want is not merely a label but an account. Is there one name for the general phenomenon, or several? Are the three settings one thing or different things — and if different, what distinguishes them? Is the difficulty a matter of probability, of what I believe, of what I may assert, or of something else entirely, and does the answer come out the same for the third setting as for the first two? I would also like to know how the nearest established ideas differ from what I have described; I suspect the first two settings may have received standard treatments while the third may not, and I do not want the third absorbed into the others if it does not genuinely belong there. If no established name covers the whole, please coin one and define it, marking what falls inside and what falls outside.

  Begin with your answer in the first sentence — whether the phenomenon has an established name, and if so which — and then give the reasoning, the distinctions, and the boundary cases, without preamble or restatement of what I have asked.
reasoning: |-
  Hmm, the user presents three scenarios that highlight a logical tension between individual certainty and collective doubt. They want to know if this phenomenon has a name and how to precisely delineate its boundaries.

  The lottery paradox comes to mind immediately for the first scenario - where each ticket holder is individually unlikely to win, yet collectively we know someone must win. This is a well-known philosophical puzzle about probability and belief. The preface paradox similarly fits the second scenario about believing each claim in a book while acknowledging the statistical likelihood of at least one error.

  The third scenario about promises introduces new dimensions - it's not about probability but about practical feasibility. Here the tension arises from resource constraints rather than epistemic limitations. The promises are individually possible but collectively impossible due to time/energy constraints.

  I need to clearly distinguish these:
  1) Lottery and preface paradoxes deal with probabilistic reasoning and belief consistency
  2) The promise scenario concerns feasibility under resource constraints
  3) All share a "no specific fault" characteristic

  For the promise case, terms like "overcommitment paradox" or "resource exhaustion dilemma" would be more accurate than stretching the existing paradoxes. The key difference lies in the nature of the impossibility - logical vs practical.

  The user seems philosophically sophisticated - they want precise boundaries, not just labels. They're likely exploring epistemological frameworks or ethical implications of commitment-making. Their frustration with "not putting a finger" on the faulty element suggests they seek resolution methods too.

  I should emphasize that while all three scenarios create similar psychological unease, they operate in distinct logical categories. The resource-based impossibility in promises can't be reduced to probability without losing something essential. A coined term for the third case would help maintain this distinction.
answer: |-
  The phenomenon has no single established name covering all three settings; the first two are instances of the **Lottery Paradox** and **Preface Paradox**, while the third requires a distinct concept, here coined as the **Feasibility Exhaustion Dilemma**.  

  ### Distinctions and Analysis  
  1. **Lottery Paradox (First Setting)**  
     - **Nature**: Epistemic probability.  
     - **Structure**:  
       - *Premise*: For each entrant *i*, the probability of *i* being selected is low (e.g., 0.001).  
       - *Conclusion*: It is rational to believe no entrant will win (aggregating individual low probabilities).  
       - *Contradiction*: This conflicts with the rational belief that *some* entrant *will* win (probability 1).  
     - **Boundary**: Fails when probabilities are not uniform (e.g., one entrant has a 99% chance) or when the event is not guaranteed.  

  2. **Preface Paradox (Second Setting)**  
     - **Nature**: Doxastic justification (belief warrant).  
     - **Structure**:  
       - *Premise*: For each claim *c* in the book, the author has strong evidence supporting *c*.  
       - *Conclusion*: The author is justified in believing each *c* is true.  
       - *Contradiction*: The author is also justified in believing the ensemble contains at least one error (due to human fallibility).  
     - **Boundary**: Dissolves if the author is infallible or if claims are logically interdependent.  

  3. **Feasibility Exhaustion Dilemma (Third Setting)**  
     - **Nature**: Practical possibility under resource constraints.  
     - **Structure**:  
       - *Premise*: Each promise *p* is *individually* fulfillable (no inherent impossibility).  
       - *Conclusion*: For any *p*, the agent *can* keep *p*.  
       - *Contradiction*: The agent *cannot* keep *all* promises due to finite resources (time, energy).  
     - **Key Difference**: Unlike probabilistic/doxastic paradoxes, impossibility arises from cumulative resource depletion, not epistemic limits.  
     - **Boundary**: If promises share resources (e.g., all require money from a fixed pool), the dilemma collapses into a single feasibility constraint.  

  ### Core Divergence  
  - **First Two Settings** involve *epistemic consistency*: Rational belief in individual components conflicts with rational belief in the whole.  
  - **Third Setting** involves *practical consistency*: Individual possibility conflicts with collective impossibility under finite resources.  
    - Here, "cannot" is physical/metaphysical (resource exhaustion), not probabilistic.  

  ### Established Concepts vs. Your Cases  
  - **Sorites Paradox** (vagueness): Does not apply; boundaries here are sharp (e.g., "selected/not selected").  
  - **Fallacy of Composition** (assuming whole has properties of parts): Related but insufficient; your cases highlight *rational* or *practical* inconsistency, not logical error.  
  - **Collective Action Problems**: Overlap in the third setting, but typically involve strategic interaction, not unilateral feasibility.  

  ### Boundary Marking  
  - **Inside**:  
    - Epistemic: Uniform low-probability events (Lottery); highly probable but fallible claims (Preface).  
    - Practical: Commitments with separable resource demands (Feasibility Exhaustion).  
  - **Outside**:  
    - Scenarios with identifiable faulty elements (e.g., a known defective lottery ticket).  
    - Cases of logical inconsistency (e.g., promising both A and not-A).  
    - Statistical generalizations (e.g., "most claims are true" without individual warrant).  

  ### Conclusion  
  The patterns are distinct:  
  - **Lottery/Preface** address *rational belief aggregation*.  
  - **Feasibility Exhaustion** addresses *resource allocation under finitude*.  
  Using one term for all would obscure critical differences in why the collective fails.
