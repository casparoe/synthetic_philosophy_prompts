  The user highlights two main points: first, all evidence for inner life in the film is public and third-personal—like the Voight-Kampff test, Rachael's implanted memories, and the replicants' photos. This makes Deckard's replicant status seem irrelevant since he exhibits the same external behaviors. Second, implanted memories serve as a model for how illusionism explains the false belief in a rich inner life.

