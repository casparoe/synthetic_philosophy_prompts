prompt: |-
  ok so i'm a novelist, and i'm in a small nonfiction reading group — the woman who runs it writes essays and she's the one who got me into Plutarch — and she has very firm opinions about which lives are actually worth learning from, morally speaking. her verdicts so far:

  - classic saint's life, miracles, not one moment of doubt: no. she says you can't be that, so what are you supposed to do with it.
  - doorstop biography of a famous general, battles and decisions, basically no inner life: no.
  - memoir by a nobody, dead-end jobs, quietly trying to be less of a jerk to his family: yes, best kind.
  - a guy who stood by while something awful happened, spent years telling himself it wasn't his problem, then slowly made himself act — no medals, small scale: yes.
  - a saint's life where he's a total wreck first and then turns it around over years of unglamorous effort, no miracles: yes.

  next month's book is a woman who drank her way through her twenties, treated everyone like garbage, and then got clean — and the whole thing turned on one night where, as she tells it, God spoke to her. no program, no slow grind, just the one night, and then she was different. what is my friend going to say about it? and what rule is she actually running here — are there other rules that fit her list just as well? and whats the next book we should pick to find out which rule she's really using?
reasoning: |-
  Okay, the user is a novelist in a nonfiction reading group, and they're trying to figure out the group leader's criteria for morally valuable biographies. The leader has clear opinions on which lives are worth learning from. Let me list out her verdicts again to make sure I understand:

  1. Classic saint's life with miracles and no doubt: No. Reason? You can't relate to it, so it's not useful.
  2. Doorstop biography of a general focusing on battles, no inner life: No. Lacks personal struggle.
  3. Memoir by an ordinary person trying to be better in small ways: Yes. Quiet, everyday efforts.
  4. Someone who initially ignored a problem but eventually acted on a small scale: Yes. Imperfect but took responsibility.
  5. Saint's life with a messy past and slow, non-miraculous change: Yes. Focus on gradual effort.

  Now, the next book is about a woman who had a sudden transformation after a divine encounter. The user wants to predict the leader's reaction and understand the underlying rule. Also, they want to know what book to pick next to test the rule.

  First, analyzing the pattern. The leader rejects stories that are unattainable (miracles) or lack internal conflict (generals). She values authenticity, struggle, and attainable change. The yeses involve personal responsibility, incremental effort, and relatability. The sudden divine intervention in the upcoming book seems problematic because it's a quick fix without ongoing effort. That contradicts the slow grind she admires. So she’ll likely say no to this book because it lacks the gradual, human effort she values.

  But maybe there's more. The leader might also care about agency. In the yes examples, the individuals take active steps, even if slow. The divine intervention might make her question if the change was truly the person's effort or an external force. That reduces agency, which she probably values. The general's bio lacked inner life, so agency without reflection is out. The sudden transformation could feel like bypassing personal responsibility.

  Then, the user wants to test the rule. So what book should they pick next? Maybe a memoir where someone had a sudden epiphany but no divine element. For example, someone who changed after a natural disaster, realizing life is short. That removes the supernatural but keeps the suddenness. If she rejects it, the key is gradual process. If she accepts, maybe the issue was the divine aspect. Another test could be a biography of someone who succeeded through privilege alone, without struggle. That would test if she values struggle regardless of outcome.

  Also, the user is a novelist. They might be interested in character development and relatable arcs for their writing. Understanding the leader's rules could help them craft better characters or choose impactful biographies for research. The deeper need might be to grasp what makes a life story compelling and morally instructive, both for their writing and personal growth. The leader's criteria could be a lens for creating authentic narratives that resonate with readers seeking realistic inspiration.
answer: |-
  Based on your friend's established pattern, here's the prediction and the analysis:

  1.  **Verdict on the Next Book (Woman/Sudden Divine Transformation):** **NO.**

      *   **Why?** The core element she consistently rejects is a transformation lacking **sustained human effort, struggle, and relatable agency**. The sudden, miraculous divine intervention bypasses the "slow grind," the "unglamorous effort," and the incremental "trying to be less of a jerk" she values. It mirrors the rejected "classic saint's life" in its reliance on the supernatural and lack of relatable, step-by-step struggle *after* the initial catalyst. Even though the woman had a messy past, the *mechanism* of change is what your friend finds un-instructive.

  2.  **The Rule She's Running:**
      Your friend values biographies that offer **attainable moral instruction through the depiction of sustained, imperfect human effort in confronting internal flaws and taking responsibility, often on a small scale.**

      *   **Key Components of Her Rule:**
          *   **At the Core: Focus on Character Development & Moral Struggle:** Not deeds, fame, or outcomes, but the internal battle for ethical improvement.
          *   **Imperfect Starting Point:** Flawed protagonists ("wreck," "jerk," "stood by") are essential.
          *   **Sustained Effort & Process:** Change must be shown as a difficult, ongoing *process* ("slowly made himself act," "years of unglamorous effort," "trying to be less of a jerk").
          *   **Relatable Agency:** The change must stem primarily from the individual's conscious effort and choices, however faltering, not miracles, inherent sainthood, or overwhelming external forces (like grand strategy). The "nobody" and the "slow actor" are key here.
          *   **Scale:** Small-scale, personal responsibility ("small scale," "his family") is valued over grand, world-changing deeds where the inner life is obscured.
          *   **Absence of the Unattainable:** Rejects shortcuts (miracles) and narratives lacking internal struggle (doorstop general bio).

  3.  **Alternative Rules That *Don't* Fit As Well:**
      *   *"Values stories of redemption."* While true, it's too broad – she rejects the classic saint's life, which *is* a redemption story. Her focus is on the *how* of redemption.
      *   *"Values stories of failure."* Not quite – she values stories of effort *emerging from* failure or flaws. The nobody's memoir isn't necessarily about failure, but about quiet effort.
      *   *"Values underdogs/nobodies."* This is a strong factor (the memoir, the slow actor), but it's secondary. She'd reject a nobody's story if their transformation was miraculous or lacked the sustained effort she prizes. The "saint's life wreck" might not be an underdog initially.
      *   *"Rejects the supernatural."* While she rejects miracles, it's because they bypass human effort, not necessarily because she disbelieves them. A story where faith *sustained* a long, difficult effort *might* pass if the human struggle was central (like the "unglamorous effort" saint).

  4.  **The Next Book to Test the Rule (Specifically the "Effort vs. Epiphany" Aspect):**

      To pinpoint if **sustained effort** is the *non-negotiable* core vs. other factors like the *nature* of the epiphany (divine vs. secular) or the *scale*, propose one of these:

      *   **Test A: Secular Epiphany + Sustained Effort:** A memoir where someone has a sudden, profound, *secular* realization (e.g., a near-death experience, a therapist's blunt insight, witnessing an injustice) that sparks immediate commitment to change, but the *bulk* of the book details the *years of difficult, messy work* required to actually *become* different, with setbacks and ongoing struggle.
          *   *Prediction:* **YES.** The core of the narrative is the sustained human effort *after* the catalyst. The epiphany is just the start.
      *   **Test B: Divine Sustenance + Effort:** A biography of a historical religious figure known for intense spiritual experiences *and* a lifetime of arduous, often frustrating, practical work and service (e.g., Dorothy Day, some Desert Fathers, certain missionaries). Focuses heavily on the daily grind, doubts, administrative headaches, and interpersonal struggles *alongside* their faith.
          *   *Prediction:* **Likely YES.** While faith/supernatural is present, the narrative weight is on the sustained, difficult *human* effort and perseverance.
      *   **Test C: Effortless "Natural" Change:** A memoir by someone who describes a significant positive personality or behavioral shift (e.g., overcoming anger, becoming disciplined) as something that just "happened" naturally as they matured, or through simple environmental change (e.g., moving cities), without depicting conscious struggle or sustained effort.
          *   *Prediction:* **NO.** Despite lacking the supernatural, it bypasses the core element of conscious, difficult effort and struggle she values. It feels too easy, too passive.

  **Conclusion:** Your friend is a **Process Puritan**. She believes moral growth is only truly instructive and attainable when it's shown as hard, conscious, ongoing, imperfect work. Miracles, inherent virtue, grand deeds devoid of inner life, and effortless change don't provide a usable blueprint. The "God spoke to her and she was different" story will be rejected because it violates the fundamental requirement of **depicted, sustained human effort.** To test this definitively, propose **Test A (Secular Epiphany + Sustained Effort)**. If she accepts it, the divine element wasn't the core issue; the lack of depicted process was. If she rejects even that, you might need to probe deeper into *why* the sudden catalyst itself is problematic for her, even when followed by effort. But based on the pattern, **Test A** is the clearest next step.
