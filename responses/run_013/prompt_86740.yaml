  I'm putting together a unit on authorial intention and I want to build it around Blade Runner, because the film is a mess in exactly the productive way. You've got the 1982 theatrical cut with Deckard's voiceover and the studio's happy ending, the 1992 Director's Cut that drops the voiceover, puts back the unicorn dream, and cuts the happy ending, and the 2007 Final Cut which Scott says is the version he actually controls — and then on top of that, Scott has said in interviews that Deckard is a replicant, while Ford has said he played him as a human. So we seem to have no single author and no single text, and yet people argue about what the film really means and the arguments aren't stupid. Read it through the intention debate: what does an intentionalist, a hard anti-intentionalist, and someone who says the unit of interpretation is the version rather than the work each do with the unicorn-and-origami business at the end, and where does each of them come out looking worse than they'd like? I don't want a summary of the debate with the film sprinkled on top — I want the film used as a stress test, including at least one place where it resists the reading you're giving it.

