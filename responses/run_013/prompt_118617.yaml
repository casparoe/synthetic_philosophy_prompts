prompt: |-
  ok so for civics we had to pick a med ethics topic and present both sides and i picked surrogacy and egg donation and now i'm stuck on something and my teacher said to write down what i actually want to know instead of just saying its confusing.

  heres the thing i cant get past. in a bunch of european countries (spain is the one i used in my slides) you cannot pay a woman to carry a baby for you. the contract is void, the woman who gives birth is the legal mother no matter what anybody signed, and its all justified by dignity and not turning womens bodies into products and not exploiting poor women. but the SAME country lets clinics give women money for their eggs. its officially called compensation for the inconvenience and expenses, not payment, but it is money and it is for a body part. and theres a european bioethics treaty (oviedo convention i think?) that says the human body and its parts shouldnt be a source of financial gain, which you would think kills both of them.

  then flip it. in the US, at least in lots of states, you can pay a surrogate, the contract basically decides who the parents are from the moment of birth, and the whole thing costs more than a house deposit. so there the surrogate and the egg donor are both getting paid and the money is just the price of the service.

  what i want is the underlying theory. like for you can sell that but not that to be a coherent position and not just vibes, what does the ban have to believe? about what a body is, about what a mother is, about what the actual difference is between a few eggs and nine months of your life and your health and then handing over the baby? and what does the american version have to believe about parenthood, that its about who intended the kid rather than who grew it, and that someone can contract away being a mother?

  also i want to know which parts are actually required and which parts the rules would survive without. could someone be against paid surrogacy just because of the contract side (you cant promise a baby before it exists, you cant enforce a deal about a person) while thinking nothing at all about commodification? could someone be against it only because it goes wrong in practice, exploitation and rich foreigners and all that, without thinking its wrong in principle? and is the compensation vs payment thing a real moral line or just relabeling so everyone can feel ok about it? same question the other way: does paying for eggs really treat them like sperm, or does it assume something different about womens bodies?

  last thing, if you took away whichever belief is doing the real work, what would actually have to change? does the rule about who the legal mother is follow from the money rule, or is that a separate commitment that just happens to travel with it? like could you have a place that bans paid surrogacy but still lets the intended parents be the legal parents?

  no sources or reading list please, we're not allowed to cite stuff we havent read anyway, i just want the actual theory underneath so i can argue about it in class and not get destroyed.
reasoning: |-
  Okay, the user is working on a civics project about surrogacy and egg donation, specifically confused about the inconsistencies in regulations between countries like Spain and the US. They need to understand the underlying theories to present both sides effectively. 

  First, I need to unpack the core conflict they're stuck on: why some countries ban paid surrogacy but allow compensated egg donation, despite both involving monetary exchange for biological contributions. The user wants the philosophical foundations, not just surface-level explanations.

  The key theories here seem to be:
  - **Commodification vs. Altruism**: The European stance appears rooted in Kantian dignity principles - treating the body as an end in itself. Pregnancy is seen as an inseparable lived experience, while egg donation is framed as a detached tissue transfer. This explains why compensation for "inconvenience" passes ethical review but payment for surrogacy doesn't.
  - **Parenthood Definitions**: European law emphasizes gestation as the foundation of motherhood (mater semper certa est), making contracts unenforceable. The US contractual model reflects intentional parenthood theory - genetic connection + pre-conception agreement creates moral/legal rights.
  - **Practical vs. Principled Objections**: Some opposition to paid surrogacy may stem from observable harms (exploitation, cross-border reproductive tourism) without rejecting the concept fundamentally. The compensation/payment distinction could be both a genuine boundary (time/risk scale) and semantic laundering.

  The user also asks about modular beliefs - which elements are essential versus adjustable. For example:
  - Could you ban paid surrogacy solely over unenforceable baby contracts while approving egg sales? Probably yes, if your objection is about trading persons versus tissues.
  - Would prohibiting exploitation without opposing commercial principles satisfy European ethics? Unlikely, because dignity concerns run deeper.

  They're clearly preparing for classroom debate, so I should emphasize how these theories play out in arguments. For instance: 
  - When Europeans say "eggs are like sperm," they're deliberately minimizing gender difference to justify compensation. 
  - When Americans treat surrogacy as a service, they're rejecting the "inalienable" view of pregnancy.

  The last puzzle about legal motherhood's dependency on payment bans is particularly sharp. I'll clarify that these are separate commitments - Spain could theoretically maintain gestational motherhood principles even with unpaid surrogacy (but doesn't need to since both are banned).

  Noticing the user's frustration with "vibes-based" policies, I'll stress how each position coheres internally: European bioethics builds from bodily integrity axioms, while US practice reflects market liberty values. Their teacher's advice - "ask what you really want to know" - paid off here.
answer: |-
  Here's the underlying theory broken down, focusing on the core beliefs needed for each position to be internally consistent:

  **The European (e.g., Spain) Model: Banning Paid Surrogacy but Allowing Compensated Egg Donation**

  1.  **The Core Belief: Pregnancy is Fundamentally Different & Inalienable.**
      *   **Body as Process vs. Product:** Egg donation is seen as providing *tissue* (a product, albeit a special one). The procedure is relatively quick, and the eggs are separated from the donor permanently. Pregnancy, however, is viewed as an *ongoing, embodied experience and relationship*. It's not just providing cells; it's using one's entire body and self over 9 months to *create and sustain another human life*. This process is seen as inseparable from the woman's identity and dignity during that time.
      *   **Motherhood as Gestational:** The foundational legal principle here is often *"Mater semper certa est"* (The mother is always certain). The woman who gives birth *is* the mother, biologically and legally, because of the unique, irreplaceable biological process of gestation. A contract cannot sever this fundamental biological and experiential link *before the fact*.
      *   **Commodification Threshold:** Money for eggs is framed as compensation for the *inconvenience, time, risk, and discomfort* of the donation *procedure*. It's not payment for the *eggs themselves* as products. The amount is usually regulated and modest. Paying for surrogacy, however, is seen as directly paying for the *gestational service and the resulting child*, crossing a line into commodifying both the woman's body *as a process* and the child *as an outcome*. The scale of time, physical transformation, risk, and emotional entanglement is vastly different, making payment feel like buying the service of creating a person.
      *   **Oviedo Convention Interpretation:** The ban on "financial gain" from the body is interpreted as prohibiting treating the body *or its functions* as a commodity for direct sale/profit. Compensation for expenses/time/risk in a medical procedure (egg retrieval) is seen as distinct from paying someone to undertake a profound, identity-shaping life process (pregnancy) for the primary purpose of transferring the resulting child.

  **What the Ban Needs to Believe to be Coherent:**
  *   Pregnancy is a unique, profound, embodied experience that fundamentally defines the mother-child relationship at birth.
  *   Gestation creates an inherent, non-contractual bond of motherhood.
  *   Paying for this *specific process and outcome* commodifies both the woman's body-in-process and the child.
  *   The risk of exploitation (poor women renting their wombs) is inherent and unacceptable due to the scale of the commitment.
  *   Egg donation is a discrete medical act providing tissue, not an ongoing bodily service creating a parental relationship, making regulated compensation acceptable.

  **The US (Commercial Surrogacy) Model: Allowing Payment for Both Surrogacy and Egg Donation**

  1.  **The Core Belief: Autonomy, Contract, and Intentional Parenthood.**
      *   **Body as Property/Service:** Individuals have strong autonomy rights over their own bodies. If they choose to use their body (to provide eggs or gestational services) in a consensual agreement for payment, that is their right. The body (or its functions) can be a source of income through service provision, like other labor.
      *   **Parenthood as Intention & Contract:** Legal parenthood is determined by *intent and pre-conception agreement*, not solely by biology or gestation. The Intended Parents (IPs) initiated the creation of the child and contracted for its gestation. The surrogate is providing a valuable *service* (gestation), not acting as the *intended parent*. The contract reflects this agreement and dictates parentage *at birth*.
      *   **Enforceable Exchange:** This is a commercial transaction. Payment reflects the significant time, effort, risk, and sacrifice involved for the surrogate. It's compensation for the *service rendered*, not payment *for the baby*. The high cost reflects medical, legal, agency fees, and the surrogate's compensation package.
      *   **Commodification Acceptance (or Rejection of the Premise):** This model either rejects the idea that this constitutes harmful commodification of the body/child, or sees the autonomy and benefits (fulfilling IPs' desire for a child, compensating the surrogate fairly) as outweighing those concerns. The child is the *purpose* of the contract, but not the *object being sold*; the service is.

  **What the US Model Needs to Believe to be Coherent:**
  *   Individuals have the right to control their reproductive capacities and bodily services, including for financial gain.
  *   Gestation is a service a woman can choose to provide; it does not inherently create a parental claim superior to the genetic/intended parents.
  *   Legally binding contracts are the appropriate way to establish the rights and responsibilities of all parties *before* conception, including parentage.
  *   Fair market compensation is justified for the surrogate's substantial contribution and risk.
  *   Concerns about exploitation can be managed through regulation, screening, and legal safeguards.

  **Addressing Your Specific Questions:**

  1.  **Modular Beliefs (Which parts are required?):**
      *   **Against Paid Surrogacy ONLY due to Contracts/Baby as Object:** Yes. You could believe paid surrogacy is okay *in principle* but object to the *enforceability* of contracts involving the transfer of a child (viewing the baby as an inalienable person, not a contracted object) or object to contracts dictating parentage *before* the child exists/without their interests considered. You might still support *altruistic* surrogacy with parentage established post-birth. This wouldn't necessarily oppose egg donation compensation.
      *   **Against Paid Surrogacy ONLY due to Practical Exploitation:** Yes. You could believe paid surrogacy is ethically acceptable *in principle* (autonomy, service) but oppose its legalization *in practice* because the risks of coercion (especially on poor women), unequal bargaining power, cross-border exploitation, and potential for broken agreements are too high and unmanageable. This view might be open to egg donation compensation if seen as less prone to these risks.
      *   **Compensation vs. Payment - A Real Line or Relabeling?** It's **both**. *Morally:* Proponents see a genuine line between reimbursing costs/recognizing burden (eggs) and paying a market rate for a service (surrogacy). Critics see it as semantic laundering – money changes hands for bodily contributions in both cases. *Legally/Practically:* The label ("compensation") is crucial in jurisdictions adhering to the Oviedo-type principle. It allows egg donation to continue while maintaining the *appearance* of not selling body parts. The distinction rests entirely on the belief that eggs are separable tissue while gestation is an inalienable process.
      *   **Eggs like Sperm?** The "compensation" model *deliberately* tries to treat eggs like sperm (regulated tissue donation with expense reimbursement) to downplay gender difference. However, the *process* of egg retrieval (hormonal stimulation, invasive procedure) is far more burdensome than sperm donation, revealing an underlying assumption that women's reproductive contributions require *more* compensation due to greater physical imposition, even if framed as "expenses."

  2.  **Legal Motherhood Rule & Money Rule:**
      *   These are **separate but linked commitments** that reinforce each other.
      *   **Could you ban paid surrogacy but let IPs be legal parents?** **YES, theoretically.** A jurisdiction could believe:
          *   Paid surrogacy commodifies the process/risks exploitation (hence the ban on payment).
          *   BUT, the *intended parents* (especially if genetically related) should be the legal parents from birth based on intent and pre-conception agreement.
          *   The surrogate is providing an *altruistic gestational service*, not acting as a mother.
      *   **Why is this rare (like Spain)?** Because the *stronger* underlying belief in the European model is usually **"Mater semper certa est"** – the birth mother *is* the legal mother due to the gestational bond. Banning payment *reinforces* this by removing financial incentive that might undermine the presumption of motherhood. Allowing IPs to be legal parents immediately would contradict the core gestational principle. The payment ban and the birth mother rule work together to protect against commodification *and* uphold the primacy of gestation for legal motherhood.

  **The Real Work:**

  *   The **key belief doing the real work** in the European model is the **primacy of gestation in defining motherhood** and the **view of pregnancy as an inalienable, non-commodifiable life process**.
  *   The **key belief doing the real work** in the US model is **individual autonomy over one's body as a service provider** and **intentional parenthood established by contract**.

  **To argue effectively:** Frame your points around these core underlying beliefs. Ask which model's foundational principles about the body, motherhood, and contracts your classmates find more convincing, and why. Point out the internal logic of each position *based on these core beliefs*, even if you find one more persuasive. Good luck!
