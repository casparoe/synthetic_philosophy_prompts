  Hmm, the user's core innovation is splitting "standing" into two components—claim and credit. That's clever. But the room will resist separating these because their framework sees blame as holistic. The grad students' empirical angle is especially dangerous since the user's theory is purely normative.

  *scratches head* The threshold purist is actually the biggest threat because if standing can't be partial, the whole credit/claim distinction collapses. Must prep a Scanlon-friendly reply showing how relational breaches admit of degrees. 

  *checks notes* The user's email case is strong but vulnerable to "why not just say it's warranted blame with bad motives?" Need to emphasize the added moral injury beyond rudeness. 

  *winces* The nightmare question would be someone asking how credit-wrong manifests if not through undermining blame's force. Better have that Frankfurt/Scanlon hybrid defense ready about second-order relational damage. 

  *realizes* Should advise conceding early that hypocrites' blame often fails practically—disarms the psych folks while protecting the core claim that it still technically lands. Smart.
answer: |-
  Here's your prep sheet, structured for maximum survival in a Strawson-Scanlon room. Prioritize **relational language** and avoid transactional/speech-act jargon.

  ---

  ### **Strategic Concession (First 5 Minutes)**
  **Concede This:** "Hypocrisy often *practically undermines* the uptake or effectiveness of blame. Hearers resist, feel resentment, and may dismiss the message *because* of the messenger. This is real and important. My claim isn't that hypocrisy is harmless; it’s that it adds a *new wrong* (a failure of relational credit) rather than negating the existing normative demand (the claim). Blame can be both *valid* and *relationally toxic*."

  * **Why:** Disarms moral psychology grad students early. Shows you acknowledge real-world effects without ceding normative ground. Prevents "that's a different question" fatigue.

  ---

  ### **Objections: Ordered by Likelihood (High → Low) & Damage (Severe → Mild)**
  *(Phrased as they'd say it, with reply & soft spot)*

  1.  **The Threshold Purist (Dr. Riggs):**  
      *"Standing is binary. Either you have the authority to issue this blame-address or you don’t. Your 'credit reading' just describes being a jerk while blaming. It doesn’t affect standing; it’s about character or tone. Degrees of standing? Nonsense."*  
      **Reply (2 min):** "In Scanlon's framework, blame is about the significance of impaired relationships. Hypocrisy *impairs the specific relationship relevant to the blame-act itself*. When the colleague who ignores emails lectures me on professionalism, our *collaborative relationship* is so damaged *in precisely the domain he’s invoking* that his act of blaming *itself* constitutes a further impairment – an assertion of a normative position he’s forfeited. This isn't just 'being a jerk'; it's a distinct wrong *within the relational exchange of blame*. Standing isn't about global authority; it's about the specific relational context of *this* blame-act."  
      **Soft Spot:** Needs clearer link between "domain-specific relational impairment" and why this isn't just about *weight* or *hypocrisy being bad*, but about the structure of the blame-interaction itself. Risk: They see it as collapsing into "warrant + bad motives."

  2.  **The Relabeler (Prof. Vance):**  
      *"You’ve just split 'standing' into 'claim' (which you call warrant) and 'credit' (which you call standing). You haven't shown standing isn't unified; you've renamed its components. Why isn't the 'credit' failure just *part* of what undermines standing?"*  
      **Reply (2 min):** "Because the *demand inherent in blame persists* even when the hypocrite issues it. The colleague *is right* about professionalism. That demand still addresses me and gives me reason. What fails is his *relational credit* to *level* that demand *at me* without adding a new wrong. The unified view says hypocrisy voids the blame-act. I say the blame-act lands (I'm called out, the demand exists) *and* it delivers an extra relational injury (his presumption). Splitting explains why we feel both addressed *and* insulted."  
      **Soft Spot:** Needs to hammer why "the demand lands" is crucial and distinct. They may retort: "If the relational injury is so severe, doesn't it *prevent* the demand from being properly constituted?"

  3.  **The Moral Psychologist (Grad Student Alex):**  
      *"Empirical studies show people *don't* feel addressed by hypocrites; they feel anger *at* the hypocrite and dismiss the content. Doesn't this show the blame-act *fails* relationally? Your 'claim reading' doesn't match how blame functions socially."*  
      **Reply (2 min):** "The studies show uptake *resistance*, not absence. The anger *presupposes* recognition of the demand being made! Dismissal is a *reaction against* being blamed by someone unworthy, not ignorance of the blame. The hypocrite *does* relate to you as a blamer – that's *why* it stings. You feel both 'They're right, damn it' *and* 'How dare *you* say this?' The relational failure is in the hypocrite's *act* of positioning themselves as your blamer, not in the listener failing to register the positioning."  
      **Soft Spot:** Risk of them insisting dismissal = non-reception. Emphasize the *phenomenology*: "The 'how dare you' feeling *requires* recognizing the 'you' is blaming you."

  4.  **The Holist (Prof. Chen - Strawsonian):**  
      *"Blame isn't an 'act' you parse; it's a complex reactive attitude expressing a *judgment* about impaired relations. Hypocrisy contaminates *that entire expression*. You can't isolate a 'valid core' from the toxic delivery; the toxicity *is* part of the relational meaning."*  
      **Reply (2 min):** "I agree blame is holistic! But its toxicity has *two sources*: 1) The judgment of wrong (warranted or not). 2) The *additional* judgment implied by the hypocrite's act: 'I am in good standing to hold you to this standard.' *That* second judgment is false and constitutes the distinct hypocrisy-wrong. The reactive attitude bundles both, but we can distinguish the components analytically. The core judgment ('you acted wrongly') can be correct even if the bundled attitude is overall inappropriate due to the added falsehood."  
      **Soft Spot:** May feel like a sleight of hand—saying attitude is holistic but then dissecting it. Stress the *added, separable false relational claim* inherent in the hypocrite's act.

  5.  **The Motive Skeptic (Dr. Evans):**  
      *"Isn't 'credit' just about the blamer's motives? Scanlon says motives don't affect standing/warrant, only whether the judgment is correct and the relationship impaired. Your 'credit' seems like a bad motive."*  
      **Reply (2 min):** "It's not about *hidden* motives. It's about the *public, relational fact* displayed *in the act itself*: the blamer's *own* conduct demonstrates they don't endorse the norm they're invoking *in their relationship with you*. This creates a *performative contradiction* within the blame-act. They are *simultaneously* asserting a normative demand *and* displaying their disregard for it in the relevant relational context. *That* public inconsistency is the credit failure, not a private vice."  
      **Soft Spot:** Needs to clearly distinguish the *public performative inconsistency* from internal motivation. Cite the email case: His act of blaming *is* the display.

  ---

  ### **The Single Objection You MUST Neutralize: Threshold Purist (Dr. Riggs)**
  *   **Why:** If standing is truly binary and indivisible, your core distinction collapses. "Credit failure" becomes either irrelevant to standing (just being rude) or synonymous with losing standing entirely. Your degrees-of-wrong argument hinges on separating the components. If they win this, your paper's central innovation is dismissed as conceptual confusion.
  *   **Neutralizing Move:** Hammer the **domain-specific relational impairment**. "His failure *to you* in *this specific domain* (professional collaboration) means his act of invoking *that specific norm* against *you* isn't just ineffective or rude; it *actively denies the reality of your existing, impaired relationship*. That denial *is* the added wrong. It doesn't void the norm's validity *for you*, but it voids *his relational position* to enforce it *on you* via blame *right now*. Standing isn't lost absolutely; it's relationally context-dependent."

  ### **The Question You're Hoping Nobody Asks**
  *   **The Nightmare Question:** "**If the hypocrite's blame 'lands as blame' and makes a valid demand (claim reading is true), yet also adds a distinct wrong (credit reading is true), *how* does this added wrong manifest if *not* by undermining the force/reception/authority of the blame-act itself? Doesn't the 'nerve of it' *just mean* they lack the standing to speak?**"
  *   **Why it's dangerous:** It directly challenges your separation, forcing you to explain the *mechanism* of the "added wrong" without invoking any weakening of blame's core function. In a relational room, this is hard.
  *   **Contingency Reply:** "The added wrong manifests as a *second-order relational violation*. The first wrong impairs the relationship via the initial act. The hypocrite's blame *should* address *that* impairment. But *their* hypocrisy constitutes a *new*, distinct impairment: the failure to acknowledge *their own* role in damaging the relationship *in the relevant domain*. It's not that the blame doesn't land; it's that the landing *includes* this extra injury – like demanding an apology while stepping on their foot. The 'nerve' is the *additional* relational damage *caused by the act of blaming*. The demand exists; the delivery inflicts extra harm." (Lean hard on the email case phenomenology: "It makes his correct point *feel* like an attack, not just a call-out.")

  ---

  **Final Prep Checklist:**
  1.  **Open with Concession:** Acknowledge practical effects to appease psych folks.
  2.  **Frame Relationally:** Constantly use "relationship," "relational standing," "relational credit," "impaired relationship," "normative position within the relationship."
  3.  **Anchor in the Email Case:** Your strongest intuition pump. Refer back to it constantly.
  4.  **Battle the Purist:** Your existential threat. Prepare domain-specificity argument cold.
  5.  **Don't Fear "Relabeling":** Emphasize the *explanatory power* of separating why we feel both addressed *and* insulted.
  6.  **Have the Nightmare Answer Ready:** Practice the "second-order relational violation" line.

  Good luck. Your core insight is strong – defend the nuance! They'll feel the pull of the email case. Make them see why existing frameworks can't easily capture that "both-and" feeling.
