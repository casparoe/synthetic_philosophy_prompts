answer: |-
  The legal practice of combatant immunity and its accompanying rules presuppose a **hybrid theory of responsibility**, combining elements of institutional division of labor and reciprocal convention, with the epistemic excuse playing a limited role. Here’s a reconstruction and analysis:

  ### Core Theory of Responsibility
  1. **Division of Moral Labor**:  
     The state (leadership) bears responsibility for the *jus ad bellum* (justice of the war). Soldiers bear responsibility for *jus in bello* (conduct within the war). This separation ensures functional efficiency:  
     - Leaders, with access to strategic information and policy-making power, are uniquely positioned to assess the war’s legitimacy.  
     - Soldiers, as executors, focus on battlefield ethics (distinction, proportionality, humane treatment).  
     **Fit**: This explains why aggression is a leadership crime and why soldiers are excused for participation in an unjust war.  

  2. **Reciprocal Convention**:  
     Combatant immunity functions as a pragmatic bargain:  
     - States grant symmetrical protections to encourage reciprocal compliance (e.g., POW treatment, no targeting of surrendering troops).  
     - Conditional immunity (lost for war crimes) incentivizes adherence to *in bello* rules.  
     **Fit**: Explains the bilateral nature of immunity and its forfeiture for misconduct.  

  3. **Epistemic Excuse (Limited Role)**:  
     Ignorance may excuse some soldiers (e.g., conscripts in propagandist states), but it **cannot** universally justify the practice:  
     - A volunteer in a democracy with a free press (e.g., the 2003 Iraq War) has access to facts about aggression but is still legally immune.  
     - The law denies selective conscientious objection, confirming that ignorance is **not** the core rationale.  
     **Fit**: Marginal; relevant only for specific cases, not the systemic design.  

  4. **Moral Equality of Combatants (Rejected)**:  
     The practice **does not require** moral equality (the idea that all soldiers share equal permissions to kill). The *asymmetry* in aggression liability (leaders vs. soldiers) and the focus on conduct rules show that the law deliberately avoids endorsing moral symmetry.  
     **Fit**: Poor—aggression prosecutions and the absence of moral language in immunity statutes contradict moral equality.  

  ### Coherence of the Hybrid Basis
  The practice **coherently combines division of labor and reciprocal convention**:  
  - **Division of labor** justifies the structural separation of *ad bellum* and *in bello* accountability.  
  - **Reciprocal convention** explains the conditional, bilateral nature of combatant privileges.  
  - **Epistemic excuses** are ad hoc supplements, not foundational.  
  **No conflict**: The two core elements address distinct questions—"Who answers for the war?" vs. "How do we regulate battlefield conduct?"  

  ### Internal Tension: Reciprocity vs. Non-Reciprocal Protections
  - **Reciprocal Elements**:  
    - Combatant immunity is conditional: violators lose protection (e.g., terrorists posing as civilians may be tried as criminals).  
    - This reflects a bargain: "Comply, and you gain privileges."  
  - **Non-Reciprocal Protections**:  
    - Prohibitions on reprisals against POWs/civilians (*Geneva Conventions*, Art. 33) apply unconditionally.  
    - Protections for medical personnel or the ban on torture are peremptory norms (*jus cogens*), owed regardless of enemy conduct.  
  - **Resolution**:  
    - The law bifurcates:  
      - *Privileges* (e.g., immunity from prosecution for lawful combat) are reciprocal and forfeitable.  
      - *Rights* (e.g., humane treatment) are inherent and non-reciprocal, deriving from human dignity, not bargains.  
    - **Single Account**: The practice distinguishes between instrumental rules (conventional reciprocity) and fundamental humanitarian principles (universal norms).  

  ### Revisionist View (e.g., McMahan): Required Changes  
  The revisionist view holds that unjust combatants lack moral permission to kill and may be liable to defensive harm. Adopting this would necessitate:  
  1. **Changes**:  
     - **Abolish symmetrical combatant immunity**: Unjust combatants could be prosecuted for mere participation (e.g., killing enemy soldiers in an aggressive war).  
     - **Expand selective conscientious objection**: Soldiers could refuse service in wars deemed unjust.  
     - **Modify POW status**: Unjust combatants might not qualify for full Geneva protections.  
  2. **Surviving Elements**:  
     - *Jus in bello* rules (e.g., no torture, distinction) could persist as minimal humanitarian standards.  
     - Aggression would remain a leadership crime, but soldiers could face liability as accessories.  
  3. **Justification of Survivors**:  
     - *In bello* rules could still be justified pragmatically (to reduce suffering) or morally (protecting the innocent). However, soldiers on the unjust side might face conflicting duties (e.g., "I must not kill, but if I do, I must avoid war crimes").  

  ### Conclusion
  - **Strict Requirements**: Division of labor (for *ad bellum*/*in bello* separation) and reciprocal convention (for conditional immunity) are foundational.  
  - **Marginal Fit**: Epistemic excuses are situational; moral equality is incompatible with the aggression framework.  
  - **Coherence**: The hybrid model holds because reciprocity governs operational privileges, while non-reciprocal protections reflect universal norms.  
  - **Epistemic Failure**: The excuse collapses for informed soldiers, proving that the practice rests on institutional roles, not ignorance.  

  The law’s genius lies in its pragmatic duality: it regulates warfare through enforceable reciprocity while embedding inviolable humanitarian principles, even if the theoretical underpinnings are pluralistic. A revisionist overhaul would destabilize this balance, risking increased brutality by removing incentives for *in bello* compliance among unjust combatants.
