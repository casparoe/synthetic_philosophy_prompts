  ## Adaptations Underwriting Ltd. - Function Coverage FAQ

  **Welcome to Adaptations Underwriting Ltd. (AUL).** We provide essential biological function insurance, securing your vital traits against unexpected performance failure. Our policies are uniquely underwritten on the robust, historically validated **Etiological Standard of Function (ESF)**, ensuring coverage reflects the true, selected purpose of your traits as determined by your lineage. Below are answers to common queries regarding your policy.

  **Q1: What exactly does AUL insure?**
  AUL provides comprehensive coverage against the failure of a covered biological trait to perform its **Selected Function (SF)**. The SF is rigorously defined as the specific causal contribution for which that trait exhibited a history of selection within your direct lineage. Coverage is strictly limited to malfunctions preventing the performance of *this specific historical activity*. Performance of non-selected activities is explicitly excluded.

  **Q2: How is my coverage determined?**
  Coverage is determined solely by your **Lineage History Assessment (LHA)**, conducted at policy inception. Our expert phylogenetic actuaries meticulously analyze the selection pressures acting upon your ancestors to identify the SF for each insured trait. Your premium and coverage limits are calculated based on the statistical reliability of that trait performing its SF within your clade over deep time. Recent environmental changes or novel utilizations are irrelevant to determining your SF.

  **Q3: My [TRAIT X] is crucial for [ACTIVITY Y] now, but my claim was denied. Why?**
  Claims are adjudicated based solely on whether the trait failed to perform its *Selected Function*, as established by the LHA. If your LHA indicates that [TRAIT X] was historically selected for [ACTIVITY Z], not [ACTIVITY Y], then failure to perform [ACTIVITY Y] is not a covered event, regardless of its current utility or perceived importance. Coverage is for historical purpose, not current contribution.

  **Q4: My claim for [TRAIT] failure was denied because it "lacks a documented selection history." What does this mean?**
  Per our Underwriting Charter (Section 4.2b), coverage is contingent upon a trait possessing a demonstrable history of selection within your lineage. Denials under this clause typically occur for two reasons:
  1.  **Spandrel/Byproduct Status:** The trait is identified as a non-selected architectural consequence of other selected features (e.g., certain skeletal configurations, pigmentation patterns arising from metabolic processes). Without a direct selection history, no SF exists to insure.
  2.  **Insufficient Phylogenetic Depth:** Organisms lacking traceable ancestry (e.g., spontaneous generation events, insufficient fossil/population genetic records) cannot undergo a valid LHA. Without an LHA, we cannot establish an SF. We regret any inconvenience caused by your lack of documented evolutionary history.

  **Q5: Why am I paying premiums for coverage of a function that seems actively harmful to my survival now?**
  AUL insures the performance of the *Selected Function*, full stop. Natural selection does not guarantee current adaptive optimality or even benefit. If your LHA confirms that a trait's SF (e.g., excessive aggression for intrasexual competition in a now-social species, energy-intensive ornamentation attracting novel predators) was positively selected in your ancestors, we are contractually obligated to cover its failure to perform *that specific, historically selected activity*, regardless of its current detrimental effects. We cheerfully fulfill our obligations based on historical causation.

  **Q6: I've seen ads for "Current Contribution Coverage" (CCC) from a rival insurer. Why is their coverage broader and cheaper?**
  Adaptations Underwriting Ltd. employs the rigorous ESF standard. Some competitors utilize the less stringent "Causal Role Interpretation" (CRI), which defines a trait's function based on its *current* causal contribution to *any* system capacity, regardless of evolutionary history. While CRI-based policies may appear cheaper and cover a wider array of activities (e.g., potentially insuring your heart for its role in producing a pleasing thumping sound, or your liver for its contribution to body mass), this approach lacks the historical grounding and specificity of the ESF. Their broader definitions inherently carry higher systemic risk of covering non-essential or incidental effects. AUL believes the stability and historical fidelity of the ESF provide superior, more reliable long-term value. Beware of policies promising "function" coverage without rigorous phylogenetic underwriting.

  **Q7: Are there any common exclusions I should know about?**
  Yes. Key exclusions include:
  *   **Vestigial Function Failure:** Malfunction of traits whose SF is confirmed by LHA but which are vestigial in your current form (e.g., goosebump muscles failing to erect fur you no longer possess).
  *   **Novel Utilization (Exaptation):** Failure to perform a new, beneficial role not established as the SF in the LHA (e.g., wings failing for flight in a penguin lineage selected for swimming).
  *   **Environmental Mismatch:** Failure due solely to a trait performing its SF in an environment radically different from the ancestral environment where selection occurred.
  *   **Non-Selected Byproduct Failure:** Failure of incidental effects or spandrels (see Q4).

  **Q8: Why should I choose AUL over cheaper, more flexible options?**
  AUL offers unparalleled fidelity to the true, historically determined purpose of your biological traits. Our ESF-based policies provide certainty: you are insured for the function your lineage *actually evolved for*, not a shifting, context-dependent interpretation of current utility. In the complex world of biological performance, trust the gold standard: Adaptations Underwriting Ltd. – Insuring Deep History, Securing Selected Function.

  ---
  **Disclaimer:** All coverage subject to terms, conditions, and exclusions detailed in your Lineage History Assessment and Policy Schedule. Coverage based solely on Etiological Standard of Function. Past selection does not guarantee current performance or fitness. AUL is not liable for mismatches between historical function and present environmental demands. "Current Contribution Coverage" is a registered trademark of Causal Role Insurance Group.
