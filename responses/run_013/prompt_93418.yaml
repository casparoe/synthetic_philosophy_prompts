answer: |-
  ### The Case
  On 3 July 1940, Britain attacked the French fleet at Mers-el-Kébir, Algeria, weeks after France’s armistice with Germany. Fearing French warships would fall under Axis control, Churchill’s War Cabinet issued an ultimatum: join Britain, sail to neutral territory, scuttle, or be destroyed. French Admiral Gensoul refused (historical disputes over communication nuances exist but don’t alter the core dilemma). Force H, under Admiral Somerville, sank one battleship, crippled others, and killed 1,297 French sailors. The moral stakes: Britain betrayed an ally, committing lethal violence against former comrades to signal unwavering resolve, prioritizing geopolitical necessity over loyalty and non-aggression.

  ### Fitting the Theory
  Dirty hands captures core elements: Churchill chose a morally repugnant act (killing allies) for a supreme political good (preserving Britain’s ability to fight fascism). The "remainder" – persistent moral guilt despite justification – applies: the dead sailors and betrayal haunt the decision. However, the standard *instrumental* model struggles. Typically, the wrong act (e.g., torture) is a *means* to a separate, valuable end (e.g., saving lives). At Mers-el-Kébir, the violence wasn’t primarily a means to *physically* neutralize the fleet (scuttling or internment were offered alternatives). The killing *constituted* the demonstration of ruthlessness itself; the act *was* the message. Destroying the fleet wasn’t just instrumental to showing resolve; the destruction *performed* the resolve. This "constitutive ruthlessness" blurs the means/end distinction. Dirty hands theory grips the necessity, justification, and remainder, but slides off the unique nature of the wrong: the violence wasn't merely a tool for a future good; its very commission *was* the immediate, necessary political product.

  ### The Ledger
  The primary moral remainder is owed **to the victims** – the French sailors killed in an act of betrayal. Their deaths constitute an unabsolved wrong, regardless of justification. **Somerville and his crews** bear a distinct, personal remainder: anguish from killing former allies, a burden evident in Somerville’s distress. This challenges the "role-only" guilt idea; agents enacting state violence often experience profound personal moral residue. **Churchill and the Cabinet** carry the political and strategic remainder – the stain of ordering betrayal and mass killing for the state’s survival. This burden is inherent to their *office*, yet they experienced it personally (Churchill called it a "hateful decision"). The "office" itself doesn't *hold* the remainder; it’s the *context* that necessitates the act and distributes the burden. Somerville’s personal anguish isn't a category error; it highlights that roles don't fully insulate individuals from the moral gravity of their actions, even when justified by duty. The remainder is distributed: victims are owed justice; agents bear trauma; leaders carry the stain of command.

  ### Reverse Gear
  Mers-el-Kébir embarrasses standard dirty hands theory by exposing its over-reliance on instrumentalism. It reveals a category the theory often overlooks: actions where the moral wrong (lethal betrayal/violence) is not just a *means* to a good end, but the *performance* that directly *constitutes* the essential political good (demonstrating resolve). The theory struggles to cleanly parse this constitutive aspect, risking reducing the violence to merely instrumental (preventing fleet capture) when its core political function was expressive and immediate. The case confirms dirty hands' core insight – necessary political action leaves moral residue – but challenges its framework by showing that the "dirt" can arise not just from using evil means *towards* an end, but from an act whose evil *embodies* the end itself. It exposes the theory’s insufficient vocabulary for non-instrumental political violence.

  ### Bottom Line
  Mers-el-Kébir is dirty hands: a necessary political act involving profound moral wrong (betrayal, killing allies) that leaves a persistent, unjustified "remainder," despite being justified by the existential threat. However, its "constitutive ruthlessness" – where the violence *was* the essential demonstration of resolve, not just a means to an end – stretches the standard instrumental model, revealing a limitation in how dirty hands theory conceptualizes the relationship between the wrong and the political good. The dirt remains, but its nature is distinct.
