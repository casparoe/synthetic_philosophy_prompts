answer: |-
  Your challenges are sharp, but let's dismantle them. Start with your threshold model: even if valuation involves competing processes with abrupt transitions and hysteresis—stipulating that for argument—this merely describes *how* preference reversals occur mechanically, not *what* they are. The "endorsed-plan process" is still just a valuation subsystem generating rankings based on projected outcomes; its activation threshold isn't a "strength of will" parameter but a feature of cognitive architecture, like a thermostat's hysteresis band stabilizing state-changes. When the near-reward signal crosses threshold, it dominates output—that's all. Calling this threshold "weakness" is metaphorical relabeling of what remains a conflict between contemporaneous preference-rankings, not a failure of some non-preferential faculty. R's feeling that the urge "wasn't theirs" reflects alienation from the transient state that won, not discovery of a hijacked will. Now, the reproach asymmetry: it tracks not some enduring "will" but the *meta-preference* embedded in R's *later* valuation system. When R laments Tuesday's drink but not past music tastes, it's because R's Wednesday system *currently* ranks adherence to the plan higher than musical consistency, and projects that ranking backward as a standard. The "endorsement" you mention is just this meta-preference being active at multiple times—but it's still a preference-output, not a distinct state. R's "not knowing why" isn't systematically false; it accurately reports no *access* to the threshold mechanics that flipped the ranking, and the alienation stems from the winning preference being contextually isolated (e.g., craving doesn't integrate with broader goals). Blame is indeed a social tool—pressing agents to align near-rankings with their typical meta-rankings—not an indictment of metaphysical failure. The machinery is all preference-dynamics; adding complexity doesn't invent a will.

  \state{Preference rankings exhaust agency; no will-faculty exists}{MINOR}
