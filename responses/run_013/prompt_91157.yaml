answer: |-
  Your ledger reveals a sophisticated ethical intuition that depends on **Reliance, Symbolic Cooperation, and Vulnerability**. No single principle suffices, but three interlocking principles cover your cases without overcomplication. Here's the framework, with clauses forced by your hardest cases:

  ### The Principles
  1.  **Reliance & Harm Prevention:** *Follow conventions where your breach would directly harm specific individuals who reasonably relied on the convention for their material well-being or essential expectations.*
      *   **Forced by:** The resort town tipping paradox. Locals don't tip, but seasonal staff *rely* on tourist tips for livelihood. Breach (not tipping) directly harms them. This overrides the local "no tip" convention because of vulnerability and reliance.
      *   **Also covers:** Sit-down restaurants (server relies on tips for wages), possibly the elderly parent in the shoes case (reliance on respect/comfort in their home). *Struggles with scrupulous-city jaywalking (no direct harm).*

  2.  **Symbolic Cooperation (Fairness & Respect):** *Follow conventions where your breach, even if harmless in isolation, would reasonably be interpreted as rejecting a fundamental social agreement necessary for smooth coordination or expressing disrespect for the community.*
      *   **Forced by:** Scrupulous-city jaywalking. Breach signals disregard for a shared rule maintaining order/respect, even at 2 AM. It undermines the cooperative fabric ("deciding the rule is for them and not for me").
      *   **Also covers:** Queue-jumping a long line (violates fairness in turn-taking), escalator blocking in a walking city (disrupts coordination system), shoes where hosts expect it (respect for home/comfort), scrupulous jaywalking. *Struggles with counter-service tipping (no fundamental agreement).*

  3.  **Vulnerability & Power:** *Give significant weight to the expectations and well-being of vulnerable parties or those with significantly less power in the interaction, even if conventions are ambiguous.*
      *   **Forced by:** The elderly parent in the shoes case. Their quiet expectation creates an obligation despite the host's dismissal. Also forces the nephew jaywalking case – his vulnerability (learning norms) overrides the usual permissibility.
      *   **Also covers:** Resort town staff (economically vulnerable), sit-down servers (reliant on tips), nephew jaywalking. *Struggles with counter-service tipping (staff not in a position of special vulnerability/power imbalance vis-a-vis customer).*

  ### Applying the Principles to Your Cases

  *   **Tipping:**
      *   Sit-down restaurant: **Follow** (Principle 1: Server relies for wages).
      *   Counter-service café: **Don't follow** default tip (No 1 - No reliance for wages; No 2 - No fundamental agreement/coordination need; No 3 - No special vulnerability).
      *   Salaried country: **Don't tip** (Principle 2: Tipping breaches symbolic cooperation, signals disrespect/pity).
      *   Resort town: **Tip** (Principle 1: Staff rely despite local convention; Principle 3: Staff vulnerable).
  *   **Queueing:**
      *   Joining friend in line of two: **Fine** (No 1/2/3: Minimal/no harm, no coordination breakdown, no unfairness).
      *   Slipping into long line: **Not fine** (Principle 2: Violates fairness/cooperative agreement of turn-taking).
  *   **Escalators:**
      *   Stand-left in walking city: **Mildly wrong** (Principle 2: Disrupts coordination system, shows disregard).
      *   Stand-left in non-walking city: **Fine** (No Principle 2 breach - no coordination system exists).
  *   **Jaywalking:**
      *   Empty street, casual city: **Fine** (No 1/2/3: No harm, part of local coordination, no vulnerability).
      *   Empty street, scrupulous city: **Not fine** (Principle 2: Undermines shared agreement/signals disrespect).
      *   With nephew: **Not fine** anywhere (Principle 3: Vulnerability - he's learning norms, breach teaches disregard).
  *   **Shoes:**
      *   Expected & guests do it: **Remove** (Principle 2: Respect for home/cooperative norm).
      *   Hosts insist keep on: **Keep on** (No 1/2/3: Hosts set expectation, no reliance, no vulnerability).
      *   Hosts wave through, elderly parent expects: **Remove** (Principle 3: Vulnerability/expectation of elderly parent).
  *   **Bribe ("Limit"):** **Don't pay** (Principles 1 & 3 fail: Clerk relies/harmed, but Principle 2 dominates: Participating undermines the fundamental social agreement of impartial institutions and perpetuates systemic harm/corruption. This is a *corrosive* convention, not a benign one).

  ### Verdicts on Unlisted Cases & Subgroups

  1.  **Arbitrary but Near-Universal Conventions (e.g., driving on left/right):** **Follow.** Principle 2 (Symbolic Cooperation) dominates - breach causes tangible harm/chaos by disrupting essential coordination.
  2.  **Subgroup Conventions (e.g., religious head covering in a community you're visiting):**
      *   If your presence is transient/outsider and no reliance/vulnerability: **No obligation** (Like counter-service tip - no fundamental agreement *with you*). Observance might be courteous.
      *   If you are interacting meaningfully *within* that subgroup context (e.g., attending a service, being a guest in a home), or vulnerability is involved: **Follow.** Principle 2 (respecting their cooperative agreement) and potentially Principle 3 (showing respect to the group) apply. (e.g., removing shoes in a home where it's practiced falls here).

  ### Surrender Recommendations

  Your framework is powerful, but two intuitions conflict with the cleanest application of these principles:

  1.  **Scrupulous-City Jaywalking (Harmless Breach):** Your intuition that it's wrong is upheld by Principle 2 (Symbolic Cooperation). *Don't surrender this.* The "cost" is social, not material – undermining trust in shared rules.
  2.  **The Bribe/Clerk Payment:** Your intuition ("don't pay") is correct, but your reliance principle *seemed* to suggest paying (clerk relies, harmed by refusal). **Surrender the idea that reliance *always* creates obligation.** Principle 2 (Symbolic Cooperation) reveals why this "convention" lacks moral force: it actively corrodes just institutions. This case forces the distinction between benign conventions and corrupt practices. Reliance within a corrupt system does not create a moral obligation to participate.

  **The Core Insight:** Your obligation stems from **preventing tangible harm to reliant individuals, maintaining the cooperative glue of society through shared signals of respect, and protecting the vulnerable.** When these conflict (e.g., resort town), Vulnerability/Reliance (P1 & P3) usually outweighs pure local convention (P2), unless the convention protects against systemic harm (like not paying bribes). This framework should provide clear guidance for new cases involving social norms.
