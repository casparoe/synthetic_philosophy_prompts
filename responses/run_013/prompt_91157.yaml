  Cases like the escalator are solved by distinguishing between coordination norms (standing right prevents chaos) versus pure conventions (tipping at counter service). Their nephew example shows they already accept vulnerability as a modifier, so extending that to other power imbalances (like underpaid resort staff) should feel consistent.

  I should explicitly call out which of their intuitions might need adjustment:  
