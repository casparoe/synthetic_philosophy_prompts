  First, I need to map the cousin's known stances. She opposes CO2 narcosis and eyestalk ablation but accepts electrical stunning for salmon and ice slurry for trout. Her crab stance is confusing—prefers boiling over poor tank conditions, which seems inconsistent. 

  For the shrimp farm, the spawning method avoids ablation, which she hates, so that's a plus. But the harvest uses cold water, which might not ensure unconsciousness. The cousin accepts ice slurry for trout, but the user mentions that shrimp might just be immobilized, not unconscious. The farm can't afford the electrical rig. 

  Key question: Does the cousin prioritize eliminating active cruelty (like ablation) over uncertainty in stunning? Her crab comment suggests welfare over time (bare tank) might trump a quick bad death (boiling). So for shrimp, avoiding ablation might outweigh the cold harvest uncertainty. 

  But the harvest method is a problem. She might require a proven stunning method. Since electrical is available but costly, she might insist on it or conditionally pass with a timeline to upgrade. 

  Confidence level: Medium-high on conditional pass. Least sure about how strict she is on stunning certainty versus cost. To clarify, ask her about a hypothetical where a farm avoids ablation but uses an unproven stunning method—would cost be an acceptable excuse?
answer: |-
  Based on your cousin's track record and principles, here's a breakdown of how she'd likely evaluate your hypothetical shrimp farm, the rules inferred, predictions, and how to test them:

  **Inferred Welfare Rules from Her Track Record:**
  1.  **Rule 1: Ban Active Mutilation:** Prohibit procedures causing deliberate, non-therapeutic trauma with alternatives available (e.g., eyestalk ablation).
  2.  **Rule 2: Ban Ineffective Stunning:** Prohibit stunning/killing methods where animals exhibit clear, prolonged signs of distress/pain *and* a proven effective alternative exists (e.g., CO2 narcosis in salmon vs. electrical stunning).
  3.  **Rule 3: Accept Effective & Rapid Stunning:** Accept methods inducing rapid unconsciousness with minimal signs of distress (e.g., electrical stunning for salmon/crabs, ice slurry for trout - *assuming unconsciousness is achieved quickly*).
  4.  **Rule 4: Accept Chilling as Pre-Stun/Stun Only if Proven Effective:** Accept chilling as a stunning/killing method *only* if there's strong evidence it induces rapid unconsciousness *before* significant suffering occurs (e.g., her acceptance of ice slurry for trout implies she believes this evidence exists for them).
  5.  **Rule 5: Prioritize Chronic Welfare over Acute Suffering in Trade-offs:** When forced to choose, minimize prolonged suffering (poor living conditions) over intense but brief suffering during slaughter (e.g., boiled crab vs. crab in bare tank for a year). *This is the "outlier" rule.*

  **Predictions for Your Shrimp Farm:**

  | **Farm Practice**          | **Rule 1 Prediction** | **Rule 2 Prediction** | **Rule 3 Prediction** | **Rule 4 Prediction** | **Rule 5 Prediction** |
  |-----------------------------|------------------------|------------------------|------------------------|------------------------|------------------------|
  | **Spawning (Temp/Salinity Crash)** | ✅ **PASS** (Avoids ablation) | ✅ **PASS** (Not a stunning method) | ✅ **PASS** (Not a stunning method) | ✅ **PASS** (Not a stunning method) | ✅ **PASS** (Avoids ablation, chronic mutilation) |
  | **Harvest (Cold Water Immersion)** | ✅ **PASS** (No mutilation) | ⚠️ **FAIL?** (Distress uncertain, alternative exists) | ⚠️ **FAIL?** (Effectiveness unproven) | ⚠️ **FAIL?** (Lacks evidence of rapid unconsciousness) | ✅ **PASS** (Avoids ablation, likely better than bare tanks) |
  | **Overall Farm Assessment** | ✅ **PASS** | ⚠️ **FAIL** (Harvest method) | ⚠️ **FAIL** (Harvest method) | ⚠️ **FAIL** (Harvest method) | ✅ **PASS** |

  **My Bet & Confidence:**

  *   **Bet:** Your cousin would **PASS the farm overall BUT issue a MAJOR CONDITION requiring implementation of electrical stunning (or another proven method) within a defined timeframe (e.g., 12-24 months)**.
  *   **Confidence Level:** **High (80%)**. This balances her clear principles:
      *   **Strong PASS on Spawning:** Eliminating eyestalk ablation is a *massive win* aligning perfectly with Rule 1. She explicitly stated she'd fail farms for ablation. This is a significant welfare improvement she would strongly reward.
      *   **Major Concern on Harvest:** The uncertainty around cold water immersion for shrimp directly violates the core principles of Rules 2, 3, and especially 4. Her acceptance of trout ice slurry implies she *believes* it works for them. The scheme contact's statement ("nobody actually knows") would ring huge alarm bells for her. The existence of a proven alternative (electrical stunning), even if costly, makes the cold water method look like an unacceptable risk of suffering, fitting Rule 2.
  *   **Least Confident Part:** **Her tolerance for the cost argument.** Would she accept "can't afford it" as a valid reason *indefinitely*? Her crab comment (Rule 5) suggests chronic issues (like bare tanks) are worse than acute slaughter suffering. Avoiding ablation improves chronic welfare significantly. She *might* grant more time for financial implementation than I expect, but I doubt she'd accept the cold water method permanently given the uncertainty and alternative's existence. The condition to implement electrical stunning is the critical point.

  **The Crucial Test Case to Ask Her (Splitting the Rules):**

  > **"Imagine a shrimp farm that has completely eliminated eyestalk ablation using a non-surgical method like temp/salinity crash. However, for harvest, they use cold water immersion instead of electrical stunning. They argue that scientific proof of shrimp consciousness/unconsciousness in cold water is ambiguous, and the electrical unit is prohibitively expensive, threatening their viability. Should they:**
  > **A) Pass unconditionally? (Prioritizes Rule 1 & maybe 5, disregards 2/3/4)**
  > **B) Pass with a condition to implement electrical stunning within X years? (Balances Rules 1 & 2/3/4)**
  > **C) Fail solely because of the harvest method? (Prioritizes Rules 2/3/4 over Rule 1)**
  > **D) Fail unless they can provide definitive proof the cold water induces instant unconsciousness? (Strict Rule 4)"**

  **Why this test case works:**
  1.  **Splits Rule 1 vs. Rules 2/3/4:** Does eliminating ablation (Rule 1 win) automatically outweigh serious concerns about the slaughter method (Rule 2/3/4 fail)?
  2.  **Tests Rule 5 in Context:** Does avoiding ablation (improving chronic welfare) justify potential acute slaughter suffering uncertainty, analogous to boiled crab vs. bare tank?
  3.  **Probes Cost Tolerance:** How much weight does she give the farm's financial argument against implementing a known better method?
  4.  **Clarifies Burden of Proof:** Who bears the burden – the farm to prove the cold water works, or the certifier to prove it doesn't? (Rule 4).

  Her answer to this specific scenario will reveal whether her opposition to ablation is so absolute it overrides other concerns (leaning towards A), if she demands proven humane slaughter regardless of cost (C/D), or if she seeks a pragmatic balance with a mandated upgrade path (B – my bet). It directly addresses the conflict inherent in your farm's practices relative to her known values. Good luck at the next dinner!
