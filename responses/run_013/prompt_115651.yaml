  - Leaf I: "Tie-Breaking Rule Required" (unnamed)
    - Awkward commitment: If no rule was adopted, the agent may be stuck.
    - In case b: if she had no rule, she might not be allowed to choose arbitrarily.

  - Leaf J: "Arbitrary Choice Permitted" (unnamed)
    - Awkward commitment: Arbitrary choice is always allowed, even in moral and institutional settings.
    - In all cases: she may just pick without any procedure.

