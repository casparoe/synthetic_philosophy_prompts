  ### Decision Tree: Practical Reason in Cases of Tied Options  
  **Starting Commitment**: An agent faces two or more options and, on the best account she can give, has no reason to prefer any of them. The tie may arise from equal value, equally strong reasons, incomparability, parity, or motivational indifference.  

  ---

  #### **Decision Tree**  
  1. **Empirical**: In Buridan’s ass (case a: donkey equidistant between identical bales), can the donkey choose one bale?  
     - **Yes** → Q2  
     - **No** → Q3  

  2. **Normative**: In the job offers case (b: two equally liked cities, deadline Friday), may the agent choose arbitrarily (e.g., coin toss)?  
     - **Yes** → Q4  
     - **No** → Q5  

  3. **Normative**: In the job offers case (b), if the agent cannot choose, is missing the deadline excusable?  
     - **Yes** → Leaf A  
     - **No** → Leaf B  

  4. **Normative**: In the hospital case (d: pharmacy must stock one of two identical drugs, setting a practice), may the agent choose arbitrarily?  
     - **Yes** → Q6  
     - **No** → Leaf C  

  5. **Normative**: In the job offers case (b) with a deadline, is arbitrary choice excusable as a last resort?  
     - **Yes** → Leaf D  
     - **No** → Leaf E  

  6. **Normative**: In the drowning case (c: two strangers equidistant, save one), may the agent choose arbitrarily?  
     - **Yes** → Q7  
     - **No** → Leaf F  

  7. **Normative**: In the promise case (f: casually promised one option before the tie), does the promise break the tie?  
     - **Yes** → Leaf G  
     - **No** → Q8  

  8. **Normative**: In the value-settled-by-choice case (e: worth known only after choice), can choosing make the option better?  
     - **Yes** → Leaf H  
     - **No** → Q9  

  9. **Normative**: Must the agent use a tie-breaking rule adopted in advance (e.g., coin toss)?  
     - **Yes** → Leaf I  
     - **No** → Leaf J  

  ---

  #### **Leaves (Positions)**  
  - **Leaf A (Inaction Excusable)**: Unnamed.  
    - *Awkward commitment*: Inaction is excusable even when outcomes are dire (e.g., starvation).  
    - *Case*: Buridan’s ass (a) dies but is excused; job case (b) misses deadline excusably.  
  - **Leaf B (Inaction Inexcusable)**: Unnamed.  
    - *Awkward commitment*: Inaction is irrational even when reasons are absent.  
    - *Case*: Buridan’s ass (a) dies irrationally; job case (b) misses deadline inexcusably.  
  - **Leaf C (Institutional Arbitrariness Forbidden)**: Unnamed.  
    - *Awkward commitment*: Personal arbitrary choice is allowed, but institutional is not.  
    - *Case*: Hospital case (d) requires non-arbitrary procedure (e.g., committee).  
  - **Leaf D (Duress Excuses Arbitrariness)**: Unnamed.  
    - *Awkward commitment*: Non-duress ties (e.g., Buridan) forbid arbitrary choice, risking inaction.  
    - *Case*: Job case (b) allows coin toss only due to deadline duress.  
  - **Leaf E (Arbitrary Choice Prohibited)**: Unnamed.  
    - *Awkward commitment*: Agents must reject options entirely if no non-arbitrary choice exists.  
    - *Case*: Job case (b) requires missing deadline; drowning case (c) forbids saving either.  
  - **Leaf F (Moral Arbitrariness Forbidden)**: Unnamed.  
    - *Awkward commitment*: Agents must act in moral ties but cannot use arbitrary methods.  
    - *Case*: Drowning case (c) requires saving one non-arbitrarily (e.g., proximity), yet no such reason exists.  
  - **Leaf G (Promises Break Ties)**: Unnamed.  
    - *Awkward commitment*: Trivial promises override objective ties.  
    - *Case*: Promise case (f) requires choosing the promised option.  
  - **Leaf H (Choice Creates Value)**: Unnamed.  
    - *Awkward commitment*: Choice retroactively justifies itself, risking circularity.  
    - *Case*: Value-settled case (e) makes the chosen option better post-choice.  
  - **Leaf I (Tie-Breaking Rule Required)**: Unnamed.  
    - *Awkward commitment*: Without a pre-adopted rule, agents may be unable to choose.  
    - *Case*: Job case (b) requires coin toss if rule adopted; else, no choice allowed.  
  - **Leaf J (Arbitrary Choice Permitted)**: Unnamed.  
    - *Awkward commitment*: Arbitrariness is always permissible, even in moral/institutional cases.  
    - *Case*: All cases (a–f) allow any arbitrary method (e.g., coin toss or whim).  

  ---

  #### **Post-Tree Analysis**  
  1. **Unoccupied Answer-Combinations**  
     - **"No at Q1, Yes at Q3"**: Inaction is possible and excusable, but if agents *can* choose without reason (Q1: Yes), this is redundant. *Diagnosis*: Incoherent (contradicts Q1’s empirical claim).  
     - **"Yes at Q2, No at Q4, Yes at Q5"**: Arbitrary choice forbidden in personal cases but excused under duress, yet allowed in institutional (Q4: No skips institutional). *Diagnosis*: Unexplored (no literature positions match).  
     - **"Yes at Q6, No at Q7, Yes at Q8"**: Moral arbitrary choice allowed, promises irrelevant, but choice creates value. *Diagnosis*: Unattractive (ignores promises without justification).  

  2. **Indistinguishable Leaf Pairs**  
     - **Leaf C vs. Leaf F**: Both forbid arbitrariness in specific contexts (institutional/moral), but the tree cannot separate contexts without a case like (f) (promise). *Further case*: A moral institutional tie (e.g., allocating a scarce drug) shows if arbitrariness is forbidden for moral or structural reasons.  
     - **Leaf D vs. Leaf J**: Both permit arbitrary choice in job case (b) under duress, but Leaf J allows it universally. *Further case*: Buridan’s ass (a) without duress separates them (Leaf D forbids choice; Leaf J allows).  
     - **Leaf G vs. Leaf I**: Both require following a pre-existing tie-breaker (promise/rule), but the tree cannot distinguish sources. *Further case*: A promise conflicting with a pre-adopted rule (e.g., promised option A but rule says flip coin) tests priority.  

  3. **Tree Weaknesses**  
     - **Misfires**:  
       - Fails to directly distinguish motivational indifference (e.g., an agent who "doesn’t care" in job case (b)) from reason-based ties. *Likely error*: Misclassifying indifference as a normative tie.  
       - Poorly handles parity cases (options comparable but neither better nor equal): Assumes all ties are resolvable via Q4–Q9, but parity might require unique treatment (e.g., no arbitrariness allowed).  
     - **Critical Nodes**:  
       - **Q1 (empirical)**: Does real work by anchoring the tree in agency feasibility (prevents "cannot choose" positions from dominating).  
       - **Q6 (normative)**: Key for moral/intrinsic ties (drowning case (c)), forcing a split between moral and non-moral contexts.  
       - **Q8 (normative)**: Essential for value ontology (case e), separating constructivist views.  
     - **Decorations**:  
       - **Q7 (promise)**: Distinction is cosmetic; positions like Leaf G reduce to "tie-breakers exist" (covered in Q9).  
       - **Q4 (institutional)**: Underused; most institutional positions collapse into Leaf C or Leaf J without nuance.  

