     However, we might find that some combinations are unattractive or unexplored. For instance, the position that in personal ties arbitrary choice is allowed but in moral ties it is not (Leaf F) might be held by someone, but what about the reverse? We don't have a leaf that says arbitrary choice is allowed in moral ties but not in personal. That combination is not in the tree because we didn't ask the questions in that order. Specifically, we only asked about moral ties after allowing personal and institutional. So the path: Node 1: Yes, Node 2: Yes, Node 4: Yes (hospital allowed), Node 6: No (drowning not allowed) -> Leaf F. The reverse would require a different order of questions.

