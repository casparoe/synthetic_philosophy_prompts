prompt: |-
  In a departmental seminar on practical rationality, two colleagues of mine, Mira and Jonah, fell into a disagreement about a variant of Parfit’s hitchhiker. The variant is this: you are stranded in a desert; a driver offers you a lift to safety only if she judges that you have a settled disposition to pay her afterwards. She is a good but imperfect judge of character: most, but not all, travellers she picks up with that disposition do pay. There is no external enforcement, no repeat interaction, and no reputational mechanism beyond this encounter. Once you are safe, paying would cost you a significant sum and bring you no further benefit. You cannot communicate an enforceable promise; the driver relies on your character.

  Mira argues: (1) If you genuinely have the disposition, then paying is the rational thing to do, because the disposition is not a mere prediction but a commitment; to act otherwise would be to betray the very trait that got you the lift. (2) If you can decide at the end not to pay, then you never really had the disposition, and the driver was simply mistaken about you. (3) The driver’s reliance is reasonable only if travellers like you generally pay; the rationality of your paying is therefore partly a matter of sustaining a practice, not just of your isolated payoff.

  Jonah replies: (1) The disposition is a causal mechanism that secured the lift; once the lift is secured, it has done its work, and the reasons to pay have not survived the change in circumstances. (2) Calling it a commitment does not create a reason where none existed; commitments are just intentions, and intentions can be rationally revised when the reasons that supported them lapse. (3) The driver’s reliance is a gamble on a statistical regularity; if she is sometimes mistaken, that is her risk, not a reason for you to sacrifice your interests. (4) If you pay only because you cannot bring yourself to do otherwise, that is compulsion, not rationality; if you can bring yourself not to pay, then the driver’s trust was misplaced, and the rational course is to take the lift and keep your money.

  Mira responds: (1) That picture makes rationality parasitic on whatever desires you happen to have at the moment of action, and so cannot explain why anyone should cultivate a disposition to keep faith in the first place. (2) If the driver knows that travellers of your type will reason as Jonah does, she will stop offering lifts, and the practice collapses; the fact that Jonah’s reasoning is self-undermining when universalised is a reason to reject it. (3) The imperfect reliability of the driver’s judgement does not make it irrational to be the kind of person she can trust; it only means that trust is risky.

  Jonah responds: (1) The practice may collapse if everyone reasons as I do, but that is a fact about the practice, not about the rationality of my act. (2) You are smuggling in a moral requirement—keep faith—under the guise of rational self-interest. (3) If you want to pay for moral reasons, fine, but then say so; do not pretend that self-interest requires it.

  They have asked me to adjudicate. Please go through the exchange move by move, saying who is right about each point and why, and then say what both of them are missing about the relationship between rational irrationality, precommitment, and the difference between a one-shot encounter and a practice. Please answer in British English.
reasoning: |-
  Hmm, this is a fascinating philosophical debate about practical rationality in a variant of Parfit's hitchhiker scenario. Let me unpack this carefully.

  The core disagreement between Mira and Jonah revolves around whether paying after receiving the ride is rationally required. Mira takes a commitment-based view where dispositions create binding reasons, while Jonah sees it as purely instrumental - once the benefit is secured, the disposition has served its purpose.

  Looking at Mira's first argument: she makes a strong case that having a genuine disposition requires consistent action, otherwise it's not a real disposition. There's something compelling about this - if you could easily abandon the disposition when convenient, it wasn't truly part of your character. Her point about sustaining social practices also seems important; if everyone acted like Jonah, such trust-based systems would collapse.

  Jonah's counter about commitments being revisable intentions hits at a key tension. He's right that from a strict self-interest perspective, paying brings no benefit after the ride. But his dismissal of "commitment" as mere compulsion feels too reductive - surely there's more to character than involuntary reflexes.

  When Mira highlights how Jonah's reasoning self-destructs if universalized, that's a powerful Kantian point. Practices relying on trust do require most participants to follow through consistently. Jonah's response that this is "just how practices work" seems to dodge the deeper rational inconsistency.

  Their moral vs self-interest framing is particularly sticky. Jonah correctly notes Mira smuggles in moral language, but Mira isn't wrong that cultivating trustworthy dispositions is rationally advantageous long-term. The missing piece seems to be how rational agents manage conflicting time-slices of themselves - the pre-committing self versus the acting self.

  Both overlook that in one-shot encounters, the rational choice might be defection, but maintaining the disposition requires acting against immediate interest. There's also Parfit's concept of "rational irrationality" - where it's rational to cultivate traits that sometimes compel irrational acts. The driver's imperfect judgment adds another layer: her gamble creates statistical pressure for travelers to maintain reliable dispositions, even if individuals might defect.

  This case beautifully exposes how rationality operates differently at individual versus systemic levels, and how self-binding commitments create new reasons that persist beyond their instrumental value. Neither has fully captured this dynamic tension in their arguments.
answer: |-
  ### Adjudication of the Debate  
  **Key to Judgement:**  
  - ✓ = Correct argument / Insightful point  
  - ✗ = Flawed argument / Missed nuance  
  - △ = Partially correct but incomplete  

  ---

  ### **Move-by-Move Analysis**  
  **1. Mira’s Opening Argument**  
     - *(1) "If you genuinely have the disposition, paying is rational because it’s a commitment"* → **✓**  
       *Why:* A "settled disposition" implies consistent action. Betraying it *after* securing the lift undermines the trait’s integrity. Rationality here includes identity-consistency, not just payoff maximisation.  
     - *(2) "If you decide not to pay, you never had the disposition"* → **△**  
       *Why:* Overly strict. Dispositions can be overridden (e.g., by selfish impulses), but this doesn’t mean they were never present—only that they weren’t robust. The driver’s imperfect judgment allows for such lapses.  
     - *(3) "Driver’s reliance requires travellers to generally pay; rationality sustains the practice"* → **✓**  
       *Why:* Correctly frames rationality as socially embedded. Practices collapse if universalised defection occurs (à la Kant’s universal law test).  

  **2. Jonah’s Reply**  
     - *(1) "The disposition’s work is done; reasons to pay lapse"* → **✗**  
       *Why:* Treats the disposition as purely instrumental. But if the driver selected you *for your character*, reneging retroactively invalidates her reason for helping.  
     - *(2) "Commitments are revisable intentions"* → **△**  
       *Why:* True for *mere* intentions, but a "settled disposition" implies deeper entrenchment (e.g., a trait, not a whim). Rational revision requires new reasons; convenience isn’t sufficient.  
     - *(3) "Driver’s reliance is her gamble, not your reason to sacrifice"* → **✗**  
       *Why:* Ignores reciprocity. Her trust conferred a benefit; exploiting it is a *failure of rational reciprocity*, even in one-shot interactions (cf. Gauthier’s constrained maximisation).  
     - *(4) "Paying is compulsion, not rationality"* → **✗**  
       *Why:* Conflates rationality with desire-satisfaction. Cultivating dispositions that *constrain* impulses (e.g., honesty) is often instrumentally rational for social cooperation.  

  **3. Mira’s Response**  
     - *(1) "Jonah’s view reduces rationality to fleeting desires"* → **✓**  
       *Why:* Spot-on. Jonah’s model cannot explain why agents should *cultivate* trustworthy dispositions ex ante.  
     - *(2) "Universalising Jonah’s reasoning collapses the practice"* → **✓**  
       *Why:* Powerful Kantian point. If all travellers defect, drivers stop offering lifts—making Jonah’s strategy self-defeating.  
     - *(3) "Imperfect reliability doesn’t make trust irrational"* → **✓**  
       *Why:* Correct. Risk doesn’t negate the rationality of trust; it merely requires statistical reliability.  

  **4. Jonah’s Final Response**  
     - *(1) "Practice collapse is about the practice, not my act"* → **✗**  
       *Why:* Shortsighted. Rationality must account for systemic effects if individual acts collectively destroy beneficial practices (the "tragedy of the commons").  
     - *(2) "Mira smuggles in morality"* → **△**  
       *Why:* Partially valid—Mira’s "commitment" language has moral overtones—but she grounds it in *enlightened* self-interest (sustaining practices).  
     - *(3) "Call it morality, not self-interest"* → **✗**  
       *Why:* False dichotomy. Acting to maintain a trustworthy reputation *is* self-interested where future opportunities depend on it (even if indirect).  

  ---

  ### **What Both Miss: Core Philosophical Nuances**  
  **1. Rational Irrationality (Parfit’s Insight):**  
     - Jonah overlooks that it can be *rational to be irrational*. Cultivating a disposition that compels you to "irrationally" pay (e.g., due to integrity) is strategically wise *ex ante*. It lets you access gains (the lift) that pure opportunists cannot.  
     - Mira underplays that the driver’s imperfect judgment creates "wiggle room"—some may defect without collapsing the practice, so paying isn’t *strictly* necessary for rationality.  

  **2. Precommitment vs. Disposition:**  
     - Jonah reduces commitment to "intentions," ignoring **self-binding** (Elster). A disposition is a precommitment device: by becoming the *type* who pays, you bind your future self to act against transient interests.  
     - Mira needs to clarify that a "settled disposition" must be *robust*—resistant to temptation—or it fails as a precommitment.  

  **3. One-Shot Encounter vs. Practice:**  
     - **Jonah** wrongly treats this as *purely* one-shot. But the driver relies on a **practice** sustained by aggregate compliance. Your act contributes to (or undermines) that practice’s viability.  
     - **Mira** must concede that in *strictly* one-off cases (no reputational spillovers), defection *is* payoff-maximising. But here, the driver’s continued help *to others* depends on travellers generally paying—your act has systemic weight.  

  ---

  ### **Verdict**  
  - **Mira is more correct overall.** She grasps that rationality extends beyond immediate payoffs to identity, reciprocity, and practice-sustenance. Her arguments align with Parfit’s view that "rational" agents cultivate traits enabling cooperation.  
  - **Jonah’s narrow instrumentalism** fails to explain why anyone would develop trustworthy dispositions ex ante. His view, if universalised, makes the mutually beneficial practice impossible.  
  - **Critical Oversight:** Both neglect that the driver’s *imperfect* judgment alters incentives. If she misjudges 20% of travellers, defectors might "free-ride" without collapsing the system—but rational agents still benefit from *generally* maintaining the disposition, as it secures future opportunities in similar scenarios.  

  **Final Note:** The debate conflates *moral* and *self-interested* rationality. Jonah is right that Mira’s "commitment" has moral resonance, but she correctly shows that even self-interested agents—seeking long-term gains from social practices—should act as if moral. As Hume observed, rationality in social contexts *requires* conventions that resemble virtue.
