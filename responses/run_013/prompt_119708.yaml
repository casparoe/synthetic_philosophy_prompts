  **Key advice**: Double down on jurisdiction/renegotiation—they’re your strongest innovations. The threshold worry is fixable by making role collapse about the *internal coherence of the role* (not consequences). Cut vague "suicide pact" language; replace with a principled account of when a role’s authority dissolves.
