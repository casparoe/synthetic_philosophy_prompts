prompt: |-
  ok so for my environmental ethics essay i need to get the groundwork straight before i read any more hot takes. everybody says habitat destruction is bad for wildlife, but i cant tell if its bad *for the animals* (like, more suffering overall) or just bad because theres fewer animals and some species are gone. what i want first is the spec: write me the list of things any theory of "the net welfare of an ecosystem" has to be able to do to count as a real theory.

  things i know it has to deal with: a rainforest hectare turned into cattle pasture (way fewer animals, but are the ones left better or worse off?); wiping out a predator so the prey explode and then starve (is that more death or less?); a fish that lays a million eggs where 999,999 die as babies vs a few big slow-breeding animals; invasive species; and the case where clearing land means a whole generation of animals never gets born at all -- is that a harm to anyone? my teachers example that broke my brain: a pond with 10 million bugs, most eaten as larvae, vs a field with 200 cows that all live fine. is one hectare "better"? by what unit? can a theory put bugs and cows on one scale without just assuming bugs count less?

  for each requirement tell me why its required and give the case that forces it. then flag the two or three requirements you think cant all be true together (i already suspect "just add up everyones welfare" fights with "a planet stuffed with a trillion barely-alive animals is better"). and which single requirement rules out the most of the easy answers, and which ones are actually just prejudice on my part?
