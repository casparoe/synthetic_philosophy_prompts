  Okay, the user is working on an environmental ethics essay and needs to clarify the groundwork before diving into existing debates. They're asking for a specification list for any theory that claims to measure the "net welfare of an ecosystem." They've provided specific scenarios they want the theory to handle, like habitat conversion, predator removal, invasive species, and the pond vs. cows dilemma. 

  Hmm, the user is clearly trying to avoid superficial takes and wants rigorous foundations. Their examples show they've already grappled with core tensions in welfare ethics—especially the conflict between total welfare (utilitarian) and average welfare, and how to weigh different species. The brain-breaking pond vs. cows question suggests they're suspicious of anthropocentric biases. 

  First, I need to unpack why their requested "spec" is so sharp. They're not just asking for pros/cons—they want the *necessary conditions* a theory must meet to even qualify as coherent. That’s meta. The cases they listed aren’t random; each exposes a different fracture point in welfare ethics. For instance:  
  - The cattle pasture scenario tests how theories handle radical population shifts.  
  - Wiping out predators probes whether suffering matters more than numbers.  
  - The fish example challenges how we value death-heavy life histories.  
  - The "never-born generation" case directly attacks the non-identity problem in ethics.  

  The user also hints at deeper worries: they suspect some requirements might be mutually exclusive (like total welfare vs. avoiding "suffering-packed" planets) and that some "easy answers" are just hidden prejudices. Smart. They’re likely frustrated by theories that quietly assume humans > bugs without justification.  

  For the response, I’ll structure it as a numbered spec list because they asked for clarity. Each requirement must:  
