  2. Explain *why* it’s non-negotiable (using their cases).  
  3. Flag conflicts—especially the total vs. average welfare clash, which breaks most naive utilitarianism. The pond vs. cows case will murder theories that can’t compare cross-species welfare fairly.  

  Biggest landmine: Requirement 7 (Non-Existence). If a theory says never being born can be a harm, it implies we have duties to potential beings—a wild conclusion. But if it says only existing beings matter, habitat destruction looks "neutral" since the unborn aren’t deprived. Can’t have both.  

  Also, Requirement 1 (Welfare Definition) is secretly the boss. Without defining what "welfare" even *is* (happiness? freedom from pain? flourishing?), everything else collapses. If I were grading essays, I’d fail any theory that skips this.  

  User’s self-awareness about prejudice is spot-on. Requirement 5 (Species Neutrality) exists precisely because we default to valuing cute animals more. But is neutrality even possible? If a theory weights all species equally, saving 10,000 beetles might outweigh saving one cow—which feels absurd to human brains. That tension can’t be solved, only managed.  

