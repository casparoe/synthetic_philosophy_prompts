  my freind and I just spent like four hours arguing about the Darwinian, Skinnerian, Popperian, Gregorian creatures thing from Dennett, and now I want to turn the fight into a short research proposal for a term paper — maybe 5,000 words, one semester, philosophy of mind / cognitive science. The arguement was this. He says the four labels are just a ladder of sophistication and that they collapse: every Popperian is also a Skinnerian under the hood, every Skinnerian is a Darwinian at the level of the genes, and the Gregorian stage is where Dennett quietly cheats, because the tools and words that are supposed to make the fourth kind special are themselves made and maintained by other Gregorian creatures, so the explanation goes in a circle. I think the labels are not about how smart the creature is but about where the selection and error-elimination happens: in the gene pool, in the individual's reinforcement history, in a simulated inner environment, or in an external scaffold that gets inherited culturally. The interesting question, if that's right, is whether the Gregorian kind can be defined without assuming a sharp line between the organism and its tools — e.g., is a person plus a notebook plus a language one creature, or a Skinnerian creature using a tool? And does the four-kind scheme survive if you treat that boundary as variable rather than fixed?

