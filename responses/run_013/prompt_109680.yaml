prompt: |-
  I'm a fourth-year PhD student in early modern history, and for the past year I've spent two days a week at a small political-risk firm. My dissertation is on the longevity of composite monarchies, which has led the firm to treat me as its house expert on historical base rates — flattering, and probably a mistake.

  The firm sells written assessments: about a dozen a month, each answering a client question of the form "what is the probability that X happens to polity Y within Z years" — a violent leadership transition, a constitutional rupture, a secession, a default that triggers one of the above. Each assessment goes out with a point probability and a stated range; my supervisor, a former intelligence analyst, signs off; clients allocate capital on the strength of these, so the difference between 15% and 40% is real money. Turnaround is three days, and the analyst who does most of the work has a history MA and one regression course.

  The wall I keep hitting is the reference class. Here is the draft I've been running, which I'd like you either to repair into something a junior analyst can run unsupervised or to tell me can't be repaired:

  1. Restate the client's question as a dated, resolvable proposition, and fix the outcome coding before looking at any cases.
  2. Code the target polity on a fixed set of dimensions (regime form, succession mechanism, revenue base, elite fragmentation, recent instability).
  3. Pull the subset of our in-house dataset — a few hundred hand-coded polity-spells, roughly half pre-1900 empires and half post-1945 states — that matches the target on as many dimensions as possible.
  4. Report the frequency of the outcome in that subset as the base rate.
  5. Widen the class, dropping dimensions in a fixed order, until n reaches thirty.
  6. Adjust the result by the inside view and report the adjusted figure with a range.

  The failure modes I've already noticed, in case they matter to your repair: the nearest class is often tiny; widening restores n but destroys similarity, and I can't tell whether the dimensions I'm dropping last are the ones that carry the causal weight; the historical half of the dataset includes entities held together by dynastic accident, and I don't know whether those are exchangeable with a modern rentier state or belong to a different class entirely; the chronicle record is itself selected on the outcome, since disruptions get written about and quiet centuries don't; and clients only ever ask about places already in the news, which I suspect makes our whole forecast record a biased sample. Finally, the client always wants a number, and sometimes the honest output seems to be that there is no forecast to give.

  What I want from you is a procedure, not a lecture on the reference class problem. Give me the questions in the order they should be asked, what counts as a sufficient answer at each step, where the procedure terminates in a refusal to forecast, and where it must hand the decision to a human because the question is one of values rather than facts — in particular, how much of the client's decision the firm is entitled to make on the client's behalf. Then run it on three cases: (a) a personalist monarchy in a rentier economy facing its first contested succession in fifty years, with no informative precedent; (b) a parliamentary democracy where a coup attempt recently failed and the outside view and the inside view point in opposite directions; and (c) a case whose nearest reference class has eleven members, seven of which are the same empire at seven different dates. At least one of those should come out as a refusal to forecast, and I expect to dislike which one.

  Mark explicitly which steps are judgment calls dressed up as arithmetic. And please push back rather than perform: if the honest conclusion is that base rates cannot do this work and the exercise mostly launders narrative judgment into the appearance of a number, say so plainly and tell me what the firm should do instead — including, if that's your view, that we should stop selling point probabilities.
reasoning: |-
  Okay, let me try to work through this user's problem. They're a PhD student in early modern history working part-time at a political-risk firm. Their main issue is with the reference class problem in generating probability assessments for clients. The current method has several failure modes: small nearest classes, loss of similarity when widening the class, uncertainty about causal weights, historical incomparability, selection bias in historical records, and selection bias in client questions.

  The user wants a practical procedure, not theoretical discussion. They need a step-by-step process that specifies when to refuse a forecast and where human judgment is required. They also want three test cases analyzed, with at least one resulting in refusal.

  First, I need to design a more robust procedure. The current approach relies too heavily on mechanical matching and widening of reference classes. Instead, I should incorporate explicit validity checks at each stage. When widening the class, it's crucial to maintain theoretical relevance rather than just increasing sample size. The procedure needs clear stopping rules for when to decline a forecast.

  For the judgment calls disguised as arithmetic, I should flag steps like variable weighting during class widening and inside-view adjustments. These are inherently subjective but presented as calculations. The firm might need to acknowledge these limitations transparently to clients.

  Considering alternative approaches: If base rates are fundamentally inadequate here, the firm could shift to scenario-based reporting with explicit probabilities for each scenario. Or they might provide qualitative risk categories instead of point probabilities. But the user specifically wants solutions within the current framework unless unavoidable.

  For the test cases: 
  - Case A (personalist monarchy) will likely hit a refusal point due to lack of comparable cases. 
  - Case B (parliamentary democracy with coup attempt) might proceed but require extreme caution due to contradictory signals. 
  - Case C (eleven similar cases from same empire) could be statistically usable but temporally biased - needing disclosure.

  The ethical dimension matters too. The firm is making capital-allocation decisions. The procedure must include explicit points where analysts decline forecasts rather than force numbers. Human oversight requirements should be clearly defined, especially when adjusting base rates with inside views.

  I'll structure the response with a clear step-by-step procedure, then apply it to the three test cases, being brutally honest about limitations. The key is balancing practical utility with methodological integrity.
answer: |-
  Here's a procedural fix designed for operational use, acknowledging inherent limitations. It forces explicit judgment calls, defines refusal points, and minimizes "laundering." **The core insight: Your current step 4 (report frequency as base rate) is the critical failure point. Base rates are starting points, not answers.**

  **Revised Procedure: "Base Rate Plus Bounds" (BRB)**

  1.  **Parse & Fix Proposition:** Restate the client's question as a dated, resolvable proposition (e.g., "Leader X of Country Y is removed by force before [Date]"). Define precise, observable criteria for the outcome *before* any data pull. *Sufficiency:* Clear, unambiguous definition. *Terminate if:* Proposition is fundamentally unresolvable or criteria cannot be objectively defined.

  2.  **Code Target:** Code the target polity on fixed dimensions (Regime Form, Succession Mech., Revenue Base, Elite Fragmentation, Recent Instability (binary: event in last 5/10 yrs?)). *Sufficiency:* Complete coding per protocol. *Terminate if:* Critical dimension data is completely unavailable/uninterpretable for target.

  3.  **Initial Pull:** Pull all polity-spells matching the target on *all* coded dimensions. *Sufficiency:* Pull executed. *Terminate if:* `n = 0`. **Refusal Point 1:** *No comparable cases exist within the strictest class.* Forecast declined.

  4.  **Assess Initial Class:**
      *   Report `n`.
      *   Report observed outcome frequency `p_initial`.
      *   **Explicit Judgment Call A:** Assess *theoretical similarity*. Are these cases truly comparable on causally relevant factors *beyond* the coded dimensions? (e.g., Is a 17th-century dynastic composite monarchy really like a modern rentier state? Is "elite fragmentation" coded the same way in both?). Use historical expertise here. *Sufficiency:* Qualitative judgment recorded. *Terminate if:* Judgment is "Fundamentally non-comparable". **Refusal Point 2:** *Cases exist but are judged non-exchangeable.* Forecast declined.

  5.  **Widen Class (Systematically):** If `n_initial < 30` OR if `p_initial` is deemed unstable due to small `n` OR if **JC A** flags mild concerns:
      *   Drop dimensions in pre-defined *causal priority order* (e.g., 1. Recent Instability, 2. Elite Fragmentation, 3. Revenue Base, 4. Succession Mech., 5. Regime Form - adjust this order based on outcome type & theory!). Drop one dimension at a time.
      *   After each drop: Report `n`, `p`, and **Explicit Judgment Call B:** *Relevance of Widened Class.* "By dropping [Dimension], we added [Number] cases, primarily of type [Description]. This likely makes the class [More/Less] relevant because [Reason]." *Sufficiency:* Widening stops when `n >= 30` OR when **JC B** concludes further widening destroys relevance OR all dimensions are dropped. *Terminate if:* **JC B** concludes "Relevance destroyed" *before* `n >= 30`. **Refusal Point 3:** *Widening destroys meaningful similarity before achieving stable n.* Forecast declined.

  6.  **Establish Base Rate & Range:** Use the final class from Step 5.
      *   Report `n_final`, `p_final` (base rate).
      *   Calculate a frequentist confidence interval (e.g., Clopper-Pearson 80%) around `p_final` -> `[p_low, p_high]`. This is your **empirical uncertainty range**. *Sufficiency:* Interval calculated. *Terminate if:* `n_final` is too small for a meaningful interval (e.g., `n_final < 10`, interval absurdly wide like [5%, 95%]). **Refusal Point 4:** *Base rate too unstable even after widening.* Forecast declined.

  7.  **Inside View Adjustment (Transparent & Capped):**
      *   **Explicit Judgment Call C:** List *specific, unique* factors about the target case not captured in the reference class that *credibly* move the probability *up or down*. Provide brief rationale for *direction* and *magnitude* of adjustment for each factor. *Sufficiency:* Concrete factors listed, directional impact justified.
      *   Apply adjustments *additively* to `p_final`. **Cap the total adjustment at ±15 percentage points.** *Sufficiency:* Adjusted point probability (`p_adj`) calculated. *Terminate if:* Analyst judges adjustments required exceed ±15pp, indicating the reference class is fundamentally inadequate. **Refusal Point 5:** *Inside view dominates; base rate is irrelevant.* Forecast declined.

  8.  **Final Output & Reporting:**
      *   **Point Probability:** `p_adj` (if forecast given).
      *   **Range:** Report the *wider* of:
          *   The empirical uncertainty range (`[p_low, p_high]`), OR
          *   `[p_adj - 10, p_adj + 10]` (reflecting adjustment uncertainty).
      *   **Mandatory Disclosure:** "This assessment combines historical base rates (`p_final`, n=`n_final`) with analyst judgment of unique factors. The range reflects empirical uncertainty and adjustment risk. Capital allocation decisions involve inherent risk beyond this probability estimate."

  **Where Judgment is Dressed as Arithmetic:**
  *   **Step 4 (JC A):** Theoretical similarity is qualitative history, presented as a yes/no gate.
  *   **Step 5 (JC B):** Relevance after widening is a historical/political judgment, presented as a stopping rule.
  *   **Step 7 (JC C):** Magnitude/direction of inside-view adjustments is entirely judgmental, presented as additive deltas.
  *   **The Cap (±15pp):** An arbitrary limit disguising the fundamental uncertainty of the adjustment process.

  **Where Value Decisions Happen (Requiring Human Oversight):**
  *   **The Causal Priority Order (Step 5):** Deciding which dimensions to drop first *is* a theoretical claim about what matters most. This needs senior review/consensus.
  *   **The Adjustment Cap (±15pp):** Setting this limit involves valuing base rates vs. inside views. A firm policy decision.
  *   **Refusal Points 2-5:** Deciding *if* similarity is destroyed, relevance is lost, instability is too high, or adjustment is too large involves judgment about what constitutes a "valid" forecast. Senior analyst/supervisor must review near-refusals.
  *   **The Mandatory Disclosure:** The wording manages client expectations and firm liability. Legal/Compliance review essential.

  **The Firm's Entitlement:** The firm is entitled to provide a *methodologically transparent, historically informed estimate* of probability based on available data and expert judgment. It is **NOT** entitled to imply certainty where none exists, suppress material uncertainty, or make the *actual capital allocation decision* for the client. The disclosure makes this clear. The refusal points protect the firm and client.

  **Applying BRB to Cases:**

  *   **Case A (Personalist Monarchy, Rentier, Contested Succession, No Precedent):**
      *   Steps 1/2: Clear proposition, coded.
      *   Step 3: Initial Pull (match all dims: Personalist, Hereditary (assumed), Rentier, Elite Frag? (assume coded), Recent Instability? (Succession contest = instability? *Judgment call*)). **Most likely `n_initial = 0` or tiny (1-2). Refusal Point 1 or borderline.**
      *   Step 4 (JC A): If `n_initial` tiny/similar, hard to argue strong similarity. Unique factors (first contest in 50yrs, rentier dependence) likely dominate. **Probable Refusal Point 2 or 3 during widening.** If forced to widen, `n_final` might be reachable but relevance low (JC B). Adjustment (JC C) would be huge (±15pp cap hit easily). **VERDICT: REFUSE FORECAST (Likely Refusal Point 2, 3, or 5).**

  *   **Case B (Parliamentary Democracy, Recent Failed Coup, Outside/Inside Conflict):**
      *   Steps 1/2: Clear proposition, coded (Democracy-Parliamentary, Elective? (assume), Diversified? (assume), Elite Frag? (coup attempt implies high!), Recent Instability: YES (coup attempt)).
      *   Step 3: Initial Pull (match all dims, esp. "Parliamentary Democracy" + "Recent Instability=Yes"). `n_initial` might be small but likely >0 (e.g., Turkey 2016, Spain 1981, maybe others).
      *   Step 4 (JC A): Modern democracies are more comparable than empires vs rentier states. Exchangeability plausible.
      *   Step 5: If `n_initial < 30`, widen (drop Recent Instability first? Drop Elite Fragmentation?). `n_final=30` likely achievable with moderate relevance loss (JC B).
      *   Step 6: `p_final` (e.g., 10%), range (e.g., [5%, 20%]).
      *   Step 7 (JC C): **Crucial Judgment.** *Inside View Up:* Coup failed BUT organizers not purged, military split, underlying causes unresolved. *Inside View Down:* Strong democratic institutions, broad public condemnation, international support. *Net Adjustment:* Could be modest (±5pp) or conflicting (net zero). `p_adj` = 10% ± adjustment.
      *   **VERDICT: FORECAST GIVEN (e.g., p_adj = 12%, Range [7%, 22%]).** High uncertainty range and disclosure essential. Conflict between views *is* the reality.

  *   **Case C (Nearest Class: 11 cases, 7 same empire different dates):**
      *   Steps 1/2/3: Initial Pull - `n_initial=11`.
      *   Step 4 (JC A): **Critical Judgment Call.** Are the 7 time points from Empire X *independent* observations? Or are they temporally autocorrelated, sharing deep structural factors making them non-independent? History PhD judgment required. *If independent:* Proceed. *If not:* This class is effectively `n=5` (4 other polities) + 1 (Empire X as a bloc) - **Refusal Point 2 or 4 (instability)**.
      *   Step 5: If proceed, `n=11` <30, widen carefully. JC B must assess *what* is added and relevance. Risk of adding very dissimilar cases.
      *   Step 6: `p_final` based on `n=11` (e.g., 4 events -> ~36%), range wide (e.g., [15%, 65%]).
      *   Step 7: JC C - Adjust for uniqueness of *this* moment in the target empire vs. the historical moments. Cap applies.
      *   **VERDICT: AMBIGUOUS.** *If independence accepted:* Forecast given with wide range (e.g., `p_adj=40%`, Range [25%, 55%]). *If independence rejected:* **REFUSE FORECAST (Refusal Point 2 or 4).** (You'll likely dislike accepting it, but JC A *can* justify independence if the time points represent distinct regimes/contexts within the empire).

  **The Hard Truth & Recommendation**

  Base rates *alone* cannot do this work reliably for rare, context-dependent political events with heterogeneous historical data. Your current dataset and method *do* launder narrative judgment (steps 4, 5, 6, inside view) into a number. The BRB procedure forces this laundering into explicit, bounded judgment calls and provides refusal points, making the process *less bad* and *more transparent*, but it doesn't solve the core epistemic problem.

  **What the Firm Should Do Instead:**

  1.  **Stop Selling Point Probabilities for Single Events:** They imply false precision. Move to:
      *   **Scenario Planning with Probabilities:** "Three Scenarios: Continuity (60-70%), Managed Transition (20-30%), Violent Rupture (10-20%)." This better handles uniqueness and inside views.
      *   **Risk Categories:** "High Risk (40-60% probability)", "Medium Risk (20-40%)", "Low Risk (5-20%)", "Very Low Risk (<5%)" with explicit criteria. Include "Unforecastable" category.
      *   **Decision Frameworks:** "If event X happens, impacts are [High/Med/Low]. Our confidence in this assessment is [High/Med/Low]." Focuses on client action.
  2.  **Radically Improve Dataset & Coding:**
      *   Focus on post-1945 (or 1800+) only. Pre-modern composites are usually non-exchangeable.
      *   Invest in far more granular and theoretically informed coding (e.g., *type* of elite fragmentation, *source* of revenue vulnerability, institutional strength scores).
      *   Include *process* variables (e.g., protest levels, elite bargaining attempts) where possible.
      *   Acknowledge and code for potential selection bias ("chronicle bias").
  3.  **Track Performance Relentlessly:** Score forecasts (Brier score) *separately* for different refusal categories and outcome types. Be brutally honest internally.
  4.  **Manage Client Expectations:** Educate clients on the limits of forecasting complex politics. Sell insight, understanding, and scenario preparation, not false precision. Transparency builds long-term trust.

  **In short:** The BRB procedure makes your current practice more rigorous and provides escape valves. But the ethically and epistemologically sound move is to abandon point probabilities for single, complex political events and adopt scenario-based or categorical risk reporting paired with better data and radical transparency. The demand for a number doesn't justify supplying a misleading one.
