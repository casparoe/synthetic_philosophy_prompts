answer: |-
  Your hypothesis is substantially correct and captures the core structural disagreement. The impasse is primarily **formal/structural** concerning the nature of value aggregation and the constraints on moral ordering. Below, I defend this diagnosis, address alternatives, test it against your variants, and outline paths to progress.

  ### Core Diagnosis: Formal Disagreement on Value Structures
  - **Aggregative Side**: Assumes a real-valued, **Archimedean utility function**.  
    - Moral disvalues (torture/specks) are **homogeneous** and **additively comparable**.  
    - Satisfies continuity: For any two disvalues, there exists a finite ratio where magnitudes trade off.  
  - **Lexical Side**: Assumes a **lexicographic ordering** with torture as a higher-priority "dimension."  
    - Torture and specks are **heterogeneous goods**; torture occupies a separate, dominant tier.  
    - No finite quantity of lower-tier disvalues (specks) can outweigh a higher-tier disvalue.  

  This structural divide explains why:  
  - The aggregative "sorites" argument fails for lexicalists: Adding specks *never* crosses a qualitative threshold.  
  - Both sides find the other "monstrous": They are operating in distinct mathematical moral frameworks (Archimedean vs. non-Archimedean).  

  ### Rival Diagnoses: Why They Are Secondary  
  1. **Different Questions (e.g., welfare vs. rights)**:  
     - *Problem*: Both sides explicitly debate "which outcome is *worse*," not permissions or rights. The lexical side doesn’t appeal to deontology (e.g., "rights violations"); they argue torture is *incomparably worse* as a harm.  
     - *Verdict*: Not the primary driver.  

  2. **Out-of-Depth Intuitions**:  
     - *Problem*: Intuitions *persist* even in absurdly large numbers (e.g., 3↑↑↑3 specks), suggesting commitments are structural, not empirical. The lexical view isn’t based on psychological limits ("we can’t imagine it") but on categorical hierarchy.  
     - *Verdict*: A symptom (intuitions express formal priors), not the cause.  

  ### Testing Against Variants  
  - **Variant (a): One speck per person**  
    - *Aggregative*: Unchanged. Total disvalue still sums.  
    - *Lexical*: Unchanged. Torture remains lexically prior, regardless of distribution.  
    - *Result*: Disagreement persists → Supports formal diagnosis.  

  - **Variant (b): Specks on sleeping, unaffected people**  
    - *Aggregative*: May weaken (no experiential harm), but many still sum trivial disvalues (e.g., violation of bodily integrity).  
    - *Lexical*: Torture still dominates, but some may concede specks now have *zero* disvalue.  
    - *Result*: Partial shift, but core structure holds:  
      - If lexicalists retreat, it’s due to redefining the speck’s disvalue (e.g., "no harm occurs"), not abandoning lexical priority.  
      - If aggregativists persist, they appeal to non-experiential harms (e.g., "metaphysical intrusion").  
    - *Conclusion*: The formal divide adapts but endures.  

  ### Paths to Progress  
  1. **Clarify Formal Commitments**:  
     - Explicitly map the axioms each side requires (e.g., Does morality *need* Archimedean continuity? Can lexical orderings avoid absurdity in other cases?).  

  2. **Hybrid Models**:  
     - Explore **threshold lexicality** (e.g., torture dominates until a catastrophic speck-total) or **fuzzy hierarchies**, showing how structures could partially reconcile.  

  3. **Meta-Ethical Distinction**:  
     - Distinguish *evaluative comparisons* ("which outcome is worse?") from *practical rationality* ("what should we choose?"). Lexicalists might accept aggregative "badness" but insist torture is *unconditionally impermissible*.  

  4. **Consequence Argument**:  
     - Test intuitions on reversed spectra (e.g., "50 years of mild joy" vs. "one second of ecstasy for billions"). If lexical intuitions flip, it reveals context-dependence.  

  5. **Accept Irreconcilability**:  
     - If morality is fundamentally discontinuous, progress may require agreeing to disagree—but this concedes the formal divide.  

  ### Final Diagnosis  
  The dispute is a **formal disagreement about the structure of moral value**, specifically whether disvalues are Archimedean (continuously additive) or lexicographically ordered, with lexical priority given to torture.  
  \answer{formal/structural}
