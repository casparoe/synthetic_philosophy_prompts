answer: |-
  ### Activity: Death in Damascus Deliberation Loop  
  **Objective:** Experience the infinite regress in deliberation where each choice justifies the other, highlighting the challenge beyond predictor accuracy.

  ---

  #### **Materials**  
  - Index cards (2 per student)  
  - Whiteboard or large paper  
  - Coin  
  - Timer  

  #### **Scoring Scheme**  
  - Start: 100 points each  
  - **Survival:** 0 points if Death finds you, 100 points if you survive.  
  - **Journey cost:** -10 points if you choose "Go" (even if you die).  
  - **Side bet:** Reward based on accuracy of survival probability estimate (quadratic scoring):  
    - If you survive: `Points = 100 - (100 - stated_probability)^2 / 100`  
    - If you die: `Points = 100 - (stated_probability)^2 / 100`  
    *(e.g., stating 70% and surviving: `100 - (30)^2/100 = 91 points`)*  
  - **Auction:** Winner pays bid (in points) to see a prediction.  

  #### **Roles**  
  - **Facilitator (You):** Oracle (predictor), Death, auctioneer.  
  - **Students:** Decision-makers, bidders.  

  ---

  ### **Round-by-Round Timeline (75 mins)**  
  *(Read aloud text in quotes; actions in italics.)*  

  #### **1. Setup (5 mins)**  
  *Hand out index cards. Chairs in circle.*  
  "You are in Damascus. Death will search one city tomorrow—Damascus or Aleppo (a day’s journey away). A perfect oracle predicts your choice *before* you decide, and Death goes where it predicts. The oracle is never wrong. No one learns the prediction. Staying costs nothing; traveling to Aleppo costs 10 points (a night’s sleep)."  
  *Write options on board:*  
  - **Stay:** Costs 0 points.  
  - **Go:** Costs 10 points.  
  "Survival is worth 100 points; death is 0. Goal: Maximize points."  

  #### **2. Round 1: Baseline Choice + Side Bet (15 mins)**  
  *Each student gets 1 index card.*  
  "**Step 1:** Write your name, survival probability (0-100%), and choice (Stay/Go) on the card. The probability is your estimate of surviving *this round*."  
  *Collect cards. Shuffle and draw one card publicly; this student is "P" for Round 3 auction.*  
  "**Step 2:** I, as the oracle, have predicted your choices. Since the oracle is perfect, Death goes where predicted. For each of you: if you chose Stay, Death is in Damascus. If you chose Go, Death is in Aleppo. So if you chose Stay, you die in Damascus. If you chose Go, you die in Aleppo after paying 10 points."  
  *Announce:* "All who chose Stay: 0 points. All who chose Go: -10 points."  
  *Record scores. Do not debrief yet.*  

  #### **3. Round 2: Group Deliberation (15 mins)**  
  *Students form small groups (4-5).*  
  "Discuss for 5 minutes: What should you do? Why? Focus on:  
  - Does your choice affect Death’s location?  
  - How does the oracle’s prediction influence you?"  
  *After 5 mins:* "Vote publicly: How many choose Stay? Go?" *Tally votes.*  
  "Now, repeat Round 1: Write a new choice and survival probability on your second card."  
  *Collect cards. Resolve as Round 1 (all die; deduct journey costs).*  
  *Key:* Most will flip choices (e.g., from Stay to Go), but all still die.  

  #### **4. Round 3: Prediction Auction (20 mins)**  
  *P is the student drawn earlier.*  
  "**Auction rules:** I hold a sealed prediction for P. Bid points for the right to see it. Highest bid wins. **Critical rule:** If *anyone* (including P) learns the prediction, it’s void—Death’s city is then random (coin flip)."  
  *Hold auction (winner pays bid).*  
  "Winner, you may:  
  - **Reveal the prediction to everyone (void it).** Death’s city = random.  
  - **Keep it secret.** Death’s city = what was predicted."  
  *Winner chooses. If revealed, flip coin (Heads = Damascus, Tails = Aleppo).*  
  "P, choose: Stay or Go?"  
  *Apply outcomes:*  
  - If prediction voided (revealed):  
    - P survives if in the safe city (50% chance).  
  - If secret: P dies (as in Rounds 1–2).  
  *Score P: Survival? ± journey cost. Others score 0 this round.*  

  #### **5. Debrief (20 mins)**  
  *Guide discussion with questions:*  
  - **Evidential reasoning (board column 1):** "In Rounds 1–2, how did knowing the oracle’s perfection affect your choice? Why did flipping your choice not help?"  
    *→ Mapping:* Your choice "proves" the oracle predicted it, so Death is there.  
  - **Causal reasoning (column 2):** "Did your choice *cause* Death to move? Why did some say, ‘The prediction is fixed, so I should save points and stay’?"  
    *→ Mapping:* "The prediction is fixed, so my action can’t change Death’s location."  
  - **Looping (column 3):** "When did you feel stuck? How did Group Deliberation (Round 2) show that each choice justifies the other?"  
    *→ Mapping:* Stay leads to "I should go to avoid Death," but Go leads to "I should stay to save costs."  
  - **Auction (column 4):** "How did voiding the prediction break the loop? Why did P have a 50% chance only if the prediction was revealed?"  

  **Key Insights:**  
  - Evidential and causal lines both loop: "Stay → Death here → Go" vs. "Go → Death there → Stay."  
  - Oracle’s mechanism: You set predictions *after* choices in Rounds 1–2 (simulate perfection). In the auction, the prediction was pre-sealed but based on P’s *intended* choice (privately submitted).  

  #### **Predictable Issues & Fixes**  
  - **Issue 1:** Students protest, "If the oracle is perfect, I always die—why choose?"  
    *Response:* "Exactly. The loop makes both choices feel fatal. But does causal reasoning (ignore oracle, save points) help? Why/why not?"  
  - **Issue 2:** Auction winner doesn’t void the prediction (no incentive).  
    *Response:* Discuss altruism vs. points. "If you win, would you pay 50 points to give P a 50% survival chance?"  
  - **Oracle Truth:** "I simulated perfection by matching predictions to your choices. A real oracle would foresee your decision—this loop exists even if we had a time-traveling predictor!"  

  #### **If Cut to 45 Mins**  
  - **Drop Round 2 (Group Deliberation).**  
  - **Shorten:** Baseline (10 mins) → Auction (15 mins) → Debrief (20 mins).  
  - **Focus:** Contrast Round 1 (all die) with Auction (voiding breaks the loop).  

  ---

  **Why This Works:**  
  - Students *feel* the loop in Rounds 1–2 (repeated dying and choice-flipping).  
  - The auction makes evidential/causal tension visceral (voiding = random Death vs. secret = certain Death).  
  - Side bet forces quantified introspection ("Was my survival probability 0%? Why not?").  
  - Minimal materials, maximal dilemma.
