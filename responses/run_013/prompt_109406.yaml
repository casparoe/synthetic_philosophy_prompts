  \answer{3 genuine, 1 verbal}
answer: |-
  ### Joint Statement: Exposure Camp and Trust Camp on Social Epistemology in Recommender Systems

  #### 1. Agreed Claims  
  We jointly stipulate the following:  
  1.1. **Definitions**:  
  - An **epistemic bubble** arises when individuals are excluded from contrary views primarily through *omission* (e.g., algorithmic filtering, homophily). Members *never encounter* opposing evidence.  
  - An **echo chamber** arises when individuals encounter contrary views but exclude them through *discrediting* (e.g., source derogation, bias attribution). Members *dismiss* opposing evidence as illegitimate.  

  1.2. **Empirical Record** (both camps accept these as established, though prevalence is contested):  
  - Epistemic bubbles exist and can be measured via exposure gaps (e.g., users with no cross-ideological content in feeds).  
  - Echo chambers exist and can be measured via engagement patterns (e.g., high exposure to but rejection of counter-attitudinal content).  
  - Interventions targeting epistemic bubbles (e.g., increasing algorithmic exposure to diverse content) sometimes improve belief accuracy but risk backlash (e.g., user disengagement).  
  - Interventions targeting echo chambers (e.g., credibility cues) sometimes increase openness but risk overfitting to specific contexts (e.g., working only for low-stakes issues).  

  1.3. **Live Intervention Options** (both camps accept these as viable, though efficacy is contested):  
  - Structural changes (e.g., altering recommender algorithms to force exposure).  
  - Trust-building changes (e.g., attaching credibility indicators to sources).  
  - Hybrid approaches (e.g., exposing users to contrary views *with* in-group endorsements).  

  #### 2. Residual Disagreements  
  Phrased as each camp would endorse:  
  - **Exposure Camp**: "The *dominant pathology* in most recommender systems is epistemic bubbles. Structural exposure interventions are *necessary and often sufficient* for correction, as trust follows repeated exposure. Prioritizing trust-building is inefficient when omission is the root cause."  
  - **Trust Camp**: "The *dominant pathology* in most recommender systems is echo chambers. Trust-building interventions are *necessary preconditions* for effective exposure, as discrediting neutralizes structural fixes. Forcing exposure without trust amplifies backlash."  

  #### 3. Cruxes  
  Cruxes are phrased as testable sub-questions. For each, we specify:  
  - A shared study design or case.  
  - Each camp’s pre-registered prediction.  

  **Crux 1: Necessity of In-Group Endorsement**  
  - **Question**: Is a trusted in-group figure publicly vouching for an out-group source *necessary* for correction in echo chambers, or merely *convenient*?  
  - **Study Design**: In a polarized online community (e.g., a climate change forum), introduce identical out-group content under two conditions:  
    - *Condition A*: Presented with no endorsement.  
    - *Condition B*: Presented with endorsement from a pre-validated in-group authority (e.g., "This [out-group] article is reliable – [In-Group Expert]").  
    - *Metrics*: Belief shift (pre/post), perceived source legitimacy, and sharing intent.  
  - **Predictions**:  
    - Exposure Camp: Correction occurs in *both* conditions; endorsement is convenient but not necessary (prediction: A ≈ B > control).  
    - Trust Camp: Correction *only* occurs with endorsement; exposure alone backfires (prediction: B > control ≥ A).  

  **Crux 2: Dominant Pathology in High-Homophily Networks**  
  - **Question**: In recommender systems with strong homophily (e.g., political subreddits), is exclusion primarily driven by *omission* (bubble) or *discrediting* (echo chamber)?  
  - **Study Design**: Audit user histories in a high-homophily network to measure:  
    - *Omission rate*: % of users with *no* exposure to counter-attitudinal content.  
    - *Discrediting rate*: % of users exposed to but rejecting >90% of counter-attitudinal content (via engagement data/dislike ratios).  
  - **Predictions**:  
    - Exposure Camp: Omission dominates (prediction: omission rate > discrediting rate).  
    - Trust Camp: Discrediting dominates (prediction: discrediting rate > omission rate).  

  **Crux 3: Backfire Risk in Structural Exposure**  
  - **Question**: Does forced exposure to contrary views in echo chambers *systematically backfire* (increase polarization)?  
  - **Case Argument**: Meta-analysis of 10 field experiments (e.g., Twitter/X timeline interventions) where users were exposed to unendorsed counter-attitudinal content.  
    - *Critical evidence*: Effect size of polarization (attitude extremity shift) in echo-chamber-identified users.  
  - **Predictions**:  
    - Exposure Camp: Backfire is rare; net effect is neutral/positive (prediction: ≤20% of studies show significant backfire).  
    - Trust Camp: Backfire is systematic; net effect is negative (prediction: ≥60% of studies show significant backfire).  

  #### 4. Note on Merely Verbal Disagreement  
  We judge the term "credibility" as a source of merely verbal disagreement. The trust camp uses it to denote *inherent legitimacy* (a property of sources), while the exposure camp uses it to denote *emergent trust* (a property of repeated exposure). This conflation obscures agreement: both accept that legitimacy affects dismissal, but disagree on whether it must be pre-established (trust camp) or can be cultivated through exposure (exposure camp). Clarifying this taxonomy would resolve pseudo-disputes.  

  ---  
