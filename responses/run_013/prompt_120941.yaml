  | **1**    | Conditionalization requires an event; evidence is a constraint. <br> - Explicitly state event-based update fails. <br> - Explain constraint ≠ event. | 4 (2+2) | Misidentifying constraint as event (e.g., "condition on \(S \cap B\)"). |  
  | **2**    | Derive Infomin posterior. <br> - State prior: \(P(R)=0.5\), \(P(H)=0.25\), \(P(S)=0.25\). <br> - Express posteriors in terms of \(q = Q(R)\). <br> - Set up \(D(Q \parallel P)\) or use given formula. <br> - Report \(P(R)≈0.745\), \(P(H)≈0.064\), \(P(S)≈0.191\). | 8 (2+2+2+2) | Incorrect prior (e.g., ignoring \(P(H|B)=P(S|B)=0.5\)); mismapping constraint (e.g., \(Q(S)=3/4\)); calculation errors. |  
  | **3**    | Explain why \(P(R)\) increase is puzzling. <br> - Note evidence is internal to Blue. <br> - Highlight counterintuitive "leakage" to \(P(R)\). | 4 (2+2) | Missing the intuition that \(P(R)\) should be unchanged; misattributing the puzzle. |  
