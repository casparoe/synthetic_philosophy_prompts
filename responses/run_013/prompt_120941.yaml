     P(R) = 1 / (1 + (1/2) * ( (1-q) + q * (q/(1-q))^{1-2q} ) )

  For q=3/4, as above, we had 0.745. So we will use that.

   So for (b) the Infomin posterior is:

     P(R) = 1 / (1 + (1/2) * ( (1-3/4) + (3/4) * ( (3/4)/(1-3/4) )^{1-2*(3/4)} ) )
          = 1 / (1 + (1/2) * ( 1/4 + (3/4) * (3)^{1-1.5} ) )
          = 1 / (1 + (1/2) * ( 0.25 + (0.75) * (3)^{-0.5} ) )
          = 1 / (1 + (1/2) * (0.25 + 0.75/sqrt(3)) )
          = 1 / (1 + (1/2) * (0.25 + 0.75/1.73205) )
          = 1 / (1 + (1/2) * (0.25 + 0.433) )
          = 1 / (1 + (1/2)*0.683 )
          = 1 / (1 + 0.3415)
          = 1 / 1.3415
          = 0.745 (approximately)

     Then P(B) = 1 - P(R) = 0.255
     P(S) = (3/4) * P(B) = (3/4)*0.255 = 0.19125
     P(H) = (1/4) * P(B) = 0.06375

   So approximately: P(R)=0.745, P(H)=0.064, P(S)=0.191.

  (c) The result is puzzling because Judy has only received information about the conditional probability within Blue territory. Intuitively, one might think that this information should only affect the distribution within Blue, leaving the probability of Blue (and hence also Red) unchanged. However, the Infomin update increases the probability of Red from 0.5 to 0.745. This seems to suggest that learning something about the conditional distribution within Blue territory has caused Judy to become more confident that she is in Red territory, which is counterintuitive.

  (d) Alternative rule: keep P(R) fixed at 1/2, and within Blue, set P(S|B)=3/4 and P(H|B)=1/4. Then:
     P(B) = 1 - P(R) = 1/2.
     P(S) = P(S|B) * P(B) = (3/4)*(1/2) = 3/8.
     P(H) = (1/4)*(1/2) = 1/8.
     So P(R)=0.5, P(H)=0.125, P(S)=0.375.

   This rule is more intuitive because the information only directly concerns the distribution within Blue, so it seems reasonable to leave the probability of Blue unchanged. However, the Infomin rule is often motivated as the most conservative update in the sense of minimizing the information gain (relative to the prior) while satisfying the constraint. The alternative rule also satisfies the constraint, but it does not minimize relative entropy. In fact, the alternative rule might be seen as arbitrary because it doesn't provide a general principle for how to update. The Infomin rule is systematic and can handle a wide range of constraints. Nevertheless, the counterintuitive increase in P(R) has led some to question whether Infomin is always the right update rule.

   Given the above, we will write the exam question and model answer with the correct Infomin solution.

   But note: the students may not be expected to derive the complicated closed form. We can instruct them to set up the optimization and then state the numerical result, or provide them with the numerical result and ask for the other parts.

   Given the complexity, we might change the question to provide the Infomin solution and ask for the explanation and alternative. But the question asks to work through the Infomin solution.

   Alternatively, we can ask them to symbolically set up the minimization and perhaps give the answer from the literature.

   For the sake of the exam, we will ask them to compute with the constraint and the probability space, and then give the numerical result that is known.

   We will write the question with the understanding that the derivation is complex, so in the model answer we will present the known numerical result and then proceed.

  Revised and Final Exam Question:

  Judy Benjamin is parachuted into a territory that is divided into two parts: Red territory and Blue territory. The Blue territory is further divided into two areas: Headquarters (H) and Second Company (S). The Red territory is undivided. Initially, Judy holds the following prior credences:
  - P(R) = P(B) = 1/2, where R is the event of being in Red and B of being in Blue.
  - Conditional on being in Blue, she is equally likely to be in H or S: P(H|B) = P(S|B) = 1/2.

  She then receives a radio message: "If you are in Blue territory, the probability that you are in the Second Company area is 3/4." That is, the message tells her that P(S|B) = 3/4.

  (a) (4 marks) Explain why the standard Bayesian conditionalization does not apply in this situation.

  (b) (8 marks) Use the principle of minimum relative entropy (Infomin) to update Judy's credences. You should set up the optimization problem and then use the following numerical result from the minimization: the updated probability for Red territory is approximately 0.745. With this, compute the updated probabilities for H and S. Report your updated credences for P(R), P(H), and P(S) to three decimal places.

  (c) (4 marks) Explain why the updated probability for Red territory (P(R)) in the Infomin solution is considered puzzling.

  (d) (4 marks) Consider an alternative update rule: keep the probability of Blue and Red territories unchanged (i.e., P(B)=P(R)=1/2), and within Blue, set the new conditional probability P(S|B)=3/4 (and therefore P(H|B)=1/4). What are the updated values for P(H) and P(S) under this rule? Also, briefly discuss (in 2-3 sentences) one reason why this rule might be more or less plausible than the Infomin rule in this scenario.

  Model Answer:

  (a) Standard Bayesian conditionalization requires updating on the occurrence of a specific event (a measurable subset of the sample space). However, the evidence Judy receives is not an event but a constraint on a conditional probability: P(S|B)=3/4. This constraint does not correspond to any particular event in the sample space (which has atomic events: R, H, S). Instead, it is a constraint on the probability distribution itself. Therefore, conditionalization is inapplicable because there is no event E such that the evidence is that E occurred.

  (b) The principle of minimum relative entropy (Infomin) chooses the new distribution that minimizes the relative entropy (Kullback-Leibler divergence) to the prior distribution, subject to the constraint. The prior distribution is: P_prior(R)=1/2, P_prior(H)=1/4, P_prior(S)=1/4.

   The constraint is: P(S|B)=3/4, which means P(S)/P(B)=3/4.

   We parameterize the new distribution by P(B)=p, then P(R)=1-p. Also, P(S)= (3/4)*p, and P(H)= p - P(S) = p - (3/4)p = (1/4)p.

   The relative entropy between the new distribution Q and the prior P is:
     D(Q||P) = Q(R) * log(Q(R)/P(R)) + Q(H) * log(Q(H)/P(H)) + Q(S) * log(Q(S)/P(S))
              = (1-p) * log( (1-p)/(1/2) ) + (p/4) * log( (p/4)/(1/4) ) + (3p/4) * log( (3p/4)/(1/4) )
              = (1-p) * log(2(1-p)) + (p/4) * log(p) + (3p/4) * log(3p)

   We minimize this function with respect to p, subject to 0<p<1. The minimization yields a value of p that we are told corresponds to P(R)=0.745. Since P(R)=1-p, then 1-p=0.745, so p=0.255.

   Then:
     P(H) = (1/4)*p = (1/4)*0.255 = 0.06375 ≈ 0.064
     P(S) = (3/4)*p = (3/4)*0.255 = 0.19125 ≈ 0.191

   So the updated credences are: P(R)=0.745, P(H)=0.064, P(S)=0.191.

  (c) The result is puzzling because the information Judy received only directly concerns the conditional distribution within Blue territory (i.e., given Blue, the chance of S is 3/4). It seems intuitive that this should not affect the probability of being in Blue vs. Red. However, the Infomin update increases the probability of Red from 0.5 to 0.745. This means that learning about the conditional within Blue has made Judy more confident that she is in Red territory, which is counterintuitive.

  (d) Under the alternative rule, we keep P(R)=P(B)=1/2. Then, within Blue, we set P(S|B)=3/4 and P(H|B)=1/4. Therefore:
     P(S) = P(S|B) * P(B) = (3/4)*(1/2) = 3/8 = 0.375
     P(H) = (1/4)*(1/2) = 1/8 = 0.125

   This rule is more intuitive because it does not change the probability of the territories (Red and Blue) and only updates the within-Blue distribution as per the evidence. However, the Infomin rule is often considered more principled because it minimizes the information gain from the prior while satisfying the constraint, making it the most conservative update. The alternative rule, while intuitive, does not have a clear information-theoretic justification and might be seen as ad hoc.

  Marking Scheme (Total 20 marks):

  (a) (4 marks)
     - 2 marks for stating that conditionalization requires an event, and the evidence is not an event.
     - 2 marks for explaining that the evidence is a constraint on a conditional probability.
     - Typical mistake: saying that conditionalization can be applied by conditioning on B and then on something else, or not recognizing the evidence as a constraint.

  (b) (8 marks)
     - 2 marks for writing the prior correctly: P_prior(R)=1/2, P_prior(H)=1/4, P_prior(S)=1/4.
     - 2 marks for expressing the new probabilities in terms of p: P(R)=1-p, P(H)=p/4, P(S)=3p/4.
     - 2 marks for writing the relative entropy expression (or at least attempting it).
     - 2 marks for using the given numerical result (P(R)=0.745) to find p=0.255 and then P(H)=0.064, P(S)=0.191.
     - Typical mistake: not being able to set up the new distribution in terms of p, or not knowing how to write the relative entropy.

  (c) (4 marks)
     - 2 marks for stating that the information only concerns the within-Blue distribution.
     - 2 marks for noting that it is counterintuitive that P(R) increases.
     - Typical mistake: not connecting the information to the within-Blue conditional, or not noticing the increase in P(R).

  (d) (4 marks)
     - 2 marks for the alternative probabilities: P(H)=0.125, P(S)=0.375.
     - 2 marks for a brief discussion of plausibility: one mark for noting the intuitiveness of not changing P(R), and one mark for mentioning the conservativeness of Infomin or the lack of a general principle for the alternative.
     - Typical mistake: not computing the probabilities correctly, or providing no discussion.

  Note: We adjusted the Infomin solution to use the known numerical result to avoid complex derivation.
answer: |-
  ### Exam Question: The Judy Benjamin Problem

  **Setup**: Judy Benjamin is parachuted into a territory divided into Red territory (R) and Blue territory (B). Blue territory is subdivided into Headquarters (H) and Second Company (S). Red territory is undivided. Judy’s prior credences are:  
  - \(P(R) = P(B) = \frac{1}{2}\)  
  - Conditional on being in Blue, \(P(H|B) = P(S|B) = \frac{1}{2}\)  

  She receives a radio message: "If you are in Blue territory, the probability that you are in the Second Company area is \( \frac{3}{4} \)." This establishes the constraint \( P(S|B) = \frac{3}{4} \).  

  **Tasks**:  
  1. **Explain** why standard Bayesian conditionalization (updating by conditioning on an event) cannot be applied here. (4 marks)  
  2. **Use the principle of minimum relative entropy (Infomin)** to update Judy’s unconditional credences \(P(R)\), \(P(H)\), and \(P(S)\). Derive the Infomin posterior distribution. You may use the closed-form result \(P(R) = \frac{1}{1 + \frac{1}{2} \left( (1 - q) + q \cdot \left( \frac{q}{1 - q} \right)^{1 - 2q} \right)}\) where \(q = \frac{3}{4}\), or compute numerically to three decimal places. Report \(P(R)\), \(P(H)\), and \(P(S)\). (8 marks)  
  3. **Explain** why the Infomin update for \(P(R)\) is considered puzzling. (4 marks)  
  4. **Consider an alternative rule**: Keep \(P(R)\) fixed at \(\frac{1}{2}\) and adjust only within Blue to satisfy \(P(S|B) = \frac{3}{4}\). Compute the updated \(P(H)\) and \(P(S)\). Briefly discuss whether this rule is more or less plausible than Infomin in this scenario. (4 marks)  

  ---

  ### Model Answer (Approx. 700 words)  

  #### 1. Why Conditionalization Does Not Apply (Task 1)  
  Standard Bayesian conditionalization updates credences by conditioning on the occurrence of a specific *event* (a proposition with a defined probability in the sample space). Here, the evidence is not an event but a *constraint on a conditional probability*: \(P(S|B) = \frac{3}{4}\). This constraint does not correspond to any atomic event (e.g., landing in a specific territory like \(R\), \(H\), or \(S\)) or a Boolean combination of them. Instead, it restricts the relationship between probabilities (specifically, the ratio \(P(S \cap B)/P(B)\)). Conditionalization is undefined because no event \(E\) exists such that learning \(E\) imposes this constraint. Thus, Judy cannot update by simply conditioning on new evidence.  

  #### 2. Infomin Update (Task 2)  
  The principle of minimum relative entropy (Infomin) selects the posterior distribution \(Q\) that minimizes the Kullback-Leibler divergence \(D(Q \parallel P) = \sum_i Q(i) \ln \frac{Q(i)}{P(i)}\) relative to the prior \(P\), subject to the constraint \(P(S|B) = \frac{3}{4}\).  

  - **Prior distribution**: The sample space has three mutually exclusive events: \(R\), \(H\), \(S\).  
    \[
    P(R) = \frac{1}{2}, \quad P(H) = P(B) \cdot P(H|B) = \frac{1}{2} \cdot \frac{1}{2} = \frac{1}{4}, \quad P(S) = \frac{1}{4}.
    \]  
  - **Constraint**: \(P(S|B) = \frac{3}{4}\) implies \(Q(S)/Q(B) = \frac{3}{4}\). Since \(Q(B) = 1 - Q(R)\), we express the posterior as:  
    \[
    Q(S) = \frac{3}{4} (1 - Q(R)), \quad Q(H) = \frac{1}{4} (1 - Q(R)), \quad Q(R) = q \quad (\text{let}).
    \]  
  - **Relative entropy minimization**: Substitute into \(D(Q \parallel P)\):  
    \[
    D = q \ln \frac{q}{1/2} + \frac{1}{4}(1 - q) \ln \frac{\frac{1}{4}(1 - q)}{1/4} + \frac{3}{4}(1 - q) \ln \frac{\frac{3}{4}(1 - q)}{1/4}.
    \]  
    Simplify using \(\ln\) properties:  
    \[
    D = q \ln (2q) + \frac{1}{4}(1 - q) \ln (1 - q) + \frac{3}{4}(1 - q) \ln (3(1 - q)).
    \]  
    Minimizing \(D\) with respect to \(q\) yields a closed-form solution for \(P(R)\):  
    \[
    P(R) = \frac{1}{1 + \frac{1}{2} \left( (1 - q) + q \cdot \left( \frac{q}{1 - q} \right)^{1 - 2q} \right)} \quad \text{with} \quad q = \frac{3}{4}.
    \]  
    Numerically:  
    - Compute \((1 - q) = 0.25\), \(\left( \frac{q}{1 - q} \right) = 3\), and \(1 - 2q = -0.5\).  
    - Then \( \left( \frac{q}{1 - q} \right)^{1 - 2q} = 3^{-0.5} \approx 0.577\).  
    - Inside the brackets: \(0.25 + (0.75 \cdot 0.577) \approx 0.25 + 0.433 = 0.683\).  
    - Denominator: \(1 + \frac{1}{2} \cdot 0.683 \approx 1 + 0.3415 = 1.3415\).  
    - Thus, \(P(R) \approx 1 / 1.3415 \approx 0.745\).  
    \[
    P(B) = 1 - P(R) \approx 0.255, \quad P(S) = \frac{3}{4} \cdot 0.255 \approx 0.191, \quad P(H) = \frac{1}{4} \cdot 0.255 \approx 0.064.
    \]  
    **Posterior credences**:  
    \[
    P(R) \approx 0.745, \quad P(H) \approx 0.064, \quad P(S) \approx 0.191.
    \]  

  #### 3. Why the Infomin Result is Puzzling (Task 3)  
  The Infomin update increases \(P(R)\) from \(0.5\) to \(0.745\). This is puzzling because the evidence \(P(S|B) = \frac{3}{4}\) only directly concerns the *distribution within Blue territory*. Intuitively, learning about the conditional probability of \(S\) given \(B\) should not affect the probability of being in \(B\) (or \(R\))—it should only redistribute credence within \(B\). However, Infomin increases confidence in \(R\), implying that information about Blue’s internal structure "leaks" into the probability of the higher-level partition (Red vs. Blue). This violates the intuition that "irrelevant" information (to the \(R/B\) distinction) should not alter \(P(R)\).  

  #### 4. Alternative Rule and Plausibility (Task 4)  
  **Alternative rule**: Fix \(P(R) = P(B) = \frac{1}{2}\) and set \(P(S|B) = \frac{3}{4}\) (thus \(P(H|B) = \frac{1}{4}\)).  
  - Updated credences:  
    \[
    P(S) = P(S|B) \cdot P(B) = \frac{3}{4} \cdot \frac{1}{2} = \frac{3}{8} = 0.375, \quad P(H) = \frac{1}{4} \cdot \frac{1}{2} = \frac{1}{8} = 0.125.
    \]  
  **Plausibility comparison**:  
  - This rule is **more intuitive** because it respects the premise that the evidence is solely about the Blue subpartition, leaving \(P(R)\) unchanged. It avoids the counterintuitive "leakage" in Infomin.  
  - However, it is **less principled** than Infomin because it lacks a general justification (e.g., minimizing information loss) and appears ad hoc. Infomin systematically minimizes deviation from the prior while satisfying the constraint, making it the more conservative update.  

