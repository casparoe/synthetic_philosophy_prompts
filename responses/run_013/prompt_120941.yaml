  We are designing an exam question for graduate students on the Judy Benjamin problem. The goal is to have them see why updating on a conditional probability is not the same as conditionalizing on an event, and to explore the Infomin solution and an alternative.

  Exam Question:

  Judy Benjamin is parachuted into a territory that is divided into two parts: Red territory and Blue territory. The Blue territory is further divided into two areas: Headquarters (H) and Second Company (S). The Red territory is undivided. Initially, Judy holds the following prior credences:
  - P(R) = P(B) = 1/2, where R is the event of being in Red and B of being in Blue.
  - Conditional on being in Blue, she is equally likely to be in H or S: P(H|B) = P(S|B) = 1/2.

  She then receives a radio message: "If you are in Blue territory, the probability that you are in the Second Company area is 3/4." That is, the message tells her that P(S|B) = 3/4.

  (a) Explain why the standard Bayesian rule of conditionalization (updating by conditioning on an event) does not apply in this situation.

  (b) Use the principle of minimum relative entropy (Infomin) to update Judy's credences. Report your updated credences for P(R), P(H), and P(S) (you may leave your answer in fractional form or as decimals to three places).

  (c) Explain why the Infomin update for P(R) (i.e., the updated probability of Red) is considered puzzling in this context.

  (d) Consider the following alternative update rule: keep P(R) fixed at 1/2 and adjust only the probabilities within Blue so that the new conditional probability P(S|B) becomes 3/4. What are the updated values for P(H) and P(S) under this rule? Also, briefly discuss whether this alternative update rule is more or less plausible than Infomin in this scenario, and why.

  Model Answer:

  (a) Standard Bayesian conditionalization requires updating on the occurrence of a specific event (a proposition that can be true or false). However, the evidence Judy receives is not an event but a constraint on a conditional probability: P(S|B)=3/4. This constraint does not correspond to a single event in the sample space (which consists of the mutually exclusive events R, H, S). Instead, it is a constraint on the entire probability distribution. Conditionalization is undefined here because we cannot identify an event E such that the evidence is that E occurred. The evidence is a piece of information about how the probabilities are related, not an occurrence of one of the atomic events.

  (b) The principle of minimum relative entropy (Infomin) states that we should choose the new probability distribution that minimizes the relative entropy (Kullback-Leibler divergence) with respect to the prior, subject to the constraint. The prior distribution is:
     P_prior(R) = 1/2, P_prior(H) = P_prior(S) = 1/4 (since P(H) = P(B)*P(H|B) = (1/2)*(1/2)=1/4, similarly for S).

  The constraint is: P(S|B) = 3/4. Since B is the event {H, S}, we can write this as:
     P(S) / P(B) = 3/4   =>   P(S) = (3/4) * P(B)

  We also know that the probabilities must sum to 1: P(R) + P(H) + P(S) = 1.

  Let p = P(B). Then P(R) = 1 - p, P(S) = (3/4)*p, and P(H) = P(B) - P(S) = p - (3/4)p = (1/4)p.

  So the distribution is: P(R)=1-p, P(H)=p/4, P(S)=3p/4.

  We now minimize the relative entropy of the new distribution Q relative to the prior P. The relative entropy is:
     D(Q||P) = Q(R) * log(Q(R)/P(R)) + Q(H) * log(Q(H)/P(H)) + Q(S) * log(Q(S)/P(S))

  Substituting Q(R)=1-p, Q(H)=p/4, Q(S)=3p/4, and the prior: P(R)=1/2, P(H)=1/4, P(S)=1/4.

