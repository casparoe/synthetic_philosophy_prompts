  But note: the Jeffrey-style rule we are considering is specifically for conditional constraints. For a full partition constraint, we would use a different rule? In our candidate 3, we defined it for conditional constraints. But for a full partition, we use standard Jeffrey. So we have to interpret the candidate rule as: for a constraint on a conditional probability, it sets that conditional probability and leaves the unconditional probability of the conditioning event unchanged. Then for a full partition constraint, we use standard Jeffrey. So the rule is not defined for full partitions? We are only testing when the constraint is a full partition. How does the candidate rule handle that? It doesn't, so we assume that the rule is only for conditional constraints. Therefore, we cannot apply it to full partitions. So we mark it as not applicable? But we require that the rule must reduce to Jeffrey when the constraint is on a full partition. So if the rule is not designed for full partitions, we might say it fails. Alternatively, we can consider that in practice, the rule for conditional constraints is part of a family that includes Jeffrey for full partitions. But then we have to see what the rule does when given a full partition constraint. Since we haven't defined it, we will say: if the rule is given a full partition constraint, it must do Jeffrey. The fixed conditioning event rule is not designed for full partitions. Therefore, we consider it fails.

  **Criterion 4: Handling Conflicting Constraints**
     - MinEnt: Passes. As long as the constraint is feasible (i.e., there exists a probability distribution satisfying it), it returns a posterior.
     - CCP: May fail. If the proposition that we condition on has prior probability zero, then conditioning is undefined. Also, if the prior assigns positive probability to the proposition but the constraint is not satisfied, conditioning on it might lead to a posterior that satisfies the constraint? But it might not: conditioning on the proposition "P(A|B)=p" might not force the agent's conditional probability to be p. For example, the agent might assign a new conditional probability that is not p. Therefore, it fails to force the constraint.
     - Jeffrey-style (fixed conditioning event): Passes. It sets the conditional probability to p and leaves the unconditional probability of B unchanged. This is always defined as long as p is between 0 and 1.
     - Deflationary: Passes. The agent can choose a posterior that satisfies the constraint.
     - Geometric rule: Passes (same as Jeffrey-style).

  **Criterion 5: Judy Benjamin Case (sub-partition constraint)**
     - MinEnt: Changes the probability of the conditioning event (Red). This is controversial. Some argue it should not change, others that it can. We note that it satisfies the constraint.
     - CCP: It is unclear. Conditioning on the proposition about the conditional probability might change the probability of Red in an unpredictable way.
     - Jeffrey-style (fixed conditioning event): Does not change the probability of Red. It only changes the conditional probabilities within Red. This is one of the proposed solutions.
     - Deflationary: The agent can choose.
     - Geometric rule: Does not change the probability of Red.

  **Criterion 6: Distinguishing between learning a proposition and a conditional credence**
     - MinEnt: Passes. It treats the constraint as a constraint on the credence function, not as a proposition.
     - CCP: Fails. It treats the conditional credence as a proposition.
     - Jeffrey-style: Passes. It directly updates the credence function.
     - Deflationary: Passes. The agent updates her credence function directly.
     - Geometric rule: Passes.

  **Criterion 7: Not identifying probability of conditional with conditional probability**
     - MinEnt: Passes. It does not use any such identification.
     - CCP: Fails. It conditions on a proposition that is about the conditional probability, but it does not equate the conditional probability with the probability of a conditional. However, it does treat the conditional probability constraint as a proposition, which might be seen as a different mistake. But it doesn't explicitly identify the two.
     - Jeffrey-style: Passes.
     - Deflationary: Passes.
     - Geometric rule: Passes.

  **Criterion 8: Distinguishing constraints on a sub-partition from a full partition**
     - MinEnt: Passes. It treats them differently: for a full partition, it gives Jeffrey; for a sub-partition, it gives a different update.
     - CCP: Fails. It treats both as propositions.
     - Jeffrey-style: Fails? The rule we are considering for conditional constraints treats the sub-partition constraint by fixing the conditional probability and the probability of the conditioning event. But it does not treat a full partition constraint (which is not a conditional constraint) in the same way. However, the rule is not designed for full partitions. So it might be said to distinguish them. But when given a full partition constraint, it would fail (as per criterion 3). So it doesn't handle full partition constraints appropriately.
     - Deflationary: Passes? The agent can handle them differently.
     - Geometric rule: Fails for full partition, but passes for sub-partition? But as above, it doesn't reduce to Jeffrey.

  **Criterion 9: Synchronic and Diachronic Requirements**
     - Synchronic: All rules except CCP and possibly deflationary can be made to satisfy the constraint (if the agent chooses in the deflationary view). 
     - Diachronic (order-invariance for two constraints): 
          - MinEnt: Not order-invariant in general for conditional constraints. 
          - CCP: Order-invariant? Conditioning is order-invariant.
          - Jeffrey-style: For conditional constraints? If we apply two conditional constraints in sequence, the result may depend on the order.
          - Deflationary: Not specified.
          - Geometric rule: Not order-invariant.

     We won't score in detail, but note that none of the rules are obviously order-invariant for conditional constraints.

  **Criterion 10: Minimal Change**
     - MinEnt: Uses KL divergence (D(Post||Prior)). Justification: it minimizes the relative entropy, which has properties like locality and invariance under transformations.
     - CCP: Does not use minimal change.
     - Jeffrey-style: Uses a specific change: only the conditional probability and the probabilities of the sub-partition are changed, and the conditioning event probability is fixed. But it doesn't minimize a global measure.
     - Deflationary: No minimal change principle.
     - Geometric rule: Sometimes associated with minimizing D(Prior||Post), but the fixed conditioning event rule doesn't minimize that. If we minimize D(Prior||Post) under the constraint, then we get a different rule that might change the conditioning event probability.

  Additional points:

  - **Order-invariance for two constraints**: 
      We ask what happens when two conditional constraints arrive in succession. We already noted that MinEnt and the geometric rule are not order-invariant. The fixed conditioning event rule might not be either.

  - **Jointly forcing a cell to zero**:
      If two constraints are individually satisfiable but together force a cell to zero, then:
          - MinEnt: Will assign zero to that cell and redistribute.
          - CCP: Might assign zero if the conjunction of the propositions forces it.
          - Jeffrey-style: Might fail if the constraints are on the same conditioning event? For example, two constraints on the same sub-partition might be inconsistent unless they are on disjoint parts. But if they are on the same conditioning event, they might overconstrain. The fixed conditioning event rule for one constraint might not extend to two.

  - **Unreliable source**:
      The question is whether the constraint should be treated as hard. All the rules we've discussed treat it as hard. But if the source is unreliable, we might want to do a soft update. This is beyond the scope, but we note that MinEnt can be extended to soft constraints (by using a cross-entropy minimization with a penalty for deviation from the constraint). The other rules are for hard constraints.

  The requirement that does the most to exclude candidates is probably **Criterion 2 (Reduction to Conditionalization)**. It excludes CCP, Jeffrey-style (fixed conditioning event), and the geometric rule. Only MinEnt and the deflationary view (if the agent chooses appropriately) pass. But note: the deflationary view doesn't force the reduction, so it doesn't guarantee it. MinEnt does pass.

  However, in the Judy Benjamin case (Criterion 5), MinEnt is controversial because it changes the probability of the conditioning event. This has been extensively debated.

  Summary of scores:

  Candidate          | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 (sync) | Notes
  -------------------|---|---|---|---|---|---|---|---|----------|------
  MinEnt             | P | P | P | P | C | P | P | P | P        | Controversial on 5 (changes conditioning event probability)
  CCP                | F | F | F | F | ? | F | F | F | ?        | Fails many
  Jeffrey-style (fixed) | P | F | F | P | P | P | P | F | P        | Fails reduction to conditionalization and to Jeffrey for full partitions; passes Judy Benjamin by not changing conditioning event.
  Deflationary       | P | F | F | P | ? | P | P | P | ?        | Can pass many if the agent chooses, but does not guarantee reduction.
  Geometric (fixed)  | P | F | F | P | P | P | P | F | P        | Same as Jeffrey-style.

  Note: We have not included the geometric rule that minimizes D(Prior||Post) because it is not as commonly discussed for Judy Benjamin as the fixed conditioning event rule. The fixed conditioning event rule is sometimes called the 'geometric' rule in some contexts, but it is not minimizing a divergence. The rule that minimizes D(Prior||Post) for the Judy Benjamin constraint does change the probability of the conditioning event. So it would be similar to MinEnt in that regard.

  Conclusion:

  The most excluding requirement is **Criterion 2 (Reduction to Conditionalization)**. It forces the rule to handle extreme conditional probabilities by collapsing to conditioning on a proposition. Only MinEnt does this among the non-deflationary rules. However, MinEnt is controversial in the Judy Benjamin case. 

  The Judy Benjamin case (Criterion 5) is where the desiderata tear: if we insist that the probability of the conditioning event should not change, then we reject MinEnt; if we allow it to change, then we might accept MinEnt. But then we fail to satisfy those who argue that the information is only about the sub-partition.

  In the literature, there is no consensus. Some argue for MinEnt, some for the fixed conditioning event rule, and some for other rules.

  Finally, we note that there is a rule that minimizes D(Post||Prior) (MinEnt) and one that minimizes D(Prior||Post) (sometimes called the M-projection). The M-projection for the Judy Benjamin case would change the conditioning event probability? Let's compute briefly. For a constraint P(A|B)=p, minimizing D(Prior||Post) = ∑ q_i log(q_i/p_i) subject to the constraint. This is equivalent to minimizing over the posterior the cross-entropy. The solution is to set the posterior such that the conditional probability is p, and the posterior is otherwise as close as possible to the prior in the sense of D(Prior||Post). This rule also changes the probability of the conditioning event. Therefore, both MinEnt and M-projection change it, while the fixed conditioning event rule does not.

  This indicates that the minimal change principle (with either measure) might conflict with the intuition that the conditioning event probability should remain fixed. Therefore, the requirement to keep the conditioning event probability fixed is a separate desideratum that is not captured by the minimization of these divergences.

  We might add it as a separate criterion:

  11. **Invariance of the Conditioning Event Probability**:
      - *Requirement*: When learning a conditional probability P(A|B)=p, the update should leave the unconditional probability of B unchanged.
      - *Reason*: The information is silent about B.

  But this is parochial: some argue it should be changed, some not.

  Given the complexity, we leave it as an open issue.

  The above criteria and scoring should provide a basis for the seminar paper.
answer: |-
  Below is a specification of desiderata for a theory of updating credences when learning conditional probabilities, structured as requested. I present the cases, distinctions, and requirements first, then briefly score major approaches against them. The criteria are rooted in normative principles of Bayesian epistemology and designed to handle cases like the Judy Benjamin problem, where learning a conditional probability (e.g., odds within a sub-partition) cannot be reduced to propositional learning. I flag tensions, especially in the Judy Benjamin case, where desiderata may conflict.

  ---

  ### **I. Cases and Constraints: What an Adequate Theory Must Deliver**  
  Each case illustrates a core requirement, with the consideration that makes it a test.

  1. **Null Constraint (No-Change Test)**  
     - **Case**: The agent learns a conditional probability \(P(A|B) = p\) that **matches her prior conditional probability** \(P_{\text{prior}}(A|B) = p\).  
     - **Requirement**: The theory must leave the agent's *entire credence function unchanged*.  
     - **Reason**: Learning what one already believes should not alter beliefs. Violations imply unnecessary belief revision.

  2. **Certainty Reduction (Collapse to Conditionalization)**  
     - **Case**: The agent learns a **conditional probability of 0 or 1** (e.g., \(P(A|B) = 1\)).  
     - **Requirement**: The theory must reduce to **ordinary Bayesian conditionalization** (i.e., conditioning on a proposition). Specifically:  
       - If \(P(A|B) = 1\) is learned, it must behave as conditioning on \(\neg B \lor A\) (or equivalently, set \(P(B \land \neg A) = 0\)).  
     - **Reason**: Extreme conditional probabilities are equivalent to learning a truth-functional proposition (e.g., "B implies A"). Failing to collapse undermines coherence with standard Bayesian norms.

  3. **Partition Constraint (Collapse to Jeffrey Conditionalization)**  
     - **Case**: The agent learns a **new probability distribution over a partition** of the entire space (e.g., \(\{C_1, C_2, \dots, C_n\}\)).  
     - **Requirement**: The theory must reduce to **Jeffrey conditionalization** (i.e., update partition probabilities while preserving relative credences within cells).  
     - **Reason**: Jeffrey updating is the standard for learning probabilistic information about partitions. Non-reduction signals incompleteness.

  4. **Consistent Conflict (Well-Defined Posterior)**  
     - **Case**: The agent learns a conditional probability \(P(A|B) = p\) that **conflicts with her prior** \(P_{\text{prior}}(A|B) \neq p\) but is **consistent with her prior distribution** (i.e., \(p\) and the prior jointly satisfy \(0 < P_{\text{prior}}(B) < 1\)).  
     - **Requirement**: The theory must produce a **well-defined posterior** (no division-by-zero or undefined credences).  
     - **Reason**: Conflicts with priors are routine; a theory must handle them without breaking. Undefined posteriors indicate pathological design.

  5. **Sub-Partition Constraint (Judy Benjamin Case)**  
     - **Case**: The agent learns a **conditional probability over a sub-partition** (e.g., odds within \(R\) given \(R\)) that conflicts with her prior, while the **conditioning event probability** (e.g., \(P(R)\)) is *unconstrained* by the message.  
     - **Requirement**:  
       - (a) The posterior must satisfy the learned conditional probability.  
       - (b) The theory **may alter the probability of the conditioning event** (e.g., \(P(R)\)), even if the message is silent about it.  
     - **Reason**:  
       - *For (a)*: The constraint must be satisfied; else, the update ignores evidence.  
       - *For (b)*: Silence does not entail invariance. The prior and constraint may jointly necessitate shifting credence to the conditioning event to avoid inconsistency (e.g., to preserve normalization). **This is contentious**; some argue \(P(R)\) should stay fixed (see *Distinctions* below).  

  ---

  ### **II. Distinctions and Principles: What an Adequate Theory Must Respect**  
  Each distinction is grounded in technical or philosophical necessity.

  6. **Learning Propositions vs. Conditional Probabilities**  
     - **Requirement**: The theory must distinguish between learning a *proposition* (e.g., "A given B") and learning a *conditional probability* (e.g., \(P(A|B) = p\)).  
     - **Reason**: Learning propositions expands the sample space; learning conditional probabilities constrains credal relationships. Conflating them invites Dutch books or ignores the input structure.

  7. **Probability of Conditionals vs. Conditional Probability**  
     - **Requirement**: The theory must **not** identify \(P(\text{if } B \text{ then } A)\) with \(P(A|B)\).  
     - **Reason**: Lewis/triviality results prove this identification is untenable—it implies universal linearity of credences. Treating conditionals as propositions leads to incoherence.

  8. **Constraints on Partitions vs. Sub-Partitions**  
     - **Requirement**: The theory must distinguish between constraints on a **partition of the entire space** and constraints on a **sub-partition of a single cell** (e.g., within \(R\)).  
     - **Reason**: Sub-partition constraints (e.g., Judy Benjamin) do not fix the probability of the conditioning event (\(R\)), while partition constraints do. Misclassification leads to incorrect updates (e.g., unjustified shifts in \(P(R)\)).

  9. **Synchronic vs. Diachronic Requirements**  
     - **Synchronic**: The posterior must satisfy the learned constraint.  
     - **Diachronic**: The update should be **order-invariant** for sequences of conditional constraints (if possible).  
     - **Reason**: Synchronic satisfaction is non-negotiable for evidence responsiveness. Order-invariance prevents path dependence but may be infeasible; its absence needs justification.

  10. **Minimal Change (If Required)**  
      - **Requirement**: If the theory invokes "minimal change," it must specify:  
        - (a) *What* is minimized (e.g., divergence between priors/posteriors).  
        - (b) *Why* that measure (e.g., information-theoretic justification).  
      - **Reason**: "Minimal change" is underdetermined without a metric. Arbitrary choices risk inconsistency or unmotivated updates.  

  ---

  ### **III. Genuine vs. Parochial Requirements**  
  - **Genuine**: 1–10 are broadly normative for Bayesian agents.  
    - *Rationale*: They ensure consistency, evidence responsiveness, and coherence with probability theory.  
  - **Parochial**:  
    - The demand that \(P(R)\) *must not change* in the Judy Benjamin case (5b) is parochial—it reflects a specific view (e.g., "geometric" or "Adams conditioning" advocates) but lacks universal justification.  
    - **Tension**: Requirements 5b (allowing \(P(R)\) to shift) and 8 (distinguishing sub-partitions) **conflict** with the parochial no-shift view. I argue they are jointly satisfiable, but Judy Benjamin exposes a tear:  
      - *Pro-shift*: Minimal-information approaches (e.g., MaxEnt) shift \(P(R)\) to avoid distorting relative odds within \(R\).  
      - *Anti-shift*: If the update *can* satisfy the constraint without altering \(P(R)\), why shift?  

  ---

  ### **IV. Scoring Candidate Theories**  
  Key families scored against desiderata (1–10). I address:  
  - **Order-invariance**: For sequences of conditional constraints.  
  - **Joint feasibility**: When constraints are compatible individually but force a cell to zero jointly.  
  - **Unreliable sources**: Whether constraints are treated as "hard" (must be satisfied) or "soft" (can be discounted).  

  | **Candidate Theory**               | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 (Synch) | 9 (Diachronic) | 10 | Notes |  
  |------------------------------------|---|---|---|---|---|---|---|---|-----------|----------------|----|-------|  
  | **MinEnt (Relative Entropy)**      | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓ | ✓         | ✗              | ✓  | Minimizes \(D_{\text{KL}}(P_{\text{post}} \parallel P_{\text{prior}})\). Shifts \(P(R)\) in Judy Benjamin. Order-invariant only for compatible constraints; treats constraints as hard. Joint constraints forcing zero are handled gracefully. |  
  | **Conditioning on Material Conditional** | ✗ | ✗ | ✗ | ✗ | ✗ | ✗ | ✗ | ✗ | ✗         | ✓              | ✗  | Fails 1–8: Treats \(P(A\|B)\) as \(P(B \to A)\), violating triviality (7) and Judy Benjamin (5). Order-invariant but incoherent. |  
  | **Jeffrey-Style Direct Update**    | ✓ | ✗ | ✗ | ✓ | (✓) | ✓ | ✓ | ✗ | ✓         | ✗              | ✗  | Sets \(P_{\text{post}}(A\|B) = p\) but keeps \(P_{\text{post}}(B) = P_{\text{prior}}(B)\). Fails 2 (no collapse) and 3 (not general Jeffrey). Judy Benjamin: No shift in \(P(R)\) (parochial satisfaction). Not order-invariant. |  
  | **Deflationary/No General Rule**   | ✓ | ✗ | ✗ | ✓ | ?  | ✓ | ✓ | ✓ | ?         | ✗              | ✗  | Adopts constraint as new state; no rule for minimal change. Fails 2,3,9–10. Unreliable sources handled ad hoc. |  
  | **Geometric (M-Projection)**       | ✓ | ✗ | ✗ | ✓ | (✓) | ✓ | ✓ | ✗ | ✓         | ✗              | ✓  | Minimizes \(D_{\text{KL}}(P_{\text{prior}} \parallel P_{\text{post}})\). Keeps \(P(R)\) fixed in Judy Benjamin (parochial). Fails 2,3,8. Not order-invariant. |  

  **Legend**: ✓ = Satisfies, ✗ = Fails, ? = Depends on agent's choice, (✓) = Satisfies parochial view.  
  **Scoring Notes**:  
  - **Most Exclusionary Requirement**: **#2 (Collapse to Conditionalization)**. It excludes all but MinEnt and deflationary approaches, as others fail to handle extreme probabilities correctly.  
  - **Order-Invariance**: No theory is fully order-invariant for conditional constraints. MinEnt handles commutativity only for compatible constraints.  
  - **Joint Feasibility**: MinEnt handles jointly forcing constraints by renormalization; others may fail (e.g., Jeffrey-style if constraints conflict with fixed \(P(B)\)).  
  - **Unreliable Sources**: All listed theories treat constraints as "hard." MinEnt can extend to soft constraints via weighted entropy; others lack a principled mechanism.  

  ---

  ### **V. Key Tensions and Conclusions**  
  - **Judy Benjamin Tear**: Requirement 5b (allowing \(P(R)\) to shift) conflicts with parochial no-shift demands. MinEnt satisfies 5b but faces criticism for "ignoring silence." Jeffrey/geometric rules satisfy the parochial view but fail collapse (#2) and partition reduction (#3).  
  - **Unresolvable Conflict?**: Requirements 2 (collapse), 3 (Jeffrey reduction), and 8 (sub-partition distinction) **cannot be jointly satisfied** by existing candidates. MinEnt satisfies 2 and 8 but not 3 for arbitrary partitions; Jeffrey satisfies 3 but not 2 or 8.  
  - **Recommendation**: Begin with MinEnt as the most robust (satisfies 8/10 core requirements), but acknowledge Judy Benjamin objections. The tension between informational economy (allowing \(P(R)\) to shift) and conservatism (fixing \(P(R)\)) is fundamental—no theory escapes this dilemma.  

  This specification provides a foundation for evaluating update rules. Use it to analyze proposals in class, focusing on how they resolve the Judy Benjamin tear.
