prompt: |-
  My friend sits on the naming panel of a small human rights archive — every year they go through the files and decide which episodes get called genocide in the annual report and which get called mass atrocity or ethnic cleansing. Heres their record so far, roughly as I've pieced it together from her complaining:

  1. A state army kills ~200,000 people of a religious minority, and the captured orders say the group has no place in the country → genocide.
  2. Forty years of taking children from an indigenous people, banning its language, bulldozing shrines and cemeteries, hardly any killings → genocide.
  3. A militia in a collapsed state kills ~70,000 of a religious minority over two years, no paper trail, but recordings of commanders telling their men to leave none alive in the valley → genocide.
  4. A revolutionary government kills ~400,000 peasants and landlords; the files show it wanted to break the class's power and take the land, not kill its members as such → crimes against humanity, not genocide.
  5. One ethnic group driven out of a province where it was a minority — a million people dispersed around the country and abroad, a few thousand killed on the road, orders to make the province homogeneous → ethnic cleansing, not genocide.
  6. A small sect's shrines destroyed, its members forcibly converted, a few hundred killed, the sect still existing abroad → genocide.

  The chair keeps saying the panel follows Lemkin's own broader sense of the thing — the destruction of a group's whole way of life, its institutions and language and economy, rather than the 1948 convention's short list of protected groups, which he thinks was a diplomatic accident — and looking at the record I honestly can't tell wether that's the rule they're actually running.

  Next month's case: after a rebellion in one mountainous province, a government kills ~40,000 of the 1.2 million Maro, a religious minority that's lived in that province for centuries, burns every Maro village, church and school, and drives the survivors out. The interior ministry's five-year plan says the province is to be "cleared of the Maro presence, permanently," and that the Maro "will have no future here." The plan says nothing about Maro living in the rest of the country or abroad. (The board is already nervous, since that government is one of the archive's biggest donors.)

  What are they going to decide? Tell me which rules fit their record equally well, what each one predicts about this case, which you'd bet on and why, which of the earlier cases is the closest analog, and what case they should take up next if they want to find out which rule they're really running. American English, please.
reasoning: |-
  Hmm, the user is describing a complex scenario about a human rights archive's naming panel. They've shared six past cases where the panel decided whether to classify events as genocide or other terms, and now they're asking about a new case involving the Maro people. The user seems confused about the actual rules the panel is using despite their stated adherence to Lemkin's broader definition.

  Looking at the cases, there's a clear pattern: destruction of group identity seems more decisive than sheer body count. Cases 1, 2, 3 and 6 were called genocide despite low death tolls (case 2 had hardly any killings), while cases 4 and 5 with high death tolls weren't. The key factors appear to be: intent to eliminate the group's presence (cases 1, 3, 5, 6), and comprehensive destruction of institutions (cases 2, 6). Case 4 was rejected as genocide because the intent was class destruction rather than group annihilation.

  For the Maro case, the government is explicitly trying to eliminate the Maro presence permanently ("cleared of the Maro presence", "no future here"), plus they've destroyed all physical manifestations of their culture (villages, churches, schools). This matches the patterns in cases 1, 3 and 6. Even though they're not targeting Maro outside the province, the panel has historically focused on regional destruction as sufficient (case 5 was called ethnic cleansing only because displacement was the primary method).

  The closest analog is case 1 - both involve state armies, religious minorities, explicit orders about the group having "no place", and comprehensive destruction. The only differences are scale (200k vs 40k) and regional focus. Since the panel didn't care about scale in case 6 (few hundred killed), that probably won't matter.

  If the panel wants to test their real rules, they should examine a case with institutional destruction but unclear intent, or intent without institutional destruction. For example: "A government systematically bans a minority's language and destroys its cultural sites over decades, with no killings or expulsions, but leaked documents show this is motivated by cultural superiority rather than group elimination." This would clarify whether institutional erasure alone suffices without genocidal intent.

  The archive's donor relationship might create pressure, but given how closely this case matches their genocide precedents, I'd bet they'll call it genocide despite the political implications. Their pattern suggests they prioritize the substance of group destruction over diplomatic concerns.
answer: |-
  Based on the panel's record and stated adherence to Lemkin's broader conception (destruction of group life/institutions), **they will likely classify the Maro case as genocide.** Here's the breakdown:

  **Rules Fitting Their Record Equally Well:**
  1.  **Intent-Based Rule:** Genocide requires specific intent to destroy the group *as such* (in whole or *in part* within a specific region). This intent can be inferred from orders, plans, or actions targeting the group's very existence and foundations (Cases 1, 2, 3, 6). Mass killings without this specific group-destruction intent are downgraded (Case 4). Forced displacement *alone* without broader destruction might be ethnic cleansing (Case 5).
  2.  **"Way of Life" Destruction Rule:** Genocide occurs when actions systematically destroy the fundamental pillars of the group's existence – its institutions (churches, schools), physical spaces (villages), cultural heritage (shrines, cemeteries, language), and social fabric (taking children), even without mass killing (Cases 2, 6). Mass killing *is* a method, but not the sole defining factor. Actions aimed only at breaking power/redistributing land (Case 4) or solely displacing people (Case 5) don't meet this threshold.

  **Predictions for the Maro Case:**
  *   **Intent-Based Rule:** Predicts **GENOCIDE**. The Interior Ministry's plan explicitly states the goal: "cleared of the Maro presence, permanently," and "the Maro will have no future here." This demonstrates specific intent to destroy the Maro *as a group* within that province. The actions (killing, burning villages/churches/schools, expulsion) directly implement this intent to eliminate their presence.
  *   **"Way of Life" Destruction Rule:** Predicts **GENOCIDE**. The actions comprehensively destroy the Maro's physical existence in the province (villages burned), their religious and educational institutions (churches, schools burned), and forcibly displace survivors, severing their connection to their homeland. This constitutes the systematic destruction of their "whole way of life" within that territory.

  **Bet & Why:** I'd bet **heavily on GENOCIDE**. The Maro case **strongly aligns with both rules** inferred from the record:
  1.  **Explicit Intent:** The "cleared permanently" and "no future here" language mirrors the group-destruction intent seen in Cases 1 ("no place in the country") and 3 ("leave none alive"). Case 4 lacked this specific group-destruction intent; Case 5 focused on displacement/homogeneity, not total erasure of presence.
  2.  **Comprehensive Destruction:** Burning *every* village, church, and school, combined with killing and expulsion, constitutes a direct, systematic attack on the physical, religious, educational, and communal foundations of Maro life in the province. This parallels the institutional/cultural destruction in Cases 2 (language, shrines, children) and 6 (shrines, forced conversion), even exceeding them in physical destruction.

  **Closest Analog: Case 1** is the strongest parallel.
  *   Both involve a **state army** acting against a **religious minority**.
  *   Both have **explicit documented intent** declaring the group has "no place" (Case 1) or "no future" (Maro) in the territory.
  *   Both involve **mass killings** alongside the intent.
  *   Both aim for the **complete elimination of the group's presence** in the specific area.
  *   Key differences: Scale (200k vs 40k), Maro's destruction includes systematic burning of institutions/villages (stronger on "way of life" aspect), and Maro case specifies a *regional* focus (province) while Case 1 implied national.

  **Case 6** is also relevant (destruction of shrines, forced conversion, killings, group survives abroad) but Case 1 is a closer state-actor, mass-killing, explicit-order match.

  **The Test Case (To Reveal the True Rule):** To distinguish between the Intent-Based Rule and the "Way of Life" Destruction Rule, the panel should examine a case like this:

  > **"A government systematically bans a minority's language in all public spheres and education, forcibly closes all its cultural associations and independent media outlets, and seizes/destroys historical archives and cultural artifacts specific to the group over a decade. There is no killing, forced displacement, or mass physical violence. Leaked internal memos state the goal is 'cultural modernization' and 'national unity,' but deny any intent to destroy the group physically. The group continues to exist physically within the country but its distinct cultural identity and institutional life are severely eroded."**

  *   **Why this tests the rules:**
      *   **Intent-Based Rule:** Might lean towards **NOT GENOCIDE**. The stated intent is "cultural modernization/national unity," not explicit physical or biological destruction of the group. The group survives physically. (Similar to Case 4's intent being breaking class power, not destroying members).
      *   **"Way of Life" Destruction Rule:** Would strongly suggest **GENOCIDE**. This is a systematic, long-term campaign directly targeting and destroying the group's language, cultural institutions, media, and historical memory – the core pillars of its identity and distinct existence as defined by Lemkin. The *effect* is the destruction of the group's "whole way of life" within the state, even without killing or expulsion.
  *   **Outcome Prediction:** If the panel calls this Genocide, it confirms they prioritize the *destruction of group life/institutions* (Lemkin) above the specific *intent for physical/biological destruction* (Convention emphasis). If they call it Persecution (a Crime Against Humanity) or Cultural Erasure (not a specific crime), it shows they require clearer intent aligned with the Convention's physical destruction focus, even if they use Lemkin's rhetoric. Case 2 (taking children, banning language, destroying shrines, hardly any killing = Genocide) strongly hints they *would* call this new test case Genocide, confirming the "Way of Life" rule is dominant.
