  The core tensions are: 
  - Physics vs. phenomenology (how relativity relates to lived experience)
  - Ontology vs. epistemology (what exists vs. how we know it)
  - Descriptive vs. normative claims (what physics describes vs. what it implies for meaning)

  For Nadia's position, I'll ground her in presentism-compatible interpretations of relativity like Fine's fragmentalism or Maudlin's primitive becoming, avoiding denial of physics. She should challenge the inference from frame-relativity to eternalism. The brother must defend the necessity of eternalism from relativity's principles without determinism. Their debate should pivot on whether "real" must mean "frame-invariantly real" - that's likely the disagreement nucleus.

