answer: |-
  Here’s a breakdown of the tensions in the room and how the speech can navigate them, followed by the speech itself:  

  **Tensions & Strategy:**  
  1. **Relatives** (protective of family memory; wary of fictionalization):  
     - *Can resolve*: Their need for respect and honesty about Rose’s real life.  
     - *Can only hold*: Discomfort with inventions (esp. stillbirth). Speech must validate their closeness to Rose while framing fiction as an act of care, not betrayal.  

  2. **Local Historians** (guardians of factual truth; distrust fiction):  
     - *Can resolve*: Their skepticism by admitting inventions upfront and distinguishing fact from interpretation.  
     - *Can only hold*: Fundamental disagreement about fiction’s role. Speech must show rigor without arguing "deeper truth."  

  3. **Climbing Buddies** (short attention spans; there for wine):  
     - *Can resolve*: Boredom via bluntness, brevity, and no jargon.  
     - *Can only hold*: Indifference to ethics. Stick to 6 minutes.  

  **The Speech (6 mins, plain/dry tone):**  
  ---  
  (Opening)  
  "Thanks for coming. For those who don’t know me, I’m [Your Name]. I’m a backend engineer by day. For the last three years, I’ve spent nights and weekends writing a novel about my great-great-grandmother, Rose [Last Name]. Born in Ireland around 1860. Came here as a teenager. Worked forty years in a mill-town laundry. Left a diary.  

  (Setup the Source)  
  That diary is why we’re here. My aunt was kind enough to photocopy it for all of us. You’ve seen it: 95% weather, grocery lists, the price of flour. And then, six pages where her handwriting changes. Where she’s clearly not okay. That diary, and two newspaper clippings, are the only sources I had.  

  (The Challenge)  
  Writing about a real person—especially one so spare in her own records—forces hard choices. Rose’s diary gives us facts, but not the weight of them. It tells us *what* she did, but rarely *how* it felt. So I had to fill gaps. But filling gaps responsibly means knowing which gaps you’re allowed to fill.  

  (The Framework - Ledgers)  
  Here’s how I thought about it: There are two kinds of truth here. First, the ledger of *what actually happened*. Dates, names, events. You spend from that ledger carefully, only when the evidence is clear. Second, the ledger of *what it meant to be her*. The exhaustion of the laundry, the loneliness of an immigrant, the silence in those six diary pages. That ledger? You can spend from it more freely—but you can’t just invent deposits. You build from the receipts she left.  

  (The Kitchen Test)  
  But even then, some inventions felt… heavier. I made a rule: Before adding something big, I’d ask, ‘Would I say this in Aunt [Name]’s kitchen, with the word *invented* attached?’ If not, it shouldn’t go in. I used that test. I followed it twice. I broke it once.  

  (The Invented/Real - Direct & Quick)  
  So, plainly:  
  1. **I invented why her husband left**. Family says he vanished. The book says she threw him out. I did that because it gives her agency. But it’s not proven.  
  2. **I invented her friendship with a union organizer**, and I implied it was romantic. The diary has no names, just gaps. I used that to show she had inner worlds we don’t see.  
  3. **I invented a stillbirth**. No record exists. I included it because those six diary pages felt like a scream into a void. That fails the kitchen test. I regret that.  
  4. **One thing I refused to invent? Her voice**. When she *does* speak in the diary—about the weather, the price of tea—that’s hers. I didn’t touch it.  

  (Closing)  
  This book isn’t Rose’s life. It’s my attempt to measure the distance between her reality and her silence. If you knew her, or her daughter, I hope it feels like respect. If you’re here for history, I’ve listed every departure from fact in the afterword. And if you’re here for the wine? The bottles are open. Thank you."  
  ---  

  **Backup Sentence (if aunt stands):**  
  "Aunt [Name], I know that photocopy is why we’re all here tonight—and I’m grateful you gave us all access to her real words."  

  **First Line to Cut if Long:**  
  The entire paragraph starting with *"That diary is why..."* down to *"...only sources I had."* (Cuts 30 secs; preserves ethics framework).  

  **Why This Works:**  
  - **Ledgers/Kitch Test Drive Structure**: They’re not named as concepts but *frame* the speech:  
    - Ledgers = Why you distinguish facts (husband’s departure) from interpretation (exhaustion/loneliness).  
    - Kitchen Test = Why stillbirth is singled out as a regret.  
  - **Owns Inventions Without Apology**: Lists them clinically ("I invented..."). No "deeper truth" justification.  
  - **Handles "She’s Not Here to Mind"**: By focusing on *respect for those who knew her* (relatives) and *transparency* (historians).  
  - **Engineer Voice**: Short sentences. Active verbs ("I invented," "I refused"). No metaphors.  
  - **Ends on Action**: "Bottles are open" resets tone for mingling.
