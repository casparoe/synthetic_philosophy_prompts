prompt: |-
  I cover evolutionary biology for a general-interest science magazine, and I have reached the point where I cannot write another story about the fights over levels of selection without a standard to hold the claims to. Researchers send me papers and press officers send me releases announcing that selection has been shown to act on genes, or on groups, or for the good of the species, and I have no principled way to tell a claim that adds something from a redescription of something we already knew. So before I write, I want the specification. What does any theory of the units and levels of selection have to deliver to be adequate to that job — the cases it must get right, the distinctions it must not collapse, the formal results it must live with, the questions it must answer — with the case or consideration behind each requirement?

  Take the following as the minimum it has to cover, and add whatever else a working theory cannot duck: a gene that cheats the meiotic lottery and so spreads at the expense of the rest of the genome; an inherited microbe that spreads by turning its host's offspring into daughters, at the host's cost; a sterile worker ant that rears the queen's offspring and has none of its own; an alarm call that raises the caller's chance of being eaten and lowers everyone else's; a trait that is good for the group and bad for the individual, and its mirror image; and the fact that the entities we call individuals are themselves historical products, assembled out of things that were once free-living.

  Spell the distinctions out rather than naming them: between the level at which selection is acting and the level at which a trait's benefit accrues; between an entity's being selected and its being the thing whose variation is merely being tracked; between a collective as a bearer of fitness and a collective as a unit that reproduces; between selection and drift or transmission bias. Then the formal constraints. The bookkeeping result usually called the Price equation splits a change in frequency into a within-group and a between-group part, and it is an algebraic identity, true of any partition of any population, so a theory that leans on it has to say what its results rule out and what they merely restate. The same goes for the condition usually called Hamilton's rule, which tells you when a costly behaviour can spread by benefiting relatives: say what it settles about the level at which selection is acting and what it leaves open.

  Then the part I most want. Tell me which of these requirements are genuine and which are one camp's preference dressed up as a constraint. Flag any pair or subset that cannot be jointly satisfied, and say which one you would surrender. Finish by identifying the single requirement that does the most to exclude the main contending positions.

  Take a position throughout. I do not want a menu of options and a shrug; make the calls, give your reasons, and tell me where your position would be most vulnerable if someone pushed on it. No reading list and no citations — what I need is the reasoning.
reasoning: |-
  Okay, the user is an evolutionary biology writer for a science magazine dealing with the levels of selection debate. They're overwhelmed by conflicting claims about selection acting on genes, groups, or species, and need a principled way to evaluate these claims. They want a standard that distinguishes meaningful contributions from mere redescriptions.

  The user provided several key examples that must be covered: meiotic drive genes, inherited microbes manipulating sex ratios, sterile worker ants, sacrificial alarm calls, group vs individual benefit traits, and the evolutionary assembly of individuals from formerly independent entities. They also want explicit distinctions between different concepts like level of selection vs benefit accrual, selected entities vs tracked variation, collectives as fitness bearers vs reproductive units, and selection vs drift/transmission bias.

  Formal constraints include clarifying what the Price equation actually shows (since it's mathematically true but interpretation-dependent) and what Hamilton's rule determines about selection levels. The user wants to know which requirements are genuine versus which are camp preferences, which are incompatible, and which single requirement does the most to exclude major positions.

  This is a complex request requiring deep engagement with evolutionary theory. The user needs a clear framework to evaluate claims about levels of selection. They're frustrated with superficial treatments and want rigorous distinctions. The response must take a firm position while acknowledging vulnerabilities.

  The core challenge is developing a selection criterion that avoids being vacuous. The key insight might be that selection requires heritable variation in fitness - but this alone isn't sufficient. The proposed solution focuses on whether the entity in question has the causal structure to respond to selection pressures over evolutionary time, meaning it must possess intrinsic fitness and heritability.

  For each example: meiotic drive genes clearly meet this criterion; microbial sex-ratio manipulators do too; sterile workers are selected at the colony level; alarm calls require context-dependent analysis; group-beneficial traits only qualify if groups have necessary properties. The assembly of individuals shows that "individuality" evolves through similar criteria being met at higher levels.

  Regarding formal tools: the Price equation is mathematically true but its biological meaning depends on context. Hamilton's rule describes conditions for trait spread but doesn't specify selection level. Some requirements conflict - particularly those insisting on a single "correct" level versus those recognizing multi-level selection. The most exclusionary requirement is likely the demand for intrinsic fitness, which rules out gene-centric views that reduce everything to gene frequencies.

  The position's main vulnerability is that "intrinsic fitness" might appear circular or vague. The defense is that it corresponds to measurable causal structures in nature. This framework provides concrete criteria for evaluating claims about levels of selection in evolutionary biology.
answer: |-
  Here is a specification for an adequate theory of units and levels of selection, built from first principles to handle your cases, enforce key distinctions, respect formal constraints, and expose genuine conflicts. I take a *causal-interactionist* position, prioritizing the organization of heritable variation in fitness:

  1.  **The Core Mandate: Define "Selection For" Causally**
      *   **What it must deliver:** Identify *which entity's properties causally explain its differential persistence/reproduction in a given environment*, compared to variants. Selection acts *for* a trait *of* an entity when that trait is a direct cause of the entity's fitness difference.
      *   **Why:** Avoids conflating *correlation* (e.g., a gene tracking group success) with *causation* (e.g., a group trait causing group success). Distinguishes the beneficiary (e.g., the gene in meiotic drive) from the level where the causal fitness difference manifests (the gamete/cell/organism in which the drive occurs).
      *   **Case:** A sterile worker ant's trait (e.g., nursing) is *selected for* because it causally enhances the fitness (colony reproduction) of the entity (the colony) of which it is a part. The worker is not a unit of selection *itself* (it has zero intrinsic fitness), but a part of one.

  2.  **Distinguish: Level of Causal Interaction vs. Level of Benefit Accrual**
      *   **What it must deliver:** Clearly separate the level at which the *fitness-consequence interaction happens* from the level that ultimately *gains or loses representation*.
      *   **Why:** Essential for understanding conflicts. A gene benefits (accrual) by causing a cellular interaction (causal level). A microbe benefits (accrual) by manipulating host physiology (causal level: host organism). A group-beneficial trait (accrual: group) must cause group survival/reproduction (causal level: group) to be selected *for* at that level.
      *   **Case:** Inherited microbe manipulating host sex ratio: Selection acts *on the microbe* at the *within-host* level (microbes compete to be transmitted via eggs). The *benefit accrues* to the microbe lineage. The *cost* is imposed on the *host organism's* fitness (reduced sons). The causal interaction is microbial gene products manipulating host development.

  3.  **Distinguish: Entity Selected vs. Entity Tracked**
      *   **What it must deliver:** Identify when an entity (e.g., a gene) is *itself* the unit of selection (its properties cause its fitness differences) vs. when its frequency change is merely a *consequence* of selection acting on a higher-level entity it's part of.
      *   **Why:** Prevents misattribution. A gene "for" a group-beneficial trait isn't *necessarily* selected at the gene level; it might just be tracking group selection.
      *   **Case:** A gene "cheating" the meiotic lottery *is* a unit of selection: its property (drive mechanism) *directly causes* its over-representation in gametes relative to competitors *within the same meiosis*. Its frequency change isn't just tracking organismic fitness.

  4.  **Distinguish: Collective as Fitness Bearer vs. Collective as Reproductive Unit**
      *   **What it must deliver:** A collective (group, colony) is a *unit of selection* only if it possesses *heritable variation in fitness* **and** that fitness is a property *of the collective itself* (not just the sum of its parts), arising from interactions *within* the collective. Crucially, it must be a *reproductive unit* – new collectives must arise primarily from the reproduction of existing collectives, not just de novo assembly.
      *   **Why:** Avoids labeling any aggregation as a unit of selection. Defines the "individuality" threshold for higher levels.
      *   **Case:** A sterile worker ant colony *is* a unit of selection: it has heritable variation in colony fitness (reproduction of new queens/kings), driven by collective traits (division of labor, defense) arising from internal interactions. New colonies are founded *by* reproductive units produced *by* existing colonies. A temporary herd of wildebeest is *not* – its "fitness" is just the sum of individual wildebeest fitnesses; new herds form de novo.

  5.  **Distinguish: Selection vs. Drift/Transmission Bias**
      *   **What it must deliver:** Attribute frequency change to *differential fitness caused by trait-environment interaction* (selection) vs. *sampling error* (drift) vs. *non-fitness biases in inheritance/replication* (e.g., meiotic drive, vertical transmission fidelity).
      *   **Why:** Prevents miscategorizing non-selective processes as selection. Meiotic drive is a transmission bias *enabled* by the cellular machinery, not classical organismic selection *for* drive.
      *   **Case:** Meiotic drive is a *transmission bias* acting *at the genic level within the cellular machinery*. The gene is selected *for* its drive mechanism, but the *process* causing its spread is distinct from organismic natural selection. Drift is significant for small groups or traits with weak fitness effects.

  6.  **Formal Constraints: Interpreting Price & Hamilton**
      *   **Price Equation:** An adequate theory must acknowledge that the equation is an accounting identity. The crucial task is **interpreting the covariance terms causally**. A positive `Cov(w_i, z_i)` term only indicates selection *at level i* if the traits `z_i` *cause* the fitness differences `w_i` *at that level*. Partitioning (within/between groups) doesn't *define* levels; it reveals where the causal fitness differences are statistically associated. A theory leaning on Price must specify the *biological meaning* of the groups in the partition and the *causal origin* of the covariances.
      *   **Hamilton's Rule:** `rb > c` is a *condition for spread*, not a *specification of level*. It shows when a costly trait (`c`) can spread due to benefits (`b`) to relatives (relatedness `r`). It **does not settle the level of selection**. The trait could spread due to:
          *   Kin selection acting *at the individual level* (individuals favoring relatives).
          *   Group selection acting *at the group level* (groups with more altruists out-reproducing groups with fewer).
          *   Or a combination. Hamilton's rule is agnostic; the causal level depends on *where* the fitness differences causing the spread manifest (see Core Mandate #1). An alarm call might satisfy `rb > c` because callers *within* a group are more likely to have relatives nearby (kin selection) *or* because groups with callers survive predation better (group selection), or both.

  **Evaluating Requirements & Conflicts:**

  *   **Genuine Requirements:** Core Mandate (Causal "for"), Distinction 1 (Causal vs. Accrual), Distinction 2 (Selected vs. Tracked), Distinction 3 (Collective Fitness Bearer/Repro Unit), Distinction 4 (Selection vs. Drift/Bias), Causal Interpretation of Price Covariance, Hamilton's Rule as Spread Condition (not Level Specifier), Accounting for Historical Assembly of Individuals.
  *   **Camp Preferences Dressed Up:** Insisting selection *must always* be reducible to the gene level (ignoring emergent fitness at higher levels). Insisting group selection *never* occurs or is always "really" kin selection (ignoring the Collective Fitness/Repro Unit distinction). Demanding that the "true" unit *must* be the "replicator" (ignoring that selection acts on interactors).
  *   **Irreconcilable Conflict:** Gene-Centrism vs. Emergent Higher-Level Units. The core conflict is whether entities with emergent, heritable fitness arising from internal interactions (like ant colonies) can be genuine units of selection in their own right. **I surrender strict gene-centrism.** Selection *can* act at multiple levels. While genes are the fundamental replicators, selection operates on the interactors (vehicles) whose properties causally determine which replicators get passed on. These interactors can be nested.
  *   **The Most Excluding Requirement: The Collective as Reproductive Unit with Intrinsic Fitness.** This requirement does the most to exclude major contenders:
      *   **Excludes Naive Group Selection:** Many "group selection" claims fail because the groups aren't real reproductive units with heritable variation in intrinsic fitness (e.g., temporary herds). It forces a rigorous definition.
      *   **Excludes Strict Gene-Centrism:** It forces the acknowledgement that entities like cohesive, reproducing colonies *do* have heritable fitness that isn't reducible to the sum of individual fitnesses without remainder (the fitness *is* the colony's reproductive output).
      *   **Excludes "Species Selection" Lite:** Most proposed cases of species selection fail because species are rarely reproductive units with heritable variation in emergent species-level traits causing differential speciation/extinction. They are often collections of organisms, not cohesive individuals.

  **My Position's Vulnerability:**

  The biggest vulnerability is defining "intrinsic fitness" and "causal interaction" robustly enough to avoid circularity or arbitrariness, especially for nascent higher-level units. When does a collection of cells/individuals transition from being a mere aggregate to having "intrinsic fitness" as a collective? How integrated must the interactions be? This relies on empirically identifying cohesive, reproducing entities with measurable heritable fitness variation arising from their collective organization. Critics might argue the line is fuzzy and the "intrinsic fitness" of the collective is always decomposable (even if complexly) into interactions among lower-level units. My defense is that the *causal structure* of fitness differences – whether they stem from properties of the collective entity itself interacting with the environment – is what matters, and this is empirically investigable (e.g., measuring colony fitness vs. average worker fitness in ants). The historical assembly of organisms from symbionts provides strong evidence for this transition happening.

  **In essence:** A theory must identify the entities whose properties causally produce heritable fitness differences in their environment, acknowledge that such entities can exist at multiple nested levels (from genes to superorganisms), rigorously define the criteria for collective units (fitness, heritability, reproduction), distinguish causal processes from mere correlation or tracking, and correctly interpret formal tools as accounting frameworks requiring causal hypotheses. The requirement for a collective to be a reproductive unit with intrinsic fitness is the sharpest tool for cutting through the noise.
