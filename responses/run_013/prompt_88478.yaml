prompt: |-
  My reading group just finished a unit on distributive justice and i keep getting dragged into the same fight in the group chat: any time someone brings up prioritarianism, someone else trots out the leveling-down objection — the (1,1) versus (1,100) thing, where a view that gives priority to the worse off is supposed to be committed to dragging the better-off person down even though nobody ends up better off. And every single time, the prioritarian in the room says some version of: thats a problem for egalitarianism, not for prioritarianism, prioritarianism cares about absolute levels, and then everyone nods and we move on. Which is fine as far as it goes but it feels like a dodge, and someone keeps saying the magic word separability without explaining what work its doing. So please actually make the case that prioritarianism is not committed to leveling down, and make it without leaning on the it's-really-egalitarianism move — assume the reader already knows that line and is unimpressed by it. I want the structural reason, something about how the view aggregates across people or how it treats one person getting worse, not an argument about which label belongs to which doctrine. If the real answer does turn on separability then say so and spell out exactly how, dont just drop the word.

  To keep this from being a rehash of stuff i've already read a hundred times: i've been messing around with a variant where the priority weight isn't a function of your absolute level at all but of your gap to whoever is best off, so the furthest-behind person gets the most weight but the weight tracks the distance rather than the level. My gut is that this comparative version is the one that actually gets bitten by a leveling-down-style result, because if you pull the top person down then everyones gap shrinks and the view loses its reason to care — but i might just be confusing myself, and i'd rather you work out honestly which version survives and where the other one breaks. If the gap version does survive, show why the usual leveling-down intuition misfires on it; if it falls, say precisely which step fails and whether ordinary prioritarianism shares that step.

  Give me exactly five numbered points, each one or two sentences, no intro and no conclusion — just the five claims in order, each one doing real work.
reasoning: |-
  Okay, the user is part of a reading group on distributive justice, and they keep having the same argument about prioritarianism and the leveling-down objection. They want me to explain why prioritarianism isn't committed to leveling down without just saying it's egalitarianism. They also mentioned a "gap version" of prioritarianism they're experimenting with, where priority weight depends on the gap to the best-off person rather than absolute level. They want me to honestly evaluate both versions.

  The key here is to address their frustration with surface-level debates and provide substantive structural reasons. They've heard the standard "that's for egalitarianism" rebuttal but find it unsatisfying. I need to dig into how prioritarianism aggregates welfare without relying on comparative gaps.

  For prioritarianism's core defense: The transformation function applied to individual welfare values before summing means leveling down always reduces total transformed welfare. Even if someone is worse off, making them even worse off without helping others decreases priority-weighted well-being. This structural feature prevents endorsing leveling down.

  Regarding their gap version: When priority weights depend on relative position rather than absolute welfare, leveling down the best-off person shrinks everyone else's relative disadvantage. This can make the post-leveling state have higher priority-weighted sum because the "distance" needing compensation decreases. This creates a perverse incentive for leveling down.

  The separability point is crucial here. Prioritarianism is separable because each person's contribution to overall goodness depends only on their own welfare, not others'. But the gap version violates separability since a person's weight changes based on others' positions. This structural difference explains why one view avoids leveling down while the other doesn't.

  I'll organize exactly five numbered points as requested—no intro/conclusion. Each point must do heavy lifting: (1) prioritarianism's transformation mechanics, (2) why leveling down reduces value, (3) gap version's dependence on comparisons, (4) how leveling down boosts its valuation, (5) separability as the dividing line. For the gap version point, I'll explicitly note that leveling down can look desirable—which directly answers their suspicion about which variant fails.
answer: |-
  Here are five numbered points addressing the core structural distinction:

  1.  **Prioritarianism transforms individual welfare first:** It assesses overall goodness by applying a concave transformation function *separately* to each person's welfare level (e.g., weighting gains to the worse-off more heavily) and then summing these transformed values.
  2.  **Leveling down always reduces transformed welfare:** Reducing *anyone's* welfare (like dragging the person down from 100 to 1) strictly decreases the sum of transformed values under prioritarianism, because the transformation function applied to their welfare is strictly increasing – lower absolute input always yields lower transformed output.
  3.  **The gap version makes weights relational:** In your variant, the priority weight assigned to an individual's welfare gain depends on their relative position (distance from the best-off), not solely on their absolute level; the weight changes based on *others'* welfare.
  4.  **Leveling down alters relational weights advantageously:** Reducing the best-off person's welfare (e.g., from 100 to 1 in (1,100) vs. (1,1)) shrinks everyone else's relative disadvantage (distance to the best-off), increasing the priority weight applied to *all* other individuals' welfare in the subsequent sum calculation.
  5.  **Non-separability causes the gap version's failure:** Because the gap version violates separability (an individual's contribution to overall value depends on others' levels), leveling down can *increase* the sum of priority-weighted welfare by boosting weights for others, creating the leveling-down implication that strict prioritarianism avoids.
