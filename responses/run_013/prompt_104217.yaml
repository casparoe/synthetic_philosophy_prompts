prompt: |-
  I spent thirty years as a geologist and only lately got into moral philosophy, so I'm missing a lot of the vocabulary. Here's a pattern I keep noticing and I don't have a word for it. Two people disagree quite deeply about what matters. Say one is a committed vegan and the other is devoted to keeping a family farm alive. They can still strike a bargain: the farmer spends a weekend helping build a wildlife refuge that the vegan cares about more than she cares about a weekend of her own time, and the vegan spends a weekend doing some chore that keeps the farm going, a chore she thinks matters less than the refuge does. Neither has changed their mind, each still thinks the other is weighting something wrongly, but by each of their own lights they both come out ahead. It isn't just ordinary trade, because what's being swapped isn't goods, it's effort spent on things the other person happens to value. And it isn't compromise, because nobody gives up a belief.

  Does this have a name? I assume it's been noticed before, and what I want is less the label than the boundaries: what's the closest existing idea (log-rolling? comparative advantage?) and exactly where does the analogy break? Two things I can't sort out on my own. First, does it still count if the thing you're doing for the other person is something you think is actually wrong, and not just lower priority? Second, does it matter if the two people share the same values but disagree about the facts -- is that the same phenomenon or a seperate one? If there's no established name, coin one and tell me what falls inside it and what sits just outside.
reasoning: |-
  Okay, let me start by unpacking the user's query. They have a background in geology but recently got into moral philosophy, so they might not be familiar with the jargon. They've noticed a pattern where two people with conflicting values collaborate without changing their beliefs, each benefiting from the other's efforts. They want to know if there's a term for this and the boundaries of the concept.

  First, I recall that the user mentioned examples like a vegan and a family farmer helping each other. The key points are: no change in beliefs, mutual benefit based on each person's value system, and trading effort rather than goods. The user also has two specific questions: whether doing something you think is wrong still counts, and if shared values with factual disagreements change the scenario.

  I remember that in philosophy, this resembles value-complementary cooperation. The term "principled trade" came to mind earlier, but I need to check if that's standard or if there's a better term. Log-rolling in politics is similar, but it's more about mutual back-scratching. Comparative advantage in economics might be analogous but focuses on efficiency in production, not necessarily moral disagreements.

  The user's deeper need seems to be understanding how such cooperation fits into moral frameworks. They might be looking for validation that collaboration without consensus is possible and ethically sound. Their geology background suggests they appreciate practical, real-world applications, so examples are crucial.

  For the first question about doing something morally wrong, it's tricky. If the vegan thinks farming is unethical, assisting the farm might cross a line. But if it's a lower priority, it might still fit. The boundary is whether the action violates a core moral principle. For the second question, if both value biodiversity but disagree on facts (like the refuge's impact), it's different. Here, cooperation could resolve through evidence, unlike fundamental value conflicts.

  I should clarify that value complementarity is the core concept. The term "principled trade" works as a label, emphasizing the retention of principles. Boundaries include no core principle violation and distinguishing value vs. factual disputes. The user's need for clear definitions and examples is essential here, so structuring the response with sections helps.
answer: |-
  This is a fascinating and perceptive observation! You're absolutely right that this phenomenon sits at an intersection of several ideas but isn't perfectly captured by any single common term. It's a crucial form of practical cooperation in pluralistic societies. Let's break it down:

  1.  **The Core Concept: Value-Complementary Cooperation (or Principled Trade)**
      *   **What it is:** Two or more parties, holding *fundamentally different* and potentially conflicting value hierarchies or moral frameworks, cooperate on specific actions. Each party contributes effort/resources towards a goal *the other values highly*, receiving effort/resources towards a goal *they themselves value highly*. Crucially, this cooperation occurs *because* of the differing valuations, not despite them. Neither party changes their core beliefs; each acts rationally *within their own value system* to achieve a net gain in value realization.
      *   **Why "Complementary"?** The differing valuations create an opportunity. What A values immensely is relatively low-cost for B to provide, and vice versa. Their values create a "fit" for exchange.
      *   **Why "Principled Trade"?** It emphasizes that the trade happens *while retaining* their core principles. They aren't compromising the principle itself, just directing effort based on the relative *weight* they assign to different outcomes.

  2.  **Closest Existing Ideas & Where the Analogy Breaks:**
      *   **Log-Rolling:** This is the *closest political term*. It refers to legislators trading votes ("I'll vote for your bill if you vote for mine"). **Analogy:** It involves trading support for different *causes/goals* based on differing priorities, without necessarily changing beliefs. **Break:** Log-rolling often carries connotations of cynical deal-making, prioritizing personal/political gain over principle, and potentially supporting harmful policies. Your scenario emphasizes mutual benefit *within each actor's own moral framework* – the vegan *genuinely* values the wildlife refuge more than her weekend, the farmer *genuinely* values farm continuity more than his. It's more transparently value-driven and potentially principled.
      *   **Comparative Advantage (Economics):** **Analogy:** It explains why trade is beneficial even when one party is less efficient at everything – it's about *relative* efficiency and opportunity cost. In your scenario, the farmer might be relatively "better" (or have lower opportunity cost) at farm chores than wildlife refuge work *from the vegan's perspective* (because the vegan values the refuge outcome so much more), and vice versa. **Break:** Comparative advantage fundamentally deals with the production and exchange of *goods/services* based on efficiency. Your scenario deals with the *valuation of outcomes* and the exchange of *effort directed towards morally charged outcomes*. The "currency" is moral weight/priority, not widgets or hours of labor in a vacuum.
      *   **Compromise:** **Analogy:** Both involve finding a way to cooperate despite disagreement. **Break:** Compromise typically involves *each party giving up something they value* (a belief, a goal, a portion of their demand) to meet in the middle. In your scenario, *neither gives up a belief or lowers their valuation of their own core goal*. They get *more* of what they value most by accepting less of what they value less (their own time/effort) to enable the other.
      *   **Pareto Improvement:** **Analogy:** A situation where at least one party is better off and no party is worse off. Your scenario fits this *if* we define "better off" strictly within each actor's own value system. **Break:** Pareto is a technical economic concept describing states of allocation. It's descriptive, not a *mechanism* for cooperation like the value-trade you describe. It doesn't capture the *process* of trading effort based on differing valuations of outcomes.

  3.  **Addressing Your Specific Questions:**

      *   **What if the action is seen as *wrong*, not just lower priority?**
          *   **Core Boundary:** This is the critical line. The scenario you described typically involves actions seen as *lower priority* or *less valuable* within one's own framework, but **not inherently immoral or violating a core deontological constraint**.
          *   **Crossing the Boundary:** If the vegan believes *participating in any farm activity* is inherently morally wrong (complicity in animal exploitation), then spending a weekend doing farm chores, even for a "greater good" (the refuge), becomes a violation of a core principle. This transforms the act. It's no longer just a low-priority task; it's an action she believes she *must not* do, regardless of consequences. Cooperation becomes much harder, if not impossible, on those specific terms. She might tolerate the farmer's actions or find another way to cooperate, but *directly performing* the "wrong" act is unlikely.
          *   **Gray Area:** The line can be fuzzy. Does the vegan see *all* farm work as inherently exploitative, or just certain practices? Does helping *this specific family farm* feel less wrong because she knows their practices? The feasibility of cooperation hinges on whether the requested action crosses a fundamental moral red line for the actor.

      *   **What if they share values but disagree on facts?**
          *   **Different Phenomenon:** This is distinct, though cooperation can still occur.
          *   **Shared Values, Disputed Facts:** Suppose both the vegan and farmer deeply value biodiversity. The vegan wants the wildlife refuge built *here* believing it's the best location. The farmer opposes it *here*, believing it will harm a rare plant species on *his* land (which he also values). They fundamentally agree on the *value* (biodiversity) but disagree on the empirical consequences (facts).
          *   **Cooperation vs. Resolution:** Cooperation might involve joint research, hiring a neutral ecologist, or agreeing on a different location. The *goal* (enhancing biodiversity) is shared. The disagreement is about *how best to achieve it*. The "trade" dynamic of your original scenario (I help your high-value goal, you help mine) is less central. The focus shifts to resolving the factual dispute to achieve the shared value. If they can't resolve the facts, they might end up in conflict despite shared values, unlike your original scenario where cooperation *exploits* the value difference.

  **Proposed Label and Boundaries:**

  *   **Label: Principled Value-Complementary Exchange (PVCE)** or simply **Value-Complementary Cooperation (VCC)**.
  *   **What Falls Inside the Concept (PVCE/VCC):**
      1.  Two or more agents with *conflicting fundamental values or moral priorities*.
      2.  Cooperation involves each agent contributing effort/resources *specifically towards an outcome highly valued by the other agent*.
      3.  Each agent acts *rationally within their own value system*: the value gained (the other's contribution to *their* high-priority goal) outweighs the cost (their own effort/contribution to the *other's* goal, which they value less).
      4.  **No change in core beliefs/values** occurs as a result of the exchange.
      5.  The exchanged "currency" is *effort directed towards morally significant outcomes*, not neutral goods/services.
      6.  The requested action does **not** violate a core deontological constraint ("thou shalt not X") for the performing agent; it is merely lower priority or less valued *by them*.

  *   **What Sits Just Outside (Key Boundaries):**
      1.  **Core Principle Violation:** If performing the action for the other party is considered *inherently morally wrong* by the actor, it falls outside. This crosses into potential complicity or moral injury.
      2.  **Shared Values, Disputed Facts:** Cooperation here aims for a *shared goal* by resolving factual disagreements. It lacks the essential element of cooperation *driven by and exploiting* fundamental value differences.
      3.  **True Compromise:** Situations where parties *modify their core demands or beliefs* to reach agreement (e.g., the vegan agrees to accept *some* animal products from the farm, the farmer agrees to reduce herd size).
      4.  **Neutral Trade:** Exchanging standard goods/services (e.g., the vegan buys vegetables from the farmer) where the value difference isn't the *moral hierarchy of the outcomes* but simply supply/demand or preference for the goods themselves.
      5.  **Coercion or Exploitation:** Situations where one party is forced into an exchange that doesn't genuinely benefit them within their value system.

  **In summary:** You've identified a powerful mechanism for cooperation in a morally diverse world – **Principled Value-Complementary Exchange**. It leverages differing priorities to create mutual gain without demanding belief change. Its core boundaries are defined by the *absence* of core principle violation during the exchange and the *presence* of fundamental value conflict (rather than mere factual disagreement) as the driver. It's distinct from log-rolling (less cynical), comparative advantage (different currency), and compromise (no surrender of principle). It's a pragmatic recognition that we can work together on what matters to each of us, even while profoundly disagreeing on what *should* matter most. Your geological eye for patterns has found a deeply important philosophical and practical one!
