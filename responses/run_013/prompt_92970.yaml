  Where the mapping strains: In the puzzle, the driver has a clear endpoint (exit 2 or final payoff). Leonard's "payoff" for solving his mission is existential collapse - he'd lose purpose. This is why he subverts the plan at the end. His true utility isn't finding John G; it's sustaining the hunt. The film thus warps the payoff structure itself.

