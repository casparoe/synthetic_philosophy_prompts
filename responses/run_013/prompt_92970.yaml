prompt: |-
  I'm teaching the decision theory unit in my rational choice course this term and I want to close it with Memento instead of yet another Newcomb handout, so I need a proper reading of the film through the absent-minded driver problem. Quick reminder of the puzzle in case its been a while: a driver is on a highway with two exits and he can't tell them apart or remember whether he's already passed the first one. Getting off at the first exit is worthless (payoff 0). Getting off at the second is the big prize (4). If he drives past both he's left with 1, better than the first exit, nowhere near the prize. Since he can't distinguish the intersections, whatever he does he does at both, so a pure strategy is either always exit (0) or always continue (1), and the mixed plan of exiting with probability one third is what maximizes the expected payoff from the planning stage (4/3). The weird bit is what happens if you reason from the driver's seat instead: I'm at some intersection, say I give it even odds that it's the first or the second, so exiting is worth (0+4)/2 = 2 and continuing is worth 1, so exiting looks better at every intersection, even though the plan of always exiting is the worst thing on the board. So the puzzle is really about whether you evaluate a plan or an act, and what it even means for a single person to randomize across time.

  What I want is a serious reading of Memento in those terms. Leonard can't retain anything past a few minutes, he acts off tattoos and Polaroids, and at any given moment he doesn't know how far along he is in the investigation, so he's a driver who has to act at a node he can't identify. But he's also not the puzzle's driver, because he's the one who installed the notes and the tattoos in the first place. He's a driver who can leave his future self instructions, and the whole Sammy Jankis story he tells (the wife who keeps asking for the insulin shot, testing whether he'll remember) turns out, on Teddy's account, to be his own story. And the ending looks like an agent deliberately choosing the plan that keeps him on the road forever rather than arriving: he already killed the real John G a year ago, Teddy tells him so, and he burns the evidence and tattoos Teddy's plate so the hunt restarts. I want you to say where that mapping really holds, where it does violence to the puzzle, and what it implies about the payoffs, is Leonard's payoff from driving rather than arriving, and is the film showing that the ex ante/ex post gap isn't only about uncertainty but about wanting a certain kind of life? And the form: the colour scenes run backwards so we in the audience also can't condition properly on where we are. Is that a gimmick or is the film making an argument with it?

  Also, does the film add anything to the debate that the puzzle on its own doesn't, something about self-deception, or about who gets to set the payoffs? If the honest answer is that Memento is a different problem wearing the driver's clothes, say so and tell me which problem it actually is.

  Please write it as continuous prose, no headings or bullet points or bold or tables, just the way you'd write it in an email. And dont give me a reading list or citations, I just want the argument.
