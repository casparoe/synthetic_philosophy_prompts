  Here are the seven leaves (views) we are trying to distinguish:

  1. **Real Gap**: The two options are genuinely incomparable (no fact of the matter about which is better).
  2. **Roughly Comparable**: They can be ranked only roughly (neither beats the other, but they aren't exactly equal either).
  3. **Exactly Equal**: The options are exactly equal, so flipping a coin is rational.
  4. **Ignorance**: There is a right answer, but I don't know it.
  5. **Single Scale**: There's only one scale (e.g., utility) and "incomparable" just means I haven't calculated it.
  6. **Choice Creates Value**: The act of choosing makes one option better (no fact before commitment).
  7. **Rule-Based**: The question "which is better?" is wrong; instead, I should ask which rule or policy I want to follow.

