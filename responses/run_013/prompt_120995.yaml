prompt: |-
  I did a physics undergrad and I'm now a couple years into a quantum foundations PhD, so I'm comfortable with Hilbert space, decoherence, relative states, the Everettian apparatus, and I've read enough Lewis to know that for him modal realism isnt just a metaphor or a façon de parler. Here's what I want. Take Lewis's modal realism and restate it, as faithfully as you can, in the vocabulary I actually use: the universal wave function, unitary evolution, decoherence, branching, entanglement, amplitudes, density matrices, the Born rule, no-collapse. Not a loose analogy or a vibe — actually do the translation claim by claim. Worlds are concrete; worlds are spatiotemporally isolated from one another; worlds are causally isolated; worlds are maximal; actuality is indexical; every world is of a kind with ours; possibilia aren't abstracta; transworld identity gives way to counterparts; the recombination principle tells you how many worlds there are. For each of those, say what the Everettian vocabulary says in the corresponding place, and whether the fit is clean, or whether you had to fudge it, and where.

  Then the part I actually care about: the residue report. What in Lewis has no counterpart in the physics vocabulary at all? My suspicion is that the indexicality of actuality is doing real work for him and that nothing in a wave function plays that role — but tell me if I'm wrong, or if it's the other way round and the physics has something Lewis can't express, like the fact that branches share a past and a common history, or that amplitudes come with numbers attached that are supposed to do probabilistic work while Lewis's worlds seem to come with nothing like that. And run the reverse question too: is there anything in Everettian QM — the measure problem, the emergence of branches, the way modern decoherence accounts treat worlds as approximate and non-fundamental — that Lewis's framework literally cannot say? If so, is that a defect of his framework or a sign that the Everettians are smuggling in metaphysics they haven't paid for?

  Last thing: tell me straight whether this translation shows that one of these is just the other in different clothes, or whether the residue shows they're answering different questions. My money's on the latter, but I want the argument, not the verdict.
reasoning: |-
  We are going to translate David Lewis's modal realism into the language of Everettian quantum mechanics (EQM). We'll go through each of the key claims of Lewis and provide the corresponding EQM concept, noting where the fit is clean and where we must fudge. Then we'll discuss the residue: what is in Lewis that doesn't appear in EQM, and vice versa.

  ### Key Lewisian Claims and Their EQM Translations

  1. **Worlds are concrete.**
     - *Lewis:* Each possible world is a concrete entity, just as real as our own.
     - *EQM Translation:* In EQM, the entire universe is described by a universal wave function. The wave function evolves unitarily and branches into multiple decohered components (worlds) due to entanglement and decoherence. Each branch (or "world") is concrete in the sense that it is a part of the physical reality described by the wave function. 
     - *Fit:* Clean. Both are concrete. However, note that in EQM the branches are not fundamental but emerge from the underlying quantum state via decoherence. But the concrete reality of the branches is maintained.

  2. **Worlds are spatiotemporally isolated from one another.**
     - *Lewis:* Worlds are disconnected; there are no spatiotemporal relations between distinct worlds.
     - *EQM Translation:* Decoherence leads to branches that are effectively dynamically isolated. The interference terms between branches become negligible, so the branches are approximately orthogonal and do not interact. However, note that they are all part of the same spacetime and the same wave function. There is no separation in space or time between branches; they are superposed in the same spacetime. 
     - *Fit:* Fudged. In EQM, the branches are not in separate spacetimes; they are superposed in the same space. However, due to decoherence, the branches are effectively isolated and there is no causal interaction. So the isolation is dynamical, not spatiotemporal. This is a key difference.

  3. **Worlds are causally isolated.**
     - *Lewis:* No causal interactions occur between distinct worlds.
     - *EQM Translation:* Decoherence ensures that the branches are dynamically autonomous: the future evolution of one branch does not depend on the others. This is because the decohered branches are orthogonal and remain so under unitary evolution. Thus, they are causally isolated.
     - *Fit:* Clean. The causal isolation in EQM is a direct consequence of decoherence and unitarity.

  4. **Worlds are maximal.**
     - *Lewis:* A world is a maximal mereological sum of spatiotemporally related things. It is all-inclusive: anything spatiotemporally connected to any part of it is part of it.
     - *EQM Translation:* In EQM, a branch (or world) is a decohered component of the universal wave function that is "maximal" in the sense that it represents a complete history of the universe (or a maximal set of compatible decoherent histories). However, note that branches are defined relative to a decoherence basis and a time. The maximality is approximate because decoherence is not perfect and the branching is not precisely defined at the fundamental level (it's emergent). 
     - *Fit:* Fudged. In EQM, the branches are not fundamental and their boundaries are vague (due to the approximate nature of decoherence). Moreover, the wave function is the fundamental entity, and branches are patterns within it. So while we can define a branch as a maximal decohered component at a given time, it is not a fundamental maximal object.

  5. **Actuality is indexical.**
     - *Lewis:* "Actual" is a term like "here" or "now": it refers to the world we are in. Every world is actual from its own perspective.
     - *EQM Translation:* In EQM, every branch is equally real. The term "actual" from the perspective of an observer in a branch refers to that branch. Thus, actuality is indexical: it picks out the branch in which the utterance (or the observer) is located.
     - *Fit:* Clean. This is a direct translation: each branch is actual to its observers.

  6. **Every world is of a kind with ours.**
     - *Lewis:* All worlds are on a par; they are all concrete and exist in the same way. There is no qualitative difference in the mode of existence.
     - *EQM Translation:* All branches are part of the same wave function and are described by the same physical laws (unitary evolution). They are all equally real and none is privileged.
     - *Fit:* Clean. This is a core tenet of EQM.

  7. **Possibilia aren't abstracta.**
     - *Lewis:* The inhabitants of other worlds are not abstract entities (like numbers or sets) but are concrete and physical, just like things in our world.
     - *EQM Translation:* The objects in other branches are physical, composed of the same quantum fields and particles as in our branch. They are not abstract but are patterns in the wave function.
     - *Fit:* Clean.

  8. **Transworld identity gives way to counterparts.**
     - *Lewis:* An individual exists in only one world. What we might call "the same individual" in another world is a counterpart: a similar individual in that world.
     - *EQM Translation:* In EQM, an individual is a pattern in a branch. The same pattern might appear in multiple branches (e.g., in the immediate aftermath of a branching event, the individual in different branches might be very similar). But as time passes, the individuals in different branches become distinct. We can define a counterpart relation: two individuals in different branches are counterparts if they share a common origin (they were the same individual before a branching event) and are similar in relevant respects. However, note that the wave function does not have a transworld identity: the individual in one branch is a different part of the wave function from the one in another branch.
     - *Fit:* Clean. Counterpart theory is a natural fit for EQM.

  9. **The recombination principle tells you how many worlds there are.**
     - *Lewis:* The principle of recombination states that anything can coexist with anything else, provided they are spatiotemporally compatible. This generates the plurality of worlds.
     - *EQM Translation:* In EQM, the set of branches is determined by the initial wave function and the unitary evolution. The branching structure is fixed by the dynamics and the interactions that cause decoherence. The "recombination" is constrained by the initial conditions and the Hamiltonian. The structure of the Hilbert space (which is fixed) and the evolution determine the possible branches. However, note that the initial wave function and the Hamiltonian might not allow every logically possible configuration. For instance, if the Hilbert space is finite-dimensional, then the number of distinct branches might be bounded. Moreover, the branches are not generated by free recombination but by the specific physical laws.
     - *Fit:* Fudged. The recombination principle in Lewis is a free and unrestricted combinatorial principle. In EQM, the set of branches is constrained by the actual physical laws and initial conditions. So EQM does not have the same kind of modal freedom.

  ### Residue Report

  Now, we discuss what is left over in each framework that doesn't translate to the other.

  #### What in Lewis has no counterpart in EQM?

  - **Spatiotemporal Isolation:** Lewis's worlds are spatiotemporally isolated. In EQM, branches are in the same spacetime and are superposed. This is a fundamental difference: in EQM, the entire multiverse is a single spacetime with a superposed wave function. The isolation is due to decoherence, not spatial separation.

  - **Recombination Principle:** Lewis uses recombination to generate the plurality of worlds arbitrarily. In EQM, the branches are constrained by the initial wave function and the Hamiltonian. EQM does not have arbitrary recombination: the set of branches is fixed by the dynamics. This limits the modal freedom in EQM relative to Lewis.

  - **Indexicality of Actuality:** Both frameworks have an indexical notion of actuality. However, note that in Lewis, the indexicality is tied to the entire world, while in EQM, it is tied to a branch. The fit is clean in this respect.

  #### What in EQM has no counterpart in Lewis?

  - **Common History and Branching Structure:** In EQM, branches share a common past. They are the result of a branching process. For Lewis, worlds are isolated and do not share any common history. This is a major difference: EQM has a tree-like structure of branching histories, while Lewis's worlds are all separate and do not branch from each other.

  - **Amplitudes and the Born Rule:** In EQM, each branch has an amplitude (a complex number) and the Born rule assigns a probability measure to the branches. This measure is used to make sense of probabilities. In Lewis's modal realism, there is no such measure: all worlds are equally real and there is no natural way to assign probabilities. Lewis must add additional structure (like a measure over worlds) to account for probabilities, which is not part of his original framework.

  - **Emergence of Branches:** In EQM, branches are not fundamental. They emerge from the wave function via decoherence and are approximate. In Lewis, worlds are fundamental and exact. This means that in EQM, the branching structure is not sharp and the definition of a "world" is context-dependent (on the decoherence basis and the coarse-graining). Lewis's worlds are well-defined and discrete.

  - **The Measure Problem:** EQM faces the measure problem: how to justify the use of the Born rule probabilities. This is an active area of research. Lewis's framework does not have an inherent measure problem because he does not assign measures to worlds. But if one wants to add probabilities (for chance events), then Lewis must introduce a measure over worlds, which is an additional structure.

  #### Analysis of the Residue

  The residue shows that the two frameworks are answering different questions:

  - Lewis's modal realism is a theory of *modality*: it aims to explain possibility and necessity. The plurality of worlds is a way to ground modal truths.

  - EQM is a theory of *quantum mechanics*: it aims to explain the quantum phenomena without collapse. The branching structure arises from the dynamics and decoherence.

  The differences are significant:

  1. **Structure of the Multiverse:** EQM has a branching structure with a shared history. Lewis's worlds are all separate and do not branch.

  2. **Constraints on Possibility:** EQM's possibilities are constrained by the laws of physics (the Hamiltonian and initial conditions). Lewis's possibilities are constrained only by logical consistency and recombination.

  3. **Probabilities:** EQM has a built-in measure (the amplitude squared) that can be used for probabilities. Lewis does not, making probability harder to ground.

  4. **Fundamentality:** In Lewis, worlds are fundamental. In EQM, the wave function is fundamental and branches are emergent.

  These differences are not merely terminological. They reflect different goals: Lewis is doing metaphysics of modality, while EQM is providing a physical theory of quantum phenomena.

  ### Conclusion

  The translation is not perfect. Both frameworks have elements that do not map to the other. The residue shows they are not the same theory in different clothes. They are addressing different domains: Lewis provides an account of possibility and necessity, while EQM provides an account of quantum mechanics. However, they share a common core: a plurality of concrete worlds (or branches) in which all possibilities are realized, and an indexical notion of actuality. But the structure of the plurality and the constraints on it differ significantly. 

  Therefore, they are not equivalent. The Everettian multiverse is constrained by physical laws and has a branching structure with a shared past, while Lewis's pluriverse is unconstrained by physical laws and is a collection of isolated worlds. Moreover, EQM has the Born rule and the measure problem, which Lewis does not. Conversely, Lewis has free recombination and spatiotemporal isolation, which EQM lacks.

  So, your suspicion is partially correct: the indexicality of actuality translates cleanly, but the spatiotemporal isolation does not. And the physics has elements (like the shared past and the Born rule) that Lewis cannot express. This residue indicates that the two are answering different questions.
answer: |-
  ### Translation of Lewisian Modal Realism into Everettian Vocabulary

  Below, I translate each core claim of Lewis's modal realism into Everettian quantum mechanics (EQM) vocabulary, assessing the fidelity of the fit. I then address your residue report, comparing indexicality, branching structure, amplitudes, and emergence. Finally, I evaluate whether the frameworks are equivalent or distinct.

  ---

  ### **Claim-by-Claim Translation**
  1. **Worlds are concrete.**  
     - *EQM Translation:* Branches (decohered components of the universal wave function) are concrete. They are patterns in the quantum state, realized via unitary evolution and decoherence.  
     - *Fit:* **Clean.** Both treat "worlds" as physically real. EQM branches are not abstract; they supervene on the wave function.  

  2. **Worlds are spatiotemporally isolated.**  
     - *EQM Translation:* Branches are *dynamically* isolated via decoherence (suppressed interference), but share a single spacetime. No spatial separation exists; isolation is due to loss of quantum coherence.  
     - *Fit:* **Fudged.** Lewis demands *absolute* spatiotemporal separation, while EQM has branches coexisting in one spacetime. Decoherence provides isolation but not spatial disjointness.  

  3. **Worlds are causally isolated.**  
     - *EQM Translation:* Decoherence ensures causal closure within branches: no energy/matter transfer between branches under unitary evolution.  
     - *Fit:* **Clean.** Decoherence guarantees causal isolation dynamically, matching Lewis's requirement.  

  4. **Worlds are maximal.**  
     - *EQM Translation:* A branch is a "maximal" decohered history—a consistent set of correlated measurement outcomes (via decoherent histories formalism).  
     - *Fit:* **Fudged.** Maximality in EQM is approximate and basis-dependent (defined by decoherence conditions). Lewis's worlds are sharply maximal.  

  5. **Actuality is indexical.**  
     - *EQM Translation:* "Actuality" is branch-relative. Observers in a branch experience it as "actual" due to their entanglement with local degrees of freedom.  
     - *Fit:* **Clean.** Both treat actuality as perspectival. EQM's "indexicality" arises from entanglement.  

  6. **Every world is of a kind with ours.**  
     - *EQM Translation:* All branches are governed by the same universal wave function and Hamiltonian. None are ontologically privileged.  
     - *Fit:* **Clean.** Both assert parity among worlds/branches.  

  7. **Possibilia aren't abstracta.**  
     - *EQM Translation:* Entities in other branches are physical (e.g., a branching electron is as concrete as one in "our" branch).  
     - *Fit:* **Clean.** EQM rejects abstract possibilia; everything is wave-function-realized.  

  8. **Transworld identity gives way to counterparts.**  
     - *EQM Translation:* Pre-branching, entities share a history; post-branching, "counterparts" exist across branches (e.g., you-in-branch-A and you-in-branch-B).  
     - *Fit:* **Clean.** Branching naturally implies counterpart relations without transworld identity.  

  9. **Recombination principle determines world count.**  
     - *EQM Translation:* Unitary evolution + initial conditions generate branches combinatorially (e.g., via quantum algorithms or field configurations).  
     - *Fit:* **Fudged.** Lewis's recombination is *ungoverned* (any arrangement is possible), while EQM's branching is constrained by the Hamiltonian.  

  ---

  ### **Residue Report: What Doesn't Translate?**
  #### **Lewisian Elements Absent in EQM**
  - **Spatiotemporal Isolation:** Lewis requires worlds to be *literally* spatially disconnected. EQM has no counterpart—branches share spacetime. This is a **defect in Lewis** for EQM, as it misdescribes quantum isolation.  
  - **Recombination Freedom:** Lewis's principle allows arbitrary rearrangements (e.g., "talking donkeys"). EQM branches are dynamically generated, restricting possibilities to unitary evolution. **Lewis can express possibilities EQM cannot** (e.g., violations of physical laws).  

  #### **EQM Elements Absent in Lewis**
  - **Branching with Shared History:** EQM branches diverge from a common past (e.g., post-measurement branching). Lewis's worlds lack shared history—they are wholly distinct. **Lewis cannot express this**, making branching a *novel feature* of EQM.  
  - **Amplitudes and the Born Rule:** Branches have complex amplitudes, with squared norms providing probabilities. Lewis's worlds lack intrinsic weights; probabilities require added structure (e.g., "typicality" measures). This is a **defect in Lewis** for grounding quantum probability.  
  - **Emergent Branches:** In EQM, branches are approximate, emergent from decoherence, and basis-dependent. Lewis's worlds are fundamental and exact. **Lewis cannot accommodate non-fundamental worlds**, risking "smuggled metaphysics" if Everettians treat branches as exact.  

  #### **Indexicality: Your Suspicion**
  - You suspect Lewis's indexicality lacks an EQM counterpart. **You're partially wrong.** EQM *has* indexicality: observers are entangled with branches, making "actuality" branch-relative. However, Lewis's indexicality is *purely linguistic*, while EQM's is *physically enforced* by decoherence.  

  #### **The Measure Problem**
  - EQM assigns amplitudes to branches, raising the **measure problem**: Why interpret squared amplitudes as probabilities? Lewis lacks this—his framework *needs* probabilities added externally. This is a **defect in Lewis** for quantum applications.  

  ---

  ### **Are They Equivalent? The Verdict**
  **No.** They answer fundamentally different questions:  
  - **Lewis** addresses *metaphysical modality*: "What is possible, and how do we ground modal truths?" His worlds are static, disconnected, and combinatorial.  
  - **EQM** addresses *quantum ontology*: "How do we explain unitary evolution without collapse?" Its branches are dynamic, historically connected, and probability-weighted.  

  #### **Key Divergences**  
  1. **Structure:** EQM has a tree-like branching structure; Lewis has a "heap" of worlds.  
  2. **Probability:** Amplitudes in EQM provide a natural probability measure; Lewis requires ad-hoc additions.  
  3. **Emergence:** EQM branches are approximate; Lewis's worlds are fundamental.  
  4. **Constraints:** EQM possibilities are law-governed; Lewis's are only logically constrained.  

  #### **Implications**  
  - **For Lewis:** His framework cannot naturally express branching histories or quantum probability, making it inadequate for quantum foundations without revision.  
  - **For EQM:** It cannot capture "talking donkeys" or violations of physical laws, but this is a *virtue*—it reflects nature's constraints.  

  **Conclusion:** Your money is right. The residue reveals they are distinct projects: Lewis offers a theory of *all possible worlds*; EQM offers a theory of *quantum reality*. The translation shows EQM can subsume much of Lewis's apparatus (e.g., indexicality, counterparts), but the differences in structure, probability, and emergence are irreducible. Everettians aren't smuggling metaphysics—they're deriving it from physics. Lewis's framework, while powerful for modality, cannot ground quantum mechanics without borrowing EQM's innovations (e.g., decoherence-based isolation). Neither reduces to the other.
