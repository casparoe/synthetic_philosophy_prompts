answer: |-
  ## Research Proposal: The Double Heart and the Will to Deceive: Testing the Boundaries of Augustine’s Definition of Lying

  **Project Title:** Signifying Falsely or Deceiving Willfully? Resolving the Tension in Augustine’s Prohibition of Lying.

  **Research Question:** Does Augustine’s absolute prohibition of lying fundamentally stem from the internal contradiction of the "double heart" (signifying what one does not hold in mind) or from the external intent to induce a false belief in another, and how does his definition handle cases where these criteria diverge?

  **Problem Statement:** Standard interpretations of Augustine on lying focus on his rigorist conclusion ("never lie") and contrast it with more permissive views. This overlooks the peculiarity of his *definition*. For Augustine, a lie is not primarily defined by objective falsehood but by a subject's *intentional signification* of something contrary to their own belief ("mendacium est enuntiatio cum voluntate falsum enuntiandi" - *Enchiridion* 18). The core fault is the "double heart" (*duplex cor*), a fundamental self-contradiction and disordering of the will. Crucially, he states one can lie by uttering a truth believed false (*Contra Mendacium* 12.25) and potentially *not* lie by uttering a falsehood without the will to deceive (*De Mendacio* 4.5). However, tensions arise: does the prohibition target the *internal* state of significative dissonance, or the *external* act of *intending deception*? Existing scholarship often conflates these or assumes their equivalence within Augustine's framework, leaving key edge cases unresolved.

  **Hypothesis:** Augustine's absolute prohibition is primarily grounded in the *internal* moral fault of the "double heart" – the deliberate act of signifying what one holds to be false. While the *intent to deceive* is a frequent *consequence* and powerful motivator of this act, it is not the defining essence of the lie itself for Augustine. His definition prioritizes the integrity of the signifying will over the actual effect produced in the hearer.

  **Methodology:**
  1.  **Textual Reconstruction:** Systematically analyze Augustine’s key texts on lying (*De Mendacio*, *Contra Mendacium*, relevant passages in *Enchiridion*, *De Trinitate*, letters) focusing on his definitions, metaphors ("double heart"), and stated rationales for prohibition.
  2.  **Conceptual Distillation:** Clearly delineate the two potentially separable criteria:
      *   **Criterion A (Double Heart):** Signifying X while believing ~X.
      *   **Criterion B (Deception Intent):** Intending to cause another to believe X (where X is false, or believed false).
  3.  **Test Case Application:** Apply both criteria to Augustine’s explicit examples and crucial edge cases:
      *   **Truthful Signification Intending False Inference (User's "Bug" Case):** Agent believes P (true), utters P, intending hearer to infer Q (false). Criterion A *not* violated (agent signifies P, believes P). Criterion B *violated* (intent to cause false belief Q). *Is this a lie for Augustine?* (Prediction: Not a lie per se, but likely condemned as related deception).
      *   **Falsehood Without Deception Intent (Mirror Case):** Agent believes P (false), utters P, but *obviously* or contextually ensures the hearer will *not* believe it (e.g., jest, agreed-upon fiction, obvious hyperbole). Criterion A *violated* (signifies P, believes ~P). Criterion B *not* violated. *Does Augustine condemn this?* (Prediction: Yes, as a lie, due to the double heart).
      *   **The Priscillianist Stress Test:** Catholics infiltrating Priscillianist groups by *falsely professing heretical beliefs* they disavow (*Contra Mendacium* was written against this practice). This directly violates Criterion A (signifying belief they do not hold). Augustine condemns it absolutely, regardless of the good intent (exposing heresy). This strongly supports the primacy of Criterion A.

  **Expected Outcomes & Significance:**
  *   **Good Outcome:** A coherent interpretation demonstrating that Augustine’s core prohibition targets the *act of false signification* (Criterion A) as an intrinsic disorder of the will and relationship to truth/God. The intent to deceive (Criterion B), while gravely sinful and often concomitant, is secondary. This explains his condemnation of lying in jest (A violated, B absent) and the Priscillianist case, and potentially exonerates the "truthful signification/intending false inference" case *from the charge of lying specifically* (though still sinful deception). This clarifies the unique structure of his rigorism.
  *   **Collapse Outcome:** If the texts reveal irreconcilable tension, showing Augustine inconsistently applies his own definition, shifting weight between A and B depending on context (e.g., treating jest lightly but infiltration severely). This finding, while less tidy, is significant as it reveals a fundamental ambiguity or tension within his ethical framework concerning internal state vs. external effect.
  *   **Significance:** Moves beyond the stale "rigorist vs. permissive" debate by interrogating the *internal logic* of Augustine's position. Offers a nuanced understanding of his moral psychology, theory of signification, and concept of truthfulness. Challenges assumptions about the necessary link between lying and deception intent in his thought.

  **Scope:** This is firmly a **paper-length project** (20-30 pages), suitable for a workshop presentation and subsequent journal article. It focuses tightly on Augustine's *definition* and its application to specific conceptual/test cases. It does not aim for a comprehensive history of lying debates or a full comparison with other thinkers (though brief contextualization is needed). The Priscillianist episode serves as a key historical anchor and test.

  **Confidence Assessment:**
  *   **High Confidence:** Augustine's core definition *does* center on signification contrary to belief (Criterion A). The "double heart" is fundamental. He *does* condemn lying in jest (Criterion A violation) even without intent to deceive (Criterion B absent). He *absolutely* condemns the Priscillianist tactic (clear Criterion A violation).
  *   **Moderate Confidence:** The "truthful signification/intending false inference" case (Criterion A satisfied, Criterion B violated) would *not* be classified by Augustine as a *lie* per his definition, though condemned as deceptive. His focus on the *significative act itself* suggests this.
  *   **Least Confidence/Greatest Uncertainty:** Whether Augustine *systematically* and *consistently* maintains this distinction in *all* potential applications, especially under rhetorical pressure. Does the *gravity* he assigns to deception sometimes blur the lines in his exposition, even if his definition logically prioritizes the double heart? Close reading of his reasoning across texts is needed here.
