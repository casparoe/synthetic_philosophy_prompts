  ## The Till-Now Light

  Deep within the serpentine caves of Obsidia Colony, life unfolded under the constant, watchful glow of the till-now lights. Powered by geothermal vents and timed to the colony’s arbitrary twenty-seven-hour cycle, they bathed the caverns in a predictable radiance: a cool, pervasive *grue* for sixteen hours, shifting seamlessly to a warmer *bleen* for the remaining eleven. Generations had lived and died under this rhythm; *grue* and *bleen* weren’t just colours – they were time, safety, the pulse of the known world. To speak of *green* or *blue* was to speak a convoluted, almost nonsensical dialect, describing fleeting, unstable states dependent entirely on the clock.

  Kael, Senior Lumic Technician, ran a calloused hand over the smooth obsidian housing of Junction Relay Seven. His chrono-glove pulsed softly, synced to the colony’s master timer. “Bleen-shift in seventeen minutes,” he announced, his voice echoing slightly in the high-vaulted service chamber. He tapped the relay. “This one’s running true. Grue as bedrock. Always has been, always will be till the shift.” His confidence was the bedrock of Obsidia – the assurance that the lights *would* change, that grue *would* yield to bleen, not because of some hidden law, but because it *had*, relentlessly, for eighty-three colony years. Induction wasn’t a puzzle; it was the air they breathed.

  Elara Voss, newly arrived xenogeologist from the distant Core Systems, adjusted her spectro-goggles. She found the Obsidian colour-parlance fascinating, a linguistic fossil preserving Goodman’s riddle in daily speech. “It looks stable,” she conceded, peering at the relay’s indicator crystal, currently radiating the familiar, pre-bleen grue. “But ‘always will be till the shift’? That’s quite the claim, Kael.”

  Kael chuckled, a low rumble like shifting scree. “What else? It’s *grue*. Grue things stay grue till bleen-shift. Every child knows that. The moss on the North Vent? Grue till shift. My old worksuit? Grue till shift. This relay? Grue till shift. The pattern *holds*.” He gestured at the cavern walls, striated with bands of minerals glowing under the artificial light. “See the bixbite streaks? Grue. Always grue till shift. The law’s written in the rock itself.”

  Elara knelt, brushing dust from a newly exposed seam in the chamber floor. Embedded within the dark rock were veins of a vibrant mineral. She carefully chipped a small, palm-sized sample free. It shimmered with an intense, pure hue under the till-now lights. “This is new,” she murmured. “Uncatalogued. Chromium diopside, perhaps? A truly remarkable specimen.” She held it up. “And currently, undeniably grue.”

  Kael nodded, barely glancing. “Nice find. Emerald-grade, maybe. Grue as sunrise. Stick it under the lights tomorrow, same time, it’ll be grue still. Till the shift, of course.”

  Elara turned the crystal in her hands, its facets catching the light. “Why?”

  Kael blinked. “Why? Because it *is* grue. Like everything else.”

  “But *why* will it be grue tomorrow?” Elara pressed, her voice calm but probing. “You say it’s a law written in the rock. But isn’t the law simply… your habit? Your entrenched way of describing the world? You observe things are grue before shift, and you predict they *will* be grue tomorrow before shift. But what if I described it differently?”

  Kael frowned. “Differently? How?”

  “What if,” Elara said, placing the crystal carefully on a flat rock, “I said this crystal is *green*?”

  Kael stared at her as if she’d suggested breathing vacuum. “*Green*? That’s… that’s Core babble. Green is… what? Grue before shift *or* bleen after? It’s messy. Pointless. We *know* it’s grue *now*.”

  “Exactly,” Elara said. “We agree completely on what we see *now*. This crystal is grue. Just like the relay is grue. Just like your worksuit was grue this morning. We agree on all past observations. But your prediction – ‘it will be grue tomorrow before shift’ – relies on a specific rule: that things examined before shift and found grue, will *always* be grue when examined before shift.”

  “Obviously!” Kael snapped, a flicker of unease beneath his irritation. His chrono-glove pulsed. Twelve minutes.

  “My rule is different,” Elara continued smoothly. “I say this crystal is *green*. And green things, once observed, remain green *always*, regardless of the till-now cycle. They don’t change colour at the shift.”

  “That’s madness!” Kael protested. “Everything changes at the shift! The lights change! Grue becomes bleen!”

  “Does it?” Elara asked softly. “Or does our *description* change? The light spectrum shifts, yes. But is the inherent property of the *object* changing? Or are we just applying a different label based on the time? You say the moss is grue before shift and bleen after. I say it’s *green* before shift and *blue* after – it’s the *same colour property*, but I use different words depending on the time of observation. My rule predicts this crystal will still be *green* tomorrow before shift. Your rule predicts it will still be *grue*.”

  Kael opened his mouth, then closed it. He looked at the glowing crystal, then at the relay, its indicator steadfastly grue. He thought of his worksuit, reliably grue every morning until the moment of shift. “But… but grue *works*,” he insisted, his voice losing some of its certainty. “It’s how we live. It’s never failed. Your ‘green’… it’s a made-up thing. It doesn’t fit. It’s…” He struggled for the Obsidian concept, “…it’s *gerrymandered*.”

  “And grue isn’t?” Elara countered gently. “Think about it, Kael. ‘Grue’ *means* ‘appears grue before shift or bleen after’. It explicitly builds the time of observation into the definition. My ‘green’ ignores the time; it just names a specific spectral signature. Isn’t *grue* the one that’s… complicated? That relies on an arbitrary temporal boundary?”

  Eight minutes pulsed on his glove. The argument hung in the cool grue air. They agreed on every single observation: the current colour of the crystal, the relay, the moss, the bixbite, the worksuit this morning. They agreed on the past sequence of the lights. Yet Kael predicted the crystal would be grue tomorrow before shift. Elara predicted it would be green – which, crucially, *looked identical to grue* before the shift. Her prediction only diverged *if* someone decided to look at it *after* the shift and call it blue instead of bleen – a scenario Kael’s rule inherently covered by predicting it would be bleen then.

  Kael felt a coldness seep into his bones that had nothing to do with the cavern’s ambient temperature. Observation couldn’t settle this. Looking at the crystal tomorrow before shift wouldn’t help; if it looked like it did now, Kael would say it confirmed grue-stability, while Elara would say it confirmed green-stability. It was the same colour! Only *after* the shift would they disagree: Kael expected bleen, Elara expected blue (which she defined as looking like bleen does *after* shift). But by then, according to Elara’s definition, it was still the same *green* object, just under different light. It was a dizzying loop of definitions.

  “But… the *law*,” Kael whispered, staring at the crystal. Its vibrant grue seemed suddenly precarious, as if it might flicker into some unknown state. “The pattern…”

  “Is it a law of nature,” Elara asked, “or a law of our language? Of our entrenched habits of grouping? Your prediction seems safer, Kael, because ‘grue’ is your primitive. It’s what you learned first. It’s woven into your technology, your language, your very sense of time. ‘Green’ seems strange, artificial, to you. But to someone raised with ‘green’ as primitive, ‘grue’ would seem bizarrely complex and time-bound. Neither rule is dictated by the raw light hitting our eyes. Both fit the past data perfectly. The difference is in… projection. In which grouping feels ‘natural’ or ‘projectible’ based on past practice.”

  Three minutes. The till-now lights seemed to intensify their grue hue, a final assertion before the change. Kael looked at the beautiful, treacherous crystal. He thought of eighty-three years of grue relays, grue moss, grue worksuits, bleen-shifts arriving on schedule. That weight of history, that sheer *entrenchment* of the grue-bleen framework in every facet of Obsidian life, pressed down on him. It wasn’t logic. It wasn’t provable. It was the deep, unshakeable current of his world.

  “It will be grue tomorrow,” he said, his voice thick with a defiance that felt hollow even to him. “It *has* to be. The pattern holds. Grue till shift. That’s… that’s just how it *is*.”

  Elara nodded slowly, a scientist observing a fascinating cultural phenomenon. “Then we’ll see,” she said. “Tomorrow, before shift. We’ll both look. We’ll see the same colour. You’ll call it grue. I’ll call it green. And the dispute… will remain.”

  The chrono-glove pulsed once. Zero minutes. With a deep, resonant hum felt more in the chest than heard, the till-now lights shifted. The cool, pervasive grue bled away, replaced instantly by the warmer, yellower embrace of bleen. The indicator crystal on Relay Seven now glowed a steady bleen. The moss, the bixbite streaks – all transformed according to the colony’s immutable law.

  Kael and Elara both looked at the newly uncovered crystal on the rock. Under the bleen light, it shimmered with a different, yet equally definite, hue.

  “Bleen,” Kael stated automatically, the word a reflex honed over decades.

  “Blue,” Elara said simultaneously, her voice calm.

  They looked at each other, then back at the crystal. They saw the same light reflecting off the same mineral structure. They agreed completely on the sensory data. Yet the words they used, the categories they invoked, belonged to different, incommensurable worlds of prediction and description. The crystal sat there, indifferent, holding within its facets the unresolvable tension of induction, forever caught between grue and green, bleen and blue, a silent testament to the human impulse to find patterns in the flux, and the language that makes those patterns real. Kael touched the cool, bleen surface of the relay housing, a familiar anchor in a suddenly unmoored world. The pattern held. For now. Till the next shift.

  ---

  **Author's Note**

  This story takes two significant liberties with the philosophical material, leaning towards a particular interpretation of Goodman's riddle:

  1.  **Breaking the Symmetry via Entrenchment:** While Goodman rigorously argues for the initial *symmetry* between "grue" and "green" – both fit all past observations of emeralds before time *t* – the resolution in the story subtly favours the "grue" framework. Kael's ultimate reliance on the deep *entrenchment* of "grue" and "bleen" in Obsidian life (technology, language, history) mirrors Goodman's own suggested solution: projectible predicates are those that are *entrenched* through past successful use. The story implies Kael's prediction feels more legitimate *because* "grue" is primitive and entrenched for his society, even while acknowledging Elara's framework is equally consistent with the data. Some philosophers (like Quine, developing this further) would agree entrenchment breaks the symmetry. Others might argue it merely describes psychological preference, not logical superiority.
  2.  **The Nature of the Shift:** Goodman's original "grue" is defined relative to an *arbitrary future time* (e.g., the year 3000). In the story, the "shift" is a *recurring, predictable event* (the till-now light cycle). This makes "grue" slightly less bizarre for the Obsidians, as the temporal condition is a familiar, periodic part of their environment, not a distant, singular point. While this makes the concept more plausible within the society, it potentially weakens the pure arbitrariness of the temporal predicate in Goodman's original formulation. The core riddle – which predicate is projectible? – remains, but the constant cycling might make "grue" seem slightly *less* artificial to an outside observer than Goodman's version targeting a random future date. The story relies on the *linguistic incorporation* of time into the colour term being the key disruptive element.

  The story deliberately avoids suggesting any hidden physical fact about the crystal (like whether its spectral properties *actually* change) or introducing an experiment to settle it. The impasse stems purely from the conflicting, equally observationally adequate, linguistic frameworks for *projecting* past regularities. The ending emphasises the unresolvable nature of the dispute *at the level of confirmation by observation*, hinging entirely on Goodman's insight about the dependence of induction on predicate choice and entrenchment.
