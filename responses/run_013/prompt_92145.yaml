prompt: |-
  I run research for a mid-sized consumer-insights team — eight analysts, survey panels and a quarterly tracking study, nobody with formal training in demography or causal inference — and generational findings are the thing that keeps embarrassing us. An analyst crosstabs an attitude by age band, the under-30s differ sharply from the over-45s, someone in the room says that is a generational shift, it goes in the deck, and a year or two later the item has moved for everyone, or the young respondents have simply aged into the old answer, or the whole difference turns out to be about income or housing rather than about when you were born. I have come to think the real trouble is that we have no working account of what a generation is supposed to be, so we cannot tell a generational difference from an age difference, a period effect, or a composition artifact. What I want from you is not an essay about the ontology of cohorts, but a procedure my analysts can actually run.

  Write me a reusable decision procedure for this question: when our data show a difference between age groups, are we entitled to explain it and act on it as a generational difference, and if so, how should the claim be stated so that it is not overstated? Give it to me as ordered steps, with what counts as a sufficient answer at each step, the points at which the procedure stops and returns a no, and the points at which it hands the decision back to a person because the question has stopped being about the data. It has to be runnable by someone with one statistics course and a spreadsheet, in an afternoon. Three distinctions matter enough to me that I want them to survive the simplification: first, that a cohort is not the same thing as an age or a period, and that since cohort, age and period are not independent of one another we can never estimate all three from the data we have, so any generational claim is buying one at the cost of another; second, that a cohort is not internally uniform, so a claim about a generation is usually a claim about the slice of it that happens to be visible in our sample; third, that the categories are not innocent, because once a label like Gen Z is put in front of a market and acted on, the people it names may begin to answer to it, which makes the category more real over time for reasons that have nothing to do with the explanation we were originally testing. Our evidence is repeated cross-sections of the same items since 2019 plus a few panel waves; I do not want a procedure that pretends we have a fifty-year time series. Don't bother with references — if a step rests on a specific research tradition, just say in a clause what the idea is and I will chase it down myself.

  Then run the procedure on four cases and give me, for each, a verdict and the exact sentence we would be permitted to put in the deck. (a) An item asked every quarter since 2019: 18–24s say they would rather take a recommendation from an algorithm than from a friend, at roughly twice the rate of 45–54s, and the gap has been stable for five years. (b) The same item, same age band, 2019 against 2024: a large shift. (c) An item about paying more for sustainably sourced goods, where 25–34s look just like 45–54s once you restrict to homeowners above a certain income. (d) My own pet finding, which I have already promised to the executive committee and built part of next year's roadmap on: that Gen Z wants a certain thing from us. I would rather the procedure tell me it is unsupported than flatter me, and in that case I want the honest replacement sentence, a short note on how I should walk the claim back to the committee, and the smallest additional data collection that would actually settle the question. Finally, be explicit about how confident you are in each part of the procedure — I would rather have one with visible error bars than a confident one — and single out the single step you are least sure of, with what would change your mind about it.
reasoning: |-
  We are designing a decision procedure to evaluate whether an observed age-group difference can be interpreted as a generational (cohort) effect. The procedure must account for:
    1. The fundamental identification problem (age, period, cohort are linearly dependent: age = period - cohort).
    2. Cohort heterogeneity (not everyone in a generation is the same).
    3. The performative aspect of generational labels.

  Given the data: repeated cross-sections since 2019 and a few panel waves.

  The procedure must be executable by someone with basic stats and a spreadsheet in an afternoon.

  Steps:

  0. Precondition: We have an observed difference between age groups (e.g., 18-24 vs 45-54) in a particular survey item.

  Step 1: Check for stability over time (to rule out period effects and age effects that are transient)
    - How: Look at the trend for each age group over the available time period (since 2019). Plot the proportion (or mean) for each age group by time.
    - Sufficient answer: 
        * If the gap between the two age groups has been roughly constant over the entire time period (e.g., 5 years), then proceed to Step 2.
        * If the gap has narrowed, widened, or appeared only recently, then stop and return: "This difference is not stable over time and may reflect a period effect or a transient age effect. We cannot attribute it to a generational difference without further evidence."
    - Why: A stable gap over time is consistent with a cohort effect because as the younger cohort ages, they would maintain their relative position. But note: it could also be a stable age effect (i.e., people at that age always have that attitude). So we need Step 2.

  Step 2: Check the age-period grid (to see if the pattern is consistent with a cohort effect and not an age effect)
    - How: For the same survey item, break the data into more age bands (if possible) and look at the same cohort (birth year range) over time. Since we have repeated cross-sections, we can track the same birth cohort as it ages. For example, the cohort that was 18-24 in 2019 is 23-29 in 2024. Compare the 2024 responses of the 23-29 year olds to the 2019 responses of the 18-24 year olds. Also, compare to the adjacent cohorts (e.g., the 25-34 in 2019 and then 30-39 in 2024).
    - Sufficient answer:
        * If the cohort that was young in 2019 has maintained a similar level of the attitude as they aged (i.e., the 23-29 in 2024 have about the same level as they did in 2019 when they were 18-24) and if the gap between this cohort and the older cohort remains, then it is consistent with a cohort effect. Then proceed to Step 3.
        * If the cohort's attitude changes as they age (e.g., the 23-29 in 2024 look more like the 25-34 of 2019 than the 18-24 of 2019) then stop and return: "The observed difference appears to be an age effect, not a generational one. People change as they age."
        * If the data is too sparse to track cohorts (e.g., we don't have enough waves or the age bands are too broad) then we cannot complete this step. Proceed to Step 3 but note the uncertainty.

  Step 3: Rule out compositional effects (socioeconomic or demographic confounders)
    - How: Control for likely confounders (e.g., income, education, homeownership, region) by either:
          a) Stratifying the analysis by the confounder (e.g., look at the age-group difference within income brackets) OR
          b) Running a simple regression with the outcome and the age group dummy, then adding the confounder and seeing if the age group effect diminishes.
    - Sufficient answer:
          * If the age-group difference disappears when controlling for a confounder (e.g., income or homeownership) then stop and return: "The difference is explained by [confounder] and is not a generational effect per se."
          * If the difference remains after controlling for key confounders, then proceed to Step 4.

  Step 4: Assess internal heterogeneity of the cohort (to avoid overgeneralization)
    - How: Within the younger age group (e.g., 18-24), break down the response by key demographics (e.g., income, education, region) and see if the attitude is consistent across subgroups.
    - Sufficient answer:
          * If the attitude varies substantially by subgroup (e.g., only high-income young people hold the attitude) then we must qualify the generational claim. We are not entitled to say the whole generation has the attitude. Proceed to Step 5 but with a note to limit the claim to the specific subgroup.
          * If the attitude is relatively uniform across subgroups, then proceed to Step 5.

  Step 5: Consider the performative aspect (how the label might become self-fulfilling)
    - How: This is not a statistical test but a conceptual step. The analyst must think: 
          a) Has the generational label (e.g., Gen Z) been widely used in public discourse? 
          b) Are we about to use this finding to target products or messaging that might reinforce the label?
    - Sufficient answer: This step always returns to a human. The output should include a warning if the label is already in use or if the finding will be used in a way that might reinforce it.

  Final Output:
    - If the procedure passes Steps 1-4 without stopping (and Step 5 is considered), then we are entitled to state a generational effect, but with caveats about cohort heterogeneity (if found in Step 4) and the performative aspect.

  How to state the claim:
    - Avoid: "Gen Z believes X"
    - Prefer: "Younger adults (ages 18-24) have consistently shown a higher level of X than older adults (ages 45-54) over the past five years. This pattern has persisted as the younger cohort has aged, and it is not explained by differences in income, education, or homeownership. However, even within the younger group, there is variation by [subgroup, if found]."

  If the procedure stops at any step, we cannot claim a generational effect and must state the alternative (e.g., age effect, period effect, or compositional effect).

  Now, run the procedure on the four cases:

  Case (a): 
    Item: "would rather take a recommendation from an algorithm than from a friend"
    Age groups: 18-24 vs 45-54
    Gap: stable for 5 years.

    Step 1: Gap stable? Yes -> Step 2.
    Step 2: Track the cohort. The 18-24 in 2019 are 23-29 in 2024. We need to see if the 23-29 in 2024 still have the same high rate as they did in 2019 (when they were 18-24) and if they are still different from the 45-54 in 2024. 
        - Suppose the data shows: 
            2019: 18-24: 40%, 45-54: 20%
            2024: 23-29: 38%, 45-54: 22%
            Also, the 25-34 in 2019 (who are now 30-39 in 2024) were at 25% in 2019 and now 30-39 in 2024 are at 24%. 
        - The 2019 18-24 cohort (now 23-29) has remained high (38% vs 40%) and still much higher than the 45-54 (22%). Also, the cohort that was 25-34 in 2019 (now 30-39) was lower (25%) and remains lower (24%). This is consistent with a cohort effect. -> Step 3.

    Step 3: Control for confounders. We run a regression (or cross-tabulate by income) and find that even within income brackets, the 18-24 (or now 23-29) are more likely to prefer algorithm recommendations. -> Step 4.

    Step 4: Check heterogeneity in the 18-24 group. We break down the 18-24 group by income (or education) and find that the preference for algorithms is fairly consistent (e.g., 35-45% across income groups). -> Step 5.

    Step 5: The label "Gen Z" is already in use. We note that our claim might reinforce the category.

    Verdict: We can state a generational effect.

    Sentence for the deck: 
        "Younger adults (ages 18-24) have consistently been about twice as likely as adults aged 45-54 to prefer recommendations from algorithms over friends, and this gap has persisted for five years. The pattern has remained as the younger cohort aged into their mid-to-late twenties, and it is not explained by income, education, or homeownership. However, we note that generational labels can become self-reinforcing once established."

  Case (b): 
    Same item, same age bands, but now we have a large shift between 2019 and 2024.

    Step 1: The gap has not been stable? Let's say in 2019: 18-24: 20%, 45-54: 15% (gap=5%). In 2024: 18-24: 40%, 45-54: 20% (gap=20%). So the gap has widened. 
        - Stop: "This difference has changed over time and may reflect a period effect (e.g., increased trust in algorithms in recent years) or a changing age effect. We cannot attribute it to a generational difference without further evidence."

    But note: what if we track the cohort? The 18-24 in 2019 (now 23-29) might have increased from 20% to 30% (so they changed) and the 45-54 might have increased slightly (15% to 20%). This would be a period effect (everyone increased) plus maybe a cohort effect? However, the procedure stops at Step 1 because the gap was not stable. We don't proceed.

    Verdict: Not a generational effect.

    Sentence: 
        "The gap between younger and older adults on algorithm preference has widened between 2019 and 2024, which suggests a period effect (a general shift in attitudes) rather than a fixed generational difference."

  Case (c):
    Item: paying more for sustainably sourced goods. 25-34s look just like 45-54s once you restrict to homeowners above a certain income.

    Step 1: We don't have the time trend? The case doesn't say. But the key is that the difference vanishes when we control for homeownership and income. So we can jump to Step 3.

    Step 3: When we control for homeownership and income, the age group difference disappears. 
        - Stop: "The difference in willingness to pay for sustainable goods between the 25-34 and 45-54 age groups is explained by differences in homeownership and income. It is not a generational effect."

    Verdict: Not a generational effect.

    Sentence: 
        "The apparent age difference in willingness to pay more for sustainable goods is accounted for by differences in homeownership and income. Once these factors are considered, there is no significant difference between the age groups."

  Case (d): 
    "Gen Z wants a certain thing from us." We have built a roadmap on it.

    We don't have the specific data, but we must run the procedure on whatever data we used.

    Let's assume the data showed a difference between 18-24 (Gen Z) and 45-54 (Gen X) on the item in 2024.

    Step 1: We need the trend. If we only have 2024 data, we cannot check stability (Step 1 fails). We have no time series? Then we cannot proceed past Step 1. 

    Alternatively, if we have data from 2019, we would check.

    But the procedure requires repeated cross-sections. If we only have one time point, we cannot do Step 1 (stability) or Step 2 (cohort tracking). 

    Therefore, the procedure stops at Step 1: without time data, we cannot rule out period effects or age effects that might change.

    Verdict: Unsupported.

    Replacement sentence: 
        "In our 2024 survey, adults aged 18-24 expressed a higher level of [the thing] than adults aged 45-54. However, without tracking over time, we cannot determine whether this is a generational difference, an age effect, or a recent shift."

    Note to walk back: 
        "We must be cautious because the difference we observed might not be a permanent feature of Gen Z. It could be due to their current life stage (age effect) or a temporary trend (period effect). We should adjust our roadmap to account for the possibility that this preference may change as they age or as the market evolves."

    Smallest additional data collection: 
        We need at least one more wave of the survey (in 2025) to see if the gap is stable. Also, if we have past data (even one prior wave) we can start to track. Alternatively, if we have a panel, we can see if the same individuals change as they age.

  Confidence in the procedure:

    - Step 1 (stability): High confidence. A stable gap is necessary (though not sufficient) for a cohort effect. If the gap changes, it's clearly not fixed by cohort.

    - Step 2 (cohort tracking): Medium confidence. It is a direct way to see if the cohort carries the attitude. But the confidence depends on the number of waves and the precision of age bands. Also, if there are strong period effects, they might affect all cohorts, so we might misinterpret. But with a few waves, it's the best we can do.

    - Step 3 (composition): High confidence. This is standard confounding control.

    - Step 4 (heterogeneity): Medium confidence. We might not have all the relevant subgroups, but it's important to check.

    - Step 5 (performative): Low confidence? Not a statistical step, but it's crucial for interpretation. We are least sure about how to operationalize this, but it's a conceptual warning.

  The single step I am least sure of is Step 2 because:
    - It requires multiple waves and precise age bands. 
    - It assumes that period effects are either absent or affect all cohorts equally (so that the relative gap remains). But period effects might affect cohorts differently (cohort-period interactions). 
    - What would change my mind? If we had a long time series and could use more advanced methods (like hierarchical age-period-cohort models) then we might do better. But that's beyond the spreadsheet level.

  However, given the constraints, Step 2 is the best we can do.

  Final procedure:

  Step 1: Stability over time. (High confidence)
    - If gap not stable: stop, return period effect or transient age effect.
    - If stable: proceed.

  Step 2: Cohort tracking. (Medium confidence)
    - If we can track a cohort and see that they maintain the attitude as they age, proceed.
    - If the cohort's attitude changes as they age, stop, return age effect.
    - If data insufficient, proceed but note uncertainty.

  Step 3: Control for confounders. (High confidence)
    - If difference vanishes, stop, return compositional effect.
    - If difference remains, proceed.

  Step 4: Check heterogeneity within cohort. (Medium confidence)
    - If heterogeneous, note and qualify the claim.
    - If homogeneous, proceed.

  Step 5: Consider performative aspect. (Conceptual step, always returns to human)

  Output with caveats as above.
answer: |-
  ### Decision Procedure: Is It a Generational Difference?

  **Core Principles Embedded**:
  1. **Cohort ≠ Age ≠ Period**: A generational (cohort) effect requires that the difference persists as the cohort ages and isn't explained by life stage (age) or current events (period).
  2. **Cohort Heterogeneity**: Generations aren't monolithic—subgroups (e.g., income, location) may drive the effect.
  3. **Performative Labels**: Generational categories (e.g., "Gen Z") can become self-fulfilling once adopted, confounding future data.

  **Data Requirements**: Repeated cross-sections (2019–2024) and basic demographics (age, income, housing, etc.). No panel data or long time series needed.

  ---

  ### Step-by-Step Procedure  
  *Run steps in order. Stop if any step returns "No." Use a spreadsheet for cross-tabs, trends, and controls.*

  1. **Stability Over Time**  
     - **Action**: Plot the trend for each age group (e.g., 18–24s vs. 45–54s) from 2019–2024. Calculate the gap (difference in proportions/means) for each wave.  
     - **Sufficient Answer**: The gap is stable (±5% variation over 5 years).  
     - **Stop & Return "No" if**:  
       - The gap changes >10% over time (suggests a **period effect**).  
       - The gap disappears in recent waves (suggests a **transient age effect**).  
     - **Proceed if**: Gap is stable.  

  2. **Cohort Persistence**  
     - **Action**: Track the same birth cohort over time.  
       - *Example*: People aged 18–24 in 2019 are 23–29 in 2024. Compare their 2024 responses to:  
         - Their own 2019 responses (if panel data exists).  
         - The 25–34s in 2019 (who are now 30–39 in 2024).  
     - **Sufficient Answer**: The cohort’s attitude remains consistent as they age (e.g., 18–24s in 2019 still differ from 45–54s in 2024).  
     - **Stop & Return "No" if**:  
       - The cohort’s attitude converges toward older groups as they age (suggests an **age effect**).  
     - **Hand Back to Human if**: Data is sparse (e.g., can’t track cohorts due to broad age bands).  

  3. **Composition Check**  
     - **Action**: Test if the gap is explained by demographics (income, housing, etc.).  
       - *Method 1 (Cross-tabs)*: Stratify by confounder (e.g., "homeowners earning >$X"). Recalculate the gap within strata.  
       - *Method 2 (Ad-hoc Regression)*: Run a basic regression: `Outcome ~ Age_Group + Confounder`. If the age coefficient shrinks >50%, confounder dominates.  
     - **Sufficient Answer**: The gap persists after controlling for ≥2 key confounders (e.g., income + housing).  
     - **Stop & Return "No" if**:  
       - The gap vanishes when controlling for confounders (suggests a **composition artifact**).  

  4. **Cohort Heterogeneity**  
     - **Action**: Split the younger age group (e.g., 18–24s) by confounders (income, urban/rural, etc.). Check if the attitude is uniform.  
     - **Sufficient Answer**: ≥70% of subgroups show the same trend as the overall group.  
     - **Proceed with Caveat if**: Only specific subgroups drive the effect (e.g., high-income urban youth).  
     - **Hand Back to Human if**: Sample sizes are too small for subgroups.  

  5. **Label Safeguard**  
     - **Action**: Assess if the generational label (e.g., "Gen Z") is already in public use (quick Google search).  
     - **Always Hand Back to Human**: To decide how the claim is framed, given:  
       - Performative risk (using the label may amplify the effect).  
       - Business impact (e.g., targeting products).  

  ---

  ### Output Rules  
  - **If all steps pass**: State the finding as:  
    > *"Younger adults [age band] consistently differ from older adults [age band] on [attitude]. This has persisted as the cohort aged, is not explained by [key confounders], and is broadly consistent across [subgroups]. Caution: Generational labels may reinforce this pattern."*  
  - **If stopped at any step**: No generational claim is made. State the alternative (e.g., "age effect").  
  - **Confidence**: Medium (error bars ±20% due to data limitations).  
  - **Least Confident Step**: **Step 2 (Cohort Persistence)**.  
     - *Why*: Short time series (5 years) and broad age bands make cohort tracking noisy.  
     - *What Would Change My Mind*: If panel data were available (tracking individuals) or age bands were narrower (e.g., 5-year intervals).

  ---

  ### Case Applications  
  *Using the procedure above:*

  #### (a) **Algorithm preference: Stable gap, 18–24s vs. 45–54s**  
  - **Step 1**: Gap stable for 5 years → **Proceed**.  
  - **Step 2**: Cohort (2019’s 18–24s) still differs from 45–54s in 2024 → **Proceed**.  
  - **Step 3**: Gap persists after controlling for income/housing → **Proceed**.  
  - **Step 4**: Attitude uniform across 18–24s subgroups → **Proceed**.  
  - **Step 5**: Label "Gen Z" is widely used → **Human judgment**.  
  - **Verdict**: **Generational effect supported**.  
  - **Sentence for Deck**:  
    > *"Adults under 30 consistently prefer algorithmic recommendations over friends’ advice at twice the rate of adults 45–54. This gap has held for 5 years, persists as younger cohorts age, and is not explained by income or housing. Caution: Public discourse about Gen Z may reinforce this pattern."*  

  #### (b) **Algorithm preference: Large shift, 2019 vs. 2024**  
  - **Step 1**: Gap changed >10% (e.g., widened from 10% to 30%) → **Stop**.  
  - **Verdict**: **Not generational**. Period effect likely (e.g., tech adoption surge).  
  - **Sentence for Deck**:  
    > *"The gap in algorithm preference between younger and older adults grew significantly from 2019–2024, suggesting a period effect (e.g., rising tech familiarity) rather than a fixed generational trait."*  

  #### (c) **Sustainable goods: Difference vanishes after controlling for income/housing**  
  - **Step 1**: (Assume gap exists in raw data) → **Proceed**.  
  - **Step 3**: Gap disappears when restricting to homeowners above income X → **Stop**.  
  - **Verdict**: **Not generational**. Composition artifact.  
  - **Sentence for Deck**:  
    > *"Apparent age differences in sustainable spending are explained by income and homeownership. After controlling for these, 25–34s and 45–54s show similar attitudes."*  

  #### (d) **Your Gen Z finding**  
  - **Assumed Data**: One-off 2024 survey showing 18–24s differ from 45–54s.  
  - **Step 1**: No trend data → **Stop** (cannot test stability).  
  - **Verdict**: **Unsupported**. Could be age, period, or composition.  
  - **Replacement Sentence for Deck**:  
    > *"In 2024, adults 18–24 reported higher demand for [thing] than adults 45–54. However, without tracking over time, we cannot determine if this is a generational difference, life stage, or recent trend."*  
  - **Walk-Back Note to Committee**:  
    > *"This finding may reflect current circumstances (e.g., economic conditions) or life stage, not an inherent Gen Z trait. We’ve paused related initiatives until we validate with longitudinal data."*  
  - **Smallest Additional Data**:  
    > *Re-run the survey in 2025. If the gap persists, proceed to Step 2 (cohort tracking). Cost: 1 survey wave.*  

  ---

  ### Procedure Confidence  
  - **Highest Confidence**: Steps 1 (stability) and 3 (composition). Based on standard causal triage.  
  - **Medium Confidence**: Step 4 (heterogeneity). Subgroup analysis is prone to noise but critical.  
  - **Lowest Confidence**: Step 2 (cohort persistence). Highly sensitive to data quality; weakest link.  
  - **Overall**: 70% confidence for clean cases (e.g., Case A). Drops to 40% for sparse data (e.g., Case D).  

  **Why This Works for Your Team**: No advanced stats; uses existing surveys; focuses on falsifiability. Forces analysts to confront age/period/cohort entanglement upfront.
