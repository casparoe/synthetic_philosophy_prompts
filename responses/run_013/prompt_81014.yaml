     - Then, when a rung compares two systems that differ in a critical feature, we do not automatically accept the betterness claim. Instead, we require that the system with the critical feature must be at least as good as the one without, unless there is overwhelming evidence to the contrary. And in our chain, if we have a rung that moves from a system with the critical feature to one without (and that rung is claiming the system without is better) then that rung is immediately flagged as requiring a vote.

     - Alternatively, we might break the chain at the last rung before the critical feature is lost (if the chain is going downward in terms of the critical feature) or at the rung that introduces the critical feature (if the chain is going upward). Actually, in our ladder we are going from worse to better, so the critical feature should be present in the higher rungs and absent in the lower? Not necessarily: in the hen example, the chain might be increasing space but losing enrichments at some point? Actually, in the example, the chain is increasing space without adding enrichments, and then we are comparing to a system with less space but enrichments.

     Revised: We break the chain when we have a rung that compares two systems where one has a critical feature and the other does not, and the rung claims that the system without the critical feature is better. We then require a vote on that specific rung.

  Step 6: Recorded vote. If after steps 2-5 there is still a chain that leads to a conclusion that contradicts a strongly held belief, then the committee must vote on the entire chain's conclusion. But more importantly, they must vote on the threshold and on the critical features.

     Specifically, the vote should be on: "Do we accept that for the animal in question, a system with [critical feature] is always better than a system without, regardless of the other attributes (like space)?" If the vote is yes, then any chain that violates that is broken. If the vote is no, then we must accept the chain? But note, the chain might be weak in some rungs.

     Alternatively, we might break the chain at the first weak rung that is above the threshold (if we have set a threshold) and then vote on whether to accept the chain up to that point and reject the rest.

  Step 7: The procedure must stop and put the question to a vote when:
     - A rung is weak and it is the only connection between two parts of the chain that lead to a controversial conclusion.
     - A rung crosses a threshold and the committee is not confident about the improvement beyond that threshold.
     - A rung involves a critical feature and the committee must decide whether that feature is non-compensable.

     The vote is recorded and becomes part of the standard.

  Step 8: The procedure cannot decide:
     - When there is no clear critical feature and no threshold, but the chain of small improvements leads to a conclusion that the committee finds unacceptable. In that case, they must vote on the overall conclusion.

     - It also cannot decide if the committee is evenly split on a critical vote. Then the status quo remains (or the appeal process might be invoked).

  Now, run the procedure on two examples:

  Example 1: Varying only space per hen.

