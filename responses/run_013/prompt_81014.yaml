  Case where the verdict is not liked by the chair:

     Suppose in the hen example, the committee votes that they are not confident about the threshold and then votes that a very large barren cage (1500 cm²) is better than a small enriched cage (500 cm²). Then the chain is accepted and the rulebook must reflect that. The chair may not like it, but the procedure forces that verdict.

     Similarly, for calves, if they vote that separating at 12 months is better than never separating, then that becomes the standard.

  What the procedure cannot decide:

     - It cannot decide if there is no clear critical feature and the chain of weak rungs is long. The committee might have to accept the conclusion even if they don't like it, or they might break the chain arbitrarily at a weak rung and vote to reject the rest.

     - It cannot resolve conflicts between different attributes (like space vs. enrichments) without a vote on the critical feature.

     - It cannot create a cardinal scale. The verdicts remain pairwise.

     - It cannot handle circular chains (but our chains are linear).

     - It cannot handle cases where the chain has multiple branches. We assume a linear ladder.

  Summary of the procedure:

  1. Display the ladder (the chain of pairwise improvements).
  2. For each rung, mark as "strong" or "weak" based on committee confidence in the pairwise improvement.
  3. Check the entire chain against strongly held absolute verdicts (about critical features). If the chain's conclusion violates one, then:
     a. Identify if there is a threshold in the varying attribute (like space or age) beyond which the marginal improvement is negligible. Vote to set the threshold.
     b. Break the chain at the threshold: do not allow comparisons that cross from below the threshold (in the varying attribute) to above to override a critical feature.
  4. If the chain still leads to a violation, require a direct vote on the controversial pairwise comparison (e.g., large barren cage vs. small enriched cage).
  5. Record the threshold and the outcome of the vote in the standard.

