  Step 3: Check against known absolute verdict: The committee holds that any system with enrichments (perches and nest boxes) is better than any barren system, regardless of space. Therefore, the conclusion that 1500 cm² barren is better than 500 cm² with enrichments is unacceptable.

  Step 4: Threshold: The committee may set a threshold at, say, 750 cm². They vote: "Is the improvement from 700 cm² to 800 cm² (in barren cages) an improvement we are confident about?" If they vote no, then 750 cm² is the threshold.

  Step 5: Breaking the chain: The chain has a rung that crosses the threshold? Actually, the chain doesn't include the enriched system. We are comparing the top of the chain (1500 cm² barren) to an enriched system (500 cm²) that is not in the chain. How do we break the chain? We break it at the threshold. We say: above 750 cm², the chain of space improvements is weak and we do not allow it to override the critical feature (enrichments). Therefore, we break the chain at the rung that goes above the threshold? Actually, we break the chain at the point where we are about to compare a system above the threshold (without enrichments) to a system with enrichments. But note, the chain doesn't have that comparison. The chain is only about barren cages. The problem arises when we try to use the chain to compare a high-space barren system to a low-space enriched system.

     Therefore, we must have a rule: if a system has a critical feature (enrichments) and another does not, then we do not allow a chain of improvements in one attribute (space) to override that critical feature. We break the chain by not allowing the comparison via the chain.

     Specifically, we require a direct pairwise comparison between the high-space barren system and the low-space enriched system. And that comparison must be decided by the committee by vote.

  Step 6: Vote: The committee votes on: "Is a system with 500 cm² per hen and enrichments (perches and nest box) better than a system with 1500 cm² per hen without enrichments?" They vote yes (as per their belief). Then the chain of space improvements in barren cages is not allowed to override this verdict.

     But note: the chain of space improvements in barren cages is still valid for comparing barren cages. We just don't let it cross the critical feature boundary.

     Therefore, the procedure records: 
        - Threshold at 750 cm² for space in barren cages: beyond this, extra space does not compensate for the absence of enrichments.
        - And the critical feature (enrichments) is non-compensable by space beyond the threshold.

     Now, what if the committee votes that they are not sure? Then they must vote on the entire chain's conclusion. They might vote to reject the chain for the purpose of comparing to enriched systems.

  Example 2: Varying the age at which dairy calves are separated from the dam.

  The ladder:
     Rung 1: separate at 1 hour -> separate at 1 day [strong?]
     Rung 2: separate at 1 day -> separate at 3 days [strong?]
     ...
     Rung n: separate at 6 months -> separate at 12 months [weak?]

  But the chain concludes that separating at 12 months is better than not separating at all (or separating at 6 months with other benefits? Actually, the example isn't as clear. Let's assume the controversial conclusion is that separating at 12 months is better than a system that does not separate (so the calf stays with the dam for the entire lactation) but with a trade-off (e.g., the dam is in a worse system?).

     Actually, the problem might be that the chain of increasing age at separation leads to the conclusion that separating at 12 months is better than a system that never separates? But that might not be the case. Alternatively, it might lead to the conclusion that separating at 12 months is better than a system that separates at 6 months but provides excellent social contact with other calves? But the chain only varies the age.

     Let's assume the controversial comparison is: separating at 12 months (with no other social contact) is better than separating at 6 months but with excellent social contact? But again, the chain only has one variable.

     Alternatively, the chain might lead to the conclusion that separating at 12 months is better than not separating at all? But that might be acceptable? Or the opposite? The committee might believe that not separating at all is best. So if the chain implies that separating at 12 months is better than not separating, that would be controversial.

     How about: 
        The chain: 
          R1: 1 hour vs 1 day -> 1 day better
          R2: 1 day vs 3 days -> 3 days better
          ...
          Rk: 6 months vs 12 months -> 12 months better

        Then we use the chain to say: 12 months separation is better than 1 hour. But what if we also have a system where the calf is never separated? And the committee believes that never separating is better than separating at 12 months? Then the chain's top (12 months) being better than the bottom (1 hour) is okay, but we cannot use the chain to compare 12 months to never.

     So the problem is similar: we have a chain for one attribute (age at separation) and we want to compare to a system that has a different critical feature (no separation).

     Step 1: Display the ladder.

     Step 2: Mark rungs. Early rungs (short separations) are strong: waiting a day is better than an hour. But as the age increases, the marginal benefit may decrease. Separating at 12 months vs 11 months might be weak.

     Step 3: Check against known verdict: The committee believes that not separating at all (and allowing the calf to stay with the dam for the entire natural weaning period) is better than any system that separates, regardless of the age. Therefore, the chain cannot be used to claim that separating at 12 months is better than never separating.

     Step 4: Threshold: The committee may set a threshold age beyond which further delay in separation does not yield significant benefits. For example, beyond 3 months? They vote: "Is the improvement from 3 months to 4 months an improvement we are confident about?" If not, then 3 months is the threshold.

     Step 5: Breaking the chain: When comparing a system that separates at an age above the threshold to a system that never separates, we break the chain. We require a direct vote.

