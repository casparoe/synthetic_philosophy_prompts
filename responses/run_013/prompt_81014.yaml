prompt: |-
  I chair the standards committee of a farm-animal welfare certification body. Our rulebook is built from pairwise verdicts — system A is better for the animals than system B — which we then chain: enriched cages over barren cages, aviaries over enriched cages, barn systems over aviaries, and so on. Twice a year a proposed ladder arrives in which every rung looks obviously right on its own and the top of the ladder contradicts something we are certain of; the recurring example is a long series of small increases in space per hen, each an improvement, concluding that a very large barren cage is better than a small cage with perches and a nest box. Please write a procedure the committee can actually run on a proposed ladder, turning the question of whether better-than is transitive into an ordered set of steps: what must be true of each rung for it to transmit betterness to the next, how to treat a rung that is an improvement too small to be confident about, when to break the chain rather than accept its conclusion, how to record the point at which we have simply posited a threshold — a level of confinement below which extra space stops compensating — and where the procedure must stop and put the question to a recorded vote on values. Assume no cardinal welfare scale we trust, a two-hour meeting, members with no philosophy training, and a standard we publish and producers can appeal. Run it on two ladders: one varying only space per hen, one varying the age at which dairy calves are separated from the dam. Include the case where it forces a verdict I will not like, and say plainly what the procedure cannot decide.
reasoning: |-
  We are given a certification body that builds a rulebook from pairwise verdicts (A better than B) and chains them. The problem is that sometimes a long chain of individually plausible steps leads to an implausible conclusion (e.g., a very large barren cage being better than a small cage with enrichments).

  We need a procedure that the committee can run on a proposed ladder (a chain of pairwise comparisons) to check its validity. The procedure must:
  1. Break down the chain into steps and specify what must be true of each rung for it to transmit betterness.
  2. Handle rungs that represent improvements too small to be confident about.
  3. Specify when to break the chain rather than accept the conclusion.
  4. Record where a threshold is posited (e.g., a level below which extra space stops compensating for lack of enrichments).
  5. End with a recorded vote on values when necessary.
  6. Run within a two-hour meeting, with members having no philosophy training, and be publishable and appealable.

  Assumptions: No trusted cardinal welfare scale, only pairwise ordinal comparisons.

  Procedure:

  Step 1: Display the ladder. Write the proposed chain of systems in order, from worst to best, with each step being a pairwise comparison (rung). For example, for hens:
     Rung 1: System A (barren cage) -> System B (enriched cage) [B better than A]
     Rung 2: System B (enriched cage) -> System C (aviary) [C better than B]
     ... until the top.

  Step 2: For each rung, ask the committee: "Is the improvement from the lower system to the higher system in this rung an improvement we are confident about?" (i.e., is the higher system better for the animals beyond a reasonable doubt?).

     - If the committee answers "yes" for a rung, mark it as "strong".
     - If the committee is unsure (the improvement is too small or there is disagreement), mark it as "weak".

     Note: The committee must base their judgment only on the two systems in the rung, not on the entire chain.

  Step 3: After marking each rung, check the entire chain for consistency with known absolute verdicts. Specifically, if the chain implies that a system without a certain essential feature (e.g., enrichments) is better than a system with that feature (e.g., a system with perches and nest boxes) and that contradicts a strongly held belief of the committee, then we must break the chain.

     How to break the chain?
     - We look for the first weak rung in the chain that, if removed or questioned, would break the problematic implication.
     - Alternatively, we may break the chain at a point where we suspect a threshold effect.

  Step 4: Identify thresholds. If there is a point in the chain where we believe that beyond a certain level of a resource (like space) the marginal benefit becomes negligible (or zero) and other factors (like enrichments) become critical, then we record that as a threshold.

     For example, in the hen space ladder: we might set a threshold space per hen below which space is critical and above which enrichments become relatively more important. Then, any rung that crosses this threshold must be re-examined in light of the threshold.

     How to set the threshold?
     - The committee must vote on whether such a threshold exists and where it is. They can do this by considering pairs that are on either side of the proposed threshold and asking: "Is the improvement from just below the threshold to just above it (with no other changes) still an improvement we are confident about?" If not, then that threshold is a candidate.

