  Time management: The meeting is two hours. For a ladder of n rungs, step 2 might take 5 minutes per rung (so n * 5 minutes). Setting a threshold (step 3a) might take 20 minutes. Breaking the chain and voting (step 4) might take 20 minutes. So for a ladder of 10 rungs, that would be 50 + 20 + 20 = 90 minutes. They can do two ladders if each is short.

