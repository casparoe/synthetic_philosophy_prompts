answer: |-
  Here's the joke:

  > A researcher finally gets funding for her "Fly-Free Frog" project: a lab lineage raised entirely without flies. She shows the thousandth-generation frog a fly for the first time.  
  > "Finally!" she thinks, "Now we'll see the 'fly detector' neuron fire!"  
  > It doesn't. Not once.  
  > Frustrated, she complains to her advisor: "The neuron *never* fires for flies! How can it *mean* fly?"  
  > The advisor shrugs: "Easy. It's what the tongue-flick mechanism *expects* it to mean."  

  \answer{consumer-based determination of content}

  **Why it works:**  
  1. **The Commitment:** The punchline hinges directly on the teleosemantic claim that content is fixed by the *consumer*'s (tongue-flick mechanism) evolutionary function ("expects"), not the producer's (neuron) actual causal correlation (which is zero).  
  2. **The Absurdity:** The humor comes from the stark disconnect between the *actual* causal history (neuron never fires for flies) and the *teleofunctional* assignment of meaning (it means *fly* anyway).  
  3. **Accessibility:** A non-specialist understands the advisor is claiming meaning comes from the "expectation" of the consumer mechanism, not the actual stimulus. A specialist laughs because it perfectly captures the theory's counterintuitive commitment to consumer-derived content independent of reliable causation.  
  4. **Avoids Clichés:** It uses a frog only because it's the canonical example, not as the joke itself. The humor derives purely from the theoretical commitment.
