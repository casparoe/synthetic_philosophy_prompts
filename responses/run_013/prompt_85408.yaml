prompt: |-
  Three years ago I joined a food cooperative — a few hundred member households, a volunteer board, an annual general meeting, and a set of bylaws that have been amended by hand so many times that no two copies in circulation agree. This autumn the board asked me to chair the bylaws committee, and I have spent the last two months presiding over a dispute I do not know how to resolve.

  The bylaws contain the ordinary clause: they may be amended at a general meeting by a two-thirds vote of the members present, notice having been given. At the November meeting two motions passed. The first was carried by exactly the required two-thirds and changed that very clause, so that amendments now require the unanimous consent of all members rather than two-thirds of those present. The second, carried later the same evening, added a sentence providing that the amendment article itself shall never be amended again. The chair ruled both valid, on the ground that each was passed under the rule in force at the moment it was passed. A minority holds the second motion void, on the ground that a body cannot use the power to amend in order to destroy the power to amend. A second faction holds the first void as well, on the ground that a rule which has been superseded cannot supply the authority by which it is superseded. The treasurer, who has sat on three previous boards and is unimpressed by all of us, maintains that the question is settled neither by the bylaws nor by any argument, but by whoever turns up at the next meeting and is willing to act as though the amendments hold.

  I have come to see that we are rehearsing a problem much older and much more general than our co-op: the constitutional amendment clause that is amended by the procedure it prescribes; the provisions some constitutions place permanently beyond amendment; the doctrine that a constitution has a basic structure that even a unanimous parliament may not alter; the claim that no generation may bind its successors; and even the parlor game Nomic, invented by the philosopher Peter Suber, in which the players amend the rules — including the rule about how rules are amended — and must somehow keep playing. What I have not found is a usable map of the positions: a way of asking a member four or five questions and being able to say, with confidence, you are standing here, and here is what your answer commits you to.

  That is what I would like from you: a decision tree — or, if it comes out cleaner that way, a taxonomy whose branches are labelled with the question that splits them — mapping the positions one can hold on whether and how a rule can validly amend itself.

  Some constraints on the instrument:

  - Every branching node should be a question a member could answer about a concrete case, not a question about a named theory. Use cases like ours: an amendment to the amendment clause carried under the old threshold; an amendment that purports to entrench the clause forever; an amendment that repeals the amendment procedure altogether and leaves none in its place; a rule that forbids its own repeal; a rule that lowers its own threshold; a rule that is repealed and then, years later, re-enacted by the very body that repealed it. Phrase each node so that answering it does not reveal which leaf it leads to.
  - Each leaf should carry the name of the position if it has one in constitutional theory or the philosophy of law, and unnamed if nobody defends it. Where a position has a name, add a clause, not a paragraph, on its most awkward commitment.
  - Flag any two leaves your tree cannot separate, and say what further question would be needed to separate them.
  - Where a combination of answers leaves a node unoccupied, say so, and say briefly whether it is empty because the view is incoherent, because it is unattractive, or merely because nobody has bothered to hold it.
  - Keep it to roughly eight leaves. I want to use it at the February meeting, so it should be answerable by someone who has read nothing but our bylaws.
  - No bibliography and no citations. I have no way to check them and would not know what to do with them.
reasoning: |-
  Hmm, the user is chairing a bylaws committee for a food co-op and facing a complex dispute about whether certain amendments to their bylaws are valid. The amendments changed the voting threshold for future amendments from two-thirds of those present to unanimous consent of all members, and then added a clause making the amendment article itself unamendable. The chair ruled both valid under the rules in force at the time, but there are objections.

  The user wants a decision tree or taxonomy to map out positions on whether a rule can validly amend itself, with specific constraints: concrete questions about cases (like their co-op situation), named positions where they exist, no more than about eight leaves, and no citations. They plan to use this at their next meeting with members who haven't studied legal theory.

  This is fundamentally about the paradox of self-amendment in rule systems. I recall similar issues in constitutional law - like the "basic structure doctrine" in India or "eternity clauses" in Germany's constitution. There's also Peter Suber's Nomic game that explores these ideas playfully.

  For the decision tree, I'll start with whether the old amendment rule can validly change itself. Then branch into whether it can be repealed entirely, whether it can entrench itself against future amendment, and so on. Key positions will include:
  - Procedural formalism (the chair's view)
  - Implied limitations theories (like the minority's view)
  - Successor authority theories (like the treasurer's pragmatic view)
  - Some more nuanced positions

  I need to phrase each branching question neutrally about concrete amendment scenarios without revealing which position it leads to. For example: "Can the amendment clause validly change its own threshold?" rather than asking about theories.

  Each leaf will name positions like "Procedural Formalism" or "Basic Structure Doctrine" and note their key commitments - for example, procedural formalism would accept that a rule could repeal itself entirely, which some find absurd.

  I'll keep it to about eight terminal positions, flag any indistinguishable positions, and note empty branches where combinations of answers lead to incoherent or undefended views. The whole structure should help co-op members self-identify their stance through a few case-based questions without requiring legal expertise.
answer: |-
  Here is a decision tree mapping the positions on whether and how a rule can validly amend itself, based on concrete cases like your co-op's situation. Answering the questions requires only reasoning about specific scenarios, not knowledge of theories.

  1.  **Question 1: Can the amendment clause, using its own procedure (e.g., 2/3 vote), validly change its own requirements (e.g., to unanimous consent)?**
      *   **Yes (Proceed to Question 2)**
      *   **No (Leaf: *Implied Limitation - Self-Application*)**  
          *Position:* The power to amend is impliedly limited; it cannot be used to alter the very source of that power.  
          *Commitment:* The first amendment (changing threshold) is void. The second is likely void too.*

  2.  **Question 2: Can the amendment clause, using its own procedure, validly repeal itself entirely, leaving no amendment procedure?**
      *   **Yes (Proceed to Question 3)**
      *   **No (Leaf: *Implied Limitation - Self-Destruction*)**  
          *Position:* The amendment power cannot destroy itself; repeal without a replacement is invalid.  
          *Commitment:* Repealing the amendment clause altogether would be void.*

  3.  **Question 3: Can the amended (or original) clause validly entrench itself against *any* future amendment (e.g., "this clause shall never be amended")?**
      *   **Yes (Leaf: *Procedural Formalism*)**  
          *Position:* Validity depends solely on the procedure in force *at the time* of passage.  
          *Commitment:* Both your co-op's amendments are valid. A repeal leaving no procedure is also valid.*
      *   **No (Proceed to Question 4)**

  4.  **Question 4: Can a rule validly entrench itself only against being made *less* difficult to amend (e.g., a clause forbidding lowering its own threshold)?**
      *   **Yes (Leaf: *Asymmetrical Entrenchment*)**  
          *Position:* Rules can shield themselves from dilution but not from further entrenchment or repeal under the existing threshold.  
          *Commitment:* Your second amendment (permanent entrenchment) is void, but the first (raising the threshold) might be valid.*
      *   **No (Proceed to Question 5)**

  5.  **Question 5: Can the amendment clause be repealed and then, years later, a new (identical or different) amendment procedure be validly enacted by the *same body* that repealed it?**
      *   **Yes (Leaf: *Successor Authority*)**  
          *Position:* The collective body holds inherent authority to govern itself. The repeal was valid under the old rule; the new rule is valid as an exercise of inherent authority.  
          *Commitment:* Repealing the clause is valid; enacting a new one later is valid. Entrenchment clauses are likely void as attempts to bind inherent authority.*
      *   **No (Leaf: *Basic Structure Doctrine*)**  
          *Position:* Certain core features of the constitution (like the *capacity* to amend) are unalterable, even unanimously. Entrenchment or repeal of the amendment clause itself violates this.  
          *Commitment:* Both your co-op's amendments are likely void. Repealing the clause is void.*

  **Notes on the Tree:**

  1.  **Unnamed Leaf:** The branch where one answers "No" to Q1 leads to an unnamed leaf (`Implied Limitation - Self-Application`). While the *logic* is known (implied limits), this specific combination (only self-application blocked, but self-destruction possibly allowed) isn't a widely named doctrine. It's coherent but often unattractive, as allowing self-destruction but not self-alteration seems arbitrary.
  2.  **Indistinguishable Positions:** The tree cannot distinguish between:
      *   **`Successor Authority`** and a purely pragmatic view like your Treasurer's. Both agree the next meeting's actions determine validity. To separate them, ask: *"Is the validity of the repeal and subsequent re-enactment based on inherent legal principles (`Successor Authority`) or purely on factual acceptance and power (`Pragmatism`)?"*
      *   **`Basic Structure Doctrine`** and the strictest form of `Implied Limitation - Self-Destruction` (answering "No" to Q2). Both would likely void a repeal. To separate them, ask: *"Is the unamendable core defined by specific fundamental principles (`Basic Structure`) or solely by the necessity of having *some* amendment procedure (`Implied Limitation - Self-Destruction`)?"*
  3.  **Empty Nodes:**
      *   **Answering "Yes" to Q3, "No" to Q5:** This path (Self-Amendment OK, Total Repeal OK, Entrenchment OK, but No Re-enactment) is **empty (incoherent)**. If entrenchment is valid, the body has bound its future self, making re-enactment impossible by definition. If re-enactment is impossible, the permanence of entrenchment is meaningless after repeal.
      *   **Answering "No" to Q1, "Yes" to Q2:** This path (Self-Amendment blocked, but Total Repeal allowed) is **empty (unattractive/undefended)**. It allows destroying the power but not modifying it, which seems logically inconsistent and is rarely, if ever, argued. It's coherent but highly unattractive.
  4.  **Key Positions & Commitments Summarized:**
      *   **Procedural Formalism:** Anything goes if the right procedure is followed at the time. Commitment: Accepts permanent entrenchment and even total repeal.
      *   **Implied Limitation - Self-Application:** Amendment clause can't change itself. Commitment: First amendment void.
      *   **Implied Limitation - Self-Destruction:** Amendment clause can't repeal itself without replacement. Commitment: Total repeal void.
      *   **Asymmetrical Entrenchment:** Can make amendment harder forever, but not impossible or easier. Commitment: Permanent entrenchment clause void.
      *   **Successor Authority:** Body has inherent power; old rules valid when passed, new rules valid if accepted. Commitment: Accepts repeal and later re-enactment; entrenchment clauses likely void.
      *   **Basic Structure Doctrine:** Core amendment capacity is unalterable. Commitment: Both self-amendment changing threshold and entrenchment likely void; repeal void.
      *   **Unnamed (Q1=No):** Self-application blocked. Commitment: First amendment void.

  **Using this at the Meeting:**  
  Present the first question using your co-op's amendment (changing threshold under old rule). Ask members: "Do you think that first vote, passed by exactly the old 2/3 rule, was valid?" Based on their "Yes" or "No," guide them to the next relevant question using the scenarios described. The leaf they land on reveals their underlying position and its key implication. The flags about indistinguishable positions (Treasurer vs. Successor Authority; Basic Structure vs. Strict Implied Limitation) show where further clarification is needed. This structure keeps it concrete, grounded in cases, and avoids theoretical jargon.
