prompt: |-
  I serve on the interpretation review board of a regional heritage authority. The board rules, case by case, on whether a proposed archaeological inference is warranted for publication and for public display, and over the years it has built up a track record that I now need to extend.

  Here is how it has ruled. It approved the inference that a set of standardized cubical weights, recovered in matching form from dozens of separate households, indicates a shared system of measurement. It rejected the inference that a single anthropomorphic figurine with exaggerated female features indicates the worship of a fertility goddess. It approved the inference that thick ash layers sealing several settlements in one valley indicate a destructive fire. It rejected the inference that an assemblage of unused, undamaged fine vessels buried beneath a house floor indicates a deliberate ritual of concealment. It approved the inference that marked uniformity in house size and in grave goods across a cemetery indicates limited hereditary inequality. And it rejected the inference that the absence of monumental architecture and of iconography at a site indicates an aniconic religion.

  The new case before us comes from a burned house. Excavators recovered a set of small clay figurines of animals, each pierced and strung on a cord. The species represented match, in rough proportion, the butchered animal bones recovered from the same house, and the figurines show heavy wear consistent with repeated handling. The excavators propose that the occupants believed the figurines stood for their herds and used them in a ritual intended to protect the animals.

  I would like your analysis of how this board is likely to rule and why. Please write it in the following four sections, in this order.

  The candidate rules (roughly 300 words). Identify the distinct rules that fit the board's six earlier verdicts equally well. State each rule precisely enough that it could be applied mechanically, and explain for each how it accounts for all six rulings, including the ones it handles least comfortably.

  Predictions for the new case (roughly 250 words). For each candidate rule, state the verdict it yields on the figurine case and the reasoning by which it gets there. Make clear where the rules agree and where they come apart.

  My verdict and reasoning (roughly 300 words). Give your best guess at the board's actual ruling, and defend it: say which candidate rule you take to be doing the real work in the board's practice, what evidence from the track record supports that reading over the alternatives, and what the board would be committing itself to if your reading is right.

  The case that would settle it (roughly 150 words). Describe a single further case -- artifact type, context, and proposed inference -- whose verdict would distinguish the candidate rules that your preferred rule does not already eliminate. Explain what each remaining rule predicts about it and why that makes it the decisive test.
reasoning: |-
  Okay, the user serves on an interpretation review board for a regional heritage authority. Their role involves evaluating proposed archaeological inferences for publication and public display. They've provided six past rulings and now need to analyze a new case involving animal figurines found in a burned house. The user wants me to structure my response in four specific sections: candidate rules, predictions for the new case, my verdict and reasoning, and a case that would settle it.

  Looking at the board's previous rulings, I can identify several consistent patterns. The board seems to favor inferences based on repeated patterns across contexts. For example, they approved inferences about standardized weights across households and uniform house sizes/grave goods, both indicating widespread practices. They rejected inferences drawn from single artifacts or unique contexts, like the single fertility figurine or the buried vessels. The ash layers case shows they accept clear physical evidence, while rejecting absence-based arguments like the aniconic religion claim.

  For the candidate rules, I need to identify distinct principles that explain all six rulings. Rule 1 could be about "replication across contexts" - requiring multiple instances. Rule 2 might focus on "direct physical evidence" like wear patterns or ash layers. Rule 3 could be "absence of plausible alternatives" - rejecting inferences when other explanations exist. Each rule explains most cases but struggles with at least one: Rule 1 struggles with the ash layers (single event), Rule 2 with the uniformity case (no physical trace), and Rule 3 with the weights (alternatives exist but overruled).

  For the new figurine case, all rules would likely approve the inference. Rule 1 sees multiple figurines matching bone evidence. Rule 2 notes the physical wear. Rule 3 finds no strong alternatives. This unanimous prediction suggests the board will approve, though for different reasons.

  I believe Rule 1 is the board's core principle. It best explains why they rejected the single figurine and absence claims while approving replicated evidence. The ash layers case fits as multiple settlements show it wasn't isolated. If correct, the board commits to requiring distributional evidence.

  To distinguish between Rules 1 and 3, I propose a test case: a unique ritual object with wear but no replication. Rule 1 would reject it as isolated, while Rule 3 might approve if alternatives are weak. This would clarify whether replication is essential or just one factor.
answer: |-
  ### The candidate rules

  **Rule 1: Replication Across Contexts**  
  An inference is warranted only if the evidence demonstrates *replication of the phenomenon across distinct contexts* (e.g., multiple households, settlements, or graves). This rule approves the cubical weights (dozens of households), thick ash layers (multiple settlements), and uniformity in houses/graves (cemetery-wide pattern). It rejects the fertility goddess (single figurine) and aniconic religion (absence lacks replicable positive evidence). It struggles most with the ritual concealment case: unused vessels beneath one floor *could* imply replication if "deliberate burial" is the phenomenon, but the board ruled against it—suggesting "contexts" must be spatially or functionally independent (one floor ≠ multiple contexts).

  **Rule 2: Direct Physical Trace**  
  An inference is warranted only if the evidence shows *unambiguous physical alteration* directly caused by the inferred behavior. This rule approves the ash layers (fire residue) and cubical weights (standardization implies repeated manufacturing/use). It rejects the fertility goddess (no wear/alteration), ritual concealment (undamaged vessels show no ritual trace), and aniconic religion (absence isn’t physical evidence). It handles uniformity in houses/graves least comfortably: uniformity lacks a "physical trace" beyond existence itself, yet it was approved—suggesting "trace" includes consistent material patterning as evidence of social action.

  **Rule 3: Absence of Plausible Alternatives**  
  An inference is warranted only if *no simpler non-cultural or functional alternative* adequately explains the evidence. This rule approves the ash layers (fire is simplest explanation for ash), uniformity (social equality explains consistency better than coincidence), and cubical weights (shared system explains standardization better than independent invention). It rejects the fertility goddess (decoration/art is simpler than worship), ritual concealment (storage/trade cache is simpler than ritual), and aniconic religion (practical limitations simpler than theological prohibition). It struggles with the weights case: independent invention *is* a plausible alternative, yet approved—implying "plausible" excludes highly improbable alternatives.

  ---

  ### Predictions for the new case

  For the **Replication Across Contexts (Rule 1)**, the verdict is **APPROVE**. The figurines represent multiple animal species, mirroring the replicated bone evidence from the same household. The "context" here is the herd composition itself—multiple species and bones provide cross-corroborating replication within the functional unit (household). Heavy wear further reinforces repeated use.  

  For the **Direct Physical Trace (Rule 2)**, the verdict is **APPROVE**. The figurines exhibit heavy wear from handling, providing direct physical evidence of repeated manipulation. The species-bone correlation offers tangible, measurable evidence linking representation to reality. The ritual inference follows directly from this trace.  

  For the **Absence of Plausible Alternatives (Rule 3)**, the verdict is **APPROVE**. Non-ritual alternatives (e.g., toys, counting aids) are less compelling. Toys wouldn’t require species-bone proportionality or heavy ritual-like handling. Counting aids lack explanatory power for wear or species correlation. The ritual explanation is the simplest fit.  

  **Agreement:** All rules predict approval. The case uniquely satisfies all three: replication (within the household’s economic unit), physical trace (wear and bone correlation), and no strong alternative.  

  **Divergence:** Rules 1 and 3 place weight on the *evidentiary breadth* (multiple species/bones), while Rule 2 emphasizes the *wear* as the decisive trace. Rule 3’s approval assumes alternatives are weak, whereas Rules 1/2 rely on positive evidence.  

  ---

  ### My verdict and reasoning

  The board will likely **APPROVE** the inference. **Rule 1 (Replication Across Contexts)** is the dominant principle, with Rule 3 (Absence of Alternatives) as a secondary filter.  

  **Why Rule 1 is primary:**  
  - All approved cases involve replication: weights (households), ash (settlements), uniformity (graves/houses).  
  - All rejected cases lack it: single figurine, one cache of vessels, absence of architecture.  
  - The ash layers case is pivotal: though a single event, it was replicated *geographically* across settlements, satisfying Rule 1. The ritual concealment rejection confirms this—burial beneath one floor is singular, not replicated. Rule 1 also explains the weights approval: replication overrides Rule 3’s "independent invention" alternative because widespread adoption *is* the cultural inference.  

  **Rule 3’s supporting role:**  
  - Rule 3 clarifies why the fertility goddess was rejected (artistic expression is simpler) and why uniformity was approved (accidental consistency is implausible). But it cannot standalone, as the board overruled "plausible alternatives" for the weights.  

  **Commitment if correct:**  
  The board prioritizes *distributional evidence* over isolated finds. It commits to requiring:  
  1. Multiple instances of a phenomenon.  
  2. Demonstration that these instances are non-random (e.g., standardization, spatial distribution).  
  Absence claims (e.g., no monumental architecture) or singular deposits (e.g., buried cache) will fail unless replication is demonstrable across independent units.  

  ---

  ### The case that would settle it

  **Artifact:** A single, heavily worn stone phallus found in a granary.  
  **Context:** No similar objects at the site; granary shows no signs of ritual use.  
  **Proposed Inference:** The object was used in fertility rituals to ensure abundant harvests.  

  **Why it settles:**  
  - **Rule 1 (Replication) predicts REJECTAL:** One object in one context lacks replication. The granary is a functional space, not inherently ritual.  
  - **Rule 2 (Physical Trace) predicts APPROVAL:** Heavy wear indicates repeated handling, and contextual association (granary) links to harvests.  
  - **Rule 3 (Alternatives) predicts REJECTAL:** A functional tool (e.g., pestle, door wedge) or non-ritual symbol (e.g., ownership marker) is simpler than fertility ritual.  

  This tests the primacy of Rule 1 vs. Rule 2. If the board rejects, Rule 1 dominates. If it approves, Rule 2 (physical trace + contextual association) outweighs replication. Rule 3 is eliminated either way, as it rejects due to alternatives.
