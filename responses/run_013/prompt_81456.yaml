  ### Dennett's Four Grades of Creatures: Classification Instrument  
  **Definitions:**  
  - **Darwinian:** Competences fixed by natural selection; no learning within the creature's lifetime.  
  - **Skinnerian:** Competences shaped by trial-and-error learning with real-world reinforcement (rewards/punishments).  
  - **Popperian:** Competences involve internal simulation (e.g., mental testing) to avoid real-world mistakes before acting.  
  - **Gregorian:** Competences depend on culturally transmitted tools (e.g., language, artifacts, practices) that augment the mind.  

  ---

  ### Decision Tree  
  *Start at the top with a concrete behavior. Answer each question based on observable evidence. Proceed to the next node until a leaf is reached. Leaves show the lowest sufficient grade, note if a higher grade is implicated, and warn when diagnosis might be wrong.*  

  1. **Does the behavior change or improve within the individual’s lifetime?**  
     - **No** → **Leaf: Darwinian**  
       - *Wrong if:* Change occurs (e.g., adaptation to new conditions observed).  
       - *Higher grade implicated?* None.  
       - *Case examples:*  
         - Eusocial insect colony (individual ants): Fixed responses; colony-level "intelligence" is Darwinian.  
         - Large language model (during conversation): Weights fixed; no learning.  
     - **Yes** → Proceed to 2.  

  2. **Does the change require the creature to physically perform the behavior (or close variant) in the real world and experience consequences?**  
     - **Yes** → Proceed to 3.  
     - **No** → Proceed to 4.  

  3. **Is the learning accelerated or mediated by an external artifact storing past trial information (e.g., records, tools, shared data)?**  
     - **Yes** → **Leaf: Cached Skinnerian** (mixed outcome: Skinnerian + external cache)  
       - *Wrong if:* Artifact is used for simulation (not just storage) or no reinforcement history is stored.  
       - *Higher grade implicated?* Gregorian (if artifact is cultural).  
       - *Case example:* Human expert (automatic skill): Initially learned via trial-and-error; now "cached" as automatic routine.  
     - **No** → **Leaf: Skinnerian**  
       - *Wrong if:* Internal simulation reduces trials (Popperian implicated).  
       - *Higher grade implicated?* None (unless simulation is covert).  
       - *Case examples:*  
         - Spider (web-building): Improves after real failures.  
         - Rat (lever-pressing): Learns via food rewards.  

  4. **Does the change rely on culturally transmitted tools/practices (e.g., language, taught techniques, artifacts)?**  
     - **Yes** → **Leaf: Gregorian**  
       - *Wrong if:* Tools are innate/individually invented (not cultural) or unnecessary for the behavior.  
       - *Higher grade implicated?* Popperian (if tools enable simulation).  
       - *Case examples:*  
         - Human child (long multiplication): Uses pencil/paper (cultural tool).  
         - Person (mnemonic technique): Taught by another.  
         - Person (solving problem aloud): Uses language (cultural tool); Popperian implicated (simulation via speech).  
         - Crow (dropping stones): **Ambiguous**; if stones are cultural tools, Gregorian; if not, may be Popperian (see below).  
     - **No** → **Leaf: Popperian**  
       - *Wrong if:* Behavior is fast conditioned response (mimics simulation) or unobserved tools are used.  
       - *Higher grade implicated?* Gregorian (if undisclosed tools exist).  
       - *Case example:*  
         - Crow (dropping stones): If no trial-and-error observed and no tools used, Popperian (internal simulation of water displacement).  

  ---

  ### Limitations & Ambiguities  
  - **Crow case ambiguity:** Tree cannot distinguish if stone use is cultural (Gregorian) or individual (Popperian) without evidence of social learning.  
  - **Automatic behaviors (e.g., expert skill):** Cannot reliably distinguish highly practiced Skinnerian responses from automated Popperian simulations. Tree defaults to **Cached Skinnerian** for offloaded learning history.  
  - **Genuine simulation vs. fast conditioning:** Tree cannot verify internal mechanisms; relies on absence of real-world trial. Popperian diagnosis may be incorrect if behavior is rapid conditioning.  

  ---

  ### Empty or Problematic Combinations  
  - **Gregorian but not Popperian:** Coherent but unattractive (e.g., rigid tool use without simulation). Example: Blindly following a recipe without understanding.  
  - **Skinnerian but not Darwinian:** Coherent and common (e.g., learned behaviors not genetically fixed).  
  - **Popperian but not Gregorian:** Coherent and common (e.g., simulation without cultural tools).  
  - **Darwinian but not Skinnerian/Popperian/Gregorian:** Coherent (base grade).  
  - **Scaffolded Popperian (Popperian + Gregorian):** Implied in Gregorian leaf (e.g., using language for mental simulation).  
  - **Cached Skinnerian (Skinnerian + external artifact):** Explicit mixed outcome.  

  ---

  ### Scoring Key  
  | Answer Pattern (Q1 → Q2 → Q3/Q4)          | Grade                     | Notes                                                                 |  
  |-------------------------------------------|---------------------------|-----------------------------------------------------------------------|  
  | No change in lifetime                     | Darwinian                 | Fixed by evolution; no learning.                                      |  
  | Change + Real trial + No artifact cache   | Skinnerian                | Learning via reinforcement; mistakes experienced.                     |  
  | Change + Real trial + Artifact cache      | Cached Skinnerian (mixed) | Skinnerian with external storage (e.g., automatic skill).             |  
  | Change + No real trial + No cultural tools| Popperian                 | Internal simulation; mistakes avoided pre-execution.                  |  
  | Change + No real trial + Cultural tools   | Gregorian                 | Relies on language/artifacts; may imply Popperian (simulation).       |  
  | Gregorian + Simulation observed           | Scaffolded Popperian (mixed) | Gregorian tools enable Popperian simulation (e.g., talking to solve). |  

  **Key for Cases:**  
  - Spider: Skinnerian (no higher grade).  
  - Rat: Skinnerian (no higher grade).  
  - Crow: *Ambiguous*—Skinnerian (if trial-and-error), Popperian (if no trial), or Gregorian (if cultural); tree defaults to observable evidence.  
  - Child: Gregorian (Popperian implicated).  
  - Mnemonic user: Gregorian (no higher grade).  
  - Large language model: Darwinian (no higher grade).  
  - Eusocial insect: Darwinian (individual ants; colony not graded).  
  - Human expert: Cached Skinnerian (no higher grade).  
  - Self-talk problem-solver: Gregorian (Popperian implicated).  

  ---  
  **Instructions:** Use observable evidence to answer questions. If a case fits multiple leaves, choose the *lowest sufficient grade*. Mixed outcomes occur when two grades combine. Flag cases where mechanisms are ambiguous (e.g., crow, expert skill).
