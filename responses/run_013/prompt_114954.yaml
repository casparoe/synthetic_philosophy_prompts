  The computational question might actually be most urgent. If CKR is unrealistic for bounded agents, that undermines much of classical epistemic game theory. Recent results in algorithmic rationality (like Halpern's work) suggest this is ripe for investigation. Plus progress here could influence adjacent fields like multi-agent RL.

  Other candidates: refining solution concepts (important but incremental), epistemic dynamics (foundational but hard), and belief revision (valuable but possibly derivative). The ranking should reflect how answers to the computational question might reshape the others. For example, if we prove bounded agents need fundamentally different epistemic frameworks, that would reprioritize everything.

  For each question, I'll suggest concrete near-term evidence that would move its priority - this responds to the user's request for actionable signals. The "programs/strategies" approach isn't a red herring; work by Moses, Tennenholtz, and Halpern shows it's promising. A key signal would be new complexity results showing when CKR computations become infeasible.

