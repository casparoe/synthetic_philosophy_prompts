  ### Decision Tree: Which Constructivist Are You?

  **Entry Point:** You've encountered double-negation elimination in programming—using control operators like `call/cc` to extract a value of type `A` from a function of type `(A -> Void) -> Void`. This mirrors classical logic's approach, but you wonder: is this just a harmless control-flow trick, or does it hint that classical reasoning is a computational façade? Answer the questions below to find your philosophical stance. No prior logic training needed—just your programming intuition.

  ---

  **Q1.** Is constructivity about *how* a proof is built, not the logic it uses?  
  - **Yes**: Constructivity is a property of proofs, not logics. Skip to **Leaf A**.  
  - **No**: The logic itself must enforce constructivity. Go to Q2.  

  **Q2.** When mathematics claims "there exists an object with property P", what must a proof provide?  
  - **A**: A specific, runnable witness (e.g., code you can execute to get a result).  
  - **B**: A method to compute the witness (in principle), even if infeasible (e.g., an algorithm with unbounded runtime).  
  - **C**: Only a guarantee that assuming no such object exists leads to contradiction.  
    - If **C**, go to Q7.  
    - If **A** or **B**, go to Q3.  

  **Q3.** In type theory, a proof of "for all x, there exists y such that R(x,y)" *always* yields a function `f` where `R(x, f(x))`. Does this align with your view?  
  - **Yes**: Type-theoretic constructivism feels natural. Skip to **Leaf E**.  
  - **No**: Existence doesn’t guarantee uniform computability. Go to Q4.  

  **Q4.** For a decidable predicate `P(n)` (e.g., a program that halts on all `n` with `True`/`False`), if you prove ¬¬∃n P(n) ("it's absurd that no n satisfies P"), can you conclude ∃n P(n)?  
  - **Yes**: Markov's principle holds—exhaustive search will find `n`. Skip to **Leaf C**.  
  - **No**: Absurdity of absence isn't existence. Go to Q5.  

  **Q5.** Can you define a mathematical object by quantifying over a collection that *includes* the object?  
  *(Example: Defining "the smallest positive real" by quantifying over all reals, including the one you're defining.)*  
  - **Yes**: Impredicative definitions are valid. Go to Q6.  
  - **No**: Objects must be built step-by-step without self-referential totalities. Skip to **Leaf D**.  

  **Q6.** Can a function be defined via "choice sequences" (e.g., an infinite sequence of arbitrary choices not governed by a rule)?  
  - **Yes**: Functions can embrace free choice. Skip to **Leaf F**.  
  - **No**: Functions require computable rules. Skip to **Leaf B**.  

  **Q7.** (If Q2=C) Do you accept the axiom of choice?  
  *(Example: From "for every set A, there's a non-empty set B_A" you can glue choices into a single function.)*  
  - **Yes**: Choice is fundamental to classical reasoning. Skip to **Leaf G**.  
  - **No**: Choice introduces unconstructible paradoxes. Skip to **Leaf H**.  

  ---

  ### Leaves

  - **Leaf A: Constructivity as a Property of Proofs**  
    *Most awkward commitment:* You must defend that a proof in *classical* logic can be constructive if it avoids non-constructive steps, even if the logic permits them.  

  - **Leaf B: Bishop-Style Constructivism**  
    *Most awkward commitment:* You must avoid non-rule-based functions (e.g., choice sequences), treating all objects as computable in principle, even if infeasible.  

  - **Leaf C: Russian School**  
    *Most awkward commitment:* You must accept that every total function on natural numbers is computable (Church's thesis), denying uncomputable classical functions.  

  - **Leaf D: Predicativism**  
    *Most awkward commitment:* You must reject impredicative definitions (e.g., standard Dedekind real numbers), rebuilding analysis piecemeal.  

  - **Leaf E: Type-Theoretic Constructivism**  
    *Most awkward commitment:* You must equate proofs with programs, so a "function exists" means *literally extracting code* from a proof, even for non-constructive-seeming axioms.  

  - **Leaf F: Brouwerian Intuitionism**  
    *Most awkward commitment:* You must accept that *all* functions on real numbers are continuous, denying discontinuous classical functions.  

  - **Leaf G: Classical Mathematics (with Choice)**  
    *Most awkward commitment:* You must embrace the Banach-Tarski paradox (decomposing a sphere into pieces that reassemble into two identical spheres).  

  - **Leaf H: Classical Mathematics (without Choice)**  
    *Most awkward commitment:* You must allow vector spaces without bases and sets without well-orderings, making cardinality comparisons messy.  

  ---

  ### Unoccupied Combinations & Notes
  - **Type Theory + Choice Sequences (Q3=Yes + Q6=Yes)**: Unoccupied. *Why?* Unexplored—type theory typically avoids non-rule-based functions.  
  - **Russian School + Impredicativity (Q4=Yes + Q5=Yes)**: Unoccupied. *Why?* Incoherent—Russian constructivism rejects uncomputable objects, while impredicativity risks non-computable totalities.  
  - **Predicativism + Markov (Q5=No + Q4=Yes)**: Unoccupied. *Why?* Unattractive—predicativists reject unbounded search (implied by Markov) for non-built objects.  
  - **Bishop + Markov (Q6=No + Q4=Yes)**: Unoccupied. *Why?* Incoherent—Bishop’s focus on uniform computability clashes with Markov’s non-constructive existential conclusion.  

  ---

  ### Confidence Assessment
  - **Overall Tree**: Moderately confident. The tree covers the required positions and distinctions, balancing programming intuition with philosophical depth.  
  - **Branch Logic**: High confidence in Q1–Q7; they isolate core commitments without presupposing expertise.  
  - **Leaf Assignments**: High confidence for all except:  
    - **Least Sure Point**: Whether "type-theoretic constructivism" (Leaf E) genuinely precludes choice sequences (Q6). Some type theories (e.g., homotopy type theory) permit non-computable paths, blurring this boundary. I prioritised computational clarity over this nuance.  
  - **Awkward Commitments**: Confident—each highlights a defining tension.  

  This tree is a pragmatic map, not dogma. It reflects common positions, but real views often blend ideas. Use it to spark reflection, not as a taxonomic authority.
