prompt: |-
  My friend and I spent most of last night arguing about the akratic drinker — the person who resolves at nine in the evening not to have another glass and empties it at eleven — and we ended up where we always do: she says my kind of explanation (a preference ordering indexed to time, with a discount rate that falls as the delay lengthens) only redescribes the phenomenon, and I say hers (a practical judgment that fails to move the agent) explains something else and quietly presupposes the phenomenon. Write the joint statement we should have produced, as though we had run a real adversarial collaboration instead of going in circles.

  I want a numbered list of claims we can both sign — about what akrasia is, what any explanation of it must deliver, and what each of our frameworks does and does not assert; the synchronic/diachronic distinction stated in wording we both accept, with an honest verdict on whether discounting explains one of those and not the other; then a disagreements table in which each side's position is phrased in wording that side would accept. Follow it with the cruxes, and for each crux a case or argument we would both agree bears on it, with each side's prediction written down in advance. My candidate crux is whether anything in the agent's judgment changes between nine and eleven or only her motivation; hers, I take it, is whether a time-dated ranking plus a decision rule can represent acting against one's own ranking at all.

  Include at least one concrete probe both of us would run: the same agent, offered at nine and again at eleven a straight choice between having the drink later and some small alternative reward. Finally, say which part of our dispute you judge to be merely verbal, and what each of us would have to see to count as evidence against our own position.
