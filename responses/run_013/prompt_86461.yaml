prompt: |-
  Ok, I need someone to actually go at a draft for me. Role for you: a philosopher who's spent years on Williams and on the structure of moral reasons — you're sympathetic to the integrity objection but you're not a zealot about it, and you're especially allergic to the move where someone says "but the agent doesn't have to be deliberating about that" and thinks the objection is thereby answered. Hard critic, not a cheerleader. Before you write any comments, spend some time brainstorming: lay out for yourself the three or four most plausible readings of the integrity objection, because I have a suspicion my draft quietly slides between two of them, and I'd rather you diagnose that than just grade the prose.

  I'm offline all week, so don't tell me to go read anything specific — I can't check it. Tell me where the argument breaks.

  Here's the draft.

  1. The usual way the objection gets run is psychological: utilitarianism supposedly demands that the agent have a certain thought at the moment of action, namely the thought of the general good, even in a case like Williams's man who can save only one person and pulls out his wife. The usual reply is that this is a confusion. Deliberation and justification come apart. The man can act straight out of love, with no maximising thought in his head at all, and it can still be true that the act is justified impersonally. So there's no extra thought, and the objection dissolves.

  2. I think that reply is fine and also beside the point, because the interesting version of the objection was never psychological. The real question is whether the fact that she's my wife is doing work in the reason for acting or is merely an input the impartial structure permits. Here's a test I've been calling the residue test: take the complete impartial justification of the act, and subtract it from the agent's actual reason for acting. If nothing is left over, then the relationship was contributing nothing that the impartial justification wasn't already supplying — it's a permissible selection device, not a ground. Williams clearly thinks something is left over. The accommodation reply says: yes, something is left over, and impartial morality can house it as a tie-breaker among options it already permits. Maybe. But being housed as a tie-breaker inside an impartial structure is not the same as being a ground, and I don't think that's a merely verbal difference.

  3. Now the inverse, which I'm calling the thought-too-few problem (no idea if someone's beaten me to the name). If you defend partiality the standard way — special obligations, agent-relative permissions — you make it sound as though not registering the stranger's claim at all is a virtue, or at least not a defect. I don't believe that. The stranger's claim should show up somewhere in the agent's moral outlook; it just shouldn't be in the deliberation. So my position is: the thought belongs in the standing outlook, not in the deliberating. And that's the deliberation/justification split I dismissed in paragraph 1. Either I've contradicted myself, or the split is real and only the psychological reading of it was wrong. I genuinely can't tell which, and it's the thing I most want you to adjudicate.

  4. Application, to see if the view has any teeth: a doctor with one ventilator, her own child and a stranger, otherwise symmetric. My line says she may choose her child and should be able to say, truthfully and without embarrassment, both "I chose her because she's mine" and "the stranger's claim was exactly as strong and I'm not pretending otherwise." I claim that combination is stable rather than a dodge. If it isn't stable, I think the whole thing collapses, so this is a load-bearing case for me.

  5. One last worry I can't place: maybe all of this is really about the difference between having a reason and being able to give an explanation, and Williams needs the former while the accommodation reply only ever talks about the latter. If that's right, then paragraph 2 is doing work paragraph 3 undoes.

  What I want back, in this order:

  First, prose comments, reasonably tight. Specifically: which reading of the objection do you think I'm actually defending, as opposed to the one I announce? Do I collapse two readings, and if so which? Is the paragraph 1 / paragraph 3 tension a real contradiction or a distinction I'm failing to state? What's the strongest objection to my position that I haven't answered? Is the doctor case stable? Which paragraph is doing the most damage to the draft?

  Second, a JSON object with exactly these fields:

  - "overall_verdict": one of "needs rethinking", "salvageable with surgery", "minor fixes"
  - "verdict_in_one_sentence": string
  - "reading_i_announce": string
  - "reading_i_actually_defend": string
  - "two_readings_i_collapse": object with "first", "second", and "which_one_the_argument_needs"
  - "paragraph_1_vs_3": object with "verdict" (one of "real contradiction", "not a contradiction, and here's the distinction", "unclear") and "the_distinction_if_any": string
  - "strongest_unanswered_objection": string
  - "why_it_lands": string
  - "doctor_case": object with "verdict" (one of "stable", "unstable as stated", "stable only with a restriction") and "the_restriction_or_repair": string
  - "residue_test_verdict": one of "does real work", "collapses into the deliberation/justification split", "ill-defined"
  - "most_damaging_paragraph": integer
  - "best_sentence": string
  - "weakest_sentence": string
  - "one_thing_to_cut": string
  - "one_thing_to_add": string
  - "confidence": number between 0 and 1

  Third, a table with these columns and one row per paragraph of the draft: "paragraph" (number), "issue_type" (pick from: equivocation, overreach, missing objection, unclear, load-bearing assumption, fine), "what_goes_wrong", "what_i_should_do_about_it", "severity" (1 to 5, 5 being fatal).

  Keep the table rows short. And if you think the whole framing in paragraph 2 is wrong, say so in the verdict rather than being diplomatic about it.
reasoning: |-
  Okay, the user is asking me to critique their philosophical draft on Bernard Williams' integrity objection to utilitarianism. They want me to act as a hard critic who's deeply familiar with Williams' work and the structure of moral reasons. 

  First, I need to understand what they're struggling with. Their draft has five paragraphs, and they're particularly worried about tension between paragraph 1 and 3. In paragraph 1, they dismiss the psychological reading of the integrity objection, but in paragraph 3, they seem to rely on a similar distinction between deliberation and justification. That's clearly bothering them, and they want me to adjudicate whether this is a contradiction or a valid distinction.

  The user also mentions they can't access references this week, so I shouldn't suggest reading materials. They're offline and need self-contained feedback. Their tone suggests they want rigorous, uncompromising critique - not cheerleading. They're especially allergic to superficial replies that dismiss Williams by saying "the agent doesn't have to deliberate about that."

  Looking at their draft structure:
  - Paragraph 1 sets up and dismisses the psychological reading
  - Paragraph 2 introduces their "residue test" for what's left after impartial justification
  - Paragraph 3 raises the "thought-too-few" problem about the stranger's claim
  - Paragraph 4 tests it with the doctor/ventilator case
  - Paragraph 5 worries about reason vs explanation

  I need to identify what reading of Williams they're actually using versus what they claim. They announce it's not psychological but about whether relationships provide genuine reasons. However, their residue test seems psychological - it's about what's in the agent's mind. That's a problem.

  The tension between paras 1 and 3 is real. In para 1 they dismiss the deliberation/justification split as answering Williams, but in para 3 they rely on that exact split to handle the stranger's claim. That does look contradictory. The distinction they need is between occurrent deliberation and standing reasons, but they haven't clearly made it.

  The strongest unanswered objection is that their view might collapse into rule-utilitarianism - where partiality is instrumentally permitted but not intrinsically valuable. That undermines Williams' core point about integrity.

  For the doctor case: their combination of "because she's mine" and acknowledging equal claims feels unstable. If the claims are truly equal, choosing based on "mine" seems arbitrary unless they add that relationships aren't just tie-breakers but grounds.

  The residue test is problematic - it tries to measure psychological residue but Williams cares about normative residue. The test conflates the two.

  Paragraph 2 is doing the most damage because it sets up this shaky residue test that everything else depends on. Their best sentence is clearly the one about "housed as a tie-breaker vs being a ground" - that captures Williams well. The weakest is the residue test description which is vague.

  They should cut the residue test entirely and instead argue directly that impartial structures can't capture the distinctive reason-giving force of relationships. They should add explicit discussion of whether relationships provide intrinsic or merely instrumental reasons.

  Overall this is salvageable but needs significant reworking of the normative foundation. I'll structure my response as requested: first prose comments, then JSON, then a paragraph-by-paragraph table. I'll be brutally honest where needed - the user wants a hard critic, not a diplomat.
answer: |-
  ### Prose Comments  

  **Diagnosis of Readings:** You announce a non-psychological reading focused on whether relationships supply *normative grounds* (not deliberative content). But your argument implicitly defends a **hybrid reading**: relationships must furnish *irreducible normative reasons* (para 2’s "ground") *and* manifest in the agent’s psychology as non-instrumental commitments (para 3’s "standing outlook"). You collapse two Williamsian strands: (1) the *source of reasons* (must relationships be subsumed under impartiality?) and (2) *practical identity* (can I fully own my actions if they’re justified externally?). Your argument needs the latter, but your residue test (para 2) assumes the former.  

  **Para 1 vs. Para 3 Tension:** Not a contradiction, but an **unstated distinction**. You dismiss the deliberation/justification split *as a reply to Williams* in para 1 (correctly, since Williams targets justification’s structure). In para 3, you use the same split *descriptively* to locate the stranger’s claim in the "standing outlook." The distinction: **justification’s structure vs. psychology’s architecture**. Your position requires both: impartial justification *permits* partial acts, but the agent’s reason ("because she’s mine") must be non-derivative. The tension arises because para 3’s "standing outlook" smuggles in a normative claim (reasons must reflect identity) that para 1’s dismissal ignores.  

  **Strongest Unanswered Objection:** **Your view risks making relationships *epiphenomenal* to justification.** If the impartial structure *fully* justifies saving the wife (as permissible), then "because she’s mine" is a psychological add-on, not a normative ground — precisely Williams’ worry. Saying the stranger’s claim is "exactly as strong" (para 4) concedes the impartial calculus determines all normative weight, reducing "mine" to a tie-breaker. Williams’ integrity objection demands that relationships supply *sui generis* reasons, not just select among impartially validated options. You haven’t shown how your "standing outlook" avoids this.  

  **Doctor Case Stability:** **Unstable as stated.** If the stranger’s claim is "exactly as strong," then "I chose her because she’s mine" implies either:  
  - (a) "mine" adds *no* normative weight (contra your residue test), making it arbitrary; or  
  - (b) "mine" *does* add weight, contradicting the claim of equal strength.  
  **Repair:** Argue that relationships *modify* the normative landscape: the stranger’s claim remains, but the doctor’s role as parent generates a *stronger* obligation *to her child*. This rejects symmetry, but preserves impartiality’s constraint (no one’s claim is ignored).  

  **Most Damaging Paragraph:** **Paragraph 2.** The residue test conflates *psychological* residue ("what’s in the agent’s head") with *normative* residue ("what grounds the reason"). This lets the impartialist off the hook: they’ll say, "The residue is just your subjective motive; justification is already complete." Williams needs normative irreducibility.  

