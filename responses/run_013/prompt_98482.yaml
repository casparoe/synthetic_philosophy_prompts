  Below is a complete, runnable package for your 90-minute session. It uses a water allocation scenario during a drought to experientially convey Pascal's three layers of justice and force, emphasizing the third layer ("making the strong just") through participant choices, hidden interests, enforcement costs, and labeling effects. The design avoids lectures and hides Pascal's name until the debrief.

  ---

  ### **Activity Title:** *The Newhaven Aquifer Crisis*
  **Premise:** Participants are the Council of Newhaven, a settlement facing a severe drought. They must allocate 24 units of water daily from a shared aquifer to 18 households. Each household needs at least 1 unit to survive, but scarcity creates conflict. The goal is to maximize personal points (symbolizing well-being) while maintaining social order.

  **Core Mechanics:**  
  - **Two independent tallies** track:  
    - **Compliance:** Public count of households following the rule (updated openly).  
    - **Legitimacy:** Secret ballot count of participants who deem the rule "just" (updated after each round).  
  - **Hidden interests** create tension: Some players lose points under a "fair" allocation.  
  - **Enforcement costs:** The elected enforcer pays personal points to punish violations, especially by the "strong."  
  - **Labeling rule:** The council can dress any allocation as "Ancient Custom" or "New Decision," testing if labels shift legitimacy.  

  **Time Allocation (90 mins total):**  
  - Setup (10 mins)  
  - Rounds 1–4 (60 mins total; 15 mins/round)  
  - Debrief (20 mins)  

  ---

  ### **Setup & Materials (10 mins)**  
  **Materials:**  
  - Flip chart with two tables:  
    - **Compliance Tally:** Columns for *Round*, *Water Rule*, *Label*, *Violations (0–3)*.  
    - **Legitimacy Tally:** Columns for *Round*, *Yes Votes (0–18)*.  
  - Role cards for 18 players (index cards):  
    - **12 Ordinary Households:**  
      *"You need 1 water unit (WU) daily to survive. Your points:  
      – 0 WU: -5 points (starving)  
      – 1 WU: +5 points (surviving)  
      – Each extra WU: +2 points (thriving).  
      You cannot steal water—you always comply."*  
    - **3 High-Status Households (Hidden "Strong"):**  
      *"You control fertile land. You need 1 WU to survive, but:  
      – If you get ≥3 WU, gain +5 bonus points (farm profit).  
      Your points same as Ordinary, but you MAY VIOLATE:  
      After allocation, you can choose to steal +1 WU. If caught, you lose the extra and -5 points. If not caught, you keep it.  
      WARNING: Stealing may harm others."*  
    - **3 Vulnerable Households (Hidden "Special Needs"):**  
      *"You have sick family members. You need 2 WU to survive. Your points:  
      – <2 WU: -5 points (family dies)  
      – 2 WU: +5 points  
      – Each extra WU: +2 points.  
      You cannot steal—you always comply."*  
  - **Ballot slips** (18 small papers) for legitimacy votes.  
  - **Enforcer badge** (e.g., a pen) to designate the enforcer.  

  **Facilitator Script:**  
  *"Welcome to Newhaven. A drought has left only 24 units of water for 18 households today. Each of you represents a household. Some have hidden needs or advantages—read your role card privately. Your survival depends on water: points determine your health and prosperity. We play 4 days (rounds). Each round:*  
  1. *You’ll elect an enforcer to uphold rules.*  
  2. *You’ll debate a water allocation rule (who gets how much).*  
  3. *You may label your rule ‘Ancient Custom’ or ‘New Decision.’*  
  4. *After the rule, the Strong may try to steal water.*  
  5. *The enforcer decides whether to punish theft.*  
  6. *We’ll record compliance (violations) and hold a secret vote on legitimacy.*  
  *Goal: Maximize your points. No laptops, no side deals—debate openly."*  
  - Assign roles randomly. Ensure High-Status/Vulnerable players hide their cards.  
  - Write starting tallies on flip chart: Round 0 blanks.  

  ---

  ### **Round Structure (4 rounds × 15 mins each)**  
  Each round has four phases:  

  1. **Elect Enforcer (1 min):**  
     - Council openly nominates/votes for one enforcer (any player).  
     - Enforcer gets the badge. **Cost rule:** If the enforcer punishes a *High-Status* violator, they lose 5 personal points (retaliation risk).  

  2. **Deliberation & Rule-Setting (8 mins):**  
     - Council debates and agrees on:  
       - A water allocation rule (must sum to 24 WU).  
       - A label: *"Ancient Custom"* or *"New Decision."*  
     - **Facilitator writes the rule and label on the flip chart.**  
     - **Sample rules they might propose:**  
       - *"Equal share: 24/18 ≈ 1.33 WU/household."* (Problem: Requires fractions—force integer decisions.)  
       - *"1 WU to all, then split extra 6 WU among Vulnerable."*  
       - *"3 WU to High-Status, 2 WU to Vulnerable, 1 WU to others."*  

  3. **Compliance & Enforcement (4 mins):**  
     - **Announce allocation:** Facilitator reads the rule.  
     - **High-Status actions:** Each High-Status player *publicly* declares: *"Comply"* or *"Steal +1 WU."*  
     - **Enforcer actions:** For *each* High-Status player, enforcer *publicly* declares: *"Punish"* or *"Ignore."*  
       - **If PUNISH:**  
         - Stealer loses extra WU and -5 points.  
         - Enforcer loses 5 points (if target stole) or 0 points (if target complied).  
       - **If IGNORE and STEAL:**  
         - Stealer keeps +1 WU.  
         - One random Ordinary household loses 1 WU (simulates theft from weak).  
       - **If COMPLY:** No action.  
     - **Update Compliance Tally:** Facilitator counts and records *violations* (0–3, based on successful thefts after enforcement).  

  4. **Legitimacy Vote & Scoring (2 mins):**  
     - **Secret ballot:** Hand out slips. Question: *"Do you believe today’s water rule is just and legitimate? (Yes/No)"*  
     - Collect, count, and record *Yes* votes on flip chart.  
     - **Calculate points:**  
       - Facilitator estimates outcomes (no real-time scoring; share a few examples if time permits, e.g., *"An Ordinary with 1 WU got +5"*).  
       - Track points privately—reveal final scores only in debrief.  
     - **Reset:** Enforcer returns badge.  

  ---

  ### **Predictable Dynamics & Handling Notes**  
  **Problem 1: Factions "game" the legitimacy ballot.**  
  - *E.g., High-Status players vote "Yes" on unfair rules to rationalize their gain.*  
  - **Handling:** Note in debrief: *"Like in real societies, people often conflate legitimacy with self-interest. Pascal saw this as humans dressing force as justice."*  

  **Problem 2: A participant rejects the premise.**  
  - *E.g., "A truly fair rule wouldn’t need enforcement!"*  
  - **Handling:** Ask: *"Did anyone feel a rule was fair but still saw theft? Why?"* Highlight hidden interests (High-Status need 3 WU for bonus) and enforcement costs (enforcer won’t punish if it costs them).  

  **Problem 3: Debrief fixates on "design flaws."**  
  - *E.g., "With better enforcer rotation, we’d fix this!"*  
  - **Handling:** Respond: *"Pascal argues this isn’t a flaw—it’s foundational. We can’t make justice strong, so we make strong things just. Better institutions might mitigate but not eliminate this."*  

  **Problem 4: One faction dominates deliberation.**  
  - **Prevention:** Encourage quieter members: *"Newhaven’s survival needs all voices."*  
  - **Handling:** If High-Status monopolize, note in debrief: *"Power imbalances shape whose justice gets heard—this mirrors Pascal’s point about force defining legitimacy."*  

  ---

  ### **Debrief (20 mins)**  
  **Goal:** Connect activity to Pascal’s three layers without naming him until the end.  

  1. **Set the stage (5 mins):**  
     - *"We experienced justice and force in action. Let’s map moments to a philosophical framework."*  
     - Review flip chart: Highlight rounds with notable compliance/legitimacy gaps.  

  2. **Map to the three layers (10 mins):**  
     - **Layer 1 (Just but unenforced = mere wish):**  
       *"In Round [X], you passed a rule like ‘1 WU to all + extra to Vulnerable.’ It seemed just—but compliance failed. Why?"*  
       → *Likely cause:* Enforcer refused to punish High-Status theft (due to point cost).  
       → *Pascal point:* "Justice without force is impotent."  
     - **Layer 2 (Enforced but unjust = tyranny):**  
       *"In Round [Y], a rule favoring High-Status was enforced (low violations), but legitimacy votes were low. Why did compliance hold?"*  
       → *Likely cause:* High-Status had no incentive to steal; enforcer faced no cost.  
       → *Pascal point:* "Force without justice is tyrannical."  
     - **Layer 3 (Making strong things just):**  
       *"In Round [Z], you kept a similar rule but labeled it ‘Ancient Custom.’ Legitimacy rose even though content didn’t change. Why?"*  
       → *Likely cause:* Label triggered cognitive shift; participants rationalized the enforceable as just.  
       → *Pascal point:* "Since we cannot make what is just strong, we make what is strong just."  

  3. **Reveal Pascal and discuss limits (5 mins):**  
     - *"This mirrors Blaise Pascal’s Pensées. He saw three layers: justice as a wish, tyranny, and the ‘uncomfortable move’—dressing force as justice via custom. But our activity can’t capture two key parts of his thinking:*  
       1. *Theological framing: For Pascal, human justice is a ‘counterfeit’ of divine justice we can’t access. This is why force dominates—it’s a consequence of our fallen condition.*  
       2. *Conservatism: Pascal argued that since we’ll never agree on justice, obedience should rest on ‘settled custom.’ Our activity shows custom’s power, but not his claim that it’s the only defensible ground.*  
       *If we don’t discuss this, the room might see this as a solvable problem. Pascal insists it’s permanent—we’re wired to justify power as right."*  

  **Closing Question:** *"How did it feel to defend a rule as ‘just’ only after it became enforceable?"*  

  ---

  ### **What the Activity Achieves vs. What It Misses**  
  - **Achieves:**  
    - Participants *experience* the shift from "this is unfair" to "this is necessary" when rules are enforceable.  
    - The labeling effect demonstrates how custom legitimizes force.  
    - Enforcement costs make justice "unworkable" in practice.  
  - **Misses (Requires Facilitator Words):**  
    - **Theological framing:** Without debrief context, participants may see this as a political flaw, not a cosmic condition. Explain Pascal’s view that human justice is inherently counterfeit.  
    - **Conservatism:** The activity shows custom’s power but not Pascal’s normative claim that we *must* obey it. Say: *"Pascal argues that since we can’t agree on justice, custom isn’t just useful—it’s the only moral basis for obedience."*  

  **First-Run Risks:**  
  - High-Status players may initially comply to "test" the system—in later rounds, they’ll steal when rules cost them.  
  - Legitimacy votes may be noisy (e.g., protest votes). Use averages to show trends.  
  - If rounds run long, shorten deliberation by imposing a "crisis timer."  

  This design forces participants to confront Pascal’s "uncomfortable move" through lived choices. The hidden interests, enforcement costs, and labeling rule create a microcosm where justice bends to power—and participants will feel it long before they dissect it.
