  We need to allow time for the facilitator to calculate scores and update the flip chart. We might need to reduce the deliberation time or have the calculation done while the ballot is being collected.

  **Adjustment for Time:**
  We might run over. We can make the compliance phase faster by having the declarations and enforcement decisions very quick (1 min). And the ballot collection quick (1 min). Then the facilitator has 2-3 min to calculate and update.

  Alternatively, we can have only 3 rounds and extend debrief.

  But let's plan for 4 rounds.

  **Example Round Flow:**

  Round 1:
  - Election of enforcer: 1 min.
  - Deliberation: 8 min. They might choose an equal allocation. But with 24 WU and 18 households, they might do 1 for everyone and then 6 extra to be given to 6 households (so those 6 get 2). Or they might give 2 to the special needs and then 1 to everyone else? 
  - Label: They might call it "new decision".
  - Compliance: Strong households declare. They might violate if they were allocated only 1 (because they want 3 for the bonus). The enforcer decides. 
  - Outcome: If strong violate and enforcer doesn't enforce, then victims occur. 
  - Compliance tally: Record number of violations (0-3). 
  - Legitimacy ballot: Collect and count.

  Round 2: They might try a rule that gives more to the strong to prevent violation. For example, give 3 to each strong household. Then the strong might not violate. But the rule might be seen as unjust.

  Round 3: They might keep the rule but label it as custom.

  Round 4: They might try something else.

  We can't predict exactly, but the facilitator can nudge in the debrief to highlight the desired moments.

  **Facilitator Notes:**
  - Be neutral during the activity.
  - In the debrief, draw out the three layers from the rounds that occurred.
  - If a round doesn't go as expected, use the data: e.g., if in round 1 they had low compliance for a just rule, use that. If they had high compliance for an unjust rule, use that.

  This is a complex design. We hope it runs within time and delivers the experience.
