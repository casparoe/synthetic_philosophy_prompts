answer: |-
  ### Sorting the Candidate Fifth Grades
  I evaluate the four candidate fifth grades (A–D) against the four-grade hierarchy (Darwinian, Skinnerian, Popperian, Gregorian) to determine which genuinely extend the hierarchy beyond the Gregorian grade. The Gregorian grade involves thinking tools (e.g., notation, institutions) that rewire internal testing, allowing for cultural transmission and enhancement of cognition. A candidate extends the hierarchy if it introduces a fundamentally new mechanism or level of cognitive operation that is not merely a restatement or subset of Gregorian capabilities. I sort them into two tiers: **Tier 1** (genuine extensions) and **Tier 2** (restatements or elaborations of Gregorian).

  #### Tier 1: Genuine Extensions (beyond Gregorian)
  - **A. Machine-offloaded**: This earns a place as a fifth grade because it delegates hypothesis-testing to external, opaque machines, creating a novel layer of cognitive offloading where the agent's internal processes are bypassed or augmented by uncontrolled external computation, moving beyond Gregorian's tool-rewired internal testing to a form of unaccountable external cognition.
  - **C. Cumulative-lineage**: This qualifies as an extension by introducing cultural evolution of the tools themselves (via selection on tools, not agents), enabling cumulative optimization of thinking tools across generations; this is distinct from Gregorian inheritance, as it adds a faster, tool-focused evolutionary mechanism parallel to biological selection.

  #### Tier 2: Restatements of Gregorian (no extension)
  - **B. Scaffolded**: This is a restatement of the Gregorian grade, as it describes acquiring internal simulation through cultural tools (e.g., language or rituals), which is already core to Gregorian rewiring; it does not add a new selection mechanism but parasitically depends on existing cultural niches.
  - **D. Installed-reward**: This is also a Gregorian restatement, as it involves cultural shaping of reinforcement learning (e.g., via social norms or institutions), which is inherent in Gregorian tools like institutions that externally influence rewards and desires without introducing a novel cognitive layer.

  ### Fraction of Explanatory Work by Original Four Grades
  The original four grades (Darwinian, Skinnerian, Popperian, Gregorian) do **0.85** (85%) of the explanatory work in describing cognitive hierarchies. This fraction reflects their comprehensive coverage of core mechanisms: biological evolution, individual learning, internal simulation, and cultural tool-based rewiring. The remaining 15% is assigned to the genuine extensions (A and C), which address modern phenomena like opaque machine delegation and tool evolution not fully captured by the original framework.
