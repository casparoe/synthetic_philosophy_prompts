  \ any identity beyond their relative position in the cycle. However, for writing\
  \ we use labels, but these are to be understood as arbitrary and not part of the\
  \ observable structure.\n- **State**: Each node has a binary state: 0 or 1.\n- **Update\
  \ rule (deterministic)**: At each time step, the next state of a node is the XOR\
  \ of its own state and the state of the node it points to. Specifically:\n  - For\
  \ node A: next state = A XOR B\n  - For node B: next state = B XOR C\n  - For node\
  \ C: next state = C XOR A\n- **Initial condition**: At time t0, the state is (A=0,\
  \ B=0, C=1).\n\n### Evolution\n\n- At t0: (A=0, B=0, C=1)\n- At t1: \n  - A: 0 XOR\
  \ 0 = 0\n  - B: 0 XOR 1 = 1\n  - C: 1 XOR 0 = 1\n  - State: (0,1,1)\n\n### The Rival\
  \ Interpretations\n\n1. **Haecceitism (H)**: Nodes have primitive identities. The\
  \ state (0,0,1) at t0 is ontologically distinct from any state that is isomorphic\
  \ under a non-trivial automorphism of the graph, even if the relative states are\
  \ the same. The automorphism group includes cycling the nodes (A->B, B->C, C->A)\
  \ and the inverse cycling.\n\n2. **Relationism (R)**: Only the structure and the\
  \ pattern of states matter. States that are related by a graph automorphism are\
  \ identical. The automorphism group is part of the structure, and any two states\
  \ that are automorphic are the same state of affairs.\n\n### The Divergence on Determinism\n\
  \n- **Haecceitism (H)**: The world is deterministic. Given the initial state (0,0,1)\
  \ at t0, the update rule produces exactly one future state (0,1,1) at t1. \n  -\
  \ Why: The rule is a function from states to states, and it is not multi-valued.\
