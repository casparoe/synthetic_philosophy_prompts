  \ (1,0,0) for the same nodes), then from (1,0,0) the next state is (1,0,1) (because\
  \ A=1, B=0: A next =1 XOR0=1; B=0, C=0:0 XOR0=0; C=0, A=1:0 XOR1=1 -> (1,0,1)).\
