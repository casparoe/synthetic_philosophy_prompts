prompt: |-
  I run compliance for a mid-sized international NGO — about 400 staff across a dozen countries, mostly in places where the lines around gifts, favors, and family obligations don't look like they do back at our HQ. Every week something lands on my desk: a country office wants to approve a gift to a local official, or a project lead hired somebody's relative to keep the village council on side, or a finance officer flags a payment to a customs clerk that "everyone does." Right now we're deciding these case by case and the answers are all over the place, which is a problem because people get fired over them and programs get shut down.

  I need a decision procedure my field staff can actually run — people with no philosophy background, working in a hurry, sometimes under pressure from a government office. Something like: the questions to ask, in order; what a sufficient answer to each one looks like; where the procedure just stops and says no; and where it has to hand the decision to a person because it's turned into a question of values rather than facts. And I want it grounded in the actual thinking about this stuff — what clientelism really is versus a gift economy, whether a gift and a bribe are different moral categories or the same one with better manners, the argument that anti-corruption standards are just Western norms in a suit, the counterargument to that. Don't dumb it down to the point where it stops tracking the real distinctions, but don't make me hand my field staff a seminar either.

  Then run it on three cases: a genuinely customary gift to a local official's family at a wedding, a cash payment to a customs clerk to get medical supplies released, and hiring a village elder's nephew because the elder controls access to our project site. At least one of those should come out with an answer my country directors won't be happy about — say which and why. Also be honest about where the procedure can't decide for us, especially around the universality question, and tell me who should be signing off when it hands the call to a human.
reasoning: |-
  Okay, let me tackle this complex compliance challenge for an international NGO. The user needs a practical decision procedure that field staff can use without philosophical training, grounded in real ethical distinctions but not oversimplified. 

  First, I consider the core tension here: Western compliance standards versus local practices where gift-giving and family obligations operate differently. The user mentioned cases like wedding gifts to officials, customs payments, and nepotistic hiring - all classic examples where cultural norms clash with anti-corruption policies.

  Hmm... I should build the framework around three key ethical concepts: intent (why we're doing it), power imbalance (who benefits), and harm (what's at stake). This avoids Western-centric assumptions while maintaining rigor. For field staff, we need clear binary questions - no maybes until the final steps.

  The wedding gift case is interesting - if it's genuinely customary and not transactional, it might pass. But the customs payment? That's clearly coercive despite "everyone does it." And hiring the elder's nephew... tricky. It could be cultural pragmatism or outright extortion depending on whether alternatives exist. 

  Ah! The procedure must force staff to consider alternatives first. Did they try official channels? Could they walk away? That's where Western norms often fail - sometimes there are no alternatives. But we can't compromise on medical supplies being held hostage - that procedure step should auto-reject.

  For the "gray zones" like the nephew hire, the framework should escalate to HQ with local context. The country director shouldn't decide alone - too close to the problem. Needs legal AND programs input. 

  Biggest worry: staff might game the system. So we'll require documentation at each step - no "trust me" answers. And mandatory training with these exact cases to show how cultural arguments get tested. That medical supplies case? It'll make country directors furious when blocked, but we have to hold that line.
answer: |-
  Here's a practical, ethics-grounded decision procedure for your field teams, designed for speed and clarity without sacrificing nuance. It breaks down into 5 core questions with mandatory documentation at each step:

  **The "5 Gates" Gift/Favor/Hiring Decision Procedure**

  1.  **GATE 1: IS IT TRANSACTIONAL?**
      *   **Question:** Is this *explicitly* tied to receiving a specific, improper benefit *now* or *imminently*? (e.g., "Pay $X to get supplies released *today*," "Hire nephew X *to gain access* to site Y next week").
      *   **Sufficient Answer:** "No, this is unrelated to any specific official action or decision we need." OR "Yes, Clerk/Official explicitly linked payment/hire to the service."
      *   **Stop & Say No If:** YES. (Pure bribe/extortion). **Document:** Who linked it? What was demanded? Alternative channels attempted?
      *   **Proceed If:** NO. Gate 2.

  2.  **GATE 2: IS IT VOLUNTARY & NON-COERCIVE?**
      *   **Question:** Could we reasonably refuse or offer a symbolic alternative *without fear of retaliation, undue delay, or harm to beneficiaries*? (Consider: Is refusal safe? Are delays life-threatening? Is the "expectation" backed by implied threat?)
      *   **Sufficient Answer:** "Yes, refusal is culturally acceptable/possible without harm." OR "No, refusal risks program shutdown, staff safety, or critical beneficiary harm."
      *   **Stop & Say No If:** NO *and* the value/action is significant *or* involves government officials. (Coerced "gift" = bribe). **Document:** Specific risks of refusal, evidence of coercion (past incidents?).
      *   **Proceed If:** YES *or* NO but involves minor non-officials AND Gate 4 passes. Gate 3.

  3.  **GATE 3: IS IT CUSTOMARY & PROPORTIONATE?**
      *   **Question:** Is this consistent with *local, non-governmental* social/religious customs for the occasion/relationship? Is the scale typical for the giver's/receiver's status? (e.g., a village elder's wedding gift vs. a Minister's).
      *   **Sufficient Answer:** "Yes, confirmed by 2+ local non-staff references and fits the occasion." OR "No, this exceeds typical local practice significantly or targets officials only."
      *   **Stop & Say No If:** Involves government officials AND is disproportionate/customarily inappropriate. **Document:** Customs referenced, value compared to local norms, who receives it.
      *   **Proceed If:** Not involving officials OR involving officials but genuinely customary/proportionate. Gate 4.

  4.  **GATE 4: IS IT TRANSPARENT & DISCLOSABLE?**
      *   **Question:** Can this be fully documented and disclosed publicly (to HQ, auditors, donors, potentially local media) *without damaging the NGO's reputation or mission*?
      *   **Sufficient Answer:** "Yes, we can document who/what/when/why/value, and justify it ethically based on Gates 1-3." OR "No, disclosure would cause scandal or undermine trust."
      *   **Stop & Say No If:** NO. (If it can't withstand sunlight, it's corruption). **Document:** Reason for non-disclosure risk.
      *   **Proceed If:** YES. Gate 5.

  5.  **GATE 5: ALTERNATIVES & VALUES CHECK**
      *   **Question:** *Despite passing Gates 1-4,* are there viable alternatives (e.g., formal channels, delays, advocacy)? Does this align with core NGO values (integrity, impartiality, serving the vulnerable) *even if locally acceptable*?
      *   **Sufficient Answer:** "No viable alternatives exist without severe harm." AND "It aligns with serving beneficiaries impartially." OR "Alternatives exist or it compromises core values."
      *   **Hand Off to Human If:** Gates 1-4 are passed *but* significant values tension remains (e.g., reinforces harmful power structures vs. avoids immediate harm). **Document:** Alternatives considered, core values conflict identified.
      *   **Approve If:** No values conflict AND no viable alternatives OR strong alignment.
      *   **Reject If:** Viable alternatives exist OR core values are compromised.

  **Ethical Grounding & Nuance:**

  *   **Clientelism vs. Gift Economy:** Gift economies build social bonds through *reciprocal, non-transactional* exchanges over time. Clientelism is *hierarchical* exchange: favors/goods for political support/access. Gates 1 (Transactional) & 2 (Coercion) target clientelism.
  *   **Gift vs. Bribe:** Intent (Gate 1), Coercion (Gate 2), and Custom (Gate 3) are key. A *true* gift expects nothing specific in return, is voluntary, and fits custom. A bribe is payment for specific influence/action, often coerced.
  *   **Universality vs. Cultural Relativism:** Gates 3 (Custom) & 5 (Values) grapple with this. We acknowledge *local* norms (Gate 3) but set *universal* NGO red lines: no coercion (Gate 2), no transactions for improper gain (Gate 1), and transparency (Gate 4). Core values (Gate 5) are non-negotiable, even if locally inconvenient. Anti-corruption standards aren't *just* "Western suits" – they protect resources for the vulnerable and uphold fairness. The counterargument (cultural relativism) is valid *only* when local practices are genuinely non-coercive, non-transactional, and don't undermine core missions (hence Gate 5).
  *   **Who Decides Human Judgment Calls (Gate 5)?** A **Triage Committee** at HQ: **Legal Counsel** (compliance risk), **Head of Programs** (operational/beneficiary impact), **Ethics Officer/CFO** (values/financial integrity). Country Director provides context *but does not vote* (conflict of interest). Requires written justification citing Gates 1-5 analysis.

  **Applying the 5 Gates:**

  1.  **Customary Wedding Gift to Local Official's Family:**
      *   **Gate 1 (Transactional):** NO (Not for specific action). PASS.
      *   **Gate 2 (Voluntary/Coercive):** PROBABLY YES (Refusal unlikely to cause retaliation/delay). PASS.
      *   **Gate 3 (Customary/Proportionate):** YES (If verified as customary, proportionate). PASS.
      *   **Gate 4 (Transparent/Disclosable):** YES (Document: "Customary gift at wedding of [Official Name]'s [Relation], value [Amount], per local custom verified by [Source]"). PASS.
      *   **Gate 5 (Alternatives/Values):** No strong alternatives needed; aligns with respecting local culture. **APPROVE.** (Country Director Happy)

  2.  **Cash Payment to Customs Clerk for Medical Supplies:**
      *   **Gate 1 (Transactional):** YES ("Pay to get supplies released"). **STOP & SAY NO.** *No need to proceed further.*
      *   **Decision: REJECT.** **Why Country Directors Won't Like It:** It "works," "everyone does it," and delays cost lives. **But:** It's pure transactional bribery (Gate 1), usually coercive (Gate 2 - refusal = indefinite delay), non-transparent (Gate 4), and violates core integrity (Gate 5). The procedure stops it dead at Gate 1. Requires HQ support on systemic solutions (pre-clearance, advocacy, buffer stocks).

  3.  **Hiring Village Elder's Nephew for Site Access:**
      *   **Gate 1 (Transactional):** AMBIGUOUS (Hired *to* gain/keep access? Or hired *and* access is separate?). **Assume YES for analysis** (Strong implication it's transactional). **Document ambiguity.**
      *   **Gate 2 (Voluntary/Coercive):** LIKELY NO (Refusal likely means denied access = program failure/beneficiary harm). **Document specific risk.**
      *   *(If Gate 1 = NO, proceed)*
      *   **Gate 3 (Customary/Proportionate):** QUESTIONABLE (Is nepotism *customary* or just *common*? Is the nephew qualified? Does hiring reinforce unfair power structures?). **Document custom/qualifications.**
      *   **Gate 4 (Transparent/Disclosable):** RISKY ("We hired the elder's unqualified nephew so he'd let us work" looks terrible). **Document disclosure risk.**
      *   **Gate 5 (Alternatives/Values):** **HAND OFF TO HUMAN (Triage Committee).** **Why:** Significant tension. *Arguments For:* Gate 2 coercion (real harm), may be locally normative (Gate 3), access is essential. *Arguments Against:* Transactional nature (Gate 1), transparency risk (Gate 4), undermines merit/equity values, reinforces harmful patronage (Gate 5). **Who Decides:** HQ Triage Committee (Legal, Programs, Ethics). **Factors:** Nephew's *actual* qualifications vs. others, documented history of elder blocking access, existence of alternative sites/strategies, potential for community backlash if *not* hired.

  **Key Takeaways:**

  *   **Clarity & Speed:** Gates 1 & 2 catch the clearest "No's" quickly (bribes, extortion). Documentation forces structured thinking.
  *   **Nuance Preserved:** Gates 3 (Custom) and 5 (Values/Alternatives) handle cultural context without relativism overriding core principles (Gates 1, 2, 4).
  *   **The Unhappy Answer:** The **Customs Payment (Case 2)** is an unambiguous reject. Country Directors will hate it because it feels necessary. The procedure forces confronting that it's core corruption, demanding systemic solutions, not individual compromises.
  *   **Where It Can't Decide:** The **Universality Question** surfaces most sharply at **Gate 5 (Values)** when local necessity/practice clashes with core integrity/impartiality. The procedure flags it for human judgment by a diverse HQ committee, insulating field staff from undue pressure.
  *   **Who Signs Off:** **Gate 5 "Hand Off"** goes to the **HQ Triage Committee (Legal, Programs, Ethics/CFO)**. Field staff provide the documented Gate 1-4 analysis and local context. Country Directors *inform* but *do not decide* due to conflict of interest.

  **Implementation Tip:** Roll this out with scenario-based training using these exact cases. Emphasize that **Gate 1 (Transactional)** and **Gate 4 (Transparency)** are the brightest lines – if it fails either, it's almost certainly a "No." This gives field staff the confidence to push back on the most egregious demands immediately.
