prompt: |-
  My friend and I spent about two hours arguing about wasps last night and I want to actually settle it before we do it again.

  Here's the fight. He tells me about the digger wasp: it drags a cricket back to its burrow, goes inside to check the place out first, and if you nudge the cricket a few inches while its in there, it comes back out, drags the cricket up to the entrance again, and goes in to inspect again. Do it over and over and it just keeps running the loop. He calls anything like that sphexish. Then he drops what he thinks is the scary part: you can't tell from the inside whether you're sphexish, and if we are, then all our talk about being free agents is just us failing to see our own loop. I said thats dumb, partly because someone told me the wasp demo is basically a lab artifact (in real conditions the wasp eventually does something else), and partly because even a genuinely flexible creature could be a puppet, so flexibility looks like the wrong thing to hang free will on. He said I'm missing it, the real question is what flexibility even is.

  Which, ok, fair. So I want the spec first. What would a theory of the difference between rigid mechanical behavior and genuinely flexible behavior have to deliver to count as adequate? Give me the requirements — the cases it has to get right, the distinctions it can't collapse, the results it can't contradict, the puzzles it has to dissolve — with the case or consideration behind each one.

  Some things I want on the list, because they're where the argument actually got stuck:

  - The wasp loop itself, including whether the theory has to take a stand on whether the classic demo is real or a setup artifact, and what follows if it is an artifact.
  - A creature whose behavior is one enormous fixed table of responses that happens to cover everything it will ever meet, versus a small loop that notices when it has stopped working. He says the table is still sphexish; I say from outside there's no difference you could ever detect, so what does the theory say about whether that's a real distinction or just a fact about our models.
  - The bird that fakes a broken wing to lure you away from its nest. Looks like a trick, supposedly a fixed display. He says sphexish. I said fine, then so is a person who learns to fake a limp for sympathy — same behavior, different history. Does the theory sort by where the behavior came from (innate and selected versus learned) or by what's happening in it now? I think this one breaks something and I want to know what.
  - His test, which I think is just relabeling: move the cricket an inch (disturb what the agent is doing) versus move the point an inch (change what counts as success, see if it notices the old target is dead). He says only the second is real flexibility. I say you can always write the rule if your rule stops working get a new rule, and now the meta-rule is the fixed thing. Does the theory have to say anything about that regress, and is there a level where it stops being a problem?
  - Whether flexibility is a property of the animal or of our description of the animal. He says the wasp isn't rigid, our model of the wasp is coarse. If that move is allowed, does the word do any work at all?
  - Free will: does the theory owe a verdict on whether flexibility is even necessary for responsibility, or is that a separate question? I'd settle for it being able to say what would follow about blame if it turned out we were sphexish in his sense.

  Flag any pair of requirements you think can't be met at once — thats the part I most want, because if two of them fight then our whole argument was rigged from the start. Say which requirements are non-negotiable and which are just something one camp wants. And say which single requirement does the most to kill off candidate theories. Skip the scorecard of named theories, I don't know the literature and I'd just nod along.

  Adequate for what, since you'll ask: I want to be able to watch something — a wasp, my dog, a chatbot, a guy at work who does the same thing every day — and say whether I'm watching the same thing happen again or watching it try something. And I want to know whether his worry is definately a worry.

  Also tell me how confident you actually are in each claim you make, and single out the one you're least sure about. If some of these requirements look like prejudices of how we talk about animals and machines rather than real demands on a theory, say that too.
