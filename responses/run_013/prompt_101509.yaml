answer: |-
  Below is a specification of desiderata for any adequate theory of famine, structured as requirements with motivations, case references, and negotiability flags. The list addresses your core concerns and adds critical elements often overlooked. Tensions between requirements are explicitly flagged, and a verdict on competing theories is provided.

  ---

  ### **Desiderata for a Theory of Famine**
  1. **Requirement: Explain famines with no aggregate food shortage**  
     - *Motivation*: Cases like Bengal 1943 (food availability was near normal, but distribution collapsed) and Ethiopia 1973 (regional scarcity amid national surplus) show scarcity is not necessary.  
     - *Non-negotiable*: Yes. Must refute Malthusian determinism.  

  2. **Requirement: Explain famines with genuine harvest failure**  
     - *Motivation*: Irish Potato Famine (1845–52) involved catastrophic blight; Great Leap Forward (1958–62) combined policy with adverse weather. Theory must integrate environmental triggers.  
     - *Non-negotiable*: Yes. Cannot ignore biophysical reality.  

  3. **Requirement: Explain policy-driven famines**  
     - *Motivation*: Great Leap Forward (collectivization/quotas) and Holodomor (Soviet Ukraine 1932–33) demonstrate states can engineer famine.  
     - *Non-negotiable*: Yes. Must assign agency where due.  

  4. **Requirement: Distinguish triggers from structural causes**  
     - *Motivation*: Irish Famine’s trigger was blight, but causes included colonial land tenure, market reliance on monoculture, and British export policies. Bengal’s trigger was war/disruption, but causes included price speculation and colonial rationing.  
     - *Non-negotiable*: Yes. Separates proximate events from systemic vulnerabilities.  

  5. **Requirement: Address the "democracy/free press" claim critically**  
     - *Motivation*: Sen’s thesis (no famine in democracies) is challenged by Bengal (elected provincial gov’t) and Kerala 1943 (elected gov’t under colonial rule). Theory must test institutional accountability, not just formal democracy.  
     - *Negotiable*: Contextual. Democracy is not binary; must examine power asymmetries and media capture.  

  6. **Requirement: Distinguish direct starvation from epidemic mortality**  
     - *Motivation*: In all major famines (e.g., Bengal: malaria/cholera killed millions), disease from displacement, weakened immunity, and sanitation collapse dominates mortality. Theory must explain this cascade.  
     - *Non-negotiable*: Yes. Avoids conflating hunger with public health failure.  

  7. **Requirement: Explain food export/hoarding during starvation**  
     - *Motivation*: Ireland exported grain; Bengal exported rice to war zones; hoarding by traders/elites amplified Great Leap Forward shortages. Theory must account for entitlement failures and political economy.  
     - *Non-negotiable*: Yes. Reveals distribution as a choice.  

  8. **Requirement: Integrate "entitlements" beyond ownership**  
     - *Motivation*: Sen’s entitlement approach explains Bengal (fishers/farmers lost access despite food availability) but must expand to include social wages, kinship networks, and state welfare.  
     - *Non-negotiable*: Yes. Access > availability.  

  9. **Requirement: Incorporate gender/discrimination dynamics**  
     - *Motivation*: Bengal/Irish famines show women/children died first; marginalized groups (Dalits in India, minorities in GLF) faced disproportionate mortality. Theory must analyze intersecting vulnerabilities.  
     - *Negotiable*: Preference of critical scholarship, but increasingly essential.  

  10. **Requirement: Support culpability verdicts (natural vs. political)**  
      - *Motivation*: Your core demand. Requires theory to identify actors/structures enabling preventable mortality (e.g., British policy in Ireland, Maoist quotas in GLF). Must bridge explanation and ethics.  
      - *Non-negotiable*: Yes (per your emphasis).  

  ---

  ### **Tensions and Trade-offs**  
  - **Causal Explanation vs. Culpability Judgement**:  
    - *Tension*: A purely structural theory (e.g., political economy) may explain causes but struggle to assign blame to specific agents. Conversely, a culpability-focused theory risks oversimplifying complex systems.  
    - *Resolution*: Requires multi-level analysis (individual/institutional/structural).  

  - **Irish vs. Bengal Cases**:  
    - *Tension*: Ireland had massive production collapse + exports (suggesting entitlements); Bengal had minor shortfall + distribution failure (suggesting political economy). A theory favoring one may downplay the other.  
    - *Resolution*: Must treat "aggregate shortage" as a variable, not a defining feature.  

  - **Democracy Claim vs. Historical Cases**:  
    - *Tension*: If democracy prevents famine, Bengal undermines this. If not, the claim’s insight (accountability matters) is lost.  
    - *Resolution*: Replace "democracy" with "responsive institutions + countervailing power."  

  ---

  ### **Which Requirement Rules Out Popular Theories?**  
  - **#10 (Culpability Verdicts)** does the most work:  
    - Rules out **Food-Availability Decline (FAD)**: Ignores agency (e.g., Irish exports were policy choices, not inevitabilities).  
    - Rules out pure **Malthusianism**: Naturalizes famine, absolving policy (e.g., GLF’s quotas were not "natural").  
    - Challenges **Entitlement Approach**: Explains starvation but not why entitlements were violated (e.g., who engineered Bengal’s market failure?).  

  - **Survivor**: **Political-Economy Theory** (famine as policy failure + elite capture) satisfies most requirements:  
    - Explains all three cases (no-shortage, shortage, policy-driven).  
    - Distinguishes triggers from structures (e.g., war in Bengal vs. colonial neglect).  
    - Supports culpability by identifying actors (states, elites).  
    - *Weakness*: Struggles with nuanced democracy claims (#5) without refinement.  

  ---

  ### **Brief Verdict on Contending Theories**  
  | **Theory**          | **Strengths**                          | **Fails Requirements**              |  
  |----------------------|----------------------------------------|-------------------------------------|  
  | **FAD/Malthusian**   | Explains biophysical triggers (#2).    | #1 (no shortage), #3 (policy), #7 (exports), #10 (culpability). |  
  | **Entitlement**      | Explains access failures (#1, #8).     | #10 (culpability gaps), #3 (policy intent), #9 (gender). |  
  | **Political-Economy**| Best on #3, #7, #10; integrates #4, #6.| May oversimplify #5 (democracy); risks structural determinism. |  

  **Optimal Path**: A synthesized theory using entitlements for *mechanisms* and political economy for *causation/culpability*, with historical contingency (e.g., Ireland’s colonialism vs. GLF’s ideology). This satisfies your demand for verdicts while acknowledging complexity.  

  Would you like a case-study application (e.g., "How this framework judges Bengal")?
