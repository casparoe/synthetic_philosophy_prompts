answer: |-
  Here’s a distilled list of desiderata for cultural causation theories in political economy, framed around your explicit concerns and tensions. Non-negotiable requirements are **bolded**; tensions are flagged explicitly.

  ---

  ### **Core Desiderata for Cultural Causation Theories**  
  *(Motivations in italics)*

  1.  **Falsifiability & Non-Tautology**  
      *Requirement:* Must specify *in advance* what outcomes or patterns the theory *cannot* explain, or what evidence would falsify it. Avoids "post-hoc value-matching."  
      *Motivation:* Solves the "explains everything/nothing" problem. *Non-negotiable.*

  2.  **Causal Asymmetry Mechanism**  
      *Requirement:* Must articulate *how* values exert independent causal force distinct from economic/political feedback loops (e.g., via slow-changing foundational beliefs, socialization lags, or sticky cognitive schemas). Cannot default to "mutual constitution" without specifying dominance conditions.  
      *Motivation:* Addresses "direction and feedback." Without this, culture is epiphenomenal. *Non-negotiable.*

  3.  **Aggregation Specification**  
      *Requirement:* Must detail the *mechanism* translating individual values/beliefs → collective outcomes (e.g., institutional selection, coordination equilibria, elite signaling networks). Cannot assume "shared ethos → outcome" without micro-macro links.  
      *Motivation:* Values in minds ≠ societal outcomes. *Non-negotiable.* Often requires institutions as transmission belts.

  4.  **Role Differentiation**  
      *Requirement:* Must distinguish when a value acts as:  
      - **Cause** (initiates new action/path),  
      - **Constraint** (limits options),  
      - **Coordination Device** (solves collective action problems).  
      *Motivation:* Prevents overclaiming (e.g., "constraint" mislabeled as "cause"). *Non-negotiable for precision.*

  5.  **Scope Clarity: Level vs. Timing**  
      *Requirement:* Explicitly state whether the theory explains:  
      - **Level** (why Place A is richer than B),  
      - **Timing** (why A industrialized *before* B),  
      - Or both (requiring stronger evidence).  
      *Motivation:* Theories claiming both must justify why culture trumps geography/institutions. *Crucial for testability.*

  6.  **Differential Prediction/Explanation**  
      *Requirement:* For cases like your "two valleys":  
      - Must *explain* divergence using cultural *variation* (e.g., subtle value differences),  
      - Or cultural *interaction* with other factors (e.g., local institutions amplifying/blocking values),  
      - Or admit scope limits. Cannot ignore counterexamples.  
      *Motivation:* Tests robustness; pure cultural determinism fails here. *Non-negotiable for empirical adequacy.*

  7.  **Causal Autonomy Test**  
      *Requirement:* To show values are **causes not rationalizations**:  
      - Values must (a) *precede* outcomes they cause, (b) operate *independently* of material interests (e.g., via internalized sanctions), and (c) have *identifiable behavioral effects* distinct from interest-maximization.  
      - Social science "cause" ≠ natural science; it requires *interpretive plausibility* + *mechanistic consistency*, not just covariance.  
      *Motivation:* Your core concern. *Non-negotiable.* Natural sciences use invariant laws; social sciences use contingent mechanisms + narrative coherence.

  ---

  ### **Tensions & Non-Negotiables**
  - **Non-Negotiable Desiderata:** **1 (Falsifiability), 2 (Causal Asymmetry), 3 (Aggregation), 7 (Causal Autonomy).**  
    *Rationale:* Without these, the theory is either unfalsifiable, epiphenomenal, logically incoherent, or conflates reason with cause.

  - **Major Tensions:**  
    - **2 (Asymmetry) vs. Reality of Feedback Loops:** Hard to prove culture "leads" absent natural experiments.  
    - **3 (Aggregation) vs. 7 (Autonomy):** If institutions enable aggregation, do *they* cause outcomes, with values as inputs?  
    - **6 (Two Valleys) vs. 5 (Scope):** Timing/divergence explanations often require non-cultural factors (e.g., geography), undermining cultural primacy.  

  - **Falsifiability (#1) is the Strictest Gatekeeper:**  
    It forces theories to define failure conditions (e.g., "If Calvinist valley de-industrializes, theory is falsified"). Most cultural theories avoid this, leaning on "context" or "interactions."  

  - **Materialist Prejudice:** Skepticism of #7 (causal autonomy).  
  - **Weberian Prejudice:** Under-specifies #3 (aggregation) and #2 (asymmetry), risks post-hoc #1.  
  - **Rational-Choice Prejudice:** Rejects #7 (values ≠ interests), demands cultural arguments reduce to incentives.

  ---

  ### **The Two Valleys Test: What's Owed**
  A credible theory **must not be embarrassed** by divergence. It owes either:  
  - A *specific cultural difference* (e.g., variations in lay preaching influencing work ethic internalization),  
  - Or a *mechanism* for how *non-cultural factors* (e.g., land inheritance rules) filtered identical values into different outcomes.  
  If it can only say "culture matters... except when it doesn’t," it fails.

  ---

  ### **The Core Tension in Your List**
  You suspect **causal asymmetry (#2) and aggregation (#3) cannot be jointly satisfied without smuggling in institutions** – which then risks making *institutions* the true cause. This is the central bind: **Can culture be an independent driver if its effects require institutional amplification?** Most theories fall here. The escape hatch is showing institutions themselves are cultural artifacts (e.g., North’s "beliefs → institutions" model), but this pushes the causality problem backward.
