prompt: |-
  I chair the review panel of a small foundation that funds high-risk work in the foundations of computing, and I have to circulate our decision memo before we meet next Thursday. One of the three proposals on the docket comes from a group that wants to build a tabletop device whose ideal mathematical description — a physical system with a continuous, real-valued state, plus a measurement procedure that reads off a real number — they say computes a function that no Turing machine computes; in their telling it would decide, for an arbitrary program, whether that program halts. Their abstract asserts that a successful demonstration would establish that the class of physically computable functions properly exceeds the class of Turing-computable ones, and they present the work as an empirical refutation of the Church–Turing thesis. A second proposal, which we will see next cycle, is in the same family but takes a different route: a machine that completes infinitely many discrete steps in a finite stretch of time, by halving the interval between successive steps. Our funding guidelines require every project to specify a success criterion that a hostile reviewer could check, and the panel must decide whether to fund the first proposal outright, fund it with conditions, or decline — and then whether to adopt a standing test for proposals of this kind, since we are told to expect more of them.

  Please draft that memo. It should say which version of the thesis our decision actually turns on: the reading on which the thesis is a claim about what an ideal agent can do when following a finite, mechanical procedure, in which case no physical gadget could refute it and a working device would at most be grounds for revising our concept of computation; versus the reading on which it is a claim about the limits of any physical process whatsoever, in which case a working device would refute it. State plainly which reading the panel should adopt, why, and what follows for the money. The memo also has to confront the objection that no finite experiment could distinguish a device that genuinely computes an uncomputable function from one that merely has extraordinary precision and is being idealized in the mathematical model — say whether that objection is fatal, and whether some weaker success criterion survives it. And it should cover whether the two routes (the continuous-state device and the infinite-steps-in-finite-time machine) raise the same issue or different ones, since our standing test has to be written to handle both.

  I do not want a memo that simply waves the proposal away; the group's strongest point is that a refusal to fund is itself a substantive empirical bet about the world, and if we are treating the thesis as unrevisable we owe an account of why that is not just dogmatism about a claim we have quietly decided to treat as definitional. So the memo needs a clear recommendation with a time frame, the reasoning behind it, the criterion (if any) under which we could fund work of this kind, and an explicit statement of what evidence would actually change the panel's mind — as well as a fair statement of the case for the group, since two of my panel members are inclined to fund them precisely because they think we are protecting a dogma.
reasoning: |-
  Okay, the user chairs a review panel for a foundation funding high-risk computing foundations projects. They need to draft a decision memo for a controversial proposal claiming to build a physical device that computes uncomputable functions - specifically a halting oracle. There are multiple layers to unpack here.

  First, the core tension revolves around interpreting the Church-Turing thesis. Is it about mathematical computability (ideal agents following algorithms) or physical realizability? The user explicitly wants this philosophical distinction addressed head-on. They're clearly frustrated with dismissive attitudes toward such proposals and want rigorous engagement.

  The proposal's strongest argument is epistemological: refusing to fund constitutes an empirical bet about physics. The user wants this taken seriously while avoiding dogmatism. There are also practical concerns about defining testable success criteria given the "extraordinary precision" objection - how to distinguish true uncomputability from very high precision.

  Interestingly, there's a second related proposal coming next cycle about infinite steps in finite time (supertasks). The memo must address both variants since the foundation needs a standing policy. The user mentions two panelists are sympathetic, so the memo must fairly present the pro-funding case while steering toward consensus.

  Key requirements emerge: 1) Clear thesis interpretation 2) Funding recommendation with timeframe 3) Testable success criterion 4) Evidence that would change minds 5) Distinction between continuous-state and supertask approaches 6) Non-dogmatic framing.

  The physics-based objections are strong but not absolute. Malament-Hogarth spacetimes in general relativity theoretically allow supertask computation, though no known physical process implements this. Continuous-state devices face noise issues that seem insurmountable for infinite precision. Still, outright dismissal seems unwise - better to set an extremely high but theoretically possible bar.

  For the standing test, both approaches share the core challenge of demonstrating physical uncomputability beyond any finite approximation. The key is requiring the proposal to specify how experimental results would distinguish their device from any computable approximation - essentially demanding they solve the epistemological problem upfront.
answer: |-
  **MEMORANDUM**  
  To: Foundation Review Panel  
  From: Chair, Review Panel  
  Date: 20 October 2023  
  Subject: Decision & Policy for Proposal #23-08 ("Continuous-State Halting Oracle")  

  ---

  ### **I. Proposal Summary**  
  Proposal #23-08 seeks funding to build a tabletop device that purportedly computes the halting function (an uncomputable function) via a continuous real-valued state system. The team asserts that a successful demonstration would empirically refute the Church–Turing thesis (CTT) and prove that physically computable functions exceed Turing-computable ones. A related proposal (#24-01, pending next cycle) pursues uncomputability via a machine executing infinitely many discrete steps in finite time ("supertask").  

  ### **II. Core Issue: Interpretation of the Church–Turing Thesis**  
  The panel must adopt one of two interpretations of CTT:  
  1. **Mathematical/Algorithmic Thesis (CTT-M):**  
     *Claims:* CTT defines the limits of *abstract computation* by an ideal agent following a finite, discrete, mechanical procedure.  
     *Implication:* Physical devices cannot "refute" CTT-M; they may only expand our *concept of physical computation*. A working device would challenge definitions, not mathematics.  
  2. **Physical Thesis (CTT-P):**  
     *Claims:* CTT asserts that no physical process can compute beyond Turing machines (TMs).  
     *Implication:* A verified physical device computing an uncomputable function *would refute CTT-P*.  

  **Panel’s Adopted View: CTT-M**  
  - *Why:* CTT originated as a claim about formal systems and effective calculability (Church, Turing, Gödel). It is a mathematical hypothesis about axiomatizable procedures, not a testable physical law.  
  - *Consequence:* Even if Proposal #23-08 succeeded, it would not refute CTT-M; it would demonstrate a *physical process* whose behavior is *described* by an uncomputable function. This distinction is non-trivial: physics may exploit continua or supertasks, but this does not alter the limits of algorithmic computation.  
  - *Funding Implication:* Refusing funding is *not* a "substantive empirical bet" about physics. It is a defense of mathematical consistency. CTT-M is unrevisable by physical experiments, as it concerns abstract computability.  

  ---

  ### **III. Recommendation for Proposal #23-08: Decline Funding**  
  #### **Reasons:**  
  1. **Fatal Epistemological Objection:**  
     - No finite experiment can distinguish a device computing a *genuinely uncomputable function* from one with extraordinary (but finite) precision or a complex computable approximation.  
     - Example: A device outputting "halts"/"does not halt" for *n* programs could be a lookup table. Proving it works for *all* programs requires infinite testing.  

  2. **No Surviving Success Criterion:**  
     - The team’s success criterion ("reads a real number deciding halting") is unverifiable. A hostile reviewer could never confirm it.  
     - *Weaker alternatives fail:*  
       - "Computes halting for 1,000 programs" → Still implementable by a TM.  
       - "Exhibits continuous state evolution" → Does not prove uncomputability.  

  3. **Physical Implausibility:**  
     - Continuous systems face noise, quantum fluctuations, and measurement collapse, preventing access to "infinite precision" states. The proposal lacks a plausible error-correction mechanism.  

  #### **Fair Statement of the Proposers’ Case:**  
  The team correctly notes that *if* CTT-P is valid, it must be empirically falsifiable. Their device represents a serious challenge to *naive physical interpretations* of CTT. If successful, it would revolutionize physics and force a reconceptualization of computation. Two panelists endorse funding precisely because they view CTT-P as a testable claim and warn against dogmatism.  

  ---

  ### **IV. Standing Test for "Uncomputability" Proposals**  
  Proposals claiming physical uncomputability must:  
  1. **Specify a testable success criterion** for which failure is possible and verifiable by a hostile reviewer.  
     - *Example (invalid):* "Computes the halting function."  
     - *Example (valid):* "Outputs a non-TM-computable sequence *S* (certified by proof) and reproduces *S* with 99.999% accuracy under 1,000 randomized trials."  
  2. **Address the epistemological barrier** by:  
     - Proving their device’s mathematical model is intrinsically uncomputable (e.g., solves the halting problem), **and**  
     - Providing a protocol to distinguish its operation from any TM approximation.  
  3. **Explain physical plausibility** (e.g., how the device avoids thermodynamic noise or quantum decoherence).  

  **Applicability to Both Approaches:**  
  - **Continuous-state devices** and **supertasks** face identical verification problems. The standing test applies to both.  
  - *Key difference:* Supertasks (e.g., #24-01) face additional physical objections (infinite energy, relativistic constraints).  

  ---

  ### **V. Conditions for Future Funding**  
  We would fund a proposal of this kind **only if** it:  
  - Matches the standing test above;  
  - Includes a *proof* that its success criterion implies non-TM-computability;  
  - Identifies a *specific, reproducible experiment* whose outcome is inconsistent with any TM-based model.  

  **Evidence That Would Change the Panel’s Mind:**  
  1. A rigorous *physical prototype* that produces outputs violating the *Physical Church–Turing Thesis* (CTT-P) under agreed metrics (e.g., solving a known undecidable problem with verifiable inputs/outputs).  
  2. A peer-reviewed *theoretical model* demonstrating how the device avoids the "infinite precision" objection (e.g., via topological invariance or noise-robust uncomputability).  

  ---

  ### **VI. Decision**  
  - **Proposal #23-08:** Declined.  
  - **Proposal #24-01 (supertask):** Deferred to next cycle; judged against the standing test above.  
  - **Policy:** Adopt the standing test (§IV) for all future "uncomputability" proposals.  

  ---  
  **Approved:** Chair, Review Panel  
  **Next Steps:** Circulate final memo by 23 October; discuss at panel meeting (26 October).
