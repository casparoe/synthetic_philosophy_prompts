prompt: |-
  Right, so I'm meant to be writing on bounded rationality and I've read enough Simon to get the slogans, but before I go any futher I want the spec. What would a theory of decision-making under real cognitive limits have to deliver to count as any good? Give me the full list: the cases it has to get right — someone who stops looking for a flat the moment one clears her bar, someone who never so much as considers the option that would have been best, and the awkward finding that people sometimes do better with less information and cruder rules — the distinctions it can't fudge (describing what we do versus telling us what we ought to do, a limit on computation versus a limit on information, a bound the agent has versus one the theorist imposes), and any results it has to stay consistent with.

  What I'm most interested in is which requirements can't all be met at once. The one that keeps biting me: you're supposed to say where the aspiration level comes from without that turning out to be another optimisation problem in disguise, and at the same time to say whether satisficing is actually rational or merely common. If a pair is genuinely unsatisfiable, tell me which requirement you'd drop. Then briefly, how satisficing proper, the optimise-under-a-computational-budget line, and the heuristics-and-ecological-rationality crowd stack up against the list. No reading list please, I'll find that myself.
reasoning: |-
  Okay, let me start by unpacking what the user is asking. They're working on bounded rationality and want a clear specification for a good theory. They've read Simon but need a structured list of requirements. The key points they mentioned are cases the theory must handle, distinctions it can't blur, and results it must align with. Also, they’re concerned about conflicting requirements, especially around aspiration levels and whether satisficing is rational or just common.

  First, I need to outline the essential cases. The user mentioned three: the flat hunter who stops when a good-enough option is found, the person who overlooks the best option, and the paradox where less information leads to better decisions. Each of these should be addressed by the theory. Then, the distinctions: descriptive vs. normative, computation vs. information limits, and agent vs. theorist constraints. These are crucial to avoid fudging. 

  Next, they want consistency with existing results like Arrow’s Impossibility and Dutch Book arguments. That means the theory mustn’t contradict established economic or decision-theoretic principles. 

  The user’s main struggle is the conflict between explaining aspiration levels without them being optimization problems and clarifying satisficing’s rationality. If these can’t both be satisfied, which should be dropped? I think the normative requirement might be the one to let go because bounded rationality is inherently about descriptive accuracy under constraints. 

  Looking at the different approaches: Simon’s satisficing handles the cases well but struggles with aspiration origins. The optimization under constraints (like Stigler) clarifies computational limits but might sneak optimization back in. Gigerenzer’s ecological rationality explains the information paradox but is descriptive, not normative. 

  The user probably needs a practical framework that acknowledges human limitations without prescribing ideal norms. They might be aiming to apply this in a specific context, like economics or AI, where balancing realism and theory is key. Their unspoken need could be for clarity on which theoretical approach to adopt without getting bogged in unresolved debates. 

  So, structuring the response: list the requirements, highlight the tension between explaining aspirations normatively versus descriptively, suggest dropping strict normativity, and evaluate each approach against the list. Emphasize that satisficing and ecological rationality meet most cases but differ on normativity, which might be acceptable for the user’s purposes.
answer: |-
  Here's the specification for a robust theory of bounded rationality, addressing your core questions about requirements, tensions, and existing approaches:

  **I. The Core Requirements ("The Spec")**

  1.  **Handle Foundational Cases:**
      *   **The Satisficing Stopper:** Explain why/search *stops* upon finding an option meeting an aspiration level (e.g., flat hunter finding a "good enough" place), even if potentially better options exist unseen. *Why is stopping rational/adaptive under limits?*
      *   **The Unconsidered Optimum:** Explain why genuinely superior options are often *never even generated or evaluated* (e.g., never considering the perfect flat across town). *How does the theory account for the severe limitations on option generation and evaluation?*
      *   **The Less-Is-More Effect:** Explain when and why having *less information, fewer options, or simpler rules* leads to *better decisions* than complex, computationally intensive "rational" methods (e.g., fast-and-frugal heuristics outperforming regression models). *How does cognitive architecture interact with environmental structure?*

  2.  **Respect Critical Distinctions:**
      *   **Descriptive vs. Normative:** Clearly differentiate between:
          *   How agents *actually* decide under cognitive limits (descriptive accuracy).
          *   How agents *should* decide given their specific cognitive limits and goals (a *procedurally rational* norm). Avoid collapsing "is" into "ought" or vice-versa without explicit justification.
      *   **Limits on Computation vs. Limits on Information:** Specify whether the core constraint is processing power/algorithmic complexity, availability/accessibility/cost of information, or both. The theory must clarify the *nature* of the bound.
      *   **Agent's Bound vs. Theorist's Bound:** Distinguish between:
          *   A constraint inherent to the *agent's own cognitive machinery* (e.g., working memory capacity).
          *   A constraint *imposed by the theorist/modeler* for tractability or abstraction (e.g., assuming agents only consider 3 options). The theory's core must address the former.

  3.  **Maintain Consistency with Key Results:**
      *   **Computational Complexity:** Cannot imply tractable solutions to known NP-hard problems without specifying the simplifying assumptions/approximations used.
      *   **Fundamental Impossibilities (e.g., Arrow):** Cannot claim to "solve" fundamental aggregation paradoxes under perfect information unless specifically showing how boundedness circumvents them.
      *   **Dutch Book Arguments:** Must either show how boundedly rational agents avoid sure losses *in practice* given their constraints and environment, or accept that procedural rationality might sometimes tolerate Dutch-book vulnerability if avoiding it is computationally prohibitive.
      *   **Evolutionary/Adaptive Logic:** Should be consistent with the idea that cognitive mechanisms are shaped (though not perfectly optimized) by evolutionary pressures and learning within environments.

  **II. The Key Tension & The Unsatisfiable Pair**

  *   **The Tension:** Explaining the *origin* and *rationality* of the **aspiration level**.
      *   Requirement 1a demands explaining where the satisficing bar comes from and why stopping there is sensible.
      *   Requirement 2a demands a clear normative/descriptive split regarding satisficing.
  *   **The Unsatisfiable Pair:** It's exceptionally difficult to simultaneously:
      1.  **Provide a fully general, non-circular, *normative* justification for the *specific* aspiration level** used in satisficing *without* ultimately relying on some form of (often hidden) optimization over costs/benefits/expectations *at a meta-level* (e.g., "Set aspiration where expected marginal cost of search equals expected marginal benefit").
      2.  **Maintain satisficing as a truly *distinct* alternative to optimization** that doesn't collapse into being merely a step *within* a larger optimization process (optimizing when to stop optimizing).
  *   **Which Requirement to Drop?** Drop the requirement for a **universal, purely non-optimizing *normative* foundation for the aspiration level**. Instead:
      *   **Focus Descriptively:** Aspiration levels arise adaptively from experience (learning, social comparison, inherited biases), physiological states, and environmental cues. They are often "good enough" starting points shaped by evolution/learning, not calculated.
      *   **Reframe Normatively:** The norm is *procedural*: given *severe* constraints on computation and information, and the adaptive origins of heuristics like satisficing, using a "reasonable" aspiration level (based on experience or simple rules) is the rational *procedure*, even if the specific level isn't derived from a meta-optimization. The norm applies to the *type* of process, not the derivation of every parameter.

  **III. How Existing Approaches Stack Up Against the Spec**

  | Approach               | Satisficing Stopper (1a) | Unconsidered Optimum (1b) | Less-Is-More (1c) | Desc/Norm Distinction (2a) | Comp/Info Limits (2b) | Agent/Theorist Bound (2c) | Key Results (3)         | Aspiration Level Tension |
  | :-------------------- | :----------------------- | :------------------------ | :---------------- | :------------------------- | :-------------------- | :------------------------ | :---------------------- | :----------------------- |
  | **Simon's Satisficing** | **Strong:** Core mechanism.        | **Moderate:** Implicit (limited search), not deeply mechanistic. | **Weak:** Not a primary focus. | **Moderate:** Ambiguous; often blends "is" with "ought" under limits. | **Focuses on both:** Info search costs & computation. | **Agent:** Focus on real cognitive limits. | **Moderate:** Compatible, not deeply engaged. | **Struggles:** Aspiration origin vague; normative status ambiguous. |
  | **Optimize w/ Constraints (Stigler, Rational Inattention)** | **Moderate:** Can model stopping as optimal given search cost. | **Weak:** Often assumes fixed option set; less focus on generation. | **Weak:** Not a focus; usually more info/comp helps. | **Strong:** Explicitly normative given constraints. | **Strong:** Explicit modeling of info/computation costs. | **Mixed:** Often theorist-imposed constraints approximating agent bounds. | **Strong:** Explicitly built on optimizing foundations. | **Resolves (but...):** Aspiration level *derived* from optimization. **Problem:** Collapses satisficing into optimization. |
  | **Ecological Rationality (Gigerenzer)** | **Strong:** Satisficing is a key heuristic. | **Strong:** Heuristics inherently ignore information/options. | **Strong:** Core finding explained by heuristic-environment fit. | **Strong:** Clear descriptive focus; "ought" is ecological fit. | **Focuses on both:** Heuristics reduce need for both. | **Agent:** Heuristics as cognitive adaptations. | **Strong:** Embraces compatibility with evolution/adaptation. | **Addresses:** Aspiration as ecological heuristic (e.g., Take The Best's cue order). **Normative:** Ecological fit, not logic/optimization. |

  **Summary Evaluation Against Spec:**

  1.  **Satisficing (Simon):** Excels at 1a (the core case), handles 1b implicitly, respects 2b & 2c. Weak on 1c, struggles with 2a clarity and the aspiration tension. Best for *describing* stopping rules under search costs.
  2.  **Optimize under Constraints:** Excels at 2a (clear norm), 2b (explicit costs), 3 (consistent with core theory). Weak on 1b (option generation) and 1c (less-is-more). Fundamentally *fails* to treat satisficing as truly distinct (collapses it). Best for *prescribing* resource allocation in decision-making.
  3.  **Ecological Rationality:** Excels at 1a, 1b, 1c (its hallmark), 2a (clear descriptive focus, ecological norm), 2c. Strong on 3 via adaptation. Treats 2b through the lens of heuristic design. Best for *explaining* adaptive performance and the less-is-more effect using simple rules. Its "norm" (ecological fit) differs fundamentally from logic/optimization norms.

  **Conclusion:** No single approach perfectly satisfies the entire spec, reflecting the inherent tensions (especially around aspiration levels and normativity). **Ecological Rationality** comes closest to handling the core descriptive cases (1a,1b,1c) and respecting the agent-bound distinction (2c), offering the most compelling account of "less-is-more" without collapsing into hidden optimization. If a purely *normative* theory given constraints is paramount, **Optimize under Constraints** is necessary but abandons satisficing as a distinct concept. **Simon's Satisficing** remains foundational for the stopping rule but needs augmentation (e.g., from ecological rationality) to fully meet the spec, particularly regarding aspiration origins and less-is-more. Choose based on whether your primary goal is description of heuristics (Ecological), normative prescription under costs (Optimize under Constraints), or understanding search termination (Classic Satisficing).
