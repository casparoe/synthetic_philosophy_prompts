prompt: |-
  I run the analytics shop for a mid-size hospital network, and our quality committee keeps having the same fight: someone shows the board that Hospital A has a lower mortality rate than Hospital B overall, someone else points out that inside every single severity band B is actually better than A, and then everyone shrugs and we publish whichever version the CEO likes. That's not a method. I need an actual procedure my analysts can run before we publish any two-group comparison like this — the questions to ask in order, what counts as an answer to each, when to report the pooled number, when to report the stratified breakdown, and when to say the comparison shouldn't be published at all. My analysts are solid on regression and p-values but basically innocent about causal inference, so it has to survive that. Run it on three cases: (1) the two hospitals above, where severity is plausibly the thing driving the reversal; (2) two surgical teams where the reversal only appears once you stratify by whether the patient was transferred in from another facility, which I have a bad feeling is not a real confounder; and (3) a comparison where the strata disagree but I think the pooled number is the honest one — say, where the thing we'd be splitting on is something the treatment itself causes. And tell me straight where the procedure can't save us and a human just has to make a judgment call, because I'd rather know that up front than have the flowchart pretend to settle it.
reasoning: |-
  We are facing Simpson's paradox: a reversal in the direction of an association when data from several groups are combined compared to the associations within the groups.

  The key is to determine whether the pooled (overall) comparison or the stratified comparison is more appropriate. This requires understanding the causal structure and the role of the stratification variable.

  We'll design a procedure with the following steps:

  1. **Define the comparison and the outcome**: Clearly state what we are comparing (e.g., two hospitals, two surgical teams) and the outcome (e.g., mortality rate).

  2. **Identify potential confounding variables**: These are variables that affect both the group assignment and the outcome. In our cases:
     - Case 1: Severity of illness (plausible confounder) - sicker patients are more likely to die and might be directed to Hospital B (if it's a tertiary center).
     - Case 2: Transfer status (we suspect it might not be a real confounder) - we must check if it is a confounder or a mediator/collider.
     - Case 3: A variable that is affected by the treatment (a mediator) - stratifying by it would be inappropriate for the total effect.

  3. **Causal Diagram (DAG) considerations**:
     - If the stratification variable is a confounder (common cause of group and outcome), then the stratified analysis (or adjusted estimate) is appropriate and the pooled estimate is biased. We should report the adjusted estimate.
     - If the stratification variable is a mediator (on the causal pathway from group to outcome) or a collider (common effect of group and outcome, or group and other variables), then stratifying by it would bias the estimate of the total effect. We should report the pooled estimate or adjust only for confounders (but not the mediator).
     - If the stratification variable is a collider, conditioning on it induces a spurious association. We should not condition on it.

  4. **Check for Simpson's paradox**: 
     - Compute both the pooled and the stratified estimates.
     - If they agree (in direction and approximate magnitude), then report either (but note the consistency).
     - If they disagree (paradox present), then we must decide which one to report based on the causal structure.

  5. **Procedure**:

     Step 1: **Is the stratification variable a confounder?**
        - Ask: Is this variable a cause of the outcome? And does it also cause (or is it associated with) the group assignment?
        - If yes, then we need to adjust for it. Report the stratified (or adjusted) estimate and note the paradox.

     Step 2: **Is the stratification variable a mediator?**
        - Ask: Is this variable on the causal pathway from the group assignment to the outcome? (i.e., the group might affect this variable, which in turn affects the outcome)
        - If yes, then we should not adjust for it when we want the total effect of the group on the outcome. Report the pooled estimate and explain that the mediator adjustment would block part of the effect.

     Step 3: **Is the stratification variable a collider?**
        - Ask: Is this variable caused by both the group assignment and the outcome (or by the group and another cause of the outcome)? Conditioning on a collider can induce bias.
        - If yes, then we should not condition on it. The pooled estimate is the one to report (unless we can adjust for the common causes that created the collider without introducing other biases).

     Step 4: **If none of the above, or if unsure?**
        - Then we must rely on subject matter knowledge. Sometimes it's not clear. We might report both and explain the uncertainty.

     Step 5: **When to publish?**
        - If the causal structure clearly points to one estimate, report that one and explain.
        - If the causal structure is ambiguous, report both and explain the ambiguity.
        - If we cannot determine the causal structure and the two estimates tell opposite stories, we might need to say the comparison is not interpretable without further investigation.

  6. **Special note on Case 2 (transfer status)**:
     - If transfer status is a confounder (e.g., if the group assignment affects transfer status and transfer status affects outcome, and also if there are common causes of transfer status and outcome that are not the group), then we adjust. 
     - However, if transfer status is a consequence of the group (e.g., one team is more likely to accept transfers) and also a cause of the outcome, then it is a mediator. Alternatively, if transfer status is a collider (e.g., both the group and the outcome cause transfer status? That might be less common). We must think carefully.

     In Case 2, we might suspect that transfer status is not a confounder because the group (surgical team) might cause transfer status (one team might be known for accepting transfers) and transfer status might cause a worse outcome (because transferred patients are sicker). Then transfer status is a mediator. Adjusting for it would block the path: group -> transfer status -> outcome, and we would only capture the direct effect (not the total effect). Therefore, the pooled estimate might be more appropriate for the total effect.

  7. **Case 3**: The stratification variable is something the treatment itself causes (a mediator). Therefore, we want the total effect of the treatment (group) on the outcome, so we should not adjust for the mediator. We report the pooled estimate.

  8. **When the procedure can't save us**:
     - When the causal structure is unknown and cannot be determined from the data (e.g., we don't know the direction of arrows in the DAG).
     - When we have unmeasured confounders that we cannot adjust for.
     - When the data are insufficient to estimate the stratified effects (e.g., sparse strata).

     In these cases, we must make a judgment call. We might decide to collect more data, or we might use sensitivity analyses to see how strong an unmeasured confounder would have to be to explain away the effect.

  Now, let's run through the three cases:

  **Case 1: Two hospitals, severity bands**

  - Severity is a confounder: sicker patients are more likely to go to Hospital B (which might be a referral center) and also more likely to die. Therefore, the overall mortality rate at Hospital B is higher because they see sicker patients. Within each severity band, Hospital B does better. 
    - **Conclusion**: Report the stratified (severity-adjusted) mortality rate. The pooled estimate is biased by the confounding.

  **Case 2: Two surgical teams, stratified by transfer status**

  - We suspect transfer status is not a confounder. Let's think:
    - Transfer status might be a mediator: the surgical team assignment (group) might affect whether the patient is transferred (e.g., Team A might be more likely to accept transfers) and transfer status affects outcome (transferred patients are more complex and have worse outcomes). Then, adjusting for transfer status would remove the indirect effect of the team via transfer and leave only the direct effect. But we want the total effect of the team on outcome (which includes the effect via transfer). 
    - Alternatively, transfer status might be a confounder if the transfer decision was made before the team assignment and affects both the assignment and the outcome. But in a hospital setting, the team assignment is usually made after the transfer? Actually, the transfer might be to a specific team. So it's more likely that the team assignment is determined after transfer? Or the transfer is to the hospital and then the team is assigned? This requires domain knowledge.

    However, note: if the transfer status is determined by the team (for example, if one team is the transfer team), then transfer status is a mediator. Also, if the transfer status is a result of the team's reputation (so the team causes the transfer status) then it is a mediator.

    But if the transfer status is due to patient factors that are not caused by the team, and if these factors also affect the outcome, then it might be a confounder. However, note that the transfer status itself is not a pre-existing patient characteristic but an event. The underlying patient severity (which caused the transfer) is the confounder. So if we have severity, we should adjust for severity, not transfer. Transfer is a consequence of severity and maybe the hospital's policy.

    In this case, without having data on severity, transfer status might be a proxy for severity. But if we adjust for transfer without having severity, we might not be fully adjusting for the confounder (severity) and also we are adjusting for a mediator (if the team assignment affects transfer). This is messy.

    Given the complexity and our bad feeling, we might decide that transfer status is a mediator (or a collider) and not a confounder. Therefore, we should not condition on it. We should report the pooled estimate. But note: if we don't have the true confounder (severity) then the pooled estimate is still confounded by severity. So we might need to collect more data on severity.

    **Conclusion for Case 2**: Without a clear confounder adjustment, we might be in trouble. We should try to adjust for patient severity (if available) and then the transfer status becomes irrelevant. But if we don't have severity, then we cannot adjust. We might have to report the pooled estimate with a warning about potential confounding by severity. Alternatively, we might not publish the comparison until we have severity data.

    However, the question states that we are stratifying by transfer status. Since we suspect transfer status is not a confounder, we should not condition on it. Therefore, we report the pooled estimate and note that we are unable to adjust for severity. This is a judgment call: we know the pooled estimate is confounded by severity, but we don't have the data. We might have to say the comparison is not publishable without severity adjustment.

  **Case 3: Stratification variable is caused by the treatment (a mediator)**

  - Example: We are comparing two treatments for a disease, and we want to stratify by a biomarker that is affected by the treatment. The biomarker is a mediator. We are interested in the total effect of the treatment on the outcome, not the direct effect. Therefore, we should not condition on the biomarker. We report the pooled estimate.

  **Summary of the procedure**:

  1. **Define the comparison and outcome**.
  2. **Identify the stratification variable(s)** that cause the reversal (Simpson's paradox).
  3. **Determine the causal role of the stratification variable**:
     a. **Confounder**: Adjust (stratify) and report the adjusted estimate.
     b. **Mediator**: Do not adjust; report the pooled estimate (for total effect).
     c. **Collider**: Do not adjust; report the pooled estimate (and avoid conditioning on the collider).
     d. **Unknown**: Proceed with caution; consider both and explain the ambiguity. May need to collect more data or do sensitivity analysis.
  4. **Check the data**:
     - If the stratified analysis has sparse data (small counts in strata), the adjusted estimate might be unreliable. Then we might need to use regression with regularization, or report the pooled estimate with a warning.
  5. **When not to publish**:
     - If the causal structure is unknown and the two estimates (pooled and adjusted) tell opposite stories, and we cannot resolve it with domain knowledge, then we should not publish without further investigation.

  **Flowchart for analysts**:

  1. Compute both pooled and stratified (by the variable causing reversal) estimates.
  2. Do they agree? If yes, report either (preferably the one that is more precise, or the adjusted if there's known confounding). If no, proceed.
  3. For the stratification variable, ask:
     - Is it a confounder? (Does it cause both group assignment and outcome, and is it not caused by the group or outcome?) 
       - If yes, then report the stratified estimate.
     - Is it a mediator? (Is it on the causal path from group to outcome?)
       - If yes, then report the pooled estimate (for total effect).
     - Is it a collider? (Is it caused by both group and outcome, or by group and another cause of outcome?)
       - If yes, then report the pooled estimate and do not condition.
  4. If we cannot determine the role of the variable, then:
     - Report both estimates and explain the discrepancy (Simpson's paradox) and the uncertainty about the causal role.
     - Consider whether the variable might be a proxy for a confounder (then we might want to adjust) or a mediator (then we might not). Use domain knowledge.
     - If domain knowledge is insufficient, then the comparison might not be publishable without further study.

  **Human judgment calls**:
  - Determining the causal role of a variable (confounder, mediator, collider) requires domain knowledge and assumptions that cannot be tested from the data alone.
  - When there are unmeasured confounders, we cannot adjust. We might have to rely on sensitivity analysis (how strong would the unmeasured confounder have to be to explain away the effect?) but that is advanced and may not be in the analysts' toolkit.
  - When the data are sparse, we might need to use advanced methods (like Bayesian hierarchical models) to get stable adjusted estimates.

  This procedure will help in many cases, but it is not foolproof. The key is to think causally and to be transparent about the assumptions.
answer: |-
  Below is a structured procedure for handling two-group comparisons (e.g., Hospital A vs. B) when Simpson's Paradox (reversal of associations after stratification) arises. The procedure prioritizes **causal transparency** over statistical mechanics and includes explicit guardrails for judgment calls. It assumes your analysts can calculate stratified/pooled rates and run basic regressions.

  ---

  ### **Step-by-Step Procedure for Two-Group Comparisons**
  **When to use**: Any time a stratified analysis (e.g., by severity, transfer status) reverses the direction of a pooled comparison.

  #### **1. Preliminary Checks**  
     - **Question**: Is the stratification variable plausibly a **confounder** (affects both group assignment *and* outcome)?  
       - **Answer**: Use domain knowledge (e.g., severity affects both hospital choice and mortality).  
       - **Threshold**: If "no," skip to Step 3. If "unsure," proceed to Step 2.  
     - **Analyst Action**:  
       - Calculate both pooled and stratified metrics.  
       - Flag if stratified results reverse the pooled result.  

  #### **2. Confounder Validation Test**  
     - **Question**: Is the stratification variable **empirically associated** with both group assignment and outcome?  
       - **Answer**: Run two regressions:  
         - (A) Stratification variable ~ Group (e.g., severity ~ hospital)  
         - (B) Outcome ~ Stratification variable (e.g., mortality ~ severity)  
       - **Threshold**: Significant association (p < 0.05) in **both** (A) and (B)? If yes, treat as confounder. If no, proceed to Step 3.  

  #### **3. Mediator/Collider Check**  
     - **Question**: Could the stratification variable be a **mediator** (effect of treatment) or **collider** (affected by both group and outcome)?  
       - **Answer**: Use causal criteria:  
         - **Mediator**: "Does the group assignment *cause* changes in this variable?" (e.g., treatment causes lab values).  
         - **Collider**: "Is this variable affected by *both* group and outcome?" (e.g., transfer status may be a collider if sicker patients are transferred *and* more likely to die).  
       - **Threshold**: If "yes" to mediator/collider, **do not stratify**. If "no," proceed to Step 4.  

  #### **4. Decision Rule**  
     | Scenario                          | Action                                                                 | Report              |  
     |-----------------------------------|------------------------------------------------------------------------|---------------------|  
     | **Confounder validated** (Step 2) | Stratified analysis is more reliable.                                  | **Stratified rates** + explanation |  
     | **Mediator/collider** (Step 3)    | Pooled analysis is more honest (stratification introduces bias).       | **Pooled rate** + caveat |  
     | **Unresolved reversal**           | Comparison is uninterpretable. Do not publish without refinement.      | **Withhold**        |  

  #### **When to Withhold Results**  
     - Stratified/pooled disagree, and:  
       - The variable fails confounder checks (Step 2) **and** is not a mediator/collider (ambiguous causal role).  
       - Sparse strata (sample size < 10 per stratum).  
       - Domain experts disagree on causal structure (Step 1/3).  

  ---

  ### **Case Applications**
  #### **Case 1: Hospitals A vs. B (Stratified by Severity)**  
     - **Step 1**: Severity is a confounder (sicker patients choose B and die more). ✅  
     - **Step 2**: Severity strongly predicts both hospital choice and mortality (p < 0.001). ✅  
     - **Decision**: Report **stratified results**. Pooled is biased by confounding.  

  #### **Case 2: Surgical Teams (Stratified by Transfer Status)**  
     - **Step 1**: Transfer status is *not* a clear confounder (teams don’t cause transfers; transfers reflect external factors). ⚠️ Unsure → Proceed.  
     - **Step 2**:  
       - (A) Team ~ Transfer: Association likely exists (Team B gets more transfers).  
       - (B) Mortality ~ Transfer: Association exists (transfers have higher mortality).  
       - **But**: Transfer may be a **collider** (sicker patients are transferred *and* choose Team B).  
     - **Step 3**: If transfers are triaged based on severity (unmeasured), conditioning on transfer *creates* bias by blocking a causal path. ❌  
     - **Decision**: Report **pooled results**. Stratification misleads by amplifying selection bias.  

  #### **Case 3: Treatment Comparison (Stratified by a Mediator)**  
     - *Example: Drug A vs. B, stratified by "blood marker X" (which the drug alters).*  
     - **Step 1**: Blood marker X is *not* a confounder (drug affects the marker). ❌ → Skip to Step 3.  
     - **Step 3**: Marker X is a **mediator** (on causal path from drug to outcome). ✅  
     - **Decision**: Report **pooled results**. Stratification hides the drug’s total effect.  

  ---

  ### **Where Judgment is Required (No Statistical Fix)**  
  1. **Confounder vs. Mediator/Collider**: Steps 1 and 3 rely on subject-matter expertise (e.g., "Does severity cause hospital choice, or vice versa?"). Analysts *cannot* resolve this from data alone.  
  2. **Unmeasured Confounding**: If severity is unmeasured (e.g., only claims data), even stratified results may be biased. Sensitivity analyses (e.g., E-values) can quantify robustness.  
  3. **Ambiguous Variables**: E.g., "transfer status" could be a confounder (if driven by pre-existing severity) or collider (if driven by hospital logistics). **Solution**: Bring clinical leads into the discussion.  

  ---

  ### **Implementation Kit for Analysts**  
  - **Pre-Publish Checklist**:  
    ```  
    1. Calculate pooled and stratified rates.  
    2. If reversal (Simpson’s Paradox):  
       a. Step 1: Is strat. variable a confounder? (Ask MD)  
       b. Step 2: Run regressions (strat ~ group; outcome ~ strat).  
       c. Step 3: Is strat. variable a mediator/collider? (Ask MD)  
       d. Apply Decision Rule (Step 4).  
    3. If withhold: Flag for committee review.  
    ```  
  - **Tools Needed**:  
    - Logistic regression for Step 2.  
    - Causal DAG whiteboard (for Step 3 discussions with clinicians).  

  This procedure forces explicit causal reasoning, minimizes "forking paths" in analysis, and defines exit ramps for unwinnable scenarios. 80% of cases will resolve at Steps 1-3; the rest require committee input.
