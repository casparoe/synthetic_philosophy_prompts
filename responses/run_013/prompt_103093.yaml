  ok so im in this little philosophy club at my school and last week someone brought up "the wrong kind of reasons problem" and i nodded along but honestly im lost. heres what i think it is: there are reasons to have an attitude (believe something, admire someone, fear something) and some of them have nothing to do with whether the attitude is actually correct. like if someone offers me a million dollars to believe the moon is made of cheese, thats a reason to believe it, but it doesnt make the belief true or justified. fine, i get that. but then people say this is a big problem for theories that define value as "being the fitting object of an attitude" (fitting attitude theory?) — because if ANY reason to value something counts, then the million dollars could make something good, which is absurd, so the theory has to say only the RIGHT kind of reasons count. and the problem is you cant say which reasons are the right kind without already knowing what makes something valuable, so it goes in a circle. i think i follow that part.

  what i dont get is: is the real problem about the reasons, or about the attitudes themselves? and why do people call the two kinds "object-given" vs "state-given" reasons — whats the actual difference, and does that distinction really solve anything or does it just rename the problem? someone in the club also said the same shape shows up for belief (like pascal's wager type stuff, pragmatic reasons to believe) and for emotions too — so is this one single problem or a whole family of them that just look similar? please just explain the concept to me properly, like walk me through why the distinction matters and where it breaks down. no need to cite anything, i cant look stuff up anyway.
