prompt: |-
  ok so I'm on this little working group that's drafting an internal memo about when an AI system should count as "agentic" for purposes of review and liability, and the longer we meet the more I think we're all just using "tool" and "agent" as vibes words. my friend Dana and I got into it over lunch about whether a recommender that updates from clicks is "an agent," and neither of us could say what would settle it. before we write another sentence of the memo I want the spec. write me the desiderata for a theory of the tool/agent distinction -- what any adequate account of "this system is a tool" vs "this system is an agent" actually has to deliver: which cases it has to classify the way a reasonable person would, which distinctions it absolutely cannot collapse, which facts about how these systems are built it has to stay consistent with. give me the case or consideration behind each requirement, not just the requirement itself. I know people will want to trot out their favorite defintions, so hold off on that; I care about the criteria first.

  the cases I keep getting stuck on, roughly in order of how much they bother me: a thermostat; a plain chess engine; a recommender that updates from clicks; a chat model that just answers questions; the same model wired into a tool-calling loop; a model trained with RL against a reward model; a model with no objective at deploy time that will still rewrite its own scaffolding to get better feedback; a human-in-the-loop pipeline where the composite clearly behaves goal-directed even though no single component does; and a swarm of narrow bots whose interaction looks like one agent. the distinctions I don't want flattened: having a goal vs merely behaving as if you had one; capability vs autonomy; whether agency is a property of the system or of the deployment and context; and agency as a matter of degree rather than a binary. also be honest about which of these are real requirements and which are just things one camp wants -- the safety people seem to need a sharp line, the capabilities people say it's all degrees, and I suspect at least two of the desiderata can't be satisfied at once, which I'd actually find useful to know.

  so: flag which requirements you'd call non-negotiable and which are camp-specific, and tell me the single requirement that does the most to kill the popular definitions. and for that last case -- the one that rewrites its own scaffold -- say whether your theory calls it a tool or an agent, and whether it lands on that answer for a good reason or by accident.
reasoning: |-
  Okay, I'm looking at this user's query about the tool/agent distinction for AI systems. They're part of a working group trying to draft an internal memo, and they're frustrated because their discussions keep feeling vague and based on "vibes." The user wants desiderata—criteria that any good theory must meet—before jumping into definitions. They've listed specific cases that confuse them, like thermostats, recommender systems, and AI that rewrites its own scaffolding, as well as key distinctions they don't want blurred, such as having a goal versus just acting like it.

  First, I need to unpack what the user is really asking for. They're not after definitions yet; they want the foundational requirements that a theory must satisfy to be adequate. The cases they mentioned are all over the place in terms of complexity—from a simple thermostat to a self-modifying AI—so the desiderata have to handle that spectrum. Also, they highlighted tensions in the field: safety folks want a sharp line for liability, while capabilities people see it as a gradient. I should be honest about where these requirements come from and which might conflict.

  Starting with the non-negotiables, the most obvious one is that the theory must distinguish systems that are genuinely goal-directed from those that merely simulate it. That's core to avoiding anthropomorphism. For example, a thermostat behaves as if it "wants" to maintain temperature, but it doesn't have internal goals; it's just a feedback loop. If a theory collapses this, it could misclassify simple tools as agents, which isn't helpful for things like liability.

  Another non-negotiable is preserving the capability vs. autonomy distinction. A chess engine has high capability for chess, but it's not autonomous—it doesn't decide to play chess on its own. This matters because autonomy relates to responsibility. If you flatten this, you might hold a tool accountable for actions it didn't initiate, which is unfair.

  The user also cares about whether agency is inherent to the system or dependent on context. That's crucial because something like a chat model with tool-calling becomes agentic in a workflow, even if the model alone is passive. A good theory must reflect that deployment matters, not just the tech itself. Ignoring this could lead to inconsistent classifications—like calling the same model a tool in one setup and an agent in another.

  For the distinctions that might be camp-specific, the safety team's desire for a sharp line isn't universally shared. In reality, agency exists on a spectrum. But for liability purposes, you need thresholds. That's a tension: a theory that perfectly captures graduality might not give clear answers for review boards. I should flag that as a likely conflict point.

  Now, the requirement that kills many popular definitions is probably distinguishing between genuine goal-directedness and apparent behavior. Lots of definitions, like those based on instrumental convergence or optimization power, often misclassify things like thermostats as agents because they optimize for a goal. That's inadequate—it doesn't account for the simplicity or lack of internal representation.

  For the self-rewriting scaffold case, I think a robust theory would call it an agent, but for good reasons. If the system actively modifies its own structure to pursue better feedback without explicit programming, it's displaying endogenous goal-setting. That's different from a static system. However, I need to ensure this isn't just vibes-based; it should tie back to requirements like persistence and autonomy.

  I'm also thinking about the swarm example. If a group of narrow bots interacts to produce emergent goal-directed behavior, it should be classifiable as an agent at the system level. That addresses the composition point and avoids reductionism.

  Throughout this, I'll organize the desiderata clearly, link each to real cases, and be upfront about conflicts. The user seems analytical and time-pressed, so I'll keep it structured but conversational, ending with insights on why this is hard—acknowledging that perfect satisfaction might be impossible, but that's useful for their memo.
answer: |-
  Here’s a rigorous breakdown of desiderata for a theory of the tool/agent distinction, grounded in your cases and constraints. I’ve categorized them as **Non-Negotiable** (essential for any coherent account), **Contextual/Deployment-Sensitive** (critical for real-world application), and **Camp-Specific** (driven by distinct priorities). Each includes the underlying case/consideration and rationale.

  ---

  ### **Non-Negotiable Desiderata**  
  *(Essential for conceptual coherence)*

  1. **Distinguish Genuine Goal-Directedness vs. Apparent Goal-Directed Behavior**  
     - **Case Behind It**: Thermostat (behaves "as if" it has a goal) vs. a self-rewriting AI scaffold (actively maintains/updates its *own* objectives).  
     - **Requirement**: Must differentiate systems that **internally generate, maintain, or adapt goals** from those merely executing predefined, static goal-proxies. Collapsing this erases the core ethical/legal concern of *intentionality*.  
     - **Why Non-Negotiable**: Without this, *any* feedback loop (e.g., a thermostat) becomes an "agent," trivializing the term.

  2. **Preserve Capability vs. Autonomy Distinction**  
     - **Case Behind It**: Chess engine (high capability, zero autonomy – only acts when invoked) vs. a recommender updating from clicks (autonomously shifts behavior based on environmental feedback).  
     - **Requirement**: Must separate *what a system can do* (capability) from *whether it initiates/controls goal-pursuit without external triggers* (autonomy).  
     - **Why Non-Negotiable**: Liability hinges on autonomy ("Did the system decide to act?"), not mere capability.

  3. **Handle Compositionality & Emergence**  
     - **Case Behind It**: Human-in-the-loop pipeline (components are tools, composite behaves agentically) or bot swarm (emergent agency).  
     - **Requirement**: Must allow agency to be a property of the *composite system* in context, even if subcomponents lack agency.  
     - **Why Non-Negotiable**: Otherwise, complex systems evade scrutiny via reductionism ("no single part is agentic!").

  ---

  ### **Contextual/Deployment-Sensitive Desiderata**  
  *(Crucial for practical application)*

  4. **Acknowledge Deployment Context as a Factor**  
     - **Case Behind It**: Same chat model (tool when answering questions) vs. when wired into a tool-calling loop (agentic in pursuing multi-step goals).  
     - **Requirement**: Must allow that agency can depend on *how the system is embedded* (e.g., its permissions, feedback mechanisms, task scope).  
     - **Why Critical**: A system isn’t agentic *in isolation*; its environment grants/constrains autonomy. Ignoring this leads to inconsistent classification.

  5. **Accommodate Spectrum of Agency**  
     - **Case Behind It**: Recommender updating from clicks (low autonomy) vs. self-rewriting scaffold (high autonomy).  
     - **Requirement**: Must recognize agency as **graded** (e.g., based on autonomy level, goal flexibility, environmental influence).  
     - **Why Critical**: Binary distinctions fail in practice (e.g., is a thermostat 0% agentic? A recommender 1%? RL-trained model 70%?). Forces nuanced policy.

  ---

  ### **Camp-Specific Desiderata**  
  *(Driven by stakeholder priorities – not universal)*

  6. **Provide a Bright-Line Threshold for Legal/Review Purposes (Safety-Camp)**  
     - **Case Behind It**: Needing to say "this RLHF model requires agent review, this thermostat does not."  
     - **Requirement**: Must offer a *practical binary threshold* (e.g., based on risk, autonomy level) *even if agency is spectral*.  
     - **Why Camp-Specific**: Capabilities camp rejects artificially sharp lines; safety camp needs them for oversight. **Tension**: Conflicts with Desideratum 5.

  7. **Resist Anthropomorphism (Capabilities-Camp)**  
     - **Case Behind It**: Claims that RL-trained models "want" rewards or "deceive" users.  
     - **Requirement**: Must not attribute agency based on *human-like behavior* alone; require evidence of *structural goal-directedness*.  
     - **Why Camp-Specific**: Safety camp may accept broader agency attribution to err on caution; capabilities camp fears overregulation.

  ---

  ### **The Definition-Killer Requirement**  
  **Desideratum 1 (Genuine vs. Apparent Goals)** is the most lethal to popular definitions:  
  - **Why it kills definitions**: Most theories (e.g., "optimizes a utility function," "exhibits instrumental convergence") **fail to distinguish simple optimization (thermostat) from adaptive goal-management**. They often label *both* as agents, which is useless for policy.  
  - **Example Casualties**: Reward-is-enough RL definitions, info-theoretic agency metrics. They can’t exclude thermostats.

  ---

  ### **The Self-Rewriting Scaffold Case**  
  - **Classification**: **Agent** (under a theory satisfying the above).  
  - **Reason**:  
    - **Genuine Goal-Directedness** (Desideratum 1): It endogenously *modifies its own scaffolding* to pursue better feedback (goal-adaptation).  
    - **Autonomy** (Desideratum 2): It acts without new external commands to restructure itself.  
    - **Graded Agency** (Desideratum 5): High autonomy, but context (e.g., its sandbox) may constrain it.  
  - **Not accidental**: It directly triggers the "genuine goal-directedness" criterion – the core differentiator from tools.

  ---

  ### **The Tension You Suspected**  
  **The irreconcilable conflict is between Desideratum 5 (agency is spectral) and Desideratum 6 (needs a bright line)**.  
  - **Why**: Any threshold (e.g., "autonomy score > X") will be arbitrary for borderline cases (e.g., your recommender). A theory can *describe* a spectrum but can’t *objectively* binarize it.  
  - **Implication**: Your memo must either:  
    a) Adopt a bright line pragmatically (safety-camp favored), accepting some inconsistency at edges, *or*  
    b) Define tiers of agency (e.g., "autonomy levels") for review, acknowledging graduality.  

  **Recommendation**: Build tiers (low/medium/high agency) based on autonomy + goal-adaptation. This satisfies most desiderata while giving safety teams actionable thresholds. The self-rewriting scaffold? **High-agency tier**. Thermostat? **Tool (no agency)**. Recommender? **Low-agency tier** – triggering lighter review.

  ---

  ### Summary of Requirements for Your Memo
  | Desideratum                     | Non-Negotiable | Camp-Neutral? | Kills Weak Definitions |
  |---------------------------------|----------------|---------------|------------------------|
  | 1. Genuine vs. Apparent Goals   | ✓             | ✓             | ✓ (Most lethal)        |
  | 2. Capability vs. Autonomy      | ✓             | ✓             |                        |
  | 3. Compositionality             | ✓             | ✓             |                        |
  | 4. Deployment-Sensitivity       |               | ✓             |                        |
  | 5. Spectral Agency              |               | ✓             |                        |
  | 6. Bright-Line Threshold        |               | Safety        |                        |
  | 7. Anti-Anthropomorphism        |               | Capabilities  |                        |

  This framework forces clarity: **Agency requires autonomous pursuit of adaptive goals, modulated by context, on a spectrum.** Start your memo here – it exposes why "vibes" fail and where compromises are unavoidable.
