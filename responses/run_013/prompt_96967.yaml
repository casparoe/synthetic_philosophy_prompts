     - **Apanpsychism (5A→No)** and **Neutral Cosmopsychism (5B→No)**:  
       *Diagnosis*: Coherent but unattractive. Neutral experiences lack ethical urgency, making fundamentality otiose. Rarely defended, as valence is central to ethical debates.  

  ### Annotations on Tree Strains
  - **Node 1 (Structuralist worry)**: Forces agnosticism about intrinsics, but the tree doesn't include an "agnostic" leaf because positions still commit to fundamentality/emergence (e.g., via non-physical arguments). Agnosticism is absorbed into eliminativism (**2→No**) or non-fundamental emergentism (**3→Emergent**).  
  - **Micro-ethics branches (5A–7A)**: Strain arises from scaling—micro-interests threaten to swamp ethics. The tree isolates this via **7A**, but practical inertness (**Micro-Inert Panpsychism**) is ad hoc.  
  - **Cosmic ethics**: Simpler than micro-ethics (no aggregation problem), but epistemic access issues (**Cosmic Ethics**) mirror the structuralist worry.  
  - **Protopanpsychism**: Avoids valence/interests but inherits the combination problem, which the tree notes without branching (as no ethical implications arise).  

