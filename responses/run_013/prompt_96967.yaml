  Below is a decision tree that systematically maps the logical space of positions regarding the ethical implications of consciousness being fundamental versus emergent. The tree is built from first principles, prioritizing the logical commitments that distinguish positions, and adheres to your constraints: each node is a question answerable without prior knowledge of the positions, leaves are named (or marked "unnamed") with their most awkward commitment, and the structuralist worry is integrated at the point where it impacts the ethical implications. The tree results in 10 leaves (within your 8–12 target), avoids namedropping, and focuses on the distinctions you specified (e.g., fundamentality, valence, interests, structuralism).

  ### Decision Tree: Ethical Implications of Consciousness Fundamentality

  **Key to Abbreviations**:  
  - **Valence**: Whether an experience has a positive/negative affective tone (e.g., pleasure/suffering).  
  - **Interests**: Whether valence entails a moral claim (e.g., an interest in avoiding suffering).  
  - **Structuralist worry**: Physics describes only relational/dispositional properties, leaving intrinsic nature (e.g., consciousness) unspecified.  

  ---

  #### 1. **Does physics fully capture the intrinsic nature of reality, or only relational structure?**  
     *(This node addresses the structuralist worry. If physics is silent on intrinsics, it undermines claims about consciousness derived solely from physics.)*  
     - **Yes, physics is exhaustive (structuralism holds)**:  
       → Proceed to **2**.  
     - **No, physics is incomplete (structuralism fails)**:  
       → Proceed to **3**.  

  #### 2. **Can consciousness arise from purely structural physical properties?**  
     *(If physics is exhaustive, consciousness must either emerge from structure or be impossible. This avoids assuming fundamentality.)*  
     - **Yes (emergentism)**:  
       → Leaf: **Reductive Physicalism**.  
         *Most awkward commitment: Denies the "hard problem" of consciousness, asserting subjective experience emerges from non-experiential structure.*  
     - **No (consciousness cannot be structural)**:  
       → Leaf: **Eliminativism or Illusionism**.  
         *Most awkward commitment: Denies the existence of consciousness despite first-person evidence, making ethics for experiences incoherent.*  

  #### 3. **Is consciousness fundamental or emergent?**  
     *(If physics is incomplete, consciousness could be fundamental (non-structural) or emergent from non-structural properties.)*  
     - **Emergent (dependent on specific configurations, e.g., biology)**:  
       → Leaf: **Non-Reductive Emergentism**.  
         *Most awkward commitment: Cannot explain how non-structural properties "generate" consciousness without magic.*  
     - **Fundamental (irreducible and universal)**:  
       → Proceed to **4**.  

  #### 4. **What is the form of fundamental consciousness?**  
     *(Distinguishes panpsychism, cosmopsychism, and protopanpsychism without naming them prematurely.)*  
     - **Distributed across countless micro-entities (micro-subjects)**:  
       → Proceed to **5A**.  
     - **Unified in a single cosmic entity (cosmic subject)**:  
       → Proceed to **5B**.  
     - **Present only as protophenomenal properties (non-experiential primitives)**:  
       → Leaf: **Protopanpsychism**.  
         *Most awkward commitment: Cannot explain how protophenomenal properties combine to form macro-consciousness ("combination problem").*  

  #### 5A. **Do micro-subjects have experiences with valence?**  
     *(Valence is necessary for interests; without it, micro-ethics may be inert.)*  
     - **No (neutral experiences)**:  
       → Leaf: **Apanpsychism (Unnamed)**.  
         *Most awkward commitment: Posits ubiquitous micro-experiences with no valence, making them ethically irrelevant.*  
     - **Yes (valenced experiences)**:  
       → Proceed to **6A**.  

  #### 6A. **Does valence entail interests for micro-subjects?**  
     *(Interests make experiences morally relevant; else, valence is inert.)*  
     - **No (valence without interests)**:  
       → Leaf: **Valence-Only Panpsychism (Unnamed)**.  
         *Most awkward commitment: Valenced micro-experiences (e.g., micro-suffering) create no moral claims, undermining intuitions about pain.*  
     - **Yes (micro-interests exist)**:  
       → Proceed to **7A**.  

  #### 7A. **How should we respond to micro-interests?**  
     *(Ethical implications: take interests seriously, treat as inert, or reject the view.)*  
     - **Take them seriously (micro-ethics is obligatory)**:  
       → Leaf: **Micro-Obligatory Panpsychism**.  
         *Most awkward commitment: Demands impossible attention to micro-interests (e.g., every particle collision causes harm), paralyzing action.*  
     - **Treat as practically inert (micro-ethics is negligible)**:  
       → Leaf: **Micro-Inert Panpsychism**.  
         *Most awkward commitment: Admits ubiquitous micro-interests but ignores them, creating a "moral blind spot."*  
     - **Reject the view (reductio ad absurdum)**:  
       → Leaf: **Panpsychist Reductio**.  
         *Most awkward commitment: Abandons panpsychism due to absurd ethical implications, undermining the metaphysical argument for fundamentality.*  

  #### 5B. **Does the cosmic subject have experiences with valence?**  
     *(Cosmic valence could ground ethics; neutrality makes it inert.)*  
     - **No (neutral cosmic experience)**:  
       → Leaf: **Neutral Cosmopsychism (Unnamed)**.  
         *Most awkward commitment: A cosmic subject with no valence renders the universe ethically void.*  
     - **Yes (valenced cosmic experience)**:  
       → Proceed to **6B**.  

  #### 6B. **Does cosmic valence entail cosmic interests?**  
     *(Cosmic interests could demand alignment; else, ethics is local.)*  
     - **No (valence without interests)**:  
       → Leaf: **Valence-Only Cosmopsychism (Unnamed)**.  
         *Most awkward commitment: Cosmic suffering has no moral weight, conflicting with the intuition that suffering matters.*  
     - **Yes (cosmic interests exist)**:  
       → Leaf: **Cosmic Ethics**.  
         *Most awkward commitment: Requires knowledge of the cosmic will (e.g., how human acts affect it), which is inaccessible or speculative.*  

  ---

  ### Tree Structure Summary
  - **Total leaves**: 10.  
  - **Structuralist worry impact**: Bites at **Node 1**. If physics is exhaustive (**Yes**), fundamentality claims are undermined, leading to emergentism or eliminativism. If physics is incomplete (**No**), fundamentality becomes viable, but ethical implications depend on valence and interests.  

  ### Flagged Issues
  1. **Indistinguishable leaves**: None. The tree separates all positions cleanly.  
  2. **Unoccupied combinations**:  
