answer: |-
  Below is a comprehensive set of desiderata for any theory of representation in neural networks, structured to address your specified cases, distinctions, constraints, and foundational commitments. Each requirement is motivated by a specific case or consideration, marked for negotiability, and annotated with its theoretical implications. The framework is designed to be maximally demanding to force theoretical clarity.

  ---

  ### **I. Adjudication Cases: What the Theory Must Explain**
  *(Motivated by empirically observable network behaviors)*

  1. **Latent Variable Tracking (Non-negotiable)**  
     *Case*: A network whose outputs systematically covary with an unobserved variable (e.g., object rotation in vision tasks), with internal states sensitive to perturbations of that variable.  
     *Requirement*: The theory must distinguish genuine *representation* of the variable from accidental correlation.  
     *Motivation*: Core evidence for representation in neuroscience/cognitive science.

  2. **Distributed Superposition (Non-negotiable)**  
     *Case*: A network where features (e.g., "curvedness" in shape recognition) are linearly decodable from activations but not localized to any unit.  
     *Requirement*: The theory must allow for content attribution to *patterns* of activity without requiring localized "symbols."  
     *Motivation*: Neural networks fundamentally rely on distributed, superpositional coding.

  3. **Causally Inert Information (Non-negotiable)**  
     *Case*: A network where a property (e.g., image brightness) is linearly decodable from activations, but ablation studies prove it is unused in the network’s output computation.  
     *Requirement*: The theory must separate *carrying information* from *functioning as a representation* in the system’s operations.  
     *Motivation*: Forces a distinction between mere correlation and representational role.

  4. **Symmetry-Induced Content Indeterminacy (Non-negotiable)**  
     *Case*: A network computing a symmetric function (e.g., XOR with permutation-invariant weights), where multiple content assignments (e.g., "A not B" vs. "B not A") are equally consistent.  
     *Requirement*: The theory must either (a) deny representation exists here or (b) explain why one interpretation is privileged. It may not arbitrarily assign content.  
     *Motivation*: Tests whether content is fixed by structure alone or requires external factors.

  5. **Interventional Validation (Non-negotiable)**  
     *Case*: A network where artificially setting an internal state (e.g., activating a feature vector) produces behavior predictable *only* if that state has specific content (e.g., inducing "cat" perception in a vision model).  
     *Requirement*: Successful interventions must strengthen representational claims; failures must falsify them.  
     *Motivation*: Establishes representation as causally explanatory, not just descriptive.

  ---

  ### **II. Mandatory Distinctions: What the Theory Must Respect**
  *(Motivated by conceptual pitfalls in philosophy of mind & cognitive science)*

  6. **Representation vs. Information (Non-negotiable)**  
     *Distinction*: A state *represents* X only if it has a function to track/correlate with X *for the system*. Merely covarying with X (e.g., due to training data) is insufficient.  
     *Motivation*: Avoids conflating statistical correlation (e.g., activation patterns correlating with image noise) with intentionality.

  7. **Content vs. Causal Role (Non-negotiable)**  
     *Distinction*: What a state represents (e.g., "edges") vs. its computational role (e.g., triggering a downstream classifier). These may diverge (cf. *Causally Inert Information* case).  
     *Motivation*: Prevents reduction of content to causal effects alone.

  8. **Content vs. Vehicle (Non-negotiable)**  
     *Distinction*: The physical realization of a state (e.g., activation vector) vs. its content (e.g., "dog"). A single vehicle may carry multiple contents (e.g., via superposition).  
     *Motivation*: Addresses the implementation-independence of content.

  9. **System-Attribution vs. Interpreter-Attribution (Camp-specific: Naturalism-preferred)**  
     *Distinction*: Content must be attributable *to the system itself* based on its structure and function, not imposed by an external interpreter.  
     *Motivation*: Rejects antirealist/"fiction" views. *(Negotiable: Anti-naturalist camps may reject this.)*

  ---

  ### **III. Essential Constraints: What the Theory Must Accommodate**
  *(Motivated by neural network architectures and learning dynamics)*

  10. **Superpositional Encoding (Non-negotiable)**  
      *Constraint*: The theory must allow that a layer with *d* dimensions can represent >*d* features, with features recoverable only via non-trivial (e.g., linear) decoding.  
      *Motivation*: Neural networks *routinely* exploit superposition for efficiency.

  11. **Polysemy of Units (Non-negotiable)**  
      *Constraint*: A single unit/neuron may participate in representing multiple unrelated features (e.g., "texture" and "color" in vision networks).  
      *Motivation*: Empirical observations from network dissection studies.

  12. **Causal Efficacy (Non-negotiable)**  
      *Constraint*: Genuine representations must be *causally relevant* to the system’s behavior. States lacking downstream effects cannot represent.  
      *Motivation*: Ensures representation is not merely epiphenomenal (links to *Interventional Validation*).

  ---

  ### **IV. Foundational Commitments: What the Theory Must Decide**
  *(Motivated by philosophical trade-offs)*

  13. **Naturalism (Camp-specific: Naturalist projects require it)**  
      *Constraint*: Representation must arise from physical/computational properties (weights, activations, training) without invoking non-natural factors (e.g., homunculi).  
      *Motivation*: Aligns with scientific realism about AI.

  14. **Function-Based Content (Camp-specific: Teleosemantics-inspired)**  
      *Constraint*: Content is determined by the *functional role* of a state (e.g., what it was "selected for" via training), not intrinsic structure.  
      *Motivation*: Explains how identical structures can represent differently in different networks. *(Negotiable: Structuralists may reject this.)*

  15. **Interpretive Neutrality (Camp-specific: Anti-naturalism/Instrumentalism)**  
      *Constraint*: The theory *need not* resolve whether content is "in the system" or "in the interpreter."  
      *Motivation*: Allows for pragmatic or fictionalist views. *(Negotiable: Naturalists will reject this.)*

  ---

  ### **Critical Tensions & Eliminative Power**
  - **Most Eliminative Requirement**: **Causal Efficacy (#12)**. This immediately rules out:  
    - Purely information-theoretic views (failing *Causally Inert Information*).  
    - Simple decodability views (e.g., "if linear probes read it, it’s represented").  
    - Observer-relative interpretations (if content lacks causal power in the system).

  - **Hardest Pair to Satisfy Jointly**: **Causal Efficacy (#12) + Attribution to Physical System (#9 + #13)**.  
    - *Tension*: If representations are causal, they must "do work" in the system. But if the system is *just* weights/activations (no intrinsic meaning), how can content be causal without dualism?  
    - *Resolution Stakes*: Forces theories to either (a) reduce content to causal roles (#7) or (b) ground content in naturalistic functions (#14). Unsatisfactory answers collapse into instrumentalism or magic.

  ---

  ### **Summary of Non-Negotiables**
  Any adequate theory **must** handle cases 1–5, respect distinctions 6–8, and satisfy constraints 10–12. These are fixed by empirical and conceptual necessities. Commitments 9, 13–15 are camp-dependent and define the theory’s philosophical stance. The framework’s sharpest edge is **causal efficacy** (#12), which, when combined with architectural constraints (#10–11), demands a naturalistically plausible account of how content arises from structure *and* matters to behavior. Without this, the theory risks being merely descriptive.
