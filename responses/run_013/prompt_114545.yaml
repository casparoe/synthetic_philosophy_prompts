answer: |-
  ### Final Exam Question: "Character, Prediction, and the Machinery of Mind"
  **Time Allowed:** 90 minutes  
  **Closed Book**  
  **Answer the following question in a single, coherent essay. Your argument must engage the scenario provided and directly address the philosophical tension specified.**

  > **Scenario:** A novelist writes two versions of the same character scene.  
  > **Version A** uses belief-desire psychology: *"Elara believed the bridge was unsafe; she desired to reach the town before nightfall. So, she turned toward the forest path."*  
  > **Version B** uses sub-personal, mechanistic terms: *"Elara’s amygdala registered threat patterns in the bridge structure. Dopaminergic pathways associated with goal-achievement activated. Motor cortex signals initiated a 37-degree turn toward the forest."*  
  >   
  > Readers predict Elara’s next actions accurately from Version A but not from Version B, despite Version B’s mechanistic completeness.  
  >   
  > **Question:** Does this predictive failure establish that belief-desire psychology (1) provides evidence **against** eliminative materialism, (2) supports **instrumentalism** about the intentional stance, or (3) offers **neither** decisive evidence? Defend one position. Crucially, explain **what the failure does and does not prove** about the relationship between fictional prediction and the realism/instrumentalism debate. Avoid mere summaries of eliminativism; focus on the implications of the scenario.

  ---

  ### Model Answer (Committing to Instrumentalism – 620 words)  
  The novelist’s scenario demonstrates that belief-desire attributions are *predictively indispensable* for navigating complex behavior—even in fiction—but this indispensability supports **instrumentalism**, not realism, about propositional attitudes. It does not refute eliminative materialism’s core claim, nor does it prove that beliefs/desires map onto neural structures. Instead, it reveals the intentional stance as an irreplaceable heuristic for agents like us, regardless of its ontological status.  

  **First, the predictive failure in Version B is fatal to eliminative materialism’s radical ambition but not its thesis.** Eliminativism (e.g., Churchland) posits that folk psychology (FP) will be *replaced*, not reduced, by mature neuroscience. Yet Version B’s mechanistic description, though physically exhaustive, fails to generate anticipatory traction. This shows FP’s predictive utility is *pragmatically ineliminable* for beings with our cognitive limitations. However, eliminativists could retort that fiction is not a scientific domain: FP’s success in predicting *imaginary* agents no more disproves its future elimination than astrology’s utility in structuring narratives disproves its falsity. Thus, while the scenario exposes eliminativism’s practical implausibility (we cannot *think* without FP), it does not disprove its metaphysical claim that beliefs/desires lack referents.  

  **The scenario’s true force is in vindicating Dennett’s instrumentalism.** Instrumentalism treats the intentional stance as a tool for predicting behavior by treating systems as rational agents with beliefs/desires—regardless of whether these states "really exist." Version A succeeds because readers adopt this stance: they interpret Elara as a coherent agent optimizing actions based on attributed mental states. Version B fails because sub-personal mechanisms, while causally operative, are cognitively opaque for *agent-level prediction*. Crucially, this predictive gap persists *even in fiction* because authors and readers share the same cognitive architecture. We are "natural psychologists" (Fodor): evolution hardwired us to decode behavior via belief-desire matrices. Fiction merely externalizes this capacity.  

  **But does this predictive success imply realism? No—and here lies the crux.** Realism (e.g., Fodor) holds that beliefs/desires are causally efficacious internal states. The novelist might hope that FP’s efficacy in fiction suggests realism: if attributing beliefs/desires lets us predict *invented* minds, surely it tracks *real* structures? Yet this conflates *heuristic success* with *ontological truth*. Consider physics: Newtonian mechanics predicts planetary motion for most purposes, but we are realists about general relativity because it explains *why* predictions work. FP’s predictive power in fiction (or life) explains nothing about *implementation*; it only proves functional utility. Version B’s failure underscores that mechanistic descriptions lack the right "grain" for agent-scale reasoning—not that beliefs/desires *cause* behavior. They might be user-interfaces for neurological machinery (Dennett’s "manifest image"), not its components.  

  **Ultimately, fiction is a controlled experiment in instrumental efficacy.** Writers craft characters by simulating the intentional stance; readers succeed by adopting it. This intersubjective predictive feat confirms FP’s status as a cognitive technology. But it cannot adjudicate realism because fiction operates entirely within the manifest image. Realism requires independent evidence (e.g., neural correlates of propositional attitudes), which fiction cannot supply. The novelist’s craft thus powerfully defends instrumentalism: it shows FP is *how we make sense of agents*, even imaginary ones. Yet it leaves eliminativism’s speculative future and realism’s metaphysical claims untouched.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  Candidates must hit **five key moves**. Failure to address any move deducts specified marks. Common errors are noted.  

  1. **Engagement with Predictive Failure in Scenario** (8 marks)  
     *Must:* Explain why mechanistic description (Version B) fails predictively despite physical completeness.  
     *Common Error (‑8):* Ignores the scenario or merely describes it without analysis.  

  2. **Rejection of Eliminativism’s Practical Ambition** (4 marks)  
     *Must:* Argue that the failure shows belief-desire psychology is pragmatically indispensable for agents like us.  
     *Common Error (‑4):* Claims the scenario *refutes eliminativism outright* (it doesn’t; eliminativism could still be true).  

  3. **Distinction: Instrumentalism vs. Realism** (4 marks)  
     *Must:* Contrast instrumentalism (successful tool) with realism (true mental states) using the scenario.  
     *Common Error (‑4):* Conflates instrumental utility with ontological proof (e.g., "Prediction success *means* beliefs are real").  

  4. **Limits of Fictional Evidence** (2 marks)  
     *Must:* State why fiction’s predictive success cannot prove realism (e.g., fiction operates within FP, cannot access "real" mechanisms).  
     *Common Error (‑2):* Assumes fictional prediction generalizes to scientific evidence for mental states.  

  5. **Committed Position** (2 marks)  
     *Must:* Defend *one* coherent view (anti-eliminativism/instrumentalism/neither) based on the scenario.  
     *Common Error (‑2):* Surveys positions without commitment or takes an inconsistent stance.  

  ### Design Notes  
  - **Scenario Focus:** Forces engagement beyond eliminativism summaries by anchoring analysis in concrete prediction failure.  
  - **Instrumentalism Bias:** Model answer defends this to mirror your writerly concern with utility over ontology.  
  - **Rubric Strictness:** High weighting (8 marks) for scenario analysis prevents evasion. Realism/instrumentalism distinction (4 marks) targets the crux you identified.  
  - **Philosophical Rigor:** Requires students to separate heuristic power (indisputable in fiction) from ontological claims (unprovable by fiction).  

  This structure ensures students wrestle with your core question: *What does the novelist’s predictive magic reveal—and not reveal—about the mind?*
