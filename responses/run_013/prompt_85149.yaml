  Main Case:

  Consider a gamble that pays a finite amount of money determined by the number of fair coin flips until the first heads. Let the outcome be the trial number n (n=1,2,3,...) at which the first heads occurs, which happens with probability (1/2)^n. The payoff for outcome n is P(n) = (-1)^{n+1} * (2^n / n) dollars. The expected value is the series E = ∑_{n=1}^∞ (1/2)^n * P(n) = ∑_{n=1}^∞ (-1)^{n+1} / n, which is conditionally convergent to ln(2)≈0.693. However, the series of absolute terms is ∑_{n=1}^∞ |(1/2)^n * P(n)| = ∑_{n=1}^∞ 1/n, which diverges. Rearrangements yield different sums: for example, the natural order converges to ln(2), but a rearrangement that takes positive terms until the partial sum exceeds 1, then negative terms until it drops below 1, and so on, converges to 1. This makes the expectation undefined because the sum depends on the order of summation, and the order of outcomes is arbitrary. The payoffs are unbounded: |P(n)| = 2^n/n → ∞ as n → ∞. Boundedness would be fatal because if the payoffs were bounded, then the absolute series would converge (as the probabilities form a convergent geometric series), so the expectation would be well-defined.

