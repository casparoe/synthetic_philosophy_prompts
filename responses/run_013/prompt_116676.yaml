answer: |-
  ## The Metaphysics of Material Constitution: A Conceptual Explanation

  The core problem of material constitution concerns how distinct material objects relate when they seem to occupy the same space and share all their matter at a given time. Your two cases vividly illustrate the challenges:

  **Case One: The Reshaped Statue**
  *   **(a) Counting Question:** During the exhibition year, common intuition suggests *two* material objects are present: the statue itself and the lump of clay constituting it. What turns on this? If there are two, we must explain how distinct objects can be so intimately co-located without merging into one. If only one (either the lump *or* the statue), we must explain why we seem to refer meaningfully to both and why one seems to persist while the other perishes when squashed (e.g., "The statue was destroyed, but the clay remains"). The counting affects persistence conditions and our ontology of artefacts.
  *   **(b) Coincidence Question:** If there are two objects (statue and lump) sharing all matter during the exhibition, the problem is how they can differ in their properties despite material identity. The statue has the property *being a statue*, while the lump (arguably) does not; the lump has the property *could survive being squashed* while the statue (arguably) does not. The grounding problem asks: what *grounds* these property differences if not differences in matter, location, or intrinsic physical properties? Taking coincidence as brute seems unsatisfying because it violates Leibniz's Law (the principle that identical things share all properties) and introduces unexplained ontological complexity – a proliferation of objects differing only in modal or historical properties without a clear basis for the difference.
  *   **(c) Modal Question:** Suggesting the statue and lump are identical *but only contingently so* conflicts with the necessity of identity: if A = B, then necessarily A = B (in any world where A and B exist). If the lump *is* the statue during exhibition, how could the lump survive being squashed while the statue does not? If they are identical, they must share all properties, including persistence conditions. A contingent identity defender might argue that the identity holds only under certain descriptions or conditions (e.g., *qua* statue vs. *qua* lump), effectively abandoning strict identity for a relation of constitution. Alternatively, they might deny the necessity of identity or employ counterpart theory, where different counterparts (versions) of the same object in different possible worlds have different persistence conditions. This approach risks being ad hoc or revising standard logic.

  **Case Two: The Lump-Shaped Sculpture**
  *   **(a) Counting Question:** At any moment, common intuition may suggest *two* objects: the lump of clay and the sculpture (which is *of* a lump). What turns on this? The symmetry makes it harder to privilege one description over the other. Denying either seems arbitrary, but accepting both forces coincidence immediately and persistently.
  *   **(b) Coincidence Question:** The grounding problem here is acute. The sculpture has the property *being an artwork*, while the lump (arguably) does not. The lump has the property *would exist even if not intended as art* (if such counterfactuals hold), while the sculpture (arguably) does not. If they share all matter, location, physical properties, *and temporal history*, what possible basis remains for grounding these differing properties? Brute coincidence here seems especially unpalatable, as there is no temporal or historical asymmetry to exploit.
  *   **(c) Modal Question:** The problem is similar to Case One, but exacerbated by the symmetry. If the sculpture and lump are contingently identical, we face the same conflict with the necessity of identity. Furthermore, their modal profiles *might* differ: the sculpture arguably depends on artistic intention, while the lump might not. How can one thing have these divergent modal properties if it is self-identical?

  **Main Options and Their Costs:**

  1.  **Eliminativism (Deny Artefacts):** Only fundamental particles or the lump exist; statues and sculptures are not genuine objects. There is only one object: the lump of clay in both cases.
      *   *Costs:* Radically counterintuitive. It denies the apparent reality of statues and artworks. In Case One, it struggles to explain why "the statue was destroyed" seems true. In Case Two, it denies the sculpture exists despite its artistic intention and status, failing to capture the distinctiveness of the artwork.
  2.  **Mereological Essentialism (Objects = Parts):** An object is strictly identical to its particular parts arranged at a time. Any change in parts destroys it.
      *   *Costs:* Implausibly strict persistence conditions. In Case One, shaping the lump destroys the original lump and creates a new statue-object; squashing destroys the statue and creates a new lump. This generates many short-lived objects and conflicts with our intuition that the *same clay* persists through reshaping. In Case Two, there is only one object (the lump-parts arranged lump-wise) – the artistic intention doesn't create a distinct object, failing to account for the sculpture's distinct properties.
  3.  **Perdurantism (4D Wholes):** Objects are extended in time like worms; they have temporal parts. The statue is a temporal part of the clay-worm during the exhibition year; the lump is the whole clay-worm.
      *   *Costs:* Accepts coincidence as overlap of distinct 4D objects. In Case One, the statue is a temporal segment of the longer clay-worm. Squashing ends the statue-segment but not the clay-worm. This handles persistence but posits a complex ontology of temporal parts. In Case Two, the sculpture and the lump are distinct 4D objects coinciding *throughout* their entire histories – arguably an even more pervasive coincidence. It grounds property differences in their different temporal extents and relations to other temporal parts (e.g., the sculpture-part is linked to an artworld context), but this can feel strained for perfectly synchronic properties like *being an artwork now*.
  4.  **Constitution ≠ Identity:** The statue is constituted by the lump but is a distinct object with different persistence conditions and modal properties. Coincidence is real but explained by different "dominant kinds" or principles of unity.
      *   *Costs:* Accepts coincidence of distinct objects. The grounding problem remains: what *makes* the statue an artwork and the lump not, if they share all matter and intrinsic properties *now*? Typically, differences are grounded in modal/historical/intentional properties (e.g., the statue's *potential* to lose its form, its coming into existence via artistic shaping). In Case One, this works: the lump constitutes the statue until squashed. In Case Two, it struggles: if the lump constitutes the sculpture from the start and they share *all* properties synchronically and diachronically, the grounds for their non-identity vanish. Distinguishing them requires positing irreducible differences in kind or persistence conditions despite perfect symmetry, which can seem arbitrary.
  5.  **Sortal-Relative Identity:** Identity is relative to a sortal concept (e.g., "lump," "statue"). The statue is the same lump as the original clay, but not the same statue (after reshaping), and during exhibition, it is *both* a statue and a lump, but these identities hold relative to different sortals. There is no absolute identity.
      *   *Costs:* Rejects classical absolute identity and Leibniz's Law, requiring significant logical revision. In Case One, the lump survives squashing relative to the sortal "lump," but the statue does not survive relative to the sortal "statue." This handles change but may confuse "same what?". In Case Two, it handles the symmetry well: relative to "lump," it's identical to the lump; relative to "sculpture," it's identical to the sculpture. There is no pressure to count absolutely or ground differences beyond the sortals we employ. The cost is accepting that fundamental identity is not absolute but tied to our conceptual schemes.

  **Verdict on Case Two:**

  Sortal-Relative Identity handles Case Two best. The perfect symmetry is precisely what this view is designed for: the very same portion of reality is *a lump* under the sortal "lump" and *a sculpture* under the sortal "sculpture." There is no need to posit two coinciding objects, deny one exists, or struggle to ground differences in modal or historical properties where none exist. The differing properties (*being a lump*, *being a sculpture*) are grounded in the application of different sortal concepts to the single portion of matter. It accepts the brute fact that different sortals apply, but avoids the brute coincidence of two distinct objects.

  **Why the others do worse:**

  *   **Eliminativism:** Simply denies the sculpture exists, failing to account for the artistic reality and intentional act.
  *   **Mereological Essentialism:** Cannot distinguish the sculpture from the lump, as they share parts and history perfectly; only one object exists.
  *   **Perdurantism:** Posits two coinciding 4D objects throughout time without any intrinsic or historical difference to ground their distinctness, making coincidence pervasive and unexplained.
  *   **Constitution ≠ Identity:** Faces the grounding problem head-on with no temporal, modal, or historical asymmetry to exploit. Claiming the sculpture and lump are distinct objects despite sharing *all* properties synchronically and diachronically seems particularly unmotivated and arbitrary.

  Sortal-Relative Identity embraces the conceptual nature of the distinction in Case Two, accepting that our counting and identity judgments are inherently sortal-dependent when faced with such symmetry, without multiplying ontology or leaving differences ungrounded in a problematic way. Its cost is a significant departure from classical identity, but it offers the most coherent and economical resolution to the unique challenge of perfect coincidence without asymmetry.
