prompt: |-
  I'm putting together a session for my reading group on laws of nature and what I want is a decision tree, not an essay. Start it from something I think everyone in the room already accepts: that there's a real difference between a lawlike generalization (all uranium-235 spheres are less than a mile across) and an accidental one (all the coins in my pocket are silver), and that the difference isn't just in our heads. Make every branch node a question someone could answer without knowing which camp it lands them in, and make the leaves the positions themselves: the best-system account and its no-chances variant, the deflationist view that there aren't really laws, laws as relations between universals (Armstrong style), dispositional essentialism, laws as primitive and governing (Maudlin style), laws as stable necessities resting on meta-laws (Lange style), and the pragmatist patchwork view. Include a node on whether the fundamental facts are just an occurent mosaic or whether something modal has to be added on top, a node on whether entanglement and other non-seperable fundamental facts break the mosaic picture, and a node on whether 'governing' is even coherent. Each leaf gets one line on its most awkward commitment. Flag any two leaves your tree can't seperate, and tell me which answer-combinations nobody occupies and whether that's because the view is incoherent, unattractive, or just unexplored. 6-8 nodes, no more than 9 leaves. No reading lists.
