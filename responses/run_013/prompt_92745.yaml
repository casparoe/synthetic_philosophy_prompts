prompt: |-
  I am a novelist, and I have been circling a puzzle about language that comes out of my working life rather than out of any theory, and I would like to know whether there is an established name for the configuration I keep meeting.

  Three instances, all of them real to me. First, a word from the dialect I grew up speaking: I use it with complete confidence, so do the other speakers of that dialect, we agree about when it applies, and we correct outsiders who use it wrongly — and yet when I ask anyone, myself included, what it means, we can only produce more sentences containing it, each of which would need the word explained in turn. Second, voice, the central term of every writing workshop I have sat in. No two writers define it alike, and the definitions are not merely different but largely incompatible; even so, a room of writers will independently flag the same paragraphs as lacking it, and the agreement is not random, because when challenged the same writers will defend their judgments at length. Third, a character in the book I am writing now: a fluent impostor who deploys the vocabulary of a profession he has never practised, in the right places and the right registers, and neither the other characters nor the reader can tell — nor, so far as I can see, could anything available to me inside the story tell, since he behaves exactly as a practitioner behaves.

  What these share is not vagueness, and not disagreement. It is that the vocabulary does its work — sorts cases, supports inference, gets taught, gets enforced — while nothing anywhere anchors it: not in any single speaker's grasp, and not, as far as I can see, in the speakers taken together. I had assumed such a state must be unstable, that a vocabulary with no floor under it would drift or collapse. It does not. It behaves exactly like a vocabulary that means something.

  So: is there a name for this? I suspect the nearest established ideas are not the same thing. One says that meaning is held by a few people who genuinely know and is lent out to the rest of us; but in my cases nobody knows, and there is no expert anywhere up the chain. Another concerns terms that fail to pick anything out; but my dialect word picks out something real, and I can tell when someone misapplies it. A third is the familiar worry that something manipulating words might manipulate them without meaning anything; but that seems to be about one mind and whatever goes on inside it, whereas what puzzles me is a public vocabulary that works and is unanchored everywhere at once.

  I do not want a bare label. What I want is the carving: whether this is one phenomenon or several; whether it is genuinely distinct from those neighbours or only a social restatement of one of them; what the edges of it are — whether, for instance, a community whose members all defer to one another, with no one at the base of the chain, can be said to mean anything at all; and, if nothing established fits, what you would call it, defined precisely enough that I can say what falls outside.
reasoning: |-
  Okay, the user is a novelist grappling with a linguistic puzzle from their practical experience. They describe three scenarios where language functions effectively without any clear anchor or definition. First, a dialect word everyone uses confidently but can't define. Second, "voice" in writing workshops—indefinable yet consistently identifiable. Third, an impostor character whose professional jargon is convincing without actual knowledge.

  The user wants to know if there's a name for this phenomenon. They've considered existing concepts like semantic deference (where meaning relies on experts) or empty terms, but those don't fit because in their cases, there are no experts, and the terms do refer to something real. They emphasize it's not about vagueness or disagreement but about functional language without foundational meaning.

  I need to recall relevant linguistic and philosophical theories. Wittgenstein's language games come to mind—language use in specific contexts without needing explicit definitions. Then there's semantic externalism, where meaning depends on external factors, not individual understanding. The dialect word fits here—its meaning is tied to communal practice, not individual grasp.

  For "voice," it's a cluster concept—various overlapping features without a single definition. Workshop participants recognize it through shared examples, not a fixed set of criteria. This is similar to family resemblances in philosophy.

  The impostor character shows that meaning can be performative. He uses language correctly based on practice, not understanding. This aligns with semantic externalism, where meaning is about use in a community, not internal states. Also, collective intentionality—the group's practices validate meaning.

  The user rejects existing ideas like semantic deference because there's no expert. Here, meaning is distributed across the community, which is more like distributed cognition. Each member contributes to sustaining the term's use without any one person holding the full definition. The dialect word is maintained through mutual correction, creating a loop where meaning is reinforced collectively.

  Is this a single phenomenon? All cases involve socially constituted meaning—language's function emerges from collective practice. The edges: it's distinct from deference (no experts), empty terms (they refer), and internalism (it's public). A community without a base can still mean something through mutual interaction and practice.

  The term "hermeneutic holism" might fit—meaning from the whole system of practices. But it's not widely used. Alternatively, "practice-based semantics" or "communal enactment." However, the most precise is recognizing it as Wittgensteinian language games combined with semantic externalism and distributed cognition.

  The user needs a precise definition to delineate boundaries. They might also seek validation of their observation as a legitimate phenomenon, possibly for their writing or to articulate this in their work. As a novelist, understanding this could deepen their portrayal of language and imposture. Their deeper need might be to frame their empirical observations within theoretical frameworks to enhance their literary exploration or to communicate this concept to others.
answer: |-
  Your observation is profound and captures a phenomenon that *is* distinct from its neighboring concepts, though it draws on several established ideas. The closest established concept is **Semantic Externalism (specifically Social Externalism)** combined with **Wittgensteinian Language Games** and **Distributed Cognition**. However, no single term perfectly captures the "unanchored yet functional" nature you describe. Let's carve it precisely:

  1.  **The Core Phenomenon:** A linguistic expression (word, term, phrase, register) that:
      *   **Functions effectively:** It reliably sorts cases (correct/incorrect application), supports inferences, is taught/learned, and is enforced within a community.
      *   **Lacks explicit definition:** No single user, nor the community collectively, can provide a non-circular, explicit definition or essential set of necessary and sufficient conditions. Meaning is demonstrated through *use in paradigmatic examples and contexts*.
      *   **Lacks semantic deference:** There is no identifiable expert or foundational instance upon which the meaning relies. Meaning is sustained purely by the *mutual calibration of practice* within the community.
      *   **Is not empty:** It demonstrably refers to *something* real and observable within the shared context/practice (people agree on correct/incorrect uses), even if that "something" defies explicit articulation.

  2.  **Why Existing Neighbors Don't Quite Fit:**
      *   **Vagueness (e.g., "heap"):** While the *definition* might be vague, the *core referent* ("pile of stuff") is usually graspable. Your cases involve terms where the *core concept itself* resists isolation, not just its boundaries. Agreement on application is much stronger.
      *   **Semantic Deference (e.g., "quark", "chiffonade"):** Meaning relies on experts. Your cases have *no experts* – everyone is equally "ignorant" of an explicit definition, yet equally competent in use. The chain of deference loops back on the community itself.
      *   **Empty Terms / Fictional Reference (e.g., "phlogiston", "unicorn"):** These fail to refer to anything real. Your terms *do* refer successfully to observable patterns/phenomena within the practice (correct dialect usage, presence/lack of voice, convincing professional demeanor).
      *   **Meaning Skepticism / Internalism:** Focuses on individual mental states. Your focus is on the *public, functional success* of the vocabulary despite the lack of explicit individual or collective grounding. The meaning *is* public, but it resides entirely in the *pattern of use itself*.
      *   **Family Resemblance (Wittgenstein):** Gets close ("voice" is a prime candidate). However, family resemblance describes *how* a concept holds together without a single essence. Your phenomenon highlights the *functional stability and normative enforcement* of the concept *despite* this lack of essence or explicit definition *and* the absence of deferential grounding. It emphasizes the *social practice sustaining the resemblance cluster*.

  3.  **Is it One Phenomenon?** Yes, fundamentally. All three instances share the core structure: **Socially Constituted Meaning through Enacted Practice.**
      *   **The Dialect Word:** Meaning is constituted by the community's shared, implicit rules of application, reinforced through mutual correction. The "meaning" *is* the pattern of sanctioned use within specific contexts.
      *   **"Voice":** Meaning is constituted by the shared, implicit recognitional capacities developed and calibrated within the workshop practice. Participants learn to *see* "voice" through exposure and correction, not definition. The concept *is* the practice of identification and discussion around it.
      *   **The Impostor:** Demonstrates that mastery of the *enacted practice* (using the vocabulary in contextually appropriate ways) *is sufficient* to be recognized as possessing the meaning/competence. The meaning resides in the *external performance conforming to social expectations*, not internal understanding. He masters the "language game" of the profession.

  4.  **The Edges: What Falls Outside?**
      *   **Terms with explicit definitions:** If the community *can* point to an essence or necessary/sufficient conditions (even if complex), it falls outside.
      *   **Terms relying on semantic deference:** If meaning requires pointing to an expert or foundational text/person, it falls outside.
      *   **Purely private languages:** If the term's use and correctness are not publicly verifiable/enforceable, it falls outside. Your phenomenon is inherently public and social.
      *   **Terms where disagreement is fundamental:** If the community fundamentally disagrees on core applications *and* cannot enforce norms, stability collapses. Your cases show strong normative agreement *in practice* despite definitional inability.
      *   **Terms referring to simple sensory data (e.g., "red"):** While ostensive definition might be involved, these often rely less on complex social calibration for core meaning (though cultural aspects exist). Your cases involve complex, practice-embedded concepts.

  5.  **Can a Community Mean Anything Without a Base?** **Yes, absolutely.** This is the crux of your observation. Meaning emerges from the *dynamic network of mutual calibration, correction, and patterned use within a shared practice*. It's an emergent property of the social system engaged in the "language game." The "anchor" isn't a definition or an expert; it's the *ongoing, self-reinforcing practice itself*.

  6.  **What to Call It?**
      *   **Most Precise Established Label:** **Practice-Constituted Meaning** (drawing heavily on Wittgenstein's *language games* and *meaning as use*, filtered through Social Externalism and emphasizing the *enacted* nature). This highlights that the meaning *is* the socially regulated pattern of use within a specific form of life/practice.
      *   **Alternative/Descriptive Labels:**
          *   **Enacted Semantic Normativity:** Emphasizes the normativity (right/wrong use) arising purely from practice.
          *   **Distributed Semantic Competence:** Emphasizes that the "knowledge" of meaning is distributed across the community's interactions, not held explicitly by any individual. (Links to Distributed Cognition).
          *   **Hermeneutic Holism (in practice):** Meaning is understood only within the whole web of practices and interactions of the community (though "hermeneutic" often implies interpretation more than norm enforcement).
      *   **For Your Novelist's Purposes:** **Ungrounded Practice** or **The Anchorless Vocabulary** are evocative, non-technical terms capturing the core puzzle you perceive.

  **In essence:** You've identified **meaning as a self-sustaining social practice**. The vocabulary works because the community *enacts* its meaning through shared, mutually calibrated use and enforcement. The stability comes not from a foundational definition or expert, but from the robustness of the *social feedback loop* governing the term's application within its relevant context. It's meaning held aloft by the collective dance of its users, not anchored to any solid ground beneath. This is not just vagueness or deference; it's a distinct mode of linguistic life where the *doing* *is* the knowing.
