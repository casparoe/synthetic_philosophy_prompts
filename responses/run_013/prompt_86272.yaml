  We are going to map the logical space of interpretations of the common prior assumption (CPA) and the agreement theorem. The agreement theorem states: if two agents have a common prior, update by conditionalization, and their posteriors are common knowledge, then their posteriors must be equal.

  The goal is to create a decision tree that helps someone figure out which position they hold. The tree will have 7-8 branch nodes (questions) and up to 12 leaves. Each branch node is a concrete case that can be answered without knowing the position. Each leaf will be labeled with a position (if one exists) or described as unnamed, and include one sentence on the commitment that position has the hardest time defending.

  The positions mentioned in the problem:
  1. The common prior is a claim about how the world actually works (so real disagreement must come from different evidence).
  2. The common prior is a requirement of rationality (to be rational is to base beliefs only on the common information).
  3. The common prior is a modelling device without normative force.

  We also have prior questions:
  - What is a prior? (psychological fact vs. bookkeeping for evidence)
  - Can agents with different state spaces have a common prior?
  - Is the agreement theorem about common knowledge or rationality?

  We'll structure the tree by starting with the most fundamental disagreements and building up.

  Key cases to use as branch nodes:
  - Two traders betting against each other despite knowing each other's beliefs (the no-trade theorems).
  - Two doctors disagreeing about a diagnosis, each knowing how the other reasons.
  - Two economists with different life experiences (like hyperinflation) leading to different priors.
  - Two agents who don't even agree on what states are possible.

  We'll design the tree to split the positions as follows:

  First, we must address whether the common prior is even a meaningful concept for the agents in question.

  Branch Node 1: Consider two agents who do not share the same set of possible states of the world. For example, one agent considers a state possible that the other does not. Can these agents meaningfully have a common prior?
  - Option A: Yes, they can. The common prior must be defined on a common state space that includes all the states either considers possible, and we extend their beliefs to that space.
  - Option B: No, they cannot. A common prior requires that they agree on what states are possible.

  If they don't share the same state space, then the common prior assumption is not defined. So Option B is the standard view. But some might argue for Option A by constructing a larger state space. This branch separates those who think the common prior is only defined for agents with the same state space from those who think it can be extended.

  Branch Node 2: What is the nature of the prior? Consider an agent who forms a belief about a coin flip. Is the prior:
  - Option A: A psychological fact about the agent's degrees of belief before any evidence (so it's a real mental state at a point in time)?
  - Option B: A bookkeeping device that captures how the evidence the agent has received constrains the possible worlds (so it's a way to encode the impact of evidence, even if the agent never actually held that prior)?

  This splits the "psychological" view from the "bookkeeping" view.

  Branch Node 3: Consider two economists who have different prior beliefs about the likelihood of hyperinflation. One grew up in a country with hyperinflation and the other did not. They both update on the same current economic data. Is their disagreement rational?
  - Option A: Yes, because they have different life experiences that are part of their prior information. Rationality allows for different priors based on different initial information.
  - Option B: No, because rationality requires that they base their beliefs only on the common information (the current data) and a common prior that is shared. Their life experiences should be treated as private evidence that must be communicated and incorporated in a common prior framework.

  This distinguishes the view that priors can be different due to private evidence (but the common prior is a starting point before any evidence) from the view that rationality requires a common prior that is shared and that any private evidence must be incorporated via updating.

  Branch Node 4: Consider the two traders who know each other's beliefs and are still willing to bet. The agreement theorem says that if they have a common prior and common knowledge of posteriors, they cannot agree to disagree. But in reality, we observe such betting. How do you explain this?
  - Option A: The traders must not have a common prior. Their disagreement traces back to different prior beliefs (which may be due to different evidence).
  - Option B: The traders might have a common prior, but they do not have common knowledge of each other's beliefs. The common knowledge condition is very stringent and rarely met.
  - Option C: The agreement theorem is not about rationality; it's a mathematical result that holds under the assumptions, but in the real world, agents are not required to have a common prior to be rational.

  This branch helps separate the three main positions.

  Branch Node 5: Consider two doctors who disagree about a diagnosis. Each knows how the other reasons (i.e., each knows the other's likelihood function for the evidence) and they have the same evidence. However, they have different priors over the diseases. The agreement theorem says that if they had a common prior and common knowledge of posteriors, they would agree. But they don't. What is the problem?
  - Option A: They don't have a common prior. That's the only reason for disagreement.
  - Option B: They might have a common prior, but they don't have common knowledge of each other's posteriors. If they were to communicate until they achieve common knowledge, they would agree.
  - Option C: The common prior is not a requirement of rationality. Rationality does not require that they would agree even after exchanging all information.

  This is similar to the traders but focuses on the common knowledge condition.

  Branch Node 6: Is the common prior assumption a normative requirement of rationality? That is, must rational agents base their beliefs only on the common information (so that any private information must be incorporated via updating from a prior that is shared by all)?
  - Option A: Yes, rationality requires that agents have a common prior (which may be updated with private evidence). Without a common prior, disagreement is not rational.
  - Option B: No, rationality does not require a common prior. Agents can have different priors and still be rational.

  This directly addresses one of the positions.

  Branch Node 7: Consider two agents who share a common prior and know each other's beliefs, but one of them thinks the other is only probably rational (say, with 95% confidence). They update on this fact as well. Can they still agree?
  - This is a more complex case. The agreement theorem requires common knowledge of rationality and common knowledge of the posteriors. If one agent doubts the other's rationality, then common knowledge of rationality fails. The agreement theorem does not apply. But how do the positions react?
  - Option A: The agreement theorem still holds in the limit as they update on the fact that the other is rational with high probability, so they will approximately agree.
  - Option B: Without common knowledge of rationality, the agreement theorem does not apply, so they might continue to disagree even with a common prior.

  This tests the robustness of the agreement theorem and the role of common knowledge.

