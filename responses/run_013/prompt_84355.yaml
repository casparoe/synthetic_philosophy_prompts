  Okay, the user wants me to plan a two-hour session on the argument from illusion, hallucination, and disjunctivism for a cognitive science group. They've had frustrating debates where disjunctivism about experience vs. evidence got conflated, and they want to avoid pedagogical pitfalls. 

  First, I need to unpack their core frustrations: the "sliding between" disjunctivism types ruined their debate, and they suspect students absorb conclusions prematurely. Their mirror-clock example suggests they want freshness but also continuity - a single case that can demonstrate veridical/reflective/hallucinatory variants. 

  The audience's background is crucial here. Cognitive science grad students will instinctively reach for neural commonalities or treat perception as data processing. I must anticipate their misconceptions: equating illusion/hallucination (psychology backgrounds often blur them), seeing disjunctivism as unscientific (neuroscience wants unifying mechanisms), or dismissing it as verbal trickery (engineers crave operational definitions). 

  For structure, I'll build like a pyramid: start with phenomenology (what experience feels like), then introduce perceptual relativity before stating the argument. Disjunctivism mustn't be a knee-jerk rebuttal but a natural fork in the road when the common-kind assumption surfaces. The mirror-clock example is perfect - it lacks the baggage of bent sticks, allows clean comparison of direct/reflective cases, and can extend to hallucination (imagine the mirror reflects nothing). 

  Key traps to avoid: 
  - Never say "disjunctivism denies hallucinations exist" - that invites the "anti-science" charge. Instead: "It denies hallucinations share the same fundamental experiential structure as perceptions." 
  - When distinguishing experience/evidence disjunctivism, tie it to their fields: "Your EEG might show identical patterns for veridical and hallucinatory cases - that's an evidence-level common kind. But does that dictate what the experience itself fundamentally is?" 

  The check for understanding should force application, not regurgitation. A case like "augmented reality filters creating shared illusions" would reveal if they grasp the metaphysical vs. epistemic layers. 

  Finally, I'll explicitly bracket neural correlates and representational theories. This preserves the philosophical puzzle without oversimplifying - exactly what the user wants when they say "clean puzzle over fake completeness."
answer: |-
  ## Session Plan: Arguments from Illusion/Hallucination & Disjunctivism for Cognitive Scientists/Engineers

  **Goal:** To expose students to the core dialectic, reveal the hidden assumption in traditional arguments, present disjunctivism as a substantive (not verbal) alternative, and clarify the experience/evidence distinction. Foster understanding, not conversion.

  **Core Pedagogical Principle:** Build the common-kind view *from the argument itself*, making its appeal felt, *then* show disjunctivism as the point where one can reject a premise by rejecting the assumption. Avoid presenting disjunctivism as a starting point or mere denial.

  **Carrying Example: The Mirror Clock**
  *   **Veridical:** You look directly at a round wall clock showing 3:00. You see a round clock showing 3:00.
  *   **Reflective (Illusion):** You look at the *same* clock via a slightly warped funhouse mirror. The reflected clock *appears* oval and shows (due to distortion) what looks like 2:58. Subjectively, this experience *can be indistinguishable* from seeing an actual oval clock showing 2:58 directly.
  *   **Hallucination:** (Later) You vividly hallucinate a round clock showing 3:00, perhaps due to fatigue or a neurological glitch. Subjectively indistinguishable from the veridical case.
  *   **Why it works:**
      *   Fresh(er) & relatable (vs. bent sticks).
      *   Clearly separates object (clock) from its image/proxy (reflection).
      *   Allows for subjective indistinguishability in both illusion (reflection) and hallucination cases relative to veridical.
      *   Easily extends to hallucination.
      *   Avoids ambiguity of lines/drawing (Müller-Lyer).
      *   Highlights the "gap" between appearance and reality caused by an intervening medium (mirror) or state (hallucination).

  ---

  ### Session Sequence (110 mins + 10 min buffer)

  **I. Groundwork: What are we talking about? (20 mins)**
  *   **A. Phenomenology First (5 mins):** Start with *what it's like*. "Close your eyes, imagine seeing this room right now. What is present in your conscious visual field? Colors, shapes, objects? That's perceptual experience – how the world seems to you, sensorily, in the moment." *Use Mirror Clock: Describe the veridical experience.*
  *   **B. Perceptual Relativity (The Setup) (10 mins):** "Our senses aren't perfect receptors. Things can appear differently than they are." *Use Mirror Clock:*
      *   *Reflective Case:* Describe seeing the oval/2:58 appearance via mirror. Emphasize: The clock *itself* hasn't changed (it's round/3:00). The mirror distorts/intervenes. What you visually experience is *different* from the actual state of the object. This is an **Illusion** (object present, appearance non-veridical).
      *   *Hallucination Case (Brief Intro):* "Now imagine, without any clock or mirror present, you suddenly have an experience *as of* a round clock showing 3:00, just like the veridical one. This is a **Hallucination** (no relevant object present).
  *   **C. Subjective Indistinguishability (SI) (5 mins):** Critical Concept! "Crucially, for the person *having* the experience: the experience of seeing the clock directly (veridical), seeing its distorted reflection (illusion), and hallucinating the clock (hallucination) can be *subjectively indistinguishable*. From the inside, they feel the same. You couldn't tell, just by the feel of the experience alone, which one you were having." *Hammer this home with the Mirror Clock cases.*

  **II. The Argument from Illusion (AfI) - Building the Common-Kind View (25 mins)**
  *   **A. Stating the AfI Step-by-Step (Using Mirror Clock) (15 mins):**
      1.  **Phenomenal Fact:** In the reflective (illusion) case, you have an experience *as of* an oval clock showing 2:58.
      2.  **Relativity Fact:** The *actual* clock (the only object present) is round and shows 3:00. It is *not* oval/showing 2:58.
      3.  **Therefore (Conclusion 1):** What you are immediately aware of in your experience (the oval, 2:58 appearance) cannot be the actual clock itself (round, 3:00). You are directly aware of *something else*.
      4.  **SI Leverage:** Since the reflective (illusion) experience is SI from the veridical experience, *whatever* you are directly aware of in the illusion case (the oval/2:58 appearance) must *also* be what you are directly aware of in the veridical case (where it appears round/3:00). Why? Because the experiences feel the same internally!
      5.  **Therefore (Conclusion 2 - Common-Kind):** Even in veridical perception, you are not *directly* aware of the mind-independent clock. You are directly aware of a subjective sensory item (a "sense-datum", "appearance", "percept" – *label neutrally*), which *represents* the clock (correctly in veridical, incorrectly in illusion). Veridical, Illusion, and (by extension via SI) Hallucination share a common experiential core: awareness of this subjective item.
  *   **B. Making the Pull Felt (10 mins):** "The argument seems compelling, right? The SI premise feels hard to deny. If two experiences feel identical, how could their fundamental structure be different? Doesn't neuroscience suggest similar brain states underlie SI experiences? This leads naturally to the **Common-Kind Assumption (CKA)**: Veridical perceptions, illusions, and hallucinations are, at their core, the same *type* of mental state or event – they share a common experiential nature, differing only in their causal origins and how well they match the world."

  **III. Hallucination & The Deepened Problem (10 mins)**
  *   **A. Argument from Hallucination (AfH) (5 mins):** "Hallucination intensifies the argument. In hallucination (e.g., vivid clock hallucination), there is *no relevant object* present at all. Yet, you have an experience SI from veridical perception. Therefore, what you are directly aware of *cannot* be a mind-independent object (there isn't one!). Given SI, what you are directly aware of in hallucination must be the same *kind* of thing you are directly aware of in veridical perception. **CKA reinforced.**"
  *   **B. The Challenge (5 mins):** "The AfI/AfH + CKA seem to force a view where perception is always mediated by internal representations/sense-data. Direct awareness of the world is impossible. This is the **Problem of Perception**."

  **IV. Introducing Disjunctivism - The Fork in the Road (25 mins)**
  *   **A. Rejecting the Leverage (The Core Move) (10 mins):** "Disjunctivism says: **Stop right there!** The move from SI in the illusion/hallucination case to the nature of the veridical experience is invalid. Just because two experiences are subjectively indistinguishable *to the subject*, it does *not* follow that they share the same fundamental metaphysical nature or structure. The veridical case might be fundamentally different – a state of genuinely being perceptually related to the mind-independent clock. The illusion/hallucination cases are different *kinds* of states that merely *masquerade* as that relation from the inside. Hence, **Disjunctivism about Experience**: Veridical perception is one *fundamental kind* of experiential state (direct openness to the world); illusion and hallucination are *different fundamental kinds* of states (which lack this direct relation), even if they are SI from veridical perception sometimes."
  *   **B. Revisiting Mirror Clock with Disjunctivism (5 mins):**
      *   *Veridical:* Your experience *is* the state of seeing the actual round/3:00 clock. Its nature is constituted by that relation.
      *   *Reflective (Illusion):* Your experience is *not* seeing the clock (you see its reflection, which causes an experience SI from seeing a clock). Its nature is *not* constituted by a relation to the clock-as-it-appears.
      *   *Hallucination:* Your experience is a different state entirely, caused internally, SI from seeing a clock.
  *   **C. Disjunctivism about Evidence (Crucial Distinction) (10 mins):** "THIS IS WHERE CONFLATION HAPPENS! Disjunctivism about *Experience* (above) is a claim about the *metaphysical nature* of the conscious state. **Disjunctivism about Evidence** is a different, often related, claim: that the *epistemic basis* or *justification* you have in the veridical case is different in kind from what you have in the non-veridical case, *even when SI*. Why? Because in the veridical case, your justification might essentially involve the actual presence of the object, whereas in illusion/hallucination, it doesn't. You *can* hold one without the other, but they often go together. **Key: Experience disjunctivism makes evidence disjunctivism plausible, but they address different questions (what *is* the state vs. what *justifies* belief).** *Prevent Conflation:* Constantly ask "Is this a claim about what the experience *is* (metaphysics) or about what it *provides* (epistemology)?"

  **V. Addressing Misconceptions & Objections (Integrated Throughout & Explicitly Here)**
  *   **"Illusion/Hallucination are the same."** *Head off in Section I.B/C:* Clearly define and contrast them early (object present/appearance wrong vs. no object). Use Mirror Clock: Reflection = Illusion (object present), imagined no-clock case = Hallucination. *Temptation:* "But both are wrong!" *Move:* "Yes, both non-veridical, but *metaphysically different situations* – one involves an object causing a distorted appearance, the other involves no object. This difference *might* matter for the nature of the experience."
  *   **"Disjunctivism is just Naive Realism rebranded."** *Head off in Section IV.A:* Acknowledge similarity (direct perception) but emphasize the *negative* claim is crucial: denying the SI -> Common-Kind inference. Naive realism often *fails* to address illusion/hallucination; disjunctivism explicitly *confronts* them by denying they share the veridical experiential kind. *Temptation:* "So you just believe you see things directly?" *Move:* "Yes, for veridical cases, but the *key innovation* is rigorously denying that SI forces veridical cases to be the same as non-veridical ones internally. It's naive realism *plus* a specific account of illusion/hallucination as different."
  *   **"AfI/AfH *prove* sense-data."** *Head off in Section II & IV:* The AfI/AfH only *force* sense-data *if* you accept the SI -> Common-Kind inference. Disjunctivism shows this inference is rejectable. *Temptation:* "But the argument shows you *must* be seeing *something* else!" *Move:* "In illusion, you *are* seeing *something* else (e.g., the reflection itself, light patterns)! But disjunctivism says what's crucial is that the *experiential state* you are in when seeing the reflection is fundamentally *different in kind* from the state you are in when seeing the clock directly, even if they feel similar. You don't need an internal object *in addition* to the world."
  *   **"Disjunctivism is anti-scientific."** *Head off in Section IV & throughout:* Emphasize disjunctivists *accept* SI and seek neural/psychological *correlates* for it. Their claim is that SI does not entail *metaphysical sameness* at the level of conscious experience. Science finds mechanisms for SI; philosophy asks if SI exhausts the nature of the state. *Temptation:* "But fMRI might show identical patterns!" *Move:* "Exactly! And disjunctivists agree it likely would! Their point is: that neural commonality explains the *indistinguishability*, but it doesn't dictate that the *conscious state itself*, in its essential nature, must be identical. The veridical state's nature might essentially involve external objects in a way the neural correlate description doesn't capture." *Connect to Evidence Disjunctivism:* "Science tells us *how* SI happens; disjunctivism is about *what SI states fundamentally are*."
  *   **"The debate is merely verbal."** *Head off by structure of dialectic:* The entire sequence shows it's substantive. The AfI/AfH have a logical structure relying on SI -> CKA. Disjunctivism identifies that step as the contentious premise requiring defense. *Temptation:* "You're just defining 'experience' differently!" *Move:* "The disagreement is about what *follows* from subjective indistinguishability. Does SI guarantee sameness of fundamental kind? The common-kind theorist says 'Yes, inevitably.' The disjunctivist says 'No, that needs argument – SI could arise from different underlying states.' This is a deep metaphysical disagreement about the nature of conscious perception, not wordplay."

  **VI. Check for Understanding (10 mins)**
  *   **Question 1:** "Imagine a new case: **Augmented Reality Glasses.** You look at a real, plain white coffee mug through glasses that superimpose a detailed, animated dragon wrapping around it. The experience is SI from seeing a real dragon wrapping a mug. According to the *common-kind* view, what must be true about the fundamental nature of this experience compared to a veridical experience of a real dragon? According to *disjunctivism about experience*, what could be true?"
      *   *Good Answer (CK):* "Both experiences share the same core experiential state: awareness of a dragon+mug sense-datum/appearance. The difference is just causal origin (real dragon vs. AR glasses)."
      *   *Good Answer (Disj):* "The veridical dragon experience is fundamentally a state of seeing a real dragon. The AR experience is a fundamentally different kind of state: seeing a mug, *plus* having an electronically generated overlay causing an experience SI from seeing a dragon. The mug-experience + overlay isn't the same *type* of state as seeing a dragon, even though they feel the same." (Might mention evidence disjunctivism too).
      *   *Verbal Answer:* "Common-kind says they're the same, disjunctivism says they're different." (Lacks explanation of *what* is same/different and *why* according to each view).
  *   **Question 2:** "A scientist says: 'We found identical patterns of neural activity when subjects have a veridical perception of a red apple and when they have a hallucination of a red apple, confirming the experiences are fundamentally the same.' How might a disjunctivist (about experience) respond without denying the science?"
      *   *Good Answer:* "The disjunctivist agrees the neural patterns are identical, explaining the subjective indistinguishability. However, they deny that identical neural patterns *entail* identical fundamental natures of the conscious experiences. The veridical state's nature might essentially involve the actual presence of the apple, which the neural description alone doesn't capture. The hallucination state, while neurally similar, lacks this essential external component, making it a different kind of conscious state, even if indistinguishable to the subject."
      *   *Verbal Answer:* "Disjunctivism says they are different experiences." (Fails to engage with the neural data or explain how difference is compatible with it).

  **VII. What We're Bracketing (Stated Early & Reiterated)**
  *   **Why?** To maintain focus on the core dialectic and avoid false closure/complexity. Acknowledge these exist but are for later.
  *   **1. Specific Theories of the Non-Veridical State:** What *positive* account disjunctivism gives for illusion/hallucination (e.g., intentionalism, pure qualia?).
  *   **2. The "Highest Common Factor" Argument:** Detailed defense of the SI -> CKA inference.
  *   **3. Full Defense of Naive Realism:** How disjunctivism handles complex veridical cases (e.g., seeing aspects, causality).
  *   **4. Detailed Representationalist Alternatives:** Sophisticated common-kind views beyond simple sense-data.
  *   **5. The Hard Problem of Hallucination:** Precisely how disjunctivism accounts for the hallucinatory experience's phenomenology without an object.
  *   **Closing:** "We've seen how the arguments from illusion and hallucination, relying on subjective indistinguishability, seem to force a common-kind view. Disjunctivism challenges this by arguing that indistinguishability doesn't entail sameness of fundamental kind. It proposes a radically different conception of veridical perception and denies that non-veridical experiences reveal its true, hidden nature. The debate hinges on whether the Common-Kind Assumption is mandatory. You now have the map; the exploration continues."

  ---
  **Key to Success:** Be relentlessly clear about the *logical structure* of the AfI/AfH. Make the SI -> CKA inference step explicit *as the crucial pivot point*. Present disjunctivism *as the rejection of that specific inference*, not as a denial of illusion/hallucination or SI. Constantly distinguish "what the experience is like" (SI) from "what the experience fundamentally is" (metaphysical kind). Use the Mirror Clock consistently. Be patient with the experience/evidence distinction – flag it repeatedly. Good luck!
