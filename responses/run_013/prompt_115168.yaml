prompt: |-
  Hi, I'm in my third year and taking a module on cultural evolution — we've just finished the week on memes and I've got an essay due where I have to compare two theories rather than just describe them, and I keep going round in circles, so I'd basically like you to write me a model answer I can work from.

  The two things I have to compare are Dawkins' original meme idea and Sperber's cultural attraction / epidemiology of representations approach. Our lecturer framed the difference roughly like this: on the meme view, the interesting fact is that memes get copied faithfully enough for selection to bite, and that copying fidelity is what does the explaining; on Sperber's view, the fidelity is itself the thing that needs explaining, and what's really doing the work is that representations get transformed as they pass through minds yet keep getting pulled back towards the same forms — the attractors do the work, not the replicas. I think that's about right, but I can't tell whether it's a genuine disagreement or just two ways of describing the same drift.

  What I want from the essay: which of the two actually earns its keep as an explanation of why some cultural items are stable and others aren't, and whether they're even rivals, or whether one can be folded into the other without loss. Please test both on a concrete case instead of staying abstract — the one I've been using is playground rhymes and jokes that turn up in basically the same shape in schools with no contact with each other, but use whatever case makes the difference clearest.

  There's also an objection I can't handle. Someone in my seminar said cumulative culture (tools getting better over generations, the ratchet effect, etc.) only works because transmission is high-fidelity — otherwise you lose what you've gained — and that this sounds like it puts us back on the meme side, since Sperber makes copying out to be very lossy and reconstruction-heavy. Is that a fair hit, or is it conflating fidelity of the item with fidelity of the mechanism? Deal with it properly rather than hand-waving it away.

  I need a conclusion, not a survey — say which framework you'd defend and why, and what the other one still gets right. No need for references or a reading list, it's definately not a lit review. Could you write it in British English please (I keep getting pulled up on 'analyze' vs 'analyse').
