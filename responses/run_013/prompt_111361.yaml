answer: |-
  Here's a rigorous translation of each historical cyclical model into dynamical systems/control theory terms, followed by a residue analysis and a deconstruction of the "cyclical vs linear" dichotomy.

  ---

  ### **1. Polybius' Anacyclosis**
  **Core Claim**: Fixed sequence: Kingship (Monarchy) → Tyranny → Aristocracy → Oligarchy → Democracy → Ochlocracy (Mob Rule) → *Collapse* → Kingship...  
  **Dynamical Translation**:  
  - **State Space**: 6-dimensional vector **S** = [*Legitimacy (L), Elite Cohesion (C), Mass Satisfaction (M), Institutional Stability (I), Elite Greed (G), Populist Rage (R)*].  
  - **Dynamics**: A **limit cycle** in **S**-space. Transitions are triggered by **bifurcations** when key parameters cross thresholds:  
    - *Monarchy → Tyranny*: Drift in **G** (greed) destabilizes **L** (legitimacy) → Hopf bifurcation.  
    - *Ochlocracy → Collapse*: **R** (rage) and **M** (mass dissatisfaction) exceed critical value → Homoclinic explosion destroying **I** (institutions).  
  - **"Reset" to Kingship**: After collapse (**I** ≈ 0), the system enters a **transient chaos regime** → falls into the basin of attraction of a new "Kingship" fixed point (low-dimensional attractor with high **L**, **C**, **M**).  
  - **Autonomy**: Closed system (no external inputs). Noise (e.g., wars, plagues) can accelerate phase transitions.

  ---

  ### **2. Ibn Khaldun's Dynastic Cycle**
  **Core Claim**: *Asabiyyah* (group solidarity) builds in austere conditions → conquest → prosperity erodes *asabiyyah* → collapse → new group with high *asabiyyah* takes over.  
  **Dynamical Translation**:  
  - **State Variables**: *Asabiyyah (A)*, *Wealth/Luxury (W)*, *External Threat (T)*.  
  - **Dynamics**:  
    - **dA/dt** = -α⋅A⋅W + β⋅T (solidarity decays with wealth, grows with threat)  
    - **dW/dt** = γ⋅A - δ⋅W (wealth grows with solidarity, decays naturally)  
    - **T** is exogenous noise/stochastic forcing (environmental challenges, rival groups).  
  - **Hysteresis**: High **A** enables conquest (phase shift to high **W**). High **W** then suppresses **A**.  
  - **Collapse & Takeover**: When **A** < **A_critical**, the state becomes unstable. A *new system* (fresh group) with high **A₀** and low **W₀** invades the state space → **phase jump**.  
  - **Basins of Attraction**: Multiple equilibria exist (e.g., "tribal austerity" vs. "imperial decadence"). Transitions occur when **A** crosses instability thresholds.

  ---

  ### **3. Spengler's Organic Cycles**
  **Core Claim**: Cultures are superorganisms with predetermined lifecycles: Spring (birth) → Summer (maturity) → Autumn (decline) → Winter (death).  
  **Dynamical Translation**:  
  - **State Space**: *Cultural Vitality (V)*, *Institutional Rigidity (R)*, *Creative Output (C)*.  
  - **Dynamics**: **Non-autonomous system** with slow parameter drift:  
    - **dV/dt** = -k⋅R⋅V (vitality drained by rigidity)  
    - **dR/dt** = λ (rigidity increases monotonically over time)  
    - **dC/dt** = f(V) - g(R) (creativity peaks when V high, R low).  
  - **Trajectory**: **Monotonic drift in R** forces the system along a **heteroclinic orbit** from high-V/low-R (Spring) → low-V/high-R (Winter).  
  - **"Death"**: Attractor at (**V**=0, **R**=max, **C**=0). **No cycle**: This is a **non-reversible trajectory** (rigidity **R** acts as a *hysteresis parameter* with no reset mechanism).  
  - **Irreversibility**: Entropic growth of **R** makes return impossible → not a cycle but a *transient with decay*.

  ---

  ### **4. Toynbee's Challenge-Response**
  **Core Claim**: Civilisations rise by solving challenges via "creative minorities." Decline occurs when elites fail to respond, leading to loss of legitimacy.  
  **Dynamical Translation**:  
  - **State Variables**: *Elite Creativity (E)*, *Societal Legitimacy (L)*, *Challenge Intensity (C)*.  
  - **Dynamics**:  
    - **Stochastic forcing**: **C** ~ Poisson process (random challenges).  
    - **Response mechanism**: Δ**L** = h(**E**)⋅Θ(**C** - **C_threshold**) (legitimacy change depends on elite creativity if challenge exceeds threshold).  
    - **dE/dt** = -μ⋅E + σ⋅L (creativity decays but is sustained by legitimacy).  
  - **Failure Modes**:  
    - If **E** < **E_critical** when **C** > **C_threshold** → collapse (runaway **dL/dt** < 0).  
    - **Hysteresis**: Low **L** reduces **E**, making recovery less likely.  
  - **Cyclicity?**: Not inherent. Decline is a **path-dependent cascade failure**. Stochastic challenges + decaying **E** make collapse probable but not periodic.  

  ---

  ### **Residue Report: What Doesn't Translate**  
  | Historian       | Clean Fit                                                                 | Distorted Fit                                                                 | Uncapturable Element                                                                                               |  
  |-----------------|---------------------------------------------------------------------------|-------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------|  
  | **Polybius**    | Limit cycle structure; bifurcations at thresholds.                        | "Reset" after collapse isn't dynamical—requires external chaos (not modeled). | **Teleology**: Implies constitutional forms have "natural" successors. Dynamical systems lack normative direction. |  
  | **Ibn Khaldun** | Hysteresis loop (A⇄W); basins of attraction; exogenous takeover events.   | "Takeover" is discrete—modeled as phase jump, not continuous flow.            | **Moral dimension**: Luxury (*W*) as *inherently* corrosive. Dynamics are amoral; decay requires parameter tuning. |  
  | **Spengler**    | Irreversible trajectory (R drift); entropic decay.                        | "Seasons" imply periodicity; actual model is monotonic drift → **not cyclic**.| **Vitalism**: "Destiny" of cultures as superorganisms. Math can't capture metaphysical life/death without anthroporphism. |  
  | **Toynbee**     | State-dependent stochastic forcing; legitimacy-creativity feedback.       | "Withdrawal/return" of elites—no clear dynamical analog.                     | **Agency**: "Creative minorities" imply free will. Control theory needs external inputs to model choice.            |  

  **Key Uncapturable Elements**:  
  - **Normative Decline**: Historians describe "decay" (luxury, rigidity) as intrinsically bad. Dynamics only model stability loss.  
  - **Historicity**: Spengler/Toynbee treat cultures as unique entities with irreversible paths. Dynamical systems require generalized state variables.  
  - **Agency**: All models rely on human choices (elites, mobs). Control theory can add *inputs* (u(t)), but not endogenous agency.  

  ---

  ### **Deconstructing "Cyclical vs Linear"**  
  The dichotomy collapses into distinct mathematical properties:  
  1. **Periodicity** (Polybius) vs. **Transience** (Spengler):  
     - Polybius: Closed orbit → true cycle.  
     - Spengler: Heteroclinic trajectory → one-way drift.  
  2. **Autonomy** (Polybius, Spengler) vs. **Driven Systems** (Ibn Khaldun, Toynbee):  
     - Ibn Khaldun: Exogenous threats (**T**) and takeovers.  
     - Toynbee: Stochastic challenges (**C**).  
  3. **Reversibility** (Ibn Khaldun) vs. **Hysteresis/Entropy** (Spengler):  
     - Ibn Khaldun's *asabiyyah* can rebuild post-collapse (reversible).  
     - Spengler's rigidity **R** only increases (arrow of time).  
  4. **Basin Stability** (all): Cyclicality emerges from topology of attractors (e.g., Polybius' limit cycle vs. Toynbee's stochastic basin-hopping).  

  **Conclusion**: "Cyclical" models are either:  
  - **True cycles** (Polybius: closed orbits),  
  - **Hysteresis loops** (Ibn Khaldun: path-dependent reversals),  
  - **Stochastic cyclicity** (Toynbee: random walk in legitimacy space),  
  - **Not cycles at all** (Spengler: irreversible transients).  

  The framework exposes cyclicality as a *surface pattern* arising from deeper dynamical structures—none inherently require a "circular" view of time. Your vocabulary doesn't reject their models; it reframes their mechanics precisely. The residue lies where history exceeds mathematics: agency, meaning, and uniqueness.
