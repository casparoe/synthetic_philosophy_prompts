answer: |-
  Your pattern hits a deep nerve in decision theory—one that's often glossed over in standard models. What you're observing isn't just ambiguity aversion (à la Ellsberg) or Knightian uncertainty. It's **outcome-set uncertainty** (or **menu uncertainty**), a distinct phenomenon where the *space of possible outcomes* isn't fully known or bounded. Here's the carving:

  ### Core Distinction: Weights vs. Menu
  - **Known menu, unknown weights (probabilities)**:  
    Your flatmate accepts bets when outcomes are a *fixed, exhaustive set* (e.g., "lose £50 or gain £200"; "black or white ball from a 50/50 urn"). Uncertainty is only over *which outcome occurs*. This fits Savage acts or Anscombe-Aumann frames.  
  - **Unknown menu (unbounded or ill-defined outcomes)**:  
    She rejects bets where the outcome set isn't pre-specified (e.g., uncapped loss decided by an adversary; an urn with unknown *types* of balls). Here, she can't even *conceive* all possibilities—the state space isn't "closed."

  ### Why This Isn't Ambiguity Aversion or Knightian Uncertainty
  - **Ellsberg/Knight**: Focus on *probability* ignorance. The outcome set (e.g., red/black balls) is fixed; only likelihoods are vague. Your flatmate *accepts* these.  
  - **Your case**: The *outcome space itself* is indeterminate. She isn't averse to not knowing odds; she's averse to not knowing *what could happen*. As she says: "I don't know what I'd be ruling out."  

  ### Name Proposal: **Option-Set Ambiguity**  
  *Why this term?*  
  - **Option-set**: Emphasizes the menu of outcomes (not probabilities).  
  - **Ambiguity**: Signals it's distinct from risk, but broader than Ellsberg.  
  - *Edge cases*:  
    - **Covers**: Uncapped losses, hidden outcome dimensions (e.g., an urn that *might* contain non-ball objects), adversarial contingencies.  
    - **Excludes**: Standard probability ambiguity (known outcomes, unknown likelihoods).  

  ### Theoretical Anchors
  1. **Savage’s "Small Worlds"**: Your flatmate implicitly requires a *complete state space* (all contingencies listed). Unbounded bets violate Savage’s P2 (Sure-Thing Principle) by introducing "unforeseen consequences."  
  2. **Binmore’s "Large Worlds"**: She rejects bets where the decision problem isn't "small-world" representable—i.e., she can't list all states.  
  3. **Unforeseen Contingencies (Dekel/Lipman)**: Literally "not knowing what you're ruling out." This formalizes her intuition.  

  ### Is "Tiny Chance of Catastrophe" the Same?
  - **Yes, if the catastrophe is unforeseeable**: If she can't imagine the catastrophic outcome (e.g., "lose everything if a comet hits"), it’s option-set ambiguity.  
  - **No, if the catastrophe is a known outcome**: If she knows comet risk exists (even with unknown odds), it’s standard ambiguity aversion.  

  ### Why Operationalized Knightian Uncertainty Misses This
  Knightian uncertainty is typically reduced to ambiguity over probabilities in lab settings (e.g., "urn with unknown ratio"). Your case is *prior* to that: it questions whether the *categories* (colors, losses) are exhaustive. It’s uncertainty about the *ontology* of the decision problem.  

  ### Practical Implication
  This explains real-world aversion to open-ended contracts, adversarial negotiations, or poorly defined risks (e.g., "we’ll decide penalties later"). The fear isn’t high risk—it’s the *unknowable scope* of what’s at stake.  

  ### Caveat
  Don’t overextend the term. Rejection due to *resource limitations* (e.g., "I can’t afford any loss") isn’t option-set ambiguity—it’s a liquidity constraint. The key is *epistemic*: "I cannot specify all possible outcomes."  

  Your flatmate’s behavior reveals a foundational crack in subjective expected utility: it assumes agents can always define a comprehensive outcome space. When they can’t, standard models break. **Option-set ambiguity** names that crack.  

  *For your thesis*: Anchor this in critiques of Savage (e.g., Binmore 2008) or unforeseen contingencies literature. It’s not just "aversion"—it’s a meta-uncertainty about the model itself.
