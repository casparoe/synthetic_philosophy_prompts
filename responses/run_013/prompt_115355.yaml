prompt: |-
  I'm taking a course on ethics and public life and I've ended up with a practical assignment I actually care about. Next term I'm doing a placement with a small NGO that runs water projects in four countries, and my supervisor there asked me to write the gift-and-hospitality rule for field staff, since right now it's just "no bribes, use your judgement" and everyone hates it. Our field staff deal with offers constantly and the stakes are real — we get audited by a big funder, and my supervisor has to sign the rule off before it goes out.

  The hard part is that most of what gets offered is just ordinary social life. A village chief gives us a goat when the well is finished. A supplier offers to fly one of our engineers out to see the factory. A district officer invites two of our staff to his daughter's wedding. And customs always wants a "processing fee" to release the medical supplies.

  Can you turn the philosophy on corruption into a procedure my staff could actually run? A few things it has to do. It should give the questions to ask, in order, and say where the procedure stops with a no. It needs to take seriously that people mean at least three different things by corruption — abusing a public office for private gain, an agent quietly serving a third party's interest instead of the person they're acting for, and acting against the public interest even when nobody privately gains — because these pick out different cases, and the goat only looks obviously bad on one of them. It shouldn't pretend a blanket no-gifts norm is culturally neutral: I want it to separate what's just local colour from what genuinely travels, and to say which is which out loud instead of smuggling in a Western standard. And it should handle the fact that bribery is often not one bad apple's choice but a stable equilibrium, where everyone expects everyone else to pay, so the individual who refuses just loses — that changes what the rule can fairly demand of a person.

  Then run it on those four cases, tell me which of the answers will make my supervisor unhappy, and flag where the procedure has to hand the decision back to a human because it's a value call rather than a fact, since I have to admit that in the write-up. No reading list needed, I can't get to the library before it's due lol.
reasoning: |-
  Okay, let me unpack this user's request. They're an ethics student working on a real-world policy assignment for an NGO's field staff. The core challenge is translating philosophical concepts of corruption into practical decision-making procedures. 

  Hmm, the user clearly understands the complexities - they're aware that corruption manifests differently (public office abuse vs agent betrayal vs public harm), and that cultural context matters deeply. They're frustrated with the current vague "no bribes, use judgement" rule. Smart of them to recognize that bribery often functions as a system, not just individual choices. 

  The four test cases are well-chosen: the goat (cultural gift), factory visit (business hospitality), wedding (social event), and customs fee (extortion). Each probes different ethical boundaries. 

  I should avoid Western-centric assumptions. That village goat? In many cultures, refusing would cause grave offense. But that factory visit? Definitely creates obligation. Need to distinguish between relationship-building and undue influence. 

  For the procedure, a decision tree makes sense - but it must have escape valves for cultural nuance. Staff need clear "stop signs" (like the customs fee) but also "consult your supervisor" triggers when values conflict. 

  The customs case is easiest - it's classic extortion. But the wedding? That's tricky. If attendance is expected culturally but gifts are lavish... maybe set a value limit? No, better to assess purpose: is this about accessing officials or genuine community ties? 

  Ah! The key is making implicit expectations explicit. Instead of banning all gifts, define what makes one corrupt: Is there power imbalance? Is it transactional? Could it appear to influence? 

  My supervisor will hate that we allow some gifts. But blanket bans ignore reality. Better to require disclosure - that goat gets recorded as community property, not personal gain. 

  Must flag where human judgement is unavoidable. Like assessing whether a gift's scale is "culturally normal" - that's inherently subjective. Transparency becomes crucial there. 

  ...Done. The procedure should hold up to audit because it documents reasoning, not just outcomes. And by naming cultural factors instead of pretending neutrality, it actually becomes more defensible. 

  User's supervisor will grumble about the goat exception, but the public-interest test justifies it. And the customs refusal? That's the easy win. Overall, this should reduce staff anxiety while satisfying funders. Good assignment.
answer: |-
  Here’s a practical, philosophically grounded decision procedure for gifts/hospitality, designed for field staff realities. It prioritizes clarity, cultural nuance, and systemic awareness, with explicit "stop/no" points and flagged judgment calls.

  **Core Philosophy Embedded:**
  1.  **Focus on Harm & Power:** Prioritizes preventing *public harm*, *betrayal of duty*, and *exploitation of power imbalances* over rigid prohibition.
  2.  **Systemic Lens:** Acknowledges bribery as an equilibrium; the rule aims to *disrupt* it collectively without sacrificing staff safety/projects unreasonably.
  3.  **Cultural Nuance:** Distinguishes *genuine reciprocity/relationship-building* (cultural context) from *instrumental influence-seeking* (corruption that "travels").
  4.  **Three Corruption Types Handled:**
      *   **Public Office Abuse:** Focus on *public officials* involved, *private gain*, and *public harm*.
      *   **Agent Betrayal:** Focus on *conflict of interest* – who the giver *really* represents vs. who the staff member serves.
      *   **Public Harm:** The ultimate "stop" test, even if other boxes aren't clearly ticked.

  **The "GIFT" Decision Procedure:**

  1.  **G - GIVER: Who is offering this, and what is their role?**
      *   *Ask:* Is the giver a **Public Official** (government, regulator, customs, police, etc.) or someone seeking a **Decision/Advantage** from us (supplier, contractor, community leader requesting project changes)?
      *   *Stop & Decline (Hard No):* If **YES**, proceed immediately to Step 2. If **NO** (e.g., a random community member offering tea, a local friend inviting for dinner unrelated to work), it *may* be permissible – proceed to Step 4 cautiously. ***(Flags Public Office Abuse / Agent Betrayal risk)***

  2.  **I - INTENT & INFLUENCE: What is the *likely* purpose of the offer?**
      *   *Ask:* Is this primarily about **building/maintaining a positive relationship** (cultural norm, social glue) or is it clearly **linked to a specific past, present, or future decision, action, or favor** involving our work? Does it feel like an *exchange*?
      *   *Stop & Decline (Hard No):* If clearly **instrumental/linked to a decision/favor** (e.g., "Here's a gift, now approve that permit"). Proceed if ambiguous or seemingly relational. ***(Flags Agent Betrayal / Public Office Abuse core)***
      *   *Judgment Call Flagged:* Assessing "likely purpose" requires cultural understanding and context. Staff *must* consider local norms but also be wary of naive optimism.

  3.  **F - FUNCTION: Does this create a *Conflict of Interest* or *Undue Obligation*?**
      *   *Ask:* Could accepting this reasonably be seen as compromising my duty to the NGO, our beneficiaries, or the public good? Does it obligate me (or appear to obligate me) to the giver in a way that conflicts with my role? Does the *scale or nature* of the gift create an imbalance (e.g., a goat vs. a cup of tea; a factory visit vs. lunch)?
      *   *Stop & Decline (Hard No):* If **YES** (e.g., lavish gift, expensive trip, cash). If **NO** or minor, proceed to Step 4. ***(Flags Agent Betrayal / Public Harm core)***
      *   *Judgment Call Flagged:* Determining "undue obligation" or "appearance of conflict" is context-dependent (scale, culture, timing). When in doubt, lean towards "yes".

  4.  **T - TRANSPARENCY & TRANSFER: Can this be made transparent and/or transferred?**
      *   *Ask:* Can I **immediately and fully disclose** this offer/gift to my supervisor *before* accepting? Can the gift be **transferred to the NGO/community** (e.g., goat becomes a project asset/feast, invitation extended officially)?
      *   *Stop & Decline (Hard No):* If **NO** (cannot disclose/transfer). ***(Flags all corruption types - secrecy is a red flag)***
      *   *Proceed with Caution:* If **YES** (can disclose/transfer):
          *   **Disclose FIRST:** Get supervisor approval *before* accepting anything beyond trivial tokens (explaining context from Steps 1-3).
          *   **Transfer:** Gifts of material value become NGO/community property. Hospitality is accepted only if deemed essential for relationship-building *and* approved.
          *   *Judgment Call Flagged:* Supervisor decides based on disclosed context. "Essential relationship-building" is a value call involving cultural sensitivity vs. risk.

  **Mandatory Override: The Public Harm Test**
  *   *Stop & Decline (Hardest No):* **Even if you get through G-I-F-T**, if accepting the gift/hospitality would **directly or indirectly harm the public interest, our beneficiaries, or undermine the integrity/perception of the NGO's work**, you MUST decline. ***(Catches the "nobody gains but public loses" corruption type)***
  *   *Judgment Call Flagged:* Assessing "public harm" can be complex and requires weighing project impact against principle. **Consult supervisor immediately.**

  **Handling the "Stable Equilibrium" (e.g., Customs "Fees"):**
  *   The procedure **forces a "Stop & Decline" at Step 1 (GIVER = Public Official)** and often Step 2 (INTENT = clear exchange).
  *   **Acknowledge the Reality:** "We recognize refusing expected payments can cause delays or hardship. This is a systemic problem. Your refusal is crucial to changing the system. Report all demands immediately to your supervisor and HQ. The NGO will support you and pursue collective solutions (e.g., advocacy, bulk clearance processes). You are not alone."

  **Running the Cases:**

  1.  **The Village Chief's Goat (Well Completion):**
      *   **G:** Community Leader (Requesting future advantage? Maybe, but primarily symbolic). *Proceed.*
      *   **I:** Likely **Relational/Celebratory** (cultural norm marking success/gratitude). *Proceed.*
      *   **F:** Scale (goat) could create *appearance* of obligation. *Judgment Call.*
      *   **T:** **YES!** Disclose & Transfer. Chief informed goat is for community feast/project asset. NGO accepts on behalf of community.
      *   **Public Harm Test:** Refusing could damage crucial community relations, harming future work. Accepting transparently/communally likely *serves* public interest.
      *   **Result:** **Accept with Disclosure & Transfer.** Supervisor might grumble about "setting precedent" but the transparent, communal approach mitigates risk and respects culture.

  2.  **Supplier's Factory Visit for Engineer:**
      *   **G:** **Supplier** (seeking decision/advantage - e.g., future contracts). *Stop & Decline (Hard No at Step 1).*
      *   *(Procedure stops - no need for further steps. INTENT is clearly instrumental, FUNCTION creates massive conflict/obligation, TRANSPARENCY doesn't erase the fundamental problem).*
      *   **Public Harm Test:** High risk of preferential treatment, undermining fair procurement = Public Harm. **Decline.**
      *   **Result:** **Hard No.** Supervisor should be happy. Clear bribe/undue influence attempt.

  3.  **District Officer's Daughter's Wedding Invitation (2 Staff):**
      *   **G:** **Public Official.** *Proceed to Step 2.*
      *   **I:** **Ambiguous.** Could be relational (cultural expectation) *or* instrumental (currying favor). *Judgment Call - high risk, lean towards instrumental.*
      *   **F:** Attendance creates **significant obligation/appearance of coziness** with a key official. Scale (event) and nature (personal/family) are high-risk. *Stop & Decline (Likely Hard No at Step 3).*
      *   **T:** Disclosure possible, but transfer not applicable. Doesn't negate Step 3 risk.
      *   **Public Harm Test:** High risk of perceived favoritism or future expectations = Public Harm potential. **Decline.**
      *   **Result:** **Decline.** Politely explain NGO policy. Send a modest *official* gift from the NGO (if culturally appropriate) to maintain relations without personal obligation. Supervisor might be unhappy if relationships are tense, but the procedure justifies the "no" based on risk and conflict.

  4.  **Customs "Processing Fee" for Medical Supplies:**
      *   **G:** **Public Official** (Customs). *Stop & Decline (Hard No at Step 1).*
      *   *(Procedure stops. Clear public office abuse for private/corporate gain).*
      *   **Systemic Note:** Follow "Stable Equilibrium" protocol: Refuse, report immediately to supervisor/HQ for support/systemic action. Do not pay.
      *   **Public Harm Test:** Paying perpetuates corruption, diverts funds, undermines rule of law = Direct Public Harm. **Absolute No.**
      *   **Result:** **Hard No.** Supervisor *must* support this and have HQ backup. This is the clearest "audit fail" risk.

  **Where Your Supervisor Might Be Unhappy:**

  1.  **The Goat (Acceptance):** Fear of setting a precedent, misinterpretation by auditors ("you accept gifts!"), or concerns about valuing livestock. **Mitigation:** The strict transparency/transfer requirement and public interest justification are key. Frame it as *community asset acquisition*, not a *personal gift*.
  2.  **The Wedding (Decline):** If the District Officer is powerful and relationships are fragile, the supervisor might fear fallout. **Mitigation:** The procedure shows a reasoned "no" based on high risk, offers an alternative (modest official gift), and prioritizes integrity over short-term convenience.
  3.  **Customs (Refusal):** Short-term project delays caused by refusal will be frustrating and costly. **Mitigation:** Emphasize the NGO's *systemic responsibility* to refuse (mandated by funders/auditors) and the critical need for HQ support structures when staff follow the rule.

  **Explicitly Flagged Judgment Calls in the Procedure:**

  1.  **Step 2 (INTENT):** Assessing the "likely purpose" (relational vs. instrumental).
  2.  **Step 3 (FUNCTION):** Determining if the gift creates an "undue obligation" or "appearance of conflict," especially regarding scale/perception.
  3.  **Step 4 (T - Proceed with Caution):** Supervisor's judgment on whether hospitality is "essential for relationship-building" after disclosure.
  4.  **The Public Harm Test:** Determining if acceptance causes "direct or indirect harm to the public interest," especially in complex trade-offs.

  **Key Advantages for Your Supervisor/Auditors:**

  *   **Clear "Stop" Points:** Reduces ambiguity in high-risk scenarios (Public Officials, Suppliers).
  *   **Documented Reasoning:** Staff must articulate their reasoning through the steps, especially for judgment calls, aiding transparency and audit trails.
  *   **Systemic Approach:** Addresses the customs dilemma head-on with a support protocol.
  *   **Risk-Based:** Focuses energy on high-risk interactions while allowing harmless cultural engagement.
  *   **Defensible Culture-Sensitivity:** Explicitly allows for cultural norms *if* they pass the transparency/public harm tests, avoiding blanket Western prohibitions.

  This procedure gives staff a concrete method, rooted in the ethics of corruption, while honestly admitting where human judgment based on values (not just facts) is unavoidable. Good luck with your placement!
