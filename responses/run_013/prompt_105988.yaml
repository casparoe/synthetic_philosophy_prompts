prompt: |-
  I've been reading alot about convention — the David Lewis stuff — and trying to line it up with things I actually deal with as an engineer plus ordinary life, and my gut verdicts won't settle into a pattern. Here's where I land:

  - Driving on the right vs the left: clearly a convention, and obviously arbitrary, since half the world does it the other way.
  - Tabs vs spaces: convention I guess, though in a repo with a linter it feels more like a rule someone imposed than a convention.
  - Using port 443 for HTTPS: convention, or something close to it.
  - Tipping ~20% in the US: I want to call it a convention, but it feels different from which side of the road to drive on.
  - Not cutting in line: not a convention — that's just wrong, I have a reason to queue no matter what everyone else does.
  - How you dress for a job interview: not a convention, more of a trend, even though I do it because everyone else does.
  - The particular gesture a culture uses for "come here": convention, and arbitrary.
  - A team's "we deploy on Tuesdays" habit: convention? rule? just inertia?

  The one that keeps bugging me is queueing vs. port 443. If the whole office stopped queueing for coffee I think I'd still queue; but if nobody used 443 anymore I'd switch to whatever everyone else used without blinking. And yet I want to say both are conventions.

  Is there one principle that gets most of these, and what does it say about the ones I can't place? Does it force me to drop calling tipping a convention, or to stop treating interview-dress as a non-convention? Also curious what it predicts for a case I didn't list: a regularity that started as pure coordination (say, everyone driving on the right) but that most people now follow because they think it's morally required — convention or not?

  And since you're way more careful about this than I am: tell me how confident you are in whatever principle you land on, and flag the single point you're least sure about.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been reading David Lewis on conventions and are trying to apply it to real-life examples. Their examples range from driving rules to tipping customs, and they're struggling to categorize them consistently. The core issue seems to be distinguishing conventions from other types of norms, especially when there's a moral component or personal preference involved.

  The user mentions tipping and queueing as sticking points. They feel queueing is morally wrong to violate, while port 443 is purely arbitrary. That's a key insight. Lewis defines conventions as solutions to coordination problems where the solution is arbitrary. But once a practice becomes morally charged, like queueing, it might transition beyond convention. 

  The user also brings up a case where a convention starts as coordination but later acquires moral weight. This is crucial. Lewis's model doesn't account for norm evolution, so explaining this requires integrating theories from social psychology or moral philosophy. The user's engineering background suggests they value practical application, so using concrete examples like the deployment habit or dress codes would help.

  I need to check if the user's confusion about tabs vs spaces and linting rules stems from conflating enforcement with convention. Linters make it a rule, but the choice between tabs/spaces is conventional. Highlighting that distinction could clarify. Also, job interview attire as a trend versus convention—here, the lack of alternatives makes it more normative. 

  The user's deeper need might be a framework to categorize norms in their daily work and life. They might want to predict how practices evolve, especially in tech teams. Addressing the tipping example requires explaining social expectations versus true coordination problems. Tipping isn't arbitrary like driving sides; it's a social expectation with penalties, so it's more of a norm.

  For the moralized convention example, using driving rules that become moralized shows how conventions can shift. The principle should allow for this transition, acknowledging that the original coordination aspect remains, but new reasons emerge. The user's mention of confidence levels suggests they want transparency about where the model might be fuzzy, so admitting uncertainty about norm internalization is key.

  Overall, structuring the response around Lewis's criteria and extending it with norm internalization theory should cover most cases. Emphasizing the arbitrary nature and coordination problem solves many examples, while the tipping and queueing issues show where additional factors come into play. The user's examples are well-chosen, so mapping each to the framework systematically will provide clarity.
answer: |-
  You've hit on a fundamental tension in Lewis's theory—how conventions morph into norms, rules, or even moral imperatives. Your intuition about the difference between queueing and port 443 is spot-on and reveals a key boundary. Here's a principle grounded in Lewis, extended for real-world messiness:

  **The Lewis+ Principle:**  
  A regularity *R* is a **convention** if it meets these criteria:  
  1. **Arbitrary Alternatives:** Multiple *equally good* solutions exist (left/right driving, port 80/443).  
  2. **Coordination Problem:** *R* solves a recurring situation where individuals benefit by aligning behavior (avoiding collisions, enabling communication).  
  3. **Conditional Preference:** People prefer to follow *R* *because they expect others to follow it* (expectation-driven).  
  4. **Lack of Intrinsic Moral Force:** The reason for conformity is coordination—not inherent right/wrong (unlike queue-cutting).

  ---

  ### Applying the Principle to Your Cases:
  | **Your Case**              | **Convention?** | **Why?**                                                                 |
  |----------------------------|-----------------|--------------------------------------------------------------------------|
  | Driving left/right         | Yes             | Classic Lewis: Arbitrary, coordination-driven, expectation-based.      |
  | Tabs vs. spaces            | Yes*            | Arbitrary alternatives, coordination value (readability). Linter makes it a *rule*, but the *choice itself* is conventional. |
  | Port 443 for HTTPS         | Yes             | IANA assignments are coordinated arbitrations—pure convention.         |
  | Tipping ~20% in the US     | **No** (Norm)   | Not arbitrary (fixed % expected), not primarily coordination. Social *obligation* with penalties (shame, service refusal). |
  | Not cutting in line        | **No** (Moral Norm) | Intrinsic fairness/justice—you'd object even if others cut. Not expectation-driven. |
  | Dress for job interview    | **Borderline** (Social Norm) | Limited alternatives (suit ≠ t-shirt), driven by signalling, not pure coordination. Enforced by judgment, not coordination failure. |
  | "Come here" gesture        | Yes             | Arbitrary (finger curl vs. palm down), coordination-driven.              |
  | "Deploy on Tuesdays"       | Yes (if habitual) | Arbitrary (could be Wednesdays), coordinates team activity. If strictly enforced, becomes a *rule*. |

  ---

  ### Your Core Dilemma: Queueing vs. Port 443
  - **Queueing:** Starts as convention (coordinates fair access) but acquires **moral weight** (justice/fairness). You follow it *even if others abandon it* because violating it feels *wrong*, not just inefficient. It transcended convention.
  - **Port 443:** Purely instrumental. If everyone switched to port 8443, you'd switch instantly—no moral loss, just re-coordination.

  **This doesn't break Lewis—it shows conventions can evolve.** Queueing became a *norm* with intrinsic value. Port 443 remains a pure convention.

  ---

  ### Your Unlisted Case: Moralized Convention
  *"Driving on the right started as coordination, but people now follow because they think it's morally required."*  
  - **Lewis's View:** Still a convention. The moral belief is *mistaken* but stabilizes the pattern.  
  - **Refined View:** It's a **moralized convention**—a hybrid. The *origin* is conventional, but the *current reason* for adherence includes perceived duty. Lewis underplays this internalization.

  ---

  ### Confidence & Uncertainty
  - **High Confidence:** The core principle (arbitrariness + coordination + expectation-dependence) cleanly handles cases like driving, ports, gestures, and tabs/spaces.  
  - **Moderate Confidence:** Distinguishing tipping (norm) from queueing (moralized norm) based on intrinsic fairness vs. obligation.  
  - **Lowest Confidence:** **The line between "convention" and "rule."**  
    - Your "deploy on Tuesdays" example exposes this. Lewis sees enforced conventions as still conventions, but in practice, once codified (linter rules, legal penalties), they *feel* different.  
    - **My Stance:** If the *origin* was coordination and alternatives exist, it's still convention-derived—even if enforcement masks the arbitrariness. But this is the shakiest part, as enforcement can reshape motivations.

  ---

  ### Key Takeaways:
  1. **Tipping isn't a convention**—it's a **social norm** (fixed expectation, penalty-driven).  
  2. **Interview dress is a norm/signal**—too few alternatives and too much judgment for pure convention.  
  3. **Queueing is a moralized norm**—transcended convention through internalized fairness.  
  4. **Moralized conventions** exist—their stability comes from both coordination *and* perceived duty, but Lewis would say the duty is an illusion propping up the coordination.  

  **Why this matters for you:** In engineering, recognizing pure conventions (ports, protocols) lets you redesign them freely. But norms (like "always write tests") resist change because they acquire value beyond coordination. Lewis gives you a lens to spot the difference—and predict where flexibility exists.
