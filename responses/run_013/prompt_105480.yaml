answer: |-
  Here’s a comprehensive exam question, model answer, and marking scheme designed to meet your specifications. The question pushes students beyond descriptive statistics into causal reasoning while addressing contested philosophical nuances.

  ---

  ### Exam Question: Simpson’s Paradox in Medical Context
  **Background:** You are consulting for a hospital evaluating two treatments (A and B) for a disease. Recovery data, stratified by disease severity, are:  
  - **Treatment A**: Mild cases: 9/10 recovered; Severe cases: 30/90 recovered  
  - **Treatment B**: Mild cases: 89/100 recovered; Severe cases: 1/10 recovered  

  **Tasks:**  
  1. **Descriptive Analysis**: Calculate the overall recovery rates for both treatments. State the two defensible answers to *"which treatment has the higher recovery rate?"* and explain how each is derived.  
  2. **Causal Roles**: Suppose we wish to answer the causal question: *"which treatment is more effective at improving recovery?"*  
     - Explain what causal role *severity* must play (confounder, mediator, or collider) for:  
       (i) the pooled (unstratified) comparison to validly answer this causal question;  
       (ii) the stratified comparison to validly answer it.  
     - What changes if severity is a variable the treatment *directly affects* (e.g., Treatment A reduces severity)?  
  3. **Critical Evaluation**: A classmate claims: *"The reversal between pooled and stratified comparisons proves that severity is a confounder."*  
     - Evaluate this claim. Explain why reversal is neither necessary nor sufficient for confounding. Use the properties of non-collapsible measures (e.g., odds ratios) to show how reversal can occur *without confounding*.  
  4. **Limits of Data**: What causal stories are consistent with this table? What must be assumed beyond the data to choose among them?  

  ---

  ### Model Answer (≈600 words)  
  #### Task 1: Descriptive Analysis  
  - **Pooled recovery rates**:  
    Treatment A: (9 + 30)/(10 + 90) = 39/100 = 39%  
    Treatment B: (89 + 1)/(100 + 10) = 90/110 ≈ 82%  
    → *Pooled comparison suggests Treatment B has a higher recovery rate (82% vs. 39%).*  
  - **Stratum-specific recovery rates**:  
    Mild cases: A (90%) vs. B (89%) → A marginally better.  
    Severe cases: A (33.3%) vs. B (10%) → A much better.  
    → *Stratified comparison suggests Treatment A has a higher recovery rate in both subgroups.*  
  Both answers are defensible descriptively: the paradox arises from aggregating unequal severity distributions (A treats mostly severe cases; B treats mostly mild cases).  

  #### Task 2: Causal Roles  
  - **(i) Pooled comparison valid only if severity is a *collider*.** If we condition on a collider (e.g., pooling data that implicitly conditions on severity), we induce spurious association between treatment and outcome. Here, pooled estimates would be biased.  
  - **(ii) Stratified comparison valid only if severity is a *confounder*.** Confounding exists if severity causes both treatment assignment and recovery. Stratifying adjusts for this bias, revealing the true effect.  
  - **If treatment affects severity** (e.g., A reduces severity), severity becomes a *mediator*. Neither pooled nor stratified comparisons directly estimate the total causal effect of treatment:  
    - Pooled estimates confound direct and indirect effects.  
    - Stratified estimates measure only direct effects (severity held fixed), *suppressing* the indirect effect via severity.  
    To estimate total effect, we would need methods like mediation analysis or inverse probability weighting.  

  #### Task 3: Evaluating "Reversal Proves Confounding"  
  The classmate’s claim is **incorrect**. Reversal is:  
  - **Not sufficient for confounding**: Reversal can occur without confounding due to *non-collapsibility* of effect measures like odds ratios (ORs). For example:  
    - Mild cases: OR(A/B) = (9/1)/(89/11) ≈ 1.11  
    - Severe cases: OR(A/B) = (30/60)/(1/9) = 4.5  
    - Pooled OR = (39/61)/(90/20) ≈ 0.14  
    Here, stratum-specific ORs favor A (OR>1), but the pooled OR favors B (OR<1)—despite no confounding if severity only affects recovery (not treatment). This reversal arises mathematically because ORs are non-collapsible.  
  - **Not necessary for confounding**: Confounding can exist without reversal (e.g., if stratum-specific and pooled estimates both underestimate a true effect).  

  **Conclusion**: Reversal signals *statistical association* between severity and treatment but does not establish *causal structure*. It can stem from non-collapsibility or other biases.  

  #### Task 4: Limits of Data  
  The table alone **cannot distinguish** between:  
  - Severity as a confounder (e.g., doctors assign severe cases to A).  
  - Severity as a mediator (e.g., A lowers severity, improving recovery).  
  - Severity as a collider (e.g., treatment choice and recovery both influence severity recording).  
  **Assumptions required**: Causal identification requires untestable assumptions (e.g., no unmeasured confounders, well-defined interventions). Philosophically, this exposes how statistical data underdetermine causal claims—background knowledge (e.g., DAGs) is essential. While some argue causal graphs "dissolve" the paradox by specifying assumptions, others contend it reveals a deeper tension: statistical evidence alone cannot resolve causal questions without ontological commitments.  

  ---

  ### Marking Scheme (20 points total)  
  | **Criterion**                                                                 | **A (4 pts)**                                                                                                | **B (3 pts)**                                                                                              | **Common Mistakes**                                                                 |  
  |--------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|  
  | **1. Descriptive analysis** (4 pts)                                           | Correct pooled & stratified rates; both answers justified; notes aggregation bias.                          | Rates calculated but causal language used; omits discussion of unequal severity distribution.               | Miscomputes rates; claims one answer is "correct."                                 |  
  | **2a. Causal roles (pooled/stratified)** (4 pts)                              | Correct confounder/collider distinction; links validity to causal structure.                                | Identifies confounder for stratification but misses collider for pooling; vague on validity conditions.    | Confuses mediator/confounder; claims stratification is always valid.                |  
  | **2b. Causal role (severity affected by tx)** (4 pts)                         | Correctly identifies mediator; explains why neither comparison estimates total effect.                      | Identifies mediator but cannot articulate why estimates are biased (e.g., ignores indirect effects).       | Assumes stratification solves the problem; omits mediation.                         |  
  | **3. Reversal ≠ confounding** (4 pts)                                         | Uses non-collapsibility (e.g., OR example) to show sufficiency failure; notes necessity failure.            | States reversal isn’t proof but lacks non-collapsibility example; conflates association/causation.         | Assumes reversal implies confounding; omits non-collapsibility.                     |  
  | **4. Limits of data & philosophical nuance** (4 pts)                          | Lists ≥2 consistent causal stories; notes untestable assumptions; distinguishes statistical/causal claims. | Identifies data limitations but vague on assumptions; misses underdetermination point.                     | Claims data "prove" a causal story; omits role of background knowledge.             |  

  **Grade thresholds**:  
  - **A (18–20)**: Hits all 5 "A" criteria.  
  - **B (15–17)**: Hits ≥3 "A" criteria or all "B" criteria.  
  - **C (12–14)**: Misses ≥2 key points (e.g., omits non-collapsibility or mediation).  

  ---

  ### Key Design Notes  
  1. **Avoiding Berkeley**: The medical context forces engagement with causal roles beyond gender/department dynamics.  
  2. **Non-collapsibility emphasis**: The severe/mild imbalance creates non-collapsible ORs (Task 3), exposing how reversal ≠ confounding.  
  3. **Philosophical neutrality**: The answer notes debates (e.g., "dissolving" vs. "revealing tension") without endorsing one.  
  4. **Causal clarity**: Tasks separate descriptive (Task 1), structural (Task 2), and critical (Task 3) reasoning.  
  5. **Realism**: The mediator scenario (treatment affecting severity) mirrors real-world complexity (e.g., antivirals reducing viral load).  

  This question tests whether students can disentangle statistical patterns from causal claims—a core goal in philosophy of causal inference.
