  The marking scheme will have 5 must-hit criteria worth 20 points total. I'll specify what distinguishes A (18-20) from B (15-17) answers, with common pitfalls noted. For instance, B answers might miss the non-collapsibility argument or fail to separate statistical from causal claims.

