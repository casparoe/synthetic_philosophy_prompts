prompt: |-
  I'm putting together a handout for a grad reading group on the species problem, and I need a dialogue I can pass around. Can you write a dialogue between two equally sharp biologists/philosophers — one defends the interbreeding-based (biological) species concept, the other defends a phylogenetic/diagnosable-lineage species concept — set over a concrete, made-up case. The case: a deep-sea snail genus, call it Thalassogyra, around a hydrothermal vent field. There are three morphs. Morph A and B meet at one vent and interbreed freely. Morph C is genetically nested inside B but has a chromosomal rearrangement that makes hybrids sterile. There are also asexual, all-female lineages that have lost males entirely. The fossil record shows a slow transition from A-like to B-like shells over 2 million years. The two characters are looking at the same data and disagreeing about how many species there are, and what "species" is even supposed to pick out. Let them really argue: each should press the other's weak spot (the asexuals for the biospecies person, the arbitrary cut-offs and diagnosability for the phylogenetic person), and each should give ground where the other has a good point. No strawmen. They should also get into the weeds a bit: the difference between a species concept and a species criterion, whether species are taxa or categories, whether the case is a ring species or reticulate evolution, and what work the word "species" is doing in conservation law vs evolutionary theory. No citations, no reading list, no name-dropping of who said what — just the argument. They should actually respond to each other's points, not just trade monologues.

  After the dialogue, I definately want a short structured summary as a JSON object with exactly these fields:
  - "settled_among_specialists": array of strings, claims that people who know the field would mostly agree on.
  - "genuinely_contested": array of strings, claims where competent people still disagree.
  - "strongest_move_for_biospecies": string, the single best point the interbreeding side made.
  - "strongest_move_for_phylogenetic": string, the single best point the other side made.
  - "where_the_dialogue_leans": string, which view the dialogue as written makes more persuasive, and why.
  - "what_would_change_minds": object with keys "biospecies" and "phylogenetic", each a string describing evidence or argument that would move that side.
  - "caveats": string, anything the dialogue oversimplifies or leaves out.

  And please be honest in that summary: seperate what's actually settled from what's genuinely contested, and don't present either character's view as the consensus if it isn't. Also, don't pad it with citations or references.
