  First, I need to unpack their core frameworks clearly. The neutrality dichotomy is classic but needs precise application: Germany's tax system looks like evenhandedness (it's available to all recognized religious corporations) but has abstentionist critics who see any state entanglement as problematic. The four-dimensional vector model (symbolic, financial, institutional, coercive) is particularly useful here - Germany scores high on financial/institutional/coercive dimensions but low symbolically, making "is this establishment?" too crude a question. The exit-cost theory is their most vulnerable idea - they're half-convinced it's the key to tolerability, but I need to pressure-test how "cheap" German exit really is given baptismal ties and social stigma.

