  The real pivot is whether neutrality or exit does the heavy lifting. Germany suggests neutrality must mean evenhandedness to be coherent - abstentionism would condemn both German and French models while ignoring US-style "shadow subsidies." But exit costs reveal the limits: if leaving the church requires civil court proceedings and carries social penalties, is it truly "cheap"? This exposes neutrality's blind spot around voluntariness. 

  Ultimately the case shows neutrality can't stand alone - its meaning depends entirely on which dimensions of entanglement (per the vector model) are present, and whether exit rights neutralize coercion. For the user's half-formed theory, this confirms exit costs are central to tolerability, but Germany's medium-cost exit suggests we need a spectrum rather than a binary. The US comparison implies that even high financial support feels legitimate when combined with low institutional/coercive entanglement and easy exit - a configuration Germany might learn from.
answer: |-
  Here’s an analysis of Germany’s church tax through your three frameworks, tested against the foils of Alsace-Moselle and the U.S., with a focus on the interplay of neutrality, establishment, and exit costs:

  ### 1. **State Neutrality: Evenhandedness vs. Abstention**  
     - **Germany**: Embodies *evenhanded neutrality*. The state acts as a tax collector for all recognized religious corporations under public law (Catholic, Protestant, Jewish, etc.), treating them comparably. The state’s role is administrative, not theological.  
     - **Distortion**: Masks *de facto* bias. "Recognition" as a public-law corporation favors historically dominant groups (e.g., smaller religions like Islam struggle to qualify). Abstentionists argue the state *is* endorsing religion by embedding it in fiscal bureaucracy.  
     - **Silences**: Fails to address whether neutrality should require *voluntary* affiliation. Tax membership stems from baptism (non-consensual) and exit requires state intervention.  
     - **Foils**:  
       - **France (1905)**: Pure *abstention* in theory—no state funding of religion. But **Alsace-Moselle** excepted: state salaries for clergy (Catholic, Protestant, Jewish) reveal evenhandedness *within* an established group. Neutrality fractures territorially.  
       - **U.S.**: Hybrid. Property tax exemptions embody *evenhandedness* (all religions qualify equally) but are defended as *non-subsidy* (abstentionist logic). The state avoids direct financial entanglement but grants indirect aid.  

  ### 2. **Establishment as a Four-Dimensional Vector**  
     - **Germany’s Vector**:  
       - **Symbolic**: Low. No state religion; minimal ceremonial entanglement.  
       - **Financial**: High. State collects/enforces church taxes.  
       - **Institutional**: High. Churches are "public-law corporations"; state manages membership rolls.  
       - **Coercive**: High. Exit requires civil deregistration (state procedure), and courts conflate financial exit with religious apostasy.  
     - **Insight**: Germany isn’t "established" in the Anglican sense but has intense financial-institutional-coercive entanglement. The system’s stability hinges on this *selective* establishment.  
     - **Distortion**: Overdescribes coherence. The vector implies rational design, but Germany’s system is a Weimar-era artifact preserved by path dependency.  
     - **Foils**:  
       - **Alsace-Moselle**: Higher *symbolic* establishment (state-paid clergy imply official recognition) but lower *coercive* dimension (no civil exit ritual; membership is congregational).  
       - **U.S.**: Near-zero on all dimensions *except financial*—but property exemptions are passive, lacking institutional/coercive elements. Avoids state *agency* in religious funding.  

  ### 3. **The Exit-Based Defense of Entanglement**  
     - **Germany’s "Cheap Exit?"**:  
       - **Formally accessible**: Deregistration is a brief administrative act (cost: €30–50).  
       - **Actually costly**:  
         - **Canonical**: Catholic deregistration incurs excommunication (sacramental denial).  
         - **Social**: Stigma in religious communities; potential professional repercussions (e.g., in education).  
         - **Bureaucratic**: Requires engaging the state to leave a religious body—fusing civil and religious identity.  
       - **Verdict**: Exit is *cheap procedurally* but *dear socially/religiously*. The state facilitates entanglement by binding fiscal and spiritual exit.  
     - **Alsace-Moselle Contrast**: Exit is **cheaper** here. Leaving your church requires no state ritual; financial separation is congregational. The state pays clergy but doesn’t mediate membership.  
     - **U.S. Comparison**: Exit is **cheapest**. No state-recorded religious identity; ending donations or membership has zero state involvement. Entanglement is indirect (tax exemption) and doesn’t constrain individual choice.  

  ### **What the Case Reveals About Neutrality**  
  - **Neutrality Collapses into Exit Logic**: Germany exposes neutrality’s limits. "Evenhandedness" justifies the tax *if* all religions can access it—but this ignores exit costs. "Abstention" would reject the tax entirely—but fails to explain why Alsace-Moselle’s salaries or U.S. exemptions are tolerable. **Exit costs, not neutrality, determine legitimacy**:  
    - Germany’s medium-cost exit makes entanglement *contested but tolerated*.  
    - Alsace-Moselle’s lower exit cost makes its establishment *less controversial* locally.  
    - The U.S.’s near-zero exit cost defangs criticism of exemptions.  
  - **Neutrality’s Useful Work**:  
    - Forces *evenhandedness* as a baseline: Germany’s system would be indefensible if it favored one church.  
    - Explains U.S. jurisprudence: Exemptions are framed as "neutral" toward all religions, not aid—but only because exit is free.  
  - **Implications**:  
    - **France**: Alsace-Moselle’s regime survives because low exit costs neutralize establishment concerns. The 1905 law’s abstention works nationally because exit is cost-free.  
    - **U.S.**: Exemptions are sustainable *because* they avoid coercive-institutional ties. If property exemptions required state-managed membership, they’d collapse.  

  ### Conclusion  
  Germany’s church tax is **evenhanded but coercively entangled**, sustained by *moderate exit costs* that make it tolerable but contested. Neutrality alone can’t resolve this: only when filtered through exit costs does it explain why Germany’s system is more vulnerable than Alsace-Moselle’s or the U.S.’s. The case proves that **establishment is tolerable only when exit is genuinely accessible**—and that neutrality’s moral force derives from enabling choice, not abstract impartiality.
