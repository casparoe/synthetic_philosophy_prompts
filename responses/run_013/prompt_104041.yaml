prompt: |-
  I have been reading LessWrong and the surrounding rationalist blogosphere for the better part of a decade, and I keep returning to the cluster of questions around moral testimony: when, if ever, may one person let another person's moral judgment stand in for their own? A friend of mine—call her M—has thought about this longer than I have, and I have a decent track record of predicting her verdicts on new cases. But her verdicts so far are confounded in a way that makes the prediction non-trivial.

  Here is what she has said about earlier cases.

  - A first-year student who knows almost nothing about factory farming reads a well-supported expert consensus that the practice is morally indefensible and believes it on that basis. M says the student can know the moral claim, and relying on testimony is fine.
  - A tenured moral philosopher is deciding whether to publicly accuse a former mentor of intellectual dishonesty. The philosopher has all the non-moral facts but cannot decide whether the accusation is morally warranted, and adopts a colleague's verdict without working through the arguments. M says this is not fine; the philosopher may end up with the right answer, but not with the kind of moral understanding that matters.
  - A person who has never thought about whether gratuitous cruelty is wrong is told by a reliable teacher that it is wrong, and accepts it immediately. M says this is fine; some moral truths are basic enough that testimony can put you in a position to see them for yourself.
  - A person with no experience in charitable giving follows a trusted advice columnist's recommendation about which of two effective charities to support. M says this is fine.
  - A person raised in a community whose moral code is systematically shaped by its members' economic interests accepts that code's verdict on a disputed question, sincerely and without coercion. M says this is not fine, even if the code is internally coherent and the person is epistemically reliable by local standards.
  - A moral philosopher who has been betrayed asks a colleague whether to forgive the betrayer. M says this is not fine; the decision has to be the philosopher's own, even if the colleague is right.
  - A person with no independent grasp of the ethics of algorithmic hiring reads a well-reasoned consensus statement by a panel of moral philosophers and adopts its verdict on a novel case. M says this is fine, or at least permissible.

  Notice the pattern: every case where she permits reliance is one where the person is a novice and the decision is not constitutive of their identity; every case where she forbids it is one where the person is an expert and the decision is identity-constitutive. I cannot tell which feature is doing the work.

  Now the new case. A person who is not a novice—someone who has read a good deal of moral philosophy and can follow arguments, though not an expert on this particular issue—is trying to decide whether to support a complex new policy. They cannot work out the moral verdict themselves; the considerations are too tangled. They ask a highly reliable large language model, which gives a clear moral verdict and a concise rationale. After reading the rationale, the person sees why the verdict follows and endorses it, but they would not have reached it on their own. The decision is not constitutive of their identity; it is a policy question. M is asked: was it permissible for the person to rely on the model's moral testimony?

  What will M say? I care less about the bare yes or no than about the rule she seems to be running. Identify the candidate rules that fit her earlier verdicts equally well—at least two—and say what each predicts about the new case. Give your best guess at her verdict, with the reasons for preferring one rule over the others. Then name the further case that would best tell those rules apart, and say what each rule would say about it. End with a final line of exactly this form: \answer{predicted verdict | preferred rule | distinguishing case}.
reasoning: |-
  Hmm, the user presents a fascinating puzzle about moral testimony based on their friend M's judgments across several cases. They need help predicting M's verdict on a new scenario involving an AI's moral testimony, while also uncovering the underlying rule M uses. 

  First, I notice the user has clearly mapped out M's pattern: permission when (novice + non-identity decision) vs prohibition when (expert + identity-constitutive). But the confounding part is determining which factor dominates when they conflict—like in this new case where the person is intermediate-skilled (not novice) facing a non-identity policy decision. 

  I consider two equally plausible rules that fit all prior cases:
  - Rule A prioritizes expertise level: forbid testimony when the agent is sufficiently expert-like (as in cases 2,5,6), regardless of identity.
  - Rule B prioritizes identity-constitution: forbid testimony only for deeply personal decisions (cases 2,5,6), regardless of expertise.

  For the new AI case, Rule A would forbid reliance (since the person isn't a novice), while Rule B would permit it (policy isn't identity-constitutive). 

  My instinct is Rule B better captures M's philosophy. Cases 1,3,4,7 show she permits testimony for non-identity decisions even with varying expertise—like the philosopher in case 7 relying on consensus. Conversely, identity cases (2,5,6) forbid testimony even for non-experts (case 5's community member). The fact that the AI's rationale was understood and endorsed also echoes case 3's "seeing for oneself" dynamic.

  To decisively test this, I imagine a distinguishing case: An expert facing a trivial, non-identity decision (e.g., a moral philosopher using testimony to choose which charity to donate $5). Rule A would forbid this (expert status), but Rule B would permit it (no identity stakes). I bet M would permit it, confirming Rule B.

  Final prediction: M permits reliance here, driven by Rule B's identity threshold. The AI rationale provides enough engagement to avoid the "outsourcing" concern in identity cases.
answer: |-
  Based on the pattern of M's verdicts and the principles they suggest, here's the analysis of the new case, candidate rules, prediction, distinguishing case, and final answer.

  ### Candidate Rules Fitting Prior Cases
  Two rules equally explain M's prior judgments:
  1. **Identity-Constitution Rule**: Reliance on moral testimony is impermissible when the decision is constitutive of the agent's moral identity (e.g., forgiveness, accusing a mentor, adopting a community's code). It is permissible otherwise, regardless of expertise.  
     - *Fits all cases*: Forbids in identity cases (2,5,6); permits in non-identity cases (1,3,4,7), even with varying expertise (e.g., novice in 1 vs. non-expert in 7).  
  2. **Expertise Threshold Rule**: Reliance is impermissible when the agent possesses sufficient moral expertise to be expected to reason independently (e.g., tenured philosopher, community member). It is permissible for novices or non-experts, regardless of identity.  
     - *Fits all cases*: Forbids when agent is expert (2,5,6); permits when novice/non-expert (1,3,4,7), even in identity-adjacent cases (e.g., basic cruelty in 3 is identity-relevant but permitted due to novice status).  

  ### Prediction for the New Case
  - **Person**: Non-novice (read moral philosophy, follows arguments) but not an expert on the issue.  
  - **Decision**: Non-identity-constitutive (policy question).  
  - **Reliance**: After receiving AI testimony, the person understands and endorses the rationale but couldn’t have reached it alone.  
  - **Rules’ Predictions**:  
    - **Identity-Constitution Rule**: *Permits* reliance. The decision is not identity-constitutive (like cases 1,4,7), so testimony is acceptable. Expertise is irrelevant.  
    - **Expertise Threshold Rule**: *Forbids* reliance. The person is not a novice (has moral philosophy background) and should reason independently (like the philosopher in case 2).  

  ### Best Guess for M’s Verdict
  M will say it is **permissible** to rely on the AI’s testimony.  
  **Reasons to prefer the Identity-Constitution Rule**:  
  - Cases 5 and 6 show identity-constitution trumps expertise: The non-expert community member (case 5) is forbidden from relying, while the novice in case 1 is permitted. Identity is the consistent driver.  
  - Case 7 parallels the new scenario: A non-expert (but philosophically literate) person relies on expert consensus for a non-identity policy judgment, which M permits. The AI here acts like the philosopher panel.  
  - The person’s post-testimony understanding ("sees why the verdict follows") mirrors case 3’s "basic truths" dynamic, satisfying M’s requirement for moral engagement without full independent derivation.  

  ### Distinguishing Case to Test the Rules
  **Scenario**: *A tenured moral philosopher uses testimony from a trusted colleague to decide whether to return a lost wallet with cash (a trivial, non-identity-constitutive decision). The philosopher could reason independently but chooses not to.*  
  - **Identity-Constitution Rule**: *Permits* reliance. The decision is not identity-constitutive (trivial and impersonal).  
  - **Expertise Threshold Rule**: *Forbids* reliance. The philosopher is an expert and should reason independently, even for minor decisions.  
  - **Expected M Verdict**: M would **permit** reliance here, confirming the Identity-Constitution Rule. Forbidding testimony in trivial cases would overextend the expertise principle (no prior cases suggest this).  

  \answer{permissible | Identity-Constitution Rule | Expert deciding a trivial non-identity case}
