prompt: |-
  I edit the behaviour section of an ecology journal that receives a steady stream of papers whose central claim is that some trait is an adaptation for some function. My referees are capable biologists but not evolutionary theorists, they have about an hour per manuscript, and I make the final call, so I need something they can run rather than a lecture on adaptationism. Please turn the spandrels critique — Gould and Lewontin's arguments that current utility is not evidence of past selection, and that a trait may be a byproduct of something else entirely — into a decision procedure for evaluating a claim of the form "trait T is an adaptation for function F." It should run in order: what exactly is being claimed (current function, historical origin, or both); which non-adaptation alternatives are live for this trait (drift, developmental or phylogenetic constraint, byproduct, an exaptation since co-opted to a new role); what evidence would discriminate among them and what the manuscript actually offers; and how much of the remaining disagreement is about research strategy — how heavily to weight selection as a default — rather than about data. Say what counts as a sufficient answer at each step, where the procedure should stop with a verdict of "not supported," and where it must hand the judgment back to me because the question is about what the journal should publish rather than about what is true. It must not let referees escape in either direction: neither treating "it works well" as proof of selection, nor disposing of an inconvenient trait by calling it a spandrel and moving on. Then run it on three claims: the female orgasm as a byproduct of the male orgasm rather than an adaptation, the human chin as a growth byproduct, and a third of your choosing — an adaptationist claim that is widely accepted and that I would prefer to accept, where the procedure nonetheless tells me I cannot. Close by stating what the procedure cannot do.
reasoning: |-
  We are creating a decision procedure for evaluating claims of the form "trait T is an adaptation for function F." The procedure must be practical for referees with limited time and must avoid common pitfalls. The procedure is structured as a series of steps:

  ### Step 1: Clarify the Claim
  - **Question:** What exactly is being claimed? Is it about current function, historical origin, or both?
  - **Explanation:** Many papers conflate current utility with historical adaptation. The claim should be clear: the trait T evolved by natural selection for the specific function F in the past. If the paper only discusses current function without historical claims, that is a different (and weaker) claim.
  - **Sufficient answer:** The paper must explicitly state that T is an adaptation for F, meaning that natural selection in the past shaped T for F. If the paper only discusses current utility, the referee should note that the claim is about current function and not about historical adaptation. In the latter case, the paper might be acceptable as a functional study but not as an adaptationist claim.

  ### Step 2: Identify Non-Adaptation Alternatives
  - **Question:** What are the non-adaptation alternatives that are biologically plausible for this trait?
  - **Explanation:** The referee should list the alternatives that are relevant and plausible for the trait in question. These include:
    - **Genetic drift**: the trait is neutral or nearly neutral and has evolved by random processes.
    - **Developmental constraint**: the trait is a necessary consequence of development and not a result of selection for F.
    - **Phylogenetic constraint/history**: the trait is present because it was present in an ancestor and was not selected for F in the lineage in question (it might have been selected for a different function or not at all).
    - **Byproduct (spandrel)**: the trait is a non-adaptive consequence of selection on another trait (e.g., the human chin might be a byproduct of jaw reduction).
    - **Exaptation**: the trait originally evolved for a different function (or was a byproduct) and was later co-opted for F. Note that exaptation does not require that the trait was an adaptation for the original function, but it might have been.
  - **Sufficient answer:** The referee must identify at least two non-adaptation alternatives that are plausible for the specific trait T. If the paper does not consider any alternatives, that is a problem. The referee should also note if the paper has considered the most relevant alternatives.

  ### Step 3: Evaluate Evidence for Discrimination
  - **Question:** What evidence would be needed to discriminate between the adaptation hypothesis and the non-adaptation alternatives, and what evidence does the manuscript actually provide?
  - **Explanation:** The referee should outline the types of evidence that could help distinguish adaptation from alternatives. These might include:
    - **Comparative evidence**: Is the trait present in related species? Does it correlate with the proposed function in a way that suggests selection? (Note: correlation does not equal causation, but a pattern across species can be suggestive.)
    - **Experimental evidence**: Does manipulation of the trait affect the function? Is there evidence of current selection? (But remember: current selection does not prove past selection for the same function.)
    - **Developmental evidence**: Does the developmental pathway support the trait being a byproduct of another selected trait?
    - **Genetic evidence**: Are there genes associated with the trait that show signatures of selection? (But note: selection on a linked gene might not be for the trait in question.)
    - **Fossil evidence**: Does the fossil record show the trait evolving in conjunction with the proposed function?
    - **Optimality/engineering evidence**: Does the trait perform the function optimally? (But note: non-adaptive processes can also produce optimal designs, and adaptation might not lead to optimality due to constraints.)
  - **Sufficient answer:** The referee must check if the paper provides evidence that specifically tests the adaptation hypothesis against at least one plausible alternative. If the paper only shows that the trait has current utility for F, that is not sufficient. The paper must provide evidence that the trait was shaped by natural selection for F and not by other processes. If the evidence is lacking, the claim is not supported.

  ### Step 4: Assess Research Strategy Disagreement
  - **Question:** How much of the remaining disagreement is about research strategy (i.e., the weight given to selection as a default) rather than about data?
  - **Explanation:** Sometimes, even with evidence, there may be disagreement about whether the evidence is strong enough to rule out non-adaptive alternatives. This step requires the referee to separate substantive disagreements (about the data and its interpretation) from methodological disagreements (about how much evidence is required to accept an adaptationist claim).
  - **Sufficient answer:** The referee should note if the paper's argument rests on an implicit assumption that selection is the default explanation and if the authors dismiss alternatives without evidence. Conversely, if the paper is overly dismissive of adaptation without strong evidence for an alternative, that is also a problem. The referee must avoid both extremes.

  ### Stopping Points for Verdict
  - **Stop with "not supported":** 
    - If the claim is about historical adaptation but the paper only provides evidence of current utility (Step 1).
    - If the paper fails to consider plausible non-adaptation alternatives (Step 2) and does not provide evidence that rules them out (Step 3).
    - If the evidence provided does not discriminate between adaptation and at least one plausible alternative (Step 3).

  - **Hand back to editor (judgment call):**
    - If the paper has provided some evidence for adaptation but the evidence is not decisive and the non-adaptation alternatives are still plausible, then the referee must report this and let the editor decide whether the level of evidence meets the journal's standards. This is especially true when the disagreement is about research strategy (Step 4). The editor must then judge if the paper's contribution is sufficient for publication despite the uncertainty.

  ### Avoiding Escapes
  - **Referees must not:** 
    - Accept "it works well" as proof of selection (escape toward adaptationism).
    - Dismiss a trait as a spandrel without evidence for the byproduct hypothesis (escape toward non-adaptation).

  ### Running the Procedure on Three Claims

  #### Claim 1: The female orgasm as a byproduct of the male orgasm (non-adaptation claim)
  - **Step 1:** The claim is that the female orgasm is not an adaptation but a byproduct of selection on the male orgasm. The paper is making a non-adaptation claim about the female orgasm.
  - **Step 2:** Non-adaptation alternatives for the female orgasm include adaptation (for example, for pair bonding or selective fertilization) and other alternatives (like drift, but drift is less likely for such a complex trait). The paper's claim is one of the alternatives (byproduct).
  - **Step 3:** Evidence needed: 
    - Comparative: Do species with male orgasm always have female orgasm? (Evidence: in many mammals, female orgasm is not always present, but the clitoris is homologous and develops from the same embryonic structure as the penis.) 
    - Developmental: The clitoris develops from the same tissue as the penis, and the neural circuitry for orgasm may be shared. 
    - The paper might provide evidence that female orgasm is a byproduct by showing that it is not consistently present when male orgasm is, or that it doesn't correlate with reproductive success. However, note that some studies show correlations with reproductive outcomes, so the evidence is mixed. 
    - What the manuscript offers: Let's assume the paper provides comparative and developmental evidence for the byproduct hypothesis. 
    - **Verdict:** The evidence might support the byproduct hypothesis, but the referee must check if the paper has ruled out adaptation (e.g., by showing that female orgasm does not confer a fitness advantage, or by showing that it is not optimized for any function). If the paper only shows developmental linkage and variation, that supports the byproduct hypothesis but does not rule out that it might have been co-opted (exaptation) and under selection now. The referee should note the mixed evidence and might hand back to the editor if the paper's evidence is not conclusive.

  #### Claim 2: The human chin as a growth byproduct
  - **Step 1:** The claim is that the human chin is not an adaptation but a byproduct of other changes (like jaw reduction). This is a non-adaptation claim.
  - **Step 2:** Alternatives: adaptation (for speech, sexual selection, etc.), byproduct (of facial reduction and growth patterns), or drift. 
  - **Step 3:** Evidence needed: 
    - Comparative: Do other primates have chins? (No, only humans.) 
    - Developmental: How does the chin form during growth? (Evidence: the chin emerges from the pattern of resorption and deposition in the mandible during development, which is a result of overall facial reduction.) 
    - Fossil record: The chin appears late in human evolution, coinciding with facial reduction. 
    - Function: Is there evidence that the chin is under selection? (Some studies suggest it might play a role in mastication or speech, but evidence is weak.) 
    - What the manuscript offers: A paper supporting the byproduct hypothesis might provide developmental evidence and simulations showing that the chin arises automatically from the growth pattern. 
    - **Verdict:** If the paper provides strong developmental evidence and shows that the chin is not under selection (e.g., no fitness consequences, no functional advantage), then the byproduct hypothesis is supported. However, if the paper only shows the developmental pathway and does not test for current function or selection, it might not rule out that the chin is now under selection (exaptation). The referee must check if the paper has tested for function. If not, the claim is not fully supported. But note: the byproduct claim does not require that the trait has no current function, only that it was not shaped by selection for that function. So the paper must show that it was not selected for in the past. This is tricky without fossil or genetic evidence. The referee might conclude that the evidence for byproduct is suggestive but not conclusive, and hand back to the editor.

  #### Claim 3: An adaptationist claim that is widely accepted but the procedure says not supported
  Let's choose the **giraffe neck as an adaptation for feeding on tall trees**.
  - **Step 1:** The claim is that the long neck of the giraffe is an adaptation for reaching high foliage.
  - **Step 2:** Non-adaptation alternatives: 
    - Sexual selection (the neck might be for male-male combat, as in giraffe "necking").
    - Byproduct of selection for something else (e.g., thermoregulation, as the neck has a large surface area for heat dissipation, but that is not a common view).
    - Drift (unlikely due to the complexity and cost of the trait).
    - Exaptation: originally for one function (e.g., sexual selection) and then co-opted for feeding.
  - **Step 3:** Evidence needed: 
    - Comparative: Do other long-necked animals (like okapi) use their necks for feeding? (Okapi feed at lower levels, but they have shorter necks.) 
    - Experimental: Do giraffes feed more efficiently at higher levels? (Yes, but they also feed at lower levels.) 
    - Current selection: Is there a fitness advantage for longer necks in feeding? (Evidence: in times of drought, giraffes with longer necks might have an advantage, but that has been observed.) 
    - However, a strong alternative is sexual selection: males with longer necks win more fights and have more mating opportunities. 
    - What the manuscript offers: A classic paper might only show that the neck allows feeding on tall trees and that this is beneficial. 
    - **Verdict:** The paper might not consider the sexual selection hypothesis and might not provide evidence that the neck evolved primarily for feeding rather than for combat. Therefore, the evidence does not rule out a plausible alternative (sexual selection). The paper might also not test if the neck length is optimized for feeding (it isn't, because the recurrent laryngeal nerve takes a long detour). Thus, the adaptationist claim for feeding is not fully supported by the evidence in the paper. The referee would have to say "not supported" because the evidence does not discriminate between feeding adaptation and sexual selection. However, note that the giraffe neck is widely accepted as an adaptation for feeding, so this shows that the procedure is strict and requires more evidence than is sometimes provided.

  ### What the Procedure Cannot Do
  - The procedure cannot resolve deep philosophical issues about adaptationism.
  - It cannot provide a definitive answer when the evidence is equivocal; that is left to the editor's judgment.
  - It cannot replace expertise in evolutionary biology but is a structured way to evaluate the evidence.
  - It does not generate new data; it only evaluates what is presented.
  - It may be overly strict for some traits where non-adaptive alternatives are very implausible (e.g., the eye as an adaptation for vision), but the referee must still consider the alternatives.

  By following this procedure, referees can systematically evaluate adaptation claims and avoid common pitfalls. The editor must then weigh the referees' reports and decide on publication.
answer: |-
  Below is a streamlined decision procedure for referees to evaluate claims of the form "trait T is an adaptation for function F." It translates Gould and Lewontin's spandrels critique into a practical, step-by-step checklist. Referees should address each question in sequence, spending no more than 15–20 minutes per manuscript. **The goal is not philosophical debate but assessing scientific rigor**—ensuring the paper rules out non-adaptation alternatives. The procedure halts with "not supported" if critical gaps exist, or flags unresolved issues for editorial judgment. 

  ---

  ### **Decision Procedure: Evaluating Adaptation Claims**
  **Instructions:** Answer each question below. Stop early if a fatal flaw emerges. Cite manuscript specifics.  
  **Key pitfalls to avoid:**  
  - ⚠️ **Don't accept "current utility" as proof of past selection.**  
  - ⚠️ **Don't dismiss a trait as a "spandrel" without evidence for an alternative.**  

  #### **Step 1: Clarify the Claim**  
  **Question:** Does the paper explicitly claim that trait T evolved *by natural selection for function F* (historical origin), or is it only claiming *current utility*?  
  - **Sufficient answer:** The paper must state (or strongly imply) that selection shaped T for F in the past. If it only discusses current function (e.g., "T performs F well"), this is **not an adaptation claim**—it’s a weaker functional hypothesis.  
  - **Stop with "not supported" if:** The paper conflates current utility with historical adaptation.  
  - **Proceed only if:** Historical selection for F is the central claim.  

  #### **Step 2: Identify Plausible Non-Adaptation Alternatives**  
  **Question:** Which non-adaptation hypotheses are biologically plausible for T in this system? Consider:  
  - **Drift**: T is a neutral trait fixed by chance.  
  - **Constraint**: T is a byproduct of development (e.g., allometric scaling) or phylogeny (e.g., ancestral trait not shaped for F).  
  - **Exaptation**: T evolved for another function (or as a byproduct) and was later co-opted for F.  
  - **Other**: e.g., pleiotropy, genetic correlation.  
  - **Sufficient answer:** Referee must list ≥1 alternative *specific to T* (e.g., "human chin could be a developmental byproduct of jaw reduction"). Use biological knowledge; if uncertain, note "alternatives not discussed."  
  - **Stop with "not supported" if:** The paper ignores all plausible alternatives without justification.  
  - **Proceed only if:** Alternatives are identified (even if briefly).  

  #### **Step 3: Evaluate Evidence Discrimination**  
  **Question:** What evidence *would* discriminate adaptation from alternatives, and what does the paper *actually* provide? Prioritize:  
  - **Comparative data**: Does T correlate with F across species *independently of shared ancestry*? (Phylogenetic control needed.)  
  - **Optimality/design**: Is T optimized for F? (But note: non-adaptive processes can produce apparent "design.")  
  - **Fitness measurements**: Does variation in T affect fitness *specifically via F*? (Correlation ≠ causation.)  
  - **Developmental/genetic evidence**: Does T arise as a byproduct? (e.g., pleiotropy, linkage).  
  - **Historical evidence**: Fossil/ancestral state data showing T evolved with F.  
  - **Sufficient answer:** Paper must test ≥1 alternative from Step 2. Evidence should be direct (e.g., experiments, phylogeny) not circumstantial (e.g., "T is useful").  
  - **Stop with "not supported" if:**  
    - Evidence only shows current utility (e.g., "T performs F" without historical/selective context).  
    - Alternatives are mentioned but not tested (e.g., "drift is unlikely" without analysis).  
  - **Hand back to editor if:** Evidence exists but is inconclusive (e.g., conflicting data, weak methods).  

  #### **Step 4: Assess Research Strategy Disagreement**  
  **Question:** Is disagreement about *data interpretation* or *default assumptions* (e.g., "selection is the null")?  
  - **Sufficient answer:** Referee must distinguish:  
    - **Data-driven issues** (e.g., "the comparative analysis lacks phylogenetic control").  
    - **Strategy-driven issues** (e.g., "the author assumes selection unless proven otherwise").  
  - **Hand back to editor if:** The paper’s evidence is adequate but controversial due to differing weights on alternatives (e.g., "how much proof is needed to reject drift?"). This is an editorial judgment about journal standards.  

  ---

  ### **Procedure Applied to Three Claims**  
  #### **Claim 1: Female orgasm as a byproduct of male orgasm**  
  - **Step 1:** Claim is that female orgasm is **not an adaptation** but a developmental byproduct.  
  - **Step 2:** Plausible alternatives: adaptation for pair-bonding, sperm selection, or mate choice.  
  - **Step 3:** **Evidence needed:** Developmental data (e.g., shared neuromuscular pathways with males); fitness effects (e.g., if orgasm frequency correlates with reproductive success). **Manuscript offers:** Typically, developmental homology (clitoris/penis) and lack of fitness correlation. **Verdict:** Supported *only* if paper tests adaptation hypotheses (e.g., measures fitness consequences). If it merely notes homology, it’s "not supported."  
  - **Step 4:** Disagreement often strategic (e.g., "byproduct is the null"). **Editorial judgment needed.**  

  #### **Claim 2: Human chin as a growth byproduct**  
  - **Step 1:** Claim is that the chin is **not an adaptation** but a biomechanical byproduct.  
  - **Step 2:** Plausible alternatives: adaptation for speech, chewing, or sexual selection.  
  - **Step 3:** **Evidence needed:** Biomechanical modeling (e.g., jaw stress distribution); fossil data showing chin emergence correlates with jaw reduction. **Manuscript offers:** Often finite-element analysis showing chin reduces stress. **Verdict:** "Not supported" if paper only shows current utility (e.g., "chin strengthens jaw") without testing alternatives (e.g., why no chin in other primates?). Must rule out exaptation.  
  - **Step 4:** If evidence is strong but adaptationists demand more, this is strategic. **Editorial judgment.**  

  #### **Claim 3: Giraffe neck as an adaptation for high browsing**  
  - **Step 1:** Claim is that the neck evolved by selection for feeding.  
  - **Step 2:** Plausible alternatives: sexual selection (neck used in combat), drift, or allometric constraint.  
  - **Step 3:** **Evidence needed:** Neck length correlates with foliage height *across species* (with phylogeny); fitness advantage for long necks in browsing. **Manuscript offers:** Classic papers show giraffes browse high and neck confers reach. **Verdict: Not supported** per procedure—most studies fail to:  
    - Test sexual selection (longer-necked males win fights).  
    - Rule out exaptation (necks may have been co-opted from combat).  
    - Use phylogeny (okapi have short necks but share ancestors).  
    ***(This is widely accepted but fails Step 3: discrimination evidence lacking.)***  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve fundamental debates:** It won’t settle "adaptationism vs. spandrels" but enforces rigor.  
  2. **Replace expertise:** Referees must know biology (e.g., plausible alternatives); the procedure only structures evaluation.  
  3. **Handle equivocal evidence:** If data is ambiguous (e.g., partial support for multiple hypotheses), it flags this for editorial judgment.  
  4. **Generate new hypotheses:** It assesses what’s presented, doesn’t invent tests.  

  **Final Output for Referees:** A concise report with:  
  - Steps 1–4 answered (with manuscript page numbers).  
  - Clear verdict: "supported," "not supported," or "editorial judgment needed" (with reason).  

  This ensures referees engage the core critique without theory overload, and you get consistent, actionable feedback.
