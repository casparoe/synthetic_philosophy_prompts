prompt: |-
  ok so I'm in Year 12 and I'm the one student rep on my school's academic honesty panel (three teachers plus me, we meet whenever someone gets accused of cheating in coursework). I need help and the meeting's Thursday.

  The way it works is we vote seperately, by majority, on three questions: (a) did the student's work actually match something they didn't write, (b) did they mean to pass it off as their own, and (c) is the student guilty of cheating. Last week a lad had two paragraphs of his history essay matching a website. Most of the panel said yes to (a) and yes to (b) — he clearly did lift it and he clearly knew — but then said no to (c), basically because it's only a couple of paragraphs and everyone does it. So the official record now says he did it, he meant it, and he's not guilty. That's obviously bonkers and two of the teachers agree with me, but the head of year says the rules are the rules and we voted the way we voted.

  There's other stuff I keep going round in circles on. We're four people, so we can tie. One teacher said she'd vote yes on (a) and (b) so she could then vote no on (c) and get the lenient outcome she wanted — which feels like gaming the system but also like exactly what you'd do if you thought the outcome was the thing that mattered. And my physics teacher keeps saying that if each of us is even slightly better than a coin flip then a big enough panel is basically never wrong, which is why we bother voting at all — but we all read the same evidence pack and half of us decide in the first five minutes, so I don't see how we're independent coin flips.

  What I actually have to produce is the short written memo that goes in the case file before Thursday. It needs to recommend a concrete thing for the school to do — both for this case and for how the panel decides in future: do we vote on the three bits first and let the verdict follow from them, do we vote on the verdict and not fuss about the bits, or something else — with reasons the teachers could actually argue with, plus a fair run at the head of year's position since she'll be sitting right there.

  Two asks. Please don't just tell me to write the questions more clearly or to train the panel better; I want an actual answer on which way round the voting should go. And please flag which parts of this are genuinely settled among people who know about it and which are properly contested, because I don't want to stand up and say something's obviously true when the people who study it are still arguing about it. British English please. Last line should be "Verdict:" and then a short label for the decision rule you're telling us to adopt, so I can paste it straight into the file.
reasoning: |-
  Okay, I see the user is a Year 12 student representative on their school's academic honesty panel, facing a dilemma about the voting process. They've encountered an illogical outcome where a student was found to have plagiarized intentionally but was deemed not guilty, and they need to prepare a memo for Thursday's meeting with concrete recommendations.

  The core problem appears to be structural - the panel's three-question voting system (proof of matching content, proof of intent, then guilt) creates contradictions when members vote strategically. The recent case exposed this flaw when teachers voted "yes, yes, no" despite acknowledging plagiarism occurred intentionally. This violates the logical principle that guilt should follow from establishing both elements.

  There seems to be confusion about the panel's purpose. The physics teacher's "coin flip" analogy about collective accuracy misses the point - this isn't about statistical probability but about applying consistent standards. The head of year's "rules are rules" stance ignores that the rules themselves are flawed when they permit illogical outcomes.

  For the memo, I should propose consolidating the vote to a single guilt determination based on evidence, while keeping the elements (a) and (b) as required findings that must both be present for a guilty verdict. This maintains fairness while eliminating contradictions. The recommendation should acknowledge the head of year's valid concern about procedure while showing why this change serves the policy's intent better.

  The user also needs clarity on what's settled versus contested in academic integrity frameworks. It's well-established that intent is necessary for cheating (unintentional plagiarism is poor scholarship but not dishonesty), and that verbatim copying requires attribution. However, "how much" constitutes cheating can be context-dependent - hence the teachers' debate over "just two paragraphs." The voting system should focus on whether any uncredited copying occurred intentionally, not arbitrate degrees.

  I'll structure the memo to first diagnose why the current system fails (using the recent case as example), then propose the consolidated vote approach with reasoning. The "Verdict" line will clearly state the recommended decision rule for easy inclusion in their file. British English will be maintained throughout as requested.
answer: |-
  Here’s a memo draft addressing the structural issues with voting logic, grounded in fairness and practicality, while acknowledging contested areas. Use this as a framework for Thursday:

  ---

  **MEMORANDUM**  
  **To:** Academic Honesty Panel  
  **From:** [Your Name], Student Representative  
  **Date:** [Date]  
  **Subject:** Reform of Panel Voting Procedure - Urgent Review  

  ### 1. Issue with Current Voting Structure  
  The recent case (History essay, 27 June) demonstrates a critical flaw: voting separately on (a) *proof of matching content*, (b) *proof of intent*, and (c) *guilt* permits illogical outcomes. The panel’s votes established the student knowingly submitted unoriginal work (a=Yes, b=Yes) but concluded no guilt (c=No). This contradicts the **definition of academic cheating** in our policy ("presenting others’ work as one’s own with intent"). If (a) and (b) are proven, (c) *must* follow logically. Allowing otherwise undermines:  
  - The panel’s credibility ("bonkers" outcomes).  
  - Consistency in upholding standards ("everyone does it" isn’t a defence).  
  - The policy’s intent.  

  ### 2. The Core Problem: Decoupling Verdict from Findings  
  The current system treats (a), (b), and (c) as independent votes. This enables:  
  - **Strategic voting** (e.g., voting Yes on (a)/(b) to "enable" a No on (c) for leniency).  
  - **Internal inconsistency** (affirming the elements of cheating but denying guilt).  
  Voting should reflect **evidence-based conclusions**, not desired outcomes.  

  ### 3. Proposed Solution: Integrated Voting with Thresholds  
  **Recommendation:** Replace three separate votes with **a single vote on guilt**, informed by mandatory findings on (a) and (b).  
  - **Step 1:** Panel discusses *all* evidence holistically.  
  - **Step 2:** We vote *only* on:  
    > *"Is the student guilty of academic dishonesty in this instance?"*  
  - **Step 3:** For a "Guilty" verdict, the panel **must agree** that:  
    **(a)** The work matches external sources *without attribution* AND  
    **(b)** The student *intended* to present it as their own.  
  - **Tie Handling:** A tie (2-2) = "Not Guilty" (standard burden of proof).  

  ### 4. Why This Works  
  - **Logical Integrity:** Guilt verdict aligns with findings. No more "Yes/Yes/No" paradoxes.  
  - **Efficiency:** One vote streamlines deliberation.  
  - **Fairness:** Maintains high burden of proof (both (a) and (b) required for guilt).  
  - **Deters Gaming:** No separate votes to manipulate. Leniency is addressed at *sanction stage* (e.g., reduced penalty for minor infractions), not by distorting guilt.  
  - **Policy Compliance:** Upholds the academic honesty policy’s definitions while fixing execution.  

  ### 5. Addressing Key Counterarguments  
  - **Head of Year’s "Rules are Rules" Position:**  
    Acknowledged. This proposal *strengthens* rule adherence by ensuring verdicts align with policy definitions. The *spirit* of the rules (fairness, consistency) is broken by the current voting mechanics.  
  - **"Independence" of Votes (Physics Teacher’s Coin-Flip Argument):**  
    Statistical models assume *independent* assessments. Our panel shares evidence packs and deliberates together, creating shared bias. A single vote acknowledges our **shared responsibility** for a coherent verdict.  
  - **"Outcome Matters More Than Process":**  
    Process *ensures* outcomes are just. Strategic voting erodes trust. Leniency can be applied *after* guilt is established (e.g., noting mitigating factors in sanctions).  

  ### 6. Settled vs. Contested Ground  
  - **Settled:**  
    - Academic dishonesty **requires intent** (b). Unintentional poor referencing is a skills issue, not cheating.  
    - Verbatim copying without attribution **(a)** is prima facie evidence of cheating *if* intent is established.  
    - Panels must avoid arbitrariness; consistent **procedures matter**.  
  - **Contested:**  
    - "How much" copying constitutes cheating (2 paragraphs vs. 2 lines) often lacks bright-line rules. Context matters.  
    - Whether panels *should* consider "everyone does it" in verdicts (policy vs. pragmatism debate).  
    - The optimal panel size/balance for accuracy remains debated (hence our 4-person tie issue).  

  ### 7. Action for This Case  
  Reopen the history essay case under the **new procedure**. Vote solely on guilt, requiring agreement on (a) and (b) for a guilty verdict. Sanctions (if any) can then reflect the minor scale.  

  ### 8. Recommendation for Future Cases  
  Adopt the **integrated verdict system** above. Training on "intent" assessment and minor vs. major infractions is advisable but secondary to fixing the voting flaw.  

  **Verdict:** Integrated Verdict with Mandatory Findings  

  ---  

  ### Key Strengths for Your Argument  
  - **Focuses on Logic:** Fixes the "Yes/Yes/No" absurdity head-on.  
  - **Practical:** One vote is faster, harder to manipulate.  
  - **Balanced:** Keeps (a) and (b) as necessary components, just not independent votes.  
  - **Academic Basis:** Cites policy definitions and separates verdict from sanction (where leniency belongs).  
  - **Respectful:** Acknowledges the Head of Year’s valid concern for procedure while showing how the proposal better serves it.  

  This approach is common in legal/disciplinary systems (e.g., "guilt" verdicts requiring proven elements). Stand firm on the principle: *If you agree they copied and intended to deceive, they are guilty by definition. How we sanction them is where mercy belongs.* Good luck!
