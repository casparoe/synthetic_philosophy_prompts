  - **trigger**: "At step 7, if the net burden calculation involves extreme numbers (e.g., trillions of people) or novel units that the panel finds problematic."  
    **who_decides**: "The agency director, with a review by an independent ethicist."  
    **what_they_must_record**: "The rationale for accepting the calculation despite the extremes, and any conditions for approval."

  **known_failure_modes** (array of objects):
  - **failure_mode**: "Panel avoids making the hard value judgment on commensurability (step 6)."  
    **symptom**: "Members try to redefine burdens or benefits to avoid the question, or argue about units instead."  
