  - **failure_mode**: "The 'one more person' slide (step 8) is applied too stringently."  
    **symptom**: "Panel rejects proposals with large net benefits because they are close to zero at the margin."  
    **mitigation**: "Clarify that step 8 is only triggered if a marginal change (one person) would flip the net burden sign; otherwise, it passes."

  **what_the_procedure_cannot_do**:
  - "Resolve deep philosophical disagreements about aggregation; it forces a decision but does not provide the answer."
