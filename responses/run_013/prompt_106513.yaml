prompt: |-
  I chair a standing harm-appraisal panel at a national public-health agency. Three weeks ago I was made chair, after eleven years as an epidemiologist on the panel's staff side, and the remit is now mine to run. Every proposal that reaches us has the same shape: to secure some benefit, the agency would impose either a very small burden on an enormous number of people or a severe burden on a few. The panel must return a recommendation — approve, reject, or approve with conditions — within ten working days, and it must be defensible in public. Our members are competent people with backgrounds in epidemiology, law, and health economics; none of them is a philosopher, and none will read anything I circulate that is longer than a page.

  I have read enough to know that the underlying question has a name in the literature — it is usually introduced as a choice between one person being tortured and an astronomical number of people each receiving a speck of dust in the eye — and that the dispute is not about arithmetic but about whether burdens of different sizes may be summed across persons at all, and if so whether there is any size of burden that may not be traded against any number of smaller ones. I also know that the same structure reappears when what is traded is not a certain small burden but a very small probability of a catastrophe. I do not want an essay adjudicating the dispute. I want a procedure my panel can actually run.

  Act as a decision theorist and practical ethicist who has worked on the aggregation of harms and on decision-making under severe uncertainty. Think carefully before writing. Begin with a short section headed Working notes, no more than 200 words, in which you identify the distinctions that must survive the translation into a usable procedure and the ones you are deliberately dropping; then give the deliverable below. Do not supply citations, reading lists, or names of theories that a reader would have to look up; if you use a term of art, define it inside the step where it appears.

  The procedure must meet these constraints. It must be a fixed sequence of questions the panel asks in the same order every time, with the order itself justified — say what depends on what. For each step it must state what counts as a sufficient answer, what happens when the answer is no, and whether the step turns on a fact the panel can establish or on a value judgment the panel must simply make; steps of the second kind must be marked as such rather than disguised as calculation. It must say where the procedure stops with a rejection, where it hands the matter to an official outside the panel, and what that official must record. It must include a step that forces the panel to declare openly whether it is treating the small and the large burdens as commensurable, rather than smuggling that assumption in through a scoring scheme. It must handle at least these features, because they keep appearing in our cases: burdens that are experienced rather than merely risked; burdens that are correlated across the affected population rather than independent, so that an unknown common mechanism could make all the small burdens large at once; proposals whose headline benefit rests on a very small probability of a very large loss; the slide that occurs when someone asks why one more person should not be added to the small-burden side; and the fact that some burdens are reversible at a cost and others are not.

  Then run the procedure on three cases of your own construction, in the same table. At least one must be a case where the procedure returns a verdict I will not like and where I nonetheless cannot show the procedure was misapplied. At least one must be a case the procedure cannot settle, so that the panel has to decide by vote, and you must say what the vote is actually about.

  Deliver the procedure as a single valid JSON object with exactly these fields:

  - procedure_name (string)
  - preconditions (array of strings): what must be true, or known, before the panel may apply the procedure at all.
  - steps (array of objects, in order), each with: step_number (integer); question (string, phrased as the panel asks it); sufficient_answer (string); if_no (string); kind (one of "fact", "value_judgment", "mixed"); why_this_step_is_here (string, naming the philosophical point the step operationalizes, in one or two sentences).
  - handoffs (array of objects), each with: trigger (string); who_decides (string); what_they_must_record (string).
  - known_failure_modes (array of objects), each with: failure_mode (string); symptom (string, as it would appear in a panel discussion); mitigation (string).
  - what_the_procedure_cannot_do (array of strings).

  Deliver the three cases as a markdown table with exactly these columns: case_id; case_description; step_at_which_resolved; verdict; was_this_a_value_call; what_the_procedure_cannot_settle; how_the_chair_will_dislike_this. Keep every cell under forty words.
reasoning: |-
  We are designing a procedure for a harm-appraisal panel that must evaluate proposals involving trade-offs between small burdens on many and large burdens on few. The procedure must be a fixed sequence of steps, handle key features (burden correlation, small probabilities, the "one more person" slide, reversibility), and explicitly address commensurability.

  Working notes (under 200 words):
  - Must survive: Distinction between experienced burdens vs. risked burdens; correlation of burdens (common shocks); reversibility; explicit commensurability judgment; handling of very small probabilities of large losses; avoiding the "one more person" slide by requiring a clear break.
  - Dropping: Deep philosophical disputes (e.g., whether aggregation is ever permissible). We operationalize by forcing a value judgment on commensurability. We also drop trying to resolve the "astronomical numbers" problem with a fixed cutoff; instead, we flag when numbers are extreme and require a handoff.
  - We are structuring the procedure to first check for "showstoppers" (like irreversible severe burdens) and then force the panel to confront the aggregation question explicitly. The order is: feasibility, then severity and irreversibility, then correlation (common shocks), then probability (for risk cases), then reversibility for the burdens, then commensurability, then the aggregation step, and finally a step to prevent the slide.

  Now, the procedure:

  **procedure_name**: "Harm-Benefit Threshold Procedure"

  **preconditions**: 
  - The proposal has been formally submitted to the panel.
  - The panel has received the required documentation (including burden and benefit estimates, affected populations, and risk assessments).
  - The panel has at least five working days remaining in the ten-day window.

  **steps** (array of objects, in order):

  1. **step_number**: 1  
     **question**: "Is the proposal feasible to implement as described, and are the benefit and burden estimates based on sound and accepted methods?"  
     **sufficient_answer**: "Yes, the agency's technical staff confirm that the proposal is operationally feasible and the estimates are methodologically robust."  
     **if_no**: "Return to the agency for revision; the panel does not proceed."  
     **kind**: "fact"  
     **why_this_step_is_here**: "To ensure we are working with a well-defined and technically sound proposal, avoiding decisions based on flawed data or infeasible plans."

  2. **step_number**: 2  
     **question**: "Is there any individual who would bear a burden that is both severe and irreversible? (Severe burden: one that causes profound and lasting harm, such as permanent disability or loss of life. Irreversible: the harm cannot be undone, even with compensation.)"  
     **sufficient_answer**: "No, no individual faces a severe and irreversible burden."  
     **if_no**: "The panel must reject the proposal. Proceed to step 7 for recording."  
     **kind**: "fact" (with a value element in defining "severe", but we treat it as fact-based because we rely on agency definitions and medical/legal standards)  
     **why_this_step_is_here**: "To establish a bright-line rule against imposing severe irreversible harms on any individual, regardless of benefits to others."

  3. **step_number**: 3  
     **question**: "Could the small burdens, if they occur, be triggered by a common shock such that a single event might cause all of them to become large burdens? (E.g., if the burden is a small risk of an allergic reaction, and then a contaminant makes the allergen universal.)"  
     **sufficient_answer**: "No, the burdens are independent or the common shock scenario is implausible (probability < 1 in 10 million per year)."  
     **if_no**: "The panel must reject the proposal. Proceed to step 7 for recording."  
     **kind**: "mixed" (involves both factual assessment of mechanisms and value judgment on plausibility threshold)  
     **why_this_step_is_here**: "To prevent catastrophic correlation: if small burdens can become large in concert, the proposal risks a hidden catastrophe."

  4. **step_number**: 4  
     **question**: "If the benefit is avoiding a very small probability of a very large loss, is that probability so low that it cannot be meaningfully distinguished from zero given our current knowledge? (We define 'very small' as less than 1 in 10 million per year.)"  
     **sufficient_answer**: "No, the probability is at least 1 in 10 million per year, or the loss is not large enough to qualify."  
     **if_no**: "The panel must reject the proposal. Proceed to step 7 for recording."  
     **kind**: "mixed" (factual probability, but value judgment on what is "meaningfully distinguished from zero")  
     **why_this_step_is_here**: "To avoid decisions driven by infinitesimal risks, which can distort resource allocation and cause panic."

  5. **step_number**: 5  
     **question**: "For the burdens that are reversible, is the cost of reversal included in the proposal and deemed acceptable by the agency?"  
     **sufficient_answer**: "Yes, for all reversible burdens, the proposal includes and funds a reversal mechanism that the agency approves."  
     **if_no**: "The panel must reject the proposal. Proceed to step 7 for recording."  
     **kind**: "fact"  
     **why_this_step_is_here**: "To ensure that reversible burdens are truly reversible and that the cost is accounted for, preventing future harm from non-reversal."

  6. **step_number**: 6  
     **question**: "Does the panel judge that the small burdens and the large burdens (if any remain) are commensurable? That is, can they be traded off against each other in a way that allows adding up the small burdens? (This is a value judgment: if you believe that no number of dust specks can justify torturing one person, then burdens are not commensurable.)"  
     **sufficient_answer**: "Yes, the panel agrees that burdens of different sizes can be aggregated."  
     **if_no**: "The panel must reject the proposal. Proceed to step 7 for recording."  
     **kind**: "value_judgment"  
     **why_this_step_is_here**: "To force an explicit, recorded decision on commensurability, preventing hidden assumptions in aggregation."

  7. **step_number**: 7  
     **question**: "If the proposal is not already rejected, compute the net burden: total burden minus total benefit, both expressed in common units (e.g., QALYs or monetary equivalent). Is net burden negative (i.e., benefits exceed burdens)?"  
     **sufficient_answer**: "Yes, net burden is negative (benefits exceed burdens)."  
     **if_no**: "The panel must reject the proposal."  
     **kind**: "fact" (assuming the common units are agreed and calculation is straightforward)  
     **why_this_step_is_here**: "After establishing commensurability, this step performs the actual aggregation to see if the proposal is net beneficial."

  8. **step_number**: 8  
     **question**: "Could adding one more person to the small-burden group, with the same small burden, change the outcome? (That is, is the net burden so close to zero that a marginal change could flip the sign?)"  
     **sufficient_answer**: "No, the net burden is sufficiently negative (or positive) that one more person would not flip the outcome."  
     **if_no**: "The panel must reject the proposal. Proceed to step 7 for recording."  
     **kind**: "fact"  
     **why_this_step_is_here**: "To prevent the 'one more person' slide by requiring a clear margin, ensuring the decision is robust to small changes."

  **handoffs** (array of objects):
  - **trigger**: "At step 4, if the probability is below 1 in 10 million but the panel believes the case is exceptional and merits approval."  
    **who_decides**: "The agency director, in consultation with the chief scientific officer."  
    **what_they_must_record**: "The justification for overriding the probability threshold, including why this case is exceptional and what alternative safeguards are in place."

  - **trigger**: "At step 6, if the panel is evenly split on commensurability."  
    **who_decides**: "The agency director."  
