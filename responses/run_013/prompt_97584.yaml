  Hmm, the user is a retired experimental physicist who's now refereeing philosophy papers and struggling to evaluate thought experiments. They want a clear, step-by-step procedure to assess what evidential work a thought experiment is doing in a paper, without needing extensive philosophical background. They also want me to apply this procedure to three specific cases and explain its limitations.

  The user has provided a detailed description of their situation. They've transitioned from experimental physics to philosophy and find themselves refereeing papers in philosophy of science. They can follow formal arguments but feel lost with thought experiments, comparing them to instruments that might reveal genuine properties versus just creating vivid effects. This is interesting because it shows how their scientific background influences their philosophical approach – they're sensitive to the difference between genuine evidence and rhetorical persuasion.

  They're asking for a practical, one-page checklist they can use in about 40 minutes per paper. They want ordered questions with clear criteria for sufficient answers, hard stops where the thought experiment isn't doing evidential work, and points where judgment is needed. They specifically mention needing to distinguish counterexamples from positive illustrations, intuitions as data versus theory prompts, and relevant stipulations from persuasive but incidental details.

  I should create a step-by-step procedure that's concise yet comprehensive. The questions need to flow logically: first identify the target concept, then the move being made, then test the stipulations, check for intuition pumping, and finally evaluate the evidence. I'll need to indicate hard stops clearly and mark judgment calls where the referee should defer to others.

  For the three application cases: Gettier cases for knowledge analysis, teleportation for personal identity, and something controversial like Mary's room that might annoy them. For each, I'll run the procedure step-by-step and be transparent about the verdict. For the controversial case, I'll explain why it might be problematic according to the procedure and acknowledge counterarguments.

  I should also outline the procedure's limitations: where it might misfire (like in phenomenological or literature-focused papers), how to spot misfires (when steps feel forced), and which steps involve judgment rather than pure procedure (like identifying irrelevant details).

  The tone should be respectful of their physics background while making philosophy accessible. I'll avoid jargon and keep explanations grounded in their request for practicality. This procedure should empower them to make informed decisions without requiring philosophical allegiance.
answer: |-
  Below is a procedural checklist to evaluate thought experiments (TEs) in philosophy papers. It prioritizes clarity, efficiency, and your physics-honed sensitivity to instrumental fidelity over rhetorical effect. **Hard stops** (🛑) indicate the TE provides no direct evidential weight; assess the paper on other grounds. **Judgment calls** (❓) mean defer to the author's expertise or a colleague if you lack confidence. The core distinctions are **Counterexample vs. Positive Illustration**, **Intuition-as-Data vs. Intuition-as-Prompt**, and **Conceptually Relevant Stipulation vs. Incidental Persuader**.

  ---

  ### The Thought Experiment Evaluation Procedure (TEEP)
  **(Run in order; 5-10 mins per TE)**

  1.  **What is the *Explicit Target Concept* (ETC)?**
      *   *Question:* What single philosophical concept (e.g., "knowledge," "personal identity," "causation") is the TE directly aimed at probing? Find the author's stated claim about the ETC.
      *   *Sufficient Answer:* A clear, quoted phrase or sentence defining the ETC and the specific claim being tested (e.g., "The author claims knowledge is justified true belief. The TE targets this analysis.").
      *   *Hard Stop/Issue:* If no clear ETC or claim is stated, or it's buried/impossible to find quickly. 🛑 *Result:* The TE lacks a defined purpose; evaluate the paper's formal arguments alone.

  2.  **What is the *Alleged Move* (AM)?**
      *   *Question:* Does the author claim the TE acts as a **Counterexample** (showing the analysis of ETC is *wrong* by presenting a case satisfying the conditions but lacking the concept) or a **Positive Illustration** (showing the analysis is *plausible/correct* by presenting a case satisfying the conditions and possessing the concept, or illustrating a mechanism)?
      *   *Sufficient Answer:* A clear statement identifying "Counterexample" or "Positive Illustration" (or synonyms like "refutation," "demonstration," "model").
      *   *Judgment Call:* If the AM is ambiguous or conflated. ❓ *Result:* Flag this ambiguity in your report; the author needs to clarify the intended function.

  3.  **Stipulation Audit: Relevance vs. Incidental Persuasion (SARR-IP)**
      *   *Question:* List every non-trivial stipulation in the TE (e.g., "Smith has 10 coins in his pocket," "The teleporter destroys the original brain," "Mary has never seen color"). For each, ask: **Is this stipulation *logically necessary* to establish the scenario's relevance to the ETC analysis *given the AM*?** Or is it adding vividness, emotional weight, or background detail that *could* be altered without logically changing the core challenge to the ETC?
      *   *Sufficient Answer:* A yes/no for each key stipulation, with a 1-sentence justification for "No" answers identifying the potential persuasive effect (e.g., "Destroying the brain adds horror/drama; logically, 'disassembly' or 'scanning' would suffice for replication challenge").
      *   *Hard Stop:* If **core stipulations necessary for the AM** are **internally inconsistent** or **logically incoherent** with the defined ETC or known science *in a way that fundamentally breaks the scenario*. 🛑 *Result:* TE is broken; it cannot serve as evidence. (Note: Stipulations *challenging* science/semantics are different – see Step 5).
      *   *Judgment Call:* If the line between relevant stipulation and incidental persuader is genuinely blurry *and* crucial to the TE's force. ❓ *Result:* Note the ambiguity; its resolution likely depends on contested intuitions or background theory.

  4.  **Intuition Check: Data or Prompt? (IC-DP)**
      *   *Question:* What specific intuition ("It seems Smith doesn't *know*," "It seems the uploaded copy *is* me," "It seems Mary learns something *new*") is the TE designed to elicit? Does the author treat this intuition as **Data** (a pre-theoretical given that theories *must* explain, anchoring the argument) or as a **Prompt** (a surprising result highlighting a tension, prompting revision/reinterpretation of the ETC or its analysis, without claiming the intuition is indefeasible)?
      *   *Sufficient Answer:* Identification of the target intuition and a clear "Data" or "Prompt" label, supported by author's language (e.g., "obviously," "surely" = Data; "raises a puzzle," "suggests we must reconsider" = Prompt).
      *   *Judgment Call:* If the status of the intuition is unclear or contested *within the paper itself*. ❓ *Result:* Note this; the paper's argument hinges on resolving this ambiguity.

  5.  **Evidential Work Summary (EWS)**
      *   *Question:* Synthesize Steps 1-4: What precise evidential work *is* the TE doing for the AM regarding the ETC?
      *   *Possible Outcomes:*
          *   **Counterexample (Intuition-as-Data):** Provides evidence *against* the proposed analysis of ETC *if* the elicited intuition is widely shared/robust. (Strength depends on consensus and resistance to "explaining away").
          *   **Counterexample (Intuition-as-Prompt):** Highlights a tension/problem for the analysis, prompting theoretical work. Provides evidence *for the existence of a tension*, not directly against the analysis.
          *   **Positive Illustration (Intuition-as-Data):** Provides evidence *for* the plausibility/correctness of the analysis *if* the intuition is strong.
          *   **Positive Illustration (Intuition-as-Prompt):** Illustrates how the analysis *could* work or clarifies a mechanism, prompting further development. Minimal direct evidence for truth.
          *   **Conceptual Clarifier:** Primarily unpacks meanings/implications of the ETC or its analysis, not providing direct evidence for/against truth. (May accompany AM).
      *   *Hard Stop:* If the TE, after audit, serves **only** as rhetoric, analogy, or motivation with no logical bearing on the truth/falsity of the ETC analysis or the existence of a conceptual tension. 🛑 *Result:* TE does no argumentative work; assess the paper's other arguments.
      *   *Judgment Call:* Assessing the *weight* of the evidence (e.g., how widespread is the intuition? How severe is the tension?). ❓ *Result:* Your report should note if the argument *crucially* relies on disputable intuitions or weight assessments.

  ---

  ### Applying TEEP to Three Cases

  **Case 1: Gettier-Style Counterexample (e.g., Ford/Barn Facade County)**
  *   **1. ETC:** "Knowledge" (specifically, the analysis as Justified True Belief - JTB). Claim: JTB is sufficient for knowledge.
  *   **2. AM:** Counterexample (shows JTB without knowledge).
  *   **3. SARR-IP:** Stipulations: Man gets job, boss says "Jones in Ford", man sees Jones drive Ford, man infers "Job-winner in Ford", but *actually* man got job & drives Ford, Jones not hired. *Relevant:* Jones not hired, man actually drives Ford (create false belief from justified inference). *Incidental Persuader:* "Boss said" (could be note, rumor), "County full of facades" (vivid, but logically only *one* facade needed; excess drama might inflate intuition).
  *   **4. IC-DP:** Intuition: "The man has JTB but does *not know* the job-winner drives a Ford." Treated overwhelmingly as **Data** (the rock JTB analysis founders upon).
  *   **5. EWS:** **Counterexample (Intuition-as-Data).** Strong evidence *against* JTB being sufficient, relying on the robustness of the "no knowledge" intuition. *TEEP Verdict:* TE doing core argumentative work as a counterexample.

  **Case 2: Teleportation/Uploading (e.g., Star Trek style destruction/reassembly)**
  *   **1. ETC:** "Personal Identity" (specifically, persistence over time). Claim: Identity requires physical/biological continuity (target of TE).
  *   **2. AM:** Counterexample (or illustration for rival view). (Aim: Show identity *can* persist without physical continuity).
  *   **3. SARR-IP:** Stipulations: Original destroyed, perfect copy created elsewhere from scan. *Relevant:* Destruction of original, creation of qualitatively identical copy elsewhere. *Incidental Persuaders:* "Teleporter pad," "beaming," "molecule-by-molecule" - SF tech adds vividness/sci-fi plausibility veneer; logically, "instantaneous scanning/destruction/assembly" suffices. "Feels like me" reports add psychological weight.
  *   **4. IC-DP:** Intuition: "The reassembled person *is* me" / "I would step into the teleporter." Often treated as **Data** for psychological continuity theories or **Prompt** to rethink physical continuity. (Status often contested *in* papers).
  *   **5. EWS:** **Counterexample (Intuition-as-Data/Prompt)?** ❓ *Judgment Call Needed:* Does the author treat the "it's me" intuition as decisive data against physical continuity, or as a puzzle prompting theory revision? The *weight* of the intuition is highly contested (is it fear of death biasing us? Does "copy" feel different if original isn't destroyed?). *TEEP Verdict:* TE highlights a tension/problem for physical continuity views, but its force as a *counterexample* depends critically on contested intuitions and their interpretation. Flag this dependence.

  **Case 3: Controversial Case - Jackson's Mary (The Knowledge Argument)**
  *   **1. ETC:** "Physicalism" (claim: All facts are physical facts). TE targets the completeness of physical knowledge.
  *   **2. AM:** Counterexample (Mary learns a new fact upon seeing red; thus, non-physical facts exist).
  *   **3. SARR-IP:** Stipulations: Mary knows *all* physical facts about color vision from b&w room, sees red tomato upon release. *Relevant:* "All physical facts," "never experienced color." *Incidental Persuaders:* "Black and white room," "neuroscientist," "tomato" - vivid but logically incidental. Key relevant stipulation: "Knows *all* physical facts" is **highly contestable**. Does "knowing the facts" include *only* propositional knowledge, or embodied/experiential understanding? This is the crux.
  *   **4. IC-DP:** Intuition: "Mary learns *something new* when she sees red." Treated as **Data** (proving a non-physical fact).
  *   **5. EWS:** **Hard Stop? Judgment Call?** 🛑 **❓** *TEEP Verdict (Likely to Annoy):* The critical stipulation "knows *all* physical facts" is **incoherent or question-begging** *if* "knowing what it's like" (the new thing Mary learns) is argued *by physicalists* to *be* a physical fact *or* a specific mode of accessing/knowing physical facts, not a separate non-physical fact. The TE *assumes* that knowing all physical facts doesn't include knowing what it's like, which is precisely what physicalists deny. **🛑 The TE, as a counterexample relying on intuition-as-data, fails because a core stipulation necessary for the counterexample is fundamentally contested *by the target theory itself* in a way that breaks the logic.** It functions more as rhetoric for anti-physicalism or a **Prompt** to clarify the nature of phenomenal knowledge within physicalism. *What a Disagreeing Proponent Would Say:* "The intuition that Mary learns something genuinely *new* (a fact) is pre-theoretically obvious and devastating. Physicalists trying to redefine 'fact' or 'knowing' are just evading the argument. The stipulation is clear: Mary has the complete *physical* science. The phenomenal fact isn't captured by it." *Feature Driving Verdict:* The contestability of "knows all physical facts" as including or excluding phenomenal knowledge. TEEP flags this as a broken or question-begging stipulation for a counterexample claim.

  ---

  ### What TEEP Cannot Do (Limitations & Failure Modes)

  1.  **Evaluating Intuition Weight/Consensus:** TEEP identifies *if* an intuition is treated as data, but not *how strong* that data is. Judging robustness requires field experience. TEEP helps you *spot* reliance on disputed intuitions (Step 4/5), not resolve them.
  2.  **Pure Phenomenology or Conceptual Analysis without "Moves":** Papers focused solely on describing lived experience or meticulously unpacking concepts using TEs without making a clear "move" (Step 2) might trigger a Hard Stop prematurely. TEEP needs an argumentative target. *Misfire Sign:* Steps 1/2 feel forced; the TE seems descriptive/exploratory. *Mitigation:* See if the TE clarifies the ETC itself (EWS "Conceptual Clarifier").
  3.  **Complex Interdependence:** If a paper's argument relies on a *chain* of TEs or the TE is deeply interwoven with formal logic/historical exegesis, isolating it in 10 mins with TEEP might oversimplify. *Misfire Sign:* Applying TEEP feels artificial or misses the core synergy of arguments. *Mitigation:* Use TEEP on the *key* TE, note complexity in report.
  4.  **"Intuition Pumps" Done Well:** Some TEs are masterful rhetoric designed to shift perspectives. TEEP might correctly identify them as doing little *direct evidential* work (Hard Stop 🛑), but they might still be philosophically valuable. TEEP judges argumentative function, not overall value.
  5.  **Highly Technical/Field-Specific TEs:** If the ETC or AM relies deeply on niche formalism or sub-field debates you lack background in, TEEP's steps (especially 1, 2, 3) might be hard to complete confidently. *Misfire Sign:* You can't articulate the ETC/AM clearly even after reading. *Mitigation:* Judgment Call ❓ - defer to specialist.
  6.  **Judgment Calls Dressed as Procedure:** Key steps inherently involve judgment:
      *   **Step 3 (SARR-IP):** Distinguishing relevant stipulations from persuaders is often contextual and debatable.
      *   **Step 4 (IC-DP):** Classifying the author's use of intuition (Data/Prompt) can be ambiguous.
      *   **Step 5 (EWS):** Assigning the final evidential role often synthesizes contestable judgments from earlier steps. TEEP makes these judgment points explicit (❓) but doesn't eliminate the need for your informed discretion.

  TEEP provides a structured interrogation to demystify the TE's machinery and expose its argumentative engine (or lack thereof), leveraging your instinct for distinguishing signal from noise. Its strength is clarity and efficiency; its limitation is the inherent role of philosophical judgment in applying it.
