prompt: |-
  I chair the selection committee for a small fellowship program. Five of us, all volunteers, nobody with any training in this sort of thing; we read about ninety applications a year, meet for one long afternoon, and give out ten awards. The applicants have made plans around our answer, so it matters to them, while the cost to us of getting it wrong is mostly that we never find out. We are not allowed to ask applicants for anything beyond what they have already sent me, and I cannot add meetings. What I can do is send out a form beforehand and run the afternoon differently. The decisions go out over my signature, and the program director could in principle veto them, though in nine years she never has.

  What I keep noticing is that we agree far too quickly. The first two people to speak set a tone and the rest of us fall in behind it, often without anyone having said much of anything; afterwards, reading my own notes against the sealed rankings we tried last year, I saw that I had marked someone low and then voted for them. I went looking for an explanation and found the idea that this can be rational rather than lazy: once enough other people have gone the same way, each of us can reasonably stop using what we ourselves know, and that this can happen after surprisingly few people have spoken, and that it can be undone again by a single person's private information. I think that is roughly what happens to us, but I may well have it wrong, and I would like you to correct me if I do.

  I want a procedure I can actually run, written for people who have never heard any of this: the steps in order, what counts as a sufficient answer to each, where the procedure stops and says no, and where it hands the decision to me as chair because the question is one of values rather than facts. It has to fit inside the afternoon we already have. Please make it handle the things I am most worried about.

  - Whether five of us agreeing is five pieces of evidence or one. Nearly all of our agreement traces back to the same two letters of recommendation and the same ranking site. I need a rule for tracing a run of agreement back to its sources and collapsing it when it is really one signal wearing five hats, and for telling that case apart from agreement that is genuine, whether because people changed their minds when someone gave a reason or because we arrived at the same place separately.
  - How to get at what people actually think rather than what they are willing to say, given that nobody wants to be the one who holds up the afternoon.
  - What an individual panelist should do when they find themselves going along with a run of decisions they privately doubt: how strong their own contrary information has to be before they should speak, and what they should do when they cannot put any number on it.
  - What to do about the fact that whatever mechanism produced our agreement could just as easily run the other way, so that a sudden reversal is not by itself evidence that we were wrong the first time, or that we are wrong now.
  - Whether the order in which we speak, or the moment when I as chair say what I think, changes any of this.

  Then run the procedure on three cases: a year where the first four speakers agree and the fifth has a nagging reservation they cannot put into words; a year where we all agree and it turns out we should trust that agreement; and the case I would rather not hear, which is that we should reopen last year's decisions.

  Finally, tell me honestly where the procedure will misfire, which of its steps are judgment calls dressed up as procedure, and which two or three questions it cannot settle at all — those I will have to decide myself, and I would like to know which way you would lean and why.
reasoning: |-
  We are facing a classic problem of group decision-making where early agreement can lead to premature consensus, potentially overlooking valuable private information held by individual members. The key is to design a procedure that encourages independent thinking and surfaces private information without adding meetings or burdening the volunteers.

  The core idea from the literature is that of "herding" or "information cascades": once a few people have expressed a view, others might ignore their own information and follow, even if their private information suggests otherwise. This can be mitigated by:
  1. Ensuring that each member commits to their independent assessment before hearing others.
  2. Structuring the discussion to focus on reasons and evidence, not just positions.
  3. Creating an environment where dissent is safe and valued.

  Proposed Procedure:

  Step 0: Preparation
  - Send out a form (via email or online) to each committee member at least one week before the meeting. The form should have:
      a) A list of all applicants (by ID, to avoid bias from names).
      b) For each applicant, each member must provide:
          - A preliminary score (e.g., on a scale of 1-5, where 5 is best) and a brief note on why.
          - A flag for any applicant they feel particularly strongly about (positive or negative) and a one-sentence reason.
      c) A reminder that they should base their scores on the entire application and their own judgment.

  Step 1: Independent Scoring (Before the meeting)
  - Each member fills out the form independently and returns it to the chair (you) by a deadline (e.g., 3 days before the meeting).
  - You, as chair, will:
      - Collate the scores for each applicant, noting the average and the range.
      - Identify applicants where there is strong consensus (e.g., all scores 4 or 5, or all 1 or 2) and those with high disagreement (e.g., scores ranging from 1 to 5).

  Step 2: Meeting Structure
  - The meeting will be divided into two phases: 
      Phase 1: Review of the top and bottom tiers (based on pre-meeting scores) and discussion of high-disagreement cases.
      Phase 2: Final ranking and selection.

  Step 3: Phase 1 - Discussion of Key Cases
  - Start with the applicants that had the highest disagreement in pre-meeting scores. For each:
      - Present the range of scores without revealing who gave which score.
      - Ask each member, in turn (in a fixed order that rotates per applicant), to state their score and the most important reason for that score (from their pre-meeting notes). 
      - After everyone has spoken, open the floor for discussion. The goal is to understand the evidence and arguments.
      - Then, have a second round of scoring (by show of fingers, or written if preferred) for just this applicant. If the disagreement reduces, move on. If not, note it for Phase 2.

  - Then, review the top tier (e.g., average score above 4.0) and bottom tier (average below 2.0). For these, the goal is to confirm the consensus. For each applicant in the top tier:
      - Ask if any member has a serious reservation. If so, they must state it (with reason). Then, the group discusses briefly. If the reservation is serious, move the applicant to the "discussion" pile for Phase 2. Similarly for the bottom tier.

  Step 4: Phase 2 - Building the Final List
  - Now, you have:
      - A list of applicants with strong consensus (top and bottom tiers that passed without reservation).
      - A list of applicants that need discussion (from the high-disagreement group and any moved out of the top/bottom tiers).
      - The rest (the middle) is less critical but might be revisited.

  - For the discussion list, take each applicant one by one. 
      - Start by having each member state their current position (e.g., "I am a yes", "no", or "undecided") and one key reason. Do this in a fixed order (rotating per applicant so the same person isn't always first).
      - Then, open discussion focusing on the evidence and the reasons given. 
      - After discussion, take a secret ballot (each writes their score or vote). 
      - If the group is still split, the chair may call for a majority vote or, if time is short, use the average score to break the tie.

  - Build the list of top 10 by starting with the top tier and then adding from the discussion list in order of average score (after the second vote) until you have 10.

  Step 5: Final Check
  - Review the list of 10 and the next 5 (in case of ties or last-minute issues). For each selected applicant, ask: "Is there any reason we should not award this person?" This is to catch any last reservations.

  Handling Your Concerns:

  1. **Collapsing Agreement to Common Sources**:
     - The pre-meeting form forces independent assessment. When agreement happens, note the reasons. If multiple members cite the same source (e.g., a particular letter), then it's one signal. If they cite different aspects (e.g., one cites the letter, another the project plan), then it's multiple. During discussion, ask: "What in the application led you to that view?" and note the sources.

  2. **Getting True Opinions**:
     - The pre-meeting form captures initial independent thought. The structured discussion (with everyone speaking in turn) ensures everyone is heard. Secret ballots prevent bandwagoning. Also, the chair should explicitly state that dissent is welcome and that it's better to speak up now than regret it.

  3. **When to Speak with Private Doubt**:
     - Tell panelists: If you have information that others might not have noticed (even if you can't quantify it), you should speak. The threshold is low: if you feel uneasy, state it. The procedure (especially the pre-meeting form and the turn-based speaking) creates opportunities.

  4. **Reversals**:
     - A reversal is just new information surfacing. The procedure is designed to surface private information. If a reversal happens, it means the new information was previously hidden. Trust the process.

  5. **Order of Speaking**:
     - Rotate who speaks first per applicant. Also, the chair should speak last in the initial rounds to avoid anchoring.

  Running the Procedure:

  Case 1: First four agree, fifth has a nagging reservation without words.
  - In the pre-meeting form, the fifth member might have given a lower score or flagged the applicant. During the discussion of that applicant (if it's in the top tier or high-disagreement), the fifth member will have a turn to speak. They can say: "I have a reservation but I can't quite put it into words. I just feel uneasy about [something]." Then the group can examine that aspect. If it's not resolved, it might lead to a lower ranking.

  Case 2: All agree and we should trust it.
  - The pre-meeting form will show strong consensus. The procedure quickly confirms it in Phase 1 (top tier) without much discussion. This saves time.

  Case 3: Reopening last year's decisions?
  - The procedure is for current applications. Reopening past decisions is not recommended because:
     a) The applicants have already acted on the outcome.
     b) Without the same committee and without the same pre-meeting process, it would be unfair.
     c) The focus should be on improving the current process.
     If there is a systematic error (like a bad letter writer), address that for the future.

  Limitations and Judgment Calls:

  1. **Misfires**:
     - The pre-meeting form might not be filled independently (if members discuss beforehand). Emphasize independence.
     - The procedure might take longer than the current one. To mitigate, set time limits per applicant in discussion.
     - Some members might still be reluctant to dissent. The chair must create a safe environment.

  2. **Judgment Calls Dressed as Procedure**:
     - How to handle an applicant with a split vote? The chair decides the tie-breaking method (e.g., average score, majority, or chair's casting vote).
     - What counts as a "serious reservation"? The chair must rule if an objection is substantive enough to move an applicant out of the top tier.

  3. **Unsettled Questions**:
     a) How to weigh different criteria (e.g., letters vs. project)? The procedure doesn't set weights. The chair must remind members of the program's goals.
     b) What if two applicants are tied for the last spot? The chair might break the tie by considering diversity, program priorities, etc.
     c) How to handle a member who consistently disagrees? The chair must ensure they are heard without letting them dominate.

  For these, as chair, you should:
     - For weights: At the start of the meeting, remind the committee of the program's mission and criteria.
     - For ties: Have a clear tie-breaker rule (e.g., higher score in a specific criterion, or chair's decision) announced at the beginning.
     - For difficult members: Speak privately during a break to understand their concerns and encourage constructive input.

  Your Leaning:
     - I would lean toward transparency and independence. The pre-meeting form and structured discussion are key. 
     - For tie-breaking, I would use the average of the second vote (after discussion) because it reflects the group's considered view.

  This procedure should help by capturing independent judgments, forcing discussion on contentious cases, and reducing the influence of early speakers.
answer: |-
  Below is a step-by-step procedure designed to address your core concerns: premature consensus, hidden dissent, and the risk of collapsing multiple agreements into a single biased signal. It fits into your existing afternoon meeting and requires no additional time. The procedure is written for committee members unfamiliar with group dynamics theory—focus on clarity and actionable steps.

  ### **Pre-Meeting Setup (Done by You as Chair)**
  1. **Send a Form to Committee Members 1 Week Before the Meeting**:  
     - The form lists each applicant by a randomized ID (to avoid name bias). For each applicant, ask:  
       - *Score*: Rate from 1 (weak) to 5 (strong) based solely on the application materials.  
       - *Confidence*: "How confident are you in this score?" (Low/Medium/High).  
       - *Key Reason*: "What one piece of evidence (e.g., letter, project detail) most influenced your score? Be specific (e.g., 'Dr. X's letter, paragraph 2')."  
       - *Flag*: "Mark if you have a strong reservation or endorsement that isn't captured above."  
     - **Why this works**: Forces independent assessment, surfaces private insights early, and helps you identify overlapping evidence sources.  

  2. **Pre-Meeting Analysis (You Alone)**:  
     - Collate responses. Highlight:  
       - Applicants with low score disagreement (e.g., all scores within 1 point) → *Tentative consensus*.  
       - Applicants with high disagreement (e.g., scores spanning 3+ points) → *High-priority discussion*.  
       - "Collapsed signals": If >2 members cite the *same exact evidence* (e.g., "Professor Y's letter"), note this as a single-source bias risk.  
       - "Unique signals": If members cite different evidence (e.g., one cites a letter, another cites the project timeline), note this as independent agreement.  

  ---

  ### **Meeting Procedure: Step-by-Step**  
  **Time Allocation**: 90 minutes for discussion (adjust per applicant volume), 30 minutes for voting. Use a timer.  

  #### **Phase 1: Initial Review (30 Minutes)**  
  *Goal: Surface disagreements and isolate "collapsed signals."*  
  1. **Start with High-Disagreement Applicants**:  
     - Present each high-disagreement applicant (from your pre-meeting analysis).  
     - **Ask each member in random order**: "What was your score, and what specific evidence led to it?"  
       - *Sufficient answer*: Must reference concrete evidence (e.g., "I scored 2 because the timeline in Section 3 is unrealistic").  
       - *Insufficient answer*: Vague praise/criticism (e.g., "Seems weak"). Redirect: "Point to the evidence."  
     - **Chair Action**: Listen for:  
       - *Collapsed signals*: If ≥3 members cite the same evidence (e.g., the same letter), announce: "We’re overweighting [evidence]. Let’s discuss other aspects."  
       - *Unique signals*: If evidence varies, note: "We have diverse perspectives here."  

  2. **Review Tentative Consensus Applicants**:  
     - Present each applicant with pre-meeting consensus (e.g., all scores 4–5).  
     - **Ask**: "Does anyone have a strong reservation not already raised? If so, what *new evidence* are you adding?"  
       - *Sufficient reservation*: Must reference unmentioned evidence (e.g., "The budget doesn’t account for X").  
       - *Insufficient reservation*: "I just feel uneasy." Respond: "Without new evidence, we’ll keep consensus."  
     - **Chair Action**: If no new evidence, flag as "provisional consensus" and move on.  

  #### **Phase 2: Blind Vote & Discussion (45 Minutes)**  
  *Goal: Uncover hidden dissent and reassess rushed agreements.*  
  1. **Blind Score Re-Vote**:  
     - For all applicants not yet in "provisional consensus," members privately re-score (1–5) on slips of paper.  
     - **Chair Tally**: Calculate average score. Identify:  
       - *New disagreements*: Applicants with scores spanning ≥3 points.  
       - *Stable agreements*: Applicants with scores within 1 point.  

  2. **Focused Discussion for New Disagreements**:  
     - **Chair Instruction**: "We’ll discuss Applicant X. Everyone *except* the highest and lowest scorers speak first."  
       - *Why*: Prevents anchoring by extremes and pressures the middle to voice doubts.  
     - **Ask each (in random order)**: "What evidence made you unsure?"  
       - *Sufficient answer*: References specific application sections.  
       - *Insufficient*: General feelings → skip after one prompt.  
     - **Chair Action**: After discussion, re-tally scores. If disagreement persists, you decide (see "Chair Decisions" below).  

  #### **Phase 3: Final Ranking (15 Minutes)**  
  *Goal: Lock decisions without groupthink.*  
  1. **Rank Applicants**: List all by average score (from Phase 2). Adjust rankings if:  
     - A "provisional consensus" applicant had a reservation with *new evidence* (from Phase 1).  
     - A high-disagreement applicant now has consensus.  
  2. **Top 10 Selection**: Take the top 10 by average score. If ties, prioritize applicants with:  
     - Fewer "collapsed signals" (more diverse support).  
     - Higher confidence scores (from pre-meeting forms).  
  3. **Final Check**: "Any last reservations based on *unreviewed evidence*?" If yes, discuss briefly.  

  ---

  ### **How the Procedure Handles Your Concerns**  
  1. **Collapsed vs. Genuine Agreement**:  
     - *Rule*: Agreement is "collapsed" if ≥3 members cite the same evidence (e.g., the same letter). "Genuine" if evidence sources vary.  
     - *Procedure*: Chair flags this in Phase 1 and forces discussion of other evidence.  

  2. **Getting True Opinions**:  
     - Pre-meeting forms capture raw impressions.  
     - Blind voting and "middle-first" discussion reduce social pressure.  
     - *Rule*: Members must cite evidence, not feelings.  

  3. **When to Speak with Private Doubts**:  
     - *Rule for Panelists*: Speak if your doubt is tied to specific evidence (no need to quantify). If you can’t articulate it, say: "I scored this low but can’t pinpoint why—suggest we discuss [section]."  
     - *Chair Action*: Allocate 60 seconds for the group to examine that section.  

  4. **Sudden Reversals**:  
     - *Rule*: A reversal is valid only if backed by new evidence. If scores flip without new input, retain the original score.  
     - *Procedure*: Pre-meeting forms and blind votes anchor initial positions, making reversals evidence-based.  

  5. **Order of Speaking**:  
     - *Rule*: Randomize order per applicant. Chair speaks last in discussions to avoid anchoring.  

  ---

  ### **Running the Procedure: Three Cases**  
  **Case 1: First Four Agree, Fifth Has Nagging Reservation**  
  - Pre-meeting form: Fifth member flags the applicant with a low-confidence score.  
  - Phase 1: You identify the applicant as "tentative consensus" but note the fifth member’s flag.  
  - Phase 2: Blind vote likely shows a split (e.g., four 4s, one 2). Discussion starts with the fifth member: "I can’t articulate it, but the methodology section feels off." Group spends 60 seconds reviewing methodology. If concerns arise, scores adjust. If not, original consensus holds.  
  - **Outcome**: The reservation is aired without derailing the meeting.  

  **Case 2: All Agree and We Should Trust It**  
  - Pre-meeting analysis shows high consensus + diverse evidence sources (e.g., one cites letters, another cites project design).  
  - Phase 1: You announce: "Consensus is genuine—multiple independent reasons." Little discussion needed.  
  - **Outcome**: Quick approval, preserving time.  

  **Case 3: Reopening Last Year’s Decisions?**  
  - **Procedure says no**: The process is designed for new applications. Revisiting past decisions without pre-meeting data or fresh evidence risks bias.  
  - **Chair Action**: If systemic errors emerged (e.g., a referee was biased), address it in *future* cycles (e.g., "We’ll double-check letters from Dr. Z").  

  ---

  ### **Where the Procedure Misfires and Judgment Calls**  
  **Misfires**:  
  - **Overly vague reservations**: If a member says, "I don’t like it," and can’t cite evidence, the procedure may ignore valid intuition.  
    - *Mitigation*: In Phase 1, ask: "What part of the application made you uneasy?"  
  - **Time constraints**: Complex applicants may need more discussion than allocated.  
    - *Mitigation*: Cap discussion at 3 minutes per applicant. If unresolved, you decide.  
  - **"Collapsed signal" false positives**: Agreeing on the same evidence isn’t always bad (e.g., a damning letter is objectively strong).  
    - *Mitigation*: Only flag if evidence is subjective (e.g., "Dr. X is brilliant") vs. objective (e.g., "Applicant failed to submit budget").  

  **Judgment Calls Dressed as Procedure**:  
  1. **What counts as "new evidence"?**  
     - *Example*: A member says, "The letter from Dr. Y is misleading." Is this "new" if Dr. Y was cited before?  
     - *Chair Decision*: Call it "new" only if it critiques the *validity* of the evidence (e.g., "Dr. Y exaggerates"). Lean toward accepting it—better to over-scrutinize than overlook bias.  
     - *Why*: Prevents "collapsed signals" from burying problems.  

  2. **Handling persistent disagreements after discussion**:  
     - *Procedure*: You break ties using the average score.  
     - *Reality*: This may override minority views with strong evidence.  
     - *Chair Decision*: If the dissenter’s evidence is unique (e.g., field-specific insight), override the average and exclude the applicant. Lean toward trusting unique expertise.  

  **Questions the Procedure Can’t Settle (You Decide)**:  
  1. **Values vs. facts conflicts**:  
     - *Example*: Two applicants have identical scores, but one aligns more with the program’s ethos (e.g., community impact vs. academic rigor).  
     - *Chair Decision*: You choose based on the program’s mission. I’d lean toward impact if the fellowship prioritizes real-world change—values are your domain as chair.  

  2. **Ambiguous evidence**:  
     - *Example*: A letter says, "Applicant is resilient," but doesn’t explain. Some see this as praise; others as a red flag.  
     - *Chair Decision*: Call it "weak evidence" and ignore it. I’d lean toward discounting it—ambiguous evidence fuels groupthink.  

  3. **Member conflict**:  
     - *Example*: Two members clash over an applicant, derailing discussion.  
     - *Chair Decision*: Interrupt and put it to a blind vote. I’d lean toward cooling tensions—maintaining trust matters more than one applicant.  

  ---

  ### **Why This Works for Your Context**  
  - **Fits your constraints**: No extra meetings; uses your afternoon efficiently.  
  - **Safe for volunteers**: Evidence-based discussion reduces social risk. The blind vote and randomized speaking order minimize pressure.  
  - **Targets your worries**: Explicit rules for "collapsed signals," dissent, and reversals prevent over-trusting early speakers.  
  - **Accountable**: You retain final say on judgment calls, but the procedure forces transparency.  

  **Final Tip**: Start the meeting by saying: "Our goal isn’t speed—it’s ensuring no good applicant is missed because we rushed. If you doubt, speak; your insight might be the only one who sees it." This frames dissent as collaboration, not obstruction.  

  If you adapt this, test it in your next meeting and refine based on what stalls or feels unnatural. Your awareness of the problem is 90% of the solution—this just gives you scaffolding.
