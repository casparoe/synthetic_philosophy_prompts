prompt: |-
  I am a retired atmospheric physicist and, since retiring, I have been reading philosophy of science and decision theory. I sit as a lay member on the national scientific advisory council. The council is revising its protocol for cases in which accredited experts disagree after examining the same evidence. Our current rule says that such disagreement is prima facie evidence that at least one expert is irrational, biased, or acting in bad faith, because if the experts had a common prior and their posterior probabilities were common knowledge, those posteriors would have to coincide. The chair now wants to apply the rule to an upcoming assessment of a low-probability, high-consequence risk: two careful experts have reached different conclusions, and the chair proposes to discount the dissenting expert's testimony on the ground that the disagreement itself shows he must have made an error. I am not persuaded, but I need to give the council a written opinion it can act on. Please draft that opinion. It should recommend whether to retain, revise, or abandon the rule, and set out a concrete procedure for the upcoming case with a clear deadline. It should engage the strongest version of the chair's position, explain what the rule assumes about common priors, common knowledge, and rationality, and say what follows when the disagreement concerns the choice of prior itself rather than the updating. It should also address whether the council can legitimately treat a dissenting expert's testimony as evidence of error without first establishing that the relevant assumptions hold. Please write in British English, and keep the opinion suitable for circulation to a non-specialist council.
reasoning: |-
  We are addressing a protocol that assumes disagreement among experts (with common prior and common knowledge of posteriors) implies irrationality, bias, or bad faith. However, we must consider several factors: the possibility of different priors, the absence of common knowledge, and the fact that updating might be based on different interpretations of evidence.

   The chair's position relies on Aumann's agreement theorem, which states that if two agents have the same prior and their posteriors are common knowledge, then they must have the same posterior. The theorem assumes:
   1. Common prior: both experts start with the same probability distribution over the states of the world.
   2. Common knowledge of posteriors: each expert knows the other's posterior, and knows that the other knows, and so on ad infinitum.
   3. Rational updating: both update by Bayesian conditioning.

   But in practice, these conditions are rarely met. In particular:
   - Experts may have different priors because they have different background knowledge or interpret the same background differently.
   - Common knowledge of posteriors is hard to achieve: it requires an infinite chain of mutual knowledge which is unrealistic.
   - The updating process might involve different interpretations of the evidence, leading to different likelihoods.

   Moreover, the disagreement might be about the prior itself. The rule does not account for legitimate differences in prior probabilities.

   Therefore, the current rule is too strict. Disagreement does not necessarily imply irrationality, bias, or bad faith.

   Proposed revision:
   We should abandon the rule in its current form and replace it with a more nuanced approach.

   For the upcoming case:
   - We should require both experts to document their reasoning, including:
       a) Their prior probabilities and how they were formed.
       b) The evidence they considered and how they updated (i.e., their likelihoods).
       c) Any assumptions they made.

   - The council should then convene a meeting (or a series of meetings) with both experts to discuss:
       i) The points of agreement and disagreement.
       ii) Whether the differences lie in the priors, the interpretation of evidence, or the updating process.
       iii) The sensitivity of the conclusions to the choice of prior.

   - The council should then issue a report that:
       - Acknowledges the disagreement and the reasons for it.
       - Does not discount either expert without evidence of actual error (e.g., mathematical mistake, clear bias, or failure to consider relevant evidence).
       - If possible, provides a range of probabilities that reflects the uncertainty.

   Deadline: Given the upcoming assessment, we should set a deadline for the documentation from the experts within two weeks. The meeting should be held within the following week, and the council's report should be issued one week after the meeting.

   Regarding the chair's proposal to discount the dissenting expert: without establishing that the conditions of common prior and common knowledge hold, the disagreement alone is not evidence of error. Therefore, the council should not discount the dissenting expert on that basis.

   Conclusion: Abandon the current rule. Adopt the procedure above for the upcoming case and develop a revised protocol for future disagreements that accounts for the possibility of legitimate differences.

   Draft opinion:

  **OPINION ON THE PROTOCOL FOR EXPERT DISAGREEMENT**

  **To: National Scientific Advisory Council**
  **From: [Your Name], Lay Member**
  **Date: [Current Date]**

  **Subject: Revision of Protocol for Handling Expert Disagreement and Procedure for Upcoming Assessment**

  **1. Introduction**

  This opinion addresses the Council's protocol for cases where accredited experts disagree after examining the same evidence. The current rule treats such disagreement as *prima facie* evidence that at least one expert is irrational, biased, or acting in bad faith, based on the argument that if experts shared a common prior and their posterior probabilities were common knowledge, then their posteriors would necessarily coincide. I have considered the strongest version of this position, which draws upon a theorem in decision theory (Aumann's agreement theorem). However, I recommend that the Council abandons this rule and adopts a more nuanced approach. This opinion explains why, and sets out a concrete procedure for the upcoming assessment of a low-probability, high-consequence risk.

  **2. Critique of the Current Rule**

  The current rule relies on assumptions that are often not met in practice:

  - **Common Prior**: The theorem requires that both experts begin with identical prior probability distributions. However, in complex scientific matters, experts may legitimately hold different prior beliefs due to variations in their background knowledge, interpretation of historical data, or theoretical commitments. The rule does not account for this.

  - **Common Knowledge of Posteriors**: The theorem requires that each expert's posterior probability is common knowledge between them. This means not only that each knows the other's posterior, but also that each knows that the other knows, and so on. Achieving such common knowledge is practically impossible in real-world settings.

  - **Rational Updating**: The theorem assumes that both experts update their beliefs by strict Bayesian conditioning. However, the process of updating may involve subjective judgments about the relevance and reliability of evidence, leading to different likelihoods.

  Moreover, the current rule fails to distinguish between disagreements that arise from the updating process (which might be due to errors) and those that stem from the choice of prior (which may be legitimate). In the upcoming case, the disagreement might well be about the prior, and discounting an expert without examining the basis of their prior would be unjustified.

  **3. Legitimacy of Treating Disagreement as Evidence of Error**

  The Council cannot legitimately treat a dissenting expert's testimony as evidence of error without first establishing that the conditions of the theorem hold. In the absence of a verified common prior and common knowledge of posteriors, the disagreement itself does not imply that either expert has erred, let alone that they are irrational, biased, or acting in bad faith. Therefore, the current rule risks unfairly discrediting a legitimate perspective.

  **4. Recommendation for the Rule**

  I recommend that the Council **abandons the current rule** and replaces it with a protocol that:

  - Recognises that expert disagreement can arise from legitimate differences in prior probabilities, interpretation of evidence, or assessment of uncertainties.
  - Requires a structured dialogue between experts to elucidate the sources of disagreement.
  - Does not penalise dissent without specific evidence of error (e.g., mathematical miscalculation, failure to consider key evidence, or clear conflict of interest).

  **5. Procedure for the Upcoming Assessment**

  For the upcoming assessment, I propose the following steps:

  1. **Documentation (Deadline: Two weeks from today)**  
     Both experts must provide written documentation of their reasoning, including:
     - The prior probabilities they adopted and the rationale for these priors.
     - The evidence they considered and how they updated their beliefs (including the likelihoods they assigned to the evidence).
     - Any key assumptions and their justifications.

  2. **Structured Dialogue (To be held within one week after documentation is received)**  
     The Council will convene a meeting (or a series of meetings) with both experts present. The meeting will:
     - Be facilitated by the Chair or an independent moderator.
     - Focus on identifying the sources of disagreement (e.g., differences in prior, differences in interpretation of evidence, or differences in updating).
     - Explore the sensitivity of the conclusions to the choice of prior and other assumptions.

  3. **Council Deliberation and Report (Deadline: One week after the meeting)**  
     The Council will then produce a report that:
     - Summarises the points of agreement and disagreement.
     - Explains the reasons for the disagreement without attributing error to either expert unless clear evidence of mistake or bias is found.
     - If possible, provides a range of probabilities that reflects the uncertainty and the differing perspectives.
     - Makes recommendations for policy or further research as appropriate.

  **6. Conclusion**

  The current rule is theoretically sound only under conditions that are rarely met in practice. Applying it to the upcoming case would risk dismissing a legitimate viewpoint without proper examination. I urge the Council to abandon the rule and adopt the proposed procedure for the upcoming assessment. This approach will promote a more accurate and fair assessment of the risk in question, and it will serve as a model for revising the Council's protocol for future cases.

  I am available to discuss this opinion at the Council's next meeting.
answer: |-
  **OPINION ON PROTOCOL FOR EXPERT DISAGREEMENT**  
  **To:** National Scientific Advisory Council  
  **From:** [Your Name], Lay Member  
  **Date:** [Current Date]  
  **Subject:** Revision of Disagreement Protocol & Procedure for Upcoming Risk Assessment  

  ### 1. Introduction  
  I have reviewed the Council’s protocol stating that expert disagreement after examining the same evidence constitutes *prima facie* evidence of irrationality, bias, or bad faith. While this rule draws from a sound theoretical principle (Aumann’s agreement theorem), its practical application is flawed. I recommend **abandoning the rule** and adopting a revised approach for the upcoming risk assessment. Below, I address the chair’s position, the rule’s assumptions, and a concrete alternative.  

  ---

  ### 2. Critique of the Current Rule  
  The rule relies on **Aumann’s agreement theorem**, which states:  
  > *If two rational agents share a common prior and their posterior probabilities become common knowledge, their posteriors must coincide.*  

  The chair’s application of this theorem assumes:  
  - **Common prior**: Both experts begin with identical probability assessments before reviewing new evidence.  
  - **Common knowledge**: Each expert knows the other’s posterior and knows this knowledge is mutual (infinite recursion).  
  - **Rational updating**: Both update beliefs via Bayesian conditioning (no errors in logic).  

  **Why these assumptions fail in practice:**  
  1. **Priors are rarely common**: Experts often disagree on priors due to legitimate differences in background knowledge, theoretical frameworks, or interpretations of historical data. For instance, in climate risk assessments, priors may diverge based on weight given to paleoclimate data vs. model projections.  
  2. **Common knowledge is unrealistic**: Experts rarely engage in the recursive exchange needed to achieve "common knowledge" of posteriors.  
  3. **Disagreement may stem from priors, not updating**: If experts legitimately differ on priors (e.g., due to epistemic values like risk-aversion), posteriors *should* diverge—even with flawless updating. Discounting dissent here penalises scientific pluralism.  

  **Thus, treating disagreement as *prima facie* evidence of error is unjustified.** It risks dismissing valid perspectives, stifles intellectual diversity, and could undermine the Council’s credibility.  

  ---

  ### 3. Proposed Revision: Abandon the Rule  
  I recommend abandoning the current protocol for three reasons:  
  - **False equivalence**: Disagreement ≠ irrationality. Experts may rationally reach different conclusions from the same evidence if priors or interpretations differ.  
  - **Procedural injustice**: Discounting testimony without proving the theorem’s assumptions hold is prejudicial.  
  - **Practical harms**: In low-probability, high-consequence risks (e.g., catastrophic climate events), suppressing dissent could overlook credible warnings.  

  ---

  ### 4. Procedure for the Upcoming Risk Assessment  
  For the case where two experts disagree, I propose a **structured dialogue** to evaluate the *source* of disagreement, completed within **four weeks**.  

  #### **Step 1: Documentation (Deadline: 1 Week)**  
  - Both experts submit written statements detailing:  
    - Their **prior probabilities** and the rationale (e.g., data, models, or assumptions used).  
    - **Key evidence** examined and how it informed their **likelihood assessments**.  
    - A **Bayesian workflow** showing their updating process.  

  #### **Step 2: Facilitated Dialogue (Deadline: Week 3)**  
  - Hold a 3-hour moderated session (chaired by an impartial Council member) where experts:  
    1. Present their reasoning.  
    2. Identify **specific points of divergence** (e.g., "We disagree on the prior probability of Event X due to different trust in Model Y").  
    3. Discuss whether differences arise from:  
       - Priors vs. updating.  
       - Ambiguities in evidence.  
       - Technical judgments (e.g., model selection).  
  - **Output**: A joint report cataloguing areas of consensus and dissent, with reasons.  

  #### **Step 3: Council Assessment (Deadline: Week 4)**  
  - The Council reviews:  
    - Whether disagreements reflect **legitimate epistemic differences** (e.g., defensible priors) or **potential errors** (e.g., statistical miscalculations).  
    - If bias/error is alleged, **evidence must be substantiated** (e.g., inconsistency with established facts).  
  - **Final decision**:  
    - If dissent stems from reasonable priors/updating, **both views are retained** in the assessment.  
    - If error/bias is proven, the Council may discount the affected claims—but must disclose its criteria transparently.  

  ---

  ### 5. Addressing the Chair’s Position  
  I acknowledge the chair’s concern: unchecked disagreement could permit arbitrary or biased testimony. However:  
  - **The rule cannot be salvaged**: Its assumptions are too restrictive for real-world science.  
  - **A balanced alternative**: The structured dialogue above tests for errors *without* presuming guilt from dissent. It allows the Council to:  
    - Distinguish "reasonable disagreement" from "probable error."  
    - Uphold accountability while respecting scientific diversity.  

  ---

  ### 6. Recommendation  
  - **Abandon the current rule** immediately.  
  - **Adopt the 4-week procedure** for the upcoming risk assessment.  
  - **Develop a permanent protocol** requiring evidence-based adjudication of disagreements (I will submit a draft for discussion).  

  This approach honours the Council’s commitment to rigor while recognising that science advances through disciplined debate—not enforced consensus.  

  ---  
  **Signed,**  
  [Your Name]  
  Lay Member, National Scientific Advisory Council
