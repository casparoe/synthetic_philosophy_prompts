prompt: |-
  ok, I've been reading a bunch of outside-view / base-rate stuff and I want to actually use it for one specific job: forecasting how long states, regimes and empires last. And I keep hitting the same wall. Every account tells you to "find the reference class" and take its base rate, and then nobody says what makes one reference class better than another. Pick states, you get one number. Pick states of a certain size and era, another. Pick states ruled by one dynasty right after a civil war, a third. It's infinitely malleable and I suspect the malleability is doing more work than the method admits.

  So before I read any more of this stuff, write me the desiderata. What does any adequate account of reference-class selection have to deliver? I want the requirements list, each one with the case or consideration behind it, and your honest call on which are non-negotiable and which are just preferences of one camp.

  Things I'm half-convinced belong on the list, so take a stance on each rather than just repeating them back: (1) the class has to be fixed before you know the outcome, so no shopping for the class that happens to fit; (2) the members have to be exchangeable with the target in the relevant respect, which means you owe me an account of what "relevant respect" is; (3) it has to survive the fact that the historical record is itself a biased sample — the states that left us records are the ones that lasted long enough to keep archives, so base rates read off the record may be biased toward longevity and I'd like to know how much that matters; (4) it has to cope with class drift, where the criteria defining membership change over time, so you're averaging over a moving target; (5) it has to cope with failures that aren't independent draws — one hegemonic war can end five empires at once, which wrecks the arithmetic that treats the class as n tickets from an urn.

  And flag any pairs on that list I can't have together. I have a feeling (1) and "use all the information you have" are in tension, and (4) and (2) might be straight-up incompatible, but tell me if I'm wrong.

  One more thing I want the list to confront, and this is the part I care most about: I suspect alot of this is broken because people treat the class as a set of draws when the things in it are trajectories with internal clocks. A thirty-year-old state and a three-hundred-year-old state aren't two tickets from the same urn. If that's right then a single base rate for the class is the wrong object entirely and what you want is a hazard profile conditioned on age or phase, which means the "class" isn't a set of similar cases so much as a family of trajectories. Is that a genuine requirement, or is it my prejudice? If it's genuine, say what it knocks out.

  Then tell me: which single requirement on the list does the most damage to the naive practice of "get the base rate, then nudge it with your inside-view reasoning"? Seperate that out from the rest, I want to see how much of the practice it takes down.

  No reading list or citations, I'll fill those in myself.
reasoning: |-
  Okay, the user is grappling with the practical application of reference classes in forecasting state longevity, frustrated by the lack of clear criteria for selecting them. They've identified several key challenges: pre-defining classes, exchangeability, historical bias, class drift, non-independent failures, and the issue of internal clocks in state lifespans. 

  Hmm, their core tension seems to be between wanting objective base rates and recognizing that all classifications involve subjective choices. The "trajectories not tickets" point is particularly sharp - they're intuiting that survival analysis (hazard rates) would be more appropriate than static base rates. Smart observation.

  Let me unpack their listed concerns one by one. First, pre-selection (point 1) is indeed non-negotiable - hindsight bias ruins everything. But how rigid should this be? In practice, you might iteratively refine classes as long as you document decisions before checking outcomes. 

  Exchangeability (point 2) is the theoretical ideal but practically messy. The "relevant respect" problem feels like the crux: if we're forecasting regime collapse, is economic structure more relevant than geography? This is where domain expertise sneaks back in. 

  Historical record bias (point 3) might be less severe than they fear for modern states, but for ancient empires? Absolutely - we only know about the winners. Need to flag that methods like survival analysis can partially correct for this. 

  Class drift (point 4) and non-independence (point 5) are killer issues they've rightly identified. The Thirty Years' War example shows how base rates implode when failures cluster. Maybe emphasize that no method fully solves this - it's about damage control. 

  Ah, and their trajectory insight! This is gold. The 30yr vs 300yr state absolutely shouldn't be weighted equally. Hazard models aren't just nice-to-have; they're necessary when failure probability changes over time. This alone torpedoes the naive "average lifespan" approach. 

  For the knockout requirement? Probably exchangeability. If your class includes banana republics when forecasting the USSR, your base rate is garbage regardless of other adjustments. 

  The user clearly has deep domain knowledge but wants methodological rigor. They're not fooled by "just pick a class" hand-waving. Best honor that by being brutally honest about limitations while offering workable heuristics.
answer: |-
  Here's the desiderata list for reference-class selection in state longevity forecasting, structured to address your concerns head-on. I'll flag non-negotiables (NN), contested requirements (CR), and tensions, then identify the most damaging flaw to naive practice.

  ---

  ### **Core Desiderata for Reference-Class Selection**

  1. **Pre-outcome Class Definition**  
     - *Requirement*: The reference class must be defined *before* examining outcomes for the specific case.  
     - *Rationale*: Prevents cherry-picking classes to fit desired conclusions (e.g., "post-civil war dynasties" only if they collapsed early).  
     - *Status*: **NN** (non-negotiable). Violation invalidates the entire method.  

  2. **Exchangeability on the Focal Variable**  
     - *Requirement*: All class members must be exchangeable with the target *for the specific variable being forecasted* (e.g., regime collapse risk).  
     - *Rationale*: If members differ systematically in factors directly affecting longevity (e.g., geography, institutions), the base rate is meaningless.  
     - *Challenge*: Defining "relevant respect" requires causal understanding (e.g., "industrialized states" may share collapse drivers; "monarchies" may not).  
     - *Status*: **NN** in theory, **CR** in practice. Often reduced to proxy similarity (e.g., "similar GDP/capita"), risking tautology.  

  3. **Correcting for Survivorship Bias**  
     - *Requirement*: The class must account for historical undersampling of short-lived states (e.g., failed rebellions, brief conquests).  
     - *Rationale*: Raw historical data overrepresents survivors (e.g., "empires" imply longevity by definition).  
     - *Mitigation*: Use survival analysis (Kaplan-Meier estimators) or include "still existing" states with right-censoring.  
     - *Status*: **NN** for accuracy. Ignoring this inflates longevity estimates.  

  4. **Handling Non-Independent Failures**  
     - *Requirement*: The model must accommodate correlated failures (e.g., wars, pandemics, systemic crises).  
     - *Rationale*: Treating collapses as independent events underestimates tail risks (e.g., 1918–1923 dissolved 4 empires).  
     - *Solution*: Use Cox proportional hazards with time-varying covariates (e.g., "war exposure"), or cluster-adjusted variance.  
     - *Status*: **NN** for realism. Ignoring dependence guarantees flawed uncertainty intervals.  

  5. **Dynamic Hazard Rates (Trajectories > Tickets)**  
     - *Requirement*: Model failure probability as a function of *time/phase* (hazard rate), not a fixed lifetime average.  
     - *Rationale*: Collapse risk isn't static (e.g., "infant mortality" in new regimes vs. "senescence" in aging empires).  
     - *Implication*: The reference "class" should be a cohort with similar hazard profiles, not just shared traits.  
     - *Status*: **NN** for methodological validity. A single base rate is *always* wrong if hazard isn't constant.  

  6. **Temporal Consistency (Class Drift)**  
     - *Requirement*: Membership criteria must be stable across time or adjusted for period effects.  
     - *Rationale*: "Democracies" in 1800 vs. 2020 are fundamentally different entities.  
     - *Solution*: Era-stratification (e.g., "post-WWII states") or time-varying class definitions.  
     - *Status*: **CR** (context-dependent). Strict adherence may conflict with exchangeability (#2).  

  ---

  ### **Tensions and Incompatibilities**
  - **#1 (Pre-definition) vs. "Use All Information"**:  
    Tension exists but isn’t fatal. You can predefine *multiple* classes (e.g., "all states," "industrialized states") and use Bayesian model averaging.  
  - **#4 (Class Drift) vs. #2 (Exchangeability)**:  
    **Incompatible if unaddressed**. A class like "European monarchies" from 1500–2020 has drifting exchangeability. Solution: Subclass by era or use time-varying models.  
  - **#5 (Hazard Rates) vs. Naive Base Rates**:  
    **Fundamental incompatibility**. Hazard modeling replaces "average lifespan" with conditional survival curves.  

  ---

  ### **The Knockout Requirement: #5 (Dynamic Hazard Rates)**  
  **Why it destroys naive practice**:  
  - Naive base rates assume constant collapse risk (e.g., "empires last 250 years on average"). But hazard functions show risk is *age-dependent* (e.g., high early risk, then low, then high again).  
  - A 300-year-old empire isn't "due to fall" – its risk may be *lower* than a 30-year-old state.  
  - **Consequence**: The "nudge with inside view" step becomes incoherent. You can’t "adjust" a flawed base rate; you need a full hazard model conditioned on age/covariates.  

  ---

  ### **The Biased Sample Problem (#3) – How Much It Matters**  
  - **Pre-1800 data**: Severely biased. Short-lived polities (e.g., steppe khaganates) leave fewer records. Base rates may be inflated by 2–10×.  
  - **Post-1945 data**: Less biased (better documentation), but still overrepresents survivors (e.g., failed states excluded from datasets).  
  - **Mitigation**: Use archaeological/paleoclimatic proxies for early states, or parametric survival models.  

  ---

  ### **The Verdict**  
  | **Desideratum**         | Non-Negotiable? | Knocks Out Naive Practice? |  
  |--------------------------|-----------------|----------------------------|  
  | Pre-outcome definition   | Yes             | Weakly (if violated)       |  
  | Exchangeability          | Yes             | Moderately                 |  
  | Survivorship correction  | Yes             | Moderately                 |  
  | Non-independent failures | Yes             | Strongly (tail risks)      |  
  | **Dynamic hazard rates** | **Yes**         | **Decisively**             |  
  | Temporal consistency     | Contextual      | Moderately                 |  

  **The fatal flaw**: Treating states as "tickets in an urn" ignores that collapse risk evolves with time and context. **You need survival analysis, not base rates**. Start with hazard functions stratified by:  
  1. **Age of regime**  
  2. **Regime type** (e.g., autocracy vs. democracy)  
  3. **Systemic factors** (e.g., economic integration, conflict exposure)  

  This shifts "reference class" from a *static group* to a *dynamic cohort with shared hazard drivers*. The rest is implementation.
