  Dear [Your Name],

  I've designed a decision procedure for your graders to evaluate proposed D panels in the Kestrel tiles puzzles, balancing the need for inter-rater reliability with the theoretical stance that analogy-making involves re-perceiving situations under shared frames where slippable differences (those that can vary) and load-bearing differences (those that must align) are defined by the solver's rationale. The procedure prioritizes consistency between the source change (A to B) and the proposed change (C to D) while accounting for permissible slippages through the solver's one-sentence explanation. Graders must follow these steps sequentially, using only observable tile features (shape, shade, position) and the solver's rationale when required. Rejections occur when inconsistencies cannot be resolved by the rationale, and escalations happen when the procedure encounters ambiguous value judgments about what constitutes a "valid" slippage. Remember, graders have three minutes and may request the rationale only once if absent. 

  Begin by confirming the grid structure: Ask whether the proposed D has the same number of tiles as C in identical positions, disregarding shape and shade for now. If no, reject immediately because adding, removing, or repositioning tiles without movement logic violates the microdomain's constraint that changes must transform existing elements. This step prevents arbitrary alterations but allows feature changes. 

  Next, identify the core change type: Ask whether the source change from A to B involves movement (any tile shifts position) or feature alteration (any tile's shape/shade changes without moving). If both occur, the grader must decide which dominates by asking whether the movement or feature change is more visually salient; this is a judgment call, but if movement affects more tiles or is more pronounced, prioritize movement. If unsure, proceed to the rationale step later. 

  For movement-dominant cases: Ask whether the movement pattern in A to B is feature-agnostic (e.g., "all tiles shift left") or feature-dependent (e.g., "dark tiles move down"). If feature-agnostic, ask whether the identical pattern applies to C to D without relying on tile features. If yes, accept; if no, reject. If feature-dependent, ask whether the solver's rationale names the load-bearing feature (e.g., "shade dictates movement") and whether applying that rule to C yields D. If no rationale exists, reject; if the rationale names a feature but applying it to C doesn't produce D, reject. If the rationale justifies slippage—say, substituting "shape" for "shade" while preserving the movement logic—escalate to you, as this trades on a value judgment about whether features are analogously interchangeable. 

  For feature-alteration-dominant cases: Ask whether the feature change in A to B is absolute (e.g., "pale becomes dark") or relative (e.g., "lightest shade darkens"). If absolute, ask whether C to D uses the same rule verbatim. If yes, accept; if no, reject. If relative, require the solver's rationale to state the rule (e.g., "darken extremes"). If no rationale, reject. If the rationale exists, ask whether the rule applied to C produces D and whether it mirrors A to B in structure (e.g., both shift shades toward contrast). If yes, accept; if no, reject. 

  If unresolved, use the rationale as a tiebreaker: Ask whether the solver's one-sentence explanation describes a single, consistent rule that, when applied, turns A into B and C into D. If no rationale exists, reject. If the rationale is vague (e.g., "it balances"), reject. If it's specific (e.g., "swap tiles mismatched in shade"), verify that the rule explains A to B and that applying it to C yields D. If verification fails, reject. If verification succeeds but relies on abstract slippage (e.g., treating "shape" as slippable while "positional conflict" is load-bearing), escalate to you, as this hinges on whether the reinterpretation legitimately reflects "the same kind of change." 

  Now, applying this to cases: 

  **Case 1 (straightforward movement):**  
  Source A to B: The top-left tile (a circle) moves to the center.  
  Panel C: Top-left tile is a triangle.  
  Proposed D: Top-left tile moves to the center.  
  Procedure: Grid structure matches. Movement dominates (one tile shifts). Pattern is feature-agnostic (position-based). Identical movement in C to D. Accept without rationale.  

  **Case 2 (feature alteration with slippage):**  
  Source A to B: All circles become squares (shape change).  
  Panel C: Contains triangles and squares.  
  Proposed D: All triangles become circles.  
  Rationale: "I converted the most angular shape to the most curved."  
  Procedure: Grid structure matches. Feature alteration dominates (no movement). Change is relative (relies on abstract property "angularity"). Rationale states a rule: In A, circles (curved) become squares (angular); in C, triangles (angular) become circles (curved). Rule applied consistently. Accept. Without rationale, it would reject at the relative-feature step.  

  **Case 3 (hard case with rationale-dependent slippage):**  
  Source A to B: Dark tiles move clockwise to adjacent cells (e.g., top-left dark tile moves to top-center).  
  Panel C: No dark tiles; has medium and pale tiles.  
  Proposed D: Pale tiles move clockwise to adjacent cells.  
  Rationale provided: "The lightest shade inherits the movement role."  
  Procedure: Grid structure matches. Movement dominates. Pattern is feature-dependent (shade dictates movement). Rationale names a slippage (shade depth as load-bearing). Applying the rule to C: Pale (lightest) moves clockwise, producing D. Accept. If rationale were missing, it would reject at the feature-dependent step.  
  Rationale missing: Reject, as movement depends on shade with no justification for slippage to "lightness."  

  **Case 4 (escalation for value judgment):**  
  Source A to B: Tiles swap to resolve shade conflicts (e.g., a pale/dark clash fixed by swapping pale tile with a neutral one).  
  Panel C: Has shape conflicts (e.g., circle/triangle adjacency).  
  Proposed D: Tiles swap to resolve shape conflicts.  
  Rationale: "I resolved adjacency conflicts, treating shade/shape as slippable."  
  Procedure: Grid structure matches. Movement dominates (swaps). Pattern is feature-dependent (conflict type dictates swaps). Rationale states slippage (shade→shape) and rule ("resolve conflicts"). Verification: In A to B, swaps reduce shade clashes; in C to D, swaps reduce shape clashes. But the grader cannot confirm if "conflict type" is legitimately slippable—this redefines the frame from "shade-driven" to "conflict-driven." The procedure escalates to you, explaining: "Information missing on whether redefining load-bearing features (shade→shape) under a broader 'conflict' frame is valid slippage. This is a value judgment about the analogy's purpose, not a factual error."  

  The procedure intentionally errs toward rejecting borderline cases without clear rationale to protect dataset integrity, but it will reject elegant answers where graders cannot verify slippages (e.g., Case 3 without rationale). It cannot handle meta-slippages that redefine "sameness" itself (e.g., treating movement as slippable when features change) without escalating, as such cases require human interpretation of creative intent versus noise. Use the escalations to refine the procedure iteratively.  

  I trust this balances rigor with flexibility. Adjust as you encounter edge cases.  

  Warm regards,  
