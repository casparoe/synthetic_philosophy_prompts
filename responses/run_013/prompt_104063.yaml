  - Q4: Grounded in shared identity? (Yes → Q5: Is this identity cultural/national? → Yes: liberal nationalism; No: associative)  
  - Q6: Grounded in shared coercive institutions? (Yes → coercion-based)  
  - Q7: Only for intimate bonds? (Yes → "intimacy only")  
  - Administrative fact gets no branch—it’s a dead end.  

  Final tree: 10 nodes, 7 leaves. Flag that voluntary consent is unstable and administrative fact isn’t a coherent ground. Empty paths: e.g., "partiality yes, but no to consent/reciprocity/identity/coercion/intimacy" → unexplored (is there a brute locality view?). Unseparated: associative vs. nationalism if culture isn’t distinguished.
answer: |-
  Here is a diagnostic decision tree anchored in the **vaccine prioritization case** (a state allocating scarce COVID-19 vaccines: should citizens get priority over equally needy foreigners?). Designed for 8–12 nodes and 7 distinct leaves, it isolates core commitments while avoiding -ism labels. Collapses and gaps are flagged at the end.

  ---

  ### **Diagnostic Decision Tree: Do Compatriots Have Special Claims?**
  *(Start at Q1; follow answers to next node or leaf)*  

  **Q1: Is practical reason fully impartial?**  
  - **Yes** → **Leaf 1: Cosmopolitanism**  
    *Awkward commitment: Must allocate vaccines strictly by need abroad if foreigners are equally needy, even if citizens protest.*  
  - **No** → Proceed to Q2.  

  **Q2: Is the ground for special claims *voluntary association* (e.g., consent to citizenship)?**  
  - **Yes** → **Leaf 2: Voluntarist Contractualism**  
    *Awkward commitment: May deny vaccines to non-consenting residents (e.g., immigrants) even if equally integrated.*  
  - **No** → Proceed to Q3.  

  **Q3: Is the ground *reciprocity* (benefiting from a cooperative scheme)?**  
  - **Yes** → Proceed to Q7.  
  - **No** → Proceed to Q4.  

  **Q4: Is the ground *shared identity/constitutive attachment* (e.g., culture, nation)?**  
  - **Yes** → Proceed to Q8.  
  - **No** → Proceed to Q5.  

  **Q5: Is the ground *subject to shared coercive institutions* (e.g., laws, taxes)?**  
  - **Yes** → **Leaf 3: Coercion-Based Obligation**  
    *Awkward commitment: Must prioritize citizens for vaccines even if state coercion historically exploited foreigners.*  
  - **No** → Proceed to Q6.  

  **Q6: Is partiality justified *only* for relationships with deep personal bonds (e.g., family)?**  
  - **Yes** → **Leaf 4: Intimacy-Restricted Partiality**  
    *Awkward commitment: May not stop health workers from emigrating during a pandemic, as citizenship lacks familial "thickness".*  
  - **No** → **Leaf 5: Administrative-Particularism**  
    *Awkward commitment: May prioritize citizens solely because they are "ours", even if historically arbitrary.*  

  **Q7 (from Q3-Yes): Is reciprocity-based partiality a *requirement* or a *permission*?**  
  - **Requirement** → **Leaf 6: Fair-Play Obligation**  
    *Awkward commitment: Must bar health workers from emigrating if they benefited from state training, akin to "free-riding".*  
  - **Permission** → **Leaf 7: Reciprocity Prerogative**  
    *Awkward commitment: May hoard vaccines for citizens who paid taxes, even if global deaths soar.*  

  **Q8 (from Q4-Yes): Is shared identity *national/cultural*?**  
  - **Yes** → **Leaf 8: Liberal Nationalism**  
    *Awkward commitment: May prioritize culturally "native" citizens over equally needy minorities if identity is threatened.*  
  - **No** → **Leaf 9: Associative Obligations**  
    *Awkward commitment: Must prioritize all co-citizens (even strangers) over family abroad, as citizenship itself binds.*  

  ---

  ### **Collapses, Gaps & Diagnostics**
  1. **Collapsed Positions**:  
     - *Voluntarist Contractualism* (Leaf 2) and *Reciprocity Prerogative* (Leaf 7) are separated, but **"associative obligations"** (Leaf 9) absorbs non-cultural unchosen relationships (e.g., civic ties). Liberal nationalism (Leaf 8) is its cultural subset.  
     - **"Administrative-Particularism"** (Leaf 5) collapses "mere historical/administrative fact" into a residual category. It is unstable—most who reach Q6-No accept *some* ground, making this rare.  

  2. **Unseparated Positions**:  
     - **Liberal Nationalism vs. Associative Obligations**: The tree isolates cultural identity (Q8) but cannot split "civic" from "ethnic" nationalism. Students who ground partiality in identity *without* cultural specificity (Q8-No) land in associative obligations.  

  3. **Empty Answer-Combinations**:  
     - **Q1-No → Q2-No → Q3-No → Q4-No → Q5-No → Q6-Yes**: *Intimacy-Restricted Partiality* (Leaf 4).  
     - **Gaps**:  
       - **Incoherent**: Affirming partiality but rejecting *all* grounds (Q2–Q6 all "No") → Leads to Leaf 5, but its arbitrariness is widely seen as morally indefensible.  
       - **Unattractive**: Granting partiality for coercion (Q5-Yes) but denying reciprocity (Q3-No) → Ignores that coercion often enables reciprocity. Few defend this.  
       - **Unexplored**: Grounding partiality in coercion *and* identity (Q4-Yes *and* Q5-Yes) → Hybrid views exist (e.g., "democratic legitimacy"), but the tree forces a primary ground.  

  4. **Tree Structure**:  
     - 10 nodes (8 questions + 2 leaves via permissions), 7 leaves.  
     - "Voluntarism" appears early (Q2) due to its foundational role in liberal theory, though empirically contested.  
     - The intimacy-restricted view (Leaf 4) is isolated at Q6 to force engagement with *why* nationality differs from family.  

  ---

  ### **Instructions for Seminar Use**
  - **Anchor Case**: Pose the vaccine dilemma first. Students answer nodes based on intuitions about this case.  
  - **Leaf Commitments**: Use the "awkward" sentences to test consistency—e.g., Can a nationalist accept prioritizing culture over need?  
  - **Gaps**: Discuss why incoherent/unattractive paths are vacant (e.g., "administrative fact" lacks moral traction).  
  - **Flow**: Most students land in **Leaf 1** (cosmopolitan), **Leaf 3** (coercion), **Leaf 6/7** (reciprocity), or **Leaf 8** (nationalism). **Leaf 4** exposes a key boundary.
