prompt: |-
  I am assembling materials for an advanced undergraduate seminar in political philosophy, for a session on whether compatriots have special claims on one another — whether shared citizenship, by itself, gives one person a stronger claim on another than a foreigner in equal need. What I want is not a prose survey of the literature but a diagnostic instrument: a decision tree, or a taxonomy organized as one, whose internal nodes are questions a student can answer on the merits and whose leaves are the named positions. The point is to sort readers by what they actually believe about the cases rather than by the label they already favor, so no node should simply ask whether one is a nationalist or a cosmopolitan.

  Construct the tree from the logical space rather than from a list of -isms. The first fork should be the most general one: whether there are any special claims at all, that is, whether practical reason is fully impartial or admits agent-relative or relational partiality. The next level should separate the surviving views by the ground they assign to a compatriot's claim, and I need the following candidate grounds kept distinct, because my students run them together: voluntary association or consent; reciprocity within a cooperative scheme that benefits its members; shared identity or an unchosen constitutive attachment; subjection to the same coercive institutions; and mere administrative or historical fact. Include at least one node that separates a view treating compatriot partiality as a permission — a prerogative one may exercise — from one treating it as a requirement.

  The leaves must include: a cosmopolitan view on which compatriots have no claim beyond what general duties already supply; a liberal-nationalist view locating the claim in nation or culture; a view locating it in the coercive power of the state rather than in nationality; a reciprocity- or fair-play-based view; an associative-obligations view grounded in unchosen relationship; and one position students reliably forget — a view that denies special claims among compatriots while granting them among family or friends, which must then explain why nationality differs from those relationships. If two of these collapse under your diagnostic questions, say so instead of listing both.

  Anchor the instrument in a single concrete case — a state deciding whether to give its own citizens priority access to a scarce vaccine, or whether to bar health workers from emigrating during a pandemic — and give each leaf one sentence naming its most awkward commitment there. Finally, flag any pair of positions your tree cannot separate, and diagnose the answer-combinations that no position occupies, distinguishing those left empty because incoherent, because unattractive, and because merely unexplored. Aim for roughly eight to twelve nodes and six to eight leaves.
reasoning: |-
  Hmm, the user is designing an advanced political philosophy seminar on whether compatriots have special moral claims over foreigners. They want a diagnostic decision tree—not a literature survey—to help students discover their actual beliefs through concrete cases, avoiding predefined labels like "nationalism."

  The key requirements are complex: The tree must start with the most fundamental question about impartiality vs. partiality, then branch by distinct grounds for special claims (voluntary consent, reciprocity, identity, coercion, administrative fact). It needs to distinguish permissions from requirements and must include specific positions like cosmopolitanism, liberal nationalism, coercion-based views, reciprocity theory, associative obligations, and the often-overlooked view that grants partiality only to intimate relations (not nationality).  

  For anchoring, I'll use a vaccine prioritization case. Each "leaf" position requires one sentence exposing its toughest implication in that scenario. The tree should have 8-12 nodes and 6-8 leaves, with analysis of gaps: which answer combinations are incoherent, unappealing, or just underexplored.  

  Building this logically:  
  1. First node must be "Are special claims among compatriots ever justified?" This splits cosmopolitans (no) from all others.  
  2. For the "yes" branch, next differentiate grounds. Here’s the challenge: The five grounds (voluntary, reciprocity, identity, coercion, history) aren't mutually exclusive, but I must force separation to prevent conflation. I'll prioritize the most salient distinctions:  
     - Voluntary association is unique because it implies consent.  
     - Reciprocity hinges on mutual benefit.  
     - Identity/culture is unchosen and constitutive.  
     - Coercion focuses on state power’s effects.  
     - Administrative fact is residual (brute locality).  
  3. The "intimate relations only" view needs isolation. It logically appears under partiality but denies nationality’s moral weight, so I'll add a node asking "Does this relationship require deep personal bonds?" after establishing partiality is possible.  
  4. To separate permissions (may prioritize) from requirements (must prioritize), I'll place this late in branches where it matters—e.g., after establishing a ground like reciprocity.  
  5. Leaves must map to requested positions:  
     - Cosmopolitan → no special claims  
     - Liberal nationalist → culture/identity  
     - Coercion-based → state power  
     - Reciprocity → fair play  
     - Associative → unchosen relationship  
     - "Intimacy only" → denies nationality  
     ... but associative and liberal nationalist both use "unchosen attachment," so I need to split them: associative is broader (any relationship), while nationalist specifies cultural identity.  
  6. Awkward commitments per leaf:  
     - Cosmopolitan: "Must allocate vaccines strictly by need, even if foreigners die while citizens have spares."  
     - Liberal nationalist: "May prioritize citizens even if they're less needy, if culture is threatened."  
     - Etc.  
  7. Gaps and collapses:  
     - Voluntary association for citizenship is empirically dubious (few consent), so it may not sustain a standalone position.  
     - "Administrative fact" alone is morally vacant—likely collapses into incoherence or defaults to coercion.  
     - Empty paths: e.g., affirming partiality but rejecting all grounds → unexplored?  
