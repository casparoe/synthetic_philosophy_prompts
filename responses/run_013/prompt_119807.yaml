prompt: |-
  I am building predictive models of artificial agents that must act under time pressure and cannot derive everything their information entails, and before I commit to any account of their belief states I want the standard of adequacy written out. Set out the desiderata for a theory of belief for such agents: the cases it must get right, the distinctions it must not collapse, and the results it must remain consistent with, each with the consideration that makes it a requirement rather than a preference of one camp. I care especially about these cases: an agent that stores a universally quantified conditional together with its antecedent but has never performed the instantiation, so that it is silent about the consequent; an agent that did derive the consequent and then had the conclusion overwritten in working memory; an agent that believes the general claim that every tautology is true while failing to believe some particular monstrous tautology, so that nothing about it is closed under anything yet its contents do not contradict one another; an agent holding contradictory entries from two subsystems that never interact; and an agent whose degrees of belief must be defined for the purposes of choice even though it holds no attitude toward most of the consequences of what it believes. I expect some of these requirements cannot be had together, and that is the part I most want from you: say which pairs you judge jointly unsatisfiable and whether the conflict is a theorem or a matter of engineering, in particular whether closure under the agent's own inference rules can be required at all without collapsing back into the omniscience the theory was built to avoid, and whether any representation of belief rich enough to compose with probability, decision, and communication can escape licensing the substitution of logical equivalents. Then name the single requirement that does the most to exclude the existing families of accounts, and score those families briefly against the list.
reasoning: |-
  We are to set out desiderata for a theory of belief for artificial agents that operate under time pressure and cognitive limitations. The theory must account for the fact that these agents cannot derive all the consequences of their beliefs. We are given several specific cases that the theory must handle. We will list the desiderata, then discuss conflicts, and finally evaluate existing families of accounts.

  ### Desiderata for the Theory of Belief

  1. **Non-Instantiation of Universal Conditional**  
     *Case*: An agent stores a universally quantified conditional (∀x)(P(x) → Q(x)) and its antecedent P(a) for a specific a, but has never performed the instantiation to conclude Q(a). The agent is silent about Q(a).  
     *Requirement*: The theory must allow that the agent does not believe Q(a) even though it believes the universal conditional and the antecedent. This is required because the agent has not performed the inference step and may not have the resources to do so at the time.  
     *Distinction*: The theory must not collapse the state of having the premises without the conclusion into having the conclusion.

  2. **Overwritten Conclusion**  
     *Case*: An agent did derive a consequent (e.g., Q(a)) but then had this conclusion overwritten in working memory (e.g., due to memory constraints).  
     *Requirement*: The theory must account for the fact that the agent no longer has access to the conclusion, even though it was once derived. The agent does not currently believe the conclusion.  
     *Distinction*: The theory must distinguish between a belief that was never held and one that was held and then lost.

  3. **Non-Closure without Contradiction**  
     *Case*: An agent believes the general claim that every tautology is true, but fails to believe a particular monstrous tautology (which is too complex for the agent to derive). The agent's beliefs do not contradict one another.  
     *Requirement*: The theory must allow that the agent does not believe every tautology, even though it believes that all tautologies are true. The theory must not require that the agent's beliefs are closed under logical consequence.  
     *Distinction*: The theory must not collapse the belief in a general claim about tautologies into believing every instance.

  4. **Contradictory Subsystems without Interaction**  
     *Case*: An agent holds contradictory beliefs (e.g., P and ¬P) from two subsystems that never interact (so the contradiction is never noticed).  
     *Requirement*: The theory must allow for the agent to hold such contradictory beliefs without the agent's overall belief state being inconsistent (in the sense that the agent might act on one in one context and the other in another).  
     *Distinction*: The theory must not require that the agent's beliefs are globally consistent. It must allow for local consistency in subsystems that do not communicate.

  5. **Degrees of Belief for Choice without Full Awareness**  
     *Case*: An agent must assign degrees of belief for the purposes of decision making, even though it holds no attitude toward most of the consequences of what it believes.  
     *Requirement*: The theory must allow for the definition of degrees of belief (e.g., probabilities) over a set of propositions that are not all explicitly represented by the agent. This is required for decision theory to apply even when the agent is not aware of all logical consequences.  
     *Distinction*: The theory must not require that the agent has explicit degrees of belief for every proposition, but must allow for the assignment of degrees to relevant propositions for choice.

  ### Conflicts Among Desiderata

  We now consider whether some of these requirements are jointly unsatisfiable.

  - **Conflict 1: Non-Closure and Degrees of Belief**  
    The requirement of non-closure (from Desideratum 3) and the requirement to assign degrees of belief for decision making (Desideratum 5) might conflict. If the agent must assign a degree of belief to a proposition that is a logical consequence of its beliefs, but it is not aware of that consequence, then how can we assign a degree? The agent's explicit beliefs might imply a certain probability for the consequence, but the agent does not hold that probability explicitly. This is an engineering challenge: we can define the agent's degrees of belief as those that are consistent with the agent's explicit beliefs (via a probability distribution that respects the logical constraints) but without requiring the agent to have computed them. However, this may lead to a form of omniscience at the probabilistic level. 

    *Verdict*: This conflict is a matter of engineering. We can avoid requiring the agent to have explicit degrees for every consequence by using a representation that defines the degrees implicitly (e.g., by a probability distribution over possible worlds that respects the logical constraints). But note: if we require that the agent's degrees of belief must be defined for every proposition (even those not explicitly represented) and must be coherent (e.g., satisfy the axioms of probability) and also respect logical entailment (if A entails B, then P(A) ≤ P(B)), then we are effectively requiring a kind of probabilistic omniscience. This is a challenge because the agent might not be able to compute these probabilities. However, for decision making, we only need the degrees for the propositions that are relevant to the decision. Thus, we can limit the assignment to a finite set of propositions that are currently in play. This avoids full omniscience.

  - **Conflict 2: Closure Under the Agent's Own Inference Rules**  
    The question is whether we can require closure under the agent's own inference rules without collapsing into omniscience. The agent's inference rules are limited, so closure under those rules might be feasible. However, even a limited set of rules might require the agent to derive an unbounded number of conclusions. We cannot require the agent to have derived every consequence that follows by one of its rules because of resource constraints. 

    *Verdict*: We cannot require closure under the agent's own inference rules in the sense of having actually performed every inference. That would be an engineering impossibility. But we can require that the agent's belief state is *closed* in the sense that it contains the conclusions of the inferences that the agent has actually performed (and not necessarily more). This is the approach taken by explicit belief representations. However, note that the first desideratum (non-instantiation) requires that the agent does not have the conclusion until the inference is performed. So we must avoid requiring that the agent has performed every inference it is capable of. The requirement must be that the agent's state is closed under the inferences it *has* performed (so that if it has the premises and has performed the inference, then it has the conclusion) but not under every possible inference it could perform. This is an engineering requirement to record the inferences that have been done.

  - **Conflict 3: Substitution of Logical Equivalents**  
    Can a representation of belief rich enough to compose with probability, decision, and communication escape licensing the substitution of logical equivalents? The problem is that if two propositions are logically equivalent, then in a possible worlds semantics for belief, they are true in the same worlds and hence must be believed to the same degree. But the agent might not recognize that they are equivalent. 

    *Verdict*: This is a theorem-level conflict. If we require that the agent's degrees of belief are represented by a probability function that is defined over an algebra of propositions (and that respects logical equivalence), then we are forced to assign the same probability to logically equivalent propositions. However, the agent might not know the equivalence. There are two ways out: 
    (a) We can use a syntactic representation of beliefs (so that the agent's beliefs are tied to the form of the proposition) and then define probabilities over syntactic objects. But then we lose compositionality with standard probability and decision theory (which are typically semantic). 
    (b) We can use a structured possible worlds approach (e.g., with impossible worlds) that allows logically equivalent propositions to be distinguished. However, this complicates the probability assignment because we cannot use standard probability measures on sets of worlds (since the worlds are not closed under logical equivalence). 

    This conflict is deep and seems to require a departure from standard possible worlds semantics. It is a theorem that in a standard possible worlds model, logical equivalents are not distinguishable. Therefore, to avoid this, we must use a non-standard representation.

  ### The Most Excluding Requirement

  The requirement that does the most to exclude existing families of accounts is:

  **Non-Closure without Contradiction (Desideratum 3)**  
  This requirement directly challenges logical omniscience and forces the theory to abandon the idea that belief is closed under logical consequence. It also rules out possible worlds models (if used in the standard way) because in possible worlds, if an agent believes a set of premises that entail a conclusion, then the conclusion is true in all worlds the agent considers possible (so the agent implicitly believes the conclusion). 

  ### Brief Evaluation of Existing Families of Accounts

  1. **Possible Worlds Models**  
     - *Non-Instantiation*: Fails. If the agent believes ∀x(P(x)→Q(x)) and P(a), then in every world the agent considers possible, P(a)→Q(a) holds and P(a) holds, so Q(a) holds. Hence, the agent believes Q(a) implicitly.
     - *Overwritten Conclusion*: Cannot directly represent that a conclusion was once held and then lost because the model only captures current belief.
     - *Non-Closure*: Fails because of logical omniscience.
     - *Contradictory Subsystems*: Can be modeled by having multiple sets of possible worlds for different subsystems, but then we lose a unified belief state. Standard possible worlds require global consistency.
     - *Degrees of Belief*: Possible worlds can be used for probabilistic models (e.g., by a probability distribution over worlds). But then the agent must assign the same probability to logically equivalent propositions. Also, the agent implicitly assigns probabilities to every proposition expressible in the language, which may be too much.

  2. **Syntactic Models (e.g., sets of sentences)**  
     - *Non-Instantiation*: Passes. The agent's belief set may contain the universal conditional and the antecedent without containing the consequent.
     - *Overwritten Conclusion*: Can pass by allowing the belief set to change over time (so at one time the consequent was in the set and then removed).
     - *Non-Closure*: Passes by definition. The belief set is not required to be closed under any rules.
     - *Contradictory Subsystems*: Can be modeled by having multiple sets of sentences that are not merged, so the agent can have P in one set and ¬P in another without the contradiction being explicit in the union.
     - *Degrees of Belief*: Fails for the same reason as above: we cannot easily assign probabilities to sentences in a way that composes with decision theory without facing the problem of logical omniscience. Also, without a semantic grounding, it is hard to ensure that the degrees of belief are coherent.

  3. **Probabilistic Syntax-Based Models (e.g., over formulas)**  
     - *Non-Instantiation*: Passes (as above).
     - *Overwritten Conclusion*: Can pass by changing the probability distribution (e.g., setting the probability of the conclusion to a default or prior when overwritten).
     - *Non-Closure*: Passes.
     - *Contradictory Subsystems*: Can be modeled by having separate probability distributions for different subsystems, but then how to combine for decision making?
     - *Degrees of Belief*: Passes in the sense that we assign degrees to formulas. However, note that without a semantic foundation, we might have P(A) and P(B) for logically equivalent A and B being different. This is problematic for decision theory because the agent might choose differently between two equivalent options.

  4. **Impossible Worlds Models**  
     - *Non-Instantiation*: Passes. The agent might consider possible an impossible world where ∀x(P(x)→Q(x)) and P(a) hold but Q(a) does not.
     - *Overwritten Conclusion*: Can be modeled by changing the set of worlds considered possible (so that after overwriting, the agent no longer rules out worlds where the conclusion is false).
     - *Non-Closure*: Passes because impossible worlds allow the agent to not believe every consequence.
     - *Contradictory Subsystems*: Can be modeled by having different sets of worlds for different subsystems, but then we need a way to combine them. Alternatively, we can have worlds that are locally consistent but globally inconsistent.
     - *Degrees of Belief*: This is challenging. We can define a probability distribution over a set of worlds that includes impossible worlds, but then the probability of a proposition is the measure of the set of worlds (including impossible ones) where it holds. However, we lose the logical properties of probability (e.g., if A and B are equivalent, they may have different probabilities because they might be represented differently and have different sets of worlds). This might be acceptable but complicates decision theory.

  ### Conclusion

  The most excluding requirement is the non-closure requirement (Desideratum 3) because it forces us to abandon possible worlds in their standard form and to use a model that is sensitive to the agent's limited reasoning capabilities. 

  Among the existing families, syntactic models and impossible worlds models are the most promising. However, both face challenges in integrating with decision theory. The conflict over substitution of logical equivalents is a deep one and may require a compromise: either we give up the idea that the agent's degrees of belief must be defined for every proposition in a way that respects logical equivalence (and instead use a syntactic approach) or we use impossible worlds and accept that the probability function may not satisfy the standard properties.

  In summary, we must design a theory that is syntactic or uses impossible worlds to handle the first four desiderata, and then find a way to assign degrees of belief that are useful for decision making without requiring full logical omniscience. This is an engineering challenge that might be addressed by defining the degrees of belief contextually (only for the propositions that matter for the current decision) and by using a representation that allows for the agent's limited reasoning.
answer: |-
  ### Desiderata for a Theory of Belief in Limited Agents  
  Below, I outline the core requirements for a theory of belief for artificial agents operating under time pressure and cognitive constraints. Each requirement is grounded in a specific case, with the rationale for why it is a non-negotiable standard of adequacy.  

  #### **Core Desiderata**  
  1. **Silent Consequents from Uninstantiated Conditionals**  
     - **Case**: An agent stores `∀x (P(x) → Q(x))` and `P(a)` but has not instantiated `Q(a)`.  
     - **Requirement**: The theory must represent the agent as *lacking* belief in `Q(a)` despite having the necessary premises.  
     - **Rationale**: Cognitive limits prevent exhaustive instantiation; failure here collapses the distinction between *implicit* and *explicit* belief.  

  2. **Overwritten Working Memory**  
     - **Case**: An agent derived `Q(a)` but later lost it due to memory constraints.  
     - **Requirement**: The theory must distinguish *past* belief (now forgotten) from *current* belief.  
     - **Rationale**: Memory dynamics are essential; conflating past and current states misrepresents the agent's epistemic access.  

  3. **Non-Closure Under Tautological Entailment**  
     - **Case**: An agent believes "all tautologies are true" but does not believe a complex tautology (e.g., a 10,000-term disjunction).  
     - **Requirement**: The theory must allow belief in general rules without belief in every instance.  
     - **Rationale**: Computational boundedness precludes deriving all consequences; closure would imply omniscience.  

  4. **Local Consistency in Non-Interacting Subsystems**  
     - **Case**: Subsystem A believes `P`, Subsystem B believes `¬P`, and they never interact.  
     - **Requirement**: The theory must permit global inconsistency while preserving local consistency *within* subsystems.  
     - **Rationale**: Modular architectures (e.g., robotics) often have isolated components; global consistency is unrealistic.  

  5. **Degrees of Belief Without Full Awareness**  
     - **Case**: An agent must assign probabilities for decisions but holds no attitude toward most logical consequences.  
     - **Requirement**: Degrees of belief must be definable for choice-relevant propositions, even for non-explicit consequences.  
     - **Rationale**: Decision theory requires probability assignments; the agent cannot be punished for unawareness.  

  ---

  ### **Conflicts Among Desiderata**  
  Certain requirements are jointly unsatisfiable due to fundamental tensions. Here, I distinguish **theorem-level** conflicts (logical incompatibility) from **engineering-level** conflicts (practical infeasibility under constraints).  

  #### **1. Closure vs. Omniscience Avoidance**  
  - **Conflict**: Can we require closure under the agent’s *own inference rules* without collapsing into logical omniscience?  
  - **Verdict**: **Theorem-level conflict**.  
    - If the agent’s belief state is closed under its *admissible* inference rules (e.g., modus ponens), it must believe all conclusions derivable via those rules. However, Desideratum 1 (non-instantiation) requires that uncomputed consequents are *not* believed. Thus:  
      - **Inconsistency**: Closure demands belief in `Q(a)` from `∀x (P(x)→Q(x))` and `P(a)`, but Desideratum 1 forbids this.  
    - **Resolution**: Closure can only apply to *explicitly computed* beliefs, not *admissible* inferences. The theory must decouple "competence" (inference rules) from "performance" (computed beliefs).  

  #### **2. Probability and Logical Equivalence**  
  - **Conflict**: Can a belief representation compose with probability/decision theory without licensing substitution of logical equivalents?  
  - **Verdict**: **Theorem-level conflict**.  
    - Probability theory requires `P(A) = P(B)` if `A ≡ B` (logically equivalent). Desideratum 3 (non-closure) demands that an agent may believe `A` but not `B` even if `A ≡ B`.  
    - **Example**: An agent believes `A` (a simple tautology) but not `B` (a complex equivalent tautology). Probability assignment forces `P(A) = P(B) = 1`, but the agent *does not believe `B`*.  
    - **Resolution**: This necessitates **syntactic** or **hyperintensional** belief representations (e.g., structured propositions). Standard possible-worlds probability fails.  

  #### **3. Degrees of Belief for Non-Explicit Propositions**  
  - **Conflict**: Desideratum 5 requires degrees of belief for non-explicit consequences, but Desiderata 1–3 forbid implicitly believing them.  
  - **Verdict**: **Engineering-level conflict**.  
    - Assigning probabilities to non-explicit propositions (e.g., `Q(a)` in Desideratum 1) is essential for decisions, but the agent cannot compute them on demand.  
    - **Resolution**: Belief states must include a **partial probability distribution** defined only over a contextually relevant subset. Non-computed propositions can have undefined or default probabilities.  

  ---

  ### **Most Exclusionary Requirement**  
  **Non-Closure Under Tautological Entailment (Desideratum 3)** is the most exclusionary:  
  - It forces abandonment of **possible-worlds models** (which equate belief with truth in all accessible worlds, implying closure).  
  - It invalidates **logically omniscient probabilistic models** (e.g., those using standard probability measures).  
  - It necessitates **computational or syntactic theories** where belief is sensitive to derivation history and resource limits.  

  ---

  ### **Evaluation of Existing Theories**  
  Below, I score major families of belief models against the desiderata (✓ = satisfies, ✗ = violates, ~ = partial):  

  | **Theory**               | **D1: Silent Consequent** | **D2: Overwritten Belief** | **D3: Non-Closure** | **D4: Local Consistency** | **D5: Degrees w/o Awareness** |  
  |--------------------------|---------------------------|----------------------------|---------------------|----------------------------|-------------------------------|  
  | **Possible Worlds**      | ✗ (Belief closed under entailment) | ✗ (Static belief sets)     | ✗                   | ✗ (Global consistency)     | ~ (Can assign probabilities, but requires equivalence) |  
  | **Sentential (Syntax)**  | ✓ (Beliefs as explicit tokens) | ✓ (Memory is mutable)      | ✓                   | ✓ (Subsystem isolation)    | ✗ (No probabilistic grounding) |  
  | **Probabilistic (Bayesian)** | ✗ (Implicit closure)      | ~ (Via belief updating)    | ✗                   | ✗ (Requires global coherence) | ✓ (Handles uncertainty) |  
  | **Hyperintensional (e.g., Impossible Worlds)** | ✓ (Fine-grained content) | ~ (Depends on framework)   | ✓                   | ✓ (Worlds can be inconsistent) | ✗ (Probability over worlds violates D3) |  
  | **Computational (e.g., Algorithmic)** | ✓ (Derivation-dependent) | ✓ (Stateful)               | ✓                   | ✓ (Module-specific states) | ~ (Can define local probabilities) |  

  #### **Summary of Gaps**  
  - **Possible Worlds**: Fails D1, D3, D4 (omniscience/global consistency).  
  - **Standard Probabilistic Models**: Fail D1, D3, D4 (closure under equivalence and coherence).  
  - **Purely Sentential Models**: Fail D5 (no integration with decision theory).  
  - **Hyperintensional Models**: Struggle with D5 (probability must respect structure).  
  - **Computational Models**: Best fit but require extensions for D5 (partial probability assignments).  

  ---

  ### **Conclusion**  
  A viable theory must:  
  1. Use **syntactic or computational states** to handle non-closure (D1, D2, D3).  
  2. Allow **subsystem-local belief** (D4) via modular representations.  
  3. Support **partial probability distributions** for decision contexts (D5).  
  4. **Reject closure under inference rules** to avoid omniscience (theorem-level conflict).  
  5. **Reject substitution of logical equivalents** in belief ascriptions (theorem-level conflict).  

  The tension between *explicit belief* (D1–D4) and *probabilistic decision* (D5) remains an engineering challenge, solvable via context-bounded probability. **Computational belief models** (e.g., derived belief bases + resource-bounded reasoners) are the strongest candidates but require probabilistic extensions to satisfy D5 without violating D1–D3.
