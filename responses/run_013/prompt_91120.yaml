answer: |-
  ### Joint Statement on Modality: Counterpart Theory vs. Transworld Identity  

  #### **Framing**  
  This document outlines shared ground and persisting disagreements between counterpart theory (CT) and genuine transworld identity (TI) regarding de re modality. Both aim to explain how individuals could have been otherwise or exist in alternative scenarios. CT holds that modality involves *representationally related* individuals across worlds; TI holds that a *single numerically identical* individual exists in multiple worlds. Neither disputes modal truths (e.g., "Obama could have lost in 2012"), but they diverge on what grounds them.  

  ---

  #### **Agreed Claims**  
  1. Modal operators (□/◇) quantify over possible worlds.  
  2. The necessity of identity (∀𝑥∀𝑦(𝑥=𝑦 → □𝑥=𝑦)) holds.  
  3. Proper names are rigid designators (they denote the same individual in all worlds where that individual exists).  
  4. Worlds are maximally consistent states of affairs.  
  5. No individual exists in more than one *actualized* world.  
  6. Modal claims require a parameter (e.g., similarity, essence) to fix truth conditions.  
  7. Neither view entails modal realism (worlds need not be concrete).  
  8. Neither view denies that we make true *de re* modal judgments.  
  9. Both agree that "identity" in the necessity of identity is strict numerical identity.  
  10. Both reject extreme haecceitism (bare identities without qualitative grounding).  

  ---

  #### **Residual Disagreements**  
  | Issue                     | Counterpart Theory (CT)                                 | Transworld Identity (TI)                                |  
  |---------------------------|--------------------------------------------------------|--------------------------------------------------------|  
  | **Nature of cross-world individuals** | Individuals are world-bound; counterparts represent via similarity. | A single individual is literally present in multiple worlds. |  
  | **Truthmaker for "x could have been F"** | A counterpart of 𝑥 in some world is 𝐹.                  | The same 𝑥 in some world is 𝐹.                         |  
  | **Worldboundness**        | Necessarily, no individual exists in multiple worlds.   | Individuals can exist in multiple worlds; worlds overlap. |  
  | **What transworld identity tracks** | Identity is world-relative; no transworld identity.     | Identity is absolute; transworld identity is primitive. |  
  | **Role of similarity**    | Essential to modality; counterparts selected by context. | Accidental; identity is prior to representation.        |  

  ---

  #### **Cruxes**  
  1. **The violinist case**  
     - *CT Prediction*: At 25, her counterparts include cellists (high similarity in talents). At 55, no cellist-counterparts exist (dissimilar life trajectories). Both claims are contextually true.  
     - *TI Prediction*: Her essence determines possibilities timelessly. If cellisting was ever possible, it remains possible. Her later denial is epistemic error or essence revision.  

  2. **The counting case**  
     - *CT Prediction*: Two answers possible: (a) No one is A (if A has no counterpart there), or (b) Both are A’s counterparts (if similarity is symmetric). Context resolves ambiguity.  
     - *TI Prediction*: Neither is A. A exists only in worlds with *her haecceity*. Swapping violates identity.  

  **What moves each side?**  
  - CT: Shifts in conversational context or similarity metrics.  
  - TI: Intuitions about enduring self-identity (e.g., "I could have been born elsewhere").  

  ---

  #### **Verbal or Substantive?**  
  1. **Verbal**: "Identity" in *de re* claims. CT uses it for representation; TI for strict identity. Clarifying this diffuses false conflicts.  
  2. **Substantive**: What modal facts *consist in*. CT reduces modality to world-bound particulars + similarity; TI requires primitive transworld identity.  
  3. **Verbal**: "Worldboundness." Both agree no individual is wholly present in two worlds, but TI allows partial overlap (e.g., shared individuals).  
  4. **Substantive**: Whether modality is contextual (CT) or absolute (TI).  

  ---

  #### **Bottom Line**  
  For a neutral reader, the dispute is less about empirical predictions than explanatory frameworks. CT offers a contextualist, similarity-based account; TI prioritizes unified identity across logical space. Both validate nearly all everyday modal claims, differing only in esoteric cases (e.g., swapping, essence shifts). The stakes concern philosophical economy: CT avoids primitive transworld identities but invokes context-dependence; TI secures absolute identity but requires haecceities. Neither "wins" outright—choice hinges on which costs one prefers.  

  ---  
  *This document may be signed by adherents of both views as a testament to shared foundations and persisting, but precise, disagreements.*
