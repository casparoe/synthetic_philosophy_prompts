prompt: |-
  ok so me and my friend keep arguing about this and i want an actual number from you, not an "it depends." Scenario: someone paints a canvas that is molecule-for-molecule identical to a famous old masterpiece, but they made it last year in a different country, and they werent trying to trick anyone, they just loved the painting and copied it perfectly. Whats your credence, 0 to 1, that this copy has exactly the same aesthetic value as the original (not price -- value as art)? Give me the decomposition: how much rides on whether aesthetic value is in the objects visible properties vs. its history (who made it, when), how much on whether we mean the value of the experience of looking at it vs. the value of the thing itself, how much on whether the artist's act of making it counts as part of the value, plus any other term you think belongs -- a rough probability for each, then how they combine. Then say which sub-question your number is most sensitive to and what would move it the most. And does your number change if the original got destroyed and this copy is now the only one left? If it does, why does that matter, given the two are literally identical to look at?
