prompt: |-
  I'm a novelist, not a philosopher, so forgive the laymans terms. I'm writing a book about two strangers who do each other a good turn in a situation where they'll never see each other again and nobody else is around to see it. I've been trying to figure out why that's even possible, and I keep noticing a pattern in real life that I don't have a word for. It's not the usual "they'll meet again so they have to play nice" thing, and it's not "someone's watching so they have to protect their reputation." In the cases I mean there's no future interaction and no audience — like the guy who returns a wallet he found in a cab with no ID in it, or someone who keeps a promise to a friend who's dead. What there is instead is a third party who isn't in the situation at all: a dead parent, a god, a future reader, the kind of person they'd like to be. The two people cooperate because each is imagining being seen by someone who can't do anything back. I've been calling it "the invisible witness" in my notes but that's just my own tag. Is there an established name for this? If there is, how is it different from plain reputation, or from the idea that you're nice to people because it gets back to you through other people, or from the Kantian rule about only acting on a principle you'd want everyone to follow? If there isn't, coin one for me — and be precise about what it includes and leaves out. I don't just want a label, I want the shape of the thing: what makes it different from each of those, and which of them it's closest to. Take a definate position — don't give me a menu of options and leave me to pick. Give it to me as exactly five numbered points, each a sentence or two, with no intro and no conclusion.
reasoning: |-
  Okay, the user is a novelist looking for a term to describe a specific concept they've observed in real life and want to explore in their book. They've noticed a pattern where people do good deeds when there's no possibility of future interaction or audience observation—like returning a wallet with no ID or keeping a promise to a deceased friend. Instead, they act because they imagine being witnessed by a third party who isn't actually present: a dead parent, a god, a future reader, or an idealized version of themselves. They've been calling it "the invisible witness" but want to know if there's an established term or if I can coin one.

  The user explicitly wants a precise definition distinguishing this concept from related ideas like reputation management, indirect reciprocity, or Kantian ethics. They've requested exactly five numbered points with no introduction or conclusion. This suggests they value clarity and conciseness for their writing process.

  I recall that this concept touches on several philosophical and psychological ideas. The "invisible witness" mechanism resembles Durkheim's "social fact" theory where internalized social norms govern behavior, and Goffman's presentation of self where we perform for imagined audiences. It also connects to Mead's "generalized other" concept and Kierkegaard's religious accountability before God. Psychologically, it relates to internalized norms and moral self-concept.

  The user needs to distinguish this clearly from: 1) direct reciprocity (future interactions), 2) reputation management (audience effects), 3) indirect reciprocity (community payback), 4) Kantian universalizability (abstract principles), and 5) simple self-interest. The key differentiator is the imagined unilateral witness—someone who observes but cannot reciprocate or judge externally.

  Having considered existing terms like "internalized audience" or "transcendent witness," I decide to coin "Immanent Accountability" as the most precise descriptor. This captures the internalization aspect ("immanent") and the sense of answerability ("accountability") to an entity that exists within one's psyche rather than externally.

  For the five-point definition: First establishes core mechanism (imagined unilateral witness). Second contrasts with reciprocity and reputation. Third distinguishes from Kant by emphasizing personal standards over universal rules. Fourth clarifies the witness's non-interference. Fifth specifies the witness types (hyperreal entity, ideal self, abstract observer). This structure precisely carves out the conceptual space the user needs.
answer: |-
  Here is the defined concept, precisely bounded:

  1.  **Core Mechanism:** This is **Immanent Accountability**: the compulsion to act morally based solely on the imagined perception of a specific, non-present entity (e.g., a deity, a deceased person, an idealized self, or an abstracted future judgment) that observes but cannot reciprocate or enforce consequences within the immediate situation.
  2.  **Distinction from Reciprocity/Reputation:** Unlike direct reciprocity (expecting return from the beneficiary) or reputation management (expecting consequences from a present or future social audience), Immanent Accountability requires *no expectation of external social or material feedback*; the imagined witness exists outside the social exchange economy entirely.
  3.  **Distinction from Kantian Universalizability:** While Kant's Categorical Imperative demands acting on principles universalizable for all rational agents, Immanent Accountability is fundamentally *personal and particular* – the witness is a specific, subjectively significant presence (e.g., "What would *my father* think?" not "What rule should *everyone* follow?").
  4.  **Nature of the Witness:** The imagined entity possesses *witnessing capacity without intervention capacity* – it observes and the actor feels answerable *to it*, but the witness cannot directly reward, punish, or influence the situation's outcome (unlike an omnipotent god who *could* intervene).
  5.  **Scope and Content:** This accountability is triggered by *internalized personal standards* (honesty, integrity, loyalty to the *idea* of the witness) projected onto the hyperreal entity, focusing on *being true to one's self-conception* as witnessed by this other, rather than adherence to abstract rules or social norms.
