prompt: |-
  Me and a buddy from work — we're both backend engineers, neither of us took a single philosophy class — have been arguing about something for two weeks and I've run out of moves. A month ago he got an email from someone claiming to be an early hire at a lab that's about to switch on an AI way smarter than any person. No threat in it, no "send money or else." It just said they're taking contributions from people who act now, and everyone who's in before launch gets a cut of what comes after, described in numbers that stopped meaning anything to me around "a trillion trillion dollars each." He says he's 99.999% sure it's a scam. He says thats exactly the point. His argument: he can't honestly put a real number on the 0.001%, because "we have zero data about what a thing like that would do, so any probability I write down is something I made up, and if I'm making it up I don't get to pick one that's conveniently small enough to let me off the hook." Then he multiplies his made-up chance by their made-up number and it says send money. He's wiring $4,000 on Thursday — basically his whole house deposit — and a second email came in yesterday from a different "lab" that he's also thinking about paying.

  He's definately not dumb and he's not trolling me. He told me if I want him to skip the wire, I need to give him an actual rule, because "it sounds like a scam" isn't one — he already agrees it's a scam, he just says that's not the same as it being the wrong bet. He also floated his own fix and wants to know if it's legit or just cowardice with extra steps: a personal policy where, when you multiply the chance by the payoff, you cap the result at some human-sized figure (he said a million "units," whatever those are) so that no single decision can ever get pushed around by a number that big.

  So what do I tell him Wednesday night? Is he right that his own logic leaves him no way out? Is the cap a real answer or is he cheating — and if he's cheating, what's the non-circular version of "don't send it" that I can actually put in front of him?
reasoning: |-
  Okay, let me unpack this problem. The user and his coworker are backend engineers debating a philosophical dilemma around an AI investment scam. The coworker admits it's 99.999% likely a scam but argues that the potential payoff (a "trillion trillion dollars") forces him to act due to expected value calculations. He's about to wire $4000 - his entire house deposit - and wants either a logical rule to stop him or validation for his proposed "cap" solution. 

  First, I need to dissect the coworker's argument. His core point is mathematically sound in isolation: when expected value = probability × payoff, even tiny probabilities dominate if the payoff is enormous. This is the Pascal's Wager problem applied to tech scams. But his approach has three critical flaws he might be overlooking.

  The probability estimation isn't just unknown - it's epistemically bankrupt. Assigning 0.001% to an unsolicited email claiming world-changing AI requires ignoring base rates. How many such emails exist versus how many are real? Probably billions to zero historically. His 0.001% is arbitrarily high - it could be 10^-30 based on actual scam statistics. He's treating probability as a free variable when it's constrained by evidence.

  Then there's payoff validity. "Trillion trillion dollars" isn't just big - it's logically incoherent. Global GDP is ~$100T. That payoff implies owning 10^16 Earth economies. The number isn't large - it's meaningless, like saying "infinity dollars." Expected value calculations break when inputs aren't just uncertain but nonsensical.

  Also, decision theory isn't one-dimensional. He's ignoring:
  - Alternative investments (that $4000 could go to real opportunities)
  - Sunk cost risks (this likely enables further scams)
  - Psychological harm (gambling logic can spiral)

  His proposed "cap" solution shows he intuitively grasps the problem but implements it poorly. Capping expected value at "a million units" is arbitrary. Better to recognize some payoffs are so absurd they should be treated as zero. There's precedent: we ignore claims of perpetual motion machines or Nigerian princes not because probability is zero, but because the combination of low probability and incoherent claims fails rationality tests.

  For Wednesday's talk, I should structure the counterargument around:
  1) Probability grounded in reality: Use historical data on unsolicited "too good to be true" offers
  2) Payoff coherence: Show mathematically why "trillion trillion" can't exist in our economy
  3) Holistic decision factors: Reputation damage, mental health, and opportunity cost
  4) Better heuristics: "If it paralyzes you with scale, it's manipulation" or "Never bet on physically impossible payoffs"

  The key is avoiding circular "it's obvious" reasoning while respecting his logical framework. I'll prepare concrete analogies - like calculating expected value for a email claiming to sell the actual Sun. The number might technically be "infinite" if you believe the offer, but we dismiss it because the premise collapses under scrutiny.

  Also worth noting: his second scam email proves the exploit works. Once you pay once, you're flagged as vulnerable. That $4000 isn't a bet - it's an invitation for endless extraction.
answer: |-
  Here's a structured, non-circular argument against wiring the money, addressing his logic directly while providing a concrete alternative rule:

  ### The Core Flaw in His Expected Value Calculation
  His equation `(Probability) × (Payoff)` fails when **both terms are epistemically rotten**:
  1. **Probability isn't just "unknown" – it's *unanchorable*.**  
     He admits he has "zero data," but the problem is deeper: **there's no rational method to assign *any* positive probability here.**  
     - Scam base rates: Unsolicited emails promising universe-altering returns have a historical truthfulness rate indistinguishable from 0% (e.g., Nigerian prince scams, Ponzi schemes).  
     - The burden of proof: Extraordinary claims require extraordinary evidence. An email with no verifiable credentials, patents, or third-party validation provides *less than zero* evidence (it matches scam patterns).  
     **→ Rule 1: If a claim provides no evidence *beyond* what a scam would fabricate, its probability defaults to the scam base rate (~0%).**

  2. **The "Payoff" isn't just large – it's *meaningless***:  
     "A trillion trillion dollars" exceeds global GDP by 12+ orders of magnitude. It implies owning >1,000,000 Earth-sized economies. This isn't a "big number" – **it's a logical impossibility** in any coherent economic model.  
     **→ Rule 2: If a payoff is physically/economically incoherent, treat it as $0 in EV calculations.**

  ### Why His "Cap" Fails (and a Better Version)
  - **His cap is arbitrary**: Capping EV at "a million units" ignores context. Is $1M life-changing? Yes. Is it relevant when comparing to *real* investments? No.  
  - **Better: Cap the *Payoff Input* at Plausible Maxima**  
    Anchor to reality: "What's the largest *plausible* payoff from any investment?" (e.g., early Apple investors saw ~10,000x returns).  
    **→ Rule 3: In EV calculations, cap potential payoffs at the maximum *historically observed* return for analogous investments (e.g., 10,000x).**  
    *(Even this is generous – VC fails 90% of the time.)*

  ### The Non-Circular "Don't Send It" Argument
  **Present this flowchart:**
  ```
  1. Did you seek this opportunity? → NO (unsolicited email)  
  2. Is there proof of legitimacy? → NO (no verified team, no prototype, no trusted 3rd-party)  
  3. Is the payoff realistic? → NO (logically incoherent)  
  4. Are you told urgency is required? → YES (red flag for scams)  
  → CONCLUSION: Not a rational investment – a known scam pattern.  
  ```

  ### Why His Logic *Does* Have an Escape Hatch
  **Expected value requires defensible inputs.** His mistake: treating the probability as a *free parameter*. But probability isn't a number you plug in – **it's a function of evidence.**  
  - With **zero evidence for legitimacy** and **overwhelming evidence for scam patterns**, the probability isn't "0.001%" – it's *effectively 0%* for decision purposes.  
  - **Analogy**: "There's a 0.001% chance this email contains an invisible dragon that will grant you wishes. Should you pay $4,000?" No – because invisible dragon probability isn't 0.001%; it's 0% until evidence exists.  

  ### What to Tell Him Wednesday Night
  > "Your EV math breaks because both terms are garbage.  
  > **First, the probability**: Assigning 0.001% to an unsolicited email with insane claims and no proof isn't 'conservative' – it's *wildly* inflated. Base rates say this is ≈100% scam. You can't inject a fake number to make the equation 'fair.'  
  > **Second, the payoff**: 'Trillion trillion dollars' is nonsense. It's like saying 'infinity dollars.' You can't multiply by nonsense.  
  >  
  > **Better rules**:  
  > 1. **Never assign >0% probability to extraordinary claims without extraordinary evidence.** This email has none.  
  > 2. **Cap payoffs at real-world maxima** (e.g., 10,000x returns).  
  > 3. **If it walks/scams like a duck, ignore fake probabilities.**  
  >  
  > Wiring $4,000 here isn't Pascal's Wager – **it's getting mugged by a fabricated number.** Save your house deposit."

  ### Key Psychological Defense
  - **The Scam's Trick**: It weaponizes your rationality. "What if??" exploits our fear of missing out on universe-altering upside. But **true rationality rejects fabricated premises**.  
  - **The Second Email**: Proves he's on a sucker list. Paying once guarantees endless "opportunities" until he's bankrupt.  

  **Bottom line**: His "no data" doesn't mean all probabilities are equal – it means **default to base rates**. And the base rate says: **this is absolutely, unequivocally a scam.** $4,000 pays for a scammer's new laptop – not a slice of a fictional AI utopia.
