  I am currently in a seminar on classical Chinese philosophy, and we have been working through the White Horse dialogue associated with the School of Names. The familiar puzzle is that the text concludes that a white horse is not a horse, which looks like a contradiction until one distinguishes the compound term white horse from the simple term horse. A classmate has proposed a reading that I find both attractive and suspicious: she argues that the argument is not primarily about class inclusion at all, but about the way adjectives like white function as kind-restrictors or mass-like modifiers, so that white horse names a determinate kind whose extension is fixed by the combination of a color-kind and an animal-kind, and which therefore is not a sub-kind of horse in the sense the text is using. On her view, the dialogue is a proto-semantic investigation into how modifier-plus-noun compounds get their reference, not a denial of the obvious fact that every white horse is a horse.

  I have no idea how to assess this. What is your credence that this reading is correct, stated as a number? I would like the number decomposed into the sub-questions it depends on: whether the text's argument turns on a distinction between naming and predication; whether the term horse is being used as a kind term or a class term; whether the reading makes the argument valid rather than merely clever; whether it fits the School of Names' broader interest in language and paradox; and whether it anachronistically imports a modern distinction between mass and count nouns or between modifiers and predicates. Assign a rough probability to each, say how they combine, and tell me which sub-question the final number is most sensitive to. My own credence is about 0.45 and my classmate's is about 0.8; tell me where our disagreement most likely lives, and what textual or philosophical consideration would move your number most.
