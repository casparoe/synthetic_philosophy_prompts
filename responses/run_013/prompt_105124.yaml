prompt: |-
  For the past several months I have been sitting in on a small reading group that is working through Jain accounts of many-sided truth, and I have been asked to draft the specification we will use to judge any theory of it we consider. I do not want a history of the doctrine or a survey of who held what; I want the desiderata — what any adequate account of many-sidedness must be able to do.

  Set them out, each with the consideration or case that generates it. The requirements I care most about are these: that a single claim be affirmable and deniable without either collapsing into flat contradiction or simply repealing the law of non-contradiction; that the inexpressible limb of the standard sevenfold predication be handled as something we cannot state rather than as one more statable value; that the view survive its own application to itself; and that a partial standpoint be distinguishable from complete knowledge without complete knowledge becoming just another standpoint. I would also like a requirement governing how the qualifier is read — as a modal operator of bare possibility, as an indexical marker of standpoint, or as something else — because our group keeps sliding between the readings without noticing.

  To keep this from turning into a recital, the requirements should be answerable to three cases: a colleague who says a given surgery is both healing and harming, and takes many-sidedness to license asserting both with no qualification; a dispute in which the parties agree on every fact but classify the same thing differently — whether a virus is alive, say — so that the disagreement is not about information at all; and a speaker who declares every position true from one standpoint or another in order to avoid committing to anything. Say which requirements are non-negotiable and which are merely preferences of one camp, name any pair you think cannot be jointly satisfied, and tell me which single requirement excludes the most otherwise attractive theories. Finish by scoring, briefly, the sevenfold-predication account, a frankly relativist reading, and a deflationary reading on which there is one world under many descriptions — I expect to argue about the scores myself.
reasoning: |-
  Okay, the user is part of a reading group on Jain many-sided truth (anekāntavāda) and needs to draft a specification for evaluating theories. They want desiderata, not historical accounts. Let me break down their main concerns.

  First, they need a single claim that can be both affirmed and denied without contradiction or repealing non-contradiction. That's tricky. The qualifier (like "syāt") must prevent contradiction somehow. Maybe through standpoint relativity?

  Then, the inexpressible limb in the sevenfold predication shouldn't be treated as just another truth value. It has to be genuinely ineffable. Also, the theory must apply to itself without inconsistency. And partial vs. complete knowledge must be distinct—complete knowledge can't just be another standpoint.

  The qualifier's meaning is a big issue. Their group slips between modal, indexical, or other readings. Clarifying that is essential. They provided three test cases: the surgery example (healing/harming), virus classification (fact agreement but different categorization), and the speaker who avoids commitment by saying everything is true from some angle.

  I should list out requirements based on these. Non-negotiables probably include avoiding contradiction, handling inexpressibility properly, self-application, and distinguishing standpoints from complete knowledge. The qualifier's interpretation might be a preference, but resolving ambiguity is crucial.

  For the test cases, each requirement should address them. E.g., the surgery case tests if both claims can be asserted qualifiedly without contradiction. The virus case challenges if differences are based on perspectives without factual dispute. The avoider tests if the theory prevents trivialization.

  Possible conflicts: Allowing both affirmation and denial without contradiction might clash with maintaining non-contradiction. Also, self-application could be problematic if the theory undermines itself. The qualifier's role is key here.

  Scoring the three theories: Sevenfold predication might handle ineffability well but could have self-application issues. Relativism might fail on self-application and the avoider case. Deflationism might oversimplify, missing ineffability and standpoint distinction.

  I need to ensure each requirement is tied to a rationale. The user wants clear desiderata with justifications. Also, highlighting which requirement is the biggest filter—probably the non-contradiction one, as many theories either allow contradictions or become trivial.
answer: |-
  Here is a specification of desiderata for evaluating theories of Jain many-sided truth (anekāntavāda), structured around your core requirements, test cases, and additional constraints. Requirements are labeled **R1-R8**, with rationale ("Generated by"), and assessed for negotiability. Non-negotiable requirements are marked with ⚖️.

  ---

  ### **Core Desiderata**

  1.  **R1 (Non-Collapsible Affirmation/Denial):** An adequate theory MUST allow a single proposition *p* to be both affirmable and deniable (under distinct qualified standpoints) without resulting in a logical contradiction *p ∧ ¬p*, AND without suspending or rejecting the Law of Non-Contradiction (LNC) as a fundamental logical principle governing assertions *within a single, consistent standpoint*.  
      *   **Generated by:** The core doctrine of *anekāntavāda* itself and your primary concern. The surgery case (*"this surgery is healing"* and *"this surgery is harming"*) demands this.  
      *   **Negotiability:** ⚖️ **Non-negotiable.** Failure here renders anekāntavāda either contradictory or trivial.

  2.  **R2 (Inexpressibility as Genuine Limitation):** An adequate theory MUST treat the seventh limb ("inexpressible" - *avaktavya*) not as a distinct truth-value (like "indeterminate" or "both true and false") but as representing a genuine *epistemic or linguistic limitation* preventing a unified assertion from a single standpoint. It marks a failure of expression under current constraints, not a positive state.  
      *   **Generated by:** The structure of the *saptabhaṅgī* (sevenfold predication) and the need to avoid reducing it to a multi-valued logic where the 7th limb is just another value.  
      *   **Negotiability:** ⚖️ **Non-negotiable.** Treating it as a value fundamentally misunderstands its role in Jain epistemology.

  3.  **R3 (Self-Application Survival):** An adequate theory MUST remain coherent and non-self-defeating when applied to its *own* claims about reality, truth, and standpoint-relativity.  
      *   **Generated by:** The threat of reflexive paradox (e.g., "Is *this theory* itself only relatively true?" leading to incoherence or infinite regress).  
      *   **Negotiability:** ⚖️ **Non-negotiable.** A theory that undermines its own foundation is inadequate.

  4.  **R4 (Distinction: Partial Standpoint vs. Complete Knowledge):** An adequate theory MUST provide a principled distinction between *naya* (a partial, conditioned standpoint) and *kevalajñāna* (omniscient, complete knowledge). Crucially, *kevalajñāna* cannot be reduced to merely one *naya* among others; it must possess a qualitatively different epistemic status (e.g., unconditioned, non-perspectival, comprehensive integration).  
      *   **Generated by:** The Jain soteriological goal and the need to avoid absolute relativism where all perspectives are equally limited.  
      *   **Negotiability:** ⚖️ **Non-negotiable.** Failure collapses Jainism into relativism or denies its ultimate goal.

  5.  **R5 (Qualifier Semantics Specification):** An adequate theory MUST explicitly define the logical and semantic function of the qualifier (typically *syāt* or *kathañcit*). It MUST specify whether it primarily functions as:  
      *   (a) A **modal operator** (indicating qualified possibility, necessity, or conditionality),  
      *   (b) An **indexical marker** (signalling dependence on a specific context, framework, or attribute being considered),  
      *   (c) A **suppositional prefix** (introducing a hypothetical standpoint), or  
      *   (d) Some other well-defined function. Crucially, the theory MUST justify its choice and show how it avoids ambiguity *within the theory's own framework*.  
      *   **Generated by:** Your group's observed slippage and the critical role *syāt* plays in preventing contradiction and marking perspective. The surgery case highlights the danger of dropping the qualifier.  
      *   **Negotiability:** **Content is Non-negotiable** (a theory MUST define it clearly and justify it). **The specific interpretation (a, b, c, d) is negotiable** (different camps favor different readings), but the choice MUST satisfy R1, R2, R3, R4, R7, and R8.

  6.  **R6 (Non-Trivialization Constraint - The "Avoider"):** An adequate theory MUST prevent the doctrine from being trivialized into the claim that *every arbitrary proposition is true from some standpoint*. It MUST provide criteria or constraints (e.g., based on real attributes, coherent frameworks, epistemic grounding) distinguishing legitimate, qualified assertions (*syāt p*) from illegitimate or nonsensical ones.  
      *   **Generated by:** The case of the speaker using many-sidedness to avoid commitment ("Everything is true from some angle").  
      *   **Negotiability:** **Non-negotiable** for adequacy. Without this, the doctrine loses all critical force.

  7.  **R7 (Non-Factual Disagreement Resolution):** An adequate theory MUST explain how seemingly contradictory assertions can be reconciled when parties agree on all underlying facts but disagree on classification or evaluation (e.g., "Is the virus alive?"). It MUST show how the disagreement arises from different, legitimate *nayas* focusing on different attributes or employing different conceptual schemes, without implying either party is factually wrong.  
      *   **Generated by:** The virus-alive case.  
      *   **Negotiability:** **Highly Preferred.** Core to illustrating anekāntavāda's value in resolving disputes. While a weak theory might dodge this, a strong one addresses it.

  8.  **R8 (Qualifier Enforcement):** An adequate theory MUST require the explicit or implicit use of the qualifier (*syāt*) for *every* non-absolutist assertion. Assertions made *without* the qualifier MUST be interpreted as absolute claims (subject to LNC) or treated as incomplete/invalid within the framework of many-sidedness.  
      *   **Generated by:** The surgery case where the colleague asserts both without qualification, misusing the doctrine.  
      *   **Negotiability:** **Non-negotiable.** Essential for preventing misuse and maintaining logical coherence (R1).

  ---

  ### **Analysis of Requirements**

  *   **Non-Negotiables (⚖️):** R1, R2, R3, R4, R6, R8. R5's requirement for *a* clear definition is non-negotiable, though the specific interpretation isn't.
  *   **Highly Preferred:** R7.
  *   **Potential Conflict:** **R1 (Non-Collapsible A/D) and R4 (Distinct Complete Knowledge)** are the most challenging pair to satisfy jointly. Theories emphasizing radical relativity struggle with R4 (reducing *kevala* to a perspective), while theories emphasizing a strong *kevala* can struggle with R1 (making qualified assertions seem merely provisional errors compared to the absolute truth).
  *   **Most Excluding Requirement:** **R1 (Non-Collapsible A/D)** excludes the most otherwise attractive theories. It eliminates:
      *   Standard dialetheism (explicitly accepts *some* true contradictions, violating "without collapsing into contradiction").
      *   Simple multi-valued logics (often violate R2 by making "inexpressible" a value, and struggle with R1 by needing rules that can imply contradictions or suspend LNC).
      *   Crude relativism ("true for me, false for you" often violates LNC implicitly or leads to R6 trivialization).
      *   Deflationary "many descriptions" views (often struggle to genuinely affirm *both p and ¬p* without qualification, tending towards "p under D1, ¬p under D2" which avoids contradiction but can feel like repealing LNC's scope).

  ---

  ### **Scoring the Theories Against Requirements**

  1.  **Classical Saptabhaṅgī (Sevenfold Predication) Account:**
      *   **R1:** **✓** Strong. *Syāt* prevents contradiction by indexing assertions.
      *   **R2:** **✓** Strong. *Avaktavya* is explicitly a failure of unified assertion, not a value.
      *   **R3:** **△** Problematic. Applying the 7 limbs to the doctrine itself or to *kevala* is notoriously difficult and often leads to unresolved tensions or special pleading. Can it assert its own truth qualifiedly without undermining itself?
      *   **R4:** **✓** Strong. Clear distinction between *naya* and *kevalajñāna* as fundamental.
      *   **R5:** **△** Weak. Historically ambiguous (often oscillates between modal and indexical readings). Needs modern formalization/specification.
      *   **R6:** **✓** Moderate. Implicit constraints via *naya* theory (focusing on real attributes) prevent utter triviality, but needs strengthening.
      *   **R7:** **✓** Strong. Core strength is resolving such classificatory disputes via *nayas*.
      *   **R8:** **✓** Strong. Qualifier is central and mandatory.
      *   **Overall:** **7/10.** Strong core but struggles with self-application (R3) and needs modern semantic rigor (R5).

  2.  **Frank Relativist Reading ("True relative to a perspective"):**
      *   **R1:** **△** Shaky. Can affirm *p*-relative-to-X and *¬p*-relative-to-Y, but often implies relativized truth values, risking violation of LNC *within* a perspective or triviality (R6).
      *   **R2:** **✗** Fail. Tends to reduce inexpressibility to "true/false relative to some perspectives, inexpressible relative to others" – making it a relational status, not genuine limitation.
      *   **R3:** **✗** Fail. "Is relativism itself only relatively true?" leads to self-defeat or incoherence.
      *   **R4:** **✗** Fail. Complete knowledge collapses into just another perspective.
      *   **R5:** **✓** Strong. Qualifier clearly indexical ("relative to perspective X").
      *   **R6:** **✗** Fail. Prone to trivialization ("Any *p* is true relative to *some* conceivable perspective").
      *   **R7:** **✓** Moderate. Explains disagreement as perspective difference, but lacks criteria for legitimate *nayas*.
      *   **R8:** **△** Moderate. Qualifier is central, but relativized truth often weakens its force.
      *   **Overall:** **3/10.** Captures perspectivism but fatally violates core Jain commitments (R2, R3, R4, R6).

  3.  **Deflationary "One World, Many Descriptions" Reading:**
      *   **R1:** **△** Shaky. Avoids contradiction by saying "p under description D1, ¬p under description D2". Strictly satisfies avoiding *p ∧ ¬p*, but risks *repealing LNC's scope* by suggesting reality itself is contradictory and descriptions just isolate aspects. Doesn't fully capture the Jain intent to *affirm both qualifiedly*.
      *   **R2:** **△** Weak. "Inexpressible" often becomes "not captured by any single description," which is still a statement *about* descriptions, not a genuine epistemic limitation. Approaches being a meta-descriptive value.
      *   **R3:** **✓** Strong. The claim "reality is one, descriptions are many" applies straightforwardly to itself.
      *   **R4:** **△** Weak. Complete knowledge might be "the complete set of all correct descriptions," which risks being just the sum of all standpoints, lacking the integrated, non-perspectival quality of *kevala*.
      *   **R5:** **△** Moderate. Qualifier often read as "under description D" (indexical). Clear but potentially reductionist.
      *   **R6:** **✓** Moderate. Constrained by needing descriptions to be *of the one world*, preventing utter arbitrariness. Needs more on legitimate descriptions.
      *   **R7:** **✓** Strong. Easily handles non-factual disagreement as differing descriptions/classifications.
      *   **R8:** **△** Weak. The qualifier ("under description D") is crucial, but assertions *within* a description often function absolutely.
      *   **Overall:** **5/10.** Logically safer but deflates the metaphysical and epistemic depth of *anekāntavāda*, struggles with R1 and R2, and weakens R4/R8. Avoids R3 failure.

  ---

  This specification provides a rigorous framework for debate. Prioritize theories that robustly satisfy the non-negotiables (R1-R4, R6, R8), particularly overcoming the R1/R4 tension and providing a clear account of the qualifier (R5) that supports the others. The scoring highlights the strengths and critical weaknesses of common approaches, offering a baseline for your group's arguments.
