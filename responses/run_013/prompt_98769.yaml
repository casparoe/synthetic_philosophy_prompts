prompt: |-
  So this is kind of a weird thing to be asking right after a doctors appointment, but here goes. I got diagnosed with high blood pressure last month — it runs in my family — and the first doctor told me it isnt really a disease, its a risk factor, and then the cardiologist two weeks later called it a disease and put me on pills. So I went down a rabbit hole on the philosophy of medicine and now Im more confused than when I started. The way I understand it, the naturalists (Boorse, I think?) say a disease is just a value-free biological fact — a dysfunction measured against some species-typical reference class — and the normativists say disease is inherently value-laden, that calling something a disease is always smuggling in a judgment about whats bad or unwanted. Heres my question. Since the normativists say its value-laden, doesnt that basically mean whether my blood pressure counts as a disease is just up to what society or my doctor happens to decide is bad? Is there even a fact of the matter here — if everyone stopped caring about strokes tomorrow, would it stop being a disease? And if thats really what normativism amounts to, isnt the naturalist obviously right, because my arteries are a mess regardless of what anyone values? I guess I want to know which side to believe. But honestly what I mostly want to know is whether my condition is really a disease or if thats just a label people are sticking on it. The reference class thing also bugs me — if you compare me to the species-typical, typical for who? my age? my sex? and if somebody has to pick the reference class, isnt that itself a value choice that sneaks the normativists back in? Sorry, I know thats alot.
