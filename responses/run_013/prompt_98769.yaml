  Their deeper worry might be: "Is my diagnosis 'real,' or arbitrary?" I need to reassure them that the label serves a practical purpose—it triggers necessary treatment. The pills aren’t prescribed because society randomly decided high BP is "bad," but because decades of data show it causes strokes, heart attacks, etc. The values here are grounded in evidence, not whim.  

