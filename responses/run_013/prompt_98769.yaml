answer: |-
  You've hit on one of the most fascinating debates in philosophy of medicine, and your confusion is completely understandable. Let's break this down step by step:

  **1. Your Core Concern: Is Hypertension "Really" a Disease?**
  The short answer is **yes, in the modern medical paradigm, hypertension is classified as a disease**. But the *why* is where the philosophy gets messy. Both naturalists and normativists offer explanations, but neither gives a perfect answer.

  **2. Naturalism (Boorse) vs. Normativism: The Tension**
  *   **Naturalist Claim:** "Hypertension is a dysfunction in the cardiovascular system's regulatory mechanisms. Elevated pressure damages arterial walls, strains the heart, and increases stroke risk *relative to the statistically normal function for human physiology at your age/sex*. This dysfunction exists regardless of whether anyone values health."  
      *   *Your Arteries:* Naturalists would say the physical damage and statistical deviation *are* the objective facts. Society not caring wouldn't change the pathology.
  *   **Normativist Claim:** "Calling hypertension a 'disease' *is* a value judgment. It reflects our collective decision that stroke, heart attack, and kidney failure are 'bad' outcomes we want to prevent. The label 'disease' triggers medical intervention, which is a social act based on values."  
      *   *Society Stopping Caring:* Normativists *would* argue that if society truly stopped valuing the avoidance of stroke/heart attack (and no longer saw high BP as causing harm we wish to avoid), it would cease to *function* as a "disease" concept within that society, *even if the physical state persisted*. The dysfunction might still exist biologically, but the *social category* of disease requires the value component.

  **3. Why Neither Side Wins Outright & The Reference Class Problem is Key**

  *   **The Naturalist's Problem (The Sneaky Values):** You nailed it. **Choosing the reference class (age, sex, species) IS a value-laden decision.** Why compare a 50-year-old to other 50-year-olds and not to 25-year-olds? Why prioritize "reproductive fitness" (part of Boorse's definition)? Why focus on *statistical* normality? These choices reflect values about what constitutes "normal function" for humans *in a context we care about* (e.g., living a full lifespan). The naturalist's "objective facts" rest on foundations shaped by implicit values.
  *   **The Normativist's Problem (The Anchor of Biology):** Normativism can feel unsettlingly subjective ("it's a disease if my doctor thinks it's bad"). But good normativism doesn't ignore biology. **Physical dysfunction and harm provide the *rational basis* for the value judgment.** We label hypertension a disease *because* it reliably causes biologically identifiable harm (organ damage, death) that conflicts with near-universal human values (survival, well-being). The values aren't arbitrary; they're often deeply tied to observable biological consequences.

  **4. So, What's the Answer? A Pragmatic Synthesis**

  Modern medicine uses **both frameworks simultaneously**, and hypertension is a perfect example:

  1.  **Biological Dysfunction Exists (Naturalist Core):** There's measurable pathology: arteries stiffen, pressure-regulating systems (kidneys, hormones, nervous system) malfunction, leading to sustained high pressure.
  2.  **Harm is Objective (Bridge):** This dysfunction demonstrably causes physical harm: increased risk of stroke, heart attack, heart failure, kidney disease, dementia. This harm is observable biologically.
  3.  **Value Judgment is Necessary (Normativist Layer):** We *label* it a disease because we *value* preventing stroke, heart attack, and death. We decide *what level* of pressure constitutes disease based on large studies showing where risk significantly increases *to a level we deem unacceptable*. Choosing the treatment threshold (e.g., >140/90 mmHg vs. >130/80 mmHg) involves weighing risks/benefits – a value judgment.
  4.  **Reference Class (The Practical Compromise):** We use age/sex reference classes *because* biology changes with age/sex. Vascular stiffness increases with age; hormonal differences exist. Using a single "species-typical" norm for all ages would be biologically nonsensical and harmful. This choice isn't *purely* value-free (it prioritizes relevance to individual risk), but it's strongly constrained by biological reality and evidence.

  **5. Addressing Your Specific Questions**

  *   **"Is it just up to society/doctor?"** No. While the *label* and *treatment thresholds* involve values, they are heavily constrained by the objective biological dysfunction and the objective harm it causes. A doctor can't arbitrarily decide low blood pressure is a disease without evidence of harm.
  *   **"If everyone stopped caring about strokes, would it stop being a disease?"** *Conceptually* (for strict normativists), yes, the *label* might fade. *Biologically*, the dysfunction and its harmful consequences would persist. Medicine, however, exists because we *do* care about strokes.
  *   **"Aren't my arteries a mess regardless?"** **YES.** This is the crucial point. The physical pathology exists. The label "disease" is the tool medicine uses to identify that pathology *because* it causes harm we want to prevent and treat. The pill isn't treating the *label*; it's treating the *physical dysfunction* to prevent the *physical harm*.
  *   **"Which side to believe?"** Neither exclusively. **Believe in the evidence.** The evidence shows sustained high blood pressure causes measurable physical damage and increases the risk of catastrophic health events. The "disease" label signifies this evidence-based reality and triggers interventions proven to reduce risk. The philosophy debate helps us understand the complexities of the label, but it doesn't negate the underlying physical reality or the effectiveness of treatment.
  *   **"Is it 'really' a disease or just a label?"** It's **both**. It's a real biological state causing real harm, *and* it's a socially constructed category we use to identify and address that state because we value health and longevity. The label isn't arbitrary; it's deeply rooted in biology and evidence.

  **The Takeaway for You:**

  Your cardiologist called it a disease and prescribed pills **because:**  
  1.  There is objective dysfunction in your blood pressure regulation (Naturalist element).  
  2.  This dysfunction objectively increases your risk of serious harm (stroke, etc.) (Bridge).  
  3.  We value preventing that harm, and evidence shows medication effectively reduces that risk (Normativist element).  
  4.  Using age/sex norms makes treatment relevant to *your* biology (Solving the reference class practically).

  **Don't let the philosophical rabbit hole undermine the medical reality.** The pills address the biological dysfunction, reducing your objectively elevated risk. The label "disease" is the framework medicine uses to take that risk seriously and act on it. Focus on the evidence-based benefits of treatment – *that's* what truly matters for your health.
