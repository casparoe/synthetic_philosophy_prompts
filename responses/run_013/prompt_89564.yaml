  I teach an upper-level undergraduate seminar on self-reference and self-organization, cross-listed with philosophy of biology, and I am writing the final exam. I want one essay question on typogenetics—a toy formal system in which strings over a four-letter alphabet encode enzymes that operate on strings—and the DNA–Gödel isomorphism, which is the claim that the system illustrates how a string can encode operations on strings in a way analogous to Gödel numbering. The question cannot be answered by reciting the standard story about strings, enzymes, and self-copying. To force students past recall, build the question around the following modification, which I have invented for the exam. Call it autogenic typogenetics. In this variant, enzymes are not a separate molecular species; an enzyme is simply a strand that has folded into an active shape, so every enzyme is written in the same four-letter alphabet as the strands it acts on. The only primitive operation is complementary copying; all other operations—cutting, inserting, deleting, moving—must be defined as compositions of copying and folding. The question should ask students to assess two things: first, whether autogenic typogenetics is a genuine self-replicating system or merely a self-maintaining one; second, whether the modification strengthens or weakens the claimed isomorphism between typogenetics and Gödel numbering. Students should have to distinguish syntactic from semantic self-replication, explain what the isomorphism is supposed to preserve, and identify what an interpreter or external mechanism contributes that the system itself does not. You may add any further technical details you need, but state them explicitly in the question so that a student who has never seen typogenetics can still answer from the definitions given. The exam is closed-book and students will not have web access.

  You are an expert in formal systems, self-reference, and theoretical biology. Think carefully before you write. Begin with a short bulleted brainstorm of the key conceptual distinctions you plan to use—at least five—so I can see the crux you are building around. Then produce the following deliverables. First, the exam question itself, suitable for a 90-minute in-class final. Second, a model answer of about 700 words, written as a continuous essay rather than as notes. Third, a marking scheme totaling 20 marks, built around five must-hit points, with the marks each point is worth and a one-line note on how students typically get each point wrong. The marking scheme should separate an A answer from a B answer by naming the specific moves an A answer must contain that a B answer typically does not. Do not include citations, a bibliography, or suggestions for further reading; the question and model answer must be self-contained. After the marking scheme, add a short note to me, not to the students, saying what would change your mind about the model answer or the mark allocation, and where your reasoning is most likely to fail. State how confident you are in the model answer and what would lower that confidence.
