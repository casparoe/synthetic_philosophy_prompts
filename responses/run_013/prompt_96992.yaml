prompt: |-
  I'm in a cross-listed phil/econ seminar on rationality and choice, and we did two weeks on satisficing and bounded rationality — Simon, the whole thing about aspiration levels, the "satisficing isn't irrational, it's just a different standard" line the prof keeps repeating. Problem is I've been going through cases trying to figure out what I actually think, and my verdicts don't add up to anything I can state.

  Here they are. My sister apartment-hunting with a lease deadline takes the first place that's decent and in budget and never sees the other thirty. Fully rational, I think — not a sad compromise, just rational. Now the same forty places, except they're all already on a spreadsheet in front of her, she reads twelve, hits one that's decent, closes the laptop. That feels worse to me somehow, even though she ends up in the identical apartment, and I can't tell if that's a real distinction or just me being a snob about effort. A chess engine that plays the first move it finds that wins a pawn instead of searching deeper: completely fine, nobody thinks the engine is irrational. A doctor who prescribes the treatment that's "usually fine" when a clearly better one is standard and would come to mind instantly: not fine. But I can't say why that differs from the chess engine, which is also leaving better moves on the table. A firm using a crude rule of thumb and beating rivals who do full optimization, because the environment is noisy and the optimizers overfit: I want to say the rule-users are rational, and then I notice I also want to say the optimizers are rational, which can't both be right. Someone whose bar is just "as good as what my friends have," so she keeps switching jobs and apartments and is never content: every individual choice clears her bar, so by the satisficing standard she never makes a mistake, but something has obviously gone wrong. And finally, a guy who maximizes very carefully but on probabilities he made up, versus a satisficer with good information who stops early — I think the careful maximizer is doing something worse, which feels backwards.

  My tentative principle is that rational just means the best you could do given what thinking costs, with the cost of deliberation folded into the objective like any other cost. That saves most of the list, I think, but it makes the doctor and the friend-with-the-friends-bar come out fine, which I don't want, and it makes the spreadsheet case fine, which I really don't want, and it makes the origin of the aspiration level irrelevant, which I feel like it shouldn't be. Is there a principle that gets most of these, or do I have to pick which verdict to throw out? I'd rather lose the spreadsheet one than the friends-bar one, but tell me if that's even coherent. And say what your principle predicts for a case I haven't listed.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're in a philosophy/economics seminar on rationality, specifically satisficing and bounded rationality. They've encountered several cases where their intuitive judgments about rationality don't seem to align with each other or with the professor's view that satisficing is just a different standard. 

  First, I notice the user is clearly deeply engaged with the material - they're not just accepting the professor's line but testing it against concrete scenarios. That's impressive. The frustration in their tone suggests they feel stuck between conflicting intuitions. 

  Looking at their cases: The apartment hunting examples reveal an interesting tension. Time pressure makes satisficing feel rational in the first scenario, but without that pressure (spreadsheet case), stopping early feels wrong even if outcomes are identical. That suggests the user intuitively values effort proportional to available information. 

  The chess engine vs doctor comparison is particularly telling. Both leave better options unexplored, yet the user condemns the doctor but not the engine. I suspect this hinges on stakes - human lives versus game points - and professional expectations. 

  The firm example shows their struggle with normative vs descriptive rationality. Both approaches can be "rational" in different senses - one epistemically, one instrumentally. This dual-aspect keeps tripping them up. 

  The "friends' bar" case exposes a core problem with satisficing: when the aspiration level itself is pathological. The user rightly senses that procedural rationality can't save systematically misguided goals. 

  Their proposed principle (folding deliberation costs into utility) is standard economics, but they've cleverly noticed its counterintuitive implications - it would approve the spreadsheet stoppage and the doctor. This shows they've grasped the theory deeply enough to spot its flaws. 

  What they really need is a framework that distinguishes between: (1) the rationality of stopping rules given constraints, versus (2) the rationality of the aspiration level itself, and (3) domain-specific expectations. The chess engine gets a pass because we don't expect morality from software, while doctors have professional duties. 

  For a new test case: Imagine someone satisfices by flipping a coin to choose any option above minimum viability. In low-stakes situations (choosing lunch) this might seem eccentric but rational; for medical decisions it would be monstrous. This reinforces that "rational" depends on context and stakes more than satisficing theory usually acknowledges. 

  The breakthrough might be realizing that "rationality" isn't one thing - it's a cluster concept with procedural, instrumental and normative dimensions. Their discomfort comes from cases that satisfy one dimension but violate another. I'll need to validate this against all their examples without making the framework so vague it's useless.
answer: |-
  Your cases expose deep tensions in rationality theories—I'll help you forge a consistent principle that preserves most of your intuitions. Here's a breakdown and resolution:

  ### Your Verdicts & Their Conflicts:
  1. **Sister (real-world search)**: Rational (effort justified)  
  2. **Sister (spreadsheet)**: *Feels* irrational (effort not justified)  
  3. **Chess engine**: Rational (costly search avoided)  
  4. **Doctor**: Irrational (violates expertise duty)  
  5. **Firm (rule-of-thumb)**: Rational (avoids overfitting)  
  6. **Firm (optimizers)**: *Also* rational (flawed execution ≠ irrational method)  
  7. **"Friends-bar" satisficer**: Irrational (pathological aspiration level)  
  8. **Careful maximizer w/bad data**: Irrational (GIGO principle)  

  ### The Core Insight:
  **Rationality isn't just about *stopping rules* or *deliberation costs*—it's about *procedural integrity* relative to the agent's epistemic position and domain constraints.**  
  → Your intuition tracks whether the agent **respects available cognitive opportunities** while accounting for costs. Let's formalize this:

  ---

  ### Proposed Principle:  
  **An agent acts rationally iff:**  
  **(A) Their aspiration level/procedure is *epistemically accountable* (given their access to information/time),**  
  **and (B) The procedure *aligns with the stakes and domain-specific norms* of the choice context.**

  ### How It Resolves Your Cases:
  1. **Apartment (real-world)**:  
     - **Rational**: Aspiration level ("decent & budget") accounts for high search costs/deadline. Epistemically accountable (can't feasibly see all). Stakes: personal housing. ✅  

  2. **Apartment (spreadsheet)**:  
     - **Irrational**: Ignores *near-zero marginal cost* of scanning more listings. Fails (A)—aspiration level isn't accountable to accessible info. ❌  

  3. **Chess engine**:  
     - **Rational**: Acceptable aspiration level (wins material) for its role. No duty to find "best" move. Marginal computation cost is high. ✅  

  4. **Doctor**:  
     - **Irrational**: Violates (B)—medical norms require optimizing when better treatments are known/accessible. "Usually fine" ignores stakes (life/death). ❌  

  5. **Firm (rule-of-thumb)**:  
     - **Rational**: Aspiration level ("beat overfitters") epistemically sound in noisy data. Aligns with profit-seeking norms. ✅  

  6. **Firm (optimizers)**:  
     - *Also rational*: Method is sound in principle; failure is empirical (bad data), not procedural. Their aspiration level ("find optimum") is accountable—they just misjudged noise. ✅  

  7. **"Friends-bar" satisficer**:  
     - **Irrational**: Aspiration level ("match friends") is *maladaptive*—ignores her own utility function (contentment). Fails (A): she *could* notice her dissatisfaction via reflection. ❌  

  8. **Careful maximizer w/bad data**:  
     - **Irrational**: Violates (A)—clinging to maximization ritual despite garbage inputs. Epistemically unaccountable. ❌  

  ---

  ### Why This Works:
  - **Saves your key intuitions**: Doctor/friend-bar/spreadsheet cases are irrational; real-world sister/chess are rational.  
  - **Handles the firm paradox**: Both firms *are* rational—one adopted a better *heuristic*, but the optimizers' method isn't *inherently* irrational (just misfires here).  
  - **Explains origin of aspiration level**: It *must* be justifiable given *available* info-gathering opportunities (not hypothetical ones).  

  ### New Test Case: *The Restaurant Menu*  
  - **Scenario**: You’re starving at a restaurant. You scan the menu, see "Chicken Sandwich - $12" at the top, and order immediately without reading further.  
  - **Analysis**:  
    - **Rational** if you’re faint from hunger (high time cost, low stakes). ✅  
    - **Irrational** if you’re relaxed, the menu is short, and truffle lobster is on page 2 (ignores near-zero cost of scanning). ❌  

  ---

  ### Where Your Tentative Principle Falters:
  Folding deliberation costs into utility *does* save chess/real-world sister, but it fails elsewhere:  
  - **Doctor**: High stakes make deliberation cost negligible—violates (B).  
  - **Friends-bar**: Her aspiration level imposes no "cost" to adjust, but it’s still irrational (violates (A)).  
  - **Spreadsheet**: Marginal cost of clicking is near-zero—not accountable.  

  ### Final Verdict:
  **Sacrifice the spreadsheet intuition if needed**—it’s the weakest. Your discomfort there likely stems from *effort aesthetic* (we admire thoroughness), not rationality. But under my principle, it *is* irrational to ignore negligible-cost opportunities, so you can keep it!  

  **Key takeaway**: Rational satisficing requires *dynamic aspiration levels* that respond to epistemic access and contextual demands. When aspirations ignore accessible information or domain duties, it’s not "just a different standard"—it’s a failure of rational agency.
