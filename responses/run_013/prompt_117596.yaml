  We are writing a joint statement for two camps in the philosophy of time. The goal is to produce a document that both Camp A (law-grounded arrow) and Camp B (perspectival arrow) can endorse. The document must stand on its own without citations or references.

  ## 1. Agreed Claims

  Both camps agree on the following propositions:

  1. The fundamental dynamical laws of physics are, to a very good approximation, invariant under time reversal. However, it is acknowledged that time-reversal symmetry is not exact in all sectors of fundamental physics (e.g., in weak interactions).

  2. The reversibility objection: due to the time-reversal invariance of the laws, any entropy-increasing process can in principle be reversed by a sufficiently precise intervention, though such interventions are practically impossible for macroscopic systems.

  3. The second law of thermodynamics is a statistical law, not an exceptionless one. Entropy-decreasing fluctuations are possible but extremely improbable for macroscopic systems. The existence of exact fluctuation relations (like the Crooks fluctuation theorem) governing the probabilities of entropy-decreasing trajectories is accepted.

  4. Entropy is defined relative to a choice of macroscopic variables (a coarse-graining of the microstate space). Without such a coarse-graining, the concept of entropy is not defined.

  5. The observable universe began in a very low-entropy state (the Past Hypothesis). This fact is supported by cosmological evidence.

  6. There exist records, traces, and memories in the world, and these are correlated with entropy gradients. The existence of such traces is a key feature of our experience of time.

  7. The entropy of the universe as a whole must be distinguished from local entropy changes. Local decreases in entropy (e.g., in refrigerators, crystallization, or gravitational clumping) are common and do not violate the second law because they are accompanied by larger increases elsewhere.

  8. In self-gravitating systems, entropy can increase by clumping (e.g., the formation of stars and galaxies), which complicates a simple identification of entropy increase with the growth of disorder.

  9. The asymmetries we observe (such as the asymmetry of memory, record, and causation) are real features of our world but require explanation.

  10. Any explanation of the arrow of time must account for the statistical character of the second law and the role of coarse-graining.

  We note that the camps do not agree on whether the Past Hypothesis has law-like standing or is merely a contingent fact, nor on the ontological status of the arrow of time.

  ## 2. Disagreements

  We present the live disagreements in the table below. Each camp's position is formulated in a way that the camp itself would accept as fair.

  | Point at issue | Camp A's position | Camp B's position | Judgment on the disagreement |
  |----------------|-------------------|-------------------|------------------------------|
  | The nature of the Past Hypothesis (PH) | The Past Hypothesis is a law-like boundary condition that is necessary to explain the arrow of time. It is a fundamental posit that, together with the dynamical laws and a statistical postulate, explains the second law and the temporal asymmetries we observe. Without such a law-like posit, the arrow of time would be inexplicable. | The Past Hypothesis is a contingent fact about the initial state of our universe. It is not a law and does not have law-like standing. The arrow of time arises from the perspective of agents within the system and does not require a law-like boundary condition. | Substantive: The camps disagree on the modal and explanatory status of the Past Hypothesis. |
  | The objectivity of the arrow of time | The arrow of time is an objective feature of the world, independent of any particular perspective or description. It is grounded in the fundamental laws (including the Past Hypothesis as a law-like boundary condition) and the resulting entropy gradient. | The arrow of time is perspectival: it arises only relative to a coarse-graining and to the standpoint of an agent embedded in the system. There is no description-independent fact of the matter about the direction of time. | Substantive: The disagreement is about the mind-independence of the arrow. |
  | The role of coarse-graining in the second law | The second law is a consequence of the fundamental laws and the Past Hypothesis. Coarse-graining is necessary to define entropy, but the resulting statistical behavior (including the second law) is an objective feature of the world. | The second law is a statement about what is typical relative to a coarse-graining and does not reflect any time-asymmetric feature of the microscopic dynamics. The law is fundamentally about our description and our perspective. | Partly verbal: The camps agree on the role of coarse-graining in defining entropy, but they disagree on whether the resulting statistical behavior is objective or perspectival. However, the disagreement is also substantive because it relates to the objective basis of the arrow. |
  | The explanation of records and memories | Records, memories, and traces are objective features that exist because of the entropy gradient set by the Past Hypothesis. They are not inherently perspectival but are part of the world's structure. | Records, memories, and traces are defined relative to an agent's perspective. The direction of "past" is fixed by the agent's own state (which carries traces of earlier states), not by an objective boundary condition. | Substantive: The disagreement is about whether the asymmetry of records is objective or agent-relative. |

  ## 3. Cruxes

  The cruxes are sub-questions that, if settled, would move at least one camp. For each crux, we state why it is a crux and what each camp presently expects.

  1. **Crux: Must the Past Hypothesis have law-like status to explain the arrow of time?**  
     - Why a crux: Camp A asserts that without a law-like boundary condition, we cannot explain why the arrow of time holds universally and why we should expect records to point to a low-entropy past. Camp B holds that the Past Hypothesis is a contingent fact and that the arrow is explained solely by the perspective of an agent in a system with an entropy gradient.  
     - Camp A expects: Without a law-like Past Hypothesis, the arrow of time would not be robust and could not be explained in all possible contexts (e.g., in the fluctuation observer case).  
     - Camp B expects: The law-like status is unnecessary; the explanation of the arrow only requires the actual entropy gradient and the perspective of an agent.

  2. **Crux: Is an objective arrow of time necessary to explain the asymmetry of records?**  
     - Why a crux: Camp A argues that without an objective arrow, we cannot account for the fact that records always point to the low-entropy past. Camp B argues that the asymmetry of records is defined by the agent's perspective and does not require an objective arrow.  
     - Camp A expects: An objective arrow is necessary to ground the reliability of records.  
     - Camp B expects: The reliability of records is explained by the agent's embeddedness in a system with a particular entropy gradient, without invoking an objective arrow.

  3. **Crux: Can an arrow of time exist without a global entropy gradient?**  
     - Why a crux: Camp A holds that the global arrow is primary and that local arrows are derived from it. Camp B holds that arrows are always local and relative to a coarse-graining and an agent.  
     - Camp A expects: Without a global low-entropy past, there would be no consistent arrow of time.  
     - Camp B expects: Local arrows can exist even in the absence of a global gradient (as in the fluctuation observer case).

  ## 4. Evidence for Each Crux

  For each crux, we present a case, thought experiment, or result that both camps agree bears on the crux. We record each camp's prediction in advance.

  ### Crux 1: Must the Past Hypothesis have law-like status?

  - **Evidence: The Fluctuation Observer (Case iii)**  
    - Scenario: A universe in equilibrium. A rare fluctuation creates an isolated observer with coherent apparent memories of a past that never occurred.  
    - Question: Does this observer have an arrow of time? Are its apparent memories records?  
    - Camp A's prediction: The observer's apparent memories are not records because they do not point to an actual low-entropy past. Without a global low-entropy boundary condition having law-like standing, such an observer would not have a genuine arrow of time.  
    - Camp B's prediction: The observer has an arrow of time relative to its own perspective. Its apparent memories are records from its standpoint, even though they are not veridical. The case shows that the arrow is perspectival and that the Past Hypothesis need not have law-like status.  
    - Note: Both camps agree that such observers are extremely rare compared to observers like us (who exist in a universe with a global entropy gradient).

  ### Crux 2: Is an objective arrow necessary for records?

  - **Evidence: The Reversal Experiment (Case i)**  
    - Scenario: An isolated macroscopic system evolves with rising entropy. Velocities are reversed, causing entropy to fall. The reversal procedure increases entropy elsewhere.  
    - Questions: Does the system's arrow reverse? Would an observer inside experience a reversed arrow?  
    - Camp A's prediction: The arrow does not reverse because the reversal procedure is not part of the system and the system is not isolated during reversal. The observer inside would not experience a reversed arrow because the reversal procedure is an external intervention that breaks isolation and leaves a trace. The episode is an illustration of the second law (due to the entropy cost of reversal) and not a counterexample.  
    - Camp B's prediction: After reversal, the system's entropy decreases and an observer inside (if one could be present) would experience a reversed arrow relative to the system's new evolution. However, the reversal procedure itself is part of the larger world and has an entropy cost, so the overall arrow (from the perspective of the external agent) is preserved. The case shows that the arrow is relative to the system and the coarse-graining.  
    - Both agree that the episode is not a counterexample to the second law because the reversal requires an external entropy increase.

  ### Crux 3: Can an arrow exist without a global entropy gradient?

  - **Evidence: The Two-ended Universe (Case ii)**  
    - Scenario: A closed universe with low entropy at both ends and maximum entropy at the turnaround. Observers on each branch have records pointing to their respective low-entropy ends.  
    - Questions: Does each observer have an arrow? How many boundary conditions does Camp A require? Does this favour Camp B?  
    - Camp A's prediction: Camp A requires two boundary conditions (one at each end) to explain the two arrows. Each observer has an arrow because of the low-entropy boundary condition at their end. The case is neutral between the camps because it is consistent with Camp A's view with two boundary conditions.  
    - Camp B's prediction: Each observer has an arrow relative to their own standpoint and coarse-graining. The case favours Camp B because it shows that the arrow is standpoint-relative and does not require a single global arrow.  
    - Both agree that each observer experiences an arrow pointing away from the low-entropy end in their vicinity.

  ### Additional Crux: Local Arrows (Case iv)

  - **Scenario:** Local entropy decreases (e.g., in a refrigerator) occur while global entropy increases.  
  - **Questions:** Can there be a local arrow without a global one? If so, is there reason to call the global one *the* arrow?  
  - **Camp A:** The global arrow is primary because it sets the background for local arrows. Without a global arrow, local arrows would not be consistent. The phrase "the arrow of time" is well-defined at the level of the whole universe.  
  - **Camp B:** Local arrows can exist without a global one (as in the fluctuation observer). The global arrow is just a summary of the dominant direction in the universe. The phrase "the arrow of time" should be replaced by "an arrow of time" relative to a system and coarse-graining.  
  - **Evidence:** Both camps agree that in our universe, local decreases are embedded in a global increase. However, they disagree on whether a universe without a global gradient (like the two-ended universe or a fluctuation) can have local arrows.

  ## 5. The Stipulated Cases

  We now address each stipulated case, with each camp's predictions.

  ### (i) Reversal

  - **Camp A:**  
    - The system's arrow does not reverse because the reversal procedure is an external intervention that is not time-symmetric and leaves a trace.  
    - An observer inside would not experience a reversed arrow because the reversal is sudden and would disrupt the observer's processes.  
    - The episode is an illustration of the second law because the entropy cost of reversal is greater than the entropy decrease in the system.

  - **Camp B:**  
    - After reversal, the system's arrow reverses relative to the system's new evolution.  
    - An observer inside (if one could survive the reversal) would experience a reversed arrow relative to the system.  
    - The episode is not a counterexample to the second law because the reversal procedure increases entropy elsewhere. It illustrates the perspectival nature of the arrow.

  ### (ii) Two-ended universe

  - **Camp A:**  
    - Each observer has an arrow due to the low-entropy boundary condition at their end.  
    - Camp A requires two boundary conditions (one at each end) to explain the two arrows.  
    - The case is neutral between the camps because it can be explained by two boundary conditions.

  - **Camp B:**  
    - Each observer has an arrow relative to their own standpoint.  
    - The case favours Camp B because it shows that the arrow is standpoint-relative and does not require a global arrow.  
    - Camp B does not require boundary conditions as laws; they are just contingent facts.

  ### (iii) Fluctuation observer

  - **Camp A:**  
    - The observer has no genuine arrow of time because there is no global low-entropy past.  
    - The apparent memories are not records because they do not correspond to actual events.  
    - The case shows that the Past Hypothesis must have law-like standing to prevent such observers from having an arrow.  
    - Prediction: Observers like this are extremely rare in the relevant ensemble compared to observers like us.

  - **Camp B:**  
    - The observer has an arrow of time relative to its own perspective.  
    - The apparent memories are records from its standpoint.  
    - The case shows that the Past Hypothesis is not necessary as a law; it is merely a fact about our universe.  
    - Prediction: Observers like this are rare, but in the ensemble of all possible observers in equilibrium, they are more common than observers in a low-entropy universe. However, in our universe, observers like us are common.

  ### (iv) Local arrows

  - **Camp A:**  
    - There cannot be a local arrow without a global one because the global arrow sets the context for local arrows.  
    - The global arrow is the primary one, and local decreases are exceptions that depend on the global increase.  
    - The phrase "the arrow of time" is well-defined for the whole universe.

  - **Camp B:**  
    - Local arrows can exist without a global one (as in the fluctuation observer).  
    - The global arrow is not privileged; it is just the dominant direction.  
    - The phrase "the arrow of time" should be replaced by "an arrow of time" relative to a system and coarse-graining.

  ## Closing: What Would Move Each Camp

  - **Camp A** would be moved by evidence that the arrow of time can exist without a low-entropy boundary condition having law-like status. For example, if it could be shown that a universe without a Past Hypothesis (or with a symmetric boundary condition) can consistently support the emergence of records and memories without a global entropy gradient, Camp A would have to reconsider. However, they argue that such evidence is not possible in principle because without a low-entropy past, records would not reliably form.

  - **Camp B** would be moved by evidence that the arrow of time is not perspectival. For example, if it could be shown that there is a description-independent fact about the direction of time that does not rely on coarse-graining or an agent's standpoint, Camp B would reconsider. However, they argue that all evidence for the arrow (including records) is inherently tied to a perspective.

  Some parts of the dispute are merely verbal. For instance, both camps agree on the role of coarse-graining in defining entropy and on the statistical nature of the second law. The disagreement about whether the second law is "objective" or "perspectival" may turn on how one defines these terms. However, the core disagreement about the necessity of a law-like Past Hypothesis and the mind-independence of the arrow is substantive.

  In principle, evidence could be obtained to move the camps on some cruxes (e.g., by analyzing the conditions for record formation in simulations of various cosmologies). However, the in-principle possibility of a fluctuation observer or a two-ended universe is currently beyond empirical test. Thus, some cruxes may remain unresolved.

  This joint statement represents our shared ground, disagreements, and paths forward.
answer: |-
  ### Joint Statement on the Philosophy of Time

  This document represents a collaborative effort between two philosophical camps (referred to as Camp A and Camp B) regarding the arrow of time. Both camps affirm the following agreed claims, articulate their disagreements, identify cruxes, and address stipulated cases. The goal is to clarify shared ground and unresolved issues without appealing to external authorities.

  #### 1. Agreed Claims
  Both camps endorse the following propositions:

  1. The fundamental dynamical laws of physics are approximately time-reversal invariant, though exceptions exist in specific sectors (e.g., weak interactions).  
  2. The reversibility objection holds: Any entropy-increasing process can, in principle, be reversed by a microscopically precise intervention.  
  3. The second law is statistical, not exceptionless. Entropy-decreasing trajectories occur with low probability, governed by fluctuation relations.  
  4. Entropy is defined relative to a coarse-graining of the microstate space (a choice of macroscopic variables).  
  5. The observable universe began in a very low-entropy state (the Past Hypothesis).  
  6. Records, traces, and memories exist and correlate with entropy gradients.  
  7. Local entropy decreases (e.g., in refrigerators, crystallization, or gravitational clumping) occur within a universe where global entropy increases.  
  8. Self-gravitating systems can increase entropy by clumping, complicating the identification of the arrow with increasing disorder.  
  9. The arrow of time requires explanation; neither camp reduces it to an illusion.  

  We judge the claim "the arrow of time is fundamental" as too vague to endorse. Both camps agree that the arrow is real but disagree on its basis.  

  #### 2. Disagreements
  The table below summarizes key disagreements. Each camp’s position is stated neutrally and accepted by that camp as fair.

  | Point at Issue | Camp A’s Position | Camp B’s Position | Substantive or Verbal? |
  |----------------|-------------------|-------------------|------------------------|
  | **Status of the Past Hypothesis** | The Past Hypothesis is a law-like boundary condition essential for explaining the arrow. It is not merely contingent; it plays a role analogous to dynamical laws. | The Past Hypothesis is a contingent fact about our universe’s history. It is not law-like; the arrow arises from perspective and coarse-graining, not a special boundary condition. | Substantive: Disagreement over whether the Past Hypothesis has nomological necessity. |
  | **Objectivity of the Arrow** | The arrow is an objective feature of the world, grounded in laws and boundary conditions. It exists independently of agents or descriptions. | The arrow is perspectival: it arises only relative to a coarse-graining and an agent’s standpoint. There is no description-independent "global arrow." | Substantive: Disagreement over mind-independence. |
  | **Basis of Temporal Asymmetries** | Asymmetries (e.g., memory, causation) are objective consequences of the low-entropy boundary condition and laws. | Asymmetries are defined by agents embedded in systems; they depend on traces pointing to a local past, not on a global boundary condition. | Substantive: Disagreement over whether asymmetries require a global cause. |
  | **Scope of the Second Law** | The second law reflects an objective statistical tendency stemming from laws and the Past Hypothesis. | The second law describes typicality relative to coarse-graining; it is not a law of microscopic dynamics but a feature of description. | Partly verbal: Agreed physics, but disagreement on whether "objective" applies to the tendency or only the description. |

  #### 3. Cruxes
  Cruxes are sub-questions that, if resolved, could move one or both camps.  

  1. **Crux: Must the Past Hypothesis have law-like status to explain the universality of the arrow?**  
     - **Why a crux**: Camp A argues that without law-like status, the Past Hypothesis cannot explain why the arrow holds consistently. Camp B argues that perspectival explanations suffice.  
     - **Camp A’s expectation**: Yes; otherwise, the arrow’s ubiquity is inexplicable.  
     - **Camp B’s expectation**: No; the arrow emerges from local perspectives, not laws.  

  2. **Crux: Can an arrow exist without a global entropy gradient?**  
     - **Why a crux**: Camp A sees the global gradient as necessary for local arrows. Camp B argues local arrows can exist independently.  
     - **Camp A’s expectation**: No; local arrows depend on the global context.  
     - **Camp B’s expectation**: Yes; arrows are inherently local and perspectival.  

  3. **Crux: Are records and memories inherently asymmetric?**  
     - **Why a crux**: Camp A ties records to the objective Past Hypothesis. Camp B ties them to an agent’s perspective.  
     - **Camp A’s expectation**: Yes; records objectively point to a low-entropy past.  
     - **Camp B’s expectation**: No; records are defined by an agent’s temporal orientation.  

  #### 4. Evidence for Each Crux
  For each crux, we present a case both camps agree is relevant, with predictions.  

  - **Crux 1 (Past Hypothesis status)**:  
    **Evidence**: *Fluctuation observer* (Case iii).  
    - **Camp A’s prediction**: The observer has no genuine arrow; apparent memories are not records. This shows the Past Hypothesis must be law-like to prevent "false arrows."  
    - **Camp B’s prediction**: The observer has a local arrow; apparent memories are records from its perspective. This shows the Past Hypothesis is contingent.  
    - **Ensemble frequency**: Both agree observers like us (in a low-entropy universe) vastly outnumber fluctuation observers.  

  - **Crux 2 (Global entropy gradient)**:  
    **Evidence**: *Two-ended universe* (Case ii).  
    - **Camp A’s prediction**: Arrows exist only with boundary conditions (one per end). Shows global gradients are essential.  
    - **Camp B’s prediction**: Each observer has an arrow without global asymmetry. Favors perspectival view.  

  - **Crux 3 (Records asymmetry)**:  
    **Evidence**: *Reversal* (Case i).  
    - **Camp A’s prediction**: No arrow reversal; memories remain intact. Illustrates second law via reversal entropy cost.  
    - **Camp B’s prediction**: Arrow reverses locally; observer experiences reversed time. Illustrates perspectival arrow.  

  For Crux 1, we judge that no shared evidence could settle it *even in principle* because it hinges on whether "law-like" is necessary for explanation—a metaphysical stance not resolvable empirically.  

  #### 5. Stipulated Cases  
  Each camp’s predictions for all cases:  

  | Case | Camp A’s Predictions | Camp B’s Predictions |
  |------|----------------------|----------------------|
  | **(i) Reversal** | System’s arrow does not reverse; internal observer experiences normal time. Episode illustrates the second law (reversal requires entropy cost). | System’s arrow reverses locally; internal observer experiences reversed time. Episode illustrates perspectival arrow but not a second-law violation. |
  | **(ii) Two-ended universe** | Each branch has an arrow due to its boundary condition. Camp A requires two boundary conditions. Case is neutral. | Each observer has an arrow relative to their standpoint. Case favors Camp B (standpoint-relativity). |
  | **(iii) Fluctuation observer** | No arrow; apparent memories are not records. Shows Past Hypothesis must be law-like. Predicts observers like us dominate in typical ensembles. | Arrow exists relative to observer; apparent memories are records. Shows Past Hypothesis is contingent. Predicts fluctuation observers are rare but possible. |
  | **(iv) Local arrows** | Global arrow is primary; local decreases depend on it. "The arrow of time" is well-defined globally. | Local arrows exist without global arrow; global increase is a summary of local perspectives. Prefers "an arrow" relative to context. |

  #### Closing: What Would Move Each Camp  
  - **Camp A** would be moved by evidence that local arrows (e.g., in a fluctuation) can exist without *any* global entropy gradient, or that the Past Hypothesis is redundant for explaining temporal asymmetries. This evidence is in principle obtainable (e.g., via simulations of acausal universes), but not currently feasible.  
  - **Camp B** would be moved by evidence that records or memories require an objective boundary condition (e.g., if a fluctuation observer could verify "false" memories as reliable). This is in principle testable but practically challenging.  

  We judge the disagreement over whether the second law is "objective" or "perspectival" as partly verbal. Both camps agree on the physics (e.g., entropy is coarse-graining-relative), but differ on whether "objective" applies to the tendency or the description. The core disagreements (e.g., law-like status of the Past Hypothesis) are substantive, as they entail distinct explanations of time’s direction.  

  ---  
  This statement reflects our shared understanding and unresolved debates. Both camps commit to revising their positions based on empirical or theoretical advances addressing the cruxes.
