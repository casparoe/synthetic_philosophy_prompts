prompt: |-
  I've been chewing over the qualia business on my own for a while now — you know, the 'what it's like' of an experience, the bit that's supposed to be private and impossible to describe properly. What nags at me is that we're forever comparing it anyway: 'this coffee's gone downhill', 'no, your tastebuds have'. I came across a puzzle a bit like that once — two coffee tasters both go off the stuff, one swears the coffee changed, the other swears he did, and from the inside there's supposedly no way to tell which of them is right, which I find either brilliant or a total con depending on the day.

  Anyway, I want a joke out of it. A proper one — the punchline should definately need you to actually get the puzzle, so that my flatmate who's never thought about it just stares at me while someone who has properly laughs. Cafe or pub setting, whatever works best. And then tell me straight where the joke takes liberties with the idea, or leans on a reading that's genuinely contested, because I'd rather know what it's smuggling in than get a joke that's just pleased with itself. Don't hedge: pick the one you reckon actually lands.
