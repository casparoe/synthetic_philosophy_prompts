  ### **Core Principles**
  1. **Truncation-Based Expected Utility (TBEU)**:
     - For any lottery \(L\), consider a sequence of truncated lotteries \(L_N\) where outcomes beyond a finite state \(N\) are set to zero.
     - Compute the **expected utility** of each \(L_N\) using a bounded, strictly increasing utility function \(u\) (e.g., \(u(x) = 1 - e^{-x/w}\) for wealth \(w\), ensuring risk aversion).
     - Define the value of \(L\) as \(\lim_{N \to \infty} \text{CE}(L_N)\), where \(\text{CE}(L_N)\) is the certainty equivalent of \(L_N\) (the sure amount with equal utility).
     - **If the limit exists and is finite**, that is the value of \(L\). **If the limit does not exist or is infinite**, \(L\) has no defined monetary value, and you are indifferent to playing it for free (but apply Fee Monotonicity for non-zero fees).

  2. **Stochastic Dominance**:
     - If lottery \(A\) (first-order) stochastically dominates lottery \(B\), strictly prefer \(A\) over \(B\). This overrides TBEU when applicable.

  3. **Fee Monotonicity**:
     - If a lottery \(L\) has no defined monetary value (per TBEU), you are indifferent to playing it for free.
     - For a fee \(c\):  
       - If \(c > 0\) (you pay), refuse to play.  
       - If \(c < 0\) (you receive), accept to play.

