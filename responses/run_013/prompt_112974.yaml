prompt: |-
  My friend and I spent most of last night arguing about a claim of his that I cannot shake. He says that in a sufficiently large world — one containing enough other agents in situations relevantly like mine, reasoning as I do — I can have reason to cooperate with those agents even though nothing I do will ever reach them and nothing they do will ever reach me. His argument is that my choice is evidence about their choices: if they are the sort of agents who cooperate when I cooperate, then my cooperating raises the probability that they cooperate, and the good they do is enormous, so the expected value of acting well can be enormous even when the causal effect of my action is exactly zero. I said this proves far too much — by the same reasoning, my choice of breakfast is evidence about the breakfasts of distant civilizations, and I can blackmail myself into anything by imagining a large enough world of agents disposed to reward me for it. He said that is precisely the point, and that the size of the world is what makes it true. I want to run a session that lets a group feel the force of his view before either of us names it.

  I teach a graduate seminar in decision theory and practical reason — fourteen students, one ninety-minute meeting, a room with a whiteboard, a projector, and a stack of index cards. I want an activity, not a lecture. The group should run into the phenomenon themselves: they should make choices under rules that make ordinary causal reasoning look obviously correct, and then, without my announcing any change, find themselves in a second phase where the very reasoning that looked like a mistake begins to look compelling. By the end they should see why the size of the world matters, why a choice can be rational in virtue of what it is evidence for rather than what it causes, and why that thought is dangerous enough that they should feel the objection as well as the appeal. The activity should not mention my friend's idea, or any name for it, until the debrief.

  Please design it. Give me the setup and rules; the materials and how to distribute them; the payoff structure, using points or tokens rather than real money but with stakes the group will actually care about for the hour; a timeline for the ninety minutes; and any roles or subgroup divisions, with a clear account of who interacts with whom and who does not. Include a way for the group to record its choices so that the debrief can refer to what actually happened rather than to what I hoped would happen. Assume no internet and no computation beyond what fourteen people can do by hand.

  Then give me the debrief. It should map particular moments in the activity onto the parts of the idea — the correlation between agents who never interact, the absence of any causal channel, the difference between acting on evidence and acting on influence, and the role of the world's size. It should also make the group feel the pressure of the objection I raised to my friend, not just the appeal of his view. Tell me what will predictably go wrong the first time I run it and how to handle it. And be frank about which feature of the idea the activity cannot reproduce and that I will have to supply myself; I expect the sheer scale of the world, and the question of whether the other agents really reason as we do, to be the hard ones.
reasoning: |-
  We are designing an activity to illustrate the idea that in a sufficiently large world, one's action can be rational because it is evidence of what other similar agents are doing, even when there is no causal interaction.

  The core idea is that if there are many agents who are in similar situations and reason similarly, then one's own choice can be taken as evidence about the choices of others. This can make cooperation rational because if I cooperate, that raises the probability that others also cooperate, and the total good from their cooperation can be huge.

  We want two phases:
  1. A phase where causal reasoning is obviously correct (and evidential reasoning seems wrong).
  2. A phase where the same evidential reasoning becomes compelling because of the large number of other agents.

  We will use a prisoner's dilemma-like structure but with a twist: the agents are in isolated groups and their choices are not causally linked, but they are correlated because they are all in the same "type" of situation and reasoning similarly.

  We'll have two rounds. In the first round, the world is small: each participant is paired with one other, and they play a one-shot prisoner's dilemma. In the second round, the world is large: each participant is told that there are many other participants (in fact, the entire class) who are in the same situation and that they are all making the same choice independently. However, they are told that their own payoff depends only on their own choice and the choices of a small, fixed number of others (say, one other, as in the first round). But they are also told that the entire group of participants is divided into pairs, and each pair is playing a prisoner's dilemma. The catch: the pairing is done randomly and independently after the choices are made. So, causally, my choice only affects my own payoff and that of my (randomly assigned) partner. But if I am rational and others are like me, then my choice is evidence about what others are doing, and if I cooperate, that raises the probability that others in the group (including the one I will be paired with) also cooperate.

  However, to make the evidence clear, we need to create a situation where the agents are all of the same type and they know that. We can do this by having the entire class as a group of similar agents.

  But note: the problem says that nothing I do reaches them and vice versa. So we must ensure no causal links.

  We'll have two phases:

  Phase 1: Small World
  - Divide the class into pairs (7 pairs). Each pair plays a one-shot prisoner's dilemma. They do not interact with anyone else. They write their choices on index cards and hand them in. Then we compute payoffs for each pair.

  Phase 2: Large World
  - Now, we tell them that we are going to do the same again, but this time we have a large group. We have 14 players (the whole class). We will randomly assign them into pairs after they make their choices. But we also tell them that there is a twist: the entire group is made up of rational, like-minded agents who are all in the same situation and reason similarly. We will also tell them that the outcome for each individual depends only on their own choice and the choice of the one other person they are paired with (exactly as in the first round). However, because the pairing is random and after the choices, the only causal effect of my choice is on the outcome of the pair I end up in. But because the group is large and everyone is similar, my choice can be evidence of what others are doing.

  But how do we create the evidence? We need to make them believe that if they cooperate, that increases the chance that others cooperate too, because they are all the same type. We can do this by having them all make their choices simultaneously and independently, without communication, and then we randomly pair the cards. Then, if I cooperate, that is evidence that others in the group are more likely to cooperate (if we assume that they are all reasoning the same way). But note: if they are all rational and identical, then they will all make the same choice. So if I cooperate, then I should expect others to cooperate too. But then, if they all cooperate, then when paired, each gets the high cooperative payoff. Similarly, if they all defect, they get the low payoff. But then, why would anyone defect? The problem is that if they are all identical and rational, then they will all choose the same action. Therefore, the only two possibilities are all cooperate or all defect. Then, the payoff for each is determined by the universal action: if all cooperate, then in every pair both get R (reward for mutual cooperation). If all defect, then both get P (punishment for mutual defection). But then, the choice is between R and P, so they should all cooperate. But that is the cooperative outcome. However, if one defects, then that would break the symmetry? But if they are all identical and rational, they should all do the same. Therefore, the evidential reasoning leads to cooperation.

  But note: in reality, they are not identical. But we can set up the activity so that they are told that they are all in the same situation and that they are all rational and that they are all aware of this. Then, the reasoning above holds.

  But what about the objection? The objection is that this reasoning can be used for anything. For example, if I imagine that there are many agents who will reward me for eating a particular breakfast, then I should eat that breakfast. But that seems absurd.

  So in the debrief, we need to highlight that the reasoning relies on the assumption that the other agents are in a relevantly similar situation and reasoning similarly, and that the world is large enough that my action is a good indicator of the general behavior.

  Activity Design:

  Materials:
  - Index cards (at least 14 for choices, plus some for recording)
  - Whiteboard and markers
  - Projector (optional, for displaying instructions and results)

  Set up:

  Phase 1: Small World (Prisoner's Dilemma in pairs)

  1. Divide the class into 7 pairs. (If there are 14 students, 7 pairs.) Assign each pair to a private area (or just have them sit together but not talk to other pairs). Alternatively, they can remain seated and we pass out index cards without them knowing who their partner is until after.

  But to ensure no causal links, we can have them write their choices without knowing who their partner is. However, in phase 1, they are in a fixed pair. So:

  - Assign each student a pair number (1 to 7) and a role in the pair (A or B). But they don't know who the other is? Actually, we can assign randomly and keep it anonymous. We'll do:

  Step 1: Assign each student a unique number from 1 to 14. Then randomly assign pairs: say, 1-2, 3-4, ... 13-14. But we don't tell them who they are paired with. We just tell them that they are paired with one other person in the room, and that they will never know who that person is.

  But for phase 1, we want them to think about one other person. So:

  Instructions for Phase 1:
  - "You are paired with one other person in this room. You will not know who that person is, and they will not know who you are. You are to make a choice: Cooperate (C) or Defect (D). Your payoff depends on both your choice and the choice of your partner, as follows:

  Payoff matrix (for both players):
  - If you both choose C, you each get 3 points.
  - If you choose C and your partner chooses D, you get 0 points and your partner gets 5 points.
  - If you choose D and your partner chooses C, you get 5 points and your partner gets 0 points.
  - If you both choose D, you each get 1 point.

  Note: This is a standard prisoner's dilemma.

  - Write your choice (C or D) on the index card, along with your assigned number. Do not write your name. Then hand in the card."

  We collect the cards and then compute the payoffs for each pair. We can do this by sorting the cards by pair and then applying the matrix. Then we announce the distribution of choices and the average payoff, but without revealing individual identities.

  Phase 2: Large World

  Now, we change the setup.

  Instructions for Phase 2:
  - "Now, we are going to do a similar activity, but with a twist. This time, we have a large group: all 14 of you. You will again be paired randomly, but after you make your choices. That is, after everyone has made their choice, we will randomly assign the 14 of you into 7 pairs. Your payoff will then be determined by the same matrix: it depends on your choice and the choice of the person you are randomly paired with.

  Moreover, we want you to think about the following: you are all in the same situation. You are all rational agents, and you are all aware that the others are in the same situation and are rational. You are all making your choices independently and simultaneously.

  We will now give you a few minutes to decide. Remember, your payoff depends only on your own choice and the choice of the one person you are randomly paired with. But note: because the pairing is random and after the choices, and because everyone is in the same boat, your choice might be evidence about what others are likely to do."

  We do not tell them explicitly about the evidential reasoning. We just set the stage and let them reason.

  After they make their choices (again on index cards, with their number), we collect the cards. Then we randomly pair the numbers (by shuffling the 14 cards and then pairing adjacent ones, for example). Then we compute the payoffs for each pair.

  Then we can compute the overall results.

  Timeline (90 minutes):

  0-5 min: Introduction to the activity. Explain that we are going to do some decision-making exercises and that they will earn points that we will convert into something (e.g., candy, or extra credit points, or just bragging rights). We'll use tokens that can be exchanged for small prizes at the end (like candy bars). But the stakes should be non-trivial for the hour.

  5-15 min: Phase 1 setup and choice. Hand out index cards. They write their number and choice.

  15-20 min: Collect cards and compute phase 1 payoffs. Write the results on the board: how many pairs CC, CD, DC, DD? And the average payoff.

  20-25 min: Phase 2 instructions. Emphasize the new rules: large group, random pairing after choices, and the fact that they are all in the same situation and rational.

  25-40 min: Phase 2 choice. They think and write their choice.

  40-50 min: Collect cards. Randomly pair the cards (shuffle and pair). Compute payoffs. Record the results.

  50-60 min: Display the results of both phases on the board. Show the choices made in phase 2: how many chose C, how many D? And then the resulting pairs and payoffs.

  60-90 min: Debrief.

  Debrief:

  We want to guide them to see:

  1. In phase 1 (small world), the dominant strategy is to defect. Because no matter what your partner does, you are better off defecting. (If partner cooperates: 5>3; if partner defects: 1>0.) So causal reasoning leads to defection. And indeed, we expect mostly defection.

  2. In phase 2 (large world), if they are all identical and rational, then they should all do the same thing. Why? Because if one agent reasons to cooperate, then by symmetry, all should. Similarly for defection. Then, if they all cooperate, then when paired they each get 3. If they all defect, they get 1. So they should all cooperate. But note: if one defects, then that person might get 5 if paired with a cooperator? But wait, if they are all supposed to cooperate, then if one defects, that breaks the symmetry. However, in the large group, if one defects, then when paired, they might get 5 if paired with a cooperator, but the cooperator gets 0. But the defector might also be paired with another defector? But the problem is that if they are all identical and rational, then they must all do the same. Therefore, the only stable outcomes are universal cooperation or universal defection. And universal cooperation yields 3, universal defection yields 1. So they should cooperate.

  But note: in reality, they are not perfectly identical. But the point is that in the large world, if I cooperate, then that increases the chance that others are also cooperating (because they are like me), so the person I get paired with is more likely to cooperate. Therefore, by cooperating, I increase the chance that my partner cooperates, and hence I increase my expected payoff.

  In the debrief, we can compute the expected payoff for a cooperator and a defector in phase 2, given the actual choices made. But we want to also note the evidential reasoning.

  We can ask:
  - How many of you cooperated in phase 2? Why?
  - How many defected? Why?

  Then we can note that if everyone cooperates, then the average payoff is 3. If everyone defects, it's 1. But if some cooperate and some defect, then the cooperators might get 0 if paired with a defector, and defectors might get 5 if paired with a cooperator. But in a large group, if the fraction of cooperators is p, then the expected payoff for a cooperator is: 3 * p + 0 * (1-p) = 3p. For a defector: 5 * p + 1 * (1-p) = 4p + 1. Then, defection is better than cooperation if 4p+1 > 3p, i.e., if p < 1. But note: this is causal. However, in the evidential reasoning, if I cooperate, I raise p (because I am one more cooperator). But more importantly, because I am like the others, if I cooperate, that is evidence that p is high. Specifically, if the others are like me, then if I cooperate, they are likely to cooperate too. So p is close to 1 if I cooperate, and close to 0 if I defect.

  Therefore, if I cooperate, I expect p to be high (close to 1) so 3p is about 3. If I defect, I expect p to be low (close to 0) so 4p+1 is about 1. So by cooperating, I get about 3, and by defecting I get about 1. So I should cooperate.

  But note: this relies on the correlation between my choice and the choices of others. And that correlation comes from the fact that we are all in the same situation and reasoning similarly.

  Now, the objection: this reasoning can be extended arbitrarily. For example, if I imagine that there are many agents in distant civilizations who are like me and who will reward me if I eat a particular breakfast, then I should eat that breakfast. But the problem is: are they really in a relevantly similar situation? And do they really reason the same way? And is the world really that large? We have to trust that the correlation holds.

  In this activity, we set up a situation where they are explicitly told that they are all in the same situation and that they are all rational. So the correlation is assumed. But in the real world, we don't have that guarantee.

  What might go wrong:

  1. In phase 1, we expect defection. But some might cooperate. That's okay, we can use the data.

  2. In phase 2, they might not all cooperate. Why? Because they don't trust that others are reasoning the same way. Or because they think that defection might be better if there are some cooperators. This is a problem because we want the evidential reasoning to be compelling, but if they don't cooperate, then it fails.

  How to handle: We can note that in phase 2, if they are all rational and they all believe that the others are rational and will do the same, then they should cooperate. But if some doubt that, they might defect. We can use the actual results to show that if there were a high level of cooperation, then the cooperators did well, but if there were defectors, they might have exploited the cooperators.

  But note: in the random pairing, if there are k cooperators and (14-k) defectors, then the expected payoff for a cooperator is: they are paired with a cooperator with probability (k-1)/13 (since there are k-1 other cooperators) and with a defector with probability (14-k)/13. But note: when k is large, the expected payoff for a cooperator is high. But if k is small, it's low. Similarly for defectors.

  We can compute the actual expected payoffs for cooperators and defectors in phase 2 based on the numbers.

  But the point of the activity is to illustrate the reasoning, not necessarily to have them all cooperate. Even if they don't, we can discuss why.

  What the activity cannot reproduce:

  1. The sheer scale of the world: We have only 14 agents. In reality, the idea is that the world is enormous. We can point out that if the group were very large, then one agent's action would be a very small part, but the evidential effect would still hold because the agent is a representative sample.

  2. The assumption that the other agents reason exactly as we do. In the activity, we told them that they are all rational and in the same situation. But in reality, we don't know that. So we have to question whether the correlation holds.

  Debrief structure:

  1. Review the results of phase 1:
     - How many pairs had mutual cooperation? mutual defection? mixed?
     - What was the average payoff?
     - Why did people defect? (Because it's the dominant strategy.)

  2. Review the results of phase 2:
     - How many cooperated? How many defected?
     - What was the distribution of pairs? (CC, CD, DD)
     - What was the average payoff for cooperators? for defectors? overall?

  3. Ask the students to reflect on their reasoning in phase 2:
     - Who cooperated? Why?
     - Who defected? Why?
     - Did anyone think: "If I cooperate, then that makes it more likely that others cooperate, so my partner is more likely to cooperate"?

  4. Introduce the evidential reasoning:
     - In phase 2, because the group is large and everyone is in the same situation, your choice is evidence about what others are doing.
     - If you cooperate, that is evidence that others are also cooperating (because they are like you). Therefore, the chance that your partner cooperates is higher if you cooperate.
     - Similarly, if you defect, that is evidence that others defect.

  5. Contrast with causal reasoning:
     - In phase 1, your choice does not affect your partner's choice because you are isolated. So you should defect.
     - In phase 2, causally, your choice does not affect the choices of others because they are made independently and before pairing. But evidentially, your choice is correlated with theirs.

  6. The role of the world's size:
     - In a small world (phase 1), the evidential effect is negligible because there is only one other. But in a large world (phase 2), the evidential effect is strong because there are many others and your action is a sample of the whole.

  7. The objection:
     - Can this reasoning be extended to any situation? For example, if I imagine that there are many agents in distant galaxies who are like me and who will reward me for eating a banana for breakfast, then should I eat the banana?
     - Why or why not? (Because we don't know that they are in a relevantly similar situation, or that they are reasoning the same way, or that our actions are correlated in that way.)

  8. Conclusion: The activity shows how in a large world of similar agents, evidential reasoning can make cooperation rational. But we must be cautious about when the assumptions hold.

  Materials distribution:

  - Each student gets two index cards: one for phase 1 and one for phase 2. They are pre-labeled with a unique number (1 to 14) for the entire activity.

  Payoff structure:

  - We'll use points. We can convert points to tokens (e.g., 10 points = 1 token). And tokens can be exchanged for small prizes (like candy bars, with 1 token = one fun-size candy bar, or 5 tokens = a regular candy bar). We want the stakes to be meaningful.

  - The payoffs in the matrix are 0, 1, 3, 5. So we can scale them by a factor to make the tokens add up. Let's multiply by 2: so 0, 2, 6, 10 points. Then 10 points = 1 token. Then the maximum per round is 10 points (if you defect and your partner cooperates) and the minimum is 0 (if you cooperate and your partner defects).

  Alternatively, we can use the original numbers and then add up the points and give a prize to the top few.

  But to keep it simple, we can just use the points and then at the end convert to tokens.

  Timeline:

  - 0-5 min: Introduction and explanation of the activity and the payoff system.
  - 5-10 min: Phase 1 instructions and choice. They write their choice on card 1 (with their number) and hand it in.
  - 10-15 min: We compute phase 1 payoffs. We assign pairs (by the numbers: 1-2, 3-4, ...) and compute the payoff for each student. We record the results on the board: number of CC, CD, DC, DD. And the average payoff.
  - 15-20 min: Phase 2 instructions. Emphasize the differences: large group, random pairing after choices, and the fact that they are all in the same situation and rational.
  - 20-30 min: Phase 2 decision time. They think and write their choice on card 2 (with the same number) and hand it in.
  - 30-40 min: We shuffle the phase 2 cards and then randomly pair them (by drawing two at a time, or shuffling and then taking consecutive pairs). Then compute the payoff for each student. Record the results: how many C and D choices? Then the pairs: CC, CD, DD. And the average payoff for cooperators and defectors.
  - 40-50 min: Display the results of both phases on the board.
  - 50-90 min: Debrief (as above).

  Roles and subgroups:

  - In phase 1, they are in fixed pairs (but anonymous). In phase 2, they are in the large group and then randomly paired.

  Recording:

  - We will record the choices and payoffs on the board. We can make a table for each phase.

  Predictable problems:

  1. They might talk and coordinate. We must emphasize that they are not allowed to communicate and that they must make independent decisions.
  2. In phase 2, they might not understand the setup. We must be clear that the pairing is random and after the choices, and that the payoff matrix is the same.
  3. They might not believe that the others are rational and similar. We can stress that in the instructions for phase 2: "You are all in the same situation. You are all rational agents, and you are all aware that the others are rational and in the same situation. You are all making your choices independently."

  What we cannot reproduce:

  - The vastness of the world: We only have 14 agents. We can discuss that if the group were very large (millions), then one agent's action would be a drop in the ocean, but the evidential effect would be strong because the agent is a representative of the whole.
  - The assumption of similarity: We told them that the others are similar, but in reality, we cannot be sure. We must discuss the limits of the analogy.

  This activity should help them feel the force of the idea and the objection.
answer: |-
  ### Activity Design: "The Evidence of Isolation"

  #### **Overview**
  This activity uses two sequential decision rounds to illustrate how the size of a group and the assumption of similar reasoning can shift rational choice from causal to evidential thinking. In Round 1 (Small World), students play a classic Prisoner's Dilemma in isolated pairs, where defection is the dominant strategy. In Round 2 (Large World), they are part of a large, anonymous group where their choice is statistically correlated with others’ choices due to shared reasoning, making cooperation rational despite zero causal influence. The debrief connects these experiences to your friend’s claim about evidence in a large world.

  #### **Learning Goals**
  - Feel the force of evidential reasoning when causal influence is absent.
  - Understand why group size matters for the rationality of cooperation.
  - Grapple with the objection that this reasoning could justify arbitrary actions if scaled indefinitely.

  #### **Materials**
  - **Index cards**: 28 cards (14 pre-numbered 1–14 for Round 1, 14 pre-numbered 1–14 for Round 2).
  - **Whiteboard**: For recording choices and payoffs.
  - **Projector**: Display instructions and results (optional but helpful).
  - **Tokens**: 100 small tokens (e.g., poker chips) worth points. Exchange rate: 1 token = 5 points (students care because tokens are redeemed for prizes: e.g., candy, extra credit, or first dibs on seminar snacks).
  - **Two baskets**: Labeled "Round 1" and "Round 2" for card collection.
  - **Random pairing tool**: A hat or container for shuffling Round 2 cards.

  #### **Setup**
  - **Participants**: 14 students.
  - **Roles**: None. All students are symmetric decision-makers.
  - **Interaction**:
    - **Round 1**: Students are in fixed, anonymous pairs (e.g., 1–2, 3–4, ..., 13–14). No communication is allowed; they never learn their partner’s identity.
    - **Round 2**: All 14 students are part of one large group. Pairing is random and occurs after choices. No one interacts or communicates; choices are private.
  - **Payoff Structure** (Prisoner’s Dilemma with points):
    - Mutual Cooperation (C, C): **3 points each**.
    - Mutual Defection (D, D): **1 point each**.
    - Exploitation (C, D or D, C): **Cooperator gets 0 points, Defector gets 5 points**.
  - **Stakes**: Points convert to tokens (e.g., 5 points = 1 token). Tokens are redeemable post-activity for prizes. Emphasize: "Your tokens buy real rewards—choose wisely!"

  #### **Timeline (90 Minutes)**
  **0–10 min: Introduction and Round 1 Setup**  
  - **You say**: "We'll do two short decision games. Your goal is to earn points by choosing Cooperate (C) or Defect (D) on index cards. Points convert to tokens for prizes. All choices are anonymous—no talking or signaling."  
  - Distribute pre-numbered Round 1 cards.  
  - Project instructions:  
    > **ROUND 1: SMALL WORLD**  
    > - You are paired with one specific person in this room (e.g., 1 with 2, 3 with 4, etc.).  
    > - Your payoff depends **only** on your choice and your partner's choice (see matrix).  
    > - Write **your number** and **C or D** on your card. Drop it in the Round 1 basket.  
    > - Matrix:  
    >   - Both C: 3 points each  
    >   - Both D: 1 point each  
    >   - You C, Partner D: You get 0, Partner gets 5  
    >   - You D, Partner C: You get 5, Partner gets 0  

  **10–20 min: Round 1 Choices and Calculation**  
  - Students write choices silently and submit cards.  
  - You sort cards into pre-assigned pairs (1–2, 3–4, etc.). Calculate payoffs using the matrix.  
  - Record on whiteboard:  
    - Number of CC, CD, DC, DD pairs.  
    - Total points per pair and average points.  
  - **Key moment**: Highlight defection as dominant ("Look, most defected because it’s safer—no matter what your partner does, D gives a better outcome").

  **20–30 min: Round 2 Setup**  
  - **You say**: "New round. Same payoff matrix, but two changes:  
    1. You’re now part of a **large group** of all 14 people.  
    2. Pairing is **random and after choices**. We’ll shuffle all cards and pair them randomly.  
    - Your payoff still depends only on your choice and your random partner’s choice.  
    - Critically: **Everyone here is in the same situation, reasoning similarly as rational agents.**"  
  - Distribute pre-numbered Round 2 cards.  
  - Project instructions:  
    > **ROUND 2: LARGE WORLD**  
    > - Write **your number** and **C or D**.  
    > - After submissions, we’ll randomly pair all cards.  
    > - Same payoff matrix applies.  
    > - Remember: Your choice is made independently, but the group is large and everyone is like you.  

  **30–45 min: Round 2 Choices and Calculation**  
  - Students submit cards to Round 2 basket. Shuffle cards thoroughly in a hat.  
  - Randomly pair cards (e.g., draw two at a time) to form 7 pairs. Calculate payoffs.  
  - Record on whiteboard:  
    - Total C and D choices (e.g., "9 chose C, 5 chose D").  
    - Pair outcomes (CC, CD, DC, DD) and payoffs.  
    - Average points for C-choosers vs. D-choosers.  

  **45–60 min: Results Display**  
  - Project/whiteboard summary:  
    | Round | Pairs/Choices | CC Pairs | CD/DC Pairs | DD Pairs | Avg. Points |  
    |-------|--------------|----------|------------|----------|-------------|  
    | 1     | Fixed        | [Data]   | [Data]     | [Data]   | [Data]      |  
    | 2     | Random       | [Data]   | [Data]     | [Data]   | [Data]      |  
  - Add: "In Round 2, X% cooperated. Cooperators averaged Y points; defectors averaged Z points."

  **60–90 min: Debrief**  
  Guide discussion using actual results. Do not name theories yet; draw out student reasoning.

  ---

  ### **Debrief Script**
  **Goal**: Connect activity moments to your friend’s claim (evidence without causation) and your objection (absurd scaling). Be Socratic—ask questions, then clarify.

  #### **Step 1: Contrast Rounds—Causal vs. Evidential Reasoning**
  - **Start with Round 1 (Small World)**:  
    "In Round 1, most of you defected. Why?"  
    - Expected answer: "D is better no matter what my partner does. If they cooperate, I get 5 instead of 3; if they defect, I get 1 instead of 0. My choice affects my payoff but not theirs."  
    - **Map to idea**: "This is pure **causal reasoning**. Your action only influences your outcome with your partner. No one thought, 'My C will make my partner cooperate,' because there’s no causal channel. Isolation makes defection rational."

  - **Transition to Round 2 (Large World)**:  
    "In Round 2, some cooperated. Why? What changed?"  
    - Listen for: "I thought if I cooperate, others like me might too," or "If everyone reasons the same, we should all do C for mutual benefit."  
    - **Map to idea**: "Ah, so your choice wasn’t about causing outcomes—it was **evidence** about others' choices. You thought: 'If I, a rational person, choose C, that raises the probability that other rational people choose C.' Even though your card was shuffled randomly, your C suggested the group might tip toward cooperation. And if enough cooperate, your random partner is likely to be a cooperator—so your expected payoff from C could be high."

  - **Highlight the shift**:  
    "In Round 1, causal control was clear: you shaped your fate with your partner. In Round 2, **causation was zero**—your card had no way to 'reach' others before pairing. But **correlation kicked in**: because you assumed everyone is like you, your choice became a signal. That’s why cooperation felt rational here."

  #### **Step 2: Why Size Matters**
  - **Question**: "Did group size matter? What if Round 2 had only 4 people?"  
    - Expected debate: "In a small group, if I defect, I might exploit a cooperator. In a large group, my single choice feels like a drop in the ocean."  
    - **Clarify**: "Exactly. In a small group, your action has high causal stakes but low evidential power. In a **large group**, **your action has low causal impact** (you only affect one random partner) but **high evidential power**—if everyone is similar, your choice is a proxy for the group. Here, with 14 people, choosing C might raise the estimated cooperation rate by ~7% (1/14). If the group were billions-strong, your choice still wouldn’t cause anything, but it would be strong evidence that 'people like us cooperate,' making C even more compelling."

  #### **Step 3: The Objection—Does This Prove Too Much?**
  - **Surface the worry**: "Some of you defected in Round 2. Why?"  
    - Listen for distrust: "I wasn’t sure others would cooperate," or "D is safer if others don’t play along."  
    - **Pivot to objection**: "Good—this hints at a problem. Imagine I said: 'There are billions of aliens in distant galaxies reasoning just like us. If I eat a banana for breakfast, that’s evidence they eat bananas too, and they’ll reward me somehow.' Should I eat the banana?"  
      - Students will laugh/reject: "No! That’s absurd. How do we know they’re like us?"  
    - **Map to activity**: "Right. In Round 2, we **assumed similarity**—we told you everyone is rational and in the same situation. But in real life, **how do we know distant agents reason like us?** And **how large is 'sufficiently large'?** If the group is smaller or less similar, evidence weakens, and defection might be safer. This reasoning is powerful here but dangerous if scaled arbitrarily."

  - **Tension**: "So we have two pulls:  
    - The **appeal**: In a vast, similar world, cooperation (or any 'good' action) can be rational through evidence alone—even if you’re isolated.  
    - The **objection**: Without proven similarity or true vastness, this could justify anything. Maybe defection is more robust to uncertainty."

  #### **Step 4: Conclusion and Reveal**
  - **Synthesize**: "Today, you felt how a large, similar group can make cooperation rational through evidence alone—even with no causal links. But you also saw the risks: if similarity or scale breaks down, evidence fails."  
  - **Name the idea (finally)**: "This mirrors my friend’s claim. It’s called **'evidential decision theory'** in large worlds. Philosophers like Derek Parfit or Nick Bostrom discuss it for cooperation, but your objection shows why it’s contested."

  ---

  ### **Predictable Problems and Fixes**
  1. **Round 2 defection dominates**:  
     - **Risk**: Students defect en masse, "proving" evidential reasoning doesn’t work.  
     - **Fix**: In debrief, use their distrust to discuss the **similarity assumption**. Ask: "Did you doubt others would reason like you? In a truly identical group, would defection still occur?" Stress that the activity can’t force perfect similarity—it’s a thought experiment.

  2. **Confusion about random pairing**:  
     - **Risk**: Students think they can influence who they’re paired with.  
     - **Fix**: Explicitly say: "Pairing is random—like a lottery. Your choice doesn’t affect who you’re paired with."

  3. **Low stakes reduce engagement**:  
     - **Risk**: Students choose randomly if tokens feel worthless.  
     - **Fix**: Use desirable prizes (e.g., "Top 3 token-holders pick snacks first"). Announce totals publicly to spark competition.

  4. **Time crunch in calculations**:  
     - **Risk**: Computing payoffs takes too long.  
     - **Fix**: Pre-draw Round 2 pairs during Round 1 setup. Use student volunteers to help tally.

  ### **What the Activity Cannot Reproduce**
  - **Sheer scale of the world**: With only 14 people, the evidential effect is modest. In a billion-person world, one person’s choice is negligible causally but statistically significant evidentially. You must **verbally emphasize this**: "In a vast world, your action’s evidential power scales up, but its causal power vanishes—making cooperation feel urgent even in isolation."  
  - **Uncertain similarity**: The activity assumes identical reasoning, but real-world agents may differ. You must **explicitly discuss**: "How do we know others reason like us? If we’re wrong, evidential reasoning collapses. This is why your objection matters—it forces us to ask when similarity holds."

  This design makes the idea visceral: students experience causal reasoning as "obvious" in Round 1, then feel the pull of evidence in Round 2. The debrief validates both perspectives, leaving them with a nuanced tension to explore.
