answer: |-
  Below is a practical, step-by-step procedure for your team to evaluate potential patient record merges. It prioritizes minimizing the risk of merging distinct patients over fixing duplicate records, acknowledges when human judgment is required, and explicitly defines "sufficient evidence" to break symmetry. The procedure is structured as a flowchart of questions with clear exit points.

  ---

  ### **Procedure: Patient Record Merge Decision Tree**
  *Time limit: 20 minutes per pair. Staff must document answers for governance sign-off.*

  1. **Do the records have ANY direct contradiction in core fields?**  
     (Core fields: Name, DOB, Address, Phone, Insurance ID, Gender)  
     - *Sufficient answer:* Yes (e.g., different DOB, mismatched insurance ID digits).  
     - **→ STOP: Keep records SEPARATE.**  
     - *No? → Proceed to #2.*

  2. **Is there NON-OVERLAPPING CLINICAL/DEMOGRAPHIC DATA suggesting distinct patients?**  
     (e.g., conflicting diagnoses, incompatible procedures, different emergency contacts)  
     - *Sufficient answer:* Yes (e.g., Record A: "allergic to penicillin"; Record B: "no known allergies").  
     - **→ STOP: Keep records SEPARATE.**  
     - *No? → Proceed to #3.*

  3. **Is there EVIDENCE OF INDEPENDENT CREATION?**  
     (e.g., different registration timestamps/locations/staff, distinct visit histories)  
     - *Sufficient answer:* Yes (e.g., Record A created at ER desk, Record B at outpatient clinic).  
     - **→ STOP: Keep records SEPARATE.**  
     - *No? → Proceed to #4.*

  4. **Is there NON-OVERLAPPING NON-CRITICAL DATA?**  
     (e.g., one record has a progress note, vaccination, or billing code; the other does not)  
     - *Sufficient answer:*  
       - **Yes → MERGE records** but preserve all non-overlapping data in the merged profile.  
       - **No → MERGE records** (perfect symmetry).  
     - *Uncertain? → Proceed to #5.*

  5. **Escalate to data governance lead**  
     - *Reason:* Records are symmetric with no clear causal history. Requires values-based decision:  
       - **Option A:** Keep separate (safe but costly).  
       - **Option B:** Merge (efficient but risky).  

  ---

  ### **Key Principles Embedded**
  - **Risk prioritization:** Merging distinct patients (false positive) is deemed **worse** than failing to merge duplicates (false negative).  
  - **Evidence threshold:** Independent creation events or clinical contradictions are sufficient evidence of distinctness.  
  - **Values calls:** Explicitly escalated when records are symmetric (#5).  
  - **Efficiency:** Most decisions resolved by #2 or #3; only ambiguous cases reach #5.  

  ---

  ### **Case Analyses**
  **Case 1: Same data + same timestamp + one has extra clinic note**  
  - #1: No contradictions → Proceed.  
  - #2: Non-overlapping note exists, but not *clinically contradictory* (e.g., not an incompatible diagnosis) → Proceed.  
  - #3: Same timestamp → **No independent creation evidence** → Proceed.  
  - #4: Non-critical note (e.g., "routine checkup") → **MERGE** and append note to merged record.  
  - *Suspicion:* If the note implies distinctness (e.g., "sibling donated kidney"), #2 should catch it. If not, merging is safe.

  **Case 2: Same data + different registration desks same day**  
  - #1: No contradictions → Proceed.  
  - #2: No clinical conflicts → Proceed.  
  - #3: Different registration desks → **Independent creation evidence** → **KEEP SEPARATE**.  
  - *Suspicion:* This could be the same patient registered twice (common error), but independent creation is hard evidence of potential distinctness. Risk of merging > cost of duplicates.

  **Case 3: Perfect duplicates + identical hash + no audit trail**  
  - #1–#3: No contradictions, no clinical conflicts, no creation metadata → Proceed to #4.  
  - #4: No non-overlapping data → **MERGE**.  
  - *Suspicion:* Hash match implies system duplication, but legacy systems may mask distinct patients. Without audit trails, we assume technical error (not real-world distinctness).

  ---

  ### **The Unpopular Outcome**
  - **Scenario:** Case 2 (different registration desks) → **Keep Separate**.  
  - **Why you’ll dislike it:**  
    You *know* this is likely a duplicate (same patient registered twice). But the procedure prioritizes evidence of distinctness (independent creation) over efficiency. Result:  
    - **Cost:** Duplicate records persist → risk of redundant tests, billing errors, care fragmentation.  
    - **No softening:** The procedure accepts this cost to avoid the catastrophic risk of merging distinct patients.  

  ---

  ### **What the Procedure Can’t Do**
  1. **Resolve symmetric records without human judgment**  
     - When all fields match *and* no creation history exists (e.g., legacy data), it defaults to merging (#4). This risks merging twins, spouses with identical names/addresses, or fraud.  
  2. **Detect real-world distinctness without observable differences**  
     - Leibniz’s principle ("if all properties are identical, they are the same") is *assumed* in #4. But as Black’s spheres show, qualitative identity ≠ numerical identity.  
  3. **Fix data collection gaps**  
     - If your system lacks audit trails or unique keys (e.g., biometrics), symmetric records will recur.  

  ---

  ### **Justifying the Vendor’s Default Rule (Merge on Indiscernibility)**  
  - **The vendor’s assumption:** Leibniz’s principle applies ("no two things differ *only* numerically"). If records are qualitatively identical, they *must* refer to one patient.  
  - **What you’d need to believe:**  
    1. **Uniqueness through data exhaustiveness:** Your patient fields (name/DOB/address/insurance) are sufficient to uniquely identify individuals.  
    2. **No Black’s spheres scenarios:** Real-world exact duplicates (e.g., twins with identical names/addresses/insurance) are impossible or negligible.  
    3. **Cost of duplicates > risk of false merges:** Fragmented records pose greater harm than rare identity errors.  
  - **Why it’s risky in healthcare:**  
    - Assumption #2 fails for common names, family members, or fraud.  
    - Assumption #3 ignores catastrophic outcomes (e.g., merging distinct patients → wrong treatment).  

  ---

  ### **Recommendations**
  - **Prevent symmetric records:** Add immutable keys (e.g., registration biometrics, insurance photo IDs).  
  - **Audit trail fixes:** Require unique session IDs for registrations to resolve Case 2.  
  - **Governance escalation:** All #5 cases require lead sign-off. Use a risk rubric (e.g., "if probability of distinctness >0.1%, keep separate").  
  - **Staff training:** Focus on "evidence of distinctness" (Steps #2–#3), not philosophy.  

  This procedure forces explicit risk/cost trade-offs while minimizing philosophy. It errs toward safety, but its limits are clearly stated for governance oversight.
