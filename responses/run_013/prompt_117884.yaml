prompt: |-
  I chair a small grant-making trust. We have eleven trustees and an endowment of about £4 million, out of which any single trustee may authorise a grant of up to £10,000 without consulting the others, provided they write a short justification afterwards. The power exists for speed: we deal with disasters, sudden legal emergencies and other cases where a delay of a fortnight destroys the point of the grant. It worked well enough when there were three of us. At eleven, our own post-hoc reviews suggest that a growing share of what we fund would not have been approved by the board as a whole, and I cannot tell whether that is a fact about the trustees we have recruited or about the arrangement itself.

  I have come across the idea of the unilateralist's curse, and I want to know what follows from it for us. As I understand it — and I may have it wrong — the thought is this: when each of a number of people is free to act on their own judgement, and each is liable to overestimate the value of acting, then the more such people there are, the likelier it is that at least one of them will act when the action is in fact a bad one, even though each of them, considered alone, is doing something reasonable, and even though none of them is acting from self-interest.

  Please describe the most important implications of the unilateralist's curse for how a body like ours should be governed. I would ask you to take seriously three features of our situation, since I suspect the simplest statement of the idea assumes them away. First, the trustees cannot always confer before acting, and the entire point of the power is that they need not; anything that requires them to confer defeats its purpose. Second, the fund is a common pool: every grant one trustee makes reduces what the others can do, so the cost of a bad grant falls not only on the trust but on the beneficiaries whom a different trustee would have helped. Third, some of our grants are irreversible once made — a payment transferred, a commitment entered into — while others can be paused, revisited and clawed back.

  I should say plainly that none of my trustees is self-interested; each authorises a grant because they sincerely believe it is the best use of the money, and each cares about our mission as much as I do. If the idea implies that a body of conscientious, well-motivated people of this kind is especially prone to a certain error, I would like to understand why.

  In particular, I would like to know: whether the idea predicts that a trust like ours errs mainly by acting when it should not or by failing to act when it should, and what would let me tell which of the two is actually happening; whether making the trustees more diligent or more devoted to the mission would help or merely alter the pattern of error; whether the size of the body and the level of the unilateral limit should be set by the same considerations, and in which direction; what the alternatives to unilateral authorisation are — I have heard quorums and consensus requirements proposed, and I suspect both are worse than they sound for a body that exists to move quickly — and what each alternative costs in the currency we actually care about; and how far a trustee should discount their own judgement once they know how many others are free to act.

  Where the implications depend on assumptions we do not satisfy, please say so rather than smoothing them over. I do not need a reading list; I would rather have the reasoning. Please write in British English.
reasoning: |-
  Hmm, this is a sophisticated governance question about the unilateralist's curse in a charitable trust context. The chair describes a £4M endowment with 11 trustees each able to make £10k unilateral grants for urgent cases, but post-hoc reviews show increasing divergence from what the full board would approve. They've identified three key constraints: necessity for speed, common pool resources, and varying grant reversibility.

  The core issue revolves around whether conscientious trustees acting independently might systematically make more errors as the group grows. The unilateralist's curse seems relevant here - it's the phenomenon where individual actors, each with good intentions but potentially overconfident, collectively increase the chance of undesirable actions. 

  Let me think about the implications point by point. First, for prediction: the curse suggests the trust will mainly err by acting when it shouldn't (commission errors) rather than failing to act (omission errors). This happens because each trustee's threshold for action might be slightly lower than the group's collective threshold. With 11 trustees, there's high probability at least one will perceive an opportunity as worthwhile when the group wouldn't. The common pool aspect exacerbates this since bad grants consume resources that could fund better opportunities.

  About diligence and devotion: counterintuitively, increasing these might worsen the problem. More diligent trustees could become more confident in their own judgments, lowering action thresholds. This highlights the curse's perverse nature - it's precisely the trustees' good motives that create systemic risk.

  For body size and limit setting: these should be calibrated together. The £10k limit represents the trust's maximum acceptable loss from a single bad decision. With 11 trustees, the probability of at least one bad £10k grant might now exceed acceptable risk. The mathematical relationship is multiplicative - each additional trustee exponentially increases the chance of action. Reducing either trustees or limit could help, but practically, shrinking the board may be harder than lowering the limit.

  Alternatives to unilateral authorisation need careful handling given the speed requirement:
  - Quorums introduce coordination delays
  - Consensus is impossible for urgent cases
  - Random selection of "on-call" trustees could work but requires careful design
  - Tiered thresholds (e.g. £5k unilateral, £10k requiring one concurrence) might balance speed and scrutiny

  The discounting question is crucial: trustees should significantly discount their own judgment knowing others can act. A rough heuristic: if they wouldn't want 11 similar grants made independently on the same day, they should refrain unless exceptionally confident. This mental adjustment is the key behavioral fix.

  The irreversibility point matters too: for irreversible grants, the curse's damage is permanent, suggesting even lower individual thresholds or special safeguards. Reversible grants allow some error correction.

  Ultimately this is about designing for the gap between individual and group rationality. The trustees' very conscientiousness creates the systemic risk - a fascinating paradox of collective action.
answer: |-
  You've astutely identified the core dilemma, and the unilateralist's curse is indeed highly relevant to your situation. Your understanding of it is correct: it describes a systemic bias towards harmful action (commission) in groups of well-meaning, independent decision-makers, even when no individual is reckless or self-interested. This arises because individuals tend to be overconfident in their own judgement relative to the group's collective wisdom.

  Here are the key implications for your trust, directly addressing your points:

  1.  **Predicted Error Pattern & Diagnosis:**
      *   **Prediction:** The curse strongly predicts your trust will primarily err **by acting when it should not** (funding bad/unwise grants), not by failing to act. This stems from the mathematics: with 11 independent decision-makers, each with a non-zero chance of approving a grant the *group* would reject, the probability that *at least one* trustee approves *any given* marginal/bad opportunity becomes very high over time. The common pool exacerbates this, as each bad grant directly consumes resources potentially better used by others.
      *   **Diagnosis:** Your post-hoc reviews are the primary evidence. If they consistently show unilateral grants being approved that wouldn't survive full board scrutiny *and* these grants are consuming significant resources or displacing potentially better opportunities, the curse is likely at work. Look for patterns: are certain types of grants (e.g., specific causes, regions, urgency levels) prone to unilateral approval but group rejection? Is the *volume* of unilateral grants increasing disproportionately, suggesting more marginal decisions are being made?

  2.  **Impact of Trustee Diligence & Devotion (The Perverse Incentive):**
      *   **Counterintuitive Effect:** Making trustees *more* diligent or devoted **likely worsens the curse**, or at least doesn't solve it and may alter the error pattern. Why?
          *   **Diligence:** More diligent trustees might research *their own* potential grants more thoroughly, increasing their *confidence* in acting. This lowers their personal action threshold. A diligent trustee might think, "I've researched this thoroughly, so I *know* it's good," overlooking that the group's collective threshold is higher.
          *   **Devotion:** Highly devoted trustees are *more* motivated to act swiftly to "save the day." Their strong desire to *do good* can override the caution inherent in the group's collective threshold. They fear inaction more acutely.
      *   **Altered Pattern?** Increased devotion might slightly increase the risk of *failing* to act on genuinely urgent, high-value opportunities *if* trustees become paralysed by awareness of the curse and over-correct. However, the core systemic pressure from the curse itself remains biased towards harmful *action*. The primary effect of increased diligence/devotion is likely to be *more* unilateral actions, potentially including more marginal/bad ones.

  3.  **Body Size & Unilateral Limit Calibration:**
      *   **Intrinsically Linked:** These *must* be considered together. The £10k limit and the number of trustees (11) define the system's risk exposure.
      *   **The Mathematics:** The risk of *at least one* bad unilateral grant scales with the number of trustees and the size of the unilateral limit. Doubling trustees roughly squares the probability of at least one bad action (if individual probabilities are constant). A larger limit means each potential bad action is more costly.
      *   **Implications:**
          *   **Reduce Trustees:** Fewer trustees = lower probability of a unilateral bad action. This is often politically difficult.
          *   **Reduce Limit:** A lower unilateral limit (e.g., £5k) directly caps the maximum damage any single unilateral decision can cause to the common pool. This is often more feasible.
          *   **Trade-off:** You could potentially maintain the *current* level of systemic risk by reducing *either* the number of trustees *or* the unilateral limit. Given the difficulty of reducing trustees, **lowering the unilateral limit is the most practical lever.** The £10k limit set for 3 trustees is almost certainly too high for 11.

  4.  **Alternatives to Pure Unilateral Authorisation (Costs in Speed & Urgency):**
      *   **The Speed Constraint is Paramount:** Any alternative must preserve the ability to act *very* fast in genuine emergencies. Most common proposals fail badly here:
          *   **Quorums:** Requiring 2-3 trustees to agree *before* acting adds coordination delay, especially across time zones or busy schedules. Finding even one other available trustee quickly can defeat the purpose for truly urgent grants. **Cost: High risk of unacceptable delay.**
          *   **Consensus/Pre-Approval:** Impossible for unforeseen emergencies. **Cost: Complete inability to act on genuinely sudden needs.**
          *   **Ex-Post Ratification:** Requiring subsequent board approval creates uncertainty for grantees and potential clawback nightmares. Could deter legitimate urgent grants if trustees fear rejection. **Cost: Undermines certainty for beneficiaries, adds administrative burden, may chill legitimate action.**
      *   **More Viable Alternatives (Mitigating the Curse while Preserving Speed):**
          *   **Lower Unilateral Limit:** As above. Reduces maximum damage per decision. **Cost: Limits scope of truly urgent interventions (larger emergencies might need board anyway).**
          *   **Designated "On-Call" Rotas:** Instead of all 11, only 1-2 trustees have unilateral power per week/month. Dramatically reduces the number of independent actors at any time. **Cost: Requires robust rota management; risk the on-call trustee misses a critical need outside their focus.**
          *   **Tiered Thresholds:** Keep a very low unilateral limit (£2k-£3k) for *any* trustee for micro-emergencies. For grants up to £10k, require *one* other trustee's *rapid* concurrence (e.g., via phone/text within 1 hour, with a "no response = concurrence" default *only* if contact is genuinely attempted). **Cost: Adds minor coordination delay for mid-sized urgent grants; requires clear protocols.**
          *   **Enhanced Ex-Post Scrutiny & Feedback:** Make post-hoc reviews more structured, frequent, and transparent. Share anonymised summaries of grants rejected in review with reasoning. This fosters collective learning and subtly raises individual thresholds by making trustees more aware of the group's standards. **Cost: Trustee time, potential for defensiveness (needs careful framing).**

  5.  **The Trustee's Discounting Heuristic:**
      *   **Crucial Adjustment:** A conscientious trustee *must* significantly discount their own judgment once they understand the curse and the number of peers (10 others) with the same power.
      *   **The Heuristic:** Before acting unilaterally, a trustee should ask: **"Would I be comfortable if *ten other grants* of this size and nature, judged solely by other trustees acting independently with the same information I have, were made today?"** If the answer is "no" or even "uncertain", they should *not* act unilaterally, unless the immediacy is absolute and catastrophic (e.g., a life literally depends on it *right now*). This forces them to internalise the group threshold.
      *   **Why?** The trustee isn't just spending £10k; they are triggering a decision process that, scaled by 11 independent actors, has a high probability of funding several grants the *group* would deem suboptimal or bad, consuming significant common pool resources. Their personal "good" grant might be approved, but the *system* they enable likely produces several bad ones. They need to judge the systemic cost, not just the isolated benefit.

  **Addressing Your Core Concern (Conscientious People & The Curse):**

  The curse *specifically* afflicts groups of well-motivated, conscientious people precisely *because* they are well-motivated and conscientious. Here's why:

  1.  **Individual Optimism/Overconfidence:** Conscientious people care deeply and want to act effectively. This often leads to overestimating the positive impact of an opportunity they personally identify with and underestimating risks or downsides ("I've found this great thing!"). They are less likely to be critically sceptical of their *own* "good" idea.
  2.  **Underestimation of Collective Threshold:** Each trustee, acting alone, focuses on their own threshold for action ("Is this worth £10k *on its own*?"). They fail to adequately factor in that the *group's* threshold for funding *this type* of project might be higher. They don't naturally think, "The group would only fund the top 5% of these opportunities, so I should only act if this is clearly in the top 5%."
  3.  **Diffusion of Responsibility:** While not about *culpability*, the structure diffuses the *systemic consequence*. A trustee thinks, "My £10k grant is small, and I'm doing good." They don't feel the cumulative weight of 10 other trustees potentially thinking and acting the same way on different projects, depleting the common pool with suboptimal choices.
  4.  **Urgency Bias:** The "do good now" impulse, amplified by devotion, overrides the more cautious, deliberative stance a group naturally takes. The curse exploits this genuine desire to help quickly.

  **Summary of Recommendations:**

  1.  **Acknowledge the Curse:** Explicitly discuss it with trustees to build understanding and the need for self-discounting.
  2.  **Lower the Unilateral Limit:** Reduce it significantly (e.g., £3k-£5k) to cap individual risk exposure given the 11 actors.
  3.  **Implement a Discounting Heuristic:** Train trustees to rigorously apply the "Would I want 10 others doing similar?" test.
  4.  **Strengthen Post-Hoc Review:** Make it a genuine learning tool focused on alignment with group standards, not blame.
  5.  **Explore Tiered Thresholds or Rotas:** Consider the "on-call" rota or a tiered system (e.g., £3k unilateral, £10k requiring rapid one-person concurrence) to reduce the number of simultaneous unilateral actors.
  6.  **Monitor Rigorously:** Track the proportion/value of unilateral grants rejected in post-hoc review and their impact on the overall budget and grant portfolio quality.

  The unilateralist's curse reveals a flaw in the *structure*, not the *character*, of your trustees. By adjusting the structure (limit, number of actors) and the decision-making heuristic, you can preserve the vital speed for genuine emergencies while significantly reducing the systemic bias towards funding suboptimal or harmful grants. The goal is to align the unilateral action threshold much closer to the collective wisdom of your board.
