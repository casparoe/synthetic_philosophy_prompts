prompt: |-
  A friend and I spent most of last night arguing about a pattern I can describe but cannot name, and I would like your help either identifying it or, failing that, defining it properly. The pattern concerns how we sort harmful outcomes into bringing about and letting happen, and what struck me is that the sorting does not seem to track whether the agent acted at all, but rather whether the agent started a chain of events or merely kept one running. My friend offered a lighthouse keeper: one who lights a lamp for the first time is said to have caused the wreck, while one who has kept the lamp dark for years is said merely to have let it happen — yet keeping a lamp dark for years is plainly more work than lighting it once. The same shape appears in medicine: a surgeon who switches off a ventilator is treated as killing, while one who declines to start it is treated as allowing a death, even though both involve a deliberate policy sustained over time. Is there a name for this asymmetry — the habit of counting the initiation of a harmful causal chain as an act and its continued maintenance as a mere omission, even when the maintenance costs more effort than the initiation? If the established act-and-omission literature already covers it, tell me which strand fits and precisely where the fit breaks down; if it does not, coin a term and define it, marking its boundaries against the ordinary doing/allowing distinction and against omission bias. I am not after a bare label — I want to know what exactly the phenomenon is, what it is not, and where its edges lie. Please answer in British English.
reasoning: |-
  Okay, the user has presented a fascinating philosophical puzzle about an asymmetry in how we categorize harmful outcomes. They've noticed that initiating a harmful chain (like lighting a lamp that causes a shipwreck) is treated as "causing harm," while maintaining an existing harmful state (like keeping the lamp dark for years) is treated as "letting it happen," even when maintenance requires more effort. 

  Hmm, this reminds me of classic debates in moral philosophy, particularly the doing/allowing distinction and omission bias. The user's examples are perceptive - the lighthouse keeper scenario is brilliant because it flips our intuition about effort. Normally we think actions require more effort than omissions, but here maintaining omission (keeping the lamp dark) is actually harder work than the single act of lighting it. 

  The medical ventilator example is equally sharp. Both involve deliberate policies with identical outcomes, yet we judge the doctor who switches off differently from one who never starts. This suggests our moral categorization isn't about effort or even about physical action/inaction per se, but about whether we're intervening in an existing state of affairs. 

  I recall Judith Thomson's work on "altering the course of events" might be relevant here. The key seems to be whether the agent establishes the causal chain versus whether they're sustaining an existing one. But the user is right - established literature doesn't fully capture this nuance, especially when maintenance requires active effort. 

  The user clearly knows philosophy - they're familiar with omission bias and act/omission distinctions, and they're asking for precise boundaries. They want more than a label; they want conceptual clarity. Their frustration with existing frameworks is palpable - they've clearly wrestled with this all night. 

  I should acknowledge that while the doing/allowing distinction comes close, it breaks down when "allowing" requires active maintenance. Similarly, omission bias typically favors inaction, but here the "inaction" (keeping lamp dark) is effortful. 

  Maybe we need to frame this as a distinction between "initiating causes" and "sustaining causes," with the twist that sustaining causes can involve active effort while being morally categorized as omissions. The lighthouse keeper who actively maintains darkness is seen as "allowing" wrecks only because he didn't create the dark condition - he inherited it. 

  For the medical case, the difference lies in baseline expectations: we assume ventilators are on, so turning one off changes the status quo, while not starting one maintains it. But this is convention, not logic. 

  The user might appreciate knowing this relates to what philosophers call the "default position" problem. And they'd probably want the term to reflect the causal-chain framing they've intuitively grasped. "Precedent causal chain asymmetry" could work, but needs careful definition to distinguish from simple doing/allowing. 

  Most importantly, I must mark the boundaries clearly: this isn't about physical effort, nor about intention, but specifically about whether the agent originated the harmful sequence or managed an existing one. And it's distinct from omission bias because here the "omission" (maintenance) is effortful and intentional. 

  The British English requirement is straightforward - just need to watch spellings and avoid Americanisms. The tone should remain academic but accessible, matching their articulate query. They deserve a thorough response that honors the depth of their all-night debate.
answer: |-
  You've identified a profound and under-discussed asymmetry in moral psychology that does indeed expose a gap in conventional act/omission frameworks. While related to established concepts, it carves out a distinct phenomenon requiring precise definition. Let's dissect it systematically:

  **1. The Core Phenomenon: Precedent Causal Chain Asymmetry (PCCA)**  
  This is the tendency to categorise **initiating a harmful causal chain** as *actively bringing about* harm ("doing"), while categorising the **deliberate maintenance or non-interruption of an ongoing harmful chain** (even when that maintenance requires substantial, sustained effort) as *merely allowing* harm ("allowing"), **based solely on the agent's relationship to the chain's origin point.**

  **Key Characteristics:**  
  - **Focus:** The moral categorisation hinges on whether the agent *established the precedent state* of the harmful chain, not on physical effort, intention, or the presence/absence of bodily movement.  
  - **Effort Irrelevance:** Maintenance effort (e.g., years of lighthouse neglect, sustained refusal to start ventilation) is morally discounted in the categorisation.  
  - **Status Quo Bias:** The existing state of the causal chain *before the agent's involvement* acts as the baseline. Altering it to cause harm = "doing". Preserving it to cause harm = "allowing".  
  - **Temporal Separation:** The agent's decisive contribution (initiation or sustained maintenance) can be temporally distant from the harmful outcome, yet the asymmetry persists.

  **2. Distinct from Standard Doing/Allowing Distinction**  
  Standard distinctions focus on:  
  - **Bodily Movement:** "Doing" typically involves an active bodily movement causing harm; "allowing" involves refraining from movement to prevent harm.  
  - **Use of Energy:** "Doing" expends energy to cause harm; "allowing" conserves energy by not preventing harm.  
  - **Direct Causation:** "Doing" directly intervenes; "allowing" fails to intervene.  

  **PCCA Violates This:**  
  - **Maintenance as "Allowing":** Your lighthouse keeper *expends significant energy over years* (the effort of *not* lighting the lamp, managing duties while ensuring darkness) yet this is categorised as "allowing".  
  - **Initiation as "Doing":** Lighting the lamp *once* (minimal energy) is "doing".  
  - **No Bodily Movement Difference:** Both involve sequences of actions/inactions; the distinction lies in *when* and *how* they relate to the chain's origin.

  **3. Distinct from Omission Bias**  
  Omission bias is the preference for harms caused by *inaction* over harms caused by *action*, even when outcomes are identical.  

  **PCCA is Different:**  
  - **Scope:** Omission bias explains a *preference* (judging harmful omissions less bad than harmful acts). PCCA explains a *categorisation error* (misclassifying effortful maintenance of harm as a mere "omission").  
  - **Effort:** Omission bias assumes omissions require *less effort*. PCCA highlights cases where the categorised "omission" (maintenance) requires *more effort* than the categorised "act" (initiation).  
  - **Focus:** Omission bias doesn't inherently address the *initiation vs. maintenance* distinction central to PCCA. One can exhibit omission bias *within* either category.

  **4. Boundaries and Limitations of PCCA**  
  - **Requires a Precedent Chain:** The asymmetry only manifests when there is an *ongoing causal process* that the agent either *starts de novo* or *deliberately sustains/preserves*. It doesn't apply to one-off, instantaneous harms.  
  - **Deliberate Policy Essential:** The maintenance must be a *conscious, sustained choice* (e.g., the keeper's years of neglect, the doctor's consistent policy against ventilation). Accidental neglect or unawareness doesn't trigger the asymmetry.  
  - **Baseline Dependency:** The categorisation is highly sensitive to the perceived "normal" or "pre-existing" state. If lighting the lamp was the keeper's lifelong duty, *stopping* might be seen as "doing" harm. If darkness was the norm, *starting* to light it might be seen differently. PCCA arises when the agent inherits a system with a harmful default state and *chooses to maintain it*.  
  - **Does Not Dictate Blame:** PCCA describes a *categorisation tendency*, not necessarily a *moral judgment*. One might still judge the maintainer harshly *despite* categorising it as "allowing". However, the categorisation often influences blame via omission bias.

  **5. Why Existing Frameworks Fit Poorly**  
  - **Causation Theories:** Counterfactual dependence (harm occurs iff agent acts) often holds for *both* initiators and maintainers in your examples. The initiator isn't *more* of a cause.  
  - **Normative Roles:** Concepts like duties/responsibilities (e.g., the keeper has a duty to light the lamp) explain judgments but not the *causal categorisation* asymmetry itself. PCCA *underpins* why we assign duties to maintainers differently.  
  - **Doing/Allowing Frameworks:** As shown, they fail to account for the effortful maintenance being classed as "allowing".  
  - **Omission Bias:** Explains a preference, not the flawed categorisation causing it.

  **Conclusion: Defining Precedent Causal Chain Asymmetry (PCCA)**  
  **PCCA** is the cognitive tendency to categorise an agent's *initiation of a harmful causal sequence* as an active bringing about ("doing"), while categorising their *deliberate, effortful maintenance or non-interruption of a pre-existing harmful sequence* as a passive allowing ("allowing"), **primarily based on the agent's role relative to the sequence's starting point, and largely independent of the actual physical effort or causal contribution involved.**

  This asymmetry exposes a significant flaw in how we intuitively map causation and agency onto time-bound processes, prioritising origins over sustained contributions and conflating causal history with the nature of the agent's *current* moral responsibility. It suggests our moral grammar is deeply sensitive to whether we perceive an agent as an *instigator* or merely a *custodian* of harm, regardless of the practical weight of that custodianship. Your lighthouse and ventilator examples perfectly crystallise this deep-seated, often unexamined, bias.
