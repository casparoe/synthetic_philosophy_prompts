  The user understands the genetic fallacy, which is confusing origins with justification. But here, it's different. People aren't making that simple mistake; instead, they're using the origin story as a flexible tool that can be flipped to either side. The user wants to know if there's a specific term for this phenomenon, how it differs from the genetic fallacy, and if it applies beyond religious contexts.

  First, I need to recall related concepts. The genetic fallacy is the basic error, but this is more nuanced. The term "motivated reasoning" comes to mind, where people interpret evidence based on pre-existing beliefs. The origin story becomes a Rorschach test, revealing biases. 

  Then there's the idea of "explanatory engulfment" or "absorption." When an explanation fits neatly into someone's worldview, it reinforces their position. For the believer, natural origins show divine wisdom through natural processes. For the skeptic, it reduces the belief to mere biology. Both sides incorporate the explanation into their narrative without logical grounding.

  Is there a specific term? "Double-edged debunking" or "Janus-faced origin story" might describe it, but I'm not sure if there's an established term. The user might need to coin a phrase. The deeper issue is epistemic justification. The origin story gets absorbed into the belief's framework, acting as a "hermeneutic reinforcement" for both sides.

  The user also asks if this happens outside religion. Probably yes—political ideologies, cultural practices. Any deeply held belief system might use origin stories this way. For instance, a tradition might be seen as either validated or invalidated by its historical roots. 

  The confidence level: I'm fairly sure about the concepts like motivated reasoning and hermeneutic absorption. The least certain part is whether there's a single established term. The literature might discuss aspects under different names. The user might need to synthesize these ideas under a new term like "bi-directional origin absorption."

  Need to emphasize that this isn't just genetic fallacy but a deeper cognitive bias where the story becomes part of the belief's structure. Highlighting the asymmetry in how each side uses the story and the psychological comfort it provides. Also, stress that the user's observation is astute—this is a subtle point about human cognition and belief justification.
answer: |-
  Your observation captures a sophisticated cognitive phenomenon that goes beyond the basic genetic fallacy. While there isn't a single universally accepted term for **the specific double-use pattern you describe**, we can break it down using established concepts and propose a precise framework. Here's a structured analysis:

  ### 1. **Core Phenomenon: Bidirectional Hermeneutic Absorption**
     - **What it is**: The same origin story is absorbed into opposing worldviews, functioning as a *hermeneutic Rorschach test*. Each side interprets the "neutral" explanation through their pre-existing framework, making it reinforce their position.
     - **Key Mechanism**: The explanation isn't just *about* origins; it becomes **epistemically sticky**—it adheres to the belief system it describes, either as:
       - **Vindicating Absorption**: "This natural process *is* divine wisdom at work" (e.g., God using evolution/human cognition to instill truth).
       - **Debunking Absorption**: "This natural process *replaces* divine claims" (e.g., belief reduced to a cognitive byproduct).
     - **Terminology Gap**: No single term exists for this bidirectional use. Closest phrases:
       - *Explanatory engulfment* (the origin "swallows" the belief's meaning).
       - *Motivated origin assimilation* (cognitive bias driving interpretation).

  ### 2. **How This Differs from Genetic Fallacy**
     - **Genetic Fallacy**: Equates origin *with* truth value (e.g., "Belief X arose from superstition, therefore X is false").  
     - **Your Phenomenon**: Origin is **recruited as narrative reinforcement**. Truth isn't *directly* inferred from origin; instead, the origin story is woven into the belief's *meaning* or *significance*.  
       - *Crucial distinction*: The debunker says, "It's *just* food safety," implying reduction. The vindicator says, "It's food safety *and thus* divinely guided," implying enrichment. Both treat the origin as **hermeneutically constitutive**.

  ### 3. **Vindicating vs. Debunking: Asymmetry & Names**
     - **Debunking Move**: Well-recognized as **reductionism** or **nothing-but-ism** ("just a byproduct").  
     - **Vindicating Move**: Less formally named. It’s often called:  
       - **Theologization of natural processes** (in religious studies),  
       - **Accommodationism** (philosophy of religion),  
       - Or framed as **divine action through secondary causes** (theology).  
     - **Asymmetry**: Vindication requires extra metaphysical work (e.g., asserting divine intent *behind* natural causes). Debunking leans on methodological naturalism (no need for supernatural explanations).

  ### 4. **Why Religious Beliefs? The "Load-Bearing" Effect**
     - **Boundary Cases**: This *does* occur elsewhere (e.g., political ideologies: "This policy arose from economic necessity" → vindicates pragmatism *or* debunks moral principles).  
     - **Special Intensity in Religion**:  
       - Religious beliefs often claim **transcendent origins** (revelation, divine command). Naturalistic explanations feel existentially disruptive.  
       - They also **structure identity/meaning**, making assimilating/challenging origins feel like defending/attacking the self.  
       - **Cognitive Dissonance** is amplified: The origin story *must* be absorbed to preserve coherence. Neutrality feels threatening.

  ### 5. **The Underlying Mechanism: Epistemic Comfort**
     - **Why it "settles" something**: The origin story resolves **hermeneutic anxiety**. For both sides, it answers: *"How does this fit into my understanding of reality?"*  
       - Vindication: "God works through nature." → Comfort in harmony.  
       - Debunking: "No need for supernatural explanations." → Comfort in parsimony.  
     - **It’s not about logic—it’s about cognitive ecology**: The story becomes a **schema stabilizer**, reinforcing the believer’s or skeptic’s ecosystem of beliefs.

  ### 6. **Confidence Assessment**
     - **High Confidence**:  
       - The distinction from genetic fallacy (you’re right—it’s not mere confusion).  
       - Bidirectional absorption as a real phenomenon.  
       - Asymmetry in vindication/debunking moves.  
     - **Moderate Confidence**:  
       - Terminology gaps (*hermeneutic absorption* is descriptive but not canonical).  
       - Prevalence in non-religious contexts (observed but understudied).  
     - **Lowest Confidence**:  
       - Whether **the recruitment itself** has a universally recognized name. Literature often treats each move separately:  
         - Debunking: "Evolutionary debunking arguments" (Joyce, Street).  
         - Vindication: "Theistic evolution" or "natural theology" frameworks.  
       Your "double-use" insight is astute but niche—it may require coining a term like **Janus-faced origin deployment**.

  ### Key Takeaways
  - **What it is**: A cognitive-hermeneutic process where origin stories are bidirectionally absorbed into worldviews for coherence reinforcement.  
  - **Best label**: **Bidirectional Hermeneutic Absorption** (descriptive).  
  - **Trigger**: Explanations that feel "revelatory" (naturalistic/evolutionary/cognitive), as they challenge or affirm foundational narratives.  
  - **Why religious beliefs?**: Their claims to *supernatural origins* make natural accounts uniquely destabilizing—and thus ripe for rapid assimilation.  

  This phenomenon reveals how deeply **explanations are metabolized by belief systems**. It’s not a fallacy—it’s epistemology in a pressure cooker. If you develop this further, you might pioneer the missing terminology.
