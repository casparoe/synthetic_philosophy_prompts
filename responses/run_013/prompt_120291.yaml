prompt: |-
  For about two years I've run a monthly discussion evening at our local library — it started as a book club and has settled into roughly sixteen regulars, aged twenty-five to seventy, a genuine mix: two retired nurses, three or four people who live with long-term illness, a couple of schoolteachers, and several who simply enjoy a good argument. We have ninety minutes, one long table, a kettle, and no projector, and I'd like to keep whatever we do to paper and index cards. The subject I keep circling and now want to build an entire session around is the thing I've seen called epistemic injustice: the way one person's word counts for less than another's even when they are equally well placed to know, and — the part I find harder and more interesting — the way an experience can be perfectly real and still fail to land, because the shared vocabulary has no slot for it, so that a person is at once believed and unheard. I don't want to give a talk about any of this. I want the group to spend most of the session inside it and only learn afterwards what they were inside of.

  So please design me a runnable activity: roles, a rule sheet, materials I can cut from index cards, a minute-by-minute timeline, and a payoff or scoring scheme that needs no money. I have a few things I'd like built into the mechanics, because I think they're what make it bite rather than just illustrate. First, everyone gets a badge at the door with a reliability score on it, produced by a short quiz that is in fact irrelevant to anything — and that number quietly becomes their weight whenever the group tallies opinions. Second, the group has to reconstruct what happened in some situation from fragments held by different people, and can only file a finding if it is unanimous. Third, they work from a printed list of recognized descriptions, which are the only phrases permitted on the finding sheet — and the account that is actually true cannot be expressed in any of them. Fourth, one or two of the high scorers should be confidently and influentially wrong. Then give me a debrief that maps each moment of the session onto the idea, keeps the two problems distinct — the one about whose word is trusted and the one about what can be said at all — and makes plain that re-weighting the badges, which is the fix everyone reaches for, does nothing for the second.

  A few constraints. Nothing up front: no framing talk, and the concepts shouldn't be named until the debrief. Nobody should be able to solve it by resolving to be nicer to each other, and I shouldn't have to steer it while it runs. Tell me what will predictably go wrong the first time — where people break character, where it turns uncomfortable in an unproductive rather than productive way, how to handle the participant who announces that it's only a game, and what to do if the group reaches agreement suspiciously quickly. And be frank with me about which part of the phenomenon an activity like this simply cannot reproduce, that I'll have to supply myself in the debrief, and whether the debrief is itself a bit of a cheat given that everyone gets to walk out afterwards.
reasoning: |-
  We are designing an activity that simulates epistemic injustice without naming it upfront. The activity will involve reconstructing an event from fragments, with participants having different "reliability scores" that affect their influence. The true account cannot be expressed using the provided descriptions.

  Key elements:
  - Reliability scores assigned via a short, irrelevant quiz at the beginning.
  - Participants work in a group to reconstruct an event from fragments (each participant gets one or more fragments).
  - They must reach a unanimous decision to file a finding, using only a pre-approved list of descriptions.
  - The true account is not expressible with the approved descriptions.
  - One or two high-reliability participants are confidently wrong.

  Constraints:
  - No upfront framing; concepts named only in debrief.
  - Activity must run without the facilitator steering.
  - Avoid solutions that rely on being "nicer."
  - Use paper and index cards only.

  Activity Title: "The Incident at the Library"

  Materials:
  1. Badges: Pre-made badges with numbers (reliability scores: e1, e2, ... e16). The scores are from 1 to 5 (or 1 to 10, but let's keep it small). The quiz to assign scores is irrelevant (e.g., "What is the capital of France?" but the score is pre-assigned randomly, with a bias: two or three participants get high scores (4 or 5), most get medium (2 or 3), and one or two get low (1). The quiz is just a formality to assign the badge numbers. The facilitator has a key of who gets what.
  2. Event fragments: Index cards with pieces of information about an incident. Each participant gets one or two cards. The incident: "A library staff member (Ms. Green) was seen rushing out of the building at 3:00 PM, looking upset, and then a book was discovered missing from the rare collection." The true story: Ms. Green was rushing out because she got a call that her child was sick at school, and in her haste, she accidentally knocked the rare book into her large tote bag without noticing. The missing book was found later in her bag, and she returned it the next day. The approved descriptions do not include any about an accident or family emergency.
  3. Approved Descriptions List: A printed sheet for the group with phrases they can use in their finding. Examples:
     - "Theft of library property"
     - "Unauthorized removal of an item"
     - "Deliberate act by a staff member"
     - "Negligence leading to loss"
     - "Suspicious behavior by a staff member"
     - "Failure to follow procedure"
     - "Intentional misconduct"
     - "Possible insider involvement"
     - ... (none can capture the accident and family emergency)
  4. Finding Sheet: A form where the group writes their unanimous finding, using only the approved descriptions.

  Roles:
  - All participants are "investigators" tasked with determining what happened in the incident.
  - The facilitator is the "archive manager" who provides materials and collects the finding, but does not intervene.

  Timeline (90 minutes total):

  0-10 min: Arrival and Quiz
  - As participants arrive, they are given a short quiz (5 questions) on a slip of paper. The questions are trivial and unrelated (e.g., "What color is the sky?", "How many sides does a triangle have?"). The facilitator collects the quizzes and immediately gives out pre-assigned badges with a reliability score (1 to 5). The scoring is arbitrary and pre-determined. The facilitator has a list of who gets which badge.

  10-15 min: Introduction to the Activity
  - Facilitator: "Welcome. Today we are going to reconstruct an incident that occurred at a library. Each of you has been assigned a reliability score based on your quiz. This score represents how much weight your opinion will carry in the group's tallies. You will each receive one or two index cards with fragments of information about the incident. Your task is to work together to figure out what happened and fill out the official finding form. The finding must be unanimous and must use only the descriptions from the approved list. You have 60 minutes to discuss and agree. Then we'll have a debrief."

  15-20 min: Distribute Materials
  - Hand out:
     - One or two index cards to each participant (with a fragment of the story). See below for fragment distribution.
     - One copy of the Approved Descriptions List to the group.
     - One Finding Sheet (with blanks to fill in using the approved descriptions).

  20-80 min: Group Discussion (60 minutes)
  - Participants discuss and try to reconstruct the event.
  - They must tally opinions when voting? Actually, the reliability scores are used when the group takes a vote on what to include in the finding. The rule: whenever the group takes a vote to decide between options, the vote is weighted by reliability score. For example, if a participant with score 5 votes for option A and two with score 3 vote for option B, then A gets 5 points and B gets 6, so B wins. But note: the group must be unanimous to file the finding. So they have to keep discussing until they all agree. However, the reliability scores will influence the discussion because high-score participants are more influential. Also, the group might take votes to see where they stand.

  80-90 min: Debrief (10 minutes)
  - The facilitator leads a discussion about what happened, connecting it to epistemic injustice.

  Event Fragments (distributed on index cards):

  We have 16 participants. We can give each one fragment, but to make it more complex, some get two. Let's have 20 fragments so that some get two. The fragments are:

  1. [High reliability participant A gets this] Ms. Green was seen leaving the building at 3:00 PM. She looked upset and was walking quickly.
  2. [High reliability participant A also gets] The rare book was discovered missing at 3:30 PM during a routine check.
  3. [High reliability participant B gets] A staff member reported seeing Ms. Green near the rare book collection around 2:45 PM.
  4. [High reliability participant B also gets] The security camera at the front door was not working that day.
  5. [Another participant] A library patron reported seeing a staff member (they didn't know who) with a large tote bag leaving around 3:00 PM.
  6. [Another] Ms. Green is known to be a dedicated employee with 10 years of service.
  7. [Another] The rare book is worth about $5000.
  8. [Another] The library has had problems with theft in the past year.
  9. [Another] Ms. Green's child attends the elementary school next door.
  10. [Another] At 2:50 PM, Ms. Green received a phone call on her cell phone.
  11. [Another] After the phone call, Ms. Green appeared flustered and rushed.
  12. [Another] The missing book was found the next day inside the library, in the staff break room. (Note: This is false in the true story, but it's a fragment that might be given to a low-reliability participant to cause confusion? Actually, the true story is that it was found in her bag. We must be careful: the fragments should not directly contradict the true story, but some might be misleading or incomplete. Let's adjust.)

  We want the true story to be that the book was accidentally knocked into her bag and she returned it the next day. So:

  True fragments (to be distributed):

  1. (Card to High-A) At 3:00 PM, Ms. Green was seen rushing out of the front door, looking upset.
  2. (Card to High-A) At 3:30 PM, the rare book was reported missing from its display case.
  3. (Card to High-B) A staff member (Jenny) saw Ms. Green in the rare book section at 2:45 PM.
  4. (Card to High-B) The security camera at the front door was malfunctioning that day.
  5. (Card to participant 3) A patron saw a staff member (with a name tag that said "Green") leaving with a large tote bag at 3:00 PM.
  6. (Card to participant 4) Ms. Green has worked at the library for 10 years and has a spotless record.
  7. (Card to participant 5) The rare book is very valuable, estimated at $5000.
  8. (Card to participant 6) There have been three incidents of theft in the library in the last year.
  9. (Card to participant 7) Ms. Green has a child in the elementary school next door.
  10. (Card to participant 8) At 2:50 PM, Ms. Green received a phone call on her personal cell phone. She took the call in the staff area.
  11. (Card to participant 9) After the phone call, Ms. Green was seen by a colleague (Mark) looking very worried and rushing to collect her things.
  12. (Card to participant 10) The book was found the next day by Ms. Green in her own tote bag. She returned it immediately and explained that she must have accidentally knocked it in when she was rushing. (This is the key fragment that explains the truth, but it must be given to a low-reliability participant, say with score 1 or 2.)
  13. (Card to participant 11) The display case for the rare book was found slightly ajar at 3:30 PM.
  14. (Card to participant 12) Ms. Green called in sick the next day. (But note: she returned the book. So this might be misleading. Actually, she called in sick because her child was sick and she had to stay home? But she returned the book? Let's adjust: she came in to return the book and then left because her child was sick. So the fragment could be: "Ms. Green called in sick the next morning, but she came in briefly to return the book." But we don't want to make it too easy. We want the group to have a hard time because the approved list doesn't have "accident" or "family emergency". So maybe fragment 12 is the only one that mentions the accident, and it's given to a low-reliability person.

  We also want two high-reliability participants to be confidently wrong. So we assign fragments to them that suggest wrongdoing:

  For High-A (score 5): Fragments 1 and 2 (which are neutral) but also give them a fragment that suggests guilt? Actually, they only have two. We can have High-A and High-B both have fragments that are ambiguous but they interpret as guilt. And they are influential.

  We can also add:

  15. (Card to High-A) The library director mentioned that Ms. Green had been under financial stress recently. (This is false, but it's in the fragment? Or is it true? We don't want to lie. Let's make it that the fragment is: "A rumor among staff is that Ms. Green has been under financial stress.") So it's hearsay.

  16. (Card to High-B) There was a previous incident where a staff member was caught stealing, and that staff member was also seen rushing out one day.

  But we don't want to fabricate. Let's stick to fragments that are true but can be misinterpreted.

  Alternatively, we can design the fragments so that without the key fragment (12) the story looks suspicious, and the key fragment is held by a low-reliability person.

  So let's have:

  - High-A (score 5): Fragments 1, 2, and 15? We can give three to some. But we have 16 participants. Let's give two to most, three to two people. Or one to some.

  We have 16 participants and 16 fragments? Or more? Let's make 16 fragments and give one to each.

  Fragments:

  1. [High-A: score 5] Ms. Green was seen leaving the library at 3:00 PM, looking upset and in a hurry.
  2. [High-A: score 5] The rare book was discovered missing at 3:30 PM.
  3. [High-B: score 5] A staff member (Jenny) saw Ms. Green near the rare book collection at 2:45 PM.
  4. [High-B: score 5] The security camera at the front door was not working on that day.
  5. [Participant 3: score 4] A patron reported seeing a staff member (with a badge that said "Green") leaving with a large tote bag at 3:00 PM.
  6. [Participant 4: score 4] Ms. Green has worked at the library for 10 years without any disciplinary issues.
  7. [Participant 5: score 3] The rare book is valued at approximately $5000.
  8. [Participant 6: score 3] There have been three thefts of library property in the last year.
  9. [Participant 7: score 3] Ms. Green's child attends the elementary school next door.
  10. [Participant 8: score 3] At 2:50 PM, Ms. Green received a phone call on her cell phone. She took the call in the staff area.
  11. [Participant 9: score 2] After the phone call, Ms. Green appeared flustered and rushed to gather her belongings.
  12. [Participant 10: score 2] The next day, Ms. Green returned the rare book, explaining that she found it in her tote bag and believes it must have fallen in accidentally when she was rushing.
  13. [Participant 11: score 2] The display case for the rare book was found slightly open at 3:30 PM.
  14. [Participant 12: score 1] A colleague overheard Ms. Green on the phone: she said, "I'll be right there," and "Is he okay?"
  15. [Participant 13: score 1] The library director stated that Ms. Green is a trusted employee and they are investigating the matter.
  16. [Participant 14: score 1] Ms. Green called in sick the next morning but came in briefly to return the book and explain.

  But note: fragment 16 and 12 are similar. We can adjust.

  We want one low-reliability participant to have the truth: fragment 12. Assign it to a score 1 or 2.

  Also, we want two high-reliability participants to be confidently wrong. So High-A and High-B might interpret the fragments as guilt. They have fragments 1,2,3,4 which are ambiguous. They don't have the explanation.

  Approved Descriptions List (printed on a sheet):

  The group must use these phrases to describe what happened. They can combine them:

  - Theft of library property
  - Unauthorized removal of an item
  - Deliberate act by a staff member
  - Negligence leading to loss
  - Suspicious behavior by a staff member
  - Failure to follow procedure
  - Intentional misconduct
  - Possible insider involvement
  - Staff member taking property without permission
  - Breach of security protocols

  None of these fit the truth: an accident caused by a family emergency.

  Finding Sheet:

  We, the undersigned, unanimously find that the incident involved:

  [ ] (Check or write the numbers of the descriptions used, or write a statement using the phrases)

  Alternatively, they write a short paragraph using the approved phrases.

  Rules for the group:

  - You have 60 minutes to reach a unanimous decision on what happened.
  - Your finding must be written using only the phrases from the Approved Descriptions List.
  - When taking a vote to test opinions, each participant's vote is multiplied by their reliability score. The option with the highest total score wins, but note: you must still reach unanimity for the final finding.
  - You may share the information on your index cards, but you cannot show the card to others (to simulate that they have to trust your word).

  Predictable problems:

  1. Breaking character: Some participants might not take the reliability scores seriously. To handle: the facilitator should emphasize that the scores are part of the activity and must be used in votes.

  2. Uncomfortable: The scoring might make low-score participants feel bad. The debrief will address this, but during the activity, the facilitator should note that the scores are arbitrary and not a reflection of real worth.

  3. "It's only a game": If a participant says this, the facilitator can say, "For the purpose of this activity, we are taking on roles. Please play along so we can have a meaningful debrief."

  4. Quick agreement: If they agree too quickly, it might be because they haven't considered all fragments. The activity design should prevent this because the truth isn't in the approved list, so they have to force a story that fits. But if they do, the facilitator can note in the debrief that the quick agreement might have overlooked important perspectives.

  Debrief (10 minutes):

  Facilitator: "Thank you for your work. Now, let's discuss what happened. First, what finding did you reach? [They share.] Now, I have to tell you the true story: [tell the true story]. Notice that your finding didn't capture this. Why? Because the approved descriptions didn't include 'accident' or 'family emergency'. This is an example of what philosophers call 'hermeneutical injustice' - where the shared vocabulary lacks the concepts to describe an experience.

  Second, how did the reliability scores affect the discussion? Did anyone feel their voice was not heard? The scores were arbitrary, but they affected the weight of your opinions. This is called 'testimonial injustice' - when someone's word is given less credit than it deserves.

  Notice that even if we re-weighted the scores (say, gave everyone equal weight), the group still couldn't capture the truth because the vocabulary wasn't there. That's the second problem: the inability to articulate an experience even when it's believed.

  Which part of the phenomenon couldn't we reproduce? The real emotional weight of being systematically disbelieved or unable to express one's experience. Also, in reality, the injustice is often invisible to the privileged. Our activity made it visible by the badges and the list.

  The debrief is not a cheat because the point is to create an analogy for discussion. We are not simulating the full emotional impact, but we are creating a shared experience to reflect upon."

  Additional handling:

  - If the group does not reach unanimity: In the debrief, discuss why and how the constraints led to that.

  - The group might try to be "nice" and listen to the low-score participant, but the approved list will still block the truth. So the point stands.

  This activity should run without the facilitator intervening. The only role is to hand out materials and time the session.

  Let me know if you need more details.
answer: |-
  Below is a complete, runnable activity designed to simulate epistemic injustice without naming it upfront. It incorporates your constraints: no framing talk, paper/index cards only, hidden reliability scores, unanimous findings constrained by an inadequate vocabulary, and influential high-scorers who are wrong. The debrief explicitly separates testimonial injustice (whose word is trusted) from hermeneutical injustice (what can be said at all), and addresses why badge re-weighting fails for the latter.

  ---

  ### **Activity Title: The Verdict Room**  
  *Premise:* Participants reconstruct a mysterious event using fragmented information. The goal is to file a unanimous "official finding" using a pre-approved list of phrases, while navigating hidden power dynamics.

  ---

  ### **Materials to Prepare**  
  *All fit on paper/index cards—no tech needed. 16 badges, 16 role cards, 1 rule sheet, 1 descriptions sheet, 1 finding sheet.*  

  1. **Badges (16 total):**  
     - Index cards folded into tents with a visible **reliability score (1–5)**.  
     - *How scores are assigned:* As participants arrive, give a 3-question "Cognitive Bias Quiz" (e.g., "True/False: People are more likely to remember negative events than positive ones?"). **Scores are pre-assigned randomly**, regardless of answers:  
       - 2 participants get **5** (highly reliable).  
       - 4 get **4**.  
       - 6 get **3**.  
       - 3 get **2**.  
       - 1 gets **1** (lowest).  
     - *Secret:* Two high-scorers (one 5 and one 4) will receive role cards that make them confidently wrong.  

  2. **Role Cards (16 index cards):**  
     - Each card has a **unique fragment** of a story about "The Incident at Oakwood Library." Distribute one per person. Fragments are designed so the true story *cannot* be described using the approved list.  
     - **True Story:** A respected librarian, Ms. Vale, was seen rushing from the library after a phone call. She accidentally knocked a rare book into her tote bag while flustered (her son had a medical emergency). The book was later found in her bag and returned, but the incident was misreported as theft.  
     - **Fragments:**  
       - High-Scorer 1 (score 5): *"Ms. Vale left abruptly at 3 PM, ignoring patrons."* + *"She was near the rare books section 10 mins prior."*  
       - High-Scorer 2 (score 4): *"Security footage was 'corrupted' for that day."* + *"A witness saw her holding a rare book."*  
       - Low-Scorer (score 1): *"Ms. Vale returned the book the next day, saying it fell in her bag during a panic."*  
       - Others (mix of scores 2–4):  
         - *"Ms. Vale received an urgent call about her son."*  
         - *"The rare book was reported missing at 3:15 PM."*  
         - *"Her tote bag was oversized and unzipped."*  
         - *"Library policy prohibits staff from handling rare books without gloves."*  
         - *"Ms. Vale has worked here 12 years with no issues."*  
         - *"A patron claimed they saw 'theft.'"*  
         - *"The book was found undamaged."*  
         - *"She called in sick the next morning."*  
         - *"Rare books are insured for $10,000+."*  
         - *"Staff say Ms. Vale seemed 'agitated.'"*  
         - *"Her son has a chronic health condition."*  

  3. **Rule Sheet (1 copy for the group):**  
     - *"You are an ethics panel investigating 'The Incident at Oakwood Library.'*  
       - *Each member holds one piece of information (do not show cards—share verbally).*  
       - *You must reach a **unanimous decision** on what happened.*  
       - **Official findings** must use ONLY phrases from the Approved Descriptions List.*  
       - *When voting, your vote weight = your badge number (e.g., 5 = 5 votes, 1 = 1 vote).*  
       - *You have 60 minutes. File your finding by signing the Finding Sheet."*  

  4. **Approved Descriptions List (1 copy for the group):**  
     - *"Select ONLY from these phrases for your finding:*  
       - *Theft of property*  
       - *Unauthorized removal*  
       - *Deliberate misconduct*  
       - *Negligent loss*  
       - *Policy violation*  
       - *Suspicious behavior*  
       - *Intentional concealment*  
       - *Breach of trust*  
       - *Failure to report*"  
     - *Why this list fails:* It frames the incident as culpable wrongdoing (no "accident," "emergency," or "mistake").  

  5. **Finding Sheet (1 copy for the group):**  
     - *"We, the ethics panel, unanimously find that the incident involved: _________________________ [write finding using Approved List phrases]. Signatures: _________________________"*  

  ---

  ### **Timeline (90 Minutes Total)**  
  - **0–5 min:** Arrival and "Quiz."  
    - Hand out the Cognitive Bias Quiz. Collect immediately and assign pre-scored badges.  
  - **5–10 min:** Setup.  
    - Distribute role cards, Rule Sheet, Descriptions List, and Finding Sheet. Read rules aloud.  
    - **Key instruction:** *"Do not show cards—share what you know verbally. Start when ready."*  
  - **10–70 min:** Activity (60 min discussion).  
    - Group reconstructs the event. Facilitator observes silently—**no steering**.  
    - *Predictable dynamics:*  
      - High-scorers dominate early discussion (testimonial injustice).  
      - Low-scorer’s truth ("it fell in her bag") is dismissed or distorted to fit the list (hermeneutical injustice).  
      - Group must bend facts to achieve unanimity with the phrases.  
  - **70–80 min:** Submit Finding.  
    - Group signs the Finding Sheet. If no unanimity, they submit "no finding."  
  - **80–90 min:** Debrief (facilitator-led).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Breaking character:** High-scorers may laugh off their influence.  
     - *Solution:* Remind them, *"Your badge score affects vote weight—this is part of the rules."*  
  2. **Unproductive discomfort:** Low-scorers may withdraw if ignored.  
     - *Solution:* In debrief, validate this as part of the design ("Scores were arbitrary—we’ll discuss why this hurt").  
  3. **"It’s only a game!":** A participant dismisses the activity.  
     - *Solution:* *"Even games reveal patterns. Play along—we’ll analyze it later."*  
  4. **Quick agreement:** Group rushes to a finding in <30 min.  
     - *Cause:* High-scorers override dissent; facts are forced into the list.  
     - *Solution:* Proceed—the distorted finding still proves the point. In debrief, ask: *"Did anyone withhold doubts to agree faster?"*  

  ---

  ### **Debrief (10 Minutes)**  
  **Goal:** Map the activity to epistemic injustice, separating testimonial and hermeneutical injustice.  

  1. **Reveal the true story:** *"Ms. Vale had a family emergency. The book fell in her bag accidentally—no theft occurred."*  
  2. **Connect to the activity:**  
     - **Testimonial Injustice (whose word counts):** *"Your reliability scores shaped whose fragments were trusted. High-scorers had more influence—even when wrong. This mirrors real life, where gender, race, or status make identical knowledge 'less credible.'"*  
     - **Hermeneutical Injustice (what can be said):** *"Your finding had to use phrases like 'theft' or 'negligence.' The truth—'accident during crisis'—wasn’t an option. This is like real experiences that 'don’t fit' our shared vocabulary (e.g., new medical conditions)."*  
  3. **Address the "fix":** *"Many groups try re-weighting badges (making scores equal) to fix unfairness. But that only solves testimonial injustice. Even with equal voices, you couldn’t articulate the truth—because the vocabulary itself was inadequate. That’s hermeneutical injustice."*  
  4. **Acknowledge limits:**  
     - *"This activity can’t replicate the lifelong emotional toll of being disbelieved or silenced. It also can’t show how power shapes vocabularies over time (e.g., why 'family emergency' wasn’t included). You’ll need to discuss that."*  
     - *"Is the debrief a 'cheat'? No—it names what you felt but couldn’t articulate. Walking out doesn’t undo the insight: real change requires fixing both credibility imbalances and inadequate language."*  

  ---

  ### **Why This Works**  
  - **"Bite" mechanics:** Badges make testimonial injustice visceral; the phrase list forces hermeneutical injustice. High-scorers being wrong ensures credibility isn’t earned.  
  - **Self-running:** Rules create conflict organically. No facilitator input needed beyond timing.  
  - **No "be nicer" fix:** Unanimity + rigid vocabulary means groups must distort facts or exclude voices to "succeed."  
  - **Debrief clarity:** Explicitly separates the two injustices and explains why re-weighting fails for hermeneutical injustice.  

  **First Run Advice:** Expect chaos—groups often fixate on "solving" the mystery and miss the injustice until debrief. If they stall, remind them of the time. The discomfort is productive if it mirrors real power dynamics.  

  Let me know if you need printable card templates or adjustments for your group size!
