prompt: |-
  I teach a seminar that's half philosophy students and half law students, so I've got a foot in both worlds and I keep noticing how much of the public-reason debate sounds like procedure to me. So: take the Rawlsian ideal of public reason -- roughly, that when we coerce each other through law the reasons we offer have to be ones every reasonable citizen could accept, that religious arguments can live in the background or enter under a proviso so long as they get backed up by public reasons in due course -- and restate it, as faithfully as you can, in the vocabulary I actually think in: evidence law and trial procedure. Admissibility versus weight, relevance, hearsay, judicial notice, burdens of proof, the gap between the reasons that end up in the record and the reasons the decision really rests on, harmless error on appeal. Then give me the residue report. What carries over cleanly, what has to be bent to fit, and what has no counterpart at all -- is there anything public reason demands that a court would treat as irrelevant or even improper to weigh? I'm especially curious whether the bit about all reasonable citizens being able to accept the justification survives, because I suspect it's doing work that no procedural rule does, and I want to know whether that's a defect in my translation or a sign the original is smuggling something in. And don't be polite if it turns out the translation is mostly loss -- I'd rather hear that than a forced analogy.
reasoning: |-
  Okay, the user teaches a seminar with both philosophy and law students and notices parallels between public reason debates and trial procedure. They want a faithful translation of Rawlsian public reason into evidence law and trial procedure terms, then a residue report on what carries over, what bends, and what doesn't fit. 

  First, I need to unpack Rawls' public reason concept. The core idea is that in a pluralistic society, when coercing through law, justifications must be based on reasons all reasonable citizens could accept. Religious or comprehensive doctrines can enter discussion under the proviso but must eventually be backed by public reasons. 

  Now, mapping this to trial procedure. The courtroom framework provides useful analogs: admissibility rules filter what evidence enters, burdens of proof allocate responsibility, judicial notice handles uncontested facts, harmless error allows overlooking minor mistakes if outcomes seem just. 

  For the translation, admissibility mirrors the public reason requirement—only "admissible" justifications count. The proviso resembles conditional admissibility. Burdens of proof align with the expectation that proponents must justify coercion. Judicial notice parallels shared civic premises. Harmless error reflects that minor deviations might be overlooked if the core justification holds. 

  But the residue shows friction. The "all reasonable citizens" standard has no direct procedural counterpart—courts care about legal relevance and procedural fairness, not universal reasonable acceptance. The Rawlsian ideal aims for deep legitimacy across worldviews; courts prioritize correctness within legal constraints. Also, while public reason excludes comprehensive doctrines entirely in core applications, courts admit any relevant evidence. 

  The user suspects the "reasonable citizen" element does unique work. They're right—it's about democratic reciprocity, not just procedural correctness. This isn't a translation flaw but a sign that Rawls injects normative political theory absent from neutral evidence rules. 

  The user values intellectual honesty, so I'll avoid forced analogies. The translation works partially but reveals Rawls' concept as more demanding—seeking moral justification beyond procedural fairness.
answer: |-
  Here's a faithful translation of Rawlsian public reason into evidence/procedure vocabulary, followed by a clear residue report identifying friction points:

  **Faithful Translation: The Courtroom of Public Justification**

  1.  **Public Justification = Admissibility (Gatekeeping):** The requirement that coercive laws must be justified by public reasons functions like **Rule 403 Balancing (Probative Value vs. Prejudice)** or **Relevance (FRE 401/402) filtered through Constitutional Due Process**. Only reasons meeting the "reasonable citizen acceptance" standard are *admissible* into the official justification record for state coercion. Religious/comprehensive doctrines are presumptively **inadmissible character evidence** or **hearsay** (an out-of-court statement offered for its truth, lacking reliability guarantees acceptable to all).
  2.  **Proviso = Conditional Admissibility / Limited Purpose Instruction:** Introducing a religious/comprehensive reason is like offering evidence **for a limited, non-hearsay purpose** (e.g., to show notice, motive, or state of mind) or under **conditional admissibility**. It enters provisionally ("I offer this Biblical passage to illustrate my deep commitment to human dignity, not as divine command") with the **burden** squarely on the proponent to subsequently link it to admissible public reasons ("...and this commitment aligns with our shared constitutional value of equal protection"). Failure to do so triggers a **motion to strike** the justification as insufficiently grounded.
  3.  **"Backed up by public reasons in due course" = Burden of Production/Shifting Burden:** The proponent of a law (like the plaintiff/prosecution) bears the **burden of production and persuasion** to demonstrate its justification rests *ultimately* on admissible public reasons. Introducing a comprehensive doctrine under the proviso doesn't shift this burden; it merely starts the clock. If the link to public reasons isn't made by the time the "record closes" (e.g., final vote, judicial decision), the justification fails.
  4.  **"Reasons every reasonable citizen could accept" = Judicial Notice (FRE 201) + Shared Foundational Facts:** Public reasons are akin to facts subject to **mandatory judicial notice** (indisputable, generally known within the jurisdiction) or **adjudicative facts** so fundamental and widely accepted ("brute facts," basic logic, uncontested historical events relevant to civic order) that they form the shared **foundation of the trial record**. They are the "common law" of public justification.
  5.  **The Gap / Real Reasons = Impeachment & Judicial Deliberation:** The difference between the official public justification and the "real reasons" motivating a legislator/judge mirrors the difference between the **evidence in the record** and a decision-maker's **unstated biases or extra-record knowledge**. While the *official justification* must stand on the public record, the *actual motives* can be **impeached** if revealed (showing bad faith or reliance on inadmissible reasons). However, like appellate courts reviewing for **clear error** or **abuse of discretion**, the *legitimacy* of the law depends on the sufficiency of the *stated public reasons in the record*, not necessarily the purity of internal motives, unless impeached. **Harmless error** applies: if ample admissible public reasons support the law, the improper introduction or reliance on a non-public reason might not invalidate it.
  6.  **Coercion through Law = The Verdict & Judgment:** The final act of state coercion (passing/enforcing the law) is the equivalent of entering **judgment** based on the admissible evidence and arguments presented. Its legitimacy hinges on the procedural fairness and substantive sufficiency of the justification *record*.

  **Residue Report: Friction Points & Conceptual Gaps**

  1.  **What Carries Over Cleanly:**
      *   **Gatekeeping Function:** Admissibility rules cleanly map to the core exclusionary principle of public reason. The filter is central to both.
      *   **Burden of Justification:** The idea that the proponent of coercion must shoulder the burden of producing/publicly justifying reasons is a direct procedural analog.
      *   **Proviso as Conditional Admission:** The mechanism for temporarily admitting "suspect" reasons pending connection to admissible ones fits well with limited purpose/conditional admissibility.
      *   **Formal Reliance on the Record:** Legitimacy deriving from the *stated justifications in the official record* aligns perfectly with the trial/appellate model.
      *   **Harmless Error:** The concept that not every procedural flaw invalidates the outcome if the core justification is sound carries over directly.

  2.  **What Has to Be Bent to Fit:**
      *   **"Every Reasonable Citizen" Standard:** This is the **crux of the friction**. Courts decide *specific disputes* between parties based on *legal relevance* and *persuasion within the rules*. "Reasonable citizen acceptance" is a **normative political ideal**, not a procedural rule.
          *   *Bending:* We map it loosely to "judicial notice" or "foundational facts," but these are *legal* constructs determined by judges, not a substantive test of universal reasonable acceptability. A court finds facts "generally known" *within its jurisdiction* for *efficiency and fairness in adjudication*, not to satisfy a deep requirement of reciprocal justification among free and equal citizens. The procedural analog focuses on *admissibility standards* (relevance, reliability) and *fair process*, not the *substantive content* of "reasonableness" across diverse worldviews.
      *   **The Scope of "Public Reasons":** Defining the admissible "public reason" category is inherently political philosophy, not a technical evidence rule. Procedural rules define relevance, hearsay exceptions, etc., based on legal precedent and policy, not a theory of political legitimacy grounded in reciprocity.
      *   **"Reasonable" vs. "Rational":** Rawls's distinction ("reasonable" implies a willingness to propose/fair terms of cooperation) lacks a precise procedural counterpart. Courts deal with competence (rationality) and procedural fairness, not this specific moral disposition.

  3.  **What Has No Counterpart / Is Demanded Differently:**
      *   **The Core Demand of Universal Reasonable Acceptance:** **This is the residue.** As you suspected, *no procedural rule* aims to ensure that the justification for a verdict/law is *acceptable to every reasonable person in the polity*. Courts aim for:
          *   **Correctness:** Getting the facts/application of law right based on the evidence *as presented under the rules*.
          *   **Procedural Fairness:** Giving parties a fair hearing under known rules.
          *   **Legal Sufficiency:** Whether the evidence meets the burden (preponderance, BRD).
          *   *Not:* Whether the winning argument is one that a reasonable Muslim, atheist, libertarian, and socialist could *all* accept as justifying the state's coercion over them. A court might admit (and base a verdict on) evidence/reasoning deeply offensive or unintelligible to significant segments of the population, so long as it was relevant, reliable (under the rules), and met the burden. Public reason demands *more* than procedural fairness and legal sufficiency; it demands a specific *kind* of substantive justification accessible to all reasonable perspectives.
      *   **The Exclusion of Comprehensive Doctrines *as Justifications*:** Courts readily admit highly particularistic evidence if relevant (e.g., a defendant's deeply held religious belief about an action's necessity; testimony about specific cultural practices). Public reason insists these cannot be the *final, public justification* for coercion, even if factually relevant. The procedural system cares about *truth-finding relevance*, not the *source* of the reason for purposes of public legitimacy. A court *can* legitimately (by its own lights) base a verdict on "Because the defendant violated Leviticus 20:13," if that fact is deemed relevant and proven. Public reason forbids this *as the public justification*.
      *   **The Ideal of Democratic Reciprocity:** The *why* behind public reason – showing equal respect to fellow citizens as free and equal by offering justifications they *could* reasonably accept – is a foundational *political moral principle* absent from evidence law. Procedure ensures fairness *within the adversarial contest*; public reason seeks legitimacy *for the exercise of collective power* among diverse equals.

  **Conclusion on Your Key Question:**

  You are absolutely right. The demand that **"all reasonable citizens be able to accept the justification" is the element that does not survive the translation cleanly and does work no procedural rule does.** It's not a defect in your translation; it reveals the core *normative, political-theoretical* ambition of Rawls's project that exceeds the *adjudicative, truth-finding* function of trial procedure.

  Procedural rules manage the contest *within an accepted framework* (the legal system) to reach *a decision*. Public reason is concerned with the *legitimacy of the framework itself* and the *moral permissibility of coercion* within a deeply pluralistic society. The residue is significant: Rawls smuggles in (or more charitably, builds upon) a demanding theory of democratic legitimacy and civic respect that procedural fairness, by itself, does not guarantee. The translation highlights that public reason is less like a rule of evidence and more like a *constitutional principle* governing the *substance* of legitimate state action, layered *on top of* procedural fairness.
