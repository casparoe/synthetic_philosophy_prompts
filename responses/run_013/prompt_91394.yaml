  Okay so Ive gotten weirdly deep into Aquinas over the past few months — a close friend of mine fell down the Catholic social teaching rabbit hole and now we argue about politics constantly — and I'm stuck on one passage. It's in the Summa, II-II, question 42, article 2, on sedition. The sentence that keeps bugging me is this one: "A tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler, as the Philosopher states." He then adds that there's no sedition in disturbing a tyrannical government, particularly an extreme one.

  Here's my problem. He's just spent the entire question arguing that sedition is always a mortal sin because it's opposed to the unity and peace of the people — no exceptions carved out. Then in the last reply he seems to carve out a giant exception. So is it a real exception, or is he quietly redefining "sedition" so that overthrowing a tyrant never counts as sedition by definition? And if it's the second one, is the "sedition is always a mortal sin" line just vacuous?

  Second thing I cant untangle: what work is the qualifier about extreme tyranny doing? Does it mean lesser tyranny can't be resisted, or is it just rhetorical emphasis? And how does this article relate to his better-known caution about overthrowing tyrants — is this a different context, or is there a real tension between them?

  Please explain the actual textual mechanics of this one article in plain American English, no Latin. Dont just give me the standard summary of Aquinas on tyrannicide — I want to know how this specific passage holds together with the rest of the question.
