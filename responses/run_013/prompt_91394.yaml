answer: |-
  Okay, let's break down **II-II, q.42, a.2** like we're dissecting a tricky legal clause, focusing *only* on the mechanics within this specific Question on Sedition. Forget summaries about tyrannicide elsewhere for now – we're laser-focused on how *this* article holds together.

  Here's the plain English breakdown of the textual mechanics:

  1.  **The Core Definition is Established in Article 1:** Before we get to a.2, Aquinas *defines* "sedition" in a.1. Crucially, he defines it as:
      *   "A special sin... opposed to the unity and peace of the people." (Seditionem... opponitur unitati et paci multitudinis).
      *   It involves "inciting discord among the people" or "inciting one part of the people against another."
      *   **Key Point:** This definition *assumes* the existing authority/government is *legitimate* and working for the common good. Sedition is sinful precisely *because* it disrupts the unity *directed towards the common good*.

  2.  **Article 2 Poses the Question:** "Is sedition always a mortal sin?" (Utrum seditio sit semper peccatum mortale).
      *   The *objections* raise potential justifications for rebellion (e.g., rulers might be unjust).

  3.  **Aquinas's Main Answer (Sedition is Always Mortal Sin):** His *Respondeo* argues:
      *   Sedition is directly opposed to the "unity of the people," which is a fundamental good ("bonum commune multitudinis").
      *   Since peace is necessary for virtue and opposing a fundamental good is grave, sedition is *always* a mortal sin.
      *   **The Logic:** Disrupting the unity *of a community ordered towards the common good* is inherently destructive. It's like attacking the foundation of social life itself. Therefore, *any act fitting this definition* is gravely sinful.

  4.  **Addressing the Objection (The Tyrant Exception):** Here's where it gets interesting. The *first objection* essentially says: "But what if the rulers are unjust? Isn't rebelling against *them* okay? So sedition can't *always* be a mortal sin."
      *   Aquinas **doesn't** say: "Oh, you're right, sedition is *sometimes* okay." Instead, he makes a crucial **definitional move**:
          *   He states: **"A tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler..."** (Regimen tyrannicum non est iustum, quia non ordinatur ad bonum commune, sed ad bonum privatum regentis...).
          *   **Therefore:** "...disturbing such a government does not have the character of sedition..." (...perturbatio huius regiminis non habet rationem seditionis...).
          *   **Except for Extreme Tyranny:** He adds a nuance: "...unless perhaps the tyrant's rule is disturbed so inordinately that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government." (...nisi forte sic inordinate perturbetur tyranni regimen quod multitudo subiecta maius detrimentum ex perturbatione consequatur quam ex tyranni regimine.). He then clarifies that the *ruler* inciting discord against subjects justly resisting him would actually be the seditious one.

  **How it Holds Together & Answers Your Questions:**

  1.  **Is it a real exception or a redefinition?** It's **absolutely a redefinition (categorical exclusion), NOT a moral exception.** Aquinas isn't saying, "Sedition is *usually* sinful, but overthrowing a tyrant is an exception where it's okay." He's saying: **"Acts opposing a *tyrant* (ruling for private good) *do not meet the definition of 'sedition' in the first place*."** Why? Because "sedition" *by his definition* is opposition to a *just* authority serving the *common good*. A tyrant isn't a just authority serving the common good; therefore, opposing him isn't "sedition" as Aquinas defines it here.
      *   **Is "sedition is always a mortal sin" vacuous?** **No.** Within the precise definition he established (rebellion against *just* authority for the *common good*), it *is* always a mortal sin. The statement holds true *because* he excludes opposition to tyranny from the category of "sedition." He's not being sneaky; he's being rigorously definitional. It's like saying "All trespassing on *private property* is illegal." If the land is actually public parkland, walking on it isn't "trespassing" by that definition, even though you're walking on land.

  2.  **What's the "extreme tyranny" qualifier doing?** This is crucial and often misunderstood. Aquinas isn't saying opposition to *lesser* tyranny *is* sedition. **The core principle stands:** Opposing *any* ruler who governs for private good, not the common good, *is not sedition*. The "extreme tyranny" clause adds a **prudential caveat about *method* and *consequences*:**
      *   Even though opposing a tyrant isn't *sedition*, the *way* you oppose him could be so reckless ("inordinately disturbed") that it causes *more harm* ("greater detriment") to the people than the tyranny itself.
      *   **Think of it this way:** You have a moral right to defend your home against an intruder (not sedition). But if you try to stop the intruder by setting your own house on fire, causing more damage than the intruder would have, *that* action is reckless and harmful. Similarly, a rebellion against a tyrant that plunges the nation into total chaos and civil war, causing more death and suffering than the tyrant did, could be morally problematic *not because it's sedition*, but because it violates prudence and charity (causing disproportionate harm). The qualifier emphasizes that *how* you resist matters, even when resistance is justified in principle.

  3.  **Relation to his "better-known caution":** You're likely thinking of passages like *De Regno* or *Summa* I-II, q.96, a.4, where Aquinas strongly cautions against *easily* overthrowing tyrants due to the risks of worse outcomes, the potential for usurpers to be worse, or the danger of undermining legitimate authority. **There's no fundamental tension, just a shift in emphasis:**
      *   **Here (q.42, a.2):** His primary goal is defining the *sin of sedition*. He needs to clarify that resistance to manifest tyranny isn't included in that sin. He states the *principle* clearly (tyranny = unjust; resisting it isn't sedition) and adds the *prudential caveat* about disproportionate harm.
      *   **In his cautionary passages:** His primary goal is to warn against *rash action* and highlight the *dangers and complexities* of rebellion. He emphasizes the high bar for *justified and prudent* action, building on the caveat he mentions briefly in q.42. He's saying, "Yes, it's not sedition *in principle*, but *in practice*, it's incredibly dangerous and should be a last resort." The core principle (tyranny lacks justice) remains consistent; the cautionary passages elaborate on the practical application of the caveat he included here.

  **In Summary:**

  *   Aquinas defines "sedition" **strictly** as rebellion against a *just* authority serving the *common good*. Opposing *that* is always a mortal sin.
  *   A tyrant, by definition (ruling for private good), is **not** a just authority. Therefore, opposing him is **not** "sedition" as defined. This is a definitional exclusion, not a moral exception.
  *   The "extreme tyranny" qualifier isn't about defining tyranny or limiting the principle that opposing it isn't sedition. It's a **prudential warning** that even justified resistance must avoid causing disproportionate harm.
  *   His later cautions about overthrowing tyrants elaborate on this prudential warning, emphasizing the high risks and the need for it to be a last resort, but they don't contradict the core principle established here: resistance to tyranny is not the sin of sedition.

  The passage holds together because Aquinas uses precise definitions consistently. He carves out tyranny *before* applying the label "sedition," ensuring the "always a mortal sin" claim remains logically sound within his specific framework. The "extreme tyranny" clause is the bridge to his more cautious practical advice found elsewhere.
