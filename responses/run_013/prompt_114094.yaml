answer: |-
  Here’s a structured analysis of open questions in interpersonal utility comparisons (IUC), tailored to your constraints. I prioritize questions based on **philosophical centrality**, **tractability from the armchair**, **neglect/crowding**, and **downstream impact on ethics/decision-making**. I flag settled points clearly and note where debates are unresolved.

  ---

  ### **Settled Ground (Widely Accepted)**
  1. **Ordinal intrapersonal comparisons are uncontroversial**: We can compare *one person’s* welfare across different states (e.g., "Alice prefers health to illness").  
  2. **IUC is indispensable for many ethical/political theories**: Utilitarianism, prioritarianism, and distributive justice *require* IUC. Skeptics (e.g., Robbins, Hayek) concede this but argue it invalidates those theories.  
  3. **No behavioral test suffices**: Revealed preference (e.g., market choices) cannot resolve IUC alone. Even if two people choose identically, their welfare levels may differ.  
  4. **Incomparability is conceptually possible**: Parfit’s "Repugnant Conclusion" and Chang’s work show that some lives *might* be neither better nor worse nor equally good.

  ---

  ### **Open Questions to Prioritize**  
  *(Ranked by your criteria)*

  #### **1. What is the *minimal* IUC required by a given ethical theory?**  
     - **Why prioritize?**  
       - **Directly upstream** of policy debates: Utilitarianism needs *cardinal* comparisons (to sum utilities), while sufficientarianism (e.g., Frankfurt) may only need *ordinal* comparisons (to identify who falls below a threshold). Rawlsianism avoids IUC but faces charges of incoherence without it.  
       - **Tractable**: Analyze theories’ formal structures (e.g., "Can prioritarianism avoid cardinal comparisons?"). No data needed.  
       - **Neglected**: Most literature focuses on whether IUC *can* exist, not what theories minimally presuppose.  
     - **Key move**: Map ethical theories to IUC "scales":  
       | Theory | Requires | Possible Scale |  
       |--------|----------|----------------|  
       | Utilitarianism | Cardinal, ratio-scale | ✖️ Feasible? |  
       | Prioritarianism | Cardinal, interval-scale | ⚠️ Contentious |  
       | Sufficientarianism | Ordinal | ✔️ More defensible |  
       | Libertarianism | None | ✔️ Trivial |  
     - **Tractability for you**: High. Requires conceptual analysis of primary texts (e.g., Parfit, Sen, Frankfurt).  
     - **Evidence to track**: New defenses of "imprecise" cardinalism (e.g., McCarthy’s *graded Pareto* arguments).

  #### **2. Is incomparability pervasive or rare?**  
     - **Why prioritize?**  
       - **Upstream of**: Practical decision-making (e.g., medical triage when lives seem incomparable) and value pluralism (Berlin, Chang). If incomparability is widespread, it undermines aggregative ethics.  
       - **Tractable**: Armchair-friendly arguments about cases (e.g., "Is a poet’s life comparable to a soldier’s?"). Engage with Chang’s *chaining argument* or Raz’s *incommensurability*.  
       - **Neglected**: Most IUC debates assume comparability is default; incomparability is underexplored outside value theory.  
     - **Key disagreement**:  
       - **Skeptics** (Chang): Many lives are "on a par" – neither better nor worse, yet comparable in some looser sense.  
       - **Optimists** (Hausman): Incomparability is rare; we can compare via "covering values" (e.g., health encompasses pain/pleasure).  
     - **Your angle**: Test your friend’s proposal against hard cases (e.g., lives with different *kinds* of goods: artistic fulfillment vs. familial joy). Does the "single person" test resolve these?

  #### **3. Does IUC require a *shared* scale, or is it agent-relative?**  
     - **Why prioritize?**  
       - **Upstream of**: Moral dilemmas (e.g., "Should I save my child or two strangers?"). If IUC is agent-relative, impartial ethics (e.g., utilitarianism) collapses.  
       - **Tractable**: Conceptual work on whether welfare is "perspectival" (e.g., Nagel’s *View from Nowhere*).  
       - **Crowded but pivotal**: The realism/anti-realism debate in meta-ethics touches this, but IUC’s role is under-theorized.  
     - **Key positions**:  
       - **Constructivists** (like your friend): IUC is agent-relative; we *create* comparisons through choices.  
       - **Realists** (e.g., Mooreans): Welfare facts exist independently; comparisons are discoveries.  
     - **Your opportunity**: Critically dissect your friend’s "single person" test:  
       - Does it assume *identity* matters? (If the "single person" retains her values, she may bias comparisons.)  
       - Does it conflate *choice* with *goodness*? (She might choose a worse life due to risk-aversion.)

  ---

  ### **Questions to Avoid (For Now)**  
  - **"Can we construct a cardinal scale?"**  
    Why avoid? Requires heavy decision theory (e.g., Harsanyi’s theorem) and empirical assumptions (e.g., von Neumann-Morgenstern utilities). Low tractability without data.  
  - **"Is IUC possible under preference skepticism?"**  
    Why avoid? Niche debate (e.g., Scanlon vs. hedonists). Low downstream impact unless you’re challenging welfare economics.  
  - **"Can neuroscience ground IUC?"**  
    Why avoid? Requires empirical data you lack; philosophically shallow without lab access.

  ---

  ### **How to Rank Questions Over Your 9 Months**  
  - **Move up** if:  
    - New papers defend "thin" comparability (e.g., Fleurbaey’s *fairness*-based approaches).  
    - Your supervisor identifies unresolved tensions in your ethical case studies.  
  - **Move down** if:  
    - Arguments become highly technical (e.g., axiomatic social choice).  
    - You find theorists *presupposing* IUC without argument (e.g., in effective altruism literature).

  ---

  ### **Recommended Starting Points**  
  1. **Core reading**:  
     - Chang, R. (ed.) *Incommensurability, Incomparability, and Practical Reason* (for incomparability).  
     - Hausman, D. *Preference, Value, Choice, and Welfare* (Ch. 9–10 on IUC).  
     - Parfit, D. *Reasons and Persons* (Sec. on the "Repugnant Conclusion").  
  2. **Narrow your lens**: Focus on **one ethical theory** (e.g., "Does sufficientarianism *need* only ordinal comparisons?").  
  3. **Engage your friend’s view**: Use it as a foil. Is it a form of **constructivism**? Does it collapse into **subjectivism**?

  This framework balances depth with feasibility. By targeting what ethical theories *require* and where comparisons break down, your paper can challenge assumptions in policy debates without new data—pure philosophy at its best.
