answer: |-
  Here’s a close reading of the passage, resolving the tension by following Marx’s internal logic step by step:

  ### 1. **The Core Tension & Resolution**  
     - **First Sentence (The Presupposition):**  
       *"Its presupposition is – and remains – the mass of direct labour time... as the determinant factor in the production of wealth."*  
       - **Argumentative Work:** Marx is defining capitalism’s **internal logic**. Under the *value-relation* (where wealth is measured by exchange-value), labor time is the irreplaceable foundation. Capital’s system of profit, wages, and exploitation *requires* labor time as its metric. This isn’t a description of reality but an exposition of capital’s operating principle.  
       - **Key Term:** "Presupposition" = a logical necessity for the system to function *as capitalism*.  

     - **Second Sentence (The Historical Shift):**  
       *"But to the degree that large industry develops, the creation of real wealth comes to depend less on labour time..."*  
       - **Argumentative Work:** Marx observes a **historical/material shift**. As machinery and science advance, *actual* productivity ("real wealth") increasingly stems from systemic forces (technology, science) that dwarf direct labor inputs.  
       - **Resolution:** **No contradiction.** The first sentence describes capital’s *theoretical framework*; the second describes *historical reality diverging from that framework*. Capitalism clings to labor-time valuation ("remains") while its own development makes this framework obsolete for actual wealth creation.  

  ---

  ### 2. **Key Term Clarifications**  
     - **"Real wealth" vs. "Value":**  
       - **Value (capitalist measure):** Quantified by socially necessary labor time. Tied to exchange and profit.  
       - **Real wealth:** Use-value abundance (goods, knowledge, social capacities). Under industrialism, this expands via science/machinery *independent* of labor time inputs.  
       - **Why it matters:** Capitalism conflates "value" with "wealth," but Marx shows them splitting apart. Real wealth grows while value relations strain.  

     - **"General state of science" vs. "Progress of technology":**  
       - **General state of science:** The accumulated body of scientific knowledge (a *social* product, not owned by capital).  
       - **Progress of technology:** The *application* of science to production (machinery, processes).  
       - **Relationship:** Science is the foundation; technology is its materialization. Marx links them ("or") to stress their unity in driving productivity *beyond* direct labor.  

     - **Scare-Quoted "Powerful Effectiveness"**:  
       - **Rhetorical Work:** Marx mocks capital’s perspective. Capital sees machinery as a "powerful" input *it owns*, but its true power comes from socially developed science, not capital itself. The quotes expose capital’s delusion of control.  
       - **Argumentative Work:** Highlights that machinery’s power is *disproportionate* to labor invested in *building* it. A machine’s value (labor-time to produce it) is tiny compared to the labor-time it *replaces* in use.  

  ---

  ### 3. **Why Capitalism Doesn’t "Collapse On Its Own"**  
     Your friend’s reading misses Marx’s dialectic:  
     - **The Crisis:** Capitalism’s *value system* (labor-time as measure) becomes a *fetter* on the *forces of production* (science/machinery). This causes crises (e.g., overproduction, falling profit rates), not collapse.  
     - **The Contradiction:** Capital depends on labor exploitation but develops systems that minimize labor. It can’t abandon labor-time valuation without abandoning itself.  
     - **Outcome:** Not automatic collapse, but intensified contradictions requiring *revolutionary resolution* – the system must be overthrown, not outgrown.  

  ---

  ### 4. **Argumentative Structure & Rhetorical Moves**  
     | **Phrase** | **Function** |  
     |------------|--------------|  
     | "The exchange of living labour for objectified labour..." | **Sets the stage:** Capitalism’s core relation (labor vs. capital). |  
     | "Its presupposition is – and remains – the mass of direct labour time..." | **Logical foundation:** Labor time as capital’s *necessary measure*. (Essential argument) |  
     | "But to the degree that large industry develops..." | **Pivot to historical shift.** (Core insight) |  
     | "depends less on labour time... than on the power of the agencies set in motion" | **Contradiction revealed:** Material reality vs. capitalist logic. (Key argument) |  
     | "whose 'powerful effectiveness'... depends on the general state of science" | **Critique of capital’s illusion:** Exposes social basis of productivity. (Rhetorical + analytical) |  

  ---

  ### **In Plain Terms**  
  Marx argues:  
  1. **Capitalism’s Rule:** It *must* treat labor time as the source of value to exist.  
  2. **Capitalism’s Development:** It unleashes forces (science/machinery) that make labor time irrelevant to actual wealth production.  
  3. **The Result:** Capitalism’s core logic clashes with its own achievements. The system is crippled by its success, not destroyed by it.  

  The passage isn’t a prediction of collapse but an exposé of capitalism’s growing irrationality. Your instinct is correct: the tension is intentional – it’s the heart of Marx’s critique.
