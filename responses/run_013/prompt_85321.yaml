  Below is a decision tree taxonomy for the precautionary principle, designed to reveal its diversity beyond simple weak/strong distinctions. The tree begins with a shared commitment: that a lack of decisive evidence about harm should sometimes constrain action. It branches through key distinctions (trigger, object, burden, standard, remedy), anchored in concrete cases. The 9-leaf structure distinguishes 8 recognizable positions (and 1 unnamed), with each leaf stating an awkward commitment. Unoccupied combinations and indistinguishable leaves are noted at the end.

  ### **Decision Tree Taxonomy of Precautionary Principles**  
  *(Start with the shared commitment: Lack of decisive evidence about harm can constrain action)*  

  1. **Is precaution primarily a way to shift the burden of proof?**  
     - *Yes* → Go to 2.  
     - *No* → Go to 3.  

  2. **Who bears the burden of proof?**  
     - **Proponent of the activity** (e.g., company seeking a deep-sea mining licence) → Go to 4.  
     - **Opponent or regulator** (e.g., communities fearing harm from mining) → **Leaf: Unnamed (Burden on opponent/regulator)**  
       *Awkward commitment: Allows activities to proceed until opponents prove harm, risking irreversible damage (e.g., seafloor destruction) before evidence is gathered.*  

  3. **Is precaution primarily an epistemic attitude toward evidence?**  
     - *Yes* → Go to 9.  
     - *No* → Go to 5.  

  4. **What standard of proof must the proponent meet?**  
     - **High** (beyond reasonable doubt; e.g., prove gene drive *cannot* cross species) → **Leaf: Strong burden-shifting precaution**  
       *Awkward commitment: Blocks beneficial activities (e.g., malaria prevention) if safety can’t be proven to an almost impossible standard.*  
     - **Moderate** (clear and convincing evidence; e.g., show mining recovery is *likely* fast) → **Leaf: Burden-shifting precaution (moderate)**  
       *Awkward commitment: Permits activities (e.g., mining) if proponents supply inconclusive evidence, potentially underestimating harm.*  

  5. **Does the rule regulate actions or decision procedures?**  
     - **Decision procedures** (e.g., choosing how to decide on stratospheric aerosols) → **Leaf: Meta-precautionary view**  
       *Awkward commitment: Risks infinite regress by applying precaution to the choice of decision rules themselves.*  
     - **Actions** (e.g., banning/deploying aerosols) → Go to 6.  

  6. **What level of evidence triggers precaution?**  
     - **Bare possibility** (any conceivable harm; e.g., rodent assay signal for cosmetics) → Go to 7.  
     - **Plausible mechanism** (scientifically credible pathway; e.g., gene drive cross-species risk) → Go to 8.  
     - **Non-negligible probability** (>minimal threshold; e.g., 1% chance of psychiatric drug side effects) → Go to 10.  

  7. **Remedy for bare possibility?**  
     - **Moratorium** (ban until proven safe) → **Leaf: Strong precautionary ban**  
       *Awkward commitment: Prohibits activities (e.g., cosmetics) based on purely speculative risks, ignoring forgone benefits.*  

  8. **Remedy for plausible mechanism?**  
     - **Adaptive management** (deploy with monitoring; e.g., gene drive field trials) → **Leaf: Weak precautionary filter (adaptive)**  
       *Awkward commitment: Allows harm to occur during monitoring (e.g., non-target species extinction) if safeguards fail.*  

  9. **Trigger for epistemic precaution?**  
     - **Plausible mechanism or stronger** (e.g., gene drive cross-species risk) → **Leaf: Epistemic precaution**  
       *Awkward commitment: Permits risky research (e.g., gene drive labs) that could accidentally cause the harm deployment would prevent.*  

  10. **Remedy for non-negligible probability?**  
      - **Safety margin** (buffer against harm; e.g., extra drug trials) → **Leaf: Ordinary cost-benefit analysis with safety margin**  
        *Awkward commitment: Allows activities (e.g., psychiatric drugs) with low-probability catastrophic risks if margins make expected net benefits positive.*  
      - **Directed research** (study before deployment; e.g., deep-sea mining impact studies) → **Leaf: Weak precautionary filter (research)**  
        *Awkward commitment: Delays beneficial activities (e.g., battery production) for years to research implausible harms.*  

  ---

  ### **Cases Anchoring Key Branches**  
  - **Gene drive**: Trigger = plausible mechanism (cross-species risk); tests burden shifting (4), epistemic precaution (9), and adaptive remedies (8).  
  - **Deep-sea mining**: Trigger = non-negligible probability (unknown recovery); tests burden shifting (2,4), research remedies (10), and safety margins (10).  
  - **Cosmetic ingredient**: Trigger = bare possibility (weak rodent assay); tests strong bans (7).  
  - **Stratospheric aerosols**: Trigger = signal of irreversible harm; tests meta-precaution (5).  
  - **Psychiatric drug**: Trigger = non-negligible probability (unknown long-term effects); tests safety margins (10).  

  ---

  ### **Notes on the Tree**  
  1. **Indistinguishable leaves**:  
     - The tree *cannot* separate two variants of the weak precautionary filter (adaptive vs. research) when trigger = non-negligible probability and remedy = adaptive management. These converge pragmatically.  

  2. **Unoccupied combinations**:  
     - **Bare possibility + adaptive management** (e.g., cosmetics with monitoring): *Unattractive*—Monitoring speculative risks is inefficient.  
     - **Plausible mechanism + moratorium** (e.g., gene drive ban): *Unexplored*—Rarely advocated; conflates mechanism with probability.  
     - **Burden on proponent + low standard of proof**: *Unattractive*—Too permissive to qualify as "precaution."  
     - **Epistemic precaution + bare possibility trigger**: *Incoherent*—Demanding skepticism toward pure speculation undermines evidence-based governance.  

  3. **Omissions**:  
     - "Signal of irreversible harm" (e.g., aerosols) only appears in meta-precaution; other branches treat irreversibility implicitly via remedies (e.g., moratorium in 7).  
     - "Object of precaution" distinctions (activity, technology, uncertainty, harm distribution) are absorbed into trigger/remedy choices for parsimony.  

  ---

  ### **Tree Summary**  
  | **Leaf Position**                          | **Key Features**                                                                 |  
  |--------------------------------------------|----------------------------------------------------------------------------------|  
  | Strong burden-shifting precaution          | Proponent must prove safety beyond reasonable doubt (e.g., gene drive)           |  
  | Burden-shifting precaution (moderate)      | Proponent must show clear evidence of safety (e.g., mining licence)              |  
  | Unnamed (Burden on opponent/regulator)     | Activity allowed until opponents prove harm (e.g., mining by default)            |  
  | Meta-precautionary view                    | Precaution governs decision procedures, not outcomes (e.g., aerosol governance)  |  
  | Strong precautionary ban                   | Moratorium for bare-possibility risks (e.g., cosmetic ingredient ban)            |  
  | Weak precautionary filter (adaptive)       | Adaptive management for plausible mechanisms (e.g., gene drive trials)           |  
  | Epistemic precaution                       | Restricts deployment, allows research for plausible risks (e.g., gene drive labs)|  
  | Ordinary cost-benefit with safety margin   | Safety margin for non-negligible risks (e.g., psychiatric drug)                  |  
  | Weak precautionary filter (research)       | Directed research for non-negligible risks (e.g., deep-sea mining studies)       |  

  This tree clarifies that "precaution" is a contested space where disagreements about triggers, remedies, and burdens define distinct positions—not a monolithic doctrine. Use the cases to test where students’ intuitions land on the branches!
