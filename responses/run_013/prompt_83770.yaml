prompt: |-
  I'm moderating a Q&A next month with a visiting speaker who defends the fitting-attitude account of value, and who reckons the whole 'wrong kind of reasons' fuss can be disolved by saying that the demon's threat only ever gives you a reason to *want* to admire him, never a reason to admire him. I want a run of questions that makes that move progressively harder to keep making. Give me at least one each on: why the demon case is meant to be trouble for the account at all; her want/attitude split (if wanting to admire is itself an attitude, why isn't it just as vulnerable to the demon?); a pill that makes you admire him sincerely, with no instrumental angle; and whether the same structure shows up for belief, where the demon threatens you unless you believe some false thing. For every question, add the follow-up keyed to the answer she's most likely to give. Nothing about how she got into philosophy. Start straight in with the questions — sharpest one first, no preamble, no 'here are some questions'. British English please.
reasoning: |-
  Okay, the user is moderating a Q&A with a philosopher who defends the fitting-attitude account of value and thinks the "wrong kind of reasons" problem can be solved by distinguishing between reasons to admire versus reasons to *want* to admire. They want sharp questions to challenge this position, specifically on four points: why the demon case troubles FA accounts, the want/attitude distinction, a sincerity pill scenario, and parallels in belief cases. 

  First, I need to understand the core tension. The speaker's move tries to quarantine instrumental reasons ("admire me or I'll hurt you") as merely affecting our *desire* to admire, not the admiration itself. But this feels slippery—surely threats can directly warp attitudes if internalized? 

  For the demon question, I'll attack head-on: if the demon's threat doesn't give reason to admire, why does it intuitively feel like it does? Her likely reply ("it only pressures wanting") invites a follow-up about psychological spillover—can we really compartmentalise so neatly? 

  The want/attitude split is delicate. If wanting to admire is itself an attitude, why isn't *it* vulnerable to demonic distortion? She might call it "second-order," but then the follow-up must press why hierarchy insulates it from corruption. 

  The pill scenario removes instrumental layers: if a pill forces sincere admiration, doesn't that collapse her distinction? If she denies this is a "reason," the follow-up should force her to define "reason" without circularity. 

  Finally, belief cases are lethal because we *do* think evidence alone justifies belief. If she claims threats only give reason to *want* to believe, the follow-up highlights how alien that sounds compared to actual epistemic practice. 

  User’s tone suggests they want forensic dismantling, not curiosity. British phrasing ("whilst", "precisely") keeps it crisp. No fluff—each question is a scalpel.
answer: |-
  Here are your targeted questions, designed as progressive challenges to the 'want/attitude' defence against the Wrong Kind of Reasons (WKR) problem for Fitting-Attitude (FA) accounts, in British English:

  1.  **Sharpest First (Core Trouble):** "If the fittingness of admiration *just is* there being reasons *to admire*, why does the demon threatening punishment for *not* admiring him seem to generate a powerful reason *for* admiring him – precisely the counter-intuitive result the WKR problem highlights for FA accounts? Doesn't this show the account conflates normative force with mere psychological pressure?"
      *   *Likely Reply:* "The threat only gives a reason to *want* to admire him or to *bring it about* that you admire him, not a genuine reason *to admire* him itself."
      *   **Follow-up:** "But doesn't the subject experiencing the threat typically report feeling they *have* a reason *to admire* the demon to avoid punishment? If FA analyses value *in terms* of reasons for pro-attitudes, and ordinary agents conflate these 'kinds' of reasons under threat, doesn't that suggest FA struggles to capture the very normative concept it aims to define? Isn't its susceptibility to this conflation a fundamental flaw?"

  2.  **Want/Attitude Vulnerability:** "You distinguish reasons *to admire* (fittingness) from reasons *to want to admire* (instrumental). But 'wanting to admire' is itself a pro-attitude – a desire. Why isn't *this* attitude equally vulnerable to demonic threats? Couldn't the demon just as easily threaten punishment unless you *want to admire* him? Doesn't this simply push the WKR problem one level up?"
      *   *Likely Reply:* "'Wanting to admire' is a second-order attitude *about* admiration. The fittingness conditions for desires differ; a reason to *want* to admire might be instrumental, whereas a reason *to admire* must speak to the demon's actual admirability."
      *   **Follow-up:** "But doesn't the FA account analyse *all* value ultimately in terms of reasons for pro-attitudes? If reasons to *want* to admire can be generated by demonic threats without implying value, why can't reasons *to admire* similarly be generated by threats without implying *fittingness*? What inherent property of the 'admire' attitude *insulates* its fittingness reasons from instrumental distortion in a way that the 'want' attitude lacks?"

  3.  **The Sincerity Pill:** "Imagine the demon offers a pill that bypasses wanting: it *directly and sincerely* causes you to admire him – no conscious instrumental reasoning involved. Taking the pill avoids punishment. Isn't refusing the pill now irrational? And crucially, doesn't the demon's threat seem to provide a decisive reason *to take the pill* – that is, a reason *to bring it about that you admire him*? Doesn't this collapse your distinction, showing the threat *does* generate a reason directly related to the attitude (making it occur), even if not fittingness?"
      *   *Likely Reply:* "The reason is still to *take the pill* (an action), not to admire him. The admiration caused is sincere, but the reason for causing it remains instrumental punishment-avoidance, not fittingness."
      *   **Follow-up:** "But the *only* point of taking the pill is to acquire the attitude. If the instrumental reason to *acquire the attitude* is overwhelming and rationalises the action, why insist it doesn't constitute *any* kind of reason *concerning the attitude itself*? Doesn't the FA theorist now owe us an explanation for why reasons to *cause* an attitude are fundamentally different from reasons *for* the attitude that avoids being entirely stipulative?"

  4.  **The Belief Parallel:** "Let's apply your model to belief. The demon threatens punishment unless you *believe* 2+2=5. You'd say this only gives a reason to *want* to believe it, or to cause yourself to believe it, but never a reason *to believe* it (which requires evidence). Yet, we readily accept that epistemic reasons (evidence) are categorically different from pragmatic threats – evidence gives genuine reasons *to believe*, threats don't. Why, in the *value* case, is the distinction between fittingness reasons and instrumental reasons for attitudes like admiration seen as problematic (WKR), whilst the analogous distinction for belief seems entirely unproblematic?"
      *   *Likely Reply:* "Belief is constitutively aimed at truth; it has a 'correctness condition' (truth) built-in. Pro-attitudes like admiration lack this single, objective standard; their fittingness is more complex, hence the confusion."
      *   **Follow-up:** "But doesn't the FA account *aim* to provide an objective standard for value via fittingness? If the belief case cleanly separates pragmatic reasons (threats) from genuine reasons for belief (evidence) due to belief's constitutive aim, why can't the FA theorist similarly argue that admiration has a constitutive aim (tracking genuine admirability) that *should* cleanly separate fittingness reasons from instrumental ones? Doesn't the persistence of the WKR problem suggest FA struggles to establish this constitutive norm for value attitudes as robustly as truth is for belief?"

  **Key Strategy:** These questions force the speaker to defend the *stability* and *non-arbitrariness* of the boundary she draws between reasons *for* an attitude (fittingness) and reasons *concerning* the attitude (wanting/causing it). The follow-ups target potential weaknesses: the phenomenology of reasons under threat, the vulnerability of higher-order attitudes, the direct causal link to the attitude via the pill, and the contrast with the seemingly clearer case of belief. The aim is to show that maintaining the distinction requires increasingly ad-hoc or question-begging moves in the face of these variations. Good luck with the Q&A!
