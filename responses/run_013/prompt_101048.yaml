  ### Examination Question

  **Concept Learning and Inductive Inference**  
  **Final Examination**  
  **Time Allowed: 45 minutes**  
  **Total Marks: 20**  

  #### Background
  This question uses a textual "Bongard-style" problem. You are given six strings divided into two groups:  
  - **Left-hand cards (positive examples)**: `AB`, `AABB`, `AAABBB`  
  - **Right-hand cards (negative examples)**: `ABA`, `ABBA`, `AABAA`  

  A "rule" (or "concept") is a hypothesis that classifies strings as positive (left) or negative (right). The goal is to infer the intended rule governing this classification.  

  #### Tasks  
  Answer **all** parts of this question. Write concisely and precisely.  

  (a) **State two distinct rules** that correctly classify all six strings (i.e., the left-hand strings as positive and the right-hand strings as negative). *(4 marks)*  

  (b) **Compare the simplicity** of your two rules. Which rule, if either, is simpler? Justify your answer with explicit reasoning about what makes one hypothesis "simpler" than another. *(3 marks)*  

  (c) **Explain why the examples alone** do not logically determine which rule is the intended concept. Your answer should address the *underdetermination* of hypotheses by the data. *(3 marks)*  

  (d) **Propose a new string** (not in the original six) that would force a choice between your two rules.  
  - (i) State the string.  
  - (ii) Explain how each rule classifies it and what this would reveal about the intended concept.  
  - (iii) Briefly discuss why this new string is not a "neutral" test of the concept. *(4 marks)*  

  (e) **Discuss inductive biases**: What assumptions would a Bayesian or minimum-description-length (MDL) model need to make to prefer the rule that a human solver would naturally select? Focus on how these models formalize "simplicity" or "naturalness." *(3 marks)*  

  (f) **Reflection**:  
  - (i) Explain the difference between a rule that is *extensionally adequate* (i.e., fits the examples) and one that *captures the intended concept*.  
  - (ii) Why does the act of proposing a new test string (as in part (d)) rely on theoretical assumptions? *(3 marks)*  

  ---

  ### Model Answer (Approx. 700 words)  

  (a) Two rules that correctly classify all six strings are:  
  - **Rule 1 (Symmetry-based)**: A string is positive if and only if it is *asymmetric* (i.e., it is not equal to its reverse).  
  - **Rule 2 (Run-based)**: A string is positive if and only if it consists of *one or more 'A's followed by one or more 'B's* (e.g., it matches the pattern `A+B+`).  

  **Justification**:  
  - **Rule 1**:  
    - Left (positive): `AB` → reverse is `BA` (≠ `AB`); `AABB` → reverse `BBAA` (≠ `AABB`); `AAABBB` → reverse `BBBAAA` (≠ `AAABBB`). All asymmetric.  
    - Right (negative): `ABA` → reverse `ABA` (= original); `ABBA` → reverse `ABBA` (= original); `AABAA` → reverse `AABAA` (= original). All symmetric.  
  - **Rule 2**:  
    - Left (positive): `AB` (A then B); `AABB` (AA then BB); `AAABBB` (AAA then BBB). All match `A+B+`.  
    - Right (negative): `ABA` (A, B, A → B followed by A); `ABBA` (A, B, B, A → A after B); `AABAA` (AA, B, AA → A after B). None match `A+B+`.  

  (b) **Rule 2 is simpler**. Simplicity is evaluated here via *computational parsimony*: a hypothesis requiring fewer operations or less structural complexity to verify is simpler.  
  - **Rule 2** checks a *local, linear pattern*: scan left-to-right for A’s, then B’s, with no regression (e.g., a two-state finite automaton suffices).  
  - **Rule 1** checks a *global, relational property*: compare each character to its mirror position, requiring storage/comparison of the entire string (e.g., a pushdown automaton or iterative reversal).  
  Thus, Rule 2 is simpler because it avoids holistic computation and depends only on immediate transitions.  

  (c) The examples **underdetermine** the intended rule. Both Rule 1 and Rule 2 perfectly fit the data, yet they generalize differently to unseen strings. No logical entailment forces one rule over the other because:  
  - The dataset is finite and consistent with infinitely many hypotheses (e.g., rules based on string length, character counts, or ad hoc lists).  
  - The positive examples share *multiple* properties (asymmetry *and* A-then-B runs), so either property alone suffices for extensional adequacy. This illustrates the *problem of induction*: data alone cannot specify which generalization is "correct" without prior constraints.  

  (d) **Test string**: `BA`  
  - **(i) Classification**:  
    - **Rule 1**: `BA` reversed is `AB` (≠ `BA`) → asymmetric → **positive (left)**.  
    - **Rule 2**: Starts with ‘B’ (not ‘A’) → violates `A+B+` → **negative (right)**.  
  - **(ii) Revelation**: If `BA` is positive, Rule 1 is favored; if negative, Rule 2 is favored. This discriminates because the rules *contradict* on `BA`.  
  - **(iii) Non-neutrality**: Choosing `BA` presupposes the two candidate rules. A rule focusing on *character frequency* (e.g., "more A’s than B’s") would not be tested by `BA`, showing that test design is theory-laden.  

  (e) **Bayesian/MDL assumptions**: To prefer Rule 2 (the "natural" human choice), models must assume:  
  - **Bayesianism**: Simpler hypotheses (e.g., shorter description length, lower parametric complexity) have higher *prior probability*. Rule 2’s automaton requires fewer states than Rule 1’s reversal, so it merits a stronger prior.  
  - **MDL**: The "best" hypothesis minimizes the sum of (1) the code length for the rule and (2) the code length for the data given the rule. Rule 2 has a shorter description (e.g., "A’s then B’s" vs. "not palindromic") and efficient data encoding (no reversal computation), lowering total cost.  
  Both models *bias* toward simplicity to resolve underdetermination, assuming it correlates with truth.  

  (f) **(i) Extension vs. concept**: An extensionally adequate rule fits observed data (e.g., both Rules 1 and 2 work for the six strings). Capturing the *concept* means matching the *intended generalization* (e.g., the rule the designer mentally projects to all strings).  
  **(ii) Test non-neutrality**: Proposing a test string (e.g., `BA`) assumes which hypotheses are plausible (here, Rules 1 and 2). If we prioritized other rules (e.g., "strings without ‘BA’ substrings"), `BA` would be irrelevant. Thus, tests are embedded in a *theoretical framework* defining "reasonable" hypotheses.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **A-Grade (17–20)**: Distinguishes underdetermination from ambiguity; proposes a discriminating test string; articulates substantive simplicity (e.g., computational/descriptive complexity); connects test design to theory-ladenness; avoids stock Hume recitals.  
  **B-Grade (13–16)**: Correct but superficial; e.g., vaguely cites "simplicity" without analysis; identifies underdetermination but misses its depth; test string discriminates but non-neutrality is unaddressed.  

  #### Part (a): Two correct rules (4 marks)  
  - 2 marks per rule: 1 for stating it, 1 for justifying all six classifications.  
  - *Deduct 1 per rule* if misclassifies ≥1 example.  

  #### Part (b): Simplicity comparison (3 marks)  
  - 1: Clear preference; 2: Justification invoking computational/structural criteria.  
  - *Deduct 2* for unsupported claims (e.g., "Rule 2 is simpler because it’s obvious").  

  #### Part (c): Underdetermination (3 marks)  
  - 1: Both rules fit; 1: No logical entailment; 1: Finite data permits alternatives.  
  - *Deduct 2* if conflates with ambiguity or claims data "supports both equally" without logical underdetermination.  

  #### Part (d): Test string (4 marks)  
  - 1: Valid new string; 1: Correct classification per rule; 1: Forces choice; 1: Non-neutrality discussed.  
  - *Award 0* if the string fails to discriminate (e.g., `AAA` is negative under both).  

  #### Part (e): Bayesian/MDL (3 marks)  
  - 1: Simplicity as prior/code length; 1: Applies to the rules; 1: Explicit assumption (e.g., "simplicity correlates with truth").  
  - *Deduct 1–2* if detached from the example.  

  #### Part (f): Reflection (3 marks)  
  - 1: Extension vs. concept; 1: Test relies on hypotheses; 1: Theory-ladenness.  
  - *Deduct 1* per omitted element.  

  #### Common Mistakes (Deductions)  
  - **−2**: Assumes examples entail one rule (e.g., "Rule 2 is forced by the data").  
  - **−2**: Confuses psychology (what humans prefer) with normativity (what is warranted).  
  - **−1–2**: Proposes non-discriminating test string.  
  - **−1**: Treats simplicity as self-evident without analysis.
