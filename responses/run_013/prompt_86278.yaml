prompt: |-
  You're a philosopher who works across game theory and epistemology — happy with probability, with the norms of belief, and with the wierd places where the two meet. Take your time with this; it's a drafting job, not a summary job.

  I've been runnning a small reading group that spent a term chewing on the common prior assumption, and two of us have been going at each other since week two. One side — call them the consistency people — reckons the common prior isn't a psychological claim about us at all. It's a coherence requirement on rational belief: if two agents are commonly known to be rational, share a prior, and each knows the other's credence, they can't keep on disagreeing. Any apparent case of persistent rational disagreement has to trace back to hidden information, a failure of common knowledge, or the two of them quietly conditioning on different events. The other side — the irreducible-disagreement people — thinks that's a reductio rather than a result: two people with the same evidence can rationally sit at different credences indefinitely, and the theorem shows the assumption is false, not that the disagreement is a mistake.

  Two wrinkles I want built in, because I think that's where the fight actually lives. First: a bounded agent who isn't sure what her own beliefs commit her to — she's uncertain about the logical and probabilistic consequences of things she already accepts. Does a common prior even make sense for someone like that, and does common knowledge of rationality mean anything for her? Second, the diachronic version: can one agent rationally predict that her future self will rationally end up at a different credence, and if so, does the argument break the same way?

  What I want is the document an adversarial collaboration between these two would produce, done in good faith — the joint statement they could both actually sign. Start by brainstorming the candidate points of agreement and the candidate cruxes, and bin anything vacuous or slanted before you draft a word.

  Then give me: a numbered list of agreed claims — about the formalism, about what needs explaining, about what the theorem does and doesn't establish, and about the bounded-agent and future-self cases. Then a disagreements table, one row per genuine disagreement, each side's position written in wording that side would accept, the crux underneath it, and for each crux a concrete case or argument both sides agree would bear on it, with each side's prediction written down in advance. I suspect one crux is whether the common prior is a norm or an empirical hypothesis, and another is whether willingness to bet is the right test at all — but tell me if those are really the live ones. If part of their quarrel is just verbal, if they're using 'rational' or 'prior' in different senses, say which part and why.

  No citations, no reading list, nothing that needs a library. I want the formulations sharp enough that neither of them can wriggle out of their own row.
