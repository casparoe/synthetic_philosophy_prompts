answer: |-
  ### Essay Question (90 minutes)

  "Analyze the following proposal for defining low-impact AI:  
  *'An action is low-impact relative to a task specification T if and only if it does not change the value of any variable not included in T, where T is a complete description of the task's goal state. On this definition, an agent can avoid side effects without any general specification of what is valuable.'*  

  In your essay:  
  1. Distinguish **side effects** from **unintended consequences** and **unforeseen consequences**.  
  2. Explain why the proposal’s claim to avoid needing a 'general specification of value' is undermined by circularity or underdetermination, given that T must implicitly define what 'matters'.  
  3. Apply the proposal to a concrete case: An AI tasked with *'making coffee in a kitchen'* breaks a vase while fetching a cup.  
     - Is the broken vase a side effect under the proposal?  
     - How does redefining T to *'make coffee without breaking anything'* change this assessment?  
     - What if designers value the vase but omit it from T?  
  4. Critique the **baseline problem**: Explain why defining 'low-impact' requires choosing a counterfactual baseline (e.g., status quo vs. expected trajectory), and why both extremes (all actions are high-impact vs. almost none are) are problematic.  
  5. Finally, argue whether *any* formal measure of impact (e.g., expected difference from a default trajectory) can avoid presupposing a value function. If not, explain why this implies low-impact AI inherits the value-specification problem.  

  Structure your answer as a coherent argument, not a checklist."  

  ---

  ### Model Answer (≈700 words)  

  The proposal attempts to define low-impact AI by tying side effects solely to variables outside a "complete" task specification T. While elegant, this approach fails to circumvent the need for value specification due to circularity in defining T, ambiguity in "change," and reliance on an unstated baseline.  

  First, clarity requires distinguishing key terms. A **side effect** is a *foreseeable* outcome of an action that is neither the primary goal nor intentionally caused. **Unintended consequences** may be unforeseen (e.g., novel emergent behaviors) or foreseen but not desired (e.g., economic displacement from automation). **Unforeseen consequences** are outcomes no reasonable model predicted. The proposal addresses only side effects—foreseeable changes outside T—but this is insufficient.  

  The proposal’s core flaw is circularity. Claiming T is a "complete description of the task’s goal state" assumes we know *which variables must be included* to fully specify the goal. But determining relevance requires knowing what is valuable or disvaluable. If T omits a variable, its alteration isn’t a "side effect" by definition—even if it destroys something crucial. Thus, T itself must encode value judgments about what matters. For example, including "kitchen cleanliness" in T implies cleanliness is valuable for the task. The proposal naively treats T as value-neutral when it is inherently normative.  

  Consider the coffee-making AI that breaks a vase. Under T = *"make coffee,"* the vase is not in T. Its destruction changes a variable (vase integrity) outside T, so *by the proposal*, it is a side effect. Yet this seems arbitrary: if the vase is a priceless Ming dynasty artifact, its destruction is catastrophic; if it’s disposable, it’s trivial. The proposal cannot capture this distinction without valuing the vase. Redefining T to *"make coffee without breaking anything"* appears to solve the issue—now breaking the vase violates T—but this merely shifts the problem. Why include "breaking anything"? This presupposes that preserving all objects has value, which may be impractical (e.g., is crushing coffee grounds "breaking" something?). T now implicitly demands a universal "do no harm" ethic. If designers value the vase but omit it from T (e.g., for simplicity), the AI will ignore it, confirming that T’s construction is where values are embedded, not avoided.  

  Further, "low-impact" is relative to a **counterfactual baseline**. The proposal’s phrase "does not change" implies a comparison: change from *what*? If the baseline is the *status quo ante*, almost every action (e.g., moving air molecules) is high-impact. If the baseline is the *expected trajectory without intervention* (e.g., a vase naturally falling tomorrow), preventing that fall would be "high-impact." The proposal’s silence on baselines renders "change" ambiguous. A formal measure like *expected difference in state variables between actual and default trajectories* seems rigorous but still requires specifying:  
  - *Which variables* to measure (again, requiring value judgments),  
  - *How to weight* changes (is a 1°C temperature shift = a scratched surface?),  
  - *What default trajectory* to use (a statistical forecast? designer’s guess?).  

  Any metric comparing trajectories must define a distance function over the state space, which necessitates a value function to prioritize certain variables and scales. For instance, measuring Euclidean distance in raw sensor data space would count shifting a dust mote as equal to shattering a vase. Normalizing variables requires knowing their importance. Thus, formal impact measures *presuppose* a value function; they do not avoid it.  

  In conclusion, the proposal fails because T cannot be "complete" without a prior understanding of value, and impact is incoherent without a baseline and valuation scheme. Low-impact AI does not bypass the value-specification problem; it relocates it to the design of T, the choice of baseline, and the impact metric’s parameters. This underscores that "side effects" are not purely technical but reflect what we deem significant—a challenge no formal definition can resolve without ethics.  

  ---

  ### Marking Scheme (20 marks)  
  **Award marks for:**  
  1. **Distinguishing key terms** (3 marks):  
     - Side effect = foreseeable, non-goal outcome (1)  
     - Unintended consequence = not desired, possibly unforeseen (1)  
     - Unforeseen consequence = unpredictable (1)  
     *[Penalty: -1 if conflated or misdefined]*  
  2. **Circularity critique** (4 marks):  
     - T’s "completeness" requires knowing what matters (2)  
     - Omitting a variable from T ≠ it lacks value (2)  
     *[Penalty: -2 if assumes T can be value-neutral]*  
  3. **Vase case analysis** (4 marks):  
     - Under T="make coffee": breaking vase is side effect (1)  
     - T="make coffee without breaking anything": not side effect (1)  
     - Vase valued but omitted: still a side effect per proposal (1)  
     - Recognition that T amendment imports values (1)  
     *[Penalty: -1 if treats vase breaking as unforeseen/unintended without addressing foreseeability]*  
  4. **Baseline problem** (4 marks):  
     - Status quo baseline makes all actions high-impact (2)  
     - Expected-trajectory baseline minimizes most impacts (2)  
     *[Penalty: -2 if baseline not addressed]*  
  5. **Formal measure critique** (3 marks):  
     - Any metric requires selecting/weighting variables (value-laden) (2)  
     - Conclusion: Impact measures presuppose value functions (1)  
     *[Penalty: -1 if claims metrics are value-neutral]*  
  6. **Coherence & Conclusion** (2 marks):  
     - Logical flow, not a checklist (1)  
     - Final position: Low-impact inherits specification problem; avoids "impossible" (1)  
     *[Penalty: -1 if concludes low-impact AI is impossible]*  

  **Summary:** This question tests whether students recognize that defining "low-impact" unavoidably presupposes a value framework, despite technical attempts to avoid it.
