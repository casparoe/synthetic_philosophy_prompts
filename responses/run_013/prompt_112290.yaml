  2. Then he flips the whole thing: it's actually the tyrant who's the real seditionist, since he's the one sowing discord in the community to keep his grip on power. So the person resisting him is defending the peace, and the guy on the throne is the one committing sedition.

  Can you write a joke that lands on that structure? Ideally in the form of one of those scholastic quaestio things — a question, a couple of objections, a sed contra, a respondeo, and then some replies — with the real punch sitting in the respondeo or in one of the replies. It should be funny to someone who's actually read the article, not just to someone who knows Aquinas as a name. Keep it short, and please no made-up quotes from him, those always read as cringe.
