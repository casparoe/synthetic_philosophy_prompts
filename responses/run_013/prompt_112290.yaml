answer: |-
  Here's a joke structured as a Scholastic *quaestio*, playing directly on the paradoxes you highlighted:

  **Quaestio: Whether He Who Disturbs a Tyrant Sins by Sedition?**

  **Objection 1:** It seems that he does. For the Apostle Paul says (Romans 13:2), "Whoever resists the authority resists what God has appointed." Therefore, disturbing any established ruler, even a tyrant, is resistance to authority and thus sedition.

  **Objection 2:** Further, sedition is defined as disturbing the peace of the community. Toppling a ruler, however tyrannical, inevitably causes civil strife, tumults, and the shedding of blood. Therefore, such disturbance is intrinsically seditious.

  **Sed Contra:** The Philosopher says in the *Politics* that a tyrant rules not for the common good but for his own private advantage. Therefore, his rule is not a true authority ordained for peace but a perversion thereof. Consequently, he who disturbs the tyrant does not disturb true authority or true peace, but rather a counterfeit.

  **Respondeo Dicendum:** It must be said that sedition is a sin precisely *because* it disturbs the order directed to the common good. The government of a tyrant, however, is *not* ordered to the common good but to the tyrant's private cupidity. Therefore, disturbing a *tyrant's* government does not, in itself, constitute the sin of sedition at all, for one cannot disturb an order that does not exist.

  *However*, it follows that such disturbance may only be licit if the resulting state of affairs is judged to be more conducive to the common good than the prior tyranny. If the disturbance leads to greater evils – say, prolonged civil war, the rise of a worse tyrant, or the utter ruin of the polity – then the act of disturbance, though not seditious *in intent* against true order, nevertheless becomes sinful *in effect* due to its disastrous consequences for the people. Conversely, if the outcome is a more just regime and greater peace, the act was not only licit but virtuous.

  **Ad 1:** The Apostle speaks of *true* authority ordained for the common good. The tyrant, lacking this just ordering, lacks legitimate authority. Resisting him is not resisting God's ordinance, but resisting its perversion.

  **Ad 2:** While disturbance is caused, this is not the sin of sedition *against true peace*. Rather, the true *fount* of sedition is the tyrant himself. For by ruling unjustly, sowing discord among his subjects to weaken them, inciting factions, and perpetrating violence against the common good to maintain his illicit power, **the tyrant is the principal seditionist.** He is the one actively disturbing the true peace and unity of the community. Therefore, the one who resists him is not introducing sedition, but is in fact *suppressing the ongoing sedition perpetrated by the tyrant*. His act is one of restoring order, not disturbing it.

  **Reply to the Main Argument:** Hence, concerning the original act of disturbing the tyrant: **You haven't actually *committed* the sin of sedition... yet. Please hold while we gather data on the next regime's performance.** Whether you are a liberator or a criminal is a matter for the historical auditors. In the meantime, the fellow on the throne with the crown and the army? *He's* the one actively disturbing the peace. Your job was just... incident reporting.

  ---

  **Why it lands on your points:**

  1.  **Retroactive Morality:** The core joke is in the *Respondeo* and the "Reply to the Main Argument". The act isn't judged sinful *as sedition* at the moment of commission because the target isn't legitimate authority. BUT, its *overall* morality hinges entirely on future outcomes ("pending historical review"). The bureaucratization of morality ("Please hold... historical auditors") highlights the absurdity of this retrospective judgment.
  2.  **The Flip (Tyrant as Seditionist):** This is the punchline in the reply to Objection 2. The key reversal is stated clearly: "**the tyrant is the principal seditionist**." The joke reinforces this by contrasting the resistor's act ("incident reporting") with the tyrant's ongoing crime ("actively disturbing the peace").
  3.  **Structure & Tone:** It mimics the *quaestio* format faithfully (Objections, Sed Contra, Respondeo, Replies to Objections) and uses Scholastic language ("It seems that...", "Therefore...", "It must be said...", "Consequently...", "Hence..."). The humor comes from applying that rigid structure to the inherent uncertainty of outcomes and the paradox of the tyrant being the real rebel.
  4.  **No Fake Quotes:** Relies solely on the structure and logic Aquinas employs, referencing his actual sources (Paul, Aristotle) appropriately without inventing words for him.
  5.  **Funny if You've Read It:** Anyone who grappled with ST II-II, Q.42, A.2 will recognize the specific tension points being satirized – the definitional gymnastics around "sedition," the outcome-dependency, and the brilliant but slightly dizzying reversal where the tyrant becomes the *true* disturber of the peace. The "historical auditors" line crystallizes the retrospective judgment absurdity perfectly.
