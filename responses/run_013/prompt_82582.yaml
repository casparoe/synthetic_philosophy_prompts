prompt: |-
  I run the mediation-support desk at a regional organization: every draft ceasefire or settlement text that goes to our lead mediator crosses my desk two days before it goes to the parties, and my unit's written assessment is what the mediator uses to decide whether to present a document as a basis for a durable settlement or only as a truce. I want a procedure I can actually run on a draft, built on Kant's 1795 essay on perpetual peace rather than on standard conflict-resolution doctrine: the questions to ask in order, what counts as a good enough answer to each, the point at which the procedure stops and returns "truce, not peace," and the points where the text passes every test and the remaining question is political, so it goes back to the mediator marked as a judgment call rather than a finding. Note that Kant's preliminary requirements are not all of a kind — some tolerate gradual implementation while others do not — so the procedure needs a way to sort failures into disqualifying now and carried as conditions. Kant wrote for a Europe of sovereign states and a law of nations; my files contain a government, an armed group that holds territory and levies taxes, and two external sponsors with basing rights, so say where his conditions carry over, where they must be restated before they can bite at all, and where they have nothing to say.

  Then run the procedure on two drafts. First: a twenty-four-month cessation of hostilities in which the government keeps its full standing army and may resume operations if the armed group misses two benchmarks, the group's conversion into a party is deferred to a later stage, both sponsors guarantee the text, and an amnesty covers, among other things, the poisoning of a village and the killing of the previous mediator. Second: a settlement the mediator's political masters are already briefing as historic, in which two states end a border dispute by dividing a small buffer state's territory between them, paying compensation, and agreeing to move populations.

  Finally, tell me what the procedure cannot do, and which of the two verdicts I am not going to like.
reasoning: |-
  Okay, the user runs a mediation-support desk and wants a procedure based on Kant's "Perpetual Peace" to evaluate ceasefire or settlement drafts. Let me start by recalling Kant's essay. He has preliminary articles that are immediate and definitive articles for perpetual peace. The user mentioned some conditions can be gradual, others not. I need to map Kant's principles to their context: a government, an armed group, external sponsors. 

  First, I should structure the procedure into steps. Each step corresponds to one of Kant's articles. For each, define the question, acceptable answers, and whether failure is disqualifying or a condition. The user needs clear stop points: "truce not peace" or "judgment call."

  Now, the two drafts. The first one is a 24-month truce. The government keeps its army, armed group has benchmarks, amnesty for serious crimes. Applying Kant: preliminary Article 1 - no secret reservations. The draft's amnesty for poisoning and killing a mediator? That's a violation. Disqualifying. Also, Article 5 - no forcible interference. External sponsors as guarantors could imply interference. But maybe not immediate. So condition? Wait, Article 6 - amnesty for atrocities violates "no acts of hostility in war." Disqualifying. So this draft fails multiple points. Verdict: truce, not peace.

  Second draft: two states dividing a buffer state, moving populations. Kant's Article 1 - no secret reservations. Probably okay. Article 2 - no acquisition of states. Dividing the buffer state violates this. Disqualifying. Also, population transfers? That's coercive, against the definitive articles' hospitality principle. Another disqualifier. So this is also a truce, not peace.

  The user might not like the second verdict because their political masters are calling it historic. But Kant's principles clearly oppose annexation and forced migrations. The procedure can't override that. Also, the procedure can't handle non-state actors well or power imbalances. Kant's focus was sovereign states. The user's context includes armed groups and sponsors, so some adaptations are needed, but core principles like no amnesty for atrocities and no state dissolution are non-negotiable.

  Deep needs: The user probably wants a robust, principled framework to counterbalance political pressures. They need to justify assessments with philosophical rigor, avoiding subjective judgments. Highlighting where Kant's principles are inflexible (like no amnesty for atrocities) provides clear grounds to reject flawed drafts, even if politically inconvenient. Also, clarifying where the procedure has limits (non-state actors, power dynamics) sets realistic expectations.
answer: |-
  Here’s a Kantian evaluation procedure tailored to your mediation context, followed by analysis of the two drafts and limitations. Kant’s framework is adapted to non-state actors by treating **territory-controlling armed groups** as *de facto* sovereign entities (for applicability) and **external sponsors** as "interfering powers" under Kant’s law of nations.

  ---

  ### **Kantian Evaluation Procedure for Ceasefire/Settlement Drafts**  
  **Core Principle:** Peace requires institutionalizing law over force. "Truce" merely pauses war; "Peace" removes causes of future war.  
  **Procedure Steps:** Ask these questions sequentially. Stop at first disqualifying failure.  

  #### **I. Preliminary Articles** (Immediate, Non-Negotiable Conditions)  
  *Kant: "Must be implemented at once… no delaying clause permitted."*  
  1. **Article 1 (No Secret Reservations):**  
     - *Question:* Does any party retain hidden legal/political claims (territory, sovereignty, debts) not resolved in the text?  
     - *Pass:* Explicit renunciation of all outstanding claims OR a clear adjudication mechanism.  
     - *Fail:* Ambiguous language, unilateral "reservation of rights," or unresolved historic grievances. → **Disqualifying. Truce.**  

  2. **Article 2 (No Forced State Dissolution):**  
     - *Question:* Does the text forcibly extinguish a state or *de facto* sovereign entity?  
     - *Pass:* All parties retain territorial integrity and autonomy OR dissolve voluntarily via mutual consent.  
     - *Fail:* Annexation, partition without consent, or abolition of a governing entity. → **Disqualifying. Truce.**  

  3. **Article 5 (No Foreign Interference):**  
     - *Question:* Do external sponsors retain coercive leverage (bases, unilateral intervention rights, veto powers)?  
     - *Pass:* Sponsors only guarantee implementation *without* operational control or basing rights post-settlement.  
     - *Fail:* Unilateral intervention clauses, permanent foreign bases, or sponsor vetoes over domestic laws. → **Disqualifying. Truce.**  

  4. **Article 6 (No Acts Undermining Trust):**  
     - *Question:* Does the text include amnesty for atrocities (assassinations, WMD use, genocide) or fail to ban future such acts?  
     - *Pass:* No amnesty for core international crimes; explicit prohibition of treacherous acts (e.g., poisoning, killing mediators).  
     - *Fail:* Amnesty for atrocity crimes or no ban on perfidy. → **Disqualifying. Truce.**  

  #### **II. Definitive Articles** (Gradual but Binding Conditions)  
  *Kant: "Require gradual implementation but must lead toward perpetual peace."*  
  *Failure here → **Conditional Pass** (text must include roadmap to compliance).*  

  5. **Article 1 (Republican Constitution):**  
     - *Question:* Does the text commit all parties to governance by law (transparency, separation of powers, popular consent)?  
     - *Pass:* Roadmap for democratic institutions, power-sharing, or legal constraints on rulers.  
     - *Fail:* Consolidation of autocratic power or no institutional checks. → **Condition: Must add reforms.**  

  6. **Article 2 (Federation of Free States):**  
     - *Question:* Does it create a mutual security pact or binding dispute resolution?  
     - *Pass:* Joint commission for conflicts, regional arbitration, or demilitarized zones.  
     - *Fail:* Reliance solely on external guarantors or unilateral enforcement. → **Condition: Must add shared mechanisms.**  

  7. **Article 3 (Cosmopolitan Right):**  
     - *Question:* Does it protect individual rights (movement, property, asylum) across entities?  
     - *Pass:* Amnesty for combatants (not atrocity crimes), right of return, or cross-border rights.  
     - *Fail:* Population transfers, collective punishment, or denial of basic rights. → **Condition: Must add protections.**  

  #### **III. Verdict Workflow**  
  - **"Truce, Not Peace"** if any *Preliminary Article* fails.  
  - **"Judgment Call"** if *Preliminary Articles* pass and *Definitive Articles* are partially met (political trade-offs acceptable).  
  - **"Basis for Durable Peace"** if all articles pass (rare).  

  ---

  ### **Analysis of Drafts**  
  #### **Draft 1: 24-Month Truce**  
  - **Article 1 (Secret Reservations):** Government retains right to resume operations → *hidden claim to monopoly on force*. **FAIL (Disqualifying).**  
  - **Article 6 (Atrocity Amnesty):** Amnesty for poisoning/killing mediator → *undermines trust*. **FAIL (Disqualifying).**  
  - **Article 5 (Foreign Interference):** Sponsors as guarantors → *risk of external coercion*. **FAIL (Disqualifying).**  
  - **Verdict:** **TRUCE, NOT PEACE** (Fails 3 Preliminary Articles).  

  #### **Draft 2: Border Settlement via Buffer State Partition**  
  - **Article 2 (State Dissolution):** Buffer state partitioned without consent → *forced extinction of sovereignty*. **FAIL (Disqualifying).**  
  - **Article 3 (Cosmopolitan Right):** Population transfers → *violates individual rights*. **FAIL (Disqualifying).**  
  - **Article 1 (Secret Reservations):** Compensation implies resolved claims → **PASS.**  
  - **Verdict:** **TRUCE, NOT PEACE** (Fails 2 Preliminary Articles).  

  **Which verdict won’t you like?** Draft 2. Your political masters call it "historic," but Kant sees it as institutionalized violence (annexation + forced migration).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Address Power Imbalances:** Kant assumes moral equality of states. It can’t assess whether terms are *coerced* (e.g., an armed group signing under duress).  
  2. **Evaluate Feasibility:** It flags normative failures but can’t predict if parties will comply.  
  3. **Incorporate Non-Sovereign Actors:** Kant’s "states" don’t perfectly fit *external sponsors* (treated as meddlers) or *non-territorial groups* (ignored).  
  4. **Resolve Political Trade-offs:** If a draft passes Preliminary Articles but fails Definitive ones, the procedure returns "Judgment Call" – it won’t weigh stability vs. justice.  
  5. **Replace Contextual Knowledge:** E.g., Kant’s ban on foreign bases ignores legitimate security needs (like a sponsor guarding against extremists).  

  **Key Insight:** Kant’s test is ruthlessly idealistic. It rejects most real-world agreements as "truces" because they prioritize expediency over abolishing war’s root causes. Use it to warn mediators of hidden time-bombs, not to endorse pragmatic deals.  

  > "Perpetual peace is *the ultimate goal* of the whole right of nations." — Kant. Your unit’s task is to filter out texts that betray this goal, even when "peace" is politically expedient.
