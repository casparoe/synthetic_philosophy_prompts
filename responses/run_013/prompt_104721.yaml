prompt: |-
  I'm a TA for an intro epistemology course this term and I keep getting dragged into arguments after section about what you're actually allowed to assert. It started as a dumb joke — a student said you can only say something if you know it, and I said that can't be right, I say stuff I'm only pretty sure about all the time, like that my bus will be late, and then we burned the whole hour on it. Now I genuinely care and I want to figure out what a theory of the norm of assertion even has to *do* before I pick a side, because every time I read about it people just gesture at the lottery case and Moore's paradox and call it a day, and I don't feel like I've learned anything about the actual standard.

  So write me the desiderata a theory of the norm of assertion has to meet. Not the theory itself — the checklist. Which cases does it have to get right? The ones where asserting a falsehood feels like a lie, the ones where it feels totally fine, the selfless-assertion cases where you don't even believe what you're saying but it's clearly OK (I think the classic one is a dying person reassuring family, or a lawyer defending a client they think is guilty), assertions about the future, assertions where your audience will predictably misread you even though you're right, and cases where two people with the exact same evidence assert opposite things and neither seems to deserve any criticism. Which distinctions can't it collapse — between the norm governing whether it's *permissible* to assert and the norm governing when you deserve blame for asserting, between what makes an assertion improper and what makes it false, between the standard for the speaker and the standard for the hearer who takes your word for it, between asserting and merely implying? And what background constraints does it have to respect — that assertion is a move in a cooperative game where hearers rely on you, that it's something you can do insincerely on purpose, that the bar seems to shift with the stakes, that it's supposed to be the thing that transmits knowledge through testimony? For each requirement give me the case or consideration behind it, and flag which are non-negotiable versus just preferences of one camp.

  Then tell me which requirements you think can't be jointly satisfied — I have a hunch the one that makes the lottery case come out right is going to fight with the one that lets me say my bus will be late — and which single requirement does the most work of ruling out the popular candidates (knowledge norm, truth norm, belief norm, some justification or credence norm). I'll do the scorecard myself, I just want the spec first. And if I'm wrong that it has to be one single norm at all — maybe different norms kick in for different contexts or different audiences — say so, thats the part I'm most unsure about.
reasoning: |-
  Okay, let me tackle this TA's request about assertion norms. They're teaching intro epistemology and got stuck in debates about what justifies making an assertion. They want a framework to evaluate theories, not just another rehash of lottery paradoxes.

  First, I need to map the landscape. The core tension seems to be between strict philosophical standards (like "only assert what you know") and everyday practices ("my bus will be late"). Their examples cover lies, polite fictions, future claims, and cases with identical evidence but conflicting assertions. 

  The key is identifying what any theory must explain versus what's negotiable. Non-negotiables probably include: assertion's social function (it's not just stating thoughts), the blameworthiness gap (sometimes false assertions aren't blameworthy), and avoiding Moorean absurdity ("p but I don't know p" feels wrong). 

  Then come the test cases. Lottery assertions ("your ticket lost" before drawing) feel improper even with 99.999% certainty - that challenges probability-based norms. Selfless assertions (comforting lies) challenge belief-based norms. Future claims challenge knowledge norms since we can't know futures. And high-stakes situations (saying "the bridge is safe" during a storm) suggest context matters.

  The tricky part is conflicts between requirements. For example: if we allow reasonable future assertions (bus being late), that clashes with forbidding lottery assertions despite similar probabilities. Also, transmission of knowledge via testimony pushes toward strict norms, but everyday practice needs leniency.

  I suspect no single norm covers everything. Maybe we need a primary norm with excusing conditions, or different norms for different contexts. The knowledge norm handles lottery cases well but struggles with future claims; justification norms handle everyday talk but might allow lucky guesses. 

  Most importantly, the theory must distinguish permissibility from blame - you might violate the norm but be blameless (like comforting lies). And it can't confuse assertion with implication or guesswork. This might point toward a hybrid approach or a "reasonable belief" standard with contextual thresholds.

  The TA's right that stakes matter - the same claim (e.g., "the dog ate your sandwich") has different standards when joking versus testifying in court. This suggests context-sensitivity isn't just optional but central to any viable theory.
answer: |-
  Here’s a structured checklist of desiderata for a theory of the norm of assertion, grounded in the cases and distinctions you’ve raised. I’ve flagged non-negotiables (★) vs. contested preferences, highlighted conflicts, and identified which requirement most strains popular candidates.  

  ---

  ### **I. Core Cases a Theory Must Capture**  
  *(Non-negotiable: ★ | Contestable: △)*  

  1. **The Lottery Case (★)**  
     - *Case:* Asserting "Your ticket lost" based on 1-in-a-million odds feels improper, even if true.  
     - *Requirement:* Must explain why high probability ≠ assertibility.  
     - *Stakes:* Rules out pure *truth* or *justified belief* norms; favors *knowledge norms*.  

  2. **Reasonable Everyday Assertions (★)**  
     - *Case:* Saying "My bus will be late" based on past experience (not knowledge).  
     - *Requirement:* Must permit assertions falling short of certainty/knowledge.  
     - *Stakes:* Rules out *infallibilist knowledge norms*; favors *justification* or *credence*-based norms.  

  3. **Selfless Assertions (★)**  
     - *Case:* A doctor asserts "You’ll recover" to a dying patient to comfort family, despite disbelief.  
     - *Requirement:* Must allow assertions lacking speaker belief when socially vital.  
     - *Stakes:* Rules out *belief norms*; requires divorcing permissibility from sincerity.  

  4. **False but Blameless Assertions (★)**  
     - *Case:* Asserting "It’s safe to cross" based on excellent evidence, but bridge collapses.  
     - *Requirement:* Must distinguish *false* assertions from *improper* ones.  
     - *Stakes:* Rules out *truth norms*; requires a *blameworthiness* gap.  

  5. **High-Stakes Shifts (△)**  
     - *Case:* Saying "This wire isn’t live" during casual repair vs. bomb defusal.  
     - *Requirement:* Should explain why assertibility tightens with practical stakes.  
     - *Stakes:* Favors *contextualist* or *interest-relative* norms.  

  6. **Peer Disagreement (△)**  
     - *Case:* Two geologists with identical evidence assert "Oil here"/"No oil here." Neither seems criticizable.  
     - *Requirement:* Should permit reasonable assertions even when incompatible.  
     - *Stakes:* Challenges *uniqueness thesis*; favors *permissivist* norms.  

  ---

  ### **II. Essential Distinctions a Theory Must Preserve**  
  *(Non-negotiable: ★)*  

  1. **Permissibility vs. Blameworthiness (★)**  
     - *Case:* A well-intentioned assertion turns out false (e.g., bus *wasn’t* late due to fluke).  
     - *Requirement:* A theory must separate when an assertion *violates the norm* vs. when the speaker *deserves blame*.  

  2. **Impropriety vs. Falsity (★)**  
     - *Case:* A lucky guess ("I won the lottery!") is true but improper if unsupported.  
     - *Requirement:* Assertions can be improper but true, or proper but false.  

  3. **Speaker Standard vs. Hearer Standard (★)**  
     - *Case:* A conspiracy theorist asserts "The moon landing was faked" to credulous listeners.  
     - *Requirement:* What a hearer can *responsibly believe* via testimony ≠ what a speaker can *properly assert*.  

  4. **Assertion vs. Implication (★)**  
     - *Case:* Saying "The keys might be in the drawer" (proper) vs. asserting "They’re in the drawer" (improper if unsure).  
     - *Requirement:* The norm must not overgeneralize to hedging, guessing, or implicature.  

  ---

  ### **III. Background Constraints**  
  *(Non-negotiable: ★ | Contestable: △)*  

  1. **Social Function/Reliance (★)**  
     - *Constraint:* Assertions invite reliance; hearers form beliefs based on speaker responsibility.  
     - *Case:* Saying "This mushroom is edible" creates accountability if wrong.  

  2. **Insincere Assertions (★)**  
     - *Constraint:* Must accommodate *intentional lies* (e.g., a spy asserting falsehoods).  
     - *Case:* A liar violates the norm, but the act is still an assertion.  

  3. **Knowledge Transmission (△)**  
     - *Constraint:* Assertion is the primary vehicle for testimonial knowledge.  
     - *Case:* If you know *p*, asserting *p* typically lets the hearer know *p*.  
     - *Stakes:* Favors *knowledge norms*; challenges *weaker norms*.  

  ---

  ### **IV. Key Tensions & Conflicts**  
  **A. Unsatisfiable Trilemma?**  
     - (1) *Lottery Case* forbids asserting <1.0 probability claims.  
     - (2) *Everyday Cases* require asserting some <1.0 probability claims.  
     - (3) *Single Norm* demands uniform standard.  
     - **Conflict:** A uniform norm can’t satisfy both (1) and (2).  

  **B. Knowledge Transmission vs. Everyday Practice**  
     - If assertion transmits knowledge, everyday claims ("bus is late") often fail.  
     - If it doesn’t require knowledge, testimony’s epistemic value weakens.  

  **C. The Blameworthiness Gap vs. Strict Norms**  
     - Selfless/false-but-reasonable assertions demand blamelessness despite norm violation.  
     - Strict norms (e.g., *knowledge*) struggle to explain why we don’t blame speakers in these cases.  

  ---

  ### **V. Which Requirement Rules Out Popular Norms?**  
  The **Lottery Case (I.1)** does the heaviest lifting:  
  - **Truth Norm**: *Fails* – lottery claims are true but improper.  
  - **Belief Norm**: *Fails* – you can believe your lottery ticket lost but still can’t properly assert it.  
  - **Justification Norm**: *Fails* – justified high probability ≠ assertibility.  
  - **Credence Threshold (e.g., >0.95)**: *Fails* – lottery odds exceed this yet still unassertible.  
  - **Knowledge Norm**: *Survives* – you don’t *know* your ticket lost.  

  ---

  ### **VI. Must It Be a Single Norm? Your Hunch Is Right**  
  **No.** Monist theories (one norm for all assertions) struggle with:  
  - **Stakes Sensitivity**: What you can assert changes with context (low-stakes bus vs. high-stakes surgery).  
  - **Speaker/Hearer Asymmetry**: Lawyers/doctors may assert what they couldn’t in other roles.  
  - **Function**: Assertions in collaborative inquiry vs. testimony vs. comfort have different goals.  

  **Leading Alternatives**:  
  - **Pluralism**: Different norms for different contexts (e.g., *knowledge* for testimony, *reasonable belief* for casual chat).  
  - **Hybrid**: A primary norm (e.g., *knowledge*) with *excuses* for blameless violations (selfless assertions).  
  - **Contextualism**: The threshold for justification/knowledge shifts with practical stakes.  

  ---

  ### **Summary Checklist for Your Scorecard**  
  | **Desideratum**               | **Non-Negotiable?** | **Problem for**          |  
  |-------------------------------|---------------------|--------------------------|  
  | Captures Lottery Impropriety  | ★                   | Truth, Belief, Justification |  
  | Permits Everyday Assertions   | ★                   | Infallibilist Knowledge  |  
  | Allows Selfless Assertions    | ★                   | Belief Norms             |  
  | Separates Permissibility/Blame| ★                   | All monist strict norms  |  
  | Explains High-Stakes Shifts   | △                   | Invariant Norms          |  
  | Accommodates Peer Disagreement| △                   | Uniqueness-requiring Norms|  
  | Preserves Assertion/Implication| ★                   | Overly broad theories    |  

  **Most Fracturing Tension**: The Lottery Case vs. Everyday Assertions. **Solution Space** likely requires pluralism, contextualism, or a knowledge norm with broad excusing conditions. Start by asking: *Which intuitions are you willing to revise?* That’s where the camps divide.
