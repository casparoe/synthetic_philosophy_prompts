  ## The Neutral Engine

  The civic engine runs on what we choose,
  But strips the *why* that made our choices deep.
  **My good's not just a choice to file and sort.**
  It takes the weight, the reasons I might use,
  Consigns them somewhere consciousness can't keep,
  Translates the ends to numbers it can glean.
  **Yet here, it counts as nothing else, this scheme.**
  My hope, my faith, the things I can't transpose
  To points assigned, are neutralised, unseen.
  The civic engine runs on what we choose.

  The rankings rise and fall, devoid of views
  On why they mattered first, or why we weep.
  **My good's not just a choice to file and sort.**
  What's shared survives? What every ranker views
  As harmless? Then the veto cuts the heap.
  No common ground beyond the shallow stream?
  The process grinds again on what remains,
  Discards the spark within the civic dream.
  **Yet here, it counts as nothing else, this scheme.**

  It tallies points where substance once held sway,
  The quantified replace the lived esteem.
  The civic engine runs on what we choose.
  The deeper root is pruned back every day,
  Leaves preference bare beneath the cold machine.
  **My good's not just a choice to file and sort.**
  The neutral cogs demand we look away
  From any claim that might disrupt the mean
  Or hint that values aren't a list to queue.
  **Yet here, it counts as nothing else, this scheme.**

  The engine serves the rule that strips the core
  And makes the complex simple, stark, and clean.
  It runs again on outputs it can use,
  Converting soul to points, then points to more
  Procedures cycling where convictions lean.
  **My good's not just a choice to file and sort,**
  **Yet here, it counts as nothing else, this scheme.**

  ---

  **Notes on Execution:**

  *   **Form:** Strict villanelle structure: five ABA tercets, closing ABAA quatrain. Refrains (lines 1 & 3 of first tercet) repeat alternately as the final line of subsequent tercets and both appear in the quatrain.
  *   **British English:** "Neutralised," "learnt" (optional, but avoids "learned" ambiguity), "queue," vocabulary choices ("scheme," "civic engine," "glean," "pruned back").
  *   **The Citizen's Voice:** Personal ("my hope, my faith," "things I can't transpose," "soul," "convictions") contrasting with the procedural language.
  *   **The Procedure Embodied:**
      *   "Strips the *why*," "Consigns them," "Translates the ends to numbers," "neutralised, unseen" = Stripping authoritative reasons.
      *   "Points assigned," "rankings rise and fall," "tallies points" = Ordinal preferences, Borda count (points implied).
      *   "What every ranker views / As harmless?" = Veto requiring universal endorsement on neutral grounds.
      *   "Then the veto cuts the heap," "Discards the spark," "The process grinds again on what remains" = Post-veto re-run on the remaining options.
      *   "Interpersonally incomparable" is inherent in treating them *only* as points/rankings without shared justification.
  *   **Refrains as Argument:**
      *   **1st Refrain ("My good's not just a choice..."):** Assertion of intrinsic, doctrinal value.
      *   **2nd Refrain ("Yet here, it counts as nothing else..."):** Acknowledgment of the procedure's brutal reduction. The "here" grounds it in the AI's process.
      *   Their repetition mirrors the AI cycling. The final "Yet here..." feels less like lament, more like a cold fact within the loop.
  *   **The AI's True Master:**
      *   "The civic engine runs on what we choose" becomes increasingly hollow as the poem progresses.
      *   "The engine serves the rule that strips the core," "The neutral cogs demand," "Converting soul to points, then points to more / Procedures" explicitly state the neutrality constraint is the driving force.
      *   The final couplet juxtaposes the refrains, forcing the reader to see the *process* (conversion) as the central actor, serving neither the citizen's good nor her raw preference, but the rule that demands the conversion.
  *   **Accessibility & Accuracy:**
      *   The core dilemma (deep value vs. procedural reduction) is clear without jargon.
      *   The procedural steps are described accurately through verbs and outcomes ("strips the *why*," "veto cuts the heap," "process grinds again," "quantified replace the lived"), avoiding technical names (Borda, ordinal) but capturing their essence.
      *   The tension between the citizen's feeling and the system's operation is the central experience, recognizable to both specialists (who see the social choice/liberal neutrality problem) and general readers (who see the dehumanizing effect of bureaucracy/AI).
