     - Step 2 (Bailey): After seeing Alex's posters, Bailey thinks: "If I drop now, Alex wins. If I spend 5 hours on a pizza party, there's a chance Alex will drop out. Given that Alex just invested, they might be more likely to drop if I show resolve. I think there's a 15% chance Alex drops after my party. So expected value is 0.15*100 - 5 = 10. So I do it."
     - Step 3 (Alex): "Bailey didn't drop? Now I must respond. But if I drop now, I lose the 5 hours I already spent on posters. Wait, no, sunk cost irrelevant. I only care about future. If I spend another 5 hours on a social media campaign, maybe Bailey will drop. The chance might be lower now, say 8%, because Bailey just invested too. But 8% of 100 is 8, minus the 5 hours cost, so expected value 3. Still positive. I do it."
     - And so on. Even after many steps, as long as the perceived probability of the opponent dropping in the next round is at least c/V (5/100=5%), it's rational to continue.

