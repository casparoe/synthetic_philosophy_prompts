  We are to create a scenario that mirrors the dollar auction in structure but without sunk-cost reasoning. The setting should be ordinary, like a school club, family, or part-time job. The scenario must fit in one paragraph, start after both have committed, have no auctioneer or literal money, and the prize must be indivisible. Both parties are aware of the pattern but proceed because each step maximizes expected value.

