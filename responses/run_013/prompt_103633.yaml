answer: |-
  ### Scenario
  In the high school debate club, the role of lead debater for the regional championship is open. Two students, Taylor and Jordan, have already spent weeks preparing arguments and practicing late into the night, sacrificing sleep and social time. The coach will award the role to whoever presents the strongest case in a final head-to-head round. Both know that if they withdraw now, the other wins by default. Each new preparation effort—researching niche evidence, drilling rebuttals, or soliciting feedback—costs additional hours and risks burnout. The lead role brings unique college application benefits and prestige, but only one can win. Taylor and Jordan recognize the dollar-auction trap: they’ve discussed it in ethics class. Yet each believes that one more push might make the other crack, securing victory at a justifiable cost. Taylor drafts an intricate counterargument; Jordan responds with a complex statistical model; and so they escalate, each step burying them deeper in exhaustion, until both have sacrificed more well-being than the role is worth.

  ---

  ### Analysis

  **1. Sunk-cost account prediction and misfit**  
  A sunk-cost explanation predicts escalation occurs because parties treat *past investments* (e.g., time already spent) as a reason to continue—e.g., "I’ve sacrificed too much to quit now." Here, this diagnosis fails. Taylor and Jordan never reference sunk costs: their decisions are strictly forward-looking. At each step, they only weigh the *future* cost of effort against the *future* benefit of winning, conditional on the other’s expected actions. Past sacrifices are irrelevant to their reasoning, as stipulated.

  **2. Step-by-step forward-looking escalation**  
  Assume:  
  - The lead role’s value = \( V \) (e.g., prestige, college benefits).  
  - Cost per escalation step (e.g., one extra hour of preparation) = \( C \).  
  - At any step, the player believes the probability the opponent quits after their move is \( p \) (based on perceived resolve).  

  *Example escalation:*  
  - **Step 1 (Taylor):** Taylor considers quitting or escalating.  
    - *Quit:* Gains 0 (avoids future cost but loses role).  
    - *Escalate (cost \( C \)):* If Jordan quits (probability \( p \)), Taylor wins \( V - C \). If Jordan continues (probability \( 1-p \)), the game advances.  
    - *Decision:* Taylor escalates if expected value (EV) > 0 → \( p(V - C) + (1-p)(\text{EV}_{\text{next}}) > 0 \). If \( p \) is high enough (e.g., \( p > C/V \)), escalation maximizes EV.  
  - **Step 2 (Jordan):** After Taylor escalates, Jordan faces the same choice.  
    - *Quit:* Gains 0.  
    - *Escalate:* Believes Taylor might quit now (with new \( p' \), say, higher after seeing Taylor’s effort). Escalates if \( p'(V - C) + (1-p')(\text{EV}_{\text{next}}) > 0 \).  
  - **Later step (both locked in):**  
    - Even after recognizing the pattern, Taylor escalates because:  
      - Quitting guarantees a loss of 0 from this point.  
      - Escalating costs \( C \) but offers \( p'' \times (V - C) \) if Jordan quits, plus a chance to win later rounds. If \( p'' \) is non-zero (e.g., "Jordan looks tired—maybe this breaks them"), EV > 0.  
    - Both know the trap but act because their model of the other’s behavior (\( p \)) always makes one more step seem profitable.  

  **3. Key feature and its removal**  
  - **Feature:** The asymmetry between a *certain loss* (0) from quitting and a *gambled gain* from escalating. Even with low \( p \), as long as \( p(V - C) > 0 \) (or future rounds offset costs), continuing appears rational. Loss aversion amplifies this: quitting feels like a definite failure, while escalating offers hope.  
  - **Removal:** If quitting *also* yielded a small positive payoff (e.g., if the coach rewarded both with consolation prizes for effort), the EV of quitting could exceed escalating when \( p \) is low. Escalation would likely stop early, as the gamble loses its edge over a certain gain.  

  **4. Attack from irrationality and rebuttal**  
  - **Attack:** A critic would argue the parties are irrational because they ignore the *inevitability of mutual loss*. Once both recognize the pattern, they should assign \( p \approx 0 \) (knowing the other won’t quit) and quit immediately to cut losses. Persisting is reckless optimism.  
  - **Rebuttal:** This attack fails because it assumes perfect coordination or common knowledge of rationality. In reality:  
    - Players lack information about the other’s resolve. If Taylor believes Jordan’s limit is near (e.g., due to visible stress), \( p \) remains positive.  
    - Quitting first guarantees a loss, while continuing offers *any* chance of winning. Even a small \( p \) can justify escalating if \( V \gg C \) (e.g., a high schooler might overvalue \( V \)).  
    - Without binding commitments to quit, mutual defection is game-theoretically stable.  

  ---

  ### Specification Compliance
  1. **Ordinary setting**: High school debate club (familiar to students).  
  2. **One paragraph**: Scenario is contained above.  
  3. **No auctioneer/dollar/money**: Prize = indivisible lead role; currency = time/effort/well-being.  
  4. **Starts mid-escalation**: Both have already sacrificed weeks of effort.  
  5. **Aware of pattern**: Explicitly stated ("recognize the dollar-auction trap").  
  6. **Forward-looking steps**: Each escalation maximizes EV given beliefs about the other’s next move (detailed in step-by-step).  
  7. **Sunk costs excluded**: Analysis confirms parties never cite past investments.  
  8. **Key feature identified**: Asymmetry between certain loss (quit) and gambled gain (escalate), with consequences for removal.  
  9. **Irrationally critique addressed**: Critic’s objection is raised and refuted on decision-theoretic grounds.  

  This case isolates escalation driven purely by competitive uncertainty and loss aversion, decoupling it from sunk-cost fallacies.
