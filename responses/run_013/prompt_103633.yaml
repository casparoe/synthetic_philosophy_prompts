  Expected gain = [probability that opponent concedes] * V - c

  If this is positive, then it's rational to bid. But note that if the opponent does not concede, then they have paid c and the game continues. In the next round, the opponent will be in the same situation and might also bid again.

  But if both are rational and both know that the other is rational, then they should both know that it will continue until the costs are very high. However, if there is uncertainty about the other's valuation or their resolve, then at each step there is a chance that the opponent will drop out.

  In our scenario, we must have that at each step, the player believes that the next bid might be the last because the opponent might drop out. This belief might be based on the escalating costs and the idea that the opponent might be approaching their limit.

