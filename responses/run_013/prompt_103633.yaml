  **Sunk-cost account prediction and why it doesn't fit**:
  - A sunk-cost account would predict that Alex and Bailey continue because they have already invested time and effort (sunk costs) and don't want those to be wasted. However, in this scenario, we stipulate that they do not use the already spent time as a reason. Instead, they are strictly forward-looking: at each step, they consider only the future costs and the probability of winning the presidency if they continue. The past investments are irrelevant to their decision.

  **Step-by-step escalation**:
  Let's assume the value of the presidency is V (in terms of future benefits). At any point, the current total investment (time and effort) by Alex is A, and by Bailey is B. The next move requires an additional small cost c (for a campaign move). If one drops out, the other wins and gets V minus their total cost (if we account for costs) but note that the sunk costs are already spent and not recoverable. However, the future cost is only the additional c.

  At a given point, Alex's situation:
  - If Alex drops out now, they get 0 (no presidency) and have already spent A (which is sunk and irrelevant for future decisions) so the net outcome is -A (but they don't consider sunk costs). However, for a forward-looking decision, they only care about future outcomes: dropping out yields 0 (from this point on) and the sunk cost A is already lost. If they continue, they spend c and then:
    - With some probability p, Bailey drops out in response to Alex's move (or at the next step) and Alex wins (getting V) and then the net future gain would be V - c.
    - With probability 1-p, Bailey continues and then Alex will face the same decision again.

  But note: the structure is that each move is met by a countermove. So if Alex makes a move, Bailey then has the option to counter with a move of cost c. Then Alex again. So it's a sequential game.

  We can model it as a game where each step, the player whose turn it is must decide to either concede (and get nothing from this point, but avoid future costs) or bid (pay c and then the turn passes to the other). The one who concedes loses the bid and the other wins. The total cost at the time of concession by one is the sum of all their bids.

  But note the asymmetry: the one who concedes loses and the other wins without having to pay the next bid.

  So let's think from the perspective of a player who has just observed the opponent make a bid. Now it's their turn. They have two choices:
  1. Concede: then the opponent wins and they lose. Their payoff: - (total cost they have already incurred, but sunk) so from a forward-looking perspective, they get 0 (avoiding any future cost) and the sunk costs are irrelevant.
