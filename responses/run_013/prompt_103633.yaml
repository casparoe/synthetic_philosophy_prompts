  4. **Attack on rationality**: The critic would say that after a few rounds, it becomes clear that the other is not dropping, so the probability of them dropping in the next round should be very low. Therefore, the expected value of continuing becomes negative. But the players might still be optimistic or might think that the next move will be the one that breaks the opponent. The critic might also argue that they should coordinate to stop. However, without communication or commitment, each fears that if they stop, the other will continue and win. So the attack may not fully succeed because in the absence of coordination, the individual rationality leads to escalation.

