  EV(bid) = q*(V - c) + (1-q)*[ EV(next state) - c ]

  But note that the next state is symmetric but now the sunk cost is A0+c for Alex, and they are in the same position again. This leads to an infinite regress.

  However, if we assume that both players have the same valuation V and the same beliefs, and that they each believe that if they bid the other will drop out with probability q, then we can set up an equation for the expected value at any state.

  But it's complex. Alternatively, we can use the idea that the cost of bidding is small and the prize is large, so even a small chance of winning immediately might be worth it. Moreover, if at each step the player believes that the opponent might drop out at the next round (even if they have been continuing so far) because they are approaching their limit, then the probability q might be high enough.

  **Removing the key feature**:
  The key feature is the gamble: by continuing, you avoid a certain loss (losing without further cost) and get a chance to win. If we remove this gamble, for example, if the prize were divisible (so they could share it) or if there were a way to coordinate and both stop, then the escalation might not occur. But in our case, the prize is indivisible and there is no coordination. Also, if the cost of continuing were very high relative to the prize, then the gamble might not be worth it. But in our scenario, the cost per move is small.

  **Attack from irrationality**:
  A critic might argue that the players are irrational because they are ignoring the inevitability of mutual loss. They might say that once both have recognized the pattern, they should be able to coordinate to stop. But in the scenario, there is no mechanism for coordination (like in the dollar auction). Each player, acting independently, might fear that if they stop, the other will continue and win. So they continue. The critic might also argue that the belief that the opponent will drop out in the next round is not justified, especially after many rounds. If both are rational and both have the same valuation, they should both know that the other will continue until the cost reaches V. Therefore, at the beginning, they should not start. But note we start after they have already invested. And at any step, if the total cost so far (including the next bid) is less than V, then the winner would still get a positive net if the opponent drops out soon. However, if the total cost (including what they are about to spend) is already near V, then the expected net gain might be negative. But if they are not near V, then it might still seem rational.

  The attack might fail because even with full rationality, without a way to commit to stop, the escalation is inevitable. This is the logic of the dollar auction and similar games. The critic must assume that the players can coordinate without communication, which is not always possible. In fact, in game theory, this is a known trap.

