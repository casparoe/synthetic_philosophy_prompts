  My roommate is a hardcore Hume guy and I'm taking this medieval Islamic philosophy seminar, and we've been going at each other for like a week now about al-Ghazali. You know the bit in the Incoherence where he says that when you put fire next to cotton, the fire isn't actually what burns the cotton — God does it directly, on the occasion, and the fire is just kind of... there. So there's no necessary connection between the two; what looks like one thing making another happen is really just God's habit of doing them in that order, which is why we can call it a "law of nature" and get away with it. My professor keeps insisting Ghazali isn't denying that fire burns, only that it burns *by necessity*, which sounds like a real distinction but honestly might also be cope, and then the seminar wandered into whether this makes science impossible and whether miracles even count as a special problem on this view since there's nothing there to interrupt — and I zoned out somwhere around minute forty.

  Anyway, I want to win this with a joke. Can you write me one joke about Ghazali's occasionalism, a real one, where the punchline actually turns on the content — the no-necessary-connection thing, God as the only genuine cause with everything else just "occasional", the regularity being His custom, miracles being no big deal, the whole did-the-fire-burn-it-or-not awkwardness. Someone who's read a little Ghazali or knows the occasionalism debate should laugh because they recognize the actual position, not just because "lol God did it" is a sentence. Please don't give me the lazy version where the punchline is that nobody's responsible for anything — that's my roommate's joke and it doesn't even turn on necessity. Pick one joke and commit to it, don't hand me three and make me choose.

  And then, seriously, tell me where the joke takes liberties: if it only works on a reading of Ghazali that people actually fight about (like whether he's a full-blown occasionalist or something weaker), say so plainly, because I'd rather know what I'm trading away than tell a joke that's quietly just wrong about him and get destroyed in section.
