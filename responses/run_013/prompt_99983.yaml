  I'm a backend engineer with no real philosophy or econ training, and I've gotten obssessed with something I keep bumping into in AI safety blogs: commitment races. Roughly the picture is that if two parties are in some kind of conflict -- a bargaining standoff, a game of chicken, whatever -- and each side can credibly lock itself into a policy ahead of time, then each has a reason to lock in earlier and harder than the other, because whoever's commitment is visible and irreversible first gets to dictate how things end. Individually rational, collectively terrible, and it seems to pop up everywhere from strikes and treaty talks to two AIs with hard-coded goals. But every time I try to read further I drown in decision theory jargon.

  I've got maybe 10-15 hours a week for the next year that I want to put into this, mostly reading and writing, not doing original research. Which open questions in the commitment-race area are actually worth that time, ranked, and why? I want to know which ones are upstream of the others, which are tractable for someone with a coding/math brain but no philosophy background, and what would have to happen for me to move one up or down the list. Don't just hand me a list -- defend the order.
