answer: |-
  Here are 10 questions designed to probe your guest’s reading rigorously, with clear separation of settled vs. contested premises in my notes. The questions avoid restating her view, target her specific claims, and include the three required themes (a/b/c) with follow-ups and a falsifiability closer.

  ### Core Questions + Follow-ups
  1. **[Thematic A: Separation of Strands]**  
     You argue the drowning-wife case is distinct from—and weaker than—the integrity objection proper, and you’re willing to drop it. But Williams uses the rescuing husband to *illustrate* how alienated deliberation undermines integrity. Could you walk us through why disentangling these cases *doesn’t* risk losing the objection’s intuitive force?  
     *(Settled premise: Williams presents both; contested: whether they’re separable illustrations of a single concern)*  
     - *Likely follow-up if she emphasizes conceptual distinction*: If we grant that the drowning-wife case is merely illustrative, does your reading imply that Williams’ critics (like Railton) have mislocated their replies? Or is the example so rhetorically central that discarding it leaves the integrity objection vulnerable to being dismissed as abstract?  

  2. **[Thematic B: Distinctness from Over-Demandingness]**  
     On your reading, integrity concerns the *structure* of deliberation (e.g., being guided by internal reasons vs. external arbitration). How does this differ from over-demandingness objections, which also cite psychological costs? Put another way: is “deliberative alienation” just a *species* of over-demandingness, or something categorically distinct?  
     *(Settled premise: over-demandingness exists; contested: whether integrity-as-deliberation is reducible to it)*  
     - *Likely follow-up if she stresses categorical difference*: If alienation stems from constantly subordinating personal commitments to impartial calculus, doesn’t that still reduce to a psychological burden—making it continuous with over-demandingness? Or is the wrong here about agency, not cost?  

  3. **[Thematic C: Sophisticated Consequentialist Replies]**  
     You target how consequentialism *shapes dispositions* rather than its criterion of rightness. But sophisticated consequentialists (e.g., Railton) argue agents should cultivate dispositions that *express* consequentialist values without constant calculation. Why isn’t this a full rebuttal to your version of the integrity objection?  
     *(Settled premise: SC distinguishes criterion/decision-procedure; contested: whether SC fully addresses Williams’ worry)*  
     - *Likely follow-up if she rejects SC’s compatibility*: Couldn’t an SC agent see their cultivated disposition as authentically theirs? If not, does your objection assume that integrity *requires* non-consequentialist motives—effectively begging the question against SC?  

  ### Additional Probing Questions
  4. One layer of your argument is that integrity is about the agent’s relation to their deliberations. How would you distinguish this from a purely procedural account of practical reason (e.g., Korsgaard)? Is Williams making a metaethical claim about reasons here?  
  5. If integrity isn’t about the survival of projects (as you suggest), but about deliberative posture, does this imply agents could retain integrity while abandoning *all* deep commitments—say, under duress? Or do projects play an indispensable role?  
  6. Williams sometimes frames integrity as threatened when morality demands we betray commitments "that are most closely related to [our] existence as agents." How does your deliberative focus accommodate this existential language?  
  7. Beyond consequentialism, would your reading apply to other theories (e.g., deontology)? Could a Kantian agent suffer "deliberative alienation" by subordinating their projects to the Categorical Imperative?  

  ### Closing Falsifiability Question
  8. Last one: What kind of evidence would make you reconsider your reading? For instance, if Williams explicitly tied the drowning-wife case to the core of the integrity objection, or if textual analysis showed he *equated* "projects" with the source of deliberative authority—would that undermine your view?  

  ### Notes on Premises & Nuance
  - **Settled in questions**:  
    - Williams raises both integrity and drowning-wife (§1, §8).  
    - SC distinguishes criterion/decision-procedure (§3).  
    - Over-demandingness is a familiar objection (§2).  
  - **Contested, handled neutrally**:  
    - Strand separability (§1 avoids assuming they *are* separable; invites defense).  
    - SC’s adequacy (§3 frames SC as potential rebuttal; doesn’t presume it succeeds).  
    - Conflation claims (§3 doesn’t assume Williams "conflates" criterion/procedure).  
  - **Why this works**: Questions don’t presuppose her reading is correct/incorrect. They challenge her to defend contested edges (§1, §2, §3) while isolating settled premises. Follow-ups anticipate common counterarguments without endorsing them.  

  Total: 8 core questions (3 themes + follow-ups + extras + closer). Adjust phrasing for conversational flow, but this covers all requested angles while respecting interpretive disputes. Let me know if you’d like tweaks!
