  Alright, the user runs an evidence desk at a development finance institution. They get about a dozen claims monthly, each asserting that some historical factor (like colonial boundaries or cultural traits) explains current regional poverty. They need a triage procedure to evaluate these claims efficiently. Their team isn't historians but economists and social scientists, with only two hours per claim and no access to archives. The stakes are high—bad calls mean wasted money or harmful programs.

  First, I need to understand the core problem. The existing three-question approach (correlation, mechanism, actionable) is too permissive. The user suspects it lets flawed claims through. Their unit's rule requires showing the mechanism's inputs still exist, but they want to know if that's sufficient. The user also wants the procedure to flag when evidence is inconclusive, not just false, and to hand off value-based decisions.

  The user's explicit needs are a step-by-step triage procedure with clear stopping points, assessment of their current rule, and application to three cases. Deeper needs include avoiding harm from misguided interventions, conserving resources efficiently, and maintaining institutional credibility. They might also need to justify decisions to stakeholders and handle the volume of claims without specialized historical expertise.

  Building the procedure requires addressing causality beyond correlation. Historical natural experiments often suffer from unobserved confounders or selection bias. The mechanism's persistence is crucial, but as the user's rule notes, it might wrongly reject valid claims if the mechanism evolved or accept spurious ones if inputs exist but aren't causal. For example, a historical institution might persist in form but not function, leading to wasted efforts.

  The triage steps should start with verifying the correlation's robustness, then assessing mechanism plausibility and persistence. Steps must identify "cannot know" when evidence is ambiguous. Value judgments, like whether to intervene despite risks, should be flagged for human decision-makers. The procedure needs to be practical—no deep historiography, just focused questions a social scientist can handle in two hours.

  Assessing the user's rule: requiring mechanism inputs to still exist is sound but incomplete. It wrongly rejects cases where the mechanism operates differently now or where inputs are latent. It wrongly accepts if inputs exist but aren't sufficient or if correlation is coincidental. So the procedure must test mechanism validity and persistence more deeply.

  Now, applying to the cases:
  1. Colonial land tenure: Discontinuity at a boundary suggests correlation. But mechanism (land titles affecting investment) must be checked for persistence—did post-independence reforms alter the system? If not, it's actionable; if reforms happened, it's "cannot know" without more historical context.
  2. Culture and trust: Correlation via surveys is measurable, but mechanism (trust enabling contracts) is endogenous. Trust could be a result of economic conditions, not a cause. Mechanism persistence isn't the issue—it's the reverse causality that makes it "cannot know."
  3. Cash transfer analogy: Historical analogy's strength depends on similarity. If contexts differ (e.g., scale, era), the mechanism might not hold. Actionable only if contexts align; otherwise, "cannot know" or false if key differences undermine it.

  The step I'm least sure of is Step 4 (mechanism persistence). It requires judging if historical drivers still operate, which can be ambiguous without deep historical knowledge. Social scientists might miss subtle institutional changes, leading to errors. But with the checks in place (e.g., major disruptions, counterevidence), it balances feasibility and rigor.

  Confidence in the procedure: It should handle most cases by focusing on obvious red flags and persistence. Real-world dockets might have messier data or political pressures, but the steps prioritize critical flaws. The "cannot know" outcomes protect against overconfidence, directing resources to clearer cases.
answer: |-
  Here is a triage procedure designed for your constraints, balancing rigor with operational reality. It targets **false certainty** as the primary risk.

  **Core Principles:**  
  1. **Correlation ≠ Causation:** Historical natural experiments are vulnerable to unobserved confounders and selection bias.  
  2. **Mechanisms Decay or Mutate:** Historical drivers may not operate today.  
  3. **Action ≠ Impact:** Even if true, intervention may be ineffective or harmful.  
  4. **"Cannot Know" is a Valid Outcome:** Protects against overconfidence with weak evidence.  

  ---

  **Triage Procedure (Sequential Steps)**  

  **STEP 1: IS THE CORRELATION ROBUST? (5 min)**  
  *   **Question:** Does the evidence rule out obvious geographic, economic, or demographic confounders that correlate with both X (cause) and Y (outcome)?  
  *   **Sufficient Answer:** The regression controls for *contemporaneous* factors plausibly affecting both X and Y at the time X was established (e.g., pre-treatment population density, soil quality, elevation, disease burden, pre-existing trade routes). A spatial discontinuity (RD) must show balance on *observable* pre-treatment characteristics near the boundary.  
  *   **Stop with "No":** No controls for major geographic/economic confounders, or RD shows imbalance on key pre-treatment variables.  
  *   **Stop with "Cannot Know":** Controls exist but are crude (e.g., "region fixed effects" masking local variation) or key confounders are unmeasurable (e.g., pre-colonial political organization).  
  *   **Judgment Call:** Deciding what counts as a "major" confounder without historiography. Rely on basic geography/economics (e.g., "Did they control for coastline access or malaria risk?").  

  **STEP 2: IS THE MECHANISM PLAUSIBLE AND HISTORICALLY CONTINGENT? (20 min)**  
  *   **Question:** Does the proposed mechanism *specifically* link X to Y, and does it rely on historical conditions that existed *at the time X was imposed*?  
  *   **Sufficient Answer:** A clear, logical chain from X → Intermediate Outcome → Y, grounded in the historical context (e.g., "Forced labor (X) → suppressed local skills/entrepreneurship (IO) → lower industrialization (Y)"). The mechanism must be *feasible* given known historical constraints.  
  *   **Stop with "No":** Mechanism is circular ("poverty causes poverty"), violates basic logic/history (e.g., "colonial borders caused soil depletion" without a link), or is untethered from the historical period ("they lacked growth mindset").  
  *   **Stop with "Cannot Know":** Mechanism is coherent but relies on unverifiable social/cultural processes (e.g., "trauma shaped collective aspirations"), or historical evidence for the intermediate step is absent/weak.  
  *   **Judgment Call:** Assessing "plausibility" without historical expertise. Focus on logical coherence and consistency with *basic* historical facts (e.g., "Could this labor system realistically suppress skills? Was there market access for entrepreneurs then?").  

  **STEP 3: HAS THE MECHANISM PERSISTED? (60 min - CRITICAL STEP)**  
  *   **Question:** Could this *specific* mechanism plausibly operate *today*? Have key enabling conditions changed?  
  *   **Sufficient Answer:** Evidence that the *direct outputs* of the historical mechanism persist and remain causally potent *independently of later factors*.  
      *   *Your Unit's Rule Tested Here:* "Can we name the mechanism's **outputs** (not just inputs) and show they *still causally influence Y today*?"  
  *   **Analysis:**  
      a. **Identify Mechanism Outputs:** What *tangible thing* did the mechanism produce? (e.g., "Land tenure system (X) → *fragmented land titles* (Output) → discourages investment → lower productivity (Y)").  
      b. **Check Persistence:** Do these outputs *still exist* in the relevant region? (e.g., Are land titles *still* fragmented in Region Y today? Is this fragmentation *traceable* to the colonial system?).  
      c. **Check Current Potency:** Is there *contemporary evidence* (not historical analogy) that these outputs *still cause* Y? (e.g., Do firms *today* cite fragmented titles as a barrier? Is there micro-evidence linking title fragmentation to underinvestment *now*?).  
  *   **Stop with "No":** Mechanism outputs no longer exist (e.g., major land reform occurred), or contemporary evidence shows they no longer affect Y.  
  *   **Stop with "Cannot Know":** Outputs exist but their *current causal potency* is unclear (e.g., fragmented titles exist, but other barriers dominate), OR persistence relies on an unverified "cultural" transmission story.  
  *   **Handoff to Values/Politics:** If outputs persist and are potent, but intervention is ethically/politically fraught (e.g., overriding "traditional" systems).  
  *   **Judgment Call:** Major. Requires inferring persistence without deep local knowledge. Look for *discontinuities in outcomes or institutions* coinciding with known historical disruptions (independence, war, policy reform).  

  **STEP 4: IS THE INTERVENTION PRECISE AND SAFE? (30 min)**  
  *   **Question:** Would the proposed program *directly* target the persistent mechanism output *without major unintended consequences*?  
  *   **Sufficient Answer:** Program design *specifically* addresses the identified output (e.g., land titling program *only* where fragmentation persists), with safeguards against foreseeable harms (e.g., elite capture, displacement).  
  *   **Stop with "No":** Program is misaligned (e.g., building roads to solve land title issues), or risks severe harm (e.g., undermining community governance without alternatives).  
  *   **Stop with "Cannot Know":** Program is novel, context differs significantly from where tested, or long-term risks are unpredictable.  
  *   **Handoff to Values/Politics:** Trade-offs are acknowledged (e.g., efficiency vs. equity, state authority vs. custom).  

  **STEP 5: IS THE ANALOGY STRONG (IF APPLICABLE)? (5 min)**  
  *   **Question (For Case 3-type claims):** Are the historical context, intervention, and target population *sufficiently similar* to justify extrapolation?  
  *   **Sufficient Answer:** Key contextual factors (institutions, economy, technology), intervention design, and population characteristics are closely matched.  
  *   **Stop with "No":** Critical differences exist (e.g., 19th-century cash transfer vs. digital payment in modern economy).  
  *   **Stop with "Cannot Know":** Some similarities exist, but key differences are unquantifiable (e.g., role of social networks then vs. now).  

  ---

  **Assessment of Your Current Draft & Unit Rule**  
  *   **Three Questions (Correlation, Mechanism, Actionable):**  
      *   **Where it goes wrong:** Fatally permissive on **persistence** (Step 3). A historical correlation with a plausible mechanism *proves nothing about current relevance*. This lets through claims where the mechanism died decades ago.  
  *   **Unit Rule ("Mechanism Inputs Must Still Exist"):**  
      *   **Soundness:** Necessary but **insufficient**. Focuses on the *wrong part* of the mechanism.  
      *   **Wrongly Rejects:** Cases where *inputs* changed but the *outputs* persist (e.g., colonial administrators gone, but the land titles they created remain potent).  
      *   **Wrongly Accepts:** Cases where *inputs* exist but the *causal link to Y is broken* (e.g., "corrupt institutions" exist but are now irrelevant due to globalization), or where inputs exist but the *output* is different.  
      *   **Fix:** The rule should focus on **persistent, causally potent outputs** (Step 3b/c), not inputs.

  ---

  **Application to Cases**  

  **Case 1: Colonial Land-Tenure Regime → Regional Income Gap (RD Design)**  
  1.  **Robust Correlation?** Likely **YES** (RD often handles geography). Check if boundary balanced pre-colonial factors (soil, population).  
  2.  **Plausible Mechanism?** **YES** (e.g., tenure system → insecure property rights → underinvestment).  
  3.  **Mechanism Persisted?** **CRITICAL STEP.**  
      *   *Outputs:* Fragmented/insecure land titles?  
      *   *Persistence:* Did post-independence reforms (land redistribution, customary law revival) break the link? If *no major disruption*, **persists**. If major reforms occurred, **Cannot Know** (without knowing if colonial titles *still* matter).  
      *   *Current Potency:* Do titles *still* affect investment *today*? (Look for contemporary surveys/firm data). If yes → **Actionable** (if program targets titles). If no evidence → **Cannot Know**.  
  4.  **Intervention Precise?** If titling/registry program → **YES**.  

  **Case 2: Culture (Trust) → Firm Underinvestment**  
  1.  **Robust Correlation?** **Unclear.** Trust surveys may reflect *current* economic conditions (reverse causality). Controls for *current* income/education? If not → **Cannot Know/No**. If yes → proceed cautiously.  
  2.  **Plausible Mechanism?** **YES** logically (low trust → higher transaction costs → less investment).  
  3.  **Mechanism Persisted?** **Cannot Know.**  
      *   *Output:* "Low trust" is the *putative mechanism output*, but its origin is vague.  
      *   *Persistence:* Cannot verify if "low trust" is a *persistent historical legacy* or a *consequence* of recent shocks/policies. No clear link to a specific, measurable historical X.  
      *   *Current Potency:* Even if trust matters today, we **cannot know** if it's a *fundamental historical cause* or an epiphenomenon.  
  4.  **Intervention?** **Cannot Know** (Root cause unverifiable). Program might target trust, but justification is weak historically.  

  **Case 3: Cash Transfer Long-Run Effects (Historical Analogy)**  
  1.  **Analogy Strength?** **Check key differences:**  
      *   Scale/Design of transfer?  
      *   Economic/Technological context? (e.g., agrarian vs. digital economy).  
      *   Social Safety Net alternatives?  
      *   Measurement of "long-run"? (20 yrs vs. 50 yrs?).  
      *   If major differences → **Cannot Know** or **No**. If very close match → **Actionable** (with monitoring).  

  ---

  **Confidence & Weakest Step**  
  *   **Confidence:** **Moderate-High (70%).** The procedure targets the biggest holes in historical policy claims (persistence, confounders, mechanism specificity) with minimal time. It will reliably catch the *worst* claims and flag speculative ones as "Cannot Know."  
  *   **Weakest Step:** **Step 3 (Mechanism Persistence).** Judging whether historical outputs *still* matter today with no local archives/context is inherently risky. It relies heavily on identifying *major* disruptive events (wars, reforms) and scraps of contemporary evidence. This step is most vulnerable to missing subtle institutional decay or contextual shifts. **Mitigation:** Prioritize claims where contemporary data (firm surveys, administrative records) can cross-verify the persistent output's potency.

  This procedure prioritizes **avoiding harm** from acting on false historical certainty. It accepts that many claims will be "Cannot Know" under your constraints – which is a strength, not a weakness.
