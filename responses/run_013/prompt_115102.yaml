answer: |-
  **Joke:**  
  Three economists must choose a restaurant: Italian, Chinese, or Thai.  
  Alice: "I rank Italian > Chinese > Thai."  
  Bob: "Thai > Italian > Chinese."  
  Chloe: "Chinese > Thai > Italian."  
  Alice: "With three options, any voting rule lets someone lie to get a better outcome. Let’s avoid that: pick a voter uniformly at random to decide."  
  (They draw straws; Chloe wins.)  
  Chloe: "Chinese it is!"  
  Bob: "But I hate Chinese! Maybe we should’ve risked the lying..."

  **Explanation:**  
  The joke exploits the escape route of **using a lottery** (specifically, random dictatorship) to achieve strategy-proofness, as highlighted by the Gibbard-Satterthwaite theorem. In random dictatorship, truth-telling is a dominant strategy because each voter optimizes only if selected as dictator, removing incentive to misreport. However, the punchline underscores the trade-off: while manipulation is avoided, the outcome may be Pareto-inefficient or unpopular (Bob’s dismay).  

  A reader missing this might interpret the joke as merely complaining about randomness or unfair outcomes. But the humor hinges on the theorem’s structure—random dictatorship dodges manipulability by relaxing determinism (via lotteries), a key nuance a voting theorist would recognize. If the setup involved only two restaurants, the punchline would collapse, as majority vote would suffice without manipulation or lottery trade-offs.
