answer: |-
  Your diagnosis is perceptive: the impasse arises because "cyclical" and "linear" function as conceptual umbrellas covering distinct (though related) claims. The disagreement isn't monolithic; it's a tangle of substantive, verbal, and methodological threads. Here's a breakdown based on what each side *emphasizes*:

  **I. Deconstructing the "Cyclical" Claim (What They Actually Assert):**

  1.  **Patterned Recurrence of *Types*:** Polybius (anacyclosis) and Ibn Khaldun (asabiyyah → civilization → luxury → decay) observe recurring *kinds* of processes: institutional decay, elite corruption, shifts in social cohesion, responses to environmental stress, modes of legitimacy crisis. They argue these *dynamics* reappear because core human drives (ambition, fear, desire for security/status, response to scarcity) interacting with power structures generate analogous situations. *This is their strongest, most defensible claim.*
  2.  **Formal Structural Analogy:** Spengler (organic lifecycles: spring/summer/autumn/winter of cultures) and Toynbee (Challenge-and-Response leading to Growth/Breakdown/Disintegration) propose formal patterns. Collapse looks similar *structurally* across cultures (e.g., internal strife, external pressure, loss of creative vitality) even if the specific content differs. They see history as a gallery of variations on fundamental themes of social organization and decay.
  3.  **Predictive *Tendency*, not Destiny:** Cyclicalists (especially Polybius, Ibn Khaldun) often imply that societies *tend* to follow these paths *if* underlying conditions (human nature, power dynamics) persist. It's probabilistic, not deterministic. They argue ignoring these patterns invites disaster.
  4.  **Denial of *Meaningful* Cumulative Direction:** They reject the idea that later stages represent fundamental, irreversible *improvement* in the human condition or social organization. Technology changes, but core problems (power struggles, inequality, hubris) recur. Collapse resets the board. "Progress" is local and ephemeral.

  **II. Deconstructing the "Linear" Claim (What They Actually Assert):**

  1.  **Irreversibility & Novelty:** Linearists stress that time moves forward irreversibly. Specific events (Industrial Revolution, discovery of germ theory, development of nuclear weapons, universal suffrage movements) create genuinely *new* conditions, constraints, and possibilities that permanently alter the context for all future action. There is no "return."
  2.  **Cumulative Capacity (Often = "Progress"):** Enlightenment thinkers (Condorcet) and later emancipatory theorists (Marx, some feminists) emphasize cumulative *capacities*: scientific knowledge, technological capability, productive forces, institutional frameworks for rights (however imperfectly realized), expanding moral circles. Later societies possess tools and conceptual frameworks unavailable to earlier ones.
  3.  **Directionality with Purpose/Meaning:** Providential history (Augustine) sees divine purpose. Hegel sees the unfolding of Spirit/Reason. Marx sees the necessary progression towards communism. Emancipatory narratives see struggle towards greater freedom/equality. History isn't random; it has a *telos* (purpose/end goal) or at least a directional vector driven by learning or inherent logic.
  4.  **The Superficiality of "Recurrence":** Linearists argue that apparent "recurrences" (e.g., wars, famines, revolts) are superficial. The *causes*, *scale*, *consequences*, and *meaning* of a 21st-century famine or war are fundamentally different from an ancient one due to technology, global interdependence, political ideologies, and historical consciousness itself. Analogy is misleading.

  **III. The Nature of the Disagreement & Why it Stalls:**

  1.  **Substantive Disagreements:**
      *   **Human Nature & Malleability:** Cyclicalists lean towards a more constant core human nature driving similar responses to similar pressures. Linearists emphasize human adaptability, learning, and the profound shaping of "nature" by changing material/cultural conditions.
      *   **Novelty vs. Recurrence:** What *counts* as genuine novelty? Is the internet truly novel, or just a faster form of communication amplifying old dynamics (gossip, commerce, propaganda)? Cyclicalists see the latter, linearists the former. *This is fundamental and hard to adjudicate.*
      *   **The Scale & Locus of "History":** Cyclicalists often focus on large-scale civilizational structures (empires, dominant cultures). Linearists often focus on cumulative human capabilities or specific trajectories (science, rights). They are often looking at *different things*.
      *   **Predictability/Possibility of Learning:** Cyclicalists see patterns allowing for probabilistic prediction/avoidance of pitfalls. Linearists see genuine novelty making prediction much harder and emphasize learning *from* history to create new futures, not just avoid old collapses.

  2.  **Verbal Disagreements (Your Hypothesis Confirmed):**
      *   **"Cycle":** Literal repetition? Recurrence of types? Formal structural analogy? Spiral? The term is overloaded.
      *   **"Linear":** Simple irreversibility? Cumulative improvement? Inevitable progress? Purposive direction? These are distinct.
      *   **"Progress":** Technological capacity? Moral improvement? Increased complexity? Greater well-being? Rarely defined, often conflated. The cyclical side often attacks a crude "inevitable progress" strawman the linear side doesn't always hold.
      *   **"Recurrence"/"Repetition":** Is the fall of Rome "the same" as the potential fall of a modern state? Cyclicalists say "yes" at the structural/dynamic level. Linearists say "no" at the concrete historical level. They are using different definitions.

  3.  **Hidden Empirical/Methodological Questions:**
      *   **What Counts as an Analogy?** How similar must events/processes be to count as "recurrence"? (e.g., Is the decline of the Han Dynasty analogous to the decline of the British Empire? Why/why not?)
      *   **The Problem of Scale:** Zoom out far enough (centuries/millennia), and cyclical patterns *seem* stronger. Zoom in (decades/years), and contingency, agency, and novelty dominate. Which scale is "true" history?
      *   **The Starting Point:** Cyclical models often start from a perceived "peak" or stable state. Linear models often start from a "low" point (ignorance, oppression). This biases the narrative.
      *   **Confirmation Bias & Selection:** Both sides can cherry-pick examples. Cyclicalists point to collapses (Rome, Mayans). Linearists point to breakthroughs (Enlightenment, abolition, suffrage).

  4.  **Different Implicit Questions:**
      *   **Cyclicalists:** "What are the enduring patterns and pitfalls of human social organization?" (Descriptive/Predictive)
      *   **Linearists:** "What is the trajectory and meaning of human development?" or "How can we learn from the past to build a better future?" (Normative/Teleological/Emancipatory)
      *   **Cyclicalists** ask "What *is*?" (patterns). **Linearists** often ask "What *should be*?" (direction/progress) or "What *has been built*?" (cumulative capacity).

  **IV. Diagnosis of the Impasse & Paths Forward:**

  *   **The Impasse is Real and Partly Structural:** The disagreement touches on deep philosophical questions about time, human nature, causality, and the possibility of meaning in history. It's not *just* verbal confusion or lack of evidence; it's about fundamental frameworks for interpreting the human experience. **The question ("Is history cyclical or linear?") is ill-posed because it bundles distinct claims.**
  *   **Signs of Being Ill-Posed:** The sides talk past each other, agree on facts but disagree on interpretation, use key terms ambiguously, and seem to have different underlying concerns (prediction vs. meaning). Stalling is a symptom.

  **V. What Counts as Progress in the Debate:**

  1.  **Precise Taxonomy & Disambiguation (Essential First Step):** Explicitly define terms. Separate:
      *   Temporal irreversibility.
      *   Recurrence of event/dynamic *types*.
      *   Literal repetition.
      *   Structural/formulaic patterns (lifecycles).
      *   Cumulative capacity/knowledge.
      *   Moral/social improvement.
      *   Purposive direction/meaning.
      *   Probability vs. determinism.
  2.  **Distinguish Recurrence from Repetition:** Agree that *literal* repetition is impossible (time is irreversible). Focus the debate on whether *sufficiently analogous* processes/events recur *despite* changed contexts. What constitutes a "sufficient analogy"?
  3.  **Identify Testable Claims about Recurrence:** Instead of grand theories, focus on specific dynamics. Can we find robust evidence for recurring patterns in *specific areas* (e.g., elite overproduction & revolution; climate stress & migration; technological disruption & social instability)? Look for mechanisms, not just outcomes.
  4.  **Change the Question:**
      *   "Under what conditions do *which kinds* of historical patterns tend to recur, and where does genuine novelty dominate?"
      *   "To what extent do cumulative capacities (tech, knowledge, institutions) alter the *expression* of fundamental human/social dynamics, rather than eliminating them?"
      *   "What can we *learn* from apparent recurrences without denying historical uniqueness?"
  5.  **Acknowledge the Frameworks' Purposes:** Recognize that cyclical models are often diagnostic/prescriptive (avoiding decline), while linear/progressive models are often aspirational/motivational (building a better future). They serve different, potentially complementary, functions.
  6.  **Accept Limited Scope:** Perhaps no single model explains *all* of history. Different frameworks illuminate different aspects. The "truth" may lie in the tension between recurring dynamics and irreversible novelty.

  **Conclusion:**

  The impasse stems from conflating distinct concepts ("cyclical" as recurrence, pattern, structure; "linear" as irreversibility, cumulation, progress, purpose) and from answering different questions (description/prediction vs. meaning/direction) under the same label. Progress requires disentangling these threads. Start by rigorously defining terms and scoping questions narrowly. Acknowledge that both perspectives capture *aspects* of the complex, multi-layered reality of historical time: the weight of enduring patterns *and* the reality of irreversible change and cumulative potential. For your novel, this complexity is likely more fruitful than choosing a side – explore how characters grapple with the tension between the seemingly eternal cycles of human passion and power, and the startling novelty of their specific moment within an irreversible flow of events.
