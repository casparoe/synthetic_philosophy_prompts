  I recall that Kolmogorov complexity provides perfect tools here. The key insight is that randomness isn't absolute but depends on the descriptive framework. For the example... ah, binary representations of numbers work well! Take the number 1/3 which is 0.010101... in binary. Under its fractional description it's clearly patterned, but if I describe it by its binary digits without context, each digit appears "random" in isolation.

  But the user asked for opposite credences... better use a more dramatic example. The Thue-Morse sequence is perfect - it has maximum Kolmogorov complexity when described digit-by-digit, but admits a simple recursive definition. Under the first description we'd think it's random, under the second we see its deterministic nature.

