answer: |-
  You've put your finger on the fundamental flaw in the object-level interpretation of the Principle of Indifference/Insufficient Reason as applied to complex mathematical truths. Your friend's view – that the digit *itself* is objectively random – is a persistent illusion. The defensible core is indeed epistemic and language-relative: **the *absence of a discoverable reason* for dependence, within a fixed descriptive framework and bounded computational resources.** Here's the case, built step-by-step:

  **1. The Core Argument: Relativity to Description Language**

  *   **Mathematical Truth is Deterministic:** Pi's digits are fixed. The n-th digit *is* whatever it is. There is no inherent "randomness" or "probability" in the mathematical fact itself. Probability enters only as a model of *our ignorance*.
  *   **Independence is Always Relative to a Partition:** Assigning a uniform 50% credence to "digit n = 7" vs "digit n ≠ 7" presumes these two possibilities are equally likely *given no further distinguishing information*. This "no further information" is crucial and depends entirely on *how we describe the situation*.
  *   **Descriptions Encode Information:** The way we *refer* to the digit encodes implicit information. If our description language allows us to compactly express patterns or dependencies, then those dependencies become visible, and the uniform credence breaks down. If the language *hides* those dependencies, the uniform credence seems reasonable.
  *   **The "Principle" is a Bounded Rationality Heuristic:** The principle amounts to: "Given my current knowledge state, encoded in this specific description, and given I cannot find any short argument/certificate proving dependence or bias within my computational limits, I will provisionally model this unknown binary outcome as a fair coin flip *as a best-guess heuristic*." Its strength lies solely in the *absence of discovered dependence*, not in any inherent property of the digit.

  **2. The Toy Case: The Self-Describing String**

  Consider the following binary string **S**: `101001000100001000001...` (One '1', followed by one '0', followed by two '1's, followed by two '0's, followed by three '1's, etc.).
  Now, consider two equally natural ways to describe it:

  *   **Description D1 (Positional):** "The binary string S, where bit position *n* (starting at 1) is..."
      *   *Analysis under D1:* Looking at an arbitrary bit position *n*, what's P(bit *n* = 1)? The string is highly structured, but that structure isn't *visible* in the simple description "bit *n* of S". Without knowing the global rule, finding a short certificate predicting bit *n* based solely on *n* is non-trivial for an arbitrary *n*. The sequence appears complex and irregular locally. A bounded reasoner might reasonably assign ~50% credence to "bit *n* = 1" vs. "bit *n* = 0" for a large, unknown *n* under this description, lacking a quick dependence proof.
  *   **Description D2 (Generative):** "The binary string formed by concatenating blocks: block *k* consists of *k* repetitions of '1' followed by *k* repetitions of '0', for k=1,2,3,..."
      *   *Analysis under D2:* The dependence is screamingly obvious! Given *n*, we can efficiently calculate which block *k* it falls into and whether it's in a '1'-subblock or a '0'-subblock. For example, if *n* falls within the '1'-subblock of its *k*-block, P(bit *n* = 1) = 1; if within the '0'-subblock, P(bit *n* = 1) = 0. The uniform 50% credence is utterly indefensible under this description. The outcome is perfectly predictable/dependent.

  **The Contradiction:** The *same string* **S** is described. Under D1, a bounded reasoner might justifiably (given their constraints and the description) use the "presumption of independence" heuristic and assign ~50% credence to bit *n* being 1. Under D2, assigning anything other than 0% or 100% credence (once *k* is located) is irrational. **The credence assignment depends entirely on the descriptive framework used to present the unknown bit, not on any intrinsic property of the bit itself.**

  **3. What Survives of the Heuristic-Arguments Programme? (An Honest Assessment)**

  It doesn't *collapse* into mere "we're uncertain because we're bounded," but it forces a significant and humbling evolution:

  1.  **Death of Objective Mathematical Probability:** The idea that complex mathematical facts have *intrinsic probabilities* (like 50% for the digit being 7) is untenable. Probability is fundamentally a tool for reasoning under *epistemic* uncertainty, not a property of platonic truths.
  2.  **Bounded Rationality is Central:** The core justification for heuristic arguments like the presumption of independence *is* our boundedness. We *must* use heuristics because exhaustive search for dependencies is impossible. The principle survives as a *pragmatic tool for bounded agents*.
  3.  **The Real Work Shifts to Description Choice:** The critical task is no longer "justifying the 50% credence for the digit" but **choosing and justifying the descriptive framework** within which we ask the question. This is deep, subtle, and context-dependent:
      *   **Naturalness:** Is the description "natural" given the context? (e.g., describing the pi digit by its position in pi is more natural than an arbitrary encoding).
      *   **Revealing Power:** Does the description tend to make relevant structures or dependencies *discoverable* by our bounded reasoners? (D2 was highly revealing; D1 was obscuring).
      *   **Stability:** Does the heuristic tend to give stable, useful results under this description across different instances?
      *   **Meta-Heuristics:** We develop heuristics *for choosing descriptions*. E.g., "Prefer descriptions that are concise and align with known symmetries or generating mechanisms of the domain."
  4.  **Heuristic Arguments are Still Vital (But Fragile):** They survive as essential tools. We *need* ways to manage uncertainty about complex, incomputable truths. The presumption of independence, applied judiciously within a well-chosen descriptive framework, remains a powerful starting point. **One heuristic argument is better than another if:**
      *   It operates within a description language empirically known to be more reliably *revealing* for the problem domain.
      *   It has a stronger track record of producing useful, non-misleading results under computational constraints.
      *   It acknowledges its own epistemic fragility and language-relativity.
  5.  **"Better" is Grounded in Success, Not Truth:** We can't say heuristic A is "closer to the true probability" (as there isn't one). We *can* say heuristic A, used within description language L, has historically led to more successful predictions, more efficient problem-solving, or more robust theories *for bounded agents like us* than heuristic B in language M, *especially when the dependency structures relevant to the problem are often compactly expressible in L but not in M*.

  **Conclusion:**

  Your friend is mistaking a powerful, necessary *epistemic heuristic* for bounded reasoners grappling with complexity for a metaphysical fact about mathematical objects. The toy case proves that the same object can demand wildly different credences based solely on how it's described. The "presumption of independence" isn't about the digit of pi being a fair coin; it's about *us* lacking, within our chosen descriptive framework and computational limits, a short proof that it's biased. The principle survives, but only as a pragmatic tool whose validity is entirely contingent on the suitability of the descriptive language we adopt. The real intellectual heavy lifting shifts from justifying uniform priors over mathematical facts to the nuanced task of selecting and defending descriptive frameworks that make our heuristics reliable guides for navigating uncertainty. It becomes a question of which maps (descriptions) and compasses (heuristics) best help bounded explorers navigate specific terrains of ignorance.
