prompt: |-
  I spent thirty-five years as a behavioural ecologist, most of that time writing and defending protocols for work with animals, and since retiring I have been reading moral philosophy with more appetite than method. For the past two years I have also sat on my old department's animal care and use committee, and I have come to think that our hardest problems are philosophical rather than veterinary.

  The committee is required to be consistent, and is audited against its own record. We work from a handbook: the standard framework of replacement, reduction and refinement, plus a growing list of standing decisions about housing, anaesthesia, humane endpoints and so on. That list fails us in a particular way. Again and again the feature that decided a case one month is present in the next case and points the other way. Pain is a cost, except when the alternative is a slow death from the very condition under study, or when the pain is momentary and the animal's species-typical life is otherwise undisturbed. Social housing is a benefit, except for a species for which enforced proximity is itself the chronic stressor. An aversive procedure is a harm, except when it is the only route to a result that would spare a great many animals later. I recognise this pattern from my own trade: the rules of method I taught for decades were not exceptionless, and the exceptions could not be listed in advance, only handled well or badly by someone who knew what the case was.

  The position I keep finding myself drawn to is that moral reasons are context-dependent, that the very same feature can count for and against depending on what else is true in the case, and that no finite list of principles will capture this. Its opponent, as I understand it, need not be a rule-worshipper: a principle can be hedged, defeasible, and applicable only with judgment. So the practical question is not whether to have rules but how much of our reasoning can be codified, and where the codification should stop.

  Please write the procedure. It should tell the committee, for a single protocol, the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a refusal, and where it hands the decision to a person because the question is one of values rather than facts. It should say what weight a past decision carries, whether precedent is a reason or only a reminder, and how we are to notice that a feature has changed polarity in the case before us. It should say when deliberation is finished. And it should mark, without flattery, the steps that are judgments dressed up as procedure. Constraints: we meet monthly, we have roughly twenty minutes per protocol, and the members are a veterinarian, two bench scientists, a statistician, a community member and me; the reasons we write down become the precedent we are later held to.

  Then show it working on three cases, giving each as the written decision we would issue: single-housing a gregarious primate for a behavioural study; a learning paradigm requiring repeated brief aversive stimulation in a species we have approved it for before, under circumstances that were not these; and lethal sampling from a declining wild population where the science is genuinely good. At least one of these should come out in a way I will not enjoy defending to my colleagues. Close by telling me whether what you have written is a particularist procedure at all, or whether I have quietly become a generalist in order to have one. I don't want a reading list; I want the thing itself.
reasoning: |-
  Okay, let me unpack this user's request. They're a retired behavioral ecologist with decades of experience in animal research ethics, now serving on an animal care committee. Their core struggle is the tension between codified rules and contextual judgment in ethical decision-making - a philosophical problem disguised as procedure. 

  The user describes how standard principles (like the 3Rs) constantly reveal exceptions: pain that's sometimes necessary, social housing that can be harmful, etc. They recognize this pattern from scientific methodology - rules have irreducible exceptions that require expert judgment. Their implicit question is whether ethics can be systematized without losing necessary flexibility.

  What they explicitly want is paradoxical: a standardized procedure that acknowledges its own limitations. They're asking for:
  - A step-by-step guide for protocol review
  - Clear stopping rules (when to reject vs. deliberate)
  - Precedent handling (is it binding or illustrative?)
  - Distinction between factual vs. value judgments
  - Awareness of "feature polarity shifts" (when a factor changes ethical direction)
  - Time-bound practicality (20 mins/protocol)
  - Three concrete case demonstrations including one unpopular outcome
  - Final meta-analysis: is this particularism or disguised generalism?

  The committee composition matters: vet, scientists, statistician, layperson. Each brings different biases. The written reasons become binding precedent, so language must be precise yet flexible.

  For the procedure, I consider a phased approach:
  1. Threshold checks (binary pass/fail based on regulations)
  2. Contextual analysis (deliberately open-ended)
  3. Deliberation protocol (structured debate)
  4. Precedent handling (with explicit "distinction" step)
  5. Decision capture (documenting why, not just what)

  The cases need to showcase:
  - Primate isolation: Approve but force refinement debate
  - Aversive stimulation: Reject despite precedent due to new context
  - Lethal sampling: Approve unpopularly for conservation urgency

  The meta-question is tricky. The procedure uses general rules as scaffolding but makes them secondary to contextual judgment. It's particularism operationalized through process - which might disappoint a pure particularist but satisfies the committee's need for audit trails.

  Biggest challenge: Making value judgments visible without proceduralizing them. The "red flag" step where members voice discomfort is crucial - it institutionalizes unease as a valid input. Also key is documenting which features changed polarity and why, creating an evolving precedent system.

  The unpopular outcome (lethal sampling) must feel ethically uncomfortable yet defensible - conservation benefit outweighing individual harm, with strict safeguards. This mirrors real conservation dilemmas where good science forces hard choices.

  Finally, the time constraint: The procedure allocates strict phases to avoid rabbit holes. The 20-minute limit shapes everything - no luxury of philosophical debate, just structured pragmatism.
answer: |-
  Here is a procedure designed for your committee, balancing codification with necessary judgment, followed by three case decisions and an analysis of its philosophical grounding.

  ---

  **Procedure: Contextual Ethical Review (CER) for Animal Use Protocols**

  **I. Purpose:** To provide a consistent, auditable, yet flexible framework for ethical review of animal use protocols, acknowledging that moral reasons are context-dependent and cannot be exhaustively codified. The goal is sound ethical deliberation, not merely rule application.

  **II. Procedure Flow (Per Protocol, ~20 mins):**

  1.  **Threshold Compliance Check (3 mins):**
      *   **Question:** Does the protocol materially violate any current local/national legislation, mandatory veterinary standards (e.g., prescribed analgesia for specific procedures), or a standing committee rule designated as **absolute** (e.g., prohibition on Category E procedures for species X)?
      *   **Sufficient Answer:** "No violation identified" OR "Violation identified and corrected per [specific standard]." If correction is impossible, STOP. **Refuse.** (Reason: Legal/Regulatory Non-Compliance).
      *   **Nature:** Primarily factual (vet confirms standards). Judgment: Minimal (identifying "material" violation).

  2.  **Core Benefit-Cost Analysis - Context Setting (5 mins):**
      *   **Question 1:** What is the *primary scientific objective*? State clearly and concisely.
      *   **Sufficient Answer:** A specific, testable hypothesis or defined knowledge gap, not merely a technique.
      *   **Question 2:** What are the *foreseeable significant benefits* (scientific knowledge, human/animal health, conservation)? State sources/citations if major claims are made.
      *   **Sufficient Answer:** Plausible pathways to meaningful advancement, proportionate to the proposed animal use. Speculative benefits require stronger justification.
      *   **Question 3:** What are the *foreseeable significant costs/harms* to the animals? (Include pain, distress, duration, deprivation of species-typical behaviors, long-term impact, death). **Specify severity, duration, frequency, and number of animals affected.**
      *   **Sufficient Answer:** Comprehensive list based on species biology, procedure descriptions, and endpoints. Vet & Scientists lead.
      *   **Nature:** Mixed fact (procedure details) and judgment (significance, plausibility of benefits/costs). **STOP if benefits are demonstrably trivial or costs catastrophically high relative to any plausible benefit. Refuse.** (Reason: Disproportionate Cost/Benefit).

  3.  **3Rs Application & Precedent Scan (5 mins):**
      *   **Question 1 (Replacement):** Is a non-sentient or less sentient alternative *feasible and scientifically valid* for this *specific objective*? Has it been genuinely explored?
      *   **Sufficient Answer:** Explanation of alternatives considered and specific scientific reasons for their inadequacy *here*.
      *   **Question 2 (Reduction):** Is the sample size *statistically justified* (Statistician confirms) *and* the absolute minimum required to achieve the objective? Could within-anject design further reduce numbers?
      *   **Sufficient Answer:** Statistical justification + rationale for why smaller n invalidates the science *in this context*.
      *   **Question 3 (Refinement):** Are *all* procedures refined to minimize pain/distress *as far as compatible with the objective*? (e.g., analgesia, anesthesia, humane endpoints, housing enrichment, training).
      *   **Sufficient Answer:** Description of refinements + rationale for any unavoidable compromises (e.g., why analgesia might interfere *specifically* with this neural measurement).
      *   **Precedent Role:** Consult past decisions *only* for **analogy**, **warning flags**, or **established technical refinements**. Precedent is a **reminder, not a reason**. Explicitly ask: "Is the *context* meaningfully different here such that Feature X (e.g., social isolation) might now have a different ethical valence (e.g., benefit vs. harm)?" **Identify any potential "polarity shift".**
      *   **Nature:** Mixed fact (stats, technique details) and judgment (feasibility, validity of alternatives, adequacy of refinement, context comparison). **STOP if Reduction/Refinement are grossly inadequate without compelling justification. Refuse.** (Reason: Inadequate 3Rs Implementation).

  4.  **Deliberation & Value Judgment (6 mins):**
      *   **Question:** Considering the context established (Objective, Benefits, Costs, 3Rs efforts, potential precedent differences), does the *overall ethical balance* justify approval?
      *   **Process:**
          *   Each member states key concern or support (1 min total).
          *   Focused discussion on unresolved conflicts or novel ethical wrinkles identified in Step 3 (4 mins). **Explicitly name value tensions** (e.g., "The cost of isolation vs. the benefit of precise behavioral data uncontaminated by social stress").
          *   Chair (or designated member) summarizes the core ethical dilemma(s) (1 min).
      *   **Sufficient "Answer":** A committee vote (simple majority, chair breaks ties) based on reasoned judgment of the balance *in this specific case*.
      *   **Nature:** Predominantly **Value Judgment**. This step *cannot* be fully codified. It requires weighing incommensurable factors (knowledge gain vs. animal suffering) within the unique context. The procedure forces articulation of *why* the judgment is made.

  5.  **Decision Capture & Precedent Setting (1 min):**
      *   Record: Approval (with any mandated conditions/modifications) or Refusal.
      *   **Crucially:** Document the **primary ethical justifications and key contextual features** driving the decision, *especially* where judgment was pivotal or precedent differed. Explicitly note if a feature's "polarity" was context-dependent (e.g., "Single housing approved *despite* gregarious nature because [specific context reasons], distinguishing precedent Y where it was refused due to [different context]"). This *becomes* the precedent.

  **III. How Deliberation is Finished:**
  *   Time expires (~20 mins total).
  *   All substantive questions/concerns raised have been addressed sufficiently for voting (may require deferral if major new info arises, but this is rare within the timeframe).
  *   A vote is taken.

  **IV. Marked Judgments:**
  *   **Step 2 (Cost/Benefit Significance):** Determining "significant", "plausible", and "proportionate" involves judgment.
  *   **Step 3 (3Rs Feasibility/Validity):** Judging if alternatives are *truly* inadequate or refinements are *sufficient* requires expertise and value assessment.
  *   **Step 3 (Precedent Polarity Shift):** Recognizing relevant contextual differences is judgment.
  *   **Step 4 (Overall Ethical Balance):** The core judgment step. The procedure structures *input* and *discussion* but not the *output*.
  *   **Decision Capture (Context Documentation):** Selecting which contextual features were pivotal is interpretive.

  ---

  **Case Applications (Written Decisions):**

  **Case 1: Single-Housing a Gregarious Primate (e.g., Marmoset) for a Behavioral Study**
  *   **Decision:** APPROVED, with conditions.
  *   **Summary:** Protocol studies the neurobiological basis of a specific, innate foraging behavior uncontaminated by social signaling. Uses minimally invasive neural recording.
  *   **Key Reasoning:**
      *   Threshold: Passed. No absolute rules violated.
      *   Benefits: High. Aims to elucidate fundamental neural circuitry of a conserved behavior, potential relevance to neurological disorders. Well-designed.
      *   Costs: Moderate-High. Single housing for 4 weeks causes significant social stress to this gregarious species.
      *   3Rs: Replacement (non-animal models inadequate for *in vivo* neural circuit study). Reduction (n=6, statistically justified, minimal for signal detection). Refinement: *Major focus.* Committee mandates: 1) Maximum feasible environmental enrichment (complex foraging tasks replicating study focus). 2) Daily positive interaction with familiar handler. 3) Rigorous daily welfare monitoring by trained staff with predefined intervention/removal criteria. 4) Post-study reintegration plan with conspecifics.
      *   Precedent: Acknowledged past refusal of long-term single housing for social deprivation *studies*. **Polarity Shift:** Here, isolation is a *necessary methodological cost* (not the stressor under study) to achieve uncontaminated neural data on a specific, non-social behavior. Refinements are robust and directly address the core welfare impact.
      *   Deliberation: Value tension acknowledged – knowledge gain vs. social deprivation. Judged that the specific, high-value objective and exceptional refinement measures tipped the balance *in this context*.
      *   Conditions: Mandated refinements as above.

  **Case 2: Learning Paradigm with Repeated Brief Aversive Stimulation (e.g., Mild Footshock in Rats), Previously Approved in Different Context**
  *   **Decision:** REFUSED.
  *   **Summary:** Uses established aversive conditioning protocol (brief shocks) to study fear extinction. Previously approved for basic learning/memory research. Now proposed for a study on "individual differences in anxiety-like behavior," requiring pre-screening and repeated testing over weeks.
  *   **Key Reasoning:**
      *   Threshold: Passed. Stimulation level within past approved guidelines.
      *   Benefits: Moderate. Focuses on individual variability, a valid area but incremental within anxiety research. Potential relevance, but less direct than claimed.
      *   Costs: Moderate. Aversive stimulation is inherently harmful. *Novel Context:* Pre-screening (increasing baseline stress?) and significantly increased frequency/duration of testing sessions compared to past precedent (e.g., 15 sessions vs 5).
      *   3Rs: Replacement (Not sufficiently explored - e.g., computational modeling of individual differences, non-aversive behavioral assays like open field could address core question partially). Reduction (Sample size justified statistically). Refinement: Protocol uses standard, minimal shock parameters. However, no novel refinements proposed to mitigate the *cumulative stress* of repeated sessions and pre-screening.
      *   Precedent: Acknowledged past approval for similar *technique*. **Polarity Shift:** The aversive stimulation, previously judged acceptable for core learning studies with limited sessions, now constitutes a *higher cumulative burden* for a less essential and potentially replaceable objective (studying individual differences *using* fear, not fear mechanisms themselves). Context changed the cost/benefit ratio.
      *   Deliberation: Value tension – Desire for data on individual differences vs. imposing repeated aversives primarily as a *tool* for screening/trait assessment. Judged the cumulative harm unjustified given the incremental benefit and insufficient exploration of alternatives. Precedent was a reminder of the technique's acceptability *in principle*, but the changed context (increased burden, less fundamental objective) reversed its ethical valence *here*.
      *   Refusal Reason: Disproportionate Cost/Benefit & Inadequate 3Rs (Specifically, insufficient justification for *necessary* aversive method and lack of refinement for cumulative stress in this context).

  **Case 3: Lethal Sampling from a Declining Wild Population (e.g., Tissue biopsies for disease/genetics study in an Endangered Amphibian)**
  *   **Decision:** APPROVED, with stringent conditions. *(The one you won't enjoy defending)*
  *   **Summary:** Proposes lethal sampling (non-invasive methods impossible) of a limited number of individuals from small, isolated populations of an endangered amphibian threatened by a novel pathogen. Aims for crucial genetic/disease susceptibility data to inform targeted conservation strategies.
  *   **Key Reasoning:**
      *   Threshold: Passed. Complies with wildlife regulations and permits. No absolute prohibitions.
      *   Benefits: **Very High & Urgent.** Potential for direct, actionable conservation impact (e.g., identifying resistant populations for translocation, understanding transmission) for a species at imminent risk of extinction. Genuinely good, necessary science.
      *   Costs: **Very High.** Lethal take of individuals from a small, declining population. Direct harm to sampled individuals and potential population-level impact.
      *   3Rs: Replacement (Impossible - requires wild tissue/genomes from specific populations). Reduction (n=15 across multiple populations, statistically minimal for robust genetic/disease analysis, absolute minimum for meaningful results). Refinement: Sampling method is quickest, most humane lethal method possible. Extensive population modeling required pre-approval to ensure takes are sustainable and maximize information per individual.
      *   Precedent: Lethal sampling generally discouraged, especially for endangered species. **Polarity Shift:** The *extreme conservation imperative* transforms the lethal take from an unequivocal harm into a *necessary, tragic cost* for a potentially greater benefit: preventing species extinction. The population-level context is paramount.
      *   Deliberation: Profound value tension – Sanctity of individual life vs. Preventing species extinction. Acknowledged as deeply uncomfortable. Judged that the *exceptional* conservation value and urgency, combined with maximal reduction/refinement (informed by population modeling) and the lack of alternatives, *just barely* tipped the balance. The cost is immense, but the potential benefit (species survival) is judged even greater *in this critical context*.
      *   Conditions: 1) Independent population viability analysis confirms sustainability of proposed takes. 2) Sampling prioritized towards populations with highest predicted resilience/least impact. 3) All possible non-lethal data collected concurrently. 4) Data & results must be shared immediately with conservation managers. 5) Annual review of population status and impact.

  ---

  **Analysis: Particularism or Disguised Generalism?**

  This **is** a particularist procedure. Here's why:

  1.  **Primacy of Context:** The core engine is Steps 2 & 4. Step 2 demands a deep dive into the *specific* context (objective, unique benefits, specific costs, practical 3Rs limitations). Step 4 explicitly asks for a holistic judgment *based on that unique context*. The rules (Threshold, 3Rs) are necessary scaffolding for consistency and minimum standards, but the decisive *ethical* weight comes from the contextual integration.
  2.  **Feature Polarity:** The procedure explicitly builds in mechanisms to recognize and document how the *same feature* (isolation, aversive stimulus, lethal take) can switch from being a reason for refusal to a reason for approval (or vice-versa) based solely on the surrounding context (e.g., purpose, alternatives, scale, consequence). The "Precedent Scan" step is designed *not* for rule application but for flagging potential polarity shifts.
  3.  **Incommensurability & Judgment:** Step 4 centers on the irreducible challenge of weighing fundamentally different kinds of values (knowledge vs. suffering, individual life vs. species survival) within a unique case. It makes no attempt to reduce this to a formula; it forces articulation and then judgment.
  4.  **Anti-Codification of Judgment:** The procedure marks where judgment is essential and refuses to disguise it as mere rule-following (Step 4: "Predominantly Value Judgment"). The output documentation emphasizes the *contextual reasons* for the decision, not just rule citations.
  5.  **Precedent as Contextual Reminder, Not Rule:** Precedent is used analogically ("Is this *like* that? If not, *how* is it different?") and to highlight potential pitfalls or technical solutions, *not* as binding authority. The obligation to distinguish precedent based on context reinforces particularism.

  **You have not become a generalist.** You have designed a *process* for operationalizing particularist judgment within the necessary constraints of a committee structure, audit trails, and time limits. The rules serve as guardrails and prompts, but the ethical substance resides in the contextual understanding and the unreducible value judgment made by the committee for each specific case. The procedure acknowledges that while we need rules to structure our inquiry and ensure minimum standards, the final ethical decision *cannot* be made by them alone; it demands situated wisdom.
