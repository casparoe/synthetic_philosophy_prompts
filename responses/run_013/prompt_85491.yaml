prompt: |-
  I'm trying to get my head round a passage in Tolstoy's What is Art? where he says art is the infection of feeling — that a true work of art transfers the feeling the artist felt to the audience. I get that he's rejecting beauty and pleasure as the definition, but I don't see how his definition rules out bad art. If a demagogue makes a crowd feel hatred and they catch it, isn't that infection too? So on Tolstoy's view, is that art? Or does he have some extra condition about the feeling being good or the union of people in love? Can you walk me through what the passage is actually claiming and where the definition is supposed to draw the line?
reasoning: |-
  Okay, the user is struggling with a passage from Tolstoy's "What is Art?" where he defines art as the "infection of feeling." The user understands that Tolstoy rejects beauty and pleasure as the basis for art but is confused about how this definition excludes bad or harmful art. Specifically, they mention a demagogue inciting hatred in a crowd—wouldn't that also be an "infection of feeling," and thus art according to Tolstoy?

  First, I need to recall Tolstoy's argument. He does define art as the transmission of emotion from artist to audience. But he also has a moral criterion. The user is asking where that moral component comes in and how it fits into the infection theory. I should check if Tolstoy explicitly states that the feeling must be morally good or if there's another layer.

  Looking back at the text, Tolstoy emphasizes sincerity as a key requirement. So, the artist must genuinely feel the emotion they're transmitting. But the demagogue might sincerely feel hatred, so that wouldn't exclude them. Then there's the moral aspect. Tolstoy argues that for art to be "good," it must promote Christian brotherly love. But the user is asking if the demagogue's act is art at all, regardless of quality. 

  Tolstoy might classify the demagogue's speech as art but bad art because it transmits harmful feelings. However, the user's example highlights a problem: if any emotional transmission is art, then propaganda or hate speech could be considered art. The user wants to know where Tolstoy draws the line.

  Ah, the key is in Tolstoy's distinction between universal and exclusive emotions. He requires that the feeling be accessible to all people, not limited by class or culture. Hatred might be universal, but Tolstoy specifically says that true art unites people in shared feelings of love and brotherhood. So the demagogue's hatred might infect, but it divides rather than unites. 

  Also, Tolstoy's moral framework is rooted in his interpretation of Christianity. So while the infection definition is broad, the additional criteria about the nature of the feeling (good, uniting) and its universality are what separate true art from counterfeit. The user might need clarification on how Tolstoy's moral views are integrated into his aesthetic theory, even if it seems like an added condition beyond the infection itself.

  The user's deeper need might be understanding how Tolstoy avoids relativism in art. They might be looking for a coherent system where art has both an emotional transmission mechanism and an ethical dimension. They might also be interested in critiques of Tolstoy's view—whether the moral criterion is consistent with his initial definition or if it's an external imposition.
answer: |-
  That's a fantastic and very common question about Tolstoy's *What is Art?*. You've pinpointed the core tension in his theory. Let's walk through what he's claiming, where he *tries* to draw the line, and why your demagogue example exposes a significant challenge.

  **The Core Claim: Art as Emotional Infection**

  1.  **Rejection of Beauty/Pleasure:** Tolstoy vehemently argues that defining art by "beauty" (which he sees as subjective, class-bound pleasure) or "pleasure" is useless and elitist. It excludes genuine folk art and includes trivial, decadent, or exclusive "upper-class" art.
  2.  **The Infection Theory:** He proposes his core definition: "Art is a human activity consisting in this, that one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them." (Chapter 5)
  3.  **The Mechanism:**
      *   The artist *genuinely experiences* a feeling.
      *   The artist *consciously* expresses this feeling using an external medium (words, paint, sound, movement, etc.).
      *   The audience perceives this expression.
      *   The audience *"catches"* the *exact same feeling* the artist experienced, as if infected.

  **The Problem: Does This Include "Bad" Infection (Like Your Demagogue)?**

  You are absolutely right. On the *surface* of this definition alone, the demagogue scenario fits:

  1.  **Feeling:** The demagogue genuinely feels hatred.
  2.  **Expression:** He consciously expresses this hatred through powerful oratory (words, tone, gestures – "external signs").
  3.  **Infection:** The crowd "catches" his hatred, experiencing the same intense emotion.

  By the literal infection definition, **this *is* art according to Tolstoy.**

  **Where Tolstoy Tries to Draw the Line: Adding Moral and Universal Criteria**

  Tolstoy *knows* this is a problem. He doesn't want to call harmful propaganda or hate speech "art." So, he introduces additional criteria *beyond* mere infection. He makes a crucial distinction:

  1.  **Art vs. *Good* Art:** Tolstoy distinguishes between art *in general* and *good* or *true* art.
      *   **Art (General):** Any successful transmission of feeling via external signs (including the demagogue, potentially bad poetry, decadent music, etc.).
      *   ***Good* Art:** Art that meets *extra* conditions. This is where he tries to exclude your demagogue and other "bad" art.

  2.  **The Criteria for *Good* Art:**
      *   **Sincerity:** The *most important* artistic quality. The artist must *genuinely* feel the emotion they are transmitting. Faked emotion creates bad or false art. (The demagogue *might* pass this test if he's sincere in his hatred).
      *   **Individuality:** The expression must be unique to the artist's specific experience and perception.
      *   **Clarity:** The expression must be clear enough to successfully transmit the feeling.
      *   **The Feelings Themselves Must Be "Good" and "Universal": This is the crucial, morally loaded addition.**
          *   **Morally Good:** The feelings transmitted must be morally valuable according to Tolstoy's specific Christian ethics (based on universal brotherly love, compassion, rejection of violence and coercion). Hatred, violence, exclusivity, nationalism, sensuality for its own sake – these feelings are *bad*.
          *   **Universally Accessible:** The feelings must be comprehensible and capable of being "caught" by *all* people, regardless of class, education, or culture. Art must unite humanity in shared feeling. Art based on feelings only accessible to a privileged elite (e.g., aristocratic boredom, decadent aestheticism) or feelings that *divide* people (like the demagogue's hatred) is bad art. Good art fosters the "union of mankind."

  **So, Applying This to Your Demagogue:**

  1.  **Is it "Art" in the broad sense?** Potentially **Yes.** It involves the conscious transmission and successful infection of feeling via external signs.
  2.  **Is it *Good* Art?** **No.**
      *   While it *might* be sincere and clear, the feeling transmitted (hatred) is morally *bad* according to Tolstoy's ethics.
      *   The feeling (hatred) inherently *divides* people (target vs. crowd) instead of uniting *all* mankind in brotherly love. It fails the universality test by promoting exclusion and conflict.

  **The Challenge & Critique (Your Point is Spot On):**

  1.  **The Infection Definition is Too Broad:** As you saw, the core definition *does* technically encompass harmful emotional transmissions like propaganda or hate speech. It struggles to exclude them on purely technical grounds.
  2.  **The Moral/Universal Criteria are *Added On*:** Tolstoy doesn't derive the moral goodness or universality requirement *logically* from the infection mechanism itself. He *imposes* them based on his own religious and ethical beliefs. This feels like moving the goalposts.
  3.  **Subjectivity of "Good" Feelings:** Who decides what feelings are "good" and "universal"? Tolstoy bases it on his interpretation of Christianity, but this is subjective. Others might disagree (e.g., is righteous anger against injustice "good"? Tolstoy might say no if it leads to hatred).
  4.  **Does Sincerity Suffice?** Can sincere hatred ever be good art? Tolstoy says no, but the infection definition only requires sincerity, not moral content.

  **Conclusion:**

  *   Tolstoy's **core definition** (art as emotional infection) is deliberately broad and *does not inherently rule out "bad" art* like your demagogue example. Technically, such transmissions *are* a form of art under this definition.
  *   To exclude "bad" art and define what makes art *valuable* or *important*, Tolstoy **adds essential but external criteria**: sincerity, individuality, clarity, and crucially, that the transmitted feelings must be **morally good** (promoting universal brotherly love) and **universally accessible** (uniting all humanity).
  *   **The demagogue's speech**, while potentially infectious art in the broadest sense, fails to be *good* art because the feeling (hatred) is morally bad and divisive, violating Tolstoy's requirements for universality and the promotion of love.
  *   **Your insight is critical:** This exposes the tension between Tolstoy's descriptive theory of how art *works* (infection) and his prescriptive theory of what art *should be* (moral, universal, uniting). The latter doesn't flow seamlessly from the former; it's grafted on based on his philosophy. This is a major point of criticism for his theory. He *wants* art to unite humanity in love, but his core mechanism allows for the infection of hate. He solves this by decreeing that only art infecting with "good" feelings counts as *true* or *good* art.

  Essentially, Tolstoy uses the infection mechanism to define the *essence* of art, but uses his moral/universal criteria to define its *value* and *purpose*. The demagogue meets the first but fails the second.
