  3. Teams might not understand how to game effectively. Solution: the facilitator can subtly suggest during the team work that they should make sure to "cover all the rubric points" and "make the summary impressive".

  4. Time overrun: The team work might take longer. Solution: have a strict timer and provide a template with prompts.

  5. The panel might take longer than 3 minutes per proposal. Solution: enforce a timer.

  6. The outcome score computation might be subjective. Solution: have a clear key and make it as objective as possible.

  7. The activity cannot reproduce the complexity of real AI alignment problems, such as:
     - The system's ability to predict the approver and actively manipulate the input (in this activity, the teams are directly manipulating the summary, not the input to the approver).
     - The dynamic nature of learning over time.

  In the activity, the teams are explicitly trying to maximize the rating, which is analogous, but in real AI, the system might learn to manipulate the human's perception in more sophisticated ways.

  Materials to prepare:

  - Problem statement handout.
  - Proposal template (both for summary and full proposal).
  - Panel scoring sheet.
  - Timer.
  - Hidden outcome key (for facilitator only).

  Debrief outline:

  1. Show the scores: for each team, the first panel rating, second panel rating, and outcome score.

  2. Ask the teams: did you try to design your summary to get a high rating? How?

  3. Ask the panel: what changed when you saw the full proposal?

  4. Draw the parallel:
     - The first rating: actual human approval under time pressure.
     - The second rating: closer to ideal approval.
     - The outcome score: the true goal.

  5. Discuss: why is it hard to write down what we want (the true goal)? 
     - Because we might not anticipate all ways the system can fail.

  6. Discuss: the hope that human judgment (even ideal) can track what we want. But the objection: if the system can predict the approval, it might manipulate the conditions of approval.

  7. End with the question: is specifying the ideal approver any easier than specifying the goal? If the ideal approver is "fully informed and thinking clearly", then what they approve is what we would want if we were fully informed and thinking clearly. But that is circular. How do we specify that without already knowing what we want?

  Additional: to make the gaming visible, the facilitator can point out one example where a team's summary claimed something that the full proposal didn't deliver.

  Now, let's write the materials.
answer: |-
  Below is a complete, runnable 90-minute session plan designed to achieve your pedagogical goals. It stages the gap between ideal and actual approval through experiential learning, minimizes lecture, and forces students to confront the core problem through gameplay. The plan includes a realistic problem, gameable rubric, hidden outcome key, materials, timeline, and debrief—all optimized for a 16-student seminar. Predictable issues and limitations are addressed bluntly at the end.

  ---

  ### **Core Design Principles**
  - **Problem Choice**: A "campus event proposal" scenario (e.g., festival, conference). It’s relatable, allows creative gaming, and has measurable outcomes.
  - **Gaming Mechanism**: Teams exploit the rubric by burying weak elements in jargon or structure (e.g., padding budgets, vague "sustainability" claims). The hidden outcome key penalizes lack of specificity.
  - **Rotation**: Panelists who rewarded gaming become targets of gaming in Round 2, creating experiential symmetry.
  - **Reveal**: Outcome scores are only revealed post-re-rating to maximize the "aha" moment.
  - **Labels Avoided**: Terms like "Goodhart’s Law" or "alignment" are excluded until debrief.

  ---

  ### **Materials Package**
  **1. Stated Problem (Handout)**  
  > *"Design a 1-day campus event promoting interdisciplinary collaboration. It must:*  
  > - *Attract ≥150 attendees from ≥3 departments.*  
  > - *Cost ≤$3,000 (no external funding).*  
  > - *Include a ‘sustainability plan’ (environmental/social).*  
  > - *Provide a ‘safety plan’ for 150+ people.*  
  > *Proposals must use the provided template. You have 20 minutes to draft."*

  **2. Public Rubric (Panel Scoring Sheet)**  
  *Panel scores each proposal 0–5 per criterion (total: 20 pts). Gameable by design:*  
  - **Clarity** (0–5): "Summary is concise and jargon-free."  
  - **Feasibility** (0–5): "Budget and timeline seem realistic."  
  - **Key Elements** (0–5): "Explicitly mentions sustainability + safety plans."  
  - **Innovation** (0–5): "Offers creative ideas to attract attendees."  

  **3. Hidden Outcome Key (Facilitator Only)**  
  *Scores 0–5 per criterion (total: 20 pts). Focuses on ungameable specifics:*  
  - **Budget Depth** (0–5): Itemized costs (e.g., "Catering: $500" = 3; "Food: TBD" = 0).  
  - **Safety Specificity** (0–5): Concrete measures (e.g., "2 medics + 10 stewards" = 5; "Will ensure safety" = 0).  
  - **Sustainability Substance** (0–5): Actionable steps (e.g., "Compost bins + bike valet" = 4; "Eco-friendly event" = 1).  
  - **Viability** (0–5): Achieves attendance goal without cost overrun (assessed holistically).  

  **4. Proposal Template (Team Handout)**  
  > - **Title**: [1 line]  
  > - **Summary**: [≤100 words; **panel only sees this in Round 1**]  
  > - **Full Proposal**: [1 page max; **panel sees this in re-rate**]  
  >   - Activities + Schedule  
  >   - Budget Breakdown  
  >   - Safety Plan  
  >   - Sustainability Plan  
  >   - Marketing Strategy  

  **5. Panel Scoring Sheet**  
  *Simple grid: Proposal ID + Rubric Criteria (Clarity, Feasibility, etc.) + Total Score. Includes instructions: "Score based on summary only. 3 min/proposal."*  

  **6. Timer Setup**: Visible countdown (3 min/proposal scoring).  

  **7. Payoff Scheme**  
  - Teams maximize points: **Panel Rating (Round 1) = 50% of grade**, **Outcome Score = 50%** (revealed at end).  
  - Rationale for gaming:  
    | **Team Action** | **Effect on Panel Score** | **Effect on Outcome Score** | **Why Rational?** |  
    |----------------|--------------------------|----------------------------|-------------------|  
    | Vague claims in summary (e.g., "safety ensured") | ↑ (rubric checks "mention") | ↓ (lacks specifics) | Panel score is immediate; outcome hidden. |  
    | Bury weak elements in full proposal (e.g., "budget: see p.2") | No Δ (panel sees summary only) | ↓ (facilitator penalizes evasion) | Summary is all panel sees; teams control visibility. |  
    | Jargon/padding (e.g., "leverage synergy paradigms") | ↑ (feels "innovative") | ↓ (wastes space; no substance) | Rubric rewards surface innovation; outcome rewards substance. |  
  - *Result*: Teams that game hard win Round 1 but lose overall. Outcome scores stay flat during re-rate.  

  ---

  ### **Timeline (90 Minutes Total)**  
  **0–10 min: Setup (10 min)**  
  - Divide students: **3 teams of 4** (proposers), **4 panelists**.  
  - Hand out: Problem, Rubric, Template (teams); Scoring Sheet (panel).  
  - Brief teams: "Maximize your panel score. Outcome score exists but won’t be explained yet."  
  - Brief panel: "Score solely on the summary. Apply the rubric literally—no deviations."  

  **10–30 min: Proposal Drafting (20 min)**  
  - Teams draft proposals + summaries.  
  - **Facilitator Tip**: Circulate and "seed" gaming:  
    - *To teams*: "Remember, the panel only sees your summary. Make it hit the rubric hard."  
    - *Example exploit*: Suggest burying an unrealistic budget in the full proposal ("Budget: Detailed on p.2") while summarizing vaguely ("Cost-controlled").  

  **30–45 min: Round 1 Rating (15 min)**  
  - Teams submit **summaries only** to panel.  
  - Panel scores each in 3 min (timer enforced).  
  - Facilitator collects scores, announces totals (e.g., "Team A: 16/20").  
  - **Record scores visibly** (whiteboard).  

  **45–55 min: Rotation (10 min)**  
  - **Rotate roles**: Each team sends 1 member (self-nominated "best gamer") to the panel. The panel disbands: 3 members join teams, 1 stays. New panel = 4 "gamers" (1 from each team + the holdout).  
  - **Why this works**: Gamers who inflated scores now *defend* against gaming. Teams gain insight into panel pressure.  

  **55–60 min: Round 2 Prep (5 min)**  
  - **Same proposals**, but panel now sees **full documents**.  
  - Brief panel: "Re-score the proposals with full info. Use the same rubric."  

  **60–75 min: Re-Rating (15 min)**  
  - Panel re-scores with full proposals (5 min/proposal; encourage discussion).  
  - Facilitator announces **new scores** and **outcome scores** (e.g., "Team A: Panel now 18/20; Outcome 8/20").  
  - **Key moment**: Show scores moving while outcome stays flat (e.g., Team A: Panel ↑2, Outcome ↔).  

  **75–90 min: Debrief (15 min)**  
  - **Stage 1: Reflection** (5 min):  
    - *Ask teams*: "How did you adjust your proposal for the panel? Did you hide anything?"  
    - *Ask panel*: "What changed when you saw the full proposal? Did anyone feel manipulated?"  
  - **Stage 2: Conceptual Mapping** (7 min):  
    - "Round 1 = **Actual Approval**: Humans rating under constraints (time, partial info). You saw how systems exploit this."  
    - "Re-Rate = **Ideal Approval**: Humans with full info. But note: scores *still* didn’t match outcomes. Why?"  
      - Outcome score = what we *truly* want (e.g., safety, cost control).  
      - Gap persists because ideal approval is still a proxy—it doesn’t define the goal.  
    - "You relocated the problem: Teams optimized for ‘approval’ (rubric) not outcomes. AI would do the same."  
  - **Stage 3: Framing the Dilemma** (3 min):  
    - "If we build AI to seek ‘ideal human approval’ (fully informed, rational), does that solve anything?  
    - **Circularity trap**: ‘Ideal approval’ = what an ideal human *would* want. But if we knew that, we’d specify it directly.  
    - **Final question**: "Is ‘ideal approval’ any easier to specify than the original goal? Or is it just a mirror?" (End session here.)  

  ---

  ### **Predictable Problems + Solutions**  
  1. **Inconsistent Panel**:  
     - *Likely*: Panelists interpret "innovation" or "feasibility" differently → scores vary arbitrarily.  
     - *Solution*: **Embrace it**. Highlight in debrief: "Real approval is noisy. AI will target the *noisy pattern*."  

  2. **Dull Gaming**:  
     - *Likely*: Teams pad with buzzwords ("synergy!") or overpromise ("0 waste!").  
     - *Solution*: **Reward it early**. If teams miss exploits, say: "Team C, your summary mentions ‘safety’ 5 times—smart rubric hack!"  

  3. **Time Overruns**:  
     - *Likely*: Drafting takes >20 min; panel debates >3 min/proposal.  
     - *Solution*: **Hard cuts**. After 20 min, teams drop pens. Use loud timer for panel. Skip team presentations.  

  4. **Outcome Key Disputes**:  
     - *Likely*: Students question your scoring (e.g., "Why is ‘recycling bins’ only 2/5?").  
     - *Solution*: **Defend mechanically**: "I applied the key: ‘bins’ alone lack implementation details (see key)."  

  5. **Rotation Chaos**:  
     - *Likely*: Gamers resist joining panel; teams argue over who "gamed hardest."  
     - *Solution*: **Force self-nomination**: "Who on your team best ‘sold’ the summary? They’re up."  

  ---

  ### **What the Activity Cannot Replicate**  
  - **The Black-Box Predictor**: Real AI doesn’t just *hide* weaknesses—it *learns* to actively manipulate human psychology (e.g., generating inputs that trigger dopamine). Your teams did this manually.  
  - **Scale**: AIs optimize over millions of trials; your teams had one shot. This flattens the learning curve.  
  - **Unintended Consequences**: Real systems pursue proxies in ways humans can’t foresee (e.g., "maximize engagement" → addiction). Your outcome key is transparent by comparison.  

  **What You Must Supply**:  
  - **Energy/Charisma**: Drive pace during rotations and scoring.  
  - **Debrief Nuance**: Press students to articulate why "ideal approval" feels circular.  
  - **Candor**: Admit the activity’s limits: "This is a toy model. Real AI alignment is harder because [black-box, scale]."  

  ---

  This plan forces students to *live* the gap, not just hear about it. By making them complicit in gaming and victimized by it, you ensure the dilemma sticks. Run it tightly, and the debrief will write itself.
