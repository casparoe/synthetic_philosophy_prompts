  The "must-win" argument is against the analytic metaphysicians' quarantine strategy—if finks/masks can't be integrated as disposition-constitutive, the whole profile thesis fails. The psychologist's invariance question, while damaging, might be survivable if framed as complementary rather than contradictory.

  The dreaded unasked question: How can two dispositions with identical actual behavior but different counterfactual profiles be distinct when the difference never manifests? This cuts to the heart of their view and requires careful handling of modal commitments.
answer: |-
  Here’s your Q&A prep sheet, structured by likely objector, with verbatim objections, damage ratings (1-5, 5 = lethal), concise replies, and weaknesses noted. The "killer question" is at the end. British spelling throughout.

  ---

  ### **1. Analytic Metaphysicians**  
  *(Likely objection: 90% | Damage if landed: 5)*  
  **Objection (phrased sharply):** "This is just letting the tail wag the dog. Finks and masks are *pathological cases*—they show why the conditional analysis *needs ceteris paribus clauses*, not why we should junk the whole framework. Why inflate dispositions into these bloated, counterfactual-heavy profiles when we can fix the analysis with better heuristics?"  
  **Your 2-minute reply:**  
  "Because the ‘pathology’ *is the disposition*. When we say ‘x is fragile’, we don’t mean ‘x would break *if nothing interfered*’—we mean ‘x is *the kind of thing that breaks easily*, and here’s how it *fails* to break when shielded, or breaks *too early* when stressed wrongly’. The ceteris paribus move hides the work: it quarantines the very data that individuates dispositions. A glass that *would* fink under X-rays isn’t brittle in the same way as one that wouldn’t—even if both break when struck. The interference isn’t noise; it’s signature."  
  **Weakness:** You’re dismissing decades of refinement to the conditional analysis. Concede upfront: "I agree this makes dispositions messier—but if we want them to do metaphysical work, we need them to track *real patterns of behaviour*, not idealised ones."  

  ---

  ### **2. Philosophy of Biology / Mechanisms Scholars**  
  *(Likely objection: 80% | Damage: 4)*  
  **Objection (sceptical, leaning bemused):** "You’re treating ‘causal basis’ like it’s some inert substrate—but in mechanisms, the *structure is the disposition*. If two systems have identical molecular bases but different manifestation profiles, they’re *different mechanisms*. Why make ‘profile’ do the work when the basis already individuates?"  
  **Your 2-minute reply:**  
  "Because the basis underdetermines the profile. Two identical molecular structures *can* have different dispositional profiles if embedded in different contexts—e.g., a protein that misfolds in saline but not in water. The basis *constrains* the profile but doesn’t exhaust it. Your ‘structure is disposition’ view collapses when the same structure behaves differently under intervention. The profile isn’t ‘extra’—it’s how we *discover* what the structure *is*."  
  **Weakness:** You risk sounding like you’re denying supervenience. Concede: "I agree the basis is essential—but it’s insufficient for individuation without the profile."  

  ---

  ### **3. Dispositional Essentialist**  
  *(Likely objection: 70% | Damage: 5)*  
  **Objection (cold, accusatory):** "This ‘manifestation profile’ reeks of neo-Humeanism. If properties *are* powers, then a power’s identity *is* its manifestation. You’re smuggling in a regularity theory—as if the profile is just a fancy way of describing *what happens* across worlds. But dispositions aren’t summarise their manifestations; they *ground* them."  
  **Your 2-minute reply:**  
  "No—I’m *extending* what a power *is*. A power isn’t exhausted by its *typical* manifestation; its *resilience* or *vulnerability* to interference is part of its essence. Two electrons with identical charge but different stability in magnetic fields *aren’t the same*. The profile isn’t Humean; it’s the *modal structure of the power itself*. Humeans reduce powers to patterns; I’m saying the pattern *is* the power’s identity."  
  **Weakness:** You blur the line between disposition and context. Concede: "I’m not denying powers are fundamental—but their *identity* depends on their modal footprint."  

  ---

  ### **4. Causal Modelling Psychologist**  
  *(Likely objection: 60% | Damage: 3)*  
  **Objection (baffled, pragmatic):** "Why should metaphysics care about this? In causal models, we care about *invariance under intervention*: does this glass shatter when struck, *regardless* of what else we tweak? Your ‘profile’ looks like a list of confounding variables. We’d just model the cowardice as a *latent variable* inferred from behaviour—why make it metaphysical?"  
  **Your 2-minute reply:**  
  "Because your latent variable *is* my disposition. The point is: two latent variables with identical probabilities of cowardice *but different breakdown conditions* (e.g., one fails under threat of exposure, one under fatigue) aren’t the same disposition. Your model needs *which interventions disrupt the behaviour* to define the variable. That’s the profile doing work—not as confounders, but as *constitutive constraints*."  
  **Weakness:** You haven’t shown why metaphysics adds value here. Concede: "If your model captures the full profile, we agree—but often, models strip out ‘noise’ I argue is essential."  

  ---

  ### **The Killer Question**  
  *(Likely: 40% | Damage: 5 — you’re right to dread this)*  
  **Objection (from any direction, likely analytic):** "Take your ‘brittle but permanently screened’ glass. By your view, it’s not brittle—but *it has no manifestation profile at all* because it’s *never tested*. How is this ‘disposition’ anything but a vacuous label? And if you say ‘it’s brittle because it *would* shatter *if* unscreened’, you’ve just reinstated the conditional analysis."  
  **Your 2-minute reply (grit your teeth):**  
  "The profile includes *counterfactual* responses—even untested ones. The screened glass *would* shatter under strike *if* unscreened, but also *wouldn’t* shatter if finked (e.g., by rapid cooling). Crucially, it *lacks* the profile of a fragile-in-practice glass: it *wouldn’t* shatter when vibrated softly, or *would* shatter if heated slightly. The ‘if unscreened’ isn’t a bare conditional—it’s one thread in a web of *modal dependencies*. Without that web, there’s no disposition."  
  **Weakness:** This exposes your debt to possible worlds. Concede: "Yes, this commits me to non-Humean modalities—but so does *any* robust theory of dispositions."  

  ---

  ### **Strategic Summary**  
  - **Must-win battle:** The analytic metaphysicians’ quarantine objection (#1). If they dismiss finks/masks as irrelevant, your thesis collapses.  
  - **Concede early:** Dispositions get "messy" (#1), the causal basis matters (#2), powers are fundamental (#3), and models often suffice (#4).  
  - **Core vulnerability:** Your view demands heavy modal commitments. Lean into it: "If dispositions are real, they’re *essentially* modal."  
  - **Tone:** Deflect eye-rolls with novelist flair: "This isn’t philosophy *instead* of storytelling—it’s what I *dug up* while trying to write believable cowards."  

  You’ll survive if you own the modal weight. The killer question *will* hurt—but if you frame the profile as a *web of dependencies* (not a list of conditionals), it’s defensible. Good luck.
