  The audience consists of analytical metaphysicians, philosophers of biology, a dispositional essentialist, and a psychologist specializing in causal modeling. Each group will have distinct objections based on their theoretical commitments. The user needs to anticipate these objections precisely and have concise, effective replies ready.

