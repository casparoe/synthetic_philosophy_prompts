prompt: |-
  I teach a second-year undergraduate ethics module, and I have one 90-minute session with about eighteen students in a room with movable chairs and a whiteboard. I want to run a staged activity that makes the group feel the force of the demandingness objection to consequentialism from the inside, rather than hearing it described. Please design it for me, in enough operational detail that I could run it next week without having thought it through further.

  The target is not the familiar trolley-style dilemma and not the bare thought that consequentialism asks a lot. What I want them to collide with is the instability of any stopping point. Set up a situation with a small real stake (a token redeemable for something trivial at the end, or points toward a prize — nothing that requires money or makes anyone uncomfortable), in which the cost of each additional step of sacrifice is small and the benefit of each step is held constant. Then let the demand escalate one small increment at a time, with each participant privately recording the point at which they refuse to go further and the reason they give for stopping there. Collect the refusal points anonymously and put them on the board. The pedagogical payload is the moment when they see that the reasons offered for stopping at different points do not line up with one another, and that most of them cannot say what makes their own threshold the right one rather than merely the one they happen to have.

  Build in a second phase, after that discomfort has landed, in which some of the tokens are needed for something the participant has already committed to and cares about — a role in the scenario that stands in for a personal project or relationship. This should let the room feel the difference between "the theory asks more than I want to give" and "the theory leaves no room for me to be the person with these commitments at all." The point where the two complaints pull apart should emerge from the second phase, not from anything I say.

  Some constraints. The idea must live in the rules, the escalation procedure, and the stakes; there should be no framing lecture beforehand and no naming of the objection until the debrief. The stipulated exchange rate between tokens and the benefit should be explicitly fictional and obviously so, so that nobody can win by disputing a real-world number. Participants must not be able to read off my own view, and the procedure should not rank them morally or reward the ones who hold out longest. Nothing should depend on the room having read anything in advance.

  Give me the rules, the materials, a minute-by-minute timeline, a short facilitator script covering only what has to be said out loud, and the debrief. In the debrief, map specific moments in the activity onto the distinct things that get run together under this objection: the plain claim that the theory demands too much; the separate fairness complaint about how the burden of those demands is distributed across agents; and the integrity or alienation complaint that the theory leaves no room for the agent's own commitments — plus the standard replies (that the world is demanding rather than the theory, that a scalar or degree version of the view avoids the objection, that ordinary morality is also demanding in extreme cases, and that the objection may be about psychology rather than about truth). Say which moments in the activity correspond to which of these, and which ones the activity cannot stage.

  Also tell me what will predictably go wrong the first time I run it — the performative maximal giver, the first speaker anchoring everyone else, the student who tries to short-circuit the exercise by declaring the exchange rate unrealistic, the risk that the refusal round reads as a moral leaderboard — and how to handle each. Be frank about what the activity cannot reproduce: in particular, that real demandingness is unbounded and ongoing rather than a single resolved choice, and that whether demandingness is a wrong-making feature of a theory at all is a question the activity will not settle and I will have to supply.

  End your answer with one sentence beginning "Bottom line:" that states the single thing the activity has to get right for the objection to land as more than a slogan.
reasoning: |-
  Okay, let me tackle this ethics activity design request. The professor wants students to viscerally experience the demandingness objection to consequentialism through a staged classroom exercise. The key is creating an escalating scenario where students face increasing demands with small incremental costs, forcing them to confront the arbitrariness of their personal stopping points.

  Hmm, the core challenge is designing an artificial but compelling exchange system. I'm considering using "relief tokens" representing small charitable donations. Students start with 5 tokens each, redeemable for trivial prizes later. Each round, they decide whether to donate one token to "prevent harm" at increasing personal cost - first just losing a token, then small inconveniences like standing, eventually simulating real sacrifices like skipping breaks. 

  The escalation ladder needs careful construction: from token loss (round 1) to mild physical inconvenience (rounds 2-3) to time/comfort sacrifices (rounds 4-5). Crucially, the "harm prevented" remains constant while personal costs accumulate. For phase two, I'll introduce "commitment tokens" - three special tokens representing personal projects that students must protect. This creates tension between general good and personal integrity.

  For materials, just tokens (different colors for regular/commitment), a whiteboard for refusal points, and timers. The script must be minimal: no theory framing, just clear round instructions. During refusal recording, emphasize anonymity to avoid moral grandstanding. 

  Potential pitfalls are numerous: the performative altruist, the exchange-rate skeptic, anchoring effects. Countermeasures include: stressing fictionality upfront, using anonymous data collection, and privately addressing disruptors. The debrief should map exercise moments to philosophical concepts: round escalations showing demand instability, phase two revealing integrity concerns, while acknowledging what the simulation misses (like ongoing real-world demands).

  Bottom line: The tokens must create palpable tension between negligible individual costs and accumulating personal sacrifice while keeping the "harm prevented" constant, forcing confrontation with arbitrary stopping points.
answer: |-
  Here’s a complete, ready-to-run activity designed to meet your specifications.  

  ---

  ### **Activity Title**: The Relief Token Dilemma  
  **Core Mechanism**: Students trade "relief tokens" (redeemable for trivial prizes) to "prevent harm" in a fictional crisis. Each round escalates the personal cost of donating, while the "benefit" (harm prevented) stays constant. Phase Two introduces protected "commitment tokens" representing personal projects.  

  **Materials**:  
  - 18 sets of tokens: Each student gets 5 standard tokens + 3 **blue commitment tokens** (e.g., colored paper clips).  
  - Whiteboard markers & a timer.  
  - Prize box: Candy, stickers, or bonus participation points.  

  ---

  ### **Timeline & Facilitator Script** (90 mins total)  
  *(Script in bold; actions in italics)*  

  **Phase 1: The Escalation Ladder** (40 mins)  
  1. **Start (0:00)**: *Distribute tokens. Write on board:*  
     **"Each token you keep = 1 prize entry. Each token donated = 1 life saved in a fictional disaster. Rules are artificial—focus on your choices."**  
     **"Rounds advance every 3 minutes. Each round, decide: DONATE 1 token or KEEP it. Costs to donate increase each round. Record on paper when you stop donating and why."**  

  2. **Rounds (0:03–0:30)**: *Announce each round:*  
     - **Round 1**: "Cost to donate: Lose 1 token."  
     - **Round 2**: "Cost: Stand for the rest of the activity."  
     - **Round 3**: "Cost: Stand on one foot for 30 seconds now."  
     - **Round 4**: "Cost: Skip your next break today."  
     - **Round 5**: "Cost: Apologize aloud to the group for not donating more."  
     *Stop after Round 5 or when >50% refuse.*  

  3. **Refusal Data Collection (0:30–0:35)**:  
     **"Anonymously submit your refusal round (e.g., 'Stopped at Round 3') and your reason. No names."**  
     *Collect slips. Shuffle and post refusal rounds on the board in a numbered list (e.g., "Stopped at: 2, 3, 3, 4, 1..."). Do NOT post reasons yet.*  

  **Phase 2: Commitment Tokens** (25 mins)  
  4. **Setup (0:35–0:40)**:  
     **"New rule: You have 3 BLUE tokens. These represent commitments you already made: caring for a sick relative. If you donate ANY blue token, you fail that commitment. Standard tokens still save 1 life each."**  
     **"Rounds restart. Same escalating costs. Decide each round: donate 1 STANDARD token, 1 BLUE token, or KEEP all."**  

  5. **Rounds (0:40–0:55)**: *Repeat Rounds 1–3 costs. Stop early if refusals surge.*  

  6. **Reason Sharing (0:55–1:00)**:  
     **"Call out your refusal round from Phase 1 and your reason. I’ll write reasons beside your refusal number."**  
     *Scribe reasons verbatim next to the refusal rounds (e.g., "Round 3: 'Too tired to stand'", "Round 4: 'My break matters to me'").*  

  ---

  ### **Debrief** (30 mins)  
  **Guiding Questions & Links to Theory**:  
  1. **Demandingness & Arbitrary Thresholds**:  
     - *Point to refusal spread on board:* "Why do thresholds cluster at different rounds? What makes Round 3 ‘right’ vs. Round 4?"  
     → *Links to:* Demand instability; no non-arbitrary "enough" point in consequentialism.  

  2. **Fairness Complaint**:  
     - "Did anyone resent donating while others stopped early? Is it unfair if burdens fall unevenly?"  
     → *Links to:* Distributive justice worries; consequentialism ignores agent-relative costs.  

  3. **Integrity/Alienation (Phase 2)**:  
     - "How did blue tokens change your choice? Did ‘failing a commitment’ feel different than just ‘losing a prize’?"  
     → *Links to:* Williams’ integrity objection; projects define identity vs. impersonal optimization.  

  4. **Counterarguments & Limits**:  
     - "Consequentialist replies: Is the *world* demanding (not the theory)? Does a scalar version help? Ordinary morality also demands in crises (e.g., give to famine relief). Is this about psychology, not truth?"  
     - *Activity limits:* Real demandingness is endless ("until marginal utility"); doesn’t resolve if demandingness invalidates a theory.  

  ---

  ### **Predictable Problems & Fixes**  
  - **The Performative Maximalist**: Student loudly donates all tokens.  
    *Fix:* Stress anonymity in Phase 1; remind them real stakes are trivial. Redirect debrief to threshold *variation*.  
  - **Anchoring Effect**: First student says "Stopped at Round 3," others conform.  
    *Fix:* Use anonymous submission for refusal points. In reason-sharing, start with varied numbers.  
  - **Exchange-Rate Skeptic**: "1 token ≠ 1 life! This is unrealistic."  
    *Fix:* Affirm upfront: "Fictional stakes—focus on the *escalating cost* dynamic." Ignore debate; move on.  
  - **Moral Leaderboard Risk**: Refusal list feels like ranking.  
    *Fix:* Scramble refusal order; never reveal who chose what. Debrief: "This isn’t about who’s ‘better’—it’s about where lines are drawn."  
  - **Phase 2 Opt-Out**: "Why wouldn’t I just donate blue tokens? It’s fake."  
    *Fix:* "Imagine the commitment matters *to you*. If it helps, picture a real project you’d protect."  

  ---

  ### **What the Activity Can’t Replicate**  
  1. **Real Demandingness**: The exercise is finite; real consequentialism demands continual sacrifice.  
  2. **Theory Legitimacy**: Whether demandingness *invalidates* a theory requires philosophical argument—not emergent from the game.  

  ---

  **Bottom line:** The cost-escalation ladder must create a palpable tension where the *reason* for stopping feels increasingly arbitrary as costs mount incrementally, exposing the instability of non-consequentialist thresholds.
