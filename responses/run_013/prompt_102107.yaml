  The user wants honesty—if it's an unsolved problem, they’d prefer that over rehashing arguments. So, I need to assess whether the standoff is due to fundamental intuitions that can't be reconciled. If so, the implication is that theories must accommodate the asymmetry without proving it, which influences how we handle other conclusions like the Repugnant one.

