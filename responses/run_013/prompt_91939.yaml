  On question 2, "likely" is crucial because it points to probabilistic social knowledge. Smith isn't talking about perfect idealization but about what reasonable people would think if fully informed. This avoids conventionalism because communities often disagree internally, and we intuitively grasp when judgments stem from prejudice rather than proper sympathy. 

  For question 3, the escape hatch from conventionalism lies in Smith's "ought" ("what we imagine ought to be the judgment"). We can reject actual community verdicts when we recognize they violate principles of sympathy - like when whole societies approve of slavery while individual spectators flinch. 

