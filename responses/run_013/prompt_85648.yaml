prompt: |-
  hey, I'm a junior and I'm doing my big extended essay on whether the world is actually getting less violent over time, and I keep hitting a wall on what the question even is. my teacher keeps saying it's just about per capita vs absolute numbers, and my friend says it's all definitional so there's no fact of the matter at all, which definately sounds like a cop out to me.

  here's the thing I've been chewing on alot and I want you to actually take it seriously instead of just telling me it's been done before: what if the right denominator isn't people or years but hours of human life actually lived? like, a century where everybody dies at 25 stuffs way more people into it than a century where everybody lives to 80, so counting per person kind of over-counts short lives and under-counts long ones. so maybe you should measure how much deliberate suffering gets packed into each lived hour instead, and if you do that the trend might look pretty different. does that actually break anything, or is it the same debate wearing a hat? and a related thing: does it even count as violence if nobody feels it or ever finds out -- someone killed in their sleep, a threat that never gets carried out, someone slowly frozen out of their job. is unfelt violence a real category or am I just making stuff up?

  what I actually need from you: out of all the open questions floating around in this debate, which five matter most, ranked, and why -- which ones other questions hang off of, which ones I should drop because they don't change anything downstream, and which ones are only around because they're fun to argue about. I've got one semester, about 4000 words, and no library, so don't send me off to go read things.

  format: numbered list, exactly five items, a sentence or two each, no intro and no wrap-up paragraph at the end. if either of my ideas is genuinely one of the five, put it in; if it's not, say so in whichever line it would've gone in.
