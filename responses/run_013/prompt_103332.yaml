  - No (evidence must be certain): Leaf: "Reject the framework of uncertain evidence"
    Awkward commitment: You must hold that the doctor has in fact become certain of some proposition (e.g., about her experience) and that the 70% confidence is obtained by conditioning on that.
  - Yes: Go to Question 1.

  Question 1: In updating, do you think that for every proposition H, your conditional credences given D and given not-D should remain unchanged? (i.e., P_new(H|D) = P_old(H|D) and P_new(H|~D) = P_old(H|~D))
  - Yes: Go to Question 2.
  - No: Go to Question 3.

  Question 2: Do you think that the update should be partition-invariant? That is, if the evidence had been specified over a different partition (e.g., test results) and you updated by preserving conditionals over that partition, should it commute with updating on {D, ~D}? And should the result be independent of the order in which you update on different partitions?
  - Yes: Leaf: "Unnamed (requires partition invariance for uncertain evidence update)"
    Status: Empty (likely incoherent) because Jeffrey conditioning is partition-dependent and no known invariant rule exists for this update.
    Awkward commitment: (for the view) None, because it's empty.
  - No: Leaf: "Jeffrey conditionalization (probability kinematics)"
    Awkward commitment: The update depends on the choice of partition (here {D, ~D}), and there is no principled way to choose the partition.

  Question 3: Do you think that the constraint P_new(D)=0.7, by itself, uniquely determines your entire posterior credence function?
  - Yes: Go to Question 4.
  - No: Leaf: "Permissivism"
    Awkward commitment: Two rational doctors with the same prior and same evidence (same new credence in D) might have very different credences in other propositions (e.g., the reliability of the test) without either being irrational.

  Question 4: Do you think that the evidence is better represented as constraining a partition other than {D, ~D}? (e.g., the partition of test results: positive, negative, inconclusive)
  - Yes: Leaf: "Unnamed (Jeffrey for a different partition)"
    Awkward commitment: You must specify a full probability distribution over that partition, but the evidence only directly gives you P(D)=0.7.
  - No: Leaf: "Unnamed (unique posterior without preserved conditionals)"
    Status: Empty (incoherent) because the constraint P_new(D)=0.7 does not determine P_new(H) for propositions H that are not D. For example, your new credence in the test being reliable could be almost anything.

  Additionally, note that the "strict conditionalization after firming up" is captured in the reject framework branch? Not exactly. The reject framework branch says evidence must be certain, but doesn't specify how to update. The firming up branch is a positive view. But in our tree, if they reject at Question 0, they are done. But if they accept uncertain evidence, then we don't have the firming up option. However, the firming up option is for those who think that even in this case, they can find a certain proposition. So it's part of the reject framework.

  Alternatively, we can have two initial branches: one for reject and one for firming up vs. not.

  But let's keep it as above.

  The minimize-divergence view is not explicitly represented because in this case (only one constraint) it reduces to Jeffrey. If they had a full partition, it would be Jeffrey.

  For the single-proposition update: it's the same as Jeffrey for {D,~D}.

  Empty leaves:
  - The partition-invariant Jeffrey: empty because incoherent.
  - The unique posterior without preserved conditionals and without partition shift: empty because incoherent.

  Leaves with names:
  - Reject the framework
  - Jeffrey conditionalization
  - Permissivism
  - Unnamed (Jeffrey for a different partition)

  Unnamed positions:
  - Jeffrey for a different partition.

  The tree might not separate "minimize-divergence" from Jeffrey because they coincide here. Also, the single-proposition update is not separated.

  Confidence: 70%. The branch I'm least sure about is Question 3 and its follow-ups. In particular, some might argue for minimizing a different divergence that doesn't preserve conditionals. But I'm not aware of any such standard update in this context. Also, the permissivism leaf might be too broad.

  But for the purpose of a seminar discussion, this should be stimulating.

  When you present, be careful with the partition invariance part because it's well-known that Jeffrey isn't invariant, and there's literature on that. Also, the firming up view is defended by some (like Williamson?), and the reject view by others (like maybe your professor).

  Good luck!
answer: |-
  Below is a decision tree designed for your grad seminar, using the doctor case as a running example. It starts from the premise that evidence arrives as a probability distribution (here, a 70% confidence in disease D) and branches through key philosophical fault lines. Each node is a concrete question about the case, forcing choices without revealing downstream positions. The tree isolates named positions (e.g., Jeffrey conditionalization) and flags incoherent/empty leaves. I’m **80% confident** in the overall structure—it captures core debates from Leitgeb, Jeffrey, Bradley, and others—but **least sure about Branch 3 (uniqueness without preserved conditionals)**, as it risks conflating underdetermination with divergence-minimization. I’ve made the "reject-the-framework" leaf nuanced to preempt your professor’s pushback.

  ---

  ### **Decision Tree: Updating on Uncertain Evidence in the Doctor Case**
  **Running Case:**  
  You’re a doctor with a prior credence function over propositions (e.g., disease D, test reliability R, patient symptoms S). After a noisy test, you’re now 70% confident of D. The test’s reliability (how often it correctly detects D) is uncertain—you have a prior over R. You must update your entire credence function based *only* on this 70% confidence.

  ---

  #### **Start: Top Node**  
  **Question 0:** After the test, you’re 70% confident of D. Is this 70% credence *itself* a direct input to your update (i.e., you treat "P_new(D) = 0.7" as the evidence), or must it be reduced to something certain?  
  - **A: This 70% is the evidence—I update directly on it.** → Go to Question 1.  
  - **B: No—evidence must be certain; this 70% is just a symptom of certain evidence (e.g., my experience).** → **Leaf: Reject the Framework**  

  ---

  #### **Branch 1: Can uncertain evidence be "firmed up"?**  
  **Question 1:** When you feel 70% confident of D, is this because you’ve become certain of a proposition E (e.g., "I saw the test show a positive result" or "I feel confident of D at level 0.7") that *causes* your 70% credence?  
  - **A: Yes—I can firm up evidence into a certain E (e.g., my experience), then conditionalize on E.** → Go to Branch 2.  
  - **B: No—the evidence is irreducibly uncertain; I only have P_new(D) = 0.7.** → Go to Branch 3.  

  ---

  #### **Branch 2: Firming up and handling reliability uncertainty**  
  **Question 2:** You condition on E (e.g., "I saw a positive result") to get P_new(D) = 0.7. But you’re uncertain about the test’s reliability R. Should conditioning on E *also* update your credence in R?  
  - **A: Yes—E teaches me about R too (e.g., if I see a positive result, unreliable tests make D less likely).** → **Leaf: Strict Conditionalization After Firming Up**  
    - *Awkward Commitment:* You must assume all uncertain evidence reduces to a certain experiential proposition E—even when reliability is vague (e.g., "I’m unsure if the test is 80% or 60% reliable").  
  - **B: No—E only affects D; I keep my prior credence in R unchanged.** → **Leaf: Unnamed (Firming Up Without Reliability Update)**  
    - *Status:* Empty. Incoherent—ignoring reliability when it affects D’s likelihood violates total evidence norms.  

  ---

  #### **Branch 3: Uniqueness of the posterior (given uncertain evidence)**  
  **Question 3:** Updating directly on P_new(D) = 0.7, must your posterior be *uniquely* determined (i.e., only one rational output for all credences)?  
  - **A: Yes—the posterior is unique.** → Go to Branch 4.  
  - **B: No—many posteriors fit P_new(D) = 0.7; rationality underdetermines the rest.** → **Leaf: Permissivism**  
    - *Awkward Commitment:* Two doctors with identical priors and evidence can have wildly different credences (e.g., one thinks R is high, another low) without irrationality.  

  ---

  #### **Branch 4: How is uniqueness achieved?**  
  **Question 4:** To get uniqueness, should you preserve your prior’s conditional credences given D and ~D? (e.g., P_old(S|D) = P_new(S|D) for symptoms S.)  
  - **A: Yes—preserve conditionals.** → **Leaf: Jeffrey Conditionalization / Probability Kinematics**  
    - *Awkward Commitment:* Update depends on the partition {D, ~D}—e.g., if evidence affected a partition like {positive test, negative test}, it might give a different posterior.  
  - **B: No—conditionals can change.** → Go to Branch 5.  

  ---

  #### **Branch 5: Uniqueness without preserved conditionals**  
  **Question 5:** Is the evidence *really* about a partition other than {D, ~D}? (e.g., the test outcome: positive [T], negative [~T], but you only got P(D) = 0.7.)  
  - **A: Yes—the evidence constrains a hidden partition (e.g., {T, ~T}), not directly D.** → **Leaf: Unnamed (Jeffrey for a Different Partition)**  
    - *Awkward Commitment:* You must assign probabilities to the hidden partition (e.g., P_new(T)) arbitrarily—since the evidence only gave P(D) = 0.7.  
  - **B: No—it’s directly about D.** → Go to Branch 6.  

  **Question 6:** Should you pick the posterior "closest" to your prior (e.g., minimizing Kullback-Leibler divergence) subject to P_new(D) = 0.7?  
  - **A: Yes—minimize divergence from prior.** → **Leaf: Minimize-Divergence Update**  
    - *Awkward Commitment:* Minimizing KL-divergence *forces* preserved conditionals—so this contradicts Branch 4B.  
  - **B: No—divergence-minimization is wrong/not required.** → **Leaf: Unnamed (Unique but Non-Jeffrey Update)**  
    - *Status:* Empty. Incoherent—no alternative unique-update rule exists for a single-proposition constraint.  

  ---

  ### **Leaf Summary & Notes**
  | **Leaf Position**                     | **Status**             | **Awkward Commitment**                                                                 |
  |----------------------------------------|------------------------|----------------------------------------------------------------------------------------|
  | Reject the Framework                   | Named                  | Must always reduce evidence to certainty—even when reliability is ambiguous (e.g., "I’m unsure if my vision blurred"). |
  | Strict Conditionalization After Firming Up | Named              | Experience propositions (E) must encode everything—e.g., E must explain why reliability uncertainty doesn’t "break" updating. |
  | Permissivism                           | Named                  | Allows radical disagreement on reliability (R) given identical evidence and priors.    |
  | Jeffrey Conditionalization             | Named                  | Partition-dependence: choice of {D, ~D} affects the update.                           |
  | Minimize-Divergence Update             | Named (family)         | Minimizing KL-divergence reduces to Jeffrey—so it assumes preserved conditionals.      |
  | Unnamed (Jeffrey for Different Partition) | Unnamed            | Must invent probabilities for a hidden partition (e.g., P_new(T)) with no evidence.    |
  | Unnamed (Firming Up Without Reliability) | Empty (incoherent)  | —                                                                                      |
  | Unnamed (Unique but Non-Jeffrey)       | Empty (incoherent)     | —                                                                                      |

  **Key Observations:**  
  - **Unseparated Leaves:**  
    - Jeffrey Conditionalization and Minimize-Divergence Update **coincide in this case** (minimizing KL-divergence under a single-proposition constraint implies preserved conditionals). The tree separates them in Branch 6A to show the divergence-minimization *motive*, but they collapse to the same update rule.  
  - **Empty Leaves:**  
    - *Firming Up Without Reliability Update*: Incoherent—ignoring reliability when it affects D violates conditionalization.  
    - *Unique but Non-Jeffrey Update*: Incoherent—no unique update exists without preserved conditionals or divergence-minimization.  
    - *Partition-Invariant Jeffrey*: Not included—Jeffrey isn’t partition-invariant, and no coherent invariant alternative exists.  
  - **Why Permissivism and Reject Framework are Fair:**  
    - Permissivism reflects real debates (e.g., Schoenfield). Reject Framework is modeled on "certaintists" like Williamson—it grants that evidence feels uncertain but insists it’s ultimately propositional.  

  **Confidence & Weaknesses:**  
  - **Overall Confidence: 80%**. The tree isolates major positions using concrete choices, and the doctor case highlights reliability uncertainty (e.g., Branch 2 forces engagement with it).  
  - **Least Confident About: Branch 3 (Uniqueness)**. It risks masking that divergence-minimization (Branch 6A) collapses to Jeffrey, and permissivists might reject the dichotomy. **Recommendation:** Preempt this by noting in discussion that divergence-minimization often assumes more constraints than given.  
  - **For Your Professor:** The "Reject Framework" leaf is charitable—it doesn’t caricature certaintism and acknowledges reliability uncertainty as a pain point.  

  ---

  ### **Tree Diagram (Simplified)**
  ```mermaid
  graph TD
    Start[Q0: Update on 70% credence directly?] -->|Yes| Q1
    Start -->|No| RejectFramework[Leaf: Reject Framework]
    Q1[Q1: Firm up to certain E?] -->|Yes| Q2
    Q1 -->|No| Q3
    Q2[Q2: Update reliability on E?] -->|Yes| StrictConditionalization[Leaf: Strict Conditionalization After Firming Up]
    Q2 -->|No| Empty1[Leaf: Empty - Incoherent]
    Q3[Q3: Posterior unique?] -->|No| Permissivism[Leaf: Permissivism]
    Q3 -->|Yes| Q4
    Q4[Q4: Preserve conditionals?] -->|Yes| Q5
    Q4 -->|No| Q6
    Q5[Q5: Require partition invariance?] -->|Yes| Empty2[Leaf: Empty - Incoherent]
    Q5 -->|No| Jeffrey[Leaf: Jeffrey Conditionalization]
    Q6[Q6: Evidence about hidden partition?] -->|Yes| Unnamed1[Leaf: Unnamed - Jeffrey for Different Partition]
    Q6 -->|No| Q7
    Q7[Q7: Minimize divergence?] -->|Yes| MinimizeDivergence[Leaf: Minimize-Divergence Update]
    Q7 -->|No| Empty3[Leaf: Empty - Incoherent]
  ```

  Print this as a handout—it’s self-contained with the case. For discussion, focus on how reliability uncertainty pressures the "firm up" view and whether partition-dependence is tolerable. Good luck!
