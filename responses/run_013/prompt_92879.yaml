prompt: |-
  I am a novelist three years into a book set in a parish whose records for the years I need are almost entirely gone, and before I commit the next two hundred pages I want my working position audited. Here is what I hold. (i) A silence in the archive is a datum, not a hole: the shape of a population's absence from the record tells you something about who held the pen. (ii) The novel's task is to give those people an interior life, inhabited from the inside, unhedged. (iii) The book itself carries no apparatus — no footnotes, no note on sources, nothing that sorts fact from invention for the reader; I keep a private ledger of my departures from the record, to be deposited with my papers, and that satisfies my conscience. (iv) I may not attribute to a real, named person any word or deed the record contradicts, but where the record is merely silent I am free to rename, composite, and invent wholesale. (v) The book should be usable by the descendants of those people as a way of knowing their own past. (vi) The novel's central scene — the parish's women burning the register in 1811 — is invented; nothing survives to confirm or deny it; I am certain it belongs.

  Tell me which of these pull against each other, which only appear to, and what each genuine conflict would cost to repair. Answer as exactly five numbered items, a sentence or two each, with no introduction and no conclusion: items 1 to 3, the genuine tensions in descending order of severity, each naming what would have to give; item 4, the most seductive apparent tension and why it dissolves; item 5, the single cheapest revision that repairs the most, and what it costs me. If you count only two genuine tensions, use the third slot for the most serious remaining cost of holding the position as it stands.
reasoning: |-
  Hmm, the user is a novelist working on a book set in a parish with missing records. They've shared six principles guiding their work and want me to audit these positions for conflicts. They need me to identify genuine tensions, apparent tensions that aren't real, and suggest the most cost-effective revision.

  Let me examine their principles carefully. Principle (i) treats archival silence as meaningful data about power dynamics. Principle (ii) requires creating unhedged interior lives. Principle (iii) avoids footnotes but keeps private records. Principle (iv) allows invention where records are silent but forbids contradiction. Principle (v) aims for descendant-usability as historical knowledge. Principle (vi) centers on an invented event.

  The most severe tension seems between (v) and (vi) - presenting an invented event as usable history while knowing descendants might rely on it as factual. This would require either softening (v) or contextualizing (vi).

  Next is tension between (ii) and (iv) - creating "unhedged" interior lives while avoiding contradictions with records. The solution might involve allowing some hedging or accepting that pure interiority risks historical contradiction.

  Then between (i) and (vi) - treating silence as data while inventing a central event that leaves no trace. This could be resolved by making the invention explicitly interrogate archival silence rather than fill it.

  For apparent tensions, the one between (iii) and (v) isn't real because private ledgers satisfy conscience while public presentation maintains narrative integrity.

  The cheapest fix would be adding a subtle in-text acknowledgment of invention for the central scene. This maintains narrative flow while introducing ethical clarity, costing only the illusion of pure historical seamlessness.
answer: |-
  1.  **Tension between (v) and (vi):** The requirement for the book to be "usable by descendants... as a way of knowing their own past" directly conflicts with the invented central scene of the women burning the register, as presenting a major fictional event as historical fact misleads descendants seeking authentic knowledge. Repair requires either removing the claim of historical usability (v) or explicitly framing the central scene as fictional *within the text* (contradicting the "no apparatus" principle of (iii) and the "unhedged" principle of (ii)).
  2.  **Tension between (ii) and (iv):** Crafting "unhedged" interior lives "inhabited from the inside" inherently risks contradicting the record in subtle ways not covered by the prohibition against explicit contradiction of documented words/deeds (iv) – interior states are rarely documented and thus fall under "silence," yet assuming them wholesale risks historical misrepresentation. Repair requires either accepting that pure interiority might contradict plausible historical realities hinted at in the archive (weakening (iv)), or introducing subtle narrative hedging around interiority (contradicting (ii)).
  3.  **Tension between (i) and (vi):** Treating archival silence as a meaningful "datum" about power ("who held the pen") is undermined by inventing a concrete, dramatic event *that also leaves no archival trace* (the register burning). The invented event potentially overwrites the very silence you aim to interpret. Repair requires either abandoning the invented event (vi) or rigorously ensuring its fictional nature explicitly *reinforces* the interpretation of silence as power (i), perhaps through narrative framing acknowledging the invention *as* interpretation of the silence (conflicting with (ii) and (iii)).
  4.  **Apparent tension between (iii) and (v):** The lack of public apparatus distinguishing fact from invention seems to conflict with the goal of descendants using the book as historical knowledge. This dissolves because the private ledger satisfies your ethical conscience (iii), and the *novel's form itself* signals its fictional nature to descendants; they would understand it as an interpretation, not a documentary record, fulfilling (v) as a *way* of knowing (through imaginative engagement), not a factual source.
  5.  **Cheapest revision:** Add a single, subtle sentence *within the narrative* near the central scene, framed as communal speculation or persistent local lore ("Some later claimed the fire began when...", "It passed into whispered memory that..."). This minimally acknowledges invention for the crucial event (mitigating the (v)/(vi) conflict), costs only the illusion of pure historical seamlessness for that moment (a small concession to (ii)), and avoids formal apparatus (iii).
