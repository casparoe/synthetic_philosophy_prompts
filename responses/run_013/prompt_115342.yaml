prompt: |-
  I am a final-year philosophy student taking a course on the philosophy of the social sciences alongside an econometrics option, so I am reasonably fluent in both idioms: I can work with data-generating processes, stationarity and non-stationarity, parameter instability and structural breaks, in-sample fit versus out-of-sample forecast error, overfitting, external validity, conditional as against unconditional forecasting, and the idea of a forecaster who is himself part of the system being forecast.

  We have been reading Popper's critique of historicism — the argument, worked out in The Poverty of Historicism (originally a series of articles in Economica in 1944, published as a book in 1957), that there can be no laws of historical development but only trends; that social prediction is at best conditional rather than unconditional; that a prediction can itself alter the event predicted, which he called the Oedipus effect; and that the future growth of knowledge cannot be predicted in advance, since any prediction of it would have to be contained in the knowledge it predicts. I should like you to restate this position as faithfully as you can in the vocabulary I actually use, and then give me a residue report.

  Work through the following theses one at a time: (1) that historicists mistake trends for laws; (2) that historicist prophecy is unconditional where social science can yield only conditional prediction; (3) that the growth of knowledge is itself a driver of historical change, so that the course of history cannot be predicted; (4) the Oedipus effect, and whether it marks a genuine difference between the social and the natural sciences; (5) the methodological claim that social science should nevertheless proceed by the same methods as natural science, with situational logic as its characteristic model. For each, say what translates cleanly into the forecasting vocabulary, what translates only with distortion, and what has no counterpart there at all.

  Then the residue report. Is there anything Popper and the historicists are arguing about that my vocabulary cannot express — the modality of inevitability as against mere probability, the holism/individualism dispute, or the normative political programme of piecemeal as against utopian social engineering? And does the residue point to a genuine gap in the forecasting vocabulary (something about reflexivity, or about the difference between assigning a probability and claiming that something must happen) or to Popper's thesis being less clear than it looks? I am particularly interested in whether, once translated, his argument reduces to something fairly ordinary about non-stationarity and the Lucas critique — the point that historical regularities need not survive intervention — or whether something important is lost in that reduction. Please answer in British English.
