  First, I need to recap the Knobe effect clearly. The asymmetry in responses (82% vs 23%) shows that people are more likely to say an action was intentional when the side effect is bad. The user’s main concern is how to quarantine their moral attitudes when assessing intentionality. They also want to know if the effect is symmetric and whether the folk concept of intentional action is flawed.

