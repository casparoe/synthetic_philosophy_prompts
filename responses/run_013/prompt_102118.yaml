  For the rhetoric: The repetition of "charitable" is clearly sarcastic, mocking the society's self-importance. The commercial metaphors serve to degrade intellectual influence into mere commodity exchange. By reducing revolutionary texts to surplus inventory dumped abroad, Burke denies them philosophical weight. This isn't just dismissal—it's active desacralization. 

  This complicates the "ideas caused the Revolution" thesis typically attributed to Burke. Here he implies these specific texts were intellectually negligible, even ridiculing French receptiveness. But note: he doesn't deny ideas matter *in principle*. Instead, he suggests *bad* ideas only gain traction in disordered societies. The passage resists both pure idealism and crude materialism—it's about how diseased conditions (France) magnify trivial ideas. 

  On self-undermining: Yes, Burke's own book risks being mere exported "goods." But his implied defense lies in the audience's discernment. The Reflections addresses British readers within a functioning constitution, where reason can temper enthusiasm—unlike revolutionary France, where (he claims) critical judgment collapsed. The "lights/goods" dichotomy is key: Burke sees true enlightenment as context-dependent wisdom, not abstract theories shipped like cargo. 

