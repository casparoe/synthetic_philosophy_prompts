prompt: |-
  I'm on the standards committee of a loose alliance of about fourteen small research nonprofits -- same ballpark size, similar programs, and we keep facing the same recuring choice: whether to publish our own unflattering evaluation data, whether to pay for an outside audit we know will find problems, whether to adopt a shared reporting standard that makes each of us look worse but makes the whole field more legible. Each org decides for itself, we vote quarterly, and there's real money and reputation on the line. Before each vote we all write short position memos and circulate them, and then everyone reads everyone else's before deciding. None of us are game theorists, and we have one two-hour meeting to settle each one.

  A colleague keeps bringing up superrationality -- her version: when the parties are symmetric and everyone knows everyone reasons the same way, you should choose the option you'd want everyone to choose, acting as if your choice fixes theirs, instead of the option that's best given what the others do. I can't tell if thats a real insight or a nice way of talking yourself into getting burned.

  Can you turn it into a procedure the committee can actually run on each decision? The questions in order, what counts as a good enough answer to each, where it stops with a no, and where it has to hand the call to a person because it's values and not strategy. I especially want it to be straight about the part I'm suspicious of: does circulating our memos first actually make our choices correlated in the way the principle needs, or is that just cheap talk that a sharper org can free-ride on? And what do we do about the two members who've said flat out they'll do whatever's best for them no matter what the rest of us conclude?

  Then run it on three cases: publishing failure data when we think two of the fourteen won't; chipping in to a shared tool that only pays off if at least eight of us fund it; and a third where I suspect the procedure tells us to eat a genuine loss for the group's sake -- I'd rather see that one than have it smoothed over.

  Finish with where this will misfire: the steps that are really coin flips dressed up as principle, the question of who even counts as symmetric with me (do I have to worry about strangers who happen to reason like me?), and what the procedure can't do at all.

  American English please, and skip the citations and reading lists -- I want the machinery, not the literature.
reasoning: |-
  Okay, let me unpack this. The user is part of a standards committee for small research nonprofits facing recurring coordination dilemmas. They're skeptical about a colleague's "superrationality" proposal but want to see if it can be operationalized. The core tension is between individual incentives and collective benefits in situations like publishing unflattering data or funding shared tools.

  Hmm, three key layers here: First, the mechanics - how would a superrationality-based procedure actually work step-by-step? Second, the skepticism - does pre-vote memo sharing create meaningful correlation or just enable free-riding? Third, the edge cases - how to handle defectors and true sacrifice scenarios.

  The user's tone suggests they're a pragmatic operator. They want concrete steps, not theory. That "get burned" comment reveals prior bad experiences with cooperation schemes. Also noting they specifically asked for American English and no citations - this is about actionable solutions.

  For the procedure design, I'm considering a flowchart-like approach with clear exit ramps. The symmetry question is crucial: if memos reveal genuinely aligned reasoning, that creates correlation; if they're just performative, it's useless. The two defectors fundamentally break symmetry - they become environmental constraints rather than players.

  On the cases: 
  1) Failure data publishing looks like a stag hunt - superrationality says publish if you believe most others will, but the two defectors poison that. 
  2) Shared tool is a threshold game - superrationality helps coordinate around the magic number 8. 
  3) The sacrifice case needs to be real - maybe something like adopting costly standards that only benefit smaller members.

  Biggest pitfalls: When memos reveal true disagreement (breaks symmetry), when payoffs aren't actually identical, and when strangers could reason identically but aren't in the game. Also worth flagging that superrationality assumes no deception - which the defectors already violate.

  The procedure should probably have a "symmetry check" after memo review where if anyone objects that interests aren't aligned, it reverts to Nash thinking. And for the defectors - treat them as known quantities, not decision-makers in the superrational frame.
answer: |-
  Here's a straight-talking procedure based on your colleague's superrationality idea, designed for your committee's quarterly votes. It breaks down into steps, handles your skepticism head-on, and identifies where human judgment takes over. 

  **The Superrationality Procedure (Quarterly Vote Flow):**

  1.  **Define the Choice & Symmetry (Pre-Memo):**
      *   **Question:** Is this decision fundamentally symmetric? Do all 14 orgs face *identical* costs/benefits relative to their size/mission, and is the outcome genuinely better for *everyone* if *all* cooperate vs. if all defect? (If "No," skip to Step 6).
      *   **Good Enough Answer?** Majority consensus *before* memos are written that the situation is symmetric *in structure*. Doesn't require identical values, just identical strategic positions. (e.g., Publishing failure data costs each similarly in potential rep, benefits all if all publish; shared tool cost/benefit is the same per org if threshold met).
      *   **Stops with No?** YES. Proceed to standard individual cost-benefit analysis (Nash reasoning). Superrationality doesn't apply.

  2.  **Write & Circulate Position Memos:**
      *   **Purpose:** Reveal reasoning and *demonstrate commitment to considering the collective perspective*. This is **crucial** for correlation.
      *   **The Skepticism Check (Your Question):** Circulating memos *isn't* just cheap talk *if* it reliably signals *how people are reasoning*. If memos consistently show everyone genuinely trying to adopt the "what if everyone did this?" lens, it creates correlation. If memos are justifications for self-interest ("We're special, *we* shouldn't publish"), it fails. **The procedure relies on memos revealing genuine collective intent.** If they don't, superrationality fails.

  3.  **Assess Reasoning & Defectors (Post-Memo Review):**
      *   **Question 1 (Correlation):** Do the memos show that *most* orgs are genuinely reasoning superrationally ("What's best if we all do the same?")? Or are they primarily justifying self-interest?
      *   **Good Enough Answer?** Qualitative judgment. If >10 memos clearly engage with the collective perspective, proceed. If <8 do, or reasoning is overwhelmingly self-interested, correlation is low. **Stops with No?** YES. Revert to Nash reasoning (assume others act in self-interest).
      *   **Question 2 (Defectors):** Have any orgs explicitly stated (in memo or past action) they will *always* choose self-interest, regardless of collective reasoning? (Your two known defectors).
      *   **Good Enough Answer?** Explicit statements or consistent past defection on similar symmetric choices. **Action:** Treat these orgs as *environmental constraints*, not symmetric players. Reduce "N" for superrational calculation (e.g., from 14 to 12). Their predicted defection is factored in *before* applying Step 4.

  4.  **Apply the Superrational Choice Rule:**
      *   **Question:** Ignoring the confirmed defectors (who are now part of the environment), ask: **"If every *symmetric* player (those reasoning collectively) made the *same* choice I make, which choice leads to the best outcome *for each of us*?"**
      *   **Good Enough Answer?** This is a clear, forced choice based on the *assumed universal action* of the symmetric players. Don't calculate probabilities of others acting. Assume your choice *causes* theirs.
      *   **Output:** Identifies the superrational choice (Cooperate or Defect) *for the symmetric group*.

  5.  **Decision Point:**
      *   **If Superrational Choice = Cooperate:** Vote YES *if* the number of symmetric players committed to this reasoning (Step 3) is sufficient for success *despite the defectors*. (e.g., Need 8 funders? Do you have 8+ symmetric players likely voting YES?).
      *   **If Superrational Choice = Defect:** Vote NO.
      *   **Human Judgment:** Deciding if the symmetric group is large/committed enough to succeed despite defectors requires judgment. The superrational rule says *what to aim for*, but final vote checks *feasibility*.

  6.  **Fallback: Nash Equilibrium (If Symmetry Fails Early):**
      *   **Question:** "Given what others are *likely* to do (based on memos, past behavior, defectors), what choice maximizes *my* org's outcome?"
      *   **Use When:** Symmetry fails (Step 1), correlation fails (Step 3), or superrationality points to cooperation but the symmetric group is too small to succeed (Step 5).

  **Running the Cases:**

  1.  **Publishing Failure Data (Assume 2 Defectors Won't Publish):**
      *   **Step 1:** Symmetric? YES (All face similar rep risk/benefit if all publish).
      *   **Step 2:** Memos circulated.
      *   **Step 3:**
          *   *Correlation:* Assume memos show 12/14 reasoning collectively. Good. Proceed.
          *   *Defectors:* 2 known defectors identified. Effective N = 12.
      *   **Step 4:** Superrational Rule: "If all 12 symmetric players publish, is that better for each than if all 12 withhold?" (Assuming collective benefit > individual risk). Likely YES (Publish).
      *   **Step 5:** Superrational Choice = Publish. Can the symmetric group succeed alone? Success likely defined as "critical mass publishes" (e.g., >10). With 12 symmetric players reasoning this way, vote YES.
      *   **Result:** Vote YES to publish. The 2 defectors free-ride, but the group benefit is achieved by the 12 cooperators.

  2.  **Chip in for Shared Tool (Needs 8 funders):**
      *   **Step 1:** Symmetric? YES (Same cost, same benefit if tool exists).
      *   **Step 2:** Memos circulated.
      *   **Step 3:**
          *   *Correlation:* Assume good collective reasoning in memos (12+). Proceed.
          *   *Defectors:* 2 defectors. Effective N = 12.
      *   **Step 4:** Superrational Rule: "If all 12 symmetric players fund, the tool gets built (12>8), each pays cost C but gains benefit B (B>C). Better than if all 12 don't fund (no tool, no cost)." YES (Fund).
      *   **Step 5:** Superrational Choice = Fund. Is the symmetric group large enough? Need 8 funders, have 12 potential symmetric funders. Vote YES.
      *   **Result:** Vote YES. Tool funded even if defectors don't pay.

  3.  **Eating a Loss: Adopting a Costly Shared Reporting Standard (The Sacrifice):**
      *   **Scenario:** Adopting a new, complex standard costs each org $50k/year in staff time. Benefit: Makes the *whole field* more legible to major funders, *potentially* increasing total funding by $1M/year, distributed proportionally (~$71k/org). *But* if even one org uses the old, messy standard, funders get confused, and the benefit vanishes. Defectors (2) will definitely keep the old standard.
      *   **Step 1:** Symmetric? YES (All face same cost, same *potential* benefit *iff all symmetric players adopt*).
      *   **Step 2:** Memos circulated.
      *   **Step 3:**
          *   *Correlation:* Assume strong collective reasoning (12+). Proceed.
          *   *Defectors:* 2 confirmed. Effective N=12.
      *   **Step 4:** Superrational Rule: "If all 12 symmetric players adopt: Each pays $50k. Benefit requires *all 14* to adopt to avoid confusion? **NO BENEFIT** (Defectors ruin it). Outcome: -$50k each. If all 12 defect (keep old standard): Cost $0, Benefit $0. Outcome: $0. $0 > -$50k. Superrational Choice = **Defect (Don't Adopt)**.
      *   **Step 5:** Superrational Choice = Defect. Vote NO.
      *   **Result:** Vote NO. The superrational outcome (all defect) is better than the would-be cooperative outcome ruined by defectors. **This is the genuine loss for the group's sake:** The potentially beneficial standard *cannot be adopted* because the defectors prevent the benefit from materializing, making cooperation strictly worse for the cooperators. The group loses the potential $1M benefit because it's unattainable with defectors present. Superrationality tells you *not* to throw good money ($50k) after bad (unachievable benefit).

  **Where It Misfires (The Limits & Pitfalls):**

  1.  **Symmetry is Fragile:** The core pitfall. Are your orgs *truly* symmetric? Hidden differences in financial cushion, board pressure, or risk tolerance break it. If Org A can absorb a rep hit easier than Org B, Step 1 fails. **Procedure relies on honest upfront assessment of symmetry.**
  2.  **"Cheap Talk" Memos:** If memo writing becomes performative ("*Say* we care about the collective, *do* what's best for us") instead of revealing genuine reasoning, Step 3 fails. Correlation is fake. Sharp orgs *can* free-ride by signaling cooperation while planning defection. **Procedure depends on cultural norms of honesty within the alliance.**
  3.  **Defectors Break the Magic:** As Case 3 shows, known, immutable defectors destroy many potential superrational gains. They turn winnable games (Case 1 & 2) into losses (Case 3). The procedure identifies this, but can't fix it.
  4.  **The Stranger Problem ("Do I worry about strangers?"):** NO. Superrationality requires *known mutual awareness* of shared reasoning within the defined group ("We're all reading each other's memos and trying to do this together"). Random strangers reasoning similarly elsewhere don't create the necessary correlation. They are part of the environment, not players in *this* game.
  5.  **Values vs. Strategy Blur:** The procedure assumes "best outcome" is defined (Step 4). But *is* collective reputation (Case 1) objectively "better" than avoiding individual risk? That's a *value judgment*. Superrationality tells you *how* to achieve the collectively desired outcome *if* you value it, not *whether* you should value it. Steps 1 and 4 sneak in values disguised as strategy. **Human judgment is unavoidable in defining the payoffs.**
  6.  **Coin Flips Dressed Up:** When the superrational choice (Step 4) and the Nash choice (Step 6) point in the same direction, the procedure feels decisive. When they conflict, the choice between Steps 3 (is correlation real?) and 5 (is the group large enough?) involves major judgment calls that can feel arbitrary. The assessment of memo sincerity (Step 3) is inherently subjective.
  7.  **Can't Handle Asymmetry or Complex Games:** It only works for simple, symmetric coordination problems (Prisoner's Dilemma, Stag Hunt, Thresholds). Complex negotiations, vastly different stakes, or games without a clear "all cooperate" vs. "all defect" structure are out of scope. Use Nash reasoning (Step 6) or other tools.

  **The Bottom Line:** This procedure makes your colleague's superrationality concrete. It *can* guide you towards better collective outcomes in true symmetric dilemmas **if** your memo process fosters genuine collective reasoning and reveals defectors. It **will fail** if symmetry is absent, memos are dishonest, or defectors are immutable. Case 3 starkly shows its limitation: sometimes the collectively beneficial outcome is strategically impossible, and superrationality correctly tells you not to cooperate into a loss. Use it as a structured lens for *some* votes, not a universal solver. Always default to Nash (individual cost-benefit given others) when symmetry or correlation is in doubt.
