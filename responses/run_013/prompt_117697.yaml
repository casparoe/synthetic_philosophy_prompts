prompt: |-
  I spent thirty-odd years as a physical chemist doing combustion and air-quality modeling, retired three years ago, and have been reading philosophy of science since — slowly, and mostly badly. Last month the old lab group had its annual dinner and we spent two hours argueing about the thing we used to argue about in the corridor: does it matter that the assumptions in our models were false? My line was that I invented numbers for things nobody has ever measured — a mixing rate inside a burner can, a deposition velocity for a particle species that doesn't quite exist — and the model still called the stack concentrations right, so who cares. Then a colleague said this was just Friedman's old move, the one Samuelson nicknamed the F-twist: assumptions don't have to be realistic, only the predictions matter, and the more important the theory the less realistic its assumptions tend to be. He said it like it ended the discussion and it didn't end it for me, because I don't think I ever actually believed it while I was doing the work. So before I read any more of this literature I want the specification first: what does any adequate account of idealization in scientific modeling have to deliver?

  Give me the requirements list. Each requirement with the case or consideration behind it, and mark which ones are non-negotiable and which are just what one camp happens to want. Here's the material I want it answerable to, because this is the part I've never seen handled together. (i) Cases where I could in principle undo the lie with a limit and the answer would survive — my mixing-rate fudge: make the mixing rate infinite, the reactor becomes perfectly mixed, everything is solvable, and if you put the finite rate back the answer moves a little but not catastrophically. (ii) Cases where the lie is load-bearing and no such limit exists — an infinite population in a genetics model, a lattice spacing sent to zero, a thermodynamic limit where the phase transition only appears because the system is infinite, zero viscosity in a fluid. Here the result doesn't survive de-idealization, it's an artifact of it, and yet we treat it as knowledge. (iii) A parameter that stands in for everything you left out and is fitted to data — which is how we all actually worked, and which seems like a different animal from a clean limiting-case idealization, though I can't say why. (iv) The awkward fact that when a student finally measured one of my fudged quantities and I put the honest number in, the model got worse at predicting. (v) That I can legitimately ask what would happen with zero friction or zero viscosity when nothing has zero of either. (vi) That two incompatible idealizations of the same system, with incompatible pictures of what's going on inside, can both predict well and both seem to explain. (vii) That students and postdocs learn from these models rather than merely despite them.

  Then: flag any pair of requirements you think can't be jointly satisfied — that's the part I most want, since I suspect (ii) and (iv) are in some tension with the whole idea that models explain. And tell me which single requirement does the most work excluding candidates. Keep the weight on the criteria; if there's room, one line each on where the two or three best-known positions land, but no reading list, I'll find the literature myself. Bullets are fine, under 800 words.
reasoning: |-
  Okay, let me tackle this user's query. They’re a retired physical chemist with decades of experience in combustion modeling, now diving into philosophy of science. Their lab group argued about whether false assumptions in models matter, referencing Friedman’s F-twist. The user wants a set of requirements for any theory of idealization in science, based on specific cases from their work.

  First, I need to unpack their seven cases. Each represents a different challenge for theories of idealization. For example, (i) involves harmless idealizations where predictions hold even after de-idealization, while (ii) deals with cases where the idealization is essential—like infinite systems where phase transitions emerge. Then there’s (iii), where parameters are fudged to fit data, and (iv) where correct values worsen predictions. The user also mentions (v) the legitimacy of impossible scenarios (zero viscosity), (vi) incompatible models both working, and (vii) models as learning tools.

  The key is to distill these into non-negotiable requirements. The user wants to know which requirements conflict, especially between (ii) and (iv) and the notion that models explain. They also want to know which requirement is the hardest to meet. 

  Starting with non-negotiables: Predictive Robustness seems essential because models must withstand real-world testing. Representational Opacity is crucial because, as in (ii) and (iv), the model’s internal inaccuracies can be necessary for correct predictions. Explanatory Power is tricky; even when models rely on false assumptions, they must offer some explanation. Pragmatic Utility covers why scientists use these models despite their flaws, like in teaching or computation.

  Negotiable requirements include Truth-Tracking, which some realist theories demand but instrumentalists reject. Ontological Commitment varies—does the model need to reflect reality? Reduction-to-Limit might be nice but isn’t always possible, especially in cases like infinite systems.

  Conflicts arise between Representational Opacity and Explanatory Power. If a model’s internal inaccuracies are necessary (like infinite populations for phase transitions), how can it explain? This ties into (ii) and (iv). Also, Pragmatic Utility vs. Truth-Tracking: models are useful for teaching and prediction even when they’re not true, which clashes with demands for realism.

  The biggest challenge is Representational Opacity. Many theories struggle with why models work despite false assumptions. Friedman’s instrumentalism accepts it, but realism needs to reconcile falsehoods with explanation. This requirement likely rules out strict realist accounts.

  In summary, the user needs a framework that accommodates the pragmatic aspects of modeling while addressing the tension between false assumptions and explanatory success. Highlighting conflicts and key requirements helps them navigate the philosophy without getting lost in abstract debates.
answer: |-
  Here's a requirements list for an adequate account of scientific idealization, grounded in your cases, categorized by negotiability and highlighting tensions:

  ### Non-Negotiable Requirements (Essential for any account)
  1.  **Predictive Robustness:** Must explain how models with *known* false assumptions can reliably predict real-world phenomena (your stack concentrations, phase transitions in (ii), zero-viscosity predictions in (v)). *Case:* (i), (ii), (v). *Why:* Core function of science; your daily work.
  2.  **Representational Opacity ("Working Despite Falsehoods"):** Must accommodate that a model's *internal* representational accuracy (assumptions about entities/processes) can be decoupled from its predictive success. *Case:* (iii) (fudge factors), (iv) (honest number made it worse), (vi) (incompatible internals both work). *Why:* Your experience with fudged quantities and parameter fitting; the F-twist intuition.
  3.  **Pragmatic Utility:** Must explain why idealized models are *necessary* tools for scientific practice: computation, understanding, communication, teaching (vii), and exploring possibilities (v). *Case:* (i) (solvability), (v), (vii). *Why:* Without idealization, complex science grinds to a halt.
  4.  **Explanatory Power (Minimal):** Must account for how idealized models provide *some* form of understanding, even if not strictly "true" (e.g., isolating key factors, showing possibility, answering "what if"). *Case:* (v), (vii) (learning). *Why:* Science seeks more than just prediction; models feel explanatory.

  ### Negotiable Requirements (Dependent on philosophical stance)
  5.  **Truth-Tracking Aspiration:** Should address whether/why attempts to *reduce* idealizations (closer to truth) are valuable *beyond* immediate pragmatics. *Case:* (i) (limit exists), (iv) (trying the honest number). *Why:* Realists demand this; instrumentalists see it as optional.
  6.  **Ontological Commitment Constraint:** May require specifying what aspects of the model *must* correspond to reality for it to "explain" (vs. just predict). *Case:* (ii) (infinite systems), (vi) (incompatible internals). *Why:* Realists insist on this; pragmatists/instrumentalists downplay it.
  7.  **Reduction-to-Limit Account:** May be expected to explain *when* and *why* taking a limit (e.g., infinite size, zero viscosity) yields valid knowledge about finite, messy systems. *Case:* (i), (ii). *Why:* Common in physics/math; shows connection to less idealized cases.

  ### Key Tensions Between Requirements
  *   **Representational Opacity (RN2) vs. Explanatory Power (RN4):** This is the core tension you identified (between ii/iv and explanation). *If the model's internal picture is fundamentally wrong or relies on impossible fictions (ii), how can it genuinely **explain** the phenomenon?* Accounts emphasizing RN2 (instrumentalism) often weaken "explanation" to mean "predictive systematization" or "useful fiction." Accounts emphasizing RN4 (realism) struggle to accommodate RN2 fully.
  *   **Pragmatic Utility (RN3) vs. Truth-Tracking Aspiration (N5):** The drive for simple, usable models (RN3, vii) often conflicts with the desire for more realistic, complex models (N5, iv). Your fudge factors (iii) are the epitome of this.
  *   **Predictive Robustness (RN1) vs. Ontological Commitment Constraint (N6):** How can a model predict robustly if its core ontological commitments (e.g., infinite systems, point particles) are false? Realists (N6) need to explain this; instrumentalists (downplaying N6) don't see the problem.

  ### Requirement Doing the Most Work Excluding Candidates: Representational Opacity (RN2)
  *   **Why:** This is the hardest pill for realist accounts to swallow. Naive realism (models must be approximately true "all the way down") is immediately falsified by (ii), (iii), (iv), and (vi). Accounts that cannot handle the disconnect between internal representation and predictive success fail. Friedman's F-twist is one (instrumentalist) response to RN2. Structural realists try to salvage RN2 by claiming models capture only abstract *structures* (relations) not the *nature* of entities. Entity realists might focus on specific well-confirmed entities within an otherwise fictional model.

  ### Where Major Positions Land (Briefly)
  *   **Instrumentalism (e.g., Friedman's F-twist):** Embraces RN1, RN2, RN3. Weakens RN4 to predictive utility. Rejects N6. Sees N5 & N7 as irrelevant.
  *   **Realism (various flavors):** Emphasizes RN1, RN4, N5, N6. Struggles mightily with RN2 (key exclusion point). Tries to reconcile via "mature theories," "approximate truth," or isolating "essential" truths.
  *   **Pragmatism/Model-Based Views:** Focus on RN1, RN2, RN3, RN4 (as contextual understanding). Downplay N6. See models as purpose-built tools (vii) rather than truth-mirrors. Handle RN2 well.

  This framework prioritizes the phenomena you encountered as a practitioner. The tension between RN2 (falsehoods enabling success) and RN4 (explanation) is the central philosophical battleground your experience highlights.
