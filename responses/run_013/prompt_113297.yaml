  Okay, the user is in a graduate seminar on truth, and their colleague made a one-liner about truth not being a property but only a device for disquotation. They want me to disambiguate that statement rather than defend it. So, I need to break down the possible interpretations of what the colleague meant, from trivial to radical.

  First, I recall that deflationism about truth is the main context here. Deflationists argue that truth isn't a substantive property. Instead, 'true' is just a linguistic tool for disquotation, like turning "Snow is white" into " 'Snow is white' is true." But what exactly does that imply? I should list out different readings of the colleague's claim.

  Starting with the most basic: maybe they meant that 'true' isn't a predicate. But in English, it clearly is a grammatical predicate. That seems too weak. So, perhaps they meant it's a predicate but doesn't denote a real property. That's a bit stronger. Then there's the idea that it denotes a logical property, which is minimal. Another angle is that its function is expressive—used for endorsement or generalization. Lastly, the normativity aspect: truth as a norm for assertion or belief.

  For each reading, I need to assess plausibility, substantiveness, and whether it supports the conclusion that truth can't be a norm of inquiry. The colleague's conclusion was that truth can't be the aim or norm of inquiry, so I have to check if each interpretation actually backs that up.

  For example, if 'true' is just a tool for disquotation, even deflationists often agree it can still function as a norm. Paul Horwich's minimalism allows for truth to be the norm of belief. So, even if truth isn't a substantive property, it might still serve as a normative goal. That means the colleague's argument might not hold under certain readings.

  The user also wants to know which reading a deflationist most likely intended. I think the expressive function (Reading 4) is common among deflationists, like in Quine or Field. But even then, it doesn't necessarily preclude truth from being a norm. So, the colleague's jump from disquotation to dismissing the norm of inquiry might be a non sequitur.

  The user's deeper need is probably to clarify the argument for their seminar. They need to show that the colleague's one-liner doesn't necessarily dissolve the question about truth's normative role. They might want to demonstrate that deflationism doesn't automatically eliminate truth as a norm, which is a common point of debate.

  I should also consider if there are other interpretations. Maybe the colleague is conflating different claims. For instance, confusing the metaphysical status of truth with its normative function. Highlighting that distinction is key.

  In the end, I'll need to summarize which reading is most plausible for a deflationist and which the seminar argument needed. The colleague likely meant that truth is only expressive, but the argument needed to show that it can't be a norm, which isn't supported by that reading.
answer: |-
  Here's a precise disambiguation of your colleague's one-liner, breaking down possible readings from trivial to radical, assessing their plausibility, substantiveness, and ability to support the conclusion that truth cannot be the aim or norm of inquiry:

  ### The One-Liner
  "Truth is not a property but only a device for disquotation."

  ### Disambiguated Readings

  1.  **'True' is not a grammatical predicate (syntactic claim):**
      *   **Claim:** The word "true" does not function grammatically as a predicate in natural language.
      *   **Plausibility:** **Implausible.** "True" syntactically behaves as a predicate ("That is true," "The proposition is true"). This is undeniable.
      *   **Substantive?** **No.** Purely linguistic observation.
      *   **Supports Conclusion?** **No.** Even if it weren't a grammatical predicate (which it is), its *function* could still be normative.
      *   **Relation to Deflationism:** Deflationists universally reject this; they *affirm* 'true' is a predicate, just a special one.

  2.  **'True' is a predicate but does not denote a substantive property (minimal metaphysical claim):**
      *   **Claim:** While "true" is grammatically a predicate, it does not pick out a robust, explanatory, or natural property (like mass, charge, or even belief). There's no "nature of truth" to investigate beyond its linguistic function.
      *   **Plausibility:** **Plausible (Core Deflationist View).** This is a standard deflationist position (e.g., Horwich, Quine). The disquotational schema (""p" is true iff p") exhausts the concept's content.
      *   **Substantive?** **Yes.** This is a significant metaphysical claim denying that truth has an underlying nature or explanatory role in theories of mind, language, or reality.
      *   **Supports Conclusion?** **No, not directly.** Denying truth is a substantive property does *not* entail it cannot function normatively. Deflationists (like Horwich) often explicitly *affirm* that truth is the norm of belief/assertion, *despite* it not being a substantive property. The normative role is seen as stemming from the concept's function or the nature of belief itself, not from a robust property.

  3.  **'True' denotes a merely logical or expressive property (functional characterization):**
      *   **Claim:** "True" picks out a property, but one that is purely logical or expressive – its essence is defined by its role in logical operations (e.g., generalization: "Everything he said is true") or expressive endorsement ("That's true!"), captured fully by the disquotational schema.
      *   **Plausibility:** **Plausible (Another Core Deflationist View).** This emphasizes the *function* of the truth predicate as a device for infinite conjunction/disjunction and endorsement, rather than describing a feature of propositions "out in the world."
      *   **Substantive?** **Yes.** It makes a claim about the *kind* of property truth is (logical/expressive) and denies it has any further metaphysical weight.
      *   **Supports Conclusion?** **No.** Again, a logical/expressive role is perfectly compatible with a normative role. Saying "Believe only what is true" leverages the expressive/generalizing function to state a norm. The disquotational device itself facilitates expressing and generalizing norms.

  4.  **The *sole* function of 'true' is expressive endorsement or generalization (strong functional claim):**
      *   **Claim:** The *only* reason to use the word "true" is to endorse a claim ("That's true!") or to generalize over claims ("All axioms are true"). Disquotation explains how it fulfills *this* function, not that it describes a property.
      *   **Plausibility:** **Highly Plausible (Central Deflationist Tenet).** This is a common focus for deflationists (e.g., Field, Grover's Prosententialism). The utility of "true" lies entirely in these expressive/logical economies.
      *   **Substantive?** **Yes.** It defines the purpose of the concept/predicate very narrowly.
      *   **Supports Conclusion?** **Still No.** Expressing endorsement ("That's true!") *is* performing a normative act. Generalizing norms ("Believe only true propositions") is a crucial way norms *are* articulated. The device's expressive function is precisely what *enables* its normative use. Denying a robust property doesn't erase this function.

  5.  **Truth cannot be a norm of assertion or belief (normative claim):**
      *   **Claim:** Because truth is "only a device for disquotation," it cannot play the role of being that which we *ought* to believe or assert. Norms must be grounded in something more substantive.
      *   **Plausibility:** **Highly Controversial / Implausible.** Most philosophers, *including prominent deflationists*, argue that truth *is* the fundamental norm of belief and assertion *precisely because of* its disquotational/expressive nature. Saying "You should believe what is true" is effectively saying "You should believe *p*" only when *p*. The norm seems inescapable given the concept's function.
      *   **Substantive?** **Yes.** This is a direct claim about normativity.
      *   **Supports Conclusion?** **Yes, but...** This reading *is* the conclusion your colleague is trying to support ("truth cannot be the aim or norm of inquiry"). However, it doesn't *follow* logically from the first part ("not a property, only a device"). It requires the *additional, highly contentious premise* that only substantive properties can ground norms. This premise is widely rejected, especially by deflationists who *do* accept truth as a norm.

  ### Conclusion: Deflationist Meaning & Seminar Needs

  *   **Most Likely Deflationist Meaning:** Your colleague almost certainly intended a combination of **Reading 2 (no substantive property)** and **Reading 4 (sole function is expressive/generalization)**. This is the core deflationist position: truth lacks a deep nature, and 'true' is a useful linguistic tool for endorsement and generalization, fully explained by the disquotational schema. They likely gestured towards **Reading 5 (cannot be a norm)** as the *consequence* they think follows.
  *   **Reading the Seminar Argument Actually Needed:** The seminar argument *needed* **Reading 5 (truth cannot be a norm)** to directly challenge the idea of truth as the aim/norm of inquiry. However, **Readings 2 and 4 (the plausible deflationist claims) do not entail Reading 5.** The move from "truth is not a substantive property/only a disquotational device" to "truth cannot be the norm" is a **non sequitur**. It requires the unsupported (and deflationist-contradicting) premise that only substantive properties can serve as norms. Prominent deflationists explicitly reject this leap.

  Therefore, your colleague's one-liner, interpreted as the plausible deflationist claims (2 & 4), **does not successfully dissolve the question about truth's normative role.** It clarifies *how* deflationists understand truth (denying a robust property, emphasizing its linguistic function) but fails to show why this understanding precludes truth from functioning as the constitutive aim or norm of inquiry. The normative question remains open even on a deflationary account.
