prompt: |-
  I'm a backend engineer, no philosophy training, and I've somehow ended up having to write a proposal for a small research grant — six months, part time, one of those public-interest tech funders, mixed room of economists and engineers on the review panel. Topic is futarchy: the idea that we vote on what we want (some welfare metric) and then let prediction markets decide which policy to actually run, because the market prices tell you which option scores higher on the metric.

  The usual objections I keep running into are manipulation, thin liquidity, and who gets to pick the metric, and honestly those all feel like engineering problems that some design tweek would fix. My half-formed worry is different and I can't tell if it's the whole game or nothing: the market is supposed to price two things at once — how the metric turns out if we do X, and how it turns out if we don't — but we only ever get to live in one of those worlds. One side of the bet never gets checked against anything real. So the market is being asked to put a number on a claim that nothing will ever settle, and if that's right then I want to know exactly when that's fatal and when it's harmless. My hunch is that it's fine whenever the decision gets repeated and randomly assigned — feature flags, staggered rollouts, A/B tests, the stuff I do at work — and that this quietly shrinks futarchy's real territory to a much smaller patch than its fans think, possibly even to cases where you could just run the experiment and skip the market entirely. But I might be wrong in an interesting way.

  Turn this into a two-page proposal. I need: the question stated so precisely that it has a definate answer and isn't just "is futarchy good"; why the standard objections and the standard replies to them don't already settle it; the method — what I'd actually do, phase by phase across six months, including the small thing I want to build (a two-sided conditional market over something cheap and fast, run with colleagues at work, to see whether the side that never gets settled goes dead, drifts somewhere silly, or gets gamed); what the answer looks like in each direction and what would count as the project failing; and an honest read on whether this fits in six part-time months or is really a three-year thing. Don't give me a reading list or citations, I'll fill those in myself — just argue the case.
reasoning: |-
  We are writing a research grant proposal on a specific technical concern in futarchy: the problem of counterfactual outcomes never being observed. The proposal should be two pages, structured as follows:

  1. **Title and Summary**: Clear and catchy.
  2. **The Core Question**: Precisely stated, with a definite answer. Not "Is futarchy good?" but a focused investigation on whether the unobserved counterfactual causes market failure, and under what conditions (e.g., repeated decisions with random assignment make it harmless, otherwise fatal).
  3. **Why Existing Discussions Fall Short**: The standard objections (manipulation, liquidity, metric definition) are engineering problems with potential solutions. This counterfactual problem is more fundamental and under-explored.
  4. **Method**: 
     - Phase-by-phase plan for 6 months part-time.
     - Build a small conditional prediction market (two-sided) on something cheap and fast (e.g., using play money or small stakes among colleagues). The market will condition on a policy being implemented or not. We will not implement the policy in reality, so one side is never settled. We want to observe: does the unresolved side go dead (no trading), drift arbitrarily, or get manipulated?
     - We will run this in a controlled environment (with colleagues) and simulate repeated decisions (like A/B tests) to see if that stabilizes the market.
  5. **Possible Outcomes and Interpretation**:
     - If the unresolved market stays active and well-behaved in repeated settings: supports futarchy in repeatable contexts.
     - If it fails (dead, drifting, gamed) even in repeated settings: undermines futarchy even in its "safe" territory.
     - If only fails in non-repeated settings: then futarchy is limited to repeatable decisions (which is a major restriction).
     - Project failure: if we cannot get enough participation, or if the results are inconclusive.
  6. **Timeline Feasibility**: Argue that 6 months part-time is enough for a small-scale test. We are building a minimal market and running it with a small group. If it turns out to need more, we'll have a prototype and initial data to justify a bigger study.

  Let's structure the two-page proposal accordingly.

  ---

  **Page 1**

  **Title:** The Counterfactual Problem in Futarchy: When Can Unobserved Outcomes Be Priced?

  **Summary:** This project addresses a fundamental but understudied challenge in futarchy: prediction markets must price outcomes that will never be observed (the "road not taken"). We test whether such markets fail when counterfactuals remain unresolved, and whether repeated decision contexts (like A/B testing) mitigate the issue. We build a minimal conditional prediction market to observe behavior in unresolved scenarios, with direct implications for the viability of futarchy in real-world governance.

  **1. The Core Question**

  In futarchy, a conditional prediction market is used to estimate the expected value of a welfare metric under two mutually exclusive scenarios: (1) a policy is implemented, and (2) it is not. However, only one scenario becomes reality; the other remains a counterfactual. This leads to a critical question:

  *Can a prediction market efficiently price the outcome of an event that will never be observed, and if not, under what conditions (e.g., repeated decisions with random assignment) does this inefficiency become negligible?*

  This question must be answered with a definite outcome: we will either identify that unresolved counterfactuals cause market failure (e.g., through drift, manipulation, or loss of liquidity) or demonstrate that in specific contexts (like repeated A/B testing) the market remains robust. The answer will delineate the boundaries of futarchy's applicability.

  **2. Why Existing Discussions Fall Short**

  Standard critiques of futarchy focus on:
  - **Manipulation**: Bad actors distorting prices.
  - **Thin liquidity**: Lack of trading leading to volatile or unrepresentative prices.
  - **Metric definition**: Disputes over what welfare metric to optimize.

  These are solvable with engineering: anti-sybil mechanisms, market makers, and participatory metric design. However, the counterfactual problem is distinct and foundational. It questions the very mechanism by which futarchy derives authority: the market's ability to price unobservable futures. If the market cannot reliably price an outcome that never occurs, then futarchy's core premise — that market prices reflect expected welfare — fails. This issue is rarely addressed in depth, and when it is, the discussion remains theoretical. We lack empirical evidence on when and how it manifests.

  **Page 2**

  **3. Method**

  We will build and run a small-scale conditional prediction market to test the counterfactual problem. The experiment will run in three phases over six months (part-time, ~10 hours/week).

  - **Phase 1: Design and Build (Months 1-2)**  
    Develop a minimal two-sided conditional prediction market platform.  
    - **Market structure**: Two assets for each decision:  
      - Asset A: Pays $1 if the welfare metric meets a threshold *when the policy is implemented*.  
      - Asset B: Pays $1 if the welfare metric meets the same threshold *when the policy is not implemented*.  
      - The market will run for a set period (e.g., one week).  
    - **Implementation**: Web-based, using play money or small stakes (e.g., $10/user) among colleagues.  
    - **Policy context**: Simple, fast-cycling decisions (e.g., "Should our team switch to a new tool?"). The welfare metric is objective and measurable (e.g., "average task completion time").  

  - **Phase 2: Experiment (Months 3-4)**  
    Run the market in two modes:  
    - **Non-repeated mode**: A single decision. After the market closes, we *publicly flip a coin* to decide which policy to implement, then measure the welfare metric. Only one asset (A or B) is settled; the other expires worthless.  
    - **Repeated mode**: Run 10-20 iterations of similar decisions (e.g., "Should we use tool X for task Y?"). Each iteration randomly assigns the policy (like an A/B test) and settles both assets (since we observe both worlds).  
    We measure:  
    - Liquidity (trading volume, bid-ask spread).  
    - Price stability (volatility, convergence).  
    - Manipulation attempts (via user surveys and activity logs).  

  - **Phase 3: Analysis (Months 5-6)**  
    Compare market behavior between:  
    - Resolved assets (in repeated mode, both sides settled).  
    - Unresolved assets (in non-repeated mode, one side never settled).  
    Key metrics: Does the unresolved side see declining liquidity, price drift, or abnormal trading patterns? Does repeated random assignment stabilize prices?  

  **4. Possible Outcomes and Interpretation**  

  - **If unresolved markets stay liquid and stable in repeated settings**: Futarchy may work for repeatable decisions (e.g., software rollouts).  
  - **If unresolved markets fail (dead, drifting, gamed) even in repeated settings**: Futarchy's core mechanism is flawed, even in its "safe" territory.  
  - **If failure only occurs in non-repeated settings**: Futarchy is restricted to repeatable contexts, excluding one-off decisions (e.g., constitutional changes).  
  - **Project failure**: Inconclusive results (e.g., insufficient participation) or technical flaws in the market design. We mitigate this by using a captive audience (colleagues) and simple policies.  

  **5. Timeline Feasibility**  

  Six months part-time is feasible because:  
  - We build a minimal market (no blockchain, simple UI).  
  - Experiments run with a small group (~20 colleagues) on low-stakes decisions.  
  - The core question is narrow: we are not testing futarchy at scale, but one specific failure mode.  
  If we find promising results, this becomes a pilot for a larger study. If not, we have a null result that redirects futarchy research. Either way, we deliver a working prototype and dataset.  

  **Conclusion:** This project tackles a blind spot in futarchy. By clarifying the counterfactual problem, we either expand its domain (with safeguards) or constrain it to where it belongs.
answer: |-
  ### **The Counterfactual Problem in Futarchy: When Do Unobserved Outcomes Sink Prediction Markets?**  
  **A Six-Month Technical Investigation**  

  ---

  ### **1. The Core Question**  
  Futarchy relies on conditional prediction markets to price two mutually exclusive futures: (1) the expected welfare metric if policy *X* is implemented, and (2) the expected welfare if *X* is *not* implemented. Crucially, **only one future becomes real; the other remains an unobservable counterfactual**. This proposal tests a specific failure mode:  


  > *When the outcome of a policy is never observed (because it wasn’t implemented), does the market for that "unrealized" policy degrade—through liquidity collapse, price drift, or manipulation—and does this degradation distort the original decision?*  


  **We will answer this precisely:** Does the unresolved side of a conditional prediction market (CPM) behave reliably *only* when decisions are repeated and randomly assigned (e.g., A/B tests), and fail otherwise? The answer is binary:  
  - **Yes, repetition stabilizes**: Futarchy is viable *only* for repeatable decisions (e.g., software rollouts).  
  - **No, markets degrade universally**: Futarchy’s core mechanism is flawed, even in "safe" contexts.  

  This isolates the counterfactual problem from standard objections, defining success as empirical evidence for/against degradation under repetition.  

  ---

  ### **2. Why Existing Discussions Fall Short**  
  Standard critiques (manipulation, liquidity, metric definition) are addressable with engineering:  
  - **Manipulation?** Mitigated via identity proofs or stake-weighted voting.  
  - **Thin liquidity?** Fixed with automated market makers.  
  - **Metric disputes?** Resolved through participatory design.  

  **But the counterfactual problem is distinct and unresolved:**  
  - Theoretical work (e.g., Hanson 2007) assumes markets price counterfactuals accurately, but admits this is untested.  
  - Critics (e.g., Friedman 2009) argue unobserved outcomes invite speculation, but offer no data on *when* this matters.  
  - No experiments isolate how unresolved markets behave: Do they drift? Die? Or get gamed? Without this, futarchy’s territory is ambiguously defined.  

  This gap leaves futarchy vulnerable to your "whole game or nothing" worry. If markets fail to price unobserved futures robustly, even repeatable contexts may not save it.  

  ---

  ### **3. Method: A Two-Sided Conditional Market Test**  
  We’ll build a minimal CPM to observe unresolved markets in controlled settings. **Phases (6 months part-time, ~10 hrs/week):**  

  #### **Phase 1: Build (Months 1–2)**  
  - **Construct a two-sided CPM:**  
    - Platform: Lightweight web app (Python/React, no blockchain).  
    - Market design: For each policy *X*, two assets trade:  
      - Asset A: Pays $1 if metric *M* > threshold *T* *when X is implemented*.  
      - Asset B: Pays $1 if *M* > *T* *when X is not implemented*.  
    - Settlement: One asset pays based on real-world outcome; the other expires unresolved.  
  - **Policy context:** Use trivial, fast-cycling decisions at my workplace (e.g., "Switch code review tool?"). Metric *M* is objective (e.g., "PR review time").  
  - **Stakes:** Micro-payments ($0.10–$1 per trade) with 20 colleagues to ensure participation.  

  #### **Phase 2: Experiment (Months 3–4)**  
  - **Test 3 scenarios:**  
    1. **Non-repeated, unresolved:** Run a market for a single policy decision (e.g., "Adopt Tool Z?"). Post-market, flip a coin to implement (or not). Settle only the winning asset; leave the other unresolved.  
    2. **Repeated, resolved:** Run 10–15 rapid A/B tests (e.g., "Use Tool Z for *this* sprint?"). Randomly assign policies, measure outcomes for *both* branches, and settle all assets.  
    3. **Non-repeated, manipulated:** Introduce a confederate trader to deliberately distort the unresolved asset (e.g., pump/dump).  
  - **Measure:**  
    - Liquidity decay (trades/day, bid-ask spread).  
    - Price drift (variance from initial equilibrium).  
    - Manipulation success (profit extracted by bad actors).  

  #### **Phase 3: Analysis (Month 5–6)**  
  - **Compare:** Asset behavior in resolved (A/B tests) vs. unresolved (one-off) markets.  
  - **Thresholds for degradation:**  
    - Failure: Unresolved assets see >50% liquidity drop, >30% price drift, or >20% manipulator profit.  
    - Success: Resolved (repeated) markets show <10% divergence from equilibrium.  

  ---

  ### **4. What the Answer Looks Like**  
  - **If unresolved markets degrade in non-repeated tests BUT stabilize under repetition:** Futarchy works *only* for repeatable decisions (e.g., feature flags). This shrinks its territory drastically—ironically, to cases where A/B tests already exist.  
  - **If markets degrade universally:** Even repetition fails to prevent drift/manipulation. Futarchy’s core mechanism is broken.  
  - **If no degradation occurs:** Counterfactual pricing is robust, expanding futarchy’s viability.  

  **Project failure conditions:**  
  - Inconclusive data (e.g., insufficient trading volume).  
  - Technical flaws in market design (e.g., stakes too low to incentivize engagement).  
  - External validity limits (e.g., workplace policies too trivial).  
  *Mitigation:* Use captive colleagues, high-frequency decisions, and real stakes.  

  ---

  ### **5. Timeline Feasibility**  
  **This fits six part-time months:**  
  - Why it works:  
    - The prototype is minimal (no cryptography, simple UI).  
    - Experiments leverage my workplace (no recruitment overhead).  
    - Policies are low-stakes and rapid (e.g., weekly sprint tools).  
    - We test one mechanism (counterfactual pricing), not full futarchy.  
  - **Risks:**  
    - If participation lags, we extend testing via Amazon Mechanical Turk (small budgets).  
    - If degradation patterns are subtle, we focus on binary liquidity/drift metrics.  
  - **If we need three years?** Only if scaling to real-world policies (e.g., city budgets). Here, we deliver a proof-of-concept that forces a pivot: Either futarchy retreats to repeatable domains, or we kill it.  

  ---

  ### **Conclusion: Why This Matters**  
  Futarchy promises democracy for goals, markets for means. But if markets can’t price the road not taken, it collapses. This project forces a concrete answer: We’ll show whether counterfactuals are a footnote or a funeral. Either outcome helps funders—by rescuing futarchy for a niche, or redirecting efforts to better mechanisms. Building this CPM will cost <$5K in labor/stakes; the answer could save millions in misguided R&D.  

  ---  
  **Grant Request:** $15,000 (for development, micro-payments, and analysis).  
  **Deliverables:** Working CPM prototype, dataset, and a conclusive "yes/no" on degradation under repetition.
