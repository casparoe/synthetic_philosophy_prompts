prompt: |-
  I am putting together a two-session reading group for non-specialists — a handful of lawyers, an engineer, and two retired teachers, all sharp, none with any philosophy past an introductory course — on the norm of assertion: the question of what an assertion is governed by, whether truth, or belief, or knowledge, or something weaker such as justified belief. I do not want you to explain the debate to me; I know it well enough to see how badly it is usually taught. What I want is a teaching plan for the two sessions: the order in which the components have to be introduced and why each depends on the one before it, so that by the time the group hears a named norm proposed they already feel why anyone would posit a norm internal to the act at all rather than just observing that lying is wrong. Assume ninety minutes per session and a group that will interrupt.

  The part I keep getting wrong is the carrying example. My instinct is to build the whole arc on a single case — a witness who sincerely and justifiably states something that happens to be true but that she does not really know, on the model of a stopped clock that reads correctly twice a day — but I suspect that case only separates two of the candidate norms and quietly presupposes the rest, so I want you to tell me whether it can carry both sessions or what it would have to have and lack in order to do so, and if it cannot, what single case should replace it and why that one rather than the obvious alternatives. Alongside the example I want the map of misconceptions, with the point in the sequence at which each should be headed off. My guesses are these: that a norm of assertion is a moral or social rule about rudeness rather than a constitutive standard internal to the act; that to assert just means to say, so the standard concerns the truth of the sentence rather than the state of the speaker; that the knowledge norm must require certainty, which would make every hedged or probabilistic claim — the weather, the forecast, the lottery — an improper assertion and therefore show the norm to be absurd; and that if the knowledge norm is correct, a speaker who is simply and sincerely mistaken has done nothing at all wrong. I expect several more that I have not anticipated, and I would rather have them named and placed before the group raises them than discovered live.

  Give me one question to put to the group at the very end of the second session that would reveal whether they have grasped the shape of the problem rather than memorized four labels, and tell me plainly what I should refuse to cover at this level and announce that I am refusing — I am thinking especially of the contextualist literature and of the relationship between assertion and practical stakes, which I suspect is where the discussion would collapse into name-dropping. Finally, I want the plan to make room for one candidate I have not seen taught in this connection and would like to try: the idea that the norm is not about the speaker's epistemic state at all but about the hearer, that an assertion is an invitation to rely on what is said and that the operative standard is whether the speaker is entitled to extend that invitation. Build the sequence so this possibility arrives as a live option rather than a curiosity, and tell me at which point in the arc it can be introduced without muddying the four standard candidates.
reasoning: |-
  Okay, let me approach this systematically. The user is designing a two-session philosophy reading group for non-specialists on the norm of assertion, and they've identified several key challenges in their query. 

  First, I need to consider their core pedagogical concerns: they want a scaffolded sequence where concepts build logically, using a central example that can carry both sessions. The "stopped clock" witness case is their preferred vehicle but they suspect limitations. I should verify whether it can sustain the full arc or propose alternatives.

  The user anticipates specific misconceptions that must be preempted at precise moments:
  - Confusing constitutive norms with moral rules
  - Equating assertion with mere utterance
  - Misunderstanding knowledge as certainty
  - Overlooking the distinction between blamelessness and correctness

  I note their request to include an unconventional "hearer-centered norm" as a serious contender, not a footnote. This requires careful positioning - likely after standard candidates are established but before objections dominate.

  Session 1 should focus on establishing why we need any norm at all. The clock example works well here to introduce the gap between truth and justification. I'll structure it as:
  1. Contrasting assertion with guessing/opining
  2. Demonstrating truth isn't sufficient (clock is right accidentally)
  3. Showing belief isn't sufficient (clock believer lacks proper grounds)

  For Session 2, the clock example shows its limits when addressing knowledge norms versus justification. I'll supplement it with a lottery case to handle probabilistic claims, and a "misremembered birthday" scenario for blameless mistakes. The hearer-centered norm fits naturally when discussing why we make assertions - around the practical reliance aspect.

  The closing question must test synthetic understanding. "When, if ever, can someone be both perfectly reasonable and completely wrong in asserting?" forces integration of blamelessness versus correctness distinctions.

  Areas to explicitly exclude: contextualism and stakes-sensitivity. These would derail beginners into buzzword debates.

  Throughout, I'll flag where to preempt each anticipated misconception:
  - Early: distinguish "rude" from "constitutively defective"
  - When defining assertion: separate speech act from sentence truth
  - During knowledge norm: clarify probabilistic knowledge
  - In Q&A: address blameless but incorrect assertions

  The hearer-centered norm will emerge after examining problems with knowledge norms, framed as: "What licenses us to invite reliance?" This positions it as a solution to accumulated tensions rather than an oddity.
answer: |-
  Here’s a structured teaching plan for your two-session reading group, designed to build intuition sequentially, preempt misconceptions, and integrate your "hearer-centered norm" as a viable candidate. The **stopped-clock witness** case (Wendy) *can* anchor both sessions if expanded strategically, but needs supplementation to isolate key distinctions. I’ll outline the arc, then refine the example.

  ---

  ### **Session 1: Why a Norm at All? (90 mins)**  
  **Goal:** Establish that assertion is governed by a *constitutive standard* (not just morality/pragmatics).  
  **Core Case:** Wendy the stopped-clock witness.  
  *Setup:* Wendy glances at a clock that stopped 12 hours ago; it shows 2:00 PM. It *is* 2:00 PM. She asserts, "It’s 2 PM!"  

  | Segment                          | Key Questions/Activities                                                                 | Preempted Misconceptions                                                                 | Why Order Matters                                                                 |
  |----------------------------------|------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **1. What is assertion?** (15 min) | - Ask: "Is Wendy *asserting* or just guessing/opining?"<br>- Contrast with: "It might be 2 PM?" or "I feel it’s 2 PM." | **Misconception 1:** "Assertion = any declarative sentence."<br>→ *Clarify:* Assertion entails presenting as *true/factual*; it invites reliance. | Isolates assertion as a distinct speech act before introducing norms.             |
  | **2. Truth alone fails** (25 min) | - "Wendy’s claim is *true*. Is her assertion proper?"<br>- Discuss: Why might we feel uneasy?<br>- Introduce: Accidental truth ≠ proper assertion. | **Misconception 2:** "The norm is truth of the *sentence*."<br>→ *Clarify:* Norms govern the *act* by the speaker’s responsibility. | Shows truth is necessary but insufficient, forcing us toward speaker-internal standards. |
  | **3. Belief alone fails** (25 min) | - "Wendy *believes* it’s 2 PM. Is that enough?"<br>- Compare: Wendy asserts this in court vs. casual chat.<br>- Highlight: Belief can be irrational/accidental. | **Misconception 3:** "Norms are just about politeness/stakes."<br>→ *Clarify:* Constitutive norms make an act *what it is* (like rules of chess). | Separates social/moral rules ("lying is wrong") from internal standards defining assertion itself. |
  | **4. The Need for Justification** (20 min) | - "What if Wendy *reasonably* thinks the clock works? Does that fix it?"<br>- Note: She’s justified but still lacks knowledge. | **Preempt Contextualism:** *Explicitly exclude* "stakes" here: "We’re defining the core act; stakes matter later." | Sets up justification as a candidate while hinting it may not suffice. |
  | **Homework:** Reflect: "Could an assertion be ‘flawed’ even if useful/true? What makes it flawed?" |

  ---

  ### **Session 2: Candidate Norms & the Hearer-Centered Alternative (90 mins)**  
  **Goal:** Test norms (knowledge, justification) and introduce hearer-centered view as a solution.  
  **Supplemental Cases:** Lottery (probabilistic claims), Misremembered Birthday (blameless error).  

  | Segment                                  | Key Questions/Activities                                                                 | Preempted Misconceptions                                                                 | Why Order Matters                                                                 |
  |------------------------------------------|------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **1. Knowledge Norm Introduced** (20 min) | - "Wendy’s assertion is true, believed, justified—but does she *know* it?"<br>- Argue: Without knowledge, assertion is "lucky," not proper. | **Misconception 4:** "Knowledge = certainty."<br>→ *Clarify:* Knowledge allows probabilistic claims (e.g., "I know I’ll lose the lottery" with 99.99% odds). | Uses Wendy to show knowledge isn’t just "truth + belief."                         |
  | **2. Knowledge Norm Pressed** (25 min)   | - **Lottery Case:** "I know my ticket lost!" (pre-draw, 1-in-a-million odds). Is this proper?<br>- **Blameless Error:** Sam asserts "Beth’s birthday is tomorrow!" (saw wrong date; it’s today). Was Sam *wrong* to assert? | **Misconception 5:** "If knowledge norm holds, blameless mistakes are immoral."<br>→ *Clarify:* Constitutive flaw ≠ moral blame. Sam’s act is defective but he isn’t *culpable*. | Isolates "correctness" from "blameworthiness." Lottery case forces engagement with probabilistic knowledge. |
  | **3. Introducing Hearer-Centered Norm** (25 min) | - Reframe: "What does Wendy *invite* her listener to do?" (e.g., act on her claim).<br>- Ask: "Is Wendy *entitled* to invite reliance? What would entitle her?"<br>- Position as solution: It explains why Wendy’s assertion feels improper (she lacks authority) and why lottery assertions work (entitlement exists). | **Misconception 6:** "Norms must be about speaker’s mind."<br>→ *Clarify:* Assertions are social tools; their function (enabling reliance) may set the standard. | Builds on prior unease about "inviting reliance" (Session 1). Answers weaknesses in speaker-centric views. |
  | **4. Synthesis & Debate** (20 min)       | - Compare candidates: How does each judge Wendy/lottery/Sam?<br>- **Final Reveal Question:** "When, if ever, can someone be *both perfectly reasonable and completely wrong* in asserting something?" | **Preempt Name-Dropping:** *Exclude contextualism/stakes:* "These require tools we lack today; we’re mapping core norms." | Tests grasp of blamelessness/correctness distinction. Hearer-view shines here. |

  ---

  ### **Why Wendy’s Case Works (With Tweaks)**  
  - **Strengths:** Perfect for truth vs. justification/knowledge gaps; intuitive; non-technical.  
  - **Limitations:** Can’t handle probabilistic assertions (lottery) or blameless errors (Sam).  
  - **Fix:** Supplement with **lottery** (probabilities) and **Sam’s birthday error** (blamelessness). Wendy remains the backbone; new cases are contrast tools.  

  ---

  ### **Final Question & Rationale**  
  **"When can someone be both perfectly reasonable and completely wrong in asserting something?"**  
  - **Reveals:** If they grasp the core tension between *blamelessness* (reasonableness) and *correctness* (satisfying the norm). Sam’s birthday case is the litmus test:  
    - Knowledge/view: **Improper** (false, not known) but blameless.  
    - Justification/view: **Proper** (justified) but still false—problem!  
    - Hearer-view: **Improper** if no entitlement to invite reliance, but blameless.  

  ---

  ### **What to Explicitly Exclude**  
  Announce early: **"We won’t cover contextualism or practical stakes, as these require grappling with advanced semantics. Our goal is to understand why philosophers posit *any* norm—not to resolve every edge case."**  

  ---

  ### **Integrating the Hearer-Centered Norm**  
  - **Placement:** Mid-Session 2, after knowledge/justification norms show cracks (e.g., lottery/Sam cases).  
  - **Why there?** By then, the group sees that speaker-grounded norms struggle with blameless errors or probabilistic knowledge. The hearer-view emerges as a functional alternative: It asks *"When is reliance-invitation legitimate?"* rather than *"What’s in the speaker’s head?"*  
  - **Frame it as live option:** "Could the norm be about the *hearer*—about whether the speaker has the *authority* to promise something is true?"  

  This sequence forces the group to *feel* the need for a norm, isolates common pitfalls, and makes the hearer-centered proposal a natural contender—not a tangent. Wendy’s case, plus strategic supplements, keeps it grounded.
