  ### 1. Verdict Table
  For each event, the table shows whether A, B, and C judge it to be past, present, or future relative to O (at the moment they are at O).

  | Event | Coordinates   | A says  | B says | C says  |
  |-------|---------------|---------|--------|---------|
  | **P** | \((0, 0)\)    | Present | Present| Present |
  | **E** | \((0, 1)\)    | Present | Past   | Future  |
  | **R** | \((-0.6, 0)\) | Past    | Past   | Past    |

  - **E (Q)**: A (present), B (past), C (future).  
  - **Chain**: P-Q simultaneous in A's frame; Q-R simultaneous in B's frame; P-R never simultaneous.  

  ---

  ### 2. Assumptions: Physics vs. Metaphysics
  **Physics** (derived from special relativity):  
  - Lorentz transformations (used to compute \(t'\) for B and C).  
  - Relativity of simultaneity (different frames define "now" differently).  
  - Invariance of spacetime interval (used to check if P-R can be simultaneous).  
  - No FTL signalling (ensured as E and O are spacelike separated: \(\Delta s^2 = -1 < 0\)).  

  **Metaphysics** (philosophical commitments):  
  - **Present realism**: The "present" (events simultaneous with here-now) is ontologically privileged (e.g., real).  
  - **Non-relativity of reality**: "Is real" is absolute, not frame-relative. An event cannot be both real (e.g., present for A) and unreal (e.g., past/future for others) in an absolute sense.  
  - **Simultaneity-ontology link**: If two events are simultaneous, they share the same ontological status (both real or both unreal).  

  ---

  ### 3. Implications for Temporal Ontologies
  - **Presentism**: Only present events are real.  
    - **Problem**: At O, A says E is real (present), B says E is unreal (past), C says E is unreal (future). Contradiction: E cannot be both real and unreal absolutely. Presentism is embarrassed unless it abandons non-relativity of reality.  
  - **Growing-block theory**: Past and present events are real; future is unreal.  
    - **Problem**: At O, A and B agree E is real (A: present; B: past), but C says E is unreal (future). Contradiction: E is real for A/B but unreal for C. Embarrassed for the same reason.  
  - **Block universe**: All events (past, present, future) are equally real.  
    - **Resolution**: Disagreements are about *temporal relations*, not ontology. E is always real; observers merely describe it from different perspectives. Not embarrassed.  

  The case forces presentism and growing-block into contradiction if they insist on absolute reality. The block universe avoids this by rejecting a privileged present.  

  ---

  ### 4. Dissolving the Puzzle: Dropping an Assumption
  **Drop**: Non-relativity of reality (i.e., accept that "real" is frame-relative).  
  - **Cost**: Abandons objective becoming and absolute present. Reality becomes observer-dependent, violating common-sense metaphysics and requiring that existence is fragmented across frames (e.g., E is real for A at O but not for B). This is a major philosophical cost for theories prioritizing temporal passage.  

  ---

  ### 5. Preserving Objective Becoming: Privileged Frame Reply  
  **Reply**: Introduce a privileged frame (e.g., cosmic rest frame) defining the true "now". Only events simultaneous in this frame are real.  
  - **Cost**: Violates the principle of relativity (no experiment distinguishes the frame). In this case:  
    - A, B, and C are symmetric; no physics (e.g., dynamics, light signals) favors one frame.  
    - Privileging A (or any frame) is arbitrary and unverifiable, making it metaphysical rather than physical.  
    - Contradicts empirical SR, where all inertial frames are physically equivalent.  

  ---

  ### Key Feature Doing the Work  
  The relativity of simultaneity combined with absolute realism about the present generates the contradiction. If simultaneity were absolute (e.g., Newtonian physics), the problem vanishes. But SR's relativity of simultaneity is empirically verified (e.g., GPS corrections). Removing this feature dissolves the argument but requires rejecting SR. Thus, the argument forces a block universe if we uphold both SR and absolute realism about the present.  

  The case is validated: Coordinates yield the three verdicts for E via Lorentz transformations, and the non-transitive chain follows from spacetime geometry. No observer can detect the disagreement (spacelike separation prevents signalling), and the argument is frame-symmetric (each observer can run it identically by treating themselves as "A").
