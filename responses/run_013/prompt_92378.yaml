answer: |-
  Here’s your Q&A prep, tailored to the room’s sociology and ordered for tactical impact:

  ---

  ### 1. Read of the Room (180 words)
  **Criminal Law Theorists/Doctrinal Folks:** They’ll latch onto "expectation" and "repair" as functional analogs to *mens rea* and proportionality but bristle at "distributed practice" sounding unmoored from individual fault. They’ll ignore Strawsonian metaphysics but pounce if "relationship-maintenance" softens condemnation for serious crimes.  
  **Kantians:** Hyper-focused on "respect" and "accountability." They’ll hear "not desert-based" as eroding agent-focused duties and reducing blame to social utility. The judge’s skepticism will amplify their alarm.  
  **Psychologist:** Will probe whether your "calibration" matches lived blame phenomenology (e.g., "Doesn’t guilt *feel* like owning your *own* wrong?").  
  **Judge:** Wants policy takeaways. If you can’t translate "reform the practice" into sentencing guidelines or jury instructions, they’ll dismiss this as ivory-tower evasion.  
  **Nightmare Unspoken Fear:** They’ll assume this is covert hard compatibilism—that "determinism doesn’t touch the normative ledger" means we *should* blame even if causation is illusory.  

  ---

  ### 2. Objection Queue (Ordered by Damage Potential)

  #### **#1 Kantian: "You’ve destroyed accountability!"**  
  *Objection:* "If responsibility isn’t about what the agent *deserves*, how is this anything but group therapy? Where’s *respect* for the offender as a moral agent?"  
  *Why:* They equate desert with taking agency seriously. Your "practice" sounds like instrumentalizing blame.  
  *Reply:* "Respect is *built into* the practice: we hold each other to shared standards *because* we see each other as agents capable of understanding and responding to demands. To exempt someone isn’t kindness—it’s dismissal. But respect also means our practices must be *reasonable*—which is where reform kicks in. Strawson’s point is that the alternative isn’t 'pure' accountability; it’s *no moral community*."  
  *Soft:* Needs concrete example of "reasonable demand" vs. "unreasonable blame."  

  #### **#2 Legal Theorist: "This justifies scapegoating!"**  
  *Objection:* "If responsibility is about social repair, what stops us 'calibrating' blame onto vulnerable groups to satisfy collective outrage?"  
  *Why:* They hear "distributed practice" and think mob justice. Proportionality feels unanchored.  
  *Reply:* "The practice *includes* constraints like proportionality and excuses! We reform *by* insisting blame must track the agent’s capacity and context—otherwise it’s bad calibration. The two-ledger picture helps here: even if determinism erodes causal ultimacy (ledger 1), we still need ledger 2 to ask *which* norms best govern repair. Bad norms produce scapegoating; good ones prevent it."  
  *Soft:* Two-ledger risks feeling like hand-waving if not tied to legal mechanisms (e.g., insanity defenses).  

  #### **#3 Legal Theorist/Kantian Hybrid: "So punishment is just expensive therapy?"**  
  *Objection:* "If the point is 'relationship-maintenance,' why not replace prisons with mediation? Isn’t retribution essential?"  
  *Why:* They equate retributive *emotion* with moral seriousness. Repair sounds like conflict resolution, not justice.  
  *Reply:* "Some relationships *require* hard demands—think victims of violence. The practice includes resentment as a protest against violation. But we can ask: does *this* form of protest (e.g., mass incarceration) actually repair, or corrode? Reform targets *how* we express standing-holding, not whether we do it."  
  *Soft:* Downplays how deeply retribution is baked into legal practice.  

  #### **#4 Judge: "How does this change sentencing?"**  
  *Objection:* "Counselor, in Monday’s sentencing hearing, what would 'participant calibration' ask me to do differently?"  
  *Why:* Tests whether this is actionable or academic.  
  *Reply:* "It shifts the question from 'What does he *deserve*?' to 'What response best restores normative expectations *for this community*, given the harm?’ That might mean *less* carceral punishment for nonviolent offenses if restorative models better repair trust. But for violent crimes? It may demand *more* victim-centered accountability than plea bargains allow."  
  *Soft:* Vagueness. Have *one* concrete reform ready (e.g., "Prioritize victim impact statements over mandatory minimums").  

  #### **#5 Psychologist: "Blame doesn’t feel relational!"**  
  *Objection:* "When I resent, I’m not thinking 'community repair'—I feel *wronged by them*. Isn’t your theory revisionist?"  
  *Why:* They study raw blame emotion, not its structural role.  
  *Reply:* "Agreed! The phenomenology is personal. But the *justification* for treating that feeling as legitimate—not just anger—is its role in a network of reciprocal expectations. We *experience* blame individually; we *authorize* it socially."  
  *Soft:** Paper may overstate how conscious the "social role" is.  

  #### **#6 Kantian #2: "Hard Incompatibilists aren’t reformers!"**  
  *Objection:* "Pereboom isn’t asking to *tweak* blame; he says it’s *never* fair without libertarian free will. How’s that 'internal'?"  
  *Why:* They see incompatibilism as a veto, not a critique.  
  *Reply:* "His critique *uses* our shared norms: 'If you take determinism seriously, your own practice says you shouldn’t blame!' That’s an appeal to consistency *within* our responsibility concepts—not rejecting them wholesale. We can engage that argument without metaphysical agreement."  
  *Soft:** Hard incompatibilists may resist this "internal" reading.  

  #### **#7 Legal Theorist (Lower Damage): "What about psychopaths?"**  
  *Objection:* "If responsibility is standing in a practice, do psychopaths—incapable of guilt—'owe' repair? Or are they out?"  
  *Why:** Tests boundaries of membership.  
  *Reply:* "We might exclude them *if* they can’t grasp demands—but cautiously! Many 'incapable' agents understand rules instrumentally. The practice can demand institutional restraint (e.g., secure hospitals) without moral blame. Ledger 2 still applies: society owes them humane treatment."  
  *Soft:** Hand-wave on "grasping demands."  

  ---

  ### 3. Concessions to Make Early (Bullets)  
  - "Retributive emotions are *real* and often appropriate—I’m not dismissing them."  
  - "Individuals *are* proper targets of blame—this isn’t reducing responsibility to social labels."  
  - "The law *must* take desert-talk seriously—I’m reinterpreting it, not discarding it."  
  - "Yes, bad actors *owe* repair—this isn’t absolution."  

  ---

  ### 4. The Exchange That Has to Land (140 words)  
  **Kantian:** "Without desert, isn’t this just utilitarianism for blame?"  
  **You:** "Not at all. Utilitarianism *overrides* individual claims for the greater good. But here, the ‘good’ *is* respecting individuals as members bound by mutual obligations. When I blame you, I appeal to *your* capacity to recognize our shared norms. When I forgive, I affirm *your* standing to rejoin us. The practice *constitutes* our moral personhood—it doesn’t use us. Abolishing blame wouldn’t make us more ‘rational’; it would make us strangers. Reform ensures this constitution is fair, not that it’s efficient."  
  *Why it saves you:* Frames the practice as *deeply* agent-focused while dodging metaphysics.  

  ---

  ### 5. The Question You Hope Nobody Asks  
  **"If determinism is true, why *should* we maintain this practice? Isn’t 'owing repair' just another illusion?"**  
  *Why it’s deadly:* Collapses ledger 2 into ledger 1. Forces you to either defend normativity under determinism (derailing workshop) or admit quietism.  
  **Reply:** "The 'should' comes from *inside* the practice. We don’t ask 'Why have language?' if determinism is true—we use it to reason. Likewise, 'owing' is a normative logic we can’t escape while being moral agents. Determinism might make our practices *tragic*, but not *optional*."  

  ---

  ### 6. Last-Resort Lines  
  - "Blame isn’t about cosmic debts; it’s about mutual expectations among vulnerable beings."  
  - "Reform isn’t abandoning responsibility; it’s taking it seriously enough to fix broken tools."  
  - "The alternative to calibration isn’t 'true' justice—it’s no moral community at all."  
  - "The law already knows ledger 1 ≠ ledger 2: we acquit the insane, not the causally unfree."  

  ---

  **Tactical Notes:**  
  - **Two-ledger distinction:** Use sparingly. It’s clarifying for determinism but alienating for law folks. Substitute "causal story" vs. "normative position."  
  - **Judge/Kantian alliance:** Preempt by stressing "demands" and "accountability" early.  
  - **Psychologist:** Cite their work if possible ("As Dr. [Name]’s studies show, blame *does* function to enforce norms...").  
  - **Opening Gambit:** Start with a *legal* example (e.g., "Why do we excuse duress? Not because causation vanished—but because demands were unreasonable").  

  Good luck—this is a tough but winnable crowd. Anchor reform in *strengthening* accountability, not weakening it.
