  For point 4 (dynastic wealth): This translates perfectly to compounding stochastic processes with drift and volatility terms. The self-reinforcing nature is captured through path dependence.

  For point 5 (residue report): I'll summarize the gaps - specifically how normative claims about justice and fairness don't map to actuarial vocabulary, which reveals that the original claims rely on moral premises rather than being unclear.

