answer: |-
  1.  The libertarian position translates as maximising the net present value of parental lifetime utility, including the discounted utility from a bequest, where taxing it introduces a deadweight loss by distorting intertemporal saving decisions; however, the claim that this tax inherently "wrongs someone" is a normative assertion with no direct counterpart in your positive framework of risk and return, revealing the original relies on unstated moral axioms about property rights.
  2.  The Rawlsian equal opportunity demand requires that the covariance between parental endowment (initial wealth) and offspring lifetime outcome (discounted utility or wealth) be zero; the underlying moral claim *needs* statistical independence for genuine fairness, but your actuarial idiom can only model the covariance, exposing that the moral ideal demands stronger conditions than mere mean uncorrelation.
  3.  The public finance perspective centres on finding the inheritance tax rate that minimises the deadweight loss (distortion to saving and capital accumulation behaviour) relative to the present value of tax revenue raised and any social welfare gain from reduced outcome dispersion, framed as an optimisation problem with elasticities.
  4.  The dynastic wealth critique maps directly to a compounding stochastic process where initial endowment (parental wealth) acts as the starting value, generating persistent inequality through drift (expected return exceeding the discount rate) and path dependence, making outcomes highly sensitive to initial conditions over multiple generations.
  5.  The core normative concepts of "justice" in holdings, "wronging someone" by taxation, or the intrinsic moral requirement for "fair equality" carry over only with severe distortion if forced into expected utility or covariance; they have no true counterpart in your idiom, not due to vagueness in the original claims, but because your framework inherently excludes non-welfarist moral evaluation, highlighting its limitation for capturing deontological arguments.
