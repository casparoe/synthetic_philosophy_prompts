prompt: |-
  I'm TAing a metaphysics course and we've just finished the statue-and-the-clay week, and the whole literature is driving me a bit up the wall — everyone seems to just assert the thing they need for their own solution and then wave at somebody else's counterexample. Before I read any more of it I want the spec on paper. So: write me the desiderata for a theory of material constitution. What does any adequate account of what it is for a lump of clay and the statue made out of it to be the things they are have to deliver? I don't want a survey of positions, I want the checklist — the cases it has to get right, the distinctions it can't collapse, the results from elsewhere it can't contradict (the bronze is just bronze through and through, nothing extra shows up in the chemistry), and the questions it has to at least answer: how many things are sitting on the pedestal, whether the statue and the lump are identical, what makes the difference between them if they aren't, what happens when you squash one and not the other. For every requirement give me the case or consideration behind it in a line or two, because I want to be able to see which of these are genuine constraints and which are just somebody's pet intuition dressed up as a datum.

  Two cases I keep running into that I want the list to cover, since they don't come up much in what we've read. First, a bronze horse in a museum where the conservator has the tail cut off and a new tail cast from fresh bronze and attached — same form, same place on the plinth, but part of the matter isn't the original matter; is that the same statue, and is it the same lump? Second, the same lump of clay shaped into exactly the same shape twice, once by a sculptor who means it as a statue and once by a toddler who's just squashing it about for fun — do we have a statue both times, one time, or is the question malformed? And the usual ones need to be in there too (the clay that survives squashing while the statue can't, the ship rebuilt plank by plank with the old planks reassembled elsewhere, the cat that loses its tail).

  Then, since the point of a spec is to see what fails it: tell me which requirements are non-negotiable and which are negotiable, flag any pair you think can't be jointly satisfied — I have a suspiscion that the demand for constitution facts to be fully grounded in the physical facts is going to fight with the demand that the statue and the lump differ in their modal properties, but tell me if that's wrong — and say which single requirement does the most work in ruling out candidates. If it's cheap, a line or two each on how the usual four fare against the list (constitution as distinct-but-coincident objects, four-dimensionalism, mereological nihilism, and the eliminativist line that says there simply are no statues), but keep the weight on the list itself, that's what I actually want.
reasoning: |-
  Okay, the user is a TA for a metaphysics course, specifically dealing with material constitution after covering the statue-and-the-clay problem. They're frustrated because the literature seems to involve circular arguments where each theorist asserts what they need for their solution without clear criteria. What they really want is a specification sheet—a list of desiderata that any adequate theory of material constitution must satisfy. 

  Let me unpack their request. First, they want the checklist to cover standard cases like the lump surviving squashing while the statue doesn't (modal differences), the Ship of Theseus (persistence through part replacement), and the cat losing its tail (alteration vs. destruction). But they also mention two less common cases: the bronze horse with a replaced tail (partial matter replacement) and the toddler vs. sculptor scenario (intentionality in artifact creation). 

  Hmm, the user is clearly annoyed by the lack of methodological rigor in the literature. They're seeking a way to evaluate theories objectively. Their deeper need seems to be pedagogical—they want tools to help students critically assess positions rather than get lost in partisan debates. The demand for "specs" suggests they value engineering-style clarity over philosophical hand-waving.

  For the desiderata list, I should start with non-negotiable constraints like physical grounding (no spooky statue-stuff) and numerical distinctness (lump≠statue in the same place). Then move to negotiable but important ones like artifact creation requiring intention. The bronze horse case will test theories on partial replacement, while the toddler scenario probes whether form alone suffices for statuehood. 

  Ah, and they explicitly want conflicts flagged—like how modal differences might clash with physicalism if properties aren't grounded. I suspect that tension is central. The "how many things" question feels like a litmus test too; nihilists say one (just particles), constitution theorists say two, etc. 

  For theory evaluation: Constitutionism handles distinctness well but struggles with grounding modal properties. Nihilism avoids all problems by denying statues exist but violates practical discourse. Perdurantism (4D) handles change but makes persistence too cheap. Eliminativism is simple but counterintuitive. 

  Biggest trade-off: grounding vs. modal profiles. If statue and lump share all physical properties, how can one survive squashing and not the other? That’s where most theories crack. The user’s suspicion is spot-on—this is the core fracture line. 

  Will structure the list as bullet points with: 1) Desideratum 2) Case motivating it 3) Negotiability. Then flag key conflicts and rank theories against the specs. The bronze horse and toddler cases get dedicated entries since they're underdiscussed in standard lit. Must emphasize that physical grounding (#1) and distinctness (#2) are bedrock—everything else negotiates around them.
answer: |-
  Here's the specification for a material constitution theory, designed as a checklist of desiderata derived from core puzzles and constraints. Each requirement includes the motivating case(s) and its negotiability status.

  ---

  ### **The Desiderata Checklist**

  1.  **Physical Grounding:**
      *   **What:** Constitution facts must be fully grounded in physical facts (arrangement, properties, history of matter). No "extra" non-physical stuff or primitive "statue-ness" properties.
      *   **Case:** Chemical analysis of the bronze statue reveals only bronze atoms/chemical properties, nothing statue-specific. The lump's existence doesn't require novel physics.
      *   **Negotiability:** **Non-negotiable.** Violation contradicts fundamental physicalism and makes constitution inexplicable.

  2.  **Numerical Distinctness (Co-location):**
      *   **What:** Must account for the intuition that the statue and the lump are distinct objects occupying the same space at the same time (or deny this coherently).
      *   **Case:** "How many things are on the pedestal?" Seems like two (statue + lump), not one (just the lump/statue) or infinitely many (particles).
      *   **Negotiability:** **Non-negotiable.** This is the core phenomenon any theory *must* address or explain away. Denying it entirely leads to significant revisionism (see Eliminativism).

  3.  **Modal Difference (Survival Conditions):**
      *   **What:** Must account for differing modal properties, primarily persistence conditions. The statue cannot survive being flattened, the lump can. The lump *could* have been shaped differently, the statue *could not*.
      *   **Case:** Squashing the statue destroys the statue but leaves the lump. The lump existed before the statue was formed.
      *   **Negotiability:** **Highly Constraining.** While *some* theories might explain this away (e.g., temporal parts), denying the core difference drastically weakens the theory. Your suspicion is correct – grounding this difference without violating #1 is the *major fracture point*.

  4.  **Artifact Creation/Destruction:**
      *   **What:** Must explain how artifacts (like statues) come into and go out of existence through changes in arrangement, intention, or function, without corresponding creation/destruction of the matter itself.
      *   **Case:** Sculpting the lump creates a statue; squashing it destroys the statue. The lump persists through both.
      *   **Negotiability:** **Negotiable in Mechanism.** The *fact* of creation/destruction is central; *how* it's explained (intention, form, function) is the battleground. Theories must take a stance.

  5.  **Part Replacement (Gradual Change):**
      *   **What:** Must handle cases where an object persists despite replacement of some (or eventually all) of its original matter.
      *   **Case:** Ship of Theseus (planks replaced one-by-one). Amputated cat (loses tail, persists). **Bronze Horse:** Tail replaced with new bronze. Is it the same statue? Same lump? (Lump clearly changes).
      *   **Negotiability:** **Negotiable.** Theories offer various persistence criteria (spatiotemporal continuity, form, causal connection, functional role). The horse case tests theories on *partial matter replacement for artifacts*.

  6.  **Composition & Boundaries:**
      *   **What:** Must provide principled criteria for when composition occurs (when parts constitute a whole object). Must distinguish genuine objects from arbitrary mereological sums.
      *   **Case:** Why is the statue a single object, but the sum of the statue's left half + my coffee cup is not? **Toddler Case:** Identical physical form created by toddler smashing vs. sculptor intending. Is a statue present in both, one, or neither? (Directly tests criteria for composition/objecthood).
      *   **Negotiability:** **Negotiable but Critical.** This is where theories diverge most sharply (intention, form, function, universalism, nihilism). The toddler case is a key test for the role of *intention* vs. *form alone*.

  7.  **Temporal Identity:**
      *   **What:** Must account for the persistence of objects (both matter and artifacts) over time through change.
      *   **Case:** The lump exists before sculpting; the statue exists after. Both persist (in some sense) until squashing. Ship of Theseus over decades.
      *   **Negotiability:** **Non-negotiable.** Any theory *must* have a coherent account of persistence. The core debate is between endurance (wholly present) and perdurance (temporal parts).

  8.  **Causal/Explanatory Relevance:**
      *   **What:** The theory shouldn't make constituted objects causally inert or explanatorily redundant. Statues seem to cause perceptions and explain actions (e.g., why the museum guard protects *it*).
      *   **Case:** We explain the guard's behavior by citing "the statue," not just "the lump" or "the atoms."
      *   **Negotiability:** **Negotiable.** Some theories (e.g., eliminativism) bite the bullet here. Others strive to show how constituted objects have genuine causal powers or explanatory roles.

  ---

  ### **Key Conflicts & Trade-offs**

  1.  **#1 (Physical Grounding) vs. #3 (Modal Difference):** This is the **core conflict**. How can identical physical matter at T ground two objects with different *non*-manifest properties (what *could* happen to them)? Solutions involve either:
      *   *Denying distinctness* (risking #2).
      *   *Denying modal differences are real properties of the objects* (reinterpreting modal talk, e.g., temporal parts).
      *   *Finding physical differences* (e.g., relational historical properties, which some argue violate the spirit of #1).
      *   *Accepting brute modal differences* (violating #1).

  2.  **#2 (Distinctness) vs. Parsimony:** Positing two coincident objects can seem ontologically profligate. Eliminativism/Nihilism avoid this but violate #2, #4, #8 robustly.

  3.  **#6 (Composition Criteria) vs. Vagueness/Universalism:** Strict criteria (e.g., requiring intention) make objecthood precise but exclude cases like natural objects or the toddler's "statue." Liberal criteria (e.g., any arrangement is an object) satisfy #6 easily but struggle with #6's demand to *distinguish* genuine objects from arbitrary sums, collapsing the distinction.

  **The Requirement Doing the Most Work:** **#3 (Modal Difference)**. It's the primary driver for denying the identity of the statue and lump (#2). Resolving the tension between #1 and #3 is what forces the major ontological choices. If modal differences were illusory or eliminable, theories could be much simpler (e.g., identifying statue and lump).

  ---

  ### **How Major Theories Fare *Against the List* (Briefly)**

  1.  **Constitution Theory (Distinct Coincidents):**
      *   **Strengths:** Easily satisfies #2, #3, #4, #5, #8.
      *   **Weaknesses:** Struggles ***severely*** with **#1** (grounding modal differences). #6 relies heavily on intention/function. Can seem ontologically messy.

  2.  **Perdurantism (4Dism):**
      *   **Strengths:** Handles #3, #4, #5, #7 well via temporal parts. Grounds differences (#1) in different temporal extents/relations.
      *   **Weaknesses:** Can struggle with #2 (is a temporal part *now* the statue or just part of it? How many *things* are *now*?). #6 often defaults to unrestricted composition (anything is a spacetime worm) or adds criteria, risking vagueness. The "object" present at a time is just a temporal slice.

  3.  **Mereological Nihilism:**
      *   **Strengths:** Trivially satisfies #1, #2 (only simples exist, no co-location). Very parsimonious.
      *   **Weaknesses:** **Fails catastrophically** at #4, #5, #6, #8. Denies statues, lumps, ships, cats exist at all. Requires massive revision of ordinary thought and language.

  4.  **Eliminativism about Artifacts (Only the Lump Exists):**
      *   **Strengths:** Satisfies #1, #2 (only one thing), #7. More parsimonious than Constitution.
      *   **Weaknesses:** **Fails** #4 (denies statue creation/destruction), #5 (denies artifact persistence through part replacement), #8 (statues aren't causal/explanatory). Struggles with #3 (must explain away modal talk about statues as really about lumps-under-descriptions, which often seems strained, especially for #5 cases like the Ship).

  ---

  **Spec Summary:** An adequate theory *must* respect Physical Grounding (#1), Numerical Distinctness (or explain it away convincingly) (#2), and Temporal Identity/Persistence (#7). The hardest nut to crack is reconciling the undeniable *appearance* of Modal Difference (#3) with #1. How it handles Part Replacement (#5 - especially the Bronze Horse) and Composition Criteria (#6 - especially the Toddler Case) are key differentiators revealing its underlying commitments to history, intention, form, or function. The theory that best resolves the #1/#3 conflict while respecting as many other desiderata as possible (especially #4 and #8) will be the strongest contender, though likely still imperfect.
