prompt: |-
  I direct a small formal-epistemology group — myself and one postdoc, three years of funded time — and we have to commit to a research programme on uncertain evidence. The probabilistic-programming group down the corridor keeps asking which of our open problems they should be tracking, and I would rather answer that with an argument than with a shrug. So I want an agenda, not a survey: rank the open questions in the theory of uncertain evidence by how much depends on them, and defend the ranking with the criteria made explicit — which questions are upstream of which, which are tractable with the tools already on the table, which would change what people outside philosophy do if they were settled, and which look central but would turn out to be idle once settled.

  Here, in no particular order, are the candidates I have been circling.

  1. Order-dependence. Shift your probabilities on one partition, then on another, and you can land somewhere different from where you would have landed had you taken them in the other order. Is that a defect in the rule, a defect in the way I have posed the question, or a fact about uncertain evidence that ought simply to be accepted?

  2. Rigidity. What fixes the partition whose probabilities the rule holds fixed? Nothing internal to the rule appears to, and different choices give different posteriors.

  3. A colleague's proposal: take all the constraints the evidence imposes, and select, from among the distributions satisfying them, the one closest to your prior in Kullback–Leibler divergence. This is order-independent by construction. Is it also correct, or does it purchase invariance at a price we should refuse to pay?

  4. Reduction. Can every such shift be rewritten as ordinary conditionalization on a proposition about one's own evidence — a proposition to the effect that the evidence is thus and so — and if so, is the rule a convenience rather than a necessity, or does the rewriting smuggle in a certainty about the evidence that we do not have?

  5. Foundations. Is there a betting or accuracy argument that singles out one rule, or does the family of admissible updating rules remain underdetermined by any such argument?

  6. Representation. Should uncertain evidence be modelled as a shift within a single distribution at all, or rather as a constraint on a set of them?

  What I want back is a defended ordering, with reasons for the top two or three, a sentence each on why the ones I have ranked low are low, and — most useful to me — the conditions under which the ranking would change: which result in the next year or two would show that I have mis-ranked the list. Assume I know the standard material and do not need to be told what the rule is. Skip the reading list; I want the reasoning.
reasoning: |-
  Okay, let's tackle this problem. The user directs a small formal epistemology group and needs to prioritize open questions on uncertain evidence for their research program. They’ve listed six key issues and want them ranked based on impact, tractability, and external relevance. 

  First, I need to understand the user's context. They're under pressure to justify their research direction to the probabilistic programming group down the hall. So the ranking must demonstrate practical and foundational significance. The user values clear criteria: upstream influence, tractability, external impact, and risk of being idle once solved. 

  Looking at the questions:
  - **Foundations (5)** seems paramount. Without a normative basis (e.g., via betting arguments), all other debates lack grounding. If no unique rule is justified, the field fragments. If one is proven, it resolves downstream issues. This is highly upstream but tractable with existing tools like accuracy arguments. A breakthrough here could reshape how applied fields handle updating under uncertainty. 

  - **Reduction (4)** is next. If uncertain evidence can always be reduced to conditionalization on evidence propositions, it challenges the need for specialized rules. This directly impacts probabilistic programming—why implement Jeffrey if Bayes suffices? But if reduction smuggles in false certainty, it validates Jeffrey-style approaches. The KL divergence proposal (3) depends on this: if reduction works, KL becomes an alternative rather than a necessity. 

  - **Rigidity (2)** feels urgent for practitioners. Partition choice is arbitrary in current frameworks, causing inconsistent posteriors. Solving this would make Jeffrey's rule usable in programming contexts. It’s technically tricky but has direct applications. A counterexample showing unavoidable arbitrariness would lower its rank. 

  - **Order-dependence (1)** is a known quirk. If Foundations/Rigidity are solved, this becomes a special case (e.g., rigidity failures cause order effects). It’s less pressing unless proven irreducible. 

  - **KL divergence (3)** is elegant but secondary. If Reduction holds, KL is just one flavor of generalized conditioning. If Foundations underdetermine rules, KL enters the menu but isn’t uniquely central. 

  - **Representation (6)** is a paradigm shift. Moving to imprecise probabilities would upheave the entire framework. But it’s less urgent—applied fields still default to single distributions. A proof that single-distribution approaches *must* fail could elevate this. 

  **Top risks to the ranking**: 
  - If Foundations get settled (pro/con uniqueness), it reshuffles everything. 
  - If Reduction succeeds, KL divergence (3) and order-dependence (1) lose urgency. 
  - A rigidity counterexample from programming (e.g., irreparable partition dependence) would boost its priority. 

  The user’s unspoken need: credibility with adjacent fields. Thus, questions with "engineering" implications (Reduction, Rigidity) rank higher than abstract ones (Order-dependence, Representation). The agenda must show formal epistemology isn’t navel-gazing—it solves concrete updating problems.
answer: |-
  Here is a defensible ranking of your open questions, ordered by their centrality to resolving the core challenges of uncertain evidence and their potential downstream impact. The ranking is justified by four criteria: **Upstream Influence** (how many other problems depend on it), **Tractability** (feasibility with current tools), **External Impact** (relevance beyond philosophy), and **Idleness Risk** (whether settling it might prove inconsequential).

  ### Ranked Agenda:
  1.  **Foundations (5)**  
      **Ranking Justification:**  
      *Most upstream and pivotal.* Without a normative foundation (e.g., via Dutch books or accuracy dominance), *all* proposed rules (including Jeffrey conditionalization, KL-minimization, etc.) lack justification. A uniqueness proof would collapse debates about alternatives (e.g., Q3); a non-uniqueness result would force pluralism or motivate new paradigms (e.g., Q6). **Tractable** using existing decision/accuracy frameworks. **External impact** is high: probabilistic programming needs principled updating rules; a settled foundation would dictate best practices. **Idleness risk is low**: any outcome reshapes the field.  
      **Top because:** It anchors the entire enterprise. Without it, we’re optimizing in the dark.  

  2.  **Reduction (4)**  
      **Ranking Justification:**  
      *Directly tests the necessity of generalized conditioning.* If reduction to propositional evidence succeeds, it undermines the need for specialized rules (Q1–Q3, Q5), reframing them as modeling choices. If it fails, it validates Jeffrey-style approaches as irreducible. **Tractable** via formal counterexamples or representation theorems. **External impact** is critical: probabilistic programming relies on Bayesian conditioning; reduction would simplify implementations, while failure would necessitate new tools. **Idleness risk**: Moderate – success could marginalize other questions, but failure would deepen their significance.  
      **Second because:** It challenges the raison d’être of uncertain-evidence frameworks.  

  3.  **Rigidity (2)**  
      **Ranking Justification:**  
      *The most urgent practical flaw in Jeffrey conditionalization.* Solving rigidity (e.g., by finding partition-selection principles or proving inevitability) is essential for applications. **Upstream** for Q1 (order-dependence often stems from rigidity failures) and Q3 (KL avoids rigidity but needs justification). **Tractable** with game-theoretic or information-theoretic tools. **External impact** is immediate: probabilistic programming struggles with partition sensitivity. **Idleness risk**: Low – resolving it would constrain or validate real-world updating.  
      **Third because:** It addresses a make-or-break obstacle for current rules.  

  ---  
  ### Lower-Priority Questions (Briefly Justified):  
  4.  **KL-Divergence (3)**  
      *Why low?* Depends on Q5 (foundations) for justification and Q4 (reduction) for necessity. If reduction fails and foundations underdetermine rules, it becomes a contender – but until then, it’s a technically elegant *alternative* rather than a core problem. Idleness risk: high if reduction succeeds or foundations reject it.  
  5.  **Order-Dependence (1)**  
      *Why low?* Largely derivative: order-dependence is often a symptom of rigidity (Q2) or foundationally acceptable (if norms permit path-dependence). Settling Q2/Q5 could resolve or contextualize it. Low external impact: programmers can enforce order conventions.  
  6.  **Representation (6)**  
      *Why lowest?* A paradigm shift, but currently speculative. If Q4–Q5 fail spectacularly (e.g., no unique rule, reduction impossible), this gains urgency. Until then, it’s a "nuclear option" with high barriers to adoption. Low tractability: imprecise probability lacks consensus tools.  

  ---  
  ### Conditions That Would Invalidate This Ranking:  
  Your agenda should pivot if new results emerge in the next 1–2 years. Watch for:  
  - **Foundations (Q5) settled**: A proof that *no* rule satisfies accuracy/dutch book would elevate Q6 (representation) and doom Q1–Q4. A *unique* rule proof would collapse Q1–Q3 into engineering problems.  
  - **Reduction (Q4) success**: A general representation theorem for evidence propositions would make Q1–Q3, Q5 largely obsolete (and lower Q3). Failure would elevate Q2–Q3.  
  - **Rigidity (Q2) counterexample**: A proof that *no* partition-selection principle works without ad hoc constraints would boost Q3 (KL) or Q6 (representation), and sink standard Jeffrey-based approaches.  
  - **External shocks**: If probabilistic programming adopts KL-minimization (Q3) as a standard (despite philosophical concerns), prioritize Q3 to critique/justify it.  

  ### Strategic Recommendation:  
  Focus on **Foundations (Q5)** and **Reduction (Q4)** first. They are the leverage points: settling either will reconfigure the landscape, forcing downstream issues (Q1–Q3) to resolve or dissolve. Rigidity (Q2) is the best "applied" target if you need quick wins for interdisciplinary credibility. Allocate minimal effort to Q1, Q3, Q6 unless breakthroughs elsewhere force your hand.
