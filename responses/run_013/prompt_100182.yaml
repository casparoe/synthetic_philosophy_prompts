answer: |-
  ### Bottom line  
  The impasse is fundamentally about what Bayesian confirmation theory should accomplish, not a resolvable mathematical gap. Your friends prioritize different goals: the Bayesian focuses on idealized coherence for an agent's beliefs, while the historian demands a descriptive account of scientific practice. This drives their split over fixes—counterfactual credences preserve internal consistency but feel artificial for real science; dismissing the problem protects formalism but ignores history. Your suspicion about new theories is correct: extending probability spaces to handle unknown hypotheses is the core challenge, making "old evidence" and "new theories" two facets of one problem.  

  ### The Shape of the Dispute  
  *(~150 words)*  
  The **Bayesian statistician** sees confirmation as a relation defined *within* an agent’s credence function at a given time. For them, conditionalization is correct: if evidence \(e\) (Mercury’s precession) is already known (\(P(e) = 1\)), it cannot confirm hypothesis \(h\) (GR) because \(P(h|e) = P(h)\). They defend Garber-style counterfactuals ("what if you hadn’t known \(e\)?") as the only coherent repair, preserving rationality constraints. The **historian of science** views confirmation as an objective epistemic lift, evident in scientific communities’ reactions. For them, the Mercury case *obviously* supports GR, exposing Bayesianism’s failure to capture historical inference. They see the "no problem" stance as evasion and counterfactuals as ungrounded rationalization. You characterize their positions fairly—no missteps.  

  ### Diagnosis  
  *(~500 words)*  
  Your hypothesis is correct: the dispute centers on **divergent aims for Bayesianism**, not mathematical insufficiency.  

  1.  **Clash of Objectives**: The Bayesian prioritizes a *normative standard for individual rationality*. Their formalism demands that credence updates adhere to coherence (avoiding Dutch books, etc.). Here, conditionalization is unimpeachable: if \(e\) is certain, learning it *formally* changes nothing. Counterfactuals rescue formalism by shifting temporal perspective but still serve idealized agency. The historian cares about *reconstructing actual scientific justification*, where communal knowledge evolves non-monotonically. That scientists treat Mercury’s data as newly relevant under GR is an empirical fact demanding explanation. For them, Bayesianism fails as a descriptive framework if it cannot capture this.  

  2.  **Relativized vs. Objective Confirmation**: This follows from the above. The Bayesian sees confirmation as relative to an agent’s epistemic state—a *subjective* relation. If \(e\) is in your background knowledge, it cannot confirm \(h\) *for you*. The historian (implicitly) treats confirmation as *objective*: \(e\) objectively supports \(h\) given total scientific knowledge, regardless of when \(h\) was formulated. Bayesian credences ought to track this but currently don’t.  

  3.  **Your Loose Suspicion (New Theories ↔ Old Evidence)**: This is astute and underappreciated. Garber-style counterfactuals require assessing \(P(e|h)\) at a time before \(h\) was conceived. But if \(h\) didn’t exist in the agent’s hypothesis space, \(P(e|h)\) is undefined. Defining it necessitates rules for assigning probabilities to novel propositions (e.g., via "theoretical entailment" or logical learning). **This *is* the problem of new theories.** Any "solution" to old evidence relying on pre-\(h\) credences thus covertly assumes a solution to new theories—they are inseparable.  

  The core disagreement is **philosophical**: Is Bayesianism primarily a theory of *rational consistency for idealized agents* (Bayesian) or a *model of real-world scientific inference* (historian)? The former will tolerate counterfactual idealizations; the latter will reject them as irrelevant to history. No theorem bridges this gap because each side values different success criteria.  

  ### What Would Count as Progress  
  *(~200 words)*  
  Progress requires **explicitly separating the two projects** and addressing each on its own terms:  

  1.  For the **normative project**: Develop a rigorous account of how agents *should* update on logical/mathematical learning (e.g., "discovering" that GR entails Mercury’s precession). This might involve "constraint-based" updates (adjusting credences to satisfy \(P(e|h) = 1\)) rather than conditionalization. Success: a consensus formalization that handles logical learning without counterfactuals.  
  2.  For the **descriptive project**: Formalize how scientific communities *recontextualize* old evidence under new theories. This might involve modeling shifts in "salience" or "explanatory role" within a Bayesian-like framework that isn’t shackled to individual credence functions. Success: a model predicting when old data becomes newly confirmatory in history.  
  3.  **Reframe the question**: Stop asking "How can old evidence confirm?" and ask "What epistemic relation does the Mercury-GR case exemplify?" This might reveal it’s *explanatory fit*, not incremental confirmation, that matters—pointing beyond Bayesianism.  

  Admitting the new/old theory link is essential: any solution must jointly address extending probability spaces and logical learning.  

  ### What Would Not Count as Progress  
  *(~75 words)*  
  Rehashing the three standard moves (counterfactuals, "no problem," logical omniscience) without engaging the underlying aims. Defending Garber by stipulating \(P(e|h)\) for unknown \(h\) ignores the new-theory problem. Insisting scientists are "irrational" for valuing old evidence dismisses the descriptive challenge. Treating it as merely verbal ("just define confirmation differently") ignores the substantive disagreement about Bayesianism’s purpose. Progress isn’t one side conceding; it’s clarifying what each project can and cannot explain.
