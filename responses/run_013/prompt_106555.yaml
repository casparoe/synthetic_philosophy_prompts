  The user also asks whose pleasure is maximized. Jevons’s framework implies it’s each person maximizing their own, through voluntary exchange. The "greatest amount" isn’t social—it’s decentralized. His use of "problem of Economics" is singular, but the solution is pluralistic. 

  I should emphasize how Jevons’s shift from grand claims to operational definitions resolves the contradiction. The opening is motivational rhetoric; the subsequent theory is rigorously subjectivist. The user might need this distinction clarified—that the "calculus" metaphor is about formal optimization (ratios, derivatives), not summing utils across people. 

  Also, noting where Jevons explicitly rejects interpersonal comparisons (e.g., his footnote) would strengthen the case. His utility is ordinal, not cardinal, which makes aggregation impossible. The user’s confusion is common among modern readers expecting neoclassical rigor upfront, but Jevons is transitional—he uses utilitarian language while building a proto-neoclassical framework. 

