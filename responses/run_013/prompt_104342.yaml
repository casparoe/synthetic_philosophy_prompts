  ### Case 1: Hiring Decisions (Pooled Table is Correct)  
  **Story**: A tech company evaluates applicants from two universities: A (elite) and B (non-elite). University A produces more highly skilled graduates (80% highly skilled) than B (50% highly skilled). Applicants *self-select* which job level (Senior/Junior) to apply for: A's graduates are overconfident, so even low-skill A applicants apply for Senior roles. B's graduates are underconfident, so only high-skill B applicants apply for Senior roles. Hiring depends *only* on skill: Senior roles hire only highly skilled applicants; Junior roles hire 50% of highly skilled and 25% of low-skill applicants.  

  **Data** (1,000 applicants per university):  
  |          | Senior Applicants | Senior Hired | Junior Applicants | Junior Hired |  
  |----------|-------------------|--------------|-------------------|--------------|  
  | Univ A   | 952              | 792          | 48               | 14           |  
  | Univ B   | 55               | 50           | 945              | 349          |  

  **Pooled Table**:  
  - Univ A: 806 hired / 1,000 = 80.6% hiring rate.  
  - Univ B: 399 hired / 1,000 = 39.9% hiring rate.  
  → *A beats B in the pooled table*.  

  **Stratified Tables**:  
  - **Senior roles**:  
    - A: 792 / 952 ≈ 83.2%  
    - B: 50 / 55 ≈ 90.9% → *B beats A*.  
  - **Junior roles**:  
    - A: 14 / 48 ≈ 29.2%  
    - B: 349 / 945 ≈ 36.9% → *B beats A*.  
  → *B beats A in every stratum*.  

  **Which to trust? Pooled table**.  
  **Why?**  
  - Job level (Z) is a *collider*: It is caused by both university (A/B) and skill (the true driver of hiring). Conditioning on Z (stratifying) creates a false association between university and skill within each stratum.  
  - In Senior roles, B’s applicants are a highly skilled subset, while A’s include many low-skill applicants. In Junior roles, A’s applicants are mostly low-skill, while B’s are mixed. This makes B *appear* better in each stratum, but it’s artifactual.  
  - University assignment is **not random**; A produces more skilled applicants. The pooled table captures the true causal effect: A’s graduates are more skilled and thus hired more often.  

  **Key feature**: Z is a collider (common effect of treatment and the lurking variable "skill"). If you remove university’s effect on Z (e.g., applicants randomly assigned job levels), the reversal vanishes. If Z is swapped to a confounder (Case 2), the reversal flips.  

  **Pushback from a smart student**:  
  *"Trust the strata! If job levels are distinct hiring processes, shouldn’t we adjust for them?"*  
  → Assumes Z is a confounder (common cause) or that skill is balanced within strata. But here, skill imbalance is *induced* by conditioning on Z. Reject the assumption that Z is pre-treatment.  

  ---  

  ### Case 2: Medical Treatment (Stratified Tables are Correct)  
  **Story**: Doctors treat a disease with two therapies: A (standard) and B (new). Disease severity (Mild/Severe) affects both treatment choice and recovery. Doctors prefer B for Severe cases (it’s more effective) but A for Mild cases (conservative). Severity is the true driver: Mild cases recover more often. Treatment B is actually better for *both* severities.  

  **Data** (1,000 mild and 1,000 severe patients):  
  |          | Mild Patients | Mild Recovered | Severe Patients | Severe Recovered |  
  |----------|---------------|----------------|-----------------|------------------|  
  | Treat A  | 900           | 720            | 100             | 30               |  
  | Treat B  | 100           | 90             | 900             | 360              |  

  **Pooled Table**:  
  - Treatment A: 750 recovered / 1,000 = 75% recovery rate.  
  - Treatment B: 450 recovered / 1,000 = 45% recovery rate.  
  → *A beats B in the pooled table*.  

  **Stratified Tables**:  
  - **Mild cases**:  
    - A: 720 / 900 = 80%  
    - B: 90 / 100 = 90% → *B beats A*.  
  - **Severe cases**:  
    - A: 30 / 100 = 30%  
    - B: 360 / 900 = 40% → *B beats A*.  
  → *B beats A in every stratum*.  

  **Which to trust? Stratified tables**.  
  **Why?**  
  - Severity (Z) is a *confounder*: It causes both treatment choice and recovery. Failing to adjust for Z allows confounding: B is given to more Severe cases (harder to treat), making it look worse overall.  
  - Treatment assignment is **not random**; doctors select based on severity. The strata adjust for this, revealing B’s true superiority for both severities.  

  **Key feature**: Z is a confounder (common cause of treatment and outcome). If you remove Z’s effect (e.g., randomize treatment), the reversal vanishes. If Z is swapped to a collider (Case 1), the reversal flips.  

  **Pushback from a smart student**:  
  *"Trust the pooled table! The strata are small/non-random."*  
  → Assumes no confounding or that the pooled table reflects causality. But here, severity imbalances create confounding. Reject the assumption that treatment assignment is ignorable.  

  ---  
  **Worksheet Summary**:  
  - **Case 1 (Hiring)**: Trust the pooled table (Z is a collider). Lurking variable: Skill.  
  - **Case 2 (Medical)**: Trust the stratified tables (Z is a confounder). Lurking variable: Disease severity.  
  - **Critical difference**: Whether Z is a collider (Case 1) or confounder (Case 2). Random assignment of treatment (A/B) would resolve both, but it’s absent here.
