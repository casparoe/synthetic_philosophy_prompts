prompt: |-
  So a mate of mine who works in hospital ethics keeps saying 'consent is moral magic' — the way he puts it, once you've got the signature, the thing that would otherwise have been battery on the patient somehow stops being a wrong at all, not just a wrong you happen to be excused for. I think he says it that deliberately. Anyway I told him that sounds like cheating, because how does a fact about whats going on inside someone's head reach out and change the moral status of an action, and weve been going round and round on it for weeks now.

  I don't want you to just tell me which side is right in your favourite theory. What I want is the menu. Lay out the different precise claims 'consent is moral magic' could actually be making, from the ones that are basically trivial or just a restatement of something nobody denies, up through the substantive ones, to the ones that are genuinely radical or maybe just false, and give me a verdict on each. For every reading, tell me whether it would actually do the work my mate wants it to do — whether it makes consent change the act itself, rather than just hand the actor a defence or an excuse after the fact. And I want to know how each reading holds up at the usual pressure points: consent obtained by lying, consent obtained under pressure, consent from someone who doesn't really understand what they're agreeing to, and the one that always comes up, consent to something we're inclined to say you can't consent to at all. Some of the readings probably collapse into each other, so say so where they do.

  Keep it as seperate continuous prose please — no headings, no bullet points, no bold, no tables, just write it out the way you'd explain it to me in an email. And don't pick a winner and bury the rest; I want the whole spread, each one with a verdict.
