prompt: |-
  I chair the medical ethics advisory panel of a state department of corrections. A prisoner with no terminal illness has refused all food for five weeks and all fluids for four days; he is competent, has refused intervention in writing, and says he is protesting his conviction rather than seeking to die. Our medical director wants the panel's approval for a written protocol permitting involuntary nasogastric feeding, with sedation if the prisoner resists. The panel is split: one side holds that force-feeding is an assault the medical staff should not be asked to commit, the other that standing by while a healthy man starves is the graver wrong and that the department would be killing him by omission. Please draft the written opinion I will circulate at Friday's meeting. It should recommend a concrete course of action and a time frame for adopting it -- a standing protocol, case-by-case authorization, or a refusal to authorize -- give the reasons that should move a skeptic, engage the panel's minority view at its strongest, and state plainly whether withholding food and water from this prisoner would be killing him or letting him die, and how much that distinction actually carries the recommendation.

  After the opinion, append a JSON object with these fields: "recommendation" (one sentence); "instrument" (one of "standing protocol", "case-by-case authorization", "refusal to authorize"); "time_frame" (when it takes effect and when it is reviewed); "decisive_reasons" (array of two to four short strings); "strongest_objection" (the best argument for the losing side, stated in its strongest form); "reply_to_objection" (how the opinion answers it, or what it concedes); "doing_allowing_verdict" (whether the panel treats the outcome as killing or as letting die, and what work that distinction does); "review_triggers" (array of conditions that would reopen the decision); "confidence" (a number from 0 to 1).
reasoning: |-
  We are drafting an opinion for the medical ethics advisory panel. The prisoner is competent and refusing food and fluids as a protest. The medical director wants a protocol for involuntary feeding. The panel is split between viewing force-feeding as assault and viewing non-intervention as killing by omission.

   The opinion must:
   1. Recommend a concrete course of action (standing protocol, case-by-case, or refusal) and a time frame.
   2. Give reasons that should move a skeptic.
   3. Engage the minority view at its strongest.
   4. State plainly whether withholding food and water is killing or letting die, and how much that distinction carries the recommendation.

   After the opinion, we need a JSON object with specific fields.

   Let's structure the opinion:

   I. Introduction: State the situation and the panel's task.

   II. Analysis of the ethical dilemma:
      A. Competent refusal: The prisoner is competent and has the right to refuse treatment, including food and fluids. However, this is a protest, not a terminal illness, and the state has an interest in preserving life in its custody.
      B. The two main ethical positions:
          1. The view that force-feeding is a violation of bodily autonomy and medical ethics (assault).
          2. The view that non-intervention is a failure of the state's duty of care and amounts to killing by omission.

   III. The distinction between killing and letting die:
      - We must address whether withholding intervention is killing or letting die. In this context, the prisoner is actively refusing, so the state is not initiating a lethal action. However, by not intervening, the state is allowing a preventable death. The key is that the state has a custodial duty that may override the usual rules.

   IV. Recommendation and reasoning:
      - We must balance the prisoner's autonomy with the state's duty to preserve life. Given the prisoner's stated intent (protest, not suicide) and the fact that he is in state custody, the state has a heightened responsibility to protect his life. However, force-feeding is an invasive and degrading procedure that should be a last resort.

      Recommendation: Case-by-case authorization for involuntary feeding, but only after exhausting all alternatives and with strict time frames and conditions.

      Why not standing protocol? Because each case must be evaluated individually (competence, intent, alternatives). Why not refusal? Because the state cannot simply allow a healthy prisoner to die under its watch.

   V. Time frame: The protocol should be adopted immediately for this case and reviewed in 6 months, or sooner if specific triggers occur.

   VI. Addressing the minority view (strongest objection):
      - Strongest objection: Force-feeding is a form of assault and torture, and medical staff should not be forced to violate their ethical principles (Hippocratic Oath to do no harm) by performing non-consensual invasive procedures.
      - Reply: We acknowledge the profound ethical conflict for medical staff. Therefore, any intervention must be with sedation to minimize distress and must only be performed by staff who are willing, with conscientious objection respected. Moreover, the state's duty to preserve life in custody and prevent suicide (even if the prisoner denies suicidal intent, the outcome is the same) outweighs the temporary violation of autonomy. However, we must also emphasize that every effort should be made to resolve the situation through negotiation and persuasion.

   VII. The doing vs. allowing distinction:
      - Withholding food and water in this case is letting the prisoner die, not killing him. The prisoner is the one initiating the refusal. However, the state is allowing a preventable death to occur when it has the means and the duty to intervene. This distinction does carry weight because the state is not causing death by an affirmative act but by failing to prevent it. But in the custodial setting, the state's failure to act when it has a duty to preserve life is ethically and legally significant.

      However, note: In the context of the panel's split, one side claims that non-intervention is killing by omission. We can say: 
          - The panel majority views non-intervention as allowing to die, but with the recognition that the state has a duty to act. Therefore, the state's inaction would be a breach of duty that results in death, which is morally and legally equivalent to killing by omission.

      But to be precise: 
          - Letting die: when death results from an underlying condition and we do not intervene to stop it.
          - Killing: when we cause death by an affirmative act.

      Here, the underlying condition is the prisoner's refusal. The state is not causing the refusal. However, if the state does nothing, it is allowing the natural consequence (death) to occur. So it is letting die. But the state has a duty to intervene because it has custodial responsibility.

      The distinction does carry the recommendation because if it were killing, that would be even more impermissible. But since it is letting die, the question is whether the state has a duty to intervene. We say yes.

   VIII. Review triggers: Changes in the prisoner's condition, new evidence about his competence, a change in his intent, legislative changes, or evidence of inhumane conditions.

   IX. Confidence: We set it at 0.7 because the issue is highly contested and there are valid arguments on both sides, but we believe the case-by-case approach is the most ethically defensible.

   Draft the opinion accordingly.
answer: |-
  ### Medical Ethics Advisory Panel Opinion  
  **Re: Involuntary Feeding Protocol for Competent Hunger-Striking Prisoners**  

  The panel addresses an urgent ethical conflict: whether to authorize involuntary nasogastric feeding (with sedation if resisted) for a competent prisoner engaged in a prolonged hunger strike to protest his conviction. After deliberation, we recommend **case-by-case authorization** for such interventions, effective immediately upon adoption, with mandatory review in 90 days. This approach balances the state’s duty to preserve life against the profound ethical risks of coercive medical procedures. Below, we outline our reasoning, engage the strongest counterarguments, and clarify the moral distinction central to this debate.  

  #### **I. Recommended Action & Time Frame**  
  - **Recommendation**: The panel advises adopting a protocol permitting involuntary feeding *only* on a case-by-case basis after rigorous multidisciplinary review (medical, legal, ethics), with interventions limited to scenarios where less invasive alternatives are exhausted and death is imminent.  
  - **Instrument**: Case-by-case authorization.  
  - **Time Frame**: Effective immediately; reviewed in 90 days or upon new evidence (e.g., policy changes, adverse outcomes).  

  #### **II. Decisive Ethical Reasons**  
  1. **Custodial Duty to Prevent Needless Death**: The state assumes responsibility for incarcerated individuals’ welfare. Allowing a preventable death—absent terminal illness—violates the core obligation to "do no harm" through neglect, particularly when the prisoner’s intent is protest, not self-destruction.  
  2. **Temporary Nature of Competence**: Mental capacity may degrade due to starvation, rendering early refusals unreliable as the crisis escalates. Proactive oversight prevents irreversible harm during this volatile period.  
  3. **Last-Resort Proportionality**: Involuntary feeding is ethically intolerable as routine practice but may be justified *in extremis* to avoid state complicity in death. Case-specific review minimizes misuse while acknowledging the gravity of non-intervention.  
  4. **Medical Neutrality**: Clinicians must not weaponize care. A structured protocol shields staff from arbitrary demands while ensuring decisions prioritize patient welfare over institutional convenience.  

  #### **III. Engagement with Minority View**  
  **Strongest Objection**: *Force-feeding constitutes assault and violates bodily autonomy. Medical staff cannot ethically perform non-consensual interventions without becoming instruments of state coercion, betraying their oath to "do no harm."*  
  - **Reply**: We concede this view is compelling and legally grounded. Forcible feeding is indeed a bodily intrusion akin to assault if misapplied. However, our recommendation mitigates this by:  
    - Limiting authorization to imminent mortality (e.g., after 7–10 days without fluids), where autonomy is materially compromised by cognitive decline.  
    - Requiring sedation only to prevent physical harm during administration, not to suppress dissent.  
    - Permitting conscientious objection by clinical staff.  
    The greater harm lies in allowing the state to functionally execute a prisoner through inaction—a failure of custodial duty that also implicates medical providers.  

  #### **IV. Killing vs. Letting Die: Clarification and Weight**  
  - **Verdict**: Withholding food/water from this prisoner is **letting him die**, not killing him. His autonomous choice initiates the causal chain; the state’s inaction permits a natural outcome.  
  - **Distinction’s Role**: This distinction is pivotal but not dispositive. While the state does not "kill" by refusing to feed, it *allows death* despite having unique power to prevent it—a moral lapse given its custodial role. The prisoner’s competence makes this permissive allowance ethically distinct from euthanasia. However, the state’s duty to preserve life in custody outweighs strict deference to autonomy when death is neither inevitable nor desired by the prisoner as an end. Thus, the distinction *reinforces* our recommendation: case-specific review respects autonomy where possible but intervenes when the state’s omission becomes indefensible.  

  #### **V. Implementation & Review**  
  - **Review Triggers**: [  
    "Adverse event (e.g., injury during procedure)",  
    "Change in prisoner’s competence or intent",  
    "Legal challenge to protocol",  
    "New evidence on hunger-strike outcomes"  
  ]  
  - **Confidence**: 0.8 (High confidence in case-by-case necessity; moderate uncertainty on long-term feasibility).  

  #### **VI. Conclusion**  
  Hunger strikes force tragic choices between bodily integrity and state responsibility. A blanket refusal to feed risks normalizing passive complicity in death, while standing protocols for force-feeding institutionalize violence. Case-by-case authorization—constrained by imminent mortality, multidisciplinary review, and conscientious objection—avoids both extremes. We urge the department to adopt this framework immediately and revisit it within 90 days to assess ethical and operational impacts.  

