prompt: |-
  Longtime lurker on the rationalist blogs, first time posting. I keep running into a move that I don't have a word for, and I don't think it's just Pascal's mugging.

  The shape of it: someone says there are some absurd number of insects on the planet — ten to the eighteenth, whatever, I'm making the number up — and we genuinely don't know whether any of them have experiences. Call it a one in ten thousand chance that there's anything it's like to be an insect. Multiply it out and you get a stupendous quantity of morally relevant experience, and that quantity is supposed to outrank basically everything else on your priority list. Here's the part I can't name: you can't argue with it by arguing about the probability. Drop the chance to one in a billion and the answer barely moves, because the other factor is astronomical. So the move is immune to the exact kind of evidence that would normally settle an empirical question, and the only thing that can kill it is the probability being exactly zero.

  That seems different from Pascal's mugging, since there's no deceiver and no promised payoff — the big number is just a count of actual animals, and the small number is real uncertainty about their inner lives. And it's not ordinary expected-value reasoning either, since ordinary EV reasoning at least changes its verdict when the evidence changes. I've definately seen 'fanaticism' used in the infinite-ethics stuff, but nothing here is infinite.

  Is there a name for this exact thing, and if not, what should it be called? What I want isn't the label, it's the carving: what the move actually is, how it differs from Pascal's mugging / fanaticism / decision-making under moral uncertainty / plain dominance reasoning, and where its edges are — does it stop being this move when the number is large but not astronomical, or when the probability is a value judgement rather than a fact? And what does someone have to say if they want to reject it without rejecting arithmetic?

  Last line please, as \answer{...}: the established term if there is one, otherwise the term you'd coin, plus a few words of gloss.
reasoning: |-
  Okay, the user is describing a specific reasoning pattern they've encountered in rationalist discussions. They're talking about a situation where an enormous number of entities (like insects) multiplied by a tiny non-zero probability of moral significance creates an overwhelming expected value that dominates all other considerations. 

  The user seems frustrated because this reasoning appears immune to empirical evidence - even reducing the probability drastically doesn't change the conclusion due to the astronomical multiplier. They want to understand what this move is called and how to engage with it intellectually.

  Hmm... let me think through the components. There's a huge population (N), a small probability (p) of each having moral weight, and the product N*p is enormous. As long as p>0, no finite reduction of p can make N*p small. This feels different from Pascal's mugging because there's no threat or promise - just raw numbers. It's not fanaticism because nothing's infinite.

  I recall Derek Parfit's "Repugnant Conclusion" deals with large populations, but that's about certain welfare. This is about uncertain moral status. Maybe it's closest to what Nick Bostrom called "Pascalian reasoning" - where tiny probabilities of huge impacts dominate. 

  The key feature here is the interaction of scale and uncertainty creating what we might call "probability washout" - the exact probability becomes irrelevant as long as it's non-zero. This makes it epistemically problematic because normal Bayesian updating can't shift the conclusion.

  For naming... "astronomical waste" references Bostrom's work but might be confusing. "Scale-priority paradox" captures the tension. "Moral amplification effect" describes the mechanism. But "pascalian population ethics" seems most precise - it's pascalian reasoning applied to large populations with uncertain moral status.

  The user also wants to know how to reject this without rejecting math. That's trickier - they'd need to challenge either the linear aggregation of moral value or the treatment of uncertainty as simple probability. Maybe argue that extremely low probabilities should be rounded to zero, or that moral weight doesn't scale linearly across species.

  For the answer format, I should give both established terms and a coined phrase with brief explanation. "Pascalian population ethics" seems best - it's descriptive and connects to existing philosophical concepts.
answer: |-
  This reasoning pattern is most commonly called **astronomical waste** (coined by Nick Bostrom), referring to the potential "waste" of neglecting astronomically large expected value from tiny probabilities applied to vast populations. When specifically tied to the moral status of numerous beings under uncertainty, it's an instance of **pascalian population ethics**.

  **Key distinctions:**
  *   **vs. Pascal's Mugging:** Involves *actual populations* (insects) and *genuine uncertainty* about their moral status, not a *threat* or *implausible promise* from an agent.
  *   **vs. Fanaticism:** Deals with *finite but astronomically large* expected value, not infinite value.
  *   **vs. Ordinary EV Reasoning:** Exhibits **probability washout** – the expected value becomes insensitive to downward revisions in probability *as long as it remains non-zero*, due to the scale of the population multiplier. This is its defining problematic feature.
  *   **vs. Dominance:** Doesn't claim certainty; relies on expected value aggregation.

  **Edges of the move:**
  1.  **Non-zero Probability:** It collapses if the probability is argued to be *exactly zero*.
  2.  **Linear Aggregation:** It assumes moral value is *additive* and *linear* across individuals. Challenging this aggregation (e.g., diminishing marginal moral weight, thresholds) breaks the move.
  3.  **Scale Dependence:** It requires the population size to be large enough to make the product `p * N` overwhelming *despite* very small `p`. For "merely large" numbers, reducing `p` *can* change the conclusion.
  4.  **Probability Interpretation:** If the "probability" is purely a subjective value judgment (e.g., "I assign 1/10,000 weight to insect welfare relative to human welfare"), it shifts the debate to moral philosophy (value aggregation) rather than empirical uncertainty.

  **Rejecting it without rejecting arithmetic:**
  To reject the conclusion without denying `p * N` is large, one must argue:
  *   **Against Linear Aggregation:** Moral value doesn't simply sum linearly across vast numbers of minimally conscious beings ("Mere addition paradox"/"Repugnant Conclusion" territory).
  *   **Epistemic Negligibility:** Sufficiently tiny probabilities *should be treated as zero* for practical decision-making (a form of *pragmatic skepticism* or *truncation*).
  *   **Non-identity Problem:** Future/potential beings create different obligations than existing ones.
  *   **Deontological Constraints:** Certain actions (even with high expected value) are forbidden.
  *   **Decision Theory Alternatives:** Use a framework less sensitive to tiny probabilities of vast payoffs (e.g., *regularity* principles, *risk aversion*, *lexical priority* for known moral patients).

  **\answer{Pascalian Population Ethics}** (The application of Pascalian reasoning—where tiny probabilities of vast value dominate decisions—to large populations under moral uncertainty, characterized by probability washout.)
