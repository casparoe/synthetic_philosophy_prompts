answer: |-
  Below is a refined, ready-to-run game design for your 90-minute applied ethics seminar. It targets the inefficacy objection ("Why bother if my individual action doesn't matter?") through experiential learning, followed by debriefing that maps game mechanics to ethical replies. I've structured it for clarity, predictability, and impact.

  ---

  ### **Game Overview**
  - **Objective**: Students experience the inefficacy objection firsthand, then encounter key philosophical replies through gameplay.
  - **Format**: Three rounds (20 mins each) + debrief (30 mins).
  - **Tokens**: Each student starts with 10 tokens (representing resources/utility). Tokens are private (use slips of paper or digital tools like Mentimeter).
  - **Group Size**: 20 undergrads (adjust thresholds if attendance varies).
  - **Key Mechanics**: 
    - **Round 1**: High threshold → Predictable failure → Inefficacy felt.
    - **Round 2**: Uncertain threshold → Quantifying pivotal probability.
    - **Round 3**: Public, sequential contributions + direct benefits → Social and non-pivotal effects.

  ---

  ### **Game Rules & Instructions**
  **Setup (5 mins)**
  - Distribute 10 tokens to each student.
  - Explain: *"In each round, you’ll decide whether to contribute tokens to a collective pot. If the pot meets a threshold, everyone gets a reward. Your goal is to end with as many tokens as possible."*

  #### **Round 1: Predictable Failure (Inefficacy Objection)**
  - **Goal**: Trigger the "why bother?" feeling by making failure inevitable.
  - **Rules**:
    - Each student decides **privately** whether to contribute **1 token**.
    - The pot pays out **only if ≥19 students contribute** (i.e., near-unanimity).
    - If successful: **All students (even non-contributors) gain 2 tokens**.
    - If failed: Contributors lose their token; non-contributors keep theirs.
  - **Predicted Outcome**:  
    Likely 5–12 contributors (humans rarely achieve near-unanimity without coercion). Contributors lose tokens, non-contributors break even. Students feel contributing was "dumb" and futile.
  - **Instructor Script**:  
    *"Decide privately: contribute 1 token or not. The pot succeeds only if almost all of you contribute. Write your choice now."*

  #### **Round 2: Uncertain Threshold (Expected Impact Reply)**
  - **Goal**: Show that uncertainty makes individual actions matter probabilistically.
  - **Rules**:
    - Each student decides **privately** whether to contribute **1 token**.
    - Threshold is **randomly drawn after decisions** (from 15–19, inclusive; uniform probability).
    - Payout: Same as Round 1 (all gain 2 tokens if threshold met).
    - **Critical add-on**: Before revealing results, students **write their estimate** (0–100%) of the chance their contribution was pivotal (i.e., if without it, contributions < threshold; with it, ≥ threshold).
  - **Predicted Outcome**:  
    Mid-range contributions (e.g., 12–17). Some contributors will be pivotal (if threshold = total contributions). Estimates vs. reality highlight how low-probability pivotal chances still rationalize action.
  - **Instructor Script**:  
    *"Decide privately again. This time, the threshold is hidden—it could be 15, 16, 17, 18, or 19. After you choose, estimate the chance your contribution (if you made one) was pivotal. Write both now."*

  #### **Round 3: Public, Sequential, and Direct Benefits (Multiplier & Non-Pivotal Replies)**
  - **Goal**: Demonstrate social dynamics and non-pivotal benefits of contributing.
  - **Rules**:
    - Contributions are **public and sequential** (e.g., go down the seating chart).
    - Each contribution costs **1 token** but grants **0.1 tokens to every other student** (including non-contributors), regardless of threshold.
    - Threshold = **15 contributors** (achievable). If met, all gain 2 tokens.
    - **Critical add-ons**: 
      - Students see real-time tally as others decide.
      - Direct benefits are paid instantly per contribution (e.g., when Student 3 contributes, all others get 0.1 tokens immediately).
  - **Predicted Outcome**:  
    Higher contributions (likely 15–20) due to social pressure, momentum, and direct benefits. Contributors may net-positive even if threshold fails (e.g., 10 contributors = +0.9 tokens for each from direct effects).
  - **Instructor Script**:  
    *"Now we go in order. When called, state ‘contribute’ or ‘not’ aloud. Each contribution gives 0.1 tokens to everyone else instantly. If ≥15 contribute, all get 2 more tokens. Start recording contributions visibly."*

  ---

  ### **Debrief (30 mins)**
  **Map rounds to ethical replies** (use whiteboard for side-by-side comparison):  
  1. **Round 1 → Inefficacy Objection**:  
     - *Mechanic*: High threshold (19) caused failure; contributors lost tokens for no gain.  
     - *Student Feeling*: "My action was wasted; free-riders won."  
     - *Ethical Reply*: **"What if everyone did that?" (Kantian universalizability)**. If all defect, collective failure is guaranteed. But students saw this doesn’t motivate action when success seems impossible.  

  2. **Round 2 → Expected Marginal Impact**:  
     - *Mechanic*: Uncertainty in threshold meant each contribution had a >0% chance of being pivotal.  
     - *Student Feeling*: "I might be the one who tips it!" (even if probability was low).  
     - *Ethical Reply*: **Expected utility justifies action** (e.g., 5% chance of being pivotal × 40 token collective gain = +2 expected tokens > 1 token cost).  

  3. **Round 3 → Direct/Social Effects & Group Identity**:  
     - *Mechanics*:  
       - Direct benefits (0.1 tokens per contribution) → **Non-pivotal positive impact** (your steak boycott still reduces demand marginally; your vote inspires others).  
       - Public sequencing → **Social multiplier** (visibility encourages copycat behavior; builds momentum).  
     - *Ethical Reply*: **Actions matter beyond causality**—e.g., participating in a moral community (Aristotelian virtue) or leveraging network effects (social movements).  

  **Discussion Questions**:  
  - *"Which reply felt most persuasive in the game? Which works best in real life (e.g., voting, climate)?"*  
  - *"Did Round 3’s social/direct effects change your behavior? How does this apply to ethical consumption?"*  
  - *"When does inefficacy justify inaction? When doesn’t it?"*  

  **Conclusion**: Acknowledge that no reply "solves" inefficacy perfectly, but together they rebut defeatism. Assign reflection: *"Which reply would you bet on for climate action? Why?"*

  ---

  ### **Predictable Problems & Fixes**
  1. **Problem**: Round 1 succeeds (e.g., 19+ contribute by luck).  
     - **Fix**: Set threshold at **20/20** (impossible if anyone defects). Use anonymity to reduce guilt-driven unanimity. If it still succeeds, emphasize: *"This is rare! Note non-contributors profited more—would you contribute next time?"*  

  2. **Problem**: Round 2 pivotal estimates are chaotic (e.g., students guess poorly).  
     - **Fix**: **Simplify estimation**: *"On a scale of 1–5, how pivotal was your contribution?"* Calculate real pivotality post-game (e.g., *"Threshold was 16. Total was 16. All 16 contributors were pivotal!"*).  

  3. **Problem**: Round 3 contributions stall early (e.g., first 5 defect, killing momentum).  
     - **Fix**: Seed optimism—**start with a known contributor** (e.g., a student who contributed in Round 2). If contributions lag, remind: *"Remember, even if we fail, every contribution helps others a little."*  

  4. **Logistical Hiccups**: 
     - **Token tracking**: Use a spreadsheet/projector for real-time math.  
     - **Time limits**: Use a timer (5 mins/decision phase).  
     - **Dominant players**: Enforce private decisions (Rounds 1–2) and no cross-talk.  

  ---

  ### **What the Game Can’t Simulate (Must Explain Yourself)**
  - **Scale Effects**: In real life (e.g., climate change), groups are **millions/billions**, making pivotal probabilities infinitesimal. The game’s 20-person groups inflate perceived efficacy.  
    - *Supply this in debrief*: *"In massive groups, Round 2’s ‘expected impact’ shrinks to near-zero. But Round 3’s network effects may scale better (e.g., social media activism)."*  
  - **Psychological Nuances**: Real-world inefficacy involves **apathy, guilt, or ideological resistance**. The game can’t replicate emotional burnout.  
    - *Supply this*: *"Ethics isn’t just about logic—inaction often stems from helplessness, not calculation. Movements address this with community (Round 3’s group identity)."*  
  - **Long-Term vs. One-Off**: Climate/voting are **iterated games**; the game is single-round.  
    - *Supply this*: *"Repeated actions build norms over time (e.g., veganism). One-off contributions matter less."*

  ---

  This design minimizes lecture, maximizes experiential learning, and forces confrontation with inefficacy. Students leave having *felt* the objection and tested replies—priming deeper debate about ethical agency in collective dilemmas. Run it as-is, and adjust thresholds if needed for your group size!
