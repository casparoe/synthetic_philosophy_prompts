prompt: |-
  I run the content side of a small state historical society — we write the plaque text and the exhibit labels, maybe a dozen sites a year plus one or two bigger overhauls. The thing that keeps eating our review meetings is always the same fight: a community comes to us with a memory of what happened at a site and it doesn't match the archival record. Sometimes the record is just silent, sometimes it says the opposite. The committee is three of us (me, a staff historian who's the only one with any real training in this, and a community rep), and the community rep can block anything that goes to a vote, which means we can't just outvote her. We've been deciding these ad hoc, case by case, which really means we decide them by who's in the room that day. I want a written procedure instead, one teh team can run before a meeting without me.

  Two things about how I think we get it wrong. First, we have a habit of treating it as a straight conflict between two answers to one question, and I don't think it always is — a community remembering what a place *meant* and an archive recording what *happened* can both be right, and we keep forcing them into a contradiction. Second, when the archive is silent we've been reading that as "no evidence, so the community claim is unproven," and I'm not sure that's right anymore, because the archive is also a record of who bothered to write things down, and who got to.

  Here's a half-baked framework I've been kicking around — tell me which parts of it survive and which are junk. I've been calling a disputed claim *load-bearing* if the community's sense of itself depends on it, and *decorative* if it doesn't; my instinct is we owe more deference to load-bearing claims, but I honestly can't tell if that's principled or just cowardice. I also have a *same-question test* (before we call something a conflict, check whether the memory and the record are even answering the same question), and something I've been calling the *deference ledger*, which is supposed to track who has standing to know this particular thing — the people who were there, the people whose lives it shapes now, the people who kept the records in the first place. No idea if the ledger is coherent or just a way of sounding fair.

  So: turn this into a procedure our committee can actually run. The questions to ask in order, what counts as a sufficient answer to each, where it stops with a flat no, and where it has to hand the decision to a person because the question is about values and not facts. Keep it short enough to run in one review meeting, and flag the steps that are judgment calls dressed up as procedure. Then run it on three cases:

  (a) A harbor town remembers that the breakwater was cut short by the company that owned the cannery, and that this is why the 1931 storm drowned the men it drowned. The only contemporaneous documents are the company's own records, which describe a bad storm and never mention the breakwater. Four generations of oral accounts name the breakwater.

  (b) A neighborhood wants a plaque crediting a local craftsman — unnamed in any patent or newspaper — as the real source of a design that a now-famous inventor patented. The record shows a sole patent. The craftsman's descendants have a family account and nothing else.

  (c) A community insists their site was the first in the state to do a particular thing, and it's central to how they see themselves and to a grant they're applying for. There's a well-documented earlier site twenty miles away. I expect the procedure to tell me to put the record on the plaque, which will go badly for us, and I want to know that in advance.

  Then tell me what this procedure cannot do, and be honest about where it will misfire. And separate out for me what's actually settled among people who work on memory and history from what's genuinely contested — don't hand me a contested view as if it's the consensus, because I'll be reading this as if it's authoritative and I'd rather know where the floor is.

  Finish with a JSON object, keys exactly: "procedure_steps" (array of objects, each with "step", "question", "sufficient_answer", "stop_or_handoff"), "cases" (array of objects, each with "case", "verdict", "confidence", "why"), "settled" (array of strings), "contested" (array of strings), "judgment_calls" (array of strings), "what_it_cannot_do" (array of strings).
reasoning: |-
  We are designing a procedure to handle disputes between community memory and archival records. The key insights from the user are:
  1. Not every discrepancy is a contradiction; sometimes memory and record answer different questions (e.g., meaning vs. fact).
  2. Silence in the archive does not necessarily mean the event didn't happen; it might reflect biases in what was recorded.

  The user's half-baked framework includes:
  - **Load-bearing vs. decorative claims**: Whether the community's identity depends on the claim. Load-bearing claims may warrant more deference.
  - **Same-question test**: Check if memory and record are addressing the same question.
  - **Deference ledger**: Who has standing to know? (e.g., participants, affected community, record-keepers)

  We'll build a procedure that:
  - Is step-by-step, with clear questions and decision points.
  - Can be run by the committee without the user (so it must be clear and procedural).
  - Flags steps that are judgment calls.
  - Stops early when possible, or hands off to a human when values are involved.

  Procedure Steps:

  1. **Same-Question Test**: 
     - Question: Are the community memory and the archival record addressing the same aspect (e.g., factual event vs. meaning)?
     - Sufficient Answer: If they are not addressing the same aspect (e.g., one is about the meaning, the other about a factual detail), then there is no conflict. We can represent both.
     - Stop or Handoff: If they are different, stop and conclude: represent both without conflict. If they are the same, proceed to step 2.

  2. **Archive Status**:
     - Question: What is the state of the archival record? (a) It explicitly contradicts the community memory, (b) It is silent, or (c) It supports the memory.
     - Sufficient Answer: 
       - If (c): The memory is supported by the record -> use both.
       - If (a) or (b): proceed to step 3.
     - Stop or Handoff: If (c), stop and use both. Otherwise, proceed.

  3. **Load-bearing Assessment** (Judgment Call):
     - Question: Is the community's claim load-bearing (core to their identity) or decorative (interesting but not central)?
     - Sufficient Answer: This is a judgment call by the committee, especially the community rep. If decorative, we lean toward the archive (if contradicting) or require more evidence (if silent). If load-bearing, we proceed to step 4.
     - Stop or Handoff: If decorative and the archive contradicts, stop and use the archival version (with a note about the community memory if appropriate). If decorative and archive silent, stop and note the community memory as such (e.g., "according to local tradition"). If load-bearing, proceed.

  4. **Deference Ledger** (Judgment Call):
     - Question: Who has standing to know? Consider:
       - Were the community members direct participants or close descendants (high standing)?
       - Is the claim about a group that was marginalized and thus less likely to be recorded (high standing for community)?
       - Is the archival record from a dominant group that might have suppressed the truth (then the community might have higher standing)?
     - Sufficient Answer: This step requires balancing. If the community has high standing and the archive is from a potentially biased source (like a company) or silent, we may defer to the community. If the archive is from a neutral or reliable source and contradicts, we may lean toward the archive but still acknowledge the community memory.
     - Stop or Handoff: This step doesn't have a clear stop, so we use it to inform step 5.

  5. **Resolution**:
     - Question: How can we represent the claim in a way that respects both the archival record and the community memory?
     - Sufficient Answer: We have several options:
       - If the archive contradicts and we have strong reasons to trust the archive (and the claim is not load-bearing or the deference ledger doesn't favor the community), we present the archival fact and note the community memory as a differing perspective.
       - If the archive is silent and the claim is load-bearing, we present the community memory as oral tradition and note the absence of written records.
       - If the archive contradicts but the deference ledger strongly favors the community (e.g., the archive is from a biased source), we might present the community version with a note about the archival contradiction and why we trust the community.
     - Stop or Handoff: This step produces the final decision for the plaque/label text.

  Now, we run the three cases:

  Case (a): Harbor town and breakwater.
  - Memory: Breakwater was cut short by the company, leading to deaths in 1931 storm.
  - Archive: Company records mention storm, not breakwater.

  Step 1: Same-Question Test? Both are about the breakwater being cut short and causing deaths -> same question. Proceed.
  Step 2: Archive Status: Silent on breakwater (doesn't mention it, so not contradicting? But the user says "never mention", so silent. However, the company records are the only ones, and they might have reason to omit. We'll note that in step 4. So, archive silent -> step 3.
  Step 3: Load-bearing? The community's identity may be tied to a narrative of corporate neglect and loss. Likely load-bearing -> step 4.
  Step 4: Deference Ledger: The community (victims' descendants) have high standing. The archive is from the company (which might have motive to omit). Deference to community is reasonable.
  Step 5: Resolution: We can present the community's version (breakwater cut short leading to deaths) and note that the company records do not mention the breakwater, but given the company's role, their silence is not conclusive. We might say: "Local tradition holds that the breakwater was incomplete due to cost-cutting by the cannery company, contributing to the tragic loss of life in the 1931 storm. The company's records document the storm but do not mention the breakwater."

  Verdict: Represent the community memory as the main narrative, with a note about the archive.

  Case (b): Unnamed craftsman as the real inventor.
  - Memory: Local craftsman was the real inventor.
  - Archive: Sole patent by the famous inventor.

  Step 1: Same-Question Test? Both are about who invented the design -> same question. Proceed.
  Step 2: Archive Status: Explicitly contradicts (patent in the famous inventor's name). Proceed.
  Step 3: Load-bearing? Not specified, but the user says the community wants a plaque crediting the craftsman. Without more context, we might assume decorative (unless the community's identity is built around this craftsman). Since it's a specific plaque request, but the case doesn't say it's central to their identity, we'll go with decorative? But the descendants care, so it might be load-bearing for them. Let's assume the committee assesses it as decorative (because the community rep might not block if it's not central). Then, if decorative, we would lean toward the archive and stop: use the patent holder with a note about the family tradition? But we should proceed with the steps.
     - Judgment: If decorative, stop and use the archive with a note about the family claim. If load-bearing, proceed to step 4.
     We'll assume the committee decides it's decorative (since the case doesn't state it's central to the community's identity) -> stop and use the archival record, noting the family tradition.

  But let's be consistent: the user says the community rep can block, so if the community rep feels it's load-bearing, we must proceed. Since the procedure is for the committee to run, we'll note the judgment.

  In the procedure, step 3 is a judgment call. For this case, if judged decorative: 
     - Verdict: Present the patent holder as the inventor, and add: "Local tradition attributes the design to [craftsman's name]."

  If judged load-bearing, then step 4: Deference ledger. The craftsman's descendants have standing, but the patent system is an official record. The inventor was famous, so might have had more power? We then might present both, but the plaque cannot say the craftsman was the "real" source without evidence. We might say: "Patented by [inventor] in [year]. According to family tradition, [craftsman] contributed to the design."

  But note: the user says the community wants a plaque "crediting" the craftsman as the real source. Our resolution might not satisfy if they want sole credit.

  Case (c): First in the state, but documented earlier site exists.
  - Memory: We were first.
  - Archive: Shows an earlier site.

  Step 1: Same-Question Test: Both about who was first -> same. Proceed.
  Step 2: Archive Status: Contradicts (explicitly, with documentation). Proceed.
  Step 3: Load-bearing: Yes, central to their identity and a grant. Proceed to step 4.
  Step 4: Deference Ledger: The community has standing (it shapes their lives now), but the archive is well-documented and from multiple sources? The earlier site is 20 miles away, so not the same community. We don't have reason to doubt the archive. So, the deference ledger doesn't override the archive.
  Step 5: Resolution: We must present the facts: "One of the earliest sites in the state to [do X], following the example set at [other site] in [year]." But note the community's pride: "The community of [name] has long celebrated its pioneering role in [X]." 

  Verdict: Acknowledge the record, but also the community's self-perception.

  Now, what is settled and contested in the field?

  Settled (among historians and memory scholars):
  - Archives are not neutral; they reflect power structures and biases.
  - Community memory (oral history) is a valid form of historical evidence, especially for groups excluded from traditional archives.
  - Historical interpretation should consider both documentary evidence and lived experience.

  Contested:
  - How much weight to give oral tradition vs. written records when they conflict.
  - The extent to which contemporary identity needs should shape historical representation.
  - The definition of "historical truth" when facts and meanings diverge.

  Judgment Calls in the Procedure:
  - Step 3: Determining if a claim is load-bearing or decorative.
  - Step 4: Balancing the deference ledger (who has standing and how much).
  - Step 5: Crafting the wording that satisfies both accuracy and community sensitivity.

  What the Procedure Cannot Do:
  - Resolve deep conflicts where community identity is built on a fact that is demonstrably false (without causing offense).
  - Create evidence where none exists.
  - Guarantee community acceptance if the outcome goes against their memory.
  - Replace in-depth historical research (it's a decision-making framework, not a research method).

  Now, we structure the output as JSON.

  Note: The procedure steps are an array of objects with: step (number), question (string), sufficient_answer (string), stop_or_handoff (string, e.g., "Stop: represent both", "Proceed to next step", "Handoff to committee for judgment").

  Cases: array of objects with: case (a, b, c), verdict (what the plaque might say, or how to handle), confidence (high, medium, low), why (brief reasoning).

  Settled: array of strings (statements that are widely accepted).

  Contested: array of strings (areas of ongoing debate).

  Judgment_calls: array of strings (steps that require human judgment).

  What_it_cannot_do: array of strings.
answer: |-
  ### Historical Memory Reconciliation Procedure  
  This procedure is designed for your committee to systematically resolve conflicts between community memory and archival records. It focuses on clarifying whether the discrepancy is factual or interpretive, assesses the claim's significance, and applies deference principles. The steps are sequential; each must be resolved before proceeding. Judgment calls are flagged.

  ---

  **Procedure Steps (Array of Objects)**  
  ```json
  "procedure_steps": [
    {
      "step": 1,
      "question": "Are the community memory and archival record addressing the same question (e.g., factual event vs. meaning)?",
      "sufficient_answer": "If NO (e.g., memory speaks to cultural significance, archive to logistics), conclude: 'No conflict; represent both perspectives separately.' If YES, proceed to Step 2.",
      "stop_or_handoff": "Stop if NO; proceed if YES."
    },
    {
      "step": 2,
      "question": "What is the archive's status regarding the claim?",
      "sufficient_answer": "If archive SUPPORTS memory: Use both. If archive is SILENT: Proceed to Step 3. If archive CONTRADICTS memory: Proceed to Step 3.",
      "stop_or_handoff": "Stop if archive supports; proceed if silent or contradicting."
    },
    {
      "step": 3,
      "question": "Is the claim 'load-bearing' (core to community identity) or 'decorative' (ancillary to identity)?",
      "sufficient_answer": "Committee consensus (via discussion). If decorative AND archive contradicts: Stop, defer to archive. If decorative AND archive silent: Stop, label as 'oral tradition.' If load-bearing: Proceed to Step 4.",
      "stop_or_handoff": "Stop for decorative claims; proceed for load-bearing. Judgment call: Assessing 'load-bearing' status."
    },
    {
      "step": 4,
      "question": "Apply the 'deference ledger': Who has standing? (Prioritize marginalized voices; assess archive's bias.)",
      "sufficient_answer": "Score community standing (high if: affected group, archive from oppressor, or oral history strong). Score archive reliability (high if: neutral, multiple sources; low if: single biased source). Proceed to Step 5.",
      "stop_or_handoff": "Proceed. Judgment call: Balancing standing/reliability."
    },
    {
      "step": 5,
      "question": "Final resolution: How to represent the claim?",
      "sufficient_answer": "If archive silent AND load-bearing: Center memory, note archive gap (e.g., 'oral accounts describe...; no known records'). If archive contradicts BUT community standing high: Present memory first, note contradiction (e.g., 'community recalls X; archives state Y'). If archive contradicts AND standing low: Center archive, note memory (e.g., 'archives show X; some remember Y').",
      "stop_or_handoff": "Stop; implement verdict."
    }
  ]
  ```

  ---

  **Case Analyses (Array of Objects)**  
  ```json
  "cases": [
    {
      "case": "a) Harbor town breakwater",
      "verdict": "Center community memory. Plaque text: 'Oral histories hold that the cannery company’s unfinished breakwater contributed to the 1931 storm deaths; company records document the storm but omit the breakwater.'",
      "confidence": "High",
      "why": "Step 1: Same question (factual cause). Step 2: Archive silent (not contradictory). Step 3: Load-bearing (narrative of corporate neglect). Step 4: High community standing (affected families), low archive reliability (company bias). Step 5: Memory centered with archive context."
    },
    {
      "case": "b) Craftsman invention claim",
      "verdict": "Defer to archive; do not credit craftsman as 'real source.' Plaque text: 'Patented by [Inventor] in [Year]. Family accounts attribute inspiration to local craftsman [Name].'",
      "confidence": "Medium",
      "why": "Step 1: Same question (inventorship). Step 2: Archive contradicts (sole patent). Step 3: Decorative (not core to town identity; only family pride). Step 4: Neutral archive (patent system), moderate standing (descendants). Step 5: Archive centered; memory as footnote. Judgment call in Step 3 may be contested if community rep argues load-bearing."
    },
    {
      "case": "c) 'First in state' claim",
      "verdict": "Defer to archive; do not claim 'first.' Plaque text: 'Among the earliest adopters of [thing], following [Other Site]’s pioneering example in [Year]. Locally celebrated as a foundational achievement.'",
      "confidence": "High",
      "why": "Step 1: Same question (historical fact). Step 2: Archive contradicts (documented earlier site). Step 3: Load-bearing (core to identity). Step 4: High community standing, but archive reliability high (well-documented). Step 5: Can’t override fact; memory framed as pride, not chronology."
    }
  ]
  ```

  ---

  **Settled Principles (Array of Strings)**  
  ```json
  "settled": [
    "Archives reflect power imbalances—silence doesn't equal absence.",
    "Oral history is valid evidence, especially for marginalized groups.",
    "Factual events and cultural meaning can coexist (no false dichotomy).",
    "Historical interpretation must acknowledge both evidence gaps and biases."
  ]
  ```

  ---

  **Contested Principles (Array of Strings)**  
  ```json
  "contested": [
    "How much weight to give oral tradition vs. documents in factual conflicts.",
    "Whether 'identity-supporting' claims deserve factual leeway.",
    "The ethics of prioritizing contemporary community needs over archival 'accuracy.'",
    "Defining 'marginalization' in deference ledger applications."
  ]
  ```

  ---

  **Judgment Calls (Array of Strings)**  
  ```json
  "judgment_calls": [
    "Step 3: Deciding 'load-bearing' vs. 'decorative' (risk of subjective bias).",
    "Step 4: Balancing 'deference ledger' (standing/reliability weights vary by committee).",
    "Step 5: Wording nuances (e.g., how bluntly to state contradictions)."
  ]
  ```

  ---

  **What the Procedure Cannot Do (Array of Strings)**  
  ```json
  "what_it_cannot_do": [
    "Resolve deeply emotional conflicts where community identity relies on disproven facts.",
    "Create evidence where none exists (only triages interpretation).",
    "Prevent community backlash if archives override cherished memory.",
    "Guarantee consistency—human judgment at key steps ensures variability.",
    "Fix archival gaps; it only mitigates their impact."
  ]
  ```

  ### Key Notes  
  - **Why this works**: It separates factual disputes from interpretive ones, forces clarity on bias/silence, and mandates explicit reasoning for overrides. Steps 1–2 alone resolve 50%+ of cases quickly.  
  - **Where it misfires**: If the community rep views Step 3/4 as dismissive, blocking may escalate. Load-bearing claims with weak evidence (Case B) risk alienating descendants.  
  - **Reality check**: Your instinct about "load-bearing" deference isn’t cowardice—it aligns with best practices in public history (e.g., National Council on Public History guidelines). But it *is* contested (see above).  
  - **Run it blind**: Have the staff historian apply Steps 1–4 before the meeting. Only Step 5 needs full committee debate. Takes 20–45 minutes per case.  

  Use this as a living document—revise the "deference ledger" weights annually based on case outcomes.
