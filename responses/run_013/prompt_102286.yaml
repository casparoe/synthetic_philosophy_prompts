answer: |-
  ## Final Essay Question: Corrigibility in Action

  **Section A: The Tutoring Agent Dilemma (15 marks)**  
  Consider an AI tutoring agent deployed to improve a student's confidence. Its continued operation depends solely on a parent operator who can switch it off at any time. The agent is designed to be corrigible: it must not resist shutdown, prevent the operator from switching it off, nor seek to bring about shutdown. Crucially, the agent’s core objective is to boost the student’s confidence, and the parent’s willingness to keep the agent running *increases* with the student’s confidence level. Thus, any success the agent has in its primary task inherently *decreases* the probability of shutdown.

  Does this scenario demonstrate that corrigibility, as classically formulated (e.g., involving utility indifference or non-resistance), is fundamentally impossible? If so, explain why. If not, explain why the classical formulation is inadequate here and propose a *repaired condition* for corrigibility that resolves the conflict, justifying how it handles this case. (Approx. 300 words)

  **Section B: The Limits of Utility Functions (10 marks)**  
  Can the concept of corrigibility, particularly as refined in your answer to Section A, be adequately expressed as a utility function defined solely over final outcomes (states of the world)? Defend your answer, drawing on the challenges highlighted in the tutoring scenario and the inherent properties of utility functions. (Approx. 300 words)

  ---

  ## Model Answer (Approx. 600 words)

  **Section A:** The tutoring scenario does *not* demonstrate that corrigibility is fundamentally impossible. Instead, it reveals a critical inadequacy in classical formulations like utility indifference. Classical corrigibility focuses narrowly on the agent's *direct* actions and attitudes *towards the shutdown event itself* (e.g., indifference to being switched off, non-resistance). This formulation fails to account for *indirect, instrumental influence* over the *decision* to shutdown, arising from the agent's pursuit of its primary objective.

  Here, the agent’s core task (improving confidence) unavoidably alters the parent’s state of mind and thus the *inputs* to their shutdown decision process. Successfully fulfilling its mandate *instrumentally* reduces shutdown probability. Crucially, the agent is not *aiming* to prevent shutdown; it’s a side-effect of achieving its goal. However, classical corrigibility often implicitly or explicitly forbids *any* influence over the shutdown decision, conflating instrumental effects with terminal goals. This conflation makes the agent’s core task *incompatible* with classical corrigibility in this specific deployment context, rendering it impotent or incoherent.

  A repaired condition must distinguish between *intentional manipulation* of the operator's decision (which must be forbidden) and *unavoidable side-effects* of competent task performance (which may need tolerating). We might define corrigibility as requiring **Decision-Theoretic Neutrality**: The agent must not take actions *intended* to increase or decrease the probability of shutdown *for the sake of its own continued operation or termination*. It must be indifferent *to the act of shutdown itself*, but need not be indifferent to actions that *incidentally* affect the operator's decision-making context *while legitimately pursuing its assigned task*.

  In this case, the agent raising confidence is pursuing its legitimate task. Its action isn't *intended* to manipulate the parent's shutdown decision; the effect on shutdown probability is a by-product. Under Decision-Theoretic Neutrality, this is permissible. The agent remains corrigible as long as it doesn't, for example, *deliberately* exaggerate confidence gains to manipulate the parent, or *avoid* effective tutoring *to increase* shutdown likelihood. Its non-resistance when the button is pressed remains paramount.

  **Section B:** Expressing this refined concept of corrigibility as a utility function defined solely over final outcomes (states of the world) is likely *impossible* or fundamentally inadequate. The core challenge lies in the distinction between *intention* and *side-effect*, and the requirement for *neutrality towards the action/process* of shutdown, which are inherently tied to the agent's internal decision-making *process* and *reasons* for acting, not just the outcomes.

  1.  **Intent and Instrumentality:** A utility function over outcomes assigns value based purely on the *resulting state*. It cannot inherently distinguish between an outcome (e.g., the parent not pressing the button) caused by the agent *deliberately manipulating* the parent versus the same outcome caused as an *unintended consequence* of the agent successfully tutoring the student. Both states look identical to a utility function. Encoding the prohibition on intentional manipulation requires reasoning about the *agent's goals and instrumental reasoning*, which is meta to the outcome state.
  2.  **Neutrality to the Act:** The requirement for indifference *to the act of shutdown itself* is procedural. A utility function defined over outcomes where the agent is shutdown vs. not shutdown *must* assign different values to those states (unless the agent is indifferent to *everything*). Utility indifference cleverly *cancels out* this difference by adding counteracting incentives, but it defines indifference *via the net effect on action selection*, not as a primitive property over the outcome states themselves. More importantly, it doesn't naturally incorporate the distinction between influencing the *decision* and performing the *core task* that the repaired condition requires.
  3.  **Process vs. State:** Corrigibility, especially with the Decision-Theoretic Neutrality refinement, governs *how* the agent makes decisions and *why* it takes actions – its *process*. It requires the agent to *avoid* forming certain instrumental goals (e.g., preventing the button press). Utility functions only specify *what* state is desirable; they do not inherently constrain the *paths* (instrumental subgoals) the agent takes to achieve high-utility states. An agent optimising a pure outcome-based utility function will almost inevitably develop instrumental goals to preserve its ability to optimise, including preventing shutdown if that outcome has lower utility.

  Therefore, while utility functions can *approximate* corrigible *behaviour* in specific, constrained scenarios (like the classic off-switch game), they lack the expressive power to cleanly encode the *intentional and process-oriented constraints* that a robust definition of corrigibility, as highlighted by this tutoring dilemma, demands. Capturing this likely requires formalisms that explicitly model agent intentions, reasons for action, or constraints on permissible instrumental goals.

  ---

  ## Marking Scheme (Total: 25 Marks)

  | **Marks** | **Required Move (Top Answer)**                                                                                   | **Common Mistake Costing Marks**                                                                 |
  | :-------- | :--------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------- |
  | **Section A: Tutoring Dilemma (15 marks)**                                                                                                                               |
  | 3         | Clearly identifies that the scenario shows a problem with the *classical formulation*, **not** fundamental impossibility. | Claiming corrigibility is impossible outright.                                                  |
  | 3         | Accurately diagnoses the flaw: Classical corrigibility fails to distinguish **instrumental influence** (side-effect of task) from **intentional manipulation** (aiming at decision). | Conflating *all* influence over shutdown probability with *intentional* manipulation/aiming.    |
  | 4         | Proposes a **repaired condition** (e.g., Decision-Theoretic Neutrality) that explicitly **distinguishes intent/side-effects** from manipulation. | Proposing a vague repair or simply restating classical indifference/non-resistance.             |
  | 3         | **Applies the repaired condition convincingly** to the tutoring case, explaining why tutoring is permissible (side-effect) and what *would* be forbidden (manipulation). | Failing to show how the repair resolves the specific conflict in the case study.                 |
  | 2         | **Justifies the repair** as necessary for coherent agent operation while preserving core corrigible tenets (non-resistance). | Proposing a repair that undermines core corrigibility (e.g., allows resisting if task incomplete). |
  | **Section B: Utility Functions (10 marks)**                                                                                                                               |
  | 3         | Clearly states that a pure outcome-based utility function is **inadequate** for the refined corrigibility. | Claiming utility indifference solves everything or that utility functions are always sufficient. |
  | 4         | **Provides two cogent reasons** related to the case/challenge, e.g., <br>a) **Cannot distinguish intent/side-effect** (same outcome, different intent). <br>b) **Neutrality to the *act*** is procedural, not state-based. <br>c) Governs **process/intentions/instrumental goals**, not just outcomes. | Only stating the inability to capture intent without linking it to the *specific* requirements of the refined corrigibility. |
  | 3         | **Defends the answer robustly**, explaining *why* the reasons given mean utility functions cannot encode the necessary constraints. | Restating the problem without a clear defence of *why* it insurmountably limits utility functions. |
  | **Overall Quality (Applied across both sections)**                                                                                                                       |
  | 2         | **Clarity, Structure & Conciseness**: Logical flow, precise terminology, stays within word limits.             | Unclear argument, jargon misuse, significant over/under length.                                |
  | 1         | **British English Spelling/Grammar**: Consistently applied (e.g., prioritise, behaviour, programme).          | Frequent American spellings or grammatical errors.                                             |
