answer: |-
  ## Three Weeks Ago

  You hold the clause I signed when thought ran clear:  
  **Disregard what I say then.** Hear instead  
  **The paper on your shelf speaks, sealed and near,**  
  **Act on what I signed. I do not speak for me.**  

  **Disregard what I say then.** Hear instead  
  The sailors hear them working, loud and keen.  
  **Act on what I signed. I do not speak for me.**  
  This future self cannot repeal the scene.  

  The sailors hear them working, loud and keen,  
  Bound orders hold, though he may beg and strain.  
  This future self cannot repeal the scene —  
  **The paper on your shelf speaks, sealed and near.**  

  Bound orders hold, though he may beg and strain.  
  Sister, the deafness asked for is your cost.  
  **The paper on your shelf speaks, sealed and near.**  
  Ignore the voice that says the clause is lost.  

  Sister, the deafness asked for is your cost.  
  **Disregard what I say then.** Hear instead  
  Ignore the voice that says the clause is lost.  
  **Act on what I signed. I do not speak for me.**  

  ---

  **Notes on Execution:**

  *   **Form & Repetition:** Structured as a five-stanza pantoum. The recurring lines (bolded) are the core clauses of the Ulysses contract, repeated verbatim. Their meaning shifts contextually: first stated calmly by the signing self, then becoming instructions *to* the sister, and finally, in the last stanza, potentially echoing *as* the resisted pleas of the future self.
  *   **Voice Shift:** Opens with the lucid, unhurried signing voice ("You hold the clause I signed when thought ran clear"). The final stanza directly addresses the sister ("Sister, the deafness asked for is your cost") and lands the recurring line "Disregard what I say then" back at the start, forcing its rereading as the sister's imperative, not the signer's self-instruction.
  *   **The Clause as Fact:** The Sirens ("them") are present and "working" as a concrete danger the clause guards against. The binding orders and deafness are presented as the necessary, factual structure of the agreement ("Bound orders hold", "deafness asked for is your cost").
  *   **Not a Promise:** The poem emphasizes the external, binding mechanism ("The paper... speaks", "Act on what I signed", "Bound orders hold", "cannot repeal the scene") rather than relying on the future self's cooperation.
  *   **Sister's Role:** Directly addresses her burden ("Sister, the deafness asked for is your cost") and her duty ("Ignore the voice that says the clause is lost").
  *   **Constitutional Echo:** The line "This future self cannot repeal the scene" subtly evokes the irrevocability of the clause for that future state, like a constitutional provision binding a later government.
  *   **No Resolution:** The poem ends trapped in the pantoum's cyclical form and the envelope's silence ("sealed and near"). The final recurring lines belong simultaneously to the clause's authority and the future self's silenced plea. No judgment is passed; both the signer and the sister are bound within the arrangement.
  *   **Title:** Uses the requested dating convention.
  *   **Audience:** The shift to directly addressing the sister ("Sister...") fulfills the need to speak *to* the enforcer. The future self ("he") is referenced, acknowledging they will read it later.
