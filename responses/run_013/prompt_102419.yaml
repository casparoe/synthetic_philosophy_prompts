  *refining* The user wants "at least one" on each specified topic, so I'll prioritize those and add others that dig into underdiscussed areas. The arthāpatti question fits—it's another reducibility debate. Abhāva is spicy because modern logic disputes negative truths. 

  Follow-ups must anticipate classic Nyāya replies and counterpush. E.g., if the speaker says "upamāna gives new knowledge," follow up with "but isn't recognition just memory?" 

